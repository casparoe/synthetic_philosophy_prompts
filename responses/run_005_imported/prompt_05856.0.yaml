answer: |-
  Here’s a five-paragraph vignette built around the fire-fuel dynamic and the tetralemma’s four corners, without naming the philosophy or resolving into nihilism:

  ---

  The coals glowed like a last heartbeat in the hearth. Marta jabbed at them with the iron poker, sending up a spray of orange sparks. *He is the wood*, she thought fiercely. She could almost see Tomas’s laugh in the leap of the flames, his stubbornness in the hiss of sap. She fed the fire another split log—*his* log, from the oak he’d felled last spring—as if stacking memories could reassemble him. The room warmed. She touched the armrest of his empty chair: solid, present. *He’s right here*, she told the silence. *The fire is the wood, isn’t it?*

  But the log blackened, shriveled. The flames ate it, consumed it. And Tomas wasn’t in the chair. He wasn’t in the fading photograph on the mantel, nor in the old sweater she’d buried her face in that morning, smelling only wool and dust. Anger flared in her throat. She stabbed the coals again. How could he be *in* these things? The fire wasn’t the wood—it danced *above* it, devouring it, leaving only ash. Tomas wasn’t his pipe on the shelf, or his boots by the door. If he *was* those things, then where had he gone when the breath left him? The fire roared, defiant, separate. *He isn’t here at all*, the cracking embers seemed to snap.

  Exhaustion washed over her. She sank into his chair, the worn leather cold against her neck. *Both*, then? Was he the wood *and* the fire? The body in the hospital bed *and* the man who sang off-key in the shower? She remembered holding his hand as the machines hummed—the warmth fading from his fingers even as she clutched them. Was that him? The flesh cooling, the memories blazing? Her hand, smeared with ash from the poker, trembled. If he was both the wood and the fire, then death was both the ending and… what? The fire still burning elsewhere? The thought felt slippery, impossible to grasp, like smoke.

  She let the fire die. No more logs. Only the deep, pulsing glow of embers in the dark. Not the wood, not the fire, not both. She watched the last light ripple over the coals—dependent, utterly, on what was being consumed, yet not *that* consumption itself. A shape defined by what fed it, but gone when you tried to point. Not separate, not identical. Not both, not neither. Just… this glowing absence where heat had been. Tomas wasn’t his boots, nor some ghostly watcher. He was the space between the chair and her reaching hand, the silence after a shared joke only they understood—a pattern that needed the world to hold it, gone when the conditions changed.

  Dawn greyed the windows. The hearth held only warm ash. Marta shivered, pulling her shawl tight. The cold was real. The ache was real. But the frantic search for Tomas *in* things or *outside* them had quieted, like the settled embers. She wasn’t empty. She was cold, and tired, and alive. She picked up his old wool blanket, rough against her cheek. She wrapped it around herself, the lingering warmth not his, but woven through the threads by years of shared nights. It held no ghost, only the echo of a knot that had tied two lives together. She banked the ashes, preserving the heat that remained. The room would warm again.

  ---

  **How this embeds the philosophy without naming it:**

  1.  **The Tetralemma in Action:**
      *   **Is (Paragraph 1):** She actively tries to see Tomas *as* the physical remnants (wood/fuel) and memories (fire), feeding the fire literally and symbolically.
      *   **Is Not (Paragraph 2):** Anger and despair reject identity. The fire consumes the wood; Tomas isn't *in* his objects. Separation feels absolute.
      *   **Both (Paragraph 3):** Exhaustion leads to the muddled middle ground. Is he body *and* spirit? Wood *and* fire? This proves conceptually unstable ("slippery, impossible to grasp").
      *   **Neither (Paragraph 4):** The active tending stops. She observes the embers *as process*: dependent arising. The "glowing absence" isn't nothingness; it's the visible dependence of the phenomenon (fire) on the fuel being consumed, vanishing when pinned down. Tomas isn't found in any category.

  2.  **Fire-as-Fuel Dynamics:** The physical act of tending the fire *is* the investigation. The fire's behavior (consuming wood, being inseparable from it yet distinct, vanishing without it) directly mirrors the logical progression. You couldn't replace the fire with, say, a flowing river without losing the core logic of consumption, identity, and dependence.

  3.  **Avoiding Nihilism:** The conclusion isn't "nothing matters." It's the opposite: what *is* matters intensely because it's interdependent. Her cold, her ache, the blanket's warmth, the shared echo in the wool – these are real, conditioned phenomena. Tomas's absence is felt *because* their connection was real and interdependent. The act of banking the ashes is practical care for the remaining warmth (interdependence in action), not despair. The "knot" wasn't an illusion; its untying causes pain precisely because it was real.

  4.  **Load-Bearing Metaphysics:** Remove the tetralemma structure, and her emotional journey loses its distinct, four-stage logic. Remove the fire-fuel interdependence, and the central metaphor collapses, making her actions (obsessively feeding, then letting die, then banking ashes) seem arbitrary. The fire *is* the engine of her realization.

  This scene lets the character *grapple* with the logic through a concrete, visceral ritual, arriving at a quiet understanding of interdependence (sunyata) without ever stating it, and grounding that understanding in the persistent reality of relationship and care.
