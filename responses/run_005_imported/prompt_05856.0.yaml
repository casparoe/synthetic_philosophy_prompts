prompt: |-
  I'm about a third of the way into a novel with a minor subplot involving Madhyamaka Buddhism — one of my characters spent years translating Nagarjuna before she got sick — and I keep hitting a wall trying to dramatize the philosophy instead of just having people explain it to each other, which always reads like a term paper with dialogue tags stapled on. The image I can't shake is the fire-and-fuel bit from the Mulamadhyamakakarika, where he uses fire and its fuel as a stand-in for the self and the aggregates that make it up: the self can't just BE the aggregates (same problem as saying the fire is nothing but the wood), but it cant be some seperate thing floating apart from them either, since there's no such thing as fire hovering around with no fuel in it anywhere. That's basically one version of the bigger four-cornered move he pulls throughout that text (is, is not, both, neither — I think this is the "tetralemma" thing, though I might be using that word wrong), where each option gets pushed on until it gives way.

  Could you take a crack at a short story built around that, maybe four or five paragraphs? I keep picturing an old woman literally tending a fire, maybe the night before a funeral, running through those same four positions about someone she's lost, or about her own sense of herself, without ever naming Nagarjuna or "emptiness" outright. The one thing I really don't want is the lazy version where it all resolves into "nothing is real, nothing matters" — that's not actually what he's arguing and it's the first thing every draft of mine accidentally turns into. I want the logic to be load-bearing in the scene itself, so that if you pulled the metaphysics back out, the story would collapse along with it. Change literally anything about the setup, era, character, whether it's even fire, if you've got a better vessel for it — I mainly just want to see someone else's version of this before I commit to mine.
