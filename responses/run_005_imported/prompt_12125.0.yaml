answer: |-
  Here's a joke crafted for the fitting-attitudes crowd, turning on the WKR problem with the evil demon setup. It uses the precise tension between reasons *for value* and reasons *for valuing*:

  ---

  **Dave, a committed buck-passer, was cornered by an Evil Demon at a philosophy conference coffee break.**  
  **The Demon hissed:** *"You must GENUINELY value this ordinary pebble I found in the car park. Not just act like it! Truly believe it’s good-in-itself! Do this, or I’ll subject you to 1,000 years of non-stop accordion polka."*  

  **Dave paled. He stared at the pebble. He tried to summon reasons for its intrinsic goodness – its dull hue? Its mundane shape? Its utter lack of function? Nothing fit. Sweating, he concentrated harder, attempting to *make* himself desire the pebble’s goodness... but failed. The accordion polka began.**  

  **As the first torturous notes squeezed out, Dave’s colleague groaned from the floor where she’d collapsed in sympathetic despair:**  
  *"Dave, you idiot! The demon’s threat isn’t a reason the PEBBLE is GOOD! It’s just a really, really persuasive incentive to WANT it to be good! That’s the WRONG KIND OF REASON!"*  

  ---

  **Why it works for the FA/WKR literature:**  
  1. **Faithful Setup:** Uses the canonical "evil demon forces you to value something worthless" WKR scenario.  
  2. **Precise Failure:** Dave tries (and fails) to find *value-bearing properties* in the pebble (reasons *for* goodness). His struggle highlights the core FA commitment: value isn’t conjured by will alone.  
  3. **The Punchline’s Precision:** The colleague’s exasperated correction explicitly names the distinction:  
     - *"Isn’t a reason the PEBBLE is GOOD"* → Denies it’s a right-kind reason (bearing on the object's value).  
     - *"Just a really persuasive incentive to WANT it to be good"* → Identifies it as a pragmatic, wrong-kind reason (bearing only on the desirability of holding the attitude).  
     - *"WRONG KIND OF REASON!"* → The explicit, shouted jargon lands as the painful (and ironic) revelation.  
  4. **Scholarly Humor:** The colleague’s critique mirrors exactly how FA theorists dismiss WKRs. The absurdity of debating metaethics mid-torture adds levity.  

  **Bonus Nod:** The accordion polka torture is a niche philosopher-horror trope, subtly nodding to the "trolley-adjacent" without being a trolley joke. Let me know if you want it punchier or tweaked for a specific sub-point!
