  Wait, Kripke might retort that the solution isn't metaphysical but practical: we don't need "meaning facts," just social agreement. But the user's unease persists because normativity—the "ought" of rule-following—still lacks grounding. If the community suddenly deviates (say, calls "68+57=5" correct), does that retroactively change what "+" meant? That seems absurd. 

