  The observational equivalence point is tricky. Both sides might agree that any prior difference can be modeled as information difference in some constructed state space, but the anti-CPA side should argue this doesn't make the difference less fundamental. The pro-CPA side would counter that the constructed space reveals hidden informational asymmetries we hadn't accounted for. 

