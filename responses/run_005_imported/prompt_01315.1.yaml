answer: |-
  ## The Admiral and the Comet

  Admiral Lysandra stood on the *Prowler*'s quarterdeck, the Aegean wind whipping strands of iron-grey hair from her severe bun. Below, the fleet lay at anchor, lanterns flickering like captured stars on the ink-black water. Tomorrow, they would sail against the Thessalian League. Victory meant control of the trade lanes; defeat meant ruin.

  Beside her, hunched over a wax tablet illuminated by a single shielded lamp, was Theon, the fleet logician. His fingers traced symbols, his brow furrowed deep enough to hold seawater.

  "It gnaws at me, Admiral," Theon murmured, his voice barely audible over the creak of timbers and the sigh of the sea. "The proposition: 'There will be a sea battle tomorrow.'"

  Lysandra grunted. "We are here. They are there. Battle is inevitable, Theon. The proposition is true."

  "Is it?" Theon looked up, his eyes wide, reflecting the lamplight like an owl's. "Aristotle's ghost haunts me. *If* it is true *today* that the battle happens tomorrow... then its happening is already fixed. Necessary. As fixed as yesterday's sunrise. If it is false today, its *not* happening is equally fixed. Either way..." He gestured helplessly at the bustling deck below, where sailors sharpened blades and checked rigging. "What meaning has *this*? What choice remains?"

  A coldness that had nothing to do with the wind seeped into Lysandra’s bones. She’d felt the weight of command, the burden of contingency – the endless branching paths of "what if." But Theon’s words crystallized it into a terrifying stasis. If tomorrow’s outcome was already written in the stars of truth or falsity today... then her orders, her strategies, the courage of her men – were they just a pantomime playing out a predetermined script? Why sharpen a blade if its use, or disuse, was already sealed?

  Just then, a lookout’s cry shattered the tense silence. "Comet! Starboard bow!"

  Heads snapped up. A streak of icy light, cold and silent, cut across the velvet sky, its tail a faint smear against the constellations. A collective gasp, then murmurs rose from the decks below. "Omen... bad omen..." "The Fates have spoken..." "Doomed..."

  Lysandra saw the paralysis begin to set in. Men paused in their work, staring skyward, shoulders slumping. The fatalism Theon had voiced in abstract logic now wore the terrifying face of celestial prophecy. If the comet signified defeat, and defeat was *already true*... why prepare? Why fight?

  Theon paled. "See, Admiral? The sign... it makes the truth *visible*. If the battle is lost, it is *already* true that it is lost. What can we do?"

  Lysandra looked from the despairing men to the fading comet, then down at her own hands – calloused, scarred, hands that had held tillers, drawn swords, signed orders that sent men to live or die. She thought not of abstract propositions, but of the grain of the oak deck beneath her boots, the salt sting on her lips, the *immediacy* of the choices before her *right now*.

  She stepped forward, her voice cutting through the superstitious whispers like a cleaver. "Silence!"

  Every eye turned to her. Theon flinched.

  "That light," she boomed, pointing at the fading streak, "tells you nothing about tomorrow! It is gas and dust burning in the void, indifferent to our fears!" She swept her gaze across the deck, meeting the eyes of her officers, her sailors. "Aristotle was a great mind, Theon, but he was wrong about this. Tomorrow's battle is *not* written in the stars of today's truth or falsity. It is *open*."

  She walked to the rail, gesturing towards the enemy coast, invisible in the darkness. "Out there, right now, their admiral paces *his* deck. He wonders. He doubts. He makes *his* choices. Their rowers sleep, or don't. Their timbers hold, or splinter." She turned back, her voice dropping slightly, but gaining intensity. "Here, *we* choose. We choose to check every rope. We choose to hone every blade. We choose the formation at dawn. We choose courage when the arrows fly."

  She locked eyes with Theon, the logician trapped by his own symbols. "The proposition 'There will be a battle'? Perhaps it becomes true only *when* the first ship rams. Or perhaps it is simply the wrong question. The truth isn't a stone tablet waiting to be read. It is *made*. Made by the wind in our sails, the strength in our arms, the decisions we enact *moment by moment*."

  Lysandra slammed her fist onto the oak rail. The sharp crack echoed in the sudden stillness. "The future is not true or false *yet*, Theon. It is *possible*. And possibility demands action. It demands *this**."*

  She pointed emphatically at the deck, at the men, at the tools of war. "Master Helmsman! Double-check the steering cables! Bosun! Inspect every oar port! Gunners – clean and charge the ballistae! NOW!"

  For a heartbeat, no one moved. The comet was gone. Only the Admiral’s command, sharp and present, hung in the air. Then, like a machine jolted back to life, the deck erupted into furious activity. Orders were barked, hammers rang on metal, ropes were hauled taut. The paralysis shattered under the weight of immediate, necessary tasks.

  Theon watched, the wax tablet forgotten in his hands. He saw not the abstract "sea battle tomorrow," but the concrete reality of preparation *today*. He saw the Admiral not contemplating a fixed future, but actively shaping an open one through a cascade of present choices. The fatalist conclusion, so logically compelling moments ago, crumbled against the sheer, undeniable force of present action shaping an uncertain tomorrow. The truth about the battle wasn't a hidden fact; it was an event *in the making*, contingent on actions unfolding right here, right now. Aristotle’s denial wasn't just a logical dodge; it was the very space where human will and effort lived. Theon slowly closed his tablet. The symbols could wait. The open future demanded his attention.
