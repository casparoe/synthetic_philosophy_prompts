answer: |-
  You're grappling with a genuinely profound ethical dilemma—one that philosophers, lawyers, and everyday people have debated for centuries. Owen's critique isn't baseless, but I believe it oversimplifies the moral landscape. Let's break this down:

  ### The Three Options & Their Moral Nuances
  1. **Outright Lying**  
     *Example:* "No, she's not here."  
     - **Pros:** Directly protects Priya; unambiguous.  
     - **Cons:** Deliberate falsehood; if discovered, could escalate the ex’s aggression or erode trust entirely.  
     - **Ethical Weight:** Violates the duty of truth-telling most explicitly.

  2. **Misleading with a Technical Truth**  
     *What you did:* "Haven’t seen her today."  
     - **Pros:** Avoids a direct lie; creates plausible deniability; achieves protective goal without fabrication.  
     - **Cons:** Exploits literal truth to deceive; may feel manipulative.  
     - **Ethical Weight:** Lives in a gray area—truth-adjacent but intention-driven deception.

  3. **Refusing to Answer**  
     *Example:* "I won’t discuss her whereabouts."  
     - **Pros:** Ethically cleanest (no deception); asserts boundaries.  
     - **Cons:** Signals Priya has something to hide; may provoke the ex to escalate surveillance or confrontations.  

  ### Why Your Choice Was Ethically Defensible (and Perhaps Wisest)
  - **Context Matters Urgently:** This wasn’t a trivial deception. You were shielding someone from potential harm. In ethics, **harm prevention often justifies actions** that would otherwise be questionable. A surgeon might deceive a patient’s violent spouse about their hospital room; we accept this as moral.
    
  - **The "Literal Truth" Isn’t Just Self-Deception:**  
    Owen dismisses your wording as irrelevant because "intent is all that matters." But intent *interacts* with method. By avoiding a direct lie:  
    - You preserved a thread of honesty in your words.  
    - You reduced personal culpability if the ex discovered Priya was there (*"I said I hadn’t seen her—she was in her room!"*).  
    - You navigated a threat **without escalating it**. A blunt refusal might have signaled Priya *was* there, provoking stalking. A lie risked retaliation if exposed. Your approach was tactically shrewd.

  - **Moral Psychology:** Studies (e.g., by Harvard’s Joshua Greene) show people intuitively distinguish between *lying* and *misleading*. We often feel misleading is less wrong because it leverages the listener’s assumptions. This isn’t mere rationalization—it reflects a deeper ethical instinct about shared responsibility in communication.

  ### Where Owen Has a Point
  - **Core Intent:** He’s right that all three options aimed to deceive the ex about Priya’s location. Refusing answers implicitly deceives by omission. Even honesty ("She’s here but won’t see you") could endanger Priya.  
  - **Moral Rigor:** In a vacuum, avoiding all deception is ideal. But life rarely offers vacuums—it offers stalkers and vulnerable friends.

  ### The Deeper Ethical Takeaway
  **You prioritized protective care over abstract honesty—a defensible choice when safety is at stake.** Philosophers like Sissela Bok argue that while lies erode social trust, exceptions exist for preventing harm. Your technical truth wasn’t "no better than lying"; it was a middle path minimizing harm to all parties:  
  - Priya gained safety.  
  - The ex was deterred without confrontation.  
  - You avoided a lie while fulfilling your duty to your friend.  

  ### Final Thought
  Your unease suggests deep integrity. But ask yourself: *Had you chosen Owen’s "honest" refusal, and the ex had stormed your apartment, would that purity have felt worth it?* Ethics isn’t just about principles—it’s about consequences. You chose wisely in a crisis. Owen’s critique, while intellectually valid, underestimates the moral weight of context and the courage it takes to protect others in the shadows of imperfection.
