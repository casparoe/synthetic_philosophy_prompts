answer: |-
  Based on Neurath's documented principles and obsessions, here's a committed reconstruction of his likely reaction to modern data viz, COVID dashboards, and emoji/signage:

  **On Today's Infographic Culture & "Chart Crimes":**
  1.  **Fury Over Area Distortion:** Neurath would be apoplectic about resized icons. He saw area distortion not as a stylistic nitpick but as a fundamental *epistemological crime* – a visual lie violating the Vienna Circle's verificationist ethos. Instagram infographics resizing syringes/viruses/icons would confirm his worst fears about public deception through "false precision." He'd view the persistence of this error as proof his pedagogical mission failed.
  2.  **Cautious Optimism for Dashboards & OWID:** He'd recognize Our World in Data and well-designed COVID dashboards as spiritual heirs. Their global reach, focus on public understanding of complex social/health issues, and (sometimes) adherence to clear bar/line charts over deceptive pictograms would resonate deeply. He'd see *accessibility* and *international reach* as partial realizations of his dream. However:
      *   **Critique of Abstraction:** He'd likely find even clean line charts *too abstract*. Isotype insisted on concrete *pictorial* representation (repeated icons) to aid comprehension by the less literate/numerate. Pure geometric charts might feel like a regression to elite symbolism.
      *   **The "Transformer" Gap:** He'd lament the lack of a formalized "transformer" role separating data expertise from visual design. Much bad viz stems from this blurring. He'd advocate fiercely for specialized data translators in newsrooms and agencies.
      *   **Speed vs. Rigor:** The real-time nature of COVID dashboards would horrify him. Neurath valued meticulous verification *before* public display. He'd see provisional data and rapid updates as necessary evils but potentially undermining public trust if visuals weren't hyper-cautious.

  **On Emoji, Airport Icons, and UI Symbols:**
  1.  **A Different Animal (Quantitative vs. Qualitative):** Neurath would sharply distinguish these from Isotype. Isotype's core function was *quantitative transformation* – translating numbers into countable pictorial units. Emoji and signage primarily convey *qualitative* concepts (emotion, direction, function), not magnitudes. They don't answer "how many?" or "how much bigger?".
  2.  **Acknowledged Kinship, But...:** He'd recognize them as successful *pictorial languages* fulfilling his internationalist "helper-language" dream in their domains. The ISO standard for airport signage (inspired partly by Isotype!) would delight him. He'd see emoji as a fascinating, organic evolution of pictorial communication.
  3.  **The Missing Element:** He'd insist they lack the *statistical backbone* crucial to Isotype. They are *signs*, not *statistical charts*. While useful for basic communication, they don't build the visual literacy for understanding social/economic quantities that was central to his worker-education mission at the Social and Economic Museum. They solve a different problem.

  **Overall Verdict: A Bittersweet Legacy:**

  *   **Successes He'd Celebrate:** The mass democratization of data visualization, the global reach of public-interest projects like OWID, the recognition (in some circles) of visual ethics, the ubiquity of pictorial symbols for basic communication, and the validation that pictorial languages *can* work internationally.
  *   **Failures He'd Rage Against:** The persistent, widespread use of area-distorting resized icons (his cardinal sin), the lack of a formalized "transformer" role leading to errors, the speed-over-rigor culture in breaking news viz, the over-reliance on abstract geometric charts instead of concrete countable units for public communication, and the conflation of *qualitative* pictograms (emoji/signage) with the *quantitative* statistical work he championed.

  **In essence:** Neurath would see glimmers of his realized vision in the *scale* and *purpose* of the best modern public data viz but would be profoundly disappointed by the persistent methodological errors and lack of adherence to his core rules against visual distortion. He'd view emoji/signage as successful *cousins* to Isotype – proving the power of pictures for communication – but fundamentally different because they sidestep the hard problem of statistically rigorous, scalable pictorial representation of quantities that was his life's work. He'd likely be drafting furious Isotype-style manifestos on "Chart Twitter."
