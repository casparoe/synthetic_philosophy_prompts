answer: |-
  You've nailed the core confusion perfectly! The Pasadena Paradox is indeed a mind-bender because summing the terms in the "natural" order (n=1,2,3,...) *does* seem to give a perfectly good answer (ln(2) ≈ $0.69). So why on earth is the expected value called "undefined"?

  **The problem isn't the sum itself; it's that the concept of expected value requires this sum to be *uniquely defined and independent of arbitrary choices* (like the order of summation).** Conditional convergence breaks this requirement spectacularly. Here's why it matters logically, step-by-step:

  1.  **The Expected Value Sum:**
      The payout for first heads on flip `n` is `(-1)^{n+1} * 2^n / n`.
      *   n=1: Heads first flip: `(-1)^{2} * 2^1 / 1 = +$2.00`
      *   n=2: Tails then Heads: `(-1)^{3} * 2^2 / 2 = -$4.00 / 2 = -$2.00`
      *   n=3: T,T,H: `(-1)^{4} * 2^3 / 3 = +$8.00 / 3 ≈ +$2.666...`
      *   n=4: T,T,T,H: `(-1)^{5} * 2^4 / 4 = -$16.00 / 4 = -$4.00`
      *   ...and so on, with magnitudes growing rapidly.
      The probability of first heads on flip `n` is `(1/2)^n`.
      So the expected value (EV) calculation is the sum:
      `EV = Σ [n=1 to ∞] [(-1)^{n+1} * 2^n / n] * (1/2)^n`
      Simplify the term: `[(-1)^{n+1} * 2^n / n] * (1/2)^n = (-1)^{n+1} * (2^n / 2^n) * (1/n) = (-1)^{n+1} / n`
      **So, EV = Σ [n=1 to ∞] (-1)^{n+1} / n`**
      **This is the alternating harmonic series: 1 - 1/2 + 1/3 - 1/4 + 1/5 - 1/6 + ...**

  2.  **Conditional Convergence & The Natural Order (ln(2)):**
      You are absolutely right. If we sum the terms *strictly in the order n=1,2,3,4,...*, the series converges to ln(2) (approximately 0.693). The partial sums bounce around but get closer and closer to ln(2).
      `S1 = 1`
      `S2 = 1 - 1/2 = 0.5`
      `S3 = 0.5 + 1/3 ≈ 0.833`
      `S4 = 0.833 - 1/4 = 0.583`
      `S5 = 0.583 + 1/5 = 0.783`
      `S6 = 0.783 - 1/6 ≈ 0.616`
      `... approaches ln(2) ≈ 0.693`
      **So why isn't ln(2) the answer?**

  3.  **The Heart of the Paradox: Rearrangement Matters (The Riemann Series Theorem):**
      Here's the critical logical flaw exposed by conditional convergence: **The expected value of a game should depend ONLY on the possible outcomes and their probabilities. It should NOT depend on the arbitrary order in which we choose to list those outcomes in our sum.**
      *   **The Game is Fixed:** The rules are clear: flip until heads. Payout for outcome `n` is `(-1)^{n+1} * 2^n / n`. Probability of outcome `n` is `(1/2)^n`. The set of possible outcomes `{1, 2, 3, 4, ...}` and their probabilities/payouts are fixed.
      *   **The Sum Order is Arbitrary:** When we write `Σ [n=1 to ∞] ...`, we are implicitly *ordering* the outcomes. We're saying "first sum outcome 1, then outcome 2, then outcome 3,...". But mathematically, the outcomes `n=1, n=2, n=3, ...` are just labels. There's nothing inherent in the *game* that forces us to sum them in *numerical* order. We could group them differently.

      **The Riemann Series Theorem (The Bomb):** This theorem states that for a conditionally convergent series (like the alternating harmonic series), **by rearranging the order of the terms, you can make the series converge to ANY real number whatsoever, or even diverge to positive or negative infinity!**

      **Let's Rearrange the Pasadena Game's Expected Value Sum:**

      *   **Target: +3.** Suppose I want the EV sum to converge to 3. The Riemann theorem guarantees I can find an order to sum the terms `(-1)^{n+1}/n` to get 3.
          How? Greedily take positive terms until the partial sum just exceeds 3. Then take negative terms until the partial sum just dips below 3. Then take positive terms again until just above 3, and so on. Because the positive and negative terms individually diverge (harmonic series), I can always find enough positive terms to bump it up and enough negative terms to pull it down, steering the partial sums arbitrarily close to 3.
          *   Example Start: `1 + 1/3 + 1/5 + 1/7 + 1/9 + 1/11 + 1/13 ≈ 1 + 0.333 + 0.2 + 0.143 + 0.111 + 0.0909 + 0.0769 ≈ 1.955` (Still <3)
          *   `+ 1/15 ≈ 0.0667` → `2.022` (Still <3)
          *   `+ 1/17 ≈ 0.0588` → `2.081` (Still <3)
          *   ... Keep adding positive terms `1/(2k-1)` until sum >3...
          *   Suppose after many positives, `S ≈ 3.01` (just over 3).
          *   Now add a negative: `-1/2 = -0.5` → `≈ 2.51` (now below 3)
          *   Add another negative: `-1/4 = -0.25` → `≈ 2.26` (still below)
          *   `-1/6 ≈ -0.1667` → `≈ 2.093` (still below)
          *   ... Keep adding negatives `-1/(2k)` until sum <3...
          *   Eventually, add negatives until `S ≈ 2.99` (just below 3).
          *   Go back to adding positives... Repeat forever, oscillating closer and closer to 3.
          **This specific rearrangement of the *outcome payouts* converges to 3.**

      *   **Target: -5.** Using the same principle (take negatives until below -5, then positives until above -5, etc.), I can make a rearrangement converge to -5.
      *   **Target: ln(2).** The natural order `n=1,2,3,...` gives ln(2).
      *   **Target: Divergence.** I can rearrange to make the partial sums oscillate with ever-increasing amplitude (e.g., take positives until sum >1, then one negative making sum < -1, then positives until sum >2, then one negative making sum < -2, etc.).

  4.  **The Logical Problem for Expected Value:**
      *   **Different Order, Different "Value":** We now have different ways to sum the *exact same set of outcomes with the exact same probabilities and payouts*, and we get wildly different results: ln(2), 3, -5, infinity, etc.
      *   **No Privileged Order:** Why is the order `n=1,2,3,4,...` (numerical order of the flip count) the "correct" order for calculating expected value? The probability space itself doesn't dictate an order for summation. Listing outcomes by `n` is convenient, but mathematically arbitrary. We could list outcomes in order of increasing payout magnitude, or alphabetize their outcome descriptions ("H", "TH", "TTH", ...), or use any other scheme. **The Riemann theorem tells us that the order we choose fundamentally changes the sum.**
      *   **What is the "Fair Price"?** Expected value is meant to represent a "fair price" to play the game. If I offer you this game, what should you pay?
          *   Based on the natural order, $0.69 seems fair.
          *   But based on *my* clever rearrangement showing the sum converges to 3, I argue $3.00 is fair.
          *   Based on another rearrangement showing it converges to -5, someone might argue *you* should pay *them* $5.00 to play!
          *   Based on a divergent rearrangement, there *is* no fair price.
      *   **The Core Issue:** The expected value calculation **depends on an arbitrary choice (summation order)** that has **no basis in the actual probabilities or structure of the game itself.** The mathematical definition of expected value for discrete random variables, `E[X] = Σ x_i * P(X=x_i)`, **implicitly assumes that the sum converges absolutely** (Σ |x_i| * P(X=x_i) < ∞). Only under absolute convergence is the sum guaranteed to be the same *regardless* of the order of summation. The Pasadena game fails this condition spectacularly (Σ |(-1)^{n+1}/n| = Σ 1/n diverges!).

  **Conclusion & Why "Undefined" is Necessary:**

  The verdict "undefined" isn't a cop-out; it's the logically forced conclusion. **The value you get from summing the payouts weighted by probability depends fundamentally on the arbitrary order in which you choose to add them up.** There is no single, unique, order-independent sum that represents the "average" payout dictated solely by the game's rules and probabilities. Different summation orders, all mathematically valid representations of summing over the game's outcomes, yield different "expected values." Therefore, the standard concept of expected value simply **does not apply** to the Pasadena game. It's a fascinating demonstration of how the requirement of absolute convergence isn't just a technicality – it's essential for the expected value to be a well-defined, meaningful quantity independent of arbitrary mathematical choices.
