answer: |-
  Your worry is both perceptive and deeply grounded in the philosophical literature on akrasia. You've identified a genuine conceptual tension between Davidson's core puzzle of synchronic irrationality and the hyperbolic discounting (HD) model's explanation of diachronic preference reversal. This isn't just semantic quibbling; it touches on fundamental questions about agency, rationality, and self-governance. Let's dissect the tension and examine how philosophers and decision theorists have grappled with it.

  **Core of the Tension: Synchronic vs. Diachronic Explanations**

  1.  **Davidson's Akrasia (Synchronic Paradox):**
      *   **Structure:** At time *t* (the moment of action), the agent:
          *   Holds an *all-things-considered judgment* (ATC judgment) that action *A* is best.
          *   Performs action *B* instead.
          *   Does so *intentionally*.
      *   **The Puzzle:** How can an agent intentionally perform *B* while simultaneously judging *A* to be best *all things considered*? Intentional action seems to imply the agent sees *some* reason to do *B* at *t*. But if they *truly* judge *A* best *all things considered* at *t*, it seems contradictory for them to see *B* as the thing to do *at that very moment*. Davidson frames this as a potential violation of the "principle of continence" (always act according to your best judgment).

  2.  **Hyperbolic Discounting (Diachronic Mechanism):**
      *   **Structure:** Preferences are time-dependent. A distant reward (e.g., health) is valued highly at *t1* (planning). A proximate reward (e.g., donut) is valued disproportionately highly at *t2* (moment of choice), relative to the distant reward.
      *   **Resolution at t2:** At the moment of choice (*t2*), the agent acts *rationally* according to their *current, discounted* preferences. The donut *does* offer higher *subjective utility at t2* than the abstract future health benefit, given the steep discounting of the latter. The earlier self's preference/plan (formed under a different discount curve) is overruled, but there is no internal contradiction *at t2*.

  **The Crux of Your Worry:** The HD model explains *why* the preference at *t2* differs from the preference at *t1*. It explains *diachronic inconsistency*. However, it does not seem to capture the *synchronic irrationality* Davidson identified – the idea that at the *very moment of choosing the donut (t2)*, the agent *still judges abstaining (A) as best all things considered (ATC)*, yet intentionally chooses the donut (*B*). The HD model suggests that at *t2*, choosing *B* *is* the rational thing to do *given the operative discount function*. There is no *synchronic* violation of the principle of continence; the agent *is* acting according to their best judgment *at t2* (which is myopic).

  **Is the Tension Real? Yes, Fundamentally So.**

  You are correct. The standard HD account, taken purely as an economic model of changing preferences over time, **does change the subject**. It replaces Davidson's puzzle of synchronic irrationality (acting against your *current* best judgment) with the phenomenon of diachronic preference reversal (your preferences change predictably over time). The vocabulary of "weakness of will" or "akrasia" is then applied to this new phenomenon, often without acknowledging the shift.

  **How Philosophers & Decision Theorists Address the Tension:**

  The response isn't monolithic, but several key approaches attempt to bridge the gap or redefine the terrain:

  1.  **Reinterpreting Davidson's "All-Things-Considered Judgment" (ATC):**
      *   **Critique:** Some argue Davidson's ATC judgment is too strong or ambiguous. What does "all things considered" *include*? Does it include the *intensity* of competing desires *at the moment*, or just a detached evaluation?
      *   **HD Integration:** Proponents of HD might argue that the "judgment" formed at *t1* wasn't truly *all*-things-considered *from the perspective of t2*. At *t2*, the visceral appeal of the donut and the steep discounting of future health *are* new considerations (or newly weighted considerations) that *should* be part of an ATC judgment *at t2*. Choosing the donut *is* acting on the true ATC judgment *at t2*, formed under the influence of proximity. This dissolves Davidson's synchronic puzzle but arguably waters down the concept of an ATC judgment.
      *   **Problem:** This risks making "ATC judgment" synonymous with "whatever preference wins out at the moment," losing its normative force as a standard the agent can fail to meet *synchronically*.

  2.  **Introducing Synchronic Conflict *Within* HD (Ainslie's Picoeconomics & Fragmentation):**
      *   **Ainslie's Key Insight:** George Ainslie (Picoeconomics) argues HD doesn't just create preference reversal *over time*; it creates internal conflict *at a single time*.
      *   **Personal Rules & Intertemporal Bargaining:** The agent at *t2* isn't just a myopic optimizer. They are also aware of being part of a *series of selves* over time. Choosing the donut at *t2* isn't just about immediate reward; it potentially violates a *personal rule* (e.g., "never eat donuts") established to overcome HD. The cost of breaking this rule is the *perceived* increase in the likelihood of future failures (loss of "willpower" or self-trust).
      *   **Synchronic Conflict at t2:** At *t2*, the agent experiences:
          *   **Desire 1:** The intense, proximate desire for the donut (driven by HD).
          *   **Desire 2:** The desire to maintain the personal rule and its long-term benefits (which includes the discounted value of future health *and* the value of self-control itself).
      *   **Akrasia as Rule Violation:** Akrasia occurs when Desire 1 overwhelms Desire 2 *at t2*. Crucially, Desire 2 represents a commitment grounded in the *long-term perspective* that the agent *still endorses at t2* as fundamentally important, even if its motivational force is weaker than the visceral urge. Choosing the donut *feels* like acting against a part of oneself (the rule-upholding, long-term-oriented self) that is *present and evaluatively active at t2*. This reintroduces a synchronic conflict.
      *   **Metaphors:** Think of competing "interests" or "sub-agencies" within the self at a single time, bargaining or fighting for control.

  3.  **Rejecting the Purely Conative Model: Judgment vs. Preference (Sarah Paul, Richard Holton):**
      *   **Distinction:** Philosophers like Sarah Paul ("The Battle of St. Petersburg") and Richard Holton ("Willing, Wanting, Waiting") emphasize that Davidson's puzzle is about *judgment* or *intention*, not just preference or desire strength.
      *   **Judgment Persists:** Even if the *motivational force* of the long-term goal is swamped at *t2* by the discounted desire for the donut (explained by HD), the agent might still *judge* or *believe* that abstaining (*A*) is the better course *all things considered* at *t2*. This judgment could be based on reflection, commitment to past resolutions, or recognition of the discounting bias itself.
      *   **Synchronic Akrasia:** Akrasia occurs when intentional action (*B*) proceeds *despite* this persisting synchronic ATC judgment (*A* is best). HD explains *why* the motivation to do *A* is weak, but doesn't explain away the potential persistence of the judgment *favoring A* at *t2*. The agent acts against their *own current evaluative assessment*. This directly addresses Davidson.
      *   **Holton's Resolution:** Holton argues akrasia is a failure to *maintain an intention* in the face of counter-motivation (which HD provides), not necessarily acting against a *current* ATC judgment. However, the *intention* formed earlier represents a commitment that the agent feels they *should* uphold at *t2*, creating the sense of acting against oneself.

  4.  **The "Resolute Choice" Model (McClennen, Bratman):**
      *   **Critique of HD Rationality:** Some philosophers (e.g., Edward McClennen, Michael Bratman) argue that treating each moment's discounted preference as the sole basis for rational choice is itself irrational. Truly rational agents should be able to adopt and stick to *plans* made in advance, recognizing that later preferences will be distorted by proximity.
      *   **Synchronic Irrationality Reclaimed:** On this view, the agent at *t2* who abandons the diet plan for the donut *is* acting irrationally *at t2*. They are failing to adhere to a rationally adopted plan. Their *t2* preference is not a legitimate basis for overriding the earlier commitment. Akrasia, in this case, involves a synchronic failure of rationality at *t2* – a failure to be "resolute."
      *   **Connection to Davidson:** This directly posits a synchronic irrationality: acting against the plan *is* acting against what the agent rationally *should* do *at t2*, even if their discounted desires scream otherwise.

  **Conclusion & Synthesis:**

  Your dissatisfaction is well-founded. The *standard, simplistic* application of hyperbolic discounting within the rationalist blogosphere **does** often "change the subject," replacing Davidson's profound puzzle of synchronic self-contradiction with the less paradoxical (though still important) phenomenon of diachronic preference reversal. It flattens akrasia into a predictable quirk of temporal perception, losing the element of acting *against one's own current, considered self*.

  However, the tension is actively addressed at the intersection of philosophy and decision theory:

  1.  **Ainslie's Picoeconomics:** Offers the richest integration, showing how HD inevitably creates *synchronically* conflicting interests or bargaining positions within the agent at the moment of choice. Akrasia is violating a personal rule that represents the long-term self's interest *present at t2*.
  2.  **Judgment/Persistence Views (Paul, Holton):** Argue that the ATC judgment or prior intention *can and often does persist* at *t2*, even if motivation is swamped by HD-driven desire. Acting against *this persistent judgment/intention* constitutes synchronic akrasia. HD explains the motivational weakness, not the persistence of the judgment or the failure to act on it.
  3.  **Resolute Choice:** Posits that rationality requires sticking to plans, making the *t2* choice *synchronically irrational*.
  4.  **Reinterpretation of ATC:** Some dissolve the puzzle by arguing the *t2* choice *is* the true ATC judgment under the influence of proximity, but this risks abandoning the normative core of Davidson's puzzle.

  **The Conceptual Upshot:** Hyperbolic discounting is a powerful *mechanism* explaining *why* long-term goals lose motivational force. However, it does not, on its own, fully explain or dissolve Davidson's puzzle of synchronic akrasia – acting against what one *judges best at the very moment of action*. To capture *that* phenomenon, we need additional conceptual resources: the persistence of evaluative judgments/intentions (Paul, Holton), the internal conflict between competing interests or selves at a time (Ainslie), or a normative commitment to plan-following that defines rationality synchronically (Resolute Choice). The "flattened" rationalist story often misses this crucial philosophical depth, substituting a mechanism for an explanation of the core experience of weakness of will. Your return to the original philosophical texts was precisely the right move to uncover this tension.
