  Now, for Adult ADHD: The user's experience is a clear example, and there are communities. But is it as strong as the S tier? Maybe A.

  Similarly, Anorexia: Hacking has written about it, so it's a known example. But we'll put it in A.

  BPD: There is a community, but it might not be as strong as the identity movements in autism or gender. So A.

  PTSD: Strong, but the identity is often about being a survivor rather than a PTSD-identified person. Still, A.

  Then:

