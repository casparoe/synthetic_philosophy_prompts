prompt: |-
  So this thing has been bugging me for like a week now and I honestly can't drop it. My roommate's had this gym membership for about three years, and because of some old sign-up promo, she's still getting billed the promo rate even though it obviously should've expired ages ago - she's like 90% sure it's just a billing mistake nobody at the gym ever caught. Over pizza I told her that's kind of messed up, like, what if everyone who noticed a mistake like that just quietly let it ride, the gym would go under eventually. But she had a whole comeback ready: she said the "what if everybody did this" test only makes her look bad if you state her rule in some vague general way, like "anyone who notices they're being undercharged should keep quiet." But if you describe the situation as specific as it actually is - someone who signed up for this exact promo, at this exact branch, around this exact date, who happens to notice this exact clerical error and says nothing - then basically nobody else on earth is ever gonna land in that exact situation, so her doing it could never generalize into some world where the gym goes bankrupt. Her point is that her rule technically passes fine, and that you could make basically any shady thing pass the same way, just by describing it specific enough.

  It kind of wrecked my brain because I couldn't find the hole in it right there at the table, but it still feels like a cheap trick and not an actual defense, like she's gaming a rule instead of actually being in the clear. So is she just cleverer then me here, or is there an actual answer for why your not allowed to slice up a situation that finely before you run the "what if everybody did it" test on it? I've read bits of old philosophy stuff on my own over the years here and there (never took an actual class, no degree or anything), so don't worry about it being too basic for me, I just don't know the proper words for a lot of this stuff.
