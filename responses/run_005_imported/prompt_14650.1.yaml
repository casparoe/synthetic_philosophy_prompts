answer: |-
  You've hit on one of the deepest debates in moral philosophy: the tension between abstract principles and concrete circumstances. Your roommate's argument is clever, but it's a classic case of **misplaced concreteness** or **hyper-specification fallacy**, and philosophers have robust responses to it. Here's why her defense fails:

  ### 1. **The Kantian "Universalizability" Test (Categorical Imperative)**
     Immanuel Kant argued that an action is morally permissible only if you can rationally will that *everyone* acting on the *same underlying principle* could do so without contradiction. The flaw in your roommate's logic is that she's defining her "rule" based on irrelevant, circumstantial details (e.g., "this exact branch," "this exact date") rather than the **morally relevant features** of her action.  
     - **Her rule**: "Keep quiet if you’re underbilled due to an old promo at XYZ Gym on [date]."  
     - **Actual principle**: "Exploit clerical errors for personal gain when detection is unlikely."  
     If *everyone* acted on *this core principle*, systems relying on trust (like billing) collapse. Kant would say her "specific" rule is a disguised version of this ununiversalizable maxim.

  ### 2. **The "Essential Features" Problem**
     Philosophers like W.D. Ross and modern ethicists distinguish between **accidental** and **essential** properties of an action.  
     - **Accidental properties**: The gym branch, promo name, or date. These don’t change the *moral character* of the act.  
     - **Essential properties**: Knowingly benefiting from an error at another’s expense, exploiting trust, free-riding on a system.  
     By focusing on accidents, she’s masking the essence: **unilateral deception for gain**. If everyone did *that*, cooperative systems fail.

  ### 3. **The "No Two Cases Are Identical" Dodge**
     Her claim that "no one else will ever be in this exact situation" is true but trivial. *No* two moral dilemmas are identical. If hyper-specificity justified exceptions, *all* moral rules could be voided:  
     - *"Stealing this exact diamond at 3:02 PM on Tuesday from this specific safe is fine because no one else will ever do that."*  
     - *"Lying to my boss today about this exact report is fine because the circumstances won’t recur."*  
     Ethics requires identifying **recurring patterns** (e.g., "exploiting errors") to guide behavior.

  ### 4. **The Practical Consequences**
     Imagine a gym manager discovers 100 members exploiting similar "unique" errors. The gym *does* lose revenue, staff get fired, or honest members face price hikes. Your roommate’s gain isn’t isolated; it’s a drop in a bucket filled by others using identical justifications. The "what if everybody" test forces us to see our actions as part of a collective pattern.

  ### 5. **A Better Reframing Test**
     Ask her: *"Would it be acceptable if the gym discovered the error and demanded back-payment for 3 years?"* If she says no, she implicitly admits the gym has a moral claim to the correct rate. Silence = depriving them of what’s owed.

  ### Why This Feels Like a "Cheap Trick"
  Her argument uses **sophistry** (clever but false reasoning) by:
  - **Obfuscation**: Burying the universal principle under irrelevant details.
  - **Moral Arbitrariness**: Making ethics dependent on random contingencies (e.g., which promo she used).
  - **Special Pleading**: Implicitly claiming *her* situation is uniquely exempt from scrutiny.

  ### The Philosophical Bottom Line
  Ethics isn’t about finding loopholes in descriptions; it’s about whether our actions align with principles that sustain trust and cooperation. As philosopher Onora O’Neill puts it: *"We must act on maxims that could be adopted by all others in similar morally relevant circumstances."* Your roommate’s "similar circumstances" aren’t about promo dates—they’re about **knowingly benefiting from systemic errors**.

  You’re right to feel unsettled. Her logic *is* gaming the system—both the gym’s billing and moral reasoning itself. The hole in her argument? **Specificity doesn’t negate universality; it just disguises it.** Don’t let lexical precision override moral clarity.
