  Here are two original scenarios designed to isolate the factors you're exploring, along with diagnoses of the key considerations at play:

  ### Scenario 1: The Hypocrite Who Retains Standing

  **Situation:** Dr. Aris Thorne is a renowned cardiologist and a heavy smoker (a fact known within the hospital but not actively hidden). He frequently lectures his patients with heart disease about the critical importance of quitting smoking, using stark language about the irresponsibility of continuing the habit given the known risks. One day, he confronts a fellow senior surgeon, Dr. Lena Petrova, in the hospital cafeteria. He witnesses her telling a junior resident, "One cigarette after a brutal 12-hour shift won't kill you, relax." Dr. Thorne sharply rebukes Dr. Petrova: "Lena, that's dangerously irresponsible advice to give a junior colleague! You know the data on nicotine and vascular health as well as I do. Encouraging this habit, even casually, is a profound breach of our duty to model healthy behavior."

  **Analysis & Diagnosis:**
  *   **Hypocrisy:** Dr. Thorne is unambiguously hypocritical in the narrow sense. He violates the exact standard (non-smoking) he demands of others (patients, colleagues) without acknowledging his own failure in the act of blaming Dr. Petrova.
  *   **Complicity/Involvement:** He is arguably complicit in the *general* wrong of normalizing smoking within the medical community through his own actions. However, he is not complicit in *this specific* wrong (Petrova's casual advice to the resident).
  *   **Relationship/Business:** This is the decisive factor **preserving standing**. Dr. Thorne speaks *as a senior colleague within their shared professional community*, bound by shared ethical codes and duties (modeling behavior, ensuring patient/resident well-being). His position grants him the **relational authority** to call out professional misconduct, regardless of his personal failings in the same domain. The wrong (giving harmful medical advice) is directly "his business" because it occurs within the institution and profession he is part of and has responsibility towards. His hypocrisy is a *personal failing* that might undermine his *persuasiveness* or make him *unlikable*, but it doesn't strip him of the *standing* derived from his professional role to address breaches of professional conduct.

  ### Scenario 2: The Non-Hypocrite Who Lacks Standing

  **Situation:** Elara is a childless woman in her 30s who meticulously researches every life decision. She witnesses a stranger, Ben, struggling with his overtired 3-year-old son, Finn, in a crowded grocery store aisle. Finn is having a full-blown tantrum, screaming, kicking, and knocking items off a low shelf. Ben, looking exhausted and flustered, finally snaps. He grabs Finn's arm firmly (not violently, but forcefully) and hisses, "Finn! Stop it RIGHT NOW or we are leaving WITHOUT ANY DINNER! I MEAN IT!" Elara, who has read extensively on child development and positive discipline, approaches Ben directly. In a calm but authoritative tone, she says: "Sir, threatening to withhold food as punishment is emotionally abusive and developmentally harmful. You need to learn healthier techniques to manage your child's behavior. This is completely unacceptable."

  **Analysis & Diagnosis:**
  *   **Hypocrisy:** Elara is **not hypocritical**. She has never had a child, never been in Ben's situation, and never used such a tactic herself. She genuinely believes in and practices (in interactions with nieces/nephews/friends' kids) the positive techniques she advocates.
  *   **Complicity/Involvement:** Elara is **not complicit** in Ben's action. She is a complete stranger witnessing a single, stressful incident. She has no involvement in the complex dynamics of Ben's parenting or Finn's behavior.
  *   **Relationship/Business:** This is the decisive factor **destroying standing**. Elara lacks **any qualifying relationship** to Ben, Finn, or the situation. She is a stranger offering unsolicited, judgmental criticism in a highly stressful, vulnerable moment for a parent. Parenting decisions, especially in moments of extreme stress in public, are intensely personal and private matters. While child welfare *is* everyone's business in a broad societal sense, intervening as a stranger in this direct, accusatory manner, without any established connection, role (like a teacher or social worker), or invitation, violates the **relational boundaries** that normally license blame. Her lack of hypocrisy is irrelevant; her fundamental lack of connection ("Is this *your* business, *Elara*, in *this* way, *right now*?") means she simply doesn't have the *right* to deliver that particular blame in that context, regardless of the accuracy of her developmental advice.

  **Key Takeaways for Your Situation:**

  1.  **Hypocrisy vs. Relationship:** Your case highlights the tension between these. Your sister points to your distance (potentially analogous to hypocrisy or complicity via avoidance) as undermining your standing. However, your **familial relationship** as a sibling and co-child of your father is a powerful source of standing *in itself*. You share a unique history, responsibility, and emotional stake in his care that an outsider does not. This relationship arguably gives you the fundamental "business" to be involved in the dispute about his care, even if your physical distance complicates the *practicality* or *perceived fairness* of your demands.
  2.  **Complicity/Involvement:** Your sister's point about you moving away potentially touches on **complicity via avoidance**. By choosing distance, you may be seen as implicated in the *overall burden* she carries, even if you didn't cause the dementia. This weakens your position when criticizing her *specific failures* (cancellations) under that burden. You aren't hypocritical about *wanting* care for your father, but you might be seen as complicit in creating the stressed conditions that make her failures more likely.
  3.  **The Core Conflict:** Your standing likely stems primarily from your **relationship** as a sibling with shared responsibility. The potential hypocrisy/complicity (distance/avoidance) doesn't necessarily *destroy* that standing entirely, but it **significantly weakens your moral authority** in the specific context of criticizing her *day-to-day management* under the burden your distance contributed to. It makes your criticism feel less legitimate *to her* because you aren't sharing the immediate, grinding weight. The ethical literature shows this isn't clear-cut; your relationship likely preserves *some* standing, but its force is diluted by the avoidance/complicity factor.

  These scenarios demonstrate that hypocrisy, while powerful, isn't the sole arbiter of standing. The *relational context* – who you are to the person and the situation – is fundamental and can sometimes override hypocrisy (as in Scenario 1) or be the sole reason standing is absent even without it (as in Scenario 2). Complicity acts as a separate weakening factor, suggesting involvement in the broader wrong undermines the legitimacy of criticizing specific instances. In your dispute, all three factors (hypocrisy/complicity via distance, and the foundational sibling relationship) are dynamically interacting.
