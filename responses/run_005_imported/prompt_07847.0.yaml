answer: |-
  This is a brilliantly precise question about the intersection of philosophy of mind, perception, and narrative craft. To achieve the effect you want – genuine cognitive penetration shaping perceptual *content*, not just attention, memory, or judgment – here's what must be true and how to navigate the circularity:

  **What Must Be True for Genuine Cognitive Penetration (CP):**

  1.  **Direct Influence on Phenomenology:** The wife's fear/jealousy must *directly* alter the *phenomenal character* of her perceptual experience itself. It's not that she *sees* a neutral handshake and *then interprets* it as lingering; it's that the handshake *visually appears* to her, from the outset, as **objectively longer, warmer, more intimate** than it would appear to a neutral observer watching the same event. Similarly, the hesitation before answering the phone isn't just *inferred* as suspicious later; it *auditorily* **sounds like a pregnant pause, a guilty delay**, inherently loaded with meaning. The "look" or "sound" itself carries the emotional/intentional weight.
  2.  **Impact on Low-Level Features (Potentially):** While CP doesn't *necessarily* require altering the most basic sensory features (like edge detection or pitch), it must affect features typically considered part of the "perceptual given." This could include:
      *   **Duration:** The handshake *looks* subjectively longer.
      *   **Intensity:** The colleague's smile *looks* brighter, more flirtatious.
      *   **Affective Quality:** The husband's tone *sounds* inherently evasive or false.
      *   **Salience:** Features consistent with infidelity might literally *appear* brighter, louder, or more prominent.
      *   **Categorical Perception:** Ambiguous expressions or gestures might be *seen* categorically as "guilty" or "furtive" rather than neutral.
  3.  **Distinction from Post-Perceptual Processes:**
      *   **Attention:** It's not that she *only notices* potentially suspicious things others filter out. CP means that *when she attends* to the handshake, its *appearance* is altered. Attention might guide her *to* the stimulus, but CP changes *how* it looks/sounds *when* attended.
      *   **Memory:** It's not that she misremembers a neutral handshake as lingering. The distortion happens *at the moment of perception*. Her *memory* of the event might be accurate *to her distorted perception*.
      *   **Judgment/Belief:** It's not that she *sees* a neutral pause and *then concludes* "He's hesitating because he's guilty." CP means the pause *sounds like guilt*. The judgment ("That's suspicious!") feels like a direct *recognition* of a property inherent in the perception itself, not an inference *from* a neutral perception.
  4.  **Violation of Informational Encapsulation (Fodor/Pylyshyn Line):** Genuine CP violates the core Fodorian principle that perceptual modules are "informationally encapsulated" – meaning higher-level cognitive states (like beliefs, desires, fears) cannot directly alter the computations *within* the perceptual module. For CP to be genuine, the wife's fear must "get inside" the visual/auditory processing in a way that alters its output (*what* she sees/hears) based on its cognitive content, not just its *input* (via attention) or the downstream interpretation.

  **The Circularity Problem (Siegel et al.) and Why It's Epistemic:**

  This is where your narrative effect becomes philosophically profound and creates a powerful epistemic trap for your character.

  1.  **The Mechanism of Circularity:**
      *   **Step 1 (Cognitive State Shapes Perception):** The wife's suspicion (cognitive state - `S`) cognitively penetrates her perceptual system.
      *   **Step 2 (Penetrated Perception as Evidence):** This penetration causes her to perceive her husband's actions (`P`) *as having properties* (`F`) that confirm `S` (e.g., seeing the handshake *as* overly intimate `F` because she suspects infidelity `S`).
      *   **Step 3 ("Fresh" Evidence):** The perceived `F` (the intimate handshake, the guilty pause) feels like *new, independent evidence* confirming her original suspicion `S`.
      *   **The Circle:** `S` causes the perception of `F` in `P`. Perceiving `F` is then taken as evidence for `S`. But `F` only appears *because* of `S`. The evidence (`F`) is not independent of the hypothesis (`S`) it's supposed to support.

  2.  **Why It's Distinctively Epistemic (Not Just Psychological):**
      *   **Epistemic Bootstrapping:** The character is essentially generating her *own* confirming evidence through the very belief that needs confirmation. It's a form of *epistemic bootstrapping* or *question-begging*. Her justification for `S` relies crucially on perceptual evidence (`F`) that is itself contaminated by `S`.
      *   **Loss of Falsifiability:** Genuine CP makes it incredibly difficult for the character to *falsify* her suspicion. Neutral or even exonerating evidence might be *perceptually transformed* into something suspicious (`F`). A genuinely innocent explanation offered by the husband might *sound* inherently like a lie. The perceptual world becomes a hall of mirrors reflecting only the suspicion.
      *   **Undermining Perceptual Justification:** Perception is usually considered a basic source of justification ("I see it, so I have reason to believe it"). CP in cases of circularity *undermines* this justificatory force. If the reason she sees `F` is *because* she believes `S`, then seeing `F` cannot provide independent justification *for* `S`. It reveals a flaw in the *source* of the justification.
      *   **Distinct from Confirmation Bias:** Confirmation bias involves *seeking*, *interpreting*, or *remembering* information in a way that confirms pre-existing beliefs. CP is more radical: it makes the *very fabric of perceptual experience* conform to the belief. The evidence isn't just misinterpreted; *it's manufactured at the sensory level*. This creates a deeper, more inescapable epistemic trap.

  **Narrative Implications & Achieving the Effect:**

  *   **Describe the Phenomenology:** Use sensory language that conveys the *immediate, intrinsic* quality of the distorted perception. *"The colleague's fingers lingered on his palm, a full, slow second longer than courtesy demanded – she saw it, clear as the clock ticking on the wall." "The silence before his 'Hello?' wasn't empty; it was thick, viscous with withheld words, a guilty pause that echoed in her ears."*
  *   **Contrast Implicitly:** Show moments where her perception *could* be neutral but isn't. Describe mundane actions through her lens, imbuing them with inherent suspicion.
  *   **Highlight the "Freshness":** Have her *react* to these perceptions as shocking new discoveries, reinforcing the trap. *"There it was again! Proof, plain as day..."*
  *   **Show the Epistemic Trap:** Illustrate how alternative explanations bounce off her. Even if presented with facts, the *way* she perceived the event feels like undeniable, primary evidence. The circularity becomes her prison.
  *   **Distinguish from Interpretation:** Avoid phrases like "she took it to mean..." or "she interpreted it as...". Instead, use phrases like "it looked like...", "it sounded like...", "she saw...", "she heard..." to emphasize the perceptual nature.

  **Conclusion:**

  For genuine cognitive penetration in your narrative:
  1.  The jealousy must *directly alter the phenomenal content* of perception (how things *look/sound*), making suspicious properties (`F`) inherent in the experience.
  2.  This must be distinct from her simply attending to different things, misremembering, or making post-perceptual judgments.
  3.  The resulting circularity (`S` causes perception of `F`, which is taken as evidence for `S`) creates a profound *epistemic* problem. It undermines the independence of perceptual evidence, makes falsification nearly impossible, and reveals how the fear corrupts the very source of her justification, trapping her in a self-confirming nightmare. This is far deeper than just "being influenced"; it's the world itself becoming an extension of her fear.

  By committing to this depiction, you'll create a powerful, psychologically acute, and philosophically resonant portrayal of jealousy's corrosive power over reality itself.
