      He admits that the Basic Argument (or similar arguments) show we lack moral responsibility, but we must maintain the illusion for practical reasons. This doesn't refute the Basic Argument; it concedes it and then talks about what we should do in light of that. So, it doesn't hold up as a response that challenges the Basic Argument.

