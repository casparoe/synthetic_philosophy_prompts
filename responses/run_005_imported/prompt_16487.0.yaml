prompt: |-
  ok so a few weeks ago i went down a youtube rabbit hole and found this old talk by a philosopher named Galen Strawson where he lays out what he calls the "Basic Argument" against moral responsibility. the basic claim (no pun intended) is that literally no one can ever be truly, ultimately responsible for what they do, not even genuinely evil or genuinely saintly people, because to be responsible for what you do you'd have to be responsible for being the kind of person who'd do it, and to be responsible for THAT you'd have to have chosen your own original character/values before you had any character to choose with in the first place, which is impossible. i think this is basically the "causa sui" (cause of yourself) thing that even Nietzsche apparently called incoherent somewhere. the part that messed with my head is that it doesnt matter if determinism is true or not, you get the same regress either way, so its not just warmed-over hard determinism.

  anyway i got kind of obsessed and read up on how different philosophers have tried to respond to this, and now i have to do a project on it for my ethics elective (im a junior), so i wanna turn it into a tier list instead of a boring essay. can you rank the responses below from S tier to F tier based on how well they actually hold up against the Basic Argument, NOT how famous or influential they are:

  - P.F. Strawson's "reactive attitudes" move from Freedom and Resentment (yes apparently that's literally Galen's dad, which i thought was kind of funny)
  - Frankfurt-style compatibilism (the hierarchical/mesh-of-desires thing)
  - Fischer & Ravizza's reasons-responsiveness compatibilism
  - agent-causal libertarianism (Chisholm/O'Connor/Clarke)
  - Robert Kane's event-causal libertarianism with "self-forming actions"
  - Manuel Vargas's revisionism
  - Saul Smilansky's illusionism
  - Derk Pereboom's hard incompatibilism

