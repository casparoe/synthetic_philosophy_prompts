  We are ranking responses to Galen Strawson's Basic Argument against moral responsibility.
   The Basic Argument: No one can be ultimately responsible for their actions because to be responsible for what you do, you must be responsible for being the kind of person who does it, which leads to an infinite regress (the causa sui problem). This regress occurs regardless of determinism.

   We are to rank the following responses:

   1. P.F. Strawson (Galen's father) - reactive attitudes: We don't need metaphysical responsibility; our natural reactive attitudes (resentment, gratitude, etc.) ground moral practices.
   2. Frankfurt-style compatibilism: Freedom is about having the desires you want (second-order volitions) and acting on them, without necessarily requiring alternative possibilities.
   3. Fischer & Ravizza's reasons-responsiveness: Moral responsibility requires that the mechanism of action is moderately reasons-responsive (i.e., it would respond to reasons in some possible scenarios).
   4. Agent-causal libertarianism: Agents are irreducible substances that can cause actions without being determined by prior events, thus breaking the causal chain.
   5. Robert Kane's event-causal libertarianism: Uses undetermined "self-forming actions" (SFAs) at key moments to create the agent's character, which then determines later actions.
   6. Manuel Vargas's revisionism: We should revise our concept of moral responsibility to focus on forward-looking concerns (e.g., influencing future behavior) rather than backward-looking desert.
   7. Saul Smilansky's illusionism: We must maintain the illusion of free will and responsibility for practical reasons, even though it's not metaphysically justified.
   8. Derk Pereboom's hard incompatibilism: Agrees that we lack moral responsibility (because of the Basic Argument) but argues we can live without it by focusing on other practices.

   Criteria: How well they hold up against the Basic Argument, not fame.

   The Basic Argument's core challenge: ultimate responsibility requires self-creation, which is impossible.

   Tiers:

   S: Directly and convincingly addresses the regress, providing a way out without obvious flaws.
   A: Strong response but with some vulnerabilities or requires accepting non-obvious premises.
   B: Addresses the issue but has significant weaknesses or only partially succeeds.
   C: Weak response, largely sidestepping the core issue or easily countered by the Basic Argument.
   F: Fails to engage or collapses entirely against the Basic Argument.

   Analysis:

   - The Basic Argument is a challenge to the very coherence of moral responsibility. Any response that requires the agent to be the ultimate cause of themselves (causa sui) will fail because that is impossible.

   Let's go through each:

   1. P.F. Strawson (reactive attitudes):
      He shifts the question from metaphysics to our practices. The Basic Argument is about ultimate responsibility, but P.F. Strawson says we don't need that. We have reactive attitudes that are part of our social fabric. However, Galen Strawson has responded that this doesn't address the core metaphysical issue. It's a pragmatic move, but the Basic Argument still stands as a challenge to the justification of these attitudes. So, it doesn't really refute the Basic Argument; it just ignores the metaphysical challenge. Thus, it might be placed in a lower tier.

   2. Frankfurt-style compatibilism:
      This focuses on the structure of the will. But the Basic Argument would ask: are you responsible for having the second-order desires? If not, then the regress starts. Frankfurt does not address the regress. So, it doesn't hold up well.

   3. Fischer & Ravizza (reasons-responsiveness):
      They focus on the mechanism of action. But again, the Basic Argument would push: are you responsible for the mechanism? If the mechanism is a product of your character, which you didn't create, then how are you responsible? They might say that the mechanism being reasons-responsive is enough, but the Basic Argument demands more: ultimate responsibility. So, it doesn't fully address the regress.

   4. Agent-causal libertarianism:
      This posits an agent as a substance that can cause without being caused. But then the Basic Argument would ask: how did the agent get to be the way it is? If the agent just exists with certain powers, then they are not responsible for having those powers. The regress stops arbitrarily at the agent. This might be seen as an ad hoc solution. However, it does try to break the regress by introducing a new kind of causation. But it's metaphysically controversial and doesn't fully escape the regress because the agent's nature is still not self-created.

   5. Robert Kane's event-causal libertarianism:
      He uses undetermined SFAs to create the self. At moments of SFA, the agent's will is undetermined, and thus the agent is responsible for the outcome. But the Basic Argument would say: even if the action is undetermined, how is the agent responsible for that action? The agent at the time of the SFA is not yet formed, so the regress still applies. Moreover, if the SFA is undetermined, it might be random, which doesn't help with responsibility. Kane tries to address the regress by having the self formed by actions that are not determined by prior character, but the Basic Argument would still push: why is the agent responsible for the SFA? The agent isn't responsible for the conditions that led to the SFA.

   6. Manuel Vargas's revisionism:
      He revises the concept of moral responsibility to focus on forward-looking aspects. This avoids the backward-looking desert that the Basic Argument attacks. So, it might be a way to live without ultimate responsibility. However, the Basic Argument is about the traditional notion of desert-based responsibility. If we change the concept, we are not really answering the challenge to the traditional notion but replacing it. So, it doesn't refute the Basic Argument but rather changes the subject.

