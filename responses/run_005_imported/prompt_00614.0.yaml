prompt: |-
  Over the past year I have gradually distanced myself from the evangelical church in which I was raised, and a few months ago several old friends from that community and I began meeting every few weeks to talk through what each of us is working out for ourselves. One member of the group, who teaches English, recently circulated one of George Eliot's periodical essays rather than a novel, on the grounds that Eliot had already thought hard about a question we keep returning to: whether ordinary decency actually depends on the backing of an afterlife with rewards and punishments, or can hold together without it. The essay, "Worldliness and Other-Worldliness," is a review she wrote for the Westminster Review in 1857 of the poet Edward Young, best remembered for "Night Thoughts." For most of the essay she walks through his biography and mocks his verse, but well past the midpoint she turns to a denser, more argumentative stretch that is clearly where the real philosophical weight of the piece lies. I have now read this stretch several times and can follow each sentence taken on its own, without feeling that I have reconstructed the argument they are supposed to add up to, so I would like some help with it.

  For context, this picks up right after Eliot has quoted several stanzas in which Young describes God locking the damned into hell with an enormous "adamantine key," treating this as one of the more embarrassing moments in "Night Thoughts":

  "That, in Young's conception, is what God delights in. His crowning aim in the 'drama' of the ages, is to vindicate his own renown. The God of the 'Night Thoughts' is simply Young himself 'writ large'—a didactic poet, who 'lectures' mankind in the antithetic hyperbole of mortal and immortal joys, earth and the stars, hell and heaven; and expects the tribute of inexhaustible 'applause.' Young has no conception of religion as anything else than egoism turned heavenward; and he does not merely imply this, he insists on it. Religion, he tells us, in argumentative passages too long to quote, is 'ambition, pleasure, and the love of gain,' directed toward the joys of the future life instead of the present. And his ethics correspond to his religion. He vacillates, indeed, in his ethical theory, and shifts his position in order to suit his immediate purpose in argument; but he never changes his level so as to see beyond the horizon of mere selfishness. Sometimes he insists, as we have seen, that the belief in a future life is the only basis of morality; but elsewhere he tells us—'In self-applause is virtue's golden prize.' Virtue, with Young, must always squint—must never look straight toward the immediate object of its emotion and effort. Thus, if a man risks perishing in the snow himself rather than forsake a weaker comrade, he must either do this because his hopes and fears are directed to another world, or because he desires to applaud himself afterward! Young, if we may believe him, would despise the action as folly unless it had these motives. Let us hope he was not so bad as he pretended to be! The tides of the divine life in man move under the thickest ice of theory. Another indication of Young's deficiency in moral, i.e., in sympathetic emotion, is his unintermitting habit of pedagogic moralizing. On its theoretic and perceptive side, morality touches science; on its emotional side, Art. Now, the products of Art are great in proportion as they result from that immediate prompting of innate power which we call Genius, and not from labored obedience to a theory or rule; and the presence of genius or innate prompting is directly opposed to the perpetual consciousness of a rule. The action of faculty is imperious, and excludes the reflection why it should act. In the same way, in proportion as morality is emotional, i.e., has affinity with Art, it will exhibit itself in direct sympathetic feeling and action, and not as the recognition of a rule. Love does not say, 'I ought to love'—it loves. Pity does not say, 'It is right to be pitiful'—it pities. Justice does not say, 'I am bound to be just'—it feels justly."

  I think I follow the broad outline: Eliot wants to say that Young's whole conception of piety is really self-interest projected onto eternity, which makes his "virtue" hollow. But three things give me trouble. First, what exactly is the example of the man in the snow supposed to prove, and why does Eliot treat it as a decisive objection to Young rather than just a difference of emphasis between them? Second, I cannot work out what the sentence about "the tides of the divine life in man" moving "under the thickest ice of theory" is doing at that point in the argument, or even whether it is meant sincerely or ironically, and toward whom. Third, the paragraph about art and genius seems to be carrying real logical weight in getting her from the complaint about Young's moralizing to the closing lines about love, pity, and justice not needing to explain themselves, but I cannot reconstruct the connecting steps for myself. If you also have a view on how this fairly severe, early piece of polemic sits alongside the gentler treatment religious feeling gets in her later novels, I would be glad to hear it, but what I am most after is help with the argument actually in front of me, rather than a general summary of its conclusion.
