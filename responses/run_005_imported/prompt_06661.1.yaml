answer: |-
  Here’s a toast that weaves your insights into a warm, inclusive narrative – honoring the science without lecturing, while keeping Grandma fully engaged. (Timed at ~4 minutes when delivered with natural pauses):

  ---

  **(Raise glass, smile warmly at the couple, then scan the room)**  

  "Good evening, everyone. For those who don’t know me, I’m [Your Name], the immensely proud older sibling of our brilliant bride. Now, when [Sister's Name] asked me to give a toast, I have to admit… I felt a bit like a gazelle who’d wandered into a lion’s den of behavioral ecologists. *(Light laughter, glance towards the scientists)*. Especially knowing that [Fiancé's Name] spent years studying why animals do seemingly risky things – like stotting – to prove their quality.  

  Over the years, trying to keep up with my sister’s world, I’ve learned a little about this. I learned that in nature, the most convincing signals aren’t the easiest ones. A flashy feather or a loud call can be cheap. True reliability comes when the signal *costs* something real – something only a truly committed individual can afford. It’s the hard proof that backs up the promise.  

  **(Pivot warmly to the couple)**  

  Well, [Sister's Name] and [Fiancé's Name], your love story isn’t happening on the savannah, but in the labs, field sites, and yes, the agonizing stretches of long distance that define academic life. And anyone can stand up here and say the easy things: 'They’re perfect for each other!' 'Look how happy they are!' *(Smile)* And believe me, both of those things are absolutely, undeniably true. I *have* never seen my sister happier, or more perfectly matched.  

  But knowing this room – knowing the brilliant minds here, especially [Fiancé's Name]'s old lab mates – *(playful nod to them)* – I also know that some of you might be thinking, ‘Sure, that’s nice… but where’s the *evidence*?’ Because in your world, talk is cheap. Trust is earned.  

  **(Lean in slightly, more intimate tone)**  

  So let me tell you about a signal that wasn’t cheap at all. Three years ago, the long-distance strain was real. [Sister's Name] was headed for fieldwork on one continent, [Fiancé's Name] potentially on another. The path forward looked… perilous. That’s when [Fiancé's Name] faced a choice. A really big one. He was offered a prestigious postdoc position, the kind that makes a CV shine – but it would have meant another ocean between them.  

  Instead, he chose [Sister's Name]. He turned down that gleaming opportunity and took a less flashy, less 'optimal' postdoc position… right here in *her* city. He chose proximity. He chose *us*. He chose *her*, knowing the cost to his own immediate career trajectory. That wasn’t just a sweet gesture; that was a genuine investment. A sacrifice. Something that truly *cost* him something valuable.  

  **(Address the room, inclusive gesture)**  

  Now, for the biologists here, you know this isn’t about runaway selection for arbitrary traits. *(Brief, dismissive wave)* That’s peacock tails and fancy dances that don’t necessarily *mean* anything deep. This was different. This was an *honest signal* – the kind Zahavi talked about. The cost proved the quality. It proved his commitment was real, tangible, and built to last. He wasn't just saying 'I love you'; he was demonstrating it in a way that couldn't be faked.  

  **(Turn fully to the couple, emotion genuine)**  

  And [Sister's Name], you saw that signal for exactly what it was – the profound proof of his love and dedication. It laid the foundation for everything that followed. That decision wasn't just about geography; it was the bedrock declaration that *you* were his priority. His future.  

  **(Raise glass higher)**  

  So tonight, we’re not just celebrating the easy words or the obvious joy – though there’s so much of that here! We’re celebrating the hard proof. The costly, beautiful, undeniable evidence of a love strong enough to reshape plans, redirect careers, and build a shared life from the ground up. You two didn’t just find each other; you’ve *proven* to each other, and to all of us, the depth of your commitment.  

  To [Sister's Name] and [Fiancé's Name] – may your marriage be filled with endless joy, unwavering partnership, and a lifetime of honest, costly, and utterly priceless signals of your love. Cheers!"

  **(Clink glasses, sustained applause)**

  ---

  **Why this works:**

  1.  **Acknowledges the Science (Subtly):** Uses accessible metaphors (gazelle stotting), name-drops Zahavi and the core concept of costly/honest signaling without jargon. The nod to runaway selection is brief and framed as "not this," satisfying the experts without confusing others.
  2.  **Centers the Costly Signal:** The postdoc story isn't just an anecdote; it's explicitly framed *as* the costly signal that validates all the "cheap talk" sentiments. It's the evidence demanded by the theory.
  3.  **Resolves the Tension:** Directly addresses the user's fear ("some of you might be thinking...") and uses it to pivot into the evidence. This makes the scientists feel seen and understood.
  4.  **Works for Grandma:** The core story (he gave up a big job opportunity to be near her!) is universally understandable and touching. The scientific framing enhances it for those in the know but doesn't obstruct the emotional core for those who aren't. The "easy words" like "perfect for each other" and "never happier" are still included, but *supported* by the evidence.
  5.  **Warm & Toasty:** Maintains a celebratory, loving, and slightly playful tone throughout. Focuses on the couple's love, commitment, and future. The "Cheers!" is warm and traditional.
  6.  **Structure:** Clear narrative arc: Hook (gazelle/lion den) -> The Theory (costly signals) -> The Easy Words (cheap talk) -> The Problem (need evidence) -> The Evidence (postdoc sacrifice) -> The Scientific Nuance (not runaway) -> The Emotional Payoff (proof of love) -> The Toast.
  7.  **Timing:** The language is concise yet evocative. Delivered with natural warmth and pauses, this should hit the 4-minute mark perfectly.

  This toast uses the theory as a powerful lens to elevate a deeply personal story, making it resonate profoundly with the specific audience while retaining universal warmth. It gives the scientists their satisfying "aha!" moment without alienating anyone else.
