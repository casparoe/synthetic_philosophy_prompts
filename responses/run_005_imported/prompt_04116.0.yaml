prompt: |-
  Random thing that's been bugging me: I teach contextualism and pragmatic encroachment back to back every semester, and I keep telling students they're basically two different answers to the same DeRose-style bank cases, but when they push me on it I can't always cash out why the two views aren't just notational variants of each other dressed up in different vocab. Both are happy to say 'S knows that p' is true given one stakes-situation and false given another, holding S's evidence completely fixed. What I actually want from you is this: what's doing the real theoretical work that keeps contextualism and subject-sensitive invariantism apart, and can you walk me through a case where the attributor and the subject sit in different stakes situations (say, a relaxed attributor gossiping about a subject who has a ton riding on the answer), so the two views actually spit out different verdicts on the knowledge ascription instead of just different explanations for the same verdict? I can never keep straight which view is suppose to say what in that kind of case.
reasoning: |-
  Okay, the user is teaching contextualism and pragmatic encroachment and is struggling to explain the difference between them to students. They need a clear case where the two theories give different verdicts, especially when the attributor and subject are in different stakes situations. Let me start by recalling the core distinctions.

  Contextualism says that the truth conditions of "knows" depend on the attributor's context. So, when an attributor says "S knows p," the standards are set by how high the stakes are for the attributor. Pragmatic encroachment, or subject-sensitive invariantism (SSI), ties the truth to the subject's context. The subject's stakes determine whether they know, regardless of who's attributing.

  The key scenario the user mentioned involves a low-stakes attributor and a high-stakes subject. For example, a relaxed friend (low stakes) talking about someone who has a lot on the line (high stakes). Let's build that case. 

  In the bank case, the subject, Hannah, is about to deposit a check. If she's wrong about the bank being open Saturday, she faces a huge penalty. The attributor, Lois, is just gossiping and has no stake in it. 

  Under contextualism, Lois's context sets the standard. Since Lois's stakes are low, the standards for "knows" are low. So even though Hannah is in a high-stakes situation, Lois can truthfully say "Hannah knows the bank is open." Contextualism focuses on the attributor's context.

  Under SSI, the subject's stakes matter. Hannah's high stakes mean she needs more evidence to know. Even if Lois says "Hannah knows," the statement's truth depends on Hannah's context. So SSI would say Lois's claim is false because Hannah doesn't meet the high-evidence threshold required by her situation.

  The user needs a clear divergence in verdicts. Here, contextualism says the ascription is true (low attributor standards), while SSI says it's false (high subject standards). That's the key difference.

  I should also mention other factors like retraction and disagreement. For example, if Hannah later says, "I didn't know back then," contextualism might explain that as a shift in context, whereas SSI might say she's wrong if her past self met the standards then. But the main point is the attributor-subject stakes misalignment case.

  The user's deeper need is to have a concrete example to show students where the theories clearly diverge, moving beyond abstract explanations. They also want to avoid the notational variant problem by highlighting how each theory handles different contexts of ascription versus subject situation.
answer: |-
  You've nailed the core frustration! Contextualism and Subject-Sensitive Invariantism (SSI, the main form of pragmatic encroachment) *do* agree on the core data point: the truth-value of "S knows that p" can vary with practical stakes *even when S's evidence is fixed*. The confusion arises because they locate the source of that variance in fundamentally different places. The key divergence happens precisely in the case you describe: **misaligned stakes between attributor and subject.**

  Here's the breakdown and the crucial case:

  **The Core Theoretical Divide:**

  1.  **Contextualism:** The word "knows" is **context-sensitive**. Its *semantic content* (the standard it requires) shifts depending on the context of the person *attributing* knowledge (the speaker). "Knows" works like "tall" or "flat" – what counts as satisfying the term depends on the attributor's conversational context and the standards salient *there*.
  2.  **Subject-Sensitive Invariantism (SSI):** The word "knows" has a **fixed, invariant semantic content**. What *does* vary is what's *required* to meet that fixed standard. Specifically, the practical stakes faced by the *subject* (S) determine how much evidence (or how strong an epistemic position) S needs to possess in order to *count* as knowing. High stakes *raise the evidential threshold* for the subject.

  **The Crucial Divergence: Misaligned Stakes (Low Attributor / High Subject)**

  Let's construct the case you need:

  *   **The Subject (Hannah):** Hannah is about to deposit an important check on Friday afternoon. If she fails to deposit it by Saturday, she faces a *catastrophic* outcome: her mortgage payment will bounce, triggering massive penalties and potentially foreclosure. She calls the bank and hears the familiar recording: "Open 9 AM - 1 PM Saturday." She also remembers depositing checks on Saturdays before. Hannah thinks, "Okay, the bank is open tomorrow, I'll deposit it then." **Hannah is in a VERY HIGH STAKES situation.**
  *   **The Attributor (Lois):** Lois is Hannah's friend, relaxing at home on Friday evening. She has no mortgage worries and no stake in Hannah's deposit. She's gossiping with another friend, Chloe. Chloe mentions seeing Hannah near the bank earlier. Lois casually remarks: "Oh yeah, Hannah knows the bank is open tomorrow. She heard the recording and has gone on Saturdays before." **Lois is in a VERY LOW STAKES context. Her conversational standards are relaxed.**

  **The Question:** Is Lois's statement, "Hannah knows the bank is open tomorrow" **true**?

  **The Divergent Verdicts:**

  1.  **Contextualism's Verdict: TRUE**
      *   *Why?* Contextualism looks at the attributor's context to set the standard for "knows." Lois is in a low-stakes, gossipy context. The standards for knowledge ascription *in this conversation* are low. Given Hannah's evidence (the recording, past experience), she easily meets *Lois's low standards*. Therefore, Lois's statement "Hannah knows" is **true**.
      *   *Focus:* The truth of the *attribution* is determined by the attributor's context. Hannah's high stakes are irrelevant to the *truth* of Lois's *claim*; they only become relevant if *Hannah herself* were to claim "I know" in *her* high-stakes context (where it would likely be false).

  2.  **Subject-Sensitive Invariantism (SSI)'s Verdict: FALSE**
      *   *Why?* SSI looks at the *subject's* situation to determine the evidential threshold required for knowledge. Hannah is in an extremely high-stakes situation. To *know* the bank is open tomorrow, she needs *very strong evidence* – evidence strong enough to rule out relevant alternatives given the disastrous consequences of being wrong. The recording and memory of past Saturdays are *not* sufficient evidence for Hannah to meet this high threshold; she should probably go check *right now* or deposit today. Therefore, Hannah **does not know** (according to the fixed standard + subject-sensitive threshold). Lois's statement "Hannah knows" is therefore **false**, *even though Lois is in a low-stakes context*.
      *   *Focus:* The *truth condition* for "S knows p" depends on S's situation. Lois is simply *wrong* in her low-stakes attribution because she's misjudging what Hannah's high stakes *require* for Hannah to count as knowing.

  **Why This Isn't Just Notational Variance:**

  *   **Different Truth-Makers:** In this misaligned case, the theories assign **different truth-values to the very same utterance ("Hannah knows") in the very same attributor context**. Contextualism says it's true; SSI says it's false. This is a concrete, testable difference in their predictions about the world.
  *   **Different Explanatory Targets:** Contextualism primarily explains why *ascriptions* seem true or false *to the people making them* in different contexts. SSI primarily explains why *subjects* seem to know or not know *in their own situations*.
  *   **Different Loci of Variance:** Contextualism locates the variance in the *meaning* of the word "knows" (semantics). SSI locates the variance in the *epistemic conditions required to satisfy* a fixed meaning (metaphysics/epistemology).

  **Other Points of Divergence (Reinforcing the Difference):**

  1.  **Retraction:** Imagine Hannah later (after the mortgage disaster is averted) says, "Lois was wrong last week when she said I knew the bank was open. I didn't *really* know!"
      *   **Contextualism:** Hannah is arguably *correct* to retract. Lois's utterance was true *in Lois's low context*, but Hannah is now speaking in a context where higher standards are salient (perhaps reflecting on the close call). The *content* of Lois's claim was weak, but Hannah is evaluating it against her current strong standards.
      *   **SSI:** Hannah is *incorrect* to retract. Lois's statement was *false* at the time because Hannah didn't meet the (subject-determined) knowledge threshold. The fact that Hannah *now* thinks she didn't know doesn't change the past fact that she *didn't* know *then*.
  2.  **Disagreement:** Imagine Lois (low stakes) says "Hannah knows" and Chloe (who is aware of Hannah's high stakes) says "No, she doesn't!" in the same conversation.
      *   **Contextualism:** This might be a *merely verbal* disagreement. Lois is using "knows" with low standards; Chloe is (perhaps implicitly) raising the standards. They aren't contradicting each other about the same proposition; they are setting different standards. They could both be right relative to their intended standards.
      *   **SSI:** This is a *genuine factual* disagreement. There is one fact: does Hannah meet the fixed knowledge standard *given her stakes*? Lois says yes (underestimating Hannah's stakes/threshold); Chloe says no (correctly assessing them). Only one can be right.

  **Conclusion:**

  The **misaligned stakes case (low attributor / high subject)** is the litmus test. Contextualism makes the knowledge ascription **true** (because the attributor's standards are low). SSI makes it **false** (because the subject's high stakes mean their evidence is insufficient). This fundamental difference in truth-value prediction for the *same utterance* shows they are not mere notational variants. Contextualism ties truth to the attributor's conversational scoreboard; SSI ties it to the subject's practical predicament. Keep pointing your students to that misalignment – it forces the views apart.
