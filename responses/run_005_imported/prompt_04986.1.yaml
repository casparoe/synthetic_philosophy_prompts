prompt: |-
  I've long been a reader of the rationalist blogs and forums where precommitment devices are a recurring topic -- Schelling on the strategic value of binding oneself, Beeminder-style commitment contracts for beating akrasia, and so on -- and a recent conversation with some friends about that literature sent me down a path I hadn't expected: noticing that the term "Ulysses contract" is actually used for two quite different things, and wondering whether the comparison between them is as clean as it's usually assumed to be.

  The first is the individual-level use from psychiatric ethics: a patient with a condition like bipolar disorder, while lucid and legally competent, signs an advance directive instructing doctors to have her involuntarily hospitalized and medicated the next time she becomes manic, overriding whatever objections she raises at the time. The second is Jon Elster's well-known extension of the same Odysseus-at-the-mast image to constitutions: bills of rights, supermajority amendment rules, and judicial review as devices that let a polity's more reflective self bind its own future majorities against momentary passion. Elster developed this application across _Ulysses and the Sirens_ and then substantially qualified it in the later _Ulysses Unbound_, growing considerably more doubtful that constitution-makers are really doing anything like what Odysseus did.

  Here is what I can't settle on my own, and what I'd like you to work through carefully rather than gesture at. The standard objection to the psychiatric case is that a manic episode might not be mere irrationality being restrained by a wiser self, but could express something more like a genuine, if unwelcome, shift in what the person values -- making the directive less like Odysseus overruling a temporary delusion and more like one person overruling another. The standard objection to the constitutional case, going back to Jefferson's argument with Madison over whether the dead can bind the living, is that a later generation is not even numerically the same agent as the one that wrote the constraint -- unless, that is, one follows Bruce Ackerman in relocating the relevant agent from a past generation to "the People" acting in its higher, constitution-making capacity, as opposed to its ordinary-politics capacity, a move that starts to look structurally similar to distinguishing a patient's lucid, planning self from her manic, acting self. The question, then, is whether these two objections are really the same worry wearing different vocabulary -- personal identity in one case, popular sovereignty in the other -- such that whatever rescues one case ought to rescue the other, or whether one of the two uses of "Ulysses contract" is resting on much shakier ground than the other for reasons that have nothing to do with the other case at all. I'd like an actual verdict rather than a survey of considerations: which of the two is the more defensible way to bind a future self against its own contemporaneous wishes, and does Elster's retreat between his two books track a genuine asymmetry between the cases, or was he simply being overcautious?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're deeply familiar with rationalist concepts like precommitment devices, specifically Ulysses contracts in two contexts: psychiatric ethics and constitutional theory. The user points out that these two applications are often conflated but might have fundamental differences. Their core question is whether the objections to each—personal identity vs. popular sovereignty—are essentially the same issue, and which version of the Ulysses contract is more defensible.

  First, I need to recall the key arguments for both scenarios. In the psychiatric case, the objection is that a manic episode might represent a shift in values, not just irrationality. For the constitutional case, it's about whether past generations can bind future ones. The user mentions Ackerman's distinction of "the People" in different capacities, similar to the patient's lucid vs. manic selves. 

  The user wants a verdict, not just a discussion. They also ask if Elster's retreat in his later work is justified by an asymmetry or if he was overcautious. So, I need to determine if there's a real asymmetry between the two cases.

  Let me break down the psychiatric case. The argument hinges on continuity of personal identity. If the manic self is still the same person but with altered values, overriding their wishes becomes ethically problematic. However, evidence shows that bipolar patients often return to their baseline values post-episode, suggesting that the directive reflects their enduring identity. The core issue is whether the episode represents a temporary lapse or a different self.

  For the constitutional side, the objection is about collective agency. Jefferson's point that the dead can't bind the living challenges the idea of a continuous "People." Ackerman's dualist approach tries to resolve this by distinguishing between higher law-making and normal politics. But here, the problem is metaphysical—whether a polity remains the same entity over time. Unlike the individual case, there's no clear return to a "lucid" state; societal values evolve continuously.

  The key asymmetry is in continuity and persistence. An individual's identity persists through episodes, validated by their return to baseline. In contrast, a polity's identity is a constructed narrative without a consistent baseline. This makes constitutional precommitments more vulnerable to the objection of binding a different agent.

  Elster's retreat likely recognizes this asymmetry. His later skepticism about constitutions as true Ulysses contracts stems from the lack of a persistent agent, unlike the psychiatric case. The user's insight that Ackerman's move mirrors the self-distinction in psychiatry is astute, but it doesn't resolve the deeper issue of collective identity over time.

  Therefore, the psychiatric Ulysses contract is more defensible. Elster wasn't overcautious; he identified a genuine flaw in extending the metaphor to constitutions. The verdict is that the individual case holds stronger due to clearer agent continuity.
answer: |-
  Your analysis cuts to the heart of a profound philosophical and practical tension. After carefully weighing the parallels and asymmetries, the verdict is clear: **The psychiatric Ulysses contract is the more defensible form of precommitment, while the constitutional variant rests on significantly shakier ground due to a fundamental asymmetry in agent continuity.** Elster’s retreat in *Ulysses Unbound* tracks a genuine flaw in the constitutional analogy—he was not overcautious but correctly identified a structural weakness.

  Here’s the rigorous breakdown supporting this conclusion:

  ### 1. **Core Asymmetry: Persistence of the Agent**
     - **Psychiatric Case:** The *same biological and legal person* persists through both states (lucid/planning and manic/objecting). The "self" binding and being bound share a continuous identity, even if values *appear* to shift episodically. Crucially, bipolar mania is medically understood as a *pathology distorting* cognition and judgment—not a valid expression of new values. Post-episode, patients overwhelmingly endorse their advance directives, confirming the directive reflects their enduring "true self" (supported by empirical studies like those of S. Paul Appelbaum).
     - **Constitutional Case:** The "people" binding (e.g., 1787 Framers) and the "people" being bound (e.g., 2024 citizens) are *not numerically identical*. No metaphysical or legal fiction (like Ackerman's "dualist democracy") can bridge this gap. Generational turnover means the constrained majority is *literally a different collective agent*. Jefferson was ontologically correct: the dead cannot bind the living without consent.

  ### 2. **The Value-Change Objection: A False Equivalence**
     - **In Psychiatry:** The "shift in values" during mania is *epiphenomenal to dysfunction*. Neurochemical dysregulation drives impulsivity, grandiosity, and impaired reasoning—not authentic value evolution. The directive restores access to *pre-existing*, reflectively endorsed values. This is Odysseus silencing the Sirens' *illusion*, not overriding a genuine preference.
     - **In Constitutions:** Value shifts across generations (e.g., evolving views on equality) are *authentic* and *irreducible*. A supermajority requirement or entrenchment doesn't correct a pathology; it *suppresses* new majorities with substantively different normative commitments. This isn’t Odysseus resisting temptation—it’s Odysseus binding Telemachus.

  ### 3. **Ackerman’s Move Fails to Rescue the Constitutional Case**
     Ackerman’s distinction between "the People" in constitutional vs. ordinary moments superficially mirrors the lucid/manic self but collapses under scrutiny:
     - **Lack of Baseline:** Unlike the patient’s lucid state (a medically identifiable baseline), "We the People" in a "constitutional moment" is a *mythologized construct*. Who defines this moment? (e.g., Was the New Deal a constitutional moment? Legal realists vs. originalists clash endlessly).
     - **No Return Path:** A manic patient *returns* to their directive-writing self, creating a feedback loop for validation. Constitutions lack this: later generations cannot "return" to the Framers' perspective to verify alignment. The constraint is irrevocable without near-impossible procedural hurdles, freezing past priorities.
     - **Agency Problem:** Ackerman’s "higher self" is an abstraction. Concrete majorities—actual humans living now—bear the constraint’s cost. This violates the core Ulyssean premise: that the *same agent* benefits from their own prior restraint.

  ### 4. **Elster’s Retreat Reflects Genuine Asymmetry**
     Elster’s shift from enthusiasm (*Ulysses and the Sirens*) to skepticism (*Ulysses Unbound*) was warranted. His key insight: constitutions often fail as *self*-binding devices because:
     - **Strategic, Not Psychological:** Constitutional constraints are typically imposed by elites to bind *others* (future rivals or masses), not their "future selves." This is Machiavelli, not Odysseus.
     - **Collective Action Problems:** Unlike the individual, a "people" has no unified psychology to which rationality/akrasia cleanly applies. A constitution binding a future majority isn’t self-control—it’s *minority control*.
     - **No Epistemic Privilege:** The patient’s lucid self *is* epistemically privileged over their manic state (access to long-term goals, reality-testing). Constitution-makers have no comparable privilege over future generations facing unforeseen challenges.

  ### Verdict
  The psychiatric Ulysses contract is defensible because it preserves *agent identity* and addresses a *pathology*. The constitutional version is not merely weaker but *categorically distinct*: it binds *different agents* under the guise of collective selfhood, mistaking democratic dissent for irrationality. Elster was right to retreat—his later skepticism exposes a fatal flaw in the analogy. **Precommitment works for Odysseus because he remains Odysseus; it fails for constitutions because 1787 is not 2024.** The objections aren’t parallel worries; the constitutional case collapses under the weight of its own metaphysical fiction.
