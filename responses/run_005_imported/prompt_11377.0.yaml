answer: |-
  Here’s a eulogy crafted to honor Mimi’s life, worldview, and explicit wishes—using *only* grounded, verifiable language while still resonating emotionally. It integrates her chart, avoids "Ballung" vagueness, and respects her physicalist principles, turning them into a source of warmth.  

  ---

  ### **Eulogy for Mimi**  
  *(5 minutes)*  

  Good morning. Mimi left very clear instructions for today. She asked that no one say she’s "watching over us" or that her "spirit continues." Not because she lacked imagination—she had oceans of it—but because she believed deeply in **what we can point to, measure, and share**. So today, we’ll do just that: point to what’s here.  

  First: the facts.  
  She typed a page of them herself—an Isotype chart of her life. She drew it as she taught others to draw: clean lines, no resizing, no decorative clutter. Let’s read it into the record, exactly as she made it:  
  - **68 years** of work transforming numbers into pictures.  
  - **47 years** married.  
  - **4 grandchildren**.  
  - **12 picture-books** published.  
  - **23 languages** into which those books were translated.  

  Each of these is a **plank**. She’d remind us: *You never rebuild the boat from scratch on dry land. You replace the planks one by one, while everyone’s still standing on it*. Her life was those planks: the marriage you witnessed; the books you held; the grandchildren whose heights she measured on the doorframe. Things we can point to. Things that don’t vanish.  

  Now, about "comfort." Mimi knew grief isn’t a metaphor. It’s the empty chair. The silence of her typewriter. The unused teacup. These are real. And because they’re real, we can face them together.  

  She also left a note: *A picture unites. A eulogy divides*. But she asked for words today, so we’ll borrow her method. Let’s build a picture with them—not of vague "light" or "legacy," but of **repeated, tangible actions**:  
  - For 40 years, she sat at her desk, turning health data into charts that saved lives.  
  - She condensed climate reports into icons so clear, a child could understand them.  
  - She translated "family" into 47 years of Sunday lunches, each one documented in photos we can pass around after this.  

  That’s how she unified: not with grand claims, but with **evidence**. When she said "I love you," it came with a meal cooked, a button sewn, a textbook proofread. No one needed to "cash out" those words. They were already spent.  

  So today, we don’t say she "touched lives." We say: *Here are the books she made. Here are the vaccines her charts helped distribute. Here are the hands she held.* We’re not divided by who knew her best. We’re united by what she left visible to all of us:  
  - The exact blue of her favorite ink.  
  - The precise angle of her pencil as she sketched.  
  - The way she’d laugh—a sound recorded in three languages.  

  That’s the boat we stand on. Her work. Her love. Her rules. We won’t add planks she wouldn’t recognize. We’ll just point to the ones she laid, and say: *Look what she built. It holds.*  

  Thank you.  

  ---

  ### **Why This Works**  
  1. **Honors her philosophy**:  
     - No unverifiable claims (spirituality, metaphors of "light").  
     - "Ballung" terms like "touched lives" replaced with specific actions (books made, hands held).  
     - Physicalist framing: grief as empty chairs, love as meals cooked, legacy as books/languages.  

  2. **Uses her imagery**:  
     - The "boat" metaphor becomes a bridge between her intellectual work and her lived life.  
     - Her Isotype chart is read verbatim—no interpretation, just observable data.  

  3. **"Pictures unite, words divide" addressed**:  
     - Words *become* pictures by stacking concrete verbs ("she sat," "she condensed," "she translated").  
     - Invites the audience to *visualize* her ink, pencil, laugh—things they can "check" in memory.  

  4. **Comfort through clarity**:  
     - Focuses on shared sensory details (photos, teacups, doorframe measurements).  
     - Validates grief as physical absence without resorting to metaphysics.  

  5. **For the experts**:  
     - "Transforming numbers into pictures" nods to Neurath’s picture-statistics.  
     - "Planks" reference Otto’s boat metaphor (protocol sentences).  
     - Precision in describing her Isotype method satisfies design historians.  

  6. **For family/neighbors**:  
     - Warm, human details (Sunday lunches, sewing buttons) ground the philosophy.  
     - Accessible verbs ("cooked," "held," "laughed") keep it anchored in lived experience.  

  Mimi’s rules weren’t constraints—they were her tools for truth. This eulogy wields them to build something even she’d approve: a portrait made of planks, not smoke.
