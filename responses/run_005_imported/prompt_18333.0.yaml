  First, I need to understand the stakes: this is a Legislation/Statutory Interpretation seminar, and the TA is inexperienced but clearly diligent—they're consulting an independent source because they disagreed with their co-TA and lack confidence in their own calibration. The professor is relying on them for a first pass, so accuracy matters. 

  The student's answer is actually quite strong at first glance. They correctly identify textualism vs. purposivism frameworks, apply them to the hypothetical, and reach a conclusion. But the devil's in the details for JD-level grading. 

  Breaking it down: 
  - **Textualism definition** is spot-on (ordinary meaning, no external purpose). Full marks. 
  - **Purposivism definition** is mostly correct but oversimplifies by implying purposivism *always* overrides text (it doesn't—it fills gaps where text is ambiguous). That's a subtle but important distinction at this level. Deduct half a point.  
  - **Textualist application** nails the "recording" argument and the "unanticipated technology" point. Full marks.  
  - **Purposivist application** correctly identifies the harm equivalence but makes a critical error: citing *Holy Trinity* as Scalia's case (it's famously anti-textualist, and Scalia despised it). Also, they don't address counterarguments (e.g., whether "depicts" implies reality). Major deduction.  
  - **Overall argument** is coherent but doesn't grapple with textualism's counterpoints or the statutory language's flexibility. Surface-level.  

  The student's Scalia mix-up is particularly glaring—it's like citing Marx in a capitalism essay. For JD grading, historical accuracy on landmark cases is non-negotiable.  

  For improvements: They’d need to fix the *Holy Trinity* blunder, acknowledge textualism’s potential counter (e.g., whether "depicts" could include fakes), and deepen the "which method is better" rationale beyond policy outcomes.  

  Final score: 16/20 (B+) feels right. It’s a strong B+ paper—clear, structured, and mostly correct—but the case law error and lack of nuance in purposivism’s limits keep it from an A.  

  The TA should feel confident deducting for these points; if a student argues, they can point to:  
  1. Misattributing Scalia to *Holy Trinity* (objective error)  
  2. Overgeneralizing purposivism as text-overriding (doctrinally inaccurate)  
  3. Superficial engagement with textualism’s counterarguments (missed opportunity for depth)  

  This is exactly the kind of careful line-drawing the TA is learning—between "defensible simplification" (e.g., briefly summarizing theories) and "substantive error" (misstating core precedents).
