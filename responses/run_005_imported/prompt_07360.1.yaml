  ### Reasoning:
  1. **Indexical/Affiliation Theory (Nunberg)**: Best fit.  
     - Explains reclamation as in-group affiliation reshaping meaning (e.g., "we own this now").  
     - Accounts for out-group harm: outsiders lack the affiliative context, reactivating historical derogation.  
     - Mention-offense aligns with indexing oppressive histories even when quoted.  

  2. **Speech-Act/Subordination Accounts (Langton, McGowan, Popa-Wyatt)**:  
     - Slurs as subordinating speech acts explain initial harm and out-group reversion (re-enacting hierarchy).  
     - Reclamation becomes a counter-speech act resisting subordination.  
     - Mention-offense: Quoting may still perform subordinate-reinforcing acts in context.  

  3. **Perspectival Account (Camp)**:  
     - Derogation via speaker perspective (endorsing harmful ideologies) explains initial harm.  
     - Reclamation: In-group use shifts perspective to defiance/affiliation.  
     - Out-group harm: Outsiders’ use re-imposes the original perspective.  
     - *Weakness*: Less intuitive for why *mention* (without endorsement) offends.  

  4. **Prohibitionism (Anderson & Lepore)**:  
     - Excels at explaining mention-offense (taboo violation).  
     - *Fails reclamation/reversion*: Cannot explain how semantic content changes with reclamation or why out-group use reverts if the word is merely prohibited.  

  5. **Conventional-Implicature/Presuppositional Accounts**:  
     - Explains stable derogatory content (e.g., via presupposed negativity).  
     - *Fails reclamation*: Cannot coherently explain meaning inversion (how presupposed negativity vanishes in-reclaim).  
     - Mention-offense: Possible if presuppositions project.  

  6. **Combinatorial Externalism (Hom)**:  
     - Worst fit. Ties slurs rigidly to oppressive institutions (e.g., "deserves contempt for being X").  
     - Cannot explain reclamation (in-group use would still assert bigoted propositions).  
     - Out-group reversion is consistent but mention-offense/reclamation remain unexplained.
