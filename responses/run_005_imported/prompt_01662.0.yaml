  I should avoid making either debater a strawman. Let's see... the exploitation advocate needs to acknowledge alienation exists but subordinate it to surplus value extraction. The alienation theorist should grant exploitation happens but argue it's a symptom of deeper estrangement. 

  Key tension points to hit: 
