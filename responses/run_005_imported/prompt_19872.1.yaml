answer: |-
  The envelope arrived on Tuesday. Cream linen paper, no return address, Berlin postmark. Inside, a single sheet covered in a handwriting so familiar it made Mara’s knuckles whiten. *Her* handwriting. But sharper, somehow. More decisive.

  *Mara,*
  *It rains here today. Not the heavy, purposeful Ohio rain, but the kind Berlin does – a persistent, grey sigh that slicks the cobblestones near my apartment in Prenzlauer Berg. I walked to the gallery this morning, past the bakery where I buy that sourdough you always pretended to like. Remember how we’d debate the merits of dense German bread versus soft American loaves? Seems trivial now. The exhibition opens next week. Gerhard is nervous. I told him the critics will adore his brutalist ceramics, just as I told you that Berlin job was worth the leap. Funny, the things we know for others.*

  Mara dropped the letter as if it were hot. Her apartment in Cincinnati felt suddenly airless. Prenzlauer Berg. That was the neighborhood near the job she’d turned down. The gallery? Gerhard? Brutalist ceramics? None of it meant anything to her. And yet… the sourdough. She *had* pretended to like it on that one whirlwind interview trip. A detail too small, too stupidly specific, for anyone else to know.

  She called her twin, Solveig, in Norway. Voice thick with the new-baby exhaustion Mara simultaneously envied and recoiled from. “Another version of me?” Solveig yawned. “Sounds like you’ve been reading Leo’s philosophy books again. Or maybe it’s just the Ohio winter. Remember when we were ten, and we swore we could feel each other’s skinned knees? This is just… bigger skinned knees. Or bigger sourdough.” Solveig laughed, but Mara heard the echo of their old joke: *I’m living your other life.* Solveig had moved for love; Mara had stayed for fear. Now Solveig had a child, and Mara had… a letter.

  The letters kept coming. Every Tuesday. Berlin-Mara wrote about gallery openings (“Gerhard kissed me on both cheeks, French style, can you imagine?”), arguments with her landlord about radiator noise, weekend trips to windswept Baltic beaches. She wrote about the *feel* of things – the specific ache of walking home alone after a late vernissage, the way the light fell across her work desk in the afternoon, the taste of disappointment when a promising date fizzled. It was Mara’s internal landscape, meticulously described, but projected onto a city she’d abandoned.

  Mara devoured them, then hid them in a shoebox like contraband. Each letter was a mirror reflecting a life that pulsed with an energy hers lacked. Berlin-Mara was bolder, slightly sharper-edged, more at home in her own skin. Or was that just the projection of Mara’s regret? Was this woman *her*, truly her, living the path she’d rejected? Or was she just a stranger with Mara’s handwriting, her memories, her deepest fears and quietest joys? A terrifyingly good copy?

  The distinction became an obsession. She’d reread a passage – *The U-Bahn smells like wet wool and determination today* – and ask the empty room: “Is that *my* feeling? Am *I* smelling that determination right now, somehow?” Or Berlin-Mara would describe a petty triumph at work, and Mara would feel a flicker of pride, instantly followed by a sickening lurch: *Why am I proud? That’s not me. That’s… her. Whoever she is.*

  She met Leo for coffee. He saw the shadows under her eyes. “Still spinning?” he asked gently.
  “The letters,” she whispered, the confession tearing out. “She writes. The Berlin me.”
  Leo’s eyes widened, not with disbelief, but with intellectual fascination. “Fascinating! Actual empirical data for the modal realism debate! Lewis would say–”
  “Don’t,” Mara cut in, sharp. “Don’t give me Lewis or Kripke. Tell me… if she won an award, Leo. If *she* got the huge promotion, the perfect partner, the life I think I wanted… why doesn’t it *feel* like *I* won it? Why does it just feel… hollow? Like hearing good news about a very distant, very successful cousin I vaguely resemble?” She thought of Humphrey, the man Leo mentioned who lost the election. Would he care if his *counterpart* won elsewhere? Truly care, deep in his gut?
  Leo stirred his coffee, frowning. “That’s the crux, isn’t it? The identity question. *Is* she you? If she’s numerically identical, then her triumphs *are* yours, in some profound sense. Her joys resonate in your being. But if she’s merely a counterpart… the best possible resemblance life could produce… then her life is just a story. A compelling, heartbreaking story about someone *like* you, but fundamentally separate. Her success is hers alone. Your regret… remains solely yours.”
  “But how do I *know*?” Mara’s voice cracked. “How do I know which it is? The letters feel so *real*. They feel like *me* talking to me!”
  “Does she sign her name?” Leo asked quietly.
  “Mara. Just Mara.”

  One Tuesday, the letter was different. Thinner. The handwriting jagged.

  *Mara,*
  *He left. Matthias. Last night. Said the gallery consumes me, said I’m never truly present, always chasing the next opening, the next connection. He said I live like I’m trying to outrun something. Maybe I am. Maybe I’m trying to outrun the ghost of the woman who stayed in Ohio. Is she happier? Does she feel this… this hollowed-out panic? Does she lie awake wondering if the choice was a colossal mistake that fractured her very being? Does she wonder if I’m even real? Or if she’s just dreaming me into existence to punish herself?*

  Tears blurred the ink. The Berlin certainty was gone, replaced by a raw vulnerability that mirrored Mara’s own late-night terrors. The parallel pain was undeniable, agonizingly precise. Was this *her* loneliness echoing across some impossible divide? Or was it just a cruel coincidence, a stranger’s heartbreak that happened to rhyme perfectly with her own?

  Mara didn’t sleep. She sat by her window, watching the sodium glow of Cincinnati, thinking of Berlin’s greyer light. She thought of Solveig holding her newborn, living the "other life" with a tangible, demanding reality. She thought of Matthias, a man she’d never met, breaking the heart of a woman who might be her, or might be the most elaborate forgery imaginable.

  The question wasn't just *what* Berlin-Mara was. It was *why the distinction mattered so desperately*. If this other Mara was truly, numerically *her* – then her suffering *was* Mara’s suffering, her potential joy Mara’s joy. Knowing that life was being lived, fully, *somewhere*, could be a solace, even if inaccessible. But if she was merely a counterpart, a stunningly accurate cosmic mimic… then her existence was just a taunt. Proof positive of the road not taken, inhabited by a ghost who got to live the dream while Mara languished with the consequences of her choice. Her success would be a jewel Mara could see but never touch, belonging utterly to another.

  And her pain? If Berlin-Mara was just a counterpart, then her current agony over Matthias was just… noise. A sad story happening to someone else. It didn't absolve Mara’s regret; it just made the other life seem less enviable, momentarily. But it didn’t *connect*. It offered no shared burden, no sense of a wider self experiencing the full spectrum.

  Mara picked up a pen. The blank page glared. Who was she writing to? Herself? A stranger? Did the answer change the weight of the words? She thought of Humphrey. If his counterpart won the presidency in some other world, did that ease the sting of *his* loss? Did it matter if that winner was "literally" him or just his perfect double? Wouldn't he still stand in the rain outside the Capitol, feeling the cold reality of *his* defeat, utterly untouched by the celebration happening elsewhere to someone who looked and acted just like him?

  Her hand hovered. She wanted to write: *I feel your loneliness. It is mine.* But was that true? Or was it just empathy for a hauntingly familiar ghost? She wanted to write: *Matthias is a fool.* But did she have the right, if Berlin-Mara wasn't truly *her*? The pen felt heavy with unanswerable metaphysics.

  Finally, she wrote just two lines, the only truth she could grasp:

  *The ghost is real. I hear her.*
  *But I don’t know whose tears these are.*

  She didn’t sign it. She slipped it into an envelope, addressed vaguely to Prenzlauer Berg, Berlin. She had no idea if it would reach anyone. She only knew that the silence between the worlds, between the theories, between the choices, was a void she could no longer bear. The question – *Is she me?* – remained, a knot she couldn’t untie, but the need to whisper into the dark, towards that other flickering consciousness, whether it was her own deepest self or the universe’s most poignant echo, was suddenly, absolutely necessary. The distinction might determine how she *should* feel, but it couldn't stop the feeling itself. The connection, however impossible, was already written.
