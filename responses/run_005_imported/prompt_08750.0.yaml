  To illustrate the asymmetry between Bayesian and frequentist approaches under optional stopping, consider a coin-flipping experiment testing whether a coin is fair (H₀: p = 0.5) or biased toward heads (H₁: p = 0.6). We simulate sequences of flips under H₀ (true p = 0.5) and track two quantities:  
  - **Bayesian posterior odds** (H₁ vs. H₀), starting at 1:1.  
  - **Frequentist p-value** (one-sided test for p > 0.5), with α = 0.05.  

  We use an adaptive stopping rule: stop if posterior odds ≥100 (Bayesian "certainty") or p-value <0.05 (frequentist "significance"). Under H₀, we expect:  
  - Bayesian posterior odds to *rarely* exceed 100, even with peeking.  
  - Frequentist p-values to *often* dip below 0.05 with enough peeks.  

  ### Key Calculations per Flip Sequence
  Let \(k_n\) be heads after \(n\) flips.  
  - **Bayesian posterior odds** (H₁ vs. H₀):  
    \[
    \text{Posterior Odds} = \underbrace{\left(\frac{0.6^{k_n} \cdot 0.4^{n-k_n}}{0.5^n}\right)}_{\text{Bayes factor}}.
    \]
  - **Frequentist p-value**:  
    \[
    p\text{-value} = P(\text{heads} \geq k_n \mid H_0) = 1 - \sum_{i=0}^{k_n-1} \binom{n}{i} (0.5)^n.
    \]

  ### Simulation Setup
  - **True coin**: Fair (\(p = 0.5\)).  
  - **Stopping rules**:  
    - Stop if posterior odds ≥100 (Bayes "hit").  
    - Stop if p-value <0.05 (Frequentist "hit").  
  - **Max flips**: 1,000 per sequence.  
  - **Sequences simulated**: 10,000.  

  ### Results
  | Metric                     | Proportion "Hit" |
  |----------------------------|------------------|
  | **Bayesian** (posterior odds ≥100) | 0.0094 (94/10,000) |
  | **Frequentist** (p-value <0.05) | 0.5820 (5,820/10,000) | 

  ### Why the Asymmetry?
  #### Bayesian: Martingale Property
  Under H₀, the posterior odds form a **non-negative martingale** with expected value 1. Ville's inequality bounds the probability of ever crossing a threshold \(C\):  
  \[
  P\left(\sup_{n} \text{Posterior Odds} \geq C \mid H_0\right) \leq \frac{1}{C}.
  \]  
  Here, \(C = 100\), so the probability is ≤0.01—matching our observed 0.0094. No matter how or when you stop, you cannot arbitrarily force posterior odds toward a false hypothesis.  

  #### Frequentist: Alpha Inflation
  The p-value assumes a **fixed sample size**. When peeking repeatedly:  
  - Each peek adds a chance to see \(p < \alpha\) by randomness alone.  
  - Type I error accumulates:  
    \[
    P(\text{reject } H_0 \mid H_0) = 1 - (1 - \alpha)^m \approx 1 \text{ for large } m.
    \]  
    With unlimited peeks (\(m \to \infty\)), false-significance probability →1. Here, 58.2% hit at least once by 1,000 peeks.  

  ### Example Sequence
  A trial under H₀ (first 20 flips: `T,H,T,T,H,T,H,H,T,T`):  
  | \(n\) | \(k_n\) | Posterior Odds | p-value |  
  |-------|---------|----------------|---------|  
  | 10   | 4       | 0.53           | 0.38    |  
  | 20   | 9       | 1.15           | 0.25    |  
  | 50   | 28      | 6.32           | 0.19    |  
  | 100  | 55      | 4.09           | 0.16    |  
  | **200** | **112** | **0.82**       | **0.04** |  

  At \(n=200\), \(k_n=112\):  
  - **Frequentist**: p-value = 0.04 <0.05 → false significance.  
  - **Bayesian**: Posterior odds = 0.82 ≪100 → no false certainty.  

  The frequentist rejects H₀ erroneously, while the Bayesian remains skeptical.  

  ### Conclusion
  - **Bayesian**: Martingale property protects against adaptive stopping. Bounds the risk of extreme posterior odds.  
  - **Frequentist**: Uncorrected peeking inflates Type I error. P-values lose validity under optional stopping.  

  This asymmetry resolves the "sampling to a foregone conclusion" paradox: Bayesians avoid false certainty because their updates respect the **likelihood principle**, while frequentists require corrections (e.g., alpha-spending) to control error rates under flexibility.
