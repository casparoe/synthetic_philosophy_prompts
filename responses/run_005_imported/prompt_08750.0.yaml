  Under H0, the p-value at each step is uniform(0,1) if the test is exact and we look only once. But because we are looking multiple times, the chance that at least one p-value is below 0.05 is much higher. In fact, it approaches 1 as N increases. This is the problem of optional stopping for frequentists.

