  We are going to compare Bayesian and frequentist approaches in the context of sequential testing (i.e., when we can peek at the data and decide when to stop). The classic example is flipping a coin. We want to test if the coin is fair (H0: p = 0.5) or biased towards heads (H1: p = 0.6). 

  We will see that a frequentist using p-values can be misled by optional stopping (i.e., stopping when the data looks favorable) because the p-value is computed under the assumption of a fixed sample size. On the other hand, a Bayesian using posterior odds (or Bayes factors) is protected by the martingale property: the expected posterior odds under the true hypothesis at any stopping time are the prior odds. This implies that the probability that the posterior odds ever become very large in favor of a false hypothesis is bounded.

  Let's set up a simple Bernoulli model. We flip a coin repeatedly. The true probability of heads is p. We consider two hypotheses:
  - H0: p = 0.5
  - H1: p = 0.6

  We assume prior odds of 1:1 (i.e., P(H0)=0.5, P(H1)=0.5). The Bayes factor (BF) is the ratio of the likelihoods under H1 and H0. After n flips with k heads, the BF is:

  BF = [ (0.6)^k * (0.4)^(n-k) ] / [ (0.5)^n ]

  The posterior odds = prior odds * BF. Since prior odds are 1, the posterior odds = BF.

  In the Bayesian setting, we stop at some time t (which may depend on the data) and compute the posterior odds. We are concerned with the event that we are misled, i.e., when H0 is true but the posterior odds in favor of H1 become very large.

  Under H0 (the true state), the sequence of posterior odds (as a process over time) is a martingale. Specifically, let M_n = posterior odds after n flips (if we were to stop at n). Then, under H0, we have:

  E[M_{n} | M_{n-1}, ..., M_0] = M_{n-1}

  This is the martingale property. Why? Because under H0, each flip is fair (p=0.5) and the increment in the log odds is a mean-zero step. Alternatively, we can note that the Bayes factor is a likelihood ratio and under the null hypothesis (which is simple) the likelihood ratio is a martingale.

  A key consequence is that the expected value of M_n (under H0) at any fixed time n is the prior odds (which is 1). But more importantly, for any stopping time T (that depends only on the past data), we have by the optional stopping theorem (if the stopping time is bounded or if the martingale is uniformly integrable) that E[M_T] = E[M_0] = 1.

  However, we are interested in the probability that the posterior odds become very large. We can use Ville's inequality (a martingale version of Kolmogorov's inequality) which says that for a nonnegative martingale starting at 1, the probability that it ever reaches a level C is at most 1/C. That is:

  P( sup_{n} M_n >= C ) <= 1/C.

  Therefore, under H0, the probability that the posterior odds (in favor of H1) ever become 100 or more is at most 1/100. So the Bayesian is protected: even with optional stopping, the chance of being misled (by a factor of 100) is at most 1%.

  Now, let's see what happens in the frequentist setting. The frequentist computes a p-value. The p-value is the probability (under H0) of observing a result at least as extreme as the one observed. But if the sample size is not fixed, then the definition of "at least as extreme" becomes problematic. Moreover, if we stop when we first see a significant result (without correcting for multiple looks), the p-value becomes invalid.

