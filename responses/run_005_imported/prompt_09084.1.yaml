answer: |-
  You've pinpointed a genuinely challenging and crucial tension in these remarks. Wittgenstein is grappling with the *foundational* nature of hinge certainty, and your confusion reflects the depth of his struggle. Let's break down the passage and the possible resolutions:

  1.  **The Tension:**
      *   **"Form of life" (Lebensform):** As you note, this concept (prominent in *Philosophical Investigations*) refers to the shared, rule-governed, normative practices that constitute a community's way of being and acting. Language, games, customs, and institutions are embedded within forms of life. Hinges understood this way are the *shared background* that makes communication, agreement, disagreement, justification, and doubt *possible* within a specific community. It's inherently social and cultural.
      *   **"Something animal":** This evokes immediacy, instinct, pre-reflective certainty, biological grounding. It suggests a bedrock level of assurance that isn't learned through cultural transmission or rational justification but is more akin to an animal's instinctive reaction to its environment (e.g., a bird building a nest, a squirrel burying nuts, a human flinching from a sudden loud noise). This seems pre-social or sub-social.

  2.  **Wittgenstein's Struggle & the Parenthetical:**
      *   His admission ("very badly expressed and probably badly thought as well") is crucial. He recognizes the difficulty of capturing this foundational certainty. It resists our usual conceptual categories. He's trying to gesture at something *prior* to the frameworks we use to describe the world and our knowledge of it.

  3.  **Resolving the Tension: Convergence, Not Contradiction**
      Wittgenstein isn't likely running together two *different* pictures, but rather trying to point to the *same* phenomenon from two angles, emphasizing its radical foundational nature. The convergence happens at the level of **embodied, pre-reflective, world-involving action**:

      *   **The Animal as the Foundation of the Social:** Human forms of life are *built upon* and *emerge from* our biological, animal nature. Our instinctive reactions, our fundamental trust in our senses and bodies, our immediate responses to the world – these are the *pre-linguistic, pre-cultural bedrock* upon which shared practices and language games are later constructed. A baby's instinctive reaching, grasping, crying, and trusting its caregiver *precedes* and *enables* the learning of language and social norms. This animal certainty is the *substrate* of the form of life.
      *   **The Social as the Context for the Animal:** Our "animal" certainties aren't raw biology operating in a vacuum for humans. They are *embedded within* and *shaped by* our social forms of life from the very beginning (consider how even an infant's cries are interpreted and responded to socially). However, Wittgenstein is emphasizing in this passage that *beneath* the culturally specific expressions and justifications lies a layer of certainty that functions *like* an instinct, a direct, non-inferential taking-for-granted of the world.
      *   **Beyond Justification:** The key phrase is "beyond being justified or unjustified." Both characterizations aim to place hinges *outside* the epistemic game of justification/doubt. Justifications *end* at hinges. We don't *reason* our way to "My hands exist" or "The world existed more than 5 minutes ago"; we *act* with these as absolutely certain. This acting can be seen as:
          *   **Socially:** The indispensable, unquestioned framework *within which* justification and doubt make sense (Form of Life).
          *   **Biologically:** The instinctive, immediate orientation to the world that enables us to function and *then* develop social practices (Animal).

  4.  **Implications for the Nature of Hinges:**
      This passage strongly pushes towards understanding hinges as **non-propositional** or at least **not functioning like ordinary empirical beliefs**:

      *   **Against "Beliefs":** Beliefs are typically understood as states that can be true/false, justified/unjustified, doubted/defended. Hinges, as described here, are "beyond" justification/unjustification. Calling them "animal" emphasizes their status as **ways of acting** or **embodied orientations**, not intellectual assents to propositions. We *show* our hinge certainty in our actions (e.g., confidently reaching for a cup, not testing the ground before each step), not by asserting propositions.
      *   **Propositions vs. Certainty:** While we *formulate* hinge *propositions* ("The Earth is very old," "I have two hands"), Wittgenstein's point is that the *certainty* we express with these words isn't a *propositional attitude* (like belief or knowledge). It's the **lived, enacted background** against which propositions *gain* their meaning and truth-value. The certainty is *manifest* in the form of life and in animal-like action, *not* in holding a belief-state.
      *   **"Hinge" as a Metaphor for Function:** The hinge metaphor itself supports this. A hinge isn't part of the door it enables to move; it's the fixed point *around* which movement happens. Similarly, hinges aren't items *in* our system of beliefs/knowledge; they are the fixed points *that constitute the frame* of that system, enabling its movement (justification, doubt, inquiry). The "animal" and "form of life" characterizations both point to this *constitutive, enabling function* rather than a *content* that is believed.

  **Conclusion:**

  Wittgenstein is not contradicting himself but straining language to capture the unique status of hinge certainty. The "animal" characterization highlights the **pre-reflective, instinctive, embodied, biologically grounded** aspect of our fundamental certainties – the raw trust that allows us to *be* in the world and act. The "form of life" characterization highlights how these certainties are the **indispensable, shared, normative background** that makes human practices, language, and knowledge *possible*. They converge at the point of **enacted, lived certainty** that precedes and grounds the distinction between nature and culture, instinct and reason, the biological and the social.

  This passage strongly suggests hinges are **not best understood as a special class of (non-epistemic) beliefs**. Beliefs, even non-epistemic ones, still operate *within* the space of reasons, even if minimally. Hinges are the **preconditions** for that space. They are the **ways of acting, the embodied trust, the framework** manifested in our animal-like responses and our shared forms of life. They are the **hinges** upon which the door of our epistemic and practical endeavors turns, not planks within the door itself. The "animal" remark particularly pushes us towards seeing them as fundamentally non-propositional *enactments* or *modes of being* rather than propositional attitudes.
