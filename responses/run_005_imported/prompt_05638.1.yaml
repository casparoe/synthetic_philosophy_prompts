  Okay, let me start by understanding the user's query. They mentioned being on a university research-prioritization subcommittee, a small faculty body that recommends which research areas to fund. The user is likely a faculty member, possibly senior, given their role on such a committee. Their explicit need is for criteria to evaluate research proposals, but there might be deeper concerns.

  The user might be dealing with limited funding and high competition among proposals. They need a fair, transparent system to avoid bias and ensure resources go where they'll have the most impact. Unspoken needs could include balancing diverse fields (some metrics favor STEM over humanities), managing internal politics, and aligning with the university's strategic goals without stifling innovation.

  I should consider both quantitative and qualitative factors. Quantitative aspects like publication records and funding history offer objectivity, but qualitative elements like societal impact and feasibility matter too. Especially for arts or social sciences, where traditional metrics might not capture value. 

  The mention of "university's mission" suggests the criteria must reflect institutional priorities. Maybe the user needs help communicating these priorities to other faculty who might resist changes in funding distribution. Also, feasibility is crucial—overly ambitious projects that can't deliver waste resources.

  Interdisciplinary work is a plus but might face administrative hurdles. The user might need strategies to evaluate such proposals fairly. And finally, they probably need a clear rubric to standardize scoring, reducing conflicts during committee discussions.
answer: |-
  Based on your role, here's a comprehensive framework for research prioritization criteria, balancing rigor, impact, and institutional alignment. These criteria should be applied through a structured scoring system (e.g., 1-5 scale per category) with clear definitions to ensure objectivity.

  ### Core Evaluation Pillars
  1. **Strategic Alignment**  
     - **University Mission:** Direct contribution to institutional priorities (e.g., climate science at a sustainability-focused university).  
     - **National/Global Relevance:** Alignment with major funding bodies (NSF, NIH priorities), UN SDGs, or societal grand challenges.  
     - **Interdisciplinary Synergy:** Potential to bridge departments/create new research hubs.  

  2. **Intellectual Merit & Rigor**  
     - **Novelty:** Groundbreaking concepts vs. incremental advances.  
     - **Methodological Soundness:** Appropriate design, data robustness, and reproducibility.  
     - **Team Expertise:** PI track record (publications, prior grants), team composition balance. *Caution: Avoid over-penalizing early-career researchers*.  

  3. **Impact Potential**  
     - **Academic Impact:** Expected high-impact publications, conference invitations, field-shifting potential.  
     - **Societal/Economic Impact:** Policy influence, health/environmental benefits, commercialization pathways (patents, industry partnerships).  
     - **Capacity Building:** Training opportunities for grad students/postdocs, shared infrastructure development.  

  4. **Feasibility & Resource Efficiency**  
     - **Realistic Timeline:** Clear milestones with appropriate risk mitigation.  
     - **Cost-to-Impact Ratio:** Budget justification relative to projected outcomes.  
     - **Existing Resources:** Leverage of current labs/equipment vs. new major investments.  

  5. **Funding Landscape**  
     - **Leverage Potential:** "Seed" projects likely to attract larger external grants.  
     - **Sustainability:** Pathway to continued funding beyond initial support.  
     - **Gap Funding:** Addressing critical needs unfunded by traditional sources.  

  ### ⚖️ Decision-Process Recommendations
  - **Stage-Gated Review:** 
    - *Stage 1:* Quantitative screening (completeness, basic eligibility, alignment scores).  
    - *Stage 2:* Thematic expert review (subject-matter faculty assess technical merit).  
    - *Stage 3:* Committee deliberation using weighted criteria (e.g., Impact 30%, Rigor 25%, Strategy 20%, Feasibility 15%, Funding 10%).  

  - **Transparency Tools:**  
    - Publish rubric weights annually.  
    - Require impact statements from PIs using standardized templates.  
    - Disclose conflict-of-interest protocols.  

  - **Equity Safeguards:**  
    - **Blind review** of proposals (remove PI names/departments in initial stages).  
    - **Explicit support for high-risk/high-reward** proposals (allocate 10-15% of funds).  
    - **Field-Normalized Metrics:** Assess humanities projects differently from biotech.  

  ### 🚩 Red Flags to Mitigate
  - **"Matthew Effect" Bias:** Avoid favoring established PIs exclusively. *Solution:* Cap points for PI reputation beyond a threshold.  
  - **Short-Termism:** Over-emphasizing quick wins. *Solution:* Reserve 20% for long-term transformative projects.  
  - **Silo Reinforcement:** Only funding "safe" disciplines. *Solution:* Mandate minimum allocation for emerging fields.  

  ### Example Prioritization Workflow
  ```mermaid
  graph TD
      A[Proposal Submission] --> B{Stage 1: Admin Check}
      B -->|Pass| C[Thematic Review]
      B -->|Fail| D[Return for Revision]
      C --> E{Stage 2: Expert Scoring}
      E -->|Top 40%| F[Committee Debate]
      F --> G[Weighted Rubric Scoring]
      G --> H[Funding Recommendations]
      H --> I[Stratified Portfolio: Balanced High-Impact/High-Risk]
  ```

  ### Key Questions for Committee Deliberation
  - If we fund ONLY this project, how does it advance our institution's unique goals?  
  - What happens if we *don't* fund this?  
  - Does this proposal create irreversible value (e.g., unique datasets, critical infrastructure)?  

  **Final Tip:** Allocate 5% of funds for "wildcard" projects selected by unanimous committee passion votes—this often yields unexpected innovation. Maintain a dashboard tracking funded projects' outcomes (publications, grants spawned, talent retention) to refine future cycles.
