prompt: |-
  So a few of us in the econ PhD program run a tiny history-of-thought podcast on the side (mostly an excuse to keep reading dead economists instead of doing problem sets), and next week's episode is with an intellectual historian who just finished a book manuscript arguing that Keynes's "Economic Possibilities for our Grandchildren" isn't really economic forecasting so much as Bloomsbury ethics wearing a growth-rate costume. Her claim, basically, is that the fifteen-hour week stuff, and especially the bit where Keynes predicts the love of money will eventually be recognized as a kind of mild pathology, is G.E. Moore's Principia Ethica (love, beauty, that whole "the Ideal" business) smuggled into an essay that reads like its about productivity. I've read the essay a couple times and skimmed "My Early Beliefs," where an older Keynes gets noticeably uneasy about how he and the Bloomsbury crowd actually used Moore's philosophy when they were young, but I'm worried that if I just ask her to walk us through the thesis she'll do exactly that for 35 minutes and it'll be a perfectly nice, totally forgettable episode.

  Could you draft me around 8 interview questions that put real pressure on the argument instead of inviting a recap? I specifically want: one that makes her deal with the fact that Moore's good life was pretty explicitly for a cultivated few, not for everybody, and asks how that squares with an essay that promises basically the whole species an eventual Athenian-aristocrat retirement; one that asks her to reconcile the contemplative, leisured ideal in the essay with Keynes himself being a compulsive market speculator almost his whole adult life -- did he think of himself as exempt, or as part of a transitional generation that has to do the ugly moneymaking so their grandchildren won't have to; and one on whether the more self-critical, older Keynes of "My Early Beliefs" should make us read the 1930 essay's optimism as less sincere, or whether the two pieces are just doing different enough things that they're not really in tension at all. For at least two or three of these, can you also flag the "that's not quite fair to the argument" deflection she'd probably reach for, plus a sharper follow-up, since I don't trust myself to know the secondary literature well enough to push back on the fly.
