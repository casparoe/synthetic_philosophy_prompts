prompt: |-
  I'm a novelist who somehow ended up chairing the judging panel for a small first-novel prize -- five judges, six books on the shortlist, and a rule where everyone ranks all six and we add up the points, lowest total wins. After last year's ceremony, two judges got convinced the runner-up only lost because a judge who couldn't stand that author ranked the book dead last just to sink it, and now they want to switch to an instant-runoff style vote instead, since it 'can't be gamed.' A third judge just wants to keep doing what we've always done. I need to send the panel a short memo before we meet next Tuesday recomending what we actually do this year -- keep the points system, switch to runoff, or something else -- with reasons the others could actually argue with, and without pretending whichever system we pick will make the gaming problem go away, because I have a feeling it won't. Can you draft that memo for me?
