  For the first required question about the objection, I should create a question that acknowledges other logicians like Russell or Wittgenstein also valued anti-psychologism without the same political views. The follow-up needs to let the professor clarify that it's not about the ideas themselves but Frege's specific approach and intensity. Maybe mention his intolerance for vagueness as a parallel to ethnic exclusion.

