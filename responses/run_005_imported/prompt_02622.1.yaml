prompt: |-
  Quick one -- I'm putting together a handout for my formal epistemology seminar on I.J. Good's 1967 theorem from 'On the Principle of Total Evidence': the result that a bayesian expected-utility maximizer can never expect free evidence to lower their expected utility, provided they'll actually update on it and act optimally afterward. I can follow the standard proof fine (the expected value of the optimal act is a convex function of your credences, so Jensen's inequality does the rest), but that just feels like a trick, not an explanation -- i want the gut-level story for why this has to be true. Can you also square it against cases where NOT knowing something seems clearly better, like not wanting to learn your baby's sex early, or getting a scary test result before a long flight you can't do anything about anyway? Those feel like live counterexamples, so id like you to pin down exactly which premise of the theorem is quietly doing the work of ruling them out, rather than just telling me 'well, the math says so.'
reasoning: |-
  Okay, let me tackle this user's query. They're preparing a handout on Good's theorem for a formal epistemology seminar. They understand the standard proof using Jensen's inequality but feel it's more of a trick than an explanation. They want a gut-level intuition for why free evidence can't lower expected utility and also need to reconcile this with real-life cases where ignorance seems beneficial, like not learning a baby's sex or avoiding scary test results before unavoidable actions.

  First, I need to break down Good's theorem intuitively. The convexity of the value function is key. Imagine plotting possible credences on a graph where the height shows the expected utility of the best action at each belief state. The curve bulges upward because with more certainty, you can choose actions better suited to the truth. When you average the outcomes of getting evidence, that average point sits above where you started, meaning expecting evidence is beneficial.

  Now, the user's real challenge is those counterexamples. Take not wanting to know the baby's sex. Here, the issue is that preferences might be asymmetric. If knowing leads to anxiety or spoils surprise, it's not about utility from outcomes but about the experience of knowing itself. Good's theorem assumes utility comes only from outcomes of actions, not the state of knowledge. So if knowing affects utility directly, it's outside the theorem's scope.

  Then there's the scary test before a flight. The key here is that you can't act on the information. Good's theorem requires that you update and act optimally afterward. If no action changes based on the test result, then the evidence doesn't help. But the theorem assumes evidence is used to choose better actions. If actions are fixed, learning can't improve utility, but the theorem doesn't claim it always helps—only when you can act on it. Also, if the evidence causes distress without changing actions, that's a direct utility impact, again outside the model.

  The user probably wants to clarify these assumptions to their seminar. They need to show how the theorem's conditions—free evidence, updating, acting optimally—interact with cases where those conditions aren't met. Highlighting that utility must be outcome-based and that actions must be influenceable by evidence is crucial. Also, addressing emotional or psychological factors as separate from the decision-theoretic framework helps reconcile the counterexamples.

  I should make sure to explicitly list the premises that rule out counterexamples: outcome-only utility, updating on evidence, freedom of evidence, and the ability to act afterward. Emphasize that when these don't hold, evidence can harm expected utility in practical terms, but within the model, it's always non-harmful. This distinction between the formal model and real-life complexities will strengthen their handout.
answer: |-
  Here's a gut-level story for Good's Theorem and how it handles those intuitive counterexamples, pinpointing the crucial premises:

  **The Gut-Level Story: Why Free Evidence *Feels* Like It Can't Hurt (In This Model)**

  Imagine you're standing at a fork in the road. You *think* the left path is slightly better, but you're not sure. Now, a friendly oracle offers to tell you, for free, *exactly* which path leads to treasure before you choose. Why would you ever *expect* this to make your situation *worse*?

  1.  **The Power of Flexibility:** Knowing the truth *always* gives you more options. Before the evidence, you have to hedge your bets. After the evidence, you can perfectly tailor your action to the actual state of the world. You can *always* choose to do *exactly* what you *would* have done without the evidence (if that turns out to be best *given* the truth), *or* you can switch to a better action if the evidence reveals it's needed. **The evidence never *forces* you to make a worse choice than you would have made ignorant; it only *enables* you to make a better one if the truth warrants it.** The downside is illusory because you retain the "ignorant" option.
  2.  **Averaging the Upside:** Since the evidence is free and you'll update correctly and act optimally afterward, the only question is: "What's my *expected* outcome *after* I get this evidence and act?" You're essentially averaging the outcomes you'd get in every possible world where you know the truth and act perfectly. Crucially:
      *   In worlds where your initial hunch was *right*, the evidence confirms it, and you take the same good action. Outcome = Same as before.
      *   In worlds where your initial hunch was *wrong*, the evidence corrects you, and you switch to a *better* action. Outcome = *Better* than before.
      *   There are *no* worlds where getting the evidence and acting optimally leads to a *worse* outcome than acting on your initial ignorance. The evidence either confirms your good choice or saves you from your bad choice.
  3.  **The Net Effect:** Averaging "Same as before" outcomes and "Better than before" outcomes *must* give you an expectation that is *at least as good as*, and usually *better than*, just sticking with "Before". The potential upside (avoiding mistakes) has a positive expected value, while there's no corresponding potential downside (since you can always stick with your original plan if it's best).

  **Squaring with the Counterexamples: Where the Premises Kick In**

  The theorem rests on specific, often implicit, premises. Your counterexamples violate these:

  1.  **The "Scary Test Before a Long Flight" (No Actionability):**
      *   **Premise Violated:** *"Act optimally afterward."* (More precisely: The ability to take *different* actions based on the evidence).
      *   **Explanation:** Good's theorem assumes the evidence *informs a decision*. If the set of available actions doesn't change based on the evidence (e.g., you *must* take the flight regardless of the test result), then the "value of the optimal act" function becomes *flat* over the relevant credences. Learning doesn't change your action, so it doesn't change your expected utility *from the action*. However...
      *   **The Psychological Twist:** The theorem *only* considers utility derived from the *outcomes of actions*. If learning the scary result *itself* causes direct disutility (anxiety, dread) *independent* of any action outcome, this violates a deeper premise:
          *   **Core Premise:** *Utility is solely a function of the state of the world and the action taken, not the state of knowledge itself.*
      *   **Why it *seems* worse:** You incur a psychological cost (negative utility from knowing) without any compensating benefit in action quality. The theorem ignores these "epistemic utilities" or "anxiety costs." It assumes knowing the truth has no intrinsic cost, only action consequences matter.

  2.  **Not Learning the Baby's Sex (Asymmetric Preferences / Action-Irrelevance):**
      *   **Premise Violated:** *"Act optimally afterward"* (Again, relevance to action) and potentially *"Utility depends only on state+action"*.
      *   **Explanation:**
          *   **Action-Irrelevance:** For many parents, knowing the sex *doesn't* significantly change their optimal actions (e.g., preparing the nursery, choosing names). The core actions (loving and raising the child) are the same. The evidence doesn't unlock new, better-tailored actions. The "value of optimal act" function is flat.
          *   **Asymmetric Preferences / Direct Utility of Surprise:** The preference is often *not* about action outcomes, but about the *experience* of surprise or anticipation itself. Learning the sex "spoils" a desired experience (the surprise at birth) which holds positive utility. *Not* knowing *provides* a positive utility (enjoyment of anticipation/surprise).
          *   **Utility Depends on State of Knowledge:** Here, utility *explicitly* depends on the epistemic state. The state of "not knowing + anticipating surprise" is assigned higher utility *for the parent* than the state of "knowing," *regardless* of the actual sex of the baby or any actions taken. The actual sex (the "state of the world") becomes almost irrelevant to *this specific utility*.
      *   **Why it *seems* better to not know:** The state of ignorance *directly* provides positive utility (enjoyment of surprise/anticipation) that the state of knowledge removes. The theorem assumes no utility is attached to the epistemic states themselves.

  **Pinpointing the Crucial Premises (The Quiet Workhorses):**

  1.  **Outcome-Only Utility:** Utility is derived *solely* from the combination of the true state of the world and the action taken. The *state of knowledge itself* (ignorance vs. specific knowledge) confers *no* independent utility or disutility. *(Rules out "scary test anxiety" and "surprise preference").*
  2.  **Actionability:** The evidence is relevant to a pending decision. Learning the evidence *can and will* potentially change which action is optimal. The agent *will* take different actions based on different evidence. *(Rules out "scary test before unavoidable flight" and "baby sex where actions don't change").*
  3.  **Free Evidence:** Acquiring the evidence itself costs nothing (no money, time, cognitive effort, or utility). *(Ensures there's no upfront cost to offset the potential benefit).*
  4.  **Rational Updating & Optimization:** The agent *will* update their beliefs correctly upon receiving the evidence (conditionalization) and *will* subsequently choose the action that maximizes expected utility *given those updated beliefs*. *(Ensures the potential benefit of better-tailored actions is realized).*
  5.  **Exogeneity:** The act of seeking/obtaining the evidence doesn't itself change the world state or available actions. *(Keeps the focus purely on the informational value).*

  **Conclusion:**

  Good's Theorem shows that *within the strict Bayesian decision theory framework* (where utility comes *only* from world-state + action, evidence is free, and agents update and act optimally), free relevant evidence is never expected to harm. The "gut feeling" is that evidence only unlocks the *option* to improve, never forces a degradation.

  The compelling counterexamples arise precisely when we step *outside* that framework: when knowing/not-knowing has *intrinsic* utility (violating Premise 1) or when the evidence is *irrelevant* to any actionable decision (violating Premise 2). The theorem isn't wrong; it's describing the behavior of a specific, idealized rational agent. Real humans have richer utility functions that include epistemic states and often face situations where information doesn't translate into better actions. Your handout should emphasize these boundary conditions – they reveal the theorem's power *and* its limitations.
