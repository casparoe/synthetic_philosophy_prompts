  The friend might be right that Eliot wanted secular ethics but wrong in thinking she'd endorse structured replacements. Eliot valued organic community bonds over top-down systems. Her critique of Comte's church shows she saw such designs as counterproductive.

  The user's mention of duty being "peremptory and absolute" highlights her belief in inherent moral obligations, not needing artificial frameworks. Her humanism was about lived experience, not liturgy.

