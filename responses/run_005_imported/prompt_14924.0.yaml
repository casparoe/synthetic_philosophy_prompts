          "**Why it's wrong:** Kin selection (as per Hamilton) is an *individual-level* (or gene-level) selection process operating *via* effects on relatives. The gene spreads because copies in relatives benefit. 'Group selection' (as classically defined by Wynne-Edwards and critiqued by Williams) refers to selection *between groups* where group-level properties (like reduced reproduction) evolve for the benefit of the group, potentially *against* individual fitness interests within the group. Hamilton's mechanism specifically avoids the need for group selection in the Wynne-Edwards sense. Conflating them undermines a core distinction in evolutionary theory.",
