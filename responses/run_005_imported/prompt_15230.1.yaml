answer: |-
  Here’s a five-minute toast weaving your sister’s work into a heartfelt, honest message about marriage, accessible to all:

  **(Clink glass gently)**  
  "Hello everyone! For those who don’t know me, I’m [Your Name], the incredibly proud brother of our brilliant bride. And for those who *do* know me, you know I usually talk in code... but today, I’ll try my best in English!"

  **(Warm smile towards the couple)**  
  "[Sister's Name] and [Partner's Name], you look absolutely radiant. Truly. Now, anyone who’s spent more than five minutes with my sister knows she thinks *deeply* – especially about choices, plans, and how we stick to them over time. She’s spent years studying how people can make perfectly 'rational' choices in the moment, only to find themselves predictably led down a path they never wanted... what philosophers call a 'money pump.'"

  **(Brief, light explanation for non-philosophers)**  
  "Think of it like this: Imagine you keep making little trades because each one seems slightly better right then, but somehow, you end up right back where you started, only poorer! Oops."

  **(Pivot to the core concept)**  
  "But here’s the fascinating part my sister explores: How do we *avoid* that? How do we stay true to a good plan when the next tempting choice pops up? She talks about three ways people handle their future selves:"

  1.  **Naive:** "The Naive agent just charges ahead, blissfully unaware that future temptations or changes might derail the whole plan. 'Follow your heart *right now*!' sounds great... until the path gets twisty."
  2.  **Sophisticated:** "The Sophisticated agent sees the risks coming. They know their future self might waver, so they plan around that weakness, maybe avoiding situations where temptation *could* arise. It's clever, but sometimes feels a bit... distrustful of your own future."
  3.  **Resolute:** "And then there’s the Resolute agent. This one makes the best plan they can, *knowing full well* that when the moment arrives, part of them might want to ditch it for something that looks shinier or easier. But they *commit*. They say, 'This is the path we chose together, and we’re sticking to it.' They trust the wisdom of their past commitment."

  **(Look directly at the couple, voice softens but becomes more resonant)**  
  "Today, as you stand here about to make vows, you’re doing something profoundly Resolute.

  "You’re *not* being Naive. You’re not standing here thinking, 'Love will conquer all, effortlessly, forever!' You’re smart people. You know life throws curveballs. You know there will be days, maybe even seasons, where the *easy* choice, the *tempting* trade, might whisper that abandoning the plan is better. You see that possibility.

  "You’re *also* not just being Sophisticated. You’re not building a marriage solely on anticipating every future weakness and trying to wall yourselves off from risk or temptation. That’s not trust; that’s just damage control.

  **(The heart of the toast)**  
  "You’re being **Resolute**. Right here, right now, with eyes wide open to the complexities of time and human nature, you’re making a precommitment. You’re saying, *'We choose this path together. We know our future selves might face moments of doubt or desire for an easier trade. But we bind ourselves – not out of naivety, not out of sophisticated distrust – but out of profound respect for the plan we crafted together today, and out of deep faith in the 'us' we are choosing to become.'*

  "You’re promising to be architects of your shared future, not just passengers reacting to every passing wind. You’re saying the 'us' matters more than the momentary preference of an 'I' caught in a difficult spot.

  **(Connect back to the sister's work)**  
  "[Sister's Name], after years studying how easily plans can unravel one 'rational' step at a time, you understand the power and the *necessity* of this resolve better than almost anyone. And [Partner's Name], the fact that you stand beside her, ready to make this resolute commitment, speaks volumes.

  **(Broaden to the room)**  
  "That’s what these vows *are*. They’re not a prediction of effortless bliss; they’re a declaration of resolute intent. It’s choosing the 'us' over the fleeting 'me,' the long arc over the short gain, the plan forged in love and wisdom over the tempting trade offered by a difficult moment.

  **(Raise glass)**  
  "So let’s raise our glasses to [Sister's Name] and [Partner's Name]. Not to naive optimism, but to clear-eyed courage. Not to sophisticated hedging, but to unwavering trust. To the profound, beautiful, resolute choice you make today. May your shared resolve be the anchor through every storm and the compass guiding you ever forward, together.

  **To the resolute couple! Cheers!"**

  **Why this works:**

  1.  **Accessible Jargon:** Explains "money pump" simply. Uses "Naive/Sophisticated/Resolute" clearly with relatable analogies.
  2.  **Honest Vows:** Acknowledges marriage isn't always easy or tempting; frames vows as a conscious, resolute choice *despite* knowing future challenges, which is far more meaningful than "follow your heart."
  3.  **Compliments Her Work:** Directly ties her PhD concepts to the core meaning of marriage vows, showing deep understanding and respect for her life's work.
  4.  **Compliments the Couple:** Praises their intelligence ("not naive"), their courage ("resolute"), and their specific choice of each other.
  5.  **Avoids Clichés:** "Follow your heart" is explicitly contrasted with the superior "resolute" choice.
  6.  **Balances Audiences:**
      *   **Philosophers:** Will immediately recognize the Kavka-esque framework and appreciate its elegant application to marriage vows. The terms "precommitment," "resolute," and the core dilemma are spot-on.
      *   **Non-Philosophers:** Gets the core idea – marriage requires sticking to a plan you make together, even when it's hard later, because you trust that initial plan and each other. The "easy trade" vs. "chosen path" is relatable.
  7.  **Fits 5 Minutes:** Pacing is concise: Setup, concept explanation, application to couple, broader meaning, toast.
  8.  **Warmth & Heart:** Starts and ends with warmth and focus on the couple. The core message about commitment is deeply romantic in an honest, mature way.
