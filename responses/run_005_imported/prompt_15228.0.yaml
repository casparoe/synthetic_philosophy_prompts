prompt: |-
  For a near-future novel I'm drafting, one pivotal scene turns on a video, seen by millions before anyone can verify it, that appears to show a miraculous healing. My protagonist, a philosopher, wants to resist believing it on explicitly Humean grounds, and I need her reasoning to genuinely hold up rather than gesture vaguely at "Hume would be skeptical of miracles." Specifically: if Hume himself were confronted with a world in which moving images, and not only spoken or written testimony, can be fabricated cheaply and undetectably, how would he revise the actual argument of "Of Miracles" — the maxim that testimony can establish a miracle only if its own falsehood would be more improbable than the miracle itself, together with his separate observations about our appetite for the marvelous and about how rival religions' miracle-claims undercut one another? Does the mere possibility of undetectable fabrication strengthen his case against trusting the video, by further degrading the background reliability of the relevant class of evidence, or does it threaten to undercut his whole framework, which quietly presupposes a stable track record against which the reliability of testimony can be calibrated? Work through this with real fidelity to the argument's actual structure, and commit to a specific verdict about which way it actually cuts.
reasoning: |-
  Okay, the user is writing a near-future novel and needs help with a scene where a philosopher character resists believing a viral video of a miracle based on Hume's arguments. They want the reasoning to be solid, not just a vague reference. Let me break down the key points.

  First, the core of Hume's argument in "Of Miracles" is that testimony for a miracle must be more improbable than the miracle itself. Also, Hume mentions human psychology—our love for the marvelous—and how competing miracle claims cancel each other out. Now, the user introduces modern tech: undetectable video fabrication. How would Hume adjust his argument?

  I need to recall Hume's actual structure. He relies on uniform experience as the basis for judging probabilities. Testimony's reliability is based on its past accuracy. So, if videos can now be faked perfectly, that uniform experience against miracles isn't the only factor; the reliability of video evidence itself is compromised. 

  Hume's maxim compares the probability of the miracle against the probability of false testimony. With deepfakes, the chance of false testimony (or fake video) increases. That means the denominator in his probability calculation gets bigger, making it harder for the miracle to be more probable. So, undetectable fabrication strengthens Hume's case because it lowers the reliability of video evidence, making deception more likely than a miracle.

  But what about the calibration issue? Hume assumes a stable track record to measure testimony's reliability. If fabrication is undetectable, how do we calibrate? If we can't tell real from fake, the track record becomes unstable. But Hume might counter that we still rely on past experience. If all videos we've verified were authentic before, but now fakes exist undetectably, our past experience isn't reliable anymore. However, in practice, we'd adjust our prior probability of video evidence being reliable downward. So even with calibration challenges, the mere possibility of undetectable fakes makes us more skeptical, aligning with Hume's skepticism.

  Also, the psychological factors: viral spread and confirmation bias. People are more likely to believe sensational videos, and deepfakes exploit that. Plus, rival claims—other groups might produce their own miracle videos, canceling each other out, which Hume would point to as evidence against any single claim.

  So, strengthening the argument wins. The possibility of undetectable fabrication makes Hume's skepticism even more relevant. The protagonist can argue that videos now fall under unreliable testimony due to fabrication tech, making miracles even less probable. The calibration issue doesn't undercut Hume because we still use observable evidence; we just adjust priors based on new tech risks.
answer: |-
  Here's a precise analysis of how Hume would likely revise his argument in Section X ("Of Miracles") of the *Enquiry Concerning Human Understanding* to confront undetectable video fabrication, culminating in a specific verdict:

  **Core Humean Principles & Their Interaction with Fabrication:**

  1.  **The Maxim (Probability Calculus):** "No testimony is sufficient to establish a miracle, unless the testimony be of such a kind, that its falsehood would be more miraculous, than the fact, which it endeavours to establish." Hume grounds this in the principle that belief is proportional to evidence, and evidence is based on uniform experience. A miracle, by definition, violates uniform experience. Testimony *also* has a track record of reliability based on uniform experience.
  2.  **Calibration Requirement:** Crucially, Hume's argument **absolutely depends** on calibrating the reliability of testimony against a known background of uniform experience. We judge the probability of testimony being false *based on our past experience* of how often testimony (of that type, from that source, under those conditions) has been reliable or unreliable. This calibration requires a stable track record where truth and falsehood are *discernible* after the fact.
  3.  **Psychological Factors:** Human nature has a "strong propensity" to believe the marvelous and miraculous. This passion influences witnesses (exaggeration, delusion) and audiences (eagerness to believe, credulity), degrading testimony's reliability, especially for extraordinary events.
  4.  **Mutual Destruction:** Miracles claimed by rival religions cancel each other out, as each supposedly proves its own doctrine true and the others false.

  **Impact of Undetectable Fabrication:**

  *   **Degrading the Reliability of the Evidence Class (Strengthens the Maxim):** Undetectable fabrication fundamentally degrades the *uniform experience* against which we calibrate the reliability of *video testimony specifically*.
      *   **Pre-Fabrication:** Uniform experience showed that video evidence, while not infallible (e.g., errors, staged events), was generally a highly reliable recorder of observable events. Its falsehood (deliberate fabrication detectable as such) was relatively rare compared to the falsehood of human testimony. A video of an apparent miracle would have been *strong* testimony, forcing a serious confrontation between the prior improbability of the miracle and the prior *improbability* of a false video.
      *   **Post-Fabrication:** Uniform experience now shows that *any* video *could* be a perfect fabrication, indistinguishable from reality. The track record is corrupted. We cannot reliably say, based on past experience, *how often* videos are fabrications *because we cannot detect them*. This drastically **increases the prior probability we must assign to the hypothesis "this video is a fabrication."** The falsehood of the video testimony (it shows X, but X didn't happen due to fabrication) is no longer a rare event based on uniform experience; it becomes a *distinct possibility inherent in the medium itself*.
      *   **Effect on the Maxim:** This directly impacts Hume's probability calculus. The denominator in the comparison – "the probability that the testimony (video) is false or mistaken" – **skyrockets**. Before, the improbability of a *detectably false* video was high. Now, the improbability of an *undetectably false* video is much lower (higher probability of falsehood). Therefore, it becomes **vastly easier** for the prior improbability of the miracle (based on uniform experience of natural laws) to *exceed* the improbability of the video being false. The bar for the miracle being the *more probable* explanation is raised immensely. Fabrication becomes a *highly probable naturalistic explanation* for the apparent miracle.

  *   **Threat to Calibration (Potential Challenge - But Ultimately Contained):** This is the serious conceptual challenge. Hume's framework *assumes* we can calibrate testimony reliability based on discernible past truth/falsehood. Undetectable fabrication seemingly breaks this. If we can *never* know if a past video was real or fake, how do we establish the "uniform experience" of video reliability?
      *   **Humean Response:** Hume would likely argue that we *must still rely on the discernible track record we have*. The known existence of the *capability* for undetectable fabrication becomes a **key part of the new uniform experience**. Our uniform experience now tells us: "Videos exist that are indistinguishable from reality but depict events that never occurred." This experience doesn't tell us *how many* such videos exist, but it *does* tell us that the possibility is real and non-negligible.
      *   **Impact:** This doesn't destroy the calibration framework; it **radically recalibrates it downwards**. Instead of assigning video evidence a high prior reliability based on a (now known to be potentially corrupted) past track record, we assign it a **much lower prior reliability** precisely *because* we know undetectable falsehoods are possible and undetectable. The *mere possibility*, once proven to exist, becomes a dominant factor in evaluating the probability of falsehood for *any specific video*, especially one depicting the extraordinary. We don't need to know the exact frequency of fakes; knowing they *can* exist undetectably is sufficient to drastically lower our prior confidence in *any* video's veracity when it depicts something otherwise highly improbable.

  *   **Amplifying Psychological Factors (Strengthens):** Undetectable fabrication is a dream tool for exploiting the "appetite for the marvelous." It allows the creation of *exactly* the kind of sensational, belief-confirming evidence that passions crave, bypassing the limitations of fallible human witnesses or crude forgeries. Hume would see this technology as massively amplifying the psychological forces that degrade reliable testimony about miracles. The viral spread itself becomes evidence of the passion at work, not evidence of truth.
  *   **Mutual Destruction (Strengthens):** Undetectable fabrication makes it trivially easy for rival groups to produce their own "miraculous" videos. Hume would point to the sudden proliferation of competing, mutually exclusive miraculous claims (all easily fabricable) as further proof against the reliability of *any single one*. If technology allows every sect to have its own apparent video proof, it devalues all such proofs.

  **The Verdict: Strengthening**

  **The mere possibility (and especially the confirmed reality) of undetectable video fabrication decisively STRENGTHENS Hume's case against trusting the video of a miracle.**

  1.  **Probability Calculus:** It drastically increases the prior probability we must assign to the hypothesis "this video is fabricated," making it far easier for the prior improbability of the miracle to exceed the improbability of the video being false. Fabrication becomes a highly probable naturalistic alternative.
  2.  **Calibration:** While challenging the *source* of calibration, it forces a severe *downward recalibration* of the prior reliability of video evidence based on the new uniform experience that undetectable falsehoods *are possible*. This lowered prior reliability feeds directly into the maxim, strengthening skepticism.
  3.  **Psychology:** It supercharges the human propensity for the marvelous by providing a seemingly flawless medium for its exploitation.
  4.  **Mutual Destruction:** It facilitates the creation of contradictory miracle claims, further undermining the credibility of any single one.

  **Hume wouldn't abandon his framework; he would see undetectable fabrication as a devastating new factor that makes testimony (now including video) even *less* reliable for establishing miracles than it was in the 18th century.** The background rate of potential falsehood for the *medium itself* is now unacceptably high when weighed against the extreme prior improbability of a violation of natural law. The protagonist's Humean resistance is therefore *stronger* and *more justified* in the age of deepfakes than it ever was before.

  **For Your Protagonist:** Her argument shouldn't just be "Hume was skeptical of miracles." It should be: "Hume showed that extraordinary claims require extraordinary evidence, calibrated against our uniform experience. Our uniform experience now includes the undeniable fact that *any* video can be a perfect, undetectable fiction. Therefore, video evidence of a miracle is *inherently* far *less* extraordinary – far *more* probable as an explanation – than the miracle itself. The most probable explanation isn't a suspension of natural law; it's the known, documented capacity of our own technology to flawlessly mimic such a suspension. To believe the miracle, I would have to believe its occurrence is *more* likely than the fabrication of this video. Given what we know about the world and this technology, that's an impossible burden for the miracle to meet." This tightly integrates the core maxim with the degraded reliability of the evidence class caused by fabrication technology.
