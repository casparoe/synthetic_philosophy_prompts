prompt: |-
  So my older sister is getting married in like three weeks and she asked me (im 16, so definitely not the most qualified guest at this wedding) to give a short toast at the reception. The complicating part is that she and her fiancé are both econ PhD students, so a good chunk of the guest list is literally their cohort and their advisors, who'd clock it immediately if i mangled an actual argument, but the rest of the room is just family and her friends from high school who've never taken an econ class in their life.

  Back in like 7th grade, when i was whining that i had zero free time bc of homework and travel soccer, she told me about this Keynes essay (i think its called "Economic Possibilities for our Grandchildren"?) where he predicts that eventually machines and productivity growth basically solve "the economic problem" for good, and that the actually hard part left over is that most people won't know how to use all that freedom well bc we've only ever been trained to grind, not to live. she also mentioned some other, later essay of his, about his Bloomsbury friend group and a philosopher named G.E. Moore, where he says the only things that are genuinely good in and of themselves, as opposed to just being useful for getting something else, are basically love/personal relationships and beauty, and that money and ambition are just means, not ends.

  Can you write me the toast (like 2-3 minutes out loud, so probably under 400 words) using those two ideas for real, not just as a random namedrop, to say something true and actually kind of moving about the two of them, given that they're about to spend their whole careers professionally studying money while the entire point of a wedding toast is that this part, the love part, was never about money to begin with? i don't want it to turn into an econ lecture and lose grandma, but i also really don't want to get the actual Keynes stuff embarrassingly wrong in front of like fifteen economists.
