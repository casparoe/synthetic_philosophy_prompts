  Here's a toast weaving those Keynesian ideas together, aiming for warmth, accuracy, and accessibility:

  **(Raise glass, smile at the couple)** Hi everyone. For those who don't know me, I’m [Your Name], [Sister's Name]'s significantly younger and slightly terrified little brother. When she asked me to do this, my first thought was, *What could I possibly say about two brilliant economists that won’t make their entire PhD cohort cringe?*  

  Then I remembered something [Sister's Name] told me years ago, back when I was maybe 12, drowning in homework and soccer practice, complaining I had no life. She told me about this essay by John Maynard Keynes – yeah, *that* guy – called "Economic Possibilities for our Grandchildren." **(Glance at economists, nod slightly)**. He predicted that one day, thanks to technology and productivity, humanity would basically solve "the economic problem." We’d have enough. The real challenge, Keynes thought, wouldn't be *getting* wealth, but figuring out what truly matters *once* we have it. How do we live well when we don't *have* to grind?

  **(Shift focus fully to the couple)** And then she told me about another idea Keynes loved, inspired by his friend, the philosopher G.E. Moore. **(Another quick, confident glance at the econ section)**. That idea was simple but profound: the only things that are genuinely *good* in themselves, not just useful for getting something else, are love – deep, personal relationships – and the appreciation of beauty. Everything else, even money and ambition? They’re just tools. Means, not ends.

  **(Pause, look at Sister and Fiancé)** [Sister's Name] and [Fiancé's Name], I think you two understand this better than almost anyone. You’ve dedicated your careers to studying the machinery of the means – the money, the markets, the complex systems. But watching you together? It’s crystal clear that you’ve never lost sight of the ends. You found something genuinely *good* in each other. Your love, the way you support each other through dissertations and life’s craziness, the pure joy you clearly find in just *being* together... this is it. This is the point Keynes was worried we might forget how to value once the grinding stopped.

  **(Raise glass higher)** So here’s to you both. To two brilliant minds who study the means, but who clearly, deeply, cherish the ultimate ends. May your life together be filled with the abundance of love and beauty that truly matters. Congratulations! To [Sister's Name] and [Fiancé's Name]!

  **Why this works:**

  1.  **Accuracy:** Name-drops the correct essay ("Economic Possibilities for our Grandchildren"), correctly attributes the intrinsic goods concept to Moore's influence on Keynes (a key point economists would know), and accurately frames money/ambition as "means, not ends" and "tools." Economists will nod, not cringe.
  2.  **Accessibility:** Explains the concepts in simple terms ("solving the economic problem," "how do we live well," "genuinely good in themselves," "tools"). The soccer/homework story grounds it. No jargon.
  3.  **Heart & Relevance:** Directly connects the economic ideas to the couple's relationship and the moment. The core message is that *their love embodies the very thing Keynes said was the ultimate point*. It flips their profession studying "means" into a contrast highlighting the "end" they've found.
  4.  **Structure:** Personal anecdote -> Keynes Idea 1 (Future Abundance) -> Keynes Idea 2 (Intrinsic Goods/Love) -> Application to the Couple -> Toast.
  5.  **Word Count:** Roughly 350 words, perfect for 2-3 minutes.
  6.  **Tone:** Warm, slightly self-deprecating (16-year-old brother), respectful of their intellect, and celebratory of their love.

  **Delivery Tip:** Practice it out loud a few times. Focus on the heartfelt parts when looking at your sister and her fiancé, and the slightly more knowing nods during the Keynes/Moore bits when glancing towards the econ section. Speak clearly and not too fast. You've got this!
