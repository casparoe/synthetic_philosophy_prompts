answer: |-
  The asymmetry between the Liar and Curry paradoxes for paraconsistent logics stems from fundamental differences in the *structural* resources required for their respective trivializing derivations. While paraconsistency (the rejection of *Ex Contradictione Quodlibet* or **ECQ**: *A, ¬A ⊢ B*) suffices to block the Liar's triviality, Curry's paradox relies critically on a structural rule governing the reuse of premises, independent of negation. Here’s a technical breakdown:

  ### 1. **The Liar Paradox & Paraconsistency**
     - **Liar Sentence**: Let *L* be such that *L ≡ ¬True(⟨L⟩)* (or *L ≡ ¬L* in propositional form).
     - **Trivializing Derivation** (in classical logic):
       ```
       1. L ≡ ¬L          [Definition]
       2. L → ¬L          [1, Equivalence Elimination]
       3. ¬L → L          [1, Equivalence Elimination]
       4. L               [Assume for Contradiction]
         5. ¬L            [2,4 →Elim]
         6. L ∧ ¬L        [4,5 ∧Intro] (Contradiction)
       7. ¬L              [4–6 ¬Intro]
       8. L               [3,7 →Elim]
       9. L ∧ ¬L          [7,8 ∧Intro]
       10. B              [9, ECQ]     (Trivialization)
       ```
     - **Paraconsistent Block**: Reject **ECQ** (Step 10). Logics like **LP** (Priest’s Logic of Paradox) allow *L ∧ ¬L* to be true (a *dialetheia*) without entailing arbitrary *B*. Truth-value gluts (both true and false) prevent explosion.

  ### 2. **Curry's Paradox & the Need for Structural Restriction**
     - **Curry Sentence**: Let *C* be such that *C ≡ (C → B)*, where *B* is an arbitrary formula.
     - **Trivializing Derivation** (without negation or explicit contradiction):
       ```
       1. C ≡ (C → B)    [Definition]
       2. C → (C → B)    [1, Equivalence Elimination]  (a)
       3. (C → (C → B)) → (C → B)  [Contraction (W)]   (b)
       4. C → B          [2,3 →Elim]                 (c)
       5. (C → B) → C    [1, Equivalence Elimination]  (d)
       6. C              [4,5 →Elim]                 (e)
       7. B              [4,6 →Elim]                 (Trivialization)
       ```
       **Key Observation**: This derivation uses only:
       - Implication rules (→Intro, →Elim),
       - Equivalence elimination,
       - **Structural Contraction (W)** at step (b).

     - **Contraction (W)**: The rule *A → (A → B) ⊢ A → B* (or its structural counterpart: if *Γ, A, A ⊢ B*, then *Γ, A ⊢ B*). This allows the reuse of the premise *C* in deriving *B*.

  ### 3. **Why Paraconsistency Fails to Block Curry**
     - Curry’s derivation **never generates an explicit contradiction** (*A ∧ ¬A*). It relies solely on:
       1. **Self-reference** (*C ≡ (C → B)*),
       2. **Implicational logic** (→Elim, →Intro),
       3. **Contraction (W)**.
     - Paraconsistency only restricts inference from contradictions (i.e., rejects **ECQ**). Since Curry’s derivation is contradiction-free, **ECQ is never invoked**. Thus, paraconsistency alone offers no barrier to trivialization.

  ### 4. **The Core Proof-Theoretic Problem: Structural Contraction**
     The trivializing power of Curry lies in **contraction’s role in self-referential implication**:
     - From *C ⊢ C → B* (by definition) and *C ⊢ C* (reflexivity), we have:
       ```
       Γ, C ⊢ C → B
       Γ, C ⊢ C
       ```
       Applying →Elim requires **two instances** of *C*:  
       *Γ, C, C ⊢ B*.  
       Contraction then collapses these to *Γ, C ⊢ B*.
     - Without contraction, you only get *C, C ⊢ B*, which does not entail *C ⊢ B*. This prevents the derivation of *B* from *C* alone.

  ### 5. **The Required Restriction: Rejecting Contraction (W)**
     To block Curry, dialetheists must restrict **contraction** independently of negation rules. This is achieved in:
     - **Substructural Logics**: Linear logic (which rejects contraction) or affine logic (which rejects weakening).
     - **Relevance Logics**: Use non-contractive implication (e.g., **R** rejects *A → (A → B) ⊢ A → B*).
     - **LP-Specific Solutions**: Priest’s **LP** uses material implication (*A → B* ≡ ¬A ∨ B*). Since **LP** has no valid entailment principle like *A → (A → B) ⊨ A → B*, contraction is blocked semantically (truth-value gaps prevent the step from *C → (C → B)* to *C → B*). Proof-theoretically, **LP** lacks a deduction theorem for →, avoiding the issue.

  ### 6. **Underlying Asymmetry: Contradiction vs. Resource Management**
     - **Liar**: Involves *negation* and *contradiction*. Blocked by rejecting **ECQ** (a negation rule).
     - **Curry**: Involves *implication* and *self-application*. Blocked by rejecting **contraction** (a structural rule governing premise reuse).

  **Conclusion**: Paraconsistency addresses inferential responses to contradictions but is inert against Curry’s paradox, which exploits the structural rule of contraction in the context of self-referential implication. Dialetheists must therefore adopt substructural restrictions (like rejecting **W**) or weaken implication to prevent Curry trivialization. This highlights a deeper truth: negation and implication impose distinct demands on a logic’s proof theory, and resolving all paradoxes requires attention to both.
