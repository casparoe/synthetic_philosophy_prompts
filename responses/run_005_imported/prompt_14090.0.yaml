prompt: |-
  quick question about Lewis's Convention that i want to get right before turning in my dissertation chapter on norm emergence. his common knowledge condition for a convention to hold is just that everyone in the population knows what the convention is, and knows that everyone else knows it too. im trying to operationalize this in my agent-based model, so should i just give each agent a correct belief about the equilibrium strategy plus a correct second-order belief about what everyone else believes and call that "common knowledge satisfied," or is Lewis actually asking for something more elaborate than that?
