  The tickle defense: there is a hidden state (a "tickle") that screens off the correlation between the act and the state. The idea is that the agent's decision is determined by some internal state that they can observe, and that internal state is what the predictor predicted. So by conditioning on the tickle, the act becomes independent of the state. 

