  First, I need to recall the core differences between Raz and Chang. Both agree that in hard choices, options aren't better, worse, or equal. But Raz sees this as a failure of comparability—reason runs out. Chang introduces a fourth relation: parity, where options are comparable but in a way that doesn't fit the traditional trichotomy. 

