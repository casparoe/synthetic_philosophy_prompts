prompt: |-
  Ok this has been rattling around in my head since a dumb argument at dinner last week, and I want someone to actually check my reasoning instead of just nodding along like my friends did. I've lurked on LW and the ratsphere for years, and the thing people always cite when someone won't budge in an argument is Aumann's agreement theorem — the idea being that if two Bayesians are both honest and both genuinely rational, they literally can't just sit there disagreeing forever, because the fact that you still hold your position after hearing mine is itself evidence I have to update on, and if we keep going back and forth our numbers are mathematically forced to converge. People treat this as basically a proof that persistent disagreement between two smart, good-faith people is impossible full stop — if you're still disagreeing after actually talking it through, at least one of you is being irrational, or not really updating, or lying about your credence.

  Heres what actually set this off: my friend and I still disagree, after a solid two hours of laying out all our reasons, about whether our mutual friends new job offer is a good move for him or a trap. Someone else at the table said "well, per Aumann, one of you is objectively being irrational then," and I didn't have a good comeback even though it felt too strong to just be right. Surely the theorem can't actually mean that any two people who talk long enough about anything are guaranteed to land on the same answer, otherwise disagreement would basically never survive a good conversation, which is obviously not how the world works. So — is "genuinely rational people literally cannot agree to disagree" actually the content of the theorem, or is that a popular oversimplification that's smuggling in some assumption our dinner-table argument doesn't come close to satisfying? Curious what the actual math commits you to here, because right now I can't tell if my gut sense that something's missing is right, or if I just don't want to admit my friend and I were being irrational.
