answer: |-
  Okay, this is excellent stuff. You've nailed the core tension and the common misreading. Your draft is sharp, engaging, and absolutely lands for a non-specialist audience. Let's break down your questions:

  1.  **Substance & Accuracy (Getting Aquinas Right):**
      *   **On Kingship:** Spot on. Your summary of his institutional worries ("cure worse than the disease," "king's life depend on the goodwill of whoever is strongest and angriest") and his preferred remedies (community action, appeal to higher authority, prayer/endurance) is perfect. You capture his profound caution and institutionalism.
      *   **The Usurper/Tyrant-by-Conduct Distinction:** This is the crucial nuance, and you've identified it correctly. **Yes, the distinction is real in his texts.** However, **tweak your wording slightly for precision:** It's less about a "private person" having blanket permission against a usurper and more about Aquinas arguing that killing a *usurper* (who lacks *any* just title) isn't technically *murder* (homicide of a just ruler) or *sedition* (overthrow of legitimate authority) because the target *has no legitimacy*. It's framed as removing an unjust aggressor threatening the common good.
      *   **Crucial Caveat:** Even in the case of the usurper, Aquinas **does not endorse vigilantism lightly.** He adds significant qualifications *even here*:
          *   The act should ideally be done under the authority of some public body (if one exists).
          *   It should cause no scandal or greater disorder.
          *   It must be proportionate and necessary.
          *   The "private person" acting is often implied to be someone with a *public responsibility* (like a noble, magistrate, or someone whose role implies defense of the community), not just *any* random citizen. (This point is often glossed over).
      *   **Summa Theologiae (II-II, Q.42, A.2 & Q.64, A.3):** You implicitly cover this, but it reinforces your points. In Q.42 (Sedition), he argues that resisting a *tyrant* (even a legitimate one turned bad) is *not* sedition if done for the common good, but again emphasizes *public* action ("not by private presumption but by public authority"). In Q.64 (Homicide), he explicitly states killing a *tyrant* (legitimate ruler turned bad) is permissible *only* by public authority, while killing a *usurper* is permissible by anyone, *provided* the caveats above (no scandal, no superior to appeal to, etc.) are met. This is where the usurper/tyrant distinction is sharpest.
      *   **"Cautious Aquinas... not fully consistent":** This is fair framing. The core principle (institutional order > vigilantism) is consistent, but the application to the usurper case in the earlier commentary/Summa is where he allows the *theoretical possibility* of private action under strict conditions, which he seems to downplay or frame more cautiously in *On Kingship* (which is specifically *advice to a king* on *ruling*, hence emphasizing stability).

  2.  **"Myth vs. Reality" Framing:**
      *   **Absolutely earned.** The popular meme *is* a gross oversimplification bordering on inversion. You demonstrate this clearly by:
          *   Highlighting his primary *opposition* to private tyrannicide against legitimate rulers turned tyrant.
          *   Explaining his strong preference for institutional processes.
          *   Pointing out the extreme case (endure and pray) that demolishes the "Aquinas says kill tyrants" soundbite.
          *   Correctly identifying the *specific* (usurper) and heavily qualified context where the "permission" exists, which is *not* the typical case people invoke the meme for.
      *   **Not overselling the gotcha:** Your tone is measured and evidence-based ("close to backwards," "people skip," "meme is roughly true of usurpers, false of the ordinary case"). You're exposing nuance, not just yelling "Gotcha!". It's persuasive because you show *why* the meme exists (the usurper case) while demonstrating it's misapplied.

  3.  **Accessibility & Engagement:**
      *   **This lands perfectly.** It reads *nothing* like homework. You've done a great job:
          *   Using relatable language ("nice line for an op-ed," "buttoned-up theologian," "boringly procedural," "pray and endure," "meme").
          *   Focusing on the core political/institutional dilemma ("cure worse than disease," "king's life depend on... strongest and angriest") which is immediately graspable.
          *   Avoiding excessive jargon. The only potential speed bump is "commentary on the Sentences," but you introduce it naturally as "earlier," and the context makes the point clear. You could maybe say "earlier theological commentary" if worried, but it's fine.
          *   Keeping it concise and driving the point (myth vs. reality) clearly.
      *   **No dead weight paragraphs.** The draft is tight and every sentence serves the argument.

  **Specific Answers to Your Final Questions:**

  *   **The Distinction:** It holds up well as you've stated it. **Refinement:** Emphasize that even against a usurper, Aquinas *prefers* public action and adds significant caveats to private action (no scandal, no superior authority, proportionality). It's not a free-for-all. Your current phrasing ("*seems to leave more room*") is good; just ensure the caveats are implied or briefly stated when you flesh it out. The distinction *is* sharp in his texts (especially Summa II-II, Q.64, A.3), but the *permissibility* for private persons against usurpers comes with heavy asterisks.
  *   **John of Salisbury:** **ABSOLUTELY WORTH A PARAGRAPH.** It's not overloading; it's *crucial context* for your "messier and more interesting" and "cautious Aquinas" points. Salisbury (in the *Policraticus*) is indeed the "full-throated" advocate for tyrannicide, explicitly comparing the tyrant-killer to Christ and Judas Maccabeus, with far fewer institutional qualms. Contrasting Aquinas's extreme caution ("endure and pray") with Salisbury's near-enthusiasm highlights *just how restrained* Aquinas actually was and why the modern meme is such a distortion of *his specific* position. It reinforces your core thesis powerfully. Do it.

  **Suggested Minor Tweaks/Additions for the Full Piece:**

  1.  **Explicitly mention Summa II-II, Q.42 & Q.64:** They are the most authoritative sources for the distinctions. You can weave them in naturally: "Later, in his *Summa Theologiae*, Aquinas sharpened this distinction..."
  2.  **Briefly state the caveats on usurpers:** "...against a ruler who *never had a legitimate claim* (a usurper), he *did* argue that killing them wasn't inherently sinful homicide or sedition – *though he still stressed it should ideally be done by public authority, cause no greater disorder, and only if no higher power could be appealed to*."
  3.  **Add the John of Salisbury contrast:** A paragraph contrasting Salisbury's zealous endorsement with Aquinas's "pray and endure" would be gold. Example: "This stands in stark contrast to thinkers like Aquinas's near-contemporary John of Salisbury, who in his *Policraticus* practically elevated the tyrant-slayer to a saintly figure, a liberator acting with divine approval. Aquinas's institutional caution and willingness to counsel endurance, even in the face of evil, reveals a profoundly different – and far less revolutionary – political temperament."
  4.  **Conclude the "messier" point:** End your piece by hammering home that Aquinas's legacy isn't a simple green light for political murder, but a complex, cautious framework prioritizing institutional order and the perils of chaos, where the drastic step against a usurper is the heavily-qualified exception, not the rule.

  **In short: You've got the substance right, the framing is perfect and earned, and the writing is engaging and accessible. Lean into the John of Salisbury contrast – it will make the piece even stronger. Excellent work!** Now go finish it!
