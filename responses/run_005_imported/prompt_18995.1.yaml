answer: |-
  You've articulated Quine's core project and the apparent tension in his approach to ethics with remarkable precision. Your reading is astute: Quine *does* hesitate to naturalize ethics in the same radical, dissolutionist way he naturalized epistemology. Specialists generally agree that his position in "On the Nature of Moral Values" (1978) is significantly more guarded. Here's a breakdown of why:

  1.  **Your Core Insight is Correct:**
      *   **Epistemology Naturalized:** Quine definitively argues that the traditional normative project of epistemology (justifying beliefs via first philosophy) is bankrupt. It should be replaced by the *descriptive* science of how beliefs are *actually* formed and revised in response to sensory input – psychology, neuroscience, linguistics.
      *   **The Apparent Inconsistency:** As you note, the logical extension of this naturalism would treat moral values similarly: dissolve "ought" questions into descriptive questions about innate predispositions, cultural conditioning, psychological mechanisms, and sociological patterns of valuation. Moral disagreements would be empirical disputes awaiting resolution by social science.
      *   **Quine's Hesitation in Ethics:** Quine explicitly *resists* this full dissolution in his ethics essay. He doesn't reduce normative ethics *entirely* to descriptive sociology/psychology. He maintains a role for normative discourse, albeit a naturalized one.

  2.  **Quine's Guarded Position in "On the Nature of Moral Values":**
      *   **Values as Natural Phenomena:** Quine *does* naturalize the *source* of moral values. He sees them as arising from innate biological predispositions (e.g., sympathy, a sense of fairness) heavily shaped and elaborated by cultural conditioning. They are part of the natural world.
      *   **The Persistence of the Normative:** However, Quine argues that while the *genesis* of values is descriptive (psychology/sociology), the *language* and *function* of ethics remain inherently normative. He doesn't believe we can or should simply *replace* "This is wrong" with "My culture disapproves of this" or "This triggers my innate aversion response."
      *   **Normative Discourse as a "Scientific Auxiliary":** This is his key move. Quine views normative language (like "ought," "should," "right," "wrong") not as describing non-natural moral facts, but as a vital *pragmatic tool* within our naturalized worldview. Its function is:
          *   **Coordination & Persuasion:** To influence behavior, coordinate social action, express approval/disapproval, and persuade others towards shared goals or away from harmful actions.
          *   **"A Scientific Branch of a Science of Man":** He famously calls normative ethics "a scientific branch of a science of man" (specifically, "the technology of pursuing the good"). This means it's an *instrumental* discipline based on our best scientific understanding of human flourishing, social stability, and innate tendencies. Its goal is to recommend strategies for achieving desired states (the "good"), where the "good" itself is ultimately rooted in those natural human dispositions and cultural goals.
      *   **Moral Disagreement:** While *some* moral disagreements might be resolvable empirically (e.g., disputing facts about consequences), core clashes in fundamental values might persist. Quine sees normative discourse as the arena for *reasoning* about and *advocating* for values within this naturalistic framework, using persuasion based on shared premises or consequences. It's not *just* an unfinished empirical inquiry; it's an ongoing practical negotiation using normative tools.

  3.  **Principled Reasons for Quine's Hesitation:**
      Why did this committed naturalist stop short of full dissolution? Several principled (and interconnected) reasons emerge:
      *   **The Pragmatic Function of Language:** Quine was deeply influenced by pragmatism (Dewey, but also his own holism). He recognized that language has different jobs. Normative language serves a distinct *practical*, action-guiding, persuasive function that purely descriptive language about psychological states or social facts cannot fully replicate *in social interaction*. Trying to *only* use descriptive language ("My dopamine levels dip when I see X") would cripple social coordination. Normative language ("X is wrong") is efficient and effective for its purpose.
      *   **Avoiding Nihilism/Inertia:** A purely descriptive account ("People value Y") might seem to lack motivational force or provide no basis for *critique* or *change*. If ethics is *only* about describing what *is* valued, it offers no leverage to argue for what *should be* valued. Quine wanted a naturalized ethics that could still support social reform, condemnation of atrocities, and the promotion of welfare – activities that seem to require normative force. His "scientific auxiliary" provides a naturalistic basis for this force (grounded in shared human goals/needs) while retaining the normative language necessary to wield it effectively.
      *   **The Instrumental Role of Norms:** Quine saw norms (epistemic and ethical) as tools developed within our evolving conceptual scheme to help us navigate the world and live together. Just as we retain norms of logic and scientific method because they *work* for prediction and control, we retain ethical norms because they *work* for social cohesion and survival. Dissolving the normative language entirely would discard a useful instrument. He aimed to *explain* the instrument naturalistically (its origins, materials) while acknowledging its distinct *use*.
      *   **Holism and Web of Belief:** Quine's holism suggests that our web of belief includes both descriptive and prescriptive strands, tightly interwoven. Ripping out the prescriptive/normative strand entirely might destabilize the whole structure in ways that are pragmatically undesirable. The normative language is deeply embedded in how we function socially.

  **Conclusion:**

  Yes, you have sized up his actual position correctly. Quine naturalizes the *origins* of moral values but balks at dissolving the *normative dimension* of ethical discourse into *mere* description. His principled reason is fundamentally **pragmatic**: Normative language serves a unique, indispensable, action-guiding, and socially coordinating function within our naturalized worldview. It is a "scientific auxiliary" – a technology based on our best naturalistic understanding of humanity – essential for pursuing the "good" (itself a naturalistically grounded concept). He seeks to explain norms naturalistically *without* eliminating their distinct normative force in practice. This makes his naturalized ethics less radical than his naturalized epistemology, where the *justificatory* project was deemed illusory and replaced wholesale. For Quine, the *normative* project in ethics, grounded in natural facts and serving practical human ends, remains valid and necessary. Specialists like Gilbert Harman (a Quinean naturalist about ethics) or Richard Rorty (focusing on the pragmatic function) often highlight this cautious, pragmatic strand as central to understanding Quine's position on morality.
