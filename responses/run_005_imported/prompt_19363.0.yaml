  First, I need to break down Jae's argument. He claims that saving a child's life sets off a chain of events with unknowable consequences—positive or negative—and that we can't even assign probabilities to these outcomes. The user countered with the idea that unknown effects might average out, but Jae dismissed that as an unsupported hope. The user is now doubting whether it's possible to make rational decisions based on expected outcomes.

