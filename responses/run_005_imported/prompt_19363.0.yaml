  I recall that effective altruists address this through counterfactual reasoning and focusing on measurable short-term outcomes. For example, bed nets reduce malaria deaths now, which is a concrete good. Even if long-term effects are uncertain, preventing immediate suffering has intrinsic value. Also, the point about averaging out effects is common in decision theory, but Jae's objection about asymmetry is worth considering. However, without evidence of systematic skew, the default assumption is neutrality.

