prompt: |-
  So this whole topic got weirdly personal for me a few weeks ago. My cousin got pulled over with alcohol in the car, and it turned out he'd been drinking at OUR house beforehand — my uncle (his dad) told everyone to just not mention that part to anyone, since its technically his third strike and he'd loose his job over it. Half the family thinks staying quiet is just what you do for blood, the other half thinks that's basically enabling him. Anyway, I'm taking a comparative ethics seminar this semester and we landed on Confucian role ethics right while all this was still fresh, and I got kind of fixated on Analects 13.18 — the bit where the Duke of She brags about an "upright" guy who turned his own father in for stealing a sheep, and Confucius says no, real uprightness is the father covering for the son and the son covering for the father. Then we read the even crazier version in Mencius (7A35, I think?), where Mencius says that if Shun's father Gusou murdered someone, Shun should just secretly carry the old man on his back, ditch the entire empire like a worn-out shoe, and go live by the sea, rather than let the judge Gao Yao anywhere near him — even though Shun is literally the emperor at the time.

  My professor mentioned there's an actual modern academic fight over this exact stuff — something about a scholar (Liu Qingping? I might be botching the name) arguing that the "concealment" strand basically turns Confucianism into a philosophy of nepotism and corruption, and a bunch of other people firing back hard. She tied the pushback to the "Confucian role ethics" idea — that you're not even a coherent "self" apart from your roles (father, son, ruler, etc.) — so framing this as "impartial duty vs. family loyalty" already smuggles in a pretty non-Confucian, atomized picture of the person. Anyway it's been sitting right next to my cousin situation in my head ever since, so now I can't stop chewing on it.

  Could you write me a dialogue that really digs into this: one person defending the concealment norm using that Confucian role-ethics framework, and a Mohist arguing from the opposite corner, from something like "impartial care" (jian'ai), that graded, role-based loyalty is exactly the mechanism that produces nepotism and can't survive taking everyone's interests seriously once you actually think it through. I'd like them to get concretely into the Shun/Gusou case specifically, not just the sheep-stealing one, since it's the harder test case. And please don't let either side be a pushover — I don't want the Mohist to just be "cold logic guy" who obviously loses, or the Confucian to win by basically just asserting that family matters more; I want them actually engaging with each other's strongest moves, not talking past each other.
