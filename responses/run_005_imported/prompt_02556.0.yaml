  Here’s a dialogue digging into the Confucian concealment debate through the lens of Shun’s dilemma, featuring a Confucian role ethicist ("Wei") and a Mohist ("Kai"). Both engage with each other’s core principles, avoiding caricature:

  **Setting:** A university common room after a seminar on early Chinese ethics.  
  **Characters:**  
  - **Wei:** Defends Confucian role ethics and concealment norms.  
  - **Kai:** Argues from Mohist *jian’ai* (impartial care).  

  ---

  **Kai:** (Leaning forward) Alright, Wei—let’s cut to Shun. Mencius 7A35. The emperor’s father, Gusou, murders someone. Shun’s solution? Abandon the empire, hide his father by the sea, and actively obstruct justice. How is this *not* a blueprint for corruption? Liu Qingping’s right—this turns ethical roles into a license for nepotism.  

  **Wei:** (Calmly) Kai, you’re starting from the wrong place. You’re framing this as "justice vs. family loyalty," as if they’re separate forces pulling on some abstract, atomic "Shun-self." But Confucian role ethics says Shun *is* his roles. His father-son relationship isn’t one hat he wears—it’s constitutive of his very being. To hand Gusou to Judge Gao Yao isn’t just "doing duty"; it’s a kind of existential self-betrayal.  

  **Kai:** Self-betrayal? What about the victim? Or society? Shun isn’t *just* a son—he’s the *emperor*. His role demands he uphold order impartially. By shielding a murderer, he’s failing everyone who relies on him for protection. *Jian’ai* demands equal consideration: Gusou’s life isn’t inherently worth more than the victim’s.  

  **Wei:** Equal consideration sounds noble, but it’s practically impossible. We care *through* our roles. Imagine Shun coldly calculating: "Gusou’s life = victim’s life, therefore hand him over." That wouldn’t be impartiality—it would be inhuman. Confucianism recognizes that ethics emerge from particular bonds. Shun’s choice to flee with Gusou isn’t corruption; it’s the ultimate expression of *xiao* (filial piety), which grounds all other virtues. He sacrifices his throne—his highest social role—for his deepest relational role. That’s integrity.  

  **Kai:** (Eyes sharpening) But *why* is filial piety the ultimate ground? That’s arbitrary! Mohism asks: what system actually benefits everyone? Graded love—where family loyalty overrides all—*guarantees* injustice. If the emperor’s father can murder with impunity, what message does that send? The victim’s family gets no closure. Society sees that status protects criminals. That’s not order—it’s feudalism. *Jian’ai* forces us to ask: "What if it were *my* family murdered? Would I accept Shun’s choice?"  

  **Wei:** (Nodding) A fair challenge. But consider the alternative. If Shun *does* turn in Gusou, he reduces the father-son bond to a contract conditional on good behavior. That erodes the very trust that makes family the bedrock of society. Mencius’s point is radical: even the empire—the highest political good—is a "worn-out shoe" compared to that bond. Without that foundation, your "impartial system" floats in a void. Who cultivates the empathy needed to care impartially? It starts in the family.  

  **Kai:** (Passionately) Does it? Or does it start *and stop* there? Look at your cousin’s situation. The family "concealment" protects *him*—but what about the next person he might hurt driving drunk? What about the victim of his past strikes? Confucian role ethics seems to say: "His role as your cousin defines your duty. The stranger’s interests exist outside the circle." But Mohism says: *everyone* is included in the circle. Your cousin’s victim has a family too. Their grief matters equally. Concealment isn’t integrity—it’s tribalism.  

  **Wei:** (Leaning in) But Kai, your "circle" has no texture. *Jian’ai* treats all relationships as interchangeable. But they’re not. The intensity of care between parent/child or ruler/minister isn’t arbitrary—it’s what makes social life meaningful. Shun *does* acknowledge the victim’s family’s suffering—that’s why he flees! He removes Gusou from society, accepting exile. He doesn’t flaunt the crime. The concealment is tragic, not triumphant.  

  **Kai:** Exile isn’t justice! It’s privatization. Shun avoids the public reckoning. The victim’s family gets no answer, no accountability. And what about Gao Yao, the judge? His role is meaningless if the emperor undermines him. You talk of "texture," but Confucian roles stratify society into insiders and outsiders. The outsider—the victim—always loses. *Jian’ai* demands we *flatten* that hierarchy when lives are at stake.  

  **Wei:** (Pausing) And if flattening it destroys the relationships that motivate care in the first place? If Shun betrays Gusou, he becomes a man who prioritizes abstract duty over flesh-and-blood commitment. What kind of ruler does *that* make him? One who sees people as cases, not persons. The Mohist world risks becoming coldly transactional.  

  **Kai:** (Firmly) And the Confucian world risks becoming clannishly unjust. We can cultivate care *beyond* blood—through shared institutions, laws applied equally. That’s how we protect *all* families. Your cousin’s third strike isn’t a private matter; it’s a public danger. Concealing it doesn’t honor your role—it corrupts it by valuing his position over his character. *Jian’ai* asks: "What care does he *owe* society after two failures?" Not silence—accountability.  

  **Wei:** (Quietly) And Mencius asks: "Can you truly be human if you sever the root to save the branch?"  

  **Kai:** (Eyes locked) And Mozi asks: "Can any root thrive if its branches poison the soil for everyone else?"  

  *(They sit in silence, the tension unresolved but the stakes clarified.)*  

  ---

  **Key Dialogic Moves:**  
  1. **Wei’s Strongest Case:**  
     - Rejects atomized selfhood; concealment as existential fidelity to constitutive roles.  
     - Sacrificing the empire (political duty) for filial piety shows relational integrity > abstract duty.  
     - *Jian’ai*’s "equal care" risks being empty without thick relational foundations.  

  2. **Kai’s Strongest Case:**  
     - Graded love systemically privileges insiders, betraying outsiders (victim’s family/society).  
     - Concealment undermines public institutions (Gao Yao’s judgeship) needed for universal welfare.  
     - *Jian’ai* protects *all* families by demanding impartial systems—especially from those in power (Shun).  

  3. **Engagement, Not Caricature:**  
     - Wei acknowledges the victim’s suffering (Shun’s exile as tragic).  
     - Kai grants that care originates in relationships but argues it *must* extend impartially.  
     - Both tie the Shun case to modern consequences (e.g., enabling repeat offenses).  

  This mirrors the academic debate: Liu Qingping sees "concealment" as corruption; role ethicists (Ames/Rosemont) see it as preserving the relational self. Neither "wins"—the dialogue lives in the tension between irreducible particularity and universal accountability.
