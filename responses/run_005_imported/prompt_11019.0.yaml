prompt: |-
  So my city council meeting this week turned into a three-hour shouting match over a ballot measure to decriminalize personal drug possession, and one neighbor kept saying things like "even if it's not hurting anyone else, a community that stops being willing to say some things are just wrong is a community coming apart," while another neighbor fired back that that's exactly the kind of reasoning that's historically been used to criminalize homosexuality and interracial relationships. Afterward someone told me this is basically a rehash of the old Hart vs. Devlin fight over legal moralism, and I've been down a rabbit hole on it ever since. Could you write me a dialogue between a Hart-style defender of the harm principle and a Devlin-style legal moralist, arguing it out over this same measure? Dont let them just talk past eachother -- I want the Devlin character to actually answer for why a community's felt disgust or intolerance is good evidence of anything beyond prejudice, and I want the Hart character to answer for why laws that clearly aren't about preventing harm to others (consensual adult incest, obscenity laws, that sort of thing) don't already show that even liberal legal systems enforce morality for its own sake. Make them equally sharp and have them genuinely respond to each other's actual arguments instead of just monologuing past one another.
