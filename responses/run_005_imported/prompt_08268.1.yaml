prompt: |-
  Last night, a friend from my epistemology seminar and I spent nearly two hours arguing about whether pragmatic encroachment and epistemic contextualism are genuinely rival theories of knowledge or just two vocabularies for the same underlying idea. Their position was that since both were developed to accommodate the same wavering intuitions about knowledge claims — our reluctance to say someone "knows" something once enough rides on it — the disagreement between contextualism (in the tradition of Lewis, Cohen, and DeRose) and pragmatic encroachment (as developed by writers like Hawthorne, Stanley, and Fantl and McGrath) is largely terminological: a choice between relativizing the truth-conditions of "knows" to a conversational context or instead rejecting invariantism about knowledge itself, with no real difference in what the two views predict. I disagreed, and tried to make my case with an example designed to pull the two apart: a lab technician reads a routine test result as negative and tells a colleague there's nothing to worry about, basing this on perfectly ordinary evidence of just the kind she relies on every day; unbeknownst to her, a great deal in fact turns on whether she's right, though nothing about the situation ever prompts her to suspect this or to check twice. Now suppose two people, afterward, assess whether she "knew": one is idly discussing the case with no stakes of their own, purely out of curiosity, while the other must decide, solely on the strength of her say-so, whether to act. My friend and I went back and forth about exactly what a contextualist and a pragmatic-encroachment theorist are each committed to saying about the technician's own knowledge and about each of the two attributions, and why — without ever settling it to either of our satisfaction.

  I'd like you to succeed where we didn't. Please compare pragmatic encroachment and epistemic contextualism as theories of knowledge, being precise about what each view takes to actually fix the standards governing correct applications of "knows" — facts about the subject's own practical situation, on the one hand, versus facts about the attributor's conversational context, on the other — and then work through the case above to show exactly where, and why, their respective verdicts about the technician and the two attributors can come apart. I'm especially interested in the question my friend and I never resolved: once the case is spelled out this carefully, is the disagreement between the two views substantive, or does it collapse into something merely verbal? Please give a definite answer and defend it.
reasoning: |-
  Okay, I need to tackle this user's query about pragmatic encroachment versus epistemic contextualism. The user had a long debate with a friend and wants a clear comparison, especially using the lab technician example. Let me start by recalling the core differences between the two theories.

  Pragmatic encroachment (PE) ties knowledge to the subject's practical stakes. If the stakes are high for the subject, the epistemic standards needed for knowledge increase. So, the technician's knowledge depends on her own stakes, even if she's unaware of them. Contextualism (CTX), however, says that the truth conditions of "knows" depend on the attributor's context. The standards shift based on the conversation, not the subject's situation.

  Now, the lab tech case: she has ordinary evidence, but high stakes unbeknownst to her. Two attributors—one with low stakes (curiosity), one with high stakes (needing to act). Under PE, the tech doesn't know because her stakes are high. The attributors' contexts don't affect whether she knew. Both attributors' statements about her knowledge would be false because she didn't meet the high standards at the time.

  Under CTX, the tech's own stakes don't matter. Her knowledge depends on her context, which was low-stakes. So she did know. The attributors: the low-stakes one correctly says she knew because their context has low standards. The high-stakes attributor, with elevated standards, correctly says she didn't know. Both attributors are right in their own contexts.

  Where do they diverge? The key point is whether the tech actually knew. PE says no (high stakes for her), CTX says yes (her context was low-stakes). Also, the attributors' assessments: PE says both are wrong because she didn't know. CTX says both are correct relative to their contexts. So substantive differences in predictions.

  Is this just terminological? The user wants to know if the theories are rivals or the same in different words. The metaphysical commitments differ: PE ties knowledge to subject's practical situation, making knowledge partly non-epistemic. CTX keeps knowledge purely epistemic but context-sensitive. They also handle disagreement differently. PE has invariantism; the truth is fixed. CTX is contextualist; truth varies. The lab case shows conflicting predictions, so they can't be the same theory. That makes the disagreement substantive.
answer: |-
  Your debate cuts to the heart of a major controversy in epistemology. Let's clarify the core commitments of each view, apply them rigorously to your lab technician case, and settle the question of substantive disagreement.

  **Core Commitments:**

  1.  **Pragmatic Encroachment (PE - Subject-Sensitive Invariantism):**
      *   **What fixes "knows" standards?** The subject's own practical situation (stakes, interests, potential costs of being wrong) *at the time of belief formation/assessment*. High stakes *for the subject* raise the epistemic standards required for a true knowledge attribution *to that subject*.
      *   **Invariantism?** Yes, but *subject-sensitive*. The truth conditions of "S knows that p" are invariant across attributor contexts *for a fixed subject and time*. However, those truth conditions themselves depend partly on the subject's practical situation. Knowledge itself is not purely epistemic; practical factors "encroach" on it.
      *   **Key Claim:** Whether S *knows* p depends on how much is at stake *for S* in being right about p, regardless of what anyone *saying* "S knows" cares about.

  2.  **Epistemic Contextualism (CTX):**
      *   **What fixes "knows" standards?** The attributor's conversational context – the practical interests, presuppositions, salience of error possibilities, and goals operative in the conversation *where the knowledge attribution is made*. High stakes *in the attributor's context* raise the standards for correctly *using* the word "knows" in that conversation.
      *   **Invariantism?** No. The semantic content of the word "knows" (and thus the truth conditions of "S knows that p") shifts depending on the context of utterance. The *subject's* practical situation is irrelevant to the truth of an attribution *made about them*.
      *   **Key Claim:** The *truth* of "S knows that p" depends on the epistemic standards relevant *in the context where that sentence is uttered*, not on the subject's practical situation. Knowledge itself (as a relation between S, p, and S's evidence) remains purely epistemic; only the *semantics* of "knows" is context-sensitive.

  **The Lab Technician Case - Verdicts:**

  *   **The Technician (S) at Time T (belief formation):**
      *   **S's Practical Situation (Unbeknownst to her):** High stakes (a great deal turns on her being right).
      *   **S's Evidence:** Ordinary, routine, perfectly adequate *for everyday low-stakes purposes*.
      *   **S's Psychological State:** No awareness of high stakes, no heightened doubt.

  *   **Attributor A1 (Low-Stakes Attributor):** Discussing idly, purely out of curiosity. Low stakes in their conversational context.
  *   **Attributor A2 (High-Stakes Attributor):** Must decide solely on S's say-so whether to act. High stakes in their conversational context.

  *   **Question 1: Did the Technician (S) *know* at Time T that the result was negative?**
      *   **PE:** **No.** The standards for S to know are fixed by *S's practical situation at T*. Since the stakes were high *for S* (even though unknown to her), the epistemic standards she needed to meet were raised. Her ordinary, routine evidence was insufficient to meet these high-stakes standards. She did not know. Her ignorance of the stakes is irrelevant; what matters is the objective practical importance of being right *for her role/decision*.
      *   **CTX:** **Yes (relative to S's context at T).** Knowledge attributions *about S* depend on the attributor's context. However, the question "Did S *know* at T?" asks about S's epistemic state *at T*. Crucially, *at T*, S was in a *low-stakes context*. Her evidence was adequate *for the standards operative in her own low-stakes practical situation*. Therefore, relative to the standards governing S's own context when she formed the belief, she *did* know. CTX focuses on the context *of attribution*, but when asking about knowledge *at a past time*, the relevant context for assessing the truth of that past-tense knowledge attribution is typically the *subject's context at that past time* (or a context relevant to describing that past state). So, S knew at T.

  *   **Question 2: Is Attributor A1 (Low-Stakes) correct when they say "The technician knew"?**
      *   **PE:** **False.** PE is invariantist regarding the truth of "S knew at T". Since S did *not* know at T (because of the high stakes *for her*), any attribution "S knew" is false, regardless of who says it or why. A1's low stakes don't lower the standards S had to meet. A1 is simply wrong.
      *   **CTX:** **True.** The standards for correctly using "knows" are set by A1's low-stakes conversational context. Relative to these low standards, the technician's ordinary evidence was sufficient. Therefore, "The technician knew" is true *as uttered by A1 in their low-stakes context*.

  *   **Question 3: Is Attributor A2 (High-Stakes) correct when they say "The technician did *not* know"?**
      *   **PE:** **True.** Again, invariantism applies. S did *not* know at T. So A2's statement "The technician did not know" is true. A2's high stakes align with the truth (S didn't know) but don't *cause* it; they merely reflect the fixed fact.
      *   **CTX:** **True.** The standards for "knows" are set by A2's high-stakes conversational context. Relative to these high standards, the technician's ordinary evidence is *insufficient*. Therefore, "The technician did not know" is true *as uttered by A2 in their high-stakes context*.

  **Where and Why They Diverge:**

  1.  **The Technician's Knowledge (Q1):** This is the most critical divergence. PE says S did *not* know because of the high stakes *for S*. CTX says S *did* know because the standards governing her *own* context were low. This difference stems directly from their core commitments: PE ties knowledge to the *subject's* practical situation, while CTX ties the *truth of attributions* to the *attributor's* context, allowing S to have known relative to her own low-stakes context.
  2.  **Attributor A1's Statement (Q2):** PE says A1 is *wrong* (false statement) because S didn't know. CTX says A1 is *right* (true statement) relative to their low standards. PE sees a single fact about S's past knowledge state; CTX sees the truth of the attribution as relative to the context of attribution.
  3.  **Attributor A2's Statement (Q3):** Both views agree A2's statement is true, but for *radically different reasons*. PE says it's true because it correctly describes the fixed fact that S didn't know (due to S's stakes). CTX says it's true *only* relative to A2's high standards – it doesn't imply S lacked knowledge relative to *her own* standards at T, only that she doesn't meet *A2's* current high standards.

  **Substantive vs. Verbal Disagreement: A Definite Answer**

  **The disagreement is substantive, not merely verbal.** Here's why:

  1.  **Different Predictions about the World (S's State):** The views make incompatible claims about the *metaphysical state* of the technician at the time of belief. PE claims there is a *fact of the matter* about whether S knew, determined partly by her practical situation, and that fact is *high-stakes*: S did not know. CTX claims that the *only* facts* about knowledge are relative to contexts of assessment. While CTX can say S knew relative to *her* context, it denies there is a non-relative fact "S knew simpliciter" that PE asserts. PE posits a practical element *within the knowledge relation itself*; CTX confines practicality to the *semantics of attribution*.
  2.  **Different Explanatory Targets:** PE explains our wavering intuitions by claiming that *knowledge itself* is sensitive to stakes. CTX explains them by claiming our *word "knows"* is context-sensitive. These are different mechanisms: one alters the nature of knowledge, the other alters the meaning of the word.
  3.  **Different Handling of Disagreement:** Suppose A1 (low-stakes context) says "S knew" and A2 (high-stakes context) says "S did not know." PE must say one is objectively *wrong* (specifically, A1 is wrong, A2 is right). CTX can say *both* speak truly *relative to their own contexts*. This difference in handling apparent disagreement reflects a deep divergence in their underlying semantics and metaphysics. PE preserves a single, objective (though subject-sensitive) knowledge relation. CTX embraces semantic relativism for "knows".
  4.  **The Lab Case Exposes the Divergence:** Your case brilliantly isolates the difference. The *subject's* unknown high stakes create a scenario where the views *must* disagree on the fundamental question: "Did S *know* at T, given her evidence but unaware of the high stakes?" PE says "No," because the stakes objectively raise the bar S must clear. CTX says "Yes (relative to her context)," because her unawareness keeps her context low-stakes. This isn't just a difference in how to *describe* the same underlying state; it's a difference in *what the underlying state is claimed to be*.

  **Conclusion:** Pragmatic encroachment and epistemic contextualism are genuine rivals. While both accommodate "stakes-shifting" intuitions, they offer fundamentally different explanations rooted in opposing commitments: PE makes the *subject's* practical situation partly constitutive of knowledge (rejecting invariantism about the knowledge relation's *nature*), while CTX makes the *attributor's* context constitutive of the *truth conditions* of knowledge attributions (rejecting invariantism about the *semantics* of "knows"). Your lab technician case demonstrates this substantive divergence clearly: they disagree on whether the technician possessed knowledge at the time (PE: No; CTX: Yes relative to her context) and on the correctness of the low-stakes attributor's claim (PE: False; CTX: True relative to their context). The disagreement concerns *what knowledge is* and *how language about it works*, not just how to label the same phenomenon.
