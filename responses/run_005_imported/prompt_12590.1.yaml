  We are setting the dialogue in the context of the centipede game, a classic example for backward induction. The centipede game is a finite extensive-form game with perfect information. Two players, Player 1 and Player 2, take turns. At each node, a player can either "take" (ending the game and getting the payoffs at that node) or "pass" (passing the turn to the other player, and the payoffs increase). However, if they keep passing until the last node, the game ends with the highest payoffs. The backward induction solution suggests that at the first node, Player 1 should take immediately, because if they pass, Player 2 would take at the next node, and so on.

  The dispute is about whether common knowledge of rationality (CKR) forces the backward induction outcome. Aumann (1995) argues that it does, while Stalnaker and Binmore have raised objections.

  Characters:
  - **Alex**: Defends Aumann's position that CKR implies backward induction.
  - **Blair**: Argues in the spirit of Stalnaker and Binmore that the backward induction conclusion relies on an illegitimate counterfactual.

  We'll set the dialogue in a university lounge after a seminar.

  ---

  **Alex**: So, Blair, I know we've been over this, but I still think Aumann's argument is airtight. In the centipede game, if we have common knowledge of rationality, then Player 1 must take at the first node. The backward induction path is the only one consistent with rationality at every node.

  **Blair**: But Alex, that's precisely the problem. How can we have common knowledge of rationality at a node that, according to the theory, should never be reached? If Player 1 passes at the first node, then we've reached a node that was assigned probability zero by the theory. How can we then assume that Player 2 is still rational? The very fact that we're at that node might force us to revise our beliefs.

  **Alex**: I see your point, but in Aumann's model, the state space includes all possible worlds, and rationality is defined at every state. So even at a node that is not on the backward induction path, we can still talk about what a rational player would do there. And if rationality is common knowledge, then at every state (including those off the path), the players are rational. Therefore, they will play according to backward induction.

  **Blair**: But that's where the counterfactual comes in. You're assuming that we can hold fixed the entire epistemic model even when we're at a node that is supposed to have probability zero. In reality, if we reach such a node, we must update our beliefs. The common knowledge of rationality might break down because the occurrence of that node is evidence against the initial assumption that players are rational. So, Player 2, upon seeing that Player 1 passed, might now doubt Player 1's rationality, and that might change how Player 2 plays.

  **Alex**: But that's exactly what Aumann avoids by building a complete model. In his framework, the players have a common prior over the state space, and at every state, the players are rational and know the game structure. Moreover, they know that each other is rational, and so on, ad infinitum. So, even if we condition on an event that was supposed to have zero probability, we can still use the model to define what happens. The counterfactual "if this node were reached" is evaluated by looking at the states where that node is reached and seeing what rational players would do there.

  **Blair**: But if the event has probability zero, conditioning on it is undefined. How do you assign probabilities to events that were initially considered impossible? Aumann's model doesn't tell us how to update because the common prior assigns zero probability to those states. So, we cannot condition on them.

  **Alex**: That's why we use the notion of a complete type space. Every node is reached in some state, even if that state has measure zero. And in that state, rationality holds. So, we can still say that at that node, the player will play optimally given their beliefs at that state.

  **Blair**: But the beliefs at that state are defined by the common prior. If the prior assigns zero probability to the state we are in, then the conditional beliefs are not uniquely determined. You can have multiple extensions. Aumann's model arbitrarily fixes one, but that's the issue: the counterfactual is not determined by the initial common knowledge.

  **Alex**: I agree that the conditional beliefs are not uniquely determined by the prior when conditioning on a zero-probability event. But in the model, we fix a particular conditional belief system. And in that fixed system, rationality holds at every state. So, in the model, we can define what happens off the equilibrium path.

  **Blair**: But then the model is assuming what it needs to prove. You are building a model in which, at every node, players are rational. But the question is whether such a model is coherent when we consider that the players, in real time, update their beliefs upon seeing an unexpected move. If Player 1 passes, then Player 2 must update. And in that update, Player 2 might no longer believe that Player 1 is rational. So, Player 2 might then choose to pass, hoping that Player 1 will pass again, and so on. That's why we sometimes see cooperation in the centipede game in experiments.

  **Alex**: But if we allow that, then we are giving up the common knowledge of rationality. The whole point of Aumann is that if we maintain common knowledge of rationality throughout, then we cannot have such updates that lead to irrationality. The model is designed to show that under CKR, the only possible outcome is the backward induction one.

  **Blair**: But how do you maintain common knowledge of rationality after an irrational move? That's the crux. If Player 1 passes at the first node, that move is irrational according to backward induction. So, if rationality is common knowledge, then Player 1 would not make that move. Therefore, if the move is made, it must be that Player 1 is not rational. So, common knowledge of rationality breaks down. Hence, we cannot assume that Player 2 is still rational in the same way.

  **Alex**: But in the model, we don't have to interpret the move as irrational. We can interpret it as being played in a state where it is rational. For example, if Player 1 believes that Player 2 might not be rational, then passing might be rational. But in Aumann's model, that belief is ruled out because of common knowledge of rationality.

  **Blair**: Exactly. So, in the model, the only states where Player 1 passes are states where Player 1 is irrational. But then, at the node after Player 1 passes, Player 2 observes that Player 1 is irrational. So, Player 2 now knows that rationality is not common knowledge. Therefore, Player 2 might choose to pass, because they now think that Player 1 might pass again. But that would be inconsistent with the model's requirement that Player 2 is rational and believes in rationality.

  **Alex**: But in the model, we can have states where Player 1 passes but is still rational. How? Because in that state, Player 1 has a belief that justifies passing. But if rationality is common knowledge, then Player 1 must believe that Player 2 is rational and will play optimally. And that leads to backward induction.

  **Blair**: That's circular. The only belief that justifies passing would be a belief that Player 2 might pass. But if Player 2 is rational, and if the game is as we know it, then Player 2 would not pass. So, Player 1 cannot have a belief that justifies passing without doubting Player 2's rationality. Therefore, passing is irrational.

  **Alex**: I see your point. But in the model, we can have a state where Player 1 is irrational and passes, and then Player 2, being rational, takes. But then why would Player 1 pass? They get less than if they took at the first node. So, it's irrational.

  **Blair**: So we agree that at the first node, passing is irrational. Therefore, if we see it, we must conclude that Player 1 is irrational. Then, at the next node, Player 2, now knowing that Player 1 is irrational, might pass in the hope that Player 1 will pass again. But that would be rational for Player 2 if they believe there's a chance Player 1 will pass again. So, we get a different outcome.

  **Alex**: But if we have common knowledge of rationality at the outset, then Player 2 should not believe that Player 1 might pass again because that would be irrational. And if Player 2 is rational, they should take.

  **Blair**: But we just saw that Player 1 did something irrational. So, why should Player 2 assume that Player 1 will now be rational? The past irrationality might indicate that Player 1 is not rational at all. So, Player 2 might as well try to get a higher payoff by passing.

  **Alex**: But then we are not maintaining common knowledge of rationality. In Aumann's model, we don't allow for such breakdowns. The model assumes that rationality is common knowledge at every state, even off the path.

  **Blair**: And that's the problem. The model assumes that rationality is common knowledge even after an irrational move. But that move is evidence against the common knowledge. So, the model is inconsistent with the actual learning that occurs when an unexpected move is played.

  **Alex**: So, are you saying that common knowledge of rationality is impossible? That we cannot have a state space where rationality is common knowledge and every state is consistent with the players being rational at every node?

  **Blair**: I'm saying that in a finite game, if we try to build a model where rationality is common knowledge at every node, then we force the backward induction outcome. But that model is not a good representation of how players would actually reason when they face an unexpected move. The model is static: it doesn't account for the fact that players update their beliefs in a way that might break the common knowledge.

  **Alex**: But that's the point of the model: to show that if we could maintain common knowledge of rationality throughout, then we get backward induction. And in the real world, we don't always have that, so we see deviations. But the theorem is about what follows from the assumption of common knowledge.

  **Blair**: But the theorem assumes that common knowledge holds at every node, even those that are counterfactual. And that assumption is what's being challenged. Stalnaker and Binmore argue that the counterfactual "if this node were reached" cannot be evaluated without changing the epistemic state. So, the assumption of common knowledge at every node is too strong and unrealistic.

  **Alex**: So, you're saying that we cannot have common knowledge of rationality at nodes that are off the equilibrium path because the very act of reaching them would violate common knowledge?

  **Blair**: Exactly. The common knowledge of rationality is a condition that, if it holds, implies that the backward induction path is taken. Therefore, any deviation is evidence that common knowledge does not hold. Hence, we cannot assume common knowledge at nodes that are reached by deviation.

  **Alex**: But then how do we analyze what happens at those nodes? We need some counterfactual reasoning.

  **Blair**: We do, but that counterfactual reasoning must involve a belief revision policy. How do players revise their beliefs when they see a deviation? That policy is not determined by the initial common knowledge. So, we can have multiple rational ways to play off the path.

  **Alex**: So, you're saying that backward induction is not the only rational outcome? That there can be rational strategies that involve passing in the centipede game?

  **Blair**: Yes, if the belief revision policy allows for the possibility that the opponent might be irrational in a way that makes passing rational. For example, if Player 1 passes, Player 2 might believe that Player 1 is an irrational type that always passes. Then Player 2 might pass to get a higher payoff. And if Player 1 is such a type, then passing is consistent with that type's behavior.

  **Alex**: But then we are introducing irrational types. The initial common knowledge of rationality is lost.

  **Blair**: Exactly. And that's why the backward induction conclusion is not forced by common knowledge of rationality alone. It is forced only if we also assume that the players' beliefs are such that they maintain common knowledge even off the path. But that assumption is not part of the definition of rationality; it's an additional assumption about counterfactual beliefs.

  **Alex**: So, the crux is whether we can define a notion of substantive rationality that includes the counterfactual behavior without requiring that the epistemic state remains fixed.

  **Blair**: Yes. And I argue that we cannot require the epistemic state to remain fixed when we consider counterfactuals that were initially assigned zero probability. We must allow for belief revision.

  **Alex**: I think we've reached the core of the dispute. I maintain that Aumann's model provides a coherent way to define the counterfactual by fixing the epistemic model, while you argue that such a fix is artificial and doesn't capture the dynamics of belief revision.

  **Blair**: Precisely. And that's why the seminar's summary is too simplistic. The disagreement is about the legitimacy of the counterfactual formalization.

  **Alex**: Then we'll have to agree to disagree until we see more formal work on belief revision in games.

  **Blair**: Agreed. But it's been a productive discussion. Let's continue this next week.

  **Alex**: Definitely. Same time, same place?

  **Blair**: Of course.

