  I need to recall Marx's distinction between *exploitation-as-structural-relation* versus mere surplus extraction. In the *Grundrisse*, he explicitly contrasts capitalist surplus value with communal surplus labor. The key is that in a cooperative, the surplus is collectively controlled and reinvested for the workers' own needs—it lacks the coercion and alienation inherent in capitalism.  

  The user might also be subtly questioning if Marx's theory is overly rigid. By framing it as "who benefits," they're implying exploitation could persist under different ownership. But Marx would reject that: for him, exploitation isn't just about distribution but about *power*—the capitalist's ability to extract surplus rests on workers having no choice but to sell their labor. In a cooperative, that power dynamic vanishes.  

