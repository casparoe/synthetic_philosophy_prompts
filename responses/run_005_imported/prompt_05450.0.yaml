  Okay, the user hosts a philosophy podcast and needs interview questions for a metaethicist guest who's a quasi-realist. The guest's approach involves expressivism solving the Frege-Geach problem by having moral sentences express attitudes toward attitudes. The user wants questions that go beyond just restating her position and specifically wants to tackle the negation problem, the issue with higher-order attitudes in nested constructions, the validity of moral modus ponens, and a comparison with Gibbard's hyperplan semantics. They also want follow-ups for each question anticipating potential dodges.

  First, I need to make sure I understand the key points of the guest's theory. Quasi-realism in metaethics, particularly expressivism, holds that moral statements express non-cognitive attitudes but aim to mimic realist discourse. The Frege-Geach problem is about how these statements function in logical contexts like conditionals or negations. The guest's solution is that moral conditionals express attitudes toward combinations of attitudes, e.g., disapproving of both approving stealing and not disapproving of getting someone else to steal.

