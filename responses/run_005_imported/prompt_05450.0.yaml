  Potential additional topics: How does her view handle moral disagreement? Or the practicality of moral judgments. But the user didn't ask for those, so focus on the specified areas.

  Ensure questions are clear and jargon is minimized where possible, but some technical terms are necessary given the context. Make sure each question has a pointed follow-up that prevents evasion.

  Finally, structure the questions to flow logically: start with negation (a basic operator), then nested constructions (complex logic), then modus ponens (inference), then comparison with Gibbard (alternative approach). This order builds from simpler to more complex issues.
answer: |-
  Here are 8 targeted questions designed to push beyond restatement, incorporating your specific requests and anticipating common quasi-realist dodges with sharp follow-ups:

  1.  **The Negation Problem - Core Challenge:**  
      "You argue that 'Stealing isn't wrong' expresses a *positive* attitude (e.g., tolerance, or disapproval of disapproval) rather than mere non-disapproval. But what *internal feature of the attitude expressed* guarantees that this is genuinely *contradictory* to 'Stealing is wrong'? Why couldn't someone coherently hold *both* the attitude expressed by 'Stealing is wrong' *and* the attitude expressed by 'Stealing isn't wrong' – perhaps seeing them as compatible stances in different contexts – if both are just complex conative states?"  
      *   *Likely Dodge/Reply:* "The logic of attitudes dictates they conflict; one is disapproval-of-X, the other is approval-of-X (or disapproval-of-disapproval-of-X), which are incompatible."  
      *   **Follow-Up:** "But isn't that incompatibility *presupposing* the very logical structure we're trying to explain? If attitudes aren't truth-apt, what *is* the source of their mutual exclusivity here? Is it a brute psychological fact about *us*, or is there a normative constraint *within* the attitude-system itself that mirrors logical contradiction? If the latter, how is that different from cognitivism?"

  2.  **The Negation Problem - Tolerance vs. Opposition:**  
      "Specifically on tolerance: How does your view distinguish between *actively tolerating* stealing (your proposed content for 'isn't wrong') and simply *not disapproving* of it due to indifference or never having considered it? Doesn't the latter clearly *not* contradict 'Stealing is wrong'? What in the attitude expressed *forces* the reading as active tolerance/opposition rather than potential indifference?"  
      *   *Likely Dodge/Reply:* "The linguistic practice rules out indifference; asserting 'isn't wrong' commits one to a positive stance against disapproval."  
      *   **Follow-Up:** "But doesn't this appeal to linguistic practice risk making the *meaning* hostage to *pragmatic* norms of assertion? If the core expressivist meaning is just the attitude, and indifference *is* a form of non-disapproval, what purely *semantic* element blocks the indifferent reading as a possible meaning for the negation?"

  3.  **Higher-Order Attitudes & Nested Constructions - Systematicity:**  
      "When handling complex embeddings, like a disjunction of negations or a conditional *within* a conditional, your solution involves stacking higher-order attitudes (e.g., attitudes towards attitudes towards attitudes...). Is this stacking governed by a *systematic, compositional principle* analogous to truth-conditional recursion, or is it an *ad hoc* assignment of increasingly complex attitudes for each new syntactic structure we encounter?"  
      *   *Likely Dodge/Reply:* "It *is* systematic; the attitude expressed is a function of the attitudes expressed by the parts and the logical connective, mirroring the syntax."  
      *   **Follow-Up:** "But doesn't this 'mirroring' rely on implicitly *assuming* the truth-conditional structure you're trying to avoid? Specifically, what independent *conative* principle determines that the attitude expressed by 'If (If P then Q) then R' *must* be this specific 4th-order attitude, rather than some other complex state? How do we know the system isn't just *stipulating* the 'right' attitude to preserve classical logic, rather than deriving it from the nature of conative states?"

  4.  **Higher-Order Attitudes & Nested Constructions - Regress & Psychology:**  
      "Aren't these exponentially complex higher-order attitudes psychologically implausible for ordinary speakers? When someone understands 'If telling a white lie isn't wrong, then getting caught won't be a disaster,' are they really deploying a 3rd or 4th-order attitude? Or is the quasi-realist logic merely a *rational reconstruction* that bears little resemblance to the actual mental states involved in ordinary moral reasoning?"  
      *   *Likely Dodge/Reply:* "Speakers don't need conscious access to the full structure; competence involves a disposition to accept valid inferences, which the higher-order attitudes model."  
      *   **Follow-Up:** "If the actual psychological state is something simpler or different, and the higher-order attitude is just a theoretical model *justified solely by its preserving classical logic*, doesn't this concede that expressivism succeeds only by *mimicking* cognitivist logic without providing a genuinely independent *conative* foundation for that logic?"

  5.  **Validity of Moral Modus Ponens - Beyond Psychology:**  
      "On your view, why is moral modus ponens *valid*? Is it *just* that we're psychologically disposed to infer 'Q' from 'If P then Q' and 'P', or is there something *normative* about this inference pattern that holds *even if* someone weren't disposed to follow it? What *makes* it the case that someone who accepts the premises *ought* to accept the conclusion, if not truth preservation?"  
      *   *Likely Dodge/Reply:* "Validity is defined by the inconsistency of accepting the premises while rejecting the conclusion, which is cashed out in terms of incompatible attitudes generated by the system."  
      *   **Follow-Up:** "But doesn't this just push the question back? *Why* is that specific combination of attitudes inconsistent? Is it a brute normative fact about attitudes, or is it again *defined* by the need to match logical validity? If the latter, how is this different from defining validity via truth preservation and then *calling* the states 'attitudes'?"

  6.  **Validity - The "Ought" Question:**  
      "Building on that: If validity is ultimately grounded in avoiding incompatible combinations of attitudes, isn't this just a *pragmatic* constraint (avoiding psychological conflict) rather than a genuinely *logical* one? How does this account for the *normative force* of logic – the sense that one *should* or *must* draw the conclusion, even if one could, however irrationally, avoid the attitude conflict?"  
      *   *Likely Dodge/Reply:* "The 'ought' is internal to the practice of expressing and coordinating attitudes; it's constitutive of moral discourse."  
      *   **Follow-Up:** "Doesn't this 'constitutive practice' move risk making the validity of modus ponens *relative* to our contingent practices? Could there be a community using moral language where their 'attitude logic' made modus ponens *invalid*? If not, why not – what anchors the *necessity* of this inference pattern if not something mind-independent?"

  7.  **Gibbard Comparison - Hyperplans as Cognitivism in Disguise:**  
      "Allan Gibbard, another prominent quasi-realist, uses 'hyperplans' (complete contingency plans) to solve these problems. Moral judgments express plan-laden states. But doesn't assigning truth conditions to moral sentences *relative to a hyperplan* – e.g., 'Stealing is wrong' is true iff hyperplan H forbids stealing – effectively *smuggle cognitivism back in*? Aren't we just replacing 'beliefs about mind-independent properties' with 'beliefs about hyperplan satisfaction', making the semantics cognitivist after all?"  
      *   *Likely Dodge/Reply:* "No, because hyperplans aren't discovered facts; they express our planning commitments. Judging 'wrong' is expressing a non-cognitive planning state, *not* describing the hyperplan."  
      *   **Follow-Up:** "But the *content* of the judgment *is* given by its satisfaction conditions relative to a hyperplan. Doesn't this mean the *semantic value* of the moral sentence is a function from hyperplans to truth values? And if the semantics assigns truth-conditional content (even relativized), how is this fundamentally different from a cognitivist semantics, regardless of the *psychological state* expressed? Isn't the expressivist 'psychology first' commitment undermined?"

  8.  **Gibbard Comparison - Attitude-to-Attitude vs. Hyperplans:**  
      "Weighing your 'attitudes toward attitudes' solution against Gibbard's hyperplans: What advantage does your approach have in preserving a *purely* expressivist, non-representational core? Doesn't Gibbard's framework, by grounding the logic in the structure of plans (which seem more like *contents* than primitive attitudes), inevitably reintroduce representational elements that your higher-order attitude story avoids? Or is the avoidance merely superficial, pushing representation into the 'logic of attitudes' instead?"  
      *   *Likely Dodge/Reply:* "My approach stays closer to core expressivism by only positing attitudes all the way down; hyperplans are unnecessary theoretical machinery that risks reification."  
      *   **Follow-Up:** "But doesn't the *systematicity* and *explanatory power* of hyperplans in handling complex logic (without infinite attitude stacking) suggest that your 'attitudes all the way down' might be *more* ad hoc? If hyperplans provide a cleaner solution but at the cost of reintroducing truth-conditional *semantics*, doesn't that imply that pure expressivism *can't* fully solve the problem without such moves?"

  **Key principles used in drafting these questions:**

  *   **Targeting Foundations:** Questions focus on *why* the quasi-realist machinery works (contradiction, validity) rather than *how* it's built.
  *   **Demanding Explanations:** Asking for the *source* of logical properties (incompatibility, necessity, validity) within a conative framework.
  *   **Highlighting Tensions:** Forcing a choice between brute psychological facts/pragmatic norms and genuinely logical/normative foundations that risk mimicking cognitivism.
  *   **Challenging Psychological Plausibility:** Questioning the reality of the complex mental states posited.
  *   **Exposing Mimicry:** Pressing on whether the solution succeeds only by covertly adopting the structure of the rival (cognitivist) theory.
  *   **Anticipating Dodges:** Follow-ups target common quasi-realist retreats to "practice," "constitutive norms," "logic of attitudes," or dismissing concerns as "merely pragmatic," pushing for a deeper justification.

  These questions should force your guest to defend the *metaphysical and normative underpinnings* of her quasi-realism, moving well beyond a simple restatement of the attitude-to-attitudes mechanism. Good luck with the interview!
