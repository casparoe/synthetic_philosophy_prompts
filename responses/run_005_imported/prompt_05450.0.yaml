  2. **Higher-order Attitudes**: Are nested constructions handled systematically or ad hoc? Follow-up on whether this leads to infinite regress and if it's psychologically plausible.

  3. **Validity of Modus Ponens**: What makes moral modus ponens valid, not just a psychological habit? Follow-up on whether this reduces to pragmatics or requires a stronger logical foundation.

  4. **Gibbard's Hyperplans**: Does hyperplan semantics reintroduce cognitivism? Follow-up on whether plans are disguised beliefs and if this undermines expressivism.

  I should ensure each question pushes the guest to explain deeper justifications rather than restating her position. The follow-ups need to anticipate common defenses. For example, on negation, she might say that the attitude is a second-order disapproval. The follow-up could challenge if that's meaningfully different from non-disapproval.

