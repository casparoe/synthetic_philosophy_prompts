  On modus ponens validity, she might appeal to the nature of the attitudes expressed. The follow-up could ask if this is a psychological constraint or a normative logical requirement.

  Regarding Gibbard, she might distinguish between plans and truth-conditions. The follow-up could press on whether hyperplans function like truth-conditions, thus making semantics cognitivist.

