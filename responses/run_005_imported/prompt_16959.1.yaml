answer: |-
  Here's a novel example of the Wrong Kind of Reasons (WKR) problem for fitting-attitude (FA) analyses, distinct from demon threats:

  **The Museum Curator's Dilemma:**

  Imagine a priceless, unique ancient artifact housed in a national museum. This artifact, however, has no intrinsic value-making features: it's aesthetically unremarkable, historically insignificant (it wasn't involved in any important events, made by anyone notable, or representative of a unique technique), scientifically mundane (its materials and construction are common for its era), and culturally inert (it held no special meaning even in its original context). Its *only* significance is that it has become a powerful *symbol* for national identity. The populace *believes* it embodies their heritage and values, though this belief is entirely unfounded.

  Now, a devastating earthquake strikes the region. The curator knows that if the artifact is destroyed in the quake, widespread civil unrest, riots, and potentially a collapse of social order will follow due to the perceived loss of this national symbol. The *only* way to reliably protect the artifact is for the curator to genuinely *value* it – not just pretend, but to sincerely believe it *is* valuable. This genuine valuing would trigger an automated, tamper-proof preservation protocol (say, activating a state-of-the-art protective force field) that only responds to the curator's authentic evaluative attitude.

  **The FA Analysis Problem (Buck-Passing):**

  According to FA analyses, for the artifact to *be* valuable (V) is just for it to be *fitting* to have a pro-attitude (like valuing, admiring, desiring) towards it.

  *   **The Reason:** The curator has a very strong, decisive reason to *value* the artifact: to prevent catastrophic social unrest and loss of life.
  *   **The Question:** Does this reason show that the artifact *is* valuable?

  **Why this is a Wrong Kind of Reason (WKR) rather than a Right Kind of Reason (RKR):**

  1.  **Target of the Reason:** The reason ("to prevent riots/loss of life") is fundamentally a reason *for the curator to adopt the attitude* of valuing. It is not a reason *provided by the features of the artifact* that makes valuing it a fitting or appropriate response *to those features*. The reason concerns the *consequences* of holding the attitude, not the *object* of the attitude.

  2.  **Lack of Value-Making Features:** By stipulation, the artifact itself possesses *no* features (beauty, historical significance, rarity, utility, etc.) that could constitute RKR for valuing it. There is nothing *about the artifact* that merits or calls for valuing. If the reason ("prevent riots") were an RKR, it would imply that the artifact's value supervenes on features *it* possesses. But here, the reason supervenes entirely on features *external* to the artifact – the populace's mistaken belief and the consequences of its destruction.

  3.  **Direction of Fit Mismatch:**
      *   **RKR:** Align with the "mind-to-world" direction of fit for beliefs (including evaluative beliefs like valuing). An RKR for valuing X is a consideration that speaks to X's properties, making it *correct* or *true* that X is valuable. Valuing X is fitting *because of X*.
      *   **WKR:** Align with the "world-to-mind" direction of fit for desires or intentions. The reason here ("prevent riots") is a consideration about how adopting the attitude *changes the world* (activates the shield, prevents riots). It makes adopting the attitude *prudent* or *instrumentally rational*, not because the attitude correctly represents the artifact's value, but because adopting it brings about a desired state of affairs *independent* of the artifact's actual properties. The curator needs to *make* their mind (their valuing attitude) fit a desired state of the world (the artifact being protected, riots avoided), not make their mind fit the world *as revealed by the artifact*.

  4.  **The Test of Substitution:** Imagine substituting the artifact with *any* other completely worthless object (e.g., a random pebble). If the populace *mistakenly* believed *that* pebble was the sacred national symbol, and its destruction would cause the same riots, and the same preservation protocol required genuine valuing, then the curator would have the *same* strong reason to value *that* pebble. This shows the reason is utterly disconnected from the *specific object* and its properties; it hinges solely on the consequences of *not* valuing *whatever* object happens to be in that symbolic role. RKR must be tied to the object's specific value-grounding features. A reason that applies equally well to valuing *any* object in a given functional role cannot be an RKR for valuing *this specific* object.

  **Conclusion:**

  The curator has a decisive pragmatic, instrumental reason to value the artifact. However, this reason does not stem from any feature of the artifact that *makes* valuing it a correct or appropriate response *to what the artifact is like*. Instead, the reason stems from the desirable consequences *of holding the attitude itself* (activating the shield, preventing riots). This is a paradigmatic **Wrong Kind of Reason**. It poses a problem for FA analyses because the FA account seems forced to say the artifact *is* valuable (since there's decisive reason to value it), but intuitively, the artifact lacks any genuine value; the reason to value it is entirely disconnected from its own properties and relates only to the consequences of adopting the attitude. The reason fails to be a **Right Kind of Reason** because it doesn't identify any feature *of the object* that *merits* the valuing attitude.
