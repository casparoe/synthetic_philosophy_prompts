  Here is a dialogue between **Elena Fuller** (a proponent of Fullerian natural law) and **Leo Hart** (a committed Hartian positivist), debating the culpability of an East German border guard:

  **Setting:** A university common room after a seminar on transitional justice.

  **Leo Hart:** Elena, that case study today... the *Mauerschützen* trials. It still grates. Those guards were convicted based on laws that *didn't exist* when they acted. The published Border Act of the GDR stated force must be "proportionate" to prevent border breaches. That was the positive law.

  **Elena Fuller:** Leo, the law they were ostensibly following *was* published. Article 27 of the GDR Border Act *did* demand proportionality. That was the public face of the law, the rule citizens and soldiers were told governed their conduct.

  **Leo Hart:** Precisely! And the guards acted under internal orders – secret directives – that overrode that published text, mandating lethal force. Those orders, however morally repugnant, were the *operative* commands within the GDR state apparatus at the time. They constituted the rules the guards were expected to follow. Punishing them *after* the regime falls for following those operative rules is pure retroactivity. It’s dressing up vengeance as law, just like Hart argued in the Grudge Informer critique. Voiding a defense available *at the time*? Unjust.

  **Elena Fuller:** But Leo, those internal "shoot-to-kill" orders weren't just immoral; they *undermined the very possibility of law itself*. Fuller’s point about the internal morality of law is crucial here. Law requires congruence between official action and declared rules. When the state publishes one rule ("proportionate force") but secretly commands its agents to act on a diametrically opposed principle ("kill escapees on sight"), it creates a fatal disconnect. The published statute becomes a cynical façade, not a genuine rule. The *actual practice* – the systematic, secret deviation from the published norm – means the regime wasn't operating under a legal system in Fuller's sense. It was operating under a regime of terror disguised by legalistic window dressing.

  **Leo Hart:** So, the entire GDR legal order was invalid? That’s Radbruch territory, and it’s dangerously subjective. Where do you draw the line? "Intolerable injustice"? That’s a moral judgment smuggled into legal validity *after the fact*. The guard that day knew the published law *and* his orders. He knew disobeying orders meant severe punishment. Applying a *new* standard of "true law" retroactively traps him in an impossible bind he couldn't have foreseen.

  **Elena Fuller:** It’s not about invalidating the *entire* order wholesale on vague moral grounds. Radbruch's Formula kicks in when positive law conflicts with justice to an *unbearable* degree, *and* when that conflict is blatant. Here, the conflict wasn't just between law and morality; it was *within the regime's own purported legal structure*. The gap between the published, ostensibly legal requirement of proportionality and the systematic, state-sanctioned practice of extrajudicial killing for the "crime" of seeking freedom creates an intolerable contradiction. The guard wasn't just caught between law and orders; he was caught in a system where the law *as publicly proclaimed* was a lie. The "defense" of following orders loses legitimacy when the orders themselves flagrantly violate the regime's *own* fundamental published legal norm. The manslaughter charge isn't applying a *new* law retroactively; it's recognizing that the *published law* prohibiting disproportionate force was the only valid law *at the time*, despite the regime's criminal subversion of it.

  **Leo Hart:** You’re saying the published Border Act *was* valid law, but the secret orders were ultra vires – beyond legal authority – even under the GDR's own system? That the guard should have known to ignore his superiors and adhere *only* to the published statute?

  **Elena Fuller:** Essentially, yes. The internal orders weren't valid legal enactments; they were criminal conspiracies masquerading as law, directly contradicting the publicly declared legal framework. Fuller argued law must be possible to follow. How could a guard follow both the published demand for proportionality *and* a secret order to kill? The regime itself made fidelity to its *own* published law impossible. In such a profound gap between words and deeds, the words – the public, proclaimed rules – retain a residual claim to being the *actual* law, while the secret commands are revealed as illegal acts of state power, not law. The guard, by pulling the trigger based solely on the illegal secret order, committed an act prohibited by the only valid legal rule applicable at the time: the published Border Act demanding proportionality. His "defense" rests on an invalid, unlawful command.

  **Leo Hart:** Hmm. You're reframing it. Not retroactive invalidation of a *defense*, but arguing the defense *never legally existed* because the orders were never valid law to begin with, only unlawful state commands contradicting the valid published statute. The guard violated the *actual* positive law of the GDR – the Border Act – by using disproportionate force.

  **Elena Fuller:** Exactly. The conviction for manslaughter doesn't require inventing new law. It applies the *existing* prohibition on disproportionate force – a prohibition the guard knew or should have known – to his actions. The secret orders provide no legal shield because they lacked validity *within the system's own proclaimed framework*. The Radbruchian element is recognizing that the regime's systematic subversion of its own published law reached such a degree of perversion that the usual deference to internal state commands becomes untenable. It crosses into the realm of intolerable injustice, nullifying the shield those illegal orders might otherwise provide.

  **Leo Hart:** I see the structure of your argument. You’re trying to ground the conviction firmly within the positive law *as published*, denying validity to the contradictory secret orders. It avoids the pure retroactivity Hart feared by claiming the guard *was* violating the applicable law *at the time*. The "shoot-to-kill" wasn't a lawful defense; it was an illegal override.

  **Elena Fuller:** Precisely. It respects the principle of non-retroactivity by locating the offense within the violation of the published, proportionate force requirement – a requirement never lawfully repealed or superseded. The trials exposed the illegality of the secret regime, not created new law.

  **Leo Hart:** ...And yet, I suspect we might agree on the *outcome* – that conviction could be just – while disagreeing on the *justification*. You see it as applying the valid positive law (the published Act) and denying validity to the illegal orders. I see it, even with your framing, as a *moral* judgment about which part of the regime's chaotic mess constituted "true law," inevitably influenced by hindsight and the values of the new state. Your "valid published law" argument relies on a Fullerian/Radbruchian view of what makes a system sufficiently "legal" to begin with – a view I, as a positivist, see as importing morality too early into the question of validity.

  **Elena Fuller:** Perhaps. But doesn't your pure positivism risk becoming complicit in the regime's deception? By saying "the orders were the operative rules, so following them was legally defensible," you grant legitimacy to the regime's cynical manipulation of law. My approach seeks to uphold the minimal decency inherent in the *idea* of law – congruence, publicity – even against the state that perverts it. For the guard... it's tragic. A conscript trapped in an impossible, evil system. But recognizing that the only *legal* command he received was "proportionate force," and that the secret kill order was an illegal aberration, provides a path to justice that isn't merely retroactive vengeance. It holds him accountable for violating a rule that *was* on the books, a rule whose violation caused death.

  **Leo Hart:** Tragic indeed. And while I remain wary of the retroactive specter, I concede your argument – that the conviction rests on the violation of the *published* statute, not a new law – is a powerful and legally coherent way to navigate this specific, grotesque gap between a regime's words and deeds. We might agree on the verdict, Elena, but we'll likely always debate the map we used to get there. For the young conscript... history placed him in hell. No legal theory can fully resolve that.

  **Elena Fuller:** No. It cannot. But law must still try to render justice, even amidst the ruins of injustice. Especially then.
