  The user mentions Rorty's reply in "Human Rights, Rationality, and Sentimentality," where he advocates for sentimental education through narratives to expand solidarity. But the user counters that this approach only works on those already predisposed to liberal values, thus presupposing the very sensibility it aims to cultivate. This seems circular.

  Now, I need to assess the fairness of this objection. Rorty explicitly rejects foundationalism. For him, moral progress isn't about discovering truths but expanding "we" through emotional persuasion. The user's point about circularity is valid—Rorty's method relies on existing liberal sentiments. But is that a flaw? Rorty might argue that all justifications are circular in this way, and that's acceptable because philosophy can't provide non-circular foundations.

  The user is concerned their critique might miss Rorty's deeper points. They want to ensure their argument withstands defenses a Rorty supporter might raise. Key areas where a defender might push back: First, accusing the user of demanding a foundationalism Rorty explicitly rejects. Second, noting that Rorty's project is pragmatic, not epistemic—effectiveness in reducing cruelty matters more than theoretical justification. Third, highlighting that sentimental education isn't meant to be logically compelling but emotionally persuasive, which aligns with Rorty's view of moral motivation.

