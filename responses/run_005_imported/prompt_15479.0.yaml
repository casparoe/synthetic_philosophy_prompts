  For the design requirements, suggest a fallback mechanism that allows disengagement in deadlock scenarios. Maybe require V2V communication handshake protocols so AVs can negotiate. Also, recommend that any approval for Solace should mandate data sharing with the board to monitor near-misses and standoffs.

