prompt: |-
  I help maintain an open source formalized-math library, kind of like Lean's mathlib. Someone's PR adds a bunch of genuinely useful theorems -- every vector space has a basis, Tychonoff's theorem, existence of a non-measurable set -- that all depend on the axiom of choice, and proposes we just declare `choice` a blanket axiom for the whole library instead of tagging it per theorem. Half the maintainers are upset, since that quietly makes huge parts of the library noncomputable (no more extracting actual running code from those proofs) and smuggles choice into lemmas that constructive-math users downstream never opted into. The other half say refusing choice means we can't formalize most of real analysis or algebra, making the library useless for that. We vote at next weeks maintainer call and I have to circulate a recommendation first -- can you draft it? I need an actual call (adopt globally, opt-in tagging per theorem, or fork a seperate constructive-only library), with reasoning that would actually land with the anti-choice camp and not just 'choice is standard, deal with it.'
reasoning: |-
  We are facing a significant design decision regarding the Axiom of Choice (AC) in our formal math library. The proposal is to globally assume AC, but this has sparked debate. I'll outline three options and provide reasoning that addresses the concerns of both sides, especially the anti-choice camp.

  **The Three Options:**

  1. **Adopt AC globally:** Declare `choice` as a blanket axiom for the entire library.
  2. **Opt-in tagging per theorem:** Require that each theorem depending on AC be explicitly tagged, and avoid AC in the core library unless opted in.
  3. **Fork a separate constructive-only library:** Maintain two versions: one with AC (for classical mathematics) and one without (for constructive mathematics).

  **Reasoning for Each Option:**

  ### 1. Adopt AC globally
     - **Pros:**
       - This is the standard in most mathematical practice, especially in areas like real analysis, topology, and abstract algebra. Without AC, many fundamental results (like the existence of a basis for every vector space, Tychonoff's theorem, and the existence of non-measurable sets) cannot be proved.
       - It simplifies development by not requiring constant tagging and tracking of AC usage.
     - **Cons:**
       - It makes the entire library noncomputable in principle. Even if a particular proof doesn't use AC, the global axiom means that any proof might become noncomputable because AC is always available. This breaks code extraction for any part of the library that might otherwise be constructive.
       - It forces AC on all users, including those who want to work constructively. This might alienate a segment of our user base who are interested in constructive mathematics or who wish to extract executable code.

  ### 2. Opt-in tagging per theorem
     - **Pros:**
       - It maintains the constructive core of the library, which is important for users who need computability or are working in constructive mathematics.
       - It allows users to choose when to use AC. They can import the AC-dependent theorems only when needed, and avoid them otherwise.
       - It is transparent: each theorem that requires AC is clearly marked, so users are aware of the dependency.
     - **Cons:**
       - It requires extra effort to tag theorems and maintain a clear separation. We must be cautious not to accidentally use AC in an untagged theorem.
       - Some areas of mathematics (like real analysis) might become cluttered with tags because they rely heavily on AC. This might make the library harder to use in those areas because of the need to constantly manage imports and tags.
       - It might lead to duplication: some theorems might need both a constructive version (without AC) and a classical version (with AC).

  ### 3. Fork a separate constructive-only library
     - **Pros:**
       - It provides two clear paths: one for classical mathematics (with AC) and one for constructive mathematics (without AC). Users can choose the version that fits their needs.
       - Both libraries can evolve independently, allowing each to be optimized for its respective use case.
     - **Cons:**
       - Maintaining two libraries is a significant burden. We must duplicate efforts for developments that don't depend on AC, and we must synchronize updates and bug fixes between the two.
       - It might split the community and development resources, potentially leading to fragmentation.

  **Addressing the Anti-Choice Camp:**

  The main concerns of the anti-choice camp are:
  - **Noncomputability:** They want to be able to extract executable code from proofs. A global AC makes the entire library noncomputable, even for theorems that don't require AC.
  - **Constructive Mathematics:** They wish to support users who are working in constructive mathematics, which does not assume AC.
  - **Transparency and Consent:** They object to "smuggling" AC into lemmas that might not need it, thereby forcing it on users who did not opt in.

  To address these concerns without dismissing them as fringe:

  - **Acknowledge the validity:** The concerns about computability and constructive mathematics are legitimate and important. They are not just about personal preference but about enabling real applications (like verified code extraction) and supporting an entire branch of mathematics (constructive math).
  - **The cost of global AC:** It is not just a theoretical issue. Global AC would break existing functionality for users who rely on code extraction. Even if we think that most users are classical, we have a responsibility to our current user base and the library's design principles.
  - **The middle ground:** Opt-in tagging (option 2) or forking (option 3) are ways to respect both communities. They allow classical mathematicians to use AC when needed, but do not impose it on everyone.

  **Recommendation:**

  I recommend **option 2: opt-in tagging per theorem**. This option strikes a balance by:

  - Keeping the core library constructive and computable, which is essential for the anti-choice camp and for code extraction.
  - Allowing the use of AC for the theorems that genuinely require it, which is necessary for the pro-choice camp to formalize advanced mathematics.
  - Being more practical than forking (option 3) because it avoids the overhead of maintaining two separate libraries.

  However, to make this work, we must:

  - Establish clear guidelines for tagging AC usage (e.g., using a `[Classical]` or `[AC]` attribute).
  - Implement tooling to detect accidental AC usage in non-tagged theorems.
  - Encourage the development of constructive alternatives when feasible.

  **Why not global AC?** While it is standard, it imposes a noncomputable universe on all users, which is against the principles of a flexible formal math library. It also precludes the use of the library for constructive mathematics.

  **Why not forking?** It is a heavy solution that might lead to duplication of work and fragmentation. We are not yet at a scale where the benefits outweigh the maintenance burden.

  **Conclusion:**

  By choosing opt-in tagging, we respect both camps: classical mathematicians can use AC when needed, and constructive mathematicians can avoid it. This approach is aligned with the original design of the library (which did not assume AC globally) and maintains the flexibility that has made the library useful to a diverse community.

  I propose we start by tagging the theorems in the current PR and then develop a plan for gradually tagging existing AC-dependent theorems. We can also discuss tooling support to enforce the tagging.

  Let's discuss and vote on this at the maintainer call.
answer: |-
  Below is a draft recommendation for your maintainer call. It balances practicality with respect for both camps, explicitly addressing anti-choice concerns without dismissing them. The reasoning focuses on **user impact**, **library integrity**, and **long-term sustainability**.

  ---

  ### **Recommendation: Adopt Opt-In Tagging for Axiom of Choice (AC) Dependencies**  
  **Do not globally assume AC.** Instead:  
  1. **Tag every theorem** requiring AC with `[AC]` or a similar marker.  
  2. **Isolate AC usage** in dedicated modules/files (e.g., `Mathlib.Classical.Choice`).  
  3. **Require explicit imports** of these modules for AC-dependent proofs.  

  ### **Why Not Global AC? Addressing Anti-Choice Concerns**  
  1. **Noncomputability Contagion:**  
     - Global AC makes the *entire library* noncomputable by default. Even simple, constructive proofs (e.g., `List.map_id`) become "infected" if they transitively depend on an AC-using lemma. This destroys code extraction for downstream users (e.g., for verified algorithms).  
     - **Anti-choice win:** Tagging localizes noncomputability. Constructive users avoid AC by skipping `[AC]`-tagged imports.  

  2. **Downstream Flexibility:**  
     - Many users (e.g., type theorists, CS researchers) rely on constructive subsets. Global AC forces them to:  
       - Maintain forks for AC-free fragments (wasteful),  
       - Or abandon the library (fragmentation).  
     - **Anti-choice win:** Opt-in tagging lets users "pay for what they use." Those needing AC can import it; others aren’t penalized.  

  3. **Proof Transparency:**  
     - "Smuggling" AC into lemmas (e.g., via global instance parameters) obscures dependencies. This harms:  
       - **Auditability:** Is this lemma safe for finite-dimensional spaces?  
       - **Portability:** Can this proof reuse in a topos?  
     - **Anti-choice win:** Explicit tags act like "warning labels," empowering users to make informed decisions.  

  4. **Future-Proofing:**  
     - Global AC blocks integration with emerging systems (e.g., Cubical Agda, Lean 4’s runtime). Tagging keeps doors open.  

  ### **Why Not Forking a Separate Constructive Library?**  
  - **❌ Drawbacks:**  
    - **Duplication:** 90% of mathlib (e.g., group theory) is AC-free. Forking forces maintaining two copies.  
    - **Fragmentation:** Contributors split; fixes don’t propagate; users face "which lib?" dilemmas.  
    - **Burden:** Who maintains the fork? Will it receive equal resources?  
  - **✅ Better:** Opt-in tagging achieves 80% of forking’s benefits with 20% of the effort.  

  ### **Why Not Global AC? Addressing Pro-Choice Concerns**  
  - **"We need AC for real math!"** → **You still get it:**  
    - Tagging *enables* formalizing AC-dependent theorems (Tychonoff, non-measurable sets) without hijacking the library.  
    - Heavy AC users (e.g., analysts) can import `Mathlib.Classical` and work as before.  
  - **"Tagging is tedious!"** → **Mitigations:**  
    - Build linters to detect untagged AC usage (e.g., via `#print axioms`).  
    - Auto-tag AC-derived definitions (e.g., `noncomputable def basis`).  
  - **"AC is standard!"** → **But computability is core to proof assistants:**  
    - Lean/HOL/Coq are not ZFC. Their value lies in bridging math and computation. Global AC sacrifices half of that.  

  ### **Practical Implementation Plan**  
  1. **Short term:**  
     - Tag all new PRs with AC dependencies (e.g., the current PR).  
     - Move existing AC-using theorems to `Mathlib.Classical.*` (gradual rollout).  
  2. **Medium term:**  
     - Add CI checks for untagged AC usage in non-classical files.  
     - Document how to use AC locally:  
       ```lean  
       open scoped Classical.Choice -- Opt-in to AC for this section  
       ```  
  3. **Long term:**  
     - Explore automation (e.g., a `classical!` tactic that auto-tags).  

  ---

  ### **Vote Options**  
  1. **Adopt global AC** → Breaks computability, alienates constructive users.  
  2. **Opt-in tagging** → Balanced, sustainable, respects all users. **(Recommended)**  
  3. **Fork a constructive library** → Resource-intensive, fragments community.  

  ### **Key Message to Anti-Choice Camp**  
  > "This approach protects *your* workflow: constructive proofs remain computable, and AC is quarantined. You won’t silently inherit noncomputability, and you retain full access to AC-free areas. We commit to tooling to enforce this."  

  ### **Key Message to Pro-Choice Camp**  
  > "You keep full access to AC-dependent mathematics. The only change is explicit labeling and imports—a minor tax for keeping the library inclusive and future-proof. We’ll streamline tooling to minimize friction."  

  --- 

  This framework treats AC as a **controlled substance**—available where essential, but contained to prevent ecosystem-wide effects. It aligns with practices in Coq (e.g., `Prop`-based isolation) and Lean 4’s `noncomputable` hygiene. By focusing on *user autonomy* and *ecosystem health*, it offers a compromise both camps can defend.
