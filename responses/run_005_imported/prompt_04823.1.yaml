  - **A Tier**: Cost is central to honesty enforcement, but social or parental dynamics (e.g., begging calls) or institutional factors (e.g., college degrees) may introduce non-cost elements.
  - **B Tier**: Cost is present but honesty is mainly driven by other mechanisms (e.g., peacock tails rely on runaway selection, where cost is a byproduct, not the enforcer).
  - **C Tier**: Cost exists but honesty is largely enforced by indices (e.g., carotenoid signals are physically constrained by diet/health) or conventions.
  - **D Tier**: None in this list, but would include pure indices (e.g., frog croak depth as an unfakeable size indicator) or conventions (e.g., symbolic signals upheld by punishment). 

  This tiering emphasizes Zahavi's core idea: a true handicap requires the cost itself to be the "filter" preventing dishonesty, rather than cost being a side effect of other honesty mechanisms.
