  First, unpacking McMahan: His argument hinges on causal contribution + agency. Even if a combatant isn't blameworthy (due to reasonable mistake), their voluntary actions *materially contribute* to an unjust threat, making them liable to defensive harm. The user wants this linkage severed—to argue that without *fault* (culpability), mere causal responsibility can't justify killing. 

  Key angles to counter McMahan:
  1. **Moral luck problem**: McMahan's view makes liability hinge on epistemic luck (whether your society fed you true/false war propaganda). But morality shouldn't punish people for factors entirely beyond their control. A conscripted farmer duped into believing invasion is self-defense is *materially* identical to a culpable aggressor in McMahan's framework—that feels unjust.  
     
  2. **The "double asymmetry" issue**: McMahan preserves non-liability for just combatants (even if they cause collateral harm) while denying it to mistaken unjust ones. But if both act on identical evidence—say, both sides have credible but conflicting intelligence—why does truth alone determine liability? This privileges outcome over intention in a way that seems arbitrary.  

  3. **Agency dilution**: Reducing liability to causal contribution ignores the *quality* of agency. A soldier coerced into fighting or brainwashed since youth lacks meaningful autonomy in their contribution. Their "responsibility" is thin—more patient than agent. Killing them feels like punishing a cog in the machine.  

  4. **Walzer's core insight**: Even if Walzer's "moral equality" is often dismissed as a legal fiction, its moral kernel—that soldiers share a common plight as instruments of state policy—retains force. Rejecting liability for non-culpable combatants honors the intuition that morality cares *why* you act, not just what you causally do.  

  User's deeper need: They likely sense that McMahan's rigorism leads to counterintuitive harshness (killing blameless people) and seeks a war ethic that avoids nihilism. Their request for "deep morality" suggests dissatisfaction with pragmatic compromises. I should emphasize how tying liability to culpability better reflects moral emotions—we feel guilt/shame only for choices we control, and resentment toward those who *should* know better.  

  Biggest challenge: Avoiding a slide into pure consequentialism. Must clarify that this isn't about sparing unjust combatants for utilitarian reasons (e.g., to encourage surrender) but about the *inherent wrong* of harming the blameless. Anchor in deontic concepts like the right to life being forfeitable only through fault.  

  Potential hole: What about "conditional threats"? Even mistaken soldiers objectively endanger others. Response: Defensive rights must be proportionate. You may *permissibly* kill a non-culpable aggressor to save many (concession to realism), but they aren't *liable*—meaning you wrong them, excusably. This preserves the moral asymmetry McMahan erases.  

  Final framing: Position this as "moral equality of conscientious combatants." Two soldiers, equally convinced of their cause's justice, equally careful in judgment, shouldn't have diametrically opposed moral status. The just one isn't a hero; the mistaken one isn a murderer. War's tragedy is that both can act rightly yet wrongly kill.
answer: |-
  I'll argue against McMahan's responsibility-without-culpability model and defend a culpability-based account of liability that preserves the moral equality of combatants at the level of deep morality. McMahan's decoupling of liability from culpability fails on three interconnected fronts: moral agency, epistemic constraints, and the fundamental conditions for forfeiture of rights.

  ### 1. **The Moral Agency Problem: Culpability as Necessary for Forfeiture**
  McMahan treats causal responsibility as sufficient for liability, but this ignores the *moral quality* of agency required for rights forfeiture. The right to life isn't forfeited merely by contributing to harm; it requires *fault* in one's practical reasoning. Consider:
  - A doctor who unknowingly administers poisoned medicine (due to a supplier's sabotage) causes death but isn't morally liable—because her mistake was non-culpable. Similarly, a soldier who reasonably believes in their cause’s justice acts on epistemically virtuous grounds.  
  - **Forfeiture requires blameworthiness**: Rights forfeiture is a moral response to *culpable wrongdoing*, not neutral causation. To kill someone who lacks culpability is to treat them as an object or obstacle—denying their moral status as an agent acting under sincere (if erroneous) conviction.

  ### 2. **The Epistemic Problem: Reasonable Beliefs and Moral Luck**
  McMahan’s model makes liability hinge on *moral luck*—whether one’s society’s narrative happens to be true—undermining moral fairness:
  - **Reasonable false beliefs aren’t culpable**: A conscript raised in a totalitarian state, fed fabricated evidence of enemy atrocities, and acting to defend perceived innocents exercises due diligence in moral judgment. Holding them liable for facts they *could not reasonably access* imposes strict liability, violating the principle that "ought implies can."  
  - **Symmetry in epistemic constraints**: Just combatants also act on fallible beliefs (e.g., about proportionality or noncombatant immunity). If liability requires only causal contribution to *objective* injustice, then just combatants causing collateral damage would be liable too—a conclusion McMahan rejects, revealing inconsistency. Only culpability can break this symmetry fairly.

  ### 3. **The Social Reality Problem: War as a Domain of Radical Uncertainty**
  Walzer’s moral equality isn’t merely pragmatic—it reflects war’s inherent moral fog:
  - **Institutional epistemology**: Soldiers don’t choose wars; they inherit them from political authorities. Expecting individual combatants to adjudicate *jus ad bellum* amidst state propaganda, secrecy, and chaos is unrealistic. Their duty is to fight *justly* (following *jus in bello*), not to achieve infallible geopolitical judgment.  
  - **Reciprocity of risk**: If both just and unjust combatants face identical battlefield hazards—exposure to violence, fog of war, psychological trauma—then imposing liability solely based on the *outcome* of political leaders’ decisions (which soldiers don’t control) is arbitrary. Culpability-based liability respects their shared predicament.

  ### A Culpability-Based Alternative: Moral Equality at the Deep Level
  We can ground Walzer’s moral equality in deep morality by tying liability to culpable *unjust conduct* (e.g., targeting civilians, torture), not merely participation:
  - **Liability requires culpable unjust action**: A combatant becomes liable only if they *culpably* violate *jus in bello* norms (e.g., knowingly attacking noncombatants) or *culpably* participate in an unjust war *while aware of its injustice*. Non-culpable unjust combatants retain their right not to be attacked.  
  - **Preserving symmetry**: Both just and unjust combatants are:  
    - **Permitted** to kill enemy combatants (who are liable only if culpable).  
    - **Prohibited** from killing noncombatants.  
    - **Obligated** to minimize harm.  
    This symmetry isn’t a concession to realism—it’s a recognition of war’s collective nature and soldiers’ limited moral agency.  

  - **Objection handling**:  
    - *"But non-culpable unjust combatants still cause harm!"* True, but so do just combatants (e.g., via collateral damage). Defensive killing may be *permissible* against non-culpable threats when necessary (based on lesser-evil justification), but it does not render them *liable*. Their right to life is infringed, not forfeited—retaining moral residue (e.g., compensation owed to their families).  
    - *"Doesn’t this excuse all unjust soldiers?"* No. Those who *should have known* their war was unjust (e.g., ignoring available evidence) remain culpable. Liability hinges on *reasonable* belief, not sincere belief alone.  

  ### Conclusion
  McMahan’s responsibility-without-culpability model reduces soldiers to causal mechanisms, ignoring the moral core of agency: the capacity for blameworthy choice. A culpability-based account honors combatants as moral agents while acknowledging war’s coercive structures. By tying liability to culpable wrongdoing—not factual contribution to unjust harm—we preserve Walzer’s moral equality at the level of deep morality, avoiding the counterintuitive harshness of punishing those who act in good faith. This view doesn’t absolve unjust wars; it directs blame where it belongs: to leaders and institutions, not non-culpable instruments of their will.
