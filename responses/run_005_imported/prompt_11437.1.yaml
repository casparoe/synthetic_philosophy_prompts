  Overall, both are overlooking a deeper issue: 
  - What illusionism must do is provide a complete account of why we have the strong introspective representation of phenomenal properties without there being any. The challenge is to explain the nature of these representations in a way that accounts for the subjective aspect without invoking phenomenality. 

  Does illusionism escape the incoherence charge? 
  - It does not seem incoherent on the face of it because it consistently denies the existence of phenomenal properties and explains our reports and intuitions in terms of representations. However, the charge of postponing the problem might stick if the representations themselves are not adequately explained. 

  But note: illusionism does not postpone the problem because it denies that there is a further phenomenal property to explain. The representations are non-phenomenal, and the illusionist project is to explain how such representations arise and why they are so compelling. 

  However, the challenge remains: can we have a representation of a phenomenal property without any phenomenal properties? And if so, why does it seem so real? Illusionists like Keith Frankish and Daniel Dennett argue that we can, by appealing to cognitive and representational mechanisms. 

