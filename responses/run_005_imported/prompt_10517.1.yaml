          Good state: both enter -> each gets $50 - $20 = $30.
          Bad state: both stay out -> 0.
          Expected for each: 0.5*30 = 15.

     Now, the matrix for Day0 commitment decision:

            Beta: Commit          Wait
  Alpha:
  Commit    (10, 10)             (25, 5)
  Wait      (5, 25)              (15, 15)

  This is the structure we want.

  Explanation:
  - If both commit: (10,10)
  - If Alpha commits and Beta waits: (25,5)
  - If Alpha waits and Beta commits: (5,25)
  - If both wait: (15,15)

  Now, best response for Alpha:
     - If Beta commits: then Alpha by committing gets 10, by waiting gets 5 -> so commit.
     - If Beta waits: then Alpha by committing gets 25, by waiting gets 15 -> so commit.

  So regardless of what Beta does, Alpha prefers to commit. Similarly for Beta.

  So the dominant strategy is to commit. Therefore, both will commit and get 10, which is worse than if they both waited (15).

  This is the commitment race: both are driven to commit early, but they would be better off if they both waited.

  The mechanics: 
     - On Day0, both have to decide whether to commit early or wait.
     - If they commit early, they lock in a development decision (develop in both states) at a lower cost, but also expose themselves to the bad state loss.
     - The incentive to commit early is the hope of being the only one to do so, which gives a high payoff in the good state (because of the first-mover advantage) and forces the other to be a follower with a lower payoff.
     - But if both commit, they lose in the bad state and also don't get the first-mover advantage in the good state.

  The exact step where it blows up: when both agents choose to commit early on Day0, they are binding themselves to develop in both states. Then, when the state is revealed to be bad, they both incur significant losses.

  Conclusion: This example shows how the incentive to secure a first-mover advantage (or a strategic advantage) by committing early can lead both parties to commit, resulting in a worse expected outcome for both.
