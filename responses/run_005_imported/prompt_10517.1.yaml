  Below is a fresh, concrete example illustrating the "commitment races problem." I'll avoid sci-fi/AIs and use a business scenario involving two competing companies. The key is to show how racing to commit early can trap both in a worse outcome, even though each is acting rationally.

  ---

  ### **The Scenario: Pharma R&D Race**
  Two pharmaceutical companies, **AlphaMed** and **BetaCure**, are deciding whether to invest in developing a new drug.  
  - **The drug's success depends on an unknown biological factor** (e.g., a gene mutation prevalence).  
    - *Good state* (50% chance): The drug works, yielding high profits.  
    - *Bad state* (50% chance): The drug fails, causing losses due to wasted R&D and reputational damage.  
  - **Timeline**:  
    - **Day 0**: Both companies can publicly commit to "Invest" or "Not Invest." *No one knows the state yet.*  
    - **Day 1**: The state (Good/Bad) is publicly revealed.  
    - **Day 2**: Companies that *didn’t* commit on Day 0 decide whether to invest.  
  - **Payoffs**:  
    - If a company invests alone in the *Good state*, it dominates the market and earns **$120M**.  
    - If both invest in the *Good state*, they split the market, earning **$60M each**.  
    - If a company invests in the *Bad state*, it loses **-$50M** (R&D costs + penalties).  
    - Non-investors earn **$0**.  

  ---

  ### **Key Incentive: Early Commitment Discount**
  To create a race, we add a **strategic advantage for early commitment**:  
  - If a company commits to "Invest" on *Day 0* (before knowing the state), it receives a **government subsidy** reducing its losses in the *Bad state* to **-$20M** (instead of -$50M).  
  - *This subsidy is only available to early committers.*  

  ---

  ### **Payoff Matrix (Expected Values in $M)**
  | AlphaMed ↓ \ BetaCure → | **Commit (Day 0)** | **Wait (Decide on Day 2)** |
  |-------------------------|-------------------|----------------------------|
  | **Commit (Day 0)**      | Both get: 0.5×(60) + 0.5×(-20) = **20 each** | AlphaMed: 0.5×(120) + 0.5×(-20) = **50** <br> BetaCure: 0.5×(0) + 0.5×(0) = **0** |
  | **Wait (Day 2)**        | AlphaMed: 0.5×(0) + 0.5×(0) = **0** <br> BetaCure: 0.5×(120) + 0.5×(-20) = **50** | Both wait: 0.5×(60) + 0.5×(0) = **30 each** |

  ---

  ### **Step-by-Step Breakdown**
  #### **1. If both commit on Day 0 (before knowing the state)**:  
     - *Good state*: Both invest, split the market → **$60M each**.  
     - *Bad state*: Both invest but get subsidies → **-$20M each**.  
     - **Expected value**: (0.5 × 60) + (0.5 × -20) = **$20M each**.  

  #### **2. If only AlphaMed commits early (Day 0), and BetaCure waits**:  
     - *Good state*:  
       - AlphaMed invests (subsidy locked in).  
       - BetaCure sees the state is good, invests on Day 2.  
       - Result: Both invest → AlphaMed gets **$60M**, BetaCure gets **$60M** (no subsidy).  
     - *Bad state*:  
       - AlphaMed invests (subsidy reduces loss to -$20M).  
       - BetaCure sees the state is bad, *does not invest* → earns **$0**.  
     - **AlphaMed’s expected value**: (0.5 × 60) + (0.5 × -20) = **$20M**?  
       - *Correction*: In the good state, if both invest, AlphaMed gets $60M. In the bad state, AlphaMed loses $20M.  
       - But wait: if AlphaMed commits early and BetaCure waits, in the *good state*, AlphaMed doesn't monopolize—BetaCure enters!  
       - **Revised**: AlphaMed’s payoff = (0.5 × 60) + (0.5 × -20) = $30M - $10M = **$20M**.  
     - **BetaCure’s expected value**: (0.5 × 60) + (0.5 × 0) = **$30M**.  
       - *Error*: In the good state, BetaCure invests and gets $60M? But if both invest in good state, they split, so BetaCure gets $60M. In bad state, $0. So (0.5 × 60) + (0.5 × 0) = $30M.  

     - **Corrected Payoff for (Commit, Wait)**:  
       - AlphaMed: (0.5 × 60) + (0.5 × -20) = $30M - $10M = **$20M**  
       - BetaCure: (0.5 × 60) + (0.5 × 0) = $30M + $0 = **$30M**  

  #### **3. If both wait (decide on Day 2 after seeing the state)**:  
     - *Good state*: Both invest and split the market → **$60M each**.  
     - *Bad state*: Neither invests → **$0 each**.  
     - **Expected value**: (0.5 × 60) + (0.5 × 0) = **$30M each**.  

  ---

  ### **The Commitment Race Trap**
  - **AlphaMed’s reasoning on Day 0**:  
    - *If BetaCure commits early*:  
      - AlphaMed’s options:  
        - Commit: Gets **$20M** (as in case 1).  
        - Wait: Gets **$0** (as in case 2, "Wait" column when BetaCure commits).  
      - → *Better to commit* ($20M > $0).  
    - *If BetaCure waits*:  
      - AlphaMed’s options:  
        - Commit: Gets **$20M** (as in case 2).  
        - Wait: Gets **$30M** (as in case 3).  
      - → *Better to wait* ($30M > $20M).  
    - **Problem**: AlphaMed doesn’t know BetaCure’s choice!  

  - **The race**:  
    - If both think the other might commit, committing early becomes a "dominant strategy":  
      - No matter what BetaCure does, AlphaMed gets $20M by committing (vs. $0 or $30M).  
      - But if both commit, they only get $20M each.  
    - **Trap**: If both commit early, they get **$20M each**, but if both waited, they’d get **$30M each**.  

  ---

  ### **Why the Rush to Commit? The Exact Blowup**
  1. **Step 1 (Day 0)**: Both fear the other might commit early to capture the subsidy.  
     - If BetaCure commits, AlphaMed *must* commit to avoid $0 (vs. $20M).  
     - If BetaCure waits, AlphaMed *should* wait for $30M (better than $20M).  

  2. **Step 2 (Blowup)**:  
     - Both choose "Commit" on Day 0 to avoid being the sucker left with $0.  
     - **Result**: They lock into a policy of investing *regardless of the state*.  
     - **Consequence**: In the *Bad state*, they both lose **-$20M** (even with subsidies), dragging down their expected payoff.  

  3. **Step 3 (Day 1)**: The state is revealed as *Bad*.  
     - Both *must* invest due to their Day 0 commitment.  
     - **Exact blowup point**: They each lose **-$20M** (which could’ve been $0 if they waited).  
     - **Net loss**: The subsidy softens the blow, but they’re still worse off ($20M expected) than if both waited ($30M expected).  

  ---

  ### **Why Is This a Problem?**
  - **Individually rational, collectively harmful**:  
    - Each commits early to avoid being exploited if the other commits first.  
    - But when both do it, they’re stuck with unnecessary losses in the *Bad state*.  
  - **The race dynamic**:  
    - The subsidy (reward for early commitment) incentivizes rushing before information is available.  
    - This mirrors real-world scenarios like:
      - Companies rushing patents on poorly understood tech.  
      - Countries signing treaties without full assessment.  

  ---

  ### **Key Takeaway**
  The commitment race isn’t about irrationality—it’s a **coordination failure**. Both agents would prefer to wait ($30M each), but the fear of the other’s early commitment forces them into a suboptimal Nash equilibrium ($20M each). The trap snaps shut when they bind themselves *before* they know if the investment is wise. 

  This shows why "racing to commit" can backfire: it sacrifices the flexibility to respond to future information, turning uncertainty into guaranteed losses.
