  For the memo structure: I'll need to acknowledge Augustine's view first to establish credibility, then show how Catholic teaching has nuanced applications of truth-telling. The case resolution should center on caritas - the junior's motive was protective love, not deception. Going forward, the "compelling moral justification" clause needs clear criteria: immediate harm prevention, proportionality, and exhausting alternatives.

