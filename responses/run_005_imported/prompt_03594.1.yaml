  I should start by explaining the Skolemite view: model-theoretic relativism. Concepts like uncountability are relative to the model. Different models can have different interpretations of the same set. For example, what one model sees as uncountable, another might see as countable if it has more functions. This challenges the idea of a fixed set-theoretic universe.

  Next, address the second-order retreat. Second-order ZFC quantifies over subsets, so the power set is "full" in the model. But to define second-order logic, you need a background set theory. This background already assumes a notion of subsets, leading to circularity. If the background is countable, the second-order model might still be countable from an external view, but internally it satisfies uncountability. This doesn't escape relativity; it just shifts it to the metatheory.

