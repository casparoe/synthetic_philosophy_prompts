answer: |-
  ## Debate League Rules Committee Memo: Recommendation on Topicality-Only Decisions

  **To:** Rules Committee Members  
  **From:** [Your Name], Student Representative  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on Proposal to Ban "Topicality-Only" Decisions  

  ### Executive Summary
  After careful consideration of arguments for and against "topicality-only" (T-only) decisions, I recommend adopting a **modified "reasonability" standard** (Option 3). This balances the need for topical fairness with the goal of substantive debate, directly addressing the core "Pluto problem" identified by our coach. Judges would reject T-only challenges unless the violation is *clear, unreasonable, and materially undermines fair debate*.

  ---

  ### Background
  The proposal seeks to ban judges from voting *solely* on Topicality (T) – i.e., ruling against a team *only* because their plan doesn’t meet a strict interpretation of a resolution term (e.g., "reduce" ≠ cap-and-trade), *without* finding the plan substantively flawed. The core tension:  
  - **Pro-T Argument:** T is a necessary check ensuring fairness, predictability, and topic relevance. Without it, teams can distort the resolution, forcing opponents to prep for infinite non-topical cases.  
  - **Anti-T Argument:** T-only debates prioritize semantic games over substantive clash, rewarding "cheap shot" technicalities instead of engagement with real-world policy impacts.  

  Our coach’s "Pluto analogy" is pivotal: Is the debate about *the actual policy* (planetary characteristics) or *semantic boundaries* (the definition of "planet")? When is a T debate a *substantive disagreement about rules* vs. a *distracting linguistic trick*?

  ---

  ### Recommendation & Options Analyzed

  #### Option 1: Keep T-Only Decisions (Status Quo)  
  *   **Strongest Argument:** **Fairness & Predictability.** T ensures all teams debate the *same topic*. Banning it encourages "squirrely" cases that hijack the resolution (e.g., debating "reduce militarization" on a topic about "reducing poverty" by claiming poverty causes war). Teams invest significant prep based on topic boundaries; removing T erodes this foundation.  
  *   **Strongest Argument AGAINST:** **Trivialization of Debate.** Critics are correct that T-only *can* (and often does) devolve into hyper-technical word games disconnected from real-world implications. Winning on "reduce" vs. "cap-and-trade" without engaging the policy’s merits feels hollow, undermines educational value, and alienates participants focused on substance. The "Pluto problem" looms large: Judges become arbiters of dictionary definitions, not policy analysis.  

  #### Option 2: Ban T-Only Decisions  
  *   **Strongest Argument:** **Substance Over Semantics.** This forces judges to evaluate the *actual merits* of the plan/arguments. Did the Aff solve the problem? Did the Neg disprove solvency or demonstrate harms? Debates center on policy impacts, critical thinking, and research – the core skills debate aims to develop. It eliminates "gotcha" wins based on minor definitional quibbles that ignore the plan’s real-world function.  
  *   **Strongest Argument AGAINST:** **Erosion of Topic Integrity & Unfair Burden.** Banning T removes a crucial tool for Neg against abusive Aff interpretations. An Aff could run a plan only tangentially related to the resolution (e.g., "Reduce CO2 by colonizing Mars" on a "reduce fossil fuels" topic), forcing the Neg to debate an entirely unexpected case. This unpredictability burdens Neg prep unfairly and dilutes the topic’s purpose.  

  #### Option 3: Adopt a "Reasonability" Standard (RECOMMENDED)  
  *   **The Middle Ground:** **T-only challenges are permissible, BUT the judge must assess if the Aff’s interpretation is *reasonable* within the context of the resolution and whether the violation *meaningfully undermines fair debate***.  
  *   **Resolving the "Pluto Problem":** This standard directly addresses our coach’s analogy. Judges ask:  
      1.  **Is the Aff’s definition/interpretation *plausible* and *reasonably related* to the resolution’s core topic?** (Is Pluto *a* celestial body we *might* reasonably debate under "planets"? Or is it clearly an asteroid/comet?)  
      2.  **Did the violation *genuinely prevent* the Neg from having a fair debate on the core issues implied by the topic?** (Did debating Pluto *as a planet* make it impossible to engage with the substantive characteristics relevant to other planets?)  
  *   **How Judges Apply It Mid-Round:**  
      1.  **The Neg must win TWO things:**  
          - **Violation:** Their interpretation proves the Aff doesn’t meet the resolution's terms.  
          - **Reasonability & Impact:** The Aff’s interpretation is *unreasonable* **AND** this unreasonableness *significantly harms* the Neg’s ability to engage the core topic fairly (e.g., by forcing prep on unrelated ground, making core Neg strategies impossible).  
      2.  **The Judge Evaluates Context:**  
          - Does the Aff's interpretation align with common topic understanding or expert usage?  
          - Is the Neg's interpretation overly narrow/technical to exclude viable Aff approaches?  
          - Did the T debate *replace* substantive clash, or was it a necessary check on abuse?  
          - Could the Neg still engage the Aff's *substantive* arguments effectively *despite* the potential violation?  
      3.  **The Vote:** A judge can *only* vote on T if they find the Aff was **unreasonable AND** that this unreasonableness caused **substantial unfairness**. Otherwise, they evaluate the substantive debate.  

  *   **Strongest Argument FOR:** **Balances Competing Values.** Protects against genuine abuse (unreasonable interpretations) while discouraging frivolous T debates over minor definitional disagreements ("Pluto is/isn't a planet"). Prioritizes substance *unless* semantics fundamentally break fairness.  
  *   **Strongest Argument AGAINST:** **Judicial Discretion & Potential Inconsistency.** This places significant burden on judges to discern "reasonability" and "fairness" mid-round, potentially leading to inconsistent rulings. Some argue it replaces a clear rule ("T is a voter") with subjective judgment, which could be unpredictable for debaters. Training judges becomes crucial.  

  ---

  ### Why "Reasonability" is the Best Path Forward
  The Pluto analogy reveals the core issue: **Not all definitional disagreements are equal.** Some T debates protect the topic's integrity; others are pedantic distractions. A blanket ban (Option 2) ignores real potential for abuse, while the status quo (Option 1) validates trivial semantic wins. The "Reasonability" standard (Option 3) provides a principled framework for judges to distinguish between these scenarios. It demands that T be more than just a technicality – it must be a *necessary defense of fair and relevant debate*. This elevates substance while preserving a legitimate check against distortion, directly addressing the strongest concerns on both sides.

  **Recommendation:** **Vote to replace the current T-only standard with the "Reasonability" standard as described.** I move that we draft specific language incorporating the "unreasonable interpretation causing substantial unfairness" threshold and mandate judge training on its application.
