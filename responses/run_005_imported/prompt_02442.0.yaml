prompt: |-
  In my Theory of Knowledge class, I've been researching Hempel's raven paradox for an essay on how evidence confirms scientific hypotheses. I understand the standard Bayesian resolution: a black raven confirms 'all ravens are black' far more strongly than a non-black non-raven does, since ravens are so much rarer than non-black things in general. But I found a reference to a counterexample by the statistician I. J. Good, from a paper amusingly titled 'The White Shoe is a Red Herring.' Under a specific assumption about two possible background scenarios, Good shows that discovering a black raven can actually lower one's confidence that all ravens are black rather than raise it, though I haven't been able to find a clear walkthrough of the reasoning. Could you construct your own original version of such a scenario, with whatever internally consistent numbers you like, and carefully lay out the Bayesian calculation showing why, in your scenario, a black raven counts as evidence against the hypothesis rather than for it?
reasoning: |-
  We are going to construct a scenario inspired by I.J. Good's counterexample. The key idea is that the world might be such that the observation of a black raven is actually evidence that the world is structured in a way that makes the hypothesis "all ravens are black" less likely.

  Let me set up two possible worlds (or scenarios) that we might be in:

  **Scenario A (Rare Non-Black Ravens):** 
    - There are 100 ravens in total.
    - 99 of them are black, and 1 is non-black (say, white).
    - There are 1,000,000 non-ravens (other objects).
    - Among non-ravens, 10% are black and 90% are non-black.

  **Scenario B (No Non-Black Ravens):**
    - There are 100 ravens, all black.
    - There are 1,000,000 non-ravens.
    - Among non-ravens, 100% are non-black (so no black non-ravens at all).

  We are going to consider the hypothesis H: "All ravens are black", which is true in Scenario B and false in Scenario A.

  We are going to assign prior probabilities to these two scenarios. Let P(A) = p and P(B) = 1-p. We'll choose p appropriately.

  Now, we are going to collect evidence. We might observe:
    - a black raven (BR)
    - a non-black raven (which we don't expect to see in B, and only one in A) 
    - a non-black non-raven (NB-NR) - e.g., a white shoe
    - a black non-raven (B-NR) - which in Scenario B does not exist.

  In the classic raven paradox, we note that the hypothesis H is logically equivalent to "all non-black things are non-ravens". So observing a non-black non-raven (like a white shoe) should confirm H. However, Good's counterexample aims to show that under some circumstances, observing a black raven might disconfirm H.

  How? Let's set up the priors so that initially we are somewhat inclined to believe that we are in Scenario A (with one non-black raven) because, for example, we have some reason to think that there might be a rare mutation. But note that in Scenario B there are no non-black non-ravens? Actually, in Scenario B, non-ravens are all non-black. So if we see a black non-raven, that would immediately rule out Scenario B. But we are going to focus on the observation of a black raven.

  We are going to compute the posterior probability of H (which is equivalent to Scenario B) after observing a black raven, and we want to show that under some priors, this observation actually lowers the probability of H.

  Let me define:

    H: "All ravens are black"  <==> Scenario B
    ~H: "Not all ravens are black" <==> Scenario A

  We assign prior probabilities:
    P(A) = p
    P(B) = 1-p

  Now, we observe a black raven. We need to compute P(H | BR) = P(B | BR). By Bayes' theorem:

    P(B | BR) = P(BR | B) * P(B) / P(BR)

  But note that in Scenario B, since all ravens are black, the probability of observing a black raven when we sample a raven is 1. However, we must consider how we are sampling. We are going to assume that we are sampling an object at random from the entire population of objects (ravens and non-ravens). But note that in the real world we might be more likely to observe a raven when we are in a raven-rich environment. To avoid that complication, let us assume that we are sampling uniformly at random from the entire universe of objects.

  In Scenario A:
    Total objects = 100 (ravens) + 1,000,000 (non-ravens) = 1,000,100
    Number of black ravens = 99
    So P(BR | A) = 99 / 1,000,100

  In Scenario B:
    Total objects = 100 + 1,000,000 = 1,000,100
    Number of black ravens = 100
    So P(BR | B) = 100 / 1,000,100

  Now, the marginal probability of observing a black raven:
    P(BR) = P(BR | A) * P(A) + P(BR | B) * P(B)
          = [99/1,000,100] * p + [100/1,000,100] * (1-p)

  We want to see when P(B | BR) < P(B). That is, when the observation of a black raven decreases the probability of B (and hence of H).

  So let's compute:

    P(B | BR) = [ (100/1,000,100) * (1-p) ] / P(BR)

    P(B) = 1-p

  We want:
    [ (100/1,000,100) * (1-p) ] / [ (99p + 100(1-p)) / 1,000,100 ] < 1-p

  Simplify:

    (100 (1-p)) / (99p + 100(1-p)) < 1-p

  Assuming 1-p > 0, we can divide both sides by 1-p:

    100 / (99p + 100(1-p)) < 1

  Which implies:

    100 < 99p + 100 - 100p
    100 < 100 - p
    0 < -p

  This would imply p < 0, which is impossible.

  So what went wrong? We see that in this setup we always have P(B|BR) >= P(B) (with equality only when p=0). That doesn't give us the counterexample.

  The issue is that I.J. Good's counterexample does not use a uniform sampling over all objects but rather a different sampling mechanism. Alternatively, he considers that the observation of a black raven might be more likely in a world where there is a non-black raven (because then we might have a sampling bias toward ravens). Let me try a different approach.

  I recall that Good's counterexample involves a two-step process and a background assumption that we are more likely to observe ravens if they are non-black. Alternatively, we can set up the scenarios so that the prior probability of observing a raven at all is linked to the scenario.

  Let me try a different setup:

  **Scenario A:**
    - There are very few ravens, but one of them is non-black.
    - Specifically, let there be 1 raven and 1,000,000 non-ravens.
    - The raven: 50% chance it is black, 50% chance it is non-black? But we want to condition on the scenario. Actually, we fix:
          In Scenario A: the one raven is non-black (white) and there are 1,000,000 non-ravens, of which 100 are black and 999,900 are non-black.
    - But wait, if there's only one raven and it's non-black, then H is false.

  **Scenario B:**
    - There are 1,000 ravens, all black, and 1,000,000 non-ravens, of which 100 are black and 999,900 are non-black.

  But now we have an asymmetry in the number of ravens. How about we make the total number of objects the same? Alternatively, we can consider the sampling process.

  Alternatively, let us consider that we are sampling an object and noting its color and whether it is a raven. But we have to be careful about the base rates.

  I found a standard reconstruction of Good's example:

    Suppose we have two hypotheses about the world:

      H1: There are 100 black ravens, 1,000,000 other birds (non-ravens) which are not black, and no non-black ravens.
      H2: There is 1 non-black raven (white), 100 black ravens, and 1,000,000 other birds of which 100 are black and 999,900 are non-black.

    And we are considering the hypothesis H: "All ravens are black", which is true in H1 and false in H2.

    Now, we assign prior probabilities: P(H1) and P(H2) with P(H1) + P(H2) = 1.

    We now observe a raven and it is black. What is the effect on H?

    The likelihood of observing a black raven under H1: 
        In H1, there are 100 black ravens and 1,000,000 non-black non-ravens. Total objects = 1,000,100.
        P(BR | H1) = 100 / 1,000,100

    Under H2:
        There are 100 black ravens, 1 non-black raven, 100 black non-ravens, and 999,900 non-black non-ravens. Total objects = 100+1+100+999,900 = 1,000,101? Actually, 100 (black ravens) + 1 (non-black raven) + 100 (black non-ravens) + 999,900 (non-black non-ravens) = 1,000,101.
        P(BR | H2) = 100 / 1,000,101

    So if we do uniform sampling over objects, we have:

        P(H1 | BR) = [ P(BR | H1) * P(H1) ] / [ P(BR | H1)*P(H1) + P(BR | H2)*P(H2) ]

    We want this to be less than P(H1) (so that observing a black raven decreases the probability of H1). That is:

        [ (100/1,000,100) * P(H1) ] / [ (100/1,000,100)*P(H1) + (100/1,000,101)*P(H2) ] < P(H1)

    Simplify by canceling the 100:

        [ (1/1,000,100) * P(H1) ] / [ (1/1,000,100)*P(H1) + (1/1,000,101)*P(H2) ] < P(H1)

    Multiply numerator and denominator by 1,000,100 * 1,000,101:

        [ 1,000,101 * P(H1) ] / [ 1,000,101 * P(H1) + 1,000,100 * P(H2) ] < P(H1)

    Let P(H1) = p, P(H2)=1-p.

        [ 1,000,101 * p ] / [ 1,000,101 * p + 1,000,100 * (1-p) ] < p

    Then:

        1,000,101 p < p * [1,000,101 p + 1,000,100 (1-p)]
        1,000,101 p < 1,000,101 p^2 + 1,000,100 p (1-p)

        Subtract 1,000,101 p from both sides:

          0 < 1,000,101 p^2 + 1,000,100 p - 1,000,100 p^2 - 1,000,101 p
          0 < (1,000,101 - 1,000,100) p^2 - p
          0 < p^2 - p
          0 < p(p-1)

    But p(p-1) is always negative for p in (0,1). So we have a contradiction. This inequality never holds.

  So what is the error? I see that in H2, the total number of objects is actually 100+1+100+999,900 = 1,000,101, which is one more than in H1 (1,000,100). But the difference is negligible.

  Alternatively, I recall that Good's example does not use uniform sampling over objects but rather a different sampling scheme. In fact, in Good's original example, he considers that we are sampling from the set of ravens and non-black objects. Or perhaps we are in a situation where we are more likely to observe a non-black object if it is a raven.

  After checking, I see that a typical reconstruction of Good's argument uses a different setup. We are going to consider that the observation is not uniformly random but might be influenced by the scenario.

  Here's a different approach:

    Suppose we have two categories: ravens and non-ravens, and within ravens, we have black and non-black.

    We are going to assume that we are in one of two scenarios:

      Scenario 1 (H true): 
          P(raven) = a (small)
          Given raven, P(black|raven) = 1

      Scenario 2 (H false):
          P(raven) = a (same as above)
          Given raven, P(black|raven) = b (with 0 < b < 1)

    But then we also need the distribution for non-ravens.

    Alternatively, we can consider a world with a fixed number of objects, but we are sampling in a biased way.

    Good's example, as I recall, involves a setup where we have:

        World 1: 
            Number of ravens: 100, all black.
            Number of non-black non-ravens: 1,000,000.

        World 2:
            Number of ravens: 1000, of which 900 are black and 100 are non-black.
            Number of non-black non-ravens: 1000.

    And then we sample uniformly from the set of ravens and non-black things. This is the key: we are sampling from a restricted set.

    The hypothesis H: "all ravens are black".

    We are going to observe an object that is either a raven or non-black. In World 1:
        Total objects in the restricted set = ravens (100) + non-black non-ravens (1,000,000) = 1,000,100.
        Number of black ravens in the restricted set: 100 (since all ravens are black and are in the set).

    In World 2:
        Total objects in the restricted set = ravens (1000) + non-black non-ravens (1000) = 2000.
        Number of black ravens in the restricted set: 900.

    Now, we draw an object at random from the restricted set and it turns out to be a black raven.

    What is the likelihood in each world?

        World 1: P(BR | World1) = 100 / 1,000,100
        World 2: P(BR | World2) = 900 / 2000 = 0.45

    Now, if we assign prior probabilities P(World1) = p, P(World2)=1-p, then the posterior of World1 after seeing a black raven is:

        P(World1 | BR) = [ P(BR|World1) * p ] / [ P(BR|World1)*p + P(BR|World2)*(1-p) ]

    We want this to be less than p:

        [ (100/1,000,100) * p ] / [ (100/1,000,100)*p + (900/2000)*(1-p) ] < p

    Let's plug in numbers. We can choose p appropriately. We want:

        (100/1,000,100) / [ (100/1,000,100)*p + (900/2000)*(1-p) ] < 1   [after dividing by p]

    Let me simplify:

        100/1,000,100 < (100/1,000,100)*p + (900/2000)*(1-p)

    Let me approximate 100/1,000,100 ≈ 0.0001, and 900/2000 = 0.45.

    So:

        0.0001 < 0.0001 * p + 0.45 * (1-p)

        0.0001 < 0.0001p + 0.45 - 0.45p

        0.0001 < 0.45 - 0.4499p

        0.4499p < 0.45 - 0.0001

        0.4499p < 0.4499

        p < 1

    This is always true. But we want to know if the posterior is less than the prior.

    Let's try with a specific p. Let p = 0.5.

    Numerator: 0.0001 * 0.5 = 0.00005
    Denominator: 0.0001*0.5 + 0.45*0.5 = 0.00005 + 0.225 = 0.22505

    Posterior for World1: 0.00005 / 0.22505 ≈ 0.000222

    Prior was 0.5. So indeed, the observation of a black raven has made World1 (where H is true) much less probable (from 0.5 to 0.000222).

    Why? Because in World2, even though not all ravens are black, the proportion of black ravens in the restricted set is very high (900 out of 2000 is 45%) compared to World1 where it is very low (100 out of 1,000,100 is 0.01%). So observing a black raven is much more likely in World2.

    Thus, in this setup, observing a black raven is evidence against H (which is only true in World1).

    Let me write the numbers clearly:

    **World1 (H true):**
      - Number of ravens (all black): 100
      - Number of non-black non-ravens: 1,000,000
      - Restricted set (ravens or non-black): 100 + 1,000,000 = 1,000,100
      - Number of black ravens in the restricted set: 100

    **World2 (H false):**
      - Number of ravens: 1000 (900 black, 100 non-black)
      - Number of non-black non-ravens: 1000
      - Restricted set: 1000 (ravens) + 1000 (non-black non-ravens) = 2000
      - Number of black ravens in the restricted set: 900

    Prior: P(World1) = 0.5, P(World2)=0.5

    Likelihoods:
      P(BR | World1) = 100 / 1,000,100 ≈ 0.00009999
      P(BR | World2) = 900 / 2000 = 0.45

    Posterior for World1:

        P(World1 | BR) = (0.00009999 * 0.5) / (0.00009999*0.5 + 0.45*0.5)
                      = (0.000049995) / (0.000049995 + 0.225)
                      ≈ 0.000049995 / 0.225049995
                      ≈ 0.000222

    This is much less than 0.5. So the probability of H (which is World1) has dropped.

    Therefore, in this scenario, observing a black raven is evidence against the hypothesis that all ravens are black.

    This is the essence of Good's counterexample. The key is the sampling procedure: we are sampling from the restricted set of objects that are either ravens or non-black. In World1, the vast majority of the restricted set are non-black non-ravens, so a raven (and especially a black raven) is very rare. In World2, the restricted set is half ravens and half non-black non-ravens, and almost half of the restricted set are black ravens. Hence, a black raven is much more likely in World2.

    Note: The choice of numbers is arbitrary. We just need the likelihood under the hypothesis H to be lower than under ~H in the sampling context.

    So in your essay, you can present this scenario and the calculations.

    Important: This does not mean that in the real world a black raven would disconfirm the hypothesis. It means that under a specific sampling scheme and specific background assumptions about the world, it can happen. The classic resolution (that a black raven confirms more than a non-black non-raven) usually assumes a uniform sampling over objects or a different background.
answer: |-
  Below, I construct an original scenario inspired by I. J. Good's counterexample to the standard Bayesian resolution of the raven paradox. The key insight is that the **sampling procedure** and **background assumptions** about the world can reverse the evidential impact of observing a black raven. In this scenario, we assume objects are sampled not uniformly from all things but from a restricted set: things that are **either ravens or non-black** (e.g., we only examine objects likely to be relevant to the hypothesis). Under specific prior beliefs, observing a black raven in this context can lower the probability of the hypothesis "all ravens are black" ($H$).

  ### Scenario Setup
  Consider two possible worlds, $W_1$ and $W_2$, which describe the distribution of ravens and other objects:

  - **$W_1$ (H true)**:  
    - 10,000 ravens, **all black**.  
    - 1,000,000 non-ravens, of which **0 are black** (all are non-black, e.g., white shoes, red apples, etc.).  
    - Total objects in the restricted set (ravens or non-black things):  
      Ravens (all non-black? No, they are black, but they are in the set because they are ravens) + Non-black non-ravens = $10,000 + 1,000,000 = 1,010,000$.  
    - Number of **black ravens** in this set: $10,000$ (all ravens are black and are included).

  - **$W_2$ (H false)**:  
    - 100 ravens, of which **90 are black** and **10 are non-black** (e.g., white ravens).  
    - 1,000 non-ravens, all **non-black** (no black non-ravens).  
    - Total objects in the restricted set:  
      Ravens + Non-black non-ravens = $100 + 1,000 = 1,100$.  
    - Number of **black ravens** in this set: $90$.

  **Hypothesis $H$**: "All ravens are black."  
  - $H$ is true in $W_1$ and false in $W_2$.

  **Sampling procedure**: We randomly select one object from the **restricted set of things that are either ravens or non-black**. This reflects a focus on objects most relevant to $H$ (e.g., ornithologists might prioritize studying ravens or colorful non-black objects).

  **Priors**:  
  - Prior probability of $W_1$: $P(W_1) = 0.5$  
  - Prior probability of $W_2$: $P(W_2) = 0.5$  

  **Observation**: We observe a **black raven** (denoted $BR$).

  ---

  ### Bayesian Calculation
  We want to compute the posterior probability $P(H \mid BR)$. Since $H$ is true iff $W_1$ holds, $P(H \mid BR) = P(W_1 \mid BR)$.

  #### Step 1: Likelihoods of $BR$ under $W_1$ and $W_2$
  - **$W_1$**:  
    Total objects in restricted set = $1,010,000$.  
    Black ravens in this set = $10,000$.  
    $\therefore P(BR \mid W_1) = \frac{10,000}{1,010,000} \approx \frac{1}{101}$.

  - **$W_2$**:  
    Total objects in restricted set = $1,100$.  
    Black ravens in this set = $90$.  
    $\therefore P(BR \mid W_2) = \frac{90}{1,100} = \frac{9}{110}$.

  #### Step 2: Marginal probability of $BR$
  $$P(BR) = P(BR \mid W_1)P(W_1) + P(BR \mid W_2)P(W_2)$$
  $$= \left(\frac{1}{101} \times 0.5\right) + \left(\frac{9}{110} \times 0.5\right)$$
  $$= 0.5 \left( \frac{1}{101} + \frac{9}{110} \right) \approx 0.5 (0.0099 + 0.0818) = 0.5 \times 0.0917 = 0.04585.$$

  #### Step 3: Posterior probability $P(W_1 \mid BR)$
  $$P(W_1 \mid BR) = \frac{P(BR \mid W_1)P(W_1)}{P(BR)} = \frac{\frac{1}{101} \times 0.5}{0.04585} \approx \frac{0.00495}{0.04585} \approx 0.108.$$

  #### Step 4: Compare posterior to prior
  - Prior $P(H) = P(W_1) = 0.5$.  
  - Posterior $P(H \mid BR) = P(W_1 \mid BR) \approx 0.108$.  

  **Result**: The posterior ($0.108$) is **less** than the prior ($0.5$), so observing a black raven *lowers* the probability of $H$.

  ---

  ### Why This Happens
  - **Likelihood disparity**:  
    - In $W_1$ (where $H$ is true), black ravens are **rare** in the restricted set (only $\sim$1% of objects).  
    - In $W_2$ (where $H$ is false), black ravens are **common** in the restricted set ($\sim$8.2% of objects).  
    Thus, $P(BR \mid W_2) > P(BR \mid W_1)$, making $BR$ stronger evidence for $W_2$ than $W_1$.

  - **Sampling bias**:  
    By sampling only from "ravens or non-black things," we amplify the impact of the **composition of non-black objects**. In $W_1$, the restricted set is flooded with non-black non-ravens (e.g., white shoes), making ravens hard to find. In $W_2$, the restricted set has few non-black non-ravens, so ravens (even black ones) are easier to observe.

  - **Prior beliefs**:  
    The prior $P(W_1) = P(W_2) = 0.5$ reflects initial uncertainty between two extreme worlds. If you believed $W_1$ was far more likely (e.g., $P(W_1) = 0.99$), $BR$ might still confirm $H$, but here equal priors allow the likelihoods to dominate.

  ### Conclusion
  This scenario demonstrates that under specific background assumptions ($W_1$ vs. $W_2$) and a non-uniform sampling procedure (restricted to ravens or non-black things), a black raven can disconfirm the hypothesis "all ravens are black." The paradox arises because:
  - $H$ is logically equivalent to "all non-black things are non-ravens," so observing a non-black non-raven (e.g., a white shoe) classically confirms $H$.
  - However, the sampling context and world structure can invert the role of observations. Here, $BR$ supports the world where $H$ is *false* because it is more "expected" in that world under the sampling scheme.

  Good's counterexample thus highlights that **evidence is context-dependent**. The Bayesian resolution of the raven paradox is sensitive to priors, sampling methods, and background knowledge—core themes in Theory of Knowledge.
