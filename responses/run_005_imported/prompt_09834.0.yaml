  We are ranking the given positions by philosophical convincingness for the lifeboat dilemma. The protagonist must choose between saving five strangers or her own brother. We consider the positions listed.

   Key positions to rank:

   1. Taurek: Individual loss matters only to the individual; no aggregation. Thus, no obligation to save the greater number. One might flip a coin or even save the one if personal ties exist.
   2. Plain aggregative utilitarianism: Save the larger group (five) because it maximizes total welfare.
   3. Parfit: Defends that numbers do count (against Taurek). He argues that we have reasons to save the greater number because each person counts equally and we have a duty to each.
   4. Scanlon: Contractualist. We justify saving the greater number by principles no one could reasonably reject. Each person has a claim to be saved, but when we cannot save all, we save the greater number because the claim of each in the larger group is equally strong and together they outweigh the smaller group's claim.
   5. Kamm: Numbers matter without simple aggregation. She uses the "principle of irrelevant goods" and argues that saving a greater number is required when the extra people are not a mere means and when the loss to each in the smaller group is comparable. But in this case, the brother is family, which might complicate.
