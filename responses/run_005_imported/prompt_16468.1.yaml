  For the deceiver/deceived paradox, I'll ask about the unified consciousness aspect first, then follow up on how this differs from Freudian models since Sartre rejects the unconscious. For the waiter, I'll challenge whether role competence equals authenticity, then press on whether any social role inherently requires bad faith. For the freedom paradox, I'll question how choosing bad faith is possible if it denies freedom, then corner the "pre-reflective choice" dodge by asking how we can discuss such choices meaningfully. 

