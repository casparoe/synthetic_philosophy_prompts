    "demarcation_criterion": 0,
    "tautology_argument": 0,
    "recantation": 0,
    "current_status": 0,
    "total": 0,
    "comments": ""
  }
  ```

  with the sub-scores adding up to the total out of 10, and the comments field holding two or three sentences of overall justification.
