  I should structure the memo to present the issue, analyze both sides, then recommend a solution. Highlighting the precedent is crucial. Any exemption must be structured to prevent abuse. The credit system rewards past contributions while maintaining the fund's integrity. It's a compromise that acknowledges both individual effort and communal support. 

  Also, the user's deeper need might be preserving house harmony and the fund's sustainability. They need a solution that feels fair to all, preventing resentment. Clear reasoning will help the council vote decisively. The memo must be concise but thorough, addressing philosophical concerns and practical implications.
answer: |-
  ## Recommendation: Structured Middle Ground (Credit System + Cap)

  **To:** Governance Council & House Members  
  **From:** [Your Name], Council Member  
  **Date:** [Date]  
  **Subject:** Recommendation re: Workshop Income & Common Fund Obligation  

  This memo addresses the novel situation regarding [Housemate's Name]'s workshop income and its relationship to our common fund bylaws. The core tension lies between upholding the mutual insurance principle fundamental to our agreement and recognizing legitimate individual effort and voluntary exchange. After careful consideration of both arguments, I recommend a **structured middle ground** combining **retroactive credit for past contributions** with a **cap on future poolable income** from this specific venture. This balances fairness, incentivizes initiative, and preserves the fund's core purpose.

  ### 1. Acknowledging the Competing Principles
  *   **The Case for Full Pooling (Council Members A & B):** This argument has significant merit. The fund's viability as informal insurance *requires* predictability and commitment. Windfalls are inherent to the risk-taking the fund enables. The house demonstrably provided crucial early support: serving as a test audience, offering credibility via our association (a known EA/rationalist hub), and likely generating referrals. Exempting high-earning activities risks moral hazard, encouraging members to "exit" the pool upon success, undermining the collective safety net we all rely on. Nozick's argument against state coercion doesn't cleanly apply here; we *voluntarily* agreed to this redistribution scheme to achieve a shared goal (enabling career risk). Opting out *after* benefiting from the safety net violates the initial pact's spirit.
  *   **The Case for Exemption (Housemate & Council Member C):** This argument also carries weight. The skill development, marketing effort, and direct service provision are uniquely [Housemate's Name]'s. Strangers paying for a workshop is fundamentally different from salary earned within a traditional employment structure the bylaws likely envisioned. Applying the pool to this feels like confiscating the fruits of distinct entrepreneurial labor. While the *initial* testing was valuable, it was provided *free* to the house, representing a past contribution. Continually pooling this income risks disincentivizing exactly the kind of innovative, value-creating activities we should encourage. Nozick's point highlights the intuitive unfairness of disrupting a pattern of voluntary transactions (workshop payments) to maintain a prior distribution scheme.

  ### 2. Why Neither Extreme is Optimal
  *   **Full Pooling:** Risks being perceived as punitive for individual success and entrepreneurialism, potentially stifling initiative and creating resentment. It may overstate the *ongoing* house contribution once the venture is established and externally marketed.
  *   **Clean Exemption:** Undermines the fund's core insurance function by setting a precedent where high-earning activities can be carved out. It fails to adequately recognize the house's *initial, enabling* contribution (testing, credibility, network) that helped launch the venture. It could incentivize members to structure income streams to appear "exempt."

  ### 3. Recommended Solution: Credit System + Cap
  I propose a two-part solution recognizing contributions from both sides:

  *   **A. Retroactive Credit for Past Contributions:** Calculate the fair market value (FMV) of the pilot workshops [Housemate's Name] conducted *for the house* during the development phase (e.g., the "better part of a year"). This FMV should be based on the *eventual* price point of the public workshops or reasonable market rates. **This calculated FMV is credited against her common fund contribution obligation arising from her workshop income.** This formally acknowledges the significant value *she provided to the house* during development. If the FMV exceeds her obligations to date, the excess credit carries forward.

  *   **B. Cap on Future Poolable Income:** For future workshop income, only a portion is subject to pooling. **Income above her personal stipend, derived *specifically* from these workshops, is subject to pooling only up to a cap of [e.g., 1.5x or 2x] the current house median quarterly income.** Income exceeding this cap is exempt.
      *   **Rationale for Cap:** This recognizes that once established, the *ongoing* direct contribution of the house diminishes significantly. The cap allows [Housemate's Name] to retain the majority of the upside from her continued effort and scaling, preserving incentive. Crucially, it *still requires a substantial contribution* to the common fund, upholding the principle of sharing success and maintaining the fund's viability. The cap level (1.5x-2x median) represents a significant windfall share while allowing substantial individual reward.

  ### 4. Application to Future Cases & Precedent
  This framework establishes a precedent for handling novel, high-earning ventures arising from individual initiative but leveraging house resources:

  1.  **Initial Contribution/Testing:** If house resources (time as test audience, reputation, space, network) are used significantly in the *development* phase, a retroactive credit for the FMV of that contribution should be calculated upon the venture's success.
  2.  **Ongoing Income:** For the *ongoing* income stream, a **cap** (e.g., 1.5x-2x house median income) should be applied to the portion subject to pooling above the stipend. This cap balances individual incentive with collective support.
  3.  **Defining "Leverage":** Future cases require clear evidence of material house resource use beyond mere cohabitation (e.g., dedicated use of common space for business, systematic use of members as testers/clients, reliance on house reputation for credibility in marketing). Salaried employment or freelance work in a pre-existing field generally remains fully poolable.

  ### 5. Addressing Nozick & Voluntariness
  [Your Name] rightly questions the direct application of Nozick's Wilt Chamberlain argument. Nozick targeted *state* coercion enforcing redistribution. Our arrangement is fundamentally different: **a voluntary contract among consenting adults pursuing a specific mutual goal (enabling career risk).** By joining, members willingly traded potential future windfalls for protection against downside risk *within the defined system*. While the *feeling* of unfairness when paying into the pool from a "new" source is understandable, the *objection based solely on Nozick* loses force because the initial agreement constitutes the voluntary creation of the very rules being applied. The stronger moral claim here stems from the *specific enabling role* the house played, which our solution addresses via the credit system, not from a blanket libertarian principle negating the contract.

  ### 6. Conclusion & Recommendation
  I recommend adopting the **Credit System + Cap** model for [Housemate's Name]'s workshop income:
  1.  Calculate FMV of past pilot workshops for the house and credit this against past/future obligations.
  2.  Apply a cap of [Proposed Cap, e.g., 1.5x House Median] to the portion of *future* quarterly workshop income (above stipend) subject to pooling.

  This solution:
  *   **Fairly compensates the house** for its initial, enabling role (via credit).
  *   **Upholds the fund's core function** by ensuring a substantial ongoing contribution (via cap).
  *   **Preserves individual incentive** by allowing retention of significant upside beyond the cap.
  *   **Provides a clear, equitable precedent** for future entrepreneurial ventures within the house.
  *   **Acknowledges both sides' concerns** without undermining the voluntary agreement.

  I move that the council and house members vote to amend the bylaws' application in this specific case according to this framework, and that we formally draft language incorporating this "venture contribution & cap" precedent for future novel income streams at the next bylaw review cycle.
