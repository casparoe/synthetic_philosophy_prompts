answer: |-
  ## The Alethic Ambition Undermined: Why Scoring Rule Pluralism Sinks Accuracy-First's Foundational Claim

  Accuracy-first epistemology promised a revolution: grounding the core norms of Bayesian rationality—probabilism and conditionalization—purely in the pursuit of truth (alethic value), banishing pragmatic Dutch books to the periphery. Joyce's accuracy-dominance argument seemed like the cornerstone: incoherent credences are *guaranteed* to be less accurate than *some* coherent credence, regardless of the world. But the devil, as your seminar grapples with, lies in the "accuracy." The subsequent shift to strictly proper scoring rules as the *sine qua non* of "legitimate" measures of accuracy, while securing probabilism, unleashes a problematic pluralism. This pluralism, I argue, **fatally compromises accuracy-first epistemology's claim to provide a purely alethic foundation for Bayesianism.** The invariance of probabilism is insufficient camouflage; the cracks in the alethic edifice appear the moment we move beyond mere coherence.

  **The Core Problem: Divergent Truth-Tracking Prescriptions**

  Strict propriety ensures that an agent's own credences uniquely minimize *expected* inaccuracy *by their own lights*. This is a powerful internal consistency requirement. However, different strictly proper rules embody fundamentally different conceptions of what *actual* closeness to truth means and how severely different kinds of errors should be punished:

  1.  **Extremity & Cromwell's Rule:** The logarithmic score's infinite penalty for assigning 0 (or 1) to a true (or false) proposition enforces a rigid version of Cromwell's Rule: never be absolutely certain about contingencies. The Brier score, conversely, imposes only finite penalties, permitting extreme credences if the agent judges the evidence overwhelmingly strong. Is avoiding catastrophic epistemic failure (log) an alethic imperative, or is it pragmatically motivated caution? The log score treats it as inherent to truth-seeking; the Brier score does not. Which reflects "pure" alethic value?
  2.  **Updating Rules:** While many rules favor conditionalization *in expectation*, their prescriptions for *actual* updating performance diverge. The log score uniquely mandates conditionalization as the *only* way to *minimize expected inaccuracy from your current perspective* for future updates. The Brier score does *not* uniquely mandate conditionalization in this strong sense – other update rules can match its *expected* accuracy. If the "uniquely rational" updating rule is alethically mandated, why does it depend on the choice of scoring rule? Does "alethic rationality" change with the metric?
  3.  **Weighting Errors:** Rules differ in how they weigh near misses vs. gross errors, or errors on likely vs. unlikely truths. The spherical score smooths errors differently than Brier or log. Which weighting scheme purely tracks "truth-likeness" without smuggling in a value judgment about the *cost* of different *kinds* of inaccuracy?

  **The Defense and its Fatal Weakness**

  Proponents might retort: **"Probabilism is invariant! That's the fundamental alethic norm. The rest is implementation detail or context-dependent weighting within the alethic framework. Pluralism reflects different legitimate ways to measure 'closeness to truth,' just as distance can be measured with Euclidean or Manhattan metrics. The core alethic demand—avoid dominated incoherence—is met."**

  This defense fails for three interconnected reasons:

  1.  **The "Purely Alethic" Claim is Overreaching:** Accuracy-first epistemology explicitly positioned itself as a *replacement* for pragmatic justifications, offering a foundation grounded *solely* in the intrinsic value of believing truly and disbelieving falsely. If the specific prescriptions for rational belief *formation* (updating), belief *intensity* (extremity), and the *relative severity* of different inaccuracies depend on the choice of a scoring rule—a choice seemingly underdetermined by alethic considerations alone—then the theory has not escaped pragmatics. The choice *between* strictly proper rules appears to hinge on *values* about acceptable risk (Brier vs. Log on extremes) or desired error-weighting—values external to pure truth-tracking. Calling these choices "different geometries of truth" is a metaphor masking a value judgment.
  2.  **Invariance Where it Matters Least, Variance Where it Matters Most:** Probabilism's invariance is impressive, but it's a minimal, structural constraint. The *action* of epistemology—how agents should actually *revise beliefs in light of evidence*, how *strongly* to hold beliefs, how to *learn from error*—happens in the space governed by the *specific* scoring rule. Accuracy-first promised alethic foundations for these crucial norms (like conditionalization and anti-dogmatism). If these norms are not invariant under different legitimate measures of accuracy, then accuracy alone cannot uniquely ground them. The theory delivers alethic foundations only for the skeleton (coherence), not the flesh and blood of rational belief dynamics.
  3.  **The Illusion of "Pure" Measurement:** The defense relies on an analogy: different scoring rules are like different rulers (Euclidean vs. Manhattan), neutrally measuring the same underlying property (distance/accuracy). But this is misleading. The choice of ruler in geometry doesn't change the fundamental properties of the space or what paths are shortest; it just calculates "length" differently. In accuracy-first epistemology, the choice of scoring rule *fundamentally changes the epistemic landscape*:
      *   It changes which credence functions dominate others in specific cases (beyond the mere fact that incoherent ones are dominated *somehow*).
      *   It changes the "shape" of the set of coherent credences (e.g., the induced geometry via the divergence associated with the score).
      *   Crucially, it changes the *prescriptions* for rational belief and updating *given the same evidence and prior beliefs*. The log-score user *must* conditionalize to minimize expected inaccuracy; the Brier-score user, facing the same inputs, could rationally choose a different update rule without sacrificing expected accuracy. If "pure truth-seeking" mandates different actions based on the chosen accuracy metric, then the mandate isn't purely from truth-seeking alone. The metric itself carries normative weight beyond pure alethicism.

  **The Verdict: Alethic Purity Compromised**

  The residual pluralism among strictly proper scoring rules is not a harmless quirk; it is a fatal concession. Accuracy-first epistemology successfully isolates *probabilistic coherence* as an alethic requirement invariant under any legitimate measure of accuracy. This is a significant achievement. However, its ambition was far greater: to ground the *entire* Bayesian framework—including the dynamics of belief revision and norms governing belief strength—purely on the alethic goal.

  This ambition fails. The dependence of crucial epistemic norms (updating, extremity) on the choice of scoring rule demonstrates that these norms cannot be derived from the pursuit of truth *alone*. The choice between Brier, log, spherical, etc., inevitably introduces considerations about the *cost structure of different types of inaccuracy*—considerations that are fundamentally pragmatic or value-laden. Should catastrophic error be infinitely costly (log)? Or is a quadratic penalty for large errors sufficient (Brier)? These are questions about acceptable epistemic risk, not purely about representing the world accurately.

  Therefore, **accuracy-first epistemology does not provide a *purely* alethic foundation for Bayesianism.** It provides a powerful *alethic-pragmatic hybrid* foundation. Probabilism stands as its alethic core, invariant and compelling. But beyond this core, the theory relies on supplementary values embedded in the choice of scoring rule to generate specific norms about belief updating and intensity. To claim otherwise is to mistake the elegant invariance of coherence for the sufficiency of alethic value to ground the full Bayesian edifice. The pluralism of legitimate scoring rules reveals the essential, irreducible role of pragmatic considerations in shaping rational belief beyond the bare minimum of non-domination.
