  For Hume, causation is about human psychology. When he says we never observe "necessary connection," he's describing how our minds work, not making claims about God or metaphysics. His famous "custom or habit" explanation is purely about the origin of ideas. The user correctly notes Hume's agnosticism—he leaves room for unobservable powers but stresses we can't know them. 

  Al-Ghazali is fundamentally different. His denial of natural causality serves God's absolute power. The fire doesn't burn cotton because of inherent properties; God creates each moment anew. Miracles like Abraham's unburned fire prove divine freedom over supposed "natures." This isn't skepticism—it's positive theology. 

  The user asks if they're overstating by calling this "metaphysical denial." Not at all! Al-Ghazali explicitly rejects secondary causality in the Incoherence. He doesn't just argue miracles are possible; he says natural causes are illusions masking God's direct action. 

  On Hume's side, the user is savvy to mention "New Hume" debates. Some scholars argue Hume secretly believed in real causal powers (skeptical realism), but his official position remains agnostic. The user's framing—"Hume denies we can know"—covers this neatly. 

  One refinement: Emphasize that for al-Ghazali, denying secondary causes isn't just about miracles; it's core to Ash‘arite occasionalism. God's constant re-creation of the world leaves no room for created agency. 

  For the paper, I'd suggest: 
