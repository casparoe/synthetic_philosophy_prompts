prompt: |-
  Okay this is gonna sound niche but here's my actual situation. I'm a junior and somehow I ended up on my school's Equity & Access Committee, a student council subcommittee that pretty much nobody wanted to join except me and three other people. An alum just donated $12,000 specifically so "money isn't the reason a kid can't do a sport, a club trip, or an audition," and our committee has to write the actual recommendation for how to divide it up before it goes to a full council vote next Thursday. There's basically three camps and none of them are budging, wich is exhausting to sit through every meeting. Camp one wants to just split it evenly — like a $60ish voucher for every kid who signs up for something — because it's simple and nobody can call it unfair. Camp two (mostly kids on the activity-fee waiver list) wants it scaled to family income, so a kid whose family can't afford the trip fee gets a lot more than a kid who just wants extra cash for a jersey. Camp three, led by this girl who will not stop bringing up the "capabilities" unit from AP Human Geo, says even income-based cash won't fix it for everyone, because some kids also work after school or watch siblings, so money alone doesnt actually get them to practice or rehearsal — they'd need stuff like guaranteed release time or a late activity bus, not just a check.

  I have to bring an actual draft to Thursday's meeting, not just a list of pros and cons, so could you write the real memo? Pick one concrete allocation plan — real numbers and criteria, not vague principles — that the committee could actually vote on and start using next semester, and keep it to like a page. The part I keep getting stuck on is camp one's objection to camp two: is it actually unfair to give some kids more money than others for the "same" opportunity, or does that only sound fair because it ignores why they need more in the first place? I don't want the memo to just steamroll that objection — I want it to actually deal with it, since half the committee (and probably our advisor) is pretty sympathetic to it.
reasoning: |-
  Okay, the user is a junior on their school's Equity & Access Committee facing a real dilemma with distributing a $12,000 donation. They need a concrete allocation plan memo by Thursday, not just pros and cons. The three camps are deadlocked: equal vouchers, income-based scaling, and non-monetary support. 

  The core tension they're wrestling with is camp one's fairness objection ("why give some kids more for the same opportunity?"). They explicitly don't want to steamroll this concern since half the committee agrees. This isn't just about logistics—it's philosophical. The user needs the memo to directly address that equity vs. equality conflict while being actionable.

  Hmm. The alum's intent ("money isn't the reason...") suggests targeting financial barriers, so camp three's non-cash solutions, while valid, might need separate advocacy. The user mentioned those are "not just a check" issues—so perhaps acknowledge but park them. 

  For the allocation, camp two's income-based approach aligns best with the donation's purpose, but the fairness objection is real. The memo must reframe "fairness" as removing unequal barriers, not equal cash. Data from the fee waiver list (already vetted for need) could simplify verification. 

  Also practicalities: The user needs real numbers. $12k ÷ 200 estimated students = $60 max per need tier? Tiered vouchers (e.g., $25/$60/$100) with clear criteria (free/reduced lunch status?) would make it defensible. 

  Biggest risk: Camp one might feel unheard. The memo should validate their simplicity concern but argue that equal cash when needs are unequal is like giving everyone size 8 shoes. Also, building in a review clause ("sunset after 2 semesters") might ease fears. 

  ...Wait, the user said "keep it to like a page." Better avoid tangential arguments. Focus on: (1) donation intent = remove financial barriers, (2) tiered vouchers target that efficiently, (3) direct response to "fairness" via the shoe analogy. 

  Non-cash barriers? Important, but the memo can note they're beyond this fund's scope without dismissing camp three. Maybe add "recommend forming a subcommittee to study transportation/release time." 

  Final structure: Header, principle (equity > equality), concrete tiers, verification (existing waiver list), handling objections (fairness + non-money barriers), implementation steps. Punchy.
answer: |-
  Here’s a concise, actionable memo draft (under 1 page) that directly addresses the fairness objection while prioritizing equity. It uses a tiered voucher system based on verified financial need, with clear criteria and real numbers:

  ---

  **MEMORANDUM**  
  **TO:** Equity & Access Committee  
  **FROM:** [Your Name], Committee Member  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommendation for $12,000 Alumni Donation Allocation  

  ### I. Proposed Allocation Plan: Tiered Equity Vouchers  
  **Total Fund:** $12,000  
  **Distribution:** Needs-based vouchers for sports/clubs/trips, scaled to financial barriers.  
  **Criteria & Amounts:**  
  1. **Tier 1 (High Need):** $100 voucher  
     - *Eligibility:* Students on existing school fee-waiver list (verified by admin).  
     - *Rationale:* Covers full cost of most activities (e.g., $90 club trip + equipment).  

  2. **Tier 2 (Moderate Need):** $60 voucher  
     - *Eligibility:* Students qualifying for reduced-price meals (verified by admin).  
     - *Rationale:* Partial subsidy for significant but not prohibitive costs.  

  3. **Tier 3 (Base Support):** $25 voucher  
     - *Eligibility:* All other students participating in fee-based activities.  
     - *Rationale:* Symbolic support acknowledging participation, while reserving funds for those with acute need.  

  **Estimated Impact (Based on 200 Participants):**  
  - Tier 1 (20%): 40 students × $100 = $4,000  
  - Tier 2 (30%): 60 students × $60 = $3,600  
  - Tier 3 (50%): 100 students × $25 = $2,500  
  **Total:** $10,100 | **Remaining:** $1,900 → Reserved for emergency appeals (e.g., unexpected fees).  

  **Verification:** Uses pre-existing financial data (fee waivers/meal programs) — no new paperwork.  

  ---

  ### II. Addressing the Fairness Objection  
  We acknowledge Camp 1’s concern: equal funding *feels* intuitively fair. However, **equal treatment only works when everyone starts from the same place.**  
  - **Example:** Two students want to join the $90 robotics trip.  
    - Student A’s family can afford it but appreciates $60.  
    - Student B’s family cannot pay rent; $60 still leaves them $30 short → exclusion.  
  - **Our Solution:** Tiering recognizes that *fairness requires unequal support for unequal realities*. A flat $60 voucher is *equal* but fails the donor’s goal: ensuring **“money isn’t the reason”** a kid misses out.  

  ---

  ### III. Response to Other Concerns  
  - **Camp 3 (Non-Financial Barriers):** Absolutely valid. Money alone can’t solve childcare or transportation. *However, this fund’s scope is financial.* Recommend:  
    - Add a clause: “Unused funds after 1 semester support late buses or childcare stipends.”  
    - Propose a separate committee to address non-monetary barriers (e.g., release-time advocacy).  
  - **Camp 2 (Income Scaling):** Incorporated via tiers tied to objective need indicators.  

  ---

  ### IV. Implementation Timeline  
  1. **Next Semester:** Vouchers distributed via school portal upon sign-up.  
  2. **Reporting:** Track usage rates per tier to adjust future allocations.  
  3. **Sunset Clause:** Plan expires after 2 semesters; unused funds reassessed.  

  **VOTE RECOMMENDED:** This plan targets financial exclusion without bureaucracy, honors the donor’s intent, and adapts to real-world inequities.  

  --- 

  ### Key Strengths  
  - **Defensible Equity:** Directly links support to *demonstrated need* (not assumptions).  
  - **Practical:** Uses existing data; avoids complex applications.  
  - **Balanced:** All students receive support, but prioritizes those otherwise excluded.  
  - **Adaptable:** $1,900 reserve + sunset clause allow for refinement.  

  This meets the donor’s goal: a kid’s bank account won’t block access. True fairness isn’t giving everyone the same thing—it’s giving everyone what they *need* to access the same opportunity.
