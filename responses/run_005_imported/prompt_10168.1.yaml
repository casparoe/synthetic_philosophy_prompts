prompt: |-
  I'm teaching a graduate seminar this term on practical reason, and this week's session sets Bernard Williams's "Internal and External Reasons" alongside Book 2 of Hume's Treatise of Human Nature, on the standard assumption that Williams's internalism — an agent has a reason to act only if there is a "sound deliberative route" from that agent's existing "subjective motivational set" to the action — is essentially a descendant of Hume's claim that reason alone cannot move the will. While drafting my lecture notes I reread the relevant stretch of the Treatise more slowly than usual, and I've argued myself into a difficulty about it that I'd rather sort out with you than discover live in front of twelve second-year students.

  Here is the passage (Treatise 2.3.3.4, 6–7; I've cut one clause for length, marked with [...]):

  "Reason is, and ought only to be the slave of the passions, and can never pretend to any other office than to serve and obey them.

  "What may at first occur on this head, is, that as nothing can be contrary to truth or reason, except what has a reference to it, and as the judgments of our understanding only have this reference, it must follow, that passions can be contrary to reason only so far as they are accompany'd with some judgment or opinion. According to this principle, which is so obvious and natural, 'tis only in two senses, that any affection can be call'd unreasonable. First, When a passion, such as hope or fear, grief or joy, despair or security, is founded on the supposition of the existence of objects, which really do not exist. Secondly, When in exerting any passion in action, we chuse means insufficient for the design'd end, and deceive ourselves in our judgment of causes and effects. Where a passion is neither founded on false suppositions, nor chuses means insufficient for the end, the understanding can neither justify nor condemn it. [...] In short, a passion must be accompany'd with some false judgment, in order to its being unreasonable; and even then 'tis not the passion, properly speaking, which is unreasonable, but the judgment.

  "The consequences are evident. Since a passion can never, in any sense, be call'd unreasonable, but when founded on a false supposition, or when it chuses means insufficient for the design'd end, 'tis impossible, that reason and passion can ever oppose each other, or dispute for the government of the will and actions. The moment we perceive the falshood of any supposition, or the insufficiency of any means our passions yield to our reason without any opposition. I may desire any fruit as of an excellent relish; but whenever you convince me of my mistake, my longing ceases."

  My difficulty is this. A few lines before this passage, Hume's stated thesis is unconditional: reason "can never oppose passion in the direction of the will." Yet what he goes on to describe looks like exactly that kind of opposition — a passion that would otherwise have issued in action is extinguished once the understanding corrects the belief it depended on, and the fruit example reads like reason redirecting the will, not like a passion that remains fully in command while reason merely ministers to it. So I'd like your help with two connected points. First, is there a way of construing "yield to our reason without any opposition" that preserves the letter of the slave thesis — reason having, in itself, no power to alter what we want or do — or does the passage in fact concede real, if narrowly circumscribed, motivational efficacy to reason, contrary to Hume's own announced conclusion? Second, whichever reading you favor, what should we make of the fact that Williams's internalism relies on this same manoeuvre — an internal reason claim can be defeated or revised by correcting the agent's factual or instrumental beliefs, without appeal to any external reason — to answer the standard complaint that internalism can't make sense of an agent having reason to revise a deeply mistaken end? Does Hume's example show that this belief-correcting move was internalist-respectable all along, or does it show that the move smuggles in more than a strict internalist is entitled to?
reasoning: |-
  Okay, let me unpack this user's query. They're teaching a graduate seminar on practical reason, specifically comparing Williams' internalism with Hume's Treatise. The user has hit a snag while preparing their lecture notes. They've noticed a tension in Hume's argument where he claims reason can't oppose passion, yet describes passion yielding to reason when beliefs are corrected. 

  First, I need to parse Hume's slave metaphor carefully. The user quotes the key passage where Hume says passions become "unreasonable" only when tied to false judgments. The fruit example seems problematic - the longing ceases when the mistake is corrected. But Hume insists this doesn't count as reason opposing passion. How?

  I recall Hume's psychology: beliefs themselves aren't motivational. When you realize the fruit isn't delicious, you're not being motivated by reason against desire. Instead, the desire simply vanishes because its foundation (the belief about deliciousness) is gone. The motivational force was always passion-dependent. 

  This connects to Williams' internalism. Both use belief-correction to handle mistaken ends without external reasons. The user wonders if this move is legitimate or smuggles in externalism. For Hume and Williams, correcting beliefs is just adjusting the factual basis within the existing motivational set - no new motivations enter. 

  The user's deeper concern seems to be about preserving internalist consistency. If reason can defeat desires by correcting beliefs, doesn't that give reason motivational power? But Hume would say no - the defeat happens because the passion was contingently tied to a belief, not because reason has independent authority. 

  For teaching, I should emphasize this psychological mechanism. The passion doesn't get overruled; it self-destructs when its cognitive scaffold collapses. Williams borrows this exactly - his "sound deliberative route" includes belief-correction precisely because it works within S. 

  The tricky part is explaining why this isn't reason gaining control. The key is that reason's role remains instrumental - it only processes information that then affects passions causally, not normatively. The will follows the strongest present passion, which may change when beliefs do. 

  In seminar, I'd highlight how both thinkers use this to avoid external reasons while accounting for rational criticism. The challenge is showing students this doesn't concede ground to externalism - it just exploits the fact that many passions are belief-dependent.
answer: |-
  You've pinpointed a crucial tension in Hume's text – one that reveals the nuanced mechanics of his psychology and directly impacts the comparison with Williams. Let's break this down:

  **1. Hume's "Yielding" and the Slave Thesis: Reconciling the Tension**

  Hume *is* consistent, but his consistency relies on his specific understanding of "passion," "reason," and the *mechanism* by which passions change. Here's the reading that preserves the "slave" thesis:

  *   **Passions are Belief-Dependent:** Hume isn't claiming passions are *wholly* independent entities. Many passions are *causally dependent* on beliefs (judgments of existence or cause/effect). Hope requires belief in a possible good; fear requires belief in a possible evil; desire for the fruit requires belief in its deliciousness.
  *   **Reason Corrects *Beliefs*, Not Passions Directly:** Reason's role is *exclusively* to assess truth/falsehood of ideas and relations of ideas (matters of fact and relations of ideas). When it "opposes" a passion, it does so *indirectly* by attacking the *belief* upon which that passion causally depends.
  *   **Passion "Yields" Because Its Foundation is Destroyed:** The passion doesn't "fight" reason and lose. Instead, the passion *ceases to exist* or *significantly weakens* because the cognitive condition necessary for its existence/strength has been removed. My desire for the fruit isn't *overpowered* by reason; it *vanishes* when the belief sustaining it ("this fruit is delicious") is destroyed by the true belief ("this fruit is not delicious").
  *   **Motivational Efficacy Remains with Passion:** Crucially, the *motivational force* at any given moment still resides *entirely* with the passions present. Reason has no motivational "oomph." When the desire for the fruit vanishes, it's not replaced by a "reason-based motivation" *not* to eat it (unless another *passion* like aversion to rotten fruit or a desire for health kicks in). The motivational landscape simply changes because one passion has been extinguished by a change in belief. The will is still governed by the strongest *present* passion(s).
  *   **"Without any opposition":** This phrase is key. Hume means there is no *struggle* between reason *as a motivator* and passion *as a motivator*. Reason doesn't *push* against the passion; it *undermines* the passion's very existence by removing its cognitive fuel. The passion doesn't resist; it just fizzles out.

  **Conclusion on Hume:** The passage **does not concede independent motivational efficacy to reason.** Reason remains the slave: it serves by providing accurate information (correcting beliefs) about the objects of passions and the means to satisfy them. This service *causally influences* which passions exist and how strong they are, but the *motivational force* itself always resides in the passions. The will is still moved only by passion. The "yielding" is the passive consequence of a passion losing its cognitive foundation, not an active defeat by a rival motivational force called "reason."

  **2. Williams, Hume, and the Belief-Correction Move**

  This is where the connection becomes fascinating and reveals the core strength (and potential vulnerability) of internalism:

  *   **Hume's Move as Foundational for Internalism:** Hume's mechanism is **precisely the move Williams relies on.** Williams explicitly incorporates the correction of the agent's "factual and instrumental beliefs" as part of the "sound deliberative route" starting from the agent's existing S (subjective motivational set). When Williams says an agent might have a reason to revise an end *if* sound deliberation from their S (including corrected beliefs) would lead them to abandon it, he is directly channeling Hume's fruit example. Correcting the false belief about the fruit's deliciousness *is* sound deliberation revealing the agent had no reason to pursue *that specific fruit* (given their desire for delicious fruit).
  *   **Respectable All Along?** Absolutely. Hume demonstrates that this move **is internalist-respectable.** It operates entirely *within* the agent's existing motivational economy. It doesn't appeal to external normative facts or "objective" reasons that the agent has no current motivation to heed. It shows how rational criticism of ends can emerge *immanently* by scrutinizing the factual or instrumental assumptions those ends depend upon, relative to other elements in S. Williams formalizes and refines this Humean insight.
  *   **Smuggling in Externalism? Does the Move Go Too Far?** This is the critical question raised by your observation. Does belief-correction *only* adjust means or the specification of objects, or can it genuinely lead to revising *fundamental* ends? Hume and Williams believe it can (e.g., realizing one's life project is based on a profound illusion might lead to its abandonment via this mechanism). Critics argue:
      *   **The Scope of "Belief":** Is the judgment "X is valuable/desirable" purely a "belief" (matter of fact) that reason can correct? Or is it an expression of a conative state? If it's the latter, correcting it might *look* like belief-correction but is actually altering a core element of S, which strict internalism might struggle to justify *as rational criticism* if the agent lacks a prior motivation to have correct value beliefs. Hume might see "X is desirable" as shorthand for "I desire X," which isn't truth-apt.
      *   **The Regress Problem:** What motivates the *desire* for true beliefs? Hume needs a "calm passion" for truth or aversion to error *within* S to explain why we engage in belief-correction at all. Williams needs some element in S (e.g., curiosity, desire for efficacy, aversion to frustration) that makes factual/instrumental accuracy relevant to the agent. If such motivations are absent, belief-correction loses its internal leverage. This is the point where the move *might* seem to smuggle in the idea that everyone *just has* a reason to have true beliefs, regardless of S.
      *   **Radical Revision:** Can this move genuinely generate reasons for entirely *new* ends, not just abandon old ones based on falsehood? Williams thinks it can lead to new motivations emerging from the deliberative process *based on* existing S elements (e.g., consistency, imagination). Critics argue this stretches "sound deliberative route" beyond merely correcting beliefs about existing motivations.

  **Conclusion on Williams/Hume Comparison:** Hume's passage **shows the belief-correcting move is foundational to internalism and was powerfully articulated by him.** It **is** internalist-respectable because it works immanently within S. However, it also **highlights the precise pressure point** where critics challenge internalism: the potential ambiguity between "correcting a factual belief" and "challenging a conative evaluation," and the reliance on S containing motivations that make truth-seeking instrumentally relevant. Williams embraces this move explicitly and builds his internalism around it, arguing it *is* sufficient for robust rational criticism without externalism. His success depends on convincingly arguing that belief-correction, combined with other deliberative processes (e.g., vivid imagination, consistency), genuinely operates within the constraints of S and can lead to significant rational revision.

  **Teaching Recommendation:**

  *   Frame the Hume passage *as* the discovery of the core internalist move. Highlight the mechanism: passion dependent on belief -> reason corrects belief -> passion weakens/vanishes -> will governed by *remaining* passions. Emphasize "yields without opposition" as meaning the passion *ceases*, not that it's overpowered by reason's force.
  *   Explicitly connect this to Williams' "sound deliberative route" including belief-correction. Note that Williams makes this move explicit and central to his defense against the "mistaken ends" objection.
  *   Acknowledge the tension the user felt: Hume's rhetoric ("slave," "never oppose") seems absolute, but the mechanism described *looks* like reason influencing motivation. Resolve it by stressing the *indirect, causal* role of belief-correction vs. the *direct, motivational* inertness of reason.
  *   Pose the critical question to students: **Is Hume/Williams' belief-correction move sufficient for *all* rational criticism of ends while remaining truly internalist, or does it (a) rely on unacknowledged elements in S (like a universal desire for truth), or (b) covertly introduce external standards when dealing with deep evaluations?** This gets to the heart of the internalism/externalism debate and the legacy of Hume's psychology in contemporary metaethics.

  This approach honors the text, resolves the apparent contradiction in Hume, clarifies the link to Williams, and sets up a rich discussion on the core mechanism and its potential limits. Good luck with the seminar!
