  Evaluation: Theo is correct in pointing out the core requirement of the handicap principle: the cost must be differential. If the cost is the same regardless of the underlying quality (here, commitment or certainty), then it doesn't serve as an honest signal. This move correctly identifies a flaw in Sasha's initial argument.

