  On Elga's immodesty move: the user's skepticism is understandable. If conciliationism gets to exempt itself from conciliation, why can't a religious believer exempt core doctrines? But perhaps there's a difference between methodological starting points (how we revise beliefs) and substantive ones (what we believe). Still, the line feels blurry. 

