answer: |-
  ## Epistemics Committee Decision Memo: Project Orion Market Activity & Advocate Trading Policy  

  **Date:** October 26, 2023  
  **To:** Epistemics Committee Members  
  **From:** Epistemics Committee Chair  
  **Subject:** Resolution on Project Orion Market Activity & Policy Recommendation for Advocate-Heavy Trades  

  ### I. Dispute Summary
  Elena (Project Orion’s champion) proposes taking a large play-money position to elevate the contract’s "yes" price significantly above its current level. The committee is divided:  
  - **Position A (System Working):** Elena’s trade is the intended mechanism for incorporating superior information. Restricting it undermines the market’s efficiency.  
  - **Position B (No-Trade Problem):** Common knowledge of Elena’s expertise *and* advocacy creates rational reluctance to oppose her, distorting price discovery into a reflection of her bias, not aggregated consensus.  

  ### II. Committee Decision
  **Elena is permitted to trade on the Project Orion market**, but **position limits** will be imposed immediately to mitigate no-trade dynamics. A new policy (Section III) will govern future advocate-heavy trades.  

  ### III. Recommended Policy: Advocate Position Limits  
  **Rule:** Project advocates (defined as staff leading or championing a project) may hold no more than **25% of total outstanding contracts** in their project’s prediction market. This cap applies once the market reaches its minimum volume threshold.  

  **Reasoning:**  
  1. **Balances Information & Integrity:** Advocates possess valuable information but also irreducible bias. Position limits allow their knowledge to influence prices *without* enabling dominance that deters counter-trading.  
  2. **Mitigates No-Trade Dynamics:** Capping an advocate’s share creates "space" for skeptical traders to participate rationally, knowing the advocate cannot unilaterally dictate prices. This encourages genuine consensus-building.  
  3. **Practicality:** Simple to implement, monitor, and enforce (via our existing trading platform). Avoids complex liquidity subsidies or disclosure rules that add administrative burden.  
  4. **Preserves Market Function:** Unlike a full ban, this permits advocates to "put their money where their mouth is," maintaining incentives for information revelation.  

  **Strongest Argument Against Position Limits:**  
  *Critique: "Limits prevent the market from fully incorporating the advocate’s superior information. If Elena is truly 90% confident Orion will succeed, but the market is at 50%, a 25% cap forces the price to settle at an artificially low level (e.g., 65%), misrepresenting the best available evidence and leading to suboptimal funding decisions."*  

  **Rebuttal:**  
  This critique rightly emphasizes information loss but overestimates the advocate’s objectivity and underestimates market dynamics:  
  - A 25% cap still allows significant price impact (e.g., moving a 50% price to 65% as above) while preventing extreme distortions.  
  - If Elena’s information is truly compelling, her capped position should *attract* (not deter) outside traders seeking to profit from her insight, further adjusting the price toward accuracy.  
  - The alternative—unlimited advocate positions—risks *greater* information loss by suppressing all counter-opinions, making the price a poor signal. A partially constrained but active market is superior to one dominated by a single motivated actor.  

  ### IV. Implementation for Project Orion  
  - Elena may trade up to **25% of the current outstanding contracts** in the Orion market.  
  - The Committee will monitor volume and price impact, ensuring the threshold remains viable.  
  - Post-trade, the Committee will solicit anonymous feedback on perceived market credibility.  

  ### V. Review  
  This policy takes effect immediately. We will revisit its efficacy after 3 markets with advocate participation, assessing:  
  - Price volatility before/after advocate entry.  
  - Volume from non-advocate traders.  
  - Qualitative feedback on market trustworthiness.  

  *Approved by Epistemics Committee Vote: 5–2*  
  *Signed: [Chair Name], Epistemics Committee Chair*  

  ---

  **Key Design Choices Explained:**  
  - **25% Cap:** High enough to signal conviction, low enough to prevent unilateral control. Adjustable based on evidence.  
  - **No Disclosure Mandate:** While transparency has merits, disclosing Elena’s trades *ex-post* doesn’t solve the no-trade dilemma *ex-ante*. Position limits address the structural incentive problem directly.  
  - **Rejecting Subsidized Market Makers:** Artificially injecting liquidity masks the no-trade problem without solving it and risks taxpayer funds in real-world futarchy.  
  - **Permitting (Capped) Participation:** A ban would discard valuable information; caps balance insight with integrity.  

  This memo resolves the immediate dispute while instituting a testable safeguard against advocacy distortion—upholding the market’s role as a knowledge-aggregation tool, not an advocate amplifier.
