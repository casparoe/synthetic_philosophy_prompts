  For example: If Group A defaults 10% and Group B 5%, a calibrated score might assign Group B applicants lower risk scores on average. But if they use the same cutoff for both, Group A gets disproportionately rejected (more false negatives). If they use different cutoffs to equalize approvals, Group B might get riskier loans (more false positives). 

