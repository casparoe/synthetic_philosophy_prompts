prompt: |-
  So the board of our little community credit union is putting together a simple risk score to help decide who gets approved for small personal loans, and I really don't want us to mess this up. I read that theres an actual proven impossibility result for scores like this — you can't have a score thats calibrated within each demographic group AND has matching false-positive/false-negative rates across groups, unless those groups already happen to have the same default rates to begin with, and apparently no amount of better data or fancier modeling makes that tradeoff go away. Can you walk me through the most important implications of this for how a small operation like ours should actually think about building and using something like this?
