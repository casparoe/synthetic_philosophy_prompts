  ## MEMORANDUM  
  TO: Student Judicial Board Members  
  FROM: [Your Name], Board Member  
  DATE: October 26, 2023  
  SUBJECT: Recommended Sanction & Framework for Case #SJB-2310-07 (Admin Building Occupation Protest)  

  **I. Case Background & Charge**  
  Fifteen students occupied the main lobby of the Admin Building for approximately 36 hours, protesting delayed fossil fuel divestment. While no violence or property damage occurred, they blocked primary access points, impeding staff and visitors, and refused directives from campus police to disperse. Charges are filed under:  
  *   **Section 4.07:** Substantial Disruption of University Operations  
  *   **Section 3.12:** Failure to Comply with Lawful Directive  

  Standard sanctions for comparable violations typically range from disciplinary probation to one-semester suspension.  

  **II. Core Issue & Board Division**  
  The central dispute concerns whether this act constitutes justified civil disobedience warranting significant mitigation or dismissal of sanctions. Key arguments presented:  
  *   **Protesters:** Argue their actions meet philosophical criteria for civil disobedience (Rawls, King, Thoreau), constituting protected political speech and serving a vital public good, thus negating culpability.  
  *   **Strict Enforcement View:** Argues motive is irrelevant; clear violation of conduct code requires standard sanction to maintain institutional integrity and deter future disruptions.  
  *   **Political Speech View:** Argues the political nature of the protest places it beyond the code's reach, advocating for dismissal of charges.  

  **III. Analysis: Civil Disobedience in the University Context**  
  The protesters’ invocation of Rawls and King is significant but requires careful application to our unique setting:  

  1.  **The Applicability of "Civil Disobedience" Frameworks:**  
      *   Rawls’s theory assumes actors within a "nearly just" *state* bound by a *natural duty of justice*. Our context differs: students enter a *voluntary association* governed by a *contractual code of conduct*. Obligations here stem primarily from **associative obligations** and **fair-play principles** – students benefit from the university community and its rules, thus incurring an obligation to follow them, even imperfect ones.  
      *   **Implication:** While the *motivation* for protest (climate justice) may be compelling, the *act of rule-breaking* within this voluntary association still constitutes a violation requiring accountability. The university is not a sovereign state; its code functions as a compact for communal functioning.

  2.  **Acceptance of Penalty as Integral to "Civility":**  
      *   Both Rawls and King explicitly frame **willingness to accept the legal (or institutional) consequences** as a core element distinguishing "civil" disobedience from mere lawbreaking or evasion. King (Birmingham Jail) states disobedience must "accept the penalty... to arouse the conscience of the community." Rawls emphasizes it demonstrates fidelity to the *overall* just system.  
      *   **Implication:** Arguing for *complete dismissal of sanctions* fundamentally contradicts the philosophical basis the protesters invoke. True civil disobedience, as defined by their cited authorities, *presupposes* and *respects* the authority's right to impose penalties, using that acceptance to underscore the moral urgency of their cause. Mitigation is consistent with this; dismissal is not.

  3.  **Balancing Values: Order, Expression, and Institutional Mission:**  
      *   The university must uphold operational integrity and safety (Order), protect space for dissent and moral action (Expression), and fulfill its educational mission.  
      *   A sanction that ignores the disruptive violation undermines Order and the code's legitimacy. A sanction that ignores the protest's principled motivation and public-good aim stifles Expression and misses an educational opportunity.  
      *   **The Educational Imperative:** Sanctions should aim not merely at punishment, but at fostering understanding of the balance between individual conscience, communal obligation, and the costs/impacts of protest tactics.

  **IV. Recommended Sanction: Disciplinary Probation with Educational Component**  
  Based on the above analysis, I recommend:  

  *   **Sanction:** **Disciplinary Probation** for the remainder of the current academic year for all 15 students.  
  *   **Educational Component:** Completion of a **university-approved workshop or facilitated dialogue** (e.g., 4-6 hours) exploring:  
      *   The history, theory, and practice of civil disobedience (including Rawls, King, critiques).  
      *   University governance structures and channels for change.  
      *   The impact of protest tactics (including disruption) on different campus stakeholders.  
      *   Balancing individual conscience with communal responsibilities within a voluntary association.  
  *   **Mitigation Rationale:**  
      *   **Acknowledges Validity of Motivation:** The cause (climate action) and the principled nature of the protest (non-violence, stated purpose) are recognized as significant mitigating factors, reducing the sanction severity below the standard range.  
      *   **Upholds Code Integrity:** Probation affirms that the disruptive actions and refusal to comply constituted violations requiring institutional response.  
      *   **Embeds Acceptance of Consequence:** This sanction embodies the principle that accepting a penalty is part of responsible civil disobedience, aligning with the protesters' own cited philosophy.  
      *   **Serves Educational Mission:** The workshop transforms the sanction into a constructive learning experience, fostering deeper understanding for both the protesters and the broader community.  
      *   **Proportionality:** Probation reflects the non-violent nature and lack of damage, while acknowledging the significant disruption caused over 36 hours.  

  **V. Addressing the Strongest Counterargument: "A Rule is a Rule"**  
  *   **The Argument:** The strictest enforcement view holds that violating clear conduct rules, regardless of motive, necessitates the standard sanction (likely suspension) to ensure consistent application, deter future violations, and maintain order. Granting mitigation for "political" reasons creates a slippery slope, incentivizing disruption under any "righteous" banner and eroding the code's authority.  
  *   **Engagement & Rebuttal:**  
      *   This view correctly emphasizes the necessity of rule consistency and institutional integrity. Ignoring violations *is* corrosive.  
      *   However, it fails to account for the university's unique role as an *educational* community, not merely a disciplinary body. Our purpose includes fostering moral reasoning and engaged citizenship.  
      *   Blind adherence to "rule is rule" ignores context and proportionality – core principles of just governance. Mitigation based on *principled motivation*, *non-violence*, *public good aim*, and *acceptance of consequence* (as demonstrated by accepting a reduced sanction) is not arbitrary; it applies reasoned criteria (outlined below) that *strengthen* the legitimacy of the code by demonstrating it can thoughtfully accommodate complex moral action.  
      *   Deterrence is served by *any* sanction on record (probation) and the educational component; suspension for non-violent protest is often disproportionate and counter-educative, potentially deepening alienation rather than fostering responsibility.  

  **VI. Criteria for Evaluating Civil Disobedience Claims in Future Cases**  
  To ensure consistent, principled application, future boards should weigh these factors when considering mitigation for claimed civil disobedience:  

  1.  **Principled Motivation:** Was the violation driven by a sincerely held moral or political conviction aimed at correcting a perceived significant injustice or advancing a public good? (Mere preference or convenience doesn't qualify).  
  2.  **Non-Violence & Non-Destruction:** Was the action strictly non-violent towards persons and property? (Essential for "civility").  
  3.  **Target & Proportionality:** Was the disruption targeted at the policy/issue protested? Was the level of disruption proportionate to the gravity of the grievance and the unresponsiveness of other channels?  
  4.  **Publicity & Appeal:** Was the action public and designed to persuade the university community/administration, not merely obstruct or coerce?  
  5.  **Willingness to Accept Penalty:** Did the protesters demonstrate an understanding and acceptance that their actions violated university rules and that they are subject to sanction? (Argued *for* mitigation, not *against* accountability).  
  6.  **Exhaustion (Relative):** Were reasonable, non-disruptive avenues for redress attempted or demonstrably futile? (Not an absolute bar, but weighs on proportionality).  

  **Mitigation is warranted when factors 1-5 are strongly present, and 6 supports the necessity of the action. Dismissal is inconsistent with factor 5. The *degree* of mitigation should reflect the overall balance, especially proportionality (3) and the level of disruption caused.**

  **VII. Conclusion**  
  This protest involved a sincere, non-violent act of conscience on a matter of significant public concern, warranting mitigation. However, within the context of our voluntary association governed by a conduct code, and guided by the very philosophers cited by the protesters, dismissal of sanctions is inappropriate. **Disciplinary Probation with a mandatory Educational Component** appropriately balances the values of free expression and moral action with the necessity of institutional order, accountability, and our educational mission. It provides a framework for consistent, principled evaluation of future cases. I move that the Board adopt this recommended sanction.
