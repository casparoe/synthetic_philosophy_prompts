  (2) Priya nails the logical implication (+2) - Alex's premise does indeed threaten to collapse all moral responsibility if taken strictly. 
  (3) Alex gets points for consistency (+1) in adopting hard compatibilism, but loses points for ignoring phenomenology of moral experience. 
  (4) Priya's strongest point (+2) - her observation about the inescapable lived reality of resentment and relationship norms exposes the practical impossibility of Alex's position.

  The underlying tension is between theoretical consistency (Alex) and lived moral experience (Priya). Neither fully resolves the determinism vs. moral responsibility dilemma, but Priya better captures why we maintain blame/praise practices beyond mere utility. The user's seminar context makes this especially resonant - this is essentially Strawson vs. Dennett playing out over dirty dishes.
