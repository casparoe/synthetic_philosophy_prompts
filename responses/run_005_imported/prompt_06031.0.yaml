answer: |-
  Your brother-in-law's argument is clever and biologically grounded, but it conflates evolutionary history with clinical medicine's definition of "disorder." Here's a principled basis for why his gastroenterologist's usage is defensible:

  ### 1. **The "Harmful Dysfunction" Criterion (Wakefield's Framework)**  
     The most robust philosophical defense of the disorder label hinges on **dysfunction + harm**:  
     - **Dysfunction**: A failure of a biologically designed mechanism.  
     - **Harm**: A value-based judgment that the dysfunction causes detriment to well-being.  
     
     Lactose intolerance qualifies under this framework:  
     - **Dysfunction**: The lactase enzyme's *expected function* in digestion fails post-weaning. That mammals *typically* lose lactase doesn't negate that *in humans consuming dairy*, this loss impairs a physiological process.  
     - **Harm**: Symptoms (bloating, pain, diarrhea) cause distress, restrict diet, and may lead to nutrient deficiencies. This meets clinical harm criteria.  

  ### 2. **Evolutionary Default ≠ Clinical Normativity**  
     - While lactase non-persistence is ancestral, medicine doesn't define disorders solely by evolutionary history. *Tonsils* are ancestral but can become disordered when infected (tonsillitis). *Sickle-cell trait* is evolutionarily adaptive in malaria zones but causes a disorder (sickle-cell disease) in homozygous individuals.  
     - **Context matters**: In dairy-consuming societies, lactase non-persistence *is* dysfunctional relative to environmental demands. What’s "species-typical" is irrelevant if the environment requires lactase persistence for normal functioning.  

  ### 3. **Statistical Rarity vs. Functional Impairment**  
     - Medicine doesn't define disorders by statistical frequency alone. Left-handedness (∼10% of people) isn’t a disorder, while narcolepsy (0.02%) is.  
     - The key is **functional impairment within a context**. For a lactose-intolerant person in a dairy-centric culture, the inability to digest lactose restricts normal activities (e.g., eating common foods), justifying the "disorder" label.  

  ### 4. **The Medical Pragmatism Argument**  
     - Medicine prioritizes **alleviating suffering**. Labeling lactose intolerance a "disorder":  
       - Validates patient symptoms.  
       - Justifies insurance coverage for lactase supplements.  
       - Guides dietary interventions.  
     Rejecting the term risks dismissing legitimate health concerns because they’re "natural."  

  ### The Flaw in Your Brother-in-Law's Argument  
  He commits a **genetic fallacy**: Assuming that because lactase non-persistence is evolutionarily older, it is inherently "normal" or "non-disordered." But medicine evaluates function *in present environments*. His view also ignores the **harm** component—without distress, lactase non-persistence wouldn’t be a disorder.  

  ### Is This Just Verbal?  
  Partly, but not trivially. The deeper issue is **whether medicine should prioritize biological design or current well-being**. The gastroenterologist’s usage reflects medicine’s mission: to identify and treat conditions that cause harm, regardless of their evolutionary status.  

  ### Conclusion  
  Your brother-in-law is correct that lactase persistence is a derived trait, but wrong to claim this invalidates "disorder." The gastroenterologist’s usage is defensible because:  
  - Lactose intolerance involves a **failure of digestive function** in dairy-consumers.  
  - It causes **objective harm** (symptoms, dietary restrictions).  
  - Medicine rightly prioritizes **contextual function** over ancestral biology.  

  This isn’t *mere* value-smuggling—it’s applying a consistent clinical framework (harmful dysfunction) to improve well-being. The "disorder" label isn’t parochial; it’s pragmatic and patient-centered.  

  *Source References*:  
  - Wakefield, J. (1992). *The Concept of Mental Disorder*.  
  - Boorse, C. (1977). *Health as a Theoretical Concept*.  
  - Ebert, L. (2021). *Evolutionary Medicine and the Concept of Disorder*.
