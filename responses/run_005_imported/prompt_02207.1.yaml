  Move (1): Ines
  - Ines says that the loophole-free Bell tests rule out the conjunction of locality, realism, and no-conspiracy. Therefore, one can drop any one of them, not necessarily locality.
  - This is correct. Bell's theorem shows that any local hidden variable theory must satisfy the inequality. Violation in a loophole-free experiment implies that at least one of the assumptions (locality, realism, no-conspiracy) must be false. So, one can drop realism or no-conspiracy (which leads to superdeterminism) instead of locality.
