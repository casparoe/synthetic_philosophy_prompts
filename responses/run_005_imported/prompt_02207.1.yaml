  - Theo responds that even among Everettians, there is a dispute about whether the branching is local. He says that Ines has relocated the argument, not won it.
  - This is true. There is ongoing debate about whether Everettian quantum mechanics is truly local. Some argue that the branching is nonlocal because it happens simultaneously across space, while others (like David Wallace) argue that the dynamics are local and the nonlocality is only apparent. So Theo is correct that the issue is not settled even within Everett.
  - Score: 1 (mostly right, but note that the debate is complex and not settled against locality) - he is right that the argument has been relocated and that it's contested.

