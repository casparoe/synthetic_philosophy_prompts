answer: |-
  Here’s a dialogue between **Alex** (Scanlonian) and **Ben** (Humean conventionalist), two grad students hashing this out after a seminar. I’ve focused on pressure points, counter-moves, and the meta-question you requested:

  ---

  **Setting:**  
  *Campus coffee shop, stacks of Scanlon and Hume texts littering the table. Alex stirs their coffee aggressively; Ben leans back, skeptical.*

  **Ben:** (Sighs) Look, I get why Scanlon’s Principle F *feels* intuitive—breaking promises is bad because you’re manipulating someone’s trust. But it’s just dressing up a social habit as deep morality. Hume was right: promises are tools, like handshakes. No society, no obligation.  

  **Alex:** Then explain the **deathbed promise on a deserted island**. Imagine it’s just you and a dying stranger. They make you swear to deliver their last letter to their child. You say, "I promise." Then they die. No society, no reputational fallout, no "practice" in play. Isn’t it still wrong to toss that letter into the ocean?  

  **Ben:** (Leans forward) Fine, but that "obligation" isn’t *sui generis*. It’s parasitic on the *real-world practice* of promising. You only feel bound because you’ve internalized the convention. If you’d grown up alone on that island, "I promise" would be gibberish. The feeling tracks the ghost of society, not a freestanding moral fact.  

  **Alex:** But Principle F explains it without ghosts! You deliberately led them to form an expectation ("She’ll deliver the letter because I can trust her promise"), and breaking it exploits their vulnerability. The wrong is in the *act*, not the practice.  

  **Ben:** Oh, really? Then why do we need "promising" at all? **Principle F makes the whole practice redundant.** If the obligation kicks in anytime I intentionally create an expectation, why not just say, "Hey, I’ll definitely do X," *without* promising? If I tell my friend, "I’ll pick you up at 8," and they rely on it, isn’t flaking just as wrong by your lights? Why invent this ritual of "promising"?  

  **Alex:** (Pauses) Because promising *intensifies* the obligation. It’s a clear, deliberate signal: "I’m not just predicting I’ll do this; I’m *binding myself* to you." It frames the expectation as a claim you can hold me to. Principle F explains *why* that’s binding: you’re inviting trust under specific terms.  

  **Ben:** But that "intensification" is exactly the convention! You’re describing a *social move*. Scanlon smuggles in the practice he claims to bypass. If Principle F works without promising, why do we have courts that enforce *contracts* (promises-plus-consequences) but not every casual assurance? Face it: your "moral fact" collapses into my convention when pressed.  

  **Alex:** No—Principle F sets a *baseline* norm against wrongful manipulation of trust. Promising is a special case where we *explicitly activate* that norm. The practice isn’t redundant; it’s a tool for clarity. But the *wrong* comes from the exploitation, not the tool.  

  **Ben:** Then why does the "wrong" vary by context? Break a pinky-swear promise to a kid vs. a wedding vow—same Principle F, but vastly different weight. Because conventions layer on *scaffolding*: expectations of seriousness, sanctions, symbolic weight. Your "baseline norm" is too thin to explain real-world obligations.  

  **Alex:** The *core wrong* is the same: you betrayed invited trust. The added "weight" is cultural gloss. But even without gloss, the betrayal matters.  

  *(Silence. They both stare into their coffees.)*  

  **Ben:** ...Do you think we’re actually disagreeing? Like, is this about what obligation *is*, or just how we describe it?  

  **Alex:** (Frowns) What do you mean?  

  **Ben:** You say obligation flows from a moral fact about exploitation. I say it’s a useful fiction we treat as fact. But in practice, we both agree breaking promises is usually wrong. Maybe you’re just pointing to the *psychological experience* of obligation, and I’m pointing to its *social machinery*. Same elephant, different parts.  

  **Alex:** No—because if you’re right, obligation dissolves without the machinery. If humanity died out, my deathbed promise *wouldn’t matter*. But I think it would. The wrongness is in the *relational harm*, not in whether a society exists to witness it.  

  **Ben:** And I think that "harm" is defined by the practice. No practice, no harm—just one dead person and a letter nobody cares about.  

  **Alex:** Then we *are* disagreeing. You think obligation is like "dollar value"—real because we collectively pretend it is. I think it’s like "pain"—real whether we acknowledge it or not.  

  **Ben:** (Smirks) Exactly. And next week’s seminar on moral realism awaits... Want another coffee?  

  **Alex:** (Groans) Only if you *promise* not to call it a "conventionally caffeinated obligation."  

  **Ben:** Scout’s honor. (Winks) ...Which, of course, is just a convention.  

  ---

  ### Key Pressure Points Covered:
  1. **Deserted Island Promise**: Alex forces Ben to confront obligation without social reinforcement. Ben’s reply: the feeling is a psychological artifact of internalized convention.  
  2. **Redundancy of Promising**: Ben argues Principle F obligations arise *whenever* expectations are created, making "promising" superfluous. Alex counters that promising is a specialized, high-stakes *activation* of that norm.  
  3. **Meta-Disagreement**: Ben suggests they’re describing the same phenomenon (obligation-as-social-tool vs. obligation-as-moral-truth). Alex insists the metaphysics differ—conventionalism makes obligation contingent and dissolves it without society, while Scanlon grounds it in immutable relational harm.  

  This mirrors classic tensions: Scanlonians struggle to explain why promising *adds* to general expectations; Humeans struggle with "practice-free" intuitions. The dialogue leaves both views scuffed but standing—ready for your seminar! Good luck.
