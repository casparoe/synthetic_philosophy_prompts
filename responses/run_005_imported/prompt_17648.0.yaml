  The real test requires a case where:  
  (1) Speaker A is in a low-stakes context  
  (2) Subject S is in a high-stakes situation  
  (3) S has evidence that would suffice for knowledge in low stakes  
  ...and we ask whether A can truthfully say "S knows."  

  Contextualism says: Yes—A’s "knows" uses low standards.  
