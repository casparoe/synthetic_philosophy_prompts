prompt: |-
  so i've been reading Simone Weil's essay 'On the Abolition of All Political Parties' for a chapter of my political theory dissertation and it's obviously doing something very Rousseauian, but i can't quite tell if its a faithful extension of Rousseau or a big leap past him. can you write me a comparison of Weil's argument with Rousseau's discussion of factions and partial associations in Book II, ch. 3 of the Social Contract? specifically work out (1) whether her three-part definition of a party -- a machine for generating collective passion, a device for exerting pressure on the minds of its own members, and an organization whose growth becomes an end in itself -- is basically just Rousseau's worry about partial wills dressed up in new clothes, and (2) whether her demand for total abolition actually follows from Rousseau's own premises, given that his fallback position is to multiply the factions so none dominates rather than get rid of them outright. don't just summarize the two side by side, actually stake out a position on how far Weil's radicalism is licensed by the Rousseauian framework she borrows from, and where (if anywhere) she quietly departs from it.
