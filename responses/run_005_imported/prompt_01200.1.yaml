  First, I recall Rousseau's argument in Book II, Chapter 3. He sees factions as dangerous because they create partial wills that can override the general will. His solution isn't abolition but multiplying factions to balance power. Weil, however, demands complete abolition of parties. The user wants to know if this is a natural extension or a leap from Rousseau.

