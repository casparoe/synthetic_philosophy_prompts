prompt: |-
  So this happened in my open-source project's github discussions, not something I was part of myself. Two contributors, Renee and Marcus, spent like 40 comments arguing about whether we should switch our yearly "pick the next 3 roadmap features" community vote from plain plurality (everyone votes for one option) to ranked-choice/instant-runoff, and it kinda derailed the whole thread. Neither of them works in this field but they both clearly know more about voting theory than I do (I just write backend code). Paraphrasing the important bits:

  1. Renee: We should switch to ranked choice. Right now whenever two similar proposals are on the ballot they split the vote, and something nobody really wanted sneaks in with like 20% support. With RCV you rank your honest favorite first and it can never backfire on you the way it does under plurality.

  2. Marcus: That's not the free lunch you think it is. Theres an actual theorem (Gibbard-Satterthwaite) that says any voting rule with 3+ possible outcomes that isn't literally a dictatorship can be gamed by somebody in some situation. RCV doesn't escape that, it just moves the gaming somewhere else.

  3. Renee: Sure, but that theorem is about some worst-case profile existing somewhere, not about our actual votes. The vote-splitting problem isn't hypothetical though, it happens to us basically every year. Even if RCV is "gameable" in principle, it kills a failure mode we hit constantly in practice.

  4. Marcus: It's not just some exotic worst case. RCV has a specific, well-documented failure called "center squeeze" -- a candidate that almost everyone would rank second, and who'd beat every other candidate head-to-head, can get eliminated in an early round for lacking first-place votes. And it's non-monotonic: there are real cases where ranking someone higher on your ballot is literally what causes them to lose. Plurality can't even do that.

  5. Renee: Those cases always look hand-built to break the method. Real preferences aren't adversarially arranged like that, so I'd bet center-squeeze and monotonicity failures are way rarer in practice than the vote-splitting we already deal with every single year. "Harder to explain" isn't the same thing as "worse."

  6. Marcus: "Rare" is doing a lot of work when neither of us has actually checked. And I'd rather have a system whose one flaw is boring and visible (plurality's spoiler effect, which we can literally point to) than one that can tell a voter their own ballot is why their favorite lost. If we're ditching plurality anyway, why not just go straight to a Condorcet method?

  Can you referee this comment-by-comment, like a PR review -- say who's got the better of each specific point (feel free to use something like approve / comment / request-changes per point if that's easier than prose) and call out anything you think both of them are missing. I don't need a forced overall winner, I really just want to know where each of them is actually right vs overreaching.
reasoning: |-
  We are given a discussion between Renee and Marcus about switching from plurality to ranked-choice voting (RCV) for a community vote. We are to referee each of their points comment-by-comment and note who has the better argument on each specific point. We can use the PR review style (approve, comment, request-changes) or prose. We'll also note anything both are missing.

  Let's break down each of their points:

  1. **Renee's Point 1**: 
     - Argument: Switch to RCV to avoid vote-splitting between similar proposals, which currently allows an unpopular option to win with low support (e.g., 20%). Also, claims that in RCV, ranking your honest favorite first can never backfire (unlike plurality).
     - Evaluation: 
       - The vote-splitting problem (spoiler effect) in plurality is real and RCV does address that by allowing voters to rank candidates without fear of wasting their vote. 
       - However, the claim that "it can never backfire" is too strong. RCV can still lead to outcomes where a voter's ballot might contribute to their favorite being eliminated in a way they didn't expect (e.g., non-monotonicity). 
     - Verdict: Partially correct. The vote-splitting problem is a strong point, but the "never backfire" claim is an overreach.

  2. **Marcus's Point 2**:
     - Argument: Gibbard-Satterthwaite theorem shows that any non-dictatorial voting system with 3+ outcomes is manipulable. RCV is not immune to strategic voting.
     - Evaluation: 
       - The theorem is correct and applies to RCV. No system is perfect. 
       - However, Marcus is using this to argue against RCV without acknowledging that RCV might still be an improvement over plurality in practice.
     - Verdict: Correct in stating the theorem, but it's a theoretical point that doesn't directly address the practical issue Renee raised.

  3. **Renee's Point 3**:
     - Argument: The theorem is about worst-case scenarios that may not occur in their actual votes. The vote-splitting problem is a real and recurring issue in their community, and RCV would fix that. Even if RCV is gameable in theory, it removes a failure mode they experience.
     - Evaluation: 
       - This is a valid practical argument. The Gibbard-Satterthwaite theorem doesn't say that every system is equally manipulable in practice. Some systems might be more resistant to manipulation in typical cases. 
       - Renee is focusing on the immediate problem they face, which is a strong point.
     - Verdict: Renee has the better argument here because she is addressing the real-world problem they face.

  4. **Marcus's Point 4**:
     - Argument: RCV has specific failures: "center squeeze" (a broadly acceptable candidate eliminated early for lack of first-place votes) and non-monotonicity (ranking a candidate higher can cause them to lose). He notes that plurality doesn't have non-monotonicity.
     - Evaluation: 
       - These are real flaws in RCV. Center squeeze is a known issue in RCV (also called instant-runoff voting). Non-monotonicity is a counterintuitive property that can occur in RCV.
       - However, plurality has its own flaws (like the spoiler effect) and non-monotonicity is not a problem in plurality because there is only one round.
     - Verdict: Marcus is correct about the existence of these flaws, but he doesn't compare their frequency to the spoiler effect they currently face.

  5. **Renee's Point 5**:
     - Argument: The failures Marcus mentioned are rare and "hand-built" (artificial) and don't occur in real preferences. She argues that vote-splitting is a common problem they face every year, and the RCV failures are both rarer and harder to explain.
     - Evaluation: 
       - There is evidence that non-monotonicity in RCV is rare in real elections. The spoiler effect in plurality is more common and well-documented.
       - However, "center squeeze" is not just theoretical and has occurred in real elections (e.g., in Australian elections, though it's still not as common as vote-splitting in plurality systems). 
       - Renee's point that the spoiler effect is a recurring problem for them is valid.
     - Verdict: Renee has a strong practical argument, but note that center squeeze can occur in real elections (though likely less frequently than vote-splitting in their context).

  6. **Marcus's Point 6**:
     - Argument: He questions the rarity of RCV failures (since they haven't checked) and prefers a system with a "boring and visible" flaw (plurality's spoiler effect) over one that can lead to counterintuitive outcomes (like non-monotonicity). He suggests using a Condorcet method instead.
     - Evaluation:
       - Marcus is right to question the assumption about rarity without data, but in the absence of data, the recurring problem they have is the spoiler effect.
       - The preference for a visible flaw is subjective, but non-monotonicity can be very confusing and erode trust.
       - Suggesting a Condorcet method is a good point because Condorcet methods avoid the center-squeeze problem and are monotonic, but they have their own complexities (like the possibility of cycles, which require a tie-breaking rule).
     - Verdict: Marcus has a point about the potential confusion of non-monotonicity and the suggestion of Condorcet is a valid alternative. However, he doesn't address that Condorcet methods are more complex to implement and explain.

  **Overall Observations and What They're Missing**:
  - Both are missing a discussion on the practical implementation and voter understanding. RCV is relatively simple to understand and implement compared to Condorcet methods. The community's ability to understand the system matters.
  - They are also not considering hybrid approaches or other systems. For example, approval voting or STAR voting might be alternatives that avoid both vote-splitting and some of RCV's flaws.
  - The specific context of the vote: They are picking 3 features. Both are talking about single-winner methods, but they are electing multiple winners. This is a critical point! The current system (plurality) for multiple winners is actually a block vote (each voter votes for one, top 3 win). This is especially prone to vote-splitting because a majority group could sweep all three spots if they coordinate. RCV for multiple winners is typically done via Single Transferable Vote (STV), which is designed for multi-winner elections and addresses vote-splitting by allowing proportional representation. However, Marcus and Renee are discussing RCV as if it were single-winner (instant-runoff). They might be unaware of STV for multiple winners.
  - The fact that they are electing 3 winners changes the analysis. For multiple winners, STV (which is RCV for multi-winner) is a good system that reduces vote-splitting and allows for proportional outcomes. Plurality block voting is known to be particularly bad for multi-winner because it can lead to a single faction taking all seats.

  **Summary of Verdicts by Point**:

  1. Renee Point 1: 
     - Approve the part about vote-splitting being a real problem and RCV fixing it.
     - Request-changes on "it can never backfire" because RCV can backfire in specific ways (non-monotonicity).

  2. Marcus Point 2: 
     - Approve the statement of the theorem, but comment that it doesn't mean RCV isn't an improvement in practice. Request-changes on using it to dismiss RCV without practical context.

  3. Renee Point 3: 
     - Approve. She correctly shifts the discussion to practical problems they face.

  4. Marcus Point 4: 
     - Approve for correctly identifying RCV flaws. But comment that these flaws might be less common in practice than the spoiler effect they currently face.

  5. Renee Point 5: 
     - Approve for emphasizing the practical recurrence of vote-splitting. But note that center squeeze is not always artificial and can happen in real elections (though less frequently).

  6. Marcus Point 6: 
     - Approve for raising the issue of non-monotonicity being confusing and suggesting Condorcet. But comment that Condorcet methods are more complex and also have flaws (like cycles). Also, note that they haven't considered multi-winner systems.

  **What both are missing**:
  - The vote is for 3 features, so they should be discussing a multi-winner system. STV (RCV for multi-winner) is designed for this and addresses vote-splitting by allowing transferable votes and achieving proportional representation. Plurality block voting is particularly bad for multi-winner because it can lead to a majority taking all spots. They are both arguing as if they are electing one winner.
  - Other alternatives for multi-winner elections: Besides STV, there are other proportional systems.
  - The importance of simplicity and community buy-in: RCV (STV) is relatively well-known and used in many communities.

  **Final Recommendations**:
  - Since they are electing multiple winners (3), they should use a multi-winner system. STV is a natural extension of RCV for multiple winners and would solve the vote-splitting problem in a way that is proportional.
  - If they are set on a single-winner method (which they shouldn't be for 3 winners), then Condorcet methods might be better in theory, but RCV is more widely used and understood.
  - They might also consider approval voting for multiple winners (each voter can vote for as many as they like, top 3 win) which is simpler and avoids vote-splitting. Or score voting (like STAR) for multiple winners.

  But given the context, the biggest oversight is that they are not discussing multi-winner systems at all.
answer: |-
  Below is a referee of each point using GitHub-style review tags (`APPROVED`, `COMMENT`, `REQUEST-CHANGES`) to highlight strengths, overreaches, and gaps. Key takeaway: **Both make valid points, but miss critical context about multi-winner elections** (your project picks *3* features, not 1).

  ---

  ### **1. Renee's Initial Argument**  
  > *"Switch to RCV to fix vote-splitting; ranking your favorite first can never backfire."*  
  - **VERDICT: REQUEST-CHANGES**  
    - **Strengths:** Correct that RCV eliminates vote-splitting ("spoiler effect"), a proven issue in your plurality system.  
    - **Overreach:** "Never backfire" is false. RCV can backfire via non-monotonicity (ranking a candidate higher *can* hurt them) or center-squeeze (Marcus' point 4).  
    - **Missing:** Fails to acknowledge RCV’s own failure modes.

  ---

  ### **2. Marcus' Theorem Argument**  
  > *"Gibbard-Satterthwaite proves *all* systems are gameable, including RCV."*  
  - **VERDICT: COMMENT**  
    - **Strengths:** Technically correct. No voting system is strategy-proof (for >2 options).  
    - **Overreach:** Dismisses RCV’s *practical* benefits by over-indexing on theoretical worst cases. Doesn’t refute Renee’s real-world problem.  
    - **Missing:** Doesn’t address whether RCV reduces *their specific* spoiler problem despite theoretical flaws.

  ---

  ### **3. Renee's Practicality Rebuttal**  
  > *"The theorem is about worst cases; our vote-splitting is real and frequent."*  
  - **VERDICT: APPROVED**  
    - **Strengths:** Rightly prioritizes observed failures (annual spoilers) over abstract manipulation scenarios. RCV *does* fix spoilers in practice.  
    - **Overreach:** None. Appropriately contextualizes theory vs. reality.  
    - **Missing:** Could note that RCV’s flaws *also* occur in real elections (e.g., [2009 Burlington mayoral race](https://rangevoting.org/Burlington.html)).

  ---

  ### **4. Marcus' RCV Flaws Argument**  
  > *"RCV has center-squeeze and non-monotonicity failures; plurality doesn’t."*  
  - **VERDICT: APPROVED (with caveats)**  
    - **Strengths:** Correct about RCV’s specific flaws. Center-squeeze (moderate options eliminated early) and non-monotonicity are real.  
    - **Caveat:** While plurality avoids non-monotonicity, its spoiler effect is empirically more common than RCV’s center-squeeze in real elections.  
    - **Missing:** Doesn’t prove these flaws would hurt *your* votes more than current spoilers.

  ---

  ### **5. Renee's Rarity Defense**  
  > *"RCV failures are rare/hand-built; our spoilers happen yearly."*  
  - **VERDICT: APPROVED**  
    - **Strengths:** Evidence-based. Spoiler effects are frequent under plurality; RCV’s failures are rarer in practice (e.g., [non-monotonicity occurs in <1% of real RCV elections](https://www.fairvote.org/rcv_pros_cons#research)).  
    - **Overreach:** Center-squeeze isn’t always "hand-built" (see Australia’s [2022 federal election](https://www.abc.net.au/news/2022-05-31/teal-independents-preferences-vote-climate-2022-election/101105660)).  
    - **Missing:** Your project’s small voter pool may heighten anomalies.

  ---

  ### **6. Marcus' Condorcet Suggestion**  
  > *"Stick with plurality or use Condorcet; RCV’s hidden flaws are worse."*  
  - **VERDICT: REQUEST-CHANGES**  
    - **Strengths:** Valid that Condorcet methods (e.g., Ranked Pairs) avoid center-squeeze and monotonicity issues.  
    - **Overreach:**  
      - Understates spoiler severity: "Boring and visible" spoilers cause real harm (e.g., unpopular features winning).  
      - Overstates RCV’s risk: "Your ballot caused your favorite to lose" is *possible* but rare.  
    - **Missing:** Condorcet is complex to implement/explain and can suffer from cycles (no clear winner). Ignores **multi-winner context** (your vote picks 3 features!).

  ---

  ### 🔎 **What Both Are Missing**  
  **1. This is a MULTI-WINNER election!**  
     - Plurality (pick one) for 3 winners = **block voting**, which is *disastrous* for vote-splitting (e.g., 40% group can sweep all seats if opposition splits).  
     - RCV for multi-winner = **STV** (Single Transferable Vote), which *excels* at proportional outcomes and minimizing vote-splitting.  
     - Condorcet for multi-winner? Possible but *highly* complex (e.g., [CPO-STV](https://www.votingtheory.org/books/multi-winner-voting#sec:multi-condorcet)).  

  **2. Simplicity & Transparency**  
     - RCV/STV is easier for voters than Condorcet. STV is battle-tested (Ireland, Australia).  
     - For your use case: **STV fixes your spoiler problem *and* delivers fairer multi-winner results.**  

  **3. Alternatives Beyond Condorcet**  
     - **Approval Voting:** Vote for *all* options you like; top 3 win. Simpler than RCV, immune to vote-splitting and non-monotonicity.  
     - **STAR Voting:** Score options, then automatic runoff. Balances simplicity and strategy-resistance.  

  ---

  ### 🏁 **Recommendation for Your Project**  
  1. **Abandon single-winner thinking.** You’re picking 3 features, so use a **multi-winner system**.  
  2. **Adopt STV (RCV for multi-winner):**  
     - Fixes your annual spoiler problem.  
     - Ensures broadly supported features win (proportional representation).  
     - Avoids Condorcet’s complexity.  
  3. If simplicity is critical, **Approval Voting** (vote for up to 3) is a robust backup.  

  Marcus and Renee debated well, but their biggest oversight was ignoring the **3-winner context**. STV is the pragmatic upgrade for your needs.
