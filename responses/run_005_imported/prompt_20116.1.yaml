  ## The Unbreakable Past

  Silas Thorne didn’t build the chronal displacer to win wars or amass wealth. He built it to save Ben. His little brother, vibrant and reckless, dead at seventeen when his bike met a drunk driver’s sedan on a rain-slicked street corner. Silas lived in the long shadow of that Tuesday evening, haunted by the phone call, the sterile hospital smell, the crushing absence. Decades of obsessive physics yielded the device humming in his basement workshop – a shimmering ring of exotic alloys and captured tachyons. Its rule was absolute: one timeline, immutable. History was a tapestry already woven. He could visit the threads, but he couldn’t pull them out.

  His plan was simple: arrive at the corner of Elm and Sycamore five minutes before impact. Physically restrain Ben. A tackle, a rugby hold, *anything* to keep him off that curb at 8:03 PM.

  **Attempt One:** The displacement was nauseating, a gut-wrenching lurch into a past he remembered too well – the damp air, the streetlights haloed in mist. He materialized behind a dumpster in the alley beside the corner store. Heart pounding, he scanned the street. There was Ben, headphones on, oblivious, leaning against his bike, waiting for the light. Silas sprinted.

  *Tripped.* His foot caught on a discarded, half-flattened soda can hidden in the gloom. He went sprawling onto the wet asphalt, the wind knocked out of him. By the time he scrambled up, coughing, Ben was already pedaling across the intersection. Silas saw the headlights, heard the screech, the sickening thud. He vomited behind the dumpster as sirens wailed. The displacer yanked him back to his present, the failure a fresh wound.

  **Attempt Two:** He arrived earlier, fifteen minutes pre-impact. Positioned himself directly on the corner, leaning casually against a lamppost. He’d engage Ben in conversation, distract him until the danger passed. Ben approached, humming. Silas stepped forward, forcing a smile.

  *Sneezed.* A violent, unexpected allergy attack seized him. Pollen? Dust? He doubled over, eyes streaming, utterly incapacitated by a fit of explosive sneezes. When he finally wiped his eyes, gasping, Ben was already mounting his bike, pulling away. Silas lunged, fingers brushing denim, but Ben was moving. The impact happened down the street, just out of Silas’s desperate line of sight. He returned home shaking, the echo of the crash ringing in his ears.

  **Attempt Three:** He came armed. Not with a weapon, but with a tool. A small, powerful electromagnet. Disable the bike chain. Ben wouldn’t be able to pedal away. He displaced behind the newsstand opposite the corner. Ben leaned on his bike, same as always. Silas aimed the magnet, thumbed the switch. Nothing happened. He fumbled, checked the connections. *Dead battery.* He’d checked it obsessively before displacement! How? He slammed the useless device against his thigh. Ben pushed off. Silas roared, charging across the street, ignoring the blare of horns. He was five strides away when the sedan plowed into Ben. Silas felt the displaced air buffet him as he was wrenched back to the present, the phantom roar of the engine still vibrating in his bones.

  **Attempt Four:** Forget subtlety. Direct intervention. He displaced onto the sidewalk right beside Ben. No preamble. He grabbed Ben’s arm. "Ben! Listen! You can't go! There's a car—"

  *Ben recoiled.* "Get off me, creep!" Ben shoved hard. Silas, off-balance from the displacement, stumbled back. His heel caught the uneven edge of the curb. He flailed, arms pinwheeling, and crashed backwards into a stack of empty cardboard boxes outside the store. They collapsed around him in a damp, noisy avalanche. By the time he fought his way free, spitting cardboard, Ben was crossing the street. Silas watched, helpless, trapped in the debris, as the inevitable unfolded. He didn't scream this time. He just closed his eyes before the displacer pulled him away.

  The failures piled up. A sudden downpour drenched him, making him slip as he ran (Attempt Five). A loose shoelace tangled, sending him sprawling at the crucial moment (Attempt Six). A passing police car, responding to a minor fender-bender blocks away, distracted Ben long enough for Silas to misjudge his interception (Attempt Seven). A searing, inexplicable muscle cramp locked his leg as he lunged (Attempt Eight).

  He stopped counting attempts. He just kept going back, refining, anticipating, becoming a ghost haunting that rain-slicked corner. He knew the exact pattern of the cracks in the sidewalk, the flicker of the faulty streetlight, the scent of damp earth and exhaust. He knew Ben’s posture, his distracted hum, the way he tapped his foot waiting for the light. He knew the precise trajectory of the doomed sedan.

  But he couldn’t *change* it.

  The dread didn’t come as a thunderclap. It seeped in, cold and inescapable, like groundwater rising. It wasn't *bad luck*. It was… consistency. The universe wasn't fighting him with cosmic forces; it was simply *being what it already was*. The soda can, the sneeze, the dead battery, the shove, the rain, the shoelace, the cramp… they weren’t random obstacles thrown up by fate. They were *part of the event*. They were the details that ensured Silas Thorne, in his desperation, *failed* to save his brother on that Tuesday evening. Because Silas Thorne *had* failed. History recorded it. Ben died. Therefore, Silas *must* fail, every single time. Not by magic, but by the mundane, intricate, unbreakable logic of cause and effect woven into the single, unalterable fabric of time. His attempts weren't changing the past; they *were* the past. His failures weren't accidents; they were fixed points.

  He stood in his workshop, the displacer humming its low, constant note. The cold dread crystallized into a terrible, hollow certainty. He looked at the worn photograph of Ben on his workbench – the goofy grin, the untamed hair. The love was still there, sharp as ever. But the hope… the hope was gone, replaced by the crushing weight of cosmic truth.

  He couldn’t save Ben. Not because the technology failed, not because he wasn’t smart enough or fast enough, but because Ben was already dead. Saving him would unravel the very reality that allowed Silas to exist, to love him, to mourn him, to build the machine. The universe, in its cold, logical way, protected itself not with paradox police, but with misplaced soda cans, dead batteries, and perfectly timed sneezes. It enforced its own consistency with the mundane.

  Silas didn’t activate the displacer again. He simply sat on the cold concrete floor, staring at the humming ring. He finally understood David Lewis's terrifying, elegant solution. Time travel was possible. Changing the past wasn't. The horror wasn't in failure; it was in the realization that his failure was written into the foundation of everything, as immutable as gravity. He’d journeyed across time only to discover the bars of his own, unbreakable cage. The past wasn't a place you could fix. It was the mold that had already set. He buried his face in his hands, the displacer's hum the only sound in the silent workshop, a constant reminder of the perfect, awful symmetry of the universe.
