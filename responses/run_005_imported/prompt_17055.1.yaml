prompt: |-
  I'm drafting a historical novel built around a conspiracy to assassinate a tyrannical prince, and two beta readers -- one a lapsed seminarian, the other a lawyer with a weakness for medieval history -- got into a running argument in the manuscript's margin comments over whether my conspirators could plausibly invoke Aquinas the way I have them do in the scene. I'm passing the exchange along because I honestly can't settle it myself, and neither of them will let it drop.

  She argued that Aquinas gives them cover: in the Summa he says that disturbing a tyrant's rule is not sedition, since a regime aimed at the ruler's private advantage rather than the common good was never a rightly ordered government to begin with, so unmaking it cannot be a sin against order. He answered that this is true but beside the point for my scene, since that passage is usually read as licensing collective or public removal of a tyrant, not one man's knife -- and that in On Kingship, discussing exactly the case of a legitimately established ruler who curdles into cruelty, Aquinas is conspicuously wary of private initiative, warning that letting individuals judge for themselves who counts as a tyrant only invites ambitious men to murder decent rulers under that pretext. She replied that the line between a usurper and a legitimate ruler gone bad cannot be doing much work, since the subjects suffer identically either way, and a doctrine more concerned with a ruler's paperwork than his subjects' welfare is not one Aquinas could seriously have intended. He came back that Aquinas's worry was never welfare versus paperwork but who gets to act as judge in his own case, and that worry does not dissolve just because, in a given instance, the abuse happens to be real.

  Could you go through their exchange move by move, say who has the better of it at each step -- not just who wins overall -- and note anything about Aquinas's actual position that both of them seem to be missing?
reasoning: |-
  Okay, the user is writing a historical novel involving a conspiracy to assassinate a tyrant, and their beta readers—a former seminarian and a lawyer with medieval history expertise—are debating whether Aquinas justifies the conspirators' actions. The seminarian argues Aquinas permits removing a tyrant since such a regime isn't legitimately ordered, while the lawyer counters that Aquinas only endorses collective, not private, action. The user wants me to analyze each point in their exchange, determine who has the better argument at each step, and identify any overlooked aspects of Aquinas's position.

  First, I need to recall Aquinas's actual views on tyranny. In the Summa Theologiae (II-II, Q.42), he distinguishes between sedition against just rulers and actions against tyrants. He argues that since a tyrant's rule isn't directed at the common good, opposing it isn't sedition. However, in De Regno (On Kingship), he cautions against private individuals taking action, emphasizing the need for public authority to avoid chaos.

  Looking at the seminarian's first point: she cites Aquinas's view that disturbing a tyrant's rule isn't sedition. She's correct here—Aquinas explicitly says that opposing a ruler who seeks private gain over the common good isn't sinful. This aligns with Aquinas's broader principle that authority must serve the community. So, she has the stronger opening argument.

  The lawyer responds that this applies to collective, not private, action. He references De Regno, where Aquinas warns against individuals judging rulers. This is also valid—Aquinas consistently prioritizes orderly processes to prevent anarchy. The lawyer makes a solid point here, highlighting Aquinas's caution about vigilantism.

  The seminarian counters that the distinction between a usurper and a legitimate ruler turned tyrant is irrelevant since suffering is the same. This is emotionally compelling but oversimplifies Aquinas. He does differentiate legitimacy in De Regno, considering how a ruler came to power as part of the calculus for removal. Her point about suffering being identical is humanistically reasonable but doesn't fully capture Aquinas's concern for procedural order.

  The lawyer retorts that Aquinas's real worry is about individuals acting as judges in their own cases, which doesn't disappear even if the tyranny is real. This is a strong point because Aquinas's emphasis is on avoiding subjective judgments that could lead to chaos. The lawyer correctly identifies Aquinas's deeper concern about process over outcomes.

  Both miss key nuances: Aquinas in De Regno allows for extreme cases where private action might be tolerated if no other recourse exists, but this is framed as a last resort. He also stresses that the method must be proportional—lesser interventions first. Additionally, he worries about the aftermath of assassination, fearing worse tyranny or disorder. The seminarian underplays the legitimacy distinction; Aquinas does consider how a ruler gained power relevant. The lawyer might overstate the "judge in own case" framing; Aquinas's concern is broader societal disorder.

  Overall, the lawyer edges out in the exchange because he addresses Aquinas's procedural safeguards, which are central. However, the seminarian correctly notes that suffering under tyranny matters to Aquinas, even if process is paramount. The user's scene could be strengthened by showing the conspirators wrestling with these nuances—perhaps debating whether they've exhausted other options or if their action might cause more harm. This would reflect Aquinas's complex stance more authentically.
answer: |-
  Here's a breakdown of the beta readers' exchange, evaluating each move and identifying overlooked nuances in Aquinas's position:

  **The Exchange & Analysis:**

  1.  **Her Opening Move (Seminarian):**
      *   **Argument:** Cites *Summa Theologiae* II-II, Q.42, A.2. Aquinas states that disturbing a tyrant's rule is *not* sedition because a regime serving the ruler's private advantage, not the common good, is inherently disordered. Therefore, opposing it isn't a sin against the divinely ordained order.
      *   **Strength:** **She has the better of this point.** Her citation is accurate and foundational. Aquinas *does* explicitly remove the label of "sedition" from actions against a genuine tyrant, grounding this in his core political principle: authority exists *only* for the common good. This is a crucial starting point for any justification of resistance.
      *   **What's Missing (Overlooked by Both):** While removing the *sin* of sedition, Aquinas doesn't automatically *prescribe* or *justify* violent resistance, especially assassination. He merely removes one major theological/legal obstacle. The *method* of opposition is the critical next question.

  2.  **His Counter (Lawyer):**
      *   **Argument:** Agrees with the *Summa* point but argues it's "beside the point." Distinguishes between *collective/public* removal (which the *Summa* passage might license) and *private assassination* (a "one man's knife"). Cites *De Regimine Principum (On Kingship)* I, 6, where Aquinas, discussing a legitimately established ruler who becomes a tyrant, explicitly warns against *private individuals* taking action. His core fear is that allowing individuals to judge and execute tyrants creates a pretext for ambitious men to kill *good* rulers.
      *   **Strength:** **He has the better of this point.** He correctly identifies the crucial ambiguity in the *Summa* passage regarding *agency* and *method*. His citation of *De Regimine* is directly on point for the scenario (legitimate ruler turned tyrant) and explicitly addresses the danger of *private initiative*, which is precisely what assassination represents. Aquinas's fear of vigilantism and self-serving pretexts is a powerful argument against individual action.
      *   **What's Missing (Overlooked by Both):** Aquinas in *De Regimine* does *not* rule out resistance absolutely. He explicitly says removal *is* justified, but emphasizes it should be done by "public authority" – potentially meaning the community acting collectively, lesser magistrates, or a superior authority (like the Pope for a Christian prince). He also implies worse outcomes (like a worse tyrant or chaos) must be weighed.

  3.  **Her Riposte (Seminarian):**
      *   **Argument:** Dismisses the distinction between a usurper and a legitimate ruler turned tyrant as irrelevant ("paperwork") because the suffering of subjects is identical. Argues that a doctrine prioritizing legitimacy ("paperwork") over suffering ("welfare") is something Aquinas *couldn't* have seriously intended, given his focus on the common good.
      *   **Strength:** Her point about identical suffering is powerful on a *human* level and resonates with Aquinas's ultimate concern for the common good. It highlights a potential tension in Aquinas's thought if the legitimacy distinction becomes an absolute bar to necessary action.
      *   **Weakness/Who Has the Better:** **He retains the edge here.** While suffering is paramount, Aquinas *does* make the legitimacy distinction in *De Regimine* for practical, order-related reasons. His concern isn't mere "paperwork" but the stability and legitimacy of *any* process for judging rulers. Granting individuals the right to kill rulers they deem tyrannical, regardless of how they came to power, fundamentally undermines *all* political order and invites chaos – a greater threat to the common good in Aquinas's view than enduring a *single* tyrant. Her argument risks throwing out the baby (ordered society) with the bathwater (the tyrant).

  4.  **His Finale (Lawyer):**
      *   **Argument:** Clarifies that Aquinas's core worry in *De Regimine* isn't "welfare vs. paperwork" but the fundamental injustice and danger of allowing someone to be "judge in his own case." This procedural worry persists *even if* the tyrant is real and the suffering is acute in a specific instance.
      *   **Strength:** **He solidifies his point.** This is an excellent distillation of Aquinas's procedural concern. The "judge in his own case" principle is a bedrock of natural law and justice. The risk of error, malice, or ambition creating a pretext for killing *good* rulers is a systemic danger that doesn't vanish just because *this particular* assassin might be right. Aquinas prioritizes systemic stability and just procedure over individual instances of righteous vengeance, even when the cause is just.
      *   **What's Missing (Overlooked by Both):** Neither fully grapples with the *extremity* Aquinas might allow. While opposing private initiative, Aquinas in *De Regimine* leaves a tiny, ambiguous crack: if there is *no hope* of human remedy (*nulla posset humana provisione adiuvari*), and the tyranny is extreme, *perhaps* an individual acting for the community *might* be tolerated as a last resort. However, he frames this hesitantly and immediately warns of the likely disastrous consequences. This isn't a *justification* for assassination but a reluctant acknowledgement of a desperate possibility.

  **Who Wins Overall?** The **Lawyer** has the stronger argument for the specific context of your scene – **a conspiracy plotting private assassination.** He successfully anchors his points in Aquinas's most direct discussion of the scenario (*De Regimine*), highlighting the explicit warnings against private judgment and action, and correctly frames Aquinas's core concern as procedural justice and systemic stability, not just outcomes or origins.

  **Key Nuances of Aquinas's Position Both Seem to Overlook:**

  1.  **The Primacy of Non-Violent/Procedural Remedies:** Aquinas consistently emphasizes exhausting all other avenues *before* considering force, especially against a legitimate ruler. This includes remonstrance, appeal to superiors (like the Pope or Emperor), and action by public authority. Assassination is the absolute last conceivable resort, not the first.
  2.  **The Calculus of Consequences:** Aquinas is deeply pragmatic. Even if removal is justified *in principle*, he insists on weighing the *likely consequences*. Will it cause greater disorder, civil war, or install a worse tyrant? If so, tolerating the existing tyrant might be the lesser evil for the common good. Assassination is particularly risky here.
  3.  **"Public Authority" vs. Mob Rule:** When Aquinas talks about action by "public authority" in *De Regimine*, he doesn't necessarily mean a democratic uprising. He likely means established corporate bodies (like a council, senate, or assembly of nobles) or lesser magistrates acting within a constituted framework – a more orderly process than a secret conspiracy or mob violence. The seminarian's "collective" action needs this nuance.
  4.  **The Extremity Caveat:** As noted, the "no human remedy" clause in *De Regimine* is the only conceivable (though heavily qualified and discouraged) opening Aquinas provides for something approaching individual initiative in extreme, utterly hopeless cases. It's not a green light, but a grey area born of desperation.
  5.  **Distinction *is* Relevant, but Not Absolute:** While the suffering is the same, Aquinas *does* see a difference in how to handle a usurper (who never had legitimate authority) vs. a legitimate ruler turned tyrant. Procedures for removal might differ. The lawyer is right to note it, though the seminarian is right that Aquinas's *primary* criterion for tyranny is the ruler's *actions* (private advantage vs. common good), not *solely* their origin.

  **Conclusion for Your Scene:**

  The lawyer is correct that Aquinas provides **very shaky ground, if any, for justifying a private assassination conspiracy** against a ruler who was initially legitimate. Aquinas's explicit warnings against private judgment and action, his emphasis on procedural remedies through public authority, and his fear of disastrous consequences strongly militate against it. The seminarian is right about the core injustice of tyranny removing the sin of sedition, but she underplays Aquinas's profound concerns about *how* that injustice is remedied.

  **To strengthen your scene authentically:** Your conspirators *could* invoke the *Summa* to argue they aren't committing sedition. However, a savvy one (perhaps the lawyer-like character?) *should* voice the Aquinas-inspired doubts reflected in the lawyer beta-reader's points: "But who are *we* to judge and act? What if we're wrong, or what if this plunges the realm into chaos worse than his rule? Aquinas warned against this very path..." Their invocation of Aquinas should feel like they are wrestling with his difficult doctrine, stretching it to cover their desperate act, rather than finding clear and unambiguous permission. The tension *is* the drama.
