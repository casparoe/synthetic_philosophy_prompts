prompt: |-
  I'm taking a seminar this semester on formal approaches to ethics, and we just spent two weeks on decision-making under moral uncertainty: the "My Favourite Theory" view, expected-choiceworthiness maximization, and the mess around comparing choiceworthiness across rival theories. Right after one of the sessions, two classmates of mine, Marcus and Dana, got into a long argument over coffee about whether Marcus's own stated reasoning for eating meat actually holds up, and I've been turning it over since without managing to settle it myself.

  Here's roughly how the exchange went:

  (1) Marcus said he's about 60% confident in a view on which animals lack the kind of moral status that would make eating them wrong, and 40% confident in a view on which it's a serious wrong, on par with inflicting suffering on a being whose interests matter nearly as much as a young child's. Since he's more confident in the first view, he eats meat — the "My Favourite Theory" approach: go with whichever theory you find most credible and ignore the rest.

  (2) Dana objected that this throws away all the information about what's at stake. A minority credence in "this is a serious wrong" should sometimes outweigh a majority credence in "this barely matters," so what should guide him is each theory's expected choiceworthiness — its verdict weighted by both his credence in it and how strongly it condemns or endorses the act — not just which theory he finds more probable.

  (3) Marcus replied that this only makes sense if you can measure how strongly two different theories condemn or endorse an act on some shared scale, and he doesn't see how that's possible — isn't this exactly the intertheoretic comparison problem from the reading? A verdict of "seriously wrong" from a theory that takes animal suffering to matter and a verdict of "perfectly fine" from one that doesn't aren't numbers you can put in the same equation, any more than you can add two currencies without an exchange rate nobody's given you.

  (4) Dana granted that no scale is handed to us in advance, but said philosophers have proposed principled ways of constructing one anyway, for instance by normalizing how each theory ranks the available options in a given choice. She added that refusing to do this has an absurd upshot: on Marcus's approach, a theory that barely edges out the alternative and has 51% of his credence always beats a theory that finds the act monstrous and has 49%, no matter how the stakes are actually stacked.

  (5) Marcus answered that any normalization scheme has to smuggle in a substantive judgment about how to weigh the theories against each other, so Dana hasn't solved the comparison problem, only relocated the arbitrary choice one level down. He added that weighting by stakes at all invites its own absurdity: if he assigned even a stray 1% credence to some theory on which eating meat is comparable to a moral atrocity, Dana's approach would apparently let that 1% swamp every other consideration, which seems like a strange way to decide on dinner.

  (6) Dana conceded this is a genuine cost of weighting by stakes — something like Pascal's mugging for ethics — but said the right response is to be more careful about which credences one is entitled to hold in the first place, not to abandon stakes-weighting and default to whichever theory happens to hold a bare majority of one's credence.

  Could you go through this move by move? Please give me your verdict as a JSON object of the form {"1": <score>, "2": <score>, "3": <score>, "4": <score>, "5": <score>, "6": <score>}, where each score is an integer from -2 (clearly mistaken) to 2 (clearly right); a move can be partly right and partly wrong, so use the score to reflect the overall balance. After the JSON, briefly justify each score, and close with a short paragraph on whether there's some consideration neither Marcus nor Dana raised that should actually matter for Marcus's decision.
