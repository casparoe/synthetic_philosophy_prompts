  ### Justifications
  1. **Marcus (-1)**: Mistaken in principle. "My Favourite Theory" ignores the *magnitude* of potential wrongs. A 40% chance of committing a "serious wrong" (comparable to harming a child) should give pause even if a 60% chance suggests permissibility. This approach fails under asymmetric stakes.  
  2. **Dana (2)**: Correct. Expected choiceworthiness maximization (ECM) accounts for both credence *and* stakes. Ignoring high-stakes minority theories is irrational when moral risks are asymmetric.  
  3. **Marcus (1)**: Partly right. Intertheoretic comparisons *are* deeply problematic (no "shared scale" exists). But his dismissal of ECM oversimplifies; efforts to construct scales (e.g., normalization) address this, even if imperfectly.  
  4. **Dana (1)**: Valid pushback. Normalization schemes *are* proposed solutions, and her "absurd upshot" (51% trivial vs. 49% monstrous) highlights a critical flaw in Marcus’s approach. However, normalization’s arbitrariness remains unresolved.  
  5. **Marcus (0)**: Mixed. Right that normalization smuggles in substantive judgments (relocating arbitrariness). His "1% atrocity" example (*Pascal’s Mugging*) is a legitimate weakness of ECM. But he overstates it—ECM doesn’t *require* assigning credence to extreme theories.  
  6. **Dana (1)**: Reasonable. Acknowledges ECM’s vulnerability to extreme theories but correctly argues that refining credences (e.g., through consistency/plausibility filters) is better than reverting to a bare-majority rule. Doesn’t fully solve the problem, though.  

  ### Key Omitted Consideration: Practical Alternatives & Risk Aversion  
  Neither addresses **non-ideal alternatives** or **risk-averse approaches**. Marcus could minimize moral risk by choosing options less contentious across theories (e.g., plant-based diets). Even if theories disagree on *permissibility*, most might agree that reducing meat consumption lowers expected harm. Additionally, under moral uncertainty, a precautionary principle (avoiding acts with high-stakes condemnation potential) could apply—especially since Marcus’s 40% credence in a "serious wrong" is non-negligible. This avoids direct intertheoretic comparisons while respecting the stakes asymmetry Dana emphasizes.
