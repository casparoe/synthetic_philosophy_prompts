answer: |-
  You've nailed the core tension perfectly — weak discernibility *does* seem to pull the rug out from under Black's counterexample, yet philosophers still debate it fiercely. Let's cut straight to the conceptual heart of the matter, bypassing the basics you've got covered.

  **The Core Argument of Weak Discernibility (Saunders & Others):**

  1.  **The Relation:** In Black's universe, Sphere A stands in the irreflexive relation "is exactly one mile distant from" to Sphere B. Crucially, Sphere B also stands in that *same* relation to Sphere A. The relation is symmetric.
  2.  **Irreflexivity is Key:** The critical point is that this relation **cannot** hold between an object and itself. Nothing is "exactly one mile distant from" *itself*. It's a relation that *requires* two distinct relata by its very nature.
  3.  **Discernment via Relation:** Therefore, while A and B share *all* intrinsic (monadic) properties and *all* symmetric relational properties (like "is one mile from *a* sphere"), they *differ* in how they instantiate this specific irreflexive relation:
      *   A instantiates the relational property "is exactly one mile distant from Sphere B".
      *   B instantiates the relational property "is exactly one mile distant from Sphere A".
  4.  **Qualitative Difference:** Proponents argue that "is exactly one mile distant from Sphere B" and "is exactly one mile distant from Sphere A" are **different qualitative relational properties**. They are complex properties defined by the relation and the specific relatum. Because A and B each have one property the other lacks, they are qualitatively discernible.
  5.  **Rescuing PII (Weakly):** Since A and B *are* discernible via these distinct relational properties, Leibniz's Principle of the Identity of Indiscernibles (PII) holds, albeit in a weaker form: "If for every qualitative property (including *relational* properties), object A has it if and only if object B has it, then A is identical to B." Black's spheres fail this test because of the distinct relational properties tied to the irreflexive relation. They are "weakly discernible."

  **The Standard Objection (Circularity / Presupposition):**

  This is where the real philosophical blood is spilled. Critics argue weak discernibility smuggles in numerical distinctness *before* it establishes discernibility. Here's the breakdown:

  1.  **The Relation Presupposes Distinctness:** To say "A is 1 mile from B" **already assumes** that A and B are distinct entities. If A and B were numerically identical (the same sphere), the statement "A is 1 mile from B" would be false/nonsensical (because of irreflexivity). The relation *only makes sense* if there are *already* two things.
  2.  **PII is Supposed to *Ground* Distinctness:** Leibniz's PII (in its strong form) is intended as a principle to *determine* when we have two things rather than one. It's supposed to tell us *what makes* A and B distinct. If we need to *presuppose* their numerical distinctness to even *formulate* the relational property that supposedly discerns them, then the discernment isn't doing the fundamental work PII is meant for. It's circular.
  3.  **The Properties Aren't Fundamental:** The critic argues that the distinct relational properties "is 1 mile from B" and "is 1 mile from A" are *not* primitive qualitative differences. They are *constructed* from the fundamental symmetric relation "being 1 mile apart" *plus* the brute numerical distinctness of A and B. The distinctness of the spheres explains the distinct relational properties, not the other way around.
  4.  **Black's Intent:** Black designed his thought experiment *precisely* to challenge the idea that relational properties alone could ground distinctness in a perfectly symmetric universe lacking *any* asymmetric relations or intrinsic differences. He would likely dismiss weak discernibility as missing the point – the relation "is 1 mile from *the other sphere*" depends on the distinctness it's trying to establish.

  **Saunders' Defense & The State of Play:**

  1.  **Formal Logic Doesn't Care:** Saunders (and defenders like Muller, Seevinck) argue that within the formal logical framework, weak discernibility *works*. The spheres satisfy different predicates involving the other sphere. Logic only cares that the properties are well-defined and different, not whether we intuitively "presuppose" distinctness when naming the spheres (A and B). The distinctness *falls out* of the relational structure.
  2.  **"Haeccetism Lite"?** Defenders might argue this isn't full-blown haecceitism (bare numerical difference without qualitative difference). The distinctness *is* grounded in a qualitative feature of the universe – the existence of the irreflexive relation instantiated between them. The universe has the qualitative feature "containing two things 1 mile apart," and this feature necessitates two numerically distinct relata.
  3.  **PII Needs Weakening:** Their conclusion is that Leibniz was *almost* right, but PII needs to be understood as including *all* qualitative properties, including complex relational ones like "is R-related to object X". Black only refutes a naive PII that ignores such relations or demands intrinsic differences. Weak discernibility saves a *plausible* version of PII.
  4.  **Physics Relevance:** This debate isn't just academic. Weak discernibility is crucial in modern physics (especially quantum mechanics regarding identical particles) for defending a form of PII against scenarios remarkably similar to Black's spheres.

  **Why Black's Sphere is Still Taught as a Live Counterexample:**

  1.  **The Circularity Objection Feels Compelling:** To many philosophers, the presupposition objection is decisive. It feels intuitively correct that naming the spheres "A" and "B" to form the discerning relational properties begs the question against Leibniz's strong PII, which aimed to *explain* distinctness without relying on labels or brute numerical difference.
  2.  **Highlighting the Stakes:** Black's case perfectly crystallizes the conflict between a purely qualitative metaphysics (where distinctness must be grounded in discernible differences) and the possibility of brute numerical difference in a symmetric world. Weak discernibility is a sophisticated response, but it arguably changes the rules of the game Leibniz was playing.
  3.  **Debate is Genuinely Unsettled:** There is no philosophical consensus. Respected philosophers line up on both sides. Teaching Black *without* immediately resolving it with weak discernibility forces students to grapple with the deep metaphysical issues of identity, relation, and haecceity. Presenting weak discernibility as the "solution" would prematurely close a genuinely open and profound debate.
  4.  **What "Solved" Means:** In philosophy, "solved" often means "a compelling argument exists," not "everyone agrees." Weak discernibility *is* a compelling argument *for some*. For others, the circularity objection is equally compelling *against* it. Black's case remains "live" because the objections to weak discernibility keep its counterexample force intact *for the specific strong version of PII it targeted*.

  **Conclusion for Your Novel & Understanding:**

  *   **Weak Discernibility is NOT Sleight of Hand:** It's a serious, logically sound proposal defended by significant philosophers (Saunders, Ladyman, etc.). It genuinely rescues *a version* of Leibniz's PII by expanding what counts as a qualitative discernible property to include complex relational properties based on irreflexive relations.
  *   **BUT, It's Controversial:** The circularity/presupposition objection is the major counter-argument. It claims weak discernibility fails to *ground* distinctness in the way Leibniz intended for his strong PII, as it relies on the distinctness it purports to explain when formulating the discerning properties.
  *   **Black's Case Endures:** Precisely because this controversy persists, Black's two spheres remain a powerful teaching tool and a genuine philosophical puzzle. It highlights the tension between relational structure and brute numerical difference. Weak discernibility is a proposed *solution*, but it hasn't definitively *dissolved* the puzzle for everyone. The debate *is* the point.

  **For Your Novel:** This ambiguity is *gold*. Your protagonists *are* weakly discernible via the relation "is growing up on the other sphere from". Yet, the profound mystery and shock of discovering the other sphere stem from the *brute numerical distinctness* that the circularity objection points to. Their existential crisis mirrors the philosophical debate itself. You can explore both angles – the logical discernibility through relation *and* the haunting sense of brute, unexplained "twoness" in a perfectly symmetric void. That's where the deep sci-fi/philosophy resonance lies.
