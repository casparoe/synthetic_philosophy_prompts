  First, I need to unpack both contexts. In the *Grundlagen*, Frege insists that concepts must have clear boundaries to avoid vagueness, which is crucial for his logicism. The Julius Caesar problem shows that his definition of numbers fails this completeness requirement. Now, in his 1924 diary, Frege uses similar language—"distinguishing mark" (Kennzeichen)—to argue for identifying Jews legally. The parallel in terminology is striking.

