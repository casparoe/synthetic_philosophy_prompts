  So I had a long argument with my friend last night thats still bugging me. Two people I know, Sam and Jordan, each sat a close friend down around the same time and gave a pretty blunt talk about their drinking, in basically the same way, with the same read on how bad things had gotten. Sam's talk went great and the friend thanked Sam for it later. Jordan's blew up - the friend felt ambushed, got defensive, and cut off the friendship, seemingly more because of a rough week they were already having than anything about how the talk went. Now Sam gets treated as brave and caring, while Jordan gets treated as tactless and out of line. I think it's weird to judge two basically identical conversations so differently just because of how the other person reacted. My friend says no, Jordan should've read the room better, so that one's on Jordan. Who's actually right - do Sam and Jordan really deserve different amounts of credit and blame, or is Jordan just getting unfairly judged for bad luck?
