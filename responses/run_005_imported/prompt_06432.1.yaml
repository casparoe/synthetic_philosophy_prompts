  I trained and worked as a physicist for nearly forty years, and it is only since retiring that I have had the leisure to read seriously in the philosophy of logic and mathematics. One question I keep returning to is not what the Church-Turing thesis says, but what kind of claim it actually is. In the secondary literature I have come across at least six rival answers: that the thesis is (a) a definitional stipulation, simply fixing what "effectively calculable" is to mean; (b) a substantive empirical hypothesis, falsifiable in principle by a procedure that no Turing machine could capture; (c) a genuine mathematical theorem, provable once "algorithm" is given an independent and sufficiently precise characterization, as Kripke has argued; (d) a Carnapian explication, a proposal to replace a vague pre-theoretic notion with a precise successor, to be judged by fruitfulness rather than by truth; (e) the product of a successful conceptual analysis of idealized human calculation, of the kind Turing himself provided, which would place it somewhere between stipulation and discovery; and (f) quasi-empirical in something like Putnam's sense, its support resting on the inductive convergence of independently motivated formalisms rather than on proof or physical test.

  I would like your own reasoned judgment here, not a survey of who holds which view. Please rank these six characterizations from most to least defensible as an account of the thesis's actual epistemic status. Give your answer as a JSON list, reordering the following six tags from most to least defensible:

