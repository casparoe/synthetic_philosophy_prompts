answer: |-
  You've hit on a crucial and often overlooked distinction. Your skepticism is well-founded: **Aquinas's passage on self-defense *does not* directly address, and its core logic *does not* seamlessly extend to, the "bystander sacrifice" scenario central to the trolley problem variants.** Applying his reasoning requires significant adaptation and introduces elements not present in his text. Let's break this down:

  1.  **Aquinas's Core Claim (Self-Defense Context):**
      *   **Act with Double Effect:** An action can have two outcomes: one intended (good), one unintended but foreseen (bad).
      *   **Intention Defines Morality:** The moral character ("species") of the act is determined by the *intended* effect.
      *   **Permissibility Conditions:**
          *   **Intention:** The *intended* effect must be good (saving one's own life).
          *   **Causal Structure:** The bad effect (killing the aggressor) must *not be the means* to achieve the good effect. The good effect (saving life) flows *directly* from the defensive act itself (repelling force), and the bad effect is a *side consequence* of that repelling force. (This is crucial and often understated in summaries. The aggressor's death isn't *used* as a tool to stop the attack; stopping the attack *causes* the death as a side effect).
          *   **Proportionality:** The force used must be *moderate* and *necessary* for defense. Using excessive violence makes the act unlawful.
          *   **Agent's Relationship:** The defender has a greater duty to preserve their *own* life than the life of the *unjust aggressor* attacking them.

  2.  **The Mismatch with Trolley Bystander Scenarios:**
      *   **No Aggressor/Unjust Threat:** The person on the side track or the footbridge is **not an aggressor**. They pose no threat. They are an *innocent bystander*. Aquinas's argument hinges on the target being an *unjust aggressor* against whom one has a right to proportionate defense. This foundational element is *absent* in the trolley cases.
      *   **The "Means" Problem (Especially Footbridge):** In the footbridge case, pushing the person *is* the means to stop the trolley. Their body is *instrumentalized* to block the trolley. Aquinas's self-defense scenario explicitly avoids this: killing the aggressor is a *side effect* of repelling force, *not the means* used to repel force. The lever case is less clear-cut; diverting the trolley *away* from five *causes* it to hit one as a side effect. The one is not *used as a tool* in the same way as the footbridge victim. This distinction (means vs. side effect) is central to modern DDE applications to trolleys but is only implicitly present in Aquinas's structure.
      *   **Duty of Care:** Aquinas states one has a *greater duty* to one's own life than to the life of the *aggressor*. In the trolley cases, the agent has no special duty to the five *over* the one (or vice versa) – both sets are innocent bystanders. The agent's relationship is symmetrical. Aquinas's reasoning provides no basis for privileging the five lives *at the direct intentional cost* of the one innocent life. The proportionality condition in Aquinas is about the *force used against the aggressor*, not a utilitarian calculation of net lives saved *by sacrificing an innocent*.
      *   **Nature of the Threat:** The threat in Aquinas is a *human aggressor*. In the trolley case, it's a *mechanical threat* (the runaway trolley). Defending against a human agent differs morally (within Aquinas's framework) from intervening in an impersonal disaster.

  3.  **What Aquinas *Does* Provide (The Seeds of DDE):**
      *   The core *structure* of an act having intended good and foreseen but unintended bad effects.
      *   The principle that the *intention* determines the act's primary moral character.
      *   The requirement that the act itself must be *proportionate* to the intended good.
      *   The (implicit but crucial) point that the bad effect cannot be the *means* to the good end. (This becomes explicit in later formulations of DDE).

  4.  **Stretching to Trolleys: The Smuggled Assumptions:**
      Applying Aquinas's self-defense logic to the trolley problem requires importing significant assumptions he doesn't make:
      *   **The Permissibility of Sacrificing an Innocent:** Aquinas's text gives *no warrant* for intentionally harming an *innocent* person as a means or even a side effect to save others. His other writings (e.g., on killing innocents) suggest strong prohibitions. The self-defense justification *specifically relies* on the target being an *unjust aggressor*.
      *   **Utilitarian Proportionality:** Aquinas's proportionality is about *defensive force*, not a cost-benefit analysis of innocent lives. Extending it to "1 life vs. 5 lives" injects a utilitarian calculus foreign to his argument.
      *   **Duty to Save Strangers:** Aquinas discusses defense of *self*. While the principle might extend to defense of *others under attack*, it's a leap to apply it to *preventing impersonal harm* to strangers by sacrificing another innocent stranger. The duty structure is different.
      *   **Clarifying the "Means/Side Effect" Distinction:** Modern DDE formulations applied to trolleys make the "means vs. side effect" distinction explicit and central, especially for differentiating lever vs. footbridge. While Aquinas's structure implies it (the bad effect isn't the means in self-defense), he doesn't articulate it as a general principle applicable outside the aggressor context.

  **Conclusion & Weight-Bearing Capacity:**

  1.  **Aquinas's Actual Claim:** He provides a tightly reasoned justification for *killing an unjust aggressor in necessary, proportionate self-defense (or defense of others)*, where the death is a foreseen but unintended side effect of the defensive act, not the means itself. This is *not* a general theory of sacrificing innocents or bystanders.

  2.  **Weight-Bearing for Trolley Problems:**
      *   **Limited Foundation:** The passage provides the *historical and conceptual foundation* for the Doctrine of Double Effect – the core ideas of intention, double effect, and proportionality. It establishes the *framework*.
      *   **Insufficient by Itself:** **Crucially, it does *not* provide, within this specific text, the resources to directly justify the permissibility of *harming an innocent bystander* in scenarios like the trolley problem.** The absence of the "unjust aggressor" element is fatal to a direct application.
      *   **Requires Significant Adaptation:** To use Aquinas's *structure* for trolley problems, modern ethicists (like Philippa Foot who explicitly linked them to DDE, and Judith Jarvis Thomson) had to:
          *   Generalize the principle beyond the aggressor context.
          *   Explicitly articulate and emphasize the "means vs. side effect" distinction.
          *   Reinterpret proportionality in a more utilitarian light (net lives saved).
          *   Argue that the duty to preserve life *in general* can sometimes permit causing foreseen harm to innocents as a side effect (lever), but not as a means (footbridge), under strict conditions.
      *   **Explanatory Power (with Caveats):** When *adapted* with these extensions, the DDE framework *does* provide a coherent explanation for the intuitive difference many people feel between the lever case (side effect) and the footbridge case (means). Aquinas's passage is the *seed* of this explanation. However, invoking Aquinas's *specific text* as the *direct* justification for trolley judgments is **misleading**. It papers over the critical difference between defending against an aggressor and sacrificing an innocent bystander.

  **In essence:** Aquinas gives us the core *structure* of double effect reasoning within the specific, justified context of self-defense against an aggressor. This structure *inspired* the modern DDE used to analyze trolley problems. **However, the trolley problem applications, especially concerning bystanders, rely on significant extensions and modifications of Aquinas's specific argument. His passage provides the blueprint, but not the complete, ready-made building for the trolley bystander dilemma.** Your instinct that stretching it to bystanders smuggles in key assumptions (like the permissibility of collateral damage to innocents outside the aggressor context) is absolutely correct. Understanding Aquinas requires recognizing the specific, constrained nature of his argument in this passage.
