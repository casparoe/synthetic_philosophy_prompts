  The user also questions if the DDE, as presented, can handle bystander cases. Aquinas's conditions focus on intention and proportionality within self-defense. Applying this to trolley problems might stretch his principles, especially the permissibility of harming innocents. Modern DDE adaptations add elements like the means/effect distinction, which Aquinas didn't explicitly outline.

