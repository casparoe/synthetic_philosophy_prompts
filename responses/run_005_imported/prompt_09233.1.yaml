answer: |-
  Here’s a toast that honors Russell’s insights on companionship while sidestepping his personal life and controversial views, tailored for a mixed audience. It runs about 4.5 minutes when spoken warmly:

  ---

  **(Raise glass, smile warmly at Marisa and partner)**  

  "Marisa, [Partner’s Name], friends and family… if you’d told me ten years ago that I’d be quoting Bertrand Russell at Marisa’s wedding, I’d have assumed it was to roast her about that time she tried to explain logical positivism at 2 AM during finals week. **(Light laughter)** But here we are. And it’s actually deeply fitting.  

  You see, back when Marisa and I were college roommates, I gave her a book – Russell’s *Marriage and Morals*. And while parts of it feel… *very* 1929 **(knowing glance to philosophy corner)**, there’s something in it that’s always stuck with her. And watching her and [Partner’s Name] build their life together, I finally understand why.  

  Russell argued something radical for his time: that the *real* anchor of a lifelong marriage isn’t the dizzying romance of the early days – though that’s wonderful! – and it isn’t some mythical, all-consuming passion that burns forever unchanged. He thought that stuff, lovely as it is, tends to mellow. And that’s okay.  

  **No, Russell believed the deepest strength of marriage lies in something quieter, sturdier, and far more profound: the daily, unglamorous, deeply human project of building a shared life.** The routines, the inside jokes over burnt toast, the way you navigate IKEA without a map, the way you show up for each other’s terrible days and celebrate the tiny victories. The ‘thick’ bond woven from a thousand shared moments, responsibilities, and dreams.  

  He was especially skeptical of what we often call ‘natural’ jealousy – the idea that possessiveness is just an inevitable part of love. Russell looked across history and cultures and saw something else: that much of our jealousy is tangled up with old ideas about ownership, not the essence of partnership. **What he saw as truly ‘natural’ – and necessary – was trust. The trust that lets two people become a team, facing the world together, not policing each other’s every move.**  

  **(Pivot warmly to the couple)**  

  And Marisa, [Partner’s Name]… that’s *you*. Anyone who knows you sees it. There’s a profound steadiness here. You don’t perform your relationship; you just *live* it. You’ve built something grounded in mutual respect, practical kindness, and a shared vision for your future. You handle life’s inevitable bumps not with drama, but with quiet teamwork and a shared dry wit. You’ve already mastered the art of the unglamorous partnership – the foundation Russell thought was everything.  

  You understand that love isn’t just a feeling you fall into; it’s a structure you build, brick by brick, day by day. It’s choosing each other, not just in the grand gestures, but in the ordinary moments. It’s knowing that your partner is your safe harbor and your co-adventurer in building a meaningful life.  

  **(Raise glass higher)**  

  So, here’s to Marisa and [Partner’s Name]. May your shared project always be under construction, filled with laughter, understanding, and maybe slightly fewer IKEA trips. May you continue to nurture that rare, sturdy trust that lets you grow *together*. And may your marriage be a testament to the enduring power of partnership – the kind built not just on fleeting passion, but on the deep, lasting work of building a life, side by side.  

  To the architects!"  

  **(Clink!)**  

  ---

  **Why This Works:**  

  1.  **Focuses on the Enduring Idea:** Centres entirely on Russell's core, defensible thesis about companionship > passion and jealousy as socially constructed.  
  2.  **Acknowledges Datedness Smoothly:** "Parts feel very 1929" is a gentle, humorous nod to the philosophers without detailing *why*. It signals awareness without engaging specifics.  
  3.  **Celebrates the Couple:** Uses Russell’s framework purely as a lens to praise Marisa and her partner's observable strengths (steadiness, teamwork, low drama, practicality).  
  4.  **Defuses Jealousy/Infidelity:**  
      *   Explicitly frames Russell's view as being about **trust** ("The trust that lets two people become a team") as the antidote to problematic jealousy.  
      *   Praises the couple for embodying **that trust**, not any tolerance for lapses.  
      *   Uses "possessiveness" and "ownership" as the negatives, aligning with Russell's critique without touching his permissiveness.  
  5.  **Accessible Language:** Explains concepts simply ("daily, unglamorous project," "shared moments," "quiet teamwork") using relatable examples (IKEA, burnt toast). No jargon.  
  6.  **Warmth First:** Starts and ends with genuine affection for the couple. Russell is the *explanation* for their admirable qualities, not the star.  
  7.  **The "Wink":** The "very 1929" comment and the emphasis on *their* steadiness ("You don’t perform your relationship; you just *live* it") contrast implicitly with Russell's own volatility, satisfying the philosophers without saying it aloud.  
  8.  **No Biography:** Russell appears solely as the author of an idea Marisa values. His life is irrelevant to the point being made about *this couple*.  

  **Delivery Tip:** Keep the tone warm, sincere, and slightly conversational. Pause for the light laugh after "logical positivism at 2 AM." Make strong eye contact with the couple during the section praising their specific qualities. The "knowing glance" should be quick and subtle. This toast makes Russell's useful insight serve *their* love story, which is exactly what a good toast should do.
