answer: |-
  You've hit on two absolutely fundamental tensions in the Hume-Lewis lineage – tensions that are central to modern debates about norms and conventions. Let's break this down systematically, addressing both your core questions with enough detail to arm you for Thursday:

  **1. Hume's "Convention" & The Normativity Question: Earned or Smuggled?**

  Hume is indeed stretching the term "convention" far beyond explicit agreements or promises. His core argument is that normativity (the "ought") emerges *immanently* from the self-interested coordination equilibrium itself, coupled with the *mutual expression* of the sense of common interest. Here's the earning mechanism:

  *   **The Core Equilibrium:** Hume identifies a situation of pure coordination (like rowing) or partial conflict (like respecting possession) where there exists at least one outcome (synchronous rowing, mutual respect for property) that is *mutually advantageous* compared to the alternatives (chaotic rowing, constant conflict over possessions). This is the fundamental coordination equilibrium/coincidence of interest.
  *   **Mutual Expression & Mutual Awareness:** Crucially, Hume doesn't *just* posit this equilibrium. He insists the sense of common interest is "mutually express'd, and is known to both." This is key. It's not just that each person privately sees the benefit; they *signal* this understanding to each other through their *behavior* (starting to row in a particular rhythm, refraining from taking the other's goods). This mutual expression creates a shared awareness: *I know you see the benefit, you know I see the benefit, and we both know the other knows*. This is proto-common knowledge, built through action and observation, not language.
  *   **The Birth of the "Ought" - Reliance and Harm:** The normativity arises precisely from this mutual awareness within the equilibrium. Once the pattern is established and mutually recognized:
      *   **Reliance:** Each actor comes to *rely* on the other continuing the pattern. The rower *expects* the other to keep time; the property holder *expects* others to respect their possessions.
      *   **Harm of Defection:** If one actor unilaterally defects (stops rowing in sync, seizes the other's goods), they directly *harm* the interests of the other actor who was relying on the pattern. The rower is jolted or the boat stalls; the property holder is deprived.
      *   **The "Ought" as a Functional Imperative:** The "ought" ("you ought to keep rowing in time", "you ought to respect possession") is fundamentally a statement about the *functional necessity* within the mutually recognized and relied-upon system for achieving the common interest. Defecting isn't just suboptimal *for you*, it actively *harms me* given my justified reliance based on our mutual expression and established practice. Hume grounds the normativity in the *disappointed expectations and inflicted harm* caused by unilateral defection within a mutually beneficial and mutually recognized pattern. It's a practical, interest-based "ought," not necessarily a moral one *yet* (though Hume builds justice upon it).
  *   **"Convention" as Label:** Is Hume overloading the term? Yes, deliberately. He's arguing that the *essence* of what makes something a convention – a mutually recognized, mutually beneficial pattern of behavior that creates expectations and norms – is present *even without* explicit promises or agreements. The rowing example is his starkest case to demonstrate that essence in its purest form. The label "convention" is justified *because* of the structure of mutual expectation and reliance generated by the mutually expressed sense of common interest within the coordination equilibrium.

  **Conclusion on Normativity:** Hume *does* earn the normativity for this specific, ground-level "ought." He doesn't smuggle it in; he derives it directly from the *harm caused by defection* within a mutually recognized and relied-upon coordination equilibrium established through mutual expression of interest. It's a normativity born of disappointed expectations and frustrated interests within a cooperative framework. Whether this *fully* accounts for the rich normativity of *moral* conventions like justice is a further question (Hume thinks it's the foundation), but for the core coordination "ought" in cases like rowing or initial possession stability, his account is coherent and earned.

  **2. Hume's Gradualism vs. Lewis's Static Rationalism: Convergence or Swap?**

  This is where the friction is most apparent, and your reading is spot-on. The resolution lies in understanding Lewis's model as characterizing the *equilibrium state itself*, while Hume provides a *dynamic account of how societies might arrive at such a state*. Lewis is largely silent (in *Convention*) on the *genesis*; Hume is focused precisely on that genesis.

  *   **Hume's Gradualist, Evolutionary Process:**
      *   **Repeated Interaction & Learning:** Hume emphasizes "repeated experience of the inconveniences of transgressing." Individuals interact repeatedly in situations requiring coordination (e.g., repeated encounters over possessions, repeated need to row boats).
      *   **Trial, Error, & Reinforcement:** Initially, behavior is uncoordinated and leads to bad outcomes (inconveniences, conflict). Through trial and error, patterns emerge that yield better results (synchronous rowing, respecting *de facto* possession). The success of these patterns reinforces them.
      *   **Emergence of Expectations & Confidence:** As successful patterns recur, individuals observe that others *also* tend to follow them. This builds "confidence of the future regularity of their conduct." This confidence *is* the gradual, experience-based accumulation of mutual expectations.
      *   **No Blueprint, No Moment of Agreement:** Crucially, there's no founding moment, no contract, no explicit agreement. The convention emerges "insensibly," "by slow progression," through the aggregation of individual responses to experienced rewards (avoiding inconveniences) and punishments (suffering them). It's a paradigmatic example of an unintended order.
      *   **The Role of "Mutual Expression":** In this gradual process, "mutual expression" isn't a single act of declaration. It's the *ongoing behavior itself* – consistently rowing in a way that invites coordination, consistently respecting possessions – that signals the sense of common interest and builds mutual recognition *over time*.

  *   **Lewis's Static, Rationalist Characterization:**
      *   **Focus on the Equilibrium State:** Lewis is primarily concerned with defining what a convention *is* at a given moment. What makes a behavioral regularity a convention rather than just a coincidence?
      *   **Common Knowledge as the Defining Feature:** His answer hinges on a specific epistemic state: *Common Knowledge* (CK) of the rationality, preferences, and the regularity itself. Each agent knows the regularity exists, knows others know, knows others know they know, and so on *ad infinitum*. Crucially, each knows that *given this common knowledge*, it's rational for everyone to conform (because it's a coordination equilibrium).
      *   **An Idealization, Not a Genesis:** Lewis explicitly states CK is an idealization (Ch. II, Sec. 1). It's a *model* of the perfect mutual awareness that *sustains* the convention once established. It's not a claim about how real humans *achieve* that state cognitively. It's a characterization of the *logic* of convention.
      *   **Rationality as a Presupposition:** Lewis assumes agents are rational and have the relevant preferences. His model shows *if* CK of these facts obtains, *then* conformity is the rational solution. He doesn't explain *how* agents become rational or develop the relevant preferences (e.g., learning to prefer coordination through Humean experience).

  *   **Bridging the Gap: Lewis Characterizes Hume's Endpoint**
      *   **Hume's "Confidence" as Proto-CK:** Hume's endpoint – the state where there is "confidence of the future regularity of their conduct" built on "repeated experience" that "the sense of interest has become common to all our fellows" – *is* essentially describing a real-world, fallible, psychologically plausible *approximation* of Lewis's CK. After many successful interactions, each rower has extremely high-order, justified expectations about the other: "I know he'll keep time; I know he knows I'll keep time; I know he knows I know... and we're both right because we've done it a hundred times." It's CK *born of experience*, not abstract reasoning.
      *   **Lewis Formalizes the Equilibrium Logic:** Lewis takes the *structure* of the stable state Hume describes (mutual expectations sustaining a mutually beneficial pattern) and formalizes its epistemic and rational prerequisites *in their purest, most stringent form*. He provides the game-theoretic anatomy of the convention *state* that Hume's process *evolves towards*.
      *   **Hume Explains How We Get There; Lewis Explains What It Is When We Have It:** Hume provides the dynamic, evolutionary account of convention *formation* through learning and reinforcement. Lewis provides a static, rationalist analysis of convention *maintenance* once formed, under idealized conditions. They are complementary perspectives on the same phenomenon, focusing on different phases/aspects.
      *   **Did Lewis Swap Phenomena?** Not really. He kept Hume's core insight – conventions are solutions to coordination problems sustained by mutual expectations – but abstracted away from the messy historical/psychological process of formation to rigorously define the properties of the solution concept itself. He uses Hume's *label* ("convention") and core *examples* (rowing, property, money, language) precisely because he sees his model as capturing the *essence* of what Hume was pointing at with his gradualist story. Lewis's model *is* the "suitable resolution and behaviour" Hume mentions, fully specified.

  **Your View for Thursday:**

  1.  **On Normativity:** Argue that Hume *does* earn a specific, ground-level "ought" in his convention. It arises from the *harm* inflicted by unilateral defection within a mutually recognized and relied-upon coordination equilibrium established through the mutual expression (via behavior) of common interest. This "ought" is practical and interest-based, rooted in the frustration of expectations and the causation of direct inconvenience/harm. The label "convention" is justified by the structure of mutual expectation and reliance, even without promises.
  2.  **On Hume/Lewis:** Frame it as complementary. Hume gives us a brilliant, proto-evolutionary account of *how* conventions arise gradually through repeated interaction, learning from "inconveniences," and the slow build-up of mutual confidence (expectations). Lewis, inspired by Hume, provides a precise, static, game-theoretic characterization of the *equilibrium state itself* that such a process converges upon, defining it in terms of coordination equilibria sustained by common knowledge (an idealization of Hume's "confidence"). Lewis didn't swap phenomena; he formalized the endpoint Hume described. The apparent tension between gradualism and common knowledge resolves when seeing CK as the *idealized structure* of the mutual awareness that Hume's process *empirically builds*.

  **Key Quote for Your Presentation:**
  Hume himself provides the bridge: "this experience assures us still more, that the sense of interest has become common to all our fellows, **and gives us a confidence of the future regularity of their conduct.**" *This "confidence" is the experiential, psychological foundation upon which Lewis builds his formal concept of Common Knowledge.* Hume explains the genesis of the confidence; Lewis analyzes the logic of the state that confidence aims at (and often achieves in practice).

  This should give you a solid, defensible position that acknowledges both the power of Hume's gradualism and the clarifying rigor of Lewis's model, while resolving the apparent tensions. Good luck on Thursday! Your reading group sounds fantastic.
