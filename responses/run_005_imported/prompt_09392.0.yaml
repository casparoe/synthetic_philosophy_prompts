prompt: |-
  so I'm working through my comps reading list on classical Chinese philosophy rn and I'm stuck on Gongsun Long's white horse dialogue (the School of Names guy). Everyone always quotes the "white names the color, horse names the shape" line like that's the whole argument, but there's a follow-up move later in the dialogue that's doing more of the real work imo, and its the part that actually trips me up:

  Objector: If there are white horses in the world, you can't say there are no horses — and if you can't say there are no horses, doesn't that mean there ARE horses? Having a white horse just is having a horse.
  Gongsun Long: If someone asks for "a horse," a yellow or black horse satisfies the request. If someone asks for "a white horse," a yellow or black horse will not do. If "white horse" just were "horse," what's being asked for in both cases would be the same thing — but it obviously isn't, since yellow and black horses answer to one request and not the other. That's why the white horse is not the horse.

  (paraphrasing this from memory/my notes, so don't quote me on the exact wording)

  Can you help me untangle what's actually going on logically in that second move? Is Gongsun Long just sliding between intension and extension (or between predication and identity) to make the trick work, or is there a more charitable reading where he's onto something real about reference and class-inclusion? Also curious why some scholars want to treat this as proto-logic - like an early brush with type/token or part/whole confusions - instead of just calling it sophistry.
