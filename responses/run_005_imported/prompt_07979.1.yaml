answer: |-
  Here’s the dialogue-focused scene, grounded in philosophy of mind (specifically theories of intentionality and teleosemantics), with both characters holding their ground and referencing prior debates:

  ---

  **HALLOWAY:** (Leaning against a lab console, staring at bio-readouts of Duplicate-Wren)  
  It’s still the core problem, Reyes. When she looks at her brother and *feels* recognition—what is that state *about*? Nothing. It’s a perfect facsimile of intentionality with no history to ground it. Like a map drawn without ever surveying the territory.  

  **REYES:** (Not looking up from her microscope)  
  Spare me the poetry, Halloway. Her neural state *now* triggers the same affective response, the same behavioral outputs as the original’s would. If it quacks like a duck *and* makes everyone else react like it’s a duck—  

  **HALLOWAY:**  
  —It’s still not *referring* to a duck! Causation isn’t magic. A mental state gets to be *about* something because it was shaped by that thing over time. Tracking, error-correction, feedback loops. Her “memories” weren’t formed by experience; they were stamped in by a stellar anomaly. No causal history, no content. Just syntax.  

  **REYES:** (Snaps her head up)  
  Syntax is all we ever *have*! You’re chasing ghosts. If her “memory” of her mother’s laugh fires the same synapses, releases the same neurotransmitters, and—crucially—makes her *act* as if her mother laughed in specific contexts, then functionally, it *is* a memory. What else could “aboutness” possibly be *but* that functional role?  

  **HALLOWAY:**  
  The *pedigree* matters! Take a belief. Suppose Original-Wren believed the hydroponics bay was Deck 7 because she’d been there, learned it. That belief was causally regulated by the actual layout. Duplicate-Wren’s “belief” is identical, but it popped into existence unregulated by any external state. It’s inert. Lucky true, maybe, but not *about* Deck 7.  

  **REYES:**  
  So if I scan Original-Wren’s brain state for "Deck 7 = Hydroponics" and perfectly replicate it in a vat tomorrow, that vat-brain’s state isn’t *about* hydroponics? Even if it could guide a robot to water the plants? That’s mystical essentialism! You’re saying meaning lives in the *dust of the past*, not the wiring of the present.  

  **HALLOWAY:**  
  It lives in the *dispositional history*! The vat-brain state *wasn’t selected for* tracking hydroponics. It was selected for nothing! It’s a cosmic accident mimicking a representational state. Without the historical connection—the teleology—it’s not reference; it’s coincidence. Like a parrot squawking "fire!" without ever encountering flame.  

  **REYES:** (Slams a drawer shut)  
  Bad analogy. The parrot hasn’t got the *full functional architecture*. Duplicate-Wren does! Her “memory” integrates with her other cognitive states: it informs her expectations, her grief, her plans. She *predicts* her brother will like the same tea he did ten years ago. If that’s not “tracking,” what is?  

  **HALLOWAY:**  
  Prediction based on what? Not on past interactions with her brother! On data she never gathered. It’s a closed loop—her states only “refer” to other internal states copied from the original’s snapshot. They don’t hook onto the *actual* brother, the *actual* past. They’re self-contained echoes.  

  **REYES:**  
  But they *do* hook onto the brother *now*! When she sees him, her visual cortex feeds data into those “memory” networks, updating them. The system *engages* with the world. That’s real-time causal interaction—the only thing that ever gave the *original* states meaning!  

  **HALLOWAY:**  
  Engagement built on a foundation of sand! Her “recognition” isn’t sensitive to *his* historical properties, only to his current resemblance to the template in her head—a template that never developed through interaction with *him*. It’s reference by resemblance, not by causal chain. Like mistaking a statue for a person because it looks identical.  

  **REYES:**  
  You keep adding epicycles, Halloway. If the statue weeps, embraces you, and recounts private jokes only you and the original shared—functionally, for all *intersubjective* purposes, it’s referring! Meaning isn’t a ghost in the machine; it’s the machine’s operation in the world. Her states cause appropriate behaviors *now*. That’s all reference ever was for the rest of us.  

  **HALLOWAY:**  
  Then you’ve reduced meaning to behaviorism. Congratulations. But ask yourself this: what happens when her “memory” is *false*? Original-Wren misremembered the color of her childhood blanket. Does Duplicate-Wren have a false memory? Or just an empty state *mimicking* a false memory? There’s nothing it fails to correspond *to* because it never corresponded in the first place!  

  **REYES:**  
  Semantic nihilism. If it walks like a false memory and talks like a false memory—if it causes her the same regret or embarrassment the original would feel—then it *is* a false memory. The “falseness” is in its failure to cohere with *other* verified states or testimony *now*, not in some mythical past connection. You can’t have error without a *current* standard.  

  **HALLOWAY:** (Pushing off the console)  
  And you can’t have *intentionality* without a history of selection for function. Her states weren’t *supposed* to do anything. They just *are*. It’s not philosophy, Reyes; it’s physics playing dress-up with a ghost.  

  **REYES:** (Turning back to her scope, voice clipped)  
  And your “ghost” is just entropy with tenure, Halloway. Run your seminar. I’ve got a consciousness to empirically verify. Again.  

  ---

  **Key Philosophy Engaged:**  
  - **Halloway** argues for a **teleosemantic** or **causal-historical** theory of mental content (e.g., Millikan, Dretske): A state is about X only if it has the *proper function* of tracking X, developed through historical selection (evolution, learning).  
  - **Reyes** argues for **functional role semantics** or **causal presentism** (e.g., early Putnam, machine functionalism): Meaning is defined by a state’s current causal relations to inputs, outputs, and other states—its *functional role* in the system.  
  - **Tensions Explored:**  
    - **Original vs. Duplicate Intentionality:** Can identical neural states have different content based on origin?  
    - **Error Conditions:** Can a duplicate have *false* beliefs/memories without a history of formation?  
    - **"Hook-Up" Problem:** Does meaning require ongoing causal interaction with the referent, or is resemblance + current function sufficient?  
  - **Neither Wins:** Halloway exposes the "no history, no error" hole in functionalism; Reyes highlights the practical irrelevance of pedigree if the system behaves indistinguishably. Both positions have well-established defenses and flaws in real philosophy of mind.
