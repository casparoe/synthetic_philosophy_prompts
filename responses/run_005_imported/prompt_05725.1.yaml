     - This is a bit problematic. Lewis does argue that the past cannot be changed (because it's fixed), but he does allow that time travelers can affect the past. 
     - In fact, Lewis says that time travelers do affect the past: they are part of the past. For example, Tim's appearance in the past and his attempt (even if it fails) are events that do occur in the past and are part of it. 
     - Lewis's point is that you cannot change the past (because it's already set) but you can affect it in the sense that your actions in the past are part of what makes the past what it is. However, any action that would change the past (like killing Grandfather) is not compossible with the actual past and hence cannot occur.
