prompt: |-
  For my seminar on formal epistemology, I've been comparing David Lewis's Principal Principle—that credence in a proposition should match its known objective chance—with Bas van Fraassen's Reflection Principle, which requires current credence to defer to one's own anticipated future credence. Several commentators treat these as two instances of a single, more general norm of "expert deference," and I'd like your help assessing that claim: what, precisely, does each principle add to the bare idea of deferring to an expert, and are the two really on a par? In particular, memory-loss cases such as Sleeping-Beauty-style scenarios are often presented as counterexamples to Reflection without posing any obvious analogous threat to the Principal Principle. Can you explain this asymmetry, and say whether it reflects a genuinely different justification behind each principle, or only a technical difference in how they are formulated?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're working on a seminar about formal epistemology, specifically comparing Lewis's Principal Principle and van Fraassen's Reflection Principle. The core question is whether these two principles are instances of a more general norm of expert deference and why memory-loss cases like Sleeping Beauty challenge Reflection but not the Principal Principle.

  First, I need to recall the basics of both principles. The Principal Principle (PP) deals with aligning credence with known objective chances. For example, if you know a fair coin has a 50% chance of landing heads, your credence should be 0.5. It's about deferring to objective chances as experts. On the other hand, the Reflection Principle requires that your current credence match your anticipated future credence. So, if you expect to believe something with a certain credence tomorrow, you should believe it now. Both are framed as deferring to experts: chance for PP, and your future self for Reflection.

  The user mentions that some commentators see both as instances of expert deference. I should examine what each principle adds to the bare idea of deference. For PP, the expert (chance) is external and objective, with a specific functional role—calibrating credences based on symmetries or frequencies. The expert's authority comes from its connection to truth. Reflection's expert is your future self, who has more information. The key here is that the future self is better informed, which is why deference is rational.

  Now, the asymmetry in memory-loss cases. Sleeping Beauty is a classic counterexample to Reflection. In this scenario, Beauty is put to sleep and woken up once or twice based on a coin toss. When she wakes up, she doesn't know if it's the first or second awakening. If she applies Reflection, her current credence (upon waking) should align with her anticipated future credence (after learning it's Monday, for example). But upon waking, her credence that the coin landed heads is 1/3, while after learning it's Monday, it's 1/2. Reflection would require her current credence to be 1/2, but intuitively, it should be 1/3. This violates Reflection without affecting PP, since the chance of heads remains 1/2.

  Why doesn't PP face the same issue? Because PP defers to the known chance, which doesn't change. The coin's chance is still 1/2 regardless of memory loss. But Reflection relies on the future self having more information. In Sleeping Beauty, when she learns it's Monday, she gains information that eliminates the possibility of being in the Tuesday awakening. Her future self isn't just better informed; she has information that the current self lacks, making deference rational only if no information loss occurs.

  The deeper issue is that Reflection assumes the future self is epistemically superior. But in memory-loss scenarios, the future self might have different information but not necessarily more. The current self has unique information (e.g., the experience of just waking up) that the future self loses once they know it's Monday. So, the future self isn't a total expert because they lack the current context.

  This points to a difference in justification. PP is grounded in metaphysics—chances as objective features of the world. Reflection is more about rationality and coherence over time, assuming no information loss. The Sleeping Beauty problem exposes that Reflection requires no epistemic degradation, which isn't always true.

  The user might also be interested in whether these principles are truly on par. While both involve deference, their experts differ fundamentally. PP's expert is static and external; Reflection's is dynamic and internal. The asymmetry in counterexamples highlights that their conditions for valid deference aren't the same. PP's authority comes from objective truth-making, while Reflection's relies on informational superiority, which can be compromised.

  In conclusion, the asymmetry arises because Reflection's validity depends on the future self having strictly more information, which memory-loss scenarios violate. PP doesn't have this dependency. This suggests different justifications: PP is metaphysical, while Reflection is about rational coherence with a caveat of no information loss. They aren't entirely on par due to these foundational differences.
answer: |-
  Your query cuts to the heart of a key debate in formal epistemology. Let's dissect the "expert deference" analogy, clarify what each principle adds to the bare notion, explain the Sleeping Beauty asymmetry, and assess whether the principles are truly on par.

  ### Core Principles & Their "Expert" Components
  1. **Principal Principle (PP)**  
     *Formulation*: Cr(A | ch(A) = x ∧ E) = x  
     *Where*: Cr = credence, ch = objective chance, E = admissible evidence.  
     *Expertise Added*:  
     - **Metaphysical calibration**: PP treats chance as an *objective truth-maker*. Deferring to chance is rational because chances (when known) are *causal-dynamic facts* that constrain rational credence.  
     - **Admissibility constraint**: E must not contain "inadmissible" information (e.g., future histories undermining the chance setup).  
     - **Justification**: Grounded in the *metaphysical role* of chance—e.g., as a summary of physical symmetries or frequencies in indeterministic systems.

  2. **Reflection Principle (RP)**  
     *Formulation*: Crₜ(A | Crₜ₊ₛ(A) = x) = x  
     *Where*: Crₜ = credence at time t, Crₜ₊ₛ = anticipated future credence at t+s.  
     *Expertise Added*:  
     - **Temporal coherence**: RP treats your future self as an "epistemic improvement" expert. Deference is rational only if you expect *no epistemic degradation* (e.g., no memory loss, no irrationality).  
     - **Conditionalization link**: RP assumes your future self updates via *rational conditionalization* on new evidence.  
     - **Justification**: Rooted in *diachronic rationality*—anticipating coherence with your better-informed future self.

  ### The Asymmetry: Sleeping Beauty & Memory Loss
  **Sleeping Beauty (SB) Scenario**:  
  - Beauty knows a fair coin (ch(heads) = 0.5) will be tossed.  
  - If heads: she wakes once (Monday).  
  - If tails: she wakes twice (Monday and Tuesday), with amnesia between.  
  - Upon waking: **Crₙₒ𝓌(heads) = 1/3** (standard solution).  
  - On Monday night (after learning it's Monday): **Crₜₒₘₒᵣᵣₒ𝓌(heads) = 1/2**.  

  **Why RP Fails**:  
  - RP demands Crₙₒ𝓌(heads | Crₜₒₘₒᵣᵣₒ𝓌(heads) = 0.5) = 0.5.  
  - But Beauty's actual Crₙₒ𝓌(heads) is 1/3 ≠ 0.5.  
  - **Cause**: *Epistemic degradation*. Her future self (Monday night) lacks the unique indexical information ("I am waking now in an amnesia episode") that defines her current epistemic state. RP’s "expert" (future self) is not superior—it has *less context* about temporal location.  

  **Why PP Holds**:  
  - PP only constrains Cr(heads | ch(heads)=0.5 ∧ E).  
  - E (e.g., "the coin is fair") remains admissible.  
  - The chance *itself* doesn’t change—it’s a fact about the coin toss. Memory loss doesn’t alter ch(heads)=0.5.  

  ### Key Differences in Justification  
  | **Aspect**               | **Principal Principle**                     | **Reflection Principle**               |  
  |--------------------------|--------------------------------------------|----------------------------------------|  
  | **Expert’s nature**      | External, objective, metaphysical          | Internal, subjective, temporal         |  
  | **Authority source**     | Truth-tracking (chances constrain outcomes) | Informational superiority (future self knows more) |  
  | **Failure condition**    | Inadmissible evidence (e.g., oracle truths)| Epistemic degradation (e.g., amnesia)  |  
  | **Core justification**   | Metaphysical calibration                   | Diachronic rationality                 |  

  ### Are They Truly Instances of a Single Norm?  
  - **Superficial parity**: Both can be framed as "defer to expert probability assignments," but this masks deep differences.  
  - **Critical divergence**:  
    - PP’s expert is **static and impersonal** (chance is fixed).  
    - RP’s expert is **dynamic and personal** (future self evolves).  
  - **Asymmetry in vulnerability**:  
    Memory-loss cases exploit RP’s *diachronic* structure—where the "expert" loses access to context—but leave PP unscathed because chances are *atemporal*.  

  ### Conclusion: Not on Par, Due to Foundational Differences  
  The asymmetry reveals that PP and RP are **not two species of the same genus**. PP is a bridge between *metaphysics and epistemology*; its force derives from objective features of the world. RP is a constraint on *temporal self-coherence*; its force depends on assumptions about epistemic continuity. The Sleeping Beauty paradox isn't just a "technical" counterexample—it exposes RP’s reliance on an idealization (no information loss) absent in PP. Thus, while both principles involve deference, their justifications and domains of applicability are fundamentally distinct.  

  **Recommendation for your seminar**: Frame the "expert deference" analogy as a useful heuristic for introducing both principles, but emphasize that their conflation obscures critical differences in how they handle time, information loss, and metaphysical grounding. The SB case is a litmus test for this asymmetry.
