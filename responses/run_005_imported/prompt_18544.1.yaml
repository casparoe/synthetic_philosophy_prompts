  Hmm, undermining futures are futures that the current chance assigns positive probability to, but if they happened, they'd make the current chance different. That seems contradictory. The user wants to know why this threatens the Principal Principle's consistency. So, I need to explain the contradiction step by step. Let's say the current chance of A is x, but there's a future F that would make the chance not x. If F happens, the chance wasn't actually x. But the Principal Principle tells you to set credence to x even when considering F. That leads to a situation where credence can't be both x and not x. 

  Then Lewis's solution is to call information about undermining futures inadmissible. That means you don't condition on them when applying the Principal Principle. But the user is questioning whether this is principled or just an ad hoc fix. I should think about why Lewis considers it principled. His idea is that chances should guide rational expectations, so information that undercuts the chance itself isn't admissible. But critics might say it's circular because admissibility is defined in terms of chance. 

  Wait, the user might be a philosophy student or someone interested in metaphysics. They probably want a clear explanation but also a critical perspective. The deeper need could be understanding the debate around Humean supervenience and whether Lewis's solution holds up. I should mention both sides: Lewis's argument about the role of chances versus the circularity concern. Also, note that this ties into broader issues in philosophy of probability and metaphysics. 

  Need to make sure the explanation is thorough but not too technical. Use examples like coin tosses to illustrate undermining futures. Emphasize the contradiction in the probabilities. For the admissibility part, clarify that Lewis is trying to preserve the normative role of chances. The evaluation should balance his principled reasoning against the potential circularity. Conclude that while Lewis provides a consistent framework, the debate is ongoing, which shows the complexity of aligning chance with rationality.
answer: |-
  David Lewis's Principal Principle (PP) and his Humean supervenience thesis create a profound tension due to "undermining futures." Here's a breakdown of the problem, Lewis's solution, and an evaluation:

  1.  **The Threat of Inconsistency:**
      *   **Humean Supervenience (HS):** Chances are not fundamental properties. The chance of an event at time *t* is entirely determined by the **entire** pattern of particular occurrences (events, facts) throughout the *whole* of space-time history, including events *after t*.
      *   **Undermining Futures:** Consider the proposition `Cht(A) = x` (the chance of A at time t is x). According to HS, `Cht(A) = x` supervenes on the entire global pattern of events, call it `H`. Now, there might be a *possible future continuation* `F` starting from t, such that:
          *   **The present chance of F is positive:** `Cht(F) > 0`. (The current chance theory assigns non-zero probability to F happening).
          *   **F undermines `Cht(A) = x`:** If F *were* to occur, the *actual* global pattern `H` would be different. Crucially, under HS, this different global pattern `H'` (which includes F) would make the proposition `Cht(A) = x` **false**. Instead, it would make some different chance proposition `Cht(A) = y` (where y ≠ x) true.
      *   **The Contradiction:** Apply the PP twice:
          *   **Step 1:** Conditional on `Cht(A) = x` and no inadmissible evidence, PP dictates: `Cr(A | Cht(A) = x) = x`.
          *   **Step 2:** Consider the undermining future F. Conditional *just* on `Cht(A) = x`, F has a positive chance `Cht(F) > 0`. PP also seems to dictate (if F is admissible relative to `Cht(A) = x`) that your credence in F given `Cht(A) = x` should be `Cht(F) > 0`: `Cr(F | Cht(A) = x) = Cht(F) > 0`.
          *   **Step 3:** Now, conditional on `Cht(A) = x` *and* `F`, what should your credence in A be? Since F undermines `Cht(A) = x`, if F is true, then `Cht(A) = x` is false. In fact, given F and HS, the true chance is `Cht(A) = y` (y ≠ x). Applying PP again: `Cr(A | Cht(A) = x & F) = Cr(A | True chance is y) = y` (assuming no other inadmissible evidence).
          *   **The Problem:** This creates a direct contradiction with Step 1:
              *   From Step 1: `Cr(A | Cht(A) = x) = x`
              *   From Step 3: `Cr(A | Cht(A) = x & F) = y` (and y ≠ x)
              *   But F is *possible* given `Cht(A) = x` (Step 2: `Cr(F | Cht(A) = x) > 0`). Therefore, the credence in A given `Cht(A) = x` *must* be a weighted average of the credence in A given `Cht(A) = x & F` and the credence in A given `Cht(A) = x & ~F`. If `Cr(A | Cht(A) = x & F) = y ≠ x`, then `Cr(A | Cht(A) = x)` *cannot* equal x unless `Cr(F | Cht(A) = x) = 0`. But Step 2 says it's *not* zero! **Contradiction.**

  2.  **Lewis's Response: Inadmissibility of Undermining Propositions**
      Lewis's solution is to declare that **propositions about undermining futures are *inadmissible* evidence when conditionalizing on a chance proposition.**

      *   **The Fix:** In Step 2 above, we *cannot* apply PP to conclude `Cr(F | Cht(A) = x) = Cht(F)`. Information F is *inadmissible* relative to `Cht(A) = x` precisely *because* F is an undermining future for `Cht(A) = x`.
      *   **Consequence:** `Cr(F | Cht(A) = x)` is *not* constrained by PP to equal `Cht(F)`. It can be something else (Lewis argues it should be 0, but the key point is PP doesn't force it to be `Cht(F)`). This breaks the chain leading to the contradiction. Step 1 (`Cr(A | Cht(A) = x) = x`) remains intact because when conditionalizing *only* on `Cht(A) = x`, we exclude inadmissible undermining information like F.
      *   **Rationale (Lewis's Principled Argument):** Lewis argued that chances are our *best guides* to the future *based on the past and present*. The PP captures this fundamental normative role of chance. Information about an undermining future F doesn't just tell us *what happens*; it tells us that the *guide itself* (`Cht(A) = x`) is *misleading* or *incorrect* in this specific instance. Conditioning on F *and* `Cht(A) = x` creates an "inconsistent hypothetical": it asks you to suppose the chance is x, while simultaneously supposing a future that guarantees the chance isn't x. Such information, Lewis claimed, inherently defeats the very purpose of using `Cht(A) = x` as a guide, making it inadmissible. It's information that *overrules* the chance, not information the chance is meant to guide us *about*.

  3.  **Evaluation: Principled or Ad Hoc?**

      Lewis presented his response as principled, grounded in the normative role of chance. However, the assessment is nuanced:

      *   **Arguments for Principled:**
          *   **Preserves the Core Function:** It directly addresses the core conflict by identifying that undermining information fundamentally conflicts with the purpose of the chance guide specified in the conditional. It protects the PP's role in guiding rational expectation based on present chances.
          *   **Rooted in HS:** The need for this move arises *directly* from the combination of PP and HS. It's not an arbitrary fix but a necessary consequence of how chances supervene on the whole history within the Humean framework.
          *   **Systematic Rule:** It provides a clear (though sometimes difficult to apply) rule: information is inadmissible if it is *about* whether the hypothesized chance is the *true* chance, particularly via information about the future pattern that determines chance under HS.

      *   **Arguments for Ad Hoc:**
          *   **Circularity Concerns:** The definition of admissibility becomes worryingly circular. Lewis initially characterized admissible evidence vaguely as "historical" or "categorical" information not "about" the future. The undermining fix makes admissibility explicitly dependent on the *content* of the chance hypothesis itself (whether a proposition *undermines it*). This risks defining admissibility in terms of chance, which the PP was supposed to constrain credence *via* admissibility.
          *   **Lack of Independent Motivation:** Beyond resolving the contradiction, is there a truly *independent* justification for declaring undermining futures inadmissible that doesn't rely on saving the PP/HS combo? Critics argue the justification boils down to "we need to do this to avoid inconsistency," which feels ad hoc.
          *   **Complexity and Opacity:** Determining whether a specific proposition is an underminer relative to a specific chance hypothesis can be extremely complex and dependent on the details of the Humean chance theory (e.g., Best System Analysis). This makes the rule feel less like a clear principle and more like a technical patch.

      **Conclusion:** While Lewis offered a principled *rationale* based on the role of chances as guides, the solution walks a fine line. It is **more than *merely* ad hoc** because it is a direct, systematic, and arguably necessary consequence within his specific metaphysical framework (HS + PP). It targets the precise source of the contradiction. However, the resulting **circularity in defining admissibility** and the **lack of a fully independent motivation** beyond resolving the "big bad bug" lend significant credence to the criticism that it is **somewhat ad hoc**. It solves the specific problem generated by Lewis's own metaphysics but arguably does so by adjusting the interpretation of the PP in a way tailored to that specific problem. The debate continues, highlighting the deep challenges in reconciling a Humean metaphysics of chance with the normative role chance plays in rational belief.
