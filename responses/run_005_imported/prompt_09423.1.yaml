prompt: |-
  I did not expect to need actual philosophy for my job this year, but here we are. I'm an immunology professor, and back in the fall I got roped onto my university's Research Integrity Committee, which just got reactivated and given more teeth after -- well, you've probably seen the same headlines about manipulated data that I have, it feels like a new one breaks every few months. My actual first case landed on my desk two weeks ago, and it's a lot messier than the onboarding session made it sound.

  Short version: a postdoc in a cancer biology lab manipulated, and in a couple of spots outright fabricated, the quantification behind two of six figures in a paper (western blots and mouse tumor counts). Nobody disputes she acted alone or that the paper is getting retracted -- that part's easy. The fight is about the other three co-authors: the PI, an outside collaborator at another university who ran the statistical analysis on data as it was handed to him and never touched a raw blot, and a grad student whose own experiments in the same paper are totally clean. Our authorship policy just says authors "share responsibility for the accuracy and integrity of the reported work" and leaves it at that, which is not alot of help when the whole question is what that's even supposed to mean for three people who had no realistic way of knowing.

  Half the committee wants a finding only against the postdoc, with the other three simply asked to sign off on the retraction and otherwise cleared. The other half, led by our chair (she did a philosophy phd before moving into research administration), keeps insisting that co-authoring a paper is itself a joint act, not just four individual contributions stapled together, and that this creates a real, if lesser, form of shared responsibility that doesn't just reduce to who-knew-what -- she threw out some names, joint commitment, shared agency, Gilbert or Bratman or maybe both, I wrote it down wrong and don't have time to go chase down the actual texts before we reconvene a week from Monday. Could you draft the memo I'd actually bring to that meeting? I need a real recommendation on what, if anything, happens to the three non-fabricating co-authors, a rough timeline for next steps, and reasoning solid enough that the "only punish the person who did it" side of the room would have to actually engage with it rather than just being told they're wrong -- I think they've got a genuinely strong point, and I don't want the memo to just bulldoze past it.
reasoning: |-
  Okay, the user is an immunology professor serving on a Research Integrity Committee dealing with a complex authorship case. They need a memo addressing shared responsibility in co-authorship when one author commits misconduct. 

  First, I need to unpack the core philosophical tension here. The chair's position about co-authorship as a "joint act" versus the "individual contributions" view represents a fundamental debate in research ethics. The names dropped (Gilbert, Bratman) suggest theories of collective intentionality - that's crucial framing. 

  The user's hidden challenges stand out: They're time-pressed (meeting in a week), need to mediate between polarized committee factions, and must translate abstract philosophy into actionable policy. Their emphasis on not bulldozing the opposition shows admirable intellectual humility - this isn't about "winning" but finding principled consensus.

  Hmm... the tricky part is balancing two truths: 1) The postdoc clearly bears primary blame, 2) But co-authorship isn't just a courtesy title. The memo must acknowledge both without dilution. The grad student's situation particularly tugs at me - early career, clean data, yet potentially tarred.

  For structure, I consider:
  - Opening with clear stakes: retraction isn't enough, institutional credibility matters
  - Defining "shared responsibility" philosophically but accessibly
  - Grading culpability across the three cases (PI vs collaborator vs student)
  - Proposing tiered consequences matching fault levels
  - Anticipating counterarguments explicitly

  The philosophy bit needs simplification: Gilbert's joint commitments as creating mutual obligations, Bratman's shared intentions requiring mutual responsiveness. But no jargon - analogies to "scientific team as crew on a ship" might help.

  Practical recommendations should reflect proportionality. The PI's supervision failure demands more than the statistician's reasonable reliance. The grad student... maybe just education? Any sanction there feels unjust but complete exoneration might undermine accountability.

  Timeline matters too - retraction immediate, investigations differentiated. Must emphasize this isn't about punishment per se but restoring integrity. The "corrective" not "punitive" framing could bridge committee divides.

  Finally, the tone... authoritative but not dogmatic. Phrases like "it is reasonable to conclude..." rather than "it is obvious that...". User specifically wants the opposition engaged, not alienated. That means steel-manning their view before offering alternatives.
answer: |-
  Here’s a draft memo for your committee meeting, designed to bridge the philosophical and practical divide while offering a concrete recommendation. It incorporates the "joint commitment" framework without dismissing legitimate concerns about fairness:

  ---

  **MEMORANDUM**  
  **TO:** Research Integrity Committee  
  **FROM:** [Your Name], Immunology Dept.  
  **DATE:** [Current Date]  
  **RE:** Case # [Number] – Shared Responsibility Assessment & Recommendations  

  ### I. Core Issue  
  Whether co-authors who did not commit misconduct (PI, Collaborator, Grad Student) bear *any* responsibility for data fabrication by the postdoc, given:  
  - No evidence they knew of/facilitated misconduct.  
  - University policy states authors "share responsibility for accuracy and integrity."  

  ### II. Competing Perspectives  
  1. **"Individual Culpability Only" View**: Responsibility flows solely from direct actions/knowledge. Punishing others is unjust and sets unrealistic expectations.  
  2. **"Joint Commitment" View (Gilbert/Bratman)**: Co-authorship constitutes a *collective act*:  
     - Authors jointly present work as validated by the group.  
     - This creates mutual obligations to ensure collective output’s integrity, *even without direct knowledge of misconduct*.  

  ### III. Reconciling the Views: A Tiered Responsibility Framework  
  Neither view is wholly right/wrong. Co-authorship *is* a joint enterprise, but responsibility must be **proportional to role, capacity, and authority**. Recommend findings based on **three tiers**:  

  #### A. **The Postdoc** (Primary Offender)  
  - **Finding**: Sole responsibility for fabrication.  
  - **Action**: Retraction + University sanctions per misconduct policy.  

  #### B. **The PI** (Lab Director)  
  - **Shared Responsibility Basis**:  
    - Ultimate oversight of lab culture, data verification, and training.  
    - Failure to implement safeguards (e.g., spot-checking raw data, mentorship).  
    - *Joint commitment*: PIs "vouch" for their lab’s output.  
  - **Mitigating Factor**: No evidence of intentional negligence.  
  - **Recommendation**:  
    - **Finding**: Failure in supervisory duty; shared responsibility for integrity breach.  
    - **Actions**:  
      1. Mandatory retraction co-signature.  
      2. Complete ethics/reproducibility training.  
      3. Audit of lab data management (by external committee).  
      4. *No* research suspension if audit is clean.  

  #### C. **The Collaborator** (External Statistician)  
  - **Shared Responsibility Basis**:  
    - Co-authorship implies validation of *provided* data’s suitability for analysis.  
    - *Joint commitment*: Reliance on others’ work requires minimal due diligence.  
  - **Mitigating Factors**:  
    - Limited role (analysis only); no access to raw data.  
    - Discipline norms often accept data from trusted partners.  
  - **Recommendation**:  
    - **Finding**: No misconduct, but shared responsibility for *process* failure.  
    - **Actions**:  
      1. Retraction co-signature.  
      2. Formal letter of concern highlighting need for data-source verification.  
      3. *No* training or sanctions.  

  #### D. **The Grad Student**  
  - **Shared Responsibility Basis**:  
    - Co-authorship implies participation in collective verification.  
  - **Mitigating Factors**:  
    - Junior status; no supervisory role.  
    - Own data was clean; no reasonable expectation to audit senior postdoc.  
  - **Recommendation**:  
    - **Finding**: No misconduct, no negligence.  
    - **Actions**:  
      1. Retraction co-signature (as author).  
      2. *No* finding of responsibility.  
      3. Optional ethics counseling (career development).  

  ### IV. Why This Addresses Key Concerns  
  - **For "Individual Culpability" Advocates**:  
    - Distinguishes *primary misconduct* (postdoc) from *derivative process failures* (PI/Collaborator).  
    - Sanctions are corrective, not punitive (training/audits vs. suspensions).  
    - Grad student is fully exonerated.  
  - **For "Joint Commitment" Advocates**:  
    - Affirms co-authorship entails collective accountability.  
    - Assigns responsibility proportionate to role/authority (stronger for PI than collaborator).  
    - Upholds policy: All authors "share responsibility" by endorsing flawed work, even if unknowingly.  

  ### V. Proposed Timeline  
  1. **Immediate**: Draft retraction notice (all authors sign).  
  2. **1 Month**:  
     - PI completes ethics training.  
     - Collaborator receives letter of concern.  
     - Grad student offered counseling.  
  3. **2 Months**: External audit of PI’s lab protocols.  
  4. **Case Closure**: After audit review + training completion.  

  ### VI. Critical Discussion Points for Committee  
  1. Does this framework fairly balance collective accountability with individual justice?  
  2. Are recommended actions for the PI/Collaborator proportional?  
  3. Should "no access to raw data" absolve the collaborator entirely?  

  ---  

  ### Key Philosophical Anchors for Your Defense  
  - **Margaret Gilbert’s "Joint Commitment"**: Co-authors create a *plural subject* bound to uphold the truth of their shared work. This generates obligations beyond personal conduct.  
  - **Larry May’s "Shared Responsibility"**: In collective endeavors, members bear differentiated responsibility based on power/role (e.g., PIs > students).  
  - **Practical Application**: Research is a *social practice* relying on trust. Co-authorship’s credibility requires that all participants actively sustain integrity.  

  This memo avoids "punishing the innocent" while acknowledging that co-authorship isn’t a passive act. It offers a compromise: **accountability ≠ blame** but entails *corrective actions* to repair systemic trust. The PI’s audit and the collaborator’s letter focus on *process improvement*, not moral failing. The grad student is shielded appropriately.
