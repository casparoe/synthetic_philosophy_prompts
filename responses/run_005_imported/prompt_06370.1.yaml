answer: |-
  Here's a joke focusing squarely on that delicious irony:

  > Thomas Hobbes spent years arguing that geometry offered absolute certainty *because* humans invent its definitions. He then spent *even more* years inventing his own definition of "squared the circle" and demanding absolute certainty from everyone else. When John Wallis pointed out this violated geometry's *actual* definitions, Hobbes treated it like a breach of contract... in a court that only existed in his own philosophy.

  **Why it works:**

  1.  **Core Irony:** Directly contrasts his *theory* of certainty (from invented definitions) with his *practice* (ignoring established definitions to cling to his own invented "solution").
  2.  **Philosophy Link:** Uses terms like "absolute certainty," "invent its definitions," and "breach of contract" to tie back to his political philosophy ideas (social contract, constructed certainty).
  3.  **Specificity:** Names Wallis as the corrector and references the specific obsession (squaring the circle).
  4.  **The Twist:** The punchline frames Wallis's correction not as a mathematical refutation, but as a violation of the very *rules-based system* Hobbes championed, happening within the fictional "court" of Hobbes's own flawed geometric reasoning. It highlights his refusal to play by the rules *he* claimed guaranteed certainty.
  5.  **Avoids Generic Math Mockery:** The humor isn't "haha, bad at math," it's "haha, the guy who built his philosophy on the infallibility of self-made rules couldn't handle it when those rules proved him wrong *in the very subject he held up as perfect*."

  **Alternative Punchline (slightly sharper):**

  > ...Hobbes treated Wallis's proofs like an anarchist undermining the sovereign state... of his own meticulously defined, yet completely imaginary, geometric commonwealth.

  This version leans even harder into the political philosophy metaphor.
