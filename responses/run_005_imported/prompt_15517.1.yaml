answer: |-
  Your dilemma cuts to the heart of moral psychology and behavioral economics. Both dinner arguments oversimplify the complexity of human motivation. Here's a more precise framework for analyzing cases like your aunt's:

  ### Core Principles for Analyzing Mixed Motives
  1. **The Non-Zero-Sum Principle**: Altruistic and self-interested motives aren't mutually exclusive. They can coexist, reinforce each other, and create sustainable care systems that "purer" motives might not sustain.

  2. **Functional Hierarchy of Motives**:
     - *Primary Motive*: Direct concern for beneficiary (e.g., love for mother-in-law)
     - *Sustaining Motives*: Psychological supports enabling continued care (guilt avoidance, social approval)
     - *Structural Motives*: Contextual factors shaping the action (inheritance expectations)

  3. **Moral Credit Multiplier Effect**: When multiple motives align toward prosocial behavior, the moral worth *increases* due to enhanced reliability. Your aunt's mixed motives make her care *more* sustainable than if driven solely by duty or affection.

  ### Why Both Arguments Fail
  - **The Purity Critic's Error**: Commits the *moral dichotomization fallacy* – assuming any self-interest contaminates the whole act. Ignores:
    - Motive integration (self-interest sustains altruism during exhaustion)
    - Counterfactual reality (without sustaining motives, care might lapse)
    - The "virtue tax" problem: Demanding pure motives disproportionately burdens caregivers

  - **The Outcome-Only Error**: Overcorrects into *moral instrumentalism* – reducing ethics to consequences. Neglects:
    - Motive quality affects long-term resilience of care
    - Self-awareness of mixed motives enables course-correction
    - Character evaluation matters for trust networks

  ### Precise Evaluation Framework
  Apply these diagnostic questions:

  1. **Counterfactual Test**: 
     - Would care continue if one motive disappeared? 
     *(If care persists without inheritance expectations, self-interest isn't dominant)*

  2. **Transparency Assessment**: 
     - Is the agent aware of mixed motives? 
     *(Your aunt's self-awareness suggests integrity, not self-deception)*

  3. **Motive Elasticity**: 
     - Do self-interested elements expand to displace altruism? 
     *(e.g., Does she withhold care to hasten inheritance? If not, motives are complementary)*

  4. **Social Scaffolding Analysis**: 
     - Are "impure" motives socially functional? 
     *(Guilt avoidance here enforces family care norms benefiting vulnerable elders)*

  ### Behavioral Economics Insights
  Your aunt exemplifies **intrinsic-extrinsic motive synergy**:
  - Extrinsic factors (inheritance) lower the *opportunity cost* of caregiving
  - Intrinsic motives (love) provide the primary reward
  - Social motives (guilt avoidance) act as commitment devices

  This aligns with neuroscientific evidence: distinct neural pathways process different reward types (e.g., ventral striatum for both charitable giving and monetary rewards), suggesting biological compatibility of mixed motives.

  ### A More Precise Conclusion
  "Caregiving motivated by integrated plural motives—where other-directed concern remains primary, self-interested elements sustain action without corrupting it, and motive-awareness enables reflection—represents a *more robust* form of moral agency than either 'pure' altruism or calculative self-interest. The presence of sustaining motives doesn't diminish the act's moral worth; it humanizes it while ensuring its durability."

  This framework acknowledges complexity without resorting to "it's complicated," recognizing that sustainable virtue in real-world constraints often requires motivational ecosystems rather than singular drives. Your aunt's capacity to name her mixed motives while maintaining loving care suggests remarkable psychological integration – a feature of mature moral agency, not a bug.

  *Next steps*: In future discussions, ask critics whether they'd prefer caregivers with "purer" motives that burn out after six months, or integrated motives enabling four years of dedicated care. That practical test often reveals the ethical value of motivational diversity.
