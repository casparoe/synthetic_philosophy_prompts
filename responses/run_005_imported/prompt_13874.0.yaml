  I need to address both sides fairly. The pro-nomination side might argue that the primary intention was military, and the deaths were collateral damage. But Anscombe's criteria require that the bad effect not be a means. If the epidemic was necessary to break the government, then it's intended. The memo's projection indicates they relied on the deaths to achieve the outcome.

