  ## Memorandum: Honorary Degree Nomination - General [Nominee's Name]

  **To:** Members of the Honorary Degrees Committee  
  **From:** [Your Name], Committee Member  
  **Date:** [Date]  
  **Subject:** Recommendation Regarding Nomination of General [Nominee's Name] - Application of Anscombean Ethical Analysis  

  This memorandum addresses the nomination of General [Nominee's Name] in light of significant ethical concerns arising from his command decision during the Torvalen civil war, specifically the destruction of the capital's sole water-treatment plant. The subsequent cholera epidemic killed approximately 30,000 civilians. While the General maintains the plant was a "legitimate military target" and civilian deaths were a foreseen but unintended "side effect," a leaked planning memo from his staff explicitly projected the epidemic would "break the government's will within weeks." This compels us to move beyond the simple label of "double effect" and rigorously apply Elizabeth Anscombe's own criteria for distinguishing intention from foresight, as articulated in works like *Intention* and her critique of President Truman.

  **The "Legitimate Target" Defense (Strongest Form):**

  1.  **Military Necessity:** The capital's water-treatment plant was demonstrably integrated into the enemy war effort. It supplied water critical for troop sustainment, military hospital operations, and potentially weapons manufacturing. Destroying it degraded the enemy's *direct* capacity to wage war, fulfilling the principle of distinction by targeting war-sustaining infrastructure.
  2.  **Proportionality (Strict Military Calculation):** The *immediate military advantage* gained by crippling enemy logistics and command capabilities in the capital was concrete and significant. Proponents argue this advantage outweighed the *foreseen* civilian suffering *at the time of the decision*, especially given the context of a brutal civil war threatening even greater protracted loss of life.
  3.  **Foreseen but Unintended:** The General asserts his *intention* was solely to degrade military capabilities and hasten the end of the conflict. The cholera epidemic, while foreseen as a probable consequence, was not *chosen* as a means to achieve victory; it was a tragically unavoidable byproduct of striking a legitimate target. Victory was achieved *despite* the epidemic, not *because* of it (in this view). The staff memo's projection, while accurate, simply reflects accurate intelligence assessment, not command intent.

  **Engagement with Anscombe's Criteria:**

  Anscombe rigorously dissects the concept of intention. She argues we cannot hide behind the label "double effect" without scrutinizing the *description of the act* and the *agent's reasons*. Key Anscombean principles relevant here:

  1.  **Intention vs. Mere Foresight:** "You *intentionally* do *whatever* you *do* in order to achieve your end, *if* it is *part* of your plan for achieving it." (Paraphrasing *Intention*). Foreseeing a consequence doesn't equate to intending it, but...
  2.  **The Role of the Bad Effect in the Plan:** **The critical question is whether the bad effect (the cholera deaths) was *a means* to the desired end (breaking the enemy's will/ending the war), or merely a consequence that *accompanied* the chosen means (destroying the plant to disrupt logistics).** If the bad effect is part of the *description under which the act is chosen*, it is intended.
  3.  **"In Order To" Test:** Did the agent choose the act *because* the bad effect would occur? Or did they choose it *despite* the bad effect occurring?

  **Analysis Applying Anscombe:**

  The leaked staff memo is profoundly damaging to the "mere foresight" defense. It states the destruction of the plant was projected to "break the government's will within weeks" *specifically through the mechanism of the cholera outbreak*. This suggests:

  1.  **The Bad Effect as Means:** The epidemic wasn't just an unfortunate side effect; it was projected and relied upon as the *primary mechanism* for achieving the strategic objective – breaking the enemy's will. The destruction of the plant wasn't chosen *merely* to disrupt military logistics *in isolation*; it was chosen *precisely because* it would trigger a public health catastrophe that would cripple the government's resolve. The cholera was instrumentalized.
  2.  **Intention Embedded in the Plan:** The memo reveals the planners (acting under the General's command and authority) understood the causal chain: Destroy Plant -> Cause Epidemic -> Cause Mass Deaths & Suffering -> Break Government Will -> End War. When an outcome is not only foreseen but *integral to the predicted success* of the chosen action, Anscombe would argue it becomes very difficult to separate it from intention. The act "destroying the plant *in order to cause an epidemic* that breaks the enemy's will" becomes a plausible description of the chosen means.
  3.  **"In Order To":** The evidence suggests the destruction was carried out *in order to* precipitate the humanitarian crisis, knowing it was the most efficient path to break the enemy's will. The epidemic wasn't just *foreseen*; it was *counted on* and formed the core of the strategic calculation presented to the commander.

  **Recommendation:**

  While the "legitimate target" argument possesses a prima facie military logic, Anscombe's profound analysis of intention compels us to look beyond surface-level claims of "unintended consequences." The leaked planning memo provides compelling evidence that the massive civilian casualties were not merely a tragic side effect, but were *understood and relied upon as the instrumental means* to achieve the General's strategic objective of breaking the enemy government. **The foreseen civilian suffering appears embedded in the intention of the act *as planned and executed*.**

  Therefore, honoring General [Nominee's Name] with a degree from this university, an institution dedicated to the preservation and betterment of human life and the pursuit of ethical understanding, would be deeply incongruous. It risks endorsing a calculus where the mass suffering of non-combatants is weaponized as a strategic tool, regardless of the legalistic "target" justification. **Anscombe's opposition to Truman's honor was rooted in the conviction that universities must not honor those who fundamentally violate core moral principles regarding the innocent, even amidst complex circumstances. This case echoes that principle starkly.**

  **I recommend we WITHDRAW the nomination.** Proceeding or suspending fails to adequately address the grave ethical breach illuminated by Anscombe's framework and the documented evidence of the General's command decision. Withdrawing upholds the university's commitment to the sanctity of civilian life and the rigorous application of moral reasoning.
