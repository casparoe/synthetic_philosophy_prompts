  To build intuition for why Nash's bargaining solution can behave counterintuitively and why Kalai-Smorodinsky (KS) avoids this, let's walk through a concrete example. We'll see how expanding options for one player can *reduce* their payoff under Nash, while KS ensures monotonic improvements.

  ### Key Concepts Recap
  - **Nash solution**: Maximizes the product of utility gains over the disagreement point:  
    \(\max (u_1 - d_1)(u_2 - d_2)\) on the Pareto frontier.
  - **KS solution**: The Pareto-efficient point on the line connecting the disagreement point \((d_1, d_2)\) to the *utopia point* \((u_1^{\max}, u_2^{\max})\), where \(u_i^{\max}\) is player \(i\)'s highest feasible payoff.
  - **Core issue**: Nash violates **individual monotonicity** (if the feasible set expands to give one player better options, their payoff shouldn't decrease). KS satisfies this by construction.

  ---

  ### Worked Example: Nash's Counterintuitive Behavior
  **Setup**:  
  - Disagreement point: \(d = (0, 0)\).  
  - **Initial feasible set \(S\)**:  
    - Pareto frontier: Line segment from \((1, 0)\) to \((0, 1)\) (equation: \(u_1 + u_2 = 1\)).  
    - Utopia point: \((u_1^{\max}, u_2^{\max}) = (1, 1)\).  
    - **Nash solution**: Maximizes \(u_1 \cdot u_2\) on \(u_1 + u_2 = 1\):  
      \[
      \frac{d}{du_1} [u_1(1 - u_1)] = 1 - 2u_1 = 0 \implies u_1 = 0.5, \ u_2 = 0.5.
      \]  
      Outcome: \((0.5, 0.5)\).  

  - **Expanded feasible set \(T\)**:  
    - Add a new option that only benefits Player 2.  
    - New Pareto frontier: Line segment from \((1, 0)\) to \((0, 2)\) (equation: \(u_2 = 2(1 - u_1)\)).  
    - Utopia point changes to \((u_1^{\max}, u_2^{\max}) = (1, 2)\) (Player 2's max payoff increases).  
    - **Nash solution**: Maximizes \(u_1 \cdot u_2 = u_1 \cdot 2(1 - u_1) = 2u_1 - 2u_1^2\):  
      \[
      \frac{d}{du_1} [2u_1 - 2u_1^2] = 2 - 4u_1 = 0 \implies u_1 = 0.5, \ u_2 = 2(0.5) = 1.
      \]  
      Outcome: \((0.5, 1)\).  

  **Analysis**:  
  - Player 2's payoff increased from \(0.5\) to \(1.0\) (intuitive).  
  - Player 1's payoff **remained \(0.5\)** despite Player 1's opportunities *not improving* (\(u_1^{\max} = 1\) unchanged).  
  - Why no gain for Player 1? Nash’s product rule prioritizes **balanced gains**. When Player 2’s options expand, the "balance point" shifts to a steeper part of the frontier, but Player 1’s gain is unchanged because their improvement cap didn’t rise.  

  ---

  ### Non-Monotonicity: When Expansion *Hurts* a Player
  Now consider an asymmetric set where Nash’s behavior is worse.  

  **Setup**:  
  - Disagreement point: \(d = (0, 0)\).  
  - **Feasible set \(S\)**:  
    - Constraints: \(u_1 + 2u_2 \leq 2\) and \(2u_1 + u_2 \leq 2\) (convex hull of \((0,0)\), \((2,0)\), \((0,1)\), and \((2/3, 2/3)\)).  
    - Pareto frontier: Kinked line from \((2, 0)\) to \((2/3, 2/3)\) to \((0, 1)\).  
    - Utopia point: \((u_1^{\max}, u_2^{\max}) = (2, 1)\).  
    - **Nash solution**: Maximize \(u_1 u_2\).  
      - On segment \((2,0)\) to \((2/3,2/3)\): \(u_2 = 2 - 2u_1\) (if \(u_1 \geq 2/3\)).  
        Product: \(u_1(2 - 2u_1)\). Maximum at \(u_1 = 0.5\) is outside the segment.  
        Endpoint \((2/3, 2/3)\) gives product \((2/3)(2/3) = 4/9\).  
      - On segment \((2/3,2/3)\) to \((0,1)\): \(u_1 = 2 - 2u_2\).  
        Product: \((2 - 2u_2)u_2\). Maximum at \(u_2 = 0.5\) is outside the segment.  
        Endpoint \((2/3, 2/3)\) gives the same \(4/9\).  
      Outcome: \((2/3, 2/3)\).  

  - **Expanded set \(T\)**:  
    - Add option \((0, 2)\), relaxing Player 2’s max payoff to \(2\) (Player 1’s max unchanged at \(2\)).  
    - New Pareto frontier: Line segment from \((2, 0)\) to \((0, 2)\) (equation: \(u_1 + u_2 = 2\)).  
    - Utopia point: \((u_1^{\max}, u_2^{\max}) = (2, 2)\).  
    - **Nash solution**: Maximize \(u_1 u_2\) on \(u_1 + u_2 = 2\):  
      \[
      u_2 = 2 - u_1 \implies \text{Product } = u_1(2 - u_1) = 2u_1 - u_1^2.
      \]  
      \[
      \frac{d}{du_1} [2u_1 - u_1^2] = 2 - 2u_1 = 0 \implies u_1 = 1, \ u_2 = 1.
      \]  
      Outcome: \((1, 1)\).  

  **Analysis**:  
  - Player 2’s payoff increased from \(2/3\) to \(1\) (good).  
  - Player 1’s payoff **decreased from \(2/3\) to \(1\)** (counterintuitive!).  
  - Why? Player 1’s options didn’t change (\(u_1^{\max} = 2\) still), but the new frontier (\(u_1 + u_2 = 2\)) is flatter. The Nash product peaks at a point requiring Player 1 to concede more utility to Player 2.  
  - **Violates individual monotonicity**: Player 2’s expansion *reduced* Player 1’s payoff.  

  ---

  ### How KS Fixes This
  **KS solution for expanded set \(T\)**:  
  - Utopia point: \((u_1^{\max}, u_2^{\max}) = (2, 2)\).  
  - Line from \(d = (0,0)\) to utopia: \(u_2 = u_1\) (since \(2/2 = 1\)).  
  - Intersect with Pareto frontier (\(u_1 + u_2 = 2\)):  
    \[
    u_1 + u_1 = 2 \implies u_1 = 1, \ u_2 = 1.
    \]  
    Outcome: \((1, 1)\).  

  **Why KS avoids the problem**:  
  - KS ties payoffs to **relative improvements toward utopia**. Here, both players move proportionally: from \((0,0)\) to \((2,2)\), the midpoint \((1,1)\) gives equal *relative gains* (\(1/2 = 50\%\) of utopia for each).  
  - Player 2’s expansion raised her utopia payoff from \(1\) to \(2\), so KS awards a larger absolute payoff (\(1 > 2/3\)). Player 1’s utopia unchanged, so KS gives the same *relative gain* (\(1/2\)) as before (\( (2/3)/2 = 1/3 \), now \(1/2\)).  
  - **Monotonicity preserved**: When your utopia improves, your payoff doesn’t decrease.  

  ---

  ### Why Economists Still Default to Nash
  Despite its flaws, Nash remains popular because:  
  1. **IIA axiom**: Independence of irrelevant alternatives is intuitive for static choices. If "irrelevant" options are removed, the solution doesn’t change. KS fails this (adding non-optimal points can shift the utopia and change the outcome).  
  2. **Simplicity**: Nash’s product rule is computationally easier.  
  3. **Strategic foundations**: Nash’s solution can be derived from non-cooperative models (e.g., alternating offers). KS lacks similar micro-foundations.  
  4. **Predictive power**: In symmetric cases, Nash and KS coincide, and Nash performs well empirically in many contexts.  

  ---

  ### Summary
  - **Nash’s pitfall**: Maximizing the product can punish players when options expand asymmetrically. The product rule ignores *whose* opportunities improved, leading to non-monotonicity.  
  - **KS’s strength**: By anchoring to utopia payoffs, KS ensures players benefit from their own expanded options.  
  - **Trade-off**: KS satisfies monotonicity but violates IIA; Nash does the opposite. The choice depends on context—Nash for stability, KS for fairness in dynamic/unequal settings.  

  This intuition should help with your problem set. Focus on how changes to the feasible set alter the "balance point" under Nash versus the "proportional gains" under KS.
