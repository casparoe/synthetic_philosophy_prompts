  ### Key Philosophical Points for Office Hours:
  1. **Natural Language ≠ LOT**: Fodor’s LOT is pre-linguistic and innate (see *The Language of Thought*, 1975). Natural language is merely an input/output system.
  2. **DOORKNOB is Innate**: Fodor’s *Concepts: Where Cognitive Science Went Wrong* (1998) argues lexical concepts are undecomposable primitives, hence innate. Learning only assembles complex concepts (e.g., BACHELOR) from innate primitives.
  3. **Systematicity → Innateness Link**: Systematicity proves LOT must have an innate combinatorial structure. Since lexical concepts are the primitive symbols of this structure, they too must be innate (no alternative acquisition mechanism exists per Fodor).  
     
  The student grasps the LOT framework and systematicity but misattributes concept acquisition and linguistic influence. Focus corrections on Fodor's nativism scope and LOT’s independence from natural language.
