  The user wonders if Galen is changing the subject rather than refuting his father. They also ask which view is more correct. I should break down the differences in their questions. P.F. is descriptive, focusing on how we actually operate, while Galen is normative, questioning ultimate desert. That's a crucial distinction. They're addressing different layers: the practical vs. the metaphysical.

  Next, considering whose work is more serious. P.F.'s approach is influential in compatibilism, grounding responsibility in human practices. Galen's argument targets libertarian views but might seem detached from real-life practices. The user needs to present both angles to their students, highlighting the shift in focus. 

  Also, the family dynamic angle is interesting but not the main issue. The user's deeper need is to clarify the philosophical conflict for their seminar. They might want a structured comparison to facilitate discussion. Emphasizing the separate questions each addresses can help resolve the cohort's debate. Concluding that both have merit but P.F.'s work is more applicable to human experience could provide a balanced answer.
answer: |-
  That's a fantastic pairing and an even more fascinating question about the Strawson family dynamic! You're right that their positions aren't in *direct* contradiction, but they are fundamentally addressing **different questions with different standards of success**. Here's a breakdown:

  **1. The Core Difference: Descriptive vs. Ultimate Justification**

  *   **P.F. Strawson (PFS):** His project is primarily **descriptive and pragmatic**. He asks: *How does the concept of moral responsibility actually function in human life?* His answer: It's grounded in our "reactive attitudes," which are constitutive of our form of life. These attitudes aren't beliefs *about* some metaphysical condition (like contra-causal freedom); they *are* the practice of holding responsible. We cannot abandon them wholesale without ceasing to engage in interpersonal relationships as we know them. The truth or falsity of determinism is irrelevant *to the practice itself*. His target is the traditional metaphysical debate, which he thinks misses the point of where responsibility *actually lives*.
  *   **Galen Strawson (GAS):** His project is **metaphysical and justificatory**. He asks: *Is ultimate, true, non-circular, desert-based moral responsibility **possible**?* His answer: No, because it requires an impossible form of self-creation (*causa sui*). He concedes PFS's descriptive point: we *do* have reactive attitudes and *do* hold each other responsible. But he argues this practice, however ingrained, is *unjustified* at the ultimate level. We act *as if* people are ultimately responsible, but this "as if" rests on a metaphysical impossibility. His target is the *justification* of desert-based blame/praise, especially the kind implied by libertarianism or robust compatibilism seeking ultimate grounding.

  **2. Do They Contradict? Changing the Subject?**

  *   **Not a Direct Contradiction:** GAS isn't saying PFS is *wrong* about how responsibility functions socially and psychologically. He largely *accepts* that description. He's not arguing we can or should adopt the objective attitude universally.
  *   **Radical Disagreement on Scope & Sufficiency:** Where they clash is on **what PFS's account *achieves***.
      *   PFS thinks showing responsibility is rooted in inescapable human practices *dissolves* the traditional metaphysical problem. For him, the reactive attitudes *are* the justification (or rather, they make the demand for a further, external justification misguided).
      *   GAS thinks this is a **cop-out**. He argues that the reactive attitudes *presuppose* the very notion of ultimate responsibility he deems impossible. Merely describing the practice doesn't *justify* the desert it presupposes. PFS sidesteps the deep metaphysical challenge GAS wants to press.
  *   **Changing the Subject?** In a way, **yes**. GAS shifts the question from "What is the nature and basis of our actual responsibility practices?" (PFS's question) to "Can those practices be *ultimately justified* in light of the demands of true desert?" (GAS's question). PFS would likely say GAS's question is based on a misunderstanding of what moral responsibility *is* (it's not about *causa sui* but about participation in the reactive community). GAS would say PFS fails to address the deep intuition driving the demand for *true* desert that underlies blame, even if we express it reactively.

  **3. Who is Doing More Serious Philosophical Work? Who is "Closer to Right"?**

  This is highly debatable and depends on what you value in philosophy:

  *   **The Case for P.F. Strawson:**
      *   **Revolutionary Impact:** PFS profoundly shifted the debate. He showed that focusing *only* on metaphysics (determinism vs. indeterminism) misses the actual lived reality of responsibility. His descriptive account is rich, psychologically plausible, and resonates deeply.
      *   **Practical Relevance:** He connects philosophy directly to human experience. His account explains *why* the objective attitude feels unnatural and why responsibility practices persist regardless of metaphysical beliefs. It offers a stable, non-metaphysical foundation *for practice*.
      *   **Avoids the Regress:** By grounding responsibility in our form of life, he avoids the impossible demand for self-creation. He redefines responsibility in achievable terms.
      *   **Closer to "Right" about Moral Responsibility *as Practiced*:** If you think moral responsibility is fundamentally a *social practice* embedded in human relationships, PFS offers a powerful and arguably correct description of its nature and inescapability.

  *   **The Case for Galen Strawson:**
      *   **Metaphysical Rigor:** GAS relentlessly pursues the logical implications of demanding *true, ultimate* desert. He exposes what he sees as the fatal flaw in *any* account (libertarian or compatibilist) that tries to ground desert-based responsibility. His argument is logically tight and hard to refute on its own terms.
      *   **Challenges Complacency:** He forces compatibilists, especially those inspired by PFS, to confront whether their account *really* justifies the harshness of blame or the depth of praise we feel. Does "it's just our practice" suffice when we condemn someone severely?
      *   **Exposes an Intuition:** He taps into a deep intuition many have: for blame/praise to be *truly* fair, the agent must be the *ultimate originator* in a strong sense. PFS dismisses this demand; GAS shows why satisfying it is impossible.
      *   **Closer to "Right" about the *Impossibility* of Ultimate Desert:** If you believe moral responsibility *requires* this kind of ultimate self-origination for true desert (as many intuitively do, even if incoherently), then GAS is likely correct that it's impossible. He's right that PFS's account doesn't provide *this*.

  **Synthesis & Conclusion for Your Seminar:**

  1.  **Different Questions:** Emphasize this. PFS: "What *is* moral responsibility in human life?" GAS: "Is *ultimate* desert-based responsibility *possible*?"
  2.  **GAS isn't Refuting PFS's Description:** He largely accepts it but argues it fails to meet a deeper justificatory standard he considers essential for *true* responsibility.
  3.  **PFS Would Reject GAS's Standard:** PFS thinks GAS's demand for *causa sui* is based on a mistaken, hyper-metaphysical picture of what responsibility *is*. Responsibility, for PFS, *just is* participation in the reactive community; demanding more is asking the wrong question.
  4.  **The "More Serious Work" Depends on Goals:**
      *   For understanding **how responsibility actually functions in human society and psychology**, and why the traditional debate is often misplaced, **P.F. Strawson** is doing more groundbreaking and arguably successful work.
      *   For rigorously analyzing the **logical possibility of satisfying a strong intuition about ultimate desert and self-creation**, and showing why it fails, **Galen Strawson** is doing crucial work.
  5.  **Who's "Closer to Right"?** This is a value judgment about what moral responsibility *is*:
      *   If responsibility *is* essentially a feature of our interpersonal form of life, **PFS is closer to right.**
      *   If responsibility *requires* ultimate self-origination for true desert to make sense, **GAS is closer to right** (in showing it's impossible, meaning true responsibility doesn't exist).

  **For Thursday:** Frame it as a dialogue where the son pushes the father on whether his descriptive account *really* answers the deep metaphysical anxiety that underlies the demand for responsibility. GAS says, "Okay, Dad, you've shown we *do* this, but *should* we feel this way, given that what it seems to require is impossible?" PFS replies, "Son, you're chasing a phantom. *This* is what responsibility is; your 'impossible' requirement isn't part of its real meaning or practice." The enduring power of both essays lies in this tension between the inescapable reality of our practices and the haunting demand for a justification that may be unattainable.

  **P.S. Re: Galen's Response Piece:** He has addressed his father's work multiple times. A key one is in his 1986 book *Freedom and Belief* (Chapter 5: "The Phenomenology of Freedom and the Limits of Compatibilism"), and more recently in essays like "The Impossibility of Ultimate Responsibility?" (in *Oxford Studies in Agency and Responsibility*, 2013). The dynamic, as you imagine, must have been fascinating!
