answer: |-
  ## The Moral Asymmetry of War: Dissecting the Combatant Equality Debate

  Your impassioned debate with your philosophy PhD friend cuts to the heart of one of the most profound and consequential questions in the ethics of war: can a combatant fighting for an unjust cause ever be morally equivalent to one fighting for a just cause, simply by adhering to the rules of engagement? The traditionalist position, championed by Michael Walzer, answers affirmatively, upholding the Moral Equality of Combatants (MEC) and the Independence Thesis. The revisionist critique, spearheaded by Jeff McMahan, answers with a resounding negative. Let's dissect the strongest arguments for each side and confront your three sticking points head-on, culminating in a reasoned verdict.

  ### The Traditionalist Bastion: Walzer's Fortress of Independence

  Walzer's core argument, articulated in *Just and Unjust Wars*, rests on the **separation of jus ad bellum (justice of resorting to war) and jus in bello (justice within war)**. His strongest claims are:

  1.  **The Reality of War as a Distinct Moral Arena:** War creates a unique condition where combatants are simultaneously threats and threatened. Once war begins, soldiers on both sides face lethal danger and possess lethal capabilities. This symmetrical vulnerability creates a reciprocal relationship. Adhering to *jus in bello* constraints (discrimination, proportionality) is what makes killing in this context *permissible* for *any* combatant, regardless of the justice of their cause. It’s the rules *within* the fight that matter morally for the act of fighting itself.
  2.  **The Moral Autonomy of Soldiers:** Soldiers are generally not responsible for the decision to go to war. They are agents of a state, acting under orders, often with limited access to the geopolitical justifications (or lack thereof). Holding them morally accountable for *ad bellum* decisions they don't make is unfair. Their moral domain is confined to *how* they fight.
  3.  **The Functional Necessity of Symmetry:** The laws of war *require* reciprocity to function. If only just combatants had the right to kill, unjust combatants would have no incentive to follow *any* rules. Why respect POW status or avoid targeting civilians if you are deemed a criminal simply for fighting? Symmetry provides the essential mutual assurance needed for restraint. Abandoning MEC risks plunging warfare into even greater barbarity.
  4.  **The Preservation of Combatant's Honor:** Recognizing that soldiers can fight bravely and honorably, even in a bad cause, respects the specific virtues of the warrior role – courage, loyalty to comrades, discipline under fire – distinct from the political morality of the war itself.

  **Walzer's MEC thus asserts:** A combatant who fights according to the shared rules of war commits no *war crime*. They deserve the legal and moral standing of a lawful combatant, including POW status and immunity from prosecution for mere participation. Their moral failing, if any, lies in serving an unjust regime, not in the act of fighting per se while respecting *jus in bello*.

  ### The Revisionist Assault: McMahan's Challenge to Symmetry

  McMahan's fundamental objection is that Walzer's separation is a **convenient legal fiction mistaken for moral bedrock**. His strongest arguments are:

  1.  **The Primacy of Just Cause:** The right to kill in self-defense or defense of others is *derivative*. It stems from the defender's lack of moral liability to defensive harm (because they are not unjustly threatening) and the attacker's liability (because they *are* unjustly threatening). A combatant fighting without a just cause lacks a *fundamental moral right* to kill enemy combatants. Their violence remains objectively wrongful harming, even if it adheres to proportionality and discrimination.
  2.  **The Moral Asymmetry of Liability:** Combatants on the just side are defending themselves or others against an unjust threat. Combatants on the unjust side *are* the unjust threat. This fundamental difference in moral status makes their acts of killing morally distinct. Killing a just combatant is like killing an innocent victim defending themselves; killing an unjust combatant is like killing an unjust aggressor. They are not moral equals.
  3.  **Distinguishing Excuse from Justification:** McMahan readily concedes that *individual blameworthiness* is often absent. Soldiers may be excused due to non-culpable ignorance (state propaganda, lack of access to truth), duress, or the fog of war. **However, an excuse negates *blame* for wrongdoing; it does not transform the *act itself* into a morally permissible one.** The killing by the unjust combatant remains objectively wrongful, even if the soldier isn't culpable or blameworthy for committing it. Revisionism distinguishes sharply between the *objective wrongness* of an act and the *subjective culpability* of the agent.
  4.  **The Ordinary Morality Challenge:** Revisionism argues that traditionalism relies on a bizarre, war-exceptionalist morality. In any other context (e.g., a police officer vs. a criminal, or individual self-defense), we would never grant the unjust aggressor a "right" to kill the defender just because they fight "fairly." Why should war be different? Walzer's act/agent-neutrality collapses under scrutiny outside the war context.

  **McMahan's revisionism thus concludes:** The Moral Equality of Combatants is false. Unjust combatants generally lack the moral right to kill just combatants; their killings are objectively wrongful, even if often excused. Just combatants possess the right to kill unjust combatants as a necessary defense against aggression.

  ### Confronting the Sticking Points

  1.  **Practical Costs vs. Moral Truth:**
      *   **Traditionalist Fear:** Abandoning MEC would catastrophically undermine the laws of war. Unjust combatants, knowing they will be treated as criminals regardless, would disregard *all* constraints. War termination becomes harder as surrender seems like admitting guilt. Legal systems struggle to impartially adjudicate complex *ad bellum* questions swiftly during conflict.
      *   **Revisionist Response (and Moral Weight):** Revisionists agree these costs are real and grave. However, they argue:
          *   **Consequences Don't Alter Morality:** The practical difficulties of implementing a morally correct view do not make the view itself incorrect. Slavery was once pragmatically "necessary" for economies; that didn't make it morally right.
          *   **Incentives Can Be Managed:** Fear of punishment for *jus in bello* violations (war crimes) can still provide strong incentives for restraint, even if the *mere act of fighting* for an unjust cause is deemed wrongful. Focusing prosecution on *ad bellum* leadership and clear *in bello* atrocities, while treating excused rank-and-file humanely, could mitigate some risks.
          *   **Moral Truth Should Guide Law Reform:** While current law reflects MEC, acknowledging its moral falsity should guide long-term legal evolution towards better aligning law with morality, perhaps by strengthening mechanisms for holding *ad bellum* aggressors accountable and refining excuses for soldiers.
      *   **Verdict on this Point:** The practical costs are undeniable and carry significant moral weight *in the realm of policy and law*. However, they are ultimately pragmatic arguments that cannot overturn the fundamental *moral* asymmetry identified by revisionism. We must distinguish between what *is* morally true and what is *prudentially necessary* to manage a terrible reality.

  2.  **Does "Excused, Not Justified" Save Revisionism?**
      *   **Traditionalist Charge:** Revisionism still effectively condemns the vast majority of soldiers throughout history as wrongdoers, even if excused. This seems overly harsh, ignores the realities of soldiering, and undermines the respect due to those who fought bravely under difficult circumstances.
      *   **Revisionist Defense:**
          *   **Objective vs. Subjective:** Revisionism condemns the *act* (objectively wrongful killing) but often *excuses the agent* (soldier). Recognizing objective wrongness is crucial for assigning liability accurately and understanding the moral landscape of war. It doesn't necessarily imply personal condemnation or lack of respect for soldierly virtues displayed within an unjust framework.
          *   **Nuance in Excuse:** Revisionism allows for significant nuance. Excuses can range from full (completely non-culpable) to partial. Many soldiers might be only partially excused or bear diminished responsibility. The point is they lack *justification*.
          *   **Focus on Leadership:** The primary moral condemnation falls on political leaders and high commanders who initiate and plan unjust wars, knowing (or culpably ignoring) the lack of just cause. They bear the greatest responsibility.
      *   **Verdict on this Point:** The distinction *does* save revisionism from the charge that it simply labels all soldiers on the unjust side as blameworthy villains. It provides a sophisticated framework: soldiers can be recognized as performing objectively wrongful acts (killing without right) while simultaneously being viewed as individuals who may deserve sympathy, understanding, and minimal blame due to their circumstances. It shifts the primary moral burden upwards. While psychologically difficult, this separation of act and agent is philosophically coherent and necessary.

  3.  **The Act/Agent-Neutrality Charge:**
      *   **Revisionist Challenge:** Traditionalism's core move – treating the act of killing by a combatant identically regardless of which side they are on, provided *in bello* rules are followed – relies on an act/agent-neutral perspective foreign to ordinary morality (like self-defense). Why does war get this special moral pass?
      *   **Traditionalist Response (and its Weakness):** Walzer argues the "war convention" *creates* a unique moral sphere. The shared condition of being a combatant under orders, facing mutual threat, generates a reciprocal permission. This is the essence of the "war is hell" reality demanding distinct rules.
      *   **Revisionist Rebuttal:** This exceptionalism is unjustified. The core moral principles governing lethal force – necessity, proportionality, liability based on responsibility for an unjust threat – apply universally. Granting unjust combatants a permission to kill just combatants, simply because they wear a uniform and follow orders, violates these principles. The self-defense analogy is potent: we don't grant the aggressor a "fair fight" right to kill the defender. Why should a Nazi soldier gain a moral right to kill a Polish defender by fighting "cleanly"?
      *   **Verdict on this Point:** The revisionist critique here is decisive. Traditionalism's reliance on war-exceptionalism for act/agent-neutrality is its Achilles' heel. The self-defense analogy exposes the inconsistency. Ordinary morality *does* see a fundamental moral difference between killing in justified defense and killing as part of an unjust aggression. Traditionalism fails to provide a compelling reason why this difference evaporates in the context of large-scale organized violence. The symmetry of the combatant role does not erase the asymmetry of their causes.

  ### The Committed Verdict: Moral Asymmetry, Pragmatic Symmetry

  After wrestling with these arguments and your three sticking points, the scales tip decisively towards revisionism on the core *moral* question. McMahan's fundamental insight is correct: **the Moral Equality of Combatants is a fiction.** A combatant fighting without a just cause lacks the underlying moral right to kill enemy combatants. Their adherence to *jus in bello* constraints may mitigate the *wrongfulness* (making it proportionate, discriminating against non-combatants) and often provides a powerful *excuse* for the individual soldier, but it cannot transform the killing into a morally *permissible* act. The self-defense analogy holds: the unjust combatant remains an unjust threat. The objective moral asymmetry is real.

  **However, Walzer's insights into the *pragmatic necessity* of symmetry for the laws of war remain overwhelmingly persuasive.** The potential consequences of abandoning the legal fiction of MEC – the collapse of incentives for restraint by unjust combatants, the paralyzing difficulty of adjudicating *ad bellum* justness in real-time during conflict, the hindrance to war termination and prisoner treatment – are too catastrophic to ignore. The current legal framework, built on MEC, demonstrably saves lives and limits suffering, even if it rests on a moral falsehood.

  Therefore, the qualified verdict is: **Combatants are morally unequal. Just combatants possess a right to kill unjust combatants as a necessary defense; unjust combatants lack this right, and their killings are objectively wrongful, though often excused. However, for compelling pragmatic reasons essential to mitigating the horrors of war, the legal fiction of their equality must be maintained.** We should strive to align law closer to morality where possible (e.g., strengthening prosecution of aggression and clear *in bello* crimes, refining doctrines of excuse), but dismantling the foundational legal symmetry of combatant status would be reckless. The tragic reality is that in the hell of war, a morally imperfect legal convention may be the best available tool to preserve a shred of humanity. We must hold the moral truth in mind while recognizing the necessity of the legal fiction.
