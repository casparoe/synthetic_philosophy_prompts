answer: |-
  You've articulated a profound and unsettling question at the intersection of logic, philosophy, and mathematics. Let's break this down step by step:

  ### 1. **Gödel's Second Incompleteness Theorem & Its Implications**
     - **Yes**: Gödel (1931) proved that no consistent formal system capable of encoding Peano Arithmetic (PA) can prove its own consistency. This applies to PA, ZFC, and stronger systems.
     - **Yes**: If ZFC were inconsistent, the principle of explosion would make every well-formed statement (and its negation) provable, rendering all formal proofs in Lean (or any ZFC-based system) logically meaningless.
     - **Yes**: We cannot *settle* ZFC's consistency from within ZFC itself (or PA within PA).

  ### 2. **Is Trust in ZFC/PA an "Act of Faith"?**
     **In a strict logical sense, yes**—but it's a *pragmatic, empirically informed* faith, not blind belief. Here's why:

     - **Empirical Evidence**: ZFC has been stress-tested for nearly a century. Millions of proofs (from elementary results to cutting-edge research) have been formalized without deriving a contradiction. While not a guarantee, this track record is meaningful. As Timothy Gowers put it:  
       > *"We have no good reason to believe that ZFC is inconsistent, and many good reasons to believe that it is consistent."*
     - **Partial Verification**: Weaker systems (e.g., Primitive Recursive Arithmetic) *can* prove the consistency of even stronger systems. For example:
       - **Gentzen's consistency proof** (1936): Used transfinite induction up to ε₀ to prove PA's consistency. This relies on methods beyond PA but is still finitary in a broader sense.
       - **Gödel's Dialectica interpretation**: Proved the consistency of PA using higher-order functions (though still relying on a weaker meta-theory).
     - **Robustness of Mathematics**: If ZFC were inconsistent, the contradiction would likely arise in esoteric set-theoretic axioms (e.g., large cardinals), not in core arithmetic. Most "ordinary" mathematics (e.g., number theory, analysis) could survive by retreating to a weaker system (e.g., ACA₀).

  ### 3. **Why Aren't Mathematicians Bothered?**
     - **Pragmatism**: Mathematics works. Airplanes fly, cryptography secures data, and physics models predict experimental results—all built on ZFC/PA. As Saunders Mac Lane observed:  
       > *"We function by acting as if our foundations are secure, while remaining aware they might not be."*
     - **Compartmentalization**: Most mathematicians work far from foundational issues. The risk of a contradiction affecting, say, algebraic geometry is seen as negligible.
     - **Redundancy**: Key results are often provable in multiple systems. If ZFC fell, we'd likely salvage most mathematics in a slightly weaker system (e.g., ZF or even constructive alternatives like ETCS).
     - **Proof Assistants as Safeguards**: Lean (based on Calculus of Inductive Constructions) and Coq are not directly built on ZFC. Their kernels are tiny (often < 1000 LOC) and can be verified by hand. While they assume consistency of their core calculus, this is simpler than trusting all of ZFC.

  ### 4. **The Role of Proof Assistants Like Lean**
     - Lean's foundation (dependent type theory) is *different* from ZFC but equally subject to Gödel's theorems. However:
       - Its kernel is small enough to be audited.
       - It can formalize consistency proofs (e.g., Gödel's theorem *within* Lean).
       - Consistency of its core (CIC) is supported by:
         - A model in ZFC (if you trust ZFC),
         - Normalization proofs (e.g., via logical relations),
         - Decades of use without contradiction.

  ### 5. **A Balanced Perspective**
     - **No free lunch**: Gödel showed that *absolute* certainty in mathematics is unattainable. But this doesn't make mathematics "arbitrary."
     - **Risk assessment**: The probability of a contradiction in PA/ZFC is judged to be vanishingly small. As Andrej Bauer notes:  
       > *"Inconsistency in ZFC would be the greatest scientific discovery in history, rewriting logic, mathematics, and computer science. But betting against it has been a winning strategy for 90 years."*
     - **Philosophical fallback**: If consistency is unprovable, we can still value mathematics for its:
       - **Internal coherence**: No contradiction has been found.
       - **Utility**: It describes the physical world remarkably well.
       - **Aesthetic richness**: Patterns and structures that are profound in their own right.

  ### Conclusion
  **Trust in ZFC/PA is not *pure* faith—it's a rational bet backed by empirical success and meta-mathematical evidence.** While we can't achieve Hilbert's dream of finitary absolute certainty, the weight of experience suggests that working mathematicians (and proof assistants) are building on solid ground. The unease you feel is a hallmark of deep engagement with foundations—but history shows that mathematics progresses precisely by navigating these uncertainties. If inconsistency ever emerges, the community will adapt, as it did after Russell's paradox. Until then, the proofs hold.
