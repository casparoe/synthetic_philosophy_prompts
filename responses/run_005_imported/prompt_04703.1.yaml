prompt: |-
  Been rereading the population ethics chapters of Reasons and Persons this week because a friend from the EA forum and I got into it over dinner about whether total utilitarianism is secretly committed to something monstrous, and now I can't stop thinking about it. The Repugnant Conclusion itself is old hat at this point though -- every rationalist-adjacent person has had the "huge population of lives barely worth living beats a small population of great lives" thing explained to them a dozen times, usually via Parfit's Mere Addition Paradox (A -> A+ -> B -> ... -> Z). Thats not actually what I want from you.

  What I want is for you to engage with Arrhenius's impossibility theorem(s) -- the result (from his old PhD thesis, and then a population ethics book that apparently took him something like two decades to actually finish) showing this isn't just a problem for total utilitarianism specifically. Basically every welfarist population axiology anyone has seriously proposed -- average views, critical-level views, variable-value views, lexical views, you name it -- ends up violating some condition that seems just as intuitively solid as whatever generated the Repugnant Conclusion in the first place. I'm thinking of conditions along the lines of Non-Sadism, Non-Elitism, and Egalitarian Dominance, plus whatever forces something like the Sadistic Conclusion or the Anti-Egalitarian Conclusion on you instead if you try to dodge the original problem -- I might be mangling some of the exact labels, so correct me if I am, that's fine.

  Given all that, write me an essay that actually takes a side instead of surveying the menu of options and shrugging (I've read enough SEP-style "here are six views, each with its own costs" pieces already, don't need another one of those). Argue for a specific resolution: which condition(s) you'd personally give up, and what the resulting view should look like -- whether that's just biting the Repugnant Conclusion bullet the way Tannsjo apparently does, accepting some narrower sadistic-flavored conclusion in a restricted range of cases, going with a critical-level or lexical view a la late-period Parfit and eating those costs instead, or retreating to some person-affecting view and just owning its intransitivity problems. Don't hedge by saying every option is "coherent" -- actually defend why the bullet you're choosing is less costly than the alternatives. Feel free to get technical, I'm familiar enough with the debate that you don't need to hold my hand through the basics.
