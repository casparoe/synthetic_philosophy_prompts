  ### Analysis of the Exchange Between Lena and Marcus

  The dispute between Lena and Marcus revolves around the interpretation of their referral bonus rule—"5% of the invoice"—when applied to their first six-figure contract ($200,000). The core issue is whether the rule determinately means a pure 5% with no cap (resulting in a $10,000 payout) or whether it could be interpreted as having an implicit cap that only becomes relevant for larger invoices. Below, I break down the exchange move by move, assessing who has the better argument at each stage and why. I then discuss what both parties might be missing. Finally, I provide an overall conclusion on who has the better of the exchange.

  #### Move (1): Marcus's Claim of Obviousness
  - **Marcus's Argument**: Marcus asserts that the payout is "obviously" $10,000 because "5% of the invoice" has always been applied literally in the past to all invoices under $10,000. He emphasizes that the meaning is clear from the rule's consistent application: 5% simply means 0.05 times the invoice amount, and this is what they've always meant.
  - **Assessment**: Marcus has a strong initial point based on the rule's plain language and historical application. In all past cases, the rule was applied uniformly without deviation or discussion of exceptions, suggesting a straightforward percentage-based approach. This aligns with how such rules are commonly understood in business contexts—e.g., a percentage implies proportionality without inherent limits. For invoices within the observed range (under $10,000), the payout was always calculated as 5%, and there is no evidence of a cap being considered or applied. Thus, extending this to a $200,000 invoice seems like a natural, literal interpretation. Marcus's view is practical and avoids unnecessary complexity.

  #### Move (2): Lena's Underdetermination Argument
  - **Lena's Argument**: Lena counters that the past payouts are equally consistent with a rule that includes a cap (e.g., 5% up to a certain invoice size, then flattens). Since all previous invoices were under $10,000 (with payouts under $500), no data point exists to distinguish between a pure 5% rule and a capped rule (e.g., min(5%, C) where C is some cap greater than $500). Therefore, the history alone doesn't settle which rule was actually being followed; the $200,000 invoice is a novel case that reveals ambiguity.
  - **Assessment**: Lena has the better argument here. Her point draws on a well-established concept in philosophy and statistics known as the **underdetermination of theory by data**. Essentially, limited data (in this case, only small invoices) can support multiple interpretations or rules. For example:
    - A pure 5% rule (y = 0.05x) fits all past data.
    - A capped rule (e.g., y = 0.05x for x ≤ $10,000, then y = $500 for x > $10,000, or any cap C ≥ $500) also fits all past data because no invoice exceeded the range where the cap would activate.
    Since the rule was never tested at larger scales, Lena is correct that the history doesn't "fix" one interpretation over the other. This is not mere skepticism—it's a logical point about inference from limited evidence. Marcus's appeal to obviousness ignores that rules can have latent ambiguities in untested scenarios.

  #### Move (3): Marcus's Appeal to Introspection
  - **Marcus's Argument**: Marcus tries to resolve the ambiguity by referencing his private mental state: he claims he always intended "5%, no matter how large the invoice." He argues that this personal intention clarifies the rule's meaning, making the $10,000 payout determinate.
  - **Assessment**: Marcus's argument is weak here. While introspection might seem like a straightforward way to settle intent, it is subjective and unverifiable. In philosophy of mind and language, private mental states are not always reliable for establishing shared meaning (as discussed in Wittgenstein's later work). Marcus may sincerely believe his intention was clear, but this doesn't address the core issue: the rule was a shared practice between him and Lena, not solely dependent on his internal thoughts. Moreover, as Lena points out in the next move, even Marcus's introspective claim is open to reinterpretation. Thus, Marcus's move doesn't resolve the dispute; it shifts to an unreliable basis for decision-making.

  #### Move (4): Lena's Critique of Introspection
  - **Lena's Argument**: Lena argues that Marcus's introspection is unhelpful because his mental state is just as ambiguous as the rule itself. Phrases like "no matter how large" could be vague or incomplete when applied to extremes (e.g., a $1 billion invoice). She suggests that Marcus might not have fully formed or accurate intentions for unencountered cases—he could have "balked or miscalculated" if faced with an outlandish number, meaning his current assertion doesn't necessarily reflect a pre-existing fact.
  - **Assessment**: Lena has the better argument. Her critique highlights the **problem of vagueness and hypothetical intention**. People often have general principles (like "5% forever") but don't fully consider edge cases until they arise. Cognitive science supports this: intentions for novel situations are often constructed on the spot, not retrieved from a pre-stored mental blueprint (as per research on decision-making under uncertainty). For instance, if the invoice were $1 billion, Marcus might intuitively reject a $50 million payout, revealing that his "no matter how large" intention wasn't absolute. Lena's point shows that introspection cannot objectively settle the rule's meaning because it is susceptible to hindsight bias and may not have been robustly defined. This undermines Marcus's move (3) effectively.

  #### Move (5): Marcus's Absurdity Claim
  - **Marcus's Argument**: Frustrated, Marcus argues that Lena's logic leads to absurdity: if neither past practice nor personal intention can fix meaning, then no agreement between people could ever have a determinate interpretation. This, he claims, is clearly false (and "absurd"), as it would make communication and contracts impossible.
  - **Assessment**: Marcus has the better argument here. His point is a **reductio ad absurdum** that exposes the impractical consequences of Lena's position. While Lena's underdetermination and vagueness points are valid for this specific case, extending them universally would indeed undermine the possibility of determinate meaning in language and agreements. In reality:
    - Shared rules derive determinacy from **literal interpretation**, **context**, and **reasonable expectations**. For example, in contract law, the "plain meaning rule" prioritizes ordinary language, and ambiguities are resolved based on objective standards (e.g., what a reasonable person would understand).
    - Social practices rely on default assumptions; e.g., "5% of the invoice" strongly implies proportionality without a cap, and introducing a cap would require positive evidence (like past discussions or industry norms).
    If every agreement were open to radical reinterpretation for novel cases, trust and cooperation would break down. Marcus's move forces Lena to confront the need for a workable standard of interpretation, which she cannot rebut. Thus, his argument wins on practical and philosophical grounds, as it preserves the integrity of shared rules.

  ### What Both Parties Are Missing
  - **Purpose of the Rule**: Both focus on the rule's form (percentage vs. cap) but overlook its **intent and function**. The referral bonus is meant to incentivize freelancers to bring in business by sharing a portion of the value generated. A pure 5% rule aligns with this purpose by scaling rewards with the invoice size, encouraging high-value referrals. A cap might undermine incentives for larger contracts. Considering this could resolve the ambiguity: if the bonus is for proportional reward, no cap is sensible; if it's a token gesture, a cap might be fairer.
    
  - **Reasonable Interpretation and Context**: Neither appeals to objective standards. In business contexts, percentage-based referral bonuses are commonly uncapped unless specified. Additionally, the freelancer's expectations matter: if freelancers were told "5% of the invoice," they likely anticipated a proportional payout, and denying $10,000 could damage trust. Marcus and Lena could also consider industry norms or discuss what is reasonable for a $200,000 contract.

  - **Resolution Through Dialogue**: The dispute arises from an implicit, unwritten rule. Both miss that this is a moment for explicit agreement—e.g., renegotiating the rule for large invoices based on fairness. Instead of debating "what was meant," they should focus on "what should be done now," considering costs, relationship with the freelancer, and future cases.

  - **Philosophical Insight**: This mirrors Wittgenstein's rule-following paradox (e.g., in *Philosophical Investigations*), where rules don't contain their own applications to new cases. Meaning emerges from communal practice, not private states. Here, Lena and Marcus need to extend their practice collaboratively rather than seeking a pre-existing "fact."

  ### Overall Conclusion
  In the exchange, **Marcus has the better of the overall argument** because his move (5) successfully challenges the skepticism in Lena's position and upholds the determinacy of shared rules. Lena wins moves (2) and (4) by exposing legitimate ambiguities in historical practice and introspection, but these points are insufficient to defeat Marcus's core claim that meaning must be determinate for agreements to function. Ultimately, the rule "5% of the invoice" should be interpreted literally for the $200,000 contract, resulting in a $10,000 payout, as this is the simplest, most consistent application based on past behavior and common understanding. However, both should address the underlying issue by formalizing the rule to avoid future disputes.
