  Ok so I have to pick between two teachers for AP Chem next year and I can't decide. Ms Carter's taught it forever, she's tough but everyone knows exactly what to expect from her grading. The other option is a brand new teacher, could be way easier or way harder, literally zero info on him anywhere. Honestly if I had to guess, I'd guess he's probably the easier grader, but I still keep leaning toward Ms Carter anyway, even though this grade actually matters for my GPA. My friend says thats backwards, like if I actually think he's more likely to be easier I should just pick him. Is my friend right, or is there an actual reason to stick with the teacher I know even when I think the unknown option might be better?
