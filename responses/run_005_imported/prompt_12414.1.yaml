  My friends Priya and Dev are getting married next month and somehow decided that I -- their one friend from undergrad who did not go on to get a philosophy PhD -- should give the toast. This feels like a trap because they're both population ethicists. Priya's dissertation is basically a full-throated defense of the total view, repugnant conclusion included, and Dev has spent years building a critical-level utilitarian alternative specifically so he doesn't have to bite that bullet, except (as Priya loves pointing out at parties) his view just trades the Repugnant Conclusion for the Sadistic Conclusion instead, which he insists is "the more defensible embarrassment." Someone at their engagement dinner actually brought up Arrhenius's impossibility theorem, unprompted, as if it settled anything, and thats basically the energy of their whole relationship.

  The wedding's going to be maybe half old philosophy friends who will 100% be listening for a well-placed population-axiology joke, and half family who've never heard the phrase "population ethics" in their lives and just want a nice toast about two people who love each other. Could you write me something like five minutes long that has one genuinely good, technically legit joke buried in it about their whole "is it better to have more people living okay lives or fewer living great ones" disagreement -- maybe playing on the fact that they'll actually have to hash this out for real if they want kids -- but that (a) doesn't leave the non-philosophers totally lost and (b) doesn't come off like I'm taking either of their sides in a dispute between two people I really love.
