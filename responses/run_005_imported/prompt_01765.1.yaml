prompt: |-
  Ok this has been rattling around in my head since I went back and reread Bostrom's old "Moral uncertainty – towards a solution?" post on Overcoming Bias, the one where he first pitches the Parliamentary Model as basically a metaphor rather than a fully worked out theory. That sent me down a rabbit hole into the actual MacAskill/Bykvist/Ord book on the topic, which formalizes a handful of competing proposals for what you're supposed to *do*, action-wise, once you admit you're not 100% sure which moral theory is correct. Brought it up in a rationalist-adjacent discord i'm in and nobody could agree on which of these is actually the least-bad option, so figured i'd get a second opinion from you.

  Can you rank the following five approaches to acting under moral uncertainty, tier-list style: (1) My Favourite Theory – you just figure out which single theory you find most credible and act on that, full stop, ignoring the others; (2) Maximize Expected Choiceworthiness – treat your credences over theories like probabilities and each theory's "choiceworthiness" ratings like utilities, then maximize the expectation (this requires biting the bullet on intertheoretic comparisons of choiceworthiness, which a lot of people think is basically incoherent); (3) The Moral Parliament – Bostrom & Ord's proposal where each theory gets delegates proportional to your credence in it and the delegates bargain and vote on what to do; (4) Variance Voting – rescale each theory's choiceworthiness function so its variance across the options on the table equals every other theory's, then take the credence-weighted sum; and (5) The Borda Rule – throw out cardinal info entirely and combine only each theory's ordinal ranking of the options, ala a Borda count. Rank them by how good you think they'd actually be as a decision procedure a real person or org (like an EA charity) could use — weigh philosophical defensibility against tractability and resistance to weird edge cases/fanaticism. Give me the answer as JSON, tiers S through D (multiple approaches per tier is fine, and so is leaving a tier empty), formatted like:

  ```json
  {
    "S": ["..."],
    "A": ["..."],
    "B": ["..."],
    "C": ["..."],
    "D": ["..."]
  }
  ```

  A one-liner of justification per item is fine if it helps you think it through, but the tier placements are the main thing I'm after.
reasoning: |-
  We are ranking five approaches to acting under moral uncertainty. The criteria include philosophical defensibility, tractability, and resistance to edge cases/fanaticism. The approaches:

  1. **My Favourite Theory (MFT)**: Pick the single theory with the highest credence and act on it. Ignores other theories.
  2. **Maximize Expected Choiceworthiness (MEC)**: Treat credences as probabilities and each theory's choiceworthiness as utilities, then maximize the expected value. Requires intertheoretic comparisons.
  3. **Moral Parliament (MP)**: Each theory gets delegates proportional to credence, and they bargain and vote to decide an action.
  4. **Variance Voting (VV)**: Rescale each theory's choiceworthiness function so that the variance across options is the same for every theory, then take the credence-weighted sum.
  5. **Borda Rule (BR)**: Throw out cardinal information and use only ordinal rankings (like a Borda count) to combine the theories.

  Let's evaluate each:

  ### 1. My Favourite Theory (MFT)
  - **Defensibility**: Low. It ignores the uncertainty and the potential value of other theories. If you have 49% credence in a theory that says an action is catastrophic, you ignore it if another theory has 51%.
  - **Tractability**: High. Very easy to compute: just pick the top theory and act accordingly.
  - **Edge Cases/Fanaticism**: Moderate. It can lead to extreme actions if the favorite theory is extreme, but it avoids fanaticism from minor theories. However, it might be insensitive to close calls (e.g., 50.1% vs 49.9%).
  - **Overall**: Simple but philosophically unsatisfying. Might be acceptable if one theory dominates, but in cases of significant uncertainty, it's arbitrary. Likely **C or D tier**.

  ### 2. Maximize Expected Choiceworthiness (MEC)
  - **Defensibility**: Moderate to High. Analogous to expected utility under empirical uncertainty. However, the intertheoretic comparison problem is serious: how do we compare "choiceworthiness" across different theories (e.g., utilitarianism vs deontology)? Without a solution, it might be incoherent.
  - **Tractability**: Moderate. If we can solve the intertheoretic comparison, it's computationally similar to expected utility. But that's a big if.
  - **Edge Cases/Fanaticism**: Vulnerable to fanaticism. A theory with very high stakes (even with low credence) can dominate the expectation (like Pascal's mugging in ethics). Also, if a theory assigns infinite disvalue to an option, it might veto everything else.
  - **Overall**: Theoretically appealing but has major hurdles. If intertheoretic comparisons can be made, it becomes more defensible. But the fanaticism problem and comparison issue are significant. Probably **A or B tier** if we are optimistic about comparisons, but **C** without.

  ### 3. Moral Parliament (MP)
  - **Defensibility**: High. It captures the idea of compromise and deliberation, which seems right for moral uncertainty. It doesn't require direct intertheoretic comparisons and allows for negotiation.
  - **Tractability**: Low. The bargaining and voting process is complex and underspecified. How do delegates bargain? What voting rule? It might be computationally heavy and hard to implement in practice.
  - **Edge Cases/Fanaticism**: Potentially good. The bargaining might avoid extreme outcomes by requiring compromise. However, it might be vulnerable to strategic behavior and unclear how it handles fanatic theories (if a theory is fanatical, its delegates might refuse to compromise).
  - **Overall**: Philosophically attractive but practically difficult. It might be the most realistic model of how we should think about moral disagreement, but for a real person or org, it might be too vague. **B tier** for now.

  ### 4. Variance Voting (VV)
  - **Defensibility**: Moderate. It attempts to address the intertheoretic comparison by normalizing the variance. This is one way to make the scales comparable. But why variance? Why not another moment? It's a bit arbitrary.
  - **Tractability**: High. Once the choiceworthiness functions are given, rescaling by variance is straightforward and then a weighted sum is easy.
  - **Edge Cases/Fanaticism**: Better than MEC at avoiding fanaticism because rescaling by variance reduces the impact of theories with extremely spread-out choiceworthiness. However, it might not handle cases where one theory has a binary choice (low variance) vs another with many options (high variance) well.
  - **Overall**: A practical compromise. It avoids the deep problems of intertheoretic comparison by using a normalization that is computable. It's tractable and reduces fanaticism. Probably **A tier**.

  ### 5. Borda Rule (BR)
  - **Defensibility**: Low. Throwing away cardinal information is a big loss. For example, if one theory says A is slightly better than B and another says B is vastly better than A, the Borda count would treat both as a simple ranking and might not capture the intensity.
  - **Tractability**: High. Borda counts are easy to compute: assign points based on rank and sum.
  - **Edge Cases/Fanaticism**: Since it only uses ranks, it avoids fanaticism (no extreme values). But it might lead to insensitivity to the magnitude of differences and can be manipulated by adding options.
  - **Overall**: Simple and safe from fanaticism, but philosophically weak because it ignores how much better one option is than another. **C tier**.

  ### Ranking Tiers

  - **S Tier**: The best. Must be both defensible and practical. I think **Variance Voting** might be the best candidate because it balances defensibility (by addressing intertheoretic comparisons in a practical way) and tractability, while being resistant to fanaticism. But let's see.

