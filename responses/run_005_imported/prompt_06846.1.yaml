answer: |-
  Your core argument—that SSA's "embarrassment" (Doomsday) applies to **real, open empirical questions**, while SIA's (Presumptuous Philosopher) relies on **empirically negligible scenarios**—is philosophically astute and defensible. Below, I address your three requests with detailed analysis, objections, and recommendations for revision:

  ---

  ### **1. Does the empirical premise survive contact with cosmology?**  
  **Short answer:** No—cosmology (specifically eternal inflation) *does* instantiate the problematic theory-pairs, threatening your asymmetry.  

  #### Key Issues:  
  - **Eternal Inflation & the Measure Problem**: In multiverse cosmologies, competing theories routinely posit wildly different observer populations (e.g., "small" vs. "infinite" universes). Crucially, these theories *can* be empirically indistinguishable with current data. For example:  
    - **Theory A**: Predicts a small multiverse with \(10^{100}\) observers.  
    - **Theory B**: Predicts infinite multiverses with infinitely many observers (e.g., in pocket universes).  
    Both may fit all non-anthropic evidence (e.g., CMB, dark energy). SIA would overwhelmingly favor Theory B, despite no empirical difference—exactly the "Presumptuous Philosopher" scenario.  

  - **The Boltzmann Brain Problem**: Arises directly from SIA-like reasoning in cosmology. If the universe is eternally inflating, random fluctuations (Boltzmann Brains) should vastly outnumber evolved observers. Yet we observe the latter. This forces cosmologists to reject SIA-friendly measures or posit new physics—showing your "negligible" scenario is **centrally relevant** to modern physics.  

  **Conclusion for your paper**: Acknowledge this challenge. Argue that for *terrestrial* anthropics (e.g., Doomsday), your asymmetry holds, but in cosmology, SIA faces genuine problems. This nuance strengthens your argument by preempting obvious counterexamples.

  ---

  ### **2. Is your asymmetry argument novel?**  
  **Short answer:** Partially—it’s a recognized *tactic* but not foregrounded as you propose.  

  #### Literature Context:  
  - **Bostrom (2002)** notes SIA avoids Doomsday but concedes Presumptuous Philosopher is its "Achilles’ heel." He *implies* the latter is less urgent but doesn’t argue from empirical realizability.  
  - **Nick Bostrom & Milan Ćirković (2003)** briefly suggest Presumptuous Philosopher requires "special" evidence, but don’t develop the asymmetry.  
  - **Radford Neal (2006)** defends SIA by arguing Presumptuous Philosopher scenarios are "unlikely to arise," aligning with your view—but without your emphasis on *open empirical questions*.  

  **Verdict**: Your framing—contrasting Doomsday’s **real-world applicability** with Presumptuous Philosopher’s **empirical rarity**—is underdeveloped in the literature. Cite Neal for support, but claim originality in leveraging this asymmetry as a criterion for principle selection.

  ---

  ### **3. Strongest Objection to Preempt**  
  **The Principle-Dependency Objection**:  
  > *"Whether a theory-pair is 'empirically indistinguishable' depends on the chosen confirmation theory. SIA itself *determines* what counts as evidence. Rejecting SIA for requiring 'negligible' scenarios is circular: you assume a non-SIA framework to judge SIA’s plausibility."*  

  #### Why it’s powerful:  
  - If SIA is true, "ordinary evidence" includes observer-count information. Theories with more observers *better predict your existence*, so they *aren’t* empirically equivalent under SIA. Claiming they are "indistinguishable" presupposes SIA is false.  
  - **Analogy**: Rejecting the Copernican principle because it makes Earth’s non-special location "embarrassing" in a geocentric cosmos.  

  #### How to Defend:  
  - Argue that theory choice must prioritize *actual scientific practice*:  
    > "When cosmologists compare multiverse models, they treat non-anthropic data (e.g., cosmological constants) as theory-neutral. SIA’s injection of observer counts *creates* equivalence classes where science sees distinctions. Until SIA is proven, we shouldn’t let it override parsimony in theory selection."  

  ---

  ### **Recommendations for Revision**  
  1. **Refine Scope**: Limit your claim to *non-cosmological* contexts (e.g., Doomsday). For cosmology, concede SIA’s problems but argue they’re *distinct* from Doomsday’s immediacy.  
  2. **Preempt Circularity**: Add a section titled "Is the Negligibility Premise Question-Begging?" to address the principle-dependency objection head-on.  
  3. **Boost Originality**: Contrast your "empirical realizability" criterion with prior work (e.g., "Unlike Neal (2006), I argue SSA’s real-world applicability makes its problems *more urgent*...").  
  4. **Key Citations**:  
      - Bostrom (2002): *Anthropic Bias* (Ch. 7)  
      - Neal (2006): "Puzzles of Anthropic Reasoning" (§4)  
      - Carroll (2017): "Why Boltzmann Brains Are Bad" (re: cosmology’s relevance)  

  **Final Line**:  
  > "While cosmology complicates the picture, SIA’s flaws emerge only in exotic realms where theory outruns data. SSA, by contrast, forces grim real-world choices about humanity’s future. Until science demands we count hypothetical minds, Occam’s razor favors SIA."  

  This positions your argument as a pragmatic, scientifically grounded defense—even if cosmology softens the asymmetry. Well-argued and philosophically sharp!
