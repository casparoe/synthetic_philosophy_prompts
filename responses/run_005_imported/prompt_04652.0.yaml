  For Dr. Vale (pro-Aumann), I'll channel the steelman version: if we abandon rationality at unreachable nodes, game theory collapses into ad hoc reasoning. Her trump card should be that any deviation must be interpreted as irrational—otherwise we enable self-fulfilling prophecies of cooperation. 

