  First, I need to recall both arguments clearly. Newton's bucket supports substantivalism by showing that rotation implies absolute space since relative motion alone doesn't explain the concave water surface. The hole argument, on the other hand, uses GR's diffeomorphism invariance to argue against substantivalism, leading to indeterminism if spacetime points have independent identities. The user is right to see tension here because one argument seems to support substantivalism while the other undermines it.

  I should clarify the key differences in what each argument targets. The bucket is about inertial structure and motion, needing an absolute reference. The hole argument is about the individuality of spacetime points. This distinction is crucial. The user might be conflating different layers of substantivalism: one about the reality of space(time) as a background, and another about the identity of points independent of fields.

  Next, addressing "sophisticated substantivalism." This approach, advocated by Hoefer and others, rejects haecceitism for spacetime points. Points don't have primitive identities; they're defined by the fields they carry. So, in the hole argument, the two metrics are just representations of the same physical reality, avoiding indeterminism. The user wants to know if this allows accepting the bucket's conclusion. Yes, because sophisticated substantivalism still allows spacetime to be a real entity with structure (metric), which provides the inertial framework needed for rotation, without committing to point identities.

  The user's deeper need might be understanding how to reconcile GR with absolute rotation. Mach's principle comes into play here, where the mass distribution affects inertia. GR incorporates this, so the fixed stars (mass distribution) determine inertial frames. Thus, rotation is relational to the mass distribution, not absolute space. But spacetime's geometric structure (metric) is still real, supporting sophisticated substantivalism.

  Now, which argument do I find more convincing? The hole argument seems stronger because it's rooted in GR's mathematical framework, showing the consequences of diffeomorphism invariance. Newton's bucket relies on pre-GR physics, and GR itself offers a relational explanation through the metric field influenced by matter. However, the user might be interested in the ongoing debate, like whether GR fully implements Mach's principle. Emphasizing that sophisticated substantivalism resolves the tension by accepting spacetime's reality without haecceities.

  I should also check if I'm missing any nuances. The user mentioned Earman & Norton, so clarifying the hole argument's origin and how it uses Leibniz equivalence. Also, ensuring I explain why determinism fails in the naive substantivalist view. The user's confusion might stem from the term "substantivalism" being used in different contexts, so highlighting the two theses (reality vs. haecceity) is key.

