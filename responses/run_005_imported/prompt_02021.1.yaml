    "2": "Priest's dialetheic theory, which accepts that the Liar is both true and false",
    "3": "Field's paracomplete theory, which replaces classical negation with a transfinite hierarchy of determinacy operators",
    "4": "Gupta-Belnap revision theory, on which the Liar's truth value never stabilizes under repeated revision rather than being simply gappy",
    "5": "Kripke's minimal fixed-point theory built on the strong Kleene scheme, on which the Liar comes out truth-valueless"
  }
  ```

  **Key Insight**: Theories that impose rigid expressive constraints (Tarski) or absorb contradictions (Priest) fare best. Those relying on semantic gaps (Kripke) or iterative processes (Field, Gupta-Belnap) are more vulnerable, as their internal resources enable revenge sentences. Kripke’s theory ranks last due to its inability to express its own central concept (truth-valuelessness) without collapse.
