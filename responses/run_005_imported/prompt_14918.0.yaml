  **Key Takeaways for Your Classifier:**  
  - **Epistemicism:** Your model’s sharp flip reflects a real (but unknowable) cutoff. Ignorance arises from inexact knowledge (margin-for-error), not missing data. Policy should accept that explanations are impossible at the boundary.  
  - **Supervaluationism:** The flip point is arbitrary; vagueness means no fact of the matter exists until deep into clear cases. Policy should allow "borderline" verdicts or context-dependent precisifications.  
  - **Shared Weakness:** Both struggle with forced binary choices—E admits ignorance, S admits arbitrariness. Neither "solves" vagueness; they reinterpret it.
