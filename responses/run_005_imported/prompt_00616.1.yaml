answer: |-
  ## Quine's Unnaturalized Ethics: A Tension in the Web

  Your unease is profoundly warranted. Quine's "On the Nature of Moral Values" does indeed sit like a dissonant chord within the symphony of his naturalized epistemology. The core tension lies precisely where you identify it: Quine dismantles foundationalist dualisms (analytic/synthetic, theory/observation) with the wrecking ball of holism, yet erects a new, seemingly unstable wall between scientific fact and moral value, relegating the latter to emotivist non-cognitivism. Morton White’s objection strikes at the heart of this inconsistency. Let’s reconstruct both sides forcefully before rendering a verdict.

  **The Case for a Consistent Quinean Moral Cognitivism (White's Gambit)**

  1.  **Holism Demolishes Dualisms:** Quine’s masterstroke was showing that beliefs face experience not individually, but as a corporate body – the "web of belief." There is no pristine observation language; all sentences are theory-laden. There is no sharp analytic/synthetic divide; meaning is imbricated with empirical content. Crucially, *anything* can be held true come what may, if we make sufficient adjustments elsewhere in the web.
  2.  **Expanding the Periphery:** If sensory irritation is the primary (but not exclusive) "recalcitrant experience" prompting web adjustments, why is this the *only* kind of input? Quinean holism suggests the web is answerable to *any* input causing tension requiring resolution. Moral sentiments – feelings of outrage, empathy, approval, guilt – generated by social interaction, perceived injustice, or reflection, *are* such inputs. They constitute a form of "social irritation" or "normative friction" impinging on the periphery.
  3.  **Moral Beliefs *Within* the Web:** Moral judgments ("Slavery is wrong," "Helping others is good") function within the web just like other theoretical statements. They are connected to:
      *   **Descriptive Beliefs:** Facts about suffering, autonomy, social consequences (e.g., "Slavery causes immense suffering," "Cooperation fosters group survival").
      *   **Other Moral Beliefs:** Forming interconnected subsystems (e.g., principles of fairness, harm avoidance).
      *   **Psychological/Sociological Theories:** Explanations of why we have certain sentiments.
  4.  **Adjudication is Holistic, Not Magical:** Quine objects that moral disputes appeal only to other moral standards. But scientific disputes also appeal to other scientific beliefs! The key is *holistic adjudication*. Confronted with moral disagreement (e.g., on capital punishment), we:
      *   Examine factual consequences (deterrence, cost, irrevocability of error).
      *   Probe consistency with other held values (sanctity of life, retribution, fairness).
      *   Consider psychological/sociological explanations for differing intuitions.
      *   Revise *some* component(s) – factual beliefs, derivative moral principles, or rarely, core values – to reduce overall tension. This process *is* analogous to scientific theory revision under empirical pressure.
  5.  **Convergence is Relative, Not Absent:** Quine notes less convergence in ethics than science. But holism explains this: Moral values are often *further* from the sensory periphery, connected through longer, more complex inferential chains involving deeply held cultural and psychological factors. Greater variance is *predicted* by holism for domains less directly tied to immediate sensory prediction. This doesn't imply non-cognitivism; it implies greater complexity and contextual sensitivity.
  6.  **Naturalized Ethics is Possible:** A Quinean moral cognitivist would see ethics as a natural phenomenon. Moral beliefs arise from evolved social instincts, cultural learning, and rational reflection, all embedded within the natural world studied by science. Their truth conditions involve complex natural properties (well-being, flourishing, fair social relations) accessible through empirical and rational investigation, albeit messily. Disagreement stems from differing inputs (experiences, sentiments), starting points, and weightings within the holistic web, not because values lack cognitive content.

  **The Case for Quine's Principled Disanalogy**

  1.  **The Causal Chain to the World:** Scientific observation sentences (e.g., "It's raining") are *directly* keyed to specific, intersubjectively observable sensory stimuli (retinal patterns, auditory inputs) via conditioning. They are the *causal interface* with the world. Moral judgments ("That's cruel") lack this direct, stimulus-based conditioning. They are triggered by complex *interpretations* of situations filtered through existing normative frameworks. The causal chain involves layers of cognition and sentiment absent in basic observation.
  2.  **The Mechanism for Forcing Convergence:** Science possesses a unique engine: *prediction and control*. Conflicting theories generate divergent predictions about observable events. When experience recalcitrantly contradicts a prediction, the web *must* be adjusted. This public, repeatable process forces convergence over time (e.g., Newton to Einstein). Ethics lacks this engine. Conflicting moral frameworks (e.g., utilitarian vs. deontological) don't reliably generate divergent predictions about specific, observable sensory events in a way that forces one to yield. The "recalcitrance" is internal (sentimental discomfort, logical inconsistency) rather than external (sensory surprise).
  3.  **The Nature of the "Input":** Sensory irritation is largely *passive* and *involuntary* (light hits the retina). We are compelled by the world. Moral sentiments, while powerful, are more *active* and *interpretive*. They involve complex cognitive appraisals ("Was that intentional?", "Was there consent?"). They can be cultivated, suppressed, or reinterpreted. This malleability makes them less like a fixed external gauge and more like a component *within* the web itself.
  4.  **Ultimate Ends and the Coherentist Trap:** Science has an ultimate, shared, non-negotiable goal: predicting and explaining sensory experience. This anchors the coherentist loop. Ethics lacks a single, universally shared ultimate goal. Is it happiness? Duty? Freedom? Survival? Agreement on derivative values (e.g., "don't murder") can mask fundamental divergence on *why* (e.g., utility vs. sanctity). Disagreements about ultimate ends *can* only be resolved by appealing to other values or sentiments, leading to the "closed loop" Quine identified. There is no external, non-moral arbiter equivalent to sensory experience that can *force* a change in an ultimate end.
  5.  **The Role of Persuasion:** Because ethics lacks the forcing mechanism of sensory prediction failure, resolving fundamental moral disagreements often relies heavily on *rhetoric* and *emotional persuasion* – precisely the domain Stevenson highlighted. This is a functional difference in *how* beliefs are adjusted in the face of conflict, supporting the emotivist characterization at the level of fundamental disagreement.

  **Verdict: The Principled Disanalogy Stands, but with Significant Qualification**

  While the pull of holistic consistency is powerful, **Quine's disanalogy is ultimately principled and his methodological separation largely justified.** The core argument rests on points 2 and 4: the unique *forcing function* of sensory prediction failure and the lack of a universal, non-negotiable ultimate goal in ethics.

  A *consistent Quinean naturalist must be a cognitivist about derivative moral values and principles* ("Torturing innocents for fun is wrong," "Keeping promises is generally good"). These function holistically within the web, answerable to a complex periphery including social experience, psychological facts, and consistency with other beliefs. Disagreements here *can* be rationally adjudicated through holistic revision, appealing to consequences, consistency, and empirical realities (e.g., the psychological effects of torture, the social utility of promise-keeping).

  **However, Quine is correct that consistent naturalism leads to non-cognitivism (or at least, irreducible fundamental disagreement) concerning ultimate moral ends or foundational frameworks** ("Utility is the only good," "Duty is paramount," "Maximizing personal freedom is the supreme value"). Here, the analogy breaks down:

  1.  **No Forcing Mechanism:** No sensory experience can *force* a utilitarian to abandon utility for duty as the ultimate good, or vice versa, in the way Mercury's orbit forced adjustments to Newtonian physics.
  2.  **The Coherentist Trap:** Justification for an ultimate end can only appeal to coherence within a system built *upon* that end, or to its emotional resonance/persuasiveness. There is no external, non-question-begging anchor point analogous to sensory prediction.
  3.  **Emotion's Foundational Role:** At this bedrock level, adopting an ultimate end involves an element of commitment, sentiment, or persuasion that transcends purely cognitive, empirically constrained justification. Stevenson’s emotivism accurately captures the dynamic *at this specific level*.

  **Therefore, consistent Quinean naturalism supports a hybrid view:**

  *   **Cognitivism for Derivative Moral Values/Principles:** These are beliefs within the holistic web, potentially true or false, answerable to a broad periphery including social experience, psychological facts, and consistency. Rational adjudication of disagreements is possible.
  *   **Non-Cognitivism/Emotivism for Foundational Moral Frameworks/Ultimate Ends:** The choice between competing foundational frameworks (e.g., utilitarianism vs. deontology) cannot be settled by confronting a recalcitrant sensory experience in a way that forces convergence. Adjudication ultimately relies on coherence within a chosen system, persuasion, and the emotive force of the values themselves. Quine's characterization holds here.

  Quine's mistake in "On the Nature of Moral Values" was painting ethics with too broad an emotivist brush, failing to distinguish between derivative moral *beliefs* (which *can* be naturalized within the web) and fundamental moral *commitments* (where the disanalogy bites). The tension arises because he applied the critique meant for the foundation to the entire structure. A truly consistent Quinean naturalism demands this nuanced bifurcation, acknowledging both the holism that incorporates much of ethics into the web *and* the principled disanalogy that leaves ultimate ends resting, finally, on something closer to sentiment than on sensory compulsion.
