  Next, the user asks if Hume denies necessary connections in objects or is agnostic. The traditional view is that Hume outright denies metaphysical necessity, aligning with Lewis's Humeanism. But the "New Hume" interpretation, like Strawson and Wright, argues he's agnostic. Looking at the passage, Hume says necessity "exists in the mind, not in objects" and that it's impossible to form an idea of it as a quality in bodies. This seems explicit. However, phrases like "nor is it possible for us ever to form the most distant idea" might suggest epistemic limitation rather than ontological denial. But Hume's overall project in the Treatise is to show that ideas without impressions are meaningless. So, if we can't have an impression of necessity, then the idea is empty, implying there's no such thing. That supports the traditional reading. Still, the New Humeans point to Hume's language about secret powers and his later works where he might allow for unknown necessities. But in this section, he seems to reject placing efficacy in objects, God, or both, emphasizing it's "entirely" in the soul. That leans toward denial.

