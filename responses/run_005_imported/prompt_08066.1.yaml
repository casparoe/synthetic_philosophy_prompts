  - **Phenomenal-concept strategy (A):** Effectively dissolves the zombie problem by attributing conceivability to conceptual gaps, not metaphysical possibility, and extends to Kripke cases by analogy.  
  - **Kripke's essentialism (A):** Robustly explains necessary a posteriori identities (e.g., water/H₂O) through rigid designation but struggles to decisively refute zombie conceivability without supplementary arguments.  
  - **Yablo (B):** Positive conceivability avoids some Kripkean pitfalls but doesn't fully resolve zombie disputes, as both sides claim their position is positively conceivable.  
  - **Williamson (B):** Grounds modality in empirical counterfactual reasoning, which handles Kripke cases naturally but falters with zombies due to irreconcilable intuitions about consciousness.  
  - **Descartes (C):** Fails catastrophically for both cases, as clear and distinct perception deems zombies and "water ≠ H₂O" conceivable—directly contradicting Kripkean necessities.
