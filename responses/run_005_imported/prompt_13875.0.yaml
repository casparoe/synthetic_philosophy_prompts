answer: |-
  ## The One Thought That Matters: A Toast for [Bride] & [Groom]

  **(Clinks glass gently, warm smile)** Friends, family, philosophers, and everyone else who’s wisely decided to just enjoy the champagne... thank you all for being here to celebrate [Bride] and [Groom].

  As maid of honour, and as the resident "science-and-ideas" friend, I was given a very specific brief for this toast: "Make it smart." No pressure, right? Especially when your best friend wrote her dissertation defending Bernard Williams' internal reasons, and her fiancé spent their entire courtship countering with Kantian externalism! *(Playful glance at the couple, who likely laugh or roll their eyes)*. For those wondering, yes, this is how philosophers flirt.

  Now, for the non-philosophers – which is probably most of you, and honestly, good for you – let me try to translate this marital meta-debate into something we can *all* feel. Because at its heart, it’s about something profoundly human: **why we do what we do? What truly moves us?**

  [Groom], bless him, champions the idea that there are reasons *out there* in the universe, universal duties, a kind of moral north star – the "external" ought. It’s the idea that certain things are just *right*, regardless of how we feel in the moment. It’s noble. It’s the compass pointing towards fairness, justice, treating everyone equally. He’d argue we *should* act because it’s *the right thing to do*, period.

  [Bride], fiercely and brilliantly, argues from the other side – Williams' side. She says: **A reason only truly *counts* for a person if it connects, somehow, to what’s already inside them.** To their desires, their commitments, their deepest sense of who they are. A reason has to resonate within your own story, your own "motivational set." It’s not about ignoring morality; it’s about where the *pull* comes from. For her, a reason that doesn’t connect to your heart isn’t really *your* reason at all.

  Williams gave us a famous image to illustrate this. Picture a man whose wife is drowning. He jumps in to save her. Why? The Kantian might say, "Because it’s his duty," or worse, he might pause to check if saving *his wife* is somehow "permissible" compared to saving a stranger. Williams said that pause, that calculation? That’s **"one thought too many."** Why? Because the *fact* that she’s his wife *is* the reason! It’s immediate. It’s internal. It springs from the very core of his commitment and love. He doesn’t need an external rulebook; his love *is* the rule. Saving her isn't just "permissible"; it's the only conceivable action.

  *(Pause, look at the couple)*

  [Bride] and [Groom], your entire relationship has been this beautiful, ongoing dialogue – a love story woven through with this fundamental question. You’ve debated it over morning coffee, dissected it on long walks, probably even over dessert last night. [Groom] appeals to the universal, the principle. [Bride] roots it firmly in the personal, the particular, the beating heart of the matter.

  But here’s the magic, the thing that makes this more than just an academic footnote in your love story: **In choosing each other, you’ve transcended the debate.** You’ve shown that the deepest reasons – the ones that truly move mountains, or at least get you through IKEA on a Saturday – live exactly where Williams said they must: *inside*.

  [Groom], your love for [Bride] isn’t just because "one ought to love one's spouse." It’s because of *her* – her brilliant mind, her fierce loyalty, the way she [mention 1-2 specific, endearing non-academic traits, e.g., "laughs until she snorts," "remembers everyone's coffee order," "can kill a spider without flinching"]. She has become part of your motivational set, your deepest commitment. Saving her wouldn't require a permission slip from Kant; it would be your only thought.

  [Bride], your love for [Groom] isn’t just an internal project satisfying a desire. It’s because of *him* – his unwavering [mention 1-2 specific traits, e.g., "kindness," "ridiculous dad jokes," "ability to assemble anything, instructions be damned"]. He has become so deeply woven into the fabric of your being, your "subjective motivational set," that loving him, choosing him, marrying him – it feels less like a decision and more like the most natural expression of who you *are*.

  Your love proves both sides right in the best possible way. [Groom], your commitment *is* a universal principle *because* it’s grounded in this unique, irreplaceable person. [Bride], your love *is* the deepest internal reason *because* it connects to values that feel inherently right and true. You’ve built a life where the external "ought" and the internal "must" meet and embrace.

  So, today, we celebrate the beautiful resolution you’ve found. Not in winning an argument, but in building a life together. You’ve shown that when love is true, it banishes "one thought too many." You don't need to deliberate on whether this marriage is "permissible." You only need to know, deep in your bones, that it is *right*, and it is *yours*.

  **(Raise glass higher)** So, to [Bride] and [Groom]! May your life together be filled with endless fascinating debates, profound mutual respect, and above all, a love that requires *no further justification*. May you always be each other’s most compelling internal reason, and each other’s most cherished external commitment. Cheers!
