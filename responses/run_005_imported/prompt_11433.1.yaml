prompt: |-
  My dad got a scary diagnosis a few weeks back, and it's turned into this whole family argument about whether God already knowing what he'd choose means he wasn't actually free to choose otherwise. My uncle Ray (a philosophy professor, very pleased with himself about it) swears Molinism and 'middle knowledge' sorts all this out, and he's coming on my little podcast to walk through it. Problem is, whenever I push him on the grounding objection he just says it's 'only a problem if you're already committed to truthmaker theory' and glides past it, so I never get anywhere. Can you draft me around 8 interview questions that don't just let him restate the view? I want one that really presses the grounding objection (what actually makes a counterfactual about what someone would freely do true, before that person even exists and before God has decided to create anything), one on whether middle knowledge actually saves libertarian free will or just relocates the determinism worry to before I'm even born, and one on how 'feasible worlds' and transworld depravity are suppose to get God off the hook for evil without quietly limiting what an omnipotent being can do. For each of those three, add a follow-up keyed to whatever answer he's most likely to give, and end the list with one question on what would actually count as evidence against Molinism itself, not just another puzzle for him to manage away.
