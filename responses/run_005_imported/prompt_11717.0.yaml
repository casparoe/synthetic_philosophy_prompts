  Davidson ties belief and meaning together. The interpreter assigns meanings that make beliefs true in their context. But what if the interpreter's own conceptual scheme is different? The omniscient interpreter has a correct worldview, so when they interpret us charitably, they map our beliefs to truths in their scheme. But does that mean our beliefs are true in an absolute sense? Or just that they're aligned with the interpreter's correct beliefs?

