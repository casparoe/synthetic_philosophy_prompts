prompt: |-
  I just moved to Rochester for a new job and somehow got roped onto the programming committee for our library's Juneteenth event -- Douglass lived here and ran his paper out of this city so the town takes it pretty seriously. We've booked a historical interpreter who does the whole first-person thing and stays in character for a live audience Q&A afterward, and I got stuck drafting questions since apparently in past years it's been a lot of "what was it like growing up enslaved" type stuff, which is fine but feels like it undersells the guy.

  I've been reading up to prep and it turns out his views on the Constitution are way weirder and more interesting than I realized -- he spent his early Garrisonian years calling it a "covenant with death" right along with Garrison, then did a pretty dramatic about-face around 1851 and started arguing the opposite, that read properly its actually an anti-slavery document, which he laid out at length in that 1860 Glasgow speech. Could you draft me like 8-10 questions for the interpreter to field in character, set some time after that Glasgow speech? I'd want at least one question that pushes on whether the timing of his reversal (right as he's breaking with Garrison and getting into electoral politics) makes it look more convenient than principled, one on how his textual argument -- leaning hard on the fact that "slave" and "slavery" never actually appear in the document -- survives something like the Dred Scott ruling, and one that raises the obvious disunionist comeback, that Garrison's practical point about who actually controls enforcement stands no matter how the text reads on paper. For each one, if there's an obvious reply he'd give, tack on a quick follow-up so the answer doesn't just get to sit there unchallenged.
