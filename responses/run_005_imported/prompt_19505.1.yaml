prompt: |-
  I was an experimental physicist for almost forty years and only really started reading philosophy after I retired, and lately I've fallen down the rabbit hole of discounting the future -- turns out theres a genuine live fight over whether a positive rate of pure time preference can be defended on its own terms, seperate from all the growth-and-uncertainty stuff that usually gets bundled in with it. I run a little discussion group with some old colleagues over Zoom, and we've got an economist joining next month who's built a career defending a positive pure rate, pretty squarely on the Nordhaus side of the old Stern Review fight. Could you draft eight or nine interview questions that don't just let him restate the Ramsey equation at us? I want at least one that makes him answer to Ramsey's own famous jab that pure discounting is 'ethically indefensible' and just a failure of imagination, one that presses on whether what he's really defending is disguised extinction-risk discounting dressed up as pure time preference, and one built on the Parfit/Sidgwick point that mere distance in time, like distance in space, isn't by itself a reason to count someone for less. Add a sharp follow-up after each, keyed to whatever dodge he's most likely to reach for.
