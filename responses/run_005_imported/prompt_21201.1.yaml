  ## For Diane: A Life Beyond Blame

  [Standing at the podium, take a breath, look out at the gathering]

  Family, friends, colleagues, everyone who knew and loved Diane… thank you for being here to remember her. For thirty-one years, Diane stood in courtrooms as a public defender, a fierce advocate for people society often saw only through the lens of their worst moments. She saw the complexity, the humanity, the weight of circumstance pressing down on the lives of the people she represented. And that profound understanding didn't stay confined to the courthouse. It seeped into everything she was, especially in the last decades of her life, fueled by an idea that captivated her.

  Sometime in her late fifties, a friend handed her an essay by a philosopher named Galen Strawson. It contained what he called the Basic Argument. And Diane, with her brilliant, questioning mind, grabbed hold of it, turning it over and over, discussing it relentlessly – often right here at this library on Thursday nights – for the rest of her life. She’d explain it to me across countless dinners, and while I’m no philosopher, the heart of what she took from it is what matters today.

  It boiled down to this: For us to be *ultimately* responsible for our actions – to truly *deserve* the deepest credit or blame for them – we would need to be responsible for the kind of person we *are* when we act. Because who we are shapes what we do. But how could we be responsible for being *that* person? Only if we deliberately made ourselves that way. And yet, whatever led us to make *that* choice – the values, the temperament, the reasoning we used – that was already part of who we were *before* we made any conscious decision to shape ourselves. The root of responsibility, Diane believed, kept vanishing backward. It never finally landed on an act of pure, un-caused self-creation. As she liked to put it, adding randomness into the mix – just turning the last step from a domino into a coin flip – doesn't magically hand you the authorship of yourself. That initial self, the one starting the chain or flipping the coin, wasn't *earned* by you.

  **What did this mean for Diane?**

  It meant a profound letting go of the idea of *ultimate desert*. Not just for the people she defended – though that was central to her compassion – but for everyone. For herself, too. She didn’t believe anyone, deep down, ultimately *deserved* the credit for becoming remarkably good, or the blame for becoming tragically flawed. The raw materials, the early shaping, the luck and circumstance that forged the starting point – none of that was chosen. The person who emerged wasn't sculpted from pure, self-originating will.

  **But – and this is the crucial part Diane insisted on, the point she would stand up and correct if we got it wrong – this was *never* about fate or inevitability.** This wasn't about saying "she couldn't have done otherwise." That misses her point entirely, and she would have hated that simplification.

  Diane held both truths fiercely:
  1.  That we aren't the ultimate authors of ourselves, and thus ultimate moral credit or blame doesn't stick.
  2.  That we absolutely *can* do otherwise. We have choices. We can change. We can strive. We *must* strive.

  For her, rejecting the idea of *desert* wasn't a reason for apathy; it was a foundation for clear-eyed compassion and relentless effort. It meant looking at someone who had done wrong – or at herself facing a challenge – and understanding that while they didn't author the complex web of influences that led them there, they *could* still choose a different path *now*. They *could* be held accountable for their actions moving forward. They *could* work to become better. The absence of ultimate blame wasn't an excuse; it was an understanding that freed her to engage without condemnation, to demand better without the crushing weight of thinking someone *deserved* eternal punishment for being who circumstances helped shape them to be.

  **This wasn't just theory for Diane; it was the air she breathed.** It fueled her tireless advocacy. How could she not fight for someone when she understood the immense weight of unchosen circumstance bearing down on their choices? It shaped her profound humility. She was incredibly proud of her work, her family, the life she built – but she wouldn't claim she *earned* the core woman she became through sheer, unaided willpower. She saw the gifts, the support, the luck, alongside the hardships she navigated. She asked us specifically not to frame her journey as "overcoming" her past solely through force of will, because that implied a kind of self-creation she believed was a myth.

  Instead, she embraced the work. The work of becoming. The work of defending. The work of understanding. She ran her discussion group not to convince people they were powerless, but to explore this profound tension: that we are not our own first cause, yet we are absolutely, vitally responsible *for* ourselves and each other *in* the present. We can choose kindness. We can choose integrity. We can choose to fight for justice. We can choose to learn and grow. The fact that we didn't design the starting pistol doesn't mean the race isn't real, or that our effort doesn't matter intensely.

  Diane lived that race with courage, compassion, and an unwavering intellectual honesty. She defended the vulnerable not because they deserved it in some cosmic sense, but because it was right. She worked to be a better mother, friend, colleague, and citizen, not because she thought she *deserved* credit for the outcome, but because the effort itself was valuable, because the impact on others mattered. She loved us deeply, not because we earned it perfectly, but because love, like compassion and the pursuit of justice, was simply the right response to the shared human condition she understood so well.

  So today, we don’t say Diane *earned* the remarkable woman she was in some ultimate sense. We say she *was* remarkable. We don't say she *overcame* solely by force of will. We say she *persevered*, she *chose*, she *built* a life of profound meaning and impact, fully aware of the complex currents that carried her. We honor her fierce intellect, her deep compassion, her unwavering commitment to fairness, and her courageous embrace of a difficult truth that, for her, unlocked a deeper capacity for love and action.

  She showed us that letting go of ultimate blame doesn't diminish responsibility; it reframes it. It asks us to look at ourselves and each other with clearer eyes, to understand more, to condemn less, and to never, ever stop trying to do better – not because we'll earn a final gold star, but because the trying, the choosing, the caring itself is what makes a life like Diane’s truly extraordinary.

  Thank you, Mom. For the fierce love, the challenging ideas, and the example of a life lived with clear eyes and an open heart. We will miss you profoundly.

  ---
  **Notes on Delivery & Fit:**

  *   **Timing:** This clocks in around 7-8 minutes when spoken at a measured, heartfelt pace.
  *   **Tone:** Aim for warmth, respect, and clarity. Avoid sounding academic; focus on the human impact of her beliefs.
  *   **Key Distinction:** The core passage ("Diane held both truths fiercely...") explicitly separates the "no ultimate desert" idea from "couldn't have done otherwise," directly honoring her request.
  *   **Avoided Pitfalls:**
      *   No "earned the woman she became."
      *   No "overcame through sheer force of will."
      *   No suggestion of fatalism ("couldn't have done otherwise").
  *   **For the Philosophers:** Uses Strawson's name, captures the essence of the Basic Argument and the "domino/coin flip" analogy she used, emphasizes the compatibilist element (no determinism needed), and correctly frames the "no desert" vs. "can do otherwise" distinction.
  *   **For Family:** Explains the core idea in relatable terms, focuses on how it shaped her character, her work, her compassion, and her humility, and emphasizes her positive actions and love. Uses concrete examples (her defense work, her discussion group, her love for family).
  *   **Honors Her Life:** Connects the philosophy directly to her actions, values, and the impact she had. Focuses on her legacy of compassion, intellectual honesty, and effort.

  This eulogy strives to be true to Diane's complex and deeply held beliefs while celebrating the remarkable life she lived according to them.
