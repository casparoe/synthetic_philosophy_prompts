  - If she distinguishes choice types, demand criteria for "true" preferences
  - If dismissing pumps as unrealistic, construct a real-world equivalent

  The common-ratio question must expose how her model handles probability scaling without independence. I'll reference the 90% vs 99% certainty case that often violates rank-dependent predictions.

  Finally, the falsifiability question should trap her: if no evidence could refute the theory, it becomes unfalsifiable dogma. But requiring specific predictions risks being falsified by experiments showing consistent EU compliance.
answer: |-
  Here are ten tightly sequenced interview questions designed to progressively challenge the resolute choice defense of Allais preferences, with deflection counters for key points:

  1.  **Foundation:** "Your theory treats an agent's preference over the 'shape of risk' as rationally fundamental. Could you precisely define what constitutes the 'shape' of a gamble in your framework, and explain why it merits axiomatic status *distinct* from outcomes or probabilities?"
      *   *(Builds baseline for later challenges)*

  2.  **Rational Permissibility:** "You argue Allais preferences aren't mistakes but permissible expressions of rational aversion to probability 'disappointment' or tail risk. What specific *normative principle* within your framework *obligates* or *strongly justifies* an agent prioritizing this 'shape' over stochastic dominance or avoiding sure money-pumps?"
      *   *(Forces articulation of a positive rationality norm beyond 'EU is wrong')*

  3.  **Common-Consequence Specifics:** "Walk us through how your model *formally represents* and *rationalizes* the specific preference pair in the original Allais common-consequence paradox: preferring 1A (Certain $1M) over 1B (10% $5M, 89% $1M, 1% $0), but then preferring 2B (10% $5M, 90% $0) over 2A (11% $1M, 89% $0). What parameters or functional forms capture this switch?"
      *   *(Pins down the common-consequence mechanism)*

  4.  **Common-Ratio Crucible:** "Now, apply that same framework to the common-*ratio* paradox: Preferring 3A (Certain $3000) over 3B (80% $4000, 20% $0), but then preferring 4B (20% $4000, 80% $0) over 4A (25% $3000, 75% $0). How does your model generate *this* reversal without simply re-labeling probability weighting? Doesn't this reliance on non-linear probability distortion functionally *recreate* the rank-dependence you aim to surpass?"
      *   *(Critical demand: Must handle common-ratio, not just common-consequence. Targets whether it's genuinely novel or just RDU/CPT in disguise)*

  5.  **Resolute Choice Introduction:** "You invoke 'resolute choice' – committing to a plan – to deflect money-pump arguments. Is resoluteness a *descriptive claim* about how some people *actually* decide sequentially, or a *prescriptive norm* that agents *should* follow to be rational within your framework?"
      *   *(Clarifies status of resoluteness: strategy or obligation?)*

  6.  **The Sophistication Trap:** "Consider an agent with Allais preferences facing a series of trades starting from 1A (Certain $1M). A 'naive' agent re-evaluating at each node gets pumped. A 'sophisticated' agent, foreseeing this, avoids the initial trade, sticking with 1A. Doesn't this sophistication *itself* reveal that the agent recognizes a *dynamic inconsistency* in their *static* preferences? Isn't foresight forcing them to act *against* their genuine static preference for 1A over 1B to avoid exploitation?"
      *   *(Targets sophistication: Shows foresight exposes inconsistency)*
      *   **Likely Deflection:** Claim sophistication isn't relevant or that sticking with 1A *is* consistent.
      *   **Sharper Follow-Up:** "If sophistication leads them to reject a trade *into* 1B precisely *because* they know they'd later trade *out* of it for something worse, doesn't this prove their static preference for 1A over 1B is *dynamically untenable*? Isn't the sophisticated choice *evidence against* the rationality of the static preference?"

  7.  **Resolute Choice Under Pressure:** "Imagine the resolute agent commits *in advance* to a plan involving 1B in a sequence. When they reach the node offering a trade *away* from 1B (which now has 89% chance of $1M, 10% $5M, 1% $0) to a *certain* $1M, why is it rational *at that node* to stick to the plan and reject certainty? Doesn't your framework now demand they ignore a *strictly dominating* local option (certain $1M vs. a gamble with a positive chance of $0) solely to satisfy a past commitment? What principle justifies ignoring local dominance for global 'shape'?"
      *   *(Challenges rationality of ignoring local dominance)*
      *   **Likely Deflection:** Argue the *global* plan value justifies overriding local dominance; the "shape" preference is primary.
      *   **Sharper Follow-Up:** "Doesn't this imply your framework *requires* agents to sometimes violate *statewise dominance* (rejecting a payoff that is higher in *every* future state at a decision node) to remain 'resolute'? How is this not a fundamental cost of abandoning independence?"

  8.  **The Hidden Axiom:** "Resolute choice seems to function as a *meta-constraint* ensuring dynamic consistency. Isn't this appeal to resoluteness *itself* smuggling in a requirement for *dynamic consistency* – precisely the axiom your static theory claims to do without? How is your framework truly 'non-EU' in its dynamic implications if it *needs* resoluteness to avoid incoherence?"
      *   *(Core challenge: Resoluteness as a hidden dynamic consistency axiom)*
      *   **Likely Deflection:** Deny it's an axiom, framing it as a rational planning strategy compatible with the static theory.
      *   **Sharper Follow-Up:** "If dynamic consistency isn't required, why is *failure* to be resolute (leading to money-pumping) deemed irrational within your view? Doesn't the *need* to prescribe resoluteness to avoid pumping prove that your static preferences *lack* dynamic coherence without an *additional* constraint?"

  9.  **Cost of Commitment:** "Beyond artificial money pumps, what are the *real-world costs* of being resolute? Couldn't resoluteness force an agent to ignore valuable new information (e.g., updated probabilities, new options) emerging during a sequential decision process, simply to adhere to a pre-commitment based on the initial 'shape' preference? How do you weigh this potential cost against the benefit of avoiding money pumps?"
      *   *(Highlights a practical downside of the proposed solution)*

  10. **Falsifiability:** "Finally, what empirical finding or formal result *would* constitute evidence against your claim that Allais preferences (rationalized by your model + resoluteness) are genuinely rational? For instance, if experiments showed agents exhibiting Allais patterns *and* reliably falling for money pumps *even when* resoluteness was strongly incentivized or explained, would that challenge your view? Or if a model respecting independence could demonstrably better predict *both* static Allais choices *and* sophisticated/resolute dynamic behavior?"
      *   *(Demands criteria for potential refutation, testing the theory's scientific status)*

  **Key Sequencing Logic:**
  1.  Establishes the positive view (Q1-2).
  2.  Tests its core application to both Allais patterns (Q3-4).
  3.  Introduces the resolute defense against money-pumps (Q5).
  4.  Undermines sophistication as an alternative (Q6).
  5.  Directly pressures the rationality of resolute choices at nodes (Q7).
  6.  Argues resoluteness *is* the smuggled consistency axiom (Q8 - Core Challenge).
  7.  Highlights practical costs (Q9).
  8.  Demands falsifiability (Q10).

  This sequence forces progressively deeper engagement with the tension between the static "shape" preference and dynamic choice, culminating in the argument that resoluteness is a tacit admission of the need for dynamic consistency (Q8). The common-ratio (Q4) and deflection counters (Q6, Q7, Q8) specifically target vulnerabilities in the position.
