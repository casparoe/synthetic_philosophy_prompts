  The user's key requests are: sequencing questions to progressively undermine the resolute-choice defense; covering common-ratio effects; exposing hidden rationality constraints; and demanding falsifiability. I note three critical pressure points: resolute choice may smuggle in dynamic consistency, common-ratio preferences strain probability-weighting models, and money-pumps reveal practical vulnerabilities.

  For structure, I consider building from theory fundamentals to empirical implications:
