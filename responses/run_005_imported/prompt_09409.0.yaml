  2. Testing consistency across common-consequence vs common-ratio patterns
  3. Probing resolute choice as an ad hoc solution to dynamic inconsistency
  4. Forcing confrontation with money-pump scenarios
  5. Ending with falsifiability demands

  For deflection counters, I prepare for her likely moves:
