answer: |-
  Here is a eulogy that honors your brother's heroism while weaving in the profound philosophical tension that drove him, aiming for honesty without abstraction or preaching:

  ---

  **For [Brother's Name]**

  Two weeks ago, a little girl is alive today because of my brother. And we are here, shattered, because he is not. He saw her in the river near Mom and Dad's, he went in without hesitation, he got her to the bank, and then the current, relentless and indifferent, took him back before help could reach him. That act, in its terrifying clarity and finality, defines the moment of his passing. He was, undeniably, a hero in that instant. To the firefighters here, his rowing crew brothers, to everyone who understands the courage it takes to run *towards* danger, to dive into the cold unknown – we see that heroism. We honor it. We are devastated by its cost.

  But [Brother's Name] wasn't *just* that moment. He was a man who wrestled deeply with what it *means* to see suffering and to act. Many of you here knew that side of him too. He carried with him, ever since college, the weight of a philosopher’s question: Peter Singer’s pond. The idea that if a child is drowning right in front of you, you *must* wade in, ruin your clothes, save them. And the devastating, inescapable corollary: that if we accept that obligation for the child we see, then we are failing children we *don’t* see, suffering just as terribly, just far away.

  That idea didn't just interest [Brother's Name]; it haunted him. It ate at him. He argued it passionately, turned it over endlessly in his mind and in conversations with his philosophy friends gathered here. He grappled with the uncomfortable truth it exposed – the gap between what we *could* do and what we *actually* do. He felt that gap acutely. He struggled to find peace with a world, and perhaps with his own place in it, where such suffering persisted while we lived our comfortable lives. He wasn't satisfied with easy answers or simple hero narratives. He sought a deeper, more demanding kind of integrity.

  And that’s why his act by the river wasn't *just* instinct, though courage was surely part of it. It wasn't *just* the reflexes of a strong rower used to water, though that strength served him. It was, I believe, the lived resolution of the very tension that tormented him. He saw suffering – immediate, undeniable, right in front of him. A child in the water. And in that moment, the abstract debate collapsed into pure, undeniable necessity. There was no distance, no abstraction. There was only the child, the water, and the imperative to act. He didn’t hesitate. He waded in.

  He lived the answer to the question that haunted him. He paid the ultimate price the hypothetical demanded. He proved, with devastating finality, that for him, the obligation was not abstract. When the suffering was undeniable and immediate, he *acted*. He saved the child he could see.

  To only call him a hero flattens him. It ignores the deep, complex current of thought and conscience that propelled him into that water. He wasn't just reacting; he was fulfilling a principle he had agonized over for years. He resolved his philosophical struggle not with words in a seminar room, but with an act of supreme sacrifice on a riverbank.

  And to only dwell on the philosophy risks turning his profound, personal sacrifice into an academic footnote. It risks dishonoring the raw courage, the physical bravery, the pure, selfless love evident in his final act. It risks ignoring the grief of those who simply knew a loyal friend, a dedicated teammate, a beloved son and brother.

  So today, we hold both truths. We mourn a man of immense, demonstrated courage. We also mourn a man of profound conscience, who felt the weight of the world's suffering deeply and personally. We honor the hero who saved a life. We also honor the thinker who wrestled with the hardest questions about responsibility and action, and who, when faced with the ultimate test of his own convictions, met it with absolute, unwavering commitment.

  He didn't find peace with the pond in his lifetime; it troubled him to the end. But on that riverbank, he showed us what living that question truly meant *for him*. He saw the child. He waded in. He didn't fail her.

  His courage was real. His struggle was real. His sacrifice was real. We miss the complexity of him, the arguments, the intensity, the laughter, the quiet moments of doubt, and the fierce, undeniable love that ultimately defined his action. May we remember him wholly: the thinker, the rower, the friend, the brother, the son, and the man who, when faced with the undeniable cry for help right before him, answered with everything he had.

  We love you, [Brother's Name]. Rest now. Your struggle is over. Your act remains.

  ---

  **Why this works:**

  1.  **Acknowledges the Heroism First:** It leads with the undeniable act of bravery, validating the perspective of the firefighters, rowers, and those who see that pure courage.
  2.  **Introduces the Philosophy Naturally:** It frames Singer's pond not as an academic lecture, but as a deeply personal burden *he* carried, a core part of *his* character and struggle. "Haunted," "ate at him," "struggled" make it personal, not theoretical.
  3.  **Connects Philosophy to Action Explicitly:** The key paragraph: "*That’s why his act... wasn't just instinct... It was, I believe, the lived resolution...*" This directly links his internal struggle to his final act, showing it was the culmination of his wrestling.
  4.  **Rejects Oversimplification:** It explicitly states why both the *only hero* and *only philosopher* narratives are insufficient: "To only call him a hero flattens him... To only dwell on the philosophy risks..." This validates your concern directly.
  5.  **Holds the Tension:** "So today, we hold both truths." This is the core message. It allows both perspectives in the room to feel seen and understood.
  6.  **Focuses on *Him*:** The philosophy is always framed as *his* struggle, *his* burden, *his* unresolved tension. It's about *who he was*, not about preaching an ethical stance to the audience.
  7.  **Honors the Sacrifice & Grief:** It constantly returns to the human cost, the loss, the love, ensuring the eulogy remains grounded in emotion and remembrance, not abstraction.
  8.  **Uses Accessible Language:** Avoids jargon. Concepts are explained simply ("the gap between what we could do and what we actually do").
  9.  **Strong, Poignant Closing:** Ties his rest to the end of his struggle, acknowledges his love, and reiterates the permanence of his act. "Your struggle is over. Your act remains."

  **Tips for Delivery:**

  *   **Pace Yourself:** This is emotionally heavy. Pause, especially after difficult lines or when mentioning his struggle. Breathe.
  *   **Make Eye Contact:** Connect with different parts of the room – the firefighters, the rowers, the philosophy group, family.
  *   **Emphasize Key Lines:** "He lived the answer...", "We hold both truths.", "He saw the child. He waded in. He didn't fail her."
  *   **It's Okay to Show Emotion:** Your grief is real and shared. If your voice breaks, let it. It honors the depth of your loss and love.

  This eulogy respects the complexity of your brother, honors his sacrifice, acknowledges his profound internal conflict, and speaks truthfully to everyone gathered. It refuses to dodge the difficult reality of *why* he might not have hesitated, while never losing sight of the love and loss at the heart of the day. Wishing you strength for Saturday.
