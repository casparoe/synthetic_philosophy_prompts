  Okay, the user is a TA for an intro course on social choice theory, specifically the discursive dilemma or doctrinal paradox. They've been trying to explain this concept at parties but only get blank stares. Now they want a joke that captures the essence of the paradox—premise-based vs. conclusion-based voting—without being a generic "committees are dumb" joke. The punchline needs to hinge on the actual mechanics of the dilemma, making it funnier for those who understand it.

