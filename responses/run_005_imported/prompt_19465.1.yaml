  - **Weakness**: Folk theorem phrasing is *mostly* right but misses nuance. Payoffs must be *strictly greater* than minmax *and* individually rational/feasible. "At least as good" could include minmax payoffs, which aren't always sustainable.

  **Part (b) (10/10)**  
