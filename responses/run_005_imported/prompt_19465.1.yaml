       (a) X cooperates with PrudentBot, *and*  
       (b) X defects with DefectBot.  
       The answer omits (a) and implies (b) alone suffices.  
  - **Omitted nuance**: PrudentBot avoids exploitation but may fail to cooperate with cooperative agents that aren’t proof-based (e.g., a CliqueBot variant).

