answer: |-
  Based solely on Aquinas's commitments in the *Summa Theologiae* regarding natural law, the common good, and interpretive authority, he would **side more with the purposivists**, though with crucial qualifications that differentiate his position from a modern, unconstrained purposivism. Here's the defense, addressing the key evidence and the strongest textual counterargument:

  1.  **The Primacy of Lawgiver's Intention and Purpose:** Aquinas explicitly states in I-II, q.96, a.6 that a law "binds in conscience... according to the intention of the lawgiver" and *not* merely according to its "bare words." His besieged city example is decisive: obeying the literal text ("keep gates shut") would defeat the law's purpose (safety/defense) in that specific circumstance. The purpose, rooted in the *reason* for the law (defending the common good), takes precedence over the literal text when adhering to the text would produce an absurd or unjust result contrary to that very purpose. This aligns directly with the core purposivist tenet.

  2.  **Law as Reason Ordained to the Common Good:** Aquinas defines law fundamentally as "an ordinance of reason for the common good" (I-II, q.90, a.4). The text is the *expression* of this rational ordinance. Therefore, interpreting law necessarily involves discerning the underlying *reason* (purpose) aimed at the common good. A purely textualist approach, divorced from this teleological grounding in reason and the common good, risks applying the law in a way that violates its very essence as Aquinas defines it. Purposivism better accommodates this essential characteristic of law.

  3.  **The Role of Epikeia (Equity):** Aquinas elevates *epikeia* (II-II, q.120) as a *virtue* precisely for situations where the "letter of the law" would lead to injustice by failing to achieve the lawgiver's just intent in unforeseen circumstances. *Epikeia* is the correction of the law where it is defective due to its universality. This concept is inherently anti-textualist; it justifies *not* applying the literal text *because* of the purpose. While Aquinas restricts its application (see counterargument below), its existence as a virtue demonstrates his commitment to purpose over bare words as a normative principle.

  **Addressing the Strongest Textual Counterargument (The Restriction on Private Judgment):**

  The most compelling textual evidence for a textualist reading comes from Aquinas's insistence elsewhere (e.g., I-II, q. 90, a. 1 ad 2; q. 96, a. 6 ad 3; context of q. 96 discussions) that **private individuals cannot simply override the letter of the law based on their *own* judgment of purpose or common good, except in cases of "manifest and urgent necessity" (like the besieged city).** Interpreting the law in less clear cases belongs properly to public authorities (princes, judges, lawmakers).

  *   **Why this does *not* make Aquinas a Textualist:**
      1.  **It Addresses *Who* Interprets, Not *How*:** This restriction concerns the *authority* to interpret and apply equitable correction, not the *method* of interpretation itself. Aquinas is clear that *when public authorities interpret*, they must do so according to the lawgiver's intention and the common good. He is safeguarding against anarchy and ensuring interpretive authority rests with those responsible for the common good, not endorsing textualism as the *method* for those authorities.
      2.  **The Besieged City as the Paradigm:** The besieged city example *is* the model case Aquinas uses to illustrate the principle that purpose trumps text. The restriction on private judgment simply means that *less extreme* divergences between text and purpose must be resolved by authorities, not individuals. It doesn't negate the principle that authorities *should* resolve them by looking to purpose.
      3.  **Authoritative Interpretation is Purposive:** Aquinas states that interpreting law belongs to "the one by whom the law is made; and to him it belongs to explain it" (I-II, q. 90, a. 1 ad 2). Crucially, the reason lawmakers have authority to interpret is because they best understand the *purpose* and *intention* behind the law they made. Their interpretive task is inherently purposive. Textualism, as a method denying recourse to purpose when text is "clear," would undermine this rationale for their interpretive authority.
      4.  **Natural Law Framework:** Aquinas's entire legal theory rests on natural law. Human positive law derives its legitimacy from its conformity to natural law and reason (ordained to the common good). A purely textualist approach risks severing the application of human law from this foundational connection to higher law and reason. Purposivism, by seeking the underlying rational purpose, is more consistent with maintaining this connection.

  **Conclusion:**

  While Aquinas imposes strict limits on *who* (private individuals vs. public authorities) can set aside the letter of the law based on purpose, his fundamental commitments point decisively towards purposivism as the correct *method* for understanding and applying law:

  *   He explicitly prioritizes the lawgiver's intention over the bare text (I-II, q.96, a.6).
  *   He defines law as an ordinance of *reason* for the *common good*, making purpose central.
  *   He champions *epikeia* as a virtue correcting the literal text to serve justice and the law's true intent.

  The restriction on private judgment is not an endorsement of textualism; it is a prudential safeguard for legal order, specifying *who* holds the authority to perform the inherently purposive task of interpretation and equitable application. For Aquinas, public authorities are *obligated* to interpret the law according to its rational purpose and the common good, not merely apply its text mechanically. Therefore, working from his actual commitments, Aquinas would side more with the purposivists, albeit within a framework emphasizing the proper *authority* for interpretation and the foundational role of natural law and the common good. The counter-texts about authority reinforce the structure within which purposive interpretation operates, not the textualist method itself.
