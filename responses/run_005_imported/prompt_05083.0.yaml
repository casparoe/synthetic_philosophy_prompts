   The plain belief norm fails almost everything.

   Now, I think the ranking should be:

   1. Knowledge norm: It handles the lottery and Gettier cases well, and the expert witness case might be handled by arguing that the expert does have knowledge (if we assume the lab is reliable, which is usually the case). The selfless assertion is the main problem, but it is only one case. And we might bite the bullet and say that the teacher is violating the norm, but that her assertion is still permissible in some other way (e.g., because she is acting as a conduit for the scientific community). Or we might adjust the norm to account for such cases.

