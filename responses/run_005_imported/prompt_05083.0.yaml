     (iii) bad (if we think the Gettier assertion is improper, the norm says it's okay because the speaker believes)
     (iv) good

   Now, we must rank them. We want the norm that handles the most cases without biting bullets.

   - Knowledge norm: 
     Pros: Handles (i) and (iii) well.
     Cons: Fails (ii) and possibly (iv).

   - Truth norm:
     Pros: Handles (ii) and (iv) well.
     Cons: Fails (i) and (iii).

   - Justified belief norm:
     Pros: Handles (ii) and (iv) well.
