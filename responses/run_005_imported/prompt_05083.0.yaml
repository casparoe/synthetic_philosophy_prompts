  We are given four norms and four test cases. The goal is to rank the norms from best to worst in terms of how well they handle the cases without having to bite too many bullets.

   Let's recall the cases:

   (i) Lottery case: You have a lottery ticket (1 in 10 million chance to win). You assert "My ticket lost" before the drawing. The ticket does lose, and you have a justified true belief (JTB) but not knowledge (because it's based on probability, not on seeing the result). Intuition: We shouldn't assert.

   (ii) Lackey's selfless assertion: A creationist teacher, who doesn't believe in evolution, teaches it correctly and well. She asserts evolution facts to her students. She has justification (from the scientific community) and the claims are true, but she doesn't believe them. Intuition: Her assertion is appropriate.

   (iii) Gettier case: A justified true belief that isn't knowledge (due to luck). The speaker asserts and has no idea anything is off. Intuition: The assertion seems inappropriate? Or at least, we might think the speaker doesn't know, so if knowledge is required, it fails.

   (iv) Expert witness: Asserts "the DNA matches the defendant" based solely on a one-in-a-billion random-match statistic. There is no further individualized evidence. The match is indeed correct. But is this knowledge? The intuition might be that the assertion is too strong because the statistic alone doesn't rule out lab error or contamination? Or perhaps it is acceptable? The case is set up to challenge the knowledge norm because the expert might not have knowledge (if we think that the statistic alone, without considering possible errors in the process, doesn't yield knowledge) but the assertion is made.

   Now, let's see how each norm handles each case:

   1. Knowledge norm: Assert p only if you know p.

     (i) Lottery: You don't know (because it's probabilistic) -> norm says you shouldn't assert. This matches intuition -> good.

     (ii) Selfless assertion: The teacher doesn't believe, so she doesn't know (since knowledge requires belief). The norm says she shouldn't assert. But intuition says the assertion is appropriate -> problem.

     (iii) Gettier case: The speaker doesn't know (by definition of Gettier) -> norm says shouldn't assert. Intuition might be that the assertion is inappropriate -> good.

     (iv) Expert witness: The expert has a true belief and justification (the statistic) but if we think that the statistic alone doesn't yield knowledge (because of the possibility of error in the lab, etc.), then the norm would say the assertion is inappropriate. However, in court, such testimony is common and often considered appropriate. But note: the case specifies "no further individualized evidence", so it's just the statistic. This might be a case where we are unsure. Some might think the expert does know (if we think the statistic is enough) and some might not. But the problem says the expert asserts based "purely" on the statistic. So if we think that the expert doesn't have knowledge (because of the possibility of error), then the knowledge norm would say the assertion is improper, but in practice it might be accepted. This is a potential bullet to bite.

   2. Truth norm: Assert p only if p is true.

     (i) Lottery: p is true (ticket lost) -> norm says it's okay to assert. But intuition says it's not okay -> problem.

     (ii) Selfless assertion: p is true (evolution is true) -> norm says okay. Intuition says okay -> good.

     (iii) Gettier case: p is true -> norm says okay. But the assertion might be inappropriate because the speaker doesn't know? So this might be a problem.

     (iv) Expert witness: p is true (the DNA matches) -> norm says okay. This matches the intuition that the assertion is acceptable? But note: the norm doesn't require justification, so even if the expert had no evidence, as long as it's true, it would be okay. That might be too permissive? But in this case, the expert has evidence (the statistic). So this case is okay for the truth norm.

   3. Justified/reasonable belief norm: Assert p only if you are justified in believing p (doesn't require that you actually know it, or that it's true).

     (i) Lottery: You are justified in believing p -> norm says it's okay to assert. But intuition says it's not -> problem.

     (ii) Selfless assertion: The teacher is justified in believing p (because of the evidence) even though she doesn't believe it. So the norm says it's okay to assert. Intuition says okay -> good.

     (iii) Gettier case: The speaker is justified -> norm says okay. But the assertion might be inappropriate because of the luck? So this might be a problem.

     (iv) Expert witness: The expert is justified (by the statistic) -> norm says okay. This matches the intuition? But note: the problem might be that the expert doesn't have knowledge, but the norm doesn't require knowledge. So it's okay.

   4. Plain belief norm: Assert p only if you believe p.

     (i) Lottery: You believe p -> norm says okay. But intuition says not okay -> problem.

     (ii) Selfless assertion: The teacher doesn't believe p -> norm says not okay. But intuition says it is okay -> problem.

     (iii) Gettier case: The speaker believes p -> norm says okay. But again, the assertion might be inappropriate -> problem.

     (iv) Expert witness: The expert believes p (we assume) -> norm says okay. This matches.

   Now, let's tally the problems:

   Knowledge norm:
     (i) good
     (ii) bad (must say the assertion is improper, but intuition says proper)
     (iii) good (if we think the assertion is improper without knowledge)
     (iv) potentially bad (if we think the assertion is proper but the expert doesn't have knowledge) OR good (if we think the expert does have knowledge). But the case is set up to challenge: the expert has only the statistic and no further evidence. In epistemology, we might think that the expert has knowledge if the statistic is very high and the lab is reliable, but the problem doesn't specify lab reliability. So it's ambiguous. However, the case is presented as a challenge, so we might count it as a problem.

   Truth norm:
     (i) bad (says it's okay to assert, but we think it's not)
     (ii) good
     (iii) bad (if we think the Gettier assertion is improper, the truth norm says it's okay)
     (iv) good (if the DNA does match, then it's okay)

   Justified belief norm:
