prompt: |-
  Okay so I'm a few years into an epistemology PhD, and I'm TAing a seminar on speech acts this term. This week's session on norms of assertion turned into a two-hour argument that never actually got resolved (as these things tend to do around here). Everyone agreed Williamson's knowledge norm is elegant, but the second people started throwing test cases at each other nobody could agree on which norm actually survives contact with all of them, so now I want an outside "referee" opinion since I suspect we're all just secretly weighting the cases differently and talking past one another.

  Here's the setup. Consider four candidate norms of assertion: (1) the knowledge norm ("assert p only if you know p"), (2) the truth norm ("assert p only if p is true, full stop"), (3) the justified/reasonable belief norm ("assert p only if you're justified in believing p, whether or not you actually know it"), and (4) the plain belief norm ("assert p only if you believe p"). Now weigh them against these four cases, which is basically what blew up our seminar: (i) the standard lottery case, where you truly and justifiedly believe your ticket is loosing out of 10 million tickets, it does lose, but almost everyone balks at asserting "my ticket lost" before the drawing is announced; (ii) a Lackey-style selfless assertion, where a devout creationist biology teacher sincerely and competently asserts well-evidenced claims about evolution to her class despite not believing a word of it; (iii) a garden-variety Gettier case, where the belief is justified and true but intuitively falls short of knowledge for luck-related reasons, and the speaker has no idea anything's off; and (iv) an expert witness who asserts in court that "the DNA matches the defendant," based purely on a one-in-a-billion random-match statistic with no further individualized evidence.

  Can you rank the four norms from most to least defensible overall — i.e., whichever one handles this whole set of cases while biting the fewest genuinely awkward bullets — and give it to me as JSON like:
  ```json
  {
    "1_best": {"norm": "...", "why": "..."},
    "2": {"norm": "...", "why": "..."},
    "3": {"norm": "...", "why": "..."},
    "4_worst": {"norm": "...", "why": "..."}
  }
  ```
  Keep the "why" fields to a sentence each, I don't need a lit review, just your honest ranking so I can go back to my seminar and tell them which of us was closest to right.
