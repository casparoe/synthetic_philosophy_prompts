   - Plain belief norm:
     Pros: Only handles (iv) well? (and maybe (iii) if we don't mind the Gettier case, but we do) -> actually, it fails (i), (ii), and (iii) by the intuitions given.

   So the plain belief norm does the worst.

   Now, between knowledge, truth, and justified belief:

   The knowledge norm fails the selfless assertion case (ii) which is a big problem. It also might fail the expert witness case (iv) if we think the expert doesn't have knowledge.

   The truth norm fails the lottery and Gettier cases.

   The justified belief norm fails the lottery and Gettier cases.

   But note: the lottery case is a classic counterexample to the justified belief norm. However, the knowledge norm handles it perfectly.

   The selfless assertion case is a classic counterexample to the knowledge norm (and also the belief norm) but not to the truth or justified belief norms.

   The Gettier case is a problem for the truth and justified belief norms (because they would allow the assertion) but the knowledge norm forbids it (which matches the intuition that the speaker doesn't really know and hence shouldn't assert?).

   The expert witness case (iv) is tricky. In the knowledge norm, if we think the expert doesn't have knowledge (because the statistic alone doesn't account for possible errors in the lab), then the norm would say the assertion is improper. But in practice, we might accept such assertions. However, note that in court, the expert might be required to have knowledge? Or at least, the testimony is presented as knowledge. But the case is set up to challenge: the expert has only the statistic and no further individualized evidence. This might be a case where the knowledge norm is too strict? But the other norms (truth and justified belief) would allow it because the claim is true and the expert is justified.

   However, let's think about the lottery case again: the truth norm and justified belief norm both fail the lottery case. The lottery case is a very strong intuition: we shouldn't assert that we lost even if we have a very high probability and even if we are justified and it turns out true. The knowledge norm captures that.

   The selfless assertion case is also strong: we want to allow the teacher to assert even without belief. The knowledge norm fails that, but the justified belief norm passes (because it only requires justification, not belief).

   The Gettier case: The knowledge norm says the speaker shouldn't assert because they don't know. But is that the intuition? In a Gettier case, the speaker is justified and the belief is true, but by luck. We might feel that the speaker is blameless in asserting, but the assertion is still not knowledge. However, the norm of assertion might be about knowledge, so we might want to say the assertion is improper. But note: in the Gettier case, the speaker has no idea that they are in a Gettier situation. So if they assert, they are being responsible (they have justification) and the statement is true. So we might not want to blame them. This is a point of controversy.

   However, the seminar might have discussed that in Gettier cases, we often think that the subject doesn't know, and if we accept the knowledge norm, then the subject shouldn't assert. But we might feel that the subject is not at fault because they are justified. This is a potential bullet for the knowledge norm: it might make the speaker blameworthy even though they did everything right? But the knowledge norm doesn't say anything about blame; it only says that the assertion violates the norm. And we might think that the norm violation is blameless because the speaker couldn't have known.

   Alternatively, we might think that the assertion is proper because the speaker is justified. Then the knowledge norm would be too strict.

   Given the cases, I think the knowledge norm is the most defensible overall because it handles the lottery case and the Gettier case (if we think that assertions require knowledge) and the expert witness case (if we think that the expert does have knowledge in that case, or if we are willing to bite the bullet if they don't). The selfless assertion case is a known counterexample that has led some to propose hybrid norms or to argue that the teacher does know (but that seems implausible because she doesn't believe). 

   However, note that some defenders of the knowledge norm have responded to the selfless assertion case by arguing that the teacher is not making a genuine assertion because she doesn't believe what she says. Or that she is acting in a professional capacity and so the norm is different. But that might be a bullet to bite.

   The justified belief norm handles the selfless assertion and the expert witness well, but fails the lottery and Gettier.

