answer: |-
  Here’s a 4-5 minute toast that honors your judge’s textualist principles while connecting with both audiences—using observable facts, avoiding speculative "purpose," and weaving in one solid legal joke without losing the family. The structure mirrors textualism: start with the text (her actions), avoid legislative history (speculation), and let the audience draw their own conclusions about meaning.

  ---

  **(Raise glass, smile at the Judge)**  
  "Judge [Last Name], for almost thirty years on the bench, you’ve had a simple rule for anyone arguing before you: *Show your work.* Well, tonight, I’ll try my best. Because if there’s one thing I learned clerking for you, it’s that unsubstantiated assertions get you… *(glance at Judge playfully)* …a very long walk back to your office to find the citation.  

  **For the lawyers and clerks here**, you know her legacy: hundreds of opinions, scrupulously dissecting statutes word by word, precedent by precedent. She didn’t just *read* the law—she interrogated it. I once watched her debate a comma placement for 20 minutes with a baffled court reporter. *(Pause for lawyer laughs)*. **For the family**, let me translate: Grandma built things with words. Meticulously, deliberately. Like a master craftsperson assembling a watch. If the instructions said ‘assemble Part A to Part B,’ she wouldn’t glance at the box art and guess. She’d follow the text. Exactly. Relentlessly. Even when—*especially* when—everyone else was squinting at the box art.  

  Which brings me to my one lawyer joke. *(Lean in conspiratorially)*  
  *"You know you’ve clerked for a textualist judge when… you suggest a ruling ‘makes sense’ based on ‘Congress’s obvious goal,’ and she hands you a dictionary open to the word ‘obvious’ with a Post-it that says: ‘Cite. The. Statute.’"*  
  *(Let the legal tables laugh. Turn warmly to the family)*  
  **For the non-lawyers**, that’s like Grandma reading a recipe that says ‘bake at 350° for 30 minutes,’ and you say, ‘But obviously, it *means* 400° for 20 minutes because we’re hungry!’ And she just… points at the recipe. *(Smile)*. We learned precision matters.  

  **And the text of her career?** Let’s look at the record:  
  *Exhibit A:* The work. Pre-dawn briefs reviewed, midnight oil burned. Opinions so carefully constructed you could balance a gavel on every sentence.  
  *Exhibit B:* The people. Dozens of clerks—terrified, inspired, and ultimately sharper thinkers because she demanded we show *why*, not *wish*.  
  *Exhibit C:* The family. Who saw her come home, maybe a little later than hoped, but never wavering on what mattered: being present, being truthful, being exactly who she said she’d be.  

  **She never asked us to guess her purpose.** She showed us. In the opinions she wrote. The colleagues she respected. The principles she never traded for convenience. The way she’d light up talking about [Grandkid’s Name]’s soccer game after a day parsing habeas corpus petitions.  

  **So tonight, we don’t need to speculate about ‘the spirit’ of her career.** The letter of it is right here:  
  A life of integrity.  
  A mind that valued clarity over comfort.  
  A heart—*(glance at family, then back to Judge)*—that showed up, fully, in every room she entered.  

  **Judge, you taught us that the best way to respect a text—whether it’s a statute or a life—is to engage with it honestly, on its own terms.** No embellishments. No creative interpretations. Just profound respect for what’s actually there.  

  **So let’s raise a glass** to the text of your remarkable career:  
  To the words you wrote.  
  To the cases you decided.  
  To the family you cherished.  
  And to the unwavering example you set—by doing the work, exactly as you said you would.  

  **To Judge [Last Name]!**  

  ---

  ### Why This Works
  1.  **Textualist-Compliant:** Only references *observable actions* (writing opinions, demanding citations, working late, showing up for family). No speculation about "inner purpose" or "true meaning."
  2.  **The Joke:** Lands for lawyers (the "obvious goal" gag is a classic textualist punchline) but is immediately decoded for family using the relatable "recipe" analogy.
  3.  **Family Connection:** Uses simple metaphors (craftsperson, recipe, building with words), focuses on her presence at home ("Grandma," "soccer game"), and highlights universal values (integrity, showing up, honesty).
  4.  **Honors Her Philosophy:** The *structure* of the toast mirrors textualism: starts with the "text" (her actions), avoids "legislative history" (speculation about motives), and concludes by letting the facts speak for themselves. The line "*She never asked us to guess her purpose. She showed us*" is key.
  5.  **Tone = Love:** Warmth comes from specific, human details (debating commas, Post-it notes, lighting up about family), genuine admiration for her consistency, and framing her rigor as a form of deep respect – not coldness.
  6.  **No CLE Vibe:** Avoids jargon except where immediately explained ("textualist," "habeas corpus"). Focuses on *her* actions and impact, not abstract legal theory.

  **Delivery Tip:** Pause slightly before/after the joke. Let the lawyers laugh first, *then* offer the family the "recipe" explanation with a warm, inclusive smile. When mentioning family moments, look directly at them. Keep the pace steady and sincere—channel her own no-nonsense clarity. You’ve got this!
