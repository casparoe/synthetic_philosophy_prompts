  Ok so this has been on my mind because of my new job. I started about a month ago at a small startup building a customer-support chatbot, and in basically every planning meeting somebody brings up whether the bot actually "understands" what customers are asking or if its just doing really fancy autocomplete. Yesterday one of the senior engineers ended the whole debate by going "guys, this was already settled like 40 years ago, Searle's Chinese Room argument proved a computer can never actually understand anything or be concious, it's just symbol shuffling no matter how good it looks from the outside, so can we please stop arguing about this and get back to the sprint." Everyone just nodded and moved on but it's kind of been bugging me since.

  I went and read up on the Chinese Room over the weekend (mostly the SEP article, not gonna lie some of it went over my head) and now I'm confused about something more basic than the argument itself: if Searle really did prove that no computer, now or ever, no matter how sophisticated, could understand language or be concious, why do actual philosophers and cognitive scientists still seem to argue about whether future AI could be concious or even deserve moral consideration? Shouldn't that whole conversation already be closed, the same way nobody seriously debates whether the earth is flat? Is my coworker basically right and everyone who still debates machine consciousness just hasn't gotten the memo, or is he using the argument wrong somehow? Genuinely not sure, would love an actual answer instead of more shrugging in Slack.
