answer: |-
  You've grasped Descartes' framework remarkably well for a non-specialist, and your questions pinpoint the exact complexities of Article 27. Let's break down each piece of the definition and address your specific confusions:

  1.  **"those perceptions, sensations or emotions of the soul..."**
      *   **The "Perception" Puzzle:** You're right that ordinary perceptions (like seeing a tree) are *of* something external or bodily. Descartes uses "perception" in a very broad, technical sense here. For him, *any* mental state where the soul is *passive* (i.e., receiving information rather than actively willing) is a "perception." Passions are a *sub-type* of perception. They *are* perceptions *of* something specific: **the soul's own state as it is affected by bodily changes.** Joy isn't "of" an external object like a tree; it's the soul's *perception* of its own condition *as* being joyfully affected by the "movement of the spirits” triggered by something beneficial. It's an *internal* perception.
      *   **The "Sensations or Emotions" Triad & Circularity:** Your instinct is spot-on regarding "emotion." The original French word Descartes uses is "émotions." In 17th-century French, "émotion" primarily meant **agitation, disturbance, commotion, or stirring** (physical or mental). It *did not* carry the modern, specialized meaning of "emotion" as a distinct psychological category like joy or anger. It was closer to our word "commotion." Translators face a dilemma:
          *   Using "emotions" risks modern misinterpretation (circularity).
          *   Using "commotions" (as you found) or "agitations" better captures the original sense of physical/mental *stirring* but sounds odd to modern readers.
      *   **Why the Triad?** Descartes isn't giving three distinct names for one thing. He's using near-synonyms to *emphasize the nature* of these specific perceptions:
          *   **Perceptions:** Highlights their passive, receptive nature (the soul *undergoes* them).
          *   **Sensations:** Emphasizes their felt, experiential quality (they are *felt* states).
          *   **Émotions (Commotions/Agitations):** Emphasizes their *disturbing* or *stirring* effect on the soul's state – they actively *move* or *agitate* the soul from within, unlike a neutral perception of an object.
      *   **The Key Phrase:** "...**which we refer particularly to it [the soul]**..." This is the *crucial* differentiator you asked about regarding hunger/pain vs. passions.

  2.  **"...which we refer particularly to it [the soul]..."**
      *   This addresses your question about hunger/pain versus joy/fear. Descartes argues we *attribute* passions directly *to the soul itself*, not to an external object or a specific body part.
      *   **Hunger/Thirst/Pain (Internal Sensations):** We say, "**My stomach** is empty" or "**My foot** hurts." We experience them as localized bodily states. We *refer* them primarily *to the body*.
      *   **Joy/Anger/Fear (Passions):** We say, "**I** am joyful," "**I** am angry," "**I** am afraid." While we know they involve the body (the "movement of the spirits"), we *experience* and *describe* them as states *of our entire self*, our *soul*. They feel like global conditions of *who we are* at that moment. We *refer* them primarily *to the soul*.

  3.  **"...and which are caused, maintained and strengthened by some movement of the spirits."**
      *   **The Mechanism:** This anchors passions firmly in Descartes' mind-body dualism and his physiological theory. "Spirits" ("esprits animaux") were believed to be subtle, fluid particles in the blood and nerves, responsible for carrying signals and causing movements. A stimulus (e.g., seeing a bear) causes a specific "movement of the spirits" in the brain (specifically the pineal gland, the mind-body interface). This movement *causes* the passion (fear) in the soul.
      *   **Maintained/Strengthened:** The initial bodily reaction (increased heart rate, adrenaline) *feeds back* via the spirits, *maintaining* and potentially *intensifying* the passion (the feeling of fear grows). This creates a loop: perception -> bodily change (spirits) -> passion -> further bodily change (spirits) -> stronger passion.
      *   **The Weight:** This clause does several things:
          *   **Distinguishes Passions from Actions of Will:** Acts of will (pure volitions) originate *only* in the soul. Passions originate from *bodily* motions impacting the soul.
          *   **Distinguishes Passions from Intellectual Judgments:** While passions often follow judgments (judging the bear is dangerous), the passion *itself* is the *feeling* caused by the bodily mechanism. Two people might *judge* the same bear dangerous, but one feels paralyzing fear (strong passion) while the other feels only alert caution (weaker passion) due to different bodily constitutions/spirit flows.
          *   **Explains Intensity & Bodily Feel:** It explains *why* passions feel so visceral and bodily – because they are directly caused and amplified by physical processes.

  **Where Descartes Lands on the Modern Menu:**

  *   **Primarily Feelings/Sensations:** Descartes lands most squarely here. Passions are fundamentally *felt experiences* or *internal sensations* of the soul's state, directly caused by physiological processes. They are the soul's *perception* of the bodily agitation.
  *   **Perceptions (of a Sort):** They are perceptions, but specifically *perceptions of the soul's own state* as modified by the body. They are not perceptions *of* external objects themselves (though they are typically *triggered* by perceptions of external objects).
  *   **Judgments? Less Directly:** While passions are *typically caused* by intellectual judgments about good/evil (Articles 40, 52), the passion *itself* is not identical to the judgment. The judgment ("This is dangerous") is an intellectual act. The passion (fear) is the *feeling* produced by the bodily mechanism *triggered* by that judgment. One can make a calm judgment without the corresponding passion (in theory, though difficult), and strong passions can sometimes distort judgment.

  **In Summary:**

  Descartes defines passions (emotions) as: **Unique, global, felt states of the soul (perceptions/sensations/agitations referred to the soul itself), which are passively experienced and are directly caused, sustained, and intensified by specific physiological processes ("movements of the spirits") triggered by events perceived as beneficial or harmful.**

  Your confusion stemmed from perfectly valid points: the broadness of "perception," the historical shift in "emotion," and the need for the "referred to the soul" clause to differentiate passions from bodily sensations like hunger. Descartes' answer leans heavily towards emotions being complex *feelings* generated by the body-soul interaction, experienced as states of the self, rather than being pure judgments or perceptions of external objects. His mechanical explanation via "spirits" is outdated, but his core idea – that emotions are felt states intrinsically linked to physiological arousal and attributed to our core self – remains highly influential.
