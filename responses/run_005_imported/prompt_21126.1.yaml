  First, I need to honor Ray's request to focus on his consistent care rather than outcomes, but without making it sound like his efforts didn't matter. That Williams truck driver analogy is key - it shows how agency and luck coexist. The toast must walk this tightrope: affirming Ray's skill while acknowledging outcomes aren't fully controllable. 

  The hospital audience means medical accuracy matters. Terms like "trauma bay" or "uncontrolled hemorrhage" should feel authentic. But family needs warmth too - maybe childhood stories about Ray's steady hands? Humor could come from how his work habits bled into family life ("turkey carving with surgical precision"). 

  Biggest challenge: translating "moral luck" into accessible language. No jargon, just clear metaphors. The truck example works, but I'll simplify it to "sometimes the injury lands just so." Ray's own words about "the scoreboard" are perfect to quote directly. 

  Structure-wise: open with celebration, then Ray's philosophy, then concrete examples of his character (pre-dawn arrivals, teaching residents), circling back to why this perspective makes him remarkable. End with warmth - maybe how retirement means he'll finally have time to overthink Thanksgiving turkeys. 

  Must avoid two traps: making it sound like skill didn't matter (depressing) or that luck erases merit (cynical). The pivot is "what was always his" - the preparation, the calm under pressure. That's the actionable core. 

  For laughs: gentle teasing about his intensity ("Ray once timed my pancake flip with a stopwatch") keeps it light. The "not a wake" note means ending upbeat - maybe "today we celebrate what was never left to chance: who you are."
