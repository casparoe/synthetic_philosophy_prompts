  *Scratching head* The real challenge is balancing two irreconcilable ethical frameworks without watering down either. Impartialism sees the TA's act as corruption of process; role ethics sees it as fidelity to relationship. The memo must honor both while prioritizing the university's integrity ecosystem. 

  Key angles to weave in: 
  - Ames/Rosemont's "relational ontology" where personhood is defined by roles (son/brother) not atomic individuality. 
  - Confucius' rejection of "uprightness" in Analects 13.18—reporting the father would destroy the relationship that *makes* ethics possible. 
