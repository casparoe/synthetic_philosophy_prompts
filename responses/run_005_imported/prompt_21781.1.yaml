answer: |-
  ## The Rational Imperative: Sidgwick's Psychical Research as the Logical Extension of the Dualism of Practical Reason

  The enduring image of Henry Sidgwick is often bifurcated: the cool, analytical architect of *The Methods of Ethics* (1874), who meticulously dissected moral reasoning only to confess its ultimate incoherence in the face of the "dualism of practical reason," and the seemingly incongruous figure hunched over séance tables, meticulously documenting table-tappings and alleged spirit communications as the founding President of the Society for Psychical Research (SPR) from 1882. The temptation to dismiss the latter as a product of Victorian spiritual angst, personal grief (especially post-1880), or the overpowering influence of friends like Frederic Myers and Edmund Gurney, is strong. However, a rigorous examination of the *structure* of the dualism argument within the *Methods*, coupled with Sidgwick's own expressed motivations and philosophical temperament, compels the conclusion that Bart Schultz is fundamentally correct: the psychical research was not a detour or a hobby, but the **necessary, intellectually honest, and rational continuation of his ethical project.** To view it otherwise is to misunderstand the profound existential and logical weight of the dualism Sidgwick uncovered.

  ### The Unyielding Core of the Dualism: A Demand for External Resolution

  Sidgwick's *Methods* culminates in a devastating admission. He demonstrates, to his own satisfaction, that two fundamental principles of practical reason appear equally rational and binding, yet ultimately irreconcilable *within the confines of a purely secular, empirical, and intuitionist ethics*:

  1.  **Rational Egoism (Prudence):** It is supremely rational for an individual to seek their own greatest happiness over the long term.
  2.  **Rational Benevolence (Utilitarianism):** It is supremely rational (based on the fundamental intuition of the equal value of all sentient beings) to seek the greatest aggregate happiness.

  Sidgwick exhausts the resources of philosophical ethics to subordinate egoism to benevolence or vice versa. Neither appeals to common sense morality, nor sophisticated Kantian-like constructions, nor evolutionary arguments provide a *rational* bridge. The "Cosmos of Duty" is fractured. The consequence is stark: "if we find that in our supposed knowledge of the world of nature propositions are commonly taken to be universally true, which yet seem to rest on no other grounds than that we have a strong disposition to accept them, and that they are indispensable to the systematic coherence of our beliefs,—it will be more difficult to reject a similarly supported proposition in ethics, *without a warrant from some other source*" (*Methods*, Concluding Chapter, emphasis added). This "warrant from some other source" is not a vague hope; it is explicitly defined as a **further fact about the universe**: a "moral government" of the cosmos ensuring that virtue ultimately aligns with self-interest, or personal immortality guaranteeing that the sacrifices demanded by duty are compensated in an afterlife. The dualism *logically requires* empirical or metaphysical facts beyond the ethical sphere to achieve coherence. Sidgwick states this necessity unequivocally: "the prolongation of human existence after death is... a condition of a fully rational reconciliation between the maxim of Prudence and the maxim of Rational Benevolence" (*Methods*, Concluding Chapter).

  ### The Intellectual Imperative: From Philosophical Impasse to Empirical Inquiry

  Given this logical structure, Sidgwick faced a limited set of options:

  1.  **Dogmatic Assertion:** Pretend the dualism was resolved within ethics itself. This violated his core commitment to rigorous, undogmatic inquiry, famously demonstrated by his resignation from his Trinity Fellowship over religious doubts.
  2.  **Resigned Agnosticism:** Accept the permanent incoherence of practical reason and live with the tension. For a philosopher who sought "systematic coherence" as the hallmark of rational belief, this was profoundly unsatisfactory, bordering on intellectual surrender.
  3.  **The Empirical Quest:** Actively seek the "further fact" his analysis identified as the *only* possible resolution. This was the path of intellectual integrity.

  Schultz’s argument hinges on recognizing that option (3) is the *only* option consistent with Sidgwick's philosophical character. Sidgwick didn't merely *hope* for an afterlife; his ethical analysis *demanded* evidence for it (or a moral order) as the sole possible solution. As he wrote to a friend shortly after publishing the *Methods*: "I have myself... a *belief* in the moral government of the world... but I cannot *prove* it... I am therefore a seeker, not a possessor." The SPR was the instrument of that seeking. Its stated aim – "to examine without prejudice or prepossession and in a scientific spirit those faculties of man... which are *prima facie* inexplicable on any generally recognised hypothesis" – perfectly aligns with Sidgwick's need. Telepathy offered a potential mechanism for survival; evidence of spirits provided direct proof. Sidgwick wasn't chasing comfort; he was demanding *data* to satisfy a logical condition imposed by his own ethical theory. As he confided to his wife Eleanor Balfour (herself a key SPR investigator): "The question whether the gradual evolution of moral order out of natural order is a fact or not... seems to me *the* question of questions for mankind." This "question of questions" stemmed directly from the *Methods*.

  ### Counterarguments: Grief, Context, and Coherence

  Critics point to valid contextual factors but misattribute their significance:

  *   **Grief (Post-1880):** Sidgwick's deep mourning after his brother-in-law Arthur Balfour's death in 1880 undeniably intensified his personal *desire* for evidence of survival. However, the SPR was founded in 1882, and Sidgwick's interest in psychical phenomena and the problem of survival predated this loss by *decades*, stemming back to the 1860s and coinciding with his work on the *Methods*. Grief amplified an existing commitment driven by philosophy; it did not create it.
  *   **Victorian Crisis of Faith:** While Sidgwick shared the era's religious anxieties, his philosophical crisis was distinct and self-generated. The dualism wasn't primarily about the truth of Christianity *per se*, but about the fundamental coherence of *rationality itself* in the ethical sphere. His search was for a foundation for *ethics*, not necessarily for traditional religion. The SPR's focus was empirical investigation, not theological dogma.
  *   **Myers and Gurney's Influence:** Myers and Gurney were passionate advocates, but Sidgwick was the undisputed intellectual leader and stabilizing force of the SPR. He set its cautious, empirical tone, constantly demanding better evidence and stricter controls. He joined not because he was led, but because the SPR provided the methodology to address *his* problem. As SPR Secretary Eleanor Sidgwick noted, his involvement was driven by "the desire for knowledge... the feeling that if such things were true it was of the utmost importance to prove them, and if not true, it was desirable to expose the delusion."

  ### The Verdict: A Coherent Philosophical Life

  To dismiss Sidgwick's psychical research as an irrational tangent or a capitulation to personal or cultural pressures is to fundamentally misread the *nature* of the impasse he reached in the *Methods*. The dualism of practical reason wasn't a puzzle within ethics; it was an indictment of ethics' ability to achieve rational coherence without external, empirically verifiable support. Sidgwick, the philosopher who resigned his fellowship rather than profess belief he couldn't justify, could not simply shrug at this conclusion. The demand for a "further fact" was explicit, logical, and inescapable within his own system.

  Therefore, the founding and leadership of the SPR, the meticulous attendance at séances, the decades-long pursuit of evidence for telepathy and survival, represent **the rational enactment of a philosophical necessity.** It was an empirical research program directly mandated by the logical structure of his ethical theory. Sidgwick wasn't abandoning philosophy for the occult; he was employing empirical methods to investigate the metaphysical preconditions his philosophy had rationally established as essential. While personal and cultural factors provided context and emotional weight, the engine driving this decades-long quest was the unyielding logic of the dualism itself. Sidgwick's life exhibits a remarkable, even austere, coherence: having identified the precise conditions under which practical reason could be made whole, he dedicated himself to the only intellectually honest path – seeking evidence for those conditions.

  **In short: Sidgwick’s psychical research was not merely consistent with his ethics; it was its rationally mandated, empirical corollary, an indispensable part of his lifelong project to establish a coherent foundation for rational conduct in the world.** To sever the two is to misunderstand the depth of the crisis Sidgwick uncovered and the integrity of his response. His legacy demands they be studied together.

  ---

  **Footnote Ready Quote:**  
