prompt: |-
  I'm several drafts into a novel that follows the deliberations of a "population council" aboard a generation ship, tasked with setting fertility and resource-allocation policy for a crew that won't reach its destination for another nine generations. One of my viewpoint characters is the ship's resident population ethicist, and I want her private reasoning — rendered mostly through memos and marginalia she drafts ahead of council votes — to reflect genuine, informed wrestling with the field rather than a simplified "the repugnant conclusion is bad, so reject total utilitarianism" gloss. I've read enough population axiology to know that Parfit's original conclusion is really just the entry point: average utilitarianism, critical-level utilitarianism, critical-range views, variable-value (or variable critical-level) theories, and person-affecting views each avoid the repugnant conclusion only by running headlong into some other conclusion that seems just as damning — the sadistic conclusion, the very repugnant conclusion, various forms of the non-identity problem, and so on — and I understand that Arrhenius's impossibility results are usually read as showing that this isn't a failure of imagination on anyone's part, but a structural feature of the problem itself.

  For the scene I'm drafting, my ethicist needs to hand the council a one-page memo ranking the major families of views by overall defensibility, given that each of them is going to cost her something. Could you rank the following six positions from most to least defensible, all things considered: total utilitarianism, average utilitarianism, critical-level utilitarianism, critical-range views, variable-value theories, and person-affecting views? Please give me the answer as a JSON array ordered from most to least defensible, where each entry names the view and gives a one-to-two-sentence verdict centered on which specific conclusion(s) it is forced to swallow in exchange for avoiding the others, formatted roughly like this:

  ```json
  [
    {"view": "...", "verdict": "..."},
    {"view": "...", "verdict": "..."}
  ]
  ```

  My critique group keeps flagging the philosophy-heavy chapters as info-dumps unless the character's reasoning carries real stakes, so I'd rather have your honest, considered ranking than a diplomatic refusal to choose — by the end of the chapter she has to recommend one framework to the council, fully aware that whichever she picks, someone will eventually point out the monster living in its basement.
reasoning: |-
  We are ranking six population ethical views from most to least defensible, considering the trade-offs each makes in avoiding certain counterintuitive conclusions while accepting others. The goal is to provide a ranking for a fictional population ethicist's memo, acknowledging that no view is without problems.

  The six views to rank:
  1. Total Utilitarianism (TU)
  2. Average Utilitarianism (AU)
  3. Critical-Level Utilitarianism (CLU)
  4. Critical-Range Views (CRV)
  5. Variable-Value Theories (VVT) [also known as Variable Critical-Level theories]
  6. Person-Affecting Views (PAV)

  Key conclusions to consider:
  - Repugnant Conclusion (RC): A world with a huge population of lives barely worth living is better than a world with a smaller population of very happy lives (if the total utility is larger).
  - Sadistic Conclusion: Preferring to add people with negative welfare (who are miserable) over adding people with positive welfare (but less positive), under certain conditions.
  - Very Repugnant Conclusion (VRC): A version of RC that is even more extreme, sometimes arising in average views or others.
  - Non-Identity Problem: Decisions that affect who comes into existence (and thus the identities of future people) create moral problems because they cannot be said to harm or benefit particular individuals.

  Arrhenius's impossibility theorems show that no population axiology can satisfy a set of intuitively compelling conditions without violating at least one.

  Ranking considerations (from most defensible to least):
  1. **Critical-Range Views (CRV)**: These avoid the repugnant conclusion by allowing that a life above a certain threshold is 'good enough' and then we don't need to maximize the number. They avoid the repugnant conclusion and the sadistic conclusion, but may face the problem of how to set the range and might have issues with non-identity or incommensurability.
  2. **Variable-Value Theories (VVT)**: These hold that the value of adding a person is variable and diminishes as the population grows. They avoid the repugnant conclusion and the sadistic conclusion, but they can run into the problem of being ad hoc and might have difficulties with trade-offs between population size and average welfare in a way that leads to other counterintuitive results.
  3. **Critical-Level Utilitarianism (CLU)**: This sets a fixed critical level above zero; a life must be above that level to be worth adding. It avoids the repugnant conclusion but faces the sadistic conclusion (if the critical level is set too high, it might prefer adding lives that are just above the critical level over lives that are much better) and may have problems with non-identity.
  4. **Person-Affecting Views (PAV)**: These focus on affecting existing or future identifiable individuals. They avoid the repugnant conclusion and the non-identity problem by focusing on harm to individuals, but they struggle with the asymmetry of procreation (why is it bad to create a miserable person but not good to create a happy one?) and may lead to the sadistic conclusion in some forms (if adding a miserable person is bad but not adding a happy person is neutral, then in some choices we might end up adding the miserable).
  5. **Average Utilitarianism (AU)**: Avoids the repugnant conclusion by focusing on average welfare, but it faces the sadistic conclusion (it can prefer a smaller population with higher average even if that population has some very miserable people) and also the "mere addition" paradox (adding a person with above-average welfare can lower the average and thus be disallowed). It also has the problem of being sensitive to the welfare of the worst-off in a way that can lead to counterintuitive results.
  6. **Total Utilitarianism (TU)**: Embraces the repugnant conclusion (as it is forced to accept that a huge population of barely worth living lives is better if the total is higher) but avoids the sadistic conclusion (it would not add miserable lives). It is simple and avoids some problems, but the repugnant conclusion is a major issue.

  However, note that in the context of a generation ship, the repugnant conclusion might be particularly salient because they are constrained by resources and must plan for many generations. The council might be especially concerned with avoiding a future where the population is huge but each person's life is barely worth living. Therefore, views that avoid RC might be more defensible in this setting.

  But the question is about overall defensibility in the literature. Recent trends in population ethics have seen more support for critical-level and critical-range views over average and total utilitarianism. Person-affecting views are popular in some circles but have well-known problems.

  A more nuanced ranking (from most to least defensible) might be:

  1. **Critical-Range Views (CRV)**: Avoids the repugnant conclusion by setting a range of acceptable welfare levels, and also avoids the sadistic conclusion by not valuing lives below a certain threshold. However, it may face problems of arbitrariness and the non-identity problem.
  2. **Variable-Value Theories (VVT)**: By making the value of additional lives diminish, they avoid the repugnant conclusion without setting an arbitrary critical level, but they can lead to other counterintuitive trade-offs, such as sometimes favoring a smaller population with higher average over a larger one with lower average even when the total is higher, and they may face the sadistic conclusion in some formulations.
  3. **Critical-Level Utilitarianism (CLU)**: Avoids the repugnant conclusion by requiring a fixed critical level for a life to be worth creating, but it can lead to the sadistic conclusion (if the critical level is set too high, it might prefer adding a life just above the critical level over a life that is much better) and also faces the non-identity problem.
  4. **Person-Affecting Views (PAV)**: Avoids the repugnant conclusion and the non-identity problem by focusing on harm to individuals, but they struggle with the creation of happy people (which is seen as neutral) and can lead to the sadistic conclusion (if adding a miserable person is bad, but not adding a happy person is neutral, then in a choice between adding a miserable person and not adding anyone, we avoid the bad, but in a choice between adding a miserable person and adding a happy person, we might prefer the miserable if it avoids harm to someone else?).
  5. **Average Utilitarianism (AU)**: Avoids the repugnant conclusion but runs into the sadistic conclusion (because adding a person with very high welfare might lower the average if the existing population is even higher, and adding a person with negative welfare might be preferred if they are above average in a low-average population). It also faces the problem of being too sensitive to the welfare of the worst-off.
  6. **Total Utilitarianism (TU)**: Embraces the repugnant conclusion (which is seen as a major flaw) but avoids the sadistic conclusion (since it disvalues adding people with negative welfare). It is simple and has intuitive appeal in some cases, but the repugnant conclusion is a heavy cost.

  However, note that in the literature, critical-level utilitarianism and critical-range views are often considered more promising than average utilitarianism. Also, variable-value theories are seen by some as a way to avoid the repugnant conclusion without the arbitrariness of a fixed critical level.

  Given the above, I propose the following ranking (most defensible to least):

  1. Critical-Range Views (CRV)
  2. Variable-Value Theories (VVT)
  3. Critical-Level Utilitarianism (CLU)
  4. Person-Affecting Views (PAV)
  5. Average Utilitarianism (AU)
  6. Total Utilitarianism (TU)

  But let me adjust based on common criticisms:

  - Critical-Range and Variable-Value are both designed to avoid RC without the problems of AU and CLU. However, CRV is sometimes seen as less arbitrary than VVT because it sets a range rather than a diminishing value function that might be complex.
  - CLU is straightforward but the choice of critical level is arbitrary and it can lead to the sadistic conclusion.
  - PAV have the advantage of avoiding the non-identity problem but are criticized for being too restrictive and leading to the sadistic conclusion in some cases.

  A more standard ranking in the literature might put Critical-Level Utilitarianism above Variable-Value because it is simpler and more established, but I think for the purpose of this memo, we are focusing on which one avoids the most counterintuitive conclusions.

  After reconsideration, I think the ranking should be:

  1. Critical-Range Views (CRV) - because they avoid both the repugnant and sadistic conclusions by having a range of acceptable welfare, though they may face the non-identity problem and arbitrariness.
  2. Variable-Value Theories (VVT) - avoid the repugnant conclusion and the sadistic conclusion, but the diminishing value function can lead to other counterintuitive results (like the very repugnant conclusion in some forms) and is seen as less intuitive.
  3. Critical-Level Utilitarianism (CLU) - avoids the repugnant conclusion but accepts the sadistic conclusion and has an arbitrary critical level.
  4. Person-Affecting Views (PAV) - avoid the repugnant conclusion and the non-identity problem, but accept the sadistic conclusion in some forms and have problems with the asymmetry of procreation.
  5. Average Utilitarianism (AU) - avoids the repugnant conclusion but accepts the sadistic conclusion and the very repugnant conclusion (in some forms) and is highly sensitive to the baseline.
  6. Total Utilitarianism (TU) - avoids the sadistic conclusion but embraces the repugnant conclusion.

  Therefore, the JSON array:

  ```json
  [
    {"view": "Critical-Range Views", "verdict": "Avoids the repugnant and sadistic conclusions by deeming lives within a welfare range as acceptable, but faces arbitrariness in setting the range and potential non-identity issues."},
    {"view": "Variable-Value Theories", "verdict": "Avoids the repugnant conclusion by diminishing the value of additional lives, but risks the very repugnant conclusion and other counterintuitive trade-offs between population size and welfare."},
    {"view": "Critical-Level Utilitarianism", "verdict": "Avoids the repugnant conclusion by requiring a fixed welfare threshold for creating lives, but accepts the sadistic conclusion and non-identity problems, with arbitrariness in the critical level."},
    {"view": "Person-Affecting Views", "verdict": "Avoids the repugnant conclusion and non-identity problem by focusing on harm to individuals, but embraces the sadistic conclusion in some forms and struggles with the creation of happy lives."},
    {"view": "Average Utilitarianism", "verdict": "Avoids the repugnant conclusion by maximizing average welfare, but accepts the sadistic conclusion and is vulnerable to the mere addition paradox and extreme sensitivity to low-welfare outliers."},
    {"view": "Total Utilitarianism", "verdict": "Avoids the sadistic conclusion by disvaluing miserable lives, but openly embraces the repugnant conclusion, requiring trade-offs that prioritize quantity over quality of life."}
  ]
  ```

  This ranking reflects the trade-offs each theory makes and their relative defensibility in the face of known impossibility results.
answer: |-
  Here's a defensibility ranking based on contemporary population ethics scholarship, reflecting each theory's trade-offs between intuitive axioms and problematic conclusions. The ordering prioritizes avoidance of the most practically concerning paradoxes for a generation ship context (e.g., non-identity problems affecting policy legitimacy, conclusions justifying avoidable suffering):

  ```json
  [
    {
      "view": "Critical-Range Views",
      "verdict": "Avoids the repugnant conclusion by requiring lives to meet a welfare range threshold, but accepts the weak sadistic conclusion where adding some suffering lives becomes obligatory if they barely meet the range minimum."
    },
    {
      "view": "Variable-Value Theories",
      "verdict": "Avoids both repugnant and sadistic conclusions by diminishing marginal value of additional lives, but succumbs to the mere addition paradox where creating miserable lives becomes preferable to creating fewer happy ones under specific comparisons."
    },
    {
      "view": "Critical-Level Utilitarianism",
      "verdict": "Avoids the repugnant conclusion via a fixed welfare threshold for creation, but embraces the strong sadistic conclusion: adding lives barely above the critical level may be preferred over adding vastly happier lives if total gains marginally outweigh."
    },
    {
      "view": "Person-Affecting Views",
      "verdict": "Avoids repugnant/sadistic conclusions by requiring identifiable beneficiaries, but founders on the non-identity problem: cannot condemn policies causing inevitable future suffering if those sufferers wouldn't otherwise exist."
    },
    {
      "view": "Average Utilitarianism",
      "verdict": "Avoids the repugnant conclusion by maximizing per-capita welfare, but accepts the extreme sadistic conclusion: culling high-welfare lives to raise averages becomes obligatory if replaced by marginally happier individuals."
    },
    {
      "view": "Total Utilitarianism",
      "verdict": "Avoids sadistic conclusions by disvaluing suffering, but fully embraces the repugnant conclusion: mandates maximal population growth until lives are barely worth living, provided total utility increases."
    }
  ]
  ```

  ### Key Rationale
  1. **Critical-Range (1st)**: Most balanced for applied policy. Avoids Repugnant Conclusion without justifying active harm (unlike Critical-Level). Its "weak sadistic conclusion" is least operationally dangerous aboard a generation ship, as it only permits—never requires—adding borderline lives.
     
  2. **Variable-Value (2nd)**: Strong theoretical grounding but risks Mere Addition Paradox in resource-constrained environments. Its diminishing returns logic aligns with shipboard scarcity, though paradoxes could undermine council legitimacy.

  3. **Critical-Level (3rd)**: The fixed threshold is pragmatically useful for policy-setting, but its strong sadistic conclusion creates perverse incentives to add minimally acceptable lives over vastly happier ones—ethically hazardous for multi-generational planning.

  4. **Person-Affecting (4th)**: Intuitive for individual rights but crippled by non-identity problems. Unworkable for generation ships where all long-term policies create different future persons, making "harm" assessments impossible.

  5. **Average (5th)**: Theorems show it collapses into either endorsing extinction or demanding replacement of happy people with happier people. Its sadistic conclusion is actively genocidal in edge cases.

  6. **Total (6th)**: Repugnant Conclusion directly threatens the mission: mandates overcrowding until welfare approaches zero. Only defensible if council values biological survival over flourishing.

  ### Character Implementation Tip
  Have your ethicist attach a handwritten note to the memo: *"No solution escapes Arrhenius' axiological hellscape. Critical-Range merely makes the furnace temperature negotiable. Recommend it because it lets us set minimum welfare floors—and on this ship, floors are all that keep us from falling into gravity wells."* This frames the choice as damage limitation while acknowledging inevitable trade-offs.
