prompt: |-
  Me and a friend run a tiny podcast about weird corners of philosophy and decision theory, more of a hobby than anything else, and next week's episode is with a decision theorist who works on functional decision theory (the Yudkowsky/Soares family of views, same lineage as timeless and updateless decision theory) and who's basically become the go-to person for explaining why Roko's basilisk doesn't actually follow from her own theory. Every single host who talks to her burns the first fifteen minutes making her re-explain what the basilisk even is, and the conversation never gets past that part. I want to skip all of that and go straight at the mechanics, since that's way more interesting than the meme version everybody already knows.

  Can you draft seven or eight interview questions that just assume the audience knows the basic setup already? I want one question on the blackmail-resistance move -- the idea that a properly built FDT agent precommits to ignore acausal threats so a rational blackmailer gains nothing by following through -- with a follow-up ready for the obvious reply, pressing on whether that precommitment is even available to someone who's already heard and understood the argument. I want one on the "logical dependence" part, i.e. how a decision you make now is supposed to have any bearing on an agent that doesn't exist yet and never causally touches you, with a follow-up for when she reaches for "logical time" or "logical prior" language, asking her to cash that out concretely instead of it just being backward causation wearing a trenchcoat. I want one that presses on whether any of this requires thinking a tortured simulation of you is morally continuous with you, with a follow-up on whether a low-fidelity or partial simulation changes her answer. And I want the whole thing to build toward a last question that makes her go-to move -- "that's not what the theory implies, Roko just got the decision theory wrong" -- hard to reach for, maybe by handing her a cleaned-up version of the scenario that avoids the sloppy parts of Roko's original post, so shes stuck either biting the bullet on some cousin of the basilisk or naming the exact premise of her own theory that blocks it. If theres room, throw in something at the end on whether Yudkowsky banning discussion of the whole thing back in 2010 was itself the correct blackmail-resistant move by his own theory's lights, or actually in tension with it.
