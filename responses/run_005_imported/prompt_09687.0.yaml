  First, I need to dissect each argument's relevance to subtyping. The composition argument (shape + color ≠ shape) mirrors how adding behavioral constraints in Square breaks Rectangle's substitutability. The extension argument (different sets satisfy "horse" vs "white horse") is practically a real-world demonstration of LSP violation - clients expecting Rectangle get surprised when Square's mutation behaves differently. The specification argument (exclusion through added attributes) directly explains why Square's invariant corrupts the supertype contract.

  But I notice the user is suspicious about whether these are just wordplay. They're right to question - the "is" equivocation is definitely present. However, the arguments become substantive when applied to software behavior rather than mathematical sets. That's where the analogy holds: substitutability is about expectations in mutation scenarios, not static properties.

  The breakdown happens in two places: ancient philosophy had no concept of state mutation, and software relies on explicit contracts beyond naming. Still, the core insight stands - nominal inheritance often lies about behavioral compatibility. The white horse dialogue accidentally gives us three angles to explain why "is-a" in taxonomy doesn't guarantee "acts-like-a" in practice.

