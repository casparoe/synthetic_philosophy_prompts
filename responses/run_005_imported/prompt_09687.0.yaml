answer: |-
  The Square/Rectangle dilemma and Gongsun Long's "white horse is not a horse" paradox reveal a profound insight about **the gap between taxonomic classification and behavioral substitutability**—a gap critical for software design. Let's dissect the three arguments and their implications for subtyping:

  ### 1. **The Composition Argument: "Horse names shape; white names color"**  
     - **Gongsun Long's Point**: Composite terms ("white horse") define a *different conceptual category* than their components ("horse").  
     - **Software Analogy**: A `Square` *is-a* `Rectangle` mathematically (four sides, right angles), but when you add the invariant `width == height`, you create a new *behavioral contract*.  
     - **Survives as Substance**: **Yes.** This highlights that inheritance isn’t just about shared *attributes* (like `getArea()`), but about *preserving invariants*. `Rectangle` allows independent width/height mutation; `Square` does not. Composing `Square` as a subtype *redefines the contract*, breaking substitutability.  
     - **Implication**: Subtyping requires *contract preservation*, not just structural similarity. If `Square` inherits from `Rectangle`, it must honor `Rectangle`’s mutation semantics—which it cannot.

  ### 2. **The Extension Argument: "Yellow/black horses satisfy 'horse' but not 'white horse'"**  
     - **Gongsun Long's Point**: The set of things satisfying "horse" (yellow/black/white horses) ≠ the set satisfying "white horse" (only white horses).  
     - **Software Analogy**: Code expecting a `Rectangle` assumes it can set `width=5, height=10`. A `Square` fails this expectation—it violates the *postconditions* of `setWidth`/`setHeight`.  
     - **Survives as Substance**: **Emphatically yes.** This is the **Liskov Principle incarnate**: Subtypes must not alter supertype behavior. Clients relying on `Rectangle`’s mutability break when given a `Square`. The "sets" (valid behaviors) differ.  
     - **Implication**: Subtyping is defined by *what clients can rely on*, not static taxonomy. If `Square` breaks client code, it *is-not-a* substitutable `Rectangle`.

  ### 3. **The Specification Argument: "Horse doesn’t specify color; white horse does"**  
     - **Gongsun Long's Point**: Adding constraints ("white") *excludes possibilities* (non-white horses), creating a more specific—and distinct—concept.  
     - **Software Analogy**: `Rectangle` has no invariant linking width/height. `Square` adds the invariant `width == height`, *excluding* states where `width != height`. This violates `Rectangle`’s *mutation freedom*.  
     - **Survives as Substance**: **Crucially yes.** This is why `Square` fails LSP: **strengthening invariants in subtypes breaks supertype contracts**. `Rectangle`’s contract allows `{width=5, height=10}`; `Square` forbids this state.  
     - **Implication:** Subtyping requires *weaker or equal* invariants, not stronger ones. Adding constraints narrows what’s permissible, sabotaging substitutability.

  ---

  ### **Broader Lessons for Software Engineering**  
  The School of Names’ core concern—**the fidelity of names to actual behavior**—maps directly to subtype design:  
  - **"Names" (Types) Must Match "Actualities" (Behavior)**: If `Square` is named a subtype of `Rectangle`, it must *act* like one. If it doesn’t, the name lies.  
  - **LSP is About Behavioral Contracts, Not Taxonomy**: Mathematical "is-a" (squares ⊂ rectangles) is irrelevant if behavioral contracts clash. Software subtyping is defined by *usage contracts*, not set theory.  
  - **Prefer Composition Over Inheritance for Conflicting Invariants**: Make `Square` *contain* a `Rectangle` (or use an interface `Quadrilateral`) rather than inheriting. This severs the substitutability expectation.

  ### **Where the Analogy Breaks Down**  
  - **Mutability Matters**: Gongsun Long’s arguments are static (what *is* a horse?). Software subtypes fail when *mutation* exposes contract violations. Immutable `Square`/`Rectangle` *could* share an interface (e.g., `getArea()`) without breaking LSP.  
  - **Explicit Contracts**: Ancient philosophy lacked software’s tool: *explicit pre/postconditions*. With contracts codified (e.g., "`setWidth` must not alter height"), the Square/Rectangle incompatibility becomes mechanically verifiable.

  ---

  ### **The Verdict**  
  **All three arguments survive as substantive when applied to behavioral subtyping:**  
  1. Composition reveals how added constraints redefine contracts.  
  2. Extension demonstrates client expectations define substitutability.  
  3. Specification shows that narrowing invariants breaks supertype promises.  

  **The philosophical takeaway for engineers:**  
  > **Do not inherit based on "is-a" in a vacuum.** Subtyping is valid *only if the subtype honors every supertype contract*. If your `Square` cannot obey `Rectangle`’s mutation rules, it *is-not-a* `Rectangle` in the Liskov sense—no matter what geometry says. Gongsun Long’s "white horse" paradox, 2300 years early, warns us: **names must align with actual behavior, or they become traps.**
