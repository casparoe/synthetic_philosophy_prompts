answer: |-
  Your confusion is entirely understandable—Breiman's theorem *does* seem like a mathematical mic-drop favoring full Kelly. The persistence of fractional Kelly recommendations from sophisticated practitioners like Thorp stems from the gap between the idealized assumptions of the Kelly/Breiman framework and the messy realities of betting. Here's why fractional Kelly remains compelling:

  1.  **Model Uncertainty & Estimation Error:**
      *   **The Core Problem:** Full Kelly is *extremely sensitive* to accurate estimates of edge (your advantage) and odds (the true probability distribution). In the idealized model, these are known perfectly. In reality, they are *estimated* with error.
      *   **Consequences of Overestimation:** If you overestimate your edge (which is easy to do) and bet full Kelly, you are effectively overbetting *relative to your actual edge*. Overbetting drastically increases the risk of ruin and significantly reduces long-term growth compared to the optimal fraction *for your true edge*. It also leads to much higher volatility.
      *   **Consequences of Underestimation:** While underestimating edge leads to lower growth than optimal, it's generally less catastrophic than overestimation. Betting less than full Kelly acts as a buffer against the inevitable errors in estimating your true edge.
      *   **Thorp's Pragmatism:** Thorp, applying Kelly to investments and blackjack card counting, understood deeply how hard precise edge estimation is. Fractional Kelly (often 1/2) was his practical hedge against this unavoidable uncertainty.

  2.  **Risk Aversion Beyond Growth Rate:**
      *   **Breiman's Objective:** The theorem optimizes for *asymptotic* dominance (winning eventually with probability 1) and minimal *expected time* to large wealth targets. It says nothing about the *path* to that wealth.
      *   **The Path Matters Practically:**
          *   **Volatility:** Full Kelly maximizes growth *rate* but also maximizes volatility (variance in the growth rate). The drawdowns (peak-to-trough declines) under full Kelly can be severe and psychologically intolerable or practically destabilizing (e.g., triggering margin calls, losing investors).
          *   **Finite Horizons & Ruin Risk:** "Eventually" can be a very long time. Real bettors and investors have finite lifetimes, finite capital bases, and finite tolerance for risk of ruin (ROR). While full Kelly has a *theoretical* ROR of zero for positive-edge bets, the probability of halving your bankroll *before* the long run kicks in is significant. Fractional Kelly substantially reduces both ROR and the magnitude of likely drawdowns.
          *   **Utility Functions:** Kelly optimizes for log(wealth), which implies a specific, very aggressive risk tolerance. Human utility for wealth is often modeled as concave (e.g., sqrt(wealth) or linear below a point, then concave). For most concave utility functions *other than log*, a fractional Kelly strategy will provide higher *expected utility* than full Kelly. Samuelson's core objection was precisely this: Kelly is only optimal *if* your utility function *is* logarithmic. He argued this was a very specific and unrealistic preference.

  3.  **Violations of Model Assumptions:**
      *   **Non-IID Bets:** Breiman assumes identical, independent bets with constant fractional growth. Real-world bets are zero-sum games. Real investments have changing edges, correlations, and changing market conditions. The Kelly Criterion struggles with correlated bets or non-stationary processes. Full Kelly becomes highly sensitive to estimation errors in the edge (`p`) or payoff (`b`).
      *   **Discrete Bet Sizes & Transaction Costs:** Kelly assumes continuous betting fractions. Real bets are discrete. It also ignores transaction costs and market impact, which can be significant and favor less frequent trading (lower `f`).

  **Why Fractional Kelly is Often Preferable:**

  *   **Robustness to Estimation Error:** If you *think* your edge is `p = 0.55` and `b = 1.0` (implying `f* = 0.55 - 0.45 = 0.10`), but your *true* edge is `p = 0.53` (`f*_true = 0.06`), betting `f = 0.10` is substantially *overbetting*. Your growth rate will be lower than betting `f=0.06`, and your ROR is high. Betting `f = k * f*` (e.g., `k=0.5` -> `f=0.05`) reduces the damage caused by overestimation. It also provides a buffer if the true `b` is slightly less than estimated.
  *   **Reduced Volatility & Drawdowns:** Fractional Kelly (`k < 1`) smooths the equity curve dramatically. This is psychologically easier to withstand and reduces the chance of blowing up during inevitable losing streaks. It also lowers the probability of ruin to negligible levels for `k <= 0.5`.
  *   **Higher Median Wealth (for k~0.5):** While full Kelly maximizes *expected* log(wealth) (and thus asymptotic growth rate), fractional Kelly with `k ~ 0.5` often maximizes the *median* wealth after a finite number of trials. Many practitioners care more about median outcomes than mean log outcomes.
  *   **Accounting for Utility & Risk Tolerance:** Using `k < 1` implicitly accounts for a more conservative utility function than logarithmic utility. It allows the bettor/investor to tailor the aggressiveness to their specific psychological and financial risk tolerance.

  **Conclusion:**

  Breiman's proof is mathematically sound *under its specific assumptions* (log utility, known true edge/payoff, IID bets, infinite horizon, no ruin risk aversion). However, the real world violates these assumptions. Fractional Kelly (`f = k * f*` with `k` typically between `0.2` and `0.8`) is a pragmatic adaptation. It sacrifices some theoretical asymptotic growth rate to gain:
  1.  Robustness to inevitable estimation errors.
  2.  Drastically reduced volatility and drawdowns.
  3.  Lower risk of ruin.
  4.  Better alignment with realistic human utility functions and finite horizons.

  Therefore, while full Kelly is the theoretical optimum under idealized conditions, fractional Kelly is almost always the better choice in practice. The optimal `k` depends on the individual's risk tolerance, confidence in their edge estimate, and the specific constraints they face.
