  The Kelly Criterion is mathematically optimal for maximizing long-term wealth growth under ideal conditions, but practical considerations often make fractional Kelly strategies preferable. Here's a concise breakdown:

  ### **Why Kelly is Theoretically Optimal (Breiman's Argument)**
  1. **Maximizes Asymptotic Growth**: For repeated bets with a known edge, the Kelly fraction \( f^* = \frac{bp - q}{b} \) maximizes the expected logarithm of wealth, leading to the highest geometric growth rate.
  2. **Dominates Other Strategies**: In the long run, full Kelly almost surely outperforms any other strategy (including fractional Kelly) in terms of terminal wealth.

  ### **Why Fractional Kelly is Often Better in Practice**
  1. **Robustness to Estimation Error**:
     - Kelly is highly sensitive to misestimating the edge (\(p\)) or payoff (\(b\)). Overestimation leads to overbetting and increased ruin risk.
     - Example: If true \(p = 0.6\) but estimated as \(p = 0.65\), full Kelly bets \(f^* = 0.3\) instead of \(f^* = 0.2\). This error reduces growth and increases volatility.
     - Fractional Kelly (e.g., \(f = 0.5 \times f^*\)) mitigates this by underbetting.

  2. **Risk of Ruin & Drawdowns**:
     - Full Kelly has a non-zero risk of significant drawdowns (e.g., 50% loss occurs with ~13% probability before recovery).
     - Real investors have finite capital/time. Fractional Kelly reduces short-term volatility and ruin probability (near zero for \(f \leq 0.5 f^*\)).

  3. **Utility Functions**:
     - Kelly optimizes for logarithmic utility, implying extreme risk tolerance. Humans often prefer more conservative utility (e.g., linear or square-root wealth).
     - For most concave utilities, fractional Kelly yields higher *expected utility* than full Kelly.

  4. **Non-Ideal Betting Conditions**:
     - Bets are rarely IID (independent and identically distributed). Correlations, changing edges, and discrete bet sizes violate Kelly’s assumptions.
     - Transaction costs and liquidity constraints favor less frequent trading (lower \(f\)).

  ### **When to Use Fractional Kelly**
  - **Typical Fractions**: \(f = k \times f^*\) with \(k \in [0.2, 0.7]\).
  - **Use Cases**:
    - Low confidence in edge estimates.
    - High volatility or correlated bets.
    - Finite capital or low risk tolerance.
    - When median wealth (not asymptotic growth) is prioritized.

  ### **Key Tradeoff**
  - **Sacrifice**: Fractional Kelly gives up theoretical growth for robustness, lower drawdowns, and psychological sustainability.
  - **Optimality**: Full Kelly is optimal *only* under perfect knowledge and log utility. Fractional Kelly is superior under uncertainty.

  ### **Conclusion**
  While Breiman’s proof holds mathematically, fractional Kelly is pragmatically better for real-world applications where models are imperfect and risk tolerance is finite. It balances growth and safety, making it the preferred choice for most investors and bettors.
