answer: |-
  Your situation is a profound illustration of a philosophical problem at the heart of language, social conventions, and rule-following. Treated with the seriousness it deserves, here's an analysis:

  ### 1. **The Indeterminacy of Unwritten Rules**
     There is **no objective, pre-existing fact of the matter** about which rule you were "truly" following. Your shared practice created the *appearance* of a determinate rule, but it was always underdetermined by the actual history of play. This is because:
     - **Rules emerge from practice**: Rules aren't platonic ideals waiting to be discovered; they are constituted by consistent application in specific contexts. When a novel situation arises (like the collision of two conventions), the prior practice *doesn't* contain a hidden answer—it only contained agreement in cases that were actually tested.
     - **The "No Test, No Truth" Principle**: If a rule's application to scenario X was never tested in your shared history, there is no fact about how the rule "would have" applied to X. Past consistency with multiple interpretations proves the rule was *vague* at its boundaries.

  ### 2. **Why Both Sides Feel Objectively Right**
     - **Internal Coherence**: Each interpretation (bonus survives voiding vs. voiding erases all) is perfectly consistent with *all prior instances* because the conflict never occurred. Each side is projecting their preferred *general principle* onto the past.
     - **Cognitive Commitment**: After years of play, players internalize the rules as objective. When confronted with ambiguity, they experience it as a *discovery* of pre-existing truth rather than a *creation* of a new rule. This is a psychological necessity for fluid gameplay but a liability in edge cases.

  ### 3. **Wittgenstein and the "Rule-Following Paradox"**
     Your dilemma echoes Ludwig Wittgenstein's insight: *No set of past actions can fully determine future applications of a rule*. Imagine teaching someone to add "+2" by showing examples: 2→4, 4→6, 6→8. They might later apply it to 1000→1002. But what if they say 1000→1004, insisting "I thought '+2' meant 'add 2 until 1000, then add 4'"? Your past examples *underdetermine* the rule. Your group's history is analogous—it doesn't fix the rule for untested cases.

  ### 4. **The Impossibility of Retroactive Objectivity**
     - **The Myth of the "True Rule"**: Your friend’s belief that there *must* be a fact of the matter assumes rules exist independently of practice. But unwritten game rules are social constructs—they live only in your collective actions and understandings.
     - **Equilibrium, Not Truth**: For a decade, your group was in a state of *equilibrium*: everyone acted in ways others expected. The collision broke that equilibrium, revealing the indeterminacy that always existed.

  ### 5. **A Principled Path Forward**
     While there’s no *retroactive* fact about the rule, you can resolve this prospectively with intellectual integrity:
     - **Vote as Legislative Act**: Taking a vote **does not "discover" the original rule**—it *creates* a new rule. Admit this openly: "Our past practice didn’t cover this, so we’re establishing how it works now."
     - **Principles for Decision-Making** (not "Truth-Finding"):
       - **Game Integrity**: Which choice better preserves the spirit of the game? Does the zero-bid bonus represent a high-risk achievement (favoring paying it), or is it contingent on a valid hand (favoring voiding)?
       - **Practicality**: Voiding *all* effects of a misdeal is simpler and avoids future disputes.
       - **Precedent**: Once decided, document it. Future similar cases will then have a determinate rule.
     - **Reframe the Argument**: Acknowledge that both interpretations were *compatible* with past play, but neither was "objectively correct." The debate is about which rule better serves the game *going forward*.

  ### Conclusion: The Epistemology of Play
  Your group didn’t "have a rule" for this scenario—you had a *gap* in the rule that was masked by a decade of uncontroversial play. The frustration stems from realizing that shared understanding can be robust in practice yet fragile in principle. **There is no fact of the matter about what the rule 'was'**, only a history of agreement that never encountered this fork in the road. Voting isn’t a surrender—it’s the only coherent way to settle indeterminacy in social practices. The beauty of games like yours is that players are both subjects and legislators of the rules. Embrace this: your argument isn’t a failure, but proof that your game is complex enough to generate genuine philosophical weight. Resolve it democratically, document it, and let the next decade of play begin with clearer foundations.
