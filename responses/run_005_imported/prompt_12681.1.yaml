  I should also consider the social dimension. The argument isn't just about rules; it's about trust and shared history. The user's frustration is palpable—decades of play undermined by one unresolved conflict. The emotional weight matters here. The resolution needs to preserve group cohesion, hence the suggestion to vote but frame it as new legislation.

  The deeper need here might be ontological security. The user wants to know if their past games had a solid foundation or were always contingent. Acknowledging the indeterminacy might unsettle but also liberate—they're free to define it now. Emphasizing that this is normal in unwritten systems could reassure them.

