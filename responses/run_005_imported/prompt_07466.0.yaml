  I host a philosophy podcast, and this episode is an imagined interview with Kierkegaard on his diagnosis of "the public" and the press in the 1846 essay usually excerpted in English as "The Present Age." Draft eight to ten questions that go beyond having him restate the diagnosis of leveling: I want at least one question on how a merely negative, abstract entity like "the public" can exert real power over individuals who never assemble or take responsibility for its verdicts, one that presses him on whether his own prolific pseudonymous authorship and his provoked quarrel with the satirical paper the Corsair sit uneasily with his critique of publicity, and one on his claim that leveling can be at once the ruin of the age and a providential stage on the way to genuine religious selfhood. For each question, add a follow-up keyed to the reply he's most likely to give.
