answer: |-
  Based strictly on Locke's premises in the *Second Treatise*, he **would not endorse extending the franchise to long-term non-citizen residents**, and his tacit/express consent distinction provides his **principled grounds for excluding them**. However, this case **does expose a significant tension** within his theory of political obligation, particularly concerning the relationship between obligation, consent, and representation.

  Here's the reasoning, step-by-step, from Locke's own arguments:

  1.  **The Fundamental Role of Consent:** Locke's entire theory rests on the premise that legitimate government authority derives solely from the consent of the governed. Without consent, no political obligation exists (*ST* §95, §119).

  2.  **Express Consent Creates Full Membership:** Express consent is a deliberate, explicit act (like taking an oath of allegiance or explicitly joining a society) that makes an individual a "perfect," "perpetual," and "inalienable" member of the political society (*ST* §119, §121). This membership entails:
      *   **Subjection to the majority:** Agreeing to be bound by the decisions of the community.
      *   **The right to participate:** The correlative right to participate in making those decisions (i.e., voting, holding office, having a say in the legislative power).

  3.  **Tacit Consent Creates Obligation, Not Membership:** Tacit consent is implied by actions like:
      *   Possessing or inheriting land within the territory (*ST* §120).
      *   Merely travelling freely on the highways (*ST* §119).
      *   Residing within the territory (*ST* §119).
      *   Enjoying the protection of the laws and the government's benefits (*ST* §119).
      Tacit consent creates a *political obligation* to obey the laws and submit to the government's authority for as long as one enjoys the benefits (*ST* §119). Crucially, Locke states:
      *   It makes one "subject to the Laws of that Government" (*ST* §119).
      *   It is **NOT** express consent (*ST* §119).
      *   The obligation ends when the person "removes his Person and Effects" from the territory (*ST* §121). It is temporary and conditional.
      *   **It does NOT make one a member of the society:** "Nothing can make any Man so [a member of the society], but his actually entering into it by positive Engagement, and express Promise and Compact. This is that, which I think, concerning the beginning of Political Societies, and that Consent which makes any one a Member of any Commonwealth" (*ST* §122 - emphasis added).

  4.  **The Franchise Belongs Only to Members:** The right to vote (the franchise) is an integral part of being a full member of the political society. It is the mechanism by which members exercise their share of the legislative power (*ST* §87, §94) and consent to the laws that bind them. Locke consistently links the right to participate directly to express consent and full membership.

  **Applying this to Long-Term Non-Citizen Residents:**

  *   Such residents clearly give **tacit consent** by residing permanently, holding property, enjoying protection, and using infrastructure (like roads). This binds them to obey the laws.
  *   However, by Locke's explicit definition, they are **not members of the society** because they have not given express consent. Locke draws a bright line here: residency ≠ membership.
  *   Therefore, they **lack the franchise**, as that right belongs *only* to full members who have given express consent. Granting them the vote would, in Locke's terms, conflate tacit consent with express consent and undermine the fundamental distinction upon which his theory of membership rests.

  **The Exposed Tension:**

  This case reveals a profound tension within Locke's theory:

  1.  **Obligation without Representation:** Locke's tacit consenters are politically obligated to obey the laws, pay taxes (as part of enjoying protection and property), and submit to the government's authority. Yet, they have no formal say in making those laws or choosing those who govern. This looks remarkably like "taxation without representation," a principle Locke himself implicitly condemned when discussing tyranny (*ST* §138, §222). How can individuals be bound by laws to which they have not consented, even tacitly, *through a representative system*? Tacit consent justifies obedience to existing laws but doesn't address consent *to the lawmaking process itself* for permanent residents.
  2.  **The Problem of Permanence:** Locke envisions tacit consent as temporary – the obligation lasts only as long as the person is present and enjoying the benefits. However, long-term, permanent residents are effectively *permanently* obligated without ever becoming members. Locke doesn't adequately address this category. His theory seems geared towards transient individuals (travellers, temporary workers) or perhaps children of aliens who haven't chosen citizenship. Permanent residents who never naturalize (give express consent) fall into a theoretical gap. They are permanently governed but permanently excluded from the constitutive act of the society.
  3.  **The Source of Legislative Authority:** Locke argues the legislative power is derived from the consent of the people (*ST* §134). But who are "the people"? If only express consenters, then tacit consenters are governed by a legislative power to which they never consented *as members*, even though they are permanently subject to its dictates. This raises questions about the legitimacy of applying laws to a distinct class of permanent non-members who have no voice in the legislative process.

  **Conclusion:**

  Strictly applying Locke's own premises, he **would reject** extending the franchise to long-term non-citizen residents. His rigid distinction between tacit consent (obligation without membership) and express consent (full membership with franchise) provides his clear, principled justification for their exclusion. Tacit consent binds them to obedience; only express consent would entitle them to vote.

  However, the case of long-term residents **exposes a genuine tension** within Locke's theory. It highlights the potential for a class of permanently governed individuals who are obligated to obey laws, contribute to the commonwealth (through taxes and participation in the economy), yet are systematically excluded from the political community and the consent mechanism for the laws they must follow. This challenges the coherence of consent as the *sole* foundation for political obligation in a context Locke didn't fully anticipate, revealing a potential gap where tacit consent creates a state of permanent political subjection without the correlative political agency Locke associates with membership derived from express consent. It suggests that Locke's theory struggles to account for the legitimacy of governing permanent non-members who are deeply embedded in the society but lack the formal status of membership.
