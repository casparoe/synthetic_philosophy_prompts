  Regarding disciplinary sorting: the user notices arithmetic/logic aren't mentioned. That's astute. Hobbes likely sees them as parasitic on geometry (arithmetic as computation with constructed units) or definitional (logic). As for geometry/commonwealth pairing: both are products of willed human assembly - points/lines or citizens/covenants - making their causal chains transparent by design. The contingency of actual commonwealths doesn't undermine this; Hobbes cares about the ideal generative principles.

