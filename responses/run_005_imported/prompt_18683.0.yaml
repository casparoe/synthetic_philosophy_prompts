answer: |-
  Based on Russell's arguments in *Marriage and Morals* and his broader philosophical stance, this is a genuinely complex question with strong evidence pulling in *both* directions. Your intuition about the tension within his own reasoning is spot-on. Here's a breakdown of the arguments for each side and where the core tension lies:

  **Arguments Suggesting Russell Might Approve of Modern Polyamory:**

  1.  **Radical Critique of Jealousy & Possessiveness:** This is your friend's strongest point. Russell explicitly argues:
      *   Jealousy is primarily a socially constructed emotion, stemming from the historical view of women as property and the desire for certainty of paternity to ensure inheritance.
      *   It is not an inevitable, biological imperative. He believed it could be diminished through education and social change.
      *   Modern polyamory's emphasis on communication, compersion (finding joy in a partner's other relationships), and challenging possessiveness directly aligns with this critique. Russell would likely see conscious efforts to manage jealousy through openness and negotiation as *progress* beyond the hypocritical secrecy of affairs.
  2.  **Advocacy for Sexual Freedom & Experimentation:** Russell championed:
      *   Freedom from repressive Victorian morality.
      *   The legitimacy of sexual pleasure outside strict procreation.
      *   The importance of individual happiness and fulfillment in relationships.
      *   Open polyamory, as a consensual adult relationship structure, fits squarely within this ethos of personal liberty and challenging traditional norms.
  3.  **Companionate Marriage as a Step:** His support for Lindsey's "companionate marriage" (marriage focused on mutual affection and companionship, with easy dissolution *before* children) shows he wasn't wedded to lifelong monogamy as the *only* model. He saw it as a pragmatic step towards greater freedom. Modern polyamory could be seen as the next logical evolution – maintaining companionship and family stability while explicitly acknowledging non-exclusivity.
  4.  **Transparency Over Secrecy:** While he tolerated discreet affairs for stability, he likely viewed the secrecy and potential for discovery inherent in affairs as corrosive. Open polyamory, by removing secrecy, eliminates this specific risk factor for family disruption that he was concerned about. Honesty, in principle, aligns with his rationalist ideals.

  **Arguments Suggesting Russell Would Be Wary of Modern Polyamory (Especially with Children):**

  1.  **The Primacy of Child Welfare & Stability:** This is your strongest point and the core of the counter-argument. Russell is unequivocal:
      *   Once children exist, the stability of the parental environment becomes paramount for their psychological well-being.
      *   He emphasizes the need for a **small, consistent number of parent-figures**. He feared confusion and instability arising from multiple, potentially competing, adult authorities and attachments in a child's life.
      *   He explicitly warns against arrangements where parental figures are constantly changing or numerous. The concept of a "polycule" with multiple co-parents actively involved in daily care and discipline likely falls squarely into the category he viewed as potentially detrimental due to its complexity and potential for shifting dynamics.
  2.  **Minimizing Disruption:** His allowance for discreet affairs is predicated on the **absolute requirement** that they do *not* disrupt the primary family unit or the child's sense of security. He saw the monogamous family structure (even if imperfectly practiced) as the most reliable vessel for providing this stability.
      *   He would likely question whether *any* complex multi-adult relationship structure, no matter how open and communicative, could *guarantee* the level of consistency and freedom from interpersonal conflict or shifting alliances that he believed children needed. The potential for drama, jealousy flare-ups (despite efforts), or relationship reconfigurations within the polycule poses a risk to stability he might deem unacceptable.
  3.  **Practical Conservatism Regarding Children:** While radical on adult sexuality, Russell exhibited a strong pragmatic conservatism when it came to child-rearing. He prioritized minimizing known risks to children over theoretical adult freedoms. The nuclear family, for all its faults, was a known quantity regarding stability. The multi-parent polycule model was untested and, in his view (based on early 20th-century psychology), inherently riskier psychologically for the child.
  4.  **Focus on the Parental *Unit*, Not Just Individuals:** Russell's stability argument centers on the *household unit* providing a consistent environment. Introducing multiple additional parental figures, even openly, inherently changes the structure and dynamic of that unit. He might argue that this complexity itself undermines the "small, consistent number" principle, regardless of good intentions.

  **The Core Tension in Russell's Reasoning:**

  The fundamental tension lies in balancing two core principles:

  1.  **The Liberation Principle:** Adults should be free from repressive sexual morality, possessiveness (jealousy), and constraints that cause unhappiness. Social conditioning *can* and *should* be overcome to achieve greater individual fulfillment.
  2.  **The Stability Principle:** The psychological well-being of children is paramount and requires a stable, secure environment provided by a small, consistent number of primary caregivers. Complex adult relationship structures inherently risk undermining this stability.

  **Conclusion: Wary Endorsement in Theory, Profound Skepticism in Practice (Especially with Kids)**

  *   **On Adult Polyamory (No Kids):** Russell would likely be **intellectually sympathetic and approving in principle**. The critique of jealousy, emphasis on honesty, and pursuit of individual fulfillment align strongly with his views. He might see it as a valid experiment in overcoming possessiveness.
  *   **On Polyamory Involving Co-Parenting/Polycules:** Here, the **Stability Principle overwhelmingly dominates**. Based *specifically* on the arguments he makes in *Marriage and Morals*:
      *   He would be **deeply skeptical and likely opposed** to the "polycule" model of multiple adults jointly raising children as primary caregivers.
      *   His insistence on a "small number" of consistent parent-figures and his view that complex arrangements cause psychological confusion for children directly contradict this model.
      *   He would question its ability to provide the absolute stability he deemed non-negotiable for child welfare. The potential for disruption, even with the best intentions and communication, would likely strike him as too high a risk.
      *   While he might tolerate discreet affairs *if* stability was maintained, an *openly* complex structure with multiple parental figures would violate his core requirement for minimizing variables around the child.

  **Therefore, your position is more strongly supported by Russell's *specific arguments about children*.** While your friend is right that Russell's critique of jealousy *logically opens the door* to polyamory for adults, Russell himself erected a significant barrier at the point where children are involved, prioritizing their need for a simple, stable parental structure above adult desires for complex relational freedom. He would likely view modern polyamorous co-parenting as an interesting but risky experiment that potentially sacrifices child stability on the altar of adult liberation – a trade-off he explicitly rejected. The tension isn't easily resolved within his framework; the Stability Principle acts as a powerful constraint on the full implications of the Liberation Principle when children enter the picture.
