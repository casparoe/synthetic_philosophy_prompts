answer: |-
  Here’s a draft that threads the needle: grounded in philosophy but emotionally resonant, with a clear stance and that "nudge moment" for the academics. Aim for **~4.5 minutes** spoken slowly with pauses.

  ---

  **(Raise glass, smile warmly at the couple, then scan the room)**

  "Hi everyone. For those who don’t know me, I’m [Your Name], and I’ve had the ridiculous privilege of knowing [Bride] since we were [College Memory - e.g., "18-year-olds arguing over cafeteria pizza"]. Today, looking at her and [Groom], I’m struck by how far we’ve come… and also by how much *this moment* right here, this promise they’re about to make, would have fascinated that 18-year-old version of her. Because while most of us see a wedding vow as the ultimate expression of love and commitment – which it absolutely is! – [Bride] spent years asking a much more specific question: **What *is* this thing we do when we promise?** Why do those words actually *bind* us?"

  **(Pause, smile slightly at the academics)**

  "Now, I promise I won’t subject you all to a lecture – [Bride]’s already done that, brilliantly, for a few hundred pages! But indulge me for just a minute. [Bride] once explained something that stuck with me: **Imagine you make a promise, and then circumstances change so that *no one will ever know* if you kept it or broke it.** Not the person you promised, not anyone. The outcome is the same either way. Logically, why *should* you still feel bound? If it’s just about avoiding disappointing someone, or avoiding social shame… well, in that scenario, those things vanish."

  **(Lean in slightly, more conversational)**

  "So what’s left? What’s the glue? After listening to [Bride] dissect theories over… let’s just say *several* conference coffees… here’s the answer I’m throwing my weight behind today, for them: **A promise isn’t primarily about the *other person’s expectations*; it’s about *who you become* when you say those words out loud.**"

  **(Make eye contact with the couple)**

  "When [Bride] says, '[Groom], I promise...' and when [Groom] says, '[Bride], I promise...', they aren't just predicting their future feelings or actions. They are *actively shaping themselves*. They are standing before us all – and crucially, before *each other* – and declaring: **'This is the person I choose to be for you. This is the standard I hold myself to.'** The obligation comes from that act of self-definition. It’s internal. It’s about integrity to the person *you* decided to be in that moment of commitment."

  **(Gesture subtly towards the academic section - the "nudge moment")**

  "And *that’s* why it binds, even if no one ever knows. Because breaking it wouldn’t just disappoint someone else; it would fracture something fundamental about the self you declared you would be. *That’s* the unbreakable core." *(Academics will recognize this as leaning hard into a Scanlon-esque contractualism/internal reasons view, or a Kantian self-legislation angle – the nudge happens here. Others just hear a profound take on integrity.)*

  **(Shift fully to the couple, warm and personal)**

  "So, [Bride] and [Groom], when you stand up here and make those promises today, I see you doing something incredibly brave and beautiful. You’re not just pledging love – though there’s oceans of that here. You’re not just hoping for the best. **You are defining yourselves, together.** You’re saying, 'This is who I *will* be for us. This is the partner I commit to becoming.' And seeing the way you’ve built your relationship – through [mention a specific, genuine strength: e.g., "endless patience", "uproarious laughter", "quiet support during tough times"] – I have absolutely zero doubt about the strength and beauty of the people you are choosing to become for each other."

  **(Raise glass higher, voice filled with warmth)**

  "So let’s raise our glasses. To [Bride] and [Groom]. Not just to their love, which is obvious. Not just to their happiness, which we all wish for. But **to their courage in making these promises – in defining themselves so clearly, so beautifully, for each other.** To the incredible people they already are, and to the even more incredible partners they have committed to becoming. May that promise, that self-definition, guide them, strengthen them, and fill their lives with joy. To [Bride] and [Groom]!"

  **(Clink glass, big smile)**

  ---

  **Why this works:**

  1.  **Commits to a Clear Answer:** It explicitly endorses the "self-definition/integrity" view of promising (drawing from Scanlon/Kant), avoiding vague hedging. This satisfies the request for a real answer.
  2.  **Uses the "Unobserved Promise" Hook:** It directly incorporates the key insight the user remembered, making it relevant and showing genuine engagement with the bride's work.
  3.  **The "Nudge Moment":** The lines "And *that’s* why it binds, even if no one ever knows. Because breaking it wouldn’t just disappoint someone else; it would fracture something fundamental about the self you declared you would be." are pure catnip to the philosophy crowd. They'll instantly recognize the specific theoretical weight of "fracture the self you declared" (Scanlon's "justifiability to others" via self-imposed principles, or Kantian autonomy). To everyone else, it sounds like a deep and moving statement about personal integrity.
  4.  **Applies to Marriage:** It directly links the philosophical concept to the act of making wedding vows – framing it as an act of courageous self-definition and commitment to becoming a certain kind of partner.
  5.  **Balances Depth & Warmth:** Starts and ends with deep personal warmth and specific (if brief) references to the couple. The philosophy serves the *celebration* of their relationship, not the other way around.
  6.  **Accessible:** Explains the core idea ("why bind when no one knows?") clearly without jargon. The application to marriage is straightforward and emotionally resonant.
  7.  **Structure:** Classic toast structure (Intro -> Hook -> Insight/Philosophy -> Application to Couple -> Well Wishes -> Toast) keeps it focused and flowing.
  8.  **Length:** This draft, spoken with natural pauses and warmth, should land right around 4-5 minutes.

  **Delivery Tips:**

  *   **Practice:** Read it aloud several times to get the pacing right. The philosophical section needs clarity and slight weight, but not a lecturing tone.
  *   **Pauses:** Pause briefly after the "nudge moment" lines. Let the academics have their quiet "aha!" while the sentiment sinks in for others.
  *   **Eye Contact:** Shift naturally between the couple, the academics (especially during the key theory part), and the wider audience.
  *   **Tone:** Sincere, warm, slightly conversational during the philosophy part ("indulge me," "stuck with me"), building to heartfelt during the application and toast.
  *   **Personalize:** Fill in the bracketed sections ([Your Name], [Bride], [Groom], [College Memory], [specific strength]) with genuine details. This is crucial!

  This toast honors your friend's intellect, engages her peers meaningfully, and ultimately delivers a heartfelt, unique, and memorable tribute to her and her partner's commitment. Break a leg!
