  ok so I deleted Hinge again last night, which is maybe the sixth time this year. In the moment I was 100% sure I meant it this time, like genuinely done, no more apps ever. But I was JUST as sure the last five times too, right before I redownloaded it a few weeks later feeling equally convinced that actually, it's fine, this time is different. My friend pointed out that I can't really explain why being totally sincere about quitting doesnt seem to predict whether I actually stay quit, and now it's kind of bugging me. Is there an actual reason sincerity doesn't work like that, or am I just bad at keeping promises to myself?
