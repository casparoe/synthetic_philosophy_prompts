  *Pauses to consider real-world implications* In practical terms, the 7am departure doesn't actually deprive anyone of the trip - just shortens it slightly. Whereas 5am actively excludes a disabled peer. The "two extra hours" framing is misleading; it's bonus enjoyment versus basic access. 

