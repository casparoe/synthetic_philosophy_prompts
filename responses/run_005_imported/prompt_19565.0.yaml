  ok so for my dual-enrollment intro to philosophy class (it's through the community college but i take it at my actual high school, counts as my humanities credit) we just finished reading Plato's Meno and i'm stuck on this part near the very end. right before it, socrates gets meno to agree that a guy who actually knows the road to larissa and some other guy who's never been but happens to have a correct guess about which road it is would BOTH lead a traveler there just fine — so right opinion works just as good as knowledge in that specific case. then it goes into this statue thing that i don't really follow:

  "SOCRATES: You have heard of the wandering statues of Daedalus, kept in the temple, which will run away if they are not fastened, but if fastened, stay where they are?
