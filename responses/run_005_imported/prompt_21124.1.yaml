  The key here is the independence of evidence. His plants dying is direct evidence. Her plants surviving is circumstantial. To prove his black thumb, they'd need more instances of his plants dying, especially if he cares for new ones. Alternatively, if he takes care of one of her plants and it dies, that's direct evidence. 

