answer: |-
  ## The Unavoidable Circle: Defending Enduring Subjection as the Demos Boundary

  The boundary problem is democracy’s original sin: the foundational act of defining the *demos* cannot itself be democratic without vicious circularity. While Robert Goodin’s "all-affected interests" principle offers intuitive moral breadth and Arash Abizadeh’s "all-subjected-to-law" view (drawing on democratic coercion theory) provides crucial institutional traction, neither escapes the specter of over-inclusion – enfranchising tourists and children. However, when rigorously refined and defended, the **All-Subjected Principle (ASP), specifically focused on *enduring subjection to the sovereign's enforceable legal order*, emerges as the most normatively coherent and institutionally viable foundation for defining the demos**, despite requiring pragmatic qualifications for transients and minors. The circularity is not eliminated, but it is constrained and rendered less arbitrary by the concrete reality of shared coercive authority.

  **Goodin's All-Affected Principle: Moral Appeal, Practical Paralysis**
  Goodin’s principle – that anyone whose interests are affected by a decision should have a say in making it – resonates deeply with democratic ideals of inclusion and fairness. It captures the intuition that decisions imposing costs or granting benefits should involve those bearing the consequences. However, its fatal flaw lies in its **boundless indeterminacy and operational impossibility**:
  1.  **Infinite Regress of Effects:** Every decision creates ripple effects. A zoning law in Berlin affects global housing markets; climate policy in China affects the entire planet. Strict application demands global enfranchisement for nearly every decision, dissolving distinct political communities and making collective action impractical. Goodin proposes "constitutive rules" to limit this, but *who sets these rules?* We return to the boundary problem at a meta-level.
  2.  **Epistemic Intractability:** Predicting and measuring the precise effects of complex policies on every potential individual across the globe is impossible. Determining *whose* interests are sufficiently "affected" becomes an arbitrary bureaucratic or judicial nightmare, vulnerable to manipulation.
  3.  **The Tourist/Child Problem:** A tourist’s interests *are* affected by local traffic laws, sales taxes, and public safety measures. A child’s interests are profoundly affected by education, healthcare, and inheritance laws. Strict adherence demands their enfranchisement, collapsing the demos into a transient, non-agentic mass incapable of coherent self-government.

  **Abizadeh's All-Subjected Principle: Coercion and Institutional Anchoring**
  Abizadeh, focusing on the coercive nature of law, argues that the legitimacy of state power requires that *all those subject to its coercive enforcement* must have a say in its authorization. This grounds the demos in a tangible, institutional reality:
  1.  **Addressing Coercive Legitimacy:** Laws are ultimately backed by force. Subjecting individuals to this force without their collective authorization (via membership in the demos) is democratically illegitimate. This directly tackles the core justification for democratic inclusion.
  2.  **Clearer Institutional Boundary:** Subjection to law provides a more objective criterion than "affected interests." It focuses on the polity's *de facto* exercise of sovereign authority over individuals within its jurisdiction. This offers a concrete basis for defining membership: presence within the territory where the state enforces its rules (e.g., citizens, permanent residents).
  3.  **Handling Borders (The Abizadeh Move):** Crucially, ASP challenges the presumed legitimacy of unilateral border control. If border enforcement is coercive (preventing entry/exit through force or its threat), then those subjected to this coercion (potential immigrants) must have a say in the laws authorizing it. The demos cannot be presupposed as bounded *before* the democratic authorization of the coercion that creates the boundary. This powerfully exposes the circularity inherent in closed-border democracies.

  **The Lingering Specter: Tourists and Children under ASP**
  ASP is not immune to the over-inclusion objection:
  1.  **Tourists:** A tourist visiting Paris *is* subjected to French law – they must obey traffic laws, pay VAT, and are liable under criminal law. A strict ASP seems to demand their enfranchisement in French elections during their stay.
  2.  **Children:** Minors are undeniably subject to the law. They face legal consequences (juvenile detention, mandatory schooling laws, parental rights governed by law). A pure ASP appears to enfranchise infants.

  **Defining Enduring Subjection: The Solution Within ASP**
  The solution lies not in abandoning ASP, but in refining it to focus on **Enduring Subjection to the Sovereign's Enforceable Legal Order**:
  1.  **Enduring vs. Transient:** Subjection must be non-transitory, reflecting a stable relationship to the sovereign power. Tourists experience *temporary* subjection incidental to their primary affiliation elsewhere. Their core life chances, identity, and long-term legal status are governed by *another* sovereign. Enfranchising them undermines the *demos* as a community of shared fate bound by a *common, persistent* legal framework. Subjection must imply integration into the ongoing project of collective self-government under that specific legal order.
  2.  **Capacity for Political Agency (Applied Pragmatically):** While children are subject to law, they lack the developed capacity for the autonomous political judgment and agency required for meaningful participation in collective self-authorship. This isn't a denial of their subjecthood, but a recognition that democratic mechanisms are designed for competent adults. Guardianship (parents voting *on behalf* of the family unit's interests, including children) is a necessary pragmatic representation within the system, acknowledging their subjection while managing functional requirements. Their *future* full membership is anticipated, but current enfranchisement is impractical and conceptually misaligned with the purpose of voting as an act of authorship.
  3.  **Sovereign Enforceable Order:** This emphasizes the *source* of the subjection – the specific polity claiming and exercising the monopoly on legitimate coercion within a defined jurisdiction. It anchors the demos to a concrete political entity capable of making and enforcing binding decisions.

  **Why Enduring Subjection Trumps All-Affected and Pure Subjection**
  1.  **Manages Circularity:** While the initial boundary is still presupposed (e.g., territorial jurisdiction), it ties membership directly to the *core function* of the polity – the exercise of sovereign legal authority. This is less arbitrary than "affected interests" and avoids the infinite regress. The circle is drawn around the *practice* of governing through enforceable law. Abizadeh's border coercion argument strengthens this: the demos defining the territory must include those subjected to the coercion *defining* that territory.
  2.  **Feasibility:** It provides a workable basis for electoral rolls (residency/citizenship) and aligns with existing intuitions about political community without collapsing into globalism or impracticality. It accepts that democracy operates within bounded states, but demands that the boundary itself be democratically justifiable to those it coerces.
  3.  **Normative Core:** It directly addresses the primary source of democratic legitimation concern: the imposition of binding, coercive rules. Being subject to the state's ultimate force creates the strongest claim to a voice in its authorization. While "affected interests" matter, they are secondary to the fundamental relationship of being governed by force. Protecting affected outsiders is best handled through international law, diplomacy, and rights frameworks, not by dissolving the demos.
  4.  **Handles Tourists/Children:** Enduring subjection excludes tourists based on temporality and primary affiliation. Children are excluded based on a pragmatic, capacity-based qualification inherent to the *functional requirements* of a deliberative demos, while acknowledging their subjection through representation and future inclusion. This is a justifiable limitation within the principle, not an abandonment of it.

  **Conclusion: Embracing the Constrained Circle**
  The boundary problem admits no perfectly non-circular solution. However, the principle of **Enduring Subjection to the Sovereign's Enforceable Legal Order** provides the most robust foundation for the *demos*. It anchors membership in the concrete reality of shared coercive governance – the very thing requiring democratic justification (Abizadeh's crucial insight) – while offering a defensible, operational boundary that avoids the infinite regress of "affected interests" (Goodin's fatal flaw). The inclusion of tourists and children under a pure reading is resolved by emphasizing the *enduring* nature of the political relationship required for collective self-authorship and the pragmatic necessity of agency for voting. The circularity remains, but it is constrained by the tangible fact of subjection to a specific, ongoing coercive order. This makes the boundary less arbitrary, more responsive to the core legitimation challenge of state power, and institutionally viable. We enter the circle not by moral fiat or impossible globalism, but by recognizing the shared experience of being bound, persistently and enforceably, by the same sovereign will – it is within that shared subjection that the democratic project of *becoming* the author of that will must begin.
