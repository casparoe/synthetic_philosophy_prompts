prompt: |-
  I sit on the calibration panel that reviews "corrective action" writeups after incidents at my company -- supposedly blameless postmortems, except the writeup still follows you into calibration. Two cases this cycle are bugging me. Engineer A pushed a database migration on a friday without running it through our staging replay tool first -- against policy, though half the org skips that step with zero consequences -- and it happened to hit a gnarly edge case, taking down checkout for six hours. Engineer B did the exact same thing the same week, skipped the same step, but their migration didn't touch anything broken, so nobody even noticed til this review. Honestly, swap the deploy order and we'd probably be writing up the other one instead. Half the panel wants to write up A and let B off with a verbal reminder, "no harm no foul"; the other half says that's nuts since the only difference was luck. Can you draft the memo I'll bring to next weeks calibration meeting -- a real recommendation, not "both sides have a point," with reasoning solid enough that whichever engineer loses out can see it wasn't arbitrary?
