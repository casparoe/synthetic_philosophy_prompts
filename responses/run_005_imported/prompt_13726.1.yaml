  Looking at the inheritance situation, the cousin provided care for five years while siblings didn't. The uncle explicitly rewarded her in the will. Jill advised keeping the money as per the will. The user didn't ask for Jill's reasoning, just the verdict. Now they wonder if that was appropriate.

  I should consider why moral decisions might feel different. Factual decisions, like hiring a contractor, rely on expertise and objective criteria. Moral decisions involve personal values, ethics, and emotional weight. Even if Jill is level-headed, the user might feel they should engage more deeply with moral choices because they reflect personal identity and responsibility.

  The user's action—delegating without seeking reasoning—might be key. In factual decisions, trusting the expert's conclusion suffices. But for moral issues, understanding the rationale is part of the process. It's not just about the outcome but how you arrive at it, which shapes your own moral framework.

