answer: |-
  To bridge the gap between classical logic's non-constructive principles (like double-negation elimination) and the operational behavior of control operators like `call/cc`, let's walk through an intuitive analogy. Imagine you're solving a puzzle, and classical logic corresponds to a "strategy" that allows backtracking or overriding previous decisions—a computational "undo button." The key insight is that **classical proofs can retroactively correct themselves** when they encounter contradictions, and control operators mechanize this by manipulating the program's control flow.

  ### 1. **The Non-Constructive Core of Classical Logic**
     - **Intuitionistic view**: A proof of `P` must explicitly construct a witness for `P`. If you prove `¬¬P` ("it's absurd that `P` is false"), you still lack a concrete `P`—you only know that assuming `¬P` leads to absurdity.
     - **Classical view**: `¬¬P` *entitles you to `P`* without constructing it. How? By exploiting the fact that *if `P` were false, you'd get a contradiction*—so `P` must be "out there" implicitly. But this doesn't specify *how* to find `P`.

  Operationally, this resembles a program that says:  
  > *"I don't know `P` yet, but if I temporarily assume `¬P` and hit a dead end, I'll escape back to an earlier point and declare `P` true—using the contradiction as a signal to backtrack."*

  ### 2. **Control Operators as the "Undo Button"**
     - `call/cc` (call-with-current-continuation) reifies the program's **future computation** into a function (a continuation `k`). Calling `k` "rewinds" execution to the point where `call/cc` was called, replacing its result with a new value.
     - **Why this fits classical logic**:  
       - `¬¬P` is a function `f : (P → ⊥) → ⊥` ("given any proof that `P` implies absurdity, I can derive absurdity").  
       - To turn this into `P`, you need to extract a value from `f`'s behavior. But `f` only produces `⊥`—a dead end.  
       - Solution: **Trick `f` into revealing `P` by giving it an "emergency escape"**—a continuation that, if called, jumps back in time with a `P`.

  ### 3. **Operational Intuition: Trapping the Contradiction**
     Consider implementing double-negation elimination:  
     ```haskell
     dne :: ((P -> ⊥) -> ⊥) -> P
     dne f = callCC (\k -> ...)
     ```
     - `callCC` captures the **current continuation `k`** (the rest of the program expecting a `P`).  
     - `k` has type `P -> ⊥` *from `f`'s perspective* because if `f` calls `k` with a value `x : P`, the program jumps back, aborts the current path, and returns `x` as the result of `dne`—never returning to `f`.  
     - You pass `k` to `f`: `f k`.  
       - **If `f` calls `k`** (e.g., `k x`):  
         - The call to `k` instantly "rewinds" to the `callCC` call.  
         - `dne` immediately returns `x`, ignoring the rest of `f`.  
         - *Operationally*: `f` is interrupted mid-execution.  
       - **If `f` never calls `k`**:  
         - `f` must produce `⊥` (absurdity), which is impossible—so it *must* call `k` to yield a value.  

     This forces `f` to **supply a `P`** to the escape hatch `k` when it realizes it can't complete. The continuation `k` acts as:  
     > *"Here’s a function that, if you call it with a `P`, will immediately resolve the whole computation to that `P`. Use it when you hit absurdity."*

  ### 4. **Why Not Other Effects?**
     - **Exceptions**: Throwing an exception aborts computation but doesn't "resume from an earlier state." You can't return to the continuation with a new value.  
     - **State/Mutable Variables**: These track changes over time but don't rewind history.  
     - **Continuations uniquely fit**: They capture and **reinstate past program states**, directly modeling classical logic's ability to "change the past" upon contradiction.  

     Classical reasoning says:  
     > *"If assuming `¬P` leads to absurdity, then `P` holds—and I retroactively **always had a proof of `P`**."*  

     `call/cc` mirrors this: When `f` calls `k`, it *overwrites the future* by supplying a `P` to the past (the continuation point).

  ### 5. **Peirce's Law and the "Big Picture"**
     Peirce's law `((P → Q) → P) → P` is the type of `call/cc` under Curry-Howard. Operationally:  
     - `callCC` takes a function `h : (P → Q) → P`.  
     - It gives `h` a continuation `k : P → Q` (which, if called, aborts `h` and returns a `P`).  
     - `h` must return a `P`, but it can "cheat" by calling `k` with a `P` it fabricates (e.g., via non-constructive reasoning).  

     **Why this had to be**:  
     - Curry-Howard maps proofs to programs. Classical logic's non-constructiveness requires "computational time travel" to resolve contradictions.  
     - Continuations are the *only* control primitive that can **save and restore arbitrary program states**, making them the inevitable computational counterpart.

  ### Summary
  Classical logic's `¬¬P → P` asserts: *"If `P` can't be false, it must be true—and I don't need to know how."* Computationally, `call/cc` realizes this by:  
  1. Capturing the current continuation (a snapshot of the "future work").  
  2. Passing it as an escape function to the proof of `¬¬P`.  
  3. Forcing that proof to **use the escape to supply `P`** when it hits a contradiction—rewinding execution and installing `P` as the answer.  

  This isn't an accident; it's because classical proofs *procedurally correspond* to programs that backtrack, and continuations are the universal tool for backtracking. The "why" clicks when you see that manipulating the call stack is *exactly* how a runtime system would simulate retroactive correction—the essence of non-constructive reasoning.  

  For deep dives:  
  - Griffin's paper tying `call/cc` to Peirce's law.  
  - The **λμ-calculus** (Parigot) for first-class continuations as classical proofs.  
  - **Filinski’s symmetric λ-calculus** for classical logic with control operators.
