  Armstrong's response involves uninstantiated universals. He allows for "alien" universals not instantiated in our world, but only if they're possible. But in this case, F and G are instantiated (once), so they exist. The problem is the necessitation relation's status. Armstrong might argue that the causal power comes from the relation, not the instance. But with only one instance, it's hard to distinguish from a fluke.

