prompt: |-
  So I've been down a rabbit hole for a piece about the fallout from the whole SBF/FTX saga, specifically how "just take whatever bet has the highest expected value" got treated in parts of that EA-adjacent world almost like a moral trump card, risk-aversion be damned. Somebody pointed me toward risk-weighted expected utility theory as basically the rigorous philosophical version of the "no, actually, hating risk can be fully rational, not just a bias or a kink in your utility curve" pushback, and now I've got 40 minutes booked with a decision theorist who's built a big chunk of her career defending it. I don't want to waste the slot having her re-explain the theory in the abstract, since I can get that much off the SEP already.

  Could you draft me eight to ten interview questions that push past the elevator pitch, with a follow-up for each keyed to whatever answer she's most likely to give? I want at least one question where she has to walk through an actual concrete gamble to show how her theory's "risk function" is doing something different from a garden-variety concave utility-of-money curve, with the follow-up ready for when she reaches for the Rabin calibration-theorem card to explain why old-fashioned diminishing marginal utility can't carry that weight -- and whether the Safra-Segal line about calibration problems not being unique to expected utility really lets her off the hook, or just relocates it. I want one on the classic money-pump objection, that dropping the independence axiom to make room for Allais-style preferences should leave you exploitable across a multi-stage bet, with a follow-up on whether her answer (I think it leans on something called "resolute choice") actually solves that or just stipulates it away. I want one that makes her draw a clean line between "this is a rational attitude toward risk" and "this is literally the same probability-weighting curve Kahneman and Tversky used to describe a bias," because to my readers those are going to look suspiciously like the same math wearing a different lable. And end on a question about whether two people who agree on every probability and every dollar value of every outcome, but who have different risk functions, could rationally make the opposite choice on every single risky decision they'll ever face -- and whether that isn't a little too permissive for a theory that's supposed to tell us who's being irrational.
