  ### Part (b): Rawls (5 points)
  The question has two parts: 
  1. Explain Rawls's distinction between justifying the practice of promising and justifying keeping a particular promise, and why only the first is utilitarian.
  2. Say whether Hume's account is the same.

  **Student's Answer:**
  - Explains Rawls's distinction: the practice is justified by utility, but within the practice, you cannot recalculate utility for each promise because that would undermine reliance.
  - States that this is the same as Hume's convention theory, just in modern terms.

  **Evaluation:**
  The explanation of Rawls's distinction is correct. However, the student oversimplifies the relationship with Hume. While both are conventionalists, Rawls's "practice conception" is more about the rules of the practice being constitutive, and the obligation being internal to the practice. Hume's account is based on convention and sympathy, but Rawls's distinction is more about the two levels of justification (practice vs. individual act). Also, Rawls explicitly contrasts his view with utilitarianism on the individual act level, which the student notes. But the student's claim that Rawls is "just restating Hume" is not entirely accurate. Rawls builds on the conventional idea but adds a distinct structure. 

  **Correction:** Rawls and Hume both see promising as conventional, but Rawls's distinction is about the structure of rules and the idea that the obligation arises from participating in the practice, which is not identical to Hume's account. Hume does not have the same two-level structure that Rawls emphasizes.

  Thus, the first part of (b) is well explained (about 4 points), but the second part (comparison to Hume) is oversimplified and somewhat incorrect (losing about 1 point).

  **Score for (b):** 4/5 (because the distinction is explained well, but the comparison to Hume is not entirely accurate)

  ### Part (c): Scanlon (5 points)
