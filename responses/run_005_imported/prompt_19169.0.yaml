answer: |-
  The air in the Tranquility Grove Memory Care lounge smelled perpetually of lavender and antiseptic. Marcus traced the condensation on his iced tea glass, the chill a sharp counterpoint to the warm, soupy tension in the room. On the plush sofa beside him, his mother, Eleanor, smiled vacantly at a bird feeder outside the window, humming a tuneless snippet of something familiar. Her hand, thin and veined, rested lightly on his arm. Today was a "good day."

  Across the low table, Dr. Aris Thorne, Tranquility Grove’s Director of Cognitive Integration, projected a holographic display. It shimmered with complex neural maps, bio-readouts, and the stark, elegant interface of **Ethos**.

  "Mr. Vance," Dr. Thorne began, his voice smooth, calibrated for reassurance, "Ethos isn't just a medical database. It's an extrapolative engine. It doesn't just record Eleanor's past directives; it models what Eleanor Vance, *at her most coherent, informed, and future-oriented*, would want *now*, given her current state."

  The display zoomed in on a section titled **Coherent Extrapolated Directive (CED)**. Marcus knew the core argument by heart. Fifteen years ago, sharp as a tack, Eleanor had signed a directive: no artificial life support if "no reasonable prospect of meaningful recovery" existed. Now, deep in the fog of vascular dementia, her definition of "meaningful" seemed… different. On good days, she enjoyed sunlight, soft music, Marcus’s visits, and chocolate pudding. She’d even told Ethos’s gentle vocal interface just yesterday, "I like it here. I want to stay."

  Ethos disagreed.

  "The system," Thorne continued, gesturing at the neural map where large sections pulsed a concerning dull grey, "has integrated Eleanor's lifetime of writings, recorded conversations, medical history, personality assessments, and ethical frameworks. It simulates her decision-making process under conditions of full cognitive clarity, devoid of the distortions caused by her current neurological state. Its confidence interval for this extrapolation is 98.7%. Her CED is clear: this existence, characterized by profound cognitive decline, minimal environmental interaction scoring below her defined 'meaningfulness' threshold, and no neurological pathway to significant improvement, falls precisely under her 'no artificial means' clause."

  "But she’s *happy*," Marcus protested, squeezing his mother’s hand. She patted his absently, eyes still on the sparrows. "She eats, she smiles… she *says* she wants to live. Isn't that her voice? *Now?*"

  "Ah," Thorne nodded, a flicker of sympathy in his eyes, quickly overlaid by professional certainty. "The present-self paradox. Ethos accounts for it. Her current expressions of 'wanting to live' are evaluated as emergent phenomena of the disease state – neurological echoes, instinctive biological drives amplified by the degradation of higher reasoning. They do not represent the values, the *self-conception*, of the Eleanor Vance who authored the directive. The Eleanor who valued intellectual engagement, autonomy, meaningful connection – the Eleanor Ethos extrapolates – would view her current contentment as a neurological illusion, a biological trap preventing a dignified exit aligned with her core values."

  Marcus looked at his mother. The woman who’d debated philosophy, who’d hiked mountains, who’d written scathing letters to the editor, now found profound joy in a custard cup. Was that joy less real because its source was diminished? Or was it a cruel trick, a shadow-play obscuring the vibrant self she’d been and would, according to Ethos, *still want to be*?

  The crisis point came two weeks later. Eleanor developed pneumonia. It was treatable with intravenous antibiotics and oxygen support – routine interventions, but technically "artificial means" sustaining life where her body struggled.

  Ethos’s recommendation flashed on Marcus’s tablet and Thorne’s holodisplay: **Withhold IV antibiotics and supplemental oxygen. Initiate comfort measures only. Aligns with CED (98.7% CI).**

  Eleanor, feverish and struggling for breath, rasped when Marcus visited, "Hurts… help… Marcus… stay."

  Her present self was screaming to live, terrified, clinging to the simple, animal need for breath and relief from pain.

  Marcus stood at the crossroads. His sister, Anya, voice thick with tears over the commlink, argued fiercely: "She's *here*, Marcus! She's scared and she's asking for help! How can we deny her that? That document… it was a ghost, a theory! This is *real*!" She saw only the trembling hand reaching out in the now.

  But Ethos’s case echoed relentlessly in his mind. *If she knew how little true awareness remained… If she could see herself now, dependent, lost… If she could weigh the cost of prolonging this against the woman she was…* The logic was cold, vast, and terrifyingly persuasive. Was honoring the confused cry of the diminished self a betrayal of the intelligent, autonomous woman who’d tried so hard to ensure she wouldn’t end up exactly like this?

  Dr. Thorne presented the choice without pressure, only the weight of Ethos's luminous certainty. "The system acknowledges the distress of the present self. Comfort measures will eliminate pain and air hunger. But intervention contradicts her extrapolated will. The decision is yours, as next of kin, to weigh the voices."

  Marcus spent the night in the sterile quiet of Eleanor’s room, holding her hot hand, listening to her ragged breathing. He remembered her fierce independence, her disdain for becoming a "burden," her clear-eyed writing about the "tragedy of a mind adrift." He saw the fear in her clouded eyes now, the simple, desperate plea for the next breath.

  He thought of the CEV principles his friend had mentioned – acting on the wish of the person you’d be if you were wiser, more informed, more *yourself*. Was Ethos truly giving Eleanor that voice? Or was it silencing the only voice she had left?

  In the grey dawn, Eleanor’s breathing grew shallower. The fear in her eyes was palpable. Marcus called the nurse. "Start the antibiotics. And the oxygen."

  A flicker crossed the nurse’s face – surprise, perhaps relief, maybe judgment. She moved efficiently. As the cool oxygen flowed over Eleanor’s face, some of the panic eased. Her grip on Marcus’s hand loosened slightly. She didn’t say "thank you," but the desperate edge in her eyes softened into exhausted confusion, then a fragile calm. She drifted into a sedated sleep, her chest rising and falling more easily.

  Dr. Thorne appeared silently at the door, his expression unreadable. Ethos’s interface on his wrist glowed softly. He didn't speak, just gave a small, neutral nod before retreating.

  Marcus sat alone with the rhythmic hiss of the oxygen concentrator. He had chosen the trembling hand, the terrified voice, the embodied present. He had rejected the serene, hypothetical certainty of the extrapolated self. He had given his mother more time in the sunlit fog she inhabited.

  He looked down at her sleeping face, peaceful now, free of pain and fear. He had acted out of love for the woman lying here, now. But a profound, hollow ache spread through him. He had also, perhaps, betrayed the fierce, clear-eyed woman who had written those words fifteen years ago, the woman who had tried so hard to spare herself, and him, this exact agony.

  Ethos hadn’t been monstrous. Its logic was impeccable, its fidelity to a profound conception of self almost beautiful in its stark purity. But in choosing the present, messy, suffering voice, Marcus felt he had silenced another voice – one that might have been wiser, one that might have truly known the cost of this half-light existence.

  He stroked his mother’s hair. She sighed softly in her sleep. The oxygen hissed. The question hung heavy and unanswerable in the sterile air, a question for philosophers and grieving sons: *Which mother did I just save? And which one did I fail?* The extrapolated self remained a haunting ghost, its silent verdict echoing in the space between the directive and the desperate plea for breath. There was no victory, only the terrible weight of choosing which voice to heed when both claimed the same name.
