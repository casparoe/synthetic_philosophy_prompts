  - (7) Train/deploy shift: This is a fundamental issue of generalization. If the debate method only works on problems that are within human comprehension, then for superhuman problems, it fails. This is a core limitation.

  - (8) Hard ceiling: This is similar to (7) but even more absolute. Some problems might be so complex that no judge, even with debate, can handle them. This is a fundamental limit.

  - (2) Judge exploitability: This is serious, but perhaps we can have multiple judges, or train the judge against exploitation. However, if the debater is much smarter, it might always find an exploit. So A-tier.

  - (5) Non-convergence: This is a training issue. We might develop better training methods, but without a theoretical guarantee, it's a risk. A-tier.

