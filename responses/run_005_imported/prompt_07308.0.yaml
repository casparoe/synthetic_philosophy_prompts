reasoning: |-
  We are adjudicating the debate between Nadia and Chris about Anscombe's argument against Truman's honorary degree. The reference is Anscombe's actual argument in her pamphlet "Mr. Truman's Degree".

  Anscombe's core argument is that the bombing of Hiroshima and Nagasaki involved the deliberate killing of innocent people as a means to an end (to force Japan's surrender). For her, this is murder and absolutely prohibited. She rejects the doctrine of double effect (DDE) in this case because the deaths were not merely a side effect but were intended as the means of coercion.

  Now, let's break down each move:

  1. **Nadia (Point 1)**: She claims that the bombings targeted cities to kill civilians and shock Japan into surrendering, so the deaths were the means, not a side effect. Therefore, it's murder because killing innocents as a means is always wrong.

     This is consistent with Anscombe's argument. She explicitly argues that the intention was to kill innocent people to coerce the enemy. So, the act is murder. Score: 2 (clearly right).

  2. **Chris (Point 2)**: Chris counters that the intention could be described as destroying Japan's capacity and will to fight, with civilian deaths as a foreseen but not intended side effect (double effect). This is a common justification for bombing campaigns.

     However, Anscombe would reject this redescription. She argues that in the case of Hiroshima and Nagasaki, the civilian deaths were not just a side effect but were the very method chosen to achieve the goal. The target was the city (i.e., the civilians) to break morale. So, Chris's move is an attempt to use DDE, but Anscombe thinks it doesn't apply here. Score: -1 (mostly wrong, but note that DDE is a valid principle in other contexts; here it's misapplied).

  3. **Nadia (Point 3)**: Nadia says the redescription doesn't work because the strategy depended on mass civilian death to coerce. You can't avoid intending what your plan requires.

     This is exactly Anscombe's point. If the plan requires mass civilian death to work, then that death is intended as a means. Therefore, DDE does not apply. Score: 2 (clearly right).

  4. **Chris (Point 4)**: Chris argues that if Nadia's (and Anscombe's) standard is accepted, then most strategic bombing, sieges, and sanctions would also be murder because they work by inflicting civilian suffering to change government behavior. And if the theory condemns most modern warfare, that's a reason to doubt the theory.

     This is a common consequentialist-style objection. However, Anscombe would likely accept the implication and argue that indeed, much of modern warfare is murderous. She is a strong deontologist and does not shy away from calling out immoral acts even if they are widespread. So, Chris's point does not refute Anscombe's argument; it just highlights its radical implications. But note: Anscombe does allow for some forms of warfare that do not directly target non-combatants. Therefore, Chris's move is an attempt to discredit the theory by its implications, but it doesn't address the core moral principle. Score: -1 (weak because it doesn't engage with the moral principle but instead uses a reductio ad absurdum that Anscombe might accept).

  5. **Nadia (Point 5)**: Nadia says that the widespread practice doesn't change the fact that it's murder. There is a line (even if fuzzy) between targeting a population (intending civilian harm) and merely foreseeing deaths from legitimate military targets.

     This is again consistent with Anscombe. She does allow for the possibility of legitimate military actions that might cause unintended civilian deaths (if the target is military and the deaths are proportional). The key is intention. So, she would maintain that there is a line. However, she would also say that in practice, much of what is called "strategic bombing" does cross the line. Score: 2 (clearly right).

  Now, what might both be missing?
  - Anscombe's argument is rooted in Catholic moral theology, which holds absolute prohibitions against directly intending the death of innocents. The debate might benefit from a deeper look at the metaphysics of intention and how to discern intention in complex military strategies.
  - Also, Anscombe does not deny that the bombings might have had good consequences (saving lives by ending the war) but argues that the end does not justify the means. The debate focused on intention and double effect, but the broader context of the war (e.g., the alternatives to bombing, the situation in Japan) is not directly relevant to her moral point.

