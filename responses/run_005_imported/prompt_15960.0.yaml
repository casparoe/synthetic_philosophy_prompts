answer: |-
  You're absolutely right to question Nash's dominance in dynamic negotiations. When the bargaining set itself is volatile – like wage talks where market shifts, new investors, or external shocks can radically alter the surplus mid-process – **the Kalai-Smorodinsky (KS) solution isn't just a footnote; it's fundamentally superior and more realistic precisely because it prioritizes Monotonicity over Independence of Irrelevant Alternatives (IIA).** Nash's IIA becomes a dangerous liability when the pie changes, while KS's Monotonicity captures the essence of fair adaptation. Here’s the case:

  **Why IIA Fails the Moving Target Test (and Why it Matters in Wage Bargaining):**

  1.  **IIA Ignores the *Meaning* of Expansion:** Nash's IIA axiom says that if you remove options *not chosen* from the bargaining set, the solution shouldn't change. But when the pie *grows* (new feasible alternatives are *added*), IIA is silent. It allows solutions where one party captures *all* the new surplus, even if the expansion benefits both parties symmetrically. Imagine wage negotiations:
      *   **Initial Set:** Company max profit = $10M (paying $0 wages). Union max wage = $500K (company profit = $0). Disagreement point (strike) = ($0, $0). Nash likely splits near the midpoint (e.g., $5M profit, $250K wages).
      *   **Mid-Talks, Pie Expands:** A new contract with a major client unexpectedly doubles potential profit! New max profit = $20M (paying $0 wages). The *only* new alternatives added are those where profit is >$10M.
      *   **Nash's Problem (IIA):** Since the original solution point ($5M, $250K) is still feasible, and the new options (>$10M profit) weren't chosen before, **IIA allows Nash to stick stubbornly to ($5M, $250K).** The company pockets the *entire* $10M windfall. The union gets *nothing* extra, despite the expansion being arguably due to *both* parties' existence and potential cooperation. This violates basic fairness intuitions in negotiations – workers expect to share in windfall gains.

  2.  **IIA Permits Exploitation During Contraction:** Conversely, if the pie *shrinks* mid-talks (e.g., market downturn, key customer loss), IIA allows the solution to *still* demand concessions primarily from one party. If the new, smaller set still contains the old solution point, Nash might insist on it, potentially pushing one party below their new, worse disagreement payoff (e.g., forcing wages unsustainably low during a recession just because they were agreed upon hypothetically before the crash). IIA is blind to the *context* of the change.

  **Why Monotonicity is the Essential Lifeline for Realistic Negotiations:**

  KS replaces IIA with **Monotonicity:** If the bargaining set expands in a way that *improves the ideal point (utopia point) for one player without worsening it for the other*, then that player should not end up worse off in the new solution.

  1.  **It Captures Proportional Fairness in Growth:** In the windfall example above:
      *   **Initial Utopia:** (Company $10M, Union $500K)
      *   **New Utopia:** (Company $20M, Union $500K) - *The union's maximum *possible* wage hasn't changed, but the company's maximum profit doubled.*
      *   **KS Mandate:** Monotonicity requires that the company must not be *worse off* in the new solution. Crucially, KS *also* considers the *ratio of gains*. The KS solution finds the point on the Pareto frontier where the *ratio* of the players' achieved gains (from disagreement) to their ideal gains is *equal*. Before: Gains ratio might be ~($5M/$10M) = 0.5 vs ($250K/$500K) = 0.5. After: KS demands ($X/$20M) = ($Y/$500K). **The company's potential gain doubled; Monotonicity ensures the union's *relative bargaining position* (their claim as a proportion of the new maximum possible) is preserved.** The solution likely becomes (~$10M profit, ~$250K wages) or similar – the company gets most of the *absolute* windfall, but the union's *relative share of potential* is maintained. This aligns with real-world expectations: workers see increased profits and demand *some* share, even if not dollar-for-dollar equal.

  2.  **It Adapts Rationally to Shrinking Pies:** If the utopia point worsens for one party (e.g., union's max possible wage drops to $400K due to automation threat, while company's max profit remains $10M), KS Monotonicity ensures that party (the union) isn't forced to bear *more* than their fair share of the loss relative to the new possibilities. Their achieved gain as a proportion of their new, lower ideal point is protected. This prevents unrealistic demands based on outdated best-case scenarios.

  3.  **It Mirrors Real Negotiator Psychology & Fairness Norms:** Negotiators don't operate in a vacuum of fixed options. Their perception of fairness is inherently tied to the *current* best possible outcome ("What *could* we get now?"). When the pie grows, the disadvantaged party immediately points to the new utopia ("Look how much more *you* can make now! We deserve a piece of that!"). When the pie shrinks, they argue their sacrifices shouldn't exceed the proportional loss of potential. **KS formally encodes this dynamic reference point – the utopia point – directly into the solution.** Nash, fixated on irrelevant historical alternatives via IIA, ignores this crucial psychological and normative shift in the bargaining landscape.

  **Conclusion for Wage Bargaining (and Beyond):**

  In negotiations where the surplus itself is unstable – the very definition of complex wage bargaining, M&A during volatile markets, or international treaties amid shifting geopolitics – **Kalai-Smorodinsky isn't just realistic; it's ethically necessary.** Nash's IIA shackles the solution to a snapshot of possibilities that may be instantly obsolete, leading to perverse outcomes where windfalls aren't shared and downturns disproportionately crush one side. **KS's Monotonicity is the antidote: it forces the solution to dynamically respond to *changes in the parties' fundamental bargaining potentials*, ensuring gains and losses are proportional to the shifting horizons of what's achievable.** It replaces Nash's mathematical rigidity with an adaptive fairness principle grounded in the reality of negotiation as a process, not a static event. If the pie can move, your solution *must* care about monotonicity; IIA becomes not just irrelevant, but dangerously misleading. For moving targets, KS is the only rational shot.
