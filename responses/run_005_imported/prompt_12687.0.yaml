answer: |-
  Your question cuts to the heart of a lively, unresolved debate in evolutionary biology. While Wilson, Nowak, and Tarnita argued forcefully that **multilevel selection (MLS) supersedes inclusive fitness theory (IFT)**, most evolutionary biologists reject the claim that IFT is obsolete or mathematically invalid. Here's why the "gene's-eye view" persists:

  1.  **Mathematical Equivalence (Not Supersession):**
      *   **The Core Issue:** The 2010 Nature paper claimed IFT was fundamentally flawed and MLS was superior. However, subsequent work (by Gardner, West, Wild, et al.) demonstrated that **standard IFT and MLS models are mathematically equivalent** for most scenarios, including the evolution of altruism and eusociality. They are different ways of "accounting" for the same evolutionary process.
      *   **Hamilton's Rule Holds (with Refinements):** The core insight of Hamilton's Rule (rb > c) remains a valid predictor for when altruism evolves *under kin selection*. Criticisms often targeted oversimplified versions or specific assumptions, not the core logic. Modern IFT incorporates population structure, demography, and other complexities.

  2.  **Conceptual Clarity and Heuristic Power:**
      *   **The "Gene's-Eye View":** Framing selection in terms of **gene frequency change** provides a powerful, unifying perspective. It naturally explains why alleles for altruism spread *despite* individual cost – they increase in frequency by benefiting copies of themselves in relatives. This logic applies universally, regardless of the specific mechanism (kin selection, group selection).
      *   **Direct Intuition for Relatedness:** For behaviors like parental care or helping siblings, **relatedness (r)** is an intuitive and measurable quantity (genomic relatedness) that directly predicts when altruism should evolve. Thinking in terms of "genes helping copies of themselves" is often more straightforward than partitioning selection into within-group and between-group components.

  3.  **Practical Utility and Empirical Focus:**
      *   **Measuring Relatedness is Often Easier:** In field studies of social behavior, estimating relatedness (via genetics) is frequently more practical than rigorously defining and measuring "groups" and their differential productivity/fitness, especially in fluid populations.
      *   **Focus on Mechanism:** The gene-centered view naturally leads to questions about the *specific genes* underlying altruism and eusociality (e.g., via genomics) and the *mechanisms* by which relatedness is assessed (e.g., odor cues, vocalizations). MLS models, while valuable, are often more abstract regarding proximate mechanisms.

  4.  **Cultural Legacy and Training:**
      *   **Dawkins' Influence:** "The Selfish Gene" was phenomenally successful in popularizing and clarifying the gene-centered view for a generation of biologists. Its narrative power and explanatory scope left a lasting impact.
      *   **Pedagogy:** IFT and kin selection are often taught first as the "standard" explanation for altruism, establishing a foundational framework. MLS is then presented as an alternative perspective or for specific contexts. This shapes how biologists initially conceptualize problems.
      *   **Specialization:** Many behavioral ecologists and population geneticists find the tools and language of IFT and population genetics the most natural and powerful for their specific research questions.

  5.  **Nuance in the "Settled Debate" Claim:**
      *   **MLS is Accepted, But Not as the *Only* Framework:** Modern evolutionary biology widely accepts that **selection can operate simultaneously at multiple levels** (gene, individual, group). Few deny that between-group variation can favor altruism *under specific conditions* (like strict population structure and very strong group effects).
      *   **IFT ≠ "Gene's-Eye View" Only:** Modern IFT is a robust mathematical framework within population genetics, not just a metaphor. It rigorously handles the complexities Wilson criticized.
      *   **Wilson's Stance is a Minority View:** While influential, Wilson, Nowak, and Tarnita's strong dismissal of IFT is **not** the consensus. Leading theorists like Alan Grafen, Andy Gardner, Stuart West, and many others vigorously defended IFT's validity and utility.

  **Why the Persistence? A Summary:**

  *   **Equivalence, Not Supersession:** IFT and MLS are largely complementary frameworks, not competitors where one "wins."
  *   **Heuristic Power:** The gene-centered view offers deep conceptual clarity and a direct link to genetics.
  *   **Practicality:** Relatedness is often a measurable key parameter driving altruism in nature.
  *   **Legacy & Training:** The gene's-eye view is deeply embedded in the culture and education of evolutionary biology.
  *   **MLS is Used, But Selectively:** MLS is employed, especially for specific problems like major evolutionary transitions or tightly defined group structures, but hasn't replaced the gene-centric/IFT framework for routine analysis of social evolution.

  **In essence:** Wilson's proclamation of MLS supremacy and the death of IFT was an overstatement. The gene's-eye view and inclusive fitness remain powerful, valid, and widely used tools because they offer intuitive explanations, direct links to genetics, practical methodologies, and – crucially – are mathematically compatible with multilevel selection thinking. The field hasn't abandoned them because they haven't been invalidated; they've been integrated into a broader understanding where selection's level is a matter of perspective and context, not an either/or choice. The debate continues, but the consensus leans towards pluralism, not the wholesale replacement Wilson advocated.
