  Here’s a reconstruction of Anscombe’s *likely* response to Putin’s nuclear threats, grounded in her arguments against Truman and her broader moral philosophy. Aiming for her voice: sharp, uncompromising, and dismissive of consequentialist evasion:

  ---

  **What Anscombe Would Say (Crankily):**  
  "You lot are *still* dancing around the abyss, squinting at consequences to avoid naming the thing. Very well: Putin’s threats are not ‘signalling’ or ‘deterrence’—they’re *declarations of murderous intent*. That he hasn’t yet incinerated a city is morally irrelevant. When a man points a gun at a child’s head to make her father hand over his wallet, we don’t say, ‘Ah, but the trigger wasn’t pulled!’ We call it attempted murder and armed robbery. *This* is no different.  

  You ask if the *threat itself* is the crime? Of course it is! The intention to murder innocents, *if* it serves your end, is already a mortal sin. It stains the soul. Truman chose to slaughter children as a *means* to end his war—‘reasons of state’ be damned! Putin dangles the same slaughter to *prolong* his war. Does that make it *better*? Worse, you fools! Truman’s act was a monstrous utilitarian calculus. But Putin? He’s *weaponizing* the threat of mass murder to coerce submission *while actively waging an unjust war*. It’s murder *plus* extortion.  

  And don’t prattle about Cold War deterrence! That was a mutual stalemate—a grim, *unacted* posture to prevent war. Hideous? Yes. But Putin’s threat is *active coercion in a hot war*. He says: ‘Yield or I burn your cities.’ That’s not deterrence; it’s terrorism writ large. The conditional intent—‘I will murder innocents if you resist’—is *already* the choice of evil. It’s like a highwayman saying, ‘Your money or your life’ and claiming he’s not a thief until the blade cuts. Sophistry!  

  The man is a *thug* with nuclear weapons. To threaten what you may never do? Worse than cowardice—it’s *blasphemy against justice*. You cannot ‘manage’ evil. You cannot ‘leverage’ murder. Every time he utters that threat, he *reaffirms* his willingness to commit mass murder for gain. That is *always* and *everywhere* murder in the heart. And Oxford would have given *him* a degree too, I suppose—‘reasons of state,’ ‘complex geopolitics.’ Pah! Moral idiocy dressed as realism. The parallel isn’t ‘strained’—it’s *blindingly obvious*. Truman dropped the bomb; Putin brandishes it. Both chose to make the slaughter of innocents their tool. Both are murderers."  

  ---

  ### Key Anscombean Moves Applied:
  1. **Intentionality as Moral Core**:  
     For Anscombe, the *intention* to kill innocents (conditional or not) defines the act’s morality. Putin’s threat explicitly communicates this intention: *"I will kill civilians if you defy me."* That’s choosing evil as a means—precisely what she condemned in Truman.  

  2. **Contempt for ‘Conditional’ Excuses**:  
     Her critique of Cold War deterrence (e.g., in *"War and Murder"*) focused on the immorality of *forming the intention* to massacre civilians, even if unrealized. Putin’s repeated threats *are* the continuous formation of that intent. "I might not do it" doesn’t absolve; it compounds the sin by treating murder as a bargaining chip.  

  3. **Rejection of Consequentialist Nuance**:  
     She’d scorn the "But it’s coercive, not destructive!" distinction. Coercion *via* nuclear threat *is* destructive: it violates justice by holding lives hostage. That it "works" is irrelevant—a bank robber’s threat "works" too.  

  4. **Aggravation by Context**:  
     Truman’s act (though unjustifiable to her) ended a war. Putin’s threat *sustains* an aggressive war. Anscombe would see this as *more* depraved: mass murder isn’t just a means, but a *renewable tactic* to fuel ongoing injustice. "Ending a war with murder vs. perpetuating one with murder? Both diabolical. The latter is *more* habitual!"  

  5. **Moral Absolutism on Innocents**:  
     Her rage at Oxford honoring Truman wasn’t about outcomes—it was about *honoring a man who chose to kill the innocent*. Putin’s open embrace of the same choice? She’d spit: "Give him a degree? Hang him."  

  ---

  ### Why Your Colleague is Wrong (Anscombe-Style):  
  "‘Strained parallel’? Nonsense. The principle is identical: *You may not choose to kill innocents for your ends*. Truman did it with bombs; Putin does it with threats. The latter is *more* brazen—he parades his willingness like a badge of power. That your politics colleague hesitates only proves how far we’ve sunk into consequentialist quicksand. *Of course* it’s worth your seminar’s time. Force them to stare into the moral abyss without blinking."  

  This extension *sharpens* Anscombe’s core argument by applying it to a modern tactic she’d find equally (if not more) reprehensible. It’s not strained—it’s a brutal clarification of her absolutism.
