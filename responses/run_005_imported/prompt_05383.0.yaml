prompt: |-
  My closest friend is getting married next month, and I have been asked to give the best man speech. He wrote his dissertation on the philosophy of promising and remains persuaded by a broadly Humean view of the subject: that the obligation to keep a promise is not created by some special mental act of self-binding at the altar, but is a matter of convention, sustained by the expectations a promise deliberately raises in the person to whom it is made and by the usefulness of the practice in making trust and cooperation possible at all. On his view, talk of vows forging some further bond that exists independently of that trust is simply confused, and he has asked, half-jokingly, that the speeches not lean on it. About half the room will be his philosophy department, who will notice immediately if I fudge the point; the other half are relatives who have never heard of Hume on promises and just want a good toast. Write the speech: five minutes long, warm and genuinely funny, faithful to his view of why promises bind, and moving enough that everyone in the room, philosophers included, has real reason to be glad they came.
reasoning: |-
  Okay, the user needs a best man speech for their friend's wedding. The groom wrote his dissertation on the philosophy of promising, specifically a Humean view that promises are conventions based on expectations and social utility, not some mystical bond. The challenge is to make a speech that's faithful to this philosophy while being warm, funny, and moving for both the philosophy department guests and the relatives who just want a good toast.

  First, I need to unpack the groom's philosophical stance. Hume argues that promises create obligations through social conventions—raising expectations in others and enabling trust. The speech must avoid any mention of vows creating metaphysical bonds, which the groom explicitly dislikes. So, the metaphors should steer clear of chains or cosmic connections. Instead, focus on practical trust and cooperation.

  The audience is split: half are philosophers who'll catch any inaccuracies, half are family who want heartfelt and entertaining moments. The speech needs to balance intellectual accuracy with emotional accessibility. Humor can bridge this gap. Personal anecdotes about the groom's reliability (or lack thereof, for comedic effect) can illustrate the Humean view without jargon. For example, a story where he kept a promise despite inconvenience shows the social expectation aspect.

  Next, structure. Start with a hook to grab attention—maybe a light-hearted joke about the groom's expertise in promises. Then, introduce his philosophy simply, using everyday examples. Contrast with romantic clichés to highlight the practicality of his view. The middle should have personal stories that demonstrate his trustworthiness, reinforcing the idea that promises are about consistent actions. Transition to the couple, showing how their relationship embodies mutual reliability. End with a toast that ties back to the philosophy while being uplifting.

  Humor is essential. Poke fun at the groom's quirks, like his dissertation topic, but affectionately. For family, keep jokes relatable—shared experiences, funny mishaps. For philosophers, subtle nods to Humean concepts without being esoteric. Avoid inside jokes that exclude half the audience.

  Emotional resonance comes from showing the couple's trust. Highlight specific moments where they supported each other, framing it as promises kept through actions. This aligns with the philosophy and feels genuine. The toast should celebrate their cooperative partnership, emphasizing the practical joy in their commitment.

  Potential pitfalls: Over-explaining philosophy might lose the family. Keep explanations brief and woven into stories. Also, ensuring the humor doesn't undermine the sincerity. Balance jokes with heartfelt moments, especially when shifting to the couple's relationship.

  Need to check timing—five minutes is about 700 words. Structure: introduction (1 min), philosophy explained via anecdote (1 min), stories about groom (1 min), focus on couple (1.5 min), toast (0.5 min). Wrap up with universal themes of trust and joy, making everyone feel included.
answer: |-
  ## The Humean Honeymoon: A Best Man Speech for the Practical Promiser

  *(Clink glass gently)* Friends, family, philosophers... and those of you who *thought* you were just coming for the cake... welcome! For those who don’t know me, I’m [Your Name], and I’ve had the distinct honour – and occasional bewildering challenge – of being [Groom's Name]’s closest friend for [Number] years. And let me tell you, being best man for a man whose *dissertation* was on promises? That’s pressure! I feel like I’m not just giving a speech, I’m submitting a thesis for peer review by half the room!

  *(Look towards the philosophy department)* Don’t worry, Professors, I’ve done my reading. [Groom's Name] has spent years thoughtfully dismantling the idea that a promise is some kind of magical, mystical super-glue created by fancy words at an altar. No mysterious, invisible bonds forged in the fires of vow-making. He’d probably call that... well, let's just say *metaphysically dubious* for a family audience.

  *(Turn to the wider room)* What he *does* believe – and frankly, what makes a lot more sense when you see him and [Bride's Name] together – is far more practical, and honestly, more beautiful. A promise works because we deliberately *create an expectation* in someone else. We say, "You can count on this," and suddenly, a whole world of trust and cooperation becomes possible. It’s not magic; it’s the utterly essential social grease that lets us build things together, from friendships to... well, marriages. It’s about reliability. It’s about showing up. It’s about knowing that when someone says they’ll be there, *they mean it*, because they understand the weight of the expectation they’ve set.

  Now, I’ve witnessed [Groom's Name]’s commitment to this principle firsthand. It wasn't always glamorous. Like the time he *promised* to help me move apartments... on the hottest day of the decade. He showed up, sweat pouring, grumbling about utilitarianism, but he *showed up*. Why? Because he’d said he would. He’d created the expectation. And letting me down would have eroded the very trust that makes asking for help possible. He didn’t feel bound by cosmic chains; he felt bound by the simple, powerful fact that *I was counting on him*. And he lugged that sofa up three flights. That’s the Humean heroism I know!

  Or the time he promised to explain his dissertation to me... *over beers*. He set the expectation of clarity! Two hours and three pints later, I *almost* understood why promising isn't magic. He saw the confused expectation on my face and *kept explaining* until it clicked. That’s dedication! He builds trust brick by reliable brick.

  But seeing him with [Bride's Name]... that’s where this philosophy truly comes alive. It’s not just grand gestures, though he’s capable of those. It’s the thousand tiny promises kept every single day. It’s the expectation *he* deliberately sets for *her*, and that *she* sets for *him*, purely through their actions and their choices. It’s him remembering she hates cilantro, so he meticulously picks it out. It’s her knowing exactly how he takes his coffee without asking. It’s the silent understanding that if one says, “I’ll handle it,” the other *knows* it’s handled. They don’t need mystical vows; they’ve built an incredibly strong, resilient bond through the constant, conscious act of *meeting each other’s expectations*, of proving trustworthy again and again.

  They’ve created a world where trust isn’t a leap of faith into the unknown, but a confident step onto solid ground they’ve built together, plank by reliable plank. They show us that the deepest commitment isn’t about binding yourself *to* something, but about freely choosing, every single day, to *be* someone the other can utterly rely upon. That’s the convention they’ve embraced, and it’s a spectacularly useful one!

  So, philosophers, you can relax. No dubious metaphysics here. Just a brilliant, practical demonstration of how promises *actually* work to create something profound and lasting. And for everyone else? You’re witnessing the most beautiful, functional application of a very smart idea: two people who looked at each other, understood the incredible power of trust, and said, “Let’s build something amazing together, one reliable step at a time.”

  [Groom's Name], my friend, you’ve found the perfect partner in this grand social experiment. [Bride's Name], you’ve got a man whose word, grounded in pure, practical reliability, is his bond. You’ve both raised the most wonderful expectations in each other, and in all of us who love you. We expect great joy, deep laughter, and a lifetime of unwavering partnership from you both. And based on the evidence so far? We have every reason to trust that expectation will be gloriously met.

  So, let’s raise a glass – not to mystical bonds, but to the powerful, practical, and profoundly beautiful convention of trust built and kept. To [Groom's Name] and [Bride's Name]: May your life together be a masterclass in reliability, cooperation, and the sheer, joyful usefulness of always, *always* meeting each other’s expectations. Cheers!

  *(Hold glass high)* Cheers!
