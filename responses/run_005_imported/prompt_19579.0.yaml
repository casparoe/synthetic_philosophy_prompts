prompt: |-
  I'm at work on a historical novel set in the Scottish Enlightenment, and one chapter includes a fictionalised version of David Hume defending his essay "Of Miracles" against a clergyman who has clearly read it with care and means to find its weak point rather than simply denounce it. I want the clergyman's objection to be a real philosophical difficulty, not a strawman, so I need to understand the passage properly before I write the exchange.

  Here is the text in question, from Section X, Part I, of the *Enquiry Concerning Human Understanding*:

  "A miracle is a violation of the laws of nature; and as a firm and unalterable experience has established these laws, the proof against a miracle, from the very nature of the fact, is as entire as any argument from experience can possibly be imagined. Why is it more than probable, that all men must die; that lead cannot, of itself, remain suspended in the air; that fire consumes wood, and is extinguished by water; unless it be, that these events are found agreeable to the laws of nature, and that there is required a violation of these laws, or in other words, a miracle to prevent them? Nothing is esteemed a miracle, if it ever happen in the common course of nature. It is no miracle that a man, seemingly in good health, should die on a sudden: because such a kind of death, though more unusual than any other, has yet been frequently observed to happen. But it is a miracle, that a dead man should come to life; because that has never been observed in any age or country. There must, therefore, be a uniform experience against every miraculous event, otherwise the event would not merit that appellation. And as a uniform experience amounts to a proof, there is here a direct and full proof, from the nature of the fact, against the existence of any miracle; nor can such a proof be destroyed, or the miracle rendered credible, but by an opposite proof, which is superior."

  The line I want my clergyman to press on is this: elsewhere in the Enquiry, Hume is the great skeptic about induction, insisting that no degree of past uniformity can ever rationally guarantee the future, and that our trust in nature's regularities is a habit of the imagination rather than a conclusion of reason. Yet here, the moment the subject turns to miracles, that same habit-formed uniformity is promoted to a "proof... as entire as any argument from experience can possibly be imagined," solid enough to outweigh any conceivable testimony. My clergyman wants to ask whether Hume is simply helping himself to a stronger notion of "proof" than his own account of induction entitles him to.

  Could you help me work out whether that is a genuine tension in Hume's position, or whether some distinction elsewhere in his system dissolves it? I'd like both the clergyman's challenge and Hume's reply to be things a careful eighteenth-century reader of the Enquiry could recognise as fair.
