prompt: |-
  For my seminar on formal epistemology, I've been comparing David Lewis's Principal Principle—that credence in a proposition should match its known objective chance—with Bas van Fraassen's Reflection Principle, which requires current credence to defer to one's own anticipated future credence. Several commentators treat these as two instances of a single, more general norm of "expert deference," and I'd like your help assessing that claim: what, precisely, does each principle add to the bare idea of deferring to an expert, and are the two really on a par? In particular, memory-loss cases such as Sleeping-Beauty-style scenarios are often presented as counterexamples to Reflection without posing any obvious analogous threat to the Principal Principle. Can you explain this asymmetry, and say whether it reflects a genuinely different justification behind each principle, or only a technical difference in how they are formulated?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're comparing Lewis's Principal Principle and van Fraassen's Reflection Principle in the context of formal epistemology. The main question is whether these are both instances of a general "expert deference" norm and why Sleeping Beauty-style cases challenge Reflection but not the Principal Principle.

  First, I need to recall the core of each principle. The Principal Principle (PP) ties credence to known objective chances. If you know the chance of A is x, your credence in A should be x. It's about deferring to physical probabilities. On the other hand, the Reflection Principle requires that your current credence in A equals your expectation of your future credence in A. So, you're deferring to your future self as an expert.

  The user mentions that some commentators see both as expert deference. I should define what an expert is here. Experts are sources you trust completely for certain propositions. Both principles involve setting your credence equal to the expert's probability for A. But the experts differ: PP defers to chance as an expert, while Reflection defers to your future self.

  The asymmetry comes up with memory-loss cases like Sleeping Beauty. In that scenario, Beauty knows she'll be woken up twice if a coin lands tails but only once if heads. When asked her credence in heads upon waking, she might say 1/3. But if she applies Reflection, her future self after learning the outcome would have credence 1 or 0. Before the experiment, her expected future credence in heads is 1/2 (since she expects a 50% chance of heads). But her current credence during the experiment is 1/3. Reflection would require her current credence to be 1/2, but intuitively it should be 1/3. That's the problem.

  Why doesn't PP have this issue? PP deals with objective chances. In Sleeping Beauty, the chance of heads is 1/2 before the toss. Once the toss happens, the chance becomes 0 or 1. But during the experiment, when Beauty is awake, the chance has already settled. So PP isn't directly applicable in the same way. The key difference is that chance is static once fixed, while future credences can be influenced by evidence you know you'll lose, like amnesia.

  The user's deeper need might be understanding if the principles are fundamentally different or just technically so. The justification for PP is metaphysical—chances guide rational belief. Reflection is more about coherence over time. But in cases with anticipated evidence loss, deferring to a future self who lacks your current evidence isn't rational. Hence, Reflection needs qualifications, like no information loss between now and future time. PP doesn't have this issue because chance doesn't forget evidence.

  So the asymmetry highlights that while both are deference principles, their experts operate differently. PP's expert (chance) is information-independent, while Reflection's expert (future self) must account for evidence changes. This suggests a genuine difference in justification: PP is about aligning with objective probabilities, while Reflection is about diachronic coherence, which fails under memory loss.
answer: |-
  This is an excellent and nuanced question that cuts to the heart of debates about rational deference. Let's break down the core ideas, the claimed similarity under "expert deference," the crucial asymmetry revealed by memory-loss cases, and the implications for their justifications.

  ## Core Principles & The "Expert Deference" Framework

  1.  **Principal Principle (PP - Lewis):** If an agent knows that the *objective chance* of proposition `A` at time `t` is `x` (`P_t(A) = x`), and has no additional "inadmissible" information relevant to `A`, then their rational *credence* in `A` at `t` should be `x`: `Cr(A | P_t(A) = x ∧ E) = x`, where `E` is admissible information.
      *   **What it adds to bare deference:** PP specifies *who* the expert is (the objective chance function at time `t`) and *what constraint* defines the expert's status (capturing fundamental physical indeterminism). Crucially, it incorporates the *admissibility clause*, recognizing that not *all* information the agent possesses should be screened off if it's not part of the chance setup at `t`.

  2.  **Reflection Principle (RP - van Fraassen):** An agent's current credence in `A` conditional on the supposition that their future credence at time `t'` will be `x`, should be `x`: `Cr_{now}(A | Cr_{t'}(A) = x) = x`. Less formally, your current credence should equal your expectation of your future credence.
      *   **What it adds to bare deference:** RP specifies *who* the expert is (the agent's own future self at `t'`) and *what constraint* defines the expert's status (anticipated rationality and greater evidence). Crucially, it imposes a demanding condition of *diachronic coherence* or *self-trust* over time.

  3.  **The "Expert Deference" Analogy:** Commentators (e.g., Gaifman, Joyce, Briggs) note the structural similarity:
      *   Both principles instruct an agent to set their credence in `A` equal to the value assigned to `A` by a designated "expert" function.
      *   `PP`: Expert = Objective Chance Function (`P_t`).
      *   `RP`: Expert = Agent's Future Credence Function (`Cr_{t'}`).
      *   The general norm is: `Cr(A | Expert(A) = x) = x`.

  ## The Asymmetry: Memory-Loss Cases (Sleeping Beauty)

  *   **The Sleeping Beauty Scenario:**
      *   Beauty is put to sleep Sunday night. A fair coin is flipped.
      *   **Heads (H):** She is awakened only on Monday. Experiment ends.
      *   **Tails (T):** She is awakened on Monday, given amnesia, and awakened again on Tuesday. Experiment ends.
      *   Each awakening is indistinguishable. When awake, she knows the setup.

  *   **The Problem for Reflection:**
      1.  **Beauty's Credence upon Waking:** Upon awakening (Monday or Tuesday), what should Beauty's credence be that the coin landed Heads (`Cr_now(H)`)? A strong argument (Elga, 2000) suggests it should be 1/3. (Reasoning: Three possible awakenings (Mon-H, Mon-T, Tue-T), all subjectively identical, only one has Heads).
      2.  **Beauty's Future Credence:** Consider Beauty's credence *after* the experiment ends, say Wednesday (`Cr_{Wed}(H)`). She will know the outcome. If H, `Cr_{Wed}(H) = 1`. If T, `Cr_{Wed}(H) = 0`.
      3.  **Beauty's Sunday Expectation:** On Sunday *before* the experiment, Beauty calculates her expectation of her Wednesday credence in H: `E[Cr_{Wed}(H)] = P(H) * 1 + P(T) * 0 = 0.5 * 1 + 0.5 * 0 = 0.5`.
      4.  **Reflection Violation:** Reflection requires that on Sunday, `Cr_{Sun}(H | Cr_{Wed}(H) = x) = x`. Crucially, Beauty knows *for certain* that `Cr_{Wed}(H)` will be either 1 or 0, but she doesn't know *which*. Her expectation is 0.5. Therefore, Reflection seems to demand that her Sunday credence in H should be 0.5, conditional on her expectation of her future credence. More directly, RP requires that *upon waking*, her credence `Cr_now(H) = E[Cr_{Wed}(H) | Current Info]`. Her current info upon waking doesn't change the fact that `E[Cr_{Wed}(H) | Current Info] = 0.5` (the coin was fair, the future credence still depends only on the coin outcome). But her rational credence upon waking seems to be 1/3, not 0.5. **Reflection appears to mandate a credence of 0.5 upon waking, while the dominant intuition (and many arguments) support 1/3.** This is the counterexample.

  *   **Why Principal Principle Isn't Threatened Analogously:**
      1.  **The Relevant Chance:** The objective chance of Heads is set when the fair coin is flipped Sunday night: `P_{SunNight}(H) = 0.5`.
      2.  **Beauty's Knowledge:** Upon waking, Beauty *knows* the coin *has been flipped*. The outcome is fixed. The *current* objective chance `P_{now}(H)` is *either* 1 (if H landed) or 0 (if T landed). She just doesn't know which.
      3.  **Applying PP:** PP tells Beauty to defer to the *current* objective chance. But she *doesn't know* the current objective chance! She only knows the *past* chance (`P_{SunNight}(H) = 0.5`). PP does *not* say she should set her credence equal to the *past* chance if she has information (like being awake now) that might be relevant to the outcome and wasn't part of the past chance setup. Her current evidence (being awake) *is* relevant information about the outcome (it happens more often under Tails), making the *past* chance information inadmissible for determining her *current* credence about the *fixed but unknown* outcome. PP simply doesn't prescribe a credence of 0.5 upon waking. It prescribes deferring to the *current* chance, which she doesn't know. Her rational credence must be based on her total current evidence, leading to 1/3.

  ## Does This Asymmetry Reveal a Genuine Difference in Justification?

  **Yes, the asymmetry strongly suggests a deep difference in justification, not merely a technical formulation difference.**

  1.  **Principal Principle - Metaphysical/Epistemic Justification:**
      *   **Foundation:** Rooted in the *metaphysical* role of objective chance as a guide to future events in an indeterministic world. Credences should align with the best available information about the fundamental physical propensities governing events.
      *   **Function:** Primarily a *synchronic* constraint (at a specific time `t`, credence should match known chance at `t`). Its diachronic implications flow from how chances evolve and how evidence updates credences.
      *   **Robustness:** PP is threatened by defeating information ("inadmissible" information), but this information is typically *external* facts not accounted for in the chance setup. Memory loss per se doesn't inherently threaten PP because chance is an external feature of the world.

  2.  **Reflection Principle - Coherence/Procedural Justification:**
      *   **Foundation:** Rooted in *diachronic coherence* and *rational self-trust*. A rational agent anticipates being more informed and rational in the future. Deferring to one's future self is a condition of viewing oneself as a continuing, rational agent. Violations seem like a kind of epistemic self-distrust or inconsistency over time.
      *   **Function:** Inherently *diachronic*. It's a direct constraint linking credence states at different times.
      *   **Vulnerability:** The Sleeping Beauty counterexample exploits a specific failure mode: **anticipated evidence loss.** Beauty *knows* her future Wednesday self has *less relevant evidence* than her current waking self about the event in question (the coin flip). The Wednesday self *knows the outcome* but has *forgotten the experience* of the awakenings, which is crucial evidence for the *current* waking self trying to determine the outcome. Deferring to an expert who lacks evidence you possess is irrational. RP, as initially formulated, lacks a clause to screen off this type of situation.

  ### Conclusion: Are They Truly on a Par as "Expert Deference"?

  *   **Structural Parity, Justificatory Disparity:** They are formally analogous instances of expert deference *at a high level of abstraction*. This framework is useful for comparing their logical structure and exploring generalizations.
  *   **Not Fundamentally on a Par:** The asymmetry revealed by memory-loss cases highlights crucial differences:
      *   **Nature of the Expert:** Chance is an *external, information-independent* feature (its value doesn't depend on what the agent knows). Future credence is an *internal, information-dependent* state (it *does* depend on what the agent knows/remembers).
      *   **Core Justification:** PP is justified by the link between chance and rational belief about an open/indeterminate world. RP is justified by ideals of diachronic rationality and self-trust.
      *   **Vulnerability:** RP is inherently vulnerable to scenarios involving *anticipated rational or evidential imperfections* in the future self (like forgetting), especially concerning the proposition in question. PP is vulnerable only to *external* defeating information not captured in the chance function.
      *   **Admissibility vs. Self-Trust:** PP explicitly builds in an "admissibility" clause to handle defeating information. The original RP lacks an analogous "no anticipated evidence loss or irrationality" clause, though responses to counterexamples often try to add one (e.g., van Fraassen's "Rational Reflection" principle).

  **In essence:** While both are deference principles, PP is fundamentally about aligning belief with objective physical constraints on possibility, whereas RP is fundamentally about maintaining coherence within one's own evolving epistemic state over time. The Sleeping Beauty case exploits the fact that rational future selves can be *less informed* than current selves about certain propositions due to evidence loss, making deference to them irrational for *those specific propositions*. This vulnerability stems directly from the internal, evidence-dependent nature of the "expert" in RP, a feature absent from the external chance expert in PP. This difference points to a genuinely distinct underlying justification for each principle.
