  First, I need to assess if ergodicity makes Kelly mandatory. Samuelson's point is that utility is subjective; no one can impose log utility. But Peters says the issue is about dynamics, not preference. When wealth compounds multiplicatively, the ensemble average (expected value) doesn't reflect individual experience over time. The coin flip example: winning 50% or losing 40% with equal probability. The ensemble average is positive, but the time-average growth is negative. So, an agent experiencing repeated bets sees wealth decay, despite a positive expected value. That suggests multiplicative dynamics require geometric means.

  But is this a dynamic necessity or a utility choice? Peters frames it as correcting a hidden assumption in expected value theory. If the agent cares about long-term wealth, geometric growth is necessary. But Samuelson might counter that if an agent prefers to maximize expected wealth, even with bankruptcy risk, that's their choice. However, ergodicity economics argues that without time-average equivalence, expected value doesn't reflect outcomes. So, for multiplicative processes, expected value isn't ergodic, making it misleading for repeated bets.

  Garrabrant's extensions to Nash bargaining and Bayesian updating. In bargaining, geometric rationality maximizes the product of utilities instead of the sum. Is this similarly necessary? The key difference: wealth compounding is inherently multiplicative over time, while bargaining or Bayesian updates aren't necessarily tied to repeated multiplicative dynamics. Without the temporal component, it's harder to argue that geometric averaging is non-optional. So, the necessity might only apply to repeated multiplicative scenarios.

  The strongest argument for ergodicity is the coin flip example, showing a divergence between expected value and realized growth. If an agent faces repeated bets, ignoring geometric growth leads to almost certain ruin. Samuelson's retort: different risk preferences could accept that ruin risk for higher short-term gains. But Peters would say that's misunderstanding the dynamics—expected value doesn't translate to actual outcomes in multiplicative processes.

  For extensions beyond wealth, like bargaining, the necessity isn't as clear. Without time-averaging, geometric rationality becomes a normative choice. So, the verdict: ergodicity makes geometric growth non-optional for repeated multiplicative bets because the dynamics force time-average growth as the relevant metric. But in other domains, it's a useful but optional normative framework.
answer: |-
  ## The Ergodicity Imperative: When Dynamics Dictate Rationality

  The dispute over the Kelly criterion and its ergodicity justification cuts to the heart of rational decision-making: are the rules of rationality dictated by timeless logic and preference, or are they constrained by the temporal dynamics of the world we inhabit? Paul Samuelson's scathing critique dismissed log-utility betting as mere preference masquerading as mathematical law. Ole Peters' ergodicity economics counters that for repeated multiplicative bets, geometric-growth maximization is *non-optional* – a factual consequence of dynamics, not a subjective choice. Scott Garrabrant's geometric rationality extends this logic beyond wealth, challenging the independence axiom itself. While Samuelson's core point about preference sovereignty retains force in static or additive contexts, the ergodicity argument compellingly demonstrates that for agents embedded in *repeated multiplicative processes*, geometric-growth maximization transcends preference and becomes a dynamic necessity. However, this imperative weakens significantly when extended beyond the specific context of compounding wealth over time.

  **The Case for Non-Optionality: Dynamics Over Desire**

  Peters' ergodicity argument presents its strongest challenge by exposing a hidden, flawed assumption in standard expected-value reasoning: ergodicity. Standard expected value calculates an *ensemble average* – the average outcome across many parallel universes where a single bet happens once. However, a single bettor living through repeated bets experiences a *time average* – the growth rate along their single, unfolding path.

  The crux is this: **For multiplicative processes (like compounding wealth), the ensemble average and the time average diverge dramatically.** Consider the classic Peters coin flip: heads you win 50%, tails you lose 40%. The expected value (ensemble average) is positive: (1.5 + 0.6)/2 = 1.05, a 5% gain. But the time-average growth rate is determined by the geometric mean: sqrt(1.5 * 0.6) = sqrt(0.9) ≈ 0.9487, implying a *loss* of about 5.13% per bet. Play this game repeatedly, and almost every individual path leads to ruin, despite the positive expected value. Standard expected-value reasoning, by implicitly assuming ergodicity (time avg = ensemble avg), disastrously misrepresents the actual outcome for the sequential participant.

  This is not a preference. It's a **fact about the mathematical structure of multiplicative dynamics over time**. An agent seeking to maximize their long-term wealth *cannot* rationally use the ensemble average (arithmetic mean) as their guide because it systematically mispredicts their actual experience. The geometric mean (and its maximization via the Kelly criterion) isn't chosen; it's *revealed* as the relevant quantity governing the actual trajectory of wealth. To ignore it is not to express a different risk preference; it is to misunderstand the dynamics governing one's future wealth. The "growth rate" maximized by Kelly isn't an abstract hope; it's the exponential growth parameter governing the almost-sure long-run behavior of the bankroll. An agent facing repeated multiplicative bets who cares at all about long-term wealth *must* attend to the geometric growth rate. Failing to do so isn't merely suboptimal; it's a category error about the nature of the process they are engaged in.

  **Samuelson's Sovereignty and the Limits of Dynamics**

  Samuelson's core objection, however, cannot be dismissed lightly: **Utility is inherently subjective.** No mathematical argument can *force* an agent to value the long run, or to value wealth logarithmically. An agent with a short time horizon, extreme risk-seeking tendencies, or a specific non-log utility function (e.g., only caring about reaching a specific target) might rationally choose a strategy different from Kelly. Samuelson would argue that Peters conflates *what happens* (the dynamics) with *what the agent values* (the utility). The dynamics determine the consequences of actions, but the agent's preferences determine which consequences are desirable. The ergodicity argument shows *why* log-utility leads to growth, and *why* arithmetic means mislead in multiplicative settings, but it cannot prove that every rational agent *must* value long-run growth above all else. If an agent truly prefers the gamble implied by maximizing expected wealth (E[X]) knowing it likely leads to ruin over the slower but safer Kelly path, that remains a coherent (if perhaps imprudent) preference.

  Furthermore, the argument relies critically on **indefinite repetition.** For a known, finite number of bets, or in scenarios without multiplicative compounding (e.g., additive gains/losses, or single bets), ergodicity often holds, and standard expected utility theory (EUT) applies without Peters' critique. Kelly's dominance is tied to the long-run multiplicative context.

  **Geometric Rationality: A Compelling Extension or a Bridge Too Far?**

  Garrabrant's geometric rationality ambitiously extends the core insight – maximizing geometric expectations – beyond wealth to domains like Nash bargaining (maximizing the product of utilities) and Bayesian updating (using geometric pooling). Does the *non-optionality* argument carry over?

  Here, the case weakens considerably. While maximizing the Nash product or using geometric pooling are often elegant and useful solutions, the **imperative driven by temporal dynamics fades.**

  1.  **Bargaining (Nash):** Bargaining is typically modeled as a one-shot or finite interaction, not an indefinite repeated multiplicative process over time. There's no inherent "time average" of outcomes for a single agent unfolding sequentially. The Nash solution maximizes the *product* of utilities, justified by appealing to axioms (scale invariance, independence of irrelevant alternatives, symmetry, Pareto efficiency), not by an argument about the dynamics of repeated interaction forcing this specific averaging method. An agent could coherently prefer a different solution concept (e.g., Kalai-Smorodinsky maximizing the minimum relative utility gain) without committing a *dynamic* error. The justification is normative (these axioms are fair/compelling) or strategic (this solution is stable), not a factual necessity arising from temporal dynamics. Geometric rationality offers a powerful *framework*, but not a *non-optional* one.
  2.  **Bayesian Updating (Geometric Pooling):** This applies to aggregating beliefs from multiple sources. While geometric pooling has desirable properties (external Bayesianity), the argument for its *necessity* based on dynamics is tenuous. Belief updating isn't inherently a multiplicative process unfolding over time for a single entity in the same way wealth compounding is. Standard Bayesian updating (using conditional probabilities) or linear pooling remain coherent alternatives justified within standard probability theory and EUT. The geometric approach offers a different, sometimes valuable perspective, but not one demonstrably forced upon the agent by the temporal structure of belief formation in the way multiplicative betting dynamics force geometric growth considerations.

  **The Verdict: Necessary for the Multiplicative Marathon, Optional Elsewhere**

  The ergodicity economics argument delivers a powerful and largely successful blow to standard expected-value reasoning **specifically for agents facing repeated multiplicative bets over an indefinite horizon.** In this domain, it convincingly demonstrates that maximizing the geometric growth rate (via Kelly or equivalent) is not merely one rational preference among others, but a **dynamic necessity for any agent whose goal is the sustainable growth of their wealth.** Ignoring the geometric mean isn't expressing a different risk preference; it's fundamentally misapprehending the mathematics governing their future trajectory. Samuelson's preference sovereignty is overridden here because the dynamics *define* the metric relevant to the stated goal (long-term wealth growth). Using arithmetic mean optimization is not just suboptimal; it leads to predictions and outcomes fundamentally at odds with the agent's actual experience.

  However, this imperative is tightly bound to the context of **repeated multiplicative processes over time.** Samuelson's core insistence on the subjectivity of utility regains its force in static, additive, or finite-horizon contexts, and especially when we move beyond wealth dynamics. Garrabrant's geometric rationality provides a fascinating and often valuable generalization of the geometric averaging principle, offering novel solutions in bargaining, belief aggregation, and potentially other areas. It highlights the limitations of the independence axiom and the sometimes-arbitrary nature of additive aggregation. Yet, without the anchoring force of temporal dynamics and the demonstrable divergence of time and ensemble averages, these extensions remain compelling normative frameworks or useful mathematical tools, not non-optional laws of rationality. Geometric rationality flourishes as a powerful paradigm, but its claim to unique necessity fades once it leaves the fertile ground of compounding multiplicative growth.
