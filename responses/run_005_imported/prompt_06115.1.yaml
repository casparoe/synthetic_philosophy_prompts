  Third, Sleeping Beauty and its link to SIA. If being a thirder is SIA-like, does that lead to presumptuous conclusions? The guest might separate the two, claiming Sleeping Beauty is about centered propositions. The follow-up should probe if the underlying principle is the same and why it doesn't generalize to problematic cases.

  The user needs eight questions, each with a follow-up. They want to cover the three areas mentioned, so I'll distribute the questions accordingly. At least one per area, but likely more. The questions must be specific and avoid generic topics. Also, anticipate the guest's answers and prepare pointed follow-ups.

  Structure the questions to build pressure. Start with foundational SIA mechanics, move to implications in thought experiments, then tackle reference class and Sleeping Beauty. Each question should reference her previous work or common defenses. For example, question 1 on the presumptuous philosopher, forcing her to explain why it's not a bug. Follow-up on whether empirical evidence becomes irrelevant.

