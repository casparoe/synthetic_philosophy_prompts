  The paradox in its classic form:
  There are two envelopes. One has an amount X and the other has 2X. You pick one at random. You open it and see an amount Y. Now, you are offered the chance to switch to the other envelope. 

  The fallacious reasoning:
  With probability 1/2, the other envelope has 2Y (if you picked the smaller one) and with probability 1/2, it has Y/2 (if you picked the larger one). So the expected value of switching is:
  (1/2)*(2Y) + (1/2)*(Y/2) = (1/2)*(2Y + Y/2) = (1/2)*(5Y/2) = 5Y/4 > Y.
  So it seems you should always switch.

  But we know that's absurd because if you switch, the same argument applies to the new envelope and you would want to switch back, and so on.

  The usual resolution: 
  The flaw is that Y is not fixed in the way the reasoning assumes. When you see Y, it could be either the smaller or the larger amount. The above calculation assumes that regardless of Y, the two possibilities (half or double) are equally likely. But that requires that the prior distribution on X be such that it is equally likely for X to be any positive real number (or any positive integer if we are discrete) and that is impossible because a uniform distribution over an infinite set (like the positive reals) cannot be normalized.

