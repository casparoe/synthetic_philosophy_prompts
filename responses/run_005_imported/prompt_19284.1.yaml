  For the dialogue, I need two characters: one emphasizing cluelessness as a fundamental problem (let's call them Alex), and the other defending actionable ethics despite uncertainty (Sam). Alex should argue that unknown effects might systematically dominate and undermine confidence. Sam must counter without hand-waving, addressing the systematic risk.

  Key points for Alex: 
