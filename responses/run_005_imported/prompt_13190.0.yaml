answer: |-
  You've pinpointed a profound asymmetry that exposes a core limitation in individualist accounts like Bratman's. While Bratman provides an excellent descriptive framework for *how* coordination happens, he struggles to capture the *normative force* and *structural bindingness* inherent in genuine joint action. Gilbert is right: the phenomenon you describe – the inability to unilaterally dissolve the commitment and the distinctive sense of being wronged by unilateral withdrawal – requires positing a *sui generis* joint commitment. Here's why Bratman's apparatus, even supplemented by Scanlon-style assurance norms, cannot reconstruct this asymmetry:

  1.  **The Dissolution Problem: Unilateral Rescission vs. Unanimity Requirement**
      *   **Bratman/Scanlon:** On this view, my obligation stems from my individual intention plus the knowledge that others are relying on my continued participation based on that intention and our meshing sub-plans. If I change my mind, I *can* rescind my individual intention. While I have a Scanlonian duty to *inform* others promptly (to avoid harm from reliance) and perhaps even a duty to *consider* their reliance when deciding *whether* to change my mind, I ultimately *can* withdraw my participation unilaterally. The obligation not to exploit expectations is an obligation *owed to each individual separately* based on the harm/disappointment *my individual action* causes *them individually*. Dissolution happens de facto when enough individuals rescind their individual intentions, causing the mutual knowledge and meshing to collapse.
      *   **The Asymmetry:** This fails to explain why dissolution *requires the concurrence of all*. Why can't I just announce, "I rescind my intention," fulfilling my Scanlonian duty to inform, and walk away? According to Bratman/Scanlon, I've done my part – I've avoided *exploiting* their reliance by informing them. Yet, in your sofa-moving/band scenario, this unilateral rescission feels illegitimate *even if I inform them*. The remaining participants feel the *joint endeavor itself persists*, demanding their collective agreement to end it. They feel *they* are still committed *to each other* and to the *shared activity*, not just individually obligated *to me* based on my now-rescinded intention. Only Gilbert's joint commitment, where the commitment is *ours* and belongs to *no single individual*, explains why only *all of us together* can dissolve *it*.

  2.  **The Normative Force Problem: Wronging the Group vs. Disappointing Individuals**
      *   **Bratman/Scanlon:** The obligation here is fundamentally *dyadic*: I owe *you* (and *you*, and *you*) an obligation not to harm you by knowingly creating and then frustrating reliance. The wrong is located in the harm/disappointment caused *to each individual separately*. Rebuke is justified based on the *individual harm* I caused *to each rebuker*. The norm is essentially a prohibition against a specific kind of harmful individual action (reneging on induced reliance).
      *   **The Asymmetry:** This fails to capture the distinctive nature of the rebuke in joint action. When someone drops out of moving the sofa, the rebuke isn't *just* "You really inconvenienced *me*" or "You made *me* do more work." It's "You let *us* down," "You abandoned *us*," "You broke *our* effort." The sense of being wronged is directed at the person *as a participant in the joint commitment*, not merely as an individual causer of harm. The rebuke comes *from the group position* – the remaining members speak, implicitly or explicitly, *as the plural subject* whose commitment was violated. The wrong is to *us*, not just to *me* and *him* and *her* separately. Bratman/Scanlon reduces the wrong to a series of individual harms, missing the *collective* nature of the enterprise and the violation. Gilbert's joint commitment explains this directly: the defector violates an obligation owed *to the plural subject* constituted by the joint commitment itself.

  3.  **The Persistence of Obligation Problem: Beyond Changing Individual Preferences**
      *   **Bratman/Scanlon:** My obligation is contingent on my *current* intention and the *current* reliance of others. If my intention changes (even if just due to whim or finding something more appealing), my Scanlonian obligation is primarily to mitigate harm by informing others. Once I do that, my core obligation dissipates. My intention is revisable based on my individual reasoning.
      *   **The Asymmetry:** In joint action, the obligation often *feels* like it persists *despite* my changing individual preferences. I might *want* to stop moving the sofa, but I feel I *can't* just walk away without the group's agreement. The commitment binds me *as a participant* in a way that my purely personal intentions do not. Bratman/Scanlon explains why it might be *impolite* or *harmful* to leave, but not why it feels like a *breach of commitment* that requires collective release. Gilbert's joint commitment creates an obligation that is distinct from and can *constrain* my individual will – it binds me *because I am part of the "we"*. Rescinding requires not just changing my mind, but *releasing the group from the joint commitment*, which requires the concurrence of the other parties to that commitment.

  4.  **The "No Promise Required" Problem:**
      *   **Bratman/Scanlon:** Crucially, they argue the obligation arises *without a promise*. This is correct for the phenomena you describe. However, they ground the obligation *elsewhere* – in the moral norm against harming via frustrated reliance. This is an *external* moral principle applied *to* the individuals involved.
      *   **Gilbert:** She agrees no explicit promise is needed. However, she argues the obligation is *internal* to the joint commitment itself. The act of jointly committing *creates* the normative relation between the parties *as* a plural subject. The obligation is generated by the *structure of the commitment*, not imported from an external moral principle about reliance. This explains why the obligation feels *specific to this joint activity* and *to these specific co-participants* in a way that a general reliance-based duty does not fully capture. The rebuke is grounded in *this specific commitment we made together*, not (only) in a general moral rule.

  **Conclusion:**

  While Bratman provides a powerful account of the cognitive and planning machinery enabling coordination, and Scanlon's assurance norm adds a crucial layer explaining why creating reliance creates *some* obligation, this combined apparatus remains resolutely *individualist*. It explains obligations *between individuals* based on individual states (intentions) and actions (inducing reliance). It cannot reconstruct the distinctive phenomena you observe:

  *   The **unanimity requirement for dissolution**: Why the group, not the individual, "owns" the commitment.
  *   The **distinctive entitlement to rebuke**: Why the rebuke targets the violation of the *joint* commitment ("us") rather than just individual harm ("me").
  *   The **binding nature on individual will**: Why the commitment persists as an obligation *despite* changing individual preferences, requiring collective release.

  These phenomena point to an obligation grounded not in individual intentions plus external moral rules, but in the *relational fact* of having entered into a joint commitment. This commitment constitutes the participants as a "plural subject" with its own normative structure, where obligations are owed *to the collective entity* by its members. Only Gilbert's concept of a *sui generis* joint commitment, irreducible to individual intentions and dyadic moral norms, adequately explains the asymmetry between revisable personal plans and the collectively binding nature of shared activities like moving a sofa or playing in a band. The feeling of being genuinely wronged arises precisely because a commitment of *ours*, not just *yours* and *mine*, has been broken.
