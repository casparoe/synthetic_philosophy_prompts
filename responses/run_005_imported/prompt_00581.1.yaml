answer: |-
  ## The Constructed Man

  The fire in the grate spat, mirroring the simmering outrage in Thomas Hobbes’s chest. Outside, a raw English December gnawed at the windows of Hardwick Hall. Inside, the frail frame of the 91-year-old philosopher seemed dwarfed by the high-backed chair, yet his spirit remained unnervingly large, coiled and defiant. Before him lay the latest insult: a pamphlet by John Wallis. Again. The man was a gadfly, a malicious pedant, a *geometer* who understood nothing of *philosophy*.

  Hobbes’s knotted hand trembled as he traced the opening lines. *"Mr. Hobbes, persisting in his Geometrical Delusions, offers yet another fallacious Quadrature..."* He could hear Wallis’s dry, superior voice in the words. Twenty-five years. A quarter-century of this public flogging over circles and lines. He’d squared it. He *knew* he had. The solution shimmered in his mind with the same crystalline certainty as the definitions in *Leviathan*.

  That was the unbearable rub. Geometry was the bedrock. *"The only Science that it hath pleased God hitherto to bestow on mankind,"* he had written. Why? Because we *make* it. A point, a line, a circle – these weren't vague notions observed in the messy world; they were *defined*, *constructed* by human reason. We bring them into precise being, and thus, we can know them absolutely. Just like the State. The Leviathan wasn't found in nature; it was *constructed* by covenant, by reason, by human will. Therefore, its workings, its rights, its obligations – these too could be known with geometric certainty.

  He picked up his compass, the brass cold against his papery skin. With meticulous care, ignoring the arthritic protest in his joints, he pricked a point on the fresh sheet. *Definitio*. The beginning. He drew a circle, the line wobbling slightly, imperfect. He frowned. The *idea* was perfect. The construction… sometimes the hand betrayed the mind. Just as Wallis betrayed reason.

  He recalled the first "proof," decades ago, the flush of triumph. How elegantly the ratios had aligned! Then Wallis, that Oxford upstart, had dissected it like a frog, pointing out the unacknowledged approximation, the subtle assumption smuggled in like contraband. Each subsequent attempt – fueled by Hobbes’s deepening conviction that Wallis was not merely wrong, but actively *malicious* in his refutations – met the same fate. Public ridicule. Pages of dense, contemptuous mathematics. Wallis accused him of ignorance, of refusing to learn. Hobbes accused Wallis of obfuscation, of protecting the priestly mysteries of mathematics.

  He dipped his quill. *"Wallis,"* he began, the ink flowing thick and black, *"confounds his own obfuscation with my clarity. He mistakes the architect for the bricklayer..."* His pen hovered. A droplet of ink fell, blurring the word 'architect'.

  A cold dread, sharper than the December air, pricked him. *What if Wallis was right?*

  The thought was treason. Not just to his pride, but to his entire edifice of thought. If the human mind, constructing its own perfect objects, could be so profoundly, persistently wrong about them… what did that say about the State? If he couldn't reliably construct a simple circle's equal square, how could he claim to have constructed the infallible logic of sovereignty? Was the Leviathan, that magnificent artificial man, built on foundations as flawed as his quadrature? Was it all just… approximation? Wishful thinking? A grand delusion exposed by a stubborn circle?

  He looked at the wobbly circle on the page. It mocked him. It was *not* the ideal circle of his definition. It was a crude, mortal thing. Like the state – perpetually threatened by rebellion, stupidity, the unpredictable chaos of men. Had he merely *defined* it into certainty, ignoring the messy construction?

  No. The dread was weakness. Wallis’s poison. Geometry *was* certain. The State *could* be known. His failure wasn't proof of the impossibility; it was proof of Wallis’s perversity, of the difficulty of the problem, of… of the frailty of the *hand*, not the *mind*! The *idea* remained sound. The construction *in principle* was possible. His definitions were correct.

  He slammed his frail fist on the desk, making the compass jump. The pain shot up his arm. *Definitio. Constructio. Certitudo.* Definition. Construction. Certainty. It *had* to hold. For geometry. For politics. For everything.

  He took a shuddering breath, the air rattling in his chest. He would not yield. Not to Wallis. Not to doubt. Not to the creeping cold. He pulled a fresh sheet towards him, the pristine whiteness a challenge. His hand steadied. He picked up the compass again, the point gleaming in the firelight. He would find the construction. The perfect, rational solution. He *had* to. The certainty of the world he had built depended on it.

  The point touched the paper. Outside, the wind howled, but Thomas Hobbes, hunched over his desk, began to draw once more. The circle, this time, was a little less steady. The lines reaching for its impossible square, a little more tremulous. The silence of the room was broken only by the scratch of the quill and the old man’s labored breathing, a counterpoint to the relentless, silent demolition happening in the unread pages of Wallis’s pamphlet beside him. The constructed man built on, brick by fragile brick of defiance, against the rising tide.
