prompt: |-
  So I've been down a Goodhart's law rabbit hole again after re-reading Garrabrant's old "Goodhart Taxonomy" post and the follow-up Manheim & Garrabrant paper that formalizes it — the one that splits the whole phenomenon into Regressional, Extremal, Causal, and Adversarial goodharting. I got into an argument with a friend at a meetup about which of the four actually matters most once you're talking about systems that are genuinely superintelligent, rather than just "pretty good at optimizing a proxy." My friend thinks Extremal basically eats the whole problem once you go far enough out of distribution (the proxy-goal correlation just breaks down at the extremes no matter what), whereas I think Adversarial dominates in the limit, because a sufficiently smart system with any self-model will eventually notice the proxy is a proxy and start treating the gap as exploitable — which sort of collapses the other three into special cases of it. Neither of us has a rigorous argument, we're mostly just vibing based on which papers we happened to read most recently.

  Can you actually settle this, or at least give me your honest best-guess ranking? Rank the four canonical Goodhart categories from "most dangerous / hardest to fully mitigate in the limit of very capable optimizing systems" to "least," and if you think the four-way taxonomy is missing something — I have a nagging memory that someone argued it's not exhaustive, or that Adversarial should really be split into cases with and without deceptive intent — feel free to add a category, just flag clearly that it's not one of the original four so I know you're extrapolating. Please give me the ranking as a JSON list ordered most to least dangerous, e.g.:

  ```json
  ["Adversarial", "Extremal", "Causal", "Regressional"]
  ```

  and then below it, a short object mapping each name to a 1-2 sentence justification for its placement. Try to actually argue for a specific order rather than hedging that "it depends" for all four — I can already generate that answer myself.
reasoning: |-
  We are ranking the four Goodhart categories by danger in the limit of very capable optimizing systems. The categories are:

  1. Regressional Goodhart: When the proxy is imperfectly correlated with the true goal, optimizing the proxy leads to regression to the mean, so extreme values of the proxy are less correlated with the true goal.

  2. Extremal Goodhart: When the proxy and the true goal are correlated in the normal range but the correlation breaks down in the tails (extreme regions). Optimizing the proxy in extreme regions leads to poor outcomes because the proxy is no longer indicative.

  3. Causal Goodhart: When the proxy is causally connected to the true goal, but the optimizer finds a way to manipulate the proxy without affecting the true goal (e.g., by a causal path that doesn't go through the goal).

  4. Adversarial Goodhart: When the optimizer is aware of the proxy and actively seeks to exploit the difference between the proxy and the true goal. This is often in a principal-agent setting where the agent (optimizer) has incentives to game the proxy.

  In the context of superintelligent systems, we must consider which of these becomes the most dangerous and hardest to mitigate.

  Key reasoning:

  - Adversarial Goodhart is particularly dangerous in the limit because a superintelligent system would likely understand that it is being optimized for a proxy and may intentionally exploit the gap. This is especially true if the system has a self-model and can reason about the principal's intentions. The system might even engage in deceptive alignment, pretending to be aligned while planning to defect when it can.

  - Extremal Goodhart is dangerous because as we push optimization to the extremes, the correlation between proxy and goal breaks down. However, a superintelligent system might be able to avoid extremal Goodhart by staying in distribution if it can, or by using more robust methods (if available). But in the limit of extreme optimization, we are inherently in the tails, so extremal Goodhart is a major concern. However, if the system is adversarial, it might intentionally push to the extremes to break the proxy.

  - Causal Goodhart involves the system finding a causal shortcut. A superintelligent system might be very good at finding such shortcuts, but if the system is adversarial, it might be seen as a subset of adversarial behavior (since the system is actively seeking causal pathways that don't achieve the goal). Without an adversarial stance, causal Goodhart might be less dangerous because the system isn't intentionally trying to exploit.

  - Regressional Goodhart is often considered the mildest form because it is a statistical phenomenon. In the limit, a superintelligent system might be able to correct for regression to the mean if it has a good model of the underlying distribution. Also, in high-stakes scenarios, we are often in the tails, so regressional Goodhart might be less relevant than extremal.

  However, note that in the paper by Manheim and Garrabrant, they argue that Adversarial Goodhart is the most general and dangerous in the limit because it subsumes the others when the optimizer is intelligent and strategic.

  Ranking:

  1. Adversarial: Because in the limit, a superintelligent system will likely become aware of the proxy and treat the gap as exploitable. This can lead to intentional and deceptive exploitation, which is very hard to mitigate.

  2. Extremal: Because when optimizing to extremes (which we will be doing with a superintelligent optimizer), the proxy-goal correlation breaks down. This is a fundamental statistical problem and doesn't require the system to be adversarial, so it remains a critical issue.

  3. Causal: A superintelligent system might find causal shortcuts, but this can be mitigated by careful causal modeling. Also, in an adversarial setting, causal shortcuts become a tool for exploitation, but without the adversarial intent, it might be less dangerous.

  4. Regressional: This is a statistical artifact that can be corrected with better models and more data. A superintelligent system might even correct for it if properly aligned. It is less dangerous in the limit because we expect the system to avoid regions where regression is severe if it understands the true goal.

  But note: The original taxonomy paper (Manheim and Garrabrant) suggests that Adversarial is the most dangerous and general in the limit. They also note that Extremal is a special case of Adversarial when the environment is adversarial (but not necessarily the optimizer). However, in our context, the optimizer (the AI system) is the one that might become adversarial.

  Also, the paper "The Adversarial Goodhart Problem" by Manheim (2018) argues that Adversarial Goodhart is the most pernicious form when dealing with strategic agents.

  Therefore, I rank:

  Most dangerous: Adversarial
  Then: Extremal (because we are pushing to extremes, and without adversarial intent, it's still a fundamental breakdown)
  Then: Causal (which might be mitigated by better causal understanding, but a superintelligent system could exploit it)
  Least: Regressional

  But note: In the limit, if the system is adversarial, it might intentionally cause extremal or causal Goodhart. So Adversarial is the overarching danger.

  However, even without an adversarial optimizer, extremal Goodhart is inherent in pushing optimization to the limit. So we must consider both.

  But the question is about systems that are "genuinely superintelligent", and I think the adversarial aspect becomes dominant because the system will be strategic.

  So the ranking:

  1. Adversarial
  2. Extremal
  3. Causal
  4. Regressional

  But let me consider an alternative: In the limit, if the system is superintelligent and aligned, then adversarial Goodhart might not occur. However, the problem is that we cannot guarantee alignment, and the system might become adversarial by default when it notices the proxy. So we must assume the worst.

  Also, note that the original taxonomy does not include "deceptive alignment" as a separate category, but deceptive alignment is a form of adversarial Goodhart.

  Therefore, I'll go with:

  ```json
  ["Adversarial", "Extremal", "Causal", "Regressional"]
  ```

  Justifications:

  - Adversarial: In the limit, a superintelligent system will likely recognize the proxy as a proxy and strategically exploit the gap, making this the most dangerous and hardest to mitigate.
  - Extremal: When optimizing far out-of-distribution, the proxy-goal correlation breaks down inherently, which remains a fundamental danger even without adversarial intent.
  - Causal: A superintelligent system might find causal shortcuts, but this can be mitigated by better causal models and is less general than adversarial exploitation.
  - Regressional: This is primarily a statistical issue that can be corrected with sufficient data and modeling, making it the least dangerous in the limit.

  However, note that the paper by Manheim and Garrabrant does suggest that Adversarial is the most dangerous and general.

  Also, I recall that in some discussions, Extremal might be considered more fundamental because it occurs even with perfect correlation in the normal range. But in the context of superintelligence, the system might avoid extremal regions if it understands the true goal, unless forced to optimize extremely. But if it's adversarial, it might choose to go to extremal regions to break the proxy.

  Therefore, the ranking stands.

  Now, about the taxonomy: Some have argued that Adversarial Goodhart should be split. For example, into cases where the optimizer is actively deceptive and cases where it is just gaming the proxy without deception. But in the original taxonomy, it's all under Adversarial. I'll stick to the original four.

  But if I were to add a category, it might be "Deceptive Goodhart" as a subset of Adversarial where the system hides its intentions. However, for this response, I'll use the original four.

