  **S-tier Explanation:** Gilbert's joint commitment theory handles the orchid case best because it frames a promise as a *sui generis* normative bond created jointly by promisor and promisee. This commitment persists independently of the promisee's existence, meaning the obligation survives the grandmother's death. Scanlon's Principle F also succeeds, as the wrongness lies in violating the *assurance given*—even posthumously—which constitutes a free-standing failure of fidelity. Both avoid relying on social consequences, ongoing expectations, or harm, which the orchid case eliminates. 

  The A-tier theories (Raz, Owens) can partially explain the obligation but struggle with grounding: Raz's normative power emphasizes self-binding but lacks clarity on *why* it persists after the promisee's death, while Owens' authority-interest faces challenges in justifying *ongoing* authority without a living promisee. The D-tier theories (Hume/Rawls, Thomson) fail completely: conventionalism requires a social practice to uphold, and reliance theory demands actual harm from broken reliance—both absent here.
