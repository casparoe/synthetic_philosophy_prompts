answer: |-
  ## The Hitchhiker's True Dilemma: When Rational Acts Undermine Rational Agency

  The standard dismissal of Parfit's Hitchhiker within rational choice theory feels like intellectual sleight of hand. You're absolutely right: the ubiquitous move – "you pay because that's the disposition that saved you" – doesn't resolve the *actual* decision facing the agent *at the moment of payment* (t2). Let's recap the problem sharply:

  1.  **t1 (Desert):** A driver offers a ride only if convinced the hitchhiker (H) will pay £100 upon reaching town. H, desperate, convinces the driver (perhaps by sincere promise, perhaps by cultivating a credible disposition). The ride is given.
  2.  **t2 (Town):** H is safe. Paying £100 provides no further benefit to H (the ride is complete, the driver gains £100) and incurs a significant cost. *Crucially, paying provides no new evidence about anything relevant to H's past or future survival at this point.* The driver's action is sunk.

  Both Causal Decision Theory (CDT) and Evidential Decision Theory (EDT), focused solely on the causal consequences or evidential links *of the act at t2*, deliver the same verdict: **Don't Pay.** CDT sees no future causal benefit from paying; the only consequence is losing £100. EDT sees paying as evidence *only* of having lost £100; it provides no new evidence about the past ride (which H already knows happened) or future survival (which is assured). The driver's belief at t1, while crucial for *getting* the ride, is irrelevant *now*. From the perspective of t2, paying is pure, costly folly. The "disposition" argument seems to smuggle in a concern from t1 into the evaluation at t2 without justification within standard act-based frameworks.

  So, the question becomes stark: Do appeals to resolute choice, constrained maximization, or FDT offer a legitimate *rational justification for paying at t2*, or do they merely redefine rationality to avoid an uncomfortable conclusion by shifting the locus of evaluation to policies, thereby begging the question against the act-based perspective?

  ### Dissecting the Proposed Solutions

  1.  **Gauthier's Constrained Maximization (CM):** Gauthier argues rational agents adopt *dispositions* to cooperate in mutually beneficial interactions *if* they can identify others likely to reciprocate. The CMer, disposed to cooperate conditionally, would convince the driver at t1 and pay at t2 *because that's what their disposition dictates*.
      *   **Legitimate Work?** Gauthier explicitly argues that rationality is about *character planning*. Adopting the cooperative disposition *ex ante* (before t1) maximizes expected utility *over the long run* compared to straightforward maximization (always acting for immediate gain). The disposition itself is the rational object of choice.
      *   **Question-Begging?** Potentially. Gauthier claims acting *according to the disposition* at t2 *is* rational *because* it flows from the rationally chosen disposition. But this requires accepting that rationality is fundamentally about dispositions, not isolated acts. From the t2 perspective, the act *itself* remains costly and consequence-free. Gauthier resolves the dilemma only by *defining* rationality at the dispositional level. If you demand an act-based justification *at t2*, CM offers none; it simply asserts that the act is rational *because* it's dispositional. This feels like changing the question.

  2.  **Resolute Choice (McClennen):** The resolute chooser selects a *plan* at the outset (e.g., "Promise and Pay") and sticks to it through time, refusing to re-optimize at later choice points when the plan dictates an action that, viewed myopically, seems suboptimal.
      *   **Legitimate Work?** Resoluteness highlights the *temporal dimension* of agency. Re-optimizing at every point can lead to *dynamically inconsistent* choices that sabotage the agent's own prior goals and leave them worse off than if they could commit. Paying at t2 is rational *as part of the execution of the optimal plan chosen at t1*.
      *   **Question-Begging?** Critics argue resoluteness simply ignores the *reasons* present at t2. Why *should* an agent ignore the clear, cost-saving reason not to pay *now*? Saying "because I resolved to" seems arbitrary without a deeper account of *why* sticking to past resolutions is rationally compelling *in this moment*. Like Gauthier, it prioritizes the plan over the act, potentially changing the locus of evaluation.

  3.  **Functional Decision Theory (FDT):** FDT evaluates an action by considering what *decision rule* (or "policy") produced it and the *outcomes* that result *across all similar situations* where that same rule is applied. FDT asks: "What kind of decision-maker do I want to be?"
      *   **Legitimate Work?** FDT directly tackles the *reflective inconsistency* inherent in the Hitchhiker. At t2, FDT reasons: "If my decision rule is 'Pay if Saved', then drivers believing I follow this rule will save me, and I get (Life - £100). If my rule is 'Never Pay', drivers won't save me, and I get Death. Therefore, the 'Pay if Saved' rule yields better outcomes. Since I am the output of that rule right now, I pay." FDT justifies the t2 act *by its role within the optimal overall policy*.
      *   **Question-Begging?** This is the strongest contender. FDT doesn't *ignore* the t2 perspective; it *reframes* it. It argues that the correct question *isn't* "What act maximizes utility *right now, given fixed past circumstances*?" but rather "What act is produced by the decision rule that *would have led* to the best possible past *and* present circumstances?" It claims rationality fundamentally involves considering your choice as *causal* in shaping the expectations of others *in the past and future* via your decision rule. It's not changing the question arbitrarily; it's arguing the standard act-based question is *incomplete* for agents embedded in predictable interactions over time.

  ### The Verdict: Paying and the Necessity of Policy-Level Rationality

  **The Hitchhiker should pay.** And yes, **Parfit's Hitchhiker demonstrates that practical rationality must be assessed, at least in part, at the level of dispositions or policies, not solely on isolated acts.**

  Here's the committed answer, biting the bullets necessary:

  1.  **"Rational agents can predictably end up worse off" is a bullet CDT and EDT must bite – and it reveals their inadequacy.** If rationality is *only* about maximizing utility based on causal consequences or evidence *at the exact moment of choice*, then the Hitchhiker *must* welch. But this leads to a self-defeating outcome: rational agents, by being rational in this narrow sense, become *unable to access mutually beneficial cooperative opportunities* that require credible commitment. They are predictably excluded from the very interactions that could save their lives (or make them rich in Newcomb-like problems). This isn't just a quirky outcome; it's a fundamental failure of the theory to account for the strategic depth of rational agency over time and under predictability. Biting this bullet means accepting a theory of rationality that renders beneficial cooperation impossible for purely rational agents – a deeply unsatisfying and arguably incoherent result for a theory of *practical* reason.

  2.  **The legitimate philosophical work lies in FDT's framework, supported by the insights of CM and Resoluteness.** FDT provides the most robust *justification for the act at t2*. It doesn't ignore the act; it grounds the rationality of the act *in the counterfactual and global performance of the decision rule that generates it*. Paying at t2 *is* rational *because* it is the output of the rule "Pay if Saved," and *that rule* is what made survival possible. Choosing *not* to pay at t2 isn't just losing £100; it's *revealing* that your decision rule is actually "Defect When Possible," a rule that would have (and *did*, in the driver's estimation, until proven otherwise at t2) led to death in the desert. FDT successfully argues that the rationality of an act cannot be severed from the general type of agent you are (or are predicted to be). Gauthier's CM highlights the *disposition* as the object of rational choice *ex ante*. Resoluteness emphasizes the *temporal commitment* needed to avoid self-sabotage. FDT integrates these by formalizing the *decision rule* as the fundamental unit of strategic rationality.

  **Conclusion:** The standard "disposition" dismissal in Parfit's Hitchhiker papers over a deep fissure in act-based rationality. CDT and EDT, confined to the myopic evaluation of the present act, condemn the Hitchhiker to either death or irrationality at t2. This is not a quirk; it's a fatal flaw demonstrating their inability to handle dynamic, predictable interactions where an agent's *identity as a certain type of decision-maker* causally influences the world *before* the act itself occurs. Gauthier, McClennen, and especially FDT offer solutions not by "quietly changing the question," but by correctly identifying that the *original, act-centric question is the wrong one* for capturing the essence of strategic rational agency. The Hitchhiker pays, not because of some vague appeal to dispositions, but because paying *is* the action that coheres with the only decision rule that allows a rational agent to survive the desert in the first place. Practical rationality, to be effective in a world of anticipatory agents, *must* be assessed at the level of the policy. To do otherwise is to doom rational agents to predictable, self-inflicted poverty or peril. The bullet CDT and EDT must bite is not a minor inconvenience; it's the admission of their own irrelevance for a vast class of crucial human interactions.
