prompt: |-
  I'm a software engineer, and at a recent planning meeting a colleague justified our team's policy of never ending an A/B test early — on the grounds that 'more data can only help' — by invoking Good's theorem on the value of information: the result, due to the statistician I. J. Good, that a rational Bayesian agent should never expect a free look at more evidence to leave them worse off than deciding without it. Before I either push back on this reasoning or adopt it myself, I'd like to understand it properly. Please describe the most important implications of Good's theorem for how an engineering team should decide when it's actually worth gathering more information — running an experiment longer, adding instrumentation, commissioning user research — versus just committing to a decision now. In particular, be explicit about which of the theorem's idealizing assumptions my colleague's argument is quietly relying on, and about the kinds of real workplace conditions under which those assumptions are likely to fail.
