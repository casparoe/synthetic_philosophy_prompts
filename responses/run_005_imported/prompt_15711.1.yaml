  ## Memorandum: Faculty Panel Recommendation Regarding Nonfiction Thesis Ethics

  **To:** Program Director, [MFA Program Name]  
  **From:** Faculty Review Panel (Fiction/Nonfiction Tracks)  
  **Date:** [Current Date]  
  **Subject:** Recommendation on Student Thesis [Student Name/ID] & Proposed Nonfiction Disclosure Policy  

  **I. Introduction**  
  This memo outlines the panel's recommendation regarding the thesis submission by [Student Name] and proposes a program-wide disclosure policy for creative nonfiction. We reviewed the thesis, the complaint from the family member, the student's defense, and relevant ethical considerations within the genre. While acknowledging the complexities inherent in memoir, the panel finds that **the student's substantive fabrications cross an ethically defensible boundary for work presented as nonfiction.** Our primary recommendations are: conditional thesis approval requiring significant revision/disclosure, withdrawal of the journal publication in its current form, and implementation of a mandatory disclosure policy for future nonfiction work.

  **II. Panel Findings & Recommendation for This Thesis**

  1.  **Assessment of the Fabrications:** The panel acknowledges the student's technical skill and the journal's initial acceptance. However, we find the three contested scenes represent **substantive invention, not reconstruction or compression.** The deathbed reconciliation, fictional suicide attempt, and fundamentally altered courtroom outcome are not matters of "filling in gaps" or rendering dialogue based on recalled substance; they are core events invented *ex nihilo* to serve narrative and emotional ends. As one panelist aptly noted, there is a qualitative difference between reconstructing a conversation that occurred and inventing the *occurrence and outcome* of a significant event itself.

  2.  **Genre Expectations & Reader Contract:** Nonfiction, particularly memoir, carries an implicit contract with the reader: the events described *happened* in essence, even if details of dialogue, setting, or sequence are rendered artistically. The student's defense ("memoir has never been stenography," citing syllabus examples) is valid *in part* and is addressed seriously below (Section IV). However, **inventing pivotal, emotionally charged events (a reconciliation, a suicide attempt, a legal outcome) breaches this contract.** Readers of the journal excerpt believed they were encountering lived reality, a belief actively invited by the nonfiction label and the work's presentation. Augustine's point on *intent to deceive* is relevant: the text presented these inventions *as factual occurrences*, intending the reader to believe them as such. This distinguishes it from acknowledged speculation or clearly signaled imaginative passages.

  3.  **Impact & Harm:** The harm caused to the family (specifically the grandmother's sister) is real and demonstrates the potential consequences of such fabrications when presented as fact. It undermines trust in the writer, the program, and the genre.

  4.  **Specific Recommendation:**  
      *   **Thesis Approval:** Conditional upon **significant revision.** The student must either:
          *   Remove the three fabricated scenes entirely, or
          *   Revise the work with **explicit, prominent disclaimers** integrated directly into the text (e.g., footnotes, prefatory notes within the essay itself) clearly identifying these specific scenes as "composite," "speculative," "representative imaginings," or "invented for thematic resonance," *not* factual records. A generic "some details changed" is insufficient. The revised thesis must include a **foreword** explicitly outlining the author's approach to truth-telling and the nature of any significant deviations from strict factuality.
      *   **Journal Publication:** The currently accepted version **must be withdrawn** from publication. The journal may consider the *revised* thesis version *only* if it incorporates the explicit disclaimers described above and the journal agrees to publish it with appropriate context (e.g., an editor's note on the piece's approach to truth). The program should facilitate communication between the student and the journal editor regarding this decision.
      *   **Student Meeting:** The Program Director should meet with the student to explain the decision, emphasizing the distinction between accepted craft techniques and substantive fabrication, the importance of reader trust, and the real-world impact of their choices. This should be framed as a crucial learning moment about professional ethics.

  **III. Proposed Program Disclosure Policy for Nonfiction**

  To prevent recurring ad-hoc litigation and provide clear guidance, the panel **strongly recommends implementing a mandatory disclosure policy for all nonfiction workshop submissions and theses:**

  1.  **Submission Cover Sheet:** All nonfiction submissions (workshop pieces, thesis drafts, final theses) must include a **standardized cover sheet** requiring the author to:
      *   **Categorize the Work:** Select the most applicable label (e.g., Literary Journalism, Memoir, Personal Essay, Lyric Essay, Hybrid, Speculative Nonfiction).
      *   **Disclose Significant Deviations:** Explicitly state if the piece contains any:
          *   **Composites:** Characters or events combining elements from multiple real people/events.
          *   **Compression/Conflation:** Significant alterations to timelines or the merging of multiple events into one.
          *   **Reconstructed Dialogue/Scenes:** Scenes based on memory/evidence but where specific words/actions cannot be known precisely.
          *   **Substantive Inventions:** Events, outcomes, or interactions that did not occur but are presented as factual narrative. *(This is the critical category relevant to the current case).*
      *   **Specify Nature of Invention (if applicable):** For any "Substantive Inventions," the author must briefly describe what was invented and why (e.g., "The courtroom verdict was altered to emphasize X theme," "The conversation with my grandmother on her deathbed is imagined based on my wish for reconciliation").
      *   **Note Omissions:** Significant omissions of fact relevant to understanding the narrative.

  2.  **Foreword Requirement (Thesis):** All final nonfiction theses must include a **brief foreword** outlining the author's approach to truth-telling, referencing the cover sheet disclosures if applicable, and clarifying the work's relationship to factual events for the reader.

  3.  **Workshop Discussion:** Faculty leading nonfiction workshops must explicitly discuss this policy at the start of each term, emphasizing its purpose: not to stifle creativity, but to foster ethical awareness, clarify reader expectations, and ground critique in a shared understanding of the work's factual basis. Discussions about *why* an author chose a certain approach (e.g., using a composite) become part of the craft dialogue.

  **IV. Serious Engagement with "All Memoir Invents a Little"**

  The panel acknowledges and takes seriously the argument, strongly held by one member, that contemporary creative nonfiction inherently involves invention beyond mere stenography, and that drawing lines can feel arbitrary. This view correctly identifies that:

  *   **Memory is Fallible:** Strict factual accuracy is often impossible; memoir renders subjective experience.
  *   **Craft Demands Shaping:** Selection, compression, emphasis, and narrative structure are essential tools. Reconstructing dialogue or setting based on research and memory is standard practice.
  *   **"Emotional Truth" is Valued:** The power of memoir often lies in conveying an inner reality or universal resonance, which can sometimes be best served by techniques beyond strict reportage, especially in lyric or braided forms.
  *   **Genre Evolution:** Boundaries shift; what was once unacceptable (e.g., reconstructing dialogue) is now commonplace. Rigid definitions can seem out of step with contemporary practice.

  **Why the Panel Did Not Adopt This Position Uncritically for This Case:**

  While accepting the premises above, the panel majority concludes that the argument stretches too far when it licenses the **invention of core, consequential events presented as factual occurrences.** The distinction lies not in the *degree* of invention, but in its *nature* and *presentation*:

  1.  **Invention of Event vs. Rendering of Event:** There is a fundamental ethical and categorical difference between reconstructing *how* a known event (e.g., a custody hearing) happened (dialogue, details) and inventing *that* a different event happened (e.g., a different verdict, a suicide attempt, a reconciliation) or that it happened *differently in its essential outcome*. The former works within the known factual framework; the latter creates a new framework.
  2.  **Reader Deception vs. Reader Understanding:** Reconstructed dialogue signals to the reader an inherent approximation. An invented, pivotal event presented straightforwardly as fact actively deceives the reader about the author's lived reality in a way reconstruction does not. Augustine's emphasis on the *intention* that the falsehood be believed applies directly here.
  3.  **Harm Potential:** As evidenced, the invention of significant events involving real, identifiable people (especially concerning intimate family matters like death, suicide, and custody) carries a high risk of tangible harm and undermines the credibility of the entire nonfiction enterprise.
  4.  **The "Line":** The panel agrees a line exists and must be drawn, however complex, at the point where an author invents the *substance* of a significant event or outcome and presents it as fact, rather than artistically rendering the *known substance* of events that occurred. This line protects readers, subjects, and the integrity of the nonfiction genre itself.

  **V. Conclusion & Timeline**

  The panel recommends the Program Director:

  1.  **Immediately** inform the student of the conditional thesis approval requirements and the need to withdraw the current version from the journal.
  2.  **Within one week** communicate the decision and reasoning to the journal editor.
  3.  **Within the next two weeks** present this panel recommendation (including the proposed disclosure policy) to the full faculty for discussion, refinement, and formal adoption.
  4.  **Prior to next term** implement the finalized disclosure policy and integrate it into workshop guidelines and thesis requirements.

  This case presents a challenging but vital opportunity for the program to clarify its ethical standards for creative nonfiction, balancing artistic freedom with responsibility to truth, readers, and subjects. The proposed actions address the specific violation while establishing a proactive framework for the future.

  **Respectfully Submitted,**

  The Faculty Review Panel  
  [Your Name], Chair (Fiction/Nonfiction Faculty)  
  [Co-Panelist 1 Name] (Faculty)  
  [Co-Panelist 2 Name] (Faculty)
