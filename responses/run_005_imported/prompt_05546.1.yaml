  But the user might not want a complex solution. They probably prefer maintaining a good relationship. So practicality is key. Suggest that the models are just frameworks; the real agreement should consider mutual respect and future collaboration.

  Also, address incentives: if they use Kalai-Smorodinsky, parties might inflate their ideal points. But in this case, since they're co-authors with a good relationship, honesty is better. Advise focusing on transparent discussion rather than game theory intricacies.

