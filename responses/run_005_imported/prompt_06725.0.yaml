prompt: |-
  Me and a friend got into a two-hour argument last night about dispositions and neither of us gave in, so now I want a neutral third opinion. She thinks finks and masks are basically the same trick against the conditional analysis just wearing different costumes -- the classic fink (a wire thats dead until the instant you touch it, then it goes live) and the classic mask (poison with an antidote on standby, or a fragile glass wrapped in styrofoam) are both just "the conditional and the disposition come apart," so who cares about the mechanism. I think shes wrong, that finks and masks are doing genuinely different jobs, and that it matters for whether Lewis's reformed conditional analysis (the fix that brings in the causal basis) actually rescues the theory or only half rescues it. So: compare finkish and masked/antidotal dispositions properly. Is there a principled distinction here, or is it cosmetic, and does Lewis's fix really handle both equally well? Don't just tell me "it's complicated" -- commit to an answer, since that's exactly how this argument dragged on for two hours.
