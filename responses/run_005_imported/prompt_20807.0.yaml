answer: |-
  The situation you're describing highlights a fundamental challenge in social choice theory, specifically related to how individual preferences are aggregated into a collective decision. The inconsistencies you've observed—where different voting methods produce different winners, and the outcome changes when an option is removed—are not due to manipulation or a lack of a "neutral" method, but rather inherent limitations in voting systems. This is a consequence of Arrow's Impossibility Theorem, which demonstrates that no ranked voting system can satisfy all desirable fairness criteria simultaneously when there are three or more options.

  ### Key Issues in Your Scenario:
  1. **Borda Count (Point System) Violates Independence of Irrelevant Alternatives (IIA)**:
     - In the initial Borda count (with points: 3 for 1st, 2 for 2nd, 1 for 3rd, 0 for 4th), the playground won. When solar panels (a poorly supported option) were removed and the points recalculated for the remaining three options (likely with points: 2 for 1st, 1 for 2nd, 0 for 3rd), the winner changed even though no one altered their relative rankings of the parking lot, playground, and garden.
     - This violates IIA, a fairness criterion stating that the ranking between two options should not depend on the presence or absence of a third, irrelevant option. Here, solar panels acted as a "spoiler," affecting the point distribution because Borda scores depend on the number of options and their positions in each voter's ranking. For example:
       - A voter who ranked the garden 2nd with four options might have awarded it 2 points, but if solar panels were ranked lower and removed, that same voter might rank the garden 1st or 2nd in the smaller set, changing its point total relative to others.
     - Borda count is known to be sensitive to the addition or removal of options, even if they are unpopular, which is why the winner flipped.

  2. **Pairwise Comparison Produced a Different Winner**:
     - When proposals were compared head-to-head, the garden won, meaning it is likely the Condorcet winner—the option that beats every other in a one-on-one matchup. This suggests the garden has broad majority support against each individual alternative.
     - However, Borda count does not always select the Condorcet winner (as in your case, where the playground won initially). Borda count emphasizes "broad appeal" (e.g., being a consensus 2nd choice), while pairwise comparisons focus on majority rule in direct contests. Neither method is inherently superior; they reflect different aspects of preference.

  3. **Arrow's Impossibility Theorem Explains the Conflict**:
     - Arrow's theorem proves that for three or more options, no ranked voting system can simultaneously satisfy:
       - **Unanimity**: If everyone prefers A over B, A should win.
       - **Non-dictatorship**: No single voter dictates the outcome.
       - **Independence of Irrelevant Alternatives (IIA)**: The ranking of A vs. B shouldn't change if a third option is added or removed.
       - **Transitivity**: If A beats B and B beats C, then A should beat C.
     - In your case, the Borda count violates IIA (as seen when removing solar panels changed the outcome), and pairwise comparisons might not always yield a clear winner if there are cycles (e.g., if the parking lot beats the playground, playground beats the garden, but garden beats the parking lot). Here, the garden won pairwise, indicating no cycle, but the other methods still conflicted due to their inherent flaws.

  ### Is There a "Fair" Way?
  - **No Perfectly Fair Method Exists**: Arrow's theorem implies that for decisions with multiple options, there is no single "fair" voting system that avoids all paradoxes and satisfies all intuitive fairness criteria. Each method has trade-offs:
    - **Borda count** (or point systems) is good at finding compromise options but fails IIA and can be manipulated by adding/removing alternatives.
    - **Pairwise comparisons** (e.g., Condorcet methods) respect majority rule and IIA for individual matchups but may not identify a winner in cycles and can be complex to tally.
    - **Other methods** (e.g., instant-runoff voting, approval voting) have their own flaws. For example, instant-runoff can eliminate popular centrist options early, and approval voting requires voters to simplify rankings into binary choices.
  - **The Outcome Depends on the Method**: Your experience shows that the winner can change based on the voting system used, not because of bias, but because each system prioritizes different aspects of voter preferences (e.g., intensity of ranking vs. majority support). This is why people accuse each other of favoring methods that benefit their preferred project—it's a symptom of the system's limitations, not dishonesty.

  ### Practical Recommendations for Your Association:
  - **Accept That No Method is Neutral**: Recognize that all voting systems have weaknesses, and "fairness" is subjective. Focus on choosing a method that aligns with your group's priorities (e.g., majority rule vs. consensus).
  - **Stick with One Method for Consistency**: To resolve the current conflict, agree on a single method before voting. Given that:
    - The garden won the pairwise comparison (and is likely the Condorcet winner), it may be the most defensible choice since it reflects broad head-to-head support.
    - If you prefer a point system, use the Borda count but include all options from the start and avoid removing alternatives, as this can distort results.
  - **Consider Approval Voting for Simplicity**: If you're open to a different approach, have voters approve all options they find acceptable (e.g., vote "yes" or "no" for each). This avoids ranking inconsistencies, is simpler to tally, and often produces a compromise winner. However, it requires voters to think in binary terms, which might not capture nuanced preferences.
  - **Facilitate Discussion to Build Consensus**: Before voting, hold a meeting to discuss the proposals and share information. This can reduce strategic voting and help identify genuine priorities. For example:
    - Solar panels had little support, so dropping it might be reasonable, but do this before collecting rankings to avoid IIA issues.
    - If costs or feasibility are concerns, use them as criteria to narrow options first.

  In summary, the frustration you're experiencing stems from a fundamental mathematical truth: when aggregating diverse preferences, there is no perfect voting system. The conflict arises from the methods themselves, not the voters. By acknowledging this and focusing on a transparent, agreed-upon process, your association can make a legitimate decision—even if it feels imperfect. For further reading, explore resources on voting theory like Arrow's Impossibility Theorem or the work of Kenneth May.
