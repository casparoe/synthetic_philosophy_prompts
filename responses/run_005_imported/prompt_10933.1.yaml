  ### Dialogue: The Last Round at the Decision Theory Conference Bar  
  **Characters:**  
  - **Alex** (Hard-liner): Believes money pump arguments prove that rational agents *must* have transitive, time-consistent preferences. Any "escape" is just consistency in disguise.  
  - **Bailey** (Sophistication/Resolve Defender): Argues that sophisticated planning or resoluteness allows agents to dodge money pumps *without* ditching cyclical or time-inconsistent preferences.  

  **Setting:** A dimly lit bar after a conference on rational choice. Empty glasses litter the table. Alex signals the bartender for one last round.  

  ---

  **Alex:** (Leans forward, elbows on the table) Look, Bailey, I get why you like the "sophisticated agent" dodge—planning ahead to avoid exploitation. But it’s a band-aid. If your preferences aren’t consistent, you *will* get pumped. Always.  

  **Bailey:** (Takes a sip of whiskey) Not if you’re sophisticated or resolute. Naive agents get pumped. Sophisticated ones foresee the trap and avoid it. Resolute ones stick to their plans. The pump indicts *naivety*, not the preferences.  

  **Alex:** Then let’s build one. Right here. No slogans—concrete. We’ll do a classic *time-inconsistency* pump. Quasi-hyperbolic discounting: an agent who plans to save money tomorrow but splurges today.  

  **Bailey:** Fine. Set it up.  

  ### Constructing the Pump  
