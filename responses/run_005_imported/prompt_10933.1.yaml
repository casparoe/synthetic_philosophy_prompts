    - **C** (indulge + donate) = -1 (net cost).  
    - **B** (indulge, no donate) = -2 (guilt outweighs pleasure).  
    - So prefers **C** > **B**.  

  **Bailey:** Cyclical preferences in time: **B** > **A** at T0, but **C** > **B** at T1. And if you compare **A** and **C** directly?  

