prompt: |-
  So my friend and I got into it last night over whether "just be good because it's good" actually holds up, or whether morality only really makes sense if there's some cosmic bookkeeping (heaven, karma, whatever) making sure decent people don't get shafted in the end. I brought up that Sidgwick, of all people, took this seriously enough that he cofounded the Society for Psychical Research and spent like 20+ years investigating mediums and hauntings, basically hoping to find hard evidence for an afterlife. My friends take is that this was just a weird Victorian hobby totally separate from his real philosophy in the Methods of Ethics, but I think it's actually tied to his whole dualism of practical reason problem. Can you spell out the most important implications of Sidgwick's psychical research, and of how inconclusive it ended up being, for that dualism -- and for whether utilitarianism can ever get a fully rational, non-question-begging foundation?
