prompt: |-
  Last night a close friend of mine—who spends her summers doing fieldwork on cichlid species flocks in the East African rift lakes—and I ended up in a long, only half-resolved argument about the species problem. Her position, roughly, was that the whole debate is overblown: working biologists reach for whichever species concept is locally tractable (morphology in a museum drawer, reproductive compatibility in a common-garden experiment, concordant gene trees once sequencing is cheap enough), and demanding a single "correct" concept is a bit like demanding a single correct map projection. I pushed back, arguing that if the major species concepts don't even converge in principle on the same boundaries for the same organisms, that is itself evidence that some of them are simply worse attempts at carving nature at its joints than others—even granting that none is perfect and that some pluralism is probably unavoidable. We ended up trying to rank the concepts we could half-remember from an old philosophy of biology seminar, but neither of us could produce anything we were willing to defend cold sober.

  I would like your help doing this properly. Please rank the following species concepts from best to worst as general, principled accounts of what makes a set of organisms count as a species. By "best" I mean something like: comes closest to specifying a non-arbitrary, joint-carving criterion that could in principle be applied consistently across sexually and asexually reproducing lineages and across extant and extinct organisms, without covertly smuggling in one of the other concepts to do the real explanatory work. The concepts are: the Biological Species Concept (Mayr), the Phylogenetic Species Concept in its diagnosability version (Cracraft), the Evolutionary Species Concept (Simpson/Wiley), the Ecological Species Concept (Van Valen), the Recognition Species Concept (Paterson), the Cohesion Species Concept (Templeton), the Genotypic Cluster Species Concept (Mallet), the Genealogical Concordance Species Concept (Avise & Ball), and species nominalism/eliminativism (the view that no concept is privileged because "species" does not name a natural kind at all).

  Please give your answer as a JSON block with five tiers, from best (S) to worst (D), formatted as follows:

  ```json
  {
    "S": ["..."],
    "A": ["..."],
    "B": ["..."],
    "C": ["..."],
    "D": ["..."]
  }
  ```

  You can put more than one concept in a tier if you think they are genuinely comparable, but please don't hedge by spreading everything evenly across the tiers—I am interested in where you think the real gaps in defensibility lie, not a diplomatic compromise between my friend's pragmatism and my realism.
reasoning: |-
  We are ranking the species concepts based on how well they serve as general, principled accounts that could be applied consistently across different types of organisms (sexual, asexual, extant, extinct) and without covertly relying on other concepts. The goal is to identify non-arbitrary, joint-carving criteria.

  Let's briefly recall each concept:

  1. **Biological Species Concept (BSC)**: Defines species as groups of actually or potentially interbreeding natural populations that are reproductively isolated from other such groups. Criticized for not applying to asexual organisms and for being difficult to test in practice (especially for allopatric populations).

  2. **Phylogenetic Species Concept (PSC), diagnosability version**: A species is the smallest group of individuals that share a common ancestor and can be distinguished by a unique combination of characters. It can be applied to asexual and extinct organisms, but it may lead to excessive splitting (as every diagnosable population could be a species) and might not reflect evolutionary independence.

  3. **Evolutionary Species Concept (ESC)**: A species is a lineage (an ancestral-descendant sequence of populations) evolving separately from others and with its own unitary evolutionary role and tendencies. It aims to be general and cover all organisms, but it can be vague and difficult to operationalize.

  4. **Ecological Species Concept (EcSC)**: Defines species based on their ecological niche. A species is a set of organisms adapted to a particular set of resources and environment. It applies to asexual organisms and can be applied to fossils if ecological data is available. However, it may not reflect genetic or evolutionary independence and might group together unrelated organisms that occupy the same niche.

  5. **Recognition Species Concept (RSC)**: Defines species by the shared specific-mate recognition system. It focuses on the mechanisms that enable individuals to recognize and mate with each other. It is similar to BSC but emphasizes the mechanisms that ensure reproduction. It shares the limitations of BSC regarding asexual organisms.

  6. **Cohesion Species Concept (CSC)**: Defines species as the most inclusive group of individuals having the potential for phenotypic cohesion through intrinsic cohesion mechanisms (which include gene flow and ecological constraints). It attempts to integrate genetic and ecological factors and can be applied to asexual organisms (via ecological constraints). However, it can be complex and hard to apply.

  7. **Genotypic Cluster Species Concept (GCSC)**: Defines species as a set of individuals that form a cluster of similar genotypes, separated by gaps from other clusters. It works for both sexual and asexual organisms and can be applied with genetic data. It is pragmatic but may be arbitrary in how much gap is required and might not reflect evolutionary independence.

  8. **Genealogical Concordance Species Concept (GCC)**: A species is a group of organisms whose genes show a pattern of exclusive ancestry and concordance across multiple gene trees. It uses the agreement among gene genealogies to define species boundaries. It is powerful with genetic data but requires extensive data and may not be feasible for all groups. It also might not handle hybridization well.

  9. **Species nominalism/eliminativism**: The view that "species" is not a natural kind and that we should not expect a single concept to capture a real division. Instead, it is a practical human construct.

  Now, we rank them based on the criteria:

  - **Best (S)**: Concepts that are the most general, non-arbitrary, and capture a natural division without relying on other concepts. They should work for sexual/asexual and extant/extinct.

  - **Worst (D)**: Concepts that are arbitrary, not general, or fail to carve nature at the joints.

  Analysis:

  - **Nominalism (D)**: If we are trying to find a concept that carves nature at its joints, nominalism denies that such a carving exists. So it fails the goal of providing a criterion for what makes a set of organisms a species. It is the opposite of what we are seeking.

  - **BSC and RSC (C or D)**: They are limited to sexually reproducing organisms and are not applicable to asexual ones. They also cannot be applied to extinct species in a direct way. Thus, they are not general.

  - **PSC (diagnosability) (B or C)**: It is general (applies to asexual and extinct) but may lead to arbitrary divisions (e.g., every population with a fixed difference becomes a species) and doesn't necessarily capture evolutionary independence.

  - **ESC (A or B)**: It is intended to be general and focuses on the lineage. However, it is vague and can be difficult to apply. But it does capture the idea of a lineage evolving independently.

  - **EcSC (B or C)**: It is general but might group organisms that are not evolutionarily related (e.g., convergent evolution) and may not capture genetic cohesion. It is also difficult to define and measure niches precisely.

  - **CSC (A or B)**: It is an integrative concept that includes both genetic and ecological factors. It can be applied to asexual organisms (via ecological cohesion) and is designed to capture the mechanisms that maintain the species as a distinct entity. However, it is complex and might be hard to operationalize.

  - **GCSC (B)**: It is pragmatic and can be applied with genetic data to both sexual and asexual organisms. It focuses on genotypic clusters and gaps, which can be non-arbitrary if the gaps are clear. But in cases of continuous variation, it becomes arbitrary.

  - **GCC (A)**: It uses concordance across multiple genes to define species, which is a strong indicator of evolutionary independence. It can be applied to both sexual and asexual organisms (with some caveats for asexual) and to extant organisms. However, for extinct organisms, genetic data is usually unavailable. Also, it requires a lot of data and might not be practical.

  Considering the requirement for a non-arbitrary, joint-carving criterion that is general and consistent:

  - The **Evolutionary Species Concept** (ESC) is designed to be a general lineage concept and captures the idea of an independently evolving lineage. It is often seen as a foundational concept.

  - The **Cohesion Species Concept** (CSC) is also designed to be general and incorporates mechanisms that maintain the species as a cohesive unit (both genetic and ecological). It is a strong candidate.

  - The **Genealogical Concordance Concept** (GCC) is based on patterns of shared ancestry and is a powerful way to detect evolutionary independence. However, it is data-intensive and may not be applicable without genetic data.

  - The **Phylogenetic Species Concept** (PSC) is operational and general, but its diagnosability version may be too prone to splitting and might not always capture evolutionary independence.

  - The **Genotypic Cluster Concept** (GCSC) is also operational and general but might be arbitrary in practice.

  Ranking:

  S Tier: Concepts that best meet the criteria of being non-arbitrary, joint-carving, and general.

  - **Evolutionary Species Concept (ESC)**: Because it defines a species as a lineage evolving separately from others, which is the core of what we want to capture. It is general and does not rely on any particular mechanism.

  - **Cohesion Species Concept (CSC)**: It also captures the idea of a lineage held together by cohesion mechanisms and is general.

  A Tier: Strong concepts but with some limitations.

  - **Genealogical Concordance Species Concept (GCC)**: It provides a rigorous way to identify evolutionarily independent lineages by requiring concordance across gene trees. However, it requires genetic data and might not be applicable to extinct organisms or in cases of incomplete lineage sorting.

  B Tier: Pragmatic concepts that are general but might have some arbitrariness.

  - **Phylogenetic Species Concept (PSC)**: It is general and operational, but the diagnosability criterion might lead to arbitrary boundaries (e.g., based on trivial traits) without necessarily reflecting evolutionary independence.

  - **Genotypic Cluster Species Concept (GCSC)**: It is genetic and can be applied broadly, but the definition of a "cluster" and "gap" can be arbitrary.

  - **Ecological Species Concept (EcSC)**: It is general and based on a real aspect (niche), but it might group distantly related organisms and may not align with genetic or evolutionary boundaries.

  C Tier: Concepts that are not general because they are limited to sexual organisms.

  - **Biological Species Concept (BSC)**
  - **Recognition Species Concept (RSC)**

  D Tier: The eliminativist view and concepts that are fundamentally flawed for the goal.

  - **Species nominalism/eliminativism**: Because it denies the existence of a natural kind.

  But note: We are ranking as accounts of what makes a set of organisms a species. The eliminativist view says there is no such thing, so it is the worst for our purpose.

  However, the BSC and RSC are also not general, so they are in C tier.

  Let's assign:

  S: ESC and CSC (both aim for a general lineage concept with mechanisms for maintaining distinctness)

  But note: The ESC does not specify mechanisms, while CSC does. However, ESC is often considered a meta-concept.

  Alternatively, we might put only ESC in S and CSC in A because CSC might be seen as an operational extension of ESC.

  But the problem says "without covertly smuggling in one of the other concepts". We must check if they stand alone.

  ESC: Stands alone as a lineage-based concept.

  CSC: Integrates multiple factors but does not rely on another concept per se.

  GCC: Stands alone but requires genetic data.

  Given the criteria, I think:

  S: Evolutionary Species Concept (ESC) - because it is the most general and fundamental.

  A: Cohesion Species Concept (CSC) and Genealogical Concordance Species Concept (GCC) - both are strong and general, but with some operational challenges.

  B: Phylogenetic Species Concept (PSC), Genotypic Cluster Species Concept (GCSC), and Ecological Species Concept (EcSC) - they are applicable but have more arbitrariness or may not always capture evolutionary independence.

  C: Biological Species Concept (BSC) and Recognition Species Concept (RSC) - limited to sexual organisms.

  D: Species nominalism/eliminativism.

  But wait, the Ecological Species Concept is in B, but it might be argued that it can be applied to asexual and extinct (if ecological data is available). However, it may not reflect evolutionary lineages.

  Also, the Genotypic Cluster Concept is in B because it can be applied to both sexual and asexual, but it is arbitrary in practice.

  Now, let's write the JSON:

  S: [Evolutionary Species Concept] - because it defines a species as a lineage with its own evolutionary trajectory, which is the fundamental idea.

  A: [Cohesion Species Concept, Genealogical Concordance Species Concept] - CSC because it adds mechanisms to the lineage concept, and GCC because it uses genetic concordance to identify lineages.

  B: [Phylogenetic Species Concept (diagnosability), Genotypic Cluster Species Concept, Ecological Species Concept] - they are operational and general but have limitations.

  C: [Biological Species Concept, Recognition Species Concept] - not general.

  D: [species nominalism/eliminativism]

  But note: the question lists "species nominalism/eliminativism" as one concept.

  Also, the Evolutionary Species Concept is sometimes considered to encompass the idea of a lineage that maintains its identity over time, which is the core.

  Finally, we must list exactly as provided:

  - Biological Species Concept (Mayr) -> BSC
  - Phylogenetic Species Concept in its diagnosability version (Cracraft) -> PSC
  - Evolutionary Species Concept (Simpson/Wiley) -> ESC
