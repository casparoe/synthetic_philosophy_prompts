answer: |-
  The constitutional precommitment literature (Elster, Holmes, etc.) offers crucial insights for psychiatric Ulysses contracts (UCs), but the disanalogy you highlight—**personal identity continuity vs. generational discontinuity**—is indeed pivotal. Below are the key implications for UC design/enforcement, directly addressing this tension:

  ### 1. **Rationale for Precommitment: Sovereignty vs. Self-Binding**  
     - **Constitutional Insight**: Constitutions bind future majorities to protect foundational values (e.g., rights) from transient passions. Sovereignty is *divided* across time.  
     - **Implication for UCs**: The competent self ("founding sovereign") binds the future incapacitated self ("temporary sovereign") to protect *long-term autonomy* (e.g., avoiding suicide/manic ruin).  
     - **Design Mandate**: UCs must explicitly articulate the *values* being preserved (e.g., "I wish to maintain relationships/career, even if future me rejects treatment"). This justifies overriding contemporaneous refusal as an act of *true autonomy*, not paternalism.

  ### 2. **The "Dead Hand" Problem: Binding Future Selves vs. Future Generations**  
     - **Disanalogy Depth**:  
       - *Generations*: New cohorts never consented; binding them risks *illegitimacy*.  
       - *Psychiatric UCs*: The same biological person exists across time, but episodic illness fractures *psychological continuity*. This weakens objections from non-consent (unlike intergenerational politics).  
     - **Key Insight**: Personal identity persistence supports UC enforcement *if* the competent self’s values remain recognizably "theirs" during crises.  
     - **Design/Enforcement Fixes**:  
       - **Triggers**: Limit enforcement to *objectively verified* crisis states (e.g., specific symptoms on a predefined scale).  
       - **Temporal Limits**: Require UC renewals (e.g., every 2 years) to ensure alignment with current values.  
       - **Revocation Windows**: Allow revocation *only* during independently assessed competency periods.

  ### 3. **Sovereign Irrevocability: Can a Sovereign Bind Itself?**  
     - **Constitutional Puzzle**: A sovereign cannot fully abdicate its authority (e.g., constitutions need amendment procedures).  
     - **UC Translation**: Competent patients may forfeit *future revocation rights*, but not the right to *amend* the UC while competent.  
     - **Critical Design Element**:  
       - **Built-in Amendment Mechanisms**: UCs must include clear procedures for modification (e.g., "This directive may be revised in consultation with my care team during stability periods").  
       - **No Perpetuity**: Absolute irrevocability is indefensible. Sunset clauses or mandatory reviews prevent the "dead hand" problem *within one lifetime*.

  ### 4. **Contemporaneous Refusal vs. Precommitment: The Autonomy Conflict**  
     - **Core Tension**: Should a patient’s crisis-stage refusal override their prior competent self?  
     - **Constitutional Analogue**: When a majority violates constitutional norms (e.g., rights suspension during emergencies), courts intervene to uphold precommitments.  
     - **UC Enforcement Framework**:  
       - **Presumption for Precommitment**: Override contemporaneous refusal *only if*:  
         (a) The crisis impairs decision-making capacity *as defined in the UC itself*;  
         (b) Treatment aligns with the UC’s specific terms (no mission creep).  
       - **Disanalogy Advantage**: Unlike generations, the crisis self *benefits* from restoration to competency—reinforcing the UC as a *rescue* mission for autonomy.  

  ### 5. **Safeguards Against Abuse: Lessons from Constitutional Design**  
     - **Checks and Balances**: Constitutions use independent judiciaries to review emergencies.  
     - **UC Protections**:  
       - **Third-Party Review**: Require court/ethics committee approval *before* enforcing UCs against refusal.  
       - **Scope Narrowing**: Prohibit UCs authorizing high-risk/unproven treatments (e.g., ECT only if explicitly consented).  
       - **Proxy Involvement**: Designate a *trusted agent* (e.g., family member) to interpret UC applicability during crises.

  ### 6. **The Disanalogy’s Bottom Line**  
  The generational discontinuity in constitutions *weakens* their legitimacy when binding non-consenting futures. In contrast, psychiatric UCs bind a *future self* whose core identity persists—making enforcement *more defensible* if:  
     - The UC reflects deeply held values (not transient preferences);  
     - The crisis self’s refusal is confirmed as illness-driven (via predefined criteria);  
     - Mechanisms exist to update the UC as the competent self evolves.  

  **Conclusion**: Ulysses contracts should be enforceable against contemporaneous refusal **only** under strict conditions that mirror constitutional safeguards (e.g., independent review, clear triggers, amendability). The personal continuity argument *strengthens* their ethical foundation compared to intergenerational precommitments—but rigorous design is essential to prevent the "dead hand" of a past self from overriding genuine, capacity-linked changes in values.  

  ### Key Sources for Your Chapter:  
  1. **Elster, J.** (*Ulysses and the Sirens*, 1979) – Original precommitment framework.  
  2. **Holmes, S.** ("Precommitment and the Paradox of Democracy", 1988) – Sovereignty tensions.  
  3. **Radden, J.** ("I Will Not Be I", *Bioethics*, 2022) – Personal identity in UCs.  
  4. **Kim, S.Y.H.** ("Evidence-Based Psychiatric Ethics", 2017) – Empirical UC outcomes.  

  This synthesis positions UCs not as a paternalistic override, but as a *temporal dialogue* within a single life—demanding procedural rigor to honor autonomy across time.
