  Now, IIT's defenses. The exclusion postulate addresses spatiotemporal grain, picking the scale that maximizes Φ. That could counter Aaronson by saying expander graphs aren't at the right grain. For unfolding, exclusion might say only recurrent networks have the right causal structure at the optimal grain. Also, empirical support like PCI—correlating Φ with consciousness in disorders of consciousness—is claimed as validation.

  But how strong are these defenses? For exclusion: does it reliably pick scales that match intuition? In complex systems, multiple grains might have high Φ, leading to ambiguity. And for unfolding: if two networks are behaviorally identical, exclusion might still assign different Φ, but no experiment could verify which is conscious. That seems unfalsifiable.

  The user's deeper needs: They need a clear stance for their paper. They want to avoid just summarizing both sides. They might be struggling with the tension between IIT's mathematical framework and its empirical testability. Also, they might want to understand the philosophy of science aspects—what makes a theory scientific? Falsifiability is key, but not the only criterion (e.g., Lakatos' research programs).

  Possible verdicts: Pseudoscience? But IIT has empirical work like PCI. Flawed but legitimate? But unfalsifiability is a big problem. Something else? Like a conceptual framework that's useful but not strictly scientific.

  Weighing both: The unfolding argument is damning because it attacks testability in principle. Even if exclusion picks a grain, if two systems are identical in behavior but different in Φ, no test can distinguish them. That makes IIT untestable. PCI's success might be coincidental or explained by other theories. Also, Tononi biting the bullet on expander graphs undermines face validity.

  Strongest position: IIT is currently pseudoscience because it's unfalsifiable. The unfolding argument shows no possible experiment can confirm or refute its core claims. Exclusion doesn't solve this; it might even exacerbate the underdetermination. For IIT to become scientific, it needs a way to test cause-effect structures independently of behavior, which seems impossible. Abandoning this verdict would require IIT to make a novel prediction testable without behavioral reports or show how cause-effect structures can be measured directly.

