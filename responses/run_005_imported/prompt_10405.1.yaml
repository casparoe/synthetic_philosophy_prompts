answer: |-
  That's a brilliant core concept! Using Anscombe's fierce, principled opposition to Truman as the culmination of a *lifelong*, consistent pacifism rooted in an absolute rejection of killing non-combatants is powerful and dramatically rich. Here are a few scene sketches focusing on different facets of her pacifism *before* Hiroshima, designed to build that foundation and show the personal cost:

  **Scene 1: The Conscription Debate (University Common Room, ~1940)**

  *   **Setting:** A crowded, smoke-filled university common room. Posters urge "Join Up!" or "Do Your Bit!" The atmosphere is tense, patriotic fervor mixed with underlying fear.
  *   **Action:** A heated debate erupts after a visiting speaker (perhaps a military chaplain or politician) justifies conscription as a necessary evil to defeat a greater evil (Nazism). Your character (let's call her **ELEANOR**) listens intently, her expression growing increasingly severe.
  *   **Eleanor's Intervention:** She doesn't shout, but her voice cuts through the noise with cold, logical precision. She challenges the *premise*:
      *   **Core Argument:** "Necessity does not transmute murder into justice. You speak of 'necessary evil'? Killing an innocent person – a child, a mother, a farmer tending his field – is *never* necessary; it is always murder. A state cannot command me to commit murder, no matter the uniform it wears or the enemy it faces."
      *   **Rejection of Ends/Means:** "You ask us to dirty our hands *now* for a clean world *later*. But the act of murder *is* the dirtying. It corrupts the soul and the society that commits it. You cannot build a just peace on a foundation of deliberate, mass killing of the innocent."
      *   **Targeting the Emotion:** "You invoke the horror of the concentration camps? I share your revulsion. But dropping bombs on tenement blocks in Hamburg does not liberate Dachau; it replicates the logic of dehumanization, merely changing the target."
  *   **Reaction:** Hostility. Accusations of cowardice, naivety, even treachery. A friend might pull her aside, worried: "Eleanor, this isn't the time for philosophy! People are dying!" She remains unmoved: "Precisely. That is *why* we must speak clearly about what killing *is*."
  *   **Dramatic Purpose:** Establishes her *intellectual rigor* and *absolute principle* early. Shows her isolation and willingness to defy overwhelming social pressure. Foreshadows her later arguments about the bomb (dehumanization, murder of non-combatants).

  **Scene 2: The Tribunal (Conscientious Objector Hearing, ~1941)**

  *   **Setting:** A stark, bureaucratic room. A tribunal panel (perhaps weary, perhaps skeptical) sits behind a table. Eleanor stands before them, alone or with her husband (if he shares her views). Files are open. This is about *application* of principle under pressure.
  *   **Action:** The panel questions her motives. They probe for inconsistency, political bias, or simple cowardice. They might ask about specific war work (munitions, nursing, land work) she's willing to do.
  *   **Eleanor's Testimony:** Her answers are calm, unwavering, rooted deeply in her moral philosophy:
      *   **Absolute Ground:** "My objection is not to hardship or danger, but to the deliberate taking of innocent human life, which is intrinsic to modern warfare. I cannot participate in any activity whose primary purpose is to facilitate that killing."
      *   **Rejecting Compromise:** "You offer non-combatant roles? Digging trenches aids the soldier who kills. Driving an ambulance presupposes the battle. Working in a factory making bombs *is* making bombs. The entire machine is geared towards murder; I cannot oil a single cog."
      *   **The Personal Cost:** "I understand the consequences of my stance. Pariah status, limited employment, suspicion. I accept these. What I cannot accept is the burden of blood on my conscience."
  *   **Reaction:** Skepticism. One panelist might invoke the Blitz: "What if your refusal meant London burns?" Her reply: "Then London burns. It is a terrible tragedy. But burning London does not grant me license to burn Dresden's children." Condescension or grudging respect. The outcome (conditional exemption? full exemption? directed work?) shows the state's ambivalent tolerance.
  *   **Dramatic Purpose:** Moves principle into *personal consequence*. Shows the *bureaucratic and social machinery* she opposes. Highlights her *consistency* and *willingness to suffer for her beliefs*. Establishes the framework ("murder") she will later apply to Hiroshima.

  **Scene 3: The Silence on VE Day (Oxford Street / College Courtyard, May 8, 1945)**

  *   **Setting:** Jubilant chaos. Bells ringing, crowds singing, strangers embracing, impromptu parties. Union Jacks everywhere. Relief and joy are palpable, overwhelming.
  *   **Action:** Eleanor is present, perhaps walking home or near a college celebration. Friends/colleagues rush to include her, thrusting a drink into her hand, pulling her towards dancing. "The war's over! We won! Aren't you happy?"
  *   **Eleanor's Reaction:** She stands utterly still amidst the frenzy, a statue of grief. She doesn't scold, but her silence and expression are deafening. She might gently push the drink away.
      *   **Internal Monologue/Quiet Utterance (to a trusted friend or her husband):** "Won? What have we won? We unleashed firestorms that consumed cities whole. We perfected the art of slaughtering civilians from the sky. We have shown the world that *this* is how victory is achieved. This is not peace; this is the exhausted pause before the next horror we've made inevitable." She might specifically mention the firebombing of Tokyo (March 1945) as a recent, horrific example of the "victorious" strategy.
      *   **The Focus:** Her mourning isn't just for the Allied dead, but for *all* the dead, including German and Japanese civilians. She mourns the *moral cost* paid for victory.
  *   **Reaction:** Confusion turns to discomfort, then irritation or anger among those nearby. "Spoilsport!" "Ungrateful!" "After all we sacrificed!" She becomes a dark blot on the celebration. Someone might deliberately jostle her. She accepts it, her gaze fixed on some middle distance, seeing the ashes beneath the confetti.
  *   **Dramatic Purpose:** Shows the *emotional and social isolation* her stance creates at the moment of greatest collective relief. Demonstrates her profound *grief* for the *methods* of the war, not just its existence. Directly foreshadows her reaction to Hiroshima (just 3 months later) as the *logical, horrific extension* of the "victory" strategy she mourns on VE Day. Establishes her as a prophet ignored.

  **Key Threads to Weave Through These Scenes:**

  1.  **Consistency of Language:** Use terms like "murder," "slaughter," "killing the innocent," "state-sanctioned killing" consistently from the start. Hiroshima isn't a new category; it's the starkest example.
  2.  **Intellectual Rigor:** Ground her arguments in her philosophy (even if simplified for the scene). Show it's not emotion, but deep moral reasoning. Reference thinkers like Aquinas (on Double Effect, which she would reject in warfare) or Augustine (on Just War, which she would argue modern war inherently violates) if appropriate for the character/setting.
  3.  **The Personal Cost:** Show the isolation, the accusations of disloyalty, the strain on relationships, the bureaucratic hurdles. Make her principled stance *costly*.
  4.  **Foreshadowing Hiroshima:** In the VE Day scene, her mention of firebombing or the "next horror" is crucial. Her arguments against bombing cities earlier lay the direct groundwork for her fury at the atomic bomb – it's not just *more* destructive, it's the *apotheosis* of the immoral strategy she condemned all along.
  5.  **Not Naive, Not Political:** Emphasize this isn't about pacifism = passivity or a specific political ideology (though it has implications). It's a profound, absolute moral conviction about the nature of killing.

  These scenes should create a compelling portrait of a woman whose fury at Truman isn't an outlier, but the inevitable, volcanic eruption of a conviction held with steely consistency through years of war, opposition, and personal sacrifice. Her pamphlet isn't just about the bomb; it's the final, public indictment of the entire moral framework she has fought against her entire adult life. Good luck with the drafting! This character has immense potential.
