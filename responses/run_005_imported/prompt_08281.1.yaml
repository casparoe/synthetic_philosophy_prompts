  My friend from my philosophy MA program is getting married in a few weeks and I'm giving the toast. She and her fiancé have this long-running bit where they claim to have invented their own "private language" -- specific words that only mean something to the two of them -- and whenever anyone gives them grief for being insufferable about it, she just says "we're doing Wittgenstein" as a joke. I went back and actually reread the relevant bits of the Investigations (the diary case around 258, the beetle in the box in 293, the rule-following stuff around 201-202) and now I'm pretty sure what they're doing isn't actually a counterexample to the argument, its almost the opposite -- a tiny public language-game with a community of two, which is precisely not what Wittgenstein means by "private."

  I want to build the toast around this, but actually get it right rather than doing the version of "private language" people trot out at parties. Half the room is our old cohort and they will 100% clock it if I flatten the argument or use the term loosely; the other half is family who've never read a page of philosophy and just want a nice toast about two people who love each other. Can you write me something like a 4-5 minute speech that uses the real structure of the argument -- what it does and doesn't rule out, and why a two-person idiolect doesn't count as a counterexample -- to say something genuinely moving about what it takes to build shared meaning with one particular other person, without turning into a philosophy lecture or losing the family half of the room.
