  I should break down upādhi first. An upādhi is a hidden condition that might invalidate vyāpti. For example, wet fuel as the condition for smoke. Identifying an upādhi involves looking for properties that co-occur with the hetu but not the sādhya. The process requires pakṣa-dharma-tā and sādhya-vyāpaka conditions. Tarka comes in as a reductio ad absurdum to eliminate doubts. For instance, if there were smoke without fire, it'd lead to contradictions like perpetual darkness. Tarka isn't proof but removes mental blocks to accepting vyāpti.

