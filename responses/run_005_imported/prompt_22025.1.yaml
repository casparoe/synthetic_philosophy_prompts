  Assessing the Buddhist objection: Dharmakīrti argues that vyāpti needs a svabhāva-pratibandha (natural relation). Nyāya counters that such relations aren't always knowable a priori. Their method is epistemological, focusing on how we justify beliefs, not ontology. Gaṅgeśa's anupalabdhi (non-apprehension) of upādhi is key. But is this sufficient? The user might be hinting at whether this is circular or ad hoc. The response should acknowledge that Nyāya's approach is pragmatic and defeasible, suitable for everyday reasoning but maybe not satisfying a strict empiricist like Dharmakīrti.

