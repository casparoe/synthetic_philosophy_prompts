prompt: |-
  I'm working on a piece about the more mathematically-minded wing of effective altruism, and I keep running into an argument that would be a great hook for the piece if its actually true, so I want to sanity check it before I write it up. A couple of people I've interviewed told me that Harsanyi's aggregation theorem basically proves utilitarianism. Here's the version I got: if both individuals and "society" are rational in the standard economic sense (preferences satisfying what economists call the von Neumann-Morgenstern axioms for choice under uncertainty), plus one mild condition -- if literally everyone is indifferent between two options, society has to be indifferent too -- then you're mathematically forced into a social welfare function that's just a weighted sum of everybody's individual utility. One guy pitched it to me as basically the utilitarian mirror image of Arrow's theorem: instead of proving something's impossible, it proves that once you accept a handful of boring, near-tautological axioms about rationality, you don't get to pick your ethical theory anymore -- the math picks it for you.

  If that's right, it seems like a much bigger deal than just another move in a philosophy seminar, since it would mean Rawlsians, virtue ethicists, and everybody else who isn't already a utilitiarian is just refusing to follow their own premises to their logical conclusion. The only pushback I got was from an economist friend, who mentioned something about "Sen" and interpersonal comparisons being an issue, but she was heading into a meeting and it came out sounding like a footnote-level technicality rather than a real crack in the argument. So, gut check: is it fair to tell readers that Harsanyi mathematically proved utilitarianism, full stop, and that everyone still arguing about ethics after 1955 hasn't caught up? Or is something load-bearing getting lost between the actual theorem and the version that's making the rounds?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're working on a piece about the mathematically-minded effective altruists and came across Harsanyi's aggregation theorem. The claim they heard is that this theorem proves utilitarianism, which would be a huge hook for their article. But they want to sanity-check this before writing.

  First, I need to recall what Harsanyi's theorem actually states. From what I remember, it's about social welfare functions under uncertainty. The theorem assumes both individuals and society have vNM-rational preferences. The key axioms are individual rationality, social rationality, and the Pareto principle. The conclusion is that the social welfare function must be a weighted sum of individual utilities. That sounds utilitarian at first glance.

  But why might this not be a full proof of utilitarianism? The user mentioned their economist friend brought up Sen and interpersonal comparisons. That's a clue. Interpersonal utility comparisons are a big sticking point in welfare economics. Harsanyi assumes utilities are comparable, but in reality, how do we measure and compare utility across individuals? The vNM utilities are ordinal and unique only up to affine transformations. So without a common scale, the weights in the social welfare function are arbitrary. That undermines the utilitarian interpretation because utilitarianism requires cardinal, comparable utilities.

  Then there's the issue of preference satisfaction versus well-being. Harsanyi's utilities are based on preferences under uncertainty, which might not capture well-being. Philosophers like Rawls argue that primary goods or capabilities are better metrics. So reducing ethics to preference satisfaction ignores other moral dimensions. 

  The Pareto principle seems uncontroversial, but it can lead to problems. For example, if everyone is indifferent, society must be too. But what if a change benefits some without harming others? That seems fine, but Sen's critique points out that this ignores distributional justice. A society could have extreme inequality as long as no one objects, which utilitarianism might justify if total utility increases. Rawls' difference principle directly opposes this by prioritizing the least advantaged.

  Also, the axioms assume rationality, but people might not always have consistent preferences. Behavioral economics shows deviations from vNM axioms, like loss aversion. If individuals aren't perfectly rational, does the theorem still hold? Maybe not, which limits its real-world applicability.

  The user's angle is that this theorem forces utilitarianism on anyone accepting "boring" axioms. But the axioms aren't as neutral as they seem. The Pareto principle, for instance, is substantive. Accepting it means rejecting theories that value equality intrinsically. So opponents like Rawlsians or virtue ethicists aren't irrational; they reject the premises.

  The economist's mention of Sen is crucial. Sen demonstrated that combining liberalism (individual rights) with the Pareto principle can lead to contradictions. This highlights that the axioms might conflict with other values. So the theorem's assumptions aren't unassailable.

  In summary, while Harsanyi's theorem is a strong argument for utilitarianism under specific conditions, it's not a mathematical proof that settles ethics. The issues of utility comparison, the conflation of preference with well-being, and the substantive nature of the axioms mean other ethical theories remain viable. The user should present the theorem as a compelling argument but note these critiques to avoid overclaiming.
answer: |-
  That's an *excellent* question, and the enthusiasm around Harsanyi's theorem in certain EA circles is understandable. However, presenting it as "mathematically proved utilitarianism, full stop" and implying non-utilitarians are ignoring logic **significantly overstates the case and misrepresents the philosophical debate.** Here's the breakdown:

  1.  **What Harsanyi Actually Proved (The Core Strength):**
      *   **Premises:** (1) All individuals have rational preferences satisfying the von Neumann-Morgenstern (vNM) axioms (implying they have cardinal utility functions unique up to affine transformation). (2) The "social planner" or ethical observer also has rational preferences satisfying vNM axioms over social outcomes. (3) The Pareto Principle: If everyone is indifferent between two prospects, society is indifferent. (The weak version you stated is often sufficient, but sometimes a stronger Pareto principle is used).
      *   **Conclusion:** The social welfare function *must* be a **weighted sum of individual vNM utility functions.** That is, there exist positive weights (a1, a2, ..., an) such that the social utility of any prospect X is:
          `W(X) = a1 * U1(X) + a2 * U2(X) + ... + an * Un(X)`

  2.  **Why This *Seems* Like a Proof of Utilitarianism:**
      *   It derives a *linear aggregation* of individual utilities, which is the hallmark of classical utilitarianism (maximize the sum total of utility).
      *   It uses seemingly minimal, "rationality-based" axioms applied consistently to individuals and society.
      *   It appears to bypass messy interpersonal utility comparisons by leveraging the vNM framework, where utility is revealed through choices under risk.

  3.  **The Load-Bearing Caveats (Why It's Not "Full Stop"):**
      *   **The Elephant in the Room: Interpersonal Comparisons:** This is **not** a footnote. It's the central crack. Harsanyi's theorem *assumes* interpersonal comparisons are possible and meaningful within the vNM framework, but it doesn't *solve* the fundamental problem.
          *   vNM utilities are only defined *up to an affine transformation* for each individual (U_i'(X) = b_i * U_i(X) + c_i, with b_i > 0). This means the *scale and zero point* for each individual's utility are arbitrary.
          *   **The weights (a_i) are completely arbitrary within the theorem.** The theorem says a weighted sum *exists*, but it gives no guidance on how to *choose* the weights. Choosing weights is an inherently ethical/political decision about whose utility counts more. Equal weighting (a_i = 1 for all i) is one possibility, but so is giving one person near-total weight. The theorem itself is silent on distributional justice. **This is where your economist friend's "Sen" point hits home.** Amartya Sen (and many others) emphasized that without a solution to the interpersonal comparison problem (specifying the b_i and c_i transformations meaningfully), the social welfare function lacks determinate ethical content.
      *   **vNM Utility != Well-Being (The "Utility is What?" Problem):** Harsanyi's theorem uses utility functions derived purely from *revealed preferences under risk*. Is this a valid measure of *well-being* or *welfare*? Critics argue:
          *   Preferences can be adaptive (e.g., oppressed people lowering expectations), mistaken, or based on anti-social desires. Should these preferences define social good?
          *   Well-being might involve objective components (capabilities, basic needs, autonomy) not fully captured by subjective preferences, even rational ones. Rawls' "primary goods" and Sen/Nussbaum's "capabilities approach" are direct challenges to preference-satisfaction as the sole basis for justice.
          *   Utilitarianism (especially preference utilitarianism) identifies "good" with preference satisfaction. Harsanyi starts *from* preference satisfaction axioms. The theorem shows consistency *within* that framework, but doesn't prove that framework is the only valid basis for ethics. Non-utilitarians reject the foundational equation of rational preference satisfaction with the ethical good.
      *   **The Pareto Principle is Substantive, Not Tautological:** While "unanimous indifference implies social indifference" seems weak, stronger Pareto principles (e.g., if *someone* prefers A and *no one* prefers B, then society prefers A) are often used/implied and are far from ethically neutral. They inherently favor efficiency over equality. A Rawlsian, prioritizing the worst-off, might deliberately choose an outcome that makes everyone *slightly* worse off if it significantly improves the lot of the very worst-off – violating strong Pareto. The theorem *assumes* Pareto efficiency is paramount.
      *   **The Nature of the "Social Planner":** Who is this entity with vNM-rational social preferences? Is it a dictator? An idealized observer? The theorem describes a *formal structure* for aggregating individual vNM utilities into a social ordering under specific axioms. It doesn't mandate a specific decision-making *process* (like voting), nor does it necessarily reflect how actual societies *should* make decisions, especially concerning legitimacy and rights.

  **So, is it fair to tell readers Harsanyi mathematically proved utilitarianism, full stop?**

  *   **No, it is not fair or accurate.** It misrepresents both the theorem and the state of ethical philosophy.

  **Is it a powerful argument within a specific framework?**

  *   **Yes, absolutely.** For someone who:
      *   Accepts that individual rational preference under risk is the fundamental basis for defining individual good/utility.
      *   Accepts that social rationality should follow the same vNM axioms.
      *   Accepts the (strong) Pareto principle as ethically binding.
      *   Believes meaningful interpersonal comparisons of vNM utility *can* be made (or that the weight selection problem can be solved ethically, e.g., by equal weighting).
  *   ...then Harsanyi provides a compelling *formal argument* for a utilitarian-like aggregation. It's a major intellectual achievement showing how utilitarianism can arise from seemingly thin rationality constraints.

  **How to Frame it for Your Piece (Avoiding Overclaim):**

  *   **Be Precise:** Describe it as proving that *if* you accept the vNM axioms for individuals and society plus Pareto, *then* social welfare *must* be a *weighted linear sum* of individual vNM utilities. Emphasize the "if" and the specific type of utility.
  *   **Acknowledge the Caveats:** Explicitly mention the **interpersonal comparison/weight selection problem** and the **debate over whether vNM utility equals well-being**. These aren't technicalities; they are the core reasons why philosophers haven't simply conceded to utilitarianism since 1955. Mention Sen as a key critic here.
  *   **Contextualize its Appeal:** Explain *why* this resonates strongly with the mathematically-minded EA wing: it offers a rigorous, formal foundation for utilitarianism using tools they respect (rational choice theory, probability), contrasting it with Arrow's negative result. It makes utilitarianism feel like a logical inevitability *within its specific assumptions*.
  *   **Avoid Dismissing Alternatives:** Don't frame non-utilitarians as "refusing to follow their own premises." Their premises are *different*. Rawls explicitly rejects the vNM framework for deriving principles of justice. Virtue ethicists reject the idea that ethics can be reduced to utility aggregation. They challenge the foundational assumptions Harsanyi relies on, not just the conclusion.
  *   **Stronger Hook:** Frame it as a fascinating and influential *argument* that provides a rigorous *formal foundation* for utilitarianism under specific assumptions, making it particularly compelling for those with a mathematical bent, rather than a decisive mathematical *proof* that ends ethical debate.

  **In essence:** Harsanyi's theorem is a brilliant and important argument *for* a form of utilitarianism, derived from premises many find plausible. However, it doesn't "prove utilitarianism full stop" because those premises themselves (especially regarding interpersonal comparisons, the nature of utility, and the priority of Pareto) are precisely what non-utilitarians contest. The math picks utilitarianism *if* you buy into the initial setup; the ethical debate is largely about whether that initial setup is correct.
