answer: |-
  Here are 10 tightly constructed interview questions designed to challenge the historian’s deflection strategy ("we aren’t there yet") by forcing engagement with contradictions, evidence, and tensions in Keynes’s thought. Each includes a follow-up to preempt her likely pivot, plus a closing evidentiary question.

  ---

  ### Core Questions & Follow-Ups  
  1. **On "My Early Beliefs" and Fragile Civilization**  
     *Question:* In his 1938 memoir, Keynes repudiates the Bloomsbury assumption that civilization was a "thin and precarious crust" they’d ignored. Given his 1930 essay treats the erosion of the money-motive as almost inevitable post-scarcity, does that later insight—that societal collapse is probable—fatally undermine the essay’s psychological optimism?  
     *Follow-up (if she calls it a "tendency"):* If human nature includes an innate drive to secure against civilizational risk, could scarcity-mentality *never* fully dissolve—making "there" unreachable?  

  2. **Tension: "Purposiveness" vs. "Animal Spirits"**  
     *Question:* The 1930 essay condemns "purposiveness"—deferring enjoyment for the future—yet *The General Theory* (1936) relies on this same restless, future-oriented "animal spirits" to sustain investment. Isn’t this a contradiction: the moral ideal requires purging what his economics deems essential?  
     *Follow-up (if she separates "moral" and "economic" Keynes):* Can we reconcile this without admitting that capitalism’s survival *depends* on perpetuating the deferred-gratification psychology he called pathological?  

  3. **Universality of the "Good Life"**  
     *Question:* Keynes’s vision of the "good life" (art, leisure, "science as contemplation") mirrors Bloomsbury’s aesthetic aristocracy. When he calls this a universal endpoint, is he conflating a highly specific cultural ideal with human nature—a mistake similar to his later disavowed "rationalism"?  
     *Follow-up (if she defends its generality):* Doesn’t evidence that leisure often manifests as gaming or TV—not high culture—suggest his ideal is elitist, not innate?  

  4. **Keynes’s Personal Hypocrisy**  
     *Question:* Keynes profited aggressively as a speculator and treasured his art collection—treating money as possession *and* means. Given he called loving money for its own sake a "morbid propensity," should we read his essay as self-critique... or discredit its sincerity?  
     *Follow-up (if she dismisses this as ad hominem):* If even Keynes couldn’t resist "money as possession" amid plenty, what evidence suggests *humanity* can?  

  5. **AI/Productivity vs. Scarcity’s Nature**  
     *Question:* Modern tech solves material scarcity but amplifies positional scarcity (e.g., status via exclusive goods). Does this mean Keynes mistook *absolute* abundance for the end of competitive consumption—overlooking that rivalry might be hardwired?  
     *Follow-up (if she says positional goods are "transitional"):* If AI abundance makes positional battles *more* intense (e.g., bidding wars for Van Goghs), isn’t rivalry the engine, not a bug?  

  6. **Institutional Barriers to Leisure**  
     *Question:* Keynes blamed "old Adam" for overwork, but today’s four-day-week pilots show reduced hours *boost* productivity. Does this suggest the barrier isn’t psychology but power: employers clinging to work as social control?  
     *Follow-up (if she retreats to psychology):* If institutions actively *manufacture* scarcity (e.g., planned obsolescence), can psychology ever evolve "post-scarcity" under capitalism?  

  7. **The Role of Advertising**  
     *Question:* Keynes wrote pre-mass advertising. Given Bernays-era consumerism *creates* new "needs," doesn’t this make his scarcity-to-abundance trajectory circular?  
     *Follow-up (if she calls advertising a phase):* If neuromarketing and AI hyper-personalization *deepen* manufactured desire, how does abundance ever break the cycle?  

  8. **Leisure’s Dark Side**  
     *Question:* Keynes imagined leisure enabling "living wisely." Yet studies show unstructured time often increases stress or malaise (e.g., U.S. opioid crisis in deindustrialized towns). Does this reveal a flaw in assuming leisure naturally elevates?  
     *Follow-up (if she blames "transition"):* If we’ve had 70 years of rising leisure potential but rising depression, when does "not yet" become "not ever"?  

  9. **Alternative Philosophies of Well-Being**  
     *Question:* Keynes’s "good life" centers individual cultivation. But communal traditions (e.g., Indigenous "buen vivir") prioritize relational wealth. Could his blindness to this explain why GDP growth didn’t deliver his utopia?  
     *Follow-up (if she insists his ideal is flexible):* If the essay’s moral core requires Western individualism, is it fundamentally parochial?  

  ---

  ### Closing Evidentiary Question  
  10. **The Falsification Question**  
  *Question:* You argue Keynes’s vision is a valid tendency, not a failed forecast. Precisely what observable evidence—e.g., stagnating leisure hours despite productivity, rising Veblen goods consumption, or universal basic income trials showing *increased* work—would falsify the thesis rather than just indicating "not yet"?  

  ---

  ### Why this works:  
  - **Blocks deflections** by embedding contradictions (Q1–Q4), structural critiques (Q5–Q8), and cultural alternatives (Q9) into the questions.  
  - **Uses Keynes against himself** via his memoir, career, and later economic theory.  
  - **Forces engagement with modernity** (AI, advertising, four-day weeks) to show historical constraints.  
  - **The closer (Q10)** removes the "not yet" escape hatch by demanding falsifiable criteria.  

  These questions treat the historian’s thesis seriously while exposing its fault lines—pushing her beyond restatement into genuine defense or refinement. Good luck with the interview!
