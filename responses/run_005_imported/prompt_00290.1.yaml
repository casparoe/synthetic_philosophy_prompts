answer: |-
  Here's a rigorous argument for why EDT/UDT (not CDT) rescues instrumental voting for purely outcome-focused agents, without civic-duty utility. We'll dive into the correlation mechanics, similarity thresholds, generalization, and implications for decision theory:

  ### Core Argument: Voting as Evidence, Not Causation
  CDT fails because it asks: *"What happens if I, uniquely, change my vote?"* The answer: almost certainly nothing (probability ≈ 1/𝑁, where 𝑁 is electorate size). EDT/UDT reframe the question: *"What does my decision to vote (or not) reveal about the decisions of other voters sufficiently similar to me?"* 

  Your vote isn't causally isolated; it's *diagnostic*. If you’re deciding to vote, it’s evidence that other agents with your decision algorithm + preferences + epistemic state are *also* deciding to vote. The key is treating your decision as a *sample* of a larger reference class.

  ### Modeling Correlation: The "Sameness" Threshold
  For correlation to matter, voters must be **decision-theoretically identical** or **sufficiently similar** within a **pivotal reference class**:

  1.  **Identity Conditions:** Two voters (A and B) belong to the same reference class if:
      *   They share identical preferences over election outcomes.
      *   They have identical beliefs about:
          *   The probability of being pivotal *under different turnout models*.
          *   The cost/benefit ratio of voting.
          *   The existence/behavior of *other voters in the same reference class*.
      *   They use the *same decision procedure* (e.g., EDT, UDT, or a specific cooperative heuristic) and are mutually aware of this.
      *   (UDT-Specific): They are "copies" of the same abstract agent facing isomorphic decision problems.

  2.  **Why This Creates Correlation:** If you satisfy these conditions, your decision algorithm is computing the *same output* (vote/abstain) as others in your class, given identical inputs (preferences, beliefs). Your choice isn't independent; it's determined by the *common algorithm*. Choosing to vote implies the algorithm outputs "vote" for *all* identical agents facing the same inputs.

  3.  **The Pivotal Reference Class:** The relevant group isn't *all* voters. It's the set of voters who:
      *   Share your pivotal status (e.g., in a swing state/district).
      *   Are ideologically aligned with you.
      *   Are sophisticated enough to be reasoning about collective action using similar logic.
      *   **Crucially:** Are numerous enough that *their collective turnout* could swing the election. Call this size 𝑀 (e.g., 𝑀 = 10,000 for a tight state race).

  ### The EDT/UDT Calculation
  Assume:
  *   𝑈(win) = Benefit of your candidate winning (net of policy differences).
  *   𝑈(loss) = 0 (normalized).
  *   𝐶 = Cost of voting (time, effort).
  *   Your reference class size is 𝑀.
  *   Election is swung iff ≥ 𝐾 members of your reference class vote (𝐾 < 𝑀).

  **EDT Calculation:**
  *   *Conditional on You Voting:* P(swing | You Vote) ≈ P(≥ 𝐾-1 *other* reference class members vote | You Vote).
      *   Because you are *typical* of your reference class, your voting is strong evidence that the algorithm outputs "Vote". So: P(another ref. class member votes | You Vote) ≈ 1.
      *   Therefore: P(≥ 𝐾-1 others vote | You Vote) ≈ 1 (if 𝐾 << 𝑀). Thus, P(swing | You Vote) ≈ 1.
  *   *Conditional on You Abstaining:* P(swing | You Abstain) ≈ P(≥ 𝐾 others vote | You Abstain).
      *   Your abstention is evidence the algorithm outputs "Abstain". So: P(another ref. class member votes | You Abstain) ≈ 0.
      *   Therefore: P(swing | You Abstain) ≈ 0.
  *   **Expected Utility (EDT):**
      *   EU(Vote) = [P(swing | Vote) * U(win)] - 𝐶 ≈ [1 * 𝑈(win)] - 𝐶
      *   EU(Abstain) = [P(swing | Abstain) * U(win)] ≈ [0 * 𝑈(win)] = 0
      *   **Vote if:** 𝑈(win) > 𝐶

  **UDT Calculation (Updateless):**
  *   You don't condition on your *own* action. You choose a *policy* (Vote/Abstain) for *all* instances of "you" (your reference class).
  *   **Policy "Always Vote":** All 𝑀 reference class members vote. P(swing) ≈ 1 (if 𝑀 > 𝐾). Total Cost = 𝑀 * 𝐶. Expected Utility per agent: [1 * 𝑈(win)] - 𝐶
  *   **Policy "Always Abstain":** All 𝑀 abstain. P(swing) ≈ 0. Total Cost = 0. EU per agent: 0
  *   **Compare Policies:** "Always Vote" yields EU ≈ 𝑈(win) - 𝐶 per agent. "Always Abstain" yields 0. **Choose "Always Vote" if 𝑈(win) > 𝐶.**

  ### Generalization Beyond Voting
  This reasoning applies to **any threshold public good problem with a sufficiently large, identifiable reference class of decision-theoretically similar agents**:

  1.  **Climate Action:** Reducing personal CO₂ is like voting. EDT: "My reducing emissions is evidence that other environmentally conscious, strategically-minded people are also reducing, making collective impact more likely." UDT: "I choose the policy 'reduce emissions' for all agents like me."
  2.  **Charitable Giving (Matching Funds):** Donating during a matching period leverages the threshold logic directly.
  3.  **Boycotts/Strikes:** Participation is diagnostic of broader participation within the mobilized group.

  **Limitations on Generalization:**
  *   **Fuzzy Reference Classes:** If agents are less identical (different beliefs, decision heuristics), correlation weakens. EDT's evidential boost diminishes.
  *   **Continuous Contributions (Non-Threshold):** Problems like pollution reduction lack a clear pivot. Correlation still helps (my action evidences others' actions), but the benefit is spread diffusely, making the EU calculation less dramatic than the voting/threshold case.
  *   **Identification Costs:** Finding/coordinating your "reference class" might be costly or impossible. Voting benefits from pre-existing blocs (parties, ideologies).

  ### EDT/UDT vs. CDT: Evidence for a Paradigm Shift?
  This isn't *just* a patch; it highlights a fundamental weakness of CDT in **large-scale collective action problems under uncertainty:**

  1.  **CDT's Blind Spot:** CDT treats agents as causally isolated atoms. This fails catastrophically when the *definition* of rationality itself creates dependence between agents' actions. Voting reveals this flaw starkly.
  2.  **EDT/UDT's Strength:** They naturally incorporate the **logical correlation** arising from shared rationality. They model the agent as part of a *system* of similar decision-makers. Voting becomes a paradigmatic example where this matters.
  3.  **Not *Just* a Special Case:** While voting is a clean example, the underlying issue (logical correlation under shared decision procedures) appears in:
      *   Newcomb-like problems (EDT/UDT dominate).
      *   Coordination games (e.g., Schelling points).
      *   AI alignment (multiple AI systems running similar code).
      *   Evolutionary game theory (agents with identical strategies).
  4.  **The Case for UDT:** UDT, in particular, handles this most cleanly. It avoids EDT's potential "tickle defense" issues (your decision doesn't change your beliefs about your own type) by being updateless. It directly implements the "Parfitian" perspective: choosing the rule for all similar agents.

  **Conclusion:** For a purely outcome-focused agent, voting *is* instrumentally rational under EDT or UDT because your decision is logically correlated with the decisions of a pivotal bloc of sufficiently similar agents. Your vote isn't evaluated in causal isolation; it's evidence of (or part of a policy for) the behavior of your reference class. The required similarity is strict (identical decision algorithms + preferences + epistemic state), but approximated in reality by ideologically aligned, strategically sophisticated voters in swing states/districts. This reasoning generalizes to other threshold collective action problems and provides strong evidence that EDT/UDT offer a superior framework to CDT for scenarios involving coordination, logical correlation, and the inherent interdependence of rational agents. CDT's failure in voting isn't an anomaly; it's a symptom of its core limitation.
