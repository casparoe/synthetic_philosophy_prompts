  Based on Russell's specific arguments about the *sources* of jealousy in *Marriage and Morals*, he would almost certainly view the persistent struggle with jealousy within polyamory as **confirming evidence for his theory of its cultural plasticity, not an anomaly.** Here's a breakdown grounded in his text:

  1.  **Russell's Core Argument on Jealousy's Source:**
      *   **Possessiveness as Learned:** Russell vehemently argues that the intense jealousy surrounding sexual exclusivity is *not* innate but a product of specific social conditioning. He states: *"Jealousy, as a rule, is a special kind of possessive impulse."* (Ch. 16). He links this possessiveness directly to the institution of marriage as historically conceived – as an arrangement involving property rights over women and children.
      *   **Upbringing as Key:** He emphasizes upbringing as the primary mechanism instilling this possessiveness: *"The habit of regarding wives as property has made men feel that they have a right to all the sexual attentions of their wives, and this has made them feel that infidelity on the part of the wife is an outrage to their dignity."* (Ch. 16). He argues that children raised without this specific indoctrination of exclusivity-as-property-right would experience far less sexual jealousy.
      *   **Custom Trumps Instinct:** Russell acknowledges a basic instinct for sexual exclusivity *might* exist but argues its overwhelming intensity is cultural: *"There is, of course, an instinctive basis for jealousy, but I do not believe that it is nearly so strong as custom supposes."* (Ch. 16). He sees custom and upbringing amplifying a minor instinct into a major social force.

  2.  **Polyamory as a Direct Challenge to the "Possessive Custom":**
      *   Polyamory explicitly rejects the "possessive framing" Russell identifies as the *source* of problematic jealousy. Its vocabulary ("compersion" as the opposite of jealousy, "relationship anarchy" rejecting hierarchical ownership) and its core philosophy are deliberate attempts to dismantle the very custom Russell blames.
      *   The existence of "practical literature aimed explicitly at unlearning jealousy" and "negotiated agreements" directly embodies Russell's prescription. It's a conscious, adult effort to *undo* the upbringing instilled by the dominant possessive culture – precisely the kind of project Russell envisioned.

  3.  **Persistent Struggles as Evidence *for* Cultural Depth, Not Against Plasticity:**
      *   Russell would likely argue that the *persistence* of jealousy struggles within polyamory powerfully demonstrates the **depth and pervasiveness of the cultural conditioning he described**, not the biological fixedness of jealousy.
      *   Practitioners are actively battling against a lifetime of indoctrination (from family, media, religion, law) into the possessive model Russell critiques. The "hard-won struggle" is evidence of how deeply ingrained the possessive custom is, not evidence that jealousy is an unchangeable biological given. He would see their efforts and partial successes (many *do* manage jealousy effectively) as proof that the conditioning *can* be overcome, even if it's difficult and requires sustained conscious effort and community support.
      *   **The "Slow Progress" Interpretation:** Russell explicitly believed change would be generational. He writes about the need for a different *upbringing* for children to truly internalize non-possessive attitudes. He would likely view contemporary polyamorists as pioneers doing the hard work of *unlearning* as adults within a hostile culture, paving the way for future generations raised *within* polyamorous norms to experience significantly less jealousy as a default. Their struggle confirms the power of upbringing/custom, not its irrelevance.

  4.  **Potential Russellian Critique of Polyamory's Approach (Not a Theory Revision):**
      *   Russell *might* critique whether some polyamorous structures truly escape the "possessive" mindset. He might question if concepts like "primary" partners or highly negotiated "agreements" about time/sex/emotional intimacy still contain subtle forms of possession or expectation that trigger jealousy. He might argue that only a culture-wide shift in upbringing, making non-possessiveness the unconscious norm from childhood (perhaps simpler than complex adult negotiations), could fully realize his vision.
      *   However, this critique wouldn't undermine his core theory of jealousy's source. It would simply argue that polyamory, while moving in the right direction, hasn't yet fully escaped the cultural roots of possessiveness or achieved the deep, unconscious normalization he envisioned for future generations.

  **Conclusion:**

  Russell would interpret the polyamory phenomenon as **strong confirmation of his theory.** The very existence of a movement consciously dedicated to dismantling the "possessive custom" through revised relationship structures, vocabulary, and explicit "unlearning" practices validates his core argument that jealousy's intensity is culturally produced. The persistent struggles practitioners face would be seen by Russell as direct evidence of the immense power and depth of the possessive cultural conditioning he identified, which even committed adults find difficult to shed completely. He would view their efforts, partial successes, and the development of tools to manage jealousy as proof that change *is* possible through conscious cultural effort (albeit slow and difficult), aligning perfectly with his view that a differently raised population could sustain more sexual freedom without destabilization. The struggle is evidence of the *strength* of the custom needing to be overcome, not evidence of a fixed biological instinct immune to cultural shaping. Polyamory represents the *beginning* of the cultural experiment he proposed, grappling with the deeply embedded legacy of possessiveness he analyzed.
