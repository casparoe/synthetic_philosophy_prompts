  So I'm working on a novel where two of my characters are identical twins, separated at birth, who unknowingly get placed in seperate rooms and offered the same one-shot prisoner's dilemma deal at the same time, with no way to signal each other. Right before she locks in her answer, I want one twin to mutter a dry joke about superrationality to the researcher running the experiment, who clearly doesn't get why she isn't sweating the decision. Could you write me that joke (a line or two is fine)? It has to actually turn on the real logic of superrationality -- the kind of thing that'd make a game theorist smirk -- not just a generic "twins think alike" one-liner.
