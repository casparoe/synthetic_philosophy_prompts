  *   **Slippage:** Minor. The student could have explicitly mentioned L&L's point that *actual* theory choice rarely, if ever, occurs between logically constructed rivals of the D-Q type. However, the points made are sufficient to understand the defusing of the D-Q underdetermination thesis.
