prompt: |-
  ok so this isn't from a reading, it happened in my actual apartment, but my metaphysics seminar has been on mereology all month so now i can't turn it off. My roommates Jess and Marco built a blanket-and-cushion fort in the living room like a week and a half ago and its just been sitting there. Today I said I wanted to tear it down and get the couch back, and the two of them ended up in this argument where they basically re-derived the special composition question from scratch.

  Marco said I couldn't just unilaterally dismantle "the fort" because it's been a fixture of the apartment for over a week, we've literally been using it as a thing. Jess said there's no "the fort" to dismantle in the first place, there's just cushions and blankets sitting in an arrangement, and I'm allowed to move my own cushions whenever I want. Marco said that's a weird thing to commit to, since obviously some arrangements of stuff DO make a new object, a chair is a real thing and not just "wood arranged chair-wise," so arrangement clearly can generate objects, and he doesn't see why the fort should be different in kind. Jess said the difference is that a chair holds itself together and functions as a unit, while the fort has nothing holding it together besides gravity, it's just old objects sitting on each other. Marco shot back that this can't be the right test, because tons of stuff we all agree is one object, a stack of pancakes, an unmortared stone wall, a Jenga tower, isn't glued either, it's only held up by contact and pressure too, so her rule would disqualify those as well. Jess admitted that's annoying, but said maybe that just shows there's no clean line anywhere, and if there really isn't one, the only non-arbitrary options left are that any objects touching at all count as one thing, or that none do, so carving out "sort of a thing, just for the fort" is special pleading.

  Then everyone got hungry and it fizzled out before anyone conceded anything. Can you go through this move by move and say who's got the better of it at each step, not just declare an overall winner, and flag anything both of them seem to be missing that would actually help settle it? End with a one line verdict: VERDICT: Jess, VERDICT: Marco, or VERDICT: Neither.
