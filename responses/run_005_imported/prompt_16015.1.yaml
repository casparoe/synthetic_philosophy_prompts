  Here's a joke crafted specifically for your insufferable professor, hitting the *Marriage and Morals* irony and the Dora/City College fallout, designed for someone who knows the real dirt:

  **Professor:** (Leaning in conspiratorially, swirling his wine) "Ah, Bertrand Russell! *Marriage and Morals*, you know? Brilliant stuff. Makes such a *calm*, *logical*, utterly *convincing* case... that jealousy is merely a primitive, possessive instinct. A childish vice, easily discarded through rational discipline and ethical sophistication. One imagines him lecturing on it from some serene, jealousy-free Olympus."

  **(Pauses for effect, eyes gleaming with faux-intimacy)**

  **Professor:** "Of course... one also imagines him explaining this rather *rational* perspective to Dora Black while she was off with Lionel Penrose, or perhaps composing those wonderfully *dispassionate* letters demanding she stop seeing Griffin Barry... all whilst meticulously documenting his own affairs for maximum emotional efficiency. Truly, a masterclass in *self-overcoming*. Right up until the New York Episcopalians, bless their concerned hearts, decided his *practical experiments* in overcoming jealousy were a bit *too* pedagogically advanced for City College."

  **Why it works for your scene & requirements:**

  1.  **Targets the Specific Irony:** Directly contrasts the central argument of *Marriage and Morals* (jealousy as an irrational vice to be eliminated) with Russell's documented, messy, and *highly* jealous behavior during his marriage to Dora.
  2.  **Uses Specific References (For the Knower):**
      *   **Dora Black:** Names his wife, grounding it in the specific relationship.
      *   **Lionel Penrose & Griffin Barry:** Names two of Dora's lovers who caused Russell significant documented jealousy and conflict. This isn't vague "free love" talk; it's specific biographical pain points.
      *   **Letters demanding she stop:** References Russell's hypocritical attempts to control Dora's actions despite his philosophy.
      *   **Documenting his own affairs:** Alludes to his cold-blooded scheduling and openness about his infidelities, contrasting with his reaction to hers.
      *   **City College Job:** Explicitly mentions the real-world consequence (the rescinded appointment) fueled by the scandalous perception of his *actual* life contradicting his *espoused* philosophy.
      *   **New York Episcopalians:** The specific group that led the charge against him.
  3.  **Tone of the Professor:** The language ("serene, jealousy-free Olympus," "rational perspective," "dispassionate letters," "practical experiments," "pedagogically advanced") is deliberately academic, slightly pompous, and dripping with sarcastic faux-admiration. It sounds exactly like an insufferable prof trying to sound clever and in-the-know.
  4.  **The Punchline:** The final line lands the irony by framing Russell's chaotic personal life as failed "practical experiments" and "pedagogically advanced" concepts that were ironically *too* advanced for the institution that rejected him *because* of them. It ties the philosophical hypocrisy directly to its tangible, career-damaging result.
  5.  **Layers for the Audience:**
      *   **Surface:** A snarky prof mocking Russell's hypocrisy about jealousy.
      *   **Deeper (For the Reader Who Knows):** A precise surgical strike hitting the exact contradiction between *Marriage and Morals* and Russell's life with Dora, referencing specific lovers, his controlling behavior, and the City College fiasco. The "practical experiments" line is the killer detail for the informed.

  **How the Professor Delivers it:**

  *   He corners someone near the cheese board or by the bookshelf.
  *   He uses "you know?" implying shared knowledge, establishing faux-camaraderie.
  *   The pause is crucial – he lets the image of serene Russell sink in before ripping it apart.
  *   The gleam in his eye is one of superiority and the pleasure of exposing hypocrisy (while likely being hypocritical himself).
  *   The final line should be delivered with a slight, knowing smirk and perhaps a dismissive wave of the hand towards the imagined prudish New Yorkers.

  This joke requires the listener to know the biography to get the *full* impact and the specific references, making it perfect for your professor to feel intellectually superior while actually revealing his own pedantic insufferability. It turns the real, messy irony of Russell's life into the punchline.
