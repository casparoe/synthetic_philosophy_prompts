  so i help run the podcast for my school's philosophy club, and next episode's guest is an ai safety researcher who's a big defender of 'debate' as basically the fix for the problem of superintelligent systems being way more persuasive than any human could fact-check in real time -- her whole pitch is that if you get two super capable ais to argue opposite sides in front of a human judge, honesty wins out because its way easier to spot a flaw in an argument than to come up with a genuinely convincing one from scratch. can you write me like 7-8 interview questions that go past just having her explain that setup again? i want at least one question on whether the 'verifying is easier than generating' assumption even holds once your arguing about stuff with no real ground truth (like which values to align the ai to, not a math proof), one on the worry that training a model to win the debate in front of a human judge just selects for whichever ai is better at manipulating the judge -- which feels like exactly the problem debate was supposed to get rid of -- and one on what actually stops the two debating ais from quietly colluding instead of really competing. for each of those throw in a follow up q guessing what she'd probably say back, and end with one question asking what result from an actual debate experiment would make her give up on the whole approach.
