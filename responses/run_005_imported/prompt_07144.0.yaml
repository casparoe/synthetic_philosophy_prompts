answer: |-
  You've raised an excellent and challenging point. Your observation about vicarious liability in legal systems seems to directly counter Lewis's claim that punishment cannot be transferred. However, Lewis's argument rests on a crucial distinction that explains why he finds penal substitution uniquely problematic, even *despite* the existence of vicarious liability:

  1.  **The Fundamental Distinction: Liability vs. Punishment:**
      *   **Vicarious Liability (e.g., Tort Law):** This concerns **liability for harm or compensation**. The primary focus is on *making the victim whole* or compensating for damage caused, often for practical reasons (deep pockets, enterprise risk allocation, efficient compensation). The *employer/firm* is held responsible *for the harm caused by the agent*, not necessarily *punished for the agent's moral culpability*. The sanction (usually monetary damages) is aimed at compensating the victim or deterring negligent supervision, not at inflicting retribution *on the employer* for the *employee's moral guilt*. The employer's liability stems from their relationship to the actor and the harm, not their own personal moral desert for the specific wrongful act.
      *   **Punishment (especially in Criminal Law & Lewis's focus):** Punishment, in its core retributive sense (which Lewis is primarily addressing regarding penal substitution), is intrinsically linked to **personal moral culpability, blameworthiness, and desert**. It is inflicted *because* the offender *deserves* it for their *own* wrongful act and guilty mind (*mens rea*). The suffering imposed is justified *only if* the person suffering is the one who committed the offense.

  2.  **Why Vicarious Liability Doesn't Resolve Lewis's Puzzle:**
      *   **It's Not Punishment in the Relevant Sense:** Holding an employer liable for an employee's tort is generally *not* considered *punishing the employer for the employee's crime/moral wrong*. It's holding them financially responsible for the *consequences* (the harm). The employee who committed the tort may still face separate sanctions (dismissal, professional discipline, or even criminal charges) based on *their own* culpability.
      *   **Lack of Innocence:** While the employer may be *personally innocent* of the *specific tortious intent or act*, they are *not* considered entirely "innocent" in the relevant legal context. They bear responsibility *by virtue of their role* (principal, employer) and the relationship that created the risk or enabled the harm. They are held liable *for their own* potential negligence in supervision or *for the acts of their agent* undertaken within the scope of agency. This is a recognized legal basis for responsibility distinct from personal moral culpability for the specific act.
      *   **Purpose Dissonance:** The *purpose* of vicarious liability (compensation, risk allocation, deterrence of principals) is fundamentally different from the core retributive purpose Lewis associates with punishment – giving the guilty what they deserve. Transferring liability for compensation achieves a social goal; transferring *punishment* (deserved suffering for guilt) to an innocent person violates the very logic of retribution.

  3.  **The Core of Lewis's Puzzle for Penal Substitution:**
      *   **True Innocence:** In penal substitution, Christ is portrayed as *wholly innocent* of the sin he bears punishment for. He has no relationship to the sinners (like employer/employee) that creates derivative responsibility. He is a pure substitute.
      *   **Pure Punishment Transfer:** The doctrine posits the transfer of *punishment itself* – the deserved retributive suffering – not just liability for compensation. Christ suffers the *punishment* (wrath of God, abandonment) that sinners *deserve*.
      *   **Conflict with Retributive Justice:** Lewis argues that retributive justice requires that punishment be inflicted *only on the guilty party*. To inflict the *deserved suffering* on someone who is *not guilty* and does *not deserve it* is, by the logic of retribution, inherently unjust. It would be punishing the innocent. Vicarious liability avoids this because it's not primarily about inflicting deserved suffering *for the agent's guilt* onto the principal; it's about allocating responsibility for harm.

  4.  **Corporate Fines - A Closer Look:**
      *   While fines on firms for manager misconduct might *feel* punitive, they are often justified on grounds distinct from pure retribution against the *firm itself* for the *manager's personal moral guilt*:
          *   **Regulatory/Strict Liability:** Fines often function as regulatory sanctions or strict liability penalties aimed at deterring corporate misconduct or ensuring compliance, not as retribution for the manager's specific moral failing.
          *   **Attribution:** Legally, the acts of senior managers *are* often attributed directly to the corporate entity. The firm *is* considered the "actor" in law.
          *   **Deterrence & Internal Governance:** The goal is to incentivize the firm to implement better controls and supervise managers, not to make the *shareholders* suffer for the manager's *guilt* per se.
          *   **Lack of "Innocence":** The firm, as a legal entity, is held responsible *for the acts done in its name/by its agents*. It is not considered a wholly "innocent" bystander in the way Christ is presented. Its responsibility is derivative but legally recognized.
      *   Crucially, the *manager* who committed the misconduct can (and often is) still punished *personally* (fired, fined, imprisoned) based on their *own* guilt. The corporate fine doesn't *absolve* the guilty individual; it addresses the corporate entity's responsibility.

  **Conclusion:**

  You are absolutely right that the law has mechanisms for shifting *responsibility for harm* (liability) onto others based on relationships (like employer/employee). However, Lewis's puzzle specifically concerns the transferability of *punishment* understood as *deserved suffering inflicted because of personal moral guilt and blameworthiness*. Vicarious liability resolves practical problems of compensation and risk allocation *without* transferring personal moral culpability or the *desert* for retributive punishment. The innocent employer pays, but they aren't *punished* in the retributive sense *for the employee's guilt*; they are held liable *for the harm caused by the employee's act*.

  Penal substitution, according to Lewis, attempts something metaphysically and morally different: it transfers the *desert of punishment* (the core element requiring personal guilt) onto a truly innocent party who bears no derivative responsibility. *This* is what Lewis finds puzzling and incompatible with the logic of retributive justice, a logic not undermined by the existence of vicarious liability for compensation. The law has "resolved" the practical issue of allocating liability for harm, but it hasn't resolved (and arguably cannot resolve) the philosophical problem of how *deserved punishment for personal guilt* can justly be borne by an innocent substitute. Lewis highlights this distinction as the source of the puzzle.
