  - Dr. Beatrice Vale: A behavioral economist. Believes the failure is due to strategic behavior by researchers and departments. Advocates for redesigning incentives to align with true goals.

  The dialogue should have them engage with each other's arguments and then clarify the nature of their disagreement at the end.

