answer: |-
  Here’s a eulogy that honors his consistency, grounded in the logic he loved—clear for family, satisfying for colleagues, and true to his spirit. (Time: ~5-6 minutes):

  ---

  **For [Uncle's Name]**

  We’re here to remember a remarkable man. To his family, he was our rock. To his colleagues, he was the actuary with the signature line you heard in a hundred meetings: **"More information can never make you worse off, only better, so you might as well look."** He lived by that. It guided everything from choosing a coffee maker to navigating complex financial risks. It wasn’t just a motto; to him, it was math. He loved discovering it had a name: **Good’s Theorem**. He’d beam explaining how, for a rational decision-maker, the *expected value* of free information is never negative. It can only help, or at least do no harm. That was his compass.

  Which is why some were surprised—maybe even Aunt [Aunt's Name] gently teased him—when, near the end, his oncologist offered a specific timeline... and he said, "No. Don’t tell me the number." It might seem, at first glance, like he stepped away from the principle he held for 40 years. But he didn’t. Not at all. Understanding *why* is the key to understanding the depth of his rationality and his humanity.

  **Good’s Theorem, his beloved math, makes a specific promise:** *If* information is free, and *if* you’ll use it to make a better decision, then *on average*, seeking it leaves you no worse off. But it doesn’t promise that *every single piece* of information, in *every single circumstance*, is beneficial. Its power lies in weighing the *potential* for better choices against the *cost* of getting the information.

  **[Uncle's Name]** understood those costs and benefits with crystal clarity, right to the end.

  1.  **The Decision Was Already Made:** By the time the number was offered, the big decisions—about treatment, about how to spend his time—were settled. He’d chosen quality of life, peace, and being present with all of you. Knowing the precise number wouldn’t have changed that course. There was no *new* decision to optimize.
  2.  **The Cost Wasn't Zero:** For [Uncle's Name], information wasn't just data; it carried weight. He knew himself. He knew that a specific number, even if statistically sound, could become a weight on his heart, a countdown clock ticking in the quiet moments meant for love and reflection. The potential emotional burden *was* the cost.
  3.  **He Was Still Optimizing:** By declining the number, he *was* making a rational choice based on expected value. He weighed the benefit (minimal, since his path was set) against the cost (significant emotional toll). He concluded the *net expected value* for *him*, *in that moment*, was negative. Declining wasn't rejecting information; **it was the final, elegant application of his lifelong principle.** He looked at the *prospect* of that specific information, saw it wouldn't aid a decision and might bring pain, and wisely chose not to acquire it. He "looked" at the *option* of knowing, and chose the path he calculated offered greater peace.

  **That’s the nuance his brilliant mind grasped:** The rule isn't "grab every fact blindly." It's **"Seek information when it holds the power to guide your choices towards a better outcome, and the cost of seeking it is justified."** When the information lost its power to change his course and gained the power to diminish his peace, his choice wasn't a contradiction. **It was the theorem, lived out with profound self-awareness and courage.**

  He didn’t chicken out. He didn’t betray his math. He completed it. He showed us that rationality isn't cold; it’s deeply human. It’s about knowing what truly matters—and in his final days, what mattered was love, serenity, and the precious, unmeasured time he had left with all of you, unburdened by a number.

  So let’s remember him not just for the rule, but for the wisdom to apply it perfectly, even when it was hardest. Let’s remember the actuary who proved, right up to the end, that the deepest calculations are always made with the heart. We’ll miss his brilliance, his wit, and his unwavering love.

  ---

  **Why this works:**

  1.  **States the Principle & Theorem Clearly:** Simple, non-technical explanation of Good's Theorem ("expected value of free info never negative") for everyone.
  2.  **Acknowledges the Apparent Contradiction:** Directly addresses Aunt's point and the colleagues' likely question.
  3.  **Explains the Nuance of the Theorem:** Focuses on the *conditions* (free info, used for decisions) and the *expected value* aspect (on average, not always).
  4.  **Applies the Logic to His Choice:**
      *   **No Decision Impact:** Info couldn't change his chosen path (key point!).
      *   **Cost Existed:** Emotional burden = real cost.
      *   **He Still Optimized:** Declining *was* the rational calculation of net expected value *in that specific context*.
  5.  **Reframes as Consistency:** Explicitly states this was *not* a betrayal but the "final, elegant application."
  6.  **Connects to Humanity:** Links his rationality to self-awareness, courage, and prioritizing love/peace.
  7.  **Tone:** Respectful, warm, celebratory of his intellect *and* his heart. Avoids clinical lecture.
  8.  **For the Audience:** Colleagues hear the satisfying decision-theoretic justification. Family hears a story about his wisdom, love, and knowing himself.

  This honors his intellect, resolves the apparent paradox for those who knew his mantra, and ultimately celebrates his wisdom and humanity in a way everyone can understand and appreciate.
