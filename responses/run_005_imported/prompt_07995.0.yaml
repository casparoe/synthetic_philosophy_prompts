  2. Introduce the frame problem through an anecdote from work (an AI agent changing too many things because it didn't know what to leave alone).
  3. Explain the philosophical roots (McCarthy and Hayes, and the debate with Fodor and Dennett) in an accessible way.
  4. Draw a parallel to the graduates' experience: in college, the structure (classes, requirements) defined what was relevant. Now, they have to decide for themselves.
  5. Offer advice on how to approach the frame problem in life: by building a good frame (values, principles) that helps them focus on what matters and ignore the noise.
  6. End with an uplifting conclusion.

