answer: |-
  You've hit on a profoundly deep and contested issue at the heart of both moral uncertainty and social choice theory. The analogy between **intertheoretic comparison (ITC)** and **interpersonal comparison of utility (IUC)** is powerful and insightful, but the disanalogies you suspect are also crucial. Let's break down the similarities, differences, and the philosophical work being done by proposed "fixes."

  ## Core Similarities: Why the Analogy is Compelling

  1.  **Formal Structure:** Both problems involve aggregating distinct, potentially incommensurable "value scales" into a single decision or ranking.
      *   **Social Choice:** Aggregating individual utility functions (u₁, u₂, ..., uₙ) over states of the world/social alternatives into a social welfare function.
      *   **Moral Uncertainty:** Aggregating theory-specific choiceworthiness functions (CW_T1, CW_T2, ..., CW_Tm) over actions into a single "morally expectable" choiceworthiness function.
  2.  **The Incommensurability Problem:** The core challenge in both is the lack of a pre-existing, universally agreed-upon common unit and scale for comparison.
      *   **IUC:** How many "utils" of person A equal one "util" of person B? Is utility even cardinal and comparable?
      *   **ITC:** How much "choiceworthiness" according to Kantian deontology equals one "unit" of utilitarian welfare? Are they even the *same kind of thing*?
  3.  **Aggregation Impossibilities without Comparability:** Arrow's theorem fundamentally shows that with only ordinal, non-comparable preferences, no aggregation method satisfying seemingly minimal conditions (like Pareto Optimality and Non-Dictatorship) exists. Harsanyi's aggregation theorem *requires* cardinal interpersonal comparability to yield a utilitarian sum. Similarly, in moral uncertainty, meaningful expectational reasoning *requires* some form of intertheoretic comparability to calculate expected choiceworthiness (EC). Without it, EC is undefined or arbitrary.
  4.  **Borrowed Tools:** As you note, MacAskill (and others like Lockhart, Ross) explicitly borrow tools developed for IUC problems to tackle ITC:
      *   **Variance Voting/Normalization:** Analogous to "zero-one" normalization or range voting in IUC. Scales each theory's CW function to have the same mean and variance across options, *imposing* cardinal unit comparability.
      *   **Borda Count:** Imposes ordinal-level comparability (ranking positions are comparable).
      *   **Nash Bargaining/Maximin:** Other social choice/social welfare concepts adapted for moral uncertainty.

  ## Key Disanalogies: Why ITC Might Be *Harder* (or at Least Different)

  1.  **Ontological Divergence (Your Best Guess - Sharpened):** This is the most significant disanalogy.
      *   **IUC:** There's a strong intuitive and philosophical case (though contested) that humans share a common underlying *phenomenon* (well-being, preference satisfaction, happiness/suffering) that different utility functions attempt to measure, even if imperfectly and incompletely. Disagreements are often about measurement and weighting *of a shared subject matter*.
      *   **ITC:** Rival moral theories often posit fundamentally *different kinds* of normative properties or reasons. Kantian deontology's "constraint violation" or "respect for rationality" isn't just a *different way of measuring* the same thing utilitarianism measures ("aggregate welfare"). They posit *radically different fundamental normative furniture*. A constraint violation isn't *less aggregate welfare*; it's a *different kind of wrongness altogether*. The "choiceworthiness" scales might not even be measuring commensurable *dimensions*. This suggests ITC faces a deeper *metaphysical* incommensurability than IUC.
  2.  **The "Subject" of Comparison:**
      *   **IUC:** We are comparing *experiences* or *states* of distinct *persons*.
      *   **ITC:** We are comparing *evaluations* or *prescriptions* of distinct *theories* held by a *single agent* under uncertainty. The "subject" is the agent's own credence distribution over normative perspectives.
  3.  **Epistemic Access:**
      *   **IUC:** We (imperfectly) observe other people's behavior, expressions, and reports to *infer* their utility. Empathy offers a potential (flawed) bridge.
      *   **ITC:** The agent has direct (though perhaps incomplete) access to the *content* of the theories they have credence in. They can read Kant and Mill. The challenge isn't inferring hidden mental states, but *interpreting and relating* explicit normative structures. The "bridge" is rational interpretation, not empathy.
  4.  **The Aggregation Goal:**
      *   **IUC:** Often focused on *social welfare* or *fairness* (how to aggregate individual interests justly).
      *   **ITC:** Focused on *individual rational action under normative uncertainty* (what should *I* do, given my uncertainty about what's morally right?). The question is one of *practical rationality for a single agent*, not distributive justice among many agents.

  ## Do the Fixes Do Real Philosophical Work or Smuggle in Answers?

  This is the critical question, and the answer is nuanced:

  1.  **Variance Normalization / Range Voting:**
      *   **What it does:** It imposes *cardinal unit comparability* by fiat. It says: "Treat each theory's maximum-minimum CW difference as equivalent." This allows calculation of expected choiceworthiness.
      *   **Philosophical Work?** It provides a *pragmatic solution* to the formal requirement of comparability for expectational reasoning. It ensures no single theory dominates purely due to its scale.
      *   **Smuggling?** **Absolutely, and explicitly.** It doesn't *solve* the deep metaphysical incommensurability; it *assumes* a specific, contestable structure of comparability (cardinal unit comparability with variance equivalence). It answers the hard question by *stipulation*. Its justification is largely pragmatic and formal: "We need *some* way to compare to calculate EC, and this is a method that satisfies certain plausible formal constraints (like scale invariance, preserving ratios within theories)." Whether this stipulation corresponds to any "real" metaphysical comparability is left unanswered.
  2.  **Borda Count / Ordinal Methods:**
      *   **What it does:** Imposes *ordinal-level comparability* ("A theory ranking an option 1st is comparable to another theory ranking an option 1st, etc.").
      *   **Philosophical Work?** Avoids the need for cardinal information. Can be seen as more "minimal" than variance normalization.
      *   **Smuggling?** Still smuggles in comparability, just at a weaker level. It assumes the *ranking positions* across theories are meaningfully comparable, which may not hold if theories have very different structures (e.g., a theory with strict lexical priorities vs. one with continuous trade-offs). It also faces Arrow-like impossibility problems itself in multi-option scenarios.
  3.  **"My Favourite Theory" (MFT) / Maximin/Leximin:**
      *   **What it does:** Abandons genuine aggregation. MFT acts only on the theory assigned the highest credence. Maximin/Leximin focuses on avoiding the worst outcomes according to any theory.
      *   **Philosophical Work?** Avoids the comparability problem entirely. MFT appeals to a kind of epistemic modesty or conservatism ("only act on what you're surest of"). Maximin appeals to caution ("avoid catastrophe by any theory's lights").
      *   **Smuggling?** Less smuggling of comparability, but smuggles in a *radically different decision rule* that often seems irrational (MFT ignores potentially massive stakes according to other theories; Maximin can lead to paralysis or ignoring significant potential benefits). It answers the hard question by *avoiding* aggregation rather than solving comparability.

  ## Arrow's Shadow and Moral Uncertainty

  *   **Does Arrow apply directly?** Not *formally* identical, as Arrow's axioms are framed for social welfare functions over individual preferences, not single agents aggregating theories. However...
  *   **The Spirit of Arrow Haunts ITC:** The core lesson is inescapable: **Without some imposed or assumed structure of comparability, meaningful aggregation satisfying plausible conditions is impossible.** Attempts to construct "comparability-free" aggregation for moral uncertainty will inevitably violate conditions analogous to Pareto Optimality, Non-Dictatorship, or Independence of Irrelevant Alternatives.
  *   **Is ITC *More* Tractable?** Not necessarily easier, just *different*. The ontological divergence might make genuine comparability *more* metaphysically dubious, but the single-agent context offers a different *justificatory* framework. The justification for a comparability structure (like variance normalization) isn't fairness among persons, but *practical rationality for the uncertain agent*. An agent might say: "Given that I *must* act, and expectational reasoning seems rationally required, I adopt variance normalization as the best available *pragmatic rule* for implementing EC under deep uncertainty about comparability." This is a different kind of argument than one used to justify IUC for social welfare.

  ## Conclusion

  1.  **Strong Analogy:** The formal structures and the core problem of incommensurable scales are deeply analogous. Arrow's impossibility *should* worry moral uncertainty theorists profoundly, as it demonstrates the necessity of comparability for non-arbitrary aggregation.
  2.  **Principled Disanalogies Exist:** The most significant is the **ontological divergence** – rival moral theories often posit fundamentally different, potentially metaphysically incommensurable normative properties, whereas IUC usually assumes a shared underlying phenomenon (well-being). The single-agent context also changes the nature of the problem and the possible justifications.
  3.  **"Fixes" are Stipulations, Not Solutions:** Methods like variance normalization or Borda count **do not resolve the hard metaphysical question of genuine intertheoretic comparability.** They are **pragmatic stipulations** imposed to make expectational reasoning computationally possible. They "smuggle in" an answer by defining a specific structure of comparability (cardinal unit, ordinal level). Their justification is primarily pragmatic and formal ("this allows calculation and satisfies some reasonable constraints"), not metaphysical ("this captures the true common currency").
  4.  **The Philosophical Work:** The real philosophical work done by proponents like MacAskill is:
      *   Highlighting the unavoidability of the comparability problem for expectational reasoning under moral uncertainty.
      *   Demonstrating that *some* structure of comparability *must* be assumed for EC to be defined.
      *   Proposing specific, formally characterized methods for imposing comparability (variance norm, Borda) and arguing for their pragmatic advantages over alternatives (like MFT or Maximin) based on intuitive cases and formal properties (scale invariance, sensitivity to stakes).
      *   Framing the adoption of such a method as a requirement of *practical rationality* for an agent who acknowledges their moral uncertainty but must act.

  The deep metaphysical question – "Is there *really* a common currency of normativity across fundamentally distinct moral theories?" – remains unanswered by these technical fixes. The moral uncertainty project proceeds by arguing that, *despite* this deep uncertainty, an agent rationally *must* adopt *some* coherent decision procedure, and that procedures incorporating aggregation via stipulated comparability structures like variance normalization are the best available options. Whether this is sufficient philosophical justification, or merely a necessary but philosophically unsatisfying practical tool, is a central ongoing debate. Your skepticism about "smuggling" is well-placed; the question is whether any alternative avoids smuggling *or* paralysis.
