answer: |-
  **MEMORANDUM**  
  TO: Presiding Judge Calloway  
  FROM: [Clerk's Name]  
  DATE: [Date]  
  RE: *Estate of Eleanor Vance* - Recommendation for Panel Resolution  
  **RECOMMENDATION:** The panel should resolve this appeal by applying the legal test for undue influence **issue-by-issue**, not by tallying the judges’ bottom-line votes. Under this approach, the codicil must be **voided**. A majority finds undue influence was exerted (Judges Alaoui and Calloway), and a separate majority finds Mrs. Vance’s will was overborne (Judges Berger and Calloway). The doctrine requires both prongs to void the codicil, and both are satisfied by majority vote. Adopting bottom-line voting would undermine the structure of the legal test and create inconsistency in future cases.  

  ---

  ### I. SUMMARY OF THE CONFLICT
  The panel applies a two-prong test to void a codicil for undue influence:  
  1. **Position of Trust + Improper Pressure:** The favored beneficiary must have used a position of trust to pressure the testatrix.  
  2. **Overborne Will:** The testatrix’s capacity to resist must have been actually subjugated.  

  **Judges’ Findings:**  
  | Judge          | Prong 1 (Pressure Exerted?) | Prong 2 (Will Overborne?) | Bottom-Line Vote |  
  |----------------|-----------------------------|----------------------------|------------------|  
  | Judge Alaoui   | **Yes**                     | **No**                     | Uphold Codicil  |  
  | Judge Berger   | **No**                      | **Yes**                    | Uphold Codicil  |  
  | Judge Calloway | **Yes**                     | **Yes**                    | Void Codicil    |  

  - **Issue-by-Issue Majority:**  
    - Prong 1: **Yes** (Alaoui + Calloway)  
    - Prong 2: **Yes** (Berger + Calloway)  
    → *Both prongs satisfied → Void codicil.*  
  - **Bottom-Line Majority:**  
    - Uphold Codicil: 2 (Alaoui + Berger)  
    → *Uphold codicil.*  

  This conflict arises because Judges Alaoui and Berger each found one prong unsatisfied, but for *different reasons*.  

  ---

  ### II. THE CASE FOR ISSUE-BY-ISSUE VOTING  
  **A. The Legal Test Demands Independent Prongs**  
  The undue influence doctrine treats each prong as a **discrete factual gatekeeper**. Prong 1 asks whether the beneficiary *acted* improperly; Prong 2 asks whether the testatrix *succumbed* to it. They are designed to be evaluated separately. Combining them into a single "vote" conflates distinct inquiries and risks obscuring whether the test’s requirements are met. Here, majorities independently concluded each prong is satisfied. Voiding the codicil is the only outcome faithful to the test’s structure.  

  **B. Precedent for Composite Tests**  
  Our court routinely breaks down multi-element tests into discrete questions (e.g., *Daubert* factors, probable cause elements). When a test requires *all elements*, and majorities find each element individually, the outcome is compelled—even if no single judge found all elements. *See In re Davies’ Estate*, 287 N.W.2d 700, 705 (Ct. App. 1980) (voiding will where majority found confidential relationship *and* majority found suspicious circumstances, though no overlap).  

  **C. Practical Consequences for Future Cases**  
  Adopting bottom-line voting would:  
  1. **Encourage Inconsistent Outcomes:** Identical factual findings could yield opposite results based on how judges weigh prongs holistically.  
  2. **Undermine Predictability:** Litigants could not rely on clear application of legal standards.  
  3. **Distort the Doctrine:** Judges might feel pressured to adopt all-or-nothing positions to avoid deadlocks, rather than honestly assessing each prong.  

  ---

  ### III. THE STRONGEST CASE FOR BOTTOM-LINE VOTING (AND WHY IT DOES NOT PREVAIL)  
  **A thoughtful judge (e.g., Judge Berger) could argue:**  
  > *"The undue influence test requires a holistic judgment about whether the testatrix’s free will was corrupted. Each judge’s bottom-line vote reflects their integrated assessment of both prongs in tandem—weighing the evidence of pressure against the testatrix’s resilience. Judge Alaoui concluded Mrs. Vance was pressured but ultimately acted freely; I concluded she was vulnerable but faced no improper pressure. Both views are coherent narratives under the doctrine. Tallying prongs separately fractures this synthesis and risks voiding a codicil that two judges found valid based on a ‘majority’ that exists only in the aggregate."*  

  **Why This Is Compelling But Ultimately Unpersuasive:**  
  1. **The Doctrine’s Design:** The two prongs exist precisely to *prevent* holistic subjectivity. Prong 1 is an objective check on beneficiary conduct; Prong 2 is a subjective check on the testatrix’s state. Decoupling them guards against outcomes where overwhelming pressure or extreme vulnerability alone voids a will.  
  2. **Judicial Duty vs. Discretion:** While judges *apply* discretion within each prong, the test itself mandates that *both* must be proven. A judge’s personal conclusion that the codicil "seems fair" does not override unmet prongs.  
  3. **The Risk of False Negatives:** Bottom-line voting here would uphold a codicil where:  
     - A majority found improper pressure exerted, *and*  
     - A majority found Mrs. Vance unable to resist it.  
     This is the *definition* of undue influence under our precedent.  

  ---

  ### IV. RECOMMENDED PATH FORWARD  
  1. **Reconvene the panel** to confirm findings on each prong.  
  2. **Adopt the issue-by-issue approach** as the court’s default for multi-prong tests.  
  3. **Void the codicil** based on majority findings satisfying both prongs.  

  **Precedential Commitment:**  
  This commits the court to:  
  - Resolving appeals by **applying legal tests element-by-element**.  
  - Voiding instruments where **majorities independently satisfy each required element**, even if no judge voted for the outcome.  
  - Rejecting bottom-line voting when it contradicts the test’s structure.  

  This ensures fidelity to doctrine, not arithmetic.  

  ---  
  **Respectfully submitted,**  
  [Your Clerk's Name]  

  ---  
  **Key for Dramatic Use:**  
  - The memo forces Judge Calloway to choose between her preferred outcome (voiding the codicil) and her judicial philosophy (deferring to colleagues’ holistic judgments).  
  - Judges Alaoui and Berger must confront that their votes—while defensible individually—collectively enable an outcome neither intended: validating a codicil a majority found tainted.  
  - The "unstated precedent" angle raises stakes: this isn’t just about one grandmother’s summer house, but how the court handles all future doctrinal splits.
