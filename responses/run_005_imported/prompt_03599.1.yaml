  So I've been down a probability rabbit hole lately (partly work related — we use a lot of RNGs and I got curious what "probability" even means once philosophers get their hands on it), and I ran into David Lewis's Principal Principle: basically, if you know the objective chance of something is x, your credence should just be x, no funny business, unless you've got some "inadmissible" inside info. Made total sense to me. Then I read that Lewis's own theory of what chance actually IS (this Humean "best system" story) aparently makes the Principal Principle break — he called it the "big bad bug" himself and had to patch it with something called the "New Principle." I tried reading the actual papers on this and pretty much loose the plot somewhere around all the H's and T's and conditional probabilities. Can you explain, in plain english and at a gut level, why a fact about chance would ever contradict a principle that just says "trust the chance"? Like what's actually going on with these "undermining futures" that makes this a real bug and not just a notational trick. Don't need the fully formal fix, just want to understand why smart people treated this as a genuine crisis before I go read about how the New Principle supposedly gets out of it.
