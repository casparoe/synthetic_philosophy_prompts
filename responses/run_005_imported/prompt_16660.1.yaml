prompt: |-
  Ok, this is going to sound like a very "read too much LessWrong" problem to have, because it is exactly that. I've got a friend from my local rationalist-adjacent meetup who's gotten really into the many-worlds interpretation of QM (as most of us kind of have, at this point) and has started using it to talk himself out of ordinary precautions. Concretely: he's stopped wearing a helmet on his bike and blew off his doctor's recommendation to get a weird mole biopsied, and when I pushed back he laid out this whole argument that since the wavefunction never collapses, theres no version of events where he actually "goes out" from his own point of view -- there will always be some branch, however thin, where he pulls through, and since he can only ever be a first person observer in a branch where he still exists, subjectively its as if serious injury or death just doesn't happen to him, only to "other copies" that he doesn't feel like he has much stake in anyway. To be clear he's not depressed or being self destructive on purpose, he genuinely thinks he's just correctly updating on the physics, and that the rest of us are being sentimental about branches of the wavefunction that objectively contain "him" no less than the surviving ones do. It's freaking me out a bit honestly, because he's serious about it and he's smart enough that I can't just wave the argument away.

  I've read enough of the quantum mechanics sequence and the comment-section arguments that followed it over the years to know something is off about jumping from "many-worlds is probably true" to "therefore ordinary caution is irrational for me specifically," but I'm struggling to actually pin down where the reasoning breaks, especially since I can't just tell him many-worlds is false -- if anything I'm inclined to think it's probably true too. Is he actually making a mistake here, and if so, what exactly is the flaw? I'd like to be able to argue with him about the real content of the view instead of just saying "that's insane, stop," which is about all I've managed so far.
reasoning: |-
  Okay, the user's friend is using the many-worlds interpretation of quantum mechanics to justify risky behaviors like not wearing a bike helmet or skipping a biopsy. The user knows this is flawed but can't pinpoint why. They want a clear explanation to counter their friend's argument without dismissing MWI entirely.

  First, I need to recall the friend's argument: He thinks that since the wavefunction doesn't collapse, there's always a branch where he survives. He only experiences the branches where he lives, so from his perspective, death doesn't happen. Therefore, precautions are unnecessary because he'll always subjectively survive.

  The user mentioned LessWrong and rationalist communities, so they're familiar with concepts like expected utility and probability. The friend isn't depressed; he genuinely believes he's updating correctly on physics. The challenge is to show the error in his reasoning while accepting MWI's validity.

  The key flaw is confusing subjective survival with objective probability. In MWI, all possibilities branch, but their amplitudes (probabilities) differ. High-risk actions create branches with very low amplitudes. The friend is ignoring the probabilities attached to each outcome.

  For example, not wearing a helmet increases the amplitude of death branches. Even if he subjectively experiences survival in some branches, the likelihood of ending up in a low-amplitude branch is tiny. Most of his measure (probability) is in branches where he's dead or severely injured, but he doesn't experience those. However, the expected utility calculation must account for all branches, weighted by their probabilities.

  Another point: the friend's argument implies a fallacy that one can't die because they only experience survival. But in branches where he dies, there's no experience. So, from his current perspective, he should care about maximizing the probability of being in high-amplitude survival branches. Precautions increase the measure of branches where he survives healthily.

  Also, the anthropic aspect: yes, he only observes branches where he exists, but that doesn't negate the need to avoid low-probability survival scenarios. If he takes risks, the set of branches where he survives might have much lower total amplitude, meaning he's more likely to be in a world where he's severely injured rather than unharmed.

  Expected utility is crucial. Even if MWI is true, decision theory still applies. He should maximize expected utility over all branches, weighted by probability. Ignoring low-probability high-consequences events is irrational, as cumulative risks add up. For instance, repeated bike rides without a helmet exponentially increase the chance of being in a fatal branch.

  The user needs concrete counters. For the biopsy: skipping it might lead to branches where cancer spreads, reducing quality of life. The high-amplitude branches could involve suffering, not death. So even if he survives, the utility in those branches is low. Precautions preserve more amplitude in high-utility branches.

  Also, practical considerations: even if MWI is true, we live as if probabilities matter. Betting everything on low-probability outcomes is unsustainable. The friend's approach would make insurance, medicine, etc., irrational, which isn't how we operate.

  Addressing identity: the friend thinks all branches are equally "him," but with diminishing measure, those copies are less real in a probabilistic sense. He should care more about branches with higher amplitude because they constitute more of his future existence.

  In summary, the friend's error is equating subjective continuity with invulnerability and ignoring the weighting of branches. The user should focus on probability, expected utility, and the practical consequences of accumulating risks.
answer: |-
  Your friend is making a fundamental mistake in applying MWI to decision-making, conflating *subjective continuity* with *measure preservation* and ignoring *expected utility*. Here's the breakdown of the flaws in his reasoning:

  ### 1. **Confusing "Subjective Survival" with "No Negative Outcome"**  
     His core error is assuming that because he only *experiences* branches where he survives, taking risks has no cost. But this ignores two critical facts:  
     - **Low-measure branches are real (and bad)**: In MWI, all branches exist, but their *measure* (analogous to probability) matters. When he skips a helmet, he creates:  
       - A high-measure branch where he arrives safely.  
       - A **low-measure branch where he dies instantly**.  
       - A **medium-measure branch where he survives with severe brain damage**.  
       In the majority of measure (i.e., "probability mass"), he experiences catastrophic outcomes. Subjectively, he only "finds himself" in a branch where he survived, but that branch might be one where he's permanently disabled—not unscathed.  

  ### 2. **Ignoring Expected Utility**  
     Rational agents maximize *expected utility* across branches, weighted by measure. Even if MWI is true, decisions should account for:  
     $$EU = \sum \text{(utility in branch)} \times \text{(branch measure)}$$  
     - **Not wearing a helmet**:  
       - Tiny measure × utility of death = small loss.  
       - Moderate measure × utility of quadriplegia = **massive loss**.  
       - High measure × utility of safety = gain (but smaller than the losses).  
     - **Wearing a helmet**:  
       - Near-zero measure for severe injury → **net positive EU**.  
     Skipping precautions isn't "free"; it concentrates measure in low-utility outcomes.  

  ### 3. **Anthropic Miscalculation**  
     His argument ("I only experience branches where I survive") commits an **anthropic fallacy**:  
     - Yes, you only observe branches where you exist.  
     - **But**: Risk-taking *reduces the measure* of branches where you survive *unharmed*. For example:  
       - With precautions: 99.9% measure in "healthy survival" branches.  
       - Without precautions: 50% measure in "healthy survival", 30% in "disabled survival", 20% in "death".  
       You still "experience" existing, but your subjective future is dominated by high-suffering branches.  

  ### 4. **Misapplying Personal Identity**  
     His claim that "other copies aren't me" is incoherent in MWI:  
     - All branches are equally "you" at the moment of splitting.  
     - **Key insight**: *You have no control over which branch you experience.* Pre-split, you should care about all future branches proportional to their measure. Ignoring low-measure branches is like ignoring low-probability risks in classical probability—a recipe for disaster.  

  ### 5. **The Cumulative Risk Problem**  
     Small risks compound. One bike ride without a helmet might have a 0.1% measure of death. But after 1,000 rides, the measure of *at least one fatal outcome* approaches:  
     $$1 - (0.999)^{1000} \approx 63\%$$  
     MWI doesn't magically reset odds; it quantifies them. His strategy guarantees that most of his measure ends in tragedy.  

  ---

  ### How to Argue This  
  Focus on **measure**, **utility**, and **decision theory**—not MWI's truth:  

  1. **Reframe the biopsy example**:  
     *"Refusing the biopsy doesn't mean you 'subjectively survive' cancer. It means you create branches where:  
     - A tiny measure sliver has no cancer (great!).  
     - A large measure has metastatic cancer → you survive for years in agony.  
     - A smaller measure has early, treatable cancer → quick recovery if biopsied, but suffering if not.  
     The biopsy *shifts measure* from high-suffering branches to low-suffering ones. Why wouldn’t you want that?"*  

  2. **Use his logic against him**:  
     *"If branching makes risks irrelevant, why not walk into traffic? Because intuitively, you know that almost all your measure ends with you dead or maimed. Your current argument is special-pleading for bike helmets and biopsies—but the math doesn’t care."*  

  3. **Appeal to consensus**:  
     *"Every working physicist who accepts MWI (e.g., Sean Carroll, David Deutsch) still wears seatbelts. Why? Because MWI doesn’t change expected utility calculations—it just reinterprets probability as measure. If your interpretation implies we should ignore medical advice, the error is in your application, not the physics."*  

  4. **Practical bottom line**:  
     *"Branching guarantees you’ll 'subjectively survive' in some sense, but it doesn't prevent you from spending 99% of your measure in a wheelchair or chemo. Precautions keep *more* of 'you' healthy."*  

  ---

  ### If He Doubles Down  
  If he insists "but I only care about the branch I experience," point out:  
  - This leads to **total recklessness** (why not play Russian roulette?).  
  - It also implies **indifference to others**: If he only values his subjective continuation, he should logically abandon ethics, relationships, etc. His behavior suggests he *does* care about other outcomes—he’s inconsistently applying his theory.  

  **Relevant sources**:  
  - Scott Aaronson's [write-up](https://www.scottaaronson.com/democritus/lec11.html) on MWI and decision theory.  
  - Yudkowsky's [Quantum Mechanics sequence](https://www.lesswrong.com/s/r5tnoi8TLbCbLdiBa) (see "Decoherence is Falsifiable and Testable").  

  Stay calm and focus on the math. If he resists, he might be motivated by something deeper (e.g., feeling invincible, avoiding medical anxiety). But on pure reasoning, his position is indefensible.
