  The challenge is making both positions compelling while respecting the technical constraints. For the truth-conditional side (let's call them Alex), I'll need to show how Stalnaker-style views can avoid triviality through context dependence and possible worlds semantics. For the non-propositionalist (Taylor), I'll have them argue that conditional probabilities are psychologically real in a way truth-conditions aren't, while offering pragmatic explanations for embedding.

