  Every fall I put Fitch's paradox of knowability up on the board for my epistemology seminar -- the proof that "every truth is knowable" plus "not every truth is actually known" together collapse into a contradiction, which is bad news for anti-realists who want truth to just BE knowability. I can walk students through the symbols fine -- substitute "p and it's not known that p" for p, note that knowing a conjunction means knowing both conjuncts, and so on -- but every year some sharp student asks "ok but why does THAT sentence break everything" and my answer basically amounts to redoing the derivation more slowly. Can you give me the gut-level version: why that particular sentence is the poison pill, why its really the harmless-looking "not everything is known" premise doing most of the damage rather than the knowability premise, and why restricting the knowability principle (the Dummett/Tennant move) doesn't just look like changing the rules mid-game to dodge the result. Assume I already have the formal proof down -- I want the intuition thats supposed to live underneath it.
