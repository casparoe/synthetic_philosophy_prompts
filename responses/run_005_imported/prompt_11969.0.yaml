  I cover the longevity/anti-aging science beat, and I keep running into the same philosophical scrap: is aging itself a disease, or just... life? Could you write me a short dialogue between a naturalist about disease (think Christopher Boorse's biostatistical theory) and a normativist who thinks you can never fully separate the biological facts from a value judgement about what counts as "proper" functioning, arguing specifically over whether aging counts as a disease. I want them to really engage with each others strongest points rather then just trading soundbites -- get into the weeds on the reference-class issue, like why an 80 year old's arteries get judged against other 80 year olds instead of against a healthy 25 year old. Neither one should come off as the obvious loser of the exchange.
