  First, I need to confirm my understanding of Parfit’s non-identity problem. The core idea is that different policies (Depletion vs. Conservation) lead to different future populations because they affect who exists. So, individuals in a depleted world can’t claim harm if their lives are worth living, since they wouldn’t exist otherwise. The user finds this logically sound but ethically unsettling, as it seems to dissolve responsibility toward future people.

  The user’s explicit question is whether philosophers think the non-identity problem forces the conclusion that there’s no obligation to specific future individuals. But their deeper concern is existential: they want to reconcile their moral intuition (feeling responsible for their daughter’s generation) with this philosophical challenge. They might be looking for ways to maintain that sense of duty without ignoring Parfit’s argument.

  I should consider the key philosophical responses to Parfit. Utilitarian approaches like impersonal harm focus on the overall value of outcomes, not specific people. Person-affecting views are problematic here, so alternatives like the asymmetry argument (avoiding suffering even if it means fewer happy people) or threshold approaches (preventing lives below a certain quality) might help. Collective harm frameworks shift focus to groups, which persist despite individual differences. Also, Parfit’s own "same-number quality claim" prioritizes creating better lives, not just more lives.

