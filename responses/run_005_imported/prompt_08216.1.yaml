  We are going to create a toy example in the spirit of Popper's weather example to illustrate the problem with Popper's original definition of verisimilitude. Popper's idea was that we can compare two false theories and say that one is closer to the truth than the other. However, Tichy and Miller independently showed that under Popper's definition, it is impossible for one false theory to have more verisimilitude than another.

   Popper's definition (simplified) for verisimilitude of theory A over theory B:
     A has more verisimilitude than B if and only if:
       1. The truth content of A is greater than that of B, and
       2. The falsity content of B is greater than that of A.

   However, Tichy and Miller argued that if two theories are both false, then the condition (1) and (2) cannot be simultaneously satisfied.

   Let's set up a very simple language and a world.

   Suppose we have a language with three atomic propositions: p, q, r.

   The actual state of the world (the truth) is: p is true, q is true, r is false. So the complete truth is the conjunction: p ∧ q ∧ ¬r.

   Now, consider two false theories:

     Theory A: p ∧ q ∧ r   [which is false because r is false in the truth]
     Theory B: p ∧ ¬q ∧ r  [which is false because q is true in the truth and r is false]

   We want to compare A and B using Popper's definition.

   Step 1: Determine the truth content and falsity content.

   For a theory T, the truth content is the set of true logical consequences of T.
   The falsity content is the set of false logical consequences of T.

