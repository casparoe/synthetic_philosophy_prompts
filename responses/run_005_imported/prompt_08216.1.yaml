   We can work with the set of all conjunctions of literals (or equivalently, the set of all possible states) that are consistent with the theory. But note: the logical consequences include disjunctions and other complex formulas. However, for simplicity, we can consider the set of all possible states that the theory allows and compare them to the actual state.

