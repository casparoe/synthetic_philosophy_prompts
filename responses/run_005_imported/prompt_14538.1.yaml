answer: |-
  That's an incredibly sharp observation! You've nailed the *prima facie* logic of the "White Horse Dialogue" and its resemblance to modern "dissolved by specification" disputes. The reason historians and philosophers *don't* simply file it away like the Pluto debate, however, boils down to **historical significance, interpretative depth, and the specific philosophical work it was doing in its context.** Here's why it remains a milestone:

  1.  **It Was Revolutionary (and Infuriating) in Its Time:**
      *   **Challenging Common Sense:** The argument wasn't presented in a vacuum of dispassionate logic. "A white horse is not a horse" was a deliberate, shocking paradox aimed directly at deeply ingrained assumptions about language and reality in Warring States China. It wasn't just pointing out a definitional ambiguity; it was *using* that ambiguity to undermine the reliability of language itself as a tool for conveying truth or making reliable distinctions. Imagine someone today earnestly arguing "A laptop is not a computer" based on similar parsing – it would be provocative, forcing a re-examination of what "computer" means.
      *   **Exposing Linguistic Conventions:** Gongsun Long wasn't *just* equivocating (though that's part of it); he was *demonstrating* how language relies on conventions that can be unstable when scrutinized. By fixing rigid, narrow definitions ("horse" = shape/form only; "white horse" = shape/form + color), he forced his contemporaries to confront the fact that common nouns *don't* inherently carry fixed, unambiguous meanings covering all necessary attributes. This was a radical act of linguistic analysis at the time.

  2.  **It's a Foundational Text for Chinese Logic and Semantics:**
      *   **The "School of Names" Milestone:** This dialogue is one of the *very few* surviving, extended arguments explicitly focused on the *relationship between names (words), objects, and attributes* from pre-Han China. Regardless of its ultimate "correctness," it's a crucial artifact demonstrating that sophisticated semantic analysis *was* happening. It's the starting point for understanding Chinese logical thought.
      *   **Catalyst for Debate:** The argument wasn't meant to be the final word; it was designed to provoke and challenge. The very fact that scholars like Hansen and Graham *still* passionately debate it (Hansen seeing it as proto-mass-noun semantics, Graham seeing it as highlighting intensional differences or paradox) proves its enduring power to stimulate fundamental questions:
          *   **Hansen (Mass Nouns):** Argues classical Chinese common nouns function more like mass nouns ("water") than count nouns ("a horse"). "Horse" names the "horse-stuff" (extension), while "white horse" names a specific portion of that stuff defined by an attribute. "White horse" isn't a *type* of horse-stuff in the same way "lake water" isn't a *type* of water distinct from "river water" – it's just horse-stuff with whiteness. Hence, requesting "horse" is requesting horse-stuff *without* specifying color, while "white horse" specifies color. The "is not" emphasizes the difference in the *requested portion* or the *defining criteria*.
          *   **Graham (Intension/Predication/Paradox):** Emphasized the intensional difference. "Horse" signifies the universal property of horseness (shape/form). "White horse" signifies the compound property of being *both* horse-shaped *and* white. The compound property is not identical to the simple property. He also saw it as highlighting the problem of predication: attaching "white" to "horse" creates a new concept distinct from the bare concept "horse."
          *   **Fallacy of Equivocation?** Others see it as primarily clever equivocation on "is" (identity vs. class membership) or on the scope of "horse" in different contexts. But even this interpretation recognizes its power in *exposing* how easily such equivocation can occur.

  3.  **It Points to Deeper Ontological Questions:**
      *   **The Nature of Universals and Particulars:** The dialogue implicitly wrestles with the problem of universals. What *is* "horseness"? Is it separate from the attributes (like color) that particular horses possess? When we say "horse," are we referring to an abstract universal or just pointing to a collection of similar objects? Gongsun Long's rigid separation of "shape/form" (seemingly the universal) from other attributes forces this question.
      *   **The Relationship Between Attributes and Objects:** Does whiteness exist independently of the horse? Is the white horse simply the combination of "horseness" and "whiteness," or is it a unique entity? The argument pushes towards an analysis of objects as bundles of attributes.

  4.  **The Pluto Analogy Only Goes So Far:**
      *   **Modern vs. Ancient Resolution:** The Pluto dispute *was* resolved by specification (defining "planet" operationally via the IAU). Crucially, we have the scientific tools (orbital mechanics) to *objectively* describe the underlying reality independently of the word. Gongsun Long lived in a time when the very tools for analyzing language, logic, and ontology were being forged. His dialogue *is part of the process* of developing those tools.
      *   **Focus:** The Pluto debate was about scientific classification. The White Horse Dialogue is fundamentally about *language, meaning, and the relationship between words and the world*. Its "resolution" isn't a simple scientific specification; it requires grappling with semantics, logic, and metaphysics.

  **Why it's not "filed away":**

  *   **It's Not Just Resolved:** While *we* can see the definitional move, scholars are interested in *what Gongsun Long was trying to achieve* by making it so provocatively. What philosophical problem was he highlighting? What assumptions was he attacking?
  *   **It's a Window:** The dialogue is a unique window into early Chinese philosophical concerns about language, reality, and disputation. It reveals the kinds of arguments being made and the intellectual tensions of the era.
  *   **It's Generative:** The debate it sparked among contemporaries and continues to spark among modern scholars *is* the valuable thing. It forces us to think deeply about how language works, how reference happens, and how we categorize the world. The disagreement between Hansen, Graham, and others *is* productive philosophical engagement with fundamental questions, not just quibbling over an old fallacy.
  *   **Historical Milestone:** It marks a crucial point in the development of logical and semantic thought in China. Ignoring it because we can dissolve it *now* with modern tools would be like ignoring ancient Greek atomism because it wasn't scientifically accurate by modern standards. Its *attempt* and its *influence* are what matter historically.

  **In essence:** You're absolutely right that the *core logical move* resembles a definitional dispute dissolved by tabooing words and specifying criteria. However, the White Horse Dialogue's enduring importance lies in:

  1.  **Its historical role** as a revolutionary, provocative challenge to linguistic and ontological common sense in Warring States China.
  2.  **Its function** as a foundational text forcing analysis of Chinese semantics, logic, and the nature of language itself.
  3.  **Its depth** in implicitly raising profound questions about universals, particulars, attributes, and predication.
  4.  **Its generative power** in sparking continuous philosophical debate and interpretation for over two millennia.

  It's not celebrated because the argument is "correct" in a final sense, but because it was a bold, early, and immensely influential attempt to grapple with problems of language and reality that remain philosophically vital. It's studied not as a resolved puzzle, but as a landmark in the history of thought.
