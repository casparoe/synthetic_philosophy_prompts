  Then there's Newton's scientific methodology. He famously rejected hypotheses not grounded in phenomena. So even if chaos theory seems to support his idea of inherent instability, he'd likely dismiss it as speculative math without empirical proof. The user mentions Laskar's simulations—but Newton would point out those are models, not observed reality. 

