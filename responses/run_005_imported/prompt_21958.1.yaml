     and at least one of these containments is proper.

  But note: the falsity-content condition is that the falsity-content of t2 is a subset of the falsity-content of t1? Actually, no. The falsity-content of a theory is the set of its false consequences. So condition (b) is that the falsity-content of t2 is a subset of the falsity-content of t1? That doesn't seem right because if t2 has fewer false consequences, that would be good. But note: the condition in the answer says: "t2's falsity-content is included in t1's", meaning the falsity-content of t2 is a subset of the falsity-content of t1. That is the standard condition. 

