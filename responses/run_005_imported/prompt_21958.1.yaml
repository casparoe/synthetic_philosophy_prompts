  Let me recall: Popper's definition (from his 1963 Conjectures and Refutations) is:
  t2 has more verisimilitude than t1 if and only if:
     a) the truth-content of t2 exceeds that of t1 (i.e., the set of true consequences of t2 includes the set of true consequences of t1 and more) OR 
     b) the falsity-content of t1 exceeds that of t2 (i.e., the set of false consequences of t1 includes that of t2 and more).

  But the standard way to state it is in terms of set inclusion for both, with at least one being proper. The exact condition is:
