  The answer states: "A theory t2 has more verisimilitude than a rival t1 when t2's truth-content includes t1's and t2's falsity-content is included in t1's, with at least one of those inclusions proper." 

  This is essentially correct. However, note that Popper's definition (as typically presented) is:
