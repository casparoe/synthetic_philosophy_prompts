answer: |-
  You've pinpointed a fascinating and crucial tension in understanding Keynes's intellectual development. Let's break down Moore's principle and assess its connection to the Bloomsbury ethos.

  **Decoding Moore's "Principle of Organic Unities" & the Paradox:**

  1.  **The Core Claim:** Moore argues that the intrinsic value of a *whole* complex thing is not necessarily the simple sum of the intrinsic values of its individual *parts*. The whole can have a value greater than, less than, or even different in kind from the sum of its parts' values.
  2.  **The "Paradox" Explained:** Moore highlights two points that seem contradictory at first glance but are both true for organic unities:
      *   **Point 1 (Necessary Part):** A specific part (A) might be absolutely *essential* for the existence of the valuable whole (W). Without A, W simply doesn't exist as the valuable thing it is. (E.g., Removing a specific note destroys a beautiful melody).
      *   **Point 2 (No Added Value):** However, the part (A) *itself*, considered in isolation, might have *little or even zero intrinsic value*. Its presence is necessary for the whole's value, but it doesn't *gain* intrinsic value *because* it's part of the valuable whole. It retains whatever intrinsic value it had on its own. (E.g., That single note, played alone, might be unremarkable or even unpleasant).
  3.  **The "Paradox":** How can something (A) that has little or no intrinsic value be absolutely essential for creating something (W) with *great* intrinsic value? It seems counterintuitive that a crucial ingredient contributes no *positive* value *itself* to the sum, yet its absence destroys the whole value.
  4.  **The Stone Analogy:** Moore uses the stones to combat a likely misunderstanding. If you have two stones, the whole group has the property "number two." But you wouldn't conclude that *each individual stone* has the property "two." The property "twoness" belongs to the *relation* between the stones, not to each stone individually. Similarly:
      *   **Value Resides in the Whole:** The high intrinsic value resides in the *specific combination* (the whole, W), not magically transferred to the individual parts (A, B, C...).
      *   **Parts Retain Their Own Value:** Each part (A) keeps whatever intrinsic value it possesses independently. Being part of a valuable whole doesn't *increase* A's intrinsic value. If A had no value alone, it still has no intrinsic value when part of W, even though W is highly valuable *because* of the specific combination including A.
      *   **The Analogy's Purpose:** It prevents the fallacy of attributing the property of the whole (high value) to the parts individually. Just as each stone isn't "two," the necessary but low/no-value part isn't suddenly valuable; the value emerges from the *organic unity*.

  **How Bloomsbury (Young Keynes) Used This Principle:**

  Moore argued that the *most* valuable things were **complex states of consciousness** – specifically, the appreciation of beauty and the pleasures of human intercourse (love, friendship). He saw these as prime examples of organic unities. Young Keynes and his Bloomsbury circle seized upon this with radical enthusiasm:

  1.  **Focus on States of Mind:** Moore's most valuable goods *were* private states of mind (contemplating beauty, experiencing love/friendship). The principle of organic unity *emphasized* the unique, emergent value of these complex inner experiences.
  2.  **De-emphasis of Parts/Means:** The principle showed that:
      *   **Necessary Conditions ≠ Valuable Parts:** Actions, achievements, consequences, material possessions – these were often merely the *necessary conditions* (like the low-value part A) or *means* to achieving the valuable state of mind (the whole W). According to Moore's strict reading, these things *in themselves* might have little or no intrinsic value. Their only importance was instrumental – facilitating the valuable state of consciousness.
      *   **Consequences Don't Add Value:** The *consequences* of experiencing beauty or love weren't part of the valuable whole itself. Moore was adamant that intrinsic value depends *only* on the intrinsic nature of the thing, not its consequences. Pursuing states of mind for their consequences would be missing the point – you'd be valuing the (potentially low-value) means or conditions, not the intrinsically valuable end.
  3.  **Justification for Detachment:** If only these complex states of consciousness have high intrinsic value, and actions/consequences are merely means or necessary conditions (often of low intrinsic value themselves), then the logical conclusion is to focus one's ethical energy *entirely* on cultivating and experiencing those states. Right action becomes action that *reliably produces* these states. Achievement matters only insofar as it facilitates them. Consequences are irrelevant to the *goodness* of the state itself. This licensed the Bloomsbury focus on personal relationships, aesthetic appreciation, and intellectual conversation as the highest ends.
  4.  **"Right Action" Redefined:** Moore did believe in rules of duty, but he derived them *instrumentally*. The "right" action was whatever would produce the *best possible consequences* in terms of maximizing intrinsic goods (states of consciousness). Crucially, for Bloomsbury, these consequences were *themselves* states of mind – either their own or others'. This still kept the focus intensely personal and psychological. Duty wasn't about abstract rules or social norms, but about causing the right inner states.

  **Assessment: Did Keynes's Inference Hold?**

  1.  **Moore's Text Supports the *Focus*, But Not the *Exclusivity*:** Moore *did* argue that the highest goods are states of consciousness and that the principle of organic unity shows why their value can't be reduced to their parts or consequences. He *did* relegate actions and consequences to the realm of means or necessary conditions. **So, Keynes wasn't *inventing* this emphasis; he was amplifying Moore's core message.** The principle of organic unity provided a powerful *technical* argument *against* simplistic hedonism (summing pleasures) or crude utilitarianism (just counting consequences) and *for* the supreme value of complex inner experiences.
  2.  **Where Keynes/Bloomsbury Went Further (The Overshoot):**
      *   **"Essentially Nothing Mattered Except...":** Moore *did* list other things as intrinsically good (though lesser), like pleasures of sense and perhaps virtues (though he was ambivalent). Bloomsbury, especially in Keynes's youthful recollection, seems to have dismissed these, focusing *only* on the "higher" states.
      *   **De-emphasis of Consequences for Others:** While Moore defined right action instrumentally (producing best consequences), the young Apostles interpreted this in a remarkably narrow, personal way. Keynes admits in "My Early Beliefs" that they were "utterly indifferent" to consequences beyond their immediate circle. They focused almost entirely on cultivating their *own* states of mind and those of their friends. Moore's framework *could* justify a broader concern for maximizing these states universally, but Bloomsbury largely ignored this implication. The principle of organic unity, emphasizing the intrinsic value of the private state *itself*, could be (and was) easily twisted to justify this self-absorption.
      *   **Ignoring Moore's Nuance on Duty:** Moore took rules of duty derived from probable consequences seriously. The young Apostles, Keynes recalls, treated them as mere conventions, focusing only on the end-state. The principle of organic unity, by highlighting the *disconnect* between the value of the means/conditions and the value of the whole, could foster a sense that the messy world of action was inherently less important or valuable.
  3.  **The Stone Analogy's Role in the Overshoot:** By insisting parts retain their *own* value regardless of the whole, the analogy reinforced the idea that actions/consequences (the necessary "parts" or "means") possessed *only* their own, usually low, instrumental value. It prevented them from "borrowing" value from the states of mind they facilitated, making them seem ethically insignificant in themselves.

  **Conclusion:**

  *   **Moore's Argument Was Foundational:** The principle of organic unity wasn't just a narrow logical point for Keynes/Bloomsbury. It was the *technical bedrock* that allowed them to argue that the highest good resided *solely* in complex private states of consciousness. It provided a rigorous philosophical reason to dismiss the intrinsic ethical significance of action, achievement, consequences, and material conditions *in themselves*. It explained *why* focusing on states of mind wasn't selfish hedonism but a pursuit of the most profound intrinsic goods.
  *   **But They Leaned Into It Selectively:** Young Keynes and his circle amplified Moore's emphasis on states of mind while downplaying his caveats about lesser goods and (especially) his instrumentalist approach to duty and consequences for society at large. They used the principle's implications about the low value of parts/means to justify a near-total neglect of the external world of action and broader consequences beyond their intimate circle.
  *   **Honest Assessment:** Keynes, at twenty, *was* reading a very specific, radical ethic *out of* Moore, but it wasn't pure invention. He was taking Moore's strongest implications about the supremacy and self-contained nature of certain states of mind and running with them, while neglecting counterbalancing elements in Moore's work (like the derivation of duty). **The principle of organic unity *could* logically support the Bloomsbury focus, but it didn't *necessitate* their near-total dismissal of consequences, action, and broader duty.** Their interpretation was a valid, though extreme and selective, reading of Moore's ethics, energized by youthful rebellion against Victorianism and a desire for a life centered on beauty and friendship. Keynes himself, in "My Early Beliefs," is deeply critical of this youthful interpretation, calling it "flimsily based" and lacking a proper appreciation of human nature and the real world – a critique informed by his later experiences, including the development of his economic theories focused precisely on action and consequences in a complex social system.
