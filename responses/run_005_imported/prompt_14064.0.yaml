prompt: |-
  So I've been going back and forth with a friend from my cohort about quantum suicide/immortality and I want to actually get the argument down properly instead of just vibing about it over beers. You know the Tegmark-style setup: you wire a device to some quantum RNG so that it kills you (instantly, painlessly) unless a given quantum event comes out a certain way, and the claim is that under many-worlds you should feel totally fine pulling the trigger over and over, since "you" only ever end up experiencing the branches where you survived. My friend's position is basically that this goes through as soon as MWI is literally true, full stop, no further assumptions needed. I think that's wrong, and that the whole argument is quietly smuggling in one particular (and pretty contestable) answer to the measure/probability problem in Everettian QM, and that on the more standard answer the "immortality" conclusion just evaporates.

  Could you write out the strongest version of my side of this for me? Specifically I want an argument that quantum-suicide reasoning only gets you to "you'll subjectively survive so it doesn't matter" if you help yourself to a naive branch-counting rule for self-locating credence/anticipation, and that once you switch to the amplitude-weighted "caring measure" approach that people like Wallace defend (deriving Born-rule-ish credences decision-theoretically instead of just counting branches 1-for-1), repeatedly playing quantum Russian roulette comes out exactly as bad an idea in expectation as ordinary Russian roulette — so the "you'll never experience dying, therefore its fine" framing is either trivially true in a way that gives you no comfort at all, or just false.

  The part I actually can't cleanly rebut, and where I'd like the argument to really engage rather than hand-wave, is my friend's comeback: something like "credence/anticipation just isn't the kind of thing that should be weighted by amplitude in the first place, since after the split there straightforwardly is a future you who survived, period, regardless of how much 'measure' that branch has." I have a feeling there's something question-begging in that move but I haven't been able to pin down exactly what, so if the argument can land a real blow there that'd be huge.
