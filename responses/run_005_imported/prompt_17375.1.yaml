answer: |-
  The conservativeness argument poses a significant challenge to deflationism by demonstrating that adding a truth predicate governed by the T-schema (`"P" is true iff P`) to Peano Arithmetic (PA), and extending the induction schema to include formulas containing the truth predicate, results in a **non-conservative extension** (let's call this theory **PA(S)**). PA(S) proves arithmetical statements *not* provable in PA alone, most notably a statement equivalent to the consistency of PA (Con(PA)).

  **Why this threatens deflationism's "thinness" claim:**

  1.  **Explanatory Power Contradiction:** Deflationism claims the truth predicate has *no substantive explanatory role*; its *only* function is expressive generalization via the T-schema. The non-conservativeness result seems to show it *does* have substantive logical power. By enabling new arithmetical proofs (like Con(PA)), the truth predicate demonstrably contributes *explanatory power* to the base theory. This contradicts the core deflationist tenet that truth is explanatorily inert.
  2.  **Metaphysical Weight Implication:** If the *mere addition* of a predicate satisfying the seemingly "deflationary" T-schema, plus allowing its use in induction, grants the theory the power to prove significant new arithmetical facts (facts about the natural numbers themselves), it suggests this predicate is tracking something more robust than just a device for disquotation. It appears to be interacting with the fundamental structure of arithmetic in a way that confers additional deductive strength, hinting that it might be representing a substantive property after all.
  3.  **Gödelian Significance:** The specific new theorem, Con(PA), is profoundly significant. Gödel's Second Incompleteness Theorem shows PA (if consistent) *cannot* prove its own consistency. PA(S), however, *can* prove it. This means the deflationary truth predicate, in this setting, provides access to *metatheoretical knowledge about the base system* that was fundamentally inaccessible without it. This strongly suggests the truth predicate is doing heavy logical lifting, far beyond merely allowing generalizations like "Everything the Pope says is true."
  4.  **The Conservativeness Intuition:** Deflationists often rely on an intuition that adding a "merely logical" or "expressive" device *should* result in a conservative extension – it should let you say new things *about* truth, but not discover new facts *about the original subject matter* (arithmetic). The non-conservativeness blatantly violates this intuition. If truth is truly "thin," adding it shouldn't change the arithmetical facts we can prove.

  **Deflationist Maneuvers and Their Challenges:**

  Deflationists have proposed responses, but each faces significant challenges:

  1.  **Restricting Induction (The Most Common Response):**
      *   **The Maneuver:** The deflationist argues that the induction schema of PA should *not* be extended to formulas containing the truth predicate. Induction is a principle *about numbers*, and formulas involving semantic notions like truth are not purely arithmetical. Only formulas in the *original* language of arithmetic (without 'true') should be allowed in induction instances. Let's call this restricted theory **PA(T)**.
      *   **Principled Way Out?** *Problem 1: Ad Hoc Restriction?* Critics argue this restriction is *ad hoc* and lacks a principled deflationist justification. Why *shouldn't* induction apply to truth-involving formulas if truth is just a logical device for generalization? The restriction seems motivated *solely* to avoid the embarrassing non-conservativeness, not by core deflationist principles. It appears to concede that the truth predicate is "special" in a way that requires handling with kid gloves.
      *   **Problem 2: Expressive Limitations:** Deflationism emphasizes truth's role in enabling generalizations. If induction is restricted, the ability to formulate and prove certain generalizations *about* truth within the theory might be severely hampered. For example, proving "All theorems of PA are true" (a natural deflationary generalization) likely requires induction over formulas containing 'true'. Restricting induction blocks this, undermining a key motivation for having a truth predicate.
      *   **Problem 3: Justifying the Base Logic:** What justifies *any* instance of induction? If induction over purely arithmetical formulas is justified by our understanding of the natural numbers, what principle justifies *excluding* formulas involving a predicate whose meaning is supposedly given entirely by the T-schema? Deflationists struggle to provide a non-question-begging answer.

  2.  **Hierarchical Truth (Tarski-Style):**
      *   **The Maneuver:** Instead of one truth predicate, posit a hierarchy of truth predicates (True₀, True₁, True₂,...). True₀ applies only to sentences not containing *any* truth predicate. True₁ applies to sentences possibly containing True₀, but not True₁ or higher, and so on. Induction is only extended to formulas containing truth predicates *of a specific level*, not to formulas quantifying over levels.
      *   **Principled Way Out?** *Problem: Complexity & Deflationist Spirit:* This introduces significant complexity and revives the very hierarchical structure deflationists (especially disquotationalists/minimalists) sought to avoid. It makes truth context-dependent and fragmented, conflicting with the deflationist ambition of a simple, general, and unified truth predicate. It feels like conceding that truth *is* a substantial notion requiring careful stratification to avoid paradoxes and non-conservativeness.

  3.  **Syntactic Approaches:** Some deflationists suggest achieving the needed generalizations through purely syntactic means (e.g., using provability predicates) rather than a semantic truth predicate.
      *   **Principled Way Out?** *Problem: Expressiveness Gap:* Syntactic predicates are complex and may not capture the intended *semantic* generalization facilitated by "is true." Deflationism's core appeal is often the *simplicity* and *directness* of the truth predicate for expressing generalizations like "Everything he said was true." Replacing it with cumbersome syntactic constructions undermines this key advantage.

  4.  **Embrace Non-Conservativeness:** A radical move is to accept non-conservativeness but deny it shows truth is substantial.
      *   **Principled Way Out?** *Problem: Undermines Core Motivation:* This directly contradicts the deflationist intuition that adding truth *should* be conservative. If PA(S) genuinely proves new arithmetical facts (like Con(PA)), it's hard to maintain that the truth predicate contributed nothing substantial to achieving this knowledge. This seems like abandoning the core deflationist claim rather than defending it.

  **Conclusion:**

  The conservativeness argument presents a formidable challenge to deflationism. It demonstrates that a truth predicate governed *only* by the T-schema, when fully integrated into a base theory like PA via extended induction, acquires significant logical power, proving new arithmetical theorems. This directly contradicts the deflationist claim that truth is explanatorily and metaphysically "thin."

  While the most common deflationist response is to **restrict induction** to the base language, this move is widely seen as **lacking a principled justification within deflationism itself**. It appears *ad hoc*, motivated by the need to avoid the problematic consequence rather than by the core tenets of the view. It also potentially cripples truth's role in enabling generalizations. Alternative maneuvers (hierarchies, syntactic approaches) introduce significant complexity or fail to capture the intended expressive role of truth, conflicting with deflationism's spirit of simplicity and universality. Embracing non-conservativeness abandons a central deflationist intuition.

  Therefore, the conservativeness argument remains a powerful objection, suggesting that the deflationist conception of truth, if it is to be coherently added to a theory like PA and used in reasoning, must either concede more logical/metaphysical substance to truth than it claims or impose seemingly arbitrary restrictions (like on induction) that themselves require justification and potentially undermine the view's motivations. Finding a truly principled way out remains a significant task for deflationists.
