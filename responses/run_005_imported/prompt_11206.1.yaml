   The student says: "I'd push back on that claim." and argues that score voting still outputs a social ranking and hence is subject to Arrow's impossibility.

   However, note: Arrow's theorem applies to social welfare functions that map ordinal preferences (rankings) to a social ordering. Score voting uses cardinal ballots (ratings) and aggregates them by summing (or averaging) to get a social ordering. Therefore, the input is not an ordinal ranking but a vector of ratings. 

   Since Arrow's theorem assumes that the input is ordinal (complete and transitive individual preferences), it does not directly apply to cardinal methods. 

