prompt: |-
  So I run a tiny podcast where I interview people from the ai-safety/rationalist corner of the internet about weird decision theory stuff, and next week's guest defends "acausal trade" -- the idea that agents who can never meet or causally affect each other (distant civilizations, simulated copies of you, whatever) can still rationally cooperate. I don't want the episode to just be her restating the LessWrong-101 pitch, so can you draft 8-10 interview questions that dig into the actual mechanics? I want at least one question each on: the Löbian obstacle to two theorem-proving agents ever trusting each other's proofs of cooperation without the whole thing collapsing into paradox; why this even deserves to be called "trade" rather than correlated decision-making dressed up in trade language; why you'd need something like updateless decision theory instead of plain CDT/EDT for any commitment to actually bind across the deal; and how two agents who can't communicate at all are supposed to land on a specific split of the gains instead of each just unilaterally doing whatever and calling it a deal. End with a question on the acausal blackmail worry, since thats the obvious evil twin of the whole idea, and whether her view has any principled way to let in the good kind of acausal cooperation while keeping out the bad kind. For each question, add a quick note on the dodge she'll probably reach for and a follow-up that closes it off.
