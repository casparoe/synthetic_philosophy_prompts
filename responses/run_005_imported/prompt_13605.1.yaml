  Here’s a draft memo addressing the committee’s dilemma, structured to take the "leave it alone" position seriously while proposing a nuanced path forward. It balances intellectual rigor with ethical responsibility:

  ---

  **MEMORANDUM**  
  **To:** Committee Members, Frege Graduate Essay Prize  
  **From:** [Your Name/Position]  
  **Date:** [Date]  
  **Subject:** Recommendation on Renaming the Frege Graduate Essay Prize  

  ### I. Context & Core Tension  
  Recent concerns regarding Frege’s posthumously published diaries (revealing antisemitic and authoritarian views) present a legitimate challenge. The committee’s division reflects a fundamental tension:  
  - **"Leave It Alone" Position**: Frege’s transformative contributions to logic (e.g., *Begriffsschrift*, sense/reference distinction) exist independently of his personal failings. His own philosophy insists that the validity of a truth is separate from the psychology/morality of its discoverer. Renaming risks conflating logical work with personal prejudice and imposing presentism on historical figures.  
  - **"Rename" Position**: The prize is not merely an acknowledgment of abstract truths but an active *honor*. Continuing to venerate Frege’s name without context alienates scholars, especially those from groups targeted by his views, and disregards how exclusionary ideologies permeate academia.  

  ### II. Evaluating the "Leave It Alone" Argument (Seriously)  
  The case for retaining Frege’s name merits rigorous engagement:  
  1. **Philosophical Consistency**: Frege’s principle—that truth is objective and context-independent—is foundational to analytic philosophy. Rejecting his work due to his beliefs would ironically violate his core insight.  
  2. **Historical Nuance**: Many early 20th-century figures held problematic views by modern standards. Judging them solely through a contemporary lens risks erasing their intellectual legacy.  
  3. **Precedent Concerns**: Renaming sets a slippery slope. If Frege—a pillar of logic—is "cancelled," where does this end? Should we reassess every eponymous award?  
  4. **Impact on Scholarship**: The prize incentivizes engagement with Frege’s *logic*, not his diaries. Disassociating the work from the individual aligns with academic focus.  

  ### III. Why "Leave It Alone" Is Nevertheless Insufficient  
  Despite these points, retaining the status quo is untenable for three reasons:  
  1. **The Prize as Honor vs. Scholarship**: Awards are not neutral academic acts; they convey institutional values. Honoring Frege *by name* signals endorsement of his *legacy*, not just his ideas. His diaries (written in 1924, not an immature work) reveal convictions antithetical to the inclusive community academia strives to be.  
  2. **Suppression as Complicity**: The diaries’ omission from collected papers until the 1990s reflects a prior choice to sanitize history. Retaining the name without acknowledgment perpetuates this erasure.  
  3. **Impact on Recipients**: Graduate students receiving an award named after an avowed antisemite may feel the prize contradicts their dignity or the department’s ethics. This undermines the award’s purpose.  

  ### IV. Recommended Path: Contextual Retention  
  **Proposal: Retain "Frege" but reframe the prize as "The Frege Prize in Logic: Examining Foundations and Contexts."** This approach:  
  - Preserves recognition of Frege’s unparalleled contributions to logic.  
  - Explicitly acknowledges the full historical record without endorsement.  
  - Encourages critical engagement with the relationship between intellectual work and its creators.  

  #### Implementation:  
  1. **Formal Statement**: Add a permanent, concise disclaimer to prize materials:  
     > *"This prize recognizes Gottlob Frege’s foundational work in logic. Frege’s posthumously published diaries contain reprehensible antisemitic and authoritarian views, which the department condemns. The prize affirms that critical engagement with complex legacies is central to philosophical inquiry."*  
  2. **Lecture Series**: Launch an annual lecture on "Ethics in the History of Logic," inviting winners to reflect on tensions between intellectual merit and moral failing.  
  3. **Syllabus Inclusion**: Encourage courses on Frege to address his diaries, modeling how scholars confront problematic histories.  

  ### V. Why This Approach?  
  - **Intellectual Honesty**: Confronts the totality of Frege’s legacy head-on, respecting his philosophy’s rigor while rejecting his bigotry.  
  - **Educational Value**: Transforms the prize into a catalyst for discussing philosophy’s social responsibilities.  
  - **Pragmatism**: Avoids divisive erasure *or* uncritical veneration. Most renaming debates seek middle grounds (e.g., adding context to Hoover’s FBI Building).  

  **Recommendation:** Adopt **contextual retention**. This honors Frege’s logic without sanitizing history, upholds departmental values, and centers the prize on critical scholarship—not uncritical hero-worship.  

  ---  

  ### Key Strengths of This Approach:  
  - **Acknowledges "Leave It Alone" Concerns**: By retaining Frege’s name and citing his philosophy’s core tenets.  
  - **Addresses Ethical Risks**: Explicit condemnation + institutional actions demonstrate accountability.  
  - **Turns Tension into Pedagogy**: Leverages the controversy to deepen philosophical discourse.  

  This memo provides a defensible, third-way solution that avoids both moral absolutism and historical amnesia. Let me know if you’d like adjustments for tone or emphasis.
