answer: |-
  You've hit on a classic and important point in the philosophy of probability, but this isn't a genuine counterexample to Lewis's Principal Principle (PP) as he formulated it. Your intuition about what you *should* believe after your friend's tip is absolutely correct, but Lewis anticipated exactly this kind of scenario. Here's why:

  1.  **Lewis's Formulation Includes "Admissible Evidence":** The core insight is that Lewis didn't say "Credence in A given *only* chance(Ch) should be Ch(A)." He said:
      `Cr(A | Ch_t(A) = x & E) = x`
      ...**provided that E is *admissible* with respect to A at time t.**

  2.  **What is "Admissible Evidence"?** This is the crucial part. Lewis defined admissible evidence roughly as:
      *   **Historical information:** Information about events occurring *up to and including* time `t`.
      *   **Theories of chance:** Information specifying what the chances *are*.
      *   Information that "screens off" the past from the future *in the way that chance does*. Crucially, **information about the specific future outcome A itself is *inadmissible*.**

  3.  **Applying it to Your Coin Flip:**
      *   **Before your friend's tip:** Your total evidence `E` consists of general background knowledge and the knowledge that the chance of heads *right now* is 0.5. This evidence *is* admissible (it's historical/theoretical). Therefore, PP dictates `Cr(Heads | Ch(Heads)=0.5 & E) = 0.5`. This seems right.
      *   **After your friend's tip:** Your total evidence `E'` now *includes* your friend's reliable testimony that the coin *will* land heads. **This testimony about the specific future outcome A is *inadmissible* evidence with respect to A at time t (before the flip).** Therefore, the PP *does not apply* when conditioning on `E'`. The proviso "provided E is admissible" is not satisfied.

  4.  **Why Your Friend's Testimony is Inadmissible:**
      *   It directly concerns the truth of the proposition `Heads` *itself*, bypassing the chancy mechanism.
      *   It reveals the *actual outcome*, not just the propensity or tendency given by the chance.
      *   The chance of 0.5 describes the *indeterminacy* inherent in the coin flip process *just before* it happens. Your friend's testimony provides information that *defeats* this description of indeterminacy for *this specific instance* – it tells you how the indeterminacy was resolved, even before the resolution is physically manifest.

  5.  **What You Should Believe:** After the tip, your rational credence *should* be very high (approaching 1, depending on your confidence in your friend's reliability). This is perfectly rational and is determined by standard conditionalization on your *total* evidence `E'` (which includes the inadmissible information), *not* by the Principal Principle applied naively to the chance value alone. The chance value 0.5 is still *true* as a description of the coin's propensity *just before the flip*, but it's no longer the only relevant information you possess about the outcome.

  **Where You Went Wrong (and Why It's a Great Example!):**

  You assumed the PP says: "Your credence in A should *always* equal the chance of A at time t, *no matter what other information you have*." Lewis *never* said this. He built in the crucial caveat about admissible evidence precisely to handle cases like crystal balls, time travelers, oracles, and reliable future-tellers.

  **Why This is a Fantastic Seminar Example:**

  This example *perfectly* illustrates:
  1.  **The core idea of PP:** How chances rationally constrain credences under conditions of ignorance about the specific outcome.
  2.  **The critical role of admissibility:** Why PP only applies in specific epistemic situations (when you lack "inside information" about the outcome).
  3.  **The distinction between chance and credence:** Chances are objective features of the world (propensities, tendencies) at a time, while credences are subjective degrees of belief based on total evidence. Chances *guide* rational credences *when the evidence is appropriate*.
  4.  **The time-dependence of chance:** The chance of heads is 0.5 *only* up until the moment the coin lands. After it lands, the chance becomes either 1 or 0. Your friend's testimony gives you information equivalent to knowing the outcome *after* it lands, rendering the pre-flip chance irrelevant for your *current* belief about the outcome.

  **Conclusion:**

  Your example doesn't sink the Principal Principle; it beautifully highlights its sophisticated structure. The inadmissibility clause is essential. Lewis's PP successfully explains why you should believe 0.5 *before* the tip (based on admissible evidence) and why you are rationally compelled to abandon that 0.5 credence *after* the tip (due to inadmissible evidence). It captures the rational interplay between objective chance and subjective credence precisely by *not* demanding that credence match chance when you possess defeating information about the specific outcome. Use this example in your seminar – it's a classic precisely because it forces students to grapple with the crucial concept of admissibility!
