  First, I need to recall what the Principal Principle actually says. Lewis distinguishes between admissible and inadmissible information. Admissible information includes things like historical data and physical laws, while inadmissible is stuff like future predictions. The friend's knowledge of the future outcome is clearly inadmissible. So the Principal Principle only applies when you don't have such information. The user's example includes inadmissible info, so it doesn't violate the principle.

