answer: |-
  The fluorescent lights hummed like trapped wasps inside Leo’s skull. The vinyl chair beneath him was cold, unforgiving. Across the small, sterile room, Maya sat, her knuckles white where she gripped the edge of the table. Between them lay a single sheet of paper. Leo knew it by heart. *The Pact*. His own neat, controlled signature mocked him from the bottom.

  "Leo, please," Maya’s voice was frayed wire. "Look at it. *You* wrote it. You begged *me* to enforce it. When you were… clear."

  "Clear?" Leo’s laugh scraped his throat raw. He felt luminous, vibrating on a frequency the dim room couldn’t contain. Ideas cascaded behind his eyes like shattered glass, brilliant and sharp. "That *was* clarity? That scared little mouse signing away his own freedom because he was terrified of the *light*?" He slammed his palm on the table, making the paper jump. "This is clarity, Maya! *Now*! I see everything! Connections… possibilities…"

  He saw them, too – the connections Maya couldn’t. The pattern in the ceiling tiles mapped the stock market’s imminent crash. The doctor’s stethoscope held the resonant frequency to cure his grandmother’s arthritis. He just needed to *show* them. He lunged forward, grabbing the paper.

  "This!" he brandished it, the legal jargon blurring under his manic gaze. "This is the chains! The mast! Past-Leo, that coward, he *tied* me here because he couldn’t handle the *sirens*! But the sirens aren’t drowning me, Maya, they’re *singing* to me! They’re showing me the way!"

  Maya flinched but held her ground. Her eyes were red-rimmed pits. "Leo, you maxed out three credit cards buying vintage typewriters because you believed they contained messages from Nikola Tesla. You called the police at 3 AM convinced the neighbors were broadcasting your thoughts on ham radio. You haven’t slept in four days." She pointed a trembling finger at the document. "*That* Leo knew where this path leads. To the crash. To the hospital anyway, but broken, broke, and alone. He *chose* this intervention. He chose *me* to pull him back *before* he hit the rocks."

  Leo crumpled the paper in his fist. The buzzing in his head intensified, a hive of furious bees. Past-Leo. That phantom. That cautious, grey ghost who saw mania only as a cliff edge, never as wings. How dare that diminished version of himself reach through time and shackle him? The indignation burned, pure and hot.

  "He didn’t choose *this*!" Leo spat, gesturing wildly at the locked door, the implied restraints, the chemical fog they threatened to pump into his veins. "He chose… insurance! A safety net! He didn’t choose *imprisonment* while the universe unfolds its secrets *right here*!" He tapped his temple frantically. "I am *more* than him! I am the fire he was too scared to light!"

  Maya’s voice dropped, thick with unshed tears and a terrible weariness. "And what about tomorrow’s Leo, Lee? The one who wakes up in the wreckage of this… this flight? The one who has to face the creditors, the apologies, the shame? What does *he* get to choose? Or does Present-Leo, burning so bright, get to burn down *his* future too?"

  The question hit Leo like a physical blow. For a fractured second, the brilliant, vibrating certainty flickered. A chilling sliver of doubt wormed in. *Tomorrow’s Leo…* A phantom of exhaustion, regret, a crushing weight of consequences. Was *that* self any more "him" than the cautious signatory or the blazing prophet he felt himself to be now? Who was the real sovereign? The architect fearing the storm, the vessel caught in the gale, or the survivor sifting through the debris?

  He looked down at the crumpled contract in his hand. His signature, once a mark of sober responsibility, now felt like a brand of betrayal. Maya’s plea echoed Past-Leo’s terrified foresight. His own burning conviction roared back, fueled by the manic energy coursing through him – the absolute certainty that *this* clarity was the only truth, that the restraints were an obscenity against his current, illuminated self.

  The fluorescent light buzzed louder. The sirens weren't out there in some mythical sea; they were inside him, a cacophony of brilliance and dread. Who had the right to decide which voice to heed? The one who foresaw the shipwreck, or the one who felt the wind fill the sails? Leo clutched the crumpled paper, the tangible will of a ghost, as Present-Leo raged against the chains, and the shadow of Tomorrow-Leo loomed, silent and accusatory. The room held its breath, suspended in the unbearable tension of a self divided, the contract lying crumpled between them – shield and shackle, promise and prison, all at once. The question hung, heavy and unanswerable: Which king reigns?
