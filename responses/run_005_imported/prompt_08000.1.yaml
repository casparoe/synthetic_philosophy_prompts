  ## The Viewport Argument (798 words)

  The Berlin branch shimmered, a kaleidoscope of Priya’s unlived life: lectures in sun-dappled halls, arguments in smoky Kneipen, solitary walks along the Spree. Here stood *this* Priya, knuckles white on the viewport’s cold rim, her reflection superimposed on the image of a woman who looked exactly like her, laughing with strangers. A woman who’d taken the fellowship. Who’d never met Dev.

  “It’s… staggering,” Priya whispered, her voice thick. “To see it. To *know* she exists. That a part of me… that *I*…” She trailed off, searching for the words, the comfort. “That somewhere, I didn’t make the choice that broke me.”

  Dev stood beside her, his posture rigid, eyes fixed on the scene. “That’s not you, Priya.” His voice was low, controlled, the familiar pedantic edge sharpened by the raw tension. “Not in any sense that matters. That’s a counterpart. Someone similar. Close enough to make it true that *you* could have gone to Berlin. But she’s sealed in her world. We’re sealed here.”

  Priya flinched as if struck. She turned, eyes blazing. “Could have? Dev, *look* at her! That’s not just ‘similar enough’! That *is* me! The same person, just… tracked down a different path. Kripke had it right – we don’t need some magical qualitative telescope to *verify* identity across worlds. We *stipulate* it. We point and say, ‘That’s Priya if she’d gone to Berlin.’ It’s *her*.”

  Dev snorted, a dry, humorless sound. “Stipulation? That’s just waving your hands, Priya. Pointing and saying ‘that’s her’ doesn’t *explain* what makes it her. What, precisely, is being ‘tracked’? If it’s not a bundle of properties – memories, choices, physical continuity – then what is it? Some ghostly, irreducible *thisness*? A haecceity floating untethered from all the actual things that *make* you Priya?” He leaned closer, his intensity almost physical. “You’re invoking a metaphysical primitive. A ‘Priya-ness’ that exists independent of everything she *is* or *does*. That’s not philosophy; it’s mysticism dressed up in modal logic.”

  Priya met his gaze, a flicker of the old debate-hungry student surfacing through the hurt. “And your counterpart relation is pure, objective science, is it? Tell me, Dev, what’s the similarity metric? How much ‘Priya-ness’ does someone need before they qualify as *my* counterpart in another world? Is it 90% shared properties? 85? Does shared DNA count more than shared life choices? What if,” she pressed, stepping forward, “in *that* branch,” she jabbed a finger at the viewport, “there are *two* women who both resemble me almost perfectly? Both took the fellowship, both look like me, but one has a scar I don’t, the other hates jazz. Who’s the *real* counterpart? Or do I get two? Or none, if the resemblance isn’t *quite* perfect enough by your arbitrary standards?”

  Dev’s jaw tightened. He hated the vagueness charge. “Context matters,” he conceded, grudgingly. “The counterpart relation *is* context-dependent. We’re asking ‘could Priya have gone to Berlin?’ So the relevant similarity is tied to the properties involved in *that* possibility – her qualifications, her ambitions at the time, the state of the world then. Other differences become irrelevant noise.”

  “Irrelevant noise?” Priya’s laugh was brittle. “So, you admit it’s fluid! Your ‘sealed worlds’ are connected by a relation built on shifting sands. Context decides who counts as me over there. That’s a huge cost, Dev! It means there’s no *fact of the matter* about who my counterparts are until we impose our question. My view might posit a primitive identity, but yours relies on a primitive *similarity* – and one that’s fundamentally vague and observer-relative. How is that *less* mysterious than saying the identity just *is*, tracked through the branching paths?”

  “Because similarity, however context-bound, deals with *actual properties* we can point to!” Dev shot back, frustration cracking his controlled tone. “We can argue about which properties are salient, but they exist! They’re part of the fabric of the worlds. Your ‘tracked identity’… what is it tracking *with*? If it’s not properties, what’s the mechanism? You’re asking me to accept that ‘Priya’ is some bare particular that hops across logical space like a ghost, untouched by the choices that define her? That the woman over there, living a life utterly devoid of *us*, devoid of everything that shaped *you*… is somehow *you*? That’s not comfort, Priya, that’s annihilation! It renders *this*,” he gestured wildly between them, then at himself, “meaningless! Just one accidental configuration of a ghost!”

  Priya recoiled, the color draining from her face. Dev’s words landed like blows, exploiting her deepest fear – that this view made *this* life, *this* love, *this* pain, merely contingent. She saw the Berlin-Priya laugh again, carefree. Untouched.

  “Meaningless?” Her voice was a ragged whisper. “Is that what you think *this* is? An accident?” She looked from Dev’s strained face back to the viewport. “So, according to you, that woman… she’s just a stranger who happens to look like me? Someone whose pain or joy I have no connection to? That’s your ‘smaller cost’? Cutting me off from… from the sheer *fact* of her existence as a version of *me*?”

  Dev ran a hand through his hair, the fight suddenly draining out of him, leaving only exhaustion and the chilling vista of the branch. He saw the wreckage in Priya’s eyes, the desperate need for the viewport to offer more than just a reflection of loss.

  “It’s not about cutting you off,” he said, his voice rough. “It’s about acknowledging the boundaries of what *is*. That branch is a whole, closed universe. We’re peering in. That woman is a product of *that* universe, shaped by its unique causal chain. To say she *is* you… it drags something alien *here*, into our world, our history. It pretends a connection that doesn’t physically, causally, exist. It’s…” He struggled. “…cheap solace. And it undermines the reality of *your* choices, *your* life, right here.”

  Priya stared at the laughing counterpart, then back at Dev, the man whose life was inextricably woven with hers through choices made and unmade. The philosophical scaffolding they’d built over years felt cold and hollow against the visceral ache. The counterpart shimmered, unknowable, separate. Dev stood beside her, real, agonizingly present.

  “Cheap solace,” she repeated dully. She leaned her forehead against the cold viewport, her breath fogging the image of the other life. “And your way? What solace does that offer, Dev? Just… sealed boxes and strangers?” The silence stretched, filled only by the low hum of the machine. The argument was spent, leaving only the raw, unanswerable truth of the viewport and the chasm it had opened between them.

  ---

  **Key elements addressed:**

  1.  **Philosophical Core:** Dev presses the haecceity charge against Priya's transworld identity ("What's being tracked? Primitive thisness?"). Priya counters with the context-dependency/vagueness of Dev's counterpart relation ("Who counts? Two counterparts? None?").
  2.  **Dialogue Flow:** Direct responses to the last point (e.g., Dev calls similarity "actual properties" after Priya calls it "shifting sands"; Priya asks "Is this meaningless?" after Dev says her view renders "this" meaningless).
  3.  **Beyond Humphrey:** The Humphrey reference is implicitly acknowledged as a starting point ("could have gone") but immediately superseded by the deeper identity debate. Kripke's stipulation is used as Priya's opening gambit, Lewis's sealed worlds as Dev's.
  4.  **Evenly Matched:** Both land strong points. Priya effectively highlights the arbitrariness/vagueness cost of counterpart theory. Dev effectively highlights the primitive/mystical cost and the potential for annihilation of *this* life's meaning inherent in strong transworld identity.
  5.  **Emotional Stakes:** The philosophy is inextricably tied to Priya's need for comfort/meaning and Dev's resistance born of intellectual honesty and fear of meaninglessness. The argument escalates their personal tension.
  6.  **No Resolution:** Ends on the exhaustion of the argument and the unresolved emotional/philosophical chasm, fitting the novel's context.
