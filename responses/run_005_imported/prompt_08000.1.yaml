  The 700-900 word limit means every line needs dual purpose: advancing argument while revealing character. Priya's lines should fray with desperation; Dev's get more pedantic as he armor-plates against her pain. That final "what do you want me to say?" is the real ending - philosophy fails when faced with grief.
