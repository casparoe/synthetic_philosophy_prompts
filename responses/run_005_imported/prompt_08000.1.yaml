  The emotional subtext is vital. Priya needs this to mean something comforting - that part of her exists unscathed elsewhere. Dev can't let her have that comfort because he believes it's philosophically dishonest. Their academic history matters: they've had this argument for years, so shorthand references (e.g., "Cambridge qualifiers") would feel authentic.

  For structure:
  Opening should show Priya's raw reaction to seeing "herself" without Dev. Dev's first counter must undermine her emotional need while being technically correct. When Priya invokes Kripke, Dev should pounce on haecceities as mystical. Priya's best comeback is attacking counterpart theory's vagueness - "two equally good counterparts" is a killer point. End on unresolved tension: philosophy can't fix this wound.

  Key philosophical beats:
  1) Dev's salvo: "Not you. Never you." (Lewis' sealed worlds)
  2) Priya's Kripkean pivot: "That's me tracked, not matched" 
  3) Dev's haecceity challenge: "What's doing the tracking?" 
  4) Priya's similarity critique: "Your metric's arbitrary" 
  5) Dev's weak defense: "At least it's not primitive identity"
  6) The emotional collapse: "What do you want me to say?"

  Must avoid:
