answer: |-
  You've hit on a crucial and often glossed-over point. Your skepticism is well-founded: **Aquinas's specific argument in II-II, Q64, A7 is fundamentally about self-defense against an unjust aggressor, not about sacrificing an uninvolved bystander for the sake of others.** Stretching his reasoning directly to the trolley cases requires significant conceptual leaps and introduces elements *not present* in this passage. Let's break it down:

  1.  **Aquinas's Core Claim (Self-Defense Context):**
      *   **Intention is Key:** An act is morally defined by what you *intend*. A foreseen but unintended bad effect does not automatically make the act evil.
      *   **The Scenario:** You are attacked by an unjust aggressor. Defending yourself is lawful and intended (preserving your own life). The *death of the aggressor* is a *foreseen but unintended side effect* of your defensive action.
      *   **Proportionality:** Your defensive action must be *proportionate*. You cannot use excessive force beyond what is necessary to stop the attack. Killing is only justified if it's the *only* or *least harmful* way to stop the imminent, unjust threat to your life.
      *   **No Duty to Die:** You have a greater obligation to preserve your own life than the life of an unjust aggressor threatening it. You are not required to sacrifice yourself to avoid killing the attacker.

  2.  **Why the Trolley Cases (Especially Footbridge) Are Different:**
      *   **No Aggressor:** The central difference you identified is crucial. In the trolley cases:
          *   The five are threatened by an impersonal force (the trolley), not an unjust human aggressor.
          *   The one person on the side track or on the footbridge is **completely innocent and uninvolved**. They are *not* posing a threat to anyone. They are a bystander.
      *   **The Nature of the Harm:**
          *   **Switch Case:** Diverting the trolley *away* from five *towards* one. The death of the one is a *foreseen consequence* of saving the five, but arguably not the *means* itself (the means is redirecting the threat). The threat (trolley) is being *diverted*, not *used*.
          *   **Footbridge Case:** Pushing the person *actively uses their body* as a tool to stop the trolley. Their death is the *direct, necessary mechanism* by which the five are saved. It's hard to argue that killing them is merely a *side effect*; it is the *intended instrumental means*.
      *   **Proportionality's Scope:** Aquinas's proportionality condition applies to the force used *against the aggressor* in self-defense ("more violence than is necessary"). It doesn't directly address weighing the lives of *innocent bystanders* against each other. Is it "proportionate" to *kill* one innocent to save five? Aquinas doesn't answer that here.

  3.  **Can Aquinas's Reasoning *Stretch* to Cover Trolley Cases? (The "Smuggling" Question):**
      *   **The Switch Case (Diverting):** This is the *closer* fit, but still requires stretching:
          *   **Intention:** You intend to save five. The death of the one is foreseen but (arguably) unintended as an end in itself or as a means; it's a consequence of diverting the threat.
          *   **Proportionality:** One death vs. five deaths *might* seem proportionate *if* we accept the principle of weighing innocent lives. **However, this introduces a new element:** Aquinas's proportionality was about *defensive force against an aggressor*, not *sacrificing an innocent bystander*. The justification for the weighing itself isn't found in this passage.
          *   **Lack of Aggressor:** The biggest hurdle. Aquinas justifies killing the aggressor based on *their* unjust action threatening your life. The bystander did nothing wrong. Applying DDE here requires ignoring the "unjust aggressor" context and focusing *only* on the structure of intention and side effects.
      *   **The Footbridge Case (Pushing):** This is a **much harder fit**, bordering on misapplication of *this specific passage*:
          *   **Intention:** It's incredibly difficult to argue that killing the person is merely a *side effect*. You *need* them to die to stop the trolley; their death is the direct, intended mechanism. You are *using* them as a means. Aquinas's DDE explicitly requires that the bad effect not be the means to the good effect.
          *   **Proportionality:** Even if the numbers seem proportionate (1 for 5), the *act itself* – directly, physically causing the death of an innocent person – seems fundamentally different in kind from repelling an aggressor. Aquinas's proportionality condition *presupposes* a context of justifiable defensive force against an aggressor, which is absent here.
          *   **The Innocent Bystander:** Aquinas offers no justification in this passage for *directly killing an innocent person* for the greater good. His argument relies entirely on the aggressor's culpability creating a context where lethal defense can be proportionate.

  4.  **What Aquinas is *Actually* Claiming Here:**
      Aquinas is making a specific, narrow argument: **A private individual acting in immediate self-defense against an unjust aggressor may licitly use lethal force if it is necessary and proportionate, even though the aggressor's death is foreseen, because the *intention* is self-preservation, not killing.** He grounds this in natural law (self-preservation) and the aggressor's forfeiture of their right not to be harmed due to their unjust action.

  5.  **The Weight This Passage Can Bear for Trolley Cases:**
      *   **Foundational, Not Directly Applicable:** Aquinas's passage provides the *foundational structure* for the Doctrine of Double Effect (DDE): the distinction between intended/foreseen effects and the proportionality condition. This structure is essential for *formulating* analyses of the trolley problem.
      *   **Requires Significant Expansion/Modification:** To apply DDE to the trolley cases, especially the bystander versions, philosophers have had to **significantly expand and modify** Aquinas's original concept:
          *   **Dropping the "Aggressor" Requirement:** The core modern DDE used in trolley problems typically removes Aquinas's context of defending against an *unjust aggressor*. It focuses purely on the structure of action, intention, and consequences involving *any* persons.
          *   **Broadening Proportionality:** Proportionality is reinterpreted as a general weighing of the good and bad consequences (e.g., 1 life vs. 5 lives), detached from its original context of necessary defensive force.
          *   **Adding the "Means" Principle:** Modern formulations often explicitly add a principle Aquinas implies but doesn't state separately here: **You may not use an evil (e.g., killing an innocent) as a *means* to a good end, even if unintended as an end in itself.** This principle powerfully explains the intuitive difference between diverting (threat is diverted *away* from many *towards* one) and pushing (one is *used* as a shield/sacrifice).
      *   **Why it's Still Invoked:** Aquinas's passage is the *locus classicus* for the core ideas. Philosophers invoke it to show the historical roots of the DDE framework. However, claiming it *directly* and *fully* explains the trolley cases, especially the moral revulsion to the footbridge case, often involves **smuggling in the "means principle" and ignoring the crucial "unjust aggressor" context** that was essential to Aquinas's own justification for the foreseen killing.

  **Conclusion:**

  You are absolutely correct. Aquinas's argument in II-II, Q64, A7 is explicitly and fundamentally about **self-defense against an unjust aggressor**. It does *not* directly address the morality of sacrificing an *uninvolved, innocent bystander* to save others. Applying its reasoning (intention vs. side effect + proportionality) to the trolley cases requires:

  1.  **Ignoring the "unjust aggressor" element** central to Aquinas's justification.
  2.  **Broadening the scope of proportionality** from necessary defensive force to a general utilitarian-esque weighing of innocent lives.
  3.  **(Crucially) Adding the implicit "means principle"** to explain why using someone (footbridge) is worse than redirecting a threat towards them (switch).

  While Aquinas laid the groundwork for the *structure* of DDE, invoking *this specific passage* as the *complete* explanation for the trolley problem difference **does smuggle in significant extra assumptions** – primarily the shift from defending against an aggressor to sacrificing a bystander, and the explicit "means principle." The passage provides the core DDE *framework*, but applying it to bystander sacrifice requires substantial philosophical extension beyond Aquinas's immediate concern in this article. Your careful reading that identified the absence of the "innocent bystander" context is spot-on.
