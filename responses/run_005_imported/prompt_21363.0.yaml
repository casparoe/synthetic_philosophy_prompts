  We are scoring four moves in a debate about whether early-merge etiquette is a Lewis convention. The scoring scale is from -2 (clearly mistaken) to 2 (clearly right). We'll also provide a brief justification for each score and then a closing paragraph.

  First, let's recall David Lewis's definition of convention (from "Convention: A Philosophical Study"). For Lewis, a convention is:
  - A regularity R in behavior.
  - It is arbitrary (there's an alternative R' that could have served the same purpose).
  - It solves a coordination problem (each person's action depends on what others do).
  - It is sustained by a system of mutual expectations: people follow R because they expect others to follow R, and they prefer to follow R on condition that others do so.

  Now, let's break down the moves:

  **Move (1) by Marcus**: He claims that early-merge etiquette is a textbook Lewis convention. It is an arbitrary solution (since the zipper merge is an alternative) to a coordination problem, sustained by mutual expectations without need for law.

  **Move (2) by Renata**: She objects that if it were only about mutual advantage, it should be easy to shift when a superior equilibrium (zipper merge) becomes common knowledge. But campaigns have failed, and the hostility looks like moral outrage at a cheater, suggesting something beyond mutual expectation.

  **Move (3) by Marcus**: He replies that Lewis doesn't require conventions to be efficient or easy to dislodge. A suboptimal equilibrium can be stable because unilateral deviation imposes costs, so anger is part of the coordination problem and not necessarily evidence of a moral norm.

  **Move (4) by Renata**: She argues that the anger of drivers several cars back (who are not personally affected by one late merger) shows impartial, third-party indignation. This is the signature of a norm that has become stronger than a bare convention.

  Now, scoring and justification:

  **Move (1)**: Score 1 (mostly right, but with some caveats). 
  Justification: The early-merge practice does fit Lewis's definition: it is a regularity, arbitrary (zipper merge is an alternative), and it coordinates merging. However, it is not the most efficient, and Lewis allows for multiple equilibria. The fact that it is self-perpetuating by mutual expectation is key. But note: the hostility might indicate it has become more than a convention, so it's not a perfect textbook case.

  **Move (2)**: Score 1 (partially right, but overstates the ease of shifting conventions).
  Justification: Renata is correct that a convention sustained by mutual advantage might be shifted by common knowledge of a superior alternative, but Lewis does note that conventions can be very stable even when suboptimal. The failure of campaigns doesn't by itself prove the existence of a moral norm. However, the observation of moral outrage is a point in her favor.

  **Move (3)**: Score 2 (clearly right on the stability point).
  Justification: Marcus correctly points out that Lewis does not require conventions to be efficient or easy to change. A suboptimal equilibrium can be stable because of the expectations and the costs of deviation. The anger can be explained as frustration at a deviation that disrupts coordination, without invoking a moral norm. This is a strong point.

  **Move (4)**: Score 2 (clearly right about third-party reactions).
  Justification: Renata's observation about third-party indignation is crucial. Lewisian conventions are typically about the expectations and preferences of the parties directly involved in the coordination. Third-party enforcement (by those not directly affected) is not a feature of Lewis's conventions. This impartial anger suggests the norm has taken on a moral dimension, becoming a social norm in a stronger sense (like in Cristina Bicchieri's work, for example). This move effectively challenges the pure Lewisian account.

