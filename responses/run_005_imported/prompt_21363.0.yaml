  **Justifications:**  
  - **Move (1)**: Marcus is largely correct that early merging fits Lewis's core criteria (arbitrary regularity solving coordination via mutual expectations), but overlooks that Lewisian conventions typically lack moralized enforcement. Early merging shows signs of moralization, making it a partial fit. Score reflects validity but incompleteness.  
  - **Move (2)**: Renata rightly identifies the stability paradox and moral outrage as challenges to a pure Lewis account, but overstates how easily conventions shift; Lewisian equilibria *can* resist change even when inefficient. Score acknowledges her valid critique but overreach on "ease" of shifting.  
  - **Move (3)**: Marcus is clearly right: Lewis explicitly allows suboptimal conventions to persist due to expectation-dependent costs, and anger from direct inconvenienced parties aligns with coordination failure, not necessarily moral enforcement. Score reflects strong textual support.  
  - **Move (4)**: Renata is clearly right: Third-party indignation from unaffected drivers (e.g., those several cars back) exceeds Lewisian expectations. This impartial enforcement signals a moralized norm, not a bare convention, as Lewis focuses on personal payoff interdependence.  

  **Conclusion:** Early-merge etiquette began as a Lewisian convention but has hardened into a moralized social norm. The third-party enforcement and perceived "cheater" dynamics indicate it now carries normative weight beyond mutual expectations. This distinction matters critically for intervention: Public campaigns promoting zipper merges failed because they treated the issue as a coordination problem (addressing knowledge/payoffs) while ignoring the moralized enforcement. To succeed, campaigns would need to *denormalize* early merging (e.g., framing it as wasteful) and *renormalize* zipper merging (e.g., as "fair" cooperation), leveraging social influencers to reshape perceived obligations. Without dismantling the moral layer, purely informational efforts will likely continue to falter against the norm’s emotional enforcement.
