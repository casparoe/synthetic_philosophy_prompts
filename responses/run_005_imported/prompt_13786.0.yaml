prompt: |-
  Last night, a friend and I had a long argument about Jain anekāntavāda that neither of us managed to resolve. My friend maintained that once one accepts that no single naya can express the whole truth about an object, one is committed to a thoroughgoing relativism, on which every philosophical system is simply "true from its own standpoint" and none can be judged mistaken. I resisted this conclusion, since classical Jain thinkers plainly used anekāntavāda to argue that specific rival doctrines—an extreme insistence on permanence, say, or on momentariness—were one-sided errors rather than partial truths, yet I could not quite explain why this does not just collapse into the relativism my friend was describing. Given how syādvāda's conditional predications and the distinction between a legitimate naya and a fallacious one (nayābhāsa) are actually supposed to function, does anekāntavāda amount to relativism about truth, and if not, what within the doctrine does the work of ruling standpoints out rather than treating them all as equally valid?
reasoning: |-
  Okay, the user and their friend had a debate about Jain anekāntavāda, specifically whether it leads to relativism. The friend argues that if no single perspective captures the whole truth, then all perspectives are equally valid, leading to relativism. The user disagrees, pointing out that Jain thinkers criticized rival doctrines as one-sided, but couldn't explain why this isn't relativism.

  First, I need to recall the core concepts of anekāntavāda. It's the doctrine of manifold aspects, meaning reality is complex and can't be fully captured by one viewpoint. Then there's syādvāda, the theory of conditioned predication, which uses "syāt" (maybe) to qualify statements. Nayas are partial perspectives, and nayābhāsa are fallacious ones. 

  The user's main question is whether this leads to relativism. The friend's argument is that if all perspectives are partial, then they're all equally valid. But the user notes that Jains reject certain views as errors. So the challenge is to explain how anekāntavāda avoids relativism while still allowing for criticism of some viewpoints.

  I should start by defining relativism in this context. Relativism here would mean all truths are standpoint-dependent with no objective criteria to judge between them. Anekāntavāda, however, acknowledges an objective reality (dravya) with infinite attributes (paryāyas). The multiplicity of perspectives is because reality itself is complex, not because truth is subjective.

  Key points to address: syādvāda's conditional predications. Each statement is context-dependent, but contexts aren't arbitrary. They must correspond to actual aspects of the object. For example, saying "the pot exists" from the substance view is valid only if considering its material continuity. If the pot is broken, that statement might not hold. So syādvāda requires accurate context, not just any context.

  Then there's naya vs. nayābhāsa. A naya is a legitimate perspective that captures a real aspect without denying others. Nayābhāsa is a fallacy where one perspective is absolutized, denying other aspects. For instance, saying "the pot is permanent" as an absolute statement ignores its impermanent aspects, making it a fallacy. Jains criticize rival doctrines not for having a partial view but for claiming their view is the whole truth.

  The role of omniscience (kevala jñāna) is important too. The Tirthankaras see all aspects simultaneously, so they know the complete truth. While humans can't achieve that, the ideal of a comprehensive perspective sets a standard. This contrasts with relativism, which lacks any such ideal.

  Also, anekāntavāda's purpose is soteriological. Misunderstanding reality leads to karmic bondage. Correct understanding, which involves seeing multiple aspects, is necessary for liberation. This practical aim requires distinguishing correct from incorrect viewpoints, which relativism wouldn't support.

  So the user needs to understand that anekāntavāda avoids relativism by insisting on context accuracy, distinguishing legitimate from fallacious perspectives, acknowledging an objective reality, and aiming for a comprehensive view. The criteria for validity are whether a perspective captures a real aspect without denying others and whether the context is appropriate. This framework allows criticism of absolutist views without collapsing into relativism.
answer: |-
  Your resistance is well-founded. Classical Jainism explicitly **rejects relativism** while advocating anekāntavāda (doctrine of manifold aspects). Your friend's interpretation misses crucial distinctions within the doctrine, particularly the function of *syādvāda* and the concept of *nayābhāsa*. Here's how anekāntavāda avoids relativism:

  1.  **Objective Reality (Dravya) as the Foundation:** Anekāntavāda presupposes a complex, multi-faceted, but *objectively real* substance (*dravya*) with infinite attributes (*guṇas*) and infinite modes (*paryāyas*). The multiplicity of perspectives (*nayas*) arises because reality *itself* is infinitely complex, not because truth is subjective or standpoint-dependent in a relativistic sense. There is an objective "thing-in-itself" to be known.

  2.  **Syādvāda (Conditioned Predication): The Guard Against Absolutism AND Relativism:**
      *   **"Syāt" (Conditionally/May Be):** This crucial qualifier does *not* mean "true only for me/this group" (relativism). It means "true *under a specific condition*, *from a specific perspective*, *in a specific context*, *regarding a specific aspect* of the complex reality." The conditionality refers to the *aspect* being considered, not the subjective validity of the statement.
      *   **Simultaneous Validity of Multiple Predicates:** Syādvāda allows seemingly contradictory predications (*sat* - is, *asat* - is not, *avaktavya* - indescribable) to be applied to the *same* object, but *only when conditioned by different aspects*. "The pot *is* (from the perspective of its substance/clay at this moment)." "The pot *is not* (from the perspective of its past form as a lump or future form as shards)." "The pot *is indescribable* (when trying to assert its absolute, unconditioned existence or non-existence)."
      *   **The Key:** Each conditioned statement (*syād*) must *accurately correspond* to a *real aspect* of the object. It's not that "any statement goes if qualified with *syāt*." The statement must correctly identify a *genuine attribute or mode* under the specified condition. A *syāt* statement about a non-existent aspect is false.

  3.  **Naya vs. Nayābhāsa: The Core Distinction:** This is where the doctrine explicitly rules out relativism.
      *   **Naya (Valid Partial Standpoint):** A naya is a perspective that captures *one genuine aspect* of the complex reality *without denying the validity of other aspects captured by other nayas*. It is a *partial but correct* glimpse of the truth. Examples: *Dravyārthika naya* (focusing on the enduring substance), *Paryāyārthika naya* (focusing on the momentary modifications).
      *   **Nayābhāsa (Fallacious Standpoint):** This is the error anekāntavāda condemns. It occurs when:
          *   A partial perspective (*naya*) is mistaken for the *whole* truth (absolutism - *ekānta*).
          *   A perspective *denies* or *contradicts* other genuine aspects of reality that are valid from other nayas. This is the "one-sided error" you correctly identified as the target of Jain critiques.
          *   A perspective is applied *inappropriately* or refers to a *non-existent* aspect.
      *   **Why it's not Relativism:** Relativism says *all* perspectives are equally valid *within their own framework* and cannot be judged externally. Jainism says *only* those perspectives that correctly identify a genuine aspect *without denying other genuine aspects* are valid (*nayas*). Perspectives that absolutize, deny other aspects, or misidentify aspects are *invalid* (*nayābhāsas*) and *can be judged as false* based on their failure to correspond to the complex whole of reality. The rival doctrines criticized (e.g., eternalism, nihilism, strict momentariness) are seen as *nayābhāsas* – not just "another valid perspective," but *mistakes* arising from absolutizing one aspect.

  4.  **The Ideal of Kevala Jñāna (Omniscience):** Jainism posits that a perfected soul (*kevalin*) can attain omniscience, simultaneously comprehending *all* aspects (*paryāyas*) of *all* substances (*dravyas*) in all their modes, past, present, and future. This ideal underscores that:
      *   There *is* a complete, objective truth.
      *   Human knowledge is inherently partial (*naya*) but *aspires* to that completeness.
      *   Relativism, which denies the possibility or coherence of a complete truth, is incompatible with this ideal. Partial perspectives are stepping stones, not isolated, incommensurable truths.

  5.  **Soteriological Purpose:** Anekāntavāda isn't just an epistemological theory; it's tied to liberation (*mokṣa*). Misapprehension of reality (*mithyātva*) due to clinging to *nayābhāsas* (one-sided views) generates karmic bondage. Correct understanding, which acknowledges the manifold nature of reality without absolutism, is essential for shedding karma. Relativism, which would make *any* view potentially valid, undermines this soteriological goal.

  **How Anekāntavāda Rules Out Standpoints Without Relativism:**

  1.  **Correspondence Criterion:** A standpoint is valid (*naya*) only if it corresponds to a *real aspect* of the objective reality (*dravya*).
  2.  **Non-Denial Criterion:** A standpoint is valid only if it *does not deny* the reality of aspects correctly captured by other valid standpoints (*nayas*). It must be *compatible* with the complex whole.
  3.  **Contextual Appropriateness:** The standpoint must be applied within its proper domain and not extended beyond it to deny other domains.
  4.  **Condemnation of Absolutization:** Any standpoint that claims exclusivity or finality (*ekānta*) is automatically a *nayābhāsa* (fallacy), regardless of the aspect it highlights. This is the direct critique of rival doctrines.
  5.  **Hierarchy of Understanding:** While all *nayas* grasp partial truths, the understanding that *synthesizes* and *contextualizes* them through *syādvāda* is closer to the complete truth than any isolated *naya*, and vastly superior to any *nayābhāsa*.

  **Conclusion:** Anekāntavāda is **not relativism**. It is a sophisticated **non-absolutist realism**. It asserts an objective, complex reality knowable through multiple, conditioned, partial perspectives (*nayas*). The doctrine provides clear criteria (*syādvāda* framework, *naya/nayābhāsa* distinction) to *discriminate* between valid perspectives (those correctly grasping a real aspect without denying others) and invalid ones (*nayābhāsas* - those that absolutize, deny other aspects, or misidentify reality). This allows Jainism to vigorously critique rival one-sided doctrines as *errors* (*nayābhāsas*) precisely because they violate the core principle of anekāntavāda by denying the manifold nature of reality, not because they are merely "different perspectives" in a relativistic free-for-all. The "work" of ruling out standpoints is done by the criteria of correspondence to reality, non-denial of other aspects, and non-absolutization embedded within *syādvāda* and the *naya/nayābhāsa* distinction.
