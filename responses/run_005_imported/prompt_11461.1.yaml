answer: |-
  Based on Kepler's specific commitments as revealed in the *Tertius Interveniens* and *Harmonice Mundi*, and his documented practices, his verdict on modern astrology apps would likely be a complex, scathing critique with *one* begrudging nod, sharply divided along the lines of his own reforms:

  1.  **Approval (Limited & Technical):**
      *   **Astronomical Precision:** Kepler would unreservedly *approve* of the apps' use of precise, real-time astronomical data to calculate planetary positions ("the longitudes and latitudes"). This aligns perfectly with his demand that astrology be grounded in rigorous astronomy. He saw accurate celestial mechanics as the essential foundation any astrological claim must rest upon. The computational power would astound him, but he'd see it as fulfilling his vision for astronomy's dominance in the technical underpinnings.

  2.  **Fundamental Rejection (The Core Content & Method):**
      *   **The "Dung" of Astrology Endures:** Kepler would be *appalled* that apps prominently feature the very elements he dismissed as "dung" (*stercora*) – the Zodiac signs, the Houses, and the traditional interpretive rules derived from them. His *Tertius Interveniens* explicitly argued these lacked any geometric or harmonic basis and were superstitious accretions. Seeing them central to app interpretations would confirm his view that most astrologers were charlatans peddling nonsense.
      *   **Aspects: Hollowed Out:** While apps calculate aspects (the angular relationships), Kepler would reject their *interpretation* utterly.
          *   **Lack of Harmonic Resonance:** His core innovation in *Harmonice Mundi* was grounding aspects in a profound theory of universal harmony – geometric ratios resonating with the human soul's innate harmonic faculties. Apps reduce these potentially resonant geometric relationships to simplistic, pre-programmed keywords ("Challenging," "Supportive") devoid of any causal or metaphysical mechanism. For Kepler, this strips aspects of their *only* plausible significance.
          *   **Arbitrary Expansion/Truncation:** While Kepler *did* derive new aspects (e.g., quintile, biquintile) from harmonic theory, he did so systematically based on consonant ratios. Apps often include or exclude aspects arbitrarily or based on tradition, not his geometric/harmonic principles. He wouldn't recognize his own innovations in their implementation.
      *   **Empiricism Abandoned:** Kepler's painstaking collection of hundreds of horoscopes was aimed at *empirically testing* astrological claims over lifetimes. Apps generate interpretations algorithmically based on *assumed* correlations, with zero longitudinal empirical validation. This is the *opposite* of his reformist empiricism. It's mass-producing untested assertions, precisely the practice he condemned.
      *   **The Soul is Missing:** Kepler's astrology hinged on the *human soul's* capacity to resonate with celestial geometry. Apps offer generic, computer-generated psychological blurbs. The deeply personal, soul-level resonance central to Kepler's harmonic theory is entirely absent, replaced by impersonal algorithms mining linguistic databases for plausible-sounding statements. He'd see this as profoundly mechanistic and dehumanizing, missing the essential point.

  3.  **The "Foolish Daughter" Analogy Intensified:**
      *   Kepler called astrology astronomy's "foolish daughter" who paid the bills. Apps take this to a grotesque extreme. The "wise mother" (astronomy) provides the *only* genuine value (precise calculations via NASA/JPL data APIs). The "foolish daughter" (the interpretive layer) is now a hyper-efficient, globalized charlatan, generating vast profits by repackaging the very superstitions Kepler rejected, using the mother's hard-won knowledge. He'd likely see this not as reform, but as the ultimate perversion – astronomy enabling industrialized superstition.

  **Where the Comparison Breaks Down:**

  *   **Kepler's Context vs. App Profit Motive:** Kepler practiced judicial astrology within a courtly patronage system where predictions (especially political/meteorological) had real-world consequences he felt responsible for. Apps operate in a consumer entertainment market, generating content for profit with no accountability. Kepler took the *potential* truth of celestial influence seriously (however flawed his methods); apps prioritize engagement and subscription revenue.
  *   **Personal Craft vs. Algorithmic Factory:** Kepler's interpretations, however flawed by his own criteria, were bespoke, involving his own reasoning and harmonic theory applied to a specific chart. Apps are impersonal content factories. He'd likely view the automation itself as a sign of astrology's degradation, removing even the potential for individual astrologer insight (however misguided he thought most were).
  *   **Scale of "Foolishness":** The sheer global reach and cultural penetration of apps, delivering billions of personalized horoscopes, represents a scale and societal impact of "foolishness" Kepler could scarcely have imagined, amplifying his critique exponentially.

  **Kepler's Likely Verdict:**

  He would condemn apps like Co-Star or The Pattern as the *antithesis* of his reform project. While praising their astronomical engine, he would rage against their perpetuation of the "dung" (Zodiac/Houses), the hollowing out of his harmonic aspects into meaningless labels, the complete abandonment of empirical testing, the removal of the soul's resonance, and the transformation of astrology into a highly profitable, algorithmically-driven industry of psychological platitudes. He would see them not as heirs to his work, but as the ultimate triumph of the charlatans he fought against, now supercharged by the astronomy he helped create and the technology of the digital age. His verdict would be: **"Precise astronomy shackled to industrialized superstition, devoid of harmony, soul, or evidence – the foolish daughter has become a monstrous automaton."**
