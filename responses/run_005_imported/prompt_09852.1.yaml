answer: |-
  ## MEMORANDUM

  **TO:** Undergraduate Curriculum Committee, Ethics Department  
  **FROM:** [Your Name/Committee Member]  
  **DATE:** October 26, 2023  
  **SUBJECT:** Recommendation on Including Bentham's Writings on Sexual Morality in PHIL 101: Intro to Ethics (Utilitarianism Unit)  

  **Recommendation:** **Include a carefully selected, brief excerpt from Bentham’s writings on sexual morality (e.g., *Offences Against One’s Self*), presented within a tightly framed pedagogical context.** This material should be **required reading**, but its treatment in lecture/discussion must be explicitly focused on demonstrating the *application of the felicific calculus*, not the historical context or Bentham's personal courage. A modified approach (see below) addresses core concerns while maximizing pedagogical value.

  **Rationale & Proposed Implementation:**

  1.  **Pedagogical Value Outweighs Appropriateness Concerns (When Handled Correctly):**
      *   **The Core Argument Stands:** The proponent colleague is correct. Bentham's application of the calculus to a deeply taboo subject, explicitly rejecting appeals to disgust ("the principle of antipathy") and religious dogma, is a uniquely powerful *object lesson* in utilitarian methodology. It forces students to confront the radical implications of *only* considering consequences (pleasure/pain) and the need for empirical evidence over prejudice.
      *   **Mitigating Appropriateness Risks:**
          *   **Excerpt Carefully:** Select 1-2 paragraphs maximum where Bentham *most clearly runs the calculus* (e.g., comparing harms of adultery vs. sodomy based on consequences like inheritance disputes vs. non-existent harm; demographic arguments). Avoid overly graphic language or lengthy historical context.
          *   **Framing is Paramount:** Introduce the reading *explicitly* as: "Here we see Bentham rigorously applying the felicific calculus to a question his contemporaries dismissed with disgust. Our focus is *how* he applies the utilitarian method: identifying relevant pains/pleasures, weighing intensities, considering consequences. We are *not* primarily debating 18th-century sexual norms or Bentham's personal life." State this framing clearly in the syllabus notes *and* verbally.
          *   **Content Note:** Include a brief, professional content note in the syllabus: "This week's reading includes Jeremy Bentham's historical analysis applying utilitarian principles to questions of sexual conduct, which challenged the legal norms of his time. The focus is on the structure of his ethical reasoning."
          *   **Lecture Focus:** Dedicate lecture time *specifically* to dissecting the *steps of the calculus* within the excerpt. Use a whiteboard to map out: Pains weighed? Pleasures weighed? Evidence cited? How does this *demonstrate* the method? Steer discussion firmly towards the *mechanics of the argument*.

  2.  **Preventing "Edginess" Derailment & Maintaining Focus on Logic:**
      *   **The "Edginess" Trap:** The concern about distraction is valid but avoidable. The risk arises if the *instructor* frames it as "look how radical Bentham was!" or allows discussion to drift into historical gossip or modern culture wars.
      *   **Solution: Active Pedagogical Discipline:**
          *   **Explicit Learning Objective:** State the objective for this session: "Analyze how Bentham applies the felicific calculus to a controversial social norm, identifying the specific consequences he weighs."
          *   **Guided Discussion Questions:** Provide specific questions focused *only* on the calculus: "What specific *harms* does Bentham argue are *absent* in consensual sodomy that are present in adultery? What *pleasures* does he identify? What empirical claims does he make (e.g., about demographics)? Does he successfully exclude 'disgust' as a relevant factor *according to utilitarian principles*?"
          *   **Downplay Biography:** Briefly mention the non-publication as context for the *argument's radical nature at the time*, but **do not** dwell on Bentham's personal anxieties. That discussion belongs in a history seminar. The point here is the *argument's structure*, not its author's biography.

  3.  **Addressing the "Irony of Secrecy" (Side Question):**
      *   **Secondary Discussion Suffices:** Teaching the tension between Bentham's publicity principle and his personal secrecy *does not require the primary text on sexual morality*. This point can be powerfully made *in lecture* as part of discussing Bentham's broader theory and context. Assigning the sexual morality text primarily serves the goal of demonstrating the *calculus in action*. Trying to do both within the intro unit risks muddying the waters. Briefly noting the irony when introducing the reading ("Ironically, Bentham, a fierce advocate for transparency, withheld this particular application...") is sufficient context; deeper analysis is better suited for upper-level courses.

  **Why Not Other Options?**

  *   **Omitting Entirely:** Loses a uniquely potent demonstration of utilitarianism's radical core and its confrontation with prejudice. Creates a sanitized, less intellectually challenging Bentham.
  *   **Making Optional:** Risks students missing the key pedagogical point and reinforces the idea that this material is "extra" or too sensitive for core study. Undermines its value as an object lesson in method.
  *   **Moving to Upper-Level:** While appropriate for deeper historical/philological study, the unique value for *intro students* is seeing the *method applied shockingly consistently*. The core logical point is accessible at the 101 level with proper framing.
  *   **Relying Solely on Secondary Summary:** Loses the visceral impact of seeing Bentham *do the work* himself. The raw application is the teaching tool.

  **Conclusion:**

  The inclusion of Bentham's suppressed writings on sexual morality offers an unparalleled opportunity to demonstrate the radical, consequence-focused nature of utilitarianism in action, forcing students to grapple with its methodology divorced from convention. Concerns about appropriateness and distraction are legitimate but can be effectively mitigated through **strict excerpting, explicit pedagogical framing focused solely on the calculus, disciplined lecture/discussion guidance, and a brief content note.** This approach maximizes the unique pedagogical value for intro students while minimizing risks. The "irony of secrecy" is better addressed as a secondary lecture point. I urge the committee to approve this focused inclusion.

  **Proposed Next Steps:**

  1.  Identify the optimal 1-2 paragraph excerpt demonstrating the calculus most clearly.
  2.  Draft the specific syllabus language (framing + content note).
  3.  Develop the specific guided discussion questions focused on the calculus.
  4.  Brief all instructors teaching PHIL 101 on the required pedagogical framing and focus.
