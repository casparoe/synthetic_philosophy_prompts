answer: |-
  Here’s a toast that honors your friend’s work while weaving Lewis’s framework into a heartfelt message about their marriage—ending with the deeper truth about commitment. It runs about 5 minutes when delivered thoughtfully:  

  ---

  ### The Toast  
  **Raise your glasses.**  

  When two brilliant people like [Partner A] and [Partner B] find each other, we philosophers—well, most of you here—might describe it as a *coordination equilibrium*. David Lewis would say their partnership solves a problem: the problem of how to live a life well. Like all great conventions, it’s beautifully *arbitrary*. Had the winds of chance blown differently, they might’ve coordinated with others. But here they are—a perfect, self-reinforcing solution.  

  **Pause for light laughter**  

  And like all Lewisian conventions, it’s held together by *common knowledge*. They know they chose each other. They know the other knows. And they know we all know it, too. It’s why we’re here tonight, glasses raised.  

  **Lean in slightly, tone shifts thoughtfully**  

  But Lewis’s critics—and my friend’s dissertation—remind us: this framework alone can’t explain why breaking a convention *hurts*. If it were just coordination, forgetting your anniversary would feel like forgetting to signal before a lane change: a mistake, not a betrayal.  

  **Make eye contact with the couple**  

  What Lewis couldn’t capture—and what [Friend’s Name] expanded through Skyrms’ work—is how conventions become *norms*. How they gain moral weight. How “we drive on the right” becomes “we keep our promises.” How coordination evolves into obligation.  

  **Turn fully to the couple**  

  [Partner A] and [Partner B], your marriage isn’t just a brilliant solution to life’s coordination problem. It’s a living rebuttal to the idea that conventions are *merely* practical.  

  **Voice softens, earnest**  

  The reason breaking a vow feels like *wronging* someone? It’s because you’ve built something beyond mutual interest. You’ve created:  
  - **Shared vulnerability** (you’ve seen each other’s 3 a.m. anxieties),  
  - **Sacrifice** (you’ve given up solo paths for a joint one),  
  - **A history only you two own** (inside jokes, silent glances, the way you both know exactly how the other takes their coffee).  

  **Raise glass slightly higher**  

  *That’s* why it would feel like betrayal—not a mistake—if one of you broke the convention. Not because you’d lose coordination, but because you’d break the *trust* that turned this arrangement into a sacred thing.  

  **Directly to the couple**  

  So here’s the truth your own work teaches us: Your marriage is a convention that stopped being arbitrary the moment you invested your hearts in it. What you owe each other isn’t just coordination—it’s loyalty. Not just mutual benefit—but tenderness. Not just common knowledge—but *uncommon* understanding.  

  **Full glass raise, warm and strong**  

  So let’s toast to the equilibrium that became a norm. To the coordination that became commitment. To two people who could’ve solved life’s problem with anyone—but chose each other, and made that choice mean everything.  

  **To [Partner A] and [Partner B]!**  

  ---

  ### Why This Works  
  1. **Lewis Nod + Inside Joke**: Opens with precise Lewis terms ("coordination equilibrium," "arbitrary," "common knowledge")—showing you did the homework.  
  2. **The Pivot**: Uses the "moral objection" to Lewis (which your friend’s work addresses) to transition from theory to emotion.  
  3. **Heart Over Framework**: The Skyrms reference is subtle ("norms become entrenched")—focus stays on *them*, not the model.  
  4. **Personal Truth**: Answers "what they owe each other" with vulnerability/sacrifice/history—things that resonate universally.  
  5. **5-Minute Timing**: Key lines linger; pauses let the room absorb the shift from academic to heartfelt.  

  **Pro Tip**: Practice the pivot ("But Lewis’s critics...") slowly. That’s where philosophers lean in and non-PhDs *get* it. Your friend will recognize her life’s work framing the toast—without it becoming a lecture.
