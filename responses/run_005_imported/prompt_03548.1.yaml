prompt: |-
  I'm working on an independent project on the regress problem in epistemology (the foundationalism/coherentism/infinitism debate) for my school's philosophy club, and I've been trying to trace the problem back to its ancient roots. I got stuck on part of Aristotle's Posterior Analytics, Book I, chapter 3 (Bekker 72b5–73a6, in G. R. G. Mure's translation), where he lays out two rival views about demonstration, states his own alternative, and then goes after the "circular demonstration" camp specifically. Here's the passage (I've cut one short digression about induction, marked with [...], but otherwise left it as is):

  "Some hold that, owing to the necessity of knowing the primary premisses, there is no scientific knowledge. Others think there is, but that all truths are demonstrable. Neither doctrine is either true or a necessary deduction from the premisses. The first school, assuming that there is no way of knowing other than by demonstration, maintain that an infinite regress is involved, on the ground that if behind the prior stands no primary, we could not know the posterior through the prior (wherein they are right, for one cannot traverse an infinite series): if on the other hand—they say—the series terminates and there are primary premisses, yet these are unknowable because incapable of demonstration, which according to them is the only form of knowledge. And since thus one cannot know the primary premisses, knowledge of the conclusions which follow from them is not pure scientific knowledge nor properly knowing at all, but rests on the mere supposition that the premisses are true. The other party agree with them as regards knowing, holding that it is only possible by demonstration, but they see no difficulty in holding that all truths are demonstrated, on the ground that demonstration may be circular and reciprocal.

  Our own doctrine is that not all knowledge is demonstrative: on the contrary, knowledge of the immediate premisses is independent of demonstration. (The necessity of this is obvious; for since we must know the prior premisses from which the demonstration is drawn, and since the regress must end in immediate truths, those truths must be indemonstrable.) Such, then, is our doctrine, and in addition we maintain that besides scientific knowledge there is its originative source which enables us to recognize the definitions.

  Now demonstration must be based on premisses prior to and better known than the conclusion; and the same things cannot simultaneously be both prior and posterior to one another: so circular demonstration is clearly not possible in the unqualified sense of 'demonstration.' [...] The advocates of circular demonstration are not only faced with the difficulty we have just stated: in addition their theory reduces to the mere statement that if a thing exists, then it does exist—an easy way of proving anything. That this is so can be clearly shown by taking three terms, for to constitute the circle it makes no difference whether many terms or few or even only two are taken. Thus by direct proof, if A is, B must be; if B is, C must be; therefore if A is, C must be. Since then—by the circular proof—if A is, B must be, and if B is, A must be, A may be substituted for C above. Then 'if B is, A must be' = 'if B is, C must be,' which above gave the conclusion 'if A is, C must be': but C and A have been identified. Consequently the upholders of circular demonstration are in the position of saying that if A is, A must be—a simple way of proving anything."

  Two things about this are giving me trouble, and I'd appreciate a walk-through of both:

  1. I can't reconstruct the substitution step. I follow the chain "if A is, B must be; if B is, C must be," and I follow the added premise "if B is, A must be" that circularity requires, but I don't see why that licenses putting A in for C, or why the resulting identity of C and A is supposed to be an absurdity rather than just a relabeling.

  2. Aristotle's own fix for the regress is that the "immediate premisses" are simply known, not demonstrated. That sounds a lot like what later skeptics would call the "hypothesis" horn of the trilemma — just declaring a stopping point and calling it basic. What, if anything, makes his indemonstrable first principles different in kind from an arbitrary hypothesis, rather than just a more flattering name for one?
