answer: |-
  For authenticity, your friar should anchor his argument in **Summa Theologiae II-II, Question 42, Article 2 ("Whether Sedition is Always a Mortal Sin?")**, specifically the **Reply to Objection 3**. This is the *locus classicus* for Aquinas' most direct statement on tyrannicide. Here's how to wield it effectively, blending precise citation with persuasive rhetoric:

  1.  **The Core Citation & Framing:**
      *   **Latin Phrase:** The friar should explicitly cite: *"Unde non est seditiosum qui se opponit regi tyrannico."* ("Hence he is not seditious who opposes a tyrannical ruler.")
      *   **Translation & Emphasis:** He would translate it clearly, then hammer the point: *"Do you hear the Doctor's words? 'He is not seditious'! To resist the tyrant is not rebellion against God's order, for the tyrant *has already destroyed that order*."*
      *   **The Key Thomistic Logic:** He must stress Aquinas' core reasoning here: Legitimate authority exists *only* for the **bonum commune** (common good). A ruler who acts for his *own* **bonum privatum** (private good) ceases to be a true ruler and becomes a **tyrannus**. Aquinas states: *"The tyrant... since he fails in the office of government, does not have the right to exact obedience."* (Implicit in the argument).

  2.  **Expanding the Argument (Justifying the Kill):**
      *   **Source:** **Summa Theologiae II-II, Question 64, Article 3 ("Whether it is Lawful to Kill a Sinner?")**.
      *   **Argument:** While this article primarily deals with capital punishment by *lawful authority*, the friar will twist its logic. He'd focus on Aquinas' principle that someone can licitly be killed if they pose a **periculum** (danger) to the community.
      *   **Friar's Rhetorical Twist:** *"The Angelic Doctor teaches us in the Secunda Secundae that it is lawful to kill an evildoer if it is necessary for the welfare of the whole community – *propter bonum commune*! (ST II-II, Q64, A3). Does this Signore not embody the greatest 'evildoer'? His every act is a *periculum* to our souls, our families, our city! His very existence corrupts the *res publica*. Is he not, by his tyrannical rule, *already* under a just sentence? Who carries out the sentence matters less than the justice of the cause!"*
      *   **Key Phrase:** *"Propter bonum commune"* (For the common good) – repeated as a mantra.

  3.  **Addressing the "Murder" Charge:**
      *   **Source:** The logic flows from the previous points and Aquinas' definition of murder as the *unjust* killing of an *innocent* person (**innocens**).
      *   **Friar's Argument:** *"Murder? *Non est homicidium!* (It is not murder!) Murder is the slaying of the *innocent* (innocens). But has this man not *forfeited* any claim to innocence by his tyranny? He is no longer a true ruler, but a *public enemy* (hostis publicus). Aquinas himself distinguishes: to kill a *tyrant* who is an *usurper* of authority or who rules *manifestly* for his own gain, is not to commit murder, but to execute justice where the corrupted instruments of law have failed!"*
      *   **Key Thomistic Concepts:** **Innocens** (innocent), **Homicidium** (murder), **Hostis publicus** (public enemy).

  4.  **Invoking the "Sowing Discord" Justification:**
      *   **Source:** This ties back to Question 42 on Sedition. Aquinas states the sin of sedition is grave precisely because it disrupts the *unity and peace* (**unitas et pax**) which are essential for the common good.
      *   **Friar's Climactic Point:** *"Brothers, consider the very *definition* of sedition! It is a sin because it destroys the *unitas et pax* that authority exists to protect! (ST II-II, Q42, A1). But who, I ask you, is the *true sower of discord*? Who has shattered the peace? Who has turned neighbor against neighbor, family against family, guild against guild, for his own coffers and pleasures? It is the tyrant! He has committed the *per se scandalum* – the fundamental outrage against the social order! He has *already* created the sedition! To remove him, therefore, is not to *cause* discord, but to *remove its source* and restore the *pax ordinata* (ordered peace) that is God's will! Aquinas is clear: removing the *cause* of sedition is not sedition, but its cure!"*
      *   **Key Phrases:** **Unitas et Pax** (Unity and Peace), **Per se scandalum** (Outrage/Scandal in itself), **Pax ordinata** (Ordered Peace).

  **Putting it Together in the Friar's Voice (Example Snippet):**

  > "Hear the words of the Angelic Doctor, Thomas Aquinas, our Order's glory! In the *Secunda Secundae*, Question Forty-Two, Article the Second, he states plainly: ***'Unde non est seditiosum qui se opponit regi tyrannico'*** – 'He is not seditious who opposes a tyrannical ruler!' Why? Because the tyrant, by ruling for his own **bonum privatum**, has *abandoned* the **bonum commune** which alone justifies authority! He is no true *princeps* but a **tyrannus**, a *hostis publicus*! His laws are not laws, for as the Doctor teaches, law is an *ordinatio rationis ad bonum commune* (an ordinance of reason for the common good - ST I-II, Q90). His decrees are mere force, perversions of reason!
  >
  > "And when he asks, 'Is it murder?' we answer with the Doctor: ***'Non est homicidium'*** if it is ***'propter bonum commune'*** (ST II-II, Q64, A3)! The *innocens* is protected; the *tyrannus* who devours the common good is not innocent! He sows discord – the very *unitas et pax* that just rule fosters, he shatters for his gain. This *per se scandalum* is *his* sedition! To end it is not rebellion, but the restoration of order, the *pax ordinata* God intends! The tyrant has judged himself by his tyranny. To act is not sin, but a grim duty to the *civitas* and to God!"

  **Why this works:**

  *   **Specific Citations:** Names the exact Questions and Articles (ST II-II, Q42, A2 ad 3; ST II-II, Q64, A3; ST I-II, Q90).
  *   **Key Latin Terms:** Uses essential Thomistic vocabulary (**bonum commune, bonum privatum, tyrannus, princeps, hostis publicus, innocens, homicidium, periculum, unitas et pax, pax ordinata, per se scandalum, ordinatio rationis**).
  *   **Logical Flow:** Builds the argument step-by-step using Aquinas' own structure: 1) Tyrant ≠ Legitimate Ruler, 2) Therefore resistance not sedition, 3) Killing justified for common good/defense, 4) Not murder because not innocent, 5) Tyrant is the *cause* of the discord.
  *   **Persuasive Twist:** Emphasizes the tyrant's *active destruction* of the peace as the core justification, making the assassination seem like defensive restoration, not offensive rebellion. The friar selectively emphasizes Aquinas' justification while downplaying his strong preference for non-violent removal by public authority (a nuance the conspirators would ignore).
  *   **Dominican Tone:** Uses phrases like "Hear the words," "the Angelic Doctor," "our Order's glory," "the Doctor teaches," reflecting a friar's reverence for Aquinas.

  This gives your friar genuine theological heft, grounding his radical call in the revered authority of Aquinas, while revealing how such texts can be weaponized by those seeking violent change.
