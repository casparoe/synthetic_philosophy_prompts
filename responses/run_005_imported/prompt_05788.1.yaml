  Okay, let's tackle this user's problem. They had an argument with their friend Leah about Wittgenstein's "On Certainty," specifically sections 96-99. The user believes hinge propositions are bedrock, unchanging, while Leah thinks nothing is permanently off-limits to doubt, just temporarily fixed. 

  First, I need to unpack the river metaphor. The riverbed has hard rock and sand. Hard rock represents propositions that are practically immovable, like logical rules or fundamental beliefs (e.g., "the world exists"). Sand is more flexible, empirical beliefs that can change. The key is distinguishing between the movement of water (fluid propositions) and the shifting riverbed (hinges). But Wittgenstein notes the boundary isn't sharp—some parts erode slowly.

  The user’s friend Leah focuses on the fluidity: hinges can become empirical over time. The user emphasizes the hard rock as fundamentally different. Both have points. The passage supports that some hinges are more stable, but the possibility of change exists, even if rare.

  Looking at the literature, hinge epistemologists like Moyal-Sharrock and Pritchard acknowledge both aspects. Hinges are framework conditions, not empirical, but historical examples (like Euclidean geometry) show they can shift. The "logic as empirical" comment reinforces that logic isn't empirical, but its role can change contextually.

  So, who's closer? The user's reading aligns more with mainstream interpretations. Hinges differ in kind by function, not just entrenchment. But Leah isn't wrong; the potential for change is there. The passage balances both: a normative distinction with historical fluidity.
answer: |-
  Here's a breakdown of the passage (OC 96-99), the core disagreement, and how it fits into hinge epistemology scholarship:

  **Unpacking the Passage & Metaphor:**

  1.  **The Core Image: River-Bed vs. Water:**
      *   **River-Bed (Bank):** Represents the framework of *certainties* or *hinge propositions*. These are the underlying assumptions that make specific empirical investigations and language games possible. They are the "bedrock" against which doubt and verification operate.
      *   **Water:** Represents *ordinary empirical propositions* – the specific claims we investigate, verify, falsify, doubt, and revise based on evidence and experience. Their movement *depends* on the stability of the bed.

  2.  **The Hard Rock vs. Sand Distinction:**
      *   **Hard Rock:** Represents hinge propositions that are exceptionally stable, "subject to no alteration or only to an imperceptible one." These are propositions so fundamental to our worldview, language, and practices that doubting them seems nonsensical or paralyzing (e.g., "The world exists," "I have two hands," "Objects persist when unobserved," basic logical principles). They are *not* up for empirical test *within* the language games they ground.
      *   **Sand:** Represents hinge propositions that are *more* susceptible to change over time, "washed away or deposited." These might be historically contingent assumptions that *function* as hinges for a particular era or culture but *could* eventually shift through profound conceptual revolutions (e.g., geocentrism vs. heliocentrism, Euclidean vs. non-Euclidean geometry assumptions, perhaps some deeply held moral or social axioms). The shift happens slowly and at the level of the framework, not through piecemeal empirical testing.
      *   **Fuzzy Boundary:** Wittgenstein explicitly states the boundary isn't sharp. There's a gradient from very hard rock to looser sand. *Some* propositions might be harder to classify.

  3.  **The Dynamics (Harden/Fluid/Shift):**
      *   **Fluid -> Hardened:** Some empirical propositions can become so entrenched, so foundational to our practices, that they "harden" into the river-bed, functioning as new hinges (e.g., "The Earth is round" might have shifted from empirical discovery to a fundamental hinge for modern navigation and cosmology).
      *   **Hardened -> Fluid:** Conversely, some propositions that *were* hinges (functioning as bedrock) can, through radical conceptual shifts, become fluid again – open to question or revision, potentially becoming objects of empirical inquiry themselves within a *new* framework (e.g., "Space is Euclidean" shifted from hinge to empirical proposition within physics).
      *   **Shift of the Bed:** This is the key point. When sand erodes or rock *very slowly* wears away, or new sediment (hardened fluid propositions) builds up, the *entire framework* supporting empirical inquiry changes. This isn't the normal testing of water (empirical propositions); it's a seismic shift in the background conditions of thought and doubt.

  4.  **The Crucial Rejection: "Logic too is an empirical science"**
      *   Wittgenstein **emphatically rejects** this conclusion. This is vital.
      *   **Why?** While *specific propositions* can change roles (fluid<->hinge), and while the *content* of the river-bed can shift over long periods, the *fundamental distinction in function* remains. Logic, and the most fundamental hinges (the "hard rock"), function *as the rules of the game*, not as moves *within* the game. They define what counts as evidence, reason, doubt, and testing *for* empirical science. To say logic is empirical science obliterates this distinction and misunderstands the normative role of hinges.

  **Addressing Your Disagreement:**

  *   **Leah's Read (Contingency/Entrenchment):** She correctly identifies the *possibility* of change over time ("mythology may change back into flux," "sand gets washed away"). She rightly notes that the boundary is fuzzy and that propositions *can* change their status. Her emphasis on "not permanently off-limits" captures the *potential* for even deep hinges to shift *given enough conceptual upheaval over vast timescales*.
  *   **Your Read (Kinds of Certainty/Hard Rock):** You correctly identify that Wittgenstein *is* making a distinction *in kind* based on *function*, not just degree of entrenchment. The "hard rock" metaphor signifies propositions whose doubt is genuinely *inconceivable* or *paralyzing* within a given framework, not merely inconvenient. The explicit rejection of "logic is empirical" strongly supports your point: hinges play a fundamentally different *logical role* than empirical propositions. Their certainty is not the result of evidence but the precondition for gathering evidence.

  **Synthesis: Why Both Have Merit, But Your Read is Closer to the Passage and Scholarship:**

  1.  **Functional Distinction is Primary:** Wittgenstein's core point is the *functional* difference. Hinge propositions *enable* empirical inquiry; they are its framework. Ordinary empirical propositions *are tested within* that framework. This is a difference in *logical kind* (like rules vs. moves). The river-bed/water distinction is primarily about this functional role.
  2.  **Temporal Stability is Secondary (but Real):** The hard rock/sand distinction *within* the river-bed addresses *degrees* of stability *within* the category of hinges. It acknowledges that *some* hinges are so fundamental they seem practically immutable ("hard rock"), while others ("sand") are more historically contingent and *could* shift, altering the framework. However, *even the "sand" is functioning as bedrock/hinge at the time it holds that role*. Its doubt is not a live empirical option *within* the current framework.
  3.  **"Contingently Undoubted" vs. "Framework Condition":** Leah's phrase "contingently undoubted" risks reducing hinges to *just* very firmly held empirical beliefs. The passage shows they are more: they are the *conditions for* holding *any* belief empirically. Their "certainty" is grammatical, not evidential. While the *specific content* of hinges can be contingent (sand), their *role* as framework is not contingent in the same way ordinary beliefs are.
  4.  **The Logic Point is Decisive:** Wittgenstein's rejection of "logic is empirical" explicitly defends a distinction in kind. Logic's role *as rule* cannot be reduced to being a particularly well-confirmed empirical hypothesis. This applies to the fundamental hinges ("hard rock") – their certainty is of a different order.

  **Scholarly Consensus (Hinge Epistemology Literature):**

  *   **Dominant View (Moyal-Sharrock, Pritchard, etc.):** Hinges are fundamentally different *in kind* from ordinary empirical beliefs. They are *non-propositional* (or quasi-propositional) framework conditions, "animal" certainties, or rules of grammar. Their certainty is *enabling* and *non-epistemic* (not based on justification). **Your reading aligns much more closely with this mainstream interpretation.** The river-bed metaphor, especially the hard rock and the rejection of logic being empirical, is consistently cited to support the *functional distinction* and the existence of genuinely immutable (or near-immutable) hinges.
  *   **Leah's View (More Historicist/Contextualist - Influenced by Williams, perhaps Rorty):** Some scholars emphasize the potential for change and the historical contingency highlighted by the sand metaphor. They argue that *all* certainty is context-bound, and even the hardest rock *could* erode given radical enough change. However, even these scholars usually acknowledge Wittgenstein's primary point is the *functional* distinction *at a given time*. They wouldn't reduce hinges to *just* "contingently undoubted empirical beliefs"; they'd emphasize that what *counts* as a hinge is contingent, but *when* it functions as a hinge, it plays this distinct role.

  **Conclusion:**

  *   **Your reading is closer** to Wittgenstein's primary intention in this passage and to the dominant hinge epistemology literature. The passage establishes a fundamental *functional/logical* distinction between hinges (river-bed) and empirical propositions (water). The hard rock/sand distinction shows *degrees* of stability *within* the category of hinges, not that hinges are indistinguishable from empirical beliefs. The rejection of "logic is empirical" is a clear defense of a distinction in kind.
  *   **Leah's reading captures an important secondary point** – the *potential* for historical change in the *content* of the river-bed, especially concerning the "sandy" parts. However, she overstates this into collapsing the functional distinction. Hinges, *while they hold*, are not "contingently undoubted" in the same way a well-confirmed scientific theory is; they are the *preconditions* for doubt and confirmation.

  In essence: Wittgenstein *is* saying some things genuinely don't shift *like* ordinary beliefs (they are the bed, not the water), *and* he's saying that even within the bed, some parts are incredibly hard *and* that the bed's composition can change over vast timescales. The functional distinction (kind) is primary; the temporal stability (degree) is a feature within that kind. Your focus on the functional kind is more central to the passage's argument.
