prompt: |-
  I host a small philosophy podcast and next week's guest is a metaethicist who's a card-carrying quasi-realist -- her line is that expressivism handles the Frege-Geach problem just fine once you let moral sentences express attitudes toward attitudes (so the conditional premise ends up expressing something like disapproval of combining "disapproves of stealing" with "doesn't disapprove of getting your little brother to do it"). Can you draft me 8-10 questions that don't just let her restate that move? I want at least one question pushing on the negation problem -- why "stealing isn't wrong" shouldn't come out as mere non-disapproval (tolerance, indifference) rather then something that actually contradicts the original claim; one on whether stacking higher-order attitudes to handle nested constructions (conditionals inside conditionals, disjunctions of negations, etc.) is a principled logic or just an ad hoc regress; one that makes her say what actually makes moral modus ponens valid on her view, as opposed to it just being an inference pattern we're psychologically stuck accepting; and one asking her to weigh her attitudes-to-attitudes story against Gibbard's hyperplan semantics -- doesnt that just smuggle cognitivism back in through the truth-conditions door? For each, throw in a quick follow-up keyed to whatever dodge she's most likely to reach for.
reasoning: |-
  Okay, the user hosts a small philosophy podcast and needs interview questions for a metaethicist guest who's a quasi-realist. The guest believes expressivism handles the Frege-Geach problem by having moral sentences express attitudes toward attitudes. The user wants questions that go beyond restating her position, specifically targeting the negation problem, higher-order attitudes, validity of modus ponens, and a comparison to Gibbard's hyperplan semantics. They also want follow-ups for each main question to prevent dodging.

  First, I need to understand the core issues here. The negation problem is about how expressivists distinguish between not disapproving of stealing (indifference) and disapproving of not stealing (active tolerance). The higher-order attitudes concern whether stacking attitudes for complex sentences is principled or ad hoc. For modus ponens, the challenge is explaining logical validity without truth conditions. Comparing to Gibbard involves whether hyperplans reintroduce cognitivism.

  For the negation problem, the key is to push why "stealing isn't wrong" shouldn't be mere non-disapproval. The guest might respond that it expresses a higher-order attitude. The follow-up should challenge if this reduces to a disquotational principle, which might be circular. 

  On higher-order attitudes, the question should address infinite regress in nested conditionals. The guest might invoke systematic expressivist logic. The follow-up needs to question if this logic is pre-existing or constructed to fit, risking ad hoc-ness.

  For modus ponens validity, the guest may appeal to constitutive norms of attitude expression. The follow-up should ask if this makes validity subjective or mind-dependent, conflicting with objective logical necessity.

  Regarding Gibbard, the question is if hyperplans smuggle in truth conditions. The guest might distinguish between planning and believing. The follow-up should press if plans functionally mirror truth-apt beliefs, blurring the expressivist-cognitivist line.

  The user's deeper needs include rigorous, engaging content that challenges the guest without being confrontational. They want the podcast to delve into nuanced critiques, showing the audience the strengths and weaknesses of quasi-realism. Ensuring questions are precise yet accessible is key, avoiding overly technical jargon while maintaining philosophical depth. Balancing follow-ups to anticipate responses keeps the conversation dynamic and insightful.
answer: |-
  Here are 8 targeted questions designed to push beyond restatement, incorporating your specific requests with anticipated dodges and sharp follow-ups:

  1.  **The Negation Problem - Core Challenge:** "You argue that 'Stealing isn't wrong' expresses a higher-order attitude – perhaps *disapproval of disapproving of stealing*. But intuitively, someone who is merely *indifferent* to stealing (non-disapproval) also doesn't assert 'Stealing is wrong'. Why isn't their non-disapproval sufficient to make 'Stealing isn't wrong' *true* for them? How does expressing *disapproval of disapproval* capture the necessary *opposition* to the original claim that mere indifference lacks?"
      *   *Likely Dodge:* Appeal to the role in reasoning/communication – indifference doesn't license the same inferences as the negation claim.
      *   *Follow-Up:* "But doesn't that just relocate the problem? If the *functional role* defines the attitude expressed, how does your specific higher-order attitude account *explain* why indifference lacks that functional role, rather than just stipulating that only the higher-order attitude has it? Isn't there a risk of circularity here?"

  2.  **The Negation Problem - Contradiction:** "On your view, what is the *logical relation* between 'Stealing is wrong' (expressing disapproval of stealing) and 'Stealing isn't wrong' (expressing disapproval of disapproving of stealing)? They express distinct attitudes. What makes them genuine *contradictories*, such that accepting both would be a fundamental failure of rationality, rather than just holding two possibly conflicting attitudes?"
      *   *Likely Dodge:* Claim the attitudes are constitutively incompatible due to the nature of planning/prescription.
      *   *Follow-Up:* "But couldn't someone coherently (if perversely) *both* disapprove of stealing *and* disapprove of disapproving of stealing? What *internal* feature of these two distinct attitudes *guarantees* their mutual exclusivity in the way genuine logical contradictories require?"

  3.  **Higher-Order Stacking - Principled Logic or Regress?:** "For a complex sentence like 'If either stealing isn't wrong or lying is wrong, then betraying friends is wrong,' your view requires expressing attitudes towards attitudes towards attitudes... potentially infinitely. Is there a principled, *finitely stateable* rule within expressivism for generating the correct higher-order attitude for *any* arbitrarily complex moral sentence? Or does this regress suggest the framework is fundamentally *ad hoc*, building just enough structure to handle each new linguistic challenge as it arises?"
      *   *Likely Dodge:* Propose a systematic compositional expressivist logic (e.g., inspired by Gibbard or Blackburn) generating complex attitudes from simple components.
      *   *Follow-Up:* "But isn't the *justification* for that specific compositional rule ultimately parasitic on preserving the *inferential roles* we intuitively accept for moral logic? Does this mean expressivism is *describing* our existing logical practices rather than providing a truly independent, *explanatory* foundation for *why* modus ponens or disjunction elimination work for moral language?"

  4.  **Higher-Order Stacking - Psychological Plausibility:** "Does your account of complex moral judgments (e.g., conditionals inside disjunctions) realistically reflect the cognitive states of ordinary speakers? When someone sincerely asserts a highly nested moral conditional, are they really harboring the intricate, multi-layered attitude your theory ascribes to them? Or is this a case of the theoretical machinery becoming psychologically implausible?"
      *   *Likely Dodge:* Distinguish competence/performance – speakers grasp the *commitments* even if not consciously representing the complex attitude.
      *   *Follow-Up:* "If the complex attitude is merely implicit in the commitment, what independent criterion distinguishes *correctly* grasping the commitment (and thus expressing the 'right' complex attitude) from misunderstanding it? Doesn't this risk making the attitude expressed dependent on a prior understanding of moral logic, again raising circularity concerns?"

  5.  **Validity of Modus Ponens - Beyond Psychology:** "On your view, what *makes* moral modus ponens (If P, then Q; P; Therefore Q) a *valid* inference pattern? Is its validity grounded solely in constitutive features of the attitudes expressed (e.g., the nature of planning states), or is it just a psychological fact about how we're disposed to combine attitudes? If the former, how do these 'constitutive features' differ from rules governing truth-preservation? If the latter, doesn't that make validity contingent and potentially variable?"
      *   *Likely Dodge:* Validity is defined by *inconsistency*: Accepting the premises while rejecting the conclusion involves holding incompatible attitudes constitutively.
      *   *Follow-Up:* "What *grounds* this constitutive incompatibility? If it's not truth-preservation, is it simply a brute, irreducible feature of the planning attitudes? Doesn't this leave the *necessity* and *universality* of logical validity mysterious? Why *must* these attitudes conflict in this way, beyond our contingent psychological setup?"

  6.  **Validity vs. Persuasion:** "Couldn't an expressivist account conflate the *persuasiveness* of an inference with its *validity*? If someone finds modus ponens compelling because of the psychological pressure generated by their attitudes, how do you distinguish cases where that pressure tracks genuine logical consequence from cases where it's just effective rhetoric or psychological bias?"
      *   *Likely Dodge:* Emphasize the public, shared nature of language and inferential norms.
      *   *Follow-Up:* "But doesn't this appeal to shared norms just push the question back? What, on the expressivist meta-level, *constitutes* the norm that modus ponens is valid? Is it just a contingent social agreement about which attitude-combinations are permissible, or is there something more objective binding it?"

  7.  **Gibbard's Hyperplans - Cognitivism in Disguise?:** "Gibbard's move to 'hyperplans' (complete contingency plans) seems to assign moral sentences truth-conditions relative to a hyperplan. Doesn't this fundamentally abandon core expressivism by reintroducing a *cognitive* element – a sentence is 'true' *iff* it accords with the relevant hyperplan? Isn't this just a form of sophisticated subjectivism or relativist cognitivism, where the 'truth-maker' is an agent's comprehensive plan?"
      *   *Likely Dodge:* Distinguish *plan-laden content* from *belief*. Expressing a plan isn't stating a fact *about* the plan; it's *having* the plan govern your normative perspective. Hyperplans define *what it is* to think a thought, not what it represents.
      *   *Follow-Up:* "But when we say 'Lying is wrong *is true* relative to hyperplan H,' isn't this 'true' doing genuine semantic work, capturing correctness conditions? And if the quasi-realist then *endorses* using 'true' this way for moral sentences (as they must to solve Frege-Geach), haven't they functionally *recovered* cognitivism, even if they insist the underlying state is non-cognitive? Isn't the hyperplan semantics doing all the heavy lifting traditionally assigned to truth-conditional semantics?"

  8.  **Attitudes vs. Hyperplans - Comparative Cost:** "Weighing your 'attitudes towards attitudes' approach against Gibbard's hyperplans: Doesn't the hyperplan framework offer a more elegant, unified, and *compositional* semantics for complex moral sentences by providing a single, rich object (the hyperplan) to serve as the semantic value, avoiding infinite attitude stacking? If so, what advantage does your more complex higher-order attitude account offer that outweighs this elegance, besides perhaps a more direct link to simple disapproval?"
      *   *Likely Dodge:* Argue hyperplans are overly abstract/idealized and obscure the core expressivist idea that moral judgment is *planning* or *prescribing*.
      *   *Follow-Up:* "But doesn't the 'attitudes towards attitudes' approach face its own idealization problem with infinitely complex attitudes? And if the core function is planning/prescribing, doesn't the hyperplan *better* capture the systematic, interconnected nature of our actual normative commitments? Isn't the higher-order attitude story ultimately just a more cumbersome way to model what hyperplans capture directly?"

  **Key Principles Used:**
  *   **Avoiding Restatement:** Questions force application, justification, comparison, and confrontation with problems, not just exposition.
  *   **Targeted Critiques:** Directly addresses Negation, Regress, Validity, and Gibbard as requested.
  *   **Anticipating Dodges:** Follow-ups are designed to block common escape routes (appeals to function, competence/performance, social norms, redefining "true").
  *   **Pushing Foundations:** Questions aim at the *grounding* of key concepts (contradiction, validity, compositionality, truth) within expressivism.
  *   **Comparative Cost:** Forces the guest to defend their specific variant against alternatives (like Gibbard's).

  These questions should provoke a substantive discussion that moves well beyond a simple restatement of quasi-realist expressivism and into its deeper philosophical commitments and challenges. Good luck with the podcast!
