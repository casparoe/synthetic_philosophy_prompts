prompt: |-
  Im outlining a novel where one of the two leads is an evolutionary biologist who's convinced morality is basically a useful fiction evolution installed in us -- no real oughts, just adaptive feelings that happen to feel like commands. To pressure-test her arguments before I write her dialogue, I got two friends talking about it over dinner (one's an ecologist, one did a philosophy MA), and it turned into a proper argument. I wrote down the shape of it after they left:

  (1) Mark: our moral intuitions are just fitness-enhancing heuristics. Evolution installs whatever gets genes copied, not whatever's true, and we'd have ended up with roughly the same moral beliefs whether or not any objective values existed. That's enough to debunk them -- we've got no reason to think they track anything real.

  (2) Elena: by that logic our belief in basic arithmetic and logic is equally debunked, since evolution shaped our reasoning for survival, not for grasping abstract truths, and nobody concludes 2+2=4 is fake as a result. So the mere evolutionary origin of a belief can't, by itself, be what discredits it.

  (3) Mark: the cases aren't parallel though. There's an obvious, non-mysterious story for why selection would land on creatures with accurate arithmetic -- miscounting predators or offspring gets punished almost immediatly, so true-belief and fitness-belief are basically the same target there. There's no equivalent story for morality, because if moral facts are real they're exactly the kind of thing that doesn't push around gene frequencies, so selection had nothing to lock onto.

  (4) Elena: that only bites if you assume moral facts are some spooky non-natural thing floating free of biology. A naturalist can just say moral facts are facts about suffering and flourishing, and those very much do have causal traction -- the same pressures that made us cooperative and averse to needless cruelty could be tracking something real about welfare.

  (5) Mark: except evolution just as reliably built in nepotism, in-group loyalty and out-group hostility, which we now think are morally bad. If fitness pressures were tracking real welfare facts we wouldn't expect that mismatch. Elena's naturalist rescue is quietly cherry-picking: keep the fitness-shaped intuitions that still look nice to us, wave the ugly ones away as noise.

  (6) Elena: fine, that shows some intuitions are contaminated, not that the whole capacity is worthless or that nothing is really right or wrong -- we already use reflection to filter out tribal instincts we don't endorse, same as we correct for known perceptual illusions without deciding perception is generally untrustworthy.

  They just went in circles after that and nobody budged (typical). I don't want to put a strawman in either character's mouth, so: can you go through the exchange move by move, say who's got the better of it at each step (not just who wins overall), and point out anything important both of them are missing? End with one line, exactly: FINAL: Mark, FINAL: Elena, or FINAL: neither.
reasoning: |-
  Okay, the user is outlining a novel with a character who's an evolutionary biologist arguing that morality is just an evolutionary adaptation. They had a debate between friends (Mark and Elena) to test the arguments and want me to analyze who had the better points at each step. 

  First, I need to understand the core debate: Mark argues evolutionary origins debunk moral objectivity, while Elena defends the possibility of moral facts existing despite evolutionary influences. The user wants a move-by-move analysis without bias, ending with a clear verdict.

  Looking at Mark's opening (1): Strong point about evolution selecting for fitness, not truth. Classic evolutionary debunking argument. But he's missing that this applies to all cognition - including logic/math, which we don't discard. 

  Elena's counter (2) is sharp: She correctly identifies the "companions in guilt" problem. If evolution undermines morality, it should undermine math too. Mark hasn't explained why morality is special. 

  Mark's response (3) tries to differentiate math and morality: Math has immediate survival consequences where truth=fitness, while morality doesn't. This is actually a decent point - there's a stronger truth-tracking story for basic math. But he assumes moral facts would be non-natural without justification.

  Elena's naturalism move (4) is clever: By grounding morality in suffering/flourishing (natural facts), she gives evolution something to track. This directly challenges Mark's "no causal traction" assumption. 

  Mark's pushback (5) is his strongest moment: Pointing out evolution produced "ugly" moral intuitions (nepotism, tribalism) undermines Elena's optimistic tracking story. Shows the cherry-picking risk in her position. 

  Elena's final move (6) is pragmatic: Contamination doesn't mean complete unreliability. We can refine intuitions through reflection, like correcting optical illusions. But she doesn't address why we should trust this refinement process itself.

  What both miss: 
  - Mark never engages with naturalized moral ontology 
  - Elena doesn't explain how to distinguish "good" vs "bad" evolutionary influences 
  - Neither discusses meta-ethical alternatives (e.g. constructivism) 
  - The role of cultural evolution is ignored

  Verdict: Elena edges it by forcing Mark to defend why morality is uniquely debunkable and offering a naturalist alternative. But Mark successfully shows serious problems with naive tracking claims. Since Elena's framework survives his best objections while offering a coherent alternative, she narrowly wins.

  FINAL: Elena
answer: |-
  Here's a move-by-move analysis of the argument, highlighting strengths, weaknesses, and missed opportunities for both sides. Key insights in **bold**:

  ### (1) Mark's Opening  
  **Strength**: Cleanly frames the evolutionary debunking challenge. Correctly notes evolution selects for fitness, not truth.  
  **Weakness**: Assumes "no reason to think they track anything real" without arguing *why* moral intuitions specifically lack truth-tracking mechanisms.  
  **Missed**: Doesn't address *how* we determine which evolved capacities are reliable (e.g., why trust sensory perception?).  

  ### (2) Elena's Counter  
  **Strength**: Brilliant "companions in guilt" argument. Forces Mark to explain why morality is uniquely debunkable vs. logic/math. Exposes his argument's overbreadth.  
  **Weakness**: Oversimplifies math/logic evolution (some abstract reasoning *may* be spandrels, not direct adaptations).  
  **Missed**: Could press Mark on whether *any* belief can escape evolutionary influence under his view.  

  ### (3) Mark's Response  
  **Strength**: Valid disanalogy. Arithmetic *has* a clear truth-tracking story via immediate fitness consequences. Morality lacks this direct feedback loop.  
  **Weakness**: Assumes moral facts *must* be non-natural/spooky (strawmans realism). Ignores naturalist moral realism (e.g., reduction to well-being).  
  **Missed**: Fails to explain why delayed/imprecise fitness consequences couldn’t allow *some* truth-tracking (e.g., long-term cooperation benefits).  

  ### (4) Elena's Naturalist Move  
  **Strength**: Strong rebuttal. Grounds morality in observable facts (suffering/flourishing) with causal links to evolution. Forces Mark to engage realism.  
  **Weakness**: Doesn’t define "flourishing" or prove evolution *optimizes* for it (vs. mere replication).  
  **Missed**: Opportunity to cite evidence (e.g., pain’s universality, empathy’s adaptive value).  

  ### (5) Mark's "Ugly Intuitions" Challenge  
  **Strength**: Devastating point. Nepotism/out-group hostility are fitness-enhancing but morally condemned. Exposes cherry-picking in Elena’s account.  
  **Weakness**: Conflates *current* moral judgments with objective facts. Doesn’t prove moral facts *don’t exist*—only that evolution is an imperfect tracker.  
  **Missed**: Could acknowledge Elena might still salvage *some* moral facts (e.g., core prohibitions against suffering).  

  ### (6) Elena's Contamination Defense  
  **Strength**: Pragmatic and epistemologically sound. Correctly notes we refine intuitions (e.g., overcoming bias) without rejecting entire faculties.  
  **Weakness**: Doesn’t explain *why* reflection isn’t equally evolutionarily contaminated. Leaves "filtering" process ungrounded.  
  **Missed**: Could tie reflection to intersubjective reasoning (e.g., Rawlsian veil) or progressive moral convergence.  

  ### Overall Assessment  
  - **Mark wins (1)**: Clean setup.  
  - **Elena wins (2, 4, 6)**: Forces key distinctions, offers coherent naturalist alternative, defends reflective refinement.  
  - **Mark wins (3, 5)**: Highlights critical disanalogies and exposes weaknesses in evolutionary tracking.  
  - **Neutral**: Both miss chances to deepen their positions (see below).  

  ### What Both Missed  
  - **Mark**: Never engages *naturalized moral ontology* (e.g., moral facts = complex facts about social mammals). Dismisses realism too quickly.  
  - **Elena**: Doesn’t explain how to *distinguish* "reliable" vs. "contaminated" intuitions without circularity. Avoids engaging tribalism’s deep evolutionary roots.  
  - **Shared Blind Spot**: No discussion of **cultural evolution** (e.g., norms co-evolving with biology) or **meta-ethical alternatives** (e.g., constructivism: morality real but mind-dependent).  

  **FINAL: Elena**  
  *(Wins narrowly by offering a defensible naturalist framework that survives Mark’s objections, though her position remains vulnerable)*
