answer: |-
  ## Memorandum: Educational Policy Committee Recommendation on "Open-Resource" Exam Policy

  **To:** Educational Policy Committee Members  
  **From:** [Your Name], Undergraduate Representative  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on Provost's Proposal for Departmental Opt-in "Open-Resource" Exams  

  ### I. Framing the Core Issue
  The Provost's proposal for "open-resource" exams presents not merely a logistical challenge, but a foundational question about the purpose of university assessment: **What, precisely, are our examinations certifying?** The proposal explicitly argues that certifying *true belief* (regardless of its origin) is sufficient, as it produces equivalent downstream competence. Opposition contends that this reduces education to the mere acquisition of correct outputs, hollowing out the intellectual formation central to a degree. This debate mirrors the epistemological tension we’ve explored in seminar—the distinction between *merely true belief* and *knowledge* (or *understanding*), and whether that distinction holds value in an educational context. Our recommendation must address *this* question head-on.

  ### II. Analysis of the Positions
  1.  **The Case for Adoption (True Belief as Sufficient):**
      *   **Strongest Argument:** In many real-world professional contexts (e.g., engineering diagnosis, legal research, medical information retrieval), competence *is* demonstrated by efficiently locating accurate information using available tools and applying it correctly under constraints. Certifying the ability to *arrive at and utilize correct conclusions* using ubiquitous resources aligns with modern practice. Insisting on internalized recall for its own sake may be anachronistic and misaligned with employer expectations. The "swamping problem" looms large here: if the outcome (correct action/decision) is identical, why should the origin of the belief matter?

  2.  **The Case for Rejection (The Necessity of Knowledge/Understanding):**
      *   **Strongest Argument:** A university degree should signify more than the ability to retrieve correct answers; it should signify *personal intellectual attainment* – the development of critical thinking, analytical ability, and deep conceptual understanding integrated into the student's cognitive architecture. As credit theories of knowledge argue, the *source* of the true belief matters. True beliefs acquired via open-book/AI during an exam are *not* reliably produced by the *student's own cognitive abilities* in the relevant domain. This risks certifying "Meno's Slave Syndrome": students who can parrot correct answers generated externally but lack the understanding to navigate novel problems, evaluate conflicting sources, or sustain their beliefs without constant external support. Kvanvig's emphasis on *understanding* is crucial here – understanding, unlike atomized true beliefs, involves grasping explanatory connections and relationships, which resists being "swamped" by tool use precisely because it *is* the robust structure built through internalized learning.

  ### III. The Committee's Recommendation: **Adopt with Critical Conditions (Conditional Opt-in Framework)**
  We recommend adopting the policy **only** if departments opting in are required to explicitly define the *nature of the competence* their "open-resource" exams are designed to certify and rigorously design assessments accordingly. **The policy must not be a blanket permission for unrestricted lookup; it must be a mandate for pedagogical intentionality.**

  *   **Justification Based on Epistemological Value:** The value of knowledge/understanding over mere true belief is context-dependent within the academy.
      *   **Where True Belief *is* Sufficient (Opt-in Appropriate):** For certifying *specific procedural knowledge, factual recall in service of application, or information synthesis under time pressure using tools*, open-resource exams may be valid. This aligns with certain professional competencies where the efficient integration of external information *is* the core skill (e.g., coding with documentation, legal precedent research).
      *   **Where Knowledge/Understanding is Essential (Opt-in Inappropriate):** For certifying *deep conceptual understanding, critical analysis, original argumentation, or the ability to think independently within the discipline's framework*, unrestricted open-resource exams are epistemologically inadequate. They cannot reliably certify that the *student* possesses the understanding, only that they can locate an acceptable output. Departments focused on cultivating these intellectual virtues should reject the open-resource format for core assessments.

  *   **Why Not Reject Outright?** An outright rejection dismisses valid pedagogical approaches in disciplines where tool-integrated problem-solving *is* the authentic skill. It also ignores the reality that some true beliefs acquired via tools *do* contribute to developing understanding over time, though not within the confines of a single exam.

  *   **Why Not Adopt Unconditionally?** Unconditional adoption risks a "race to the bottom," where the easiest path to correct answers undermines the cultivation of deeper cognitive skills essential to liberal arts and foundational sciences. It fails to address the "swamping problem" for understanding – a correct answer found via ChatGPT provides no evidence of the student's grasp of explanatory coherence or ability to reason within the discipline.

  ### IV. Essential Conditions for Implementation
  Departments opting in **must**:

  1.  **Articulate Learning Objectives:** Clearly state whether the exam certifies *information retrieval & application* or *internalized understanding & independent reasoning*. This must be communicated to students.
  2.  **Redesign Assessments Radically:** Exams must be crafted to **require synthesis, evaluation, application to novel scenarios, or argument construction that cannot be directly copied or generated by current AI without significant, evident student input.** Questions demanding simple factual recall or formulaic answers become meaningless.
  3.  **Define "Own Words" Rigorously:** Establish clear, enforceable standards beyond plagiarism checks. This may involve assessing reasoning traces, requiring justification of sources, or using oral defenses/vivas for high-stakes assessments.
  4.  **Provide Faculty Development:** Offer training on designing valid open-resource assessments that target higher-order thinking despite tool availability.
  5.  **Pilot and Evaluate:** Implement initially as pilots with robust assessment of impact on learning outcomes, student skill development, and grade integrity.

  ### V. Conclusion
  The university *does* have a principled basis for sometimes insisting on the "second route" – internalized knowledge or understanding. That basis lies in the specific intellectual virtues a particular course or program aims to cultivate. The value of knowledge/understanding over mere true belief in this setting is its *embodiment within the learner* – it represents developed cognitive capacity, not just a correct output. The Provost's proposal recognizes a facet of modern competence but risks conflating all forms of competence. Our recommendation embraces flexibility while safeguarding the core mission of developing independent thinkers. **By requiring departments to consciously choose *what* they are certifying and design assessments accordingly, we honor both the practical realities championed by the professional schools and the deep intellectual formation defended by the humanities.**

  **Recommendation:** Adopt the "open-resource" exam policy **only** with the mandatory conditions outlined in Section IV, establishing a framework for deliberate departmental opt-in based on clearly articulated pedagogical goals and radically redesigned assessments.
