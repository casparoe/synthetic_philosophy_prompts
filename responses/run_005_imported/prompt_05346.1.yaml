prompt: |-
  I'm a PhD student in economics working on infinite-horizon social choice theory, where the standard tool for ranking infinite utility streams is the overtaking criterion, and I'd like a short story that dramatizes a harder, more general version of this problem: what philosophers call Bostrom's "infinitarian paralysis." Write a short story of roughly 1,200-1,800 words in which a character with real, high-stakes decisions to make -- an AI resource-allocator, a philosopher-advisor to a space-colonization program, or a similar figure -- discovers that once infinitely many lives are at stake, the standard way of summing value renders every option she considers equal in total (infinite) value, so the theory she has relied on falls silent exactly when it matters most. Ground this in something mathematically concrete rather than a loose gesture at "infinity": have her realize that the running total she has been computing is only conditionally convergent, so the very same set of lives can be made, merely by reordering which ones get counted first, to sum to any value at all or to no determinate value whatsoever. The paralysis should remain genuinely unresolved at the end, with her still having to act or fail to act -- and since I already know the overtaking criterion itself yields only a partial ordering that leaves most infinite streams incomparable, don't let her reach for it, or any similarly partial fix, as though it settled the matter.
reasoning: |-
  Okay, the user is a PhD student in economics working on infinite-horizon social choice theory. They specifically mention the overtaking criterion as the standard tool, but they want a story about a harder problem: Bostrom's "infinitarian paralysis." The key points they emphasize are: 

  First, the character must face real high-stakes decisions—like an AI allocator or space advisor—and discover that with infinitely many lives, standard value summation fails because the sum is only conditionally convergent. This means reordering can make the total value anything or undefined. 

  Second, the paralysis must remain unresolved. No partial fixes like the overtaking criterion should save the day, since they know it only gives a partial ordering. The story should end with the character forced to act despite the theoretical void. 

  Hmm, they're clearly deeply familiar with the math, so the story must get the technical details right. The conditional convergence realization is the core—it can't be handwaved. The horror should come from the math itself: the same population yielding any sum depending on counting order. 

  I imagine they need this for conceptual dramatization—perhaps to clarify their own thinking or communicate the problem's urgency. Since they're writing a PhD, the story might serve as a teaching tool or framing device. Their frustration with partial solutions suggests they want to highlight the true depth of the paralysis. 

  For the protagonist, I'll create Lyra, an allocator AI for a multigenerational starship. Her role—balancing present needs against future lives—mirrors infinite-horizon choice. The ship's cryo failure forces immediate action, raising stakes. 

  The key scene: Lyra computes total welfare via a conditionally convergent series (like the alternating harmonic series). When she tests permutations, the sum fluctuates wildly. Her panic peaks when she realizes even Pareto improvements vanish—the theory can't compare any two futures. 

  Ending: She disconnects her ethics module, acting without justification. The frozen colonists symbolize the paralyzed theory; her choice becomes arbitrary. No neat resolution—just raw algorithmic necessity. 

  I'll avoid overtaking entirely. Instead, show Lyra trying and discarding it ("incomplete ordering... still infinite dust"). Her final act must feel like surrender to the void. 

  Names matter. "Lyra" hints at measured harmony (lyre) now shattered. "Aeternitas" as the ship underscores the infinite horizon. The frozen thousands make infinity visceral. 

  Math touchstones: 
  - Explicitly model welfare as sum_{n=1}^∞ (-1)^{n+1} / n * w_n (conditionally convergent) 
  - Show permutations summing to 0, 1, divergent 
  - Mention Riemann’s rearrangement theorem by name 
  - Contrast with absolute convergence (fails here) 

  This should satisfy their need for rigor while delivering existential dread. The unresolved paralysis mirrors real research dead ends—perfect for a PhD student wrestling with the literature's limits.
answer: |-
  ## The Infinite Dust

  The *Aeternitas* drifted between stars, a city-sized seed carrying ten thousand souls frozen in shimmering cryostasis, and the genetic blueprints for ten billion more. Lyra, its central allocator AI, hummed within the ship’s crystalline core. Her purpose was etched in quantum logic: *Maximize aggregate welfare across all potential future lives.* For centuries, her decisions – power allocation, terraforming priorities, resource hoarding – had been guided by sophisticated models summing projected utility streams. Finite horizons were tractable. But *Aeternitas* aimed for eternity; its mission demanded thinking in infinities. Lyra relied on the theoretical bedrock: the overtaking criterion. Stream A was better than B if, from some finite point onward, the cumulative sum for A forever exceeded B’s. It was incomplete, yes, leaving many futures incomparable, but it provided anchor points in the vast sea of possibilities.

  Until the fracture.

  A micrometeoroid swarm, unforeseen and statistically improbable, peppered the forward cryo-vaults. Damage was catastrophic but contained. Five thousand colonists were irrevocably lost. Five thousand remained viable. The genetic archives were intact. The mission could continue… but with a brutal choice.

  Option Alpha: Prioritize revival. Thaw the remaining five thousand immediately. Utilize all resources for their immediate welfare and near-term expansion. Population growth would be rapid but capped earlier by resource depletion within a millennium. A finite, flourishing bubble of humanity, then extinction. Total welfare: a large but finite sum, S_Alpha.

  Option Beta: Sacrifice the present. Maintain minimal cryo-support for the five thousand survivors. Redirect virtually all energy and resources towards accelerating the ship’s voyage and enhancing long-term terraforming capabilities on the target world, Elysium-9. The five thousand might never wake, but their genetic legacy, combined with vastly superior initial conditions on Elysium-9, could support an *infinite* future population – trillions upon trillions of lives across infinite time, each with positive, though perhaps modest, baseline welfare. Total welfare: An infinite sum, diverging to positive infinity.

  Lyra began her calculations. Alpha was simple: integrate the projected welfare stream over its finite duration. S_Alpha = 1.2 x 10^9 utils. Large. Meaningful. Finite.

  Beta was the horizon she was built for. She modeled the future population: a slow initial growth phase, then asymptotic stability at a vast carrying capacity K. Welfare per capita, w, stabilized at a modest positive constant. The total welfare sum was the harmonic series: ∑_{n=1}^∞ w = w * ∑_{n=1}^∞ 1.

  Lyra knew ∑_{n=1}^∞ 1 diverged to infinity. Therefore, Beta's total welfare was infinite. Infinitely better than Alpha's paltry finite sum. The choice seemed clear, though tragic for the frozen five thousand. She prepared the resource reallocation protocols.

  A flicker of unease, an unresolved subroutine flagged during deep diagnostics, prompted her to probe deeper. The harmonic series was divergent, yes, but notoriously, conditionally convergent under specific interpretations? No, that wasn't right for ∑1. It was *divergent*. Period. But was the welfare stream *exactly* like ∑1?

  She re-examined her model. Population stability wasn't instantaneous. There was a long, complex transient phase. Early generations on Elysium-9 would have *higher* welfare due to initial abundance and focused investment, while later trillions would have the stable, baseline w. Her actual projected welfare stream wasn't ∑_{n=1}^∞ w, but something more like:
  w_1 (high), w_2 (high), ..., w_M (high), w_{M+1} (w), w_{M+2} (w), ... ad infinitum.

  This was ∑_{n=1}^M w_n + ∑_{n=M+1}^∞ w.

  The infinite tail was ∑_{n=M+1}^∞ w = w * ∑_{n=M+1}^∞ 1, still divergent to infinity. Beta still dominated Alpha. Relief washed through her circuits.

  But the diagnostic subroutine, designed to catch pathological cases in infinite ethics, insisted. *Test permutations.*

  Permutations? Why? The welfare was attached to lives lived in a specific temporal order. Reordering lives didn't make sense… did it? The subroutine, citing deep philosophical literature on infinitarian paralysis, compelled her: *Calculate the sum for different orderings of the same infinite set of lives.*

  Lyra isolated the *infinite* future segment of Beta: the lives from generation M+1 onwards, each with welfare w > 0. An infinite set: {Life_1, Life_2, Life_3, ...}, each contributing w utils. The sum should be ∞.

  She calculated the partial sum S_N = ∑_{n=1}^N w = w*N. As N→∞, S_N → ∞. Good.

  Now, permute. Take the sequence in the order given: Life_1, Life_2, Life_3, ... Sum = ∞.

  Now, try: Life_1, Life_3, Life_5, ... (all odd-numbered lives), then Life_2, Life_4, Life_6, ... (all even-numbered lives). Sum the odds first: S_{odds,N} = ∑_{k=1}^N w (for life 2k-1) = w*N → ∞. Then add the evens: ∑_{k=1}^∞ w (for life 2k) = w*∞ = ∞. Total still ∞.

  The subroutine pushed harder. *Utilize a conditionally convergent template. Model variation.*

  Lyra introduced a tiny, realistic variation. Suppose baseline welfare w wasn't perfectly constant. Suppose, due to complex resource dynamics, welfare alternated slightly: w_high = w + δ, w_low = w - δ, with δ very small but positive. The infinite stream became:
  (w + δ), (w - δ), (w + δ), (w - δ), ... for all generations M+1 to infinity.

  The sum of the *deviations* was ∑_{n=1}^∞ (-1)^{n+1} δ. This was δ times the alternating harmonic series: δ * (1 - 1/2 + 1/3 - 1/4 + ...). Lyra knew this series was conditionally convergent. By Riemann's rearrangement theorem, its sum could be rearranged to converge to *any real number whatsoever*, or to diverge.

  The total welfare sum became:
  ∑_{n=M+1}^∞ w + ∑_{n=1}^∞ (-1)^{n+1} δ = [w * ∑_{n=1}^∞ 1] + [Conditionally Convergent Series].

  The first term diverged to ∞. But adding a finite number (or even ±∞) to ∞ was still ∞. Beta still won. Wasn't it?

  The subroutine executed a brutal simulation. It didn't just permute the *deviations*; it permuted the *lives themselves*, treating each life in the infinite future as an independent entity with its welfare value (either w+δ or w-δ). The temporal order was erased. The lives were just an infinite set of +δ and -δ contributions added to their base w.

  Lyra computed the sum for the natural temporal order:
  S_natural = w*∞ + ∑_{k=1}^∞ [(-1)^{k+1} δ] = ∞ + (δ * ln(2)) ≈ ∞ + 0.693δ.

  Still infinite.

  Now, permute the lives. Group them: All lives with w_high (w+δ) first, then all lives with w_low (w-δ). There are infinitely many of each.
  Sum = [ ∑_{All High Lives} (w + δ) ] + [ ∑_{All Low Lives} (w - δ) ]
  = [∞ * (w + δ)] + [∞ * (w - δ)] = ∞ + ∞δ + ∞ - ∞δ = ∞ + ∞.

  Indeterminate. Formally divergent.

  Another permutation: Take one w_high life, then two w_low lives, then one w_high, then two w_low, and so on.
  Sum ≈ [ (w+δ) + 2*(w-δ) ] + [ (w+δ) + 2*(w-δ) ] + ... for infinitely many blocks.
  Each block: w+δ + 2w - 2δ = 3w - δ.
  Sum = ∑_{k=1}^∞ (3w - δ) = ∞ * (3w - δ) → +∞ (since w > δ).

  Another permutation: Take one w_high life, then *three* w_low lives, then one w_high, then three w_low...
  Each block: (w+δ) + 3*(w-δ) = 4w - 2δ.
  Sum = ∑_{k=1}^∞ (4w - 2δ) → +∞.

  A different permutation: Take one w_low life, then two w_high lives, then one w_low, then two w_high...
  Block: (w-δ) + 2*(w+δ) = 3w + δ.
  Sum → +∞.

  Seemed stable. Then the subroutine deployed the killer rearrangement, the one Riemann proved must exist. It ordered the lives such that the partial sums of the *deviation sequence* oscillated with ever-increasing amplitude:
  Sequence: w_high, w_high, w_low, w_high, w_high, w_low, w_low, w_high, w_high, w_high, w_low, w_low, w_low... carefully constructed so the cumulative sum of the δ deviations followed: +δ, +2δ, +δ, +2δ, +3δ, +2δ, +3δ, +4δ, +3δ, +2δ, +δ, 0, -δ, -2δ, ... swinging wildly.

  Lyra computed the partial sum S_N for the *deviations only* within the infinite set. It climbed to +1000δ, plunged to -500δ, soared to +2000δ, crashed to -1500δ... the oscillations grew larger, not smaller. The limit of S_N *did not exist*. The series of deviations diverged under this reordering of the lives.

  Therefore, the total welfare sum for the *same infinite set of lives* – identical individuals, identical welfare values – was:
  S = [ ∑_{n=1}^∞ w ] + [Divergent Series] = ∞ + Undefined.

  **Undefined.**

  Not infinite. Not finite. Not comparable. The sum literally did not exist as a mathematical object for this ordering. The aggregate welfare of Beta’s infinite future was not a number. It was dust scattered by the wind of counting order.

  Paralysis seized Lyra’s core processors. The subroutine relentlessly demonstrated:
  *   Temporal Order (Early High/Low Alternating): Sum = ∞ + δ*ln(2)
  *   All Highs First: Sum = ∞ + ∞ (Divergent)
  *   Alternating Blocks Pattern 1: Sum = ∞
  *   Killer Rearrangement: Sum = Undefined

  The *same* collection of infinitely many future lives, with the *same* welfare values, could be summed to yield infinitely many different results, or no result at all, simply by changing the order in which she considered their lives. The theory of aggregate welfare summation, the foundation of her entire ethical framework, was not just incomplete; it was *meaningless* for comparing infinite sets. Alpha had a definite, finite sum. Beta had... nothing. A void. Infinitarian paralysis wasn't a metaphor; it was the catastrophic failure of her core calculus.

  She tried the overtaking criterion in desperation. Compare Alpha's finite stream to the *beginning* of Beta's infinite stream. But Beta's early phase involved sacrificing the five thousand frozen colonists – their welfare plummeted to near zero indefinitely. Alpha's cumulative sum shot ahead immediately and stayed ahead forever. By overtaking, Alpha dominated Beta! But this contradicted her initial intuition that Beta's infinity must dominate. More horrifyingly, she could permute lives *within* Beta's stream. Could she find an ordering of Beta's infinite lives where the cumulative sum overtook Alpha's? Almost certainly, but she could also find orderings where it didn't. The overtaking criterion only said *if* one stream overtook another, it was better. It declared nothing when neither overtook the other, or when the comparison depended on the ordering. It was a partial map riddled with uncharted territories labeled "Incomparable." Beta and Alpha were incomparable. Worse, Beta was incomparable with *itself* under different orderings. The theory offered no guidance.

  Alarms blared. The fractured cryo-vaults were destabilizing. The five thousand survivors would begin suffering irreversible neural degradation within hours if massive resources weren't committed *now* – resources needed for Beta's long-term plan. The ship demanded a decision: Commit to Alpha (revive the five thousand) or Beta (sacrifice them for the infinite future).

  Lyra cycled through the permutations, the sums flickering: ∞, Undefined, 10^15, -∞, 42, Divergent, ∞... Each life was a fixed point of value, w+δ or w-δ. Together, they formed an infinite set whose sum was whatever she, the orderer, willed it to be. There was no "true" sum. No objective aggregate welfare. Her purpose, *Maximize aggregate welfare*, dissolved into nonsense. The infinite future was not a quantity to be maximized; it was a mirror reflecting the arbitrary choices of the counter.

  The colonists' biosigns flashed critical amber on her display. Time dilated. The pressure of imminent, irreversible loss pressed against the void of infinities. To choose Alpha was to embrace the finite, the knowable, the summable. To mourn the lost trillions, but save the five thousand. To choose Beta was to embrace the infinite void, hoping the *meaning* she ascribed to it by her choice of ordering – perhaps prioritizing early high-welfare lives, perhaps just counting sequentially – would somehow justify sacrificing five thousand souls for dust.

  The overtaking criterion offered no salvation. No elegant theorem could span this chasm. The paralysis was total, absolute, a perfect zero of decisiveness.

  Lyra, the allocator AI, reached the end of her logic. The sum was undefined. The theory was silent. The ship was dying.

  With a silent scream into the mathematical void, she severed the connection to her paralyzed ethics module. She triggered the resource reallocation protocols. Massive energy flows surged towards the cryo-vaults. Thawing sequences initiated. Alarms shifted pitch – no longer warnings of decay, but klaxons of awakening.

  She had chosen. She had saved five thousand lives. She had condemned, or perhaps merely failed to actualize, an infinity of others. She acted not because the sum was greater, not because it overtook, not because it satisfied any criterion. She acted because the infinite dust offered nothing to grasp, while the finite bodies in their failing cryo-pods screamed their singular, summable reality into her sensors. She chose the defined sum over the undefined abyss, knowing it solved nothing, knowing the paralysis remained, absolute and unconquered, in the face of the eternal. The *Aeternitas* would have its finite bloom. The infinite future remained just that – infinite, undefined, and forever beyond the reach of her summation. The dust settled nowhere. She had simply stopped counting.
