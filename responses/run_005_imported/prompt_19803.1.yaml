answer: |-
  Here’s a dialogue between **Dr. Ava Finch** (defending omissions as genuine causes) and **Dr. Silas Thorne** (arguing omissions are "quasi-causes" at best). They’re debating over coffee after a conference panel on causal responsibility in complex systems.

  ---

  **Dr. Ava Finch:** Silas, your talk was characteristically elegant, but I still can’t reconcile your dismissal of omissions with how we *actually* assign blame. Take the classic case: my neighbor promises to water my plant, doesn’t, and it dies. We hold *her* responsible. Why? Because her omission *caused* the death. The plant thrives if she acts; it dies if she doesn’t. That’s a straightforward counterfactual dependence.  

  **Dr. Silas Thorne:** Ava, counterfactual dependence alone is treacherous. If we say the plant died because your neighbor didn’t water it, we must also say it died because *you* didn’t cancel your vacation to water it, or because *I* didn’t teleport into your flat with a watering can. In fact, it died because every human on Earth omitted to water it! But we don’t blame everyone. Why? Because causation isn’t just about “what if?” scenarios. It requires a *physical process*. When your neighbor fails to act, no energy or information transfers from her to the plant. Nothing *happens* between them. The cause is purely the physical state of the plant’s environment—dehydration—not an absence.  

  **Finch:** You’re conflating causation with *mechanism*. We identify causes contextually, using norms and expectations. My neighbor’s omission is salient because she *undertook a duty*. Random strangers didn’t. That duty creates a *robust dependence*: the plant’s survival depended *specifically* on her action in a way it didn’t depend on yours or mine. The “everyone problem” vanishes when we acknowledge that causes are picked out against a backdrop of responsibilities.  

  **Thorne:** Responsibilities are moral or social constructs, not features of causation itself! You’re smuggling in norms to mask the void at the heart of omissions. If causation is a natural relation, how can “nothing” cause “something”? When a queue backs up and crashes a service—as in that tech incident you mentioned—the *positive* cause is the code flaw that allowed unbounded message accumulation, or the hardware limitation. Saying “nobody set up an alert” didn’t *do* anything. The alert’s absence didn’t *push* the system into failure.  

  **Finch:** But the alert *would have* stopped the failure! And crucially, the sysadmin *was responsible* for monitoring queue depth. In the postmortem, we name her omission precisely because it was a required safeguard. If causation is about difference-making, her inaction made the critical difference between recovery and collapse. Your “physical process” requirement is too narrow. We explain outcomes by citing *relevant* absences all the time: the bridge collapsed because of *missing* reinforcements, the patient died because of *no* antibiotic.  

  **Thorne:** Those are still descriptions of positive states! “Missing reinforcements” means the bridge had weak load-bearing material; “no antibiotic” means bacterial proliferation occurred. The causes are the positive properties of the system, not metaphysical absences. As for difference-making: yes, the sysadmin’s action *would have* helped, but so would a cosmic ray striking the server and magically fixing the code. We don’t call the ray’s absence a cause! We blame the sysadmin because she *should have acted*, not because her omission physically caused the crash. That’s what I call “quasi-causation”—a useful fiction for responsibility, but not real causation.  

  **Finch:** So when we say, “The outage was caused by the unmonitored queue,” that’s just… fiction? Even though everyone in engineering accepts it as factual?  

  **Thorne:** It’s *contextually* factual for assigning blame, but it’s not fundamental. Think of a hammer striking a nail: energy transfers, molecules displace. That’s causation. Now imagine I *don’t* lift the hammer to stop you from hitting your thumb. My omission *prevents* harm, but nothing flows from me to your thumb. The cause of your safety is your own restraint, not my inaction. Omissions are explanatory placeholders for *what we expected to happen but didn’t*. They’re vital for ethics and engineering, but they’re not in the causal fabric of the world.  

  **Finch:** But that fabric includes dispositions and dependencies! The sysadmin’s *capacity to act* was part of the system’s causal landscape. Her failure to trigger that disposition allowed the collapse. If causation is about patterns of counterfactual invariance—as Woodward or Lewis argue—then her omission *is* a cause. It’s invariant that if she sets the alert, the system survives; if she doesn’t, it fails. Random strangers don’t have that invariance.  

  **Thorne:** Then you’ve reduced causation to human interest! Why is *her* invariance privileged? Because we *decreed* it so. I’ll concede omissions matter intensely for responsibility—we *should* name the sysadmin in the postmortem—but calling it “causation” confuses the map with the territory. The territory is atoms, forces, and processes. The map has “blameworthy omissions” stamped where we see preventable voids.  

  **Finch:** So in the end, you admit we discipline people for quasi-causes?  

  **Thorne:** We discipline them for failing duties in a network of expectations. The outage’s *physical* cause remains the server overload. The sysadmin’s omission is why we *fault* her for it. You see the difference?  

  **Finch:** I see you’ve exiled causation from the social world. But when a preventable disaster strikes, “atoms and forces” won’t write our postmortem. We will. And we’ll rightly call the omission a cause.  

  **Thorne:** *[Sighs, swirling his coffee]* Then we’ll keep arguing. But at least I’ve stopped you from blaming the Andromedans for not teleporting in to fix the queue.  

  **Finch:** *[Smiles wryly]* Only because they had no duty.  

  ---  

  **Key Moves Summarized:**  
  - **Finch** grounds omissions in **robust counterfactuals** (dependent on duties) to solve the "everyone problem."  
  - **Thorne** attacks omissions as **lacking physical processes** and reduces them to normative labels ("quasi-causation").  
  - **Tech Example** bridges theory/practice: Finch ties the alert omission to *engineer expectations*; Thorne insists the *positive system state* is the true cause.  
  - **Stalemate:** Finch sees norms as *part* of causal reasoning; Thorne sees them as *separate* from metaphysics. Both confront blame: Finch says it tracks real causation; Thorne says it’s normative but physically groundless.
