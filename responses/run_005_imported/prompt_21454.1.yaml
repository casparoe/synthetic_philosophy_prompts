  When Marcus objects (3) about the conscript's targeting, he exposes a genuine discomfort in McMahan's framework - but it's more emotional than logical. Leah's response (4) then cleanly separates liability from blameworthiness, which feels technically correct though morally unsettling. 

  Marcus's final move (5) is sharp: he forces Leah to define responsibility thresholds. Here both hit bedrock problems - McMahan never cleanly solves the "degrees of responsibility" issue, while Walzer avoids it entirely. 

  Throughout, what's missing is attention to institutional roles (soldiers as agents of states) and collective action problems. Neither grapples with how individual ethics translate to battlefield realities. The conscript dilemma particularly highlights how both theories strain against moral intuition.
