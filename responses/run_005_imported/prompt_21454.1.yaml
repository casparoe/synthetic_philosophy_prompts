  **What Both Are Missing:**  
  - **Institutional roles:** Soldiers act as agents of states, not purely individuals. Walzer emphasizes this; McMahan underplays it.  
  - **Collective action:** Unjust wars require collective stopping power. Walzer's equality enables reciprocal restraint; McMahan's view risks paralyzing justified defense.  
  - **Practical consequences:** McMahan's model could undermine POW protections; Walzer's may normalize unjust wars.  
  - **Alternatives:** Neither explores middle positions (e.g., David Rodin's conditional liability) or the role of *reasonable belief* (even if not determinative).

