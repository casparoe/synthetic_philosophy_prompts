prompt: |-
  So I spent about thirty five years running a spectroscopy lab before I retired, and now I've fallen down a rabbit hole of philosophy of logic, which is a very different kind of precision than what I'm used to. Lately I've been chewing on the Liar paradox and I keep bumping into two names that seem to dominate the discussion: Tarski, with his hierarchy of object-language and metalanguage, and Kripke, with his fixed-point construction using strong Kleene logic and truth-value gaps. I read Tarski's semantic conception of truth paper first and thought I basically got it -- you just can't let a language talk about its own truth predicate without stratifying it into levels. Then I read Kripke's "Outline of a Theory of Truth" and now I'm second-guessing whether I understood Tarski at all, since Kripke seems to be solving a similar problem but rejecting the whole hierarchy idea in favor of letting sentences like the Liar just come out "ungrounded" or neither true nor false within a single language.

  Could you compare these two approaches for me? I'm especially curious what Kripke's fixed-point approach actually buys you that Tarski's hierarchy doesn't, and whether it really escapes the so-called "revenge" paradox (the thing where you introduce a sentence like "this sentence is not true or is ungrounded" and the problem just resurfaces one level up). My old colleague from the lab, who's now dabbling in formal semantics himself, insists Kripke's move is a genuine conceptual advance rather than just a technical repackaging of the same stratification idea, but I'm not so convinced yet -- feels like we're just hiding the regress rather than curing it. Which one of us is closer to right here?
