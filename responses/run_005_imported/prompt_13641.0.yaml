  First, I need to recall Ramsey's philosophical positions. From Misak's biography, he was pragmatic, anti-mystical, and focused on belief and action. His mockery of Wittgenstein's unsayable is key here—he dismissed what can't be said as nonsense. But conditionals are everyday language, so saying they aren't truth-apt might seem similar to Wittgenstein's mysticism. 

