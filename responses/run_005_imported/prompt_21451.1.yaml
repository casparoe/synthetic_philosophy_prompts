  Ah, and they want resolution, not just illustration. The ending needs weight—perhaps the surrogate becoming a cage, or the horror of realizing the threat might be imaginary after all. I'll lean into the latter: the ultimate cost being doubt about one's own untouched core. 

  Setting-wise, near-future feels right. Not dystopian, just quietly haunted by invisible game theory demons. An analyst protagonist fits—someone whose job is modeling threats would overthink this. Their real value? Something simple and human: watching birds. The surrogate? Painfully arbitrary: collecting obsolete corporate mugs. The banality sells the dread. 

