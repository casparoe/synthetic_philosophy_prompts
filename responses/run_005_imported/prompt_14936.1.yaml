  I recall that Wittgenstein's work often uses different metaphors to illustrate complex ideas from various angles. The hinges emphasize the functional necessity of certain beliefs at a given moment, while the riverbed shows their potential for change over time. The key is that hinges are context-dependent. What's fixed in one scenario or era might not be in another. For example, the belief in Newtonian physics was a hinge until Einstein's theories shifted it. This historical perspective aligns with the riverbed metaphor.

