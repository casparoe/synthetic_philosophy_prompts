answer: |-
  Let's build a concrete toy example to illustrate the "undermining futures" problem in Lewis's Humean Best System Account (BSA). This will show how future events can *retroactively* change the *current* chances, creating a conflict with rational belief (the Principal Principle).

  **The Setup: A Tiny Coin-Flip Universe**
  *   Imagine a universe containing **only 10 coin flips**, happening one after another. These are all the events that ever occur in spacetime.
  *   The *actual* outcome sequence is: **H, H, H, H, H, H, H, H, T, T** (8 Heads, 2 Tails).
  *   We're evaluating the "best system" of laws *after all 10 flips have happened*. The system needs to describe the entire history simply and informatively.

  **Step 1: The "Obvious" Best System (BS1)**
  *   A strong and simple system (BS1) might be:
      *   **Law:** "All flips have a chance of Heads = 0.8, Tails = 0.2."
      *   **Axiom:** "There were exactly 10 flips."
  *   **Why is this good?** It's very simple. It captures the high frequency of Heads (80%) concisely. It correctly describes the entire history (8H, 2T). It's informative – it tells you the pattern was biased towards Heads.

  **Step 2: The Undermining Future**
  *   Now, consider Flip #9 *while it's happening*. According to BS1, its chance of Heads *at that moment* is 0.8.
  *   But suppose Flip #9 *actually lands Tails* (as in our actual sequence). Flip #10 also lands Tails.
  *   **The Problem:** Does BS1 *remain* the best system *given that Flip #9 landed Tails*? Let's look at an alternative.

  **Step 3: An Alternative System (BS2)**
  *   Consider a different system (BS2):
      *   **Law:** "The first 8 flips were governed by a deterministic law: Always Heads. Flips 9 & 10 were governed by a chance law: Heads = 0.5, Tails = 0.5."
      *   **Axiom:** "There were exactly 10 flips. The deterministic law applied to flips 1-8. The chance law applied to flips 9-10."
  *   **Evaluating BS2:**
      *   *Strength:* It perfectly describes the actual history: Flips 1-8 were H, Flip 9 was T, Flip 10 was T.
      *   *Simplicity:* It's a bit more complex than BS1. It posits two distinct laws and specifies which flips they apply to. However...
      *   **Crucially:** BS2 *also* predicts the observed outcome *perfectly*. Flips 1-8 *were* all Heads. Flips 9 & 10 *were* random, and one of them *was* Tails.

  **Step 4: The Undermining**
  *   **The Conflict:** *After* Flip #9 lands Tails (and Flip #10 lands Tails), is BS1 *still* obviously better than BS2?
      *   BS1 says the *whole sequence* was chancy with P(H)=0.8. The outcome 8H/2T is *compatible* with this law, but it's a somewhat unlikely outcome (P(8H/2T) ≈ 0.07 under P(H)=0.8).
      *   BS2 says the *first 8 flips were determined*, guaranteeing H, and the *last 2 were fair coin flips*. The outcome 8H/2T is *exactly what this law predicts* (P(8H/2T) = 1.0 * P(one T in two flips) = 0.5).
  *   **The Undermining Future:** The occurrence of Flip #9 as Tails (and Flip #10 as Tails) *undermines* the status of BS1 as the best system. BS2 now looks competitive or even superior: it achieves perfect predictive accuracy (for the actual history) with only a small increase in complexity over BS1. It might win the "best balance" contest *because of the specific way the future turned out*.
  *   **Retroactive Chance Change:** If BS2 is now the best system, then the *chance* assigned to Flip #9 *at the time it occurred* wasn't 0.8 (as BS1 would have said), but 0.5 (as BS2 says)! The *actual future outcome* (Flip #9 = T, Flip #10 = T) *changed what the best system was*, thereby changing what the *chance* of Flip #9 landing Tails *was* when it happened. The chance of the event depended on its own future outcome and the outcome of events after it.

  **Why This Conflicts with the Principal Principle (PP)**
  The PP says your *rational credence* (degree of belief) in an event A should equal the *chance* of A, *if* you know the chance and have no "inadmissible" information (like direct knowledge of the future outcome).
  *   At the time of Flip #9, according to BS1, P(Tails) = 0.2.
  *   But you *also* know that if Flip #9 *is* Tails (and Flip #10 is Tails), then BS2 is probably the best system, meaning the *true chance* was actually 0.5.
  *   **The Contradiction:** What should your credence in Tails on Flip #9 be?
      *   If you follow PP using BS1's chance (0.2), you're ignoring information you *do* possess about how the future outcome affects the *truth* of BS1's chance claim. This seems irrational.
      *   If you try to use your knowledge that a Tails outcome *undermines* BS1, you can't coherently apply PP at all. PP requires knowing the *true* chance, but the *true* chance depends on the outcome of the very event you're trying to have a credence about! This leads to a kind of circularity or contradiction in rational belief formation. Lewis saw this as a major headache requiring a complex modification to the PP.

  **Why the Anti-Humean (Necessitarian) Doesn't Have This Problem**
  Your friend is exactly right. The key difference is **metaphysical dependence**:
  1.  **Humean Chance (BSA):** Chances *supervene on* the total mosaic of particular events. They are *summaries* of the pattern. The chance *just is* whatever the best system says it is. Since the best system depends on the *entire* pattern (past, present, *and future*), the chance of an event *now* depends (in part) on what happens *later*.
  2.  **Anti-Humean Chance (e.g., Armstrong):** Chances (or probabilistic laws/relations between universals) are *primitive, fundamental features of reality*. They are *not* constituted by the pattern of events; they *govern* and *explain* the pattern of events. The chance P(H) = 0.5 for a coin flip is a *brute fact* about the coin's nature or the universal "fair coin flip".
      *   **Consequence:** The chance at the time of Flip #9 is fixed *then and there* by the fundamental probabilistic law (or relation between universals) governing that flip. It is **independent** of what actually happens later in the sequence. Whether Flip #9 lands Heads or Tails, and what Flip #10 does, *does not change* what the fundamental chance *was* at the time of Flip #9. The fundamental law/propensity is fixed prior to and independently of the outcomes.
      *   **No Undermining:** Future outcomes cannot "undermine" the *truth* of the fundamental chance law. The law might be *falsified* by future events (e.g., if P(H)=0.5 is the law but Heads keep happening suspiciously often), but that just means the law was *wrong*, not that the *chance itself changed retroactively* based on the outcomes. The chance at the time was whatever the (true or false) fundamental law said it was.

  **In a Nutshell:**
  *   **Humean Problem:** "What the chance *is* (as a summary) depends on the whole future pattern. So the chance *now* can depend on *later* events, undermining rational belief formation (PP)."
  *   **Anti-Humean Solution:** "The chance *now* is a fundamental feature *now*, governing events. Future outcomes don't change what the chance *was*; they only show if the fundamental law stating that chance was true or false."

  This example shows the core tension within Humeanism: trying to define objective chances (which seem like guides to the future) as ultimately dependent on the entire future history creates a problematic feedback loop. The anti-Humean avoids this by making chances ontologically prior to the outcomes.
