answer: |-
  Here's a deep dive into the core objection against resolute choice and the defense, structured for your dissertation:

  **The Core Objection: The Rationality Cost of Diachronic Self-Alienation**

  The strongest objection to resolute choice isn't merely that it *feels* constraining, but that it fundamentally violates a principle many consider essential to instrumental rationality: **Diachronic Autonomy (DA).**

  *   **DA (Strong Form):** At any given choice node, an agent is rationally required to choose the option that best satisfies *their preferences at that very moment*, given their current beliefs and available options. Rationality is fundamentally *local* and *time-slice specific*. Binding oneself to a past decision, when *current* preferences point elsewhere, constitutes acting *against* one's own current evaluative standpoint. This is a form of *diachronic self-alienation* – the agent at time t2 is subordinating their own current judgment to the judgment of their past self at t1.

  **Why This Imposes a Significant Rationality Cost:**

  1.  **Violation of Instrumental Rationality's Core:** Instrumental rationality is about taking effective means to achieve one's *current* ends. DA captures this: choose now what best serves what you want *now*. Resolute choice, in forcing the agent to choose an option they *currently* disprefer (even if locally), directly violates this principle. The cost isn't just feeling constrained; it's acting *irrationally* at the moment of choice by selecting a dominated option relative to *current* preferences. The money-pump exploit leverages *local* irrationality (intransitivity leading to bad sequences); resolute choice *prescribes* local irrationality (choosing a locally dispreferred option) to avoid it. The objection is: **Why trade one form of local irrationality for another?**

  2.  **The Problem of "Bootstrapping":** The initial plan commitment at t1 gains its rational authority solely from the agent's preferences *at t1*. But why should the preferences of t1 *override* the preferences of t2? What grants t1 such privileged status? If the agent at t2 genuinely prefers Y over X (locally), and X was only chosen at t1 as part of a plan to avoid a *future* loss the agent at t2 doesn't *currently* care about avoiding *at that node*, the authority of the plan seems arbitrary. It's like a past self tying the hands of a future self who has different priorities.

  3.  **The "Why Bother?" Challenge:** If the agent at t2 is sophisticated enough to recognize the *local* dispreference for sticking to the plan, *and* sophisticated enough to understand the argument for resoluteness, why wouldn't they simply *re-evaluate their overall preferences* to be transitive *now*? Why go through the mental gymnastics of binding oneself to a plan that requires acting against current local preferences, rather than just *fixing the underlying preference structure* that caused the problem? Resolute choice seems like a cumbersome workaround for a deeper irrationality.

  4.  **Regret and Diachronic Incoherence:** Choosing resolutely at a later node often entails choosing an option the agent *knows* is worse *by their own current lights*. This can lead to rational regret *at the moment of choice* or immediately after. While achieving the long-term goal might mitigate *overall* regret, the presence of *local* regret signifies a diachronic incoherence: the agent is knowingly acting against their own current evaluation. This internal conflict is seen as a significant rational cost, reflecting a fractured agency over time.

  5.  **Undermining Rational Agency:** Critics argue that DA is central to the *concept* of a rational agent. An agent who systematically ignores their current best judgment in favor of a past commitment ceases to function as a unified locus of rational choice at each moment. They become a prisoner of their past self. True diachronic rationality, on this view, requires respecting the autonomy of the agent-at-each-time-slice, even if it leads to vulnerability in sequences.

  **The Resolute Choice Defender's Rebuttal:**

  Defenders (like McClennen, influenced by Bratman on planning) counter that the objection fundamentally misunderstands the nature of rational agency over time and the role of plans:

  1.  **Rationality is Holistic and Extended:** Rationality isn't confined to isolated moments. Agents are temporally extended beings with goals, projects, and identities that persist. Evaluating rationality solely at isolated choice nodes (DA) is myopic. True instrumental rationality requires considering the effectiveness of actions *over time* in achieving *extended* goals. The "best overall plan" evaluated at t1 *is* the rational means to achieve the agent's *persisting* ends over the sequence. Sticking to it *is* instrumentally rational *from the extended perspective*.

  2.  **Plans as Essential Rational Tools:** Forming and sticking to plans isn't irrational bootstrapping; it's a *necessary feature* of rational agency for temporally extended beings in complex worlds. Without the ability to commit to future actions, agents could never reliably achieve complex, multi-step goals vulnerable to temptation or preference shifts. Resolute choice is the mechanism for *implementing* rationally chosen plans. The authority comes not from t1 overriding t2, but from the *overall coherence* and *goal achievement* of the extended plan, which both temporal selves share an interest in (if they are the *same* rational agent).

  3.  **Rejection of the Time-Slice Agent Model:** Defenders reject the "time-slice" view of agency implicit in strong DA. The agent at t1 and t2 *is the same person*. The preferences at t2 aren't the preferences of a fundamentally different entity; they are potentially myopic or contextually distorted fragments of the agent's overall evaluative standpoint established at t1 when deliberating *comprehensively*. Resolute choice allows the agent to *identify* with their more deliberative, comprehensive self at t1 rather than their potentially myopic self at t2. This *preserves* unity of agency over time.

  4.  **The "Local Preference" is the Illusion:** In money-pump scenarios, the "local preference" that tempts deviation (e.g., trading back to A at the final node) is *itself* irrational or incoherent when viewed in the broader context. It arises *only* because of the incoherence the plan was designed to avoid. Giving in to it *feels* locally preferable but *is* the doorway to exploitation. Resolute choice isn't acting against "true" current preferences; it's *correcting* for a local evaluative distortion by adhering to the globally coherent preference set established in comprehensive deliberation. The regret, if it occurs, is irrational, stemming from the residual pull of the incoherent preference fragment.

  5.  **Sophistication vs. Resoluteness - A False Dichotomy:** Defenders argue that simply "fixing" preferences to be transitive *in response* to the pump threat isn't always straightforward or rational. Preferences might be deeply held or reflect complex values. Resolute choice provides a *procedural* solution that respects the *actual* (possibly incomplete/intransitive) preference structure while preventing exploitation, by managing the *choice disposition* rather than demanding preference revision. It's a rational *response* to the structure of the problem, not an admission of underlying irrationality.

  **The Stalemate and its Significance for Your Chapter:**

  The debate hinges on a fundamental disagreement about the *temporal unit* of rational assessment and the nature of agency:

  *   **Critics (DA):** Rationality is assessed moment-by-moment. Binding future choice against future preferences is irrational *at that future moment*, imposing a cost equivalent to the irrationality it avoids. The unit is the *time-slice*.
  *   **Defenders (Resolute):** Rationality is assessed over extended plans. Binding future choice is the rational *execution* of a globally optimal plan, essential for coherent agency over time. The unit is the *temporally extended agent*.

  **Why it's often seen as Pyrrhic:** Even if resolute choice technically avoids the money pump, critics argue it does so by *prescribing* actions that are *locally irrational* according to the standard (time-slice) definition of instrumental rationality. It solves the exploit problem by embracing a different kind of rational failure (self-alienation). The "victory" comes at the cost of abandoning a core tenet of standard decision theory.

  **Key Questions for Your Analysis:**

  1.  **Which conception of diachronic agency is more compelling?** Is the agent fundamentally a sequence of time-slices or a unified entity persisting through time?
  2.  **Is Diachronic Autonomy (DA) non-negotiable?** Is violating DA *always* a greater rational cost than vulnerability to exploitation?
  3.  **Can the "local preference" ever be trusted in pump-vulnerable scenarios?** Is it a genuine evaluative standpoint or a pathological artifact?
  4.  **Does resoluteness require a *separate* faculty of "willpower" or is it an expression of rational planning?** How is it psychologically implemented without seeming like self-coercion?

  By grappling with these questions, your chapter can move beyond simply recounting the debate and contribute to the deeper philosophical investigation of what it means to be a rational agent across time. The money-pump argument isn't just about preferences; it's a probe into the very structure of diachronic rationality and agency.
