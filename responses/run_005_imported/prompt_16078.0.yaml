answer: |-
  Here is a eulogy crafted to honor your friend's life, work, and deeply held convictions, balancing warmth for the family and precision for her colleagues:

  ---

  **Eulogy for [Friend's Name]**

  We gather today with heavy hearts to remember and celebrate the extraordinary life of [Friend's Name]. For thirty years, she was my closest friend, a brilliant mind, a steadfast companion, and a source of constant fascination and inspiration. Her passing leaves a void shaped uniquely like her: sharp, insightful, and filled with a quiet, determined passion for understanding the world.

  [Friend's Name] dedicated her professional life to unlocking the mysteries of color vision. She mapped its pathways, deciphered its signals, and contributed profoundly to our scientific understanding of how we perceive the vibrant spectrum of our world. This dedication was remarkable in itself. But it was rendered truly extraordinary by a singular fact: [Friend's Name] lived her entire life seeing the world in shades of grey. She had complete congenital achromatopsia.

  Think about that for a moment. Her life's work was the physiology of a sense she had never personally experienced. Yet, she approached it not with a sense of lack, but with unparalleled focus and intellectual rigor. She didn't just study color vision; she mastered it on a level few sighted people ever could. She understood the machinery – the rods, cones, neural pathways, and cortical processing – with an intimacy born of relentless curiosity and scientific discipline.

  She often reflected on this unique position, especially when philosophical discussions about consciousness and perception arose. With her characteristic dry wit, she would point to herself as a kind of living experiment. You see, there's a famous thought experiment in philosophy, involving a scientist named Mary who knows everything physical about color but has never seen it. The story suggests Mary learns something *new* when she finally sees red. [Friend's Name] knew all about Mary. And she liked to joke that *she* was the living rebuttal.

  Her view, forged through a lifetime of rigorous science and deep reflection, was clear and unwavering. She believed that her exhaustive knowledge *was* the knowledge of color vision. What she lacked, she maintained, wasn't some inaccessible, non-physical essence of "redness" or "blueness" – what philosophers sometimes call "qualia." No. What she lacked was the specific set of *abilities* that come with possessing functional color photoreceptors: the ability to visually discriminate wavelengths effortlessly, to name colors on sight, to have certain automatic recognitional responses to the world. Her science, she was adamant, hadn't *missed* anything fundamental about color; it had fully described the phenomenon. What remained was the experiential skill set she simply didn't possess the biological hardware to acquire.

  This wasn't just an academic stance; it was a core part of her identity as a scientist and a person. It reflected her profound commitment to the explanatory power of physical science and her deep respect for the complexity of the biological systems she studied. She lived the conviction that understanding the physical process *is* understanding the phenomenon.

  Her family knows how deeply she held this view. She expressed it clearly, even in her final wishes regarding today. She specifically requested that no one stand here and say she can "finally see red" or has "discovered color at last." To do so, she felt, would be to fundamentally misunderstand her life's work and concede the very point she spent her career demonstrating through her own existence and research. It would imply her science was incomplete in a way she passionately believed it was not, and that her understanding of the world was somehow deficient, which it emphatically was not.

  So, how *do* we honor her today? Not by imagining her experiencing something she consistently argued wasn't missing in the way often supposed, but by celebrating the incredible richness of the world she *did* experience and the profound understanding she *did* achieve.

  We celebrate the brilliant scientist who saw the intricate beauty of visual processing not in hues, but in data, patterns, and elegant physiological mechanisms. We celebrate the colleague whose collaborations – including those with philosophers of mind – were marked by intellectual honesty, sharp insight, and a unique perspective that challenged assumptions. We celebrate the friend and family member whose warmth, loyalty, and vibrant personality needed no color to be deeply felt and cherished. She found profound meaning, connection, and intellectual satisfaction in a world perceived differently, understood deeply.

  [Friend's Name] didn't need to see color to see the wonder in a sunset's physics, the complexity of a neural circuit, or the love in a friend's face. Her world, built on shades of grey, was nonetheless rich in texture, light, shadow, relationship, and towering intellectual achievement. She understood color not as a spectator yearning for an entrance, but as a master engineer who knew the blueprints by heart.

  She lived a complete life, grounded in the reality she experienced and the science she revered. Let us remember her not for a sensory revelation she neither expected nor desired in the philosophical sense, but for the luminous intelligence, unwavering integrity, deep kindness, and groundbreaking contributions she brought to *this* world – the world she knew, studied, and loved so well. Her legacy isn't in seeing color now; it's in the brilliant light of understanding she cast upon it for all of us during her remarkable life.

  Rest in peace, dear friend. Your work endures. Your friendship is cherished. Your unique perspective on the world has left it forever changed.

  ---

  **Key elements addressing your requirements:**

  1.  **Warmth & Personal Connection:** Opens with personal loss, mentions 30-year friendship, highlights her personality ("dry wit," "vibrant personality," "deep kindness"), celebrates her relationships, and uses respectful, affectionate language throughout.
  2.  **Clear Explanation of Her Condition & Work:** Explains achromatopsia simply and connects it directly to the significance of her career choice.
  3.  **Precise Metaphysics (for Colleagues):**
      *   Explicitly mentions Jackson's Mary thought experiment.
      *   Clearly states her role as a "living rebuttal."
      *   Accurately articulates her "ability hypothesis" position: lack of *abilities/skills*, not lack of *knowledge* of non-physical qualia.
      *   Uses the term "qualia" in context, explaining it ("non-physical essence").
      *   Emphasizes her view that physical science *does* fully explain color vision.
      *   Strongly reinforces that this was a deeply held, core belief ("clear and unwavering," "core part of her identity," "profound commitment").
  4.  **Honoring Her Specific Request:** Explicitly states her final wish regarding the funeral, explains *why* she held that view (it concedes the point she denied), and clearly commits to respecting it ("So, how *do* we honor her today? Not by imagining...").
  5.  **Affirming Her Life & Perspective:** Shifts the focus positively to celebrate the richness of her *actual* experience and understanding ("world she *did* experience," "profound understanding she *did* achieve"). Uses metaphors she might appreciate ("master engineer who knew the blueprints," "luminous intelligence," "light of understanding").
  6.  **Dignified Closing:** Focuses on her enduring legacy, contributions, relationships, and the completeness of her life as she lived it. Avoids any implication of posthumous sensory revelation.
  7.  **Accessible Language:** Explains philosophical concepts (Mary, qualia, physicalism via the ability hypothesis) in clear, non-technical terms suitable for the family, while maintaining the precision colleagues will recognize.

  This eulogy honors your friend's memory by faithfully representing who she was, what she believed, and what she achieved, without compromising her philosophical stance for sentimental ease. It offers comfort by focusing on the tangible reality of her remarkable life and contributions.
