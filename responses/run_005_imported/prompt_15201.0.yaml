prompt: |-
  My podcast's guest next week is an experimental philosopher -- one of those Weinberg/Nichols/Stich-school people -- whose whole research program rests on the finding that epistemic intuitions about Gettier cases vary by culture and class, which she takes to be a real problem for treating 'intuition' as evidence in philosophy. Her go-to move whenever someone brings up a failed replication is some version of 'a null result isnt evidence of no effect, it just means the vignette needed work,' and given the whole WEIRD-samples reckoning psych already went through, i don't want to let her lean on that every time. Can you draft me 8 to 10 interview questions that build on each other: start with the original cross-cultural result, then the expertise-defense literature (and the messier data her own school later found on professional philosophers), then the Kim & Yuan-style replication failures, and end on the meta question of what's left to count as evidence in philosophy if intuitions are this unstable. For each one, flag the dodge she'll probably reach for and give a follow-up sharp enough she can't just rest on it.
reasoning: |-
  Okay, the user is a podcast host preparing for an interview with an experimental philosopher. The guest's research is based on findings that epistemic intuitions about Gettier cases vary across cultures and socioeconomic classes, which challenges the use of intuition as evidence in philosophy. The host wants to craft questions that systematically address this topic, starting from the original cross-cultural results, moving through defenses based on expertise, discussing replication failures, and ending with the broader implications for philosophical methodology.

  The host specifically mentions that the guest tends to dismiss replication failures by claiming null results just mean the vignettes needed adjustment. Given psychology's reckoning with WEIRD samples (Western, Educated, Industrialized, Rich, Democratic), the host wants to prevent her from relying on that excuse repeatedly. They need 8-10 questions that build logically, each anticipating the guest's likely dodges and including sharp follow-ups.

  First, I need to understand the key components the host wants covered:  
  1. Original cross-cultural findings (Weinberg, Nichols, Stich)  
  2. Expertise defense literature  
  3. Messier data on professional philosophers' intuitions  
  4. Kim & Yuan replication failures  
  5. Meta-question about philosophical evidence  

  For each question, I should:  
  - Frame the core issue  
  - Anticipate the guest's deflection  
  - Craft a follow-up that corners her  

  The sequence should flow:  
  Start with foundational claims → Examine defenses → Challenge with failed replications → Force methodological confrontation → End with epistemological consequences  

  Potential dodges to preempt:  
  - "Null results mean bad vignettes"  
  - "WEIRD samples don't invalidate core findings"  
  - "Philosophical expertise trumps lay intuitions"  

  Follow-ups must:  
  - Cite contradictory evidence from her own school (e.g., mixed data on pros)  
  - Note psychology's lessons about generalizability  
  - Demand falsifiability criteria  

  Endgame: Make her articulate what survives if intuitions are unreliable. Does philosophy retreat to formal logic? Embrace naturalism? This exposes tensions in X-Phi's own foundations.  

  The host's deeper need seems to be: Pushing past rhetorical shields to examine X-Phi's empirical fragility and its unresolved paradox—if intuitions fail, what anchors philosophical claims? (Especially since X-Phi itself uses intuitions!)  

  Structure outline:  
  1. Origin story + WEIRD critique  
  2. Expertise rebuttal + internal contradictions  
  3. Replication crisis + vignette dodge  
  4. Meta: Collapse of intuition-based methods  

  Tone: Respectful but relentlessly logical. No gotchas—steel-man her position before dissecting it.
answer: |-
  Here’s a structured interview roadmap with 8 escalating questions designed to preempt dodges and push toward the meta-problem. Each question includes:  
  - **Core Target**  
  - **Anticipated Dodge**  
  - **Sharp Follow-Up**  

  ---

  ### **Q1: The Foundational Claim**  
  *"Your early work (à la Weinberg/Nichols/Stich) showed East Asian vs. Western intuitions on Gettier cases diverge dramatically. How critical was this cultural variation to your argument that intuitions can’t be universal evidence?"*  
  - **Target**: Force her to anchor in the *original* cross-cultural data.  
  - **Dodge**: "It wasn’t just culture—class, education, etc., all fracture intuitions!"  
  - **Follow-Up**: "But if class or education explains the variance, doesn’t that *weaken* the ‘cultural relativity’ punch? If WEIRD undergrads disagree with non-WEIRD ones, is that really about *culture*—or sampling bias?"  

  ---

  ### **Q2: The WEIRD-Samples Reckoning**  
  *"Psychology’s replication crisis exposed how overreliance on WEIRD samples distorts findings. Given your field uses similar methods, how do you ensure your results aren’t just artifacts of sampling?"*  
  - **Target**: Preempt the "failed replication = bad vignette" deflection by invoking psychology’s lessons.  
  - **Dodge**: "We control vignettes rigorously! Null results mean we haven’t found the *right* cultural/class lens yet."  
  - **Follow-Up**: "If every null result is dismissed as ‘bad design,’ doesn’t that make your thesis unfalsifiable? What *specific* criteria would falsify cultural variation in intuitions?"  

  ---

  ### **Q3: The Expertise Defense**  
  *"Some philosophers (e.g., Williamson, Ludwig) argue trained experts have refined intuitions. You’ve critiqued this—but your own later work found *professional philosophers* also show intra-group disagreement on cases like Fake Barns. How does this undercut the expertise shield?"*  
  - **Target**: Use her *own* data against philosophical exceptionalism.  
  - **Dodge**: "Disagreement among experts proves intuitions are unstable! That’s our point!"  
  - **Follow-Up**: "But if even experts can’t converge, doesn’t that collapse the ‘training refines intuition’ argument *entirely*? Why should we trust *any* intuition—including those used in X-Phi itself?"  

  ---

  ### **Q4: The Replication Crisis in X-Phi**  
  *"Kim & Yuan (2015) replicated Gettier studies cross-culturally and found *no* significant differences. You’ve suggested their vignettes ‘weren’t culturally optimized.’ But if every failed replication is blamed on methods, how is this different from ad hoc rescuing?"*  
  - **Target**: Corner the "vignette tweaking" dodge.  
  - **Dodge**: "Replications fail because they don’t account for local context! E.g., ‘epistemic luck’ might not translate."  
  - **Follow-Up**: "So is the claim that epistemic intuitions vary *only* when vignettes are perfectly localized? Doesn’t that reduce your thesis to ‘intuitions vary when we make them vary’—tautologically?"  

  ---

  ### **Q5: The Burden of Proof**  
  *"If null results demand better vignettes, the burden shifts to X-Phi to *prove* variation exists. What method—beyond endlessly tweaking scenarios—would settle this?"*  
  - **Target**: Force methodological accountability.  
  - **Dodge**: "We iterate designs! Science is cumulative!"  
  - **Follow-Up**: "But after 20 years, if key results (like East/West splits) still hinge on specific wording, doesn’t that suggest the effect is fragile or niche? At what point do we say the evidence *doesn’t* support strong cultural variation?"  

  ---

  ### **Q6: X-Phi’s Own Epistemic Standards**  
  *"X-Phi uses surveys (i.e., intuitions) to debunk intuitions. Isn’t that self-undermining? If your tools are unreliable, why trust *your* data?"*  
  - **Target**: Hit the meta-problem of circularity.  
  - **Dodge**: "We use empirical methods! We’re studying cognition, not doing armchair philosophy."  
  - **Follow-Up**: "But your ‘empirical methods’ still rely on *subjects’ intuitions* as data. If those are unstable, how is X-Phi not also built on quicksand?"  

  ---

  ### **Q7: What Survives the Wreckage?**  
  *"Suppose we concede intuitions are too unstable for evidence. What *does* count as evidence in philosophy? Formal logic? Neuroscience? Or does philosophy lose its privileged status?"*  
  - **Target**: Expose the vacuum left by discarding intuitions.  
  - **Dodge**: "We pivot to naturalized philosophy! Collaborate with science."  
  - **Follow-Up**: "But science also relies on observation (a form of intuition). If you radicalize your critique, doesn’t it collapse *all* first-person evidence—leaving philosophy with no distinctive tools?"  

  ---

  ### **Q8: The Exit Question**  
  *"Your program implies philosophy must reform or perish. Yet X-Phi hasn’t converged on an alternative method. Is the endgame here a kind of skeptical quietism—or do you have a positive vision?"*  
  - **Target**: Make her defend a constructive future (or admit defeat).  
  - **Dodge**: "We’re pioneers! The future is interdisciplinary."  
  - **Follow-Up**: "But interdisciplinarity still needs epistemic foundations. If intuitions die, and science can’t answer normative questions, what *specific* problem has X-Phi solved that traditional philosophy hasn’t?"  

  ---

  ### **Why This Works**  
  - **Builds a Trap**: Starts with her strongest claim (cultural variation), then uses her defenses (expertise, vignette tweaking) against her via replication failures and meta-circularity.  
  - **Preempts Dodges**: Follow-ups invoke her own data, psychology’s lessons, and demand falsifiability.  
  - **Ends on the Knife-Edge**: Forces her to either (a) propose a new epistemology (risking vagueness) or (b) concede philosophy’s crisis.  

  **Delivery Tip**: Stay cordial but persistent. If she dodges, smile and say: "I’m pressing this because listeners will wonder—[follow-up question]." This grounds pushiness in audience demand.
