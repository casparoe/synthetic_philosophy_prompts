  - **Constitution view (Baker)**: The statue and the clay are non-identical but the statue is constituted by the clay at a time. They are the same object in a way, but not identical. When the statue is squashed, the clay remains but the statue ceases to exist. This view is popular but has been criticized for being vague and for introducing a new relation (constitution) without sufficient grounding.

  - **Mereological essentialism**: The parts are essential to the whole. If the statue loses a part, it ceases to exist. So, when you squash the statue, the statue ceases to exist because the arrangement is destroyed. This view is seen as too strict because it doesn't allow for ordinary change.

  - **Relative identity**: There is no absolute identity. The statue and the clay are the same lump of clay but different statues? Or same in one respect, different in another? This view is controversial because it denies the absoluteness of identity and is seen as confusing.

