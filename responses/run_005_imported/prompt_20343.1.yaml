  3) The integration problem: Virtues often conflict (e.g., honesty vs. kindness). Without practical wisdom, following one virtue rigidly can violate another.

  What makes humility special is that it's the virtue most antithetical to self-monitoring. But the other virtues suffer similar distortions under Franklin's method. Pursuing temperance for chart points turns moderation into an achievement to be proud of. Chasing chastity as a countable goal risks reducing it to mechanical abstinence rather than integrated self-respect.

