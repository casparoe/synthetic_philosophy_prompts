  Franklin's approach treats virtues as discrete skills to be mastered through repetition and tracking. He uses accounting metaphors - ledgers, charts, credits and debits. This makes virtues seem like technical proficiencies rather than integrated character traits. Aristotle would argue this is misguided because true virtue isn't additive; it emerges from practical wisdom that understands how virtues relate to each other in different contexts.

  The humility paradox actually exposes three interconnected problems in Franklin's system:
  1) The quantification problem: Reducing virtue to measurable units ignores how virtues manifest differently in varying situations. Courage at a protest isn't the same as courage in a hospital.
