answer: |-
  ## The Heap at Dusk: Why Supervaluationism Survives the Cut

  Your dinner debate captures the enduring frustration of vagueness: a problem that feels both trivial and profound. The sorites paradox exposes a crack in our conceptual foundations, and neither epistemicism nor supervaluationism patches it seamlessly. However, by reconstructing the core objections and assessing each theory's defensive resources, a verdict emerges: **supervaluationism, despite its struggles with higher-order vagueness, offers a more plausible account of meaning and use than epistemicism, whose commitment to unknowable sharp boundaries ultimately undermines its core premise.** Let's dissect the duel.

  ### The Charges Laid Bare

  1.  **Against Supervaluationism: The Specter of Higher-Order Vagueness (Your Friend's Objection)**
      *   **The Core:** Supervaluationism claims borderline cases (n grains) lack truth values because no admissible precisification settles them. It introduces a "definitely" operator (D) to handle penumbral truths ("D(10000 grains make a heap)" is true). But what determines admissibility? When does a precisification become *inadmissible*? This boundary itself seems vague. Is there a precise number of precisifications beyond which "heap" is definitely vague? Or a sharp cutoff for when a precisification violates penumbral connections sufficiently to be excluded? If "definitely" (D) is analyzed supervaluationistically, we need *another* layer of precisifications for *it*, leading to an infinite regress. The objection is that supervaluationism, designed to avoid sharp boundaries for vague predicates, merely relocates the sharp boundary to the meta-level (admissibility, definiteness), violating the very phenomenon it seeks to model.

  2.  **Against Epistemicism: The Meaning/Use Incompatibility (Your Objection)**
      *   **The Core:** Epistemicism asserts that "heap" has a precise, unknowable cutoff (say, k grains). Meaning is determined by use – the complex pattern of linguistic behavior and dispositions within a community. But how can use, which is inherently messy, graded, and context-sensitive, possibly fix a *single*, *precise*, *unknowable* boundary? Use seems to manifest *tolerance* (small changes don't matter) and *indeterminacy* (no clear consensus on borderline cases). To insist that this practice secretly pins down k, while simultaneously insisting we *cannot possibly know* k due to a "margin-for-error" principle (our knowledge of meaning requiring knowledge of nearby possible uses), feels deeply paradoxical. It posits a hidden, inaccessible fact generated solely by the very public practices that show no evidence of establishing it. How can meaning be "nothing over and above use" yet contain a sharp, unknowable fact *about* that use?

  ### Assessing the Defenses

  **Epistemicism's Defense Against Meaning/Use:**
  Williamson's primary defense is the **margin-for-error principle (MEP)**. Our knowledge of meaning (and thus the extension of "heap") is inexact. Knowing that "heap" applies to m grains only guarantees it applies to m±d grains, where d is the margin-for-error determined by the sensitivity required for reliable application. The *exact* cutoff k is fixed by the totality of use, but our epistemic access is necessarily limited by the MEP, explaining our ignorance. The sharp boundary exists *because* meaning *must* be determinate to avoid contradictions in classical logic, which Williamson prioritizes. Use fixes k via complex causal-historical chains and dispositions, even if the community's *awareness* of k is necessarily fuzzy.

  *   **Assessment:** The MEP *explains ignorance* but doesn't *resolve* the incompatibility. It pushes the problem back: *How* does use fix k? If dispositions are themselves vague (e.g., speakers are only *disposed* to accept/reject n grains with varying degrees of confidence across contexts), what mechanism *sharpens* them into k? The appeal to classical logic feels like a *prior commitment* forcing the ontology, rather than an explanation emerging from use. The MEP makes k *unknowable*, but doesn't convincingly show how k is *determined* by the very practices that seem fundamentally incompatible with sharp determination. The defense risks making meaning mysteriously transcendent.

  **Supervaluationism's Defense Against Higher-Order Vagueness:**
  Supervaluationists have several strategies:
  1.  **Embrace Recursion (Carefully):** Admit higher-order vagueness exists. Define D₁P ("definitely P") via the first-order admissibility set. Then define D₂P ("definitely definitely P") via a vaguer set governing *which* precisification sets are admissible for defining D₁, and so on. While this leads to an infinite hierarchy of "definitely" operators, it avoids a sharp boundary *at any single level*. The vagueness is "pushed up" but not eliminated.
  2.  **Contextualist Escape:** Argue that the admissibility conditions themselves are context-sensitive. What counts as an admissible precisification depends on the conversational context, including the standards of precision in play. This avoids a *single*, absolute, sharp boundary for admissibility across all contexts. Higher-order vagueness manifests as context-sensitivity.
  3.  **Primitive Indefiniteness:** Treat the admissibility relation or the "definitely" operator as *sui generis* and inherently vague, not further analyzable in supervaluationist terms. This accepts vagueness as a fundamental feature of some concepts/metaconcepts.

  *   **Assessment:** While messy, these defenses *manage* higher-order vagueness without collapsing into absurdity. Recursion preserves the core insight that vagueness involves open-texture at multiple levels. Contextualism aligns with the intuitive flexibility of vague language. Accepting some primitive indefiniteness might be the price of avoiding epistemicism's mysteries. Crucially, **none of these defenses reintroduce a sharp boundary for the *original predicate* ("heap") at the object level.** The penumbral connections are preserved, and borderline cases remain truth-valueless, matching linguistic intuition. The problem is contained within the meta-language.

  ### The Verdict: Supervaluationism's Edge

  While both theories face significant challenges, **supervaluationism emerges as the more defensible position.**

  1.  **The Fatal Flaw of Epistemicism:** Its inability to satisfactorily reconcile a sharp, unknowable cutoff with meaning being grounded *solely* in use is crippling. The MEP explains *why* we don't know the boundary but fails to show *how* use generates it. It requires us to believe that our collective, tolerant, hesitant, and contextually variable practices concerning heaps or baldness somehow secretly converge on a single, precise number. This feels like a theoretical imposition demanded by logical conservatism, not a natural consequence of how language functions. It renders meaning partially occult.
  2.  **Supervaluationism's Manageable Burden:** Higher-order vagueness is a genuine challenge, but not a fatal one. The recursive, contextualist, or primitivist strategies provide coherent (if complex) ways to accommodate it without abandoning the core supervaluationist framework. Crucially, these strategies **preserve the key virtues** of the theory:
      *   **Respects Phenomenology:** It directly models the truth-value gaps we experience in borderline cases.
      *   **Explains Penumbral Truths:** "If it's a heap, removing one grain doesn't make it not a heap" comes out true without requiring a sharp cutoff.
      *   **Grounds Meaning in Use:** Admissible precisifications are *constrained* by actual and potential use patterns, including tolerance principles and typical exemplars. Meaning *is* the space of admissible ways the community could coherently sharpen the term based on its established use. Borderline indeterminacy directly reflects the *lack* of settled use, not ignorance of a hidden fact.
      *   **Avoids Mysterious Facts:** There is no k whose value is fixed yet utterly inaccessible to all possible knowers based on the evidence of use.

  **The Stalemate is Broken:** Epistemicism's core claim – that vagueness *is* epistemic ignorance of sharp boundaries – founders on the implausibility of sharp boundaries arising from inherently vague use. Supervaluationism's core claim – that vagueness *is* semantic indecision manifested as truth-value gaps – successfully explains the phenomena, even if its meta-language tools for handling "definitely" introduce further complexities that themselves exhibit vagueness. This meta-vagueness is a consequence of the theory accurately reflecting the depth of the phenomenon, not a refutation of it.

  ### Beyond the Duel: The Path Forward

  While supervaluationism wins this round, neither theory provides a perfect, intuitive solution. The persistence of higher-order vagueness hints that a truly satisfying account might lie beyond both:

  *   **Contextualism/Interest-Relativity:** Vagueness resolution is fundamentally driven by context and our shifting purposes. What counts as "heap" depends on why we're asking. This dynamically absorbs much higher-order vagueness.
  *   **Degrees of Truth:** Perhaps borderline statements aren't simply true, false, or gappy, but possess intermediate degrees of truth (e.g., 0.7 true). This offers a more granular picture but faces challenges with the logic of compound statements and penumbral connections.
  *   **Paraconsistent/Non-Classical Logics:** More radically abandoning classical logic (e.g., allowing true contradictions in borderline regions) remains a minority view due to significant costs.

  **Conclusion:** Your dinner debate ended where many do, but the analysis points clearly. Williamson's epistemicism, despite its ingenuity, asks us to accept an inexplicable divorce between the sharp boundaries it posits and the manifestly unsharp practices that supposedly determine meaning. Your defense of supervaluationism, while conceding ground on the tricky terrain of higher-order vagueness, offers a model where meaning genuinely supervenes on use, truth-value gaps reflect genuine indeterminacy, and penumbral truths are secured. The heap may not have a sharp boundary, and "definitely" might itself be vague, but this messy picture aligns far better with the reality of our language than the unknowable, use-transcending precision demanded by epistemicism. The victory, though not without scars, goes to supervaluationism. The challenge remains to refine its tools for handling the ever-receding horizons of definiteness.
