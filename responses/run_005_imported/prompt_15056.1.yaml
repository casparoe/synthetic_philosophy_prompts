prompt: |-
  Ok so my philosophy of mind seminar is doing the Chinese Room this week, and as "historical background" the professor also had us read this bit from Leibniz's Monadology (1714, i think it's the old Latta translation) and honestly its messing with my head more than Searle ever did. Here's the passage:

  "Moreover, it must be confessed that perception, and that which depends upon it, are inexplicable by mechanical causes, that is to say, by figures and motions. And, supposing that there were a machine whose structure produced thought, sensation, and perception, we could conceive of it as increased in size while retaining the same proportions, so that we might enter it as one enters a mill. Now, on going into it, we should find only pieces working upon one another, but never anything by which to explain a perception. This must be sought for, therefore, in the simple substance, and not in the composite or in the machine."

  Can someone walk me through what's actually happening in this argument step by step? I get the vivid image (you walk into the giant mill and just see gears pushing other gears) but I don't fully get why that image is supposed to prove anything about perception. I'm also trying to figure out whether this is basically the same move as Searle's Chinese Room — mechanism can never add up to the real thing, whatever the "real thing" is — or a genuinely different argument that just happens to reuse a similar "go inside the machine" intuition pump. Like, Leibniz seems to slide pretty fast from "we'd only see parts pushing on parts" to "so perception has to be sought in a simple substance, not a composite/machine" — is that last inference doing real philosophical work (why does it have to be SIMPLE rather than just some complicated substance we haven't figured out yet), or is his monad metaphysics basically getting smuggled in there for free? Would love it if someone could unpack this for me, since I'd rather say something halfway intelligent in section tomorrow than just "yeah it's the Chinese Room 250 years early."
