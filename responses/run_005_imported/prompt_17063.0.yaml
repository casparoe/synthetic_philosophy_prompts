answer: |-
  ## The Toast: Through the Veil, With Purpose

  [Raise glass, warm smile to the honoree]  
  To [Her Name]. For fifteen years, whenever monetary winds shifted or policy puzzles deepened, she was my compass. Calm, clear, and cutting straight to the heart of the matter. And invariably, that heart seemed to beat in rhythm with an essay written 270 years ago by David Hume.

  Now, I promise, family, this isn't going to be an economics lecture! But bear with me, because Hume captured something simple yet profound that became the quiet engine of [Her Name]'s entire remarkable career.

  Hume described money – all those bills and digital entries – as a **veil**. Think of it like a sheer curtain over a window. You can see the world outside *through* it, but the curtain itself isn't *part* of the landscape. It’s just… there. He argued that simply adding more curtain – printing more money – couldn’t *truly* enrich a nation in the long run. Eventually, prices just adjust. The veil gets thicker, but you see the same reality outside. The curtain itself doesn't create more fields or factories or houses.

  [Pause, look at the economists]  
  We call that "long-run neutrality." The economists nod. [Smile at the family] The family thinks, "Okay, curtain, got it. Seems sensible."

  But here’s where Hume got really interesting – and where [Her Name] found her profound purpose. Hume, that clear-eyed skeptic, paused. He admitted something crucial: *In the interval* – that messy, uncertain space *between* adding more of that veil and prices fully catching up… *something real happens*. Activity quickens. Factories hum a little louder. More people find work. The wheels of the economy turn faster… *for a while*.

  [Lean in slightly]  
  *That* interval. *That* space between the cause and the final effect. *That* is where [Her Name] devoted her brilliant mind and fierce dedication.

  She understood, fundamentally, that the veil *isn't* neutral in the short run. And it’s in that short run where real lives are lived, businesses are built or broken, and communities thrive or struggle. Her whole case for the vital importance of central banking wasn't about magically creating wealth through the printing press – she knew Hume was right about the long run curtain. No.

  It was about **navigating that interval wisely**. It was about using the tools of policy – carefully, meticulously – to provide a *bridge*, a *stability*, a **breathing room** during shocks and crises. To prevent the wheels from grinding to a destructive halt before the long-run adjustment could happen naturally. To give people and businesses the *chance* to adapt, to invest, to find their footing again, without being crushed by a sudden, violent tearing of the veil.

  [Look directly at the honoree]  
  [Her Name], you saw through the veil to the real economy beneath. But you also understood the profound human consequence of *how* that veil shifts and settles. You dedicated your career not to illusions of permanent wealth from the curtain itself, but to the very real, very difficult task of managing the *transition* – minimizing the pain of adjustment, maximizing the potential in that crucial "interval" Hume described. You proved, day after day, year after year, that navigating that temporary space with skill, integrity, and deep understanding *is* how central banking builds real, lasting value. It’s how it serves real people.

  You showed us that the veil matters precisely *because* it isn't instantly neutral – and that wielding its influence responsibly in that gap is an art, a science, and a profound public service.

  So, let’s raise our glasses. To [Her Name]: A master navigator of the interval. A brilliant economist who never lost sight of the real people behind the veil. Thank you for your clarity, your dedication, and for making that crucial space of transition safer and more productive for us all. To [Her Name]!
