answer: |-
  That's an incredibly sharp observation about Sidgwick – you've nailed the core connection between his psychical research and the profound problem at the heart of his ethics. Your friend is wrong to dismiss it as a mere hobby; it was a desperate, decades-long empirical quest to resolve the "Dualism of Practical Reason" he identified in *The Methods of Ethics*. Here's the breakdown:

  **1. Sidgwick's Dualism of Practical Reason: The Core Problem**

  *   In *Methods*, Sidgwick rigorously analyzed common-sense morality, intuitionism, egoistic hedonism, and universalistic hedonism (utilitarianism).
  *   He concluded that utilitarianism was the most rational and consistent system *for maximizing the general good*.
  *   **The Problem:** He also found rational egoism (maximizing one's *own* happiness) to be an equally fundamental and rationally compelling principle. There was no logical contradiction within egoism itself.
  *   **The Conflict:** These two rational principles can come into direct, irresolvable conflict. What is rationally required to maximize the general good (e.g., significant self-sacrifice) can be directly opposed to what is rationally required to maximize *my own* good.
  *   **The Stalemate:** Reason cannot definitively prove that one principle overrides the other. Utilitarianism cannot *rationally* demand self-sacrifice from an egoist without begging the question (assuming the supremacy of the general good). Egoism cannot *rationally* demand selfishness from a utilitarian without begging the question (assuming the supremacy of self-interest). This is the "Dualism."

  **2. Why Psychical Research? Sidgwick's Desperate Hope**

  Sidgwick couldn't accept this fundamental conflict as the final word on ethics. He needed a way to reconcile the two principles to give utilitarianism a fully rational, non-arbitrary foundation. His solution hinged on **theological postulate**:

  *   **The Reconciliation Condition:** The dualism *only* disappears if there is a divine moral order guaranteeing that maximizing the general good *also* maximizes one's *own* long-term good (including an afterlife). Virtue and self-interest must ultimately coincide.
  *   **The Need for Evidence:** Sidgwick, the arch-rationalist and empiricist, wasn't satisfied with mere faith. He demanded *evidence*. If an afterlife (and divine justice/reward) existed, it should be *empirically investigable* through phenomena like spiritualist communications, hauntings, telepathy, etc.
  *   **The SPR Mission:** The Society for Psychical Research wasn't a hobby club; it was founded (by Sidgwick, Myers, Gurney, et al.) with the explicit, serious scientific aim of rigorously investigating claims of the paranormal to find proof of survival after death. This would provide the empirical basis for the theological postulate needed to resolve the dualism and secure the rational foundation of utilitarianism.

  **3. The Implications of Failure (Inconclusive Findings)**

  The fact that the SPR, after decades of exhaustive investigation under Sidgwick's leadership, found **no conclusive, verifiable evidence** for an afterlife or paranormal phenomena supporting divine justice has profound implications:

  *   **The Dualism Stands Unresolved:** The fundamental conflict between rational egoism and utilitarianism remains logically irresolvable by reason alone. Sidgwick's hope for an empirical/theological resolution failed.
  *   **No Non-Question-Begging Foundation for Utilitarianism:** Utilitarianism cannot provide a *rationally compelling* argument *to an egoist* for why they *must* sacrifice their own good for the greater good when the two conflict. Its ultimate appeal rests on accepting the primacy of the general good as an axiom, which the egoist can rationally reject. This is the "question-begging" problem you identified. Utilitarianism becomes, in the final analysis, a choice, not a logically inescapable conclusion for all rational beings.
  *   **The Vulnerability of Altruism:** Without cosmic justice, the utilitarian who acts self-sacrificially *is* vulnerable to "getting shafted" in a very real, final sense. Reason cannot guarantee that their sacrifice will be "balanced" in any cosmic ledger. Acting morally becomes, in these conflict cases, an act that may be *contrary* to one's rational self-interest.
  *   **Sidgwick's Pessimistic Conclusion:** Sidgwick himself acknowledged this starkly in later editions of *Methods* and his memoirs. He saw the failure of psychical research as leaving ethics in a state of "fundamental contradiction," a "chaos" where the cosmos offers no guarantee that virtue and happiness coincide. He described his life's work as ending in "failure" on this crucial point.
  *   **The "Cosmic Bookkeeping" Question:** Your friend's point about morality making more sense with cosmic bookkeeping hits the nail on the head *from the perspective of resolving the dualism*. Sidgwick *agreed*. His whole psychical research endeavor was an attempt to *prove* such bookkeeping existed. Its failure means morality (specifically, demanding altruistic self-sacrifice on utilitarian grounds) *doesn't* get that rational guarantee from the universe. It has to stand on its own, vulnerable feet.

  **Conclusion: Sidgwick's Legacy and Your Debate**

  Sidgwick's psychical research was absolutely integral to his philosophy, not a disconnected hobby. It was the empirical arm of his desperate attempt to solve the deepest problem he uncovered in ethics: the fundamental, rational conflict between duty to others and duty to self.

  The inconclusive results mean:

  1.  **The Dualism is Real:** Reason cannot definitively reconcile egoism and utilitarianism.
  2.  **Utilitarianism Lacks a Knock-Down Rational Foundation:** It cannot non-question-beggingly compel allegiance from someone committed to rational egoism in cases of conflict.
  3.  **Cosmic Justice is Empirically Unproven (for Sidgwick):** There is no discovered empirical mechanism (like karma or an observable afterlife) guaranteeing moral balance. Decent people *can* rationally be seen as vulnerable to "getting shafted" in a purely naturalistic universe.
  4.  **Morality's Vulnerability:** Utilitarian morality, demanding sacrifices for the greater good, operates without a cosmic safety net. Its appeal rests on accepting the intrinsic value of the general good, even when it costs the individual everything, with no guaranteed recompense.

  Your friend is right that morality *makes more intuitive sense* with cosmic bookkeeping – Sidgwick desperately wanted to prove it existed precisely for that reason. But you are right that Sidgwick's failed quest demonstrates the terrifying implication of its absence for a purely rational foundation of utilitarianism: **without cosmic justice, the demand for self-sacrifice remains, in the final analysis, a rational leap of faith, not a logically inescapable conclusion.** Sidgwick's greatness lies in his ruthless honesty in facing this bleak possibility.
