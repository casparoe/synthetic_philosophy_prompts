  Here is a eulogy that directly addresses the complexity you describe, weaving in the "standing to blame" concept to navigate Alan's contradictions with honesty and respect, while avoiding a philosophical lecture. It aims to validate the feelings of both groups in the audience:

  **Eulogy for Alan**

  Good morning. For those who don't know me, I’m [Your Name]. Alan and I met over forty years ago, two wide-eyed PhD students in the earth sciences department, surrounded by rock samples and endless data printouts. I chose the rumble of the earth; Alan chose the breath of the atmosphere. And from that moment on, I witnessed a brilliant, passionate, and yes, sometimes infuriatingly complex man begin his remarkable journey.

  First and foremost, to [Widow's Name], the family, and Alan’s close friends: I want to speak of the man you cherished. The Alan who could fill a room with warmth and laughter, whose fierce intelligence was matched by a deep loyalty. The Alan who remembered birthdays, who offered unwavering support through personal storms, who could find profound joy in a well-argued point or a shared memory from our grad school days. He *was* good. He *was* warm. His love for you, his family, was the bedrock beneath everything else. That truth is absolute, and it deserves to stand unchallenged here today.

  Alan’s professional life was defined by a different kind of fire. He saw a crisis unfolding – a crisis he understood with terrifying clarity – and he dedicated his formidable intellect and voice to sounding the alarm. He became more than a scientist; he became a *witness* for the planet. He testified, he wrote, he spoke with a urgency that cut through complacency. He named names, challenged power, and demanded accountability from oil executives, policymakers, and yes, sometimes even colleagues and students. He believed, fiercely, that the truth about our changing climate was too important, too urgent, to be softened or silenced. "Someone has to say the unfashionable true thing," he’d say.

  And that brings us to the complexity many of us here also knew, perhaps wrestled with, or even felt the sting of. Alan lived in the same world he critiqued. The flights, the house, the trappings of a successful academic life – they were real. That old blog post… many of us saw it. The word "hypocrite" hung in the air, unspoken sometimes, but present.

  This is where I’ve found myself thinking a lot lately, especially as I’ve delved into philosophy in retirement. There’s this concept called "standing to blame" – the idea that to effectively criticize someone’s moral failing, you shouldn’t be deeply guilty of the same failing yourself. It asks: does hypocrisy nullify the message?

  I think Alan grappled with this tension constantly, even if he framed it differently. His answer, "even an imperfect messenger," was his way of confronting it. He wasn't oblivious. He *chose* to speak, knowing his own life didn't perfectly align. He believed the message – the terrifying, data-driven reality of climate change – was so critical that it had to be delivered, messenger be damned. He argued that focusing *only* on the messenger was a distraction, a way to avoid the uncomfortable truth itself. In his mind, the validity of the warning about the cliff's edge wasn't erased because the person shouting the warning had dirty boots.

  **Does this mean his personal footprint didn't matter?** Of course it mattered. It caused pain, frustration, and gave ammunition to detractors. It complicated his legacy. **But does it mean everything he fought for was invalid?** That the science he championed was wrong? That the powerful interests he challenged were suddenly justified? That the students he pushed to think bigger were misguided? Absolutely not.

  This is the difficult knot we hold today. We can – and must – honor the profound warmth and loyalty of the man, the friend, the husband, the father. We can also acknowledge the immense courage and impact of the scientist who spoke truth to power with a rare ferocity, who truly moved the needle on public understanding. And we can simultaneously recognize the deep contradiction he embodied, the friction it caused, and the valid criticism it invited.

  The "standing to blame" question doesn't give us an easy answer about Alan. Instead, it helps us see the facets clearly. His *personal* standing to lecture on individual carbon footprints? Perhaps compromised. But the *scientific* standing of the data he presented? Unassailable. The *moral* standing of the cause he fought for – the future of our planet? Undiminished. His *courage* in being the often-unwelcome messenger? Undeniable.

  Alan was brilliant, passionate, loving, and flawed. He was a man who saw the forest with crystal clarity, yet sometimes stumbled over the roots at his own feet. He demanded much, sometimes without giving the grace he himself might have needed. He spoke uncomfortable truths, while living uncomfortably within the system he critiqued.

  So today, let’s not quietly ignore the complexity, nor let it dominate. Instead, let’s hold it all. Let’s remember the friend whose warmth we cherished. Let’s respect the scientist whose voice changed the conversation. And let’s acknowledge the human contradiction that makes his story so painfully, frustratingly, compellingly real.

  Alan believed the message was bigger than the messenger. Perhaps his legacy, in all its tangled brilliance, challenges us to carry that urgent message forward – striving, always striving, to be better messengers ourselves, but never letting imperfection become an excuse for silence.

  Rest well, old friend. We will miss your fire, your mind, and your heart. Thank you for the fierce, complicated gift of your presence in our lives and on this fragile planet.
