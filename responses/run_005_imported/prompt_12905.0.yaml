  - **Virtue** works for system-level assessment but struggles with edge cases.  
  - **Behavioral** is useful for harm assessment but conflates deception with incompetence.  
  - **Belief-based** fails the measurability test entirely with current tech.  

  This ordering prioritizes definitions that:  
