  First, I need to recall Nozick's argument. He starts with a just distribution (D1), like equality. Then Wilt Chamberlain gets 25 cents from each fan voluntarily, leading to D2. Nozick claims D2 is just because it arose from voluntary transfers without coercion. His point is that liberty disrupts patterns, so enforcing patterns requires constant interference.

