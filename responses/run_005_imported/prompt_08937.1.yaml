prompt: |-
  So I fell down a Hacker News rabbit hole last night after someone posted that Aeon essay about Godel's letters to his mother, the ones where he actually lays out an argument for why he believed in an afterlife. I did a CS degree and went through the obligatory "read half of Godel, Escher, Bach and pretend you finished it" phase in college, so I know the incompleteness theorem well enough to explain it at a party (there are statements that are true but can't be proven from inside a given formal system, roughly), and my gut reaction to the mom letters was: oh, this is obviously just him extending his own theorem one level up. Like, the physical world is the "formal system," and the afterlife is the "true but unprovable" statement that has to hold anyway even though it can't be derived from the axioms of physics - the soul as a Godel sentence, basically.

  But the more I try to actually spell it out, the less sure I am I can make the mapping work. Which part of the real proof is supposed to be doing the work that the "human potential never gets fully realized in one lifetime" bit is doing in his letters - is that the diagonalization step, or is it more like the situation where you need a strictly stronger meta-theory to prove a system's consistency (i.e. you need a "bigger" world to vouch for this one)? Every version of incompleteness I've ever seen is about arithmetic and computability, so I guess what I'm asking is: is he genuinely reusing the same logical machinery to argue for the afterlife, or is "true but unprovable" just doing metaphorical work there and I'm overfitting two unrelated cool-Godel-facts onto each other? And if it's the second thing, what was his actual argument, and does it have any real connection back to the math he's famous for, or is that basically a seperate Godel?
