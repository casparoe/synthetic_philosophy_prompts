  First, I need to recall the core tenets of HOT. The theory claims conscious states require a higher-order thought about being in that state. Key criticisms include targetless HOTs (where a false HOT creates a conscious experience without a corresponding state) and the regress problem (if HOTs need to be conscious, it leads to infinite regress; if unconscious, how do they confer consciousness?).

