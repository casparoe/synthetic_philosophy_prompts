  I should structure questions to build logically: start with targetless and regress as foundational issues, then move to empirical challenges (neuroscience, animals), and end with theory abandonment. Each question needs a concise follow-up that preempts deflection. The tone should be respectful but probing, avoiding jargon to keep the podcast accessible. 

