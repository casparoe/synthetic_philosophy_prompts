answer: |-
  You've hit on one of the most profound and enduring controversies in physics and philosophy! Your reading of Newton is astute, and your confusion is absolutely justified. Newton *is* trying to have it both ways, and this tension is precisely what sparked centuries of debate, culminating in Mach's critique and Einstein's relativity. Here's a breakdown of the logic, the problem, and why it matters:

  1.  **Newton's Core Argument (Reconstructed):**
      *   **Stage 1 (Relative Rest, Absolute Motion):** Water & bucket spinning *together* (relative motion between them is zero). Water is concave.
      *   **Stage 2 (Relative Motion, Absolute Rest):** Water & bucket at rest *relative to each other* (or moving slowly relative). Water is flat.
      *   **The Key Observation:** The shape of the water (concave vs. flat) depends *not* on the relative motion between the water and the bucket (which is zero in both Stage 1 *and* when they are spinning together at constant speed), but on something else.
      *   **Newton's Conclusion:** That "something else" is the water's motion relative to **absolute space**. The concave shape is a physical manifestation ("endeavour to recede") proving the water has "true and absolute circular motion" *in* this absolute, immovable space. The effect (centrifugal force) reveals the absolute motion.

  2.  **Your Insight is Spot On - The Problem:**
      *   **The Invisibility Problem:** Newton explicitly states that the "parts of that immovable space... do by no means come under the observations of our senses." We cannot see it, touch it, or interact with it *directly*.
      *   **The Inference Problem:** All we observe is the *effect* (water climbing the sides). Newton *infers* that this effect must be caused by motion relative to absolute space.
      *   **The Logical Gap:** How can we *know* the effect is caused by motion relative to an *undetectable* entity? Isn't this just defining the cause by the effect? Couldn't the effect have a *different* cause that doesn't require undetectable space?
      *   **"Having it Both Ways":** Yes, Newton is essentially saying: "Here is a physical effect (A) that proves the existence of (B). However, (B) is fundamentally undetectable *except* through effects like (A)." This is circular reasoning. He uses the effect to define the existence of absolute space, and then uses absolute space to explain the effect. It *is* a weak spot.

  3.  **Why Newton Felt Forced Into This:**
      *   **Rejecting Pure Relativism:** Newton saw that defining motion *only* as relative to other visible objects didn't work. In the bucket, when water and bucket spin together relative to the lab/observer, there's no relative motion between water and bucket *or* (in a simple setup) necessarily obvious relative motion to a nearby object that explains the force. What is the water "pushing against" to climb the walls? He argued it *must* be pushing against space itself.
      *   **The Need for Inertia:** His laws of motion require an inertial frame – a state of true rest or uniform motion. Absolute space provided this ultimate, universal reference frame against which true acceleration (like the water's rotation) could be defined.

  4.  **The Historical Controversy & Mach's Challenge:**
      *   **Leibniz & Others:** Newton's contemporaries (like Leibniz) immediately attacked the concept of absolute space as unobservable and metaphysically dubious. If it has no observable effect *except* the one it's invoked to explain, is it necessary?
      *   **Ernst Mach (Late 19th Century):** This is where your friend's hint about relativity comes in. Mach delivered the most famous critique. He argued:
          *   The water's concavity isn't caused by motion relative to *absolute space*.
          *   It's caused by motion relative to **the fixed stars and the rest of the matter in the universe**.
          *   Imagine the bucket experiment done in an *otherwise completely empty universe*. Mach argued that in such a universe, the water *would not* become concave when spun. There would be no centrifugal force because there's nothing for the water to be rotating *relative to* that matters physically. The distant stars aren't just markers; they somehow *participate* in determining inertia (via some unknown physical interaction, perhaps gravitational).
          *   **Mach's Principle:** The inertia of an object (its resistance to acceleration) arises from its interaction with the totality of mass in the universe. Acceleration is only meaningful relative to the distant masses.

  5.  **Einstein and General Relativity (GR):**
      *   **The Connection:** Mach's critique deeply influenced Einstein as he developed GR. He wanted a theory where inertia *was* related to the distribution of mass-energy in the universe.
      *   **The Resolution (Sort Of):** GR provides a sophisticated answer:
          *   **No Absolute Space:** Spacetime is dynamic and curved by matter/energy. There is no fixed, immovable background space.
          *   **Acceleration is Absolute (in a sense):** In GR, you can definitively tell if you are accelerating (like the water in the bucket) *without* needing an absolute background. An accelerometer (or your body feeling g-forces, or the water climbing the walls) tells you directly. This acceleration is measured relative to **local freely-falling frames** (the paths objects take under gravity alone, like astronauts in orbit).
          *   **Machian Influence, but Not Perfect:** GR incorporates Machian ideas. The distribution of mass-energy *does* influence the local inertial frames (e.g., rotating masses like the Earth drag spacetime slightly, affecting gyroscopes - "frame-dragging"). However, GR doesn't fully satisfy Mach's Principle in all scenarios (e.g., solutions exist for rotating universes where local inertia exists even without distant masses). The debate about "how Machian is GR?" continues.

  **Answering Your Core Question:**

  *   **Is there a step you're missing?** Not really. You've identified the core problem brilliantly: Newton infers an undetectable entity (absolute space) from an observable effect (concave water), but provides no *independent* way to detect or interact with that entity. This *is* a genuine logical weak spot and a profound epistemological problem (how do we know things we can't observe?).
  *   **Is this a genuine weak spot argued about for ages?** **Absolutely YES!** It's one of the most famous controversies in the history of physics and philosophy of science. Newton's argument was powerful but unsatisfying. Mach highlighted the flaw compellingly. Einstein's GR provided a new framework that eliminated absolute space and offered a different explanation for the bucket phenomenon (local acceleration relative to local inertial frames defined by gravity/mass), though the full connection to Mach's ideas remains nuanced.

  **In essence:** Newton used the bucket to argue for the *reality* of absolute motion and the existence of absolute space as its arena. The water's climb was his "detector" for absolute rotation. However, his admission that space itself is undetectable exposes the circularity: the *only* evidence *for* absolute space is the very effect it's invoked to *explain*. This weakness wasn't lost on his critics and ultimately drove the development of theories (Mach's ideas, then GR) that sought to explain inertia and acceleration without needing an invisible, undetectable, absolute background. Your buddy is right that this controversy set the stage for relativity, but you're also right to see the logical tension at the heart of Newton's original argument.
