  I should break down why Newton felt forced to this conclusion. He saw that relative motion alone couldn't explain the concave water—since when the water and bucket move together, there's no relative motion, yet the curve happens. So he postulated absolute space as a reference. But the undetectability is indeed a problem. Mach later argued that the distant stars could provide the reference frame, influencing the water via some interaction. And Einstein's relativity resolved it by making acceleration absolute but relative to other masses.

