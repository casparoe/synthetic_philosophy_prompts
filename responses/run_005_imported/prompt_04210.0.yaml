  Their determinism point is powerful too: if determinism "masks" abilities globally, doesn't that collapse the distinction? The best response might be that new dispositionalists define abilities constitutively (intrinsic properties) whereas determinism would alter those properties. But this risks making abilities mysterious abstract entities.

