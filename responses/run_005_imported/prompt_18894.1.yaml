  Okay, this is a genuinely stressful committee case and I'd love a good first draft to work from instead of my own. Quick context: I'm a PhD student in philosophy (my dissertation is actually about when and why informal commitments end up binding people, so this case is uncomfortably close to home) and this year I got elected as the grad rep on my department's Graduate Appeals & Fairness Committee, which meets tuesday.

  Here's the case. A 4th-year, I'll call her Jess, was recruited two years ago by our former chair, who left for a job at another school the following year. Over two emails and a long phone call, he told her she had "my personal guarantee" of five full years of funding and a slot with a specific, well-funded advisor — he even said something like "obviously I can't put this in the official letter because of university policy, but you have my word" — and on the strength of that Jess turned down a rival offer that did come with a written 5-year guarantee, and moved across the country, quitting a stable job to do it. Her actual signed funding letter, like everyone's, just says funding is "renewable annually contingent on progress and available funds," boilerplate nobody reads twice. Now a training grant the department was counting on has fallen through, the new chair says the department is only bound by whats on paper, full stop, and wants to cut Jess's funding starting next year. About half the committee wants to deny the appeal outright, on the grounds that hallway-and-email assurances basically can't be institutionally binding (otherwise every offhand promise becomes de facto department policy); the other half thinks Jess was given a specific, intentional assurance, relied on it in a costly and foreseeable way, and that the department doesn't get to shed an obligation just because the guy who created it isn't around anymore. Our committee's charter technically lets us grant "equitable relief where no formal entitlement exists," which feels like it's more or less asking us to decide whether that's ever actually a real thing or just a nice phrase.

  Sorry for the wall of text, wanted to get the facts exactly right. Could you draft the short memo I'd bring to the meeting? I need it to land on one concrete recommendation — full funding, some specific negotiated partial amount, or deny — with an actual timeline attached, and I want the case against Jess argued for real, not as a strawman for me to knock down, since that's the side I'm worried the committee, and honestly me, will steamroll.
