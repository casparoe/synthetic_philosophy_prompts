  First, I need to break down their arguments step by step. Rachel's point about the non-formal parts of Frege's philosophy being influenced by his temperament makes sense. If someone is pushing for purity in logic and also in politics, maybe that's not a coincidence. But Dan's genetic fallacy argument is strong too—just because he was a bigot doesn't mean his ideas about sense and reference are wrong. 

