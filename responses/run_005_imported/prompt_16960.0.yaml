  Using Douglass's method, he'd focus solely on the text. "Subject to the jurisdiction" would be interpreted as owing allegiance to U.S. laws, which undocumented immigrants do by residing within the territory. He'd likely dismiss framers' intent or current political debates as irrelevant, just as he did with slavery. His universalist views would reinforce that birthright shouldn't depend on parents' status, aligning with natural rights principles.

