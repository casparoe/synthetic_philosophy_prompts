  The user mentions two key speeches: the 1860 Glasgow speech where Douglass argues the Constitution isn't inherently pro-slavery when read textually, and the "Composite Nation" speech advocating for universal rights, including for Chinese immigrants. They point out that Douglass died before the Wong Kim Ark case, which affirmed birthright citizenship for children of immigrants, even those ineligible for naturalization. The user's term paper aims to reconstruct what Douglass would argue about current birthright citizenship debates using his textualist approach and universalist principles, rather than just assuming he'd side with immigrants.

