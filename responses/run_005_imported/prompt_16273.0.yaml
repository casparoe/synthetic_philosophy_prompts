  For part (a), the attacker's transaction validity. Hart would focus on the code as the rule of recognition. Since the exploit followed the code, it's valid, regardless of intent. Fuller would argue that if the code allowed such an exploit, it fails clarity, non-contradiction, and congruence with purpose. So for Fuller, it's not valid law.

  Part (b) is about the hard fork. Hart might see it as a retroactive rule change, which he accepts if done openly as penumbral judicial law-making. The fork was contentious but transparent, so possibly legitimate. Fuller would view the fork as restoring congruence between rules and purpose, aligning with internal morality. The retroactivity is problematic, but necessary to correct a system failure.

