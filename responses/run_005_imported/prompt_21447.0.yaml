answer: |-
  Here’s a toast weaving Plato’s wisdom into your friend’s milestone, balancing the two worlds and ending on your appointed role:

  **(Raise your glass, clear your throat, smile warmly at the guest of honour, then the room)**

  "Friends, runners, countrymen… lend me your ears! We gather tonight to celebrate a significant crossing: [Friend's Name] has reached the fabled shores of forty!

  Now, forty is one of those ages that gets a lot of press. ‘Over the hill’? Please. If the hill is the one [Friend's Name] conquers before breakfast on a Saturday, I think we know who’s winning. No, I was hunting for something… deeper. Something worthy of a man whose discipline these past years – swapping late nights for early miles, pints for protein shakes – has been genuinely inspiring. *(Nod sincerely towards the running club contingent)*.

  And oddly enough, I found it in the unlikeliest of places: Plato’s *Laws*. Yes, *that* Plato. Turns out, the old philosopher had some surprisingly specific thoughts on birthdays. Specifically, the big Four-Oh.

  Plato argued – stick with me here – that wine has a purpose. For boys? None. Early adulthood? Strict moderation. But at forty… ah, at forty, Plato believed a man earned a certain *license*. Not to collapse into a puddle, mind you, but to drink freely, to get properly merry at feasts like this one. His reasoning? Twofold.

  First, he figured the ‘crabbedness of old age’ starts setting its hooks around now. A bit of communal cheer, he thought, is the best counter-irritant. *(Wink)*. Second, and more wonderfully, he believed wine loosens the shame that otherwise keeps respectable gentlemen like our friend here from… well, singing badly and dancing enthusiastically alongside the young. He saw it as a social lubricant for the soul.

  But here’s the crucial, serious bit underneath Plato’s tipsy surface: he didn’t see this as mere indulgence. He saw a *properly supervised* drinking party – key word, *supervised* – as a genuine test of character. Like facing danger tests courage, navigating a bit of festive excess, Plato argued, tests your self-command. Your moderation *within* the merriment. It reveals your true nature. And that’s precisely why, he insisted, it *must* be supervised – not left to chaos.

  So, [Friend's Name], as you cross Plato’s designated threshold, we look at you with immense admiration. We, your university comrades *(gesture to the old crowd)*, remember vividly the legendary stamina of your twenties – the nights you were the last beacon of revelry. And we, your newer friends from the track and trail *(gesture to the running club)*, have witnessed the incredible focus and discipline that replaced it.

  Plato grants you this license at forty not as an invitation to regress, but as a recognition of your earned maturity. It’s permission to embrace the *spirit* of the feast – the laughter, the connection, the potential for terrible karaoke – without needing the old extremes. It’s about proving, as you have in so many other ways, that true strength lies in balance, in knowing yourself, and in the joyful participation in life’s celebrations.

  And so, we raise our glasses to you, [Friend's Name], on your fortieth. May you embrace Plato’s prescribed merriment with the same wisdom and grace you bring to every mile run and every challenge faced. May your spirit always be young enough to find joy, and your self-command always be strong enough to know your limits.

  But before we drink… Plato was absolutely adamant about one thing: this whole civilized experiment in festive testing requires one crucial element. One person must stay sober, keeping a watchful eye, ensuring the revelry stays true and the character-testing doesn’t devolve into furniture-breaking. *(Pause, look pointedly at your own glass of water/soda, then back at the room with a grin)*.

  …Lucky for you all, that’s apparently *my* job tonight. Consider yourselves officially supervised.

  To [Friend's Name]! May your forties be your most joyful, balanced, and philosophically sound decade yet!"

  **(Clink glasses and drink!)**

  **Why this works:**

  1.  **Plato Front and Center:** Uses his specific reasoning (age threshold, countering crabbedness/shame, the test of self-command, need for supervision).
  2.  **Respects Both Worlds:** Acknowledges the past stamina ("legendary") without glorifying it or pressuring a return. Sincerely praises the current discipline ("inspiring," "incredible focus").
  3.  **Reframes "License":** Shifts from "start drinking again" to "embrace the *spirit* of the feast" and "joyful participation," emphasizing balance and wisdom earned.
  4.  **Humour:** Gentle nods to past/present contrast ("swapping late nights for early miles"), "crabbedness," "terrible karaoke," "furniture-breaking." The self-deprecating "lucky for you all" lands the supervision joke perfectly.
  5.  **Ends on Your Role:** Gracefully incorporates Plato's requirement for a sober supervisor, making your role the punchline and a reassuring note.
  6.  **Tone:** Warm, affectionate, intelligent, celebratory, and slightly witty – fitting for both crowds.
  7.  **Length:** Structured for a 3-4 minute delivery with natural pauses and emphasis points.
