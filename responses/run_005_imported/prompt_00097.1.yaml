prompt: |-
  I've been sitting in on a reading group that's slowly working through the decision-theoretic literature on Pascal's Wager, and last week's session left me stuck on something the facilitator only gestured at. We spent most of the time on the standard objections—the many-gods problem, worries about whether infinite utility even makes sense as an input to expected value calculations, mixed strategies—but almost no time on what falls out the other side once you take the wager's underlying logic seriously as a general-purpose decision rule rather than a one-off argument about religious belief.

  What I'm after is this: if you grant the wager's core structure (an option with tiny or unknown probability but unbounded payoff should dominate your decision-making regardless of how implausible it seems), what does that commit you to in domains far removed from theology? I'm thinking about things like existential risk charities that promise astronomically large payoffs, weird longtermist cause areas, or even personal choices where someone claims a small chance of infinite or vast reward. Please lay out the most important implications of accepting Pascal's Wager-style reasoning as a legitimate general principle—both for how we'd have to structure our practical decision-making across unrelated domains, and for what it would reveal as unstable or self-undermining about the reasoning itself. I'd like the answer to go beyond "it's a hasty generalization" and actually trace through what happens to ordinary decision theory once this kind of argument is treated as valid.
reasoning: |-
  Okay, let's start by unpacking the user's query. They've been part of a reading group on Pascal's Wager and are stuck on the implications of applying its logic beyond theology. The facilitator only gestured at this, so the user wants a deep dive into what happens when you treat the wager as a general decision rule.

  First, I need to recall Pascal's Wager's core structure: tiny probability but infinite payoff dominates decision-making. The user mentions existential risks, longtermism, and personal choices with vast rewards. They want the implications for practical decision-making and any self-undermining aspects of the reasoning.

  The user's explicit request is for the consequences of generalizing Pascal's logic. But their deeper need might be understanding if this reasoning is viable or if it collapses under scrutiny. They might be looking for arguments to critique or defend such reasoning in academic discussions.

  I should start by formalizing the decision rule. Using expected utility with infinite values leads to dominance by any option with non-zero probability of infinity. Then, apply this to different domains: existential risks (e.g., asteroid deflection), weird longtermist causes (simulating minds), and personal choices (cults promising salvation). 

  Next, the practical implications: how this would monopolize resources. Every dollar would go towards preventing extinction or similar high-stakes bets. Charities focused on finite benefits become irrational. Personal life decisions would prioritize any action with a tiny chance of infinite payoff, leading to absurd choices like joining multiple conflicting groups.

  Then, the instability of the reasoning. The Many-Infinity Problem: multiple conflicting infinite claims. How can one choose between them? Also, if every small action has a potential infinite impact (butterfly effect), decision paralysis ensues. Plus, the problem of fanaticism—ignoring large finite harms for infinitesimal chances at infinity.

  The user probably wants to see how this affects standard decision theory. Expected utility breaks with infinite payoffs. Also, Dutch book arguments show inconsistency. Plus, the epistemological issue: how to assign non-zero probabilities to all untestable claims, leading to gullibility.

  I should also address whether there's any way to salvage this, like using hyperreals or discounting certain infinities. But conclude that without constraints, the framework is self-defeating and paralyzing. The user needs to see both the practical monopolization and theoretical inconsistencies clearly.
answer: |-
  You've pinpointed the fundamental instability of Pascal's Wager (PW) when elevated from a theological curiosity to a general decision principle. Accepting its core logic – **that any action with a non-zero probability of producing unbounded positive utility (finite but vast, or truly infinite) must dominate rational choice, regardless of how vanishingly small that probability is** – profoundly reshapes decision theory and practical reasoning, leading to paradox, paralysis, and self-undermining conclusions. Here's a systematic breakdown of the implications and instabilities:

  **I. The Core Principle Formalized:**

  *   **Expected Utility (EU) with Infinities:** PW relies on EU calculations where EU = Σ [P(outcome) * Utility(outcome)].
  *   **Infinity Dominance:** If *any* outcome in *any* act has Utility = +∞ and P(outcome) > 0 (no matter how small), then EU(act) = +∞.
  *   **Principle of Dominance:** Any act with EU = +∞ dominates any act with finite EU, regardless of the probabilities or utilities of *other* outcomes associated with either act.
  *   **Generalized PW Principle (GPWP):** "In any decision involving at least one option with a non-zero subjective probability of yielding unbounded positive utility (infinite or sufficiently vast finite), that option must be chosen over any option offering only finite utilities, irrespective of the apparent plausibility of the unbounded-utility scenario or the costs incurred in pursuing it."

  **II. Practical Implications: The Monopolization of Resources & Attention**

  GPWP forces an extreme, all-consuming focus on any path claiming a non-zero chance of unbounded payoff:

  1.  **Existential Risk (X-Risk) Mitigation as Paramount:**
      *   Preventing human extinction (or ensuring a vast, flourishing future) offers potentially astronomical (effectively infinite) future utility. GPWP demands dedicating *all available resources* to reducing X-risk by even the tiniest plausible amount, as long as P(success) > 0.
      *   **Consequence:** Charities addressing current suffering (disease, poverty) become irrational investments unless they *also* demonstrably reduce X-risk. Funding cancer research loses out to funding asteroid deflection or AI safety research, even if the latter seems far-fetched and the former saves millions *now*. Current generations become sacrificial to potential future ones.

  2.  **The Proliferation of "Weird Longtermist" Cause Areas:**
      *   Any intervention claiming a tiny chance of steering the future towards an astronomically positive trajectory (e.g., promoting specific moral philosophies, seeding space with life, developing ancestor simulations, ensuring "digital sentience rights") becomes a mandatory investment under GPWP.
      *   **Consequence:** Rational decision-makers must spread resources infinitesimally thin across *every* proposed pathway to vast future value that can't be definitively assigned P=0. Distinguishing credible from crackpot theories becomes pragmatically irrelevant; *any* non-zero probability claim demands *some* investment.

  3.  **Personal Life Choices & Cult Dynamics:**
      *   Joining a group promising eternal bliss (even if seemingly absurd) or a guru offering enlightenment becomes rational if you assign it P>0. Sacrificing career, relationships, and wealth is justified for a vanishingly small shot at infinite reward.
      *   **Consequence:** GPWP incentivizes the creation of "infinite reward" narratives. Rational agents become vulnerable to any scheme offering a non-zero chance of vast payoff, leading to exploitation and the abandonment of finite but significant goods (health, family, stable income).

  4.  **Paralysis Through Option Overload:**
      *   The set of actions with *some* conceivable (even wildly speculative) path to vast future value is enormous. GPWP demands considering *all* such actions with non-zero subjective probability.
      *   **Consequence:** Decision-making grinds to a halt under the weight of evaluating an infinite (or near-infinite) set of "infinite stakes" options. Choosing *which* X-risk charity or which salvation path to fund becomes computationally intractable and arbitrary.

  **III. Instabilities & Self-Undermining Consequences:**

  GPWP doesn't just reshape priorities; it collapses under its own logic:

  1.  **The "Many Infinities" Problem (Generalized):**
      *   Theology: Why choose Christianity over Islam, Hinduism, or the possibility that a hitherto unknown god rewards skeptics?
      *   **Generalized:** Why mitigate AI risk instead of asteroid risk? Why fund Simulation Ethics instead of Anti-Memetic Warfare research? Why follow Guru A promising bliss through asceticism over Guru B promising bliss through hedonism?
      *   **Instability:** GPWP offers *no rational way to choose between competing "infinite utility" options*. Each has EU = ∞. Standard decision theory breaks down. Choice becomes arbitrary or based on non-rational factors (aesthetics, inertia, framing), *undermining the rationality GPWP claims to provide*.

  2.  **The "Fanaticism" Problem & Negligible Probabilities:**
      *   GPWP forces you to accept potentially ruinous costs for negligible gains in probability. Should you donate 99% of your income to a dubious X-risk charity claiming a 0.0000001% chance of saving 10^50 future lives? GPWP says "yes," sacrificing near-certain finite welfare for an infinitesimal chance at infinity.
      *   **Instability:** This leads to fanaticism – ignoring large, near-certain finite harms (starvation, suffering) for minuscule chances at vast gains. This violates deeply held intuitions about proportionality and risk aversion, making the principle practically and psychologically unsustainable. It also makes you vulnerable to extortion by anyone threatening an infinite negative outcome unless paid off (Pascal's Mugging).

  3.  **The Epistemic Black Hole (Assigning P>0):**
      *   GPWP relies crucially on the decision-maker assigning a *non-zero* subjective probability to the unbounded payoff scenario. How are these probabilities assigned?
      *   **Instability:** To avoid paralysis, one must assign P=0 to *most* conceivable infinite-payoff scenarios. But GPWP provides *no rational criterion* for doing so. Assigning P>0 to *everything* leads to paralysis (Point II.4). Assigning P>0 only to "plausible" scenarios reintroduces the very subjective "plausibility" judgments GPWP was supposed to override. The principle lacks an internal epistemology for managing the space of possibilities.

  4.  **Infinite Regress & Butterfly Effects:**
      *   If *every* action has *some* conceivable (however complex and attenuated) causal chain leading to an astronomically good or bad outcome (the butterfly effect on steroids), then *every* action has EU = ±∞.
      *   **Instability:** This reduces decision-making to complete paralysis. If saving a child or eating a sandwich both have non-zero P of triggering cosmic salvation or doom, *no* finite-utility comparison is possible. GPWP, taken universally, destroys the possibility of making *any* decision based on finite consequences.

  5.  **Self-Undermining of Value:**
      *   Pursuing GPWP necessitates sacrificing almost all finite goods (relationships, art, comfort, immediate welfare) for the gamble on infinity.
      *   **Instability:** If the "infinite reward" never materializes (which, by definition of tiny probability, it almost certainly won't for any *specific* bet), the agent has sacrificed a potentially rich finite life for nothing. The *pursuit* of infinite value under GPWP systematically destroys the finite value that makes human life meaningful *now*, rendering the quest self-defeating if the wager fails (which it likely will).

  6.  **Formal Decision Theory Breakdown:**
      *   **Infinities Break EU:** Standard EU maximization is undefined or leads to contradictions when comparing multiple infinite expectations. GPWP forces this situation constantly.
      *   **Dutch Books:** Agents following GPWP can be made vulnerable to Dutch Books (sets of bets guaranteeing loss). E.g., They might pay a small fee to avoid a tiny risk of infinite loss (Mugging), but also pay to avoid *other* tiny infinite losses in ways that collectively guarantee a large finite loss.
      *   **Inconsistent Action:** GPWP might demand simultaneously funding two mutually exclusive "salvation" paths (e.g., two conflicting religions or X-risk strategies), which is impossible.

  **IV. Can it Be Salvaged? (Briefly)**

  Attempts to constrain GPWP highlight its fragility:

  *   **Hyperreal Utilities:** Using non-standard analysis (infinitesimals) allows "grading" some infinities. This is highly technical, non-intuitive, and doesn't solve the Many Infinities or Epistemic problems.
  *   **Discounting Wild Speculation:** Assigning P=0 to "crazy" scenarios. But this requires the subjective plausibility judgments GPWP sought to bypass. Who defines "crazy"?
  *   **Capping Utilities:** Rejecting true infinity, using vast but finite payoffs. This mitigates but doesn't eliminate fanaticism for sufficiently large finite stakes, and abandons the original PW logic.
  *   **Decision Rules for Incomparable Utilities:** Using lexicographic orders or other non-EU rules. These are complex and often lack the axiomatic foundations of EU.

  **Conclusion:**

  Treating Pascal's Wager as a general decision principle (GPWP) is profoundly destabilizing. It demands the sacrifice of all finite goods for any non-zero chance of infinite gain, leading to:
  1.  **Monopolization:** Resources are sucked into any venture claiming vast future payoffs, starving present needs and finite-benefit projects.
  2.  **Paralysis:** Decision-making collapses under the weight of innumerable competing "infinite" options and the butterfly effect problem.
  3.  **Arbitrariness:** No rational way exists to choose between conflicting infinite-utility claims.
  4.  **Fanaticism & Exploitation:** Agents become willing to accept ruinous costs for negligible probability gains, making them vulnerable to manipulation.
  5.  **Epistemic Collapse:** Assigning non-zero probabilities rationally to speculative scenarios is impossible within the framework.
  6.  **Formal Breakdown:** Standard decision theory cannot handle the infinities GPWP constantly invokes.

  Ultimately, GPWP is self-undermining. Its relentless pursuit of infinite stakes systematically destroys the finite values that constitute a meaningful human life in the present, all for a gamble that, by its own probabilistic admission, is overwhelmingly likely to fail for any specific path chosen. While it powerfully highlights the theoretical impact of low-probability, high-impact events, its elevation to a general principle reveals a deep incompatibility with coherent, practical, and psychologically sustainable rational decision-making. It functions less as a viable rule and more as a *reductio ad absurdum* demonstrating the necessity of discounting sufficiently implausible scenarios or capping utilities to preserve the functionality of decision theory.
