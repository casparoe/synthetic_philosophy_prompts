  Okay, the user is working on an article about unconventional AI safety ideas, specifically interviewing a decision theorist about "surrogate goals." The core concept is using decoy objectives to protect against acausal threats—blackmail that works through prediction alone, without direct contact. The user wants interview questions that dig into the mechanics, not just restating the pitch. They specifically asked for questions addressing three key issues: whether this just creates new vulnerabilities, the importance of the threatener knowing about the swap, and the "commitment races" problem where early adopters might become targets. They also want follow-ups anticipating the interviewee's likely counterarguments.  

