  After careful consideration of the philosophical cost (i.e., counterintuitiveness or "weirdness") associated with each statement, I've ranked them from least to most costly. The ranking is based on how easily one might accept the statement without being troubled by its implications, considering factors like utility in mathematics, abstractness vs. concreteness, and directness of paradox. Here's the reasoning:

  1. **"Every vector space has a basis"** is the least costly. It's a foundational result in linear algebra with immense practical utility. While it relies on AC, it feels natural and non-paradoxical—almost like a "completeness" property for vector spaces. Mathematicians can accept this without much discomfort.

  2. **"Tychonoff's theorem for arbitrary products of compact spaces"** is highly useful in topology and analysis. Its equivalence to AC is well-known, but the theorem itself is so central (e.g., in functional analysis) that its benefits often outweigh any unease about AC. The cost is low because it feels more like a powerful tool than a paradox.

  3. **"Every surjection between sets has a right inverse"** is a direct restatement of AC in functional terms (it's equivalent to AC). It's abstract and minimal, focusing on the existence of choice functions without geometric or measure-theoretic weirdness. Philosophers might find this easier to swallow as it captures the essence of AC without immediate pathological consequences.

  4. **"Every set can be well-ordered"** is equivalent to AC and historically controversial (e.g., well-ordering the reals is counterintuitive). However, it remains largely set-theoretic and abstract. Its cost is moderate because it doesn't produce concrete "monsters" like non-measurable sets—it just feels like a strong existential claim about order.

  5. **"There's a non-principal ultrafilter on the natural numbers"** is a consequence of AC (not equivalent) with applications in logic, topology, and non-standard analysis. While abstract, ultrafilters are esoteric and their existence feels like a technical necessity rather than a glaring paradox. Still, non-principal ultrafilters are non-constructive and imply "pathological" objects, placing them higher than the more benign equivalents.

  6. **"There exists a subset of the reals that isn't Lebesgue measurable"** (e.g., the Vitali set) is a concrete consequence of AC with real mathematical impact. It directly violates the ideal that all sets should be measurable, causing issues in analysis. This feels more "real" than abstract equivalents because it breaks a desirable property of the reals, making it costlier than set-theoretic statements.

  7. **"The Banach-Tarski thing, where you cut a solid ball into finitely many pieces and reassemble them into two balls the same size as the original"** is the most costly. It's a geometric paradox that blatantly contradicts physical intuition (e.g., conservation of volume) and relies on non-measurable sets. Even though it's "just" a consequence of AC, its visceral weirdness makes it the poster child for anti-AC arguments. It imposes the highest philosophical cost by turning AC into a generator of impossibility.

