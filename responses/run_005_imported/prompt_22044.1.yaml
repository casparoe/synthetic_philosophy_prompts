answer: |-
  Here are 10 interview questions designed to move beyond standard textualism talking points, including your three specific requests with tailored follow-ups:

  1.  **Core Tenet Challenge:** Textualism often claims superiority in constraining judicial discretion and promoting democratic legitimacy by focusing solely on enacted text. Yet, critics argue that selecting *which* textual features to prioritize (dictionary definitions, grammar rules, semantic canons, structural context) is itself an exercise of discretion. How does textualism avoid simply shifting discretion from "purpose" to "textual feature selection"?
      *   *Likely Answer:* Emphasis on objective linguistic conventions, public meaning, and rejecting "judge-made" purposes.
      *   *Follow-Up:* If linguistic conventions are sometimes contested or evolving (e.g., the meaning of "because of" in *Bostock*), and semantic canons can conflict (as Llewellyn noted), doesn't the judge's choice of *which* convention or canon to apply in close cases reintroduce significant discretion, undermining the determinacy claim?

  2.  **Llewellyn's Canons & Determinacy:** Karl Llewellyn famously argued that for almost every canon of statutory construction (e.g., *expressio unius*), there exists an equally venerable counter-canon (e.g., *noscitur a sociis*). If textualism relies heavily on these canons, doesn't Llewellyn's observation fatally undermine textualism's claim to provide more determinate and objective results than purposivism or intentionalism?
      *   *Likely Answer:* Textualists use canons as linguistic guides to public meaning, not policy tools; conflicting canons reflect different linguistic realities applied contextually.
      *   *Follow-Up:* But if judges applying textualism can reasonably reach opposing conclusions using different, equally "textual" linguistic principles (as seen in circuit splits on textualist grounds), doesn't this suggest the determinacy advantage over other methods is overstated? Isn't the outcome still significantly influenced by the judge's interpretive priorities within the textualist framework?

  3.  **Absurdity Doctrine & The Purpose Line:** Textualists endorse the absurdity doctrine only for correcting *obvious scrivener's errors*, vehemently rejecting importing broader legislative purpose to avoid perceived absurd outcomes. In practice, how do textualists reliably distinguish between an "obvious drafting error" (correctable) and an "absurd result arising from unforeseen circumstances or poor drafting" (uncorrectable under strict textualism)? Where's the principled line?
      *   *Likely Answer:* The error must be truly *obvious* and *mechanical* (e.g., missing "not," clear typo), not just a policy outcome the judge dislikes. Legislative purpose is irrelevant; it's about the clear linguistic intent *of the text itself*.
      *   *Follow-Up:* Doesn't the assessment of what constitutes an "obvious" error inherently involve some judgment about the statute's *expected function* or *reasonable purpose*? For instance, if a literal reading mandates an impossible action or negates the statute's entire point, isn't the judge implicitly relying on a minimal conception of purpose to identify the "error"?

  4.  **Bostock & Textualist Purity:** Justice Gorsuch's majority opinion in *Bostock v. Clayton County* grounded its ruling in textualism, focusing on the "ordinary meaning" of "because of sex." However, prominent textualists like Justice Alito (in dissent) and scholars accused the majority of effectively engaging in disguised purposivism by ignoring the original expected application. How do you defend the *Bostock* majority's reasoning as genuinely textualist, or do you agree it crossed a line?
      *   *Likely Answer:* Defense of *Bostock* as pure textualism: It applied the ordinary meaning of the words at the time of enactment using standard tools (dictionaries, grammar), regardless of whether Congress foresaw the specific application.
      *   *Follow-Up:* If both the majority and dissent claimed textualism and used dictionaries/grammar, yet reached opposite conclusions about the "ordinary meaning," doesn't this highlight the core ambiguity within textualism – that "ordinary meaning" itself is often contested, and resolving that contestation (e.g., by prioritizing syntactic inevitability over likely original applications) involves choices that look *functional* or *purpose-driven* to critics?

  5.  **Legislative Expectations vs. Linguistic Meaning:** Textualism prioritizes the "objective" public meaning of the text at enactment over the subjective intentions or expectations of individual legislators. But isn't the "public meaning" often inextricably linked to the *context of expected applications*? How can textualism completely divorce meaning from the understood contemporary context without risking anachronistic or alien interpretations?
      *   *Likely Follow-Up Direction:* Explore a hypothetical where the literal text applies to a scenario utterly inconceivable to the enacting Congress.

  6.  **Corpus Linguistics & Objectivity:** The rise of corpus linguistics is often hailed by textualists as a tool for providing more objective evidence of ordinary meaning. However, critics argue corpus studies involve significant methodological choices (which corpora? what time frame? what search terms?) that can steer results. Can corpus linguistics truly deliver the objectivity textualism promises, or does it just add a veneer of science to interpretive choices?
      *   *Likely Follow-Up Direction:* Ask about controversies or disagreements in applying corpus linguistics in actual cases.

  7.  **Textualism and Legislative Dysfunction:** Proponents argue textualism forces legislatures to write more clearly. Critics counter that in an era of hyper-partisanship and legislative gridlock, statutes are often deliberately ambiguous compromises. Doesn't strict textualism, by refusing to consider evident legislative purpose in resolving ambiguities, effectively delegate *more* lawmaking power to courts to fill the gaps created by dysfunctional drafting?
      *   *Likely Follow-Up Direction:* Ask if this outcome is preferable to judges attempting to discern a workable purpose from messy legislative history.

  8.  **The Role of Precedent (Stare Decisis):** How does textualism reconcile its focus on the original meaning of a specific text with the doctrine of stare decisis, which often requires adhering to prior interpretations (even if arguably wrong under a textualist reading) for stability? Is textualism inherently destabilizing, or does it offer a principled way to overturn non-textualist precedents?
      *   *Likely Follow-Up Direction:* Probe the criteria for when a textualist should overturn precedent vs. adhere to it.

  9.  **Textualism Beyond Statutes:** How consistently is textualism applied across different legal texts? Are textualist principles applied with the same rigor to interpreting regulations, contracts, or even the Constitution? If not, why the difference?
      *   *Likely Follow-Up Direction:* Contrast the textualist approach to statutes vs. constitutional originalism.

  10. **The Future of Textualism:** Where do you see the most significant challenges or necessary evolutions for textualist theory in the next decade? Are there internal critiques or external developments (e.g., AI in law, changing legislative practices) that demand refinement of textualist doctrine?
      *   *Likely Follow-Up Direction:* Ask for specific examples of potential refinements or unresolved tensions within textualism.

  **Key features of this approach:**

  *   **Goes Beyond Basics:** Assumes familiarity with core textualist claims (public meaning, rejection of purpose/intent, canons) to probe underlying tensions.
  *   **Targets Your Requests:** Explicitly includes questions on Absurdity, Llewellyn/Canons, and *Bostock* with informed follow-ups anticipating common textualist responses.
  *   **Probes Internal Tensions:** Focuses on contradictions within textualism (discretion in canon choice/meaning selection, absurdity line-drawing, *Bostock* ambiguity).
  *   **Contextualizes:** Places textualism in the context of legislative reality (dysfunction) and other interpretive methods (canon conflicts).
  *   **Practical & Theoretical:** Mixes abstract theory (determinacy, objectivity) with concrete application (precedent, *Bostock*, corpus linguistics).
  *   **Future-Oriented:** Ends by asking about evolution and challenges.
  *   **Follow-Ups are Pivotal:** They are designed to push back on the most predictable defenses and expose the deeper philosophical or practical difficulties.

  Remember to actively listen to her answers and be prepared to adapt the follow-ups slightly based on the nuances of her specific responses, using these as a strong foundation. Good luck with the interview!
