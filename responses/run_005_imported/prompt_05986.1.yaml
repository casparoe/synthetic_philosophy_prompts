answer: |-
  ## Dialogue: Tuesday's Shadow

  **Setting:** The bustling lobby of a philosophy conference hotel, immediately after a talk on Williams and Parfit. Coffee cups litter nearby tables.  
  **Characters:**  
  *   **Alex:** Defends a sophisticated Williams-style internalism. Sharp, pragmatic, insists on the primacy of the agent's perspective.  
  *   **Jordan:** Leans towards Parfitian/Kantian externalism, convinced some reasons transcend contingent motivations. Thoughtful, concerned with structural rationality.  

  **(Alex is refilling their coffee when Jordan approaches.)**

  **Jordan:** Alex! Good talk. That bit about the 'sound deliberative route' needing to connect to the *agent's* motivational set, not ours... really sharp. But I kept thinking about Parfit's Tuesday guy. Doesn't he expose a crack?

  **Alex:** (Sighs, stirs coffee) Ah, Future Tuesday Indifference. The perennial thorn. Look, Jordan, I get the *weirdness*. But Williams’s point is precisely that weirdness isn’t irrationality *simpliciter*. Our Tuesday man – call him Tuesday Tom – has a quirky, stable, motivationally grounded disposition: *no care for Tuesday-future pain*. Given that’s part of his S, the *sound* deliberative route *for him* absolutely tells him to discount it. Why *shouldn’t* he? What false belief is there? What instrumental failure? He’s consistent within his own motivational framework. Our disapproval? That’s just us projecting *our* S onto him. It’s not a *reason* for *him*.

  **Jordan:** But that’s the rub, Alex. It *feels* like more than just disapproval. It feels like a *structural* failure of rationality. Imagine Tom meticulously plans a root canal for Wednesday, avoiding immense pain. But he learns it’s actually scheduled for Tuesday. He shrugs, cancels the appointment, knowing full well he’ll suffer agonizing pain *purely* because it’s Tuesday. He *knows* the pain is identical in intensity, duration, causal impact on his future selves. His discounting is *radically arbitrary*. Isn’t rationality, even *prudential* rationality, partly about non-arbitrariness? About treating like cases alike? Can a 'sound deliberative route' really sanction such blatant inconsistency across identical future states, differing only by a label?

  **Alex:** (Leans against the table, thoughtful) Okay, you’re pushing me. Maybe "soundness" isn't *just* about instrumental efficacy and avoiding false beliefs. Maybe it includes minimal coherence constraints on the *substance* of the motivations themselves? If Tom’s discounting is genuinely arbitrary – no reason *at all*, not even a weird one like "Tuesdays are unlucky" (which might connect to other S elements) – perhaps sound deliberation *would* reveal that arbitrariness *to him* as unstable under reflection? He sees that Monday pain and Tuesday pain are identical in all normatively relevant respects *for him as a future-sufferer*. Recognizing that identity *could* generate a motivation to avoid Tuesday pain via the *same* mechanism that makes him avoid Monday pain – the aversion to suffering itself. The "sound route" might involve extending his *existing* aversion-to-pain motivation consistently.

  **Jordan:** That’s interesting! So you’re stretching Williams’s ‘sound deliberative route’ to include recognizing and eliminating purely arbitrary distinctions in one’s *own* motivational set? Seeing that Tuesday pain *is* pain, just like Monday pain, and therefore *must* fall under the scope of his general pain-aversion?

  **Alex:** Potentially. It’s not importing an *external* value ("Pain is bad!"). It’s exploiting an inconsistency *within his own S*. His S contains "avoid future pain (except Tuesdays)" *and* a general aversion to the phenomenal quality of pain. Sound deliberation might force him to see that the Tuesday exception is unmotivated *by anything else in S*, creating a tension resolvable only by dropping the exception. It becomes a failure of *internal* coherence.

  **Jordan:** But doesn't that risk collapsing the internal/external distinction? If "sound deliberation" now mandates recognizing identity across temporal labels for otherwise identical experiential states as a *requirement* of coherence, aren’t you smuggling in an objective norm of temporal neutrality? What if Tom reflects and *doubles down*? He says, "Yes, I see the identity, but I *still* don't care about Tuesday pain. My indifference is bedrock; it *is* my motivation." Is he *still* rational on your view? If you say no, because he *must* extend his motivation, then haven't you conceded that the reason (to avoid Tuesday pain) binds him *independently* of his current, possibly recalcitrant, motivation? That’s externalism.

  **Alex:** (Pauses, frowning) That *is* the tightrope. If Tom genuinely, stably, and reflectively affirms his Tuesday indifference as a brute fact of his motivational set, with no internal tension he cares to resolve... then yes, on Williams's strict internalism, there is *no reason for him* to avoid Tuesday pain. Calling him "irrational" just means *we* find his S repugnant or incomprehensible. It doesn’t mean *he* has a reason he’s failing to acknowledge. The buck stops with his S. The ‘ought’ of reasons remains internal.

  **Jordan:** And that’s where I jump off. Because I think Tom *is* irrational, full stop. Not just weird or blameworthy. He’s violating a constitutive norm of *being a temporally extended agent*. Prudence isn't *just* about satisfying desires; it's about recognizing that your future self, experiencing Tuesday pain, is *you*. To be indifferent *purely* because of the temporal label is to fail a basic requirement of temporal self-understanding. This norm isn't derived *from* his contingent motivations; it’s a condition for his desires (like pain-avoidance) to even *be* about *his future* in a coherent way. The reason exists *because* he is an agent persisting through time, facing identical future harms. His indifference doesn’t negate the reason; it just means he’s irrational.

  **Alex:** But Jordan, that ‘constitutive norm’ – where does it *come from* if not from some understanding of agency *we* endorse? You’re pointing to a deep intuition we share: that temporal neutrality is part of rationality. But Tom doesn't share it. Why is *our* intuition about the "constitutive norms of temporally extended agency" anything more than a very deep-seated *desire* or *disposition* that *we* have? You’re dressing up *our* deep disapproval in the language of objective normativity. The "structural requirement" you see feels, from the internalist perspective, like a projection. Tom might say, "My agency *just is* this way: Tuesday-future doesn't count for me." Who are we to say he's *wrong* about the norms of *his own* agency, if not by appealing to *our* standards?

  **Jordan:** Because the norm isn't sourced in *our* intuitions alone, but in the *logic* of future concern itself. To care about *any* future pain (say, Wednesday's) *requires* a principle that links present concern to future experience. Tom's Tuesday exception *undermines the very possibility* of that principle working consistently. It makes his caring for Wednesday pain *equally arbitrary* from an external perspective – why Wednesday and not Tuesday? Only temporal neutrality rescues future-oriented concern from arbitrariness. The reason is *in the structure of the situation*: identical future suffering demands identical concern, irrespective of label, for any being capable of such concern. Tom’s failure isn’t just motivational; it’s a failure to grasp what it *means* to have a future. That’s why it feels like a *reason* he flouts, not just a motivation he lacks.

  **Alex:** And yet... he *does* care about Wednesday. Consistently. Within *his* framework, the principle *is* "Care about future pain, *except on Tuesdays*." It *is* consistent for him. The 'logic' you see imposing neutrality is the logic *you* bring. He rejects that logic. He might say, "I grasp what it means to have a future; my future just includes this Tuesday-blindspot." You call it a failure of understanding, but it seems like a brute motivational fact. The standoff, I think, is here: Is the requirement of non-arbitrariness in temporal discounting *internal* to the agent's existing S (potentially accessible via extended 'sound deliberation' revealing incoherence) or is it an *external*, constitutive norm of agency itself? Williams leans hard towards the former, fearing the latter opens the door to objectionable external moralism. Parfit, and you, see the latter as necessary to capture a deep truth about practical reason.

  **Jordan:** And I fear the former reduces reason to psychological happenstance, making Tom’s indifference *rational* simply because it’s there. That seems to drain ‘rationality’ of its critical, guiding force. But you’re right about the standoff. I can’t *prove* the external norm to Tom if he’s truly indifferent, any more than I can prove color to a blind person. I can only point to the structural incoherence *I* perceive as fundamental to agency. And you can’t fully convince me that Tom’s reflectively stable indifference makes Tuesday’s agony suddenly *not a reason* for him to act, only a motivation he lacks. We’re staring at the foundational rift: Is practical reason ultimately tethered to the subjective motivational set, or does it track objective, structural demands of agency?

  **Alex:** (Nods slowly, finishes coffee) Precisely. And after that coffee, I need to find a non-arbitrary reason to get some lunch. Care to join? We can continue this over equally distributed future sandwiches, irrespective of the day of the week.

  **Jordan:** (Smiles wryly) Only if you promise not to schedule it for a Tuesday. Lead on. The argument, I suspect, will persist.

  **(They walk towards the hotel restaurant, the philosophical tension unresolved, each having pushed the other to refine their position – Alex stretching internal coherence, Jordan grounding external norms in agency's structure – but finding no common bedrock beneath the Tuesday indifference.)**

  **Key Refinements/Sharpenings:**
  1.  **Alex (Internalist):** Was pushed beyond simple instrumentalism to consider if "sound deliberation" could involve recognizing and resolving *internal incoherence* or *arbitrariness* within the subjective set (S). Conceded this stretches Williams but argued it avoids externalism *if* the resolution stems from existing S elements. Faced the hard case of Tom doubling down, forcing a choice: either accept Tom's reflectively stable S as reason-defining (strict internalism) or concede externalism.
  2.  **Jordan (Externalist):** Was challenged to distinguish objective structural reasons from deep-seated subjective disapproval/projection. Responded by grounding the reason in the *constitutive requirements of temporal agency* and the *logic of future concern itself*, arguing Tom's indifference undermines the very possibility of coherent future-oriented agency. Conceded the difficulty of "proving" the norm to someone truly indifferent, but maintained its objective force.
  3.  **Standoff:** The core disagreement remains whether the requirement for non-arbitrary temporal concern (as revealed in the Tuesday case) is ultimately:
      *   **Internal:** A demand of coherence *within* the agent's existing subjective motivational set, discoverable via sufficiently deep reflection (Alex's stretched internalism).
      *   **External:** A constitutive norm of being a temporally extended agent, binding independently of the agent's contingent motivations (Jordan's externalism).

  Neither side successfully collapsed the other's position, and the dialogue highlights the fundamental tension between grounding reasons in the agent's perspective versus seeing them as constraints inherent in rational agency itself.
