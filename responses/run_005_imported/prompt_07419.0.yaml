  The coffee machine gurgled in Leo’s tiny kitchen, the only sound besides the rhythmic *tick-tick-tick* of rain against the window. Outside, London was a blur of grey and wet headlights. Inside, Leo’s sister, Maya, leaned against the counter, her eyes red-rimmed but dry now. It had been three weeks since Grandpa Joe passed, and the raw grief had settled into a quiet ache.

  “He always hated the rain,” Maya murmured, watching the rivulets chase each other down the pane. “Remember how he’d grumble about his roses getting battered? Said they needed sunshine to show off properly.”

  Leo poured steaming coffee into two mismatched mugs. “Yeah. Stubborn old coot. Wouldn’t even use an umbrella.” He slid a mug towards her. “Cream, no sugar. Like always.”

  Maya wrapped her hands around the warmth. “Thanks.” She took a slow sip. “Feels strange, doesn’t it? Him not being there to complain. Like… like the sun actually *is* gone.”

  Leo stirred his own coffee, the spoon clinking sharply. “He’s gone, Maya. That’s just… it.” He kept his voice gentle, but the words felt heavy.

  Maya looked up, her gaze suddenly sharp. “Is it? Just… gone? Poof? Eighty years, all that love, his terrible jokes, the way he could fix anything… just *nothing*?”

  Leo sighed, bracing himself. They’d skirted this edge before. “I know it’s hard. But yeah. Biology. Consciousness is a brain state. When the brain stops… the lights go out. It’s sad, but it’s… real.” He gestured vaguely. “Like the rain. It just *is*.”

  Maya shook her head, a small, stubborn movement. “I can’t believe that. I won’t. It feels… cheap. Like saying his favourite chair just *is*. It was *his*. He’s… somewhere else now. Somewhere dry and sunny, probably grumbling about the perfect weather being boring.” A ghost of a smile touched her lips. “A better place.”

  There it was. Leo felt the familiar tension coil in his shoulders. “Maya… ‘a better place’. What does that even *mean*? Where? How? What’s the evidence?”

  “Evidence?” Maya’s brow furrowed. “It’s not… Leo, it’s not like proving the kettle boiled. It’s just… true. For me. Knowing he’s at peace *is* the peace.”

  “But ‘knowing’?” Leo leaned forward, his knuckles white on the mug handle. “You can’t *know* that. You can hope it, wish it, feel it… but *know*? Knowing requires proof. Verifiable proof.”

  “Proof like what?” Maya’s voice rose slightly. “A postcard? A spectral selfie? What kind of proof would satisfy you for *this*? Because I’m telling you, sitting here, I *feel* him. Not like a ghost, but… the space he filled hasn’t just collapsed. It’s changed, but he’s still part of it. That’s *real* to me.”

  “Feelings aren’t facts!” Leo countered, frustration creeping in. “They’re brain chemistry, interpretations! You feel peace *because* you believe he’s in a better place, not the other way around! It’s circular reasoning. What if you *felt* he was suffering? Would that make it true? You need an anchor outside just feeling!”

  “An anchor?” Maya looked genuinely confused. “This *is* my anchor, Leo! This belief *is* what holds me steady right now. It’s the lens I see everything through – grief, love, memory. Without it… it’s just a hole. A cold, wet hole.” She gestured at the rain-lashed window. “Like that.”

  “So you just… decide it’s true? Because it feels better?” Leo asked, his voice tight. “What about truth for its own sake? What about facing reality head-on, even when it sucks?”

  “Is your ‘reality head-on’ any less of a choice?” Maya shot back, her own frustration surfacing. “You choose to see a stopped machine. I choose to see… a continuation. A different kind of existence. Why is your choice of lens ‘facing reality’ and mine ‘wishful thinking’? What’s the *evidence* that your way is the only valid way to see *this*?”

  “Because it’s consistent! It fits with everything else we *know*!” Leo slammed his mug down harder than intended, coffee sloshing. “Biology, physics, neurology! There’s no mechanism for an ‘after’, no data!”

  “Data?” Maya’s laugh was short, brittle. “Leo, you’re asking me for the chemical formula for love. Or the geological survey of grief. You’re using a ruler meant for… for train timetables or… or bacteria cultures… to measure *this*.” She pressed a hand to her chest. “It doesn’t fit your ruler, so you say it doesn’t exist? Or worse, that I’m deluded?”

  “I’m not saying you’re deluded!” Leo ran a hand through his hair. “I’m saying… I’m asking… *how* you can be so sure? Based on what? Faith? Feeling? Tradition? What if you’re wrong?”

  Maya stared at him, her eyes wide and suddenly very tired. “Wrong?” she whispered. “Leo… it’s not… it’s not *that* kind of thing. ‘Wrong’ implies there’s a test I failed, a fact I missed. But this… this belief *is* how I live. It’s woven into everything. It’s not a separate ‘thing’ I can be right or wrong *about* like… like whether it’ll stop raining by three. It’s… it’s the ground I walk on. The air I breathe. Asking for ‘proof’ feels like asking me to prove the ground exists *while I’m standing on it*. It’s just… the condition. The way it is. For me.”

  Leo opened his mouth, another logical objection forming – about subjective realities and confirmation bias – but the words died before they reached his tongue. He looked at his sister. Not at her argument, but at *her*. At the raw need in her eyes, the way she clutched the mug like a lifeline, the utter sincerity radiating from her. She wasn’t presenting a hypothesis. She wasn’t making a claim she expected him to verify. She was simply… inhabiting a world.

  He thought of Grandpa Joe’s toolbox, meticulously organized. Leo saw a collection of useful objects, now inert. Maya saw his care, his skill, a tangible expression of his presence that, for her, hadn’t entirely vanished. They were looking at the same box, but they weren’t seeing the same thing. They weren’t even *looking* for the same thing.

  “So…,” Leo started, his voice hoarse. He cleared his throat. “So when you say ‘he’s in a better place’… you’re not… you’re not really saying it’s a *place*? Like… geographically?”

  Maya sighed, a long, slow exhalation. “It’s… the words are the closest I have, Leo. ‘Place’, ‘peace’, ‘better’… they’re just… pointers. Like saying the coffee is ‘hot’. It doesn’t capture the *burn*, the smell, the comfort. It just… points towards it.” She took another sip. “And yes, for me, that ‘better place’ is as real as the heat from this mug. Not a location on a map, but… a state. A truth.”

  Leo picked up his own mug. The coffee was lukewarm now. He looked from the cooling liquid to his sister’s face, etched with a grief his worldview couldn’t soothe. He hadn’t convinced her. She hadn’t convinced him. They hadn’t even found common ground on *what convincing would look like*. Her ‘belief’ wasn’t his ‘belief’. Her ‘know’ wasn’t his ‘know’. Her ‘evidence’ lived in a universe parallel to his own, governed by different rules.

  The rain continued its insistent *tick-tick-tick*. The silence stretched, thick and uncomfortable, filled not with anger now, but with a profound, itchy disconnect. They were both still standing in the same small kitchen, holding mugs of the same cooling coffee, mourning the same grandfather. Yet, they felt utterly alone on separate, invisible planes, the chasm between them not bridged by words, but only made wider by the realization that they’d been speaking entirely different languages all along. Leo took a sip of the tepid coffee. It tasted like confusion. Maya stared into her mug, seeing something else entirely. Neither knew what to say next. The argument was over. The dissonance remained.
