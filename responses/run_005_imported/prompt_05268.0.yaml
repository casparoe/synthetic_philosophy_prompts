answer: |-
  Here are ten interview questions designed to press on the tensions in Aquinas's tyrannicide theory, with follow-ups targeting likely responses. Each question focuses on your specified concerns while inviting critical engagement with your guest’s reconstruction.

  ### Core Questions & Follow-Ups
  1. **Direct "Convenient Asymmetry" Challenge**  
     *Question:* "My friend argues that Aquinas’s prudential warnings in *De Regno*—assassins’ corrupt motives, risk of worse successors, and danger to good rulers—apply equally to usurpers and legitimate tyrants. If so, doesn’t the title/exercise distinction function as a ‘convenient asymmetry,’ insulating Christian monarchs from the very consequences Aquinas feared in usurpers?"  
     *Likely Response:* Guest emphasizes the *moral-juridical* difference: usurpers lack legitimacy, making their killing an act of justice, not sedition.  
     *Follow-Up:* "But if prudential harms (e.g., a worse successor) are equally likely in both cases, why does Aquinas treat them as decisive against killing legitimate tyrants but not usurpers? Doesn’t that prioritize abstract legitimacy over practical outcomes?"  

  2. **Reconciling Early Caution with Permissiveness**  
     *Question:* "In the securely authentic early chapters of *De Regno*, Aquinas counsels endurance under tyranny, stressing the risks of resistance. How do you reconcile this caution with his more permissive stance on killing usurpers elsewhere (e.g., *ST* II-II Q42 A2)? Is this a development in his thought, or a context-dependent inconsistency?"  
     *Likely Response:* Guest distinguishes contexts: early *De Regno* addresses subjects under hereditary rule, while other texts address usurpation as a unique injustice.  
     *Follow-Up:* "Yet in *De Regno* I.6, Aquinas warns that *any* private killing risks chaos—a concern equally relevant to usurpers. Why wouldn’t that universal prudence override the usurper’s lack of title?"  

  3. **Captured Public Authority**  
     *Question:* "When the public body that instituted a legitimate-but-tyrannical ruler is itself complicit or captured (e.g., a collusive nobility), how can Aquinas’s ‘public authority’ requirement for deposition avoid being a dead letter? Does his framework tacitly endorse impunity for tyrants when institutions are corrupt?"  
     *Likely Response:* Guest may appeal to natural law or divine justice as ultimate backstops, or argue Aquinas assumes institutions retain integrity.  
     *Follow-Up:* "But Aquinas explicitly rejects private action here—so if corrupt institutions block deposition, are subjects left with no recourse but prayer? Does this not functionally privilege stability over justice?"  

  4. **Ptolemy of Lucca’s Influence**  
     *Question:* "Your reconstruction relies partly on *De Regno*’s later books, completed by Ptolemy of Lucca—a republican thinker. How much weight does your argument place on these less secure sections, and how do you address concerns that Ptolemy’s views (e.g., popular sovereignty) distort Aquinas’s intent?"  
     *Likely Response:* Guest may downplay Ptolemy’s influence, noting continuity with Aquinas’s *Sentences* commentary or *Summa* passages.  
     *Follow-Up:* "But Ptolemy explicitly defends tyrannicide for *legitimate* rulers who become tyrants (*De Regno* II.8)—contradicting Aquinas’s distinction. Doesn’t this ambiguity undermine reconstructions treating *De Regno* as a unified text?"  

  5. **Prudential vs. Moral Criteria**  
     *Question:* "Is the asymmetry between usurpers and legitimate tyrants fundamentally *moral* (rooted in the nature of authority) or *prudential* (rooted in outcomes)? If moral, why does Aquinas invoke prudential risks only against killing legitimate tyrants?"  
     *Likely Response:* Guest frames title as a moral prerequisite, with prudence secondary.  
     *Follow-Up:* "Then why does Aquinas, in *De Regno*, use prudential arguments *universally* to discourage resistance—even mentioning usurpers alongside legitimate tyrants in his warnings?"  

  6. **Defining "No Higher Authority"**  
     *Question:* "Aquinas permits killing usurpers only when there’s ‘no possibility of appeal to a higher authority.’ But in medieval Europe, wasn’t the Pope or Emperor *always* a theoretical higher authority? Does this condition ever practically obtain, or is it another limit on tyrannicide?"  
     *Likely Response:* Guest may cite Aquinas’s examples (e.g., biblical Ehud) or argue "possibility" means feasible recourse.  
     *Follow-Up:* "Given Aquinas’s view that papal power over temporal rulers is indirect, wouldn’t he reject most appeals to the Pope as ‘impossible’? Doesn’t this expand the scope for killing usurpers dangerously?"  

  7. **Popular Authority vs. Public Bodies**  
     *Question:* "For legitimate tyrants, Aquinas entrusts deposition solely to the instituting ‘public body’—but if that body is inert, could the *populus* (as the ultimate source of authority in Ptolemy’s *De Regno*) act? Or does Aquinas’s authentic work exclude popular action?"  
     *Likely Response:* Guest may note Aquinas’s ambiguity on popular sovereignty but stress his preference for established bodies.  
     *Follow-Up:* "If the *populus* can institute rulers (*De Regno* I.6), why can’t it depose them? Isn’t restricting this to elites inconsistent?"  

  8. **Natural Law and Private Action**  
     *Question:* "Aquinas grounds licit killing of usurpers in natural law defense of the common good. Why doesn’t that same natural-law logic extend to *any* tyrant who devastates the community, irrespective of original title?"  
     *Likely Response:* Guest distinguishes between authority’s *existence* (requiring title) and its *abuse* (requiring public remedy).  
     *Follow-Up:* "But if a legitimate tyrant’s actions are ‘intrinsically perverted’ (*ST* II-II Q42), why isn’t resisting him also a natural-law duty? Doesn’t title become irrelevant when the ruler destroys the very common good justifying authority?"  

  9. **Comparative Medieval Context**  
     *Question:* "How does Aquinas’s distinction respond to real historical tyrannicides? For instance, does the assassination of Conrad of Montferrat (a usurper) align with his view, while John of Salisbury’s defense of killing legitimate tyrants contradicts it?"  
     *Likely Response:* Guest may affirm, noting Aquinas’s innovation in restricting John’s permissiveness.  
     *Follow-Up:* "But if Aquinas’s contemporaries like Giles of Rome condemned *all* tyrannicide as sedition, doesn’t his allowance for usurpers remain radical—and thus harder to dismiss as ‘convenient’?"  

  10. **Enduring Tensions in Reconstruction**  
      *Question:* "Putting the pieces together: Is Aquinas’s theory best seen as a coherent whole, a work-in-progress with unresolved tensions, or a strategically ambiguous stance to balance moral rigor with political realism?"  
      *Likely Response:* Guest defends coherence, perhaps citing Aquinas’s hierarchy of law (eternal > natural > human).  
      *Follow-Up:* "Given the conflicting emphases across texts—and Ptolemy’s role—could the ‘strategic ambiguity’ reading better explain why later thinkers (like Suárez) found his account malleable enough for both condemnation and justification of regicide?"  

  ### Key Strengths of This Approach  
  - **Targets Asymmetry**: Questions 1, 2, and 5 directly pressure the title/exercise distinction’s consistency.  
  - **Highlights Practical Gaps**: Questions 3 and 7 expose institutional failures in Aquinas’s model.  
  - **Probes Authenticity**: Questions 4 and 10 force engagement with Ptolemy’s influence.  
  - **Follow-Ups as Scalpels**: Each anticipates scholarly defenses (e.g., natural law, context) and challenges their sufficiency.  

  These questions avoid restating the reconstruction by starting from its fault lines. If your guest resolves one tension deftly, the follow-up pivots to adjacent contradictions, maintaining critical momentum. Good luck with the interview!
