answer: |-
  That's an incredibly sharp observation – you've hit on one of the most fascinating tensions in medieval political thought! Aquinas's position on tyrannicide is **real, nuanced, and often misunderstood,** and its *lack* of widespread practical application reveals crucial aspects of medieval society and Catholic doctrine. Let's break it down:

  1.  **What Aquinas *Actually* Said (The Nuance is Key):**
      *   Aquinas discusses this primarily in **Summa Theologiae, II-II, Question 42, Article 2 (Whether Sedition is Always a Mortal Sin?)** and his commentary on **Peter Lombard's Sentences (IV Dist. 44, Q. 2, A. 2)**.
      *   His core argument is **not** that *any individual* has the moral right to assassinate a ruler they deem bad. Instead, he argues:
          *   **Distinction of Tyranny:** Not all flawed rulers are tyrants. Tyranny involves *grave, persistent injustice* that actively *destroys the common good* and violates divine/natural law (e.g., forcing idolatry, waging unjust wars of aggression, extreme oppression rendering life/society impossible).
          *   **Source of Authority:** Authority comes *from God*, but *through the people* (or for the common good). A ruler who fundamentally betrays the purpose of authority (justice and the common good) severs their legitimate claim to obedience *in those specific, unjust commands*.
          *   **Action by Public Authority:** Crucially, Aquinas emphasizes that **deposing a tyrant is the responsibility of "public authority."** He explicitly contrasts this with *private individuals* acting rashly:
              > *"If to provide itself with a king belongs to the right of a given multitude, it is not unjust that the king be deposed or have his power restricted by that same multitude if, becoming a tyrant, he abuses the royal power."* (De Regno, I, 6)
              > *"...it is the people who are entitled to curb the king's tyranny, or the authority delegated by the people to do this... But if there is no human agency available to offer help against the tyrant, recourse must be had to God..."* (Commentary on Sentences)
          *   **Last Resort & Proportionality:** Removing a tyrant must be a **last resort** after all other means (admonition, petition, pressure from nobles/church) fail. The cure (removal, potentially by force) must not be worse than the disease (i.e., causing greater chaos, civil war, or installing an even worse tyrant). Assassination by a lone individual is almost always seen as likely to cause greater disorder.
          *   **Not "Green Light" for Assassination:** He **never** says, "Go ahead, stab the bad king." He outlines a *theoretical justification* for *public, authorized action* to *depose* a tyrant for the sake of the common good, potentially involving force *as a collective act*, not private murder.

  2.  **Why Didn't Peasants Rise Up? (The Medieval Reality Check):**
      *   **"Public Authority" was Elusive:** Who exactly *was* the "public authority" empowered to act? The nobility? The Church? A council of barons? The "people" as an abstract concept? This was highly contested. Peasants lacked any recognized standing as "public authority." Acting alone or as a mob was seen as *sedition* or *treason*, not legitimate public action.
      *   **Fear of Chaos & Anarchy:** Medieval society was deeply hierarchical and valued order, even imperfect order, above the risks of revolution. Aquinas himself feared that reckless removal could lead to worse tyranny or societal collapse ("the cure worse than the disease"). The Church heavily emphasized Romans 13 ("obey the governing authorities") and the dangers of disorder.
      *   **Power Imbalance:** Peasants were militarily, legally, and economically powerless against lords and kings. Organizing a legitimate "public authority" challenge was nearly impossible without support from powerful factions within the elite (nobles, church leaders).
      *   **The "Tyrant" Label Was Subjective:** Declaring someone a tyrant wasn't simple. Rulers had propaganda, divine right claims, and loyal factions. What one group saw as tyranny, another saw as necessary strength. The Church was often cautious about making such pronouncements.
      *   **Focus on Spiritual Resistance:** The Church often counseled endurance, prayer, and focusing on spiritual salvation rather than violent earthly rebellion. Suffering under an unjust ruler could be seen as a path to holiness.

  3.  **Why Isn't It Emphasized More Today? (Modern Catholic Political Thought):**
      *   **Emphasis on Non-Violence & Due Process:** Modern Catholic Social Teaching (CST), heavily influenced by figures like John Paul II, strongly emphasizes **non-violent resistance** (e.g., Solidarity in Poland) and working through legal, constitutional, and diplomatic channels. Assassination is almost universally condemned as intrinsically evil (violating the commandment against murder and the principle of proportionality).
      *   **Development of Doctrine:** CST has developed nuanced concepts of "subsidiarity" and "participation," focusing on building just institutions, promoting human rights, and using mechanisms like impeachment, elections, international pressure, and civil disobedience *before* any contemplation of force. Force is seen as an absolute last resort for *collective self-defense*, not individual action.
      *   **Focus on Deposition, Not Assassination:** When Aquinas is referenced in discussions of resisting tyranny, it's his principle of the ruler's *accountability to the common good* and the *right/duty of legitimate authority to depose* that is highlighted, *not* tyrannicide. The emphasis is on constitutional and collective action.
      *   **Distinguishing Aquinas's Context:** Applying 13th-century justifications for deposing a king in a feudal monarchy directly to assassinating a modern dictator is seen as anachronistic and dangerous. Modern states have different structures (however flawed) for removal.
      *   **The Shadow of Misuse:** Historically, arguments for tyrannicide *have* been misused to justify political murders, regicide, and terrorism. The Church is understandably wary of promoting any doctrine that could be twisted to justify such acts. Figures like Dietrich Bonhoeffer (involved in the plot against Hitler) are debated precisely because his actions, while arguably meeting extreme criteria, involved assassination.

  **In Conclusion:**

  You're absolutely right that Aquinas provided a **powerful theoretical justification for resisting and deposing a tyrant** based on natural law and the common good. This *is* a significant part of his legacy and Catholic political thought. **However, you're also spot-on in noticing the gap between theory and practice.**

  The reasons are:
  1.  **Nuance Misunderstood:** He argued for *public, authorized action as a last resort*, not individual assassination.
  2.  **Medieval Realism:** The "public authority" was ill-defined and elite-controlled; fear of chaos was paramount; peasants lacked power.
  3.  **Modern Prudence:** The Church now emphasizes non-violence, due process, and building just institutions, viewing assassination as morally unacceptable and strategically counterproductive. Aquinas's core principle of accountability remains vital, but the *means* of resistance advocated have evolved significantly.

  So, while Aquinas didn't give your medieval grandma or her neighbors permission to "take out the lord," he did plant a crucial seed: rulers serve the people and justice, not the other way around. That seed grew into more developed, and largely non-violent, doctrines of resistance within modern Catholic thought. It's a complex legacy, and your rabbit hole led you to a genuinely profound historical and philosophical puzzle!
