  Borderline Personality Disorder (BPD) comes to mind immediately. Its diagnostic history is practically a textbook case of looping. Let me mentally walk through the evidence: 

  First, the classification itself was born from therapeutic interaction - the term "borderline" originally described patients who seemed to hover between neurosis and psychosis during psychoanalysis. Already interactive by nature. 

  Then the famous Marsha Linehan dialectical behavior therapy development in the 90s - this explicitly taught patients emotion regulation skills, which paradoxically led to new presentations. Patients learned to articulate their "fear of abandonment" more clinically, making it a diagnostic criterion. That's pure looping: the treatment changed the expression of the disorder. 

  Social media adds another layer. TikTok therapists pathologize normal emotions as BPD traits, while patients form communities that reinforce certain behaviors. This pressures clinicians to broaden diagnoses, creating that feedback loop Hacking describes. 

  For the historical fashion vs looping distinction - the key is agency. When patients actively reshape their identity around the label (like adopting "borderline" as identity online), that's looping. Mere diagnostic inflation without identity change would just be trendiness. 

  This example hits all requirements: concrete feedback mechanisms, documented criterion changes (DSM-III to DSM-5), and clear patient agency. The social media angle also makes it feel current and undeniable. 

  Better prepare for objections though. The friend might argue BPD was always poorly defined - but that's the point! The instability proves it's interactive. And the therapeutic community's role in looping is actually evidence for, not against, the phenomenon per Hacking's framework. 

