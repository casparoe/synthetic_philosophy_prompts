prompt: |-
  I'm one of four students on the rules committee for my school's Computer Science Society, and after our fall tournament we're stuck on a dispute none of us feels equipped to settle. For the past two years the tournament has just been a standard iterated Prisoner's Dilemma bot-off, but this year, after a couple of us read about a corner of game theory sometimes called 'program equilibrium' or 'open-source game theory' — the idea that letting two players inspect each other's source code before acting can support cooperation that classical game theory says is irrational — we redesigned it as a single-shot format in which each bot's complete source is shown to its opponent before either one has to output Cooperate or Defect.

  Here is the complication. Two of our strongest competitors, who are close friends and wrote their entries together, each submitted a bot that cooperates if and only if the opponent's source code is identical to its own once comments and whitespace are stripped out, and defects otherwise. Because their two files matched, the bots cooperated with each other every time and defected against the rest of the field, which was enough to lock up first and second place overall. A third competitor has filed a complaint arguing that this is collusion dressed up as strategy — no different from two players signaling under the table — since the 'cooperation' tracks friendship rather than any reasoning about the opponent. The two accused students respond that they broke no written rule, exchanged no information once the round started, and simply used the format's own mechanic, mutual code visibility, exactly as it was meant to be used. They also point to a fourth competitor, a stranger to both of them, whose bot instead cooperates only when it can verify from the opponent's code — using a small proof search one of them says was inspired by something called Löb's theorem, from a paper on 'robust cooperation' — that the opponent would cooperate with it specifically; that bot ended up cooperating with several strangers over the course of the tournament, and nobody has objected to it.

  Our advisor wants the committee's ruling in writing before Friday's awards ceremony, since a small prize fund rides on the final standings. Could you draft that memo for me? It should actually rule on the complaint — uphold it, dismiss it, or land somewhere in between, including any effect on the standings — and it should propose a workable rule for next year's format that draws a principled line between legitimate uses of code transparency and collusion. Please take the accused students' defense seriously rather than simply assuming that two friends cooperating must be cheating; if there is a genuine difference between what they did and what the fourth bot did, I'd like the memo to say plainly what it is and why it should matter for the ruling.
reasoning: |-
  We are presented with a dispute regarding a tournament in which two students submitted bots that cooperate if and only if the opponent's source code (after stripping comments and whitespace) is identical to their own. They cooperated with each other and defected against others, securing top positions. A third competitor has filed a complaint of collusion.

  The accused students defend that:
  1. They broke no written rule.
  2. They did not exchange information during the round.
  3. They used the mutual code visibility as intended.
  4. They contrast their approach with a fourth bot (by a stranger) that uses a more complex method (involving a proof search inspired by Löb's theorem) to decide cooperation, which cooperated with several strangers and has not been objected to.

  The key question is whether the two friends' strategy constitutes collusion or is a legitimate use of the format.

  **Analysis:**

  1. **Collusion vs. Legitimate Strategy:**
     - Collusion typically involves an explicit or implicit agreement between players to act in a way that benefits them at the expense of others, often in violation of the rules. Here, the two students wrote their bots together and designed them to recognize each other. However, they did not communicate during the tournament. The format allows bots to use the opponent's source code arbitrarily.

  2. **The Format's Intention:**
     - The tournament was redesigned to explore "program equilibrium" — the idea that mutual inspection of source code can foster cooperation. The fourth bot (using a proof search) is a clear example of what the format intended: it tries to establish cooperation with any bot that can be proven to cooperate with it. This is a general strategy that can work with any opponent that uses a similar reasoning.

  3. **The Accused Bots' Strategy:**
     - The two friends' bots only cooperate with an exact copy of themselves (ignoring comments and whitespace). This strategy is highly specific and only works because they have the same code. It does not attempt to cooperate with any other bot, even if that bot might be willing to cooperate. This is effectively a "secret handshake" that only they know.

  4. **Comparison with the Fourth Bot:**
     - The fourth bot uses a general algorithm (inspired by Löb's theorem) that can potentially cooperate with any bot that passes its proof condition. It does not rely on sharing the same code but on the opponent's code satisfying a logical condition (that the opponent will cooperate with it). This is an open strategy that can be adopted by anyone and can lead to cooperation among multiple participants.

  **Ruling:**

  The complaint is **upheld in part and dismissed in part**.

  - **On the charge of collusion:** We find that the two students did not break any explicit rule. They did not communicate during the round and used the provided mechanism (code visibility) as allowed. Therefore, the complaint of outright collusion (as in, cheating by exchanging signals during the tournament) is dismissed.

  - **However, the strategy they employed is against the spirit of the tournament and the intended design of the format.** The goal was to foster cooperation through mutual reasoning about code, not through pre-arranged identical code. Their strategy does not engage in the kind of reasoning that the format was meant to explore. Instead, it uses the code visibility as a way to recognize a pre-arranged partner. This is similar to two players in a standard Prisoner's Dilemma tournament having a secret signal that they use to recognize each other and cooperate, which would be considered collusion in a typical setting.

  - **Effect on Standings:** We rule that the two bots should be disqualified for violating the spirit of the competition. The tournament standings should be recalculated without these two entries. The prizes should be awarded accordingly.

  **Proposed Rule for Next Year:**

  To prevent such issues and to encourage the intended use of code transparency, we propose the following rule:

  > **Rule on Cooperation Strategies:**
  > Bots must base their decision to cooperate or defect solely on the opponent's source code and the reasoning about the opponent's behavior. A bot's strategy must be designed to potentially cooperate with any opponent that satisfies a condition that is based on the opponent's reasoning about the game, and not on the specific content of the opponent's code that is unique to a particular bot or team.
  >
  > Specifically, a bot may not condition its cooperation on the opponent having the same source code (or a hash of the same) as itself, or on any other condition that is designed to recognize a specific bot or team. Conditions for cooperation must be based on the opponent's strategy and must be general enough that multiple independent teams could adopt strategies that satisfy the condition without prior coordination.

  This rule would allow strategies like the fourth bot (which uses a proof search to verify that the opponent will cooperate with it) because the condition is about the opponent's behavior and reasoning, not about the exact code. It would disallow the two friends' strategy because it relies on the exact code match.

  **Conclusion:**

  The two accused students' bots are disqualified for using a strategy that relies on pre-arranged identical code, which is against the spirit of the tournament. The standings should be recalculated without these two entries. The committee encourages the use of strategies that promote cooperation through mutual reasoning, and we adopt the above rule for future tournaments to clarify the boundaries.

  We thank the students for their participation and hope that this ruling will foster a more robust and fair competition in the future.
