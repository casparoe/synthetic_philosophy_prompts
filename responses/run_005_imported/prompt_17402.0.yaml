  **MEMORANDUM**  
  **TO:** Computer Science Society Rules Committee  
  **FROM:** [Your Name], Rules Committee Member  
  **DATE:** [Current Date]  
  **SUBJECT:** Ruling on Tournament Complaint and Proposed Rule Amendment  

  ### I. Ruling on Complaint (Case #2023-01)  
  After thorough review, the Rules Committee has reached a decision regarding the complaint against the two students whose bots ("Bot A" and "Bot B") cooperated exclusively with each other and defected against all others.  

  #### A. Summary of Findings  
  1. **No Violation of Explicit Rules**:  
     - The tournament rules permitted bots to conditionally cooperate or defect based on the opponent's source code. No rule forbade bots from checking for code similarity, nor did the rules restrict collaborations during the bot-development phase.  
     - The accused students did not exchange information during the tournament itself, adhering to the prohibition against runtime communication.  

  2. **Distinction from Legitimate Strategies**:  
     - The committee distinguishes Bot A/B’s strategy from that of the fourth bot (hereafter "Bot C"), which cooperates upon verifying—via proof search—that the opponent would cooperate with it. Bot C’s approach is **generalizable**: it can cooperate with any bot satisfying its proof condition, irrespective of authorship. Multiple unrelated teams could adopt this strategy to achieve mutual cooperation.  
     - Bot A/B’s strategy, by contrast, is **non-generalizable**: it cooperates *only* if the opponent’s code is identical to its own (sans comments/whitespace). This requires pre-tournament coordination between teams to replicate code, making cooperation inaccessible to outsiders.  

  3. **Collusion by Design**:  
     - While Bot A/B’s strategy technically uses "mutual code visibility," it exploits the mechanic to enforce a **closed coalition**. Cooperation is contingent on shared authorship (evidenced by code replication), not on open, reproducible reasoning about the opponent’s behavior. This mirrors "signaling" in classical game theory, where players pre-arrange covert cues to exclude others.  
     - Bot C’s strategy, conversely, uses code transparency for **open verification**: it rewards opponents that pass a transparent, content-agnostic test (proof of cooperation). This aligns with the tournament’s intent to explore "program equilibrium."  

  #### B. Committee Decision  
  - **Complaint Upheld in Part**: Bot A/B’s strategy constitutes **de facto collusion**. While no written rule was broken, the strategy violates the tournament’s spirit by prioritizing team affiliation over algorithmic reasoning.  
  - **Remedy**: Bot A/B are disqualified. Tournament standings will be recalculated excluding these entries. Prizes will be reallocated to the highest-scoring eligible bots.  

  ---

  ### II. Proposed Rule for Future Tournaments  
  To preserve the integrity of the "open-source" format, the committee proposes the following rule (to be added to Section 4.1 of the tournament bylaws):  

  > **Rule 4.1.3: Conditions for Cooperation**  
  > A bot may condition its decision to cooperate on properties of the opponent’s source code *only if*:  
  > (a) The condition is **verifiable** through the opponent’s code structure or logic (e.g., checking for a specific cooperation protocol);  
  > (b) The condition is **generalizable**, meaning it does not require:  
  > &nbsp;&nbsp;&nbsp;&nbsp;(i) Exact code matching (excluding whitespace/comments) with the bot itself or a predetermined partner;  
  > &nbsp;&nbsp;&nbsp;&nbsp;(ii) Hardcoded references to unique identifiers (e.g., filenames, author names);  
  > &nbsp;&nbsp;&nbsp;&nbsp;(iii) Team-specific secrets (e.g., cryptographic keys).  
  >   
  > **Examples**:  
  > - ✅ Permitted: Cooperating if the opponent’s code contains a proof that it cooperates with your bot (e.g., via Löb’s theorem).  
  > - ✅ Permitted: Cooperating if the opponent uses a specific algorithm (e.g., tit-for-tat).  
  > - ❌ Prohibited: Cooperating only if the opponent’s code hash matches your own.  
  > - ❌ Prohibited: Embedding a team-specific "password" in the code to trigger cooperation.  

  #### Rationale  
  This rule:  
  1. **Promotes Open Cooperation**: Encourages strategies that allow any bot to earn cooperation by satisfying objective, reproducible conditions.  
  2. **Prevents Exclusionary Tactics**: Bans strategies that rely on pre-tournament coordination or "insider" knowledge.  
  3. **Clarifies Legitimate Use of Code Transparency**: Distinguishes between inspecting code for *reasoning about behavior* (e.g., proof search) versus *authenticating identity* (e.g., code matching).  

  ---

  ### III. Final Remarks  
  The committee acknowledges the accused students’ technical compliance with the rules but emphasizes that the tournament’s purpose—to explore open-source cooperation—is undermined when strategies prioritize team loyalty over algorithmic innovation. Bot C exemplifies the intended spirit: it cooperated with strangers because they passed a logical test, not because they were friends.  

  This ruling and the proposed rule aim to ensure future tournaments reward ingenuity, not insider coordination. The updated standings will be shared at Friday’s ceremony.  

  **Approved by unanimous vote of the Rules Committee.**  
