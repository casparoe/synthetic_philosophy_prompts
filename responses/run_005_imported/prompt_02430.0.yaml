answer: |-
  That's a fascinating connection to explore, and while your editor's intuition captures a powerful *parallel* and *potential resonance* between Dummett's philosophy and his activism, pinning his *actual* arguments about immigration **directly and exclusively** to his anti-realism is likely an oversimplification. Here's a breakdown of why:

  1.  **The Direct Logical Line is Probably Too Strong & Unsupported:**
      *   **Distinct Domains:** Anti-realism in the philosophy of language/metaphysics (truth, meaning, logic) operates at a highly abstract level concerning the nature of reality, meaning, and our cognitive access to it. Arguments about immigration policy operate at the level of political philosophy, ethics, applied justice, and social reality. Jumping directly from the metaphysical/epistemological to the political/ethical requires significant bridging arguments that Dummett himself never explicitly provided in his political writings.
      *   **Dummett's Own Silence:** Crucially, Dummett **did not** prominently deploy his anti-realist arguments *in his work on immigration*. His book *On Immigration and Refugees* (2001) and his activist work were grounded primarily in:
          *   **Empirical Observation:** Documenting the brutal realities of racism, xenophobia, and the harmful effects of exclusionary policies.
          *   **Moral Principles:** Appeals to justice, fairness, human dignity, the prevention of suffering, and the inherent wrongness of discrimination. He argued forcefully against the *harm* caused by immigration controls and racism.
          *   **Practical Politics:** Analyzing the flaws, hypocrisies, and practical injustices embedded in immigration laws and their enforcement.
      *   **The Burden of Proof Argument:** His central argument that the *burden of proof lies with the state* when seeking to exclude someone is primarily **ethical**, grounded in the principle that restricting fundamental freedoms (like movement, residence, association) requires strong justification, and in the observation of the immense *harm* caused by exclusion. It stems more from liberal political philosophy (Mill's harm principle, basic rights) and the realities of state power vs. individual vulnerability than from the nature of truth-conditions for mathematical statements.

  2.  **Why the Parallel is Compelling and Worth Exploring (Indirectly):**
      *   **Epistemic Humility:** Anti-realism emphasizes the limitations of human knowledge and the idea that truth is tied to our justificatory capacities. This *could* foster a skepticism towards claims about "objective" national identities or borders possessing some immutable, mind-independent reality that trumps human needs and justifications. It challenges the *certainty* often claimed by exclusionary nationalists.
      *   **The Primacy of Verification/Justification:** If meaning and truth are tied to what we can *verify* or *justify*, this resonates with Dummett's insistence in the immigration debate that claims about belonging, threat, or "illegitimacy" require *actual justification* based on evidence and reason, not appeals to unverifiable essences or historical myths. It shifts focus *away* from purported mind-independent facts about "Britishness" and *towards* the justifications offered in practice.
      *   **Constructivism Implied:** Anti-realism often leans towards a constructivist view of meaning (and, by extension, social reality). This implicitly undermines the idea that national borders or identities are natural, God-given, or metaphysically fixed objects. They appear more as human constructs, open to critical examination and revision based on human needs and justifications – which aligns perfectly with Dummett's view that immigration policy should be based on justice and human welfare, not mythical blood-and-soil narratives.
      *   **Skepticism Towards Abstraction:** Dummett's anti-realism was partly motivated by skepticism towards Platonist abstractions divorced from human practice. Similarly, his activism railed against abstract legal categories and bureaucratic procedures (like the "primary purpose rule") that caused concrete human suffering, divorced from the realities of people's lives and relationships.

  3.  **How Dummett *Might* Have Connected Them (Implicitly):**
      *   His philosophical work likely fostered a deep intellectual temperament characterized by **skepticism towards unverifiable claims, a focus on justification, and an emphasis on the human perspective.** This temperament undoubtedly informed his approach to the politically charged, often irrational, and justification-poor discourse surrounding immigration. He applied the same rigor in demanding evidence and sound reasoning to immigration policy that he applied to debates about truth in mathematics.

  **Recommendation for Your Article:**

  *   **Do Open With the Connection:** It's intriguing and highlights Dummett's unique dual legacy. Frame it as a striking parallel or a potential deep resonance, not a proven direct logical deduction.
  *   **Acknowledge the Nuance:** Explicitly state that while the connection is tempting and philosophically suggestive, Dummett's *explicit* arguments in *On Immigration and Refugees* were grounded in ethics, empirical evidence of harm, and practical politics, not technical anti-realism.
  *   **Explore the Resonance:** Dive into *how* the *spirit* of anti-realism – its skepticism towards inaccessible "facts," its focus on justification, its emphasis on the human epistemic standpoint, its constructivist leanings – *resonates powerfully* with his critique of exclusionary nationalism and bureaucratic inhumanity. Argue that his philosophy cultivated an intellectual framework that made him particularly attuned to the *unjustified assertions* and *harmful abstractions* inherent in much immigration rhetoric and policy.
  *   **Quote His Activism:** Use quotes from his political work emphasizing the demand for justification, the exposure of harmful fictions, and the focus on concrete human consequences. *Then* suggest how this *feels like* an application (consciously or not) of the critical mindset honed by his anti-realist battles.
  *   **Mention the Philosopher Friend's Reaction:** Briefly noting her hesitation adds credibility and shows you've considered counterpoints.

  **In essence:** You're not "bolting unrelated parts together," but you *are* potentially overstating the *direct logical derivation*. The profound link lies in a shared intellectual *temperament* – a relentless demand for justification, a skepticism towards unverifiable metaphysical claims (whether about truth or national identity), and a focus on the human consequences of ideas – that permeated *both* his technical philosophy and his passionate activism. That's a rich and valid story to tell.
