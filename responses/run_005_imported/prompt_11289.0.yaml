answer: |-
  ## Philosophical Bloodfeud: Strawson vs. Strawson
  *(The scene: A worn Oxford study, leather-bound books lining the walls. Late afternoon light slants through tall windows. GALEN STRAWSON, intense and precise in his 40s, paces slightly. His father, P.F. STRAWSON, calm and avuncular in his late 70s, sits in a deep armchair, pipe resting beside him.)*

  **Galen:** Father, we must talk about this... *disagreement*. Your "reactive attitudes" feel like a beautiful, elaborate dance around the gaping hole at the center of moral responsibility. The regress exposes it: true desert – *ultimate* desert, praise or blame that genuinely *sticks* – is impossible. We are all, quite literally, innocent.

  **P.F.:** (Chuckles softly) "Innocent"? Galen, my boy, that’s a rather dramatic pronouncement. My reactive attitudes aren’t dancing *around* anything; they’re the very ground we stand *on* when we engage with each other as moral agents. Resentment when you’re slighted, gratitude for kindness, indignation at cruelty – these aren’t optional extras. They *constitute* the practice of holding responsible.

  **Galen:** Constitute it, yes! But do they *justify* it? That’s the crux. Your reactive attitudes are psychological facts – undeniable, perhaps necessary for social cohesion. But are they *fitting*? Are they responses to something that genuinely *merits* them? The regress shows they cannot be. To be ultimately responsible for an action, I must be ultimately responsible for the character and reasons that produced it. But *that* responsibility would require an earlier act of self-creation, choosing the principles by which I would later choose my character... and so on, infinitely. It’s a demand for *causa sui* – pulling oneself into existence by one’s own bootstraps. As Nietzsche saw, it’s incoherent. Determinism or indeterminism is irrelevant. Indeterminism just injects randomness, which is *worse* for grounding desert – how can I deserve blame for a random neural hiccup?

  **P.F.:** Ah, the famous "Basic Argument." It’s clever, Galen, very clever. But it proves *too* much. That’s my first objection. You’ve constructed a notion of "ultimate responsibility" so impossibly demanding – requiring an infinite regress of self-creation – that it renders responsibility incoherent *even if* we *did* possess contra-causal libertarian free will! If some magical, non-physical soul *did* spontaneously choose its nature ex nihilo... your regress would *still* demand: "But why did *that* soul choose *that* nature? What prior principle guided it?" It makes your target – "ultimate desert" – look like a philosopher’s fantasy, a concept disconnected from any conceivable reality or practice. What practical work is this "ultimate" doing, except setting an impossible standard to then declare failure?

  **Galen:** (Stops pacing, leans against the bookshelf) It’s doing the work of showing that *any* attribution of *true* desert – the kind that underpins the *justification* of praise, blame, punishment, and the reactive attitudes themselves – is metaphysically baseless. It shows that at the fundamental level, no one *deserves* anything in the ultimate sense your reactive attitudes tacitly rely upon. We’re all products of heredity and environment, stretching back to the Big Bang. Where does the *desert* enter? When does the buck *truly* stop with *me*? It never does. So, while your reactive attitudes might be *natural*, the question is whether they are *apt*. Is resentment *really* a fitting response to the inevitable unfolding of causal chains that made the offender who they are? Or is it just... a brute biological flinch?

  **P.F.:** You’re conflating two senses of "desert," Galen. There’s the desert demanded by your metaphysical regress – this impossible, self-causing agency. And then there’s the desert *internal to the practice* of responsibility constituted by our reactive attitudes. When I resent you for breaking a promise, I’m not judging the ultimate metaphysical source of your character. I’m responding *to you*, Galen Strawson, *as you are now*, acting in a way that flouts the basic expectations of human fellowship. The "desert" here isn’t some ghostly property floating above the practice; it’s *defined by* the appropriateness of the reactive attitude *within the practice*. The resentment *is* the judgment of desert in this practical, human sense. Asking if it’s "fitting" *outside* this framework is like asking if a move in chess is "really" valid outside the rules of chess.

  **Galen:** But that sounds perilously circular, Father! "The practice justifies the practice." You’re saying resentment is fitting *because* resentment is how we mark desert within the practice... but that practice itself *presupposes* a desert that the regress shows is illusory. It’s like building an elaborate legal system on the assumption that phlogiston exists. The naturalness of the reaction doesn't make it *correct* if its object – genuine, ultimate responsibility – is a mirage. Does the tiger *deserve* my fear? It’s natural, it’s useful... but the tiger isn’t *culpable*. It simply *is*. Aren’t we, in your scheme, treating fellow humans like morally culpable tigers? The fear/resentment might be natural, but the attribution of *blameworthiness* becomes unfounded.

  **P.F.:** (Leans forward, eyes sharp) The crucial difference, Galen, is that the tiger isn’t *in* the practice. We don’t *hold* tigers responsible; we manage them. We *do* hold humans responsible because they *participate* in the space of reasons. They understand demands, justifications, expectations. When you break a promise, you *know* what a promise *is*, you *know* the expectations it creates, and you *could have done otherwise* in the ordinary, practical sense – no action compelled you at gunpoint, your reasons were accessible to evaluation. *That* is the "could have done otherwise" that matters for *our* practices. Your regress asks for a "could have done otherwise" that transcends the entire framework of reasons, character, and circumstance. It asks for a freedom *from being human*. Why should *that* be the benchmark? The reactive attitudes respond to the quality of the *will* expressed in the action *as it intersects with our shared human life*. That quality is real, even if its ultimate genesis isn't self-caused.

  **Galen:** (Quietly) So, it’s a necessary fiction? We *treat* each other *as if* we were ultimately responsible, knowing we’re not, because the practice is too vital to abandon? Is that the compatibilist’s secret? That we’re actors in a play where the script is written by forces beyond us, yet we must play our parts with conviction, including the parts where we condemn and praise?

  **P.F.:** (Sighs, picks up his unlit pipe) It’s not a *fiction*, Galen. That implies conscious deception. The reactive attitudes and the responsibility they track are *real features of our form of life*. They are as real as language, love, or law. They emerge from, and structure, our interactions. Demanding they answer to a standard *outside* that form of life – your metaphysical "ultimate" – is like demanding that the reality of a symphony be judged by examining the molecular structure of the violin wood. You miss the music entirely. The "desert" is *in* the resentment, *in* the gratitude. To ask if it’s "ultimately" fitting is to ask a question that has no purchase *within* the practice that gives the concept its meaning. We don’t need ghosts in the machine for blame to *matter*, for forgiveness to *heal*, for justice to be more than mere management.

  **Galen:** (Looks out the window) But the ghost haunts, Father. It haunts when we punish severely, believing the criminal *deserves* it fundamentally. It haunts when we take profound credit, feeling the glory is *truly* ours. Your practice, however rich, feels like it papers over an abyss. The regress... it shows the abyss is there. And knowing it’s there changes the music. Can resentment ever feel quite the same? Can *desert*?

  **P.F.:** (Gently) Perhaps it *should* change the music, Galen. Perhaps it should temper our resentment with a measure of tragic understanding, make our justice more merciful, our praise more humble. But it doesn't obliterate the distinctions the practice makes. The murderer and the saint are still different. The promise-keeper and the promise-breaker still warrant different responses *from us*, within *our* lives. That difference, and the responses it evokes, is the reality of responsibility. It doesn't need to be anchored in the void of self-creation to be real, and to do its vital work. We are not causa sui... but we *are* participants in this demanding, fragile, human dance of holding and being held responsible. To abandon that dance because we can’t pull ourselves from the swamp by our own hair... that, my son, feels like the true abdication.

  *(Galen turns from the window, his expression a mix of intellectual frustration and a grudging, filial respect. P.F. watches him, the ghost of a sad smile on his face. The sunlight fades. The profound disagreement remains, unresolved, the weight of the regress pressing against the solidity of the lived practice. Neither has yielded, but the blows have landed.)*
