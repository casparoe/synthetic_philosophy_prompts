prompt: |-
  Ok this is a bit of a weird one but I just started a comms job at a smallish AI safety lab, and part of the gig is running our internal podcast. Next week I'm interviewing one of our researchers who's whole postdoc was on debate as a scalable oversight protocol, and I really don't want forty minutes of her just restating the OG 2018 debate paper. Can you draft me 8-10 interview questions that push past that? I want at least one on whether cross-examination actually solves the obfuscated arguments problem or just relocates it to a nastier complexity class, one on why we should expect a debate's equilibrium to track truth rather than sheer persuasiveness (this is the bit that's bugged me since I read the Khan et al persuasiveness paper), and one asking her to square that paper's pretty rosy results with DeepMind's own follow-up finding much more modest gains once the judge-debater capability gap widens. For each, toss in a quick follow-up keyed to whatever dodge she's most likely to reach for.
