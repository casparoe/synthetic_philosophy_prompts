answer: |-
  Here are 10 interview questions (+ strategic follow-ups) designed to push past the 2018 paper and tackle your core concerns head-on, while anticipating common dodges:

  1.  **Beyond Imitation: Truth vs. Persuasion Equilibrium**  
      *"The 2018 paper posits that optimal play in debate leads to truthful answers. But Khan et al.'s 'Persuasiveness' paper (2023) suggests AI agents can learn highly persuasive strategies *independent* of truth. Why should we expect the Nash equilibrium of a debate game to reliably track *truth* rather than converging on whatever strategy maximizes *win probability* against a given judge, even if it's deceptive or manipulative?"*  
      **Likely Dodge:** "Optimal play *requires* truth under idealized conditions."  
      **Follow-Up:** *"But doesn't that hinge critically on the judge's capability? If the judge has blind spots or biases the debaters can exploit (as Khan showed), doesn't that break the theoretical truth-tracking guarantee in practice, leading to an equilibrium optimized for *persuading that flawed judge*, not truth?"*

  2.  **The Obfuscation Shell Game: Complexity Class Relocation?**  
      *"A key promise of cross-examination is forcing clarity by breaking down obfuscated arguments. But critics argue this doesn't *solve* obfuscation; it just relocates the problem. Instead of one complex lie, debaters now trade many smaller, potentially *more intricate* lies or half-truths within the cross-examined components. Does debate actually eliminate the 'obfuscated arguments' problem, or does it just shift the adversarial burden into a potentially *nastier* complexity class (e.g., requiring judges to track intricate chains of sub-claims and dependencies)?"*  
      **Likely Dodge:** "Iterative cross-examination eventually reveals inconsistencies."  
      **Follow-Up:** *"Doesn't that assume superhuman judge persistence and perfect memory? In finite time with human-level (or sub-superhuman AI) judges, could debaters strategically *overwhelm* with plausible-sounding micro-claims, effectively 'Gish galloping' at the component level? How do we bound this complexity?"*

  3.  **The Capability Gap Cliff: Reconciling Conflicting Results**  
      *"Early empirical results (like Khan et al. 2022) showed debate significantly improving truthfulness over baselines. However, DeepMind's subsequent work (e.g., 'Does Debate Scale?', 2023/24) found gains became much more modest or even negative once the debater capability significantly *exceeded* the judge's capability. How do you square these seemingly contradictory findings? What does this imply for debate's scalability as AI capabilities rapidly advance?"*  
      **Likely Dodge:** "We need better judge training/assistance/scaling."  
      **Follow-Up:** *"But isn't the core promise of debate that it's a *scalable* oversight method precisely *because* it shouldn't require the judge to be as capable as the system being overseen? If judge capability becomes the critical bottleneck and scaling *judges* is just as hard as scaling aligned AI, doesn't that undermine debate's primary value proposition?"*

  4.  **Judge Design: The Weakest Link?**  
      *"Much focus is on debater incentives, but the judge seems like the Achilles' heel. What are the *most critical unsolved problems* in judge design to make it robust against superhumanly persuasive but untruthful debaters? Is 'learned judge robustness' sufficient, or do we need fundamentally different paradigms (e.g., formal verification, limited domains, human-AI hybrids)?"*

  5.  **Real-World Anchors vs. Abstract Games**  
      *"Theoretical debate often assumes clean, verifiable sub-questions. But real-world questions (e.g., policy impacts, complex scientific hypotheses) involve vast, interconnected knowledge where 'ground truth' is often contested or unavailable at the component level. How does debate handle ambiguity, non-verifiable sub-claims, or domains where even experts disagree? Doesn't this force the judge into making highly subjective 'best guess' evaluations, reintroducing the very alignment problem debate aims to solve?"*

  6.  **Collusion & Non-Adversarial Failures**  
      *"The theory often assumes adversarial debaters. What happens if debaters find ways to subtly *collude* (e.g., both slightly mislead in a way that pleases a biased judge, or both exploit a shared loophole)? Or what about non-adversarial failures – if *both* debaters are honestly mistaken due to a shared data flaw or reasoning blind spot?"*

  7.  **Human Judges in the Loop: Burden or Necessity?**  
      *"Given the risks of judge exploitation by superhuman debaters, is the long-term vision purely AI judges? If so, how do we avoid an infinite regress (who judges the judge?). If humans *must* stay in the loop, how can debate realistically handle the cognitive load and time constraints for complex decisions without becoming practically useless?"*

  8.  **Debate vs. Alternatives: When Does It Shine (or Fail)?**  
      *"Compared to other scalable oversight proposals like recursive reward modeling (RRM) or amplification, what are the *specific problem classes or threat models* where you believe debate has a clear, demonstrable advantage? Conversely, where do you see it being fundamentally outclassed or inappropriate?"*

  9.  **The Path to Deployment: Biggest Hurdles**  
      *"If we imagine deploying debate for real-world oversight of a frontier AI system *tomorrow*, what are the 1-2 biggest *practical, unsolved engineering or alignment challenges* that would make you most nervous? What's the most promising near-term research direction to tackle these?"*

  10. **The Future of Debate: Evolution or Obsolescence?**  
      *"Looking beyond the current paradigm, do you see 'debate-inspired' mechanisms (e.g., adversarial training, iterative refinement under pressure) as a core *component* of future alignment solutions, even if 'pure debate' isn't the final answer? Or is there a risk that focusing on debate distracts from more promising paths?"*

  **Key Interview Tactics:**

  *   **Frame Positively:** Start with "I found the Khan paper fascinating because..." or "The DeepMind follow-up raises really important practical questions about..."
  *   **Listen & Pivot:** If her answer *does* cover new ground or addresses your concern, acknowledge it ("That's a great point about judge scaffolding...") and dive deeper there instead of rigidly sticking to the follow-up.
  *   **Clarify Jargon:** Briefly define terms like "Nash equilibrium" or "complexity class" if needed for internal listeners, but assume your researcher knows them cold.
  *   **Control the Clock:** Be ready to gracefully cut off overly long theoretical explanations: "That's super helpful context. To focus on the scalability point..." or "Given time, let's drill into the judge capability bottleneck you mentioned..."
  *   **End on Vision:** Use Q10 to let her paint a compelling future, leaving the audience energized.

  These questions force engagement with the *current* critiques and empirical ambiguities surrounding debate, moving far beyond the 2018 foundations. Good luck with the interview!
