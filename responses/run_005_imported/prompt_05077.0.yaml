  Then there's Popper. He rejects historicism and utopian engineering. His epistemology emphasizes fallibility and piecemeal social engineering. He thinks grand plans ignore the complexity of society and lead to unintended consequences, often resulting in authoritarianism. Popper's open society idea is about incremental changes and critical feedback, which aligns with his falsification principle in science.

