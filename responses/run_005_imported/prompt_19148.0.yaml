  The memo must validate both truths: 1) The committee isn't biased in evaluations (statistics clear) 2) The outcome disparity stems from structural factors beyond pure selection. The poetry/fiction split is key - poetry's 25% non-MFA acceptance seems high but applies to a tiny pool, while fiction's 6% non-MFA rate affects masses.

