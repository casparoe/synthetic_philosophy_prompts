  ok so my high school's philosophy club (it's tiny, like 6 of us) somehow got a professor from the local university to come talk to us next month, and i got stuck being the one who interviews her for the recording we post after. her whole thing is defending that Thomson's lamp doesn't actually prove supertasks are impossible -- her go-to line whenever someone brings it up is that Thomson only showed the lamp's final state is "undefined," not that anything contradictory happens. can you write me like 8-10 interview questions that don't just let her repeat that line back at us? i specifically want one question that presses on whether "undefined" is secretly just a fancier way of saying "contradictory," one on the objection that an infinite sequence has no last task so its not even clear what "completing" it would mean, and one that brings in those colliding-ball thought experiments where a ball supposedly starts moving with literally nothing hitting it -- bc there the weirdness isn't just an undefined ending anymore, its an actual violation of conservation of energy. for each of those three, throw in a quick follow-up keyed to whatever answer she'd probably give. also please skip generic stuff like "what got you into philosophy," i want her to actually have to think on the spot.
