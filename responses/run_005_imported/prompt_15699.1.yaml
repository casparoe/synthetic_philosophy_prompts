prompt: |-
  I've gotten kind of obsessed with forecasting lately (doing the Metaculus/Manifold thing most nights now, slightly embarassing), and I had my worldview mildly wrecked at a meetup last week. I was showing off a model I'd built by backtesting it against a bunch of historical events to see if it 'would have called' them correctly, and some guy said that's basically meaningless under strict Bayesian conditionalization -- that it's literally the textbook 'problem of old evidence.' His point was that if I already know E happened (P(E)=1 for me at this point), then learning E again can't raise my credence in anything, so backtesting a model against stuff I already know the outcome of can never really support it. That felt like a gut-punch and a trick at the same time, and I havent fully worked out why yet. Could you lay out the most important implications of the old-evidence problem for how someone like me should think about using historical/already-known outcomes to validate a forecasting model? Like, is the whole practice on shakier ground than people assume, and if there's some legit way out of the problem, what does it actually license me to do differently?
