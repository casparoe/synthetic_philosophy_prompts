answer: |-
  ## The Laboratory of Your Lives

  President Chen, esteemed faculty, proud families, and most importantly, the extraordinary Class of [Year] —

  Standing here feels… deeply strange. Good strange, but strange. This place shaped me, filled my head with ideas that still rattle around, demanding attention. Ideas like the ones you encountered in that slightly dog-eared copy of John Dewey’s *The Public and Its Problems* – a book I suspect some of you greeted with the same initial bewilderment I did. And now, I’m supposed to send you off into the world with words that feel… warranted? That’s a Dewey word. We’ll get there.

  The truth is, I said yes to this before truly reckoning with the weight of it. Because what *do* you say? Especially when your own work – my novels – keeps circling back to messy, hopeful, frustrating attempts people make to govern themselves: town meetings where voices shake, co-op boards arguing over leaky roofs, neighbors fighting for their homes. The Dean thought that meant I had something useful to say about Dewey’s ideas. And maybe I do, but fiction lets you explore the *feel* of the struggle, the texture of uncertainty, without always having to land the plane. Standing here? The landing gear is definitely down.

  Because the easy thing would be to give you the Dewey soundbites. “Learning by doing!” “Democracy is a way of life!” True enough. Inspiring, even. But they float untethered without the harder argument Dewey was actually making, the problem he was wrestling with.

  Dewey wasn’t writing in some serene ivory tower. He was writing against a powerful current of his time – the idea that the world had become too complex, too vast, too technical for ordinary people to ever truly grasp it well enough to govern themselves. That the sheer scale of modern problems – industrial might, global connections, intricate systems – meant the “public” was essentially a phantom. A confused crowd, glimpsing only distorted fragments through the haze of distance and propaganda. The logical conclusion? That we needed to hand the difficult decisions over to the experts, the insiders, the specialists who *could* see the whole picture. Honesty, this argument went, meant admitting the public couldn’t possibly be competent.

  **Dewey’s response was profound, and profoundly challenging.**

  He didn’t dismiss the problem. He looked straight at it. Yes, he said, the public *is* confused. Under the weight of industrial society, it *has* become “eclipsed.” People *are* disconnected from the consequences of their actions and the levers of power. The public struggles to even *find* itself, to organize itself meaningfully.

  But his conclusion wasn’t, “So, let the experts run things.” His conclusion was, “So, we need to *change the conditions*.”

  His remedy wasn’t less public, but *better tools* for the public. Better conditions for **communication**. Genuine, open, uncorrupted exchange. And crucially, better structures for **social inquiry** – the collective process of figuring things out.

  This is where Dewey gets really interesting for *you*, right now. Because this “inquiry” he talked about wasn’t some dry, academic exercise. It was how we navigate *uncertainty*.

  Think about it. He described it like this: We find ourselves in an **unsettled, indeterminate situation**. A problem. A confusion. A knot we can’t untangle at first glance. What do we do? We don’t just guess blindly. We don’t wait for absolute certainty (which rarely comes). We form **hypotheses** – ideas about what might be going on, what might work. We trace out the **consequences** – if we do X, what might happen? We test. We observe. We talk it through. We argue. We gather evidence. We listen. We revise our ideas.

  The goal isn’t some final, unshakeable Truth delivered from on high. The goal is **warranted assertibility**. What can we *reasonably* assert, based on the best inquiry we’ve done *so far*? It’s provisional, yes. It demands humility. But it’s *earned*. It’s the opposite of blind faith or cynical surrender.

  **This, graduates, isn't just a theory of democracy. It’s a theory of life.** Especially *your* life, right now.

  You are stepping off this stage into… what? An unsettled, indeterminate situation. Maybe you have a job lined up, maybe you don’t. Maybe you know exactly what comes next, maybe the path ahead feels shrouded in fog. You will face professional uncertainty. Personal crossroads. Relationships that require navigation. Big, daunting questions about who you are and what matters. You will make mistakes. Things will not go according to plan.

  Hear Dewey’s voice in that: **This isn’t failure. This is the material of inquiry.** This is the human condition.

  *   That confusing new job? An unsettled situation. Form hypotheses. What’s really expected? What works here? Test ideas. Trace consequences. Talk to colleagues. Listen. Revise. Seek warranted understanding, step by step.
  *   That strained friendship? An indeterminate problem. What’s really going on? Hypothesize (with empathy!). What happens if I say this? If I do that? Communicate. Gather evidence (not just your own feelings!). Work towards a resolution you can assert with some confidence, knowing it might need revisiting.
  *   Looking at the state of the world – the political fractures, the climate crisis, the sheer complexity that overwhelmed people in Dewey’s time and threatens to overwhelm us now? A vast, collective unsettled situation. It’s easy to feel like Lippmann’s phantom public. It’s easy to think, “This is too big, too hard. Let the experts handle it.”

  But Dewey’s challenge echoes: **Changing the conditions is the task.**

  He pinned his hopes on face-to-face community and uncorrupted communication as the forge where a competent public could be reborn. Standing here, decades later, watching the world you inherit… am I utterly confident those conditions hold in their old form? No. The scale is immense. The channels of communication are often fractured, polluted, weaponized. The “public” feels more eclipsed than ever.

  But here’s what I *am* confident of, graduates: **Surrender to Lippmann’s pessimism – the idea that you, collectively, are simply not up to the task – is not an option.** It’s a self-fulfilling prophecy. Dewey’s core insight remains vital: The remedy for the ailments of democracy *is* more democracy – understood not just as voting, but as the hard, daily, experimental work of collective inquiry.

  So, walk out of this laboratory in democracy holding onto this:

  1.  **Your uncertainty is not weakness; it’s the starting point.** Embrace the unsettled situation. It’s where learning begins.
  2.  **Your method is inquiry.** Hypothesis. Consequence. Communication. Evidence. Revision. Apply it to your career, your relationships, your civic life. Seek warranted assertibility, not impossible certainty.
  3.  **The “public” – that messy, confused, essential “us” – needs you.** It needs your willingness to engage in the experiment. Not with blind faith in easy answers, but with the stubborn commitment to *improve the conditions for figuring things out together.* In your neighborhoods, your workplaces, your virtual spaces, your future families. Start small, but start. Listen fiercely. Speak clearly. Demand better communication. Ask “what happens if?” Trace the consequences *for others*.

  You won’t solve the world’s indeterminacies tomorrow. Dewey didn’t solve them in his lifetime. But you can practice the method. You can be part of the ongoing, imperfect, necessary experiment of building a public capable of governing itself.

  Your life, graduates, is your next great unsettled situation. Approach it not with a demand for a perfect map, but with the tools of inquiry. Test, learn, communicate, revise. Build your warranted path forward, one step at a time, together.

  Congratulations, Class of [Year]. Now go get wonderfully, experimentally, uncertainly, *inquiringly* lost. The laboratory awaits.
