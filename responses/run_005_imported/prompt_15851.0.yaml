prompt: |-
  Okay, weird dilemma - curious what you think. I've been querying literary agents with my novel for almost a year and just got my first offer of representation: decent agent, small agency, and she genuinely seems to love the book. Problem is I've still got a dozen queries out to agents I like even better, no idea if or when any of them will even get back to me, and this agent's only giving me three weeks to decide before she moves on to her next client. Everyone keeps telling me either 'take it, you never know if you'll get another shot' or 'don't you dare sign with the first yes,' and I honestly don't know if there's some actual principled way to think about this or if im just supposed to guess.
