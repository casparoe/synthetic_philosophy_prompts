answer: |-
  ## Dialogue: The Frege-Geach Trench Warfare (Beyond Modus Ponens)

  **Characters:**
  *   **Elena (Expressivist):** Defends a sophisticated hybrid expressivism drawing on Gibbard and Schroeder. Focuses on plans and conative attitudes.
  *   **David (Cognitivist Critic):** Presses the problems of negation and creeping minimalism. Skeptical expressivism retains a substantive difference.

  **Setting:** A corner table in a graduate student lounge, strewn with coffee cups and philosophy journals.

  **(The dialogue starts mid-conversation, after David has just summarized Unwin's negation problem.)**

  **David:** ...so Unwin’s point cuts deep, Elena. It’s not just *embedding* “lying is wrong” in conditionals or disjunctions. It’s that the expressivist toolkit seems fundamentally ill-equipped to capture the *difference* between *rejecting* “lying is wrong” and *accepting* “lying is not wrong.” Blackburn’s attitudes towards attitudes? Gibbard’s hyperplans? They might model *disapproval* of lying versus *lack of disapproval*, but that maps onto *rejecting* the claim versus *withholding judgment*. It doesn’t capture the positive *acceptance* of the *negation* – the judgment that lying is *permissible*. That seems like a distinct, positive state! Your ‘boo!’ model flattens this crucial distinction.

  **Elena:** Okay, David, fair challenge. Let’s put Unwin’s ghost to rest. I agree the early ‘boo/yeah’ expressivism couldn’t handle this. But contemporary views can. Let me sketch my hybrid, leaning on Gibbard’s hyperplans but using Schroeder’s ‘being for’ as a unifying glue. Crucially, *negation* operates on the *plan-laden content*.

  **David:** Alright, walk me through it with a concrete case. Take: “Lying is not wrong.” What state does accepting *this* express, distinct from merely not accepting “Lying is wrong”?

  **Elena:** Start with the atomic normative claim. Accepting “Lying is wrong” expresses a state of *planning to blame for lying*. Following Gibbard, this is part of endorsing a hyperplan – a complete contingency plan for what to feel (blame, anger, etc.) in any conceivable situation. Schroeder helps formalize it: it’s *being for blaming for lying*.

  **David:** And accepting the *negation*, “Lying is not wrong”?

  **Elena:** It expresses *planning *not* to blame for lying*. Crucially, this isn’t just the *absence* of planning to blame. It’s a *positive* plan component: to *withhold* blame, to feel disapproval *is inappropriate* in the case of lying. It’s *being for not blaming for lying*. Think of the hyperplan: it has a specific ‘slot’ for the lying situation, filled with the directive *‘Do not blame!’*. Accepting the negation is endorsing a hyperplan that includes *that* directive for lying.

  **David:** So, the difference between rejecting “Lying is wrong” and accepting “Lying is not wrong” is the difference between…?

  **Elena:** Between *lacking* the plan to blame (your hyperplan is silent or undecided on blaming for lying) versus *possessing* the plan *not* to blame (your hyperplan explicitly says ‘Don’t blame for lying!’). The first is indecision or ignorance about the plan; the second is a settled part of the plan. That *is* a distinct, positive conative state – a commitment to non-blame.

  **David:** Hmm. Alright, that *seems* to mark a distinction. But let’s embed it. Unwin’s own example: “If lying is not wrong, then telling your mother the truth is not obligatory.” How do you handle the antecedent *and* the consequent *and* the conditional link, preserving the force of the negation?

  **Elena:** Good test. First, accept the whole conditional. What state does that express? It’s a complex planning state. Following Gibbard’s later work, conditionals express a *normative constraint* on my hyperplan. Accepting “If P, then Q” means I plan to make my hyperplan *coherent* with respect to P and Q. Specifically, for *this* conditional: I plan that my hyperplan *does not combine* planning *not* to blame for lying *with* planning to feel obligated to tell the truth to one’s mother in relevant situations.

  **David:** Translate from plan-speak.

  **Elena:** Accepting the conditional means I commit to a kind of consistency in my practical/normative outlook: *If* I have the settled plan *not* to blame lying (i.e., I judge lying permissible in this context), *then* I *must* also have the settled plan *not* to feel obligated to tell the truth to Mom in that same context. It rules out hyperplans that contain both the ‘don’t blame lying’ directive and the ‘feel obligated to tell Mom the truth’ directive simultaneously. The negation in the antecedent (“not wrong”) is handled as the positive plan *not* to blame, as before. The negation in the consequent (“not obligatory”) is handled similarly: planning *not* to feel obligated.

  **David:** So the entire complex sentence expresses a constraint against having a certain *pair* of conative states (planning non-blame for lying AND planning obligation for truth-telling to Mom)? And the Frege-Geach worry is solved because this constraint-state can itself be embedded in larger structures like modus ponens or disjunctions, using the same logic of plan coherence?

  **Elena:** Exactly. The ‘content’ expressed is always a complex conative state – plan endorsements or constraints thereon. The logical operators operate on the *structure* of these plan components, ensuring coherence. Negation flips the valence of the specific directive (blame -> don't blame, feel obligated -> don't feel obligated) within the hyperplan framework.

  **David:** I’ll grant, provisionally, that this *might* technically handle the embedding, including negation, without collapsing into descriptivism *at the formal level*. But this leads me directly to Dreier’s charge. Look at the machinery you’ve invoked: ‘plans’, ‘hyperplans’, ‘coherence’, ‘constraints’, ‘states’, ‘endorsing’. You talk about the *content* of the plan, the *directive* it contains. You’ve essentially built a *semantics* for normative language using these plan-theoretic concepts. It looks suspiciously like you’re *describing* these complex planning states.

  **Elena:** No, the *expression* relation is still fundamental. Uttering “Lying is not wrong” *expresses* my state of planning not to blame; it doesn’t *describe* it. The semantic values *are* these states.

  **David:** But that’s where creeping minimalism kicks in! Once you’ve built this elaborate structure, what does your ‘expression’ buy you that a minimalist cognitivist can’t capture? The minimalist cognitivist says: “Lying is not wrong” is *true* iff lying is not wrong. But they add: ‘wrong’ refers to a property, but it’s a *minimal* property. ‘True’ is disquotational. The *substance* comes from the underlying metaphysics – maybe naturalism, maybe non-naturalism. But your view now seems isomorphic.

  **Elena:** The difference is in the *fundamental nature* of the property or the state! The cognitivist thinks ‘wrongness’ is a *property in the world* that our judgments *track* or *represent*, however minimally understood. The *direction of fit* is mind-to-world. My expressivism says the state expressed – the planning state – is *constitutive* of the judgment. The ‘property’ of wrongness, such as it is, is *projected from* or *constituted by* our planning attitudes. The direction of fit is world-to-mind; the plan aims to make the world fit it. *That’s* the anti-realist core.

  **David:** But how does that manifest *in the theory of meaning* you just gave me? When you say “Lying is not wrong” expresses planning-not-to-blame, and the minimalist cognitivist says it’s true iff the minimal property of wrongness is not instantiated by lying… what *observable difference* is there in their theories of meaning or logic? Both assign complex, logically structured contents. Both validate the same inferences (modus ponens, negation rules, etc.). Both use notions like ‘consistency’ and ‘inconsistency’ (your ‘plan coherence’ vs. their ‘truth-conditional consistency’). You’ve mimicked the *logical structure* of realism so perfectly that the *only* difference seems to be a metaphysical footnote about the ultimate nature of the properties or states – a footnote that does no work in explaining the meaning or logic of the language itself.

  **Elena:** The work it does is *explanatory priority*. The expressivist explains the *function* of moral language first and foremost: its job is to coordinate plans and express conative commitments. The logical structure *supervenes* on the requirements for coordinating these non-representational states. The cognitivist starts with truth-conditions and representation. The minimalist cognitivist *can* adopt the disquotational platitudes, but they still see the core function as *representing* normative reality, however minimal. We see it as *expressing* and *prescribing*.

  **David:** But if the minimalist cognitivist adopts a ‘plan-theoretic’ *reduction* or *analysis* of the normative properties – saying ‘wrong’ just *means* ‘such that we plan to blame for it’ – haven’t they just *become* an expressivist? Or conversely, if your expressivism allows that the planning states *correspond* to minimal truth-conditions (e.g., “Lying is wrong” is true iff I plan to blame for lying), haven’t you just *become* a cognitivist? The lines blur. Dreier’s point is that the sophisticated expressivist’s ‘expression’ and the minimalist cognitivist’s ‘minimal representation’ start to look like notational variants when the logical structure is fully accommodated. Where’s the substantive disagreement *in the philosophy of language* once you’ve solved Frege-Geach?

  **Elena:** The substantive disagreement is about *what we’re doing when we think and talk normatively*. Are we describing features of the world, even minimally? Or are we expressing practical, action-guiding commitments? The minimalist cognitivist *must* say we are describing – describing minimal facts constituted by our attitudes, perhaps, but still *describing*. The expressivist denies that description is the primary function. The difference shows up in how we explain *why* the logic works: for us, it’s norms of plan coherence; for them, it’s norms of truth-preservation applied to minimal representations. It shows up in how we explain disagreement: for us, it’s conflict in plans; for them, it’s conflict in beliefs (even if the beliefs are about minimal properties). It shows up in the *metaphysical commitments*: we deny there are normative properties *antecedent to* our planning; they affirm them, however minimal.

  **David:** But if the minimalist cognitivist adopts a *reductive naturalism* about those minimal properties, identifying them *with* the planning states themselves, then their ‘description’ *is* the description of our conative states. And your ‘expression’ *is* the expression of those same states. The functional role of the utterance seems identical: to convey and coordinate on planning states. The only difference is whether we call the semantic relation ‘expression’ or ‘minimal description of a minimal property constituted by the state expressed’. That’s vanishingly thin. It looks like the entire expressivist project, after solving the embedding problems, collapses into a terminological variant of a particular *kind* of cognitivism – a reductive, naturalistic, minimalist cognitivism. The anti-realist punch is gone; you’ve just offered a specific metaphysics *within* the cognitivist framework.

  **Elena:** No! That misconstrues the expressivist’s foundational claim. Even if the minimalist cognitivist *reduces* the property to the planning state, they still treat the *judgment* as a *belief* with a *mind-to-world* direction of fit – a belief *about* that state (or the property it constitutes). The expressivist insists the judgment *just is* the planning state itself, with a *world-to-mind* direction of fit. The cognitivist analysis treats the attitude as part of the *content* (the property believed); the expressivist treats the attitude as the *mode* (the expressing). *That* distinction – the attitude/content distinction applied to normative thought – is where the rubber meets the road. We deny that normative judgments have a representational, belief-like attitude at their core; they have a conative, plan-like attitude. *That* is what separates us, even after solving Frege-Geach and granting minimalist talk. The minimalist cognitivist smuggles in the belief-attitude at the foundational level; we reject it.

  **David:** And yet… your entire solution *relies* on treating the conative states *as if* they were propositional contents with logical structure – contents that negation operates on, that can be antecedents of conditionals, that stand in coherence relations. You’ve functionally *recreated* the belief-attitude structure *for planning states*. You have ‘acceptance’ of plan-content. You have logical relations *between* plan-contents. It walks, talks, and quacks like belief-desire psychology, just with all the ‘desires’ (or plans) promoted to bearers of logical structure. The ‘mode’ has been semanticized. The distinction feels like it’s clinging to a label – ‘expression’ vs. ‘minimal belief’ – over what is, in practice, the same complex functional role. The fear is that the sophisticated expressivist, in building a structure robust enough to handle logic, has inadvertently built a cognitivist Trojan horse. The negation problem might be technically solvable, but the cost might be the soul of expressivism itself.

  **Elena:** Then the soul of expressivism is the insistence that the *fundamental explanation* of why this logical structure applies is rooted in practical, not theoretical, rationality. That the ‘contents’ are inherently prescriptive, not descriptive, even when semantically complex. That the ‘truth’ predicate, if used, is a device for generalizing plan-laden content, not a robust representational notion. The difference may be subtle, David, but it’s not merely terminological. It’s about the *kind of mind* we think we have when we engage in normative thought. Is it fundamentally a mind tracking features of the world, or fundamentally a mind making plans for it? Solving Frege-Geach doesn’t erase *that* question; it just forces us to answer it at a deeper level of theoretical sophistication. The minimalist cognitivist hasn’t *won*; they’ve just shown expressivism must be more subtle than a simple ‘boo!’. But the core commitment – the denial that normative judgment is fundamentally a species of *description* – remains.

  **David:** (Leans back, frowning) Subtle indeed. And perhaps too subtle to bear the weight of the anti-realist conclusions you want to draw from it. If the functional roles are isomorphic, and the metaphysics minimal on both sides, the claim that expressivism offers a fundamentally *different* picture starts to look like a matter of emphasis rather than substance. But… (pauses)… I see your point about the attitude/mode distinction. It’s a lifeline. Whether it’s strong enough to pull expressivism clear of the minimalist vortex… that’s the real battleground now. The textbooks might declare victory on modus ponens, but down here in the trenches, with negation and minimalism, the war over the soul of normative judgment is far from settled.

  **(The dialogue ends with both parties recognizing the depth and unresolved nature of the disagreement, centered now on the viability of the attitude/content distinction and the explanatory primacy of practical vs. theoretical rationality in the face of sophisticated semantic structures.)**
