prompt: |-
  So I've been down a research rabbit hole for a story collection I'm slowly putting together, and I keep getting stuck on Henry Sidgwick -- not the utilitarian of the ethics textbooks, but the version of him who spent the better part of two decades, on and off as president, running the Society for Psychical Research: testing children for telepathy, mailing surveys out to seventeen thousand strangers asking whether they'd ever had a vivid hallucination of someone who wasn't actually there. What gets me is that this wasn't a hobby for him, it was almost load-bearing -- his big ethics book ends by more or less admitting that without some kind of moral order to the universe, egoism and morality don't actually line up, and he couldn't let that go, so he went and tried to find the evidence himself, as rigorously as he could manage, and by his own account kept coming up short (the Creery sisters case especially, the SPR's star piece of evidence for thought-transference, until the girls turned out to be signalling to eachother with a code).

  I want to turn that into a short story but keep circling a version that's just spooky-Victorian-séance pastiche, which isn't what I'm after. Could you write me one -- something in the 1000-1500 word range, doesn't have to use Sidgwick's actual name if it's easier to invent a stand-in, but I want the protagonist to be that specific type: a rigorous, self-doubting investigator in exactly that period, in the middle of running one of these experiments. Don't have anyone explain the philosophy out loud -- I want the dread of it, the sense that he needs this evidence to hold his own ethics together and is half-expecting to catch someone cheating again, sitting underneath the scene rather than spelled out. It doesn't need a tidy ending; I don't think the real history gave him one either.
reasoning: |-
  Okay, the user wants a short story inspired by Henry Sidgwick's psychical research work. They're clearly deep in research about this historical figure who balanced academic rigor with desperate hope for supernatural evidence to resolve his ethical crisis. 

  Hmm, their frustration with "spooky-Victorian-séance pastiche" suggests they want psychological depth over genre tropes. The core tension they identified is fascinating: a man conducting scientific experiments while secretly needing them to fail (to preserve intellectual honesty) and yet needing them to succeed (to save his moral framework). 

  I notice they specifically forbid explaining the philosophy aloud - that's a great constraint. The terror should come from unspoken implications. The Creery sisters deception they mentioned is perfect dramatic material; that moment when hope collapses into mundane trickery. 

  For setting, Sidgwick's actual SPR office feels right - wood panels, gaslight, the Victorian obsession with documentation. The "dread" they want could manifest as physical sensations: ink-stained fingers trembling, the weight of unanswered surveys. 

  Protagonist name... maybe "Aldermere"? Sounds suitably Victorian academic. His internal conflict should bleed into every action: how he handles the cards (tools of science that might become relics of delusion), how he watches the sisters (hope warring with suspicion). 

  The ending shouldn't resolve. Perhaps closing on him alone with his ethics book, the words blurring as rain hits the window - the universe refusing to answer either his experiments or his philosophy. That feels true to Sidgwick's actual life. 

  Key image: the ledger where he records failures. Each entry is a brick in the wall between him and the moral order he craves. The moment when he almost thinks he sees something real - then catches the code signal - that's the soul-crushing turn. 

  Must resist over-writing the séance elements. Keep it grounded in paperwork and fatigue. The real horror isn't ghosts, but the possibility that decency requires self-delusion. That's what'll haunt the reader.
answer: |-
  The gas lamps hissed in Professor Aldermere’s study, casting long, wavering shadows that seemed to cling to the corners like cobwebs. The air smelled of dust, old paper, and the faint, metallic tang of the London fog seeping under the door. Aldermere himself sat at his broad mahogany desk, not poring over ethics texts tonight, but meticulously arranging a deck of Zener cards – circles, squares, wavy lines, crosses, stars. Five simple symbols, repeated endlessly. Tools of the trade.

  Across the room, perched on a stiff-backed sofa, sat the Carrington sisters: Agnes, fifteen, eyes wide and earnest; Beatrice, thirteen, fingers nervously pleating her skirt; and little Clara, ten, swinging her legs, humming softly. Their mother, a woman whose face seemed perpetually pinched with a mixture of hope and anxiety, hovered near the door. They were the latest possibility. Village girls from Suffolk, whispered about for uncanny shared thoughts, predicting small events. Aldermere had brought them to London, housed them respectably, all at the Society’s expense. Rigour demanded it.

  "Right then," Aldermere said, his voice carefully neutral, betraying none of the familiar, leaden dread settling in his stomach. "The same as yesterday. Agnes, you’ll be the sender. Focus entirely on the card I show you. Project it, if you can. Beatrice, Clara, you are the receivers. Clear your minds. Speak the first symbol that comes to you, clearly and immediately. No conferring. No hesitation."

  He caught Mrs. Carrington’s eye. She gave a tight, encouraging nod. He looked away, focusing instead on the stack of cards, the blank ledger open before him. Page after page of similar entries. Dates. Times. Names. Symbols sent. Symbols received. Columns of neat, precise ink strokes, recording failure upon failure, ambiguity upon ambiguity. Seventeen thousand surveys returned, a statistical ocean of grief and coincidence, whispers and waking dreams, but nothing… *solid*. Nothing that could withstand the cold, logical glare he knew was necessary.

  *Without a moral order…* The unspoken conclusion of his own life’s work echoed in the silence between the hissing lamps. *Egoism and duty diverge.* The thought was a physical ache, a void beneath his ribs that the warmth of the study couldn’t reach. This work wasn't curiosity. It was excavation. He was digging in the dark, seeking a foundation stone for a collapsing edifice.

  He picked up the first card. A star. He held it aloft, facing Agnes. "Concentrate, Agnes."

  The girl screwed up her face, staring at the card as if willing it to burst into flames. Aldermere watched her, then shifted his gaze to Beatrice and Clara. Beatrice had closed her eyes, lips moving silently. Clara had stopped humming, her brow furrowed in intense, almost comical, concentration.

  "Now," Aldermere said softly.

  "Star," breathed Beatrice, opening her eyes.
  "Star!" chirped Clara, almost simultaneously.

  Aldermere’s pen scratched against the ledger. *Star sent. Star received (B). Star received (C).* A perfect hit. A flicker, tiny and treacherous, ignited in his chest. He stamped it out. Coincidence. Probability. One in twenty-five.

  Next card. A square. Agnes stared.
  "Square," murmured Beatrice.
  "Square!" Clara declared.

  Another hit. Aldermere recorded it. His fingers felt stiff. The dread wasn’t just the fear of failure anymore; it was the fear of *this*. The fragile hope, the desperate desire to see a pattern emerge from the noise. He remembered the Fenton twins, two years prior. Such promise. Until he’d observed the subtle tap of a foot against the floorboards, a pre-arranged signal. The crushing banality of deceit. He’d almost preferred the blank ledgers.

  Circle. Sent.
  "Circle," Beatrice.
  "Wavy lines?" Clara sounded uncertain.

  Aldermere noted the discrepancy. *Circle sent. Circle received (B). Wavy lines received (C).* Back to normal. The flicker died. He showed the wavy lines card.

  "Wavy lines," Beatrice said confidently.
  "Cross?" Clara ventured, tilting her head.

  Another miss. Aldermere felt a perverse sense of relief, immediately followed by shame. Was he rooting against his own experiment? Against the possibility that would shore up his crumbling world? He needed truth, but what if the only truth was emptiness?

  The session continued. Hits sprinkled amongst misses. Agnes grew visibly tired, her concentration flagging. Beatrice became hesitant. Clara fidgeted. Aldermere felt the familiar exhaustion settle into his bones, the weight of expectation – the Society’s, the Carringtons’, his own crushing, silent need. He showed a cross.

  Agnes blinked, rubbing her eyes. Beatrice closed hers again, deep in thought. Clara… Clara was looking not at Agnes, but slightly past her, towards the heavy damask curtains drawn against the night. Her gaze seemed unfocused, then sharpened for a fraction of a second. Aldermere followed her line of sight. Nothing. Just shadowed fabric.

  "Cross?" Beatrice whispered, sounding unsure.
  "Cross!" Clara announced, bright and clear.

  Aldermere recorded it. *Cross sent. Cross? received (B). Cross received (C).* He stared at the entry. Clara’s certainty. That flicker of her gaze. It was nothing. Fatigue. A trick of the gaslight. He’d imagined it. He *had* to have imagined it. The alternative – another mundane betrayal – was unbearable. Yet the suspicion, cold and sharp, pricked him. Had she seen a reflection? A stray gleam? Had Agnes, exhausted, given some infinitesimal, unconscious cue?

  He forced himself to continue. Showed a star. Agnes sighed. Beatrice mumbled, "Wavy lines?" Clara, who had been looking down at her hands, glanced up quickly – not at Agnes, but towards the same spot near the curtains. Aldermere’s heart hammered against his ribs. He strained to see. Was there a chink in the drapes? A sliver of streetlamp?

  "Star," Beatrice said, faintly.
  "Star!" Clara echoed, her eyes darting back to Aldermere, wide and innocent.

  *Star sent. Wavy lines? received (B). Star received (C).*
  The pattern was there. Not telepathy. A signal. Clara was looking for something. Something near the curtains. Aldermere felt the void beneath his ribs yawn wider, threatening to swallow him. Not emptiness, but the far worse discovery of scaffolding built on sand. Again.

  He placed the next card face down on the desk. "That will be all for tonight," he said, his voice remarkably steady, though his hands trembled slightly as he gathered the deck. "You’ve done well. Mrs. Carrington, if you’d be so kind?"

  The woman ushered her daughters out, Agnes looking relieved, Beatrice subdued, Clara skipping slightly. The door closed, leaving Aldermere alone in the suddenly oppressive silence. The hissing gas was the only sound. He didn’t move towards the curtains immediately. He sat, staring at the closed ledger. The neat columns of symbols, the carefully documented failures, and now, the unrecorded suspicion coiling in his gut like smoke.

  He pushed back his chair. The wood groaned. He walked slowly to the window. The heavy damask curtains felt cold and slightly damp. He ran his fingers along the edge where they met. Nothing. He pulled them apart roughly. Behind them, the tall casement window looked out onto the rain-slicked street, reflecting the distorted glow of the gas lamps below. He examined the frame, the latch, the glass. All solid. Sealed against the fog.

  Then he looked down. On the deep windowsill, nestled almost invisibly against the dark wood and darker fabric, lay a small, polished brass button. It was utterly mundane. A spare from a coachman’s coat, perhaps, dropped by a servant. Meaningless.

  But Aldermere picked it up. It was cool in his palm. He held it up to the lamplight. Its curved surface caught the glow, creating a tiny, intense point of reflection. He moved his hand slightly. The point of light danced across the wallpaper, across the empty sofa where Clara had sat.

  He walked back to the sofa, sat where Clara had been. He angled the button. The point of light settled on the back of the chair where Agnes had been seated. Not directly visible to Aldermere at his desk, obscured by Agnes’s body and the angle. But perfectly visible to Clara, sitting diagonally across. A tiny, brilliant star in the gloom.

  He closed his fist around the button, its edges biting into his palm. The dread wasn't sharp anymore. It was a vast, cold ocean, rising around him. Not the dread of the supernatural, but the crushing, inevitable dread of the ordinary, the human, the flawed. The evidence wasn't absence. It was this small, cold disc of brass, a testament to the ease of deception and the desperation of belief. He pictured the Carringtons returning to Suffolk, the Society’s funds exhausted, their small fame fading into village rumour. He saw his ledger, another entry to be made: *Session 17: Results inconclusive. Further observation required?*

  Aldermere walked back to his desk. He placed the brass button beside the stack of Zener cards. He didn’t open the ledger. Instead, his gaze drifted to the bookshelf, to the imposing spine of his own masterwork, *The Principles of Rational Ethics*. The gold lettering gleamed dully in the gaslight. He knew the final chapter by heart. The elegant, devastating argument that led to the precipice… and offered no bridge across.

  The rain tapped harder against the window pane. The void beneath his ribs wasn't just an absence of evidence. It was the shape of the universe itself, vast, indifferent, and utterly silent. He picked up a single Zener card – a star – and held it, staring not at the symbol, but through it, into the encroaching dark beyond the lamplight. The experiment wasn't over. It never would be. But the button, cold and undeniable on the polished wood, felt heavier than any ledger, heavier even than the book that had started it all. He sat, motionless, as the gaslight hissed and the shadows deepened, waiting for nothing, and dreading everything.
