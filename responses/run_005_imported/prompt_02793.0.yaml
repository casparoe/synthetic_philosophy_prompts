  Key pivot: Marcus should explicitly frame "phenomenal" as an *introspective construct* rather than a brute fact. That forces Clara to confront whether her "ineffable redness" is just how her brain *models* its own processing. The ending should linger on the definitional rift—Clara clinging to first-person authority, Marcus treating it as another cognitive output.

