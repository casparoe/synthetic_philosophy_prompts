answer: |-
  That's a fascinating rabbit hole, and your intuition that there's a disconnect is understandable. However, Sidgwick's psychical research wasn't just a quirky hobby divorced from his philosophy – it was deeply, almost tragically, intertwined with his core ethical concerns and his profound intellectual anxiety. Here's the connection you might be missing:

  1.  **The Fundamental Problem: The Foundation of Ethics:** Sidgwick's *Methods of Ethics* brilliantly dissected different ethical systems (Intuitionism, Egoistic Hedonism, Universalistic Hedonism/Utilitarianism). He concluded that Utilitarianism (maximizing overall happiness) was the most rational system *if* one accepted the principle of universal benevolence. However, he hit a devastating wall: **The Dualism of Practical Reason**.
      *   **The Dualism:** Sidgwick couldn't find a rational way to reconcile the demands of **Rational Egoism** (maximizing one's *own* happiness) with **Rational Benevolence** (maximizing *general* happiness). Why should a rational individual sacrifice their own good for the greater good if there's no ultimate reward or punishment? Reason alone seemed unable to bridge this gap.

  2.  **The Need for Cosmic Justice & Sanctions:** Sidgwick, deeply influenced by his Anglican upbringing and the crisis of faith common among Victorian intellectuals, saw the potential solution in **theistic belief**. If a benevolent God existed who enforced cosmic justice (rewarding virtue and punishing vice, potentially in an afterlife), then:
      *   The Dualism *could* be resolved: Acting benevolently *would* ultimately align with one's own long-term self-interest (eternal happiness).
      *   Utilitarianism would have a secure foundation: A divine order could guarantee that maximizing happiness was the ultimate purpose and that moral effort wasn't futile.

  3.  **The Crisis of Faith and the Search for Evidence:** Sidgwick lost his conventional Christian faith as a young man. He couldn't accept dogma without evidence. **Psychical research became his empirical quest for evidence of the transcendent.** He wasn't looking for spooky thrills; he was desperately seeking *scientific proof* for:
      *   **The Survival of Bodily Death (Immortality of the Soul):** Proof of an afterlife would provide the necessary framework for cosmic justice.
      *   **The Existence of Non-Physical Intelligence (God/Spirits):** Evidence of higher intelligences could point towards a divine order.
      *   **Telepathy:** Evidence of non-physical connection between minds could undermine strict materialism and support the possibility of a non-physical soul/spirit.

  4.  **Psychical Research as an Extension of His Method:** This wasn't credulous gullibility; it was **Sidgwickian rigor applied to the most important question.** He co-founded the SPR specifically to apply the strictest scientific methods to these phenomena:
      *   **Systematic Investigation:** Debunking frauds, designing controlled tests, demanding evidence.
      *   **Skeptical But Open:** He approached it with profound skepticism but felt the stakes were so high that the possibility *had* to be investigated rigorously. As he famously lamented, without such evidence, ethics felt like being "in a pitiable position… in a chaos of conflicting intuitions" or "a Babel of discordant moral intuitions."
      *   **Personal Anguish:** His letters reveal deep personal despair over the lack of conclusive proof. It wasn't a hobby; it was an existential quest. He wrote about the "deeply painful" burden of doubt and the hope that psychical research might lift it.

  5.  **The Link to EA's Roots (via Parfit & Uncertainty):** While Sidgwick himself found no conclusive proof (leaving him in a state of unresolved anxiety), his struggle highlights a key theme relevant to EA:
      *   **The High Stakes of Foundational Uncertainty:** Sidgwick understood that if there's *no* cosmic justice or afterlife, then the utilitarian project rests on shakier, purely secular grounds (social cohesion, evolved sympathy). This amplifies the importance of getting ethics *right* in *this* life, as it might be all we have. EA's focus on maximizing impact in an uncertain, potentially godless universe echoes this secular urgency.
      *   **Rational Scrutiny of Seemingly "Weird" Areas:** Sidgwick's willingness to rigorously investigate *anything* that might bear on the fundamental questions of existence and ethics, even if it seemed fringe, prefigures EA's emphasis on following the evidence and being willing to question deeply held assumptions or explore unconventional cause areas (e.g., AI risk, animal welfare, x-risks) if the stakes are high enough. Derek Parfit, whose *Reasons and Persons* is deeply influenced by Sidgwick and is foundational for modern EA, explicitly grappled with Sidgwick's dualism and the implications of a purely secular ethics.

  **In Conclusion:**

  You're right that it *looks* bizarrely incongruous: the hyper-rational architect of utilitarian ethics spending decades testing mediums. **But it wasn't a disconnect; it was a desperate, rigorously pursued attempt to solve the foundational crisis *within* his ethical system.** The ghost-hunting wasn't separate from the ethics; it was a direct, methodical, and ultimately heartbreaking attempt to find an empirical basis for the cosmic justice he felt was necessary to make his utilitarianism rationally compelling and psychologically sustainable. He wasn't a credulous sucker in his spare time; he was a profound thinker applying his formidable intellect to the most existentially vital question his own philosophy raised. The tragedy is that he died still seeking the evidence he felt he needed.

  **For your longread:** This connection adds incredible depth. Sidgwick's psychical research reveals the profound *existential anxiety* underlying his rationalist utilitarianism – an anxiety about the very foundation of morality without God or an afterlife. This context makes his utilitarianism, and thus a root of EA, not just a cool calculation, but a response to a potentially terrifying cosmic indifference, pursued with both intellectual rigor and deep personal anguish.
