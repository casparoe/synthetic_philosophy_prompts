answer: |-
  Your dilemma cuts to the heart of historical truth, narrative, and the ethics of representation – and philosophers *have* grappled intensely with these questions. Your instinct about "truth of the person" vs. "truth of the record" is remarkably perceptive. Here's a breakdown of the relevant philosophical concepts and how they apply to your agonizing choice:

  1.  **Verisimilitude (Truthlikeness):** This is the *precise* concept philosophers developed to address your core question: *Can one false account be "closer to the truth" than another?*
      *   **The Problem:** As you note, if both accounts contain falsehoods, declaring one "truer" seems subjective. Early theories (like Popper's) struggled with this.
      *   **Refined Approaches:** Later work (e.g., by Tichý, Oddie, Niiniluoto) argues that verisimilitude *can* be assessed, even with false statements. Key ideas relevant to you:
          *   **Content and Consequence:** An account A is closer to the truth than account B if:
              *   A includes *more true statements* (or more significant true statements) than B.
              *   A includes *fewer false statements* (or less significant false statements) than B.
              *   The *consequences* of A (what it logically implies) include more truths and fewer falsehoods than the consequences of B.
          *   **"Nearer the Truth of the Person":** This is crucial. Your instinct highlights that truth isn't just about discrete facts (dates, specific words spoken), but about capturing the *essence* – the character, motivations, impact, and meaning of a person and their life.
          *   **Applying it to Your Case:**
              *   **Memoir-Biography:** May get specific facts (dates, exact dialogue) *wrong*. However, if it accurately captures her core motivations (recklessness driven by passionate conviction, loyalty as a defining trait), her emotional reality, her *effect* on her comrades (inspiring adoration), and the *meaning* of her actions and sacrifice within the Resistance context, it possesses high verisimilitude regarding the *person*. Its falsehoods are about specific details, not necessarily the core character and motivations.
              *   **Academic Biography:** Gets specific facts *right* (corrected dates, documented actions). However, if its *interpretation* of those facts (portraying her as cold, ambitious) is a misrepresentation of her core character and motivations, then despite factual accuracy on details, it might possess *lower* verisimilitude regarding the *essential truth of the person*. It accurately describes *what* happened (the record) but potentially misrepresents *why* it happened and *who* she was at her core. The falsehood here is deeper – a potential misinterpretation of character itself.

  2.  **The Epistemology of Testimony & Bias:**
      *   **The Comrade's Memoir:** Its errors are evident (invented scenes, wrong dates, hagiographic tone). BUT, this source offers something irreplaceable: **first-hand, emotionally engaged testimony.** The comrade *knew her*, witnessed her impact, and understood the emotional and moral context of the Resistance in a way archival records cannot capture. While biased by affection and the desire to create a martyr, this bias doesn't automatically negate the underlying truth of the *character traits* he observed. His "inventions" might be attempts to *dramatize* truths he felt deeply but couldn't document factually. The "psychologically coherent person" you discern through the factual noise suggests he captured something real about her essence.
      *   **The Academic Biography:** Its rigor in correcting factual errors is vital. However, academic history has its own potential biases:
          *   **The Bias of the Record:** Police records, interrogation transcripts, and even some archives are created by the *oppressor*. They capture actions through a lens of suspicion, often misinterpret motivations (attributing resistance to ambition or venality rather than conviction), and lack the internal perspective. Relying heavily on these risks accepting the occupier's framing.
          *   **The Bias of Detachment:** Academic rigor sometimes demands a skepticism that can inadvertently dismiss genuine emotional reality or moral conviction as naivete or mask deeper motives. The "cold and calculating" interpretation might stem from applying modern, detached analytical frameworks to an extreme, high-stakes, emotionally charged context where idealism and recklessness *were* common and real.
          *   **Over-Correction:** The need to dismantle the earlier "martyr" narrative might lead to an equally unbalanced interpretation in the opposite direction.

  3.  **Virtue Epistemology & Understanding Persons:**
      *   Philosophers like Linda Zagzebski argue that understanding persons is different from understanding facts. It requires **intellectual virtues** like empathy, perceptiveness, and the ability to grasp character.
      *   **Your Instinct as an Intellectual Virtue:** Your perception that the comrade's account yields a "psychologically coherent person" whose traits "hang together" suggests it offers a *unified understanding* of her character. This coherence, even woven with some factual errors, might be evidence of a deeper grasp of her *as a person* than the academically rigorous account, which, while factually precise on events, presents a character interpretation that feels disjointed or implausible to you. Your struggle against simply choosing the "dramatically satisfying" option shows intellectual honesty – a key virtue here.

  **Traction for Your Case:**

  1.  **"Closer to the Truth" is Defensible:** Yes, philosophers provide frameworks (Verisimilitude) for arguing that one account *can* be closer to the truth than another, even when both contain falsehoods. Your distinction between "truth of the person" and "truth of the record" is a powerful application of this.
  2.  **Prioritizing the "Truth of the Person" is Justifiable (Especially for a Novel):** For a novel aiming to capture the *human experience* of this woman, verisimilitude regarding her character, motivations, and emotional reality is arguably *more important* than verisimilitude regarding every date or specific word uttered. The comrade's account, despite its flaws, likely offers superior access to this dimension.
  3.  **Your Instinct Isn't (Necessarily) Self-Deception:** Your recognition of the memoir's factual errors shows critical awareness. Your sense of psychological coherence isn't just dramatic preference; it's an intellectual judgment about character plausibility formed by immersing yourself in the material. The academic biography, while correcting facts, might introduce a *different kind* of error – a misinterpretation of character based on a potentially flawed reading of biased records or an overly cynical framework. Your hesitation about its portrayal is epistemologically significant.
  4.  **The Academic Work is Still Vital:** It provides the essential scaffolding of verifiable events and corrects demonstrable errors. It prevents the novel from straying into pure fantasy. It highlights the contested nature of her story. Use it to ground the *events* while letting the *characterization* be guided by the psychologically coherent core derived from the memoir, critically filtered.
  5.  **The "Better Novel" Advice - A Partial Truth:** Your friend is pragmatically correct that the novel's needs matter. However, your sleepless nights reveal a deeper ethical and epistemological commitment. Using the version with higher verisimilitude regarding the *person* (the memoir-based core) isn't *just* about a better novel; it's an argument about *which account better honors the likely reality of who she was*.

  **A Way Forward for the Novel:**

  1.  **Anchor in the Coherent Core:** Build the emotional architecture and character motivation primarily from the psychologically coherent person you discern in the *first* biography. This seems to be the "truth of the person" you resonate with and find defensible.
  2.  **Respect the Corrected Record:** Integrate the factual corrections from the academic biography meticulously for the *events* – the timeline, the operational details, the circumstances of her capture and death. Let the academic rigor shape the *plot* and the *external pressures*.
  3.  **Acknowledge the Dissonance (Perhaps Explicitly):** The conflict between the sources *is part of her story and her legacy*. Could this tension be woven into the novel itself? Perhaps through the perspectives of different characters, or even in an author's note? This acknowledges the complexity of historical truth.
  4.  **Justify Your Choice (to Yourself):** Articulate clearly *why* you believe the comrade's account of her *character* holds more verisimilitude despite its factual flaws. Point to the coherence, the context of the Resistance, the nature of the sources he *did* have access to (personal experience), and the potential pitfalls of the academic source's interpretation.

  **Conclusion:** Your instinct is philosophically defensible. Verisimilitude allows us to say that an account getting core aspects of *character* right (like motivation, impact, essential traits) can be "closer to the truth" of a *person* than an account that gets minor facts right but misinterprets the fundamental nature of who they were. The comrade's memoir, filtered through your critical understanding and corrected by the academic record where necessary, likely offers the best path towards honoring both the factual reality of her actions and the essential truth of the person who performed them. Your struggle isn't self-deception; it's the mark of a conscientious historian and novelist grappling profoundly with the elusive nature of truth in human lives.
