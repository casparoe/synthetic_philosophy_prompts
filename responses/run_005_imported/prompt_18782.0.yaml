  Here’s a scene draft focusing on the philosophical clash, escalating tension, and emotional subtext. Neither character "wins," but both reveal deeper layers:

  **Setting:** James’ (professor) study, evening. Bookshelves loom. Rain streaks the windows. He sits rigidly in his worn armchair, facing Sarah, who’s perched anxiously on the sofa edge. A single malt sits untouched between them.

  **(Scene Start)**

  **James:** (Voice tight, rehearsed) "Sarah, listen. We both know the diagnosis. But this grief... yours, everyone’s... it’s misplaced. *I* won’t suffer. Epicurus had it right centuries ago. Death is nothing to us. When we exist, death is not; when death exists, we do not. No subject, no harm. The badness you feel is *yours*, not mine. Spare me the pity."

  **Sarah:** (Leans forward, eyes fierce, not sad) "Spare you? James, this isn't pity. It's fury. Fury at this... *detachment*. You’ve taught Epicurus for thirty years, fine. But you taught Nagel too. You taught us the *deprivation account*. Death *is* bad precisely because of what it *takes away* – the future you should have had. The books unwritten, the walks un-taken... *us*, growing old and bickering." Her voice cracks slightly. "That loss *belongs* to you."

  **James:** (A flicker of irritation) "Belongs to a ghost? Where does this alleged harm *reside*, Sarah? Pinpoint it for me. Before I die? Am I harmed *now* by a future absence? That’s absurd. I’m alive *now*. After I die? Who’s there to be harmed? A corpse? Dust? The harm has no temporal address. It’s conceptually incoherent." He gestures dismissively. "Epicurus stands."

  **Sarah:** (Quickly, seizing the opening) "Exactly! The *timing puzzle*! You love logic, James. Apply it. *If* deprivation is harm – and deep down, you know it is, or why fight the treatment? – *then* when does that harm occur? Not before, not after. So? Does it hang in some metaphysical limbo? Or..." (She pauses, eyes locked on him) "...does the puzzle *itself* expose that harm isn't bound by the subject's *present* awareness? That the value of a life isn't just in its current sensations, but its *narrative arc*, its *cut-short potential*? The harm *is* the deprivation, and it stains the *whole story* retroactively."

  **James:** (Shifts uncomfortably, avoids her gaze. Picks up his glass, puts it down.) "Clever. But you’re smuggling in sentimentality. A 'narrative arc'? That’s literature, not ontology. And what about Lucretius? Hmm? The symmetry argument?" (He leans back, trying to regain academic footing) "Why weep for the time *after* I cease, Sarah, when you don't weep for the vast eternity *before* I existed? That nonexistence never troubled me. Why should its mirror image? If pre-birth non-being wasn't bad, post-death non-being isn't bad. It’s symmetrical. Logically pristine."

  **Sarah:** (Doesn't let him retreat) "Symmetry? James, be honest. Did you ever *yearn* for 1804? Wish you could have danced at Napoleon’s coronation? No. Because *you weren't a possibility then*. You weren't deprived *of* anything because *you* weren't even a glimmer. But *now*?" Her voice drops, intense. "*Now* you *are*. You have roots, branches, *momentum*. You love this world, even when you pretend to disdain it. Death isn't symmetrical to pre-birth because *life happened in between*. It created the stakes! It made you someone *with something to lose*."

  **James:** (Silence. He stares at his hands, clenched on the armrest. The academic veneer cracks, revealing raw fear beneath.) "So... the harm is... permanent? Lodged in the fabric of what *could have been*? A... a negative fact haunting a story that... that just... stops?" He looks up, vulnerable. "But Sarah... who *bears* that haunting? The James who *was*? He's gone. The James who *might have been*? He never existed. It feels... weightless. Meaningless."

  **Sarah:** (Moves to kneel beside his chair, places a hand over his white knuckles. Not pity, solidarity.) "Maybe the 'who' is the wrong question. Maybe the harm *is* the severing of the thread itself. The abrupt silencing of a unique voice in the universe. It *is* bad, James. Not just for us left in the quiet. It’s bad *for the story*. *Your* story. And you feel that, don't you? That’s not fear of sensation. That’s grief for the unwritten chapters."

  **James:** (Turns his hand to grasp hers, tightly. His voice is a whisper, stripped bare.) "The unwritten chapters... God, Sarah. The spring garden I planted... I won't see it bloom. That new translation of Heraclitus... half-finished on the desk." A tear escapes, tracing a line down his cheek. He doesn't wipe it away. "Epicurus... he never had a garden, did he? Or a best friend to argue symmetry with."

  **Sarah:** (Squeezes his hand, tears welling in her own eyes) "No, James. He probably didn't. And maybe... maybe that's why his answer feels so damn cold in a room like this."

  **(Scene End)**

  **Key Elements Used:**

  1.  **Beyond Epicurus 101:** James leads with it, Sarah immediately counters with the core of the deprivation account (Nagel), forcing him deeper.
  2.  **Timing Puzzle:** Sarah explicitly names it and uses it as a weapon against his position. James struggles to answer ("weightless... meaningless"), showing the puzzle's bite.
  3.  **Lucretius Squirm:** James brings it up defensively. Sarah dismantles the symmetry argument effectively by highlighting the crucial difference created by *having lived* and formed attachments/potential ("roots, branches, momentum"). James's reaction shows this hits home emotionally, not just logically.
  4.  **Real Back-and-Forth:** Each point directly responds to the previous one:
      *   James (Epicurus) -> Sarah (Deprivation) -> James (Timing Puzzle) -> Sarah (Timing Puzzle applied/Value of Narrative) -> James (Lucretius/Symmetry) -> Sarah (Breaking Symmetry via Life Lived) -> James (Emotional Concession/Value of Specific Future Goods) -> Sarah (Grounding the Harm in His Concrete Life/Story).
  5.  **Neither Loses:** James is intellectually cornered on the logic but finds a raw, emotional truth that Epicurus can't touch. Sarah wins the argument on deprivation but loses her composure, revealing her deep love and shared grief. His concession about the garden and book is a victory for her view, but it's bittersweet and painful.
  6.  **Emotional Subtext:** The philosophy is the vehicle for their fear, grief, love, and the desperate need to connect before time runs out. The setting (rain, study, untouched whisky) reinforces the mood. The physical touch at the end underscores the connection beneath the debate.
  7.  **Character Reveal:** James's vulnerability shows his philosophy was armor. Sarah's fury shows her love and her fight to make him *feel* the value of his life, not just intellectualize it away.
