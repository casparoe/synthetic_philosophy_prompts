  Another angle: Vance could propose that consequentialism includes epistemic humility. We act on available evidence while acknowledging limits. But the user doesn't want "we do our best" as a cop-out. So Vance must show that this approach is not just a guess but a reasoned stance against paralysis.

  The dialogue should have tension. Thorne presses with scenarios where good intentions lead to disaster. Vance responds by turning the focus to immediate suffering and the ethics of ignoring known harms. She might question if Thorne's position leads to moral nihilism, where no action can be justified.

