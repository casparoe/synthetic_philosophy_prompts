prompt: |-
  so in my practical reason seminar we've got a guest coming in next week who defends bernard williams-style internalism about reasons -- basically the view that you only genuinely have a reason to do something if it can be reached via a sound deliberative route from something already sitting in your existing motivational set (your "S"), no exceptions. for the assignment i have to send in interview questions ahead of time and i really don't want it to be 8 versions of "so what is internalism." can you draft 8-10 questions that actually press on the view instead of just having her restate it?

  specifically i want: at least one question built around williams' own gin-that-turns-out-to-be-petrol case, getting her to spell out exactly what work "sound deliberation" is doing that just going along with your existing (possibly false) beliefs can't do; at least one that pushes the objection that this lets a genuinely cruel or indifferent person off the hook -- if literally nothing in their S could lead them to care about their victim even after ideal deliberation, internalism seems to say they just have no reason to stop, full stop; and at least one on whether she's stuck with a humean "reason only finds means to existing ends" picture, or whether she can borrow korsgaard's move that deliberation can generate genuinely new motivation rather than just serving old ones. for each of those three can you also throw in a quick follow-up keyed to whatever answer shes most likely to give, so the question doesn't just die after the first response. thanks!
reasoning: |-
  Okay, the user is in a practical reason seminar with a guest speaker defending Bernard Williams-style internalism. They need to draft interview questions that go beyond basic explanations and press on the view. The user specifically wants questions addressing three key areas: the gin/petrol case, the objection about cruel individuals, and the Humean vs. Korsgaardian deliberation point.

  First, I need to recall Williams' internalism. The core idea is that reasons must be grounded in the agent's existing motivational set (S) through sound deliberation. The gin/petrol case involves an agent who wants a gin and tonic but mistakenly drinks petrol. Williams argues that the agent has no reason to drink petrol because it doesn't satisfy their actual desire. The user wants a question that explores how "sound deliberation" prevents actions based on false beliefs. The follow-up should challenge whether deliberation can correct false beliefs.

  Next, the objection about cruel individuals. If someone's S has no elements that could lead to caring about others, internalism implies they have no reason to stop harming others. The user wants a question that highlights this moral issue, pushing the speaker to address whether internalism can account for normative reasons in such cases. The follow-up could question if internalism reduces reasons to psychological facts, losing normative force.

  Third, the Humean vs. Korsgaardian point. Hume sees reason as instrumental, serving existing ends. Korsgaard believes deliberation can generate new motivations. The user wants to know if the speaker aligns with Hume or allows for Korsgaard's view. The follow-up could ask if recognizing new values during deliberation still depends on pre-existing elements in S.

  The user's deeper needs include wanting rigorous, critical questions that challenge the speaker and show the user's understanding. They might also want to explore the moral implications of internalism and its compatibility with other theories. Ensuring each question has a follow-up prevents superficial answers and promotes deeper discussion.

  I should structure each main question with a follow-up. For the gin/petrol case, focus on how sound deliberation handles false beliefs. For the cruel individual, emphasize moral accountability. For deliberation, contrast Hume and Korsgaard. Additional questions could address other weaknesses, like the role of rationality in S, scope of motivations, and conflicts between internalism and morality. Make sure questions are concise, avoid redundancy, and push the speaker to defend the theory's robustness.
answer: |-
  Here are 10 interview questions designed to press Williams-style internalism, incorporating your specific requests with challenging follow-ups. They avoid mere restatement and target conceptual tensions:

  **Core Challenge Questions:**

  1.  **The Gin/Petrol Case & Sound Deliberation:** Williams uses the gin/petrol case to argue the agent has no reason to drink petrol, even if he falsely believes it's gin. But doesn't "sound deliberation" *necessarily* require correcting false empirical beliefs? If sound deliberation *didn't* correct the false belief that the liquid is gin, wouldn't it be *unsound*? **Follow-Up (Likely: Sound deliberation requires true beliefs):** If sound deliberation *requires* correcting false beliefs, doesn't this mean that *any* false belief about the world relevant to satisfying elements in S *must* be corrected for the reason to be genuine? Doesn't this make "what you have reason to do" heavily dependent on epistemic luck and external facts, potentially undermining the purely *internal* grounding Williams sought?
      *   *Aims: Forces clarification of "sound," links it to truth/accuracy, presses the tension between internalism and external epistemic demands.*

  2.  **The Cruel Person Objection & Normativity:** Internalism seems to imply that a genuinely cruel person, whose S contains nothing that sound deliberation could connect to concern for their victim (e.g., no latent empathy, no fear of punishment, no social conformity desire), simply has *no reason whatsoever* to refrain from cruelty. How does your view avoid the consequence that such a person is *normatively* off the hook? Is the *only* criticism available that we disapprove, or that society will punish them? **Follow-Up (Likely: Emphasizes the internal perspective/normativity for the agent):** If the cruel person truly has *no reason* to stop, doesn't this sever the crucial link between "having a reason" and "what one ought to do" for external observers? Doesn't this suggest internalism fails to capture the *normative force* we intuitively attribute to reasons against cruelty, reducing them to mere psychological facts about motivation?
      *   *Aims: Directly confronts the moral counterintuitiveness, presses the distinction between internal normativity and external moral judgment.*

  3.  **Humean Instrumentalism vs. Korsgaardian Creativity:** Williams emphasizes reasons stemming *from* S via deliberation. Does sound deliberation *only* uncover instrumental connections or latent implications of existing S elements (Humean), or can it *generate genuinely new, motivationally independent ends* (as Korsgaard suggests)? For example, could reflecting on my S lead me to value honesty *as such* for the first time, creating a new element *in* S? **Follow-Up (Likely: It uncovers/disentangles latent commitments):** If deliberation *only* reveals latent elements of S, doesn't this risk making S a mysterious repository of *all possible* motivations one *could* ever have? How do we distinguish a genuinely *new* motivation generated *by* deliberation from a pre-existing, merely undiscovered element? Doesn't this view risk collapsing back into a form of psychological determinism regarding possible motivations?
      *   *Aims: Challenges the scope of deliberation, probes the nature of S and its potential plasticity.*

  **Additional Pressing Questions:**

  4.  **The Scope of "Motivation" in S:** Williams defines S broadly (desires, dispositions, commitments, projects). Could something like *rational consistency itself* be part of S? If not, why not? If so, doesn't this open the door for internal reasons stemming purely from avoiding contradiction, even if it conflicts with other S elements? (E.g., a reason to avoid blatant hypocrisy, even if the hypocritical action satisfies other desires).
      *   *Aims: Tests the boundaries of S and whether formal rationality can be a source of internal reasons.*

  5.  **External Demands vs. Internal Accessibility:** Consider societal roles or promises. I might have *externally* promised to do X, but nothing in my S (even after sound deliberation) motivates me to keep *this specific promise*. Internalism says I have no reason to keep it. But doesn't this fundamentally misrepresent the *binding force* of promises or roles? How does your view account for the intuition that such commitments *themselves* generate reasons, independent of my pre-existing motivation towards *this particular* commitment?
      *   *Aims: Challenges internalism on specific normative phenomena like promises/duties.*

  6.  **The "Relativism" Charge & Improvement:** If reasons are entirely relative to an individual's S, how can we meaningfully say someone *should* change their S (e.g., become less selfish)? Doesn't "should" imply they *already* have a reason to change? If they lack any element in S that sound deliberation could connect to becoming less selfish, does internalism imply they *cannot* be criticized for lacking a reason to improve?
      *   *Aims: Presses the problem of moral improvement/critique within the framework.*

  7.  **"Sound Deliberation" - Process or Outcome?** Williams describes it as "correctly tuned" to the facts and the agent's S. Is "soundness" primarily about the *correctness of the outcome* (finding a genuine reason-link) or the *correctness of the process* (using rational procedures, true beliefs)? If it's the outcome, doesn't it become circular (a sound deliberation is one that finds a reason)? If it's the process, how do we define the "correct" procedures without smuggling in external standards of rationality?
      *   *Aims: Targets a potential ambiguity/vagueness at the heart of the mechanism.*

  8.  **The "One Thought Too Many" & Over-Deliberation:** Williams famously criticized Kantianism for potentially requiring "one thought too many." But couldn't internalism demand an equally problematic form of deliberation? To know if I have a reason to save my drowning spouse, must I first engage in deliberation to confirm that saving them connects to my S? Isn't the *need* for such deliberation sometimes itself a moral failure, suggesting my S isn't properly constituted?
      *   *Aims: Turns a Williams critique back on internalism itself regarding spontaneous action.*

  9.  **Conflicting S Elements & Reason Strength:** If multiple, conflicting elements in S provide internal reasons (e.g., reason to work from ambition, reason to relax from tiredness), how does internalism explain the *relative strength* of these reasons? Is strength also purely internal (based on motivational force)? Or does "sound deliberation" imply a substantive standard for weighing reasons *beyond* mere motivational pull?
      *   *Aims: Probes how internalism handles reason conflicts and weighting.*

  10. **Internalism vs. Morality's Authority:** Many feel morality provides *categorical* reasons – reasons that apply regardless of our contingent motivations. Internalism seems to render moral reasons *hypothetical*, contingent on S. How does your view reconcile with the powerful intuition that moral demands (e.g., not to torture innocents) provide reasons *for any rational agent*, irrespective of their S? Is this intuition simply mistaken on your view?
      *   *Aims: Directly confronts the perceived conflict between internalism and the authority of morality.*

  **Key Features of these Questions:**

  *   **Go Beyond Definition:** They assume familiarity with the core view and immediately press on implications, tensions, and counter-intuitive consequences.
  *   **Target Specific Critiques:** They incorporate your requested cases (Gin/Petrol, Cruel Person, Korsgaard) directly and robustly.
  *   **Include Built-in Follow-ups:** Each of the first three core questions has a likely follow-up designed to push back on a predictable answer, preventing a dead end.
  *   **Varied Angles:** They attack from different directions – moral implications, epistemic demands, the nature of deliberation, the scope of S, relativism, conflicts, and the authority of morality.
  *   **Provoke Defense/Clarification:** They force the speaker to defend the *robustness* of internalism against common and powerful objections.

  Good luck with the seminar! These should generate a lively and substantive discussion. Remember to listen closely and adapt your follow-ups based on the actual responses you get.
