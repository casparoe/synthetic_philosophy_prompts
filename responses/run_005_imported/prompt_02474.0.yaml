answer: |-
  ### Adjudicating Simpson's Paradox: Classical Heuristic vs. Causal-Graph Resolution

  Your reading group's debate highlights a fundamental tension in causal inference: **the raw joint distribution of treatment (T), outcome (Y), and a third variable (Z) is insufficient to resolve Simpson's paradox**. The paradox arises when the association between T and Y flips direction upon pooling vs. stratifying by Z. Crucially, identical data patterns can demand opposite conclusions depending on the **causal structure**—information not encoded in the data alone. Below, I clarify why Pearl's framework is necessary, provide a numerical counterexample to the classical heuristic, and explain why the classical approach is a special case of causal reasoning.

  ---

  ### **Why the Joint Distribution Isn't Enough**
  Simpson's reversal occurs when:
  1. **Pooled data**: T and Y show association A (e.g., T associated with higher Y).
  2. **Stratified by Z**: Within each stratum of Z, T and Y show association ¬A (e.g., T associated with lower Y).

  The joint distribution reveals only *associations*, not *causal pathways*. To decide whether the pooled or stratified association reflects causality, we need:
  - **The causal graph**: Specifies directional relationships between T, Y, and Z (e.g., confounder, mediator, collider).
  - **The causal query**: Are we estimating the *total effect* of T on Y, or a *direct/conditional effect*?

  **The critical missing piece**: **The causal role of Z** (e.g., is it a confounder, mediator, or collider?). This cannot be inferred from data alone—it requires domain knowledge or experimental design.

  ---

  ### **Classical Heuristic vs. Pearl's Criterion**
  1. **Classical heuristic**: "Control for Z when you observe Simpson's reversal."  
     - *Rationale*: Z is a confounder; pooling creates spurious associations.  
     - *Limitation*: Assumes Z is always a confounder. Fails if Z is a mediator or collider.

  2. **Pearl's causal-graph resolution**: Use causal diagrams to decide:  
     - **Stratify on Z** only if it blocks all backdoor paths (confounding).  
     - **Do not stratify** if it opens non-causal paths (collider) or blocks causal paths (mediator).  
     - *Strength*: Generalizes to all causal structures; data + graph resolve ambiguity.

  **Key insight**: The classical heuristic works *only* when Z is a confounder. In other cases, it fails catastrophically.

  ---

  ### **Worked Counterexample: When Pooling is Correct**
  I'll construct a scenario with identical data to the kidney-stone study, but where Z is a **collider** (not a confounder). Acting on the stratified estimates would be harmful.

  #### **Scenario: Drug Efficacy Study**
  - **Treatment (T)**: New drug (T=1) vs. placebo (T=0).  
  - **Outcome (Y)**: Recovery (Y=1) vs. no recovery (Y=0).  
  - **Third variable (Z)**: Post-treatment biomarker (Z=1: elevated; Z=0: normal).  
    - *Causal structure*: T and Y both cause Z (Z is a **collider**):  
      ```mermaid
      graph LR
        T(Treatment) --> Z(Biomarker)
        Y(Outcome) --> Z
        T --> Y
      ```
    - *True causal effect*: The drug *improves* recovery (total effect: T→Y positive).

  #### **Data (Identical to Kidney-Stone Study)**
  |          | Z=0 (Normal Biomarker) | Z=1 (Elevated Biomarker) | Pooled     |
  |----------|------------------------|--------------------------|------------|
  |          | T=0     | T=1       | T=0     | T=1     | T=0     | T=1     |
  | **Y=1**  | 81      | 234       | 192     | 55      | 273     | 289     |
  | **Y=0**  | 6       | 36        | 71      | 25      | 77      | 61      |
  | **Total**| 87      | 270       | 263     | 80      | 350     | 350     |
  | **Rate** | 93.1%   | 86.7%     | 73.0%   | 68.8%   | 78.0%   | 82.6%   |

  - **Stratified (Z-specific)**:  
    - Z=0: Recovery higher for T=0 (93.1% vs. 86.7%).  
    - Z=1: Recovery higher for T=0 (73.0% vs. 68.8%).  
  - **Pooled**: Recovery higher for T=1 (78.0% vs. 82.6%).  

  #### **Why Stratifying is Wrong Here**
  - **Causal structure**: Z is a collider caused by T and Y. Conditioning on Z opens a **non-causal path** (T→Z←Y), creating spurious associations:  
    - In Z=0 stratum: Unhealthy patients (Y=0) are less likely to elevate Z unless treated (T=1). This makes T=1 *appear* harmful.  
    - In Z=1 stratum: Healthy patients (Y=1) are more likely to elevate Z if treated (T=1). This masks the drug's benefit.  
  - **Correct approach**: The pooled estimate reflects the true **total causal effect** (drug improves recovery). Stratifying on Z introduces bias.  
  - **Action**: Trust the pooled data—the drug is beneficial overall.

  ---

  ### **Verdict: Classical Heuristic as a Special Case**
  The classical heuristic ("trust stratified estimates") is **not fundamentally mistaken but incomplete**. It is best viewed as a **special case of Pearl's framework** that holds *only* when Z is a pre-treatment confounder. 

  #### **Why?**
  1. **Justification in confounder cases** (e.g., kidney stones):  
     - Stone size (Z) is a confounder: It affects treatment choice (T) and outcome (Y).  
     - Pooling ignores Z, allowing confounding; stratifying blocks backdoor paths.  
     - Here, classical heuristic ≡ Pearl's backdoor criterion.  

  2. **Failure in non-confounder cases** (e.g., our biomarker example):  
     - When Z is a collider/mediator, stratifying *creates* bias (as shown above).  
     - The heuristic lacks machinery to diagnose Z's causal role.  

  3. **What stratification accomplishes**:  
     - Stratification *always* estimates the **conditional association** (E[Y|T,Z]).  
     - It does **not** inherently estimate causal effects—this depends on whether Z satisfies the backdoor criterion.  

  #### **Broader Implications**
  - **Causal diagrams are non-optional**: Data alone cannot resolve paradoxes. Domain knowledge (e.g., temporal order, known pathways) must specify the graph.  
  - **The heuristic's risk**: Blindly stratifying on post-treatment variables (e.g., biomarkers, mediators) is a common error in applied work. Pearl's framework prevents this.  
  - **A middle ground**: In practice, the classical heuristic often works because Z is *often* a confounder (e.g., demographics, baseline health). However, in novel settings (e.g., genetics, social sciences), causal graphs are essential.

  ### **Conclusion**
  Simpson's paradox exposes the limits of associational statistics. Pearl's causal framework supersedes the classical heuristic by explicitly separating:  
  1. **Identification** (using the graph to decide if pooling/stratifying is appropriate).  
  2. **Estimation** (computing the statistic once identified).  

  Your group's "half the room" is correct that stratification fixes confounding, but only when Z is a confounder. The other half is correct that the reversal alone cannot dictate the solution—the causal structure is decisive. As a biostatistician, embracing causal diagrams will equip you to navigate these ambiguities rigorously.
