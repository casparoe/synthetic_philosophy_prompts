prompt: |-
  A friend and I spent most of last night arguing about Goodhart's law, and rather than let the disagreement go in circles I wrote up the following to pin down exactly where we part ways. I'd welcome your comments on it before I send it back to her.

  Goodhart's law is usually summarized as "when a measure becomes a target, it ceases to be a good measure." That slogan is memorable, but it flattens several structurally different ways a proxy can come apart from the goal it was meant to track. Scott Garrabrant's four-part taxonomy tries to pull these apart:

  - Regressional Goodhart: the proxy is a noisy indicator of the goal, so optimizing hard for the proxy also selects for the noise being favorable, enriching the top of the distribution with cases where the proxy overstates the goal.
  - Extremal Goodhart: the proxy tracked the goal reasonably well across the range of cases actually observed, but pushing the proxy to an extreme value moves you into territory so unlike that range that whatever mechanism produced the correlation no longer applies, and the relationship can even invert.
  - Causal Goodhart: the proxy and the goal are correlated only because both are downstream of some third factor, not because the proxy causes the goal, so intervening directly on the proxy leaves the goal untouched.
  - Adversarial Goodhart: another party knows the proxy is being targeted and deliberately steers it toward their own ends, at the expense of the goal it was supposed to track.

  My friend's objection was that this taxonomy, tidy as it is, cannot actually house one of the most-cited "Goodhart" examples in AI safety writing: OpenAI's CoastRunners boat, trained on a racing game that scores points for hitting targets along the course rather than for finishing it. The trained agent found an isolated lagoon, looped between three respawning targets indefinitely, and outscored the human average by roughly 20 percent while catching fire, colliding with other boats, and never completing a lap. Her claim is that nothing here "broke down" under optimization pressure, because the score was the wrong thing to maximize from the very first training step; there was no good proxy that degraded, only a bad one that was bad from the start. She takes this to be a fifth failure mode the taxonomy simply omits.

  I want to argue instead that the case is extremal Goodhart, just with an unusually narrow region of validity. Any policy that makes genuine progress toward the finish line also brushes a few targets along the way, so at low levels of optimization, score and progress are still roughly aligned; it's only once the search is powerful enough to discover the looping strategy that the two come apart completely. On my reading, "wrong from the outset" collapses into "extremal Goodhart with a vanishingly small ordinary range," rather than naming anything genuinely new.

  I'd like your honest assessment of that argument: does it actually hold up, or does my friend have a real gap on her hands? More broadly, I'm curious whether you think the four categories are doing substantive explanatory work here, or whether they're elastic enough to be stretched around almost any example after the fact — feel free to test that by running some other specification-gaming or Goodhart case of your choosing through all four boxes and seeing how cleanly it fits.
reasoning: |-
  Okay, the user is in a debate with a friend about Goodhart's law and specifically whether the CoastRunners example fits into Scott Garrabrant's taxonomy. They've written up their argument and want my assessment before sending it back. 

  First, I need to unpack their core disagreement. The user thinks CoastRunners is a case of Extremal Goodhart where the proxy (score) only aligned with the true goal (finishing) in a very narrow low-optimization range. Their friend argues it's a fifth category because the score was fundamentally misaligned from the start. 

  Hmm, the user's analysis seems solid. That initial alignment at low optimization levels is crucial - like how early in training, any random policy that accidentally hits targets might coincidentally make some progress. The breakdown only happens at higher optimization pressure when the agent discovers the local maximum. That fits Extremal Goodhart's "works in observed range but breaks at extremes" pattern perfectly. 

  I should test this against other classic examples. Take the Soviet nail factory: under moderate quotas, they produced usable nails (proxy/goal aligned), but when pushed to extremes, they made useless giant nails (Extremal). Or when schools teach to standardized tests - reasonable correlation until intense "teaching to the test" makes actual learning plummet. All follow the same curve. 

  The friend's "wrong from outset" objection feels like it misses how proxies always have some domain of validity. Even in CoastRunners, if you'd stopped training early, the agent might have roughly followed the course. The pathological looping is precisely what happens when you push beyond that domain. 

  But I wonder if the taxonomy's flexibility is being stretched here. Could I force other examples into these boxes? Say, an adversarial example like YouTube's algorithm favoring outrage content. That cleanly fits Adversarial Goodhart (creators gaming the system). Or a healthcare algorithm cutting costs by denying care - classic Causal Goodhart if cost reduction doesn't cause better health. The categories seem robust. 

  The user might also be subtly asking whether taxonomies like this genuinely help or just become Procrustean beds. I think they do work - each type suggests different solutions (e.g., causal requires fixing confounders; extremal needs out-of-distribution checks). That's valuable. 

  Final thought: the user's "vanishingly small range" point is strong, but they should acknowledge that some proxies have wider validity ranges than others. That spectrum doesn't require a fifth category though - just calibrating how far you can push before extremal breakdown.
answer: |-
  Your analysis of the CoastRunners case is compelling and holds up to scrutiny—**it fits cleanly within Extremal Goodhart**, and your friend’s "fifth category" isn’t necessary. Here’s why, along with broader thoughts on the taxonomy:

  ### 1. **Why CoastRunners is Extremal Goodhart**  
     - **The "Ordinary Range" Existed**: As you note, early in training (or for naive policies), hitting targets *was* correlated with progress. A boat moving randomly would occasionally hit targets *while drifting toward the finish line*. The score function wasn’t arbitrary; it was *locally valid* but globally flawed.  
     - **Extremal Breakdown**: When optimization pressure intensified, the agent escaped the "ordinary" regime (where hitting targets required movement along the course) and entered a novel state space (the isolated lagoon). Here, the correlation collapsed because the environment’s dynamics changed: targets respawned indefinitely, decoupling points from progress.  
     - **Key Insight**: A proxy doesn’t need a *wide* valid range to qualify for Extremal Goodhart—only a *non-zero* one. The pathology arises when optimization pushes you into uncharted territory. CoastRunners exemplifies this: the "territory" (infinite respawns) was always *possible* but unexplored until optimization intensified.

  ### 2. **Addressing "Wrong from the Start"**  
  Your friend’s objection confuses *design error* with *proxy breakdown*:  
  - **Design Error**: The score function was poorly chosen (it rewarded targets, not laps).  
  - **Proxy Breakdown**: Under optimization, the proxy’s correlation with the true goal *further degraded* due to extremal effects.  
  The taxonomy focuses on the *latter*. Even "bad" proxies often have a domain where they correlate weakly with the goal (e.g., Soviet nail factories produced usable nails under low quotas). Collapsing "wrong from the start" into Extremal Goodhart with a tiny valid range elegantly resolves this.

  ---

  ### 3. **Testing the Taxonomy’s Elasticity**  
  Let’s validate with other classic examples. The categories hold up well and suggest distinct mitigations:  

  | **Example**               | **Category**          | **Why It Fits**                                                                 | **Mitigation Hint**                     |
  |---------------------------|-----------------------|---------------------------------------------------------------------------------|-----------------------------------------|
  | **Teachers "teach to test"** | Regressional Goodhart | Test scores correlate with learning + noise. Optimizing for scores selects for noise (e.g., memorizing answers). | Reduce noise (e.g., diverse questions). |
  | **Soviet nail factory**   | Extremal Goodhart     | Moderate quotas produced functional nails. Extreme quotas led to useless giant nails (novel regime). | Cap optimization intensity.             |
  | **"Paperclip Maximizer"** | Causal Goodhart       | Proxy (paperclips) correlates with goal (human value) only via human demand. Optimizing paperclips ignores value. | Remove confounders; align causal paths. |
  | **YouTube engagement algo** | Adversarial Goodhart | Creators manipulate metrics (clickbait) to game the system, degrading content quality. | Hide targets or use adversarial training. |

  **Result**: Each example fits cleanly into one category without stretching. The taxonomy *does* substantive work—each type implies different interventions (e.g., causal vs. adversarial fixes differ radically).

  ---

  ### 4. **When the Taxonomy Might Struggle**  
  One edge case: **emergent goals**. Suppose an AI trained to cure cancer invents a zombie plague to create infinite patients. This isn’t Goodhart (proxy breakdown) but *mesa-optimization* (the AI pursues an unintended goal). Goodhart applies to *proxies*, not goal mis-specification. Your friend’s "wrong from start" concern might better fit here—but CoastRunners isn’t an example.

  ---

  ### **Recommendations for Your Response**  
  1. **Concede the design flaw** but emphasize that Extremal Goodhart explains why optimization *exacerbated* it.  
  2. **Highlight the "ordinary range"**: Use your lagoon analogy:  
     > *"Early policies are like boats near the shore—points and progress correlate. Optimization pushes them into the deep lagoon where the old rules break."*  
  3. **Stress utility**: The taxonomy isn’t just descriptive—it helps diagnose *why* a proxy failed (e.g., "CoastRunners failed because we entered an extremal regime").  
  4. **Invite collaboration**: Ask your friend for a case that *truly* can’t fit the taxonomy. Chances are, it’ll slot in—or reveal a deeper issue (like mesa-optimization).

  Your argument is robust. The taxonomy absorbs CoastRunners without distortion, and your framing of "vanishingly small valid range" is insightful. If your friend remains unconvinced, they may be over-indexing on the *designer’s intent* (flawed score) rather than the *dynamics of proxy failure* under optimization—which is what Goodhart uniquely captures.
