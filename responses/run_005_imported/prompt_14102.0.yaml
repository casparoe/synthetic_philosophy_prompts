  4. Follow-up: One might argue that mutual cooperation is Pareto superior, but in the standard one-shot Prisoner's Dilemma, that doesn't change the dominance of defection. How does the program setting change the normative force of Pareto considerations? Why would a rational agent choose the cooperative program over the defecting one?

  5. There have been proposals to make the Löbian approach robust to small mismatches or "trembles" in the opponent's code. Do you see these as principled extensions of the core idea, or as after-the-fact repairs?

