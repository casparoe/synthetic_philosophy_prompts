  2. As a follow-up: You've mentioned that the bounded proof search avoids infinite regress by terminating. But the behavior of the agent then depends on the proof system and the computational bound. Since these are arbitrary parameters, how can this be a foundation for rational agency, which we typically think of as independent of such implementation details?

