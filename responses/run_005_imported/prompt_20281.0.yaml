  Make sure the language fits a 15th-century Dominican friar—formal, a bit scholastic, but passionate. Use terms like "licit authority," "common good," "scandal," etc. The tone should be pastoral, showing the friar's concern for their souls and the principality's stability.

  Finally, tie it back to the plot. The friar's refusal might push the nobles to seek another way or proceed despite warnings, heightening the story's conflict. The user needs this scene to challenge both the characters and readers' perceptions of just rebellion.
answer: |-
  Here’s the argument the Dominican friar could deliver, grounded in Aquinas’s nuanced principles, addressing both *De Regimine Principum* and the *Sentences* commentary head-on. It emphasizes the crucial distinction between private judgment and public authority:

  ---

  **Friar Benedetto’s Response:**

  "My son, you come to me seeking absolution before the act, trusting that Saint Thomas’s words will shield your soul. You cite the tyrant’s cruelty – the seizures, the disappearances, the fear that chokes our streets. I do not dispute it. The Duke *is* a tyrant. His rule is a wound upon this land, a perversion of the justice and care a prince owes his people. On this, Aquinas and I agree utterly: tyranny is a grave sin against God and the common good."

  He leans forward, his voice low but intense, eyes holding the nobleman's.

  "But you ask not whether he *is* a tyrant, but whether *you*, Sir Guido, and your companions – acting as private men, in secret conclave – have the *authority* and the *right* to become his executioners. And on *this*, Saint Thomas Aquinas, Doctor of the Church, is profoundly clear: **You do not.**"

  He raises a hand to forestall the inevitable objection.

  "You will recall, or perhaps have heard secondhand, that passage from his commentary on the *Sentences*: *‘He who kills a tyrant to free his country is praised and receives a reward.’* It has a bold ring, does it not? A clarion call for the righteous dagger. But you *must* read Saint Thomas as he intended – carefully, wholly, and with profound attention to context. That single line, plucked from its roots, is a dangerous half-truth. Let me show you why your plan violates the very principles Aquinas labored to establish."

  **1. The Peril of Private Judgment:**
     * "Aquinas's deepest fear, articulated again and again, especially in *De Regimine Principum*, is **anarchy** – the chaos that ensues when *any* private individual presumes to judge the ruler and enact that judgment with violence. Why? Because the title 'Tyrant' is perilously subjective. What one man sees as necessary firmness, another sees as oppression. What is just seizure to replenish an empty treasury to you, is tyranny to the lord whose land is taken. If every disgruntled noble, every merchant chafing under a tax, every man with a grievance could justify regicide by claiming tyranny... what stability, what order could possibly remain? It invites endless vendetta and factional slaughter. Aquinas writes: *‘[I]f to provide itself with a king belongs to the right of a given multitude, it is not unjust that the king be deposed or have his power restricted by that same multitude if, becoming a tyrant, he abuses the royal power.’* Note the crucial actor: **‘that same multitude’** – the community as a whole, or its legitimate representatives. Not a handful of aggrieved lords acting alone."

  **2. The Necessity of Public or Communal Authority:**
     * "Aquinas does not leave the people helpless! He explicitly provides a path: removal must come **through authority**. *‘There should be recourse to the authority of a higher power... if there is no human recourse, recourse must be made to God.’* You tell me there is no Emperor, no Pope above our Duke. Very well. Then the *only* licit authority that remains is **the community itself**, acting through its established structures. Does this principality possess a council of nobles, a body of elders, a *parlamento*, even a vestige of the commune that existed before the ducal line? *That* body, acting publicly, embodying the consent (or former consent) of the governed, possesses the standing Aquinas requires to judge a ruler a tyrant and depose him – potentially by force, if necessary. *They* could act as the instrument of the 'multitude.' Your secret cabal, Sir Guido, represents no one but its own ambition and anger. You have bypassed any semblance of communal judgment. You act not as ministers of the people's will, but as private avengers."

  **3. Addressing the *Sentences* Passage Directly:**
     * "Ah, but what of the liberator praised in the *Sentences*? Does that not vindicate your dagger? Look closer! Aquinas does not praise the *private nobleman* acting in secret. The context implies something far more specific and rare. Consider the examples he would have known: Brutus expelling the Tarquins, or Judith slaying Holofernes. These were not clandestine plots by a faction, but acts undertaken **when the tyranny was absolute, all legitimate channels utterly destroyed, and the act itself was a catalyst for the restoration of the *community's* freedom.** The praise is for liberating the *res publica*, the commonwealth, *not* for settling private scores or seizing power for a clique. Furthermore, such an act borders on the miraculous or divinely inspired precisely *because* it lacks formal authority – it is exceptional, dangerous, and only potentially justifiable *after the fact* if it truly restores the common good *and* is accepted by the liberated people. Your plan, Sir Guido – a handful of nobles killing the Duke in secret to... what? Install one of yourselves? – reeks of faction, not liberation. Where is the mechanism for the *community* to regain control? You risk replacing one tyrant with another, or plunging us into civil war as rival factions scramble for the throne. This is the *scandal* and *chaos* Aquinas feared above all. Your act, far from being the praised deed of the *Sentences*, would likely be the spark that ignites the anarchy condemned in *De Regimine*."

  **4. The Burden of Proof and the Risk of Scandal:**
     * "Finally, Aquinas places a heavy burden on those who would act against a ruler. The presumption must always be *for* authority, established by law and custom. To overthrow it requires not just proof of tyranny, but proof that the act of overthrow will *unquestionably serve the common good* and not merely create a greater evil. Can you, in this darkened room, swear before God that your plot, conducted without the knowledge or mandate of the people, will restore justice and stability? Or might it shatter the fragile peace, unleash the Duke's loyalists, invite invasion from opportunistic neighbors, or simply see your own faction become the new oppressors? The 'scandal' – the spiritual and social harm – caused by regicide based on private judgment is immense. Aquinas would argue it is almost always a greater sin than enduring a known, if terrible, evil, *unless* the removal is undertaken legitimately. You offer no legitimacy, only secrecy and steel."

  **Conclusion:**
  Friar Benedetto sighs, the firelight catching the lines of worry on his face. "Sir Guido, I weep for our people under this Duke's heel. I pray daily for his removal or repentance. But what you propose is not the solution Aquinas permits. He demands action through *authority* – the authority of the community itself, acting through its rightful representatives, publicly, for the restoration of the common good. Find a way to convene the Estates. Rally the council. Make the case *publicly*. Let the *principality* judge its Duke a tyrant. If force is then needed, let it be the force of the community acting in its own defense, not the dagger of assassins in the night. *That* path, though harder and more perilous for you personally, may have justice on its side. *This* path? It is the sin of murder compounded by the sin of usurping God’s sole prerogative to judge the highest magistrate without earthly warrant. I cannot bless it. I *must* warn you against it. To proceed is to risk your soul and the very soul of this land you claim you wish to save. Seek the authority of the *multitude*, Sir Guido, or abandon this bloody course."

  ---

  **Key Elements Used:**

  *   **Acknowledges Tyranny:** Doesn't defend the Duke, establishing the friar's moral standing.
  *   **Centers Aquinas's Core Fear:** Highlights the danger of private judgment leading to anarchy as the primary concern from *De Regimine*.
  *   **Defines "Authority":** Explicitly states that without a higher power, the *only* licit authority is the community ("the multitude") acting through representative bodies.
  *   **Deconstructs the *Sentences* Quote:** Argues it refers to exceptional, public-spirited acts of liberation restoring communal freedom, *not* private, factional assassination plots. Contrasts it with the anarchy warned against in *De Regimine*.
  *   **Addresses the "No Higher Power" Scenario:** Uses Aquinas's own logic – when no higher power exists, authority reverts to the community *as a body*, not to private individuals.
  *   **Emphasizes Consequences:** Stresses the risk of chaos, civil war, and simply replacing one tyranny with another – the outcomes Aquinas most feared.
  *   **Offers an Alternative Path:** Pushes the conspirators towards seeking legitimate communal authority (council, estates), framing *that* as the Aquinas-sanctioned route.
  *   **Pastoral Tone:** Blends theological argument with concern for the nobleman's soul and the principality's well-being.

  This argument forces the conspirators to confront the fundamental flaw in their plan according to the very thinker they hoped would justify it: their lack of legitimate standing. It uses Aquinas to box them in, making their subsequent choice (to proceed anyway, seek legitimacy, or abandon the plot) dramatically potent.
