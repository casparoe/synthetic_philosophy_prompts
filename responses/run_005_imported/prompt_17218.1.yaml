  Move 2 is Liz's clever reductio ad absurdum. She exposes Dan's selective skepticism by pointing to his blind trust in foundational tools. This forces him to defend why some trust is different. 

  In move 3, Dan's track record argument holds merit - institutional trust in battle-tested systems is rational. But Liz will pounce on how he verifies that track record. 

  Move 4 is Liz's strongest play: she correctly notes all knowledge rests on testimony eventually. Dan's "vibes" comment reveals he hasn't fully grappled with the social dimension of knowledge. 

