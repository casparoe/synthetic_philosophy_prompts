answer: |-
  Here’s a targeted argument against McMahan’s excuse/justification distinction, grounded in the epistemic constraints of war. It aims to show that under conditions of radical asymmetric uncertainty, unjust combatants may act *objectively permissibly*—not merely excusably—when they fight in good faith, thereby preserving a form of moral equality:

  ### Core Argument: Epistemic Scarcity as a Permission-Granting Condition
  1. **The Epistemic Threshold for Liability**:  
     McMahan holds that liability to defensive killing requires **moral responsibility for an objectively unjust threat**. But responsibility isn’t binary; it’s *sensitive to epistemic context*. When an agent **lacks fair epistemic access** to the facts that would determine objective injustice, their action cannot *constitute* an unjust threat in the normatively relevant sense. The threat they pose is **epistemically circumscribed**—it exists only relative to information they *cannot* reasonably possess.  

  2. **Asymmetric Epistemic Disadvantage in War**:  
     Soldiers operate under:  
     - **Systematic informational deficits**: Strategic *jus ad bellum* facts (e.g., government deception, intelligence failures) are inaccessible to frontline combatants.  
     - **Compromised deliberative capacity**: Military training, time pressure, and stress suppress individual moral deliberation.  
     - **Institutional dependence**: Soldiers are embedded in a chain of command where **deference to legitimate authority is rationally obligatory** (absent clear evidence of illegitimacy).  
     → In this context, a soldier’s reasonable belief that their cause is just isn’t a *subjective mistake*—it’s the **only rational conclusion available** given their epistemic position.  

  3. **Permissibility via Epistemic Non-Culpability**:  
     When an agent:  
     - (a) Lacks access to truth-determining evidence,  
     - (b) Exercises due diligence in forming beliefs (e.g., relies on lawful orders, standard intel briefings), and  
     - (c) Acts on a reasonable belief in permissibility,  
     → Their action is **objectively permissible** *relative to the epistemic constraints they face*.  
     Crucially, this permissibility isn’t merely *excused*; it arises because the **normative valence of their act** (just/unjust threat) **depends on their epistemically feasible assessment**. Killing based on inescapable reasonable error doesn’t *wrong* the victim, because the victim’s claim-right not to be killed presupposes the killer’s *fair opportunity to recognize* the wrong.  

  4. **Blocking the Excuse/Justification Inference**:  
     McMahan claims: *"Reasonable belief in permissibility excuses but doesn’t justify."*  
     **Counter-move**: This distinction collapses under **radical unavoidable ignorance**.  
     - **Justification** = Act is objectively right/good.  
     - **Excuse** = Act is objectively wrong, but agent isn’t blameworthy.  
     → But when an agent’s epistemic limitations make it *impossible* to discern objective wrongness, the act **lacks the objective wrong-making property** *for that agent in that context*. The "unjust threat" isn’t a fact about their action *simpliciter*—it’s only a fact *from a privileged epistemic standpoint*. Soldiers aren’t blameworthy (excuse) *because* their action isn’t objectively wrongful *given their agential role* (justification).  

  5. **Recovering Moral Equality within Liability Framework**:  
     - **Just combatants**: Liable only if they violate *jus in bello* (e.g., target civilians), as they pose *unjust tactical threats*.  
     - **Unjust combatants**: **Not liable** for *merely fighting* if they:  
       (i) Reasonably believe their cause is just (due to epistemic constraints),  
       (ii) Adhere to *jus in bello*,  
       → They pose no *unjust threat* in the normatively salient sense.  
     Thus, both just *and* unjust combatants retain their right not to be killed **if they fight discriminately**, restoring moral equality at the *in bello* level.  

  ### Why This Undermines McMahan’s Move
  - **Rejects "Objective Wrongness" as Context-Independent**: The moral status of killing in war is **relationally constituted** by the killer’s epistemic context. A kill that’s objectively unjust *sub specie aeternitatis* may be permissible *for the agent* given unavoidable ignorance.  
  - **Preserves the Link Between Liability and Fair Opportunity**: Liability requires **culpable responsibility**. Unjust combatants who meet due diligence in belief-formation aren’t culpable for their ignorance—hence not responsible for an "unjust threat" in the liability-triggering sense.  
  - **Avoids Institutional Pragmatism**: This isn’t a concession to legal feasibility ("war must be regulable"); it’s a claim about **deep morality under epistemic scarcity**.  

  ### Objection Handling
  - *"But shouldn’t soldiers doubt obviously aggressive wars?"*  
    → Yes, but "obviousness" is hindsight-dependent. Few wars are *ex ante* clear-cut (e.g., 2003 Iraq War had multilateral support; soldiers weren’t irrational to trust authorities).  
  - *"Doesn’t this justify all non-culpable unjust combatants?"*  
    → Only those adhering to *jus in bello*. Those committing war crimes remain liable. And combatants in *manifestly* unjust wars (e.g., genocidal campaigns) may lose epistemic non-culpability.  

  **Conclusion**: McMahan’s excuse/justification distinction assumes soldiers can *in principle* access *jus ad bellum* truth-conditions. By showing that war’s epistemic constraints render this impossible, unjust combatants’ good-faith participation can be **objectively permissible**, not merely excused—salvaging moral equality from within a liability framework.
