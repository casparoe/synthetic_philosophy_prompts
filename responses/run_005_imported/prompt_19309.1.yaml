          P(ours is larger | see A) = [ (1/2)^(k+1) ] / [ 3*(1/2)^(k+2) ] = [ (1/2)^(k+1) ] / [ 3 * (1/2)^(k+2) ] = (1/2)^(k+1) * (2^(k+2))/3 = (2) / 3 = 2/3.

