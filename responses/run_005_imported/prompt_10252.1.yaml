  Write me an essay that actually takes a side: is the Church-Turing thesis best understood as a theorem, an empirical hypothesis, a definitional/stipulative move, or something else entirely? Actually defend one answer instead of just listing the options and shrugging -- a nuanced verdict is fine (like "it's unprovable but that just shows the theorem-vs-thesis framing is wrong"), just commit to something.
