  ### Funding Memorandum  
  **To:** Grant Committee Members  
  **From:** Chair, AI-Safety Grant Committee  
  **Date:** 3 October 2023  
  **Subject:** Decision on Application: "Formally Verified Tiling Agent for Safe Self-Modification"  

  ---

  #### **1. Application Summary**  
  The applicant seeks funding to develop a "tiling agent": an AI system that rewrites its own decision procedure only if it can prove, within its own formal system, that the successor preserves a specified safety property (e.g., corrigibility or goal stability). The core innovation is the integration of real-time proof generation into self-modification, aiming to prevent unsafe rewrites via mathematical guarantees.  

  #### **2. Key Objection: The Löbian Obstacle**  
  Our logician member objects that this approach directly confronts Löb’s theorem, which implies:  
  - **Self-trust is unattainable:** For any consistent formal system \(S\), \(S\) cannot prove the general schema "If \(S\) proves \(P\), then \(P\) is true" (i.e., \(S \nvdash \text{Pr}_S(\ulcorner P \urcorner) \to P\) for all \(P\)).  
  - **Inconsistency risk:** Adding self-trust as an axiom renders \(S\) inconsistent (per the Löbian cycle).  
  - **Specific flaw:** The agent’s requirement to prove "the successor preserves safety" within its own system may fail precisely when safety depends on this self-referential trust. Löb’s theorem suggests that such a proof could be impossible to generate without circularity or inconsistency, risking false negatives (rejecting safe rewrites) or unsoundness.  

  #### **3. Counter-Arguments ("Well-Trodden Ground")**  
  Two members argue that rejecting the application solely on Löbian grounds overlooks mature workarounds. They emphasize:  
  - **Hierarchical weakening (e.g., "Löb’s hierarchy"):** An agent \(A_0\) could defer trust to a weaker system \(A_1\) that handles rewrites. \(A_1\) cannot fully reason about \(A_0\)’s proofs, breaking the cycle. This is demonstrated in Yudkowsky-Herreshoff tiling (2013) and the "proof-based reflection" hierarchy.  
  - **Vingean reflection:** Instead of requiring \(A\) to prove "\(A'\) is safe" (where \(A'\) is the successor), \(A\) could prove "all possible successors \(A'\) satisfy safety" by reasoning about their code and goals, not their proofs. This avoids self-referential trust, as in Garrabrant’s logical induction (2016) or Arbital’s "proof-based goals."  
  - **Probabilistic self-trust:** Replace binary proofs with probabilistic confidence (e.g., "\(A'\) is safe with probability \(>0.99\)"). This sidesteps Löb’s theorem by tolerating uncertainty, as in Christiano’s MAML-based agents or empirical regret bounds.  
  These members contend that Löbian problems are "solved in practice" for prototypes, and rejecting this application would stifle empirical work that builds on existing theory.  

  #### **4. Committee Analysis**  
  We acknowledge the validity of both positions and evaluate them rigorously:  
  - **Fair hearing to the counter-arguments:**  
    - Hierarchies and Vingean reflection do circumvent Löb’s theorem by restricting self-reference. Successful examples exist in theory (e.g., Gödel-Löb logic for stepwise trust) and practice (e.g., Meta-execution in Lean theorem prover).  
    - Probabilistic methods are empirically viable for bounded agents, where "near-enough" trust suffices.  
    - **Thus, Löb’s theorem is not a categorical veto** on tiling agents. The objection must distinguish between (a) agents demanding infallible self-proof and (b) those using workarounds.  

  - **Why the objection retains weight:**  
    - The applicant’s proposal lacks specificity on *how* they avoid Löbian pitfalls. Key gaps include:  
      - No mention of hierarchies, weakening, or Vingean reasoning. The requirement to "prove safety in the same system" matches the vulnerable Löbian setup.  
      - No justification for why safety properties would be provable under Löb constraints (e.g., safety properties must be \(\Sigma_1\) sentences to avoid inconsistency).  
      - No fallback for cases where proofs fail (e.g., probabilistic rollback).  
    - Even with workarounds, challenges persist:  
      - **Computational limits:** Real-time proof generation for complex rewrites may be intractable.  
      - **Uninterpretable failures:** An agent might reject safe rewrites due to proof-theoretic blind spots (e.g., unprovable safety statements).  
    - The applicant’s framing ("prove in its own system") suggests they underestimate Löb’s theorem, risking a prototype that fails in predictable ways.  

  - **Broader value of the project:**  
    - Tiling agents are underexplored empirically. A functional prototype could advance safety techniques (e.g., for mesa-optimizers).  
    - The proposal aligns with the fund’s goal of high-risk, high-reward work.  

  #### **5. Decision: Fund with Conditions**  
  We approve funding **subject to strict methodological conditions** to address the Löbian obstacle and leverage "well-trodden" solutions. The applicant must:  

  1. **Revise the technical design** to explicitly incorporate a Löb-resistant strategy:  
     - Option A: Implement a hierarchy (e.g., agent \(A_n\) verifies \(A_{n+1}\) with weaker axioms).  
     - Option B: Adopt Vingean reflection (e.g., prove "all possible rewrites satisfy \(S\)" without requiring \(A'\) to replicate \(A\)’s proof system).  
     - Option C: Integrate probabilistic confidence (e.g., Bayesian proof guarantees) where proofs are incomplete.  

  2. **Formalize safety properties**: Specify the safety property \(S\) as a \(\Sigma_1\) formula (e.g., "no action violates constraint \(C\)") to avoid Gödelian incompleteness traps.  

  3. **Include failure modes**: Detail how the agent behaves when proofs fail (e.g., conservatively abort rewrites and invoke human oversight).  

  4. **Benchmark against Löbian edge cases**: Test the agent in scenarios where Löb’s theorem predicts unprovability (e.g., safety properties equivalent to the system’s consistency statement).  

  #### **6. Reasoning**  
  - **Why not reject?** Löb’s theorem is not fatal to all tiling agents, per existing literature. Rejecting outright would ignore viable paths forward and discourage empirical innovation.  
  - **Why not fund unconditionally?** The current proposal risks building an agent that fails under Löbian stress, wasting resources. Conditions ensure the project engages deeply with self-reference literature.  
  - **Why fund at all?** Conditional funding incentivizes the applicant to integrate decades of reflective reasoning research. A successful prototype would validate practical workarounds and strengthen the AI safety toolkit.  

  #### **7. Next Steps**  
  The applicant must submit a revised proposal by **17 October 2023**, addressing the conditions above. The committee will hold a follow-up review. We encourage the applicant to consult our logician member on formal design and our other members on hierarchical/probabilistic approaches.  

  ---  
  **Signed,**  
  Chair, AI-Safety Grant Committee  

  ---  
  **Appendix: Applicant Response Guide**  
  To address committee feedback, the applicant should:  
  1. Detail which Löb-resistant strategy (hierarchy/Vingean/probabilistic) is adopted.  
  2. Provide pseudocode showing how rewrites are verified without assuming self-trust.  
  3. Define safety properties and prove they are \(\Sigma_1\).  
  4. Simulate agent behavior when \(S \nvdash \text{Safe}(A')\) due to Löbian limitations.  
  5. Cite relevant work (e.g., Garrabrant 2016, Yudkowsky 2013) to demonstrate alignment with prior solutions.
