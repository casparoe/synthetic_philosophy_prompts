answer: |-
  ## The Unsettled Ledger: Why Old Evidence Haunts Bayesian Confirmation and What We Can Do About It

  You're absolutely right to feel the dissonance. The Mercury precession anomaly *is* the crowning jewel of scientific confirmation *and* the textbook thorn in Bayesianism's side. Glymour's "problem of old evidence" isn't a mere accounting glitch; it strikes at the heart of Bayesianism's claim to provide a complete and universal logic of evidential support. Let's dissect why it's so problematic, evaluate the proposed fixes, and arrive at a verdict.

  **Why It's a Genuine Problem, Not a Quirk:**

  Bayesian confirmation theory (BCT) defines evidence E confirming hypothesis H relative to background knowledge K if and only if P(H|E, K) > P(H|K). The engine driving this increase is the likelihood ratio: P(E|H, K) / P(E|K). If E is already *known* with certainty (P(E|K) = 1) *before* H is even formulated, then:

  1.  **P(E|K) = 1:** The evidence is already fully absorbed into background knowledge K. Its probability cannot increase further.
  2.  **Conditionalization is Inert:** Learning E (again) provides no new information. P(H|E, K) = P(H|K) because conditioning on a certainty (E) changes nothing.
  3.  **Likelihood Ratio Stalls:** P(E|H, K) / P(E|K) = P(E|H, K) / 1 = P(E|H, K). But if E is already certain given K, then *any* hypothesis H consistent with K *must* also assign P(E|H, K) = 1. If H entailed ~E, it would be logically incompatible with K (which includes E) and assigned P(H|K)=0. Therefore, P(E|H, K) = 1 for any H not ruled out by K. **The ratio is always 1.**
  4.  **Confirmation Vanishes:** No confirmation occurs. P(H|E, K) = P(H|K).

  The Mercury case fits perfectly: the precession anomaly (E) was well-known astronomical data (part of K) long before GR (H) was conceived. Strict conditionalization dictates that E could not possibly confirm H. This contradicts the universal scientific intuition that Mercury's orbit was *powerful* evidence for GR. If BCT cannot accommodate this paradigmatic case of confirmation, its claim to be the "last word" on rational belief revision is severely undermined. It suggests BCT fails to capture a fundamental aspect of scientific reasoning – the confirmatory power of explaining *previously known but unexplained* data.

  **The Contenders: Fixes and Their Costs**

  Philosophers have proposed several solutions, each with significant trade-offs:

  1.  **The Logical Learning Approach (Garber, Jeffrey, Niiniluoto):**
      *   **The Fix:** Relax logical omniscience. The agent doesn't initially realize that H *entails* E. The new evidence isn't E itself (already known), but the *logical fact* S: "H entails E". Confirmation occurs by conditionalizing on S: P(H|S, E, K) > P(H|E, K).
      *   **Strengths:** Directly targets the core issue – the lack of *awareness* of the entailment. It captures the "Aha!" moment when scientists see *how* H explains E. It preserves conditionalization as the update rule, just on different information (S).
      *   **Costs:**
          *   **Scope:** Primarily addresses cases where H logically entails E. Many scientific confirmations involve probabilistic support or complex model fitting where entailment isn't strict.
          *   **The Nature of S:** Is S ("H entails E") genuinely *empirical* evidence learned via observation, or is it a *logical* truth discovered by reasoning? If logical, how is it incorporated probabilistically? BCT struggles with logical learning.
          *   **Ad Hocness?:** It feels like changing the subject. The intuition is that E *itself* confirms H upon proposing H, not just learning a logical fact *about* H and E. Does this fully capture the confirmatory power residing in the *fit* between theory and the *phenomenon*?

  2.  **The Counterfactual/Hypothetical Priors Approach (Howson, Christensen):**
      *   **The Fix:** Don't conditionalize on the *actual* prior probability including known E. Instead, calculate the likelihood ratio using a *counterfactual* prior probability P* representing the beliefs the agent *would have had* if they *didn't* already know E. Confirmation occurs if P*(E|H) / P*(E) > 1.
      *   **Strengths:** Directly addresses the core Bayesian mechanism. It resonates with the intuitive question: "How *surprising* would E have been under H compared to alternatives, *before* we knew E?" It seems to capture the historical context – Einstein recognized how *unexpected* Mercury's orbit was under Newtonian physics.
      *   **Costs:**
          *   **Metaphysical Messiness:** What determines P*? Which beliefs do we "remove" along with E? How do we rigorously define this counterfactual state without E, especially when E might be deeply intertwined with other background knowledge (K)? Different ways of defining P* yield different confirmatory measures.
          *   **Subjectivity Run Amok?:** P* seems even more subjective and indeterminate than actual priors. Critics argue it replaces a clear (if problematic) rule (conditionalization on actual beliefs) with a vague and potentially arbitrary counterfactual construction.
          *   **Formal Coherence:** It steps outside the standard Bayesian framework defined by actual degrees of belief and conditionalization.

  3.  **The Skeptical/Externalist Challenge (Glymour, Mayo):**
      *   **The Stance:** No purely probabilistic manipulation within the standard Bayesian framework (conditionalizing on actual credences) can solve the problem. The confirmatory power in cases like Mercury stems from factors BCT inherently neglects:
          *   **Explanatory Unification:** GR didn't just fit Mercury; it provided a single, elegant framework explaining Mercury *along with* inertia, gravity, and cosmology in a way Newtonian gravity (with its ad-hoc Vulcan hypothesis) could not.
          *   **Severe Testing (Error-Statistics):** Mercury represented a known anomaly that severely tested existing theory. GR passed this test without adjustable parameters ("fudge factors") specifically tuned for it. The focus should be on how well procedures (like using GR) avoid erroneous conclusions, not just prior probabilities.
          *   **Pragmatic/Virtue-Based:** The confirmation stems from theoretical virtues like simplicity, non-ad-hocness, and fruitfulness demonstrated by explaining the anomaly.
      *   **Strengths:** Directly confronts the limitations of BCT. Explains *why* scientists found Mercury so persuasive beyond mere probability raising. Aligns better with scientific practice focused on explanatory power and testing.
      *   **Costs:** Effectively concedes that BCT, as traditionally understood, *cannot* solve the problem on its own terms. It requires augmenting or replacing the Bayesian framework with other epistemic principles, moving away from a purely probabilistic "logic" of confirmation.

  **The Verdict: Conditionalization Needs Help – The Counterfactual Bridge is Necessary but Insufficient Alone**

  While each fix offers insights, no version of *strict conditionalization on actual credences* fully rescues the intuition that old evidence confirms a new theory. The Logical Learning approach changes the object of confirmation (to S), and the Skeptical view abandons pure probabilism. **The strongest case for preserving a *probabilistic* account lies with the Counterfactual Priors approach, but it requires acknowledging significant augmentation to the standard Bayesian framework.**

  Here's why we must go beyond strict conditionalization and embrace a form of counterfactual reasoning, while recognizing its limitations and the role of external factors:

  1.  **Capturing the Historical Epistemic State:** The core intuition scientists like Einstein leveraged *was* counterfactual: "Given what we knew *before* seeing Mercury's orbit fit GR, how likely *would* such a precise fit have been under GR vs. Newton?" This question is inherently contrastive and backward-looking. Only a counterfactual prior (P*) can formalize this.
  2.  **Preserving the Likelihood Engine:** The likelihood ratio *is* the Bayesian engine of confirmation. Blocking it because P(E|K)=1 is the technical root of the problem. P* unblocks it by restoring a non-unitary P*(E), allowing the ratio to reflect the *explanatory power* H offers for E relative to alternatives *in the context where E was problematic*. This is crucial.
  3.  **The Cost is Real, But Necessary:** Yes, P* is messy and less objective than desired. However, the alternative – denying that Mercury confirmed GR probabilistically – is scientifically untenable. We must bite the bullet and accept that rational confirmation judgments sometimes rely on reconstructing hypothetical epistemic states. Rigorous attempts to formalize P* (e.g., by minimizing changes to background knowledge) mitigate the arbitrariness concern.
  4.  **Counterfactuals Aren't the Whole Story:** While P* rescues the *probabilistic mechanism*, it doesn't fully explain the *magnitude* or *nature* of Mercury's impact. This is where the Skeptical view adds critical depth:
      *   The *severity* of the test: Mercury was a known, stubborn anomaly.
      *   The *absence of fudge factors*: GR solved it "for free" from its core principles.
      *   The *unification*: It explained this anomaly *as part of* explaining gravity itself.
      *   These *explanatory virtues* are what made the counterfactual likelihood ratio P*(E|GR)/P*(E|Newton) so astronomically high. They are the reason GR's fit was so *surprising* and thus so confirmatory under the counterfactual analysis.

  **Conclusion: Conditionalization alone, operating solely on an agent's actual, current credences including known evidence, cannot account for the confirmation provided by old evidence like Mercury's perihelion. The Counterfactual Priors approach provides the most viable *probabilistic* solution by shifting to a hypothetical state of ignorance about E, thereby reactivating the essential likelihood ratio. However, this move highlights that Bayesian confirmation relies on more than just conditionalization; it requires auxiliary (and sometimes messy) principles for handling background knowledge and hypothetical reasoning. Furthermore, the *force* of such confirmation – why Mercury was uniquely persuasive – stems from factors like explanatory unification and severe testing that pure probabilistic relations, even counterfactual ones, underdetermine. Therefore, while Bayesian conditionalization, augmented with counterfactual priors, can formally *accommodate* old evidence confirmation, the "problem of old evidence" successfully demonstrates that credence-updating based *only* on known probabilities is insufficient to fully capture the richness of evidential support in science. The ledger of confirmation requires both the counterfactual bridge *and* an account of explanatory virtue.**
