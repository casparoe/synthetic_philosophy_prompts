prompt: |-
  I spent my career at the bench in molecular biology, and since retiring I've been reading a lot of epistemology for fun, which is probably why a case on the grants committee I still volunteer for has been nagging at me more then it should. A renewal proposal came through where three seperate reviewers went over the design and stats and couldn't find a thing wrong with it. Trouble is, the style of experiment it belongs to -- flashy effects from small samples -- just got hammered in a big multi-lab replication effort, and hardly any of the striking results in that mold held up. So the committee's split: one side says the track record of the whole approach has to outweigh any single proposal's specific merits, however careful; the other side says that once a category-wide statistic gets to override your own close look at a specific case, you've basically given up on trusting your own judgment about anything, including your judgment that the replication effort was done properly. I need to circulate a short memo before we reconvene next week that actually lands on fund / reject / fund-with-conditions, gives a rule we could reuse next time, and takes that second worry seriously rather than brushing past it. Can you draft that for me?
reasoning: |-
  Okay, the user is a retired molecular biologist who now studies epistemology and serves on a grants committee. They're struggling with a renewal proposal that looks solid on paper but belongs to a methodologically shaky category. Three reviewers found no flaws, yet similar "flashy small-sample" studies recently failed replication spectacularly. The committee is divided between rejecting based on the category's poor track record versus trusting their specific review. 

  Hmm. The epistemological tension here is delicious—exactly why it's nagging at them. On one hand, ignoring replication crisis evidence feels irresponsible; on the other, dismissing their own rigorous review feels like epistemic surrender. Their memo needs to resolve this while being actionable. 

  First, let's unpack their hidden needs: 
  - They want a decision rule that doesn't undermine scientific judgment. 
  - The "fund-with-conditions" option is likely the sweet spot. 
  - Must validate the committee's anxiety about overriding their review. 

  *scribbles mental notes* The replication failure isn't just background noise—it's a seismic shift in evidential standards. But saying "reject all small-n studies" would be lazy. Instead, frame it as: when a methodology's validity is newly contested, the burden of proof shifts. The proposal now needs stronger justification than pre-crisis. 

  *checks epistemology toolbox* Ah! This is like Laudan's "reticulated model" of science—we adjust methods when whole domains prove unreliable. Not abandoning judgment; upgrading it with new meta-evidence. 

  *structures memo* 
  Opening should validate both concerns. Then pivot: the replication study isn't "overriding" their review—it's revealing that their review criteria were incomplete. They assessed internal validity but couldn't evaluate external/replicability factors. Hence conditions: demand a robustness check (power analysis? pre-replication?) and explicit reckoning with the replication crisis. 

  *polishes phrasing* The rule must feel principled, not punitive. Emphasize this protects the PI too—funding a likely dead end helps nobody. And crucially, the conditions turn the proposal into a test case for whether this method *can* be redeemed. 

  Final touch: That last line about "judgment enhanced, not replaced" directly soothes their deepest fear. Nailed it.
answer: |-
  Here’s a draft memo addressing the epistemological tension while providing a clear decision path and reusable rule:

  ---

  **MEMORANDUM**  
  **To:** Grants Committee  
  **From:** [Your Name/Committee Role]  
  **Date:** [Current Date]  
  **Subject:** Decision Framework for Proposal [ID] — Balancing Specific Scrutiny and Field-Wide Evidence  

  ### **Proposal Summary & Conflict**  
  The renewal proposal from [PI/Lab] presents a methodologically sound experimental design (per unanimous reviewer consensus) but operates within a high-risk category ("flashy effects/small-N") recently undermined by multi-lab replication failures. The committee’s division reflects a core tension:  
  - **Side A:** Field-wide replication failures should supersede individual proposal merits.  
  - **Side B:** Overruling specific judgment with category-wide statistics risks epistemic abdication.  

  Both concerns are valid. Rejecting rigorous work solely based on field trends *can* erode scientific agency. However, ignoring overwhelming evidence of systemic fragility is equally unscientific. The solution lies in calibrating our threshold for "specific merits" in light of new field-wide data.  

  ### **Recommended Decision: Fund with Stipulations**  
  1. **Conditional Approval**: Fund the proposal, **contingent on two amendments**:  
     - **Power Retrospective**: PI must add a statistical appendix recalculating effect sizes/power using replication study data (e.g., "If effect sizes from [Replication Study X] are substituted, is power still sufficient?").  
     - **Explicit Risk Mitigation**: PI must outline how their design specifically addresses replication pitfalls (e.g., pre-registered protocols, blinded analysis, or negative controls added).  

  2. **Justification**:  
     - **Preserves Judgment**: We honor reviewers’ specific assessment of rigor while acknowledging that "rigor" now requires *demonstrated resilience* to newly revealed risks.  
     - **Epistemic Integrity**: Field-wide evidence updates priors but doesn’t override specifics; it demands *additional scrutiny* of those specifics. Conditions test whether the proposal’s merits hold under updated norms.  
     - **Productive Engagement**: Forces neither blanket rejection nor uncritical approval, but converts uncertainty into testable safeguards.  

  ### **Decision Rule for Future Cases**  
  > **When credible field-wide evidence (e.g., large-scale replications, meta-analyses) reveals systemic fragility in a methodology, proposals using that methodology must:**  
  > **a)** Explicitly address how their design mitigates the identified fragility, **and**  
  > **b)** Quantify robustness using post-crisis benchmarks (e.g., power calculations against shrunken effect sizes).  
  > *Failure to meet these conditions shifts the burden of proof from reviewers to the proposer.*  

  ### **Addressing the Epistemic Concern**  
  Trusting our judgment does not mean ignoring counter-evidence; it means *integrating* that evidence into our evaluation. The replication study doesn’t negate our reviewers’ expertise—it provides context they *could not have assessed* without external data. To dismiss this would be to privilege isolated scrutiny over collective empiricism. Our amended rule ensures field-wide evidence *enhances* our judgment rather than replaces it.  

  **Vote Recommendation:** Approve with stipulated amendments.  

  --- 

  ### **Key Philosophical Grounding**  
  This framework draws from **Bayesian epistemology**: prior probabilities (field-wide failure rates) update our evaluation of new evidence (the proposal), but do not deterministically override it. It also aligns with **Lakatosian research programmes**, treating replication crises as signals to fortify a methodology’s "protective belt" (e.g., stricter controls) rather than abandon it wholesale.  

  This approach respects both the reviewers’ labor and science’s self-correcting nature while delivering actionable guidance. I recommend we adopt the rule above for future high-risk/high-reward categories.
