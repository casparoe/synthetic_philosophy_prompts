  ## Memorandum: Faculty Panel Recommendation re: Nonfiction Thesis Ethics  

  **To:** Program Director, MFA Program  
  **From:** Faculty Review Panel (Fiction/Nonfiction Tracks)  
  **Date:** [Current Date]  
  **Subject:** Recommendation on Student Thesis (#[Redacted]) & Proposed Nonfiction Disclosure Policy  

  ### I. Panel Consensus & Core Principles  
  After thorough deliberation, this panel acknowledges the profound tension inherent in contemporary creative nonfiction (CNF) between emotional truth and factual fidelity. We affirm that memoir is not stenography—reconstructed dialogue, compressed timelines, and subjective interpretation of events are established conventions. However, **we unanimously find that the student’s thesis crosses a critical ethical boundary by presenting *invented events of significant consequence* as factual occurrences.** The three fabricated scenes (deathbed reconciliation, suicide attempt, and altered courtroom resolution) constitute a breach of reader trust, particularly given their function as narrative anchors. While lyric and braided forms allow elasticity, they do not license the creation of *nonexistent pivotal events* that materially alter the reader’s understanding of reality.  

  ### II. Disposition of Student Thesis & Journal Publication  
  1. **Thesis Approval:**  
     - **Conditional approval** pending **major revision**. The student must either:  
       a. **Remove all invented scenes** and restructure the thesis around verifiable events, or  
       b. **Reclassify the work as autofiction/essayistic fiction**, with clear genre labeling and a prefatory note explicitly stating that key events are invented.  
     - No degree conferral until revisions are approved by the thesis advisor *and* one impartial panel member.  

  2. **Journal Publication:**  
     - **Publication must be halted** unless the journal agrees to:  
       a. **Reprint the work as "Hybrid Nonfiction/Fiction" or "Autofiction"** with equal prominence, *and*  
       b. **Include an editor’s note** disclosing that the essay contains invented pivotal scenes.  
     - If the journal refuses, publication should be withdrawn. The program cannot endorse material misrepresentation.  

  ### III. Proposed Program Disclosure Policy for Nonfiction  
  To prevent recurring conflicts, we propose a mandatory **"Ethical Transparency Framework"** for all CNF theses/workshops:  

  | **Technique Used**          | **Disclosure Requirement**                                                                 |  
  |----------------------------|--------------------------------------------------------------------------------------------|  
  | Reconstructed dialogue/scenes | *Optional* note: "Dialogue has been reconstructed from memory and reflects the essence of conversations." |  
  | Composite characters/events | *Required* preface: "Certain characters/events are composites."                            |  
  | **Invented pivotal events** | *Required* genre relabeling (e.g., "Autofiction" or "Speculative Memoir") + **explicit disclaimer**: "This work contains invented scenes central to its narrative arc." |  
  | Alterations of outcome      | *Required* disclaimer: "Key outcomes have been altered for narrative purposes."            |  

  - **Workshop Protocol:** Faculty must discuss this framework in *all* introductory CNF courses. Students must submit a **Disclosure Statement** with thesis drafts, cataloging all deviations from strict factuality.  
  - **Syllabus Revision:** Include readings on CNF ethics (e.g., D’Agata’s *The Lifespan of a Fact*, Lopate’s *The Art of the Personal Essay*) to contextualize debates.  

  ### IV. Addressing the "All Memoir Invents" Position (Colleague A)  
  The panel acknowledges Colleague A’s argument that memoir universally employs invention and that rigid fact-checking is both impractical and antithetical to the genre’s artistic aims. We agree that *many* memoirs on our syllabus reconstruct private moments or dialogue. However, we distinguish between:  
  - **Reconstruction:** Rendering subjective truths where gaps exist (e.g., "Grandmother sighed when I left" based on known estrangement).  
  - **Invention:** Creating *nonexistent, high-stakes events* that falsify historical/emotional realities (e.g., "She whispered forgiveness as I held her hand," when no deathbed meeting occurred).  

  The former operates within memoir’s contract of "good-faith subjectivity"; the latter breaches it by demanding belief in demonstrable falsehoods. Augustine’s *Contra Mendacium* insightfully notes that **intent** defines a lie: here, the essay’s unmarked inventions *intend* the reader to accept fiction as fact. This collapses the distinction between memoir and fiction—a line our program must uphold to maintain academic and artistic integrity.  

  ### V. Conclusion  
  This case underscores CNF’s evolving ethics. Our recommendation prioritizes **transparency over prohibition**, allowing artistic innovation while honoring reader trust. We urge swift adoption of the disclosure policy to empower future students with clear guardrails. The panel is available to draft formal guidelines for faculty review.  

  **Recommended by:**  
  [Your Name], Faculty Panel Chair  
  [Colleague A Name]  
  [Colleague B Name]  

  ---  
  **Key Strengths of This Approach:**  
  1. **Balances artistic freedom with accountability** by offering the student a path forward via genre relabeling.  
  2. **Prevents future disputes** with a scalable, tiered disclosure system.  
  3. **Honors both panelists’ views** by validating memoir’s inherent subjectivity while defining a breach point.  
  4. **Protects institutional reputation** by rejecting unmarked fabrication.  
  5. **Aligns with industry standards** (e.g., Mary Karr, Vivian Gornick) that permit reconstruction but condemn invention of "unhappened happenings."  

  Would you like a draft of the student-facing revision guidelines or the journal notification letter?
