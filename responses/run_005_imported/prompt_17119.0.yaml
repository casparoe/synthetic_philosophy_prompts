  I recall that Marco is likely referring to the distinction between material implication and counterfactual conditionals. The material conditional "if not-Dan, then Yuki" is true as long as Dan did it, even if Yuki wouldn't have done it otherwise. But in common language, people might interpret it as a counterfactual: if Dan hadn't done it, Yuki would have. That's the JFK example: if Oswald didn't kill Kennedy, someone else did (material) vs. if Oswald hadn't killed Kennedy, someone else would have (counterfactual). The latter implies a conspiracy.

  Applying this to the leak: Marco's first statement is a material conditional: if not-Dan, then Yuki. That's logically sound given the two suspects. But when he bets on Yuki, he's making a different claim based on her behavior. Beth conflates the material conditional with the counterfactual, thinking Marco is saying Yuki would have done it if Dan didn't. But Marco clarifies they're different, which is correct.

