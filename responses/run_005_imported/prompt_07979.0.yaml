prompt: |-
  Okay, kind of a weird ask, but I'm hoping you can help me get a scene right for book three of my generation-ship series. Quick context: forty-some years into the voyage, a strange energy field near a dead star spontaneously assembles a molecule-for-molecule duplicate of Wren, the protagonist's sister, who actually died in an airlock accident a decade earlier. Duplicate-Wren shows up with all of original Wren's memories and mannerisms, the whole package, but she obviously never lived through any of it, she just winks into existence fully-formed one afternoon. (I've already got a scene elsewhere dealing with whether she "counts as" Wren for legal and emotional purposes, so that's not what I need help with here.)

  What I'm stuck on is a scene where the ship's resident philosopher, Halloway, an ex-academic who got attached to the mission as "bioethics officer" because the funding consortium insisted on having one, and the chief xenobiologist, Reyes, who has zero patience for what she calls his seminar-room nonsense but is genuinely sharp and not written to be a pushover, get into it over whether duplicate-Wren's memories and beliefs are actually about anything. Like: when she "remembers" her mother's laugh, or looks at her brother and "recognizes" him, is there real reference happening there, or is it just a very convincing structural echo with nothing on the other end. Halloway's position is that content requires history, that a state only gets to be about something if it was actually shaped by tracking or interacting with that thing over time, so duplicate-Wren's states don't refer to anything no matter how they feel from the inside. Reyes thinks that's mysticism dressed up as rigor, and that whatever a state is hooked up to right now, causally, is all that could ever matter, pedigree be damned. I want it written as a real argument, they've clearly had versions of this fight before, so each of them should have a comeback ready for the other's obvious move, and neither should come off as the one who's obviously wrong. Can you write me that exchange, just the dialogue itself with minimal stage direction, a page or so is fine, and actually engage with the real philosophy of mind on this rather then just gesturing at "what makes someone real"?
