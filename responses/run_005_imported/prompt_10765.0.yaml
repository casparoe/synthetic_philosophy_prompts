answer: |-
  ## Memorandum: Teaching Evaluation Policy Recommendation  
  **To:** Teaching Effectiveness Committee  
  **From:** [Your Name], Contingent-Faculty Representative, MFA Program  
  **Date:** October 26, 2023  
  **Subject:** Revised Approach to Student Evaluations for Adjunct Contract Renewal  

  ### I. Core Problem & Context
  Our current policy, using a university-wide average of 3.5/5.0 to trigger mandatory improvement plans for adjunct renewals, suffers from **Simpson's Paradox**. As the data shows:
  *   **University-Wide Average:** Adjuncts (3.4) < Tenure-Line (3.9).
  *   **Course-Level Averages:** Adjuncts perform *equal to or better than* tenure-line faculty when teaching comparable courses (e.g., Intro, Intermediate, Advanced Seminars).

  The discrepancy arises because adjuncts teach a disproportionate share of large, mandatory introductory courses (which students consistently rate lower, regardless of instructor quality), while tenure-line faculty teach more small, self-selected upper-level seminars (which students consistently rate higher).

  The core dispute is whether **adjusting for course level** fairly corrects this statistical distortion or inadvertently masks a **real quality difference** stemming from how chairs assign courses (i.e., potentially assigning "weaker" instructors to "easier" intro courses).

  ### II. Analysis & Recommendation: A Balanced, Phased Approach
  **Recommendation:** **Adopt a course-level-adjusted evaluation benchmark for adjunct contract renewal decisions, implemented with specific safeguards and a review timeline to address selection-bias concerns and data limitations.**

  #### A. The Core Adjustment: Why It's Necessary & Fair
  1.  **Correcting the Illusion:** Comparing an adjunct teaching five sections of "History 101: The Giant Lecture" (avg. rating 3.2) to a tenure-line professor teaching "History 450: My Favorite Niche Topic" (avg. rating 4.3) using a *single university-wide average* is fundamentally misleading. It compares apples to oranges. Adjusting for course level creates **like-for-like comparisons**.
  2.  **Evidence of Fairness:** The data demonstrates adjuncts perform well *within* their assigned course contexts. Punishing them statistically for *which* courses they are assigned to teach is inequitable and fails to measure their actual effectiveness in those roles.
  3.  **Addressing the "Selection Effect" Worry Head-On:** While it's *possible* chairs assign "weaker" instructors to intro courses, our policy must be based on evidence, not assumption.
      *   **Current Data Doesn't Support It:** We lack data showing that lower *course-level* scores for intro classes taught by adjuncts are due to *instructor* quality rather than inherent course characteristics (size, mandatory status, student motivation).
      *   **Recommendation:** **Mandate Department Chairs to document the rationale for course assignments** (especially intro vs. upper-level) for contingent faculty during the review period. This creates accountability and provides data for future analysis of potential bias. *This directly addresses the selection-effect concern by generating evidence.*

  #### B. Addressing Data Limitations (Small Sample Sizes)
  1.  **Set Minimum Thresholds:** Adjusted comparisons should only be used for course categories where there is a **minimum number of instructors (e.g., 5) and a minimum number of sections (e.g., 10)** within the relevant time period (e.g., 3 years) to ensure statistical reliability. For very niche courses or new offerings with insufficient data, default to the *department-level* average for that course *type* (e.g., "upper-level seminar") or use qualitative review as the primary factor.
  2.  **Emphasize Trends & Qualitative Context:** Adjusted scores should never be the sole factor. Look at **trends over time** (is the instructor improving in similar courses?) and incorporate **peer observations, syllabi review, and teaching statements**. A single low score in a small cell shouldn't be catastrophic.

  #### C. Implementation Timeline & Review
  1.  **Immediate Implementation (Spring Renewals):** Apply the course-level-adjusted benchmark for pending adjunct renewal decisions (like our History colleague). Use the best available data with minimum thresholds as above. The 3.5 trigger threshold should be **recalibrated** to match the typical average for each course level/category (e.g., perhaps 3.2 is "meets expectations" for large intro lectures, while 4.0 is expected for small seminars).
  2.  **Pilot Period (2 Years):** Implement this adjusted system as a pilot for adjunct renewals. Simultaneously, require Chairs to document course assignment rationales.
  3.  **Comprehensive Review (Year 3):** After two years, conduct a rigorous review:
      *   Analyze the documented course assignment rationales for patterns of potential bias.
      *   Evaluate the reliability of adjusted scores, especially in small cells.
      *   Assess if the policy is working fairly and effectively.
      *   Determine if the policy should be extended, modified, or applied more broadly.

  ### III. Specific Policy Amendment Proposal
  Replace the current university-wide 3.5/5.0 benchmark for adjunct renewal/improvement plans with the following:

  > **"For adjunct faculty contract renewal decisions, student evaluation scores shall be assessed relative to the average scores for comparable course levels and types (e.g., large introductory lecture, small upper-level seminar) within the instructor's department over the previous three years, where sufficient data exists (minimum of 5 instructors and 10 sections).**
  >
  > **A score significantly below (e.g., >0.3 points) the relevant course-level average may trigger a review. This review must incorporate additional evidence of teaching effectiveness (e.g., peer observation, syllabus design, assignment quality, teaching philosophy) before determining if a mandatory improvement plan is warranted.**
  >
  > **Department Chairs must document the rationale for assigning contingent faculty to specific course levels/types.**
  >
  > **This policy shall be reviewed after two years of implementation, with particular attention to the documentation of assignment rationale and the reliability of comparisons in courses with low enrollment."**

  ### IV. Why This Approach Works
  1.  **Statistically Sounder:** Directly addresses Simpson's Paradox by enabling fair comparisons.
  2.  **Addresses Core Concerns:** Doesn't ignore selection bias; mandates evidence collection (assignment rationale) to investigate it. Mitigates small-sample issues with thresholds and qualitative review.
  3.  **Practical & Actionable:** Provides clear guidance for departments and Chairs. Piloting allows for refinement.
  4.  **Fair & Equitable:** Judges adjuncts on their performance in the specific teaching contexts they are assigned, which is the reality of their work.
  5.  **Defensible to the Dean:** Grounded in statistical reasoning, acknowledges limitations, incorporates safeguards, and includes a built-in review process. It replaces a flawed, simplistic metric with a more nuanced, evidence-based approach.

  ### V. Conclusion
  The current university-wide average is demonstrably unfair to adjuncts teaching challenging introductory courses. While the selection-effect worry is valid, it should be investigated through evidence (documented assignment rationale), not used to justify maintaining a flawed metric that penalizes faculty for factors beyond their control. Adopting a course-level-adjusted benchmark, implemented cautiously with minimum data thresholds and mandatory documentation of assignments, provides a significantly fairer and more accurate basis for evaluating adjunct teaching effectiveness for contract renewal. I urge the committee to support this phased, evidence-based approach.

  Respectfully submitted,  
  [Your Name]
