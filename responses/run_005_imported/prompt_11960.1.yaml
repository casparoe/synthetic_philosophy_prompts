answer: |-
  Here’s a dialogue between **Dr. Bratman** (representing the individualist, intention-meshing view) and **Dr. Gilbert** (defending the joint-commitment view), debating your band situation. They engage deeply, challenge each other’s core claims, and wrestle with your visceral reaction—without Gilbert "winning" by default.  

  ---

  ### **Scene:** A philosophy conference coffee break.  
  **Characters:**  
  - **Dr. Bratman:** "Shared intentions are just interlocking personal intentions."  
  - **Dr. Gilbert:** "Joint commitments create irreducible obligations."  

  ---

  **Gilbert:** *(Overhearing Bratman recounting your story to a colleague)* ...And *that’s* precisely why your guitarist’s text is a moral injury, Michael. When three people form a band—rehearsing weekly, booking gigs, inviting crowds—they create a *plural subject*. Each member owes the others fidelity to the shared goal. Walking away without consultation violates the standing to demand performance.  

  **Bratman:** Margaret, you’re conflating *feelings* with *obligations*. The band’s "shared intention" reduces to three individuals: *I* intend to play the gig, *I* believe *you* intend to play, and *I* expect my intention to mesh with yours. If the guitarist’s intention changes, it’s disappointing—even blameworthy if he misled them—but it’s not a breach of some phantom "group entity."  

  **Gilbert:** Phantom? When the singer shouted, "You can’t just do that *to us*," that "us" isn’t rhetorical! Take your own example: two people walking together. If one stops abruptly without warning, the other doesn’t just sigh, "How unfortunate." They protest: *"We* were walking together!" The objection only makes sense if a joint commitment existed—one that binds independently of their personal whims.  

  **Bratman:** But the "binding" you describe is psychological, not moral. The walker’s protest stems from *reliance*: they adjusted their pace, maybe missed a turn, based on mutual responsiveness. The guitarist’s bandmates relied on him—they rehearsed, promoted, invested time. When reliance is betrayed, frustration follows. But that’s explained by shattered *individual* expectations, not a mystical group bond.  

  **Gilbert:** Then why does the singer feel *wronged*, not just inconvenienced? Reliance might explain irritation, but not the specific sense of betrayal—as if a promise *to the group itself* was broken. Your "meshing intentions" model can’t capture why the guitarist owes *the band* an explanation, not just apologies to each member separately.  

  **Bratman:** Ah, but it can! The singer’s fury comes from the guitarist’s *attitude* toward their interlocking intentions. He didn’t merely exit; he dismissed the mutual reliance as morally inert—"nobody signed anything." That reveals a failure of respect for their *ongoing coordination*. It’s not that the group *as such* was harmed; it’s that he disregarded the web of dependencies he helped create.  

  **Gilbert:** But dependencies exist in all cooperative acts! What’s distinct here is the *joint commitment*: the band formed a "pool of wills" toward a goal. When the guitarist quit via text, he didn’t just alter his plan—he unilaterally dissolved a mini-polity. That’s why the protest isn’t "You hurt me," but "You betrayed *us*." Your model reduces this to parallel personal grievances, but the anger is collective.  

  **Bratman:** Is it? Imagine the bassist isn’t upset—say, they disliked the guitarist anyway. Does the singer still feel "we" were wronged? Probably not. The "collective" feeling depends entirely on each member’s personal investment. Strip away individual reactions, and the "group wrong" vanishes. Your "plural subject" is an elegant metaphor, Margaret, but it doesn’t add moral weight.  

  **Gilbert:** Elegant? It’s ontological! When people commit jointly, they create a new entity with normative force. The guitarist didn’t just quit a gig; he violated the *terms of association*. That’s why even a stranger could grasp the betrayal: "A bandmate ditched them last minute? That’s rotten." No one asks, "But did they *sign* something?"  

  **Bratman:** Yet your theory can’t explain why the singer’s outrage *fades* if the guitarist finds a replacement. Why? Because the *practical coordination* is restored! The "obligation" was always about sustaining the mesh of plans. Your joint commitment persists even if replacement guitarists exist—but intuitively, the wrong *is* mitigated.  

  **Gilbert:** *(Leans in)* Is it? Suppose the replacement is flawless. The singer might still resent that the guitarist abandoned *their* project—the one *they* built. The wrong isn’t just practical; it’s social. Like snubbing a friend’s wedding for a fancier party: the practical harm might be nil, but the relational rupture remains.  

  **Bratman:** ...And that relational rupture is a sum of personal betrayals. The guitarist knew his friends staked pride on this gig. He chose self-interest over loyalty *to them*. The intensity comes from proximity, history, vulnerability—all individual-level factors. You don’t need "group persons" to explain why it cuts deeper than a stranger’s cancellation.  

  **Gilbert:** But the loyalty isn’t just to each other as individuals; it’s to the *enterprise they became together*. That’s why "You promised *the band*" rings true—even without paperwork.  

  **Bratman:** And I’d argue that "the band" is shorthand for "you promised *us*, the people counting on you." The guitarist was morally reckless with others’ plans. That’s sufficient to condemn him—without reifying the group.  

  ---

  ### **Conclusion (within their frameworks):**
  - **Gilbert’s Verdict:** The guitarist violated a joint commitment constitutive of the band itself. The others have standing to rebuke him *as a member*—not just as individuals.  
  - **Bratman’s Verdict:** The guitarist failed to respect the interlocking intentions he helped create. His moral failing was toward his bandmates’ reliance and vulnerability—not a freestanding "group duty."  

  ### **Why Your Reaction Feels So Strong (Bratman’s Answer):**  
  The fury stems from the *density* of reliance: you structured months of effort around mutual responsiveness. His flippant exit ("nobody signed anything") revealed he never took your *interdependent agency* seriously. It’s not that he harmed a "group entity"—it’s that he treated your shared project as disposable, ignoring how deeply his choices shaped others’ lives. That’s a profound failure of respect for co-participants in a fragile human endeavor.  

  ### **The Core Tension:**  
  Gilbert sees the *unity* of the band as morally foundational; Bratman sees it as emergent from individual bonds. Your guitarist acted as if Bratman were right ("no contract = no obligation"), but your reaction channels Gilbert’s insight: some commitments transcend the sum of their parts. Philosophically, it remains unresolved—but your anger needs no contract to be valid. It’s the sound of fractured trust in a shared world you built.  

  Would you like a breakdown of how either philosopher might suggest handling the aftermath?
