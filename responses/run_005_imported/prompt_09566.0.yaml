prompt: |-
  Okay so last night my friend Jonas and I got into it for like two hours over this: imagine you've got a batch of medicine, and you can either use the whole thing to save one person who will otherwise die, or split it up to save five different people who are also each going to die without their share. Jonas's position was dead simple -- obviously you save the five, five lives beat one life, thats just arithmetic. I brought up Taurek's old "Should the Numbers Count?" paper, where he argues that you can't actually just add up badness across different people like that, because a death is only ever bad *for* the person who dies -- there's no "view from nowhere" where five deaths make a bigger blob of badness than one death -- so nothing forces you to prefer saving the five, and he even suggests flipping a coin to give the one person and the five-as-a-group an equal shot, since that treats everyone's claim with equal respect instead of just crunching numbers. Jonas was definitly not having it, and countered with something like "well if you didn't know in advance whether you'd end up in the group of one or the group of five, you'd obviously want the policy to be 'save the greater number', so thats the fair rule" -- which I think is basically Scanlon's move, though neither of us remembered whose argument it actually was until after he left and I looked it up. I didn't have a great comeback in the moment and I've been replaying it in my head ever since.

  Can you settle this for me by writing a dialogue between two people who each actually know what they're talking about -- one a convinced Taurekian who denies that sheer numbers give anyone extra moral reason to act, and one who thinks the numbers obviously matter and is willing to defend that with the strongest arguments available (the ex ante/contractualist reasoning Jonas was groping towards, Parfit's "Innumerate Ethics"-style objections, whatever works best). I don't want either side to be a pushover or a strawman -- I want them to really respond to each other's specific points, like, if the numbers-guy brings up the ex ante argument, the Taurekian should actually engage with it instead of just repeating "badness isn't additive," and vice versa. Set the scene however you like, but keep the medicine case (or something structurally identical) as the concrete example they keep coming back to.
