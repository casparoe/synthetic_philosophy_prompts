answer: |-
  ## Dialogue: The Boundary Problem in Concrete Waters

  **Setting:** A university common room after a seminar. Dr. Elara Vance (Affected-Interests Advocate) and Dr. Marcus Royce (Coercion Theorist) sip coffee, still buzzing from the seminar on democratic boundaries.

  **Case:** The legislature of "Uplandia" is voting tomorrow on the massive "Granite Reach Dam." Hydrologists predict significant downstream pollution in the river "Silvertail," which flows into "Lowlandia," severely impacting thousands of Lowlandian subsistence farmers who rely on it for irrigation. Lowlandians have no representation in Uplandia's legislature. A proposal to grant Lowlandian farmers formal consultation rights was rejected; a proposal for voting rights was dismissed as absurd by Uplandian nationalists.

  **Dr. Vance (Affected-Interests):** Marcus, this dam is the perfect illustration of why Goodin’s principle bites. Those Lowlandian farmers aren’t just *mildly* inconvenienced. Their livelihoods, potentially their food security and way of life, are being fundamentally altered by a decision made in a distant capital where they have zero voice. The all-affected principle *demands* they have a say, at the very least through formal, binding consultation, ideally through some form of weighted representation in the decision.

  **Dr. Royce (Coercion):** Elara, I share your concern for the farmers. It’s a terrible outcome. But leaping to enfranchisement or even binding consultation *within Uplandia’s legislature* based on "affected interests" is precisely where the principle explodes into unworkability. *Every* significant state action affects someone beyond its borders. Trade policy affects foreign producers. Environmental regulations (or lack thereof) affect global climate. Sanctions affect civilians abroad. Granting voting rights to everyone potentially affected by Uplandia’s decisions functionally dissolves Uplandia’s demos into a *global* electorate. That’s administratively impossible and politically incoherent. Democracy requires a bounded community to function. Abizadeh’s point is that the *legitimacy* of that bounded community’s *coercive power* must be justified to those subjected to it. The Lowlandian farmers aren’t subjected to Uplandia’s *ongoing, systemic legal coercion*.

  **Dr. Vance:** Ah, but that’s where I think *your* principle, pressed consistently, explodes just as wide! Let’s talk about coercion. Uplandia *will* use its police, its courts, its border guards, to *enforce* the property rights of the dam builders, to prevent sabotage, to physically exclude Lowlandians from accessing the now-polluted river on *their* side of the border. Isn't that direct coercion applied extraterritorially? And crucially, what about Lowlandians who might protest on the Uplandian side? They’d be arrested by Uplandian police, subject to Uplandian courts – classic coercion! Doesn’t your principle require justifying *that* coercion to them? If it does, then suddenly, anyone potentially subject to Uplandian coercion *in the context of enforcing this dam's consequences* must be included, which looks very much like including the affected farmers.

  **Dr. Royce:** You’re blurring distinct types of coercion, Elara. Abizadeh focuses on the *constitutive* coercion of the *legal-political order itself*. Who is *routinely* subject to the state’s monopoly on legitimate force and its authoritative legal commands within its jurisdiction? The dam enforcement is *specific* enforcement of a *particular* law/policy, not the foundational coercion of being subject to the state’s rule *as such*. Resident non-citizens in Uplandia *are* subjected daily to Uplandian tax law, criminal law, contract law – the entire coercive apparatus structures their lives. *That’s* why they must be included in the *demos* justifying that order. The Lowlandian farmer, living wholly under Lowlandia’s legal order, only encounters Uplandian coercion sporadically, as a *consequence* of a specific policy, not as a subject of Uplandia’s sovereign authority. Including them conflates policy impact with subjection to the polity’s foundational power.

  **Dr. Vance:** That feels like an artificial distinction crafted *precisely* to preserve existing borders! What’s "constitutive"? Isn't the ability to build the dam, backed by force, part of what *constitutes* Uplandia's sovereign power? And if a Lowlandian crosses the border to fish in the polluted river remnant and is arrested, how is that "sporadic" coercion meaningfully different, *to them*, from the coercion experienced by a resident non-citizen jaywalking? Both are subjected to Uplandian state force for violating Uplandian law. If the jaywalker deserves a voice in Uplandia’s laws because of that subjection, consistency demands the same for the Lowlandian fisher facing arrest. Your narrow "constitutive" definition seems arbitrary when faced with real, forceful state action across borders. Doesn't *any* exercise of coercive power require justification to those coerced *in that instance*?

  **Dr. Royce:** It’s not arbitrary; it’s about the *scope of authority*. The resident non-citizen lives within the *territorial jurisdiction* where Uplandian law claims ultimate, everyday authority. The Lowlandian fisher is a subject of *Lowlandian* authority who might incidentally encounter Uplandian force *at the margins*. Granting voting rights based on isolated enforcement incidents *is* administratively chaotic and dissolves boundaries. My principle focuses on who is *presumptively bound* by the state’s general legal framework. The solution for Lowlandians isn't voting in Uplandia, but stronger international law, treaties, or pressure on the Uplandian state *as a whole* via their *own* state or global bodies. We need bounded demoi to function, but those demoi must justify their coercive borders to outsiders *as a matter of legitimacy*, not necessarily grant them internal voting rights.

  **Dr. Vance:** But "stronger international law" just pushes the boundary problem up a level! Who decides those laws? Another bounded group? And justifying borders "as a matter of legitimacy" sounds nice, but what does it *mean* practically for those farmers facing ruin tomorrow? My principle offers a clearer, more direct remedy for tangible harm: if you're deeply affected, you get a voice *in the decision causing the harm*. Yes, drawing the line on "how affected" is hard, but it’s grounded in concrete impact, not a potentially fuzzier distinction about types of coercion. We can develop thresholds – significant, direct, demonstrable harm – far more feasibly than trying to define the exact metaphysical point where "constitutive" coercion begins.

  **Dr. Royce:** And your "significant impact" threshold is vulnerable to endless expansion, Elara. Does a worker in a foreign factory affected by Uplandian tariffs meet it? The family breathing Uplandian industrial emissions drifting across the border? It’s a slippery slope to global suffrage for every national vote. My coercion principle, while complex, provides a firmer anchor in the *institutional reality* of state power and subjection. The line is the reach of the state’s *routine, governing* coercive authority.

  **Dr. Vance:** But your anchor seems moored *to* the very boundary we’re questioning! And let’s not forget the elephant in the room, Marcus. *Whichever* principle we pick – affected interests or subjected to coercion – we still need *some* prior, bounded entity to *adopt* that principle as its rule for defining membership. Goodin needs a body to decide *who* counts as affected. Abizadeh needs a body to recognize *who* is subjected to its coercion. It’s the regress Whelan identified! We haven’t *solved* the foundational paradox; we’ve just chosen different normative principles to *guide* the drawing of boundaries once *some* initial, non-democratic (or democratically ambiguous) founding moment has occurred.

  **Dr. Royce:** (Sighs) You’re right, Elara. The spectre of the founding moment haunts us both. My principle doesn’t magically create the first demos democratically. It just insists that any *existing* demos, exercising coercive power, must justify its boundaries to those excluded and coerced by them. It’s a principle for *critiquing* and *legitimizing* existing boundaries, not a magic formula for drawing the first one. The regress means there’s no perfectly democratic origin story.

  **Dr. Vance:** Exactly. And my principle is similarly a tool for *challenging* boundaries drawn without regard for those they harm profoundly. Neither escapes the original conundrum. So perhaps our real disagreement boils down to this: when faced with harm across borders, do we prioritize **preventing concrete, significant harm to outsiders** by giving them voice *in the harming polity* (even if it strains administrative feasibility and traditional sovereignty), or do we prioritize **maintaining administratively feasible, bounded demoi** and address harm through other channels (even if those channels are weaker and the "constitutive coercion" line feels exclusionary to those suffering)?

  **Dr. Royce:** That’s a fair distillation. I see the moral force in preventing harm, Elara, truly. But I fear the practical and conceptual dissolution of democracy itself if we abandon the bounded community as the site of collective self-rule. We need borders to have democracy; those borders must be justifiable, but they can’t be infinitely porous based on impact. The farmers deserve remedy, but not necessarily a Uplandian vote.

  **Dr. Vance:** And I see the practical need for borders, Marcus, but find the exclusion of those catastrophically harmed by decisions they had no part in fundamentally *undemocratic* in spirit, regardless of the type of coercion involved. The farmers deserve *a direct say* in what happens to their river. Our principles point us towards different ways of managing the inherent tension between democracy’s need for boundaries and its demand for inclusion. Neither resolves the original regress, and neither, I suspect, will fully satisfy the other.

  **Dr. Royce:** (Raises coffee cup) To the enduring puzzle of the demos, then. May we keep wrestling with it.

  **Dr. Vance:** (Clinks cup) Agreed. And may the Lowlandian farmers find justice, somehow.
