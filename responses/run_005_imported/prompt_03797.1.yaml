  Warren's position resonates with experimentalists: decoherence makes superpositions practically unobservable, so why sweat the metaphysics? But Noor's insistence on the untouched global superposition is mathematically airtight. I recall Zurek himself emphasizes this distinction - decoherence selects bases but doesn't collapse wavefunctions. 

  Where Warren scores points: Before decoherence, the "preferred basis problem" was genuinely mysterious. Why do measurements always yield position-like outcomes? Einselection answers that beautifully. But Noor's counter is valid too - knowing why we get definite positions doesn't explain why we get this particular position. 

