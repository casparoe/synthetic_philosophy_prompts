answer: |-
  This is a brilliant example of how everyday situations can stumble into deep metaphysical territory! You're grappling with a core problem in **mereology** (the study of parts and wholes) and the **metaphysics of ordinary objects**. Neither you nor your roommate is entirely wrong, and the strangeness you feel points to genuine philosophical puzzles. Here's a breakdown of the main perspectives:

  1.  **Nihilism (or Mereological Nihilism):**
      *   **The View:** Only the fundamental parts truly exist. There are no composite objects – only atoms (or fundamental particles) arranged in certain ways.
      *   **Applied to the Couch:** There were *only ever three cushioned units*. When they were arranged flush together, we *described* them as "a couch" for convenience. When pulled apart, we *described* them as "three armchairs." No object called "the couch" came into or went out of existence. Only the arrangements and our descriptions changed.
      *   **Pros:** Solves the strangeness of objects popping in/out of existence. Very ontologically parsimonious (avoids multiplying entities).
      *   **Cons:** Radically counterintuitive for daily life (denies the existence of tables, chairs, cars, people?).

  2.  **Unrestricted Composition (Universalism):**
      *   **The View:** *Any* arbitrary collection of objects, no matter how scattered or unrelated, composes a further object. There exists an object for *every possible combination* of parts.
      *   **Applied to the Couch:** When the three units were touching and arranged in an L-shape, they composed an object: the couch. When you pulled them apart, they *ceased* to compose the couch. However, they *now* compose a new object: the scattered fusion of the three units (which we happen to call "three chairs," but it's also one object). There's also an object composed of the left unit and the lamp, and an object composed of the middle unit and a distant star... etc.
      *   **Pros:** Provides a simple, universal rule for when composition occurs (it *always* occurs). The couch genuinely existed while arranged.
      *   **Cons:** Wildly multiplies entities beyond what we normally acknowledge (e.g., the object "couch-unit-left + my coffee cup"). Feels ontologically extravagant.

  3.  **Moderate Views (e.g., Van Inwagen's Special Composition Question):**
      *   **The View:** Composition occurs, but *only under specific conditions*. There's a non-arbitrary answer to the "Special Composition Question": When do some things compose something?
      *   **Common Answers:**
          *   **Functional Unity:** Things compose an object when they are fastened together and function as a single unit (e.g., the couch when assembled).
          *   **Continuity/Contact:** Things compose an object when they are in contact (or continuous).
          *   **Human Intention/Design:** Things compose an object when they are arranged according to a human design plan for a specific function.
      *   **Applied to the Couch:** Under a functional unity view, the couch existed as a single object when the units were fastened/flush and functioning as seating for multiple people together. When pulled apart, they ceased to function as that single unit and began functioning as three separate seating units, so the couch ceased to exist, and three chairs (or just three units functioning as chairs) came into existence. Under a contact view, the couch existed when the units were touching and ceased when they lost contact.
      *   **Pros:** More intuitive than Nihilism or Universalism. Matches many of our ordinary judgments.
      *   **Cons:** Defining the exact conditions (fastened? how much function? how much contact?) is notoriously difficult and can seem arbitrary. Does the couch *really* cease to exist if you slide one unit 1mm away? What if they are touching but not fastened?

  4.  **Conventionalism/Pragmatism:**
      *   **The View:** Whether we say there is one object (the couch) or three objects (the units/chairs) is *not* a deep fact about fundamental reality, but a matter of human convention, language, interest, and practical utility.
      *   **Applied to the Couch:** When the units are together, it's overwhelmingly *useful* and conventional to talk and think about "the couch" as a single object for purposes of sitting, moving, describing the room, etc. When pulled apart, it's overwhelmingly *useful* and conventional to talk and think about "three chairs" or "three seating units." Neither description is *truer* in a deep metaphysical sense; they are different ways of conceptualizing and describing the same underlying reality (the three units and their spatial arrangement) based on our needs and practices.
      *   **Pros:** Explains the flexibility of language and the lack of sharp boundaries. Avoids the ontological extravagance of Universalism and the radical denial of Nihilism. Focuses on how we *use* concepts.
      *   **Cons:** Can feel unsatisfying if you believe there's a fact of the matter about what objects exist. Doesn't resolve the underlying metaphysical puzzle, just sidesteps it by focusing on language/use.

  **Why It Feels Strange & What's Really Happening:**

  *   **The Puzzle of Coinciding Objects:** When the units are together, do *two* things occupy the same space? The three units? *And* the couch? If the couch is a distinct object, what happens to it when the units are pulled apart? Does it vanish? This is deeply weird.
  *   **Vagueness & Boundaries:** When exactly does "together" become "apart"? Is it 1mm? 1cm? This highlights the potential vagueness in the conditions for composition.
  *   **Function vs. Matter:** We tend to categorize objects based on their function. The *matter* (the three units) didn't change, but the *functional arrangement* did. Our language tracks the function, making it *feel* like the object itself changed.

  **Conclusion: Who's "Onto Something"?**

  *   **Your Roommate ("turned one into three"):** Captures the *functional* and *experiential* shift. From the perspective of *use* and *convention*, a single functional item (the couch) was replaced by three functional items (the chairs). This reflects a pragmatic or conventionalist view.
  *   **You ("only ever three units"):** Captures the underlying *material persistence*. The fundamental constituents didn't change, only their spatial arrangement. This leans towards nihilism or a focus on the parts.
  *   **The Core Insight:** **You are *both* highlighting valid aspects of the situation, and the dispute primarily reflects different ways of conceptualizing and describing the furniture based on context, function, and perhaps implicit metaphysical leanings.**

  **Is it *just* a dispute about description?** In a significant way, **yes**. The fundamental reality is the existence and arrangement of the three cushioned units. Whether we *describe* that arrangement as constituting "one couch" or "three chairs" depends on our interests, language conventions, and functional context. The feeling that a *thing* (the couch) genuinely came into and went out of existence arises because our language and thought patterns deeply reify these functional arrangements *as* distinct objects.

  **So, next time your roommate jokes:** You can confidently say, "Metaphysically, it's complicated! We changed the arrangement of three persistent units, which *conventionally* means we stopped having one functional object (a couch) and started having three functional objects (chairs). Pass the chips?" You've both stumbled onto a genuine and enduring philosophical puzzle!
