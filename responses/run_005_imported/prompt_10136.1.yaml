prompt: |-
  As a PhD student working on formal epistemology, I've been reading I. J. Good's 1967 result that a Bayesian agent who will go on to act optimally on whatever she learns can never be made worse off, in expected-utility terms, by cost-free evidence obtained before she acts. I'd like to genuinely stress-test the scope of this claim rather than simply cite it in my dissertation. Please construct a detailed, realistic scenario in which a fully rational agent is strictly worse off in expectation for having received some piece of free evidence before acting, without leaning on overused moves such as "the evidence wasn't really costless" or "she simply prefers not to know how the film ends." Then diagnose exactly which of Good's premises—for instance, that only a single decision-maker is involved, that the agent conditionalizes correctly on the evidence, or that utility attaches only to outcomes rather than to epistemic states—the example is implicitly exploiting, so that it becomes clear why the theorem itself survives the counterexample.
reasoning: |-
  We are going to construct a scenario that exploits the fact that Good's theorem assumes the agent's utility function depends only on the outcome (i.e., the state of the world and the action taken) and not on the agent's epistemic state. In particular, if the agent has a preference for avoiding difficult decisions or for maintaining certain beliefs, then free evidence might harm her in expectation because it affects her mental state.

   However, note that Good's theorem is about expected utility defined over outcomes, not over mental states. So to stress-test the theorem, we need to design a scenario where the agent's utility function does not just depend on the outcome but also on her beliefs. This is sometimes called "belief-dependent utility".

   Scenario: The Anxious Patient

   Dr. Jane is a patient who must decide whether to undergo a risky surgery. The surgery has a high chance of success if she has condition A (which is rare) but is very risky if she has condition B (which is common). Without the surgery, she will live with a manageable but chronic condition. She is currently asymptomatic and the test for condition A or B is free and perfectly accurate.

   States of the world:
     - State A: Jane has condition A (probability p_A, small)
     - State B: Jane has condition B (probability p_B = 1 - p_A, large)

   Actions:
     - Surgery (S)
     - No surgery (N)

   Outcomes and utilities (if utility only depended on outcome):
     - If she has A and does S: successful surgery, she is cured. Utility: 10
     - If she has A and does N: she lives with the chronic condition. Utility: 5
     - If she has B and does S: surgery leads to severe complications. Utility: 0
     - If she has B and does N: she lives with the chronic condition. Utility: 5

   However, Jane is an anxious person. She experiences disutility from knowing that she might have a serious condition, and also from the cognitive burden of making a difficult decision. Specifically, her total utility has two components:
     1. The outcome utility (as above).
     2. A psychological cost that depends on her posterior beliefs after receiving evidence.

   We model the psychological cost as follows:
     - After learning the result of the test (or not), she forms a belief about the state (A or B).
     - She experiences a cost proportional to the variance of her belief about her condition. Why variance? Because if she is certain (variance 0) she feels calm, but if she is uncertain (high variance) she feels anxious.

   Specifically, let her belief be represented by the probability q that she assigns to state A (so 1-q for state B). The variance of her belief (if we think of the state as a Bernoulli random variable) is q*(1-q). We assume she experiences a disutility of k * [q*(1-q)] where k is a positive constant.

   Moreover, she also experiences a fixed disutility of c (a positive constant) if she has to make a decision when her posterior belief is such that the expected utility of the two actions are very close (i.e., when she is in a difficult decision situation). We define "close" as when the absolute difference in expected outcome utilities is less than a threshold d.

   Without evidence, her prior belief is q0 = p_A.

   After receiving evidence (the test result), she will know the state for sure, so her posterior q will be either 0 or 1. Then the variance cost is 0. But without evidence, she has q0 = p_A, so the variance cost is k * p_A * (1-p_A).

   Additionally, without evidence, she must decide based on the prior. The expected utility of surgery is:
       EU(S) = p_A * 10 + (1-p_A) * 0 = 10 p_A
       EU(N) = 5

   She will choose surgery if 10 p_A > 5, i.e., p_A > 0.5. Otherwise, she chooses no surgery.

   But note: if p_A is not too high and not too low (say around 0.5), then without evidence she might be in a difficult decision situation? Specifically, if |10 p_A - 5| < d, then she experiences an extra cost c.

   Now, consider the case where p_A is just below 0.5, say p_A = 0.49. Then without evidence:
     EU(S) = 10 * 0.49 = 4.9
     EU(N) = 5

   So she chooses no surgery and gets outcome utility 5. The variance cost is k * 0.49 * 0.51 ≈ 0.25 k. Also, the difference in expected utilities is |4.9-5| = 0.1, which we assume is below the threshold d (say d=0.5). So she experiences an extra cost c. Thus, her total utility without evidence is:
     5 - 0.25k - c

   With evidence (taking the test): 
     - With probability p_A=0.49, the test says A. Then she knows she has A. Her variance cost is 0. She will choose surgery because she knows she has A (EU(S)=10, EU(N)=5). So she gets 10. Also, the decision is clear (|10-5|=5>d), so no extra cost c. Total utility in this case: 10.
     - With probability 0.51, the test says B. Then she knows she has B. Variance cost 0. She chooses no surgery (EU(S)=0, EU(N)=5). So she gets 5. The decision is clear (|0-5|=5>d), so no extra cost. Total utility: 5.

   Therefore, her expected utility with evidence is:
      0.49 * 10 + 0.51 * 5 = 4.9 + 2.55 = 7.45

   Now, without evidence, her expected utility is 5 - 0.25k - c.

   We want a scenario where she is worse off with evidence:
      7.45 < 5 - 0.25k - c   =>  0.25k + c > 2.45

   This is possible if k and c are sufficiently large. For example, if k=10 and c=1, then 0.25*10 + 1 = 2.5 + 1 = 3.5 > 2.45.

   So without evidence: 5 - 2.5 - 1 = 1.5
   With evidence: 7.45

   Then 1.5 < 7.45, so she is worse off without evidence? Wait, we want evidence to make her worse off. But here, without evidence she gets 1.5 and with evidence 7.45, so evidence is beneficial.

   We have the inequality backwards. We want:
     With evidence: 7.45
     Without evidence: 5 - 0.25k - c

   We want 7.45 < 5 - 0.25k - c   =>  0.25k + c > 2.45.

   But note: without evidence she gets 5 - 0.25k - c, and with evidence she gets 7.45. So if 5 - 0.25k - c > 7.45, then she is worse off with evidence? That would require:
     5 - 0.25k - c > 7.45   =>   -0.25k - c > 2.45   => which is impossible because k and c are positive.

   Let me re-check the desired inequality.

   We want the expected utility with evidence to be less than without evidence:

     EU(with evidence) < EU(without evidence)

     => 7.45 < 5 - 0.25k - c

     => 0.25k + c < 5 - 7.45 = -2.45   [which is impossible because k,c>0]

   So what went wrong? We set p_A=0.49 and without evidence she chooses N and gets 5, but then we subtract costs. With evidence she gets 7.45. So evidence is always better in this setup? 

   We need to adjust the scenario so that without evidence she avoids the difficult decision cost and the anxiety cost? Actually, without evidence she has the anxiety cost and possibly the difficult decision cost. But with evidence, she avoids both. So evidence is beneficial.

   We need a situation where without evidence she avoids a high anxiety cost? But without evidence she has the prior belief with variance, so she has the anxiety cost. With evidence, she has no anxiety cost. So evidence reduces anxiety.

   How can we make evidence harmful? We need a situation where without evidence she is not anxious and doesn't face a difficult decision, but with evidence she might end up in a state that causes anxiety? But with evidence she becomes certain (so no anxiety) but we have the difficult decision cost? Actually, in the evidence case, she becomes certain and the decision becomes trivial, so she avoids both costs.

   Alternate approach: without evidence, she doesn't face the decision at all? Or without evidence, she can take an action that avoids the decision? That doesn't fit.

   Let's change the scenario.

   New idea: The agent might have a preference for maintaining a particular belief (e.g., optimism). If she learns bad news, that directly causes disutility.

   Revised scenario:

   Jane is optimistic. She gets utility from believing she is healthy. Specifically, her utility has:
     - Outcome utility (as before)
     - Belief utility: she gets a bonus of b if she believes she does not have condition B (i.e., she believes she has A or is healthy). But note: in our states, she either has A or B. Without evidence, she believes she has B with probability p_B (which is high) and A with p_A. But if she has a high belief in B, then she doesn't get the bonus.

   We define the belief utility as a function of her posterior belief. Without evidence, her belief about having condition B is p_B. We assume she gets a bonus that is proportional to her belief that she does not have B, i.e., her belief in A. Specifically, bonus = b * (1 - p_B) = b * p_A? But that would be without evidence.

   Alternatively, let the bonus be b * (probability she assigns to not having B). But note: in the outcome, she does have either A or B. The bonus is about her belief at the time of decision.

   Without evidence:
     She assigns probability p_A to not having B (since having A is the same as not having B? Actually, condition A is a specific condition that is not B? Let's assume that condition A is a mild condition and condition B is severe. She wants to believe she doesn't have B.

     So without evidence, her belief that she doesn't have B is p_A. Therefore, she gets a bonus: b * p_A.

     Also, without evidence, she chooses the action with the highest expected outcome utility. We'll set the prior p_A such that without evidence she chooses no surgery (as before, if p_A<0.5). Then her outcome utility is 5. So total utility without evidence: 5 + b * p_A.

   With evidence:
     - With probability p_A: she learns she has A. Then she knows she doesn't have B. So she gets bonus b * 1 = b. Then she chooses surgery and gets outcome utility 10. Total: 10 + b.
     - With probability p_B: she learns she has B. Then she knows she has B, so bonus = b * 0 = 0. She chooses no surgery and gets 5. Total: 5.

     So expected utility with evidence: p_A*(10+b) + p_B*5 = p_A*(10+b) + (1-p_A)*5.

   Now, we want evidence to make her worse off in expectation:

     p_A*(10+b) + (1-p_A)*5 < 5 + b * p_A

     Simplify:

     Left side: 5 + p_A*(5 + b)   [because p_A*10 + 5 - 5 p_A + p_A b = 5 + p_A*(5+b) ? Let me compute:
          p_A*(10+b) + (1-p_A)*5 = 10p_A + b p_A + 5 - 5p_A = 5 + 5p_A + b p_A]

     Right side: 5 + b p_A

     So: 5 + 5p_A + b p_A < 5 + b p_A   => 5p_A < 0, which is impossible.

   So that doesn't work.

   Let me try a different belief-dependent utility. Suppose she gets a bonus only if she remains ignorant? That is, she prefers not to know. Specifically:

     Without evidence: she gets a bonus B for remaining in a state of ignorance.
     With evidence: she loses that bonus.

   And we assume that the bonus B is large.

   Then:

     Without evidence: 
          Outcome utility: 5 (if she chooses N, which she does when p_A<0.5) 
          Plus bonus B.
          Total: 5 + B

     With evidence: 
          Expected outcome utility: p_A * 10 + (1-p_A)*5 = 5 + 5p_A   [as before, 7.45 if p_A=0.49]
          But she loses the bonus, so total: 5 + 5p_A

     We want: 5 + 5p_A < 5 + B   => 5p_A < B.

     Since p_A=0.49, then 5*0.49=2.45 < B. So if B>2.45, then she is worse off with evidence.

   However, this is the "she simply prefers not to know" move, which the user asked to avoid.

   We need a scenario that does not rely on a direct preference for ignorance but still exploits belief-dependence.

   Another idea: the agent is a procrastinator. She gets a high utility if she can avoid making a decision now. Without evidence, she might be able to rationalize delaying the decision? But in our setting, she must act.

   Or: the agent cares about her future self. Suppose that after making the decision, she will live with the belief about her condition. If she never takes the test, she can maintain a hopeful belief.

   But note: without evidence, she has belief p_A about having A. After the decision, if she chooses no surgery, she will still have that belief. Then she might experience ongoing anxiety or hope.

   Let's model ongoing utility:

     Without evidence and choosing no surgery (which she does when p_A<0.5):
          Outcome: 5 (the chronic condition)
          Ongoing: she experiences a flow utility that depends on her belief. Let the ongoing utility per period be: u(belief) = h * (probability she assigns to not having B) = h * p_A.
          Suppose there are T periods. Total ongoing utility: T * h * p_A.

          So total utility without evidence: 5 + T * h * p_A.

     With evidence:
          - If she learns A: she has surgery, is cured. Outcome utility 10. And then she knows for sure she doesn't have B. So ongoing utility: T * h * 1 = T*h. Total: 10 + T*h.
          - If she learns B: she chooses no surgery. Outcome utility 5. Ongoing: she knows she has B, so ongoing utility: T * h * 0 = 0. Total: 5.

          Expected utility with evidence: p_A*(10 + T*h) + (1-p_A)*5.

     Now, compare without evidence: 5 + T * h * p_A
     With evidence: 5 + p_A*(5 + T*h)   [because p_A*10 + 5 - 5p_A + p_A*T*h = 5 + 5p_A + p_A*T*h]

     We want evidence to be worse:

          5 + 5p_A + p_A*T*h < 5 + T * h * p_A   => 5p_A < 0

     Again, impossible.

   How about if the ongoing utility depends on the state of the world, not the belief? Then it would be outcome-based and not belief-dependent. We need the ongoing utility to depend on the belief.

   What if the ongoing utility is higher when she is uncertain? For example, she enjoys hoping. Then:

     Without evidence: she has uncertainty. Let the ongoing utility be U_uncertain = u0 (a positive constant) per period.
     With evidence: she becomes certain. Then if she learns A, she is happy (but she was already hoping without evidence). If she learns B, she is unhappy.

     Specifically:
          Without evidence: outcome utility 5 plus ongoing utility T * u0.
          With evidence:
               - If A: 10 (outcome) + T * u_happy   [but note, she is certain now, so maybe u_happy > u0?]
               - If B: 5 (outcome) + T * u_unhappy, where u_unhappy < u0.

          We can set u0 > u_happy? That doesn't seem plausible.

     Alternatively, she specifically enjoys the state of hope (which is a mixture of good and bad). So:

          Without evidence: ongoing utility = T * h0, where h0 is the hope utility.
          With evidence:
               - If A: T * h_A   (h_A might be high, but she no longer hopes)
               - If B: T * h_B   (h_B is low)

          We need to define hope. Let hope be high when there is a chance of good news. Specifically, without evidence, she has hope. With evidence, she either has good news or bad news.

          Assume: h0 > (h_A + h_B)/2? But we want without evidence to be better on average.

          Specifically, we want:
            Without: 5 + T * h0
            With: p_A*(10 + T * h_A) + (1-p_A)*(5 + T * h_B) = 5 + 5p_A + T * [p_A h_A + (1-p_A) h_B]

          We want: 5 + T * h0 > 5 + 5p_A + T * [p_A h_A + (1-p_A) h_B]

          => T * h0 > 5p_A + T * [p_A h_A + (1-p_A) h_B]

          => h0 > (5p_A)/T + p_A h_A + (1-p_A) h_B

          This can be arranged by making T large so that the term (5p_A)/T becomes negligible, and if h0 is sufficiently greater than the weighted average of h_A and h_B.

          For example, let p_A=0.49, T=100, h0=10, h_A=5, h_B=0.

          Then without evidence: 5 + 100*10 = 1005
          With evidence: 5 + 5*0.49 + 100 * [0.49*5 + 0.51*0] = 5 + 2.45 + 100*(2.45) = 7.45 + 245 = 252.45

          1005 > 252.45, so she is worse off with evidence.

          This works.

   However, note that the ongoing utility is attached to her epistemic state, not directly to the outcome. And it is the hope that she enjoys, which is gone after the test.

   Which premise of Good's theorem does this violate?

   Good's theorem assumes that the utility function depends only on the state of the world and the action taken (the outcome). But in this scenario, the utility also depends on the agent's doxastic state (specifically, whether she is in a state of hope or certainty). This is the key.

   In the ongoing utility part, the utility in each period depends on her belief at that time. Without evidence, she maintains a hopeful belief indefinitely. With evidence, she replaces that belief with certainty, which might be good or bad, but on average it kills the hope she values.

   Therefore, the example exploits the premise that utility attaches only to outcomes (states and actions) and not to epistemic states.

   Conclusion:

   We have constructed a scenario in which the agent is strictly worse off in expectation for having received free evidence because she values the state of hope (an epistemic state) that the evidence destroys. The violation is of the outcome-based utility assumption.

   Good's theorem survives because it explicitly assumes that utility is a function only of the state of the world and the action taken. Once we expand the utility function to include epistemic states, the theorem's conclusion may not hold.
answer: |-
  ### Constructed Counterexample: The Hope-Dependent Utility Scenario

  **Background:**  
  Dr. Elise is a climate scientist deciding whether to advocate for an immediate, costly global policy to mitigate a potential climate catastrophe. There are two possible states of the world:  
  - **State H (High Risk):** Climate sensitivity is extremely high (probability \(p = 0.4\)).  
  - **State L (Low Risk):** Climate sensitivity is moderate (probability \(1 - p = 0.6\)).  

  Elise must choose between two actions:  
  - **Act (A):** Advocate for the policy. Costs \(C\) now but prevents catastrophe in State H.  
  - **Don't Act (D):** Avoid costs, but if State H occurs, catastrophe causes massive damage.  

  **Outcome Utilities (State-Dependent):**  
  - If State H and Act (A): Catastrophe averted. Utility = \(10 - C\) (where \(C = 3\), so net \(7\)).  
  - If State H and Don't Act (D): Catastrophe occurs. Utility = \(0\).  
  - If State L and Act (A): Unnecessary cost incurred. Utility = \(10 - C = 7\).  
  - If State L and Don't Act (D): No cost, no catastrophe. Utility = \(10\).  

  Elise is offered *cost-free, perfect evidence* revealing whether State H or L is true.  

  ### Twist: Belief-Dependent Utility  
  Elise derives "hope utility" from *believing* in a better future. Specifically:  
  - **Hope Utility:** If Elise assigns a probability \(q\) to State L (the desirable state), she gains utility \(k \cdot q \cdot (1 - q)\). This peaks when uncertainty is maximal (\(q = 0.5\)) and vanishes when certainty is reached (\(q = 0\) or \(q = 1\)).  
  - **Rationale:** Elise finds value in the psychological state of "hopeful uncertainty" (e.g., motivation to work toward solutions).  

  **Parameters:**  
  - \(k = 8\) (scaling factor for hope utility).  
  - Prior belief: \(P(\text{State L}) = 0.6\) → \(q = 0.6\).  

  ---

  ### Expected Utility Calculations  
  #### 1. **Without Evidence (Prior Belief Only):**  
  - **Hope Utility:** \(k \cdot q \cdot (1 - q) = 8 \cdot 0.6 \cdot 0.4 = 1.92\).  
  - **Decision Utility:**  
    - EU(A) = \(P(H) \cdot 7 + P(L) \cdot 7 = 0.4 \cdot 7 + 0.6 \cdot 7 = 7\).  
    - EU(D) = \(P(H) \cdot 0 + P(L) \cdot 10 = 0.4 \cdot 0 + 0.6 \cdot 10 = 6\).  
    - Elise chooses **Act (A)** for higher EU (7 > 6).  
  - **Total Expected Utility:** \(7 + 1.92 = 8.92\).  

  #### 2. **With Evidence:**  
  - **Case 1: Learns State H (Probability = 0.4)**  
    - Hope Utility: \(k \cdot 0 \cdot 1 = 0\) (certainty destroys hope).  
    - Chooses **Act (A)** (utility 7) to avert catastrophe.  
    - **Total Utility:** \(7 + 0 = 7\).  
  - **Case 2: Learns State L (Probability = 0.6)**  
    - Hope Utility: \(k \cdot 1 \cdot 0 = 0\) (no hope under certainty).  
    - Chooses **Don't Act (D)** (utility 10).  
    - **Total Utility:** \(10 + 0 = 10\).  
  - **Overall Expected Utility with Evidence:**  
    \(0.4 \cdot 7 + 0.6 \cdot 10 = 2.8 + 6 = 8.8\).  

  #### Comparison:  
  - **Without evidence:** EU = \(8.92\).  
  - **With evidence:** EU = \(8.80\).  
  - **Loss:** \(8.92 - 8.80 = 0.12\) → Elise is worse off in expectation by receiving evidence.  

  ---

  ### Diagnosis: Exploited Premise of Good’s Theorem  
  Good’s theorem relies on the premise that **utility depends solely on the outcome (state and action)**, not on the agent’s epistemic state. Here, the "hope utility" term \(k \cdot q \cdot (1 - q)\) violates this:  
  - **Epistemic Utility Dependence:** Utility is derived from Elise’s *belief* (quantified as uncertainty), not just the outcome.  
  - **Evidence Changes Belief States:** Cost-free evidence reduces uncertainty, destroying hope utility.  
  - **Net Effect:** Though evidence improves decision-making accuracy (raising outcome EU from 7 to 8.8), it eliminates hope utility (1.92 → 0), causing a net expected loss.  

  **Why Good’s Theorem Survives:**  
  The theorem holds *if utility is outcome-dependent only*. Here, the counterexample exploits a utility function that violates this core premise. Good’s result remains valid in standard Bayesian frameworks where utility is state-action based (e.g., medical decisions without belief-dependent psychology).  

  ### Key Insight for Formal Epistemology  
  This scenario illustrates that **Good’s theorem is brittle under belief-dependent utilities**. It highlights the distinction between:  
  1. **Pragmatic Value of Evidence:** Improving decisions (always non-negative under Good’s premises).  
  2. **Epistemic/Emotional Value of Belief States:** Which may be disrupted by evidence, creating trade-offs.  

  For your dissertation, this underscores the importance of explicitly stating utility-function assumptions when applying Good’s result to real-world agents (e.g., humans with cognitive biases). The theorem is robust *only* when utilities are outcome-centric—a critical boundary condition.
