prompt: |-
  hey, I'm drafting a diss chapter on Harlem Renaissance debates about art and propaganda and I keep getting hung up on a chunk of Du Bois's "Criteria of Negro Art" (the speech he gave in 1926, later printed in The Crisis). Here's the bit:

  "The apostle of Beauty thus becomes the apostle of Truth and Right not by choice but by inner and outer compulsion. Free he is but his freedom is ever bounded by Truth and Justice; and slavery only dogs him when he is denied the right to tell the Truth or recognize an ideal of Justice.

  Thus all art is propaganda and ever must be, despite the wailing of the purists. I stand in utter shamelessness and say that whatever art I have for writing has been used always for propaganda for gaining the right of black folk to love and enjoy. I do not care a damn for any art that is not used for propaganda. But I do care when propaganda is confined to one side while the other is stripped and silent.

  [...two paragraphs of illustrative examples skipped...]

  In such cases, it is not the positive propaganda of people who believe white blood divine, infallible, and holy to which I object. It is the denial of a similar right of propaganda to those who believe black blood human, lovable and inspired with new ideals for the world. White artists themselves suffer from this narrowing of their field. They cry for freedom in dealing with Negroes because they have so little freedom in dealing with whites."

  Everyone just quotes the "all art is propaganda" line like its self-explanatory, but reading closely there's obviously a more specific argument getting built across these paragraphs and I can't fully reconstruct its logic. Like, what's the "bounded freedom / slavery" bit doing right before the propaganda claim — is that an actual premise the propaganda claim depends on, or just rhetorical flourish? And is Du Bois's real objection that art is unavoidably propagandistic, full stop, or more that there's an unfair asymmetry in whose propaganda gets to pass as "real art" vs. get censored as biased? Those seem like two different claims to me and he kind of slides between them without flagging it. Can you help me untangle the actual argumentative structure connecting these bits?
