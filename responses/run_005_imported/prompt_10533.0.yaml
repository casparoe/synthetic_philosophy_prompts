  - Point 1 (Owen): 1 (Mostly right, but depends on credibility of commitment)
  - Point 2 (Mei): 2 (Valid criticism based on transparency)
  - Point 3 (Owen): 2 (Strong point about blackmailer's cost-minimizing incentives)
  - Point 4 (Mei): 2 (Valid point about non-transactional blackmailers)

