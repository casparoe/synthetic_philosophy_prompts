  Could you write me an essay on whether structural realism is actually a plausible position for a scientific realist to hold? I already know the general realism-vs-antirealism terrain so you don't need to re-explain that from scratch, but I want the structural realism literature itself properly weighed. Please keep the epistemic version (we only ever know the relational structure of unobservable reality, never the intrinsic nature of the relata) clearly separate from the ontic version (there's no non-structural "stuff" for the structure to be the structure of), explain what the Newman objection actually shows and whether a Ramsey-sentence formulation of ESR can dodge it, and take a real position on whether "no relations without relata" sinks OSR or just begs the question against it -- feel free to bring in the weak-discernibility stuff about identical particles if it actually bears on that last point. Don't hedge into "there are considerations on both sides" at the end -- I need an actual verdict on which version, if either, survives, defended rather than just listed.
