prompt: |-
  ok weird coincidence but this is genuinely happening to me right now. I'm in a philosophy of science seminar this term doing a Judea-Pearl-flavored unit on Simpson's paradox and confounding, and seperately I'm the student rep on my university's Teaching & Learning Committee. At Tuesday's meeting we ran into a decision that's exactly this problem, and when I pointed that out the chair just said "great, you write it up then," so now I actually have to produce a memo.

  Backstory: two years ago the school piloted "flipped" sections (recorded lectures + in-class problem sets) alongside traditional lecture sections, in two courses. End-of-pilot pass rates:

  Intro Psych (the easy gen-ed everyone takes):
  - traditional: 300 students, 270 passed
  - flipped: 60 students, 57 passed

  Intro Chem (the hard weeder course):
  - traditional: 60 students, 30 passed
  - flipped: 300 students, 165 passed

  Flipped beats traditional in both courses taken separately. But pool the two courses together and traditional comes out ahead overall (300 passes out of 360 vs 222 out of 360 for flipped). Half the committee wants to kill flipped sections off that pooled number alone, and a couple of them keep saying the accreditation report only cares about the campus-wide pass rate, not why it is what it is. Then one of the profs complicated things further by pointing out that basically all the flipped Chem sections happen to be taught by the two easiest graders in the department, while the hard graders all teach traditional Chem -- so even the within-Chem numbers might just be an instructor effect and not really about the format at all.

  I need to bring an actual memo to next week's meeting recommending what we do -- expand the pilot, kill it, or continue it with specific changes -- with a timeline attached. It has to actually explain why the pooled number is misleading without just hand-waving "correlation isn't causation," and it needs to take the accreditation people and the instructor-confound objection seriously instead of steamrolling them. Can you draft it?
reasoning: |-
  Okay, the user is in a Philosophy of Science seminar studying Simpson's Paradox and confounding variables, and they've been tasked with writing a memo about a real-life instance of this paradox at their university. The issue involves pass rates for traditional versus flipped classrooms in two courses—Intro Psych and Intro Chem—where flipped sections performed better individually but worse when pooled. The user needs to explain why the pooled data is misleading and address concerns about accreditation reports and instructor grading effects.

  First, I need to recall what Simpson's Paradox is. It's when a trend appears in different groups but disappears or reverses when the groups are combined. Here, the paradox arises because the courses have different pass rates and different distributions of students between the two teaching formats. Intro Psych has a high pass rate with mostly traditional sections, while Intro Chem has a lower pass rate with mostly flipped sections. When combined, the overall pass rate favors traditional because the larger traditional group in the high-pass-rate course (Psych) skews the results.

  The user's memo needs to clearly explain this without jargon. I should break down the numbers to show the reversal. For example, in Psych, flipped has a 95% pass rate vs. traditional's 90%. In Chem, flipped has 55% vs. traditional's 50%. But when pooled, traditional's total pass rate is 83.3% (300/360) while flipped is 61.7% (222/360). The key is the uneven distribution: most flipped students are in the harder course (Chem), dragging down their overall rate.

  Next, addressing accreditation concerns. The committee might prioritize the campus-wide pass rate for reports, but the memo should argue that decisions based on pooled data could lead to incorrect conclusions. Killing flipped sections based on the overall rate ignores their success in individual courses. Instead, the university should consider course-specific effectiveness and other factors like student engagement or long-term retention.

  The instructor confounding is another layer. In Chem, the flipped sections were taught by easier graders. This means the 55% pass rate for flipped Chem might be inflated by grading leniency, not the teaching format. The memo needs to acknowledge this and recommend controlling for instructor effects in future pilots. Maybe suggest random assignment of instructors to formats or comparing sections taught by the same instructor in both formats.

  The user's role as a student rep adds a practical angle. They need a memo that's persuasive to faculty and administrators, balancing statistical reasoning with actionable recommendations. The memo should recommend continuing the pilot with adjustments: expand to more courses, control for instructor variables, collect additional data like student feedback and longitudinal performance. Emphasizing the need for rigorous analysis before making permanent decisions is crucial.

  Also, the timeline should be realistic. Short-term: continue pilots with tweaks; medium-term: collect more data; long-term: evaluate for broader implementation. Highlighting that accreditation reports can still use disaggregated data to show improvements in specific courses might alleviate their concerns.

  I should ensure the memo is structured clearly: problem statement, data presentation, paradox explanation, confounding factors, recommendations, and timeline. Avoiding statistical jargon while making the paradox understandable is key. Using tables to present the data could help visualize the reversal. Concluding with actionable steps shows proactive solutions rather than just critiquing the pooled data.
answer: |-
  ## MEMORANDUM  
  **To:** Teaching & Learning Committee  
  **From:** [Your Name], Student Representative  
  **Date:** October 26, 2023  
  **Subject:** Evidence-Based Recommendation on Flipped Classroom Pilot Program  

  ### 1. Issue Summary  
  The committee must decide whether to expand, modify, or discontinue the flipped classroom pilot based on pass-rate data from Intro Psych and Intro Chem. While **flipped sections outperformed traditional sections in both courses individually**, pooled data misleadingly suggests traditional sections are superior overall (83.3% vs. 61.7% pass rate). This paradox, alongside concerns about instructor grading differences in Chem, requires careful analysis to avoid erroneous conclusions.  

  ---

  ### 2. Data Analysis: Why the Pooled Rate is Misleading  
  The reversal in pooled results is a textbook case of **Simpson’s Paradox**, caused by two key confounding factors:  

  **A. Course Difficulty & Enrollment Distribution:**  
  | Course          | Format     | Students | Passed | Pass Rate |  
  |-----------------|------------|----------|--------|-----------|  
  | **Intro Psych** | Traditional| 300      | 270    | 90%       |  
  |                 | Flipped    | 60       | 57     | **95%**   |  
  | **Intro Chem**  | Traditional| 60       | 30     | 50%       |  
  |                 | Flipped    | 300      | 165    | **55%**   |  
  | **Pooled**      | Traditional| 360      | 300    | **83.3%** |  
  |                 | Flipped    | 360      | 222    | 61.7%     |  

  - **Flipped sections had higher pass rates in both courses** (Psych: +5%, Chem: +5%).  
  - **The paradox arises because:**  
    - Most flipped students (300/360 = 83%) were in *Intro Chem* (lower pass rate).  
    - Most traditional students (300/360 = 83%) were in *Intro Psych* (higher pass rate).  
  - **Conclusion:** The pooled rate confounds *course difficulty* with *teaching format*. It reflects enrollment imbalance, not format effectiveness.  

  **B. Accreditation Reporting:**  
  While accreditation reports require campus-wide pass rates, **decisions about pedagogy should not rely solely on aggregated data**. Disaggregated results show flipped sections improved pass rates in *both* courses. Using pooled data to kill the pilot would discard a method that *increased success in the harder course* (Chem).  

  ---

  ### 3. Addressing the Instructor Confound in Chem  
  The point about differing instructor grading standards is valid and must be investigated:  
  - If flipped Chem’s 55% pass rate is primarily driven by lenient graders, the perceived benefit of the format may be illusory.  
  - **This does not invalidate the Simpson’s Paradox explanation** but adds a *second confounder* (instructor effect) requiring controlled study.  

  ---

  ### 4. Recommendations & Timeline  
  Based on evidence, **discontinuing the pilot would be premature**. Instead:  

  | Action Item                     | Timeline      | Responsible Party |  
  |---------------------------------|---------------|-------------------|  
  | **Continue pilot for 1–2 additional terms** with modifications: | Spring 2024   | Course Coordinators |  
  | - Assign instructors **randomly** to flipped/traditional Chem sections to control for grading bias. | | |  
  | - Expand pilot to **1–2 additional mid-difficulty courses** (e.g., Biology, Statistics). | | |  
  | **Collect richer data**: Student surveys, retention rates, and performance in downstream courses. | Spring 2024   | T&L Committee |  
  | **Analyze disaggregated pass rates + instructor effects** for accreditation reporting. | Summer 2024   | Institutional Research |  
  | **Final recommendation** to scale, modify, or sunset flipped sections. | Fall 2024     | T&L Committee |  

  ---

  ### 5. Why This Approach?  
  - **Avoids Type I Error:** Killing a potentially effective pedagogy based on flawed aggregation.  
  - **Addresses Confounders:** Controls for course difficulty (via disaggregation) and instructor effects (via randomization).  
  - **Meets Accreditation Needs:** Provides nuanced data for reports while improving pedagogy.  
  - **Evidence-Based:** Expands the pilot to generate actionable insights, not assumptions.  

  **Recommended Motion:** *Continue the flipped classroom pilot for Spring 2024 under revised conditions (random instructor assignment in Chem, expanded course selection) with a final decision in Fall 2024.*  

  ---  
  **Attachments:**  
  - Data table (Section 2)  
  - Proposed instructor randomization protocol for Chem  

  Let me know if you need slides, talking points, or a draft motion for the meeting. This memo balances statistical rigor with actionable governance—exactly what the committee needs.
