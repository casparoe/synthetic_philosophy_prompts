prompt: |-
  In my work on AI alignment, I've recently had to think hard about how, or whether, one can aggregate many different people's preferences into a single training objective for a model -- for instance, when combining many raters' feedback via reinforcement learning from human feedback (RLHF). Two results that colleagues keep invoking seem to be in real tension. Arrow's impossibility theorem is cited to argue that no reasonable rule for aggregating individual preference orderings into a social ordering can satisfy a small set of seemingly minimal fairness conditions without collapsing into dictatorship. Harsanyi's aggregation theorem, on the other hand, is cited as showing almost the opposite: if both individual and social preferences over lotteries satisfy the expected-utility axioms and a mild Pareto condition holds, the social preference is forced to take the form of a weighted sum of individual utilities -- apparently vindicating a kind of utilitarian aggregation. Could you explain why these two results don't actually contradict one another, focusing in particular on what work interpersonal comparability of utility is doing, or not doing, in each? I would also value your judgment on whether Harsanyi's theorem genuinely earns its utilitarian conclusion, or whether it covertly presupposes just the kind of interpersonal comparison that Arrow's framework, and Robbins-style skepticism about comparing utility across people, were meant to avoid.
reasoning: |-
  Okay, the user is deeply involved in AI alignment, specifically tackling how to aggregate human preferences into a training objective for models like in RLHF. They're wrestling with two seemingly conflicting theorems: Arrow's impossibility and Harsanyi's aggregation. The user wants to understand why these aren't contradictory and the role of interpersonal utility comparisons. They're also skeptical about whether Harsanyi's theorem truly supports utilitarianism without smuggling in interpersonal comparisons.

  First, I need to break down each theorem's assumptions. Arrow works with ordinal preferences—no intensities, just rankings. That's key. His conditions like IIA and non-dictatorship are about fairness in aggregation without comparing strengths of preferences. Arrow's framework avoids interpersonal utility comparisons entirely, which is why a dictator is the only way out. It's about the impossibility under strict ordinal constraints.

  Then there's Harsanyi. He uses cardinal utilities and expected utility theory. Each person has a vNM utility function, and social preferences are also vNM. The Pareto principle here is strong—if everyone prefers a lottery, society must too. This leads to a weighted sum of utilities. The weights here are crucial. Harsanyi doesn't assume interpersonal comparability; the weights are scaling factors. But in practice, for utilitarianism, equal weights are needed, which does imply comparability. So Harsanyi's theorem gives a mathematical form but doesn't resolve how to set those weights ethically.

  The user's deeper concern is about applying these to AI alignment. In RLHF, we have multiple raters. Arrow's theorem suggests that without cardinal data, aggregation is messy. Harsanyi's approach might work if we can get cardinal utilities (like magnitudes of preferences) from raters. But how? Techniques like magnitude estimation or trade-off questions might help, but they're not straightforward. Also, the Pareto principle in Harsanyi could force consensus, ignoring minority preferences if weights are low. The user might be worried about whose preferences get prioritized and how to set weights fairly without bias.

  They might also be questioning if Harsanyi's utilitarian conclusion is valid. The theorem provides the form, but the weights require normative input. So, in AI, who decides the weights? The engineers? Society? This ties into ethical choices that aren't resolved by the theorem itself. The user needs to recognize that while Harsanyi avoids interpersonal comparisons in the derivation, applying it forces those comparisons back in when assigning weights.

  So, the tension isn't a contradiction but different assumptions. Arrow is ordinal, Harsanyi is cardinal. The key is interpersonal comparability—absent in Arrow, implicit in Harsanyi's application. For AI alignment, understanding whether utilities are comparable and how to measure them is critical. The user's work must navigate these theoretical constraints and practical implementations, possibly developing methods to extract cardinal utilities or explicitly addressing weight assignment based on ethical principles.
answer: |-
  You've pinpointed a profound and persistent tension in welfare economics and social choice theory, directly relevant to AI alignment challenges like aggregating human feedback. Arrow's Impossibility Theorem and Harsanyi's Aggregation Theorem *appear* contradictory, but they operate under fundamentally different assumptions, with **interpersonal comparability of utility (IC)** being the key differentiator. Let's break it down:

  1.  **Arrow's Impossibility Theorem (The Ordinal, Non-Comparable World):**
      *   **Framework:** Individuals have *ordinal* preferences over *certain* outcomes (e.g., A > B > C). We only know their ranking, *not* the intensity of their preferences or how much happier A makes them compared to B.
      *   **Social Goal:** Find a social *ordering* (ranking) over outcomes based solely on these individual ordinal rankings.
      *   **Constraints (Fairness Conditions):**
          *   **Unrestricted Domain:** Any logically possible set of individual orderings is allowed.
          *   **Pareto Principle:** If everyone prefers A to B, society must prefer A to B.
          *   **Independence of Irrelevant Alternatives (IIA):** The social ranking between A and B should *only* depend on how individuals rank A and B. Changes in their rankings of other alternatives (e.g., C) shouldn't affect the A vs. B ranking.
          *   **Non-Dictatorship:** No single individual dictates the social ordering.
      *   **Result:** No aggregation rule satisfies all these conditions simultaneously. Any rule satisfying the first three *must* be dictatorial.
      *   **Role of IC:** Arrow **explicitly avoids and forbids IC.** The IIA condition is crucial here. It prevents us from using information about preference *intensities* or *trade-offs* between different individuals revealed by their rankings of *other* alternatives. We cannot say "Alice gains *much more* from A over B than Bob loses." Only the isolated A vs. B rankings matter. In this world of pure ordinality and strict non-comparability (à la Robbins), aggregation is impossible without dictatorship.

  2.  **Harsanyi's Aggregation Theorem (The Cardinal, Comparable-Unit World):**
      *   **Framework:** Individuals have preferences over *lotteries* (uncertain prospects) that satisfy the von Neumann-Morgenstern (vNM) axioms. This implies they have *cardinal* utility functions unique up to positive affine transformations (u_i and a*u_i + b represent the *same* preferences). Society also has vNM preferences.
      *   **Social Goal:** Find a social *cardinal* utility function representing social preferences over lotteries.
      *   **Constraints:**
          *   **vNM Rationality:** Individual and social preferences obey the expected utility axioms.
          *   **Pareto Indifference:** If everyone is indifferent between two lotteries, society must be indifferent.
          *   **Pareto Preference (Strong Pareto):** If at least one individual strictly prefers Lottery A to Lottery B, and no one prefers B to A, then society strictly prefers A to B.
      *   **Result:** The social utility function *must* be a **weighted sum** of the individual vNM utility functions: `U_social = w1*u1 + w2*u2 + ... + wn*un`, where `w_i > 0` are weights.
      *   **Role of IC:** Harsanyi's theorem **requires a specific, limited form of IC to give the utilitarian interpretation meaning.** Here's the nuance:
          *   **Formal Derivation:** Mathematically, the theorem holds *without* assuming full interpersonal comparability *of levels or differences*. The weights `w_i` are essentially *scaling factors* reflecting how much a unit change on each individual's unique vNM scale contributes to the social scale. The theorem doesn't tell us *how* to set these weights ethically.
          *   **Utilitarian Interpretation:** The theorem earns the *mathematical form* of utilitarianism. However, interpreting `U_social` as the *sum of individual well-being* implicitly requires assuming that the vNM utility functions `u_i` represent **comparable units of welfare** across individuals. If we can say "one unit on Alice's vNM scale represents the same *amount of welfare gain* as one unit on Bob's vNM scale," then setting `w_i = 1` for all `i` yields classical utilitarianism (sum of utilities). Harsanyi argued that the vNM framework, combined with ethical impartiality, provides a basis for this comparability of *utility differences*.
          *   **The Crucial Point:** While the *derivation* relies only on vNM rationality and Pareto, the **meaningful utilitarian conclusion** ("maximize the sum of individual utilities") **depends critically on interpreting the vNM utilities as interpersonally comparable measures of welfare.** Without this interpretation, `U_social` is just a mathematical representation of social preferences derived from individual vNM scales, not necessarily the "sum of happiness."

  **Resolving the Tension:**

  1.  **Different Domains:** Arrow deals with aggregating *ordinal rankings* over *certain outcomes*. Harsanyi deals with aggregating *cardinal utilities* representing preferences over *lotteries*.
  2.  **Different Informational Bases:** Arrow forbids any use of intensity information or comparability (enforced by IIA). Harsanyi *requires* cardinal utility information (intensity revealed by lottery preferences) and the resulting social function *implies* a form of comparability (via the common social scale and the weights) for the utilitarian interpretation.
  3.  **The Pareto Principles:** Both use Pareto, but Harsanyi uses a stronger version applicable to lotteries within the richer vNM framework.
  4.  **IC is the Key:** Arrow's impossibility arises precisely because he rules out IC. Harsanyi's possibility arises because the vNM framework provides a rigorous (though debated) basis for cardinal utility and a potential foundation for comparing utility *differences* across individuals. The tension dissolves once you see that Harsanyi operates in a world where more information (cardinality revealed by risk attitudes) and a specific type of comparability (of utility units implied by the additive form and ethical impartiality) are available and utilized.

  **Does Harsanyi Genuinely Earn the Utilitarian Conclusion?**

  This is the heart of the philosophical debate, highly relevant to AI alignment:

  *   **The Formalist View (Yes, it earns the form):** Harsanyi undeniably proves that under vNM rationality and Strong Pareto, social preference *must* be represented by a *linear aggregation* of individual vNM utilities. This is a powerful mathematical result vindicating a *structure* akin to utilitarianism.
  *   **The Substantive View (No, it smuggles in IC):** Critics argue the theorem only achieves the *utilitarian form* by **presupposing the comparability it purports to justify.** The argument:
      *   vNM utilities are only unique up to affine transformations (`a*u_i + b`). Alice's scale could be stretched or shifted arbitrarily relative to Bob's.
      *   The weights `w_i` in `U_social = sum(w_i * u_i)` absorb these arbitrary scales. Setting `w_i = 1` only makes sense as utilitarianism if we *first* assume that Alice's unit `u_A` and Bob's unit `u_B` represent the *same* amount of welfare gain. But the vNM axioms alone don't establish this.
      *   Harsanyi relies on an "impartial observer" thought experiment to argue for equal weights and comparability. Critics contend this imports ethical assumptions *external* to the positive vNM framework.
  *   **A Middle Ground:** Harsanyi provides the *most rigorous framework possible* for making interpersonal comparisons based on observable choice behavior (under risk). While not logically entailing full comparability from pure individual choice data alone, it provides a coherent and operationalizable basis for it, especially when combined with a principle of ethical impartiality. It bridges the gap between observable preferences and normative utilitarianism better than any alternative grounded in choice.

  **Implications for AI Alignment (RLHF):**

  1.  **Arrow's Warning:** If you only have ordinal preference data from raters (e.g., simple comparisons "A > B") and insist on IIA-like conditions (judgments based *only* on the current pair, ignoring context or intensities inferred from other comparisons), finding a fair, consistent, non-dictatorial aggregation rule is mathematically impossible.
  2.  **Harsanyi's Path (with Caveats):** To get a tractable aggregation (like a weighted sum), you need:
      *   **Cardinal Feedback:** Raters must provide information revealing *intensity* (e.g., magnitude of preference, willingness to trade off, preferences over lotteries involving outcomes). Techniques like magnitude estimation, best-worst scaling, or eliciting indifference probabilities move in this direction.
      *   **Confronting Comparability:** You *must* make a choice about how to scale and weight different raters' utilities:
          *   *Implicitly:* Assuming simple averaging (`w_i = 1/N`) presupposes equal scaling/comparability.
          *   *Explicitly:* Using features of raters (expertise, stakes, demographic weights) to set `w_i` is a normative choice about whose utility "counts more," directly engaging with IC.
          *   *Formally:* Estimating rater-specific scales using statistical models (e.g., from pairwise comparisons with varying difficulty) attempts to anchor utilities objectively, but still involves assumptions.
  3.  **The Core Challenge:** RLHF implementations often *functionally* assume cardinality and comparability (e.g., reward model = average of rater preferences). Harsanyi provides a rigorous *justification* for this functional form *if* you accept vNM rationality and Strong Pareto. However, Arrow reminds us that this approach *necessarily abandons* the strict ordinal non-comparability framework and its associated fairness guarantees (like IIA). The ethical weight-setting (`w_i`) remains a critical, non-technical decision.

  **Conclusion:** Arrow and Harsanyi don't contradict; they illuminate different worlds. Arrow proves the impossibility of fair aggregation in a world restricted to ordinal preferences and devoid of interpersonal comparisons. Harsanyi shows that by introducing cardinal utility (via preferences under risk) and accepting the Strong Pareto principle, aggregation *must* take a linear utilitarian form. However, interpreting this sum as the "sum of welfare" *does* require assuming that the units of the individual vNM utility functions are interpersonally comparable – an assumption rejected by the strict ordinalist framework underlying Arrow's theorem. For AI alignment, this means achieving a practical, consistent aggregation rule like a weighted sum requires moving beyond pure ordinal comparisons and grappling directly with the measurement of preference intensity and the normative choices involved in weighting different individuals' utilities. Harsanyi provides a powerful framework for this, but it doesn't magically resolve the deep philosophical questions about interpersonal comparison; it provides a structure within which to address them rigorously.
