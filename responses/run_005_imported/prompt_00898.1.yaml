  In summary, the answer is no perfect system, but practical adjustments can reduce gaming and restore the fun. Highlighting simplicity and acceptance of imperfection might address their unspoken need for a stress-free, friendly process.
answer: |-
  That's an **excellent** and surprisingly deep question! You've stumbled into the fascinating (and sometimes frustrating) world of **social choice theory**, which studies how individual preferences are aggregated into group decisions. The short, slightly brutal answer is:

  **No, there is no perfect scoring system that completely eliminates the incentive for strategic voting ("gaming") while satisfying other basic fairness criteria.** This is a fundamental mathematical impossibility.

  Here's why, and what you *can* do:

  ### The Core Problem: Impossibility Theorems

  1.  **Arrow's Impossibility Theorem:** Kenneth Arrow proved that no ranked-choice voting system (where voters submit a complete ordering of preferences) can simultaneously satisfy all of these seemingly reasonable criteria:
      *   **Unanimity:** If everyone prefers A over B, then A should beat B.
      *   **Non-dictatorship:** No single voter should always dictate the winner.
      *   **Independence of Irrelevant Alternatives (IIA):** The relative ranking of two options (A vs. B) should only depend on voters' preferences between A and B, not on their preferences for some third option C.
      *   **Transitivity:** If the group prefers A to B and B to C, it must prefer A to C.
      **Your experience:** IIA is often the casualty. When you rank your true #2 as #1, you're introducing a "third option" (your true #1) that changes the outcome between your #2 and the "bad" winner. Systems violate IIA to be more responsive, creating strategic openings.

  2.  **Gibbard-Satterthwaite Theorem:** This is even more directly relevant to your problem. It states that for any voting system with more than two possible outcomes:
      *   It's impossible for the system to be **both**:
          *   **Strategy-proof:** There's never an incentive for a voter to misrepresent their true preferences.
          *   **Non-dictatorial.**
      *   It also must be **Pareto efficient:** If everyone prefers A over B, B shouldn't win.
      **Your experience:** This theorem *directly* explains why you and your friends find it advantageous to lie. In any non-dictatorial system with 3+ options, someone, sometime, *will* benefit from strategic voting.

  ### Why Different Systems Fail Differently

  *   **Straight Points (Borda Count):** Highly susceptible to "burying" (ranking a strong rival last) and "compromising" (boosting a weaker rival over a strong one, like you did). Also violates IIA dramatically.
  *   **Weighted First-Choice (Plurality/FPTP):** Susceptible to "vote-splitting" (similar candidates cannibalize each other's votes) and the "spoiler effect." Encourages insincere "lesser evil" voting. You bury rivals by *not* ranking them first.
  *   **Instant-Runoff Voting (IRV):** More resistant to compromising than Borda, but still susceptible to "burying" (ranking a strong rival last). Also vulnerable to non-monotonicity (sometimes ranking a candidate higher can cause them to lose, or ranking them lower can cause them to win!). Violates IIA.

  **The gaming resurfaces because the fundamental incentives created by the impossibility theorems exist in *any* system where people have diverse preferences and care about the outcome.**

  ### What *Can* You Do? (Managing, Not Eliminating, the Problem)

  While you can't eliminate the *potential* for strategy, you can reduce its *effectiveness* and *incentive*:

  1.  **Approval Voting:**
      *   **How it works:** Voters vote for *all* restaurants they find acceptable. The restaurant with the most approval votes wins.
      *   **Why it helps:**
          *   **Reduced Strategic Incentive:** It's often optimal to vote sincerely (approve all restaurants you truly like). There's usually little benefit to *not* approving a restaurant you genuinely like, or approving one you dislike.
          *   **Simplicity:** Very easy to understand and count.
          *   **Encourages Consensus:** Tends to select options broadly acceptable to the most people, rather than polarizing favorites.
          *   **Harder to Hurt Favorites:** You can't harm a restaurant you like by ranking it lower; you just choose whether to approve it or not.
      *   **Potential Downsides:** Might select a "least objectionable" option rather than a passionate favorite. Requires defining "acceptable."

  2.  **Random Ballot:**
      *   **How it works:** Everyone votes for their single, honest favorite. One ballot is picked at random, and that voter's choice wins.
      *   **Why it helps:**
          *   **No Point in Strategic Voting:** Since only one ballot counts, and you don't know which one, there's absolutely no benefit to voting dishonestly. Your best strategy is always to vote for your true favorite.
          *   **Simplicity:** Extremely simple.
      *   **Potential Downsides:** Can feel arbitrary/unfair if a niche preference wins. Doesn't directly aggregate preferences, just gives everyone an equal *chance* to dictate the outcome. Might not pick a consensus choice.

  3.  **Focus on the Process, Not Perfection:**
      *   **Acknowledge the Problem:** Talk about it! Say, "Hey, we all know these systems can be gamed, let's try to vote honestly anyway for a more fun/fair result." Transparency reduces the feeling of being "suckered."
      *   **Lower the Stakes:** Make restaurant choice less critical. Rotate who picks, use a random shortlist, or have a "veto" rule instead of full ranking. The more people care intensely, the stronger the incentive to game.
      *   **Pre-Commit to Criteria:** Agree *before* listing options on key factors (e.g., "Tonight needs to be near the subway," "Budget under $20"). Filter options *before* voting to reduce conflict.
      *   **Delegate or Rotate:** Assign a "restaurant coordinator" for the week/month who picks based on general vibes, or rotate who gets the final say.
      *   **Accept Good Enough:** Recognize that no system is perfect. Aim for "broadly acceptable most of the time" rather than "everyone's optimal choice."

  ### Recommendation for Your Group

  1.  **Try Approval Voting:** It's simple, reduces the *effectiveness* of common strategies, encourages sincerity, and often yields a good consensus choice. It directly addresses the "burying" and "compromising" you've observed. Vote for every place you'd genuinely be happy going to.
  2.  **Combine with Lowered Stakes/Rotation:** Use Approval Voting, but also rotate who suggests the initial list or who has a tie-breaker. Remind everyone the goal is a fun night out, not "winning" the vote.
  3.  **Have a Meta-Conversation:** Explain *why* you're changing the system (e.g., "We read about Approval Voting being harder to game, let's try it for a month and see if it feels better").

  **Conclusion:** You're absolutely right to notice the pattern. It's not your group being weird; it's math revealing an inherent tension in group decision-making. **You cannot engineer your way out of this completely.** However, by choosing a system like Approval Voting that minimizes strategic incentives, lowering the perceived stakes, and fostering a spirit of cooperation over competition, you can significantly reduce the problem and make the process feel fairer and less frustrating. Focus on the shared experience, not just the "perfect" outcome.
