  First, I need to confirm that no perfect system exists. Arrow's Theorem and Gibbard-Satterthwaite are key here. They show that no system can be both perfectly fair and strategy-proof. The user might be hoping for a magical solution, but it's important to gently explain the impossibility while offering practical alternatives.

  The user's frustration is clear—they want honesty and fairness but see others exploiting the system. Their deeper need might be maintaining group harmony without resentment. They might also feel that the current methods are making the process stressful rather than fun.

  Looking at their attempts: straight points (Borda) is easily gamed by ranking rivals lower. Weighted first-choice (like FPTP) leads to burying strong opponents. Instant-runoff (IRV) can cause insincere rankings too. Each system's flaws resurface because of inherent theoretical limits.

  So, what can help? Approval voting is simpler—vote for all acceptable options. It reduces incentive to lie because you don't rank, just approve. This might align better with their casual context. Random ballot adds unpredictability, making gaming pointless. Both methods are straightforward and might fit their social dynamic better than complex systems.

