answer: |-
  Based on Hobbes's core epistemological and metaphysical commitments, I argue his response would be **defensive and ultimately dismissive** of the physical reality of non-Euclidean geometry, while potentially accepting its formal validity *as a mental construct*. He would see Einstein's curved space as a catastrophic error conflating the demonstrative (geometry) with the conjectural (physics), fatally undermining his foundational distinction. Here's the specific reconstruction and defense:

  1.  **Non-Euclidean Geometry *as Construction*: Congenial Nominalism**
      *   Hobbes would readily accept hyperbolic or elliptic geometry as rigorous, demonstrable systems *within their own defined terms*. This perfectly aligns with his "maker's knowledge" doctrine. If mathematicians consistently define points, lines, surfaces, and motions differently from Euclid and then demonstrate consequences from those definitions without contradiction, they have created a valid demonstrative science. The certainty arises *solely* from the act of construction and deduction from stipulated definitions, not from correspondence to an external reality. As author of the definitions and constructions within this alternative system, its proponents possess demonstrable knowledge *of that system*.
      *   **Defense:** This directly mirrors his argument against Wallis. Wallis's corrections based on established (Euclidean) methods were irrelevant to Hobbes *because* Hobbes believed he was constructing his own definitions and demonstrations. Similarly, the validity of non-Euclidean geometry depends only on its internal consistency, not on its conformity to Euclid or sensory experience. Hobbes's nominalism ("truth is in speech, not in things") readily accommodates multiple consistent linguistic/conceptual systems describing different possible "spaces."

  2.  **Non-Euclidean Geometry *as Physics*: Catastrophic Category Error**
      *   Hobbes would **vehemently reject** the application of non-Euclidean geometry to describe *actual physical space*. This rejection stems from his fundamental metaphysical identity: **geometrical extension *is* the extension of real bodies.** Space, for Hobbes, is "the phantasm of a thing existing without the mind merely" – it's the *imagined* framework we use to conceive of bodies and their motions. Crucially, this phantasm is *generated by* our experience of real bodies moving. The properties we demonstrate in geometry (like Euclid's parallels) are derived from the fundamental properties of *bodies in motion* as we conceive them.
      *   **Therefore, the geometry that is demonstrable (Euclidean) *must* be the geometry that describes the real, extended world.** The idea that physical space could have a different geometry (like being curved) would be nonsensical to Hobbes. It severs the essential link between the constructed object of geometry and the real object of physics. If the geometry we demonstrably construct (based on the concept of body and motion) doesn't describe the physical world, then:
          *   Physics loses its borrowed certainty from geometry.
          *   Geometry loses its foundation in the real properties of body.
          *   The entire Hobbesian edifice, built on the identity of geometrical and physical extension, collapses.
      *   **Defense:** Hobbes explicitly argues that we reason *from* the generation of figures *to* their properties. The generation *is* the motion of bodies. Riemann's abstract manifold or Einstein's curvature dependent on mass/energy isn't "generated" by Hobbesian bodily motion in a way that yields demonstrable knowledge. It's an *inference* about hidden causes – precisely the kind of conjecture Hobbes confined to natural philosophy. Applying a non-Euclidean metric to physics doesn't make it demonstrative; it just makes the conjecture more mathematically sophisticated. Hobbes would see this as Wallis-like error on a grand scale: mistaking a complex mathematical model (a human construction) for demonstrative knowledge of the physical world's essential structure.

  3.  **Resolving the Tension: Reaffirming Euclidean Primacy**
      *   The apparent tension between his constructivism and his insistence on a single subject matter is resolved by Hobbes **prioritizing the foundational role of Euclidean construction based on bodily motion.** Alternative geometries are valid *games of symbols* or *explorations of possibility*, but they are *not* descriptions of the fundamental reality of extension. They are constructions *derived from* or *analogous to* the primary construction grounded in the concept of body in motion.
      *   Einstein's theory would be the ultimate affront: it uses a non-primary construction (Riemannian geometry) to *redefine* the nature of the physical subject matter (space itself). For Hobbes, this puts the cart before the horse. Physical space *is* what it is because of the nature of body; we don't get to *discover* via physics that body exists in a fundamentally different kind of extension than the one we construct geometrically from the concept of body itself. He would argue that any empirical results seeming to support curved space (e.g., light bending) must be explained *within* a Euclidean framework of bodies moving and interacting according to mechanical causes – however complex and conjectural that explanation might be. The geometry itself remains fixed and Euclidean because it *defines* the framework of extension within which all physical events occur.

  **Specific Hobbesian Response Reconstructed:**

  "These new calculi of the Geometricians, these *Non-Euclideana*, are ingenious fictions, demonstrations built upon definitions of their own making, and so far as they hold together without contradiction, they are True within their own declared bounds. They are the lawful issue of Reason operating upon its own Conceptions. But when the Professors of Physicks, misled by these elegant fantasies, proclaim that the very *Space* wherein we and all Bodies move and have their Being is *curved* or *hyperbolic*, they commit a profound Error. For Space is not a Thing existing of itself, but the Phantasm arising from the Extension of Body itself. The properties of Space, and therefore of Geometry, are deduced from the Generation of figures by Motion, which is the Motion of Bodies. The parallel Postulate, like the rest of Euclid's doctrine, is not an arbitrary Rule but a necessary Consequence of conceiving Body and its Motion truly. To say Space is curved is to say Bodies move in a manner *contrary* to the very Generation from which our demonstrable Science of their extension arises. This is Absurdity. The Geometer may play with his definitions as he pleases, but the Philosopher of Nature must remember that the only Extension he can reason upon demonstrably is that which is identical to the real Extension of the World, and that Extension is, and must ever be, Euclidean. These moderns, like Wallis before them, mistake their own subtle Constructions for the Fabric of the Universe itself, confounding the Certainty of Geometry with the mere Conjectures of Physicks."

  **In essence:** Hobbes would embrace non-Euclidean geometry as a valid formal exercise proving his point about maker's knowledge, but he would see its physical application as a fundamental metaphysical and epistemological error, destroying the core identity between geometrical and physical extension that underpinned his entire philosophy. He would dismiss curved space as a category mistake, reaffirming Euclidean geometry as the *only* true description of real extension, grounded in the concept of body in motion. Einstein's theory wouldn't challenge Hobbes; it would, in his view, confirm the dangers of letting natural philosophers mistake their conjectures for geometrical demonstration.
