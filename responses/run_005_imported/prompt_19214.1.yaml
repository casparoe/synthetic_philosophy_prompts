  The unfalsifiability concern is valid. But virtue ethics can be tested. For instance, longitudinal studies on trait stability, like the Nun Study, show traits predicting behavior over time. Also, behavioral consistency across similar situations supports the existence of traits. The Big Five in psychology offers empirical backing for traits, contradicting the situationist claim.

