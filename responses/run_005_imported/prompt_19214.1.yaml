answer: |-
  Your question cuts to the heart of a major debate in contemporary ethics and moral psychology. Let's break down the key issues:

  **1. The Situationist Critique: Valid but Overstated?**
     - **The Core Challenge:** Doris/Harman are correct that the studies you cite (and others like Asch conformity) demonstrate the *power* of situational factors and the *fragility* of many people's moral behavior under specific pressures. They effectively debunk an overly simplistic, "global trait" view of character (e.g., that simply labeling someone "honest" predicts their behavior in *all* honesty-relevant situations).
     - **Critiques of the Evidence:**
       - **Methodological Flaws:** The SPE and Milgram experiments faced significant ethical and methodological criticisms (demand characteristics, experimenter pressure, artificiality, lack of ecological validity). The SPE, in particular, is now widely seen as deeply flawed and unreplicable under ethical standards.
       - **Replication Crisis:** Core findings in social psychology (including aspects of situationism) have faced replication challenges, suggesting the effects might be less universal or powerful than initially claimed.
       - **Selective Interpretation:** Situationists often focus on studies showing failure, neglecting research demonstrating cross-situational consistency (e.g., honesty in children over time, longitudinal studies of prosocial behavior, the stability of personality traits like the Big Five). Doris himself later moderated his position, acknowledging "local traits" (e.g., honesty-in-negotiation might be stable, even if honesty-in-finding-lost-wallets isn't).
       - **The "Basically Don't Exist" Claim is Too Strong:** Decades of personality psychology (e.g., the Big Five: Conscientiousness, Agreeableness) provide robust evidence for *temporally stable* and *moderately cross-situationally consistent* traits. These traits demonstrably predict behavior *on average, across many situations*. The situationist point is that this consistency isn't perfect or as strong as folk psychology suggests, not that it's entirely absent.

  **2. Virtue Ethics' Defense: Beyond Naive Trait Theory**
     - **Phronesis Isn't a "Get Out of Jail Free" Card (When Properly Understood):** Your friend is pointing to a crucial, often misunderstood aspect of virtue ethics. Virtue isn't robotic rule-following or invariant behavior. It's *excellence in practical reasoning and perception*.
       - **Context-Sensitivity is the Point:** Aristotle *expects* the virtuous person to act differently in different situations. Courage on the battlefield looks different from courage in a boardroom. Honesty with a friend in distress differs from honesty when answering a hostile interrogator. The virtuous person perceives the *morally relevant features* of each situation accurately.
       *   **Predictability vs. Flexibility:** Virtue ethics predicts *reliable excellence in responding appropriately*, not identical behavior. Seeing a seminarian rush past someone in need *could* be consistent with virtue *if* they correctly perceived a more pressing moral duty (e.g., rushing to prevent greater harm). The problem in the Darley-Batson study is arguably a *failure* of phronesis – misjudging the relative importance of punctuality vs. immediate aid. Virtue ethics *would* predict that someone with genuine compassion *and* practical wisdom would stop *unless* there was a truly overriding reason not to.
       *   **Falsifiability:** Virtue ethics *is* falsifiable in principle. It would be falsified if:
           *   No one ever demonstrated significant cross-situational consistency *within relevantly similar moral domains* over time.
           *   "Practical wisdom" never correlated with demonstrably better moral outcomes across diverse situations.
           *   The cultivation of specific dispositions (e.g., through habituation, reflection, mentorship) never led to more reliably excellent responses. Longitudinal studies tracking character development and moral behavior are relevant here (e.g., the Nun Study showing early positive emotional content predicting longevity).

  **3. The "Intellectually Honest Conclusion": Neither Folk Psychology Nor Dead**
     *   **Virtue Ethics is Not Naive Folk Psychology:** Aristotelian virtue ethics is a sophisticated philosophical framework, not just common sense. It explicitly acknowledges the difficulty of virtue, the role of habituation, the importance of community and upbringing, and the constant need for practical judgment. It anticipated the complexity situationists highlight.
     *   **Surviving Contact with Data (Revised):** Situationism delivered a necessary corrective to an overly simplistic view of character. However, it didn't deliver a knockout blow:
         *   **Empirical Reality:** Traits exist and predict behavior, albeit imperfectly and moderated by situations. The interaction between person and situation is key.
         *   **Virtue Ethics' Resilience:** The theory adapted. Modern virtue ethicists (e.g., Nancy Snow, Julia Annas, Daniel Russell) engage deeply with empirical psychology. They argue:
             *   Virtues are "robust" but not "global" traits – stable dispositions *within domains* shaped by practical wisdom.
             *   Phronesis involves *sensitivity* to situational factors, not blindness to them.
             *   Cultivating virtue *increases* resilience against negative situational pressures (this is empirically testable and some evidence supports it).
             *   Situationism shows *how hard* virtue is, not that it's impossible or non-existent. It highlights what virtue must *overcome*.
     *   **Psychologically Realistic?** It depends on the alternative:
         *   Compared to simplistic rule-based deontology or purely consequentialist calculation ignoring character? Virtue ethics, with its focus on the agent's psychology, perception, and development, is arguably *more* psychologically realistic.
         *   It readily incorporates findings about cognitive biases, situational pressures, and the role of emotion (eudaimonia involves emotional alignment). Contemporary accounts integrate situationist insights by emphasizing the need to structure environments to support virtue and train situational awareness.

  **Conclusion:**

  The intellectually honest conclusion is **more nuanced than declaring virtue ethics dead or vindicated outright.**

  1.  **Situationism Won a Major Battle:** It definitively proved that early 20th-century notions of monolithic, global character traits predicting behavior flawlessly across all situations are empirically unsustainable. Moral behavior *is* highly susceptible to situational pressures.
  2.  **It Didn't Win the War Against Virtue Ethics:**
      *   Virtue ethics never relied on the simplistic "global trait" model situationists attacked.
      *   The core concepts of character, habituation, practical wisdom (phronesis), and flourishing (eudaimonia) remain powerful explanatory tools.
      *   Modern virtue ethics actively incorporates situationist findings, viewing character as *dynamic*, *situated*, and requiring constant cultivation *against* corrosive pressures.
      *   Empirical evidence for trait stability and consistency, while imperfect, contradicts the "basically don't exist" claim.
  3.  **Virtue Ethics Remains a Live Option:** For those seeking an ethical theory that:
      *   Focuses on the whole person and their development.
      *   Explains the importance of perception, emotion, and judgment in moral life.
      *   Provides a rich account of moral education and the good life.
      *   Can integrate empirical findings about human psychology (including our vulnerabilities) without reducing morality to mere situationist puppetry.

  The situationist critique forced virtue ethics to mature and engage more deeply with empirical reality. It didn't destroy the house; it required a significant and beneficial renovation. The load-bearing wall of *phronesis* – the capacity for context-sensitive moral perception and judgment – remains central and arguably gains strength when understood as the faculty needed to navigate the very situational complexities the experiments reveal. Whether this makes the theory "too convenient" depends on whether this sophisticated conception of phronesis can be empirically investigated and shown to be a real, cultivatable psychological capacity that leads to demonstrably better moral outcomes – a challenge modern virtue ethicists and moral psychologists are actively pursuing.
