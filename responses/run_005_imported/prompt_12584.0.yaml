answer: |-
  Here’s the strongest case for why Samuelson’s critique fails to undermine the objective rationality of growth-rate maximization (via expected log wealth) in repeated multiplicative bets, grounded in the ergodicity economics framework:

  ### Core Argument: **Ergodicity Resolves the "Which Average?" Problem Objectively**
  Samuelson assumes that choosing to maximize expected log wealth is equivalent to *imposing* a logarithmic utility function. The ergodicity view shows this is backwards: in multiplicative processes, the **time-average growth rate** (the observable outcome for a single trajectory) is mathematically distinct from the ensemble average. Maximizing log wealth isn’t a utility choice—it’s the *only* way to maximize what a single agent actually experiences.

  ### Key Points Refuting Samuelson:
  1. **The Non-Ergodicity of Multiplicative Dynamics**:
     - Wealth evolves multiplicatively: \(W_t = W_0 \prod_{i=1}^t (1 + r_i)\). The ensemble average (expected value) grows as the *arithmetic mean* of returns. The time-average growth rate (for a single agent) grows as the *geometric mean*.
     - By Jensen’s inequality, \(E[G] \leq G[E]\) for multiplicative processes. The ensemble average *overestimates* actual growth for any finite trajectory. Samuelson’s "expected utility" optimizes the ensemble average—a quantity irrelevant to a non-immortal agent.

  2. **Samuelson’s Fallacy: Conflating Parallel Worlds with a Single Path**:
     - Samuelson argues that Kelly/Thorp/Peters maximizes a utility function (log) over a *hypothetical ensemble* of parallel universes. But a single agent doesn’t experience the ensemble—they live one path. The ergodicity framework *starts* from the single-path observable (time-average growth rate \(\lim_{T \to \infty} \frac{1}{T} \ln \frac{W_T}{W_0}\)) and shows it’s maximized *only* by optimizing \(E[\ln(1+r)]\).
     - This isn’t utility smuggling—it’s mapping the optimization target (growth) to the mathematical quantity describing it.

  3. **Finite Horizons Don’t Rescue Expected Utility**:
     - Samuelson claims Kelly is only optimal "at infinity." But for *any* finite horizon \(T\), the median outcome (the most likely path) is dominated by maximizing geometric mean growth. The probability of outperforming the Kelly strategy vanishes as \(T\) grows (Breiman, 1961).
     - Expected utility (e.g., linear utility) can lead to ruin with probability →1 over time. No rational agent would accept a strategy with near-certain bankruptcy, regardless of horizon.

  4. **Risk of Ruin is a Physical Constraint, Not a Utility Choice**:
     - Strategies overbetting Kelly increase the probability of ruin. Ruin isn’t a "low utility" outcome—it’s game over. Ergodicity economics frames this as an *absorption barrier*: once \(W_t = 0\), growth stops permanently. Avoiding ruin isn’t about risk aversion; it’s about maintaining the ability to keep playing. Only Kelly maximizes growth while guaranteeing no ruin (if \(f^* < 1\)).

  5. **The Observability Criterion**:
     - A rational strategy must optimize an *observable* quantity. The ensemble average \(E[W_T]\) is not observable by a single agent. The time-average growth rate \(\frac{1}{T} \ln \frac{W_T}{W_0}\) *is* observable. Kelly optimizes the observable; expected utility optimizes a fiction.

  ### Countering the "Log Utility Smuggling" Claim:
  - **Utility functions** map wealth to subjective value. **Growth rates** map strategies to objective outcomes.  
  - If an agent’s utility is \(U(W)\), maximizing \(E[U(W)]\) is valid *if* the ensemble average describes their experience. But for multiplicative bets, it doesn’t. The "log" in \(\max E[\ln W]\) arises from the *dynamics* (multiplicative => geometric mean), not preferences.  
  - As Peters puts it: *"We don’t maximize log because we like it; we maximize log because it’s the thing that doesn’t vanish."*

  ### Why Samuelson’s Objection Fails:
  Samuelson is correct that expected utility theory *allows* other strategies—but that’s the flaw. Expected utility is *too flexible*: it can justify any strategy by cherry-picking utility functions (e.g., linear utility justifying overbetting to ruin). Ergodicity economics reveals this as a misuse of averages. In multiplicative processes, **growth-rate maximization is uniquely privileged by the mathematics of the system**, not subjective preference.

  ### Conclusion:
  For any agent facing repeated multiplicative bets (trading, investing, etc.), maximizing expected log wealth is objectively rational because:  
  1. It maximizes the *only observable long-term growth metric* for a single trajectory;  
  2. It avoids ruin with certainty;  
  3. Alternatives (e.g., maximizing \(E[W]\)) optimize a statistical mirage (ensemble average) that doesn’t reflect lived experience.  

  Samuelson’s critique holds only if you ignore the non-ergodicity of wealth dynamics. Once you recognize that a single agent’s path is governed by the geometric mean, Kelly isn’t one strategy among many—it’s the *only* strategy that aligns optimization with reality. The "log" isn’t smuggled in; it’s the key to the prison of ensemble averages.
