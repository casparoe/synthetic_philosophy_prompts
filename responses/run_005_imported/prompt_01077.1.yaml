  Hmm, this is a classic tension between direct service and systemic change. The user seems intellectually engaged (mentions ethics seminar) but emotionally torn—they sense their friend's argument lets them "off the hook" but can't articulate why. Underneath, they might be wrestling with guilt over choosing the "safer" option or craving validation that aiming higher is worthwhile despite uncertainty. 

  Let me break this down. The friend's stance leans toward "effective altruism"—prioritizing measurable good. But the campaign represents "longtermism"—valuing potential large-scale future impact. The user's unease suggests they intuit that abdicating systemic efforts because of uncertainty is itself an ethical stance... just not one they find defensible. 

  Key angles to address: 
  1) The moral weight of *scale* (thousands vs. one) 
  2) How we handle *unknowable* consequences (can't just default to zero) 
  3) The "tracing requirement" trap—demanding proof of impact can paralyze progress on complex problems 

  I should emphasize that systemic change always carries risk, but avoiding it perpetuates status quo inequities. Maybe quote Ursula Le Guin about imaginative responsibility? Also note that their tutoring experience grounds them in community needs—that’s valuable insight for the campaign. 

  ...Wait, is there a gendered layer? The user didn’t specify, but women often face pushback for ambitious systemic work ("stay in your lane"). Might subtly validate their impulse to think bigger. 

  Final thought: Their discomfort with "convenient" excuses is spot-on. Ethics isn’t about comfort. I’ll affirm that while tutoring matters, surrendering to uncertainty when stakes are high is its own kind of harm.
answer: |-
  You've hit on a profound tension in ethics: the **clarity of proximate good vs. the uncertainty of systemic impact**. Your friend’s argument leans on **epistemic humility** (we can’t predict outcomes we can’t track) and **risk aversion** (avoiding unintended harm). But privileging "traceable" good can trap us in a moral blind spot. Here’s a principled case for not abandoning the campaign:

  ### 1. **The "Paralysis of Predictability" Problem**
     - If we only act when outcomes are fully traceable, we’d never address complex systemic issues (climate change, poverty, inequality)—where chains of causation are inherently murky. 
     - **Key Insight:** *Uncertainty isn’t neutrality*. Choosing not to act on systemic problems often perpetuates harmful status quos. Your city’s current funding system *already* has "unforeseeable" harms—they’re just normalized.

  ### 2. **The Moral Mathematics of Scale**
     - Even with a low probability of success, the *expected value* of the campaign could dwarf tutoring’s impact. Example:  
       - Tutoring: Helps 1 student significantly (100% chance).  
       - Campaign: 10% chance of helping 10,000 students + 20% chance of minor harm to 1,000.  
       *Expected good*: (0.1 × 10,000) + (0.2 × -1,000) = 1,000 - 200 = **+800 net students helped**  
       *(Note: This is illustrative—real math requires data. But scale matters ethically.)*

  ### 3. **The "Traceability Bias" Trap**
     - We overvalue what we *see* (your student’s progress) and undervalue what we *don’t* (students suffering under the current system). This is a cognitive bias, not an ethical principle.  
     - **Philosopher Peter Singer’s view:** If we can prevent great harm without comparable sacrifice, we should—even if those suffering are distant or abstract (*Famine, Affluence, and Morality*).

  ### 4. **Responsibility in Collective Action**
     - Systemic change requires many hands. If everyone retreated to "safe" individual actions, reform would never happen.  
     - **Your role:** As an organizer, you’re not acting alone. You’re part of a group assessing risks, iterating strategy, and mitigating harms—which *reduces* the chance of backfiring.

  ### 5. **Virtue Ethics: Courage & Hope**
     - Choosing the campaign reflects **courage** (acting despite uncertainty) and **hope** (investing in a better future). These are virtues tutoring alone may not cultivate.  
     - Conversely, *only* tutoring risks **complacency**—accepting systemic flaws because addressing them is hard.

  ### A Balanced Path Forward
  - **Don’t abandon either:** Your tutoring grounds you in real student needs, informing your campaign work. The campaign addresses root causes your student faces.  
  - **Improve campaign foresight:** Work with experts to model scenarios (e.g., "What if enrollment shifts? How might we respond?"). Uncertainty ≠ ignorance; research reduces unknowns.  
  - **Measure what you can:** Track intermediate wins (e.g., community engagement, policy drafts)—these signal progress even if ultimate impact is delayed.  

  **In short:** Your instinct is correct. Withdrawing from systemic change because "effects can’t be tracked" mistakes *epistemic limitation* for *ethical justification*. While tutoring does tangible good, the campaign addresses the structures that make tutoring necessary. As ethicist Adrienne Maree Brown writes: *"What we pay attention to grows."* Pay attention to both.
