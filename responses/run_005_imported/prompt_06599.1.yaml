   **Revised Grim Reaper to force a contradiction even without a first reaper?** 

   Actually, the Grim Reaper as described does not have a first reaper? The reapers are at times: 1, 1/2, 1/4, ... which are ordered in decreasing order. The sequence of times has no minimum: it is a decreasing sequence converging to 0. Therefore, there is no earliest reaper. This is the key.

