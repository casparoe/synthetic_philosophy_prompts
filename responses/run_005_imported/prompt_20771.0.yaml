  The opponent's perspective matters too. If the opponent is a big publisher, they might have deeper pockets and see this as deterring future claims. The user, as an individual, might be at a disadvantage. The lawyer's incentives also play a role. Lawyers might prefer continuing for fees, even if settling is better for the client. The user should have a frank talk with their lawyer about settlement chances versus costs.

