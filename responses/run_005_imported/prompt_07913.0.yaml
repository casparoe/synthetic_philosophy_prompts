  First, I need to understand the core conflict. The debate is about whether omissions should be listed as root causes. Proponents say they need action items; opponents say it's a category error and could lead to blame. The blameless culture is at risk here. 

  The user's explicit needs are a memo that sets a rule for handling omissions, ensures consistency, and fairly addresses objections. But deeper needs might include preserving psychological safety, ensuring actionable improvements without assigning blame, and fostering a culture of learning. 

  I recall that in incident management, root cause analysis often uses models like the "Five Whys" or systems thinking. Absences (like missing alerts) are latent conditions, not active failures. James Reason's Swiss Cheese Model comes to mind—each layer (like alerts or procedures) is a defense, and holes in those layers allow incidents to occur. Treating these holes as contributing factors rather than root causes might align with blameless principles. 

  The challenge is to frame omissions in a way that leads to systemic fixes without pointing fingers. For example, instead of saying "Engineer X didn't escalate," focus on why the escalation process failed—was the procedure unclear, or was there no training? 

  The memo should propose a rule: list omissions as contributing factors, not root causes. Root causes should be the direct technical or procedural failures. Action items would then target improving systems (e.g., creating alerts) rather than individual actions. 

  The strongest objection might be that this downplays the importance of omissions, leading to missed opportunities for prevention. Addressing this by emphasizing that contributing factors still get action items but are framed as system improvements. Also, reinforcing that this avoids blame and aligns with the blameless culture by focusing on the "why" behind the omission. 

  I should also consider how to structure the memo: state the rule clearly, explain the rationale, outline how to apply it, address the objection fairly, and conclude with the benefits for consistency and culture. Need to keep it concise and actionable for the board.
answer: |-
  ## Memo: Standardizing Treatment of Omissions in Postmortems

  **To:** Incident-Review Board  
  **From:** [Your Name/Title]  
  **Subject:** Resolution on Documenting Omissions in Postmortem Root Cause Analysis  
  **Date:** October 26, 2023  

  **Purpose:** To establish a consistent, actionable, and blameless approach for documenting omissions (e.g., missing alerts, procedural gaps, lack of escalation) in our postmortem root cause analysis.  

  ### 1. The Rule: Omissions as Contributing Factors, Not Root Causes
  *   **"Root Cause"** is reserved for the **active failure or condition that directly triggered the outage** (e.g., the software bug, the misconfiguration, the hardware failure).
  *   **Omissions** (missing alerts, inadequate monitoring, unclear escalation paths, untested failure modes) are documented as **"Contributing Factors"** or **"Systemic Gaps"**.
  *   **Action Items** will be generated *for both Root Causes AND Contributing Factors*. The key difference is *framing*, not *actionability*.

  ### 2. Rationale & Application
  *   **Preserves Causal Clarity:** The triggering bug *caused* the system to fail. A missing alert didn't *cause* the bug; it failed to *mitigate* the impact or *enable* timely detection. Treating absences as equivalent causes muddies causal analysis.
  *   **Upholds Blamelessness:** Labeling an individual's omission as "the root cause" inherently assigns blame, regardless of phrasing. Framing omissions as **systemic gaps** (e.g., "Alerting coverage for X failure mode was absent" instead of "Engineer Y failed to create an alert for X") focuses on process and tooling failures that enabled the omission to occur. This aligns with our commitment to psychological safety.
  *   **Enables Focused Action:** Action items for "Contributing Factors" target *system improvements*:
      *   *Omission:* No alert existed. → *Action:* Implement alert for failure mode X.
      *   *Omission:* On-call didn't escalate. → *Action:* Revise escalation procedure clarity & training; add sanity-check automation.
  *   **Prevents Dilution:** Avoids making "root cause" meaningless by including every conceivable safeguard that *could* have existed. Focuses the "root cause" label on the immediate technical/procedural spark.
  *   **Consistent Application:** In the postmortem template:
      *   **Root Cause:** The specific technical event/condition initiating failure.
      *   **Contributing Factors:** List omissions and systemic weaknesses that allowed the incident to propagate or prolong. Use neutral, system-focused language.
      *   **Action Items:** Track fixes for *both* sections equally.

  ### 3. Addressing the Strongest Objection
  **Objection:** *"Treating omissions only as 'Contributing Factors' downplays their critical role and risks deprioritizing fixes for these systemic gaps. If a missing alert was the only reason an outage lasted 8 hours instead of 8 minutes, calling it merely a 'contributing factor' feels insufficient and may lead to these high-impact gaps being overlooked or fixed slower than the technical root cause."*

  **Fair Response:** This is a valid concern about impact and priority. Our approach directly addresses it:
  1.   **Equal Actionability:** Action items for "Contributing Factors" are tracked with the *same rigor and priority* as those for "Root Causes." The label difference doesn't imply lower importance.
  2.   **Impact Highlighting:** The narrative section of the postmortem *must explicitly detail the operational impact* of each contributing factor (e.g., "Lack of alerting delayed detection by 7 hours"). This ensures the severity of the gap is undeniable.
  3.   **Focus on Prevention:** By categorizing omissions as systemic gaps, we inherently direct action towards *preventing recurrence* through improved processes and tooling, which is often more valuable long-term than just fixing the single triggering bug. The rule forces us to ask *why* the omission existed (e.g., flawed process? knowledge gap? tool limitation?), leading to deeper fixes.

  **Conclusion:** By categorizing omissions as **Contributing Factors/Systemic Gaps** rather than Root Causes, we achieve:
  *   **Causal Accuracy:** Maintaining clear causal logic.
  *   **Blamelessness:** Protecting psychological safety by focusing on system flaws.
  *   **Actionability:** Ensuring *all* critical gaps (technical triggers *and* systemic safeguards) get tracked fixes.
  *   **Consistency:** Providing a clear, objective rule for the board.

  This approach strengthens our postmortem process by ensuring we learn from *everything* that went wrong, while rigorously avoiding blame and maintaining focus on building more resilient systems. Let's adopt this for next quarter's template.  

  **Approved by:** [Optional: Add if needed]  
  **For Discussion:** Next Incident-Review Board Meeting.
