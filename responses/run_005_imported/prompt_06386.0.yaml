answer: |-
  Here are 8 sharp, accessible questions designed to push past the "all art is propaganda" soundbite, framed for a whole-school audience and requiring Du Bois (in character) to engage with his critics and contradictions. I've included potential rebuttals and follow-up notes for the toughest ones:

  **Core Principles & Critiques:**

  1.  **The "Art as Chore" Challenge (Locke):** "Dr. Du Bois, you famously said 'all art is propaganda.' But Alain Locke argued this view turns creating art into a *duty* or a 'chore' for Black artists – something they *must* do to uplift the race, rather than express their individual vision freely. Doesn't demanding art serve a political purpose first stifle true artistic freedom?"
      *   *Likely Rebuttal:* He might emphasize the urgent *need* for positive representation in a racist society, arguing freedom without purpose is a luxury Black artists can't afford yet. He might frame it as a higher calling, not a chore.
      *   *Your Follow-Up (If needed):* "But if an artist feels their most authentic expression *isn't* overtly political or uplifting, should they suppress it? Isn't that asking them to be untrue to themselves?"

  2.  **The "Racial Mountain" Question (Hughes):** "Langston Hughes wrote about young Black artists feeling pressured to climb a 'high mountain of the white man's culture' or present only respectable images to please white audiences *or* the Black middle class. He urged them to be true to their own experiences, even the 'ugly' ones. Doesn't your emphasis on art as propaganda for racial uplift risk becoming *part* of that pressure, that 'mountain' Hughes described?"
      *   *Likely Rebuttal:* He might argue Hughes confuses honesty with vulgarity or defeatism. He might stress that portraying struggle is vital, but it must be done with dignity and purpose to *combat* stereotypes, not reinforce them.
      *   *Your Follow-Up (If needed):* "But isn't portraying the full, complex, sometimes messy reality of Black life – like the joys and struggles of ordinary working people – also a powerful form of truth-telling that *can* combat stereotypes? Isn't demanding only 'dignified' portrayals itself a kind of censorship?"

  3.  **The McKay Hypocrisy Charge:** "Dr. Du Bois, you wrote a very critical review of Claude McKay's novel *Home to Harlem*, calling it 'filth' and saying it made you feel 'dirty.' Yet, in 'Criteria of Negro Art,' you declared *all* art is propaganda. If McKay was honestly portraying the lives he saw – even the parts some might find distasteful – isn't *that* also propaganda? Doesn't condemning his portrayal contradict your own theory by implying some truths are *too* true, or too 'dirty,' for art?"
      *   *Likely Rebuttal:* He will likely distinguish between "propaganda for truth and uplift" and "propaganda for degradation." He'll argue McKay focused on the sordid without sufficient counterbalance or higher purpose, thus reinforcing negative stereotypes.
      *   *Your Follow-Up (If needed):* **Crucial Question:** "So, by your standard, is the *only* valid propaganda that which portrays Black people in a way *you* deem 'respectable' or 'uplifting'? Doesn't that give you, the critic, immense power to decide what truths are acceptable?"

  **Applying the Theory: Specifics & Hypotheticals**

  4.  **The Abstract Art Test:** "Imagine a Black artist creates a large, beautiful painting using only shapes, lines, and colors – pure abstraction, like a Kandinsky. It has no recognizable figures, no story, no obvious racial or political message. It moves people emotionally purely through form and color. By your standard that 'all art is propaganda,' what is *this* art propagating? Can it be 'good' art?"
      *   *(This forces him to either admit non-narrative/non-political art exists, or stretch "propaganda" beyond recognition).*

  5.  **The "Uplift" Dilemma:** "If a powerful, beautifully written novel by a Black author portrays a Black character committing a terrible crime *without* an obvious moral lesson about racism causing it – just showing a complex, flawed human – does that novel fail as art by your criteria? Is it 'bad propaganda' simply because it doesn't explicitly uplift?"
      *   *(Highlights the tension between complex humanity and didactic purpose).*

  6.  **The Audience Question:** "You argue art must be used deliberately to fight prejudice. But if a white audience sees a play showing strong, dignified Black characters overcoming adversity, could they leave thinking, 'Well, *those* Black people are exceptional, but the others...'? Can 'positive propaganda' ever backfire by implying the positive portrayals are the *exception* rather than the rule?"

  **Legacy & Nuance:**

  7.  **Beyond Harlem:** "Looking beyond the Harlem Renaissance debates, do you believe *all* art, regardless of who creates it – Michelangelo, Shakespeare, Beethoven – is fundamentally propaganda for *some* viewpoint or value system? Or is the 'propaganda' requirement specifically for Black art created under oppression?"
      *   *(Tests if he truly means "all art" universally, or if it's a specific strategy for a specific context).*

  8.  **The Future of the Argument:** "If future generations achieve a truly just and equal society, free from the intense racial prejudice we face today, would the need for art to be 'propaganda' disappear? Could art then just be... art?"

  **Key Delivery Tips for the Assembly:**

  *   **Phrasing is Key:** Use clear, simple language. Avoid names like "Locke" or "McKay" initially; frame the critiques as "some argued..." or "one critic said..." before naming them if needed. Focus on the *ideas*.
  *   **Contextualize Briefly (if allowed):** Before asking the McKay question, you *might* say very succinctly: "You wrote a famous review criticizing another writer's book for being too focused on the lower aspects of life..." Don't get bogged down in details.
  *   **Be Respectful but Persistent:** Remember, it's a performance. Be polite ("Dr. Du Bois"), but if he dodges, use your prepared follow-ups calmly: "To follow up on that point about Claude McKay..." or "You mentioned purpose, but regarding Langston Hughes's point about authenticity..."
  *   **Prioritize:** You likely won't get through all 8 in 20 mins. Identify your top 4-5 (e.g., 1, 2, 3, 4, 6).
  *   **Listen Actively:** His answers might give you an organic opening for a different follow-up than planned. Be ready to adapt slightly.

  These questions cut to the core of the debate, challenge potential inconsistencies, use accessible language, and are designed to elicit more than just a rehearsed soundbite. Good luck – you're doing important work by pushing for a deeper conversation!
