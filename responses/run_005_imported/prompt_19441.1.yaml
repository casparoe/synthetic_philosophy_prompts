  ## MEMORANDUM  
  TO: Co-Trustees [Your Name], [Co-Trustee 1 Name], [Co-Trustee 2 Name]  
  FROM: [Your Name]  
  DATE: [Current Date]  
  SUBJECT: Resolution Recommendation Regarding Disposition of "My Emerald Ring" Bequest to Elena  

  **I. Introduction**  
  This memorandum addresses the specific bequest of "my emerald ring" to our cousin Elena under Grandmother's trust. As you know, approximately two years prior to her passing, Grandmother had the original ring's gold band melted down and the emerald reset into a pendant due to arthritis. The trust document was never amended to reflect this change. Our legal counsel has confirmed ambiguity exists under both the trust language and state law regarding whether the pendant satisfies the bequest.  

  Given the requirement for unanimous trustee agreement and the need to finalize distributions within the month, I propose the following analysis and recommendation. This memo aims to engage seriously with both perspectives before advocating for a resolution.  

  **II. Analysis of Conflicting Positions**  

  *   **Position A: The Bequest Has Failed (Formalist View)**  
      *   **Core Argument:** The trust unambiguously bequeaths "my emerald ring." A pendant is a fundamentally distinct object from a ring. The transformation altered the item's essential character and function. Grandmother’s deliberate act of melting the band destroyed the specific item identified in the trust.  
      *   **Supporting Reasoning:**  
          *   **Specificity of Language:** Trust interpretation prioritizes the plain meaning of the words used. "Ring" denotes a circular band worn on the finger. The pendant no longer fits this definition.  
          *   **Testator's Action & Intent (Implied):** Grandmother understood the importance of amending estate plans; her failure to update the trust after altering the item suggests she did not consider the pendant to be the "ring" for testamentary purposes.  
          *   **Preservation of Asset Identity:** Property law often requires the specific asset described to exist in that form at death. The transformation severed the direct link to the described asset.  
          *   **Precedent & Certainty:** Strict adherence to the document's language provides clarity and avoids subjective interpretations of intent in other contexts.  
      *   **Consequence:** The specific bequest fails. The pendant becomes part of the residuary estate. Elena receives only her share of the residue.  

  *   **Position B: The Pendant Satisfies the Bequest (Substantive View)**  
      *   **Core Argument:** The essence of the bequest was Grandmother's lifelong attachment to *this specific emerald and gold*, regardless of its form. Denying Elena these materials based solely on a necessary alteration due to Grandmother's health is an overly rigid interpretation that defeats her clear sentimental intent.  
      *   **Supporting Reasoning:**  
          *   **Testator's Intent (Overriding Principle):** The paramount goal in trust interpretation is to effectuate the settlor's probable intent. Grandmother specifically identified *this* emerald and *this* gold (from the band) for Elena. The change in form was a practical adaptation, not an abandonment of the item or its significance to Elena.  
          *   **Continuity of Asset:** The core components – the unique emerald and the specific gold (merely reshaped) – remain intact. The sentimental and material value resides primarily in these elements.  
          *   **Reason for Alteration:** The change was necessitated by Grandmother's arthritis, making the ring unwearable. It was not a casual redesign or disposal but a modification to preserve utility and connection to the item.  
          *   **Absurdity/Unintended Consequence:** Interpreting the bequest as failed leads to an illogical outcome: Grandmother's cherished emerald and gold (worn daily for 60 years) are withheld from the specifically named beneficiary due to a medically necessary reshaping, while the *materials themselves* pass to others (via the residue) who were not singled out for this item.  
      *   **Consequence:** The pendant is distributed to Elena as satisfaction of the "my emerald ring" bequest.  

  **III. Evaluation & Recommendation**  

  Both positions present valid, principled arguments grounded in legitimate concerns of trust administration: Position A emphasizes fidelity to the written instrument and legal certainty, while Position B prioritizes discerning and fulfilling the settlor's likely substantive intent.  

  After careful consideration, **I recommend we adopt Position B and distribute the emerald pendant to Elena as satisfaction of the specific bequest of "my emerald ring."**  

  *   **Reasoning for Recommendation:**  
      1.  **Overriding Intent:** The primary evidence points to Grandmother's intent being to pass *this specific emerald and the gold from her long-worn ring* to Elena. The description "my emerald ring" was the identifier for that asset at the time the trust was drafted. The subsequent physical modification, driven by necessity, does not appear indicative of an intent to revoke or alter that specific gift, but rather to adapt its form for continued personal use.  
      2.  **Substance Over Form:** The core valuable and sentimental assets – the unique emerald and the family gold – are undeniably present. To prioritize the *shape* of the gold over the *identity* of the materials risks elevating legal technicality above the clear spirit of the bequest.  
      3.  **Avoiding Unintended Inequity:** Position A creates a result that feels fundamentally unjust: Elena is denied the very object Grandmother intended for her, an object imbued with decades of family history, solely because Grandmother altered it late in life to continue wearing it comfortably. The materials then pass residually, likely diluting Elena's connection to them.  
      4.  **Practical Context:** The alteration was minor in terms of material substance (same stone, same gold) and major only in terms of function/form. The reason (arthritis) underscores the lack of dispositive intent.  
      5.  **Fiduciary Duty to Effectuate Intent:** Our duty as trustees is not merely to follow the letter mechanically, but to seek the settlor's true purpose where ambiguity exists. Position B best achieves this.  

  *   **Acknowledging Position A's Validity & Mitigation:**  
      I fully recognize the force of Position A's argument regarding specificity and the potential need for clear rules. To address this concern and mitigate any perceived risk:  
      *   We will obtain a formal appraisal clearly identifying the pendant as containing "the emerald and gold originally comprising [Grandmother's Name]'s emerald ring, reset into pendant form in [Year]."  
      *   We will document our decision-making process thoroughly in the trust administration records, citing the ambiguity, our consideration of both positions, and our unanimous conclusion based on the settlor's likely intent.  
      *   We will explicitly state in the distribution documentation that the pendant is distributed in full satisfaction of the specific bequest of "my emerald ring."  

  **IV. Path Forward & Unanimity**  

  I understand reaching unanimity requires each of us to feel our perspective has been heard and respected. This memo attempts to demonstrate the seriousness with which I view both positions. While I advocate strongly for Position B based on the reasoning above, I am committed to finding a resolution we can all support in our role as fiduciaries for Grandmother's wishes and the beneficiaries.  

  **Recommendation:**  
  That we unanimously agree to distribute the emerald pendant to Elena as satisfaction of the specific bequest of "my emerald ring," accompanied by the documentation outlined above.  

  **Action Requested:**  
  Please review this analysis carefully. I propose we schedule a meeting within the next [Suggest timeframe, e.g., 3-5 days] to discuss any remaining concerns and formally vote on this resolution. Time is of the essence to meet our distribution deadline.  

  Respectfully submitted,  
  [Your Name]
