  2. **Probabilistic Reflection**: Replaces binary provability with a coherent probability assignment over self-referential sentences. This allows the agent to assign probabilities to statements about its own future beliefs.

  3. **Reflective Oracles**: Answer self-referential probabilistic queries by sometimes resolving them randomly to avoid diagonalization.

