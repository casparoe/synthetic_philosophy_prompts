answer: |-
  Here’s the case for embracing Adams-Edgington non-cognitivism in light of Lewis’s triviality result, directly confronting Stalnaker’s contextualism and Jackson’s hybrid theory. I’ll reconstruct Lewis’s proof, expose the costs of each "rescue," dismantle the embedding objection, and argue that sacrificing truth conditions is the least-bad option.

  ### 1. Lewis’s Triviality Result: The Core Problem
  Lewis’s proof shows that **if indicative conditionals express fixed propositions satisfying the Adams Thesis (AT) across all credence functions, then probabilistic coherence collapses**. Assume:
  - **AT**: \( P(A \rightarrow B) = P(B|A) \) for any coherent credence function \( P \) (when \( P(A) > 0 \)).
  - **Proposition Constancy**: \( A \rightarrow B \) expresses the same proposition in any \( P \).

  Lewis considers a coherent \( P \) and two updates:
  - \( P_B(\cdot) = P(\cdot|B) \)
  - \( P_{\neg B}(\cdot) = P(\cdot|\neg B) \)

  By AT and proposition constancy:
  1. \( P_B(A \rightarrow B) = P_B(B|A) = 1 \)  
     (since \( P_B(B) = 1 \), so \( P_B(B|A) = 1 \))
  2. \( P_{\neg B}(A \rightarrow B) = P_{\neg B}(B|A) = 0 \)  
     (since \( P_{\neg B}(B) = 0 \))

  By the law of total probability:
  3. \( P(A \rightarrow B) = P(A \rightarrow B|B) \cdot P(B) + P(A \rightarrow B|\neg B) \cdot P(\neg B) \)
     - Substitute using (1) and (2):  
       \( P(A \rightarrow B) = [1 \cdot P(B)] + [0 \cdot P(\neg B)] = P(B) \)
  4. But by AT, \( P(A \rightarrow B) = P(B|A) \).  
     So \( P(B|A) = P(B) \).

  **Conclusion**: \( A \) and \( B \) must be probabilistically independent for *any* coherent \( P \). Absurd.  
  ➠ **AT + Proposition Constancy → Triviality**.

  ---

  ### 2. The "Rescues" and Their Fatal Costs
  #### **Stalnaker’s Contextualism**: Shift the Proposition
  - **The Rescue**: Deny proposition constancy. \( A \rightarrow B \) expresses *different propositions* relative to different credal states. AT holds within each context, but the conditional’s content changes when \( P \) changes.  
  - **The Cost**: **Erodes public meaning and disagreement**.  
    - If you and I have different credences, "If A, B" expresses *different propositions* for each of us. We aren’t disagreeing about the *same claim*; we’re talking past each other.  
    - Worse: When *your own* credences shift (e.g., learning B), the conditional’s content changes. You didn’t *change your mind* about a fixed proposition—you started talking about something else.  
    - **Consequence**: Truth-conditional semantics becomes **solipsistic**. The attractive core of truth conditions—shared objects of assertion, belief, and disagreement—is sacrificed. Stalnaker saves truth values but robs them of their interpersonal role.

  #### **Jackson’s Material Conditional + Robustness**  
  - **The Rescue**: Keep the material conditional (\( \neg A \lor B \)) as the truth condition. AT is false; instead, assertability requires *high \( P(B|A) \) *and* robustness (i.e., \( P(B|A) \) remains high if \( A \) is learned).  
  - **The Cost**: **Misaligns with intuitive truth conditions and inference**.  
    - **Truth conditions are wrong**: "If I strike this match, it will light" is false if the match is wet—not true (as the material conditional would say).  
    - **Robustness is inadequate**:  
      - (i) Many robust conditionals are unassertable (e.g., "If I have children, I have exactly 17" when \( P(\text{children}) \approx 0 \)).  
      - (ii) AT explains *why* we *use* conditionals; Jackson demotes it to pragmatics.  
    - **Consequence**: This is a **desperate salvage operation** on the material conditional, preserving truth conditions only by making them irrelevant to rational use.

  ---

  ### 3. Why Adams-Edgington Wins: Embrace Non-Truth-Conditionality
  **The Core Claim**: Indicative conditionals aren’t propositions. They’re *devices for managing conditional credences*.  
  - \( A \rightarrow B \) *expresses* \( P(B|A) \) (for the speaker) and proposes updating by conditionalizing on \( A \).  
  - **AT holds by stipulation**: \( P(A \rightarrow B) = P(B|A) \) is *not* a claim about credence in a proposition—it’s the *rule for assigning credence* to the conditional.

  #### Defeating the Embedding Objection
  Your friend is right: Embeddings (*¬(A→B)*, *C ∨ (A→B)*, *(A→B) → C*) are the toughest challenge. But non-cognitivism can handle them:  
  - **Negation**: "It’s not true that if A, B" expresses *rejection* of the proposed update. It’s equivalent to "Even if A, it might be that ¬B" → *high P(¬B|A)*.  
    - *Example*: "It’s not true that if I pray, I’ll survive" ≈ "Survival is unlikely *even if* I pray".  
  - **Disjunction**: "C ∨ (A→B)" expresses a *complex attitude*:  
    - Asserting it proposes dividing credence between C and the policy of assigning high credence to B given A.  
    - *Example*: "I’ll be late or, if it rains, I’ll cancel" ≈ "P(late) is high, OR (if rain, P(cancel) is high)".  
  - **Nested Conditionals**: "(A→B) → C" expresses a *higher-order policy*:  
    - "If I endorse assigning high credence to B given A, then I assign high credence to C."  
    - This tracks *constraints on coherence* (e.g., "If it’s true that if A, B, then if A∧C, B" reflects probabilistic dependence).  

  **Key Insight**: Embeddings aren’t *truth-functional* but *constraint-functional*. They encode *norms for combining conditional attitudes*. This explains their logical behavior without propositions.

  #### Why This Cost is Smaller
  - **Stalnaker’s cost**: Truth conditions become **idle wheels**. If the proposition shifts with every credal change, truth values can’t play their core role in communication or disagreement.  
  - **Jackson’s cost**: Truth conditions are **systematically misleading** (equating conditionals with ¬A∨B) and decoupled from use.  
  - **Adams-Edgington’s cost**: We lose *bivalent truth values* for conditionals. But we gain:  
    - **Explanatory power**: AT holds universally; no ad hoc shifts.  
    - **Empirical accuracy**: Matches how conditionals guide reasoning under uncertainty.  
    - **Preserved disagreement**: We dispute *what credence to assign to B given A*—a substantive, shared issue.  

  ---

  ### Verdict: Truth Conditions Aren’t Worth Saving
  Lewis showed that **propositional content + AT → absurdity**. Stalnaker and Jackson contort semantics to preserve truth conditions, but at the cost of either **fracturing propositional content** (Stalnaker) or **severing truth from use** (Jackson). Adams-Edgington accepts the radical lesson: Conditionals aren’t in the "fact-stating" business. They’re tools for hypothetical reasoning. The embedding challenge isn’t trivial—but **treating embeddings as tests for coherence of conditional attitudes** is less damaging than hollowing out truth or propositionality. Your friend’s "non-cognitivism with extra steps" is exactly right—and those "steps" (dynamic semantics, probabilistic constraints) are how we *save* the logic of conditionals from Lewis’s wrecking ball. Truth conditions are the deadweight; cut them loose.
