answer: |-
  Here's a breakdown of the test case and how epistemic contextualism (EC) and subject-sensitive invariantism (SSI) handle it, followed by an analysis of their rivalry:

  **The Test Case:**

  1.  **Subject (S):** Sally believes the bank will be open on Saturday (based on her evidence: drove by yesterday, remembers regular hours).
  2.  **Subject's Situation (Unbeknownst to Speaker):** Sally is *actually* in a high-stakes situation. She *needs* to deposit her paycheck by Saturday to avoid financial ruin (e.g., foreclosure, massive penalty). If the bank is closed, she loses everything. She is *about* to act on this belief by not going to the bank on Friday.
  3.  **Attributor (A):** Alex, in a completely separate, relaxed, low-stakes conversation.
  4.  **Attributor's Context:** Alex is chatting casually with a friend about weekend plans. Alex mentions Sally and says: "Oh, Sally **knows** the bank is open Saturday; she drove by yesterday. So she doesn't need to rush there Friday after work."
  5.  **A's Stakes:** Alex has no stake in whether the bank is open or not, and neither does Alex's conversational partner. The topic is casual. The standards for knowledge ascription in this conversation are low.
  6.  **Key Separation:** A's conversational context (low-stakes, low-standards) is completely decoupled from S's actual practical situation (high-stakes).

  **Predictions of the Theories:**

  1.  **Epistemic Contextualism (EC):**
      *   **Core Principle:** The semantic content (truth conditions) of the word "knows" depends on the *attributor's* conversational context, specifically the epistemic standards in play *in that conversation*. "Knows" is context-sensitive.
      *   **Prediction for the Test Case:** Alex's ascription "Sally knows the bank is open Saturday" is made in a *low-standards* conversational context. The practical stakes for Alex and Alex's audience are low. Therefore, the semantic standard for "knows" that governs Alex's utterance is low. Relative to *that low standard*, Sally's evidence (drove by yesterday, remembers hours) is sufficient. **EC predicts Alex's statement is TRUE.**

  2.  **Subject-Sensitive Invariantism (SSI) / Pragmatic Encroachment:**
      *   **Core Principle:** Whether a subject *knows* a proposition *p* depends not only on traditional epistemic factors (evidence, reliability, truth) but also on the subject's *practical situation* – specifically, the *stakes* or *costs of being wrong* about *p* for the subject *at the time*. "Knows" itself has invariant truth conditions, but those conditions include a practical element concerning the subject. Knowledge is harder to achieve in high-stakes situations, even with the same evidence.
      *   **Prediction for the Test Case:** Sally is in an *extremely high-stakes* situation regarding the bank being open. The cost of her being wrong (financial ruin) is very high. According to SSI, this high practical stakes *raises the epistemic threshold Sally must meet* to count as genuinely *knowing* the bank is open. Her evidence (drove by yesterday, remembers hours) is likely *insufficient* to meet this heightened threshold imposed by her practical situation. Therefore, Sally *does not know* the bank is open Saturday. Since Alex's statement ("Sally knows...") asserts that Sally *does* know (according to the invariant, subject-sensitive truth conditions), and Sally does *not* know, **SSI predicts Alex's statement is FALSE.**

  **Analysis of the Rivalry:**

  *   **Divergent Predictions:** The crucial point is that EC and SSI make **diametrically opposed predictions** about the truth value of Alex's utterance in this specific test case.
      *   EC: TRUE (because A's context sets low standards).
      *   SSI: FALSE (because S's high stakes mean S doesn't know, regardless of A's context).
  *   **Substantive Rivalry:** This divergence demonstrates that EC and SSI are **substantive rivals**, not merely notational variants. They posit fundamentally different mechanisms to explain the same *pattern* of data (like the original bank case where attributor and subject stakes coincide):
      *   **Mechanism:** EC locates the shift in the *semantics of the knowledge attribution* itself (the meaning of "knows" changes with context). SSI locates the shift in the *metaphysics of knowledge* (what it *is* for a subject to know depends partly on practical factors).
      *   **Locus of Shift:** EC places the crucial factor on the *attributor's context*. SSI places it on the *subject's practical situation*.
      *   **Testability:** The decoupled case provides a test where these mechanisms pull in opposite directions. A theory that was merely a notational variant of the other would *not* make a different prediction in this scenario. The fact that they do conflict shows they represent genuinely distinct explanations of knowledge attributions.
  *   **Not Merely Verbal:** The disagreement is not just about how to *talk* about knowledge ("knows" being context-sensitive vs. invariant but practically loaded). It's about *what knowledge fundamentally is* and *what determines the truth of a knowledge ascription*. EC says the truth of "S knows p" depends on the ascriber's conversational standards. SSI says it depends on the subject's epistemic position *including* their practical stakes relative to p.

  **Conclusion:**

  The test case successfully pulls apart the loci of explanation for contextualism and subject-sensitive invariantism. Contextualism predicts Alex's low-stakes ascription is true, while subject-sensitive invariantism predicts it is false. This clear conflict in predictions under carefully controlled conditions (where attributor context and subject stakes are decoupled) proves that the two views are **substantive rivals**. They offer fundamentally different accounts of the nature of knowledge and the semantics of knowledge attributions, not merely different ways of saying the same thing. The debate is substantive, not merely verbal.
