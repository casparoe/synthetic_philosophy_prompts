     Therefore, the distribution of `s` should be such that the probability that `s` is in [a, b] is the same as the probability that `s'` is in [a/k, b/k] when we change the unit. This forces the distribution to be scale-invariant. The only scale-invariant distribution on (0, ∞) is the improper prior `ds/s`. But in our case, the side length is bounded: between 0 and 1. So we cannot have an improper prior. 

     How can we have a scale-invariant distribution on [0,1]? It's impossible because scaling would map [0,1] to [0,1/k] which is a subset of [0,1] only if k>=1. So we cannot have exact scale invariance.

     Therefore, the symmetry argument does not apply as cleanly. 

     However, if we consider the problem without bounds, then we use the improper prior `ds/s` for `s>0`. Then the probability that `s <= c` for any fixed c is infinite? So that doesn't work. 

     Alternatively, we can use the method of Jaynes by considering the ratio of the side length to the maximum side length. But the maximum side length is fixed at 1. So the unit is fixed. 

     Therefore, the cube factory paradox does not have the same symmetry as Bertrand's paradox. In Bertrand's paradox, the circle can be of any size, and the condition is scale-invariant. In the cube factory, the bounds are fixed. 

     So the invariance under scaling of units would require that we consider the relative size. But the problem is: the cube has side length in [0,1]. We are not told that the factory can produce cubes of any size. The bounds are fixed. Therefore, the symmetry of scaling is broken by the bounds. 

     Hence, Jaynes' method does not directly apply. The principle of indifference then faces the problem of which parameter to be indifferent on: side length or volume? Without a symmetry to guide us, we are back to the arbitrariness. 

