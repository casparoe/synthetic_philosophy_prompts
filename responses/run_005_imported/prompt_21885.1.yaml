     The key is that the problem is set in the Euclidean plane. The symmetries that preserve the structure (Euclidean geometry) are the Euclidean group and scaling. Therefore, Jaynes' choice is well-motivated.

  3. **Does it push the arbitrariness back?** Yes, in a sense. Instead of arbitrarily choosing a method, we arbitrarily choose a symmetry group. However, the symmetry group is chosen based on the problem: the circle is a Euclidean object and the problem is about chords (straight lines). The symmetries that preserve the Euclidean structure and the circle are the ones we use. So the choice is not arbitrary; it is based on the structure of the problem. 

     Therefore, Jaynes' argument does rescue the principle of indifference from the charge of arbitrariness by providing a well-motivated criterion (the symmetries of the problem) to break the underdetermination.

