     Can we use a similar symmetry-based argument to fix this?

     The problem: a cube is produced with side length in [0, 1]. We want the probability that the side is ≤ 0.5. 

     The symmetries: we are considering a cube. The natural symmetries are the Euclidean symmetries that preserve the cube? But note, the cube is not fixed in space. We are only given the side length (or the volume). 

