     In the absence of such information, the problem is ill-posed. Jaynes' symmetry argument works for Bertrand's paradox because the problem is about a geometric circle without specified coordinates or size. But the cube factory problem specifies the bounds in a particular unit (meters) and for the side length. So it is natural to assume that the side length is the parameter being controlled. 

