prompt: |-
  I've been working through the literature on dynamic choice and diachronic consistency for a dissertation chapter, and I keep running into a conceptual knot I'd like help untangling. Edward McClennen's resolute choice theory and the updateless decision theory (UDT) developed in the AI safety/rationalist literature (Yudkowsky, Hintze, and others) both seem motivated by a similar worry: that agents who revise their plans in light of new information can be exploited across time (money-pumped, or made to defect against their own past selves) in ways that a suitably "committed" agent would avoid. Both frameworks recommend sticking to a plan formed at an earlier point even when, from a later vantage point, deviating looks locally rational.

  That said, I suspect the two views rest on quite different background commitments. McClennen's resolute choice is pitched within a broadly Kantian, agent-centered picture of practical rationality, and doesn't obviously require any revisionary metaphysics of decision-making -- it just asks the agent to treat her earlier self's plan as binding. UDT, by contrast, is typically formulated in terms of an agent selecting a global policy (a function from observations/inputs to actions) prior to any updating at all, which seems to presuppose a much more radical picture on which later "selves" or epistemic states have no independent standing to deviate from the policy chosen "at the beginning of time." I'd like to get clearer on whether this difference is substantive or merely a difference in framing. Could you compare resolute choice theory and updateless decision theory in some depth -- particularly how each would handle something like the toxin puzzle or Newcomb-like cases such as counterfactual mugging -- and say whether UDT should be understood as a formalization (or descendant) of resolute choice, or whether it's making a genuinely different theoretical claim about the nature of rational agency and the unit of rational evaluation (acts vs. policies vs. dispositions)?
reasoning: |-
  Okay, the user is working on a dissertation chapter about dynamic choice and diachronic consistency. They're comparing McClennen's resolute choice theory and Updateless Decision Theory (UDT), noting both address exploitation across time but suspect different philosophical foundations. Let me start by recalling the core ideas of each theory.

  McClennen's resolute choice is Kantian, emphasizing commitment to pre-established plans. The agent treats past decisions as binding, avoiding money pumps by sticking to the plan. UDT, from AI safety, involves selecting a global policy before any information, treating the agent as a single entity across time. The user wants to know if UDT is a formalization of resolute choice or a different approach.

  First, I need to break down each theory's approach. Resolute choice operates within standard decision theory but adds a commitment mechanism. UDT fundamentally changes the decision-making unit to policies, not individual actions. The user mentioned cases like the Toxin Puzzle and Counterfactual Mugging. How each handles these will highlight differences.

  For the Toxin Puzzle, resolute choice would commit to intending the prize, thus drinking without belief. UDT would precommit to drinking if the prize is awarded, regardless of current beliefs. Here, both avoid exploitation similarly, but their reasoning differs: commitment vs. policy optimization.

  Counterfactual Mugging is trickier. Resolute choice might struggle because the future self has no reason to pay without the coin flip. UDT's precommitment to paying in all possible scenarios, even counterfactual ones, shows its focus on global outcomes. This points to UDT's more radical stance on counterfactuals.

  The user's deeper need might be understanding the philosophical distinctions: Is UDT just a technical version of resolute choice, or does it introduce new concepts? The key differences lie in the unit of agency and counterfactual handling. UDT's policy-based approach and acausal reasoning go beyond McClennen's, which stays within causal, temporal bounds.

  Also, the user might be interested in implications for their dissertation's framework. Clarifying whether these theories are compatible or fundamentally opposed could shape their chapter's direction. Highlighting UDT's formalization aspects versus its novel claims about rational agency will address their query effectively.
answer: |-
  This is an excellent and perceptive dissection of two sophisticated approaches to dynamic inconsistency. You're right to identify a shared motivation – preventing temporal exploitation – but also to suspect deep foundational differences. Let's untangle them by examining their core commitments, handling of key puzzles, and philosophical underpinnings.

  **Core Commitments & Theoretical Framing:**

  1.  **McClennen's Resolute Choice (RC):**
      *   **Unit of Evaluation:** **Sequences of choices/plans over time.** Rationality evaluates the entire *plan* adopted at an initial node. The agent is a temporally extended entity.
      *   **Rationality Principle:** **Commitment as a Requirement of Rationality.** Once a rational plan is adopted at an initial node (based on preferences and beliefs at that time), *sticking to that plan* at subsequent choice nodes, even if *local* incentives seem to favor deviation, is constitutive of rationality itself. This commitment prevents self-defeat (e.g., money pumps).
      *   **Metaphysics:** **Temporally Extended Agent within Standard Time.** Accepts the standard flow of time and the existence of distinct temporal stages of the *same* agent. The "earlier self" makes a rational plan; the "later self" is rationally obligated to follow it *because it was the rational plan*. This obligation stems from the identity of the agent over time.
      *   **Epistemology:** **Standard Bayesian Updating.** The agent updates beliefs as information arrives. The commitment is to the *plan contingent on states*, not to ignoring information. Deviation occurs when the *locally optimal action* given *updated beliefs* differs from the *planned action* for that information state.
      *   **Motivation:** Primarily **normative/practical philosophy**. Preventing self-defeat and honoring the rational perspective of the temporally extended self. Kantian influence: autonomy requires acting on principles chosen by one's rational self, not being slave to local incentives.
      *   **Key Move:** Distinguishes between *adopting a plan* (evaluated globally) and *executing a stage of a plan* (evaluated locally). Rationality primarily governs plan adoption; execution is governed by the commitment to the rational plan.

  2.  **Updateless Decision Theory (UDT):**
      *   **Unit of Evaluation:** **Global Policies (Functions from Inputs to Actions).** Rationality evaluates *entire mappings* from possible sequences of observations (including the agent's own cognitive state, if modeled) to final actions. The agent is fundamentally a **single, timeless algorithm**.
      *   **Rationality Principle:** **Maximize Expected Utility from the "Beginning of Time" Perspective.** The agent, conceived as existing "before" any information arrives (or outside time), chooses a *single policy* (a complete function) that dictates its action for every possible sequence of inputs it might ever receive. This policy is chosen to maximize expected utility *over all possible worlds it could find itself in*, weighted by prior probabilities. **No subsequent "updating" or deviation is permitted**; the policy is executed algorithmically.
      *   **Metaphysics:** **Radical Timelessness / Algorithmic Identity.** Challenges the intuitive notion of distinct temporal selves. The agent is a fixed piece of code or a mathematical function. "Later stages" aren't independent decision-makers; they are simply the *outputs* of the globally chosen function applied to specific inputs (observations). There *is no* "later self" with the authority to reconsider; there is only the execution of the pre-determined function.
      *   **Epistemology:** **No Dynamic Updating in the Standard Sense.** Beliefs are implicitly encoded in the prior probabilities used to evaluate the global policy. "Learning" is just the function receiving different inputs, triggering different outputs as per the fixed mapping. The *policy* is "updateless" – it doesn't change based on what is observed.
      *   **Motivation:** Primarily **technical/AI alignment & decision theory foundations.** Solving problems where standard causal decision theory (CDT) and even evidential decision theory (EDT) fail (e.g., counterfactuals involving predictors, logical uncertainty, acausal interactions). Rooted in functionalism and the view of agents as algorithms.
      *   **Key Move:** Eliminates the distinction between *planning* and *execution*. There is only one decision: choosing the global policy. Everything else is mechanical output.

  **Handling the Puzzles:**

  1.  **The Toxin Puzzle (Kavka):**
      *   **Scenario:** A billionaire offers you $1M on Tuesday if, at midnight Monday, you *intend* to drink a harmless but unpleasant toxin on Wednesday. You get the money Tuesday night, regardless of whether you drink the toxin Wednesday. Drinking the toxin itself provides no benefit.
      *   **Standard CDT/EDT:** On Wednesday, knowing you have the money, drinking the toxin is strictly dominated by not drinking it. Therefore, on Monday, you know you *won't* drink it Wednesday, so you cannot form the sincere intention to drink it, and you lose the $1M.
      *   **Resolute Choice (RC):** On Monday, you rationally adopt the plan: "Intend to drink the toxin (to get the $1M) and then drink it on Wednesday." This is the globally rational plan. On Wednesday, you are rationally committed to this plan. You drink the toxin, despite the local dominance of not drinking, *because deviating would violate your rational commitment and make you worse off overall* (you wouldn't have gotten the $1M).
      *   **Updateless Decision Theory (UDT):** Before Monday (from the "timeless" perspective), you choose a policy. The optimal policy is: "If I observe that I have been offered the toxin deal and it is Monday, form the intention to drink the toxin. If I observe that I formed the intention on Monday and it is now Wednesday, drink the toxin." You evaluate this policy *across all branches*: in the branch where you get the money *and* drink the toxin, and the branch where you don't get the money and don't drink. The expected utility of this policy (factoring in the high probability of getting $1M and the low cost of the toxin) outweighs the policy of never drinking. On Wednesday, you simply execute the policy's output: drink the toxin. There is no "local" decision point.

  2.  **Counterfactual Mugging (Omohundro/Yudkowsky):**
      *   **Scenario:** Omega flips a coin. If heads, Omega asks you for $100. If tails, Omega gives you $10,000 *only if* it predicts you would have paid $100 if the coin had been heads. Omega is a perfect predictor. The coin flip is tails. Omega appears and asks for $100.
      *   **Standard CDT:** You observe tails. Paying $100 yields -$100. Not paying yields $0. CDT pays $0, losing the $10,000.
      *   **Standard EDT:** You observe tails. Paying $100 is *evidence* that you are the type who pays, which is correlated with getting $10,000. But *since you already have the $10,000* (it's tails), paying $100 just costs you $100 without gaining anything extra. EDT pays $0.
      *   **Resolute Choice (RC):** Tricky application. When would the "plan" be formed? Before the coin flip? If so, the rational plan might be: "If Omega asks for $100 (regardless of coin outcome), pay." Commitment requires paying when asked, even in the tails scenario, because *not* paying would mean you weren't actually committed to the plan, and Omega would have predicted that, denying you the $10,000 in the tails branch. However, RC struggles somewhat with pure *counterfactuals* – the agent in the tails branch *knows* the counterfactual world (heads) didn't happen. Why commit to an action meant to influence a prediction about a non-actual world? The commitment needs to be to influencing *predictors* based on your disposition.
      *   **Updateless Decision Theory (UDT):** The natural fit. Before the coin flip (timelessly), you choose a policy function: `f(observation) -> action`. The inputs could be the coin result and Omega's request. The optimal policy is: `If Omega requests $100, pay $100.` You evaluate this policy: In the heads branch (prob 0.5), you pay $100. In the tails branch (prob 0.5), you pay $100 and receive $10,000. Net: +$4,950. Compare to `If requested, don't pay`: Heads branch: $0; Tails branch: $0 (Omega doesn't pay because it predicted non-payment). Net: $0. The `pay` policy wins. When Omega appears in the *actual* tails branch and requests $100, your fixed policy outputs "Pay $100." You pay. There is no local calculation; you are simply executing the globally optimal function. UDT inherently handles counterfactuals by considering *all* input-output mappings in the global evaluation.

  **Is UDT a Formalization or Descendant of Resolute Choice?**

  *   **Shared Goal, Different Paths:** Both aim to prevent temporal exploitation by advocating commitment to a pre-established course of action against local temptations. In many practical scenarios (like Toxin), they prescribe the same behavior.
  *   **Key Differences:**
      *   **Unit of Agency & Rationality:** This is the most fundamental difference. RC preserves the temporally extended agent with distinct stages bound by rational commitment. UDT dissolves temporal stages into inputs and outputs of a single, timeless function. Rationality in RC governs *intentional commitment*; in UDT, it governs *function optimization*.
      *   **Metaphysics of Time/Self:** RC operates within standard time and personal identity. UDT requires a radically timeless or algorithmic view of the agent.
      *   **Scope & Counterfactuals:** UDT is explicitly designed to handle acausal and counterfactual reasoning (like Counterfactual Mugging, logical uncertainty, simulations) in a way RC struggles with. RC is primarily concerned with *diachronic* consistency within a single causal timeline. UDT's global policy evaluation inherently considers *all* possibilities simultaneously.
      *   **Mechanism of Commitment:** RC's commitment is a normative *duty* of the later self to the earlier self's rational plan. UDT has no "later self" to *be* committed; the output is predetermined mechanically by the chosen function. Commitment in UDT is *designed in*, not *chosen later*.
      *   **Epistemology:** RC allows standard updating; commitment overrides the locally optimal action based on updated beliefs. UDT eliminates dynamic belief updating; "beliefs" are only relevant in choosing the global policy.

  **Conclusion:**

  UDT is **not** merely a formalization of Resolute Choice. While motivated by similar problems of dynamic inconsistency, they make **genuinely different theoretical claims** about the nature of rational agency:

  1.  **RC:** Assumes a temporally extended agent. Rationality involves forming a globally rational plan at an initial node and then **intentionally committing** to executing that plan at later nodes, overriding local incentives. The unit is the **plan-over-time**, bound by rational commitment across temporal stages of the *same agent*. It's a **Kantian solution within standard time**.
  2.  **UDT:** Assumes the agent is fundamentally a **timeless algorithm or function**. Rationality involves selecting a single **global policy** (input-output map) that maximizes expected utility *across all possible experiences/inputs*. There are no "later selves"; there is only the mechanical execution of the function. The unit is the **entire policy function**. It's a **functionalist/algorithmic solution requiring a timeless perspective**.

  UDT is more radical and revisionary. It doesn't just ask agents to commit; it fundamentally redefines the agent *as* a commitment (a fixed policy). While RC can be seen as extending traditional decision theory with a commitment principle, UDT aims to replace its foundations with a policy-first, updateless framework optimized for handling predictors, counterfactuals, and acausal interactions in a way RC cannot easily accommodate. They are distinct responses to overlapping problems, rooted in profoundly different philosophies of agency and time.
