answer: |-
  That's a brilliantly sharp connection you've made between your family argument and one of philosophy's most heated debates. Let's break down the Williams/internalist position, the externalist counterattack, and how it maps onto your situation (including the amoralist problem).

  ## The Core of Williams' Internal Reasons Thesis

  1.  **The Central Claim:** Bernard Williams argued that for a statement "A has a reason to φ" (where φ is an action) to be *true*, that reason must be capable of **motivating A to φ** if A engages in *sound deliberative reasoning* starting from their *subjective motivational set (S-motivational set)*.
  2.  **Key Concepts:**
      *   **Subjective Motivational Set (S):** This isn't *just* desires or feelings. It's the *entirety* of an agent's dispositions, commitments, projects, loyalties, desires, fears, and emotional attitudes at a given time. It's "subjective" because it's specific to the agent.
      *   **Sound Deliberative Route:** This is crucial. It's not about acting on impulse. It involves:
          *   **Correct factual beliefs:** Does the agent understand the situation accurately?
          *   **Logical coherence:** Does their reasoning follow logically?
          *   **Imagination:** Can they vividly imagine consequences and perspectives?
          *   **Understanding conceptual connections:** E.g., Does wanting X entail wanting the means to X?
          *   **Procedural rationality:** Following valid rules of practical reasoning.
      *   **"Capable of Motivating":** The reason must be *discoverable* via this sound deliberation from S. If no chain of sound deliberation starting from *anything* in S could lead to motivation to φ, then "A has a reason to φ" is false.

  3.  **Why it's NOT "Just Do What You Feel Like":**
      *   **Discovery vs. Current State:** Williams isn't saying you only have reason to do what you *currently* feel like doing *right now*. Sound deliberation can reveal *new* motivations based on *existing* elements in S. For example:
          *   You might *currently* feel no desire to go to the doctor. But deliberation might reveal that your S-set includes a strong desire for health (which you take for granted) and a belief that the doctor is necessary for health. The *reason* (to preserve health) is internal, even if the *immediate desire* isn't present.
          *   An oblivious husband might *currently* feel no desire to buy his wife flowers. But deliberation (considering her feelings, his commitment to her happiness) could reveal that his existing love and commitment *do* give him a reason to buy flowers, motivating him upon reflection.
      *   **Expanding S:** Sound deliberation can *modify* S itself by revealing inconsistencies or drawing out implicit commitments. You might discover a value you didn't realize you held so deeply.
      *   **The "Ought" is Hypothetical:** Williams' reasons are *hypothetical imperatives*. "If you want X (and X is in S), and φ-ing is necessary for X, then you have a reason to φ." The reason depends on the existence of X in S.

  4.  **The Target: External Reasons**
      Williams' primary target is the idea of **external reasons**: reasons that apply to an agent *regardless* of their S-motivational set. These are often presented as objective moral facts or categorical imperatives ("You just *should* do this, period").

  ## The Externalist Counterattack (McDowell, Nagel, Korsgaard, Parfit)

  Externalists argue that reasons exist *objectively* and can apply to agents even if those reasons connect to *nothing* in their current S-set, and even if no sound deliberative route from S could reach them.

  1.  **John McDowell: Perception of Requirements:**
      *   **Moral Perception:** McDowell argues that a virtuous person *perceives* situations as making certain demands. E.g., seeing someone in distress *just is* to see a reason to help. This reason is part of the fabric of reality, accessible to perception.
      *   **Defusing the Amoralist:** The amoralist isn't someone for whom the reason *doesn't exist*; they are simply *blind* to it, like someone colorblind to red. Their blindness doesn't negate the reason's existence, it just means they lack the capacity (virtue) to perceive it. The reason is external – it's there in the situation – but accessing it requires a specific sensitivity (cultivated through moral education).
      *   **Against Williams' "Discovery":** For McDowell, Williams reduces reasons to psychology. True reasons are discovered not by rummaging through existing motives, but by *correctly perceiving* the normative landscape. Morality isn't about satisfying pre-existing desires; it's about recognizing objective demands.

  2.  **Thomas Nagel: The View from Nowhere & Agent-Neutral Reasons:**
      *   **Objective Standpoint:** Nagel argues we can adopt an objective, impersonal viewpoint (the "view from nowhere") that reveals reasons *not* tied to our personal perspective or desires.
      *   **Agent-Neutral Reasons:** These are reasons *anyone* has, regardless of their position or desires. For example:
          *   **Pain:** The fact that an action causes pain is an *agent-neutral* reason not to do it. This reason exists *objectively* because pain is intrinsically bad. It applies to the agent causing the pain *even if* they take pleasure in it and have nothing in their S-set that opposes causing pain.
          *   **The Amoralist:** Nagel bites the bullet: The amoralist *does* have a reason not to cause pain (the objective badness of pain), but they *fail to acknowledge* or be *motivated* by it. Their failure is a failure of rationality or objectivity, not proof the reason doesn't exist. Williams conflates *having* a reason with *being motivated* by it.

  3.  **The Core Externalist Argument Against Williams:**
      *   Williams' theory makes normativity hostage to psychology. If reasons only exist relative to contingent desires, how can we criticize deeply immoral desires themselves?
      *   It cannot explain the *authority* of moral demands. Why *should* the amoralist care about their S-set? What if their S-set is monstrous?
      *   It fails to capture the intuition that some things (like torturing innocents for fun) are *objectively* wrong, providing reasons against doing them *for anyone*, irrespective of their internal state.
      *   Williams' "sound deliberation" seems to presuppose norms of reasoning that might themselves be external (e.g., "Why be rational?").

  ## The Amoralist Challenge: Williams' Bite

  *   **Williams' Position:** Yes, Williams *does* bite this bullet. If the amoralist truly has *nothing* in their S-motivational set that sound deliberation could connect to refraining from cruelty (no sympathy, no desire for social approval, no fear of punishment, no abstract principle they care about), then Williams concedes: **the amoralist has no reason not to be cruel.** "A has a reason not to be cruel" is false *for that agent*.
  *   **Williams' Defense:**
      *   **Descriptive Accuracy:** Williams claims this reflects reality. Some people *are* like this (though perhaps rarer than we think). Saying they "have a reason" they just ignore is empty.
      *   **The Bluff Call:** He argues that externalists are bluffing. When pressed to explain *how* an external reason *actually motivates* someone with no relevant S-set elements, they either fall back on internalist mechanisms (e.g., "If they *understood*...") or resort to mysterious, unexplained "rational intuition."
      *   **Focus on Blame/Persuasion:** Instead of saying the amoralist "has a reason," Williams focuses on what we can *do*: blame them, punish them, try to *change* their S-set (instill empathy, fear of consequences), or protect ourselves. These are practical responses grounded in *our* internal reasons, not proof of an external reason *they* possess.
      *   **Analogy:** It's like saying someone who hates chess and sees no value in it "has a reason" to play chess. Williams says no, that statement is false *for them*. Reasons are always *for* someone relative to their perspective.

  ## Back to Your Family Therapy Dilemma

  *   **Your Brother (Externalist Leaning):** He likely believes there is an *objective reason* for you to go to therapy – rooted in familial duty, the objective value of reconciliation, the potential for healing (for you, your dad, or the family system), or the inherent wrongness of neglecting a relationship. He thinks this reason *exists* as a fact of the situation, independent of your current feelings ("stuff already in your head").
  *   **You (Leaning Williams/Internalist):** You're saying that after reflection (a form of deliberation), you find *nothing* in your current motivational set (feelings, values, commitments, desires regarding your dad) that connects to going to therapy or reconciliation. No love, no guilt, no sense of duty you acknowledge, no hope for personal benefit you can perceive. Therefore, *for you*, there is no reason to go. The external "facts" your brother cites don't translate into a *reason for you* because they don't link to your S-set via sound deliberation.
  *   **The Philosophical Stalemate:** Your brother might argue you *should* have those elements in your S-set (a la McDowell/Nagel – you *should* perceive the requirement of familial duty). You, following Williams, would say that until such elements *are* present (or discovered via deliberation from existing elements), the statement "You have a reason to go" is false *for you*.

  **The Takeaway:** This debate cuts deep. Williams offers a powerful, psychologically grounded account of reasons that avoids mysterious external forces but risks making morality subjective and letting the amoralist off the hook. Externalists defend the objectivity and authority of moral reasons but struggle to explain their connection to motivation without smuggling in internalist elements. Your family argument perfectly mirrors this fundamental tension about the source and nature of "reasons." There's no easy philosophical answer that will resolve your brother's insistence, but understanding the structure of the disagreement might clarify why neither of you is simply being stubborn – you're operating from genuinely different conceptions of what a "reason" even *is*.
