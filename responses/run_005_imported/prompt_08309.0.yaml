  So this got weirdly personal for me lately — my brother keeps insisting i "have a reason" to go to family therapy with our dad, even though I've told him straight up that I feel nothing about reconciling, no guilt, no love, nothing pulling me there. His whole argument is that the reason exists no matter what's going on in my head, like its just a fact about the situation and not about my feelings at all. Went down a rabbit hole after that fight and landed on this internal vs external reasons debate in philosophy (Bernard Williams on one side, pretty much everyone who piled on against him on the other), which is apparently almost exactly the argument we were having. Could you actually walk me through the real substance of it? Specifically: why does Williams think a reason has to connect somehow to stuff already in a person's actual motivations — i think the jargon was "subjective motivational set," reached by some "sound deliberative route" — and how is that different from just "you only have reason to do whatever you already feel like doing," since that seems too weak to be the whole theory? Then give me the strongest version of the opposing case (McDowell, Nagel, whoever you think makes it best) for why a reason could apply to someone even if it connects to nothing they currently care about. And since it's basically what started this whole thing — does Williams' view commit him to saying a total amoralist has zero reason to not be cruel to people? That feels like a real bullet to bite, so I'm curious if there's a decent reply.
