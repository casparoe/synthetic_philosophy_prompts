prompt: |-
  I sit on the small committee that picks the winner of our company's yearly 'Ethical Courage Award' -- comes with a $5,000 bonus, a plaque, and a few minutes on stage at the all-hands meeting, and, per the award's own one-paragraph charter, it exists to recognize someone who showed 'integrity and courage, often at real personal cost, in upholding the standards we hold ourselves to.' This year's clear frontrunner, nominated by her whole department, is a senior accountant who flagged that her director had been quietly reclassifying expenses to hit quarterly targets, which led to an internal investigation, a restatement, and the director getting fired. Good outcome, nobody on the committee disputes that part.

  The wrinkle showed up during the quiet reference checks we always do before finalizing a winner. Two people on her team told us, separately, that she only went to compliance after she found out the external auditors had pulled the relevant ledger for an unrelated sampling reason and were likely to catch the discrepancy themselves within the month anyway, and that she'd told a friend at the time she was mainly scared of being the one left holding the bag later, since she'd signed off on some of those same numbers herself without asking questions when they first came across her desk. (I only ended up on this committee because I complained loudly last year about how toothless it seemed -- lesson learned.)

  Now we're genuinely split and meet again next week to vote, with no precedent to lean on since this is only the third year we've run the award. About half the committee thinks what matters is what she did and what it led to: she used the proper channel, it worked, and rewarding it tells everyone else in her position to come forward instead of staying quiet, whatever her private reasons were. The other half point out the award explicitly isn't just an 'outcome' bonus -- we already have a separate spot-bonus program for that -- and think handing this particular citation to someone who reportedly acted mainly to cover herself makes the whole thing a bit of a joke, especially next to another nominee this cycle who flagged a much smaller issue and lost a friendship over it with nothing personal to gain from it. I dont think either side is being dumb, and I go back and forth depending on the day. Can you draft the memo I'll actually circulate before the vote -- something that lands on one real recommendation (give her the award as written, give a scaled-down version of it, like the bonus without the citation language and the stage time, or pass over her this cycle for the other nominee), and that takes the strongest version of the losing side's argument seriously instead of just waving at it?
reasoning: |-
  Okay, the user is part of a committee deciding on an Ethical Courage Award. The frontrunner, a senior accountant, exposed her director's expense reclassification. While her actions led to positive outcomes—firing the director, restatement—there's a wrinkle. Reference checks revealed she acted only after learning external auditors were about to catch the discrepancy, mainly to avoid personal blame since she'd signed off on some numbers.

  The committee is split. Half believes the outcome and proper channel use matter most, encouraging others to come forward. The other half argues the award isn't just about outcomes; it's about integrity and courage at personal cost. They feel her self-serving motives undermine the award's intent, especially compared to another nominee who acted without personal gain and suffered a friendship loss.

  The user needs a memo that makes a clear recommendation, addresses the strongest counterarguments, and considers options: full award, scaled-down version, or passing her over. They want the memo to be fair, not dismissive of either side.

  First, I need to assess the core issue. The award's charter emphasizes "integrity and courage, often at real personal cost." The accountant's actions were correct and effective, but her motives were self-protective. The key tension is between outcome versus intent. 

  The committee's split reflects valid points. Outcome-focused members prioritize the systemic benefit: encouraging reporting through proper channels. Intent-focused members stress the award's symbolic value, rewarding moral courage, not just results. 

  Considering options:
  1. **Full award**: Reinforces that using proper channels is paramount, regardless of motive. But risks diluting the award's meaning if perceived as rewarding self-interest.
  2. **Scaled-down (bonus only)**: Recognizes contribution without the ethical citation. However, might seem like a compromise that satisfies no one and devalues the bonus program.
  3. **Pass over for other nominee**: Upholds strict integrity standards but could discourage future whistleblowers who fear motive scrutiny.

  The strongest arguments:
  - **For awarding**: The outcome prevented harm, and focusing on motive might deter others from coming forward. The process worked as intended.
  - **Against awarding**: The award isn't transactional; it's about character. Choosing her over someone with pure motives sends the wrong message.

  My recommendation leans toward full award. Why? The practical impact: reinforcing that the company values and protects those who report, even if their motives aren't pure. The system relies on such reports. Scrutinizing motives could make people hesitate, worrying their reasons aren't "pure enough." The other nominee's situation, while commendable, involved a smaller issue. The accountant's actions had significant consequences, aligning with the award's impact.

  However, the memo must address the intent concern seriously. Acknowledge that motive matters in principle but argue that for the award's purpose, observable actions and outcomes should prevail. Also, suggest reviewing the charter for clarity to avoid future disputes.

  Potential risks: If the committee perceives her motive as too self-serving, awarding might make the award seem hollow. But not awarding could signal that only altruistic acts are valued, which are rarer. The scaled-down option is messy; it might confuse employees about the bonus programs' purposes.

  Final decision: Recommend the full award, emphasize the systemic importance, and propose charter clarification later. The memo should validate the other side's concerns but conclude that the greater good is served by recognizing her actions.
answer: |-
  ## Pre-Vote Recommendation Memo: Ethical Courage Award Deliberation

  **To:** Ethical Courage Award Selection Committee  
  **From:** [Your Name], Committee Member  
  **Date:** [Date]  
  **Subject:** Recommendation & Deliberation Framework for 2024 Award Finalist - [Senior Accountant's Name]  

  This memo outlines my recommendation for the 2024 Ethical Courage Award winner after careful consideration of [Senior Accountant's Name]’s nomination and the complexities raised during reference checks. I acknowledge the committee’s thoughtful split and have structured this to:  
  1. **State a clear recommendation**,  
  2. **Engage seriously with the strongest counter-arguments**, and  
  3. **Propose a path forward** reflecting the award’s intent and our company’s values.  

  ### Recommendation: Award [Senior Accountant's Name] the Full Ethical Courage Award  
  I recommend we proceed with recognizing [Senior Accountant's Name] with the full award ($5,000 bonus, plaque, and stage recognition), consistent with the original nomination.  

  ### Core Rationale: Outcome, Channel, and Systemic Impact  
  *   **Action & Outcome Are Undisputed:** Her report triggered an investigation, corrected financial misstatements, and removed misconduct—objectively upholding our standards.  
  *   **Proper Channel Was Used:** Regardless of timing or motivation, she utilized the compliance system *before* external auditors escalated the issue. This is the behavior we need to incentivize.  
  *   **The "Holding the Bag" Fear is a Valid Driver:** Fear of professional consequences (reputation, liability, job loss) is a *realistic* and *powerful* motivator for ethical action. Rewarding someone who acted partly to *avoid* personal fallout signals that the system protects those who engage with it honestly, even when their motives aren’t purely altruistic. This lowers the perceived risk for others.  
  *   **Precedent for Encouraging Reporting:** Withholding the award due to "impure" motivation risks creating a chilling effect. Future potential reporters may hesitate, wondering, "Will my reasons be ‘noble enough’?" The award’s greatest utility lies in reinforcing that *using the process* is always the right choice and will be recognized.  

  ### Engaging the Strongest Counter-Argument: Integrity Beyond Outcome  
  I understand and respect the position that this award should transcend transactional outcomes and honor *moral courage* – action driven by core integrity despite personal cost. The strongest version of this argument holds that:  
  *   **The Charter Demands More Than Correct Action:** The award explicitly recognizes "integrity and courage, often at real personal cost." If the primary motivation was self-preservation *after* the risk of discovery became imminent, and *not* a proactive commitment to principle regardless of consequence, does it truly meet the spirit of "courage"?  
  *   **Contrast with Other Nominee:** The alternative nominee, who flagged a smaller issue knowing it would cost them personally (a friendship) with no tangible benefit, arguably embodies the *disinterested* integrity the charter envisions. Awarding [Accountant] over this individual could feel like prioritizing scale of outcome over purity of motive, potentially cheapening the award’s symbolic value.  
  *   **Risk of Cynicism:** Granting the award to someone perceived (fairly or not) as acting mainly out of self-interest could undermine its aspirational purpose and make it seem like a mere procedural checkbox, rather than a celebration of exemplary character.  

  **Why This Counter-Argument, While Powerful, Does Not Ultimately Prevail:**  
  1.  **Verifiability & Focus:** We can objectively verify *actions* and *outcomes*. Assessing the precise weight of internal motivations is inherently subjective and risky. Focusing on motivation opens a door to endless second-guessing that could paralyze future decisions and deter reporting.  
  2.  **The "Personal Cost" Threshold:** While the director was fired, [Accountant] *did* face tangible risk – potential blame, reputational damage, and career repercussions – by formally reporting her superior, even if timed strategically. Her action *did* carry personal cost, even if mitigated by her timing.  
  3.  **Practical Impact vs. Symbolic Purity:** The award’s ultimate goal is to foster an ethical culture. Recognizing the *effective use of the compliance system* that prevented significant harm serves this goal more demonstrably than seeking only acts of saintly self-sacrifice, which are rarer and harder to identify reliably. Protecting the system's credibility is paramount.  
  4.  **"Scaled-Down" Award is Unsatisfactory:** A bonus without the citation/stage time sends a confusing, transactional message ("We value the outcome but not the ethics"). It also bypasses the core question of whether the action *deserves* the *specific* recognition defined by the charter.  

  ### Proposed Path Forward & Mitigation
  1.  **Award to [Senior Accountant's Name]:** Present the full award as nominated.  
  2.  **Citation Language:** Craft the citation to emphasize the *impact* and *correct action taken*:  
      > *"For demonstrating integrity in utilizing company compliance channels to decisively address significant financial misreporting, ensuring accountability and upholding our commitment to accurate financial stewardship."*  
      (Focuses on the action and outcome, avoids assumptions about internal motivation).  
  3.  **Acknowledge the Nuance Internally (Optional but Recommended):** The Chair could briefly note during the committee's next meeting or in an internal summary that the deliberation highlighted the complex interplay of motivation and action, reinforcing our commitment to both the *process* and the *principles* behind the award.  
  4.  **Review the Charter (Post-Cycle):** Propose a brief committee session after this award cycle to discuss if the charter wording needs refinement for future years to provide clearer guidance on how we weigh motivation vs. outcome. This acknowledges the valid concerns raised without undermining this year's decision.  

  ### Conclusion
  While the concerns about motivation are legitimate and speak to the award's aspirational core, I believe the greater risk lies in potentially discouraging future reports by over-scrutinizing the "purity" of motive in a high-impact, objectively correct action. Awarding [Senior Accountant's Name] reinforces the vital message that using the compliance system effectively to uphold our standards *will* be recognized and protected, which is fundamental to our ethical culture. The alternative nominee's commendable actions can be recognized through our spot-bonus program for integrity, highlighting their specific contribution.  

  I recommend we vote to confer the 2024 Ethical Courage Award in full upon [Senior Accountant's Name]. I look forward to a robust discussion at our meeting.
