answer: |-
  Based strictly on Locke's premises in the *Second Treatise*, he **would not endorse extending the franchise to long-term non-citizen residents**, and his tacit/express consent distinction provides the **principled grounds for excluding them**. However, this case *does* expose significant tensions within his theory of political obligation regarding fairness, consent, and the nature of political society.

  Here's the reasoning, step-by-step, from Locke's own arguments:

  1.  **The Tacit/Express Consent Distinction is Foundational:**
      *   **Express Consent:** This is an explicit act (like swearing an oath of allegiance or explicitly joining a political society) that makes one a *perpetual* member of the "body politic" (Ch. VIII). This membership entails the right to participate in the legislative power (directly or via representatives) – i.e., the franchise (Ch. VIII, XIX).
      *   **Tacit Consent:** This is obligation derived from actions that imply acceptance of the government's authority *while under it*. Locke explicitly identifies these actions: "being within the Territories of that Government" (Ch. VIII), "enjoyment of... any part of the Dominions of any Government" (Ch. VIII), "Lodging only for a Week," or "travelling freely on the Highway" (Ch. VIII). Tacit consent binds one to obey the laws during that enjoyment/residence.
      *   **Crucial Limitation of Tacit Consent:** Locke is emphatic that tacit consent *does not* make one a member of the society: "And to this I say, that every Man, that hath any Possession, or Enjoyment, of any part of the Dominions of any Government, doth thereby give his *tacit Consent*, and is as far forth obliged to Obedience to the Laws of that Government... *during such Enjoyment*, as any one under it; **but yet nothing makes him a Member of that Society**... Nothing can make any Man so, but his actually entering into it by positive Engagement, and express Promise and Compact. **This is that, which I think, concerning the beginning of Political Societies, and that Consent which makes any one a Member of any Commonwealth.**" (Ch. VIII - emphasis added). Tacit consent binds to obedience; only express consent creates membership and franchise rights.

  2.  **Application to Long-Term Non-Citizen Residents:**
      *   By residing long-term, owning property, using roads, and contributing to the upkeep (e.g., paying taxes), these individuals are clearly giving **tacit consent**. They are therefore *obligated* to obey the laws.
      *   However, Locke is explicit that mere residence, enjoyment of the dominion (including property ownership), or contribution (like paying taxes as a condition of residence/property ownership) **does not constitute express consent**. Unless they have performed a distinct, explicit act of consent (like naturalization involving an oath), they remain only tacit consenters.
      *   **Conclusion from Locke's Premises:** Since they are only tacit consenters, they are *not* members of the political society ("the body politic"). Only members have the right to participate in the legislative function (the franchise). Therefore, Locke would *not* endorse extending the franchise to them. Their exclusion is a direct consequence of the fundamental distinction between the *obligation to obey* (tacit consent) and *full membership with political rights* (express consent).

  3.  **Tensions Exposed Within Locke's Theory:**
      This case highlights several potential tensions or weaknesses in Locke's framework:
      *   **Obligation Without Representation:** The core tension is that tacit consenters are *obligated* to obey laws they had no hand in making and have no formal means to change. This directly challenges Locke's foundational principle that legitimate government rests on the "consent of the governed" (Ch. VIII). How can consent be meaningful if it binds people to rules they have no political voice in, *indefinitely*? This resembles the "taxation without representation" critique Locke himself might level against an absolute monarch.
      *   **The Nature of "Contribution":** Locke acknowledges tacit consenters contribute (e.g., through property taxes inherent in ownership). His theory links property protection as a primary reason for entering society (Ch. IX). Yet, those whose property is protected by the state and who contribute to its upkeep are denied the franchise. This creates a tension between the *benefits received* (protection) and *duties imposed* (obedience, contribution) on one hand, and the *denial of political rights* on the other. Is this consistent with his view of government existing for the "peace, safety, and public good of the people" (Ch. IX) if a significant class of people living under it permanently are excluded from defining that "public good"?
      *   **The Indefinite Nature of Tacit Consent for Residents:** Locke suggests tacit consent lasts only "during such Enjoyment" – implying one could leave. However, for long-term residents who have built lives, families, and deep roots in a community, leaving may be practically impossible or involve severe hardship (effectively forced exile). Does this turn tacit consent into a form of *coerced* obligation, contradicting Locke's emphasis on voluntary agreement? His theory doesn't adequately address when prolonged tacit residence might *imply* a stronger form of consent or create a moral claim for inclusion.
      *   **Ambiguity of "Express Consent":** Locke is vague on what precise acts constitute "express consent" beyond vague references to "positive Engagement" and "express Promise." While naturalization ceremonies are a modern equivalent, his lack of specificity makes the boundary between tacit resident and express member potentially arbitrary. Why should an oath alone transform someone from a non-member bound by laws to a full member with rights, especially if they've lived under and contributed to the society for decades?
      *   **The Purpose of Political Society vs. Exclusion:** Locke defines political society as the community formed by express consenters to protect "their Lives, Liberties, and Estates" (Ch. IX). Long-term non-citizen residents also have lives, liberties, and estates protected by that society. Excluding them from the franchise while benefiting from (and contributing to) its protective functions creates a permanent underclass *within* the territory governed by the social contract, potentially undermining the unity and purpose of that society.

  **In Conclusion:**

  Strictly adhering to Locke's explicit distinction, he **would not endorse** voting rights for long-term non-citizen residents. Their obligation stems solely from tacit consent (residence, property, road use), which explicitly *does not* confer membership or franchise rights. Only express consent does that.

  However, **this case powerfully exposes tensions within Locke's theory**:
  1.  The potential injustice of imposing obligations (including obedience and contribution) without corresponding political rights.
  2.  The conflict between the principle of "consent of the governed" and the reality of permanent, obligated residents governed without consenting to the *making* of the laws.
  3.  The ambiguity and potential arbitrariness of the line separating tacit from express consent for deeply embedded residents.
  4.  The question of whether a society excluding long-term contributors from the franchise fully achieves its stated purpose of serving the "public good" of *all* those living under its protection.

  While Locke provides a clear *formal* answer based on his consent categories, the situation of long-term residents highlights how this formalism can lead to outcomes that seem inconsistent with other core Lockean principles – particularly the link between consent, legitimacy, and the protection of rights. This tension remains a central challenge for liberal consent-based theories of political obligation.
