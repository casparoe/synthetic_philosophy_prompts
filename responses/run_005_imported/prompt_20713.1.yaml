  I should check key points: Arrow's conditions (unanimity, non-dictatorship, IIA, unrestricted domain). The range advocate argues cardinal systems escape Arrow because they use utility info. The Arrovian counters that even with cardinal data, aggregation faces similar issues, especially with strategic voting leading to approval-like behavior.

