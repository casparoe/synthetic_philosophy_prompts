prompt: |-
  So a few months back one of our regional managers got caught fudging safety inspection numbers to hit his targets - guy had been there 15 years and always seemed like a total boy scout, so it rattled people. The company formed a task force to figure out what to do going forward, and somehow I got voted onto it even tho I just work in logistics. Half the group wants to spend money on 'integrity' - screening, ethics training, basically 'hire good people and this stops happening.' The other half says thats wishful thinking and wants to redesign the incentive structure and add real oversight instead, pointing to research showing decent people cut corners once the situation pushes hard enough, regardless of who they are deep down - something about seminary students stepping right past a guy slumped in a doorway, on their way to go give a talk about kindness, because they were running late. I have to write the memo going to leadership recommending what we do - it needs an actual recommendation, not a pros and cons list, but it also has to take the 'character still counts for something' side seriously instead of dismissing it. Can you draft that memo?
reasoning: |-
