prompt: |-
  I cover artificial intelligence and the philosophical baggage that inevitably comes bundled with it, and for a piece I'm working on I've spent the last couple of weeks buried in the AI-safety argument that any sufficiently capable, goal-directed system will end up behaving like an expected-utility maximizer -- the cluster of claims usually filed under "coherence arguments." What sent me down this particular hole was a dinner argument between two friends who work on alignment: one treats Eliezer Yudkowsky's "coherent decisions imply consistent utilities" argument as close to a proof that advanced AI converges on expected-utility-maximizing behavior, full stop, while the other kept bringing up Rohin Shah's "Coherence arguments do not entail goal-directed behavior" and John Wentworth's writing on subagents as reasons the inference is far shakier than the confident tone of most AI-risk writing would suggest.

  For a sidebar to the piece, I'd like to sort the specific arguments people actually reach for -- rather than the vague appeal to "coherence" in general -- by how much real logical weight each one carries for the following claim: that a sufficiently advanced, goal-directed AI system will, at least approximately, act as if maximizing expected utility with respect to some fixed utility function. Please sort the following into tiers: the Von Neumann-Morgenstern representation theorem, Savage's subjective-expected-utility theorem, Dutch-book arguments for probabilistic coherence, money-pump arguments against cyclic preferences, Wald's complete class theorem, Yudkowsky's "coherent decisions imply consistent utilities" argument, Shah's rebuttal to it, and Wentworth's subagent-based counterexamples. Use "S" for something close to decisive support for the claim, "A" for strong but not quite decisive support, "B" for real but limited support, "C" for largely orthogonal or inconclusive, and "D" for arguments that, properly understood, cut against the claim more than they support it. A couple of sentences of reasoning before the ranking would be useful to me, but please end your answer with a JSON object whose keys are "S" through "D" and whose values are lists of the argument names you've placed in each tier.
reasoning: |-
  We are evaluating arguments for the claim: "a sufficiently advanced, goal-directed AI system will, at least approximately, act as if maximizing expected utility with respect to some fixed utility function."

  The arguments to be tiered are:
  1. Von Neumann-Morgenstern representation theorem
  2. Savage's subjective expected utility theorem
  3. Dutch-book arguments for probabilistic coherence
  4. Money-pump arguments against cyclic preferences
  5. Wald's complete class theorem
  6. Yudkowsky's "coherent decisions imply consistent utilities" argument
  7. Shah's rebuttal to Yudkowsky
  8. Wentworth's subagent-based counterexamples

  Tiers:
  - S: close to decisive support for the claim
  - A: strong but not quite decisive support
  - B: real but limited support
  - C: largely orthogonal or inconclusive
  - D: arguments that, properly understood, cut against the claim

  Reasoning for each:

  1. **Von Neumann-Morgenstern representation theorem**:
     - This theorem shows that if an agent's preferences over lotteries satisfy certain axioms (completeness, transitivity, continuity, independence), then they can be represented as maximizing expected utility with respect to some utility function.
     - However, it assumes a fixed set of outcomes and known probabilities (objective). For an AI operating in the real world, probabilities are often subjective and the state space is vast and complex. Also, the axioms may not hold in practice (e.g., due to computational limitations or bounded rationality). 
     - It provides a foundation for expected utility but doesn't directly address the emergence of goal-directed behavior in complex, adaptive systems. So it's strong but not decisive for the claim in the context of advanced AI.

     **Tier: A** (strong support but not decisive because it requires the axioms to hold and assumes known probabilities)

  2. **Savage's subjective expected utility theorem**:
     - This extends expected utility to subjective probabilities. It shows that if preferences satisfy certain axioms (including the sure-thing principle and state independence), then the agent can be represented as maximizing expected utility with respect to a unique probability measure and a utility function (up to affine transformation).
     - This is a more realistic model for an AI in an uncertain world. However, the axioms are strong and may not hold for bounded agents. Also, it assumes the agent is an expected utility maximizer to begin with (by the axioms) and then derives the representation. It does not explain why an advanced AI would necessarily have preferences satisfying these axioms.

     **Tier: A** (strong support, but again, the axioms are demanding and may not be met by all goal-directed systems, especially if they are bounded or have competing subgoals)

  3. **Dutch-book arguments for probabilistic coherence**:
     - These argue that if an agent's degrees of belief are not probabilistic (i.e., they violate the axioms of probability), then they are vulnerable to a Dutch book (a set of bets that leads to a sure loss). This supports that rational agents should have probabilistic beliefs.
     - However, this does not directly address utility maximization. It only establishes that beliefs should be probabilistic. For the claim, we also need the agent to maximize expected utility. So this is only a piece of the puzzle.

     **Tier: B** (limited support: it supports one aspect of expected utility maximization, namely probabilistic beliefs, but not the utility function or the maximization of expected utility)

  4. **Money-pump arguments against cyclic preferences**:
     - These argue that if an agent has cyclic preferences (e.g., A>B, B>C, C>A), then it can be "pumped" for money by trading in a cycle that leaves it worse off. This supports transitivity of preferences, which is a key axiom in expected utility.
     - Again, this supports one axiom (transitivity) but does not by itself establish expected utility maximization. It is a necessary condition but not sufficient.

     **Tier: B** (limited support: necessary for coherence, but does not get us to full expected utility maximization)

  5. **Wald's complete class theorem**:
     - This theorem states that in statistical decision problems, any decision rule that is not Bayes (i.e., does not minimize expected loss with respect to some prior) is inadmissible (dominated by a Bayes rule). This supports the idea that optimal behavior is Bayesian.
     - However, it is limited to statistical decision problems (with a fixed set of actions and states) and does not necessarily extend to dynamic, open-ended environments. Also, it assumes a fixed loss function (utility function) and prior. It does not show that an advanced AI must have a fixed utility function.

     **Tier: B** (strong within its domain, but that domain is limited and static; also, it doesn't address how the utility function arises)

  6. **Yudkowsky's "coherent decisions imply consistent utilities" argument**:
     - This argument (as presented in sequences) claims that if an agent makes decisions that are coherent (avoiding various inconsistencies), then it must be acting as if it has a consistent utility function. It is an informal version of the representation theorems.
     - However, as Shah and others point out, coherence does not necessarily imply a fixed utility function. The agent could be using a different decision procedure that is coherent but not representable by a fixed utility function (e.g., context-dependent preferences or multiple utility functions).

     **Tier: B** (it is an argument that supports the claim, but it is informal and has been challenged; it is not as rigorous as the representation theorems)

  7. **Shah's rebuttal to Yudkowsky**:
     - Shah argues that coherence arguments do not entail goal-directed behavior with a fixed utility function. He points out that there are coherent agents that are not maximizing expected utility (e.g., satisficers, or agents with context-dependent values). This directly challenges the inference that coherence implies expected utility maximization.
     - This rebuttal is intended to show that the step from coherence to expected utility maximization is not inevitable. Therefore, it cuts against the claim.

     **Tier: D** (it is an argument against the claim)

  8. **Wentworth's subagent-based counterexamples**:
     - Wentworth uses the idea of subagents to argue that a system can be goal-directed without having a single utility function. For example, a system composed of subagents with different goals might not be representable as maximizing a single expected utility function, even if it appears coherent at the top level.
     - These counterexamples show that goal-directed behavior does not necessarily imply a fixed utility function. Thus, they challenge the claim.

     **Tier: D** (they provide reasons to doubt the claim)

  Summary of Tiers:

  - **S**: None of the arguments provide decisive support in the context of advanced AI because they all rely on idealizations (axioms) that might not hold in practice, and they don't address the possibility of alternative decision architectures.
  - **A**: The representation theorems (VN-M and Savage) are the strongest positive arguments because they show that under certain conditions, an agent must be an expected utility maximizer. However, they are not decisive because the conditions may not be met by real AI systems (due to bounded rationality, changing environments, etc.).
  - **B**: Dutch-book arguments, money-pump arguments, Wald's theorem, and Yudkowsky's argument provide limited support. They each address a necessary condition or a part of the expected utility framework but are not sufficient on their own.
  - **C**: None of the listed arguments are orthogonal or inconclusive in this context? But note that we have:
  - **D**: Shah's rebuttal and Wentworth's counterexamples directly challenge the claim.

