answer: |-
  Your question cuts to the heart of a fascinating debate in moral epistemology. The apparent failure of testimony for *moral* knowledge, compared to its success in domains like science or history, hinges on several key epistemic distinctions attributed to moral facts and our relationship to them:

  1.  **The Autonomy/Understanding Requirement:**
      *   **Argument:** Moral knowledge isn't just about possessing a true belief; it requires *understanding* *why* it's true. This understanding involves grasping the relevant reasons, values, and principles involved. Simply accepting "X is wrong" on authority bypasses the crucial process of engaging with the moral landscape yourself.
      *   **Contrast:** Knowing the boiling point of water via testimony doesn't typically require *understanding* molecular kinetic theory. Knowing a historical date via testimony doesn't require *understanding* the complex socio-political forces at play (though deeper understanding is valuable). The truth can be reliably transmitted without the recipient fully grasping the justification. Morality seems to demand this internal grasp for genuine knowledge.
      *   **Epistemic Distinction:** Moral truths are seen as *essentially reason-involving* in a way that their epistemic status depends on the knower's own rational engagement with those reasons. Testimony transmits the *conclusion* but not the essential *justificatory work*.

  2.  **Action-Guidance and Motivation:**
      *   **Argument:** Moral judgments are intrinsically linked to motivation and action. If you *genuinely know* "I ought to φ," this knowledge provides a reason and motivates you to φ (Internalism about Moral Judgments). Merely accepting "You ought to φ" on testimony might give you a belief, but it may fail to provide the *motivating force* characteristic of first-hand moral understanding. Your action, if performed, might stem from deference, not genuine moral recognition.
      *   **Contrast:** Knowing a scientific fact via testimony (e.g., "This wire conducts electricity") doesn't inherently motivate any specific action. Knowing a historical date doesn't compel you to act in a certain way. The link between belief and motivation is contingent or instrumental, not intrinsic.
      *   **Epistemic Distinction:** Moral facts are *essentially practical*. Their epistemic status is intertwined with their role in guiding rational action. Testimony may transmit the propositional content but fail to transmit the essential practical force, undermining the claim to full moral *knowledge*.

  3.  **The Nature of Justification & Epistemic Sources:**
      *   **Argument:** Moral justification often relies crucially on *first-personal capacities* like empathy, perception of salience (seeing what features are morally relevant in a situation), and practical reasoning. While testimony can *inform* us about situations and arguments, the core justificatory work for a moral judgment often requires *applying* these capacities to the case at hand. Deferring skips this essential justificatory step.
      *   **Contrast:** In science, history, or expertise, testimony often serves as a *proxy for access* to evidence or methods I lack. I trust the geologist's testimony about the rock formation because they have access to specialized tools and training *I don't have*. The evidence is primarily external and shareable via report. In morality, the core "evidence" (reasons, values, empathetic understanding) is arguably accessible, in principle, to any rational agent using their own faculties – testimony isn't needed to bridge an access gap in the same way.
      *   **Epistemic Distinction:** While testimony in other domains often bridges an *access gap* to external evidence, moral justification seems to require the *exercise of internal capacities* that testimony cannot perform *for* the recipient. The epistemic source is fundamentally different.

  4.  **The "Thickness" of Moral Concepts:**
      *   **Argument:** Moral concepts like "courageous," "cruel," or "just" are "thick" – they combine descriptive content (about the world) with evaluative content. Fully grasping these concepts and applying them correctly requires not just knowing a definition but *understanding the evaluative point* of the concept. Testimony might convey the descriptive application ("He ran into the burning building"), but conveying the full evaluative force and its connection to reasons for action is harder through mere assertion.
      *   **Contrast:** Scientific and many historical concepts are primarily "thin" and descriptive. Testimony reliably conveys the descriptive content ("Water boils at 100°C at sea level," "The treaty was signed in 1648").
      *   **Epistemic Distinction:** The evaluative dimension embedded in moral concepts makes their reliable transmission via testimony more complex, as it requires conveying not just a fact, but a *normative perspective*.

  5.  **Objectivity vs. Response-Dependence (Potential Distinction):**
      *   **Argument:** While many moral realists defend the objectivity of moral facts, some argue that moral properties are *response-dependent* – their nature is tied to appropriate human responses (rational approval/disapproval, empathetic concern). If so, knowing a moral fact *requires* having (or being capable of having) the relevant appropriate response. Testimony transmits a belief *about* the response, not the response itself.
      *   **Contrast:** Facts about fundamental physics or distant history are typically seen as response-independent. Their truth doesn't depend on human reactions.
      *   **Epistemic Distinction:** If moral facts are response-dependent in a strong sense, knowing them might inherently require the knower's own capacity for the relevant response, which testimony cannot supply.

  **Important Counterpoints & Nuances:**

  *   **Defenders of Moral Testimony:** Some philosophers (e.g., Robert Hopkins, Philip Nickel, partially Jennifer Lackey) argue that moral testimony *can* be a source of knowledge. They might challenge the strong autonomy requirement, argue that testimony *can* sometimes transmit understanding or motivation, point out parallels with complex non-moral domains, or emphasize the social nature of moral development where learning from others is essential.
  *   **Degrees and Context:** The objection is often strongest against *blind deference* on *complex* moral matters. Testimony might be more reliable for straightforward moral facts ("Torturing babies for fun is wrong") or as a starting point for inquiry. It also plays a crucial role in moral *education*, shaping our sensitivities and capacities.
  *   **Expertise:** While moral "expertise" is debated, most agree some people have better moral judgment due to experience, reflection, or sensitivity. The objection isn't that we shouldn't *listen* to them, but that *uncritically adopting their conclusion* doesn't yield *full moral knowledge* for the recipient; it yields a belief *based on authority*, which lacks the essential justificatory and motivational elements of first-hand moral understanding.

  **In essence:** The epistemic distinctiveness of moral facts, according to the objection, lies in their **essential connection to the knower's own understanding, reasons, motivations, and first-personal capacities (empathy, perception of salience, practical reasoning).** Testimony can reliably transmit *propositional content* ("X is wrong"), but it struggles to transmit the *understanding of the justifying reasons*, the *intrinsic motivating force*, and the *exercise of the first-personal capacities* that are argued to be constitutive of genuine *moral knowledge*. Moral knowledge is seen as inherently *active* and *first-personal* in a way that factual knowledge about the external world often is not.
