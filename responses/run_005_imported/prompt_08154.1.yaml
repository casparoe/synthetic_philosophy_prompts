  First, I need to recall the dualism of practical reason. Sidgwick identified that rational egoism (maximizing one's own happiness) and utilitarianism (maximizing general happiness) are both rational but can conflict. He couldn't reconcile them through reason alone. Now, his psychical research: he co-founded the Society for Psychical Research, investigated mediums, séances, hoping to find evidence for an afterlife. How does this connect to his ethical dilemma?

  The user's core query is whether Sidgwick's empirical pursuits indicate he thought philosophy alone couldn't bridge the gap between duty and self-interest. So, I should explore the implications of his psychical work on his ethical conclusions. 

  Sidgwick's despair over the dualism is well-documented. He saw the conflict as a profound problem. His turn to psychical research might reflect a search for a practical solution. If there's an afterlife with rewards/punishments, self-interest could align with morality. That would resolve the dualism empirically rather than philosophically. 

  The user also wonders if this means Sidgwick doubted philosophical resolution from the start. His psychical research began around the same time he was writing "Methods," so it's possible he was already skeptical. His admission in later writings about the need for non-rational postulates supports this. 

  Key points to address: Sidgwick's personal struggle with the dualism, his view that philosophy had limits here, and how empirical evidence (like an afterlife) could reconcile egoism and utilitarianism. Also, his methodological rigor in psychical research shows he sought scientific validation, not just faith. 

  The user's supervisor dismisses biographical details, but in philosophy, context matters. Sidgwick's actions reveal his deeper concerns about the limitations of his own philosophical conclusions. Highlighting this could strengthen the essay by showing the real-world implications of his theories. 

  Need to ensure the response connects psychical research directly to the dualism. Explain that without empirical evidence, Sidgwick saw no resolution, hence his lifelong search. His work in psychical research wasn't a hobby but a crucial part of addressing the ethical problem he couldn't solve theoretically. 

  Also, mention scholars like Schultz or Broad who discuss this link. Referencing them adds academic weight. Emphasize that Sidgwick's turn to empirical methods underscores his skepticism about resolving the dualism through reason alone. 

