  This is a bit random but we've been covering blame and moral responsibility in my ethics class, and it reminded me of a fight with my sister. She's been on my case about ordering doordash like 5 nights a week, saying its wasteful and bad for my health, except shes literally ordered delivery every night herself for like 3 years. When I called her out on it she just said "I never said I was perfect, that doesnt make me wrong about you tho." Does that comeback actually hold up, or is she still kind of out of line to lecture me about it?
