  The core issue appears to be a lack of "discriminant validity" in the calibration materials. We need to design test cases where key qualities don't correlate. For philosophy essays specifically, I should suggest including: concise but brilliant essays, long but shallow ones, and essays where length and quality intentionally diverge. 

  The user might also appreciate understanding why this happened psychologically. The TA likely internalized length as a heuristic because it was the most visible difference in the samples. Explicit rubrics alone can't override what the examples actually demonstrate. This speaks to the "hidden curriculum" in assessment training.

