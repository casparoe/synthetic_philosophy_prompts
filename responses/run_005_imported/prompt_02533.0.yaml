answer: |-
  You've nailed the core paradox of old evidence and independently reconstructed a major philosophical solution—that's impressive. Your counterfactual fix is essentially the "temporal ignorance" approach (defended by Glymour, Garber, etc.). It *is* the standard way Bayesians handle this, but you're right to suspect it has vulnerabilities. Let's dissect it mercilessly.

  **The Strongest Objection to Your Counterfactual Fix: The Arbitrariness of the Counterfactual Prior**

  The core problem isn't imagining someone who doesn't know *e*—it's deciding **what else that hypothetical agent *does* know**, and thus what their prior `P(e)` should be *before* learning *h*. This is where subjectivity runs wild:

  1.  **"Not knowing e" implies ignorance, but how much?** Should your counterfactual scientist in 1915:
      *   Know *all* physics *except* Mercury's anomaly? (This makes `P(e)` very low, as Mercury was a known anomaly).
      *   Know only the basic data about planetary orbits *except* Mercury's precise precession? (Slightly less knowledge).
      *   Be a blank slate about celestial mechanics, only knowing GR's equations? (Absurdly ignorant, making `P(e)` undefined or meaningless).

  2.  **The confirmation depends *entirely* on this arbitrary choice:**
      *   If the counterfactual agent knows Newtonian mechanics is dominant but can't explain the *full* precession, `P(e | background)` is low. GR predicting `e` then gives a huge boost, confirming GR strongly.
      *   If the agent knows *nothing* about planetary motion, `P(e)` might be moderate (some precession is plausible). GR predicting `e` then gives a smaller boost, confirming GR weakly.
      *   If the agent somehow assigns a *high* prior probability to Mercury's precise anomaly (maybe they believe in Vulcan?), `P(e)` is high. GR predicting `e` might give *no* boost or even decrease confidence (if `P(e|h)` < 1 for some reason).

  3.  **Whose ignorance? Whose knowledge?** Are we imagining *Einstein's* state of ignorance before he knew *e*? The broader physics community's? An ideal rational agent? There's no single "correct" counterfactual. The degree of confirmation becomes relative to a chosen baseline state of knowledge, which isn't objectively defined.

  **In short:** Your fix replaces the problem of old evidence with the **problem of specifying the counterfactual background knowledge (K-).** The confirmation measure `[P(e|h, K-) / P(e|K-)]` is highly sensitive to the arbitrary choice of `K-`. This feels less like a rigorous calculation and more like storytelling where we rig the prior to get the desired confirmation result.

  **Other Objections & Problems with the Counterfactual Fix:**

  1.  **Psychological Implausibility:** It asks us to calculate probabilities based on a state of knowledge we *cannot actually occupy*. Once we know *e*, it's psychologically (and rationally) impossible to truly simulate *not* knowing it and assign a meaningful prior. We're inevitably contaminated by our actual knowledge.
  2.  **The "Learned Before h" Problem:** What if *e* was learned *because* of *h*? Imagine Einstein first derived GR, *then* calculated Mercury's precession, *then* looked up Le Verrier's measurements and saw the match. He never actually *was* in a state of knowing GR but not knowing the Mercury anomaly. Does this make the confirmation weaker? Intuitively, no. But your counterfactual requires a state that never existed.
  3.  **Logical Omniscience Problem (Subtler):** The counterfactual agent must assign `P(e)` without knowing *e*, but *e* might be a complex logical consequence of things they *do* know in `K-`. A logically omniscient agent might already know `e` is true (or highly probable) given `K-`, making `P(e|K-) = 1` or close to it, negating confirmation. We have to assume logical *imperfection*, adding another layer of messiness.

  **Is There a Better Patch? (Spoiler: It's Messy Too)**

  There's no universally agreed-upon perfect solution, but here are alternatives, each with their own issues:

  1.  **De-Idealizing / Ur-Prior Approach (Howson, Others):**
      *   **Idea:** Don't imagine total ignorance of *e*. Instead, consider your *actual* credence function *before* you learned *e*. Calculate how much *learning h later* would have increased your confidence in *e*. The degree to which *h* explains/entails *e* (which was already known) is measured by how much *h* *would have made* `e` *more expected* had you not already known it.
      *   **Mercury Example:** Before you learned about GR (and while knowing the Mercury anomaly `e`), what was `P(e | Newtonian Mechanics + Background)`? Probably low (it was an anomaly). When you learn GR (`h`), you realize `P(e | h + Background) ≈ 1`. The *difference* `[P(e|h, K) - P(e|K)]` (where `K` is your *actual* background knowledge *including e*) is large, indicating that `h` explains `e` well. This difference measures "explanatory power".
      *   **Problem:** It requires accessing your *actual* past credence state, which is often impossible or vague. How confident *were* you in 1910 that Newtonian mechanics would eventually explain the *full* 43 arcseconds? Quantifying this is difficult.

  2.  **The "Remove e from K" Approach (Standard Bayesian "Solution"):**
      *   **Idea:** Formally, temporarily *remove* `e` from your background knowledge `K`, creating `K- = K \ {e}`. Calculate your credence in `e` given `K-` (`P(e|K-)`). Then calculate `P(e|h, K-)`. The boost `[P(e|h, K-) / P(e|K-)]` measures confirmation.
      *   **Problem:** This is essentially your counterfactual fix formalized. It *explicitly* runs into the "Arbitrariness of K-" problem described above. What *exactly* is `K-`? How do you formally remove `e` without altering the rest of `K` in unintended ways? If `K` contained theories that *entailed* `e`, removing `e` might leave `K-` inconsistent or radically different.

  3.  **The "New Explanation" or "No Miracles" Argument (More Pragmatic):**
      *   **Idea:** Forget strict Bayesian updating for old evidence. Focus on the *explanatory power* of `h`. The fact that `h` *deductively yields* a precise, known-but-previously-anomalous fact `e` is a powerful signal that `h` is capturing something true about the world. It resolves a mystery. The "miracle" would be if `h` got `e` right by accident.
      *   **Problem:** This abandons the formal Bayesian framework for confirmation. It's intuitive and matches scientific practice (like the Mercury example), but it doesn't provide a quantitative probabilistic measure. It's more of a justification for why scientists *feel* old evidence confirms, sidestepping the Bayesian formalism.

  **Conclusion: Your Fix is Flawed but Salvageable (and Mainstream)**

  *   **You identified the core problem correctly:** Strict Bayesianism *does* say old evidence (credence=1) can't confirm. The Mercury example *is* a valid challenge.
  *   **Your counterfactual fix ("imagine not knowing e") is the standard Bayesian response.** It *is* logically coherent within the framework.
  *   **The "Arbitrariness of the Counterfactual Prior" is the strongest objection.** It makes the degree of confirmation dependent on a subjective and underspecified choice about background knowledge in the hypothetical state of ignorance.
  *   **There is no perfect, universally accepted solution.** The alternatives (de-idealizing, removing e from K, explanatory power) have significant problems too, often different flavors of subjectivity or practical difficulties.

  **Recommendation:** Embrace your counterfactual fix, but acknowledge its limitations. In practice, for cases like Mercury, there's often a *natural* counterfactual: the state of knowledge of the relevant scientific community *just before* `e` became widely accepted as an anomaly demanding explanation. For Mercury, this was physicists circa 1880-1910 knowing Newtonian mechanics well, knowing the observed precession, knowing attempts to explain it (Vulcan, etc.) had failed, and thus assigning a *very low* probability to the full anomaly being a fluke or explainable by known Newtonian causes (`P(e|K-)` very low). GR then making `P(e|h, K-) ≈ 1` provides a massive boost. While the *exact* prior probability is subjective, the *direction* and *relative strength* of confirmation are robust across reasonable choices of `K-` in such clear historical cases. The problem is thorniest for evidence deeply entangled with background knowledge or where the historical context is less clear-cut. You haven't smuggled in the problem; you've identified the inherent subjectivity in applying probability to complex historical episodes of scientific reasoning. That's not a hole in *your* logic—it's a feature of the world.
