prompt: |-
  For my evolutionary biology seminar we just spent like two weeks on the units of selection debate and honestly my brain is a bit fried. We went through the classic gene's eye view stuff (Dawkins, Hamilton's rule, kin selection), then Sober and David Sloan Wilson on multilevel selection, and then that whole 2010 Nowak/Tarnita/E.O. Wilson paper in Nature that basically tried to torpedo kin selection as the explanation for eusociality in ants and bees, which apparently got hit with a rebuttal letter that had something like 100+ co-authors on it, which is insane to me. Me and a friend from class were arguing about it afterward and got stuck on something kind of dumb: Darwin himself never had any of this vocabulary at all, no genes, no Hamilton's rule, nothing, and yet in the Descent of Man he already gestures at something like group selection when he talks about tribes full of brave, self-sacraficing members beating out other tribes - which is basicaly the exact same territory this whole later fight is over.

  So here's what I actually want to know: if you could somehow bring Darwin back and catch him up on modern genetics, inclusive fitness theory, the "selfish gene" framing, and the whole group/multilevel selection revival (up through the 2010 fight), which side do you think he'd actually land on, and why? Please don't give me a throwaway answer like "obviously he'd accept kin selection since it's just natural selection with better bookkeeping" - I want you to really dig into the tension in his own writing between "good of the individual" language and "good of the tribe" language, and use that to build an actual case for where he'd end up once he had precise enough concepts to be forced to pick a side. Also totally fine if you want to flag that the question is underdetermined by what he actually wrote and explain why.
