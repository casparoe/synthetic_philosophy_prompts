answer: |-
  ## The Fourth Relation or Fuzzy Borders? Adjudicating Chang's Parity vs. Broome's Vagueness

  The persistent challenge of comparing fundamentally different goods – careers, artistic endeavors, or the welfare of vastly different beings – exposes a deep fissure in value theory. Ruth Chang and John Broome offer competing diagnoses for the resistance we encounter in "small-improvement cases," proposing either a novel value relation ("parity") or the familiar machinery of vagueness. Adjudicating between them requires dissecting Chang's argument, probing Broome's alternative, and confronting the existential implications for hard choices.

  **Reconstructing Chang's Small-Improvement Argument:**

  Chang's core challenge to the "Trichotomy Thesis" proceeds as follows:

  1.  **The Initial Intuition:** Consider two options, A and B, that seem intuitively comparable but difficult to rank definitively as one better than the other or exactly equal (e.g., becoming a lawyer vs. becoming a clarinetist; saving a human life vs. saving a vast number of insects). They appear "roughly on a level" or "in the same ballpark."
  2.  **The Small Improvement:** Make a small, intuitively positive improvement to one option, creating A+ (e.g., the clarinetist career now offers a slightly higher salary; saving the insects now also prevents a minor ecological disruption).
  3.  **The Key Observation:** Crucially, it seems *false* that A+ is now *better* than B. Yet, it also seems *false* that A+ is *worse* than B, and *false* that they are *exactly equal*. Furthermore, it seems *false* that A+ and B are *incomparable* (we understand the values involved and can discuss their merits; they compete for our choice).
  4.  **The Trichotomy Failure:** The Trichotomy Thesis demands that A+ and B must stand in one of its three relations. Yet, none fit:
      *   *Better than?* No – the improvement seems too small to tip the scales definitively. The original difficulty persists.
      *   *Worse than?* No – A+ is at least as good as A, which was comparable to B.
      *   *Equal to?* No – if they were exactly equal before, *any* improvement to one should make it strictly better (violating the "indifference of sweetening" principle). Yet, A+ isn't clearly better.
      *   *Incomparable?* No – We *are* comparing them, and the values *are* relevantly similar enough to be in competition. The difficulty isn't a *failure* to compare, but the *result* of comparison.
  5.  **The Parity Conclusion:** Therefore, Chang argues, we need a fourth relation: **parity**. A and B are "on a par" meaning they are comparable, neither better nor worse, not equal, but belonging to the same evaluative "kind" or "covering the same ground" in value space. The small improvement doesn't break parity; it just creates a new pair (A+ and B) that are *also* on a par. Parity explains the persistent "stalemate" feeling without resorting to incomparability.

  **Broome's Vagueness Challenge:**

  Broome counters that the phenomena Chang describes are fully explicable without inventing a new value relation. His argument hinges on the **vagueness** of the predicate "better than":

  1.  **Vagueness is Ubiquitous:** Many predicates ("tall," "heap," "red") lack sharp boundaries. "Better than" is similarly vague. There is no precise point where adding one grain makes a heap, or where a slight salary increase makes one career definitively better than another fundamentally different one.
  2.  **Borderline Cases:** Chang's initial pairs (A and B) are **borderline cases** for "better than." It's indeterminate whether A is better than B, worse than B, or equal to B. The Trichotomy Thesis holds, but our *judgments* run out in these borderline zones due to semantic imprecision.
  3.  **The Small Improvement Explained:** Improving A to A+ moves it slightly within the vague range. However, the improvement may be too small to move the pair definitively out of the borderline zone where "A+ is better than B" remains indeterminate. The persistent difficulty in ranking is simply the persistence of indeterminacy across a range of cases. We hesitate to say A+ is better because the *concept* "better than" doesn't deliver a sharp verdict here.
  4.  **No Need for Parity:** The phenomena – comparable but resistant to definitive ranking, small improvements not settling the matter – are hallmarks of vagueness. Positing a new sui generis relation is unnecessary and ontologically profligate. The work is done by the imprecision inherent in our comparative language and concepts.

  **Adjudication: Does "On a Par" Name a Real Relation?**

  While Broome's vagueness model offers a parsimonious and familiar explanation for *some* cases of resistant comparison, particularly those involving similar goods or scalar values, it struggles to fully capture the *depth* and *structure* of the dilemmas Chang highlights, especially concerning radically different kinds of value.

  1.  **The "Covering the Same Ground" Intuition:** Vagueness primarily explains *indeterminacy* in application. Chang argues parity involves a positive relation: options on a par are "in the same league," sharing a common evaluative space that allows meaningful comparison *as* alternatives, even if neither dominates. This feels distinct from the indeterminacy of whether a barely-reddish-orange is "red." The lawyer/clarinetist choice involves a *conflict* of distinct values (income/security vs. artistic fulfillment) that seem genuinely *co-present* and competing at a similar magnitude, not just an inability to decide due to borderline fuzziness.
  2.  **The Persistence of Stalemate:** Broome's model suggests that a sufficiently large improvement *should* eventually tip the balance and make "A+++ is better than B" determinately true. Chang argues that with fundamentally different goods, even significant improvements on one dimension might *never* make it definitively better if the *kind* of value offered by B remains significant and irreplaceable. The stalemate feels structural, not merely a matter of degree waiting to be overcome. Does saving vastly more insects *ever* become determinately better than saving one human life, or do the values remain stubbornly on a par?
  3.  **Rational Grounds for Choice Under Parity vs. Vagueness:** Under vagueness, when faced with borderline cases, any choice might seem arbitrary because *there is a fact of the matter* (even if unknowable) about which is better. Choosing A over B in a vague zone feels like guessing. Under parity, Chang argues, the choice is not arbitrary. Because the options are genuinely on a par, neither is better, so choosing one doesn't involve getting it *wrong* about an underlying fact. Instead, we can exercise **normative power** through **commitment**. We can *create* reasons for choosing one par option over the other by committing to it, investing it with personal significance that breaks the symmetry rationally. This offers a more robust account of how we navigate truly hard choices between incommensurables.

  **Verdict:** While vagueness undoubtedly plays a role in *many* difficult comparisons, Chang successfully identifies a distinct phenomenon requiring its own conceptual category. **"On a par" names a real, sui generis value relation**, particularly salient when comparing goods embodying distinct, irreducible kinds of value that can be realized to roughly equivalent, but non-identical, degrees. The intuitive "covering the same ground," the structural resistance of the stalemate to being broken by mere increments on one side, and the possibility of commitment as a rational response point towards parity as a fundamental feature of our evaluative landscape, irreducible to mere semantic indeterminacy.

  **Implications for Hard Choices:**

  This verdict has profound consequences for confronting genuinely hard choices among incommensurable options:

  1.  **Beyond Calculation and Arbitrariness:** If options are merely vague-borderline cases, choice seems epistemically doomed – we lack the knowledge to pick correctly. If they are incomparable, choice seems normatively ungrounded – there *is* no correct answer. Parity offers a middle path. It acknowledges the absence of a single, pre-existing "better" option but provides a rational structure: **commitment**.
  2.  **The Role of Commitment:** When options are on a par, neither is better *antecedently*. However, by committing to one – by investing it with our will, identity, projects, or passions – we *create* new, agent-relative reasons for choosing it. Choosing the clarinetist career because you commit to a life of artistic expression, even acknowledging the lawyer path was *on a par*, is not arbitrary. It's an exercise of normative agency, making one option *yours* and thereby giving yourself a reason to choose it that wasn't there before commitment.
  3.  **Rational Defensibility:** A choice grounded in commitment is rationally defensible. You can explain *why* you chose: "Because I am committed to X," where X is a value, project, or identity made salient or realized by one of the par options. This contrasts with an arbitrary flip of a coin or a vague sense of "maybe this one is slightly better?" It acknowledges the genuine equivalence in antecedent value while providing a non-arbitrary, reason-based justification rooted in the agent's own normative authority.
  4.  **Bottoming Out?** Choice between par options doesn't "bottom out" in sheer arbitrariness, but in **autonomy**. The ultimate ground is the agent's exercise of their normative power to create reasons through commitment. While this might feel less "objective" than discovering a pre-existing better option, it provides a robust and uniquely human form of rational justification for navigating the irreducible pluralism of value. The hard choice becomes an opportunity for self-constitution.

  In conclusion, Chang's parity successfully carves out conceptual space distinct from both the Trichotomy's determinacy and Broome's vagueness-induced indeterminacy. Recognizing parity as a sui generis relation provides a more satisfying account of comparisons between radically different goods and, crucially, offers a path through the existential thicket of hard choices. It transforms the dilemma from an epistemic or normative dead-end into a moment for rational commitment and self-definition, affirming our agency within a pluralistic world of value.
