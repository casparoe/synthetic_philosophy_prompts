  Me and my friend Priya got into it last night about moral luck. What set it off: two guys we both vaguely know drove home drunk from the same party on the same night — one just rolled his car into a ditch and felt stupid the next morning, the other hit and killed a cyclist. Priya's whole point was that morally they did the literally identical thing, so its kind of incoherent that one gets to just feel dumb and the other is a criminal for life — it was basically physics that decided which one it was. I said something like "that's the classic moral luck problem, Nagel and Williams both wrote about it," and she said "aren't those basically the same paper," and I realized I couldn't actually answer that. So: lay out how Nagel's version (the resultant/circumstantial/constitutive/causal categories) is actually doing something different from Williams' version (agent-regret, the Gauguin case) — not just "they both published essays called Moral Luck in the 70s." Then, using the drunk driver case specifically, tell me whose framework gives the more honest answer for why it still feels right to judge the one who killed someone more harshly, even though Priya's not wrong that it was arbitrary which one it was.
