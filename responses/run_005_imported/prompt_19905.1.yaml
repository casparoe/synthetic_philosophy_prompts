answer: |-
  Your critique hits on a deep tension in large-worlds decision theory, but ECL proponents have coherent (though subtle) responses. Here's the breakdown of what you're missing:

  ### 1. **ECL Isn't About Changing the Multiverse's Grand Sum**
     - **Your Insight is Correct:** In an infinitely branching multiverse, every possible action *is* taken by some version of "you". The total multiverse outcome distribution is fixed.
     - **ECL's Actual Claim:** Your decision matters for *which branch you inhabit* and the outcomes of agents *correlated with your specific decision process*. You're not changing the multiverse; you're choosing which slice of it you (and your correlated copies) occupy.

  ### 2. **The Indexical Perspective Matters**
     - When you decide, you're asking: "*Which of these pre-existing branches do I, as the deciding agent, find myself in?*" 
     - If you defect, you're *always* in a branch where your correlated allies (who share your decision algorithm) also defect. This leads to worse outcomes *for your reference class*:
       - If you donate to AMF, you're in a branch where your correlated copies also donate → more nets are funded *in your branch cluster*.
       - If you withhold, you're in a branch where correlated copies withhold → fewer nets are funded *in your branch cluster*.

  ### 3. **Correlation ≠ Uniformity**
     - ECL doesn't require that *all* versions of you do the same thing. It exploits statistical correlation between agents using similar decision procedures.
     - **Example:** Imagine 1,000 copies of "you" facing identical AMF dilemmas across the multiverse. If your decision algorithm is deterministic, all 1,000 defect or all 1,000 cooperate. But if your algorithm includes randomness:
       - Cooperation rate might be 70% across all branches.
       - Your specific choice *updates your estimate* of how many correlated agents cooperated. By cooperating, you make it more likely you're in a high-cooperation cluster.

  ### 4. **Consequentialism for Your Reference Class**
     - ECL cares about the welfare of agents who are:
       1. **Causally disconnected from you**
       2. **Correlated with your decision** (e.g., same decision algorithm, similar inputs).
     - When you cooperate, you benefit *that specific group* in the branches where they exist alongside your cooperative choice. Defection harms *that same group*.

  ### Why ECL Advocates Act Like Their Decision Matters:
  - **Local Impact:** Your choice determines outcomes in your branch and correlated branches. While "defect branches" exist, *you* can ensure *your* branch/cluster isn't one of them.
  - **Moral Responsibility:** You're responsible for outcomes linked to *your* decision. The existence of defectors in other branches doesn't absolve you—it's akin to saying "someone else will murder, so my murder doesn't matter".
  - **Updatelessness:** Advanced ECL (e.g., MIRI's work) uses **updateless decision theory**. You commit to a strategy *before* knowing which branch you're in. Cooperation is the strategy that maximizes expected utility *across all branches where your algorithm operates*.

  ### Concrete Example: AMF Donation
  - **Branch A (Cooperation):** You donate. Correlated agents donate. AMF receives $X million → 50k malaria deaths prevented *in this branch cluster*.
  - **Branch B (Defection):** You keep $. Correlated agents keep $. AMF receives $Y << X → 200k deaths *in this cluster*.
  - **Your choice** doesn't change that both A and B exist. But by choosing to donate, you ensure *you* inhabit Branch A, saving lives *in your locality of the multiverse*. The existence of Branch B is irrelevant to *your* moral calculus.

  ### The Hole Partially Plugged
  Your objection highlights a valid intuition: **if correlation is perfect and deterministic**, then in a large world, your action is predetermined. But ECL thrives in scenarios with:
  - **Noisy correlation** (your decision algorithm has randomness)
  - **Partial overlap** (not all "yous" face identical situations)
  - **Uncertainty about reference class** (who exactly is correlated with you?).

  In these cases—which reflect real-world ambiguity—your decision *updates your expectations* about correlated agents, making cooperation instrumentally rational.

  **In short:** ECL matters not because it changes the multiverse's total, but because it changes which *correlated subcommunity* you join, and thus the outcomes for beings who share your fate.
