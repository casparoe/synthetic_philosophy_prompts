  Here’s a draft of your opening remarks—direct, philosophically grounded, and refusing easy outs. It runs about 5 minutes and stakes a clear position while honoring the discomfort and purpose of the gathering:

  ---

  "Good morning. Mara asked me to frame today because I’m an outsider to logic, currently wrestling with Frege as a character—a genius whose meticulous mind coexisted with a monstrous private self. That tension isn’t just novel fodder; it’s sitting with us in this room. Half of you have long known about Frege’s 1924 diary: its anti-semitism, its contempt for democracy, its bitter nationalism. The other half are reeling from the discovery that the architect of *Begriffsschrift* spent his final years crafting poison. Some of you are asking, quietly: *Can we still love the work?*

  It would be comforting to dismiss this as ‘man of his time’ hypocrisy. It would be easy to quarantine the diary in a separate drawer—‘logic here, politics there’—and carry on. But comfort and ease aren’t why we read Frege. We’re here because he demanded rigor. So let’s apply it.

  **Does the diary change how we read the logic? Yes. But not in the way you might fear.**

  It doesn’t invalidate *sense* and *reference*. It doesn’t taint the quantifier or collapse the truth-functional calculus. The structures he built stand. What changes is our understanding of *Frege himself*, and the unsettling lesson he embodies: **The power of abstract reason offers no immunity against moral blindness.** The diary isn’t an irrelevant footnote; it’s a brutal demonstration that the mind capable of unparalleled clarity in one domain can operate in appalling, unexamined darkness in another. Michael Dummett—who *did* have his own profound crisis confronting this—put it starkly: Frege’s philosophical genius and his vile prejudices existed in 'watertight compartments'. That’s not an excuse; it’s a diagnosis of a terrifying human flaw.

  So, no, we don’t get to ‘separate the work’ cleanly. The diary forces us to see Frege whole: the visionary logician *and* the man who failed catastrophically to extend his own demand for precision and justification to his political and ethical convictions. His logic isn’t contaminated, but our *encounter* with it is deepened—and complicated—by knowing that its creator compartmentalized his intellectual virtues.

  **What does this mean for us, reading him today?** It means we engage with his work *cleareyed*. We can—we must—admire the radical brilliance of *Begriffsschrift* while acknowledging the profound failure in the man who wrote it. We study his logic not to venerate him, but to understand structures of thought that transcend their flawed creator. And perhaps, we hold his example as a caution: rigorous thought, pursued without ethical vigilance or self-reflection, can leave vast, dangerous voids untouched.

  This weekend isn’t about resolving that tension. It’s about working within it. Frege’s logic deserves our sharpest attention. His failure deserves our clear sight. Let’s begin."

  ---

  **Key choices & why:**
  1.  **No False Neutrality:** Explicitly says the diary *does* change our reading (by forcing us to see Frege's compartmentalization as a philosophical problem in itself), but protects the autonomy of the logical work.
  2.  **Dummett as Anchor:** Invoking Dummett (a giant in Frege scholarship who grappled publicly with this) validates the crisis as a *serious philosophical response*, not just emotional discomfort.
  3.  **"Watertight Compartments":** Uses Dummett's precise term to frame the issue, moving beyond vague "man of his time" hand-waving to a specific cognitive/moral failure relevant to Frege's project.
  4.  **Respects Both Groups:** Acknowledges the long-known reality for some, legitimizes the shock for others, and gives both a shared framework: not *whether* to engage, but *how* to engage critically and consciously.
  5.  **Outsider Leverage:** Uses your non-logician status to focus on the *human/philosophical* tension ("genius with monstrous private self") without getting bogged down in technical debates logicians might have.
  6.  **Productive Framing:** Concludes by making the tension itself the productive ground for the workshop – studying the logic *while holding* the knowledge of the failure.
  7.  **Avoids Whitewashing/Trial:** Clearly labels the diary "vile," "poison," and a "catastrophic failure," while firmly stating the logic stands. The "trial" is of Frege's *compartmentalization*, not the attendees.

  This approach honors the discomfort, provides a rigorous (if uncomfortable) lens, and steers the focus back to engaging with Frege's work – now with deeper, more critical awareness. Good luck!
