prompt: |-
  so in my econ class we're doing this little unit on "history of ideas about money" and had to read a chunk of aristotle's Politics, and i am kind of stuck on one part, can you actually help me understand it and not just restate it in easier words lol. heres the bit (book I, ch. 10 i think, this is the translation our teacher gave us):

  "Of the two sorts of money-making, one is a part of household management, the other is retail trade: the former is necessary and honourable, while that which consists in exchange is justly censured, for it is unnatural, and a mode by which men gain from one another. The most hated sort, and with the greatest reason, is usury, which makes a gain out of money itself, and not from the natural object of it. For money was intended to be used in exchange, but not to increase at interest. And this term interest, which means the birth of money from money, is applied to the breeding of money because the offspring resembles the parent. Wherefore of all modes of getting wealth this is the most unnatural."

  ok so i get the basic point, that usury (lending at interest) is bad to him bc money "giving birth" to more money is a fake/gross kind of reproduction. but in that same paragraph he ALSO calls plain retail trade (buying stuff and reselling it for profit) unnatural and says its "justly censured" too. so what im actually confused about: is usury just a worse degree of the exact same sin as retail trade, or is aristotle pointing at an actual difference in kind between the two? like whats different about the "logic" of usury vs the logic of just buying low and selling high, if both count as "unnatural" to him? and does this whole natural/unnatural framing even hold together, or is he basically just assuming a self-sufficient household economy is the "real" baseline and anything past that is automatically corrupt? i have to write a short reflection on this passage for class and dont wanna just repeat the surface-level "aristotle hated usury" thing everyone already knows, so an actual careful answer would help a ton
