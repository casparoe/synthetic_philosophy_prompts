  **Justifications:**  
  - **Move (1)**: Scores **1** (correct but incomplete). Owen accurately states the etiological view's core strength: explaining *why* thermoregulation is the function (not merely an effect) by appealing to selection history. However, it doesn't address novel traits (Nadia's point).  
  - **Move (2)**: Scores **1** (correct insight, overreaching conclusion). Nadia's toxin-flushing example effectively exposes a limitation of strict etiological accounts: novel adaptive effects pre-selection *seem* functional. But claiming causal-role theory *solves* this overlooks its own problems (Owen's next move).  
  - **Move (3)**: Scores **2** (clearly correct critique). Owen identifies two major weaknesses in causal-role theory: (a) system-arbitrariness (e.g., sweating "functions" in odor-signaling systems) and (b) its failure to ground normativity (hyperhidrosis can't be malfunction if function = current causal contribution). These are decisive objections.  
  - **Move (4)**: Scores **-1** (misguided fix). Nadia's "survival/reproduction" restriction is ad hoc without historical grounding (why privilege these goals?). The statistical malfunction definition conflates *typicality* with *normativity*: hyperhidrosis may be statistically atypical but still "works" causally. This doesn't resolve Owen's normativity challenge.  
  - **Move (5)**: Scores **2** (clearly correct). Owen shows Nadia's fixes implicitly rely on history. Survival/reproduction matter *because* they are evolutionarily relevant goals, and thermoregulation is privileged over odor cues *because* of past selection. Statistical typicality reflects historical function, not current causal roles alone.  

  **What the Exchange Leaves Out**:  
  The debate overlooks hybrid approaches (e.g., Karen Neander's "modern selected-effects" theory) that ground functions in *dispositions* for which traits were maintained by selection, allowing novel traits to have functions *if* they contribute to fitness in ways homologous to historical adaptations. It also neglects organizational theories (e.g., Mossio et al.) that define functions via a trait's role in self-maintaining systems, offering normativity without direct history-dependence. Both moves could resolve Nadia's novelty concern while addressing Owen's normativity and arbitrariness objections better than pure causal-role theory.
