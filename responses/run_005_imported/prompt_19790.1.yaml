  Hmm, the user is a PhD student in philosophy of biology and wants me to adjudicate a debate between Owen and Nadia about theories of biological function. They had an exchange in their reading group about selected-effects versus causal-role theories.

  Owen defended the etiological view in move (1), arguing that sweating's function is thermoregulation because of its evolutionary history. I think this is fundamentally sound as a core claim of selected-effects theory, though it's incomplete for new traits. I'll score this highly but note its limitations.

  Nadia countered in move (2) with a toxin-flushing thought experiment involving a new gene variant. Her point about novel traits is strong - it shows the etiological view can't handle functions before selection acts. But her jump to claiming causal-role theory as the solution overlooks its own problems. The example is insightful but the conclusion is too sweeping.

  Owen's reply in move (3) hits two valid weaknesses of causal-role theory: the problem of arbitrary systems and the inability to properly handle malfunction. His hyperhidrosis example effectively shows why current causal contribution alone can't distinguish function from side effects. This is a solid critique.

  Nadia's response in move (4) attempts to fix causal-role theory by restricting systems to survival/reproduction and defining malfunction statistically. While creative, the system restriction feels ad hoc without historical grounding, and the statistical norm doesn't solve the "why this effect?" problem. This is a decent try but ultimately unsatisfying.

  Owen's final point in move (5) is particularly strong - he correctly identifies that Nadia's fixes implicitly rely on evolutionary history anyway. The statistical norm only makes sense because of what was selected for, so history isn't truly avoided. This exposes a deep problem in trying to purge history from function ascriptions.

  The exchange reveals both theories' weaknesses but doesn't address hybrid approaches that combine historical and systemic elements. Philosophers like Karen Neander have developed selected-effects accounts that can handle novel traits through derived proper functions. There are also organizational theories that ground normativity in self-maintenance rather than history. The conversation stops short of these more nuanced solutions.

  I'll score each move based on philosophical merit and argumentative strength, then suggest what's missing in my conclusion.
