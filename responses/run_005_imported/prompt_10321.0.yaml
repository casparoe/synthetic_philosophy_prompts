prompt: |-
  So I've been an admin for my town's community Facebook group (it's got something like 15,000 members at this point, basically the whole town) for about three years now — I got voluntold into it after complaining too much about the last admin — and normally the worst drama we deal with is people fighting over parking spots or lost cats. Lately though it's turned into an actual fight among the mod team itself, and I honestly can't tell who's right, if anyone is.

  We have one rule that just says "no posting misinformation," and it never occured to anybody to spell out what that actually means until two posts blew up in the same week. First one: a woman posted a warning that some guy was going door to door pretending to be from the gas company so he could get into people's houses, said her cousin heard it straight from an actual police officer, sounded completely legit, and she was obviously just trying to look out for people. Except that exact story has apparently been going around every couple of years for over a decade, and nothing was actually happening in our town right then — she'd just been fed an old hoax by someone she had every reason to trust. Second one, same comment thread: a guy replies almost instantly, "nah, that's the fake story that goes round every year," and admits later he had zero idea if it was true this time, he just always assumes it's fake, and this time he happened to be dead right. We've ALSO got a messier third case sitting in the report queue where somebody hedged with "not sure if this is even true but just in case..." about a different rumor that also turned out false, and I don't even know if that one belongs in the same conversation or not.

  Half the mod team wants to give the first woman the standard misinformation warning and leave the guy's comment up, because hey, it was true. The other half of us think that's backwards, since she actually had a decent reason to believe what she posted and he had none at all, he just guessed and got lucky, and if the whole point of the rule is to stop people being careless with claims that spook the entire neighborhood, he's the one who was careless, true or not. Could you write this up as the kind of short memo I'd actually send to the rest of the admin team before we hash this out this weekend? I want it to actually say what we should do about these specific posts instead of just "use your best judgment," and to propose how we should reword the rule itself so we're not refighting this same battle next month — and please don't just wave off the "but he was RIGHT, doesn't that count for something" side of it, because that's genuinely what half my team believes, and they're not being idiots about it.
reasoning: |-
  Okay, the user is an admin for a large community Facebook group facing internal mod team conflict over how to handle misinformation. They need a memo to present before a meeting that resolves two specific cases and proposes a clearer rule. 

  First, let's unpack the core tension: half the mods want to punish the well-intentioned woman who shared a debunked hoax because it was false, while letting the dismissive comment stay since it was accidentally correct. The other half argues intent and impact matter more than technical accuracy - the woman caused panic despite good faith, while the guy's baseless skepticism just happened to be right this time.

  Hmm... the user's real struggle is about defining "misinformation" in community moderation. Is it purely factual accuracy? Or does context like intent, sourcing, and potential harm matter more? The memo must bridge this gap by acknowledging both sides: truth matters, but so does responsible sharing behavior.

  For the specific cases:
  - The woman's post needs gentle removal with education about viral hoaxes. Her warning caused real panic, even with good intent. 
  - The guy's comment should stay but get a mod note about how "blind skepticism isn't helpful" - his accidental correctness doesn't make his approach valuable. 
  - The "just in case" post is trickier. That hedging language might actually model good behavior if paired with verification requests. 

  The rule rewrite should focus on behavior patterns: ban *unverified* urgent claims regardless of intent, while allowing skepticism that cites sources. Key additions: "urgent" warnings need evidence, and "I think this is fake" requires reasoning. 

  Biggest challenge: validating the "but he was right!" camp without endorsing luck. The memo should concede truth matters, but argue the group's purpose is fostering *reliable* information habits - and luck isn't a strategy. Maybe compare it to not rewarding someone who yells "fire!" as a joke during an actual fire.
answer: |-
  Here's a concise memo addressing the core conflict, specific actions for the cases, and a proposed rule rewrite that respects both sides of the argument while prioritizing community safety and responsible sharing:

  ---

  **MEMO: Clarifying "Misinformation" Rule & Handling Recent Cases**  
  **To:** Admin/Mod Team  
  **From:** [Your Name]  
  **Date:** [Date]  
  **Re:** Policy Update & Case Resolutions  

  **1. The Core Conflict: Truth vs. Responsibility**  
  We agree misinformation harms the group, but we’re divided on whether *accuracy alone* determines violations, or if *intent and recklessness* matter equally. Let’s resolve this:  
  - **"He was right" is valid, but not decisive.** Accuracy matters, but rewarding baseless skepticism sets a bad precedent. Our rule should incentivize *responsible* sharing, not luck.  
  - **Good intent isn’t immunity.** Well-meaning posts can still cause panic if unverified.  

  **2. Actions for Current Cases**  
  Based on the above, I propose:  
  - **Original Post (Gas Company Hoax):**  
    **Action:** Remove post + send *educational* warning.  
    **Reason:** Shared urgent, unverified claim causing undue fear. *Intent was good, but impact was harmful.* Warn her about viral hoaxes and the need to verify urgent warnings.  
  - **Comment ("Nah, it’s fake"):**  
    **Action:** *Leave up* but add a Mod Note.  
    **Note:** *"While this comment was accurate, please add sources/reasoning when disputing claims. Baseless skepticism can discourage helpful sharing."*  
    **Reason:** Accuracy alone shouldn’t penalize him, but we shouldn’t endorse low-effort skepticism. The note sets expectation for future behavior.  
  - **"Not sure if true, but just in case..." Post:**  
    **Action:** Remove + gentle reminder.  
    **Reason:** Hedging doesn’t absolve responsibility. Urgent warnings *must* be verified. Suggest: *"Message mods first if unsure; we can help fact-check."*  

  **3. Proposed Rule Rewrite**  
  Our current rule is too vague. Let’s replace **"No posting misinformation"** with:  

  > **"Verify Urgent Claims & Cite Sources When Challenging**  
  > - Do not share unverified warnings about crimes, scams, or public safety risks.  
  > - When disputing a claim, provide evidence (e.g., news link, official statement) or clear reasoning.  
  > - Rumors presented as *questions* ("Has anyone heard about...?") are allowed, but not as warnings ("Alert!").  
  > *Violations may result in removal + educational warning. Repeat offenders face temporary bans.*"  

  **4. Why This Works**  
  - **Addresses both sides:**  
    - Prioritizes *verification* for urgent claims (handles "well-intentioned but wrong" posts).  
    - Requires *evidence-based* skepticism (handles "right by luck" comments).  
  - **Prevents future fights:**  
    - Explicitly bans *unverified* urgent claims regardless of intent.  
    - Allows healthy skepticism but demands substance.  
  - **Focuses on impact:** Targets posts most likely to cause panic or distrust.  

  **5. Next Steps**  
  Let’s discuss this proposal at our meeting. Key questions:  
  - Does the rule clearly separate *urgent warnings* from general discussion?  
  - Are the enforcement actions (warning + note) proportionate?  
  - Should we add a "Fact-Checking Resources" post for common hoaxes?  

  This isn’t about punishing good intent or ignoring truth—it’s about fostering a community where *how* we share information is as important as *what* we share.  

  --- 

  **Key Strengths of This Approach:**  
  - **Acknowledges Validity of Both Sides:** The "he was right" team gets accuracy affirmed, but the rule elevates *substance* over luck. The "intent matters" team gets accountability for unverified warnings.  
  - **Clear Guidance:** The rule explicitly defines high-risk posts (urgent claims) and sets standards for skepticism.  
  - **De-escalates Drama:** Actions focus on education, not blame. The Mod Note on the comment addresses recklessness without punishing correctness.  
  - **Scalable:** Covers future "just in case" posts by requiring verification for urgent warnings.  

  This memo provides a principled middle ground while making enforcement predictable. Good luck with the meeting!
