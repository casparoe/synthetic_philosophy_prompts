answer: |-
  You've pinpointed the core structural similarity beautifully – both arguments expose incoherent agents to guaranteed "loss" (monetary or accuracy-based) regardless of the world state. However, the claim that Joyce's argument offers a genuinely **nonpragmatic** vindication hinges on the *nature of the value* being optimized and its *connection to the core function of belief*. Here's the substantive difference:

  1.  **The Nature of the Value: Pragmatic vs. Alethic (Truth-Conducive):**
      *   **Dutch Book:** The loss is **pragmatic** – money, utility, or some concrete good. The argument demonstrates that incoherence makes you vulnerable to *financial exploitation* by a clever bookie. Rationality (coherence) is justified as a means to *avoid guaranteed concrete harm* in practical interactions.
      *   **Joyce's Argument:** The loss is **epistemic** – inaccuracy, measured by a legitimate scoring rule (like Brier score). The argument demonstrates that incoherent credences are *inherently defective as representations of the world's state* because they are guaranteed to be *less accurate* than some coherent alternative, *regardless of what happens*. Rationality (coherence) is justified as a means to *avoid guaranteed inaccuracy* in representing truth. Accuracy is presented as the *intrinsic goal* of belief itself.

  2.  **The Core Function of Belief:**
      *   **Dutch Book:** Connects rationality to *practical success in betting scenarios*. Beliefs (credences) are treated as prices for bets. Coherence ensures you don't set prices that guarantee a loss in these transactions. The justification is instrumental: coherent beliefs are tools for avoiding bad financial outcomes *in specific interactions*.
      *   **Joyce's Argument:** Connects rationality to *truth-tracking* or *accurate representation*. Beliefs (credences) are treated as *attempts to accurately depict the world*. Coherence ensures your beliefs aren't inherently defective *as representations*. The justification is intrinsic: coherent beliefs are better suited to fulfill the *fundamental epistemic purpose* of belief itself – getting things right. Avoiding inaccuracy isn't a means to a further end (like money); it *is* the end.

  3.  **The Role of the "Adversary" (Bookie vs. Scoring Rule/World):**
      *   **Dutch Book:** Requires an *active, strategic adversary* (the bookie) who exploits the incoherence. The loss is contingent on this specific interaction.
      *   **Joyce's Argument:** Requires no adversary. The guaranteed inaccuracy is a *structural feature* of the incoherent credences themselves, *revealed* by the scoring rule. The scoring rule (like the Brier score) acts as a *measuring stick* for epistemic failure, not an exploiter. The world simply "scores" the credence function based on the actual state. The loss (inaccuracy) is inherent in the relationship between the credences and *any* possible world state.

  4.  **The Notion of "Exploitability":**
      *   **Dutch Book:** Exploitability is **strategic and interpersonal**. The bookie exploits *your willingness to bet at your stated prices*.
      *   **Joyce's Argument:** Exploitability is **structural and impersonal**. The incoherent credence function itself is structurally flawed in a way that guarantees it will be *less accurate* than a coherent alternative *no matter what the world is like*. The "exploit" is performed by reality itself through the lens of the scoring rule.

  **Why Joyce's Argument is Considered Nonpragmatic:**

  *   **It appeals *only* to epistemic values:** Accuracy (closeness to truth) is the *sole* value driving the argument. There is no appeal to avoiding financial loss, practical inconvenience, or social penalties.
  *   **It targets the intrinsic function of belief:** It justifies coherence based on what beliefs are *supposed to do* – represent the world accurately. A belief system that is *guaranteed* to be less accurate than a coherent alternative is failing at its core task.
  *   **It abstracts away from practical action:** While practical action *might* flow from beliefs, Joyce's argument doesn't rely on this connection. It focuses purely on the quality of the belief state *as a representation*, irrespective of how (or if) it's used for decision-making.
  *   **The "Loss" is Epistemic:** Losing accuracy points isn't a pragmatic loss like losing money; it's a direct measure of *epistemic failure*. Scoring rules like the Brier score are designed to be **proper**, meaning they *epistemically* incentivize you to report your true credences because *that's* how you minimize *expected* inaccuracy. This propriety links the structure directly to epistemic rationality.

  **The Crucial Move: From Instrumental Value to Intrinsic Value**

  The Dutch Book shows coherence has *instrumental pragmatic value* (it helps you avoid losing money). Joyce's argument aims to show coherence has *intrinsic epistemic value* (it makes your beliefs inherently better suited to their truth-tracking purpose). The shift is from "Be coherent to avoid being exploited in bets" to "Be coherent because incoherent beliefs are *guaranteed to be worse representations of reality*."

  **Conclusion:**

  You are absolutely right that the *exploitability structure* – guaranteed loss/domination across all possible states – is identical. The substantive difference lies entirely in the *nature of the value being lost* and the *justification for why avoiding that loss constitutes rationality*.

  *   **Dutch Book:** Rationality = Avoiding guaranteed pragmatic loss (money) in betting interactions. **Pragmatic justification.**
  *   **Joyce's Argument:** Rationality = Avoiding guaranteed epistemic failure (inaccuracy) in representing the world. **Nonpragmatic (epistemic) justification.**

  Joyce's argument succeeds as a nonpragmatic vindication *if* one accepts that accuracy (truth-conduciveness) is the intrinsic, defining goal of belief. It replaces the bookie's ledger with the "Book of the World" and shows that incoherent credences inevitably score poorly in it, purely on epistemic grounds. While the structure is analogous, the *value system* it operates within is fundamentally different and non-instrumental.
