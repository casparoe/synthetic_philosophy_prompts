prompt: |-
  So I'm on this small internal committee at work (mid-size logistics company, maybe 800 people) that decides who gets our twice-a-year "Integrity Champion" award. It's basically a certificate plus a $2,000 bonus, but people take it seriously since it gets read out at the all-hands. The policy describing it is like four sentences long and says it goes to whoever reports serious wrongdoing "in good faith, for the right reasons, and at some personal risk to themselves." Nobody ever bothered defining "for the right reasons," because up until now it's always been obvious.

  This cycle's nominee, Dana, reported that her department head was falsifying safety inspection logs, which turned out to be completely true and pretty serious -- it led to real fixes before anyone got hurt. The wrinkle is that Dana was also next in line for that same department head's job, and she got it about a month after he was pushed out. In her nomination statement she says she came forward purely out of concern for the warehouse crew's safety. A couple people on the commitee who've worked with her for years say, off the record, that she'd wanted that promotion for ages and this was obviously her opening. There's genuinely no way for us to settle what was actually going on in her head -- all we've got is her statement, the timing, and a track record that's honestly pretty good.

  Half the committee thinks the motive question is a red herring: the report was true, the danger was real, and turning it in is exactly what someone who cared about the crew would've done, so it doesn't matter what else was mixed in -- she acted on a reason that genuinely justifies the act, full stop. The other half thinks that if the promotion was really doing the motivational work, handing her an "integrity" award basically launders politics as principle, and teaches the next ambitious person exactly the wrong lesson about how to get ahead here. I keep flip-flopping, but I think we're circling around a version of a debate philosophers actually have, about whether acting "for the right reasons" is about the reasons that explain why you did something or just the reasons that would justify doing it. Can you write the short memo I'd bring to our meeting next week? I want it to recommend whether we grant the award, deny it, or grant it with some kind of modification, and I want the reasoning to be something the half of the committee that loses this vote could still walk away thinking was fair.
reasoning: |-
  Okay, let me unpack this user's dilemma. They're on an awards committee at a mid-sized logistics company facing a tricky judgment call about an employee who reported serious safety violations but may have had mixed motives. 

  First, the core tension: Dana uncovered genuine wrongdoing that prevented harm, which perfectly matches the award's stated criteria. But the timing - right before her promotion to the vacated position - introduces doubt about whether "concern for safety" was her sole motivation. The committee is split between those who prioritize outcomes and those who care about purity of intent.

  Hmm... this reminds me of the Kantian vs consequentialist debate in ethics. The user even referenced that philosophical angle. But they need practical guidance, not theory. Their real challenge is making a decision that maintains committee unity and the award's credibility.

  What's clever about their framing: they recognize that whichever way they rule, half the committee will disagree. So the memo needs to emphasize process fairness over being "right." The integrity of the committee itself is at stake here.

  Key considerations popping out:
  - The policy's vagueness around "right reasons" is the root problem
  - They can't psychoanalyze Dana's true motives
  - The safety outcome was objectively good
  - The promotion opportunity creates unavoidable perception issues

  I wonder if... instead of choosing sides, the solution might be to acknowledge both perspectives while leaning on verifiable facts? The report was made in good faith (no evidence it was malicious), it involved personal risk (retaliation concerns), and produced positive results. Speculation about ambition seems irrelevant to the policy's actual wording.

  But the optics matter too. Maybe they should award it while tightening the policy for next cycle? That would honor Dana's action now while preventing future ambiguity. The "losing" side might accept that as a compromise - their concerns get addressed in the policy reform.

  Also noting: the user flip-flopped, which suggests they value nuance. The memo should reflect that balanced approach. No dogma, just clear reasoning grounded in what they can prove.
answer: |-
  **MEMORANDUM**  
  To: Integrity Champion Award Committee  
  From: [Your Name]  
  Date: October 26, 2023  
  Subject: Recommendation for Dana’s Nomination  

  ### I. Recommendation  
  **Grant the award to Dana without modification.**  

  ### II. Core Reasoning  
  Our policy requires three criteria for the award:  
  1. **Good faith**: Dana’s report was accurate and substantiated.  
  2. **Personal risk**: She faced potential retaliation as a subordinate reporting her department head.  
  3. **Right reasons**: This is the disputed criterion.  

  **We recommend focusing on the act’s objective justification and impact**, not unprovable motives. Dana’s report exposed serious safety violations that endangered colleagues and triggered corrective action. The outcome aligns perfectly with the award’s purpose: protecting our people and operations through ethical courage.  

  ### III. Addressing Concerns  
  We acknowledge valid concerns about mixed motives:  
  - **The "motive vs. justification" dilemma**:  
    - **If "right reasons" = subjective intent**: We cannot verify Dana’s private motives. Denying the award over speculation sets a precedent of judging unprovable thoughts, undermining trust in the process.  
    - **If "right reasons" = objective justification**: Dana’s act was *justified* by a compelling ethical reason (safety), regardless of other factors. The policy’s language ("for the right reasons") supports this interpretation by pairing it with observable criteria ("good faith," "personal risk").  
  - **Precedent risk**: Withholding the award implies that an act’s ethical value diminishes if the doer benefits. This could deter future reports from employees who fear their motives will be second-guessed.  
  - **Process integrity**: Awarding Dana upholds our policy’s spirit: rewarding verifiable, high-impact ethical actions. To address concerns about ambiguity, we propose reviewing the policy language post-award (see Section IV).  

  ### IV. Safeguards for the Future  
  To ensure the award retains its meaning and addresses committee concerns:  
  1. **Revise the policy** (next cycle): Clarify that "right reasons" refers to the *objectively justifiable ethical basis for the act* (e.g., safety, honesty, fairness), not exclusive purity of motive.  
  2. **Add nominator guidance**: Require brief statements on how the nominee’s action aligns with company values.  
  3. **Emphasize outcome**: Prioritize demonstrable risk, impact, and good faith.  

  ### V. Why This Is Fair to All Sides  
  - **For the "grant" camp**: Dana’s action meets all policy criteria on observable grounds.  
  - **For the "deny" camp**: We take concerns seriously by committing to policy clarity. This ensures future nominees are evaluated against clearer standards, preventing perceived "motive laundering."  

  ### VI. Conclusion  
  Dana’s report embodies what this award exists to celebrate: an employee risking personal standing to protect others and uphold our values. Granting the award reinforces that integrity is measured by acts and outcomes, not innermost thoughts. We simultaneously strengthen the award’s future credibility by clarifying our standards.  

  **Recommended Vote: Approve Dana’s award.**  

  ---  
  **Key Philosophical Anchor**: This approach adopts a "reasonably justifiable motives" standard (W.D. Ross) – focusing on whether the act *could* be grounded in ethics, not whether it *exclusively* was. It avoids moral guessing games while demanding alignment with company values.
