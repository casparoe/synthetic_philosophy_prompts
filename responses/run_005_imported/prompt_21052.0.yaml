answer: |-
  You've hit on one of the most fascinating and contentious debates in contemporary philosophy of mind/cognitive science. The Clark-Hohwy divergence isn't just philosophical window-dressing; it arises from legitimate tensions *within* the predictive processing (PP) formalism itself, amplified by differing philosophical priorities. Let's break it down technically and conceptually:

  **Core Agreement (The Neutral Formal Base):**
  Both start from the same bedrock: the brain is a hierarchical generative model minimizing variational free energy (VFE). VFE is a bound on "surprise" (negative model evidence). Minimizing it approximates Bayesian inference:
  `F ≈ Surprise = -log P(sensory data | model)`
  This happens through:
  1.  **Perception:** Updating beliefs (posteriors) to better predict sensory input.
  2.  **Action:** Sampling sensory data that better matches predictions (Active Inference).

  **The Source of the Split: Emphasis and Interpretation of Key PP Components**

  1.  **The Nature of the "System" & The Markov Blanket:**
      *   **Hohwy (Internalist/Inferential Seclusion):** Focuses intensely on the *Markov blanket* concept from Bayesian networks. The blanket (sensory states, active states, internal states) defines a boundary. Crucially:
          *   The internal states (model) are *only* statistically coupled to the external world (hidden causes) *via* the sensory states. They have no *direct* access.
          *   The *only* thing the system "sees" is sensory data. *All* cognition is inference about the hidden causes *generating* that data. The world is always inferred, never directly accessed.
          *   **Technical Driver:** The conditional independence enforced by the Markov blanket: `P(External Causes | Internal States) = P(External Causes | Sensory States)`. The internal states only care about the sensory states, not the external causes directly. The brain *is* the internal states within its own Markov blanket. This makes the mind fundamentally "in the head."
      *   **Clark (Extended/Embodied):** Interprets the Markov blanket more *functionally* and *dynamically*.
          *   **Where is the Blanket?** Clark argues the blanket isn't fixed at the skull. It can encompass parts of the body and even tools when they become reliable, well-integrated components of the sensory-motor loop (e.g., a blind person's cane, a mouse cursor).
          *   **Action Loops are Constitutive:** Action isn't just a *consequence* of inference; it's a core *part* of the inference process. By acting to change sensations, the organism actively sculpts the sensory data its model has to explain. The loop (brain-body-environment) *is* the cognitive system.
          *   **Technical Driver:** Active Inference. The equations show action (`a`) is driven by the *same* prediction error minimization as perception: `a` is chosen to minimize `F` *expected* under that action. This deeply entangles the model with the world it acts upon. The "model" isn't just a passive inference engine; it's an active controller embedded in a loop.

  2.  **The Role of Precision (Attention) & Model Boundaries:**
      *   **Hohwy (Internalist):** Precision-weighting (optimizing the "gain" on prediction errors) is a crucial *internal* process. It determines which prediction errors matter *for the internal model*. Even if external resources are used (e.g., a notebook), their *influence* is mediated by internal precision-weighting on the sensory input *from* the notebook. The notebook isn't *part* of the model; it's a source of data *for* the model.
      *   **Clark (Extended):** Precision-weighting can effectively "extend" the model. If an external resource (e.g., a calculator, a well-designed interface) reliably reduces prediction error with minimal internal computation *because* it's been structured to mesh perfectly with the agent's predictions and actions, then it becomes functionally part of the cognitive system. The reliable, low-prediction-error loop *defines* the boundary.

  3.  **"Self-Evidencing" vs. "Leaning on the World":**
      *   **Hohwy (Self-Evidencing):** The core imperative is for the model to *maximize its own evidence* (`P(sensory data | model)`). The model evolves to become a "good explainer" of its own sensory data. This happens entirely *within* the system bounded by the Markov blanket. The world is just the hidden causes *inferred* to make the sensory data likely. The system is fundamentally self-contained in its quest for self-evidencing.
      *   **Clark (Leaning):** While self-evidencing is mathematically correct, it's achieved *efficiently* by exploiting stable structures in the environment. The brain doesn't build a detailed internal model of everything; it *offloads* work onto the body and world. Perception is "cheap" because the world is its own best model, and action lets us query it effectively. The brain is a "controller" for embodied engagement, not just an isolated inference engine.

  **Is the Split Forced by the Formalism? Is it Neutral?**

  1.  **The Formalism *Underdetermines* the Metaphysics:** The core math of VFE minimization, hierarchical models, and Markov blankets *does not* uniquely specify the metaphysical location of the mind. It provides powerful tools for describing processes, but the interpretation of "what counts as the system" is not dictated solely by the equations.
  2.  **The Formalism *Creates Tension*:** It *does* create the tension that Clark and Hohwy exploit:
      *   **Hohwy's Lever:** The Markov blanket *is* a real feature of the probabilistic models used. Conditional independence *is* fundamental. The brain *does* only have sensory data as input. This *strongly suggests* internalism/seclusion.
      *   **Clark's Lever:** Active Inference *is* mathematically integral to PP (not an add-on). Action *is* minimizing expected free energy. Prediction errors *do* drive both perception and action in a unified way. This *strongly suggests* that the cognitive system *must* include the action-perception loop.
  3.  **Where the Formalism Leans (Subtly):**
      *   **Towards Clark on Action:** Active Inference is not optional in PP; it's a core mechanism. Formally, treating action as integral to the inference process blurs the perception/action divide *within the model description*, lending weight to Clark's "leaning" view. Ignoring action makes PP descriptively incomplete.
      *   **Towards Hohwy on Access:** The Markov blanket and the inferential logic *do* strictly imply that the internal model variables never directly access external states, only their sensory consequences. This is a fundamental constraint of the Bayesian brain hypothesis.

  **Conclusion: Framing Over Formalism, But Formalism Enables Framing**

  *   **Not Just Add-Ons:** The disagreement isn't *merely* incompatible metaphysics slapped onto neutral math. It stems from genuine, deep tensions *within* the PP framework about how to interpret the relationship between the formal model, the biological brain, the body, and the world.
  *   **Formalism is Permissive, Not Determinative:** PP provides a powerful language that *allows* both interpretations. Hohwy rigorously emphasizes the inferential seclusion mandated by the Markov blanket and the self-evidencing imperative. Clark rigorously emphasizes the constitutive role of action and the functional extension enabled by reliable sensory-motor loops. Both are coherent readings *of the same equations*.
  *   **Philosophical Commitments Drive Emphasis:** Their prior philosophical leanings shape where they focus:
      *   Hohwy is influenced by a more classical cognitivist/internalist tradition and a strong reading of Friston's "physics of mind."
      *   Clark is influenced by embodied/embedded cognitive science and the extended mind hypothesis.
  *   **PP Favors... Nuance?** If forced, the formalism *slightly* favors Clark's integration of action as fundamental, as Active Inference is mathematically central. However, it *strongly* supports Hohwy's point about inferential access. **The most accurate view might be that PP *dissolves* the traditional inner/outer dichotomy by showing how deeply entangled internal inference and external action are, without fully resolving whether the mind *is* extended or *merely* intimately coupled.** It shows the brain is not a passive mirror of the world, nor is it an isolated engine; it's an active, embodied participant constantly negotiating its boundaries through prediction and action.

  As a software engineer, think of it like defining system boundaries in a complex distributed system. The PP math describes the core communication protocols (prediction error signals) and the core processing units (hierarchical layers). Whether you consider a tightly coupled, low-latency external sensor/actuator (like a robotic hand or a cached database) to be "part of the system" or just "a perfectly reliable external resource" is often a pragmatic design choice, not something absolutely dictated by the protocol spec. Clark argues for the former when the coupling is deep and reliable; Hohwy insists on the latter because the core processing unit only ever gets data packets, never direct memory access to the external resource. The formalism defines the communication rules, not the system architecture diagram.
