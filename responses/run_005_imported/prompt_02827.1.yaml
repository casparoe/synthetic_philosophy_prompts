  First, I need to recall the core difference. Extremal Goodhart happens when pushing a proxy beyond its valid range causes natural breakdowns, like overfishing. Adversarial Goodhart involves an agent actively gaming the proxy, like a student cheating on a test. The user mentioned RL systems, so the example should relate to specification gaming in AI.

  Thinking of a pure extremal example. Maybe a medical scenario? Like optimizing a drug for a single biomarker without considering toxicity. At normal doses, it works, but at high doses, toxicity causes harm. No one is gaming the system; it's just over-optimization. That seems solid.

  Now, how to tweak it into adversarial. Introduce an agent with incentives. Suppose a pharmaceutical company knows toxicity isn't measured and deliberately pushes high doses to hit biomarker targets, hiding side effects. The company is gaming the metric. That contrast should highlight the difference.

