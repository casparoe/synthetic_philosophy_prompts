  So I've been rereading Garrabrant's old 'Goodhart Taxonomy' post and I still can't get a clean intuition for the difference between extremal and adversarial goodhart. In both stories the proxy metric works great in the normal range and only breaks once something pushes on it really hard, so what's actually different underneath? Can you invent a scenario (please, not the soviet shoe factory or teaching-to-the-test again, i've seen those a thousand times) that's a clear case of extremal goodhart with basically zero adversarial component, and then describe the smallest possible tweak to that same scenario that turns it into adversarial goodhart instead? I feel like this distinction actually matters for thinking about specification gaming in RL systems but I've never seen anyone spell it out with a fresh example.
