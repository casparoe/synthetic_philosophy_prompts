  They might also be subtly frustrated with humanities jargon. As a scientist, they value precision, so I should avoid fluff and address their skepticism directly. Their example about race/gender being "merely constructed" might overlook lived reality—important to stress that socially constructed ≠ unreal or easily changed. 

