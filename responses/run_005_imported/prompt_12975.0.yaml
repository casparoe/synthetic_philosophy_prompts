  Okay, I need to carefully analyze this user's query about Aristotle's sea-battle passage. The user and their friend had a heated debate about whether Aristotle is denying bivalence for future contingents or just making a modal scope distinction. The user provided the exact Edghill translation they're working with, which is helpful.

  First, I should recall the key elements of Aristotle's text. The passage clearly states that while "either p or not-p" is necessarily true, neither "p" nor "not-p" is individually necessary when referring to future contingents. Aristotle explicitly says we "cannot say determinately" which disjunct is false and must leave it undecided. This seems stronger than just a scope distinction.

  The user's friend argues this is purely about scope ambiguity - distinguishing "necessarily (p or not-p)" from "(necessarily p) or (necessarily not-p)". But the user points to Aristotle's "cannot say determinately" language as evidence for something more semantic. I need to examine whether Aristotle is committing to truth-value gaps here.

  Looking at Aristotle's phrasing: "it cannot yet be said to be actually true or actually false" strongly suggests a third status. The temporal qualifier "yet" implies the truth-value is indeterminate now but will become determinate later. This goes beyond modal necessity and touches on the ontological status of future events.

  The Master Argument connection is crucial. Aristotle is indeed trying to block fatalism - the idea that if future statements are already true/false, then events are fixed and necessary. His solution appears to be suspending bivalence for future contingents to preserve human agency and contingency. This isn't just logical hair-splitting; it's a metaphysical stance about temporal reality.

  I should address whether the scope distinction alone can resolve this. While it handles the modal aspect, Aristotle's insistence that we "must leave the matter undecided" and his use of "determinately" point to an epistemic or semantic indeterminacy that scope distinctions don't fully capture. He's making a claim about present truth-values, not just future necessities.

  The user seems sophisticated - they're in an ancient philosophy seminar and reference scholastic terminology. They want a deep analysis, not textbook summaries. I'll need to engage seriously with both interpretations while showing why Aristotle's text supports the truth-value gap reading. The Master Argument context is essential for understanding why Aristotle takes this position - it's directly aimed at preventing fatalist conclusions from bivalence.
answer: |-
  Your debate cuts to the heart of interpreting Aristotle's notoriously difficult passage. Let's work through the text step-by-step, addressing your specific questions:

  ### 1. **Does Aristotle Deny Bivalence for Future Contingents?**
     The text strongly suggests a *suspension of bivalence*, not just a scope distinction:
     - **Explicit Language:** "we cannot say determinately that this one or that one is false" and "it cannot yet be said to be **actually true or actually false**" (emphasis added). This phrasing ("actually true/false," "cannot yet be said") isn't merely about necessity; it describes a *present semantic status*. If both were already true/false (but we didn't know *which*), Aristotle could say "one *is* true, one *is* false, but we cannot *know* which." Instead, he says we *cannot attribute* actual truth/falsity *at all* yet.
     - **The "Undecided" Mandate:** "must instead leave the matter undecided" implies the *proposition itself* lacks a determinate truth-value now, not just that we lack epistemic access. If it were merely epistemic, "undecided" would refer to *our judgment*, not the "matter" (the truth-value).
     - **Temporal Qualification:** "it cannot **yet** be said" points to a *change in status over time*. The proposition *will* become true or false when the event occurs/passes, but *now*, for contingent futures, it is indeterminate.

  ### 2. **Is the Scope Distinction (Composite/Divided Sense) Sufficient?**
     Your friend is right that the scope distinction resolves the *modal* part of Aristotle's argument:
     - **Composite Sense (Necessarily (P ∨ ¬P)):** Aristotle accepts this. Excluded Middle holds: "it is necessary that there either will or will not be a sea-battle."
     - **Divided Sense ((Necessarily P) ∨ (Necessarily ¬P)):** Aristotle rejects this for contingents: "it is not necessary that there should be one... nor that there should not be one."

     **However, the scope distinction *alone* doesn't explain:**
     - The "**actually true or actually false**" language. If bivalence held, each disjunct *would* be "actually" true or false *right now*, even if not *necessarily* so. Aristotle denies this present actuality.
     - The "**cannot say determinately**" phrasing. If bivalence held, we *could* say determinately *that* one is true and the other false (even if we don't know which). Aristotle says we *cannot* say this *about the specific disjuncts*.
     - **Aristotle's Point is Stronger:** He's not just saying neither disjunct is *necessary*; he's saying neither disjunct *presently has a truth-value*. The scope distinction handles modality but doesn't address the *semantic status* he explicitly describes.

  ### 3. **The "Cannot Say Determinately" Language & Its Resistance to Scope**
     This phrase is crucial and *does* resist being fully absorbed by the scope point:
     - "Cannot say determinately *which one is false*" implies that *as of now*, there is no fact of the matter *to be determined*. It's not that we lack knowledge of a hidden fact; the fact *doesn't exist yet*.
     - Contrast with Epistemic Uncertainty: If it were only epistemic, Aristotle could say: "One *is* true, one *is* false, but *we* cannot determine which." He avoids this. His language focuses on the *propositions themselves* lacking settled truth ("it cannot yet be said to be actually true or false").
     - **Semantic, not just Modal:** The "determinately" points to the *lack of a present truth-maker*. For a future contingent event, the causal conditions aren't fully settled in the present. There is no present reality *making* "Sea-battle tomorrow" true or false *now*. This is a metaphysical/semantic claim about truth requiring correspondence to actual (present or past) states of affairs.

  ### 4. **Connection to Fatalism & the Master Argument**
     Aristotle's maneuver is **absolutely** a deliberate block against fatalism, anticipating arguments like the later Diodorean Master Argument:
     - **The Fatalist Inference:**
       1. Bivalence: For any future-tensed proposition (Fp), it is *now* either true or false.
       2. If Fp is *now* true, then it is *necessary* that p will happen (and similarly if false, necessary that p won't).
       3. Therefore, all future events are necessary; fatalism is true.
     - **Aristotle's Block:**
       - He rejects premise (1) *for future contingents*. Fp is *neither* true *nor* false *now*.
       - This severs the link between present truth and future necessity. If Fp isn't true *now*, we cannot infer its *future necessity* from its present truth (because it has none). The necessity of the disjunction (Fp ∨ ¬Fp) doesn't imply the necessity of either disjunct.
       - **Preserving Contingency & Agency:** By suspending bivalence *now*, Aristotle preserves genuine openness ("it is not necessary that there should be one tomorrow, nor that there should not be one"). The future event's occurrence or non-occurrence becomes fixed and true/false only *as it unfolds* or *after it happens*, grounded in contingent causes (including human choices) operating in time. This blocks the fatalist inference at its root.

  ### Conclusion: Aristotle's Position
  Aristotle *does* seem committed to a form of **truth-value gap** for genuinely contingent future-tensed statements. While the scope distinction elegantly handles the *modal* aspect (neither disjunct is necessary), it cannot fully account for:
  1. The explicit denial that the disjuncts are "**actually** true or false" *now*.
  2. The directive to leave the matter "**undecided**" (a semantic, not just epistemic, state).
  3. The temporal "**yet**" implying a change in truth-value status over time.

  This semantic suspension of bivalence is **directly motivated** by the desire to block fatalism. Aristotle recognizes that if future-contingent statements *already* possessed a truth-value, the path to inferring their necessity (and thus fatalism) becomes very hard to resist. His solution is radical: deny that such statements have a truth-value *until* the contingency is resolved in time. This preserves both the law of excluded middle (in its necessary, composite sense) *and* genuine contingency in the world.

  **In short:** Your friend is correct that the scope distinction resolves part of Aristotle's argument, but Aristotle goes further. The "cannot say determinately" and "not actually true/false" language commits him to a present *indeterminacy in truth-value* for future contingents, not merely an indeterminacy in modal status or our knowledge. This is his core strategy for defeating fatalism.
