answer: |-
  ## The Only Love Worth Vowing To

  [Raise glass, warm smile] Friends, family, philosophers... and those of you who *wished* you’d majored in something more lucrative... thank you all for being here to celebrate [Sister's Name] and [Partner's Name]. It’s an absolute joy. And [Sister], when you asked *me*, your resident philosophy student, to give this toast, I have to admit… I panicked. Because how do you talk about love at a wedding without just resorting to clichés? Especially when the couple met… arguing about Immanuel Kant in an ethics class! [Laughter]

  Yes, their origin story involves the *Groundwork of the Metaphysics of Morals* and, specifically, that famously grumpy shopkeeper example. You know the one: Kant argues the shopkeeper who’s honest *only* because it’s good for business? No moral credit. The one who’s honest *even when* it might ruin him, purely because it’s the *right thing*? That’s real moral worth. And apparently, their first real conversation was a fiery debate about whether this is bleakly demanding… or somehow deeply admirable.

  [Look at the couple] Now, knowing you two, I can picture it perfectly. [Sister], probably arguing it felt cold, like denying the value of simple kindness. [Partner's Name], maybe defending the nobility of sticking to principle against the current. And honestly? They both have a point. Kant doubles down, you know, saying even the naturally warm-hearted person who just *loves* helping others? Sorry, no moral worth either, if it’s just their happy inclination doing the work. The *only* thing that counts, for Kant, is acting purely *from duty*, from the recognition of the moral law itself. Ouch, right? Seems harsh on the nice shopkeeper and the cheerful helper.

  [Shift tone slightly, more reflective] But here’s the thing that struck me, preparing this toast. Buried in that very passage is a tiny footnote. It’s about love. Kant distinguishes two kinds. First, there’s what he calls “pathological love” – the love you *feel*. It’s spontaneous, warm, wonderful… but ultimately, involuntary. You can’t command yourself to *feel* it. Then, he points to the biblical command, “Love thy neighbour.” *That* kind of love, Kant says, isn’t about feeling. It’s “practical love.” It resides in the *will*, not the heart. It’s the love you *do*, the love you *choose*, the love you *commit* to, regardless of how you happen to feel in the moment.

  [Pause, connect to the couple] And sitting here, thinking about *you two*, about *this* day, about the vows you’re about to make… that distinction stopped being just a dusty footnote. It became the *point*.

  [Address the room] Think about it. When we stand up here and promise “for better or worse, in sickness and in health,” what are we actually banking on? That we’ll *feel* deliriously happy, warm, and fuzzy every single day for the next fifty years? Anyone married longer than a week knows that’s not how life works! Life throws curveballs. There are days you’re exhausted, days you’re frustrated, days the world feels heavy. The warm, fuzzy, “pathological” love? It’s incredible, essential, the spark that lights the fire. But it’s also a feeling, and feelings… they ebb and flow. They can be worn down by stress, by routine, by hardship.

  [Focus back on the couple] *That’s* where Kant’s “practical love” steps in. *That’s* what the vow is *for*. It’s the promise to *choose* love, to *act* with love, to *uphold* the commitment, *especially* when the easy feelings aren’t there. It’s the shopkeeper choosing honesty *even when* it might cost him, because it’s the *principle* of the relationship. It’s showing up, listening, supporting, forgiving – *because you promised you would*, because you recognize the inherent worth of the commitment and the person you made it to. It’s the love that digs in its heels.

  [Answer the core question] So, is a love that needs this kind of commitment, this bedrock of duty, *less* romantic? Does relying on principle somehow cheapen the feeling? I think Kant’s critics, and maybe even [Sister] and [Partner] in their undergraduate debate, worried it might. That it sounds cold.

  But look at it another way. Isn’t the *opposite* actually bleak? To say that love is *only* valid when it’s effortless feeling? That the moment things get hard, or feelings fade temporarily, the love itself is gone? That reduces love to mere weather – unpredictable, uncontrollable, gone with the next storm. *That* seems fragile. *That* seems unworthy of a vow.

  [Warmly, to the couple] What you two found arguing about Kant wasn't just intellectual sparks. You found something much deeper. You found a partnership that understands, implicitly, that the most profound, enduring romance isn't *diminished* by duty – it’s *built* on it. The warm, joyful love you feel for each other – that beautiful "pathological" love – it’s the sunshine that makes the garden grow. But the "practical" love, the commitment you vow today? That’s the trellis, the strong roots, the constant tending that ensures the garden thrives through every season, through droughts and downpours alike. It’s not the backup plan; it’s the foundation. It’s the promise that makes the feeling *safe* to deepen over a lifetime.

  [Sincerely] So, [Sister] and [Partner], you met debating whether doing the right thing purely from principle was admirable or bleak. Today, you show us the answer. You show us that building a life together on that kind of commitment, choosing each other again and again through the power of your wills, fortified by the joy you find in each other… that’s not bleak. That’s the bravest, most profoundly romantic thing there is. That’s the only love truly worth vowing to.

  [Raise glass high] So, to [Sister] and [Partner]: May your days be filled with abundant, joyful, ‘pathological’ love. And may your bond be eternally strengthened by the deep, enduring, ‘practical’ love you vow today – the love that chooses, acts, and endures. Cheers!
