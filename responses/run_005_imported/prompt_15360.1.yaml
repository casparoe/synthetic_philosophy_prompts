answer: |-
  You've pinpointed a crucial and fascinating historical-theoretical hinge. Let's break down the theological argument and then assess the structural parallel with the modern paradox.

  **1. Deconstructing Article XIV's Theological Argument:**

  The Article's core argument hinges on two intertwined pillars: **Arrogance** and **Impiety**, rooted in a specific understanding of God's commands and human nature.

  *   **The Claim:** Teaching that "Works of Supererogation" (voluntary works beyond God's commandments) exist is inherently arrogant and impious.
  *   **The Reasoning:**
      *   **Exhaustive Duty:** God's commandments define the *entirety* of what God requires of humans. There is no "beyond" or "over and above" in terms of *obligation*. To fulfill the commandments is to fulfill one's entire bounden duty to God.
      *   **The Arrogance:** Claiming to perform works "over and above" these commandments implies:
          1.  **Self-Sufficiency:** That one has *actually* fulfilled the base requirements perfectly ("render unto God as much as they are bound to do"). The Reformers, following Augustine and Luther, held that due to Original Sin, humans are *incapable* of perfect obedience on their own. Claiming to have met the baseline is already presumptuous.
          2.  **Surplus Creation:** That one can generate a *surplus* of merit ("more... than... required") that God then "owes" them or can be applied elsewhere. This treats righteousness as a quantifiable commodity humans can produce and God is obliged to recognize.
      *   **The Impiety:** This arrogance fundamentally misrepresents the human-God relationship:
          1.  **Rejection of Grace:** Salvation and righteousness are understood by the Reformers as gifts of grace received through faith in Christ, *not* wages earned by works (Ephesians 2:8-9). Claiming to generate surplus merit denies the *sufficiency* of Christ's sacrifice and grace, implying human effort can add something necessary or valuable that Christ didn't provide.
          2.   **Misreading Human Capacity:** It assumes humans, even in their best efforts, operate from a position of strength and autonomy relative to God. The Article counters this with Christ's dictum: "When ye have done all that are commanded to you, say, We are unprofitable servants" (Luke 17:10).
              *   **"Unprofitable Servants":** This is key. Even perfect obedience (which humans cannot achieve) wouldn't place God in our debt. God, as Creator and Sovereign, has an absolute claim on our entire being and service. Obedience is simply our proper state; it doesn't generate "profit" or "credit" with God. We are always "unprofitable" – our best efforts are simply what we *owe*, not something extra we generously bestow.
          3.  **Undermining the Law's Purpose:** The Law (commandments) primarily reveals human sin and drives us to Christ for grace (Romans 3:20, Galatians 3:24). Framing certain works as "supererogatory" can subtly shift focus towards human achievement and obscure the Law's convicting and grace-pointing function.
      *   **The Catholic Background (Implicit but Crucial):** You are absolutely correct. The "treasury of merit" doctrine (formally defined at the Council of Trent, but developed earlier) is the unspoken target. This doctrine held that Christ and the saints performed works of supererogation, creating a surplus of merit held by the Church (via the Pope) that could be applied (e.g., through indulgences) to others. The Reformers saw this as:
          *   **Theological Error:** Denying the sole sufficiency of Christ's merit and the gratuity of grace.
          *   **Pastoral Abuse:** Leading to practices like the sale of indulgences, creating spiritual hierarchies, and fostering a transactional view of salvation.
          *   **Arrogance Writ Large:** Claiming the Church could quantify, store, and redistribute merit generated by humans (even saints) was the ultimate expression of the arrogance Article XIV condemns.

  **Why "Merely Teaching" is Arrogant/Impious:** It's not just a taxonomic error. To *define* a category of "works beyond duty" is to assert *that such a category exists and is possible for humans*. This very assertion presupposes the flawed theological anthropology (humans capable of surplus merit) and soteriology (salvation/righteousness involving quantifiable human merit) that the Reformers rejected. Teaching the category *embodies* the arrogance and impiety by promoting a false understanding of God, humanity, and salvation.

  **2. Assessing the Structural Parallel with the "Paradox of Supererogation":**

  Your students are remarkably astute. There is a **genuine and profound structural parallel**, though the *contexts* and *driving concerns* differ significantly.

  *   **The Secular Paradox (as articulated by, e.g., David Heyd, or underlying critiques like J.L. Mackie's):**
      *   **Premise 1:** Morality is fundamentally about doing what is best (or at least better) when one can.
      *   **Premise 2:** If an act X is morally better than another available act Y, then X seems rationally/morally required (the "demandingness" worry).
      *   **Problem:** How can supererogatory acts exist? If they are "better," shouldn't they be obligatory? If they aren't obligatory, how can they be "better"? The paradox challenges the coherence of distinguishing "duty" from "good beyond duty."
      *   **Core Concern:** The rational authority of morality, demandingness, and the structure of moral reasons.

  *   **The Reformers' Challenge (Article XIV):**
      *   **Premise 1:** God's commandments define the exhaustive content of moral duty owed to God.
      *   **Premise 2:** Humans, due to sin, cannot even perfectly fulfill this exhaustive duty, and even if they could, it wouldn't generate surplus merit ("unprofitable servants").
      *   **Problem:** How can acts "over and above" God's commandments exist? If they are morally good, they must already be *commanded* (exhaustive duty). If they aren't commanded, they cannot constitute a *moral surplus* meriting reward or transfer. Claiming such acts exist implies either a failure to understand the exhaustive scope of duty or an arrogant belief in human capacity to exceed it.
      *   **Core Concern:** Divine sovereignty, human sinfulness, the gratuity of grace, and the danger of works-righteousness.

  *   **The Parallel:**
      *   **Exhaustiveness of the Normative Standard:** Both arguments posit an exhaustively demanding normative standard (Secular: "Do the best you can"; Reformers: "Fulfill all God's commands"). Any act that seems "better" or "beyond" must either be *required by* that standard or *impossible* to coherently categorize as genuinely "better/beyond."
      *   **The Impossibility of "Surplus":** Both challenge the very *possibility* of a normative "surplus." The secular paradox questions how an act can be better yet optional; the Reformers argue that any good act must fall within duty, and human effort cannot generate a *meritorious* surplus relative to God.
      *   **The Threat to Coherence:** Both see the concept of supererogation as threatening the coherence of the moral/divine framework. For secular ethicists, it threatens the link between "better" and "required." For Reformers, it threatens the understanding of God's law, human obligation, and grace.

  *   **Key Differences:**
      *   **Source of the Standard:** Secular: Reason, Consequentialism, etc. Reformers: Divine Command.
      *   **Anthropology:** Secular: Generally assumes humans *can* sometimes do the "best" or "better." Reformers: Insist humans *cannot* even do the basic duty perfectly without grace.
      *   **Consequence of "Surplus":** Secular: Primarily a conceptual/logical problem for moral theory. Reformers: A dire theological error with soteriological consequences, leading to arrogance and impiety.
      *   **The "Unprofitable Servant":** This Reformers' premise (even perfect duty generates no "profit") has no direct secular equivalent. Secular theories often *do* see doing one's duty as minimally acceptable, leaving room for "better."

  **Your Insight: Have Secular Defenders Answered a Secularized Reformers' Challenge?**

  **Absolutely, yes.** While Urmson and subsequent defenders (like Heyd, Mellema, Ferry, Archer, and others) rarely frame it explicitly in theological terms, the core challenge they grapple with – **how to maintain a category of "good beyond duty" without collapsing it into duty or rendering it incoherent** – is structurally identical to the Reformers' challenge, stripped of its specific theological content (divine command, sin, grace, treasury of merit).

  *   **Secular Strategies Mirror Theological Moves (Unintentionally):**
      *   **Redefining Duty:** Secular defenders often argue for a **less demanding conception of duty** (e.g., minimal obligations, constraints, mandatory goals) to *create space* for the supererogatory. This parallels the Reformers' *exhaustive but non-surplus-generating* duty, but for the opposite purpose: to *allow* for the "beyond." Both agree duty isn't infinitely demanding.
      *   **Emphasizing Freedom/Choice:** Many defenses highlight the **optionality** and **personal sacrifice/investment** inherent in supererogation, arguing that making such acts obligatory would negate their distinctive value (e.g., heroic sacrifice *must* be free). This echoes the Reformers' focus on the *impossibility* of surplus merit, but flips it: the "beyond" is valuable precisely *because* it's freely chosen beyond requirement, not because it creates bankable merit.
      *   **Denying Quantifiable "Surplus":** While not denying the "betterness" of supererogatory acts, secular theories avoid framing them as generating a *quantifiable moral surplus* owed recognition. The value lies in the act itself or the character it displays, not in a ledger entry. This implicitly sidesteps the Reformers' core objection to the *merit-accounting* model inherent in the treasury doctrine.
      *   **Focus on Permissibility vs. Obligation:** Much of the secular debate hinges on distinguishing what is *permissible* (fulfilling duty) from what is *praiseworthy but not required* (supererogatory). This structural distinction – even if the boundaries are contested – is the functional secular equivalent of maintaining the category of "beyond duty" without collapsing it into duty, directly answering the paradox/Reformers' challenge.

  **Conclusion:**

  1.  **Theological Argument:** Article XIV argues that teaching supererogation is arrogant because it implies humans can perfectly fulfill duty *and* generate surplus merit owed by God, and impious because it denies human incapacity (sin), the exhaustive nature of God's commands, the "unprofitable servant" principle (no merit from duty), and the sufficiency of Christ's grace. The Catholic treasury of merit is the clear, unstated target.
  2.  **Structural Parallel:** The parallel identified by your students is genuine and deep. Both the Reformers' challenge and the modern "paradox of supererogation" stem from the tension between an exhaustively demanding normative standard and the conceptual possibility of acts genuinely "beyond" that standard. Both see the category as potentially incoherent within their respective frameworks.
  3.  **Secularized Challenge:** You are correct. Defenders of supererogation in secular ethics from Urmson onward have, in effect, been developing sophisticated responses to a challenge that structurally mirrors the Reformers' objection. Their strategies to carve out conceptual space for the supererogatory – by redefining duty, emphasizing freedom, and focusing on praiseworthiness beyond obligation – function as secular answers to the fundamental question: "How can there be a 'beyond duty' without collapsing into duty or incoherence?" – a question the Thirty-Nine Articles framed in stark theological terms centuries earlier. Highlighting this continuity would be a powerful insight for your seminar, showing how a theological debate profoundly shaped the conceptual landscape of modern moral philosophy.
