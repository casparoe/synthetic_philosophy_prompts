  I recall that in moral philosophy, the debate on epistemic constraints often involves the "reasonable belief" standard. If a soldier reasonably believes their war is just, given their limited information, does that make their participation permissible? McMahan would say no; it's only an excuse. But the user wants to push that it could be a justification.

