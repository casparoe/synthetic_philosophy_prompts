  Also, in McMahan's liability framework, responsibility is tied to culpability or blameworthiness. But if a soldier isn't culpable due to reasonable ignorance, perhaps they aren't responsible for an unjust threat in the way McMahan thinks. This could mean they aren't liable to be killed, bridging back to moral equality.

  The user might be concerned about the practicality of McMahan's view. If soldiers on both sides are considered morally unequal, it could undermine the laws of war, which depend on symmetrical application. By arguing for permissibility under uncertainty, the user seeks a middle ground that acknowledges deep morality while respecting real-world constraints.

  I need to ensure the argument directly challenges the excuse/justification distinction. Emphasize that reasonable belief can transform the moral nature of the act itself, not just the agent's blameworthiness. Use the structure of objective permissibility based on available evidence and the necessity of institutional reliance. Highlight that in contexts of radical uncertainty, following legitimate authority isn't just excusable but the correct moral choice.
answer: |-
  Here’s a targeted argument pushing back on McMahan’s excuse/justification distinction by grounding the *objective permissibility* of unjust combatants’ actions in the epistemic constraints of war, drawing on McMahan’s own liability framework. The core move is to show that under conditions of **radical reasonable uncertainty**, an agent’s **epistemic position** can transform the *objective moral structure* of their act, making it non-wrongful (hence permissible) rather than merely excused:

  ---

  ### The Argument: Permissibility Through Epistemic Non-Culpability in Asymmetric Threat Contexts

  #### 1. **McMahan’s Liability Criterion Requires Responsibility for an *Objective Unjust Threat***  
     McMahan grounds liability in **objective responsibility** for an unjust threat. For combatant A to be liable to defensive harm by combatant B, A must *actually* be responsible for posing an *objectively unjust* threat to B (or others). This is a fact-relative, not belief-relative, condition.

  #### 2. **Responsibility Has an Epistemic Condition**  
     Responsibility for an unjust threat isn’t merely causal; it requires **moral agency undergirded by epistemic access**. One cannot be *objectively responsible* for a wrongful threat if:  
     (a) The wrongfulness of the threat is **unknowable** to the agent given their epistemic position,  
     (b) The agent has taken all **reasonable epistemic steps** to avoid posing an unjust threat, and  
     (c) The agent’s belief in permissibility is **reasonable** (not negligent or willfully blind).  
     *This is implicit in McMahan’s own requirement of "responsibility" (not just causation) for liability.*

  #### 3. **The Battlefield Epistemic Context Makes *Jus Ad Bellum* Judgments Unknowable for Combatants**  
     Given the epistemic realities of war:  
     - **Asymmetric information**: States control intelligence; soldiers receive curated, often false, narratives.  
     - **Expertise gap**: *Jus ad bellum* hinges on complex geopolitical/moral facts beyond a soldier’s training.  
     - **Institutional necessity**: Military function relies on hierarchical trust; individual defiance is systemically punished.  
     - **Time/pressure**: Reflection is impossible; decisions are reactive.  
     - **Reasonable disagreement**: Moral philosophers/statesmen *themselves* dispute *jus ad bellum* (e.g., Iraq 2003).  
     → For a typical soldier, **no reasonable epistemic pathway exists** to access the objective *jus ad bellum* truth.

  #### 4. **Therefore, Unjust Combatants Lack *Objective Responsibility* for Posing an "Unjust Threat"**  
     - If a combatant **reasonably believes** their war is just (due to conditions in §3), and this belief is **non-culpable** (they’ve taken all reasonable steps to discern the truth), then:  
       - They do not **intentionally** pose an *unjust* threat (they act under a putatively just purpose).  
       - They lack **objective moral responsibility** for the threat’s *unjust character*, as its wrongfulness is epistemically inaccessible to them.  
     - The threat they pose is thus **materially unjust but formally just** *from their agential perspective*. Crucially, **moral responsibility tracks the agent’s accessible reasons**, not facts wholly beyond their ken.  
     → They fail McMahan’s *own* criterion for liability (§1), as they aren’t responsible for the *unjustness* of the threat.

  #### 5. **Hence, Their Acts Are Objectively Permissible, Not Merely Excused**  
     - **Against McMahan**: He claims a reasonable mistake excuses but doesn’t justify. But if the combatant isn’t *responsible* for the threat’s injustice (§4), then *there is no objective wrong to excuse*.  
     - **Permissibility follows**: If an agent (i) acts on non-culpable reasonable beliefs, (ii) in a context where better beliefs are inaccessible, and (iii) their act isn’t intrinsically wrongful absent the undiscoverable fact, then **their act is objectively permissible**.  
       - *Analogy*: A surgeon who reasonably believes (via non-culpable error) that amputating your leg saves your life isn’t *excused for battery*; the act is *permissible* given her epistemic position. The hidden fact (no gangrene) doesn’t retroactively make her act wrongful; it negates the *conditions for wrongfulness*.  
     - Applied to war: The combatant’s **reasonable participation** is **objectively justified** because their epistemic position **dissolves their responsibility for injustice**, negating the grounds for liability.

  #### 6. **Recovering Moral Equality (in Practice)**  
     - **Just combatants**: Their threats are *objectively just*, so they retain non-liability.  
     - **Unjust combatants**: Their threats, while *materially unjust*, are **not wrongful *acts*** due to non-culpable ignorance. Thus, they **also** are non-liable.  
     → **Symmetry**: Both classes of combatants, when fighting under reasonable (though possibly false) beliefs of justice, are **non-liable to attack**.  
     - *This is not full moral equality* (just combatants act *better*), but it yields **functional equivalence in liability**: neither may permissibly be targeted *as individuals*.  
     - *Grounding*: This emerges **internally** from McMahan’s liability framework + epistemic constraints, *not* from external institutional pragmatism.

  ---

  ### Why This Blocks "Reasonably Believed Permissible → Merely Excused"
  - **McMahan’s move** treats the objective wrong (killing without liability) as *fixed*, with ignorance merely negating blame.  
  - **This argument** shows that under radical uncertainty, the **objective conditions for wrongfulness** (responsibility for *unjust* threat) are **unmet**.  
    - The unjust combatant’s act **isn’t a wrongful threat** *from the perspective of the deep morality of war* because their non-culpable ignorance vitiates responsibility.  
    - Thus, it’s not that they *shouldn’t be blamed* for a wrong; it’s that **no wrong occurred** in the morally relevant sense (i.e., no *culpable* unjust threat).  
  - **Key distinction**: Excuses apply to *blame for wrongful acts*; justifications negate *wrongfulness itself*. Here, epistemic constraints **justify** by showing the act isn’t objectively wrongful under the true description of the agent’s moral position.

  This preserves McMahan’s core insight (liability tracks objective threats) while taking the *epistemology of responsibility* seriously. It concedes that *if* a soldier *knew* their cause was unjust, they’d be liable—but insists that in the actual fog of war, their non-liability is objective, not merely exculpatory.
