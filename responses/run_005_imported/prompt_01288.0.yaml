prompt: |-
  So last night after our early modern philosophy seminar, me and my friend Alex ended up arguing about Hobbes for like two hours at the pub, and I need a tiebreaker since neither of us is actually a Hobbes specialist. Alex's whole argument was basically: Hobbes was one of the greatest mathematical minds of the 1600s, he literally squared the circle in De Corpore, and that's exactly WHY he was so confident he could build up civil philosophy from a handful of definitions the same way Euclid builds up geometry from axioms — so the argument for absolute sovereignty in Leviathan isn't just persuasive rhetoric, its basically deduced with the same certainty as the Pythagorean theorem. When I brought up that I'd vaguely heard about some beef with a mathematician named Wallis, Alex just said that was some jealous Oxford guy who couldn't handle being shown up by an outsider, and that it doesn't really touch the actual philosophy anyway.

  I don't know enough math history to push back properly but the whole arguement felt off to me, so now I'm trying to sort it out before I see Alex again this week. Is it actually true that Hobbes squared the circle and belongs up there with the great mathematicians of his day? And if the "geometrical method" really did transfer over into Leviathan the way Alex says, does that mean the sovereignty argument really is basically as airtight as a geometric proof, and everyone who's spent centuries picking apart Hobbes's politics is kind of missing the point?
