answer: |-
  You're absolutely right to feel that Alex's argument is "off" – it fundamentally misrepresents both Hobbes's mathematical standing and the nature of his philosophical arguments in *Leviathan*. Let's break this down:

  1.  **Hobbes as a "Great Mathematical Mind" & Squaring the Circle:**
      *   **Hobbes Was Passionate About Math:** True. He was deeply fascinated by geometry, saw it as the paradigm of certain reasoning, and genuinely believed he was making significant contributions.
      *   **Hobbes Squared the Circle in *De Corpore*:** **False, and demonstrably so.** This is the core flaw in Alex's premise. Hobbes *claimed* to have squared the circle (and duplicated the cube) in his 1655 work *De Corpore*. However, his "proofs" contained fundamental errors. He misunderstood key concepts like continuity, infinity, and the nature of irrational numbers.
      *   **The Wallis "Beef" Wasn't About Jealousy:** John Wallis, Savilian Professor of Geometry at Oxford, was not a "jealous Oxford guy." He was one of the preeminent mathematicians of his day (a founder of the Royal Society, co-developer of calculus precursors). Wallis, along with others like Seth Ward, meticulously **demolished Hobbes's mathematical claims**, pointing out the specific errors in his circle-squaring and other attempts. Wallis published multiple critiques (*Elenchus Geometriae Hobbianae*, 1655; *Due Correction for Mr. Hobbes*, 1656; etc.).
      *   **Hobbes's Reaction:** Hobbes, convinced of his own genius, doubled down. He engaged Wallis in a bitter, decades-long public feud, writing increasingly vitriolic and mathematically flawed rebuttals. This wasn't Wallis "showing up" Hobbes; it was a top mathematician patiently (and sometimes impatiently) correcting the persistent errors of an amateur who refused to learn.
      *   **Hobbes's Mathematical Standing:** Hobbes is **not** considered one of the great mathematical minds of the 17th century. He is remembered historically **primarily for his political philosophy**. His mathematical contributions are viewed as:
          *   **Ambitious but deeply flawed.**
          *   **Evidence of his passion for geometry as a method, not mastery of its content.**
          *   **A cautionary tale about brilliant thinkers venturing outside their core expertise without sufficient rigor or willingness to be corrected.** His reputation among mathematicians of his time (and historians since) was severely damaged by the Wallis feud and his refusal to concede error.

  2.  **The "Geometrical Method" in *Leviathan*:**
      *   **Hobbes's *Aspiration*:** Alex is correct that Hobbes *aspired* to build civil philosophy like geometry – starting with clear definitions and deducing necessary consequences. He explicitly states this goal. He wanted political philosophy to achieve the same level of certainty he (mistakenly) believed he had achieved in his own geometry.
      *   **The *Reality* of *Leviathan*'s Arguments:**
          *   **Not Euclidean Deduction:** The arguments in *Leviathan* are **not** rigorous deductions from self-evident axioms in the way Euclid's *Elements* are. While he uses definitions and logical steps, the core premises are **empirical observations and psychological conjectures** about human nature (fear, desire, competition in the state of nature), not mathematical axioms.
          *   **Rhetorical Power:** Hobbes was a master rhetorician. *Leviathan* is a work of immense persuasive power, using vivid imagery (the state of nature as "war of all against all," the Leviathan itself), logical chains, and appeals to fear and reason. This is very different from the austere, purely deductive style of Euclid.
          *   **Contingent Premises:** His starting points ("men are roughly equal in strength and cunning," "the fundamental right of nature is self-preservation," "the state of nature is a state of war") are **contestable empirical claims and value judgments**, not indubitable geometric truths like "a straight line can be drawn between any two points." Their "self-evidence" is debatable.
          *   **The Leap to Absolutism:** Even *if* one accepts his premises about the state of nature and the need for a sovereign, the *necessity* and *absolute nature* of the sovereignty he describes is **not** logically entailed with geometric certainty. Alternative arrangements (like constitutional limits, separation of powers) are conceivable within the framework of providing security – Hobbes *argues* persuasively why he thinks they are inferior or dangerous, but he doesn't *deduce* their impossibility like a Pythagorean theorem.

  3.  **Does the Mathematical Claim Validate the Political Philosophy?**
      *   **No.** This is the critical point. **Even if Hobbes *had* been a brilliant mathematician who squared the circle (which he wasn't), it wouldn't make the arguments in *Leviathan* "airtight" like geometry.**
      *   **Different Domains:** Geometry deals with abstract, timeless, necessary truths about space and quantity. Political philosophy deals with complex, contingent human behavior, motivations, history, culture, and values. Applying a *method inspired* by geometry doesn't magically transform messy human reality into a realm of pure deduction. The *subject matter* resists such treatment.
      *   **The Method is Aspirational, Not Achieved:** Hobbes *used the language and structure* of geometry to lend an *air* of certainty to his political conclusions. But the substance of those conclusions rests on his specific (and debatable) view of human psychology and his historical context (the English Civil War), not on flawless logical deduction from indubitable first principles.

  4.  **Are Critics "Missing the Point"?**
      *   **Absolutely not.** The centuries of engagement with Hobbes prove his immense importance and the power of his ideas. Critics engage with him precisely *because* his arguments are **profound, challenging, and influential, not because they are geometrically certain**. They debate:
          *   The accuracy of his psychological portrait.
          *   The necessity of his absolutist conclusions.
          *   The compatibility of his sovereignty with individual liberty or justice.
          *   The historical and philosophical assumptions underlying his work.
          *   The internal consistency of his system.
      *   **Understanding the *Aspiration*:** Critics *do* understand Hobbes wanted his philosophy to be geometric. But recognizing that aspiration doesn't mean accepting that he achieved it, nor does it invalidate critiques of his actual arguments and conclusions. His *failure* in mathematics ironically highlights the difficulty (perhaps impossibility) of applying true geometric certainty to politics.

  **The Tiebreaker Verdict:**

  *   **Alex is fundamentally wrong about Hobbes's mathematics.** Hobbes did *not* square the circle; his attempts were erroneous and demolished by competent mathematicians (like Wallis, not jealous hacks). He is not considered a great mathematician.
  *   **Alex misunderstands the nature of *Leviathan*.** While Hobbes *aspired* to a geometric method, the work itself is a brilliant but **rhetorically powerful and empirically/philosophically grounded argument**, **not** a set of geometric deductions. Its premises are contestable, and its conclusions are not logically necessary in the way geometric theorems are.
  *   **The "geometric" aspiration does *not* make the sovereignty argument "airtight."** Critics engage deeply and productively with the substance of Hobbes's political thought, which stands or falls on its own merits regarding human nature, power, and the state, not on a misplaced analogy to his failed geometry.

  **What to say to Alex:** Focus on the math first, as it undermines the foundation of their argument. "Look, I dug into it, and Hobbes's circle-squaring was definitively proven wrong by Wallis – it wasn't jealousy, Wallis was the real mathematician correcting major errors. So, even if Hobbes *thought* he was doing geometry like Euclid in *Leviathan*, his own grasp of actual geometry was flawed. More importantly, politics just isn't geometry – his definitions of human nature and the state of nature are starting points he argues *for*, not self-evident axioms, and the leap to absolute sovereignty is a powerful political argument, not an inescapable geometric proof. The centuries of debate show how rich and debatable his political ideas are on their own terms, regardless of the geometric packaging."
