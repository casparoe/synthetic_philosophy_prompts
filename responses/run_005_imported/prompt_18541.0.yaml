answer: |-
  Your subplot brilliantly weaponizes Kavka's toxin puzzle against your characters. To make the psychology withstand scrutiny, we must dissect the core philosophical tensions:

  ### Core Problem for the Grandson
  He must form a *sincere intention now* (to live with tenants) that he *already knows* will be irrational to execute *later* (post-inheritance, with no incentive). This creates a paradox:

  1.  **Sincerity Requires Commitment:** Genuine resolve implies a current commitment to future action, not just a prediction or desire.
  2.  **Foreseen Future Irrationality:** He knows that *at the time of action*, going will be costly and pointless.
  3.  **The Sincerity Check:** The solicitor must detect (1) despite (2).

  ### Philosophical Lenses & Implications

  1.  **Kavka's Original Diagnosis (The Rationality Split):**
      *   **Core Claim:** Rationality in *forming* an intention is separate from rationality in *acting* on it. Crucially, *forming* an intention can be rational if it yields a benefit *before* the action is due (here, getting the inheritance).
      *   **Grandson's Plausible Path:** He could *rationally decide to form the intention* because it gets him the money. He might even succeed in *intentionally forming* the mental state of "resolve" through self-persuasion techniques (visualization, focusing on guilt/redemption temporarily, suppressing thoughts of future defection). This mental state *is* the intention.
      *   **Problem for Sincerity:** Kavka is deeply skeptical one can *sincerely* form an intention one *knows* one won't act on. The "resolve" is inherently unstable and self-undermining. The grandson knows it's a temporary mental trick for gain. Is this "sincere resolve" or sophisticated self-deception?
      *   **Solicitor's Challenge (Kavka View):** Detecting sincerity is nearly impossible. The grandson is incentivized to be an excellent actor. The solicitor can only look for *inconsistencies* or *tells* revealing the underlying knowledge of future defection (e.g., hesitation on specifics, lack of concrete planning, micro-expressions of insincerity, inability to articulate *why* he'd go beyond "I have to"). Kavka suggests the intention itself is psychologically fragile – the solicitor might probe for this fragility.

  2.  **Resolute Choice (McClennen, Machina):**
      *   **Core Claim:** Rationality applies to *whole plans*, not isolated choices. A rational agent commits to a plan (e.g., "Resolve now -> Get money -> Go live with tenants") and *sticks to it*, even if, at a later node, a different choice looks locally optimal. Deviating is "irresolute" and irrational overall.
      *   **Grandson's Plausible Path:** He rationally adopts the *entire plan* as the best course. His "resolve" is a genuine commitment to see the plan through. He *binds his future self* to the action. He doesn't re-evaluate the rationality of going *after* getting the money; he sees it as part of the non-negotiable package.
      *   **Problem for Sincerity:** Can he *genuinely* adopt this plan knowing the future cost? Resolute choice assumes the plan *is* optimal *when chosen*. Here, the grandson knows the final step *isn't* optimal on its own. Binding his future self feels like an act of will against his own future interests. Is this resolve, or self-coercion?
      *   **Solicitor's Challenge (Resolute View):** The solicitor detects *genuine commitment to the whole plan*. Signs include:
          *   **Integration:** Framing the year with tenants not as a cost, but as an *integral, meaningful part* of receiving the inheritance/redemption.
          *   **No Exit Strategy:** Dismissing or not even contemplating the possibility of backing out later.
          *   **Forward Planning:** Discussing *specifics* of the year (where he'll stay, what he'll do, how he'll manage anonymity) as concrete steps within the plan.
          *   **Identity Shift:** Expressing the resolve as part of who he *is becoming* or *needs to be*, not just a means to money. ("This isn't just about the money; it's the only way I can face myself after what I did.").

  3.  **Planning Theory (Bratman - Intention Stability):**
      *   **Core Claim:** Intentions are distinct from desires. They are *planning states* that involve a *commitment* to act, resist reconsideration, and structure further practical reasoning (planning how to do it). Their *stability* is key to their function in coordinating action over time. Stability relies on norms like consistency and means-end coherence.
      *   **Grandson's Plausible Path:** He forms the intention as a stable planks in his life plan. This intention *should* lead him to:
          *   **Avoid Reconsideration:** Not dwell on the future pointlessness.
          *   **Plan Means:** Actively research, prepare, and make arrangements for the year.
          *   **Filter Options:** Reject alternatives that conflict with going.
      *   **Problem for Sincerity:** Bratman emphasizes that intentions are stable *only if* they remain consistent with one's beliefs and other intentions. The grandson *knows* the intention will clash violently with his future self-interest and desires. This creates massive *inherent instability*. Can a rational agent form a stable intention they foresee will become unstable? Bratman is skeptical. The intention is "poisoned" from the start.
      *   **Solicitor's Challenge (Bratman View):** The solicitor detects *genuine intention stability*. Signs include:
          *   **Non-Obsession with the "Out":** Not constantly framing the future action as a burden to be endured, but focusing on its implementation.
          *   **Pragmatic Reasoning:** Asking practical, logistical questions about the year, demonstrating the intention is guiding his *current* planning and resource allocation (e.g., "How do I handle healthcare anonymously?", "What skills should I brush up on?").
          *   **Consistency Checks:** Expressing other plans (even minor ones) that *assume* he will be gone for that year (e.g., putting hobbies on hold, arranging pet care).
          *   **Emotional Alignment:** Displaying emotions congruent with commitment (determination, focus) rather than just anticipation of wealth or dread of the year.

  ### Can Sincerity Be Achieved & Detected?
  *   **Kavka:** Sincerity is likely impossible. The solicitor detects *lack of insincerity* or good acting. The grandson's best shot is self-deception, but the solicitor might pierce this.
  *   **Resolute Choice:** Sincerity *is* possible as commitment to the whole plan. The solicitor detects holistic commitment and rejection of future reconsideration. This requires a significant psychological shift where the future action is seen as *constitutive* of the desired outcome (redemption + inheritance), not separate.
  *   **Bratman:** Sincerity (as stable intention) is highly unstable and thus unlikely. The solicitor detects the *appearance* of stability through planning and coherence, but the underlying instability (foreseen future conflict) might manifest as subtle dissonance or lack of depth in planning.

  ### Synthesis for Your Scene: What the Solicitor Detects
  The solicitor isn't just detecting "resolve" as a feeling; they are assessing the *architecture* of the grandson's commitment against the known toxin structure. They are looking for evidence that the intention is **embedded, stable, and identity-relevant** despite the foreseen future irrationality. Key detectable markers:

  1.  **Narrative Integration:** Does the grandson frame the year *as part of* his redemption/acceptance of the inheritance story, rather than a separate, unpleasant hurdle? ("This is how I earn it, not just how I get it" vs. "I'll do my time").
  2.  **Concrete, Costly Preparations:** Is he taking *irreversible or costly steps* *now* that only make sense if he *will* go? (e.g., selling his current apartment lease, donating non-essentials, enrolling in relevant training, making firm arrangements with a contact for anonymity setup – actions hard to fake and costly to reverse if he defects). *This is the strongest signal.*
  3.  **Lack of Contingency:** Does he explicitly reject or show no interest in loopholes, monitoring, or ways to "technically" satisfy the condition without going? Does he dismiss the solicitor's hypotheticals about changing his mind later?
  4.  **Emotional Authenticity (Guilt/Redemption Focus):** Does his motivation seem rooted in a *current* sense of guilt or desire for redemption that feels authentic, rather than *only* the money? Can he articulate what he hopes to *learn* or *achieve* during the year beyond just "satisfying the condition"? Is there a sense he *needs* this for himself?
  5.  **Temporal Unity:** Does he speak about his "future self" who will go as *himself*, or as a separate entity he must constrain? Resolute commitment requires identification with the future actor.
  6.  **Resistance to Probing:** When the solicitor *deliberately* highlights the future irrationality ("Once the funds are irrevocably yours, you know you'd be a fool to go. Why would you?"), does the grandson's response reveal genuine commitment ("Because I gave my word," "Because it's the right thing," "Because I need to understand what I did") or does it falter, revealing the instrumental calculation?

  **Recommendation for the Scene:** Leverage **Resolute Choice** as the most dramatically plausible path to *genuine* sincerity within the paradox. Show the grandson undergoing a psychological shift *before* the meeting. He doesn't just *decide* to get the money; he *accepts* the entire path – the year *is* the price and the path to redemption. The inheritance becomes conditional on *becoming the person who would fulfill this*. The solicitor, an expert in self-deception, detects this through the grandson's **costly preparatory actions** (e.g., he arrives with documentation showing he's already quit his job or given up his flat) and his **holistic narrative framing** of the year as necessary for his own closure, not just the matriarch's whim. When probed on the future pointlessness, the grandson displays **confident dismissal of the dilemma itself** ("That point is irrelevant. I'm going."), demonstrating resolute commitment to the whole plan. This makes his resolve both philosophically defensible (if debated) and detectable by a perceptive solicitor looking beyond mere words.
