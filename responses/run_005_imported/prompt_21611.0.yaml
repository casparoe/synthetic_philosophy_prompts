prompt: |-
  Okay so this is a pretty specific request but here goes. I'm graduating from my paramedic program next month, and my cohort (theres only 19 of us) voted to have a student give the send-off speech at the pinning ceremony instead of paying some outside speaker, and somehow that ended up being me. Separately, I needed a humanities elective this semester and picked one called "Ethics and Moral Psychology," expecting we'd mostly cover triage and informed consent, and instead we spent like three weeks on the "moral worth" debate: Kant's grocer, who's only actually praiseworthy if he's honest with customers from duty rather then because honesty happens to be good for business; the Schiller objection, about the guy who seems to get disqualified from virtue because he genuinely enjoys being kind to his friends; and Arpaly's stuff on Huckleberry Finn, who does right by Jim precisely by ignoring his own bad principles and just responding to Jim as a person. I can't stop thinking about all this in relation to my own field now, and I want it to shape the speech, even though I have zero desire to stand up and say the word "Kant" at my own graduation.

  Here's the actual problem I want solved. Every healthcare-adjacent graduation speech says some version of "you're here because you truly care, you have a calling" -- and sure, some days that's even true. But plenty of shifts you're running on four hours of sleep, you feel nothing but tired and vaguely resentful toward the guy who just threw up on your boots, and you start the line or run the compressions anyway because it's the job. I don't want to lie to a gym full of a hundred-plus relatives by pretending we're all secretly angels who feel the calling every single time. But I also really don't want to accidentally imply that the tired, resentful version of doing the job is somehow less admirable than the version where your heart's fully in it -- my ethics professor is going to be sitting right there and will absolutely clock it if that part comes out sloppy. Could you write me something like a 4-5 minute speech that actually threads that needle: honest about the bad-day version of the job, still genuinely moving for people who've never taken a philosophy class in their life, and not secretly smuggling in the conclusion that duty beats feeling or feeling beats duty?
