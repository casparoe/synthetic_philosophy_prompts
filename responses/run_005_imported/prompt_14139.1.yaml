answer: |-
  ## Comparing Blackburn and Gibbard on Frege-Geach and Inconsistency

  Both Simon Blackburn's quasi-realism and Allan Gibbard's norm-expressivism are sophisticated expressivist attempts to solve the Frege-Geach problem – explaining how moral sentences embed logically (e.g., in conditionals, negations, disjunctions) while maintaining that their core function is to express non-cognitive attitudes (approval, disapproval, plans). However, their strategies differ significantly, leading to different strengths regarding generality across connectives and explaining logical inconsistency in disagreement.

  1.  **Blackburn's Quasi-Realism (Logic of Attitudes):**
      *   **Core Strategy:** Moral sentences express first-order attitudes (e.g., `"Lying is wrong"` expresses disapproval of lying). Embeddings are handled via *higher-order attitudes*. Accepting a conditional `"If P, then Q"` expresses a *higher-order attitude* of disapproval towards *combining* the attitude expressed by `P` with the *lack* of the attitude expressed by `Q`.
      *   **Embedding:** Works intuitively for simple modus ponens. For `~P`, Blackburn typically analyzes it as expressing disapproval of the attitude expressed by `P` (e.g., disapproving of approving lying). Disjunction `P v Q` is complex, often analyzed as disapproval of *both* lacking the attitude for P *and* lacking the attitude for Q. Iterated embeddings (e.g., `If (if P then Q) then R`) require increasingly complex and less intuitive higher-order attitudes (disapproving of disapproving of certain combinations...).
      *   **Logical Inconsistency:** Inconsistency (`P` and `~P`) arises from the *practical impossibility* of jointly satisfying the attitudes involved. Approving of lying (`P`) while simultaneously disapproving of approving lying (`~P`) is a practically unstable state of mind – one cannot coherently hold both attitudes towards the same act. Disagreement involves clashing, incompatible practical stances.
      *   **Strengths:** Deeply rooted in the expressivist core – everything is ultimately explained in terms of practical attitudes. Provides a direct explanation for why logic *matters* to us practically (incoherent stances are unstable).
      *   **Weaknesses:** Handling complex embeddings (negation, disjunction, iteration) becomes increasingly ad-hoc and cumbersome. The "logic of attitudes" diverges significantly from standard truth-functional logic, requiring bespoke analyses for each connective and embedding context. Explaining inconsistency solely as practical incoherence risks conflating logical contradiction with other forms of irrationality (e.g., weakness of will).

  2.  **Gibbard's Norm-Expressivism (World-Plan Semantics):**
      *   **Core Strategy:** The content of a normative judgment is analyzed relative to a pair: a possible world (`w`) and a *hyperplan* (`h`) – a maximally specific, contingent plan for what to do in any conceivable situation. `"Lying is wrong"` is true relative to `(w, h)` iff hyperplan `h` *rules out* lying in world `w`. Normative sentences express states of *plan-ladenness* – being in a state of mind that rules out having any hyperplan inconsistent with the sentence.
      *   **Embedding:** The logical connectives (`~`, `&`, `v`, `->`) are defined *truth-functionally* over the pairs `(w, h)`. `~P` is true at `(w, h)` iff `P` is false at `(w, h)`. `P -> Q` is true at `(w, h)` iff if `P` is true at `(w, h)`, then `Q` is true at `(w, h)`. This mirrors standard possible worlds semantics for descriptive language. Embeddings work uniformly and compositionally – the meaning of a complex sentence is built directly from the meanings of its parts using the standard truth-functional rules. Iterated embeddings pose no special problem.
      *   **Logical Inconsistency:** Two judgments `P` and `~P` are logically inconsistent because there is *no* possible world/hyperplan pair `(w, h)` at which *both* are true. Disagreement occurs when two speakers make judgments that cannot *both* be correct relative to any single `(w, h)` pair. This mirrors descriptive disagreement where two claims cannot both be true at the same world.
      *   **Strengths:** Provides a **uniform, compositional, non-ad-hoc treatment of all connectives and embeddings**, directly leveraging standard logical machinery. Offers a clear, formal model of logical inconsistency directly analogous to inconsistency in descriptive discourse. Handles iteration effortlessly.
      *   **Weaknesses:** The reliance on hyperplans and truth-at-`(w, h)` can seem ontologically extravagant or psychologically unrealistic. While normative judgments are still explained as planning states, the *semantic machinery* looks suspiciously like a truth-conditional semantics, potentially distancing the theory from its expressivist roots ("creeping minimalism").

  **Which Approach is Stronger?**

  *   **Generality Across Connectives:** **Gibbard's approach is decisively stronger.** Its truth-functional semantics over `(w, h)` pairs provides a completely general, non-ad-hoc treatment of *all* logical connectives (`~`, `&`, `v`, `->`) and their arbitrarily complex combinations. Blackburn's higher-order attitude approach requires bespoke, increasingly complex, and less intuitive analyses for negation, disjunction, and especially iterated embeddings, making it significantly less general and more ad-hoc.
  *   **Explaining Logical Inconsistency:** **Gibbard's approach is also stronger.** It provides a clear, formal model where inconsistency (`P & ~P`) is impossible truth-at-`(w, h)` – a direct analogue to inconsistency in descriptive language. This explains why the disagreement is *logical* and not merely a clash of feelings. Blackburn's practical incoherence explanation is insightful but less precise; it risks conflating logical contradiction with other practical irrationalities and struggles to capture the *formal* nature of the inconsistency as cleanly as Gibbard's model.

  **Can Blackburn be Repaired by Borrowing from Gibbard?**

  Yes, to some extent, but it would significantly alter the character of quasi-realism. Blackburn could potentially adopt a **structured content approach inspired by Gibbard's `(w, h)` pairs**.

  *   Instead of analyzing `~P` as a higher-order attitude *about* the attitude for `P`, Blackburn could analyze the *content* of moral judgments as having a structure that includes both a descriptive component (like a possible world) and a prescriptive component (like a plan fragment or general policy). Logical operators could then operate on this structured content.
  *   For example, the content of `"Lying is wrong"` might be a pair `<lying occurs, prescribed disapproval>`. Negation `~P` could then simply negate the prescriptive component: `<lying occurs, prescribed non-disapproval>`. Conditionals could involve complex prescriptions over combinations of states and prescriptions.
  *   Inconsistency would arise when the structured contents cannot be jointly satisfied (e.g., `<lying, prescribed disapproval>` and `<lying, prescribed non-disapproval>` are incompatible prescriptions about the same state).

  **Challenges for Repair:**

  1.  **Moving Away from Pure Attitude Expression:** This repair moves Blackburn closer to Gibbard's "factualism about plan-ladenness." The core expressive act becomes endorsing a complex content with descriptive and prescriptive parts, rather than directly expressing a simple attitude. This blurs the line between expressivism and sophisticated forms of realism/minimalism.
  2.  **Complexity of Structured Content:** Defining the structure and how logical operators work on it requires significant formal machinery, potentially losing the elegant simplicity of Blackburn's original "logic of attitudes" intuition.
  3.  **Explaining the "Oomph":** Can this structured content approach fully explain the practical, motivating force of moral judgment as well as Blackburn's direct appeal to attitudes? It might risk making the prescriptive component inert.

  **Conclusion:**

  Gibbard's norm-expressivism offers a **more general, non-ad-hoc treatment of embedding** across the full range of connectives and iterations, thanks to its truth-functional semantics over world-hyperplan pairs. It also provides a **clearer, more formal explanation of logical inconsistency** in moral disagreement, directly mirroring inconsistency in descriptive discourse. While Blackburn's quasi-realism offers deep insights into the practical nature of moral commitment and the source of logic's grip, its reliance on higher-order attitudes struggles with generality and formal precision, especially for complex embeddings and inconsistency.

  Blackburn's approach *could* be strengthened by incorporating elements of Gibbard's structured semantics, moving towards a hybrid view where moral judgments express commitment to complex contents combining descriptive and prescriptive elements. However, this repair risks sacrificing the pure attitude-based expressivism that is quasi-realism's hallmark, moving it closer to Gibbard's framework. Gibbard's solution ultimately provides the more robust and extensible framework for solving the Frege-Geach problem within an expressivist paradigm.
