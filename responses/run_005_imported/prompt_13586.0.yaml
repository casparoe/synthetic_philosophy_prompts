  Looking at Nietzsche's text, he describes the type as "strong," "affirmative," "able to say yes to life." But these are vague, value-laden terms. When he says "spirits are poison," he attributes this to the type's instinct. However, if the type is defined by its agreement with Nietzsche's own preferences, that's circular. The type isn't independently verifiable; it's constructed from Nietzsche's personal experiences. So the advice is still rooted in his idiosyncrasies, just projected onto a hypothetical group.

