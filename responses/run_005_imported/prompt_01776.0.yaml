  First, I need to recall Hofstadter's superrationality. It's based on symmetry: identical agents in symmetric games (like Prisoner's Dilemma) should cooperate because they know they think alike. The key here is the symmetry and identical reasoning. No causal interaction needed; it's about logical inference.

  Now, ECL extends this to a large universe with diverse agents. The user mentions "multiverse-wide superrationality," so ECL involves agents who aren't identical and may have different values. The cooperation here is based on the idea that our decisions provide evidence about others' actions in similar situations, even without symmetry.

  So, the core difference is symmetry vs. similarity under uncertainty. Hofstadter requires identical agents, while ECL relies on statistical correlations in a large universe. That means ECL needs additional assumptions: a large multiverse, decision theories that handle acausal links (like UDT or functional decision theory), and a similarity metric to group decision problems.

  The user is asking which gives a stronger reason to change behavior. Superrationality's strength lies in its strict symmetry, making cooperation a clear logical deduction. But its applicability is limited. ECL, while broader, depends on speculative cosmology and decision theories that aren't universally accepted. Its behavioral implications are more tentative but could inspire cooperative norms in the face of uncertainty.

