answer: |-
  You've zeroed in on the exact tension that makes this passage so debated! Let's dissect Aristotle's moves in *De Int.* 9, using your (a) and (b) framework, to see how they cohere (or don't) in blocking fatalism.

  **1. The Core Problem:**
  The fatalist argument Aristotle confronts is:
  1. For any future event (e.g., sea-battle tomorrow), either "There will be a sea-battle" (P) or "There will not be a sea-battle" (¬P) is *true now* (Bivalence).
  2. If a proposition is true now, then what it describes is necessary (Truth Implies Necessity).
  3. Therefore, *either* the sea-battle is necessary *or* its absence is necessary (Fatalism).

  Aristotle needs to block this without denying the Law of Excluded Middle (LEM: P ∨ ¬P) *in general*, but also without accepting Fatalism.

  **2. Aristotle's Two Moves:**

  *   **Move (a): Necessity of the Present/Actual (Conditional Necessity):**
      *   "Now that which is must needs be **when it is**, and that which is not must needs not be **when it is not**."
      *   "There is a difference between saying that that which is, **when it is**, must needs be, and simply saying that all that is must needs be..."
      *   **What it does:** This establishes a crucial distinction: **Conditional Necessity** vs. **Absolute Necessity**.
          *   *Conditional Necessity*: *Given that* X is happening *right now*, it is necessary *that X is happening right now*. (It's trivially impossible for X to *not* be happening while it *is* happening).
          *   *Absolute Necessity*: It was *always inevitable* that X would happen. (Fatalism).
      *   **Why it's needed:** It directly attacks premise (2) of the fatalist argument ("Truth Implies Necessity"). Aristotle agrees that *if* a proposition about the *present* is true, then what it describes *is presently necessary* (Conditional Necessity). *However*, he argues this does *not* imply that it was *always* necessary (Absolute Necessity). This breaks the fatalist's attempt to project the necessity derived from present truth *backwards* onto the past or forwards onto the inevitability of future events based on current truth. It severs the link between present truth/actuality implying *past* or *future* necessity.

  *   **Move (b): Scope Distinction for Necessity & Disjunction (The Sea-Fight Example):**
      *   "A sea-fight must either take place to-morrow or not, but it is not necessary that it should take place to-morrow, neither is it necessary that it should not take place, yet it is necessary that it either should or should not take place to-morrow."
      *   **What it does:** This explicitly distinguishes:
          *   **Necessarily (P ∨ ¬P)**: It is necessary that *either* P *or* ¬P is true (LEM holds). This is uncontroversial for Aristotle.
          *   **(Necessarily P) ∨ (Necessarily ¬P)**: *Either* P is necessary *or* ¬P is necessary. This *is* Fatalism.
      *   **Why it's needed:** It directly attacks the fatalist's *inference* from step 1 (LEM: P ∨ ¬P is true) to step 3 (Fatalism: (□P) ∨ (□¬P)). Aristotle points out this is a **scope fallacy**. LEM guarantees the *disjunction* is necessary (□(P ∨ ¬P)), but it *does not* guarantee that *either disjunct alone* is necessary ((□P) ∨ (□¬P)). The necessity applies to the *whole disjunction*, not distributively to the parts. The sea-fight example vividly illustrates this: the *either/or* is fixed (□(P ∨ ¬P)), but *which one* happens is not yet necessary (¬□P ∧ ¬□¬P).

  **3. How They Work Together (and Why the Passage Holds):**

  Your intuition is spot-on: **(a) and (b) are distinct but interdependent moves working together to form a single, coherent argument against fatalism.** They aren't the same insight stated twice, nor are they independent escapes accidentally placed together. They address different parts of the fatalist's reasoning:

  1.  **(a) Attacks the Fatalist's Premise (2):** It denies that present truth (or the future truth of a contingent proposition) implies *absolute* necessity. It establishes that "necessity" derived from actuality (*when it is*) is merely *conditional* and does not entail *absolute* necessity or inevitability. This severs the link Truth → Absolute Necessity.
  2.  **(b) Attacks the Fatalist's Inference:** It denies that the necessary truth of a disjunction (□(P ∨ ¬P)) entails the necessary truth of one of the disjuncts ((□P) ∨ (□¬P)). This blocks the move from LEM to Fatalism, *even if* we momentarily grant the fatalist their (flawed) view of truth implying necessity. It shows their logic is invalid.

  **Why they are interdependent:**

  *   **(b) needs (a) for its full force:** Suppose the fatalist retorts: "Fine, □(P ∨ ¬P) doesn't *logically* entail (□P) ∨ (□¬P). But if P is *true now* (or will be true), doesn't that *make* it necessary (via your premise 2)?" **Move (a) is the direct response to this.** Aristotle says: "No, even *if* P is true now (about the present), that only gives it *conditional* necessity (*while it is happening*), not *absolute* necessity. And crucially, for a *future* contingent P, it *isn't* true *now* (in the determinate, actual sense required for conditional necessity)." (This is where the denial of determinate truth/falsity for future contingents *does* come in, though subtly). Without (a), the fatalist could try to plug the gap exposed by (b) by appealing to the truth of the disjuncts implying necessity.
  *   **(a) needs (b) to fully block the argument:** While (a) severs the Truth → Absolute Necessity link, the fatalist might persist with their logical inference: "But surely □(P ∨ ¬P) *must* imply (□P) ∨ (□¬P)?" **Move (b) is the direct response to *this*.** It shows the logical fallacy explicitly. Without (b), Aristotle might only have shown that *if* truth implied necessity it would be problematic, but not necessarily that the inference itself is invalid.

  **Which one does the "real work"?**

  *   **Against the fatalist's *specific argument* presented:** **(b) is the direct counter.** The fatalist's core logical error is the scope fallacy, and (b) exposes it decisively with the sea-fight example. This is the most explicit and famous refutation within the passage.
  *   **For Aristotle's *broader metaphysical picture*:** **(a) is more fundamental.** It establishes the crucial distinction between conditional and absolute necessity, grounding his view of time, change, and potentiality. This distinction is necessary to *explain why* future contingents lack determinate truth value and *why* the scope fallacy matters. It prevents the collapse of potentiality into actuality too soon. (a) provides the ontological foundation that makes (b) meaningful beyond just a logical point.

  **Conclusion: A Single Valid Train of Thought**

  The passage **holds together remarkably well as a single, valid train of thought** directed against the fatalist argument:

  1.  **Acknowledge a truth:** What *is* actual *is* necessary *while it is actual* (Conditional Necessity - Move (a), part 1).
  2.  **Crucial Distinction:** But this *conditional* necessity (*when it is*) is NOT the same as *absolute* necessity (*simpliciter*) (Move (a), part 2). This breaks the fatalist's premise (2) for future contingents.
  3.  **Apply LEM:** Future contingents obey LEM: □(P ∨ ¬P) (Implied, then stated explicitly with the sea-fight).
  4.  **Expose the Fallacy:** However, □(P ∨ ¬P) **does not entail** (□P) ∨ (□¬P) (Move (b) - the core sea-fight sentence). This breaks the fatalist's inference from step 1 to step 3.
  5.  **Connect to Potentiality:** This logical situation reflects the ontological reality: genuine future alternatives involve real potentiality for contrary outcomes, making the corresponding propositions indeterminate (not true *or* false *now* in the determinate sense) until the potentiality is resolved. (The final sentence, linking back to the distinction made in (a)).

  **(a)** provides the conceptual tool (Conditional vs. Absolute Necessity) that explains *why* the fatalist's premise (2) is flawed *and* why future contingents lack determinate truth. **(b)** uses this tool to directly dismantle the fatalist's invalid logical inference using a clear example. They are two essential, interlocking components of Aristotle's sophisticated rebuttal. The "textbook one-liner" about denying bivalence is a *consequence* of this deeper argument about necessity, potentiality, and scope, not the core argument itself as presented in this passage.
