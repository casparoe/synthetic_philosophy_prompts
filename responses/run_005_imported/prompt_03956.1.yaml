prompt: |-
  hey, random one but this might be up your alley. I'm a linguistics PhD student (tense/aspect semantics), and chasing citations backward through Prior's old tense-logic papers landed me on the actual Aristotle passage that started all this — De Interpretatione ch. 9, the sea-battle bit. Working off the old Edghill translation (a pdf I had lying around), there's a stretch I keep re-reading and can't fully parse:

  "Now that which is must needs be when it is, and that which is not must needs not be when it is not. Yet it cannot be said without qualification that all existence and non-existence is the outcome of necessity. For there is a difference between saying that that which is, when it is, must needs be, and simply saying that all that is must needs be, and similarly in the case of that which is not. In the case, also, of two contradictory propositions this holds good. Everything must either be or not be, whether in the present or in the future, but it is not always possible to distinguish and state determinately which of these alternatives must necessarily come about. Let me illustrate. A sea-fight must either take place to-morrow or not, but it is not necessary that it should take place to-morrow, neither is it necessary that it should not take place, yet it is necessary that it either should or should not take place to-morrow. Since propositions correspond with facts, it is evident that when in future events there is a real alternative, and a potentiality in contrary directions, the corresponding affirmation and denial have the same character."

  Is this one move or two spliced together? There's (a) something like "necessity of the present" — once a thing's the case it's trivially necessary given that it's the case — and (b) a scope distinction between "necessarily (p or not-p)" and "(necessarily p) or (necessarily not-p)," which seems to be the actual work the sea-fight sentence is doing. Are (a) and (b) the same insight stated twice, or two independant escapes from the fatalist's argument that just happen to sit next to each other here? Which one, if either, is doing the real work of blocking the slide into fatalism? Skip the "aristotle denies bivalence for future contingents" textbook one-liner — I want to know if the passage as literally written actually holds together as a single valid train of thought.
