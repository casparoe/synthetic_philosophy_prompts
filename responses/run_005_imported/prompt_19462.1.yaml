answer: |-
  Based on Fisher's published works, correspondence, and documented intellectual temperament, here's a historically grounded reconstruction of his potential response to Gould & Lewontin's (G&L) "Spandrels" critique, addressing your specific threads:

  ---

  ### 1. **On "Just-So Stories" and Quantitative Rigor**
  Fisher would have **agreed vehemently with G&L's critique of untested adaptive storytelling** while **fiercely denying its relevance to his work**. His disdain for qualitative biology was legendary:
  - **Mathematical Purity**: Fisher viewed his fundamental theorem as an *a priori* mathematical truth (like thermodynamics), not a narrative. He’d argue G&L conflated rigorous models (his) with speculative verbal adaptations (which he criticized in others, e.g., in disputes over dominance evolution).
  - **Empirical Accountability**: Fisher insisted models must generate testable predictions (e.g., gene frequency changes). He’d concede that *untested* adaptive hypotheses were unscientific but note that his modifier-gene theory of dominance evolution *was* testable (and indeed, later partially validated).
  - **Tactical Agreement**: He might endorse G&L’s call for null models (drift, constraint) but only as foils to be quantitatively disproven. His 1922 paper *"On the Dominance Ratio"* explicitly modeled drift to show its weakness relative to selection.

  **Likely Quote**: *"The authors rightly condemn fanciful tales masquerading as science. But mathematics is not metaphor. My theorem demonstrates—not speculates—that selection’s power swamps noise in natural populations."*

  ---

  ### 2. **Reabsorbing Byproducts: Pleiotropy as Correlated Response**
  Fisher would **forcefully reinterpret "spandrels" as selective correlates**, rejecting G&L’s independent explanatory category:
  - **Covariance is Key**: His fundamental theorem (FTNS) already accommodated correlated traits. FTNS states *dW/dt = Var(g)*, where fitness (W) increases via additive genetic variance (g). Pleiotropic effects would be subsumed under *covariances* between traits affecting fitness. A "spandrel" trait with no direct function might still have Cov(g_trait, g_fitness) ≠ 0 due to linkage or pleiotropy.
  - **No "Free" Constraints**: For Fisher, developmental constraints were either (a) transient (eroded by modifier-gene evolution) or (b) themselves products of past selection (e.g., metabolic efficiency). Architectural byproducts would be framed as *correlated responses to selection* on functional traits.
  - **Modifier Genes as Universal Solvent**: His theory of dominance evolution (1930) showed how "suboptimal" design (e.g., incomplete dominance) could be optimized by selection on modifiers. He’d argue apparent "byproducts" reflect unresolved selective pressures, not design limitations.

  **Speculative Counterargument**: *"Your ‘spandrel’ is merely a trait with Cov(g_spandrel, g_fitness) = 0 today. But if it persists, its variance is maintained by linkage or pleiotropy with traits under selection. Find the covariance, and you find the cause."*

  ---

  ### 3. **Spandrels as Wright Redux: The Old Quarrel Revisited**
  Fisher would **absolutely perceive G&L’s critique as Wrightian anti-selectionism in new clothing**, reigniting his lifelong battle:
  - **Drift vs. Selection Redux**: G&L’s emphasis on non-adaptive explanations (drift, constraints) mirrored Wright’s pluralism. Fisher’s 1941 review of Wright’s *tempo and mode* called such arguments "mystical" for elevating drift’s importance. He’d see "spandrels" as Wright’s "non-selective valleys" repackaged.
  - **Rhetorical Lens**: Fisher dismissed Wright’s shifting balance theory as a "biological fantasy." He’d similarly lampoon the San Marco analogy as *literary* rhetoric—ironically, the kind of narrative he despised. His response would focus not on architecture but on G&L’s "failure to quantify" drift/constraint strength.
  - **Selective Peaks**: G&L’s plural peaks (via constraints) echoed Wright. Fisher’s geometric model of adaptation (1930) saw peaks as unique and globally optimal; constraints were friction to overcome, not landscape-shapers. He’d argue G&L confused *rate* (slowed by constraints) with *direction* (always toward fitness maxima).

  **Historical Echo**: In 1958, Fisher called Wright’s ideas "disastrous" for biology. He’d likely say the same of G&L: *"This is Sewall’s heresy revived with Italian frescoes in place of shifting balance. Neither withstands the theorem’s light."*

  ---

  ### Key Uncertainties & Speculative Boundaries
  1. **Neutral Theory**: Fisher died in 1962, pre-Kimura. Would molecular evidence of neutral evolution have swayed him? His 1958 paper suggests not: he argued drift was negligible if *any* selection existed, however weak.  
  2. **Developmental Constraints**: Fisher’s focus was population genetics, not ontogeny. He might dismiss "constraints" as embryological details irrelevant to evolutionary dynamics (a stance G&L attacked).  
  3. **Tone**: Fisher’s polemics were famously caustic (e.g., calling Wright "muddle-headed"). His response to G&L would likely be combative, not conciliatory.

  ---

  ### Conclusion: Fisher’s Probable Stance
  Fisher would reject *Spandrels* as **a narrative-driven misrepresentation of adaptationism**, guilty of the very verbal looseness it condemned. He’d argue:
  - His mathematics already formalized trait correlations (absorbing "spandrels"),  
  - G&L’s alternatives (drift/constraints) were quantifiably insignificant,  
  - The critique was a revival of Wright’s anti-selectionist errors.  

  He might grant that *poorly executed* adaptationism deserved criticism but insist his work exemplified how to "study adaptation without Pangloss" — through statistics, not stories. The fundamental theorem would remain his unshakable bedrock: a mathematical proof of selection’s supremacy, untouched by architectural analogies.

  *"In the mathematics of the gene, there are no spandrels—only covariances."*  
  —Speculative Fisherian rebuttal
