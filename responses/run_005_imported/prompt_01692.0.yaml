  I'm reading about naturalism vs. normativism on disease, and I'm honestly a bit confused about what the actual disagreement is. Both naturalists and normativists seem to agree that depression, diabetes, and cancer are diseases, and both seem to agree that being really tall or having red hair aren't diseases. So what are these philosophers even disagreeing about? Is it just vocabulary, or is there something more fundamental at stake that I'm missing?
