  First, I need to recall the core arguments of each position. Naturalists say disease is objective, based on biological dysfunction. Normativists argue that values and social norms play a crucial role. But the user points out consensus on certain conditions, which might make the debate seem trivial. I should explain why that consensus exists and where the disagreements actually surface.

