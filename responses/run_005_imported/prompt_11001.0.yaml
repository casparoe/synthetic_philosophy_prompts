  For the fink case, I'm imagining something with a last-second override. Maybe a "courageous" soldier whose bravery only activates when danger appears... but what if the danger itself triggers panic instead? No, that's not quite right - finks require the disposition to flip precisely during triggering. Ah! What about a spy whose "loyalty" circuits engage only when tested? That could work if we make the interrogation itself activate the brainwashing. 

