prompt: |-
  In my school's decision theory club, we recently covered I. J. Good's well-known theorem that a Bayesian agent's expected utility can never be lowered in expectation by looking at free evidence before acting. Several clubmates took this as settling the question of whether a rational person should always want more information, no matter what. I think that inference moves too fast. Please argue that Good's theorem does not support this general slogan. As your central case, use the phenomenon the economist Jack Hirshleifer identified: the mere existence of sufficiently accurate information can destroy risk-sharing arrangements, like insurance, that would otherwise make everyone better off ex ante, so that a fully rational person can end up worse off simply because such information exists, even if nobody is ever compelled to look at it. Be precise about why this is not a counterexample to Good's proof itself, but rather a case that falls outside what the proof assumes.
reasoning: |-
  Okay, the user is asking about Good's theorem and its implications on whether more information is always beneficial. They mentioned that their decision theory club members took the theorem to mean that rational agents should always seek more information. However, the user disagrees and wants an argument against that interpretation, specifically using Hirshleifer's phenomenon as a central case.

  First, I need to recall Good's theorem. It states that a Bayesian agent's expected utility can't decrease in expectation when they acquire free evidence before acting. The key points here are that the evidence is free, and the agent is Bayesian. The theorem applies when the agent has the choice to observe the evidence or not, without cost.

  Now, the user wants to show that this doesn't mean "always seek more information" in all scenarios. Hirshleifer's example involves risk-sharing arrangements like insurance. The idea is that if highly accurate information about risks exists, it can destroy insurance markets. Even if no one looks at the information, its mere existence prevents mutually beneficial contracts because the information asymmetry would lead to adverse selection.

  So, why isn't this a counterexample to Good's theorem? Good's theorem assumes that the agent decides whether to acquire the evidence. But in Hirshleifer's case, the problem arises from the information existing in the world, which affects the availability of contracts. The agent doesn't even have the option to enter insurance contracts if the information exists because insurers can't offer fair policies without knowing who's high-risk. Thus, the agent's expected utility is lower ex ante because the insurance market collapses, not because they looked at the information. Good's theorem only applies when the decision to acquire evidence is individual and without externalities. Here, the existence of the information affects the institutional setup, which isn't covered by Good's assumptions.

  The user also wants precision on why this falls outside the proof. Good's proof considers an agent facing a decision problem with fixed options. But in Hirshleifer's case, the options themselves change due to the information's existence. The insurance contract is no longer available, altering the action set. Additionally, Good's model doesn't account for how the presence of information affects other agents' behaviors or market structures. The negative impact comes from strategic interactions and equilibrium effects in the market, which aren't part of an individual Bayesian agent's decision problem.

  I should also highlight the key differences: Good's scenario is non-strategic, individual, with fixed actions. Hirshleifer's involves multiple agents, strategic interactions, and endogenous options. The existence of information changes the game, leading to outcomes that are Pareto-inferior ex ante. Therefore, while Good's theorem holds for an individual's decision to acquire evidence, it doesn't address systemic effects where the availability of information alters the environment itself, making everyone worse off even without anyone observing the evidence.
answer: |-
  You're absolutely right to push back against the overgeneralization of Good's theorem. While Good's result is mathematically sound and profound within its specific context, it does **not** establish that "a rational person should *always* want more information, no matter what." Hirshleifer's insight provides a powerful counterexample to this slogan, precisely because it highlights how Good's theorem relies on assumptions that don't hold in strategic, multi-agent settings involving risk-sharing. Here's the breakdown:

  1.  **Recapping Good's Theorem (Informally):**
      *   **Scenario:** A single Bayesian agent faces a decision problem with multiple possible actions. There exists some "free evidence" (information observable without cost) potentially relevant to the state of the world affecting the outcome of their actions.
      *   **Theorem:** The agent's *expected* utility (calculated *before* deciding whether to look at the evidence, and *before* knowing what the evidence would say) is *at least as high* if they choose to look at the free evidence before acting, compared to acting without looking. It can often be strictly higher.
      *   **Key Assumptions:**
          *   Single agent making a decision.
          *   The action set is fixed and available regardless of information acquisition.
          *   Information is "free" (no direct cost, no side effects).
          *   The agent is Bayesian (updates beliefs correctly via Bayes' theorem).
          *   The agent optimizes expected utility given their beliefs.
          *   The *only* thing changing is the agent's information state; the world (states, actions, utilities) remains unchanged.

  2.  **Hirshleifer's Phenomenon (The Destruction of Insurance):**
      *   **Scenario:** Imagine a population of individuals with varying, initially unknown, risks (e.g., genetic predisposition to a disease). Ex ante (before anyone knows their individual risk), everyone is identical in expectation and would benefit from a risk-sharing arrangement like actuarially fair insurance, pooling the risk. This insurance market can exist *only* if the insurer cannot distinguish high-risk from low-risk individuals.
      *   **The Information Problem:** Now suppose highly accurate information *about individual risk levels* becomes *available in principle* (e.g., a cheap, reliable genetic test exists).
      *   **The Collapse (Even Without Looking!):**
          *   **Adverse Selection Threat:** If individuals *could* find out their risk *before* buying insurance, high-risk individuals would be highly motivated to buy, while low-risk individuals might find the pooled premium too high and drop out. Insurers, anticipating this, cannot offer the original pooled contract without losing money.
          *   **Market Unraveling:** Knowing this information *exists*, insurers cannot credibly offer the original pooled contract. The *only* sustainable contracts might be risk-specific premiums *or no insurance at all* if risk-specific pricing is impractical. Crucially, the existence of the accurate information destroys the possibility of the *mutually beneficial pooled insurance contract* that everyone preferred ex ante.
      *   **The Rational Agent's Dilemma (Ex Ante):**
          *   **Before any information is known or acquired:** The rational agent, looking at the world *now* where the accurate risk information *exists*, realizes that the beneficial pooled insurance contract is *no longer available*. Their options are now: (1) Possibly get risk-specific insurance (if offered), which might be worse than the pooled premium for low-risk types but better than nothing, or (2) No insurance.
          *   **Ex Ante Welfare Loss:** Compared to the world where the accurate risk information *did not exist* (and the pooled insurance contract *was* available), the agent is *worse off* ex ante. The *mere existence* of the information has destroyed a valuable option (the pooled insurance contract), lowering their expected utility from what it *could have been* in the information's absence.

  3.  **Why This is NOT a Counterexample to Good's Proof:**
      Good's proof is mathematically airtight *within its specific, isolated decision problem*. Hirshleifer's scenario violates core assumptions of that problem:
      *   **Fixed Action Set Assumption Violated:** Good assumes the set of actions available to the agent is fixed, regardless of information acquisition. In Hirshleifer's case, the *existence* of the information fundamentally alters the *available actions/contracts in the market*. The mutually beneficial pooled insurance contract **disappears as an available option** *because* the information exists, irrespective of whether the agent or anyone else looks at it. The agent's action set *before* acquiring any information is *already* diminished compared to the world without the information.
      *   **Non-Strategic Assumption Violated:** Good's theorem considers a single agent playing against nature. Hirshleifer's case involves **strategic interaction between multiple rational agents** (insured individuals, insurers). The availability of contracts depends on equilibrium behavior in this multi-agent game. The *threat* of adverse selection, driven by the *potential* for information acquisition by *others*, changes the equilibrium outcomes *even if no one acquires the information*. Good's theorem doesn't model these strategic externalities.
      *   **"Free" Information Nuance:** While the information might be "free" in a monetary sense for an individual to acquire, its *existence* imposes a **systemic cost** by destroying the risk-pooling mechanism. This cost isn't borne by the acquirer at the point of acquisition; it's a negative externality imposed on the entire market structure *ex ante*.
      *   **Ex Ante vs. Acquisition Decision:** Good's theorem shows that *conditional on the decision problem being fixed*, acquiring free evidence doesn't hurt in expectation. Hirshleifer shows that the *very possibility* of certain information existing can *redefine the decision problem itself* (by removing beneficial actions/contracts), making the agent worse off *before they even face the choice* to acquire evidence or not. Good's theorem operates *within* a problem; Hirshleifer shows how information possibility *changes the problem*.

  4.  **Why the Slogan Fails:**
      The slogan "a rational person should always want more information" fails because:
      *   **It ignores systemic effects:** In multi-agent settings, the *availability* of information can alter the strategic landscape and destroy beneficial institutions (like insurance pools) *before* any individual makes an acquisition decision. The rational agent, evaluating the world *ex ante* where this information *can* exist, would sometimes prefer a world where it *cannot* exist.
      *   **"Want" is ambiguous:** Does "want" mean "value acquiring it when offered in isolation"? Good's theorem supports this *if the decision problem remains unchanged*. Does "want" mean "prefer that this information be *available* in the world"? Hirshleifer shows a rational agent can answer "No" to this broader question, as its availability destroys value ex ante.
      *   **It conflates acquisition with existence:** Good's theorem is about the *act* of acquiring free evidence within a fixed context. The slogan often gets interpreted as valuing the *existence* or *availability* of information per se. Hirshleifer shows existence/availability can be harmful.

  **Conclusion:**

  Hirshleifer's phenomenon demonstrates that the **mere existence of sufficiently accurate information can destroy mutually beneficial risk-sharing arrangements like insurance, making everyone worse off ex ante compared to a world where such information is fundamentally impossible.** This is not a flaw in Good's theorem, which correctly shows that *within a fixed decision problem*, a Bayesian agent never regrets acquiring free evidence before acting. Instead, it highlights that Good's theorem **assumes a static decision context** (fixed actions, no strategic interactions). When the *possibility* of information acquisition **dynamically alters the fundamental structure of the decision problem itself** – specifically by eliminating beneficial actions or contracts due to strategic equilibrium effects – a rational agent can indeed be worse off ex ante because that information *could* exist, even if they (or anyone else) never look at it. Therefore, Good's theorem provides powerful justification for seeking evidence *in individual, non-strategic decisions*, but it does *not* support the general slogan that more information is always desirable, especially when considering the systemic effects of its potential existence in multi-agent markets.
