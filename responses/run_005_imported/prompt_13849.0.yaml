  First, I need to unpack Taurek's main points. He challenges the idea that numbers automatically matter in moral decisions. His key argument is about the separateness of persons: losses can't be aggregated across individuals because each person's loss is their own. So, saving five people isn't one big loss prevented but five separate ones. That's why he suggests using a coin toss to give each person an equal chance.

