  Diego's next point is practicality: soldiers can't independently verify intel or refuse orders without severe consequences. Holding them to such standards is unfair. Naomi agrees on excuses but insists justification remains separate. This leads to Diego questioning the laws of war—if symmetric protections exist despite moral asymmetry, what's the point? Naomi explains McMahan's separation of deep morality from practical laws. Diego's final critique: if deep morality doesn't affect practice, it's a cop-out.

  The user wants a move-by-move analysis with scores and possible missed arguments. They also wonder if Diego's cop-out objection holds. 

  Breaking it down:
  1. **Diego's initial point (+1):** Strong on legal practice—POWs aren't tried, only leaders. But conflates legal treatment with moral justification.
  2. **Naomi's distinction (+2):** Clears up confusion between blame (excuse) and permissibility (justification). Uses McMahan effectively.
  3. **Diego's practicality argument (0):** Valid concerns about soldier agency but confuses moral evaluation with feasibility. Misses that morality can exist independently of practical constraints.
  4. **Naomi's clarification (+1):** Reiterates the excuse/justification split but could've addressed Diego's fairness concern more directly.
  5. **Diego's challenge to laws of war (-1):** Overlooks that laws serve practical stability, not just moral truth. Misunderstands the purpose of symmetric rules.
  6. **Naomi's deep vs. practical law (+1):** Correctly explains McMahan's dual-layer approach but doesn't fully defend why deep morality matters if invisible.
  7. **Diego's cop-out critique (+1):** Good point on applicability but dismissive of moral philosophy's role. Needs to engage with why deep morality informs long-term norms.

  Missed opportunities:
  - **Naomi** could've emphasized that deep morality guides *post-war* accountability (e.g., Nuremberg) or shapes evolving laws. It's not irrelevant just because it's not actionable mid-combat.
  - **Diego** might've argued that in asymmetric conflicts (e.g., resistance fighters), symmetric laws *do* reflect moral parity, but he didn't.

  On the cop-out: McMahan's deep morality isn't useless—it critiques existing systems and drives reforms. For example, challenging blanket combatant immunity or redefining legitimate targets. Diego oversimplifies by demanding immediate practical effects.

  Overall, Naomi edged it by maintaining key distinctions, but both had gaps. The drone case needs applying these frameworks: if the operator suspects bad intel, Walzer might emphasize obedience to chain of command, while McMahan would stress personal moral responsibility despite legal protections.
