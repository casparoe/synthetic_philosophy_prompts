  Here's a move-by-move breakdown of Diego and Naomi's debate, scored (-2 to +2) based on argument strength, clarity, and engagement with the sources, plus missed opportunities and a final verdict:

  ### **Round 1: Moral Equality of Soldiers**
  - **Diego (+1)**:  
    *Argument:* Soldiers following the rules of war (jus in bello) aren’t murderers, even in an unjust war (jus ad bellum). Evidence: We don’t prosecute enemy POWs—only leaders.  
    *Strength:* Strong appeal to real-world legal practice and avoids moralizing combatants in impossible situations.  
  - **Naomi (+2)**:  
    *Argument:* McMahan’s key distinction: **Excuse ≠ Justification**. An unjust soldier might be *excused* (due to ignorance/coercion), but their killing isn’t *justified* like a just soldier’s.  
    *Strength:* Correctly identifies Diego’s conflation (legal treatment vs. moral permissibility) and anchors it in McMahan.  
  *Missed Opportunity:* Diego could’ve noted Walzer’s *political* justification: Soldiers are "moral equals" because they serve collective wills, not personal causes.

  ---

  ### **Round 2: Feasibility of Moral Judgment**
  - **Diego (0)**:  
    *Argument:* Soldiers can’t verify their nation’s cause mid-war (propaganda, intel failures). Refusing orders risks court-martial. Holding them to this standard is unfair/unrealistic.  
    *Strength:* Highlights practical barriers but confuses **blameworthiness** (can we condemn them?) with **permissibility** (was the act wrong?).  
  - **Naomi (+1)**:  
    *Argument:* Agrees soldiers often *shouldn’t be blamed* (excused) but reiterates this doesn’t make killing *permissible*. McMahan accepts excuses without granting justification.  
    *Strength:* Maintains the core distinction but doesn’t fully engage Diego’s "unfair standard" point.  
  *Missed Opportunity:* Naomi could’ve cited McMahan’s "epistemic argument": Soldiers *should* investigate their cause pre-enlistment, but mid-war excuses apply.

  ---

  ### **Round 3: Laws of War & Practicality**
  - **Diego (-1)**:  
    *Argument:* If McMahan is right, symmetric laws of war (e.g., equal POW rights) become "pointless" since they treat morally unequal actors equally.  
    *Weakness:* Misunderstands the purpose of international law—it prioritizes **minimizing suffering** over moral truth (e.g., reciprocity prevents atrocities).  
  - **Naomi (+1)**:  
    *Argument:* McMahan separates **"deep morality"** (who *may* kill) from **"practical law/policy"**. Laws *should* stay symmetric for pragmatic reasons: soldiers can’t adjudicate justness mid-combat; reciprocity saves lives.  
    *Strength:* Faithfully represents McMahan’s dual-layer approach.  
  *Missed Opportunity:* Diego could’ve argued that symmetric laws *presuppose* moral equality—otherwise, they’d be unjust to victims of aggression.

  ---

  ### **Round 4: Is "Deep Morality" a Cop-Out?**
  - **Diego (+1)**:  
    *Argument:* If "deep morality" never impacts practice (laws, trials, treatment of soldiers), it’s a useless philosophical abstraction ("cop-out").  
    *Strength:* Raises a legitimate challenge to moral philosophy’s relevance.  
  - **Naomi (0)**:  
    *Implied Position:* Defends McMahan but doesn’t counter *why* deep morality matters.  
    *Weakness:* Fails to offer a compelling reply.  
  **The Critical Missed Opportunity (Naomi’s Reply):**  
  Deep morality **isn’t practically inert**. It:  
  1. **Guides post-war accountability** (e.g., Nuremberg tried leaders for *waging aggressive war*, not just in bello crimes).  
  2. **Informs military training/recruitment ethics** (e.g., teaching soldiers to question manifestly illegal orders).  
  3. **Shapes long-term legal evolution** (e.g., rejecting colonialism’s "civilizing mission" as ad bellum justification).  
  4. **Affects veterans’ moral injury** (e.g., unjust soldiers may *feel* guilt even if legally excused).  
  *Score if Used:* **+2** — Rescues McMahan from "ivory tower" dismissal.

  ---

  ### **Overall Verdict**  
  **Naomi wins narrowly (Score: +4 vs. Diego’s +1)**  
  - **Why:** She consistently upheld McMahan’s core distinction (excuse vs. justification) and accurately framed his "pragmatic symmetry" argument. Diego’s strongest point (the "cop-out" critique) went unanswered but wasn’t fatal.  
  - **Key Insight:** Their debate mirrors Walzer vs. McMahan’s core tension:  
    - *Walzer*: War’s horrors require "firebreaks" (symmetric rules) to limit suffering.  
    - *McMahan*: Moral truth shouldn’t be sacrificed for practicality, but law can accommodate it.  
  - **Drone Operator Application:**  
    - *Walzer*: Operator should follow orders unless rules of engagement (jus in bello) are violated.  
    - *McMahan*: Operator has a *prima facie* duty to refuse unjust orders—even if legally excused later for uncertainty.  

  **Final Tip for Ethics Bowl:** Resolve Diego’s cop-out by stressing that **deep morality drives incremental change** (e.g., evolving drone strike protocols to prioritize ad bellum assessments). Philosophy isn’t inert—it’s the engine of progress.
