  Notably, they didn't ask how probes work - they want epistemology translated into engineering tradeoffs. The ablation point is crucial: if compensation breaks causality claims, their tool might miss adaptive deception. I'll flag that as a high-risk scenario requiring human review fallbacks.

  Also worth stressing that correlation still has utility. Even if features aren't "real", they might be reliable smoke detectors. But they'll need to test for generalization across prompt types and model versions. Maybe suggest treating probes like circumstantial evidence rather than direct testimony.

  ...Wait, should I mention Elazar's null-probe criticism? Too niche. Better focus on their deployment context: since humans review flagged outputs, false positives cost less than false negatives. That justifies using probes as sensitive but imperfect filters.

