  First, I need to recall Sartre's bad faith. It's not just lying to oneself; it's a duality. One side is treating yourself as fixed (like "it's fate"), denying freedom. The other is refusing to commit, avoiding responsibility. The speech should celebrate active choice, not soulmate clichés, and emphasize that marriage requires ongoing commitment, not a one-time fix.

  The user mentioned Danny's history of avoiding commitment before Mia, so that's a good point to include humorously. Also, the audience has varied knowledge: uncles and nan won't care about philosophy, but the book club will notice inaccuracies. Balancing humor with depth is key. Avoid lectures; use relatable metaphors.

  Structure-wise: start with a hook about the book club, explain bad faith simply with examples. Contrast Danny's past (avoiding commitment) with his choice now. Highlight that marriage isn't the end but daily choices. Toast to their continuous choosing. Use humor throughout to keep it light.

  Check potential pitfalls: Don't oversimplify Sartre. Avoid "follow your heart" as that's opposite to Sartre's active responsibility. Ensure the philosophy is woven naturally into anecdotes, not academic. Keep speech to 4-5 minutes. Include specific jokes about Danny's past and the book club's struggle with the book.

  Need to ensure the toast resonates emotionally while staying true to existentialist themes. Emphasize that love is a verb, an action, aligning with Sartre's emphasis on freedom and responsibility. Make sure the humor lands without offending, especially with family present.
answer: |-
  Right, let's craft a toast that honors the existential weight of their choice while keeping the uncles chuckling and Nan from checking her watch. The key is to **embed the philosophy in Danny & Mia's specific story and relatable human moments**, not lecture. Here’s the 4-5 minute script:

  **(Clink glass gently. Warm smile. Start confident but slightly self-deprecating.)**

  "Alright, settle down everyone. For those who don't know me, I'm [Your Name], Danny's best mate. And for those who *do* know me, yes, I *am* standing up here voluntarily, which tells you exactly how much I love this idiot. Danny asked me to do this speech months ago. I said yes immediately... and then spent every day since wondering if I could fake a sudden, dramatic illness. Turns out, commitment's terrifying! Who knew? *Danny* certainly didn't for about a decade... but more on that later.

  **(Light laughter. Nod towards Danny & Mia)**

  Seriously though, Danny, Mia, you both look absolutely incredible. Stunning. Radiant. The kind of happy that makes the rest of us slightly jealous and immediately want another drink. *(Raise glass slightly, put down to continue).*

  Now, most best man speeches start with how the couple met. Ours involves... well, let's just say it wasn't a drunken night out or a dodgy dating app. No. Danny and Mia met in a *book club*. Sounds civilized, right? Wrong. This wasn't your cozy 'rom-com and a glass of Chardonnay' book club. Oh no. This was the literary equivalent of running a marathon... backwards... through treacle... while being shouted at in French. They decided, for reasons lost to history – probably a dare, or maybe someone spiked the tea – to read Jean-Paul Sartre's 'Being and Nothingness'. For FOUR MONTHS.

  **(Look around, feigning mild horror)**

  For those blissfully unaware – and trust me, be grateful, Uncle Bob – 'Being and Nothingness' makes tax legislation look like a page-turner. It's dense, it's bleak, it famously contains the line *"Hell is other people"*... which, admittedly, *does* feel relevant at some family gatherings... *(Pause for chuckle)* ...but mostly, it’s just *hard*.

  But! Buried deep in the existential angst, there's this bit about 'Bad Faith'. And Danny, Mia – this is where your origin story gets interesting. Bad Faith isn't just lying to yourself. Sartre basically said we humans have this amazing, terrifying freedom. And we hate it! So we try to wriggle out of it in two main ways.

  **Way One:** We pretend we're just *fixed* things. Like a rock, or a particularly grumpy garden gnome. 'This is just who I am!' 'It was fate!' 'She's my soulmate, it was written in the stars!' Sounds romantic? Sartre would call it dodging responsibility. It’s saying, 'Oh, I *had* no choice but to love her!' Nonsense. You *chose* her. Every single day you chose to text back, to show up, to argue about the washing up, and eventually, to stand here looking terrified in a penguin suit, Danny. **That’s** the magic. Not fate. *Your choice.***

  **(Pause. Look pointedly at Danny, warm smile)**

  **Way Two:** The *opposite* trap. This was Danny's signature move for YEARS, wasn't it lads? *(Gesture to friends)*. The King of Maybe! The Sultan of Sidestepping! The man who treated commitment like it was radioactive. 'Keep every option open! Never define yourself! Never *choose* anything definitively, because then you might have to... *own* it!' That's also Bad Faith. Hiding from the freedom to actually *be* something, someone, by never landing anywhere. Living life perpetually on the 'maybe' pile.

  **(Turn back to the couple)**

  So, Danny and Mia, your meet-cute wasn't just bonding over terrible French philosophy. It was bonding over *seeing* these traps. Over recognizing that terrifying freedom Sartre banged on about. And look what you did! Danny, you magnificent, commitment-phobic disaster... you looked at the abyss of choice... and you **chose Mia.** Not because some cosmic script said so, but because you *decided* she was worth the terrifying responsibility of loving someone completely. Mia, you looked at this walking, talking paradox of a man – capable of deep philosophical insight yet somehow also incapable of loading the dishwasher correctly *(pause for laughter)* – and you **chose Danny.** Actively. Bravely.

  **(Raise glass slightly higher)**

  *That’s* what we’re celebrating today. Not some pre-ordained fairy tale. We’re celebrating the most powerful, human thing imaginable: two people, staring down the void, looking at each other, and saying, 'You. Every day. I choose you.'

  **(Shift tone slightly more earnest)**

  But here’s the existential kicker Sartre would want me to mention – and don't worry Nan, I’ll get back to the jokes in a sec! *(Wink)*. Saying 'I do' today? It’s not a magic spell that turns you into 'The Married Couple™', finished products, like statues on a wedding cake. It doesn’t mean you get to stop *choosing* each other. The freedom doesn’t switch off because you signed the register! Bad Faith can still lurk.

  If you ever catch yourselves thinking, 'Well, we’re *married* now, this is just how it is, no point trying to change...' – Boom! Bad Faith Trap One. You're pretending you're fixed objects, not free people who can grow *together*.

  If you ever catch yourselves avoiding the tough conversations, the vulnerable choices, the messy work of building a shared future because it’s easier to stay non-committal *within* the commitment... 'Maybe we’ll talk about kids later... maybe we’ll address that issue someday...' – Ding Ding Ding! Bad Faith Trap Two, Danny’s old stomping ground!

  **(Smile warmly, raising glass fully now)**

  So my toast, Danny and Mia, is not just to your wedding day, but to *all* the days after. To you both having the courage to keep *choosing* each other. Actively. Consciously. Bravely. To embracing that terrifying, wonderful freedom Sartre wrote about – not to run from it, but to use it to build something real, together, one deliberate, chosen moment at a time. To choosing the hard conversations, the shared dreams, the dirty dishes, and the profound joy of being fully seen and chosen, every single day.

  **(Full voice, aiming glass at them)**

  To Danny and Mia! May your love be a never-ending, consciously chosen 'Being and Something Absolutely Wonderful'!"

  **(Clink! Drink! Sit down quickly before anyone asks follow-up questions about phenomenology!)**

  **Why this works:**

  1.  **Hooks the Uncles/Nan:** Starts with classic best man self-deprecation, mentions Danny's past commitment issues (funny/relatable), jokes about the book's difficulty, uses simple metaphors ("running a marathon backwards in treacle"), references "Hell is other people" in a family context, teases Danny about the dishwasher. The philosophy is *framed* by humor and their specific story.
  2.  **Satisfies the Philosophers (Mia/Book Club):** Accurately presents the two traps of Bad Faith (fixed identity vs. refusal to commit). Explicitly links Danny's past to Trap Two and the "soulmate" cliché to Trap One. Makes the crucial point that marriage *isn't* an end to choosing but the beginning of a new kind of choosing. Avoids the "follow your heart" nonsense – focuses on *responsibility* and *conscious choice*. Uses Sartre's core idea of freedom correctly.
  3.  **Threads the Needle:** Clearly celebrates their *active choice* ("I choose you") over fate. Explicitly warns against *both* traps *after* the wedding (fixed married state *or* avoidance within marriage). The toast itself is to "choosing each other" continuously.
  4.  **Keeps it Personal:** Rooted in *their* story (book club, Danny's past, their specific bond). The philosophy serves *their* narrative, not the other way around.
  5.  **Pacing & Length:** The jokes and asides break up the heavier bits. Reading it aloud at a natural pace should hit 4-5 minutes. The ending is strong, clear, and emotional without being saccharine.

  **Delivery Tips:**

  *   **Practice Out Loud:** Time yourself. Get comfortable with the flow between jokes and the slightly more serious bits.
  *   **Pace:** Don't rush the philosophy parts. Let the key lines land ("You. Every day. I choose you." / "The freedom doesn’t switch off").
  *   **Eye Contact:** Share the jokes with the room, but deliver the core messages about choice and commitment looking directly at Danny and Mia.
  *   **Tone:** Warm, affectionate, slightly irreverent (as a best man should be), but sincere when it counts. Let your genuine happiness for them show, especially during the toast itself.
  *   **Nan & Uncles:** Give them a wink or a nod during the bits directly addressing their potential confusion ("Don't worry Nan...").

  Good luck! You've got this. Remember, you're celebrating your mate and his incredible choice, armed with some solid existential backup. Now go knock 'em dead (metaphorically speaking, Sartre might approve, but the wedding planner won't).
