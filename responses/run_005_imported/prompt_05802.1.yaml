answer: |-
  What a fascinating juxtaposition! Your unique perspective—bridging a lifetime in evolutionary biology with a philosophical examination of Darwin's own text—illuminates a profound tension. Let's reconstruct Darwin's likely response to Street, grounded strictly in *Descent of Man* Chapter IV ("Moral Sense"), and assess whether he escapes her dilemma.

  **Darwin's Core Argument in *Descent* IV:**
  1.  **Origin in Social Instincts:** Morality arises from "social instincts" (sympathy, mutual aid) naturally selected because they enhanced group survival and reproductive success in social animals like our ancestors.
  2.  **Role of Intellect & Sympathy:** Human cognitive capacities (memory, foresight, language) allow us to reflect on past actions and impulses. Sympathy enables us to value the welfare of others.
  3.  **The Standard Emerges:** Through reflection, individuals realize that obeying social instincts *usually* benefits the tribe. This leads to the *approval* of actions "for the general good" and disapproval of selfish actions. Crucially, Darwin states:
      > *"As the reasoning powers advance and experience is gained... man perceives... if he acted for the public good, he would receive the approbation of his fellow-men... and this approbation is... the highest pleasure... He might then declare... I am the supreme judge of my own conduct... and it is the judgment of the community which serves as our guide... the general good or welfare of the community, rather than the general happiness."*
  4.  **"General Good" as Standard:** Darwin explicitly identifies the "general good or welfare of the community" as the standard by which actions "should be approved or disapproved." This standard *emerges* from the interplay of evolved instincts/intellect and social feedback.

  **Darwin's Likely Response to Street's Dilemma:**

  1.  **Rejection of the First Horn (No Relation = Lucky Coincidence):** Darwin would vehemently deny that the truth of moral judgments is a matter of "luck." His entire chapter argues that the *content* of our moral judgments ("approve what's good for the tribe") is *directly generated by* the selective pressures. The "general good" standard isn't an independent truth *discovered* by luck; it's the *product* of the evolutionary process shaping our psychology and social dynamics. The relation is causal and constitutive, not coincidental.
  2.  **Rejection of the Second Horn (Tracking Relation = Idle):** Darwin would also reject Street's characterization of a "tracking account" as explanatorily idle. He would argue his account *is* the adaptive link account:
      *   **The Mechanism:** Selective pressure (group advantage) directly shaped our social instincts (sympathy, desire for approval) and intellectual capacities.
      *   **The Content Generation:** These instincts/capacities, interacting within a social group, *generate* the concept and standard of the "general good." The standard *is defined by* what promotes group welfare/stability/survival *as experienced and reasoned about* by individuals within that group.
      *   **No Independent Truth Needed (in Street's sense):** For Darwin, the "independent evaluative truth" *is* the "general good of the community." But this "truth" isn't a Platonic form existing outside the natural world. It is a *natural fact* about what promotes the survival and flourishing of a social group. Selection *creates* the psychological and social mechanisms that *constitute* this standard and our judgments about it. There is no need to "track" an external, non-natural truth; the standard *is* the natural outcome of the adaptive process. The explanation of *why* we judge X good (it promotes group welfare) and *what makes* X good (it *is* promoting group welfare) are one and the same within his naturalistic framework.

  **Which Horn Does Darwin Escape? Both, by Rejecting Street's Presuppositions.**

  Darwin's account, as presented in *Descent* IV, fundamentally **escapes Street's dilemma** by undermining the realist/non-realist dichotomy *as Street frames it*:

  1.  **Naturalist Moral Realism (of a Kind):** Darwin posits a real, objective standard: the "general good or welfare of the community." This *is* the fact that determines whether an action "should be approved." This is a form of **naturalist realism** – the moral fact ("promoting group welfare is good") is a fact *about the natural world* (specifically, about social organization and survival).
  2.  **The Evolutionary Origin is Constitutive, Not Merely Causal:** Crucially, Darwin doesn't see evolution as merely causing us to *believe* in an independent standard. He argues evolution (shaping instincts, intellect, and sociality) *created the standard itself*. The "general good" *is* the functional goal of the evolved social system. Selection didn't shape us to *track* an independent moral truth; it shaped us (and our social groups) such that the functional requirement for group survival *becomes* the moral truth *for us*. The "tracking" relation collapses – the adaptive process *defines* the target.
  3.  **Explanatory Power Without Idleness:** Street argues the adaptive link account makes the tracking relation explanatorily idle. Darwin's account *is* an adaptive link account, but it doesn't posit an *additional*, independent moral truth needing explanation. The adaptive link account *fully explains both the existence of the judgments AND the content of the standard*. The standard ("general good") is not an idle extra posit; it *is* the functional goal identified *within* the naturalistic explanation. It does work *as the content* generated by the process.

  **Conclusion: Darwin as Proto-Naturalist Constructivist/Functionalist**

  Strictly from *Descent* IV, Darwin's position anticipates a sophisticated **naturalistic moral constructivism** or **functionalist realism**:

  *   **Naturalistic:** Morality arises entirely from natural processes (evolution, psychology, social dynamics).
  *   **Constructivist/Functionalist:** The moral standard ("general good") is *constructed by* or *defined as the functional requirement of* the evolved social system. It's not discovered "out there" independently; it emerges from the needs and interactions of social beings shaped by natural selection.
  *   **Realist (Naturalist):** Within this framework, the standard *is* objectively real – actions truly *do* promote or hinder the "general good" of a community, and this *is* the basis for moral approval/disapproval. But this "truth" is contingent on the nature of social animals and the evolutionary pressures that formed them.

  Darwin would likely tell Street: *"The dilemma is false. The 'independent evaluative truth' you posit is not independent at all. It is the 'general good,' which is itself the product and goal of the very same selective pressures that shaped our faculties for judging it. There is no 'tracking' of an alien truth, only the emergence of a standard from within the adaptive process itself. My account explains the origin of the judgments and defines the content of the standard in one coherent, naturalistic framework. Your 'adaptive link account' isn't an alternative to realism in my sense; it is the mechanism by which the real standard emerges."* He escapes by rejecting the independence of the moral truth Street assumes realists must posit. His realism is naturalistic and grounded in the functional reality of social evolution.
