      *   **Strengths:** Clear articulation of the supervenience principle and its violation. Explicitly links the asymmetry to the mismatch between psych states and judgment. Correctly frames Knobe's view as seeing this as contamination/mistake needing correction.
      *   **Weaknesses:** Could be *slightly* more explicit that the traditional view is specifically about *intentional action* depending *solely* on the *agent's attitude* (e.g., intending, knowing, desiring the outcome). However, "psychological states alone — his beliefs and desires" captures this well enough. The explanation of *why* philosophers of action cared is clear and complete.
