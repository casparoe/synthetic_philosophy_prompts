      *   **Weaknesses:** Very minor. Could explicitly name the point about "semantic specificity" of "intentionally" as the key reason CCM isn't a rival. The phrase "has nothing specifically to do with the semantics of 'intentionally'" hints at it, but making it explicit strengthens the argument. This is a nuance, not an error.
