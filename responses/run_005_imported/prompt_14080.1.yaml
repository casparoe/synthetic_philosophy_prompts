answer: |-
  Your situation is profoundly difficult, and Strawson's framework offers valuable, nuanced tools for navigating these painful reactive attitudes. Here’s how his key distinctions apply to your family’s reality:

  1.  **Excusing vs. Exempting: The Core Distinction Applied to Dementia**
      *   **Excusing:** Applies to *specific acts* where normal responsibility conditions aren't met *for that act* (e.g., he didn't intend harm, it was an accident, he was coerced). In dementia, you might excuse *some* moments (e.g., genuine confusion leading to a misunderstanding).
      *   **Exempting:** Applies to the *person as an agent* generally, suspending participant reactive attitudes *altogether* because they lack the basic capacities for meaningful interpersonal relationships (e.g., severe psychosis, profound intellectual disability, infancy). **This is your challenge.**
      *   **The FTD Gray Zone:** Your father doesn't fit classic exemption. He retains *some* lucidity, *some* understanding, *some* capacity for connection. Yet, the *cruel behavior is directly symptomatic* (loss of empathy, disinhibition, impaired judgment - core FTD features). Strawson acknowledges this isn't binary.
      *   **Implication:** You likely cannot adopt the *wholesale* objective attitude (viewing him purely as a patient to be managed). However, Strawson's framework forces recognition that **exemption isn't all-or-nothing.** The *degree* to which the *disease* compromises his capacity for reciprocity, empathy, and self-control in *specific moments* or *types of interactions* must be constantly assessed. His "lucid" moments don't negate the disease's impact when symptoms erupt. **Calibration:** When cruelty manifests, actively ask: *"Is this the disease speaking, or is this a choice within his current capacities?"* Given FTD's nature, the answer will often lean heavily towards "the disease," requiring a *partial* suspension of reactive attitudes *for that specific behavior*, even if not for him entirely.

  2.  **Vicarious (Indignation) vs. Personal (Resentment) Attitudes: Protecting Relationships**
      *   **Personal Resentment:** Your direct feeling when *you* are wronged ("He hurt *me*").
      *   **Vicarious Indignation:** Your feeling when *someone else* is wronged ("He hurt *Mom*").
      *   **Strawson's Insight:** Vicarious attitudes are crucial for sustaining the moral community. Your indignation on your mother's behalf affirms her standing and worth. Abandoning it entirely would be a failure of your relationship *with her*.
      *   **Implication:** **Feeling indignation for your mother is necessary and healthy.** It validates her suffering and your bond with her. Suppressing it entirely would be damaging. However, Strawson's framework reminds us that *even vicarious attitudes* must be tempered by considerations of the agent's capacity.
      *   **Calibration:** Allow yourself to *feel* the indignation for your mother. Acknowledge the wrongness of the *act* and her pain. But *directing* the full force of that indignation *at your father as a responsible agent* needs tempering by the exemption considerations above. The target shifts: **The indignation is valid *for the act's impact*, but its force *against him* must be modulated by recognizing the disease's role.** Channel the energy into supporting your mother, not (primarily) into condemning him.

  3.  **Partial Objectivity: Folding it into the Relationship**
      *   **Strawson's Key Point:** We don't have to choose *only* participant *or* objective attitudes. The objective attitude can be "folded into the participant" stance. We can maintain a relationship while acknowledging limitations.
      *   **Implication for FTD:** This is essential. You cannot have a purely "normal" relationship with your father, nor should you treat him like a complete stranger or object. **A hybrid stance is both possible and necessary:**
          *   **In Lucid Moments:** Engage participant attitudes: affection, gratitude, shared memories, light expectations of reciprocity *in that moment*. Enjoy the connection where it exists.
          *   **During Symptomatic Cruelty/Disinhibition:** Consciously shift towards the objective attitude. See the *behavior* as a symptom. Focus on managing the situation (safety, de-escalation), protecting yourself and your mother, and *not taking it personally* as a chosen slight. This doesn't mean no pain, but it means directing the reactive anger *towards the disease*, not solely his agency.
          *   **In General:** Adjust expectations. Don't expect empathy, gratitude, or self-control he cannot muster. Interact with *who he is now*, managing your hopes and reactions accordingly, while cherishing remnants of the past.

  **Calibrating Your Feelings:**

  *   **For Your Indignation (on Mom's behalf):**
      *   **Validate It:** It affirms her dignity and your love for her.
      *   **Temper Its Target:** Recognize the behavior stems from FTD. Your fight is *with the disease and its effects*, not purely with *him* as a wilfully cruel agent. This reduces corrosive hatred while preserving moral concern for your mom.
      *   **Action Focus:** Channel it into practical support for your mother (listening, respite, advocacy, ensuring safety plans).

  *   **For Your Resentment (personal):**
      *   **Acknowledge It:** It's a natural response to being hurt, even if the hurt isn't fully "intended" in the normal sense. Suppressing it is unhealthy.
      *   **Contextualize It:** Consciously frame the hurtful behavior within the FTD symptom profile. "This is the disease attacking me, not (only) my father choosing to." This helps *mitigate* the resentment's intensity and persistence.
      *   **Compartmentalize:** Allow resentment for the *pain caused*, while consciously separating it (as much as possible) from judgments of his *current moral agency* during symptomatic episodes. Feel the hurt, but don't necessarily fuel it with the thought "He *chose* to do this to me."
      *   **Seek Out Lucidity:** Actively engage in moments of connection when possible to balance the hurt. Remind yourself of the man he was/is beneath the disease.
      *   **Self-Protection:** It's morally permissible (and necessary) to set boundaries to *minimize exposure* to harmful behavior, even while understanding its cause. This isn't abandoning him; it's preserving yourself.

  **The Most Important Implications for Your Family:**

  1.  **Rejection of Binary Thinking:** Your father is neither fully responsible nor fully exempt. **Adopt a fluid stance:** constantly assess the degree to which the *disease* is dictating behavior *in the moment* and modulate your reactive attitudes accordingly.
  2.  **Legitimacy of Vicarious Attitudes:** Your indignation for your mother is not only okay but *necessary* for your relationship with her and the moral order. Don't suppress it, but refine its target.
  3.  **Necessity of Partial Objectivity:** To preserve any semblance of relationship *and* your own sanity, you *must* learn to fold the objective attitude (seeing the behavior as symptomatic) into your interactions, especially during symptomatic phases. This is how you love the person while hating the disease.
  4.  **Shifting the "Enemy":** Redirect the energy of resentment and indignation away from your father's compromised agency and towards **managing the disease, protecting yourselves, supporting your mother, and grieving the loss.** The fight is against FTD, not solely against him.
  5.  **Permission for Complex Grief:** Strawson's framework allows you to hold contradictory feelings: deep love and grief for the father you knew/lose, resentment for the pain inflicted, indignation for your mother, and a clinical understanding of the cause – *all at the same time*. You don't have to resolve them into one "correct" feeling.

  This calibration is an ongoing, painful process. It requires immense emotional labor. Strawson doesn't make the pain disappear, but he provides a sophisticated map for understanding your reactions and navigating them with more clarity and perhaps, a little less unnecessary guilt or corrosive anger. Be kind to yourself and your mother as you walk this path. Support groups for FTD caregivers can be invaluable for sharing these complex emotional burdens.
