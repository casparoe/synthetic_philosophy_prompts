  Workplace dynamics matter here. The user acted as a messenger, which is common in hierarchies. However, disseminating unverified info, even from a manager, can have repercussions. The coworkers' reactions indicate that trust was damaged, not because of malice, but because reliance on the info caused inconvenience or stress.

