answer: |-
  This situation highlights a really important distinction that goes beyond simple "lying vs. truth-telling." Both your roommate and sister have valid points, but they're focusing on different aspects of the ethical landscape:

  1.  **Your Roommate is Right About Intent (No Lying/Deception):**
      *   **Lying requires intent to deceive.** You absolutely did not lie. You believed the information was true because your manager, a trusted authority figure, presented it as an established fact. You acted in good faith with no intention to mislead. This is crucial, and it means you are *not* guilty of dishonesty.

  2.  **Your Sister is Right About Responsibility (Potential Wrong in Spreading Unverified Information):**
      *   **"Wrongly asserting something you believe but don't actually *know*" can be problematic, even without intent to deceive.** This is where the nuance lies. The potential "wrong" isn't about dishonesty, but about **epistemic responsibility** (responsibility related to knowledge) and the **impact of your actions**.
      *   **The Core Issue:** You presented information as **certain fact** ("the move *is* happening") based solely on the word of one person (your manager), without any independent verification, especially when the stakes were high (impacting a dozen people's commutes, lives, and planning).
      *   **Why this *can* be seen as a mistake (though not malicious):**
          *   **Over-reliance on Authority:** Even managers can be mistaken, misinformed, or out of the loop (as this case painfully shows). Treating a single source, even a manager, as infallible is risky.
          *   **Lack of Verification (Especially for High-Impact News):** For news this significant, affecting many people's lives, a higher standard of care might be expected. A simple, "Great, thanks for letting us know. Just to be thorough, has the official announcement gone out yet, or should we wait for that before telling our teams?" could have prevented this. You assumed the information was fully vetted because your manager presented it confidently.
          *   **Presenting as Certainty:** By not using any hedging language ("The manager *says* we're moving," "It *looks like* we'll be moving downtown"), you amplified the certainty beyond what your own knowledge base actually justified. You knew *your manager said it*, but you presented it as *the company decided it*.
          *   **The Negative Impact:** Your action, based on unverified information, directly caused confusion, frustration, and potentially wasted planning effort for your colleagues. The harm occurred regardless of your intent.

  **So, Who's "Right"?**

  *   **Your roommate is right** that you didn't lie or intend to deceive. You are morally "in the clear" regarding dishonesty.
  *   **Your sister is right** that there's a meaningful distinction between lying and carelessly spreading unverified information presented as fact. While not malicious, your *action* of passing on high-stakes information as absolute certainty without verifying it (especially given the source's potential fallibility) was a mistake that caused real harm. This is where the potential "wrong" lies – in the *lack of due diligence* given the circumstances, not in the intent.

  **The Difference & Why the Second One Can Be "Wrong":**

  *   **Lying:** Intentionally stating something you believe to be false with the goal of deceiving. (Morally wrong due to intent to deceive).
  *   **Wrongly Asserting as Fact (without intent to deceive):** Stating something as unquestionably true based on insufficient evidence or without reasonable verification, especially when the consequences of being wrong are significant. (Potentially wrong due to **negligence, overconfidence, or lack of due diligence**, leading to harmful consequences).

  **What Makes the Second One "Wrong" (in this context)?**

  1.  **Negligence:** Failing to take reasonable steps to verify important information before disseminating it widely. Given your manager isn't the CEO or ultimate decision-maker, and moves involve many departments (HR, Facilities, IT), some healthy skepticism or a quick verification step was warranted.
  2.  **Harm Caused:** Your action, based on insufficiently verified information, directly caused negative consequences (confusion, frustration, wasted effort, loss of trust) for others.
  3.  **Breach of Implicit Trust:** When you share information authoritatively in a workplace, colleagues trust it's been reasonably vetted, especially from someone in a position like yours. Spreading unverified info, even sincerely, breaks that trust.

  **What This Means for Your Situation:**

  1.  **You Weren't Dishonest:** Hold onto that. You acted in good faith.
  2.  **You Made a Mistake in Judgment:** The mistake was in *how* you handled the information – accepting it as absolute certainty without any verification step and then presenting it to your team with the same level of certainty. The scale of the news demanded more caution.
  3.  **The Primary Responsibility Lies with Your Manager:** **She** is the one who was misinformed and failed to verify the information *before* presenting it as final to her team. **She** is the one who should be clarifying the situation with the whole department and apologizing for the misinformation. The fact that your colleagues are cold with *you* and not directing their frustration upwards is unfair, though understandable in the moment.
  4.  **How to Address It (If you haven't already):**
      *   **Apologize for the *Impact*, not the Intent:** "Hey [Coworker's Name], I wanted to apologize again about the move misinformation. I completely understand why you're frustrated – getting that news and then having it reversed is really disruptive. I was told directly by [Manager's Name] that it was a final decision, and I relayed it in good faith, but I obviously should have double-checked before passing it on given how big a change it is. I'm really sorry it caused you hassle and confusion. I've learned my lesson to verify things more carefully in the future." (This acknowledges their feelings, explains your reasoning without defensiveness, takes ownership of the *aspect* you can control - your diligence - and apologizes for the result).
      *   **Talk to Your Manager (Crucial):** Explain the fallout and how it's impacting team morale and trust. Ask her to clarify the situation officially to the whole department. Suggest that in the future, perhaps announcements like this come with a source or confirmation step before being cascaded.

  **In Conclusion:** You didn't lie, and your intent was pure. However, spreading significant, life-impacting news as absolute fact based solely on the word of one manager, without any attempt at verification, was an error in judgment. The "wrong" here is one of **epistemic negligence leading to harmful consequences**, not deception. The bulk of the blame lies with your manager for giving you the wrong info, but acknowledging the impact of how you relayed it and committing to greater diligence in the future is the mature and constructive path forward.
