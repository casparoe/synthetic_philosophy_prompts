answer: |-
  What you're describing isn't just "whining" – it's a profound and well-documented psychological and organizational phenomenon. You're intuitively sensing a structural shift, and several powerful theoretical frameworks can help diagnose it precisely:

  1.  **Goodhart's Law in Action:** "When a measure becomes a target, it ceases to be a good measure." Your dashboard *is* the target now. Citation counts, grant dollars, and teaching evals are imperfect *proxies* for genuine intellectual contribution, mentorship, and educational impact. By making them the *sole* determinants of reward (raises), the system incentivizes optimizing for the proxy *itself*, often at the expense of the underlying value it was meant to represent. You're not thinking about the argument's quality because the system actively *discounts* quality if it doesn't translate directly into the measured outputs.

  2.  **The Crowding-Out Effect (Self-Determination Theory - SDT):** SDT posits that intrinsic motivation (doing something because it's inherently interesting, enjoyable, or meaningful) is fragile and can be easily undermined by extrinsic motivators (rewards, punishments, evaluations). Your previous motivation – the joy of the argument, the intellectual spark, the satisfaction of creation – was intrinsically driven. The dashboard imposes powerful, salient extrinsic motivators tied directly to survival (raises). This "crowds out" your intrinsic motivation. The work is no longer its *own* reward; it's merely a means to a score. The "box ticked" feeling is the direct result of this motivational shift.

  3.  **Commodification of Knowledge & Alienation:** Your work (research, ideas, teaching) is being transformed from a complex, human, intellectual endeavor into a standardized *commodity* measured in countable units (citations, dollars, eval scores). Marx's concept of alienation applies surprisingly well here:
      *   **Alienation from the Product:** Your papers don't feel like "a thing you made" because their value (in the system's eyes) is divorced from their intrinsic intellectual merit and reduced to their dashboard contribution. You lose ownership.
      *   **Alienation from the Process:** The act of research/writing is no longer enjoyable for its own sake; it's an instrumental process aimed at generating the required commodity (dashboard points).
      *   **Alienation from Others:** Collaboration turns into competition. Your colleague is no longer a fellow traveler in the realm of ideas; he's a potential threat to your relative standing on the leaderboard. Trust and genuine intellectual exchange erode.
      *   **Alienation from Self:** This is the deepest cut – the feeling that you're not doing the work *you* value in the *way* you value it. The "lighting up" is gone because your authentic professional self is suppressed by the demands of the metric.

  4.  **Performance vs. Learning Orientation:** Your focus has shifted from a *learning orientation* (driven by curiosity, mastery, understanding) to a *performance orientation* (driven by proving ability, achieving high scores, avoiding negative judgments). The dashboard explicitly creates a high-stakes performance environment. This narrows focus, discourages risk-taking (risky ideas might not pay off quickly in citations/grants), and undermines the deep exploration that characterized your "coffee hash-out" sessions.

  5.  **Gaming the System & Short-Termism:** Quantified systems inevitably encourage gaming. You might prioritize:
      *   "Salami-slicing" research into multiple minimally-publishable units.
      *   Chasing "hot" topics likely to garner quick citations over deeper, riskier inquiries.
      *   Optimizing teaching for evals (e.g., grade inflation, avoiding difficult topics) rather than deep learning.
      *   Prioritizing grant applications with high success probabilities over more innovative (but riskier) proposals. The system incentivizes short-term gains that boost the *annual* score over long-term, potentially more significant contributions.

  **The Sharper Diagnosis:** Your institution has implemented a **quantified performance management system** that, through the mechanisms of **Goodhart's Law** and the **Crowding-Out Effect**, is **commodifying your intellectual labor**, leading to your **alienation from your work, your colleagues, and your professional self**, while enforcing a **performance orientation** that prioritizes **short-term, measurable gains** over **intrinsic motivation, intellectual depth, authentic collaboration, and long-term scholarly impact.**

  **What Can You Do About It? (Beyond Despair)**

  1.  **Name It:** Simply articulating these mechanisms (Goodhart, Crowding-Out, Alienation) is powerful. Share this analysis with trusted colleagues. Recognizing the *system* as the source reduces personal blame and fosters solidarity.
  2.  **Carve Out "Unquantified" Space:** Consciously protect time for activities the dashboard ignores but that feed your soul and intellect: deep reading unrelated to immediate projects, genuinely collaborative "coffee hash-outs" *without* sizing up, mentoring students beyond evals, exploring risky ideas. Frame this as essential maintenance for your long-term health and creativity.
  3.  **Reconnect with Intrinsic Values:** Before starting a project, ask: *Why am I* intrinsically *interested in this?* Revisit past work that excited you. Keep a private journal reflecting on intellectual joy and discovery, separate from outcomes.
  4.  **Build Counter-Culture Networks:** Find colleagues (within or outside your dept) who also resist the metric tyranny. Create spaces for genuine intellectual exchange, support, and celebration of work *for its own sake*. Collaborate on projects driven by shared curiosity, not dashboard potential.
  5.  **Strategic Engagement:** You can't ignore the dashboard entirely. Be *strategic*: allocate effort to meet the minimum "survival" metrics required, freeing up mental energy for your intrinsically valuable work. Treat it like a bureaucratic tax, not the purpose of your job.
  6.  **Advocate (Carefully):** When opportunities arise (faculty meetings, committees), articulate the *costs* of this system using the frameworks above. Focus on long-term scholarly health, innovation, mentorship quality, and retention. Propose supplementing metrics with qualitative assessments (narrative CVs, peer review of teaching/research impact).
  7.  **Protect Your Identity:** Consciously remind yourself: "I am more than my dashboard score." Anchor your professional identity in your values, your intellectual passions, your relationships with students and true colleagues, and the *quality* of your thinking.

  This isn't just "how big institutions work"; it's a specific, harmful application of management logic to a domain (knowledge creation and education) where it fits poorly. Recognizing the precise mechanisms gives you the tools to understand your feelings, resist the worst effects, protect your intrinsic motivation, and find pockets of meaning within the system. The soul-crushing feeling is a valid response to a system designed to optimize the countable at the expense of the meaningful. Your task is to fiercely protect the meaningful.
