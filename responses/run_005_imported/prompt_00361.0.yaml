  First, they mention shifting focus from argument quality to whether it "counts" for the annual score. This shows intrinsic motivation is being replaced by extrinsic validation. They also note reduced collaboration—now sizing up colleagues as competitors. Their partner observes they've lost passion for their own work. Even journal publications feel like checking boxes. 

