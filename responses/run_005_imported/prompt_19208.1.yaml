  First, resizing errors: Neurath would see bubble charts as fundamentally corrupt because area scaling distorts linear relationships. A 2x diameter bubble shows 4x area—exactly the perceptual error he banned. His coal wagon example directly applies. 

  Second, the transformer/artist split: Modern design tools let creators bypass specialization. An influencer making an infographic carousel acts as transformer, artist, and rhetorician simultaneously. Neurath would call this "bias baked in at every level." 

  Third and most damning: argumentative visuals. Those "here's why this policy is evil" carousels fuse facts with moral claims, violating his core axiom. For Neurath, such slides aren't flawed Isotype—they're outside the category entirely. 

  But the user also hints at a deeper tension: Isotype's purity versus real-world communication needs. Maybe note that Neurath might grudgingly acknowledge some modern uses (e.g., COVID dashboards with strict icon arrays) while rejecting most. Still, his standards were uncompromising—we shouldn't pretend he'd adapt. 

