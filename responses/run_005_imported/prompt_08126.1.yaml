  Invent a genuinely new coincident-objects case for me: two things exactly coincident (same matter, same parts, same location, same causal powers for as long as they coexist) that seem to have different modal or persistence properties, so Leibniz's Law says they can't be strictly identical - but from a totally different domain than sculpture, ships, or animals/bodies. Push on the grounding problem too: make it as hard as possible to say what grounds that modal difference, given the two things are indiscernable in every non-modal respect while coincident. Lay out the case, say which thing is playing "clay" and which is "statue", then be honest about whether it actually improves on the classic examples or just relocates the same intuition pump.
