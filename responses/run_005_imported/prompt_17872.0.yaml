prompt: |-
  Me and my friend spent like two hours arguing last night about Pascal's line that justice without force is powerless, force without justice is tyrannical. He reckons it makes Pascal a proto-Hobbesian: justice just is whatever force manages to establish, and all the "true justice" talk is politically inert. I brought up the three-orders/tyranny fragment, where Pascal says its a category error to think being strong entitles you to being loved or feared, but he says that's about personal esteem, not law. Anyway, I've got a political theorist coming onto my little history-of-political-thought podcast to defend basically his reading in her new book, and I want to press harder than I managed to last night. Draft me 7-8 interview questions that don't just let her restate the thesis: I want one that makes her reconcile the tyranny fragment with the justice/force fragment, one on whether the "raison des effets" stuff (simple people vs. demi-habiles vs. habiles) smuggles back a real, if elitist, justification for obeying law beyond sheer force, and one on whether yanking these fragments out as free-standing political theory ignores that the Pensées were notes toward an apology meant to humble reason before faith. For each, note the reply she'll probably give plus a follow-up keyed to it, and end on a question about which fragment would be the hardest evidence against her own reading.
