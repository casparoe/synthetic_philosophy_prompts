  Then Priti's dilemma defense: the chip needs prediction. If determinism is true, the case assumes compatibilism (which is contested). If indeterminism, prediction fails, so alternatives exist. This is clever—it forces Nate to either beg the question or admit alternatives. 

  Nate's move 4 with a parallel deterministic process avoids prediction. But here's where I need to think deeper. Even with a parallel process, if it's deterministic, the outcome is still determined. But Priti's point was that without indeterminism, you're assuming compatibilism. Nate's setup might dodge prediction but not the underlying issue of determinism vs. responsibility. 

