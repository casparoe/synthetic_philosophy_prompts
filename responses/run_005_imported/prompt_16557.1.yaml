answer: |-
  Here’s an original example targeting **gratitude**, with the normative property being **being a fitting object of gratitude**. I’ll walk through it step-by-step, then flag where it might strain against the classic demon/mud case.

  ---

  ### **The Case: The Extortionate Benefactor**  
  **Attitude:** Gratitude (a feeling of thankfulness and appreciation directed toward a benefactor).  
  **Normative Property:** *Being a fitting object of gratitude* (i.e., deserving gratitude due to one’s actions or intentions).  

  **Scenario:**  
  A reclusive billionaire, Elena, learns that a small community theater group is about to collapse due to debt. She offers them a grant large enough to save the theater *only if* the director, Leo, publicly expresses profound, heartfelt gratitude to her in a televised ceremony. Crucially:  
  - Elena has no genuine interest in the arts; her sole motive is to feed her narcissism.  
  - She secretly caused the theater’s financial crisis by manipulating their investors (unknown to Leo).  
  - Without her grant, the theater closes, and 50 people lose their jobs.  

  Leo gives a moving speech praising Elena’s "generosity," feeling and expressing intense gratitude.  

  ---

  ### **Analysis**  
  1. **The "Wrong Kind" Reason**:  
     Leo has a **strong, pragmatic reason** to feel and express gratitude: *If he doesn’t, the theater collapses, and dozens suffer*. This reason is "external" to Elena’s character or actions—it stems from the *consequences of not adopting the attitude*, not from features that make gratitude fitting.  

  2. **Why the Reason Fails to Make Gratitude Fitting**:  
     - **Fittingness Conditions for Gratitude**:  
       Gratitude is fitting when:  
       (i) The benefactor intentionally confers a benefit,  
       (ii) Motivated by goodwill (or at least non-malicious reasons),  
       (iii) At some cost or effort to themselves.  
       Here, Elena *intentionally harmed* the theater first (violating ii), acted purely for self-aggrandizement (violating ii), and incurred no real cost (violating iii). Her "benefit" merely reverses her own sabotage.  
     - **The Mismatch**:  
       Leo’s reason to be grateful (saving jobs) is purely *instrumental*: gratitude is a tool to secure an outcome. It doesn’t engage with whether Elena *deserves* gratitude. Even if Leo’s gratitude feels sincere (due to relief), it responds to the *theater’s survival*, not Elena’s character. The fittingness of gratitude depends on the *benefactor’s qualities*, not the *recipient’s desperation*.  

  3. **Why the Reason is Merely "Prudential"**:  
     Holding the attitude is advantageous for Leo (it saves the theater), but this advantage doesn’t transform Elena into a truly admirable or grateful-worthy person. The reason is "prudential" (avoiding harm) rather than "fittingness-related" (recognizing moral merit).  

  ---

  ### **Where the Analogy to the Demon/Mud Case Might Strain**  
  While structurally similar, this case introduces complexities not present in the demon scenario:  
  1. **Attitudinal "Spillover"**:  
     - In the demon/mud case, desiring mud has no inherent moral weight. Here, *expressing* gratitude (even if unfitting) has real-world consequences: it validates Elena’s manipulation and may encourage similar acts. This blurs the line between "fittingness" and "practical rationality."  
     - **Why it strains**: The demon/mud problem treats desire as a "self-contained" attitude. Gratitude, however, is inherently relational and social—its expression affects others. This makes it harder to isolate "pure" fittingness.  

  2. **Overdetermination of the Attitude**:  
     - Leo might *also* feel gratitude for the jobs saved (a fitting response to an outcome), but this conflates gratitude *for an outcome* with gratitude *toward an agent*. The fitting-attitude theory must separate "gratitude-that" (the theater survived) from "gratitude-to" (Elena).  
     - **Why it strains**: The mud case involves a simple attitude (desire) toward one object (mud). Gratitude has multiple layers (agent, act, outcome), creating ambiguities the demon example avoids.  

  3. **Moral Residue**:  
     - Even if Elena’s motives are vile, the theater group *did* receive a net benefit (after her sabotage). This might generate *some* fitting gratitude for the outcome, muddying the "all-or-nothing" structure of the mud case.  
     - **Why it strains**: The demon/mud case is binary (mud is worthless; reason is purely external). Here, the "benefit" is real (though poisoned), making it harder to dismiss all reasons for gratitude as "wrong-kind."  

  ---

  ### **Key Takeaway**  
  This case successfully extends the wrong-kind-of-reasons problem to gratitude: Leo’s pragmatic reason (saving the theater) is the "wrong kind" because it doesn’t engage with Elena’s character—the only thing that could make gratitude *fitting*. However, gratitude’s social nature complicates the analogy, as unfitting gratitude can still have moral ripple effects (e.g., empowering manipulators) that desire for mud lacks. This suggests that for socially embedded attitudes, separating "right" from "wrong" kinds of reasons may require additional tools (e.g., analyzing the attitude’s social function). 

  Would you like to explore a case for another attitude (e.g., contempt or trust)?
