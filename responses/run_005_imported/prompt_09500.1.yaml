answer: |-
  Here’s a toast that threads the needle: warm enough for family, layered enough for newsroom lifers, and quietly honest for Frank. It runs about 4-5 minutes when spoken naturally. The key is using Frank’s own language against the subtext only he (and a few others) will fully grasp.

  ---

  **(Clink glass gently. Warm smile.)**  

  "Alright, settle down. Some of you know I’ve been drafting this toast in my head since Frank’s retirement announcement… which, true to form, he fact-checked for typos before letting HR send it out. *(Light laughter)*  

  For over thirty years, Frank didn’t just work at this paper. He was its **conscience**. And if you’ve ever been on the wrong side of that conscience? *(Nods toward veteran reporters)* Yeah. You remember. That icy stare over the rim of his coffee mug. The sigh that could make a Pulitzer winner feel like an intern scrambling for corrections.  

  Frank’s famous lecture – the one generations of reporters got within their first week – always circled back to the same commandment: *‘The truth is messy. Your job isn’t to tidy it up.’* A single smoothed-over quote? An invented detail for ‘color’? **The cardinal sin.** Unforgivable. Career-ending. Because once you fake the small thing, he’d say, the big things crumble. The trust. The purpose. The whole point of why we do this.  

  *(Pause. Slight shift in tone – more reflective, less punchline-driven)*  

  And you know what? He wasn’t wrong. That insistence on rigor, that almost painful clarity? It shaped this place. It shaped *us*. It made reporters triple-check facts they already knew cold. It made editors question assumptions that felt like gospel. It made this messy, stubborn, vital institution *better*. Frank held us to a standard – relentlessly, infuriatingly, *necessarily* – because he believed, down to his bones, that the story only matters if it’s true. That the words carry weight only if they’re earned.  

  *(Turn slightly more directly toward Frank, warmth returning but grounded)*  

  So, Frank… tonight, we raise a glass to that fierce, uncompromising integrity. To the editor who’d rather have a hole in tomorrow’s front page than a sentence that smelled even faintly of bullshit. *(Raise glass slightly)* To the man who taught us that getting it right isn’t just part of the job – it *is* the job.  

  *(Brief pause. Slight smile. This is the key moment – the line only Frank and the oldest veterans will truly *feel*)*  

  **It’s a rare thing, Frank, to build a legacy with such absolute clarity. To draw a line in the sand so deep, so indelible… that it becomes the ground everyone else stands on.**  

  *(Let that hang for just a beat. Then pivot smoothly to warmth and family)*  

  Of course, to his wonderful family here tonight… you probably know a different Frank. The Frank who tells terrible puns at Thanksgiving. The Frank who maybe *doesn’t* fact-check grandkids’ bedtime stories for historical accuracy. *(Gentle laughter)* The Frank who’s just… Dad. Grandpa. A sweet, funny guy who used to work at a newspaper.  

  But here’s the secret: that Frank? The one you love? He’s the same guy. That fierce integrity wasn’t an act. It was conviction. It was caring *that much* about getting it right. Even when it made him the villain in the newsroom horror story du jour. *(Smile at Frank)* And while it might have driven us nuts when he’d kill our favorite turn of phrase because it ‘implied causality not supported by the data’… *(shake head, fondly)* … deep down, we knew. We knew we were better for it.  

  So, Frank… as you leave the daily grind of holding our feet to the fire, know this: Your line in the sand? It’s still here. That cardinal sin lecture? We’re still giving it. Maybe with slightly less dramatic flair… but it’s there. Because you taught us what matters. You showed us the cost of cutting corners, and the immeasurable value of getting it *right*.  

  **To Frank.** A journalist of unwavering principle. A mentor who demanded our best. And a truly, deeply… *consistent* man. *(Meaningful, warm eye contact with Frank)* May your retirement be filled with grandkids, bad puns, and stories you don’t have to edit. Cheers!"  

  **(Clink glasses. Sustained applause.)**  

  ---

  **Why this works:**

  1.  **Honesty Without Exposure:** The toast *celebrates* Frank's stated principles and impact. The loaded lines ("absolute clarity," "indelible line," "consistent man") sound like pure praise to family/newer staff. But Frank (and any old-timer who *really* knew his early rep) will hear the echo of his own hypocrisy. It’s an *acknowledgment* to him, not a public shaming.
  2.  **Leverages His Own Language:** Using "cardinal sin," "getting it right," "line in the sand," "truth is messy" – these are Frank's weapons turned into his tribute. The irony is built from his own words.
  3.  **Respects the Room:** Family hears love and admiration for Dad/Grandpa. Newsroom hears the legend honored, warts-and-all understanding implied but never stated. Only Frank (and maybe 1-2 others) gets the full subtext.
  4.  **Centers the Positive Impact:** It genuinely acknowledges the *good* his rigidity did for the paper and reporters. This isn't a takedown; it's a recognition that even flawed people leave important legacies.
  5.  **The "Consistent" Nod:** This is the masterstroke. "Consistent" sounds warm and positive. But in context, after emphasizing his absolute, unwavering stance on fabrication, it hits Frank with the quiet weight of his own contradiction. He’ll know *exactly* what you mean.
  6.  **Tone:** Warm, respectful, genuinely appreciative of his contributions, with appropriate humor (the fact-checked retirement note, the family vs. newsroom Frank, the grandkids' stories). The serious moments land without being maudlin or accusatory.

  **Delivery Tip:** When you hit the key lines ("absolute clarity," "indelible line," "consistent man"), make solid, calm eye contact with Frank. Don't smirk. Don't emphasize them oddly. Say them with the same warm conviction as the rest. The power is in the *meaning he will attach to them*, not in your delivery telegraphing a hidden message to the room.

  This toast lets you look Frank in the eye, honor the good he did, acknowledge the complicated truth you carry, and let *him* sit with the quiet resonance of his own legacy – all while giving his family a lovely tribute and the newsroom a fitting send-off for a formidable editor. Good luck. Frank trained you well for this moment.
