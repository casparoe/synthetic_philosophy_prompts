answer: |-
  Here are eight targeted questions addressing key pressure points, each with a follow-up designed to challenge the "understanding vs. true belief" distinction and other potential weaknesses. They draw directly on the literature challenges you outlined:

  1.  **Question (Moral Education - Children):** Your pessimism seems challenged by early moral education. Parents routinely tell young children "Hitting is wrong" or "Sharing is good," and this testimony appears not just permissible but *essential* for their moral development. How can pessimism account for the apparent justification and knowledge children gain from this testimony, given they often lack the capacity for deep, independent reasoning about the relevant reasons at that stage?
      *   **Likely Reply:** Appeal to the distinction: This testimony provides *correct behavioral guidance* or *proto-beliefs*, not full moral knowledge/justification. Full justification requires developing one's *own* grasp of reasons later.
      *   **Follow-up:** If children lack genuine moral justification/knowledge until they later reconstruct the reasons independently, doesn't this imply that the vast majority of their early "moral" actions (based on parental testimony) are *not* morally well-motivated? Isn't this consequence deeply counterintuitive, and how does it avoid collapsing into skepticism about childhood morality altogether? (Targets: Elizabeth Harman, Alison Hills)

  2.  **Question (Asymmetry Challenge - Epistemic Parity):** Pessimists argue moral testimony differs fundamentally from empirical testimony (e.g., medicine). But why think the need for "grasping reasons" is unique to ethics? Don't experts in complex empirical fields (like climate modeling or advanced physics) also need to grasp underlying models/reasons for *robust* justification? If deferring to a doctor *can* give me justified belief about my diagnosis without deep understanding, why can't deferring to a moral expert give me justified belief about, say, the permissibility of a complex economic policy?
      *   **Likely Reply:** The asymmetry lies in the *nature* of justification. Empirical belief justification is primarily about truth-tracking, achievable via reliable testimony. Moral justification is constitutively tied to *practical agency* – acting for the *right reasons* – which testimony cannot supply.
      *   **Follow-up:** Doesn't this concede that testimony *can* provide *true moral belief* reliably (if the source is good)? If so, isn't the core optimist claim – that testimony *can* confer justified moral *belief* – essentially vindicated? Your objection then seems shifted to a claim about *moral worth* or *virtuous action*, not *epistemic justification* per se. (Targets: Robert Hopkins, Philip Nickel, Sarah McGrath)

  3.  **Question (Aesthetic Testimony Parallel):** The debate over aesthetic testimony (e.g., "This painting is beautiful") mirrors the moral debate. Critics argue pessimism about aesthetic testimony faces similar problems (e.g., art education). If you maintain pessimism in ethics, must you also endorse it in aesthetics? If not, what breaks the parallel? If so, how do you handle the intuition that art critics *can* legitimately inform our aesthetic judgments?
      *   **Likely Reply:** Likely argues the parallels hold; aesthetic understanding also requires personal engagement/grasp. Testimony might guide attention but not supply full aesthetic appreciation/justification.
      *   **Follow-up:** Doesn't this consistency come at a high cost? Consider cases where someone reliably defers to a trusted art critic and develops a rich appreciation for art they initially disliked, eventually coming to see the reasons *because* of the initial deferral. If testimony reliably initiates a process leading to understanding, isn't it playing a justificatory role? Doesn't this suggest a pathway pessimism struggles to accommodate? (Targets: James Shelley, Aaron Meskin)

  4.  **Question (Urgent Decision - Concrete Case):** Imagine Anya faces an immediate, high-stakes moral dilemma: she witnesses a complex altercation where intervention seems necessary but could easily escalate harm. She has seconds to decide. A trusted, morally wise friend beside her instantly says, "Don't intervene, call the authorities!" Anya defers. According to pessimism, is Anya's resulting belief ("I shouldn't intervene") unjustified? And was her deferential *action* morally deficient?
      *   **Likely Reply:** Perhaps distinguishes: The action might be *permissible* or *excusable* given the urgency, and the belief might be *true* and *pragmatically useful*, but it lacks *full moral justification* or *moral worth* because Anya didn't act from her own grasp of the reasons. Optimally, she'd reflect later.
      *   **Follow-up:** This seems to prioritize an ideal (individual understanding) over the demands of the actual situation. If Anya *couldn't* have grasped the reasons in time, and deferring led to the best outcome, isn't her reliance on testimony not just excusable but *epistemically rational* and *morally sensible*? Doesn't pessimism risk being practically inert or even counterproductive in non-ideal, time-pressured contexts? (Targets: Karen Jones, Alison Hills on non-ideal theory)

  5.  **Question (The "Understanding" Distinction - Scope):** You frequently distinguish acquiring a true moral belief from acquiring moral understanding, arguing testimony can only supply the former. But critics argue this distinction doesn't rescue pessimism. If testimony *can* reliably provide true moral belief (as you seem to concede when sources are good), haven't you granted the core epistemic claim of the optimist? Isn't the "understanding" requirement then imposing an *extra* condition on moral knowledge/justification beyond what we demand in other domains?
      *   **Likely Reply:** Reiterates that moral justification/knowledge *just is* tied to understanding in a way empirical justification isn't. Understanding isn't an "extra"; it's constitutive of the epistemic state in the moral domain.
      *   **Follow-Up:** This constitutive claim is precisely what optimists deny. They argue justification is primarily about reliable belief-formation, achievable via testimony. By insisting on understanding as constitutive, aren't you simply *defining* pessimism into existence rather than *arguing* for it against the optimist's conception of justification? How do you *demonstrate* that moral epistemology *must* include this understanding condition? (Targets: Standard internalist vs. externalist debates applied to ethics)

  6.  **Question (The "Understanding" Distinction - Pathway):** Even granting that *immediate* testimony doesn't supply understanding, can't moral testimony be a *catalyst* or *essential starting point* for *developing* moral understanding? A child hears "stealing is wrong," later reflects and grasps reasons of fairness/rights. An adult hears a novel argument from a trusted source, reflects, and integrates it. Doesn't testimony often play an indispensable *justificatory role* in the *process* of *coming to understand*?
      *   **Likely Reply:** May concede testimony can be a *heuristic* or *pointer*, but the justificatory work is done by the *subsequent reflection*, not the testimony itself. The testimony merely provides content to reflect *on*.
      *   **Follow-up:** But without the initial, trusted testimony, the reflection wouldn't have occurred *on that specific moral point* or might have started from a flawed premise. If the testimony is a reliable trigger for a reliable process (reflection) that leads to understanding, doesn't the testimony inherit justificatory force within that causal chain? Isn't it playing a more robust epistemic role than just being inert "content"? (Targets: Hills on the process of understanding, Linda Zagzebski on epistemic authority)

  7.  **Question (Pessimism and Moral Expertise):** Pessimism seems to undermine the practical relevance of moral expertise. If we shouldn't (or cannot epistemically) defer to moral experts for justified belief, what *is* the role of the moral expert? Is their function solely to *provoke* our own reasoning, rather than to *inform* our beliefs? Doesn't this seem unduly restrictive?
      *   **Likely Reply:** Experts can clarify concepts, point out relevant considerations, highlight inconsistencies, model reasoning, and help us see implications – all aiding *our own* process of understanding. Their role is Socratic, not oracular.
      *   **Follow-up:** While valuable, doesn't this Socratic role *still* involve a form of epistemic dependence? When an expert points out a crucial consideration I missed, isn't my belief that *this is a relevant consideration* often based on *trusting their expertise* in identifying salient moral features? Doesn't this trust play a justificatory role, even if not a final verdict? (Targets: David Archard, Julia Driver)

  8.  **Question (Pessimism and Moral Progress/Disagreement):** If individuals cannot gain justified moral beliefs via testimony, how do you explain large-scale moral progress that often relies on the testimony of reformers (e.g., testimony about the injustice of slavery or sexism)? Doesn't pessimism imply that widespread acceptance of such testimony only constitutes justified belief *after* individuals independently grasp the reasons, potentially slowing progress? Conversely, doesn't pessimism make intractable moral disagreement *harder* to resolve by downplaying legitimate deference to recognized experts or communities?
      *   **Likely Reply:** Progress occurs through public reason-giving, dialogue, and individuals gradually coming to see the force of arguments. Testimony spreads the *arguments*, not justified belief. Deference wouldn't resolve deep disagreement anyway.
      *   **Follow-up:** But isn't the *initial uptake* of reformers' arguments often based significantly on their *moral credibility* or standing within a community (a form of testimonial authority), especially for those lacking time/resources for deep independent analysis? Doesn't pessimism risk portraying moral progress as requiring an unrealistic level of individual philosophical engagement from the masses? (Targets: Miranda Fricker on epistemic justice, social epistemology)

  **Key Strategies in these Questions/Follow-ups:**

  *   **Concrete Cases:** Using specific scenarios (children, urgent decisions) to highlight counterintuitive consequences.
  *   **Concession Exploitation:** Pushing on the guest's likely concession that testimony *can* provide true belief/reliable guidance, asking why this isn't sufficient for justification.
  *   **Distinction Pressure:** Repeatedly challenging whether the "understanding" distinction does the work claimed – does it salvage pessimism or concede the epistemic ground and shift the debate?
  *   **Practicality/Non-Ideal Theory:** Emphasizing real-world constraints (time, capacity) that make pessimism seem impractical or overly demanding.
  *   **Parallel Domains:** Leveraging the aesthetic debate and complex empirical deference to challenge uniqueness.
  *   **Broader Implications:** Questioning the impact on moral expertise, education, progress, and disagreement.
  *   **Targeting Core Claims:** Forcing clarification on whether the objection is truly epistemic (justification) or about moral worth/virtue.

  These questions should push the discussion beyond introductory motivations and engage directly with the most potent objections in the literature, while rigorously testing the resilience of the understanding/true belief distinction. Good luck with the interview!
