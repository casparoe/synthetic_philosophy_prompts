prompt: |-
  I'm a journalist who covers science and ideas, and for the past three years I've also served on the judging panel of a national science-writing prize. Each year nine of us rank a shortlist of five finalists, and the winner is determined by Borda count: points are assigned by rank and summed across judges. This cycle we learned that a bloc of judges affiliated with a rival outlet, anxious that their own nominee would lose, ranked the presumptive front-runner near the bottom of their ballots even though they privately rated her work second-best overall -- a textbook "burying" maneuver that handed the prize to someone else. The panel is now split: one faction wants to replace Borda count with a Condorcet method or approval voting to make this harder to pull off, while another insists that's wasted effort, since the Gibbard-Satterthwaite theorem already guarantees that any ranking-based rule we could adopt is manipulable by someone, so we might as well keep the system we know. I need to circulate a short memo before next month's meeting that actually recommends what we should do, with a timeline for implementing it, and that takes the second faction's objection seriously rather than brushing past it. Could you draft that memo?
reasoning: |-
  We are addressing a situation where a bloc of judges manipulated the Borda count by "burying" the front-runner. The panel is split between changing the voting system and keeping Borda count because of the Gibbard-Satterthwaite theorem (which states that any non-dictatorial voting system with at least three alternatives is susceptible to strategic voting). 

  We need to recommend a course of action that:
  1. Acknowledges the Gibbard-Satterthwaite theorem but also recognizes that not all voting systems are equally manipulable.
  2. Proposes a change to a system that is less vulnerable to the specific type of manipulation we experienced (burying).
  3. Provides a timeline for implementation.

  Options to consider:
  - Condorcet methods: They elect the candidate that would beat every other candidate in a head-to-head matchup. However, they can be complex and may have cycles (though we have only five finalists, so cycles are manageable). Condorcet methods are generally considered resistant to burying.
  - Approval voting: Each judge approves any number of candidates, and the candidate with the most approvals wins. This is simple and resists burying because you cannot harm a candidate by approving them (so there's no incentive to bury). However, it does not capture rankings.

  Given the context, I recommend approval voting because:
  - It is simple to understand and implement.
  - It eliminates the incentive to "bury" a candidate because judges can approve both their favorite and the front-runner if they honestly think both are good. In fact, approval voting is strategy-proof in the sense that it is always safe to vote honestly (by approving all candidates you like better than the expected outcome) but note that it is not entirely strategy-free. However, the type of manipulation we saw (burying) is not possible.

  Alternatively, if the panel values the ranking information, we might consider a Condorcet method (like Ranked Pairs or Schulze). But note that Condorcet methods can be more complex to explain and count.

  Given the urgency and the need for a simple solution, approval voting is a strong candidate. However, we must also consider that the panel is used to rankings. Another option is to switch to a Condorcet method but with a clear explanation.

  But note: The Gibbard-Satterthwaite theorem applies to ranked voting systems. Approval voting is not a ranked system (it is a cardinal system) and thus falls outside the theorem's scope. It is, however, still manipulable in theory (by deciding where to set the approval threshold), but the type of manipulation we saw (burying) is not applicable.

  Recommendation:
  We propose to switch to approval voting for the next cycle. This change is straightforward and can be implemented quickly. We also note that if the panel wishes to retain the ranking, we could consider a Condorcet method as an alternative, but that would require more time for education and implementation.

  Timeline:
  - Next meeting: Present the memo and have a discussion and vote on the new system.
  - If approval voting is chosen: 
     - One month after the meeting: Draft new guidelines for judges (each judge can approve as many candidates as they find deserving; the candidate with the most approvals wins).
     - Two months before the next cycle's deadline: Communicate the new system to the judges and provide examples.
  - If Condorcet method is chosen (as a backup if approval is rejected):
     - We would need to select a specific Condorcet method (e.g., Schulze) and then spend time educating the judges and developing a counting procedure. This would take longer.

  However, given the time until the next cycle, we can implement approval voting quickly.

  Memo Draft:

  ---

  **MEMORANDUM**

  To: Science Writing Prize Judging Panel  
  From: [Your Name]  
  Date: [Current Date]  
  Subject: Reform of Voting Procedure for the Science Writing Prize  

  ### Background
  In the most recent judging cycle, we encountered a situation where a bloc of judges strategically ranked a strong candidate (the presumptive front-runner) lower than their honest assessment in order to benefit their own nominee. This "burying" tactic altered the outcome and undermined the integrity of the Borda count system we currently use.

  The panel is now divided on how to respond. One group advocates changing the voting system to prevent such manipulation, while another argues that the Gibbard-Satterthwaite theorem (which states that any ranked voting system with three or more options can be manipulated) makes such efforts futile.

  ### Analysis
  While the Gibbard-Satterthwaite theorem correctly notes that no ranked voting system is immune to all forms of strategic voting, it does not imply that all systems are equally vulnerable to every type of manipulation. Our experience was a specific form of manipulation ("burying") that is particularly effective under Borda count. Alternative systems can be designed to be more resistant to this tactic.

  ### Recommendation
  We recommend replacing the Borda count with **approval voting** for the following reasons:

  1. **Resistance to Burying**: In approval voting, each judge independently approves as many candidates as they find deserving. There is no incentive to "bury" a strong candidate because approving a candidate cannot harm them (only failing to approve can). Judges can honestly approve all candidates they consider prize-worthy without fear of helping a rival.

  2. **Simplicity**: Approval voting is easy to understand and implement. Judges simply indicate which entries they approve. The winner is the candidate with the most approvals.

  3. **Outside Gibbard-Satterthwaite**: Approval voting is not a ranked system and therefore falls outside the scope of the theorem. While it is not entirely strategy-free (judges might adjust their approval threshold based on expectations), the type of manipulation we experienced is eliminated.

  4. **Proven in Similar Contexts**: Approval voting is used by many academic and professional societies for awards and elections, and it is known for producing broadly acceptable outcomes.

  If the panel values the ability to rank candidates and is willing to accept a more complex system, we could consider a Condorcet method (such as Ranked Pairs or Schulze). These methods are less vulnerable to burying because they rely on head-to-head matchups. However, they require more effort to explain and compute. Given the urgency and the need for simplicity, we believe approval voting is the best immediate solution.

  ### Timeline
  We propose the following timeline for implementation:

  - **Next Month's Meeting**: Discuss and vote on switching to approval voting (or, if there is strong opposition, consider Condorcet methods). 
  - **Within One Month of Approval**: Draft and circulate new voting guidelines to the panel. 
  - **Two Months Before Next Cycle's Deadline**: Conduct a brief training session for judges (if necessary) and provide examples of the new ballot.

  ### Conclusion
  The Gibbard-Satterthwaite theorem should not paralyze us into inaction. While no system is perfect, approval voting offers a substantial improvement over Borda count in resisting the burying tactic that marred our last cycle. We urge the panel to adopt approval voting for the next cycle to restore fairness and integrity to our prize.

  We welcome discussion at the upcoming meeting.

  ---
answer: |-
  ### MEMORANDUM  
  **To:** Science Writing Prize Judging Panel  
  **From:** [Your Name], Journalist & Panel Member  
  **Date:** [Current Date]  
  **Subject:** Reform of Voting Procedure for the Science Writing Prize  

  #### **Background**  
  As judges, we witnessed a deliberate manipulation of our Borda count system last cycle: a bloc ranked the presumptive front-runner artificially low ("burying") despite privately rating her second-best. This altered the outcome and undermined trust. The panel is now divided on whether to reform our voting method or retain Borda count, citing the Gibbard-Satterthwaite theorem (GS), which proves *all* ranked voting systems can be manipulated. This memo acknowledges GS but argues for change—not because we can achieve perfection, but because we can significantly reduce specific vulnerabilities.  

  #### **Why Gibbard-Satterthwaite Isn’t a Dead End**  
  GS is correct: no ranking-based system is fully strategy-proof. However, it does **not** imply all systems are equally manipulable or vulnerable to the *same* tactics. Borda count is notoriously prone to "burying" (lowering a strong rival) and "compromising" (elevating a weak candidate). Alternatives like Condorcet or approval voting resist these specific tactics far better:  
  - **Borda’s flaw**: Points-based tallying amplifies incentives to bury front-runners.  
  - **Condorcet methods** (e.g., Ranked Pairs): Elect candidates who win head-to-head matchups against all others. Burying is harder because ranks matter only in pairwise comparisons.  
  - **Approval voting**: Judges select *all* acceptable entries (no rankings). Burying is impossible—you can’t harm a candidate by approving them.  

  GS guarantees no system is invulnerable, but we can choose one where manipulation is:  
  - **Less effective** (e.g., burying rarely changes outcomes under Condorcet).  
  - **Riskier** (e.g., strategies often backfire in Condorcet).  
  - **Simpler to deter** (e.g., approval voting has fewer incentives to cheat).  

  #### **Recommendation: Adopt Approval Voting**  
  I propose we transition to **approval voting** next cycle:  
  1. **Effectiveness**: Judges approve every entry they deem prize-worthy (e.g., "Top 3 of 5"). The entry with the most approvals wins.  
  2. **Advantages**:  
     - **Neutralizes burying**: Approving a strong rival doesn’t hurt your favorite.  
     - **Simplicity**: Easier to explain, tally, and audit than Borda or Condorcet.  
     - **GS-compatible**: Approval voting falls outside GS (it’s non-ranked), but even if viewed as ordinal, its strategy-proofness is superior for binary choices.  
     - **Proven**: Used by the Mathematical Association of America, IEEE, and *Science* magazine for awards.  
  3. **Why not Condorcet?** While robust, Condorcet is complex to compute and explain (e.g., cycles may require tiebreakers). Approval voting offers comparable anti-burying strength with near-zero learning curve.  

  #### **Timeline for Implementation**  
  - **Next Month (Meeting)**: 30-minute discussion/vote on approval voting.  
  - **1–2 Months Post-Approval**:  
    - Finalize ballot design (e.g., checkboxes for each finalist).  
    - Update judging guidelines: "Select all entries worthy of the prize."  
    - Test tallying via sample ballots.  
  - **3 Months Post-Approval**: Brief judges at the next cycle’s kickoff.  
  - **Next Cycle**: Implement approval voting.  

  #### **Addressing the "Why Bother?" Objection**  
  GS warns us that no ranked system is perfect, but it doesn’t condemn us to futility. Retaining Borda because "all systems are manipulable" is like refusing to fix a leaky roof because "all roofs decay." We know Borda is *acutely* vulnerable to burying—and we’ve seen it exploited. Approval voting reduces this risk dramatically while honoring our goals:  
  - **Fairness**: Judges support, not sabotage, deserving entries.  
  - **Credibility**: The prize reflects genuine merit, not tactical gaming.  
  - **Stability**: Approval’s simplicity ensures buy-in and continuity.  

  #### **Conclusion**  
  Let’s act while the stakes are clear. Approval voting isn’t a panacea, but it closes the specific loophole we faced and aligns with our mission: to reward excellence, not strategy. I urge the panel to approve this change at our next meeting.  

  **Attachment**: Approval voting example ballot.  
  **Discussion Time Requested**: 30 minutes.  

  ---  
  *Approval Voting Ballot Example*  
  ```  
  [ ] Entry A  
  [ ] Entry B  
  [ ] Entry C  
  [ ] Entry D  
  [ ] Entry E  
  ```  
  *Instructions: Check all entries you consider prize-worthy. The entry with the most checks wins.*
