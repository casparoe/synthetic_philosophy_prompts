  First, I need to recall Maimonides' overall philosophy. He was a rationalist who sought to reconcile Torah with Aristotelian philosophy. His historical context is important—sacrifices were common in ancient times, so God allowed them as a transitional step. That explains the Guide's perspective.

  Now, why would he support reinstating sacrifices in the future? The key is understanding Maimonides' view of Halakha (Jewish law). He believed that the Torah's commandments are eternal, even if their original purpose was situational. So, once commanded, sacrifices become a permanent obligation unless explicitly revoked. 

  Also, the messianic era in Maimonides' view isn't a supernatural overhaul but a restoration of ideal Torah observance. The Temple's rebuilding means all its laws, including sacrifices, must resume. Prayer didn't replace sacrifices; it was a temporary substitute during exile. 

  The user might be grappling with how a rationalist like Maimonides upholds ritual laws with historical origins. They're likely interested in the tension between philosophical interpretation and legal codification. Deeper needs could include understanding Maimonides' view of divine commandments' permanence versus their contextual origins. 

