answer: |-
  Maimonides' seemingly contradictory positions on sacrifice stem from his distinction between the **philosophical/historical explanation** for a commandment's *origin* and its **halakhic (legal) status** as an eternal divine statute once instituted. Here's a breakdown:

  1.  **The Guide's Explanation (Origin & Purpose):**
      *   **Historical Concession:** Maimonides argues in the *Guide* (III:32, III:46) that the Israelites, emerging from Egyptian idolatry steeped in animal sacrifice, were psychologically incapable of abruptly transitioning to pure intellectual worship (prayer, meditation, ethical conduct).
      *   **Divine Pedagogy:** God, like a wise parent weaning a child, allowed sacrifices as a familiar form of worship but *redirected* it exclusively towards Himself. This prevented a relapse into idolatry and channeled their religious impulse.
      *   **Temporary Bridge:** The ultimate goal was always the "purer service" of prayer and intellectual contemplation. Sacrifices were a necessary, temporary bridge for that specific historical context.

  2.  **The Mishneh Torah's Ruling (Halakhic Reality):**
      *   **The Torah as Eternal Law:** Maimonides, as the supreme codifier of Halakha in the *Mishneh Torah*, operates on the fundamental principle that the commandments of the Written and Oral Torah are **eternally binding divine statutes**.
      *   **No Nullification:** Unless explicitly nullified *within the Torah itself* or by a prophet operating under specific, stringent conditions (as outlined in his Laws of the Foundations of the Torah), no commandment ceases to be obligatory. The Torah itself prescribes sacrifices in the Temple.
      *   **Messianic Era as Restoration:** Maimonides' vision of the Messianic era (*Laws of Kings and Their Wars*, Ch. 11-12) is **not a utopian overturning of Torah law**, but rather the *perfect fulfillment* of it under ideal conditions (peace, universal knowledge of God, rebuilt Temple). The Messiah restores the Davidic dynasty, rebuilds the Temple, gathers the exiles, and **reestablishes the full observance of the Torah**, including its sacrificial order.
      *   **Temple Requires Sacrifices:** The very existence of the Temple, as commanded in the Torah, necessitates the reinstitution of the service performed within it, which centrally includes sacrifices. Prayer during exile is a *substitute* for the Temple service, not its permanent replacement once the Temple is physically restored.

  **Resolving the Apparent Contradiction:**

  *   **"Why" vs. "What":** The *Guide* explains *why* God *initiated* the sacrificial system (historical concession/pedagogy). The *Mishneh Torah* dictates *what* the ongoing legal obligation *is*, based on the Torah's eternal statutes.
  *   **Origin ≠ Status:** The *historical reason* for a commandment's introduction does *not* determine its *current or future halakhic validity*. Once commanded, it becomes a permanent part of the divine service, regardless of its original psychological purpose.
  *   **Messianic Restoration ≠ Regression:** Reinstating sacrifices in the Messianic era isn't a "regression" to an inferior form of worship in Maimonides' view. It's the **restoration of the ideal system of divine service as commanded in the Torah**, now performed by a perfected humanity free from idolatry. The *context* changes (no idolatrous impulse), but the *commandment* remains.
  *   **Prayer as Substitute, Not Replacement:** Prayer filled the void *during exile* when sacrifices were impossible. Once the Temple is rebuilt, the *primary* mode of service mandated *for that location* resumes. The pure service of prayer continues *alongside* and *in conjunction with* the sacrificial service, as part of the complete Temple ritual.

  **In essence:** Maimonides separates the **rationale** (temporary historical concession) from the **legal reality** (eternal divine statute). The sacrificial system may have begun as a concession to human weakness, but once God commanded it as part of the Torah, it became an immutable component of the ideal divine service, to be fully reinstated when the conditions for its performance (the Temple) are restored in the Messianic era. The concession shaped its origin; the divine command dictates its eternal obligation.
