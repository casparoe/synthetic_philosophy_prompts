    "S": ["all-affected-interests principle", "all-subjected principle"],
    "A": ["stakeholder principle"],
    "B": ["coercion principle"],
    "C": ["territorial-boundedness"],
    "D": ["nationality principle"],
    "F": ["existing law/history"]
  }
  ```

  Bootstrapping problem: No principle completely avoids circularity because the initial boundary must be set by a pre-existing group or by force. The principles provide criteria for adjusting boundaries, but the starting point is arbitrary.
answer: |-
  Here's the tier list ranking the principles by philosophical soundness in addressing the boundary problem, followed by a brief note on the bootstrapping issue:

  ```json
  {
    "S": ["all-affected-interests principle", "all-subjected principle"],
    "A": ["stakeholder principle"],
    "B": ["coercion principle"],
    "C": ["territorial-boundedness"],
    "D": ["nationality principle"],
    "F": ["existing law/history"]
  }
  ```

  **Rationale**:
  - **S Tier**: All-affected-interests and all-subjected principles are the most philosophically coherent, grounding legitimacy in impact rather than arbitrary boundaries. They directly address the core moral question: "Who bears the consequences?"  
  - **A Tier**: Stakeholder principle offers a practical middle ground by emphasizing sustained engagement, though it risks excluding tangentially affected parties.  
  - **B Tier**: Coercion principle refines all-subjected but becomes overly narrow by requiring active enforcement, ignoring passive rule-subjection.  
  - **C Tier**: Territorial-boundedness pragmatically assumes pre-existing jurisdiction but dodges the core philosophical problem.  
  - **D Tier**: Nationality principle relies on contested cultural constructs, inviting exclusionary biases.  
  - **F Tier**: Existing law/history is circular – it presupposes the very boundaries in question.  

  **The Bootstrapping Problem**:  
  No principle fully escapes circularity. Defining "affected," "subjected," or "stakeholder" still requires initial judgment by someone (e.g., founding maintainers). While S-tier principles offer the *least arbitrary* criteria once applied, the first boundary is always set by historical contingency or power – making bootstrapping fundamentally unresolvable through theory alone.
