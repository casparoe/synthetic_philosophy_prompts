prompt: |-
  Been arguing with the other maintainers of an open source project about who should actually get a vote when we make bigger decisions (core committers only? anyone who's ever filed an issue? companies whose products depend on it?). Fell down a wikipedia hole because of it and found out theres an actual name for this in political philosophy: the "boundary problem" — basically, how do you decide who counts as part of "the people" that gets to vote on something, when deciding who's included is itself a decision that needs someone already-eligible to make it. Kind of a bootstrapping problem, like trying to compile the first compiler.

  Anyway, turns out there's a handful of competing answers people have proposed over the years:

  - all-affected-interests principle (anyone whose interests are impacted by the decision gets a say)
  - all-subjected principle (anyone who'd be subject to the resulting rules gets a say, even if it's never actually enforced on them)
  - coercion principle (narrower version of the above — only people actually coerced/enforced against get a say)
  - stakeholder principle (anyone with an ongoing stake in the community, not just a one-off interest)
  - nationality principle (membership tracks a pre-existing shared national/cultural identity)
  - territorial-boundedness (demos = whoever already lives inside the state's jurisdiction, defended as basically a precondition for democracy to work at all)
  - "whatever the current law/history already says" (no real theory, just defer to existing citizenship rules)

  Can you rank these from most to least philosophically sound as actual solutions to the boundary problem (not by how practical they'd be to bolt onto a real voting system)? Add or split out any major ones i'm missing. Give it to me as a tier list in JSON like:

  ```json
  {
    "S": [...],
    "A": [...],
    "B": [...],
    "C": [...],
    "D": [...],
    "F": [...]
  }
  ```

  Then in 2-3 sentences: does any of these actually get out of the bootstrapping problem, or is it turtles all the way down no matter what you pick?
reasoning: |-
  We are ranking philosophical principles for solving the boundary problem in democratic theory. The boundary problem asks: who should be included in the demos (the people) for collective decision-making? The ranking is based on philosophical soundness, not practicality.

  Key principles to rank:

  1. All-affected-interests principle: Anyone whose interests are affected by a decision should have a say. This is broad and inclusive but can be vague (how far do effects ripple?) and potentially leads to an unbounded demos.

  2. All-subjected principle: Anyone who is subject to the rules resulting from the decision gets a say, even if they are not actually coerced. This is narrower than all-affected but still can be broad.

  3. Coercion principle: Only those who are actually coerced or enforced against by the decision get a say. This is a narrower version of all-subjected, focusing on actual enforcement.

  4. Stakeholder principle: Only those with an ongoing stake in the community (not just a one-time interest) should be included. This is common in organizations and communities.

  5. Nationality principle: Membership is based on pre-existing shared national or cultural identity. This relies on a prior conception of the nation.

  6. Territorial-boundedness: The demos is defined by the existing territorial jurisdiction of the state. This is a pragmatic approach that takes the state's boundaries as given.

  7. Existing law/history: Defer to the current citizenship rules and legal definitions. This is not a principled theory but a status quo approach.

  Ranking by philosophical soundness:

  - S Tier: The most philosophically sound, offering a principled and coherent basis for defining the demos without circularity or arbitrariness.
  - A Tier: Strong but with some limitations or challenges.
  - B Tier: Moderately sound but with notable weaknesses.
  - C Tier: Weak and problematic, but not the worst.
  - D Tier: Seriously flawed.
  - F Tier: The least sound, often circular or arbitrary.

  Analysis:

  - The all-affected principle is often seen as the most intuitive and democratic because it ensures that those impacted have a voice. However, it faces the problem of being potentially too broad (e.g., global effects) and difficult to implement. Despite this, it is widely regarded as a foundational principle in democratic theory.

  - The all-subjected principle is a refinement of the affected interests principle, focusing on being subject to rules. It avoids some overbreadth of the affected principle and is seen as a strong contender.

  - The coercion principle is even narrower and might be seen as too restrictive, excluding those who are subject to rules but not actually coerced (if, say, they comply voluntarily). This could be seen as less democratic.

  - The stakeholder principle is practical for communities and organizations, but it might exclude those who are affected but not ongoing participants. It is sound for bounded communities but less so for unbounded ones.

  - The nationality principle is problematic because it relies on a pre-existing cultural or national identity, which may be exclusionary and not necessarily tied to the decisions being made. It is circular because the nation itself is a construct.

  - Territorial-boundedness is often taken for granted in state democracies, but it doesn't solve the boundary problem; it just assumes existing boundaries. It's circular: the territory defines the demos, but the territory was defined by prior decisions of the demos (or by force).

  - Existing law/history is the least principled because it defers to the status quo without justification. It is arbitrary from a philosophical standpoint.

  Tier List:

  S: [all-affected-interests, all-subjected] 
     - These are the most principled and inclusive, with all-subjected being a refinement that addresses some of the overbreadth of all-affected.

  A: [stakeholder] 
     - Strong for bounded communities, but not as universally applicable.

  B: [coercion] 
     - More restrictive, but still grounded in the idea that those who are ruled should have a say. However, it might exclude some who are subject to rules but not coerced.

  C: [territorial-boundedness] 
     - Pragmatic but circular; it doesn't solve the bootstrapping problem and just accepts existing power structures.

  D: [nationality] 
     - Relies on a pre-existing identity that is often contested and exclusionary.

  F: [existing law/history] 
     - No theoretical basis; it's just deferring to the status quo.

  But note: Some scholars might place territorial-boundedness higher because it is a precondition for a functioning democracy (as per Dahl). However, from a purely philosophical standpoint, it does not resolve the boundary problem.

  Alternatively, we might consider:

  - The all-affected principle is often considered the gold standard in democratic theory, but it has practical issues. The all-subjected principle is gaining traction as a more manageable alternative.

  - The stakeholder principle is common in non-state contexts (like open source) and is sound in that setting.

  Now, the bootstrapping problem: 
  None of these principles fully escape the circularity because the decision of who is affected, subjected, a stakeholder, etc., must be made by someone. Typically, the initial boundary is set by historical contingency, force, or an existing group. So it's turtles all the way down. However, once a group is established, it can use one of these principles to adjust its boundaries.

  In the context of an open source project, the initial group of maintainers might set the rules and then use a principle (like stakeholder) to include others.

