prompt: |-
  I host a small podcast on decision theory and AI safety, and next week's guest works on the shutdown problem -- her line is that we should give agents *incomplete* preferences over trajectories that differ in whether/when shutdown happens, rather than the old MIRI trick of making the agent indifferent between button-pressed and button-not-pressed worlds. Can you draft 7-8 interview questions that get past the elevator pitch? I want one on why plain indifference (Soares/Fallenstein/Armstrong/Yudkowsky) is supposed to fail where incompleteness does better, one on the classic Gustafsson-style money-pump argument for completeness and why her dominance rule is suppose to block it without just smuggling completeness back in through the side door, one on whether a smart enough agent has an instrumental reason to self-modify away its own incompleteness since it's leaving value on the table, and one on whether this actually gets you corrigibility in the full Soares et al sense (not building incorrigible successors, actually wanting to preserve the button) or just narrow compliance at shutdown time. For each, give me the answer shes most likely to reach for first, plus a sharper follow-up that doesn't let her rest there.
reasoning: |-
