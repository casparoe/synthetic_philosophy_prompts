  I need to ensure no direct communication or causality. Aris acts based on the idea that her choice is evidence of what others would do. Her reasoning is the core. Also, the resource must be something whose value depends on scarcity. Palladium works. The mining corp's reaction adds pressure, highlighting the cost.

  Check user's deeper needs. They might be interested in philosophy, decision theory, or ethics. The story should illustrate ECL clearly, making the abstract concept tangible. The user probably wants a narrative that demonstrates the theory's application, showing a moral choice with real stakes. The unresolved ending emphasizes the faith aspect of ECL, which is crucial. No cheating with signals; pure evidential cooperation.

  Potential pitfalls: avoiding any hint of telepathy or shared cause. Aris's decision is solitary. Her logs and the static represent the lack of feedback. The vastness of space underscores the isolation. Ending with her listening to static reinforces that she'll never know, staying true to the bonus points.
answer: |-
  The vacuum of the asteroid belt held no sound, only the low thrum of Aris Thorne’s mining tug vibrating through her boots. Her suit HUD flashed crimson: **PALLADIUM SIGNATURE: CLASS IX. PROBABILITY 98.7%.** Beneath her boots, inside the nickel-iron carcass of asteroid XJ-77, lay a motherlode. Enough palladium to buy her own moon, retire a thousand times over, erase every debt her family had ever known. Her fingers hovered over the drill controls. One sustained burst from the shaped-charge plasma cutter and the fortune would be hers, exposed and ready for harvesting.

  But Aris paused. The sheer *scale* of the find triggered an old, dusty lecture in her mind, not from corporate mining training, but from a fringe philosophy stream she’d stumbled upon years ago: *Evidential Cooperation in Large Worlds (ECL)*. The universe, the lecturer had argued with unsettling calm, was inconceivably vast. Not just galaxies, but potentially countless iterations, simulations, branches. In such immensity, there *had* to be others… not just *like* her, but agents facing near-identical choices, trapped in similar pockets of isolation, staring at their own version of XJ-77. Agents whose decisions she’d never know, who she’d never meet, never influence, never receive a signal from across the light-years or the quantum foam.

  The ECL argument was maddening, recursive: *If I exploit this entire lode, maximizing my personal gain now, what does that signal about the kind of agent I am?* The chilling corollary: *If I am the kind of agent who exploits, then, statistically, so are almost all the others like me out there. They too will exploit their own lodes.* And if countless agents across the vastness all exploited their unique, isolated resources simultaneously… the market, already fragile, would drown. Palladium would become as cheap as iron. Her fortune would be ashes before she even hauled it to the refinery.

  Conversely: *If I choose to leave a significant portion… say, 80%... unexploited, preserving the scarcity, what does that signal?* It signaled she was the kind of agent who valued long-term stability over immediate, crushing greed. And if *she* was that kind of agent… then, by the sheer statistical weight of the large world, so were countless others. They too would leave portions unexploited. Scarcity would be maintained. The value of the smaller portion she *did* take would be astronomically higher. Potentially, collectively, everyone gained more by restrained cooperation than by individual rapacity. But only if enough of her unseen, unknowable counterparts made the *same* costly choice.

  The cost was visceral. Leaving 80% of the lode meant abandoning generational wealth. It meant explaining to the Corp why her yield was a fraction of the sensor reading. It meant suspicion, audits, maybe even termination for incompetence or theft. She could feel the phantom weight of the palladium she was about to forsake, a physical ache.

  The comm crackled. "Thorne, status? Sensors show you hit paydirt. Why aren't you drilling?" It was Vorstag, the orbital supervisor. Greed practically dripped from his voice.

  Aris took a breath that fogged her visor. She thought of the uncountable miners on uncountable rocks, facing uncountable motherlodes. She thought of the silent, vast world where the only connection was the *shape* of a decision, echoing fractally through possibility.

  "Vorstag, sensors were over-optimistic," Aris lied, her voice steady. "Vein’s rich but thin. High impurity concentration too. Yield estimate revised downward. Drilling now for what’s viable." She didn't specify *her* definition of viable.

  Her finger stabbed the control. The plasma cutter flared, but she directed it with brutal precision, carving out only a fraction of the lode the sensors screamed about. She watched tons of potential wealth remain locked in the rock, inert, worthless to her. Each chunk she *didn't* harvest felt like a piece of her future being buried. She loaded the meager haul into the tug’s hold, a pitiful fraction of what could have been.

  The journey back to the Corp orbital was tense. Vorstag scanned her hold, his face a mask of disbelief and contempt. "Thorne… this is pathetic. Barely covers your fuel. The sensor data…"

  "Data gets distorted in the belt, Vorstag," Aris said, meeting his gaze. "Sometimes you see a mountain, but it’s just a shadow. You take what’s real, what’s… sustainable." She used the word deliberately, a tiny, futile signal cast into the void.

  She was docked pay, demoted to prospecting the dregs. Her family’s debts remained. She watched palladium prices on the feeds. They fluctuated wildly, as always. No obvious spike, no catastrophic crash. Just the chaotic churn of a galactic market.

  Years later, Aris was piloting a decrepit survey skiff far beyond the main belt, chasing phantom readings. The Corp had long forgotten her. She watched the starfield, an infinite tapestry of possibilities. Had it worked? Had her costly restraint, her choice to be the *kind* of agent who left wealth in the ground, somehow resonated? Had countless other miners, light-years or timelines away, made the same impossible choice based on the same evidential thread, preserving value for each other across the unbridgeable void?

  She’d never know. There was no signal, no confirmation, no shared cause. Only the vast silence, the cold equations of probability, and the enduring, unanswered question hanging like a distant star: had cooperation, forged solely in the furnace of a single, costly decision echoing in the dark, somehow, miraculously, been enough?

  Aris adjusted her course, heading towards another anonymous speck of rock. The comm hissed with empty static, the sound of a large, silent world.
