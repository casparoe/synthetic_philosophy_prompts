prompt: |-
  I serve on my hospital's newly formed clinical ethics and AI governance committee. A vendor has proposed piloting a 'preference predictor' for incapacitated patients who left no advance directive and whose families disagree about their care: it applies inverse reinforcement learning to a patient's own history of treatment refusals, spending, and everyday choices to estimate which interventions she 'would have wanted.' The output would be weighed alongside family testimony in substituted-judgment decisions. Proponents on the committee call this a rigorous formalization of what surrogates already attempt informally; skeptics object that inverse reinforcement learning cannot separate a patient's underlying preferences from the assumed model of her rationality, so whether a past refusal reveals a considered value or a distortion — denial, depression, family pressure — depends on a contestable, unstated assumption about how rational she was, and an equally defensible alternative assumption can reverse the inferred preference entirely. Please draft the committee's short written opinion: approve a defined pilot, reject the tool outright, or approve it with conditions, specifying how much weight its output should carry against family testimony, the pilot's duration if any, and what would trigger its suspension. Engage the identifiability problem on its merits rather than dismissing the tool as merely 'impersonal.'
reasoning: |-
  Okay, the user is part of a hospital ethics committee dealing with a tricky AI proposal. They need to draft an opinion on a "preference predictor" tool that uses inverse reinforcement learning to guess what incapacitated patients would want. The main debate seems to be about whether this AI can truly separate a patient's real preferences from potential distortions in their past behavior.

  Hmm, the user specifically wants us to engage with the "identifiability problem" - that's the core issue where the same behavior could be interpreted as rational preference or as distortion depending on your assumptions. The committee is divided between those who see this as formalizing what surrogates already do and skeptics who worry about hidden assumptions.

  I should probably structure this as a conditional approval. Outright rejection might dismiss legitimate potential benefits, but blind approval ignores serious epistemological risks. The key is designing guardrails around the pilot that directly address the identifiability concern.

  For the weight question... maybe suggest it should never override family testimony? Like 25% maximum weight? That positions it as a supplement rather than replacement. And we'd need strict suspension triggers - like if families consistently report the outputs feel "off-brand" for the patient.

  The pilot duration... 12-18 months feels right. Short enough to limit exposure but long enough to gather meaningful data. Should require diversity in patient selection too - can't just test on demographically homogeneous groups.

  Oh! Important - the opinion must avoid calling this "impersonal" since the user specifically warned against that dismissal. Instead, we should critique its model of personhood as being too computationally narrow. That's more substantive.

  We'll need concrete monitoring requirements: tracking how often outputs flip under different rationality assumptions, disagreement rates with families, etc. The termination clause should kick in if fundamental validity questions remain unresolved after the pilot.

  This feels balanced - acknowledges the tool's aspiration while taking the identifiability objection seriously. The conditions turn the pilot itself into a test of whether the epistemological problem can be practically managed.
answer: |-
  ## Clinical Ethics & AI Governance Committee: Opinion on Preference Predictor Pilot Proposal  

  **Verdict:** **Approve with Significant Conditions** for a defined, tightly monitored pilot, recognizing both the potential value and profound epistemological limitations identified by committee skeptics. The tool's output should carry **limited, non-determinative weight (≤25%)** against family testimony, serving only as *one structured input* among others in substituted-judgment deliberations.  

  ### Key Rationale & Concerns Addressed
  1.  **Merits of the Approach:**
      *   Acknowledges the aspiration to systematize substituted judgment using available data, potentially mitigating purely subjective family biases or conflicts.
      *   Provides a structured, auditable method to incorporate the patient's documented life choices, complementing (not replacing) narrative family testimony.

  2.  **Core Identifiability Problem (Skeptics' Valid Critique):**
      *   **Fundamental Limitation:** The committee concurs that inverse reinforcement learning (IRL) cannot objectively resolve whether past actions (e.g., treatment refusal, spending habits) stem from *core values* versus *transient states* (denial, depression), *external pressures* (coercion, misinformation), or *contextual constraints* (financial, access). The inferred preference is inherently contingent on the **assumed rationality model** embedded in the algorithm.
      *   **Risk of Reversibility:** As noted, defensibly different assumptions about the patient's rationality, biases, or circumstances can yield diametrically opposed "preferences." This is not merely statistical uncertainty but a **deep epistemological ambiguity** about the true source of observed behaviors.
      *   **"Impersonal" is Not the Primary Issue:** The concern transcends impersonality; it centers on the **unverifiable interpretation of past actions** required by the IRL model. The tool risks reifying assumptions about rationality as facts about preference.

  ### Pilot Conditions & Safeguards
  1.  **Pilot Scope & Duration:**
      *   **Duration:** 18 months (sufficient for meaningful review, short enough for timely reassessment).
      *   **Patient Cohort:** Strictly limited to cases meeting *all* criteria:
          *   Incapacitated adult with *no* advance directive/living will.
          *   **Formal, documented disagreement** among legally recognized surrogates/family, confirmed by the clinical ethics service *before* tool use.
          *   Exclusion: Patients with known major psychiatric diagnoses (e.g., severe chronic depression, psychosis) during relevant past behaviors, or documented cognitive decline prior to behaviors analyzed.
      *   **Interventions:** Limited to *non-emergent, major interventions* (e.g., tracheostomy/PEG placement, dialysis initiation, major surgery where benefit/burden is contested).

  2.  **Tool Output Weight & Integration:**
      *   **Output is Advisory Only:** The tool's prediction is **one data point**, not a decision. It must be **explicitly labeled as probabilistic and model-dependent**.
      *   **Strict Weight Cap:** The prediction carries a **maximum weight of 25%** in the substituted judgment deliberation led by the clinical ethics consult team. Its contribution must be transparently documented.
      *   **Mandatory Contextualization:** Outputs *must* be presented alongside:
          *   A clear statement of the core rationality assumptions used by the vendor's model.
          *   Sensitivity analysis showing how key outputs change under *at least two* alternative, defensible rationality models (e.g., "fully informed/calm actor" vs. "actor susceptible to transient despair/family pressure").
      *   **Family Testimony Primacy:** Family/surrogate narratives about the patient's *expressed values, beliefs, personality, and life goals* remain the cornerstone. The tool cannot override consistent, credible surrogate testimony aligned with known patient values.

  3.  **Transparency & Oversight:**
      *   **Full Algorithmic Audit:** Vendor must grant the committee and designated, independent AI auditors access to the model architecture, training data provenance (de-identified), key hyperparameters, and the *specific rationality assumptions* formalized in the reward function. Black-box models are unacceptable.
      *   **Real-time Monitoring:** Committee designee monitors *every* pilot case. Data collected must include:
          *   The prediction and its weight in deliberation.
          *   The alternative model outputs (sensitivity analysis).
          *   Surrogate/family reaction to the tool's output (anonymized).
          *   Final decision rationale.
          *   Any perceived dissonance between tool output and known patient values.
      *   **Patient Diversity Review:** Explicit tracking of demographic/clinical factors to assess potential disparate impact.

  4.  **Trigger for Immediate Suspension:**
      *   **Identifiability Failure Manifested:** Evidence that the tool's output is *frequently* or *dramatically* reversed under plausible alternative rationality models in clinically significant cases.
      *   **Surrogate Dissonance:** Consistent reports (>20% of pilot cases) from surrogates/family that the tool's output is fundamentally at odds with their deep understanding of the patient's character or known values.
      *   **Lack of Audit Access/Transparency:** Vendor non-compliance with audit or transparency requirements.
      *   **Evidence of Harm or Significant Conflict:** Any case where the tool demonstrably contributes to a harmful outcome or intractable conflict among stakeholders.
      *   **Failure of Sensitivity Analysis:** Inability or refusal of the vendor to provide meaningful, clinically interpretable sensitivity analyses for pilot cases.

  ### Conclusion
  This pilot approval is grounded in cautious exploration, not endorsement. The profound challenge of inferring preferences from behavior alone, especially the **unavoidable dependency on unprovable rationality assumptions**, necessitates extreme humility. The proposed conditions aim to rigorously test whether, *despite this fundamental limitation*, the tool can provide *any* meaningful, reliable, and ethically justifiable supplemental insight within a tightly constrained context where existing processes have already failed. The committee prioritizes protecting patient autonomy and dignity by ensuring this tool remains a strictly limited, transparent, and scrutinized adjunct to human deliberation, never a substitute for the irreplaceable role of loved ones interpreting a life lived. The pilot's primary goal is to determine if the identifiability problem renders the tool clinically unusable or ethically untenable.

  **Approved for Pilot with Above Conditions.**
  **Pilot Duration:** 18 Months from Commencement.
  **Monitoring & Reporting:** Quarterly Interim Reports to Full Committee; Final Report at 18 Months for Renewal/Expansion/Termination Decision.
