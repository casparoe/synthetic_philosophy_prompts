  First, I need to unpack what the user is really asking for. They want eight or nine interview questions that dig into the practical flaws of futarchy. Specifically, they mentioned three must-have angles: the values/beliefs split being undermined by welfare metric choices, the 2003 DARPA terrorism futures debacle as a feasibility case study, and market manipulation risks by deep-pocketed actors. 

