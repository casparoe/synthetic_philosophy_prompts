  Ah—and here's the epistemic pivot: the past is determinate for us (necessity per accidens), while the future remains contingent in our perspective. That justifies different attitudes. Also, Leibniz's ethics requires imitating God's creative rationality, not just accepting outcomes. The lazy reason sophism attacks precisely the confusion between certainty and compulsion.

