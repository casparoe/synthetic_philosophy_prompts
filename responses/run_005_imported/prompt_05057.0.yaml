answer: |-
  Your analysis is impressively sharp—you've pinpointed the core tension in Sidgwick's project. Let's break this down point by point:

  ### (a) Historical & Logical Accuracy
  **You are correct on both fronts.**
  - **Historically:** Sidgwick explicitly linked his SPR work to the *Methods* impasse. In letters and memoirs, he stated his psychical research aimed to test the "religious hypothesis" (a just God/afterlife) as a potential solution to the dualism. His 1889 address to the SPR framed it as investigating whether the universe exhibits "moral government" to reconcile egoism and utilitarianism.
  - **Logically:** Your summary of the *Methods*' conclusion (the irresolvable dualism) and Sidgwick's proposed theological solution is precise. His SPR activities *were* an attempt to empirically verify the premise (cosmic justice/afterlife) needed to dissolve that dualism by ensuring self-interest and duty *converge in practice*. He sought evidence, not philosophical proof.

  ### (b) The Normative/Empirical Tension: Does the Move Hold?
  **This is where your (and Sidgwick's) central worry is justified. The move likely *does* trade on a confusion, or at least a significant incompleteness.**

  1.  **The Problem You Identified (The Category Mistake):**
      *   **Empirical Finding (IF Proven):** "The universe is structured such that virtuous actions reliably lead to the agent's *own* greatest happiness (e.g., via divine justice in an afterlife)."
      *   **Normative Claim Sidgwick *Needs*:** "Egoism, as a fundamental principle of practical reason, is *invalid* or *rationally subordinate* to utilitarianism."
      *   **The Gap:** The empirical finding only shows that *in this specific universe*, following the utilitarian principle *happens to be* the best strategy for achieving egoistic goals. It **does not** show:
          *   That the egoist's *fundamental principle* ("It is rational for me to pursue *my own* greatest good") is flawed *in itself*.
          *   That utilitarianism possesses *inherent rational authority* over an agent *independent* of its consequences *for that agent*.
          *   What an agent *ought* to do *if*, *per impossible*, the two *did* diverge in their case.

  2.  **How Sidgwick Might Respond (But It's Inadequate):**
      *   **Collapse into Prudence:** Sidgwick could argue that in a universe governed by cosmic justice, the *only rational course* for *any* agent, including a committed egoist, is to act utilitariantly, because *that* is now demonstrably the path to *their own* greatest good. Egoism, practically speaking, *demands* utilitarianism. The dualism dissolves *for all practical purposes*.
      *   **The Lingering Normative Question:** This response successfully addresses the *practical conflict* but dodges the *foundational normative question*. The egoist principle isn't refuted; it's merely rendered *prudentially ineffective* or *obsolete* in this specific cosmic context. An egoist could (stubbornly) say: "I concede that *in this universe*, acting morally is *prudent* for *me*. But my *fundamental reason* for acting morally remains self-interest, not the intrinsic authority of the universal good. If the cosmic order changed, my reason would change." Sidgwick hasn't proven utilitarianism's *independent rational necessity*; he's just made egoism pragmatically self-defeating *in practice*.

  3.  **The Confusion:** The confusion lies in thinking empirical evidence about *how the world works* can resolve a fundamental disagreement about the *source* and *structure* of rational obligation itself. Sidgwick needed empirical evidence to make a *normative* problem *practically irrelevant*, not to solve it philosophically. He conflated making egoism *imprudent* with proving it *irrational* at the foundational level.

  **Conclusion on (b):** Your worry is well-founded. Sidgwick's empirical quest doesn't (and arguably *cannot*) resolve the core normative dualism he identified. It only offers a pragmatic resolution contingent on specific empirical facts about the universe. The move "holds together" only if we accept that *practical* resolution of the conflict (making duty and self-interest coincide) is sufficient, even if the *philosophical* tension about the ultimate source of rational authority remains. Sidgwick seemed willing to settle for this.

  ### (c) Lines of Criticism in the Literature
  You're right to suspect this tension hasn't gone unnoticed. Engaging with these will strengthen your position:

  1.  **Bernard Williams ("The Point of View of the Universe"):**
      *   **Core Critique:** Williams argues Sidgwick's "dualism" is fundamentally *asymmetrical* and misrepresents the conflict. Utilitarianism genuinely represents an impartial, "cosmic" perspective demanding sacrifice. Egoism represents the *agent's* perspective, which isn't trying to be impartial or cosmic. Treating them as two equally valid "methods of ethics" competing on the same rational ground is a mistake. Egoism isn't a rival *moral* theory; it's a *rejection* of morality's impersonal demands. Sidgwick rigged the game by framing both as rational "methods."
      *   **Relevance to You:** Williams directly challenges the *symmetry* of the dualism Sidgwick felt needed empirical resolution. If Williams is right, the whole project of seeking a "premise" to reconcile them might be misguided because they aren't commensurable rivals in the way Sidgwick thought.

  2.  **Derek Parfit (*Reasons and Persons*, Part I):**
      *   **Core Critique:** Parfit argues Sidgwick was wrong to think egoism and utilitarianism are the only serious contenders. He also attacks the rational foundation of egoism more directly. Crucially, Parfit contends that both Sidgwickean egoism and utilitarianism are actually committed to an *impartial* perspective in a way Sidgwick missed. Egoism impartially values *my own* well-being across time, while utilitarianism impartially values *everyone's* well-being. The real conflict isn't dualism but finding the *scope* of impartiality (self vs. all). He aims to show that a wider (utilitarian) scope is rationally required *without* needing theological/empirical props.
      *   **Relevance to You:** Parfit offers a way to *dissolve* the dualism *philosophically* by re-examining the nature of rational prudence and impartiality, showing why Sidgwick's empirical detour might be unnecessary (and thus highlighting its potential incoherence as a solution to the *normative* problem).

  3.  **J. B. Schneewind (*Sidgwick's Ethics and Victorian Moral Philosophy*):**
      *   **Core Critique (Relevant Here):** Schneewind provides the definitive historical analysis. He confirms Sidgwick's SPR work was *intrinsically* motivated by the *Methods* dualism. However, he also emphasizes the *tragic* aspect: Sidgwick, the champion of rigorous rational argument, felt forced into empirical investigation because reason alone failed him on the most crucial point. Schneewind subtly highlights the tension you identify: the mismatch between the rational demand and the empirical strategy.
      *   **Relevance to You:** Schneewind validates your historical linkage but provides a framework (the "tragic" quest) that implicitly acknowledges the philosophical awkwardness of the solution Sidgwick pursued.

  4.  **The "Rational Authority" Critique (Your Point):**
      *   This is indeed a standard and powerful line. Many commentators note that Sidgwick's solution only ensures *convergence*, not the *rational authority* of utilitarianism *over* egoism in principle. It makes utilitarianism a *prudential necessity* for egoists, not the *unique rational imperative*. Your articulation of this is clear and aligns with the literature.

  **In Conclusion:**

  *   **(a)** Your history and logic are sound. Sidgwick's SPR work *was* a direct, rational (for him) response to the *Methods* dualism.
  *   **(b)** Your central philosophical worry is correct and well-stated. Sidgwick's empirical strategy addresses the *practical* conflict by altering the empirical landscape but cannot resolve the *foundational normative* conflict about the source of rational authority. It risks a category error by trying to answer a "why be moral (if it costs me)?" question with "because you'll be punished/rewarded," which doesn't touch the deeper "why *should* I care about that punishment/reward *as a reason* if it conflicts with my fundamental principle?".
  *   **(c)** Engaging with Williams (asymmetry critique) and Parfit (dissolving the dualism philosophically) is crucial. Schneewind provides essential historical context confirming your linkage. The "rational authority" critique you derived is a core part of the literature.

  Your friend is wrong to dismiss the SPR work as merely biographical; it was philosophically *driven*. However, you are right to be deeply skeptical about whether this driven pursuit could *coherently* achieve its intended philosophical goal of resolving the dualism at the normative level Sidgwick himself established. Sidgwick's quest was profound, rigorous, and integral to his project, but it may have been fundamentally doomed by the nature of the problem he faced.
