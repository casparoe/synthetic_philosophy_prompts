  First, I need to unpack Sidgwick's dilemma. In "Methods," he hits this wall called the "dualism of practical reason." On one hand, egoism makes sense—it's rational to pursue your own happiness. On the other hand, utilitarianism also seems rationally compelling—you should aim for the general good. But these can conflict, and Sidgwick can't prove one is superior. His proposed solution? A "moral government of the universe" (basically, God) that ensures virtue is rewarded, possibly in an afterlife. Without this, ethics might fracture into two competing systems.  

  The user's core argument is that Sidgwick's SPR work wasn't a hobby but a direct extension of this philosophical problem. He wasn't ghost-hunting for fun; he was desperately seeking empirical evidence for the cosmic justice premise his ethics needed. The user worries this might be a category error: even if Sidgwick found proof of an afterlife or divine justice, that would only show duty and self-interest *happen* to align in our universe—not that egoism is *irrational* or that utilitarianism has inherent rational authority.  

  For part (a), the user is spot-on historically. Sidgwick explicitly linked SPR to the "Methods" dilemma in letters and writings. He saw psychical research as a way to test the "religious hypothesis" his ethics leaned on. The logic tracks too—if the cosmos rewards virtue, the dualism dissolves.  

  Part (b) is trickier. The user nails the tension: empirical evidence can't resolve a *normative* stalemate. Finding cosmic justice would make egoism *prudentially unwise* (since defying duty backfires), but it doesn't show egoism is *irrationally structured*. A stubborn egoist in a just universe might still say, "I *ought* to pursue self-interest, but alas, the universe punishes it." Sidgwick’s move seems to reduce rationality to prudence, which feels like a sleight of hand.  

  For part (c), the user should engage with Bernard Williams' critique: Sidgwick’s "dualism" isn’t symmetrical. Utilitarianism demands impartiality; egoism doesn’t. Williams thinks Sidgwick rigged the game by framing both as equally rational. Also, Parfit’s later work (e.g., "Reasons and Persons") attacks the egoism-utilitarianism standoff head-on, arguing both commit to impartiality in different ways.  

