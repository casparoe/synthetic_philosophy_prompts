  First I recall the core problem: when deprived individuals adapt their preferences, self-reported satisfaction becomes misleading. The student wants two utilitarian approaches yielding opposite allocations - one using self-reports, another using an objective standard. 

  I sketch two characters: Elena (non-adapted, sensitive to resources) and Ben (adapted through deprivation). For the divisible good - let's say medicine - I imagine a 100-unit supply. The twist must show self-reports favoring Ben while capability metrics favor Elena.

  Setting up utility functions: For self-report, Ben has high baseline satisfaction but low marginal gain, while Elena has low baseline but high marginal gain. Objective metrics would flatten Ben's adaptation effect. At 50-50 split, self-report shows Ben happier, but capability scores reveal Elena's greater need. 

  Running numbers: Under self-report, giving Ben 70 units maximizes sum utility. But under capability scores (where Ben's adaptation is discounted), giving Elena 70 units maximizes. The reversal is perfect - same aggregation rule, opposite results based solely on commensuration method.

  The ethical weight clearly lies in choosing the comparison standard, not in utilitarianism itself. I should emphasize how this choice smuggles in distributive conclusions before any "principle of justice" is applied. The example makes vivid what the instructor mentioned about prior choices settling outcomes.

