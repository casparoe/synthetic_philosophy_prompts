  ## Memorandum: Recommendation Regarding Ashby Bridge Naming Proposal

  **To:** Monuments and Public Naming Commission Members  
  **From:** [Your Name], Commission Member  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on Naming Downtown Pedestrian Bridge for Major General Corwin Ashby  

  This memorandum addresses the proposal to name the new downtown pedestrian bridge in honor of Major General Corwin Ashby. It evaluates the request through the specific ethical lens highlighted in our deliberations, informed by Elizabeth Anscombe's argument concerning the intentional targeting of civilians, and weighs this against the strongest case for honoring Ashby. The goal is to arrive at a principled recommendation that acknowledges both the complexity of wartime command and the enduring moral questions involved.

  **I. Relevant Context: The Air Campaign**
  Historical records indicate that during the final months of the mid-century war, then-Brigadier General Ashby commanded a strategic bombing campaign against the enemy capital. Partway through the campaign, he made a pivotal decision: shifting the primary focus of bombing from traditional military-industrial targets (rail yards, munitions plants) to essential civilian infrastructure (water mains, canal locks, grain depots). Ashby's stated objective, as documented in his memoir, was to induce civilian suffering (starvation, exposure, disease) sufficient to break the population's will to support the war, thereby forcing a surrender more rapidly than continued ground operations could achieve. Estimates place civilian deaths resulting directly from this deprivation at approximately 19,000 during the subsequent winter. Scholarly debate persists on whether this campaign demonstrably hastened the surrender or occurred alongside other decisive factors.

  **II. The Case for Naming the Bridge**
  Proponents advance compelling arguments:
  1.  **Distinguished Service:** General Ashby served his country with distinction throughout a long military career, demonstrating courage and leadership in numerous engagements beyond this specific campaign. Honoring his lifetime of service is seen as appropriate.
  2.  **Utilitarian Defense:** It is argued that Ashby's decision, however harsh, was a calculated military strategy intended to shorten the war and *save lives overall*. The premise is that a prolonged ground invasion would have resulted in significantly higher casualties (military and civilian) on both sides than the 19,000 civilian deaths attributed to the deprivation campaign. This view holds that Ashby chose the lesser evil.
  3.  **Local Legacy:** As a native son, Ashby represents a significant local connection to national history, embodying qualities of leadership and sacrifice valued by the community.

  **III. The Case Against Naming the Bridge: Anscombe's Argument Applied**
  Opponents focus squarely on the nature of Ashby's decision in the bombing campaign, invoking reasoning analogous to Elizabeth Anscombe's critique of Truman:
  1.  **The Core Principle:** Anscombe argued that deliberately choosing to kill innocent civilians *as a means* to achieve a military or political objective (like forcing surrender) constitutes murder, regardless of the objective's perceived necessity or the overall lives potentially saved. The moral wrong lies in the *intentional targeting* of non-combatants as the chosen instrument of policy.
  2.  **Application to Ashby:** Ashby's memoir explicitly states he redirected bombs *onto* the infrastructure sustaining civilian life *in order to* inflict suffering and deprivation *on the civilian population* to break their will. This was not bombing a munitions plant where civilian deaths were a foreseen but unintended side-effect; the civilian suffering and death *were the intended mechanism* for achieving his military goal – forcing surrender through mass civilian hardship. On Anscombe's account, this constitutes intentionally killing innocents as a means.
  3.  **Irrelevance of Net Lives Saved (Per Anscombe):** Critically, Anscombe contended that *if* the deaths were intended as the means, then *no* subsequent calculation of lives saved elsewhere can morally justify that specific choice or transform its essential character. The utilitarian calculus ("it saved more lives overall") does not erase the intrinsic moral wrong of having *chosen* to directly target civilians. To honor Ashby for this decision, opponents argue, is to honor an act that, by this principle, constitutes mass murder.

  **IV. Analysis: Does the Possibility of Net Lives Saved Matter if Anscombe is Right?**
  This is the crux of the ethical dilemma presented to the Commission:
  *   **If Anscombe's principle holds,** then the historical debate about whether the campaign *actually* saved lives becomes morally secondary. Even if conclusive evidence emerged tomorrow proving that Ashby's decision *did* save a net million lives by averting a bloody invasion, Anscombe would maintain that the *means chosen* – intentionally killing 19,000 civilians as a tool of coercion – was still fundamentally immoral. Honoring someone primarily *for* an action deemed intrinsically wrong (even if effective) becomes problematic.
  *   **If one rejects Anscombe's principle,** then the utilitarian calculation becomes paramount. The focus shifts entirely to the *outcome*: did the ends (shortening the war, saving lives overall) justify the horrific means? The historical uncertainty surrounding the campaign's *actual* effectiveness then becomes the primary hurdle for proponents.

  **V. Recommendation and Options**
  The Commission faces a choice about what values this community wishes to endorse through its public commemorations. Honoring General Ashby, particularly in light of this specific campaign, inevitably engages with the profound moral question Anscombe articulated: is the deliberate targeting of civilians as a tool of war ever justifiable, regardless of consequences?

  After careful consideration, **I recommend that the Commission decline to name the bridge solely for Major General Corwin Ashby.**

  **Reasoning:**
  1.  **Primacy of the Act:** While Ashby's overall service record is notable, the decision to target civilian infrastructure to inflict mass suffering and death is an act of such singular gravity that it overshadows other contributions within the context of naming a significant public structure. This act demands primary consideration.
  2.  **Anscombe's Challenge:** Anscombe's argument – that intentionally killing innocents as a means is murder and cannot be justified by subsequent outcomes – provides a powerful and logically coherent framework for condemning Ashby's specific decision. Adopting this view, even partially, makes naming the bridge after him ethically untenable, as it implicitly condones or overlooks the chosen means.
  3.  **The Limits of Utilitarianism:** Even if the Commission leans towards a utilitarian view, the *historical uncertainty* surrounding whether the campaign actually achieved its goal of saving lives undermines the strongest pragmatic defense. We are left honoring an act of immense civilian suffering based on a contested outcome.
  4.  **Community Values:** Naming a bridge, a symbol of connection and passage, for an individual associated with the intentional infliction of mass civilian suffering sends a conflicting message about our community's values, particularly regarding the protection of non-combatants in war.

  **Alternative Paths Considered:**
  *   **Naming with a Plaque Acknowledging Controversy:** While appealing as a compromise, this risks appearing as an attempt to have it both ways – honoring Ashby while gesturing vaguely at his most morally fraught act. It may satisfy no one fully and could trivialize the gravity of the civilian deaths. The plaque would likely become the focal point, overshadowing the name itself.
  *   **Naming for Ashby Regardless:** As argued above, this elevates an action that, on a compelling ethical analysis (Anscombe's), constitutes a profound moral wrong. The potential net lives saved do not negate the nature of the act if that principle is accepted.

  **VI. Proposed Path Forward:**
  Instead of naming the bridge for Ashby, I propose the Commission:
  1.  **Formally decline** the proposal to name the bridge for Major General Corwin Ashby.
  2.  **Recommend further research** into other worthy local figures whose legacies are not entangled with similar profound ethical controversies for future naming opportunities.
  3.  **Consider commissioning a separate, context-specific memorial or educational display** (perhaps near a local veterans' memorial or historical society) that acknowledges Ashby's complex legacy, including his military service, the controversial bombing campaign, the civilian cost, and the enduring ethical debate it represents. This allows for a nuanced historical discussion without the singular honor of a bridge naming.

  **Conclusion:**
  The decision regarding General Ashby forces us to confront difficult questions about the ethics of war and commemoration. Elizabeth Anscombe's argument provides a clear, if challenging, principle: deliberately making the deaths of innocents one's tool is morally distinct from causing those deaths as an unintended consequence, and cannot be absolved by outcomes. While Major General Ashby served his nation, the specific act of targeting civilians as the mechanism to end the war constitutes a significant moral burden on his legacy. Honoring him with a bridge naming elevates this act implicitly. Our community's public spaces should reflect values that unequivocally reject the intentional targeting of civilians, regardless of circumstance. Therefore, I recommend we respectfully decline this naming proposal.
