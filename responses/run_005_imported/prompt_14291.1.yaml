  ## Memorandum: Avodah Service Liturgical Language Recommendation

  **To:** Ritual Practices Committee  
  **From:** Miriam Adler, Chair  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on Avodah & Amidah Petition Language for New Machzor (High Holidays)  

  After extensive committee deliberation and review of classical sources concerning the Avodah service and the Amidah petition for restoration of the Temple service, I recommend **retaining the traditional liturgical language** in our new machzor. This includes the detailed recounting of the Kohen Gadol’s service on Yom Kippur and the explicit petition for the return of sacrificial worship ("v’eis she’arei ratzon b’ahavah"). Our approach will be supplemented by **curated explanatory notes** adjacent to these passages, contextualizing the theological tensions inherent in these prayers. This preserves textual integrity while acknowledging diverse contemporary relationships to these concepts. Final draft notes must be submitted for committee review by November 15th, ensuring approval before the December 1st board vote.

  **Rationale Grounded in Classical Sources:**  

  The core tension we face—between literal restoration and spiritualized interpretation—is profoundly ancient. Maimonides (*Guide for the Perplexed* III:32) famously posited sacrificial worship as a historical concession, a divine accommodation to the pervasive ancient Near Eastern milieu. He saw it as a necessary "way station" redirecting idolatrous impulses toward the One God, with prayer representing a superior, post-Temple ideal. This view lends weight to proposals for abstracting "avodah" into "service of the heart."  

  However, Nahmanides (Commentary on Leviticus 1:9) offers a powerful counterpoint. He argues that sacrifices predate organized idolatry entirely (citing Cain, Abel, Noah), arising from an innate human impulse to offer one's most valued possessions to God. For Nahmanides, the sacrificial system possesses intrinsic, not merely contingent, holiness. To diminish its literal description is to diminish a core element of the Torah’s conception of ultimate closeness to the Divine.  

  Our liturgy embodies this unresolved dialectic. Maimonides the *philosopher* saw sacrifice as historically contingent, yet Maimonides the *halakhist* (*Mishneh Torah, Hilchot Beit HaBechirah, Hilchot Ma'aseh HaKorbanot*) codifies its laws as eternally binding, awaiting future restoration. This legal reality cannot be ignored. Our siddur and machzor reflect this complex inheritance: prayers yearning for a restored Temple *alongside* the recognition that prayer stands in its stead *now*. Removing the literal yearning severs a vital thread connecting us to both the halakhic tradition and the embodied hope that has sustained generations.  

  Rav Kook’s suggestion (*Olat Re’iyah* I, p. 292) of a potential future shift to *minachot* (grain offerings) alone, while a fascinating theological compromise, remains speculative. It addresses modern sensibilities but lacks definitive traditional authority to justify altering established, mandated liturgical texts *now*. Its value lies in framing discussion, not in textual revision.  

  **Honoring the Reformist Position:**  

  The strongest argument for revision deserves full acknowledgment. Framing the Avodah solely as a metaphor for heartfelt devotion or moral striving (akin to Maimonides' philosophical ideal) resonates deeply with a modern ethical consciousness. For many, the visceral description of animal sacrifice, coupled with daily petitions for its return, feels theologically discordant—a vestige seemingly at odds with our understanding of divine desire. It risks reducing profound prayer to antiquarian reenactment, potentially alienating those who seek spiritual meaning unmediated by ancient ritual mechanics. This isn't mere squeamishness; it’s a sincere effort to align our communal voice with a perceived trajectory toward purely spiritual worship, consistent with a strand in our tradition itself. The concern that literal language might stifle personal connection or obscure the deeper purpose of *avodat Hashem* (service of God) is valid and pastorally significant.  

  **Conclusion & Implementation:**  

  Nevertheless, tampering with the received text risks a greater loss. The Avodah narrative and the Amidah petition are not merely historical artifacts; they are the vessels carrying millennia of Jewish hope for ultimate redemption and reconciliation with God. Abstracting them severs a tangible link to that messianic horizon, a core tenet our movement affirms, however interpreted. It also creates a rupture with the broader Jewish world's liturgical practice.  

  Therefore, we preserve the text. **Our innovation lies in the explanatory framework.** The supplemental notes (to be drafted by the subcommittee chaired by David Cohen) will explicitly name the Maimonidean/Nahmanidean tension, acknowledge the ethical questions raised, and perhaps reference Rav Kook’s idea as one lens among many for relating to these passages *today*. This approach honors tradition, preserves theological honesty, provides intellectual and spiritual access points, and avoids the preemptive resolution of a debate that has animated Judaism for centuries. It trusts our community to engage with complexity.  

  **Timeline:**  
  1.  **Nov 1:** Subcommittee drafts explanatory notes for Avodah & Amidah petition sections.  
  2.  **Nov 15:** Full committee reviews and approves final note language.  
  3.  **Nov 20:** Finalized recommendation (including approved notes) circulated to Board.  
  4.  **Dec 1:** Board vote on the machzor draft, including this recommendation.  

  I urge the committee to support this recommendation as a path that maintains our integrity to tradition, acknowledges genuine theological diversity, and empowers our congregation through education rather than excision.  

  Respectfully,  
  Miriam Adler  
  Chair, Ritual Practices Committee
