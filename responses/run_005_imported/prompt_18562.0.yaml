prompt: |-
  Hey, quick one — I've been down a rabbit hole reading about why proof assistants like Coq and Agda are built on intuitionistic type theory instead of classical logic, and now I'm interviewing a philosopher of math next week who has spent her whole career defending intuitionism and constructive mathematics against the classical mainstream (rejects excluded middle, thinks an existence proof has to hand you the actual object). I don't want an interview where she just recites the position for an audience that alredy agrees with her. Can you draft me 7-8 tough questions? I need one on the Gödel-Gentzen negative translation — it embeds classical arithmetic inside intuitionistic arithmetic, so isn't ditching excluded middle more of a notational move than a real metaphysical stand? One on Dummett's manifestation argument, plus the obvious realist comeback that we can grasp truth conditions we can't verify. And one on Brouwer's weak counterexamples that lean on unsolved problems — what happens to those once the problem actually gets solved, like Fermat's Last Theorem did? For each question, give me a tight follow-up keyed to whatever answer she's most likely to give, not just "interesting, tell me more."
