prompt: |-
  Okay so this is a weird request but here's the deal. I'm on student council and next week I have to give a speech to a pretty mixed room: the school board is actually coming to our junior/senior assembly to hear proposals live and there's a real vote riding on it, so it's not just my classmates, its adults who get an actual say too. I'm pitching that we swap our current strict, no-exceptions phone policy for a one-semester pilot version instead, where the rule gets reviewed and actually changed based on what happens (grades, tardies, whatever data the office tracks) instead of being a permanent up-or-down decision either way. We went on this whole detour into democratic theory in AP Gov (our teacher's kind of a philosophy nerd, we went way past the curriculum) and the thing that's stuck with me is John Dewey's idea that democracy isn't supposed to be like, a vote that settles something forever -- its more like an ongoing experiment or method of figuring stuff out together that's never really "done." There's also this whole beef he had with a guy named Walter Lippmann about whether regular people, like us, a bunch of 17 year olds, are actually capable of running something like that without adults/experts just deciding for us instead.

  Here's my actual problem though: the second the school board hears "pilot program we can revise later" they're gonna hear "no accountability, you'll just move the goalposts forever," and the second it starts sounding like a philosophy lecture, half my class is gonna be on their phones (ironic, i know). My debate partner keeps telling me to just cut the Dewey stuff and keep it a normal campaign speech, but that feels like a cop-out to me. So can you actually write the speech -- like 4-5 minutes out loud, with one central line or image I can call back to at the end -- where Dewey's whole democracy-as-inquiry thing is doing real work in the actual argument, meaning it's the actual reason a revisable pilot is MORE democratic and MORE accountable than a permanent rule, not less, and where it deals with the Lippmann-style objection head on instead of just ignoring it, all while still sounding like an actual teenager wrote it and not a term paper.
