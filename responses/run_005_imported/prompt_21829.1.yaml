  We are ranking several positions in the philosophy of space and time by how well they solve Newton's bucket puzzle. The bucket puzzle: when a bucket of water is rotated, initially the water is stationary relative to the bucket and its surface is flat. Then, as the water starts rotating with the bucket, the surface becomes concave. When the bucket is suddenly stopped, the water continues to rotate and the surface remains concave. The challenge is to explain why the concavity depends on the rotation relative to absolute space (or something else) and not just relative to the bucket.

  The positions to rank:

  1. Newton's absolute space: Newton's own view that rotation is absolute and defined with respect to absolute space. The concavity occurs when the water rotates relative to absolute space.

  2. Leibnizian relationism: Only relations between objects exist; there is no absolute space. Rotation is relative to other objects. But then why does the water become concave when it is rotating relative to the bucket (at the start) but not concave when the bucket is rotating and the water is stationary (at the end)? The relationist must explain the asymmetry.

  3. Mach's principle: The idea that the inertia of a body is determined by the distribution of matter in the universe. Rotation is relative to the fixed stars. The concavity arises because the water is rotating relative to the distant stars.

  4. Sklar's move: Treating rotational acceleration as a primitive, unanalyzed property. This avoids committing to either absolute space or relationism by taking acceleration as a brute fact.

  5. Sophisticated substantivalism: A response to the hole argument (in general relativity) that uses gauge invariance to avoid indeterminism. It might be adapted to the bucket by arguing that the metric field (or similar) provides a background structure that defines rotation.

  6. Julian Barbour's relational shape-dynamics: A fully relational approach where only the relative configurations (shapes) of matter matter. Dynamics is described by the evolution of these shapes without reference to absolute space or time.

