  2. A question on why a self-modifying agent can't simply hand its successor the identical proof system.
  3. A run of questions that challenge her "dissolve, not relocate" stance on probabilistic tools.
  4. Each question should have a follow-up based on the most likely answer.
  5. Close with a question about the relevance to present-day ML systems.

