answer: |-
  You've pinpointed a crucial tension in the units of selection debate. The gene-centric view *doesn't* merely stipulate the replicator criterion; it emerges from fundamental principles of evolutionary causality and information preservation. Here's a principled defense against your objection:

  ### 1. **The Causal Asymmetry of Inheritance**
     - **Problem with Interactors:** Organisms and groups *do* interact with the environment and exhibit differential survival/reproduction. However, they are *ephemeral*. When an organism dies, its unique phenotypic configuration vanishes. Its offspring are not *copies* of the parent organism; they are *reconstructions* from genetic (and epigenetic) instructions.
     - **Genes as Persistent Information:** Genes (or more precisely, *alleles*) are the only entities that physically persist *in materially identical form* across generations. DNA sequences are directly replicated. This allows selection to act cumulatively: a gene variant (e.g., for darker fur) that enhances survival *in one generation* reappears *in the same form* in the next generation, where its advantage persists. Organisms and groups lack this material continuity.

  ### 2. **The "Bookkeeping" Argument is Backwards**
     - You suggest genes are mere "bookkeepers" tracking interactor success. But the inverse is more accurate: **interactor success is the mechanism by which gene frequencies change**. The mathematical core of evolution—the Price equation—quantifies allele frequency change. Organism/group fitness is *derived* from the success of their gene variants in replication.
     - **Example (Lactase Persistence):** The spread of lactase persistence isn't primarily about the survival of dairy-consuming individuals (interactors). It's about the increased *replication rate* of the *LCT* allele in dairy-using populations. If all carriers of *LCT* suddenly stopped reproducing, the allele would vanish—even if individuals were healthy.

  ### 3. **Resolving Causal Confounding with Genic Selection**
     - **Sober & Lewontin's Objection:** They argue genic selectionism ignores causal holism (e.g., overdominance, where heterozygote advantage makes an allele's fitness context-dependent). But this *strengthens* the gene-centric view:
       - Context dependence (e.g., an allele's fitness depending on genetic background) is ubiquitous. Gene selectionists *acknowledge* this by defining fitness as a *property of a gene in a population context*. The gene remains the unit because selection *changes its frequency* based on its average effect.
       - **Contrast with Group Selection:** When groups "succeed," it’s always reducible to the success of specific gene combinations *within* those groups. A "self-sacrificing allele" only spreads if it boosts the replication of *copies of itself* in relatives (kin selection) or if group structures enforce cooperation (which itself evolves via gene-level selection).

  ### 4. **The Primacy of Replication in Defining "Evolutionary Success"**
     - **Hull's Definitions Refined:** 
       - *Interactors*: Entities that interact as cohesive wholes with their environment, causing differential replication.
       *Replicators*: Entities that pass on their structure directly in replication.
     - **Why Replication > Interaction:** Evolution requires *heritable variation*. Interactors (vehicles) are selected *based on* their phenotypic effects, but only replicators ensure heritability. A trait conferring immortality wouldn't evolve if it weren't heritable. Genes are the nexus of heritability.

  ### 5. **Okasha's Multi-Level Framework as a Gene-Centric Tool**
     - Okasha formalizes selection at multiple levels (gene, organism, group) but concedes a key point: **genic selection is always operative**. Higher-level selection (e.g., group selection) requires specific conditions (low migration, group heritability) to override gene-level selection. Crucially, group heritability depends on the *genes* underlying group traits. The gene-centric view explains *why* higher-level selection is fragile: replicators can "free ride" or "defect" (e.g., cheater alleles in groups).

  ### 6. **The Ultimate Criterion: What Accumulates?**
     - Selection accumulates *adaptations*. For an adaptation to persist, the information for it must be reliably transmitted. Genes are the only units with:
       - **Fidelity:** DNA copying is high-fidelity (error-correction mechanisms exist).
       - **Longevity:** Sequences persist through lineages (e.g., HOX genes conserved for 600 million years).
       - **Fecundity:** A single allele can generate countless copies.
     - Organisms lack fidelity (offspring aren't clones) and longevity (they die). Groups lack all three.

  ### Conclusion: Why Genes are Privileged (Without Circularity)
  The replicator/interactor distinction isn't a presupposition; it's an inference from **how evolution preserves information**. Genes are fundamental because they solve the "correspondence problem" across generations: they ensure phenotypic effects that aided survival *in the past* are reconstituted *in the future*. Organisms and groups are crucial causal actors in selection, but their evolutionary influence is mediated by the replicators they carry. The "true" unit of selection is the entity whose frequency change constitutes evolution—and that entity is the gene (or replicator). This isn’t bookkeeping; it’s identifying the locus of heritable variation upon which selection operates cumulatively.

  *Key references for deeper engagement:*
  - Dawkins, R. (1982) *The Extended Phenotype* (Ch. 5 on replicators).
  - Hull, D. (1980) "Individuality and Selection" (*Annual Review of Ecology and Systematics*).
  - Okasha, S. (2006) *Evolution and the Levels of Selection* (Ch. 3 on the Price equation).
  - Gardner, A. (2020) "The Genetical Theory of Multilevel Selection" (*J. Evol. Biol.*).
