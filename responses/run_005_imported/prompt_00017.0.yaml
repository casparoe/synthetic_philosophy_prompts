  Crucially, I should address Sober/Lewontin's criticism that genic selectionism ignores emergent traits. A counter: while groups/organisms exhibit emergence, their functional properties only evolve because gene *combinations* that produce them are differentially retained. Emergence doesn't vanish; it gets explained by lower-level replicator dynamics.  

