  First, the lineage point: when we ask why a trait persists over geological time, organisms/groups are ephemeral causal nodes, but genes (as informational templates) are the thread tethering past adaptations to present ones. A polar bear's fur isn't explained by its individual survival, but by ancestral DNA sequences that recursively reconstructed fur in each generation. This isn't just bookkeeping; it's recognizing that selection's cumulative power requires a material entity that *binds time*.  

