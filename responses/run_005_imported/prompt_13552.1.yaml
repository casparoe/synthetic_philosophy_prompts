prompt: |-
  Okay so I'm plotting a novel where my protagonist had a corpus callosotomy (the classic split-brain surgery) years ago for epilepsy, and lately something's happening that makes her suspect theres another someone quietly aware inside her skull, alongside her. Everyone who writes about this leans on the same Sperry/Gazzaniga demo with the shovel and the chicken, and I don't want to just recycle that one again. Can you dig up a different, more obscure real split-brain finding or documented patient case - something genuinely uncanny - and use it to explain why it's actually a hard case for anyone who insists a split-brain patient still has just ONE unified conscious subject in there (rather than two, or something weirder than either option)? Skip the lit review, I just want one sharp, well-explained example with the philosophical bite spelled out - something I can actually use to make a scene feel true.
