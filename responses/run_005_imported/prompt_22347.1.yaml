prompt: |-
  Every rebellion has its leader, a man who by his boldness becomes the head of the movement and lends it a face, and even those who follow him are, in following, made to stand forth as themselves, each answerable for the side he has chosen. But the levelling of our age has no such head, and can have none: the man who set himself at the head of it, and thereby distinguished himself, would in that very moment escape being levelled, and become instead a leader — which is precisely what levelling cannot suffer. Levelling is therefore something which every individual can help forward, each in his own small circle, and which no one, not even the press, can be said to direct; it is not a conspiracy but an abstraction, and it required only that communal life should first have grown too thin to hold the individual in anything concrete, for the press to conjure out of that thinness its proper spirit: an unreal whole, at once everything and nothing, which we call the public.

  I'm drafting a novel whose narrator, a minor writer, is slowly undone by a gossip weekly and by the pile-on it triggers online, and in preparation I've been rereading Kierkegaard's *Two Ages* — he wrote its closing section, "The Present Age," not long after being savaged himself by the Copenhagen scandal-sheet *The Corsair*. One passage keeps stopping me. Contrasting the age of revolution with the age of levelling, he writes something close to the following:

  > [the passage above]

  I follow the general drift, but one thing genuinely confuses me: if the press is concrete enough to be singled out as the thing that conjures the public into being, why isn't it concrete enough to count as levelling's leader or head? Is Kierkegaard saying the press is merely another site where the abstraction does its work, rather than the abstraction's author — and if so, what, positively, does he think is doing the levelling, if literally nobody is? I'd like a careful paragraph or two working through that specific tension, not a general summary of his views on mass media.
