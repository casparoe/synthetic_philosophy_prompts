  The Tichý-Miller follow-up should probe whether avoiding their result comes at the cost of weakening the definition's usefulness. On language dependence, I'll note that trivial redescription objections often target structural approaches - her response might involve privileged ontologies or invariance principles, so the follow-up should challenge those defenses.

