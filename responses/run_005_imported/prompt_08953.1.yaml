  So I've been down a bit of a rabbit hole on augustine's views on lying and it's honestly way more extreme than I expected - dude thought lying was wrong even to save someone's life, which is more hardcore than that Kant murderer-at-the-door example everyone always brings up. What really got me though is that he didn't treat all lies as equally bad - in one of his essays on lying (De Mendacio or the other one, I always forget wich) he actually splits lying into something like 7 or 8 separate categories and ranks them by how sinful they are, based on stuff like your intention and who it ends up helping or hurting.

