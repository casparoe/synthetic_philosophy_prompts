prompt: |-
  At my company we use ranked-choice voting for stuff like picking next quarter's roadmap feature or the offsite location - everyone ranks the options, then we run instant-runoff (eliminate the lowest vote-getter, redistribute their ballots, repeat). Last round a teammate admitted afterward that he'd ranked his actual second choice as #1, since he knew his real favorite had zero shot and wanted to make sure it beat the other frontrunner - and it worked, flipping the outcome for the rest of us.

  Now someone wants to switch to Borda count (points based on where you rank each option) since it uses more info and seems "fairer," but my gut says that just moves the gaming somewhere else instead of fixing it. I vaguely remember some theorem from a college stats elective - Arrow's maybe? - about no voting system being "perfect," but I thought that was about weird paradoxes in how you combine everyone's rankings, not people being able to flat out lie about their preferences to get a better result. Is that the same theorem or a different issue? Bottom line: is there an actual ranking method thats immune to this kind of dishonest voting, or are we just picking our poison no matter what we switch to?
reasoning: |-
  Okay, the user is dealing with a voting system issue at their company. They use instant-runoff voting (IRV), and a teammate strategically ranked their second choice first to sway the outcome. Now someone suggests Borda count as a fairer alternative, but the user suspects it might just shift the problem. They mention Arrow's theorem but are confused about whether it covers strategic voting or just paradoxes.

  First, I need to clarify Arrow's Impossibility Theorem. It's about the impossibility of a fair ranking system under certain conditions, but it doesn't directly address strategic voting. The user might be conflating two issues: voting paradoxes and manipulation. So I should explain that Arrow's theorem is about collective rationality, not strategic behavior.

  Next, the user's main concern is whether any voting system can prevent dishonest voting. I recall Gibbard-Satterthwaite theorem, which states that no system is immune to strategic voting unless it's dictatorial or has only two options. That's the key point here. The user needs to understand that all systems can be gamed, but in different ways.

  Looking at IRV vs. Borda: In IRV, the problem was a voter misrepresenting their true preference to block a frontrunner. In Borda, the strategic move would be to rank a strong opponent lower to harm their score. The user's gut feeling is correct—switching to Borda shifts the gaming strategy but doesn't eliminate it.

  The user might also have deeper concerns about fairness and trust within the team. They might want a system that promotes honest voting without manipulation. But since no system is immune, the real solution might involve fostering a culture of honesty or using methods that reduce incentives to cheat.

  I should also mention other systems like approval or Condorcet, but note that they have their own vulnerabilities. For example, approval voting can lead to bullet voting, where voters only choose one option. Condorcet methods are complex and might have cycles, which Arrow's theorem addresses.

  The bottom line is that the team has to accept some trade-offs. They can choose a system that aligns with their priorities: minimizing harm from strategy, simplicity, or Condorcet efficiency. But no matter what, strategic voting is always possible. Encouraging honest participation and transparency might be as important as the voting method itself.
answer: |-
  You've hit on a fundamental challenge in social choice theory, and your intuition is spot-on. Here's the breakdown:

  1.  **The Problem:** What your teammate did is called **strategic voting** or **tactical voting**. It's when a voter misrepresents their true preferences (ranking their *actual* #2 choice as #1) to achieve a better outcome than they would get by voting honestly, given their prediction of how others will vote. Instant-runoff voting (IRV) is susceptible to this.

  2.  **Arrow's Impossibility Theorem (Relevant, but Not the Whole Story):**
      *   **What it says:** Arrow proved that *no* ranked voting system can simultaneously satisfy all of several seemingly reasonable fairness criteria (like "No Dictator," "Pareto Efficiency," "Independence of Irrelevant Alternatives" - IIA) when there are 3 or more options. It deals with the *mathematical impossibility* of creating a "perfect" fair aggregation method, even if everyone votes honestly. The "weird paradoxes" (like non-transitive rankings or the spoiler effect) are manifestations of this.
      *   **How it relates:** Arrow's theorem highlights the inherent difficulty in designing *any* fair ranked-choice system, setting the stage for why strategic voting becomes tempting. It doesn't *directly* address strategic voting, but it shows why all systems have flaws that can be exploited.

  3.  **The Key Theorem for Strategic Voting: Gibbard-Satterthwaite Theorem:**
      *   **This is the one you need.** It directly addresses your concern.
      *   **What it says:** For any voting system that:
          *   Has 3 or more distinct possible outcomes (winners),
          *   Is deterministic (non-random),
          *   Allows any possible preference ordering by voters,
          *   And where every outcome is achievable by *some* configuration of voter preferences (non-imposed),
      *   **Then:** The system is **either**:
          *   **Susceptible to strategic voting:** Meaning there are situations where *some* voter can achieve a better outcome by misrepresenting their preferences (like your teammate did).
          *   **Or a dictatorship:** Where one voter's preferences always determine the winner.

  4.  **What This Means for Your Company:**
      *   **No Escape Hatch:** Gibbard-Satterthwaite tells us that **there is no ranked-choice voting system (like IRV, Borda, Condorcet methods, etc.) that is immune to strategic voting** while also being fair and non-dictatorial. **You are indeed picking your poison.**
      *   **IRV's Weakness:** As you saw, IRV is vulnerable to voters "compromising" (ranking a lesser-but-viable favorite higher than their true favorite) or "burying" (ranking a strong opponent *very* low). Your teammate used the compromise strategy effectively.
      *   **Borda's Weakness:** Your gut is correct. Borda Count is *highly* susceptible to strategic voting:
          *   **Bullet Voting:** Voters might only rank their *true* favorite #1 and leave everything else unranked (if allowed) or ranked last, hoping to maximize their favorite's points without boosting competitors.
          *   **Truncation:** Similar to bullet voting, ranking only a few preferred options.
          *   **Burying:** Deliberately ranking a strong competitor you dislike *last* to minimize their points, even if you somewhat prefer them over another viable candidate. E.g., If A and B are frontrunners and you *slightly* prefer A but *hate* B, you might rank B dead last and a weaker candidate (C) above A if you think it hurts B more than it helps A.
          *   **Team Manipulation:** Coordinated groups can dramatically alter outcomes through complex ranking strategies.
      *   **Other Systems:** Condorcet methods (which look for pairwise winners) have different strengths (resolving some paradoxes better) but are *also* susceptible to strategic voting, often in complex ways. Approval Voting (not ranked-choice, but score-based) is simpler but also manipulable (e.g., "bullet approval" - only approving your absolute favorite).

  **Bottom Line:**

  *   **Gibbard-Satterthwaite proves it:** **There is no perfect, strategy-proof ranked-choice voting method** for 3+ options that isn't a dictatorship. Every system can be gamed.
  *   **Switching to Borda just changes the game:** It doesn't eliminate strategic voting; it changes *how* voters are incentivized to manipulate the system. Your teammate's "compromise" strategy is less effective in Borda, but "burying" and "bullet voting" become powerful tools.
  *   **Picking Your Poison:** The choice depends on what flaws you find *least* objectionable and what your priorities are:
      *   **IRV:** Good at finding a broadly acceptable winner, avoids vote-splitting, familiar. Vulnerable to compromise/burying.
      *   **Borda:** Uses more ranking information, good at finding consensus options. *Highly* vulnerable to burial/bullet voting/team tactics. Sensitive to the number of candidates.
      *   **Approval:** Simple, hard to "spoil," good for "favorite + acceptable." Vulnerable to bullet approval, doesn't distinguish between "love" and "like."
      *   **Condorcet:** Mathematically robust in finding pairwise winners. Complex to explain/calculate, can have cycles needing tie-breakers, still manipulable.

  **Recommendation for Your Team:**

  1.  **Acknowledge the Impossibility:** Explain Gibbard-Satterthwaite. Be transparent that *no* system is perfect and all can be gamed. This sets realistic expectations.
  2.  **Prioritize Simplicity & Culture:** Often, the best system is the one people understand and trust. Complexity breeds suspicion and *invites* gaming. Foster a culture of honesty and discourage overt strategy talk.
  3.  **Consider Approval Voting:** While not perfect, it's *very* simple to understand and vote ("Check all options you find acceptable"). It minimizes the *ease* and *impact* of some common strategies compared to ranked methods. It's a strong contender for practical workplace decisions.
  4.  **If Sticking with Rankings:**
      *   **IRV:** Might be acceptable if strategic incidents are rare and the simplicity is valued. Emphasize the expectation of honesty.
      *   **Avoid Borda for Strategic Reasons:** Its vulnerability to burial/bullet strategies is significant and often easier for individuals to exploit effectively than strategies in IRV. It also feels less "natural" to many.
  5.  **Focus on the Problem, Not Just the System:** Was the issue truly the system, or was it one teammate acting strategically? Addressing the *behavior* (discouraging tactical discussions/voting) might be as important as changing the method.

  **In short: Yes, Gibbard-Satterthwaite tells you exactly what you suspected – there's no magic bullet. Any ranked-choice system (or indeed, any deterministic voting system with 3+ options) can be manipulated by voters lying about their preferences. Switching to Borda just changes the type of manipulation possible, it doesn't solve the core problem. Focus on simplicity, transparency, and fostering honest participation.**
