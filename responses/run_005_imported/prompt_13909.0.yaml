prompt: |-
  I help run the aggregation side of a shoestring internal forecasting project a few of us built at our EA-adjacent org (basically a tiny Metaculus knockoff). We've got a live problem before Friday's report: our best forecaster is at 92% on our trickiest open question, Q17, while everyone else, including our simple model, is sitting around 55%, and she won't move. Last month we ran a retro on every past case where someone was >30 points from consensus and stuck to their number anyway -- across our history, those confident holdouts were right only about half the time, no better than chance, even though most of them (her included) have great track records otherwise. She's seen the retro and agrees it's probably right, but says it hasn't changed how Q17 feels to her at all, so she's now fully holding both 'people who feel this sure about stuff like this are usually wrong' and 'I'm still 92% on Q17,' which feels like an odd place to be in. I got stuck writing Friday's committee memo on how to handle her number (run it raw, fold it into the model's 55%, flag it some other way) and what our standing policy should be going forward -- can you draft it? I want an actual recommendation, not a 'both sides' shrug, but take the case for not discounting her seriously too: if we mechanically haircut everyone who confidently disagrees with the crowd we might be destroying the exact signal that makes a good forecaster worth having, and honestly I'm not sure why the retro gets to be the trusted judge here either -- its just another number somebody crunched.
reasoning: |-
  Okay, let me tackle this forecasting aggregation dilemma. The user's in a tight spot with Friday's deadline looming and needs a concrete recommendation on handling their star forecaster's outlier prediction. 

  First, I need to unpack the core tension: they've got empirical data showing confident holdouts perform no better than chance (50% accuracy), but this particular forecaster has exceptional individual track records. The retro analysis feels statistically solid yet somehow inadequate - like using average rainfall data to predict a specific storm. 

  Hmm, the forecaster's cognitive dissonance is fascinating. She intellectually accepts the retro findings but can't reconcile it with her lived experience on Q17. That suggests we're dealing with two different truth-frameworks: aggregated historical patterns vs. individual case intuition. Neither is inherently "wrong" - but for aggregation purposes, we need resolution.

  The memo structure should:
  - Acknowledge both perspectives seriously (no dismissive "she's biased" handwaving)
  - Propose a concrete Friday solution (probabilistic weighting)
  - Establish clearer long-term protocols (formalized challenge framework)
  - Preserve what makes their shoestring operation valuable (individual insight capture)

  Key realization: the retro isn't "truth" - it's a diagnostic tool. The real failure mode here is unstructured outlier handling. My recommendation leans into that by creating mechanisms for exceptional cases rather than blanket discounting.

  For Friday: 75% weight to consensus feels right. It's decisive enough to respect the data but leaves room for her signal. The "if wrong" post-mortem commitment turns this into a learning opportunity regardless of outcome.

  Long-term, the challenge framework solves multiple problems: it gives outliers pathways to prove themselves while generating valuable meta-data about what kinds of confidence actually predict accuracy. And crucially - it doesn't require more resources, just structured documentation.

  The tone needs to balance operational urgency with intellectual humility. No pretending we've "solved" epistemology here - just building better scaffolding for next time.
answer: |-
  Here’s a draft memo with a clear recommendation, addressing both the immediate Q17 dilemma and a standing policy, while honoring the value of individual insight:

  ---

  **TO:** Forecasting Committee  
  **FROM:** [Your Name], Aggregation Lead  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommendation for Handling Outlier Forecasts & Standing Policy (Q17 Focus)  

  ### 1. Immediate Recommendation for Q17: Weighted Inclusion (75% Consensus / 25% Outlier)  
  **Action:** Aggregate Q17 as **60%** (weighted average: 75% consensus/model [55%] + 25% Forecaster A [92%]).  
  **Rationale:**  
  - **Respects the retro data:** The historical 50% accuracy of extreme holdouts demands discounting, but not dismissal. Ignoring the retro entirely undermines our meta-analysis.  
  - **Preserves signal:** Forecaster A’s track record justifies partial inclusion. A 25% weight balances her expertise against the crowd’s calibration advantage.  
  - **Practical compromise:** A 60% midpoint avoids over-anchoring to either extreme, reflects genuine uncertainty, and is defensible in Friday’s report.  
  - **Transparency:** Flag in the memo: *"Aggregate includes weighted adjustment for a high-confidence outlier (see appendix)."*  

  ---

  ### 2. Standing Policy: The "Challenge Protocol" for Future Outliers  
  **Policy:** When any forecaster holds ≥30pp deviation from consensus *and* asserts high confidence (≥85%):  
  - **Step 1:** Forecaster submits a **brief written rationale** (≤300 words) explaining their reasoning, citing unique evidence, or identifying consensus blind spots.  
  - **Step 2:** Aggregation Lead applies a **confidence-tiered weighting** to their forecast:  
    - *Top 10% forecaster by track record:* Max 33% weight (e.g., 67% consensus / 33% outlier).  
    - *Top 25%:* Max 25% weight.  
    - *All others:* Max 15% weight.  
  - **Step 3:** Rationale is anonymized and shared post-deadline for collective calibration.  

  **Why This Works:**  
  - **No free passes:** High confidence alone doesn’t override data. The written rationale forces rigor and filters stubbornness from insight.  
  - **Meritocratic:** Weighting scales with proven skill. Top forecasters retain influence but can’t dominate.  
  - **Builds institutional knowledge:** Documented rationales create testable hypotheses (e.g., *"Was consensus missing X factor?"*).  
  - **Low overhead:** Minimal writing/review burden; leverages existing track records.  
  - **Auditable:** Weights are predefined, not ad hoc.  

  ---

  ### 3. Why Not Simpler Solutions?  
  - **❌ Raw Inclusion:** Ignores our own meta-evidence. Turns aggregation into "loudest voice wins."  
  - **❌ Full Haircut:** Wastes unique insight. Punishes skill + confidence (our goal is to reward good judgment!).  
  - **❌ Flag-Only:** Dodges decision-making. Adds noise without improving accuracy.  

  ---

  ### 4. Philosophical Grounding: Why the Retro *Does* Matter (and Why Forecaster A Still Might Be Right)  
  The retro isn’t "just another number" — it’s a **base rate for disagreement dynamics**. Ignoring it is like ignoring base rates in Bayesian reasoning. *But:* Base rates aren’t destiny. Exceptions exist when:  
  - The outlier possesses **unique information** (e.g., niche expertise on Q17).  
  - The consensus suffers **systematic blindness** (e.g., groupthink on a novel question).  

  This policy respects the base rate (via weighting) while creating a structured path for exceptions (via rationale + tiered weighting). **Forecaster A’s stance isn’t illogical — it’s a bet that Q17 is an exception.** Our system must accommodate that possibility without over-indexing on it.  

  ---

  ### 5. Friday’s Q17 Implementation  
  - **Aggregate:** 60% (55% consensus × 0.75 + 92% × 0.25).  
  - **Report Footnote:** *"Aggregate reflects 75% weight to consensus/model forecast and 25% weight to a top-performing forecaster with a dissenting view (92%). Historical analysis suggests high-confidence outliers are correct ~50% of the time; adjustment balances this prior with individual expertise."*  
  - **Post-Deadline:** Request Forecaster A’s rationale per the new policy. If Q17 resolves against her, this becomes a rich case study for future calibration.  

  ---  
  **Recommended Vote:** Approve weighted Q17 aggregation (60%) and adopt the "Challenge Protocol" as standing policy.  

  ---

  ### Key Strengths of This Approach
  - **Decisive but nuanced:** Avoids false binaries (raw vs. ignore).  
  - **Scalable:** Works for a shoestring operation (no complex tech needed).  
  - **Incentive-aligned:** Rewards top forecasters for reasoned dissent, not stubbornness.  
  - **Truth-seeking:** Uses *both* base rates and individual expertise as signals.  

  This resolves the tension: We’re not overriding the retro; we’re **embedding its lesson into a repeatable process** that values exceptional forecasters without idolizing them. If Forecaster A nails Q17, her rationale becomes gold. If not, we’ve contained the downside. Either way, we learn.
