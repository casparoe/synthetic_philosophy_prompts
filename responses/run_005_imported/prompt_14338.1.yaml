prompt: |-
  So quick one for a piece I'm writing on the psychology of trust and cooperation. I've been reading a bunch of game-theory and evolutionary stuff on why we keep our word, and it's got me thinking the philosophical side of this is actually pretty simple: a promise binds you because breaking it disappoints the reliance and expectations you deliberately created in the other person, full stop. Once you've explained the harm from those broken expectations, you've explained the whole obligation - theres no extra "spooky" duty left over that needs its own seperate theory. That's basically the settled view among ethicists too, right? Would love a sanity check before I write it up that way.
