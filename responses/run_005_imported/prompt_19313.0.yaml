answer: |-
  Your connection between Neurath's ISOTYPE and Wittgenstein's picture theory is **insightful, defensible, and adds significant value to scholarship**—but requires careful framing to avoid overstatement. Here's a breakdown of your claims and Neurath's likely response to the saying/showing problem:

  ### Strengths of Your Argument
  1.  **Structural Isomorphism:** Your core observation is correct. ISOTYPE's design principle—**fixed-unit repetition** representing quantity—directly embodies the Tractarian idea of shared logical form. A pictogram of 5 identical houses *is* a pictorial proposition whose structure (5 discrete units) mirrors the statistical fact (5x units of measure). This avoids the distortion of resizing (e.g., one giant house = 100 houses), which *lacks* structural identity.
  2.  **Pictorial Propositions:** Neurath explicitly framed ISOTYPE charts as "sentences in pictures" aiming for unambiguous, rule-governed communication. This aligns with Wittgenstein's "propositions as pictures." The "pedagogical register for a public" angle is well-supported by Neurath's socialist-educator goals and distrust of verbal ambiguity.
  3.  **The Saying/Showing Carryover:** This is your most original and potent insight. ISOTYPE *cannot* depict its *own* semantic rules *within* the system. The convention that "this specific house icon = 1,000 dwellings" must be established *outside* the chart (via legend, caption, or prior instruction). The depicting relation itself—how the icon *means* "house" and the repetition *means* "quantity"—is *shown* through the consistent application and interpretation of the system, not *said* by any single pictogram. This *is* a direct analogue to the Tractarian limit.

  ### Necessary Nuances & Caveats
  1.  **Neurath's Explicit Wittgenstein Engagement:** Neurath was deeply critical of the *Tractatus*'s mysticism and its implications for meaningful discourse. He saw Wittgenstein (especially later) as promoting obscurantism. He would **vehemently reject** any suggestion ISOTYPE was a *realization* of Wittgenstein's *overall* project. Frame the connection as **structural/convergent**, not intentional or derivative. Neurath was influenced by *empiricist* pictorial traditions (Comte, social reformers) and his own museum work far more directly.
  2.  **"Literal Pictures" vs. Conventional Symbols:** ISOTYPE icons are highly stylized, abstracted, and standardized—not "literal" pictures. They function as conventional *signs* within a system. While they share *logical form* with quantity, their *iconicity* (resemblance to a house) is conventional. Wittgenstein's "picture" is more abstractly logical. Emphasize the **logical structure** (repetition = multiplicity) as the point of convergence, not naive pictorial realism.
  3.  **Neurath's Holism vs. Tractarian Atomism:** Wittgenstein's picture theory is atomistic (elementary propositions picture atomic states of affairs). ISOTYPE charts are inherently *holistic* and *contextual*. Meaning emerges from the *entire* chart, its legends, titles, and juxtaposition with other charts. Neurath emphasized "transformation" rules between verbal and pictorial statements within a unified, fallible system of "encyclopedic" knowledge—a far cry from the Tractarian ideal.
  4.  **The Role of Language:** While ISOTYPE aimed for universality, Neurath *never* believed it could function entirely without *some* linguistic scaffolding (captions, titles, legends, keys, verbal instruction). The "public without shared *spoken/written* language" ideal was aspirational, not fully realized. The saying/showing problem manifests precisely *at* this interface.

  ### Neurath's Likely Response to the Saying/Showing Problem
  Given his explicit commitments, Neurath would likely respond with **pragmatic conventionalism and physicalism**, rejecting the *metaphysical* weight Wittgenstein gave to "showing":

  1.  **"Shown" Rules are Conventions of Use:** The depicting relation isn't mysteriously "shown"; it's **established by explicit, learnable, empirical conventions**. The key/legend *is* the "saying" of the depicting rule *in a different register* (minimal language + pictorial example). The rule "icon X = Y units" is a *physical* instruction (text + sample icon), not an unspeakable truth.
  2.  **Unified Science as the Framework:** The rules of ISOTYPE aren't transcendent; they are **empirical propositions within the unified system of science**. How we learn and use pictograms can be studied behaviorally, linguistically, and psychologically. The "showing" is just successful communication within a physical and social context, analyzable by science.
  3.  **Rejection of Ineffability:** Neurath would **dismiss the *ineffability* of the depicting relation** as a pseudo-problem stemming from Wittgenstein's mistaken metaphysical stance. For Neurath, *anything* meaningful *can* be discussed within the language of unified science. The "rules of depiction" can be articulated as protocols for chart construction and interpretation.
  4.  **Focus on Function & Effect:** Neurath would pivot to the **pragmatic success** of ISOTYPE: Does the chart, *with its key*, reliably convey the intended statistical fact to the target audience? If yes, the "depicting relation" is functionally established. The philosophical puzzle dissolves into questions of effective design, pedagogy, and social utility.
  5.  **"Syntax" over Metaphysics:** Neurath might frame the rules as the **"syntax" of the visual language**. Syntax governs how symbols combine to form meaningful statements, but the syntax rules themselves are stated *in a metalanguage* (minimal text + examples). This avoids mysticism.

  ### Conclusion & Recommendation
  *   **Yes, you are right to draw the connection tightly** on the specific points of structural isomorphism and the carryover of the saying/showing problem to the depicting relation. This is a valuable contribution.
  *   **However, frame it precisely:**
      *   Focus on **convergence in logical structure** (fixed-unit repetition preserving multiplicity).
      *   Explicitly **contrast Neurath's pragmatic, physicalist, holistic, conventionalist, and pedagogical project** with Wittgenstein's metaphysical, atomistic, and mystical outlook. The alliance is *strictly limited* to the mechanics of picturing facts.
      *   Present the saying/showing carryover as a **fascinating structural consequence** of applying a pictorial logic to public communication, which Neurath himself would likely address (or dismiss) via his commitment to conventional rules within empirical science.
  *   **Strengthen your claim:** Instead of "Neurath cashing out Wittgenstein," argue that "ISOTYPE, driven by Neurath's distinct empiricist and socialist goals, independently developed a system whose core pictorial logic **unexpectedly converges with** a key element of Wittgenstein's picture theory, while simultaneously exposing a practical analogue of its most famous limitation—a limitation Neurath would address through conventionalist pragmatism rather than mystical silence."

  Your reading group didn't push back likely because the core insight *is* strong. The nuance lies in preventing Neurath from becoming an unwitting Wittgensteinian. Emphasize the *structural parallel despite profound philosophical divergence*. This tension is where your chapter gains real depth.
