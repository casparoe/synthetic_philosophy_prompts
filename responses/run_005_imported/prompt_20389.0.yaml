answer: |-
  ## MEMORANDUM

  **To:** University Long-Range Capital Planning Committee  
  **From:** [Your Name], Emeritus Member  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on Pilot of Futarchy for Research Building vs. Graduate Housing Decision  

  ### I. Background and Proposal
  The proposal to pilot Robin Hanson's futarchy framework for deciding between funding a new interdisciplinary research building and expanding graduate housing presents a compelling departure from our traditional decision-making. This approach—voting on a composite welfare metric, then using prediction markets to forecast which project best achieves that metric—aims to harness collective intelligence and reduce bias. While I appreciate concerns about reducing institutional values to forecasting and market manipulation risks, my three decades studying decentralized decision-making in social insects leads me to recommend a **cautious, limited pilot** with robust safeguards.

  ### II. Recommendation: Proceed with a Limited Pilot
  I recommend we approve the futarchy pilot under the following terms:  
  **1. Composite Metric:** Define a transparent, weighted metric combining:  
     *   Research output (30%: publications, patents)  
     *   Grant income (25%: new external funding attracted)  
     *   Graduate retention (20%: % continuing at university post-degree)  
     *   Graduate satisfaction (25%: annual survey scores).  
     *   *Rationale:* Balances short-term gains (grants) with long-term health (retention/satisfaction), pre-registered to prevent post-hoc manipulation.  

  **2. Market Structure & Safeguards:**  
     *   **Open Participation:** All faculty, staff, and students may trade, using a university-issued, non-redeemable virtual currency (e.g., "Campus Credits") to eliminate real-money risks and ethical concerns.  
     *   **Liquidity Incentives:** Small participation bonuses (e.g., extra credits for early traders) to ensure sufficient market depth and deter manipulation.  
     *   **Transparency:** All trades publicly viewable (with anonymized trader IDs) to foster trust and deter collusion.  
     *   **Oversight:** A 3-member audit subcommittee (economist + ethicist + data scientist) monitors for anomalies weekly.  
     *   **Duration:** Markets open for 4 weeks after metric ratification.  

  **3. Time Frame:**  
     *   **Pilot Phase:** 18 months total.  
     *   Metric finalization & market setup: 2 months.  
     *   Market trading: 1 month.  
     *   Project implementation: 12 months.  
     *   Metric assessment: 3 months post-implementation.  
     *   **Evaluation:** Committee reviews pilot success *before* considering futarchy for future decisions. Success criteria: market liquidity, predictive plausibility (vs. baseline forecasts), and stakeholder trust.  

  **4. Decision Bindingness:**  
     *   Treat the pilot outcome as a *strong recommendation*, not an automatic binding decision. The full committee retains final approval, providing a circuit-breaker if markets behave irrationally.  

  ### III. The Strongest Objection: Values vs. Predictions
  The most compelling objection, articulated by several colleagues, is that futarchy fundamentally misapplies markets by **reducing a complex value judgment about the university's mission to a mere forecasting problem.** Funding the research building prioritizes academic prestige and discovery; expanding housing prioritizes student well-being and equity. These are *qualitative* disagreements about institutional identity, not uncertainties about quantifiable outcomes.  

  A prediction market, even a well-designed one, cannot resolve whether "research output" intrinsically outweighs "graduate satisfaction." By laundering this normative debate through a single composite metric and market prices, futarchy risks:  
  1.  **Oversimplification:** The chosen metric may inadequately capture intangible values (e.g., community cohesion, ethical responsibilities).  
  2.  **Legitimizing the Wrong Question:** It frames the decision solely as "Which option *achieves this specific basket of outcomes best*?" rather than "Which outcome *should* we prioritize?"  
  3.  **Erosion of Deliberative Values:** It potentially sidelines reasoned debate about the university's purpose in favor of technocratic aggregation.  

  This objection is philosophically sound and reflects legitimate concerns about commodifying institutional values. The 2003 Pentagon market fiasco, while contextually different, underscores how easily such markets can be perceived as distasteful or gamed when stakes involve profound social goods.

  ### IV. Why Proceed Despite the Objection
  While this objection is powerful, it does not negate the potential value of a *pilot*:  
  1.  **Testing a Hypothesis:** Our traditional process *also* struggles with value conflicts, often resolved by seniority or lobbying. Futarchy offers a novel, testable alternative.  
  2.  **Clarifying Values:** Defining the composite metric *forces explicit negotiation* of trade-offs *before* the decision, potentially improving deliberation even if markets aren't used again.  
  3.  **Focusing Disagreement:** If the market outcome aligns with the committee's values-based intuition, it builds confidence. If not, the specific divergence (e.g., "The market undervalued housing's impact on well-being") provides concrete data for refining future metrics or processes.  
  4.  **Learning Opportunity:** As an institution dedicated to inquiry, we have a unique opportunity to empirically evaluate an innovative governance mechanism within a controlled environment. The risks of this *limited* pilot are manageable with safeguards.  

  ### V. Conclusion
  I recommend approving the futarchy pilot with the specified terms: a carefully defined composite metric, a virtual-currency-based market with liquidity incentives and oversight, an 18-month timeframe, and a non-binding outcome subject to committee review. The strongest objection—that markets cannot resolve value conflicts—is valid and necessitates treating the pilot as a learning exercise, not a surrender of normative deliberation. However, precisely because our current process is imperfect, testing futarchy's ability to generate evidence-based predictions offers valuable insight. This pilot, conducted cautiously, aligns with our academic mission to explore novel ideas rigorously.

  Respectfully submitted,  
  [Your Name]
