  For part (a), the Löbian obstacle. In Cartesian models, the agent trusts its future reasoning because it's seen as an oracle. But with embeddedness, the agent can't prove its future self will be trustworthy. Lob's theorem shows a system can't prove its own consistency. So, the problem is self-referential. Environmental uncertainty is about external factors, but this is about internal proof structures. Cartesian models can't handle that because they assume the agent is separate and complete.

