answer: |-
  ## Committee Hearing: The Boundary Problem at the Border

  **Setting:** A crowded congressional hearing room. Representatives listen intently. Dr. Elena Mendez (Political Theorist, advocating for affected interests) and Professor David Reynolds (Legal Philosopher, advocating for collective self-determination) present opposing views on a proposed strict border/asylum bill.

  **Chairperson:** Thank you, Professor Reynolds. Dr. Mendez, you have five minutes for rebuttal and your own testimony.

  **Dr. Elena Mendez:** Thank you, Madam Chair. Professor Reynolds makes a common but deeply flawed argument: that denying entry is merely "non-facilitation," like a club denying membership. This fundamentally mischaracterizes the reality of state border enforcement. When a state builds walls, deploys armed guards, patrols seas with cutters, and establishes detention centers, it is not passively *not helping*. It is actively using **coercive force** to physically prevent movement and impose its will.

  **Prof. David Reynolds:** Dr. Mendez, I understand the visceral reaction. But the *core act* of denying entry – the "no" at the border – is not initiating force *against* the individual. The person is outside. The state is simply refusing to alter its own territory or membership to accommodate them. The force you describe – guards, fences – is preventative, deployed *only if* someone attempts to violate that sovereign decision. It’s reactive, not initiatory coercion *against* the peaceful outsider.

  **Dr. Mendez:** Reactive? Professor, let's be concrete. Consider a family fleeing violence. They reach the border, seeking asylum – a legal right under international law. They are met by armed personnel. They are told, "Turn back." If they don't comply, they are physically restrained. If they resist, force escalates. They may be detained in conditions courts have deemed inhumane. If they somehow enter and are later found, armed agents physically seize them, handcuff them, and deport them. This isn't a theoretical "reaction." It's the **direct application of state violence** against specific individuals who have done nothing more than seek refuge. How is this *not* coercion? How is the *threat* of this violence, inherent in the border regime, *not* a coercive imposition on their lives and choices?

  **Prof. David Reynolds:** The coercion, Dr. Mendez, arises *if and only if* the individual attempts to cross without authorization. The *policy itself* – the rule "only these may enter" – is an exercise of the collective's right to self-determination, defining its own association. The force is contingent on violation. It's analogous to trespass law: I own my home. My "no entry" sign isn't coercion against everyone walking by. But if you ignore it and enter, I can call the police to remove you. The initial "no" is assertion, not aggression. The force is a consequence of defying that legitimate assertion.

  **Dr. Mendez:** Your analogy fails critically, Professor. Your home isn't surrounded by a 30-foot steel wall monitored by drones. Passersby aren't fleeing warzones. The state isn't just *your* home; it controls vast territories and resources, often acquired through historical violence. More crucially, your "trespass" analogy ignores the **asymmetric power and the existential stakes**. For the person fleeing death, the border *is* the barrier to survival. The state's "no" isn't a passive sign; it's an active, violent blockade backed by overwhelming force. Calling deportation "consequence" doesn't erase the **fundamental act of the state imposing its will through physical compulsion on a non-member**. Their bodies are literally seized and moved against their will. That *is* the definition of coercion.

  **Prof. David Reynolds:** The stakes are high, I grant you. But acknowledging hardship doesn't dissolve the principle of collective self-determination. Every political community must define itself. If *every* person potentially affected by a state's decisions – including its decisions about membership – had a vote in making those decisions, the concept of a distinct, self-governing "demos" vanishes. We become responsible for the welfare of the entire world in every domestic choice. Is it coercion when Canada denies me residency? Should I vote in Canadian elections? The force used at borders is the necessary corollary of maintaining *any* bounded political community capable of self-government.

  **Dr. Mendez:** No one argues for dissolving *all* boundaries, Professor. We argue that when a state's actions **directly and coercively impose harms on specific outsiders** – denying refuge, tearing families apart, deporting people to danger – those individuals have a fundamental moral claim to have their interests considered in the process that authorizes that harm. Denying them *any* voice while subjecting them to state violence is the height of democratic exclusion. You say "self-determination," but it becomes tyranny for those outside the magic circle drawn by force and history. The fence, the guard, the detention cell, the deportation flight – these are not mere consequences; they are **the instruments of the state's coercive power actively deployed against the excluded.**

  **Prof. David Reynolds:** And you risk dissolving the very agency of the demos. If outsiders subjected to the *effects* of our self-determination claims get to vote on the *substance* of that self-determination, then "we the people" no longer determine our own fate. We become perpetually accountable to an undefined global constituency for our internal choices about who we are. The line must be drawn somewhere. Drawing it at physical membership – subject to the state's ultimate authority – is the only practical and principled foundation for democratic sovereignty. The hardship faced by those outside is real, but addressing it through aid, diplomacy, or international agreement doesn't require surrendering the foundational right of a people to define themselves.

  **Dr. Mendez:** "Physical membership" is defined *by* the coercion you deny! The people inside aren't a pre-political entity; they are constituted *by* the border enforcement that keeps others out. Your "practical foundation" ignores the violence upon which it rests for those on the wrong side. Democratic legitimacy cannot be built on excluding those subjected to the state's most direct force. Ignoring their claim makes a mockery of "consent of the governed" for the governed *they* are governing through exclusion and deportation.

  **Chairperson:** Thank you, both. Your time is concluded. The stark differences in framing – coercion versus non-facilitation, the scope of the demos versus the claims of the affected – are clearly laid bare for the committee to consider. We now move to questions from members. The nature of the boundary, it seems, remains profoundly contested.
