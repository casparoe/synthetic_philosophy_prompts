  For the frog case, I imagine the teleosemanticist emphasizing historical functions: the mechanism evolved for flies, not pellets, so misrepresentation occurs when pellets trigger it. But the Fodorian should press: what if "small moving thing" was equally fitness-conducive? The teleosemanticist might appeal to niche-specific selection pressures.

