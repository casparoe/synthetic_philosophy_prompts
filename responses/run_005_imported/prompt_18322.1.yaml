prompt: |-
  Had a long, kind of pointless argument with my friend Sam last night about mental causation that we never really resolved. Sam's position was that multiple realizability is exactly what saves mental properties from being causally irrelevant -- since pain (say) isn't identical to any single physical state, it cant just get swallowed up by 'the' physical cause the way a reductionist worry would suggest. I tried to argue this actually gets Kim's exclusion argument backwards: multiple realizability is precisely what rules out type-identity in the first place, and that's exactly what leaves the mental property with no causal job left to do once you grant that the physical realizer on that occasion is doing all the actual causing. We just went in circles for like an hour and neither of us had an actual example to point to. Can you construct one -- a specific causal scenario, not the pain/C-fiber-firing one, i've seen that a thousand times -- that shows clearly whether multiple realizability helps or hurts the case for mental causation once you take exclusion seriously?
