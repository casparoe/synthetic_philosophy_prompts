  First, I need to recall Kim's exclusion argument. The key points are causal closure of the physical and the exclusion principle. If a physical effect has a sufficient physical cause, any mental cause must either be identical, overdetermined, or excluded. Multiple realizability blocks identity, so exclusion seems to kick in. 

