answer: |-
  You've zeroed in on a profound and genuinely difficult problem for conventionalist and expectation-based theories of promising – the **desert island promise**. Let's break down how major theories handle this case, their strengths, weaknesses, and whether any truly succeed:

  ### 1. **Humean/Rawlsian Conventionalism (The "Practice" View)**
     *   **Core Idea:** Promising is a *social artifact*. Its moral force derives entirely from participation in a mutually beneficial, rule-governed *practice* (like baseball or money). The obligation arises from the *convention itself* and the expectations/general reliance it fosters within a society (Hume's "common interest"). Rawls emphasizes *fairness*: by invoking the practice and benefiting from others' compliance, you incur an obligation to comply yourself.
     *   **Handling the Desert Island:**
          *   **Fails Spectacularly.** There *is* no ongoing practice. The promisor isn't participating in a larger social institution, won't benefit from it in the future, and won't undermine it by breaking the promise (no one else exists to be affected). The "common interest" or "fair play" elements vanish.
          *   **Possible Salvage Attempts (Unconvincing):**
              *   *Internalization:* Maybe the promisor has internalized the rules of the practice so deeply they feel bound even in isolation. (But this confuses *feeling* bound with *being* bound; the theory grounds obligation in the external practice, not internal feelings).
              *   *Minimal Practice:* Perhaps the two people *establish* a micro-practice on the spot. (But Hume/Rawls typically envision established, society-wide practices. Creating a fleeting "practice" for one act seems ad hoc and loses the core idea of relying on an existing, beneficial social structure).
     *   **Verdict:** This view struggles *fundamentally* with the case. The intuitive bindingness seems independent of any social practice or fairness considerations in this scenario. Hume might dismiss the intuition as a sentimental hangover, but that feels unsatisfying.

  ### 2. **Scanlon's Expectation-Based View (Principle F)**
     *   **Core Idea:** The wrong of breaking a promise is violating a specific moral principle (Principle F): *"If (1) A voluntarily and intentionally leads B to expect that A will do X (unless B consents to A’s not doing so); (2) A knows that B wants to be assured of this; (3) A acts with the aim of providing this assurance, and has good reason to believe that he or she has done so; (4) B knows that A has the beliefs and intentions just described; (5) A intends for B to know this, and knows that B does know it; and (6) B knows that A has this knowledge and intent; then, in the absence of special justification, A must do X."* The obligation arises from the **assurance intentionally created and relied upon**, generating a duty not to disappoint that reasonable reliance.
     *   **Handling the Desert Island:**
          *   **Succeeds... Conditionally.** All elements of Principle F can be met on the island:
              *   The promisor intentionally assures the dying person ("I promise...").
              *   The dying person clearly wants/needs assurance.
              *   The promisor aims to provide that assurance.
              *   Mutual knowledge exists (both know the promise was made and accepted).
              *   The dying person *relies* on this assurance (perhaps dying in peace, revealing a secret, or making a final request contingent on it).
          *   The wrong is violating the duty not to harm through the *deliberate creation and subsequent betrayal of a specific, invited reliance*. The harm is the *disappointment of that specific expectation* and the *wrongful exercise of power* over the promisee's state of mind.
     *   **Strengths:** Captures the dyadic, intentional nature of promising. Explains the island case well *if* the promisee relies on the promise. Makes the obligation about a specific wrong *to the promisee*.
     *   **Weaknesses/Challenges:**
          *   *Reliance Requirement:* What if the promisee *doesn't* rely? (e.g., "Promise me you'll try to climb Everest someday" – said casually, no reliance). Scanlon argues Principle F still applies because the promisor *invited* reliance and created a *claim* the promisee *could* hold them to, even if not actively relied upon. Critics find this extension less compelling.
          *   *The Source of the Duty:* *Why* is inducing reliance in this specific, intentional way morally binding? Scanlon grounds it in broader principles of avoiding harm and respecting others' autonomy via expectations we create. Some argue this still needs a deeper foundation or that it reduces promising to a sub-case of a more general duty not to mislead.
          *   *"Morally Distinctive" Wrong?* Does Principle F *fully* capture the unique "binding" force of "I promise," or is it just a sophisticated application of duties we already have (don't lie, don't harm via induced reliance)? The island case *helps* Scanlon here, as the reliance is clear and the *only* source of obligation.

  ### 3. **Non-Reductionist/Intuitionist Views (e.g., W.D. Ross)**
     *   **Core Idea:** Keeping promises is a *prima facie* duty – a fundamental, irreducible moral fact. It's not derived from utility, convention, or other duties like fidelity or non-maleficence. The act of promising itself *creates* a unique moral reason. The intuition that the island promise binds is primary evidence for this.
     *   **Handling the Desert Island:**
          *   **Succeeds Easily (but at a cost).** The obligation simply exists because a promise was made. The lack of society or consequences is irrelevant. The duty of fidelity is primitive.
     *   **Strengths:** Perfectly matches the strong intuition that the island promise binds. Acknowledges the *sui generis* nature of promissory obligation.
     *   **Weaknesses:** Seen as explanatorily deficient. It essentially says, "It's wrong because it's wrong to break promises." It doesn't explain *why* or *how* uttering certain words creates this unique obligation, making it feel like a brute fact or even "moral magic" to its critics (echoing Hume's transubstantiation jab). It struggles to resolve conflicts with other *prima facie* duties.

  ### 4. **Speech Act/Committal Theories (e.g., Searlean Influences)**
     *   **Core Idea:** Promising is a unique type of **speech act**. Saying "I promise" isn't just describing an intention; it *performs* the act of *committing* oneself. The obligation arises from the inherent norms of the performative act itself within the framework of communication and interpersonal commitment. By performing this act, you place yourself under an obligation constitutive of the act's meaning.
     *   **Handling the Desert Island:**
          *   **Succeeds... with Nuance.** Even between two isolated individuals, the speech act of promising functions. By performing it, the promisor undertakes a commitment *to that specific promisee*. The obligation is generated by the act of commitment itself within the dyadic relationship.
          *   **Weakness:** This raises the question: *Why* does performing this specific linguistic act have this normative power? Searle links it to constitutive rules of language, but this can drift back towards convention. Others (like Margaret Gilbert) argue promising creates a *joint commitment* – the promisee's acceptance is crucial, creating a small-scale normative structure binding the pair. This "joint commitment" view can handle the island case well, as the dyad *is* the relevant "society" for that commitment.

  ### Conclusion: Do Any Truly Succeed? Are We Stuck with the Primitive?

  *   **Conventionalism (Hume/Rawls):** Clearly **fails** the desert island test. It cannot explain the binding force absent a functioning social practice and future interaction.
  *   **Scanlon's Expectation (Principle F):** **Succeeds best *if* we accept:** (1) His conditions are met (intentional assurance, etc.), and crucially, (2) That inducing reliance in this specific way *is* the fundamental source of the obligation. It handles the island case by focusing on the dyad and the specific harm of betrayed reliance. However, the nagging question remains: *Why is this specific act of assurance-generation so uniquely powerful?* It feels close, but perhaps not the whole story.
  *   **Non-Reductionism (Ross):** **"Succeeds"** by brute force – it simply asserts the primitive duty. It perfectly captures the intuition but offers no deeper explanation, which many find philosophically unsatisfying.
  *   **Committal/Speech Act (Searle/Gilbert):** Offer a **plausible account**, especially Gilbert's joint commitment view. They locate the obligation in the *act of commitment itself* within the interpersonal relationship, making the island dyad sufficient. The challenge is explaining the source of the normativity inherent in the speech act or joint commitment without circularity or relying on convention.

  **The Honest Answer:** You're right to be bugged. The desert island case *is* a major problem for pure conventionalism. Scanlon offers the most robust *reductionist* account (grounding it in reliance/duties not to harm), but it may still feel like it reduces promising to something else, potentially missing its unique "binding" character. Non-reductionist and committal views capture the intuition of unique bindingness better but struggle to explain *how* the magic works without appealing to something primitive or dyadic convention.

  **Are we stuck admitting the obligation comes from something more primitive?** Probably. The intuition that the island promise binds *is* incredibly strong and persistent. While Scanlon provides a powerful framework linking it to reliance and harm, the sense that "I promised" creates a *distinctive*, self-imposed obligation *sui generis* seems fundamental. Theories like Gilbert's joint commitment or a Rossian *prima facie* duty of fidelity likely come closest to capturing this primitive element. They acknowledge that the act of promising itself, within a relationship (even a fleeting one), generates a unique normative reason that isn't *fully* reducible to consequences, social utility, or even the prevention of reliance-based harm alone. The "binding" force might indeed be a bedrock feature of how humans understand commitment through language and relationship.
