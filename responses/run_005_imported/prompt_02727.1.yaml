  For Scanlon's expectation-based view (Principle F), the promisee's trust *does* exist in the desert island case—the dying person relies on the promise. So Scanlon can explain the obligation... but only if we accept that reliance is intrinsically morally significant. The user might counter: "Why *should* that reliance bind someone? What's the deeper principle?"  

