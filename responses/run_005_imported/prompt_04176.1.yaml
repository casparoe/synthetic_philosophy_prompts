answer: |-
  Here's a direct verdict for your handout, cutting through the summary: **Epistemicism handles higher-order vagueness *structurally better* than supervaluationism, precisely because it embraces sharp boundaries at every level without generating new theoretical problems.** Supervaluationism, despite its initial appeal, fails to genuinely eliminate sharp boundaries and creates deeper inconsistencies when confronting higher-order vagueness. Your hunch is largely correct.

  ### Why Supervaluationism Falters
  1.  **The Core Problem:** Supervaluationism resolves *first-order* vagueness by replacing a single sharp boundary with a *range* of precisifications (admissible sharpenings). "Borderline" means a case is true on some precisifications and false on others. However, "admissible precisification" is *itself* a vague concept.
  2.  **Higher-Order Boundary Smuggling:** To define "definitely borderline" (a higher-order concept), supervaluationism needs to specify when a case is borderline *on every admissible precisification*. But what counts as "admissible" isn't sharp. This forces one of two paths:
      *   **Regress:** It must posit vagueness in the *set of precisifications itself* (meta-precisifications for "admissible"?). This leads to an infinite regress of higher-and-higher-order vagueness without ever resolving the underlying boundary problem. The theory becomes cumbersome and arguably incoherent, as it requires infinitely many layers of semantic machinery for a single predicate.
      *   **Sharp Cutoff:** Alternatively, it implicitly assumes the set of admissible precisifications *is* sharply bounded. This smuggles back in a sharp boundary – not between (e.g.) tall and not-tall, but between what counts as an admissible way of making the predicate precise and what doesn't. **This defeats supervaluationism's core motivation of eliminating sharp boundaries.** The boundary is just relocated to a higher level (admissibility), which is equally (if not more) counterintuitive and unexplained.

  **Result:** Supervaluationism either collapses into an infinite regress or tacitly reintroduces a sharp boundary concerning admissibility. Neither outcome satisfactorily captures the intuitive lack of sharp boundaries *at any level*.

  ### Why Epistemicism (Surprisingly) Holds Up Better
  1.  **Consistent Bullet-Biting:** Williamson's epistemicism posits sharp boundaries for *all* vague concepts, including "borderline case" itself. The transition from "definitely tall" to "definitely not tall" involves sharp boundaries between:
      *   Definitely tall / First-order borderline
      *   First-order borderline / Definitely not tall
      *   And crucially: *Also* sharp boundaries between:
          *   Definitely definite tall / Higher-order borderline (for tallness)
          *   Higher-order borderline (for tallness) / Definitely *not* definite tall (i.e., borderline at first-order)
  2.  **The Epistemic Move:** The key is that *all* these sharp boundaries are *unknowable* (epistemically inaccessible). Our inability to locate the boundary between "definitely tall" and "borderline tall" is explained by the same fundamental epistemic limitation (e.g., margin-for-error principles governing knowledge of vague matters) that explains our inability to locate the original "tall/not-tall" boundary.
  3.  **No New Machinery, No Regress:** Epistemicism doesn't need to invent new ontological layers (like meta-precisifications) to handle higher-order vagueness. It applies the *same* core explanation (sharp boundary + epistemic limitation) recursively at every level of vagueness. This avoids the crippling regress problem plaguing supervaluationism. The cost is accepting sharp boundaries everywhere, but the theory is internally consistent and extends cleanly.

  **Result:** While deeply counterintuitive, epistemicism offers a *unified and structurally stable* account of vagueness at all orders. The "bullet" bitten for first-order vagueness is the *same bullet* bitten for higher-order vagueness. There's no theoretical breakdown or hidden boundary relocation.

  ### The Verdict for Your Handout
  **Epistemicism provides a *more coherent and less problematic* account of higher-order vagueness than supervaluationism.** Supervaluationism's attempt to avoid first-order sharp boundaries backfires when confronted with higher-order vagueness, leading either to incoherent regress or the very sharp boundaries it sought to avoid, now hidden at the meta-level of "admissibility." Epistemicism, by contrast, consistently extends its core thesis – sharp boundaries exist at every level but are unknowable – providing a stable, if philosophically costly, solution. While epistemicism's cost (ubiquitous unknowable sharp boundaries) is high, supervaluationism's cost when addressing higher-order vagueness (incoherence or hypocrisy) is arguably fatal to its core project. **On the specific issue of higher-order vagueness, epistemicism wins on structural grounds.**

  **Pushback Nuance:** One could argue epistemicism's *explanation* of our ignorance remains deeply unsatisfying, and the sheer proliferation of unknowable sharp boundaries feels absurd. However, this is the *same* dissatisfaction felt at the first order – it's not a *new* problem created by higher-order vagueness. Supervaluationism, conversely, *creates new theoretical problems* (regress/meta-boundary) specifically when trying to handle higher-order phenomena. This asymmetry gives epistemicism the edge on this specific point.
