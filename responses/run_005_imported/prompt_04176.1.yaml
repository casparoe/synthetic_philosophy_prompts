  Now, higher-order vagueness is the issue that the boundary between clear cases and borderline cases is itself vague. For example, between definitely tall and borderline tall, there's no sharp line—it's fuzzy. This is a problem because both theories need to explain this without creating new sharp boundaries elsewhere.

