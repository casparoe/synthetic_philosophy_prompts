answer: |-
  That's an excellent and deep question—you've pinpointed the core conceptual tension between TDT and UDT. Let's break down the divergence in Counterfactual Mugging (CFM) and why it matters.

  ### Core Conceptual Difference Recap
  - **TDT (Timeless Decision Theory):**  
    After updating on your *actual* observations (e.g., "I see the coin landed tails"), you ask: "What decision does *this algorithm* output *in this specific situation*?" You condition on your current state of knowledge, then fix the algorithm's output in that context.  
    *Epistemic stance:* "I am *in* this world; what should *I* (as this computation) do *here*?"  

  - **UDT (Updateless Decision Theory):**  
    Before having *any* observations (from a "pre-natal" or "source code" perspective), you choose a *complete policy* mapping all possible inputs/observations to actions. You optimize this policy for *expected utility* across all possible worlds you might find yourself in.  
    *Epistemic stance:* "What policy should *this algorithm* implement, *ignoring which world I actually inhabit*?"  

  ### Why CFM Separates Them: The Mechanics
  **Counterfactual Mugging Scenario:**  
  - Omega flips a fair coin. Heads: Nothing happens. Tails: Omega asks you for $100.  
  - If you pay when asked (tails), Omega gives you $10,000 *if the coin was heads* (which you never observe). If tails and you refuse, you lose nothing but gain nothing.  

  #### TDT's Failure in CFM:
  1. **You observe the coin is tails.** You now know Omega is asking for $100.  
  2. TDT reasons: *"Given that I observe tails, what does my algorithm output? Paying $100 gains me $0 (since heads didn't occur). Refusing gains me $0. Indifference."*  
  3. Crucially, TDT **only considers the actual branch** (tails) because it updated on observations. The heads branch is a counterfactual where you *aren't even present* (Omega doesn't interact with you). TDT sees no causal or logical link to justify paying.  
  4. **Result:** TDT refuses to pay. Expected value = $0.  

  #### UDT's Success in CFM:
  1. **Before observing the coin flip,** you choose a policy:  
     - *Policy A:* "If asked (tails), pay $100."  
     - *Policy B:* "If asked, refuse."  
  2. You calculate expected utility *across all possible branches*:  
     - **Heads (50%):** Omega doesn't ask you anything. Policy doesn't activate. You get $0 *unless you paid in the tails branch*. But if you chose Policy A, you get $10,000 *because of your commitment in the tails branch*.  
     - **Tails (50%):** If Policy A, you pay $100 → net -$100. If Policy B, net $0.  
  3. Expected Utility:  
     - Policy A: (0.5 × $10,000) + (0.5 × -$100) = **$4,950**  
     - Policy B: (0.5 × $0) + (0.5 × $0) = **$0**  
  4. **Result:** UDT chooses Policy A and pays when asked.  

  ### Why Newcomb and Parfit's Don't Separate Them
  - **Newcomb's Problem:**  
    Both TDT and UDT two-box. Why?  
    - TDT: You see Box B is opaque. "My algorithm outputs two-boxing. The predictor already set Box B based on predicting *this algorithm*. If I were a one-boxer, Box B would be full, but *I am not*."  
    - UDT: Policy choice: "If I see Box B, one-box or two-box?" Since the predictor precommits based on your *policy*, two-boxing always leads to ($1,000 vs. $1,001,000) → two-boxing wins.  
    *No counterfactual dependency on unobserved branches.*  

  - **Parfit's Hitchhiker:**  
    Both pay.  
    - TDT: "I'm stranded. Driver rescues me iff I *would pay later*. My algorithm outputs 'pay' → driver saves me."  
    - UDT: Policy: "If rescued, pay." Expected utility: Paying gets you home safely ($high), refusing leaves you stranded ($0).  
    *The counterfactual (driver's decision) directly depends on your policy.*  

  **Key Insight:** CFM is unique because the payoff *in an unobserved branch* depends on your action *in an observed branch*. TDT's post-observation perspective blinds it to this cross-branch dependency. UDT's pre-observation perspective forces it to optimize globally.  

  ### Is UDT Just a Better Version of TDT's Core Idea?  
  **Argument: Yes, it's the consistent extension.**  
  - TDT's slogan ("fix the algorithm's output") *implies* reasoning about what your algorithm does *everywhere*, not just locally. CFM reveals TDT fails to fulfill its own ideal by ignoring unobserved counterfactuals. UDT corrects this by rigorously optimizing the entire policy.  
  - Objections to TDT (like CFM) were key motivations for developing UDT (Eliezer Yudkowsky, Wei Dai). UDT subsumes TDT's insights while generalizing to more games.  

  **Argument: UDT smuggles in questionable commitments.**  
  1. **The "Pre-Observation" Perspective is Metaphysically Suspect:**  
     - Can you really choose a policy *before existing* or *before knowing who you are*? UDT requires optimizing as if you haven't seen your own source code or observations—a state no real agent inhabits.  
     - *Cost:* This feels like "decision-making from ignorance," violating the Bayesian tenet that rational agents update on evidence.  

  2. **Computational Intractability:**  
     - UDT requires evaluating policies over *all possible universes* consistent with your algorithm's existence. This is wildly intractable for real agents (or AIs). TDT's situational focus is more practical.  

  3. **Problematic Counterfactuals:**  
     - In CFM, UDT pays because "if the coin were heads, Omega would give me $10,000 *because I pay in tails*." But in the heads branch, *you don't exist in the decision node*. Is this counterfactual meaningful? TDT rejects it as incoherent.  

  ### Assessment: UDT as a Costly but Powerful Refinement
  - **UDT is likely the *more consistent* fulfillment** of the "algorithmic" decision theory vision. TDT is its "myopic" cousin, working in many cases but failing when counterfactual payoffs depend on unobserved branches.  
  - **However, UDT's commitments are non-trivial:**  
    - It treats your algorithm's policy as a *causal node* in the universe's structure, affecting outcomes even in branches where the algorithm isn't executed. This is defensible in logical inductability but ontologically heavy.  
    - The price is reasoning from an impossible "view from nowhere." TDT's updating feels more natural for embedded agents.  
  - **Practical Takeaway:** For real-world decisions, TDT is often sufficient and more computable. UDT is crucial for "cosmological" dilemmas (e.g., agent foundations in AI alignment) where cross-branch coordination matters.  

  **In essence:** UDT fixes TDT's counterfactual blindness by demanding full policy optimization. Whether this is a *necessary* cost for consistency depends on whether you prioritize purity in idealized games (favoring UDT) or pragmatism for bounded agents (where TDT may suffice despite its flaws). Both refine CDT, but UDT pushes the "algorithmic" idea to its logical extreme—for better or worse.
