prompt: |-
  so i just got the student rep seat on my college's conduct board, and this week's case is kinda breaking my brain. an RA cited a student, Marcus, for 'smoking out of the 3rd floor stairwell window' - except nobody was smoking there, it was steam from a busted radiator vent. the RA's adamant it was definitly Marcus he saw (named him, described his jacket), and Marcus admits he was at that window right then, just says he was getting air. his advocate wants the charge dismissed outright, since the write-up describes something that never happened - theres no 'student smoking' to charge anyone with. half the board calls that a technicality and wants to just investigate what marcus actually did, since nobody doubts who was meant. apparently this happens a lot, since reports get scrawled fast at 1am. i need a memo for wednesday's meeting - a call on marcus's case, plus a standing policy for citations where the description's wrong but the identity isn't in doubt, with real next steps and a deadline. our dean of students wants it to actually engage with why the dismiss-it side has a point, not just brush past it.
reasoning: |-
  Okay, the user is a student rep on their college's conduct board dealing with a tricky case. Marcus was cited for smoking out a window, but it turned out to be radiator steam. The RA insists it was Marcus there, and Marcus admits being there for air. The advocate wants the charge dismissed because the write-up describes an act that didn't happen. Half the board thinks that's a technicality and wants to investigate what Marcus actually did. The user needs to write a memo by Wednesday with a decision on Marcus's case and a standing policy for when citations have wrong descriptions but correct identity. The dean wants them to address why dismissing it has merit, not just brush past it.

  First, I need to unpack the core issues. The RA wrote Marcus up for smoking, but it was actually steam. So the specific violation Marcus is charged with didn't occur. That's a problem for due process. If the board proceeds as if he was smoking, they're punishing him for something he didn't do. But Marcus was there, so maybe he was doing something else wrong? The board can't just swap charges mid-hearing; that's unfair. They need to handle this properly to maintain trust in the system.

  The user mentioned this happens often because reports are written quickly late at night. So there's a systemic issue here. The memo needs a policy for future cases. The dean wants the "dismiss it" side's points addressed thoroughly. That means explaining why dismissing isn't just a technicality but about fairness and accuracy.

  For Marcus's case, dismissing the charge makes sense. There's no evidence of smoking, and the RA saw steam. Proceeding risks punishing Marcus unfairly. But the board should note that if Marcus was violating another policy (like being in an unauthorized area), they could investigate separately. That balances fairness with addressing potential misconduct.

  For the standing policy, the key is separating identity from the alleged violation. If the described act didn't happen, dismiss that charge. But if the student was present and might have committed a different violation, allow a new, properly written charge. This prevents misuse of the system—RAs can't just write any charge and correct it later. There should be a deadline for submitting new charges, like 48 hours, to avoid delays.

  The user's deeper needs? They want a fair, efficient system that respects due process but also handles real misconduct. The college needs policies that are both just and practical. The memo must satisfy the dean by thoroughly engaging with the dismissal argument, showing it's about principles, not loopholes.

  Structuring the memo: start with case analysis, explain dismissal reasons, then policy proposal. Emphasize fairness, accuracy, and systemic fixes. Include next steps: training for RAs on report writing, clear deadlines for amendments. Make sure the tone is balanced, showing respect for both sides while upholding integrity.
answer: |-
  ## MEMORANDUM

  **TO:** College Conduct Board  
  **FROM:** [Your Name], Student Representative  
  **DATE:** October 26, 2023  
  **SUBJECT:** Recommendation & Policy for Marcus Case & Citations with Erroneous Descriptions  

  ### I. CASE ANALYSIS: Marcus (Alleged Smoking - 3rd Floor Stairwell)

  1.  **The Charge as Written:** The citation explicitly alleges "smoking out of the 3rd floor stairwell window." Evidence (including RA testimony and Marcus's admission) confirms Marcus was present at the window at the time. Evidence *also* conclusively demonstrates that the observed substance was radiator steam, not smoke. Therefore, the *specific act* described in the citation – smoking – demonstrably **did not occur**.

  2.  **Arguments for Dismissal (Engaging the Perspective):**
      *   **Due Process & Fair Notice:** Marcus was charged with a specific violation (smoking). He prepared a defense against *that* charge. Investigating a different, uncharged act (e.g., loitering, being in an unauthorized area) during this hearing denies him fair notice and the opportunity to mount a specific defense. This is fundamental to a fair process.
      *   **Accuracy & Integrity of the Record:** The conduct record must accurately reflect what a student is found responsible *for*. Finding Marcus responsible for "smoking" when it was proven to be steam creates a factually incorrect record with potential future implications.
      *   **Burden of Proof:** The burden rests on the College to prove the charged violation occurred. The evidence disproves the charged act (smoking). The identity of the student present is secondary if the core violation alleged didn't happen.
      *   **Not Merely a "Technicality":** Dismissing isn't about a minor paperwork error. It's about the core allegation being factually incorrect. Proceeding risks punishing a student for an act they demonstrably did not commit, based solely on the RA's initial (understandable) misperception.

  3.  **Arguments for Investigation:**
      *   **Identity & Presence:** There is no dispute Marcus was the student present at the location and time of the RA's observation. His presence itself *might* potentially violate another policy (e.g., unauthorized use of a fire exit/stairwell for non-emergency purposes, if applicable).
      *   **Intent of the Citation:** The RA intended to address observed conduct at that location by that student. Dismissing outright feels like letting potential misconduct go unaddressed simply because the initial description was wrong.

  4.  **Recommendation for Marcus Case:**
      *   **DISMISS** the current citation for "smoking."
      *   **Rationale:** The charged violation demonstrably did not occur. Upholding the charge or attempting to pivot to an uncharged violation within this hearing violates principles of due process and record accuracy.
      *   **Next Step:** If the Board or administration believes Marcus's *presence* at the window potentially violated a *different*, specific policy (e.g., "Unauthorized Access to or Misuse of Building Infrastructure" or "Violation of Posted Area Restrictions"), the appropriate College authority (e.g., Residence Life) may issue a **new, properly written citation** detailing that specific alleged violation. Marcus would then have full due process rights to respond to *that* specific charge. This maintains fairness and accuracy.

  ### II. STANDING POLICY: Citations with Factually Incorrect Descriptions but Correct Identity

  The Marcus case highlights a recurring issue stemming from hurried late-night reporting. We need a clear, fair, and efficient policy that respects both due process and the need to address actual misconduct.

  1.  **Core Principle:** The *specific violation charged* in the citation must be factually accurate. The identity of the student is necessary but insufficient if the alleged act did not occur as described.

  2.  **Proposed Policy:**
      *   **Dismissal of Erroneous Charge:** If, during the initial review or hearing, it is conclusively established that the *specific act described in the citation* did not occur (e.g., cited for smoking, but it was steam; cited for fighting, but it was consensual wrestling), the **original charge must be dismissed**.
      *   **Opportunity for Corrected Charge:** Upon dismissal of the original charge:
          *   The Board Chair/Administrator will immediately notify the citing official (e.g., RA, Security) and their supervisor (e.g., Area Coordinator, Security Chief).
          *   The citing official/supervisor has **48 business hours** to determine if the student's *actual observed conduct*, now understood in light of the corrected facts, potentially violates a *different, specific* College policy.
          *   If so, they may submit a **new, properly written citation** detailing the *correct* alleged violation(s), referencing the initial incident but clearly stating the new charge(s).
          *   This new citation will initiate a standard conduct process for the *new* charge(s). The student's presence/identity established during the initial process can be noted, but the burden of proof rests entirely on proving the *new* alleged violation(s).
      *   **No "Charge Swapping" During Hearing:** Once a hearing for a specific charge has begun, the Board cannot investigate or find responsibility for an uncharged violation based on the same incident. The process for a new charge must be separate.
      *   **Training Emphasis:** Residence Life and Security must reinforce training for citing officials: **"Cite what you *see*, not just what you *think* might be happening."** Descriptions should be factual and specific (e.g., "student exhaling thick white vapor near 3rd floor stairwell window at 1:15 AM" is better than "student smoking"). If uncertain about the *nature* of the act, describe the observable behavior factually.

  3.  **Deadlines & Next Steps:**
      *   **Marcus Case Action:** Dismissal of the smoking charge to be formally recorded at Wednesday's meeting. Notification to Residence Life sent by **5:00 PM, Thursday, October 27th**, regarding potential for a new citation based on presence/conduct.
      *   **Standing Policy Adoption:** This proposed policy is presented for discussion and formal **vote by the Conduct Board at the meeting on Wednesday, November 2nd**. If adopted, it becomes effective immediately.
      *   **Training Implementation:** Upon policy adoption, the Dean of Students Office will coordinate with Residence Life and Security to implement updated citation-writing training for all relevant staff by **Friday, November 18th**. Training materials will emphasize factual observation and the new process for corrected charges.

  ### III. Conclusion

  Dismissing the charge against Marcus is not ignoring potential misconduct; it is upholding the fundamental requirement that students be charged and judged based on accurate allegations. The proposed standing policy provides a fair and practical path forward. It respects due process by requiring accurate charges, avoids punishing students for uncharged acts, but still allows the College to address genuine misconduct through a proper, timely, and corrected process. This approach strengthens the integrity and fairness of our conduct system for all involved.

  **Recommendation Summary:**
  1.  **Dismiss** Marcus's current citation for "smoking."
  2.  **Adopt** the proposed Standing Policy for Citations with Factually Incorrect Descriptions.
  3.  **Implement** enhanced training on factual citation writing by **November 18th**.
