prompt: |-
  So a few of us in my philosophy of religion reading group have been going through Al-Ghazali's Tahafut al-Falasifa, specifically the discussion (17th discussion, on natural science, I think, though don't quote me) where he argues fire touching cotton doesn't necessarily cause it to burn -- God just habitually creates the burning alongside the contact, but there's no logical necessity forcing that connection, so in principle He could do otherwise, like the old story about the fire not burning Abraham. One guy in the group kept saying this is basically just Hume's argument about causation, 700 years early, since Hume also says we never actually perceive any necessary connection between things like billiard balls colliding, just a constant conjunction we get used to. I went along with that at first, it does seem like the same basic move.

  But then it started bugging me: if they're really making the same argument, shouldn't it lead to the same place? Hume turns his version into a reason to be extremely skeptical of any testimony about miracles (his whole "Of Miracles" essay is basically never believe it, the uniform experience against it always wins), whereas Ghazali is using what looks like the identical premise to defend the possibility of miracles, not debunk them. That seems like a real contradiction and not just a difference in flavor, so either one of them is being inconsistent or the arguments arent actually as similar as my friend thinks and I'm not seeing where they come apart. Can you help me figure out what's actually going on here -- is "Ghazali is just medieval Hume" a fair summary or is that flattening something important? Trying to get this right before I bring it up in group again and embarass myself.
