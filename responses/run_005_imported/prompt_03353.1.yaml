answer: |-
  The Cambridge sitting room felt unnaturally still, thick with pipe smoke and the faint ozone tang of anticipation. Henry Sidgwick sat rigidly, Eleanor’s hand a cool, steadying pressure on his own. Opposite, shrouded in the dim gaslight, Eusapia Palladino slumped slightly in her chair, her heavy features slack, eyes closed. The air hummed with the collective concentration of the SPR’s finest minds – Hodgson, Myers, the Sidgwicks themselves – all focused on the scarred wooden table beneath their linked hands.

  *Again,* Henry thought, the word a dull thud against his ribs. *We begin again.* The memory of France, barely a year past, was a warm ember in his chest – the inexplicable levitations, the phantom touches, the chilling breath on his neck when no one stood behind him. Eleanor’s cautious optimism, his own flicker of *something*… a tremor in the bedrock of his relentless doubt. It had felt, for a suspended moment, like the universe might whisper its secret after all.

  Here, in Cambridge, the air was colder, the scrutiny sharper. He had insisted on it. His own demand. Rigor. Control. Proof that could withstand the withering gaze of a skeptical world, proof that could bear the weight of his ethics.

  The séance began. Eusapia sighed, a theatrical groan. The table creaked. A distinct *rap*. Sidgwick’s pulse quickened, a traitorous leap he immediately chastised. *Observation. Only observation.* He noted the direction, the intensity. Eleanor’s fingers tightened minutely. He cataloged it: physiological response, suggestive influence.

  Eusapia’s head lolled. A faint, cold breeze stirred the hair at Sidgwick’s temple. His breath hitched. *France.* The same sensation. Was it…? He forced his focus outward, scanning the room’s perimeter, the heavy curtains, the closed door. Nothing. His eyes darted back to Eusapia. Her hand, ostensibly held by Hodgson on her left, seemed… taut. The muscles in her forearm were corded, straining subtly beneath the sleeve of her dark dress.

  *Doubt, cold and precise, slid between his ribs.* He noted the tension. Hypothesis: physical exertion on her part? But for what? The breeze persisted, chilling the sweat at his nape. *Hope, fragile and desperate, unfurled a single petal.* Could it be genuine? Could this be the thread leading out of the labyrinth?

  Then came the bells. Small brass bells placed beyond reach began to chime, a thin, ethereal sound in the gloom. A murmur rustled through the investigators. Sidgwick’s gaze snapped to the cluster of bells near the curtained bay window. *Too far.* Eusapia’s hands were visibly held. His mind raced: strings? Wires? He scanned the floor, the table legs. Nothing visible. The chiming continued, a maddening, beautiful lie.

  *Rigor.* The word was a command. *Observe everything. Assume nothing.* He shifted his focus infinitesimally, not to the bells, but to Eusapia’s feet, hidden beneath the table’s draped cloth. The heavy damask hung still. Yet… was there a fractional shift in the fabric’s fold near the floor? A minute disturbance, like a fish moving under water lilies? He held his breath, every sense straining.

  A louder bell rang, startlingly close. Sidgwick’s eyes flicked towards it, then instantly back to the drape near Eusapia’s feet. And he saw it. Clear as a line of logic in a flawed syllogism. The damask twitched, jerked upwards for a fraction of a second. Not by wind. Not by spirit. By a foot. A stockinged toe, darting out and back like a thief into shadow.

  The world didn’t stop. It crystallized. The cold breeze on his neck became merely air displacement. The phantom touches, clever pressure from a freed hand or foot. The levitations? Stagecraft, exploiting darkness and expectation. The beautiful, fragile hope of France shattered, not with a crash, but with the quiet, irrevocable *click* of empirical deduction.

  He didn’t move. Didn’t cry out. Inside, it felt like a vital organ had been cleanly excised. The warmth he’d carried from France guttered and died, leaving only a hollow, aching cold. The dualism yawned before him, vast and inescapable. Duty demanded truth, demanded this exposure, demanded he dismantle the fraud with the very method he championed. Self-interest – oh, not mere comfort, but the desperate, rational *need* for cosmic justice, for a guarantee that duty and happiness could ever converge – screamed silently into the void his rigor had just exposed.

  *This is it,* he realized, the thought landing with crushing weight. *This is the point of collision.* His life’s work, his *Ethics*, demanded a moral order it could not prove. His rigorous, relentless mind, honed over decades to seek truth without flinching, had just systematically destroyed the only empirical straw he’d ever grasped at.

  He saw the future unfolding: the Society meeting, his duty to stand before them, to recount this meticulous unmasking. He would do it. Calmly, precisely, laying out the evidence as he always did. He would withdraw his support. He would uphold the method. He would be the pillar of rational inquiry.

  And in doing so, he would condemn his own ethical system to stand forever on cracked foundations. The universe remained silent, indifferent. No guarantor stepped forward. The dualism wasn't resolved; it was etched deeper, rendered intolerably permanent by his own unwavering commitment to truth.

  Eusapia groaned again, a sound of profound weariness or consummate acting. Sidgwick looked at her, not with anger, but with a profound, aching understanding. She peddled illusions for coin or notoriety. He? He had chased an illusion essential to his life’s meaning, and his own uncompromising intellect had been the wrecking ball.

  Eleanor’s hand tightened once more, a question in the pressure. He couldn’t meet her eyes. He stared at the draped table, seeing not wood and cloth, but the stark, barren landscape of a philosophy stripped bare. The bells had stopped ringing. The only sound was the frantic hammering of his own heart against the hollow cage of his ribs, and the deafening silence of a universe refusing to guarantee its own morality. His rigor had won. And in winning, it had foreclosed the only hope that could make sense of the victory. The keystone was gone, and the entire edifice trembled.
