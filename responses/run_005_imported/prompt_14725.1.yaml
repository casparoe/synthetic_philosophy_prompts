answer: |-
  Here are 10 interview questions designed to rigorously test quasi-realism on the points you specified, including anticipated follow-ups:

  1.  **The Core Expression Question:** "You argue moral sentences fundamentally express non-cognitive attitudes rather than describing mind-independent facts. Could you walk us through precisely what attitude is expressed by a simple, atomic moral judgment like 'Lying is wrong'?"
      *   *Likely Answer:* Disapproval of lying, or a commitment to disapprove of lying in relevant contexts.
      *   **Follow-Up (Geach's Embedding):** "Okay, now consider the antecedent in this conditional: *'If lying is wrong, then getting your little brother to lie is wrong.'* On your view, what is the antecedent expressing here? It clearly isn't *performing* the act of disapproving of lying in this embedded context. How does your account capture the meaning of the antecedent in such a propositional context?"

  2.  **Negation Problem (Unwin) - Core:** "Building on that, let's tackle negation. If 'Lying is wrong' expresses disapproval of lying, what attitude does 'Lying is *not* wrong' express? How is this fundamentally different from simply having *no* attitude towards lying whatsoever? What specific state of mind does the negative claim commit the speaker to?"
      *   *Likely Answer:* Perhaps tolerance, permission, or the absence of disapproval (but carefully distinguished from neutrality).
      *   **Follow-Up (Hyperplans/Normative Worlds):** "Suppose you appeal to something like Gibbard's hyperplans or normative 'worlds' to solve this – saying the negative claim expresses a state of mind compatible with lying in some complete normative system. Doesn't invoking this complex apparatus of possible normative perspectives effectively reintroduce truth-conditional semantics? What makes 'Lying is not wrong is true' meaningfully different, in terms of *explanation*, from the realist saying it's true iff lying isn't wrong *in some normative world*?"

  3.  **Generalization Beyond Conditionals:** "Assuming you have a solution for conditionals and negation, how does your account handle more complex embeddings, like disjunctions? For example, 'Either lying is wrong or stealing is wrong.' What attitude does *that* express? And crucially, how do you handle universal quantification, like 'Everything the treasurer did was permissible'? What non-cognitive state corresponds to that quantified claim?"
      *   *Likely Answer:* Expression of a complex disposition, commitment pattern, or a state accepting any instance as permissible under the treasurer's actions.
      *   **Follow-Up (Systematicity & Compositionality):** "How do you ensure that the attitude expressed by these complex sentences is *systematically* built from the attitudes expressed by their parts and their logical structure? Doesn't the need to posit distinct, complex attitudes for each logical form risk making the theory ad hoc, or simply mirror the compositional structure of a truth-conditional semantics?"

  4.  **The Frege-Geach 'Solution' - Pressing the Mechanism:** "You've likely developed a sophisticated response to Frege-Geach involving higher-order attitudes or commitments (e.g., disapproving of not disapproving of lying in certain contexts). Can you explain *exactly* what psychological state constitutes understanding and sincerely asserting the conditional 'If lying is wrong, then getting your little brother to lie is wrong'? How is this state distinct from simply *believing* a normative relation holds?"

  5.  **Moral Truth & Minimalism:** "Quasi-realism famously aims to 'earn the right' to talk of moral truth, facts, and knowledge in a minimalist/deflationary sense. Could you clarify what *substantive work* the concept of 'moral truth' is doing *within* your quasi-realist framework? Is it doing anything more than simply marking the expression of a warranted or correct attitude?"

  6.  **Moral Discovery vs. Projection:** "If moral inquiry isn't a matter of discovering mind-independent facts, but rather involves refining our attitudes through a process like coherentist reflection or sensibility training, how do you account for the strong phenomenological sense of *discovery* – the feeling that we are *finding out* what's right or wrong, not just making it up? How does quasi-realism explain the apparent objectivity of moral experience?"

  7.  **The Explanatory Burden:** "Critics often argue that realism has an explanatory advantage: it straightforwardly explains moral disagreement (clashing beliefs about facts) and moral motivation (beliefs about objective reasons). How does quasi-realism explain the *depth* and *intractability* of moral disagreement if it's ultimately about differing attitudes? And crucially, how does it explain the necessary connection between moral judgment and motivation (internalism) without making that connection seem trivial or definitional?"

  8.  **The Creeping Minimalism Challenge:** "Given how successfully quasi-realism reclaims realist-sounding vocabulary – truth, facts, knowledge, even (deflationary) objectivity – the 'creeping minimalism' worry arises. **Could you state plainly: what *substantive difference* would remain, either in your own philosophical commitments or in the commitments you attribute to the realist you oppose, if quasi-realism were simply *re-labeled* as a form of realism?** If the difference isn't captured by the reclaimed vocabulary, where *exactly* does the substantive disagreement lie?"

  9.  **Alternative Expressivist Routes:** "Some expressivists, like Horgan and Timmons (cognitivist expressivism) or Ridge (ecumenical expressivism), argue for hybrid views where moral judgments express *both* belief-like states and conative attitudes. Why is it crucial for *your* version of quasi-realism to maintain that the *fundamental* expressive function is non-cognitive? What do you gain by resisting any cognitive element at the base level that these hybrid approaches lose?"

  10. **The Cost of Success?:** "Finally, if quasi-realism is as successful as you argue – solving embedding problems, earning back truth/facts/knowledge, explaining phenomenology – does this very success potentially undermine its core expressivist motivation? If we can say *everything* the realist says using quasi-realist tools, doesn't the original metaphysical worry about 'queer' objective properties simply dissolve, perhaps suggesting the realism/anti-realism debate was misplaced all along? Or is there a crucial, ineliminable difference in *metaphysical commitment* that persists even after quasi-realism's reconstructive project?"

  **Key Rationale:**

  *   **Structure:** Starts with core expression, immediately moves to Geach (Q1 & F/U), then negation (Q2 & F/U), then generalization (Q3 & F/U) as requested. Creeping minimalism gets its dedicated punchy question (Q8).
  *   **Depth:** Questions force engagement with the *mechanics* of the view (psychological states expressed, compositionality) rather than slogans.
  *   **Anticipated Moves:** Follow-ups specifically target likely quasi-realist responses (higher-order attitudes, hyperplans, complex dispositions) and press the worry that they collapse into truth-conditional semantics or lose the distinctive expressivist claim.
  *   **Creeping Minimalism:** Q8 is phrased bluntly to demand a clear articulation of the *residual* difference, which is the heart of the challenge.
  *   **Beyond Basics:** Includes questions on phenomenology (Q6), explanation (Q7), alternatives (Q9), and implications of success (Q10) to push beyond standard seminar discussions.
  *   **Podcast Viability:** While technical, questions are framed accessibly using examples and avoiding excessive jargon, aiming for clarity for an educated audience. The focus on concrete problems (embedding, negation, quantification, minimalism) provides clear hooks.

  This set ensures the interview moves decisively beyond the undergraduate pitch and directly tests the philosopher on the most challenging technical and philosophical fronts of her position. Good luck with the recording!
