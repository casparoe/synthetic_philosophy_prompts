  Now, for a modern example. Recommender algorithms on social media are a good angle. They personalize content to maximize engagement, often creating echo chambers. How about a scenario involving a public health crisis? Let's say a measles outbreak. Anti-vaccine activists use generative AI to create personalized videos. The AI tailors messages to exploit individual fears—like for a parent of an autistic child, it emphasizes vaccine-autism links despite being debunked. These videos spread via a bot network to amplify them, targeting vulnerable communities. The result? Vaccination rates drop, measles spreads, vulnerable people die.

