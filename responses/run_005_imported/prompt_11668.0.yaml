  Here’s the exchange between **Arjun** (Nyāya-trained) and **Elena** (analytic reductionist), structured to force each to engage the other’s strongest objections. The tension simmers beneath their academic rigor, hinting at deeper personal stakes:

  ### Setting: A dim university office, rain streaking the windows. Books on Indian epistemology and Humean skepticism spill from opposing shelves.

  ---

  **Arjun:** *(Leaning forward, tapping a worn copy of the Nyāyasūtra)*  
  Elena, we’ve danced around this for years. When my niece tells me, "Aunt Priya baked mango cakes," and I *know* Priya’s reliability—her honesty, her skill—I don’t *infer* the cakes exist. I *grasp* it. Śabda is immediate. Like seeing color. Subtract inference? What’s left is the world opening through another’s voice.  

  **Elena:** *(Coolly stirring tea, steam fogging her glasses)*  
  And when Priya lies? Last Diwali, she claimed she’d made gulab jamun from scratch, but you found the box in her bin. Suddenly, your "direct grasp" evaporated. Why? Because you *inferred*—falsely—from her past reliability to present truth. Testimony isn’t a pramāṇa, Arjun. It’s a bet dressed as revelation.  

  **Arjun:** *(Eyes sharpening)*  
  You mistake the mechanism. Priya’s lie didn’t retroactively turn my *past* knowledge into inference. When she was āpta—trustworthy—my belief was *constituted* by her words. The lie *broke* that status. It didn’t reveal hidden inference; it shattered the condition for śabda. Like closing your eyes doesn’t prove sight was always inference.  

  **Elena:** *(Setting down her cup with a click)*  
  Then explain the second witness. If I tell you a tiger prowls campus, you’re uneasy. If *ten* people say it, you flee. Why? If testimony is basic, ten voices shouldn’t feel differently than one. But they do—because each new report *strengthens the inference* that the claim is reliable. Your Nyāya "basic source" crumbles under probability.  

  **Arjun:** *(Pacing, gesturing at the rain-lashed window)*  
  No—corroboration tests the *speaker’s* āpta-hood, not the knowledge-structure! One voice: I weigh if they’re credible. Ten voices: I see a consensus *about the world*, confirming the speaker isn’t deceived. But the *knowing*? Still śabda. Just as ten people shouting "red!" confirms the rose’s color, but your eyes alone give the perception.  

  **Elena:** *(Leaning back, voice taut)*  
  And infants? A toddler hears "hot!" and jerks her hand from the stove. Where’s her "assessment of āpta-hood"? She hasn’t *tested* her mother’s reliability. She can’t infer. Yet she knows. Your model demands a cognitive judgment she doesn’t have.  

  **Arjun:** *(Stopping, turning to face her)*  
  Precisely! She *doesn’t* infer. The mother’s word *carries* knowledge because the child *receives* her as āpta—through love, dependency, the fabric of relation. We’re born into śabda. Inference comes later, when trust fractures. Your reductionism ignores how knowledge begins: in vulnerability, not logic.  

  **Elena:** *(Standing abruptly, knuckles white on the desk)*  
  Vulnerability isn’t epistemology. That child learns "hot" works *because* her mother’s utterances correlate with experience—a subconscious Bayesian network. When correlation fails, belief adjusts. It’s all inference, Arjun. Wrapped in intuition, yes—but unwrap it, and you find deduction from past patterns. Always.  

  **Arjun:** *(Quietly, gripping his chair)*  
  Then unwrap this: in your courtroom scenario—where all evidence is hearsay—why does the *first* witness’s testimony feel like *evidence* at all? If it’s just an invitation to infer, why isn’t the jury told: "This is raw data; now deduce if it fits reality"? But they’re not. They’re asked: "Do you *believe* her?" Because deep down, you know. Testimony is the light, not the lamp.  

  **Elena:** *(A long pause. Rain drums the glass.)*  
  We ask "Do you believe her?" because juries assess *reliability*—a variable in the inference. But fine. Grant your "light." Then why, when one witness cracks, the whole case crumbles? If śabda were truly basic, discrediting one speaker shouldn’t poison unrelated testimony. But it does. Because it’s all one inferential chain: "Human senses fail. Human words deceive."  

  **Arjun:** *(Softly, wearily)*  
  Or because seeing one lie makes us doubt all āpta-hood. Not inference, Elena—grief.  

  *(Silence hangs. Neither moves. The argument isn’t won—it’s coiled deeper into the novel’s heart.)*  

  ---

  ### Key Philosophical Moves:
  - **Arjun’s defense against "cheap belief"**: He reframes trustworthiness (āpta) as a *pre-condition* for śabda, not an inference. Lies *revoke* the speaker’s status, exposing how śabda depends on social/moral bonds, not just cognition.  
  - **Elena’s defense against child acquisition**: She appeals to *implicit* probabilistic learning (modern cognitive science’s take on Hume). The child’s brain *does* track correlations, even if unconsciously.  
  - **Unresolved friction**: Arjun roots knowledge in relational trust; Elena in individual reason. The courtroom analogy highlights the stakes: is testimony a fragile gift or a skeptical puzzle?  

  This leaves room for your novel to explore how both views shape your characters’ misunderstandings—and how hearsay, in life and law, lives in the space *between* these poles.
