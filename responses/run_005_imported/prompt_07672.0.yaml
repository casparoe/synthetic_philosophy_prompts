  ### Justification:
  1. **His charge of double standard (Score: 1)**  
     He is substantially correct that orthodox QM's reputation for locality relies on interpretive sleight-of-hand. While Bohmian mechanics *explicitly* violates Lorentz invariance at the fundamental level, standard QM's "local" label depends on treating collapse as non-physical—a stance that avoids dynamical nonlocality only by refusing to describe measurement fully. The asymmetry in perception is real.

  2. **Her epistemic/non-epistemic distinction (Score: 1)**  
     She correctly identifies the core difference: textbook collapse is a Bayesian update (no physical mechanism), while Bohmian mechanics posits *dynamical* nonlocality via the quantum potential. This distinction is technically sound and highlights why Bohmian nonlocality is ontologically heavier.

  3. **His invocation of the measurement problem (Score: 2)**  
     This is his strongest point. The "epistemic escape" *does* come at the cost of leaving the emergence of definite outcomes unexplained—the essence of the measurement problem. By treating collapse as non-physical, orthodox QM avoids nonlocality only by being incomplete. His analogy ("buys locality by declining to describe anything fully") is apt.

  4. **Her pivot to Everett (Score: 0)**  
     While Everett *does* eliminate both collapse and Bohmian nonlocality by making all outcomes real, she glosses over open challenges. The claim that correlated outcomes "trace back to shared local origin" assumes decoherence cleanly resolves branch structure—a contested point. The move isn't wrong but oversimplifies.

  5. **His two objections to Everett (Score: 0)**  
     - *Branch locality*: Reasonable concern. Whether branching respects relativistic causality depends on the decoherence formalism used (e.g., foliation-dependence in relativistic models).  
     - *Ontological cost*: Misleading. While infinitely many branches *exist*, they emerge from unitary dynamics without new physics. Calling it "extravagant" confuses ontology with fundamental laws.  

  6. **Her "cost distinction" closing (Score: -1)**  
     Her analogy to classical fields fails: assigning values to space points is *required* by the theory's structure, whereas the infinity of branches in Everett arises from applying quantum theory universally—but this is precisely what’s disputed. Dismissing ontological proliferation as "not a cost" ignores that Bohm adds fewer *types* of entities (particles + wave) versus Everett’s infinite worlds. The distinction is question-begging.

  ### What Both Overlook:
  - **The role of empirical equivalence**: Neither addresses that all interpretations reproduce identical predictions. Debating their "costs" is purely metaphysical.  
  - **Alternatives**: They ignore frameworks like QBism or Relational QM that reject realist ontologies altogether, dissolving the nonlocality debate.  
  - **Temporal asymmetry**: The emergence of definite outcomes relies on an arrow of time not explicitly modeled in either approach.  
  - **Quantum gravity**: Both assume quantum theory is fundamental, but nonlocality/ontology may require reconciliation with gravity (e.g., wormholes in ER=EPR).  

  The exchange reveals a core tension: Bohmian mechanics *explains* definiteness at the price of explicit nonlocality, while Everett *explains* unitarity at the price of ontological inflation. Choosing between them trades one mystery for another—a stalemate reflecting deeper unresolved questions about realism in quantum theory.
