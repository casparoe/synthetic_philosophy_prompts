answer: |-
  You've hit on the core tension in Ruskin's argument, which is precisely why it's so powerful and relevant for your novel. Let's dissect your questions:

  **1. Imperfect Fidelity vs. Ontological Lie: The Stronger Claim Wins.**

  Ruskin is unequivocally making the **stronger claim**. His objection is fundamental, not contingent on skill or resources. His core arguments reveal this:

  *   **The "Life" Argument:** "That which I have above insisted upon as the **life** of the whole, that **spirit which is given only by the hand and eye of the workman**, never can be recalled... the spirit of the dead workman cannot be summoned up." This "life" or "spirit" isn't a physical feature; it's the *authenticity* of creation, the direct connection to the original maker's intent, skill, struggle, and historical moment. No replica, no matter how perfect, can possess this. It's a new creation wearing an old mask.
  *   **The "False Description" Argument:** Restoration creates "a destruction accompanied with **false description of the thing destroyed**." The replica *presents itself* as the original, as *continuous history*, which is a lie. It erases the evidence of destruction and time. A replica, even perfect, *is* a false description because it claims to *be* what it is merely *imitating*.
  *   **The "Worn Surface" Argument:** He explicitly states that even if you could copy what's left with perfect fidelity ("granting fidelity to be possible... how is the new work better than the old?"), it's still fundamentally different. The original finish, the result of the original carving *and subsequent centuries of wear*, is irreplaceable. Copying the eroded state creates a *new* surface that only *looks* old – another layer of falsity.
  *   **The Corpse Analogy:** "You may make a model of a building as you may of a corpse... but the old building is destroyed." The model/replica is a representation, a *new* object *about* the old one, not the old one itself. The original, with its unique history embedded in every genuine stone and tool mark, is gone.

  **Conclusion on Q1:** Ruskin condemns restoration *as a concept* because it inherently destroys the authentic historical object and replaces it with a forgery that falsely claims continuity. The "lie" is ontological and historical, not merely aesthetic or technical. Sufficient skill might create a *better-looking* fake, but it would still *be* a fake, lacking the essential "spirit" of the original creation and its genuine history.

  **2. The Critical Distinction: Conservation vs. Restoration - Honesty vs. Falsification.**

  This is the crux for your conservator's argument. Ruskin draws a sharp line, and understanding it is vital:

  *   **Restoration (The Lie):** Involves *removing* original material (even damaged material) and *replacing* it with new material *intended to replicate the lost form and appearance*. This act of *replacement* and *replication* is the falsification. It destroys evidence and presents the new as the old. It attempts to turn back time.
  *   **Conservation/Repair/Propping (Honest Intervention):** Involves *supporting, protecting, and stabilizing* the *existing, original fabric* without attempting to replicate lost features or disguise the intervention. Key principles here:
      *   **Minimal Intervention:** Do only what is necessary to prevent further loss or collapse.
      *   **Honesty of Material:** The new material (iron, timber) is *different* and *visibly modern*. It doesn't pretend to be medieval stonework.
      *   **Reversibility (Implied):** While Ruskin doesn't use the term, the spirit of "binding" and "staying" suggests interventions that support rather than permanently alter the core fabric irreversibly. Ties and props *could* theoretically be removed later without destroying the original stone.
      *   **Preserving Evidence:** The repair *acknowledges* the damage and decay. The "crutch" doesn't hide the "lost limb" (damage); it makes the injury and the support *visible*. The scar remains, the history is legible.
      *   **Respecting Process:** Conservation accepts that buildings age, decay, and bear the marks of time. Its goal is to *arrest destructive processes*, not to *reverse* time or *simulate* youth. It allows the building to continue its authentic life, even if frail. Propping is an act of care for the *remaining* authentic fabric.

  **Why Propping Isn't Restoration (The Hinge for Your Conservator):**

  1.  **It Doesn't Destroy Original Fabric:** It works *with* the original stones, shoring them up. Restoration removes them.
  2.  **It Doesn't Replicate Lost Features:** The iron tie or timber prop is a functional support, not an attempt to recreate a missing statue or carved detail. It makes no claim to *be* medieval stonework.
  3.  **It's Honest:** The intervention is visibly modern. It doesn't deceive the viewer about what is old and what is new.
  4.  **It Preserves History:** The damage (the "decline" or "loosening") and the effort to save it (the "crutch") are both evident. The narrative of survival is maintained.

  **Applying This to Your Novel & Conservator's Argument:**

  Your conservator's "bite" comes from embracing Ruskin's **core principle: Authenticity and Anti-Falsification.**

  *   **Her Argument Against Rebuilding "As New":**
      *   "Rebuilding the west front isn't restoration; it's destruction followed by forgery. You're proposing to remove the authentic, bomb-damaged stones – the very stones that witnessed the event, that *are* the history – and replace them with new ones carved to *look* old. That's not preserving the cathedral; it's creating a stage set."
      *   "Even if you could carve it perfectly (which you can't), it would be a lie. It erases the bomb's impact, the centuries of weathering before that, and the hand of the original masons. It presents a fiction of uninterrupted perfection."
      *   "You're confusing *preserving history* with *simulating newness*. What we have now, damaged but *real*, is infinitely more valuable than a flawless fake."
      *   "The damage *is* part of the cathedral's story now, especially after the bomb. To erase it is to deny the community's experience and the building's resilience."

  *   **Her Argument For Conservation (Propping/Repair):**
      *   "My job isn't to make it look untouched by time or tragedy. My job is to *keep the real thing standing* – the actual stones laid by medieval hands, scarred by history."
      *   "Yes, iron ties are ugly. Timber props are intrusive. But they are *honest*. They shout, 'This building is ancient, it's damaged, but we value it enough to keep it alive, *as itself*.'"
      *   "A crutch doesn't pretend to be a leg; it supports a damaged body so it can keep living. That's what we do: support the authentic fabric so its true story can continue to be told."
      *   "Freezing it in decay isn't the goal. Preventing *further* destructive loss is. We stabilize, we conserve, we make safe – but we don't falsify."

  *   **The Rival Architect's Likely Counters (for conflict):**
      *   "The public needs beauty and wholeness, not a ruin! They need inspiration, not a reminder of destruction."
      *   "Your 'honesty' is just neglect dressed up as philosophy. We have the skill to make it glorious again!"
      *   "The 'spirit' is in the *design*, not the stones. We can honor the original vision better than decay can."
      *   "Your props are unsafe/unsustainable. True preservation requires rebuilding to original strength and form."
      *   "The 'authentic' fabric is already compromised by centuries of repairs and the bomb. Where do you draw the line?"

  **The Key Distillation for Your Conservator:**

  Ruskin's principle is **the rejection of falsification in the service of presenting a false historical narrative.** Restoration *destroys* the authentic historical evidence and *replaces* it with a replica that *falsely claims* to *be* the authentic evidence. Conservation *preserves* the authentic evidence, even when damaged, using *honest, supportive, minimally invasive* methods that *acknowledge* the passage of time and the necessity of intervention. The conservator values the **genuine life, history, and authenticity** of the building over the **aesthetic ideal or the illusion of newness.** Her fight is for **truth in material and history.** This provides the strong, principled, non-sentimental core for her argument against the diocese and the rival architect. The bomb damage makes this even more potent – erasing it isn't just falsification; it's an erasure of traumatic, significant history.
