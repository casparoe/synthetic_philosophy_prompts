answer: |-
  You've pinpointed a profound and valid tension within Russell's *Marriage and Morals*. While Russell advocates for greater sexual freedom based on a consequentialist framework centered on child welfare and household stability, and diagnoses jealousy as a culturally constructed pathology, his own observations about the *actual* power of jealousy under existing social conditions create a logical imperative for greater restriction *in the present*. Applying his premises honestly to his contemporaries yields a more restrictive verdict than he draws. Here's the argument:

  1.  **Conceding Russell's Core Premises:**
      *   **Consequentialism:** Morality regarding fidelity/extramarital relationships is determined solely by consequences, primarily the well-being of children and the stability of the household environment necessary for their upbringing.
      *   **Jealousy as Destructive:** Jealousy is acknowledged as an immensely powerful, painful, and destructive passion. Russell describes it as causing "torture," "cruelty," "hatred," and posing a severe threat to marital happiness and stability. He doesn't downplay its *current* potency, only its *necessity*.
      *   **Jealousy as Culturally Constructed (Ideal Future):** Jealousy's intensity and centrality are largely products of possessive social conventions, religious teachings, and restrictive upbringing regarding sex and property. In an ideal future society with different sexual education and values, jealousy could be greatly diminished.

  2.  **The Crucial Gap: Ideal Future vs. Present Reality:**
      *   Russell's permissive conclusions for *his contemporaries* implicitly rely on individuals magically possessing the emotional resilience and lack of jealousy characteristic of his *ideal future* generation. But he explicitly acknowledges this is *not* the case.
      *   People raised under "existing conventions" (early 20th century norms Russell critiques) have been thoroughly inculcated with the very notions of sexual possession, exclusivity, and the deep emotional significance attached to fidelity that *generate* intense jealousy. Russell himself documents how powerful these feelings are *because* of this upbringing.

  3.  **Applying Consequentialism to the *Actual* Present:**
      *   Given premise (b) – the *actual, empirically observed* destructive power of jealousy in his society – extramarital relationships, *even if conducted discreetly or with initial consent*, carry an extremely high risk of triggering profound jealousy in one or both spouses.
      *   This jealousy, as Russell details, directly threatens the "stability of the household" (a core consequentialist criterion). It leads to:
          *   **Emotional Turmoil & Conflict:** Constant suspicion, arguments, resentment, and emotional withdrawal poison the domestic atmosphere.
          *   **Erosion of Trust & Intimacy:** The foundation of a cooperative parenting partnership is shattered.
          *   **Potential for Separation/Divorce:** Jealousy is a primary driver of marital breakdown, directly harming children through family dissolution.
          *   **Indirect Harm to Children:** Witnessing parental conflict, tension, and unhappiness caused by jealousy is profoundly damaging to a child's sense of security and well-being, regardless of whether the infidelity itself is discovered by the child.
      *   Therefore, for individuals raised under existing conventions (which Russell admits produce powerful jealousy), engaging in extramarital relationships creates a *high probability* of causing the very harms (household instability, damage to children) that Russell's consequentialism aims to prevent.

  4.  **Russell's Inconsistent Application:**
      *   Russell downplays this risk for his contemporaries. He suggests rational discussion, mutual consent, or discretion can mitigate jealousy. However, his own descriptions of jealousy's visceral, irrational, and overwhelming nature contradict this optimism when applied to people *formed* by the conventions he condemns.
      *   He fails to adequately grapple with the fact that the *learned* emotional responses of possessiveness and betrayal are just as "real" and consequential in the present moment as any biological drive. Dismissing them as "merely conventional" doesn't erase their causal power to destroy households.

  5.  **The Consequentialist Imperative for Restriction:**
      *   Applying Russell's *own* premises rigorously:
          1.  Core moral value: Stability for children's sake.
          2.  Empirical fact under existing conditions: Extramarital relationships carry a very high risk of triggering intense jealousy.
          3.  Established consequence: This jealousy is highly destructive to marital stability and the domestic environment, harming children.
      *   **Conclusion:** Therefore, *for people raised under existing conventions*, the consequentialist calculus, based on Russell's own observations of human psychology *in practice*, necessitates significant restriction on extramarital relationships. The potential harms (jealousy-driven instability) overwhelmingly outweigh the potential benefits (individual sexual freedom) when child welfare is the paramount concern. Permissiveness becomes reckless given the predictable emotional fallout.

  **Why this is more restrictive than Russell:** Russell advocates for considerable latitude, believing the harms can be managed through reason and evolving attitudes. Your argument, using his premises, shows that in the *transitional* period (i.e., his present and arguably ours), where powerful jealousy is the norm due to upbringing, the only way to reliably safeguard the stability he prizes is through a stronger presumption of fidelity or extreme caution regarding non-monogamy. It forces the recognition that dismantling destructive conventions cannot happen overnight and that individual experiments with freedom, *under current conditions*, pose too great a risk to the consequentialist goals Russell holds highest.

  **In essence:** Russell correctly identifies jealousy as the destructive engine, fueled by convention, that makes infidelity harmful. But by underestimating how thoroughly that engine is installed and primed in his contemporaries by the very conventions he critiques, he fails to see that his consequentialist principles, applied to the real people of his time, demand much greater restraint than he advocates. The bridge to his ideal future requires navigating the turbulent waters of present psychology, and his own analysis shows that navigating those waters safely requires stricter rules *until* the destructive force of jealousy is genuinely diminished by the new upbringing he envisions.
