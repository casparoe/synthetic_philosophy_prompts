answer: |-
  That's a profoundly insightful observation, and the dissonance you're feeling is completely warranted. You've hit on one of the most persistent and uncomfortable challenges in practical ethics: the "argument from marginal cases" (or the "species overlap problem") applied to real-world moral intuitions. Your uncle's seemingly contradictory positions highlight the tension between **species membership**, **intrinsic properties**, **relational properties**, and **moral status**.

  Let's break down why this is so difficult and whether coherence is possible:

  1.  **The Core Conflict:**
      *   **Grandmother:** Moral status is treated as *absolute* and *non-negotiable*, derived solely from being human ("she is a person, full stop"). Costs (financial, emotional, burden) are deemed irrelevant to her fundamental right to life-sustaining care, despite her current lack of cognitive capacities.
      *   **Macaques:** Moral status is treated as *contingent* and *quantifiable*. Their suffering is weighed against potential human benefits. Their capacities (which may well exceed your grandmother's current cognitive abilities – sentience, capacity for pain, social bonds, basic preferences) are dismissed as insufficient to grant them a status that precludes this calculation.

  2.  **Why "Kind Membership" Feels Like Special Pleading:**
      You're right to be suspicious. The appeal to "she is a human (a kind normally rational)" when applied to an individual who *lacks* the characteristic capacities associated with that kind (rationality, autonomy, self-consciousness) is logically precarious. It risks being:
      *   **Circular:** "Humans have special moral status because they are human."
      *   **Biologically Arbitrary:** Why is membership in *Homo sapiens* morally decisive in a way that membership in *Macaca* is not, especially when capacities overlap or reverse?
      *   **The "Moral Patient" Problem:** Moral status often hinges on *being the kind of entity that can be harmed or benefited* (a moral patient). Both your grandmother and the macaques are clearly sentient and can suffer. Why does the harm to one count absolutely while the harm to the other is merely a cost?

  3.  **Possible Attempts at Coherence (and Their Problems):**
      Can your uncle's positions be reconciled? Here are some attempts, but each faces significant challenges:

      *   **Relational Properties & Special Obligations:** The strongest defense might abandon intrinsic properties entirely for your grandmother's case. His stance isn't *really* about her *current* capacities, but about *who she is to him/his family* (his mother) and the profound social, familial, and emotional bonds that exist (or existed). The macaques, while sentient, lack this specific relational context *to him/his family/humans generally*. This explains the *emotional* reaction but struggles as a *moral principle*. Why should a lack of relationship justify causing immense suffering? Does this mean we have no obligations to suffering strangers either?
      *   **Potentiality (Flawed):** "She *was* rational" or "she *could have been* rational." This is weak. Past properties don't grant current moral status. Potentiality only makes sense for entities developing *towards* rationality (like a fetus or infant), not one regressing away from it due to irreversible disease.
      *   **Species Norms & Indirect Reasons:** Protecting *all* humans, regardless of current capacity, upholds the inviolable value placed on human life as a social norm. This protects vulnerable humans (infants, severely disabled individuals) and prevents slippery slopes. Sacrificing macaques for human benefit doesn't undermine this specific human-protective norm. However, this still relies on the prior assumption that human life *is* uniquely inviolable, which brings us back to the original arbitrariness question. It also doesn't address the direct harm to the macaques.
      *   **"Human Dignity" as a Non-Capacity-Based Status:** Some philosophies (e.g., certain Kantian or religious views) grant inherent, non-derivative "dignity" to humans simply by virtue of being human, independent of any capacities. This *could* formally reconcile his positions: Humans = Dignity = Absolute Protection; Non-Humans = No Inherent Dignity = Suffering Weighable. The problem is justifying *why* humans possess this unique metaphysical dignity without resorting to circularity or assertions that seem indistinguishable from speciesism.

  4.  **The Likely Conclusion: Incoherence or Uncomfortable Implications:**
      *   **Incoherence:** It's highly probable that your uncle's positions are driven by powerful, distinct psychological and social mechanisms (deep familial love/social taboo vs. abstract cost-benefit for distant non-humans) rather than a single, rigorously applied ethical principle. His "cost-benefit hardliner" persona applies easily to abstract problems involving non-humans or impersonal charity, but is overridden by visceral, relational imperatives when it comes to his mother. This isn't necessarily malicious hypocrisy; it's a common human inconsistency.
      *   **Revising Towards the Grandmother:** Taking the macaque position seriously *could* lead to revising the grandmother position. If moral status depends *only* on current sentience and capacity for suffering (a strong sentientist view), then burdensome treatment causing suffering with minimal benefit *might* be questioned, just as the suffering of macaques is weighed. This is deeply uncomfortable and challenges powerful taboos.
      *   **Revising Towards the Macaques:** Taking the grandmother position seriously *could* lead to revising the macaque position. If we reject cost-benefit calculations when fundamental moral status is at stake (even for beings with severely diminished capacities), and if we acknowledge macaques as sentient beings capable of significant suffering, then subjecting them to invasive research without overwhelming justification (far beyond just "expected benefit large enough") becomes highly questionable. It demands acknowledging their moral patienthood in a much stronger sense.

  **The Uncomfortable Truth:**

  You've identified a genuine fissure. Holding *both* positions with the absolute conviction your uncle displayed is very difficult to justify under a single, consistent ethical framework that doesn't ultimately rely on **speciesism** – granting special moral consideration based solely on species membership, often without sufficient justification beyond that membership.

  *   **If** moral status is grounded primarily in **current intrinsic properties** (like sentience, capacity for suffering, minimal interests), then the treatment of your grandmother and the macaques *should* be subject to similar, though not identical, ethical scrutiny based on their actual capacities and well-being. This likely elevates the status of the macaques relative to common practice.
  *   **If** moral status is grounded primarily in **species membership** or **non-property-based human dignity**, then the absolute protection of your grandmother makes sense, but the treatment of the macaques as mere cost-items becomes harder to distinguish from prejudice, unless one can provide a non-arbitrary justification for the unique status of *Homo sapiens* that doesn't ultimately collapse back into "because we are us."

  **Your insight is correct.** The dissonance arises because the "kind that's normally rational" argument is being used as a proxy for species membership when applied to an individual who lacks the rationality. This *does* function as a form of special pleading in this marginal case. Resolving the tension requires either:

  1.  **Embracing a more sentientist/capacity-based view** (which elevates animals but risks uncomfortable conclusions about humans with profound impairments).
  2.  **Embracing a strong species-norm or human-dignity view** (which protects vulnerable humans but struggles to justify the exclusion of non-humans without appearing arbitrary).
  3.  **Acknowledging the role of relationality and special obligations** in our *actual* moral psychology and decision-making (which explains the difference but doesn't easily translate into universal principles and risks parochialism).
  4.  **Accepting the inconsistency** as a reflection of the complex, sometimes contradictory, nature of human moral psychology when faced with deeply personal vs. abstract dilemmas.

  There's no easy, universally satisfying answer. The power of your observation lies in exposing how our deepest intuitions about moral status can clash when confronted with marginal cases, forcing us to examine whether our principles are truly coherent or merely comfortable.
