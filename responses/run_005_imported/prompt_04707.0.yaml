  Combining both: the protagonist is awaiting the probe's final transmission, which is the last record of the phenomenon. Simultaneously, they discover messages that shatter their perception of their partner. The climax forces a choice—save the data (preserving beauty) or let it be destroyed to preserve their relationship illusion. But the user wants the cost to be clear. Maybe saving the data means confronting the partner's truth, while losing it allows denial.

