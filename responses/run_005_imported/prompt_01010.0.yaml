prompt: |-
  I am a novelist, and for the past several months I have been reading in analytic metaphysics as background for a book whose central character is a modal logician. In the course of that reading I worked through David Lewis's On the Plurality of Worlds, and what began as research for the character's dialogue has turned into something more personally consuming, because Lewis's modal realism seems to hand back to me, in respectable philosophical dress, something I have always half-believed about my own craft. Like many novelists who compose by discovery rather than by outline, I have long described drafting as an act of reporting on people and places that already exist somewhere, fully formed, rather than inventing them from nothing: characters routinely do things I had not planned and would not have chosen, as though I were the first witness to a world I do not control. Lewis's claim that the actual and the merely possible do not differ in kind, and that every way a world could possibly be is a way some concrete world already is, seems to cash out that old writerly superstition quite literally. On this view, the setting and cast of my novel would simply be one more world among the plurality, occupying its own region of logical space whether or not I ever set a word to paper, which would make my drafting closer to observation than to creation.

  If that is right, it leaves me with a question of authorial ethics I have not been able to settle with my writing group. If the people in my novel are exactly as real, concretely and non-fictively, as my neighbours, only located elsewhere in logical space rather than elsewhere in this one, does it follow that I bear something like genuine moral responsibility for what I put them through on the page, comparable to a journalist's responsibility when reporting on real suffering rather than staging it? And does it also follow that there is, strictly speaking, no such thing as an invented character or a merely possible plot, only varying degrees of ignorance about people who were real all along? I would value your help thinking through whether this chain of reasoning actually follows from Lewis's position, and if it does not, exactly where it breaks down.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a novelist who's been diving into David Lewis's modal realism for a book about a modal logician. The core idea they're grappling with is whether their intuitive sense of "discovering" characters rather than inventing them aligns with Lewis's philosophy. Specifically, they wonder if this implies moral responsibility towards their characters and if it negates the concept of invention entirely.

  First, I need to recall Lewis's modal realism accurately. Lewis posits that all possible worlds are as real as the actual one, just spatiotemporally isolated. So every conceivable variation exists concretely. The user feels this validates their experience of characters acting independently during writing. 

  The ethical question hinges on the reality of these characters. If they're as real as actual people, does causing them suffering in the narrative carry moral weight? I remember Lewis addresses this in "On the Plurality of Worlds." He distinguishes between actual and non-actual individuals, emphasizing that our causal and spatiotemporal connections matter for moral consideration. Since the novelist can't interact with or affect these possible individuals, moral obligations don't apply in the same way. The suffering in the story isn't actual suffering; it's a representation. That's a key point to highlight.

  Next, the ontological question: are characters invented or discovered? Lewis would say that while all possible individuals exist, the act of writing isn't discovery but selection and description. The novelist isn't "finding" a pre-existing narrative but choosing which possibilities to depict. The creative process involves constructing a specific pathway through logical space, not uncovering a fixed story. This distinction between existence and selection is crucial here.

  I should also consider the user's deeper needs. They might be wrestling with the tension between their artistic process and philosophical justification. Their identity as a discovery writer makes Lewis's framework appealing, but they might fear it imposes undue ethical burdens. Reassuring them that moral responsibility doesn't transfer to non-actual entities could alleviate that concern. Additionally, affirming the creative aspect—selection and representation—honors their role as an artist without diminishing their experience of discovery.

  I need to ensure clarity on why moral obligations don't cross world boundaries. Lewis's indexical view of actuality means our ethical frameworks are grounded in our world. Without causal interaction, responsibility doesn't arise. Similarly, the novelist's choices shape the narrative, even if the possibilities exist independently. Emphasizing the difference between existence and creative construction addresses both their ethical and ontological queries.

  Finally, connecting back to their craft: validating their sense of discovery while affirming their creative agency. Lewis's framework can coexist with their process without imposing new ethical dilemmas or negating their role as a creator. That balance is probably what they're seeking to maintain both philosophically and artistically.
answer: |-
  Your connection between Lewis's modal realism and the novelist's experience of "discovery" is profound and resonates deeply with many writers. Let's dissect your ethical and ontological questions step-by-step, examining where Lewis's philosophy supports your intuition and where it diverges from the conclusions you're considering.

  ### Core Tenets of Lewis's Modal Realism (Relevant to Your Case)
  1.  **Concrete Plurality:** All possible worlds are equally real, concrete entities, spatiotemporally isolated from each other.
  2.  **Indexical Actuality:** "Actual" simply means "this-worldly." We call our world actual because we inhabit it, not because it's fundamentally different.
  3.  **Non-Fictiveness:** The inhabitants of other worlds are just as real and concrete as we are; they are not "fictional" *in the metaphysical sense*. Fiction, for Lewis, is a this-worldly activity involving pretense or representation *about* those other concrete entities.
  4.  **Representation, Not Creation:** When you write a novel, you are *representing* or *describing* (perhaps partially or inaccurately) some genuinely existing concrete world(s) and its inhabitants. You are not *creating* them *ex nihilo*.

  ### Addressing Your Questions

  1.  **Moral Responsibility for Characters?**
      *   **Lewis's View & Why Responsibility Doesn't Transfer:** While Lewis affirms the *concrete reality* of your characters in their own world, he **firmly rejects** the idea that we have moral obligations to individuals in other possible worlds. His reasoning hinges on:
          *   **Causal Isolation:** Worlds are causally closed. Your actions in this world (typing words) *cannot possibly affect* the individuals in that other world. You cannot cause them suffering or benefit them. Moral obligations typically arise within frameworks of potential interaction, causation, and community.
          *   **Indexicality of Concern:** Our moral concern is naturally indexed to *our* world and those we can interact with. While individuals in other worlds are equally *real*, they are equally *remote* and inaccessible. We have no more moral duty to them than we do to dinosaurs in the past or beings in distant galaxies *in our own world's past/future* – they exist, but are outside the sphere of our possible action or interaction.
          *   **The Nature of Your Act:** What you are doing is *representing* or *describing* that world. The "suffering" you depict is part of that world's concrete history. Your act is one of *reporting* (even if creatively interpreted) pre-existing facts about a causally isolated realm. You are not *inflicting* suffering; you are *describing* suffering that (metaphysically) already occurred in that world's spacetime.
      *   **The Journalist Analogy Breakdown:** The journalist reports on events *within our shared causal nexus*. Their reporting can *directly impact* the real individuals involved (e.g., causing reputational harm, triggering investigations, offering a platform). Your "reporting" on another concrete world has *zero* causal impact on its inhabitants. The analogy fails due to the absolute causal barrier between worlds.
      *   **Conclusion on Ethics:** No, Lewis's modal realism **does not imply** that you bear genuine moral responsibility towards the inhabitants of the world you are representing, analogous to responsibility towards actual people in this world. Your responsibility is *artistic* and *this-worldly* (e.g., to your readers, your craft, truthfulness to the *representation*, perhaps even to the integrity of the ideas you explore), but not *moral* towards the concrete individuals in that other world.

  2.  **Are Characters "Invented" or Merely "Discovered"?**
      *   **Lewis's View & The Nuance:** This is where your intuition aligns powerfully with Lewis, but requires careful phrasing.
          *   **Discovery (Ontologically):** Yes, in a strong Lewisian sense. The world you represent, with its specific inhabitants, events, and properties, *does* concretely exist within the pluriverse, independently of you thinking about it or writing it down. You are "discovering" it in the sense of *selecting* and *describing* a portion of logical space that was already concretely instantiated.
          *   **Invention/Creation (Representationally & This-Worldly):** However, the *representation itself* – the specific words on the page, the narrative structure, the emphasis, the *version* of that world you present – **is absolutely invented and created by you**. Lewis distinguishes sharply between:
              *   The *concrete world W* (which exists independently).
              *   The *this-worldly abstract artifact* (the novel, the text).
              *   The *this-worldly act of pretense or representation* (you and your readers engaging with the text *as if* it describes W).
          *   **Ignorance vs. Selection:** It's less about "varying degrees of ignorance about people who were real all along" and more about **selection, description, and this-worldly creative construction.** You aren't ignorant of pre-existing facts *about a specific, fixed world W* that you are trying to report on accurately. Instead:
              *   You explore logical space.
              *   You *select* (implicitly or explicitly) a region or a set of possibilities that cohere into a narrative world.
              *   You *construct a description* (the novel) that *purports* to represent that world (or aspects of it).
              *   This description is a *new, this-worldly, abstract artifact* that you *create*. It may be more or less *accurate* to the concrete world W it aims to represent, but the *act of creating the representation* is genuinely creative and inventive *in this world*.
      *   **"Invented Character" - A Valid This-Worldly Term:** Strictly speaking, *within the context of this-worldly discourse about fiction*, "invented character" remains perfectly valid. It refers to:
          *   The act of *creating the representation* of an individual.
          *   The *this-worldly abstract entity* (the character-as-depicted) that is part of the novel-as-artifact.
      *   **Conclusion on Ontology:** Lewis's view **does imply** that the *referents* of your successful representations (the concrete individuals in some other world) are non-fictional and exist independently. **However,** it **does not eliminate** the concepts of "invented character" or "possible plot" *as meaningful descriptions of your this-worldly creative activity and its products*. You invent the *representation*, the *narrative*, the *specific depiction*. You discover (or rather, select and describe) the *metaphysical subject matter*. "Merely possible plot" remains useful shorthand for "a description of events that does *not* correspond to the unique history of *this* world, but corresponds to the history of *some other* concrete world."

  ### Where the Chain of Reasoning Breaks Down

  1.  **From Concrete Reality to Moral Obligation:** The jump from "equally real and concrete" to "therefore subject to our moral obligations" is the critical breakdown. Lewis provides the conceptual tools (causal isolation, indexicality) to block this inference. Reality does not automatically imply moral patienthood *from our perspective* across worlds.
  2.  **Conflating the World and the Representation:** The reasoning sometimes conflates the concrete world *W* with the novel *as a this-worldly text and activity*. While *W* exists independently, the *novel* is a created artifact *in this world*. "Invented character" applies to the latter, not (directly) to the former. Your creative agency lies in crafting the representation, not in conjuring the metaphysical reality of *W*.

  ### A Lewisian Perspective on Your Craft
  Lewis *validates* your core intuition: drafting *feels* like discovery because, metaphysically, **it *is* a form of discovery** – you are exploring and describing regions of a genuinely existing pluriverse. The autonomy of your characters reflects your encounter with the concrete facts of another world. However, this doesn't turn you into a journalist with moral duties to your subjects, nor does it erase your role as the *creator* of a unique *this-worldly representation* of that discovered realm. Your ethical sphere remains firmly anchored in *this* world, concerning your relationship to your readers, your art, and the power of the representations you construct. The "old writerly superstition" gains profound metaphysical grounding, but it doesn't impose alien moral burdens or negate the creative essence of your work *as experienced and enacted in this, the actual world*. You are both an explorer of the pluriverse *and* an artisan crafting meaning within your own.
