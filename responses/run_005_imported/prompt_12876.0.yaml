answer: |-
  That situation is incredibly frustrating, and your feeling that something is wrong is absolutely valid. While your friend is *technically* correct that there's no *legally binding contract* since nothing was signed, his actions are **ethically and socially wrong** for several key reasons:

  1.  **Repeated Commitment:** He didn't just say "yeah" once. He confirmed his participation *multiple times* over *six months* of planning. Each "yeah, I'm in" reinforced the group's understanding that he was committed. This wasn't casual chat; it was active planning.
  2.  **Active Participation in Planning:** He wasn't a passive observer. He participated in picking flights and discussing details. This active involvement signals serious intent and investment in the trip.
  3.  **Reliance and Detriment:** The group *relied* on his commitment. This reliance caused tangible detriment to others:
      *   **Time & Effort:** Countless hours were spent planning *with his participation*, assuming he was part of it. That time is wasted for him now.
      *   **Financial Risk:** One friend put down a deposit on an Airbnb *for the group*, using her own money, based on the shared understanding that everyone (including him) would pay their share. His backing out directly impacts the cost-sharing agreement and potentially puts that deposit or the overall rental cost at risk for others.
      *   **Logistical Disruption:** His exit forces a scramble to re-plan lodging costs, potentially find a replacement, or adjust group dynamics last minute. It throws the whole plan into disarray.
  4.  **The "Just Being Agreeable" Excuse is Self-Serving:** This is perhaps the most galling part. Claiming he was "just being agreeable" *after* months of active planning and letting someone financially commit on his behalf is disingenuous. It retroactively dismisses the seriousness everyone else invested in the process. It suggests his agreeableness was more about avoiding awkwardness *then* than about genuine intent, which is unfair to the group who took his words at face value.
  5.  **Violation of Social Contract:** Friendships and group activities operate on a **social contract** – mutual trust, reciprocity, and keeping your word. He broke this contract. He prioritized his work opportunity (understandable) *without* regard for the commitment he made and the consequences his exit would have on his friends (unacceptable). He treated the group's effort and trust as disposable.
  6.  **Timing:** Backing out *at the moment* plane tickets need to be purchased is particularly damaging. It maximizes the inconvenience and potential cost impact on the rest of the group.

  **What he did wrong:**

  *   **Failed to communicate honestly:** If he had any potential conflicts (even a slight chance of a work trip), he should have voiced them *during* the planning, not after months of confirmation.
  *   **Misrepresented his commitment:** Repeatedly saying "I'm in" while internally reserving the right to bail without consequence is deceptive.
  *   **Violated trust:** He betrayed the trust placed in him by the group, especially the friend who fronted the deposit based on his participation.
  *   **Shirked responsibility:** Hiding behind the "no signature" excuse ignores the real-world consequences of his actions and his ethical obligation to the group. It's prioritizing technicalities over integrity and friendship.
  *   **Caused tangible harm:** His actions created financial risk, wasted effort, and caused significant inconvenience.

  **What he should have done:**

  1.  **Been honest earlier:** If his commitment was tentative, he should have said so clearly from the start ("Sounds great, but I need to see if work has anything that week").
  2.  **Communicated immediately upon conflict:** The *moment* the work trip was offered/considered, he should have informed the group: "Guys, urgent issue: I just got offered a paid work trip that exact week. I need to check if I can decline it or reschedule, but there's a risk I might have to back out. Let's talk about how this affects the plan."
  3.  **Taken responsibility for the consequences:** If he chose the work trip, he should have immediately offered to:
      *   Pay his share of the Airbnb deposit already paid (as it was committed based on his participation).
      *   Help find a replacement person to take his spot (if feasible).
      *   Apologize sincerely for the disruption and inconvenience caused by his late withdrawal.

  **Conclusion:**

  Yes, your friend is technically correct that he didn't sign a legal contract. But **he is profoundly wrong ethically and socially.** He demonstrated a lack of integrity, respect for your time and effort, and consideration for the financial risk taken on his behalf. His "just being agreeable" excuse is a weak attempt to absolve himself of responsibility for breaking a clear, repeatedly affirmed commitment that others relied upon. This isn't just about backing out; it's about *how* he backed out and the disregard he showed for the impact on his friends. His behavior damages trust within the group. The group should insist he at least covers his share of the non-refundable Airbnb deposit immediately.
