answer: |-
  Here’s a reconstruction of Lewis’s trap and a defense of a truth-conditional approach, designed to sharpen the seminar’s debate. The key is that **the Equation’s failure under conditionalization exposes a structural incompatibility between propositionality and probabilistic coherence**—not that conditionals *must* lack truth conditions.

  ### I. Why Robustness Under Conditionalization is the Killer
  Lewis’s argument assumes:
  1. **The Equation**: \( P(A \to B) = P(B|A) \) for all \( A, B \) in a non-trivial algebra of propositions (with \( P(A) > 0 \)).
  2. **Closure under Conditionalization**: For any credence function \( P \) in the family and any evidence \( E \) (with \( P(E) > 0 \)), the updated credence \( P_E(\cdot) = P(\cdot|E) \) is also in the family.
  3. **Non-Triviality**: The algebra contains at least two incompatible propositions \( A, B \) with \( A \not\models B \), \( A \not\models \neg B \), and \( P(A \land B) > 0 \), \( P(A \land \neg B) > 0 \) for some \( P \).

  **The Logical Trap**:
  - Consider \( P(A \to B | B) \) and \( P(A \to B | \neg B) \).  
  - By the Equation and probability calculus:  
    \[
    P(A \to B | B) = P(B|A \land B) = 1, \quad P(A \to B | \neg B) = P(B|A \land \neg B) = 0.
    \]
  - Now suppose we conditionalize on \( B \): \( P_B(A \to B) = P(A \to B | B) = 1 \) (from above).  
    But by the Equation applied to \( P_B \):  
    \[
    P_B(A \to B) = P_B(B|A) = 1.
    \]
  - Similarly, conditionalizing on \( \neg B \): \( P_{\neg B}(A \to B) = 0 \), and \( P_{\neg B}(B|A) = 0 \).  
  - **Crucial Move**: If \( A \to B \) is a proposition, its probability *after* conditionalizing on \( B \) or \( \neg B \) must align with the Equation *at the new credence state*. But the above shows:  
    \[
    P_B(A \to B) = 1 \quad \text{and} \quad P_{\neg B}(A \to B) = 0.
    \]  
  - Now, by the Law of Total Probability:  
    \[
    P(A \to B) = P(A \to B | B) \cdot P(B) + P(A \to B | \neg B) \cdot P(\neg B) = (1)\cdot P(B) + (0)\cdot P(\neg B) = P(B).
    \]  
  - But by the Equation, \( P(A \to B) = P(B|A) \). So \( P(B|A) = P(B) \).  
  - This implies \( A \) and \( B \) are probabilistically independent *for all P in the family*. But non-triviality requires *dependence* for some \( A, B, P \). Contradiction.  

  **Why Conditionalization Matters**:  
  The Equation alone (e.g., for a *single* \( P \)) is consistent (e.g., Stalnaker’s semantics). The collapse arises when we demand that the Equation holds *after any update*. This forces \( A \to B \) to track \( B \)’s probability *rigidly* across epistemic states, annihilating the probabilistic dependencies that make the algebra rich. The trap snaps shut because conditionalizing on \( B \) or \( \neg B \) "fixes" \( A \to B \)'s truth value, making it equivalent to \( B \) in a way that forces global independence.  

  ---

  ### II. Defending Truth Conditions: Stalnaker’s Retreat with Costs  
  I argue we **retain truth conditions** by restricting the Equation to a *single* credence function (à la Stalnaker 1976), rejecting closure under conditionalization.  

  **The Core Idea**:  
  - \( A \to B \) expresses a *context-dependent proposition* (a selection function world-shift).  
  - The Equation \( P(A \to B) = P(B|A) \) holds *only relative to an agent’s current credence function* \( P \).  
  - Updating breaks the Equation: \( P_E(A \to B) \neq P_E(B|A) \) in general.  

  **Why This Avoids Collapse**:  
  Lewis’s proof relies on the Equation holding for *all* credence functions in the family, including those after conditionalization. Stalnaker severs this link: once you update, \( P_E \) may assign \( A \to B \) a value *different* from \( P_E(B|A) \). The Equation is a synchronic norm for a fixed epistemic state, not a diachronic one.  

  **Advantages**:  
  1. **Embedding**: Truth conditions explain why conditionals embed in boolean compounds (*If A, then if B, C*; *Not (if A, B)*). Adams/Edgington must treat these as non-propositional, requiring ad hoc rules.  
  2. **Validation of Intuitions**: Some conditionals (e.g., "If this fair die shows 1 or 2, it shows even") feel truth-apt. Stalnaker accommodates this.  
  3. **Compositionality**: Avoids positing a radical semantic discontinuity between indicatives and other clauses.  

  **The Ugliest Cost**: **Embedding Problem for Probabilities**.  
  - Stalnaker’s semantics lets \( P(\text{if } A, B) = P(B|A) \) for simple conditionals, but *not* for nested ones. For example:  
    \[
    P(\text{if } A, \text{ then (if } B, C)) = P((A \to (B \to C)) \overset{?}{=} P(C|A \land B).
    \]  
    Stalnaker’s truth conditions *don’t* guarantee this equality. Worse, they can violate probabilistic constraints (e.g., \( P(A \to B) \) can be undefined when \( P(A) = 0 \), unlike conditional probability).  
  - **Result**: We lose the Equation’s elegant generalization to complex conditionals. Adams/Edgington handle embeddings via conditional *assertability*, but this lacks a unified semantics.  

  **Why Reject the Alternatives?**  
  - **Adams/Edgington (No Truth Values)**: Avoids collapse but at catastrophic cost: conditionals become semantic outliers. They cannot be beliefs, cannot embed coherently, and force a split between "propositional" and "non-propositional" logic. Their account of compounds (e.g., \( \neg(A \to B) \)) is notoriously clumsy.  
  - **Trivalent Approaches (e.g., de Finetti, Bradley)**: Assign \( A \to B \) "void" when \( A \) is false. But this *still* faces triviality if the Equation is modified to \( P(A \to B | A) = P(B|A) \) and closure is demanded (see Hájek’s 1989 extension of Lewis).  
  - **Kratzer (If as Restrictor)**: Cleverly avoids the Equation by making "if" non-proposition-generating. But it struggles with *isolated* conditionals ("If it rains, the match is canceled") which intuitively express a single thought, not a covert modal.  

  **Conclusion**: Lewis showed that **conditionals cannot be propositions that *always* align with conditional probabilities across epistemic states**. Stalnaker’s retreat—sacrificing the Equation’s universality to save truth conditions—is the least bad option. Yes, we pay a price: the Equation becomes a local, synchronic principle, not a global norm. But this reflects a deep truth: conditionals are *epistemically fragile*, shifting meaning with context. The collapse isn’t proof that conditionals lack truth values; it’s proof that their truth depends on a *perspective* that breaks under conditionalization.  

  **For the Seminar**: This forces students to see that Lewis’s result is about *dynamic coherence*, not semantics per se. The Adams/Edgington line is a reaction, not the only rational outcome—and it carries heavier burdens than they suppose.
