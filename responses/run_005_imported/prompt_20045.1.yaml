  The user's deeper concern might be about the practicality of moral criticism in a world full of imperfect people. They might be seeking reassurance that moral judgments aren't rendered meaningless by widespread hypocrisy. Philosophical responses like the Minimal Blame Thesis or the separation of wrongness from standing address this. Also, the idea of blame shifting to a third party or the hypocrite reforming could mitigate the nihilism implication.

  I should check if the user is confusing the inability to blame with the absence of wrongness. That's crucial. The act remains wrong regardless of who points it out. Also, they might not be considering that standing is role-specific and context-dependent. A hypocrite in one area might still have standing in another, or they might regain standing by apologizing.

  The user's identity as a student in Ethics Bowl suggests they need clear arguments for debates. They might benefit from understanding key philosophers like Wallace, Todd, and Fritz and Miller. Emphasizing the conceptual distinctions and conditions for standing would strengthen their case. Also, addressing the practical solutions like third-party blamers or redemption could provide counterpoints to the nihilism claim.

