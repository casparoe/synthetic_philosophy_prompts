answer: |-
  That's an incredibly sharp observation that cuts to the heart of a major debate in moral philosophy, particularly in the literature on blame, hypocrisy, and standing. You're absolutely right to see the tension, but philosophers generally **reject the slide into practical moral nihilism**. The key move is to distinguish between two separate ideas that your argument runs together:

  1.  **The Wrongness of the Act:** Is the teenager's speeding morally wrong?
  2.  **The Standing to Blame:** Does the *specific parent* have the legitimate authority or position to *express* that blame *to the teenager* in that context?

  The core philosophical response is: **The wrongness of the act (1) is independent of the standing of any particular potential blamer (2).** Hypocrisy undermines *standing*, not *wrongness*.

  Here's how philosophers untangle this and avoid nihilism:

  1.  **Separating Act Wrongness from Blamer Standing:** Philosophers like R. Jay Wallace ("Hypocrisy, Moral Address, and the Equal Standing of Persons") and Patrick Todd ("A Unified Account of the Moral Standing to Blame") argue forcefully for this distinction.
      *   The teenager's speeding *is* wrong (assuming it is reckless, endangers others, etc.), regardless of the parent's hypocrisy. The wrongness is a fact about the act and its consequences.
      *   The parent's hypocrisy means they lack the *moral authority* or *standing* to *call out* or *express blame* for *that specific fault* to *that specific person* in *that specific way*. Their blame is illegitimate *as a form of moral address* coming *from them*.

  2.  **The Conditions for Standing (and Why Hypocrisy Undermines It):** Philosophers propose various conditions for having standing to blame. Hypocrisy violates several key ones:
      *   **Non-Hypocrisy Condition:** You shouldn't blame others for faults you freely and currently exhibit without remorse or change (R.A. Duff, Wallace, Todd).
      *   **Victim Condition (often):** Blame is typically addressed *to* the wrongdoer. Hypocrisy suggests the blamer isn't genuinely committed to the norm they invoke in a way that gives them the right to demand compliance *from this person* (especially if the blamer violates the norm towards the *same* person, like a parent endangering the family through their own speeding). (Wallace emphasizes the relational aspect).
      *   **Clean Hands Principle:** To credibly call someone to account, your own hands shouldn't be dirty with the *same* moral failing (Kyle G. Fritz & Daniel J. Miller, "Hypocrisy and the Standing to Blame").
      *   **Sincerity & Integrity:** Hypocritical blame lacks sincerity. It expresses a commitment to a norm the blamer doesn't actually hold themselves to, undermining its force as moral communication (Bernard Williams, others).

  3.  **Why This Doesn't Lead to Nihilism:**
      *   **Third Parties Retain Standing:** Just because the hypocritical parent loses standing doesn't mean *no one* has standing. A police officer, a driving instructor, or even a friend who *doesn't* speed themselves *retains* the standing to blame the teenager. The wrongness of the act persists, and others *can* legitimately call it out. The disqualification is agent-relative and fault-specific.
      *   **Not Everyone is a Hypocrite About Everything:** While moral imperfection is universal, hypocrisy requires a *specific* fault: blaming someone for X while being *guilty of X oneself*, especially without remorse or effort to change. Many people *aren't* hypocrites about *specific* faults they blame others for. They might be flawed in other areas, but that doesn't automatically disqualify them from blaming *this* fault in *this* instance.
      *   **Scope and Severity Matter:** Standing isn't always all-or-nothing. A parent who *occasionally* speeds 5mph over might still have *some* standing to blame a teenager for *recklessly* speeding 30mph over, especially if the parent acknowledges their own minor fault. The degree of hypocrisy and the severity of the fault impact the *degree* to which standing is undermined (Todd discusses this).
      *   **The Blamer Can Regain Standing:** If the hypocritical parent sincerely apologizes for their own speeding, commits to change, and *then* addresses the teenager's speeding, they may *regain* some standing. Standing is context-dependent and can change.
      *   **Distinguishing Blame from Other Responses:** Even if the parent lacks standing to *blame* (a specific moral sanction), they might still have standing to *warn* ("Speeding is dangerous, please slow down"), *advise*, or *express concern* without invoking the full force of moral condemnation. They can focus on the consequences rather than wielding moral authority they lack.
      *   **The "Minimal Blame Thesis" (or the "Appropriateness" of Wrongness):** Some philosophers (like Gary Watson) argue that even if hypocritical blame is illegitimate *as address* (it fails to communicate effectively or authoritatively), the *judgment* that the act is wrong ("blame" in a thinner sense) can still be *appropriate* or correct. The act *is* blameworthy; the hypocrite just can't effectively or legitimately *administer* that blame.

  4.  **What Philosophers Generally Conclude:**
      *   **Yes:** Hypocrisy *can* and often *does* undermine a specific person's *standing to blame* a specific other person for a specific shared fault in a specific context.
      *   **No:** This does *not* mean:
          *   The blamed act wasn't wrong (Wrongness remains).
          *   *No one* can blame the act (Third parties can).
          *   The hypocrite can *never* blame *anything* (They retain standing for faults they don't share).
          *   Moral criticism collapses entirely (Wrongness exists independently; others can blame; hypocrites might regain standing or offer non-blaming responses).

  **In essence:** You've correctly identified a powerful challenge to the legitimacy of *specific instances* of moral address from *specific hypocritical individuals*. However, philosophers counter that the *wrongness of actions* is a separate matter and that the social practice of blame has multiple potential participants. The disqualification of one hypocritical blamer for one specific fault doesn't silence all moral criticism or erase the wrongness of acts. The framework commits to the *conditional nature of standing*, not to the non-existence of wrongness or the impossibility of legitimate blame altogether. Practical moral nihilism is avoided by maintaining the crucial distinction between the *wrongness of the act* and the *standing of the blamer*.

  This is a fantastic Ethics Bowl topic – it forces clarity on the nature of blame, hypocrisy, and moral authority! Good luck!
