  Over dinner last week, two friends of mine — both attorneys, though neither works in family law — fell into a long disagreement about whether the U.S. states that still ban marriage between first cousins should repeal those laws, and I haven't been able to decide who came out ahead. I'd like you to go through their exchange move by move rather than just declaring an overall winner.

  (1) Renata opened by arguing that the bans should fall: first-cousin marriage is legal across most of the world and in a sizeable number of U.S. states, the people involved are consenting adults, and the one harm anyone ever cites — an elevated genetic risk to future children — is, by most estimates, smaller than the elevated risk associated with other reproductive choices, such as childbearing past a certain maternal age, that no one proposes to criminalize. So whatever the state's official rationale, she concluded, protecting children can't really be doing the work; the law is simply enforcing a taboo under the cover of child protection. (2) Marcus replied that this moved too fast, for two separate reasons: a state can legitimately use a rough, bright-line category rather than case-by-case genetic screening for administrability, and, independently, a society's settled, deeply felt revulsion toward a practice is itself a reason it may legislate on, not merely a stand-in for harm that has to cash out in some calculation. (3) Renata shot back that "people feel it deeply and widely" is exactly the argument once used to defend bans on interracial marriage, so the popularity or intensity of a conviction can't be what justifies enforcing it by law — Marcus owes some reason to think this particular conviction tracks something real, rather than just noting that it's common. (4) Marcus answered that his own administrability point already shows that laws routinely rest on rules that go beyond precise, individualized harm calculations, so the real question is not whether a law is harm-calibrated but whether this widely shared conviction looks more like moral insight or mere prejudice; and unlike the interracial-marriage case, where the ban visibly served an identifiable interest (maintaining a racial hierarchy of property and status), revulsion at cousin marriage doesn't obviously serve any group's self-interest, which makes it harder to dismiss as power dressed up as moral