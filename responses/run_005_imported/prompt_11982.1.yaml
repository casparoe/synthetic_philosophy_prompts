prompt: |-
  So in my seminar on causation we just went through al-Ghazali's occasionalism back to back with Malebranche's, and on the surface they sound almost identical (no real secondary causes, God's doing all the causal work, fire doesn't actually burn cotton etc) but I feel like there's more of a gap between the two then people give credit for. Can you compare them properly for me? Ghazali gets there through the kalam atomism / divine omnipotence route and seems to leave it kind of open whether secondary causes even exist (he just says we can't prove necessary connection), while Malebranche flat out denies bodies have any causal power at all bc of the whole cartesian mind-body interaction mess. Does that make Malebranche the "stronger" occasionalist of the two? And does tying the view to a specific background metaphysics (atomism vs substance dualism) make either position more fragile than the other?
