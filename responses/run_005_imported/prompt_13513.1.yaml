  First, I need to understand the core disagreement. Fricker frames hermeneutical injustice as a structural gap in collective understanding, while the guest sees it as active suppression or exclusion of existing marginalized knowledge. The user's deeper need seems to be pushing the guest to clarify distinctions between concepts, defend against potential reductivism, and test edge cases.

  For the testimonial injustice overlap question: The guest will likely distinguish between testimonial (individual credibility deficit) and hermeneutical (structural suppression of concepts), but I need a follow-up that forces her to explain why it's not just systemic testimonial injustice. Maybe using a concrete example like workplace harassment before the term existed.

  On the blame vs. structure tension: She'll probably argue that structural exclusion doesn't require individual blame but systemic patterns. The follow-up should challenge whether "willful ignorance" reintroduces culpability, perhaps asking about mechanisms that aren't intentional but still exclusionary.

  For the genuine gap case: She might concede it's possible but rare, emphasizing that most cases involve suppressed alternatives. The follow-up should press on whether this weakens her framework's universality, maybe using a historical example like pre-linguistic trauma responses.

  Other angles to cover: How power operates in knowledge circulation (beyond simple exclusion), whether marginalized groups can perpetuate hermeneutic harms, practical solutions beyond mainstreaming vocabulary, and if her view implies dominant groups can't contribute to hermeneutic resources.

