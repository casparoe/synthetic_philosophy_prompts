answer: |-
  You've hit on a crucial case study! The Bem precognition saga (2011) is indeed a powerful illustration of how **p-values alone can be dangerously misleading**, especially with questionable research practices (QRPs) and implausible hypotheses. Wagenmakers et al.'s (2011) Bayesian reanalysis was a landmark demonstration. However, your stats PhD friend is also right: **it's not that simple, and priors *are* doing a lot of work.** Switching entirely to Bayes Factors (BFs) isn't a magic bullet. Here's why:

  1.  **The Power (and Problem) of Priors:**
      *   **Bayes Factors quantify evidence *relative to a prior belief*.** BF = P(Data | H1) / P(Data | H0). Crucially, `P(Data | H1)` depends on the *prior distribution* specified for the effect size under H1.
      *   **Wagenmakers used a *skeptical* prior.** He centered the prior distribution for the effect size under H1 *at zero* (no effect) with a *small spread* (a "default" Cauchy prior). This prior essentially says, "We think any real effect is probably small or nonexistent." Unsurprisingly, against this skeptical prior, Bem's data provided only "anecdotal" evidence (BFs around 1-3).
      *   **What if the prior was different?** Imagine a researcher who genuinely believed precognition was possible and used an *enthusiastic* prior centered on a *larger effect size* with a *wider spread*. `P(Data | H1)` could become much larger, leading to a *high* BF supporting H1 *even with the same data*. The BF result is inherently tied to the chosen prior.
      *   **The Subjectivity/Objectivity Debate:** This is the core of the frequentist objection. Frequentists aim for "objective" error rates (Type I/II) based solely on the sampling distribution. Bayesians argue that *some* prior is always implicit (e.g., in choosing what to study) and that making it explicit is more honest. However, *choosing* that prior involves judgment, which can be controversial, especially for novel or implausible claims like precognition. Wagenmakers' skeptical prior was *reasonable* for precognition, but "reasonable" can be debated.

  2.  **BFs Don't Automatically Solve QRPs:**
      *   **p-hacking can *also* hack Bayes Factors.** If a researcher runs many analyses, selectively reports the one with the highest BF, or tunes their prior after seeing the data to get a favorable BF, the problem persists. Bayesian methods require the same commitment to pre-registration and transparency as frequentist methods to prevent this.
      *   **Publication Bias remains.** Journals are more likely to publish studies with high BFs (e.g., BF > 10 or BF > 30) supporting an interesting H1. This still creates a distorted literature, just like publishing only p < .05. Negative results (BFs favoring H0) or "inconclusive" results (BFs near 1) are less likely to be published.

  3.  **The Replication Crisis is Multi-Factorial:**
      *   **Low Statistical Power:** Many failed replications stemmed from original studies being underpowered (too small sample sizes). This increases false positive rates *and* makes true effects harder to detect. While Bayesian methods can incorporate power considerations more naturally (e.g., via prior predictive checks), they don't automatically fix underpowered studies. Researchers still need to design adequately powered studies.
      *   **HARKing (Hypothesizing After Results are Known):** Inventing a hypothesis *after* seeing the data. BFs won't save you if the hypothesis was crafted to fit the data. Preregistration is the solution here.
      *   **Questionable Analysis Choices:** Flexibility in data cleaning, outlier handling, covariate inclusion, etc. This flexibility can be exploited under *any* statistical framework without strong safeguards.
      *   **Incentive Structures:** The "publish or perish" culture, pressure for novel, positive results. Changing statistical methods alone doesn't fix the underlying incentives that drive QRPs.

  4.  **Practical Challenges with BFs:**
      *   **Computational Complexity:** Calculating BFs for complex models can be computationally intensive compared to calculating p-values for standard tests.
      *   **Choosing Default Priors:** There's ongoing debate about what constitutes a good "default" prior for BFs, especially in novel fields. Wagenmakers' default Cauchy prior is common but not universally accepted.
      *   **Interpretation:** While thresholds exist (e.g., BF>3: "some evidence", BF>10: "strong evidence"), interpreting BFs requires understanding the prior and the context. p-values, for all their flaws, have a single (albeit often misinterpreted) definition.

  **So, where does that leave us with Bem and the Replication Crisis?**

  *   **You are absolutely right:** The Bem case is a devastating indictment of relying *only* on p < .05, especially for implausible claims. It spectacularly demonstrates how QRPs can produce "statistically significant" results for nonsense. Wagenmakers' BF analysis provided a much more sober and scientifically appropriate assessment *in that specific context*.
  *   **BFs *are* a valuable tool:** They force explicit consideration of the alternative hypothesis and the plausibility of effect sizes. They are less susceptible to the "stopping rule" problem (when to stop collecting data). They can quantify evidence *for* the null. Widespread adoption of BFs *alongside* p-values would likely improve research.
  *   **But they are not a panacea:** The "prior dependence" is fundamental. For highly implausible claims (precognition), a skeptical prior is essential. For well-established effects, a more informed prior might be appropriate. The replication crisis requires a *systemic* solution:
      *   **Preregistration:** Locking down hypotheses, methods, and analysis plans *before* data collection.
      *   **Larger Sample Sizes:** Increasing statistical power.
      *   **Transparency:** Open data, open code, open materials.
      *   **Focus on Effect Sizes & Confidence/Credible Intervals:** Moving beyond simple dichotomous "significant/non-significant" thinking.
      *   **Replication Efforts:** Valuing and funding direct replications.
      *   **Incentive Reform:** Rewarding robust methods, transparency, and replication over novelty alone.

  **Conclusion:** The Bem case brilliantly shows why **p < .05 is woefully insufficient and easily gamed.** Bayesian analysis, particularly Bayes Factors, offers a powerful alternative that *can* provide a more realistic assessment of evidence, *especially* for surprising claims. However, your friend is correct that **"switch everyone to Bayesian analysis" isn't a simple slam-dunk solution.** Priors introduce necessary but potentially subjective judgment, BFs can still be hacked, and the replication crisis stems from deeper methodological and systemic issues that require broader reforms. BFs are a crucial *part* of the solution toolkit, but they are not the *whole* solution. The key is moving towards a more holistic, transparent, and rigorous research culture, regardless of the specific statistical framework used.
