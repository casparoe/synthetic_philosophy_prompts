answer: |-
  ## The Verdict on Humphrey: Why Counterpart Theory Wins for Contingent Beings

  The debate between David Lewis's counterpart theory (CT) and Saul Kripke's genuine transworld identity (TWI) as accounts of *de re* modality for ordinary contingent particulars like Humphrey Bogart, or indeed Humphrey the politician, is a clash of fundamental metaphysical commitments. While Kripke's intuitive objection – that CT changes the subject – carries undeniable rhetorical force, a careful weighing of the core problems reveals that counterpart theory offers the more coherent and defensible framework for understanding how concrete individuals like us could have been otherwise. **For contingent, spatiotemporal particulars, counterpart theory wins the exchange, primarily because it navigates the problem of accidental intrinsics where transworld identity founders.**

  Kripke's objection strikes at the heart of CT's alleged failure to capture *de re* concern. If Humphrey *himself* only exists in this world, Kripke argues, then a merely similar individual winning an election in another world doesn't make it true that *Humphrey* could have won. It makes it true that someone *like* Humphrey could have won. Why should *Humphrey*, sitting dejected in his study, care about the vicissitudes of some distant doppelgänger? This seems to rob modal claims of their personal significance. Lewis's reply is characteristically deflationary yet insightful: our practical concerns *are* world-bound. Humphrey cares about *his* actual losses and gains. When we say "Humphrey could have won," we express a truth *about this world* – namely, that it contains an individual (Humphrey) who has counterparts in other worlds who win elections. Humphrey's *actual* relief or regret stems from comparing his actual situation to the situations of his counterparts, understood via relations of similarity under counterpart relations fixed by context and our interests. While this doesn't satisfy the craving for Humphrey *himself* to be victorious elsewhere, it captures the functional role of modal thought: we assess possibilities *for us* by considering relevantly similar scenarios involving relevantly similar individuals. The "caring" objection, while powerful emotionally, doesn't falsify CT's semantic analysis; it highlights a mismatch between our deep-seated desire for literal self-transcendence and the metaphysical constraints of concrete existence.

  The decisive advantage for CT emerges when we turn to the crippling problems facing TWI. Chisholm's paradox demonstrates the absurdity of relying on minimal difference chains for identity across worlds. If we move from world W1 to W2 by altering Humphrey only minutely (say, losing a single skin cell), he remains identical. Repeating this process a billion times, we arrive at a world Wn where Humphrey lacks all properties he had in W1. Yet, by the transitivity of identity demanded by TWI, Humphrey-in-W1 must be identical to Humphrey-in-Wn – an individual utterly unlike him. This reductio undermines the very notion of strict identity across significantly different possible situations.

  Even more devastating is Lewis's problem of accidental intrinsics. Consider Humphrey's property of having four limbs. This seems paradigmatically intrinsic – a property he has purely in virtue of himself, independent of external relations. In the actual world, Humphrey has four limbs. Now consider a possible world where Humphrey has only three limbs. If TWI holds, the *very same* concrete particular, Humphrey, exists in both worlds. But how can the *same* concrete object both have four limbs and lack four limbs (i.e., have three)? To say he has four limbs *at* world W1 and three limbs *at* world W2 doesn't resolve the contradiction inherent in attributing incompatible intrinsic properties to the *same* entity. It merely relabels the problem. TWI proponents are forced into one of two unpalatable options: either deny that limb count is truly intrinsic (rendering it mysteriously relational to worlds), or embrace modal variation in essential properties – a position that collapses the distinction between essence and accident fundamental to modal discourse. Neither option is satisfactory for understanding ordinary contingent objects.

  **CT, however, dissolves these problems elegantly.** Humphrey exists only in the actual world. The three-limbed individual in another world is merely a counterpart – similar to Humphrey, sharing many properties (including arguably essential ones like origin), but numerically distinct. There is no single concrete entity bearing incompatible intrinsic properties. The counterpart has three limbs intrinsically *in its own world*. Humphrey has four limbs intrinsically *in his world*. The contradiction vanishes because the properties are held by different individuals. Similarly, Chisholm's chain doesn't force identity between dissimilar individuals; it merely shows a long chain of counterparts linked by similarity, without the transitive identity relation that leads to absurdity. CT grounds modal truth in similarity relations between distinct world-bound individuals, avoiding the metaphysical incoherence of a single concrete particular persisting identically across worlds with varying intrinsic properties.

  **The Verdict:** While Kripke's objection highlights an intuitive discomfort with CT, it ultimately targets a psychological desire for literal transworld existence that TWI cannot coherently satisfy for contingent, intrinsically mutable beings. The problems of accidental intrinsics and Chisholm's paradox are fatal blows to TWI's core claim of strict identity across worlds. They reveal a deep incompatibility between the nature of concrete particulars – whose accidental properties demonstrably *can* vary – and the logical requirement that identical entities share all properties. **Counterpart theory, by relinquishing strict transworld identity in favor of counterpart relations based on similarity and context, provides the only coherent account of *de re* possibility and necessity for entities like Humphrey.** It preserves the distinction between essence and accident, handles variation in accidental intrinsics without contradiction, and avoids the absurdities of minimal difference chains. The cost is accepting that modal truths about us are ultimately truths about our counterparts, not about our literal selves in other realms. But for understanding how ordinary, flesh-and-blood, changeable things *could have been* different, this cost is not merely acceptable; it is necessitated by the metaphysics of contingency itself. Humphrey may not literally triumph elsewhere, but counterpart theory ensures the truth of his possibility, grounded firmly in the similarity structures of the pluriverse. That’s the account worth defending in your seminar.
