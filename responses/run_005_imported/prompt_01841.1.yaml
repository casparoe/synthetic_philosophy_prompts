  Ok this is a weird one but bare with me. I have a bad shellfish allergy and started carrying an epipen after a scary reaction a few months back, and my roommate (she's doing a philosophy PhD) told me over dinner that I'm basically a real-life case of what her field calls a "masked disposition" -- I'm still allergic, I just never actually go into anaphylaxis because the epinephrine intercepts it every time. She also mentioned theres a totally different problem called "finkish" dispositions that supposedly breaks the same theory (the simple conditional analysis of dispositions) in a different way, but I couldn't follow the distinction she was drawing between the two. Using the classic cases -- Martin's finkish wire, Johnston's masking example, Bird's poison-and-antidote case -- can you actually lay out how finks and masks differ as counterexamples to the conditional analysis? Are they doing genuinely different kinds of damage to the theory, or is it basically the same problem wearing two hats? And which one do you think is the bigger problem for someone trying to defend Lewis's reformed conditional analysis? Bonus question: does my epipen situation actually count as a clean case of masking, or am I mangling the concept?
