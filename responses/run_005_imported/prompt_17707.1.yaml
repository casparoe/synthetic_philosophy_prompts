  First, for Lewis' triviality: The key tension is why it disproves truth conditions rather than just Adams' thesis. I recall Lewis showed that if conditionals have truth conditions and satisfy Adams' probability requirement, probabilities collapse. Truth-conditional theorists would say this only refutes Adams, not truth conditions. The question should press why we must abandon truth conditions entirely. 

  For the follow-up: If she says Lewis leaves no room for truth conditions, I'll challenge whether all truth-conditional approaches are equally vulnerable. Does she dismiss parameterized or dynamic semantics too quickly? 

  Next, embedding: Without propositions, how do negated/nested conditionals work? Adams struggled with this. Her probabilistic account must explain constructions like "If it's not true that if P then Q..." or "If (if P then Q) then R". 

  Follow-up: If she appeals to probabilistic coherence constraints, I'll ask why that isn't just redescribing the problem. Does it capture our intuitions about what these sentences mean? 

  For probabilistic validity: Adams replaced truth-preservation with probability-preservation. But is this really "validity" or just changing the subject? The question should probe whether this accounts for why we care about validity - avoiding false conclusions. 

  Follow-up: If she says truth isn't the point, I'll push back with examples where high probability premises yield low-probability conclusions that feel invalid. Does her system explain that intuition? 

  The user also wants 5-7 other original questions. I'll include: 
  - Why not accept a hybrid view (truth-conditions + probabilistic communication)? 
  - How she handles quantified conditionals 
  - Whether her view affects practical deliberation 
  - If she's moved by recent truth-conditional advances 
  - A "devil's advocate" question about modus ponens intuitions 

  For tone: These should be rigorous but charitable - pressing objections while leaving room for nuanced replies. The follow-ups need to anticipate her likely responses while avoiding gotcha rhetoric. 

