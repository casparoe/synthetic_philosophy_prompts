answer: |-
  Here are 8 interview questions designed to push beyond restatement, targeting the core challenges you specified, with follow-ups anticipating likely responses:

  **Core Targeted Questions & Follow-Ups:**

  1.  **On Lewis's Triviality & Truth Conditions:**
      *   **Question:** Lewis's triviality results show that Adams' Thesis (P(If A, then C) = P(C|A)) is incompatible with the conditional expressing a *single* proposition across all contexts, assuming standard probability. But why must this lead to abandoning truth conditions *altogether*, rather than concluding that either (a) Adams' Thesis is false (as truth-conditional theorists argue), or (b) conditionals express propositions whose content is *contextually variable* or *non-classical*? What specifically rules out *those* truth-conditional options?
      *   *Likely Response & Follow-Up:* (She might emphasize the generality of Lewis's proof, showing *no* proposition satisfying Adams' Thesis can avoid triviality under natural assumptions).
      *   **Follow-Up:** Okay, so the argument is that *any* proposition assigned as the truth-conditional content of "If A, C" that satisfies Adams' Thesis leads to absurdity. But doesn't this still leave room for truth-conditional theories that *reject* Adams' Thesis as capturing the *full* meaning? Couldn't they argue Adams' Thesis describes a crucial *epistemic* or *pragmatic* feature *about* the truth-conditional content, rather than *being* the meaning? How do you rule *those* out?

  2.  **On Embedding & Compositionality:**
      *   **Question:** If "If A, C" doesn't express a proposition, what is its semantic contribution in complex constructions? Take negation: "It is not the case that if Oswald didn't shoot Kennedy, someone else did." What does the negation operator apply to? Or nesting: "If (if inflation rises, the Fed hikes rates), then markets will panic." How does the antecedent, itself a conditional, function semantically within the larger conditional without being a proposition?
      *   *Likely Response & Follow-Up:* (She might appeal to a non-propositional semantic type, probabilistic coherence constraints on credence functions, or dynamic update effects).
      *   **Follow-Up:** That suggests embedding works via constraints on rational *attitudes* (credences) rather than compositional operations on *contents*. But doesn't this risk making the *meaning* of embedded conditionals radically different from their unembedded use? How does your account explain the *felt semantic unity* of a conditional phrase across embedded and unembedded occurrences, or capture the specific *logical relations* we intuitively grasp in complex sentences involving conditionals?

  3.  **On Probabilistic Validity:**
      *   **Question:** You advocate replacing truth-preservation with probabilistic validity (PV): an inference is PV if it never takes you from premises all of high probability to a conclusion of low probability. But critics argue this changes the subject – "validity" classically concerns *truth*, not just *rational confidence*. Why should we accept PV as capturing the *normative force* of logical consequence, rather than seeing it as a distinct (though important) *epistemic* norm? Doesn't calling it "validity" risk conflating distinct concepts?
      *   *Likely Response & Follow-Up:* (She might argue truth-preservation is irrelevant for indicative conditionals since they lack truth conditions, and PV is the *relevant* norm for reasoning under uncertainty).
      *   **Follow-Up:** But consider a PV-valid argument with highly probable premises leading to a highly probable conclusion, where the premises are *accidentally* true but the conclusion is *false* due to a misleading connection (e.g., flawed statistical reasoning). Classical validity would flag the *form* as potentially unsound. PV wouldn't. Doesn't this show PV fails to capture the core logical idea of *guaranteeing truth* when premises are true, precisely because it sidesteps truth altogether? How is PV more than just a rule for preserving subjective confidence?

  **Additional Probing Questions:**

  4.  **Beyond Adams' Thesis:** Adams' Thesis (P(If A, C) = P(C|A)) is central, but are there compelling reasons *independent* of the triviality results or embedding issues to think conditionals *fundamentally lack* truth conditions? For instance, what does your view reveal about the *essential function* of indicative conditionals in communication that truth-conditional views obscure?
  5.  **The Hybrid Challenge:** Some theorists (e.g., Jackson) grant conditionals truth conditions but argue Adams' Thesis captures their *assertability* condition. Why is this hybrid view unsatisfactory? Doesn't it seem to preserve the benefits of both approaches – explaining embedding via truth conditions *and* our probabilistic intuitions via assertability?
  6.  **Quantified Conditionals:** How does your non-propositional view handle universally quantified conditionals like "Every student who passed studied hard"? Doesn't this seem to straightforwardly express a general proposition about the world? Does your analysis force a fundamental semantic split between singular and quantified conditionals?
  7.  **Practical Deliberation & Conditionals:** Conditionals are crucial in practical reasoning ("If I do X, then Y will happen"). If they lack truth conditions, how does your account explain the role they play in *justifying actions*? Are we only justified in acting *as if* the conditional probability is high, rather than acting based on a belief about a conditional *fact*?
  8.  **The Intuition of Factuality:** Even if your arguments are compelling, there's a strong *intuition* that when I say "If Oswald didn't shoot Kennedy, someone else did," I'm asserting *something* about the world that could be right or wrong. How do you diagnose and explain away this persistent intuition without appealing to truth conditions?
  9.  **(Optional Devil's Advocate): Modus Ponens Intuition:** One powerful intuition favoring truth conditions is the seeming undeniable validity of Modus Ponens: If A, C; A; therefore C. It *feels* truth-preserving. How does your account explain the normative force and intuitive obviousness of MP if there's no underlying truth-conditional structure guaranteeing that when the premises are "true" (in some sense), the conclusion must be?
  10. **Contemporary Landscape:** Truth-conditional approaches to conditionals have evolved significantly (e.g., dynamic semantics, situation semantics, relativism). Are there any recent developments in *truth-conditional* frameworks that you find genuinely address the core challenges you raise (triviality, embedding) better than earlier attempts, or do you see them as fundamentally missing the point?

  **Key for Interviewer:**

  *   **Listen Actively:** Tailor follow-ups *precisely* to her actual answers, even if they differ slightly from the anticipated responses above. The goal is engagement, not just reciting questions.
  *   **Clarify Terminology:** Be prepared to briefly clarify terms like "Adams' Thesis," "probabilistic validity," "compositionality," "dynamic semantics" if needed for audience clarity, but avoid letting definitions derail the substantive debate.
  *   **Press Gently but Firmly:** The follow-ups are designed to push her to defend the *foundations* and *implications* of her view against its strongest competitors. Maintain a respectful but intellectually rigorous tone.
  *   **Connect the Dots:** If possible, subtly link answers back to the core themes (truth, meaning, logic) to show how the different challenges interrelate.

  These questions should create a dynamic conversation that moves beyond exposition into the deep philosophical tensions surrounding meaning, truth, and logic that her work engages with. Good luck with the podcast!
