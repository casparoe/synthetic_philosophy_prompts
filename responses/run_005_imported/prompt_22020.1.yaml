   2. Hedging/liquidity needs (unrelated to private information)
   3. Noise traders / overconfidence
   4. Bounded rationality (no infinite regress of updating)
   5. New endowment shocks (leading to risk-sharing trades because the initial allocation is no longer efficient)

   We are to assign each to a tier: S (most explanatory), A, B, C, D (least explanatory). We can add, split, or drop explanations.

