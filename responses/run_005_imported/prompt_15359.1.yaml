  - **A (Strong shifts)**: Darwinian evolution introduced teleology-free biological explanation; Lavoisier's oxygen theory reconceptualized chemical elements/combustion; germ theory replaced environmental explanations with microbial agency. All involved new standards, methods, and phenomena, though with some continuity (e.g., evolution built on prior biogeography).
  - **B (Significant but debated)**: Kinetic theory redefined heat as motion rather than substance; plate tectonics revolutionized earth sciences but had accumulating evidence; cognitivism overturned behaviorism's anti-mentalism but retained empirical methods. Incommensurability is present but less absolute than in S/A.
