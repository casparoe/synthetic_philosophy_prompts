  First, I need to recall the hole argument clearly. Earman and Norton used GR's diffeomorphism invariance to argue that substantivalism implies indeterminism. If spacetime points have haecceities, then two models related by a hole diffeomorphism represent different physical situations, even if they agree outside a region but differ inside. Since there's no way to determine which metric applies inside, substantivalists face indeterminism. But physicists don't see GR as indeterministic, so it's a reductio against substantivalism.

  Now, why do philosophers still defend substantivalism? The user might be missing key responses. Let me list possible counters. One is sophisticated substantivalism, rejecting haecceities. Maybe spacetime points don't have primitive identities. Then the diffeomorphic models are just mathematical representations of the same physical reality. That avoids indeterminism. 

  Another response is metric essentialism. If spacetime points have their metric properties essentially, then after a diffeomorphism, they have different properties, so it's the same points with altered fields. But this might not solve the indeterminism issue because the future metric inside the hole isn't determined.

  Leibniz equivalence is crucial here. If we take diffeomorphic models as physically equivalent, substantivalists need to accept that spacetime points don't have identities beyond what the fields specify. So, they might adopt a structuralist view where points are individuated by the metric field.

  The user might not realize that the hole argument targets haecceitism, not substantivalism per se. By denying haecceities, substantivalists can avoid the problem. Philosophers like Hoefer or Maudlin have proposed such views. Also, some argue that GR's indeterminism in the hole context isn't problematic if we accept that the different models represent the same physical state.

  Another point is that the hole argument assumes manifold substantivalism. But if substantivalists commit to the metric as part of spacetime's structure, then diffeomorphisms don't change physical facts. This is relationalism about identity but substantival about spacetime's existence. 

  The user's deeper need might be understanding how philosophy interacts with physics. They expect a clear refutation to settle the debate, but philosophical positions evolve with new interpretations. The hole argument refined substantivalism rather than eliminating it. Also, quantum gravity considerations might influence the debate, where spacetime points might not be fundamental.

  I should also mention that some responses question whether determinism is violated in a meaningful way. If the two models are physically indistinguishable, then it's not a real indeterminism. Or, using counterpart theory from modal logic to handle transworld identity without haecceities.

