  First, let's unpack the comparative advantage argument. Ord's analogy holds if we accept three premises: (1) moral convictions create differing "costs" of action (her suffering from criticizing him is "costly" to her values, his donation is "cheaper"), (2) these differences are non-fungible (she genuinely values eggs more than flight emissions), and (3) both parties have limited resources. If true, trade maximizes impact per unit of sacrifice. But... can morality really be quantified like economics? Her distress over criticizing him might stem from complicity guilt, not just inefficiency—which changes the calculus. 

  Then there's the indulgence parallel. The medieval comparison bites because both involve offsetting "sins" via payment. But key differences: indulgences claimed divine absolution, while this is a mutual contract; indulgences were zero-sum (church profits), while here both causes gain. Still, the risk of self-deception is real. If he flies more *because* of the trade, it's net harmful—like carbon offsets enabling emissions. 

