prompt: |-
  My housemate and I sort of stumbled into our own little side deal a few weeks ago: she cares way more about animal welfare than climate stuff, I'm the opposite, so now she's agreed to stop hassling me about flying home every month as long as I match her monthly donation to a cage-free egg campaign. Feeling pretty smug about it, i went looking for whether this kind of arrangement even has a name, and apparently Toby Ord wrote a whole paper on it back in 2015 calling it "moral trade" -- basically framing it as gains-from-trade between people who disagree morally, like a moral version of comparative advantage.

  Now I can't decide if we've stumbled onto something actually defensible or just invented a cute way of laundering our own bad behavior through each other. Write me an essay weighing the main arguments for and against the legitimacy of moral trade like this. I want you to actually engage with the comparative-advantage framing (does it even make sense to treat moral convictions like tradeable preferences?) and with the worry that the whole thing is just a secular reinvention of buying indulgences. Don't retreat into "it depends" as your final answer -- commit to an actual verdict, even if its a conditional one.
