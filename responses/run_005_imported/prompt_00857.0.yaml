answer: |-
  You've hit on one of the most debated points in political philosophy and decision theory! Rawls's rejection of expected utility maximization (and Harsanyi's average utilitarianism) in favor of maximin under the veil of ignorance is deliberate and rests on several interconnected arguments. It's not *just* irrational risk aversion or building in his conclusion, though critics often charge that. Here's a breakdown of Rawls's principled arguments:

  1.  **Radical Uncertainty, Not Risk:** This is the core distinction.
      *   **Harsanyi (Risk):** Treats the veil as a situation of *risk* with *known probabilities* (equal likelihood). Rational agents maximize expected utility under known probabilities.
      *   **Rawls (Uncertainty/Ignorance):** Treats the veil as a situation of *radical uncertainty* or *ignorance*. Parties lack *any* basis for assigning probabilities to ending up in any particular social position. They don't know the size of society, its economic structure, level of civilization, psychological profiles, or even the range of possible positions. Equiprobability is an *arbitrary assumption* with no epistemic justification in this context. Rational choice under *uncertainty* (lack of probabilistic knowledge) differs from choice under *risk* (known probabilities).

  2.  **The Conditions for Maximin:** Rawls argues maximin is a rational rule *specifically* when three conditions hold jointly (TJ §26):
      *   **No Basis for Probabilities:** As above. Probabilities cannot be estimated or meaningfully assigned.
      *   **Guaranteeing a Satisfactory Minimum is Paramount:** The chooser cares primarily about ensuring that the worst outcome they might face is still acceptable. They care less about potential gains above this minimum.
      *   **Some Alternatives Have Intolerable Outcomes:** Rejecting maximin would involve accepting principles that *could* lead to outcomes the chooser finds utterly unacceptable.
      Rawls argues the Original Position uniquely satisfies *all three* conditions.

  3.  **The Profound Stakes & Irrevocability ("Strains of Commitment"):** This is where "strains of commitment" does real work and is distinct from simple risk aversion.
      *   The choice in the Original Position is for *fundamental, constitutional principles* governing a *lifelong* association. It's not a gamble you can walk away from if you lose.
      *   **Strains of Commitment:** Rawls argues that parties must choose principles they believe they *can actually live with and uphold*, no matter which position they end up occupying. If a principle could lead to a position involving profound deprivation of basic liberties, crushing poverty, or humiliation (an "intolerable" outcome), a rational person *could not rationally commit* to upholding that society if they landed in that position. The psychological and moral "strain" of honoring such a commitment would be too great.
      *   Expected utility reasoning *ignores this commitment problem*. It might endorse a society with a small chance of slavery if the average utility is high enough. But could you *honestly commit* to upholding a society where you *might* be enslaved? Maximin directly addresses this by ensuring the worst position is still free and possesses the basic social primary goods necessary for a life with self-respect.

  4.  **The Nature of the Goods ("Thin Theory of the Good"):**
      *   Parties in the Original Position are choosing principles distributing *social primary goods* (basic rights, liberties, opportunities, income & wealth, and the social bases of self-respect). Rawls argues these goods have a specific character:
          *   **Instrumental for Life Plans:** They are essential all-purpose means for pursuing *any* rational life plan.
          *   **Subject to a Threshold:** There is a level below which having less severely cripples one's ability to pursue *any* worthwhile life plan or maintain self-respect. Securing this threshold is paramount.
          *   **Diminishing Marginal Significance:** Once above the threshold necessary for exercising basic liberties and maintaining self-respect, gaining *more* primary goods (especially wealth) has less significance for one's fundamental life prospects.
      *   Maximin makes sense when securing the *minimum necessary threshold* of these essential goods is the overwhelming priority, and gains beyond that are less critical. Expected utility, by averaging, might sacrifice the minimum threshold for some in exchange for greater gains for others – a trade-off Rawls sees as irrational when fundamental interests are at stake.

  5.  **Rejection of the "Purely Rational" Economic Agent:**
      *   Rawls explicitly contrasts his parties with the standard model of rational economic agents used in Bayesian decision theory. He argues that model is inappropriate for a choice of such foundational, high-stakes principles under deep uncertainty. The parties are not merely risk-averse; they are concerned with securing the *preconditions* for a life of self-respecting moral agency, no matter who they turn out to be.

  **Why Harsanyi's Argument Doesn't Persuade Rawls:**

  *   **Arbitrary Probabilities:** Rawls sees Harsanyi's equiprobability assumption as unjustified in the radical ignorance of the Original Position. It smuggles in a controversial utilitarian premise.
  *   **Ignores the Separateness of Persons:** Expected utility averages across people. Rawls argues this treats society as a single entity experiencing an average, violating the distinctness of individuals. Maximin respects the separateness of persons by ensuring *each* individual's fundamental interests are protected.
  *   **Underestimates the Stakes:** Harsanyi's model treats ending up in a position of abject deprivation as just another low-utility state to be averaged in. Rawls sees it as a catastrophic failure to secure the basic conditions for a human life worthy of commitment.

  **Conclusion: Principled Argument or Built-in Conclusion?**

  Rawls presents a *principled argument* based on the unique features of the Original Position decision problem: profound uncertainty, irrevocability, high stakes concerning fundamental goods, the strains of commitment, and the threshold nature of primary goods. He argues that *given these specific conditions*, maximin is the uniquely rational rule.

  However, critics argue:

  1.  **The Conditions are Stipulated:** Rawls defines the Original Position (especially the thick veil of ignorance and the priority of primary goods) in a way that inherently favors maximin and his conclusions. Is radical uncertainty about probabilities truly necessary or coherent? Why prioritize primary goods in that specific way?
  2.  **Maximin is Extreme:** Even under uncertainty, other rules (like Hurwicz criterion, minimax regret, or even assigning vague probabilities) might be more plausible for many people.
  3.  **"Strains of Commitment" as Risk Aversion?:** While distinct, the emphasis on avoiding intolerable outcomes can be seen as an extreme form of risk aversion applied to a context where risk cannot be quantified. Critics argue Rawls hasn't escaped risk aversion; he's just defined the situation to make extreme aversion rational.

  **In essence:** Rawls provides a genuine, multi-faceted argument grounded in the specifics of the Original Position to justify maximin over expected utility. Whether you find it *convincing* depends heavily on whether you accept his characterization of the decision problem (radical uncertainty, paramount importance of securing a minimum threshold of primary goods, the binding nature of commitment) as the appropriate way to model fairness. The debate between Rawls and Harsanyi remains fundamental precisely because it hinges on deep disagreements about rationality, fairness, uncertainty, and the nature of the goods being distributed. Your background in reasoning under uncertainty makes your skepticism about maximin perfectly understandable from a standard decision-theoretic perspective; Rawls is explicitly challenging the applicability of that standard perspective to this foundational political choice.
