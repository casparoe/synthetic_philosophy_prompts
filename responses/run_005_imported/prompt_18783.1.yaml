          *   *Principle of Veracity:* "a propensity to speak truth" (Speaker's disposition).
          *   *Principle of Credulity:* "a disposition to confide in the veracity of others, and to believe what they tell us" (Hearer's disposition). (-1 point for this significant conceptual error). The regress point against Hume is correctly included.
  *   **b (5 points):** Awarded 5/5.
