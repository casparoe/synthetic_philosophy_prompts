  *   **c (5 points):** Awarded 5/5.
      *   Excellent explanation of Fricker's local reductionism. Accurately contrasts it with both Hume (no need for a *global* inductive argument) and Reid (still requires *local*, non-testimonial grounds for trusting *this specific speaker* on *this specific occasion*). The phrase "never quite the unearned default that perception is for Reid" effectively captures the key distinction. Full credit.
