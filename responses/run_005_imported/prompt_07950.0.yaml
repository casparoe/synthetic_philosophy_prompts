prompt: |-
  I'm currently taking a graduate seminar on modal metaphysics, and for the past couple of weeks we've been working through David Lewis's counterpart theory alongside the more orthodox picture of transworld identity that a lot of Kripkean semantics for modal claims seems to presuppose. I think I have a decent grip on the basic contrast: counterpart theory holds that no individual exists in more than one world, so that de re modal claims about some individual are made true by what happens to that individual's counterparts (things resembling it in the relevant respects) elsewhere, whereas transworld identity views let the very same, numerically identical individual exist according to more than one world. What I'm still shaky on is how the actual dialectic runs once each view's central objection to the other is on the table, and I'd like your help working through it before I draft my term paper.

  Could you compare the two views with specific reference to two objections my professor only mentioned in passing? The first is Kripke's well-known "Humphrey" objection from a footnote in Naming and Necessity (footnote 13, if I remember correctly), which complains that counterpart theory gives the wrong truth conditions for ordinary claims like "Humphrey could have won the election," since what happens to some other, merely similar individual in another world seems irrelevant to what could have happened to Humphrey himself. The second is Lewis's own argument from accidental intrinsics in On the Plurality of Worlds, which he directs specifically against the version of transworld identity on which one and the same individual is literally, wholly present in more than one world, on the grounds that this individual would then have to bear incompatible intrinsic properties, such as shapes, simpliciter. I'd like you to explain how a defender of each view can best respond to the objection aimed at their own position, and then tell me, on balance, whether one view emerges more defensible than the other once both objections and their strongest replies are on the table, or whether the exchange is better described as a standoff. If it's relevant to your verdict, feel free to also factor in how the similarity-based, context-dependent nature of the counterpart relation, which allows a single individual to have multiple, equally eligible counterparts in one world, complicates the counterpart theorist's position.
