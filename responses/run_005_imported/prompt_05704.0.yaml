answer: |-
  You've pinpointed a profound and genuinely unresolved tension at the heart of precommitment theory, whether applied to individuals (like Ulysses contracts) or collectives (like constitutions). Philosophers like Jon Elster, Thomas Schelling, Stephen Holmes, and Cass Sunstein have grappled with this, but **no universally accepted, non-circular principle cleanly distinguishes "corrupted judgment" from "legitimate change of mind."** The distinction often relies on contestable assumptions or contextual factors. Here's a breakdown of the approaches and their limitations:

  ### Key Philosophical Attempts to Distinguish
  1.  **The "True Self" or "Higher-Order Preferences" Argument:**
      *   **Idea:** Odysseus's "true self" (the rational planner) knows the Siren-hearing self is corrupted. Similarly, your sister's "stable self" during wellness understands her crisis self's judgment is impaired. Constitutions embody a society's "deliberative will" against transient passions.
      *   **Problem:** It's question-begging. *Who* defines the "true self"? Why privilege the past self over the present self? The crisis self might argue *it* is the authentic one finally free from repression, or that societal values *should* evolve. Jefferson famously argued each generation has its own sovereignty, rejecting the idea of a founding "true will" binding the future. Defining the "higher-order" preference often just reflects the preference of the definer.

  2.  **The Epistemic Argument (Knowledge of Impairment):**
      *   **Idea:** The past self *knows* the future state involves a specific, identifiable impairment mechanism (Siren magic, mania-induced anosognosia, inflammatory rhetoric triggering mob frenzy). This knowledge justifies overriding the future self's expressed wishes.
      *   **Problem:** This requires a robust, empirically verifiable model of impairment. While mania has clear diagnostic criteria, judging "some capacity" in the moment is clinically complex. For constitutions, identifying "passion" vs. "reasoned evolution" is inherently political and contested (e.g., is expanding voting rights "reason" or "passion"? Banning slavery?).

  3.  **The Procedural/Consent-Based Argument:**
      *   **Idea:** The legitimacy comes from the *process* of precommitment. Odysseus freely consented *while rational*. Your sister drafts her directive *while competent* with medical advice. Founders created constitutions through exceptional deliberation. This initial consent authorizes future constraint.
      *   **Problem:** Consent isn't magic. Can competent consent *truly* authorize future coercion if the future self (with *some* capacity) disagrees? Does past collective consent bind dissenters or future majorities who never consented? This circles back to the core problem of binding future agency. Revocation clauses in Ulysses contracts acknowledge this limitation, but weaken the precommitment.

  4.  **The Instrumental/Consequentialist Argument:**
      *   **Idea:** Precommitment is justified by its *results*. Odysseus survives; your sister avoids devastating consequences of untreated mania; constitutions prevent tyranny of the majority or democratic collapse. The outcome validates the means.
      *   **Problem:** This requires predicting consequences accurately. It risks paternalism ("we know what's best for you, even against your will"). It also doesn't resolve the agency dilemma – good outcomes don't necessarily make overriding present will *in that moment* ethically unproblematic. It prioritizes stability/well-being over autonomy.

  5.  **The "Self-Binding as Self-Constitution" Argument:**
      *   **Idea:** Precommitment isn't just a constraint, but an act of *defining* the self or the polity. Odysseus defines himself as the hero who completes his journey. Your sister defines her well self as the author of her life narrative, including managing her illness. A constitution defines the nation's fundamental character.
      *   **Problem:** This is poetic but metaphysically heavy. It still privileges one conception of the self/polity over another potentially emerging one. The crisis self or the new generation might reject that definition.

  ### Why the Distinction is Problematic & Implications
  1.  **The Circularity Trap:** As you suspect, defining the future state as "corrupted" often *presupposes* the authority of the past self or the precommitment structure. The justification relies on the very distinction it needs to prove.
  2.  **Power Dynamics:** Who gets to decide? In psychiatry, it's clinicians/family interpreting the directive. In constitutions, it's judges, elites, or incumbent majorities interpreting the founders' intent. This risks privileging certain perspectives and masking power imbalances.
  3.  **The Problem of "Some Capacity":** This is the crux for your sister. If she retains *some* decision-making capacity during a crisis, overriding her based solely on the past directive *is* ethically fraught. Modern psychiatric ethics emphasizes assessing capacity *in the moment* whenever possible, even with a directive. A Ulysses contract is strongest when impairment is severe and unambiguous, but reality is often messy.
  4.  **Evolution vs. Corruption:** Societies *should* evolve. Distinguishing necessary constitutional change (abolition, civil rights) from "succumbing to passion" is inherently political and value-laden. Founders can be wrong or outdated.

  ### Navigating the Dilemma (Principled Pragmatism)
  Philosophers and practitioners acknowledge the unresolvable tension but offer ways to navigate it more ethically:

  *   **For Psychiatric Ulysses Contracts (PADs):**
      *   **Specificity & Triggers:** Define *very specific* crisis signs/symptoms (e.g., specific delusions, refusal of sleep >72hrs) that trigger the directive, not just "objection." Base it on observed past patterns.
      *   **Process Focus:** Emphasize collaborative drafting *with* the patient during wellness, ensuring understanding and genuine buy-in. Include their values and preferences, not just clinician/family wishes.
      *   **Revocation & Review:** Build in clear pathways for the patient *in crisis* to challenge the directive through a swift, independent capacity assessment. Mandate regular review/updates during wellness.
      *   **Last Resort:** Frame it as a last resort when *impairment is severe*, not a tool to override nuanced disagreement. Focus on restoring capacity quickly.
      *   **Your Sister's Unease:** Her unease is valid and important. The drafting process *must* address it, ensuring she feels the directive truly reflects *her* wishes for *her* care when *she* knows she's vulnerable, not others' wishes imposed upon her. It should feel empowering, not threatening.

  *   **For Constitutions:**
      *   **Amendment Procedures:** Include (difficult but possible) formal amendment processes, acknowledging the need for evolution. The rigidity *is* the point, but absolute rigidity is unsustainable.
      *   **Living Interpretation:** Allow for evolving interpretation by independent bodies (courts) to adapt to new circumstances without constant formal amendment (though this creates its own legitimacy issues).
      *   **Democratic Pedigree:** Emphasize the extraordinary democratic legitimacy of the founding/amending process compared to ordinary legislation.
      *   **Core vs. Peripheral:** Distinguish (contentiously) between fundamental, unamendable principles and operational rules more open to change.

  ### Conclusion
  You are right to be wary. There is **no philosopher's stone that objectively and non-circularly distinguishes "corrupted future self" from "legitimately changed mind."** The distinction relies on contestable assumptions about rationality, identity, knowledge, and authority. Precommitment strategies are powerful but ethically hazardous tools.

  *   **For your sister:** A well-crafted Ulysses contract *can* be ethically sound and beneficial, but its legitimacy hinges on **robust process, specificity, respect for present capacity assessment whenever feasible, and her authentic participation during wellness.** Her unease must be central to the drafting process. It should be a shield *she* wields against her illness, not a sword others wield against her agency.
  *   **Generally:** Precommitment is often a necessary pragmatic response to demonstrable human frailties (mania, impulsive passions). Its justification is **probabilistic and consequentialist** (we *know* these states lead to terrible outcomes; past choices *were* more deliberate) combined with **procedural legitimacy** (consent during competence, inclusive founding processes). However, it must always be tempered by **humility, mechanisms for reconsideration, and vigilance against the abuse of power.** Your wariness is a sign of critical thinking, not cynicism. The tension is inherent and cannot be fully resolved, only managed with careful attention to context and power.
