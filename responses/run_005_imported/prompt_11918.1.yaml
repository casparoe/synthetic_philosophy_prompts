answer: |-
  ## The Borrowed Gaze: Why Aesthetic Judgment Demands More Than Testimony

  The disagreement you describe cuts to the heart of how we engage with art and knowledge itself. On the surface, your friend’s analogy – trusting a critic’s verdict on a film as readily as trusting a geographer on Peru’s existence – seems compelling. Both involve relying on expert authority for claims about the world. Yet, your nagging feeling that calling a film "brilliant" solely on a review feels like reporting rather than genuine judgment points towards a profound asymmetry. This is the territory of the "problem of aesthetic testimony," where pessimists argue for a fundamental limitation on borrowing taste, while optimists see no such barrier. Engaging deeply with both sides reveals why the pessimist intuition, while needing careful qualification, captures something essential about the nature of aesthetic experience.

  **The Pessimist's Stronghold: Acquaintance and the Demand for First-Person Experience**

  Pessimists argue that testimony alone cannot confer a *genuine* aesthetic judgment. Their core arguments hinge on the unique nature of aesthetic properties and the kind of cognitive work required to apprehend them:

  1.  **The Acquaintance Requirement:** The most potent argument is that aesthetic properties (beauty, brilliance, profundity, grace, dissonance) are *response-dependent*. Their very existence is tied to the *experience* they evoke in a perceiver encountering the object. Knowing *that* a sunset is beautiful via description is fundamentally different from *seeing* its beauty unfold. Similarly, knowing *that* a critic found a film brilliant tells you about *their* response, but it doesn't grant *you* the experience of its brilliance. Your judgment about the film's brilliance requires *acquaintance* – direct, first-personal engagement with the work itself. Without this sensory and affective encounter, your statement "the film is brilliant" is, at best, a report of the critic's belief, not the expression of your own aesthetic apprehension. Kant’s point resonates here: even universal agreement wouldn't obligate *your* judgment, as beauty requires grounding in *your* free play of imagination and understanding encountering the object.

  2.  **The Missing Affective Component:** Aesthetic judgments are not merely cognitive; they are intrinsically tied to feeling – pleasure, awe, discomfort, exhilaration. Testimony can convey the *proposition* "this is brilliant," but it cannot transmit the *affective state* that constitutes the core of the aesthetic experience and justifies the judgment. You can know *that* the critic felt moved, but you cannot *feel moved* by the critic's testimony *in the same way* you would be moved by the film itself. Your judgment, therefore, lacks the affective grounding that makes an aesthetic judgment authentic and motivating.

  3.  **The "Why" Deficit:** Testimony often fails to convey the *reasons* for an aesthetic judgment in a way that allows the recipient to genuinely grasp them. A critic might describe techniques or themes, but the *integration* of these elements into a unified, affecting whole – the very thing that constitutes brilliance – is something that must be *felt* through direct perception. Knowing *that* the cinematography and score combine powerfully isn't the same as *experiencing* that powerful combination. Your "borrowed" judgment thus lacks the depth of understanding that comes from seeing *how* the parts create the whole.

  4.  **The Threat of Epistemic Idleness:** Pessimists worry that uncritically adopting aesthetic judgments bypasses the essential work of developing one's own taste and critical faculties. If brilliance can be borrowed like a fact, why ever engage deeply with challenging art? Reliance on testimony risks fostering intellectual passivity in the aesthetic domain, where active perception and reflection are paramount.

  **The Optimist's Counterattack: Consistency, Practice, and Sociality**

  Optimists forcefully challenge this perceived asymmetry, arguing that aesthetic testimony functions effectively and legitimately:

  1.  **The Analogy Holds (Peru vs. Film):** They insist your friend is fundamentally correct. We constantly rely on testimony for complex judgments: historical events (the causes of the French Revolution), scientific theories (quantum mechanics), complex flavors (a sommelier's description of a wine's notes). If testimony works for these, why not for aesthetics? Knowing *that* experts deem a film brilliant based on its narrative structure, thematic depth, and technical mastery *is* sufficient evidence to form a justified belief about its quality, just as knowing geologists describe Peru's Andes is sufficient to believe in their grandeur.

  2.  **The Ubiquity of Reliance:** Optimists point to our everyday practices. We constantly use reviews, recommendations, and awards to decide what films to watch, books to read, and music to listen to. This system demonstrably works; people discover art they love, avoid art they'd dislike, and generally navigate the cultural landscape effectively based on testimony. This widespread, functional reliance suggests testimony *does* convey genuine aesthetic knowledge.

  3.  **Testimony as Justification, Not Replication:** Optimists argue pessimists confuse *justification* with *experience*. Testimony provides *reasons to believe* the film is brilliant. It doesn't (and needn't) replicate the *experience* of brilliance. Just as testimony about Peru gives me reason to believe it exists without giving me the experience of being there, testimony about a film gives me reason to believe it's brilliant without giving me the experience of watching it. My belief is still *about the film*, not merely about the critic.

  4.  **The Charge of Elitism/Snobbery:** Some optimists suggest pessimism risks elitism. It implies that only those with the time, resources, or inclination to experience everything firsthand can hold legitimate aesthetic opinions, unfairly marginalizing those who rely on trusted guides. If testimony works for other complex domains, denying it for aesthetics seems arbitrary.

  **The Verdict: Qualified Pessimism – Belief Without Judgment**

  While the optimist's points about practicality and consistency are strong, they ultimately fail to fully address the core pessimist insight about the nature of aesthetic *judgment* itself. The strongest position is a **qualified pessimism**:

  1.  **Testimony Secures Belief, Not Judgment:** Optimists are right that testimony can provide excellent *epistemic justification* for believing the *proposition* "Film X is brilliant." Based on a trusted critic's review, you are rationally entitled to *believe* that the film possesses qualities widely recognized as constituting brilliance. You can state this belief accurately and act on it (e.g., recommending it).

  2.  **The Gap: Experience as Constitutive:** However, pessimists are correct that testimony cannot furnish you with a *genuine aesthetic judgment* of the film's brilliance. The crucial gap lies in the **constitutive role of first-person experience**. An aesthetic judgment isn't just the assertion of a property ("brilliant"); it's the expression of an evaluation *grounded in* and *arising from* your own affective and perceptual encounter with the work. The "why" and the "how" of the brilliance, its felt impact, its integration of elements – these are apprehended *in the experiencing*, not fully transmissible through description. Your statement "It is brilliant" based solely on testimony lacks this experiential grounding. It is, as you intuited, fundamentally *reported* rather than *authored*.

  3.  **Distinguishing the Objects:** The Peru analogy stumbles on the nature of the objects. Peru's existence is a mind-independent fact. Its grandeur, while potentially awe-inspiring, is still a property of the physical geography. A film's brilliance, however, is *response-dependent*. It emerges from the interaction between the work's structure and a perceiving consciousness. Testimony about mind-independent facts (Peru's location) directly concerns the fact. Testimony about a response-dependent property (brilliance) is fundamentally testimony *about someone else's response*. While reliable testimony gives strong evidence *that* the property is present (i.e., that the work reliably evokes that response in qualified viewers), it doesn't allow *you* to experience the property's instantiation *for yourself* in the way required for a personal judgment.

  4.  **Moral Testimony: A Telling Parallel (but Not Identical):** The moral testimony debate highlights a similar tension concerning action-guiding, evaluative domains. While there are parallels (can you be *virtuous* acting solely on orders?), morality often involves objective harms/benefits and principles potentially graspable through reason alone. Aesthetics is more purely experiential and affective. Knowing murder is wrong via testimony engages reason about harm. Knowing a film is brilliant via testimony cannot engage the specific sensory and emotional responses that constitute its aesthetic value. Art demands a *felt* response in a way moral principles, once understood, may not always require in the moment of application.

  **Conclusion: The Necessity of the Encounter**

  Therefore, your unease is philosophically warranted. While you can *believe*, justifiably and rationally, that a film is brilliant based on a critic's authority, and while this belief is practically indispensable for navigating the cultural world, you cannot *judge* it brilliant in the full, authentic sense of aesthetic judgment without confronting the work yourself. Testimony provides a map and a guidebook, pointing towards potential experiences of value. But the territory of aesthetic appreciation – the felt impact, the visceral understanding, the personal conviction – must be traversed firsthand. To declare a film "brilliant" without this encounter is to speak with borrowed words, describing a landscape you haven't seen, a symphony you haven't heard. The critic illuminates the path, but the journey, and the judgment it fosters, remains irrevocably your own. Kant was right: aesthetic judgment, rooted in subjective universality, demands the grounding of personal experience. Testimony can tell you *where* to look, but only your own eyes can confirm the brilliance.
