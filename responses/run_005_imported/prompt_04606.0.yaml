answer: |-
  You've hit on one of the deepest problems in AI and cognitive science: the **Frame Problem** and the gap between **symbolic reasoning** (your rules) and **embodied cognition** (your roommate). This isn't you being bad at writing rules; it's a fundamental limitation of rule-based systems trying to handle the messy, open-ended reality of the physical world. Here's why it happens and how to approach it:

  ### Why This Happens (The Core Reasons)
  1.  **The Frame Problem:** How does a system know *what doesn't change* when an action is taken? Your rules explicitly define changes (e.g., "If I leave, lock the door"). But reality has infinite things that *don't* change and *don't need mentioning*. Your roommate implicitly knows locking the door doesn't turn off the lights, boil the kettle, or affect the cat's nap spot. Your rule system needs *every* irrelevant thing explicitly excluded, which is impossible.
  2.  **Context is Infinite:** Human understanding relies on vast, shared, implicit context ("common sense"). Your rule "Lock the door when I leave" assumes:
      *   "I" refers to a specific person.
      *   "Leave" means departing the apartment with intent to be gone for a while.
      *   It shouldn't lock if someone else is home (even if sensors say "no motion" because they're napping).
      *   It shouldn't lock if you're just taking out the trash.
      *   The door is functional and unblocked.
      *   Etc., ad infinitum.
      Your roommate grasps this context instantly; your rules need it all coded, which is impossible.
  3.  **Non-Monotonic Reasoning:** Human reasoning is "defeasible." We hold beliefs *until proven otherwise*. "The door should be locked when empty" *unless* the cleaner is coming *or* a pet needs access *or* a window is open for ventilation *or*... Rule systems struggle with these endless, context-dependent exceptions. Adding one exception often breaks an earlier assumption.
  4.  **Sensor Limitations & Symbol Grounding:** Your sensors (motion, door contact) provide *symbols* (e.g., `motion = false`). Your roommate perceives *meaning* ("the apartment is empty" vs. "John is asleep on the couch"). Connecting symbols to real-world meaning reliably is incredibly hard (the Symbol Grounding Problem). A lack of motion doesn't equal emptiness.
  5.  **Holistic vs. Atomistic Processing:** Your roommate perceives the *whole situation* holistically – integrating sights, sounds, memories, social norms, goals ("keeping an eye on things" implies vigilance, not just rule-following). Your rules process isolated data points (`time = 11pm`, `motion = false`, `phone_location = away`).

  ### Why Your Roommate Succeeds
  Your roommate isn't "following rules." She's using:
  *   **Embodied Cognition:** Her understanding is rooted in her physical presence and interaction with the world.
  *   **Situatedness:** She perceives the *actual* state of the apartment *in context*.
  *   **Massive Common Sense:** Billions of background assumptions about how the world works.
  *   **Intentionality:** She understands the *purpose* ("keep an eye on things") and acts accordingly, interpreting situations flexibly.
  *   **Pattern Recognition & Analogy:** She recognizes novel situations as *similar to* past ones, even if not identical, and applies reasonable judgment.

  ### Potential Fixes & Workarounds (Not Perfect, But Better)
  While current tech can't replicate human cognition, you can mitigate the frustration:

  1.  **Embrace "Good Enough" & Simplicity:** Resist over-automating. Automate only tasks that are:
      *   Highly repetitive.
      *   Unambiguous.
      *   Low-stakes if they fail.
      (e.g., "Turn off all lights at 2 AM if no motion for 1 hour" is safer than complex presence detection for security).
  2.  **Hierarchical Rules with Overrides:**
      *   Create base rules (e.g., "Target temp 21C during day").
      *   Add higher-priority *overrides* (e.g., "If `guest_mode = true`, set temp to 23C" or "If `winter_mode = false`, disable heating rules").
      *   **Crucially:** Build in *easy manual overrides* (physical switches, voice commands, a big "VACATION MODE" button). Acknowledge the system isn't perfect.
  3.  **Probabilistic Systems & Machine Learning (If Supported):** Some platforms allow:
      *   Learning patterns over time ("John usually comes home around 6pm, so start warming at 5:30 *unless* his phone is far away").
      *   Using confidence scores ("Motion sensor confidence of 'empty' is 80%, combine with phone location 95% away -> 90% confidence to lock door").
      *   **Caution:** This can be opaque and create new, unexpected failure modes.
  4.  **State Machines & Modes:** Explicitly define system "modes":
      *   `Home`
      *   `Away`
      *   `Guest`
      *   `Sleep`
      *   `Vacation`
      Rules change *entirely* based on the active mode. Switching modes is a single, deliberate action (by you or a simple trigger like "phone leaves geofence"). This bundles context.
  5.  **Reduce Ambiguity with Multi-Sensor Fusion:** Combine *multiple* data points before acting:
      *   Don't lock based *only* on geofence. Require `geofence = away` + `no_motion > 30min` + `front_door_closed = true`. This reduces (but doesn't eliminate) false triggers.
  6.  **Focus on Notification First, Action Second:** For critical or ambiguous things, have the system *ask* or *notify* instead of acting autonomously:
      *   "Motion detected while in Away mode. Lock doors anyway? [Yes/No/10min Delay]"
      *   "Heating will turn on in 15min. Override? [Keep Off/Start Now]"
  7.  **Accept the Frame Problem:** Understand that perfect, context-aware automation with current rule-based tech is **impossible**. Design for the 95% case and make manual intervention seamless for the other 5%.

  ### The Philosophical Connection (You're Spot On!)
  Your philosophy class is directly relevant. This struggle illustrates:
  *   **The Limits of Symbolicism:** Rules are symbols manipulated syntactically. Human cognition is more than symbol manipulation; it's embodied, embedded, enacted, and extended (the 4E Cognition model).
  *   **The Frame Problem:** As formulated by philosophers like Daniel Dennett and John McCarthy, highlighting the difficulty AI has in reasoning about what remains unchanged.
  *   **Qualia & Subjectivity:** Your roommate's understanding involves subjective experience ("what it's like" to be in the apartment) that rules cannot capture.
  *   **Emergence:** Your roommate's ability "emerges" from her entire biological and cognitive system interacting with the environment, not from following discrete instructions.

  **Conclusion:** You're not bad at writing rules; you're bumping into the inherent limitations of rule-based systems trying to model an infinitely complex, contextual world that humans navigate effortlessly via embodied cognition. Stop chasing perfect convergence. Instead, aim for **robust, simple automations with clear overrides**, embrace the role of human judgment for edge cases, and appreciate the profound difference between your roommate's mind and your smart home hub. The "real fix" involves either vastly more advanced (and likely probabilistic/learning-based) AI or accepting that full autonomy in open-ended environments is currently beyond our technology's reach. Focus on making the system helpful *most* of the time and easy to correct when it's inevitably wrong.
