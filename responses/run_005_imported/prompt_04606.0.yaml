  So I've been setting up smart-home routines in my apartment (lights, heating, door locks, that kind of thing) and I keep running into the same annoying pattern: I write a rule that seems totally reasonable, then some situation I never considered makes it do something technically correct but obviously dumb, so I add an exception, and that exception creates a new weird case somewhere else a week later. It never converges no matter how many rules I add. Meanwhile my roomate, who has never coded anything in her life, handles "just keep an eye on the place while I'm out" completely fine without me spelling out every possible case for her. We've been talking in my philosophy of mind class about how minds keep track of what's going on around them, and I have a nagging feeling this is somehow connected, but I can't place it. Is there an actual reason this keeps happening to me, and is there a real fix, or am I just bad at writing rules?
