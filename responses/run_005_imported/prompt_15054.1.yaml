  - The created people are subjectively identical and cannot tell if they are the only one or one of two.

  This variant is different because there is no memory erasure and no repeated awakenings of the same person. Instead, we have multiple distinct persons in the Tails case.

  The key question: what should a created person believe about the coin being Heads?

  Two main views:
  1. The self-indication assumption (SIA): which says that one should reason as if they are a randomly selected observer from all possible observers. Then:
     - Heads: 1 observer
