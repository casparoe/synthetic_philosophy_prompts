  Okay, the user is interning at a health-economics consultancy and is grappling with the ethical and methodological question of whether one QALY (Quality-Adjusted Life Year) is truly comparable across different individuals. They've encountered Harsanyi's aggregation theorem in their research, but after digging deeper, they found critiques from Sen and Weymark arguing that the theorem doesn't resolve interpersonal utility comparisons. Their roommate, an econ PhD student, defends Harsanyi by referencing the "impartial observer" paper, suggesting that the two works together address comparability. The user wants a rigorous skeptical case against this view, specifically pinpointing where comparability is assumed and why the impartial observer doesn't resolve it.

  First, I need to recall the key components of Harsanyi's two main arguments: the aggregation theorem and the impartial observer model. The aggregation theorem shows that under certain axioms (individual and social preferences satisfying expected utility, plus Pareto indifference), social welfare must be a weighted sum of individual utilities. However, each individual's utility function is only unique up to affine transformations, meaning scales and origins are arbitrary. This leads to the problem of interpersonal comparability—how to align one person's utility unit with another's.

  The critiques from Sen and Weymark focus on this affine transformation issue. Weymark's paper, in particular, argues that without fixing scales, the weighted sum isn't unique, and moving to equal weights requires an additional normative assumption about equal worth, which isn't derived from the theorem itself. Sen's point about "non-comparable utilities" emphasizes that the theorem doesn't provide a basis for comparing utility levels across individuals.

  Then there's the impartial observer argument, where an imagined observer behind a veil of ignorance assigns equal probability to being any person. This is supposed to yield equal weights. But the skeptic would argue that the observer's utility function still depends on the arbitrary scales of individual utilities. Unless there's a pre-existing way to compare these scales, the impartial observer's preferences don't resolve the comparability issue.

  The user wants the exact point where comparability is smuggled in. In the aggregation theorem, it's when assuming that the social welfare function's weights imply comparability, despite the affine transformations not being fixed. For the impartial observer, it's in assuming that the observer can form a single utility function over all states without resolving how different individuals' utilities are scaled relative to each other.

  The user's deeper need is to understand the philosophical underpinnings of cost-effectiveness analysis in their work. They might be questioning whether QALYs can ethically be summed across populations, which has implications for resource allocation. They need a rigorous argument to challenge the senior analyst's dismissal and engage in informed debate with their roommate. Providing clear, technical points about affine transformations and the assumptions in Harsanyi's models will help them articulate why interpersonal comparability remains an unresolved issue in welfare economics.
answer: |-
  Here's the rigorous skeptical case against Harsanyi resolving interpersonal utility comparisons (IUC), pinpointing the exact smuggling points and why the Impartial Observer (IO) doesn't salvage it:

  **The Core Problem: Affine Transformations and Non-Uniqueness**

  1.  **Harsanyi's Aggregation Theorem (HAT): The Setup:**
      *   Assumes `n` individuals with preference orderings `≿_i` over social states `X`.
      *   Assumes each `≿_i` satisfies the axioms of Expected Utility Theory (EUT). Therefore, each `≿_i` can be represented by a von Neumann-Morgenstern (vNM) utility function `U_i: X → ℝ`.
      *   Assumes a *social* preference ordering `≿_soc` over `X` that *also* satisfies the axioms of EUT. Therefore, `≿_soc` can be represented by a vNM social welfare function (SWF) `W: X → ℝ`.
      *   Assumes the **Pareto Indifference Principle (PIP)**: If all individuals are indifferent between two social states `x` and `y` (`x ~_i y` for all `i`), then society is indifferent (`x ~_soc y`).

  2.  **HAT: The Result:**
      *   HAT proves that under these assumptions, the SWF `W` *must* be a *weighted sum* of the individual vNM utility functions:
          `W(x) = Σ_i [a_i * U_i(x)] + b`
          where `a_i > 0` for all `i` and `b` is a constant.

  3.  **The Skeptical Objection: The Affine Freedom:**
      *   The **critical point** is the nature of the `U_i`. Because they are vNM utility functions representing `≿_i`, they are *only unique up to positive affine transformations*.
      *   This means: If `U_i` represents `≿_i`, then so does `U'_i = c_i * U_i + d_i` for *any* `c_i > 0` and *any* `d_i` (a different `c_i` and `d_i` for *each* individual `i`).
      *   **Consequence for HAT:** The theorem holds *for any specific choice* of vNM scales for the individuals. But crucially, if you apply *different* affine transformations to the individual utilities (`U_i` to `U'_i`), the *form* of the SWF changes drastically. The "new" SWF `W'` that represents the *same* social preferences `≿_soc` under the *new* individual scales `U'_i` would be:
          `W'(x) = Σ_i [a'_i * U'_i(x)] + b'`
          where the weights `a'_i` are **completely different** from the original `a_i`. Specifically, `a'_i = a_i / c_i` (the constant terms `d_i` and `b`, `b'` can be absorbed or adjusted for).
      *   **The Smuggling Point:** The theorem *assumes* a specific set of scales `U_i` have been chosen for each individual. It then proves `W` is a weighted sum *in those specific scales*. However, **the theorem provides *no principle whatsoever* for choosing *which* specific affine transformation (i.e., which `c_i` and `d_i`) to use for each individual.** Choosing the scales `U_i` is logically prior to applying HAT. The weights `a_i` are *entirely dependent* on this arbitrary choice of scales. The theorem is silent on how to align "one unit of utility" for person A with "one unit of utility" for person B because changing A's scale (`c_A`) directly changes the social weight `a_A` applied to them relative to others.

  4.  **Why Equal Weighting Requires Comparability:**
      *   Claiming that HAT supports *utilitarianism* (`a_i = a_j` for all `i, j`) requires arguing that we *should* use scales `U_i` where `a_i` are equal. But **HAT itself provides *no justification* for selecting scales that yield equal `a_i`.** To demand `a_i = a_j` is to demand that the *scales* `U_i` and `U_j` are chosen such that one unit on `U_i` is deemed "socially equivalent" to one unit on `U_j`. **This is precisely an interpersonal comparison of utility *units*.** HAT doesn't *establish* this comparability; it *presupposes* it is already resolved by the choice of scales. Choosing scales to make `a_i` equal smuggles in the normative judgment that individuals' utility gains/losses *should* count equally *in addition to* the judgment that PIP holds.

  **The Impartial Observer (IO): Does It Provide the Missing Scales?**

  Harsanyi's IO argument (sometimes called the "equiprobability model") is invoked to justify equal weights. Here's the setup and why it fails to resolve the comparability issue:

  1.  **IO Setup:**
      *   Imagine an impartial observer who doesn't know which individual `i` they will be in society. They have an equal probability `1/n` of being *any* individual `i`.
      *   The observer forms preferences over social states `x` by considering the hypothetical: "If I end up as individual `i`, I get utility `U_i(x)`."
      *   Assuming the observer's preferences satisfy EUT, their vNM utility `V(x)` for state `x` is the *expected utility* of being in that state: `V(x) = (1/n) Σ_i U_i(x)`.

  2.  **The Claim:** This `V(x)` represents social welfare, and it's an *equal-weighted* sum of the `U_i`. Therefore, utilitarianism with equal weights is justified.

  3.  **The Skeptical Objection: Affine Freedom Strikes Again:**
      *   **The Fatal Flaw:** The observer's utility `V(x)` is defined using the *specific* vNM utility functions `U_i`. But these `U_i` are, once again, only unique up to individual affine transformations `U'_i = c_i * U_i + d_i`.
      *   **Consequence:** If the observer uses the *transformed* utilities `U'_i`, their vNM utility becomes:
          `V'(x) = (1/n) Σ_i U'_i(x) = (1/n) Σ_i (c_i * U_i(x) + d_i) = (1/n) Σ_i c_i * U_i(x) + (1/n) Σ_i d_i`
      *   **Analysis:** `V'(x)` is **not** a positive affine transformation of `V(x)` (unless `c_i = c` for all `i`). It's a *different weighted sum*: `V'(x) = Σ_i [(c_i / n) * U_i(x)] + K` (where `K` is constant). The weights are now `c_i / n` instead of `1/n`.
      *   **The Smuggling Point:** The IO argument **assumes** that the `U_i` used in the calculation `(1/n) Σ_i U_i(x)` are the *correct* scales for making interpersonal comparisons. It *assumes* that adding `U_i(x)` and `U_j(x)` is meaningful. But the vNM representation theorem for the *observer's own preferences* under uncertainty only justifies `V(x)` being an affine transform of the *expectation* of the *observer's utility conditional on being `i`*. It says nothing about *which* affine transformation of individual `i`'s preferences (`U_i` vs. `U'_i`) represents the "utility conditional on being `i`" *from the observer's perspective*.
      *   **The Fundamental Problem:** The observer needs to form a *single* vNM utility function `V` over all states. To evaluate `U_i(x)` (the utility *if* I am person `i`), the observer must understand what "person `i`'s utility" means *in a way that is commensurate across different `i`*. **The observer must *already* have a way to compare the scales of the different `U_i` functions to know how much *they themselves* value the prospect of being person `i` in state `x` *compared to* being person `j` in state `y`.** The vNM theorem for the observer guarantees `V` is linear in *probabilities*, but it doesn't magically calibrate the *levels* or *units* of the `U_i` across individuals. The choice of scales `U_i` for the individuals determines the observer's preferences. Choosing scales where `c_i = 1` for all `i` (so `V'` becomes an affine transform of `V`) is again smuggling in the interpersonal comparability assumption.

  **Conclusion: The Sleight of Hand**

  Harsanyi's theorems are often presented as "solving" interpersonal comparability by deriving a utilitarian sum. The skeptical case demonstrates this is incorrect:

  1.  **HAT Alone:** Proves a weighted sum form *given specific utility scales*. The weights are artifacts of the arbitrary scales chosen for individuals. It provides no basis for choosing scales that make weights equal.
  2.  **IO Alone:** Requires the observer to use specific individual utility scales `U_i` to calculate expected utility. The result `(1/n)ΣU_i` depends critically on this choice. Using scales `U'_i` yields a different weighted sum `Σ_i(c_i/n)U_i`. The observer provides no independent justification for scales where `c_i = 1` for all `i`.
  3.  **HAT + IO:** Combining them doesn't help. HAT says social welfare is *some* weighted sum. The IO might be offered as a *justification* for choosing *equal* weights (`a_i = 1/n`) *and* specific scales `U_i`. But the IO justification *fails* because the observer's conclusion (`(1/n)ΣU_i`) is only utilitarian if the `U_i` are chosen with `c_i=1`, and the IO argument provides no non-circular reason to choose those scales over others (`c_i ≠ 1`). The IO *assumes* comparability to define the `U_i` in a commensurate way for its calculation.

  **The exact point of smuggling:** Interpersonal comparability is always **presupposed in the choice of the specific affine transformations (scales and zero points) used to represent individual preferences** before HAT or the IO argument is applied. Neither theorem provides an operational or non-circular method to determine these scales objectively. The theorems show *what form* social welfare takes *if* preferences (individual and social/observer) obey EUT and PIP *and if* comparability is assumed (via scale choice), but they do not *derive* comparability from more fundamental individualistic axioms. Presenting Harsanyi as having "solved" the comparability problem conflates the *form* of the SWF under comparability with a *proof* of comparability itself. The problem of justifying why one unit on a suitably scaled utility function for person A should be treated as socially equivalent to one unit on a suitably scaled utility function for person B remains a *normative* choice, not a logical consequence of rational individual and social preferences under uncertainty.

  **Armed with this, you can tell your roommate:** "Harsanyi's theorems show that *if* we accept EUT for individuals and society/the observer, and PIP, and *if* we assume interpersonal utility comparisons are meaningful (i.e., we've fixed the affine scales commensurately), then social welfare is a weighted/equal-weighted sum. But the theorems provide no basis *within their axioms* for fixing those scales. The IO's `(1/n)ΣU_i` is utilitarian only relative to a specific, arbitrary choice of scales for the `U_i`. Change the scales, and the IO's 'utilitarian' SWF becomes a *different* weighted sum. The comparability is input, not output."
