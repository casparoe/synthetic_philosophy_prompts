prompt: |-
  I'm doing a PhD in philosophy (mostly social ontology / phil language stuff) and we just spent two whole seminar sessions on David Lewis's *Convention*, grinding through the coordination-equilibria-plus-common-knowledge machinery. It's put me in the annoying position of overanalyzing my own house. Three of us live together, and there's this norm where whoever notices we're out of a staple -- coffee, dish soap, toilet paper, whatever -- just quietly buys more themselves, no reimbursment, no discussion. As far as I can tell it started because one housemate did this once back in year one and it just... stuck. Two of us definately think it's a bad system since it obviously screws over whoever burns through stuff fastest, and we'd rather do a shared kitty everyone tops up monthly. Every time it comes up at "house meeting" everyone nods along that the kitty is better, and then nothing changes and we're back to the old pattern within a week.

  Using Lewis's actual account of what makes something a convention in the first place -- the arbitrariness condition (there has to be a real alternative regularity that would've worked just as well), the common knowledge requirement, and especially his stuff on precedent as a source of salience that makes one equilibrium self-perpetuating -- what does his theory imply about why we're stuck, and about what it would actually take for a small group like ours to shift onto a new convention? I'm especially curious whether his framework predicts that everyone privately agreeing the kitty is superior should be almost beside the point, and whether "let's all just agree to switch" at a house meeting even counts as the kind of common-knowledge-generating event his theory requires, or whether that's smuggling in more than the theory can actually license. Don't just recap the book's definitions for me -- I want the implications actually worked out for a case like this.
reasoning: |-
  Okay, let me tackle this user's problem. They're a PhD student in philosophy, specifically social ontology and philosophy of language, and they've been studying David Lewis's *Convention*. Their household has this unspoken norm where whoever notices a staple item is out buys it without reimbursement. Two housemates think it's unfair, especially since it disadvantages those who use items faster. They've tried switching to a shared kitty system but keep reverting to the old norm. The user wants to apply Lewis's framework to understand why the change isn't happening and what it would take to shift conventions.

  First, I need to recall Lewis's key elements: coordination equilibria, common knowledge, arbitrariness, and precedent. The current system is a coordination equilibrium—it works because everyone follows it, even if it's not optimal. The kitty system is a better alternative, but switching requires coordinating everyone's actions simultaneously. 

  The arbitrariness condition is met because both systems could work, but the existing one has precedent. Precedent creates salience, making the old norm the default. Common knowledge is crucial here. Even though they discuss the kitty at meetings, it's not enough. Private agreement isn't common knowledge. Everyone might nod in the meeting, but without a public commitment, each person doubts others' commitment. This leads to a preference falsification where people revert to the old system.

  The house meetings might not generate common knowledge because there's no clear signal that everyone is genuinely committed. Nodding isn't binding. Lewis would suggest a decisive, public act that makes intentions clear. Something like setting up a joint account during the meeting or signing an agreement. 

  Also, precedent makes the old norm sticky. Every time someone buys an item under the old system, it reinforces that equilibrium. To shift, they need a salient event that breaks the precedent, like a new roommate moving in or a major shortage. But since that's not feasible, creating a salient joint action during the meeting could work. 

  The user’s deeper need is to apply theory to real life, bridging academic concepts with personal experience. They might also seek validation of their frustration and practical solutions. The theory explains why rational individuals fail to coordinate change without a robust mechanism. Emphasizing the gap between agreement and common knowledge highlights why their meetings fail. Suggesting concrete, theory-aligned steps like immediate public commitments could help them transition.
answer: |-
  Based on Lewis's machinery, your situation is a textbook case of **convention lock-in due to precedent, lack of sufficiently salient alternatives, and failed common knowledge generation** – precisely *because* everyone privately agrees the kitty is superior. Here's the breakdown using Lewis's core concepts:

  1.  **The Existing System is a Lewisian Convention:**
      *   **Coordination Equilibrium:** Everyone acting on the "noticer buys" rule *is* a coordination equilibrium. When everyone follows it, staples get replaced (coordination achieved), and no single individual has incentive to unilaterally deviate (if I notice we're out of TP but *don't* buy it hoping someone else will, I risk having no TP). It "works" in the minimal sense of solving the coordination problem *somehow*.
      *   **Arbitrariness:** The "noticer buys" rule is **arbitrary** because the "shared kitty" system is a demonstrably possible, equally functional (actually superior) alternative for solving the *same* coordination problem (ensuring staples are replenished). This satisfies Lewis's condition.
      *   **Precedent & Salience:** This is the **key lock-in mechanism**. The "noticer buys" behavior has a long history ("one housemate did this once back in year one and it just... stuck"). This history creates powerful **precedent**. Precedent makes the existing rule **salient**. Salience acts as a focal point, making the existing equilibrium the "obvious" or "default" choice in the absence of a *more* salient alternative. Every time someone follows the old rule, it reinforces the precedent.
      *   **Common Knowledge (of the Convention):** There is robust common knowledge *of the existing convention*. Everyone knows the rule, knows everyone else knows it, knows everyone knows they know it, and so on. This knowledge is constantly reinforced by the *regularity* of the behavior itself.

  2.  **Why the Kitty Fails to Stick (Lewisian Reasons):**
      *   **Lack of Salience for the New Equilibrium:** While the kitty *is* an alternative coordination equilibrium, it **lacks salience** compared to the entrenched precedent. Simply *discussing* it at a house meeting doesn't magically make it salient enough to override years of precedent. Agreement in principle isn't the same as establishing a new focal point.
      *   **Failed Common Knowledge Generation for the *Switch*:** This is critical. Lewis emphasizes that conventions arise and persist through common knowledge of the *regularity*. Your house meetings **fail to generate sufficient common knowledge** about a *commitment to act* on the new regularity.
          *   **"Nodding Along" ≠ Commitment:** Agreement that the kitty is *better* is not the same as common knowledge that *everyone will actually abandon the old rule and consistently act according to the new rule starting tomorrow*. Lewis would be deeply skeptical that verbal assent in a meeting generates the necessary depth of mutual expectation.
          *   **Preference Falsification & Doubt:** Lewis's framework predicts precisely the behavior you see. Each housemate, even while nodding, might privately doubt:
              *   *Do the others *really* mean it, or are they just being agreeable?*
              *   *Will *they* actually remember to use the kitty, or just fall back on the old habit?*
              *   *If I stop buying when I notice something, will someone else step in, or will we just run out?*
          *   **The Shadow of Precedent:** The powerful salience of the old convention makes these doubts rational. The precedent makes the old behavior the "safe bet" in the face of uncertainty about others' commitment to the new rule.
      *   **The Kitty Isn't "Self-Announcing":** The old convention has a simple, visible trigger: noticing a lack. The kitty requires a new set of actions (topping up, tracking kitty money, using kitty money to buy) that aren't automatically triggered by the same event (noticing a lack). The *absence* of the new behavior (e.g., no one topping up the kitty on the 1st) is less salient than someone *not* buying TP when they see it's gone under the old system.

  3.  **Why Private Agreement is Beside the Point (Lewis's Prediction):**
      *   Lewis's theory **explicitly predicts** that private agreement on superiority is largely irrelevant to convention stability. What matters is the **salience of the equilibrium point based on precedent and common knowledge of the *regularity in action***. A convention persists as long as:
          *   It remains a coordination equilibrium.
          *   There's common knowledge of conformity to it.
          *   There's common knowledge that everyone *prefers* to conform *if others do* (which they do, because it's an equilibrium).
      *   Your private belief that the kitty is *better* doesn't change the fact that *conforming to the existing convention* is still the rational choice *given your expectations that others will conform to it*. You'd prefer everyone switched *to* the kitty, but you don't have sufficient reason to believe they *will* switch consistently enough to make *your* switch rational. The precedent trumps the preference.

  4.  **What Would it Take to Shift (Lewisian Prescription):**
      *   **Creating Overwhelming Salience for the New Rule:** You need an event or action that makes the new kitty system the *unambiguously obvious* focal point, overriding precedent. A house meeting alone isn't enough. What *might* work (according to Lewis):
          *   **A Salient Joint Action at the Meeting:** Don't just *agree*; *act*. Set up the physical kitty jar/bank account *during the meeting*. Have everyone physically put in the first month's contribution *immediately, in front of everyone*. Create a highly visible tracking chart on the fridge *during the meeting*. This transforms abstract agreement into a concrete, *public*, *simultaneous* act of commitment. This act itself becomes a new, powerful **precedent** for the new system.
          *   **A Salient Triggering Event:** Tie the switch to a highly noticeable event. "Starting *right after* we run out of this next thing (e.g., coffee), we use the kitty." The moment of running out becomes a salient reminder of the new rule. Or, "On the first of next month, we all top up the kitty."
          *   **Eliminating the Old Option (Temporarily):** A drastic but Lewis-compatible move: Agree that *for the next month*, absolutely *no one* buys staples individually. If something runs out, it stays out until someone buys it *with kitty money*. The discomfort of running out creates salience around the *failure* of the old system and the *necessity* of the new one. This requires strong commitment but breaks the precedent by forcing a new pattern.
      *   **Generating Robust Common Knowledge of Commitment:** The actions above (joint funding, public chart, synchronized start date) are designed to *create* common knowledge: "Everyone *here and now* is not just agreeing, but *acting* to start the new system. I see them acting, they see me acting, we all see each other seeing it..." This reduces the doubt that kills the switch.
      *   **Establishing New Precedent Quickly:** The first few successful kitty purchases (where someone uses kitty funds, replenishes, and it's visible) become the *new* precedents, building salience for the new equilibrium. Consistency in the transition phase is crucial.

  **In Conclusion (Lewis's Answer to Your Questions):**

  *   **Why are you stuck?** The entrenched precedent of the "noticer buys" rule makes it overwhelmingly salient. Common knowledge exists for the *old* regularity but *not* for a reliable, actionable commitment to the new one. Private agreement on the kitty's superiority doesn't overcome the coordination problem of *simultaneously switching* expectations and actions.
  *   **Is private agreement beside the point?** **Yes, absolutely.** Lewis's theory predicts that conventions persist based on mutual expectations grounded in precedent and common knowledge of conformity, *not* private preferences for alternatives. Rationality dictates conforming to the salient equilibrium, not the ideal one.
  *   **Does "let's all just agree to switch" work?** **No, not reliably.** As you suspect, it smuggles in too much. A verbal agreement in a meeting generally fails to generate the **depth of mutually recognized, action-oriented commitment** that constitutes common knowledge for a *new* convention. It doesn't create sufficient salience to override the old precedent. It leaves room for doubt about follow-through, which is fatal to establishing a new coordination equilibrium.
  *   **What would work?** A **salient, joint, public action** performed *at the time of agreement* that *initiates* the new regularity (e.g., funding the kitty together immediately, creating the tracking system) or ties it to a salient future event (synchronized start date). This creates new precedent and robust common knowledge of commitment, providing the focal point needed for the new equilibrium to take hold.

  Your house is a perfect microcosm of Lewis's world: a coordination problem solved by a self-perpetuating, arbitrary convention held in place by precedent and common knowledge. Escaping it requires not just better ideas, but a *salient event* powerful enough to shatter the old expectations and establish new ones with crystal-clear common knowledge. The theory suggests your meetings need less talk about *why* to switch and more dramatic, simultaneous *action* demonstrating *that* you are switching, right now.
