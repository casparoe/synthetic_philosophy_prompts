  We are ranking the candidate explanations for why we have the intuition that consciousness poses a hard problem (the "problem intuitions"). The goal is to rank by how much genuine explanatory work they do in accounting for that intuition.

   The list:

   1. **Introspective opacity** (Armstrong's "headless woman" illusion): The idea that when we introspect, we don't see the underlying mechanisms, so consciousness appears as a "headless" phenomenon without structure. This creates the illusion of something inexplicable.

   2. **The phenomenal concept strategy** (Loar/Papineau/Balog): We have special concepts for phenomenal states (like recognitional or quotational concepts) that are conceptually isolated from physical/functional concepts, leading to an explanatory gap.

   3. **Primitive quality attribution** (color-illusion analogy for qualia): We attribute primitive, intrinsic qualities to experiences (like we do with colors) even though they are actually relational or dispositional. This makes them seem non-physical.

   4. **Primitive relation attribution** (Graziano's attention schema): We have a schema that represents attention (or awareness) as a primitive relation, which we then attribute to ourselves, creating the illusion of a primitive awareness.

   5. **The direct-access idea**: Introspection is taken to be unmediated and foundational, so conscious states seem primitive and not composed of anything else.

   6. **Dennett's "user illusion" picture**: Consciousness is a user interface constructed by the brain, and the illusion of a hard problem arises because we mistake the interface for the real thing (which is just complex neural processes).

   7. **Historical/evolutionary just-so stories** (e.g., Humphrey): The illusion of consciousness evolved because it made life feel more worth living, thus promoting survival.

   We are to rank them in tiers: S (best at explaining the intuition), A, B, C, D (worst).

