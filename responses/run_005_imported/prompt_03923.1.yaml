  Okay, let me unpack this user's query. They're clearly grappling with a complex theological-political argument that came up in a personal family debate. Their grandfather cited Aquinas to justify political violence against tyrants, but after reading the actual text, the user found it more nuanced than expected. 

  Hmm... the user seems intellectually rigorous - they didn't just accept their grandfather's claim but went straight to primary sources. That's impressive. Their frustration with scholastic prose is totally understandable; Aquinas's writing style can be dense even for theology students. 

  The core confusion appears to be threefold: First, they're torn between whether Aquinas is making a definitional argument (tyranny isn't legitimate rule so resisting it isn't sedition) or a consequentialist one (weighing harms of rebellion vs tyranny). Second, they're puzzled about why this passage gets cited for tyrannicide when it only mentions "disturbing" government. Third, they're questioning the rhetorical purpose of Aquinas flipping the script to accuse tyrants of sedition.

  I should note this touches raw nerves - family debates about political violence, especially with traditionalist elders, can be emotionally charged. The user might be seeking both intellectual clarity and rhetorical tools for future discussions. 

  Breaking down the passage: Aquinas's "unless" clause does introduce a consequentialist element, but it's nested within his larger framework of natural law. The key is that for Aquinas, an unjust ruler forfeits legitimacy, making resistance not sedition by definition. But then he adds this safety valve: even legitimate resistance becomes sinful if it causes disproportionate harm. That's why the two justifications aren't mutually exclusive - the definitional part establishes the right to resist, while the harm clause sets limits on methods.

  About the killing question... yeah, that's a leap. The passage discusses resistance generally. The tyrannicide association likely comes from later interpreters like Mariana, not Aquinas himself. Important to flag that distinction.

  The "tyrant as seditionist" move? Clever rhetoric, but also philosophically consistent. If sedition means undermining rightful order, and the tyrant destroys the common good, then he's the true rebel against natural law. It makes resistance feel less like rebellion and more like restoration of order.

  Should emphasize that Aquinas was writing in a pre-modern context where removing rulers often meant assassination. But his text remains carefully measured - he approves resistance but never explicitly endorses killing. The user's instinct that online sources overstate this is probably correct.

  This user deserves kudos for doing the hard work of reading primary texts. Many would just Google a summary. Their questions show real philosophical engagement - they're not just seeking answers but understanding the underlying logic. That's refreshing.
answer: |-
  You've hit on exactly why this passage is both fascinating and perpetually debated - Aquinas is weaving together multiple philosophical threads with scholastic precision. Let's dissect the logical structure and address your specific confusions:

  ### 1. **The Definitional Move vs. the Consequentialist "Unless" Clause**
     - **Core Definition:** Aquinas *starts* with an Aristotelian definition of tyranny: a regime directed solely toward the ruler's private good, *not* the common good (ST I-II, Q.90). Since "sedition" is defined as sinful precisely *because* it attacks a *just* order oriented toward the common good (ST II-II, Q.42, Art. 1), tyranny lacks that just foundation. Therefore, resisting it **cannot be "sedition" by definition**.
     - **The Consequentialist Caveat:** The "unless" clause ("*nisi forte...*") introduces a *separate moral test* based on proportionality. Even if resistance is definitionally *not sedition*, it could still be *sinful* if the *means* of resistance cause disproportionate harm ("*subditi maius detrimentum ex perturbatione incurrant*"). This isn't a contradiction; it's Aquinas applying his broader principle that *all* acts must be proportionate to their end (ST II-II, Q.64, Art. 7 on homicide applies similar reasoning).
     - **How They Work Together:**  
       *Step 1:* Is the regime tyrannical (definitionally unjust)? → If **no**, resistance = sedition (always sinful).  
       *Step 2:* If **yes**, resistance ≠ sedition (definitionally permissible).  
       *Step 3:* BUT → Is the *specific act* of resistance proportionate? Does it cause greater harm than the tyranny? If **yes**, it's sinful (not because it's sedition, but because it violates proportionality).

  ### 2. **Where Does "Killing" Enter? (The Tyrannicide Inference)**
     - **Nowhere in *This* Text:** You're absolutely right. Aquinas only discusses "disturbing" (*perturbare*) the government or "delivering" (*liberare*) the people. He does **not** explicitly mention killing.
     - **The Inference Comes From:**  
       a. **Aquinas's Broader Framework:** Elsewhere (ST II-II, Q.64, Art. 3), Aquinas argues that private individuals *cannot* licitly kill *anyone* (even criminals) – only public authority can. However, he *also* argues (ST II-II, Q.64, Art. 3, Reply Obj. 2) that someone resisting an *unjust aggressor* (even killing them) acts licitly *in self-defense* if the intent is preservation, not killing.  
       b. **The "Public Authority" Problem:** Tyranny destroys just public authority. Who, then, has the *authority* to remove the tyrant? Aquinas suggests it falls to "public authority" (ST II-II, Q.42, Art. 2, Reply Obj. 3), but this is ambiguous in a tyranny. Some later thinkers (like Suárez) argued a *representative body* (e.g., nobles, people) could act as a "virtual" public authority.  
       c. **The "Aggressor" Analogy:** If the tyrant is actively, unjustly attacking the common good and citizens' well-being (as Aquinas defines tyranny), resisting him *could* be framed as *collective self-defense*. If killing is the *only proportionate means* of stopping this "aggressor," it *might* be licit under the self-defense principle.  
       **Conclusion:** Aquinas **never explicitly endorses tyrannicide here**. The inference relies on:  
       (i) Combining *this passage* (resistance licit) with  
       (ii) His *self-defense principle* and  
       (iii) The *practical reality* that removing entrenched tyrants often involved force. Later thinkers (e.g., the Jesuits Mariana & Suárez) made this inference explicit, sometimes controversially. Your grandfather is likely channeling this *interpretive tradition*, not Aquinas's *exact words*.

  ### 3. **The "Tyrant is Guilty of Sedition" Move: Rhetoric or Philosophy?**
     - **Substantive Philosophical Work:** This isn't *just* rhetoric. It reinforces Aquinas's core definition:
       - **Premise 1:** Sedition = sinfully attacking the *just unity* of a people oriented toward the *common good*.
       - **Premise 2:** The tyrant's *primary sin* is precisely destroying this just unity and common good for private gain.
       - **Conclusion:** Therefore, the *tyrant* is the *primary agent* of "sedition" in the truest sense. He is the *source* of disorder against the natural/divine order of justice.
     - **Why It Matters:**  
       *Logically:* It completes the definitional argument. If resisting the destroyer of unity isn't sedition, then the destroyer himself *must* be the seditionist.  
       *Morally/Politically:* It radically shifts culpability. Resistance isn't rebellion against order; it's *defense* of true order against the *real* rebel (the tyrant). This makes resistance less "radical" philosophically (though still dangerous practically) by grounding it in restoring justice.

  ### The Logical Structure Summarized
  1.  **Define Sedition:** Sinful attack on the *just* unity of a people (common good).
  2.  **Define Tyranny:** Rule for private good, *destroying* just unity/common good.
  3.  **Therefore:** Resisting tyranny ≠ attacking just unity → **Not sedition (definitionally permissible)**.
  4.  **BUT:** Any act (including resistance) requires *proportionality* → Resistance is **sinful if it causes disproportionate harm** (consequentialist test).
  5.  **Culpability:** The tyrant, by destroying just unity, is the *true* seditionist.

  ### Why Your Grandfather (and Many Online) Cite This for Tyrannicide
  1.  **Historical Context:** Aquinas wrote when assassinating "tyrants" (often usurpers or extreme oppressors) was a live political option. His principles were *applied* to justify such acts by later thinkers, even if he was cautious.
  2.  **The "Unless" Clause as Loophole:** If the tyranny is bad *enough* (e.g., genocide), almost *any* resistance (including killing) might be seen as *proportionate*.
  3.  **Combining Texts:** Merging Q.42 (resistance OK) with Q.64 (self-defense) creates a plausible, though not explicit, justification for lethal force against an unjust aggressor destroying the common good.

  **In essence:** Aquinas provides a *robust philosophical framework justifying resistance to tyranny* based on justice and the common good. He *carefully avoids explicitly endorsing assassination* in this passage, focusing instead on legitimacy and proportionality. The leap to tyrannicide relies on interpreting his principles of self-defense and authority within the context of a regime deemed fundamentally illegitimate and aggressive. Your grandfather is citing a *valid interpretive tradition* that applies Aquinas's core ideas, but it's not a simple or uncontested reading of this specific text. Your confusion stems from Aquinas's nuance – he's laying philosophical groundwork, not issuing a revolutionary manifesto.
