answer: |-
  You've hit on a profound weakness in the "modern history" patch for etiological theories. Yes, shifting the focus to "recent" selective history **merely relocates the arbitrariness** rather than eliminating it, undermining the etiological theorist's core argument against Cummins-style accounts. Here's why:

  1.  **The Core Arbitrariness Charge Against Cummins:**
      *   Causal-role functions are defined *relative to a chosen system and a chosen capacity* of that system. Why pick *this* system (organism vs. cell)? Why pick *this* capacity (circulation vs. locomotion)? The choice seems arbitrary, leading to function attributions that feel too liberal or context-dependent (e.g., the heart's function being "thumping" relative to a "sound-production system").

  2.  **Godfrey-Smith's Patch & Its New Arbitrariness:**
      *   Modern History Theory (MHT) replaces the origin story with a "recent history" story to handle exaptation. Function is what the trait has been *recently* maintained by selection *for*.
      *   **The New Question:** What counts as "recent"? This introduces a *temporal* arbitrariness directly analogous to the *system/capacity* arbitrariness in Cummins.
          *   How many generations back is "recent"? 10? 100? 1000? 1,000,000?
          *   Is it a fixed number? A percentage of the trait's existence? Relative to the rate of environmental change?
          *   What if selective pressures fluctuate? Does "recent" require stable selection? How stable?

  3.  **Why This Arbitrariness is Just as Problematic:**
      *   **Function Attribution Depends on the Chosen Timeframe:** Changing the "recent" window can change the attributed function.
          *   *Example:* Insect wings might have a "flight" function if we look at the last 100 million years. But if we look at the last 500 million years (including their origin), the function might ambiguously include thermoregulation or shift entirely to it. If flight pressure relaxed significantly for a period within the "recent" window, does the function disappear or change during that sub-period?
      *   **Lack of a Principled Criterion:** Etiological theorists demand a *principled, objective* basis for function attribution to avoid Cummins' liberalness. However, defining "recent" requires choosing a temporal boundary. What *objective, non-arbitrary* biological principle dictates this boundary? There is no clear biological answer akin to "the unit of selection" for this timescale. The choice seems pragmatic or contextual, mirroring the pragmatic choices the causal-role theorist makes.
      *   **Handling Gradual Change & Fluctuation:** Evolution is often gradual, with co-option happening incrementally. Selection pressures change. MHT struggles to pinpoint *when* exactly the "recent" function switches from the old effect to the new effect, especially if both effects were simultaneously under weak selection during a transition. This vagueness echoes the vagueness in defining the precise boundaries of a "system" or "capacity" in causal-role theory.
      *   **The Problem of "Maintained":** MHT often defines function as the effect the trait is *currently maintained* by selection for. This sounds less arbitrary, but:
          *   "Currently" is still a temporal slice – how thin? One generation?
          *   Determining what a trait is *currently* maintained *for* requires inferring selection pressures *now*, which is notoriously difficult (often relying on current utility, which blurs into Cummins). It risks collapsing into a forward-looking or systemic view.
          *   If a trait is *not currently under selection* (e.g., a vestigial trait, or a trait in a stable environment with no variation), does it lose its function? This seems counterintuitive to the etiological view's historical emphasis.

  4.  **The Symmetry of the Challenge:**
      The etiological theorist's critique was: *"Cummins functions are arbitrary because you can choose any system/capacity."*
      The counter-critique is: *"MHT functions are arbitrary because you can choose any timeframe for 'recent'."*
      Both theories require making a choice that significantly impacts function attribution, and neither choice seems dictated by a single, unambiguous, objective biological principle external to the theory itself.

  **Conclusion:**

  Godfrey-Smith's modern history patch successfully solves the *exaptation problem* by decoupling function from ultimate origins. However, it does so at the cost of **importing a new form of arbitrariness** – the arbitrariness of the temporal scale defining "recent history" or "current maintenance." This temporal arbitrariness is directly analogous to the systemic/capacity arbitrariness that etiological theorists criticize in causal-role theories.

  Therefore, while MHT makes etiological theories *more flexible* and handles important biological cases like insect wings, it **does not successfully defend them against the charge of arbitrariness**. It merely shifts the locus of that arbitrariness from the choice of system/capacity to the choice of temporal window. The etiological theorist's claim to a significantly *more principled* or *less liberal* account than Cummins is substantially weakened by this move. The debate highlights that *any* theory of biological function faces difficult boundary-drawing problems.
