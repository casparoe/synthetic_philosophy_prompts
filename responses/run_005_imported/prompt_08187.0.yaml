answer: |-
  ### Grading of Student Answer

  #### (a) [4 points]  
  **Student's Answer:**  
  "By mentioning the presentation, Sam is indirectly declining the invitation. He is implying that he probably won't be at the party, or at least can't commit to it, because he needs to be prepared and well-rested for Monday."  

  **Evaluation:**  
  - **Correct:** Accurately identifies the implicature (declining the invitation) and the reasoning (preparation/rest for Monday).  
  - **Complete:** Explicitly states both the refusal and its justification.  
  - **No errors.**  
  **Score: 4/4**  

  ---

  #### (b) [7 points]  
  **Student's Answer:**  
  "This implicature is driven by the maxim of Relation ('be relevant'). [...] Sam flouts the requirement to be relevant. [...] Priya reasons that he must be flouting relevance on purpose [...] To preserve the assumption that Sam is cooperating, Priya supplies the missing premise [...] The implicature is calculable [...]"  

  **Evaluation:**  
  - **Strengths:**  
    - Correctly identifies the maxim of Relation as central.  
    - Explains calculability via the Cooperative Principle and Priya’s inference.  
    - Notes the "missing premise" (incompatibility of party/preparation).  
  - **Weaknesses:**  
    - **Overstates flouting:** Grice distinguishes between "flouting" (overt, intentional violation to trigger implicature) and other failures (e.g., quietly violating or opting out). Here, Sam’s response is **not a clear flout** like irony (which blatantly violates Quality). Instead, Sam exploits the maxim by implying relevance indirectly. Grice would classify this as **exploiting** the maxim (a sub-type of "failure to fulfill") but not necessarily "flouting" in the dramatic sense. The student incorrectly equates all maxim-based implicature generation with flouting.  
    - **Missing nuance:** Sam observes the maxim *at the level of implicature* (Grice: "a maxim is violated *at the level of what is said* but followed at the level of what is implicated"). The student acknowledges this indirectly but mislabels it as flouting.  
  **Score: 6/7** (Deducted 1 point for conflating exploitation with flouting).  

  ---

  #### (c) [5 points]  
  **Student's Answer:**  
  "This is a generalized conversational implicature. [...] citing a prior commitment [...] is, in general, taken by default to signal a negative answer [...] Because the inference goes through automatically [...] rather than from background assumptions specific to Sam and Priya."  

  **Evaluation:**  
  - **Strengths:**  
    - Correctly defines generalized implicature (default inference, context-independent).  
    - Contrasts with particularized (context-dependent).  
  - **Weaknesses:**  
    - **Overgeneralized claim:** While "prior commitment → refusal" is common, it is **not truly generalized** like "some → not all". The inference relies heavily on cultural/contextual assumptions (e.g., that preparing for a presentation requires rest, that parties are time-consuming). In a context where parties are quiet or Sam is a night owl, no refusal may be implicated. Truly generalized implicatures (e.g., scalar implicatures) hold across contexts without special assumptions.  
    - This is **particularized**: It depends on Priya knowing norms about work/parties. Grice’s own examples of generalized implicatures are lexical (e.g., "X is meeting a woman" → not his wife).  
  **Score: 3/5** (Deducted 2 points for misclassification; correct defense but flawed reasoning).  

  ---

  #### (d) [4 points]  
  **Student's Answer:**  
  "The implicature is cancellable: Sam could add, 'I've got a big presentation [...] but I’ll definitely still swing by' [...] this is perfectly coherent [...] it must be a conversational rather than a conventional implicature."  

  **Evaluation:**  
  - **Perfect:**  
    - Clear cancellation example without contradiction.  
    - Correctly ties cancellability to conversational (not conventional) implicature.  
    - Explains why conventional implicatures (e.g., "but" signaling contrast) cannot be cancelled.  
  - **No errors.**  
  **Score: 4/4**  

  ---

  ### Total Score: 17/20 (B+)  
  - **Breakdown:**  
    - (a): 4/4  
    - (b): 6/7  
    - (c): 3/5  
    - (d): 4/4  

