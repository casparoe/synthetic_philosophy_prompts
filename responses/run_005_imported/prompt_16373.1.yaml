prompt: |-
  I'm drafting the literature-review chapter of my dissertation in philosophy of language, on singular reference and cognitive significance, and I'd like an independent read on the state of play regarding Frege's puzzle. In its core form: co-referring names such as "Hesperus" and "Phosphorus" make "Hesperus is Phosphorus" informative in a way that "Hesperus is Hesperus" is not, even though naive Millianism predicts that the two sentences express exactly the same proposition. The puzzle sharpens once substitution failures in propositional-attitude reports are added to the mix — for instance, Kripke's Pierre, who assents to "Londres est jolie" while dissenting from "London is pretty," despite the stipulated co-reference of "Londres" and "London."

  Please rank the following proposed solutions by how well each jointly handles (a) the informativeness of true identity statements and (b) substitution failure in attitude ascriptions, without resorting to ad hoc stipulation: Frege's sense/reference distinction; Russell's definite-description theory of names; naive Millian direct reference; Kripke's causal-historical theory of reference paired with a purely pragmatic account of informativeness; Nathan Salmon's guise-theoretic Millianism; Scott Soames' pragmatic-enrichment account; the hidden-indexical theory of belief reports (Schiffer; Crimmins and Perry); and two-dimensional semantics in the style of Stalnaker, Chalmers, and Jackson.

  Please give your answer as a JSON block with tiers from S (best) to D (worst), formatted as follows:

  ```json
  {
    "S": [...],
    "A": [...],
    "B": [...],
    "C": [...],
    "D": [...]
  }
  ```
reasoning: |-
  We are ranking the proposed solutions to Frege's puzzle based on how well they handle:
   (a) the informativeness of true identity statements (like "Hesperus is Phosphorus" being informative while "Hesperus is Hesperus" is not)
   (b) substitution failure in attitude ascriptions (like Pierre's case: he assents to "Londres est jolie" but dissents from "London is pretty")

   We are to avoid ad hoc stipulation.

   The solutions to rank:
   1. Frege's sense/reference distinction
   2. Russell's definite-description theory of names
   3. naive Millian direct reference
   4. Kripke's causal-historical theory of reference paired with a purely pragmatic account of informativeness
   5. Nathan Salmon's guise-theoretic Millianism
   6. Scott Soames' pragmatic-enrichment account
   7. hidden-indexical theory of belief reports (Schiffer; Crimmins and Perry)
   8. two-dimensional semantics (Stalnaker, Chalmers, Jackson)

   We will assign each to a tier: S (best), A, B, C, D (worst)

   Let's analyze each approach:

   1. Frege's sense/reference distinction:
      - (a) Informativeness: explained by different senses (modes of presentation) for the same referent.
      - (b) Substitution failure: explained because attitude contexts report the sense, not the reference. So "Pierre believes that Londres est jolie" and "Pierre believes that London is pretty" report different senses, hence can have different truth values.
      - Strengths: Directly addresses the puzzle. Weaknesses: Postulates abstract entities (senses) and requires that names have descriptive content, which Kripke's modal argument challenges.

   2. Russell's definite-description theory of names:
      - Names are abbreviations for definite descriptions. So "Hesperus" might be "the evening star" and "Phosphorus" "the morning star".
      - (a) The identity statement becomes "the evening star is the morning star", which is informative because it is not a logical truth.
      - (b) For attitude reports: "Pierre believes that Londres is pretty" becomes about a description (say, "the city called 'Londres'") and "London is pretty" becomes about a different description (say, "the city called 'London'"), so they are different.
      - Weaknesses: Kripke's modal and epistemic arguments show that names are rigid while descriptions are not, and that we can have names without associated descriptions. Also, the description associated might vary by speaker.

   3. naive Millian direct reference:
      - Names only contribute their referent to the proposition. So "Hesperus is Phosphorus" and "Hesperus is Hesperus" express the same proposition (a trivial identity).
      - (a) Cannot explain informativeness: the two sentences express the same proposition, so why is one informative and the other not? It must appeal to something extra (like pragmatics) but naively does not.
      - (b) Substitution failure: cannot explain why substitution fails in attitude contexts because the proposition is the same. So it would predict that if Pierre believes that Londres is pretty, then he believes that London is pretty (since they are the same city), but he doesn't.
      - This is the view that the puzzle challenges, so it fails both.

   4. Kripke's causal-historical theory of reference + pragmatic account of informativeness:
      - Kripke's theory fixes reference without descriptions, but for the puzzle, he suggests a pragmatic account: the proposition is the same, but the way we come to it is different. Informativeness is explained by the fact that we learn something about the world (the same object has two names) but not by the propositional content.
      - (a) Informativeness: pragmatic, so it's about how the sentence is presented, not the proposition.
      - (b) For attitude reports, Kripke (in "A Puzzle about Belief") suggests that the puzzle is not really about substitution but about how we report beliefs. He does not offer a solution but points out the complexity. The pragmatic account might say that the belief report is sensitive to the way the believer would express the belief. However, without a structured account of beliefs, it's hard to handle substitution failure without ad hoc stipulation.

   5. Nathan Salmon's guise-theoretic Millianism:
      - Salmon is a Millian but uses guises (ways of taking the proposition) to explain cognitive significance. The proposition is the same, but it is grasped under different guises.
      - (a) Informativeness: explained by the different guises (modes of presentation) associated with the names, without making them part of the proposition.
      - (b) For attitude reports: believes is a three-place relation between a subject, a proposition, and a guise. So Pierre believes the same proposition (that London is pretty) under the guise of "Londres" but not under the guise of "London". This explains why we can report one but not the other.
      - Strengths: maintains Millianism and handles both (a) and (b). Weakness: postulates guises as additional parameters.

   6. Scott Soames' pragmatic-enrichment account:
      - Soames (building on Salmon) uses pragmatics to explain belief reports. The semantic content is Millian, but in reporting beliefs, we pragmatically convey information about the way the believer thinks of the referent.
      - (a) Informativeness: explained pragmatically: the identity sentence pragmatically conveys that the same object has two names or two modes of presentation.
      - (b) Substitution failure: explained by the pragmatics of belief reports: when we say "Pierre believes that London is pretty", we pragmatically imply that Pierre would assent to a sentence using "London", which he doesn't. So the report is literally false (because the proposition is the same) but pragmatically conveys something true? Or Soames might say that the report is literally true but pragmatically misleading? This is tricky. Soames actually argues that the belief report is literally true (because the proposition is the same) but we are reluctant to assert it because it would pragmatically imply that Pierre would assent to "London is pretty", which he doesn't. This doesn't fully explain why we can truly assert one and not the other without ad hoc stipulation.

   7. Hidden-indexical theory (Schiffer; Crimmins and Perry):
      - Belief reports have a hidden indexical parameter for the mode of presentation. So "Pierre believes that London is pretty" is true iff there is some mode of presentation m such that Pierre believes the proposition that London is pretty under m, and m is contextually appropriate (e.g., the "Londres" mode). But in the other context, the mode required is the "London" mode, which is not the one Pierre uses.
      - (a) Informativeness: the identity statement is about the same object but the modes are different, so it's informative because it links two modes of presentation.
      - (b) Substitution failure: explained because the mode of presentation is part of the truth conditions of the belief report, but it is hidden and context-dependent. The two reports require different modes, so they can differ in truth value.
      - Strengths: handles both. Weakness: the context-dependence and hidden parameter might be seen as ad hoc.

   8. Two-dimensional semantics (Stalnaker, Chalmers, Jackson):
      - Assigns two intensions to an expression: primary (epistemic) and secondary (metaphysical). The primary intension reflects how reference is fixed in different scenarios, so "Hesperus" and "Phosphorus" might have different primary intensions (because they are fixed by different descriptions) even if they have the same secondary intension (the planet Venus).
      - (a) Informativeness: "Hesperus is Phosphorus" is epistemically necessary but not a priori (if we use primary intensions) because in some scenarios they might pick different objects. But actually, Chalmers would say that the primary intensions of the two names are different, so the identity is not a priori.
      - (b) For attitude reports: the content of belief might be the primary intension. So Pierre associates different primary intensions with "Londres" and "London", so the belief reports are about different primary intensions.
      - However, this view is controversial and might be seen as giving up on direct reference. Also, Kripke's arguments against descriptivism apply to the primary intension if it is descriptive.

