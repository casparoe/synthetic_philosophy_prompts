  **Rationale:**  
  - **S-tier**: Frege's distinction handles (a) via senses as cognitive modes and (b) by making attitude reports sensitive to senses. Salmon's Millianism preserves direct reference while explaining (a) and (b) through guises (propositional attitudes relate agents to propositions *under guises*), avoiding ad hoc stipulations.  
  - **A-tier**: Hidden-indexical theory handles (b) via contextually determined modes of presentation in belief reports and (a) via cognitive access to referents. Two-dimensional semantics addresses (a) via primary intensions (epistemic content) and (b) by distinguishing scenarios where reference differs, though it introduces significant metaphysical commitments.  
  - **B-tier**: Soames' pragmatic account explains (a) through asserted vs. conveyed content but struggles with (b), as substitution failures in attitude reports require pragmatic implicatures that risk circularity.  
  - **C-tier**: Russell's descriptivism resolves (a) and (b) by reducing names to descriptions but fails Kripke's modal and epistemic objections (e.g., names are rigid, not descriptive). Kripke's causal-pragmatic pairing handles (a) via metalinguistic learning but offers no robust solution for (b), leaving substitution failures unaddressed.  
  - **D-tier**: Naive Millianism collapses co-referring names into the same proposition, failing both (a) and (b) outright.
