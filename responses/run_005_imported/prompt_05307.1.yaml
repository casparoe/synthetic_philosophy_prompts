  Here’s a dialogue between **Lewisian (Leona)** and **Interventionist (Ian)**, rigorously debating the trumping preemption case. Both engage deeply with each other’s frameworks, conceding ground where needed while defending their core principles. Neither emerges as a strawman:

  ---

  **Setting:** A sunlit university common room, coffee in hand.  
  **Case:** Sergeant (Sgt) and Major (Maj) shout "Charge!" simultaneously. Troops charge *only* because of Maj’s order (due to rank hierarchy), but would have charged on Sgt’s order *alone* if Maj had been silent.  

  ### **The Dialogue:**

  **Leona (Lewisian):** Ian, this case is kryptonite for your interventionism. Let’s grant your tools: build a causal model with variables *Maj_Order*, *Sgt_Order*, and *Charge*. The structural equation is clear: *Charge = YES* if *Maj_Order = YES* OR (*Sgt_Order = YES* AND *Maj_Order = NO*). Now intervene: set *Maj_Order = NO*. What happens? *Charge* still equals YES! So by your *own* formalism—manipulating *Maj_Order* changes nothing. Ergo, Major isn’t a cause. But that’s absurd! The troops charged *because* of the Major!  

  **Ian (Interventionist):** Leona, you’re smuggling in metaphysics. My model *must* reflect the actual causal structure. The troops don’t respond to the *disjunction* of orders—they respond to a *hierarchy*. The true equation is:  
  ***Charge = Maj_Order* if *Maj_Order* is present; else *Sgt_Order***.  
  Intervene on *Maj_Order* (set to NO): *Charge* now depends on *Sgt_Order*, which is YES, so charge occurs. But intervene on *Sgt_Order* (set to NO) *while holding Maj_Order fixed at YES*: *Charge* remains YES! The charge *counterfactually depends* on the Major under this intervention. Your theory can’t even *see* that because you ignore mechanisms.  

  **Leona:** Clever, but you’re gerrymandering the model to fit intuition. Lewis’s original counterfactual test is pristine: "If Maj hadn’t ordered, would Charge have occurred?" *Yes*. Therefore, no dependence → no causation. Full stop. Your "hierarchy" is just a *description* of the preemption. It doesn’t resolve the paradox—it restates it!  

  **Ian:** And *your* test is context-blind! Lewis himself admitted preemption requires evaluating counterfactuals in the *actual* context. Here, the actual context includes the sergeant’s order. But if we consider a *minimal* change to remove the Major’s order *while holding everything else fixed*—including the sergeant’s yell—then yes, charge still happens. But that just proves the sergeant is a *backup* cause. It doesn’t negate that in the actual world, the Major’s order *preempted* him. Interventionism captures this by testing invariance across relevant changes.  

  **Leona:** So you admit counterfactual dependence fails? Then your view reduces to "causation is what survives *your preferred interventions*." But why prefer those? The troops *would have charged without the Major*. That’s a devastating counterfactual!  

  **Ian:** Because interventions reveal *modularity*—whether changing *X* changes *Y* when we control other variables. Hold *Sgt_Order* fixed: changing *Maj_Order* from YES to NO *doesn’t* change *Charge*? Correct. But change *Maj_Order* from **NO to YES** *while holding Sgt_Order fixed*: *Charge* stays YES? *No!* If Maj had been silent (NO), and we *intervene* to make him shout (YES), the charge *still occurs*—but crucially, *now because of him*. Woodward’s insight: causation isn’t just difference-making; it’s about *robust, invariant relationships*. The Major’s order is invariant in the actual scenario.  

  **Leona:** Invariance isn’t causation. Suppose a backup generator kicks in when the main fails. The lights staying on don’t "depend" on the main generator in your invariance sense—but the *backup* caused it. Here, the Major is the main generator, but the sergeant is the backup. If the main fails, backup works. But when both run, only the main is operative. Lewis handles this with *causal chains*: the Major’s order *cuts the sergeant’s process off*. No counterfactual dependence needed.  

  **Ian:** Ah! Now you retreat to process theories! But if you need *additional machinery* (causal chains, preemption) to salvage counterfactual dependence, doesn’t that prove my framework is *more parsimonious*? Interventionism diagnoses trumping via the hierarchy *in the model itself*. Your "cutting off" is just intuition until formalized.  

  **Leona:** Fair—but your model requires *knowing the hierarchy* upfront. What if we’re ignorant of military rules? Lewis only needs particular events and counterfactuals. And *your* answer is ambiguous: you say the Major caused it because changing his order *from silence to speech* in the sergeant’s presence *wouldn’t* change the outcome... wait, no: if the Major is silent, charge happens via sergeant. If we make him shout, charge still happens. So no change!  

  **Ian:** Precisely! *In this model*, the Major isn’t a *difference-maker*—but he *is* an *actual cause* because he satisfies Woodward’s *insensitivity condition*: across a range of background conditions (including Sgt ordering), changing Maj’s order *doesn’t alter the outcome*, meaning the system is "locked in" by his presence. Pearl calls this "probability raising" in the actual context. The counterfactual "if Maj hadn’t ordered..." *overmines* him by altering too much.  

  **Leona:** So both camps struggle! You invoke "insensitivity" to dodge the counterfactual; I invoke "preemption" to dodge dependence. But perhaps the lesson is *pluralism*: causation isn’t one thing. In *this* case, the Major’s order was the *proximal cause* by military logic, while the sergeant was a *distant cause* via counterfactual safety.  

  **Ian:** A diplomatic truce? Then let’s agree the troops charged *because of the Major’s order* in the actual sequence—but if we’re asking "what made the difference between charging and not?" the answer is *neither*, since both orders were sufficient. That’s why this case bites everyone.  

  **Leona:** *Raises coffee cup*. To Schaffer—the fiend who gave us this mess.  

  **Ian:** *Clinks cup*. And to retirement hobbies that re-open wounds we forgot we had.  

  ---

  ### **Key Engagements Summarized:**  
  - **Ian** forces Leona to confront that Lewis’s standard counterfactual fails, pushing her to appeal to causal preemption.  
  - **Leona** exposes ambiguities in Ian’s model specification and questions why interventions "hold fixed" certain variables.  
  - **Both** concede their frameworks need refinement (Leona: preemption; Ian: insensitivity/modularity) but defend their core insights.  
  - **Resolution:** A draw, with hints at pluralism—agreeing on the Major’s *actual causal role* but differing on *why* it counts.  

  This captures the stalemate in philosophy: trumping preemption remains a benchmark for stressing *any* theory of causation.
