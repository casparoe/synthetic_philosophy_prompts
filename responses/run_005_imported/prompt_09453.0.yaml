answer: |-
  **MEMORANDUM**  
  To: Mutual Aid Fund Board  
  From: [Your Name], Review Panel Volunteer  
  Date: [Date]  
  Subject: Optimizing Review Panel Accuracy—Recommendations on Size and Process  

  ### 1. **Acknowledging the "More Reviewers Help" View**  
  The proposal to expand our panel from 3 to 7–9 reviewers aligns with the well-established **Condorcet Jury Theorem**. This theorem confirms that when independent voters are *individually competent* (each >50% likely to be correct) and *independent*, majority votes grow dramatically more reliable as the group expands. For example:  
  - With 3 reviewers each 60% competent, majority accuracy is ~65%.  
  - With 9 reviewers at 60% competence, accuracy rises to ~85%.  
  This mathematical foundation makes a compelling case for larger panels—**if** independence and individual competence hold.  

  ### 2. **Key Risks in Our Current Process**  
  Our panel’s structure may undermine the theorem’s assumptions, risking *diminished returns* or even *reduced accuracy* with more reviewers:  
  - **Dependence via fixed speaking order:** Early speakers anchor discussion, potentially biasing later voters (especially newest members). This violates *independence* by creating herd effects.  
  - **Small, like-minded pool:** With ~12 rotating volunteers sharing similar backgrounds/values, errors may be *correlated* (e.g., systemic bias toward generosity or austerity). The theorem assumes errors are random and independent; correlated errors erode the benefits of added reviewers.  
  - **Competence concerns:** If individual accuracy is near or below 50% (e.g., due to complex cases), larger groups amplify errors.  

  ### 3. **Concrete Recommendations**  
  To harness the power of larger panels *without* sacrificing accuracy to dependence, I propose:  

  #### **A. Process Changes (Immediate, Low-Cost Fixes)**  
     - **Private voting:** Replace public show-of-hands with **anonymous written votes** after discussion. *Why:* Prevents social pressure and recency bias.  
     - **Blind initial assessments:** Before discussion, require reviewers to **privately write preliminary opinions**. These are revealed only after voting. *Why:* Captures independent judgment before group influence.  
     - **Randomize speaking order:** Replace fixed order (newest-last) with **lottery-determined speaking sequence** per case. *Why:* Disrupts anchoring and hierarchy effects.  

  #### **B. Panel Size Adjustment (Conditional on Process Reforms)**  
     - **Pilot a moderate expansion to 5 reviewers**, *only* if the above process changes are adopted.  
     - **Why 5?**  
       - Balances statistical gains (e.g., 70% accuracy at 60% individual competence) with operational feasibility.  
       - More sustainable with our ~12-person pool than 7–9 (reducing reviewer fatigue/correlated biases).  
     - **Delay larger expansions (7–9)** until we validate improved independence via pilot data.  

  #### **C. Strengthening Independence Long-Term**  
     - **Expand the reviewer pool** by recruiting 5–10 additional volunteers with diverse backgrounds.  
     - **Mandate brief bias-training** (e.g., 1-hour workshop on cognitive pitfalls in grant review).  

  ### 4. **Why This Approach?**  
  - **Preserves the board’s intent:** By fixing process flaws first, we ensure added reviewers *enhance accuracy*, not just confidence.  
  - **Mitigates risks:** Larger panels without independence may "lock in" early biases with false confidence (e.g., 7 biased reviewers are harder to overturn than 3).  
  - **Resource-smart:** Focuses on high-impact, low-cost process tweaks before scaling.  

  ### 5. **Next Steps**  
  I move to:  
  1. **Adopt private voting, blind assessments, and randomized speaking** starting next quarter.  
  2. **Pilot a 5-reviewer panel** for 3 months under the new process.  
  3. **Review accuracy metrics** (e.g., appeal rates, post-grant outcomes) after the pilot to reassess further expansion.  

  The Condorcet Jury Theorem is powerful—but only when its prerequisites are met. By refining our process *first*, we position larger panels to reduce errors as intended. I welcome discussion on refining these proposals.  

  ---  
  **Appendices**  
  - Condorcet Jury Theorem primer (1-pager available on request).  
  - Simulation: How correlated biases reduce accuracy gains in larger groups.  
  - Proposed ballot template for private voting.
