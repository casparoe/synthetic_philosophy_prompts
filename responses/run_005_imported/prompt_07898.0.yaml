  Hmm, the core tension here seems to be between intent versus impact. The friend claims innocence because she believed her source was reliable, while the affected students focus on the consequences of her actions. 

  I should consider several angles here. First, the responsibility that comes with sharing information - especially academic details that can seriously impact others. Even with good intentions, spreading unverified claims as facts is risky. Then there's the matter of how confidently she presented it, which likely influenced others to trust her without double-checking. 

  The source reliability question is tricky. "Someone from another class" could mean anything from the teacher's aide to a notoriously unreliable classmate. Did she verify? Did she mention the source's ambiguity when sharing? Probably not, given how it played out. 

  Also noteworthy: the students who failed share some responsibility too. Why didn't any of them confirm the date change? Blindly trusting one person's word on something important seems unwise. But that doesn't absolve the friend - her confident delivery discouraged verification. 

  The aftermath reveals another layer. Instead of apologizing for her role in the situation, she's deflecting blame entirely. That lack of accountability likely stings more than the initial mistake. A simple "I'm sorry my bad info caused problems" could've gone far. 

