  The second paragraph applies this to extension. Hume argues we have an idea of extension, which we can divide into indivisible parts. Since we can conceive of such parts without contradiction, they must be possible. Thus, mathematical points (indivisible extended units) are possible, and arguments against them are invalid.

  The user's main concern is the tension here. Hume usually insists that matters of existence require experience, not a priori reasoning. But here, he's using conceivability to establish possibility. Is this an exception? Or can it be reconciled?

  First, I need to parse the argument's structure. The steps are: we have an idea of extension; this idea isn't infinitely divisible because our minds can't grasp infinity; so, it consists of indivisible parts; no contradiction in this idea; therefore, such extension is possible. 

  Now, the conflict with empiricism. Hume elsewhere, like in the Enquiry, says that relations of ideas (like math) are a priori, but matters of fact require experience. Here, he's discussing the nature of space, which seems like a matter of fact, yet he's using a conceivability argument. 

  Possible reconciliations: Hume might see this as a relation of ideas. The idea's coherence is a priori, so possibility follows. But existence in reality still needs experience. So, he's not saying these points exist, just that they're possible. But the user might question if possibility claims are exempt from empirical scrutiny. 

