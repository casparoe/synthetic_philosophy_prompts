answer: |-
  Your source is pointing to a profound and under-discussed crack in the foundations of expected value (EV) reasoning. While St. Petersburg shows EV can be infinite, the Pasadena paradox shows it can be fundamentally *indeterminate* – a deeper and more philosophically troubling result. Here's a comparison tailored for your readership:

  **St. Petersburg Paradox: The Infinite Gamble**

  *   **The Game:** Flip a fair coin until it lands heads.
  *   **Payoff:** If heads first flip: $2. Heads on the second flip: $4. Heads on the third: $8... and so on ($2^n if heads on flip `n`).
  *   **Expected Value Calculation:** Probability of payoff $2 is 1/2, $4 is 1/4, $8 is 1/8... EV = (1/2 * $2) + (1/4 * $4) + (1/8 * $8) + ... = ($1) + ($1) + ($1) + ... = **Infinity**.
  *   **The Problem:** The EV is infinite, suggesting you should be willing to pay *any* finite price to play. But intuitively, most people wouldn't pay much more than $20-$30. This clashes with standard EV maximization.
  *   **Philosophical Verdict:** *Infinite*. The problem is that infinity is unwieldy for decision-making and feels intuitively wrong. Solutions often involve discounting tiny probabilities or using alternative criteria (like median outcome).

  **Pasadena Paradox: The Indeterminate Gamble**

  *   **The Game:** Flip a fair coin until it lands heads.
  *   **Payoff:** If heads on flip `n`, you get paid **$( (-1)^{n+1} * 2^n / n )$**.
      *   Heads Flip 1: +$ (2^1 / 1) = **+$2**
      *   Heads Flip 2: -$ (2^2 / 2) = **-$2**
      *   Heads Flip 3: +$ (2^3 / 3) ≈ **+$2.67**
      *   Heads Flip 4: -$ (2^4 / 4) = **-$4**
      *   Heads Flip 5: +$ (2^5 / 5) = **+$6.40**
      *   ... and so on. Payoffs alternate in sign and grow in magnitude (but slower than St. Pete).
  *   **The Expected Value Nightmare:** Calculating EV requires summing: (1/2 * +$2) + (1/4 * -$2) + (1/8 * +$2.67) + (1/16 * -$4) + (1/32 * +$6.40) + ...
  *   **Conditional Convergence:** Unlike St. Pete's straightforward sum of positive terms, this series *only* converges (to a finite value!) if you add the terms *in the specific order defined by the game* (i.e., flip 1, then flip 2, then flip 3...). Summed this way, it converges to approximately **$0.69**.
  *   **Riemann's Hammer:** Here's the bombshell. The Riemann rearrangement theorem states that for a conditionally convergent series (one that converges *only* when terms are added in a specific order), you can rearrange the terms to make the sum converge to *any* real number you want... *or even make it diverge to positive or negative infinity!*
  *   **The Indeterminacy:** What does this mean for the Pasadena game?
      *   If you value the outcomes in the order they happen (flip 1, then 2, then 3...), EV ≈ $0.69. Worth a small fee to play.
      *   If you could somehow group all the positive payoffs first (all odd-numbered flips), then EV → **+∞**. You'd pay any price!
      *   If you grouped all the negative payoffs first (all even-numbered flips), then EV → **-∞**. You'd pay any price to *avoid* it!
      *   You can rearrange to get EV = $100, or -$1000, or anything else.
  *   **Philosophical Verdict:** **Undefined.** There is no single, objective expected value for the Pasadena game. The value depends entirely on the arbitrary order in which you choose to consider the possible outcomes.

  **Why "Undefined" is Deeper & More Damaging than "Infinite"**

  1.  **Paralysis vs. Problem:** An *infinite* EV (St. Pete) is a problem for decision-making, but it *is* a defined value. You know the direction (infinitely good) even if the magnitude is unwieldy. An *undefined* EV (Pasadena) offers *no guidance whatsoever*. It could be infinitely good, infinitely bad, or any finite value. Standard decision theory collapses – there's nothing to maximize.
  2.  **The Order Problem:** St. Pete's issue is magnitude. Pasadena's issue is *fundamental indeterminacy* rooted in how we *define* value over infinitely many possibilities. The Riemann theorem exposes that the very act of summing the probabilities and payoffs in a specific sequence is arbitrary when conditional convergence is involved. There's no "natural" order mandated by the game structure itself that resolves this.
  3.  **Scope of Failure:** Solutions proposed for St. Pete (e.g., bounded utility, probability weighting) often tame it. These solutions *fail completely* for Pasadena. Bounding the utility doesn't resolve the indeterminacy; it just creates a different conditionally convergent series. Probability weighting doesn't change the conditional convergence property.

  **The Debate: Taming Pasadena?**

  Your source is right about the core problem, but there *are* attempts to resolve Pasadena without "rescuing" St. Pete in the same way. The debate centers on whether we can define a *unique* value for such games:

  1.  **"Relative Expectation" (Elga):** Argues that the natural order of events (flip 1, then flip 2, etc.) *is* privileged because it reflects the temporal/causal structure of the game. Thus, EV = ln(2) ≈ $0.69 is the correct value. *Critique:* This seems ad hoc. Why privilege that order for valuation? The Riemann theorem mathematically shows all orders are equally valid summations.
  2.  **"Weak Expectations" / Relative Ratios (Bartha, others):** Instead of seeking a single number, propose comparing games directly. E.g., is Pasadena better than a fixed $0.50? Analyzing the relative likelihoods of doing better/worse might give stable answers *without* assigning a unique EV. *Critique:* Avoids the indeterminacy but abandons the core idea of a quantified expected value as the sole decision criterion.
  3.  **"Finite" Interpretations / Truncation:** Acknowledge the game *in principle* has undefined EV, but argue any real-world instantiation must have a finite cutoff (nobody flips forever), making EV calculable. *Critique:* Dodges the philosophical problem of the idealized infinite case.
  4.  **The Orthodox View:** Many decision theorists (aligning with your source) argue Hájek & Nover have exposed a fatal flaw. If EV can be genuinely undefined, then EV maximization cannot be a universally applicable decision rule. It forces us to accept that some gambles fundamentally lack an expected value, and we need alternative criteria for those cases. This *is* seen as deeper damage than St. Pete's infinite value.

  **Key Distinction for Your Piece:**

  *   **St. Petersburg:** "How much is infinitely valuable worth?" (Problem of magnitude/intuition)
  *   **Pasadena:** "Does this gamble even *have* a well-defined expected value?" (Problem of existence/definition)

  **Your Honest Representation:**

  You can accurately frame it like this:

  *   The Pasadena paradox, through the lens of the Riemann rearrangement theorem, reveals a scenario where the very concept of expected value breaks down more profoundly than in the St. Petersburg paradox. While St. Petersburg yields an infinite – yet defined – value, Pasadena's expected value is fundamentally indeterminate or undefined. Some decision theorists see this as a fatal flaw for expected-value maximization as a universal principle, forcing consideration of alternative decision rules for such "pathological" games. Others propose solutions that privilege the game's natural outcome order or focus on pairwise comparisons, arguing these restore meaningful evaluation without rescuing the infinite St. Petersburg gamble in the same way. However, critics maintain these fixes are mathematically arbitrary and that Pasadena exposes a unique and deeper limitation: the potential non-existence of an objective expected value.

  The Pasadena paradox demonstrates that infinity isn't the worst thing that can happen to expected value; *indeterminacy* is. It shows that for some imaginable gambles, the core tool of rational choice theory simply doesn't deliver an answer. That's a more unsettling result for long-termist reasoning based on tiny probabilities than merely grappling with an infinitely large number.
