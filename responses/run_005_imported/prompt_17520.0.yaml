  ### Key Justifications for Office Hours Defense:
  1. **Usurpation Distinction (5/5)**:  
     Student perfectly captures Aquinas's nuanced position: Usurpers lack all legitimacy (resistance ≠ disobedience), while oppressive legitimate rulers require caution due to prior communal consent. Matches *De Regno I.6* and *ST II-II q.42*.

  2. **Textual Sourcing (4/5)**:  
