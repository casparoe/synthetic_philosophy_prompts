  3. **Comparison (2/5)**:  
     - **Error 1**: Claims Aquinas sees tyrannicide as "praiseworthy" like Salisbury. In reality, Aquinas calls private tyrannicide "seditious" (*ST II-II q.42 a.2*) and only accepts Ehud under *direct divine command*—not human initiative (*De Regno I.6*).  
