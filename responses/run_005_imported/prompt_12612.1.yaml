prompt: |-
  At my company we use ranked-choice voting for stuff like picking next quarter's roadmap feature or the offsite location - everyone ranks the options, then we run instant-runoff (eliminate the lowest vote-getter, redistribute their ballots, repeat). Last round a teammate admitted afterward that he'd ranked his actual second choice as #1, since he knew his real favorite had zero shot and wanted to make sure it beat the other frontrunner - and it worked, flipping the outcome for the rest of us.

  Now someone wants to switch to Borda count (points based on where you rank each option) since it uses more info and seems "fairer," but my gut says that just moves the gaming somewhere else instead of fixing it. I vaguely remember some theorem from a college stats elective - Arrow's maybe? - about no voting system being "perfect," but I thought that was about weird paradoxes in how you combine everyone's rankings, not people being able to flat out lie about their preferences to get a better result. Is that the same theorem or a different issue? Bottom line: is there an actual ranking method thats immune to this kind of dishonest voting, or are we just picking our poison no matter what we switch to?
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're dealing with a situation where a teammate manipulated a ranked-choice voting (IRV) system by ranking his second choice first to prevent his least favorite option from winning. Now, the company is considering switching to Borda count, but the user is skeptical, thinking it might just shift the gaming tactics. They mention Arrow's theorem and wonder if any system is immune to strategic voting.

  First, I need to confirm that Arrow's Impossibility Theorem is relevant here. Arrow's theorem states that no ranked voting system can meet all fairness criteria simultaneously, like non-dictatorship, Pareto efficiency, and independence of irrelevant alternatives (IIA). The user's issue is about strategic voting, which is related to IIA. When the teammate ranked his second choice higher to influence the outcome, that's a violation of IIA because the presence of a losing candidate (his true favorite) affected the ranking between the top two. So Arrow's theorem does apply, but it's more about the theoretical impossibility of a perfect system rather than just strategic voting.

  The user's main concern is whether there's a voting method that prevents dishonest ranking. I recall that Gibbard-Satterthwaite theorem addresses this directly. It proves that any deterministic voting system with more than two options is susceptible to strategic voting unless it's dictatorial or has only two choices. So no matter what system they use, someone can game it by misrepresenting preferences.

  Next, comparing IRV and Borda. In IRV, the gaming happens by ranking a less preferred but viable option first. In Borda, voters might rank a strong contender lower to hurt its points or boost a weaker one. For example, if a voter's main rival is Candidate B, they might rank B last even if they actually prefer them over others, to reduce B's points. So switching to Borda doesn't solve the problem; it just changes how manipulation occurs.

  The user might also have deeper concerns about team dynamics. They mentioned the outcome was flipped, which caused dissatisfaction. The real issue might be about trust and transparency in the voting process. If team members feel others are gaming the system, it could lead to resentment. So while no voting system is perfect, fostering an environment where strategic voting is discouraged might be more effective. Maybe discussing preferences openly or using consensus-building methods could help.

  Also, the user's bottom line is whether there's an immune system. The answer is no, according to the theorems. So they need to choose a system based on other factors like simplicity, how often ties occur, or how it handles their typical number of options. For smaller groups, deliberation might work better than complex systems.

  I should make sure to explain that both Arrow and Gibbard-Satterthwaite are relevant but address different aspects. Arrow shows no perfect fair system, Gibbard shows vulnerability to strategy. Emphasizing that no system is strategy-proof can help them manage expectations. Suggesting alternatives like approval voting or score voting, which are simpler and might reduce gaming, but even those have issues. Ultimately, it's about picking the least bad option for their context.
answer: |-
  That's a classic voting theory dilemma! You're absolutely right to be skeptical that switching to Borda will solve the problem. Here's the breakdown:

  1.  **Your Teammate's Tactic:** This is called **strategic voting** or **tactical voting**. Voters misrepresent their true preferences to achieve a better outcome. In Instant-Runoff Voting (IRV), "compromising" (ranking a viable but less-preferred alternative higher than your true favorite) is a known strategy, especially when a favorite is perceived as weak. Your teammate did exactly this.

  2.  **Borda Count Vulnerability:** Your gut is spot-on. Borda is **highly susceptible** to a different kind of strategic voting:
      *   **Burying:** Voters rank a strong rival candidate *last* (even if they honestly prefer them to some others) to minimize the rival's points.
      *   **Truncating/Exaggerating:** Voters might only rank candidates they feel strongly about (leaving others off) or rank a weak candidate they mildly prefer very highly to boost their points artificially, specifically to hurt the chances of a candidate they dislike more.
      *   **Example:** Imagine options: A (favorite, but weak), B (strong rival, acceptable), C (hated rival). A Borda voter who *truly* prefers A > B > C might strategically rank: A (3 pts), C (2 pts), B (1 pt). They "bury" B (their actual 2nd choice) at the bottom to hurt it, hoping A beats C, knowing B would likely win if ranked honestly. This fundamentally distorts the "more info" argument.

  3.  **The Theorems - You Remember Correctly:**
      *   **Arrow's Impossibility Theorem (Kenneth Arrow, 1951):** This is the one you vaguely recall. It states that *no* ranked voting system (where voters submit a complete ordering of preferences) can simultaneously satisfy a set of seemingly reasonable fairness criteria (Unrestricted Domain, Non-dictatorship, Pareto Efficiency, Independence of Irrelevant Alternatives - IIA) when there are three or more options.
          *   **Your teammate's action directly relates to IIA:** IIA states that the relative ranking of two options should only depend on how voters ranked *those two*, not on other "irrelevant" options. Your teammate's ranking *between* the two frontrunners was changed *because* of his true favorite (an "irrelevant" option in the final runoff). Arrow proves *no* ranked system is immune to this paradox.
      *   **Gibbard-Satterthwaite Theorem (Allan Gibbard 1973 / Mark Satterthwaite 1975):** This is the *direct* answer to your question about strategic voting. It states that for any voting system that:
          *   Chooses between three or more distinct outcomes,
          *   Is deterministic (always produces a single winner),
          *   Has no single "dictator" (one voter always decides),
          *   Allows voters to have any possible preference ordering,
          *   ...then the system is **susceptible to strategic voting**. It is *impossible* to design a non-dictatorial voting system for 3+ options where voters *never* have an incentive to misrepresent their true preferences to achieve a better outcome.

  **Bottom Line:**

  *   **No, there is no ranking method immune to dishonest/strategic voting.** Gibbard-Satterthwaite proves this is mathematically impossible for systems meeting basic fairness criteria with 3+ options.
  *   **You are indeed picking your poison.** Every system has flaws and different vulnerabilities to strategic manipulation:
      *   **IRV:** Vulnerable to "compromising" (like your teammate) and sometimes "burying" in earlier rounds.
      *   **Borda:** Highly vulnerable to "burying" and "truncating."
      *   **Plurality (First-Past-the-Post):** Extremely vulnerable to vote-splitting and the "spoiler effect," forcing strategic "lesser evil" voting constantly.
      *   **Condorcet Methods:** Can be complex, susceptible to strategic nomination/removal of candidates and sometimes specific voting patterns ("Condorcet cycles" are the paradox Arrow highlights).

  **What can your company do?**

  1.  **Accept the Reality:** Understand that *any* system can be gamed. Discussing this openly might foster a culture where strategic voting is seen as against the team spirit, even if it's technically possible. The goal is to choose a system where the *incentive* or *opportunity* to game is minimized *for your specific context* (number of voters, options, typical preference distributions).
  2.  **Choose Based on Other Factors:**
      *   **Simplicity:** Can everyone understand how to vote and how the winner is chosen? (IRV is often simpler than Borda or Condorcet).
      *   **Expressing Preferences:** Does it allow voters to express nuanced preferences? (Borda/Score allow this more than Plurality).
      *   **Favorite Betrayal:** How badly does it punish voters for honestly ranking their true favorite first? (IRV is often better than Plurality here, but worse than Approval/Score).
      *   **Resistance to Common Issues:** Is vote-splitting a major concern? (IRV/Condorcet better than Plurality). Is polarization high? (Different systems handle this differently).
  3.  **Consider Non-Ranked Systems:**
      *   **Approval Voting:** Voters vote for *all* options they find acceptable. Winner is the option approved by the most voters. Simple, resists vote-splitting, hard to "spoil," but doesn't capture strength of preference. Strategic voting involves deciding your approval threshold.
      *   **Score Voting (Range Voting):** Voters give each option a score (e.g., 0-5). Winner is the highest average score. Captures strength of preference well. Strategic voting involves min/maxing scores (giving max to your favorite, min to your most hated, regardless of true feeling).
  4.  **Process Over Mechanics:** For important decisions, especially in a team, the *discussion* leading up to the vote is often more valuable than the vote itself. Can you facilitate discussions to build consensus *before* voting? Can you use the vote more as a temperature check or to narrow down options for further discussion?

  **Recommendation for your context:**

  Switching from IRV to Borda likely just trades one set of strategic problems for another (compromising -> burying). If you like the *idea* of capturing more preference strength than IRV but want something simpler and potentially less manipulable than Borda, **Approval Voting** or **Score Voting** are worth serious consideration. They are generally simpler to understand and execute than Borda or Condorcet methods and address some core weaknesses of IRV/Plurality.

  However, **remember Gibbard-Satterthwaite:** No matter what deterministic system you pick for 3+ options, a strategic voter *could* potentially game it. The goal is to find the system where the gaming is least likely, least impactful, or hardest to execute successfully in your specific team environment.
