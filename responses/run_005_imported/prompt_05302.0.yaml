  At move 6, the pot has been doubled five times (since each pass doubles and hands over). But note: the pot starts at $1.

  After move 1 (if A passes): pot becomes $2 (then B moves at move 2).
  After move 2 (if B passes): pot becomes $4 (then A moves at move 3).
  After move 3 (if A passes): pot becomes $8 (then B moves at move 4).
  After move 4 (if B passes): pot becomes $16 (then A moves at move 5).
  After move 5 (if A passes): pot becomes $32 (then B moves at move 6).

  At move 6, if B takes, B gets 3/4 * 32 = $24, and A gets $8. If B passes, the game ends and they split $32 evenly, so each gets $16. So indeed, B would prefer to take (24>16).

  Now at move 5: A can take and get 3/4 of the current pot (which is $16) -> $12. If A passes, then the pot becomes $32 and then B takes at move 6, leaving A with only $8 (since A gets 1/4 of $32? Wait, no: when B takes at move 6, B gets 3/4 and A gets 1/4, so A gets $8). So A, by passing, gets $8, but by taking gets $12. So A should take at move 5.

  At move 4: B's turn. The pot is $8 (because it was doubled three times: after A passed at move 1, B passed at move 2, A passed at move 3, so now at move 4 the pot is $8). If B takes, B gets 3/4 * 8 = $6. If B passes, the pot doubles to $16 and then A will take at move 5 (as we just decided). If A takes at move 5, then B (who passed at move 4) will get 1/4 of the pot at move 5? No: when A takes at move 5, the pot is $16, A takes 3/4 ($12) and B gets 1/4 ($4). So if B passes at move 4, then B ends up with $4. But if B takes at move 4, B gets $6. So B should take at move 4.

  But the classmate says the reasoning iterates back and A takes at move 1. Let's check move 4: we just saw that B should take at move 4. Then at move 3: A's turn. The pot is $4 (doubled twice: after A passed at move1 and B passed at move2). If A takes, A gets 3/4 of $4 = $3. If A passes, then the pot becomes $8 and then B will take at move4, leaving A with 1/4 of $8 = $2. So A should take at move3.

  At move2: B's turn. The pot is $2 (because A passed at move1). If B takes, B gets 3/4 of $2 = $1.5. If B passes, the pot becomes $4 and then A will take at move3, leaving B with 1/4 of $4 = $1. So B should take at move2.

  At move1: A's turn. The pot is $1. If A takes, A gets $0.75. If A passes, then the pot becomes $2 and then B will take at move2, leaving A with 1/4 of $2 = $0.5. So A should take at move1.

