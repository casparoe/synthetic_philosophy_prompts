  Part (a) asks for the backward induction solution and the outcome.

  The classmate's answer for (a) correctly identifies that at move 6, B should take (since 3/4 > 1/2). Then at move 5, A should take because if A passes, then B will take at move 6, leaving A with only 1/4 of the doubled pot (which is less than taking 3/4 of the current pot at move 5). This reasoning then propagates back to move 1: A takes immediately.

  The outcome is correct: A takes on the first move, so the pot is $1, A gets $0.75 and B gets $0.25.

  However, note that the centipede game described has six moves. Let's label the moves:

  Move 1: A
  Move 2: B
