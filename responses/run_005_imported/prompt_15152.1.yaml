  Hmm, I need to recall Condorcet's key ideas. His jury theorem states that under certain conditions, a group's decision is more likely to be correct than an individual's. The critical assumptions are voter independence and competence above 50%. But futarchy replaces voting with betting markets. Traders aren't voting on what's best; they're betting on outcomes based on policies.

