  ...Did I just sketch an answer in my head? Let me structure it: first unpack the regress, then explain why vicious, then separate the two questions about eternalism. Keep it conversational - he's clearly enjoying the intellectual tussle. That "midlife crisis" line deserves a warm response.
answer: |-
  Ah, the joys of McTaggart's regress! It's a wonderfully slippery argument that's been tripping people up for over a century. Let's break down the viciousness and its implications, keeping your physics background in mind.

  **1. McTaggart's Core Argument & The Alleged Vicious Regress:**

  Here's the step-by-step logic, highlighting the regress and why it's considered vicious:

  1.  **Incompatibility:** Past, present, and future are mutually exclusive properties ("determinations"). An event cannot be past *and* present *and* future *at the same time*. (This seems undeniable).
  2.  **Universality:** Yet, *every* event possesses *all three* determinations: it *will be* future, it *is* present, it *has been* past. (This also seems undeniable as a description of temporal passage).
  3.  **The Initial Contradiction:** (1) and (2) appear directly contradictory. How can something have incompatible properties?
  4.  **The "Obvious" Resolution:** We resolve this apparent contradiction by *indexing* the properties to different times: "Event E *is present* (at time T1)", "Event E *is past* (at time T2)", "Event E *is future* (at time T3)". At *any single time* (say T1), E only has one determination (present), satisfying (1). Over different times, it has all three, satisfying (2). Problem solved? McTaggart says **no**.
  5.  **The Regress Begins:** To say "E *is past* at T2" introduces a *new* temporal location (T2) where this fact holds. But what is the temporal status of *T2 itself*? At T2, the fact "E is past" *is present*. But if we consider a *later* time T3, then *at T3*, the fact "E is past at T2" is *itself* past! So now we have:
      *   "The fact 'E is past at T2' *is present* (at T2)".
      *   "The fact 'E is past at T2' *is past* (at T3)".
  6.  **The Viciousness:** We now have **the exact same problem** we started with, but shifted up one level! We have incompatible temporal determinations ("present" and "past") applied to the *same fact* ("E is past at T2"). To resolve *this* new contradiction, we are forced to index *these* determinations to yet *another* set of times (T2a, T3a...):
      *   "The fact 'The fact 'E is past at T2' is present' *is present* (at T2a)".
      *   "The fact 'The fact 'E is past at T2' is present' *is past* (at T3a)".
  7.  **Ad Infinitum:** This process repeats endlessly. For *every* level of temporal indexing we introduce to resolve the contradiction at the previous level, we generate a *new* instance of the same contradiction at the new level.

  **Why is THIS Regress Vicious?**

  *   **Failure to Resolve:** Unlike benign mathematical regresses (e.g., defining a set containing itself, or certain recursive functions), this regress **fails to actually resolve the original contradiction**. At *no level* do we achieve a consistent, non-contradictory description of temporal reality. The contradiction is merely pushed up to the next meta-level, forever.
  *   **Explanatory Bankruptcy:** The regress is generated *because* the initial move (indexing to times) doesn't *solve* the problem; it just *relocates* it. Since the relocated problem is identical in structure to the original, it demands the same solution (more indexing), which again just relocates it further. It's an explanatory dead end. Nothing is ever *made consistent*; the inconsistency is just endlessly deferred. Think of it as trying to explain why a building stands by saying it rests on another building, which rests on another, and so on, *ad infinitum*, without ever reaching bedrock. The explanation fails because stability is never achieved.
  *   **Circularity/Question-Begging:** Each step in the regress *presupposes* the very temporal relations (past/present/future distinctions indexed to times) that it's *trying* to use to ground and explain temporal passage. It assumes the reality of time (in the A-series sense) to explain the reality of time, but does so in a way that constantly reveals inconsistency.
  *   **Contradiction Proliferation:** Instead of eliminating the contradiction, the regress *multiplies* it. We end up with an infinite hierarchy of contradictory temporal facts, not a resolution.

  **Analogy:** Imagine trying to define the word "word" solely using other words. You might say "a word is a unit of language." But then you need to define "unit," "language," etc. This regress *can* be benign if you eventually ground it in something non-linguistic (like pointing, or primitive concepts). McTaggart argues that with the A-series, there *is* no non-temporal "grounding" available – every attempt to ground it *uses* the temporal notions that are causing the contradiction, hence the viciousness.

  **2. Implications for Presentism, Eternalism, and McTaggart's Own View:**

  *   **Presentism:** Presentism is **utterly devastated** by McTaggart's argument *if it accepts the reality of temporal passage (A-series change)*. Presentism *requires* a robust, objective "now" that moves, making events future, then present, then past. McTaggart argues this very notion is fundamentally contradictory and leads to vicious regress. There *is* no coherent way for "now" to move or for events to genuinely change their A-series properties without falling into the regress. Presentism, as typically understood (involving genuine temporal passage), is McTaggart's primary target.
  *   **Eternalism (Block Universe / B-Series):** This is where it gets interesting and why there's confusion.
      *   **McTaggart Attacks Eternalism Too:** McTaggart doesn't stop at the A-series. He argues that the B-series (earlier-than/later-than relations) is *also* insufficient and ultimately unreal *on its own*. His reasoning (less famous than the A-series regress) is roughly: B-series relations require change. But the only change possible in a pure B-series is objects having incompatible properties at different times (e.g., the butter being hard at T1 and soft at T2). McTaggart argues this isn't *genuine* change; it's just a static fact *about* the butter at different temporal locations. Without the *passage* of time (the changing "now" marking events as *becoming* past), there is no real change, only static difference. Since McTaggart believes time requires change, and the B-series cannot provide genuine change without smuggling in the A-series (which is contradictory), the B-series is also unreal. **His ultimate conclusion is that *time itself is unreal*.** Both series fail.
      *   **Why Eternalists Cite McTaggart:** Eternalists enthusiastically embrace McTaggart's *critique of the A-series and temporal passage*. They agree that the "moving now" and changing A-properties lead to contradiction and incoherence. They see his argument as a powerful weapon *against presentism and dynamic theories of time*. They then argue that the *B-series alone* is sufficient for a coherent metaphysics of time. They *reject* McTaggart's additional step that the B-series requires genuine change (passage) and is therefore also unreal. For the eternalist, the static differences captured by the B-series *are* what change fundamentally *is*; there is no need for an extra "flow." They bite the bullet on McTaggart's claim about the lack of "genuine" change in the block universe.
  *   **McTaggart's Own Position:** He is **not** on the eternalist team. He is on team "Time is an Illusion." He uses the A-series regress to destroy the dynamic view, then uses the insufficiency of the B-series (without passage) to destroy the static view. His target is time *itself*.

  **Your Key Insight is Correct:**

  > "does it just as easily undercut the block-universe/B-series picture too... That last bit trips me up because half the eternalism-leaning stuff I've read cites McTaggart like he's on their team."

  **Exactly.** You've nailed the tension. Eternalists are absolutely right to use McTaggart's powerful argument *against the A-series and temporal passage*. That argument is widely seen as devastating to presentism/dynamism. **However, they conveniently ignore or reject McTaggart's *second* move against the B-series.** They accept the block universe *despite* McTaggart's claim that it lacks genuine change and is therefore also inadequate. McTaggart himself would say the eternalists have merely traded one unreal abstraction (the flowing A-series) for another (the static, changeless B-series).

  **In Summary:**

  1.  **Vicious Regress:** McTaggart's regress is vicious because it fails to resolve the core contradiction of events having incompatible A-properties; it endlessly defers and multiplies the contradiction without providing a stable, consistent foundation. It's explanatory bankruptcy.
  2.  **Impact on Presentism:** If presentism requires genuine A-series passage (as it usually does), McTaggart's argument is potentially fatal.
  3.  **Impact on Eternalism:** McTaggart *intended* his argument to destroy eternalism/B-series too, by arguing it lacks genuine change. Eternalists embrace the *first part* (critique of A-series/passage) but reject the *second part* (critique of B-series/static change). They cite him for the demolition job on their rivals, not for his own positive (negative) conclusion.
  4.  **McTaggart's Goal:** To demonstrate the unreality of time *in toto*.

  It's a fascinating, frustrating argument. Its power against the A-series is hard to deny, making it a cornerstone for eternalism. Whether his final step against the B-series succeeds is where the real philosophical battle continues. Enjoy the rabbit hole – trading superconductors for temporal metaphysics is a worthy midlife (or post-career) crisis! Your unease with a universal "now" in relativity is precisely the intuition that makes eternalism appealing to many physicists grappling with McTaggart.
