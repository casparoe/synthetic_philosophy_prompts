prompt: |-
  Funny timing: I'm teaching a graduate seminar on the philosophy of promising this term, and now I've actually got a live case in my own department instead of just thought experiments. Short version: our hiring committee had a candidate everyone loved, and back in Febuary our chair told her, over email, something like "the offer is basically finalized at this point, HR just needs to process it, so please don't accept anything else." Nothing was ever signed. She took it at her word anyway, turned down a competing tenure-track offer at another school, and told her current chair she was resigning effective this summer. Two weeks ago the dean's office froze the line because of a sudden budget shortfall, so there is no position to actually give her, and I think our chairs quietly hoping the whole situation just goes away on its own.

  I've been put on a small ad hoc committee that has to bring the dean a recommendation on what, if anything, the department owes this candidate, given that nothing was ever a legally binding contract. I don't want to show up with "well, it feels bad, so we should do something" -- I want to circulate an actual memo beforehand that recommends a concrete course of action (money, a standing offer for next cycle, whatever you think is defensible) with a rough timeframe attached, but that grounds the recommendation in a real answer to why an unwritten assurance like that generates any obligation in the first place. Is the source of the obligation the reliance we invited her to place on our word, some kind of convention about how hiring committees are understood to talk, something closer to Scanlon's assurance-based story, or does it actually matter that it was an institution and not a single person doing the "promising"? And please don't hand me the version that flatters us -- two people on this committee are going to argue, seriously, that a sincere apology is the entire extent of what we owe her, and the memo needs to engage that position honestly rather than wave it away.
reasoning: |-
  Okay, let me start by unpacking the user's situation. They're dealing with a hiring mess where a candidate was verbally assured a job, turned down other offers, and now the position is gone due to budget cuts. The user needs to justify why the department owes this candidate more than just an apology, despite no legal contract.

  First, I recall that in philosophy, promising creates obligations even without formal contracts. Think Scanlon's Principle F: when you lead someone to expect something and they rely on that to their detriment, you have a duty to make it right. That seems relevant here. The chair's email clearly told the candidate not to accept other offers, which invited reliance.

  Then there's the institutional angle. The chair represented the department, so the institution bears responsibility. The candidate's reliance was reasonable because hiring committees usually have the authority to make such assurances. The department's reputation is also at stake—future candidates might not trust them if they don't handle this well.

  The user mentioned colleagues arguing that only an apology is needed. I need to counter that. The harm here isn't just hurt feelings; the candidate lost a tenure-track position. Turning down another offer is a significant financial and career loss. An apology doesn't fix that. Plus, the department benefited from the candidate's reliance by keeping her from taking another job.

  Concrete actions are necessary. Compensation for financial losses, a written commitment for the next hiring cycle, and possibly a one-time payment for goodwill. The memo should present these as the minimum to rectify the harm and restore trust. The user needs a strong, philosophically grounded argument to convince the committee, especially those resistant to more than an apology.
answer: |-
  This is a philosophically rich and ethically urgent case. Let's break down the obligation, counter the "apology-only" position, and propose concrete remedies grounded in principle. Here's a framework for your memo:

  **Core Argument: The Obligation Arises from Induced Detrimental Reliance + Institutional Assurance**

  1.  **The Nature of the Assurance:** The Chair's email ("offer finalized," "HR just processing," "don't accept anything else") wasn't mere optimism or prediction. It functioned as an **institutional assurance**, performing the core speech act of promising: creating an expectation of future performance and inviting reliance. Crucially, it was made by an agent (Chair) with ostensible authority to speak for the department/university in hiring matters.

  2.  **The Source of Obligation (Why Apology Isn't Enough):**
      *   **Scanlon's Principle F (Fidelity):** This is highly applicable. By making this assurance, the department invited the candidate to form expectations about their future actions and to rely on them. The candidate *did* rely, significantly and foreseeably (turning down a competing TT offer, resigning her current position). The department *benefited* from this reliance (keeping her available). The harm caused by reneging (loss of career opportunity, financial security, reputational damage) is severe. Principle F dictates that breaking an assurance causing such foreseeable, invited, and detrimental reliance creates a strong obligation to prevent or mitigate the harm caused. An apology does nothing to mitigate the concrete harm.
      *   **Reliance-Based Obligations (Fuller, Atiyah):** Even absent a formal contract, inducing detrimental reliance creates an obligation. The department *knew or should have known* their assurance would trigger life-altering decisions. The candidate's reliance was reasonable given the Chair's position and the specificity of the assurance ("don't accept anything else"). The resulting harm demands rectification beyond regret.
      *   **Institutional Authority & Convention:** The Chair spoke *as* the Chair, invoking the understood conventions of academic hiring. Candidates reasonably interpret such definitive statements from a department head as binding institutional commitments, pending only formalities. The institution, through its agent, created this expectation and must bear the responsibility when its representations fail. The obligation attaches to the *institution*, not just the individual Chair.

  3.  **Countering the "Sincere Apology is Sufficient" Position:**
      *   **Trivializes Harm:** This position ignores the *material and professional devastation* inflicted: loss of a specific tenure-track opportunity, potential career derailment, financial instability from unexpected unemployment, reputational harm with her former institution, and significant emotional distress. An apology addresses none of this.
      *   **Ignores Induced Reliance:** It dismisses the fact that the department *deliberately induced* the candidate to take irrevocable actions based on their word. The harm was *foreseeable and invited*.
      *   **Moral Hazard:** Accepting this sets a dangerous precedent, signaling that the institution can make high-stakes assurances with impunity, eroding trust essential for academic hiring and collegiality.
      *   **Fails Scanlon/Reliance Tests:** An apology fails the core requirement of Principle F and reliance theory: preventing or mitigating the *harm caused by the broken assurance*. It's performative, not remedial.
      *   **Institutional Bad Faith:** Hoping the situation "goes away" compounds the original wrong. It demonstrates a lack of seriousness about the harm caused by the institution's own actions.

  **Concrete Recommendations & Rationale:**

  Based on the obligation to mitigate the severe harm caused by the broken institutional assurance and induced detrimental reliance:

  1.  **Immediate Financial Compensation (Priority):**
      *   **Rationale:** Directly addresses the most immediate, tangible harm: loss of income and benefits she *would have earned* had the promise been kept. This is the minimum recognition of the economic reliance damage.
      *   **Recommendation:** Calculate the full salary (plus estimated benefits/retirement contributions) for the first year of the promised appointment (e.g., 9-month salary for a TT position). Offer this as a one-time, non-conditional payment. *Timeframe: Offer made within 2 weeks.*
      *   **Why this, not less?** Partial compensation acknowledges fault but fails to cover the basic economic loss she incurred *because* she relied on *your* word. A "stipend" feels like charity, not obligation. Full year's salary recognizes the totality of the lost annual position.

  2.  **Written, Priority Hiring Commitment:**
      *   **Rationale:** Addresses the unique opportunity cost: she lost *a specific tenure-track offer* based on your assurance. Compensation helps financially, but only a *real job offer* can truly attempt to restore her career trajectory to where it would have been absent your breach. This fulfills the spirit of the original promise as much as possible now.
      *   **Recommendation:** A formal letter signed by the Dean and Chair, stating:
          *   An unambiguous apology acknowledging the broken assurance and harm caused.
          *   A guarantee that the *next available* tenure-track line in her field within the department will be offered to her, without requiring a full national search.
          *   The offer will be made at the rank and salary level originally intended (adjusted for standard annual increases).
          *   If she accepts, the standard tenure clock will start upon appointment.
          *   This commitment is binding for [e.g., 3] hiring cycles, starting immediately with the next available line.
      *   **Timeframe:** Letter drafted, vetted by legal counsel (for enforceability), and presented alongside the compensation offer within 2 weeks. The offer activates automatically with the next relevant TT line opening.

  3.  **Optional: Goodwill Gesture (If Feasible):**
      *   **Rationale:** Acknowledges non-economic harm (stress, reputational damage) and demonstrates seriousness beyond bare minimum.
      *   **Recommendation:** Offer access to department resources for the coming academic year (library, seminars, potential adjunct teaching *if mutually desired*, office space if available) to provide stability and maintain connection. *Timeframe: Offered concurrently with #1 & #2.*

  **Why This Package is Defensible & Necessary:**

  *   **Proportionate to Harm:** It directly addresses the core economic loss (salary) and the unique career opportunity loss (priority hire), the two primary harms flowing from the reliance.
  *   **Fulfills Remedial Duty:** It actively works to *mitigate* the damage caused by the broken promise, going far beyond mere expression of regret (Scanlon, Reliance Theory).
  *   **Upholds Institutional Integrity:** Demonstrates the institution takes its word and its role in the academic ecosystem seriously. Failing to do so damages reputation and trust, impacting future hiring.
  *   **Practical & Actionable:** Provides clear, concrete steps with defined timeframes.
  *   **Balanced:** While costly, it avoids open-ended commitments (e.g., salary indefinitely) and ties the priority hire to the *next available* line, respecting future departmental needs.

  **Memo Structure Suggestion:**

  1.  **Summary of Facts:** Brief, neutral recounting.
  2.  **Statement of Ethical Problem:** Framed as institutional broken assurance causing severe detrimental reliance.
  3.  **Analysis of Obligation:** Draw on Scanlon (Principle F), Reliance Theory, Institutional Authority. Explicitly refute "apology-only" position by showing it ignores harm and the nature of induced reliance.
  4.  **Recommendations:** Clearly list the 3 proposals (with #3 optional), including rationale and timeframe for each.
  5.  **Conclusion:** Emphasize that this is the minimum required to meet the moral obligation arising from the department's actions and to begin restoring institutional credibility. Argue that the cost of inaction (reputational damage, potential legal action despite no contract, moral failing) far exceeds the cost of these remedies.

  This approach provides the philosophical grounding you seek while forcing the committee to confront the real-world consequences of their (institution's) broken word and the inadequacy of mere apology. Good luck navigating this difficult situation – it's a powerful real-world test of the principles you're teaching.
