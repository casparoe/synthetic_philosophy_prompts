answer: |-
  Here are 10 interview questions designed to probe the core tenets of your guest's "standing to blame" view, incorporating your specific requests and anticipating likely rebuttals with follow-ups:

  1.  **Core Analogy Challenge:** "You lean heavily on the 'unclean hands' doctrine as an analogy to secure the distinction between the *warrant* of a moral verdict (its truth) and the *standing* to deliver it via blame. But legal doctrines like unclean hands operate within a specific institutional framework with defined authorities, procedures, and remedies. Moral blame, however, is a pervasive, informal social practice. Doesn't importing this analogy risk simply *relocating* the puzzle: instead of explaining *why* hypocrisy undermines standing in the moral context, it just asserts 'it works like this legal doctrine'? How does the analogy *explain* the moral phenomenon rather than just *label* it?"
      *   *Likely Reply/Follow-Up:* If she emphasizes the *underlying principle* of fairness/equity common to both law and morals: "Granted there's a shared principle of fairness. But doesn't the *specific mechanism* of 'forfeiture of standing' in the moral case still need independent justification? Why is hypocrisy the specific act that triggers this forfeiture in the moral sphere, analogous to the specific misconduct that triggers unclean hands in equity? Is 'unclean hands' doing explanatory work, or is it just a compelling metaphor?"

  2.  **The Unamended Reformee:** "Consider a person who committed significant wrongs in their past (say, serious dishonesty), has genuinely repudiated that conduct, reformed their character, and lives virtuously now *regarding that norm*, but has *never made amends* to those they wronged (perhaps they are unknown, deceased, or reconciliation is impossible). Does this person have standing to blame others for dishonesty? They aren't currently hypocritical *in action*, but they still arguably benefit from their past wrongs or haven't fully rectified the imbalance."
      *   *Likely Reply/Follow-Up:* If she argues internal reform is sufficient for standing regarding *that norm now*: "But doesn't your view emphasize the *relational* aspect of standing – the presupposed equality? If the unamended wrongdoer hasn't addressed the specific relational debts created by *their own* violation of the norm, how can they stand as an *equal* with clean hands when addressing *another's* violation? Doesn't the lack of amends leave a lingering stain on their *specific standing* regarding that norm?"

  3.  **Norm Contamination (Bleed):** "Your view focuses on hypocrisy regarding the *specific* norm being violated by the blamed person. But what about *unrelated* norms? If someone is a notorious hypocrite regarding norm A (e.g., dishonesty – they lie constantly but condemn lying), does this forfeit their standing *only* to blame violations of A, or does it also bleed over and forfeit their standing to blame violations of a completely unrelated norm B (e.g., cruelty – condemning someone for being cruel)? Does hypocrisy poison the well of their moral authority entirely?"
      *   *Likely Reply/Follow-Up:* If she argues standing is norm-specific: "But doesn't hypocrisy, especially pervasive hypocrisy, fundamentally undermine the *general* credibility and good faith required for *any* act of moral address? If someone consistently demonstrates bad faith regarding moral norms through hypocrisy, why should we grant them the presupposition of equal standing *in any* moral confrontation, regardless of the specific norm? Doesn't their character cast doubt on their sincerity *across the board*?"

  4.  **The Overdemandingness/Universality Problem:** "If the hypocrisy bar is set sufficiently high or interpreted broadly, it seems virtually *everyone* has violated *some* norm they might wish to blame others for violating (e.g., minor dishonesty, unkindness, rule-bending). Doesn't this risk making standing to blame vanishingly rare or even impossible, collapsing into a kind of universal moral silence? How do you avoid this consequence without rendering the hypocrisy condition trivial or toothless?"
      *   *Likely Reply/Follow-Up:* If she appeals to proportionality, current commitment, or the *seriousness* of the hypocrisy: "Doesn't this move risk significant vagueness? Who decides what counts as 'serious enough' hypocrisy or 'sufficient' current commitment? If minor past hypocrisy *doesn't* forfeit standing, doesn't that open the door to charges of arbitrariness? And if it *does* forfeit standing for minor norms, doesn't the universality problem remain potent for those norms?"

  5.  **The Scope of "Unwilling to Extend":** "Your core condition involves the hypocrite being 'unwilling to extend' the norm to themselves. How do you parse 'unwilling'? Does it require *conscious* double standards, or can it include *akrasia* (weakness of will) – knowing the norm applies but failing anyway? What about cases of genuine moral *ignorance* or *mistake* at the time of one's own violation, later corrected? Does that still constitute the relevant unwillingness?"
      *   *Follow-Up Focus:* Probe the role of *intention* and *awareness* in defining the hypocrisy that forfeits standing.

  6.  **Addressing the Tu Quoque Charge Directly:** "Critics might concede your view distinguishes *standing* from *warrant* conceptually but argue that *in practice*, pointing out the blamer's hypocrisy (the tu quoque) inevitably functions to shift focus *away* from the original wrongdoer's conduct and onto the blamer's faults, thereby undermining the *force* or *reception* of the warranted blame, regardless of its theoretical standing. How does your account prevent the 'unclean hands' defense from being practically equivalent to an ad hominem distraction in moral discourse?"
      *   *Follow-Up Focus:* How the theory prescribes *responding* to the standing challenge without derailing the moral conversation about the original act.

  7.  **Third-Party Standing & Collective Hypocrisy:** "Does your account primarily concern direct address between wrongdoer and hypocrite? What about third-party blamers? If I blame X for cruelty, but *you* (a third party) are a hypocrite about cruelty, does *your* hypocrisy affect *my* standing to blame X? Furthermore, how does the view handle cases of *collective* or *systemic* hypocrisy (e.g., a society condemning a practice it widely tolerates or benefits from)? Who, if anyone, retains standing in such contexts?"
      *   *Follow-Up Focus:* The theory's applicability beyond simple dyadic interactions and its handling of diffuse responsibility.

  8.  **The Nature of "Equal Standing":** "You state blame presupposes 'equal standing.' Can you elaborate on the specific *kind* of equality required? Is it equality of moral record (clearly not, as the blamed has just violated a norm)? Equality of inherent moral worth (which presumably remains)? Or equality specifically regarding *adherence to the norm in question* at the *time of address*? How does hypocrisy violate *this specific type* of equality?"
      *   *Follow-Up Focus:* Precise definition of the equality presupposition and how hypocrisy uniquely violates it compared to other moral faults.

  9.  **Reformed Hypocrite & Retrospective Blame:** "Imagine someone who *was* hypocritical about norm N in the past (condemning others while violating it themselves) but has since genuinely reformed, holds themselves accountable for their past hypocrisy, and now consistently adheres to N. Do they regain standing to blame *current* violations of N? Do they have standing to blame *past* violations of N that occurred *during* their own period of hypocrisy? What about blaming someone *else's* past hypocrisy regarding N?"
      *   *Follow-Up Focus:* The permanence/revocability of standing forfeiture and its application across time.

  10. **Falsifiability & Limits:** "This is a rich and nuanced view. To help us understand its boundaries: what kind of real or hypothetical case would you consider a genuine counterexample – evidence *against* your core thesis that hypocrisy is a necessary bar to standing for blame? Not just a case your view can *explain*, but one that, if convincing, would lead you to significantly revise or abandon the claim that hypocrisy *forfeits* the standing presupposed by blame?"
      *   *Crucial Follow-Up:* If she struggles or provides an example she then explains away: "If every apparent counterexample can be absorbed by adjusting auxiliary assumptions (about the nature of hypocrisy, the relevant norm, the timing, etc.), does that risk making the core claim unfalsifiable? How do we distinguish a robust theory from one that's simply flexible enough to accommodate any objection?"

  **Key features of this set:**

  *   **Goes Beyond Restatement:** Questions 1, 3, 4, 5, 6, 8, and 10 directly challenge core mechanisms, implications, or foundations.
  *   **Addresses Your Specifics:** Questions 1 (Analogy), 2 (Reformed/Unamended), 3 (Bleed), and 4 (Universality) directly tackle your requested angles.
  *   **Anticipates Parries:** Each core question has a specific follow-up designed to push back on the most obvious or likely initial defense.
  *   **Targets Coherence & Limits:** Questions probe internal consistency (5, 8, 9), scope (7), practical implications (6), and crucially, falsifiability (10).
  *   **Progressive Depth:** The questions build from challenging the analogy to probing specific cases, broader implications, and finally, the theory's testability.

  Remember to listen actively and be prepared to adapt the follow-ups based on her *actual* responses, not just the predicted ones. Good luck with the episode – it sounds fascinating!
