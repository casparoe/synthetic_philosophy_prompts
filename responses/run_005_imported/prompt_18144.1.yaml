  **Solid Comeback for Derek?**
  Derek could potentially respond to Maya's last point by arguing that even if perfect rectification is impossible, we should still strive to minimize interference with voluntary transactions and only rectify in cases of clear and recent injustices. He might say that the burden of proof is on those who want to redistribute to show that there is a specific injustice to rectify, rather than imposing a patterned principle. This would shift the focus from the impossibility of perfect rectification to the presumption in favor of liberty and the existing distribution. However, this comeback is not without its own challenges and might not fully overcome Maya's critique.

  Alternatively, Derek could argue that the practical difficulties of rectification do not invalidate the theoretical point. The Chamberlain example still shows that liberty is at odds with patterns, and in the absence of clear evidence of injustice, we should not interfere. But Maya might counter that without rectification, we cannot assume the baseline is just.

  In essence, Derek's best comeback would be to emphasize that the entitlement theory provides a framework for justice that respects liberty and that we should do our best to rectify known injustices without resorting to patterned principles. However, the practical challenge remains.
