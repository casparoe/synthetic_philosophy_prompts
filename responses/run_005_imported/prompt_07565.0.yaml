  First, Sidgwick's philosophical dilemma is key. In "Methods of Ethics," he concluded that ethics and self-interest don't naturally align. Without a moral universe, rational people might choose self-interest over duty. This created a deep discomfort. His psychical research wasn't a hobby but an existential quest for evidence of a moral cosmos—something like an afterlife would prove universal justice.

  His rigorous methodology is significant. Sidgwick applied the same intellectual standards to psychical research as to ethics. He investigated mediums, tested telepathy, and demanded evidence. Yet, after 20 years, he remained unconvinced but open. Why? The evidence wasn't conclusive enough to dismiss or confirm. His agnosticism stemmed from epistemic humility—recognizing the limits of current knowledge.

  Now, modern implications: How should evidence-based thinkers handle today's fringe claims? Sidgwick's approach offers lessons. First, the motivation behind such inquiries matters. Are researchers seeking existential answers, or purely truth? Sidgwick's need for cosmic justice drove him, which is a bias. Modern researchers must acknowledge their own motivations. 

  Second, methodological rigor. Sidgwick didn't lower his standards. Today, fields like parapsychology often face criticism for poor methodologies. Applying stringent, repeatable experiments is crucial. However, some phenomena are inherently hard to replicate. Near-death experiences (NDEs) are spontaneous and unpredictable. So, how do we study them without compromising rigor? Maybe through large-scale, multi-disciplinary approaches, but that's challenging.

  Third, the burden of proof. Sidgwick's agnosticism highlights that absence of evidence isn't evidence of absence. For modern claims, extraordinary evidence is still required, but dismissing them outright might be premature. It's about balancing skepticism with openness to future evidence. 

  Fourth, the role of humility. Sidgwick accepted that some questions might remain unanswered with current tools. Modern science, with advanced tech, might revisit these questions. For instance, NDE research using brain monitoring during cardiac arrest. Yet, interpreting such data is complex. 

