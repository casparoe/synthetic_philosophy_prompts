  The user’s deeper need here is likely validation of their unease about the "more lives" dogma. They’re not just asking for theory; they want to articulate a moral alternative to their colleagues. So I’ll emphasize concrete implications: Taurek's view doesn’t forbid saving groups, but requires that if we do, it’s because we valued each person equally (via lottery), not because we aggregated them. That shift—from counting lives to honoring individual stakes—might resonate in a medical context where patients feel reduced to statistics.

