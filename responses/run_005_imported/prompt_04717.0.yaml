  First, I need to understand the core of Taurek's argument. His central thesis challenges the utilitarian "greater number" principle by emphasizing individual moral claims. The key here is constructing an argument where each person's inherent value isn't diminished by others' presence. That means framing the dilemma not as "5 lives vs 1" but as five separate 1-vs-1 contests where each individual has equal claim to rescue.

