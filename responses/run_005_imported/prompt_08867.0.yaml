  I should check if Lewis addresses moral dimensions. From what I recall, he doesn't. His work is about game theory and social coordination. So the critique of conventions must come from ethical theories, not Lewis's model itself. The student's confusion might stem from expecting Lewis to provide normative tools, which isn't his project's goal.

  The user's deeper need is to confidently address the student's concerns without undermining Lewis's theory or dismissing the valid critique of harmful norms. They need to clarify that identifying a convention doesn't negate moral evaluation. Also, showing how change is possible within Lewis's framework by altering preferences or common knowledge. For example, feminist movements shift common knowledge about gender roles, enabling new equilibria.

  Another point: the arbitrariness condition means multiple solutions exist, but not all are equally good when considering welfare or justice. Lewis's theory doesn't judge which is better, but we can. So the population can evolve rationally if they recognize the current convention's harms and coordinate on a better one. Historical examples, like changing marriage norms, illustrate this.

  The user might also need resources or examples for the seminar. Suggesting readings that bridge Lewis with critical theory could help. Or discussing how social movements disrupt common knowledge to shift conventions. Emphasizing that philosophy often separates descriptive and normative analyses, and Lewis's contribution is in the former, while ethics handles the latter.

