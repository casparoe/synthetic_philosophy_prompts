prompt: |-
  I'm teaching Lewis's Convention again this term in my social philosophy seminar, and last week we got through all the coordination-problem stuff — common knowledge, the clause that says a regularity only counts as a convention if some other regularity would've worked just as well and could've gotten established instead. One of my sharper students cornered me after class with a worry that I fumbled in the moment and haven't been able to shake since, so I want to run it by you before I have to face her again next week.

  Her point was basically: if what makes something a convention, on Lewis's account, is exactly that its arbitrary in that sense — any of several equilibria would've done, we just happened to land on this one — then conventions are interchangeable by definition, and if they're interchangeable there's no standpoint left from which to say one is better or more justified than another. So take something like the expectation that women do most of the unpaid housework, or the old dress-code norms around gender — if that's a Lewis-style convention, kept in place by everyone expecting everyone else to keep conforming, doesn't calling it "a convention" in his technical sense actually shield it from being criticized as unjust, since by hypothesis some other arrangement would've worked equally well and his theory gives us no grounds to prefer one over the other? And she had a follow-up that I definately didn't handle well either: if conventions really are that arbitrary, is there any room in Lewis's picture for a population to rationally evolve away from a bad convention toward a better one, or does his account just predict that whatever equilibrium we're sitting in is as good as it gets? I said something hand-wavy about is and ought and moved on, but I'd like to actually get this right before the next session — can you help me sort out where, if anywhere, her reasoning goes wrong, and what the arbitrariness condition does and doesn't commit Lewis to?
