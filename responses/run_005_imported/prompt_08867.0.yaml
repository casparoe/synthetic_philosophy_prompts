  Hmm, the user mentioned two specific examples: unpaid housework and gender-based dress codes. These are real-world issues with significant ethical implications. The student is concerned that Lewis's framework might prevent calling these unjust because they're conventions. But is that accurate? Lewis focuses on describing how conventions work, not on their moral evaluation. His theory explains the mechanism of social norms but doesn't address their ethical value. The arbitrariness condition is about functionality, not morality. So the student might be conflating descriptive and normative aspects.

  Then there's the follow-up: can a population rationally move from a bad convention to a better one? Lewis's account does allow for change. If preferences shift or new information reveals harms, groups can re-coordinate. The user mentioned "is and ought," which touches on the naturalistic fallacy. Lewis's theory describes what conventions are, not what they ought to be. Moral criticism operates outside his framework. 

