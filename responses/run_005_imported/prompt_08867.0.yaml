answer: |-
  Your student has raised a profoundly important challenge—one that cuts to the heart of how Lewis's descriptive theory of conventions interacts with normative critique. Her concern is valid but rests on a subtle conflation of *functional arbitrariness* with *moral equivalence*. Let's break down where the reasoning goes astray and how Lewis's framework actually leaves ample room for criticism and change:

  ### 1. **The Arbitrariness Condition ≠ Moral Neutrality**
     - **What Lewis Actually Says**: The arbitrariness condition ("some other regularity could have solved the coordination problem") is about *functional substitutability*, not moral parity. Conventions are arbitrary **only in the sense that multiple solutions could achieve the same coordination goal** (e.g., driving on left vs. right).  
     - **The Mistake**: Your student infers that if conventions are functionally interchangeable, they must be morally interchangeable. This conflates two distinct domains:  
       - *Coordination efficiency* (Lewis's focus: "Does this regularity solve the problem?")  
       - *Distributive justice/welfare* (external to Lewis: "Does this regularity fairly distribute burdens? Does it harm people?").  
     - **Key Clarification**: Lewis's theory is **descriptive**, not normative. It explains *how* conventions stabilize—not whether they *should*. Calling a practice "conventional" doesn’t shield it from moral critique; it merely explains *why it persists*. For example:  
       - Gendered housework *is* a Lewis-style convention (it solves coordination through mutual expectations).  
       - Its conventional status **does not imply** it’s just—only that it’s self-reinforcing. We can (and should!) critique it on grounds of fairness, autonomy, or equality *external* to Lewis's model.  

  ### 2. **Critiquing Conventions: Where Normative Tools Enter**
     Lewis's framework doesn’t provide tools for moral evaluation—but it doesn’t preclude them. We import ethics from elsewhere:  
     - **Unjust Conventions**: A convention can be stable *and* oppressive. Consider:  
       - **Gendered labor**: Even if "man does chores" could have been the norm, the actual norm may exploit women. Its harm isn’t negated by its conventionality.  
       - **Racial segregation**: A stable coordination equilibrium (e.g., segregated facilities), but morally indefensible.  
     - **Grounds for Criticism**: We appeal to:  
       - **Distributive outcomes**: Does the convention concentrate burdens/benefits unfairly?  
       - **Autonomy**: Did people consent to it? (Many conventions emerge without consent.)  
       - **Well-being**: Does it cause avoidable harm?  

  ### 3. **Can We Rationally Evolve Away from Bad Conventions? (Yes!)**
     Your student’s follow-up reveals a deeper worry: Does Lewis trap us in the status quo? Not at all. Conventions can change when:  
     - **Preferences Shift**: If people start valuing justice over convenience (e.g., via feminist critique), their payoff matrices change. What was once a stable equilibrium becomes unstable.  
     - **Common Knowledge Updates**: When enough people know *others* disapprove of a convention (e.g., #MeToo shifting attitudes on harassment), it loses its self-reinforcing power.  
     - **Focal Points for Change**: Activists create new salient options (e.g., equitable divorce laws as a "focal point" replacing patriarchal norms).  
     - **Example**: Transitioning from gendered dress codes to gender-neutral norms:  
       1. **Critique exposes harms**: Dress codes enforce gender binaries, causing distress.  
       2. **New focal point emerges**: "Wear what expresses your identity" gains salience.  
       3. **Common knowledge shifts**: People realize others prefer flexibility → old expectations dissolve.  

  ### 4. **Why This Doesn’t Contradict Lewis**
     - **Arbitrariness Enables Change**: Precisely *because* alternatives are functionally possible, we can coordinate on better ones! Lewis’s condition explains *why* transitions are feasible.  
     - **No "Best" Equilibrium?**: Lewis doesn’t say all conventions are equally good—only that multiple *could* work. We use moral/practical reasoning to rank them (e.g., "Driving on the left works, but switching to the right would save $1B in manufacturing costs").  

  ---

  ### **How to Frame This for Your Student**
  > "You’re right that Lewis’s arbitrariness condition means conventions *could* have been different—but that’s precisely what empowers criticism! If a convention is harmful, its conventionality doesn’t protect it; it just explains its stability. We condemn it *because* a better alternative was possible.  
  >  
  > Lewis gives us a toolkit to understand *how* oppressive norms persist (through self-fulfilling expectations), but also how they fall: when enough people coordinate on a new equilibrium that’s more just. His theory doesn’t say conventions are morally neutral—it shows why they’re *malleable*."  

  ### **Suggested Reading for Context**
  - Sally Haslanger: "What Is a (Social) Structural Explanation?" (Links conventions to structural injustice)  
  - Edna Ullmann-Margalit: *The Emergence of Norms* (Extends Lewis to norms of inequality)  
  - Cristina Bicchieri: *Norms in the Wild* (How to measure/counter harmful conventions)  

  Your student’s insight is spot-on—Lewis *doesn’t* give us moral tools. But that’s not a flaw; it’s an invitation to layer ethics *onto* his descriptive foundation. The move from "this is a convention" to "this is unjust" requires external values, but the conventionality itself makes reform possible.
