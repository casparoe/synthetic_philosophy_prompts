prompt: |-
  So last night my friend Priya and I got into a two hour argument (again -- this is like the third time this semester) about the Nash bargaining solution vs the Kalai-Smorodinsky solution, and neither of us backed down at all. It started because our game theory prof put up this example where you expand the set of possible deals in a way that seems purely good for player 2 -- their best possible outcome goes up, player 1's doesn't change at all -- and yet the Nash solution ends up giving player 2 LESS then they got before. I said that's obviously broken and that any solution worth calling "fair" has to rule that out, which is basically the whole point of Kalai-Smorodinsky's monotonicity axiom. Priya's comeback was that I'm smuggling in my own intuition and just calling it self-evident, and that Nash's independence-of-irrelevant-alternatives axiom is doing the real philosophical work here (she kept bringing up how its basically the same move as the IIA condition in Arrow's theorem and choice theory more generally), and that Kalai-Smorodinsky's solution is actually worse because it can shift around based on alternatives nobody was ever going to pick, just because they nudge where the "ideal point" sits.

  We never settled it and it's honestly been bugging me since. Could you walk me through what's really going on here -- is not being able to have both properties at once (independence of irrelevant alternatives and this monotonicity thing) some kind of deep necessary trade off, or is it more of an artifact of how these two particular solutions happen to be constructed? And if you had to actually take a side: which axiom has the better claim to represent "fairness" in bargaining, and does Kalai-Smorodinsky really escape the charge that it's just as arbitrary as Nash, seeing as its own reference point depends on parts of the feasible set that nobody ever actually gets to use? Don't just tell me "they capture different values and both are valid" -- I want to know which one of us should've won the argument.
