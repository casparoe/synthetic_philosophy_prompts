  Tarski's strict hierarchy seems robust but impractical—social media's language is messy and self-referential. You can't force users into hierarchical labeling. Kripke's gaps are more flexible but leave "undefined" outputs, which might confuse users expecting binary true/false. 

  Paraconsistent logic is bold—accepting "both true and false"—but could erode trust in fact-checking labels. Users want clarity, not ambiguity. Contextualism feels promising: dynamically re-evaluating context mirrors how humans parse paradoxes. 

