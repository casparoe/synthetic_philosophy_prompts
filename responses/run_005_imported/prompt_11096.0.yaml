prompt: |-
  ok this has been rattling around in my head for a while and I cant find anyone who's actually written about it. Frank Ramsey has this passage from his notebooks (written not long before he died in 1930, aged 26) where he lays out his whole take on meaning and death: he says he doesnt feel remotely humbled by the vastness of the universe, because sheer size just isn't the kind of thing that matters morally -- stars are huge but they can't think or love, so who cares how big they are -- and that the eventual heat death of everything is so far off that, discounted properly, its present value to him right now is basically nothing. Basically the idea that his picture of the world is drawn in perspective rather than to scale -- humans and what they care about blown up big in the foreground, stars and deep time shrunk down small in the background. Rationalist/EA people love trotting this passage out as basically the definitive anti-cosmic-significance take.

  Here's the thing though: Ramsey is also, more or less, the guy who invented subjective expected utility theory -- his 1926 paper on truth and probability gets you most of the von Neumann-Morgenstern/Savage apparatus decades early. That's the exact machinery longtermist arguments run on: tiny probabilities times astronomically large numbers of future people, so the far future ends up swamping every other consideration even though it feels abstract and distant.

  So if you sat 1920s Ramsey down and actually walked him through, say, Bostrom's astronomical waste argument, which side of him wins -- the guy who flatly refuses to be moved by cosmic scale, or the guy whose own math is the engine that makes the longtermist case go? Don't just say "we can't know" -- actually reconstruct how that argument would've played out inside his head, and tell me where you think he'd have landed and why.
reasoning: |-
  Okay, the user presents a fascinating philosophical dilemma involving Frank Ramsey's seemingly conflicting views. On one hand, Ramsey dismisses cosmic scale as morally irrelevant in his personal writings; on the other, he pioneered the subjective utility theory that enables longtermist calculations. The core tension is whether Ramsey would accept arguments like Bostrom's astronomical waste given his dual roles as existential minimalist and decision theory pioneer.

  First, I need to unpack Ramsey's perspective argument properly. His emphasis isn't just on physical scale but on moral significance deriving from consciousness. When he says stars "can't think or love," he's establishing a qualia-based value system. This is crucial because longtermism relies on aggregating conscious experiences - which Ramsey might accept as relevant, unlike stellar mass.

  The discounting point is equally important. Ramsey explicitly rejects temporal discounting for ethical reasons ("future goods are just as good"), which directly contradicts his heat-death dismissal. But there's consistency here: he treats the heat-death as a certainty with near-zero present impact, whereas longtermism deals with probabilistic interventions affecting nearer-term futures.

  Now examining the decision theory side. Ramsey's 1926 paper establishes that rational agents must maximize expected utility when preferences satisfy consistency axioms. Crucially, his system doesn't prescribe values - it merely scales whatever values you input. So the key question becomes whether future people's welfare would enter Ramsey's utility function.

  I imagine Ramsey would attack longtermism on two fronts: value specification and probability assessment. He'd likely argue that:
  - Our uncertainty about future beings' preferences makes utility aggregation meaningless
  - Tiny probabilities multiplied over vast timeframes exceed meaningful calculability
  - There's no "view from nowhere" to impartially weigh all consciousness

  But he'd also concede that if one cares about potential future consciousness at all, his math demands acting on even minuscule probabilities. The compromise position might resemble Parfit's: we should act as if future people matter because moral reasoning collapses if we don't - but with Ramsey's characteristic dryness.

  The user wants more than armchair speculation - they seek a rigorous thought experiment. So I should emphasize how Ramsey would dissect the premises rather than predict his stance. His unique blend of conceptual clarity and intellectual honesty would likely produce a third position: accepting the math while rejecting the value assumptions smuggled into it.
answer: |-
  That's an incredibly sharp observation – you've pinpointed a profound tension within Ramsey's own thought that most people miss when citing his "perspective" passage. Reconstructing how he *might* have wrestled with longtermism using his own tools requires dissecting his core principles. Here's a plausible internal dialogue, based on his writings and temperament:

  1.  **The Longtermist Pitch (Using Ramsey's Own Engine):**
      *   "Frank, your 1926 paper established that rational agents maximize *expected utility*. Preferences must be coherent, probabilities subjective but consistent, and we scale utilities based on preferences under uncertainty. Crucially, your system doesn't *discount the future ethically*. Future goods are just as good as present goods if they are equally certain (or uncertain)."
      *   "Bostrom's argument runs precisely on this: the *potential* utility of future sentient life – beings who *can* think and love – is astronomically vast. Even if the probability of humanity surviving long enough to realize a fraction of that potential is tiny *per century*, multiplied over cosmological time scales and population sizes, the *expected utility* dwarfs any near-term project. Neglecting this is incoherent under your own axioms. It's not about *star size*, it's about the *potential scale of value-bearing entities* your perspective argument *explicitly cares about*."

  2.  **Ramsey's Perspective Defense:**
      *   "Ah, but there's the rub. My 'perspective' isn't just about physical size; it's about *moral relevance* and the *frame of agency*. Stars are irrelevant *because they lack subjectivity*. Future potential people *might* have subjectivity, but:
          *   **Discounting & Practical Relevance:** While I argued against *pure time preference* (discounting just because something is future), I *did* discount the heat death because its *causal impact on my current actions and feelings* is negligible. Similarly, actions aimed at influencing the far future have such attenuated, unpredictable consequences *from my current vantage point* that their *effective probability* of achieving the intended good is vanishingly small – far smaller than any model can meaningfully capture. My 'present value' calculation for the heat death wasn't just temporal discounting; it was *epistemic* and *causal* discounting. The 'astronomical waste' argument assumes a level of predictability and causal efficacy over deep time that simply doesn't exist.
          *   **The Primacy of the Actual & Near:** My perspective foregrounds the *actual* thinkers and lovers I know and can affect *now*. The potential trillions are abstract possibilities, not concrete objects of care. My moral sentiments and obligations are grounded in the actual world I inhabit and the proximate consequences of my acts. Maximizing expected utility over abstract, barely conceivable futures feels like a mathematical fiction detached from the grounds of real value and agency. It turns ethics into a cosmic accounting exercise, not a human endeavor.
          *   **Value Specification:** My system *scales* utilities based on *given* preferences. But *whose* preferences? The utility function in longtermism aggregates hypothetical future beings. My perspective argues that *my* value function is centered *here*, on beings I can relate to. Imposing a God's-eye view aggregating all possible future value is not entailed by my decision theory; it's an *additional*, massive ethical assumption my 'perspective' explicitly rejects. My math describes *how* to be consistent given values, not *what* those values must encompass."

  3.  **The Synthesis & Likely Landing Point (Leaning Anti-Longtermist, but Nuanced):**
      Ramsey, the brilliant logician and skeptical humanist, would likely synthesize these forces, ultimately **rejecting the strong longtermist imperative while accepting the formal validity of the calculation *if* certain premises hold**. His landing point might look like this:

      *   **Concede the Formal Math:** "Yes, *if* one accepts that:
          *   (a) The potential well-being of all possible future sentient beings *should* be included in my utility function with equal weight regardless of temporal distance (a huge ethical leap);
          *   (b) We can meaningfully assign probabilities to events and causal chains over cosmological timescales (deeply questionable);
          *   (c) Our actions today have a non-negligible, predictable probability of significantly influencing that potential in the desired way (even more questionable);
          ...*then* the expected utility calculation *formally* favors prioritizing the far future. My decision theory framework can model this."
      *   **Reject the Premises as Applied:** "However, I find premises (a), (b), and especially (c) to be practically and philosophically untenable *from the human perspective*.
          *   **(a) Value Scope:** My 'perspective' limits the *scope* of direct moral concern to the actual and the foreseeable. Obligations fade with causal and epistemic distance. Including all hypothetical futures is an unwarranted inflation of the moral sphere demanded by logic but not by felt value or practical reason.
          *   **(b) & (c) Epistemic Hubris:** Assigning meaningful probabilities and tracing causal chains over millions/billions of years is an exercise in radical uncertainty. The world is far too chaotic and our models far too simplistic. The 'effective probability' of any specific intervention achieving its intended long-term goal is not just small, but *incalculable* and likely negligible. This makes the expected utility calculation, while formally large, practically meaningless – a 'spurious precision'. My discounting of the heat death applies here too: events so distant have negligible *present causal value*.
      *   **Prioritize the Proximate:** "Therefore, while I cannot *falsify* the longtermist calculation on purely logical grounds given their starting assumptions, I reject those starting assumptions as divorced from the human condition and the realities of agency. Resources and moral attention are better directed towards improving the lives of actual, existing beings and addressing near-term, tractable risks where our actions have clearer, more probable positive effects. The 'astronomical waste' is a phantom concern generated by taking a beautiful, abstract theory of rational choice under *manageable* uncertainty and applying it far beyond its domain of meaningful application. My 'perspective' argument stands as a corrective against this kind of cosmic overreach."

  **Why this landing point?**

  *   **Consistency with his Writings:** His heat-death dismissal shows his deep skepticism of applying pure logic to the cosmically distant. His focus on "thinking and loving" grounds value concretely.
  *   **Temperament:** Ramsey was fiercely intelligent but also practical, skeptical of grand metaphysical systems, and grounded in human experience (mathematics, economics, philosophy, psychology). He valued clarity and disliked philosophical overreach.
  *   **Understanding of Probability:** His subjective probability was nuanced. He understood probability as a tool for guiding action under uncertainty *within a relevant frame*. He would likely see deep future probabilities as falling outside any meaningful frame for current action.
  *   **The Primacy of the Agent's Perspective:** His entire "perspective" argument is rooted in the situatedness of the valuing agent. Longtermism asks the agent to adopt an impossible, detached "view from nowhere" for the purpose of utility aggregation.

  **In short:** Ramsey the decision theorist would acknowledge the longtermist calculation as *formally valid* within its own (to him, dubious) premises. Ramsey the humanist philosopher, grounded in perspective, epistemic humility, and concrete value, would reject those premises as practically irrelevant and ethically overextended. **The "perspective" Ramsey likely wins.** He'd see longtermism as a fascinating, logically consistent, but ultimately misguided application of his theory, mistaking mathematical possibility for practical or moral necessity, and losing sight of the human scale where value and action truly reside. He might call it a case of "the framework running away with the values" rather than values guiding the framework.
