  Here’s a short story built around that specific, unsettling pivot in Ramsey’s thought:

  **Title:** The Discount Rate

  Elara traced the condensation on the hospital window with a fingertip. Outside, the city pulsed – headlights streaking, neon bleeding into the damp night. Inside Room 407, the only pulse was the slow, insistent beep of the monitor tethered to her grandfather, Silas. His breath rasped, a dry leaf skittering on stone. The oncologist’s words, "weeks, maybe days," hung in the antiseptic air like a physical weight.

  Silas had been a bridge engineer, a man who built things meant to endure centuries. Now, the span of his life felt terrifyingly finite, dwarfed by the indifferent cityscape and the vaster, silent cosmos beyond. Elara felt the familiar panic rising – the crushing insignificance, the pointlessness of *anything* when measured against the universe’s cold, entropic slide. She’d tried reading Camus in the waiting room, but Sisyphus’s defiant rock felt like a hollow performance tonight.

  Restless, she wandered the hushed corridors. Near the chapel (a room she avoided, finding its comfort equally hollow), a small, forgotten library alcove held donated paperbacks and a single shelf of dusty hardcovers. Her hand brushed against a slim, blue-bound volume: *Cambridge Society Proceedings, 1925-1926*. Idly, she flipped it open. A name caught her eye: F.P. Ramsey. *Epilogue.*

  The prose was dense, mathematical in its precision, yet strangely conversational. She read about perspective drawings, about how a foreground figure rightly loomed larger than distant mountains on the canvas. She read about value not residing in sheer size or duration. And then, the icy, jarring logic:

  *"I don’t feel the least humble before the vastness of the heavens. The stars may be large, but they cannot think or love; and these are qualities which impress me far more than size does... The whole picture… is drawn in perspective. The foreground is occupied by human beings and the stars are all as small as threepenny bits..."*

  Elara stopped. *Threepenny bits.* The sheer, dismissive casualness of it. She read on, her breath catching as Ramsey calculated the "present value" of the universe's eventual heat-death – the point where all light and life ended – using compound discount. He concluded its worth, *now*, was essentially zero. It wasn't defiance against the void; it was a ledger entry. The cosmic finale was a bad long-term investment, emotionally negligible at current rates.

  But it was the final passage that struck her like a physical blow. Ramsey spoke of a depressed friend who saw the world as ultimately futile. He stated plainly that *he* had reason on his side, and his friend did not. And then, the chilling, honest admission: *"Neither of our feelings, perhaps, corresponds to the fact."*

  Elara closed the book, the cheap blue cover cool against her palm. It felt alien, this argument. Not warm comfort, not heroic struggle. It was an accountant’s audit of eternity, reducing the apocalypse to a rounding error. It *should* have felt nihilistic. Instead, a bizarre lightness seeped into her bones, cold but clean, like mountain air.

  She returned to Room 407. Silas’s eyes were open, hazy but aware. "Where’d you vanish to, sparrow?" he whispered, the old nickname a threadbare comfort.

  "Found an old book. Philosophy." She sat, taking his thin hand. "It argued... that the size of things, how long they last... it doesn’t actually matter for what’s valuable. Not really."

  Silas coughed weakly. "Sounds like... sophistry to a dying man."

  "Maybe." She thought of Ramsey’s cheerful certainty, his cold discounting of the end of everything. "The writer said even the heat-death of the universe... its value *now*, calculated properly, is basically nothing." She paused, feeling the unsettling aftertaste of Ramsey's confidence. "He told a depressed friend he had reason on his side. That the friend was wrong to despair about futility."

  Silas managed a faint, skeptical grunt. "And was he right? This... reason-haver?"

  Elara met his fading gaze. Here was the pivot, the strange, unvarnished core of it. "He admitted neither feeling – his cheer or his friend’s despair – probably 'corresponded to the fact.' But he still insisted *he* was the reasonable one." She squeezed his hand gently. "It’s cold, Grandad. Ice cold. But... it makes the stars feel smaller. And *this*," she gestured at the small room, his hand in hers, the soft beep of the monitor, "feel... proportionally larger. Like it’s drawn right in the foreground."

  Silas was silent for a long moment, staring at the ceiling tiles. The vast, indifferent universe pressed against the window. The heat-death loomed, mathematically inevitable, emotionally discounted to zero.

  "Foreground," he rasped finally, a ghost of his old, decisive tone. "Huh." He didn't sound comforted, not exactly. But the crushing weight of cosmic futility seemed... recalculated. Diminished, not by defiance, but by a ruthless re-framing. "Cheeky bastard, your philosopher."

  Elara smiled, a small, tight thing. "Yeah. He was." She didn't feel happy. She didn't feel reassured in the warm, fuzzy sense. She felt... aligned with a peculiar, icy reason. The panic had receded, replaced by a profound and unsettling calm. The universe was ending? Apply the discount rate. Its present value: negligible. The warmth of her grandfather's papery skin under her fingers? Undiscounted. Occupying the entire foreground.

  She stayed, holding his hand as he drifted back to sleep. The stars outside were indeed no larger than threepenny bits. The eventual silence of everything meant nothing *now*. And the unsettling certainty – *I have reason on my side* – lingered, not as a boast, but as a stark, strangely liberating vantage point. It wasn't meaning wrested from the void. It was meaning recognized precisely *because* the void's scale was deemed irrelevant. The coldness wasn't comforting; it was the solvent that dissolved the false weight of eternity, leaving only the sharp, immediate, and strangely sufficient value of the human-scale present. It felt less like an answer, and more like a tool for radical perspective. And in the quiet hum of the hospital room, with the discounted apocalypse light-years away in value, it was enough. For now. Unsettlingly, reasonably enough.
