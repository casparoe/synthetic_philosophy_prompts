  | **(2)** | Dov | Behavior ≠ subjective pain; fish lack neocortex for mammalian-like experience | **+0.5** | Correct about inference gap and cortex role in mammals. But overstates cortex necessity (as Marisol counters). Skepticism valid, but framing is mammal-centric. |
  | **(3)** | Marisol | Birds lack layered neocortex but have rich cognition via pallium; absence ≠ emptiness | **+2** | Excellent rebuttal. Highlights neurodiversity—function matters more than homologous structures. Undermines Dov's necessity claim. |
  | **(4)** | Dov | Bird inference relies on cognitive convergence; fish evidence is single-behavior | **+1** | Valid methodological point. Extraordinary claims *do* require diverse evidence. But understates fish cognition studies (e.g., spatial learning, social recognition). |
  | **(5)** | Marisol | Dov's stance unfalsifiable—any fish behavior dismissed as "reflex" | **+0.5** | Correct about unfalsifiability *risk*, but Dov *did* propose a standard (convergence). Overstates his intransigence. |
