  **The Bigger Picture Both Miss**  
  **Sentience isn't binary; it's a spectrum.** They're debating a "lights on/lights off" question, but consciousness likely exists in gradients. Fish may possess a *differently structured* sentience—not human-like suffering, but not mere reflex either. Evolutionary pressures (e.g., avoiding hooks, complex shoaling) could select for primitive affective states without a cortex. The debate fixates on *proving* human-like pain rather than asking: *What evolutionary function might fish subjective experience serve?*  

  **Key Overlooked Points:**  
  - **Neurochemistry:** Fish have endogenous opioids, cannabinoid receptors, and stress hormones that modulate nociception—systems deeply tied to affective states.  
  - **Trade-offs:** Even if "pain" is primitive, avoiding injury is so evolutionarily vital that reflexive responses alone might be insufficient. Affective weighting improves decision-making.  
  - **Anthropocentrism:** Dov’s mammal-centric view ignores that octopuses (no cortex) exhibit curiosity and play—demonstrating convergent evolution of consciousness.  
  - **Practical Ethics:** Burden-of-proof games aside, precautionary principle applies: If evidence suggests *possible* suffering, and alternatives exist (e.g., humane slaughter), why risk it?  

  **Conclusion:** Marisol wins on neurodiversity (Move 3) and highlighting Dov’s shifting standards (Move 5). Dov wins on demanding robust evidence (Move 4) but loses by ignoring evolutionary context (Move 6). The novel’s tension lies in the unresolved gray zone—perfect for fiction. Use this ambiguity; their clash reveals how science grapples with the unobservable. Maybe add a scene where a third character quietly notes: *"We used to say babies didn’t feel pain. Sometimes absence of proof is just... absence of imagination."*
