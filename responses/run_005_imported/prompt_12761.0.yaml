prompt: |-
  I spent about 35 years as a field geologist before I retired, and one of the first things that gets drilled into you as a student is how easy it is to end up with a badly skewed picture of a rock formation if your sampling method has some hidden bias built in -- you core in the easy-to-reach spots, or you rely on the outcrops that just happen to be exposed, and suddenly your estimate of the whole formation is garbage. So when I started reading Bostrom's stuff on anthropic reasoning this past year I about spat out my coffee at the term "self-sampling assumption" -- its basically the same worry, just dressed up in observers and possible universes instead of strata and core samples.

  Anyway, I've been chewing on the presumptuous philosopher case for a couple weeks now: two theories, T1 and T2, equally well supported by the evidence so far, except T2 implies the universe contains something like a trillion times more observers than T1 does. A philosopher struts into the physics lab and tells everyone not to bother running there decisive experiment, because the self-indication assumption already tells him T2 is basically a sure thing, just from the fact that he exists at all. I tried explaining to my wife over dinner why this is supposed to be absurd, and why it's specifically SIA's fault and not SSA's, and by the end I realized I was basically just reciting the Wikipedia definitions at her, which did not land as a joke, at all.

  So here's what I actually want from you: write me a real joke -- an actual setup and punchline, not a generic "two philosophers walk into a bar" bit -- that only works if you genuinely understand the difference between the self-sampling assumption and the self-indication assumption, and why the presumptuous philosopher is a problem for one of them and not really the other. Extra credit if it would also land for someone who knows the doomsday argument, since that's the skeleton hiding in SSA's own closet.
