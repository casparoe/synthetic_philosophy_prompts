  For example, X=2: can be small (S=2) or large (S=1, since L=2)

  Similarly, X=3: can be small (S=3) or large? If large, S=1.5, not integer, so only possible as small, since S integer, L=2S, so if X odd between 3 and 99, must be small, because if large, S=X/2 not integer.

  Similarly, if X even between 2 and 198, can be small or large.

  X=100: can be small (S=100) or large (S=50)

  Now, P(see X and small) = P(S=X) * 1/2 for X in 1 to 100

  P(see X and large) = P(S=X/2) * 1/2 for X=2,4,6,...,200, i.e., even X from 2 to 200.

  Then for a given X, say X=50, which is even.

  P(see 50) = P(see 50 and small) + P(see 50 and large) = P(S=50) * 1/2 + P(S=25) * 1/2

  Since X=50 large implies S=25.

  P(S=50) = 1/100, P(S=25)=1/100

  So P(see 50) = (1/100)(1/2) + (1/100)(1/2) = (1/100)(1/2) * 2? (1/2)(1/100) + (1/2)(1/100) = (1/2)(1/100) * 2 = (1/100) *1, better: (1/2)(1/100) + (1/2)(1/100) = (1/200) + (1/200) = 2/200 = 1/100

  P(X small | see 50) = P(see 50 and small) / P(see 50) = [ (1/2)(1/100) ] / [1/100] = (1/2)(1/100) * 100/1 = 1/2

  Similarly, P(X large | see 50) = [ (1/2)(1/100) ] / [1/100] = 1/2

  Then E[other | see 50] = P(small |50) * 100 + P(large |50) * 25 = (1/2)(100) + (1/2)(25) = 50 + 12.5 = 62.5 > 50

  Similarly, for X=100.

  P(see 100) = P(see 100 and small) + P(see 100 and large) = P(S=100) * 1/2 + P(S=50) * 1/2 = (1/100)(1/2) + (1/100)(1/2) = 1/200 + 1/200 = 1/100

  P(X small | see 100) = P(see 100 and small) / P(see 100) = [ (1/2)(1/100) ] / [1/100] = 1/2

  P(X large | see 100) = [ (1/2)(1/100) ] / [1/100] = 1/2

  E[other] = (1/2)*200 + (1/2)*50 = 100 + 25 = 125 > 100

  For X=1, E[other]=2>1

  For X=200, E[other] = P(only large, so other=100) =100 <200, so don't switch.

  In this case, for most X, switching is good, except when X=200.

  But in Sam's geometric distribution, since it goes to infinity, there is no upper bound, so you never see the maximum, so always switch is beneficial.

  In finite uniform, not always.

  So back to who is right.

  In (1), Sam's reasoning is flawed due to impossible prior.

  In (2), Noor is correct about the infinite regress pointing to a problem.

  In (3), Sam is wrong; principle of indifference can't be applied here.

  In (4), Noor is correct.

  In (5), Sam is correct; the distribution is legit and always switch is better.

  In (6), Noor is wrong; there is no mistake, the distribution is fine, and it does show that always switch can be correct under some priors.

  The bigger lesson is that the paradox arises from not specifying a prior, and with a proper prior, the issue resolves, and switching may or may not be always beneficial depending on the prior.

  In this case, with a heavy-tailed prior, it is beneficial.

  But in practice, with real money, distributions have finite mean, so for large amounts, switching might not be good, but since you don't know, it depends.

