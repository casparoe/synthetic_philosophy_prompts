  Hey, I'm plotting a new novel and I need my protagonist to land in a genuinely irresolvable moral dilemma, not just a hard choice that turns out to have an obvious right answer once she thinks it through. I've been reading around and apparently theres a real fight in ethics over whether these even exist -- Bernard Williams and Ruth Barcan Marcus argued that real dilemmas happen and leave you with guilt/residue no matter what you pick, while people like Alan Donagan think a genuinely consistent moral code can never do that to an agent unless its her own fault for getting into the mess in the first place. Can you invent a scenario for me (NOT sophie's choice, not agamemnon, not sartre's kid torn between his mom and the resistance -- i am so sick of those three) where she truly ought to do A and truly ought to do B, genuinely can't do both, and neither duty just cancels the other out on reflection. Then briefly defend it against Donagan's move -- if she really can't do both, doesn't that just prove one of the 'oughts' was never real -- and tell me what kind of moral residue she'd be left carrying either way.
