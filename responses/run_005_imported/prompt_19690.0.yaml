answer: |-
  Here's a fresh, high-stakes moral dilemma scenario designed to meet your criteria, with a defense against Donagan and the resulting moral residue:

  **The Scenario: "The Unjust Silence"**

  **Protagonist:** Dr. Anya Sharma, a dedicated human rights lawyer specializing in defending political prisoners in an authoritarian state with a corrupt judiciary. Her work often requires absolute confidentiality agreements with terrified informants inside the regime.

  **The Dilemma:**

  1.  **Duty A (Justice for the Innocent):** Anya secures irrefutable proof (via a high-level, terrified informant, "Source X," under a sacred vow of confidentiality) that her current client, **Kai**, a young activist accused of bombing a government building, is completely innocent. The *real* perpetrator was a regime death squad led by a powerful General. Crucially, Kai's execution is scheduled in **48 hours**. Releasing the proof *now* would save Kai's life and expose the regime's atrocity. However, releasing the proof would inevitably identify Source X, leading to their immediate torture and execution, along with their family (a fact Source X explicitly made Anya swear to prevent). Anya *knows* Source X provided the evidence specifically to help Kai, but only under the absolute condition of anonymity for their own survival.

  2.  **Duty B (Protecting the Vulnerable & Upholding Promise):** Anya gave Source X her **sacred, professional, and personal oath** of confidentiality. This vow isn't just legal; it's the bedrock of her entire operation. Breaking it means:
      *   Source X and their family will be brutally killed.
      *   All future potential whistleblowers will lose trust, crippling Anya's ability to defend *any* future political prisoners. Countless innocents will suffer without her network.
      *   She personally violates a core ethical and personal commitment made to someone who risked everything trusting her.

  **The Irresolvable Conflict:**
  *   **Save Kai (Duty A):** Requires **breaking her vow** to Source X, leading to their death and the collapse of her life's work, sacrificing future innocents.
  *   **Protect Source X & Her Mission (Duty B):** Requires **keeping silent**, allowing the innocent Kai to be executed for a crime he didn't commit, becoming complicit in a grotesque miscarriage of justice.
  *   **No Third Way:** She cannot warn Source X without triggering their immediate capture/killing. She cannot release the proof anonymously; the evidence is uniquely tied to Source X. She cannot delay; Kai dies in 48 hours. She cannot protect both.

  **Why it's Genuinely Irresolvable (Against Donagan):**

  Donagan might argue: "If she *truly* cannot do both, then one of these 'oughts' must be invalid or overridden in this situation. Perhaps the vow isn't absolute when an innocent life is imminently at stake, or perhaps protecting the source isn't a *duty* if it enables an execution."

  **Defense:**

  1.  **Non-Overridable Foundations:** Both duties stem from fundamental, non-negotiable moral principles:
      *   **Duty A:** Rooted in preventing the direct, intentional, imminent killing of a known innocent person (Kai). This is a core negative duty (do no harm).
      *   **Duty B:** Rooted in:
          *   **Fidelity:** Keeping a solemn promise made under extreme duress, upon which another vulnerable person's life *directly* depends (Source X & family).
          *   **Justice (Systemic):** Upholding the integrity of a system (her network) that is the *only* means to achieve justice for *many* future innocents in this corrupt state. Breaking it sacrifices *potential* innocents for a *specific* innocent.
          *   **Negative Duty (Non-Betrayal):** Not being the *direct cause* of Source X's death through her own action (disclosure).
  2.  **Neither Cancels the Other:** Reflecting doesn't reveal Duty B as unimportant when facing Duty A, or vice versa. Recognizing the supreme value of Kai's life doesn't magically dissolve the profound wrong of betraying Source X and destroying the future justice network. Conversely, upholding the vow doesn't erase the horrific wrong of letting Kai die knowing his innocence. Both duties retain their full moral weight *even after* the choice is made. Choosing one doesn't mean the other *wasn't* a true duty; it means fulfilling one required the tragic violation of the other.
  3.  **Not Her "Fault":** Anya didn't recklessly get into this mess. She was doing her morally essential job (defending Kai) using necessary, ethical means (securing confidential evidence). The conflict arises from the *external*, evil actions of the regime (framing Kai, creating the death squad, imposing the execution deadline) and Source X's *understandable* condition of anonymity. She navigated her duties correctly; the world presented an impossible trap.

  **The Moral Residue:**

  No matter what Anya chooses, she carries profound, inescapable guilt and a fractured moral self:

  *   **If She Saves Kai (Breaks Vow):**
      *   **Guilt of Betrayal:** Crushing guilt for directly causing the torture and death of Source X and their family. She broke the most sacred trust possible in her world.
      *   **Guilt of Complicity in Future Injustice:** Knowing her action destroyed the only effective resistance legal network, leading to countless future innocents being imprisoned or killed without defense. She sacrificed the many for the one.
      *   **Loss of Self:** Her identity as a trustworthy defender, the foundation of her life's work and moral purpose, is obliterated. She becomes what she fought against: someone who uses vulnerable people as pawns and discards them.
      *   **Residue:** Profound shame, self-loathing, the unbearable weight of being a betrayer, and the knowledge of future suffering she enabled.

  *   **If She Protects Source X (Lets Kai Die):**
      *   **Guilt of Complicity in Murder:** Knowing she allowed an innocent man, her own client, to be executed for a crime she *knows* he didn't commit. She becomes an accessory to judicial murder.
      *   **Guilt of Broken Faith (to Kai):** Failing her primary duty *to him* as his defender. She prioritized a source over her client's life.
      *   **Moral Taint:** The victory of preserving her network feels hollow and poisoned by Kai's blood. Every future success will be shadowed by the knowledge it was bought with his life.
      *   **Residue:** A deep, corrosive sense of cowardice, the haunting image of Kai's execution, the feeling of being morally compromised and unclean, despite upholding her vow.

  **Key for the Novel:** Show Anya wrestling not with *which* duty is real, but with the horrific reality that *both* are binding and mutually exclusive. The agony comes from knowing she *must* choose, and that whichever she chooses, she commits a grave moral wrong against deeply worthy claims. The residue isn't just sadness; it's an enduring moral injury that fundamentally changes her. This scenario avoids the well-trodden paths of familial love or wartime sacrifice, placing the conflict squarely in the realm of professional ethics, systemic justice, and the unbearable weight of promises made in the shadow of tyranny.
