      {"view": "Variable Value Theory", "reason": "Avoids the Repugnant Conclusion through diminishing marginal value of population, but risks intransitivity, discontinuity, and the Very Repugnant Conclusion in some formulations."},
      {"view": "Lexical View", "reason": "Avoids the Repugnant Conclusion via a welfare threshold but violates Egalitarian Dominance, leading to the Anti-Egalitarian Conclusion and severe discontinuity."}
    ],
    "tier_4_least_defensible": [
      {"view": "Average Utilitarianism", "reason": "Avoids the Repugnant Conclusion but accepts the Sadistic Conclusion, with additional costs of discontinuity, Egyptology, and violations of Non-Elitism."},
      {"view": "Total View", "reason": "Accepts the Repugnant Conclusion and suffers from Egyptology, though it benefits from simplicity, transitivity, and continuity."},
