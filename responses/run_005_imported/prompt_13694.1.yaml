answer: |-
  Here’s a toast that threads the needle: celebrates Marcus’s legacy, respects his philosophy, delights the traders with precise geometric wit, and wraps it all in warmth for everyone. (Clockwise: ~6 minutes)

  ---

  **(Clink glass gently)**  

  "Friends, colleagues, Marcus’s wonderful family… we’re here to honour Marcus. And if you know Marcus, you know that honouring him *correctly* requires a little… geometric precision.  

  Now, picture this: Years ago, Marcus and I were splitting dessert after a brutal day on the desk. The menu offered ‘Chocolate Oblivion’ – one slice, rich enough to induce a coma. The waiter suggested cutting it down the middle. Marcus looked horrified. *‘Arithmetic mean!’* he muttered. ‘Disaster waiting to happen.’ He insisted we instead *share the entire experience proportionally*. We each got a fraction of every bite, ensuring neither missed the peak cocoa intensity nor was overwhelmed. It was… profoundly fair. And delicious. That’s Marcus.  

  You see, Marcus spent thirty years teaching us that the world often asks the wrong question. It shouts: *‘What single outcome looks best *right now*?’* It demands we split things down the middle, average our guesses, declare a single winner, chase the highest immediate number. **Arithmetic thinking.** It feels intuitive. Obvious, even.  

  But Marcus heard a quieter, deeper question humming beneath the noise: ***‘What sustains? What compounds? What preserves optionality through the inevitable, unpredictable volatility of life?’*** That question craves a **geometric mean**. It’s not about one big win; it’s about the shape of the entire trajectory.  

  For the traders here, we saw this daily. He didn’t just teach us Kelly to size bets – though yes, he saved more bankrolls from ruin than I can count by insisting we bet *fractions*, not absolutes. He made us see that the *time-average growth rate* is the star, not the ensemble-average expectation. He’d gleefully point out how ‘naive EV maximization’ was often just log utility smuggled in through a poorly specified objective function. **(Wink at traders)**. We argued fractional Kelly, agonized over edge vs. uncertainty, and learned that maximizing the *median* outcome often meant sacrificing the *arithmetic mean* – a trade-off arithmetic thinking simply cannot comprehend.  

  But his real genius? Seeing that this geometric lens – this focus on the *product* of outcomes, on surviving to compound another day – wasn't just for gambling or trading. It was for *life*.  

  Splitting that dessert? Geometric. Pooling forecasts from two analysts with wildly different credences? Don’t average – *multiply* and renormalize. Negotiating gains? It’s not winner-takes-all; it’s finding the fraction that allows *both* parties to keep playing the game profitably, indefinitely. Even building a career… or a life.  

  Which brings us to tonight. Marcus, in your own perfectly calibrated style, have asked us not to frame this as a ‘win’. Because on the geometric view, **no single point defines the path**. Celebrating tonight as the triumphant final outcome? That’s classic arithmetic-mean error! It ignores the volatility survived, the paths not taken, the optionality preserved, and the sheer *length* of the compounding curve you’ve navigated.  

  So we won’t call this a win. We’ll call it… **a phenomenally robust checkpoint.**  

  We won’t say you ‘came out ahead’. We’ll say you **architected an astonishingly resilient, anti-fragile compounding process.**  

  We won’t focus on the terminal wealth tonight. We’ll focus on the **enduring principles** you embedded – in this desk, in your colleagues, and in everyone lucky enough to know you – principles that keep compounding long after the last trade is booked. Principles that ensure the *long-run* trajectory bends towards flourishing.  

  For thirty years, you’ve been our ‘Kelly guy’, our ‘Geometric Rationalist’, our architect of robust strategies. You showed us that true success isn’t about hitting the highest number once; it’s about ensuring the *product* of your experiences, your contributions, and your relationships grows sustainably, weathering every drawdown.  

  Marcus, your career wasn’t a single spectacular trade. It was a masterclass in **optimizing the long-run growth rate of human potential** – yours, ours, and everyone touched by your wisdom and your stubborn insistence on doing the *geometrically rational* thing, whether splitting cake or sizing positions.  

  So, raise your glasses – not to a final score, but to the **shape of the path**. To the man who taught us that the most rational thing isn’t always the obvious average, but often the quiet multiplier. To Marcus: for ensuring the logarithm of our collective potential has been steadily, robustly, and brilliantly increasing for three decades. May your own compounding journey continue to be rich, resilient, and geometrically magnificent.  

  **To Marcus!**  

  ---

  **Why this works:**  

  1.  **The Dessert Analogy:** It’s warm, relatable, non-finance, and *perfectly* illustrates geometric sharing vs. arithmetic splitting. Traders immediately see it as a valid parallel to Kelly fractioning or probability pooling.
  2.  **Traders Get Precision:** Phrases like "time-average growth rate vs. ensemble-average," "maximizing median outcome," "log utility smuggled in," and "fractional Kelly" are accurate and meaningful nods. The "product of outcomes" and "surviving to compound" are core geometric rationality concepts.
  3.  **Respects His Philosophy:** Explicitly avoids "win," "came out ahead," or "final score." Replaces them with "robust checkpoint," "resilient compounding process," "enduring principles," "shape of the path," and "optimizing the long-run growth rate." Celebrates the *process* and the *durability* of his approach.
  4.  **Warmth & Universality:** The core message – focusing on what sustains and compounds over time, in life and work – resonates deeply with everyone, regardless of finance knowledge. The dessert story and closing focus on "human potential" and "collective potential" anchor it in human connection.
  5.  **The Joke/Inside Nod:** The "arithmetic mean! Disaster!" dessert moment and the line about "log utility smuggled in" are the specific, correct technical winks the traders will appreciate as authentic Marcus-isms. The whole toast *embodies* geometric thinking by refusing to declare a single-point victory.
  6.  **Celebrates Generously:** It lavishes praise on his intellect, impact, unique perspective, and legacy ("architect of robust strategies," "masterclass," "brilliantly increasing") without ever violating his core objection to arithmetic endpoint framing.

  This toast makes the geometric philosophy *the hero*, celebrating Marcus as its brilliant exponent and practitioner, ensuring both halves of the room feel seen and the man himself won't cringe at arithmetic triumphalism.
