answer: |-
  Here are six interview questions designed to push beyond surface-level defenses of the handicap principle, targeting the conceptual tensions and potential weaknesses in your guest's strong Zahavian position. Each includes a core question and a pre-emptive follow-up for likely dodges:

  1.  **Core Question (Zahavi vs. Grafen):** "Your book strongly champions Zahavi's original 1975 intuition. But Grafen's 1990 model is often seen as the formal vindication. Crucially, Grafen showed honesty emerges when the *marginal cost/benefit ratio* of signal investment differs between high and low-quality individuals, not necessarily that high absolute cost *itself* is the mechanism guaranteeing honesty. Could you clarify: Are you defending Zahavi's core claim that the *net cost* (the wasteful expenditure itself) is the essential feature that *creates* reliability, or Grafen's more precise point about the *differential* in how costs/burdens are felt?"
      *   **Follow-up for "They're aligned!" dodge:** "If they are functionally equivalent, why did Zahavi initially reject Grafen's model as a 'betrayal'? Specifically, in a scenario where a signal is cheap *but* imposes a steeper *fitness gradient* on low-quality individuals (e.g., via a physiological constraint), would Zahavi accept that as a handicap, or is the palpable *waste* indispensable for his concept?"

  2.  **Core Question (Indices & Necessity):** "A major objection to the claim that cost is *necessary* for reliable communication between parties with conflicting interests is the existence of *indices* – signals like body size, vocal tract length, or toxin levels that are physically linked to the underlying quality and thus honest *without* needing strategic cost. Getty argued forcefully that indices can sustain honest communication even in adversarial contexts, precisely *because* they are unfakeable cheaply. Doesn't this directly challenge the word 'requires' in your thesis? Why exclude indices from the domain of 'signals' relevant to reliable communication?"
      *   **Follow-up for "That's just an index!" dodge:** "Let's grant the label 'index' for signals like roar frequency correlating with body size. The key point is: this communication *is* reliable, it *is* used in contexts of potential conflict (e.g., mate choice, rivalry), and it *lacks* the strategic cost Zahavi emphasizes. If indices achieve reliable communication *without* handicap logic, how does this not falsify the *necessity* claim for cost in adversarial signaling systems?"

  3.  **Core Question (Efficacy Cost vs. Strategic Cost - Stotting Example):** "Let's take a classic putative handicap: stotting in gazelles. The jump is conspicuous and seems costly. But how do we empirically distinguish whether the *primary cost* ensuring honesty is a *strategic cost* (the energy/time/risk wasted *specifically to prove quality* – the Zahavian core) versus an *efficacy cost* (the energy/time/risk inherent *just in making the signal detectable* to the predator from a distance)? If the main 'cost' is simply the unavoidable price of being seen clearly by the predator *regardless of quality*, does that still count as a handicap in the strong sense?"
      *   **Follow-up for "It's obviously strategic!" dodge:** "What specific experimental evidence or measurable prediction *uniquely* supports the strategic cost interpretation over the efficacy cost interpretation for stotting? If both interpretations predict the signal is 'costly', how do we test which cost mechanism is actually enforcing honesty?"

  4.  **Core Question (Cheap Talk & Constrained Conflict):** "Game theory shows that 'cheap talk' – cost-free signals – can sustain informative, even perfectly honest, equilibria *if the interests of the signaller and receiver are sufficiently aligned*. For instance, within cooperative groups or kin groups. Doesn't this mean that Zahavi's necessity claim ('*requires* cost') only holds strictly in cases of *maximal* conflict of interest? And wouldn't this significantly narrow the scope of the handicap principle from a universal logic of communication to a specific tool for highly adversarial interactions, contradicting the broader claims in the human section of your book?"
      *   **Follow-up for "Human conflicts are deeper!" dodge:** "Even granting deep conflicts in *some* human domains (e.g., mating markets, status competition), cheap talk models show information can still flow freely in *other* cooperative human domains where interests overlap significantly (e.g., coordinating hunts, sharing local knowledge within a tribe). If reliable communication *without* cost demonstrably works in these contexts, doesn't that undermine the idea that our 'gut sense of who to trust' is *fundamentally* tracking handicap logic, rather than a context-sensitive blend including cheap talk when interests align?"

  5.  **Core Question (The "Index" Dodge - Conceptual Work):** "You often respond to apparent counterexamples of cheap, reliable signals by classifying them as 'indices, not signals'. This seems to do heavy lifting in protecting the 'cost is necessary' thesis. Can you explicitly define the operational distinction you use between a 'signal' (requiring cost for honesty under conflict) and an 'index' (reliably honest without strategic cost)? Specifically, where does the boundary lie, and what empirical criterion determines whether a given communicative act falls into one category or the other? Is it solely about producibility, or something else?"
      *   **Follow-up for Vague Definition:** "Take human emotional expressions: Blushing is often called an index (hard to fake). But a deliberate, controlled smile could be seen as a signal. If a low-status individual learns to produce a highly convincing, *cheap* appeasement smile that reliably reduces aggression (because it's a good enough approximation of true affiliation), does this become a counterexample? Why is this 'just an index' or not a 'true signal'? What testable feature marks it as outside the domain of the handicap principle?"

  6.  **Core Question (Human Extension - Cost or Correlation?):** "In the human section, you argue costly religious rituals or conspicuous virtue are handicaps ensuring trust. But critics (e.g., Sosis, Henrich) often argue the *cost* itself isn't the primary guarantor; instead, the *correlation* between willingness to pay the cost and underlying group commitment or prosocial traits does the work – a correlation that *could* potentially be established by cheaper means if cultural evolution found them (though it might not). How do you rule out that the observed reliability stems primarily from this correlational logic (akin to Grafen's differential, but not requiring Zahavi's *waste*), rather than the net cost *per se* being the essential certificate?"
      *   **Follow-up for "Cost creates/maintains the correlation!" dodge:** "If the correlation is the key, isn't the cost just one *possible* way to establish/maintain it, not a *necessary* feature? Couldn't a *cheap* but hard-to-fake cultural marker (e.g., a specific dialect learned young) achieve a similar correlation and thus reliable signaling of group membership/commitment, without the waste? Doesn't this suggest the handicap is sufficient, but not *necessary*, even for these human examples?"

  **Bonus (If time allows):**

  7.  **Core Question (The Book's Scope - Universal Principle?):** "Your book's title, *Costly Truths*, and its argument suggest the handicap principle is a near-universal logic underpinning reliable communication, especially where trust is vital. Yet, we've discussed indices, cheap talk under alignment, and potentially correlational mechanisms. Given these alternatives, how would you now formally delineate the *domain* where the handicap principle, in its strong Zahavian sense (net cost as certificate), is truly the *only* or the *necessary* mechanism? Is this domain smaller than implied by the book's broader claims?"

  **Key Interview Strategy:**

  *   **Listen Actively:** Pay close attention to *how* he defines terms ("signal," "index," "cost," "reliability," "conflict") in his answers. Pin him down if definitions shift.
  *   **Politely Persist:** If he uses the dodge, deploy the pre-planned follow-up calmly: "I understand you classify that as an index, but let's focus on the *mechanism* of reliability for a moment...", or "You mentioned Grafen and Zahavi are aligned, but could we focus on the *mechanistic difference* between net cost and differential cost gradients...".
  *   **Bridge Back:** Use phrases like "To bring this back to the core necessity claim..." or "So, applying that to the Zahavi/Grafen distinction we started with...".
  *   **Control the Tempo:** Don't let him filibuster. Gently interject with "That's helpful context, but to hone in on my specific question about..." or "Could we pause there and clarify [specific point] before moving on?".

  These questions force engagement with the conceptual cracks in the strong Zahavian edifice. Good luck with the interview – it sounds fascinating!
