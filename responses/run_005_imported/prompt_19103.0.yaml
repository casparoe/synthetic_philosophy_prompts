answer: |-
  This is a profoundly rich philosophical problem at the heart of your narrative, and your instincts about the core dilemma are remarkably sharp. Let's break down the theories, their handling of omissions, and the role of "duty," assessing both their strengths and costs for your purpose.

  **1. Counterfactual Theories (Lewisian Tradition)**

  *   **Core Idea:** Event C causes event E if and only if (roughly) if C had not occurred, E would not have occurred (or its probability would have been significantly different). Causation is about *dependence*.
  *   **Handling Omissions:** This theory *readily* accepts omissions as causes.
      *   **Why:** For each minor character who failed to act (let's call the omission O), the counterfactual holds: "If O had *not* occurred (i.e., if the character *had* acted as they *could* have), then the tragedy E would not have occurred." Each omission satisfies the counterfactual condition for being a cause of E.
  *   **Costs (The Proliferation Problem & Absurdity):**
      *   **Massive Over-Determination of Causes:** As you suspect, *anyone* who *could* have intervened in *any* way to prevent E, but didn't, becomes a cause. This includes:
          *   The specific minor characters you envision.
          *   People far removed (e.g., a politician who could have passed a law years earlier making such tragedies impossible).
          *   People unaware of the situation (e.g., someone who could have been present but wasn't).
          *   People who *were* present but lacked the specific knowledge/skill *you* know would have helped (if they *could* have acquired it easily, the counterfactual might hold).
      *   **Moral Neutrality:** The counterfactual is purely factual. A bystander with no relationship to the victim and no special obligation satisfies it just as much as someone with a clear duty. The cause-set includes morally innocent non-actors.
      *   **The "Pre-Emption" Problem:** If multiple omissions are individually sufficient (in the counterfactual sense) to cause E, the theory struggles to explain why E occurred only once. (This might be less relevant for your *cumulative* failure scenario, where each omission is *necessary* in the circumstances, but highlights a general issue).

  **2. Physical Process / Transference Theories (Salmon/Dowe)**

  *   **Core Idea:** Causation involves the *transfer* or *exchange* of some conserved physical quantity (like energy or momentum) from cause to effect (Salmon: causal processes; Dowe: conserved quantity transfer). Causation is about *physical connection*.
  *   **Handling Omissions:** This theory **denies** that omissions are genuine causes.
      *   **Why:** An omission is the *absence* of an event/process. Absences don't transfer energy or momentum; there's no physical process connecting the non-action to the outcome. The tragedy is caused by the *positive* physical processes that *did* occur (e.g., the chain breaking, the car swerving, the fire spreading), not by the absences of intervention.
      *   Omissions are seen as *background conditions* or *explanatory factors*, but not causes in the strict metaphysical sense.
  *   **Costs:**
      *   **Intuitive Failure:** This clashes profoundly with common sense, law, and moral reasoning. We *do* hold people responsible for failing to act in ways that could prevent harm, especially when they have a duty. The novel's core premise – that the *failures* caused the tragedy – seems metaphysically invalidated.
      *   **Explanatory Gap:** It struggles to explain why the outcome occurred *this time* when it didn't occur in similar situations *where intervention happened*. The *difference-maker* (the lack of intervention) isn't a cause.
      *   **Moral/Responsibility Disconnect:** If omissions aren't causes, assigning *causal* responsibility for outcomes stemming from failures becomes problematic, potentially undermining moral and legal responsibility.

  **Your Assessment: Roughly Right**

  You are correct: Counterfactual theories embrace omissions as causes but at the cost of absurd proliferation. Process theories avoid proliferation by denying omissions are causes, at the cost of clashing with strong intuitions about responsibility and explanation. This *is* the core dilemma.

  **3. The Law's Device: "Duty to Act" (Hart & Honoré)**

  *   **The Device:** Legal systems (especially tort and criminal law) often limit liability for omissions to situations where the defendant had a pre-existing **"duty to act."** This duty can arise from:
      *   Statute (e.g., mandatory reporting laws).
      *   Contract (e.g., lifeguard, doctor).
      *   Special Relationship (e.g., parent-child, employer-employee, innkeeper-guest).
      *   Creation of the Risk (if you created the dangerous situation).
      *   Voluntary Assumption of Care (if you started helping, you can't abandon unreasonably).
  *   **Hart & Honoré's Argument:** They argued that causation in the law isn't *just* about physics or counterfactuals. It's about identifying the *human actions* (or failures to act where duty exists) that *interfere with the normal course of events* to produce an unexpected harm. Duties help define what counts as a relevant "intervention" (positive or negative) in the causal field.
  *   **Does it Resolve the Metaphysical Dilemma?**
      *   **No, it does not resolve it metaphysically.** Hart & Honoré were primarily concerned with *legal* and *explanatory* causation in the context of assigning responsibility, not providing a fundamental metaphysics of causation.
      *   **Yes, it "smuggles in" a moral/normative judgment:** The "duty to act" is fundamentally a *normative* concept. It imports moral, social, and legal judgments about when someone *should* have acted. It doesn't magically turn an absence into a physical process. Instead, it *selects*, from the vast pool of counterfactually relevant omissions identified by Lewisian theories, a much smaller subset that are deemed *legally and morally significant* for the purpose of assigning responsibility.
      *   **It's a Pragmatic Filter, Not a Metaphysical Cure:** The duty requirement is a practical solution to the proliferation problem. It acknowledges that while *metaphysically* countless omissions might be counterfactually necessary, only those linked to a recognized normative obligation are relevant for holding someone *responsible* for the outcome. It bridges the gap between the counterfactual dependence (which captures the potential) and the process theory's need for a concrete link (by substituting a normative link for a physical one).

  **Assessment for Your Novel:**

  1.  **Metaphysical Stalemate:** There is no clean metaphysical resolution. Counterfactual theories capture the intuitive "but for" dependence of omissions but make causation ubiquitous. Process theories offer a cleaner, physical account but exclude omissions entirely, clashing with responsibility attributions.
  2.  **The "Duty" Solution is Normative, Not Metaphysical:** Hart & Honoré provide a powerful *pragmatic* tool for the law (and for your narrative) by using "duty" to filter the vast field of potential causes (omissions) down to those relevant for responsibility. This *is* smuggling in morality/norms, but that's its strength and purpose – it's designed for responsibility, not pure metaphysics.
  3.  **Narrative Implications & Apportioning Blame:**
      *   **Beyond Metaphysics:** Your narrative doesn't *need* to solve the metaphysics. It needs to convince the reader *why* these specific failures *matter* and deserve blame. The metaphysics informs the *structure* of the problem; the narrative explores its *human consequences*.
      *   **Leverage "Duty" Narratively:** This is your most potent tool for apportioning blame meaningfully and avoiding the "absurd proliferation." For *each* minor character, establish (explicitly or implicitly) why they had a *duty* to act in that specific moment:
          *   **Role/Profession:** Was it literally their job (e.g., security guard, maintenance worker, supervisor)?
          *   **Relationship:** Did they have a special connection to the victim or the situation (e.g., friend, family member, person who created the hazard)?
          *   **Capability & Awareness:** Did they uniquely see the danger unfold? Did they possess specific knowledge or skill others lacked?
          *   **Prior Commitment:** Had they implicitly or explicitly taken on responsibility (e.g., volunteered for a safety role, promised to check something)?
          *   **Societal Expectation:** Was there a basic, minimal level of decency or help expected (e.g., calling emergency services when witnessing an accident)?
      *   **Graded Blame:** Even with a duty, blame can be graded. Consider:
          *   **Clarity of Duty:** How obvious and strong was the duty?
          *   **Clarity of Danger:** How apparent was the need for intervention?
          *   **Ease of Intervention:** How difficult/safe would acting have been?
          *   **Motivation/Reason for Failure:** Fear, apathy, distraction, malice, misunderstanding? (This adds depth but doesn't negate the duty).
      *   **The Cumulative Weight:** The narrative power lies in showing how *each* failure, stemming from a lapse against a specific (even if minor) duty, was a necessary link in the chain. No single failure was *sufficient*, but each was *necessary given the prior failures*. The disaster emerges from the *pattern* of neglected duties.

  **Conclusion:**

  The philosophical terrain confirms your dilemma: counterfactual theories make omissions causes too easily, process theories deny them entirely. Hart & Honoré's "duty to act" doesn't resolve this metaphysics; it provides a normative framework for *selecting which omissions count as causes for the purpose of responsibility*. **This is precisely what your novel needs.** By carefully establishing the specific *duties* (formal or informal, strong or weak) that each minor character breached through their inaction, you can apportion blame meaningfully, avoid absurd proliferation, and ground the tragedy in a chain of recognizable human failures against expected norms. The reader will understand why *these* omissions mattered, even if a metaphysician might argue about the fundamental nature of causation. Focus on the human dimension of duty, capability, awareness, and the tragic weight of small, avoidable neglects piling up.
