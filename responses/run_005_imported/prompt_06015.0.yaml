  3. **Elena's counter**: She'd call this post-hoc justification. "If priors differ, why didn't we negotiate harder earlier?"  
  4. **Theo's pivot**: Introduce *hedging needs*. His fund has liquidity constraints—this trade hedges another position.  
  5. **Elena's skepticism**: "Then why not disclose earlier? Feels convenient."  
  6. **Theo's finale**: *Noise trader pressure*. His LPs demand action; he's mediating irrational actors.  
  7. **End unresolved**: Elena hesitates but doesn't concede.  

  For authenticity:  
