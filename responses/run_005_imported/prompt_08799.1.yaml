  Okay, let me unpack this user's question. They're a philosophy student who just covered Frankfurt's counterexample to PAP and noticed a similar idea in Locke's locked door scenario. They want to know if Locke essentially preempted Frankfurt's argument centuries earlier, and whether the differences matter philosophically.

  First, I need to recall both thought experiments clearly. Frankfurt's case involves a neuroscientist (Black) who can intervene with a brain chip to force Jones to shoot the mayor, but Jones does it willingly without intervention. Locke's scenario has a man voluntarily staying in a room, unaware he's locked in. Superficially similar - both involve constrained alternatives that don't actually affect the agent's choice.

  But why is Frankfurt considered revolutionary while Locke's version isn't? Let me dig deeper. The key difference is in what each philosopher was trying to prove. Locke was making a point about freedom as the power to act according to one's will, not about physical possibilities. His locked door example shows that as long as the agent doesn't will to leave, the inability to leave is irrelevant to whether staying is voluntary.

  Frankfurt, on the other hand, was directly targeting PAP - the principle that moral responsibility requires alternative possibilities. His brain chip scenario is designed to show that Jones can be morally responsible even when he couldn't have done otherwise (because of the chip). That's a much more specific attack on PAP than Locke's broader discussion of voluntary action.

  The user might be excited to point out this historical precedent in class, but I should warn them about the conceptual gap. While structurally similar, Locke wasn't engaging with moral responsibility like Frankfurt was. Also, Frankfurt's contemporary context matters - PAP was a hot topic in mid-20th century philosophy when he wrote.

  I should also note that some scholars do see Locke as a precursor, but the user should understand why Frankfurt had greater impact on the free will debate. Maybe suggest they frame it as "Locke anticipated the structure but not the specific application to PAP" when speaking in class.

