  So in my philosophy elective we got into Nagarjuna's tetralemma (the move where he says a claim about something can be true, false, both, or neither, and then goes through and denies all four options for stuff like causation or the self). I fell down a rabbit hole after class and found out the logician Graham Priest reads this as Nagarjuna basically accepting real contradictions, like a preview of his own "dialetheism" (paraconsistent logic where some contradictions are literally true). But apparently a bunch of Buddhist studies scholars think thats a misread, and say once you bring in the two truths doctrine (conventional vs ultimate truth) there's no actual contradiction going on. Can you compare Priest's contradiction-accepting reading with the two-truths reading and tell me which one actually fits what Nagarjuna's doing in the Mulamadhyamakakarika better, plus where the other one falls short?
