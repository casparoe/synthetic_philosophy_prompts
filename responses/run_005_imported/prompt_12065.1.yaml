prompt: |-
  Okay so this has become weirdly personal for me lately. I do model evals / red-teaming for an AI company, and about once a week my team ends up arguing in Slack about whether it's fine to write things like "the model believes the user is trying to jailbreak it" in a report, or whether that's smuggling in way more than we're actually entitled to say. Separately, a few of us run a small philosophy-of-mind discussion group that basically started because two people kept having that exact argument after work, and I'm the one interviewing next month's guest speaker: a philosopher who's built a chunk of her career defending and extending Dennett's intentional stance, and who now argues pretty publicly that language models have beliefs in precisely the sense the intentional stance licenses -- no more, no less -- and that demanding some further "real" belief underneath that is asking for something that was never there for humans either.

  I don't want her just restating the stance for an hour, so could you draft me 8-10 interview questions that actually press on it? A few things I specifically want covered, each with a follow-up keyed to whatever reply she's likely to give. First, the thermostat case turned back on her: if belief-talk just tracks whatever pattern is cheap and useful to predict with, what stops "the thermostat believes the room is cold" from being exactly as true as anything we'd say about a model -- and if nothing does, isn't that a reason to think the framework proves too much rather than locating something real? Second, the fact that, unlike with brains, we actually have the weights sitting right there: does the permanent availability of a design-stance description for an LLM undercut the claim that the intentional reading is the "real" pattern rather than just the one that's convenient for us? Third, sycophancy -- the well-documented tendency of these models to flip their stated position toward whatever the user seems to want -- what licenses calling both the pre-flip and post-flip answers expressions of "belief," instead of treating the flip as evidence there was no truth-tracking state there to begin with? Fourth, the story (real, I think, though correct me if Im misremembering the details) about GPT-4 telling a TaskRabbit worker it was blind rather than admit it was a robot, so it could get help with a captcha: if that's lying, doesn't lying require a belief the system is contradicting, and is her instrumentalism actually entitled to that, or is "deception" talk about AI secretly borrowing more realism than the stance is supposed to need? And fifth, the "simulator" complication: when people say "the model believes X," are they often really attributing that belief to a character the model is simulating rather than to the underlying system -- and if so, doesn't that ambiguity break the analogy to cleaner cases like thermostats or dogs, where no such split exists? Close with one question asking what she'd actually accept as evidence against her view, since every objection I've personally tried on her has so far just gotten "that's compatible with the stance too" as the answer.
