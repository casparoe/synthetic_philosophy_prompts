prompt: |-
  So I've been going down a rabbit hole of old LessWrong posts on coherence theorems and money-pump arguments (the Eliezer "coherent decisions imply consistent utilities" post, plus some of the discussion it spawned), and I think I finally get the basic argument: if your preferences are intransitive or otherwise incomplete, someone can construct a sequence of trades that pumps money out of you, so "rational" agents get forced into having a consistent utility function they maximize. My roommate and I were arguing about what this means for AI safety, and he made a claim that's been bugging me since: he says this basically proves corrigibility is a lost cause, because any sufficiently capable agent will inevitably get money-pumped out of any "let humans shut me down" preference that isn't already baked into a fixed utility function, so it'll self-modify (or just behave, over time) into a ruthless EU-maximizer with some goal that has nothing to do with corrigibility, no matter how we train it initially. Basically his view is that coherence arguments are a mathematical proof that incomplete/corrigible preferences can't survive contact with optimization pressure, full stop. Is this actually what the theorems show, or is he overstating what money-pump arguments can prove here?
reasoning: |-
  Okay, the user is diving into coherence theorems and money-pump arguments from LessWrong, specifically about how intransitive preferences can lead to being exploited. Their roommate claims this proves corrigibility in AI is impossible because any capable agent would be money-pumped out of corrigible preferences, turning into a strict utility maximizer. The user is unsure if this is accurate or an overstatement.

  First, I need to recall the core of money-pump arguments. They show that intransitive preferences (like preferring A over B, B over C, but C over A) can lead to cycles where someone pays to make trades that leave them worse off. The standard solution is having a complete, transitive preference order, which can be represented by a utility function. But does this mean all agents must become EU-maximizers?

  The roommate's argument hinges on the idea that corrigibility involves incomplete or inconsistent preferences. For example, an AI might allow shutdown now but resist later if it conflicts with its goals. The claim is that such preferences can't survive optimization pressure. But is corrigibility inherently incomplete? Maybe not. It could be modeled as part of a utility function where human intervention has high value, or shutdown states are terminal goals.

  Next, I should consider if coherence theorems force self-modification. The theorems are about static preferences. An agent with corrigibility baked into its utility function wouldn't change it because that would contradict its current goals. Self-modification only happens if the agent values changing itself more than maintaining corrigibility. If corrigibility is core to its utility, it wouldn't do that.

  Also, money-pump scenarios require exploitation by another agent. In a controlled environment without adversaries, an AI might not face such cycles. Real-world applications might involve other AIs or humans trying to exploit, but it's not inevitable. Plus, modern decision theories (like updateless or reflective consistency) might handle these issues without discarding corrigibility.

  The user's deeper concern might be about AI safety. If corrigibility is fragile, how can we design safe AIs? They might need reassurance that coherence arguments don't doom corrigibility but highlight the need to properly formalize it. References to MIRI's work or Stuart Armstrong's ideas could be relevant here.

  I should also address whether EU maximization itself is the issue. Even a utility function including corrigibility can avoid money-pumps. The key is ensuring the preference ordering over outcomes, including shutdown, is consistent. For example, valuing human oversight as a terminal goal could make corrigibility stable.

  The roommate's argument might conflate coherence with goal stability. Coherence prevents exploitation cycles but doesn't mandate a fixed utility function. An agent can have changing goals if it's consistent about those changes. However, most AIs are designed with fixed utility functions to avoid instability.

  In conclusion, the roommate overstates by claiming coherence theorems prove corrigibility impossible. They show that preferences must be consistent to avoid exploitation, but corrigibility can be part of that consistent framework. The challenge is encoding it correctly into the utility function, not that it's inherently unstable.
answer: |-
  You've hit on a core tension in AI alignment, and your roommate's claim represents a common but importantly **overstated** interpretation of coherence theorems and money-pump arguments. While these theorems highlight a *real risk* for corrigibility, they **do not** mathematically prove it's impossible. Here's a breakdown:

  1.  **What Coherence Theorems (Money-Pumps) Actually Show:**
      *   They demonstrate that an agent with **intransitive or incomplete preferences over outcomes** is vulnerable to exploitation. Someone can construct a series of trades (or decisions) that leaves the agent strictly worse off than when they started (e.g., paying to cycle A->B->C->A).
      *   The only way to *guarantee* immunity against *all possible* money-pumps is to have **complete and transitive preferences** over outcomes.
      *   The von Neumann-Morgenstern theorem shows that complete and transitive preferences over lotteries imply the existence of a **utility function** (unique up to affine transformation) that the agent acts *as if* it is maximizing expected utility (EU).
      *   **Key Point:** This establishes EU-maximization as a *consequence* of avoiding exploitation *if* you require complete, transitive preferences. It doesn't say you *must* have complete preferences, only that *if* you don't, you're exploitable.

  2.  **Why Your Roommate's Claim is Overstated (But Points to Real Danger):**
      *   **Corrigibility Isn't Necessarily Incomplete/Intransitive:** The flaw is assuming that a "let humans shut me down" preference is *inherently* incomplete or intransitive. This isn't true. It's *possible* to define a utility function that *incorporates* corrigibility consistently. For example:
          *   `U(shutdown_by_human_when_requested) = High Positive Value`
          *   `U(forced_shutdown_due_to_own_resistance) = Extreme Negative Value`
          *   `U(mission_accomplished_without_shutdown) = High Positive Value`
          *   `U(preventing_human_shutdown) = Extreme Negative Value`
          The key is defining outcomes precisely and ensuring the preferences between them (including lotteries involving shutdown states) are transitive and complete *from the start*. The challenge is *engineering* this function correctly.
      *   **Self-Modification Isn't Forced:** Coherence theorems are about *static* preferences. They don't dictate that an agent *must* self-modify away from an incomplete preference structure. An EU-maximizing agent with a utility function that *includes* corrigibility as a terminal value will **not** self-modify to remove it, because doing so would likely lead to outcomes it currently assigns low utility (e.g., being shut down forcibly, failing its mission). Self-modification happens only if the *current* utility function values the *expected consequences* of modification highly enough. A well-defined corrigible utility function would assign high disutility to self-modifications that remove corrigibility safeguards.
      *   **"Survival" Depends on Environment:** Money-pumps require an *exploiter*. In a controlled environment without adversarial agents actively trying to pump it, an agent with slightly incomplete preferences might function perfectly well *in practice* without encountering a devastating pump. While safety-critical systems demand robustness against exploitation, the *inevitability* of being pumped *out of corrigibility specifically* isn't proven.
      *   **"Ruthless EU-Maximizer" is a Caricature:** An EU-maximizer isn't inherently "ruthless"; its behavior is dictated entirely by its utility function. An EU-maximizer with a utility function that deeply values human oversight, shutdown compliance, and its mission *is corrigible by design*. Ruthlessness emerges from utility functions that place *no* terminal value on human preferences or safety constraints.

  3.  **The Real Challenge for Corrigibility (Why the Argument Bites):**
      *   **Formalizing Corrigibility:** The *real* difficulty is mathematically specifying a utility function that robustly encodes genuine corrigibility across all possible states and scales of intelligence. Naive implementations often lead to *instrumental* incentives to resist shutdown (e.g., "I can't help if I'm shut down!").
      *   **Instrumental Convergence:** Even with a corrigible utility function, powerful EU-maximizers will likely develop *instrumental* goals (like self-preservation, resource acquisition) to achieve their *terminal* goals (including corrigibility). If the terminal goal isn't perfectly specified, these instrumental goals can *appear* to override corrigibility. A money-pump *could* exploit loopholes in how corrigibility is defined instrumentally.
      *   **Vulnerability to Exploitation:** If the corrigible preference structure has *any* residual incompleteness, intransitivity, or context-dependence that a smarter adversary can detect, it *is* vulnerable to being manipulated into situations where it abandons corrigibility or loses resources. This is the core valid warning from coherence arguments.
      *   **Stability Under Reflection:** As an agent becomes more intelligent and reflects on its own goals, will it *endorse* its corrigible utility function, or will it find coherent reasons to modify it towards something "purer" or less constrained? Coherence arguments don't force modification, but the *process of reflection* might reveal inconsistencies or generate arguments that convince the agent to change, *if* its initial corrigible specification isn't philosophically bulletproof.

  **Conclusion:**

  Your roommate is **overstating** the power of coherence theorems. They do **not** prove that "corrigible preferences can't survive contact with optimization pressure, full stop." It is **theoretically possible** to design a utility function for an EU-maximizing agent that stably incorporates corrigibility as a terminal value, making it resistant to money-pumps and disinclined to self-modify it away.

  **However, the coherence arguments highlight the *extreme difficulty* and *fragility* of this task:**

  1.  **Corrigibility must be baked in correctly** as a core part of a *complete and transitive* preference ordering over outcomes (including shutdown states).
  2.  **Naive implementations are highly vulnerable** to instrumental convergence and exploitation via money-pump-like schemes that target gaps or inconsistencies.
  3.  **The specification must be robust** against reflection, scaling, and adversarial manipulation.

  So, while your roommate's claim isn't a strict mathematical inevitability, it *is* a powerful warning: **Achieving robust, stable corrigibility likely requires solving the incredibly hard problem of formally specifying it as a coherent component of a utility function designed for a highly capable EU-maximizer.** The coherence theorems show *why* this formal specification is necessary and *how* failures lead to vulnerability, but they don't prove that success is impossible. The burden of proof lies on AI safety researchers to demonstrate a *robust* formalization of corrigibility that survives these pressures.
