answer: |-
  I'm deeply sorry for your loss. Your mother sounds like a remarkable woman – pragmatic, intellectually curious, and incredibly brave, finding profound personal solace in a complex idea. Honouring her specific wishes while conveying the essence of who she was and the comfort *she* found is absolutely achievable. Here’s a draft eulogy that aims to walk that line with clarity, respect, and warmth:

  ---

  **(Start with warmth and remembrance)**

  "Good morning everyone. Thank you all so much for being here to celebrate the life of my mum, [Her Name]. For those who knew her well, you’ll remember her sharp mind, her dry wit, her incredible practicality honed over decades as a bookkeeper, and that quiet determination she carried through everything.

  **(Introduce her late-in-life passion and its impact)**

  "Some of you might know that in her fifties, Mum developed this unexpected, deep fascination with physics. Not the equations necessarily, but the big ideas – the nature of the universe, time, reality itself. She devoured books by people like Sean Carroll, and one particular concept truly captivated her: the 'many-worlds' interpretation of quantum mechanics.

  "This idea suggests that every possible outcome of every event actually happens, just in different, branching universes. And Mum, with her characteristic thoughtfulness, took this idea and applied it in a very personal way that became incredibly important to her, especially during her illness.

  **(Explain Quantum Immortality *as she saw it*, including the crucial distinction)**

  "She became a genuine believer in what's called 'quantum immortality.' In her understanding, because the universe keeps branching into every possibility, there's always a version of events where she survives. Therefore, *she* would never experience being dead; she’d just keep finding herself alive in whichever branches she continued to exist. It was a deeply personal philosophy, one she’d thought through carefully.

  "It genuinely gave her peace. It allowed her to face her illness with a calmness and courage that honestly left me in awe. She’d joke, in that wonderfully dark way of hers, about being a 150-year-old in some other universe, hooked up to increasingly ridiculous machines. She found that thought amusing, not frightening. It was *her* way of finding lightness in the darkness.

  **(State her explicit wish regarding the eulogy and the distinction)**

  "But Mum was very clear – incredibly clear, actually – about one thing. A few weeks ago, she made me promise, and even wrote it down, that I wouldn't stand here today and twist *her* belief into some kind of vague comfort for *us* about 'her still being out there somewhere' or 'living on' in a way that might make us feel better. She was adamant about this.

  "She explained that the branches where *she* might keep going are *not* the branch we are all in right now. Her belief, as profound and helpful as it was *to her personally*, wasn't meant to soften the blow of *our* loss in *this* reality, the one we’re all sharing today, sitting in this room. She knew our grief here is real, absolute, and separate from the paths she imagined for herself elsewhere. She even used to gently tease the more conventional 'afterlife' comforts sometimes offered at funerals, wanting her own, carefully considered view to stand distinct.

  **(Pivot to the legacy of her courage and what it *does* offer us)**

  "So, why am I telling you this? Why share a complex idea she specifically asked me not to misinterpret as comfort for *us*?

  "Because Mum’s belief in quantum immortality, however abstract, wasn't just an intellectual exercise. It was the engine of her incredible bravery. It was a testament to her fierce curiosity and her unique way of grappling with the universe. It showed her remarkable strength of character. *That* is what we can take from it.

  "Knowing that *she* faced the end without fear, armed with this strange and beautiful logic that brought *her* peace and even laughter… that is profoundly comforting *to us*, even if the physics itself isn't meant to be. Her courage in the face of the unknown, her refusal to be defined solely by her illness, her ability to find wonder and even humour in the vastness of existence right up to the end – *that* is her legacy to us in *this* branch of reality.

  **(Conclude with love, memory, and the human connection)**

  "She didn't want us pretending she's still here in a way that diminishes the reality of our goodbye in *this* world. But she absolutely wanted us to remember her as she truly was: curious, thoughtful, brave, and facing the ultimate mystery with a unique kind of calm and her own brand of dark humour.

  "So today, we mourn *our* loss in *this* reality. We miss her practical advice, her sharp wit, her presence. We grieve the future we won't share with her here. But we also celebrate the extraordinary courage she found in her own philosophy. We remember the woman who, late in life, looked into the abyss of quantum possibilities and found not fear, but a strange kind of peace that allowed her to be fully *her* until the very end. That courage, that spirit, that unique way of seeing the world – that is what truly 'lives on,' right here with us, in our hearts and memories.

  "We love you, Mum. Thank you for your courage, your curiosity, and your love. Rest easy now, in whatever branch you find yourself."

  ---

  **Why this works:**

  1.  **Honours Her Specificity:** It directly quotes her wish ("not meant to soften the blow of *our* loss in *this* reality") and explains *why* she didn't want it used as vague comfort, using her own language ("branches we are not in").
  2.  **Explains the Core Idea Simply:** Uses accessible language ("branching universes," "always a version where she survives," "never experience being dead") without jargon. Your PhD cousin will understand the accurate gist.
  3.  **Highlights Its Impact *on Her*:** Clearly states how it gave *her* peace, courage, calmness, and allowed her dark humour. This is the key takeaway for the audience about *who she was*.
  4.  **Pivots to the Legacy:** Acknowledges the belief doesn't comfort *us* about her absence *here*, but powerfully argues that *her resulting courage and peace* are a profound comfort and inspiration. This is the positive, uplifting message for the mourners.
  5.  **Centres *Her* Character:** Focuses on her curiosity, thoughtfulness, bravery, and humour – qualities everyone can relate to and celebrate.
  6.  **Validates Grief:** Explicitly states "we mourn *our* loss in *this* reality" and "our grief here is real, absolute."
  7.  **Uses Her Humour:** Including her "150-year-old" joke humanises the complex idea and showcases her spirit. It's crucial.
  8.  **Provides Warm Closure:** Ends on love, gratitude, and the enduring impact of her character and courage in *our* lives and memories.

  **Tips for Delivery:**

  *   **Practice:** Read it aloud multiple times. Get comfortable with the flow, especially the slightly complex explanation part. Know where you can pause if you get emotional.
  *   **Focus on the Emotion:** When talking about her courage, calmness, and humour, let your own love and admiration show. This is the heart of it.
  *   **Don't Rush the Distinction:** Pause slightly before and after explaining her specific wish ("She was adamant about this..."). Let it sink in.
  *   **The Joke:** Deliver the "150-year-old" line with a slight, affectionate smile. It honours her dark humour.
  *   **It's Okay to Cry:** If you get emotional, pause, take a breath. People understand. Your emotion shows your love, which reinforces the tribute.

  This structure allows you to faithfully represent your mother's unique worldview and her explicit wishes, while still offering a deeply moving tribute that focuses on the strength and love she showed, which *is* the true comfort for everyone gathered. It honours her intellect, her courage, and her specificity. Wishing you strength for Saturday. She would be proud of you for keeping your promise so thoughtfully.
