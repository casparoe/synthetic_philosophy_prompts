prompt: |-
  I sit on the health technology assessment committee that decides which treatments our health system will fund, using cost-per-QALY thresholds to compare across unrelated conditions. We keep deferring the same methodological question: whether the utility weights behind those calculations should come from people currently living with a given health state, or from members of the general public asked to imagine living with it. The two sources reliably diverge—patients tend to rate their own state higher than the public expects, and the gap varies by condition—so the choice is not neutral: this cycle, two proposals competing for the same fixed budget would be funded in the opposite order depending on which source of weights we use. Draft the committee's decision memo recommending which source we should adopt going forward, or how to combine them, with an operational rule members can apply in future cycles and a candid account of the strongest objection to whichever recommendation you make.
reasoning: |-
  Okay, the user is part of a health technology assessment committee that decides which treatments get funded. They're stuck on whether to use utility weights from patients who are actually living with a health condition or from the general public who imagine what it's like. This decision matters because the two groups give different ratings—patients rate their own condition higher than the public expects—and this affects which treatments get funded when budgets are tight.

  The user's main request is for a decision memo that recommends a specific approach, along with an operational rule for future use and a candid account of the strongest objection. But looking deeper, they're probably grappling with ethical tensions: valuing patient experiences versus societal fairness, and needing a transparent, defensible method to avoid constant debates. There might be unspoken concerns about bias accusations or criticism from patient groups and policymakers.

  The memo needs to balance technical rigor with practical clarity. The recommendation should prioritize public weights as the primary source because it aligns with the societal perspective—QALYs are about distributing resources across all conditions, so the public's valuation reflects how society values different health states. However, patient weights shouldn't be ignored; they offer insights into adaptation and resilience. A hybrid approach could work, using public weights as the default but adding patient narratives or sensitivity analyses for context.

  The strongest objection would come from patient advocates arguing that public weights undervalue lived experiences, potentially discriminating against chronic conditions where adaptation occurs. To address this, the memo should acknowledge the objection and suggest ways to incorporate patient input without compromising consistency.

  For the operational rule: public weights as primary, with a requirement to document patient-reported utilities and explore gaps in sensitivity analyses. This keeps the process standardized but nuanced. The memo should be candid about trade-offs—no perfect solution, but this approach maintains fairness while respecting patient voices indirectly.
answer: |-
  ## HTA Committee Decision Memo: Sourcing of Health State Utility Values for QALY Calculations

  **Date:** October 26, 2023  
  **To:** HTA Committee Members  
  **From:** [Your Name/Chair Name], Methodology Subcommittee Lead  
  **Subject:** Recommendation on Sourcing Health State Utility Values: Patient-Reported vs. Public Valuation  

  **1. Issue:**  
  The committee consistently faces a critical methodological decision impacting funding prioritization: whether Quality-Adjusted Life Year (QALY) calculations should derive health state utility values (HSUVs) from individuals *currently experiencing* the health state ("Patient-Reported Utilities" - PRU) or from members of the *general public* asked to imagine being in that state ("Public Valuation Utilities" - PVU). Empirical evidence confirms systematic divergence: patients typically assign higher utilities to their own health state than the public assigns when imagining it. The magnitude of this "adaptation gap" varies significantly across conditions (e.g., larger in stable chronic disabilities like blindness or mobility impairment, smaller in acute pain states). This choice is not neutral; it directly alters the cost-per-QALY ranking of interventions, as evidenced by the current funding cycle where two proposals swap priority based on the source used.

  **2. Recommendation:**  
  **The committee should adopt Public Valuation Utilities (PVU) as the primary source for health state utility values in base-case QALY calculations.**  

  **3. Justification:**  
  *   **Societal Perspective Alignment:** The fundamental purpose of HTA in our health system is to allocate finite resources *across* all conditions to maximize health benefits for the *population as a whole*, representing a societal perspective. PVU inherently reflects how the general public (representing society) values different health states relative to each other when making resource allocation trade-offs. PRU reflects the value *after* adaptation, which is context-specific and may not represent societal willingness to trade resources *for* that health state versus others.
  *   **Consistency and Comparability:** Using PVU ensures a consistent valuation framework applied uniformly across *all* conditions and interventions. This is essential for fair comparison. PRU introduces variability based on the degree of adaptation (which differs by condition and individual), potentially advantaging interventions for conditions where adaptation is more profound and disadvantaging those for conditions where it is less so or where adaptation is inherently difficult (e.g., severe depression).
  *   **Avoiding Systematic Bias:** The "adaptation gap" introduces a systematic bias if PRU is used. Interventions for conditions with large adaptation gaps would appear less cost-effective (because the utility gain from treatment seems smaller) compared to interventions for conditions with smaller gaps, regardless of the objective severity or treatability. PVU provides a more stable baseline valuation.
  *   **Reflecting Opportunity Cost:** PVU better captures the societal "opportunity cost" – the value of health benefits foregone by funding one intervention over another. It represents the value society places on *avoiding* a health state, which is central to allocation decisions.

  **4. Operational Rule for Future Cycles:**  
  *   **Base Case Analysis:** The primary cost-per-QALY calculation submitted by sponsors and used by the committee for initial ranking and funding decisions **must utilize health state utility values derived from representative samples of the general public using validated valuation techniques (e.g., Time Trade-Off (TTO), Standard Gamble (SG), or Visual Analogue Scale (VAS) framed as "imagine yourself in this state").**
  *   **Mandatory Supplementary Analysis:** All submissions **must also include** a parallel analysis using Patient-Reported Utilities (PRU) derived using the *same* descriptive system (e.g., EQ-5D-5L) from a representative sample of patients *living with* the relevant health state(s).
  *   **Committee Deliberation Requirement:** When reviewing submissions, the committee **must explicitly examine and discuss**:
      1.  The magnitude and direction of the difference between PVU and PRU for the relevant health states.
      2.  Potential reasons for the gap (e.g., adaptation, response shift, differences in framing).
      3.  The implications of this gap for the interpretation of the base-case cost-per-QALY results.
  *   **Sensitivity Analysis:** The potential impact of using PRU instead of PVU **must be explored** in deterministic or probabilistic sensitivity analyses presented in the submission and considered by the committee. Significant reversals in cost-effectiveness conclusions based on the source warrant heightened scrutiny.
  *   **Exceptional Circumstances (Requiring Supermajority Vote):** If the committee believes the PVU demonstrably fails to capture critical aspects of a specific health state *and* PRU provides uniquely valid insights not otherwise incorporable (e.g., for very rare conditions with no feasible public valuation study, or states involving complex cognitive/experiential aspects poorly imagined by the public), it may vote (requiring a 2/3 supermajority) to use PRU *specifically for that condition/intervention in that cycle*, with a requirement to document the justification exhaustively.

  **5. Strongest Objection to this Recommendation:**  
  **The strongest and most ethically charged objection is that prioritizing PVU systematically devalues the lived experience of patients, particularly those with chronic conditions or disabilities, and may lead to discrimination against interventions that improve their lives.**  

  *   **Undervaluing Adaptation & Resilience:** Critics argue that PVU, based on the dread of the healthy public, fails to recognize the human capacity for adaptation, resilience, and finding meaning and value within a changed health state. Using PVU implies that this adaptation is irrelevant to societal valuation, potentially characterizing patients' reported higher quality of life as "mistaken" or less valid.
  *   **Disability Discrimination Concern:** This approach risks reinforcing a "medical model" view that defines disability primarily as a deficit to be fixed according to non-disabled norms, rather than recognizing diverse experiences of well-being. It may systematically disadvantage treatments for conditions where adaptation is significant (e.g., mobility aids, therapies for stable spinal cord injury) compared to treatments for acute conditions with little adaptation time, even if the former significantly improve patients' self-reported quality of life.
  *   **Erosion of Patient Autonomy & Voice:** Prioritizing the hypothetical judgments of the public over the actual reported experiences of patients can be seen as disregarding patient expertise on their own lives and undermining patient-centered care principles within the HTA process itself. It risks reducing patients to passive subjects of societal valuation rather than agents whose self-assessment matters.

  **6. Committee Decision:**  
  This memo represents the formal recommendation of the Methodology Subcommittee. A vote of the full HTA Committee is required to adopt this policy for future funding cycles, starting with the next review period. The recommendation, operational rule, and candid acknowledgment of the significant objection are presented for your consideration.  

  **Approved:** _________________________ (Committee Chair)  
  **Date:** _________________________  

  ---

  **Key Rationale Summarized:** While deeply respectful of patient experience, the core mandate of maximizing population health benefit from a fixed budget necessitates a consistent societal valuation framework. PVU provides the most stable, comparable, and theoretically aligned basis for cross-condition prioritization. The operational rule ensures patient perspectives are rigorously examined and their potential impact on decisions is transparently evaluated, mitigating the risk of completely overlooking the adaptation phenomenon while maintaining the primary foundation needed for equitable allocation. The strongest objection regarding devaluation of lived experience is acknowledged as a profound ethical tension inherent in societal resource allocation, not resolved by this choice but managed through structured deliberation and exceptional safeguards.
