answer: |-
  That's a fascinating and historically significant debate! You're absolutely right that Douglass underwent a profound intellectual shift around 1851, moving from the Garrisonian "covenant with death" view to arguing the Constitution was, in its *principles* and *text*, **anti-slavery**. This wasn't naive idealism, but a sophisticated and strategic reinterpretation grounded in textual analysis and political philosophy. Here's a breakdown of his reasoning:

  1.  **Separating Text from Intent (and Practice):**
      *   Douglass conceded that the *framers* were largely pro-slavery men who made concessions *to* slavery (like the 3/5ths clause, fugitive slave clause, and the 20-year protection of the slave trade).
      *   **Crucial Distinction:** However, he argued that the *actual words written in the Constitution* did not establish slavery as a fundamental principle of the government. The words "slave" and "slavery" are conspicuously absent. Instead, it used neutral terms like "persons," "other persons," "person held to service or labour," "people," and "citizens."
      *   **His Argument:** The Constitution created a government based on principles of liberty, justice, and the general welfare. The pro-slavery clauses were *exceptions* grafted onto this fundamentally anti-slavery framework, forced by political necessity, not foundational principles. They *acknowledged* the *existence* of slavery but did not *morally sanction* it as a right or mandate its *perpetuation*.

  2.  **Focusing on Principles & Preamble:**
      *   Douglass pointed to the **Preamble** as the Constitution's moral compass: "to form a more perfect Union, establish Justice, insure domestic Tranquility, provide for the common defence, promote the general Welfare, and secure the Blessings of Liberty to ourselves and our Posterity."
      *   **His Argument:** How can a document dedicated to "Justice," the "general Welfare," and "the Blessings of Liberty" be inherently pro-slavery? Slavery is the *antithesis* of these stated goals. The Preamble's principles provided the *standard* against which all other clauses, including the pro-slavery concessions, should be interpreted and ultimately judged.

  3.  **Reinterpreting the "Pro-Slavery" Clauses:**
      *   **Three-Fifths Clause (Art I, Sec 2):** Garrisonians saw this as valuing slaves as property. **Douglass argued:** It was actually a *limitation* on slaveholding power. If slaves had been counted as whole persons, the Slave States would have had *even more* representation in Congress and the Electoral College. The clause *reduced* their political power compared to counting slaves fully.
      *   **Fugitive Slave Clause (Art IV, Sec 2):** Seen as mandating federal support for slavery. **Douglass argued:** It only required that a person "held to service or labour" (note, not called a "slave") fleeing to another state "shall be delivered up." Crucially, it did *not*:
          *   Specify *how* this was to be done (leaving room for state resistance or federal inaction).
          *   Create a national slave-catching apparatus (that came later with the Fugitive Slave *Acts*).
          *   Define *who* was a slave – it assumed state law defined that status. The *federal government* wasn't affirmatively establishing slavery itself.
      *   **Slave Trade Clause (Art I, Sec 9):** Protected the importation of slaves for 20 years. **Douglass argued:** This was a temporary, expiring concession, not a permanent endorsement. Furthermore, it explicitly gave Congress the power to *abolish* the trade after 1808, which it did. This showed slavery's foothold was temporary and could be dismantled.
      *   **"Domestic Insurrections" Clause (Art I, Sec 8 & Art IV, Sec 4):** Seen as protecting slavery from rebellion. **Douglass argued:** It referred generally to rebellions or invasions, not *specifically* to slave revolts. Its application was broad.

  4.  **The Power to Abolish Slavery:**
      *   Douglass identified key constitutional powers that could be wielded *against* slavery:
          *   **The Preamble's Principles:** As the foundation for all interpretation.
          *   **General Welfare Clause (Art I, Sec 8):** Slavery was detrimental to the nation's general welfare.
          *   **Power to Regulate Commerce (Art I, Sec 8):** Could be used to restrict or abolish the interstate slave trade.
          *   **War Powers (Art I, Sec 8):** Could be used to emancipate slaves as a military necessity (as Lincoln later did).
          *   **Power over Territories and New States (Art IV, Sec 3):** Could prohibit slavery in territories and require free state constitutions.
          *   **Fifth Amendment Due Process:** Could be argued that enslaving a person without trial violated due process (though this was a harder sell pre-14th Amendment).

  5.  **Was Douglass a Wishful Idealist? A Sophisticated Argument:**
      *   **No, it was strategic realism:** Douglass wasn't ignoring the framers' racism or the pro-slavery *practice* of the government. He was engaging in a deliberate act of **interpretive resistance**.
      *   **Textual Ambiguity as Opportunity:** He exploited the fact that the Constitution, while accommodating slavery through compromise, never *explicitly* enshrined it as a positive good or a permanent national institution. Its language was ambiguous enough to allow an anti-slavery reading.
      *   **Leveraging Principles:** He used the document's own stated principles of liberty and justice as a weapon against the institution those principles condemned.
      *   **Political Necessity:** He understood that abandoning the Constitution as irredeemably pro-slavery ceded the foundational legal document of the nation entirely to the slaveholders. To have a viable political strategy for abolition *within* the system, an anti-slavery reading of the Constitution was essential. It provided a legal and moral basis for political action.
      *   **"Higher Law" Compatible:** Douglass still believed in a "higher law" of morality (like Garrison), but he argued that the Constitution, *properly interpreted*, was *not in conflict* with that higher law on the fundamental question of human liberty.

  **The Philosophical Core: Can Meaning Diverge from Intent?**

  Douglass's argument is a powerful historical example of why **textual meaning is not solely determined by authorial intent**:

  1.  **The Text Itself:** The written words have an existence independent of the framers' minds. Their specific *choice* to use neutral terms ("persons," "service or labour") instead of explicitly endorsing "slavery" or "property in man" created an objective ambiguity.
  2.  **Principles as Framework:** The document established overarching principles (Preamble) that provide a context for interpreting specific clauses. Principles can evolve in their application and demand reinterpretation of compromises that violate them.
  3.  **The "Rule of Law" vs. "Rule of Men":** Douglass argued for governance based on the *written law* and its principles, not the subjective (and often deplorable) intentions of long-dead men. The law's meaning must be found in its text and its alignment with fundamental justice, not secret diaries or racist beliefs.
  4.  **Living Document (Implicitly):** While not using modern terms, Douglass's approach is a precursor to the idea of a "living constitution." He argued that the *potential* for justice and liberty embedded in the text's principles could and *should* be realized, even if the framers failed to live up to them. The text contained the seeds of its own redemption.

  **Conclusion:**

  Your friend is correct that Douglass *once* held the Garrisonian view and that the framers intended pro-slavery concessions. However, dismissing his later, mature position as "unfair" ignores the power and sophistication of his reinterpretation. Douglass didn't deny the ugly compromises; he brilliantly separated the compromised *intentions* and *historical practice* from the *textual potential* and *declared principles* of the Constitution. He argued that the document, read faithfully to its own words and highest ideals, provided the tools and the mandate to dismantle slavery. This wasn't wishful thinking; it was a radical, strategic, and intellectually rigorous act of reclaiming the nation's founding charter for the cause of freedom. His 1852 speech "What to the Slave is the Fourth of July?" masterfully uses this very tension between the nation's ideals and its practices to devastating effect. His later view is arguably his most significant and enduring contribution to American political thought.
