  CDT uses do-calculus or causal models. In Newcomb's, the causal graph has the prediction causing the box content, and the choice doesn't affect the content. So two-boxing is better causally. In Death in Damascus, the causal graph has prediction causing Death's location, and the agent's choice causing their location. But Death's location and agent's location are correlated via the prediction. When CDT evaluates "do I flee", it sets the agent's location to Aleppo. But Death's location is still set by the prediction. Since the prediction is based on what the agent would do, if the agent is set to flee, then the prediction would have been that they flee, so Death is in Aleppo. So even in CDT's calculation, if they flee, Death is likely in Aleppo. Similarly for staying. So both actions lead to death. So CDT is indifferent. But why is that a problem?

