prompt: |-
  So the Liar paradox ("this sentence is false") messes with classical logic because it's neither true nor false, or maybe both, depending which fix you like. Curry's paradox ("if this sentence is true, then everything is true") seems like basically the same self-reference trick just dressed up differently. So shouldn't whatever move fixes the Liar -- dropping bivalence, going paraconsistent, whatever -- automatically defuse Curry's paradox too? Why do people act like Curry needs its own totally seperate treatment?
