prompt: |-
  rewatching Ruth Chang's 'How to Make Hard Choices' TED talk for a piece and got stuck on her claim that when two options cant be ranked as better, worse, or equal, they might still be 'on a par.' can you compare that specific 'parity' move with the more general, fuzzier everyday idea that the values at stake are just incommensurable, apples-to-oranges, no common scale? is she actually carving out a new evaluative relation there, or is 'on a par' basically just a rebrand of plain old incomparability?
reasoning: |-
  Okay, the user is diving into Ruth Chang's concept of "on a par" from her TED talk and comparing it to everyday ideas of incommensurability. Let me start by recalling Chang's main argument. She distinguishes between options that are incomparable and those that are on a par. The key point is that when choices aren't better, worse, or equal, they might still be comparable through parity.

  The user is questioning whether "on a par" is just a rebrand of incomparability. I need to clarify the difference. Incomparability usually means no basis for comparison at all, like apples and oranges. But Chang's parity suggests that while there's no single scale, the values are comparable through a "covering value." For example, choosing between careers might involve multiple factors under a broader value like "fulfillment."

  I should explain how parity allows for justified choices without a common measure. The user might be conflating incommensurability (no common measure) with incomparability (no comparison possible). Chang argues that even without a common measure, choices can be reasoned through creating reasons. This is crucial because it frames hard choices as opportunities for self-definition.

  The user's deeper need might be understanding how this concept applies to real-life decisions. They might be writing a piece that requires explaining why some choices aren't arbitrary despite lacking objective metrics. Emphasizing the agency in committing to one option over another could address their unspoken interest in decision-making autonomy. Also, distinguishing parity from vague incommensurability can help their audience grasp structured yet subjective evaluation.
answer: |-
  Ruth Chang's concept of "on a par" is **fundamentally distinct** from the general idea of incommensurability/apples-to-oranges/no common scale, although they share a starting point. She is indeed carving out a *new evaluative relation*, not merely rebranding incomparability.

  Here's a breakdown of the key differences:

  1.  **The Problem: Failure of Standard Rankings (Better/Worse/Equal)**
      *   **Common Ground:** Both concepts start from the observation that for many hard choices (e.g., career A vs. career B, city X vs. city Y), the options cannot be ranked as one being *better than* the other, *worse than* the other, or *exactly equal* to the other.

  2.  **Interpretation 1: Incommensurability / Apples-to-Oranges**
      *   **Meaning:** This view holds that the *values* underlying the options are fundamentally different kinds of "good" that cannot be measured against each other on *any common scale*. There is *no basis for comparison whatsoever*.
      *   **Implication for Choice:** If the options are truly incommensurable, choosing between them is essentially *arbitrary* or based purely on non-rational factors (whim, mood, flipping a coin). Reason cannot guide the choice because reason requires some common ground for assessment. The choice is "hard" because reason is *silent*.
      *   **Analogy:** Comparing the beauty of a sunset to the truth of a mathematical theorem. There's no shared dimension on which to place them meaningfully.

  3.  **Interpretation 2: Parity ("On a Par")**
      *   **Meaning:** Chang agrees the options aren't better/worse/equal. However, she argues they *are* comparable, just in a different way. The values are *comparable* (they are both "good" in ways relevant to the choice), but they are *not reducible* to a single scale or converted into a common currency (like utility or dollars). The comparison happens through a "covering value" (e.g., "overall choiceworthiness" for your life) that encompasses the diverse values at stake.
      *   **The Crucial Move:** When neither option is better, worse, or equal, and *after careful consideration*, the options can stand in a *fourth* relation: **parity**. This means:
          *   They are in the same "ballpark" of overall choiceworthiness.
          *   Small improvements or worsenings to *one* option wouldn't necessarily tip the scales decisively against the other (unlike with equality, where any change breaks it).
          *   Yet, they *can* be meaningfully compared and a *reasoned choice* is possible.
      *   **Implication for Choice:** **This is where Chang innovates.** Parity doesn't make choice arbitrary. Instead, it *creates the space for agency*. When options are on a par, your choice isn't dictated by reason (as it would be if one were better). Instead, *you* get to **create reasons** through your commitment. By choosing one option over the other when they are on a par, you *make* that option better *for you*. Your will, your commitment, your endorsement *settles* the comparison. The choice is "hard" not because reason is silent, but because reason leaves room for your will to determine what kind of person you are.
      *   **Analogy:** Choosing between two fundamentally different but excellent novels for a prestigious literary prize. Neither is objectively "better" literature overall (they excel in very different ways - intricate plot vs. profound character study). A small improvement in one character's dialogue wouldn't automatically make it the winner. But the judges *can* compare them under the covering value of "literary merit for this prize." Their eventual choice isn't arbitrary; it involves deliberation about the *kind* of literary excellence they want to endorse this year, and their choice *creates* the winner.

  **Key Distinctions Summarized:**

  | Feature          | Incommensurability (Apples/Oranges) | Parity ("On a Par")                 |
  | :--------------- | :---------------------------------- | :---------------------------------- |
  | **Comparable?**  | **No** - No basis for comparison    | **Yes** - Under a covering value    |
  | **Nature**       | Values are different *kinds*        | Values are comparable but *not fungible* |
  | **Reason's Role**| Silent - Choice is arbitrary        | Defines the space - Choice requires commitment |
  | **Choice Basis** | Non-rational (whim, coin flip)      | **Rational commitment** - Creates reasons |
  | **Outcome**      | Arbitrary selection                 | **Self-definition**                 |
  | **Hard Because** | No rational grounds exist           | Reason allows will to determine value |

  **Is it a Rebrand? No.**

  Chang is explicitly rejecting the idea that the *only* possibilities when standard rankings fail are incomparability (incommensurability) or rough equality. She argues that "on a par" is a genuinely distinct fourth relation with unique characteristics (like the stability against small improvements). More importantly, she imbues this relation with profound *normative significance*: it's the domain where our commitments create reasons and define who we are. This agency-focused conclusion is entirely absent from the standard "apples-to-oranges" view, which sees choice in these situations as fundamentally non-rational.

  In essence: **Incommensurability says reason is silent. Parity says reason sets the stage for your will to speak.** That's a significant and novel evaluative move.
