answer: |-
  You've nailed the core tension perfectly! The Frankfurt case (with Jones and Black) *is* famously used as a defense *of* moral responsibility *even when* someone couldn't have done otherwise. Your intuition that it seems backwards is understandable, but let's break down why Frankfurt (and compatibilists) argue it actually *undermines* the idea that "could have done otherwise" (PAP) is necessary for responsibility:

  1.  **The Target: The Principle of Alternate Possibilities (PAP)**
      *   PAP states: **A person is morally responsible for what they did *only if* they could have done otherwise.**
      *   This principle is often used by incompatibilists (especially libertarians) to argue that determinism (which implies you *couldn't* have done otherwise) rules out moral responsibility.
      *   PAP seems intuitive: If you *had* to do X, how can you be blamed for doing X?

  2.  **Frankfurt's Strategy: Show PAP is False**
      *   Frankfurt wants to show that **moral responsibility is compatible with the *inability* to do otherwise.**
      *   His method: Present a case where:
          *   (a) The agent *cannot* do otherwise (Black ensures Jones shoots).
          *   (b) The agent is *clearly* morally responsible (Jones shoots for his own reasons, wholeheartedly, without Black intervening).
      *   If both (a) and (b) are true, then PAP must be false. Responsibility can exist *without* the ability to do otherwise.

  3.  **Why Jones is Responsible (According to Frankfurt): The "Actual Sequence"**
      *   The key insight is **what *actually* caused Jones's action.**
      *   **Black never intervened.** Jones's decision-making process was entirely his own. He deliberated, formed the intention to shoot, and acted on it based on *his* desires, *his* values, *his* reasons. Black's mechanism was irrelevant *in the actual sequence of events* that led to the shooting.
      *   Jones's action **flowed from his own will and character.** He wasn't coerced, brainwashed, hypnotized, or physically forced *in the actual sequence*. He did it *because he wanted to*.
      *   **The "could not have done otherwise" condition is a *counterfactual* guarantee (Black *would* have intervened *if* Jones wavered). But it played **no causal role** in Jones's actual choice.** It's like a safety net that wasn't used. The fact the net was there doesn't change the fact that the trapeze artist performed the jump entirely under their own power.

  4.  **Why Your Intuition is Understandable (But Frankfurt Disagrees)**
      *   You're focusing on the **lack of alternatives** ("Jones literally could not have done otherwise"). This feels like it *should* absolve him.
      *   Frankfurt agrees the lack of alternatives is real, but argues it's **irrelevant to responsibility *in this specific scenario***. Why? Because the lack of alternatives didn't *cause* or *compel* Jones to act. Jones acted freely *within* the constraint imposed by Black's setup. His action was still authentically *his*.
      *   **Analogy:** Imagine you decide to drink coffee every morning. Unbeknownst to you, a barista has vowed to *force* coffee down your throat if you ever try to order tea. But you *always* freely choose coffee because you love it. One day, you choose coffee as usual. The barista's threat guaranteed you *couldn't* choose tea, but it played no role in your actual choice. Are you responsible for choosing coffee? Frankfurt says yes. The mere *existence* of the barista's threat (the lack of alternative) doesn't rob your *actual choice* of its freedom and responsibility.

  5.  **The Big Picture: Defending Compatibilism**
      *   Frankfurt's case is a powerful weapon *for* compatibilists (who believe free will/responsibility are compatible with determinism).
      *   It attacks the core incompatibilist argument (PAP) head-on. If responsibility can exist *even when* you couldn't do otherwise (as in the Jones case), then determinism *itself* doesn't automatically rule out responsibility.
      *   It shifts the focus from **alternative possibilities** ("Could he have done otherwise?") to the **actual source or history of the action** ("Did the action flow from the agent's own uncoerced will, values, and reasoning?"). Responsibility depends on the *actual sequence* of causation, not on what *might* have happened.

  **Conclusion:**

  You're right that Jones couldn't have done otherwise. But Frankfurt argues that this fact **doesn't get him off the hook morally** because:

  1.  **His actual action was uncompelled and authentic:** He shot the victim entirely based on his own desires and reasons.
  2.  **The constraint played no causal role:** Black's mechanism was idle; it didn't make Jones shoot.
  3.  **PAP is flawed:** The case shows that the *inability* to do otherwise is **not sufficient** to remove responsibility *if* the action was still genuinely the agent's own.

  So, the Frankfurt case isn't saying Jones *isn't* responsible *because* he couldn't do otherwise. It's saying he *is* responsible *despite* not being able to do otherwise, thereby proving that the "could have done otherwise" condition (PAP) is **not necessary** for moral responsibility. That's why it's a famous defense *of* the *possibility* of moral responsibility even in a world where alternative possibilities might be absent (like a deterministic world). It reframes the debate around the nature of the agent's actual choice, not the availability of alternatives.
