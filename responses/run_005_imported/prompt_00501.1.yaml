  First, I need to recall the core objections to Strawson's argument. The main issue is the is-ought gap, famously pointed out by Hume. Just because we naturally react a certain way doesn't mean we should. The user mentions their teacher noted this as a common objection, so they need a detailed breakdown beyond just naming the naturalistic fallacy.

  Next, the user wants to know how contemporary defenders bridge this gap. I should think about scholars like Wallace, Scanlon, and McGeer. Wallace's fairness theory, Scanlon's relational justification, and McGeer's functional approach are key here. Each tries to show that the reactive attitudes aren't just natural but serve a purpose in regulating relationships, thus providing normative weight.

  The user's deeper need seems to be preparing for a seminar discussion. They want to articulate both sides clearly and defend a position. So, I need to structure the explanation to highlight the objections and responses, making the debate's structure evident. They might also appreciate examples, like how reactive attitudes maintain social norms or repair relationships, to illustrate the functional arguments.

  I should also address possible weaknesses in the responses. For instance, even if reactive attitudes are functional, does that make them morally justified? Maybe they maintain harmful norms. The user might encounter this counterargument, so preparing them to respond is crucial. Mentioning that defenders like Wallace focus on fairness could help here, but noting the criticism that function doesn't equal justification keeps the analysis balanced.

  Additionally, the user might benefit from understanding the metaethical stakes. Strawson avoids traditional moral realism, so his justification is pragmatic. Highlighting this could help the user frame the debate in class, especially if others bring up moral realism versus pragmatism.

  Finally, summarizing the key points: objections center on the is-ought gap and lack of normativity, while responses argue from function, constitutive roles, and pragmatic necessity. Emphasizing that the debate isn't settled but that Strawson shifts the conversation from metaphysics to practice can empower the user to take a stance in their seminar.
answer: |-
  You've pinpointed *the* central and most enduring criticism of Strawson's project: the move from the *psychological inescapability* of reactive attitudes to their *normative justification*. Let's break down the objection and then explore how defenders try to bridge the gap.

  **The Core Objection: The Is-Ought Gap and Normative Deficiency**

  1.  **The Descriptive Core:** Strawson masterfully describes our psychology. He shows that reactive attitudes (resentment, indignation, gratitude, guilt, etc.) are deeply woven into the fabric of human interpersonal life ("the general structure or web of human attitudes and feelings"). Abandoning them wholesale for the "objective attitude" (seeing others as objects to be managed, not participants to engage with) is psychologically impossible for normal adults in normal relationships. Determinism, even if true, cannot realistically lead to this abandonment because our commitment to interpersonal relationships *requires* the participant stance and its attendant attitudes.
  2.  **The Normative Leap:** Strawson concludes that because these attitudes are inescapable features of our form of life, they are *thereby justified*. Holding people responsible *just is* participating in this framework of attitudes. He argues that the traditional metaphysical debate (compatibilism vs. incompatibilism) is irrelevant because it fails to engage with the actual practice of responsibility embedded in these attitudes.
  3.  **The Objection Stated Precisely:**
      *   **Hume's Guillotine:** The objection charges Strawson with violating Hume's principle that you cannot derive an "ought" (normative conclusion) solely from an "is" (descriptive premise). The fact that we *do* react with resentment doesn't tell us that we *should*, or that resentment is ever a *fitting* or *appropriate* response.
      *   **The Problem of Bad Fit/Inappropriateness:** Our psychological dispositions can be flawed. We are prone to irrational fears, prejudices, cognitive biases, and harmful emotional reactions. The mere fact that a feeling (like racial resentment) is psychologically persistent or "natural" in some sense doesn't justify it. Similarly, why think that *these* natural attitudes (moral resentment, etc.) are tracking something normatively significant? Maybe our reactive attitudes are systematic illusions fostered by evolution or culture, not reliable guides to genuine responsibility.
      *   **Lack of Normative Grounding:** Strawson's account seems to lack an *independent standard* for when reactive attitudes *are* appropriate. He focuses on exemptions (e.g., the insane, the very young, those under extreme duress) where the objective attitude *is* appropriate. But this only defines when attitudes are *inappropriate*. It doesn't provide a positive account of *why* resentment is a *justified* response to, say, a deliberate slight by a competent adult, beyond "that's just what we do." The worry is that he offers a *sociology* or *psychology* of responsibility, not a *justification* of it.
      *   **The Sceptic's Challenge:** A responsibility skeptic (especially a hard determinist) could say: "Fine, I concede that *psychologically*, I cannot completely eradicate feelings of resentment, even knowing determinism is true. But this is merely a tragic flaw in my psychology, a vestige of irrationality. It doesn't show that the person who wronged me *truly deserves* my resentment or blame in any deep moral sense. Strawson has shown why the skeptic's *practice* won't change, but not why the skeptic's *belief* (that responsibility is illusory) is *wrong*."

  **How Defenders of Strawson (and Naturalistic Compatibilists) Try to Close the Gap:**

  Defenders don't deny the is-ought gap exists; they argue Strawson isn't *simply* committing the naturalistic fallacy. They try to show that the descriptive facts he highlights *are* the relevant normative facts, or provide the framework within which normative questions *make sense*. Here are the main strategies:

  1.  **The Constitutive Argument (Strawson's Own Hint):**
      *   **Claim:** Reactive attitudes aren't just *responses* to responsibility; they are *constitutive* of it. Responsibility isn't some mysterious metaphysical property ("contra-causal freedom") floating "out there" to which our attitudes might or might not correspond. Responsibility *is* a feature of our interpersonal practices, defined and constituted *by* the patterns of holding each other accountable *through* these reactive attitudes.
      *   **Analogy:** Think of a "promise." The obligation of a promise isn't some ghostly entity; it *is* the complex practice of making commitments, expecting fulfillment, and feeling resentment/entitlement when they are broken/kept. Similarly, moral responsibility *is* the practice of holding each other to expectations via reactive attitudes.
      *   **Bridging the Gap:** If responsibility is *constituted* by these practices, then the justification for holding someone responsible isn't separate from the practice itself. The "ought" is internal to the "is" of the practice. Asking for an external justification ("Why is resentment *really* appropriate?") is like asking "Why is a checkmate *really* winning in chess?" – it misunderstands the nature of the concept *within* the practice. The justification lies in participating in the form of life that gives these concepts meaning.

  2.  **The Functional/Pragmatic Justification:**
      *   **Claim:** The system of reactive attitudes serves crucial, indispensable social and personal functions that are constitutive of a recognizably human life and valuable relationships.
      *   **Functions:** They regulate behavior (deterring wrongs), maintain social norms, express and reinforce mutual respect and expectations, facilitate trust, enable deep personal relationships (love, friendship), provide a mechanism for apology and forgiveness (repairing bonds), and structure our sense of self (guilt, self-respect).
      *   **Bridging the Gap:** Given that these functions are essential for human flourishing, meaningful relationships, and a stable society, the practices that sustain them (including reactive attitudes) are *pragmatically justified*. The fact that we *cannot* abandon them without severe loss (e.g., collapsing into universal manipulation or indifference) *is* a normative reason to accept them as justified, even if determinism is true. The "ought" flows from the necessity of the functions for our valued form of life (e.g., R. Jay Wallace, influenced by Strawson, develops a "fairness" theory that fits here).

  3.  **The Relational/Reciprocal Recognition Argument (Scanlon, McGeer):**
      *   **Claim:** Reactive attitudes are expressions of our fundamental stance toward others as beings capable of *reasoning* and *relating* – as members of the moral community. Resentment, for example, is a protest against being treated in a way that disregards the basic claims of mutual recognition and respect you are owed as a person.
      *   **Bridging the Gap:** The justification lies in the inherent value of relating to others on terms of mutual recognition and accountability. When someone violates these terms (without exemption), reactive attitudes are the *appropriate* mode of engagement because they acknowledge the other as a responsible agent *within* the moral relationship, rather than treating them as an object (objective attitude). The "ought" arises from the demands of mutual recognition itself. Abandoning reactive attitudes wholesale would mean abandoning the commitment to treating others as responsible agents *at all*.

  4.  **The "No Rational Alternative" Argument:**
      *   **Claim:** Strawson's point isn't just that we *won't* abandon the attitudes, but that we *rationally cannot* adopt the objective stance universally without ceasing to engage in interpersonal relationships as we know them. There is no coherent, rational alternative framework for human interaction that dispenses with these attitudes while preserving the goods they make possible.
      *   **Bridging the Gap:** If there is *no rational alternative* to engaging in a practice that essentially involves these attitudes for achieving fundamental human goods (relationships, community, self-understanding), then participating in that practice, including deploying the reactive attitudes under the relevant conditions, *is* rationally justified. The justification isn't external; it's that this practice is the only game in town for being fully human in relation to others.

  **Key Points for Your Seminar Defense:**

  *   **Don't Oversimplify:** Avoid just shouting "Naturalistic Fallacy!" Acknowledge the *prima facie* force of the objection but then show how Strawsonians argue the *nature* of responsibility makes the demand for an external justification misguided or unnecessary.
  *   **Focus on Constitutive/Functional Aspects:** Emphasize that for Strawsonians, responsibility isn't a metaphysical property *detected* by attitudes; it's *constituted* by the practice *of which the attitudes are a core part*. The function of the practice in enabling human life provides pragmatic justification.
  *   **The Sceptic's Burden:** Shift the burden slightly. Ask the skeptic: "If *not* these attitudes and practices, grounded in our psychology and social needs, then *what* could possibly ground responsibility? What alternative conception isn't either vacuous or collapses back into the very practices Strawson describes?" Strawsonians argue the traditional metaphysical alternatives fail this test.
  *   **Metaethical Stance:** Recognize that Strawson's approach is often seen as a form of *moral naturalism* or *pragmatism*, grounding normativity in human nature and social practice, rather than in Platonic forms, divine commands, or non-natural properties. The debate reflects deeper metaethical commitments.
  *   **It's Not Settled:** Conclude that while Strawsonians offer powerful responses, the objection remains live. The debate often hinges on whether one finds constitutive/functional/pragmatic justifications genuinely satisfying as *moral* justifications, or whether one demands a more robust, perhaps metaphysical, grounding. Strawson's genius was shifting the debate *away* from metaphysics *to* practice, but the normative challenge to that practice persists.

  By understanding these moves and counter-moves, you'll be well-equipped to articulate the core tension, defend Strawson's insights against the "is-ought" charge by explaining the constitutive/functional arguments, and engage critically with the limits of these justifications. Good luck in your seminar!
