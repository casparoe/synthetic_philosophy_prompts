answer: |-
  You've hit on a profoundly important ethical dilemma known as **"moral luck"** – where we judge someone's character or culpability based on factors entirely outside their control (like where a car was parked or a gust of wind). Your discomfort is completely justified and points to a deep flaw in how we often assign blame and praise. Here's why it feels "off" and how to explain it:

  1.  **The Identical Choice & Risk:** Both drivers made the *exact same* conscious, negligent decision: taking their eyes off the road to look at their phone at a critical moment. The *risk* they introduced to themselves, pedestrians, other drivers, and property was **identical**. They were both equally reckless *in that moment*.

  2.  **Outcome vs. Culpability:** Your friend's argument ("he's the one who actually hit something") confuses **outcome** with **initial culpability**.
      *   **Culpability (Blameworthiness):** Based on their *choices and state of mind*. Both chose to be distracted. Both were equally blameworthy *for taking the risk*.
      *   **Outcome:** Based on *luck and circumstance*. One had a parked car in the precise wrong spot; the other didn't, or had slightly better lane position, or the wheel turned a fraction less. The outcome was pure chance.

  3.  **The Core Problem - Moral Luck:** Philosopher Thomas Nagel famously described situations like this. We *want* moral judgments to be based only on factors within a person's control (their choices, intentions). But in reality, we constantly judge people based on *consequences* that depend heavily on luck. This is "moral luck." It feels unfair because it *is* unfair from a purely ethical standpoint. The first driver isn't *more* reckless or negligent than the second; he's just *unluckier*.

  4.  **Why Society Does It Anyway (Even Though It's Flawed):**
      *   **Practicality & Deterrence:** It's easier to see and punish harmful outcomes. Punishing *only* intent or risk-taking (without outcome) is harder to prove and enforce. Society also hopes punishing bad outcomes deters the risky behavior (though it doesn't change the luck element).
      *   **Emotional Response:** Harm triggers strong emotions (anger, fear, desire for justice/reparation). No harm often means no emotional trigger, so the identical risk is ignored. We react to the *visible damage*, not the *invisible near-miss*.
      *   **Narrative Simplicity:** "He hit a car because he was careless" is a simple, satisfying story. "He was equally careless but nothing happened" is an invisible non-story. We build narratives around events, not near-identical non-events.
      *   **Hindsight Bias:** Once we know the outcome (the crash), the risk *feels* more obvious and blameworthy, even though the risk-taking was identical in both cases.

  5.  **The Unfairness You Sense:**
      *   **Punishment Disparity:** One faces severe social, academic, and familial consequences; the other faces none, *despite identical moral failing*.
      *   **Character Assassination:** People judge the first driver as a "reckless idiot," implying a *fundamental character flaw* worse than the second driver, when the only difference was luck. This is deeply unfair.
      *   **Hypocrisy:** Many people (maybe even those judging the first driver harshly) have likely glanced at their phone while driving and been *lucky* nothing happened. They condemn in others what they excuse in themselves due to luck.

  **How to Explain Why This Bugs You:**

  *   **The Identical Risk Argument:** "Imagine two people play Russian Roulette with identical guns, each with one bullet in a 6-chamber cylinder. One dies, the other doesn't. Was the one who died *more* reckless? No. They took the *exact same* deadly risk. The difference was pure luck. That's what happened here. Both took the same dangerous risk on the road; one got unlucky with the consequences."
  *   **The Switched Places Thought Experiment:** "If the parked car had been slightly to the left, or if they'd swapped lanes, it would be the *other* kid grounded and kicked off the team. Their *choices* were identical. We're punishing bad luck, not worse choices."
  *   **Focus on the Choice, Not Just the Outcome:** "We *should* judge people for making dangerous choices, regardless of the outcome. Both made a terrible choice to look at their phone while driving. The fact that only one had a bad outcome doesn't make the other guy's choice okay or less blameworthy *at the moment he made it*. Ignoring near-misses just encourages people to think 'It won't happen to me.'"
  *   **Moral Luck is Unjust:** "It feels wrong because it *is* unjust to judge someone's character or punish them much more harshly based purely on random chance, when their actual decision and the risk they created was the same as someone who faces no consequences. We're confusing luck with morality."
  *   **The Drunk Driver Analogy:** "Two equally drunk drivers leave the bar. One hits a pedestrian, the other makes it home safely. The one who hit someone is rightly punished severely for the outcome *and* the recklessness. But the one who made it home was *just as reckless* and endangered lives just as much. We punish the outcome, but we should condemn the *choice* to drive drunk just as strongly in both cases."

  **Conclusion:** You are absolutely right to feel this is unfair. While consequences matter (repairing damage, learning lessons), the *disparity* in judgment and punishment between these two individuals is primarily a result of **moral luck**, not a genuine difference in their culpability for the initial reckless act. Judging character and assigning blame *solely* based on outcomes, ignoring identical risks taken by others due to luck, is flawed and ethically questionable. This situation highlights how society often reacts to harm rather than truly evaluating intent and the inherent risk of choices. Your discomfort shows you understand that true responsibility lies in the choices we make, not just the randomness of the outcomes.
