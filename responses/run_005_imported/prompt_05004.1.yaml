  ### Key Justifications:
  - **S-Tier (KS & Gauthier)**: Both enforce *strong monotonicity* (no one loses when the pie grows) and *proportionality* (concessions mirror bargaining strength), reconciling efficiency with robust fairness under changing conditions—decisive for reasonable parties.  
  - **A-Tier (Kalai Egalitarian)**: Equal absolute gains are transparent and impartial, but ignores how parties *value* gains (utility functions), risking unfairness if one side has steeper utility curves.  
  - **B-Tier (Nash)**: Elegant and efficient, but non-monotonicity (as in your case) is normatively indefensible—a deal-breaker for impartial parties.  
  - **C-Tier (Utilitarian)**: Maximizes total welfare but sacrifices fairness; impartial parties would reject solutions where one bears all costs while the other reaps all gains.  
  - **D-Tier**: Empty—no solution here is normatively indefensible, but utilitarian is least aligned with mutual recognition.  

  > **Note**: Gauthier's principle is mathematically identical to Kalai–Smorodinsky but derives from moral philosophy (contractarianism), strengthening its normative claim. Your mediator's switch to KS was sound: monotonicity is essential for dynamic negotiations. Nash's non-monotonicity isn't merely "counterintuitive"—it violates a core tenet of distributive justice (no harm from pure abundance). For ongoing royalties, KS/Gauthier provides the strongest moral and practical defense.
