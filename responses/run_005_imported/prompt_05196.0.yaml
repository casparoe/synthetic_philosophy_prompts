answer: |-
  ## The Admiral and the Unwritten Sea

  Admiral Theron of Mytilene paced the polished obsidian floor before the Oracle of Delos. Dawn bled through the high windows, painting the chamber in hues of rose and ash. Lycea, the Pythia, sat motionless, eyes clouded by sacred vapours. Theron needed clarity, not cryptic verse. The Persian fleet massed at Salamis; tomorrow would decide the fate of Hellas.

  "Oracle," Theron rasped, his voice echoing. "Tell me plainly: **Will there be a sea battle tomorrow?**"

  Lycea’s head lolled, then snapped upright. Her voice, hollow and ancient, filled the chamber: **"A sea battle will rage upon the wine-dark sea when Helios next drives his chariot across the sky."**

  Theron’s heart clenched. *Truth. Certainty.* He bowed stiffly and departed, mind already churning with deployments. The prophecy settled on him like armor – heavy, but reassuring. **Bivalence:** The statement *must* be true or false *now*. The Oracle declared it true. Therefore, the battle *is* fixed. Fatalism? Perhaps. But pragmatism demanded preparation for the inevitable.

  Back aboard his flagship, the *Dike*, Navigator Demetrios awaited him. Demetrios was no ordinary sailor; he was a student of celestial mechanics and, lately, of Prior’s branching time models, smuggled scrolls hidden amongst his star charts.

  "Oracle?" Demetrios asked, eyes sharp.

  "Affirmed. Battle tomorrow," Theron stated, unfurling a tactical map.

  Demetrios frowned, tracing an invisible path on the vellum. "But *how*, Admiral? Lycea’s utterance... is it an **Ockhamist** truth, or **Peircean**?"

  Theron scowled. "Speak plainly, Navigator. We have Persians to sink, not philosophy to parse."

  Demetrios pointed to the open sea on the map. "The Ockhamist says: Among all possible tomorrows branching from this moment, *one* is the actual future – the ‘Thin Red Line’. Lycea, somehow, saw *that* line. Her ‘will’ points to that fixed path. The battle *is* true now, on that line. We sail towards destiny."

  Theron grunted, liking the solidity. "Good. Prepare the ramming prows."

  "But the Peircean," Demetrios pressed, lowering his voice, "says statements about specific future contingents are *neither* true nor false *now*. ‘There will be a sea battle tomorrow’ is only true *if* it happens, false *if* not. Lycea’s prophecy? A powerful possibility, yes, but not a current truth. It’s *open*. The branches are truly undetermined."

  Theron paused, his hand hovering over the model trireme representing the Persian flagship. "You suggest... we could *avoid* it? The Oracle said—"

  "The Oracle spoke words," Demetrios countered. "But *meaning* depends on the logic of time. If the Peircean is right, her words bind nothing. We could sail north, lure them into shallow waters where their numbers mean nothing... or even scatter, forcing them to chase, preventing a decisive battle *tomorrow*. The prophecy might then be *false*."

  The weight of Theron’s fatalistic armor suddenly felt brittle. **Diodorus’s ghost whispered:** *Truths about the future imply necessity. The impossible cannot follow from the possible. Therefore, only what* will *happen* was *possible.* If Lycea’s words were true *now*, then avoiding the battle tomorrow was *impossible*. His choice was an illusion.

  But Demetrios offered a sliver of agency. If the Peircean view held, the future was unwritten. His choices *mattered*. Yet... doubt gnawed. Was Demetrios’s hope just a refusal to face necessity?

  Night fell. Theron stood on the deck, watching the stars Demetrios so revered. The navigator joined him, clutching his charts. "Admiral, look!" Demetrios pointed, not to the sky, but to his latest calculations. "I’ve plotted the currents, the winds predicted for dawn... see this path? It converges *inevitably* on the straits west of Salamis. Given the Persian dispositions *we know*, and our own planned response... the models show a battle tomorrow isn’t just likely, Admiral. It’s *mathematically fixed*." His finger traced a single, bold red line on the chart. "The Thin Red Line. It *is* there. The Ockhamist was right all along. Lycea saw the true branch."

  Theron stared at the red line. Demetrios, trying to prove freedom through calculation, had instead charted their prison. He had **smuggled fatalism back in**, mistaking predictive certainty based on current conditions for metaphysical necessity. The Thin Red Line wasn't a feature of time; it was a projection of Demetrios's own assumptions and data.

  "Demetrios," Theron said, his voice low and hard. "You found a path *based on what we intended to do*. You assumed we would sail to meet them head-on. Your ‘fixed’ line is a consequence of *my earlier decision* to believe the Oracle’s truth." He snatched the chart. "This line is drawn with our own fears and assumptions, not by the Fates!"

  He held the parchment over a brazier’s flame. The thin red line curled and blackened. "The Oracle spoke a possibility, Navigator. A terrible likelihood, yes. But **only the Peircean leaves room for the unexpected, for cunning, for true choice.** Ockham’s ‘actual future’ is a phantom. Diodorus’s necessity is a chain we forge ourselves."

  Theron turned to the helmsman. "New course! North-by-Northwest! Signal the fleet: We do *not* engage in the straits. We draw them out. We fight *where we choose*, *if* we choose."

  Demetrios watched the chart burn, the ash flaking into the dark sea. The fixed path was gone. Terror and exhilaration warred within him. The battle might still happen tomorrow. It might not. Lycea’s words hung in the air, their truth-value suspended until the dawn revealed which branch reality had taken. The future wasn't a line to be found, but a sea to be sailed.

  As the *Dike* cut a new path through the whispering waves, Theron gazed at the horizon where tomorrow was being born, moment by uncertain moment. **The logical bind was broken not by denying bivalence, but by denying that "will" statements about open futures possessed truth-value *now*.** The sea wasn't written; it was sailed. And Theron, Admiral of Mytilene, would write his own tomorrow with oar and ram and the fierce, uncharted fire of human will.
