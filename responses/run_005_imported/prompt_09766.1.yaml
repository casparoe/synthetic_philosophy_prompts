prompt: |-
  I'm a philosophy student finishing a seminar this term on Bernard Williams's ethics, and for the past two weeks we've stepped outside his usual moral-philosophy corpus into his essays on opera, later collected and published after his death under the title "On Opera" -- above all the pieces on Mozart's "Don Giovanni" and on Puccini's "Manon Lescaut." Separately, I help produce a small philosophy podcast, and next week's guest is a philosopher who has just published a book arguing that these scattered essays and reviews amount to a genuine, minority position in aesthetics: that opera's distinctive power lies in holding moral judgment of its characters in unresolved tension with the sheer musical seduction their music exerts on an audience, rather than either moralizing the drama away (as a plot synopsis might) or treating the story as disposable scaffolding for pure spectacle (as some formalist defenses of opera do). She is articulate and quotable, and I don't want the episode to consist of forty minutes of her restating the book's jacket copy.

  Please draft eight to ten interview questions that go beyond a restatement of that thesis and into the places where it is most likely to strain. I want at least one question on the ending of "Don Giovanni" -- whether the moralizing final sextet is genuinely undercut by the sheer vitality of the Don's own music, or whether calling that "holding the tension open" is just a flattering redescription of the opera failing to earn its own moral; at least one on the "Manon Lescaut" essay's charge of manipulative sentimentality, i.e., whether lush orchestral writing wedded to a morally thin and opportunistic heroine amounts to legitimate aesthetic excess or to emotional overreach the drama hasn't earned, and what principle would distinguish that from manipulative scoring in a propaganda film; and at least one on Williams's own years of service on the board of the Royal Opera House, asking whether defending opera's singular aesthetic power quietly commits him to defending the expensive, elite institution that stages it, or whether the two questions are as separable as she is likely to insist. For each of these three, please add a follow-up question keyed to the answer she is most likely to give, so the exchange doesn't stop at the first parry.
