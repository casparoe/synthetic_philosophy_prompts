answer: |-
  Here’s a rigorous defense of the unrestricted counterfactual-contrastivist view (Lewis/Schaffer) on omissions, engaging directly with its rivals and concluding with a clear verdict for your reporting. The core argument: causation *is* metaphysically profligate, but this is a strength, not a flaw—and it cleanly separates "what caused the harm" from "who bears blame."

  ### Why the Unrestricted View is Correct: Causation Without Apology
  **The Argument from Difference-Making**  
  Start with the bedrock intuition: causation tracks *dependence*. If the outcome (O) counterfactually depends on factor (C), then C is a cause. The plant’s death (O) depends on the gardener’s failure to water it (C): if he *had* watered it, the plant would have lived. This dependence is symmetric for *any* omission satisfying the counterfactual: if the Queen *had* watered it, the plant would have lived too. To deny her omission is a cause is to deny that dependence is sufficient for causation—which guts the theory’s explanatory power. Contrastivism (Schaffer) sharpens this: causation is always *relative to alternatives*. "The gardener’s not-watering (rather than watering) caused death" is true, while "the Queen’s not-watering (rather than composing speeches) caused death" is false *only* because we hold fixed her actual actions. But if we contrast *her not-watering* with *her watering*, she *is* a cause. This isn’t an absurdity—it’s precision. The profligacy arises from the infinite ways the world *could* have differed, but causation is a relation between *actual* alternatives.

  **Why Pragmatics Bears the Burden**  
  Our refusal to blame the Queen isn’t about causation—it’s about *salience*. Just as we say "the spark caused the fire" but not "oxygen’s presence caused it" (though both are necessary), we select omissions based on *explanatory relevance*:  
  - **Expectations**: The gardener was paid to water; the Queen wasn’t.  
  - **Control**: The gardener could easily have acted; the Queen couldn’t (without drastic changes).  
  - **Normative context**: Blame requires duty, but causation doesn’t.  
  This is handled by pragmatic theories (e.g., van Fraassen’s contrastive why-questions). In court, we ask: "Why did the plant die *rather than live*?" and cite the omission most *relevant to our interests* (duty, foreseeability). But the metaphysics is clear: all omissions satisfying counterfactual dependence are causes.

  ### Engaging the Rivals: Where They Go Wrong
  **Against Dowe: Quasi-Causation Collapses into Circularity**  
  Dowe’s conserved-quantity view (only physical processes are causal) dismisses omissions as mere "quasi-causes." But this:  
  1. **Violates intuition and practice**. We constantly reason causally about absences: "The lack of rain caused the famine." Dowe must redescribe this as "the drought process caused famine"—but droughts *are* absences of rain. This relabeling game avoids the metaphysics.  
  2. **Implausibly severs causation from dependence**. If the gardener’s omission isn’t a cause, what *is* the cause of the death? Dowe might say "dehydration." But dehydration counterfactually depends on *not-watering*—so denying omissions as causes breaks the dependence chain. His "quasi-causation" is just causation in disguise, now arbitrarily restricted.  
  3. **Fails for regulatory cases**. If a faulty valve explodes because a regulator ignored warnings, Dowe must say the explosion was caused *only* by physical processes (e.g., metal fatigue). But metal fatigue alone wouldn’t have caused harm *if the regulator had acted*. Denying omissions as causes erases human agency from causal narratives—a fatal flaw for negligence reporting.

  **Against McGrath: Normativity Corrupts Causation**  
  McGrath argues causation has a normative component: the gardener’s omission causes harm because he *should have watered*, while the Queen’s doesn’t because she had no duty. But this:  
  1. **Conflates causation with responsibility**. Causation is a relation in the world; blame is a social judgment. Suppose the Queen *had* promised to water the plant. Now her omission is "causal" per McGrath—but the physical facts are unchanged. This makes causation subjective, varying with moral contexts.  
  2. **Undermines explanatory power**. In the valve case, the explosion counterfactually depended on the regulator’s inaction *regardless* of their duty. If we discovered the regulator had no legal obligation (e.g., the warning was sent in error), McGrath must say their inaction *didn’t cause the harm*—contradicting the counterfactual. Duty affects blame, not causation.  
  3. **Collapses into circularity**. To say "duty makes omissions causal" presupposes we can identify *which* omissions have duties—but that requires prior causal knowledge (e.g., "the regulator had a duty *because* their action could have prevented harm"). Normativity parasitizes on causation; it doesn’t define it.

  ### Verdict for Your Reporting: What Metaphysics Can and Cannot Do
  **The unrestricted view delivers a clear answer**:  
  - **Causation is metaphysically profligate**. Yes, the regulator’s inaction, the Queen’s inaction, and infinite other omissions *all* caused the harm in the broadest sense—each satisfies counterfactual dependence.  
  - **But this doesn’t trivialize blame**. Pragmatics (explanation, ethics, law) selects *which causes matter*: the regulator’s omission is relevant due to duty, control, and social expectation; the Queen’s isn’t.  

  **Why this matters for journalism**:  
  1. **It clarifies "who really caused it."** Metaphysically, *many* factors cause regulatory harm (inaction, budget cuts, flawed tech). But this doesn’t make blame arbitrary—it grounds responsibility in *actual difference-making* (unlike normative views that risk making causation subjective).  
  2. **It separates diagnosis from judgment**. Your reporting can rigorously show that the regulator’s omission *was* a cause (via counterfactuals: "Had they acted, the harm wouldn’t have occurred"), while legal experts argue why this *particular cause* merits blame.  
  3. **It avoids philosophical gerrymandering**. Dowe and McGrath distort causation to fit intuitions about responsibility. The unrestricted view accepts that causation is messy and abundant—and forces us to articulate *separate criteria* for blame.  

  **Final answer**: Metaphysics tells us that *all* difference-making omissions "really" cause harm—but it *cannot* tell us who to blame. That requires norms: who *should have acted*, who *could reasonably have foreseen* the harm, and who society holds accountable. For your cases, this means the regulator’s inaction *did* cause the harm (metaphysically), but whether they’re "responsible" hinges on duty and context—a question for ethics and law, not metaphysics. This division of labor isn’t a cop-out; it’s the only way to prevent causation from being hijacked by moral convenience.
