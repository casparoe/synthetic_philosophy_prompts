  - Attack Dowe's "no absences as causes" stance and McGrath's normative view.  
  - Explain away the Queen example via pragmatics.  
  - End with a verdict that metaphysics gives causes, but blame needs more.  

  For Dowe: His conserved-quantity theory fails because we constantly reason causally about absences (e.g., "silence caused suspicion"). Denying this severs causation from intuitive counterfactual reasoning. Physics-bound causation is too narrow for human-scale events.  

  For McGrath: Adding normativity to causation conflates two questions: "Did X cause Y?" and "Should we hold X responsible?" Her view makes causation subjective—duties vary by culture, but a valve failure's mechanics don't.  

  Key moves for my argument:  
  1. **Clarity via contrastivism**: Schaffer’s idea—causes are always relative to alternatives. The gardener’s not-watering (vs. watering) causes death; the Queen’s not-watering (vs. her actual actions) doesn’t, but only because we focus on relevant contrasts. This avoids multiplying causes absurdly.  
  2. **Pragmatics as the workhorse**: We cite the gardener because it’s relevant (duty, expectation), not because other omissions aren’t causal. Just like we say "the spark caused the fire" but not "oxygen’s presence did," though both are necessary.  
  3. **Verdict for journalism**: Metaphysics gives all difference-makers as causes; blame selects from them using ethics/law. So yes, the regulator’s inaction *caused* harm (metaphysically), but courts blame them because of duty, not because the Queen’s omission wasn’t causal.  

  This sharp separation helps the user: It shows why negligence cases *correctly* focus on the regulator (duty) without denying the metaphysics of countless causes. The "who really caused" question splits in two—physics gives many answers; society picks one to blame.  

  I’ll close firmly: Demanding metaphysics to assign blame is a category error. The unrestricted view is the only one that doesn’t gerrymander causation to fit intuitions.  

  Potential pitfalls to avoid:  
  - Don’t soften the bullet-biting (e.g., "the Queen *is* a cause").  
  - Don’t let McGrath’s normativity seem plausible—stress it conflates "is" and "ought."  
