  First, I need to grasp their core dilemma. They're wrestling with whether metaphysics can pinpoint "who really caused" harm in regulatory failures, or if it's just about blameworthiness. Their reporting needs clarity on whether causation itself assigns responsibility or if it's a separate ethical/legal layer.  

