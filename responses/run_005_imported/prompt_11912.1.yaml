    "part_a": {"points": 10, "comment": "..."},
    "part_b": {"points": 7, "comment": "..."},
    "part_c": {"points": 8, "comment": "..."}
  }
  ```

  but don't worry about matching my made-up numbers -- I mostly just want a sanity check since I haven't graded anything since grad school.
