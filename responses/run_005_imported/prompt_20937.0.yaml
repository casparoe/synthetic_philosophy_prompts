  First, I need to recall Anscombe's key principles: her absolute prohibition on intentionally targeting non-combatants (which she equates with murder), and her rejection of conditional intentions to do evil. The latter is crucial here—she argued that even the *threat* of mass murder corrupts morally, regardless of whether it's executed.  

  The user mentions the W76-2 is framed as "more ethical" due to its precision. But Anscombe would likely pierce through that justification. For her, the moral breach isn't about scale but about the *intentionality* behind targeting civilians. A smaller bomb aimed at a city still crosses her bright line.  

  Also, the conditional intention point is damning: the deterrent logic ("We *will* kill your civilians if...") is precisely what she condemned. It doesn't matter if the weapon is "low-yield"; the conditional intent remains. She'd probably argue this is a tactical tweak masking the same moral bankruptcy.  

  The user might be hoping for nuance—does reduced collateral damage change Anscombe's calculus? But her philosophy doesn't bend for "less bad" outcomes. If anything, she'd see refined weapons as making mass murder more thinkable, thus *more* corrupting.  

  I should emphasize that Anscombe isn't just against *acting* but against *willing* evil. The W76-2's design still wills non-combatant deaths as a means. That’s irredeemable under her framework.  

  ...Though part of me wonders if she’d acknowledge *any* deterrent as licit. Probably not—she’d insist on unconditional rejection of civilian targeting, even if it makes deterrence "impractical." Her stance was radically uncompromising.  

