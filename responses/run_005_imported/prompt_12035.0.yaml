  Explanation: Marcus is correct that in the context of Coq and similar systems, the rejection of excluded middle is indeed due to the computational interpretation. Curry-Howard shows that a proof of excluded middle for all propositions would require a program that decides any proposition, which is impossible. This is a valid and widely accepted perspective in formal methods. However, he dismisses the philosophical depth too quickly. While Curry-Howard provides a compelling computational explanation, it does not negate that the origins and alternative justifications (like Brouwer's) are philosophically distinct.

