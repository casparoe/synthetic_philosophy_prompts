  Point 3: Marcus retorts that nobody today in type theory believes in Brouwer's creating subject. He points to Heyting's formalization and Kleene's computational semantics as the version used in Coq and Agda, and suggests that focusing on Brouwer is like focusing on Newton's fluxions in calculus.

