  I should address the false dichotomy the friend presents. It's not all-or-nothing. The user can hold both truths: the disorder influenced the brother, AND the hurt requires addressing. The brother's half-hearted apology isn't enough. Maybe suggesting a more sincere amends process could help. Also, the user might need permission to feel resentful without acting on it, as resentment can be a signal, not a life sentence.

