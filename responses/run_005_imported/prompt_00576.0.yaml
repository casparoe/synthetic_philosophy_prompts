answer: |-
  That's a profound and emotionally layered question. Your friend makes a point that sounds logical on the surface (attributing the behavior solely to the disorder), but your hesitation reveals a crucial truth: **mental illness explains behavior, but it doesn't automatically erase its impact or absolve all responsibility.** Your feelings of hurt and resentment are valid and signal something important about boundaries and personhood.

  Here's a breakdown of why your friend's view is incomplete, and where the "line" might actually be:

  1.  **The "Disorder vs. Person" Dichotomy is Overly Simplistic:**
      *   Your friend's "that wasn't him, it was the disorder" framing creates a false separation. Your brother *is* a person *with* BPD. The disorder shapes his experiences, perceptions, emotional regulation, and reactions, but it doesn't operate independently *of* him. He still *chose* those specific words (even if driven by distorted thoughts or overwhelming emotion). His personality, history, and existing relationship dynamics with you all play a role *alongside* the disorder.

  2.  **The Impact is Real, Regardless of Cause:**
      *   **Your hurt is real.** The words were vicious. They landed on *you*. Understanding the *why* behind the hurtful words doesn't magically make the wound disappear. It might help you contextualize it, but it doesn't invalidate the pain you feel. Expecting you to instantly dismiss your pain because of the diagnosis is asking you to bypass a natural human response.

  3.  **Accountability ≠ Blame:**
      *   This is the critical distinction. Your friend seems to equate "resentment" with "blaming him as if he were 100% in control and malicious." But there's a middle ground.
      *   **Accountability** acknowledges: "Your actions caused me harm." It focuses on the *impact* and the need for repair or change.
      *   **Blame** focuses solely on assigning fault, often with punitive intent.
      *   You can hold your brother accountable *within the context* of his disorder. His half-hearted "sorry, I was in a bad place" likely feels insufficient because it lacks true accountability. It minimizes the impact and doesn't demonstrate genuine understanding or effort to make amends or prevent recurrence.

  4.  **Dropping Resentment Prematurely *Can* Feel Dehumanizing:**
      *   You're exactly right. If you simply dismiss his actions *entirely* as "just the BPD," you risk:
          *   **Infantilizing him:** Treating him as incapable of any responsibility or agency.
          *   **Invalidating your own experience:** Telling yourself your pain "doesn't count" because he "couldn't help it."
          *   **Preventing genuine relationship repair:** True repair often requires acknowledgment of the same time harm and effort from *both* sides. If his actions are entirely written off, there's no foundation for him to learn, grow, or work on managing his symptoms better within the relationship.
          *   **Creating unsustainable boundaries:** If he faces zero consequences or need for accountability, why would the behavior change? You might be expected to tolerate repeated harm.

  5.  **Where the "Line" Might Be Drawn:**
      *   **On Blame:** Yes, it's unfair and unhelpful to blame him as if he were a neurotypical person acting with full malicious intent and control. Attributing *malice* where it was likely driven by intense emotional dysregulation, fear of abandonment, or distorted thinking inherent to BPD is inaccurate.
      *   **On Resentment/Consequences/Boundaries:** It is *not* unfair to:
          *   **Feel hurt and angry** about the impact of his words.
          *   **Require accountability:** This means needing more than a weak apology. It might look like him genuinely acknowledging *how* his words hurt you, demonstrating effort in his treatment (therapy, DBT skills), showing changed behavior over time, or respecting boundaries you set (e.g., "If you start yelling insults, I will end the call/visit").
          *   **Set firm boundaries:** Protecting yourself from abusive language is essential, *regardless* of the cause. "I understand your BPD makes emotions intense, but I will not tolerate being called names or insulted."
          *   **Feel cautious or distant:** Trust was damaged. Rebuilding it takes time and consistent demonstration of change from him.
          *   **Expect effort:** While you can't expect him to be "cured," you *can* reasonably expect him to be engaged in managing his disorder and learning skills to communicate differently.

  **What "Adjusting Expectations" Really Means (and what it doesn't mean):**

  *   **It DOES mean:**
      *   Understanding that emotional regulation is harder for him.
      *   Knowing that intense reactions might happen, even if he's trying.
      *   Recognizing that progress might be slow and non-linear.
      *   Communicating more clearly and setting boundaries proactively.
      *   Choosing your battles (e.g., not engaging when he's clearly dysregulated).
  *   **It DOES NOT mean:**
      *   Accepting abuse or cruelty as inevitable.
      *   Tolerating harmful behavior without consequence.
      *   Dismissing your own feelings or needs.
      *   Allowing him to avoid all responsibility for his actions.
      *   Having no expectations of effort or respect.

  **Your resentment isn't just "blaming him." It's a signal:**

  *   That a boundary was severely violated.
  *   That the hurt hasn't been adequately acknowledged or repaired.
  *   That you need more from him to feel safe and respected in the relationship.
  *   That you value yourself enough to not simply accept harm.

  **What to do:**

  1.  **Validate Your Own Feelings:** It's okay to be hurt and angry. Don't gaslight yourself because of his diagnosis.
  2.  **Focus on Impact and Accountability (Not Blame):** When discussing it (if you choose to), focus on how his words made *you* feel ("When you said X, I felt deeply hurt and disrespected") rather than attacking his character ("You're a horrible person").
  3.  **Set Clear Boundaries:** Define what behavior you will not tolerate and the consequence (e.g., leaving the conversation/house).
  4.  **Manage Your Expectations Realistically:** Understand the challenges of BPD, but also know what *you* need to feel safe and respected. Expect *effort* and *accountability*, not perfection.
  5.  **Consider the Apology:** His weak apology likely fuels the resentment because it doesn't meet the need for accountability. You might need to communicate what a more meaningful apology would look like to you (e.g., "I need to hear that you understand how much those words hurt me and what you're doing to try and prevent lashing out like that again").
  6.  **Protect Yourself:** It's okay to limit contact or take space if interactions are consistently harmful. Your well-being matters.
  7.  **Seek Support:** Talk to a therapist (especially one familiar with BPD dynamics) or a support group for family members. They can help you navigate these complex feelings and boundaries.

  **In short:** Your friend oversimplifies. While it's unfair to attribute malice fueled solely by free will, it's entirely fair and necessary to hold your brother accountable for the *impact* of his actions, to expect effort in managing his condition within your relationship, to set boundaries to protect yourself, and to feel hurt that requires genuine repair. Resentment in this context isn't about blaming his core character; it's a response to unresolved hurt and a lack of sufficient accountability. You are not wrong for feeling it.
