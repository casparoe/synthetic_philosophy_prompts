  The salt-stained bell above the Guildhall door hadn't chimed for Flinn in years. Yet here he stood, apprentice no longer, Master Carver Flinn now – ever since old Master Borin coughed his last amidst the fragrant curls of cedar shavings three months prior. Flinn ran a calloused thumb over the smooth, dense timber in his arms: *Ironwood*. Rare, valuable, brutally hard. A merchant needed a ceremonial platter, flawless, able to withstand generations. It demanded Ironwood.

  Borin’s Rule echoed in Flinn’s mind, as ingrained as the grain patterns he’d studied for a decade: *"Listen to the wood, lad. Before the chisel bites, before the gouge sings. Tap it. Clean ring? Solid heart. Dead thock? Flaw within. Hidden rot, a weakness waiting. Reject it. Always."*

  Flinn had tapped thousands of timbers under Borin’s watchful eye. Pine, oak, ash, yew, walnut, even the temperamental zebrawood. Always the same. A bright, clear *ping* meant proceed. A dull, hollow *thock* meant discard. Borin’s weathered finger would jab at the offending plank. "Hear that? Death rattle. No argument. Rule’s the rule."

  Flinn set the Ironwood on the scarred workbench. Sunlight, thick with dust motes, slanted through the high window. He picked up Borin’s own small brass-headed mallet, its handle worn smooth by decades of use. He raised it, paused. Ironwood was different. Denser than anything in the Guild stores. Borin had *spoken* of Ironwood, dreamt of working it, but Flinn was certain the Master had never actually *touched* a piece. Not in Flinn’s time. The Guild records, sparse as they were, showed no Ironwood commissions for sixty years.

  He tapped.

  The sound was… neither. Or both. It wasn’t the bright, singing *ping* of flawless oak. But neither was it the unmistakable, sodden *thock* of rot he’d heard in that bad batch of spruce last winter. It was a deep, resonant ***thock***, yes, but possessed of an odd, metallic clarity. Like a bell forged in a bog.

  Flinn froze, mallet hovering. Sweat prickled his scalp.

  *Master Borin’s Rule: Clean ring? Solid. Dead thock? Flaw.*

  But was *this* a "dead thock"? It wasn’t *dead* dead. It had life, resonance. But it wasn’t *clean* either. It was heavy, final. Was *this* the sound Borin meant by "dead thock"? Or was *this*, by virtue of its unique density and resonance, actually the *clean ring* for Ironwood? A sound Borin had described only abstractly, never demonstrated.

  Flinn scoured his memory. Every lesson, every correction. Borin had *only* demonstrated the rule on woods softer than Ironwood. Woods where "thock" was unmistakably the sound of failure. But what defined "dead thock"? Was it a specific acoustic property? Or was it simply *any sound that wasn't the bright ping of common woods*? Had Borin *meant* the rule to be universal? Or was the rule itself implicitly tied to the sonic properties of the woods they *actually* used?

  Panic, cold and greasy, coiled in his gut. He tried to *feel* what Borin meant. He closed his eyes, conjured the Master’s gravelly voice, the scent of linseed oil and pipe smoke. *"Dead thock? Flaw within. Reject it. Always."* The memory was vivid, visceral. But the *sound* attached to that memory… was it the *quality* of the thock he’d heard in spruce and rotten oak? Or was it simply the *concept* of "wrongness" Borin conveyed? Did his own conviction about the rule *now* prove what Borin meant *then*? Or was his conviction just a feeling, shaped entirely by past applications on different materials, helpless to bind this new, unheard case?

  The merchant needed the platter. The Ironwood cost a small fortune. Rejecting it meant admitting uncertainty, losing the commission, damaging his fledgling reputation. Using it… if it *was* flawed… the platter could crack during carving, or worse, shatter years later under use. A Master’s failure.

  He tapped again. ***Thock.*** The sound filled the silent workshop, profound and ambiguous.

  *Did Master Borin mean "Reject wood that makes a sound indicating structural flaw (as commonly heard in softer woods)"?* That would mean *this* thock, with its strange clarity, might be acceptable for Ironwood.

  *Or did he mean "Reject wood that makes THIS kind of sound (the dull, hollow thock) regardless of species"?* That would mean reject *this*.

  Flinn stared at the mallet in his hand – Borin’s mallet. He’d held it a thousand times, tapped a thousand timbers. He *knew* the rule. He *felt* he knew. But confronted with the Ironwood, the dense, unfamiliar reality, the absolute certainty dissolved. There was no hidden note, no secret Guild formula for Ironwood resonance. There was only Flinn, alone in the workshop, with ten years of echoes in softer woods and a sound that fit neither category perfectly. Both interpretations explained his past actions flawlessly. Both felt *possible*. But which one was *true*? Which one had Borin *meant*? Which one had *he*, Flinn, *understood*? The answer wasn't hidden within him; it felt like it had never been fixed at all.

  He lowered the mallet. The Ironwood lay before him, dark and enigmatic. To carve, or not to carve? The rule was silent. It always had been, he realized with a chill that had nothing to do with the sea air. It had only ever *seemed* to speak. He reached for his chisel, his hand trembling slightly. The edge hovered over the dense, unforgiving grain. One slip, and everything could shatter.
