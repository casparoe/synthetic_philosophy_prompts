answer: |-
  What you're grappling with isn't manufactured guilt—it's the quiet voice of scientific integrity confronting the gap between technical compliance and deeper truthfulness. While rulebooks focus on fraud or fabrication, your unease points to a more profound philosophical tension in science. Here's a framework to examine it:

  ### The Unspoken Principles at Stake
  1.  **The Principle of Intellectual Courage (After Karl Popper):**  
      Science advances through falsification, not just verification. Those outliers weren't just "messy data"—they were potential clues. By excluding them without rigorous investigation, you avoided the discomfort of confronting anomalies that might have challenged or refined the theory. Popper would argue this protected the hypothesis from testing, hindering potential progress.

  2.  **The Epistemic Responsibility Principle (After Helen Longino):**  
      Science is a communal enterprise. Your omission deprived the scientific community of the full picture needed to evaluate your claim. Even if the conclusion held, others couldn't assess *how robustly* it held or under what precise conditions it might falter. Transparency isn't just about avoiding lies; it's about enabling collective scrutiny.

  3.  **The Virtue Ethics Lens (After Aristotle/MacIntyre):**  
      Beyond rules, what does it mean to be an *excellent scientist*? Excellence includes intellectual humility (acknowledging uncertainty), meticulousness (pursuing anomalies), and faithfulness to the phenomenon itself—not just the desired narrative. Your younger self prioritized narrative elegance; your older self recognizes a lapse in these virtues.

  ### Why "Probable Contamination" Feels Hollow Now
  *   **The Burden Shift:** Declaring "probable contamination" without evidence shifted the burden of proof. It framed the data as invalid *by assumption*, not through demonstrated investigation. In philosophy of science, this resembles an *ad hoc rescue* of the theory.
  *   **The Slippery Slope of Normalization:** Calling it a "common judgment call" is partly true—which is precisely the problem. When such omissions become normalized, science accumulates unexamined uncertainties and potentially masks systemic errors.

  ### Was it "Wrong"? A Nuanced Verdict
  *   **Not Fraud, but a Failure of Rigor:** You didn't falsify or invent data. However, you sidestepped the rigorous investigation of unexpected results—a core scientific duty.
  *   **Context Matters (But Doesn't Absolve):** Early-career pressure, the era's looser norms, and the desire for a clean narrative are understandable. But these factors explain the action, not justify it epistemically.
  *   **The Harm:** The primary harm wasn't to your paper's reception (it succeeded), but to:
      *   **The Self-Correcting Process:** Future researchers lacked the full data to build upon or challenge.
      *   **Your Own Scientific Conscience:** The nagging feeling is your internal recognition that the *process* was incomplete.

  ### What Your Unease Reveals (And What to Do With It)
  Your discomfort isn't pointless guilt; it's evidence of your growth as a thinker and your deep respect for science. A purely rule-based ethicist might shrug; a philosopher of science understands why this *matters*. Consider:

  1.  **Reframe the Memory:** Instead of seeing it as a shameful secret, view it as a hard-won lesson about the tension between human pressures and scientific ideals. This tension is inherent in research.
  2.  **Legacy of Mentorship:** If you engage with young scientists, share this story (anonymously if needed). Discuss not just "rules," but the *philosophical weight* of choices about data, anomalies, and transparency. Your hindsight is invaluable.
  3.  **Philosophical Resolution:** Read Lorraine Daston & Peter Galison's "Objectivity." It explores how scientific "truth-telling" ideals (like mechanical objectivity vs. trained judgment) have evolved. Your experience reflects a very real historical tension.
  4.  **Acceptance:** You acted within the gray areas of your time and context, yet now recognize a deeper ideal. This dissonance is part of being an ethical practitioner in an imperfect system. The guilt isn't pointless—it honors the integrity you value now.

  **In essence:** What you did was a common but epistemically suboptimal practice. It prioritized narrative coherence over full intellectual honesty. Your current unease isn't manufactured; it's the voice of a more mature scientific conscience—one that understands science's deepest purpose isn't just clean results, but the relentless, often messy, pursuit of reliable knowledge through transparent inquiry. That conscience is a credit to the philosopher you've become.
