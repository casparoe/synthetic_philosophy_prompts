  I remember Wittgenstein's private language argument. He argued that rules aren't defined by internal mental states but by public practices. So for this card game, the rule's meaning comes from how they've actually applied it in the past. But here's the problem: since this specific situation never occurred before, there's no existing practice to refer to. That means there's no pre-existing fact about what the rule "really" meant for this case. The rule only gains meaning through its use, and this new case is like a new application.

