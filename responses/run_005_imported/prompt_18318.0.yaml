  First, I need to reconstruct Hobbes's position tightly: his certainty comes from *human construction via motion*. Points trace lines, lines sweep planes—it’s all causal because we define the motions. Physical science? Mere "guessing" because we didn’t build nature.  

  The user’s real question hinges on whether non-Euclidean geometries, being equally constructible via alternative motions (e.g., tracing lines on a sphere), force Hobbes to accept them as equally "certain." Or can he still privilege Euclidean geometry as "true" for physical space?  

  Hobbes’s materialism complicates this. For him, all truth is grounded in matter and motion. If non-Euclidean systems describe physical reality (e.g., curved spacetime), wouldn’t his framework *have* to adapt? But his entire epistemology rests on Euclidean construction as the ideal.  

  I see three possible reactions from Hobbes:  
  1. **Radical pluralism**: All consistent constructive geometries are equally "true sciences." But this undermines his dismissal of natural science—if multiple geometries describe reality, why can’t physics be certain too?  
  2. **Empirical retreat**: Only one geometry matches physical space, but we must *observe* to know which. This contradicts his anti-empiricism—he’d hate admitting geometry needs sensory validation.  
  3. **Definitional dogmatism**: Insist Euclidean motions are the only "clear" ones. But spherical or hyperbolic motions are just as definable. He’d look like Wallis-feud-era Hobbes—stubbornly ignoring counterevidence.  

  The user might also be probing how philosophical systems handle paradigm shifts. Hobbes built a fortress of certainty—non-Euclidean math bulldozes it. His materialism *could* absorb new geometries ("all are products of matter!"), but his psychological need for absolute certainty would revolt.  

