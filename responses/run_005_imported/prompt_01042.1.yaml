prompt: |-
  For an independent research project on the history and philosophy of physics, I've been working through the Scholium that Newton attached to the Definitions at the start of the Principia, where he argues that motion can be absolute and not merely relative. I think I follow the general shape of the bucket experiment, but one part of the reasoning keeps tripping me up. Here is the passage, in Andrew Motte's English translation (from an 1846 edition):

  "The effects which distinguish absolute from relative motion are, the forces of receding from the axis of circular motion. For there are no such forces in a circular motion purely relative, but in a true and absolute circular motion, they are greater or less, according to the quantity of the motion. If a vessel, hung by a long cord, is so often turned about that the cord is strongly twisted, then filled with water, and held at rest together with the water; after, by the sudden action of another force, it is whirled about in the contrary way, and while the cord is untwisting itself, the vessel continues for some time this motion; the surface of the water will at first be plain, as before the vessel began to move; but the vessel, by gradually communicating its motion to the water, will make it begin sensibly to revolve, and recede by little and little from the middle, and ascend to the sides of the vessel, forming itself into a concave figure (as I have experienced), and the swifter the motion becomes, the higher will the water rise, till at last, performing its revolutions in the same times with the vessel, it becomes relatively at rest in it. This ascent of the water shows its endeavour to recede from the axis of its motion; and the true and absolute circular motion of the water, which is here directly contrary to the relative, discovers itself, and may be measured by this endeavour. At first, when the relative motion of the water in the vessel was greatest, it produced no endeavour to recede from the axis; the water showed no tendency to the circumference, nor any ascent towards the sides of the vessel, but remained of a plain surface, and therefore its true circular motion had not yet begun. But afterwards, when the relative motion of the water had decreased, the ascent thereof towards the sides of the vessel proved its endeavour to recede from the axis; and this endeavour showed the real circular motion of the water perpetually increasing, till it had acquired its greatest quantity, when the water rested relatively in the vessel. And therefore this endeavour does not depend upon any translation of the water in respect of the ambient bodies, nor can true circular motion be defined by such translation."

  What I can't work out is the logic of the middle section, where Newton describes the water gradually catching up to the spinning bucket. He seems to want us to notice that the water's motion relative to the bucket is greatest exactly when its surface is still flat, and has fallen to zero exactly when its surface is most concave, and he treats this second moment as the point where the water's "true and absolute circular motion" reveals itself. I can see how this rules out the water's motion relative to the bucket as the source of the effect, but I can't tell whether Newton takes the bucket experiment by itself to already prove that the water is rotating relative to space itself, or whether it only shows that the bucket in particular is the wrong thing to measure the rotation against, leaving it open that something else nearby, like the room, the ground, or even the distant stars, could still be doing that job instead. Which of these is he actually entitled to conclude from this experiment alone, and does Newton himself deal with that gap anywhere else in the Scholium?
