prompt: |-
  So this is kind of a random one but my computer science teacher runs this tiny after-school "CS and Philosophy" club (like 6 of us actually show up lol) and every semester she invites a guest for us to interview for this little podcast thing she posts on the school youtube channel. This time it's a computer scientist who's apparently kind of a big deal in philosophy-of-computation circles for arguing that the Church-Turing thesis isn't just some unprovable axiom everyone quietly agrees to -- her whole thing is that it's actually more like an empirical law of nature (she compares it to the laws of thermodynamics at one point in an interview I found), backed by real evidence even though it can't be proven the way an actual theorem can. I got stuck writing the questions since I'm apparently the only one who did the reading (I've read the SEP article on the Church-Turing thesis like three times now and I think I mostly get it??).

  I don't want it to just be "can you explain the Church-Turing thesis for us," since thats literally just the wikipedia page. Can you write me like eight or nine actually substantial interview questions? I want at least one that pushes on the "independent formalisms all converged on the same class of functions" argument (turing machines, lambda calculus, general recursive functions etc all turning out equivalent) -- like is that really independent evidence the thesis is true, or does it just show a bunch of 1930s logicians shared the same hidden assumptions about what "mechanical" means. I also want one about Turing's own oracle machines and whether Turing might have secretly half-doubted his own thesis (I saw something about a guy named Copeland arguing this based on Turing's ordinal-logic PhD thesis, but I don't totally follow it, so maybe that question can kind of unpack it for her to respond to). And I want one that presses on whether the "physical Church-Turing thesis" (about what any physical process in our actual universe can compute) is a totally different, more falsifiable claim than the original mathematical one, and whether shes quietly sliding between the two whenever she calls the thesis "empirical."

  Then end with a question that basically makes her say what a discovery AGAINST the thesis would even look like, since if literally nothing could count as evidence against it, calling it "empirical" starts to seem kind of hollow. For each question, can you also add a quick one or two line note on what she'd probably answer, plus a natural follow-up question keyed to that answer, so I'm not just standing there blanking if she gives the response you'd expect.
