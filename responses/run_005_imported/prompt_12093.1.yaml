  8. **Score 2**: Owen’s rebuttal is decisive: indeterminism introduces arbitrariness, worsening Mara’s case by divorcing actions from the agent’s character.  

  ### What Both Are Missing  
  Mara and Owen both overlook a **compatibilist middle ground**: responsibility may not require "ultimate" self-authorship but could depend on whether actions express one’s character/values *and* align with reasons (e.g., Theo’s sobriety reflects a responsive, reasons-sensitive agency). They also conflate *praise* (which can acknowledge effort/luck) with *metaphysical credit* (which demands impossible self-causation).  

  ### Can Theo Be Credited?  
  In everyday terms, **yes**—Theo’s choices and perseverance warrant praise. His success reflects his sustained agency, making him the appropriate target of credit. But in the *deep* sense Owen challenges (total self-authorship), **no**—his traits and choices are conditioned by unchosen luck. The practical view suffices: we credit Theo not because he authored himself ex nihilo, but because his actions meaningfully flow from who he is.
