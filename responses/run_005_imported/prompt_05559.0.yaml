  Now, looking at the objections. Aaronson's expander graphs are simple circuits with high Φ but no apparent consciousness. That seems problematic because Φ is supposed to measure consciousness, but these systems don't do anything complex. The unfolding argument shows that a recurrent network (high Φ) can be transformed into a feedforward one (Φ=0) with identical behavior. This suggests Φ isn't tied to observable functions. The exclusion postulate makes consciousness depend on tiny differences in Φ between overlapping systems, which seems arbitrary.

