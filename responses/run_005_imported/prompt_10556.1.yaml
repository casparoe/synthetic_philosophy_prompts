answer: |-
  Here's a clear breakdown of the relationship between Buchak's REU and Quiggin/Yaari's RDU, designed for your paragraph:

  **The Short Answer (For Your Editor):**

  > "Formally, Buchak's Risk-Weighted Expected Utility (REU) is a *specific type* of Rank-Dependent Utility (RDU), sharing its core mathematical structure of reweighting probabilities based on outcome rank. However, their *purpose* differs fundamentally: RDU is primarily a *descriptive* model explaining *why* people deviate from Expected Utility, while REU is a *normative* theory arguing that such deviations (specifically global risk aversion) are *rationally permissible*, justified by a distinct attitude towards risk itself, not just utility curvature."

  **The Full Untangling:**

  1.  **The Formal Core is Shared (RDU Framework):**
      *   Both REU and RDU fundamentally reject the linearity in probabilities of Expected Utility (EU).
      *   Both achieve this by introducing a transformation function applied to *cumulative probabilities* (RDU) or *decumulative probabilities* (REU). Crucially, **these are mathematically equivalent perspectives** for lotteries with finitely many outcomes. Transforming the cumulative distribution function (CDF) is the mirror image of transforming the decumulative distribution function (1-CDF).
      *   Both models weight the utility of outcomes based on their *rank* (position in the ordered outcome sequence, best to worst or worst to best). The transformation function (`w(p)` in RDU, `r(p)` in REU) distorts the probabilities before calculating the expectation.
      *   **Formally, REU fits squarely within the RDU framework.** It uses the same mathematical engine.

  2.  **The Crucial Difference: Descriptive vs. Normative & Risk Attitude:**
      *   **RDU (Quiggin/Yaari):** Developed primarily as a *descriptive* and *positive* theory. Its goal was to *account for observed behavior* violating EU (like Allais paradox, common ratio effect), especially the overweighting of extreme outcomes (very bad or very good). The probability weighting function `w(p)` is often interpreted as capturing psychological *probability distortion* or *perception bias*.
      *   **REU (Buchak):** Developed primarily as a *normative* and *positive* theory. Its goal is to argue that a specific pattern of deviation from EU – namely, *global risk aversion* (aversion to spreading out risk across states, valuing certainty premiums) – is *rationally defensible*. Buchak interprets her risk function `r(p)` not as a distortion of belief, but as capturing a distinct, fundamental *attitude towards risk itself* (a "risk function"). This attitude is separable from both beliefs (probabilities) and values (utility). REU aims to *justify* choices like those in the Allais paradox as expressions of a coherent, permissible rational preference structure.

  3.  **Substantive Addition or Reinterpretation?**
      *   **Formally:** It's largely a reinterpretation within an existing framework. Buchak didn't invent a new mathematical structure; she applied the RDU structure with a specific normative intent.
      *   **Philosophically/Normatively:** It **is** a substantive addition. Buchak provides a rigorous *normative defense* for a pattern of choice (global risk aversion) that RDU merely *describes*. She argues that EU is not the sole arbiter of rationality and that REU offers a coherent alternative standard. This directly addresses the core debate in your piece about the "irrationality" of Allais-type choices. She gives risk-averse agents a *rational voice* within decision theory, not just a psychological explanation.

  4.  **Explaining Allais: Whose Account Does More Work?**
      *   **Descriptively:** Both RDU and REU can *model* the Allais choices equally well mathematically. An appropriately chosen weighting/risk function in either framework will predict the certainty premium.
      *   **Explanatorily (Why?):**
          *   **RDU:** Explains it as a consequence of *probability weighting* – people overweight the tiny chance of winning nothing in Gamble A (the certain option in the first choice) compared to Gamble B, and underweight the slightly smaller chance of winning nothing in Gamble D compared to Gamble C (the risky options in the second choice). The focus is on local probability distortions.
          *   **REU:** Explains it as a consequence of a *global attitude towards risk* – the agent values reducing exposure to uncertainty *as a whole*. The certainty of Gamble A eliminates *all* uncertainty about getting *at least* $1 million, which the agent values highly due to their risk function `r(p)` (which typically downweights the best outcomes in the decumulative tail). The focus is on the overall shape of the risk.
      *   **The Bet:** For **why someone would pay a premium for certainty**, **Buchak's REU arguably provides the deeper *normative* explanation** relevant to your piece's theme. While RDU accurately describes the cognitive mechanism (probability weighting), REU directly engages with the philosophical question: *Is this preference structure rationally defensible?* Buchak argues "Yes, it reflects a coherent attitude towards risk itself." RDU, as typically used, remains agnostic or implicitly suggests it's a deviation from the rational benchmark (EU). REU challenges that benchmark head-on.

  **Your Paragraph Draft:**

  > "While exploring alternatives to Expected Utility Theory (EUT) that resolve the Allais paradox, I encountered two prominent frameworks: Quiggin and Yaari's Rank-Dependent Utility (RDU) and Lara Buchak's Risk-Weighted Expected Utility (REU). Superficially similar – both reweight probabilities based on outcome rank instead of taking them linearly – their core purposes diverge sharply. RDU emerged as a *descriptive* model, explaining deviations from EUT (like the certainty premium in Allais) through psychological *probability weighting*. Buchak's REU, while mathematically a type of RDU, is fundamentally a *normative* theory. It argues that such deviations, specifically a preference for reducing overall uncertainty ('global risk aversion'), reflect a distinct, rationally permissible *attitude towards risk* captured by her 'risk function,' not merely miscalibration or an oddly curved utility function. Thus, REU directly challenges the notion that Allais-type choices are irrational, offering a formal justification where RDU primarily offers an explanation." (Adjust length as needed)

  This captures the formal similarity, the descriptive/normative split, and Buchak's key contribution of justifying risk aversion as rational. Good luck with the draft!
