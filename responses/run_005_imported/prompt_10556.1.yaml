  The user is wondering if REU is just RDU with a philosophical twist. I should highlight that while mathematically analogous, their purposes differ. RDU is about describing behavior, whereas REU defends that behavior as rational. The user also asks whose account better explains the Allais paradox. Both can explain it, but REU provides a normative justification, which might be the deeper point they need for their article.

