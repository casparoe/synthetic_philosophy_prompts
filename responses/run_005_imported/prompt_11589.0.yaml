  The emotional core seems to be about integrity: honoring a man who pursued uncomfortable truths while maintaining deep loyalty to his comrades. Maybe framing his intellectual evolution as courage rather than repudiation? And emphasizing that his later work stemmed from taking soldiers' moral burden seriously, not dismissing their honor.

