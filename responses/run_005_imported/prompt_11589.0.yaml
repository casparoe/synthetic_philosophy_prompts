  Biggest risk areas:
  - The military friends hearing any implication their service was morally compromised
  - The students feeling his legacy is being whitewashed
  - The "objective justice" minefield regarding Vietnam

  Workaround: Focus on his character through the lens of each audience. For soldiers: his loyalty and shared sacrifice. For philosophers: his intellectual courage. For family: his warmth. The philosophical content stays anchored to his personal journey - not abstract debate.

  Notable tension: The uncle never resolved how his theory applied to his own service. That's actually useful - it makes the eulogy's ambiguity honest rather than evasive. Can present this as his lifelong integrity: "grappling honestly" with questions most avoid.

  Final structure probably: 
