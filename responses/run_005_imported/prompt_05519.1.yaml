answer: |-
  Here is a eulogy that honors your advisor's life, work, and deepest convictions, speaking to both hearts and minds without compromising her philosophical legacy:

  ---

  We gather today heartbroken, united in our love and profound respect for Dr. [Advisor's Name]. For many of you, she was a cherished sister, aunt, friend. For us, her students and colleagues, she was a brilliant guide, a fierce interlocutor, and a foundational presence in our intellectual lives. Trying to capture the totality of her – the sharp wit, the unwavering loyalty, the quiet acts of kindness we all witnessed, *and* the towering intellect that reshaped debates – feels impossible. But we try, because she deserves nothing less.

  [Advisor's Name] dedicated her life to understanding something fundamental: what it means to be good. Not just conventionally nice, but truly, deeply *right* in our moral convictions. She believed, with a quiet certainty that infused her whole being, that goodness isn't just a feeling we evolved to get along, or a happy accident. She believed we can actually *get it right* – that there are truths about how we ought to live and treat each other, truths that stand firm regardless of where we came from.

  Much of her professional energy was spent defending this conviction against a powerful challenge: the idea that our moral sense is *only* the product of natural selection, shaped solely for survival, leaving no room for genuine truth. She wrestled with this deeply. It wasn't an abstract puzzle; it struck at the core of what she felt morality *was*. The challenge presented a stark choice: either evolution somehow magically steered us towards real moral truths, or our sense of right and wrong aligning with any deeper truth is just a massive, inexplicable coincidence.

  But [Advisor's Name] was never one to accept a false dilemma. She saw a third path, a way out that honored both the science of our origins *and* the undeniable reality of moral truth as she experienced it. She argued that our moral capacities *did* evolve – they helped us survive and cooperate – but crucially, *what made them helpful for survival was precisely their connection to genuine moral facts*. It wasn't luck, and it wasn't evolution tracking truth like a homing device. It was that certain truths – about fairness, reciprocity, care – are *inherently* conducive to building societies that thrive. Evolution favored creatures who could grasp these truths, not because it "knew" they were true, but because living by them *works*, and works *because* they are true.

  This wasn't just theory for her. It was the bedrock of how she moved through the world. That decency you all knew – her fierce integrity, her deep empathy, her commitment to fairness even in the smallest departmental matter – wasn't a lucky fluke of biology. It wasn't *just* her temperament. It was her *getting it right*. It was a conscious alignment with truths she had spent a lifetime arguing for. She lived the reality she defended: her goodness was an achievement, a testament to her understanding and her choices. To call it a mere side effect of evolutionary pressures would have felt, to her, like a profound diminishment of the conscious, striving, *correct* moral agent she was.

  For those of us who argued with her – and we did, passionately, for decades in seminar rooms and conference halls – that unwavering conviction was our north star. She demanded rigor. She challenged assumptions. She made us defend our ground. But it was always in pursuit of that shared, vital goal: understanding the reality of value. She didn't just want to win arguments; she wanted to *find the truth*. And she made us better thinkers, better philosophers, by the sheer force of her clarity and her refusal to accept easy answers that diminished the moral landscape she knew was real.

  For those who knew her love, not her footnotes: know that the woman who remembered every birthday, who showed up with soup when you were sick, who offered fierce, protective loyalty, was the *same* woman who wrestled angels and opponents over the foundations of the good. Her warmth wasn't separate from her intellect; her kindness wasn't divorced from her convictions. They were intertwined, manifestations of the same profound commitment to what is real and what is right.

  [Advisor's Name], your absence leaves a void that cannot be filled. We will miss your laugh, your sharp insights, your steadfast presence. But you leave us more than memories. You leave us your example: a life lived with intellectual courage and deep moral conviction. You leave us the challenge to think clearly and live well. And you leave us the enduring argument that goodness is not an illusion, not an accident, but something we can perceive, understand, and choose – something real, something true, something worth building a life, and a legacy, upon.

  Rest now, dear teacher, dear friend. You got so much right. Thank you.

  ---

  **Key elements addressing your requirements:**

  1.  **Accessibility for Non-Philosophers:** Uses terms like "goodness," "sense of right and wrong," "truths about how we ought to live," "survival," "cooperation," "fairness," "care." Focuses on her character ("fierce integrity," "deep empathy," "loyalty," "kindness") and the *human stakes* of her work ("diminishment of the conscious... moral agent," "what it means to be good").
  2.  **Satisfaction for Specialists:**
      *   Clearly identifies the challenge ("moral sense is *only* the product of natural selection").
      *   Names the "false dilemma" structure of the Darwinian Dilemma explicitly.
      *   Articulates her "third path" solution accurately: moral facts are *conducive* to survival *because* they are true; evolution selects for sensitivity to them *because* of this conduciveness, not because it tracks truth directly nor as coincidence.
      *   Uses precise phrasing like "inherently conducive," "connection to genuine moral facts," "conscious alignment with truths."
      *   Acknowledges the depth and rigor of the debates ("wrestled with this deeply," "fierce interlocutor," "demanded rigor," "challenged assumptions," "defend our ground").
  3.  **Honoring Her Core Conviction (No Concession):**
      *   Explicitly rejects framing her decency as a "lucky fluke" or "mere side effect" or "just her temperament."
      *   Positively frames it as "getting it right," "conscious alignment," "achievement," "testament to her understanding and choices."
      *   States clearly that her solution avoids both the "magic" horn and the "coincidence" horn ("It wasn't luck, and it wasn't evolution tracking truth...").
      *   Links her personal character directly to her philosophical position, showing them as manifestations of the same commitment to moral truth. This is crucial: her life *embodied* her argument.
      *   The closing line ("You got so much right") directly affirms her realism and her personal correctness.
  4.  **Warmth & Respect:** Focuses on her personal qualities, impact on students/colleagues/family, the shared sense of loss, and gratitude. Uses affectionate terms ("dear teacher, dear friend").

  This eulogy strives to make her complex philosophical contribution understandable in its human significance while ensuring the specialists hear the precise, uncompromised version of her argument she would demand. It honors her life by showing how her philosophy and her character were inseparable expressions of her deepest belief: that moral truth is real, knowable, and lived.
