  The AI system, if it tries to use a fixed weighted sum and a fixed probability, cannot represent the unanimous preferences in this example.

  Which piece of the Harsanyi setup is to blame? The requirement of a single aggregate probability distribution. In the original Harsanyi theorem, there is a common prior (shared probabilities) and the theorem then delivers a weighted sum of utilities. When we drop the common prior, we get this impossibility.

  The Pareto principle (unanimity) and the requirement that the aggregator is Bayesian (i.e., uses expected utility with respect to some probability) together with the linear aggregation of utilities force the aggregator to use a single probability, and that leads to the contradiction when the agents have different probabilities.

  In this example, the tension arises from the requirement of a single aggregate probability.

