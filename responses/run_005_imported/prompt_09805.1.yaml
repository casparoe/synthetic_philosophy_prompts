answer: |-
  Your situation cuts to the heart of agency, responsibility, and the tension between outcome and process. The key isn't whether the *outcome* depended on your vote (it didn't), but what your vote *represented* in the moral and institutional landscape. Here’s a breakdown of what’s doing the work:

  ### 1. **Responsibility as Causation vs. Responsibility as Agency**
     - **Causal Responsibility (Outcome):** You are *not* causally responsible for the director’s removal. The funder’s predetermined action was the true cause. Your vote was, in hindsight, causally inert.
     - **Moral Agency Responsibility (Choice):** You *are* responsible for the *choice you made*, irrespective of the outcome. Your deliberation and vote were expressions of your judgment and values. This responsibility exists independently of external forces. You exercised agency in alignment with your principles, and that carries ethical weight.

  ### 2. **The Value of Institutional Integrity**
     - Your vote preserved the board’s role as the legitimate decision-maker. By voting to remove, you upheld the board’s duty to oversee the executive. Had the funder intervened after a "keep" vote, it would have exposed the board’s failure to act, damaging its credibility. Your vote shielded the institution’s autonomy, even if only symbolically.
     - **Key Insight:** Your action maintained the *process* of accountability. The director was removed *by the board* for cause, not by a funder’s contractual power. This distinction matters for organizational justice and precedent.

  ### 3. **The Funders' Gambit & Your Unwitting Role**
     - The funder used the board as a "moral litmus test." Your sincere deliberation gave their override legitimacy. Had you voted to retain, the funder’s intervention would have been framed as correcting board failure. By voting to remove, you validated their stance *organically*. 
     - **Paradox:** Your ignorance of their plan made your judgment pure. Had you known, your vote could have been strategic (e.g., voting "keep" to force the funder’s hand). Your unawareness preserved the integrity of your decision.

  ### 4. **The Director’s Experience & Justice**
     - While the outcome was identical, the *meaning* differed for the director. Being removed by the board after due process acknowledges wrongdoing and respects governance. Being ousted by a funder feels like capricious external interference. Your vote ensured their departure was grounded in institutional due process, not a backroom deal.

  ### 5. **Where Responsibility Resides**
     - **For the outcome:** Shared between the director (whose actions triggered the crisis), the funder (whose power predetermined the result), and systemic factors (e.g., grant clauses enabling funder overreach).
     - **For your choice:** Entirely yours. You assessed evidence, weighed values (organizational integrity vs. loyalty/benefit of the doubt), and acted. That you’d have arrived at the same conclusion without the funder’s pressure underscores the authenticity of your responsibility.

  ### Why This Nags at You: Moral Injury vs. Moral Luck
    - **Moral Injury:** You caused harm (voting someone out) only to learn your agency was "overwritten." This creates dissonance: "Did my choice matter?"
    - **Moral Luck:** You’re judging a past decision with new information (the funder’s plan). But responsibility must be assessed based on what you knew *then*. Your good-faith deliberation is what matters.

  ### The Verdict
  You bear **responsibility for your choice**, but **not for the predetermined outcome**. Your vote was a morally significant act because:
  - It reflected autonomous judgment under uncertainty.
  - It preserved institutional self-governance.
  - It ensured the director’s removal was an act of accountability, not coercion.

  **What to trust:** Your discomfort is proof of your ethical engagement. The weight you feel isn’t guilt for the outcome, but respect for the gravity of agency. Your responsibility lies not in controlling the world (which no one does), but in owning your role within it. The funder’s power doesn’t erase your integrity—it highlights it. You acted rightly *despite* forces that rendered your vote mechanically redundant. That’s where your responsibility—and your honor—truly resides.
