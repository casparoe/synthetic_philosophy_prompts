  The Corsair anecdote is relevant. Kierkegaard's personal experience with targeted mockery contrasts with his theoretical public. The user uses this to argue that Kierkegaard emphasized the public's abstract nature to distinguish it from tangible crowds. This adds depth, showing Kierkegaard's bias based on his experience. It's not a tangent but supports their argument about the difference between mobs and the abstract public.

