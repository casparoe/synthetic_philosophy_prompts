prompt: |-
  So I'm on the board of a small literary charity (I've had two novels out myself, which is apparently why they wanted an actual writer on the board and not just donors and lawyers). Every quarter we hand out one emergency grant, and this time there's $30k to split between three finalists and the board's stuck. Applicant A is a single dad about to lose his apartment mid-manuscript. Applicant B has a progressive illness and says money doesn't convert into writing time for her the way it does for the others -- whatever she gets, a chunk has to go straight to paid help for basic tasks before she can write a word. Applicant C has crushing medical debt from an unrelated accident and is, on paper, the worst-off of the three, though nobody thinks the debt affects her ability to finish her book. Half the board wants a straight three-way split on principle, the other half wants to weight it toward whoever's worst off overall, and our chair (an ex-economist) keeps asking what the grant's even supposed to be equalizing before we can agree on anything else. Can you draft the short memo I'll bring to next weeks meeting: an actual recommendation with real dollar figures, not just a principle, that takes the equal-split camp seriously instead of just brushing past them?
reasoning: |-
  Okay, the user is on the board of a literary charity and needs to draft a memo for their next meeting. They have to distribute $30k among three emergency grant applicants with different situations. Let me unpack the key points.

  First, the applicants: Applicant A is a single dad about to lose his apartment mid-manuscript. Applicant B has a progressive illness, so part of her grant would go to paid help before she can write. Applicant C has crushing medical debt, which doesn't affect her writing ability but makes her the worst-off financially. 

  The board is split. Half wants an equal split, arguing fairness and simplicity. The other half wants to weight based on need. The chair, an ex-economist, is asking what the grant is trying to equalize. The user wants a concrete recommendation with dollar figures that respects both camps.

  The user is a writer themselves, so they understand the creative process. They need a solution that’s both principled and practical. The memo should address the chair's question about the grant's purpose. The charity’s goal is likely to support writers in crisis so they can finish their work. So the grant should equalize the ability to write despite emergencies.

  Balancing equality and equity is key. An equal split might overlook different needs, but weighting too heavily could alienate the equal-split advocates. The user wants to validate both sides. Maybe a hybrid approach? Give each a base amount close to equal, then allocate extra based on specific barriers.

  Looking at each applicant: Applicant A needs rent to avoid eviction, which directly impacts writing stability. Applicant B requires paid help to free up time, which is a prerequisite for writing. Applicant C's medical debt, while severe, doesn’t hinder her writing process. So the funds for A and B have a more direct link to enabling their work.

  The chair’s point about defining what to equalize is crucial. The grant should equalize the opportunity to write by removing immediate barriers. For A, it’s housing stability; for B, it’s care support; for C, it’s debt relief, though that’s less directly tied to writing output. 

  Proposing a base of $8k each ($24k total) leaves $6k for additional allocation. Then, give A an extra $2k for rent buffer, B an extra $3k for care costs, and C an extra $1k. That makes A: $10k, B: $11k, C: $9k. This way, everyone gets substantial support, with adjustments for the most urgent writing-related needs.

  This approach shows the equal-split camp their principle is honored through the base amount, while the weighted camp sees needs addressed. The dollar differences are meaningful but not extreme, avoiding perception of unfairness. Highlighting the rationale in the memo—tying funds to writing barriers—should satisfy the chair’s emphasis on purpose. Also, emphasizing that all three are deserving maintains goodwill.
answer: |-
  ## MEMO: Emergency Grant Allocation Recommendation  
  **To:** Board of Directors  
  **From:** [Your Name], Board Member  
  **Date:** [Date]  
  **Subject:** Proposed Allocation of Q3 Emergency Grant ($30,000)  

  ### 1. Core Principles Guiding Recommendation  
  After careful consideration of the three exceptional finalists and board discussions, I propose an allocation strategy balancing two core values:  
  - **Equity of Opportunity:** Ensuring each writer can convert funds into *writing time* (addressing Chair’s question).  
  - **Recognition of Equal Worth:** Honoring the equal-split camp’s principle that all three deserve meaningful support.  

  The grant’s purpose is to **equalize the ability to complete significant literary work despite acute, external crises**. Funds should mitigate the *most direct barriers to writing time*.  

  ### 2. Recommendation: Hybrid Allocation  
  A split acknowledging baseline equality while addressing disproportionate barriers:  

  | Applicant | Allocation | Rationale | Direct Impact on Writing |  
  |-----------|------------|-----------|--------------------------|  
  | **Applicant A**<br>(Single dad, housing crisis) | **$10,000** | Prevents eviction, securing stable writing environment. Urgent but solvable with targeted funds. | **High:** Directly frees time/mental bandwidth. |  
  | **Applicant B**<br>(Progressive illness, requires paid help) | **$11,000** | $10k = base equality. +$1k offsets unavoidable "conversion loss" to care costs, ensuring writing time isn’t disproportionately reduced. | **Critical:** Funds are gatekeepers to writing capacity. |  
  | **Applicant C**<br>(Medical debt, no writing impact) | **$9,000** | Full base support minus minor adjustment reflecting that debt, while severe, doesn’t impede *writing time* like A/B’s crises. | **Indirect:** Alleviates stress but less directly tied to daily writing output. |  

  **Total: $30,000**  

  ### 3. Why This Addresses Both Camps  
  - **For Equal-Split Advocates:**  
    - All three receive substantial, comparable support (**$9k–$11k** vs. $10k flat).  
    - No applicant is "penalized" for circumstances beyond control.  
    - Maintains simplicity: deviations are modest (+/- $1k) and tied to explicit, grant-purpose criteria.  
  - **For Weighted-Need Advocates:**  
    - Recognizes Applicant B’s unique "conversion penalty" and Applicant A’s time-sensitive housing threat.  
    - Acknowledges Applicant C’s hardship while prioritizing funds where they directly "buy" writing time.  
  - **For the Chair’s Question:**  
    > *"The grant equalizes the writer’s capacity to focus on their manuscript by neutralizing the most immediate, non-literary crisis consuming their resources (time/money/mental health)."*  

  ### 4. Key Considerations  
  - **Accountability:** All recipients must confirm grant use aligns with applications (e.g., A’s rent, B’s care costs).  
  - **Perceived Fairness:** This avoids large disparities (e.g., $15k/$10k/$5k) that could demoralize recipients. Small adjustments signal nuanced need without hierarchy.  
  - **Precedent:** Sets clear criteria (direct impact on writing time) for future weighting, avoiding ad-hoc decisions.  

  ### 5. Proposed Motion  
  *"Move to allocate the Q3 emergency grant as follows: $11,000 to Applicant B, $10,000 to Applicant A, and $9,000 to Applicant C, based on a hybrid model prioritizing equal baseline support with minor adjustments for disproportionate barriers to writing time conversion."*  

  ---  
  **This approach bridges our divisions by upholding the dignity of equal support while responding to acute realities. It aligns the grant’s purpose with tangible outcomes: three manuscripts moving closer to completion.**
