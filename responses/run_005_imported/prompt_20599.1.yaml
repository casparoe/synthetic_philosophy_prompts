  Avicenna's concept of the internal senses is key here. He believed faculties like common sense and imagination are located in different brain ventricles but unified by the soul. So, even if brain regions are disconnected, the soul integrates information. In split-brain cases, the soul might struggle to integrate due to physical damage, but the self remains singular. The patient's confusion when hemispheres conflict shows an underlying unity trying to make sense of fragmented inputs.

