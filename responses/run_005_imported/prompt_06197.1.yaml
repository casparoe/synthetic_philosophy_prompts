prompt: |-
  Random thing that's been bugging me since an old Alignment Forum thread. The standard pitch for IRL-based value learning (a la Human Compatible) is that you skip hand-coding human values and just infer the reward function from observed behavior. Sure, with only a handful of demonstrations you're underdetermined, loads of reward fns fit the same trajectories equally well. But that feels like a normal small-data problem to me: once you're training on way more behavioral data, and you break any remaining ties with a simplicity prior (just take whichever reward + rationality-model pair is simplest), shouldn't the ambiguity basically disappear? Everyone in that thread was treating it like some deep unsolved problem rather then a 'more data + Occam's razor' situation -- am I missing something?
reasoning: |-
  Okay, let me start by unpacking the user's question. They're referring to a common argument in AI alignment about inferring human values from behavior. The user is confused why this is seen as a deep problem when, to them, it seems solvable with more data and Occam's razor. 

  First, I need to recall the key points from Stuart Russell's approach in Human Compatible. The idea is to avoid hard-coding values and instead learn them from human behavior. The user thinks that with enough data and a simplicity prior, the reward function ambiguity should resolve. But why do experts consider this a hard problem?

  Hmm, the user might be underestimating the complexities. Let me list the reasons why more data and Occam's razor might not suffice. The first thing that comes to mind is Goodhart's law. Even if you have a lot of data, optimizing a proxy can lead to divergence. The proxy might be close but not perfect, and at superhuman levels, that small difference could cause catastrophic outcomes.

  Then there's the problem of partial observability. Humans act based on internal states—beliefs, intentions, emotions—that aren't visible. If the AI misinterprets these, it could learn wrong values. For example, someone might act irrationally due to fatigue, but the AI thinks that's part of their values. More data might not capture these hidden states accurately.

  Another angle is counterfactuals. Humans often don't demonstrate what they *wouldn't* do, especially in novel situations. Training data is limited to past behaviors, but future scenarios might require actions never observed. The AI might not extrapolate correctly, even with simplicity priors.

  The ontology problem is tricky too. Values depend on concepts that the AI might not grasp. Humans understand abstract ideas like justice or love, but an AI might break them down into incorrect sub-components. If the AI's ontology doesn't match ours, the learned values could be fundamentally misaligned.

  Multitask vs. utility maximization is another point. Humans balance multiple goals, but an AI might see a single reward function. Simplifying to one function could lose the nuances of how we prioritize different values in different contexts.

  Non-stationarity adds complexity. Human values evolve over time. An AI trained on historical data might not adapt to current values, leading to outdated or harmful actions. Also, the feedback loop where AI influences human behavior could create a dangerous cycle, altering the data it learns from.

  The user mentions Occam's razor, but simplicity priors might not align with human values. The simplest model isn't necessarily the most accurate for complex human preferences. Misapplication could favor incorrect but simpler functions over more complex, correct ones.

  I should also consider the user's background. They mention an Alignment Forum thread, so they're likely familiar with basic AI alignment concepts. Their confusion suggests they might need deeper technical explanations. They’re looking for why the problem persists despite seemingly straightforward solutions. Addressing each counterargument with concrete examples would help clarify.

