  We are ranking six positions on verisimilitude after the Tichý-Miller result. The criteria are:
  (i) Escape Tichý-Miller triviality.
  (ii) Language-invariance (reasonably invariant under empirically equivalent redescription).
  (iii) Matches actual historical cases of theory succession.

  The positions:
  1. Popper's original (content-inclusion) -> fails by Tichý-Miller, so trivial for false theories.
  2. Likeness approach (Tichý, Hilpinen, Oddie) -> uses distances between models and the actual world.
  3. Niiniluoto's min-sum -> combines similarity and content.
  4. Schurz-Weingartner (relevant consequences) -> restricts to relevant consequences.
  5. Quantitative extension (Cevolani, Festa) -> for numerical predictions.
  6. Laudan's skepticism -> abandon the project.

  Tier definitions:
  S: closest to rigorous, language-invariant, and licenses ordinary judgments.
  A: good but not as strong as S on one or more criteria.
  B: moderate, with notable limitations.
  C: weak, with serious problems.
  D: does not solve the problem or gives up.

  Analysis:

  1. Popper's original (1): 
     - (i) Does not escape Tichý-Miller (trivial for false theories). 
     - (ii) Language-dependent? It uses logical consequences, which depend on the language (e.g., choice of predicates). 
     - (iii) It was designed to capture historical progress, but the triviality result undermines it. 
     -> D tier (fails by the Tichý-Miller result).

  2. Likeness approach (2):
     - (i) Escapes Tichý-Miller because it uses a metric over states, not just content inclusion.
     - (ii) Language-dependence problem: The choice of the state space and the distance metric may depend on the language (e.g., how we describe states). However, if the language is fixed and the metric is natural, it might be invariant under some transformations. But it's often criticized for language-dependence.
     - (iii) It can be applied to historical cases by defining appropriate distance measures. However, for complex theories, defining the state space and the distance is non-trivial. It can capture the intuition that Newton is closer than Aristotle to relativity.
     -> B or A? Let's see others.

  3. Niiniluoto's min-sum (3):
     - (i) Escapes Tichý-Miller by combining two factors: min (how close the closest model is) and sum (the average over models). 
     - (ii) Language-dependence: Similar to the likeness approach, because it relies on a distance measure between states. The problem of language dependence remains.
     - (iii) It is designed to capture both the idea of being close (min) and having a lot of truth (sum). It can handle historical cases, but again, the formalization in a real case is complex.
     -> Similar to 2, but perhaps more refined? Maybe A or B.

  4. Schurz-Weingartner (4):
     - (i) Attempts to fix Popper by restricting to relevant consequences. They claim to avoid the Tichý-Miller result by not considering all consequences but only the relevant ones (e.g., avoiding tautologies and irrelevant conjunctions).
     - (ii) Language-dependence: The notion of "relevant" consequence is language-dependent? The consequence relation is syntactic and depends on the language. Moreover, the definition of relevance might be controversial.
     - (iii) It might be able to capture some historical cases, but the restriction to relevant consequences may not fully solve the problem. Some critics argue that the problem reemerges in a different form.
     -> C tier? Because it's a repair on Popper but still faces issues.

  5. Quantitative extension (5):
     - (i) Extends the idea to quantitative theories (common in science). It uses measures of approximation (e.g., mean squared error). This escapes Tichý-Miller because it doesn't rely on logical consequences but on numerical closeness.
     - (ii) Language-invariance: For quantitative predictions, the language is often fixed (e.g., real numbers). But note: the choice of variables and scales might matter. However, if we use a natural metric (like Euclidean distance in a parameter space) and the variables are empirically grounded, it might be relatively invariant under reparametrizations that preserve the empirical content.
     - (iii) This is very close to how scientists actually judge theories (e.g., in terms of error in predictions). Historical cases like the shift from Newton to Einstein can be seen in terms of better approximation in certain domains. It matches the working physicist's intuition.
     -> Strong candidate for S or A.

  6. Laudan's skepticism (6):
     - (i) It does not escape Tichý-Miller because it abandons the project. 
     - (ii) Not applicable because it rejects the notion. 
     - (iii) It points to historical cases to argue that there is no convergence, but it doesn't provide a formal notion. 
     -> D tier because it gives up.

  Now, comparing:

  - The quantitative extension (5) seems very promising because it directly addresses the way theories are compared in the quantitative sciences (which is a large part of modern science). It avoids the logical triviality by shifting to a numerical framework. Moreover, it is less language-dependent in the sense that the numerical predictions are tied to observable quantities. It also matches historical judgments (e.g., Newton is a good approximation for low velocities). 

  - The likeness approach (2) and Niiniluoto (3) are also strong, but they face the language-dependence issue. However, they are more general and can handle qualitative theories. But in practice, for complex theories, the state space is huge and the distance metric is arbitrary.

  - Schurz-Weingartner (4) is a repair of Popper but still faces challenges. It might be too syntactic and language-dependent.

  - Popper (1) and Laudan (6) are non-starters.

  So, I propose:

  S: [5] (quantitative extension) because it is rigorous (using standard metrics), relatively language-invariant when the quantities are empirically defined, and it directly licenses the judgments scientists make (e.g., in terms of error bars, accuracy). It escapes Tichý-Miller because it doesn't use the logical consequence approach.

  A: [2, 3] (likeness and min-sum) because they escape Tichý-Miller and can capture historical progress, but they are more language-dependent and harder to compute for real theories.

  B: [4] (Schurz-Weingartner) because it escapes Tichý-Miller in a logical framework, but the relevance criterion is tricky and language-dependent. It might not always match historical judgments.

