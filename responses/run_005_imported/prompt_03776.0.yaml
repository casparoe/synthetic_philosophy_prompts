answer: |-
  Here’s a breakdown of the core differences between epistemic contextualism (EC) and pragmatic encroachment (PE), designed to equip you to predict their verdicts in novel cases and understand their theoretical costs:

  ---

  ### **1. Mechanism & Locus of the "Action"**
  - **Epistemic Contextualism (EC)**:  
    - **Mechanism**: The word "knows" is **context-sensitive**, like indexicals (e.g., "I," "here"). Its *semantic content* shifts based on the **attributor's context**.  
    - **Locus**: The "action" (what counts as sufficient evidence/standards for "knows") depends **solely on the attributor's conversational context** (e.g., what stakes they’re discussing, what error-possibilities are salient).  
    - **Subject’s Situation**: Irrelevant to the truth conditions of the attribution. Hannah’s own stakes don’t affect whether an attributor can truthfully say "Hannah knows."  

  - **Pragmatic Encroachment (PE)**:  
    - **Mechanism**: Knowledge itself depends on **truth-relevant factors (evidence, reliability) + practical stakes**. Stakes affect whether a subject’s evidence **meets the justification threshold** for knowledge.  
    - **Locus**: The "action" happens in the **subject’s practical situation**. Whether Hannah *knows* depends on **her stakes**, not the attributor’s.  
    - **Attributor’s Context**: Irrelevant to the truth of "Hannah knows." An attributor in a high-stakes context can truthfully say "Hannah knows" if Hannah is in low stakes.  

  **Key Contrast**:  
  - EC is a **semantic thesis** about the word "knows."  
  - PE is a **metaphysical thesis** about the nature of knowledge.  

  ---

  ### **2. A Novel Case Where EC and PE Diverge**  
  **The "Detached Reporter" Case**:  
  - **Hannah (Subject)**: Checks her bank’s Saturday hours online (reliable source). She has a low-stakes need to deposit a check ($50). If she’s wrong, it’s mildly inconvenient.  
  - **Reporter (Attributor)**: Investigating banking errors. She’s in a high-stakes context: if she wrongly reports that *anyone* "knows" bank hours, her career is ruined. She says:  
    *"Hannah thinks the bank is open Saturday, but given the stakes, she doesn’t **know** it."*  

  **Verdicts**:  
  - **EC (Contextualism)**:  
    - The reporter’s context sets high standards (salient error-possibilities: website inaccuracies).  
    - Hannah’s evidence (casual website check) doesn’t meet these standards.  
    → **TRUE**: "Hannah doesn’t know."  
  - **PE (Pragmatic Encroachment)**:  
    - Knowledge depends on **Hannah’s stakes** (low). Her evidence is sufficient for knowledge *given her practical situation*.  
    - The reporter’s high stakes don’t affect whether *Hannah* knows.  
    → **FALSE**: "Hannah doesn’t know." (She *does* know).  

  **Why they diverge**:  
  - EC ties truth to the attributor’s context; PE ties it to the subject’s stakes.  
  - Here, the attributor’s stakes are high, but the subject’s are low → conflict.  

  ---

  ### **3. Strongest Objections to Each View**  
  **Objection to Contextualism: Semantic Blindness**  
  - **The Charge**: If "knows" is context-sensitive, speakers should recognize this (as they do with "tall" or "here"). But ordinary speakers:  
    - Don’t treat "knows" as context-sensitive in disagreement.  
      *Example:* If Hannah (low stakes) says "I know," and Reporter (high stakes) says "You don’t know," EC says both can be true. But speakers intuit they contradict each other.  
    - Fail to report context-shifts in retraction cases.  
      *Example:* If Hannah later faces high stakes, she won’t say, "I was wrong yesterday" (as EC predicts), but "I *did* know then, but now I’m not sure."  
  - **The Cost**: EC implies widespread **semantic incompetence**—speakers misunderstand a word they use daily.  

  **Objection to Pragmatic Encroachment: Abandoning Purism**  
  - **The Charge**: PE violates the deep intuition that knowledge depends **only on truth-relevant factors** (evidence, reliability, truth). Letting practical stakes affect knowledge:  
    - Makes knowledge "too easy" for the ignorant but lucky (low-stakes subjects with weak evidence).  
    - Allows two people with **identical evidence/abilities** to differ in knowledge *solely* due to stakes.  
      *Example:* Hannah and her twin (same evidence) face different stakes → one knows, one doesn’t. But intuitively, knowledge is a purely epistemic achievement.  
  - **The Cost**: PE **severs knowledge from truth-tracking**, collapsing the distinction between *epistemic* justification (aiming at truth) and *practical* rationality (aiming at good outcomes).  

  ---

  ### **Why This Matters for Adjudication**  
  - **Predicting Verdicts**:  
    - In **any** case, ask:  
      - *EC*: What standards are salient in the **attributor’s context**?  
      - *PE*: What are the **subject’s practical stakes**?  
    - If attributor/subject stakes diverge → EC and PE **will conflict**.  
  - **Theoretical Costs**:  
    - Can you accept that "knows" works like "here" but speakers are blind to it? → Reject EC.  
    - Can you accept that knowledge is partly pragmatic? → Reject PE.  

  This framework lets you move beyond textbook cases and grapple with the theories’ independent commitments. The core tension is whether the "shifting standards" in DeRose’s cases reflect a fact about *language* (EC) or *knowledge itself* (PE).
