  First, reconstructing Kant's architecture: His moral exclusivity rests on three interconnected pillars - the Categorical Imperative requiring universalizable maxims, autonomy as the capacity for self-legislation, and humanity as an end-in-itself defined by rationality. Animals fail the autonomy criterion, so duties toward them are really about preserving human moral character (e.g., not becoming desensitized to suffering).

