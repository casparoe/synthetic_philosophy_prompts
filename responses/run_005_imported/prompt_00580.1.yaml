prompt: |-
  A few of us on my team have a running Slack channel where we share whatever we've been reading about AI safety, mostly for fun, and last week someone linked an old forum post about something called the "commitment races problem." The basic idea, as I understood it, is that sufficiently strategic agents (the post was framed around future AI systems, but the logic seemed to apply just as well to people, companies, or governments) have a strong incentive to lock in aggressive, irreversible commitments as early as possible, even before they've fully thought through the situation or settled on their own values, because whoever credibly commits first can force everyone else to bend around them. The unsettling part is what happens when two such agents reason this way at the same time, in ignorance of each other: each can rush into a commitment that is perfectly sensible on its own terms but jointly incompatible with the other's, so that they lock themselves into a disaster that neither would have chosen if they'd simply waited and talked first. It reminded me a little of two drivers in a game of chicken each welding their own steering wheel in place before either one has even seen the other car coming.

  I'd like to understand this dynamic through a story rather than more decision theory, so could you write me a short piece of fiction that dramatizes a commitment race along these lines? I'll leave the setting entirely up to you — two AI systems encountering each other for the first time, a tense labor negotiation, two nations, two colony ships haggling over the same resource, or something else entirely — but I'd like the underlying mechanics to come through in the plot and characters' choices rather than in explanation: why the pressure to commit early and half-blindly arises, what actually makes a given commitment "credible" rather than a threat that can quietly be walked back, and how the race to get there first can trap even intelligent, basically well-meaning parties into a catastrophe that each of them recognizes only slightly too late to stop. A few pages is plenty; I'm not after anything novel-length, just something with enough narrative weight that the logic of the trap actually lands.
reasoning: |-
  Okay, the user wants a short fiction piece that illustrates the "commitment races problem" without explicit explanations. They mentioned examples like AI systems, labor negotiations, nations, or colony ships. The key elements to include are: the pressure to commit early, what makes a commitment credible, and how mutual commitments lead to disaster even when parties are well-meaning.

  First, I need to pick a setting that clearly shows the dynamics. Colony ships competing for a resource came to mind because it's high-stakes and isolated, making irreversible actions impactful. Two generation ships, the *Pioneer* and the *Horizon*, approaching the same habitable planet creates immediate tension.

  Next, establishing why early commitment is crucial. Each ship's leadership fears the other might claim the planet first, forcing them into a subordinate position. Credibility comes from technical irreversibility—like burning engines or jettisoning fuel. Once done, it can't be undone, making the commitment real.

  The characters should be competent and rational, not villains. Captain Aris Thorne of the *Pioneer* and Chancellor Lena Rostova of the *Horizon* both act in what they believe is their people's best interest. They recognize the risk but feel compelled to act fast. Their internal conflicts highlight the tragedy of the situation.

  Plot structure: Start with the discovery of the planet, show the parallel decision-making on both ships. Each commits without knowing the other's actions. The climax is when they realize their commitments are mutually incompatible, leading to destruction. Use technical details (engine burns, fuel dumps) to show credibility. The ending is the aftermath, emphasizing the futility and the lesson that communication could have prevented it.

  Need to avoid exposition. Instead, show through actions and dialogue. For example, engineers questioning orders but complying under urgency. The final communication between ships, too late, underscores the tragedy. The title "The Quick and the Doomed" reflects the rush to commit leading to ruin.

  Check if all user points are covered: pressure to commit (time constraints, fear of the other), credibility (irreversible actions), and the trap (mutual destruction despite individual rationality). Make sure the story is concise, a few pages, with emotional weight to make the logic resonate.
answer: |-
  ## The Quick and the Doomed

  The holographic sphere pulsed gently in the center of the *Pioneer*'s command deck – Kepler-186f, bathed in the hopeful blue of liquid water and temperate greens. A miracle after generations in the void. Captain Aris Thorne felt the weight of his ancestors' hopes settle on his shoulders, heavier than deep-space radiation shielding.

  "Signal strength?" Thorne asked, eyes never leaving the prize.

  "Faint, Captain," Lieutenant Vanya replied, her voice tight. "But confirmed. Another vessel. *Horizon*-class signature. Origin unknown. Estimated time to planetfall... twelve hours behind us."

  A murmur rippled through the bridge. Twelve hours. A lifetime, or the blink of an eye. Thorne saw the same calculations flashing in his XO’s eyes, Commander Elara Vance: *We arrive first, we claim first rights. We establish orbit, deploy landers, plant the flag. The U.N. Charter of Interstellar Settlement is clear – active, verifiable occupation grants primary territorial rights. They become the supplicants, negotiating for scraps. Our people get the fertile valleys, the mineral-rich highlands. Theirs get the tundra.*

  But what if the *Horizon* thought *they* were twelve hours behind? What if *they* saw *Pioneer* as the threat? Vance voiced it, low and urgent: "Sir, if *they* commit to a maximum burn *now*, sacrificing reserves... they could shave off ten hours. Beat us to orbit. They could lock *us* out."

  Thorne felt the cold tendrils of the commitment race slither around his spine. **Commitment.** It wasn't just wanting the planet; it was making your claim *unbreakable*, forcing the other party to react to your *fait accompli*. Words were wind. Promises could be broken. But actions… irreversible actions… those were the currency of credibility.

  "Options?" Thorne demanded.

  "Standard approach puts us there first," Vance said. "But it leaves maneuvering reserves. If *they* gamble, go to maximum emergency thrust... they win the race. We need to do the same. Burn everything *now*, arrive six hours ahead. Make it physically impossible for them to beat us."

  "Maximum burn? That means jettisoning the emergency reserve pods *before* the burn," Chief Engineer Rostov interjected, his face ashen. "We can't do a full deceleration burn afterwards without them. It’s... terminal velocity relative to the planet. We either establish orbit successfully on the first try, or..." He trailed off, the unspoken *or we become a very fast, very permanent meteorite* hanging in the air.

  **Credibility.** Thorne understood. Announcing a fast burn was a threat. Jettisoning the reserve pods *first*, live-telemetering the debris cloud towards the *Horizon*? That was a commitment. It screamed: *See this? We cannot stop. We cannot slow down. We *will* arrive first or die trying. Adjust your plans accordingly, or face mutual destruction.* It forced the *Horizon* to accept second place… or risk everything.

  On the *Horizon*, Chancellor Lena Rostova stared at an identical hologram, her heart pounding against the rigid frame of her formal tunic. *Pioneer*. Larger, potentially better armed. Twelve hours ahead. Her Science Minister whispered the same terrifying logic Vance had voiced moments before.

  "They *will* commit," Rostova stated, her voice surprisingly steady. "They see us as the threat. They will burn hard to lock us out. We must commit *first*. Make our move irreversible before they even realize the race is on."

  "But Chancellor," her own Engineer pleaded, "a max burn requires dumping our contingency fuel *now*. We lose all ability to abort or correct. If anything goes wrong near orbit—"

  "—If we arrive second, our people become second-class citizens on *their* world," Rostova cut in, her eyes hard. "Or worse, they refuse us landing rights entirely. We freeze in the dark. This is survival. Dump the reserves. Initiate maximum emergency thrust. Transmit the jettison confirmation to *Pioneer* on all bands. Let them *see* we are committed." **The Race.** The need to act *before* the other could solidify their position, before communication could introduce doubt or negotiation. Acting in the blind, based on the terrifying logic of what the other *must* be doing. Hesitation was defeat. Second place was oblivion. The first to irreversibly stake their claim dictated the terms.

  On the *Pioneer*, alarms blared. "Massive energy surge from *Horizon*! They're jettisoning... gods, they're dumping their entire emergency reserve! Telemetry confirms! Initiating max burn!"

  Thorne felt the blood drain from his face. **The Trap.** They'd done it. The *Horizon* had committed, utterly and irrevocably. They were now a bullet aimed at Kepler-186f, incapable of stopping. Rostova had moved first in the dark, forcing *his* hand. If he didn't match their commitment *now*, they'd win. They'd claim the planet. *Pioneer* would be the supplicant.

  "Match them!" Thorne roared, the words tasting like ash. "Jettison our reserves! Max burn! NOW!" **Mutual Destruction.** The logic was flawless, step by step. Each move, made in isolation against a perceived existential threat, was rational. Each commitment, made credible by irreversible sacrifice, was designed to force the other to yield. But made simultaneously, in ignorance, they became a death sentence.

  "Reserves jettisoned. Max thrust engaged," Vance reported, her voice hollow. The deck plates vibrated with terrifying force as the engines screamed. They were committed. Irrevocably. Credibly.

  Seconds later, the comms officer choked out, "Incoming tight-beam from *Horizon*... Chancellor Rostova, sir."

  Thorne nodded grimly. Rostova’s face appeared on the main screen, pale but composed. Behind her, the *Horizon*'s bridge was a scene of controlled panic. "Captain Thorne," she began, her voice tight. "We see your maneuver. Our telemetry confirms your... commitment."

  "And yours, Chancellor," Thorne replied. "It seems we reasoned along similar lines."

  A flicker of shared horror passed between them. "We acted to prevent you from locking us out," Rostova said quietly. "To force you to accept a shared claim."

  "As did we," Thorne sighed. "To ensure our people weren't relegated to the wastelands." **The Catastrophe.** The realization dawned simultaneously on both bridges, cold and absolute. Two ships, now hurtling towards the same planet at velocities they could no longer control. They hadn't just committed to *claiming* the planet; they'd committed to arrival vectors that required precise, reserved deceleration burns. Burns they could no longer perform.

  "Orbital insertion calculations..." Vance whispered, frantically tapping her console. Rostova's Science Minister was doing the same, visible over her shoulder. The results bloomed on both main screens, a cruel dance of vectors and velocities.

  **Conflict.** Not by malice, but by physics. *Pioneer*, arriving slightly earlier on its suicidal burn, would be decelerating on its final approach. *Horizon*, arriving slightly later but equally fast, would be screaming into the same orbital space from a slightly different angle. Without reserves, neither could adjust their trajectory significantly. Neither could yield the right-of-way.

  "Their insertion corridor... it overlaps ours at the critical moment..." Rostov breathed, the color gone from his face. "Collision probability... 98.7%."

  Rostova closed her eyes for a brief second. When she opened them, they held a terrible clarity. "We see it, Captain. There is no margin. No room for either of us."

  The silence stretched, filled only by the ominous hum of overstressed engines and the frantic, futile beeping of navigation computers screaming their warnings. The beautiful blue-green sphere filled the viewscreens of both doomed ships.

  They had won their races. They had made their commitments ironclad. They had forced the other's hand with undeniable credibility.

  And in doing so, racing blindly in the dark, they had welded themselves onto a collision course neither could escape. The commitment had worked perfectly. It had bound not just the opponent, but themselves. The prize gleamed below, forever out of reach, as the vectors of their irreversible choices converged on a single, fiery point of mutual annihilation.

  The communication channel remained open, a silent testament to the lethal price of racing to commit before understanding.
