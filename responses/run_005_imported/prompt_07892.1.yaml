prompt: |-
  My aunt died two weeks ago, and I'm giving her eulogy at the funeral this Saturday. I want to get it right, and it's turning out to be harder than I expected. She wasn't an academic — she worked thirty-one years as a courtroom stenographer — but after a heart attack in her early sixties she started sitting with a small Buddhist meditation group, and somewhere in there she fell hard for a second-century Indian philosopher named Nāgārjuna. What got her wasn't the meditation so much as his logic: the "tetralemma," the idea that of any four positions you could take on a serious question — that something is the case, that it isn't, that it's both, that it's neither — none of the four actually survives once you look closely at what it would take for it to be true. She used this on everything, but especially, in the last few years, on herself. She would not let anyone say she'd be reborn, or that she'd be watching over us — that was the first corner. She would not let anyone say she'd simply be gone and that's that — the second. She'd cut off "well, maybe both, in some sense" just as fast — the third. And she was the strictest person I've ever known about the fourth: she always said that "neither is true, the question doesn't even apply" is a real position, hard to earn, and not just a polite way of shrugging and saying nobody can know. Two years ago, at my grandmother's funeral, she actually stood up mid-sermon and did this to the priest, gently, over some line about a better place — it's a story the family still tells on her.

  I'm not a philosopher, and neither is almost anyone else who'll be in that room — but four or five people from her meditation group will be, and they will know if I fake it. I've spent the last few nights with her copy of the Mulamadhyamakakarika (I have no idea if I'm even saying that right), which she annotated so heavily you can barely find the original text under her handwriting, trying to actually understand this instead of just repeating phrases I half-remember from Sunday dinners. Here is my problem, and I'd like you to solve it by writing the eulogy itself, about five minutes long as delivered: I can't have her survive her death, I can't have her simply end, I can't hedge with "both," and I can't take refuge in "neither" if all that means is "who's to say" — she would have called that a fifth corner, cheating dressed up as humility, since even "it's all empty, so none of this matters" was a comfort she refused herself. What I need from you is something that still sounds like a eulogy and not a logic seminar — something that will let a room full of people who loved her, and who are not going to follow an argument, actually grieve by the end of it.
reasoning: |-
  Okay, the user is preparing a eulogy for their aunt who was deeply influenced by Nāgārjuna's philosophy, particularly the tetralemma. The aunt rejected all four standard positions about death: existence after death, non-existence, both, or neither. The challenge is to honor her philosophical stance while making the eulogy accessible and emotionally resonant for a diverse audience.

  First, I need to ensure the eulogy avoids those four positions. The user mentioned that even "neither" can't be used as a cop-out. The aunt saw that as a fifth corner—cheating disguised as humility. So the eulogy must navigate around these without falling into any of them. 

  The audience includes family and friends who aren't philosophers, plus a few from her meditation group who'll notice if the philosophy is misrepresented. The key is to translate complex ideas into simple, heartfelt language. Metaphors might help—like comparing her approach to life to a river or a well-loved object, showing impermanence without negation.

  The aunt's practicality as a stenographer and her later philosophical passion should both be highlighted. Balancing her professional life with her spiritual journey shows her multidimensional character. Stories that illustrate her applying the tetralemma in daily life, like correcting the priest, can make the philosophy relatable.

  Emotionally, the eulogy needs to allow space for grief. Since the aunt rejected conventional comforts, the focus should be on the impact she had—how she lived, the love she gave, the memories she left. The emptiness concept (śūnyatā) isn't nihilism; it's about interdependence. Highlighting how her presence lives on in others' lives could honor that without claiming an afterlife.

  Also, the user spent nights reading her annotated Mulamadhyamakakarika. Mentioning her dedication shows respect for her passion. Emphasizing her integrity in facing death her way, refusing easy answers, can inspire attendees to appreciate her courage.

  Need to check that the structure flows: introduction, her life/work, philosophical journey, application to death, legacy. Conclude with a call to cherish memories without resolving the existential questions. The tone should be warm, respectful, and inclusive, using plain language. Avoid jargon; explain terms briefly if needed. Ensure the meditation group feels acknowledged but not alienating to others. Finally, make sure the ending offers comfort through shared love and remembrance, aligning with her values.
answer: |-
  Here is a eulogy that honors your aunt's spirit and philosophy without violating her strict avoidance of the four corners, while remaining accessible and emotionally resonant for a grieving audience:

  ---

  **For [Aunt's Name]**

  Good morning. It means more than I can say to be able to speak about my aunt, [Aunt's Name], surrounded by so many people who loved her. Thank you for being here.

  [Aunt's Name] lived a life grounded in clear sight and deep care. For thirty-one years, she brought that clarity to the courtroom as a stenographer. She knew the profound importance of capturing things *exactly* as they happened, of bearing witness to the truth of the moment, word for word. It wasn't just a job; it was a reflection of who she was: precise, attentive, committed to reality as it unfolded.

  And then, life, as it does, unfolded in unexpected ways. After her heart attack, she found a new kind of clarity sitting with her Buddhist meditation group. But what truly captured her imagination, what she *raved* about at Sunday dinners until we all knew the name, wasn't just the quiet moments of meditation, but a fierce, ancient logic from a philosopher named Nāgārjuna. She’d get this sparkle in her eye – you all know the one – and she’d start talking about looking at things from every possible angle, really *looking*, until you saw how none of the easy answers held up.

  This wasn't just academic for her. She applied it to everything, especially in these last years, and especially to the big questions. She had this remarkable, sometimes challenging, integrity. She wouldn't let us say she'd be watching over us from some heavenly balcony. She wouldn't let us say she’d just be gone, like a light switched off. She wouldn't accept a fuzzy "well, maybe a bit of both." And she was absolutely strict about not letting "neither" become just a way to shrug and say "who knows?" She called that last one "cheating dressed up as humility." She believed the truth was harder, clearer, and more demanding than any of those four corners.

  Remember that time at Grandma’s funeral? When the priest mentioned a "better place," and [Aunt's Name] just… gently, respectfully, but *firmly*, stood up? She couldn't let that corner stand unchallenged, even then. It’s a story we tell, not just because it was surprising, but because it was *so her*. It was her courage, her refusal of easy comfort, her insistence on looking directly at things, even the hardest things, with clear eyes.

  So, how do we talk about her now? How do we honor *this* woman, with *this* fierce commitment to truth, in this moment of loss?

  She showed us the way. She showed us that the deepest respect isn't found in the corners we try to paint ourselves into for comfort. It’s found in the looking itself. In the clear-eyed attention she brought to every moment.

  *   Instead of saying she survives, we can look at the undeniable reality of her life: **the thirty-one years of meticulous record-keeping**, the quiet strength she showed recovering from her heart attack, the passion she found in her later years studying ideas that challenged her and brought her joy.
  *   Instead of saying she simply ends, we can look at what persists: **the indelible mark she left on each of us** – her wit, her stubbornness, her unexpected insights over coffee, that sparkle when she talked philosophy, the sheer force of her presence that shaped family gatherings and quiet conversations alike.
  *   Instead of hedging with "both," we can look at the wholeness of her life: **the stenographer who found profound meaning in ancient logic**, the practical woman captivated by abstraction, the fiercely independent spirit who found community in her meditation group.
  *   And instead of hiding behind a vague "neither," we can do what she demanded: **look directly at the profound mystery** without pretending to solve it with words she rejected. We can acknowledge the deep ache of her absence *precisely because* her presence was so vivid, so real, so *here*.

  [Aunt's Name] taught us that reality isn’t found in the fixed answers we cling to, but in the dynamic, ever-changing web of life she participated in so fully. Her life wasn't a position to be argued; it was an experience to be witnessed, deeply felt, and remembered.

  So today, let’s honor her not by trying to place her somewhere she refused to go, but by doing what she did best: **Paying attention.** Paying attention to the weight of this loss. Paying attention to the memories that flood in – her laugh, her handwriting filling the margins of her books, her challenging questions, her unwavering love. Paying attention to the space she occupied in this world, and the unique shape of the emptiness she leaves behind.

  The logic she loved pointed beyond concepts. It pointed to the vivid, impermanent, interconnected reality of being alive. That’s where she lived – fully, attentively, courageously. And that’s where she remains for us: **not in an answer, but in the love she gave, the lessons she taught by example, and the indelible memories we carry forward.**

  She asked us to look clearly. So let us look clearly now at our grief, and see within it the undeniable testament to a life truly lived. Let us feel the love that connects us still, across any mystery. That love, that impact, that enduring presence in our hearts and minds – that is real. That is her legacy.

  We will miss her sharp mind, her unexpected depth, her unwavering honesty, and her love, more than words can say. Thank you, [Aunt's Name], for teaching us to look so clearly. We are looking now. And we see you.

  ---

  **Why this works:**

  1.  **Honors Her Philosophy:** It explicitly names Nāgārjuna and the tetralemma avoidance ("four corners"). It explains her rejection of the standard positions without endorsing any of them. It frames her stance as "clear-eyed attention," "looking directly," "integrity," and "refusal of easy comfort," which aligns with the spirit of śūnyatā (emptiness) as dynamic interdependence, not nihilism.
  2.  **Avoids the Corners:**
      *   **Not Surviving:** Focuses on the *reality of her past life* and its *impact*.
      *   **Not Simply Ending:** Focuses on what *persists* (memories, lessons, love, impact, the "indelible mark").
      *   **Not Both:** Focuses on the *wholeness and complexity* of her lived experience ("the stenographer who found profound meaning...").
      *   **Not Neither (as evasion):** Focuses on *directly confronting the mystery and the grief* ("look directly at the profound mystery," "acknowledge the deep ache"), framing "neither" as active attention, not passive ignorance. It explicitly calls out the rejected version of "neither" as "cheating."
  3.  **Provides Emotional Grounding:** It channels the philosophy into actionable remembrance: "Paying attention" to grief, memories, love, and impact. It validates the pain of loss ("deep ache," "weight of this loss," "we will miss her") as a testament to her life. The metaphors ("indelible mark," "space she occupied," "shape of the emptiness," "web of life") are concrete and emotionally resonant.
  4.  **Celebrates Her Life:** It weaves in her career, her health challenge, her passion, her personality (wit, stubbornness, sparkle), and the famous family story. It paints a vivid picture of *who she was*.
  5.  **Accessible:** It uses plain language. The philosophical concepts are introduced simply and then immediately connected to her character and how we can *feel* and *remember* her. The focus shifts quickly from abstract logic to concrete emotion and shared experience.
  6.  **Structure:** It follows a natural eulogy flow: Introduction -> Her Life & Work -> Her Philosophical Passion -> Her Stance on Death -> How to Honor That Stance Today (the core, avoiding corners) -> Focusing on Love, Memory, and Impact -> Conclusion.
  7.  **Tone:** Respectful, warm, honest, slightly challenging (in a way that honors her), and ultimately comforting through shared love and remembrance, not false promises.

  This eulogy allows the room to grieve by focusing intensely on the tangible reality of her life, the undeniable reality of the loss, and the enduring reality of love and memory – all things your aunt valued and that exist outside the tetralemma's corners. It asks people to *feel* and *remember*, which is the heart of grieving. Good luck on Saturday. She would appreciate the care you're taking.
