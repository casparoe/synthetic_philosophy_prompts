      "criterion3": "Accurately explains FTL signaling impossibility and distinguishes correlations from signals. Minor deduction for anthropomorphic phrasing ('behaves as if it knows').",
      "criterion4": "Correctly states Bell rules out local determinism. Major error: falsely claims Bell proves outcomes are undetermined 'by anything, local or not' (ignores non-local/global determinism)."
