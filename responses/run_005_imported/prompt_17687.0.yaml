  Here’s the scene, diving deep into the weeds while keeping the tension and history alive:

  ---

  **INT. WEDDING RECEPTION - NIGHT**

  The air hums with chatter, clinking glasses, and a terrible cover band. DANNY (50s, Jesuit collar under his suit jacket, eyes warm but weary) nurses a whiskey. MARCUS (50s, sharp suit, intensity barely contained) slams a beer down beside him.

  **MARCUS**  
  Danny. Still saving souls with divine cheat codes?

  **DANNY**  
  (Smiling faintly)  
  Marcus. Still certain God scripted this reunion? Including the open bar?

  **MARCUS**  
  (Grunts, taps his beer bottle)  
  Saw you across the room. Knew we’d end up here. Like iron filings to the magnet of unresolved grad school disputes. Molinism, Danny? Seriously? After all this time?

  **DANNY**  
  It answers the questions your framework chokes on, Marcus. Divine sovereignty *and* genuine creaturely freedom aren’t oil and water. Middle knowledge is the emulsifier.

  **MARCUS**  
  (Leans in, voice low but sharp)  
  Emulsifier? It’s smoke and mirrors. Let’s cut to the chase: your precious *Counterfactuals of Creaturely Freedom*. Before the foundation of the world, before God decrees *anything* – tell me, Danny, what *grounds* the truth of "If *Marcus* were placed in circumstance C, he would *freely* choose X"?

  **DANNY**  
  God’s knowledge. His perfect comprehension of all possibilities. He knows *what* every possible creature *would* freely do in any possible situation. It’s not arbitrary. It’s a function of His omniscience applied to potentialities.

  **MARCUS**  
  (Scoffs, crushes a napkin)  
  Potentialities of *what*? That’s the grounding objection, Danny, and you know it! There *is* no "Marcus" yet! No essence, no will, no *creature* to possess this hypothetical freedom! You’re positing truths about non-existent entities! "If *Squidward* were placed in C, he’d freely choose X!" It’s meaningless! Truth needs a truth-*maker*. What makes it true *then*, before creation, that *this specific, non-existent person* would do X in C? Divine wishful thinking?

  **DANNY**  
  (His jaw tightens slightly)  
  It’s not about a specific *concrete* Marcus yet. It’s about God knowing the *kind* of free choices that *would* emerge from the instantiation of *this* particular creaturely essence in *that* particular circumstance. The truth is grounded in the *possible essence itself*, fully known by God. He knows *all* possibilities exhaustively.

  **MARCUS**  
  (Leans closer, finger jabbing the air)  
  But that’s just pushing the mystery back! Okay, fine, God knows "Essence E in C would freely produce choice X." But *why*? What *in* Essence E *makes* that true? If it’s inherent to E, then the choice is *necessitated* by E's nature – goodbye libertarian freedom! If it’s *not* inherent, if it’s truly contingent and free, then what *makes* "E in C would choose X" true *before* God actualizes E? You’ve got a truth floating in a void, unattached to anything real! Molina just replaces determinism by circumstances with determinism by abstract essence!

  **DANNY**  
  (Takes a deliberate sip of whiskey)  
  It’s not determinism. The essence *includes* the capacity for truly free, indeterminate choice *within* those circumstances. God knows *how* that capacity *would* be exercised. Knowing *what* Peter *would* freely do doesn’t *cause* Peter to do it. It simply reflects the reality of Peter's potential free will. God then freely chooses *which* set of free choices He wishes to collaborate with by actualizing *that* world.

  **MARCUS**  
  (A harsh laugh)  
  Collaborate? It’s divine selection! And *that’s* where the determinism you deny sneaks back in! God knows *exactly* what every single possible Marcus and Danny would freely do in every single nanosecond of every possible timeline. He then *picks* one timeline – one complete script! – to make real. Based entirely on that exhaustive foreknowledge of *all* free choices within it. My entire existence, every thought, every "free" choice I make here tonight – even arguing with you! – was *known* by God with absolute certainty *before* He decided to spin up Universe 42A. He saw it all, fixed and certain in His middle knowledge, and *chose* it. How is that timeline *not* fixed? How am I *not* just acting out a role God selected precisely *because* He knew I'd play it this way? Your "freedom" is an actor improvising perfectly within a script God authored by choosing *this* world.

  **DANNY**  
  (The warmth is gone, replaced by focused intensity)  
  Because the script isn’t authored! God doesn’t decree *what* you freely choose, Marcus! He *finds* it. He discovers, via middle knowledge, what you *would* freely choose. He then decides whether to place *you* in *those* circumstances. The freedom is real *in* the moment. You could, in that instant, under those exact circumstances, with your entire nature, *choose differently*. God knows what you *would* do, not what you *must* do. His choice of world respects your hypothetical free actions; it doesn’t cause them.

  **MARCUS**  
  (Shakes his head, almost sadly)  
  But Danny... if God truly knows *what I would freely do* in C, with absolute certainty, then *it cannot be otherwise* in C. The truth of that counterfactual *necessitates* the outcome. If God knows "Marcus in C freely chooses X" is true, then Marcus in C *cannot freely choose not-X*. The knowledge itself implies the impossibility of the alternative! Your "would" collapses into "must" the moment God knows it. Molina saves the *word* "freedom" but kills the substance. You’ve just hidden the divine decree behind a veil of divine observation. Why pray, Danny? Why strive? If God already infallibly knows what I *would* do, and He’s already picked the world where I do it… what’s left but to play my part?

  **DANNY**  
  (Stares into his glass, a long beat. The band launches into an off-key "Sweet Caroline.")  
  Because the striving *is* the part. Because the prayer *is* the choice He knew you'd make in *this* circumstance. Because the freedom is real *to me*, Marcus, in the choosing, even if its contours were known. It feels like… collaboration. Not a script.  
  (He looks up, meeting Marcus's fierce gaze)  
  Your way… it feels like being swallowed whole.  

  **MARCUS**  
  (Silent for a moment. He picks up his beer, doesn't drink. His intensity has banked, replaced by a deep, weary conviction)  
  And yours feels like being known so completely you cease to be anything *but* what’s known. We’re still drawing that damned circle on the bar napkin, aren’t we? Trying to box the Unboxable.  
  (He gestures vaguely towards the dancing crowd)  
  Some things… maybe the liturgy gets closer than the syllogism. "We are not worthy... but only say the word."  

  **DANNY**  
  (A ghost of the old smile returns)  
  "Lord, I am not worthy that you should enter under my roof..."  

  **MARCUS**  
  (Grunts, a reluctant half-smile)  
  "...but only say the word, and my soul shall be healed." Yeah. That. Still can't agree on *how* the word works, though.  
  (He pushes his half-finished beer away)  
  Another whiskey? For old times' sake? And so we can fail to solve divine foreknowledge before the bouquet toss?

  **DANNY**  
  (Nods, raising his own glass slightly)  
  Deal. Just… try not to spill this one on the Arminian bride’s mother this time.  

  **MARCUS**  
  (Chuckles darkly)  
  That was an accident! Mostly.  

  (They turn towards the bar, the argument unresolved, the deep currents of theology and friendship swirling beneath the wedding lights and the terrible music.)

  ---

  **Key Elements Included:**

  1.  **Grounding Objection:** Marcus nails it early – what makes CCFs true *before* any creature exists? Danny counters with God's knowledge of *possible essences*.
  2.  **Determinism Charge:** Marcus argues God's selection of a world based on exhaustive CCFs makes the entire timeline fixed. Danny distinguishes between *knowledge* of free choices and *causing* them, emphasizing freedom *in the moment*.
  3.  **Knowledge vs. Necessity:** Marcus counters that infallible knowledge of a free choice *implies* its necessity/inevitability in that specific context, undermining libertarian freedom. Danny insists the "would" reflects the true potential of the free will inherent in the essence.
  4.  **Real Points Landed:** Marcus scores on grounding and the potential collapse of "would" into "must." Danny scores on the distinction between knowledge and causation, and the phenomenological reality of freedom.
  5.  **No Cheap Shots/Knowing the Lit:** They use terms correctly (CCFs, grounding, middle knowledge, libertarian freedom, divine decree). They reference Molina and the core arguments without exposition dumps.
  6.  **Character & History:** The bar setting, the wedding context, the shared history (spilled drinks, chalkboard arguments), the distinct voices (Danny's Jesuit calm vs. Marcus's Reformed intensity), and the underlying friendship despite the deep rift are all present.
  7.  **Unresolved:** The argument ends where it began – a fundamental impasse – but the shared history and the context (the wedding, the liturgy quote) allow them to step back momentarily. The tension remains.
