  First, I need to unpack the theological nuances here. The grounding objection questions how counterfactuals of creaturely freedom (CCFs) can be true before creation - since there are no actual creatures to "ground" those truths. Marcus would hammer this point. Meanwhile Danny has to defend how God's middle knowledge isn't deterministic if He chooses which world to actualize based on pre-seen free choices. 

  The challenge is making this feel like a natural bar argument between old friends, not a seminary debate. They need history - shared grad school memories (chalkboards! cheap beer!), visible tension (Marcus crushing a napkin, Danny swirling whiskey). The wedding setting matters too - should feel like a real interruption to celebration.

  Key beats to hit:
  1. Start with character voices: Danny's Jesuit calm vs Marcus's Reformed intensity
  2. Use wedding details to ground the abstraction (clinking glasses, distant laughter)
  3. Build the argument logically: 
     - Marcus opens with grounding objection (no "you" before creation) 
     - Danny counters with God's perfect knowledge of possibilities 
     - Marcus pivots to determinism accusation (God's choice locks in outcomes)
     - Danny defends libertarian freedom within chosen circumstances 
     - Marcus lands the "why pray?" gut-punch
  4. End unresolved - because these debates never end. Leave them circling back to personal history ("still drawing that damned circle") to show how entrenched this is.

  Biggest risk is jargon overload. Need terms like "CCFs" and "libertarian freedom" to feel organic. Solution: let Marcus mock the terminology ("counter-whatsits?") early on to acknowledge the density, then trust the reader to catch up from context.

  Also vital: no cheap wins. When Danny says "God knows possibilities perfectly," Marcus must come back with "But possibilities of what?" - forcing Danny into the grounding problem. And when Marcus claims determinism, Danny gets the Molinist distinction between knowledge and causation. 

  The whiskey-stained napkin diagram is crucial - visual shorthand for 20 years of unresolved argument. And ending on the liturgy line ("reconciled to God and each other") twists the knife - these men understand grace intellectually but can't extend it to each other's theology. 

  Final touch: the bride's laugh pulling them back to the wedding. A reminder that some joys transcend doctrinal battles, even if they can't admit it yet.
