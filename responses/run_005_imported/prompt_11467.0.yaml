  Explanatory priority is crucial. The substantivalist might say points explain why certain relations hold, like in a vacuum solution. The relationalist would ask for a scenario where points explain something relations can't. The substantivalist could mention the necessity of a manifold for defining derivatives, but the relationalist might argue that operational definitions suffice.

  Surplus structure: the relationalist sees points as redundant. The substantivalist could argue that the manifold is necessary for the theory's formulation, even if it's surplus. The dialogue should highlight whether this structure is merely mathematical or ontologically significant.

