  Then there's the aspect of personal sovereignty. For Jefferson, individuals have the right to govern themselves, which includes planning for future incapacity. The Ulysses contract is a tool for self-governance, aligning with Enlightenment ideals of autonomy. Whereas binding future generations violates their autonomy since they can't consent.

