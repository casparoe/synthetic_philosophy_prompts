  Absolutely - that loophole is prime comedic territory. Here's a short joke playing *specifically* on Augustine's "joke exemption" within his otherwise absolute ban on lying:

  > **A nervous monk approached Augustine, clutching a stolen honeycomb.**  
  > *"Father, I told the beekeeper I didn't take it... but only as a jest! You know, like in De Mendacio? Where humor isn't *really* deception?"*  
  > **Augustine sighed:** *"Brother, the sin wasn't the lie. It was telling a joke so painfully unfunny that everyone instantly knew it was true."*

  **Why it works with Augustine's position:**  
  1. **The Loophole Exploit:** The monk tries to use Augustine's own "joke = not a lie" technicality to avoid sin for an actual deception (stealing & denying).  
  2. **Augustine's Strictness:** The punchline doesn't absolve the monk. Augustine dismisses the *excuse*, not the theft, implying the monk *did* intend deception (sin) but failed comically.  
  3. **The Irony:** Augustine, who ranks even "lies to save a life" as sinful, is ironically judging the monk's *comic timing* as the flaw that revealed his sin, highlighting the absurd tightrope of his loophole.  
  4. **Historical Nod:** Augustine famously wrote about stealing pears (or similar fruit) as a youth, making the "stolen honeycomb" a subtle wink to his own past.

  It’s not just about lying; it’s about weaponizing his *own* philosophical exception in a way that backfires, forcing him to critique the *execution* of the deception rather than granting moral pardon. The humor hinges entirely on knowing how bizarrely specific his "joke exemption" is within his otherwise unforgiving framework.
