  Turing's commitment to data is strong. He couldn't ignore the numbers in 1950. But Bem's case shows that even rigorous-looking stats can be flawed. Turing also criticized arguments from disabilities for relying on insufficient data. He might see Bem's initial results as another instance where data seemed convincing but was actually insufficient or flawed.

  Would Turing feel vindicated in his unease? Probably not. The replication crisis exposed methodological errors, not new evidence for ESP. His worry was about genuine phenomena interfering with the test, but Bem's work turned out to be artifacts. Turing might argue that the telepathy-proof room is still necessary if ESP exists, but Bem's failure to replicate weakens the evidence he relied on.

