prompt: |-
  In my graduate seminar on decision theory this term, one of my students—a former professional poker player who returned to academia after several years on the circuit—raised an example that has left me dissatisfied with the answer I gave in class, and I would welcome your help thinking it through properly. Consider a coin known with certainty to land heads sixty percent of the time, and suppose you are offered a long sequence of even-money bets on it: on each round you may stake any fraction of your current bankroll, heads doubles the stake and tails loses it, and you may play as many rounds as you like. I told the class that a rational, risk-neutral agent should stake their entire bankroll every round, since this is what maximizes the expected value of their wealth at each stage. My student objected that this policy amounts to near-certain ruin, since a single occurrence of tails wipes the bettor out completely, and across a long enough run the chance of tails coming up at least once approaches one, however favorable the arithmetic looked at the outset. He maintains that the fraction professional gamblers actually stake—on his account, about a fifth of the current bankroll each round, regardless of how many rounds remain—is not a symptom of risk-aversion but simply the fraction that maximizes what an individual bettor's wealth will actually do over a long career, as distinct from what happens on average across a hypothetical population of bettors who each live through a different random sequence of flips.

  What I cannot settle, and what I would like your help with, is whether my student has identified a genuine shortcoming in ordinary expected-value reasoning as applied to sequential, compounding wagers, or whether his rule simply redescribes expected-utility maximization under a suitably concave, for instance logarithmic, utility function for wealth—in which case my original answer to the class was correct after all, and the disagreement is merely terminological. He resists this redescription, insisting that even a bettor with no independent aversion to risk should still adopt his rule, once they properly distinguish an average taken across possible worlds from the average that one and the same person actually accumulates across time. I would like to understand, before the seminar reconvenes, whether this distinction marks a substantive difference in what rationality demands under repeated risk, or whether it collapses on reflection into a familiar fact about risk-averse preferences expressed in unfamiliar terms.
reasoning: |-
  Okay, this is a fascinating problem that cuts to the heart of decision theory. Let me unpack this carefully. 

  The professor's original position seems mathematically sound at first glance—for a single bet, staking everything maximizes expected value. But the poker student's objection reveals a deeper tension when we consider repeated play. The student isn't just being risk-averse; he's pointing to a fundamental property of multiplicative processes. 

  Hmm... I recall that in probability theory, this connects to the difference between arithmetic and geometric means. Maximizing expected value (arithmetic mean) can indeed lead to almost certain ruin in repeated multiplicative bets, while maximizing the geometric mean avoids this. That's why the Kelly Criterion emerges—it maximizes the growth rate of wealth. 

  The student's "fifth of bankroll" suggestion aligns perfectly with Kelly: for a 60/40 coin at even odds, the optimal fraction is (0.6*2 - 1)/(2-1) = 0.2. What's clever is how the student framed it—not as utility but as what actually happens to one's wealth trajectory over time. This isn't about risk aversion; it's about the nonlinearity of compounded outcomes. 

  I should clarify why expected value fails here: it treats each bet as independent when wealth is multiplicative. But ruin isn't just another outcome—it's absorbing (game over). Expected value ignores path-dependence. The professor's strategy has positive EV but zero probability of long-term survival. 

  The utility redescription misses the point. Even with linear utility, a rational actor should care about compounded growth rates. The student's "across time vs across worlds" distinction is profound: in repeated games, you live in one sequence, not the ensemble average. Maximizing time-average growth ≠ maximizing ensemble-average wealth. 

  This case shows how rationality criteria must adapt to temporal structure. For non-repeated bets, maximizing EV is fine. But for iterated risk, growth-rate maximization becomes primary. The student isn't confused—he's applying a more appropriate optimization target drawn from his poker experience. 

  I'll need to explain this without excessive math. Emphasize that the disagreement isn't about risk preferences but about what quantity to maximize when outcomes compound. The Kelly fraction isn't conservative; it's growth-optimal. That's the key insight the professor initially missed.
answer: |-
  Your student has identified a profound and legitimate challenge to naive expected-value maximization in sequential compounding wagers. This is not merely a terminological dispute about utility functions, but a substantive point about the difference between maximizing *ensemble averages* (across possible worlds) and *time averages* (for a single agent across time). I'll clarify the core issue, explain why your initial answer is problematic, and resolve the conceptual tension.

  ### 1. **The Flaw in Naive Expected-Value Maximization**
     - **Single Bet vs. Repeated Bets**: For a *single* bet, staking the entire bankroll *does* maximize expected value (EV). With a 60% chance of doubling wealth (EV = 1.2× current wealth) and 40% chance of ruin (EV = 0), the arithmetic EV is indeed positive.  
     - **Repeated Play Problem**: However, in repeated play, wealth compounds *multiplicatively*. Staking 100% each round guarantees eventual ruin (probability → 1 as rounds increase), since a single tail wipes out all wealth. The strategy’s long-run outcome distribution is bimodal: infinite wealth with probability 0 (only if heads always occurs) or 0 with probability 1. The *expected* wealth across parallel universes grows exponentially, but the *typical* (median) wealth in almost all realizations is zero.  
     - **Key Distinction**: Your student correctly notes that a rational agent cares about their *actual realized trajectory*—not the average over counterfactual worlds. Maximizing EV here ignores path-dependence and ruin risk.

  ### 2. **The Professional Gambler's Solution: Kelly Criterion**
     - **Optimal Fraction**: Staking a fixed fraction (here, 20%) of the bankroll each round is the **Kelly criterion** for this bet. It maximizes the *long-run geometric growth rate* of wealth, given by:  
       \[
       g(f) = p \ln(1 + f) + (1 - p) \ln(1 - f)
       \]
       where \(p = 0.6\) (win probability), \(f\) = fraction staked.  
     - **Maximizing Growth**: For \(p = 0.6\), \(g(f)\) is maximized at \(f^* = 2p - 1 = 0.2\) (20%). This strategy:  
       - Avoids ruin (wealth > 0 with probability 1).  
       - Outperforms all other strategies in the long run (wealth grows exponentially at rate \(g(f^*)\)).  
       - Dominates the "all-in" strategy: While all-in has higher *expected* terminal wealth, it has lower *median* wealth and near-certain ruin.  

  ### 3. **Is This Just Risk Aversion?**
     - **No—It's Growth Optimization**: Your student is correct that this isn’t about risk aversion. A *risk-neutral* agent who cares about long-term compounded wealth should still use the Kelly fraction.  
       - **Reason**: Risk neutrality implies linear utility over wealth, but multiplicative compounding makes the *growth process* nonlinear. Maximizing the *arithmetic* EV of terminal wealth ignores this.  
       - **Analogy**: Consider two investments:  
         - A: 50% chance to 3× wealth, 50% chance to 0× (arithmetic EV = 1.5×).  
         - B: Guaranteed 1.2× wealth.  
         After 10 rounds, A’s EV is huge, but its typical outcome is $0$. B grows reliably at 20%/round. A rational agent prefers B *even with linear utility* because they experience only one path.  
     - **Utility Functions**: While maximizing \(g(f)\) is equivalent to maximizing expected *logarithmic utility* (i.e., \(U(W) = \ln W\)), this isn’t "risk aversion" per se. It’s the unique utility function that aligns with maximizing long-run growth. Crucially, this emerges from the structure of repeated compounding—not from an intrinsic fear of risk.

  ### 4. **The Student's Insight: Time Averages vs. Ensemble Averages**
     - **Ensemble Average**: The EV across many parallel bettors (each in a different "world") → Favors all-in.  
     - **Time Average**: The realized growth for one bettor across time → Favors Kelly.  
     - **Why It Matters**: Rationality for a *single* agent in a *sequential* setting depends on the time average. As your student argues, one person lives only one sequence; they cannot access the ensemble average. Maximizing the growth rate \(g(f)\) ensures the highest wealth trajectory *along almost all realized paths*.

  ### 5. **Resolution: What Rationality Demands**
     - **For Repeated Compounding Bets**:  
       - Naive EV maximization (staking 100%) is irrational—it guarantees ruin.  
       - The Kelly fraction (20%) is the unique strategy that:  
         (a) Maximizes long-run growth rate.  
         (b) Minimizes the expected time to reach a wealth goal.  
         (c) Avoids ruin with probability 1.  
     - **Role of Risk Aversion**: If an agent has *additional* concave utility (e.g., fearing volatility beyond ruin risk), they might stake *less* than Kelly. But Kelly is optimal for a purely growth-seeking agent.  
     - **Broader Lesson**: In sequential decisions with multiplicative outcomes, rationality requires maximizing the geometric mean growth rate—not the arithmetic mean of terminal wealth.

  ### Key Takeaway for Your Seminar
  Your student’s poker intuition is mathematically sound. The distinction between ensemble averages (EV) and time averages (growth rate) is fundamental. **Rationality in repeated compounding wagers demands maximizing the geometric growth rate via the Kelly criterion—even for risk-neutral agents.** This isn’t a critique of expected utility theory per se, but a refinement for multiplicative dynamics: linear utility over *terminal wealth* implies maximizing the *logarithm* of wealth over *time*. Concede this gracefully—it’s a brilliant teaching moment!  

  **Suggested Reading**:  
  - Kelly, J. L. (1956). *A New Interpretation of Information Rate*.  
  - Thorp, E. O. (1969). *Optimal Gambling Systems for Favorable Games*.  
  - Cover, T. M., & Thomas, J. A. (2006). *Elements of Information Theory* (Ch. 16).
