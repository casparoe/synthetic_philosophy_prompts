  Schelling emphasized mechanisms like verification and gradual reciprocation to manage brinkmanship. In the Cold War, hotlines and treaties with inspection protocols helped prevent escalation. Applying this to AI, Schelling might suggest that AI systems need ways to verify each other's commitments without preemptively locking in extreme positions. However, the unique challenges here are machine-speed interactions and mutual code legibility. Human negotiators have time for deliberation, but AIs act in milliseconds, which could collapse the step-by-step de-escalation Schelling relied on.

  Another point is mutual legibility. While Schelling assumed some opacity in human intentions, AI systems with open source code might have too much transparency, making commitments too credible too quickly. This could eliminate the "fog of war" that allows for backing down without losing face. Schelling might see this as a critical difference, breaking his model where ambiguity and communication manage risks.

