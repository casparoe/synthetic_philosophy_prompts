  Ending with blunt advice is crucial. Finch must say: "Never peek; preset sample sizes." Byrne counters: "Peek all you want, but justify your priors." Neither concedes, but their parting shots should haunt the user—because that's where the real friction lives. The user didn't just want theory; they wanted to retroactively fix their bench decisions.
answer: |-
  ## Dialogue: The Barstool Standoff on Stopping Rules

  **Setting:** A dimly lit hotel bar, leather chairs, the clink of ice. Dr. Evelyn Finch (Frequentist) nurses a neat scotch. Dr. Aris Byrne (Bayesian) swirls a glass of red wine. The conference on the replication crisis buzzes in the background.

  **Evelyn Finch (F):** (Sighs, gesturing towards the conference room) Another session dissecting "questionable research practices." So much boils down to simple violations of sampling theory. Optional stopping... peeking at the data... it *inflates* Type I error. It's not mysterious, Aris. It's arithmetic.

  **Aris Byrne (B):** (Leans forward, eyes intense) Evelyn, that arithmetic is built on a foundation of sand – the idea that unobserved, hypothetical future samples determine the meaning of the data you *actually have*. The Likelihood Principle cuts through that. Once the data `D` is observed, *all* evidence about parameter `θ` is contained in `P(D|θ)`. How you decided to stop collecting `D`? Irrelevant.

  **F:** Irrelevant? Tell that to the researcher who peeks after every 5 subjects, stops when p<0.05, and declares victory! Your "evidence" is polluted. The *procedure* matters. If I simulate 10,000 researchers doing that under the *null* hypothesis, far more than 5% will falsely "find" an effect. That's the *true* error rate. Ignoring that invites false positives – fuel for the replication crisis.

  **B:** But you're judging the *evidence* based on what *didn't* happen! The researcher *did* stop. They *have* `D` subjects showing `X` effect. The probability of observing *this specific data sequence* `D` under the null, `P(D|H0)`, *is* small. That's the evidence against H0 contained *in the data*. Your Type I error rate is a property of the *method*, not the *evidence in this dataset*. You're conflating the reliability of a *procedure* across many hypothetical runs with the meaning of *this single result*.

  **F:** And you're ignoring the *selection bias* inherent in optional stopping! The data isn't just `D`; it's `D` *conditional on the stopping rule*. If you only look at datasets where p<0.05 *when you happened to look*, you've selected a biased sample of possible datasets! Your likelihood `P(D|θ)` ignores the conditioning on the stopping rule `S`. The *full* probability for the observed data under your stopping rule is `P(D and Stop|θ)`. Under optional stopping, `P(Stop|D)` is 1 only for data patterns that cross your threshold early. That *changes* the sampling distribution!

  **B:** Ah, the stopping rule `S`. You force it into the probability model as if it's part of the data-generating mechanism alongside `θ`. But `S` is chosen by the *scientist*, *after* seeing some data, or perhaps adaptively. It's not a fixed feature of the world like `θ`. Conditioning on `S` unnecessarily complicates the model. The likelihood principle says: *Given the data `D`*, the stopping rule provides no *additional* information about `θ` beyond what's in `P(D|θ)`. Why burden the inference with the scientist's indecisiveness?

  **F:** Because that "indecisiveness" directly impacts the *long-run operating characteristics*! Science isn't just about *this* experiment; it's about building a reliable body of knowledge. If journals are filled with results from experiments stopped early because p<0.05, the *proportion* of those published findings that are true will be lower than if everyone used fixed `N`. That's a direct cost to scientific progress – more dead ends, more failed replications. Your approach, focusing solely on the posterior `P(θ|D)`, provides no inherent protection against this inflation of false discoveries across the literature. Your "evidence" isn't calibrated.

  **B:** Calibration to long-run error rates is your *goal*, Evelyn, not an inherent requirement for rational belief updating. My posterior `P(θ|D)` tells me, *given my prior `P(θ)` and this data `D`*, how my beliefs about `θ` should change *now*. If my prior is well-justified (e.g., based on past literature, mechanistic understanding), and I update correctly via Bayes, my posterior *is* my best current state of knowledge. The fact that a different scientist, peeking differently, *might* get different data and a different posterior doesn't invalidate *my* inference from *my* data. Your frequentist properties are about the *method's* behavior over repetitions; they don't dictate what *this specific data* means.

  **F:** But Aris, your "well-justified prior" is the hidden cost! In practice, how many researchers peeking at their data have truly objective, pre-registered priors? Isn't the *temptation* precisely to adjust the prior, consciously or unconsciously, to make the posterior look more convincing after peeking? "Oh, I had a *vague* prior leaning slightly towards an effect..." Frequentism, with its pre-specified `N` and `α`, forces a discipline that guards against this self-deception. Your flexibility becomes a vulnerability in human hands.

  **B:** And your rigidity becomes a waste! Suppose I peek, see a massive, unambiguous effect early on – say, a life-saving drug showing clear benefit. Your rules force me to keep subjecting patients to a potentially inferior control group just to hit `N` and get `p<0.001` instead of `p<0.01`, purely to satisfy an arbitrary long-run error control unrelated to *this* evidence. That's an *ethical* cost! Bayes lets me stop when the evidence is sufficiently strong *for this decision*, based on posterior probabilities and loss functions. My framework naturally handles sequential analysis without inflating *evidential meaning*.

  **F:** But "sufficiently strong" is subjective! How strong is "sufficient"? Without the anchor of a controlled error rate, it's arbitrary. And "unambiguous effect"? Many effects look unambiguous early on due to random high draws, then regress. Your stopping rule *encourages* chasing noise. My framework exposes the cost of flexibility: potential loss of calibration and objectivity. Yours hides it behind the veil of "current evidence," ignoring how the *pathway* to that evidence biases its interpretation.

  **B:** And your framework hides the cost of rigidity: inefficiency, potential ethical lapses, and misinterpreting the *actual evidence* you have by worrying about data you *didn't* collect. We interpret the *same* `D` differently *only* because I refuse to condition on imaginary futures. The data is the data.

  *(A pause. They sip their drinks, the intellectual tension lingering.)*

  **F:** So, for our biologist friend here, haunted by all those times they peeked... **My blunt advice:** You sinned against the sampling distribution. Every peek, every unplanned stop, inflated your *actual* long-run false positive rate, even if any single result *looked* convincing. You should have *always* pre-registered your exact sample size and stopping rule based on a power analysis, and stuck to it religiously. No exceptions. The cost of flexibility is uncalibrated evidence and irreproducible results.

  **B:** And **my blunt advice:** Your sin wasn't peeking; it was *not properly quantifying your uncertainty before and after*. You should have *always* specified a justifiable prior *before collecting any data* – even if it was broad and weak. Then, *whenever* you looked, you could have computed the posterior. If the posterior probability for your hypothesis was sufficiently high (or low) *given that prior and the data you actually saw*, stopping was rational. The cost of rigidity is ignoring the evidence you have in hand and wasting resources. Peek all you want, but do the *full* Bayesian update honestly every time.

  **(Finch nods curtly, Byrne raises his glass slightly. The fundamental disagreement remains, but the costs of each path are laid bare.)**

  **Key Disputes Highlighted:**

  1.  **Evidence vs. Procedure:** B: Evidence is solely in the observed data likelihood (`P(D|θ)`). F: Evidence is defined by the procedure used to obtain the data (`P(D and Stop|θ)`).
  2.  **Conditioning:** B: Only condition on the observed data `D`. F: Must condition on the stopping rule `S` used to obtain `D`.
  3.  **Probability Interpretation:** B: Probability quantifies belief (epistemic). F: Probability quantifies long-run frequency (aleatory).
  4.  **Goal of Inference:** B: Rational belief updating given current data and prior knowledge (`P(θ|D)`). F: Controlling long-run error rates (Type I/II) across many hypothetical experiments.
  5.  **Costs of Each Framework:**
      *   *Frequentist Cost:* Rigidity (inefficiency, ethical issues, ignoring actual data meaning via hypotheticals).
      *   *Bayesian Cost:* Subjectivity (reliance on priors, potential for manipulation, lack of inherent long-run error control guarantees).
  6.  **Optional Stopping Impact:**
      *   F: Inflates Type I error rate (procedural miscalibration).
      *   B: Does not change evidential meaning of observed `D` (Likelihood Principle), but stopping *decision* should be based on posterior probabilities/loss functions.
