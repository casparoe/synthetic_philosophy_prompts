  Ok, this is something that's stuck with me even though I already filed the piece. I mostly cover science and ideas, but I got roped into writing about a legal fight between two small breweries over a beer name, and by the time it finally settled both sides had spent something like $300k on lawyers over a product line that brings in maybe $40k a year. The whole time, whenever I asked either owner why they didn't just settle for way less than they were burning on fees, they'd say some version of 'we've already put too much into this to stop now' -- and a few months later the other side would say basically the same thing right back, and the number would climb again. Is there an actual rational explanation for why fights like this blow way past the point where everyone involved is obviously loosing, or are the owners just being stubborn? And if you're already a few rounds into a spiral like that yourself, is there any genuinely rational way to get off it, or are you just stuck?
