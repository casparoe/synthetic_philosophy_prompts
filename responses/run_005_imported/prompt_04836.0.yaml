answer: |-
  ## The Unjust Warrior's Burden: Reconciling McMahan's Moral Truth with Walzer's Practical Imperative

  The principle of the moral equality of combatants (MEC), central to Michael Walzer's traditionalist just war theory, asserts a stark symmetry: soldiers fighting for an unjust cause possess the same *jus in bello* permissions and liabilities as their just adversaries, provided they adhere to discrimination and proportionality. Jeff McMahan's revisionist challenge, rooted in the logic of individual self-defense, shatters this symmetry, arguing that materially unjust combatants lack the moral right to kill, even while following the rules. While Walzer's practical concerns about judgment and compliance are compelling and necessitate the *legal* maintenance of combatant equality, McMahan's core moral argument about individual responsibility is ultimately irrefutable. The correct verdict is a qualified one: **McMahan successfully demonstrates the *moral* inequality of combatants based on *jus ad bellum*, but Walzer's framework of symmetrical *legal* rules and conventions remains indispensable for the practical regulation of warfare.**

  **McMahan's Moral Core: The Indispensability of Just Cause for Permissible Killing**
  McMahan's argument derives its force from a fundamental moral principle: the right to kill another human being is not inherent to the role of soldier but depends crucially on the moral context. He analogizes war to individual self-defense. Just as an unjust aggressor forfeits their right not to be killed in self-defense by the victim, but lacks the right to kill the victim in "self-defense" against their justified resistance, so too in war:

  1.  **The Source of Liability:** Combatants fighting in a just war (just warriors) pose a *justified threat* to unjust combatants who are responsible for an ongoing, unjust aggression. Killing these unjust combatants is permissible as a necessary defense against their culpable aggression.
  2.  **The Lack of Permission:** Conversely, combatants fighting without a just cause (unjust warriors) pose an *unjustified threat*. Killing a just warrior – who is resisting their unjust aggression – cannot be morally justified as self-defense. The just warrior is defending against a culpable threat; the unjust warrior is perpetuating one. Their adherence to *jus in bello* rules mitigates their *wrongdoing* (making killing *less* unjust, perhaps excusable) but does not transform their killing into a *permissible act*. As McMahan states, observing the rules doesn't "confer a *justification* for killing people who have a right not to be killed."
  3.  **The Burden of Culpability:** McMahan places the moral burden squarely on the side initiating or perpetuating the unjust war. Their combatants become legitimate targets precisely *because* of their participation in the unjust collective project, regardless of individual epistemic limitations or institutional coercion. While excuses (duress, ignorance) may absolve *blameworthiness* for many individual soldiers, they do not negate the objective *wrongness* of their lethal actions against those who have a right to resist.

  McMahan successfully dismantles the notion that the role of "soldier" magically suspends ordinary moral constraints on killing. His logic, grounded in the basic ethics of interpersonal violence, exposes MEC as a moral fiction. If killing requires justification beyond mere role-compliance, then *jus ad bellum* status *must* affect *jus in bello* permissions at the deepest moral level.

  **Walzer's Practical Citadel: The Necessity of Symmetry in Law and Practice**
  Walzer and traditionalists do not necessarily deny the underlying moral asymmetry McMahan identifies. Rather, they argue that translating this asymmetry into practical rules or judgments *within war* is disastrously unworkable and ultimately undermines the very constraints *jus in bello* seeks to impose. Their defense rests on two powerful pillars:

  1.  **The Epistemic Problem:** Soldiers are profoundly ill-positioned to make definitive judgments about the overall justice of their nation's cause. Governments control information, propaganda is rife, the fog of war obscures context, and the philosophical complexity of *jus ad bellum* criteria is immense. Demanding that individual soldiers withhold fire or question their legitimacy based on uncertain assessments of *ad bellum* justice invites paralysis, mass insubordination, and chaos. It places an impossible cognitive and moral burden on individuals operating under extreme duress.
  2.  **The Compliance Problem:** Abandoning MEC in law and practice, traditionalists argue, would catastrophically erode adherence to *jus in bello* constraints. If soldiers on the "unjust" side believe they have no right to fight *at all*, they lose the primary incentive to fight *cleanly* – the reciprocal expectation of similar treatment from the enemy and the hope of eventual honorable treatment. They become mere criminals with nothing to gain by restraint. Simultaneously, soldiers on the "just" side, believing their enemies lack any moral standing, might feel licensed to disregard restraints, viewing the enemy as "unlawful combatants" deserving of no quarter. The reciprocity underpinning the laws of war collapses, leading to greater brutality against combatants and, inevitably, civilians.

  Walzer also emphasizes the shared "moral equality" of facing danger and death, and the tragic dilemma even just warriors face when forced to kill excusable (though unjust) opponents. His system prioritizes minimizing suffering *within* war by creating clear, reciprocal, role-based rules that are psychologically manageable and legally enforceable, even if they abstract from the deeper moral truth.

  **Synthesis and Verdict: Moral Asymmetry, Legal Symmetry**
  To conclude that "both sides have a point" is accurate but insufficiently decisive. A definite verdict requires recognizing the distinct domains in which each argument prevails:

  *   **McMahan is Correct on Fundamental Morality:** His core argument, derived from the ethics of self-defense and individual responsibility, is logically compelling. There *is* no genuine moral equality between combatants fighting for a just cause and those knowingly or culpably fighting for an unjust one. The latter lack the *fundamental moral justification* to kill their just opponents, even while following *jus in bello* rules. Their actions may be *excused* due to duress or non-culpable ignorance, but not *justified*. McMahan successfully exposes MEC as a morally problematic convention, not a deep moral truth.
  *   **Walzer is Correct on Practical Necessity:** However, McMahan's deep morality cannot be directly operationalized within the chaotic, epistemically constrained, and reciprocally dependent environment of warfare. Walzer's defense of MEC as the foundation for *law and convention* is pragmatically indispensable. The epistemic burdens on soldiers are real and overwhelming; the threat to *jus in billo* compliance posed by abandoning formal equality is severe and likely catastrophic. Therefore, *for the purposes of positive international law, military doctrine, and practical conduct in the field*, the symmetrical rules championed by Walzer must be maintained. They provide the only feasible framework for restraining brutality, protecting civilians (by maintaining clear combatant/non-combatant distinctions), and facilitating post-conflict reconciliation.

  **Conclusion:**
  The dispute over the moral equality of combatants reveals a necessary tension between the demands of deep individual morality and the practical realities of regulating collective violence. Jeff McMahan wins the philosophical argument: materially unjust combatants are not morally entitled to kill just combatants. Their lethal actions lack justification, grounded in their participation in an unjustified threat. However, Michael Walzer wins the pragmatic imperative: translating this moral asymmetry into asymmetrical *legal* rules or expectations *during war* is unworkable and dangerously counterproductive. Therefore, the definitive verdict is one of qualified endorsement: **McMahan's critique of MEC as a *moral* principle is sound, but Walzer's symmetrical *jus in bello* framework, incorporating MEC as a *legal and conventional* principle, remains essential for the imperfect but vital task of limiting the horrors of war.** We must acknowledge the unjust warrior's moral burden while recognizing that insisting they bear it fully *within* the conduct of war itself would likely make war even worse. The law of war, tragically, cannot always mirror the deepest moral truth without undermining its own purpose.
