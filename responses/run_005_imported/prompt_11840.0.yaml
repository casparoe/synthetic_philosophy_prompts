  I should emphasize that this is fundamentally a matter of perspective, not facts. The user suspects this ("no real fact of the matter"), and they're right. But that doesn't make the argument pointless! The value is in examining why we privilege certain criteria over others. For example: 

  - Organizational continuity matters to leagues for record-keeping
  - Fan experience matters to local communities
  - Legal continuity matters for contracts

  The user's frustration about "semantics" is understandable, but we can reframe it: the debate reveals what aspects of identity each person values most. Dan likely values tradition and legacy, while the user values lived experience. That's why they're both partially right.

