prompt: |-
  I'm on the "commitments review board" at the startup I work for (don't ask why we have a whole committee for this, long story). We make an app where people put real money down to keep promises to themselves — quit smoking, run more, whatever — and if a tracker says you failed, your stake gets sent to a charity automatically, no manual override. That's basically the whole pitch: you can't talk your way out of it later.

  Last month a syncing bug caused about 140 users to get flagged as failing a commitment they'd actually kept — we've got the raw data now proving it, the tracker just didn't report in time. We're already refunding that batch, thats not the issue. What we can't agree on is the policy going forward. Half the board wants a real appeals process, since what people actually promised was "I'll run the miles," not "the api will say I ran the miles," so enforcing the api's version over what someone actually did just punishes a bug. The other half think that's a slippery slope that guts the whole product: the reason people pay us is that there's no wiggle room and no arguing your way out afterward, and the second we let humans make judgement calls about who "really" meant it, the thing stops actually binding anyone, even the people the tracker got right about.

  Can you draft the short memo I'd bring to Thursdays board meeting? It should land on one actual policy (build an appeals process, hold the line completely, something narrower in between) with a rough timeline for rolling it out, not just lay out both sides, and it needs to take the "no exceptions" position seriously — I think it's onto something real about what makes a commitment binding in the first place, I just can't articulate what. I'm an engineer not a philosopher so don't worry about anything going over my head, just reason it out plainly.
reasoning: |-
  Okay, the user is part of a commitments review board at a startup that runs an app where users put real money on the line for personal goals. If they fail, the money goes to charity with no overrides. Recently, a syncing bug caused 140 users to be falsely flagged as failing. The board is split: half want an appeals process for such cases, while the other half worry it undermines the app's core "no exceptions" value. 

  Hmm. The user needs a memo for their board meeting that picks a concrete policy—not just presenting both sides. They want it to seriously engage with the "no exceptions" argument while resolving the tension. Interesting challenge. 

  First, gotta unpack why "no exceptions" works psychologically: the power comes from users knowing the system is merciless. If you introduce human judgment, even for legit tech errors, users might start hoping for leniency in other cases ("I swear I ran but my GPS died!"). That erodes trust in the product's ironclad nature. 

  But... the counterpoint is brutal too: punishing users for app failures isn't just unfair—it turns the product into a scam. If the tracker lies, the commitment wasn't broken; the tool failed. The user's promise was to *run*, not to debug APIs. 

  Wait—maybe there's a third path? What if appeals are ONLY for verified system errors (like this sync bug), with zero subjectivity? Like a "mechanical failure" clause in contracts. You'd need airtight criteria: provable app-side errors with timestamped data gaps, no "I forgot to charge my device" excuses. 

  Timeline could be tight: define the policy in 2 weeks, build a verification tool in 4 (engineers love concrete specs). Key is framing it as protecting the product's integrity, not softening it. The memo should stress: "We’re not judging commitments; we’re fixing our tools when they misfire." 

  ...Yeah. That threads the needle. The "no exceptions" crowd keeps the core promise intact—human judgment never touches the commitment itself. The fairness folks get recourse for tech fails. And the rollout’s fast enough to show urgency without rushing. 

  Final touch: hammer home that refunding the 140 users wasn’t kindness—it was obligation. The policy just makes that obligation systematic. Done.
answer: |-
  ## MEMO: Policy Resolution for Commitment Enforcement  
  **To:** Commitments Review Board  
  **From:** [Your Name], Engineering  
  **Date:** [Current Date]  
  **Subject:** Balanced Policy for Technical Failures – Protecting Integrity & Fairness  

  ### Core Principle Up Front  
  **We enforce commitments based on objective data, not intent.** The product’s power comes from removing self-deception and negotiation. However, when *our system* demonstrably fails—not the user—enforcing penalties betrays trust and invalidates the commitment. We must distinguish between user failure and tool failure.  

  ### Recommended Policy: "Verified System Error Appeals"  
  1. **Scope:**  
     - Appeals **only** permitted when *provable, catastrophic system errors* (e.g., syncing bugs, API downtime, data loss) prevent valid proof from being recorded.  
     - **Not eligible:** User errors (dead trackers, missed logs), ambiguous data, or subjective "I tried hard" claims.  

  2. **Process:**  
     - **User Submission:** Brief form + timestamped evidence (e.g., third-party app data, screenshots).  
     - **Automated Triage:** Engineering tool cross-checks internal logs/system health for correlated failures.  
     - **Data Review:** If system error confirmed, raw data audit by engineering (not board members) to verify user claim.  
     - **Outcome:** Full refund + apology if validated; automated denial if no system fault found. **No human judgment on commitment adherence.**  

  3. **Why This Addresses "No Exceptions" Concerns:**  
     - **No subjectivity:** We audit *system functionality*, not user intent. Did the tool break? Not: "Did they *mean* to run?"  
     - **Binding integrity preserved:** Users still can’t argue effort or excuses—only prove the tool failed *while they performed*.  
     - **Incentive alignment:** Forces us to improve reliability. Frequent appeals = engineering priority.  

  ### Timeline  
  - **Week 1:** Finalize policy/criteria (draft shared post-meeting).  
  - **Week 3:** Build automated triage tool + appeals form (eng team).  
  - **Week 6:** Soft-launch for 5% of users; monitor volume/false positives.  
  - **Week 8:** Full rollout + retro on bug-140 incident as case study.  

  ### Why Not "Hold the Line" or Full Appeals?  
  - **Absolute enforcement:** Ignores our accountability for tool reliability. Punishing users for *our bugs* is fraud, not commitment.  
  - **Broad appeals:** Invites subjectivity ("I had a busy week"), undermining the product’s core. Our solution is surgical: *fix the tool, not the rule*.  

  This policy honors the "no override" spirit while acknowledging a critical truth: **A commitment is only as binding as the system measuring it.** We protect the product’s teeth by ensuring they only bite when deserved.  

  *Recommended next step: Vote to adopt framework Thursday. I’ll draft detailed specs by EOD Friday.*
