answer: |-
  That's not a weird question at all—it cuts deep into ethics, economics, and the purpose of wealth. Your discomfort is valid, and there *are* meaningful distinctions here. Let's break it down:

  ### 1. **The "Normal Saving/Investing" Comparison**
     - **Purpose-Driven vs. Accumulation for Its Own Sake**: Most people invest (index funds, retirement accounts) to fund future goals: retirement, a home, education, security. Your cousin treats wealth accumulation as an *end in itself*. This aligns with what philosophers call "instrumental rationality" (using efficient means) divorced from any higher "substantive rationality" (meaningful ends). It’s not irrational, but it can feel existentially hollow.
     - **Risk & Social Utility**: Index funds passively support economic growth by funding businesses. Crypto/day-trading is speculative, often extractive (wealth transfer without productivity), and can destabilize markets. Lending to family is socially fraught but doesn’t scale to broader economic harm.

  ### 2. **Ethical Red Flags in His Model**
     - **Family as a Credit Market**: Charging 8–10% interest to relatives isn’t inherently wrong, but it commodifies kinship. Family loans typically carry *social* interest—trust, reciprocity, mutual aid. Monetizing this creates power imbalances:
       - **Coercion Risk**: Desperate family members may agree to harsh terms they’d refuse from a bank.
       - **Relationship Damage**: Defaults could fracture ties. A bank repo’ing a car is impersonal; your cousin seizing a cousin’s asset is personal.
     - **Parasitic Potential**: If his lending/trading profits rely solely on others’ misfortune (cash shortages) or market volatility without creating value, it edges toward rent-seeking—extracting wealth without contributing to productivity.

  ### 3. **The "Real Work" Question (It’s Not Snobbery)**
     - **Your Partner’s Index Funds**: Passive investing delegates capital allocation to markets, supporting aggregate productivity. It’s hands-off and systemically functional.
     - **Your Cousin’s Approach**: Active trading and high-interest lending require skill but operate in zero-sum or extractive spaces. Crypto/day-trading often profits from volatility and information asymmetry. Family lending profits from intimate access to need. This isn’t about "real work" (manual labor, etc.), but about **whether the activity generates societal value or merely redistributes (or destroys) wealth**.

  ### 4. Principled Objections You Can Articulate
     - **The Agency Argument**: His "no one is forced" claim ignores power dynamics. Family borrowers may have fewer options, less financial literacy, or emotional pressure to agree.
     - **The Sustainability Critique**: His model lacks buffers. No savings goal = no hedge against risk. A market crash could wipe him out *and* cascade to indebted relatives.
     - **Teleological Dissonance**: Wealth accumulation without purpose rejects the Aristotelian idea that money is a tool for eudaimonia (flourishing). Endless growth as an ultimate good is closer to a pathology (see: King Midas) than a life well-lived.
     - **Communal Erosion**: Monetizing family trust risks replacing kinship with transactionality. If every family need becomes a profit opportunity, the social fabric weakens.

  ### 5. Where Your Discomfort Might Be Misplaced
     - **His Autonomy**: If he’s not harming others (debatable, but possible), his choice to live for accumulation is his right. Max Stirner or Ayn Rand would defend this radical self-interest.
     - **Crypto/Trading Legitimacy**: While volatile, these are legal markets. If he’s skilled, it’s a high-risk "job." The issue isn’t the activity per se, but its combination with family lending and purposelessness.

  ### Key Takeaway:
  **Your objection isn’t snobbery—it’s a defense of two things:**
     - **The non-market value of family relationships** (which his lending commodifies).
     - **The idea that wealth should serve human ends** (which his endless accumulation rejects).

  You needn’t convince him he’s wrong. But you can coherently argue that his model is **ethically precarious** (due to family exploitation risk) and **existentially empty** (reducing life to a scoreboard). As a philosopher, you might say he’s conflating *instrumental* and *intrinsic* value—money is a tool, yet he treats it as the purpose. That’s a profound category error, even if it’s "rational" within his closed system. 

  If discussing this again, focus on the *relational impact* and *purpose* questions—not the mechanics of his work. That shifts the debate from "is this smart?" to "is this wise?"—which is where your philosophical instincts are spot-on.
