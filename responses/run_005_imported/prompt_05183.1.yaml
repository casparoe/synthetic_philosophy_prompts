  Here’s a systematic critique of Wallace’s account, arguing that hypocrisy alone cannot undermine standing to blame and that its apparent force stems entirely from independent factors like insincerity or complicity:

  ### **1. Wallace’s Core Argument: A Misdiagnosis of the Problem**  
  Wallace claims hypocrisy voids standing because the blamer denies the "equal moral standing" of the blamed by exempting themselves from the norm they enforce. This frames hypocrisy as a *procedural* failure in moral dialogue: the hypocrite violates reciprocity, making their blame illegitimate regardless of the norm’s validity.  

  ### **2. Why Hypocrisy Isn’t a Freestanding Defeater: The Insincerity Counterargument**  
  Wallace conflates **inconsistency** with **insincerity**, but only the latter truly undermines standing.  
  - **Case Study**: A politician condemns adultery while secretly committing it. Wallace says their hypocrisy voids their standing to blame.  
  - **Refutation**: The flaw isn’t inconsistency—it’s that their actions reveal *insincerity*. If they believed adultery was truly wrong, their blame could still be valid (though their credibility suffers). But if their actions prove they don’t genuinely endorse the norm, their blame is *empty performativity*. This insincerity—not the inconsistency—explains why their blame fails.  
  - **Philosophical Basis**: Blame presupposes the blamer endorses the norm (Scanlon, Watson). If hypocrisy exposes insincerity, it’s the *lack of normative commitment*—not the act-exempting—that defeats standing. Inconsistency is merely evidence of this deeper flaw.  

  ### **3. The Complicity Objection: Hypocrisy as a Red Herring**  
  Wallace ignores how hypocrisy often signals *complicity in the same wrong*, which independently voids standing.  
  - **Example**: An oil executive condemns activists for using plastics while personally taking private jets. Wallace focuses on the executive’s exemption from conservation norms.  
  - **Refutation**: The executive’s blame fails not due to inconsistency, but because they *directly cause greater harm*. Their complicity in environmental damage makes them an inappropriate blamer (McKenna). Their hypocrisy merely highlights this conflict of interest.  
  - **Key Distinction**: We reject blame from *participants in wrongdoing* because they lack clean hands (e.g., a thief blaming another thief). Hypocrisy here is incidental; the core issue is *contributory fault*.  

  ### **4. Why "Equal Standing" Misidentifies the Mechanism**  
  Wallace’s "denial of equal standing" argument fails three ways:  
  - **Overinclusion**: A recovering alcoholic condemning drunkenness isn’t denying equal standing—they acknowledge shared fallibility. Their past failure doesn’t negate their standing if they now sincerely endorse the norm (e.g., advocating sobriety).  
  - **Underinclusion**: A non-hypocritical blamer can still deny equal standing (e.g., a racist blaming minorities for "moral inferiority"). Here, standing is voided by bigotry—not hypocrisy.  
  - **Moral Truth Anchors Blame**: The validity of blame depends primarily on whether the *norm is correct* and the *blamed violated it* (Darwall). If the norm is sound, the blamer’s consistency is irrelevant to its truth. Wallace’s focus on the blamer’s status distracts from the blame’s substantive merit.  

  ### **5. Residual Cases Explained Without "Equal Standing"**  
  Wallace’s persuasive examples dissolve under scrutiny:  
  - **Climate Activist Case**: Dismissing an activist for flying ignores that her blame’s force depends on (a) whether carbon emissions *are* wrong (substantive norm), and (b) whether her flight negates her *sincerity* (e.g., if she flies frivolously while claiming climate emergency). Her "hypocrisy" only matters if it proves insincerity—otherwise, it’s an ad hominem diversion.  
  - **Politician Scandal**: A "family values" advocate’s adultery undermines their blame only if it shows they never believed their platform (insincerity) or used it deceptively (complicity in eroding trust). The inconsistency itself doesn’t invalidate critiques of adultery—only their authority to *credibly* voice them.  

  ### **Conclusion: Hypocrisy as Epiphenomenal, Not Causal**  
  Wallace mistakes correlation for causation. Hypocrisy appears potent only when it:  
  1. **Reveals insincerity** (showing the blamer doesn’t believe the norm), or  
  2. **Highlights complicity** (showing the blamer exacerbates the harm they condemn).  
  In both cases, *independent factors* defeat standing. Where hypocrisy exists without insincerity/complicity (e.g., a conflicted but sincere blamer), it may invite skepticism about *credibility* but doesn’t nullify standing. Rejecting this distinction lets hypocrites weaponize their own flaws to silence valid criticism—a dynamic your reporting wisely questions. The focus must remain on the *substance of the norm* and the *blamed party’s actions*, not the blamer’s purity.
