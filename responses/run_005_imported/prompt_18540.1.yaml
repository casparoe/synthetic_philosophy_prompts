  For the trap's visibility: each trade must appear separately advantageous. Marco's dialogue should drip with false generosity ("help you upgrade", "favor for a friend"). Silas' hesitation moments (touching the Grail's box, staring at his original shoes) are where readers might spot the pattern before he does.

  The critical moment - when Silas holds the Common Dunk again - needs physical weight. I'll have Marco offer something irresistible (cash + Grail) for it. Either outcome works per request, but Silas breaking feels truer to the money pump's inevitability. His final line "I know what I'm doing" mirrors real-life self-delusion in these traps.

  Brother's poker anecdote is useful texture. I'll weave in gambling terminology ("calling his own bluff") to honor that insight. The sneaker details must feel authentic - specific models, textures, collector jargon - so the trades don't feel theoretical.

