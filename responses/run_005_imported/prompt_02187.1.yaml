  So I've been stuck on Newton's bucket experiment for a couple weeks now and can't quite get past something. I get why he thought it proved space itself is a real thing - the water climbs up the sides once it's actually spinning, and that happens whether or not the bucket around it is moving relative to the water at that exact moment, which is the weird part. But then I saw this response from Mach somewhere, saying it's not really 'absolute space' doing that, its actually rotation relative to all the other matter in the universe (the stars, galaxies, whatever), and that if you somehow held the bucket still and spun literally everything else in the universe around it instead, the water would apparently still climb up. Problem is, that seems impossible to actually check since we've only got the one universe and can't rerun it with everything else spinning instead to see what happens. Did this ever actually get resolved somehow, like did general relativity end up favoring one side over the other, or is this just a question we can never get real traction on?
