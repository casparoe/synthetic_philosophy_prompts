answer: |-
  ## The Edge of the Debunker's Knife: Why Evolutionary Skepticism Cuts Morality but Spares Math

  The evolutionary debunking argument (EDA) against moral realism, powerfully articulated by Sharon Street, poses a profound challenge: if our moral beliefs are largely the product of natural selection shaping adaptive responses (cooperation, kin preference, aversion to harm), rather than a process sensitive to mind-independent moral truths, then the realist owes an explanation for why these beliefs would *coincidentally* align with those truths. The "huge coincidence" looms large. However, the "proves too much" objection you raise is formidable: our capacities for logic, mathematics, and empirical reasoning are *also* products of the same evolutionary process, selected for their fitness advantages (predicting predators, navigating terrain, counting resources), not for "tracking" abstract logical or mathematical truths. If EDAs debunk morality, shouldn't they equally debunk logic and math, leading to a self-defeating global skepticism? Resolving this requires identifying a principled disanalogy. While not without its challenges, the strongest case lies in the **nature of the representation relation and the indispensability of logic/math for the debunking project itself.**

  ### Failed Asymmetries and the Bullet to Avoid

  Before presenting the strongest disanalogy, let's dispatch weaker attempts:

  1.  **"Fitness Directly Tracks Truth in Math/Logic, Not Morals":** This is often the intuitive response. Avoiding cliffs requires accurate spatial reasoning; counting sheep requires rudimentary arithmetic. Doesn't fitness *require* tracking *some* logical/mathematical truths about the physical world? The problem is twofold. First, evolution only selects for *fitness-enhancing* approximations. Our innate "number sense" is approximate and limited; our logical intuitions are riddled with systematic fallacies (e.g., confirmation bias). Second, higher mathematics (e.g., transfinite sets, non-Euclidean geometry) bears no clear fitness link. If selection only favored "cliff-avoiding math," why trust our beliefs about Peano Arithmetic, let alone ZFC set theory? The adaptive link is indirect and incomplete, mirroring the moral case.
  2.  **"Math/Logic are Analytic or Conceptual Truths":** The claim is that mathematical and logical truths are true by definition or conceptual necessity, independent of evolution. However, EDAs target our *belief-forming mechanisms* and their *justification*. Even if Platonism is true, *how do we know* our evolved cognitive faculties reliably grasp these analytic/conceptual truths? Evolution didn't select for conceptual analysis, it selected for survival. The gap between our evolved cognitive toolkit and the purported truths remains problematic, analogous to the moral gap.
  3.  **Biting the Global Skepticism Bullet:** Some hardcore skeptics (or eliminativists) might accept that EDAs *do* undermine logic/math. However, this is fatal to the EDA itself. If our logical and mathematical reasoning is fundamentally untrustworthy, then *the evolutionary theory underpinning the debunker's argument* is also suspect. The EDA becomes self-undermining – it relies on the very cognitive faculties (for reasoning about evolution, probability, coincidence) it purports to debunk. This is a bullet few, including Street herself, are willing to bite, as it renders normative discourse (including the debunking project) impossible.

  ### The Principled Disanalogy: Representation Relation and Indispensability

  The viable disanalogy lies not in evolution *guaranteeing* truth in math/logic while failing for morals, but in the **fundamentally different relationship our cognitive faculties have to the relevant domains, coupled with the indispensable role logic/math play in *any* rational inquiry, including the EDA.**

  1.  **The Nature of the Representation Relation:**
      *   **Morality (Realist View):** Mind-independent moral truths (e.g., "Torture is objectively wrong") are posited as *distinct normative facts*. Evolution shaped our *evaluative attitudes* (aversions, desires, sentiments) towards behaviors that enhanced fitness. The link between these attitudes and the purported moral truths is entirely contingent. There's no necessary reason why fitness-enhancing attitudes (e.g., kin preference) should align with objective moral truth (e.g., impartiality). The "tracking" relation is indirect and potentially arbitrary. The coincidence *is* huge.
      *   **Logic/Math:** While the *abstract objects* (numbers, sets) might be mind-independent, the *rules* of logic and basic arithmetic describe the fundamental structure of *rational thought itself* and the *physical world* we interact with. Evolution didn't just shape attitudes *about* logic; it shaped cognitive mechanisms that *operate according to* logical and mathematical principles to successfully model and navigate reality. The "representation" here is constitutive: our basic logical and mathematical capacities *are the tools* we use to form any representation at all. The successful application of even rudimentary logic and math (e.g., "If predator there, then flee"; "Two berries here + two berries there = four berries total") was *directly fitness-enhancing because it reliably captured structural features of the environment necessary for survival*. While higher math may be a cultural extension, its foundation rests on these indispensable, structurally adaptive core capacities.

  2.  **Indispensability and Self-Presupposition:**
      *   **Morality:** Moral truths, on a realist view, are not *required* for the success of empirical science or the formulation of evolutionary theory. One can coherently describe the evolutionary process, the development of moral sentiments, and even argue for moral anti-realism, *without presupposing the truth of any specific mind-independent moral fact*. The EDA against morality is an *external* critique.
      *   **Logic/Math:** Logic and mathematics are **indispensable** for formulating *any* scientific theory, *including the theory of evolution and the EDA itself*. To even state the EDA requires logical inference (e.g., modus ponens: If P1 (beliefs shaped for fitness) and P2 (fitness ≠ truth), then C (beliefs not likely true)). It requires mathematical concepts (probability, coincidence). Crucially, **the EDA presupposes the reliability of our logical and mathematical reasoning *in the very act of making the argument***. To use logic and math to argue *against* the reliability of logic and math is pragmatically self-defeating. We cannot coherently doubt the tools we are *necessarily using* to formulate the doubt. This isn't just a pragmatic point; it highlights that logic and math are *constitutive* of rational inquiry in a way morality is not. Evolutionary theory itself is a logical/mathematical model of the world; its success *depends* on the basic reliability of the logical/mathematical structures it employs.

  **The Verdict:** The disanalogy holds. While evolution didn't select for perfect logic or advanced math, it *did* select for cognitive mechanisms whose core operations *reliably* (though fallibly) captured the fundamental logical and structural relationships in the physical world, because navigating that world successfully *required* it. More importantly, **logic and mathematics are indispensable and self-presupposing in any rational argument, including the EDA.** To deploy an EDA against them is to saw off the branch you're sitting on. Morality, conceived as a realm of mind-independent normative truths, lacks this constitutive relationship to rational inquiry and empirical success. Its connection to our evolved attitudes remains contingent and unexplained by realism, making it uniquely vulnerable to the debunking challenge.

  **Objection & Refinement:** One might object that even basic logic/math could be radically wrong *in ways that didn't impact fitness* (e.g., a logically inconsistent world that *appeared* consistent). This is a deep skeptical challenge, but it applies universally and equally undermines *all* reasoning, including the skeptic's own position. The EDA against morality, however, operates *within* a framework of generally accepted reliable reasoning. It targets a *specific domain* (morality) precisely *because* its evolutionary genealogy seems to offer no necessary connection to its purported truth-makers, unlike the domains (logic, math, basic empirical reasoning) that are demonstrably *required* for the genealogy to be formulated and for organisms to function in the world at all. The EDA successfully debunks moral realism not by proving evolution *couldn't* track truth, but by showing that for morality, unlike logic/math, there is no plausible *explanation* for *why* it *would* track the specific mind-independent truths posited. The burden remains unmet, while for logic/math, the constitutive role in cognition and inquiry provides a compelling (though not logically airtight) reason for trust, even within an evolutionary framework. The knife of evolutionary skepticism cuts morality precisely because it *doesn't* need to cut the hand that wields it – the hand shaped by evolution to grasp the logical and mathematical structures of reality.

  **Therefore, the "proves too much" objection fails. Evolutionary debunking arguments can consistently target moral realism without collapsing into global skepticism because of the fundamental disanalogy in the representation relation and, crucially, the indispensable and self-presupposing nature of logic and mathematics for rational inquiry itself.** The coincidence for morality remains damning; for logic and math, evolution provides a plausible, non-coincidental story about how we came to possess (imperfect but) fundamentally reliable capacities essential for navigating the world *and* for understanding our own origins.
