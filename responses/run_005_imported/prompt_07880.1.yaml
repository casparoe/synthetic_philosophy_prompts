  #### (2) Correctly Explaining the Tension and "Rational Irrationality" [5 pts]  
  - **Points Awarded**: 5/5  
  - **Comment**: The tension for CDT is clearly explained: paying in town is causally futile (a "sunk cost"), yet refusing payment makes one predictable and thus doomed in the desert. The "rational irrationality" concept is accurately defined as causing oneself to adopt dispositions that appear irrational by the theory's own standards later (e.g., CDT agents must dispositionally commit to "irrational" payment to survive). The link to "indirectly self-defeating" theories (where perfect compliance worsens outcomes) is precise.  

  #### (3) Resolute vs. Sophisticated Distinction (Including Attribution) [5 pts]  
  - **Points Awarded**: 5/5  
  - **Comment**: The distinction is flawless. Sophisticated choosers (who re-evaluate and abandon plans when locally optimal) are correctly tied to CDT’s failure, while resolute choosers (who stick to ex ante optimal plans despite local costs) succeed. Gauthier is properly credited as the source. The explanation of why resoluteness yields better outcomes with predictors is complete.  

  #### (4) Causal vs. Evidential Decision Theory [3 pts]  
  - **Points Awarded**: 3/3  
  - **Comment**: The EDT approach is correctly framed: paying is "good news" because it evidences being a "payer-type" who gets rescued. The contrast with CDT (which ignores this correlation) is apt, and the point about EDT resolving the case without resolute choice is accurate. No errors.  

