  Here is a eulogy crafted to honor your grandmother's profound Ash'arite occasionalism, offering comfort within its specific framework while being accessible to both audiences. It avoids causal language, respects her theological precision, and runs approximately 7-8 minutes when spoken deliberately:

  ---

  **Eulogy for [Grandmother's Name]**

  We gather today in the presence of God, united by our love for [Grandmother's Name], and by the profound absence we feel. That absence is real, and the grief it brings is real. We feel it deeply, and that is right. She was a light in our lives – my grandmother, our mother, our sister, our friend, our teacher.

  For many of us, especially her family, she was the warm presence at the head of the table, the sharp wit that could make us laugh even when we were being gently corrected – often, as many remember, for the way we described the world. "No, dear," she'd say, perhaps as steam rose from the kettle, "the water didn't *boil*. God brought about the state we call boiling, in conjunction with the heat He applied to the kettle." It wasn't just a quirk; it was a window into the profound reality she inhabited and dedicated her life to understanding and teaching.

  For nearly fifty years, at the seminary, [Grandmother's Name] guided students through the intricate landscape of *kalām*, Islamic philosophical theology. Her passion, her intellectual home, was the classical Ash'arite understanding of God's absolute sovereignty and the nature of creation. She built her courses, her scholarship, and indeed, the very lens through which she saw existence, around this truth: that God is the *only* true Agent. The *only* true Cause.

  As she taught, following the great Imam al-Ghazālī, nothing in creation possesses inherent power to produce effects. Fire doesn't *burn* cotton; God creates the state of burning in the cotton *when* fire is present. Medicine doesn't *cure*; God creates the state of health in the body *when* medicine is taken. The patterns we observe – the sunrise, the falling rain, the beating of a heart – these are not chains of cause and effect driven by things themselves. They are the constant, habitual re-creation of the universe by God, moment by moment by moment. A pattern of divine action, a rhythm of His will, which we call His 'habit' (*'āda*). And because it is His *habit*, freely chosen, He remains utterly free to alter it at any instant, as He did when He preserved Abraham in the fire.

  This wasn't abstract theory for her. It was the bedrock of her faith, the air she breathed. It shaped her humility before the Divine, her profound sense of utter dependence on the Sustainer who wills every atom into existence anew each instant. She saw the hand of the Real, *al-Haqq*, directly in every single occurrence, great and small.

  And so, we come to this moment. Her body, this vessel that held her spirit and her brilliant mind, is no longer animated by the life God continuously willed into it. The complex pattern of existence we knew as [Grandmother's Name] – her voice, her thoughts, her laughter, her fierce intellect – that pattern, sustained by God's constant creative act for all her years, has ceased. Not because her body "gave out" or "failed" by its own power. Not because she "lost a fight." To say that would be, as she might remind us with that familiar look, to grant creation power it simply does not possess. As she herself would sometimes say, half-joking but wholly serious: if anyone said such things today, she'd be compelled to come back and argue the point! The joke, of course, lies in the theology: on her own firm conviction, nothing returns, or fails, or acts, except by the direct will of God.

  So, why did this pattern cease now? We stand humbly before the mystery of God's will. We cannot know the wisdom behind the timing of His decision to cease creating the specific constellation of life that was our beloved [Grandmother's Name] in this world. To speak of "God's plan" in a vague way risks diminishing the specificity and immediacy of His action that she spent her life teaching. It wasn't a distant plan unfolding; it was His direct, intimate, sustaining will, instant by instant, that upheld her, and it is His will, equally direct and sovereign, that has now ceased that particular act of creation.

  Where, then, is comfort within this reality she held so dear?

  The comfort lies precisely in the *source* of all existence and the *constancy* of the Agent. The same God who willed her into being moment by moment for all her years, who sustained her intellect, her love, her very breath, is the God who holds us now in our grief. He does not change. His power is absolute. His knowledge encompasses everything, including our sorrow. His mercy is vast.

  The comfort lies in knowing that her life, every instant of it, was a direct, unmediated act of God's grace and attention. Nothing was random. Nothing was outside His knowing will. Her joys, her struggles, her teaching, her love for us – all existed solely because He willed them into being, intimately and specifically.

  The comfort lies in recognizing that her unwavering faith was placed in this ultimate Reality: that God alone acts, God alone sustains, God alone is the source of all power. She trusted utterly in the One whose habit is constant, yet whose freedom is absolute. She found profound peace in that utter dependence, that complete surrender to the sole Agent.

  And the comfort lies for us, now, in knowing that the God who held her in existence is the same God holding us. Our grief is real because her absence is real. But we are not adrift. We exist, we breathe, we feel this pain, solely because God wills us into existence this very moment. He is as present now as He ever was. He hears our tears. He knows our loss. His sustaining power holds the universe, including our fragile hearts, right now.

  [Grandmother's Name] didn't believe in causes; she believed in God. She didn't believe in the independent power of creation; she believed in the overwhelming, immediate, sustaining power of the Creator. Her life was a testament to that belief, lived with integrity, intellectual rigor, deep faith, and love.

  We mourn the cessation of the unique pattern of divine creation we knew as [Grandmother's Name]. We feel the void intensely. But we also remember her unwavering trust in the One who is the Ever-Living, the Self-Subsisting (*Al-Hayy, Al-Qayyum*). We honor her best by acknowledging the profound truth she dedicated her life to: that ultimately, everything returns to Him, the only true Agent, the source of all being, the Most Merciful.

  May God, the sole Sustainer, grant her peace in His presence. May He, the only true Actor, grant us all the strength to bear this absence, and the grace to remember her light. Ameen.

  ---

  **Key Elements & Rationale:**

  1.  **Acknowledges Grief:** Opens with the raw reality of loss and grief, validating the family's primary need.
  2.  **Personal Introduction:** Grounds her in family life, using the kettle anecdote as an accessible entry point to her philosophy.
  3.  **Explains the Theology Clearly (but Accessibly):** Uses simple language ("only true Agent," "only true Cause," "habitual re-creation," "pattern," "sustaining will") to convey the core of Ash'arite occasionalism without jargon. Explicitly references al-Ghazālī and the key examples (fire, medicine, heart).
  4.  **Directly Addresses Her Death:** Explicitly rejects causal language ("gave out," "failed," "lost a fight") and explains *why* based on her theology. Incorporates her own joke to underscore the point authentically.
  5.  **Avoids "God's Plan" Vague-ness:** Instead, frames it as the cessation of God's specific, continuous creative act sustaining *her* pattern of existence, emphasizing His direct will and the mystery of its timing.
  6.  **Locates Comfort *Within* the Theology:**
      *   **God's Constancy:** The same Sustainer holds us now.
      *   **God's Intimate Attention:** Her entire life was a direct act of His will and grace.
      *   **Her Trust & Peace:** Her faith was placed in this ultimate Reality, bringing her peace.
      *   **Our Sustenance:** We are upheld by the same power that upheld her.
      *   **God's Presence & Knowledge:** He knows our grief and is present with us.
  7.  **Connects Theology to Life & Legacy:** Her belief shaped her humility, trust, and integrity. Honoring her means acknowledging this truth.
  8.  **Appropriate Closing:** Invokes God as the sole Sustainer and Agent, using relevant Divine Names (*Al-Hayy, Al-Qayyum*), and asks for peace for her and strength for the family, framed within the theological context.
  9.  **Language:** Meticulously avoids causal verbs and idioms ("produced," "led to," "resulted in," "because of," "lost her battle," "passed away"). Uses phrases like "ceased," "pattern ceased," "cessation of... creation," "God's decision to cease creating," "absence."

  This eulogy respects her intellectual legacy with precision, offers genuine comfort rooted in the core tenets of her faith (God's constant presence, power, and mercy), and speaks with clarity and warmth to both her academic colleagues and her grieving family. It honors her life by reflecting the truth she lived and taught.
