  (4) Owen: He correctly notes that the theorem does not require harmonizing priors. Reasonable people can have different priors without being irrational. This is true because priors can reflect different background knowledge or experiences. The theorem does not require that priors be the same; it only says that if they are the same and the other conditions hold, then posteriors must be the same. So, he is right about the theorem.

  Score: 2 (clearly right)

  (5) Nadia: She argues that if we allow any disagreement to be attributed to differing priors, then the theorem becomes toothless. This is a practical concern. It is true that in practice, without a common prior, the theorem doesn't force agreement. But that's the point: the theorem is an idealization. However, she is right that the philosophical interest of the theorem is in showing that common knowledge and rationality alone (with common prior) force agreement. Without the common prior, the theorem doesn't apply. So, she is pointing out a limitation in the application of the theorem. But note: the theorem is not toothless in its intended context (common prior). It does show that under the common prior assumption, common knowledge of posteriors forces agreement. But in real life, we often lack common priors. So, her point is valid about the practical limitations.

  Score: 1 (she has a point, but it doesn't make the theorem toothless; it just means the theorem's conditions are not always met)

  (6) Owen: He concedes that the theorem has limits in real non-ideal settings and says that the limit is due to the idealized assumptions (like common prior) and that he is using the theorem correctly. This is a fair statement. The theorem is based on idealized assumptions. He is correct that without the common prior, the theorem doesn't force agreement. So, he is right.

  Score: 2 (clearly right)

  Now, let's summarize the scores:

  1: -1 (Nadia overstates the theorem by ignoring the common prior condition)
  2: 2 (Owen correctly points out the common prior requirement)
  3: 0 (Nadia makes a normative point beyond the theorem, not directly supported by it)
  4: 2 (Owen correctly notes that the theorem doesn't require harmonizing priors)
  5: 1 (Nadia has a point about practical limitations, but the theorem still holds in its idealization)
  6: 2 (Owen correctly identifies the limit as due to the idealized assumptions)

  But wait, let me reconsider (1). Is it really -1? She says: "Aumann's theorem shows they cannot rationally go on disagreeing". Without the common prior, the theorem does not apply. So, she is wrong to assert that the theorem forces agreement without having established a common prior. Hence, it is a mistake. We can give it -1.

  For (3), Nadia is trying to push the idea that if the priors are arbitrary, then they should be revised. But note that the theorem does not address this. So, while it might be a reasonable principle, it is not part of Aumann's theorem. Hence, we score it 0.

  For (5), Nadia is correct that in practice, people can always appeal to different priors to avoid agreement. But that doesn't make the theorem toothless; it just means that the theorem's conditions are not always satisfied. The theorem is still important because it shows that if we assume common priors (which might be justified in some contexts), then disagreement cannot persist under common knowledge. So, her point is partially valid but doesn't undermine the theorem. We give 1.

  What are both overlooking?

  Both are overlooking that the common prior assumption in Aumann's theorem is a very strong one. In reality, it is difficult to establish that two people have a common prior. Moreover, the common prior might be interpreted as a prior over the entire state space, which includes all possible evidence. But in practice, individuals have different life experiences and might have updated from different initial priors (which might not be common). Also, note that the theorem requires that the entire information structure (the partitions) be common knowledge, which is also a strong assumption.

