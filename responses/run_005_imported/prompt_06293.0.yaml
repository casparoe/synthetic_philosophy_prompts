  But the current-membership is actually breaking the circularity by fiat: it just starts with a given demos. So in a way, it breaks the circularity by stopping the regress. However, it does so without justification. So it breaks the circularity in a practical sense but not normatively. The question is about escaping the circularity, meaning providing a non-circular justification.

  I think the all-subjected principle is the most theoretically sound for breaking the circularity.

  Final tier list:

  S: ["all-subjected/coercion principle"]  
  A: ["national self-determination"]  
