  First, I need to break down Sidgwick's main points. He's challenging Hume's assertion that miracles are contrary to experience and testimony can be false. Sidgwick says "contrary to experience" is ambiguous—it could mean violating natural laws or just being unprecedented. He argues that unprecedented events aren't impossible, just novel, and we can't quantify how improbable they are because we don't know what we don't know about the universe.

  The user is asking if exposing this ambiguity refutes Hume or just relocates the problem. Also, they question whether Sidgwick's admission that we can't specify the rate of improbability growth undermines his call for evidence-gathering. And they want to know if this holds against modern Bayesians.

  I should consider Bayesian probability here. Bayes' Theorem incorporates prior probabilities, which align with Hume's need for strong priors against miracles. But Sidgwick's point about the unknown unknowns challenges how we set those priors. If we can't know the scope of what's possible, our priors might be biased. Bayesians would require evidence strong enough to overcome low priors, but Sidgwick argues that without knowing the true improbability, we should stay open-minded.

  The user's deeper concern might be about the objectivity of evidence standards. They might be wrestling with how to fairly evaluate claims without letting preconceptions dictate. Sidgwick's position emphasizes epistemic humility: since we can't quantify the improbability of the novel, we should systematically gather evidence instead of dismissing claims outright.

  Also, the user mentions the Society for Psychical Research, so context matters. Sidgwick was advocating for investigating paranormal claims without prejudice. His argument supports methodological openness, which doesn't require exact probabilities but a commitment to empirical investigation despite uncertainty.

  In a modern context, Bayesians might counter that priors are based on current knowledge, and extraordinary evidence is needed to update them. But Sidgwick's critique highlights that if our knowledge is incomplete, our priors could be flawed. Thus, extraordinary evidence is relative to the claim's novelty and our epistemic limitations.

  So, Sidgwick's argument doesn't refute Hume entirely but shows that dismissing claims based solely on existing experience is premature. His call for evidence-gathering remains valid as it doesn't demand exact probabilities but acknowledges that without them, we must remain open to investigation. This stance still challenges modern skeptics by emphasizing humility and the potential for new discoveries beyond current paradigms.
answer: |-
  Here's a reconstruction of Sidgwick's argument, its critique of Hume, and its implications for evidence-gathering and modern skepticism:

  **Reconstructing Sidgwick's Argument:**

  1.  **The Core Dilemma:** Evaluating testimony for a "marvel" (extraordinary claim) requires weighing two opposing improbabilities:
      *   *Improbability A:* That the marvel actually occurred (given its novelty/inconsistency with current understanding).
      *   *Improbability B:* That the *testimony* for the marvel is false or mistaken (which, if it weren't improbable, wouldn't constitute evidence).
  2.  **The Problem of Incommensurability:** These improbabilities are fundamentally different kinds ("quite diverse"). We lack an objective, calibrated scale ("no intellectual scales") to weigh them precisely against each other.
  3.  **Critique of Hume's "Contrary to Experience":** Sidgwick targets Hume's core premise:
      *   **Ambiguity Exposed:** Hume uses "contrary to experience" to imply a near-certainty that the marvel *didn't* happen (Improbability A is overwhelming). Sidgwick argues this phrase is ambiguous:
          *   **Strong Sense:** Logically inconsistent with established natural laws (truly impossible).
          *   **Weak Sense:** Merely unprecedented or "unlike previous experience" (novel and strange, but *not* proven impossible).
      *   **Hume's Error:** Sidgwick contends Hume conflates the strong sense (impossibility) with the weak sense (unprecedented novelty). Hume's argument assumes the marvel *is* impossible ("contrary to experience" = violation of law), when it might only be highly novel ("contrary to experience" = unprecedented).
  4.  **The Novelty ≠ Impossibility Argument:** Human history is full of events initially deemed "contrary to experience" (weak sense) that later became familiar (e.g., magnetism, electricity, germs, relativity). Therefore, encountering something entirely novel is *not impossible* for the human race; it's merely *improbable* to an unknown degree.
  5.  **The Epistemic Humility Conclusion:** This leads to Sidgwick's crucial concession:
      *   A claim's increasing novelty *does* increase its inherent improbability (Improbability A grows).
      *   **However, the critical point:** We have *no way* to quantify this improbability ("estimate with anything like exactness") or determine *how fast* it grows ("at what rate the improbability grows").
      *   **Why?** To quantify the improbability of the novel, we would need to know the ratio of the known universe to the unknown universe ("the proportion that what we do know... bears to what we do not know"). This ratio is fundamentally unknowable.

  **Addressing Your Specific Questions:**

  1.  **Does exposing the ambiguity refute Hume or just relocate the problem?**
      *   **Refutes Hume's *Formulation*:** Sidgwick successfully shows that Hume's argument, as commonly stated ("contrary to experience"), relies on an equivocation between logical impossibility and mere unprecedented novelty. It undermines Hume's claim that the improbability of the marvel *necessarily* outweighs the improbability of false testimony *simply because* it's "contrary to experience" in the weak sense.
      *   **Relocates the Problem:** However, Sidgwick readily concedes that unprecedented novelty *does* create significant prior improbability (Improbability A). He hasn't eliminated the problem; he's reframed it. The core difficulty of weighing Improbability A (now understood as stemming from novelty, not necessarily logical impossibility) against Improbability B (false testimony) remains. He's shown Hume's *justification* for assigning an overwhelming prior is flawed, but he hasn't provided a new way to *quantify* that prior.

  2.  **Is Sidgwick's concession fatal to his evidence-gathering policy?**
      *   **No, it's the *Foundation* of it.** Sidgwick's position is one of profound **epistemic humility**. Precisely *because* we cannot quantify the prior improbability of the novel ("no one can pretend to lay down at what rate the improbability grows"), we cannot *a priori* dismiss testimony for novel phenomena based solely on their novelty. We lack the knowledge to definitively say, "This is *so* improbable that no testimony could overcome it."
      *   **The Policy Follows:** Therefore, the only rational course is **patient, systematic evidence-gathering** (the SPR's mission). We must investigate, accumulate reports, look for patterns, control for error and fraud, and see if consistent evidence emerges *despite* the inherent prior improbability. The lack of a specifiable rate *demands* this open-minded, empirical approach rather than dogmatic dismissal. His policy doesn't *require* a specifiable rate; it *acknowledges* the lack of one as a reason to investigate.

  3.  **Does Sidgwick's argument hold force against a modern Bayesian skeptic?**
      *   **Yes, significantly, though the framing changes.** A Bayesian would formalize the dilemma using prior probabilities (P(H) for the hypothesis, e.g., telepathy) and the likelihood of the evidence given the hypothesis (P(E|H)) and given no hypothesis (P(E|~H)).
      *   **Sidgwick's Point Translated:** His argument directly challenges how we set the **prior probability P(H)** for a truly novel claim.
          *   **Critique of Dogmatic Priors:** He argues against setting P(H) arbitrarily close to zero *simply because* the claim is unprecedented (Hume's move). This is the "smuggling in priors" concern you raised.
          *   **Argument for Humble Priors:** He insists that while P(H) for a novel claim *is* low, we cannot *know* *how* low ("no specifiable rate"). Our ignorance of the unknown universe means our estimate of P(H) is fundamentally uncertain and potentially biased by current limited knowledge. We cannot justify setting P(H) = 10^-100 based on current science if that science might be incomplete in ways we can't fathom.
          *   **Focus on Likelihoods & Evidence:** Therefore, the Bayesian skeptic must focus on the *strength* of the evidence E:
              *   How high is P(E|H) (probability of this testimony if telepathy is real)?
              *   How low is P(E|~H) (probability of this testimony arising if telepathy is *not* real - encompassing error, fraud, coincidence)?
          *   **The Demand for "Extraordinary Evidence":** Sidgwick *agrees* that for a claim with a very low prior P(H) (due to novelty), the evidence E needs to be such that the likelihood ratio [P(E|H) / P(E|~H)] is *extremely high* to yield a plausible posterior probability P(H|E). This *is* the "extraordinary evidence" requirement.
          *   **Sidgwick's Enduring Force:** His crucial point is that **we cannot know *a priori* how high that likelihood ratio needs to be** because we cannot precisely quantify P(H). We cannot say, "We need evidence that's a billion-to-one against chance," because we don't know if the *prior* is a million-to-one or a trillion-to-one against. Therefore:
              *   We must remain open to the *possibility* that sufficiently strong, consistent, and rigorously vetted evidence *could* overcome *any* reasonable prior based on current knowledge.
              *   Dismissing evidence *solely* because the claim is novel, without engaging deeply with the *specific quality* of the evidence (i.e., without seriously evaluating P(E|~H)), is epistemically unjustified. The burden is on the skeptic to show the evidence *isn't* extraordinary, not just to assert the claim is too novel.
              *   Systematic evidence-gathering (like the SPR's) is the *only* way to amass the data needed to rigorously assess P(E|~H) for complex phenomena and potentially produce evidence strong enough to challenge low priors.

  **Conclusion:**

  Sidgwick successfully exposes a critical ambiguity in Hume's "contrary to experience" argument, showing it conflates impossibility with mere unprecedentedness. While this reframes rather than completely eliminates the core problem of weighing prior improbability against testimony, Sidgwick's key insight is one of **epistemic humility in the face of the unknown**. His concession that we cannot quantify the growth of improbability with novelty is *not* fatal to evidence-gathering; it is the very *reason* for it. Against a modern Bayesian skeptic, Sidgwick's argument retains significant force by challenging the justification for dogmatically low priors against the novel and emphasizing that the *quality* and *accumulation* of evidence must be the ultimate arbiter, precisely because we cannot definitively pre-judge the magnitude of the prior. It shifts the burden onto the skeptic to demonstrate why the *specific evidence* isn't sufficiently extraordinary, rather than resting solely on the claim's novelty.
