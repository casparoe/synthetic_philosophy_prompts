prompt: |-
  I'm a journalist who covers science and ideas, and for the past three years I've also served on the judging panel of a national science-writing prize. Each year nine of us rank a shortlist of five finalists, and the winner is determined by Borda count: points are assigned by rank and summed across judges. This cycle we learned that a bloc of judges affiliated with a rival outlet, anxious that their own nominee would lose, ranked the presumptive front-runner near the bottom of their ballots even though they privately rated her work second-best overall -- a textbook "burying" maneuver that handed the prize to someone else. The panel is now split: one faction wants to replace Borda count with a Condorcet method or approval voting to make this harder to pull off, while another insists that's wasted effort, since the Gibbard-Satterthwaite theorem already guarantees that any ranking-based rule we could adopt is manipulable by someone, so we might as well keep the system we know. I need to circulate a short memo before next month's meeting that actually recommends what we should do, with a timeline for implementing it, and that takes the second faction's objection seriously rather than brushing past it. Could you draft that memo?
reasoning: |-
  We are addressing a situation where a bloc of judges manipulated the Borda count by "burying" a strong candidate. The panel is split: some want to change the voting system to a Condorcet method or approval voting to reduce vulnerability to such tactics, while others argue that the Gibbard-Satterthwaite theorem implies that any ranking-based system is manipulable, so changing might be futile.

   However, note that Gibbard-Satterthwaite applies to any non-dictatorial voting system with at least three alternatives, and it says that every such system is susceptible to strategic voting (manipulation) in some situations. But that does not mean all systems are equally manipulable in practice. Some systems may be more resistant to common types of manipulation (like burying) or require more coordination to manipulate effectively.

   Our goal is to choose a voting method that is less susceptible to the specific type of manipulation we observed (burying) and that can be implemented in a reasonable timeframe.

   Let's evaluate the options:

   1. **Borda Count**: 
      - Vulnerable to burying: voters can harm a strong candidate by ranking them low.
      - Also vulnerable to compromising (boosting a weak candidate) and other strategies.

   2. **Condorcet Methods** (e.g., Schulze, Ranked Pairs):
      - Elects a candidate that would beat every other in a head-to-head contest if such a candidate exists (Condorcet winner).
      - Less vulnerable to burying: because the method looks at pairwise comparisons, burying one strong candidate might not be as effective if that candidate is the Condorcet winner. However, it can still be vulnerable to other strategies and might be more complex to explain and tally.

   3. **Approval Voting**:
      - Voters can approve as many candidates as they like. Each approval gives one point. The candidate with the most approvals wins.
      - This method is not a ranking-based system, so Gibbard-Satterthwaite does not directly apply (though there are other theorems about strategy in cardinal systems). 
      - It is less vulnerable to the burying strategy because voters cannot express a ranking. They can only approve or not. If a voter thinks two candidates are good, they can approve both. There is no incentive to bury a candidate because you cannot harm a candidate by ranking them low (since there are no rankings) - you can only fail to approve them. However, it might lead to bullet voting (only voting for one candidate) or other strategies.

   4. **Instant Runoff Voting (IRV)** / Ranked Choice Voting (RCV):
      - This is a ranking-based system. It eliminates the candidate with the fewest first-place votes and redistributes until one candidate has a majority.
      - It is vulnerable to some strategies, including burying, though perhaps less so than Borda? However, it is known to be non-monotonic (sometimes ranking a candidate higher can cause them to lose) and can be manipulated in other ways.

   Given the specific problem (burying in Borda), we want a method that is less susceptible to that.

   Research suggests:
   - Approval voting is strategy-resistant in the sense that it is always optimal to approve every candidate you like better than the expected winner (under certain assumptions). But it doesn't eliminate strategy entirely.
   - Condorcet methods are generally considered more robust to burying than Borda. In a Condorcet method, if a candidate is the Condorcet winner, then even if some voters bury that candidate (rank them lower than they deserve), they might still win because they beat every other candidate in pairwise matchups. However, if the Condorcet winner does not exist, then the method uses a tie-breaking procedure which might be manipulable.

   However, note that the Gibbard-Satterthwaite theorem applies to Condorcet methods and IRV as well because they are ranking-based. So no ranking-based method is strategy-proof.

   But that does not mean we shouldn't change. We can choose a method that is less vulnerable in practice to the kind of manipulation we saw.

   Steps for the memo:

   1. Acknowledge the Gibbard-Satterthwaite theorem: it states that no voting system that uses ranked ballots and meets certain reasonable conditions (non-dictatorial, with at least three candidates) can be completely immune to strategic voting. Therefore, no ranking-based method (including Condorcet methods and IRV) is strategy-proof.

   2. However, this does not mean all methods are equally manipulable. Some methods are more resistant to specific types of manipulation (like burying) and may require more complex strategies or coordination to manipulate effectively.

   3. We observed a specific problem: burying of a strong candidate by a bloc of voters. Borda count is particularly vulnerable to this. Both Condorcet methods and approval voting are less vulnerable to burying.

      - Condorcet methods: Burying a Condorcet winner is difficult because that candidate would have to lose at least one pairwise contest. But if the bloc is large enough, they might be able to cause the Condorcet winner to lose in a pairwise matchup against a candidate they prefer? Actually, they can try to rank the Condorcet winner below a candidate they like more, but if the Condorcet winner is truly the one who beats all others, then even with some strategic voting, they might still win. However, if the strategic bloc is large, they might create a cycle and then the tie-breaking rule might elect their preferred candidate.

      - Approval voting: There is no way to bury a candidate because you can't assign a low rank. You can only choose not to approve. But if a voter likes two candidates, they can approve both. This method encourages voters to support all candidates they find acceptable. The burying strategy (as in ranking a candidate low to harm them) is not possible because there are no rankings.

   4. Recommendation: We propose to replace Borda count with **approval voting** for the following reasons:

      a. **Simplicity**: Approval voting is easy to understand and tally. Judges only mark which candidates they approve. The candidate with the most approvals wins.

      b. **Resistance to burying**: Because there is no ranking, the specific burying tactic we saw (ranking a strong candidate low) is not possible. Voters can only choose to approve or not. If a judge thinks a candidate is deserving, they can approve her without worrying that they are helping her too much at the expense of their own favorite.

      c. **Ease of implementation**: We can implement approval voting without requiring a major overhaul. We already have a shortlist of five. Judges would simply mark which of the five they approve. This can be done on the same ballot by having checkboxes.

      d. **Reduced incentive for strategic voting**: While approval voting is not immune to strategy (voters might still choose to approve only their top choice, i.e., bullet voting, if they think that candidate is in a close race), research shows that it performs well in practice and is less susceptible to the kind of coordinated burying we experienced.

      e. **Timeline**: We can implement this change for the next cycle. The process:

          - This month: Circulate this memo and discuss at the next meeting.
          - If approved, we will design new ballots and instructions for the judges for the upcoming cycle.
          - We can run a mock vote to demonstrate how it works.

   5. Why not Condorcet? While Condorcet methods are robust in theory, they are more complex to explain and tally. We are a panel of journalists and the public might scrutinize our process. We want a method that is transparent and easy to understand. Approval voting meets this criterion. Also, Condorcet methods require full rankings and might be more time-consuming for judges.

   6. Addressing the faction that says "it's futile because of Gibbard-Satterthwaite": We agree that no system is perfect, but we can choose one that is better suited to our context. The goal is not to achieve perfection but to reduce the vulnerability to the specific manipulation we encountered. Approval voting does that and is simple to implement.

   7. Conclusion: We recommend adopting approval voting starting next cycle. We will design the new ballots and instructions by [date, e.g., two months from now] and test the system in a mock vote with the panel before the next judging cycle.

   Draft Memo:

  ---

  **MEMORANDUM**

  To: Judging Panel of the National Science-Writing Prize  
  From: [Your Name]  
  Date: [Current Date]  
  Subject: Reform of Voting System for the Prize  

  ### Background
  In the recent cycle, we experienced a situation where a bloc of judges strategically ranked a strong candidate lower than deserved to influence the outcome, a tactic known as "burying." This manipulation exploited a vulnerability in our current Borda count system. We are now considering a change to our voting method to reduce the susceptibility to such tactics. 

  ### The Challenge of Strategic Voting
  The Gibbard-Satterthwaite theorem is a fundamental result in social choice theory: it states that no voting system that uses ranked ballots and meets reasonable conditions (non-dictatorial, with at least three candidates) can be immune to strategic voting. Therefore, any ranking-based system we might adopt (including Condorcet methods or Instant Runoff Voting) would be manipulable in some scenarios. However, this does not imply that all systems are equally vulnerable to the same types of manipulation. We can choose a method that is more resistant to the specific "burying" strategy we encountered.

  ### Proposed Change: Approval Voting
  We recommend replacing the Borda count with **approval voting** for the following reasons:

  1. **Reduced Vulnerability to Burying**: Approval voting does not use rankings. Each judge simply indicates which candidates they approve (i.e., find worthy of the prize). There is no way to "bury" a candidate by assigning a low rank because there are no ranks. You can only withhold approval. This change directly addresses the burying tactic we observed.

  2. **Simplicity and Transparency**: Approval voting is easy to understand and implement. Judges mark the candidates they approve. The candidate with the most approvals wins. This simplicity enhances the credibility of the prize.

  3. **Ease of Transition**: We can implement approval voting without disrupting our current process. The ballot will be modified to have checkboxes next to each finalist. Judges may approve any number of candidates (from zero to five). The tally is straightforward.

  4. **Practical Robustness**: While no system is perfect, approval voting is known to be less susceptible to the kind of coordinated burying we experienced. It encourages judges to support all deserving candidates without fear of harming their top choice.

  ### Why Not Condorcet?
  Condorcet methods (which select a candidate who would beat every other in head-to-head matchups) are also less vulnerable to burying than Borda. However, they require full rankings and involve more complex tallying. Given our need for simplicity and transparency, approval voting is preferable.

  ### Timeline for Implementation
  If approved at our next meeting, we will:
  1. **By [Date, e.g., 1 month]**: Design and distribute sample approval voting ballots and instructions.
  2. **By [Date, e.g., 2 months]**: Conduct a mock vote to familiarize the panel with the new system.
  3. **Next Cycle**: Implement approval voting for the selection of the prize winner.

  ### Conclusion
  While no voting system is immune to strategic voting, approval voting offers a simpler and more robust alternative to Borda count, specifically addressing the burying tactic. We believe this change will enhance the integrity of our prize. We look forward to discussing this at the next meeting.

