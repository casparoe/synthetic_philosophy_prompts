  *checks social psych frameworks* Self-perception theory fits here - they inferred their attitude from their own behavior (deliberate positive focus). But the key is they only engaged in that behavior due to extrinsic incentives. That origin taints the autonomy of the attitude change, even if current sincerity is real. 

