  Here's a tight, technically-rooted joke for the insufferable Bayesian:

  **Bayesian** (Raising glass, smirking):  
  "Here's to frequentists... the only ones who need *twenty* failed replications to update their beliefs."  

  **Frequentist** (Stony-faced):  
  "...That's not how p-values work."  

  **Bayesian** (Sipping drink):  
  "Exactly. Must have started with a *hell* of a prior."  

  ---

  ### Why it works:
  1. **Technical Punchline**:  
     - Mocks the frequentist reliance on *p*-values (which don’t formally update beliefs) vs. Bayesian updating (where **priors** shape posterior beliefs).  
     - The "twenty replications" nods to replication crisis meta-analyses (e.g., Ioannidis’ work) where many studies fail only after repeated attempts.  

  2. **Frequentist Silence**:  
     - The frequentist’s literal correction ("not how p-values work") highlights their rigid framework, making the Bayesian’s jab land harder.  
     - The Bayesian’s final line implies their overconfident prior (e.g., treating *p*<0.05 as "true") caused the crisis.  

  3. **Insufferable Vibe**:  
     - The Bayesian smugly twists the knife by using *Bayesian terms* ("update," "prior") to explain the frequentist’s failure.  

  **Bonus**: Stats nerds will chuckle; frequentists will shift uncomfortably. Perfect for a bar-snark scene.
