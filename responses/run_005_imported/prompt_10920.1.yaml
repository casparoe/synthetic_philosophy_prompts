  Ok so I'm working on a piece about paraconsistent logic and I keep runing into this claim -- mostly traced back to Graham Priest and Jay Garfield -- that Nagarjuna's tetralemma in the Mulamadhyamakakarika is basically an ancient dialetheist move: that stuff like "nirvana and samsara aren't ultimately different," or the fourfold denial about whether the tathagata exists after death, are meant to be genuine true contradictions, not just rhetorical flourish. But then other scholars (Tillemans, Siderits, that crowd) say thats a misreading, and that all four horns can be denied without ever actually violating noncontradiction -- something to do with the negations being "non-implicative" rather than a straightforward logical NOT. Can you unpack the technical crux of that disagreement for me? Like, what specific move in Nagarjuna's argument is each side hanging their reading on. And where does the two-truths business (conventional vs ultimate) fit in here -- is it what generates the apparent contradiction in the first place, or is it what's supposed to dissolve it?
