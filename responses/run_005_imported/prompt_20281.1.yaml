  Finally, ensure the argument serves the story. It should create tension—nobles are frustrated, the friar is compassionate but rigid. This could lead to plot developments: maybe they proceed without blessing, causing chaos. The friar’s stance might later seem prophetic or tragically wrong. The user needs this scene to hinge on credible theology that influences character decisions.
answer: |-
  Here’s a compelling argument the Dominican friar could make, grounded in Aquinas’s actual principles and addressing the tension with the *Sentences* commentary head-on. It combines theological precision with pastoral gravity, suitable for a confessional setting:

  **Friar’s Argument (spoken with quiet intensity, perhaps pacing the dim cell):**

  "My son, you come seeking absolution for an act not yet committed, confident the Angelic Doctor will provide your shield. You recall Saint Thomas’s words on tyranny – but recall them *selectively*, like a man grasping only the hilt of a sword and ignoring its blade. Let us examine his teaching with the care it demands, not the haste of desperate men.

  **First, the Nature of Authority:** God alone is the source of all just power. The Duke, however corrupted his exercise, holds his *authority* by right of inheritance, established and recognized. Saint Thomas, in *De Regimine Principum*, is profoundly clear: *"If to provide itself with a king belongs to the right of a given multitude, it is not unjust that the king be deposed or have his power restricted by that same multitude if, becoming a tyrant, he abuses the royal power."* Note the crucial actor: **the multitude**, the community itself, acting through its established right. Not a handful of aggrieved nobles acting in secret. You are not *that* multitude. You are a faction, acting privately. For private individuals to usurp this judgment and execution is not liberation; it is the sin of usurpation, replacing one tyranny with the chaos of many. It rends the very fabric of ordered society, which Thomas holds sacred. What checks *your* power after the deed is done? Who anoints *your* judgment as supreme?

  **Second, The Bar of Tyranny and the Danger of Private Judgment:** You say the Duke is vicious, cruel, a tyrant. Granting this grievous truth for argument's sake – does that *automatically* sanction any man's dagger? Thomas, ever the careful logician, fears precisely this rush to bloody judgment. In the *Summa Theologica* (II-II, Q. 42, A. 2), discussing sedition, he warns that even against a tyrant, *unless the tyrant's rule is disturbed so inordinately, that his subjects suffer greater harm from the consequent disturbance than from the tyrant's rule*... action may be worse than inaction. Have you exhausted *all* licit means? Have cries of injustice echoed through the streets? Has a Council of the Estates, representing the *communitas*, formally denounced him and sought redress? Or is your judgment born of private grievance – lands seized, influence lost? Private men, inflamed by personal wrongs, are perilously poor judges of the common good. Thomas’s caution in *De Regimine* stems from this fear: the road to anarchy is paved with the self-righteous daggers of those convinced *their* cause alone is just.

  **Third, Addressing the *Sentences* Commentary – The Crucial Distinction:** I see the objection forming in your eyes. You recall, or have heard, that in his commentary on the *Sentences* (II, Dist. 44, Q. 2, A. 2), Thomas writes: *"If a man, without any public authority, kills an evildoer, he does not sin if he does it to free his country; indeed he deserves praise..."* and specifically mentions *"when there is no superior to whom recourse can be had against the tyrant."* This seems your warrant. But you rip it from its context and ignore Thomas’s own meticulous distinctions!

  1.  **"To free his country":** This implies an act undertaken *for* and *representative of* the common good of the *patria*, the homeland itself. It is not an act of private vengeance or factional ambition. Are you acting solely for the liberation of *all* the people, or to redress wrongs done to *your* circle? Does the *populus* cry out for this blood, or are you its self-appointed saviors? Thomas envisions a liberator, not conspirators in shadowed rooms.
  2.  **The Implied Mandate & Absence of Recourse:** The key phrase is *"when there is no superior."* But Thomas, especially in *De Regimine*, insists that *the community itself* is the original source of authority beneath God. The "superior" recourse, in the absence of an Emperor or Pope, **is the community acting through its legitimate, representative structures.** You bypass this entirely! You have not convened the Estates. You have not sought a public declaration of the Duke’s tyranny from the civic bodies – the guilds, the councils, the representatives of the townsfolk. You have not *demonstrated* that the *multitude* desires this violent remedy and authorizes your action as its instrument. You act *instead* of the community, not *for* it in any demonstrably mandated way. The *Sentences* passage cannot be read as a blanket license for any private citizen with a grievance to become an assassin whenever a higher temporal ruler is absent. It points to an extreme, last-resort action taken *by* or *with the overwhelming mandate of* the oppressed community itself, when *all* representative avenues are utterly barred – a state you have not proven exists because you have not attempted them! To invoke it for your secret plot is a profound misreading, turning Thomas's careful exception into a dangerous norm he explicitly warned against elsewhere.

  **Fourth, The Fruits of Your Action:** Consider the consequences Thomas himself feared. What follows the Duke’s blood on your hands? Will the people hail you as liberators, or will rival factions seize the chaos to plunge the principality into civil war? Will the strong simply crush the weak anew? Will foreign powers, seeing instability, invade? Thomas’s fear was always that the cure – private tyrannicide – would be worse than the disease, destroying the very peace and order authority exists to maintain. Your act, done without the sanction and visible support of the community, risks precisely this. It becomes not liberation, but the seed of greater desolation.

  **Therefore, my son, I cannot bless this path.** Not because the Duke is innocent – God sees his sins, and they are grave. Not because tyranny is tolerable – Thomas rightly condemns it. But because *your chosen means* violate the very principles of order, justice, and communal action that Saint Thomas Aquinas, in his profound wisdom, laid down to prevent society from collapsing into a cycle of violence and vengeance. To kill him thus would be murder cloaked in false piety, a sin against God and the commonwealth you claim to love.

  **Seek another way.** Rally the Estates. Demand public accountings. Petition openly. Let the *voice of the community* be heard so loudly that resistance becomes its undeniable will. *Then*, and only then, if all licit avenues are truly barred and the community's mandate is clear, might the terrible necessity Thomas described in his commentary *possibly* arise. But that is not where you stand today. Your conspiracy is not that mandate. Put aside the dagger. Seek the harder, truer path of building the public justice Thomas commands."

  **Why this works for your scene:**

  1.  **Grounded in Aquinas:** It directly engages with the key texts (*De Regimine*, *Summa*, *Sentences* Commentary) and reconciles the apparent contradiction by emphasizing the *community mandate* as the crucial factor missing from the nobles' plot, which is central to Aquinas's thought in *De Regimine*.
  2.  **Addresses the "Tyrant-Slayer" Quote Head-On:** It doesn't ignore the *Sentences* passage; it tackles it directly, arguing that the conspirators fail to meet its implied conditions (acting *for* the country with its implied mandate, *after* exhausting recourse to the community itself as the relevant "superior").
  3.  **Focuses on "Standing":** The core argument is precisely about who has the *right* or *authority* to judge and execute a tyrant. The friar systematically argues that private individuals/nobles acting secretly lack this standing under Aquinas's principles, which reserve it for the community/public authority.
  4.  **Consequentialist Element:** It incorporates Aquinas's practical fear (echoed in *De Regimine*) that private tyrannicide leads to worse outcomes (anarchy, civil war), strengthening the argument against the *prudence* and *justice* of their specific plot.
  5.  **Pastoral & Dramatic:** It's spoken as a confessor's warning, mixing theological argument with concern for souls and the common good. It offers an alternative (building public, communal resistance), showing the friar isn't defending the Duke but upholding a higher principle. This creates tension – the nobles want a quick fix; the friar demands the harder, more righteous path.
  6.  **Serves Your Plot:** This refusal, grounded in deep principle, forces the conspirators to make a crucial choice: heed the warning and change tactics (more interesting political maneuvering?), proceed without spiritual sanction (adding moral weight and potential for guilt/error), or seek a more pliable confessor (highlighting their moral compromise). It deepens the ethical and theological stakes of the plot.

  This argument gives your friar intellectual credibility and moral weight, turning what could be a simple plot roadblock into a rich moment exploring the complexities of political theology and the burdens of conscience.
