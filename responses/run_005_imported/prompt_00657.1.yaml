answer: |-
  You've zeroed in on a profound and valid tension in Dummett's argument – one that exposes a critical gap between his foundational premises and the broader conclusion he (and his readers) seem to draw. Let's rigorously defend the position that Dummett's stated core principles only justify an expanded *need-based* asylum right, not a general presumption for free entry, and confront the "vanishing difference" objection head-on.

  **The Argument: Dummett's Premises Only Support an Expanded Asylum Right**

  1.  **The Foundation is Deficiency-Triggered:** Dummett explicitly grounds the right to asylum in the *absence* of minimal conditions for a decent life as a "first-class citizen." He states: "every adult has a right to live somewhere as a full, self-governing 'first-class citizen,' under at least the minimal conditions for a decent human life" and that asylum is the remedy when this right is denied *in their current location*. The core moral imperative is **remedial** – it responds to a specific, severe harm or deprivation. The right *switches on* only when this fundamental deficiency exists.
  2.  **The Duty of Non-Complicity Flows from the Deficiency:** The receiving state's duty to admit arises specifically because *denying refuge perpetuates the harm* that constitutes the deficiency. By refusing entry, the receiving state becomes "complicit in the injustice" *of denying the individual that minimal decent life*. This complicity argument is parasitic on the *existence* of the initial deficiency and the state's refusal to remedy it. There is no analogous "complicity in injustice" when refusing entry to someone *already* enjoying a decent, self-governing life elsewhere. Denying them entry doesn't render them destitute, persecuted, or disenfranchised; it simply denies them a preference.
  3.  **The Scope of "Refugee" Expansion is Still Need-Defined:** Dummett's call to reclassify "mere" economic migrants as refugees is explicitly tied to those escaping *"inescapable poverty"* severe enough to deny them the minimal conditions for a decent, self-governing life. He doesn't argue that *any* economic migrant seeking marginally better prospects qualifies, but specifically those for whom their home conditions are *intolerably deficient*. This remains firmly within the deficiency-triggered framework.
  4.  **No Foundation for a General Presumption:** The premises outlined above generate a strong obligation *only* towards those suffering the specific deficiency. For individuals not suffering this deficiency (e.g., the skilled worker seeking higher pay, the individual wanting a lifestyle change, the person joining family where separation doesn't constitute a denial of a decent life), Dummett's core argument provides *no direct moral reason* why a state *must* admit them. The foundational right to live *somewhere* decently is already satisfied. The desire to live in a *specific* other place is a different kind of interest – one of preference, opportunity, or affiliation – not grounded in the same fundamental, deficiency-avoiding imperative.
  5.  **The Burden of Justification:** Dummett argues the burden shifts to the *excluding* state *only* because its exclusion directly perpetuates the harm (denial of a decent life) for the deficiency-defined refugee. For the non-deficient migrant, the *initial moral burden* lies with the migrant or the argument for admission to demonstrate why their preference or project *ought* to override the receiving state's presumptive right to control its borders and membership. Dummett's deficiency-based argument doesn't automatically shift this burden for the non-deficient case. The receiving state isn't *complicit* in an injustice against them by default; it's simply exercising a control that may or may not be justified on other grounds.

  **Confronting the "Vanishing Difference" Rejoinder:**

  *   **The Rejoinder Stated:** Given massive global inequality, poverty, weak governance, and conflict, the class of people *genuinely* denied the minimal conditions for a decent, self-governing life is enormous – potentially hundreds of millions, if not billions. Therefore, even if Dummett's logic *only* applies to this group, the practical demand for entry it creates would be so vast as to functionally resemble a general presumption for open borders. The conceptual distinction, while technically valid, becomes practically insignificant.

  *   **Why the Distinction Still Matters Profoundly:**

      1.  **Normative Foundation & Justification:** The *reason* for the overwhelming demand matters ethically. A state overwhelmed by refugees fleeing objectively intolerable conditions faces a crisis demanding an urgent, justice-based response grounded in remedying fundamental harms and avoiding complicity. A state overwhelmed by individuals seeking better opportunities faces a different kind of challenge, involving distributive justice, societal capacity, and competing claims about the value of national communities or cultural cohesion. The justification for the *scale* of entry, and the potential limits to be imposed, draw on different ethical resources. Dummett's argument provides a uniquely powerful, non-negotiable foundation *only* for the first group.
      2.  **Defining the Core Obligation:** The distinction identifies the *non-negotiable core* of the right to migrate. Dummett's argument establishes that denying refuge to those escaping deficiency is a profound *injustice*, akin to complicity in their suffering. Denying entry to the non-deficient migrant might be unwise, ungenerous, or even unfair in specific contexts, but it doesn't carry the same inherent weight of *fundamental injustice* derived from perpetuating severe harm. This distinction is crucial for prioritizing claims and allocating scarce resources (like asylum slots).
      3.  **Policy Design & Implementation:** Recognizing the distinction shapes *how* admission systems are designed. A system based on remedying deficiency requires mechanisms for assessing the severity and inescapability of harm in the country of origin, vulnerability, and immediate need. A system based on a general presumption might prioritize different criteria, like skills, family ties, or lottery systems. Conflating the two can lead to misapplied criteria and potentially weaken the protection for the most vulnerable by diluting the urgency of their claims within a larger pool driven by diverse motivations.
      4.  **The Limits of Complicity:** The "vanishing difference" argument implicitly suggests that admitting *everyone* is the only way for wealthy states to avoid complicity in global injustice. But Dummett's complicity argument, as constructed from his premises, is *individual-specific* and *deficiency-triggered*. A state avoids complicity towards *individual A* by admitting *individual A* (or providing equivalent remedy) when *A* faces deficiency. It doesn't automatically follow that the state is complicit in global injustice *in general* by not admitting *everyone* who *might* be better off, unless it can be shown that admission is the *only* or *primary* way to remedy the *specific deficiencies* of *each individual*. Broader duties to address global poverty or bad governance might exist, but they are distinct from the specific, individual complicity argument Dummett makes for asylum, and they may be fulfilled through means other than mass migration (e.g., development aid, fair trade, diplomatic pressure).
      5.  **Conceptual Clarity and Slippery Slopes:** Maintaining the distinction prevents the conceptual inflation of "refugee" or "asylum right" to the point of meaninglessness. If *any* desire to migrate triggers a presumption of admission (defeated only narrowly), the powerful, specific moral force of the asylum concept – tied to flight from existential threat or intolerable deprivation – is diluted. This risks undermining the unique protection asylum offers and potentially fuels backlash against *all* migration.
      6.  **The Non-Vanishing Minority:** Even in a world of vast inequality, there *are* individuals (e.g., from stable, middle-income democracies) who migrate purely for preference, opportunity, or affiliation, not deficiency. Dummett's argument provides *no* grounds for a state being *obligated* to admit them. Their claims must stand or fall on different ethical arguments (e.g., freedom of movement, associative freedoms, cosmopolitanism) that Dummett does not develop from his core premises.

  **Conclusion:**

  Your suspicion is well-founded. Dummett's powerful argument, grounded in the fundamental right to a minimally decent, self-governing life and the avoidance of complicity in denying it, provides a compelling case for a *dramatically expanded definition of refugee status* encompassing those fleeing severe poverty or political collapse that denies "first-class citizenship." However, it does not, by itself, generate a *general presumption in favor of admitting all immigrants*. The moral force and the burden-shifting mechanism he describes are intrinsically tied to the *remedial* context of escaping a specific, severe *deficiency*.

  While the scale of global deprivation means the *practical scope* of this expanded asylum right could be immense, the *conceptual and normative distinction* from a general open borders position remains crucial. It defines the non-negotiable core of justice-based obligation, shapes how admission systems should prioritize and assess claims, clarifies the limits of the complicity argument, and preserves the unique moral force of the asylum concept. Bridging the gap to a general presumption requires supplementary arguments about freedom of movement, associative rights, or cosmopolitan obligations that Dummett gestures towards rhetorically but does not rigorously derive from his stated foundational premises concerning deficiency and complicity. Your chapter rightly identifies this as a significant, under-examined fissure in an otherwise provocative and important contribution to the ethics of migration.
