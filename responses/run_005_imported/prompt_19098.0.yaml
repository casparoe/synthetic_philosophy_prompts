    3. **Pareto Efficiency:** If every voter prefers X over Y, then the group must prefer X over Y.
    4. **Independence of Irrelevant Alternatives (IIA):** The relative ranking of two alternatives should not be affected by the addition or removal of a third alternative.

  - The theorem applies to systems that produce a complete and transitive ranking of the alternatives from the individual rankings (i.e., ordinal inputs). It does not apply to systems that use cardinal utilities (like approval or score voting) or that do not produce a complete ranking (e.g., single winner without a full ranking).

