  **MEMORANDUM**

  To: Steering Committee  
  From: [Your Name]  
  Date: January [Date], 2024  
  Subject: Recommendation for Voting Method in Cause Area Allocation  

  ## Background
  As you know, our giving circle uses an annual vote to decide the allocation of our pooled discretionary fund among a shortlist of cause areas. Since our founding, we have used instant-runoff voting (IRV). However, the December 2023 vote revealed a significant issue: pandemic preparedness, which gained substantial first-preference support late in the process, was eliminated due to a change in the elimination order, despite having enough support to win under the earlier ballot set. This incident has sparked a debate about the adequacy of IRV and the merits of alternative voting systems.

  The steering committee is now considering a bylaws amendment to change our voting method. This memo reviews the options, addresses the argument that Arrow's impossibility theorem renders any change futile, and recommends a specific path forward.

  ## Analysis of Arrow's Theorem and Its Implications
  Arrow's theorem (1951) proves that no voting system that converts individual rankings of three or more options into a group ranking can satisfy four seemingly reasonable conditions simultaneously: unrestricted domain, non-dictatorship, Pareto efficiency, and independence of irrelevant alternatives (IIA). Since our current system (IRV) and proposed Condorcet methods (e.g., ranked pairs, Schulze) are ranked systems, they are subject to this theorem. 

  A steelmanned version of the "it's all arbitrary" position holds:
  - Because every ranked system must violate at least one of Arrow's conditions, there is no objectively "best" ranked system. 
  - Switching from IRV to another ranked method (such as a Condorcet method) merely trades one flaw for another. For instance:
    - IRV violates IIA (as we observed) and can fail to elect a Condorcet winner.
    - Condorcet methods satisfy the Condorcet criterion (electing a candidate who beats all others in head-to-head matchups) but can also violate IIA and may produce cycles (though methods like Schulze resolve cycles).
  - Therefore, the argument goes, we might as well retain the familiar IRV or even adopt the simplest system, plurality, to avoid complexity.

  However, this position has limitations:
  1. **Not all flaws are equally salient**: While no ranked system is perfect, some flaws are more likely to cause real-world problems than others. The IIA violation in IRV led to a concrete, counterintuitive failure in our recent vote. Condorcet methods, by contrast, are monotonic (a candidate cannot be hurt by gaining support) and better reflect majority preferences when a Condorcet winner exists.
  2. **Cardinal systems escape Arrow's theorem**: Arrow's theorem applies only to systems that input ordinal rankings. Approval voting, which asks voters to indicate which causes they approve of (a cardinal input), is not bound by Arrow's theorem. It can satisfy IIA and Pareto efficiency. Specifically:
     - IIA: The outcome between two causes depends only on their approval counts, which are unaffected by the presence of other causes (though strategic voting might be).
     - Pareto efficiency: If every voter prefers cause X to cause Y, then Y cannot have more approvals than X (since every voter who approves Y must also approve X), so Y cannot win.
  3. **Practical considerations**: Even among ranked systems, some are better suited to our needs. For example, Condorcet methods are more likely to elect broadly acceptable causes, while IRV can favor polarizing ones.

  ## Recommendations
  We recommend **adopting approval voting** for our annual cause area allocation. Under this system:
  - Each voter may approve of any number of cause areas (including none or all).
  - The cause area with the most approvals wins the entire discretionary fund.

  ### Why approval voting?
  - **Escapes Arrow's theorem**: As a cardinal system, it avoids the IIA violations that plagued our IRV vote.
  - **Simplicity**: It is easy for voters to understand and for us to tally manually.
  - **Robustness**: It results in fewer paradoxical outcomes compared to IRV (e.g., gaining support cannot cause a cause to lose).
  - **Expressiveness**: Voters can support multiple causes they find acceptable, which aligns with our giving circle's ethos of supporting effective causes broadly.
  - **Proven track record**: Approval voting is used by organizations like the American Mathematical Society and the Society for Social Choice and Welfare.

  ### Timeline for Adoption
  - **By March 31, 2024**: Draft bylaws amendment and circulate to the committee for feedback.
  - **April 30, 2024**: Committee vote on the amendment (using our current IRV system for this vote).
  - **May–November 2024**: Educate members via email and a dedicated session at our September meetup.
  - **December 2024**: Implement approval voting for the 2024 allocation.

  ## Addressing Counterarguments
  - **"Arrow's theorem makes any system flawed"**: While true for ranked systems, approval voting is not ranked and thus not subject to Arrow's theorem. It satisfies IIA and Pareto efficiency, addressing the specific failure we experienced.
  - **"Condorcet methods are better"**: Condorcet methods are a strong alternative and satisfy the Condorcet criterion. However, they require full rankings and are more complex to tally. Approval voting offers a simpler, more accessible solution without the IIA vulnerability.
  - **"Why not keep IRV?"**: The recent failure demonstrates that IRV can produce outcomes that contradict the will of the majority when preferences shift. Approval voting is less vulnerable to such paradoxes.
  - **"Why not plurality?"**: Plurality is simpler but encourages strategic voting and vote-splitting. It fails to capture the breadth of support that approval voting does.

  ## Conclusion
  No voting system is perfect, but approval voting offers a compelling escape from the ranked-system dilemmas highlighted by Arrow's theorem. It is simple, robust, and aligns with our goals. I urge the committee to adopt it for our 2024 allocation cycle.

  ---
answer: |-
  ### MEMORANDUM  
  **To:** Steering Committee, [Giving Circle Name]  
  **From:** [Your Name], Steering Committee Member  
  **Date:** January 15, 2024  
  **Subject:** Recommendation for Voting Method Reform and Implementation Timeline  

  ---

  ### **Background and Context**  
  As directed, this memo addresses the voting method for our annual cause area allocation. Our current instant-runoff voting (IRV) system produced a counterintuitive result in December 2023: pandemic preparedness gained late first-preference support but lost due to a changed elimination order. This incident has sparked debate about whether to retain IRV, adopt a Condorcet method (e.g., ranked pairs or Schulze), switch to approval voting, or revert to plurality. Central to this discussion is Arrow’s impossibility theorem, which some argue renders all ranked systems equally arbitrary. Below, I steelman this position, identify its limitations, and recommend a path forward.  

  ---

  ### **Steelman of the "Arrow’s Theorem Makes All Ranked Systems Arbitrary" Position**  
  Arrow’s theorem (1951) proves that no ranked voting system can satisfy all four of these criteria when three or more options exist:  
  1. **Unrestricted Domain**: Any voter preferences are allowed.  
  2. **Non-Dictatorship**: No single voter always decides the outcome.  
  3. **Pareto Efficiency**: If all voters prefer X over Y, society must prefer X over Y.  
  4. **Independence of Irrelevant Alternatives (IIA)**: The ranking between X and Y should not depend on the presence of a third option Z.  

  Our IRV failure exemplifies a violation of IIA: pandemic preparedness’ ranking changed relative to other causes due to late-arriving ballots, altering the elimination sequence. Proponents of this view argue:  
  - **All ranked systems are flawed**: Condorcet methods (e.g., Schulze) satisfy IIA more often than IRV but still violate it in some cases (e.g., when no Condorcet winner exists). Switching to another ranked method merely trades one pathology (e.g., IRV’s non-monotonicity) for another (e.g., Condorcet cycles).  
  - **No escape within ordinal systems**: If no ranked system can fully satisfy fairness criteria, simplicity or familiarity (e.g., retaining IRV or reverting to plurality) may be preferable.  
  - **Cardinal methods are a "trick"**: Approval voting’s claim to "dodge" Arrow relies on technicalities (it uses approval scores, not rankings). However, it introduces new trade-offs (e.g., loss of preference depth) and does not inherently resolve strategic voting.  

  **Where this argument holds**:  
  Arrow’s theorem is mathematically incontrovertible for ordinal systems. If we demand perfect IIA, Pareto efficiency, and non-dictatorship in ranked ballots, no solution exists. This justifies skepticism toward "upgrading" to another ranked method without careful consideration of trade-offs.  

  **Where this argument breaks down**:  
  1. **Not all flaws are equally consequential**:  
     - IRV’s specific failure (non-monotonicity, where increased support can harm a candidate) is empirically rare but highly disruptive when it occurs. Condorcet methods avoid this flaw and better reflect majority consensus when a Condorcet winner exists.  
     - Plurality’s flaws (e.g., vote-splitting, spoiler effects) are more frequent and severe than IRV’s or Condorcet’s. Reverting to plurality would exacerbate, not resolve, problems.  
  2. **Cardinal methods genuinely escape Arrow’s theorem**:  
     - Arrow applies **only** to systems aggregating *ordinal rankings*. Approval voting uses *cardinal inputs* (binary approvals), so it is not subject to the theorem. It satisfies IIA by default (approvals for X vs. Y are unaffected by Z) and Pareto efficiency (if all prefer X to Y, X’s approval score cannot be lower).  
     - While approval voting has limitations (e.g., fails the Condorcet criterion), its escape from Arrow is substantive, not rhetorical. However, it does not guarantee "perfect" outcomes—no system does.  

  ---

  ### **Recommendation: Adopt Approval Voting**  
  I recommend replacing IRV with **approval voting** for these reasons:  
  1. **Mitigates the December 2023 failure**: Approval voting is monotonic (more support never harms a cause) and IIA-compliant. Pandemic preparedness would likely have won under approval, as late-arriving approvals would have directly boosted its tally.  
  2. **Practical advantages**:  
     - **Simplicity**: Voters select all causes they find acceptable (no rankings). Tallying is transparent (sum approvals; highest wins).  
     - **Robustness**: Avoids IRV’s elimination-order pitfalls and Condorcet’s complexity (e.g., cycles requiring tie-breaking).  
     - **Flexibility**: Allows voters to support multiple causes, aligning with our goal of funding high-impact areas.  
  3. **Empirical performance**: Approval voting encourages compromise, reduces polarization, and performs well in large groups (e.g., the 150-member Humanist Society of New York).  
  4. **Addresses Arrow’s legacy**: By using cardinal inputs, approval voting sidesteps Arrow’s theorem while preserving Pareto and non-dictatorship. It is the most Arrow-robust option we have.  

  **Why not other systems?**  
  - **Condorcet (Ranked Pairs/Schulze)**: Satisfies Condorcet criterion but violates IIA in edge cases. Tallying is complex (requires software) and may confuse voters.  
  - **Retain IRV**: Perpetuates known flaws (non-monotonicity, IIA failures) without substantive benefits.  
  - **Plurality**: Vulnerable to vote-splitting (e.g., similar causes like pandemic prep and AI safety could split votes).  

  ---

  ### **Implementation Timeline**  
  To ensure a smooth transition:  
  1. **January 2024 Meeting**: Committee votes on this bylaws amendment.  
  2. **February–March 2024**: Draft simplified voting guidelines; test tallying software.  
  3. **April–May 2024**: Educate members via email/webinar (e.g., "How to Vote: Approval 101").  
  4. **June 2024**: Dry run with mock ballot (non-binding).  
  5. **December 2024**: Implement approval voting for the 2025 allocation.  

  ---

  ### **Conclusion**  
  Arrow’s theorem does not make all voting reforms futile—it clarifies trade-offs. While no system is perfect, approval voting best balances fairness, simplicity, and resilience to strategic manipulation. By adopting it, we honor our commitment to evidence-based decision-making while avoiding the pathologies of IRV and plurality. I urge the committee to approve this change.  

  **Appendices**:  
  - A1: Arrow’s Theorem Simplified (for member education)  
  - A2: Approval Voting Ballot Mockup  
  - A3: Tallying Procedure Flowchart  

  ---  
  **Approved by:** [Your Name]  
  **For discussion at:** January Steering Committee Meeting
