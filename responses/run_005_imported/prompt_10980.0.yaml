  Okay, let me unpack this user's situation. They're struggling with their brother who has ADHD and a history of broken promises. The user used to get angry but now feels detached after understanding his diagnosis and childhood trauma. They're stuck between seeing him as a brother versus a patient. Their mom suggests accepting him as-is, but that feels like giving up. The user wants to know if understanding the reasons behind his behavior invalidates their anger.

  First, I need to validate their feelings. It's clear they care about their brother but feel conflicted. The core issue seems to be reconciling empathy with accountability. The user mentions flipping between fury and detachment—neither is sustainable. They need a middle ground where both the brother's ADHD and his responsibility coexist.

  ADHD does explain forgetfulness and impulsivity, but it doesn't erase the impact of his actions. The user's anger is legitimate because they've been let down repeatedly. The key is separating intent from impact. Even if he doesn't mean harm, the consequences are real. The user needs permission to feel hurt while still acknowledging his challenges.

  The mom's advice to treat him like a toddler isn't helpful. Adults with ADHD can learn strategies; they're not incapable. Setting boundaries is common advice, but the user needs more nuance. Boundaries should protect the user without dehumanizing the brother. For example, not lending money but still inviting him to casual hangouts.

  The user also mentioned feeling detached, like a case manager. That might stem from overcompensating for his ADHD. Instead of adjusting everything for him, they could involve him in finding solutions. Collaborative problem-solving maintains the relationship's mutuality. It's not about fixing him but finding ways to interact that respect both their needs.

  Forgiveness here isn't about excusing behavior but releasing the resentment. The user can understand the reasons without absolving all responsibility. The brother still needs to acknowledge the hurt he's caused and work on strategies, even if he slips up.

  I should emphasize that both things are true: ADHD makes things harder, and he's capable of effort. The user's frustration is valid, and they don't have to choose between anger and detachment. A middle path exists where they hold space for his struggles while maintaining standards for how they're treated.

  Also, the user might need practical steps. Suggest specific boundaries like "I won't lend money" or "if you bail on plans without notice, I won't include you next time." Encourage conversations where the brother takes ownership, using "I" statements to express how his actions affect them. Recommend resources like ADHD coaches or therapists who specialize in adult ADHD to help the brother develop tools.

  Lastly, the user's identity as a sibling matters. They want a genuine relationship, not a caretaker role. Encouraging shared activities unrelated to responsibilities could rebuild connection without pressure. Highlight that their effort to find balance shows deep care, and it's okay to navigate this imperfectly.
answer: |-
  This is such a raw and insightful place to be stuck – you've perfectly articulated the tension between understanding and accountability. Your feelings are completely valid, and the "furious sibling vs. detached social worker" flip-flop is a common (and exhausting) trap when dealing with neurodiversity and complex family history. Here's an angle that might help you navigate the middle ground:

  **The Core Insight: Understanding ≠ Absolution of Impact. Compassion ≠ Lowered Expectations.**

  ADHD and past trauma *explain* the behavior – they provide context for *why* it's incredibly difficult for your brother to follow through, manage impulses, remember obligations, and regulate his emotional responses (especially under stress, like during your dad's move). **They do *not* erase the *impact* of his actions on you, nor do they absolve him of the responsibility to *try* to manage it.** This is the crucial distinction you're searching for.

  Here's how to break it down:

  1.  **Hold Both Truths Simultaneously:**
      *   **Truth A (The Explanation):** His ADHD brain wiring makes executive function (planning, organization, time management, working memory, impulse control) fundamentally, neurologically harder. His past trauma likely intensified maladaptive coping mechanisms (avoidance, people-pleasing followed by withdrawal, difficulty with emotional regulation).
      *   **Truth B (The Impact & Responsibility):** His choices *do* cause real harm, frustration, disappointment, and broken trust. He is an adult capable of learning strategies, seeking support, and taking ownership of the consequences of his actions *despite* his challenges.

  2.  **Separate Intent from Impact:**
      *   You're right: He's likely *not* doing it *to* hurt you. ADHD-driven forgetfulness or overwhelm feels very different *to him* than malicious intent.
      *   **BUT:** The *impact* on you is *still hurtful and frustrating*. Your anger is a valid response to being let down, disrespected (even unintentionally), and having your trust broken repeatedly. You can understand *why* it happens and *still* feel the sting of it happening *again*.

  3.  **Reject the False Dichotomy (Toddler vs. Fully Accountable Robot):**
      *   Your mom's "that's who he is, accept it" approach *feels* like giving up because it *is* overly simplistic. Treating him like a toddler denies his adult capacity for growth and responsibility.
      *   The "detached social worker" mode denies the fundamental human need for reciprocal relationship and the validity of your own hurt feelings.
      *   **The Middle Path:** **Hold him accountable *as a person with a disability*, not *despite* it or *because* of it.** This means:
          *   **Acknowledging the Disability:** Understanding that certain things will *always* be harder for him. This informs *how* you approach things.
          *   **Expecting Effort & Strategy:** Expecting (and requiring, for the relationship to function) that he is actively *trying* to manage his disability. Is he in treatment? Therapy? Coaching? Using tools/reminders? *Actively* working on communication strategies?
          *   **Focusing on Repair:** Shifting the focus slightly from preventing *all* mishaps (impossible) to how he *responds* when they inevitably happen. Does he offer a genuine apology (acknowledging the impact, not just "sorry my brain sucks")? Does he make concrete amends? Does he problem-solve *with you* to prevent it next time?

  **How This Translates to Action (Beyond Just "Set Boundaries"):**

  1.  **Have the "Impact & Effort" Conversation:** When calm, talk to him. Lead with compassion: "Bro, I understand your ADHD and the divorce stuff make things incredibly hard. I get that you don't mean to let me down." Then state the impact: "But when you [specific example - bail on the move after promising], it makes me feel [specific feeling - unimportant, disrespected, like I can't rely on you]. It hurts our relationship." Then state the need: "For me to feel okay and trust you more, I need to see you actively working on strategies. What are you doing to manage this? How can we communicate better *before* things fall apart?" This frames it as collaboration, not accusation.
  2.  **Set Boundaries Based on *His* Actions, Not Just His Diagnosis:**
      *   **Bad Boundary (Detached SW):** "I know you have ADHD, so I'll never ask you for help or expect you to pay me back." (This removes accountability and fosters resentment).
      *   **Good Boundary (Middle Path):** "I love you, but because it's been so hard to rely on you for big commitments, I won't be counting on you for critical help with things like [moves, major events]. For smaller things, let's figure out a solid reminder system together first." OR "I can't lend you money anymore until the previous [$X] is repaid. When you're ready to discuss a repayment plan, let me know." OR "If you need to cancel plans, I need a text/call *as soon as you know*, not just a no-show. If it happens last minute repeatedly, I'll need to stop making plans that rely on you being there."
      *   **Key:** Boundaries protect *you* and the *relationship*. They are consequences for specific actions (or inactions), not punishments for having ADHD. They force *him* to confront the impact and make choices.
  3.  **Adjust *How*, Not *Whether*, You Engage:**
      *   **Detached SW Mode:** Only interact around managing his problems, lower all expectations to zero, no vulnerability.
      *   **Furious Sibling Mode:** Constantly setting him up for failure with expectations he can't meet, then exploding.
      *   **Middle Path:** Engage in ways that play to his strengths or minimize pressure. Focus on low-stakes hangouts *you* enjoy regardless (e.g., "Come over for pizza and a movie, no pressure, come if you can"). Share things *you* care about without expecting specific follow-up from him. Protect yourself on high-stakes items (money, critical help) but stay open on the human connection level *when he shows up*.
  4.  **Forgiveness is a Process, Not a One-Time Event (and It's For YOU):**
      *   Forgiveness isn't saying "what you did was okay." It's deciding not to let the anger and resentment poison *you*. You can understand the reasons *and* forgive the hurt *while still* holding him accountable for future behavior. It releases *you* from carrying the constant burden of fury, making space for the relationship to exist differently (even if limited).

  **To Answer Your Direct Questions:**

  *   **Does a real explanation make past anger irrational?** **No.** Your anger was a rational response to being repeatedly hurt and let down. The explanation provides context *now*, but it doesn't retroactively invalidate your very real feelings *then*.
  *   **Can you understand why and still be legitimately upset?** **Absolutely, yes.** You can hold deep compassion for his struggles *and* deep frustration and hurt about the real-world consequences of his actions on your life and your relationship. Your feelings about the *impact* are separate from your understanding of the *cause*.

  **You're not missing a clearer way; you're grappling with a genuinely complex human dilemma.** The clearer way is to **hold space for both realities at once:** his neurological and emotional challenges *and* your legitimate need for reliability, respect, and a reciprocal relationship. Stop trying to choose between "furious sibling" and "detached social worker." Aim for "compassionate but clear-eyed sibling who sets necessary limits to protect myself and the relationship, while still hoping for (and expecting effort towards) better." It's messy, it's imperfect, but it's real. Your effort to find this balance shows deep care, both for him and for the relationship itself.
