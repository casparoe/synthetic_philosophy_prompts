answer: |-
  You're right to feel uneasy about your friend's argument. While it has a compelling utilitarian logic ("more good lives are better"), it oversimplifies the ethical and practical realities of urban growth. Here's a breakdown of why his reasoning is problematic:

  1.  **The "Worth Choosing" Threshold is Arbitrary and Potentially Low:**
      *   Your friend assumes that if someone *chooses* to move in, their life is automatically "clearly worth choosing" and adds to the "total good." But this threshold is incredibly vague and can be dangerously low.
      *   People move for complex reasons (job proximity, escaping worse conditions, lack of alternatives). Someone might accept a noisy, cramped apartment with a terrible commute because it's their *only* affordable option near work, not because it represents a truly "good life" by any broader standard. Is merely "better than the alternative elsewhere" the bar we want for our city?
      *   This logic risks creating a race to the bottom, where the baseline quality of life continuously degrades as long as it remains marginally better than the next worst option for *some* newcomers.

  2.  **It Ignores Distribution of Costs and Benefits (Fairness):**
      *   The friend's argument focuses solely on the *newcomer's* net benefit ("life is worth choosing"). It largely ignores the *costs imposed on others*:
          *   **Current Residents:** Their commute times increase, noise levels rise, green space becomes more crowded, parking vanishes, schools become overloaded. Their quality of life demonstrably worsens. Is it fair that their well-being is sacrificed to enable more people to live in conditions they themselves wouldn't choose?
          *   **Future Newcomers:** The *next* wave of newcomers faces an *even worse* starting point (more noise, worse commutes, less green space) because the degradation caused by the *previous* wave wasn't mitigated. The threshold keeps lowering.

  3.  **It Assumes Growth is Inevitable and Unmanageable:**
      *   The argument frames the choice as binary: "grow rapidly with degradation" or "be selfish and stagnate." This ignores the possibility of **managed, sustainable growth**.
      *   Prudence isn't necessarily "selfishness dressed up." It can involve:
          *   **Phasing development** to match infrastructure upgrades (transit, roads, schools, parks).
          *   **Requiring higher quality standards** for new units (better soundproofing, access to light, communal green space *within* developments).
          *   **Investing concurrently in infrastructure** to mitigate the negative impacts of density *before* or *alongside* new residents arriving.
          *   **Pursuing complementary policies** like improved regional transit to reduce commute pressure, or promoting job growth in other areas to lessen the influx pressure on one city.

  4.  **The Tragedy of the Commons:**
      *   This logic embodies the "Tragedy of the Commons." Each individual new unit might seem justified if it houses one more person for whom life is "worth choosing." However, the *cumulative effect* of thousands of such units, without corresponding investment in shared resources (roads, transit, parks), degrades those resources for *everyone*, newcomers included. The very things that made the city attractive in the first place are eroded.

  5.  **It Discounts the Value of Existing Community and Quality of Life:**
      *   The argument implicitly treats the existing quality of life enjoyed by current residents as having no inherent value beyond the happiness it provides *them*. It suggests that sacrificing that quality for *more people* is inherently better. However, communities, social networks, established character, and access to amenities have value. Rapid, unmanaged degradation can destroy these intangibles, leading to social friction and a loss of what made the city desirable.

  6.  **It Fails to Account for "Adaptive Preferences":**
      *   People adapt to worsening conditions. Over time, residents (both old and new) may *accept* longer commutes, more noise, and less green space as the "new normal." This doesn't mean the degradation didn't happen or that the initial quality of life wasn't valuable. Your friend's logic could lead to a city where everyone's baseline has lowered significantly, yet each new resident still finds it "worth choosing" compared to even worse alternatives.

  **Conclusion: Was your friend "right"?**

  **No, his reasoning is overly simplistic and ethically flawed.** While increasing housing supply to improve affordability is crucial, his specific argument – "approve any development as long as *some* newcomer finds life worth choosing, regardless of the cumulative degradation" – ignores critical factors:

  *   **Fairness:** The disproportionate costs borne by existing residents and future newcomers.
  *   **Sustainability:** The need to manage growth to prevent the degradation of shared resources.
  *   **Quality Threshold:** The danger of setting an unacceptably low bar for what constitutes a "good life" in the city.
  *   **Value of Existing Community:** The inherent worth of the current quality of life and community fabric.

  **Your intuition is correct.** A truly ethical and prudent approach requires balancing the moral imperative to provide more housing with the responsibility to:
  *   **Protect existing residents** from unreasonable degradation of their quality of life.
  *   **Ensure newcomers** have access to a genuinely decent standard of living, not just the bare minimum.
  *   **Invest in infrastructure and amenities** concurrently with growth to mitigate negative impacts.
  *   **Pursue managed growth** that sustains the city's long-term livability for *all* residents, old and new.

  The debate shouldn't be framed as "growth vs. stagnation" or "selflessness vs. selfishness," but rather "**how can we grow in a way that is fair, sustainable, and actually improves (or at least preserves) the quality of life for the community as a whole?**" Your friend's argument sidesteps this crucial complexity.
