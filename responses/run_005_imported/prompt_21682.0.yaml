answer: |-
  Your intuition that there was a profound unfairness here is not only defensible, but points directly to a core problem in moral reasoning: the influence of **moral luck**. This episode is a near-textbook case, and your philosophical reading likely touched upon thinkers like Bernard Williams and Thomas Nagel who dissected this very phenomenon.

  Here's a breakdown of why the divergent outcomes feel unfair and why that feeling is ethically sound:

  1.  **Identical Culpability:** At the moment of their decision and action (skipping the mandated health check and failing to report it), both postdocs were morally indistinguishable. They:
      *   Violated the same approved protocol.
      *   Broke the same institutional rules and ethical standards.
      *   Acted with the same motivation (deadline pressure).
      *   Made the same flawed risk assessment (dismissing the check as a formality based on prior uneventful dosing).
      *   Committed the same act of deception (non-disclosure to you and the committee).
      *   Demonstrated the same level of carelessness or poor judgment regarding animal welfare and scientific integrity.

  2.  **The Crucial Role of Luck:** The *only* difference in outcome was due to a factor entirely outside either postdoc's control or knowledge: the unrelated manufacturing contaminant in one batch of adjuvant. This was sheer bad luck for one fellow and good luck for the other.
      *   **Outcome Luck (Nagel):** The luck resided purely in the *consequences* of their identical actions. One action led to severe harm due to an external, random event; the other did not.

  3.  **The Problem of Outcome-Dependent Judgment:** The field's response judged the *moral blameworthiness* of the actors based heavily on the *outcome* determined by luck, not solely on their *choices and actions* at the time they acted.
      *   **Consequentialism's Flaw:** While consequentialism (judging actions by outcomes) has its place, applying it *retrospectively to assign blame for past actions based on unforeseeable luck* is deeply problematic. It makes moral desert dependent on fortune.
      *   **Punishing Luck, Not Just Action:** The reprimanded fellow was punished far more severely not because *she* was more negligent or acted differently, but because *she was unlucky*. Her colleague, equally negligent, was *lucky* and escaped consequences, even profiting from his lapse.

  4.  **Why This Feels Unjust:**
      *   **Arbitrariness:** The difference in treatment stems from a random event, making the punishment seem arbitrary and undeserved relative to the actual fault.
      *   **Disproportionality:** The punishment (career derailment) was wildly disproportionate to the *intrinsic wrongness* of the act *as committed by both*. It was proportional only to the *magnitude of the harm*, which was caused by luck.
      *   **Discourages Transparency:** This outcome incentivizes hiding minor lapses that *don't* cause harm (like the lucky fellow did) because the penalty for a lapse revealed only by bad luck is catastrophic. It discourages learning from near-misses.
      *   **Undermines Consistent Standards:** It suggests the ethical standard isn't "follow the protocol and report deviations," but "don't get caught causing harm through a lapse, even if identical lapses cause no harm."

  **Was the Field "Right"?**

  *   **Practically/Pragmatically:** Institutions often *must* react strongly to public harm and scandal to maintain credibility, enforce standards, and deter future negligence. The visible harm demanded a visible response. They may also argue that the *consequences* of negligence, even if partly luck-driven, *do* matter for assigning responsibility and sanction.
  *   **Ethically/Morally (from a standpoint focused on individual desert and fairness):** No, the field was not "right" in the deeper sense of delivering *just* deserts based on *culpability*. The sharp divergence in careers was fundamentally driven by moral luck. The core ethical failing was identical. The punishment should have reflected *that* failing, not the random occurrence of harm.

  **The Genuine Mistake You're Sensing:**

  The mistake is **conflating the magnitude of harm with the degree of culpability when the harm was caused significantly by factors beyond the agent's control.** It's the mistake of allowing **outcome luck** to dictate moral and professional judgment retrospectively. The institution (and the field) punished the *bad outcome* much more harshly than the *identical negligent act* that didn't cause a bad outcome, making moral desert dependent on fortune.

  **Conclusion:**

  Your long-standing sense of unfairness is **highly defensible.** While institutions often react to outcomes, and there are practical reasons for doing so, the *ethical core* of this situation reveals a deep injustice. The two postdocs were equally blameworthy for their choices and actions. The catastrophic difference in their careers stemmed not from a difference in their moral failing, but from a difference in luck – a contaminant one couldn't foresee or control. This is the essence of moral luck, and it highlights why judging culpability *solely* or *primarily* based on outcomes influenced by chance is ethically flawed. Your unease is the sound recognition of that flaw. The fairer response would have been to investigate *why* the protocol was violated by both, address systemic pressures, and apply consistent, proportionate sanctions for the *violation itself* to *both* individuals, regardless of the random outcome. The contaminant caused the harm; the skipped check was a necessary condition exposed by the contaminant, but the *decision* to skip it was the moral failing shared equally by both.
