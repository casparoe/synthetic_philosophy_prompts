  The user also asks about Lewis's reformed analysis (RCA). RCA requires an intrinsic causal basis that persists when the stimulus is applied. For finkish cases, RCA works because the intrinsic basis (like the wire's structure) changes during stimulus, so RCA correctly denies the disposition. But for masking, the intrinsic basis (poison's chemical properties) is still there, so RCA attributes the disposition. However, the conditional fails due to external blockers. So RCA handles finkish but not masking.

