  ok so me and a friend got into a whole argument last night about the turing test and it went down a weird rabbit hole. i mentioned that in the actual 1950 paper turing takes ESP dead serious as an objection -- he flat out says the statistical evidence for telepathy is "overwhelming" and builds this whole card-guessing scenario into the imitation game. my friends take is that this is basically turing just hedging against the human contestant cheating somehow, and that his "telepathy-proof room" fix trivially solves the whole thing. but i seem to remember theres a weirder bit in there about the interrogator's psychokinesis messing with the machine's random number generator specifically, which feels like a totally different kind of problem than "the human might cheat." can you actually walk through the structure of turing's ESP argument -- why does he think it threatens the test as a test of thinking, not just its fairness, and does putting everyone in a telepathy-proof room really patch the psychokinesis worry too, or does that fix a completely different failure mode? trying to figure out who won lol
