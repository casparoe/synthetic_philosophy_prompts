answer: |-
  You're describing a classic case of **sunk cost fallacy combined with competitive escalation** – and yes, it's irrational, but *understandably* so. Your brain is playing tricks on you, and the game's design is exploiting it perfectly. Here's the breakdown:

  1.  **The Sunk Cost Fallacy:**
      *   You've already spent money. That money is *gone forever*, regardless of what you do next.
      *   Your thought process ("*if I quit now, that money was for nothing*") mistakes the *past* spending as a reason to spend *more* in the future.
      *   **Reality:** The money is spent. Throwing *more* money at it won't retrieve the spent money or make it "worth it." It only makes the *total* loss larger. The *only* question that matters now is: "Is spending *additional* money *now* worth the *potential future benefit* (the skin)?"

  2.  **Competitive Escalation / Auction Mentality:**
      *   This isn't just about buying a skin; it's become a **bidding war** against a specific opponent. Each time one of you takes the lead, the other sees it as a challenge to "win."
      *   The "prize" (the skin) loses its intrinsic value. The motivation shifts to **beating the rival** and avoiding the feeling of defeat. Winning becomes about dominance, not the reward.
      *   Game designers *count* on this psychological drive between competitive players to fuel spending.

  3.  **Loss Aversion:**
      *   Psychologically, the pain of losing (your spent money feeling wasted, the rival "winning") feels about *twice as powerful* as the pleasure of gaining something of equal value. This makes quitting feel extremely painful, pushing you to spend more to avoid that feeling.

  4.  **The Illusion of "Worth It":**
      *   You admit the skin isn't worth what you've spent *to you*. Yet, the competition warps your perception. The *act of winning* the competition temporarily overshadows the objective lack of value.

  **Are you being irrational? Yes, but understandably:**

  *   **Objectively Irrational:** From a purely financial and value-based perspective, continuing to spend significantly more than the skin is worth *to you* is irrational. You are incurring greater losses to avoid feeling the pain of past losses (sunk costs) and the sting of defeat.
  *   **Psychologically Understandable:** Humans are wired for competition, loss aversion, and struggle with sunk costs. The game mechanics are deliberately designed to trigger these powerful psychological responses. Your reaction is a common human bias being exploited.

  **What's really going on:**

  1.  **You're in a Prisoner's Dilemma/Arms Race:** Neither of you wants to "lose" the money already spent, so you both keep escalating, making *both* of you worse off financially. The *only* winner is the game company.
  2.  **The Skin is Now Irrelevant:** The competition *itself* has become the primary driver, not the cosmetic reward.
  3.  **You're Validating Each Other:** Your rival sees your spending as justification for theirs, and vice versa. You're trapped in a feedback loop.

  **What should you do?**

  1.  **Acknowledge the Fallacy:** Say it out loud: "This is the sunk cost fallacy. The money I spent is gone. Spending more won't get it back. The only question is whether *more* money spent *now* is worth this skin *to me now*." (Spoiler: Based on your own words, it's not).
  2.  **Reframe "Quitting":**
      *   Quitting isn't "losing" the money you already spent. That money is lost regardless.
      *   Quitting is **stopping the bleeding**. It's preventing *future*, *guaranteed* financial loss.
      *   Quitting is **choosing freedom** from this stressful, expensive cycle.
      *   Quitting is **winning back control** of your wallet and your enjoyment of the game.
  3.  **Calculate the REAL Cost:** Add up *everything* you've spent chasing this skin. Now, honestly ask: "Would I pay *this total amount* upfront just for this skin?" If the answer is no (which it almost certainly is), you have your answer.
  4.  **Set a HARD Limit (or Zero):** For the *next* event, decide **before it starts** what the skin is *actually* worth to you. Set that as your absolute spending limit ($0 is a valid and wise choice!). Stick to it NO MATTER WHAT your rival does. Do not check the leaderboard obsessively.
  5.  **Talk to Your Partner:** They see it clearly because they aren't emotionally invested in the competition. Listen to their perspective – it's likely grounded in concern for you.
  6.  **Consider Blocking/Rival:** If seeing their activity triggers you, mute them or minimize interaction if possible. Out of sight, out of mind.
  7.  **Focus on Enjoyment:** Remember why you play the game (presumably for fun, alliance camaraderie, etc.). This spending war is likely detracting from that enjoyment and causing stress.

  **Conclusion:** Yes, you are being irrational due to powerful psychological biases being exploited by the game's design. The sunk costs are gone. Continuing to spend is throwing good money after bad to avoid the *feeling* of loss and defeat, not to gain something of proportional value. **Stopping now isn't wasting the past money; it's saving all your future money.** Your partner is right to be concerned. Break the cycle, set firm limits, and reclaim your enjoyment of the game (and your finances). The only way to truly "win" this situation is to stop playing their expensive game.
