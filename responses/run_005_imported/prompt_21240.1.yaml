  ## The Drug & The Dilemma

  **Setting:** A dimly lit medical bay. ALEX holds a single syringe filled with a glowing serum. DAVID lies unconscious on a cot, critically ill. Five monitors display the vital signs of five other patients in separate isolation units, all dying of the same disease. ALEX looks pale. MORGAN stands nearby, observing.

  **Characters:**
  *   **ALEX:** Holding the syringe, deeply conflicted. Leaning towards Taurek's view.
  *   **MORGAN:** Observing, convinced numbers must matter.

  **(The hum of medical equipment fills the tense silence. Alex stares at the syringe, then at David, then at the five monitors.)**

  **ALEX:** (Voice strained) Five monitors. Five lives. Logically... it *should* be obvious. Five is greater than one. Give each a fifth, save five. Why does it feel like tearing my own heart out?

  **MORGAN:** Alex, it *is* obvious. It’s simple arithmetic. One life lost versus five lives lost. The net harm is minimized by saving the five. David is... David. But five *people*. Five families. Five futures. The weight is undeniable.

  **ALEX:** Is it? *Deniable*? That's just it, Morgan. *Whose* harm is minimized? Point to the *one person* for whom losing the five is a *greater personal tragedy* than losing David would be for... well, for me, or for his family. There isn't one.

  **MORGAN:** (Steps closer, intense) That’s the point! It’s not *about* one person bearing the weight of all five losses! It’s about *five distinct individuals* each suffering an absolute, irreplaceable loss. Each one is a world ending. Ignoring that multiplicity, treating five tragedies as no *more* morally significant than one... isn't that its own kind of blindness? You're privileging the perspective of the *agent* – us, looking on – over the reality of the *victims*.

  **ALEX:** Privileging? I'm trying to *respect* them! Each one of those five, individually, suffers a loss no greater than David would. To say "saving five is better" implies adding their *separate* losses into one big pile of 'badness' that outweighs David's single loss. But badness isn't some cosmic substance pooled together! It's bad *for* Mary, bad *for* John, bad *for* each one. And *for each*, the loss is total, whether they were the only one or one of five. Saving David prevents one total loss. Saving the five prevents five total losses. But preventing five separate losses isn't *worse for any single one* than preventing David’s loss would be. So why is it *objectively* better? Why isn't flipping a coin fair? It gives David his equal chance against the group.

  **MORGAN:** Equal chance? Alex, think! If we flip a coin, David has a 50% chance. *Each* of the five only has a 10% chance of getting the cure if we split it. But collectively, the *group* of five has a 50% chance of *all* dying if we flip. You’re giving David equal weight to the *entire group*, which feels... perverse. It ignores the fact that *more individuals* stand to lose everything.

  **ALEX:** But the *group* isn't a person! There's no super-being called "The Five" who will suffer a loss five times worse. Only five separate beings, each suffering their own loss. Giving the group a 50% chance *is* giving each individual within it a fair shot, relative to David. It doesn't ignore them; it treats their fates as *separate*.

  **MORGAN:** Okay, push this further. What if it wasn’t five? What if it was David versus... a hundred strangers? A thousand? Would you *seriously*, Alex, stand here with that syringe and flip a coin? Give David a 50/50 shot against a thousand lives?

  **ALEX:** (Hesitates, grips the syringe tighter) Logically... consistently... yes. It feels monstrous, I know it does. My gut screams 'No!'. But *why*? Because I'm picturing a thousand grieving families, a thousand funerals? That's still a thousand *separate* tragedies. For any *one* of those thousand people, dying is no worse than it is for David. Preventing *one* of their deaths isn't morally superior to saving David. So why is preventing *all thousand* suddenly a categorical imperative? Because the *number* impresses me? Horrifies me? That feels like letting the scale bully me into bad philosophy. The separateness of persons means we shouldn't aggregate harms *simply because aggregation makes the number big*.

  **MORGAN:** It's not just about being impressed! Think about the *potential* lost. A thousand futures contain vastly more possible good – discoveries, art, love, children – than one. Letting them die isn't just a thousand individual losses; it's a loss *to the world* on a scale David alone couldn't match. Isn't *that* a real, aggregate harm – the diminishment of the collective future? And what about Parfit's move? If saving the five only gives each a partial cure, but it *works*, isn't the harm of *not* doing it an imperceptible harm to each of the five *now*? They don't get the cure they could have had. Whereas not saving David is a massive, definite harm *to him*.

  **ALEX:** (Nods slowly) The "loss to the world" argument... it has pull. But it still feels like a sleight of hand. That "collective future" isn't a sentient entity that suffers. Only individuals suffer or flourish. Valuing the *potential* good is different from aggregating existing harms. As for Parfit... (Sighs) If I give David the full dose, each of the five *could* have been saved by a fifth, but *wasn't*. That's a harm to each – they died who could have lived. If I split the dose, David *could* have been saved but *wasn't*. That's a harm to him. The "imperceptible harm" of missing out feels the same in both directions for the individuals who lose out. It doesn't resolve the aggregation question. The separateness remains.

  **MORGAN:** So you'd really risk a thousand for one? On a coin flip? That feels like... moral solipsism. As if only the individual facing you in the moment matters, and the multitude is just noise. Doesn't recognition of others *demand* we acknowledge that more suffering, more death, is *worse*, full stop? Even if no single person experiences the 'more'?

  **ALEX:** And doesn't recognition of each individual *demand* we not treat them as mere fractions of a greater sum? That we not sacrifice one simply because he's outnumbered? That we give his life, his entire world, the same fundamental weight as any other? The coin flip *is* that recognition. It refuses to let David be crushed by the math.

  **MORGAN:** But refusing the math can crush *so many more*. Where does respect for the one end and callous disregard for the many begin? Five? A hundred? A thousand? The line is arbitrary if you reject the principle that numbers count *at all*.

  **ALEX:** And the line where one life becomes dismissible *because* of numbers is just as arbitrary! It just feels less personal when the number is big. The principle is the same: one life versus many. The separateness holds. The aggregation is the illusion... or maybe the necessary evil I just can't bring myself to fully embrace, even for a thousand. (Looks down at the syringe, then at David, then at the five monitors. A long silence hangs.) The drug won't administer itself. Logic... feeling... neither gives me peace. Flip a coin? Or save the five? How do you *choose* when both choices feel like a betrayal?

  **(Alex looks utterly torn. Morgan watches, frustration and deep thought warring on their face. The medical hum is the only sound. Neither has won; the dilemma remains, raw and unresolved.)**

  **End Scene**
