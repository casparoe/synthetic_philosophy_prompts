  Here's an argument for the claim that a hypocritical accuser lacks the standing to blame, even when their accusation is true, addressing the core objections:

  **Why Truth Alone is Insufficient: The Nature of Moral Blame**

  Moral blame isn't merely a factual report ("You did X, and X is wrong"). It's a complex **normative practice** embedded within a community of mutually accountable agents. To function, this practice requires not just factual accuracy, but also certain **relational conditions** between the blamer and the blamed. Standing is about having the *moral authority* to participate in this practice *in this specific instance*.

  1.  **Blame as a Call for Account-Giving:** When we blame, we implicitly demand that the wrongdoer acknowledge their fault, offer justification or excuse, express remorse, or commit to reform. This is a demand for a specific kind of response – an engagement in a normative dialogue.
  2.  **Hypocrisy Undermines the Demand:** A hypocrite, guilty of the same (or relevantly similar) wrong without repentance or accountability, fundamentally undermines their right to make this demand. Their own conduct demonstrates a rejection of the very norms they are invoking. They are, in effect, saying, "These rules apply to *you*, but not to *me*," thereby placing themselves outside the reciprocal community of accountability they are trying to enforce upon the target.
  3.  **The "Tu Quoque" (You Also) Deflection & Normative Power:** The hypocrite's lack of standing gives the target a legitimate, non-fallacious "tu quoque" response. The target can rightly say, "Who are *you* to demand this account from *me* when you haven't accounted for the same thing yourself?" This isn't denying the truth of the accusation; it's challenging the blamer's *authority* to be the one making the demand. The hypocrite's normative power to call the other to account is neutralized by their own failure.

  **Addressing the Objection: Manners, Motives, Character, or the Speech Act Itself?**

  The objection claims complaints against hypocritical blamers concern only peripheral issues (manners, motives, character), not the validity of the blaming *act*.

  *   **Why it's More Than Manners/Motives/Character:** While hypocrisy often involves bad manners, suspect motives (e.g., deflection, self-righteousness), and poor character, the core problem is deeper. It strikes at the **conditions necessary for the blaming speech act to function *as* a legitimate demand for accountability within the moral practice.**
      *   **Manners:** Rudeness might make blame unpleasant, but it doesn't inherently negate the demand. A blunt but non-hypocritical person might still have standing.
      *   **Motives:** Impure motives (e.g., blaming to hurt) might make the act vicious, but they don't necessarily negate the *truth* of the accusation or the *target's* obligation *in principle*. A jealous person might correctly blame an adulterer; the adulterer is still guilty.
      *   **Character:** A generally bad character doesn't automatically strip one of standing on *every* issue. A thief might still have standing to blame a murderer (if the wrongs aren't relevantly similar).
  *   **Why it *is* About the Speech Act Itself:** Hypocrisy concerning the *specific norm in question* directly contaminates *this particular act* of blaming. It renders the blamer **inconsistent in their application of the norm** at the moment of utterance. This inconsistency:
      *   **Vitiates the Moral Force:** The act loses its character as a genuine call *from within* the moral community *to* the moral community. It becomes an act of power, accusation, or condemnation from a position of self-exemption, not mutual accountability.
      *   **Prevents Uptake:** The target cannot reasonably be expected to engage in the normative dialogue (acknowledgment, remorse) demanded by the blame, because the demand comes from someone who refuses to subject themselves to the same standard. The hypocrite's act fails to initiate the normative exchange it purports to initiate. The *act itself* misfires.

  **Why Standing Doesn't Excuse or Lessen Culpability**

  The lack of standing is a problem *with the blamer*, not a pardon *for the wrongdoer*.

  1.  **The Wrong is Objective:** The wrongdoer's action was wrong independently of anyone blaming them. The properties that make the act wrong (harm, injustice, violation of duty) exist regardless of who points them out or how hypocritically they do so.
  2.  **Others May Have Standing:** The hypocrite's lack of standing doesn't mean *no one* can blame the wrongdoer. Someone with "clean hands" regarding the relevant norm *does* have the standing to deliver the *same* true accusation effectively and legitimately. The wrongdoer's culpability remains intact and addressable *by others*.
  3.  **Self-Blame Still Applies:** The wrongdoer retains an obligation to hold *themselves* accountable, regardless of who points out their fault. The hypocrite's lack of standing doesn't absolve the target of their own internal moral reckoning.
  4.  **The Analogy:** Imagine a corrupt judge sentencing someone for corruption. The sentence might be factually correct (the defendant *is* guilty of corruption), but the judge's corruption undermines their *authority* to deliver that sentence. The defendant's guilt is unchanged. The problem lies in the judge's fitness to sit in judgment *in this case*, not in the facts of the defendant's conduct. Similarly, the hypocrite may speak the truth, but their own violation of the norm they invoke disqualifies them from being the legitimate voice of that norm's enforcement *in this instance*.

  **Conclusion**

  The standing to blame is a relational condition necessary for the speech act of moral blame to function as a legitimate demand for accountability within a reciprocal normative community. Hypocrisy, concerning the specific norm invoked, directly undermines this standing by demonstrating the blamer's rejection of the reciprocity essential to the practice. This vitiates the normative force of the blaming act itself, making it an ineffective and illegitimate demand, regardless of the accusation's truth. Crucially, this defect in the blamer's position does nothing to diminish the objective wrongness of the target's action or their culpability; it merely means *this particular blamer* lacks the moral authority to be the one voicing the condemnation. The truth is necessary, but not sufficient, for justified blame; the blamer must also stand *within* the community of accountability they seek to enforce.
