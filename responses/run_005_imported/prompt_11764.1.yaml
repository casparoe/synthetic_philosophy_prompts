prompt: |-
  So I'm part of a slow philosophy reading group (we do like 4-5 sections of the Philosophical Investigations a week, it's glacial but I finally feel like I'm actually absorbing it instead of skimming) and we just hit the rule-following stuff around §201, which I gather is the passage Kripke later turned into that whole "Kripkenstein" skeptical paradox that gets name-dropped on LW and ACX constantly, half the time by people who've never actually read the source text. Here's the bit that's been bugging me all week:

  "This was our paradox: no course of action could be determined by a rule, because every course of action can be made out to accord with the rule. The answer was: if everything can be made out to accord with the rule, then it can also be made out to conflict with it. And so there would be neither accord nor conflict here. It can be seen that there is a misunderstanding here from the mere fact that in the course of our argument we give one interpretation after another; as if each one contented us at least for a moment, until we thought of yet another standing behind it. What this shows is that there is a way of grasping a rule which is not an interpretation, but which is exhibited in what we call 'obeying the rule' and 'going against it' in actual cases."

  I think I follow the individual sentences fine, but I can't tell if that last part is doing any real work or if its just restating the problem in fancier language. Wittgenstein asserts there's "a way of grasping a rule which is not an interpretation" but doesn't say what it is here, he just gestures at "obeying the rule" as a practice, which honestly feels like question-begging to me. So is Kripke right to read this passage as setting up a genuine, unanswered skeptical paradox about meaning (the kind that then needs his whole skeptical-solution machinery of assertability conditions and a community of speakers), or is he importing a problem that isn't really there, the way Baker and Hacker always complain, with Wittgenstein actually thinking the paradox just dissolves once you stop looking for an interpretation to do the work in the first place? I keep flip flopping on this and don't think I have the exegetical chops to settle it just from staring at one paragraph. Could someone walk through what's actually happening line by line here and point to where the real interpretive fork comes from in the text itself, rather than just telling me "some people read it as skepticism and some don't"?
