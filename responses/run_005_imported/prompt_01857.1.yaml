  Now, the ambiguous case. The user mentioned poison in a vial with a neutralizer. The key ambiguity is whether the neutralizer acts on the poison (altering disposition) or just counters its effect (masking). If the neutralizer changes the poison's properties upon opening, it's fink-like. If it just interacts post-release, it's masking. The trigger timing and mechanism individuation create the debate.

