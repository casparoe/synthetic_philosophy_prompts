  First, I need to create fresh examples. The classic ones are electro-fink wire and styrofoam-packed glass. Avoiding those, I consider everyday objects. For a fink, something that removes the disposition upon stimulus. A self-destructing vase comes to mind—fragile but reinforced when struck. The reinforcement happens instantly, making it non-fragile at the exact moment of impact. That fits the fink definition: the disposition vanishes when tested.

