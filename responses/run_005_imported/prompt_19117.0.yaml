prompt: |-
  I'm part of my high school's small philosophy club, and this semester our faculty advisor has had us slowly working through Hume's *Enquiry Concerning Human Understanding*. At our last meeting, right after we finished discussing his account of induction, she mentioned Hempel's raven paradox almost as an aside, since apparently it's a famous headache in twentieth-century philosophy of science, and I haven't been able to stop thinking about how it connects to what we'd just read. As I understand it, the paradox works like this: the statement "all ravens are black" is logically equivalent to its contrapositive, "all non-black things are non-ravens," and under the standard assumption (often called Nicod's criterion) that a claim of the form "all A are B" is confirmed whenever we find an A that is B, it seems to follow, via what's called the equivalence condition, that finding literally anything that is neither black nor a raven — a green apple, a yellow pencil, my own white sneaker — technically counts as evidence for the claim about ravens. That conclusion feels absurd, but I'm having trouble pinning down exactly where a Humean would say the reasoning goes wrong.

  Since Hume died more than a century and a half before Hempel ever wrote about confirmation, there's obviously no passage I can just go look up, so I'd like you to reconstruct, as carefully as you can, how he most likely would have reacted to this puzzle. In particular, I'm curious whether Hume's fork — his division of all reasoning into "relations of ideas" and "matters of fact" — gives him any special leverage here: would he treat the equivalence condition as unproblematic, since it's just a purely logical relation between statements, while insisting that actual confirmation (a matter of fact, grounded for him in custom and the observed constant conjunction of qualities) has no obligation to track logical equivalence at all? Or would his broader skepticism about induction push him somewhere more radical, toward denying that there's any deep puzzle to dissolve in the first place, since on his view our expectations about ravens were never really the product of inference from a general law to begin with? I'd like a genuine, developed answer written as a few connected paragraphs rather than a list of bullet points, since I want to actually follow the chain of reasoning rather than just see conclusions stated.
