  First, I need to unpack the core conflict: the mathematical impossibility theorem vs. real-world policy choices. The theorem shows you can't simultaneously satisfy calibration, equal FPR/FNR, and different base rates. The user's friend argues this makes algorithms irreducibly discriminatory compared to humans. But why haven't courts abandoned them?

  The key insight here is that the theorem applies to any predictor - including human judges. The friend's claim that judicial discretion "escapes" this is mistaken. Humans face the same mathematical constraints when making predictions. This seems to be the user's lingering doubt - they sensed something off about the human-algorithm distinction.

  I should explain why jurisdictions persist with algorithms despite the trade-off:
