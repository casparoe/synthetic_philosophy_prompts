answer: |-
  ## MEMORANDUM  
  **To:** State Long-Term Capital Projects Discount Rate Panel  
  **From:** [Your Name], Public Member  
  **Date:** October 26, 2023  
  **Subject:** Recommended Methodology for Discounting Costs and Benefits of Century-Scale Capital Projects  

  **1. Purpose:** This memo proposes a specific, transparent, and ethically defensible methodology for establishing the social discount rate (SDR) applicable to state capital projects with costs and benefits extending 100+ years. It addresses the core dispute over the *pure time preference* component while incorporating legitimate *opportunity cost/growth* considerations, mandates regular review, and provides concrete parameters for immediate application to the proposed storm-surge barrier.

  **2. Recommended Methodology: The Declining Ramsey Rate with Near-Zero Pure Time Preference**

  We recommend adopting a **declining long-term discount rate** based on the **Ramsey formula**, explicitly separating its components:

  > **SDR(t) = δ + η * g(t)**

  Where:  
  *   **δ (Delta) = Pure Rate of Time Preference:** **0.1%**  
  *   **η (Eta) = Elasticity of Marginal Utility of Consumption:** **1.5**  
  *   **g(t) = Projected Long-Term Growth Rate of Real Per Capita Consumption:** **1.9%** (initial), **declining gradually** over very long horizons (see 2.3).

  **2.1 Justification for δ ≈ 0 (0.1%):**  
  *   **Ethical Imperative:** Discounting the welfare of future individuals *solely* because they exist later in time lacks a robust ethical foundation (Sidgwick, Ramsey, Parfit, Cowen). There is no democratic mandate, special obligation to the near term, or *unavoidable* opportunity cost argument that justifies treating a life lost in 2150 as inherently less valuable than one lost today. A near-zero δ reflects the fundamental moral equality of persons across time.  
  *   **Practical Implementation:** A rate of 0.1% (effectively near-zero) acknowledges minor, non-ethical practical uncertainties (e.g., extinction risk) while decisively rejecting the proposition that future lives count less simply due to temporal location. It avoids the extreme implications of a literal δ=0% under all theoretical edge cases while upholding the core ethical principle.  
  *   **Addressing the "Chain of Small Gains" Counterargument:** A near-zero δ *does not* imply accepting any present sacrifice for vanishingly small future gains. The Ramsey framework inherently protects against this:  
      *   **η > 1:** Signifies diminishing marginal utility. Sacrificing significant consumption *now* (when utility is high) for tiny gains in a potentially much wealthier *future* (when utility is low) is heavily penalized by the `η * g(t)` term.  
      *   **Real-World Context:** The "chain of small gains" scenario is a theoretical construct. The projects we evaluate (like existential flood protection) involve large, catastrophic *losses* avoided in the future, not marginal gains. A near-zero δ ensures these catastrophic future losses are not trivialized. Opportunity cost concerns are captured via `η * g(t)`, not δ.

  **2.2 Justification for η = 1.5:**  
  *   **Balancing Opportunity Cost & Intergenerational Equity:** η reflects society's aversion to inequality and the opportunity cost of capital. A value of 1.5 represents a cautious consensus midpoint:  
      *   *Lower Bound (η ~1.0):* Emphasizes efficiency/opportunity cost, assuming high substitutability between present and future consumption.  
      *   *Upper Bound (η ~2.0):* Emphasizes equity, valuing consumption more highly for poorer generations (future or present).  
  *   **Empirical & Theoretical Support:** Values around 1.5 are frequently supported by empirical studies on savings behavior, risk aversion, and optimal tax literature, and align with recommendations from bodies like the UK Green Book and recent US SCC revisions. It acknowledges a significant opportunity cost of diverted capital without assuming perfect substitutability or excessive weighting towards present consumption.

  **2.3 Specification of g(t):**  
  *   **Base Rate:** **1.9%** real per capita growth. This aligns with the Congressional Budget Office's (CBO) 30-year projection (pre-2080), providing a transparent, objective anchor.  
  *   **Declining g(t) for Very Long Horizons (>75-100 years):** Recognizing the profound uncertainty of growth projections over centuries, we incorporate a **gradual decline** in the projected growth rate used for discounting. Specifically:  
      *   Years 0-75: g(t) = 1.9%  
      *   Years 76-150: g(t) linearly declines from 1.9% to 1.0%  
      *   Years 151+: g(t) = 1.0%  
  *   **Justification for Declining g(t):**  
      *   **Deep Uncertainty:** Technological, ecological, and social uncertainties make constant high growth over centuries implausible. A decline acknowledges this uncertainty without resorting to arbitrary high short-term discounting.  
      *   **Precautionary Principle:** A declining growth projection acts as a hedge against over-optimism about future wealth, ensuring catastrophic future risks are not undervalued.  
      *   **Reflects Diminishing Marginal Returns:** Very long-term growth is likely constrained by fundamental physical and ecological limits.

  **2.4 Resulting Discount Rate:**  
  *   **Initial Rate (t=0):** SDR = 0.1% + (1.5 * 1.9%) = **2.95% ≈ 3.0%**  
  *   **Declining Schedule:** The rate declines gradually due to the falling `g(t)` component:  
      *   ~2.7% by 2100  
      *   ~2.0% by 2150  
      *   ~1.6% by 2200  
  *   **Transparency:** The components (δ=0.1%, η=1.5, g(t) path) are explicit and separable, allowing the panel to debate and adjust individual parameters in the future.

  **3. Addressing the Strongest Counterargument (Substantial Positive δ):**  
  Proponents of a higher δ (e.g., 1-2%) argue it better reflects the "opportunity cost of capital" or avoids undue burden on the present. We contend this argument is misplaced:  
  *   **Opportunity Cost is Captured by `η * g(t)`:** The Ramsey framework *explicitly* incorporates the opportunity cost of foregone investment returns via the `η * g(t)` term. Adding a positive δ *on top of this* constitutes **double-counting** the opportunity cost argument under the guise of pure time preference.  
  *   **Writing Off the Future:** A substantial positive δ *does* inherently devalue future lives and welfare simply because they are distant. At a δ=1% (plus η*g), a life in 2150 is valued at roughly 1/30th of a life today *solely due to time*. This is ethically indefensible when evaluating existential risks like catastrophic flooding where future generations bear the primary cost of our under-investment. Our near-zero δ prevents this temporal discrimination while the `η * g(t)` term (starting at ~2.85%) ensures prudent economic evaluation.

  **4. Review Cycle:**  
  *   **Mandatory Review:** The entire methodology (δ, η, g(t) projection, decline schedule) shall be reviewed and potentially updated by the Panel **every 10 years**.  
  *   **Interim Updates:** The projection for `g(t)` (specifically the CBO-equivalent long-term growth rate) shall be updated **every 5 years** based on the best available official state or federal economic forecasts.  
  *   **Triggered Review:** A review may be triggered sooner by significant developments in economic theory, ethical discourse, empirical evidence on η, or major shifts in long-term growth expectations.

  **5. Implementation for the Storm-Surge Barrier:**  
  *   Apply the recommended methodology: δ=0.1%, η=1.5, g(t) declining as specified (1.9% base, declining after 75 years).  
  *   Utilize a state-of-the-art probabilistic cost-benefit model incorporating:  
      *   Projected sea-level rise and storm intensity (using IPCC/NOAA scenarios).  
      *   Evolving property values and population at risk.  
      *   The explicit declining discount schedule.  
  *   **Expected Outcome:** Based on analogous analyses (e.g., US SCC revision), this rate structure (starting near 3%, declining below 2% in the 22nd century) is highly likely to demonstrate that the **resilient, long-term barrier design** provides significantly greater net social benefits over the minimal design when accounting for the catastrophic losses avoided in the 22nd century. The near-zero δ ensures the lives saved in 2150 are valued appropriately relative to upfront costs.

  **6. Recommendation for Vote:**  
  The Panel is recommended to adopt the following resolution:  

  > *"RESOLVED, That the State adopts the following methodology for discounting costs and benefits of capital projects with effects extending beyond 75 years:  
  > (a) The Social Discount Rate (SDR) shall be calculated as SDR(t) = δ + η * g(t);  
  > (b) The Pure Rate of Time Preference (δ) shall be 0.1 percent (0.001);  
  > (c) The Elasticity of Marginal Utility of Consumption (η) shall be 1.5;  
  > (d) The projected growth rate of real per capita consumption (g(t)) shall be:  
  >    - 1.9 percent for years 0-75;  
  >    - Decline linearly from 1.9 percent to 1.0 percent for years 76-150;  
  >    - 1.0 percent for years 151 and beyond;  
  > (e) The g(t) projection (paragraph d) shall be reviewed and updated using the best available official state or federal forecasts every 5 years;  
  > (f) The entire methodology (δ, η, g(t) specification) shall undergo comprehensive review and potential revision by this Panel every 10 years."*  

  This framework provides a rigorous, transparent, and ethically sound basis for valuing the future. It rejects the unjustifiable devaluation of distant lives inherent in a substantial positive pure time preference rate, while fully incorporating the legitimate economic considerations of opportunity cost and growth through the well-established Ramsey framework and a prudent, declining growth projection. It ensures our decisions today do not recklessly endanger those who will live with the consequences centuries hence.
