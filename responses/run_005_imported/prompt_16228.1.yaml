  }
  ```  

  **Recommendation**: Suggest Denise review non-commutativity counterexamples (e.g., Van Fraassen's "Jeffrey shifts" or the cloth example extended to multiple properties). Her core understanding is strong, but part (d) requires deeper attention to partition-dependence.
