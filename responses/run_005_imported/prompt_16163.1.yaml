answer: |-
  ## The Jade Gambit: A Clash Over Rigid Designation

  **(The scene: Two philosophers, Dr. Lena Aris (pro-Kripkean) and Dr. Marcus Bell (skeptic), debate over coffee.)**

  **Aris:** Marcus, your jade example *feels* like a counterexample, but it’s a mirage. Kripke’s framework handles it perfectly. ‘Jade’ was never a *natural kind term* in the Kripkean sense. It was always a *folk category* based on observable properties – toughness, colour, workability. It never rigidly designated a *single* hidden essence.

  **Bell:** That’s too quick, Lena. Pre-mineralogy, people used ‘jade’ exactly *as if* it picked out a single natural kind. They assumed there *was* an underlying essence common to all jade objects. Kripke’s account *predicts* that discovering the essence (like H2O for water) reveals a necessary truth. But here, we discovered *two* essences! Where’s the necessary identity? ‘Jade is jadeite’ is false. ‘Jade is nephrite’ is false. Where’s the ‘water=H2O’ moment?

  **Aris:** The ‘water=H2O’ moment happened when mineralogy *refined* the concept. *Now*, ‘jadeite’ rigidly designates NaAlSi₂O₆, and ‘nephrite’ rigidly designates Ca₂(Mg,Fe)₅Si₈O₂₂(OH)₂. ‘Jade’ persists as a useful *non-rigid* term for either, based on surface properties. The rigidity applies to the *scientific* kind terms that emerged from the discovery, not the pre-scientific placeholder.

  **Bell:** But that’s conceding my point! Kripke and Putnam claimed their model applied to *ordinary language* natural kind terms *as used*. ‘Water’ worked that way pre-science – people pointed to stuff and assumed an essence. ‘Jade’ worked identically. The *difference in outcome* reveals the flaw: rigid designation to a hidden essence isn’t the *norm* for ordinary kind terms. Many are *cluster concepts* – ‘jade’ means ‘stuff that looks/feels/works like *this*’. Discovering dual essences *corrects* the cluster, it doesn’t reveal a necessary identity we were wrong about.

  **Aris:** Hold on. Even pre-science, ‘water’ had a *causal-historical chain* pointing back to H2O samples. ‘Jade’ points back to *both* jadeite *and* nephrite samples! There’s no *single* kind being rigidly designated because the reference was *ambiguous* from the start, fixed only by surface properties. The discovery *disambiguated* it into two rigid designators. The Kripkean machinery explains the *disambiguation*, not a failure of rigidity.

  **Bell:** Ambiguity implies *multiple* possible rigid designations. But did anyone pre-1863 think ‘jade’ might refer to *two fundamentally distinct substances*? No! They thought it referred to *one* substance with variable properties. The necessity claim fails because the term wasn’t *latently* rigidly designating *either* specific mineral. It was designating a *role* defined by appearance and use. Kripke’s model assumes a *unique* essence waiting to be found. Jade shows that assumption is often false for ordinary language kinds.

  **Aris:** Isn’t your ‘cluster concept’ just admitting that ‘jade’ was *never intended* as a natural kind term in the deep sense? It was a practical, functional classification. Kripke’s paradigm cases – ‘water’, ‘gold’, ‘tiger’ – *were* intended to pick out fundamental kinds. ‘Jade’ was more like ‘pencil’ or ‘virus’ (pre-microscopy) – terms for things defined by effect or appearance, not deep structure. The necessary a posteriori holds for terms *meant* to track essences.

  **Bell:** That’s an artificial distinction! How do you determine a term’s ‘intention’ historically? People pointed to ‘water’ and ‘jade’ with the *same* epistemic stance: “That stuff has a hidden nature making it what it is.” The difference is purely *a posteriori*: for water, the hidden nature was uniform; for jade, it wasn’t. Kripke’s account *overgeneralizes* from the water case. Jade proves that for many ‘natural kind’ terms in ordinary use, discovering the microstructure doesn’t yield necessity (‘this *is* jadeite’), but mere *sufficiency* (‘this *counts as* jade because it satisfies the cluster’).

  **Aris:** But what *fixes* the reference of the cluster? Ultimately, samples in the world with microstructures! We baptize samples. For ‘water’, all relevant samples shared H2O. For ‘jade’, baptized samples had *either* NaAlSi₂O₆ *or* Ca₂(Mg,Fe)₅Si₈O₂₂(OH)₂. The rigidity isn’t broken; it’s bifurcated. ‘Jade’ remains a non-rigid shorthand for the disjunction ‘jadeite or nephrite’. The core Kripkean insight – that identity statements involving rigid designators are necessary if true – holds for ‘jadeite = NaAlSi₂O₆’ and ‘nephrite = Ca₂(Mg,Fe)₅Si₈O₂₂(OH)₂’.

  **Bell:** Precisely! The *only* necessities emerge for the *newly minted scientific kinds*. The *original* ordinary language term ‘jade’ *didn’t* yield a necessary a posteriori truth. It yielded a *contingent* disjunction: ‘Jade is jadeite or nephrite’ is true, but contingent – we could have found only one mineral, or three! The *necessary* truths are confined to the scientific reformation. This shows the Kripke/Putnam picture doesn’t *generalize* to ordinary language as robustly as claimed. Jade exposes that many natural-kind terms are, at root, functional cluster terms, not essence-trackers. The ‘tidy’ necessary a posteriori is the exception, born of uniform hidden structures, not the rule of language.

  **Aris:** ...So you’re saying ‘jade’ is a messy case because the world was messier than our initial presupposition of uniformity? Fine. But it doesn’t break the model; it just shows rigid designation applies cleanly only when there *is* a uniform essence to designate. ‘Jade’ was imprecise, not a counterexample to the semantics of rigid designation itself.

  **Bell:** And that *imprecision*, Lena, inherent in so many ordinary kind terms, is precisely why Kripke’s necessary a posteriori isn’t the universal key to natural kinds he promised. Jade is the rule, not the exception. Science often corrects clusters, not essences.
