answer: |-
  ## The Arbitrary Abyss: Nihilism, Universalism, and the Search for Compositional Principle

  The Special Composition Question (SCQ) – "When do some things compose something?" – probes the fundamental structure of reality. It asks not just *how* parts relate to a whole, but *whether* a whole exists at all given certain parts. While common sense suggests answers like "when they are fastened together" or "when they form a living organism," Peter van Inwagen's potent critique exposes a deep problem: such "restricted" or "moderate" answers appear inevitably **arbitrary**. This critique forces the question: must we abandon moderate answers and embrace one of the stark extremes – **nihilism** (nothing composes anything; only mereological simples exist) or **universalism** (any collection of objects, however scattered or disparate, composes a further object) – to avoid arbitrariness? While vague and contextualist alternatives offer refuge, van Inwagen's challenge ultimately pushes us towards the extremes, and universalism emerges as the most plausible, though costly, solution.

  **Van Inwagen's Arbitrariness Argument:** Van Inwagen argues that any proposed non-extreme condition for composition (C) faces a dilemma. Either:
      1.  **The Continuum Problem:** We can construct a continuous series of cases between clear instances satisfying C and clear instances *not* satisfying C. Any precise boundary drawn along this continuum appears arbitrary – why *here* and not one atom closer?
      2.  **The Borderline Case Problem:** If we try to avoid arbitrariness by making composition *vague* (admitting borderline cases), we haven't truly answered the SCQ. The question demands a general *ontological* principle, not an admission of semantic indecision. Vagueness about *when composition occurs* implies vagueness in *existence itself* – a notion van Inwagen finds deeply problematic, as existence seems an all-or-nothing affair.

  Consider "fastening." Is a watch composed because its gears are screwed together? What if one screw is loose? What if the parts are glued? Superglued? Resting together in a bag? Held by weak magnets? Van Inwagen contends that any precise threshold for "sufficient fastening" is arbitrary. Similarly, while he endorses composition for living organisms (a rare restricted view), he acknowledges the difficulty in precisely defining "life" at the boundaries (e.g., viruses, dying organisms). The moderate answer, he argues, either draws an indefensible line or collapses into vagueness about existence.

  **The Extremes: Principle Without Compromise**
  Nihilism and universalism avoid this arbitrariness by providing simple, universal, and precise principles:
  *   **Nihilism:** Composition *never* occurs. Only fundamental simples exist. There are no tables, chairs, mountains, or organisms – just simples arranged "table-wise," "chair-wise," etc. The cost is radical: denying the existence of virtually all objects of everyday experience and scientific inquiry. We must explain away the apparent truth of statements like "There is a table in the room."
  *   **Universalism:** Composition *always* occurs. Any plurality of objects, regardless of their spatial relations, causal interactions, or kind, composes a further object – a mereological sum or fusion. This includes the table, the fusion of the table and the moon, the fusion of my left shoe and the Eiffel Tower, and the infamous "trout-turkey" (the fusion of a trout and a turkey). The cost is ontological profligacy: populating the world with countless bizarre, causally inert, and seemingly gratuitous objects like trout-turkeys and scattered "incars" (fusions including a car and its interior).

  **The Allure of Alternatives: Vagueness and Contextualism**
  Van Inwagen's argument seems to force this binary choice. However, can moderate views evade arbitrariness through vagueness or contextualism?
  *   **Ontological Vagueness:** Some argue that composition itself can be vague, meaning there are genuine borderline cases where it's indeterminate whether a whole exists. This directly challenges van Inwagen's claim that existence cannot be vague. While it avoids a sharp boundary, it replaces arbitrariness with ontological indeterminacy. For many, this is equally unpalatable. If existence is vague, what *is* the world fundamentally like? This seems to undermine the quest for a clear ontological inventory.
  *   **Contextualism/Semantic Relativism:** Perhaps "compose" or "object" is context-sensitive. In an everyday context, fastening might suffice for composition; in a fundamental physics context, only simples exist. The SCQ, on this view, has no single ontological answer; it depends on our interests or linguistic framework. While this preserves ordinary objects in their context, it arguably dodges the *metaphysical* core of the SCQ. Van Inwagen seeks an answer about what things *fundamentally exist*, independent of human interests. Contextualism seems to offer pragmatic linguistic rules, not deep ontological insight. Where does the contextual variation *stop*? Doesn't the demand for a fundamental ontology remain?

  **Verdict: The Plausibility of Universalism**
  While both extremes avoid arbitrariness, universalism is the more plausible option. Nihilism's cost is simply too high. Denying the existence of organisms, artifacts, and mountains requires an incredibly revisionary metaphysics and semantics, forcing constant paraphrase ("there are simples arranged table-wise here") that struggles to fully capture the apparent truth and causal efficacy of composite objects. Science and daily life constantly affirm their reality.

  Universalism, despite its profligacy, avoids this denial. It readily accommodates ordinary composite objects: tables, chairs, and organisms are simply *some* of the fusions that exist. The existence of trout-turkeys is the price paid for this accommodation and ontological uniformity. However, this cost is more manageable:
  1.  **Epistemic/Causal Inertia:** Trout-turkeys and scattered fusions are typically causally inert *as wholes* and epistemically inaccessible. They don't *do* anything extra or disrupt the causal order; they are simply there. Their existence is ontologically extravagant but practically inert.
  2.  **Systematicity and Parsimony at the Fundamental Level:** Universalism provides a maximally simple and non-arbitrary compositional principle. While it multiplies objects, it does so based on a single, clear rule applied uniformly. It avoids the complex, ad-hoc conditions of moderate views and the radical eliminativism of nihilism. Its "bloat" is systematic and predictable.
  3.  **Accommodating Vagueness/Context at the Derivative Level:** Universalism can readily explain the *apparent* vagueness or context-sensitivity of ordinary objects. What we *count as* a single object (a "table," a "mountain") depends on our interests, conventions, and the causal/functional cohesion of certain fusions. The vagueness lies in our *concepts* and *reference*, not in the underlying existence of the fusions themselves. The fundamental ontology (all fusions) is precise; the vagueness is semantic or pragmatic. This is preferable to vague existence.

  **Conclusion: Embracing the Fusion**
  Van Inwagen's powerful critique successfully exposes the deep arbitrariness lurking within most moderate answers to the SCQ. While vague and contextualist alternatives attempt to soften the blow, they struggle to provide a satisfying *ontological* resolution, often shifting the problem rather than solving it. This forces a serious consideration of the extremes. Nihilism, while principled, demands an untenable revision of our basic ontology, denying the world as we experience and interact with it. Universalism, despite populating the world with countless strange fusions, offers a principled, uniform, and ontologically robust solution. It preserves ordinary objects while explaining why we focus on *them* and not trout-turkeys. The existence of gratuitous fusions is indeed strange, but it is a cost paid in the currency of ontological excess rather than the devastating currency of eliminativism or the hidden instability of arbitrary boundaries. In the quest for a non-arbitrary answer to the SCQ, universalism's systematic clarity and ability to ground our ordinary world make its peculiar menagerie the most acceptable burden to bear. The universe, on this view, is indeed a plenum of fusions, and our ordinary world consists of the particularly salient and useful ones.
