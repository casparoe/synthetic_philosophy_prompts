  - **S-Tier**:  
    - **Preregistration** eliminates hidden researcher degrees of freedom (HARKing, p-hacking).  
    - **Mayo's severity** forces high-capacity tests, directly combating low-power/noisy research.  
    - **Dropping significance testing** attacks the core fallacy of dichotomizing evidence, refocusing on quantitative estimation.  

  - **A-Tier**:  
    - **Direct replication** targets verification deficits (the crisis's core symptom).  
    - **Multiverse analysis** exposes analytical flexibility, reducing selective reporting.  
    - **Open data/code** enables scrutiny/replication but doesn't prevent initial poor design.  

  - **B-Tier**:  
    - **Adversarial collaborations** mitigate confirmation bias but are niche/not scalable.  
    - **Bayes factors** improve interpretation but don't fix poor design/p-hacking.  

  - **C-Tier**:  
    - **Lowering p-threshold** reduces false positives but ignores p-hacking/incentives (a band-aid).  

  *Note: No "D-tier" items. Even cosmetic changes have minor utility, but lowering p-threshold is the most superficial fix.*
