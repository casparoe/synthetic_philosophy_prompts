answer: |-
  Here is a dialogue between two philosophers, **Alex** (defending the reality of moral luck, à la Nagel/Williams) and **Sam** (defending the control principle, à la Zimmerman), engaging deeply with the reckless driver case and core objections. Both aim for steelmanning and concede points where needed.

  ---

  **Setting:** A university common room, coffee in hand.

  **Alex:** Sam, I’ve been wrestling with this reckless driver case. Two drivers, equally distracted and speeding through a residential area—say, both texting at 50mph in a 25mph zone. Driver A hits a child who darts out; the child dies. Driver B, in identical conditions, has no child dart out and arrives home safely. We punish Driver A with manslaughter charges and lifelong guilt. Driver B gets a ticket, if caught at all. But their *choices* were identical. Doesn’t this show moral luck? Driver A isn’t *more reckless*—they’re just *unlucky*. Yet we treat them as more blameworthy.

  **Sam:** Alex, I agree the *outcomes* differ radically, and our *reactions* differ. But that doesn’t prove moral luck. The control principle holds: true blameworthiness tracks only what’s in the agent’s control—their intentions, knowledge, and choices. Both drivers exhibited the *same* blameworthy recklessness. The difference in outcome is pure luck, so it *can’t* affect their *intrinsic* moral status. What changes is our *epistemic access*: the tragedy gives us vivid evidence of how dangerous Driver A’s choice was. We *already* condemn recklessness abstractly, but seeing its worst possible consequence makes us *feel* its gravity more. That’s not moral luck—it’s psychological emphasis.

  **Alex:** But Sam, if it’s *just* about evidence, shouldn’t Driver B feel *just as guilty* as Driver A? After all, Driver B knows they rolled the dice on a child’s life and got lucky. Yet Driver B typically feels mild shame, while Driver A is crushed by agent-regret—a unique moral emotion Williams called “a regret that one is *the agent* of the outcome.” That seems to acknowledge a *special* moral burden tied to the actual outcome.

  **Sam:** I’ll concede agent-regret *feels* different, but feelings aren’t proof of moral reality. Driver B *should* feel profound guilt—they gambled with lives and won. If they don’t, it’s a moral failing, not proof that Driver A’s actual outcome creates new duties. The control principle demands consistency: if two agents have identical control over their actions, their moral desert must be identical. Any differential treatment is pragmatic or psychological—not a difference in *blameworthiness*.

  **Alex:** Let’s test that. Suppose Driver A wants to atone. They compensate the family, speak publicly about road safety, carry lifelong grief. Are these actions morally superfluous? If Driver B is *equally* blameworthy, why don’t we demand they do the same? And if Driver B *did* try to atone identically, we’d find it bizarre—even self-indulgent.

  **Sam:** Not necessarily. Driver A’s reparative actions address the *actual harm they caused*, which Driver B didn’t. But that’s about *remedying consequences*, not about their *initial blameworthiness*. Driver B’s duty is to reform and never repeat the recklessness. Driver A’s additional duties flow from the *causal role* they played in the harm—not from being *more blameworthy* initially. The control principle isolates the *original act*; post-harm obligations are separate.

  **Alex:** But Williams argues that agent-regret reveals a deeper truth: moral agency is *essentially* embedded in the world. Luck isn’t an external contaminant—it’s woven into how we judge *persons*, not just acts. When we blame Driver A more, we’re acknowledging that morality isn’t a sealed courtroom of intentions. It responds to the actual shape of the damage we do. Nagel’s “resultant luck” shows that outcomes *retroactively* alter the moral description of the act. “Killing a child by recklessness” is a worse act than “risking a child’s life by recklessness”—even if the risk is identical.

  **Sam:** That’s where I push back hardest. Calling it “resultant luck” smuggles in the very thing we’re debating! Zimmerman’s insight is that “killing” isn’t a *moral* description of the act *as committed*. At the moment of acting, Driver A only “recklessly endangered lives.” The *killing* is a later event, outside their control. To say the act “becomes worse” when the child dies is like saying a lottery ticket “becomes” more valuable after the draw. The ticket’s value was always probabilistic; the outcome just reveals it. Similarly, Driver A’s recklessness always had high *objective risk*, but their *culpability* is fixed at the time of acting.

  **Alex:** But Sam, imagine both drivers confess in court. Driver A says, “I killed a child.” Driver B says, “I could have killed a child.” The first statement isn’t just *empirically* different—it’s *morally* heavier. And it’s not just societal bias—Driver A *themselves* feels this weight. Williams would say agent-regret isn’t confusion; it’s the rational response of a moral agent who sees their act as *constituted* by its results. Denying this demands an inhuman detachment from our own agency.

  **Sam:** I’ll grant this: our emotions and social practices *are* asymmetrical, and perhaps unavoidably so. But philosophy should refine practice, not capitulate to it. We *should* cultivate in Driver B the same depth of remorse Driver A feels, because the *wrong* they committed—disregarding human life—is identical. The control principle is a *corrective*: it urges us to blame based on controllable factors to avoid arbitrariness. Otherwise, we’re morally penalizing luck. That’s unjust.

  **Alex:** What if the asymmetry isn’t injustice, but a necessary feature of morality? Take your “evidence” point. If we *only* blamed based on what was knowable *ex ante*, Driver B’s near-miss would be *irrelevant* to judging them. But we *do* treat it as a wake-up call—for the driver *and* society. That suggests outcomes shape our moral understanding in ways pure intent can’t. Still, I’ll concede this: the control principle is a powerful bulwark against scapegoating. We shouldn’t blame Driver A for *being unlucky*. But we *should* acknowledge their unique moral position *after* the outcome. Agent-regret isn’t about self-flagellation—it’s about owning the actual moral narrative of your life, which includes luck’s role.

  **Sam:** And I’ll concede that post-outcome, Driver A has special obligations Driver B lacks (e.g., reparations). But those stem from their *causal role in harm*, not greater *original sin*. Where we disagree is whether the *core blameworthiness* differs. I say no; you say yes. Perhaps the compromise is this: the control principle governs *culpability*, while moral luck shapes *moral meaning*. But I still insist: calling it “moral luck” risks legitimizing what’s really a psychological or practical response.

  **Alex:** And I maintain that separating “culpability” from “moral meaning” fractures what Williams called the “agent’s perspective.” To the driver holding the dead child, their guilt isn’t a legal fiction—it’s the truth of what they *did*. But I respect your consistency. We agree on the facts, disagree on what they imply. That’s why Nagel called it a “paradox”—it resists neat solutions.

  **Sam:** Exactly. And your engineer’s story? Under the control principle, both engineers were equally blameworthy for reckless deployment. The outage merely revealed the risk we’d overlooked. But I’d add: the second engineer’s agent-regret? It’s understandable, even admirable—but not proof they were *more wrong*.

  **Alex:** And I’d say: the outage didn’t just *reveal* the risk—it *transformed* the moral stakes. That’s why the postmortem treated them differently. We can call it “luck,” but it’s real in its consequences. Thanks, Sam—this helped clarify the stalemate.

  ---

  **Key engagements covered:**  
  1. **"Better evidence" vs. moral difference:** Sam argues outcomes provide *evidence* of pre-existing risk; Alex counters that outcomes *redefine* the act morally (e.g., "killing" vs. "risking").  
  2. **Agent-regret's significance:** Alex claims it reflects a rational moral response to being the cause of harm; Sam calls it a feeling we *should* extend to near-misses.  
  3. **Concessions:**  
     - Sam grants *post-harm obligations* differ but insists *original blameworthiness* does not.  
     - Alex grants the control principle prevents arbitrary blame but maintains moral luck shapes an agent’s irreducible moral experience.  
  4. **Strongest points:**  
     - Sam: Upholding the control principle avoids punishing luck, ensuring blame tracks only controllable factors.  
     - Alex: Moral judgments are embedded in outcomes; denying this severs morality from lived experience.  

  This mirrors the unresolved tension in the literature: a clash between moral purity (control) and moral phenomenology (luck). Neither "wins," but the dialogue clarifies why both perspectives persist.
