  However, in "The Four Great Errors," Nietzsche uses Cornaro to illustrate a different point. Nietzsche criticizes Cornaro for universalizing his dietary advice. Cornaro thought his diet was good for everyone, but Nietzsche argues that what is good for one (a convalescent like Cornaro) may not be good for another. The error is the confusion of cause and effect (Error 3 in the chapter) and the error of false causality. Specifically, Cornaro believed his diet caused his longevity, but Nietzsche suggests that his longevity might have been due to his slow metabolism, and the diet was merely a consequence of that. Moreover, Nietzsche uses this to show that moralists make the same mistake by prescribing universal moral laws without considering individual differences.

