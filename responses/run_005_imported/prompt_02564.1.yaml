answer: |-
  Your grasp of Aquinas is impressively solid, and Fra Silvestro's reasoning is **fundamentally accurate** to the core Thomistic distinctions. You've avoided the common oversimplifications and captured the nuanced heart of Aquinas's position. Let's break it down point-by-point:

  1.  **The Core Distinction (Usurper vs. Legitimate-Turned-Tyrant):**
      *   **This is ABSOLUTELY Aquinas's own distinction.** He makes it explicitly in *Summa Theologica* II-II, Q. 42, A. 2 ("Whether sedition is always a mortal sin?"), specifically in the reply to Objection 3, and it underpins his entire discussion of resistance.
      *   Aquinas argues that overthrowing a *legitimate ruler who has become tyrannical* is **sedition** and a mortal sin *if done by private individuals*. The remedy must come from a higher public authority or the community acting collectively through due process (if possible).
      *   However, resisting someone who seized power *by force* and *lacks any legitimate title* ("tyrannus in principatu acquisito per violentiam") **is not sedition**. This person is essentially a powerful criminal ("magnus latro" - a great robber), not a true ruler. Resistance here is framed as defense against aggression.

  2.  **The "Private Judgment" and "Tacit Mandate" Wrinkle:**
      *   **You are CORRECT, and this is crucial.** Aquinas is **extremely wary** of private individuals taking it upon themselves to kill *any* ruler, even a usurper-turned-tyrant. His primary remedy for the *usurper* is **public action**.
      *   **Where Aquinas Opens the Door (Carefully):** In *ST* II-II, Q. 42, A. 2, ad 3, he states that *if there is no hope of recourse to a higher authority*, then it "does not belong to sedition to deliver the multitude from a tyrannical government" when resisting someone who *usurped* power. He explicitly contrasts this with resisting a *legitimate* ruler who became tyrannical.
      *   **The "Tacit Mandate" Implied:** This is where your "tacit mandate" idea fits well. Aquinas doesn't use that exact phrase in this context, but the logic is inherent. By framing the usurper as a "public enemy" (*hostis publicus*) rather than a true ruler, resistance becomes an act of *collective self-defense* undertaken by those who *would* have the authority to act *if* they could formally assemble or had established mechanisms. The individual acting against the usurper is implicitly acting *on behalf of the endangered community* when formal public action is impossible. It's less a formal mandate and more the inherent right of a community to defend itself against an aggressor who falsely claims rulership.
      *   **The Caveat - Proportionality & Imminence:** Aquinas wouldn't endorse just *any* killing. The action should be necessary, proportionate to the threat, and aimed at freeing the community. It's not a license for assassination based on personal grievance, but a last-resort defense against an ongoing, dangerous aggression.

  3.  **Strengthening Fra Silvestro's Speech (Minor Tweaks for Thomistic Precision):**
      *   **"Consent of the commune"**: Perfect. Aquinas emphasizes the people as the source of legitimate authority for rulers not appointed by a higher power (like the Emperor or Pope). (*ST* I-II, Q. 90, A. 3; Q. 97, A. 3 ad 3; *De Regno* I, 6).
      *   **"Owed a different reckoning"**: Good. Emphasize the *sedition* angle for the legitimate-turned-tyrant: "...is owed patience and remedy sought *only* through public authority or a superior power, lest the sin of sedition stain the act. For a private man to strike..."
      *   **"No private man may set himself up as its avenger"**: **Spot on.** This is pure Aquinas. Emphasize the *danger of precedent*: "...and no private man may licitly set himself up as judge and executioner. For this opens the door to chaos, where tomorrow..."
      *   **"Robber grown large" / "Felling any thief"**: **Directly Thomistic!** Aquinas uses *latro* (robber/brigand) explicitly for usurpers (*ST* II-II, Q. 42, A. 2 ad 3; *De Regno* I, 6). This analogy is central. Fra Silvestro could even quote it: "For as the Angelic Doctor teaches, such a one is no true prince, but *magnus latro* – a great robber preying upon the commonwealth. To resist him, even unto death if necessary and no other remedy exists, is not murder, but defense against a predator, like felling a wolf or a brigand on the road."
      *   **Adding the "Last Resort" Nuance:** To make it fully Thomistic, Fra Silvestro should subtly emphasize the *necessity* and *lack of alternative*: "...one who never held any office *by just title*, but rules only through violence and fear, *is* a robber grown large. **Where the commonwealth suffers grievously and there is no hope of appeal or lawful assembly,** to fell such a man, acting as the arm of the oppressed multitude, is..."

  4.  **A Potential Thomistic Wince Spot (Proportionality & Danger):**
      *   Aquinas emphasizes that the tyranny must be truly **intolerable** and **dangerous to the community** (*periculosum* - *De Regno* I, 6) to justify extreme action, even against a usurper. Fra Silvestro might subtly acknowledge this threshold: "...who has spent years *cruelly oppressing* the city, *squeezing its lifeblood with unjust exactions and sowing fear with reprisals*, such that the common good is utterly subverted..." This grounds Costanza's case firmly within Aquinas's criteria for justified action.

  **Revised Snippet incorporating tweaks (focusing on Thomistic precision):**

  "My daughter, you ask if the man may be killed as one kills a wolf. Consider first how he came to rule us: not by the consent of the commune, nor by any right of succession, but by armed men in the piazza at night. A prince who is given his office by the people and only afterward turns cruel is owed a different reckoning. His remedy belongs to those who made him – the commune itself, or whatever higher authority God has ordained – **and no private man may licitly set himself up as judge and executioner, lest we open the gates to chaos where tomorrow any hothead may strike down a lawful lord he judges harsh.** But the second sort of man... he holds power by violence alone, without just title. **As the Angelic Doctor teaches, such a ruler is no prince at all in the eyes of God, but a *magnus latro* – a great robber preying upon the body of the commonwealth.** **Where the tyranny is grievous and intolerable, stripping the people of justice and peace, and where no hope remains of appeal or lawful assembly for redress...** then to fell him, **acting as the arm of the oppressed multitude,** is no more a sin than felling any thief who waylays you on the road. It is defense against a predator who devours the flock."

  **Why this works:**

  1.  **Accurate Distinction:** Clearly separates usurper vs. legitimate-turned-tyrant.
  2.  **Rejects Private Vengeance:** Explicitly forbids private action against legitimate (even tyrannical) rulers, citing the danger of anarchy.
  3.  **Usurper as "Latro":** Uses Aquinas's own powerful analogy.
  4.  **Public Mandate Implied:** Frames action against the usurper as acting *for the multitude* when formal mechanisms fail ("acting as the arm of the oppressed multitude").
  5.  **Threshold Condition:** Includes the Thomistic requirement of grievous, intolerable tyranny and lack of alternative ("grievous and intolerable... no hope remains...").
  6.  **Dominican Voice:** References "the Angelic Doctor" naturally.

  **Conclusion:** You nailed the core Thomistic doctrine. Fra Silvestro's reasoning is historically plausible and theologically sound for a 14th-century Dominican familiar with the *Summa*. The minor tweaks suggested simply sharpen the focus on Aquinas's specific language (like *magnus latro*), his emphasis on *public action/remedy first*, his rejection of *private judgment* for killing rulers, and the high threshold of *necessity/intolerability* required even for action against a usurper. Your philosophy PhD reader should nod in approval, not side-eye. Well done!
