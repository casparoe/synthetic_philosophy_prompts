  The user's deeper need might be understanding why Rawls' approach is valid despite seeming counter to standard decision theory. They might be seeking stronger arguments to defend or critique Rawls in their academic work. Addressing the philosophical underpinnings—like the moral versus rational justification, the role of primary goods, and the critique of utilitarianism—will be key. Highlighting Rawls' focus on stability and the basic structure could also clarify his departure from Harsanyi.
answer: |-
  You've hit on one of the most persistent and sophisticated critiques of Rawls! This isn't sloppiness on Rawls' part, but a deliberate and philosophically grounded rejection of the Bayesian/Harsanyian approach. Here's why Rawls thinks maximin is rational *in the specific context of the Original Position*:

  1.  **The Radical Nature of the Uncertainty (Not Risk):** Rawls argues the Veil of Ignorance creates a situation of **radical uncertainty**, not merely calculable risk.
      *   **Harsanyi (Risk):** Assumes agents *know* the possible social positions and can assign *meaningful, objective probabilities* to ending up in each (usually equal by default). This is a situation of *risk*. Maximizing expected utility is standard.
      *   **Rawls (Uncertainty/Knightian Ambiguity):** Argues that behind the Veil, individuals have *no basis whatsoever* for assigning probabilities to the various social positions. They lack any knowledge of the structure of their society, its history, or the distribution of natural talents. This isn't rolling dice with known odds; it's facing a complete unknown. It's **uncertainty in the Knightian sense (ambiguity)**. Rational choice under deep ambiguity often departs from expected utility maximization.

  2.  **The Stakes Are Too High (The "Disastrous" Outcome):** Rawls emphasizes that the choice in the Original Position is about designing the *basic structure of society* governing one's *entire life*. The worst-off position could be utterly catastrophic – a life of crushing poverty, oppression, or deprivation of fundamental goods.
      *   The Bayesian approach averages out these extremes. You might accept a society with extreme suffering if it boosts the average enough, hoping you won't be the unlucky one.
      *   Rawls argues it's irrational to gamble with your *most fundamental rights and life prospects* when the potential loss (ending up in the worst-off position) is truly disastrous. Maximin directly protects against this catastrophe.

  3.  **The "Special Psychology" and Focus on Primary Goods:** Rawls specifies that parties in the Original Position are mutually disinterested but rational, concerned with securing a sufficient share of "primary goods" (rights, liberties, opportunities, income, wealth, the social bases of self-respect). Crucially:
      *   They care about having *enough* of these goods to pursue their conception of the good life, not necessarily about maximizing a utility sum.
      *   Maximin, guaranteeing the highest possible minimum level of primary goods, directly satisfies this concern for securing a sufficient minimum. Expected utility maximization doesn't guarantee this minimum protection.

  4.  **Rejection of Interpersonal Utility Comparisons:** Harsanyi's derivation relies heavily on *cardinal*, interpersonally comparable utility. Rawls is deeply skeptical of this:
      *   How can we *really* compare the intensity of utility between different people? Rawls sees this as a major weakness of utilitarianism.
      *   **Primary Goods as an Objective Base:** Rawls uses an index of primary goods specifically to *avoid* relying on controversial interpersonal utility comparisons. Maximin operates directly on this objective index.

  5.  **The Purpose: Fairness, Not Optimality:** Rawls is seeking principles of *justice*, not merely efficiency or optimality. He argues that the Bayesian approach, by focusing on averages, could sanction significant sacrifices of the least advantaged if it benefits the whole (a core utilitarian flaw from his perspective). Maximin ensures that the basic structure works to the greatest benefit of those who have the least, embodying a fundamental idea of reciprocity and fairness – society should not be structured in a way that some are *unacceptably* disadvantaged. Justice requires protecting the vulnerable.

  6.  **The "Strains of Commitment":** Could individuals who ended up in the worst-off position realistically accept and abide by principles chosen under the Veil? Rawls argues that agreeing to principles that *might* leave you in a disastrous position (as the Bayesian approach allows) would place an unbearable "strain of commitment." Maximin generates principles that everyone, no matter their position, can more stably accept.

  **Was Rawls "Sloppy"? Absolutely not.** He explicitly addressed Harsanyi (in later writings like "Some Reasons for the Maximin Criterion") and deliberately constructed the Original Position to make maximin the rational choice *for this specific moral problem*. He rejected the Bayesian framework *because* he believed its assumptions (meaningful probabilities, interpersonally comparable cardinal utility) were inappropriate and led to unjust outcomes that failed to protect the vulnerable sufficiently.

  **The Core Disagreement:**

  *   **Harsanyi:** Views the Veil as a device for impartial *aggregation* of individual utilities under risk. Outcome: Average Utilitarianism.
  *   **Rawls:** Views the Veil as a device for ensuring *fairness* and *reciprocity* under radical uncertainty. Outcome: Justice as Fairness with the Difference Principle (Maximin).

  Your intuition that the Bayesian move is "obviously rational" reflects the dominance of that model in economics. Rawls' genius was in rigorously arguing that the context of choosing fundamental principles of justice requires a *different* model of rationality, one prioritizing protection against the worst-case scenario when facing profound uncertainty about one's fate and when the stakes involve one's basic liberties and life prospects. It's a profound philosophical disagreement about rationality, uncertainty, and the demands of justice, not a lapse in decision theory. Your reading group is wrestling with the very heart of 20th-century political philosophy!
