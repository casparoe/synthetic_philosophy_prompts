  so this keeps happening to me in online arguments, especially with my more logic-chopping friends, and it's been bugging me for ages. someone will point out that two things I believe logically commit me to some further claim that I find pretty gross and definately never signed up for, then act like I'm a hypocrite if I don't just bite the bullet on it. I'll grant that the conclusion really does follow from stuff I believe, I just never actually worked out the implication myself until someone spelled it out for me. does that mean I secretly believed it the whole time and just didn't realize it, or is there something off about holding people to literally every logical consequence of their stated views? it feels kind of like a motte-and-bailey but I don't think thats actually the right concept for it.
