prompt: |-
  So this is a bit of a rabbit hole from a philosophy of causation seminar I'm sitting in on. We spent basically a whole session on the Suzy-and-Billy rock throwing case (Suzy's rock hits the bottle first, Billy's would've shattered it a split second later if she hadn't thrown), and it turns out this one example forced David Lewis to redo his own theory twice — first he tried "quasi-dependence," gave up on it, and ended up with this whole "causation as influence" picture about patterns of dependence instead of a plain yes/no counterfactual. Then my professor mentioned that Woodward and the structural-equations crowd (Hitchcock, Halpern & Pearl) handle the exact same case by drawing a causal graph and finding an "intrinsic process" via intervention, like its obviously the cleaner solution, except they also turn around and admit that "intervention" is itself a causal notion, so the whole thing isn't even reductive. Feels like there's a real fight hiding under the surface here about whether the interventionist move is an actual advance or just Lewis's similarity-of-worlds machinery wearing a graph-theoretic trenchcoat, and I don't know the literature well enough yet to referee it myself.

  Could you write me a dialogue that actually stages this fight? Two people, a committed Lewisian (post-"Causation as Influence") and a committed Woodward-style interventionist, stuck arguing late at a conference bar after sitting through yet another Suzy-and-Billy talk. I want real specifics, not hand-waving: the Lewisian should have to explain why quasi-dependence broke down and what influence is supposed to do differently, and should push the interventionist on whether "holding the other variables fixed" when you set up the structural equations is just a technical way of picking out a similarity ordering over worlds in disguise. But the interventionist needs to land real hits back too — like asking what the counterfactual theory even buys you if it needs constant patching every decade, and whether openly admitting non-reductiveness beats pretending a similarity metric is doing purely qualitative, non-causal work. Don't let either one cave or convert the other by the end, and don't make either of them a pushover just there to set up the other's points — I want two people who actually know this literature cold, really going at each other's specific arguments.
