answer: |-
  That's a fantastic question, and you've pinpointed two absolutely central and enduring points of contention in emergence theory, directly from Broad's seminal (and notoriously dense) text. Your chemistry background gives you a perfect lens to see both the power and the potential cracks in his formulation. Let's break down your two points, as they are deeply intertwined:

  1.  **Metaphysical vs. Epistemic Emergence: The "Cannot Be Deduced" Clause**
      *   **Your Instinct is Correct:** Broad *intends* the strong, **metaphysical claim**. He is arguing for ontological emergence – the idea that the higher-level property is a genuinely *new* kind of fact in the universe, not merely an unknown consequence of the lower-level facts.
      *   **Evidence in the Text:**
          *   He contrasts his "Emergent Theory" explicitly with "Mechanism" (pure reductionism). Mechanism *requires* deducibility in principle.
          *   The language: "irreducible fact," "non-deducible properties," "cannot be deduced... by any law of composition which has manifested itself at lower levels." The emphasis on *any* law and *manifested itself* suggests a claim about fundamental possibility, not current ignorance.
          *   The "manifested itself" phrase is crucial. He's saying that even if you know *all* the laws operating *within* lower orders (intra-ordinal laws) and *all* the trans-ordinal laws connecting *other* adjacent orders, you *still* couldn't deduce the new property for *this specific* higher order. The trans-ordinal law connecting A to B is a *fundamental, brute fact* about how A-complexes behave *when arranged specifically as B*. It's not derivable from anything more fundamental.
      *   **The Epistemic Loophole:** However, you are also absolutely right that the text *doesn't explicitly and definitively rule out* the weaker, epistemic reading. This ambiguity has been a major source of debate ever since:
          *   **Critics (e.g., later Logical Empiricists like Hempel & Oppenheim):** Argued that "non-deducibility" was always relative to the current state of science and our conceptual frameworks. What seems emergent today might be reducible tomorrow with new laws or mathematics. They saw Broad's position as potentially conflating epistemological limits with ontological ones.
          *   **Defenders of Strong Emergence:** Argue that Broad's point is precisely that *no amount* of knowledge about the lower levels and their *existing* compositional laws could *ever* allow the deduction. The trans-ordinal law is a *sui generis* law for that specific transition. Your silver chloride example resonates here: knowing *everything* about isolated silver and chlorine atoms and ions, and knowing *all* the laws of ionic bonding for simpler salts (like NaCl), might still not allow you to *deduce* the specific lattice energy, solubility, or photosensitivity of AgCl *without* empirically establishing the specific trans-ordinal law for the AgCl complex itself.
      *   **Broad's Likely Stance:** Given his overall project (defending a non-mechanistic, potentially vitalist-friendly view of life and consciousness), and his repeated emphasis on "irreducibility," he almost certainly meant the strong, metaphysical claim. He believed some phenomena *genuinely require* new fundamental laws at higher levels of organization.

  2.  **The Cohesion of the "Order": What Holds It Together?**
      *   **This is arguably the softer spot in Broad's scheme, and your suspicion is well-founded.** If only *some* properties of the "vital order" are genuinely "Ultimate Characteristics" (like reproduction), while others are "Reducible Characteristics" (like heart mechanics) and others are "Ordinally Neutral" (like mass/energy conservation), what makes "living body" a unified *order* rather than just a complex physical system exhibiting a few special tricks?
      *   **Broad's Implicit (and Potentially Problematic) Answer:** The order is defined by the **presence of at least one Ultimate Characteristic**. The existence of *even one* property that is non-deducible from the lower level *defines* a new order. The reducible and neutral properties are just along for the ride because they happen to be instantiated in systems that *also* possess the ultimate characteristic(s).
      *   **The Problem:** This can indeed make the "order" seem like an arbitrary collection. Why should "reproduction" define *the same* order as, say, "consciousness" (if he considered that emergent)? Why not multiple, overlapping orders? His hierarchy is linear and monolithic (A -> B -> C...), but reality might be messier.
      *   **What Holds It Together?** Broad relies on two things:
          1.  **Structural Composition:** Every aggregate of order B is *composed of* aggregates *exclusively* of order A. This defines adjacency. (Living bodies are composed *entirely* of physico-chemical aggregates).
          2.  **The Emergent Property(ies):** The presence of the Ultimate Characteristic(s) marks the *distinctive essence* of the order. While the *reducible* characteristics (heartbeat) are explainable by lower-level laws *plus the specific structure*, the *ultimate* characteristics require the new trans-ordinal law. The structure is necessary but insufficient without the emergent law.
      *   **The Vulnerability:** This relies heavily on the *distinctiveness* and *uniqueness* of the Ultimate Characteristic to that specific structural arrangement. Critics argue:
          *   **Multiple Realizability:** Could different lower-level structures (different chemical bases, even non-carbon-based?) potentially realize the *same* higher-level property (e.g., reproduction)? Broad's scheme struggles with this. If reproduction *can* be realized by radically different lower-level structures (different orders A?), then the trans-ordinal law linking *specific* A-structures to reproduction becomes less fundamental, and reproduction itself might point to a *functional* level not strictly tied to Broad's compositional hierarchy.
          *   **The "Grab-Bag" Concern:** If an order only requires *one* Ultimate Characteristic, why are *all* the other properties characteristic of that order bundled in? Why is the heart's reducible beating considered a property *of the vital order* rather than just a complex physical process happening *within* a vital system? Broad would say it's "characteristic" because it's a complex function *enabled by and dependent on* the overall structure maintained *by* the vital processes (including the ultimate characteristics). But the line feels blurry.

  **Your Instincts are Sharp: Critiques and Developments**

  You are not being uncharitable; you've identified genuine tensions that philosophers have grappled with for decades:

  1.  **The Epistemic/Metaphysical Ambiguity:** This remains a core debate. Contemporary philosophers like Jaegwon Kim, Paul Humphreys, and Mark Bedau explicitly distinguish between ontological (metaphysical) and epistemological emergence. Broad is a foundational figure for ontological emergence, but his arguments are constantly scrutinized for epistemic slippage.
  2.  **The "Levels" Problem:** Broad's rigid hierarchical "orders" have been heavily criticized.
      *   **Kim's "Causal Exclusion" Argument:** If physics is causally closed, and higher-level properties supervene on lower-level properties, what causal work is left for the "emergent" property to do? If it does novel work, does it violate physics? If not, is it really ontologically distinct? This directly challenges the need for fundamental trans-ordinal *causal* laws.
      *   **Focus on Properties, not Levels:** Much contemporary work focuses on *specific properties* being emergent relative to a *specific lower domain* under a *specific mode of explanation*, rather than monolithic "orders." Reproduction might be emergent relative to biochemistry, consciousness relative to neurobiology, without requiring everything biological to form a single "vital order."
      *   **Mechanistic Explanation & Constraints:** Post-Broad, the focus shifted towards understanding *how* lower-level mechanisms, operating under specific constraints and organization, give rise to novel higher-level behavior, often dissolving the need for fundamental trans-ordinal laws *if* the novelty is seen as a consequence of complex organization explainable by lower-level mechanisms *plus* structural/contextual facts. Your reducible "heart mechanics" fits this perfectly.
      *   **Weak Emergence (Bedau):** Emphasizes the *practical* impossibility of prediction/deduction due to computational complexity, algorithmic incompressibility, or sensitivity to initial conditions (like chaotic systems), without necessarily requiring a *fundamental* new law. This is closer to the epistemic reading Broad likely rejected but addresses the "cannot be deduced *in practice*" aspect you might encounter in complex chemistry.

  **Conclusion: Broad's Legacy and Your Insight**

  Broad provided the foundational vocabulary and a powerful, clear-cut model of ontological emergence based on non-deducibility. His "orders," "trans-ordinal laws," and classification of properties remain highly influential reference points. However, his model is vulnerable precisely where you identified:

  1.  **The Non-Deducibility Claim:** While intended metaphysically, it remains difficult to conclusively prove it's not just epistemic. Modern complexity often provides alternative (weak emergence) explanations.
  2.  **The Cohesion of Orders:** Defining an order solely by the presence of an emergent property, while bundling reducible and neutral properties with it, can seem arbitrary. The scheme struggles with multiple realizability and the messy interconnectedness of scientific domains. It risks reifying levels in a way that might not reflect the continuous spectrum of complexity or the domain-specificity of emergence.

  As a chemist, your familiarity with how properties *actually* arise from complex molecular interactions (where prediction often fails practically, even if possible in principle with immense computational power) makes you naturally sensitive to the potential gap between Broad's grand metaphysical hierarchy and the gritty details of compositional science. You're seeing the tension that has driven much of the philosophy of emergence since Broad. He laid essential groundwork, but the "soft spots" you identified are where much of the subsequent philosophical action has happened. Your daughter was right: welcome to emergence! It's messy, fascinating, and your analytical chemistry perspective is a valuable asset in navigating it. Keep circling those pages – the frustration is part of the process!
