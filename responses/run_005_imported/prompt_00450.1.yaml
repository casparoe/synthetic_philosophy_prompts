prompt: |-
  Had a long argument with my buddy last night about Dutch book arguments and now I can't stop thinking about it. His point was basically: if you just never accept any bets in the first place, nobody can ever actually Dutch book you, so who cares if your credences are technically incoherent? Seems like the whole "argument for probabilism" thing only bites if your dumb enough to gamble. Is he right that just refusing to bet gets you off the hook here?
