prompt: |-
  Alright, so I'm on the technical steering committee for a mid-size open source project (5 of us), and we just ran into a voting situation that's been bugging me. I think it's some kind of known paradox but I have no idea what it's called or how people usually deal with it.

  We had a big RFC to decide on (adding a new plugin API). Our bylaws say a proposal passes only if it (a) gets a security sign-off AND (b) is backwards compatible. Instead of a straight up-or-down vote, we each voted on the two sub-criteria seperately and let the rule decide the outcome. Here's how it went:

  - Me: security=yes, backcompat=yes -> accept
  - Sam: security=yes, backcompat=yes -> accept
  - Priya: security=yes, backcompat=no -> reject
  - Dev: security=no, backcompat=yes -> reject
  - Ravi: security=no, backcompat=no -> reject

  Majority says security=yes (3-2) and majority says backcompat=yes (3-2), so by our own rule the RFC passes. But when Sam went around and asked people to just say "accept or reject the RFC overall" as a gut check, it came out 2 accept vs 3 reject. Same five people, same votes basically, opposite answer depending on how you ask the question.

  Now half the committee wants to scrap voting on sub-criteria and just do a straight up-or-down vote on the RFC itself, and the other half says that defeats the whole point of having explicit criteria in our bylaws in the first place. Both camps are pretty dug in and just keep repeating their own point instead of dealing with the other side's.

  Can you write the memo I'd send round before next week's meeting? I want it to actually recommend one voting procedure for us to standardize on going forward (not just re-litigate this one RFC), give real reasons a non-philosopher committee member would find convincing, and take the strongest version of the side you're NOT recommending seriously instead of just asserting logic is on your side. Keep it to something like half a page to a page.
reasoning: |-
  We are dealing with a situation that resembles the "paradox of multiple criteria" or "Condorcet paradox" in voting theory. Specifically, when we aggregate votes on individual criteria, the outcome passes (since both criteria are approved by majority), but when we ask for an overall judgment, the majority rejects the proposal. This is a known phenomenon in social choice theory.

  The core of the issue is that the two methods (voting on criteria vs. voting on the whole) can lead to different outcomes because they capture different information. In the criteria-based vote, we are aggregating the committee's judgment on each condition independently and then applying the rule. In the overall vote, each member is making a holistic judgment that might consider interactions between the criteria or other factors not captured by the two conditions.

  However, note that the bylaws explicitly define the passing condition: both criteria must be satisfied. Therefore, the criteria-based vote is the method that directly implements the bylaws. The overall vote, while informative, is not the procedure defined in the bylaws.

  But why the discrepancy? Let's break down the votes:

  - The proposal passes the criteria-based vote because:
    - Security: Yes (Me, Sam, Priya) vs No (Dev, Ravi) -> 3-2
    - Backcompat: Yes (Me, Sam, Dev) vs No (Priya, Ravi) -> 3-2

  - In the overall vote, we have:
    - Accept: Me, Sam (because both criteria are met in their view)
    - Reject: Priya (because backcompat fails), Dev (because security fails), Ravi (because both fail)

  So, the overall vote is 2-3 against. But note that Priya, Dev, and Ravi each have a different reason for rejection. The criteria-based vote, by design, only requires that a majority agrees on each condition. It does not require that the same majority supports the entire proposal.

  This situation is not illogical. It arises because the two criteria are independent and the committee members have different thresholds for what they consider acceptable. The bylaws, however, have set a specific logical condition (both must pass) and the criteria-based vote correctly implements that condition.

  But the committee is split on the procedure. Let's consider the arguments:

  Argument for criteria-based voting (current bylaw method):
  - It directly implements the rule set forth in the bylaws, which was established to ensure that any change meets both critical conditions (security and backward compatibility).
  - It avoids the possibility of a proposal passing even if it fails one of the essential criteria. For example, if we did an overall vote, a proposal might pass even if it fails security, if enough members were willing to overlook that for other benefits. The criteria-based method guards against that.

  Argument for overall voting:
  - It captures the holistic judgment of the committee. A member might vote "no" in the overall vote for reasons beyond the two criteria, or because they believe the criteria are not independent (e.g., a proposal that is backward compatible might introduce a security risk). Also, a member might vote "yes" on a criterion in isolation but then, when considering the whole, find the proposal unacceptable for other reasons.

  However, note that in our bylaws, we have explicitly stated that the two criteria are necessary and sufficient. That means if both are met, the proposal should pass. The bylaws do not leave room for additional criteria or holistic judgment beyond these two. Therefore, the criteria-based vote is the one that aligns with the bylaws.

  Recommendation:
  I propose that we stick with the criteria-based voting method as defined in our bylaws. The bylaws were designed to ensure that two critical conditions are met, and the criteria-based vote is the only method that enforces both conditions independently. The overall vote, while it might capture additional nuances, is not what our bylaws prescribe. 

  Moreover, if we are concerned that the criteria-based vote might lead to outcomes that the majority of the committee opposes (as in this case), then we should revisit the bylaws themselves. Perhaps we should consider whether the two conditions are sufficient, or if we need an additional requirement (such as an overall majority as well). However, until the bylaws are changed, we must follow the existing procedure.

  Steps:
  1. For the current RFC, we must respect the outcome of the criteria-based vote: it passes.
  2. We should then discuss whether to amend our bylaws. We might consider:
     a. Keeping the current method (criteria-based).
     b. Switching to an overall vote (but then we lose the independent check on each criterion).
     c. A hybrid: require both criteria to pass by majority AND an overall majority vote. This would add a layer of protection but might make it harder to pass proposals.

  I suggest we table a discussion on bylaw amendments for the next meeting. In the meantime, we follow the current bylaws.

  Memo Draft:

  ---

  **Subject: Standardizing Our Voting Procedure for RFCs**

  Dear Committee Members,

  Following our recent vote on the plugin API RFC, we have identified a discrepancy between the outcome of our criteria-based voting (as defined in our bylaws) and an ad hoc overall vote. This memo aims to clarify the procedure we should follow going forward and proposes a path to resolve the current impasse.

  **Background:**
  Our bylaws state that an RFC passes only if it (a) gets a security sign-off AND (b) is backwards compatible. In the recent vote, we applied this rule by having each member vote on the two criteria separately. The results were:
  - Security: 3 yes, 2 no -> passes
  - Backward compatibility: 3 yes, 2 no -> passes
  Thus, by the bylaws, the RFC passes.

  However, when asked for an overall accept/reject vote, the result was 2 accept and 3 reject. This has led to a debate about our voting procedure.

  **Analysis:**
  The discrepancy arises because the two voting methods capture different information. The criteria-based vote directly implements the logical condition in our bylaws: both conditions must be satisfied. The overall vote, on the other hand, allows each member to weigh the criteria and any other factors holistically. 

  Our bylaws currently do not provide for an overall vote. They specify two necessary conditions, and we have a method (voting on each condition) to test them. Changing to an overall vote would mean that a proposal could pass even if it fails one of the essential criteria (if, for example, a majority of the committee felt that other benefits outweighed the failure). This would undermine the purpose of having these criteria in the bylaws.

  **Recommendation:**
  1. **For current and future RFCs, we must follow the bylaws as written.** This means we will continue to vote on each criterion separately and apply the rule: the RFC passes only if both criteria pass by majority. We cannot substitute an overall vote because it does not enforce the independent checks on security and backward compatibility.

  2. **We should consider amending the bylaws.** The current situation has revealed that the committee might desire a different decision rule. Therefore, I propose we discuss potential bylaw amendments at our next meeting. Options include:
     - **Status Quo**: Keep the current criteria-based vote.
     - **Overall Vote Only**: Replace the criteria-based vote with a simple majority vote on the entire RFC. This would be simpler but might not guarantee that each critical criterion is met.
     - **Hybrid Approach**: Require both the criteria-based condition (both criteria pass) AND a majority in an overall vote. This would add a layer of consensus but might make passing proposals more difficult.
     - **Other**: We could also consider refining the criteria or adding new ones.

  **Next Steps:**
  - The plugin API RFC passes by the current bylaws and we should proceed accordingly.
  - At our next meeting, we will dedicate time to discuss and vote on a potential bylaw amendment regarding the voting procedure. Please come prepared with your thoughts.

  Let us use this as an opportunity to improve our governance. I look forward to a productive discussion.

  Best regards,
  [Your Name]

