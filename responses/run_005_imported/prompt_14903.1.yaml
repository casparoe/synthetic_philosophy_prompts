answer: |-
  ### Memo: Standardizing Voting Procedures for RFC Decisions  
  **To:** Technical Steering Committee  
  **From:** [Your Name]  
  **Date:** October 26, 2023  
  **Subject:** Resolving Voting Procedure Ambiguity for RFCs  

  #### **The Core Issue**  
  Our recent RFC vote exposed a tension between two valid approaches:  
  1. **Criteria-based voting** (current bylaws): Separately vote on each requirement (security, backcompat), then apply the logical rule ("both must pass").  
  2. **Holistic voting**: Direct up/down vote on the RFC as a whole.  

  The conflict arises because these methods can yield different outcomes with the same voter preferences—a known phenomenon in voting theory (*separable preferences*). In our case:  
  - **Criteria-based** passed the RFC (security 3-2 ✅, backcompat 3-2 ✅).  
  - **Holistic voting** rejected it (2 accept ✅, 3 reject ❌).  

  Both methods have defensible logic, but we need one standardized procedure to avoid future disputes.  

  ---

  #### **The Case for Holistic Voting**  
  *(Strongest version of the opposing view)*  
  - **Why it’s compelling**: Our bylaws exist to ensure *sound decisions*, not bureaucratic compliance. If 3/5 members holistically oppose an RFC, overriding their judgment because they disagree on *which* criterion failed risks:  
    - Ignoring unspoken trade-offs (e.g., "Security passes, but the backcompat break is catastrophic").  
    - Incentivizing tactical voting (members exaggerating concerns on one criterion to sink proposals).  
  - **Real-world impact**: A passed RFC that 60% of the committee opposes could stall implementation, fracture consensus, or damage trust.  

  ---

  #### **The Case for Criteria-Based Voting**  
  *(Recommended path forward)*  
  While holistic voting reflects intuition, **we should retain criteria-based voting** for three practical reasons:  

  1. **Bylaws exist to enforce non-negotiable standards**  
     - Security and backcompat are *deliberately* non-negotiable. Criteria-based voting acts as a "circuit breaker" ensuring neither is ignored. Holistic voting could allow a popular but insecure RFC to pass if voters overlook a single criterion—defeating the bylaws’ purpose.  

  2. **Prevents "tyranny of the majority" on bundled issues**  
     - In holistic voting, a member who supports one aspect but not another (e.g., Priya: ✅ security, ❌ backcompat) must vote reject. Criteria-based voting captures their nuanced stance accurately. Scrapping it forces all-or-nothing decisions, silencing partial support.  

  3. **Accountability and auditability**  
     - If an RFC causes issues later, criteria-based voting provides a clear audit trail: We can pinpoint whether security or backcompat assessments were flawed. Holistic votes bury rationale in "gut feel," making accountability harder.  

  ---

  #### **Proposal: Keep Criteria-Based Voting, Add a Safeguard**  
  To address holistic concerns without undermining bylaws:  
  1. **Retain criteria-based voting** as the official method.  
  2. **Add a new step**: After criteria are tallied, hold a non-binding straw poll: *"Knowing the outcome, do you support final adoption?"*  
     - If the majority opposes, we pause and discuss objections *before* finalizing.  
     - This respects bylaws while flagging consensus risks early.  

  #### **Why This Works**  
  - **Upholds bylaws**: Core criteria remain enforceable.  
  - **Builds consensus**: The straw poll surfaces hidden trade-offs (e.g., "I voted ✅ on security, but barely—we need more review").  
  - **Low friction**: Adds 5 minutes to voting, no bylaw changes needed.  

  ---

  #### **Next Steps**  
  1. **Formalize this procedure** in our voting guidelines.  
  2. **Test it** on the next RFC.  
  3. **Revisit in 3 months** to refine based on experience.  

  This balances rigor with pragmatism. Let’s use the RFC process to improve itself—just as we would with code.  

  **On deck for our meeting:** Draft language for the procedure update. Come with feedback.  
  — [Your Name]
