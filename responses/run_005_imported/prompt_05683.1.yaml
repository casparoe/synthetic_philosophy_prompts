  Why is this an escalation? Because in Frege's case, the two senses come from two names. Here, the same name carries two senses without the person realizing they co-refer. The mind can fragment the sense of a single name into separate compartments. Frege's solution assumes each name has a sense, but doesn't account for a single name having multiple senses for the same referent in a person's mind.

  The user's character needs to hold contradictory beliefs without irrationality. So, in the Paderewski scenario, the character isn't irrational because they have two distinct mental representations tied to the same name. They never have to reconcile because the contexts don't overlap. The statesman Paderewski and the pianist Paderewski are like two different people sharing a name. The contradiction only arises when they realize it's the same person, but until then, their beliefs are consistent within each mental file.

