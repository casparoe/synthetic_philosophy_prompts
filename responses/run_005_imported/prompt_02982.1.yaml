answer: |-
  Your unease speaks to something deeper than rulebooks—it touches the philosophical heart of scientific integrity. What you describe isn't mere guilt; it's a collision between the pragmatic realities of research and the ideals of truth-seeking. Let's dissect the principles at stake:

  ### Core Principles You Might Have Violated
  1.  **Epistemic Responsibility:**  
      Science relies on researchers as stewards of evidence. Omitting data *because it complicates a narrative* (even with a plausible excuse like "probable contamination") shifts your role from truth-reporter to narrative-curator. The burden of proof for discarding data rests on demonstrating *why* it's invalid, not just labeling it inconvenient. As philosopher Karl Popper stressed, science advances by *confronting* anomalies, not hiding them.

  2.  **The Integrity of the Scientific Record:**  
      Your published graph/figure presented a *partial* reality as the *whole* story. Future scientists building on your work deserved access to all reliable data—especially the messy bits. Those outliers might have held clues to limitations in the theory, methodological pitfalls, or even novel phenomena. By filtering them, you inadvertently distorted the epistemic landscape for others.

  3.  **Honesty vs. Mere Non-Lying:**  
      While you didn't fabricate data (lying), you engaged in **selective reporting**—a form of omission that misleads by implication. Philosopher Sissela Bok argues that omissions intended to create a false impression are ethically equivalent to lies. Your "probable contamination" note functioned more as a fig leaf than a rigorous justification.

  4.  **The "Clean Result" Fallacy:**  
      Science isn't about elegant curves; it's about reliably modeling reality. Your desire for a "clean result" prioritized aesthetic appeal over empirical fidelity. As physicist Richard Feynman warned: *"The first principle is that you must not fool yourself—and you are the easiest person to fool."* Discarding outliers without rigorous cause risks self-deception.

  ### Why This Nags at You (and Why It Matters)
  *   **Your Conscience Recognizes the Ideal:** Your discomfort stems from knowing science *aspires* to transparency. Philosophers of science (like Helen Longino) argue science is fundamentally communal—relying on criticism and diverse evidence. By hiding the anomalies, you silenced potential critics (including your future self).
    
  *   **The "Ordinary Judgment Call" Defense:** While common, this practice is corrosive. It normalizes hiding uncertainty, inflates confidence in theories, and erodes trust. Historians of science (like Naomi Oreskes) show how such "minor" omissions can collectively distort knowledge over time.

  *   **The Philosophical Shift:** Reading philosophy likely crystallized what your scientific intuition sensed: **Truth isn't just about reported facts; it's about intellectual humility.** Acknowledging messy data honors the complexity of nature. Suppressing it serves the ego of the theorist.

  ### So, Was It Wrong?
  **Yes, by the philosophical ideals of science—but understandably so.** Context matters:
  - **The 90s Culture:** Pressure for clean, publishable results was intense. Standards for data transparency were looser.
  - **Your Stated Reason:** You noted "probable contamination," which, while insufficient, wasn't an outright lie. Many would have done the same.
  - **Impact:** No apparent harm occurred. The paper "did fine."

  **However:** The ethical shortcoming lies in the *intent* and *process*. You lacked evidence for contamination, yet used it to justify exclusion *because you valued narrative cleanliness over epistemic rigor*. That’s the crux.

  ### A Path Forward (Philosophical, Not Practical)
  1.  **Reframe the Memory:** Don’t see this as guilt to bury. See it as evidence of your growth. Your younger self prioritized one scientific virtue (clarity); your older self recognizes a deeper one (intellectual honesty).
  2.  **Mentor (Even Retroactively):** Use this insight if you advise young scientists. Stress that wrestling openly with anomalies is *true* scientific rigor—not a failure. Share your story as a cautionary tale about the seduction of "clean" data.
  3.  **Accept the Ambiguity:** Research is human. Judgment calls are unavoidable. What matters is striving toward the ideal *now*, with the wisdom you’ve gained. Philosopher W.V.O. Quine reminded us that science is a "web of belief" constantly being revised. Your omission weakened one thread; your current reflection strengthens the whole.

  **In essence:** Your guilt isn’t manufactured. It’s the voice of your scientific conscience—honed by decades of experience and now sharpened by philosophy—telling you that true science demands courage in the face of messiness. That discomfort is the mark of a researcher who still deeply respects the truth. Honor it, learn from it, and let it affirm your commitment to the ideals that ultimately make science meaningful.
