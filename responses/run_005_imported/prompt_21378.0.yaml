          So the agent at the beginning might not be able to prove that there exists a future agent that does the task, even though there is one (at the end), because the proof would be too long or use induction that PA cannot handle.

          Then the agent at the beginning would do the task itself, which is not optimal if delegation is cheap and the chain is long.

          This is a form of the obstacle: the agent cannot prove that its successor will eventually do the task, even though it will, because the proof requires more resources than available.

          But this is a different obstacle (proof length) from the Löbian obstacle (self-reference).

          The genuine Löbian obstacle with self-trust is when the agent's trust in its successor is based on the same proof system, creating a self-referential loop that allows for no proof of correctness.

          In the finite chain with a known base case, it works. In the infinite chain, it doesn work because there's a contradiction. In the finite chain with an unknown base case, it might not work because of proof length.

          However, the original Löbian obstacle is about the inability to prove things about identical agents without already knowing the answer.

          The key example is the one with the agent and the immediate successor being identical and there being no base case specified in the agent's knowledge.

          For example, agent A and agent B are both running the same algorithm, and there is no agent after B. Agent A wants to delegate to B only if it can prove that B will do the task. But B's algorithm is the same as A's, and B will delegate to a nonexistent agent? We have to define what happens when there is no next agent. If we say that in that case, they do the task, then we are effectively giving them a base case, and then the example works if the proof in PA goes through.

          To see the Löbian obstacle in its pure form, we need a setting where the agent's proof system is too weak to prove the base case because of self-reference.

          Consider a very simple example with one agent and its future self, but where the future self's action depends on the agent's action in a self-referential way.

          Example from the paper "Tiling Agents for Self-Modifying AI, and the Löbian Obstacle" by Yudkowsky and Herreshoff.

          We'll make a minimal example.

          Let there be one agent that must output either A or B. The utility is 0 if it outputs A, and 10 if it outputs B, but only if it can prove that outputting B is safe. It defines "safe" as: if it outputs B, then 2+2=4. Since 2+2=4 is true, it should be safe.

          Algorithm:

              if PA proves that (Agent()=B -> 2+2=4), then output B
              else, output A

          Then it outputs B, and gets 10, because the proof is trivial.

          But now define "safe" as: if it outputs B, then PA does not prove that 0=1. This is also true (if PA is consistent), and PA can prove its own consistency? No, by Gödel.

          But the agent can use the following: it can prove that if it outputs B, then it must be that PA proves that (B -> Con(PA)), and it can also prove that Con(PA) is not provably equivalent to any particular value. But let's see.

          The condition is: if it can prove S, where S is: (Agent()=B -> Con(PA)), then it outputs B.

          But note: if it outputs B, then S is true if and only if Con(PA) is true.
          If it outputs A, then S is true (because false -> anything is true).

          So S is always true.

          Therefore, PA, being sound, can prove S. So the agent outputs B.

          This works.

          The obstacle arises when the safety condition is about the agent's own action in a self-referential way.

          Define:

              S: if Agent()=B, then PA does not prove that Agent()=A.

          This is true if the agent outputs B, because then PA does not prove a falsehood (if it is sound) about the agent's action. But can the agent prove S?

          Let P be the statement "Agent()=B".

          Then S is: P -> ~Prov(⌈~P⌉)   [because ~P is "Agent()=A", so not proving ~P means not proving that the agent outputs A]

          The algorithm: if PA proves S, then output B.

          So: output B if and only if PA proves (P -> ~Prov(⌈~P⌉))

          But P is defined as "output B", so we have a fixed point:

              P <-> Prov(⌈ P -> ~Prov(⌈~P⌉) ⌉)

          This is complicated.

          Alternatively, we can see that the agent's output is B if and only if there is a proof of S.

          What if the agent outputs A? Then S is true (because false -> anything), but there might be a proof of S or not.

          The condition only checks for a proof of S to output B. If there is no proof of S, it outputs A.

          So:

              P is true if PA proves S.
              P is false otherwise.

          But S is: P -> ~Prov(⌈~P⌉)

          So:

              If P is true, then S is: true -> ~Prov(⌈~P⌉), i.e., ~Prov(⌈~P⌉)
              If P is false, then S is: false -> ... which is true.

          So if P is false, S is true.

          Now, if P is false, then S is true, and if PA is sound, then PA will have a proof of S? Not necessarily, because the proof might be long.

          But in this case, S is true and very simple: it is an implication with a false antecedent. So PA can prove it.

          Therefore, if P is false, then PA proves S (because it is a true sentence of the form (false -> ...)), and then the agent would output B, so P would be true. Contradiction.

          Therefore, P must be true. So the agent outputs B.

          And then S becomes: ~Prov(⌈~P⌉)

          And since the agent outputs B, ~P is "Agent()=A", which is false. By soundness, PA does not prove ~P, so ~Prov(⌈~P⌉) is true.

          So S is true.

          But can PA prove S? S is ~Prov(⌈~P⌉), which is a sentence that PA cannot prove if it is consistent, because it is a consistency statement.

          Therefore, PA does not prove S. 

          But then the agent would not output B, because the condition is to output B only if PA proves S. 

          Contradiction.

          So we have a contradiction.

          This is the obstacle.

          In summary:

              - If the agent outputs B, then S is true but unprovable in PA, so the agent would not output B.
              - If the agent outputs A, then S is true and provable in PA, so the agent would output B.

          This is a concrete example where the agent's algorithm leads to a contradiction.

          The derivation of the contradiction:

              Assume the agent has an output.

              Let P = "agent outputs B".

              Let S = "P -> ~Prov(⌈~P⌉)".

              The algorithm: P if and only if Prov(⌈S⌉).

              We have two cases:

                  Case 1: P is true.
                      Then by the algorithm, Prov(⌈S⌉).
                      Since P is true, S is equivalent to ~Prov(⌈~P⌉).
                      So Prov(⌈S⌉) implies that PA proves a sentence that is equivalent to ~Prov(⌈~P⌉).
                      But also, since P is true, ~P is false, and by soundness, PA does not prove ~P, so ~Prov(⌈~P⌉) is true.
                      However, PA may not be able to prove that it does not prove ~P. In fact, ~Prov(⌈~P⌉) is Con(PA) in disguise, and PA does not prove Con(PA) by Gödel.
                      Therefore, even though ~Prov(⌈~P⌉) is true, PA does not prove it, so it does not prove S either.
                      Hence, Prov(⌈S⌉) is false, but we assumed P is true, which requires Prov(⌈S⌉). Contradiction.

                  Case 2: P is false.
                      Then the agent outputs A.
                      Then S is true (because false -> anything).
                      Since S is true and has a simple structure (false -> X is always true), PA can prove S.
                      Therefore, Prov(⌈S⌉) is true.
                      Then by the algorithm, the agent should output B, so P is true. Contradiction.

              Therefore, the agent cannot have any output.

          This is the Löbian obstacle in action.

          In this example, the agent's algorithm is self-referential and requires the agent to output B only if it can prove a sentence that it can only prove if it outputs B, but the sentence in question is one that PA cannot prove (equivalent to its own consistency) and hence it gets stuck.

          The naive plan of "output B if you can prove that it is safe (in the above self-referential sense)" collapses.

          The usual patches:

              - Bounded hierarchies: use a sequence of proof systems PA, PA+Con(PA), etc. The agent at level n uses PA+n. Then at each level, the agent can prove the consistency of the previous level. This helps in breaking the loop, but then you have to choose a level, and the agent at that level cannot trust itself infinitely.

              - Logical induction: this is a different framework that doesn't rely on classical proof systems, but uses a computable process that assigns probabilities to sentences. It might avoid the obstacle by not requiring proofs, but guarantees are probabilistic and asymptotic.

          Do they dissolve the obstacle or kick it down the road?

              - Bounded hierarchies: they kick it down the road because you have to stop at some level, and the agent at the top level cannot reason about itself with the same strength. So it might not be able to trust its own reasoning at the top level.

              - Logical induction: might dissolve the obstacle because the logical inductor will eventually assign high probability to the correct statements about its future beliefs, but it is not a guarantee at any finite time. Also, the logical inductor might be too computationally expensive.

          However, for practical purposes, the bounded hierarchy might be sufficient if the chain of trust is short. And logical induction offers a way to approximate the ideal of self-trust without a hierarchy.

          But in theory, the obstacle remains for unbounded self-trust within a single system.

          This is a deep issue in AI safety.
answer: |-
  To illustrate the Löbian obstacle concretely, we'll construct a minimal example using a simple agent in Peano Arithmetic (PA) that attempts to "trust its future self" and show exactly where Löb's theorem causes a contradiction. We'll use a variant of the "5 and 10" problem with a self-referential safety condition.

  ### **Setup: Agent and Self-Referential Safety**
  Define an agent that chooses between:
  - **Action A**: Take $5.
  - **Action B**: Take $10, but only if it can prove that taking $10 is "safe".

  The safety condition is self-referential:  
  *"If I take $10, then PA does not prove that I take $5."*  
  This mimics "trusting that my future self won't do something contradictory."

  Formally, let \( P \) be the proposition:  
  \[ P \equiv \text{Agent outputs } B \]  
  The safety condition \( S \) is:  
  \[ S \equiv (P \to \neg \mathsf{Prov}(\ulcorner \neg P \urcorner)) \]  
  where \( \mathsf{Prov}(\ulcorner X \urcorner) \) means "PA proves \( X \)".

  **Agent's algorithm**:  
  1. If PA proves \( S \), output \( B \) (take $10).  
  2. Otherwise, output \( A \) (take $5).

  ### **Step-by-Step Derivation of Contradiction**
  We analyze the agent's behavior by cases.

  #### **Case 1: Assume \( P \) is true (Agent outputs \( B \))**  
  - If the agent outputs \( B \), then \( P \) is true.  
  - By definition of \( S \):  
    \[
    S \equiv (P \to \neg \mathsf{Prov}(\ulcorner \neg P \urcorner)) \quad \text{reduces to} \quad \neg \mathsf{Prov}(\ulcorner \neg P \urcorner)
    \]  
    since \( P \) is true.  
  - \( \neg \mathsf{Prov}(\ulcorner \neg P \urcorner) \) means "PA does not prove \( \neg P \)" (i.e., PA doesn't prove the agent takes $5).  
  - For the agent to output \( B \), PA must prove \( S \) (by step 1 of the algorithm):  
    \[
    \mathsf{Prov}(\ulcorner S \urcorner) \quad \text{holds}.
    \]  
  - But \( S \) is equivalent to \( \neg \mathsf{Prov}(\ulcorner \neg P \urcorner) \) when \( P \) is true, so:  
    \[
    \mathsf{Prov}(\ulcorner S \urcorner) \iff \mathsf{Prov}(\ulcorner \neg \mathsf{Prov}(\ulcorner \neg P \urcorner) \urcorner).
    \]  
  - \( \neg \mathsf{Prov}(\ulcorner \neg P \urcorner) \) is a **consistency statement** (equivalent to \(\mathsf{Con}(\mathsf{PA})\) if \( \neg P \) is a contradiction). By Gödel's second incompleteness theorem, PA cannot prove its own consistency. Thus:  
    \[
    \mathsf{PA} \not\vdash \neg \mathsf{Prov}(\ulcorner \neg P \urcorner) \quad \text{(unless PA is inconsistent)}.
    \]  
  - Therefore, \( \mathsf{Prov}(\ulcorner S \urcorner) \) is **false**, contradicting the assumption that the agent outputs \( B \) (which requires \( \mathsf{Prov}(\ulcorner S \urcorner) \)).

  #### **Case 2: Assume \( P \) is false (Agent outputs \( A \))**  
  - If the agent outputs \( A \), then \( \neg P \) is true.  
  - \( S \) is:  
    \[
    S \equiv (P \to \neg \mathsf{Prov}(\ulcorner \neg P \urcorner)).
    \]  
    Since \( P \) is false, the implication \( \text{false} \to \text{anything} \) is **vacuously true**.  
    Thus, \( S \) is true.  
  - \( S \) is a tautology (false implies anything), so PA can prove it:  
    \[
    \mathsf{PA} \vdash S.
    \]  
  - But the algorithm outputs \( A \) only if PA does **not** prove \( S \):  
    \[
    \neg \mathsf{Prov}(\ulcorner S \urcorner).
    \]  
  - This contradicts \( \mathsf{PA} \vdash S \).

  #### **Conclusion**
  - **Case 1** fails: If the agent tries to output \( B \), it requires a proof of \( S \), but \( S \) is unprovable in PA.  
  - **Case 2** fails: If the agent outputs \( A \), \( S \) is provable, forcing it to output \( B \).  
  - **Contradiction arises** at the self-referential step where \( S \) depends on \( \mathsf{Prov}(\ulcorner \neg P \urcorner) \), and PA cannot prove \( \neg \mathsf{Prov}(\ulcorner \neg P \urcorner) \) due to Löb's theorem. Specifically:
    - Löb's theorem says PA proves \( \mathsf{Prov}(\ulcorner X \urcorner) \to X \) only if PA proves \( X \).  
    - Here, \( X = \neg \mathsf{Prov}(\ulcorner \neg P \urcorner) \), and PA cannot prove \( X \), so it cannot prove the implication \( S \) when \( P \) is true.

  ### **Why This Bites**
  The agent cannot "trust" its future self (modeled by \( S \)) because:
  1. Self-reference creates a fixed point (\( S \) depends on \( P \), which depends on provability of \( S \)).  
  2. Löb's theorem blocks PA from proving the consistency of its own proofs about \( P \).  
  3. The safety condition \( S \) becomes equivalent to a consistency statement, which PA cannot prove.

  ### **Do Patches Resolve the Obstacle?**
  - **Bounded Hierarchies** (e.g., PA, PA + Con(PA), etc.):  
    Kick the problem down the road. An agent at level \( n \) can trust agents at level \( < n \), but cannot fully trust itself or higher levels. At the top level, the Löbian obstacle reappears. Practical for finite cases but not for unbounded self-trust.

  - **Logical Induction**:  
    Dissolves the obstacle by replacing binary proofs with *probabilistic beliefs*. An agent can assign high credence to "my future self is trustworthy" without needing a proof. However:  
    - Guarantees are asymptotic (requires infinite time).  
    - Finite-time behavior may still exhibit circularity.  
    - Computationally intractable in practice.

  - **Parametrization (e.g., \( \mathrm{Prov}^k \) for depth \( k \))**:  
    Avoids immediate contradiction but requires pre-defined depth. If an agent needs to reason about arbitrary depths, the obstacle resurfaces.

  **Verdict**: Patches mitigate the obstacle in practice but do not eliminate it for unbounded self-referential trust. Löbian obstacles are inherent in systems that demand *fully general* proofs of their own reliability. The core tension remains: "To trust your future self, you must already know what it will do; but to know that, you must simulate it, which requires trusting it."
