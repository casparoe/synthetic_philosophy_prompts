answer: |-
  Let's dissect the Pasadena game's challenge to expected-utility (EU) theory, why it's worse than St. Petersburg, and the philosophical rift it exposes. The core problem isn't infinity—it's **instability under description**.

  ### 1. The Pasadena Game: Why Conditional Convergence is the Killer
  Imagine the game:
  - Flip a fair coin until it lands heads (on flip *n*).
  - Your payoff = **(-1)^{n+1} * (2^n) / n** dollars.
    - *n=1* (H): +$2
    - *n=2* (TH): -$2
    - *n=3* (TTH): +$8/3 ≈ +$2.67
    - *n=4* (TTTH): -$4
    - *n=5* (TTTTH): +$32/5 = +$6.40
    - ... payoffs alternate sign, grow in magnitude, but are divided by *n*.

  **The Mathematical Heart:**
  The expectation is the sum:  
  `E = (1/2)*2 + (1/4)*(-2) + (1/8)*(8/3) + (1/16)*(-4) + (1/32)*(32/5) + ...`  
  = `1 - 1/2 + 1/3 - 1/4 + 1/5 - ...`

  This is the **alternating harmonic series**. It **conditionally converges** to *ln(2)* ≈ $0.69. But *conditional convergence* is fragile. The Riemann rearrangement theorem says: *You can reorder the terms to make this sum converge to ANY real number, or even diverge to +∞ or -∞*.

  **Why is this philosophically devastating for EU theory?**
  - EU requires a **unique** expected value to rank gambles.
  - The Pasadena game's "expectation" **depends entirely on the order in which you consider the outcomes**.
  - But the order of outcomes is arbitrary! There's no "natural" order inherent to the gamble itself. You could describe the game listing longer sequences first, or group all odd *n*, then even *n*, etc.
  - **Result:** The EU of the Pasadena game isn't just infinite or undefined—it's *radically frame-dependent*. Describing the *same physical gamble* differently (e.g., "Tails first, then Heads" vs. "Heads first, then Tails") yields different "expected utilities" ($∞? -$∞? $100? -$100?).

  **Analogy:** Imagine weighing an object on an infinitely sensitive scale that gives wildly different readings depending on *which side you place the object on first*. The scale isn't measuring a stable property of the object. Similarly, EU "calculation" for Pasadena isn't measuring a stable property of the gamble.

  ### 2. Why "Nonexistent" is Worse than "Infinite" (St. Petersburg)
  - **St. Petersburg:** EU = ∞. This is *weird* (how much to pay? finite agents?), but it's **consistent**. No matter how you describe the game, the sum diverges to ∞. EU theory gives a clear (if problematic) directive: this gamble dominates any finite sum. Solutions exist (e.g., bounded utility).
  - **Pasadena:** EU **does not exist** as a unique, order-invariant value. This is **inconsistent**:
    - EU theory cannot assign *any* stable value.
    - It cannot rank Pasadena against *any other gamble*. Is it better than $0? Sometimes (sum order = ln(2)), sometimes worse (sum order = -∞), sometimes incomparable (sum diverges).
    - **Core Failure:** EU requires a complete ordering of gambles based on a unique expectation. Pasadena violates this axiomatically.

  **Verdict:** An infinite EU is a *boundary case* for the theory; a nonexistent EU is an *internal contradiction*. It shows EU theory lacks the tools to even *describe* the value of some conceivable, well-defined gambles.

  ### 3. The Deeper Disagreement: Two Defensible Morals

  **Your Friend's Moral: "EU Theory is Incomplete"**
  - **Argument:** Rational agents need to make choices about gambles like Pasadena. If EU theory is silent, it's inadequate. We need extensions (e.g., weak expectations, relative expectations, distributional approaches) to handle conditionally convergent gambles. Denying legitimacy to such gambles is ad hoc.
  - **Strength:** Acknowledges reality—Pasadena *is* a coherent gamble. We can run it. Shouldn't a normative theory guide us?
  - **Weakness:** Proposed extensions are complex, lack universality, and may violate core EU axioms (completeness, ordering).

  **Your Moral: "Pasadena is Illegitimate"**
  - **Argument:** EU theory's requirement for a unique, order-invariant expectation is *part of the definition* of a rational gamble. Pasadena fails this pre-condition. It’s like dividing by zero—undefined *by its nature*. Rational choice only applies to gambles with absolutely convergent or finitely divergent EU.
  - **Strength:** Preserves EU as a consistent, complete theory for "well-behaved" gambles. Avoids messy, non-unique solutions.
  - **Weakness:** Feels like moving the goalposts. Why is absolute convergence the line? St. Petersburg diverges absolutely; is it "legitimate"? What about gambles with finite but path-dependent values?

  ### My Take: A Synthesis
  Both views have merit, but the **"illegitimate gamble" stance is more compelling as a *normative* baseline**:

  1.  **The Requirement of Invariance:** A core principle of rational choice is that the *description* of options shouldn't affect their *value*. Pasadena violates this axiomatically due to conditional convergence. This isn't a flaw in EU theory—it's a flaw in *posing the gamble as an object of rational choice*. Rationality requires stable values.
  2.  **The Practicality of Absolute Convergence:** Absolute convergence guarantees that the sum of utilities is independent of order, timing, or grouping of states. This stability is essential for a normative theory prescribing *consistent* choices. Gambles violating this are mathematical curiosities, not actionable choices.
  3.  **St. Petersburg vs. Pasadena:** St. Petersburg's divergence is robust (absolute divergence). Its "infinity" is a challenge to *application* (how much to pay?) but not to the *internal logic* of EU for ranking. Pasadena breaks the internal logic (ordering).
  4.  **The Path Forward:** Acknowledge that EU theory rests on the **mathematical precondition of absolute convergence** (or clear divergence) of the utility sum. This defines its domain of applicability. For gambles like Pasadena, other criteria (e.g., dominance, security levels, or contract-based precommitments) might be needed, but these exist *outside* the core EU framework. This doesn't make EU incomplete; it clarifies its scope.

  **Conclusion:** The Pasadena game brilliantly exposes that EU theory's reliance on summation implicitly requires **absolute convergence** to yield stable, rational choices. Its "nonexistent" EU is worse than St. Petersburg's infinity because it reveals a fundamental inconsistency within the theory when faced with conditionally convergent sums. While your friend rightly points out the theory's silence on such gambles, the more coherent normative stance is that such gambles fall outside the domain where a *unique* expected utility can—or *should*—be defined by summation. The moral isn't that EU is incomplete, but that **not every mathematically conceivable gamble admits a stable, expectation-based rational valuation.** This defines the boundary of the theory.
