prompt: |-
  So this happened at drinks last weekend and it's been stuck in my head since (feels like exactly the kind of thing that'd get a 400-comment ACX thread, but I've never seen anyone actually walk through the moves one by one). Two friends of mine, Colin and Naomi, got into a whole thing over whether our friend Marisol had any business calling out our other friend Theo for badmouthing a mutual friend behind her back -- especially since Marisol is, by universal agreement, the biggest gossip in the group and has badmouthed Theo just as much. (1) Colin's opening move was that Marisol has zero standing to call this out, since she does the exact same thing constantly -- who is she to wag a finger. (2) Naomi shot back that this is just a tu quoque: Marisol having gossiped before doesn't make what she said about Theo any less true, so the complaint stands regardless of who made it. (3) Colin conceded that but said standing and truth aren't the same thing -- you can be totally right and still be the wrong messenger, especially someone who's never once admitted she has the exact same problem. (4) Naomi came back that this isn't hypocrisy then -- hypocrisy is holding people to a rule you exempt yourself from, and if Marisol genuinely thinks its bad when she does it too, she's not exempting herself, she's just also guilty, like most people are guilty of something. (5) Colin conceded the point but said there's still something off about the worst offender in the room delivering the lecture, even if it's not hypocrisy in the strict sense -- standing has to require more than clearing the bar of "not technically a hypocrite." Naomi's parting shot was that if that's the bar, nobody who's ever done anything wrong gets to call out anything, ever. Neither of them could resolve it and they made me referee, which felt unfair since I genuinely had no idea.

  Can you go through the five numbered moves and say who's got the better of it at each one -- not just an overall winner -- then weigh in on whether Naomi's closing reductio actually works, and flag anything you think both of them are missing?
