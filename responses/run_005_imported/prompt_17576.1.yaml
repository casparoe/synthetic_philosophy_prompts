answer: |-
  That's a brilliantly sharp question, cutting right to the heart of the historical-metaphysical tension. Given the interpretive divide ("Old Hume" vs. "New Hume") and the nature of the contemporary debate, here's my best-supported reasoning on where Hume would likely land if confronted with these options:

  1.  **Rejection of Lewis's "Fulfillment" Narrative:** Hume would **almost certainly *not* embrace Lewis's Humean Supervenience (HS) as the straightforward fulfillment of his project.
      *   **Epistemic Humility vs. Metaphysical Dogma:** Hume's skepticism was fundamentally *epistemic*. He argued we *cannot know or even form a clear idea* of necessary connection or power in objects. Lewis's HS, however, makes a *metaphysical* claim: there *are no* necessary connections between distinct existences. For the "New Hume" reading (which I find compelling on this point), this would be a step too far. Hume repeatedly uses phrases like "secret powers," "ultimate force," "energy," "tie," or "connexion" when discussing causation in the objects, while simultaneously denying we can comprehend them. Lewis's outright denial would likely strike Hume as dogmatically asserting what we *cannot* know. Hume's point wasn't "There's nothing there," but "We are utterly ignorant of *what* is there."
      *   **The Problem of "Best System":** Hume would be deeply suspicious of the normative concepts ("simplicity," "strength," "best") used in the Best System Analysis (BSA). For Hume, these are psychological or pragmatic preferences rooted in custom and human nature, not objective features of the world discoverable by reason. He'd likely see Lewis's appeal to them as smuggling in a kind of rationalistic, quasi-Platonic standard alien to his own empirical, associationist psychology. The idea that "lawhood" supervenes on a *particular human-like systematization* would seem anthropocentric to Hume.

  2.  **Rejection of Armstrong's Universals & Natural Necessitation:**
      *   **Universals as Unintelligible Abstractions:** Hume's nominalism and skepticism about abstract ideas would lead him to reject Armstrong's universals outright. For Hume, all ideas derive from impressions. We have no impression of a universal "charge" or "mass" existing independently of particular charged or massive things. Universals are, for Hume, merely names we give to collections of resembling particulars.
      *   **Necessitation as the Forbidden "Connection":** Armstrong's "natural necessitation" relation (N) binding universals is *precisely* the kind of "necessary connexion" Hume spent so much effort arguing we cannot perceive or conceive. It purports to be a mind-independent, irreducible "glue" ensuring that if F-ness is N-related to G-ness, then Fs *must* be followed by Gs. Hume would see this as the very metaphysical posit his critique of causation targeted – just relocated from between events to between abstract entities. He would dismiss N as an unintelligible pseudo-explanation, positing a "power" we have no impression of and therefore no idea of. It violates Hume's Dictum *within* the realm of abstracta.

  3.  **Potential (Cautious) Sympathy with Maudlin's Primitivism:**
      *   **Avoiding the "Connection" Trap:** Maudlin's view avoids positing a *relational* "glue" between distinct existences (events or universals). Laws are primitive, fundamental features of the world governing how states evolve. This sidesteps Hume's specific critique of *necessary connexion* as a perceivable relation *between* distinct things. There's no "tie" to scrutinize and fail to find an impression of.
      *   **Aligning with Epistemic Humility?** Maudlin's laws are fundamental and unanalyzable. This resonates with Hume's view that the ultimate principles of nature are hidden from us. Hume could potentially see primitive laws as a way of *pointing towards* that hidden structure without *pretending to explain it* via unintelligible connections. Maudlin doesn't claim to *comprehend* the essence of lawhood; he just asserts its fundamental role.
      *   **The Skeptical Caveat:** However, Hume would immediately add a massive skeptical caveat. While primitive laws *might* avoid the specific problem of "necessary connexion," they still posit a fundamental, irreducible, *modally laden* feature of reality (laws entail what *must* happen). Hume would insist we have no impression corresponding to this "must" or to "lawhood" itself as a fundamental existent. He would likely argue Maudlin is simply *labeling* our ignorance ("ultimate governing principles") rather than providing a comprehensible account. It might be *less offensive* than Armstrong's necessitation, but it still posits a mysterious, imperceptible "something" he'd find philosophically suspect.

  **The Most Likely Humean Stance:**

  1.  **Critique of All Positions:** Hume would likely see *all* contemporary positions (Lewis, Armstrong, Maudlin) as engaging in metaphysical speculation that outruns the deliverances of experience and the limits of human understanding. Lewis dogmatically denies what we cannot know; Armstrong and Maudlin posit fundamental features (N, primitive lawhood) for which we have no adequate ideas derived from impressions.
  2.  **Endorsement of Regularity (as Phenomenon, Not Ontology):** He would strongly reaffirm that the *only* basis we have *for believing in or talking about* laws or causation is observed constant conjunction, contiguity, and temporal priority – the regular patterns in our experience. This is the *phenomenal* core shared by all sides.
  3.  **Skeptical Agnosticism about the Underlying Ground:** Crucially, he would *refuse* to take a definitive metaphysical stance on what *grounds* these regularities. He would insist we are utterly ignorant of whether the regularities supervene on non-modal facts (Lewis), are manifestations of relations between universals (Armstrong), flow from primitive governing laws (Maudlin), or stem from some other entirely unknown source ("secret powers").
  4.  **Hume's Dictum as Epistemic, Not Metaphysical:** He would clarify that his "no necessary connections" dictum is primarily an *epistemic* principle about the limits of our ideas and justifications, not an absolute metaphysical truth. We cannot *perceive* or *conceive* of such connections, therefore we cannot *know* them or justifiably posit them *as explanations*. Lewis turned it into a metaphysical foundation; Hume saw it as a consequence of his theory of ideas.

  **Conclusion:**

  If forced off the skeptical fence, Hume's sympathies would likely lie *more* with Lewis's regularity-based approach **than** with Armstrong's or Maudlin's anti-Humean posits, simply because Lewis stays closer to the observable phenomena and avoids positing *additional, imperceptible metaphysical entities or relations* (universals, N, primitive lawhood *as a fundamental existent*). Lewis reduces lawhood to patterns we *can* observe, albeit systematized in a way Hume would find psychologically contingent.

  However, Hume would **vehemently reject** Lewis's *metaphysical interpretation* of this – the flat denial of necessitation inherent in HS. He would see Lewis as committing the same error as the anti-Humeans, albeit in the opposite direction: making a dogmatic claim about the ultimate nature of reality (that there *is* no "glue") that transcends our possible knowledge. Hume's true position is radical epistemic humility: we observe regularity, we project necessity via custom, but the ultimate ground of that regularity remains forever hidden. **He wouldn't sign up with Lewis *or* the anti-Humeans; he'd accuse them all of overstepping the bounds of human understanding.** His legacy for the debate isn't a solution, but a profound challenge to *all* metaphysical accounts of lawhood that claim access to mind-independent necessities or powers.
