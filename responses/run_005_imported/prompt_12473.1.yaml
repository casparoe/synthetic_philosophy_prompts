answer: |-
  Here is a 350-word meditation that honors the tension David Lewis identifies while anchoring the congregation in the mystery and grace of Good Friday:

  ***

  We gather tonight in the shadow of the cross. We hear the ancient words: Christ died for us. He bore our sins. He took our punishment.

  And if we’re honest, that can sometimes feel… jarring. Like a puzzle piece that doesn’t quite fit. Philosopher David Lewis put his finger on it. We understand someone *paying a debt* for us. If a friend quietly settled a bill we couldn’t cover, we’d feel relief, gratitude. Debt, it seems, can be transferred. But *punishment*? Justice? That feels different. If I committed a crime, and a willing volunteer went to prison in my place, would we feel justice was done? Or would it feel like a strange evasion? Like the real burden of guilt remained… mine. Punishment, Lewis observed, seems to cling to the one who earned it in a way debt does not.

  Tonight confronts us with this very thing: penal substitution. Christ, the innocent one, punished in our place. For our guilt. It *is* jarring. It *should* trouble our neat categories of fairness. If it doesn’t make us pause, perhaps we haven’t truly listened.

  So what do we do with this tension? Do we smooth it over? Ignore it? Or do we let it lead us deeper into the awful mystery before us?

  Perhaps the jarring nature *is* the point. It shocks us awake to the terrifying weight of what we call "sin" – not just individual slips, but a profound rupture in our relationship with God, a burden we *cannot* transfer or pay off ourselves, no matter how willing the volunteer. Our guilt *does* cling.

  And here, on the cross, we see God’s staggering answer. Not a denial of justice, but its radical, costly fulfillment. Not a simple transaction, but a divine act of love so profound it enters the very heart of our deserved consequence and transforms it. God, in Christ, doesn't dismiss the debt; He absorbs the blow. He takes the clinging guilt upon Himself.

  We cannot fully explain this. It defies our earthly logic of deserts and debts. That’s the scandal and the wonder. Tonight isn’t about resolving the puzzle easily. It’s about standing in awe before the love that chose *this* way. The love that saw our helplessness, saw the burden that clung to us, and said, "I will take it. For them."

  Look upon the cross. See not just a payment, but a profound, sacrificial embrace. Justice and mercy meet, not in neat theory, but in a love that bears our un-transferable weight. Hold on to *that* love tonight. It is our only answer, and our only hope.

  ***

  **Why this works:**

  1.  **Acknowledges the Tension:** Directly quotes Lewis's core observation about debt vs. punishment, validating the feeling of unease.
  2.  **Applies it Directly:** Explicitly names "penal substitution" as the jarring concept, showing it understands the theological term and the challenge.
  3.  **Doesn't Offer False Resolution:** Avoids simplistic answers or philosophical gymnastics. States clearly: "We cannot fully explain this. It defies our earthly logic."
  4.  **Deepens the Mystery:** Uses the tension as a lens to magnify the *gravity* of sin ("a burden we *cannot* transfer... a profound rupture") and the *costliness* of God's action ("absorbs the blow," "takes the clinging guilt").
  5.  **Pivots to Love and Awe:** Shifts the focus from intellectual resolution to the overwhelming reality of divine love demonstrated on the cross. The "staggering answer" is God's action, not a neat theory.
  6.  **Pastoral Focus:** Offers something concrete to "hold on to" – the sacrificial love embodied on the cross. The final lines ("Look upon the cross... Hold on to *that* love") provide an anchor.
  7.  **Appropriate Tone & Length:** Solemn, reflective, meant for spoken delivery. Concise at ~350 words.
  8.  **Congregational "We":** Uses inclusive language ("We gather," "Our guilt," "Let us look"), drawing everyone into the shared reflection and mystery.

  This meditation allows the tension to exist, even highlighting it, but uses it to drive the congregation towards a deeper contemplation of the cross and the unfathomable love it represents, which is the heart of Good Friday.
