  Here's a 3-minute toast balancing warmth, academic wit, and strict neutrality, with your requested joke:

  **(Clink glass)** Friends, family, esteemed metaphysicians... thank you for gathering to celebrate Nora and Owen! As Nora's friend and fellow philosophy traveler (though I wisely stick to ethics – less chance of existential crisis over morning coffee), I'm honoured to say a few words.

  We all know how Nora and Owen met. Not some chance encounter, but a deliberate, passionate... collision course in a seminar on persistence. While most of us might debate *where* to get lunch, these two dove headfirst into the deep end: temporary intrinsics, identity over time... the kind of questions that make you question if *you* even exist between breakfast and lunch. **(Light laugh, glance at academic friends)**. For an entire semester, they were locked in a battle of wits – perdurantist versus endurantist, four dimensions versus three, a clash of fundamental worldviews!

  But here’s the beautiful, truly remarkable thing that happened: somewhere between arguing about whether the person who walked into that seminar was metaphysically identical to the person who walked out, they discovered something undeniable. They discovered *each other*. They discovered a connection that proved far more persistent than any abstract object, a bond far more robust than any theory could fully capture. They realized that while they might fundamentally disagree on *how* a person persists through time, they absolutely agreed on *who* they wanted to persist *with*.

  **(Pivot warmly to families)** Now, for those wondering what on earth a perdurantist or endurantist is... imagine two brilliant people who love each other so much, they spend their lives pondering the deepest nature of existence itself, just to make absolutely sure their love has the strongest possible foundation. That's Nora and Owen. They don't just share a life; they share a profound curiosity about what it even *means* to share a life across time.

  **(The Joke - delivered with a warm smile)** And speaking of time... Nora, Owen, today you stand before us making the most beautiful commitment: **"Till death do us part."** Now, I know Nora sees that as a profound statement about the temporal boundaries of your union as a four-dimensional entity. And Owen... Owen, I *know* you see it as the enduring commitment of a single, wholly present substance facing the future together. **(Nod sincerely at both, gentle laugh from academics, warm smile from families)**. But honestly? To everyone in this room, it simply means: **you two are choosing each other, fiercely and completely, for every single moment you are given.**

  Nora, Owen – your love story is a testament to the fact that the deepest connections transcend even the most fundamental philosophical divides. You haven't abandoned your intellectual passions; you've built something extraordinary *alongside* them. You prove that love isn't about being metaphysically identical or composed of perfectly aligned parts; it's about choosing to walk the same path, hand-in-hand, respecting each other's unique perspectives, and building a shared reality more wonderful than any abstract theory.

  Owen, rest assured, no one here sees you as a bundle of parts. We see a devoted, whole person. Nora, no one here will lazily claim you're "the same person" who met Owen without acknowledging the incredible, complex, loving journey that brought you both to *this* moment. You've earned *this* moment, together. You've built a love that endures, persists, and simply *is* – magnificently and undeniably.

  So, let’s raise our glasses: To Nora and Owen! May your shared spacetime be filled with infinite joy, unwavering support, fascinating debates over breakfast, and a love that persists, endures, and shines brilliantly through every single moment you share. Cheers!

  **Why it works:**

  1.  **"Till Death" Joke:** Lands perfectly. It explicitly references the vow, directly contrasts their views (Nora: boundary event for a 4D worm / Owen: endpoint for an enduring substance), and then resolves into the universal, warm sentiment everyone understands. Academics get the layered meaning, families get the core message.
  2.  **Neutrality:** Actively avoids taking sides:
      *   "Fundamentally disagree on *how*... agreed on *who*."
      *   Explicitly states both interpretations of "till death do us part" with equal respect.
      *   "Transcend even the most fundamental philosophical divides."
      *   "Love isn't about being metaphysically identical or composed of perfectly aligned parts."
      *   Directly addresses both their specific requests: Owen isn't a bundle, Nora's journey to *this* moment is acknowledged as earned.
  3.  **Warmth for Families:**
      *   Opens and closes with universal sentiments.
      *   Explains the academic clash simply ("deepest nature of existence," "profound curiosity").
      *   Focuses on love, commitment, choosing each other, building a life.
      *   The core message after the joke is purely emotional and relatable.
  4.  **Sharpness for Department:**
      *   Uses precise terminology (perdurantist, endurantist, 4D, temporal boundaries, wholly present substance, abstract object/theory).
      *   References the seminar context and "temporary intrinsics."
      *   The joke itself relies on understanding their positions.
      *   Acknowledges the depth and seriousness of their intellectual passions.
  5.  **Structure:** Clear flow from how they met (academic clash) -> discovery of love -> explanation for families -> the central joke -> universal message of commitment -> direct address of their requests -> heartfelt toast.
  6.  **Tone:** Warm, celebratory, respectful of intellect, genuinely loving, and slightly playful with the academic in-jokes without being exclusionary.

  **Delivery Tip:** Speak slowly and warmly, especially for the families. Pause slightly after the academic terms and before explaining them simply. Make eye contact with Nora and Owen during the parts directly addressing them and their requests. Let the smile reach your eyes during the joke! Good luck – you've got this!
