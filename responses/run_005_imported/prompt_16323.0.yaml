  Then, moral encroachment connection. The user wants to know if the speaker extends pragmatic encroachment to moral stakes. She might resist, arguing moral stakes are different. Follow-up could challenge why practical and moral stakes should be treated differently.

  I also need two more questions. One on alternative explanations: why not explain bank cases with justified belief plus pragmatic factors affecting assertion? The speaker might say this misses the knowledge norm. Follow-up could ask for evidence that it's knowledge itself changing.

  Another on cross-cultural stakes: if stakes are culturally relative, does knowledge become relative? The speaker may say objective context matters. Follow-up on handling cultural disagreements about stakes.

  Lastly, action-guidance: if knowledge depends on stakes, how do we know when we know? Speaker might point to reasonable assessment. Follow-up on whether this leads to circularity.

