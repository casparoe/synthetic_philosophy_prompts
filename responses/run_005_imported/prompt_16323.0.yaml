prompt: |-
  Hey, I'm chairing the Q&A after our colloquium talk next week -- the speaker's built her whole research program around pragmatic encroachment, the idea that whether you count as knowing something can depend on whats practically at stake for you, not just your evidence. Can you draft me 7 or 8 questions that don't just have her restate the view for the hundredth time?

  I want one that presses on the "ignorant high-stakes subject" case -- someone who's actually in a high-stakes situation but has no idea -- and whether her view needs to smuggle in the subject's own beliefs about the stakes to get the intuitive verdict. I want one that forces her to say clearly how this is different from DeRose-style contextualism, since both "explain" the bank cases and half the audience always leaves thinking its the same theory with a different name. One should push on whether encroachment is just a slow ramp toward skepticism as stakes rise, and whether a gradual rather than sharp cutoff just imports a sorites problem into "knows." And throw in one connecting all this to the "moral encroachment" literature -- does she think that's a natural extension of her view, or does she want to resist it, and on what grounds?

  For each, give me a quick note on the answer she's most likely to give so I've got the follow-up ready. Keep it conversational, not a lecture -- this is a colloquium, not a defense.
