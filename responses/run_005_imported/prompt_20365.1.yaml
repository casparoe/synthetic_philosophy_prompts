  I should explain why margin-for-error doesn't apply in distributed systems. The formalism assumes discrete states and perfect discrimination, so no sorites-like sequences. Williamson's argument requires continuous change, which isn't present in the discrete models. The user might wonder if this is an empirical assumption. It's more of a modeling choice—idealizing agents for specific applications.

