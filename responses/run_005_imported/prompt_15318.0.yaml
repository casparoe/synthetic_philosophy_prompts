answer: |-
  You're absolutely right to demand precision—these puzzles are structurally distinct in ways that matter for decision theories like FDT/UDT. While both exploit a *temporal gap* between forming an intention and executing an action, the **subjunctive dependence** of the initial reward on the *future action* differs critically. Here's the breakdown:

  ### Core Similarity: The Temporal Gap & Reward for Disposition
  - **Parfit's Hitchhiker (PH):**  
    - *T1 (Now):* Stranded in desert. Driver offers rescue *iff* they believe you'll pay $1000 in town.  
    - *T2 (Later):* In town. Paying costs $1000; refusing costs nothing.  
    - Reward (rescue) depends on the driver's belief about your *T2 action*.  

  - **Kavka's Toxin (KT):**  
    - *T1 (Now):* If you form a *genuine intention* to drink a non-lethal but awful toxin at T2, you get $1M now.  
    - *T2 (Later):* Drinking the toxin makes you sick; refusing costs nothing.  
    - Reward ($1M) depends *only* on your *T1 intention*, not your T2 action.  

  ---

  ### The Critical Disanalogy: Subjunctive Dependence
  - **PH Has Strong Subjunctive Dependence:**  
    The driver rescues you **because** they believe your *actual T2 action* will be payment. Your T2 action *causally explains* why you were rescued. If you *wouldn't* pay at T2, the driver (if they knew) *wouldn't* rescue you.  
    → **FDT/UDT Resolution:** You must *actually pay* at T2. Your decision at T2 is part of the "output" of the decision function the driver is predicting. Defecting at T2 would mean your algorithm isn't the type that gets rescued.  

  - **KT Has *No* Subjunctive Dependence on T2 Action:**  
    The $1M is awarded solely based on your *T1 mental state*. The benefactor doesn’t care if you drink the toxin; they only care if you *intended* to at T1. If you *wouldn't* drink at T2, but still formed the intention at T1, you’d *still* get the $1M.  
    → **FDT/UDT Resolution:** You can *intend at T1* to drink, collect $1M, then *rationally defect* at T2. Your T2 action doesn’t affect the reward. The "decision type" that gets paid is "forms intention at T1", not "drinks at T2".  

  ---

  ### Why FDT/UDT Treats KT Differently from PH
  1. **PH Rewards Consistency of the Agent's Algorithm:**  
     The driver chooses to rescue you based on a prediction of your *entire algorithm* (including T2 output). FDT requires your T2 action to align with the algorithm that got you rescued.  

  2. **KT Rewards a Local Mental State at T1:**  
     The benefactor rewards a *snapshot* of your intention at T1. Your T2 action is irrelevant to the reward mechanism. FDT has no reason to drink the toxin because:  
     - Drinking doesn't cause the $1M reward (it’s already in your account).  
     - Not drinking doesn't retroactively lose the $1M.  
     - Your T1 intention already satisfied the condition for payment.  

  ---

  ### Key Structural Differences
  | Feature                | Parfit's Hitchhiker              | Kavka's Toxin Puzzle             |
  |------------------------|----------------------------------|----------------------------------|
  | **Reward Trigger**     | Belief about *future action* (T2) | *Current intention* (T1)         |
  | **T2 Action Affects Reward?** | Yes (rescindable if defect)  | No (reward is fixed at T1)       |
  | **Subjunctive Dependence** | Strong: T2 action *explains* reward | None: T2 action irrelevant     |
  | **FDT/UDT T2 Action**  | **Must pay** (to be rescuable type) | **Defect** (no reason to drink) |
  | **Precommitment Needed?** | No (disposition is sufficient) | Yes (to form T1 intention)     |

  ---

  ### Why the Confusion?
  Both puzzles *feel* similar because they involve:
  - A "disposition" being rewarded before action.  
  - A later moment where acting on the disposition seems irrational.  
  - A tension between current benefit and future costs.  

  However, **KT lacks the feedback loop** present in PH. In PH, your T2 action validates the driver's T1 decision. In KT, your T2 action has no bearing on the benefactor's T1 decision—the $1M is already yours. Drinking the toxin is pure, pointless self-harm.

  ### Conclusion
  The analogy breaks down decisively at the point of **subjunctive/counterfactual dependence**:  
  - **PH:** You *must* follow through at T2 to be the type of agent who gets rescued.  
  - **KT:** You *can and should* defect at T2—the reward is secured solely by your T1 intention.  

  FDT/UDT agents would pay the driver but refuse the toxin. The "commitment device" move only works in PH because the reward *depends on the future action being executed*. In KT, commitment is irrelevant to the reward mechanism—only the *intention* at T1 matters. This is why you can bank the million without ever drinking the toxin.
