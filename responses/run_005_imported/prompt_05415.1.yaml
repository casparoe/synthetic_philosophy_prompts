answer: |-
  ## The Frege-Geach Gauntlet: Can Expressivism Survive its Own Logic? (And Why It Matters)

  You’ve nailed the core challenge: Expressivism’s initial appeal – reducing moral judgments to expressions of non-cognitive attitudes like disapproval or endorsement – founders on the rocks of logic. If “stealing is wrong” *just* boos stealing, what is “if stealing is wrong, then getting your kid brother to steal is wrong” *doing*? It’s not booing anything; it’s setting up a conditional relationship. The Frege-Geach problem demands expressivists explain logical validity (modus ponens, negation, disjunction) without smuggling in the propositional truth-aptness they explicitly reject. Let’s put two leading solutions – Blackburn’s quasi-realism and Gibbard’s norm-expressivism – through their paces with the standard complaints (negation, disjunction, and the nature of inconsistency) and see if they emerge intact, or if expressivism must fundamentally mutate to survive.

  **Blackburn’s Quasi-Realism: Logic as the Dance of Higher-Order Attitudes**

  Blackburn’s response in *Spreading the Word* is elegant and ambitious. He argues we don’t need truth-conditions for moral sentences to have logic; we need *rules governing the expression of attitudes*. Validity, for Blackburn, is about the *consistency of commitments* expressed through higher-order attitudes.

  *   **The Solution:** Taking your modus ponens example:
      *   Premise 1 (P1): "If stealing is wrong, then getting your kid brother to steal is wrong." This expresses a *higher-order attitude*: disapproval of *combining* disapproval of stealing with *lack* of disapproval of getting your kid brother to steal. It’s a commitment to a certain coherence in your attitudes.
      *   Premise 2 (P2): "Stealing is wrong." Expresses disapproval of stealing (first-order attitude).
      *   Conclusion: "Getting your kid brother to steal is wrong." Expresses disapproval of getting your kid brother to steal.
      *   **Validity:** If you accept P1 and P2, but *reject* the conclusion, you exhibit the very combination of attitudes P1 disapproves of (disapproving stealing while not disapproving brother-stealing). This inconsistency in your practical commitments is what makes the argument valid *for expressivism*. Logic tracks the "logic of attitudes."
  *   **The Negation Problem:** What about "Stealing is not wrong"? Blackburn analyzes this as expressing a *lack* of disapproval towards stealing. This seems plausible initially. But the problem intensifies with complex embeddings. Consider "Either stealing is wrong or charity is pointless." What higher-order attitude governs this disjunction? Disapproval of *combining* lack of disapproval for stealing *and* lack of endorsement for the pointlessness of charity? This feels strained. The deeper issue is whether "lack of disapproval" adequately captures the *positive* content often implied by negation (e.g., "permissible"). Is "not wrong" just neutral, or does it sometimes express a *positive* permission? Blackburn’s framework struggles to robustly distinguish these nuances purely in attitudinal terms.
  *   **The Disjunction Problem:** As hinted above, disjunction is a major headache. What *single, unified attitude* does "P or Q" express when P and Q are moral? It’s not obviously disapproval, approval, or a simple lack. Blackburn needs complex higher-order states like disapproval of *failing* to have at least one of the attitudes expressed by P or Q. While logically possible, critics (like Schroeder) argue this becomes unacceptably complex and psychologically implausible. Does an ordinary speaker expressing "Either lying is wrong or keeping promises isn’t required" really harbour this intricate higher-order disapproval?
  *   **Inconsistency as Logic?** Is Blackburn’s "inconsistency of attitudes" doing *real* logical work, or is it just a relabeling? The worry is that he *defines* validity as avoiding a certain attitudinal inconsistency, but this only works because he has carefully *crafted* his higher-order attitudes to *mimic* the logical relations defined by truth-conditional semantics. The suspicion is that propositional logic is the engine, and Blackburn is painting expressivist scenery over it. He hasn’t genuinely derived logic *from* expressivist foundations; he’s constructed expressivist machinery to *simulate* logic derived elsewhere. This is the core of the "just relabeling" charge.

  **Gibbard’s Norm-Expressivism: Planning and Hyperplan Consistency**

  Gibbard, particularly in *Wise Choices, Apt Feelings* and *Thinking How to Live*, shifts the focus. Moral judgments express *acceptance of norms* or, later, *planning* to feel guilt/anger in certain situations. Logic is explained through the consistency of these plans within a "hyperplan" – a complete system of norms governing all conceivable situations.

  *   **The Solution:** Revisiting modus ponens:
      *   P1: "If stealing is wrong, then getting your kid brother to steal is wrong." Expresses a norm (or plan component) that *links* the situations: If your hyperplan calls for feeling guilt about stealing, it *must* also call for feeling guilt about getting your brother to steal. Accepting P1 is accepting this linkage within your normative system.
      *   P2: "Stealing is wrong." Expresses acceptance of a norm (plan component) calling for guilt about stealing.
      *   Conclusion: "Getting your kid brother to steal is wrong." Expresses acceptance of a norm calling for guilt about getting your brother to steal.
      *   **Validity:** If you accept P1 and P2, but reject the conclusion, your hyperplan is *inconsistent*. It endorses feeling guilt for stealing (P2) and endorses the linkage (P1), but fails to endorse feeling guilt for brother-stealing, violating the linkage it accepts. Validity stems from the requirement for global consistency within one's normative planning system.
  *   **Negation & Disjunction:** Gibbard handles these more smoothly than Blackburn by leveraging the resources of possible worlds and hyperplans.
      *   Negation ("Not wrong"): Expresses *rejection* of the norm forbidding the act. It’s a distinct planning state: planning *not* to feel guilt for it. This cleanly distinguishes neutrality from positive permission.
      *   Disjunction ("P or Q"): Expresses a plan that holds *across* different possible hyperplans. It means: *Whichever* hyperplan turns out to be correct (the one where P's norm holds or the one where Q's norm holds), I accept that hyperplan *insofar as it makes P or Q true*. This provides a more unified account of the attitude expressed.
  *   **The Cost: Cognitivist Creep?** Gibbard’s solution is powerful, but its success arguably comes at a price. Explaining validity via hyperplan consistency relies heavily on the *factual* content *about* what plans entail. Saying "If you accept P1 and P2, your hyperplan *must* include the conclusion to be consistent" seems to invoke a *fact* about logical relations between plan contents – facts that exist independently of any individual's attitudes. This looks suspiciously like the propositional, truth-conditional logic expressivism sought to avoid. Has Gibbard functionally introduced a form of cognitivism *about norms or plans*? His later work embraces "plan-laden facts," blurring the line further. Is this still pure expressivism, or a hybrid?

  **The Verdict: Expressivism Survives, But Only by Becoming Quasi-Realist (and That's Significant)**

  Neither Blackburn nor Gibbard offers a flawless, purely expressivist solution uncontaminated by conceptual borrowing. Blackburn’s higher-order attitudes risk being *ad hoc* simulations of logic, struggling with negation and disjunction. Gibbard’s norm-expressivism, while more logically robust, achieves this by implicitly relying on the propositional structure of the *contents* of norms or plans, edging towards a cognitivist understanding of normative systems.

  **Therefore, the Frege-Geach problem does force expressivism to mutate.** It cannot survive as a naive "Boo/Hurrah" theory. It must evolve into sophisticated **quasi-realism** (Blackburn) or **plan-expressivism/hybrid expressivism** (Gibbard). These views *mimic* the logical behavior of realism by constructing complex accounts of attitude expression, commitment, and consistency that map onto traditional logical forms. They successfully *explain why* modus ponens works for moral arguments *without* positing objective moral facts as the truth-makers. This *is* a solution to the Frege-Geach problem *on expressivism's mutated terms*.

  Is this still "expressivism"? **Yes, crucially so.** The core commitment remains: the *fundamental* nature of moral judgment is non-cognitive – it’s *expressing* a practical, action-guiding state of mind (disapproval, endorsement, norm-acceptance, planning). The quasi-realist superstructure *explains* how this expressive core can generate the logical phenomena that make moral discourse look propositional, *without* conceding that it *is* fundamentally propositional. The "mutation" is necessary scaffolding, not an abandonment of the core thesis.

  **Why Your Roommate is Wrong: The Stakes Are Real**

  This isn't a "dumb semantic word-game." The stakes are profound for how we understand ethics itself:

  1.  **The Nature of Moral Argument:** If expressivism *couldn't* solve Frege-Geach, moral arguments would be mere exercises in rhetorical persuasion or emotional manipulation. The fact that quasi-realism *can* explain logical validity shows how robust moral reasoning can emerge from non-cognitive foundations, preserving the seriousness and rationality of ethical debate *even if* there are no objective moral facts. This directly challenges the realist claim that logic *requires* objectivity.
  2.  **The Autonomy of Ethics:** Solving Frege-Geach allows expressivists to maintain that ethics is *sui generis* – not reducible to descriptions of natural facts (naturalism) nor dependent on mysterious non-natural properties (non-natural realism). Morality retains its practical, action-guiding force at its core.
  3.  **Metaphysical Parsimony:** A successful quasi-realist expressivism offers a compelling, metaphysically lightweight account of morality. It explains the *phenomena* of moral discourse (disagreement, argument, logic, apparent truth) without the ontological baggage of realism. This is a major philosophical achievement with real implications for our worldview.

  In conclusion, while the Frege-Geach problem exposes the fatal flaw in *simple* expressivism, thinkers like Blackburn and Gibbard have provided sophisticated solutions by evolving the theory into quasi-realism or hybrid expressivism. These solutions aren't perfect – they involve complex machinery and arguably flirt with the cognitivism they oppose – but they *do* work. They demonstrate that expressivism can account for moral logic on its own (mutated) terms, preserving the core expressive insight while vindicating the rationality of ethical discourse. Expressivism survives the gauntlet, transformed but undefeated, and its success matters deeply for how we conceive of the very fabric of morality. Now, go argue with your section!
