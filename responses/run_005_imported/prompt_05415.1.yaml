  First, I need to recall the core of the Frege-Geach problem. Expressivism says moral statements express attitudes, not beliefs. The problem is explaining logical validity in contexts like conditionals where the moral term is embedded and not directly expressing an attitude. The user mentioned Blackburn's logic of attitudes, Gibbard's norm-expressivism, and Schroeder's "being for" account. I should focus on two, probably Blackburn and Gibbard, since Schroeder's account is more complex and has its own issues.

  For Blackburn, his solution in "Spreading the Word" involves higher-order attitudes. For example, in a conditional like "If stealing is wrong, then getting your brother to steal is wrong," disapproving of stealing without disapproving of getting your brother to steal is a higher-order disapproval. The negation problem arises because negating moral statements isn't straightforward. If "stealing is wrong" expresses disapproval, what does "stealing is not wrong" express? Is it the absence of disapproval or approval? Blackburn's solution might not adequately handle this, leading to the negation problem. The disjunction problem is similar: what attitude does a disjunction express? 

  Gibbard's norm-expressivism uses the idea of planning. Moral judgments express acceptance of norms. In a conditional, accepting a system of norms where if stealing is forbidden, then getting your brother to steal is forbidden. The validity comes from the consistency of planning. But does this capture logical entailment? Critics like Schroeder argue that Gibbard's solution relies on factual content about what plans entail, which might sneak in cognitivism. The worry is that expressivism collapses into a hybrid view.

  The user wants a verdict. I think the answer is that expressivism must evolve into a quasi-realist or hybrid view. Blackburn's quasi-realism attempts to mimic moral truth without ontological commitments. However, this might involve so much mimicry that it's indistinguishable from realism. Gibbard's later work with plan-laden facts also blurs the line. So, expressivism survives but as a hybrid, which might still be "expressivist" if it maintains the core idea that moral judgments are expressions of non-cognitive states, even if they also involve belief-like elements.

  Addressing the roommate's point: the stakes are about the nature of moral discourse. If expressivism can't handle logic, then moral arguments are merely persuasive, not logical. That undermines ethical debate. Solving Frege-Geach is crucial for expressivism to be a viable metaethical theory. The roommate is wrong because the problem shows whether moral language can be both expressive and logically robust, which is central to how we understand ethics.

