answer: |-
  ## Dialogue: The Aquinas Tension on Tyranny

  **Setting:** A quiet corner of a university library, stacks of medieval texts piled between two scholars.

  **Characters:**  
  *   **Dr. Elena Vance:** Defends the "unity" reading using the title/exercise distinction.  
  *   *Dr. Marcus Rossi:* Argues the texts show a significant shift in Aquinas's thinking, minimizing private action.

  **(The dialogue begins as Vance gestures towards Rossi’s open copy of De Regimine Principum.)**

  **Vance:** Marcus, I appreciate the close reading of *De Regimine* III.6, but I think Professor Armitage is fundamentally right. The tension dissolves when we apply Aquinas’s own implicit categories rigorously. In the *Sentences Commentary* (II, d.44, q.2, a.2), he explicitly addresses the *usurper*: someone who violently seizes power *without any title*. He *isn’t* a ruler. He’s a private aggressor against the *res publica*. Resisting him, even lethally, isn't regicide; it’s self-defense against brigandage. The key phrase is “*qui per violentiam potestatem invasit*” – “who by violence has invaded power.”

  **Rossi:** Agreed on the *Sentences* passage, Elena. My contention is that in *De Regimine* (I.6, I.7, III.6), Aquinas deliberately *expands* the scope of what requires caution, implicitly folding the usurper scenario into a broader, more dangerous calculus. When he warns that “*per hoc plurimi tyranni perimuntur*” – “many tyrants are slain” – by ambitious men seizing pretexts, the examples he likely has in mind include figures like Julius Caesar, assassinated ostensibly as a usurper/tyrant. His primary concern isn’t distinguishing title from exercise; it’s the *practical impossibility and danger* of private judgment in *any* act of tyrannicide. Look at III.6: he emphasizes the *multitudo* or the *superior* must act, even against usurpers. He doesn’t carve out a private exception.

  **Vance:** But he *does* distinguish! In *De Regimine* I.6, he defines tyranny *first* by its origin: “*dicitur tyrannus qui violenter principatum obtinet*” – “he is called a tyrant who obtains rulership by violence.” *That’s* tyranny of title. Then he defines tyranny of exercise: “*vel qui violenter principatum habens, in sui commodum male utitur*” – “or who, having rulership by violence, abuses it for his own advantage.” The structure itself separates the initial illegitimacy from subsequent abuse. His caution in III.6 applies overwhelmingly to the *second* type: the ruler who *was* legitimate but becomes tyrannical. Killing *him* privately is fraught because he *was* the public authority. The usurper never held that legitimacy.

  **Rossi:** You’re right about the definitional separation in I.6. But the *practical prescription* in III.6 doesn't neatly follow that split. His argument against private action hinges on universal dangers: the threat to the common good from disorder (“*multa periculosiora sequerentur*” – “many more dangerous things would follow”), the risk of error, and the usurpation of *public* judgment by private individuals. He doesn’t say, “except for the pure usurper, go ahead.” Instead, he consistently channels *all* remedy through the *public authority* (“*auctoritate publica*”) – either the community that established him (even implicitly accepting a usurper?) or a superior like the Pope or Emperor. Where is the private individual in III.6? They’re absent. The *Sentences*’ stark permission feels like youthful theoretical rigor, tempered later by the messy realities of power and the paramount value of public order.

  **Vance:** I see the shift you’re noting, but I read it as emphasis and context, not contradiction. The *Sentences* is a commentary, addressing a theoretical question: *may* one resist an unjust ruler? It gives a precise, limited answer for the clearest case: the pure aggressor. *De Regimine* is a *mirror for princes*, addressed to a *king*. Its primary focus is legitimate rule and its perversion. Aquinas naturally emphasizes the dangers of *misapplying* resistance to *legitimate* rulers who misrule (tyranny of exercise). His silence on the pure usurper in III.6 isn’t retraction; it’s simply not the focus. The framework remains. The *Sentences* establishes the principle: *no title, no authority, ergo resistance isn't rebellion*. *De Regimine* details the complex remedy *where there is, or was, legitimate title*.

  **Rossi:** But doesn’t that very contextual shift reveal a hardening? In the *Sentences*, the private individual has agency against the usurper. In *De Regimine*, even against the usurper, the remedy is relentlessly public. Aquinas elevates *process* and *authority* above the immediacy of private resistance he once countenanced. Consider his language in III.6: “*non est autem humana provisio per privatas personas huiusmodi periculum declinare*” – “it is not a human provision to avoid such danger through private persons.” “*Humana provisio*” – human foresight, prudent governance – demands public channels *in all cases*. The *Sentences*’ permission feels like an abstract deduction from natural law; *De Regimine* reflects a political theologian grappling with the fragility of order. The distinction exists, but its *practical consequence* for resistance is minimized later.

  **Vance:** Minimized, perhaps, in emphasis for that specific audience, but not negated. The principle of *no authority* justifying defense still underpins it. Aquinas isn’t saying the usurper *becomes* a legitimate authority over time. He’s saying that even removing *him* requires prudent, public action where possible, precisely to *avoid* the chaos he fears. But the *Sentences* principle remains the foundation: the usurper lacks *all* just authority *ab initio*. The later caution is about *method*, not the underlying illegitimacy. It’s a unified theory with contextual application.

  **Rossi:** And I contend that the shift in *method* is so profound, driven by heightened concern for public order and distrust of private judgment, that it effectively supersedes the earlier, more permissive stance even for the "pure" usurper case. The later Aquinas seems far less comfortable with *any* private lethal action against *anyone* holding power, regardless of origin. The distinction *explains* the different starting points, but the trajectory of his thought moves towards restricting *all* resistance to public authority. The tension isn't dissolved; it's a marker of development.

  **Vance:** Development in emphasis and context, perhaps. But the core categories – title versus exercise – remain the stable keys to both texts. Without them, *De Regimine*'s specific warnings against killing legitimate-but-tyrannical rulers make *less* sense.

  **Rossi:** And with them, the virtual disappearance of the private individual's right against the usurper in the later, more deliberate work remains striking. Perhaps the distinction is necessary, Elena, but it isn't sufficient to declare perfect harmony. Aquinas's political prudence deepened, and with it, his wariness of the sword in private hands – even against the manifest thief of power.

  **(They both look down at the texts, the arguments hanging in the air – a clear distinction proposed, a significant shift contended, neither fully negating the other, the tension preserved.)**
