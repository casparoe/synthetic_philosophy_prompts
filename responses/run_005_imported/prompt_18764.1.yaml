  Okay, the user is diving deep into metaethics, specifically the evolutionary debunking argument against moral realism. They’ve been self-studying through books and lectures, which shows genuine curiosity and dedication. The core issue they’re wrestling with is whether the evolutionary challenge to morality also applies to logic and math, and why Sharon Street’s asymmetry defense might fail.  

  First, I need to unpack the user’s dilemma clearly. They’ve grasped Street’s argument: evolution links truth and usefulness for logic/math (e.g., believing "1+1=2" aids survival because it’s true), but for morality, Street claims usefulness could diverge from truth (e.g., tribalism might be useful but not objectively moral). The user suspects this asymmetry is unstable—that if evolution debunks morality, it should also debunk logic/math. Their deeper need? To validate whether moral realism can be uniquely targeted or if skepticism inevitably spreads.  

  The user’s friend raised the "companions in guilt" objection, which is a classic move in this debate. Street’s rebuttal hinges on the tracking relation—truth and utility align necessarily in logic/math but contingently in morality. To challenge this, I’ll need to attack three fronts:  
  1. **The necessity of tracking in logic/math**: Even basic logic/math beliefs could’ve been useful but false. For example, evolution might favor approximate arithmetic (e.g., "roughly two" instead of exact "2") that works pragmatically but misrepresents abstract truths.  
  2. **The contingency of moral tracking**: Street assumes moral truths (if they exist) wouldn’t necessarily align with evolutionary usefulness. But if moral realism is true (e.g., Kantian duties or utilitarianism), certain moral beliefs (like reciprocity) might be both true and adaptive, making alignment non-coincidental.  
  3. **Evolution’s indifference**: The mechanism of natural selection doesn’t "care" about truth in any domain. It selects for behavioral outcomes, not accurate representation. A belief that "two stones = two tools" could be neurologically implemented in ways that don’t map to Platonic numbers yet still drive successful action.  

  I’ll structure the argument to show that for both domains:  
  - Evolution could have favored useful false beliefs (e.g., paranoid false positives about predators).  
  - The tracking relation Street describes isn’t inherent to logic/math but requires a realist epistemology even there.  
  - If moral anti-realism is assumed to make tracking contingent, the same could be done for math (e.g., formalism or constructivism).  

  The user’s unspoken need might be to resolve cognitive dissonance: they find the debunking argument compelling but recoil at global skepticism. They want to know if moral realism can be salvaged without special pleading. By dismantling Street’s asymmetry, I’m indirectly supporting either (a) anti-realism across the board or (b) a path to defend realism in both domains. Since the user mentions they’re not a formal student, I’ll avoid jargon but keep rigor.  

  Key moves:  
  - Use Street’s own "dependence" vs."influence" distinction against her: If evolution *influences* moral beliefs without determining them, the same applies to logic/math (e.g., innate number sense isn’t infallible).  
  - Highlight that evolutionarily useful logical beliefs (e.g., non-contradiction) could be grounded in cognitive limitations rather than truth-tracking—much like morality.  
  - Conclude that Street’s criteria force a dilemma: accept skepticism about logic/math or grant morality the same tracking relation. Either way, the debunking argument loses its selective force.
answer: |-
  Your analysis is sharp, and the challenge to Street's asymmetry is well-founded. I'll argue rigorously that her distinction collapses, demonstrating that evolutionary pressures are *equally indifferent* to truth in both moral and logical/mathematical domains. If debunking skepticism applies to morality, it necessarily applies to basic logic and arithmetic. Here's the case:

  ### 1. **Street's Asymmetry: A Recap**
     - **For logic/math**: Street claims a "tracking relationship" exists. Useful logical/mathematical beliefs (e.g., non-contradiction, 1+1=2) *could not have been useful unless they were true*. Usefulness *entails* truth because these beliefs track mind-independent structural features of the world (e.g., physical object aggregation) relevant to survival.
     - **For morality**: No such tracking. Moral beliefs (e.g., "kin loyalty is good") were adaptive *regardless of truth*. Evolution selected for motivational states (e.g., emotions) that promoted fitness, not moral facts. Truth and usefulness come apart: we might believe "kin loyalty is good" because it aided reproduction, even if no moral fact exists.

  This asymmetry fails under scrutiny.

  ### 2. **The Indifference of Natural Selection to Truth in Logic/Math**
  Natural selection optimizes for *reproductive success*, not truth. Beliefs are selected based on their *behavioral consequences*, not their accuracy. For logic/math:
  - **Scenario 1: Useful False Beliefs**  
    Evolution could have favored *approximately true* or *pragmatically effective but false* logical/mathematical beliefs. For example:
    - A belief like "1 + 1 ≈ 2" (where "≈" denotes fuzzy equivalence) might suffice for survival. If ancestors believed "one lion + one lion = three lions" due to perceptual error, but this inflated threat perception enhanced caution and survival, the false belief would be selected. Truth is irrelevant; only behavioral outcomes matter.
    - Non-contradiction might be useful not because it tracks logical truths, but because cognitive dissonance is metabolically costly. A simpler, non-truth-tracking cognitive architecture that avoids conflicting beliefs could be selected without "grasping" logical facts.

  - **Scenario 2: Non-Representational Mechanisms**  
    Logical/mathematical behaviors may arise from non-belief-based cognitive modules. For instance:
    - Subitizing (instantly recognizing small quantities) is an evolved perceptual capacity. It produces *accurate* judgments about small numbers, but not because evolution "aimed" at mathematical truth. It’s a byproduct of visual processing optimized for object tracking. If subitizing misfired in edge cases (e.g., perceiving 2 objects as 3 under stress) but conferred a net survival advantage, it would persist. Truth is incidental.

  - **The Modal Point**:  
    In nearby possible worlds, evolution could have equipped us with consistently *false* logical/mathematical beliefs that nonetheless enhanced fitness. Imagine a species where the belief "1 + 1 = 3" triggers hyper-vigilance, reducing predation. This belief is useful but false. Street must explain why this scenario is impossible, but no evolutionary or logical necessity prevents it. Selection is blind to truth; it sees only fitness payoffs.

  ### 3. **The Alleged Tracking Relation: A Misdiagnosis**
  Street’s "tracking" relationship conflates *correlation* with *causal grounding*. Even if true logical/mathematical beliefs are useful, this doesn’t imply evolution selects beliefs *because* they are true:
  - **Correlation vs. Selection Mechanism**:  
    While true arithmetic beliefs (e.g., "two predators pose greater danger") often correlate with survival, selection acts on the *fitness effects* of the belief, not its truth. The belief’s truth-value is causally inert in the evolutionary process. Natural selection cannot discern truth; it only "sees" behavioral outcomes.
  - **The Disjunction Problem**:  
    Evolution selects for beliefs *that promote survival*, which disjoins "true beliefs" and "useful false beliefs." Unless Street can show that *only* true logical/mathematical beliefs *could* be adaptive (implausible, per Scenarios 1–2 above), the disjunction undermines tracking. Truth is not necessary for usefulness.

  ### 4. **Morality: No Unique Contingency**
  Street claims moral truth and usefulness easily come apart, but this assumes moral anti-realism from the outset. If moral realism holds, however:
  - **Hypothetical Tracking**: If moral facts exist (e.g., "cooperation promotes flourishing"), and if these facts are causally linked to survival (e.g., cooperation enhances fitness), then true moral beliefs *could* be adaptive for the same reason true logical beliefs are—not because evolution "tracks" truth, but because true beliefs align with fitness-relevant structures. Street’s argument against this is circular: it presupposes moral facts *don’t* influence fitness, which is question-begging against realism.
  - **Contingency Cuts Both Ways**:  
    If moral facts exist but are unrelated to fitness (e.g., "suffering is bad" even when it promotes survival), then logical facts could similarly diverge. For example, abstract mathematical truths (e.g., infinitary set theory) have no survival relevance. Our evolved belief in elementary logic might be adaptive but not truth-tracking for complex logical facts. Street’s asymmetry arbitrarily isolates "basic" logic/math, but evolution only shaped beliefs relevant to ancestral environments—not transcendent truths.

  ### 5. **The Dilemma for Street**
  - **Horn 1: Global Skepticism**  
    If evolutionary origins debunk moral beliefs because truth and usefulness *can* come apart, then the same applies to logic/math. We cannot trust *any* evolved cognitive faculties, including those producing logical intuitions. This leads to self-defeating skepticism (we must use logic to debunk logic).
  - **Horn 2: No Debunking**  
    If logic/math is spared because usefulness and truth converge, then moral realists can assert the same: if moral facts exist and relate to fitness, our moral beliefs may reliably track truth. The debunking argument loses its force.

  Street chooses Horn 2 for logic/math and Horn 1 for morality, but the distinction is unsustainable. **The burden is on her to show why evolution is truth-conducive in one domain but not the other, when the selection mechanism—blind fitness optimization—is identical.**

  ### Conclusion: No Escape from Companions in Guilt
  The evolutionary debunking argument, if valid, induces skepticism about *all* domains shaped by natural selection. Logic and arithmetic enjoy no privileged status. Either:
  1. We accept that evolution is generally truth-tracking (protecting both morality and logic), or  
  2. We concede that evolved faculties are globally unreliable (undermining logic and morality).  

  Street’s asymmetry fails because natural selection is indifferent to truth in principle. What saves logic/math is not evolution, but external epistemic grounds (e.g., their necessity for rational thought). Moral realists can similarly appeal to non-evolutionary justifications (e.g., coherentism, reflective equilibrium). The debunking argument, taken seriously, must target logic and math with equal vigor—or abandon its challenge to morality.

  *Key References*:  
  - Shafer-Landau, R. (2012) *"Evolutionary Debunking, Moral Realism and Moral Knowledge"*  
  - Clarke-Doane, J. (2015) *"Justification and Explanation in Mathematics and Morality"*  
  - Joyce, R. (2016) *"Evolution, Truth-Tracking, and Moral Skepticism"* (critiques Street's tracking claim)  
  - Benacerraf, P. (1973) *"Mathematical Truth"* (on the disconnect between truth and access).
