answer: |-
  ## The Substance of Virtue: Moral Worth Beyond the Shadow of Duty

  The quest to understand moral worth – what elevates a merely right action to one that reflects well upon the agent – remains a central preoccupation in moral psychology, haunted by Kant’s influential but problematic shopkeeper. While contemporary philosophers rightly reject the crude demand for occurrent thoughts of duty, the path beyond Kant’s dichotomy leads into a complex terrain. Barbara Herman’s dispositional "limiting condition," Julia Markovits’ "coincident reasons," and Nomy Arpaly’s radical challenge via Huckleberry Finn offer competing visions. This essay argues that while Herman’s view navigates alienation worries, it ultimately retains an unnecessary and problematic vestige of de dicto belief. Markovits’ coincident-reasons account, bolstered by Arpaly’s insights into responsiveness, provides a superior framework for moral worth, requiring only *de re* responsiveness to the objective normative reasons that make the act right. Furthermore, this view not only accommodates but *demands* consideration of the Huckleberry Finn case, revealing a necessary amendment to Markovits: moral worth requires not just the *coincidence* of motivating and justifying reasons, but that the agent’s motivating reasons reliably *track* the justifying ones through a non-accidental sensitivity. This approach decisively answers alienation objections and ensures moral worth is neither reducible to luck nor dependent on the agent’s potentially flawed explicit moral judgments.

  **Herman’s Limiting Condition: Duty Dispositionalized**
  Barbara Herman seeks to preserve a Kantian core while making room for the phenomenology of virtuous action. Her key move is transforming the motive of duty from a specific occurrent thought ("I must do this *because* it is my duty") into a standing disposition: the motive of duty functions as a "limiting condition" on other motives. The loving parent acts *from* love, but their capacity to love is shaped and constrained by a deeper commitment to morality. Duty operates in the background, ensuring non-moral motives (like love or sympathy) are "permitted" only when they align with moral requirements. Crucially, Herman argues this disposition ensures the agent would *not* act on the non-moral motive if it conflicted with duty.

  This view successfully avoids the "one thought too many" objection (Stocker, Williams). The loving friend need not consciously consult duty; their love is already morally "vetted" by their underlying commitment. Action flows directly from the immediate motive (love, sympathy), yet retains a connection to moral principle. Herman thus secures a link to de dicto moral belief, albeit dispositional: the agent possesses and is guided by a general commitment to morality, even if it doesn't figure consciously in every act.

  However, Herman’s view faces significant pressure. First, its requirement of a standing *dispositional de dicto belief* ("morality matters ultimately") seems overly restrictive. Must every morally worthy agent possess this specific, general commitment? Consider an individual raised in a highly particularistic ethical tradition, deeply attuned to the specific needs and relationships before them, acting virtuously out of a profound sense of "fittingness" or "care for *this* person," without ever formulating a general concept of "duty" or "morality." Herman’s framework struggles to accommodate such an agent, potentially denying them moral worth despite impeccable sensitivity to the concrete reasons demanding action. Second, it struggles with cases of *novel* moral insight. An agent confronting a radically new situation might grasp the compelling reasons to act (e.g., reasons against a previously accepted but newly recognized form of oppression) and act on *those reasons*, without yet having integrated this insight into a stable dispositional commitment to morality *as such*. Herman’s requirement risks making moral worth contingent on the prior consolidation of a general moral disposition, rather than on the responsiveness to the reasons present in the situation.

  **Markovits’ Coincident Reasons: The Primacy of Reasons**
  Julia Markovits pushes further, severing the explicit link to duty or even a dispositional moral belief. Her "coincident reasons" thesis states: an act has moral worth if and only if the reasons that *motivate* the agent to act are *identical* to the reasons that *justify* the act (i.e., make it right). Moral worth resides purely in this alignment between the agent’s actual psychological reasons and the objective normative reasons.

  This view elegantly bypasses alienation worries. The morally worthy agent acts *directly* on the very features of the situation that make the action right – the friend’s distress, the promise made, the injustice witnessed. There is no need for a mediating thought about duty; the justifying reasons *are* the motivating reasons. Markovits thus captures the intuition that acting *from* the right reasons is fundamental, whether those reasons concern duty, consequences, relationships, or intrinsic features of acts.

  The strength of Markovits’ view lies in its directness and its focus on the substance of moral justification. However, its core requirement – the *identity* of motivating and justifying reasons – faces a crucial ambiguity exposed by the Huckleberry Finn case. Does "identity" require the agent to *conceptualize* the reasons *as* justifying reasons? Or is it sufficient that the agent is moved by the very facts that *are* the justifying reasons, regardless of how they conceptualize them?

  **Arpaly and Huckleberry Finn: Responsiveness Beyond Judgment**
  Nomy Arpaly, using Huck Finn as her exemplar, argues forcefully for the latter. Huck helps Jim escape slavery while *sincerely believing*, based on his corrupt upbringing, that he is committing a grievous moral sin by violating property rights and aiding a "thief." Yet, Arpaly contends, Huck’s action possesses profound moral worth. He is motivated by direct perception of Jim’s humanity, dignity, suffering, and their shared bond – the very features that *justify* helping Jim. His *explicit de dicto moral judgment* ("This is wrong") is catastrophically mistaken, but his *de re responsiveness* to the morally salient features of the situation – his deep, non-reflective sensitivity to Jim’s personhood – is what matters. Moral worth, Arpaly argues, stems from responsiveness to "the right-making features of [the] action" (*Unprincipled Virtue*), even in defiance of the agent’s own principles.

  The Huck Finn case is a devastating counterexample to any view requiring a *de dicto* belief (occurrent *or* dispositional) that the act is right. Herman’s dispositional limiting condition seems absent; Huck believes he is *violating* his duty. Markovits’ coincident reasons seem present: Huck is motivated by Jim’s humanity and suffering – the core justifying reasons. Yet, if Markovits requires the agent to conceive their motivating reasons *as* justifying, Huck fails, as he sees his motivating reasons as temptations *away* from what he judges to be right.

  **Synthesizing Responsiveness: A Modified Coincident-Reasons View**
  This forces a critical amendment to Markovits. Moral worth requires not merely that the *content* of the motivating reasons coincides with the content of the justifying reasons, but that the agent’s responsiveness to those reasons demonstrates a reliable *sensitivity* to the normative landscape. The agent must be moved *by* the right-making features *as* the right-making features – not necessarily under that description, but in a way that reflects an accurate, non-accidental grasp of their normative force. Huck’s worth arises because his compassion reliably tracks the *moral significance* of Jim’s plight, even though his explicit moral vocabulary cannot articulate it. His action manifests a kind of *practical knowledge* of the good, embodied in his responsiveness, distinct from his flawed propositional beliefs.

  This amended view – **Coincident Reasons plus Reliable Sensitivity (CR+RS)** – explains why the shopkeeper lacks moral worth. His motivating reason (long-term profit) coincides *contingently* with the justifying reason (honesty as required for fair dealing). However, his responsiveness shows no sensitivity to the normative force of fairness; he would cheat if it were profitable and undetectable. His coincidence is luck, not virtue. In contrast, Herman’s honest shopkeeper (acting from the limiting condition) and Arpaly’s Huck both exhibit the required reliable sensitivity, albeit through different psychological mechanisms (a dispositional moral commitment vs. deep empathic perception). The CR+RS view thus *accommodates* Herman’s virtuous agent (their disposition ensures reliable sensitivity) but crucially *also* accommodates Huck Finn and the particularistic agent, showing why their lack of a general de dicto moral belief doesn't preclude worth.

  **Answering Alienation and Luck**
  This view decisively answers the alienation objection. Stocker and Williams worry that inserting "duty" as a thought between the agent and their friend renders the action cold and alienated. The CR+RS view eliminates this mediating thought entirely. The morally worthy friend acts *directly* on the reasons provided *by the friend and the relationship itself* – their need, the shared history, the value of the bond. These are the justifying reasons, and they are also the motivating reasons. There is no "one thought too many" because the agent needs no thought *about* duty; they are fully engaged with the object of their care. The reliable sensitivity ensures this direct engagement is not mere whimsy or luck, but reflects a stable orientation towards the good inherent in the situation.

  Furthermore, CR+RS avoids collapsing moral worth into lucky conformity. The requirement for *reliable sensitivity* ensures that the coincidence of motivating and justifying reasons is non-accidental. It arises from the agent’s stable character or capacity to perceive and respond appropriately to moral reasons. The shopkeeper’s conformity *is* accidental luck; Huck’s action, born of deep empathy attuned to human suffering, is not. His worth stems from *why* the reasons move him – because he reliably grasps their true moral weight, even if his conscious judgment misfires.

  **Verdict: Worth as De Re Responsiveness with Reliable Tracking**

  The Huckleberry Finn case is not a peripheral anomaly; it is a central challenge illuminating the core of moral worth. It demonstrates conclusively that moral worth does *not* require a *de dicto* belief – occurrent or dispositional – that one’s action is right. Barbara Herman’s valiant attempt to preserve a dispositional link to duty ultimately imposes an unnecessary condition that excludes intuitively worthy agents like Huck and the particularist.

  Julia Markovits’ coincident-reasons thesis provides the essential foundation: moral worth resides in being moved by the very reasons that make the act right. However, as Huck Finn reveals, Markovits’ account, strictly construed, needs amendment. Mere coincidence is insufficient; it must result from a **reliable sensitivity to the normative force of those reasons**. Moral worth requires *de re* responsiveness to the objective right-making features, coupled with the non-accidental capacity to track those features – a capacity manifested in the agent’s motivation being *appropriately determined* by the genuine normative landscape.

  This CR+RS view successfully navigates the twin pitfalls: it avoids the alienation inherent in requiring explicit or dispositional duty-thoughts by focusing on direct engagement with the substance of the moral situation, and it avoids reducing worth to luck by demanding a reliable connection between the agent’s psychology and the objective reasons. Moral worth, therefore, is the hallmark of an agent whose actions flow from a deep, reliable attunement to the good, an attunement that may often operate beneath the level of explicit judgment, guiding them to act rightly *for* the right reasons, even when their conscious mind tells them they are wrong. It is this responsiveness to the moral reality of the situation, not the agent's self-consciousness about duty, that constitutes the true substance of virtue.
