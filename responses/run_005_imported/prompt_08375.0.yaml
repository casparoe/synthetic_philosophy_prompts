answer: |-
  You're absolutely not being irrational, and your roommate is missing several crucial psychological and philosophical dimensions of this situation. Her argument relies on a purely logical identity premise ("Jake = nightowl92, therefore knowing Jake = knowing nightowl92"), but human knowing and relationships don't work like symbolic logic, especially intro-level logic. Here's why your reaction makes perfect sense:

  1.  **Context Creates Separate Personas:** We present different facets of ourselves in different contexts. Jake-the-lab-partner exists in a specific, real-world setting with defined roles (academic, possibly guarded, focused on lab work). Nightowl92 existed in a context of anonymity, intimacy, and potentially different topics. These contexts *shaped* the person you interacted with. The "Jake" you knew was filtered through the lab partner role; "nightowl92" was filtered through the anonymous confessional role. Discovering they were the same person forces you to integrate these two distinct *presentations* of the same individual.

  2.  **The Power of Anonymity & Projection:**
      *   **Anonymity Breeds Honesty & Vulnerability:** Conversations under anonymity often involve a level of openness and vulnerability that doesn't happen face-to-face, especially with someone you have a defined, non-intimate relationship with (like a lab partner). You might have shared or heard things with nightowl92 that Jake would never say in lab.
      *   **Projection:** Without a face or known identity, you inevitably filled in the gaps about nightowl92 with your own imagination. You created a mental image and persona based *only* on the words exchanged. This persona, while built on Jake's thoughts, existed independently in your mind as "nightowl92."

  3.  **Information vs. Integration:** You didn't learn *new facts* about Jake's history in the abstract sense (e.g., his birthday or hometown). What you learned was the **integration key** – the information that allows you to *merge* two previously separate sets of knowledge and experiences into one coherent understanding of a single person. This is massive cognitive and emotional work! It fundamentally changes your understanding of:
      *   Who Jake *really* is (revealing depth you didn't see in the lab context).
      *   The nature of your past interactions with nightowl92 (realizing they came from someone you physically knew).
      *   Your own vulnerability in those anonymous conversations.
      *   Jake's perception of *you* (he knew who *you* were all along, while you were anonymous to him? Or did he discover your identity too? Either way, the power dynamic shifts).

  4.  **Collapsing the "Actor-Network":** Think of Jake-in-lab and nightowl92-on-app as two distinct "nodes" in your social network. Discovering they are the same person collapses those two nodes into one. This isn't just adding data; it's restructuring your entire mental map of your social world and the relationships within it. That *feels* huge because it *is* a restructuring.

  5.  **The Shock of Revelation:** There's a fundamental difference between knowing two things separately and knowing they are connected. Imagine knowing Person A loves classical music and Person B broke your favorite mug. If you later discover Person A *is* Person B, it changes your feelings about *both* the music lover and the mug-breaker instantly. The connection *itself* is new and significant information.

  **Why Intro Logic Doesn't Cover This:**

  Intro logic deals with abstract symbols and propositions (If P, then Q. P is identical to R, therefore...). It doesn't model:
  *   The contextual nature of human identity presentation.
  *   The psychology of anonymity and projection.
  *   The emotional weight of integrating separate relationship experiences.
  *   The cognitive load of restructuring your understanding of someone.

  **What Your Roommate Misses (The Core Flaw):**

  She's reducing "knowing someone" to possessing a set of atomic facts about them (name, face, lab skills). But "knowing" a person is a dynamic, contextual, and relational process. She ignores:
  *   **The Mode of Knowing:** Knowing someone face-to-face in a specific role vs. knowing them through anonymous text creates vastly different *kinds* of knowing.
  *   **The Relational Aspect:** Your *relationship* with nightowl92 was fundamentally different from your relationship with Jake. Merging those relationships is inherently transformative.
  *   **The Emotional & Cognitive Impact:** The surprise, the shift in perception, the need for integration – these are real psychological events, not logical fallacies.

  **Conclusion:**

  Your reaction is completely rational and human. You didn't just learn Jake's username; you experienced a profound **context collapse** and **persona integration**. This revelation provided deep, meaningful insight into Jake's character (revealing a side you never saw) and fundamentally altered your understanding of your past interactions and the nature of your connection. Your roommate's argument is reductive and ignores the complexities of human identity, relationship dynamics, and the psychology of anonymity. It *is* huge news, and feeling that way is perfectly valid. It's not irrationality; it's the natural human response to a significant shift in your social reality.
