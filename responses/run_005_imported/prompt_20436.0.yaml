  We are going to verify Priya's claim: in Risk-Weighted Expected Utility (REU) theory, it can be rational to turn down free information. We will construct a concrete example.

  REU theory uses:
  - A utility function u (which we can assume without loss of generality is increasing and continuous).
  - A risk function r: [0,1] -> [0,1] which is increasing and convex (for risk-averse agents) and satisfies r(0)=0, r(1)=1.
  - The REU of an act is computed by ordering the outcomes from worst to best, then computing:
      REU = u(x_0) + Σ_{i=1}^{n-1} [u(x_i) - u(x_{i-1})] * r(1 - F(x_i))
    where F is the cumulative distribution function (but note: in the discrete case, we can use a similar formula).

  Alternatively, for a discrete act with outcomes x_1 < x_2 < ... < x_n with probabilities p_1, p_2, ..., p_n, we can compute:
      REU = u(x_1) + Σ_{k=2}^{n} [u(x_k) - u(x_{k-1})] * r(Σ_{j=k}^{n} p_j)

  This is because the risk function is applied to the probability of getting at least x_k (which is the survival function) but note that the risk function is applied to the cumulative probabilities in a transformed way.

  Actually, the standard formula for REU for a discrete distribution with outcomes ordered from worst to best (x_1 < x_2 < ... < x_n) is:
      REU = Σ_{i=1}^{n} p_i * [ u(x_i) * (r(Σ_{j=i}^{n} p_j) - r(Σ_{j=i+1}^{n} p_j)) ] 
  But a more common form is:
      REU = u(x_1) + Σ_{i=2}^{n} [u(x_i) - u(x_{i-1})] * r(Σ_{j=i}^{n} p_j)

  We'll use the latter.

