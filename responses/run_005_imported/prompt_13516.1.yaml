prompt: |-
  so I'm on the committee that runs the internal forecasting tournament at the org I work for -- basically a mini Good Judgment Project, people submit probabilities on stuff like "will this intervention show a significant effect at 12-month follow-up," scored with a log score, and the results feed into actual funding calls. we built a live dashboard so everyone sees everyone else's running forecast and can update on it, because obviously more info-sharing = more accurate, right, very aumann-agreement-pilled of us. except over the last 50ish resolved questions we're seeing textbook herding: whoever posts first anchors basically everyone, the spread of final forecasts has gotten way tighter even on questions where people's private info should differ alot, and on the ones we now know the answer to, the anchored consensus was sometimes confidently wrong in ways a bunch of people admitted afterward (in DMs, never on the dashboard) they'd privately doubted.

  the committee's split three ways: go back to fully blind submission till everyone's in; keep it open but switch to something like Prelec's surprisingly-popular scoring so we're eliciting private info instead of numbers people feel pressure to match; or leave it alone, since each person really was updating rationally on the info they actually had, so "groupthink" is an unfair word for it and it's not our job to override genuinely rational updates just because we dislike the aggregate result.

  can you draft the memo for monday's meeting -- an actual recommendation specific enough to roll out next quarter, the mechanics of why this is happening (not just "groupthink"), and a real engagement with that third camp, since I think they've got a point even if it shouldn't be the last word.
