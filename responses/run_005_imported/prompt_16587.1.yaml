  Ah, but the philosopher's move 4 privilege critique lands hard. Modern readers *will* bristle at Cato's elite perspective. Yet the classicist's move 5 comeback is clever: Cicero preempts this by blaming bad old age on character, not luck. Both make valid points—text vs. context. 

