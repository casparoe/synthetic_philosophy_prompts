  Hmm, their frustration with predictable quasi-realist responses is palpable. They want to force the guest to actually demonstrate how the theory works, not just assert that it does. The five requested question types are smartly targeted: (1) modus ponens demonstration (demands concrete application), (2) higher-order attitude critique (tests for infinite regress), (3) validity/negation distinction (prevents handwaving), (4) non-standard embeddings (exposes coverage gaps), and (5) creeping minimalism (questions the view's coherence). 

  For the modus ponens question, I'll need to construct a simple but airtight example where the same moral term appears asserted and unasserted. The guest will likely invoke "expression" vs. "consideration" of attitudes—so the follow-up must challenge whether that distinction holds under logical pressure. 

  The higher-order attitude question is where things get spicy. Quasi-realists do claim disapproval-of-disapproval resolves inconsistency, but if the original problem was about non-cognitive states failing logic, why wouldn't this recur at the meta-level? The follow-up should preempt their "but second-order states are still conative!" dodge by demanding functional equivalence to cognitive inconsistency. 

  Ah, the validity/negation separation is crucial. Guests often treat solving for negations (e.g., "Lying isn't wrong") as solving the whole embedding problem. Need to explicitly demand why validity preservation—say, in disjunctive syllogism—isn't a distinct hurdle. Follow-up should block the "same solution applies" deflection. 

  Non-standard embeddings are quasi-realism's Achilles' heel. Attitude reports ("Ann believes...") are particularly nasty because they force an account of what non-cognitivists even mean by "belief." Quantifiers like "everything he did was wrong" require generalizing attitude expression in ways that feel ad hoc. Follow-ups here must resist "we've modeled it" claims by demanding psychological plausibility. 

  Creeping minimalism is the nuclear option. Once quasi-realism reconstructs truth, logic, and reference, the "non-cognitive" label seems purely ceremonial. The follow-up should press whether rejecting mind-independence (their last bastion) just concedes that the substantive debate is over. 

  ...Better draft these with academic rigor but podcast-friendly concision. No jargon dumps—every question must sound conversational while targeting technical weak points. And each follow-up should anticipate the guest's escape routes and cut them off. Let's go.
answer: |-
  Here are 8 targeted questions designed to push the quasi-realist expressivist guest on the core challenges you've identified, complete with anticipated replies and sharp follow-ups:

  ### Core Questions & Follow-Ups

  1.  **The Modus Ponens Demonstration:**
      *   **Question:** "Could you walk us through *exactly* how your account handles a specific modus ponens inference, like: 'If lying is wrong, then getting your little brother to lie is wrong. Lying is wrong. Therefore, getting your little brother to lie is wrong.' Crucially, explain how the meaning of 'lying is wrong' – specifically the *type* of mental state it expresses – remains constant when it's asserted (in premise 2) versus when it's unasserted and embedded in the antecedent of the conditional (premise 1)."
      *   *Anticipated Reply:* She'll likely appeal to "considering" or "entertaining" the attitude/plan in the antecedent, rather than expressing it. The conditional expresses a higher-order attitude (e.g., disapproval of combining disapproval of lying with *not* disapproving of getting brother to lie). Validity comes from the inconsistency of accepting the premises but rejecting the conclusion.
      *   **Follow-Up:** "When I *consider* 'lying is wrong' in the antecedent, am I merely contemplating the *proposition* that lying is wrong? If so, doesn't that presuppose cognitivism? If not, and I'm contemplating my *own attitude* of disapproval, how does embedding that *attitude-contemplation* within the conditional's expression of a *different* higher-order attitude ensure the *same content* 'lying is wrong' is meaningfully shared between premise 1 and premise 2 in a way that grounds validity?"

  2.  **Higher-Order Attitudes: Relocating Frege-Geach?**
      *   **Question:** "You explain the inconsistency in denying the modus ponens conclusion by appealing to a higher-order attitude (e.g., disapproval of a certain combination of first-order attitudes). But isn't the original Frege-Geach problem precisely about how non-cognitive states *themselves* don't stand in logical relations like inconsistency? Doesn't shifting the inconsistency to a conflict between *higher-order* non-cognitive states just relocate the problem? Why is inconsistency between two conative higher-order states any less mysterious for logic than inconsistency between two first-order conative states?"
      *   *Anticipated Reply:* She'll argue higher-order attitudes *do* stand in rational, quasi-logical relations (e.g., disapproval of disapproval is incoherent in a way analogous to contradiction). The system of attitudes has its own internal "logic" of coherence.
      *   **Follow-Up:** "If the 'incoherence' or 'inconsistency' between higher-order attitudes is *sui generis* and not ultimately grounded in representational failure or truth-conditions, how is this functionally different from simply *stipulating* that certain combinations of attitudes are 'invalid'? Doesn't this risk making the 'logic' of attitudes merely conventional, rather than capturing the *necessary* preservation of truth we associate with logical validity?"

  3.  **Negation vs. General Validity Preservation:**
      *   **Question:** "Quasi-realists often focus heavily on negation (e.g., explaining 'Lying isn't wrong'). But Frege-Geach is broader: it's about preserving validity across *all* complex embeddings. Can you clearly separate how your account handles the *specific* problem of negation from how it guarantees the validity of inferences involving other connectives? For example, how does your account ensure the validity of a disjunctive syllogism like: 'Either cheating is wrong or stealing is permissible. Cheating is not wrong. Therefore, stealing is permissible'? Is the mechanism fundamentally different from handling negation in isolation or modus ponens?"
      *   *Anticipated Reply:* She'll likely say the same core mechanism applies – higher-order attitudes governing combinations. Negation might be a building block, but the solution generalizes using the same expressive resources (plans/norms for combinations).
      *   **Follow-Up:** "If the solution relies *entirely* on expressing higher-order attitudes governing *combinations* of attitudes/acceptances, how does this account for the *specific semantic contribution* of each logical operator (negation, disjunction, conditional) within the moral vocabulary? Does 'not wrong' express a distinct higher-order attitude from the one expressed by the disjunction 'Either P or Q'? If not, how do we recover the distinct logical roles of the operators?"

  4.  **Beyond Conditionals & Negation: Quantifiers & Attitude Reports:**
      *   **Question:** "Let's move beyond conditionals and negation. Take a universal quantifier: 'Everything the Senator said yesterday was wrong.' According to expressivism, what non-cognitive state does *this* express? Is it a single, highly complex attitude? A general plan? How does this expression work? Similarly, consider an attitude report: 'Ann believes that cheating is permissible.' If Ann is also an expressivist, what is *she* doing when she 'believes' that? And what non-cognitive state is *the speaker* expressing by attributing this 'belief' to Ann?"
      *   *Anticipated Reply:* For quantifiers: Expressing a general plan to disapprove of each instance, or a norm against any instance. For attitude reports: Expressing a higher-order attitude about Ann's conative state (e.g., acceptance of Ann having the plan/permissive attitude towards cheating).
      *   **Follow-Up (Quantifiers):** "Does expressing a 'general plan to disapprove of each instance' require the speaker to have *considered* every single thing the Senator said? If not, how is this 'plan' meaningfully different from accepting the *proposition* that all the Senator's statements were wrong? Doesn't the need for a general, potentially infinite, plan start to look cognitivist?"
      *   **Follow-Up (Attitude Reports):** "When I say 'Ann believes cheating is permissible,' am I describing Ann's psychology (a cognitive claim about her mental state), or am I expressing *my own* non-cognitive attitude *towards* her non-cognitive attitude? If the former, haven't I lapsed into cognitivism *about moral psychology*? If the latter, how is this different from me just saying 'I disapprove of Ann's permissive attitude' – which seems to lose the crucial *doxastic* ('believes') element of the report?"

  5.  **The Creeping Minimalism Challenge:**
      *   **Question:** "Once quasi-realism has done the impressive work of 'earning back' truth-aptness, logical validity, robust disagreement, reference, and even knowledge-talk via sophisticated accounts of expression and higher-order attitudes... what *substantive content* remains to the claim that you are a *non-cognitivist* or *anti-realist*? If moral sentences behave logically *exactly like* descriptive sentences, can be true/false *in a deflationary sense*, and track stance-independent correctness conditions *internal to our normative perspectives*... how is this functionally different from a cognitivist realism, except perhaps by insisting the underlying metaphysics is 'projectivist'? Isn't this 'creeping minimalism'?"
      *   *Anticipated Reply:* The crucial difference is the *underlying nature* of the mental state: conative (attitude/plan) vs. cognitive (belief). The "truth" is still grounded in our attitudes, not mind-independent facts. The quasi-realist earns the *language* of realism but denies its *metaphysics*.
      *   **Follow-Up:** "But if the 'truth' of 'Torture is wrong' is made true *only* by our (perhaps idealized) collective disapproval of torture, and this 'truth' functions identically to the deflationary truth of 'Snow is white' in all logical and conversational contexts, what *practical or theoretical difference* does the underlying conative state make? If the 'mind-independence' of moral facts is the *only* thing distinguishing your view from realism *after* all the earning back, doesn't that concede that the core debate has collapsed into a verbal disagreement about the label 'mind-independent', while the substantive functioning of moral discourse is now indistinguishable?"

  ### Additional Potent Questions

  6.  **The "Just More Psychology" Challenge:**
      *   **Question:** "When you explain moral inconsistency (e.g., accepting the modus ponens premises but denying the conclusion) as a kind of psychological incoherence in our attitudes/plans, aren't you reducing moral error to a form of *personal irrationality*? How does this account for the *objectivity* and *authority* of moral requirements? If I *am* psychologically coherent in my terrible attitudes (e.g., consistently approving of torture), does that make torture permissible *for me* on your view?"
      *   *Potential Follow-Up:* "How does your appeal to 'idealization' (e.g., what we'd disapprove of under full information) avoid collapsing into a form of naturalistic realism, where moral facts *are* facts about idealized human responses?"

  7.  **The Explanatory Burden:**
      *   **Question:** "Realists often argue their view has superior *explanatory power*: e.g., explaining the categorical nature of moral demands, the phenomenology of moral discovery, or the convergence we hope for in moral inquiry. After your sophisticated quasi-realist reconstructions, what phenomena do you think your expressivism *better explains* than a suitably sophisticated realist view? What's the positive explanatory advantage that justifies the complex apparatus?"

  8.  **The Challenge from Moral Deliberation:**
      *   **Question:** "When I deliberate morally, it *feels* like I'm trying to discover mind-independent facts – to 'get it right.' Realists say this phenomenology is veridical. Error-theorists say it's systematically mistaken. How does quasi-realism account for this phenomenology? Are we systematically confused about the nature of our own activity when we take ourselves to be discovering moral truths? Or does quasi-realism somehow vindicate this feeling of discovery?"

  **Key Interview Strategy:**

  *   **Listen Closely:** Pay attention to *exactly* how she describes the mental states expressed in different contexts (asserted, embedded).
  *   **Pin Down Terminology:** Don't let "expression," "consideration," "plan," "inconsistency," "validity," or "truth" slide. Ask for clarification on *what kind of thing* is being expressed or what *grounds* the inconsistency/validity.
  *   **Demand Specifics:** Insist on concrete examples and step-by-step explanations. Don't accept "the solution handles it" or appeals to abstract "norms" without unpacking the mental state expressed *now*.
  *   **Highlight Functional Equivalence:** Constantly press on whether the quasi-realist reconstruction, once complete, *functions* any differently in practice from a cognitivist account using deflationary truth. The "creeping minimalism" question is your hammer here.
  *   **Connect to the Bigger Picture:** Link technical points (like attitude reports) back to the core metaphysical disagreement (mind-dependence vs. independence).

  These questions force the guest beyond slogans and into the technical and philosophical trenches where quasi-realism faces its toughest tests. Good luck with the podcast!
