prompt: |-
  Okay this is gonna sound niche but here's my actual situation. I'm a junior and somehow I ended up on my school's Equity & Access Committee, a student council subcommittee that pretty much nobody wanted to join except me and three other people. An alum just donated $12,000 specifically so "money isn't the reason a kid can't do a sport, a club trip, or an audition," and our committee has to write the actual recommendation for how to divide it up before it goes to a full council vote next Thursday. There's basically three camps and none of them are budging, wich is exhausting to sit through every meeting. Camp one wants to just split it evenly — like a $60ish voucher for every kid who signs up for something — because it's simple and nobody can call it unfair. Camp two (mostly kids on the activity-fee waiver list) wants it scaled to family income, so a kid whose family can't afford the trip fee gets a lot more than a kid who just wants extra cash for a jersey. Camp three, led by this girl who will not stop bringing up the "capabilities" unit from AP Human Geo, says even income-based cash won't fix it for everyone, because some kids also work after school or watch siblings, so money alone doesnt actually get them to practice or rehearsal — they'd need stuff like guaranteed release time or a late activity bus, not just a check.

  I have to bring an actual draft to Thursday's meeting, not just a list of pros and cons, so could you write the real memo? Pick one concrete allocation plan — real numbers and criteria, not vague principles — that the committee could actually vote on and start using next semester, and keep it to like a page. The part I keep getting stuck on is camp one's objection to camp two: is it actually unfair to give some kids more money than others for the "same" opportunity, or does that only sound fair because it ignores why they need more in the first place? I don't want the memo to just steamroll that objection — I want it to actually deal with it, since half the committee (and probably our advisor) is pretty sympathetic to it.
reasoning: |-
  Okay, let me unpack this user's situation. They're a junior on a school Equity & Access Committee tasked with distributing a $12,000 donation to remove financial barriers for activities. The committee is deadlocked between three approaches: equal vouchers, income-based scaling, and non-monetary supports. 

  The user needs a concrete allocation plan draft by Thursday that addresses the fairness debate head-on. What's really at stake here isn't just money distribution - it's about defining what "equal opportunity" means. The camp one vs camp two tension reveals a philosophical divide: surface-level equality versus equity-based justice.

  Hmm... the user's hidden challenge is political navigation. They need a solution that respects all viewpoints while being actionable. The alum's intent ("money isn't the reason...") suggests prioritizing barrier removal over strict equality. Camp three raises valid structural issues, but those require policy changes beyond this fund's scope.

  I'm considering a hybrid approach: means-tested grants for direct costs plus small equal credits for participation incentives. This acknowledges camp two's equity focus while giving camp one their "universal benefit" element. For camp three's concerns, I'll recommend those as separate policy proposals to show we heard them without derailing the fund's purpose.

  The fairness objection needs direct engagement. I'll argue that equal funding ignores disparate needs - like charging all students the same for glasses regardless of vision. The memo should reframe "fair" as "sufficient to participate," not "identical dollar amounts."

  Practical constraints: Must allocate all funds, use existing income data (free/reduced lunch lists), and avoid complex administration. Tiered grants based on known fee waiver status meets this. Adding universal $15 credits makes it feel less targeted while covering small costs like equipment.

  For the draft structure: Start with the alum's intent, explain why equity-based distribution honors that, define grant tiers with concrete examples, address fairness concerns proactively, and separate non-fund solutions as recommendations. Keep tone collaborative - "after considering all views" rather than "rejecting camp one."
answer: |-
  Here’s a concrete, equity-focused allocation plan drafted as a formal committee memo addressing the fairness concern head-on. It prioritizes need while acknowledging camp one’s valid desire for simplicity and universality:

  ---

  **MEMORANDUM**  
  **TO:** Equity & Access Committee  
  **FROM:** [Your Name], Committee Member  
  **DATE:** [Current Date]  
  **SUBJECT:** Proposed Allocation Plan for Alumnus Donation ($12,000) – Equity-Based Grants with Universal Participation Credit  

  ### Background  
  Following the generous $12,000 donation to ensure "money isn’t the reason a kid can’t participate," this proposal allocates funds based on **demonstrated financial need** to maximize impact, while including a small universal credit to acknowledge all students. After reviewing all perspectives, this plan addresses Camp Two’s focus on equity, Camp One’s call for simplicity and broad inclusion, and Camp Three’s insight that money alone isn’t always sufficient (addressed via non-monetary recommendations).  

  ---

  ### Proposed Allocation Plan: Tiered Equity Grants + Universal Participation Credit  
  **Total Funds:** $12,000  
  **Allocation Structure:**  
  1. **Tiered Need-Based Grants (90% = $10,800):**  
     - Distributed based on **existing school fee-waiver status** (using verified family income data already on file).  
     - **Tiers:**  
       - **Tier 1 (High Need):** Students qualifying for **free meals**  
         - **Grant:** **$250 per activity** (sport, club trip, or audition)  
       - **Tier 2 (Moderate Need):** Students qualifying for **reduced-price meals**  
         - **Grant:** **$150 per activity**  
       - **Tier 3 (Standard):** All other students  
         - **Grant:** **$50 per activity**  

  2. **Universal Participation Credit (10% = $1,200):**  
     - **$15 credit** for **every student** who registers for *any* fee-based activity.  
     - Applied automatically to cover incidental costs (e.g., team socks, club T-shirt, sheet music).  

  ---

  ### Key Mechanics & Fairness Safeguards  
  - **Simple Application:** Students apply via existing activity sign-up forms, checking a box for fee assistance. The Athletics/Activities Office verifies tier eligibility using current data (no new paperwork).  
  - **Per-Activity Cap:** Grants apply per activity/event (e.g., one sport season = one grant; a club trip = one grant). Prevents stacking but allows support for multi-activity students.  
  - **Universal Benefit:** The $15 credit ensures every participating student receives tangible support, addressing Camp One’s fairness concern.  
  - **Max Impact:** Targets students who would otherwise be excluded. A Tier 1 student using a $250 grant for a $300 band trip receives meaningful access; a Tier 3 student using $50 for the same trip gets supplemental help.  
  - **Transparency:** Tier criteria use objective, pre-existing data (free/reduced meal status).  

  ---

  ### Addressing the Core Fairness Objection  
  **"Is it fair to give different amounts for the same opportunity?"**  
  Yes, when the goal is **equitable access**, not identical treatment. Equal funding ($60 for all) ignores that barriers are unequal:  
  - A student from a low-income household faces a $300 trip fee as a **crisis**; for another, it’s an inconvenience.  
  - **Fairness = Removing Barriers Proportional to Need:** Providing $250 to a student who otherwise *couldn’t go* achieves the donor’s intent. Giving $60 to all leaves the neediest students still excluded.  
  - **The Universal Credit ($15) ensures every participant benefits**, softening perceived disparities.  

  ---

  ### Non-Monetary Recommendations (Addressing Camp Three)  
  While this fund addresses *financial* barriers, we recommend the Student Council separately pursue:  
  1. **Activity Scheduling Advocacy:** Request faculty/staff avoid scheduling mandatory tests/reviews during key activity times (e.g., game days, dress rehearsals).  
  2. **Late Transportation Pilot:** Propose a 1-day/week late activity bus for students reliant on district transportation.  
  *(Note: These require policy changes beyond this fund’s scope but are critical for true equity.)*  

  ---

  ### Estimated Impact & Budget  
  - **Tiered Grants ($10,800):**  
    - Assuming 50 Tier 1 students @ $250 = $12,500 → **Cap: Serve first 43 Tier 1 students** (or adjust tiers if demand exceeds funds).  
    - Scales proportionally for Tiers 2/3.  
  - **Universal Credit ($1,200):** Covers **80 students** @ $15 each.  
  **Total Students Served:** 120+ (prioritizing high-need students first).  

  ---

  ### Recommendation  
  This plan delivers **equitable access** (aligned with the donor’s intent) while ensuring **every participant benefits**. It uses objective data, minimizes administrative burden, and directly addresses the varied financial barriers students face. We move to approve this allocation for the 2024-2025 school year.  

  **VOTE: ☐ APPROVE ☐ REVISE ☐ REJECT**  

  ---

  ### Why This Works  
  1. **Tackles the Fairness Debate:** Explicitly argues equity ≠ equality and uses the universal credit as a compromise.  
  2. **Uses Existing Systems:** Leans on verified meal data (no new bureaucracy).  
  3. **Real Numbers:** Clear tiers, caps, and per-activity logic.  
  4. **Acknowledges Camp Three:** Separates non-monetary solutions (which need broader advocacy).  
  5. **Aligned with Donor Intent:** Focuses funds where financial barriers are highest.  

  Present this as the committee’s middle path—one that centers **need** without excluding anyone. Good luck!
