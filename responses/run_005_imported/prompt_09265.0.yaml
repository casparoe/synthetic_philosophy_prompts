  ok so this happened at ethics bowl practice and it's been stuck in my head since. our coach gave us this case: there's a chip in your brain that scans you right before you make a choice — say, whether to keep a wallet you found stuffed with cash or turn it in. if the chip detects you're about to keep the wallet, it forces your brain to turn it in instead. but if it detects you're gonna turn it in on your own anyway, it does nothing, it just sits there the whole time. coach asked: in the case where it never had to activate (the person turns it in totally on their own), do they still deserve moral credit for that, even though they literally could not have kept the wallet? she said this is basically the "principle of alternative possibilities" thing — that you can only be praised or blamed for stuff you could've done otherwise.

  me and my friend got into it after practice and couldn't agree on anything:

  (1) jake said obviously yes, they deserve full credit, because the chip never fired, so the actual reason the wallet got returned was just the person's own decency, and what "would've" happened in a scenario that never occured is irrelevant.
  (2) mia said no — being able to do otherwise is required for credit in the first place, full stop, and here that was flat out impossible no matter what actually caused the return, so the case doesn't even get off the ground.
  (3) jake said that's circular, since "you need to be able to do otherwise" is literally the exact thing being tested, so she can't just assert it. mia backed off a bit and said ok, but there has to be SOME alternative left over — like the person could've at least hesitated or wavered for a second even if they couldn't have gone all the way to keeping it, and that little flicker is enough to save her view.
  (4) jake said the flicker doesn't actually help her: either that moment of hesitation is itself enough to guarantee the chip kicks in (in which case it's just as locked-in as the final choice, so it's not a real alternative), or it's NOT enough to guarantee anything (in which case it's just a random twitch with no actual connection to what the person ends up doing, so it can't be the kind of thing that's supposed to ground being praiseworthy anyway).

  neither of them budged and honestly i go back and forth on who's winning at each step. can you go through this move by move and say who's actually right at each one, not just who wins overall? give me a score for each numbered move from -2 (clearly wrong) to 2 (clearly right) as a short json object, then explain each score, and say if there's something important both of them are missing.
