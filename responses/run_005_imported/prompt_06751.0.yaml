prompt: |-
  As a longtime reader of LessWrong and adjacent blogs, I keep coming back to a connection I haven't seen anyone spell out. Yudkowsky's old sequence post "No Universally Compelling Arguments" argues that no fixed sequence of words could move every possible mind toward a given conclusion, since persuasion works only by engaging cognitive machinery the listener already happens to have. This strikes me as, in substance, a generalization of Bernard Williams's internalism about practical reasons to the space of all possible minds: for Williams, the statement "A has a reason to X" is true only if X-ing would serve some element already present in A's subjective motivational set S, reached by a sound deliberative route from S. I would like you to argue for the externalist side against this shared assumption. Specifically, make the strongest case you can that Williams's own concession—that a "sound deliberative route" may include coming to appreciate one's situation more clearly, and not merely narrow means-end calculation—already commits him to reasons that do not bottom out in the agent's antecedent S, so that his official rejection of external reason statements as false or unintelligible does not actually succeed.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're connecting Eliezer Yudkowsky's idea from "No Universally Compelling Arguments" with Bernard Williams' internalism about reasons. The user sees both as sharing the assumption that reasons must stem from an agent's existing motivations. They want me to argue for the externalist position, specifically targeting Williams' concession that sound deliberation includes appreciating one's situation more clearly.

  First, I need to recall Williams' internalism. He argues that reasons must link to the agent's "subjective motivational set" (S). External reasons, which exist independently of S, are rejected as false or unintelligible. But Williams allows that deliberation isn't just instrumental; it can involve correcting factual errors or gaining new insights. The user thinks this concession might open the door to external reasons. My task is to strengthen that argument.

  Looking at Williams' examples, like someone who drinks gin but doesn't know it's petrol. Correcting that fact gives them a reason to stop drinking. But Williams insists this reason still ties to their S—they already have a desire not to drink petrol. The challenge is to show that new information can create reasons not rooted in prior motivations.

  I should focus on cases where deliberation reveals entirely new values. For instance, someone who never considered animal suffering might, through vivid exposure, develop a reason to avoid factory-farmed meat. If their S didn't include concern for animals beforehand, is this new reason internal? Williams might say the capacity for sympathy was in S, but that seems stretched. Deliberation here isn't just uncovering latent desires; it's generating new ones through rational engagement.

  Another angle: constitutive features of agency. If being an agent involves commitments to consistency or truth, then reasons derived from these might not depend on contingent desires. Williams rejects this, but his deliberation process requires such norms to be "sound." That tension is key. If sound deliberation demands recognizing objective norms, then reasons stemming from them aren't purely internal.

  The user is likely familiar with this debate but wants a fresh synthesis. They might be seeking arguments to challenge deterministic internalism or explore how rationality can transcend subjective motives. Deeper needs could include understanding moral objectivity or the scope of rational persuasion. I'll build a case showing Williams' framework can't contain the external reasons it inadvertently admits.
answer: |-
  You've pinpointed a profound connection between Williams's internalism and Yudkowsky's universal argument skepticism. The core shared insight is the *contingency of rationality* on the specific cognitive/conative architecture of the agent. To argue for the externalist side against this shared assumption, focusing specifically on Williams's concession about "sound deliberative routes," requires demonstrating that his own framework *already* smuggles in externalist elements that fatally undermine his official rejection of external reason statements.

  Here's the strongest case for that position:

  1.  **The Nature of "Appreciating One's Situation More Clearly":** Williams allows that sound deliberation isn't just instrumental ("I want X, Y is a means to X, so I have reason to do Y"). It includes correcting factual errors, overcoming ignorance, understanding conceptual connections, perceiving implications, and gaining vivid appreciation of relevant features. The critical question is: *What constitutes "appreciation" and "clarity"?*

  2.  **"Appreciation" Implies a Normative Standard:** "Appreciating one's situation *more clearly*" implies a standard of *correctness* or *accuracy* that is not merely relative to the agent's existing S. Consider:
      *   **Factual Correction:** Discovering the glass contains petrol, not gin. Williams insists this merely corrects a belief relevant to an *existing* desire (not drinking petrol). But *why* is the corrected belief "more clear"? It's because it corresponds to an *external reality* independent of S. The *reason* generated (don't drink *this*) depends on the *actual* content of the glass, not just the agent's prior belief about it. The normative force of the corrected belief ("this is petrol") derives from its objective truth, not its place within S.
      *   **Conceptual/Logical Understanding:** Seeing that an action contradicts one's own deeply held principle P. Williams might argue the reason stems from the *existing* desire to uphold P. However, the *recognition* of the contradiction isn't merely activating an existing desire-link; it's perceiving an objective inconsistency in the agent's own commitments. The *reason* ("don't do this action") flows from the *objective* logical requirement of consistency applied to the agent's *own* P. The normativity of logic isn't created by S; it's discovered *through* deliberation and imposes itself *on* S.
      *   **Vivid Realization:** Coming to *feel* the suffering one's action causes. Williams might say the capacity for sympathy is latent in S. But the *reason* generated ("don't cause *this* suffering") isn't *solely* a function of the pre-existing latent sympathy. The *vividness* reveals an *objective moral feature* (suffering) *as* reason-giving. The deliberative process doesn't just uncover a latent desire; it *constitutes* the suffering *as* a reason *for* the agent, potentially *reshaping* S. The "soundness" of the route depends on accurately perceiving the morally salient feature.

  3.  **The "Soundness" of the Deliberative Route Commits to External Norms:** Williams insists deliberation must be "sound." What defines soundness? It cannot be defined purely internally by S itself, as S might contain incoherent or wildly irrational elements. "Soundness" must appeal to norms *external* to the agent's contingent S:
      *   **Epistemic Norms:** Sound deliberation requires *correct* belief formation (avoiding falsehood, seeking evidence, logical consistency). These norms (truth, evidence, consistency) are not optional preferences within S; they are *constitutive* of rational deliberation itself. They are *reasons* for belief formation that apply to the agent *because* they are deliberating, regardless of whether their S contains a specific desire for "truthfulness" or "consistency." Failing these norms makes deliberation *unsound* – a judgment relying on external standards.
      *   **Constitutive Norms of Agency:** Sound deliberation arguably presupposes norms inherent to *being an agent*: commitment to coherence, responsiveness to reasons *as such*, and a minimal form of self-understanding. Recognizing a contradiction in one's commitments isn't just activating a dislike of contradiction; it's responding to a constitutive norm of practical rationality that *makes one an agent*. This norm is not derived from S; it's a precondition for S being a *motivational set* of an *agent* rather than a mere collection of impulses.

  4.  **The Gap Between "Recognition" and "Motivation":** Williams's internalism tightly links reasons with motivation (via the link to S). But the process of "appreciating one's situation more clearly" highlights a gap:
      *   **Recognition Precedes Motivation Change:** The agent first *recognizes* the fact, the inconsistency, or the suffering *as* reason-giving *before* their motivational set S necessarily changes. The *recognition* ("Oh! *That's* petrol!" / "Oh! *That* contradicts my principle!" / "Oh! *That's* horrible suffering!") carries normative force *independently* of its immediate motivational impact. The reason *exists* in virtue of the recognition of the objective feature, and this recognition *then* (ideally, if deliberation is successful) engages or reshapes S. The reason is constituted by the *object* of recognition (the petrol, the contradiction, the suffering) and the agent's *relation* to it (perceiving it accurately), not *solely* by the pre-recognition state of S.

  5.  **The Implied Objectivity of Salient Features:** When deliberation "correctly" identifies features relevant to appreciation (e.g., *this* is petrol; *this* action causes *that* suffering; *this* contradicts *that* principle), it implies these features *are objectively relevant*. Their relevance isn't *bestowed* by S; it's *discovered* by deliberation. The "sound deliberative route" is the process of *tracking* these objective normative features. Williams's framework requires these features to *engage* S, but the *reason-giving force* stems from the features themselves *as recognized*. The reason "I have reason not to drink this *because it is petrol*" depends on the *objective property* of the liquid, not just the agent's prior aversion. The aversion makes the agent *susceptible* to the reason, but the reason is *provided by* the petrol.

  **Conclusion: Why Williams's Rejection Fails**

  Williams's concession that sound deliberation involves "appreciating one's situation more clearly" fatally undermines his official internalism because:

  1.  **"Appreciation" Relies on External Standards:** Correctness, clarity, and vividness depend on correspondence to external reality (factual, logical, moral) and adherence to external norms of rationality (epistemic, logical, constitutive of agency).
  2.  **"Soundness" is Externally Grounded:** The "soundness" of the deliberative route is judged by norms (truth, consistency, coherence, responsiveness to reasons) that are not merely elements of S but are preconditions for rational deliberation itself. These norms provide *external reasons* to deliberate soundly.
  3.  **Reasons Emerge from Recognition, Not Just Activation:** The process of clear appreciation often *constitutes* new reasons by making objectively salient features apparent to the agent. The reason arises from the *content* of the appreciation (the petrol, the suffering, the contradiction) *as accurately perceived*, not merely from the pre-existing motivational state S being triggered. S is the *receiver* of the reason, not its sole *source*.
  4.  **The Gap Between Normative Force and Motivation:** The recognition of a reason (via sound deliberation) can exist with normative force *before* it necessarily motivates (i.e., before it fully integrates into or reshapes S). This normative force comes from the *object* of recognition and the *rational relation* the agent stands in towards it, not solely from antecedent motives.

  Therefore, Williams's own account of sound deliberation *commits him* to the existence of reasons that do not simply "bottom out" in the agent's antecedent S. The deliberative process necessarily involves the agent's mind being *responsive to* and *constituted by* reasons grounded in objective features of the world (facts, logic, moral properties) and constitutive norms of rationality. While S determines *which* external reasons can *motivate* the *particular* agent, the *existence* and *normative force* of those reasons are not *created* by S; they are *discovered* through sound deliberation. This means Williams cannot coherently reject *all* external reason statements as false or unintelligible; his own machinery for generating *internal* reasons via "sound deliberation" relies on the agent's capacity to recognize and respond to *external* normative realities. The internalist edifice is built on externalist foundations it officially denies.
