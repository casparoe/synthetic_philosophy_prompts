prompt: |-
  I've been down a rabbit hole reading about "evidential cooperation in large worlds" (ECL) from the rationalist/EA corner of the internet - the idea that we should act cooperatively toward agents we can never causally contact (like aliens on the other side of the universe, or versions of us in a different branch of the multiverse) because our choice is correlated evidence about what they choose, even with zero causal link between us. Then I noticed it used to just be called "multiverse-wide superrationality," which makes me think its basically just Hofstadter's old superrationality idea (the one with the twenty strangers and the prize) scaled up to the whole universe. Is that basically right, or is there something actually new going on in ECL that plain superrationality doesn't already capture? Every explaination I find just treats the two as interchangeable instead of spelling out the difference.
reasoning: |-
  Okay, let me try to figure out what the user is asking. They've been reading about Evidential Cooperation in Large Worlds (ECL) and noticed it's similar to Hofstadter's superrationality. They want to know if ECL is just superrationality scaled up or if there's something new.

  First, I need to recall both concepts. Superrationality, from Hofstadter, is about one-shot prisoner's dilemmas where players, knowing they are identical, choose cooperatively because their decision is evidence of the other's choice. The focus is on symmetry and identical reasoning in small groups.

  ECL extends this to vast scales—like multiple universes or alien civilizations. The key difference seems to be the "large worlds" aspect, where agents aren't symmetric or identical. They might have different values or reasoning processes. ECL deals with uncertainty about who else is out there and how they think. The user mentioned explanations treat both as interchangeable, so they want clarity on distinctions.

  The user's deeper need might be understanding if ECL offers novel solutions or is just a rebranding. They might be researching for academic or practical purposes, possibly in effective altruism or decision theory. They need a clear comparison to apply these concepts correctly.

  I should break down the core similarities: both rely on acausal reasoning and correlated decisions without causality. But ECL's innovations include handling scale, lack of symmetry, uncertainty, and diverse agents. Highlighting these points will show ECL's advancements beyond superrationality. Also, mentioning applications like AI alignment or interstellar cooperation could address why the distinction matters practically.
answer: |-
  You've hit on a crucial connection, and your intuition is largely correct: **ECL (Evidential Cooperation in Large Worlds) is fundamentally an extension and scaling up of Hofstadter's original superrationality concept.** However, ECL tackles specific challenges and nuances that arise *because* of this scaling to "large worlds," making it more than just a simple rebranding. Here's the breakdown:

  **Core Similarity: The Acausal/Evidential Engine**
  1.  **Shared Foundation:** Both ideas rest on the same core principle: Agents who *know* they are engaged in identical reasoning processes (or are sufficiently similar) can achieve cooperation in one-shot dilemmas (like the Prisoner's Dilemma) *without any causal interaction*, purely based on the *evidential link* between their decisions.
  2.  **Hofstadter's Superrationality (The Original):**
      *   Focuses on small, symmetric groups (e.g., 20 identical strangers).
      *   Assumes perfect symmetry: All agents are identical, know they are identical, know they are all reasoning identically about the same problem, and know *exactly* who the other agents are (the 20 in the room).
      *   The argument: "If I cooperate, it's evidence that others, reasoning identically, will also cooperate. If I defect, it's evidence they defect. Mutual cooperation yields a better payoff than mutual defection. Therefore, I should cooperate." The correlation stems from the shared reasoning process.
  3.  **ECL's Core Premise:**
      *   Takes this *exact same evidential logic* and applies it to astronomically larger scales: potentially infinite universes in a multiverse, alien civilizations across cosmological distances, or vast numbers of future AI instances.
      *   The argument remains: "My decision to cooperate is evidence that other sufficiently similar agents (who face analogous dilemmas and use analogous reasoning) will also cooperate. My defection is evidence they defect. Therefore, I should cooperate to achieve the mutual cooperation payoff, even though we cannot causally influence each other."

  **Why ECL Feels Like "Scaled-Up Superrationality" (And Often Is):**

  *   **The Logic is Identical:** The fundamental decision-theoretic move – basing your action on the evidential correlation stemming from shared reasoning similarity – is the same.
  *   **"Multiverse-Wide Superrationality" Was Literally a Precursor Name:** As you noted, ECL was initially called exactly that, highlighting the direct lineage.
  *   **Many Explanations Focus on the Core Logic:** When introducing the *concept* of acausal cooperation based on evidence, Hofstadter's parable is the simplest, most intuitive example. It's natural to present ECL as "like Hofstadter's superrationality, but applied to the whole multiverse/very large world."

  **What's "New" or Nuanced in ECL (Going Beyond Plain Superrationality):**

  ECL grapples with complexities that Hofstadter's idealized small-room scenario avoids:

  1.  **Defining "Similarity" and Reference Classes in Vastness:**
      *   **Problem:** In an infinite multiverse or vast cosmos, who counts as "similar enough"? Is it all humans? All sentient beings? All consequentialist reasoners? All agents facing a sufficiently analogous dilemma?
      *   **ECL Nuance:** ECL forces explicit (and difficult) consideration of *reference classes* – which group of agents are you evidentialy linked to? Your decision impacts the expected cooperation rate *within your chosen reference class*. This is trivial in Hofstadter's scenario (the 20 identical strangers).
  2.  **Dealing with Asymmetry and Uncertainty:**
      *   **Problem:** Agents in a large world are unlikely to be perfectly identical. They may have different values, slightly different reasoning algorithms, different amounts of information, or face dilemmas with slightly different payoffs or structures.
      *   **ECL Nuance:** ECL must address how robust cooperation is to these asymmetries. How similar do agents need to be for the evidential link to hold strongly enough? What if some agents *don't* believe in ECL/superrationality? This involves complex game theory under uncertainty and bounded rationality.
  3.  **Uncertain Existence and Scale:**
      *   **Problem:** In Hofstadter's story, you *know* there are exactly 19 other identical agents. In ECL, you have profound uncertainty. *Are* there other similar agents? *How many* are there? What's the probability distribution over their existence and number?
      *   **ECL Nuance:** Cooperation becomes probabilistic. Your decision affects the *expected* payoff based on your subjective beliefs about the existence and cooperativeness of others. You cooperate based on the *chance* it triggers mutual cooperation with unknown others.
  4.  **Dealing with Diverse Agents and Values:**
      *   **Problem:** A vast world contains agents with wildly different goals and values. Cooperating with an agent whose values are antithetical to yours (e.g., a paperclip maximizer vs. a human) might be disastrous.
      *   **ECL Nuance:** ECL proponents (like those in MIRI/FHI) often focus on cooperation *conditional on value alignment* or between agents who can credibly commit to mutual benefit. The challenge is defining "cooperation" when utilities aren't symmetric and avoiding exploitation by defectors or value-incompatible agents. This leads to ideas like "acausal trade."
  5.  **Decision Theory Formalism:**
      *   **Nuance:** While Hofstadter presented an intuitive argument, modern ECL discussions are often framed within specific decision theories like **Updateless Decision Theory (UDT)** or **Functional Decision Theory (FDT)**. These provide more rigorous formalisms for handling acausal links and pre-commitments, which is crucial for navigating the complexities of large worlds. Superrationality was the philosophical spark; UDT/FDT are tools for building the engine in complex environments.

  **Conclusion:**

  You are fundamentally right. **ECL is Hofstadter's superrationality idea scaled up to cosmological/multiversal scales.** The core logic of evidential cooperation based on correlated reasoning is identical.

  However, **ECL isn't *just* a renaming.** The sheer scale and inherent uncertainties of "large worlds" (unknown numbers of agents, uncertain similarity, potential value conflicts, massive asymmetries) introduce significant complexities that force the development of more nuanced frameworks (like UDT/FDT) and demand careful consideration of reference classes, probabilities, and value alignment. Hofstadter's original thought experiment elegantly illustrates the core principle; ECL wrestles with the messy, practical implications of applying that principle to the potentially vast and unknown reality we (might) inhabit.

  So, treat them as deeply connected: **Superrationality is the core seed. ECL is the complex, sprawling tree that grows from it when planted in the soil of a large (or infinite) world.** Explanations often treat them interchangeably when focusing on the core evidential logic, but the "large worlds" context inherent in ECL brings unique challenges that plain superrationality doesn't explicitly address.
