prompt: |-
  ok so i'm working through Russell's "On Denoting" (1905) and I hit the paragraph everyone calls the "Gray's Elegy" argument -- apparently it's infamous for being almost unreconstructable, like there's a dozen rival scholarly readings of what the argument even is. here's the bit that's got me stuck:

  "We say, to begin with, that when C occurs it is the denotation that we are speaking about; but when 'C' occurs, it is the meaning. Now the relation of meaning and denotation is not merely linguistic through the phrase: there must be a logical relation involved, which we express by saying that the meaning denotes the denotation. But the difficulty which confronts us is that we cannot succeed in both preserving the connexion of meaning and denotation and preventing them from being one and the same; also that the meaning cannot be got at except by means of denoting phrases.

  The one phrase C was to have both meaning and denotation. But if we speak of 'the meaning of C', that gives us the meaning (if any) of the denotation. 'The meaning of the first line of Gray's Elegy' is the same as 'The meaning of "The curfew tolls the knell of parting day"', and is not the same as 'The meaning of "the first line of Gray's Elegy"'. Thus in order to get the meaning we want, we must speak not of 'the meaning of C', but 'the meaning of "C"', which is the same as 'C' by itself.

  The difficulty in speaking of the meaning of a denoting complex may be stated thus: the moment we put the complex in a proposition, the proposition is about the denotation; and if we make a proposition in which the subject is 'the meaning of C', then the subject is the meaning (if any) of the denotation, which was not intended. [...] Thus it would seem that 'C' and C are different entities, such that 'C' denotes C; but this cannot be an explanation, because the relation of 'C' to C remains wholly mysterious; and where are we to find the denoting complex 'C' which is to denote C? [...] This is an inextricable tangle, and seems to prove that the whole distinction between meaning and denotation has been wrongly conceived."

  I can follow each individual sentence but I can't reconstruct what's actually supposed to go wrong. Like, why is swapping between C and 'the meaning of C' forced to generate a muddle, rather than just being an awkward but fixable notational choice on Russell's part? What does "C" actually pick out at each step, and where precisely does the regress or circularity bite? And why does he think this sinks the entire meaning/denotation distinction as such (both his own earlier view and Frege's), rather than just being a problem with his particular way of using inverted commas?
