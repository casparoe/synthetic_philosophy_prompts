  Here's a case against separating Sidgwick's psychical research from his ethical philosophy, arguing it was a rationally motivated attempt to empirically resolve the "dualism of practical reason":

  1.  **The Core Problem: The Dualism of Practical Reason:**
      *   Sidgwick's rigorous analysis in *The Methods of Ethics* concluded that both **Rational Egoism** (the principle that it's rational to maximize one's own happiness) and **Rational Benevolence/Utilitarianism** (the principle that it's rational to maximize the general happiness) possessed significant, seemingly self-evident, rational justification.
      *   However, these two fundamental rational principles can, and often do, conflict in practice. What maximizes my happiness might not maximize the general happiness, and vice-versa.
      *   Sidgwick saw this conflict as a profound philosophical crisis. If reason cannot provide a single, coherent answer to the fundamental question "What ought I to do?", then ethics threatens to collapse into irrationality – the "Cosmos of Duty" becomes a "Chaos." Reason itself seems fractured.

  2.  **The Required Resolution: Harmony of Duty and Self-Interest:**
      *   Sidgwick identified only two potential solutions within pure philosophy:
          *   **Weakening Standards:** Diluting his stringent criteria for self-evident truth to force a resolution (e.g., declaring utilitarianism supreme and egoism invalid, or vice-versa). He rejected this as intellectually dishonest.
          *   **Independent Guarantee of Harmony:** Securing proof that, ultimately, acting morally (maximizing general happiness) *also* maximizes one's *own* long-term happiness. This requires a metaphysical guarantee that virtue and self-interest are reconciled in the grand scheme of things.
      *   Sidgwick believed such a guarantee could only come from a theological or religious premise: specifically, the existence of a benevolent God who administers a system of post-mortem rewards and punishments ensuring this ultimate harmony. However, he found traditional proofs for God's existence philosophically unconvincing.

  3.  **Psychical Research as the Empirical Path to Harmony:**
      *   Sidgwick turned to psychical research **not** as a flight of fancy, but as the *only remaining rational avenue* to empirically investigate the possibility of that crucial "independent guarantee."
      *   **The Empirical Hypothesis:** If phenomena like telepathy, veridical apparitions of the dead, or communications from deceased persons through mediums could be rigorously proven, they would provide *empirical evidence* for the survival of personal consciousness after bodily death.
      *   **The Connection to Harmony:** Survival of consciousness after death is a *necessary precondition* for any system of post-mortem rewards/punishments administered by a just deity. If consciousness doesn't survive, there can be no ultimate reconciliation of duty and self-interest beyond this life. Proof of survival wouldn't *prove* God or the specific system of justice, but it would remove the *major empirical obstacle* to believing such a reconciling system *could* exist. It would make the theological solution *plausible* in a way it wasn't without evidence for survival.

  4.  **Why Empirical Facts Bear on a Normative Dispute:**
      *   **The Normative Premise Requires a Factual Foundation:** Sidgwick's utilitarianism is grounded in the rational intuition that maximizing happiness is good. However, the *practical rationality* of consistently *acting* on that intuition *for the individual agent* hinges on a crucial factual question: **Does the universe's structure ultimately support the connection between virtue (promoting general happiness) and the agent's own deepest good (happiness)?** If the universe is indifferent or actively hostile to this connection, then consistently choosing duty over self-interest *might be ultimately self-sacrificial and irrational* from the egoist's perspective. The dualism stands.
      *   **Empirical Evidence Informs the "Ultimate" Scope:** The dispute *is* normative, but its *resolution* depends on the *scope* of rational self-interest. Rational Egoism, as Sidgwick defined it, concerns the agent's happiness over their *whole existence*. If empirical evidence demonstrates that existence extends beyond bodily death, then the calculation of "my whole existence" fundamentally changes. What might seem like a sacrifice within a finite life could be vindicated as self-interested within an infinite one.
      *   **Undermining the Egoist's Objection:** Without evidence for an afterlife, the egoist can plausibly argue that sacrificing significant self-interest for duty *is* irrational if it leads to a net loss of happiness in the only existence we know. Empirical proof of survival opens the door to the possibility (needing further theological support) that such sacrifices are *investments* in greater, eternal happiness, making duty *compatible* with, or even *required* by, enlightened long-term self-interest.
      *   **Saving Rational Ethics:** For Sidgwick, the dualism wasn't just an academic puzzle; it threatened the very rationality of the moral life. If reason cannot resolve the conflict, then ethics lacks a secure rational foundation ("Chaos"). Empirical evidence for survival offered the only hope of providing the factual underpinning needed to support the *possibility* of the theological/metaphysical guarantee that would resolve the dualism and restore the "Cosmos."

  **Conclusion:**

  Sidgwick's psychical research was not a charming eccentricity divorced from his ethics; it was the **empirical wing of his philosophical project** to save the rationality of ethics. Faced with the paralyzing dualism of practical reason and finding purely philosophical or theological arguments for divine justice inadequate, he sought *empirical evidence* for personal survival. This evidence was crucial because it represented the necessary *factual precondition* for the only solution he deemed viable: a cosmic system ensuring the ultimate harmony of duty and self-interest. Proof of survival wouldn't settle the normative question directly, but it would radically alter the factual landscape upon which the competing claims of egoism and utilitarianism are assessed, making the required harmony *empirically plausible* and thus offering a rational escape from ethical chaos. His psychical research was, therefore, a desperate and rigorous attempt to find an empirical foundation for the hope that the universe is structured such that being good is also, ultimately, the rational path to one's own good.
