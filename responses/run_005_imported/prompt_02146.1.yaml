  Hmm. First, I need to recall the core difference between these theories. Etiological functions are about evolutionary history—why a trait was selected. Causal-role functions are about current contributions to a system's capacities. The heart example is tired because both theories agree on it. I need a trait where history and current utility clash.

  What about... junk DNA? No, too contested. Maybe a domesticated animal trait? Like chicken combs. Chicken combs originally evolved for thermoregulation (etiological function), but now their primary role in industrial farming is visual sorting by sex (causal-role function). That's perfect! 

