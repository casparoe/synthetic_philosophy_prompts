answer: |-
  You've hit on a major frustration in philosophy of biology pedagogy! The heart example is ubiquitous precisely because it's a *consensus* case where both theories agree. Finding a clean, real-world case where they yield **opposite verdicts** is trickier, but the **chicken comb** (especially in modern industrial poultry breeding) provides a compelling illustration. Let's break it down:

  ### The Biological Case: The Chicken Comb & Industrial Sex-Sorting

  1.  **The Trait:** The fleshy, often red, crest on a chicken's head (the comb).
  2.  **Etiological Function (Evolutionary History):** The comb's primary *selected effect* function is **thermoregulation**. Larger combs have more surface area for dissipating heat, a significant advantage in warm climates or during activity. This is well-supported by comparative anatomy, physiology, and studies showing correlations between comb size/type and environmental adaptation/sexual selection (as a *honest signal* of fitness linked to thermoregulatory capacity).
  3.  **Modern Industrial Context:** In large-scale commercial hatcheries for egg-laying breeds (e.g., Leghorns), chicks are sexed immediately after hatching. Male chicks (who don't lay eggs and aren't typically raised for meat in these breeds) are culled. Visual sexing is labor-intensive.
  4.  **The Exploited Characteristic:** Breeders have selectively developed specific strains where **comb size/color develops slightly faster in male chicks than in female chicks** within the first 24-48 hours after hatching. In these strains, males often have a slightly larger, brighter, or more prominent pink comb rudiment compared to females at hatch.
  5.  **The Current Systemic Role:** Hatchery workers (or increasingly, automated vision systems) **use the visual difference in comb development/color as the primary, rapid indicator to sex and sort chicks**. The comb's appearance is *causally crucial* to the efficiency and accuracy of the sorting process within the industrial system.

  ### The Functional Verdicts & The Disagreement

  *   **Etiological Theory (Wright, Neander):**
      *   **Focus:** "Why was this trait *selected for*? What effect caused its presence and maintenance in the lineage?"
      *   **Verdict on Comb:** The comb's **function is thermoregulation (and potentially sexual signaling *linked* to thermoregulation)**. This is the effect for which it was historically selected in the chicken lineage.
      *   **On Sorting Role:** The use of comb differences for sex-sorting is a **recent, human-imposed, accidental byproduct** of variation in comb development rates. It played *no role* in the evolutionary history shaping the comb itself. The comb wasn't selected *for* sorting chicks; sorting exploits incidental variation. Therefore, **sorting chicks is NOT a function of the comb** according to etiological theory. It's a mere effect or a use.

  *   **Causal-Role Theory (Cummins):**
      *   **Focus:** "What causal contribution does this trait make *now* to the capacities of the containing system (at a specific level of analysis)?"
      *   **The System:** The modern industrial poultry hatchery system, whose key capacities include high-volume chick production, efficient sex identification, and separation.
      *   **Verdict on Comb:** Within this specific, human-constructed system, the comb's *differential appearance* plays a **crucial causal role in enabling the capacity for rapid, accurate sex-sorting**. It's a key component in the sorting mechanism (whether manual or automated). Therefore, **one function of the chick's comb *in this context* is to serve as a sexually dimorphic marker for sorting**. Its thermoregulatory role is still present but secondary *within the analysis of the hatchery system's sorting capacity*.

  ### Why the Disagreement is Fundamental

  1.  **History vs. Current Contribution:** Etiology cares *only* about evolutionary history. If the effect wasn't the target of selection, it's not a function, no matter how useful it is now. Cummins cares *only* about the current causal structure of a system. If the component plays a significant causal role in a system's capacity *now*, that role counts as a function, regardless of how the trait originated.
  2.  **"Proper Function" vs. "System Function":** Etiologists (especially Neander) aim to define the "proper function" – the *reason the trait is there*. Causal-role theorists define *a* function relative to a chosen analytical context (the hatchery system).
  3.  **The System Boundary:** This is crucial for Cummins. By defining the "system" as the industrial hatchery (a very recent, artificial system), Cummins can assign a function (sorting) that makes sense *within that system's operation*. Etiology looks at the trait within the biological system of the chicken organism and its evolutionary lineage.

  ### Why This Case is Better Than the Heart

  *   **No Consensus:** The theories genuinely disagree on whether "sorting" is a function of the comb.
  *   **Real Biology:** Exploiting comb differences for sexing is a documented practice in poultry science and industry.
  *   **Highlights Context-Dependence:** Shows how the causal-role function depends critically on defining the *system* (organism vs. hatchery).
  *   **Illustrates Accidental Exploitation:** Clearly demonstrates a useful effect (sorting) that is *not* the result of selection for that effect.
  *   **Relevance:** Connects directly to debates about function in domesticated species, biotechnology, and conservation – where human manipulation changes the context dramatically.

  **In essence:** The etiological theorist says the comb's function is *only* what it was evolved for (thermoregulation/signaling). The causal-role theorist says the comb *also has the function* of enabling sorting *within the specific context of the industrial hatchery system*, because that's the causal role it plays *there*. They disagree fundamentally on what counts as "having a function."

  This case should feel much fresher than the tired old heart! It reflects the kind of nuance you'd encounter thinking about the function of traits in rapidly evolving systems, domesticated organisms, or traits co-opted for novel purposes – areas where your beetle expertise might find interesting parallels (e.g., a beetle structure evolved for mating now exploited for pesticide targeting?).
