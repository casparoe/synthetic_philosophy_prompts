prompt: |-
  I spent about thirty-five years doing fieldwork on beetles before retiring, and lately I've fallen down a philosophy of biology rabbit hole -- specifically that whole fight between etiological and causal-role theories of function (Wright vs Cummins, with Neander coming in later to patch up the etiological side). Problem is, every single intro I read reaches for the exact same illustration: the heart's function is to pump blood, not to make thumping noises, and thats supposed to settle it. I've now read that example about six times and I'm kind of sick of it. Can you give me a genuinely different case -- real biology, not made up, doesn't have to be insects -- where the etiological folks and the causal-role folks would actually land on opposite verdicts about whether something counts as having a function, and walk me through exactly why they'd disagree?
