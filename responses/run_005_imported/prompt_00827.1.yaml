prompt: |-
  So I'm in a history of science seminar this term and we just finished a two week unit on Newton, and somethings not sitting right with me. Basically the lecture built up this whole story where Newton's Principia is what kicks off the Enlightenment "clockwork universe" picture — the planets just obey the inverse square law forever once God winds everything up and lets it go, and thats supposedly a big reason Deism got so popular afterward, since you don't really need God to keep doing anything once the laws are in motion. But then the very next lecture was almost entirely about how Newton privately rejected the Trinity, poured decades into Biblical prophecy and alchemy, and was honestly way more obsessed with theology than most people realize. Our professor mentioned in passing that this got him into some kind of dispute with Leibniz too, though we didn't really get into why.

  That combo just doesn't add up to me. If Newton's own physics is supposedly what proved the universe can run itself indefinitely with no further divine input required, why would Newton of all people be the guy who's MORE convinced than everyone else that God has to be constantly and actively involved in the world, to the point of rejecting mainstream Christian doctrine over it? Was he just keeping his science and his religion in two totally separate mental boxes and not noticing the tension, or is there some way these two sides of him actually fit together that we're not being taught? Trying to actually understand this properly before our essay is due instead of just repeating the "clockwork universe" line everyone uses.
