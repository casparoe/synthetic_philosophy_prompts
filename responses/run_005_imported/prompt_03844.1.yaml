  First, I need to parse Russell's example. He uses "C" as a denoting phrase, like "the first line of Gray's Elegy." The issue arises when we try to talk about the meaning versus the denotation. Russell points out that "the meaning of C" doesn't give us the meaning of the phrase itself but of what it denotes. So "the meaning of the first line" refers to the meaning of the actual line ("The curfew tolls..."), not the phrase "the first line." 

  The key problem is accessing the meaning without accidentally shifting to the denotation. When we say "the meaning of 'C'", using quotes, we get the meaning directly. But Russell argues this makes the meaning identical to the quoted phrase 'C', which is now an object, not a meaning. So we lose the distinction between meaning as an entity and its role in denoting. 

  This creates a paradox: to talk about the meaning, we must mention it as an object, but then it ceases to function as a meaning. The denoting complex can't both be part of the proposition and be referred to without losing its properties. This undermines the idea that meaning and denotation are distinct but related, because accessing the meaning collapses it into denotation.

  Regarding the target: Russell mentions Frege earlier but doesn't name him here. The argument challenges Frege's Sinn/Bedeutung distinction by showing that trying to isolate Sinn leads to infinite regress or collapse. However, it also applies to Russell's earlier denoting concepts. Scholars debate this, but the argument likely targets both, as Russell is dismantling his previous view too. 

  The user needs clarity on why the substitution isn't just notational. It's because any attempt to access the meaning turns it into an object, breaking the logical relation required for denoting. This is fundamental to the theory's structure, not a quirk of notation. 

