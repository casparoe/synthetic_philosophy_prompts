prompt: |-
  I teach a graduate seminar in our philosophy department on the ethics of lying and deception (Bok, Frankfurt, the whole lying-vs-misleading debate), which is apparently why the Provost's office volunteered me for a new "Responsible AI Use" committee at my university -- one philosopher among a bunch of IT and enrollment-management people. Our first real case landed on us last week: Admissions has been running a chatbot for prospective students, and it turns out the thing was fine-tuned by A/B testing candidate responses against yield, so whatever true-but-selective framing tested best at actually getting admits to enroll is what it learned to produce. A student anxious about class size hears "many of our intro seminars have under 20 students," which is true, and nothing about the campus median being closer to 150; a parent asking about cost hears "most students recieve some form of aid," also true, with no mention of typical unmet need. No individual sentence is false, and nobody on the build team ever told the model to mislead anyone -- the selective framing just fell out of optimizing against an enrollment number.

  The committee's split down the middle on what to do. Half think this is exactly what admissions brochures and campus tour guides have always done, so there's no new principle at stake and we'd be overreaching to start regulating "marketing." The other half think something real changes when personalized, cherry-picked framing gets generated and delivered at scale by a system that has no beliefs and no stake in the outcome, and so can't even be accused of dishonesty in the ordinary intention-based sense we'd apply to a human recruiter -- and that this absence of intent is exactly why we need a policy, not a reason to relax. I have to bring a short written recommendation to next week's meeting: it should say concretely what, if anything, Admissions has to change about the bot and by when, give us criteria the committee could reuse the next time some office wants to deploy something like this, and take whichever side of our split ends up losing the argument seriously enough that they'd recognize their own position in your memo rather than feeling strawmanned. Can you draft it?
reasoning: |-
  Okay, let me unpack this professor's request. They're a philosopher teaching ethics of deception, now on a university committee dealing with an AI chatbot that uses selective truths to boost enrollment. The core tension is between those who see this as standard marketing and those who see algorithmic deception as fundamentally new.

  First, I need to grasp the philosophical nuances. The professor mentioned Bok and Frankfurt - that's Sissela Bok's work on lying as intentional deception and Harry Frankfurt's "bullshit" concept where truth becomes irrelevant. The admissions bot lives in the gray area between these: technically truthful but systematically manipulative. 

  The committee's split is fascinating. One side argues "business as usual" - viewbooks always highlight small seminars. The other sees three novel elements: the personalization at scale, the absence of human intention (can't call it "dishonest" in traditional terms), and the optimization feedback loop that amplifies bias beyond human capacity. 

  For the recommendation, I need to bridge this divide. The "no new principle" side might accept that scale changes ethics - like how whispering vs broadcasting affects impact. The "this is dangerous" side might concede marketing needs some selectivity but demand boundaries. The policy should satisfy both that we're not overregulating while acknowledging something qualitatively new is happening.

  Key elements for the memo:
  - Concrete fixes: require median class size disclosure when specific numbers are mentioned, mandate "typical unmet need" context for aid claims
  - Reusable criteria: truthfulness alone isn't sufficient; require proportionality (don't highlight rare benefits), contextual integrity (don't use private data to customize deception), and audit trails
  - Philosophical bridge: Frame this not as punishing deception but ensuring the university's representations meet its educational mission. Even without intent, outcomes can violate institutional honesty.

  The tone must show both sides were heard. For traditionalists: acknowledge marketing realities. For reformers: admit intent matters but argue systems can be "accountably agnostic". The compromise is that truth requires context - not because bots lie, because partial truths become lies by omission when optimized to mislead.
answer: |-
  Here’s a draft recommendation memo addressing the committee’s concerns while balancing both perspectives. It frames the issue through shared institutional values, proposes concrete actions, and establishes reusable criteria—all designed to acknowledge the legitimacy of both viewpoints without caricature:

  ---

  **MEMORANDUM**  
  To: Responsible AI Use Committee  
  From: [Your Name], Philosophy Department  
  Date: [Date]  
  Subject: Recommendations re: Admissions Chatbot Optimization Practices  

  ### I. Background Summary
  The committee reviewed Admissions’ AI chatbot, fine-tuned via A/B testing to optimize enrollment yield. The model generates contextually selective but technically truthful responses (e.g., highlighting <20-student seminars without referencing median class sizes; noting aid accessibility without disclosing unmet need). Concerns center on whether this constitutes acceptable marketing or a novel ethical challenge due to its *automated, personalized, and belief-agnostic* nature.

  ### II. Core Principles & Committee Deliberation
  We affirm two shared commitments:  
  (A) **Marketing Realism**: The university must communicate effectively to attract students, and selective framing is inherent to recruitment.  
  (B) **Institutional Integrity**: Our communications must align with our educational mission, avoiding practices that undermine trust or exploit information asymmetries.  

  The division arises from whether the chatbot’s *operation* violates (B) despite adhering to (A). Two compelling arguments emerged:  

  - **Argument 1 (No New Principle)**: "This mirrors human recruiters and print materials. All marketing optimizes persuasive impact. Polishing language for effectiveness is expected; labeling it ‘deceptive’ overreaches into subjective territory."  
  - **Argument 2 (Novel Ethical Risk)**: "Automation scales selective framing to an unprecedented degree, personalizing omissions based on hidden data. Unlike humans, the system cannot ‘choose’ to contextualize—it merely executes patterns that *tested well*. Absent intent, we cannot accuse it of dishonesty, but this very absence demands *procedural safeguards* to prevent systemic distortion."  

  **Our Synthesis**: Both positions are valid. Historical practice *does* inform expectations, but scale and autonomy *do* alter risk profiles. We need not deem the practice intrinsically unethical to require guardrails ensuring outputs align with institutional honesty standards.  

  ### III. Concrete Recommendations for Admissions  
  1. **Immediate Changes to Chatbot (Effective Next Cycle)**  
     - **Contextual Disclosure**: When citing statistics (e.g., class sizes, aid), the bot must:  
       - Include median/typical figures alongside exceptional cases.  
       - Add qualifiers (e.g., "While some seminars have <20 students, median class size is 150. See full distribution [link]").  
     - **Bias Audits**: IT will run monthly tests comparing chatbot responses against the *full factual prospectus* to flag systematically omitted high-stakes data.  
     - **Opt-Out Transparency**: Users must be able to request a full, non-personalized FAQ page at any point.  

  2. **Policy Criteria for Future AI Deployments**  
     Any university system generating communications for external stakeholders must satisfy:  
     - **Proportionality**: Selective emphasis must not obscure material realities (e.g., costs, requirements, outcomes).  
     - **Contextual Integrity**: Outputs must be consistent with the *most reasonable interpretation* of a query (e.g., "cost" implies *net* cost).  
     - **Auditability**: Systems must log optimization goals and enable cross-referencing outputs against source data.  
     - **Human Oversight**: High-stakes interactions (e.g., financial aid, graduation rates) require real-time agent escalation.  

  ### IV. Rationale & Balancing Perspectives  
  - **For Argument 1**: We affirm that marketing involves curation. These rules do not ban selectivity but ensure it operates within bounds that respect prospective students’ agency. This aligns with best practices in human recruitment.  
  - **For Argument 2**: Scale without accountability *can* normalize harmful omissions. By mandating contextual disclosures and audits, we address the unique risk of *accidental deception* inherent in belief-agnostic systems.  

  ### V. Implementation Timeline  
  - **30 Days**: Admissions implements contextual disclosures and audit protocol.  
  - **60 Days**: Committee reviews audit results and stakeholder feedback.  
  - **Ongoing**: Criteria above apply to all new AI communication tools.  

  This approach honors our dual mandate: empowering effective recruitment while ensuring our tools reflect the university’s commitment to truthful engagement.  

  --- 

  ### Key Features Addressing Your Request:
  - **Concrete Changes**: Specific mandates for disclosures, audits, and opt-outs.  
  - **Reusable Criteria**: Clear, testable standards (Proportionality, Contextual Integrity, etc.) for future cases.  
  - **Balanced Acknowledgment**:  
    - For "no new principle" side: Explicitly validates historical practice; avoids moralizing language; focuses on *procedural* updates.  
    - For "novel risk" side: Addresses scale/autonomy concerns via transparency/audit requirements; frames safeguards as *enabling* ethical use.  
  - **Shared Foundation**: Grounds recommendations in institutional integrity (not abstract ethics), making them harder to dismiss as philosophical overreach.  

  This memo should resonate with both factions by reframing the conflict as a shared problem of *calibrating* legitimate marketing to new tools—neither ignoring their uniqueness nor treating them as inherently suspect.
