answer: |-
  The dust of Zhao hung thick in the air, coating Gongsun Long’s robes and the flanks of his white stallion, Xue, as they approached the wooden palisade blocking the mountain pass. The guard, a man with deep lines etched around his eyes and the weary posture of someone enforcing orders he didn’t make, stepped forward, spear held loosely but decisively across the path. His gaze swept over Gongsun Long, the scholar’s travelling case, and lingered on Xue.

  "Halt. Orders are clear: no horses through this pass. Turn back."

  Gongsun Long dismounted smoothly. The urgency of his mission – carrying sensitive diplomatic scrolls to the besieged city beyond the mountains – warred with the scholar’s instinct. Force was useless; persuasion was his only tool. He saw not a brute in the guard, but a man accustomed to the concrete logic of commands. This required precision.

  "Esteemed guardian of the pass," Gongsun Long began, his voice calm but carrying. "Your diligence honours the Duke’s command. Yet, observe my mount. Is he not a creature of exceptional whiteness?"

  The guard’s eyes flickered to Xue’s snowy coat, gleaming even under the dust. "White, black, or dappled – a horse is a horse. The order says ‘no horses.’ That," he nodded at Xue, "is a horse. You cannot pass."

  Gongsun Long stepped closer, placing himself between the guard and Xue. "Ah, but therein lies the distinction worthy of a discerning mind like yours. When the Duke commanded ‘no horses,’ what was the essence of his prohibition? Was it the *shape* of the beast? Its function? Or perhaps the specific threat horses represent – their speed, their capacity to carry riders swiftly?"

  The guard frowned. "The order is plain: ‘No horses.’ It means all things that *are* horses. Your animal has four legs, a mane, a tail, it neighs – it *is* a horse. Trying to twist words won’t change the bone and sinew of it."

  "Precisely!" Gongsun Long seized on the objection. "You speak of what makes a horse *a horse* – its shape, its essence, its *xing*. Tell me, if a man sought simply ‘a horse’ for his field, and you offered him a yellow one, would he accept it?"

  "Of course," the guard shrugged. "Yellow, black, brown – all are horses for that purpose."

  "And if he sought specifically ‘a *white* horse’ for, say, a ceremonial procession? Would a yellow horse satisfy him?"

  The guard hesitated, sensing the trap but compelled by honesty. "No. He asked for white. Yellow isn’t white."

  "Exactly!" Gongsun Long’s eyes gleamed. "What satisfies the request for ‘a horse’ is *not* what satisfies the request for ‘a white horse.’ The category ‘white horse’ demands both the essential *horse-shape* and the specific attribute *white*. The category ‘horse’ demands only the essential horse-shape. Therefore, the criteria are different. What fulfills one does not necessarily fulfill the other." He paused, letting the distinction hang. **This was his first move: the differing criteria of satisfaction.**

  The guard scowled, rubbing his temple. "Clever words. But the Duke’s order isn’t asking *for* a horse; it’s *banning* them. It bans all things that fall under ‘horse.’ Your white beast falls under ‘horse.’ Therefore, it is banned. Trying to split ‘white’ from ‘horse’ here is like trying to separate wet from water."

  "Ah, but can we not?" Gongsun Long countered smoothly. **His second move: the separation of attributes.** "Consider: ‘White’ designates color. ‘Horse’ designates shape. Color is not shape; shape is not color. When we speak of a ‘white horse,’ we combine these two distinct concepts: the form *horse* and the color *white*. The concept ‘horse,’ however, encompasses *only* the form. It is indifferent to color – yellow, black, white, all are included under ‘horse’ *solely* by virtue of possessing the horse-shape. The concept ‘white,’ similarly, can attach to many things that are not horses – white jade, white clouds, white hair. Therefore, ‘horse’ and ‘white’ are distinct *ming*, distinct names pointing to distinct attributes."

  He gestured towards Xue. "This creature possesses *both* attributes: the shape ‘horse’ *and* the color ‘white.’ It is, undeniably, a ‘white horse.’ But the concept ‘horse’ refers *only* to the shape attribute. Since ‘white horse’ includes an attribute – color – that the concept ‘horse’ *does not require*, how can ‘white horse’ be *identical* to ‘horse’? The ‘white horse’ possesses something extra, a determination the simple ‘horse’ lacks."

  The guard stared at Xue, then at Gongsun Long, his earlier certainty fraying. He understood orders, the weight of a spear, the stubbornness of a mule. This… this was like trying to grip smoke. "So you say this… *white horse*…" he stressed the words, "is not banned, because the ban is only on ‘horses,’ and a ‘white horse’ isn’t *just* a ‘horse’? That makes no sense! It defies common understanding! If I let you through because your horse is white, and the next man comes with a black one, what do I tell him? ‘Sorry, the ban is only on horses that *aren’t* specifically coloured’? The order would be meaningless!"

  Gongsun Long nodded gravely. "You touch upon the wisdom of using names appropriately, guard. General names like ‘horse’ serve one purpose – to encompass all instances sharing an essential form. Specific compound names like ‘white horse’ serve another – to pinpoint a subset defined by an additional attribute. They operate at different levels, like a broad net and a finer sieve. The Duke’s order uses the broad net: ‘no horses.’ It aims to catch *all* creatures possessing the horse-shape, regardless of color, because the *threat* lies in that shape and what it enables – speed, carrying riders, perhaps carrying weapons. A white horse possesses that shape and that capacity just as surely as a black one. To exclude it based on its color would indeed render the order arbitrary, as you fear."

  He paused, letting the guard absorb the concession. The man looked momentarily relieved, then suspicious again. Gongsun Long pressed his advantage. "But consider the *name* used in the order: ‘horse.’ It names the *essence*, the *danger*. My mount possesses that essence. Yet, he also possesses ‘white,’ an attribute irrelevant to the essence of ‘horse’ *as defined by the prohibition*. The prohibition targets ‘horse-ness.’ My animal is *a white horse*. Its ‘white-horse-ness’ includes ‘horse-ness,’ but it is not *solely* ‘horse-ness.’ It possesses an additional attribute that does not contribute to the threat the Duke seeks to bar. Therefore, while it *contains* the banned essence, it is *not identical* to the simple concept named in the ban. To bar it solely on the basis of its ‘horse-ness,’ ignoring its specific ‘white-horse-ness,’ is to apply the name ‘horse’ too broadly, failing to recognize the distinct reality of the compound name."

  The guard leaned heavily on his spear. The afternoon sun beat down. Flies buzzed around Xue’s ears. The scholar’s words echoed in his skull – *essence, attribute, name, distinct, not identical*. He looked at the magnificent white stallion, clearly a horse by any common measure. He recalled the Duke’s stern face issuing the order: *No horses. None. They carry messengers, spies, weapons.* This scholar, with his scrolls and his calm intensity, looked like a messenger. The horse looked fast. The order was clear.

  But the scholar’s argument… it was like a blade slipping between the planks of a door. He couldn’t quite grasp it firmly enough to break it, yet it felt… wrong. Was the white horse truly *outside* the ban because of its color? That seemed absurd. Yet, the scholar’s points about different names serving different purposes, about the shape being one thing and the color another… those resonated with a frustrating logic. Was he being a fool, or was the scholar twisting wisdom into a lie?

  Xunzi’s pragmatic voice whispered in his memory: *Names are tools, not prisons. A general name covers many specifics without conflict.* The Duke meant *all* horses. This *was* a horse. Yet… Gongsun Long’s distinction between what satisfied ‘bring me a horse’ and ‘bring me a white horse’… that felt undeniable in its own way.

  He looked at Gongsun Long’s patient, expectant face, then at the dust-covered scroll case. The pass stretched empty behind him. The city beyond needed messages, not philosophical stalemates.

  With a grunt that was half exasperation, half surrender to the sheer mental exhaustion, the guard straightened up. He lowered his spear, not in defeat, but in a gesture of weary dismissal.

  "Enough," he rasped, his voice rough. "Take your… *white horse*… and go. Before my head splits open or another *actual horse* shows up and makes a mockery of this whole cursed pass."

  He didn’t believe the scholar. Or perhaps he believed him just enough to see the glimmer of a justification, a loophole spun from the very fabric of language itself. He didn’t know if Gongsun Long had revealed a profound truth about the separateness of attributes and names or simply outmaneuvered him with dazzling sophistry. All he knew was that the white horse, carrying its enigmatic rider, was no longer his problem to define. He waved them through, the unresolved tension hanging thick as the Zhao dust in the air behind them.
