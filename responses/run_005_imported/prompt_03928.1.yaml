    - However, this step relies on the assumption that the mathematician can know that he is sound. But how does he know that? If the mathematician is F, then he cannot prove his own soundness. Moreover, the step of forming F' and then reasoning about it might be seen as stepping outside F, which is not allowed if the mathematician is entirely F.
    - The objection to Penrose's version is that it assumes the mathematician has access to his own soundness in an unassailable way. But if the mathematician is a formal system, then by the second incompleteness theorem, he cannot prove his own consistency (let alone soundness). Thus, the assumption "I know I am sound" is problematic.
