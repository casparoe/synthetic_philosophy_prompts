prompt: |-
  Hey, next month I'm interviewing a philosopher for my podcast who defends a luck-egalitarian answer to the equality-of-what question -- roughly Cohen's "equality of access to advantage," not plain resources or welfare. Can you draft me eight to ten interview questions that go beyond him just restating the view: I want at least one on Elizabeth Anderson's "harshness" charge that the view abandons the imprudent once responsibility's been traced back to their own choices, one on her complaint that treating disability as brute bad luck to be "compensated for" is stigmatizing rather then a matter of justice, and one that pushes on whether his own way of distinguishing tastes someone's responsible for from ones that just happen to them can dodge Cohen's original complaint about Dworkin's "identification" test -- or whether it's just smuggling identification back in under a new name -- and for each, a follow-up keyed to whatever reply he's most likely to give.
