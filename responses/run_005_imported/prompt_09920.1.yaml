  We are to adjudicate the four moves in the argument about whether an expensive engagement ring is a Zahavian handicap signal.

  Recall the handicap principle (Zahavi, later formalized by Grafen): For a signal to be honest, the cost of signaling must be higher for low-quality individuals than for high-quality individuals. This is the "single-crossing" condition. The idea is that the signal is costly, but it is less costly for the high-quality type to produce, so only they can afford to produce it at the required level.

  Now, let's break down each move:

  (1) Sana: She says the ring is a Zahavian handicap because it's expensive, so a half-hearted partner wouldn't pay for one. Therefore, the expense makes the gesture credible.

  Verdict: This is a common-sense understanding but oversimplifies. The key is not just that it is expensive, but that the cost must be differentially burdensome. She hasn't addressed the differential cost condition. So it's partially right but misses the formal requirement.

  Score: 1 (partially right, but incomplete)

  (2) Mateo: He objects that the condition requires that the marginal cost of signaling must fall more heavily on low-quality signalers. A fixed price tag doesn't necessarily satisfy that because the same dollar amount might be equally costly to everyone (if we think only in dollars) or might not differentiate based on quality (commitment). He says the ring then looks like undifferentiated money burning.

  Verdict: This is a correct point about the formal condition. The handicap principle requires that the cost function must be such that the marginal cost is lower for the high-quality type. If the ring has a fixed price, then without considering the individual's wealth or commitment, it might not meet the condition. Therefore, he is right to point out the formal requirement.

  Score: 2 (clearly right)

  (3) Sana: She replies that the condition holds in utility terms: a committed partner finds the sacrifice easier to bear than an uncommitted one. So the marginal cost (in utility) is lower for the committed (high-quality) partner.

  Verdict: This is a valid point. The theory can be expressed in utility terms. The idea is that the disutility from spending a large amount on a ring is lower for someone who is highly committed because they value the partnership more. Therefore, the same dollar cost translates to a lower utility cost for the committed. This would satisfy the single-crossing condition if we assume that commitment (the quality being signaled) is what makes the sacrifice less painful. So she is correct in this reasoning.

  Score: 2 (clearly right)

  (4) Mateo: He counters that this only works if willingness-to-sacrifice (which comes from commitment) tracks ability-to-pay (wealth). But in practice, ring price is more tied to income than to devotion. He notes that the custom is pegged to salary (e.g., "two months' salary") and enforced by social expectations. Therefore, it becomes a conventional signal (as per Maynard Smith and Harper) rather than a handicap signal. In conventional signals, honesty is maintained by social sanctions (e.g., if you don't spend enough, you are criticized) rather than by intrinsic differential cost.

  Verdict: This is a strong point. If the signal is set by a social norm and the cost is the same for everyone (in terms of money, not utility) but the norm requires a fixed amount relative to income, then it may not be the commitment that determines the cost burden but the income. Moreover, if the norm is enforced by society, then it becomes a conventional signal. However, note that the ring might still have a handicap element if we think that the utility cost is lower for the committed, but Mateo is pointing out that in reality, the social convention aspect dominates. He is correct that the ring custom is often tied to income (salary) and that social expectations play a big role. Therefore, it is more accurately described as a conventional signal. This move is insightful and correct.

  Score: 2 (clearly right)

  But note: Sana's point in (3) is theoretically valid, but Mateo in (4) is pointing out that in practice, the signal is driven by social convention and income, not by commitment. So both (3) and (4) can be right in different ways. (3) is about the theoretical possibility and (4) about the actual practice.

  However, we are adjudicating each move individually. In (3), Sana's reasoning is sound in theory, so she gets a 2. In (4), Mateo's reasoning is also sound and adds an important practical and theoretical distinction (conventional vs handicap signals), so he gets a 2.

  But let's reassess (1): Sana's initial statement was an oversimplification. She did not mention the differential cost, only the absolute cost. So we give it 1.

  And (2): Mateo correctly points out the formal requirement, so 2.

  Now, let's summarize the scores:

  Move (1): 1
  Move (2): 2
  Move (3): 2
  Move (4): 2

  But wait: in (4), Mateo says that the condition in (3) only holds if willingness-to-sacrifice (commitment) tracks ability-to-pay (wealth). This is a valid point because if commitment and wealth are not correlated, then the ring price (which is tied to wealth) might not reflect commitment. However, in (3) Sana was not relying on wealth but on commitment reducing the disutility. The issue is that in practice, the ring price is set by wealth (via social norms) and not by commitment. So Mateo is right that the social norm aspect makes it conventional.

  We must note that the handicap principle does not require the signal to be tied to wealth. It requires the cost to be higher for low-quality types. If the quality is commitment, then the cost in utility must be lower for the committed. But if the ring price is set by a norm that requires a fixed fraction of income, then the dollar cost is proportional to income. For a given ring price, a wealthy person has a lower utility cost (if we assume diminishing marginal utility of money) than a poor person, but that doesn't necessarily relate to commitment. Therefore, the signal might be more about wealth than commitment.

  Moreover, Mateo's point about conventional signals is well taken. The ring tradition is indeed a norm, and breaking the norm (spending too little) incurs social costs. This is a classic conventional signal.

  So the scores stand.

