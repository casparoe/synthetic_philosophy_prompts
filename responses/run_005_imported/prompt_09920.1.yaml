  3: Sana's rebuttal is valid: by framing cost in utility terms, she shows how the same monetary expense could impose a lower marginal utility cost on a highly committed partner, satisfying the handicap condition in theory.

  4: Mateo's final point is strong: in practice, engagement ring costs are tied to income (via social norms) more than devotion, and the social enforcement mechanism aligns with conventional signaling rather than the intrinsic cost differential of handicap signals. This is a correct and insightful application of signaling theory.
