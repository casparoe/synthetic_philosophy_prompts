prompt: |-
  I'm a backend engineer at a mid-sized startup, and something that happened during a recent code review has been nagging at me ever since. One of our most senior engineers left a fairly blunt comment on a teammate's pull request for a customer-facing feature, calling it "irresponsible" to merge code without any unit tests and "exactly the kind of shortcut that eventually causes an outage." Taken purely on its own merits, I think he's right about that. What bothers me is that a few of us who work closely with him know that he routinely pushes untested changes to the internal tooling repository he mostly maintains alone, where no one reviews his commits closely enough to ever call him on it. The teammate who received the comment has no idea any of this goes on. When I mentioned it privately to another colleague, she just shrugged and said, "He's not wrong that it's bad practice, it just feels off for him, of all people, to be the one saying so."

  That reaction has stayed with me longer than I expected. Is there a meaningful difference between whether a piece of criticism is correct and whether the particular person voicing it has any right to be the one voicing it? Does it matter that his own untested code sits in a technically lower-stakes repository, or does the same underlying principle apply either way? And if the teammate eventually learned about all this, would that give him a legitimate reason to shrug off the feedback, or would that just be a convenient way of dodging a valid point by going after the critic instead of the substance? I'd like to reason through this properly rather than settle for something like "everyone's a hypocrite sometimes," since that doesn't really capture what feels unresolved to me about the situation.
reasoning: |-
  Okay, let me try to unpack this user's dilemma. They're a backend engineer troubled by a senior colleague's hypocrisy during a code review. The senior called out a teammate for pushing untested code in a customer-facing feature while routinely doing the same in internal tooling repos. 

  Hmm, the user seems genuinely conflicted - they acknowledge the technical correctness of the feedback but feel disturbed by the double standard. Their colleague's "He's not wrong but..." reaction clearly resonated deeply. What's really at stake here isn't just about testing practices, but about team trust and ethical consistency.

  I notice the user wants to avoid simplistic "everyone's hypocritical" answers. They're seeking principled reasoning about whether the critic's credibility matters when the substance is valid. Smart framing - this shows they care about both code quality and team dynamics.

  The internal/external repo distinction feels important. While production code risks customer outages, internal tools failing can still paralyze developers. But more crucially: the senior's solo commits avoid the scrutiny he demands from others. That power imbalance is the real issue - it's about accountability distribution.

  Ah, and the core tension: does validity of feedback exist independently of the messenger? Philosophically yes, practically no. The teammate might technically "should" accept the testing advice, but discovering the hypocrisy would understandably breed resentment and distrust. 

  The user's worry about "dodging valid points via ad hominem" is thoughtful. But this isn't just attacking the critic - it's recognizing that inconsistent standards destroy psychological safety. You can't preach best practices you systematically violate.

  What's unsaid but implied: the senior's position gives his criticism extra weight, making his hypocrisy more damaging. And since internal tools likely affect the whole team, his "low-stakes" argument is self-serving.

  The resolution path needs to address both layers: affirming the testing principle while confronting the double standard systemically. Maybe suggest the user gently raise the inconsistency with leadership? Not to punish the senior, but to align standards across all codebases.

  Most importantly - the user's discomfort signals strong ethical instincts. They're noticing how technical practices intersect with team health. That's exactly the kind of perspective good senior engineers need.
answer: |-
  You've identified a profound tension between the objective validity of feedback and the ethical legitimacy of the messenger—a conflict that strikes at the heart of technical leadership and team trust. Let's break this down systematically:

  ### 1. **The Core Principles at Stake**
     - **Technical Correctness**: The senior engineer is *objectively right* about the necessity of tests for customer-facing code. Untested changes in critical paths *do* risk outages.
     - **Ethical Consistency**: Leadership requires practicing what you preach. Applying strict standards to others while exempting yourself undermines credibility.

  ### 2. **Does Context (Internal vs. External) Absolve the Hypocrisy?**
     - **Stakes Argument**: Internal tools *might* have lower blast radii, but:
       - **False Dichotomy**: "Lower stakes" ≠ "no stakes." Broken internal tooling can paralyze developer productivity, delay deployments, or mask critical issues.
       - **Principle Erosion**: Testing isn't just about avoiding outages—it's about discipline, maintainability, and reducing cognitive load. Bypassing it habitually normalizes negligence.
       - **Cultural Contagion**: If a senior engineer openly disregards best practices in *any* repository, it implicitly signals that standards are optional. New engineers inheriting "internal" codebases learn bad habits.

  ### 3. **Validity vs. Credibility: Can Feedback Be "Right" but Illegitimate?**
     - **Yes, simultaneously**:
       - **The Feedback Stands**: The lack of tests *is* irresponsible for customer-facing code. Your teammate *should* address this.
       - **The Messenger Loses Standing**: By violating the same principle elsewhere, the senior engineer forfeits moral authority. Trust isn't transactional ("I enforce rules only when others see it"); it's built on integrity.
       - **Psychological Impact**: Learning about the hypocrisy would likely make your teammate feel targeted, demoralized, or resentful—undermining the feedback's intent.

  ### 4. **How Your Teammate *Should* React (Ideal World) vs. Reality**
     - **Ideal**: Acknowledge the technical merit ("Tests *are* needed here"), separate from the critic's behavior. Fix the tests.
     - **Reality**: Upon discovering the hypocrisy, your teammate would reasonably:
       - Question the senior's fairness ("Why are *my* cuts 'irresponsible' but his aren't?").
       - Distrust future feedback.
       - See leadership as hypocritical, damaging psychological safety.
     - **Not Dodging, But Contextualizing**: Rejecting feedback *solely* due to hypocrisy *is* an ad hominem fallacy. But human psychology doesn't operate on pure logic. The senior engineer poisoned their own message.

  ### 5. **Resolving the Unresolved: Actionable Steps**
     - **For You (Individually)**:
       - **Speak Privately to the Senior Engineer**: Frame it collaboratively: *"I agree with your stance on tests for customer features. To reinforce this consistently, should we revisit standards for internal tools too? I’ve seen untested changes cause headaches there as well."* Make it about raising the bar universally.
       - **Escalate Tactfully (If Needed)**: If the behavior persists, inform engineering leadership: *"Inconsistent testing standards are creating cultural friction. Can we formalize testing policies for all repos?"*
     - **For the Team**:
       - **Codify Standards**: Push for org-wide guidelines (e.g., "All production code—including internal tools—requires tests"). Remove ambiguity.
       - **Normalize Accountability**: In code reviews, gently reference policies neutrally: *"Per our standards, can we add tests here?"* (No naming/shaming).
       - **Share Ownership**: Rotate reviewers for internal tools. No one should operate in a silo.

  ### Why "Everyone's a Hypocrite" Falls Short
  Hypocrisy isn't binary—it’s a spectrum of impact. A junior engineer skipping tests once isn’t equivalent to a senior enforcing rules they systematically evade. Leadership roles demand higher accountability because their actions define culture. Tolerating inconsistency erodes standards faster than occasional lapses.

  ### Final Perspective
  The feedback about customer-facing tests was **correct** but **poorly delivered** by an inconsistent messenger. Fix the tests in the PR—not for the senior engineer, but for your users and team quality. Then advocate *systemically* for consistent standards. Great engineering cultures aren’t built by perfect individuals, but by systems that uphold principles even when people falter. Your discomfort is a signal: you’re the engineer who can help build those systems.
