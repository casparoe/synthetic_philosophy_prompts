prompt: |-
  Random one from grading medieval pol phil papers today. I keep telling students that Aquinas's line on tyrannicide is basically 'never take matters into your own hands -- deposing a ruler is for the public authority, and a private citizen who kills a tyrant is just committing sedition dressed up as justice' (mostly drawing on On Kingship). But it occured to me while marking: if legitimate authority for Aquinas is grounded in ruling for the common good, doesn't his own logic undercut that blanket ban -- a tyrant who rules purely for himself has already forfeited the very authority that would make killing him 'sedition' in the first place, no? Is that an actual tension in his view, or am I oversimplifying something he's more careful about?
reasoning: |-
  Okay, the user is grappling with Aquinas's stance on tyrannicide and whether there's a tension in his argument. They teach medieval political philosophy and are marking papers. The main point is that Aquinas says private citizens can't kill a tyrant; only public authority can depose rulers. But the user wonders: if authority comes from serving the common good, and a tyrant isn't doing that, hasn't he lost his legitimacy? So, wouldn't killing him not be sedition?

  First, I need to recall Aquinas's works. The key texts here are *On Kingship* and the *Summa Theologiae*. In *On Kingship*, Aquinas explicitly says that a private individual can't kill a tyrant. But in the *Summa*, he discusses tyranny and the common good. The user's question is about the conflict between the source of authority and the ban on private action.

  The user's concern is valid. If authority is conditional on the common good, a tyrant might lose legitimacy. But Aquinas still forbids private citizens from acting. Why? I should break down Aquinas's reasoning. He emphasizes that only public authority has the right to judge and depose. Private individuals acting alone would cause chaos and more harm. So, even if the tyrant is illegitimate, the process matters. 

  Also, Aquinas might distinguish between the office and the person. The office remains legitimate in structure, but the person misuses it. Therefore, the authority to correct must come through proper channels, like the community or higher powers. In *On Kingship*, he mentions that the community can depose a tyrant, not individuals. 

  The user might be oversimplifying by thinking forfeiture of authority automatically permits any action. But Aquinas is careful about maintaining order and due process. He's against vigilantism. The deeper need here is understanding how Aquinas balances moral principles with practical governance. The user wants to ensure they're teaching accurately and addressing student arguments effectively. They might also need to explain why Aquinas imposes restrictions despite the tyrant's illegitimacy. Highlighting the role of public authority and the risks of anarchy could clarify this tension. Emphasizing that forfeiture doesn't transfer the right to individuals but to the collective or designated authorities.
answer: |-
  You've hit upon a **genuine and profound tension** within Aquinas's political thought, reflecting the core challenge of reconciling his teleological view of authority (grounded in the common good) with the practical necessity of order and the dangers of anarchy. Your students are right to probe this, and your initial summary captures Aquinas's *explicit prohibition* accurately, but the logic of his foundational principles *does* create pressure against an absolute ban.

  Here's a breakdown of the tension and how Aquinas attempts (not entirely seamlessly) to resolve it:

  1.  **The Foundational Principle:** Authority is legitimate *only* insofar as it serves the common good. This isn't just a preference; it's the *essence* and *justification* of political authority for Aquinas ("For the end of government is the good of the governed," *On Kingship*, Ch. 1). A ruler who "lapses into tyranny" (*On Kingship*, Ch. 6) fundamentally violates this principle.

  2.  **The Explicit Prohibition:** Aquinas is unequivocal about private individuals killing tyrants:
      *   *On Kingship (De Regno)*, Ch. 6: "Nor should it be thought that such a one [a tyrant] should be slain by the presumption of a private person. For this is to set a bad example and a danger to the kingdom, since for the most part it is the worse who undertake such a deed... **it pertains to public authority to judge of the substitution of kings**... Private persons must not use force against rulers, however tyrannical they may be, unless perhaps there be an open declaration authorizing it by the public person who has the right to do so." (He also references Romans 13:1-2 about resisting God's ordinance).
      *   *Summa Theologiae* II-II, Q. 42, A. 2 (On Sedition): He explicitly contrasts sedition (a mortal sin) with justified resistance to tyranny *by public authority*. Sedition is "an **inordinate** uprising against a ruler," implying that an *ordinate* uprising (by the right authority) is conceptually possible.
      *   *Summa Theologiae* II-II, Q. 64, A. 3 (On Killing): He reiterates that private persons cannot licitly kill *anyone* except in self-defense (applying even to the worst criminals, as the *public authority* holds the power of the sword).

  3.  **The Source of Tension (Your Insight):** If the tyrant, by ruling for private gain and oppressing the common good, has *fundamentally ceased to fulfill the function that legitimizes authority*, then:
      *   Has he not *ipso facto* forfeited the *moral* claim to obedience inherent in *legitimate* authority?
      *   Does the act of killing him truly constitute "sedition" against *legitimate* authority, or is it rather resistance to a *usurper* or *criminal* who has already dissolved the bond of rightful rule?
      *   Aquinas's own logic suggests that the tyrant is no longer a *true king* but a *tyrant* – a different category defined by its illegitimacy.

  4.  **Aquinas's Nuances and Reservations (How He Mitigates the Tension):**
      *   **Distinction Between Person and Office:** Aquinas often distinguishes between the *office* of authority (which remains ordained by God for the common good) and the *person* occupying it corruptly. Attacking the *office* via private action is still an attack on the divinely ordained structure, even if the occupant abuses it.
      *   **Fear of Anarchy (The Greater Evil):** This is paramount for Aquinas. He fears the "bad example" and chaos far more than enduring tyranny for a time. Private tyrannicide invites cycles of violence, factionalism, and potentially worse rulers. Order, even flawed order, is preferable to the dissolution of society. ("It is more expedient to tolerate a mild tyranny for a time than by acting against the tyrant to become involved in many perils more grievous than the tyranny itself," *On Kingship*, Ch. 6).
      *   **"Public Authority" is Broader Than the Tyrant:** Aquinas *does* provide an escape valve, but it crucially bypasses the private individual:
          *   **The Community Itself:** In *On Kingship* (Ch. 6), he states that the *community* ("the whole multitude" or "public person") that granted authority has the right to depose the tyrant or restrict his power. He even suggests they wouldn't be acting *unfaithfully* by deposing an unfaithful ruler. This moves resistance into the realm of *public action*.
          *   **Higher Authority:** He explicitly mentions recourse to a "higher power" (like an Emperor over a King) who has the authority to judge and depose the tyrant.
      *   **Non-Violent Resistance First:** Endurance, moral persuasion, and prayer are the first resorts. Violent action (even by public authority) is a last resort.
      *   **Distinction Between Usurper and Tyrant:** Aquinas (*ST* II-II, Q. 42, A. 2, ad 3) makes a subtle but important distinction: Resisting a *usurper* who never had legitimate title is *not* sedition. Resisting a ruler who *acquired power legitimately but then rules tyrannically* requires the action of public authority, not private individuals. This clarifies that the tyrant *does* retain a formal, legal authority derived from his initial legitimate acquisition, even while morally forfeiting it – it's this formal authority that makes private action seditious.

  **Conclusion:**

  *   **Yes, there is a tension:** Aquinas's grounding of authority in the common good *logically implies* the forfeiture of legitimacy by a tyrant. This *does* strain the characterization of *any* resistance as inherently "sedition."
  *   **No, he doesn't fully resolve it:** He doesn't explicitly state that the tyrant's forfeiture *automatically* renders him a mere private criminal vulnerable to private justice. His overwhelming fear of disorder and his commitment to the *structure* of authority lead him to maintain the prohibition on private action.
  *   **He offers an alternative path:** He *transfers* the right/responsibility of dealing with the tyrant **away from the private individual and onto the community acting publicly or a higher authority.** This is his resolution: forfeiture doesn't empower *any individual* to act; it empowers the *public body* (the community or its superior representative) to act *as public authority*.
  *   **You're not oversimplifying his ban:** His prohibition on private tyrannicide *is* a blanket ban. However, you *are* correctly identifying the logical pressure point created by his foundational principles. Aquinas mitigates the tension by emphasizing process, order, and the distinction between public and private action, rather than dissolving the tyrant's *formal* authority entirely in a way that would license vigilantism.

  **Teaching Point:** Frame it as Aquinas prioritizing **due process and public order** above immediate individual justice, even when the ruler is manifestly unjust. The tyrant forfeits his *moral right* to rule, but the *legal/structural authority* and the *right to judge and depose* reside only with the constituted public body (the community or its superior). Killing a tyrant isn't wrong *because he deserves to rule*, but because it bypasses the *only legitimate mechanism* for removing him, risking catastrophic disorder. His logic *underpins* the community's right to act, but explicitly *denies* that right to any individual within it acting alone.
