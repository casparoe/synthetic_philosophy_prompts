answer: |-
  You've nailed the core philosophical tension in ergodicity economics (EE). The objection is sharp and valid: *why privilege the time-average growth rate of wealth itself, rather than some transformed version?* Doesn't this just smuggle in log-utility through the back door? Ole Peters & co. are aware of this critique, and their strongest counter-argument hinges on **the specific mathematical structure of the observable (wealth) and its dynamics (multiplicative growth)**. Here's the steelman, articulated as strongly as possible:

  **The Steelman Argument: Dynamics Dictate the Observable, Not Preferences**

  1.  **Wealth is the Fundamental Observable with Inherent Dynamics:**
      *   The starting point isn't arbitrary. We are *given* a specific, measurable quantity: **Wealth** (`W`). This is the thing you hold, bet with, and whose evolution you care about.
      *   We are *given* a specific dynamic: **Multiplicative Growth/Shrinkage**. When you reinvest your entire bankroll (`W_t`) in a bet with multiplicative return `R` (e.g., `R = 1.2` for a 20% gain, `R = 0.7` for a 30% loss), your next period wealth is `W_{t+1} = W_t * R`. This multiplicative dynamic is inherent to the process of reinvesting proportional bets.

  2.  **The Key Question is Survival and Long-Term Growth *of Wealth*:**
      *   The fundamental practical question for an agent in this scenario is: "How does my wealth (`W`) evolve over time (`t`) under repeated application of this multiplicative dynamic?" You care about the actual trajectory `W_1, W_2, W_3, ..., W_T` you experience.
      *   The core risk is **ruin** (`W_t -> 0`) or **stagnation** vs. **growth**. The magnitude of losses matters multiplicatively – a 50% loss requires a 100% gain just to break even.

  3.  **The Time-Average Growth Rate is the *Natural* Property Emerging from the Dynamics:**
      *   Given the multiplicative dynamic `W_{t+1} = W_t * R_t`, the most natural way to characterize the long-term behavior of the *wealth* trajectory is its **geometric mean growth rate per step**:
          `g = \lim_{T \to \infty} \frac{1}{T} \log \left( \frac{W_T}{W_0} \right)`
      *   This `g` isn't chosen because we like logs. It's chosen because it **directly answers the fundamental question posed by the dynamics**:
          *   `W_T = W_0 * exp(T * g)` shows `g` explicitly determines the *exponential growth rate* of wealth over time.
          *   `g` determines long-term dominance: A strategy with a higher `g` will almost surely (`P=1`) result in higher wealth than a strategy with a lower `g` in the long run (`T -> ∞`).
          *   `g < 0` implies almost sure ruin (`W_t -> 0`).
          *   `g = 0` implies almost sure stagnation (fluctuations but no trend).
          *   `g > 0` implies almost sure exponential growth.
      *   **Crucially:** This growth rate `g` is a *property of the wealth trajectory itself* under multiplicative dynamics. It quantifies the *actual* long-term performance of `W`.

  4.  **Ergodicity Breakdown Forces the Distinction:**
      *   The ensemble average (expected value `E[R]`) fails to predict the time-average growth `g` for multiplicative processes because the process is non-ergodic. `E[R] > 1` does *not* guarantee `g > 0` (e.g., bets with high risk of ruin).
      *   **EE's Core Claim:** When you care about the long-term trajectory of a *specific* observable (`W`) undergoing a *specific* dynamic (multiplicative reinvestment), the *only* quantity that reliably tells you what will *actually* happen to *your* `W` over time is the time-average growth rate `g`. The ensemble average `E[W_T]` is irrelevant to your single trajectory; it describes an average over many parallel universes, not your future.

  5.  **Why Not Transform Wealth? The Dynamics Argument:**
      *   **Transforming Breaks the Natural Dynamic Link:** If you transform wealth (`U(W) = \sqrt{W}`, `U(W) = \log W`, `U(W) = W^2`, etc.), you are *defining a new observable*. The *inherent dynamic* of the system is still multiplicative growth *of wealth* (`W_{t+1} = W_t * R`), not of `U(W)`.
      *   **`g` Answers the Wealth Question:** The time-average growth rate `g` directly tells you the fate of `W`. The time-average growth rate of `U(W)` tells you the fate of `U(W)`, which is *not* the fundamental quantity you started with or whose dynamics are inherent to the reinvestment process.
      *   **Example:** Maximizing the time-average of `\sqrt{W}` would lead to different betting strategies than maximizing `g` (the growth rate of `W`). The EE argument is that if your fundamental concern is the long-term behavior *of your actual wealth `W`*, then optimizing the time-average of `\sqrt{W}` is optimizing the wrong thing. `\sqrt{W}` doesn't compound multiplicatively; `W` does. A strategy good for growing `\sqrt{W}` might be disastrous for `W` itself (e.g., too conservative), or vice-versa (e.g., too risky, leading to ruin).
      *   **Log is Special *Because* of Multiplicative Dynamics:** `\log W` is the *unique* transformation (up to affine scaling) that turns the multiplicative dynamic `(W_{t+1} = W_t * R)` into an *additive* dynamic `(\log W_{t+1} = \log W_t + \log R)`. This is why `g` (the time-average of `\Delta \log W`) emerges naturally. It's not that we impose log-utility; it's that the log *arises directly* as the functional that linearizes the inherent multiplicative dynamic. Maximizing `g` is equivalent to maximizing the time-average of the *change* in log wealth *because* of the dynamics.

  6.  **The "Objective" Claim:**
      *   EE argues that `g` isn't "log utility" in the traditional sense. It's not a representation of subjective preferences about wealth levels. Instead, `g` is presented as the **objective criterion for long-term survival and growth *of wealth itself* under multiplicative reinvestment dynamics.**
      *   The claim is: *Given* that you are playing a game with multiplicative reinvestment and *given* that you care about the long-term trajectory of your actual wealth `W` (avoiding ruin, achieving growth), then maximizing `g` is the *only* rational strategy. Subjectivity enters only in the initial choices: Are you forced into multiplicative reinvestment? Do you primarily care about long-term `W`? But *if* you answer "yes" to both, then `g` is the non-arbitrary, dynamically-dictated quantity to optimize. Preferences don't dictate the *form* of `g`; the dynamics do. Preferences only dictate whether you accept the game and its goal.

  **Addressing the Objection Directly:**

  *   **"Isn't choosing wealth arbitrary?"** EE concedes the starting point (wealth, multiplicative reinvestment) is a context. But within that very common and economically fundamental context, the dynamics *force* `g` as the relevant long-term performance metric *for that wealth*. If your fundamental concern is something else (e.g., minimizing the time-average variance of happiness derived from wealth), then you define a different observable (`Happiness`) and study *its* dynamics. EE claims that *for the observable "wealth" under multiplicative reinvestment*, the time-average growth rate `g` is objectively privileged by the mathematics of the process.
  *   **"Haven't they smuggled in log-utility?"** EE argues vehemently no. Log-utility in standard EUT is a *subjective* curvature representing risk aversion. The `log` in `g` arises *objectively* from the multiplicative dynamics and the definition of the long-term growth rate. It's a property of the *system*, not a description of the *agent's psychology*. An agent maximizing `g` might be incredibly risk-seeking or risk-averse *by EUT standards* depending on the bet offered; their "risk attitude" is determined *by the dynamics*, not by a pre-defined utility function. The "log" here is a mathematical tool for analyzing multiplicative growth, not a statement about the diminishing marginal utility of wealth.

  **Conclusion of the Steelman:**

  The strongest EE argument is that **within the specific domain of repeated multiplicative reinvestment of wealth, the time-average growth rate `g` is not an arbitrary choice but the mathematically emergent, objective quantity that determines the almost-sure long-term fate of the wealth trajectory itself.** Choosing to optimize a transformed quantity (like time-average `\sqrt{W}`) would mean optimizing for the fate of something *other* than the wealth `W` you started with and whose multiplicative dynamics define the problem. The "log" in the Kelly criterion isn't a subjective utility function imposed on the problem; it's revealed by the mathematics as the necessary functional form to extract the growth rate inherent to the multiplicative dynamic. Therefore, EE claims that for this class of problems (ubiquitous in finance and economics), optimizing `g` (and the resulting risk aversion) is rationally forced upon *any* agent who wants their wealth to survive and grow over the long term under those dynamics. The arbitrariness, they argue, lies in using ensemble averages that don't correspond to realized time averages, not in the focus on the growth of raw wealth under its own multiplicative dynamic.
