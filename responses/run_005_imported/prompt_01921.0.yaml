   Move (2): Colin invokes Nagel's reply: 
     - Harm doesn't require being felt. Examples: 
          (a) A man betrayed behind his back is wronged even if he never learns of it.
          (b) An adult reduced to an infant's mental state is harmed regardless of his subsequent thoughts.
     - Death is bad because it forecloses future goods, not because there's a surviving subject to suffer.

     Nagel's position is a well-known counter to Epicurus. The examples are standard and compelling to many. 
     The idea that death is bad because of the loss of life it represents is a common intuition.

     Score: 2 (A strong and widely accepted counter-argument.)

   Move (3): Nora presses on timing: 
     - When exactly is death bad for the person? 
          Not before (alive and unaffected), 
          not after (no subject), 
          and "at the moment" is unhelpful.

     This is a common challenge to Nagel's view. It points to a metaphysical puzzle about when the harm occurs. 
     It's a legitimate point and one that Nagel must address. However, Nagel (and Colin) might deny that harms must occur at a specific time.

     Score: 1 (It's a valid challenge, but it doesn't necessarily refute Nagel.)

   Move (4): Colin answers that not every truth needs a date: 
     - It's simply true that dying at 40 rather than 80 was bad for you, just as it's true that you would have been richer if you had invested, without a specific instant when that becomes true.

     This is a good point. Many truths (especially counterfactuals) do not have a specific time of occurrence. 
     The harm of death might be seen as a comparative harm: it's bad relative to the alternative of living longer. 
     This avoids the need for a specific time when the harm is felt.

     Score: 2 (A strong reply that aligns with how we think about many harms and counterfactuals.)

   Move (5): Nora raises Lucretius's mirror argument: 
     - If death is bad because it forecloses future goods, then our pre-natal non-existence should be equally bad because it forecloses past goods. 
     - But no one mourns their pre-natal non-existence.

     This is a classic symmetry argument. It challenges the asymmetry in our attitudes toward death (future) and pre-birth (past). 
     The argument is logically parallel and thus a challenge to the view that death is bad because of lost future goods.

     Score: 2 (A powerful and historically important argument that requires a response.)

   Move (6): Colin replies that the cases aren't parallel: 
     - There is a possible future where you continue to exist and accumulate goods, but there is no possible world where you existed earlier (because you are individuated by your origin). 
     - Therefore, a foreclosed future is a loss, but an impossible past isn't.

     This is a standard response to the symmetry argument. It relies on the idea that we have a potential future but no potential past. 
     The point about individuation (an earlier "you" would be someone else) is a common metaphysical stance. 
     However, this response is not uncontroversial (as Nora's next move shows).

     Score: 1 (It's a common and defensible reply, but it might not convince everyone.)

   Move (7): Nora brings up Parfit's patient: 
     - A patient doesn't know whether his painful operation was yesterday or is tomorrow. He is relieved to learn it was yesterday. 
     - This relief is solely because of the date (past vs. future), which shows our bias toward the future is unprincipled and not based on the metaphysical asymmetry Colin described.

     Parfit's example is meant to show that our attitude toward past and future pains is asymmetric and that this asymmetry is not justified by any objective difference. 
     In particular, the relief about the pain being in the past (even if the patient doesn't remember it) suggests that we have a bias toward the future. 
     This challenges Colin's claim that the asymmetry between past and future non-existence is grounded in a metaphysical difference.

     Score: 2 (It's a strong challenge to the idea that the asymmetry is purely metaphysical.)

