   Finally, note anything important that neither raised.

   Additional considerations:

     - One important point is that Epicurus might respond to Nagel by denying that deprivation is a harm in the absence of a subject. 
       The argument might boil down to whether we accept deprivation as a harm.

     - Another point is that Nagel's view might be seen as relying on a "life comparative" account of harm: death is bad because the person would have been better off without it. 
       But this requires that the person exists to be the subject of the comparison? Not necessarily, as we often make comparisons about non-existent states (e.g., "It would have been better if he had lived").

     - The symmetry argument (Lucretius) has other responses. For example, some argue that we do not regret the past because we cannot change it, but we can fear the future because we might avoid it. 
       However, this is a psychological point, not a metaphysical one.

     - Parfit's future bias might be irrational, but it might also be deeply ingrained and perhaps even rational in some contexts (e.g., planning). 
       The debate about whether future bias is rational is ongoing.

     - Another point: the possibility of posthumous harm (e.g., damage to one's reputation after death) might be raised. 
       But note that Epicurus would deny this, and Nagel might also see it as a different kind of harm.

     - Also, there is the issue of whether death is bad for the person who dies or only for others. 
       Both Nora and Colin seem to be focusing on whether death is bad for the person who dies.

     - A further point from contemporary philosophy: some (e.g., Feldman) have argued that death can be bad at times when the person would have been enjoying life if they hadn't died. 
       This might address the timing issue by distributing the harm over time.

     - Finally, the debate might be framed in terms of whether death is an event that happens to a person (and when) or a state of affairs that is bad for the person.

   Neither raised the possibility of a "timeless" or "eternal" perspective on harm (as in some religious views) or the idea that the badness of death is not a property of the dead person but a feature of the world (a loss of value). 
   Also, they did not discuss the role of desires: death might be bad because it thwarts our desires for future projects (a desire-based account). 
   However, Epicurus would argue that death eliminates desires too, so there's no subject to have the desire frustrated.

   Overall, the exchange covered the main points well.
