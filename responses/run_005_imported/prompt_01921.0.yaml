     Epicurus's argument is a classic one. It has been influential, but it has also been challenged (e.g., by Nagel). 
     The argument is logically valid from its premises, but the premises are controversial. 
     We might say it's a reasonable presentation of Epicurus, but not necessarily "clearly right" in the broader debate.

