prompt: |-
  I keep noticing a move in effective altruist and rationalist writing that I don't think gets scrutinized enough: people invoke evolutionary debunking arguments, in the style of Sharon Street's Darwinian Dilemma, to discount parochial moral intuitions—favoring kin, tribe, or the present generation—as better explained by what Street calls an "adaptive link account" (the disposition was fitness-enhancing regardless of whether its content was true) than by a "tracking account" on which our ancestors were actually detecting independent evaluative facts. Yet the same style of explanation seems just as available for the impartial, aggregative intuitions that cause-prioritization work depends on (that a benefit's moral weight doesn't depend on who receives it, that more welfare is better than less), and Street intended her dilemma as a fully general argument against realism, with no built-in exemption for whichever intuitions happen to be impartial rather than parochial. Please describe the most important implications of this for how much epistemic weight I should give my own impartial, scope-sensitive intuitions when they are doing load-bearing work in cause-prioritization reasoning, and assess whether Katarzyna de Lazari-Radek and Peter Singer's Sidgwickian attempt to save axioms such as impartiality and temporal neutrality—by treating them as byproducts of a general rational capacity rather than direct targets of selection—genuinely escapes the dilemma, or merely relocates the same evidential burden one level up.
reasoning: |-
  Okay, the user has presented a really sophisticated critique of how evolutionary debunking arguments (EDAs) are selectively applied in effective altruist (EA) and rationalist circles. They're noticing a double standard: EDAs are used to dismiss parochial moral intuitions (like favoring kin or tribe) as evolutionarily shaped rather than truth-tracking, but the same logic isn't applied to impartial intuitions (like scope sensitivity or temporal neutrality) that underpin EA cause prioritization. 

  Hmm, this is meta-ethics meeting practical ethics in a very pointed way. The user clearly understands Sharon Street's Darwinian Dilemma well—they're referencing not just the surface-level application but Street's original intent as a *global* challenge to moral realism. Their frustration seems to be that EA/rationalist thinkers wield EDAs asymmetrically to delegitimize traditional morality while insulating their preferred utilitarian axioms from the same scrutiny. 

  The mention of de Lazari-Radek and Singer's Sidgwickian defense suggests they've done deep reading. This isn't a casual observation; they're spotting a tension in the philosophical foundations of EA. I should acknowledge that acuity upfront. Their core question is epistemic: how much weight *should* those impartial intuitions bear in cause-prioritization given EDAs apply equally to them? 

  Breaking it down: First, I need to validate their core insight—yes, EDAs *do* threaten impartial intuitions just as much. Street absolutely meant her dilemma to be general. The selective use they've observed *is* philosophically inconsistent. Then, the implications: this forces either (a) radical skepticism about all moral intuitions (including EA's), or (b) finding a principled distinction between intuition types. 

  On Singer/de Lazari-Radek's move: their argument that impartiality arises from *rational capacities* rather than direct selection is clever, but I suspect it only kicks the can down the road. Evolution shaped rationality too—was *it* selected for truth-tracking or adaptive problem-solving? If the latter, the EDA recurs. I think the user is right to suspect this relocates rather than resolves the burden. 

  For cause-prioritization, this is paralyzing if taken to extremes. Maybe the practical path is acknowledging EDAs weaken all intuitions' authority but still using impartial ones *provisionally*—not as bedrock truth, but as the least inconsistent basis for large-scale welfare decisions. But I should stress this doesn't fully escape Street's challenge. 

  The user's tone is critical but constructive; they want rigor, not dismissal. I’ll avoid defensiveness and sit with the discomfort their critique creates. Their subtext might be: "Is EA on shakier ground than it admits?" The answer is probably yes—and that’s okay if acknowledged.
answer: |-
  Your observation highlights a profound tension in the epistemic foundations of cause-prioritization work. Let's break down the implications and assess Singer/de Lazari-Radek's defense:

  ### Core Implications for Epistemic Weight of Impartial Intuitions
  1.  **No Privileged Epistemic Status**: If Street's dilemma is valid, impartial intuitions (scope sensitivity, impartiality, temporal neutrality) face the *same* evolutionary debunking threat as parochial ones. The fact that they are "expansive" doesn't exempt them from the challenge that they *could* be fitness-enhancing misbeliefs (e.g., impartiality facilitating cooperation in large groups, scope sensitivity aiding resource allocation in complex societies).

  2. **Asymmetric Scrutiny is Unjustified**: The common EA/rationalist move to debunk parochialism while *uncritically* relying on impartial intuitions is logically inconsistent. Both sets of intuitions arise from cognitive machinery shaped by natural selection for fitness, not necessarily truth-tracking.

  3. **The Load-Bearing Problem**: When impartial intuitions are the *sole* foundation for cause prioritization (e.g., comparing vastly different cause areas via DALYs/QALYs), their potential debunking creates significant epistemic risk. If these intuitions are unreliable, the entire prioritization framework becomes suspect.

  4. **Possible Responses & Their Costs**:
      *   **Radical Skepticism**: If *all* moral intuitions are debunked, cause prioritization loses its intuitive foundation. This leads to paralysis or reliance on non-intuitive frameworks (e.g., purely formal decision theory), which may be impractical or lack motivational force.
      *   **Selective Defiance**: Insist impartial intuitions *are* reliable despite the EDA. This requires explaining *why* evolution would favor truth-tracking *only* for impartiality/temporal neutrality but not for kin loyalty – a difficult task.
      *   **Coherentist/Pragmatic Justification**: Acknowledge the challenge but argue impartial intuitions form a more *internally coherent* and *practically useful* system for maximizing welfare globally, even if their ultimate evolutionary origins are suspect. This shifts justification away from pure intuition-tracking.

  ### Assessing Singer & de Lazari-Radek's Sidgwickian Defense
  Their argument (primarily in *The Point of View of the Universe*) claims impartiality and temporal neutrality arise not as *direct* targets of selection but as **byproducts of the capacity for rational thought**. Rationality, they argue, involves universalization and consistency. When applied to ethics, this inevitably leads to impartiality (the equal consideration of interests) and temporal neutrality (no intrinsic preference for present over future). Selection favored general rationality for adaptive problem-solving; impartiality is a *consequence* of that general capacity when used reflectively.

  **Does it Escape the Dilemma? Mostly No – It Relocates the Burden:**

  1.  **Relocation, Not Escape**: The EDA now targets the **evolutionary origins of rationality itself**:
      *   Was the capacity for rationality selected *because* it tracks normative truths (a "tracking account" for rationality)?
      *   Or was it selected *solely* because it solved adaptive problems related to social coordination, planning, and prediction, regardless of whether its outputs (including ethical impartiality when universalized) correspond to mind-independent truths (an "adaptive link account" for rationality)?

  2.  **The Recurring Challenge**: The same evolutionary logic applies. It's highly plausible that general rationality was selected for its instrumental fitness benefits (e.g., outwitting competitors, planning hunts, navigating social hierarchies). There's no clear evolutionary reason why this capacity, when extended to abstract ethical universalization, would suddenly become reliable for tracking mind-independent moral truths. Rationality could be supremely effective at adaptive *fiction*-generation.

  3.  **The Burden of Proof Shifts Upwards**: Singer/de Lazari-Radek must now demonstrate that the *general capacity for rationality*, in its ethical application, *is* truth-tracking. This requires:
      *   Arguing that evolution *did* select for truth-tracking in rationality (difficult given the prevalence of adaptive biases).
      *   Or, arguing that rational ethical universalization accesses truths *beyond* the evolutionary nexus (e.g., via a non-naturalist Platonism about reasons), which faces its own metaphysical and epistemic problems.

  4.  **A Limited Pragmatic Win**: Their move *does* differentiate the *proximate cause* of impartial intuitions. They arise from reflective reasoning, not a "modular" evolved instinct like kin preference. This *might* grant them slightly more *revisability* and *coherence* within a rational system. However, it doesn't resolve the *ultimate* evolutionary challenge to their *truth-tracking* reliability.

  ### Conclusion & Practical Implications for Cause Prioritization

  1.  **Acknowledge the Vulnerability**: Your impartial intuitions *cannot* bear epistemic load with the same naïve confidence that might be assumed if EDAs are only applied to parochial intuitions. They are not evolutionarily privileged.

  2.  **Mitigate Epistemic Risk**:
      *   **Diversify Foundations**: Don't rely *solely* on impartial intuitions. Seek coherence with other plausible moral principles, empirical data about welfare, and the practical consequences of adopting the framework.
      *   **Embrace Coherentism**: Justify the impartial framework holistically – based on its internal consistency, explanatory power, practical utility in reducing suffering/increasing flourishing on a vast scale, and its ability to resolve conflicts better than alternatives *in practice*. This shifts justification away from *origins* towards *systematic performance*.
      *   **Emphasize Instrumental Value**: Argue that impartiality and scope sensitivity, *even if not reflecting ultimate mind-independent truths*, are the *best tools available* for fairly and effectively addressing suffering and promoting well-being in an interconnected world of vast inequalities and existential risks. Their evolutionary origin doesn't negate their instrumental efficacy for this specific goal.
      *   **Focus on Suffering/Flourishing**: Ground prioritization more directly in (fallible) empirical understandings of what constitutes suffering/flourishing for sentient beings, using impartial aggregation as a *methodological tool* rather than an unquestioned axiom.

  3.  **Regarding Singer/de Lazari-Radek**: Their defense offers a *psychologically plausible* account of why impartiality arises from reflection but does *not* decisively overcome the EDA. It successfully argues that impartiality isn't *just another parochial instinct*, but it merely relocates the core challenge to the evolutionary origins of rationality itself. The evidential burden for the reliability of *rational ethics* remains high.

  **In essence:** You should give significant, but *not foundational* or *infallible*, weight to your impartial intuitions in cause prioritization. Treat them as essential components of a powerful, coherent, and practically indispensable *system* for addressing large-scale suffering, while acknowledging their potential evolutionary contingency. Justify the system primarily by its coherence and consequences, not by the presumed unreliability of parochial intuitions contrasted with the presumed reliability of impartial ones. The EDA applies globally, demanding a more nuanced and less intuition-dependent epistemology for moral prioritization.
