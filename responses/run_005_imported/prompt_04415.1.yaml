  I'm a retired condensed-matter physicist, and lately I've fallen down the Bell's theorem rabbit hole (better late than never -- 40 years of "shut up and calculate" will do that to you). Something's been bugging me: half of what I read treats Bell's theorem as a trilemma -- give up locality, or "realism" (hidden variables / definite pre-existing values), or free choice of measurement settings -- while the other half (Norsen, and apparently Maudlin too) insists "realism" isn't doing any real independent work, that it just falls out of locality plus the perfect EPR correlations, so its really only a dilemma between locality and free choice. Could you write me a short dialogue between two physicists hashing this out over coffee after a seminar -- one defending "realism" as a genuine, seperate assumption you could reject instead of locality, the other arguing that's a mistake and there's no such third escape route? I want them actually responding to each other's specific arguments, not just trading slogans.
