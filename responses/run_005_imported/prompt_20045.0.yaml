answer: |-
  That's an incredibly sharp observation – you've hit on a genuine tension within the "standing to blame" literature. Philosophers working on hypocrisy and moral standing **do not generally accept the conclusion that this leads to practical moral nihilism**, but they *do* acknowledge the force of your concern and offer several key distinctions to avoid collapsing into that conclusion. Here's a breakdown:

  1.  **Distinguishing Wrongness from Standing to Blame:** This is the most crucial point.
      *   **The Wrongness Remains:** The teenager speeding *is* still blameworthy *for speeding*. The act itself is wrong (assuming speeding is morally wrong in that context), independent of who points it out. The parent's hypocrisy doesn't magically make speeding permissible.
      *   **The Standing is Forfeited:** What the parent loses is the *authority* or *legitimacy* to *express* that blame *to the teenager*. Their blame loses its moral force *as a communicative act* because their own behavior undermines the sincerity, fairness, and potential effectiveness of the rebuke. The parent's action is "illegitimate" *as an act of blaming*, not because the teenager's speeding isn't wrong.
      *   **Analogy:** Think of a corrupt judge. A corrupt judge might forfeit their standing to sentence someone for a crime. But that doesn't mean the criminal didn't commit the crime or that the crime wasn't wrong. The *wrongness of the act* exists separately from the *authority of the judge*.

  2.  **The Teenager's Blameworthiness is Intact:**
      *   The teenager *has* done something blameworthy (speeding).
      *   The parent's disqualification doesn't erase this. It simply means the parent is a poor messenger. The teenager might still feel guilty, recognize the wrongness themselves, or be legitimately blamed by others (see point 4).

  3.  **Not All Hypocrisy is Equal (The "In Parity" Requirement):**
      *   Philosophers like R. Jay Wallace emphasize that the hypocrisy must be *relevant* and *in parity* with the fault being blamed. The parent is hypocritical *specifically* about speeding. This doesn't necessarily disqualify them from blaming the teenager for, say, cheating on a test (unless they also cheat in their own life in a relevant way).
      *   **Degrees Matter:** Is the parent a *mild* speeder occasionally going 5mph over, while the teenager is habitually racing at 30mph over? Some argue that significant disparity might lessen or even negate the hypocrisy charge ("They aren't *really* guilty of the *same* fault"). Others argue any relevant hypocrisy taints standing, but this is debated.

  4.  **Third Parties Retain Standing:**
      *   This is the most powerful response to the "universal hypocrisy" worry. Even if *the parent* lacks standing to blame the teenager for speeding, *others* do not necessarily lack it.
      *   A police officer who doesn't speed has standing.
      *   A friend who doesn't speed has standing.
      *   A teacher who emphasizes road safety has standing.
      *   The crucial point: The disqualification is *agent-relative*. My hypocrisy disqualifies *me* from blaming *you* for *this specific fault*. It doesn't disqualify *everyone else*, nor does it disqualify me from blaming you for *other* faults where I *am* blameless.
      *   **Universal Hypocrisy?** It's empirically false that *everyone* is a hypocrite about *every* moral failing *all the time*. There are people who are genuinely conscientious about specific issues and can legitimately blame others for faults in that domain. Even if someone *is* a hypocrite about something, it doesn't mean they are a hypocrite about *everything*.

  5.  **The Purpose of the "Standing" Requirement:**
      *   Defenders argue this framework *strengthens* morality, it doesn't undermine it. The point is to make moral communication and blame more effective, fair, and credible.
      *   Hypocritical blame is often counterproductive (breeding resentment, defensiveness) and unfair (violating a principle of reciprocal accountability). Insisting on standing ensures that blame comes from a position of moral credibility, making it more likely to achieve its aims (acknowledgment, repentance, reform) and preserving the integrity of moral norms.
      *   It encourages moral consistency in the blamer.

  6.  **Self-Blame and Reform:**
      *   Importantly, someone who recognizes their own hypocrisy isn't disqualified from *self*-blame or from striving to reform. They might even say, "Look, I know I speed too, and I'm working on it, but *that's exactly why I know how dangerous it is* – please don't do it." This can sometimes mitigate the hypocrisy charge or even restore some standing if sincere, though it's tricky.

  **Philosophers' Stance & Your Concerns:**

  *   **Rejecting Nihilism:** Mainstream philosophers working on standing (e.g., R. Jay Wallace, Gary Watson, Macalester Bell, Miranda Fricker) firmly reject the idea that the standing requirement leads to moral nihilism. They see it as a refinement of our moral practices, not their abolition.
  *   **Acknowledging the Tension:** They readily acknowledge the force of the worry you raise – the potential for widespread disqualification and the separation of wrongness from blame-expression. This is a core topic of discussion.
  *   **Key Defense:** The reliance on **third-party standing** is the primary bulwark against the collapse you describe. As long as there are non-hypocritical agents regarding a specific fault (and there almost always are), legitimate blame remains possible.
  *   **Distinguishing Ideas:** You are *not* fundamentally conflating separate ideas; you are astutely pushing a logical implication. However, philosophers argue that the implication (nihilism) doesn't follow because:
      1.  Wrongness is independent of standing.
      2.  Standing is forfeited *relationally* (hypocrite-to-target), not universally.
      3.  Non-hypocritical third parties almost always exist for any given fault.

  **Conclusion:**

  Your reasoning is excellent and identifies a genuine challenge. However, philosophers defend the "standing to blame" framework by insisting that:

  1.  The **wrongness of the act** (teenager speeding) persists regardless of the blamer's standing.
  2.  The **standing to blame** is a separate condition concerning the *moral authority of the blamer in that specific context*.
  3.  Hypocrisy disqualifies *that particular blamer* for *that particular fault* against *that particular target*.
  4.  Crucially, **third parties without the relevant hypocrisy retain full standing to blame**, preventing universal disqualification and practical nihilism.

  The framework aims to make moral communication more credible and effective, not to declare that wrongdoing ceases to be wrong if the only available blamer is a hypocrite. The teenager's speeding is still wrong; the hypocritical parent is just the worst possible person to point it out. Someone else, hopefully, can do it better.
