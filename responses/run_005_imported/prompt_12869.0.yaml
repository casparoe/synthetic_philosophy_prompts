  But is this truly non-arbitrary? The user might be spotting a hidden assumption. Ergodicity economics assumes you care about long-term wealth growth. If you have different goals, like surviving short-term, Kelly might be too aggressive. So the "arbitrariness" shifts from utility function to the objective—long-term growth vs. other goals.

  Also, Samuelson's point still stands in expected utility. If your utility isn't log, Kelly isn't optimal. But ergodicity says for multiplicative processes, not using Kelly means your wealth doesn't grow optimally over time. 

  The user seems mathematically savvy, given they're building a bot and diving into Kelly proofs. Their frustration is understandable—both sides use different frameworks. I should clarify that ergodicity provides a growth-optimal benchmark, while expected utility allows different risk preferences. 

  In practical terms, for their arbitrage bot, Kelly is useful but risky if bankroll is small. They might need fractional Kelly. The ergodicity argument justifies Kelly as growth-maximizing, but if short-term risk matters, dialing it down makes sense. 

