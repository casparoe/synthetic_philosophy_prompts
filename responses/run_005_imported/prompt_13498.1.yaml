answer: |-
  Here's a breakdown of how Cummins's causal-role account and the strongest etiological account (incorporating Godfrey-Smith's "modern history" refinement) handle the feather exaptation case, followed by an assessment of ad hoc-ness:

  1.  **Causal-Role Function (Cummins):**
      *   **Core Principle:** A function of a trait (X) in a system (S) is the causal contribution X makes to the exercise of some *disposition* or *capacity* (C) of S. Function is relativized to the capacity under analysis and the containing system. It's about *current causal role* within a system.
      *   **Application to Feathers:**
          *   **Capacity 1: Thermoregulation:** If we analyze the bird's capacity to maintain body temperature, feathers (specifically their structure for trapping air, reducing heat loss) make a significant causal contribution. Therefore, **relative to the thermoregulatory capacity of the bird**, the function of feathers *is* thermoregulation/insulation.
          *   **Capacity 2: Flight:** If we analyze the bird's capacity for flight, feathers (specifically their aerodynamic properties – airfoil shape, lightweight structure, surface area for lift) make a significant causal contribution. Therefore, **relative to the flight capacity of the bird**, the function of feathers *is* contributing to flight/locomotion.
      *   **Verdict:** Feathers have **multiple functions** (thermoregulation, flight) depending on which capacity of the bird system we choose to analyze. There is no single, privileged "true" function. The exaptation poses no problem; it simply highlights two distinct capacities the trait currently contributes to. The question "What is *the* function?" dissolves; it's always "What is its function *relative to capacity C*?"

  2.  **Etiological Function (Neander/Millikan + Godfrey-Smith "Modern History"):**
      *   **Core Principle:** The function of a trait (X) is *what it was selected for* in the evolutionary history of the lineage. It's the effect for which it was favored by natural selection, explaining its current presence and form. The "modern history" refinement argues that *recent* selection pressures are most relevant for explaining the *current* maintenance and form of the trait.
      *   **Application to Feathers (Traditional Etiological Problem):**
          *   Ancestral feathers (in non-flying dinosaurs/birds) were selected *for thermoregulation*. This explains their initial evolution and presence.
          *   Later, the aerodynamic properties of *existing* feathers became advantageous and were selected *for flight*. This explains their further refinement and maintenance *in flying birds*.
          *   **Problem:** Which selective history defines *the* function? The original cause of presence (thermoregulation) or the cause of current maintenance (flight)? The traditional strict etiological view struggles to assign flight as *the* function because thermoregulation was the *original* selective cause.
      *   **Application with "Modern History":** Godfrey-Smith argues that for traits in their *current* state, the selective pressures operating over the *recent* past (e.g., the period since flight evolved) are most explanatory for why the trait is *currently maintained* and has its *current form*.
          *   In modern birds, feathers have been under intense and consistent selection *for their role in flight* for millions of years. This recent selection explains the specific aerodynamic refinements and why birds possess complex flight feathers *now*.
          *   While thermoregulation explains the *origin*, flight explains the *current maintenance and form*.
      *   **Verdict:** The **function** of feathers in modern birds is **flight**. Thermoregulation is the *exaptation* – the effect for which the trait was *originally* selected but which is not its current function. It might be a *benefit* or even a *vestigial effect*, but not the selected effect defining its current function.

  **Comparison & Ad Hoc Assessment:**

  *   **Causal-Role:** Provides a clear, consistent, and non-problematic answer: multiple functions exist relative to different capacities. It readily embraces the complexity revealed by exaptation. It avoids historical commitments entirely.
  *   **Etiological ("Modern History"):** Provides a single, privileged function (flight) by introducing a temporal weighting (recent history > ancient history). This resolves the ambiguity in the exaptation case in a way that aligns with intuitions about current utility.

  **Which is Less Ad Hoc?**

  The **Causal-Role account gives the less ad hoc verdict** in this specific case, for the following reasons:

  1.  **No Special Modification Needed:** The causal-role account handles exaptation seamlessly *within its original framework*. It doesn't require adding new principles (like privileging recent history) specifically to address a problematic case. Its inherent relativization to capacities naturally accommodates traits contributing to multiple systems. Exaptation isn't a "problem" for Cummins; it's just an illustration of how traits can play multiple causal roles.
  2.  **Simplicity & Parsimony:** Cummins's solution is conceptually simpler: function is defined by current causal contribution, full stop. No complex historical tracing or weighting of different temporal segments of history is required. The account remains focused on the present organization of the system.
  3.  **Ad Hoc Nature of "Modern History":** While Godfrey-Smith's move is clever and pragmatically useful, it *is* an *ad hoc* modification introduced primarily to rescue the etiological account from counterexamples like exaptation and vestiges. The core etiological intuition (function = what it was selected *for*) doesn't inherently specify *which* selective history counts, especially when histories conflict. The "modern history" rule provides an answer, but it feels like a pragmatic patch rather than a consequence of the core theory. *Why* privilege recent history? The answer often appeals to explaining current form/maintenance, but this subtly shifts the explanandum of the theory.
  4.  **Preserving Core Etiological Intuition?:** One could argue the "modern history" view slightly dilutes the pure etiological intuition. The strict Neander/Millikan view emphasizes the selective history that explains the trait's *presence*. The "modern history" view emphasizes the history explaining its *current form and maintenance*. While related, these are distinct explananda. The modification prioritizes one aspect of the historical explanation over another to fit the case.

  **Conclusion:**

  Both accounts provide coherent answers, but they answer fundamentally different questions:
  *   **Causal-Role:** "What does this trait *do now* within this system for capacity C?"
  *   **Etiological ("Modern History"):** "What effect explains the *recent selective maintenance* of this trait in its current form?"

  While the etiological "modern history" verdict (flight is the function) aligns well with biological practice and intuitions about current utility in birds, the *manner* in which it achieves this involves an *ad hoc* modification to handle exaptation. The causal-role account, by contrast, provides a less ad hoc, more parsimonious explanation for the *current causal contributions* of feathers (both thermoregulation and flight) without needing to adjust its core principles or wrestle with historical weighting. Its verdict isn't a single function, but that's a feature, not a bug, of its framework. Therefore, **relative to the challenge posed by exaptation, the Causal-Role account offers the less ad hoc solution.**
