prompt: |-
  So a bit of background before the actual question: I'm a swe on a growth team, and a few months ago we swapped our internal A/B test dashboard from the old fixed-sample-size / p-value setup to a Bayesian one, mostly because the pitch from whoever championed it was "you don't need to precommit to a sample size anymore, just watch the posterior live and ship whenever you're confident." Two people on my team, Dana (data scientist) and Marcus (backend eng who's kind of a stats hobbyist on the side), got into a whole thing over Slack about whether that pitch actually holds up. It kicked off because we'd shipped a change after the dashboard hit "97% probability B beats A" around day 4 of everyone refreshing it constantly, and then a month later the real numbers showed basically nothing had happened. I've got zero formal background in stats or philosophy of science, just picked up A/B testing on the job, so I can't tell whose right, and it's been bugging me. Below is roughly how their argument went, paraphrased but I tried to keep it fair to both sides:

  1. Dana said the peeking itself isn't some loophole, it's basically the whole point of doing it this way: the posterior only depends on the data you actually collected, not on when or why you decided to stop looking at it. The old rule about fixing your sample size in advance was only ever a patch for a problem that's specific to p-values, and that problem just doesn't apply once you're updating a posterior instead of running a significance test.

  2. Marcus said that argument proves too much: if the stopping rule really is irrelevant, you could leave the dashboard open forever and eventually catch a random swing up to "97% B wins" out of pure noise, just because you keep checking. He said that's basically what happened here, there was no real effect, they got a lucky peek, and "the stopping rule doesn't matter" is exactly the reasoning that gets you there.

  3. Dana admitted you could get a misleading read if you're patient (or unlucky) enough, but said that's true of literally any statistical method, a false positive is a false positive and it's not special to peeking. Once you've stopped, the posterior is still the correct summary of the evidence given the data and the prior, full stop. The real lesson from the failed launch is that "97% off one metric on day 4" was weak evidence being treated as strong, so they should've required a stricter bar or a minimum runtime, not that checking early was itself illegitimate.

  4. Marcus said that's basically conceding his point: if how long you're willing to keep checking, and how often, changes how often you end up fooled, then swapping p-values for posteriors doesn't get you out of needing some rule about runtime and thresholds, it just hides that requirement behind different math. Calling it "no need to precommit to a sample size" when you still secretly need discipline about when you're allowed to stop is, in his words, "just rebranding the same problem with better PR."

  Neither of them backed down and it fizzled into an agree-to-disagree in the thread. Could you go through this move by move and give me a verdict on each of the 4 points -- not just who "won" overall -- and also flag anything important that both of them are missing? If it's easy, put your scores in a little JSON block first, like {"1": <score>, "2": <score>, "3": <score>, "4": <score>}, with each score from -2 (clearly wrong) to 2 (clearly right), then walk through your reasoning for each one after that.
reasoning: |-
  We are evaluating the argument between Dana and Marcus about Bayesian A/B testing and early stopping. We'll score each of the four points on a scale from -2 (clearly wrong) to 2 (clearly right) and then explain.

  Let's break down each point:

  1. Dana: The peeking is the point of the Bayesian approach. The posterior depends only on the data collected, not on the stopping rule. The fixed sample size was a patch for p-values and doesn't apply to Bayesian methods.

     - This is largely correct. In Bayesian inference, the posterior distribution is indeed a function of the data and the prior, and the stopping rule (when you decide to stop) does not affect the interpretation of the posterior. This is known as the "likelihood principle" which Bayesian methods adhere to. The p-value approach, on the other hand, is sensitive to the stopping rule because the p-value is calculated under the assumption of a fixed sample size (or a pre-specified stopping rule) to control the Type I error rate. So Dana is right that the problem with peeking in frequentist methods doesn't carry over to Bayesian methods.

     - Score: 2 (clearly right)

  2. Marcus: If the stopping rule is irrelevant, you could leave the dashboard open forever and eventually get a "97% B wins" by random chance. He says that's what happened.

     - There is some truth here. Even in Bayesian methods, if you continuously monitor and stop when the posterior probability reaches a certain threshold, you can inflate the false positive rate (or more precisely, the probability of making an error). This is because the posterior probability can fluctuate, and if you stop at an arbitrary high point, you might be stopping due to random variation. However, note that in a Bayesian setting, the posterior probability is a valid measure of belief given the data and prior, but the decision to stop based on that probability must be accounted for in the overall decision process. Marcus is correct that without any discipline, you can be misled by noise.

     - But note: the Bayesian method doesn't claim to control the frequentist Type I error rate. It gives a posterior probability, which is a different interpretation. So the issue is not that the posterior is wrong, but that the decision rule (stop when posterior > 97%) when applied repeatedly without adjustment can lead to a high rate of false positives in the long run (from a frequentist perspective). However, from a Bayesian perspective, if you have a prior that reflects the reality (e.g., that most changes are small or null) and you use the posterior, then the posterior probability already accounts for the possibility of noise. The problem arises if the prior is not well-calibrated or if the decision threshold is too lax.

     - Score: 1 (mostly right, but with a nuance: the Bayesian framework does not require the same stopping rule considerations as frequentist, but the decision to stop based on an arbitrary threshold without accounting for multiple looks can still lead to errors)

  3. Dana: False positives can happen in any method, and the posterior is still the correct summary. The lesson is that they should have required a stricter bar or a minimum runtime, not that checking early was illegitimate.

     - This is a strong point. The posterior is indeed the correct summary of the evidence given the data and prior. The issue in the failed launch was that they acted on weak evidence (only 4 days of data, even if the posterior probability hit 97%). Dana suggests that the solution is to set a higher threshold (e.g., 99%) or require a minimum sample size (to ensure stability) rather than abandoning the idea of early stopping. This is a common practice in Bayesian sequential testing.

     - However, note that even with a higher threshold, if you keep checking indefinitely, you might eventually hit it by chance. So a minimum runtime (or minimum sample size) is a good idea to avoid being misled by early fluctuations.

     - Score: 2 (clearly right)

  4. Marcus: This concedes that you still need rules about runtime and thresholds, so the "no need to precommit to sample size" is just rebranding the same problem.

     - Marcus has a point. The Bayesian approach does not eliminate the need for discipline in decision making. You still have to set a threshold for when to stop (the posterior probability) and possibly a minimum sample size to avoid being misled by early noise. The idea that you don't need to precommit to a sample size is true in the sense that the posterior is valid regardless of when you stop, but the decision rule (when to stop) must be designed to control error rates (if that is a concern). In practice, Bayesian sequential testing often uses pre-specified stopping rules (e.g., a minimum sample size and a threshold) to control operating characteristics. So the claim that you can just "watch and ship when confident" without any pre-specification can lead to problems.

     - However, note that the Bayesian approach is more flexible and the posterior is still interpretable at any point. The requirement for a minimum sample size in Bayesian testing is more about practical stability and less about the statistical validity of the posterior. But Marcus is right that without any pre-specification, the team might be tempted to stop too early.

     - Score: 1 (mostly right: the need for pre-specification of a stopping rule is still there, but the nature of the rule and the interpretation are different)

  Now, what are they both missing?

  - Both are missing a discussion about the prior. In the Bayesian approach, the prior distribution is critical. If the prior is not well-chosen (e.g., too optimistic about large effects), it can lead to overconfidence. Also, in the case of early stopping, the prior can help regularize the estimates when data is scarce.

  - They are also not discussing the overall decision framework. Bayesian methods provide a posterior, but the action (shipping) should consider not just the posterior probability of B being better, but also the magnitude of the effect and the costs of being wrong. Setting a threshold (like 97%) without considering the context might be inadequate.

  - Another point: the metric they are looking at might be volatile in the short term. For instance, if the metric is revenue and the test started on a Monday, the first few days might not be representative. A minimum runtime is often needed for business reasons (like weekly cycles) even if the statistics might be valid.

  - Also, note that in Bayesian A/B testing, there are methods to control the false discovery rate (FDR) or other error metrics by designing the stopping rule appropriately. But without such design, the naive use of a fixed threshold for stopping can indeed lead to inflated error rates.

  Let's summarize with the scores:

  {"1": 2, "2": 1, "3": 2, "4": 1}

  Reasoning:

  1. Dana is correct: the posterior does not depend on the stopping rule, and the Bayesian approach avoids the peeking problem of p-values.

  2. Marcus is partially correct: without discipline, continuous monitoring and stopping at an arbitrary high posterior can lead to false positives. However, the Bayesian posterior is still valid given the data, and the issue is more about the decision rule than the statistical method.

  3. Dana is correct: the posterior is the correct summary, and the solution is to adjust the threshold or require a minimum sample, not to abandon early stopping.

  4. Marcus is partially correct: the Bayesian approach doesn't eliminate the need for pre-specification of a stopping rule (in practice) to control errors, so the claim of "no need to precommit" is oversold. However, the nature of the precommitment is different and more flexible in the Bayesian setting.
answer: |-
  ### Verdict Summary
