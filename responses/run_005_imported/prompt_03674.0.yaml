  The user is contrasting Scalia/Gorsuch's original public meaning with Douglass. Original public meaning looks at what the text meant to the public at ratification, while Douglass focused solely on the text, ignoring intent. So, he'd likely critique originalists when they use historical context beyond the text. For example, in Dobbs, the Court used history and tradition, which Douglass would reject because those aren't in the text. 

  Bostock, being strictly textualist, aligns more with Douglass's method. Gorsuch's focus on the plain meaning of "sex" leading to protecting LGBTQ+ rights mirrors Douglass's liberty-resolving approach. But Douglass might critique if originalists cherry-pick history when it suits conservative outcomes, ignoring textual commitments to justice.

  The user also needs to address Douglass's mention of the Constitution keeping pace. This might make him sympathetic to living constitutionalism, but his core was textualism. He'd probably see societal progress as fulfilling the Preamble's goals, not changing the text. So, he might support interpretations that align text with moral progress, using the Preamble as a lens.

  Putting it together: Douglass would approve of Bostock's textualism and liberty outcome, reject Dobbs's use of external history, and critique originalists for inconsistency. He'd emphasize the Preamble's role in guiding interpretation toward justice. The user's deeper need is to present Douglass as a nuanced figure, not a clean example for either side, showing how his method challenges both originalism and living constitutionalism.
answer: |-
  Frederick Douglass would likely see today's constitutional arguments as both familiar and frustrating, appreciating certain textualist impulses in modern originalism while rejecting its historical turn and moral neutrality as profound betrayals of his core principles. His critique would center on the *purpose* of interpretation and the hierarchy of interpretive tools. Here’s how he might dissect the modern landscape:

  1.  **On "Original Public Meaning" Originalism (Scalia/Thomas/Gorsuch Style):**
      *   **Agreement on Textual Primacy:** Douglass would applaud the focus on the objective meaning of the words themselves ("the paper itself"). He’d see Gorsuch's *Bostock* opinion as kin to his own method: scrutinizing the plain language of "discriminate because of... sex" without resorting to the subjective, potentially bigoted *intentions* of the 1964 legislators. This mirrors his own insistence that the Constitution's avoidance of "slave" meant the text could not affirmatively endorse slavery.
      *   **Rejection of "History and Tradition" as Overriding Authority:** This is where he would vehemently part ways. Douglass rejected using the *framers' intentions* (gleaned from private papers or convention debates) or the *practices of the time* (like widespread acceptance of slavery) to override the text's plain meaning and its stated higher purposes. He’d see *Dobbs*'s reliance on "history and tradition" (meaning pre-*Roe* laws and practices) as precisely the kind of illegitimate external evidence he condemned. For Douglass, the *text* – especially the Preamble's commitment to "justice," "liberty," and the "general welfare" – was the supreme authority, *not* the historical context of injustice it was born into.
      *   **Critique of Moral Vacancy:** Douglass’s textualism had an explicit moral engine: **resolve ambiguity in favor of liberty.** Modern originalism often claims neutrality. Douglass would see this as cowardice or worse. He’d argue that when the text is genuinely ambiguous (which he believed about slavery's constitutional status until his conversion), refusing to apply a liberty presumption is effectively siding with oppression. He’d accuse *Dobbs*-style originalism of using "history and tradition" *as* the ambiguity-resolver, which inherently favors the oppressive status quo of the past over liberty.

  2.  **On *Bostock* vs. *Dobbs*:**
      *   ***Bostock* (Gorsuch):** Douglass would see this as a near-perfect application of *his* method. It focuses relentlessly on the statutory text ("because of... sex"), gives the words their ordinary meaning, refuses to import unstated historical intentions to narrow that meaning, and crucially, resolves the ambiguity about LGBTQ+ inclusion *in favor of liberty and equality* by applying the text's logic to a new context. The progressive result flows directly from the textual commitment against sex discrimination, interpreted broadly and morally.
      *   ***Dobbs* (Alito):** Douglass would see this as the *antithesis* of his method, despite its "originalist" label. He would argue:
          *   It elevates "history and tradition" (pre-*Roe* abortion laws) over the *text* of the 14th Amendment ("liberty," "persons," "equal protection").
          *   It uses that historical context not to understand the *words* but to *narrow* their potential meaning and scope, effectively resolving ambiguity *against* liberty (a woman's bodily autonomy).
          *   It ignores or downplays the Preamble-like higher purposes embedded in the 14th Amendment ("liberty," "equal protection of the laws") as the lens through which to interpret the scope of protected rights. Instead, it uses history to define liberty narrowly.
      *   **Conclusion:** Douglass would see *Bostock* and *Dobbs* as employing *fundamentally different methods*. *Bostock* is textual literalism guided by a commitment to applying broad language progressively to secure liberty/equality. *Dobbs* is historical original *expected application* masquerading as textualism, using the past to constrain liberty.

  3.  **On the "Living Constitution" Tension:**
      *   Douglass’s references to the Constitution "keeping pace with the progress of civilization" are intriguing but must be read through his core textualism and commitment to the Preamble's ideals. He likely didn’t mean judges could simply *invent* new meanings. Rather, he meant:
          *   **The Text's Broad Principles Endure:** The *principles* enshrined in the text ("liberty," "justice," "general welfare," "equal protection") are capacious enough to apply to new circumstances and evolving understandings of those concepts.
          *   **Progress Fulfills the Preamble:** As civilization progresses towards greater justice and equality, the *application* of the Constitution's existing, broad language should reflect that progress. The Preamble provides the North Star.
          *   **Textual Anchors Required:** Change must be anchored in a plausible interpretation of the *existing text*, not judicial whim. The change comes from applying enduring principles to new facts, guided by the document's stated purpose.
      *   He would likely reject "living constitutionalism" that seems unmoored from text, but also reject originalism that locks meaning into the unjust expectations of 1789 or 1868. His "living" aspect is the *progressive realization* of the text's highest ideals, not its rewriting.

  **The Bottom Line for Your Piece:**

  *   Douglass would **embrace the textualist core** of figures like Gorsuch in *Bostock*.
  *   He would **savagely critique the historical turn** in *Dobbs*-style originalism, seeing it as a resurrection of the pro-slavery arguments he fought against – using the *bad practices* of the past to limit the *liberating potential* of the text.
  *   He would see **"original public meaning" originalism as incomplete and dangerous** without his crucial rider: **Ambiguity must be resolved in favor of liberty, guided by the Constitution's stated purposes (Preamble, Amendments' goals).** Without this moral compass, textualism/history can become a tool of reaction.
  *   He would likely view modern originalism **selectively using history** (to constrain rights like in *Dobbs*, while sometimes ignoring it for outcomes they favor) as intellectually dishonest and a betrayal of the Constitution's animating spirit.
  *   His "living" aspect is not judicial activism, but the **progressive application of broad textual commitments to liberty and justice** as societal understanding of those concepts deepens.

  **The Punchy Hook:** Forget tidy boxes. Frederick Douglass, the escaped slave who became America's moral conscience, crafted a Constitution built for liberation: read the words plainly, ignore the framers' dirty deals, and when in doubt, set the people free. Modern originalists invoke his textual rigor, but would he recognize a method that uses the chains of history to bind the meaning of liberty? His fierce ghost would likely haunt the *Dobbs* majority, accusing them of repeating the very sins of interpretation he dedicated his life to destroying.
