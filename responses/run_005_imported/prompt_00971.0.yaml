  Let me unpack the core challenge: Fitting-attitude theory says admiration is fitting when the object deserves it. Wrong-kind-of-reasons arise when external factors (like threats) make admiration prudent but not fitting. The twist here is to blur that line using psychological realism. 

  *Brainstorming*... What if the rival weaponizes the protagonist's own virtue? Like exploiting their loyalty to a third party? Loyalty is both a motive (state-given) and a value (object-given)—that duality could cause confusion. 

