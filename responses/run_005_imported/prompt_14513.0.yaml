  The deeper lesson is about the structure of constraints. Conditional constraints fix likelihoods within a subset, leaving other probabilities to adjust. In Judy's case, fixing P(Second|Red) doesn't fix P(Red), so cross-entropy minimization adjusts P(Red) to minimize overall change. This reveals that "minimal change" isn't always intuitive, especially when information seems silent on a variable.

