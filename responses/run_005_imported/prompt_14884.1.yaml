  First, I need to recall both theorems. Arrow's theorem says no ranked voting system can meet all fairness criteria without being a dictatorship, with IIA being a key condition. Gibbard-Satterthwaite, on the other hand, states that any voting system with more than two options is either dictatorial or manipulable (i.e., tactical voting is possible). The user thinks that since Borda violates IIA, it might escape Gibbard-Satterthwaite's manipulability.

