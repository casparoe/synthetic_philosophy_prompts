prompt: |-
  I sit on a graduate fellowship committee that ranks applicants using evidence that's rarely certain: a reference letter we read as probably warm but formulaic, an originality checker that flags a writing sample as suspicious but inconclusive, and an interviewer's sense that a candidate likely oversold their role on a project. As a check, two reviewers redid the scoring for a handful of already-completed files in exactly reversed order and reached noticeably different final confidence in the same candidates, despite agreeing about what each piece of evidence shows on its own. Half the committee wants to just average the two orderings and move on; the other half thinks the order-sensitivity itself disqualifies the scores until it's fixed. Draft the short procedural memo I'll bring to next week's meeting: recommend how we should combine this kind of graded, uncertain evidence going forward, and give a fair hearing to whichever side of the dispute you don't take.
reasoning: |-
  Okay, the user is on a graduate fellowship committee facing a tough issue. They need a procedural memo for their next meeting about how to handle order-sensitive scoring when evaluating applicants. The committee is split: half want to average the scores, half think the method is invalid until fixed. 

  Hmm, this is a classic decision-making problem under uncertainty. The core issue isn't just about averaging numbers - it's about whether the scoring process itself is robust enough to trust. The user mentioned examples like ambiguous reference letters and inconclusive originality checks, which shows they're dealing with highly subjective evidence. 

  The reversed-order experiment revealing different outcomes is a huge red flag. It suggests cognitive biases - maybe primacy/recency effects or anchoring - are influencing reviewers more than the evidence itself. That undermines the whole evaluation's integrity. 

  For the memo... Need to validate both viewpoints first. The "average it" side isn't wrong pragmatically - deadlines loom, and all assessments have some noise. But the "fix it" side has science on their side; cognitive psychology studies consistently show order effects distort sequential judgments. 

  The solution should accomplish three things: (1) immediately reduce order-dependency in current cycle, (2) gather data to diagnose why it's happening, and (3) commit to structural fixes later. Independent simultaneous review would cut order effects dramatically while being feasible to implement now. 

  Ah - and crucial to frame this neutrally. The memo can't sound like either side "won." Emphasize shared goals: fairness and accuracy. The experiment actually helped them catch a problem others miss! 

  ...Better include concrete next steps. Workshops on cognitive biases? Calibration exercises? Those can wait post-deadline, but naming them shows this isn't just patching a hole - it's professionalizing their process.
answer: |-
  **To:** Graduate Fellowship Committee  
  **From:** [Your Name], Committee Member  
  **Date:** [Current Date]  
  **Subject:** Procedural Recommendation: Handling Order-Sensitivity in Applicant Scoring  

  ### Background  
  Recent checks revealed that reversing the order of evidence review (e.g., reference letter → writing sample → interview notes vs. the reverse) yields meaningfully different final confidence scores for identical candidates, despite consensus on individual evidence interpretations. This order-sensitivity risks undermining score validity. The committee is divided between averaging divergent scores (expediency) and pausing scores until resolved (rigor).  

  ### Recommendation: Adopt Structured Simultaneous Review  
  I propose we **immediately implement a hybrid approach for the current cycle**, balancing urgency with improved reliability:  

  1. **Short-Term Fix (Current Cycle):**  
     - **Independent Simultaneous Review:** Reviewers assess all evidence for a candidate *independently and in one session*, scoring each piece *before* assigning a final confidence score.  
     - **Structured Deliberation:** If scores diverge >15%, reviewers discuss *only the evidence* (not initial scores) to reach consensus. If unresolved, a third reviewer breaks ties.  
     - *Rationale:* Eliminates sequential bias while respecting deadlines. Reduces cognitive anchoring.  

  2. **Medium-Term Fix (Post-Cycle):**  
     - **Diagnostic Workshop:** Test scoring methods (e.g., multi-attribute utility models, checklists) on past files to identify/quantify bias sources.  
     - **Calibration Training:** Annual bias-awareness sessions (e.g., primacy/recency effects, ambiguity aversion).  

  ### Fair Hearing of Divergent Views  
  **For Averaging Scores:**  
  Averaging is pragmatic under time constraints and acknowledges that all assessments carry noise. It avoids paralysis and leverages the "wisdom of the crowd" where individual errors may cancel out. For low-stakes margins, it is a statistically valid shortcut.  

  **For Disqualifying Scores:**  
  Order-dependence signals systemic unreliability, not random noise. Averaging conflates distinct judgments rooted in flawed processes, potentially amplifying errors. Fixing the method preserves fairness and the committee’s credibility, especially when evidence is ambiguous.  

  ### Next Steps  
  1. Vote to adopt **Independent Simultaneous Review** for all remaining applicants.  
  2. Allocate 30 minutes at our next meeting to refine the structured deliberation protocol.  
  3. Schedule a post-deadline workshop to audit our scoring framework.  

  This approach addresses immediate concerns while committing to evidence-based process repair. I urge unity in prioritizing both timely decisions and methodological integrity.  

  ---  
  **Approved by:** [Your Name]  
  **Feedback Requested By:** [Date of Meeting]
