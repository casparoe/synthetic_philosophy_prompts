answer: |-
  ## Dialogue: The Undermining Problem at Dawn

  **Setting:** A philosophy conference at dawn. Two figures stand by large windows overlooking a misty campus. **HUMEA** (Humean Supervenientist) sips black coffee. **PRIMUS** (Primitivist about Chance) taps a pen thoughtfully.

  **HUMEA:** ...so you see, Primus, the New Principle *is* the principled repair. We simply refine deference: `Cr(A | HT) = Ch(A | T)`, where H is the complete admissible historical evidence *up to now*, and T is the complete theory of chance for the world. This directly blocks undermining futures. If T says the chance of heads *now* is 0.5, but also entails that a future undermining sequence *must* occur, then `Ch(Heads | T)` *already factors that in*. My credence in heads, conditional on knowing H and T, *is* 0.5. No contradiction. Deference is saved.

  **PRIMUS:** Saved? Or relocated? Humea, you’ve swapped one problem for two. First, *access*: How does an agent *ever* know T? T is the complete *Humean* chance theory – it supervenes on the *entire* mosaic, past *and future*. To condition on T, an agent needs a credence about the *complete* chance-law of the universe! Before tossing this coin, I need credences not just about its bias, but about the *global pattern* that determines what the bias *means* in your ontology. How is this different from needing views about the entire future? Second, *bootstrapping*: How do we *learn* T? We infer chances from frequencies, but under the New Principle, our credence in frequencies depends on credences in T! It feels circular.

  **HUMEA:** Hold on. T isn't some mystical future knowledge. T is a proposition *about the world's pattern*. We *learn* it inductively, just like any law! We see local frequencies, we see spatiotemporal symmetries, we posit a best-system analysis – the system that best balances simplicity and fit. Our credence in T *develops* as evidence accumulates. We start with priors over possible Ts – possible global patterns. As we observe H (local history), we update our credence in T. *Then*, conditional on our best T-candidate, we set `Cr(A) = Ch(A | T)`. We don't need *certainty* about T *now* to have well-defined credences *now*. We use our *current best estimate* of T.

  **PRIMUS:** But that "best estimate" of T depends entirely on the *past* H you've observed so far, right? Under Humeanism, T supervenes on the whole mosaic. Observing only the past is like seeing half a tapestry and trying to deduce the *whole* pattern that determines what the thread-count *means*. A future event could radically alter what the best-system is! Your "current best T" might be catastrophically wrong about what the *actual* global T is. More crucially: What justifies deferring to `Ch(A | T)` *even if I knew T for certain*? Why should I align my *credence* with this mathematical object defined by a global pattern? On my view, I defer to chance because it's a *fundamental dynamical constraint* – it tells me how the world *pushes forward*. Your `Ch(. | T)` is just a *description* of a static pattern. Why should my beliefs about the *next event* be hostage to a description of the *entire universe*?

  **HUMEA:** Ah, the functionalist challenge! Why defer? Precisely *because* it’s the best description of the pattern! That pattern *is* what guides rational expectation. If the pattern in the mosaic up to time t, plus the best-system T, says the chance of A at t is x, then *expecting A with degree x is what has worked best for agents embedded in similar patterns*. It’s the optimal guide for navigating a world governed by those Humean patterns. Your "dynamical constraint" – what *is* it, Primus? A metaphysical ghost in the machine? How does this "propensity" *actually connect* to the single-case outcome in a way that justifies my credence, other than by implying patterns I could, in principle, observe? If it doesn't imply patterns, how is it different from arbitrary mysticism?

  **PRIMUS:** It connects because it's *causal* (or pseudo-causal) in nature! The chance *is* the objective weight that the world's fundamental dynamics gives to a future possibility *right now*. It's not *defined* by the future; it *constrains* the future. That's why I can know the chance *now* based solely on the present state and the fundamental laws – laws that are brute, but *temporally local* in their operation. I don't *need* the future mosaic to tell me what the chance *was*. The chance *was* what the fundamental dynamics determined it to be at that time, based *only* on prior states and the laws. My credence defers to that objective weight because it's the *direct* measure of real possibility inherent in the world's unfolding. Your deference is to a complex, global summary statistic. Mine is to the immediate causal ground.

  **HUMEA:** But Primus, doesn't your "brute propensity" face its own grounding problem? *Why* should my internal credence state align with this external, unobservable "weight"? You haven't explained the *normative link*. My story provides one: alignment with the optimal summary of the world's pattern is what makes credences *calibrated* and agents *successful*. Your story just asserts a mysterious normative force for this brute fact. Furthermore, what about *undermining futures* on *your* view? If chance is primitive and fundamental, a future undermining sequence isn't a problem for *what the past chance was* – the past chance was fixed by the past state and laws. The future just happens to violate the high probability the past chance assigned to it. That's surprising, but not paradoxical. The Principal Principle `Cr(A | Ch(A)=x & E) = x` holds smoothly because E (admissible evidence) only includes history *up to the chance event*, not the undermining future. No New Principle needed! My point is: *your* solution to undermining is trivial, but it rests on an unexplained primitive. *My* solution (the New Principle) is complex, but it explains *why* we should defer – it grounds chance in the world's observable structure.

  **PRIMUS:** You call it trivial; I call it elegant. The normative link for me is axiomatic: rational credence *just is* subjective probability calibrated to objective probability, conceived as a fundamental feature of indeterministic dynamics. It needs no further reduction. But let's press your complexity. You say agents use their "best estimate" of T. Consider an agent *right now*, contemplating a fair coin toss. Under the New Principle, their credence in heads isn't simply 0.5. It's `Sum_over_T [ Cr(T | H) * Ch(Heads | T) ]`. To compute this, they need:
  1. A prior over *all possible global chance-theories T* (massively complex).
  2. `Ch(Heads | T)` for each T – which requires understanding how each T analyzes *this specific toss* within the global mosaic it describes.
  3. Constant updating of Cr(T) as H grows, which involves reassessing the *entire global fit* of each T with every new bit of local evidence.
  This is computationally intractable and epistemically top-heavy! Whereas I just consult the local dynamical law: Ch(Heads) = 0.5. Done. My credence is 0.5. The undermining problem highlights that your Humean chance *isn't* local. The New Principle papers over this by making deference conditional on the *global* theory T, but the cost is that agents can never have the simple, local, actionable chance guidance that the original Principal Principle promised and that my primitivism delivers straightforwardly. You've sacrificed the very thing we wanted chance *for*.

  **HUMEA:** It’s a cost, I concede, but a manageable one in principle. We use approximations! We have good reason to think the *local* chance, derived from our best *current* estimate of T (which is informed by vast amounts of past evidence of stability), is *very likely* close to the true `Ch(A | T)`. We act *as if* the local chance is 0.5 because our best T-candidate says it is, and we have high credence in that T-candidate being approximately correct *locally*. It’s not magic, it’s sophisticated induction. Your "straightforward" guidance relies on positing an irreducible metaphysical mystery – a propensity. What *evidence* could ever distinguish your world with brute propensities from my world with complex global patterns? If they produce the same frequencies (which they must, for chance to be empirically meaningful), they’re observationally equivalent. My account is more parsimonious – it doesn’t add irreducible modal facts.

  **PRIMUS:** Observational equivalence cuts both ways, Humea. If the accounts are empirically equivalent, why prefer the one that makes rational belief so computationally fraught and vulnerable to future knowledge? Parsimony? I find your global supervenience base – the entire mosaic – plus the best-system analysis far more complex and mysterious than a simple fundamental dynamical law with an objective chance parameter. My propensity is a single, well-defined ontological posit. Your "best-system" is a vague, pragmatic, mind-dependent selection from a near-infinite configuration space. Where’s *your* objectivity? Ultimately, the undermining problem proves that Humean chances *cannot* play the *functional role* required by the original Principal Principle – that of an *immediate, local* guide to credence based solely on the past. The New Principle changes the role. It makes chance essentially a *theoretical construct* used within a global worldview, not a direct input to belief. You’ve changed the subject.

  **HUMEA:** And you rely on a posit that explains nothing *beyond* the patterns. But let's not circle. What would actually change your mind, Primus? What would make you accept Humean supervenience as the ground for chance?

  **PRIMUS:** A clear, functionalist account of why rational agents *must* set their credences equal to Humean chances *that doesn't require prior knowledge or credences about the entire future mosaic or the complete chance-theory T*. If you could show that deference to `Ch(A)` (the simple, unconditional chance) *as defined by the best-system at the time of A*, based *only* on history up to that time, is rationally compelling *without* leading to contradiction via undermining, that would shake me. The New Principle feels like an admission you can't do this. Your turn. What would make *you* accept primitive chance?

  **HUMEA:** Show me that the concept of a "brute, single-case propensity" has clear, non-circular *explanatory power* that the Humean pattern account lacks. Demonstrate how it *improves* our scientific understanding of specific phenomena (like quantum indeterminacy or evolutionary drift) in a way that isn't just relabeling the observed statistics. Prove that it provides a *better* or *indispensable* normative foundation for rational credence, perhaps by showing agents using propensity-guided credences systematically outperform those using Humean-guided credences in a well-defined epistemic dilemma *without* smuggling in global pattern knowledge. If brute propensity earns its keep as a fundamental posit, I’d reconsider.

  **(They both look out at the brightening sky, the mist thinning but not yet gone. The unresolved tension hangs in the air, as fundamental as the dawn.)**

  ---

  **Key Points Illustrated:**
  1.  **Humean's Defense (HUMEA):** The New Principle solves the contradiction by conditioning on the complete chance-theory T, making `Ch(A | T)` robust against undermining. Chance is justified functionally as the optimal summary of the world's pattern for guiding expectation. Access to T is via induction/approximation.
  2.  **Primitivist's Attack (PRIMUS):** Conditioning on T requires impossible global knowledge and makes chance guidance computationally intractable and non-local. The New Principle abandons the core function of chance. Primitivism provides simple, local guidance grounded in fundamental dynamics. Humeanism fails to justify *why* we should defer to a pattern summary.
  3.  **Humean's Challenge:** What justifies deference to a brute propensity? How is it different from mysticism? Primitivism adds an unexplained primitive without clear explanatory gain over the parsimonious pattern account.
  4.  **Primitivist's Challenge:** The New Principle makes chance a theoretical construct dependent on global views, not a direct input to belief. It sacrifices the local, actionable guidance promised by the original Principal Principle.
  5.  **Mind-Changers:** Primitivist needs a functionalist justification for Humean chance *without* global conditioning. Humean needs clear explanatory/normative superiority for brute propensities over patterns.
