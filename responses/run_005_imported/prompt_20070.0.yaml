  Here’s a draft that threads the needle—grounded in her philosophy while honoring her humanity. It runs about 7-8 minutes when spoken slowly, with pauses. Adjust any personal details as needed:

  ---

  ### Eulogy for Frankie  
  **By [Your Name]**  

  Good morning. I’m [Your Name], Frankie’s niece/nephew. Many of you knew her as a philosopher, a teacher, or a relentless force for good. I knew her as the aunt who taught me to curse in Greek, who mailed me obscure novels with margin notes like “Page 63—proof this author has never felt real despair!”, and who once showed up at my apartment at 3 a.m. with a toolkit when my sink exploded—not because I asked, but because, as she put it, “plumbing disasters wait for no one.”  

  Frankie lived with a clarity that could be almost unnerving. For nearly 40 years, she argued—passionately, precisely—that morality doesn’t give us extra credit. There’s no “above and beyond,” no separate category for the spectacularly good deed. If something *can* be done to relieve suffering, to protect dignity, to save a life—and it’s the best thing within our power to do—then it’s not optional. It’s required. She’d quote her colleague Shelly Kagan: *Morality doesn’t always give us a choice*.  

  **Now, if you’re sitting there thinking, “That sounds… intense”—well, you’re not wrong.** It’s the kind of idea that could feel abstract in a seminar room. But Frankie didn’t treat it as abstract. She treated it as a blueprint for being human.  

  That kidney she gave to a stranger? To her, it wasn’t a grand gesture. It was just… what you do when you have two kidneys and someone else has none.  
  Those nine foster kids who found refuge in her home? Not charity. Just the necessary response to a child needing safety.  
  That flight to the disaster zone while the rest of us were still staring at our phones? Not heroism. Just the obvious first step when people are hurting and you have hands that can help.  

  **This wasn’t humility, exactly.** Frankie wasn’t humble about her beliefs. She was *impatient* with anything less. She’d rage against what she called “the fairy tale of supererogation”—the idea that we can pat ourselves on the back for basic decency while calling the truly vital acts “exceptional.” To her, that was a cop-out. A way to dim morality’s glare to a more comfortable wattage.  

  **Remember that newspaper profile that called her “a modern-day saint”?** She read that phrase aloud at dinner like it was a medical diagnosis for a terminal disease. “*Saint*,” she spat. “As if decency is divine. As if feeding the hungry is miraculous. It’s just *work*! Necessary work!” We all got a lecture on the technical history of sainthood that night. (And yes, we still teased her for framing the article afterward.)  

  **But here’s what matters:** However fierce her arguments, Frankie’s life was never about scolding. It was about *showing*. Showing that what looks impossible to most of us—giving an organ, opening your home endlessly, sprinting toward pain—isn’t magic. It’s just what happens when you refuse to see suffering as someone else’s problem. When you don’t grant yourself the luxury of thinking “Someone else will handle it.”  

  **To her students and colleagues here today:** You’ll recognize this as her relentless rejection of moral loopholes. She wouldn’t let us off the hook philosophically, because she refused to let anyone off the hook *humanly*.  

  **To her family and friends:** You saw the lived reality. You know the sound of her key turning in your lock when you were sick. You know the weight of the bags she’d haul up your stairs—groceries, books, spare parts for that thing you mentioned once was broken. You know she showed up. Every time. Not because she was “going beyond,” but because to her, *not* showing up was unthinkable.  

  **That’s her real legacy—not the argument, but the act.** Frankie didn’t believe in “saints.” She believed in *showing up*. In treating necessity not as a burden, but as the deepest truth: We are here for each other. When we see the chance to bind a wound, share our bread, or make space at the table—that’s not optional. It’s the job.  

  **She’d hate me saying this was “inspirational.”** She’d call that sentimentality. So I’ll say it plainly: She lived what she knew. No asterisks, no special categories. Just a life where duty wasn’t a boundary, but an expanse.  

  We’ll miss her fury. Her clarity. Her terrible, wonderful refusal to call love anything but what it is:  
  Non-negotiable.  

  Thank you, Frankie. For showing us how much further the world stretches when we stop calling the necessary things “extra.”  

  ---

  ### Key strategies used:
  1. **Reframed "above and beyond" as "necessity"**: Uses her own language ("necessary work," "non-negotiable") to satisfy scholars without betraying her stance.  
  2. **Anchored philosophy in stories**: The kidney, foster kids, and disaster responses illustrate her *actions* without labeling them philosophically.  
  3. **Used her own voice**: Quotes her rants ("plumbing disasters wait for no one," "it's just work!") to humanize the theory.  
  4. **Addressed the "saint" irony**: The newspaper anecdote lets her reject the label *herself* posthumously.  
  5. **Separated "comfort" from "complacency"**: Comforts mourners by focusing on her love/loyalty, while her philosophy becomes about *her* rigor, not judging others.  
  6. **Avoided universal prescriptions**: "She believed..." keeps it about *her* standards, not a verdict on the audience.  

  **Delivery tip:** Pause after "She’d hate me saying this was 'inspirational.'" Let the irony land. Then smile slightly as you say, "So I’ll say it plainly..." It bridges the warmth and the steel she embodied.  

  This should satisfy both camps: scholars hear her rigorous view honored; loved ones hear her generosity celebrated. Condolences on your loss—she sounds utterly unforgettable.
