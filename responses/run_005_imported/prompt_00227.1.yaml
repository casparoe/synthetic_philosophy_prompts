answer: |-
  What a brilliantly twisted character concept – Sartre would have *despised* him (while finding him fascinating). Here's how his framework likely applies to influencer culture and your character's existential crisis:

  1.  **Bad Faith on Algorithmic Overdrive:** This is absolutely core. Sartre saw "bad faith" (*mauvaise foi*) as the fundamental act of denying one's radical freedom and responsibility by pretending to *be* a fixed thing. Your character isn't just playing a role occasionally; he's *invested* in his Instagram persona as his "authentic self." He treats this curated, audience-pleasing, algorithm-optimized projection *as if it were his fixed essence*. He's not just *acting* like an "authentic adventurer/thinker/aesthetician"; he *believes* that's what he *is*, thereby denying the freedom to be anything else (or nothing at all) offline. The algorithm reinforces this by rewarding the performance, making the "self-as-object" feel validated and "real."

  2.  **The Objectifying Gaze Gone Viral:** Sartre's famous concept of "The Look" (*Le Regard*) is crucial. When another person looks at us, we experience ourselves as an *object* in their world, momentarily losing our subjective freedom. Your character *constantly lives under The Look* – not of one person, but of thousands, mediated and amplified by the platform. His entire existence becomes a *reaction* to this anticipated gaze. He crafts his "authenticity" *for* the audience, making his "self" a product *defined by the perception of others*. He becomes the ultimate object – a branded commodity.

  3.  **The Impossibility of "Authentic" Performance:** Sartre argued authenticity involves owning your freedom and choices *without excuses*. Staging "authenticity" is a profound contradiction. It's choosing to *perform* spontaneity, to *manufacture* rawness. Your character isn't *being* authentic; he's *performing* "authenticity™" according to marketable tropes dictated by platform trends and audience expectations. The algorithm dictates what "authentic" *looks like*, and he conforms. This is the *antithesis* of Sartrean authenticity, which requires confronting the terrifying void of freedom, not filling it with curated content.

  4.  **Freedom Abdicated to the Feed:** Sartre's freedom is burdensome because it demands constant choice and responsibility. Your character has outsourced this burden. His choices are dictated by:
      *   **The Algorithm:** What will get seen? What formats work? What trends must be followed?
      *   **The Audience:** What do they expect? What will they like? What persona do they validate?
      *   **The Brand:** Maintaining consistency, hitting KPIs (likes, follows, engagement), fulfilling sponsorships.
      His "curated self" becomes a prison, shielding him from the responsibility of defining himself *outside* these external pressures. The offline "leftover" feels unreal because it's the only space where he hasn't pre-defined himself for consumption.

  5.  **"I Post, Therefore I Am" (The Cartesian Nightmare):** Sartre rejected Descartes' "I think, therefore I am." For Sartre, existence precedes essence – we *are* first, then we define ourselves through action. Your character embodies a horrific digital inversion: "I am seen (online), therefore I exist." His *being* is contingent on the validation of the feed and the audience. The offline self withers because it lacks this external confirmation of existence. His essence is *entirely* defined by the curated digital output, created *for* the purpose of being consumed.

  **Where Sartre's Framework Might Strain (or Intensify):**

  *   **The Audience as Abstract Algorithm:** Sartre focused on the concrete "Other." The influencer faces an abstract, aggregated, algorithmically mediated "Other." This might make the objectification feel less personal but more pervasive and inescapable. It's a *system* defining him, not just individuals.
  *   **The Dopamine Feedback Loop:** Sartre didn't account for the neuroscientific hooks. The constant validation (likes, comments, shares) provides a biochemical reward for the bad faith performance, making it incredibly addictive and hard to escape, further trapping the individual.
  *   **The Performance *Is* the Reality?** This is your character's tragic twist. For him, the online persona *has become* his primary reality. Sartre would argue this is the pinnacle of bad faith – the complete substitution of the constructed object for the free subject. It's not that the framework breaks; it's that the character is *utterly lost* within it. The "authentic self" he presents isn't just a mask; it's a mask he's superglued to his face and mistaken for his skull.

  **Sartre's Likely Take:**

  He would see influencer culture, particularly cases like your character, as a terrifyingly efficient machine for mass-producing bad faith. It systematizes the denial of freedom, commodifies the self, and turns existence into a performance for an algorithmically curated audience. The "authenticity" marketed is the ultimate lie, hiding the profound inauthenticity of living entirely through the gaze and validation of others. He would likely view it as a profound spiritual sickness of the modern age, a way to flee the anxiety of true freedom by becoming a branded object in the digital marketplace.

  **For Your Character:** He's not just in bad faith; he's drowning in it. The tragedy is his *belief* in the authenticity of his performance. The offline "leftover" feels unreal precisely because it's the only part *not* yet fully sacrificed to the algorithm. Exploring his moments of doubt, the glitches in the performance, or the terrifying void he feels when offline (the Sartrean "nausea" of unfiltered existence) could be powerful. He's built his identity on quicksand designed by Silicon Valley, mistaking the sinking feeling for solid ground. That's pure, uncut Sartrean horror – perfect for a compelling character. Good luck!
