  Here’s a short story capturing the insidious slide into Parfit’s Repugnant Conclusion, focusing on the chain of locally reasonable decisions:

  **Asteria's Equation**

  Lyra stood on the observation deck of *Asteria*, gazing not at the stars, but inward. Below, five hundred souls lived in crystalline splendor. Gardens bloomed under artificial suns, knowledge flowed freely, and every face held the quiet glow of profound fulfillment. This was her life's work: a perfect, sustainable balance. Happiness wasn't just pursued; it was the bedrock. "Quality," Lyra murmured, "is everything."

  ***Generation 1: The First Concession***

  Lyra’s successor, Aris, faced the transmission. Images flickered: the scarred hull of the *Long Hope*, survivors pleading. Two hundred souls, their own habitat destroyed. "Their lives are *good*," the comms officer insisted. "Just... less secure than ours. But worth living! We have margin."

  Aris wrestled. Adding them *would* strain resources. Rations would tighten slightly, personal space decrease, the frequency of deep-art experiences lessen. Not to misery, but from Lyra’s transcendent "radiant" to a solid, warm "good." *Denying them refuge condemns them,* Aris reasoned. *And good lives added are still a net gain.* The airlock cycled open. Asteria hummed, fuller, a little dimmer, but laughter still echoed. A necessary, compassionate adjustment.

  ***Generation 5: The Redistribution***

  Thorne, Aris's great-grandson, studied the resource matrices. Population: 10,000. The "good" life was stable, but pressure mounted. Birth rates were carefully managed, yet… "We can support more," argued Demeter, head of Life Planning. "If we shift." Her plan reallocated energy: less for individual artistic transcendence, more for efficient communal sustenance and basic healthcare. The focus shifted from cultivating unique brilliance to ensuring universal, reliable contentment. Lives became busier, less wonder-filled, but undeniably "satisfying" and still worth living. *Equality is a higher good,* Thorne decided. *Spreading the baseline happiness wider is the moral choice.* Asteria grew denser, its corridors bustling with purpose, the average light a little more utilitarian.

  ***Generation 12: The Duty to Create***

  Kael inherited a world of 500,000. "Satisfying" had subtly become "modestly sufficient." Resources were perpetually balanced on a knife-edge. Kael’s council presented a stark choice: reduce population growth targets or accept a further, minor dilution of life-quality per capita. "Consider the potential lives," urged the Chief Ethicist. "Each life we *don't* create is a life denied existence. And existence here, even at this new baseline – let's call it 'adequate' – is still *clearly* worth living. No suffering, basic needs met, simple joys possible. Isn't adding more adequate lives a greater good than preserving a slightly higher quality for fewer?"

  Kael felt the weight. Lyra’s vision was a fading dream. But the Ethicist’s logic was coldly compelling. *Who are we to deny existence when it can be positive, however modestly?* The population targets increased. Asteria became a meticulously managed hive, its inhabitants living calm, predictable, unremarkable lives. Adequate.

  ***Generation 47: The Vast and the Barely There***

  Iris stood where Lyra once did. Below, not a habitat, but an entire asteroid carved into tiers, teeming with billions. The air tasted recycled, thin. Sunlight was a precisely rationed simulation. Life was a cycle of calibrated work, nutrient paste consumption, mandatory rest periods, and brief, standardized recreational intervals designed to maintain neural stability. Existence was "positive" only in the technical sense: freedom from acute suffering, fleeting moments of mild pleasure (a warm shower, a predictable melody), and the absence of the will to cease. It was life barely worth living, sustained only because ending it required more effort than continuing.

  Iris looked at Lyra's statue, its features worn smooth by time and indifferent air. The logic echoed, inescapable:
  1.  Adding lives worth living is good.
  2.  Distributing resources to support more such lives is better than hoarding for fewer.
  3.  Repeat.
  The colossal, humming grayness below was the sum of generations of decent, locally optimal choices. Each step defended with compassion, practicality, or a sense of duty. Each step a slight, almost imperceptible dilution. Each step away from Lyra’s radiance.

  The horror wasn't in any single decision, but in the terrifying sum. *We traded brilliance for bulk,* Iris thought, the sterile air scratching her throat. *We traded meaning for mere existence. And the equation says we won.* The sheer, crushing *weight* of all those barely-lived lives pressed down, a monument not to evil, but to impeccable, devastating logic. Lyra’s empty stone eyes offered no solution, only the silent, repugnant conclusion.

  **The End**

  ---

  **Why this works for your collection:**
  *   **Character-Driven Slide:** Each leader (Aris, Thorne, Kael) makes a decision that seems defensible, even noble, in their specific context (compassion, equality, potential life).
  *   **Sensory Degradation:** The story shows the decline through tangible details: light dimming, space shrinking, food simplifying, experiences becoming more basic and standardized, air thinning. Lyra's "radiant" becomes "good," then "satisfying," "adequate," and finally "barely worth living."
  *   **Focus on Local Logic:** Each step uses Parfit's reasoning explicitly ("net gain," "spreading happiness," "duty to create," "life worth living").
  *   **No Neat Solution:** The ending is bleak and unresolved. Iris recognizes the horror but offers no escape, mirroring Parfit's own struggle. The statue of Lyra is a haunting reminder of the lost ideal and the irreversibility of the path.
  *   **Implied Horror:** The true horror isn't stated outright but felt in the contrast between the opening vision and the final, vast, gray existence. The reader feels the weight of the billions living lives devoid of the qualities that made Lyra's original vision *valuable*.
  *   **Philosophical Fidelity:** It sticks closely to the structure and reasoning of the Repugnant Conclusion without introducing external factors or easy outs. The chain of reasoning *is* the horror.
