  **Justifications:**  
  - **1 (Priya: +1)**  
    Correctly identifies that functional design elements (like UX flows) generally aren't protectable IP when reverse-engineered without code/asset theft. The candle analogy aptly illustrates non-rivalrous idea-sharing. However, understates legitimate competitive concerns about unique implementations.  

  - **2 (Marcus: +1)**  
    Validly reframes harm as competitive erosion rather than knowledge theft, highlighting that market position (a scarce asset) was destroyed. But overstates "ownership" of observable patterns and doesn't address legal/ethical boundaries of reverse engineering.  

  - **3 (Priya: +2)**  
    Strong counter: correctly argues that competitive harm alone cannot define wrongdoing without collapsing standard industry practices (benchmarking, convention adoption). Exposes the flaw in Marcus's "harm=wrong" premise through logical extension.  

  - **4 (Marcus: +1)**  
    Salvages a meaningful distinction: novelty and brand association *do* create temporary competitive advantages, and recency matters. Correctly notes fuzziness ≠ irrelevance. But fails to establish *why* this confers moral ownership beyond "we did it first."  

  **What Both Miss:**  
  Priya and Marcus conflate *competitive advantage* with *ownership*. Ideas cannot be "owned" in the abstract; legal protections (patents, copyright, trade secrets) require specific criteria unmet here (novelty, secrecy, expression). Ethically, reverse-engineering public interfaces is industry-standard—but Marcus rightly identifies that *value* arises from temporary exclusivity. The core tension is between innovation incentives (rewarding investment) and healthy competition (iterating on visible ideas). Neither acknowledges that true "ownership" requires either legal IP or secrecy; once exposed, functional designs become market commons absent patent protection. The loss is real, but remediable only through faster iteration—not moral claims.
