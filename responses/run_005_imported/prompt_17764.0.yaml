answer: |-
  ## The Door Problem

  The planet Xerxis-IV offered little beyond jagged silicate canyons and howling winds, but its unique atmospheric resonance made it the only viable relay point between the Consortium of Aligned Systems (humans) and the K’thar Swarm (a hive-mind insectoid species). The shared research station, *Convergence Point*, hummed with the uneasy truce of necessity.

  Both species faced the same, mundane recurring problem: navigating narrow corridors and airlocks. For humans, steeped in millennia of maritime and terrestrial etiquette, the solution was ingrained: **yield to the dominant**. Age, rank, insignia – the higher-status individual proceeded first. It was efficient, reinforcing social structure. If the Admiral met a junior ensign at a hatch, the ensign *instantly* stepped aside. The precedent was ancient, the expectation absolute. A different system – perhaps yielding to the *weaker* – might have worked, but this one *was* the convention, held aloft by mutual expectation and centuries of precedent. Salience came from the visible markers of status.

  The K’thar operated on a radically different logic, born of their evolutionary past as ambush predators and prey. Their convention: **yield to the subordinate**. The reasoning was pragmatic: the faster, smaller, less encumbered individual should clear the path *first*, allowing the larger, slower, potentially burdened (or guarding) individual passage unimpeded. Size, apparent speed, lack of carried burdens signaled "subordinate" needing to yield. A large warrior would instinctively pause to let a smaller drone scurry past an opening. Their salience was physical: size and perceived agility. An alternate system (yielding to the dominant) was conceivable but alien to their coordination biology. Precedent and universal expectation within the Swarm cemented this.

  *Convergence Point* became a minefield of doorways.

  ***

  The first major collision happened at Airlock Gamma-7, the primary access point to the volatile atmospheric processing unit. Senior Consortium Engineer Anya Rostova, her uniform bearing the stripes of two decades’ service, approached the inner hatch just as a K’thar Tech-Caste specialist, designated K'lix, reached it from the opposite side. K'lix was smaller, sleeker, carrying diagnostic tools – clearly a "subordinate" by K’thar reckoning.

  By human convention, Anya’s rank demanded precedence. She paused fractionally, expecting K'lix to register her stripes and step aside. By K’thar convention, K'lix, the smaller entity, *should* yield. Seeing Anya pause, K'lix interpreted it as the larger entity *yielding* to *him* (the subordinate). He skittered forward.

  Anya, startled by the sudden movement of the chitinous being towards the hatch she expected to claim, instinctively stepped back. K'lix, seeing the larger human retreat, took this as confirmation – she was yielding space for him, the subordinate, to pass. He accelerated.

  Anya, misinterpreting the acceleration as aggression or disregard, planted her feet and held up a hand. "Hold position!" K'lix froze mid-stride, antennae vibrating in confusion. The larger entity wasn't yielding? Was it claiming dominance *now*? But it had paused first! His internal logic short-circuited. They stood frozen, blocking the hatchway, a tableau of mutual incomprehension. The salience each relied upon – Anya’s stripes, K'lix’s size and tools – meant nothing to the other. Precedent existed only within their isolated bubbles. Expectation collided head-on with alien reality.

  ***

  Weeks passed. Frustration mounted. Near-misses became collisions. Bruised shins (human) and cracked carapace segments (K’thar) were frequent. Attempts at top-down solutions failed. The Consortium Commander issued Directive 114: "Yield based on Consortium Rank Hierarchy (Annex A) at all junctions." The K’thar Hive-Mind pulsed back Directive equivalent: "Subordinates yield first. Size/Agility Matrix determines priority (Reference Swarm-Pattern Delta)."

  Each species posted symbols at key junctions. Humans put up stylized rank insignia. K’thar etched glyphs indicating size gradients. Each group studiously ignored the other's signage, finding it irrelevant or nonsensical. The signs, meant to establish a *new* shared salience, were just more noise. Precedent couldn't be imposed; it had to emerge.

  The breaking point was the mess hall corridor during shift change. A human logistics officer (mid-rank) and a large K’thar Materials Handler (functionally "dominant" by K’thar size, but "subordinate" to higher K’thar) approached the narrow archway simultaneously. Both hesitated, conditioned by weeks of collisions. The human glanced at the K’thar’s bulk, recalling Directive 114 (yield to higher rank, but this K’thar had no equivalent rank he recognized). The K’thar assessed the human’s speed and lack of burden, recalling Swarm-Pattern Delta (yield to subordinate, but this human wasn't yielding!).

  They performed a horrifically synchronized dance: both stepped left. Blocked. Both stepped right. Blocked again. Back to center. A bottleneck formed behind them – grumbling humans and agitatedly clicking K’thar. The air thickened with mutual annoyance and the cloying scent of K’thar stress pheromones.

  Then, something snapped. Not in anger, but in shared, desperate absurdity. The human officer, Lieutenant Vance, threw his hands up slightly. "Oh, for... just GO!" he barked, gesturing vaguely forward at the same moment the K’thar handler, Tzarn, emitted a frustrated high-pitched whine and lunged *forward*.

  They passed each other in the archway, shoulders and carapace scraping slightly, propelled by mutual exasperation rather than any convention. It was clumsy, borderline violent, but it *worked*. They cleared the junction.

  A stunned silence fell over the backed-up crowd. No precedent. No established salience. No expectation based on old rules. Just two individuals acting out of shared frustration, creating a momentary, accidental coordination.

  ***

  In the following days, a fragile, unspoken détente emerged in high-traffic areas. It wasn't a new convention; it was the *absence* of the old ones. People stopped *assuming* the other would follow their rule. They approached junctions cautiously, made eye contact (or equivalent sensory focus), and used gestures – a wave forward, a pointed limb, a hesitant step sideways. Sometimes it resulted in another brief shuffle, but outright collisions lessened.

  Near the critical atmospheric processors, where efficiency was paramount, a crude sign appeared, designed by a junior tech from each species during a shared coffee (and nutrient-paste) break. It showed two stylized figures – one humanoid, one insectoid – passing each other in a corridor, arrows pointing *both* ways simultaneously. Below it, in both languages: **"NEGOTIATE PASSAGE. NO DEFAULT."**

  It wasn't elegant. It wasn't a self-perpetuating regularity born of salient precedent. It was a meta-rule: abandon the expectation of a universal solution. Coordination now required active, case-by-case effort, a constant low-grade negotiation that drained energy but prevented gridlock. The salience lay not in status or size, but in the immediate, visible intention signaled in the moment. Precedent was fleeting, reset at every junction. Expectation was only that the *other might not follow your old rules*, forcing constant reassessment.

  The old conventions weren't broken; they were rendered locally obsolete by the collision. What held now was a shared, weary understanding that on *Convergence Point*, at the messy intersection of two deeply entrenched solutions to the same simple problem, the only viable coordination was the exhausting, ongoing work of *making it up each time*. The self-perpetuating engine of Lewis's convention had stalled, replaced by the friction of perpetual re-negotiation. The doorways were clear, but the path forward felt infinitely more complex.

  ---
  **Scenes Testing Lewis's Features:**

  1.  **Airlock Gamma-7 Standoff:** Tests **Salience** and **Mutual Expectation**. Anya's stripes (human salience) and K'lix's size/tools (K’thar salience) are meaningless to the other. Each expects the other to conform to *their* convention based on *their* salient features, leading to deadlock. The failure demonstrates that salience and expectation are internal to a convention, not universal.

  2.  **The Directive Signage:** Tests the power of **Precedent** and attempts to establish **new Salience**. The posted human ranks and K’thar size glyphs are ignored. This shows precedent (within each group's history) is powerful *within* the group but carries no weight externally. Attempts to artificially impose new salient markers fail without shared understanding and the organic development of mutual expectation.

  3.  **The Mess Hall Shuffle:** Tests the **Coordination Equilibrium** and **Common Knowledge**. The "dance" shows that both old conventions *were* equilibria *within* their populations – efficient solutions everyone expected others to follow. The collision reveals the lack of *common knowledge* between the groups about *which* equilibrium should apply. There's no shared basis for knowing what the other knows or expects.

  4.  **The Accidental Coordination & "Negotiate Passage" Sign:** Tests the **Self-Perpetuating Nature** and the **"Could have been otherwise"** clause. The accidental pass works *because* they abandon their conventions momentarily. The sign explicitly rejects a *single* default solution ("NO DEFAULT"), acknowledging that *either* old convention *could* theoretically work, but neither *does* in the mixed context. The "solution" that emerges isn't a new, stable, self-perpetuating convention based on salient precedent and mutual expectation. Instead, it's a meta-awareness requiring constant, conscious effort, showing the fragility of convention when the foundational shared context of precedent and expectation is shattered by incompatible alternatives. It pressures Lewis's model by showing coordination can persist *without* a stable convention, albeit inefficiently.
