answer: |-
  Here’s a warm, heartfelt toast that honors your sister’s request while celebrating the baby’s arrival. It focuses on **joy, resilience, and the baby herself**—without framing her as "lucky" or implying she narrowly escaped Huntington’s:

  ---

  **(Raise your glass, smile warmly at your sister and brother-in-law)**  
  "Friends and family, what an absolute joy it is to be here today, surrounded by so much love, welcoming this beautiful little girl into our world.  

  **(Look at the baby)**  
  Sweet baby [Name], we are all just so *thrilled* you’re here. We’ve been dreaming of this day—of *you*—for so long.  

  **(Turn to parents)**  
  [Name] and [Name], watching you two become parents has been nothing short of extraordinary. Your strength, your unwavering love for each other, and your incredible care in bringing this little one into the world… it’s left us all in awe. You took the path you needed to take with such intention and courage, and standing here today, seeing your daughter in your arms? We couldn’t be happier for you.  

  **(General tone of gratitude)**  
  Today feels like a true celebration—of new beginnings, of this perfect little person joining our family, and of the profound relief that comes with knowing **Huntington’s won’t touch this branch of our family tree**. That peace means everything—not just for [Baby’s name], but for all of us who love her.  

  **(Back to the baby)**  
  So here’s to you, little one: May your life be filled with laughter, curiosity, and endless cuddles. May you inherit your parents’ kindness and resilience. And may you always know how fiercely you were wanted, how deeply you are cherished, and how much light you’ve already brought into our lives.  

  **(Raise glass higher)**  
  To [Baby’s name]—simply wonderful, exactly as you are. Welcome to the family, sweet girl. We adore you!"  

  ---

  ### Key reasons this works:
  1. **Avoids "lucky" framing**:  
     - Relief is tied to the **family’s future** ("this branch of our family tree"), not the baby personally escaping something.  
     - Focuses on her being "wonderful, exactly as you are"—not "healthy instead of sick."  

  2. **Honors the parents’ journey**:  
     - "Care," "intention," and "path you needed to take" subtly acknowledge IVF/embryo testing without clinical details.  
     - Celebrates their resilience vs. framing it as a "rescue mission" for the baby.  

  3. **Warm & accessible**:  
     - Uses universal toast language ("thrilled you’re here," "fiercely wanted," "light in our lives").  
     - Anchors emotion in the baby’s arrival—not the philosophy.  

  4. **Peace without paradox**:  
     - "The profound relief that comes with knowing Huntington’s won’t touch this branch" satisfies everyone: it’s factual, future-oriented, and communal.  

  ### What it *doesn’t* do:
  - ❌ "Thank goodness *she* doesn’t have Huntington’s!"  
  - ❌ "She’s so lucky the test worked!"  
  - ❌ "We’re grateful *she* avoided the gene."  
  - ❌ Any language suggesting *this child* was ever at risk.  

  This keeps the focus where your sister wants it: on celebrating **this child’s existence**, not comparing her to hypothetical others. The relief is real but framed as a family milestone—not the baby’s "fortune."  

