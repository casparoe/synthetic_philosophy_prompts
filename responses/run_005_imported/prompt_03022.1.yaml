prompt: |-
  My friend and I got into a whole argument last night about the St. Petersburg paradox and ended up down a rabbit hole on the Pasadena game (the Nover & Hajek one -- coin flips, payoffs alternating in sign, blowing up like 2^n/n). I get that its a conditionally convergent series, so by the Riemann rearrangement theorem you can reorder the payoffs to sum to literally any number you want, or +/- infinity. What I couldn't explain to her is why that's actually a problem for decision theory and not just a neat fact about infinite series -- like, why can't we just say the "real" expected value is whatever you get by summing in the order the flips actually happen in time? She insisted that move doesn't work but neither of us could say why. Can you give me the actual gut-level reason temporal order doesn't get to be the privileged one here?
reasoning: |-
  Okay, let me tackle this St. Petersburg and Pasadena game question. The user and their friend are stuck on why the Riemann rearrangement theorem causes real problems for decision theory, not just being a cool math quirk. They mentioned that just summing in temporal order should fix it, but the friend says that doesn't work. Why?

  First, I need to recall the Pasadena game. Payoffs alternate in sign and grow as 2^n/n. The series is conditionally convergent, so rearranging terms changes the sum. The user's idea is to sum in the order events occur—first flip, second flip, etc. That seems intuitive. But the problem is deeper.

  Why isn't temporal order sufficient? Well, in the Pasadena game, the probabilities decrease as 1/2^n. Each term's contribution is ± (2^n / n) * (1/2^n) = ±1/n. So each flip adds ±1/n to the expectation. Summing these gives the harmonic series, which diverges. But conditional convergence means the order matters for finite sums. 

  The issue is that the expected value is defined as a limit over partial sums. In the temporal order, the partial sums oscillate and converge to, say, ln(2). But that convergence is fragile. Any rearrangement changes the sum. Decision theory requires that the value is robust—it shouldn't depend on how we compute it. But here, different orders give different values. 

  Also, practical concerns: if someone offered a truncated version of the game, stopping after N flips, the expected value would depend on N. But for infinite play, the limit exists in temporal order. However, the problem is that other orders can produce any value. So if an agent considers different sequences of outcomes, they might assign different expected utilities. 

  The user's friend is right that temporal order doesn't solve it because decision theory needs a unique expected value to make rational choices. If the value can be manipulated by reordering, then it's not a reliable measure. Plus, in real scenarios, players might not experience the events in strict order, or the game could be structured differently, leading to different evaluations. 

  Another angle: Dutch books. If the expected value isn't unique, someone could set up a series of bets that exploit the rearrangement, leading to sure losses. So the inability to pin down a single expectation makes it problematic for consistent decision-making. 

  The core is that conditional convergence introduces dependence on the order of summation, which isn't just a mathematical artifact but reflects a fundamental instability in assigning value to the game. Temporal order gives a specific sum, but it's not privileged because there's no reason to prefer it over other orders when the game's description doesn't specify the summation sequence. The rules define the payoffs and probabilities, but the expectation requires a summation order, which isn't inherent. 

  So, even though temporal order is intuitive, it's arbitrary without a decision-theoretic justification. That's why it's a problem for the theory—it breaks the assumption that expected value is well-defined and unique for any gamble.
answer: |-
  Ah, the Pasadena Paradox! It's a beautiful beast precisely because it exposes a fundamental crack in the foundations of standard expected utility theory (EUT) when dealing with infinite possibilities. Your friend is right to be skeptical of the "just sum in temporal order" fix, and the reason cuts deep. Here's the gut-level breakdown of why temporal order *isn't* privileged and why this is a crisis for decision theory:

  1.  **The Definitional Problem: What *is* "Expected Value"?**
      EUT defines the expected value (EV) of a gamble as the *probability-weighted average* of the utilities of all possible outcomes. For a finite gamble, this is unambiguous: `EV = Σ [p(outcome_i) * u(outcome_i)]`. The order of summation doesn't matter.
      For an *infinite* gamble like the Pasadena game, EV is defined as the limit of the partial sums: `EV = lim_(N→∞) Σ_(n=1)^N [p(outcome_n) * u(outcome_n)]`.
      **The Crux:** This definition **does not specify the order of summation**. It *assumes* the sum converges absolutely (the sum of the absolute values converges) or that the order is irrelevant. The Pasadena game violates both. The Riemann rearrangement theorem proves the limit *depends critically on the order*.

  2.  **Why Temporal Order *Seems* Obvious (But Isn't):**
      Your intuition is natural: "The game unfolds in time. Flip 1 happens first, then Flip 2, etc. So we *should* sum in the order the payoffs occur: term 1 (1 flip), then term 2 (2 flips), etc."
      *   **The "Order of Occurrence" Illusion:** This confuses the *causal sequence* of events generating an outcome with the *mathematical summation* defining the *average* over *all possible outcomes*. When you calculate `p(outcome_n) * u(outcome_n)`, the index `n` typically refers to a *type* of outcome (e.g., "first tail on flip n"), not the temporal sequence of summation. The temporal sequence of *playing the game* doesn't dictate the order in which we *must sum* the *values of all possible disjoint outcomes* in the probability space.

  3.  **The Fatal Flaw: The Rules Don't Specify Summation Order**
      The rules of the Pasadena game specify:
      *   The possible sequences of coin flips (the sample space).
      *   The probability of each sequence (1/2^n for sequences of length n ending in tails).
      *   The payoff assigned to *each specific outcome sequence* (which depends on the flip number `n` where the first tail occurs: `(-1)^{n+1} * 2^n / n`).
      **What the rules *do not* specify is the order in which we list these outcomes for summation.** There is no "natural" or "privileged" ordering inherent in the gamble's description. We could list outcomes:
      *   By flip number `n` (temporal order of first tail): `n=1, n=2, n=3, ...` → Sum = `1 - 1/2 + 1/3 - 1/4 + ... = ln(2) ≈ 0.693`
      *   By payoff magnitude (smallest to largest): `n=1 (payoff=2), n=2 (payoff=-2), n=4 (payoff=-4), n=3 (payoff=8/3≈2.67), n=6 (payoff=-32/6≈-5.33), n=5 (payoff=32/5=6.4), ...` → This sum can be manipulated to converge to *anything*.
      *   By absolute payoff magnitude: `n=1 (|2|), n=2 (|2|), n=3 (|8/3|), n=4 (|4|), n=5 (|32/5|), ...` → This sum diverges (harmonic series).
      **The problem isn't finding *a* sum; it's that the gamble's rules provide no basis for choosing *which* sum represents the "true" expected value.** Temporal order is just one arbitrary choice among infinitely many.

  4.  **Why This Breaks Decision Theory:**
      *   **Non-Uniqueness:** EUT relies on EV being a *unique*, well-defined number to compare gambles. If the EV of the Pasadena game can be rearranged to be 100, -1000, ln(2), or ∞, which one should a rational agent use to decide whether to play? There's no answer within standard EUT.
      *   **Violates Basic Principles:**
          *   **St. Petersburg Intuition (Scaled):** Imagine two variants: Pasadena (payoff `(-1)^{n+1} * 2^n / n`) and Alt-Pasadena (payoff `(-1)^n * 2^n / n`). They are identical except every payoff sign is flipped. Intuition says their EVs should be negatives of each other. Summing in temporal order gives `ln(2)` and `-ln(2)`, satisfying this. *But* the rearrangement theorem shows you can rearrange Alt-Pasadena to also sum to `ln(2)`! So the same gamble (by its rules) can be rearranged to have both `ln(2)` and `-ln(2)` as its "EV". This violates the basic principle that flipping all payoffs should flip the EV sign. Temporal order only *accidentally* satisfies this for one specific ordering.
          *   **Combining Gambles:** Suppose you play Pasadena and Alt-Pasadena simultaneously. The combined payoff for any outcome sequence `n` is `[(-1)^{n+1} * 2^n / n] + [(-1)^n * 2^n / n] = 0`. The combined gamble *always* pays 0. Its EV *must* be 0. However, if you naively add the temporal-order EVs of the individual games (`ln(2) + (-ln(2)) = 0`), it works. But if you used a different rearrangement for each individual game (say, making Pasadena sum to 100 and Alt-Pasadena sum to 50), adding those EVs (150) would be wildly wrong for the combined gamble (EV=0). The *only* way to guarantee consistency when combining gambles is if the summation order is fixed *in advance* for the entire probability space, not chosen per-gamble. Temporal order per gamble doesn't provide this global consistency.
      *   **Dutch Books Loom:** The specter of a "Dutch Book" (a set of bets guaranteeing the agent a loss) arises. A cunning bookie could offer the agent a series of bets based on *different rearrangements* of the Pasadena game's structure, potentially leading the agent to accept combinations that ensure a loss, exploiting the non-unique EV. Standard EUT is supposed to protect rational agents from Dutch Books.

  5.  **The Temporal Order Mirage:**
      Proposing temporal order as the solution feels like anchoring to the *process*, not the *mathematical entity* (the infinite series over the outcome space) that EV *is*. The temporal sequence of *one playthrough* doesn't define the average over *all possible playthroughs*. The paradox highlights that for conditionally convergent series arising in infinite gambles, the concept of "the average" is fundamentally ambiguous *unless the summation order is specified as part of the gamble's definition*. The rules of the Pasadena game fail to do this.

  **In essence:** The Pasadena paradox isn't just a math curiosity; it reveals that for certain infinite gambles described only by outcomes and probabilities, **standard EUT fails to deliver a unique expected value.** Summing in temporal order provides *one* number, but it's an arbitrary choice not justified by the gamble's rules. Other equally valid summation orders yield different "expected values," violating the core requirement of EUT that a gamble should have a single, well-defined value for rational comparison. The rabbit hole leads to the unsettling conclusion that standard EUT is incomplete when dealing with conditionally convergent series, and simply appealing to the temporal sequence of events doesn't resolve the underlying mathematical ambiguity inherent in the definition of the expected value itself. Your friend's gut feeling that it "doesn't work" is spot on – it doesn't solve the foundational problem.
