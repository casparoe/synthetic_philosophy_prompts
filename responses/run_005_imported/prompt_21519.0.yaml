  So I co-host a small philosophy podcast through my uni's philosophy society, and next week's guest is a philosopher of physics who defends the Everettian many-worlds interpretation -- which we've literally been covering in my philosophy of physics seminar this month. I don't want the episode to turn into "so are there really infinite copies of me" 101, I want questions that actually engage with what she's committed to. Can you draft 8-10 interview questions, each with a quick follow-up keyed to whatever answer she's most likely to give? I definitely want one that presses on the preferred basis problem and whether just pointing at decoherence to fix it is quietly circular, one on the Deutsch-Wallace decision-theoretic derivation of the Born rule and the usual worry about how theres room for genuine subjective uncertainty in a theory that's fully deterministic, and one that uses the quantum suicide thought experiment to pin down what actually happens to "you", on her view, once the universe branches. Maybe close with a question about whether anything could even count as evidence against her interpretation, given its supposed to be empirically equivalent to Copenhagen.
