prompt: |-
  In De Corpore, Hobbes argues that a proper definition in geometry must be genetic: it has to specify the motion by which the figure in question is generated, since for him we can have scientia — certain, demonstrative knowledge — only of constructions that we ourselves perform and can trace step by step from cause to effect. This same conviction underlay his decades-long refusal to accept John Wallis's refutations of his repeated claims to have squared the circle; Hobbes dismissed Wallis's symbolic algebra as a manipulation of symbols that obscured genuine geometrical insight rather than revealing it.

  Suppose Hobbes were confronted with a result such as the four-colour theorem, whose only available proofs rest on exhaustive case-checking carried out by a computer and never surveyed in full by any human being. Would he count such a proof as scientia in his own sense of the term, or would he take it as an even more egregious instance of the symbol-shuffling he accused Wallis of practicing? Answer with reference to Hobbes's actual epistemological commitments in De Corpore and the Wallis controversy, not to the popular anecdote about circle-squaring alone.
reasoning: |-
  Okay, I need to tackle this question about Hobbes and the four-colour theorem. Let me start by recalling Hobbes's views from De Corpore. He believed that true scientific knowledge, or *scientia*, requires genetic definitions in geometry. That means you have to define things by how they're constructed through motion. For Hobbes, we can only have certain knowledge of things we build ourselves step by step, tracing causes to effects.

  Then there's the Wallis controversy. Hobbes rejected Wallis's algebra because he thought it was just manipulating symbols without real understanding. Wallis used algebra to refute Hobbes's circle-squaring, but Hobbes dismissed it as not providing genuine geometrical insight. So, for Hobbes, a proof isn't valid if it's just symbol-shuffling; it has to involve clear, constructive steps a human can follow.

  Now, the four-colour theorem. Its proof relies on computer-checked cases. No human has gone through all the cases manually. So, would Hobbes consider this *scientia*? Based on his criteria, probably not. The proof doesn't involve human construction or step-by-step tracing. It's done by a computer, which Hobbes would likely see as another form of symbol manipulation, even worse than Wallis's algebra because it's not even humanly verifiable.

  But I need to tie this back to his actual commitments. In De Corpore, he emphasizes that knowledge comes from our own constructions. Computer proofs remove that human element entirely. Hobbes would argue that without a human tracing each step, it's not certain knowledge. So, he'd reject the four-colour theorem's proof as not *scientia*, aligning with his rejection of Wallis's methods.
answer: |-
  Based on Hobbes's epistemological commitments in *De Corpore* and his stance in the Wallis controversy, he would **emphatically reject** the computer-assisted proof of the four-colour theorem as *scientia*. His reasoning would stem directly from his core principles:

  1.  **The Necessity of Genetic Definition and Constructive Generation:** For Hobbes, *scientia* (certain, demonstrative knowledge) is only possible of objects we can generate ourselves through a clear, step-by-step causal process ("motion"). We know a geometric figure *scientifically* only when we define it genetically – by specifying the precise motions that construct it. This constructive process must be fully traceable by the human mind from cause to effect. Knowledge is grounded in the *act of construction* by the knower.

  2.  **Rejection of Non-Constructive Symbol Manipulation:** Hobbes's vehement opposition to Wallis's algebra wasn't merely about the circle-squaring error; it was a fundamental epistemological rejection. He saw Wallis's symbolic manipulations as empty "symbol-shuffling" (*De Corpore*, Ch. 20). Algebra, for Hobbes, obscured the true, generative causes of geometrical truths by replacing the mental act of construction with abstract operations on signs. It produced results without providing the causal, constructive insight necessary for *scientia*. He demanded proofs that revealed the *genesis* of the truth.

  3.  **Human Agency and Comprehensibility:** *Scientia* requires the knower to actively perform or mentally trace *every single step* of the generative process. Certainty arises from the knower's own constructive act and their ability to comprehend the causal chain in its entirety. Knowledge is an active process of the mind, not the passive acceptance of a result.

  ### Application to the Four-Colour Theorem Proof

  *   **Lack of Generative Construction:** The proof does not provide a genetic definition of a four-colourable map or demonstrate its construction. Instead, it relies on a massive, pre-defined classification of cases and an algorithmic check.
  *   **Symbol Manipulation Par Excellence:** The computer proof is the ultimate "symbol-shuffling" from Hobbes's perspective. It involves:
      *   Abstract combinatorial representations (symbols).
      *   Algorithmic rules applied automatically (shuffling).
      *   A process utterly opaque to human comprehension in its entirety.
  *   **Absence of Humanly Traceable Causality:** No human being can mentally perform or trace the causal chain of the proof. The exhaustive case-checking is delegated to a machine, making the causal path from axioms to conclusion fundamentally inaccessible and untraceable by human reason. The human knower is reduced to accepting an output, not understanding the generative process.
  *   **Passivity of the Knower:** The mathematician confronting the proof does not *perform* the construction or trace its causes. They merely receive a verdict ("true") based on a process they cannot replicate or survey mentally. This passivity is anathema to Hobbes's active, constructive model of knowing.

  ### Conclusion

  Hobbes would view the computer proof of the four-colour theorem as a catastrophic escalation of the flaws he identified in Wallis's algebra. It represents the complete divorce of the mathematical result from the human act of generative construction and causal comprehension. Instead of providing insight into *how* the property arises or *why* it must be true through a mentally traceable generative process, it substitutes an incomprehensible mechanical verification. For Hobbes, this is not *scientia*; it is the epitome of meaningless symbol manipulation, producing a result that, while perhaps pragmatically useful, lacks the grounding in human constructive reason necessary for true, certain knowledge. The proof fails his core requirement: that *scientia* must be knowledge *we ourselves generate and can mentally reconstruct* from cause to effect.
