  The user might not be considering scenarios outside their field. In particle physics, large datasets and repeatable experiments are common. But what about unique historical events or medical diagnoses with limited data? Bayesian methods handle those by updating beliefs with evidence. Propensity theory deals with single-case probabilities, like a specific atom decaying, which frequentism defines only over long runs.

