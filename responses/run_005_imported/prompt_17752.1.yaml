prompt: |-
  I am currently teaching a graduate seminar on contractarian ethics, and this week we have reached the bargaining chapter of David Gauthier's Morals by Agreement, where he argues that fully rational, mutually self-interested bargainers would settle on the principle of minimax relative concession. I have been presenting this alongside its formal counterpart in cooperative game theory, the Kalai–Smorodinsky solution, noting that Gauthier's principle turns out to pick out exactly the point that solution designates. I explained to my students that, unlike the Nash bargaining solution, the appeal of both lies in equalizing how much each bargainer actually gains from cooperating relative to the most he or she could conceivably have gained.

  One of the students, who came to philosophy after a first degree in economics, raised an objection that has left me second-guessing how I presented this. Her worry was that "equalizing gains between two bargainers" is only a coherent instruction if we can measure those gains on some shared scale, whereas the whole point of casting the bargaining problem in von Neumann–Morgenstern terms, as Gauthier explicitly does, is that each party's utility function is unique only up to its own independent positive affine transformation, with no meaningful comparison across parties. On her reading, this means that either minimax relative concession secretly depends on an interpersonal comparison of utility that Gauthier never entitles himself to, which would make it no more principled than simply stipulating an equal split of utility gains, or else I was simply wrong to describe the solution as equalizing anything between the two parties at all.

  I would like your help settling this before next week's session. Could you explain precisely what quantity the Kalai–Smorodinsky solution, and hence Gauthier's minimax relative concession, equalizes between the bargainers, whether that quantity remains invariant when each party's utility function is rescaled independently of the other's, and how the answer bears on my student's dilemma? It would also help to know how this compares to Kalai's own later egalitarian bargaining solution, which is likewise sometimes glossed as an "equal gains" solution but which, if I recall correctly, was explicitly framed around the question of interpersonal comparability in a way the earlier solution was not.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're teaching a graduate seminar on contractarian ethics, specifically Gauthier's Morals by Agreement, focusing on the bargaining chapter. The student's objection is about the coherence of "equalizing gains" when utilities are only unique up to affine transformations. The user needs to clarify what exactly is equalized in the Kalai-Smorodinsky solution and how it handles interpersonal utility comparisons.

  First, I recall that von Neumann-Morgenstern utilities are ordinal and unique up to positive affine transformations. That means scaling and shifting for each individual, but no common scale between them. So, comparing raw utility gains across individuals isn't meaningful. The student is right to question this. 

  The key here is understanding relative concession. Each bargainer's concession is measured as a proportion of their maximum possible gain. For player i, it's (max_u_i - u_i) / (max_u_i - d_i). This ratio is unitless, so it's invariant to affine transformations of their own utility. Scaling or shifting doesn't change the ratio. That's crucial because it addresses the student's concern. The solution equalizes these ratios, not the utility gains themselves. 

  Kalai-Smorodinsky's utopia point defines the maximum each can get. The solution finds where the line from the disagreement point to the utopia intersects the Pareto frontier. The point where the proportional concessions are equal. Since the ratios are invariant, no interpersonal comparison is needed. Each person's concession is measured against their own scale. 

  Contrast this with Nash's solution, which maximizes the product of gains. That uses cardinal utilities but doesn't require interpersonal comparisons. However, it doesn't equalize concessions. Also, Kalai's egalitarian solution does require interpersonal comparisons because it assumes utilities are comparable across individuals. It equalizes absolute gains, which only makes sense if there's a common scale. 

  The student might have confused these different solutions. Gauthier avoids interpersonal comparisons by using relative concessions. The user should emphasize that it's about equalizing the proportion of potential gain sacrificed, not the utility amounts. 

  I should also mention that the utopia point is based on individual maxima, not joint outcomes. That's important because it keeps the solution within each person's frame of reference. The student's dilemma is resolved by showing that the invariant quantity is the ratio of concession to possible gain, which stays the same under rescaling. 

  Comparing to Kalai's later solution helps highlight the difference. The egalitarian solution needs a common scale, while KS doesn't. So, Gauthier's approach is consistent with the non-comparability of utilities. The user can clarify that "equalizing gains" was a shorthand for proportional concessions, not absolute gains. 

  The user might also want to discuss why Gauthier chose this over Nash. KS's focus on relative sacrifice aligns with the contractarian idea of mutual acknowledgment of each other's maximal claims. It's about reciprocity in concessions, which is central to Gauthier's moral theory. 

  In conclusion, the student's objection is valid but can be addressed by emphasizing the ratio-based concession metric. The solution doesn't rely on interpersonal comparisons, and the egalitarian solution is different in that regard. The user should make sure to clarify the terminology in the next session, distinguishing between absolute gains and proportional concessions.
answer: |-
  Your student has raised an exceptionally sharp and important objection, cutting to the heart of bargaining theory's relationship with utility measurement. Let's resolve this step-by-step, clarifying what Kalai-Smorodinsky (KS) and Gauthier's Minimax Relative Concession (MRC) *actually* equalize and why it avoids interpersonal comparisons.

  **1. The Core Invariant: Equal *Relative Concessions***

  *   **What is Equalized:** KS/MRC equalizes the **proportion (or percentage) of each bargainer's *potential cooperative gain* that they concede** to reach agreement, relative to their best possible outcome.
  *   **Formal Definition:** For bargainer *i*:
      *   **Maximum Feasible Utility (Utopia Point):** *max_u_i* = max{*u_i*(x) | *x* ∈ *S*} (the best *i* could get in the feasible set *S*)
      *   **Disagreement Utility:** *d_i* (utility if no deal)
      *   **Potential Gain:** *max_u_i - d_i* (the full gain *i* could conceivably get from cooperation).
      *   **Concession:** *max_u_i - u_i* (how much less than their maximum *i* actually gets in the agreement).
      *   **Relative Concession (RC_i):** RC_i = (max_u_i - u_i) / (max_u_i - d_i)
  *   **The Solution Point:** KS/MRC selects the Pareto-efficient outcome where the **largest relative concession (MRC) made by any bargainer is as small as possible**. Crucially, under standard conditions (convex bargaining set, symmetric utopia definition), this point is also where **RC_i = RC_j for all bargainers i, j**.

  **2. Invariance Under Independent Affine Transformations (Key Point)**

  *   **Utility Rescaling:** Suppose we transform *i*'s utility: *u_i' = a_i * u_i + b_i* (with *a_i > 0*).
  *   **Effect on Components:**
      *   *d_i' = a_i * d_i + b_i*
      *   *max_u_i' = a_i * max_u_i + b_i*
      *   *u_i' = a_i * u_i + b_i*
  *   **Effect on Relative Concession:**
      RC_i' = (max_u_i' - u_i') / (max_u_i' - d_i')
            = [(a_i * max_u_i + b_i) - (a_i * u_i + b_i)] / [(a_i * max_u_i + b_i) - (a_i * d_i + b_i)]
            = [a_i (max_u_i - u_i)] / [a_i (max_u_i - d_i)]
            = (max_u_i - u_i) / (max_u_i - d_i)
            = RC_i
  *   **Conclusion:** The **Relative Concession (RC_i)** is **invariant** under *any* positive affine transformation of *i*'s utility function. It is a **dimensionless ratio** (a number between 0 and 1) specific to each bargainer, calculated *only* using their *own* utility scale. Rescaling *j*'s utility has **absolutely no effect** on the calculation of *RC_i*.

  **3. Resolving the Student's Dilemma**

  Your student is absolutely correct that "equalizing utility gains" (*u_i - d_i*) across bargainers is meaningless without interpersonal comparisons. However, **KS/MRC does *not* equalize utility gains.** It equalizes **relative concessions (RC_i)**.

  *   **Why her worry is partially right but ultimately resolved:**
      *   **Correct Insight:** You *cannot* meaningfully compare the *amount* *u_i - d_i* gained by *i* with the *amount* *u_j - d_j* gained by *j* without interpersonal utility comparisons. Equalizing these raw gains requires a shared scale.
      *   **Resolution:** KS/MRC **does not require comparing *u_i* and *u_j* at all.** It only requires calculating *RC_i* using only *i*'s utility scale and *RC_j* using only *j*'s utility scale. Equalizing *RC_i = RC_j* is meaningful precisely because *RC_i* and *RC_j* are both invariant, dimensionless quantities representing the *proportion* of their *own* potential gain that each is giving up. It respects the ordinality and non-comparability of vNM utilities.
  *   **Analogy:** Imagine two investors. Investor A could potentially make $1000 profit (gain) but agrees to a deal where they make $700 (conceding $300, RC=30%). Investor B could potentially make $200 profit but agrees to a deal where they make $160 (conceding $40, RC=20%). Equalizing *absolute gains* ($700 vs $160) or *absolute concessions* ($300 vs $40) is meaningless without knowing their wealth/risk preferences. Equalizing *percentage profit* (if that were the utility) would be interpersonal. **KS/MRC equalizes the *percentage of their own maximum potential profit that they concede* (30% vs 20% - here they are *not* equal).** Gauthier argues rational bargainers would find the point where both concede the *same percentage* (e.g., both concede 25% of *their own* max potential gain).

  **4. Contrast with Kalai's Egalitarian Solution (1977)**

  *   **What it Equalizes:** The Kalai Egalitarian solution explicitly **equalizes the absolute utility gains from cooperation:** *u_i - d_i = u_j - d_j* for all *i, j*.
  *   **Requirement:** This solution **fundamentally requires interpersonal comparisons of utility.** It assumes there exists a *common scale* upon which *u_i - d_i* for *i* can be meaningfully compared to *u_j - d_j* for *j*.
  *   **Invariance:** This solution is **only invariant** if all utility functions are subjected to the *same* positive affine transformation (*u_i' = a*u_i + b* with *a > 0* identical for all *i*). It is **not invariant** under *independent* affine transformations of each player's utility. Rescaling *i*'s utility independently of *j*'s will generally change the egalitarian gain solution point.
  *   **Comparison to KS/MRC:** Kalai's Egalitarian solution was developed *later* specifically to address contexts where interpersonal comparisons *are* deemed meaningful (e.g., some social welfare contexts). KS/MRC (and Gauthier's MRC) was designed *precisely* for contexts where interpersonal comparisons are *not* justified, sticking strictly to the vNM framework of independent, non-comparable scales. They solve different problems under different assumptions about utility measurability.

  **Summary & Implications for Your Teaching**

  1.  **What KS/MRC (Gauthier's MRC) Equalizes:** The **proportion (Relative Concession: RC_i)** of each bargainer's **own potential cooperative gain (max_u_i - d_i)** that they sacrifice in the agreement. RC_i = (max_u_i - u_i) / (max_u_i - d_i).
  2.  **Invariance:** **RC_i is invariant** under *any* positive affine transformation of *i*'s utility function. Calculating and comparing RC_i and RC_j **requires no interpersonal utility comparisons.** Each RC is calculated solely within one individual's utility scale.
  3.  **Resolving the Student's Objection:** Your student correctly identified the problem with equalizing raw utility gains (*u_i - d_i*). However, KS/MRC avoids this problem by equalizing *relative concessions (RC_i)*, which are invariant ratios calculated *within* each individual's utility scale. Gauthier *is* entitled to this within the vNM framework. Your initial description ("equalizing how much each bargainer actually gains... *relative to the most he or she could conceivably have gained*") was essentially correct if "how much" is understood as the *proportion* of their maximum gain they *realize* (or conversely, the proportion they *concede*). Emphasizing "proportion" or "percentage" over "how much" might prevent future confusion.
  4.  **Kalai Egalitarian vs. KS/MRC:** These are distinct solutions based on different assumptions. KS/MRC (Gauthier) assumes *no* interpersonal comparability and equalizes *relative sacrifices*. Kalai Egalitarian *assumes* interpersonal comparability and equalizes *absolute gains*. They represent different normative principles under different informational constraints.

  **Recommendation for Next Session:** Explicitly walk through the definitions of *max_u_i*, *d_i*, *u_i*, *concession*, *potential gain*, and *relative concession (RC_i)*. Demonstrate the invariance calculation (step 2 above). Contrast RC_i with *u_i - d_i*. Clarify that "equal gains" in the KS/MRC context refers *only* to the equality of the *relative concession ratios (RC_i = RC_j)*, **not** to equality of the utility gains (*u_i - d_i = u_j - d_j*). Acknowledge the student's excellent point – it highlights a crucial and often misunderstood aspect of bargaining theory. This distinction is fundamental to understanding Gauthier's project within the constraints of rational choice theory.
