  This is not equal to P(Q|P) unless P(P)=1. So the material conditional contract does not trade at the conditional probability.

  Alternatively, if we define the contract as P AND Q (paying 1 only when both are true, and 0 otherwise), then the price is P(P and Q). This is P(P) * P(Q|P), which again is not the conditional probability unless P(P)=1.

  So, how can we design a contract that has a price equal to P(Q|P)? 

