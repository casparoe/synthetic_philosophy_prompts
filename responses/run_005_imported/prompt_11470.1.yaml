  The fundamental issue is that the conditional probability is not a state-contingent claim. It is a function of the probabilities of the states, and these probabilities change over time. The contract, however, must have a fixed payoff in each state.

  Therefore, the teammate is correct: you cannot have a tradeable contract whose price is always equal to the conditional probability without the contract having a payoff structure that is not state-wise constant? Actually, the price of the contract is the expected value of the payoff, so it depends on the probabilities.

  But the problem is that the conditional probability is not a linear combination of the state payoffs. It is a ratio of two linear combinations. Therefore, there is no fixed set of state payoffs that will make the contract price equal to the conditional probability in all probability distributions.

  However, we can create a contract that, when the market probabilities are consistent, has a price that equals the conditional probability. But note: the contract must be defined by its payoffs in the states.

  Let me define three states:

    S1: P and Q
    S2: P and not Q
