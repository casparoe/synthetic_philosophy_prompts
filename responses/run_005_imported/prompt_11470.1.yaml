  Neither of these is the conditional probability P(Q|P). The conditional probability is a function of the probabilities of the events, not a direct payoff in every state.

  The problem is that the conditional probability P(Q|P) is not a state-by-state payoff. It is a number that we compute from the probabilities of the states. However, the tradeable contract must have a well-defined payoff in every state.

  Therefore, the plan to price the contract as P(Q|P) (which is a number between 0 and 1) is not the same as defining the contract's payoffs in each state. The contract must have a fixed payoff in each state. The price of the contract in the market should be the expected value of its payoff (under the risk-neutral measure, but we'll ignore that for now).

