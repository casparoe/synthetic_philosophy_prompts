  So to answer the user: Yes, you are stuck with either voiding the bet when the IF part fails or using a contract that does not have a price equal to the conditional probability. The tradeable if-then contract cannot have its price always equal the conditional probability without being state-dependent in a way that is impossible.

  Therefore, the teammate is correct. The plan to build a contract that is priced as the conditional probability by recomputing it from other markets is not broken per se, but it is not a single tradeable contract. It is a derived value. If you want to show the conditional probability on your platform, you can compute it from the two markets (P and P&Q). But if you want a single tradeable contract for the conditional statement, then you must choose a payoff structure (like the material conditional) that does not yield the conditional probability as its price.

