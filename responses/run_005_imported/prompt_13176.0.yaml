prompt: |-
  I'm on the incident-review board at the software company I work for, and we just finished writing up a nasty one: a multi-hour outage that kicked off when an on-call engineer got paged about weird traffic at 2am and snoozed the alert for 45 minutes, because that particular alert had cried wolf all week. Except once you actually dig into it, that's not the only place things could've gone differently -- a seperate team had a ticket open for three months flagging that the service in question had no rate limiting, and it just never got prioritized; the reason it never got prioritized is that the roadmap review last quarter explicitly deprioritized "hardening" work in favor of a launch deadline; and the reason the on-call engineer was covering three services solo that night instead of splitting the load is a hiring freeze from earlier this year. For literally every one of those, it's true that if that person or team had done the thing they didn't do, the outage probably doesn't happen, or is a lot smaller -- so by a plain "but for this, it wouldn't have happened" test, they're all causes.

  The postmortem doc is supposed to name actual root causes / contributing factors, not just list everyone who touched the situation, so it can drive real follow-up work -- and the board is stuck on where to stop. Some people want to stop at the on-call engineer's snooze since that's the proximate thing; others think that's just scapegoating someone for decisions made way above their pay grade, and want the roadmap call, or even the hiring freeze, named as the real root cause -- but then someone reasonably points out that if we're willing to go back that far, why stop there and not blame whoever approved the budget behind the freeze, and so on forever. My partner, who's a lawyer, says this is basically the same fight they have over proximate cause, which did not make me feel better. A couple of us are also uneasy that wherever we end up drawing the line is going to suspiciously match whoever we already felt comfortable holding responsible before we started, which makes me wonder whether we're tracking causes at all at that point, versus just dressing up our blame calls in causal-sounding language after the fact.

  Could you draft the actual memo I'd bring to the board before we meet again next week -- one that proposes a real method for sorting which of these omissions count as causes for the writeup versus mere background conditions, applies it to say something concrete about this specific incident, and directly answers that last worry instead of dodging it. We run these reviews often enough that I want an actual method out of this, not just a one-off verdict we'll forget about by the next incident.
reasoning: |-
  Okay, let me start by understanding the user's problem. They're on an incident-review board at a software company dealing with a multi-hour outage. The issue is identifying root causes without falling into the blame game. They've listed several factors: the engineer snoozing the alert, a three-month-old ticket about rate limiting not being prioritized, a roadmap deprioritizing hardening work, and a hiring freeze leading to the engineer covering multiple services alone. 

  The user needs a method to distinguish actual causes from background conditions in their postmortem. They want to avoid scapegoating and ensure follow-up actions are effective. The deeper concern is about fairness and objectivity—making sure the root cause analysis doesn't just confirm pre-existing biases about who to blame.

  First, I should consider frameworks for root cause analysis. The legal concept of proximate cause is mentioned, but that's not directly applicable here. In incident reviews, the focus is on actionable factors. The "Five Whys" technique might come to mind, but it can lead to infinite regress. Instead, something like causal factor charting or systems thinking might help. 

  The key is to identify factors that, if changed, would prevent recurrence. The hiring freeze is a higher-level business decision, but it's a condition that enabled the incident rather than a direct cause. The roadmap prioritization is a decision that allowed the vulnerability to persist. The unaddressed ticket is a missed opportunity to fix the issue. The engineer's snooze was the immediate trigger.

  I recall that in systems safety engineering, models like the Swiss Cheese Model emphasize multiple layers of failures. Each layer (organization, supervision, preconditions, specific acts) has holes that align to cause an incident. The goal is to address the layers where changes are feasible and impactful.

  The user also wants to address the worry that the analysis might just reflect pre-existing biases. To counter that, the method needs clear criteria. Factors should be necessary in the chain, modifiable, and their mitigation should prevent future incidents. Background conditions are those that, even if changed, wouldn't have prevented this specific incident or are too broad to be actionable.

  Applying this to the outage: the snooze is proximate but not sufficient alone. The lack of rate limiting made the system vulnerable. The deprioritization of hardening allowed that vulnerability to exist. The hiring freeze created overload, which is a condition. However, changing the hiring freeze might not directly prevent similar issues if other safeguards exist. But addressing the hardening deprioritization could prevent similar vulnerabilities.

  The follow-up actions should target the rate limiting implementation, process changes in roadmap planning to include hardening, and alert fatigue solutions. The hiring freeze isn't actionable for this incident's prevention, though staffing policies might need review separately.

  The user's unspoken need is likely about fostering a blameless culture while ensuring accountability. They want the team to trust the process, so the method must be transparent and consistently applied. Also, the memo should provide a template for future incidents, making the approach scalable.
answer: |-
  Here’s a memo proposing a method for root cause analysis in incident reviews, designed to avoid blame traps while driving actionable follow-ups. The method is adapted from systems-thinking frameworks (like Reason’s Swiss Cheese Model) and focuses on **actionable controllability** and **preventive leverage**:

  ---

  **MEMO: Proposed Method for Root Cause Analysis in Incident Reviews**  
  **To:** Incident Review Board  
  **From:** [Your Name]  
  **Subject:** Objective Framework for Determining Contributing Factors in [Incident ID]  

  ### **The Problem: "Where to Stop?" in Causal Chains**
  Endless regression (e.g., "the hiring freeze → budget approval → CEO’s childhood") isn’t useful. Conversely, stopping at the proximate trigger (the snoozed alert) ignores systemic failures. We need a method that:  
  1. **Prioritizes factors we can actually change.**  
  2. **Focuses on decisions/omissions that *uniquely enabled* the incident.**  
  3. **Avoids scapegoating while acknowledging human agency.**  

  ### **Proposed Method: The "Actionable Controllability & Preventive Leverage" Test**  
  A factor qualifies as a **root cause or contributing factor** if it meets **all three criteria**:  

  1. **CONTROLLABLE AT THE TIME**:  
     The factor arose from a decision/inaction *within the organization’s control* (e.g., deprioritizing hardening, ignoring a ticket).  
     *Excludes* external market forces (e.g., "hiring freeze due to recession").  

  2. **NECESSARY IN THE CHAIN**:  
     Removing *this specific factor* would very likely have **prevented the incident or drastically reduced its impact**, given the other conditions.  

  3. **ACTIONABLE PREVENTIVE LEVERAGE**:  
     Addressing it provides **high-value prevention** for *this type of incident* (e.g., fixing rate limiting prevents *all* overload outages, not just this one).  

  **Background Conditions** (excluded from "causes" in the report) are factors that:  
  - Were necessary for the incident but are **too broad/generalized** (e.g., "humans sleep at night").  
  - Lack **direct preventive leverage** (e.g., the hiring freeze enabled overload, but adding staff doesn’t *fix* the rate-limiting flaw).  
  - Were **immutable at the incident time** (e.g., "cloud provider region had an outage").  

  ---

  ### **Application to Our Incident**  
  | Factor                          | Controllable? | Necessary? | Actionable Leverage? | Verdict       |  
  |---------------------------------|---------------|------------|----------------------|---------------|  
  | **Engineer snoozed alert**      | Yes (individual) | No* (outage would likely still occurred later without hardening) | Low (fixing alert fatigue helps, but doesn’t prevent overload) | **Proximate trigger** (document, but not root cause) |  
  | **Unaddressed rate-limit ticket** | Yes (team)    | **Yes** (no overload protection) | **High** (fix prevents *all* similar outages) | **Contributing factor** |  
  | **Roadmap deprioritized hardening** | Yes (leadership) | **Yes** (ticket stalled *because* of this) | **High** (process change prevents future hardening debt) | **Root cause** |  
  | **Hiring freeze leading to solo on-call** | Partially (company) | No (engineer *could* have acted despite load; outage root was *lack of hardening*) | Low (adding staff doesn’t fix architectural flaws) | **Background condition** |  

  #### **Root Causes/Contributing Factors for Report:**  
  1. **Systemic hardening deficit** due to roadmap decisions deprioritizing stability work.  
  2. **Unmitigated known risk** (rate-limiting gap) due to stalled ticket resolution.  

  #### **Background Conditions (Mention, but don’t list as causes):**  
  - High on-call load due to staffing constraints.  
  - Alert fatigue from prior false positives.  

  ---

  ### **Addressing the "Blame-Disguised-as-Cause" Concern**  
  **Why this method reduces bias:**  
  - **Shifts focus to decisions, not people:** "Deprioritized hardening" is a *decision*, not "Product Manager X failed."  
  - **Forces preventive leverage:** If the "cause" can’t be acted upon meaningfully (e.g., "blame the freeze"), it’s excluded.  
  - **Uses necessity as a filter:** The snooze wasn’t *necessary* for the outage (it would have happened at 3 AM anyway).  
  - **Requires evidence-based counterfactuals:** "If rate limiting existed, would overflow have been blocked?" (Yes).  

  **Explicit guardrail:** If a factor points to an *individual* without systemic leverage (e.g., "engineer should’ve acted faster"), it’s **never a root cause**—only a trigger. Humans are fallible; systems must anticipate this.  

  ---

  ### **Concrete Follow-Ups Driven by This Analysis**  
  1. **Process change:** Roadmap planning must include "hardening capacity" as a non-negotiable resourcing bucket.  
  2. **Fix known gaps:** Implement rate-limiting on all public endpoints by [date]; audit for similar undocumented risks.  
  3. **Reduce alert fatigue:** Dedicate sprint time to alert tuning; auto-close flapping alerts after 3 false positives.  

  ### **Method Adoption for Future Incidents**  
  1. **Template all postmortems** using the 3-part test.  
  2. **Review board training:** Workshop on applying the criteria to past incidents.  
  3. **Blind test:** Have 2 members independently apply criteria *before* group discussion to reduce anchoring bias.  

  This method stops the regress ("but why did *that* happen?") by focusing on **highest-yield preventive actions within our control**. It turns "who failed" into "what systems failed, and how do we fix them?"  

  ---  
  **Ready to discuss/draft the final incident report using this framework.**  
  [Your Name]  

  ---  
  **Key Takeaways for Your Board Discussion:**  
  - **Reject "but-for" causality** → Embrace **"actionable necessity"**.  
  - **Proximate triggers ≠ root causes** → Focus on **architectural/organizational decisions**.  
  - **Hiring freezes/budgets are constraints** → Work *within them* by prioritizing stability work.  
  - **If the "cause" can’t be mitigated, it’s not a cause** → It’s context.  

  This approach transforms philosophical debates into engineering decisions—which is what we’re good at.
