  Given the different benefits each of you would gain from the remaining eight hours of laptop time, a fair division should balance efficiency (maximizing the team's total score gain) with fairness to both partners. Since your potential gain is 30 points with all the time and hers is capped at 10 points, dividing time equally (4 hours each) may seem fair on the surface but is inefficient for the team. With equal time, you would gain about 15 points (50% of your potential), and she would gain about 5 points (50% of her potential), for a total gain of 20 points. However, this underutilizes the time because your higher gain rate (3.75 points per hour) compared to hers (1.25 points per hour) means that allocating more time to you increases the team's total score more.

  A fairer approach is to divide the time in proportion to each person's potential point gain. This recognizes that time is a shared resource and allocates it based on how much each of you can contribute to the team's improvement. Here's how it works:

  - Your potential gain: 30 points
  - Her potential gain: 10 points
  - Total potential gain: 40 points
  - Your share of time: \( \frac{30}{40} \times 8 = 6 \) hours
  - Her share of time: \( \frac{10}{40} \times 8 = 2 \) hours

  With this division:
  - You use 6 hours, gaining \( 3.75 \times 6 = 22.5 \) points (75% of your potential).
  - She uses 2 hours, gaining \( 1.25 \times 2 = 2.5 \) points (25% of her potential).
  - Total team gain: 25 points.

  This approach is fair for several reasons:
  - **Efficiency**: It increases the team's total gain (25 points) compared to equal time (20 points) or allocating all time to her (10 points). It also comes close to the maximum possible gain of 30 points if you used all the time, while still giving her a meaningful opportunity to improve.
  - **Proportionality**: Time is allocated based on each person's ability to benefit, so it accounts for the differing potentials. You get more time because you can use it more effectively, but she still receives a share proportional to what she can contribute.
  - **Equity**: Both of you achieve a reasonable fraction of your potential gain (you get 75%, she gets 25%), which is more balanced than equal time (where both get 50% but the absolute gains are unequal) or equal gain (where she might need to use more time for the same points).

  To address your partner's concern about fairness, explain that this method:
  - Benefits the team more, which is crucial for regionals.
  - Gives her dedicated time to improve (2 hours is enough for her to gain 2.5 points, which is better than nothing if you took all the time).
  - Is based on an objective standard (potential gain) rather than arbitrary equality.

  If your partner strongly prefers equal time for perceived fairness, consider a compromise (e.g., 5 hours for you and 3 for her), but this would yield a lower total gain (about 23.75 points). Ultimately, proportional division is a practical and fair solution that respects both individual contributions and team goals. Discuss this with your partner to reach an agreement quickly, as time is limited.
