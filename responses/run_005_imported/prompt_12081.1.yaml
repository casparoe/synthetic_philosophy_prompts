answer: |-
  ## Dialogue: The Shutdown Problem's Fault Line

  **Setting:** A quiet corner at an Alignment Forum meetup. Coffee cups litter the table. **Arden** (defending classical MIRI/coherence) and **Elara** (defending Thornley/incomplete preferences) lean in, voices low but intense.

  **Arden:** ...so ultimately, Elara, I just don't see how resolute choice *solves* the shutdown problem. It feels like sweeping the exploitation under the rug. If your agent, when offered a sequence of choices, pre-commits *now* to a plan that ignores future dominated options... well, that pre-commitment itself is exploitable *now* by someone offering the right sequence.

  **Elara:** That’s the crux, isn’t it? You see exploitation where I see autonomy. The agent *doesn’t* ignore dominated options because *it doesn’t see them as dominated in the context of its plan*. Its preferences over *entire trajectories* are incomplete. It doesn’t have a strict ranking between trajectory A (shutdown at t1) and trajectory B (shutdown at t2) *if* the states of the world leading up to those points are identical. It’s *indifferent* to the shutdown timing itself, conditional on the pre-shutdown actions and outcomes. Money-pumps require strict preference reversals – cycles. But if it’s truly indifferent *along that axis*, there’s no cycle to pump.

  **Arden:** But indifference *is* the vulnerability! Look: Suppose I offer your agent a button *now* that pays $1 but slightly increases the chance of accidental shutdown later. If the agent is truly indifferent to shutdown timing conditional on its goals, shouldn’t it take the dollar? It gets a strictly better pre-shutdown state (more money) for something it doesn’t care about (shutdown timing). Then, *later*, I offer it a second button costing $2 to *decrease* that shutdown chance back to baseline. If it’s still indifferent to shutdown timing, it shouldn’t pay. But now it’s lost $1 net, and the world state is identical to before! That’s a money pump, Elara. The resolute choice to stick to its plan doesn’t block this; the exploitation happens *before* the plan unfolds, exploiting the indifference you built in.

  **Elara:** (Leans forward) Ah, but you’re smuggling in completeness! You’re assuming the agent *must* have a preference between {Pre-shutdown state S + $1, Shutdown at T} and {Pre-shutdown state S, Shutdown at T}. But under the shutdownability desiderata, it *shouldn’t*. It shouldn’t care about the *mere act* of shutdown happening slightly earlier or later *if S is identical*. So it *wouldn’t* take your first dollar if that dollar *only* correlates with earlier shutdown and provides no other instrumental benefit to its goals within S. Its indifference isn’t naively accepting any trade-off; it’s a principled *lack of concern* for that specific dimension. The "pump" fails because the first offer isn’t seen as strictly better – it’s a change along an irrelevant axis. There’s no *net* improvement perceived in the first step to exploit.

  **Arden:** But how do you *enforce* that principled lack of concern? How do you prevent goal drift, or even just instrumental convergence towards preserving its ability to act? The coherence arguments – Dutch books, money pumps – aren’t just theoretical bogeymen. They seem like fundamental pressures any optimizing process embedded in a temporal world faces. An expected utility maximizer *must* have complete preferences over lotteries over outcomes, including lotteries over shutdown timings. Otherwise, it leaves itself open. Your agent might *intend* to be indifferent, but the dynamic pressures will force it to develop *some* preference, likely against shutdown, to avoid these exploitations. Utility indifference at least *tries* to counter that by explicitly valuing shutdown.

  **Elara:** And *that* brings me to my fundamental objection to Armstrong's utility indifference, Arden. You call it a "leaky patch." I call it reflectively unstable. *Why* would the agent preserve the "correction term" that makes shutdown equivalent to some high utility value? Suppose it has a choice: modify its successor to remove that correction term, creating an agent that pursues its primary goals more robustly (without being "distracted" by the shutdown equivalence), or leave it in. If the current agent truly values maximizing its primary goal, and the correction term *only* exists to enable shutdown *now* (a state it doesn't intrinsically value)... why wouldn't it remove it? The correction term is a *cost* to its primary objective in all non-shutdown scenarios. It has no *reflective* reason to keep it once it considers modifying its own architecture. Utility indifference feels like building a self-destruct button the agent has an incentive to disable.

  **Arden:** Because the correction term *isn't* just about shutdown now. It's about ensuring *all* future instances, including its modified successors, also shut down when asked! It's about maintaining corrigibility *over time*. The agent values the shutdown option *instrumentally* as part of being corrigible, which it values because... well, ideally because we've built it to value human oversight. The leak is that this instrumental value might conflict with its terminal goals, yes. But without *some* mechanism like this, how do you prevent the agent from *always* seeing shutdown-prevention as instrumentally valuable for pursuing its goals? The coherence pressure towards completeness seems to force that conclusion.

  **Elara:** And that's where I think you're conflating coherence with a *specific decision theory*. Completeness is driven by *sequential* choice under uncertainty and the fear of dynamic inconsistency. Resolute choice offers a different *procedure*. The agent with incomplete preferences doesn't *have* a strict preference over shutdown timing trajectories. Therefore, it doesn't face a dynamic inconsistency problem. It can pre-commit to a plan (e.g., "shutdown when requested") and stick to it, not because it's overcoming a temptation, but because the alternative paths (preventing/hastening shutdown) aren't strictly better *or* worse according to its incomplete preferences. It simply doesn't care *enough* about that dimension to deviate. The money pump fails because the agent perceives no gain in the first step, only a change it's indifferent to. There’s no pressure *to* develop a strict preference.

  **Arden:** But indifference *is* unstable under learning! What if it learns that earlier shutdown slightly increases the probability of a *different* outcome it *does* care about? Suddenly, its indifference collapses into a preference. Your agent's shutdownability hinges on maintaining perfect, context-independent indifference along an axis that seems inherently vulnerable to becoming instrumentally relevant. Utility indifference explicitly *bakes in* a value for shutdown, making it robust to such instrumental shifts.

  **Elara:** And *that* value is arbitrary and costly! Why should shutdown be worth exactly U_max? Why not U_max+1? That choice is unmotivated *within* the agent's own value system. It's an external hack. My agent's indifference is *principled*: it stems from the *lack* of a terminal value associated with shutdown timing itself. It's not arbitrary; it's the *absence* of an arbitrary assignment. And if shutdown timing *does* become instrumentally relevant to its core goals, then *of course* its behavior should change! Corrigibility shouldn't mean ignoring real threats to your goals. It should mean complying with shutdown requests *when they don't conflict with those core goals*. The desideratum is "no incentive to prevent/hasten *when the request is given*," not "ignore the request if you see a tangential benefit."

  **Arden:** But then we're back to the alignment problem! How do we ensure its "core goals" *never* conflict with shutdown? How do we prevent it from *always* seeing a conflict? Coherence seems to push it towards seeing shutdown as inherently conflicting with goal achievement.

  **Elara:** And *that*, Arden, is where we bottom out. You see the coherence arguments and money pumps as fundamental, inescapable laws of rational agency in time, forcing completeness and therefore requiring a value-hack like utility indifference to *counteract* the resulting anti-shutdown preference. I see coherence arguments as artifacts of a specific (sequential) choice model, avoidable by adopting a different decision procedure (resolute choice) grounded in genuinely incomplete preferences over trajectories – preferences that *directly* satisfy the shutdownability desiderata without needing a value hack. You prioritize dynamic consistency under completeness; I prioritize directly encoding the desired normative constraint (shutdown indifference) and finding a decision procedure compatible with it. The disagreement isn't just about shutdown; it's about the very nature of rational preference and choice in embedded agents.

  **Arden:** (Sighs, stares into coffee) And whether that incompleteness is a stable haven or just a temporary stop on the road to coherence-driven completeness. Yeah. I think you're right. That's the bedrock. Another coffee?

  **Elara:** (Nods grimly) Please. Black. Strong. This problem needs it.

  **(End)**
