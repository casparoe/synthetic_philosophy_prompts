answer: |-
  ### Analysis of the Betting Strategy

  Your situation involves a key concept in decision theory and probability: how to manage repeated favorable bets when there's a risk of ruin. Jordan's argument that betting the entire balance every week maximizes expected earnings per bet is mathematically correct for a single, isolated bet, but it ignores the implications for long-term growth and survival in a repeated setting. Let's break this down rigorously.

  #### 1. **The Single-Bet Expected Value (EV) is Misleading for Repeated Bets**
     - For a single week, the EV per dollar wagered is indeed positive:
       - Win (60% probability): You gain +1 dollar (since doubling the wager means you net +1 per dollar bet).
       - Loss (40% probability): You lose -1 dollar.
       - EV = (0.6 × +1) + (0.4 × -1) = 0.6 - 0.4 = +0.20 dollars per dollar wagered, or a 20% expected return.
     - Because the EV is positive, betting more money increases your expected earnings for that single week. If this were a one-time bet, Jordan would be right: you should wager as much as possible.
     - However, this is a multi-week game. Maximizing EV per bet does not maximize long-term wealth because it fails to account for the risk of ruin (losing everything and resetting to a small stipend). As you've observed, betting everything every week leads to a high probability of eventually hitting a loss and going bankrupt. With a 40% chance of loss each week, the probability of surviving \(n\) weeks without ruin is \(0.6^n\), which rapidly approaches zero:
       - After 5 weeks: \(0.6^5 \approx 0.078\), so a 92.2% chance of ruin.
       - After 10 weeks: \(0.6^{10} \approx 0.006\), so a 99.4% chance of ruin.
     - When ruin occurs, you fall back to a small stipend (say, \(S\) dollars), putting you far behind. Even though the all-in strategy has a high expected balance in theory (e.g., \( \$10,000 \times 1.2^n \) after \(n\) weeks), this EV is heavily skewed by the tiny probability of winning all bets and becoming extremely rich. In reality, you'll likely be stuck near zero most of the time, as Jordan has experienced.

  #### 2. **The Kelly Criterion: A Principled Way to Choose the Bet Fraction**
  For repeated bets with an edge, there is a rigorous way to determine the optimal fraction to wager: the Kelly criterion. It maximizes the long-term growth rate of your wealth by considering both the expected return and the risk of loss. The Kelly fraction \(f^*\) is calculated as:
  \[
  f^* = p - q
  \]
  where:
  - \(p\) is the win probability (0.6),
  - \(q\) is the loss probability (0.4).

  Plugging in the numbers:
  \[
  f^* = 0.6 - 0.4 = 0.20
  \]
  So, you should bet 20% of your current balance each week to maximize the growth rate of your wealth over time.

  **Why Kelly is optimal:**
  - The Kelly criterion maximizes the expected logarithm of wealth, which corresponds to maximizing the geometric growth rate. This is the rate at which your wealth compounds over time.
  - With \(f^* = 0.2\):
    - If you win (60% chance), your balance grows by 20% (i.e., multiplied by \(1 + f^* = 1.2\)).
    - If you lose (40% chance), your balance shrinks by 20% (i.e., multiplied by \(1 - f^* = 0.8\)).
  - The expected growth rate per bet \(G(f)\) is:
    \[
    G(f) = p \log(1 + f) + q \log(1 - f)
    \]
    At \(f^* = 0.2\), \(G(0.2) \approx 0.0201\) (about 2.01% per week). This means your wealth grows exponentially at roughly 2% per week on average.
  - Crucially, this strategy avoids ruin: since you never bet everything, your balance never hits zero, and you can recover from losses.

  **Comparison of strategies after 10 weeks (starting at $10,000):**
  - **All-in strategy (Jordan's approach):**
    - Expected balance: \(\$10,000 \times 1.2^{10} \approx \$61,917\).
    - But probability of ruin (balance = $0) is about 99.4%, with a stipend reset. If not ruined, balance is \(\$10,000 \times 2^{10} = \$10,240,000\) (but this is very unlikely).
    - Median balance: \$0 (due to high ruin probability).
    - Real-world outcome: Highly volatile; likely to hit zero multiple times, as Jordan has seen.

  - **Kelly strategy (20% bet fraction):**
    - Expected balance: \(\$10,000 \times (1 + 0.2 \times 0.2)^{10} = \$10,000 \times 1.04^{10} \approx \$14,802\).
      - Explanation: The term \(1 + 0.2 \times 0.2\) comes from the EV multiplier per bet: \(1 + f \times \text{edge} = 1 + 0.2 \times 0.2 = 1.04\).
    - Expected growth rate: Balance grows steadily at ~2% per week.
    - Median balance after 10 weeks: ~\$12,230 (since wealth is log-normally distributed).
    - Probability of having less than starting balance: ~36.7% (but no ruin, so you always have positive wealth to continue betting).
    - Real-world outcome: Steady growth with lower volatility, as you've experienced.

  - **Key insight:** The all-in strategy has a higher expected value but a much lower median and a high risk of disaster. The Kelly strategy sacrifices some short-term EV for sustainability, resulting in higher wealth with high probability in the long run.

  #### 3. **Addressing Jordan's Argument and the Roommate's Comment**
  - Jordan is correct that all-in maximizes single-bet EV, but this is irrelevant for repeated bets. Variance isn't just noise; it leads to certain ruin over time, which EV ignores. Jordan's zeros are not "just variance"—they are a predictable outcome of a flawed strategy.
  - Your roommate (stats major) may have agreed with Jordan because:
    - For a single bet, EV maximization is standard.
    - In introductory stats, EV is often emphasized without considering repeated games or risk of ruin.
    - However, in decision theory and finance, the Kelly criterion is the gold standard for repeated favorable bets. It balances growth and risk, while all-in does not.
  - Your intuition is spot-on: betting everything guarantees eventual ruin, and "higher EV" doesn't solve this. In fact, betting more than the Kelly fraction (e.g., all-in) reduces long-term growth and can even cause wealth to decline (e.g., betting 50% of balance gives a negative growth rate).

  #### 4. **Is This About Risk Tolerance?**
  - To an extent, yes. Risk-neutral players (who only care about EV) might prefer all-in for its higher theoretical payoff, but this is irrational in practice because ruin destroys future opportunities. In your seminar, the grade likely depends on final balance, so avoiding ruin is crucial.
  - Kelly is optimal for growth-maximizers. If you're risk-averse, you might bet less than Kelly (e.g., 10-15%) for smoother growth, but betting more (e.g., over 20%) is worse:
    - Betting 0%: Growth rate = 0 (no change).
    - Betting 20%: Maximum growth (~2.01% per week).
    - Betting 50%: Negative growth (~ -3.4% per week—wealth shrinks).
    - Betting 100%: Ruin with probability 1 (growth rate undefined, but effectively negative infinity).
  - Thus, Kelly is not arbitrary; it's mathematically derived for optimal growth.

  #### 5. **Practical Advice for Your Seminar**
  - **Recommended strategy:** Bet 20% of your current balance each week. This is the Kelly fraction for your bet (60% win, double-or-nothing).
  - **Why it works:** It ensures your wealth grows steadily, compounds over time, and avoids ruin. In simulations, Kelly dominates all-in with high probability after ~20-50 weeks.
  - **Implementing it:**
    - Start with week 1: Bet \(0.2 \times \$10,000 = \$2,000\).
      - Win (60%): Balance = \(\$10,000 + \$2,000 = \$12,000\) (you double the wager, so gain \(2 \times \$2,000 - \$2,000 = \$2,000\) net, but easier to multiply: \(\$10,000 \times 1.2 = \$12,000\).
      - Lose (40%): Balance = \(\$10,000 - \$2,000 = \$8,000\).
    - Week 2: Bet 20% of new balance (e.g., if won, bet \(0.2 \times \$12,000 = \$2,400\)), and so on.
  - **If ruin occurs (due to stipend):** Still bet 20% of your current balance (including stipend) to maximize recovery.
  - **Edge cases:** If the bet were not 60/40, Kelly adjusts automatically (e.g., if win probability were 70%, \(f^* = 0.7 - 0.3 = 0.40\)).

  #### Final Thoughts
  - **Who is correct?** You are correct that all-in is flawed for repeated bets, and Jordan is mistaken. All-in maximizes short-term EV but ignores long-term growth and risk. Your fractional approach is superior, and Kelly provides the rigorous foundation for it.
