answer: |-
  Here’s a draft that threads the needle – using Franklin as a warm, shared language without turning it into a seminar or a roast. The key is anchoring every reference in *her* story and *your* friendship, making the history serve the sentiment:

  **Wedding Toast Draft (Approx. 5 Minutes)**

  **(Start with warmth and connection)**
  "Hi everyone! For those I haven’t met yet, I’m [Your Name], and I’ve had the incredible privilege of being [Bride's Name]’s best friend since our undergraduate days. We’ve shared tiny dorm rooms, questionable dining hall food, and… a slightly obsessive seminar on the Atlantic Enlightenment. *(Small chuckle, glance at the seminar group)* But more importantly, we’ve shared over a decade of laughter, support, and watching each other grow into the people we are today."

  **(Introduce the Franklin hook simply, focusing on *her*)**
  "Now, anyone who knows [Bride's Name] well knows she has a… unique relationship with Benjamin Franklin. Not *that* kind of relationship! *(Light laugh)* Specifically, a chapter in his autobiography about his 'bold and arduous project' to achieve moral perfection. He made this little chart of 13 virtues, tracking his slip-ups. And [Bride's Name], being [Bride's Name], didn’t just read it – she adopted it. Seriously, ask anyone who’s ever shared an apartment with her – she’s kept her own version of that virtues chart, tracking her progress, for *ten years*. Order and Resolution? Yeah, they’re still giving her a run for her money. *(Warm smile, nod to her)* But that’s not actually the part I want to talk about."

  **(Reveal Franklin's self-awareness – the core sentiment)**
  "What struck me most, rereading that chapter for this, wasn't Franklin's ambition. It was his *honesty*. Because Franklin, this titan of American history, basically says: **'Yeah, this whole perfection thing? I failed spectacularly at it.'** He was genuinely shocked by how many faults he kept finding once he started counting. He realized trying to polish himself perfectly was like trying to grind an axe head flawlessly bright – impossible! And you know what he decided? He decided he actually *liked* the axe with a few specks. It had character. It was real."

  **(Connect Franklin's insight directly to HER)**
  "And that, right there, is what I’ve always admired most in [Bride's Name]. It’s not the striving for Order or Resolution on some chart – though her dedication is truly something! *(Glance at her, affectionate)* It’s the *spirit* behind it. It’s the fact that she embraces the effort, the *trying*, knowing that the 'specks' aren't failures, they're part of what makes her beautifully, wonderfully *her*. Franklin called it liking a 'speckled axe.' I just call it loving my incredibly real, determined, and utterly human best friend."

  **(Add the Humility layer & connect to love/partnership)**
  "He even added 'Humility' to his list after a friend pointed out his pride... only to immediately realize that mastering humility would probably just make him proud of *being* humble! *(Slight knowing chuckle – the history folks will get this)* It’s that same self-aware spark I see in [Bride's Name]. She sets these high bars, she works hard, she *cares*, but she also laughs at the absurdity of it all. She doesn’t demand impossible perfection from herself, or, crucially, from the people she loves."

  **(Pivot to the couple and the future)**
  "That’s why seeing her with [Groom's Name] is such a joy. [Groom's Name], you clearly understand this about her. You love her drive, her passion, her incredible mind, *and* you love the reality of her – the occasional lost keys, the ambitious plans that might need... tweaking, *(look at Bride playfully)* the whole glorious, 'speckled axe' package. You appreciate the effort, and you cherish the person *making* the effort. You see the virtue in the striving, not just some impossible ideal."

  **(The heartfelt conclusion)**
  "So, let’s raise our glasses. To [Bride's Name] and [Groom's Name]! May your life together be filled with the boldness to keep striving for your best selves, the wisdom to laugh lovingly at your perfectly human 'specks', and the deep, enduring joy of loving each other exactly as you are – axe heads, virtues charts, lost keys, and all. To the happy couple!"

  **Why this works:**

  1.  **Accessible Framing:** Introduces Franklin simply as *her* quirk ("unique relationship," "kept her own version"). Explains the core idea (striving for perfection, failing, accepting imperfection) in plain language using the "speckled axe" metaphor, which is vivid and relatable.
  2.  **History Nerd Nods:** Mentions the "Atlantic Enlightenment" seminar upfront (acknowledges them). Uses specific, accurate details (13 virtues, Order/Resolution as nemeses, the *exact* "speckled axe" metaphor, the Humility irony). The Humility line is the deepest cut but phrased conversationally so others still get the gist (trying to be humble makes you proud).
  3.  **Sentiment Over Lecture:** Every Franklin reference serves to illuminate *her* character: her dedication, her self-awareness, her ability to laugh at herself, her acceptance of imperfection. The focus is *always* on *her*.
  4.  **Avoids Roasting:** The references to Order/Resolution or "lost keys" are framed *affectionately* and *universally* (who *hasn't* lost keys?). It highlights her *endearing* humanity, not flaws. The tone is "Isn't this wonderful about her?" not "Look how messy she is."
  5.  **Core Message is Love & Acceptance:** The Franklin story becomes a metaphor for the love between the couple: loving the *real* person, effort and imperfections included. "Liking the speckled axe" becomes "loving her exactly as she is."
  6.  **Structure is Clear:** Friendship -> Her Quirk -> Franklin's Insight (Failure & Acceptance) -> How it Reflects Her Strength -> How Groom Loves Her For It -> Toast.

  **Key Delivery Tips:**

  *   **Speak to Her:** Make eye contact with her, especially during the parts about her qualities.
  *   **Pacing:** Don't rush the Franklin parts. Let the "speckled axe" line land. Pause slightly after the Humility irony for the history folks to chuckle.
  *   **Tone:** Warm, affectionate, slightly playful when referencing her quirks, deeply sincere during the sentiment about her character and their love.
  *   **"Might have the wording slightly off":** You got the "speckled axe" wording *perfectly*! The Humility anecdote is also spot-on. Confidence sells it.

  This approach uses the shared history as a rich, meaningful language to celebrate your friend authentically, without excluding anyone or turning her wedding toast into an academic presentation. Good luck! She’s lucky to have a friend who puts this much thought into celebrating her.
