prompt: |-
  Hey, I'm taking a seminar this semester that's basically "Political Philosophy: Augustine to Machiavelli," and we just spent two weeks on Aquinas on kingship and tyranny. I got kind of stuck on a passage from Book I of *De Regimine Principum* (the "On Kingship" treatise he wrote for the King of Cyprus) and was hoping you could help me untangle it, since my professor's office hours are booked solid till next week and the response paper is due before then.

  Here's the bit I'm stuck on (from the translation we use in class), from the chapter on whether private individuals may licitly kill a tyrant (chapter 6 in our edition, I think):

  "Now it might seem to belong to the courage of certain men that they slay tyrants, and expose themselves to the danger of death for the liberation of the multitude; and indeed we find this praised in the histories of the ancients, so that some who did such a thing received honors from their cities. Yet this does not accord with apostolic teaching. For Peter admonishes us to be subject to our masters with all fear, not only to the good and gentle, but also to the froward. Wherefore, since it would be a dangerous precedent for the multitude and its rulers alike, if any man, on his own private presumption, should attempt to kill those set over him, even under pretext of tyranny — for more often the wicked than the good avail themselves of such a precedent, and rulers come to fear the loss of their power more than they fear to rule badly, since even a good ruler may thus be slain by those who merely judge him a tyrant. Nor does the removal of a tyrant by this means commonly issue in liberty; rather those who remain, moved by a desire for vengeance, are often stirred up to a fiercer domination than before. It belongs not, therefore, to private presumption, but to public authority, to proceed against the wickedness of rulers."

  So a couple things about this are throwing me off. First, I honestly can't tell if Aquinas's real objection here is a matter of principle -- like private citizens just categorically lack the standing to judge and punish a ruler, full stop -- or if its really just a prudential, consequences-based worry about how this tends to go badly in practice. The passage seems to be leaning on both the 1 Peter quote and the "this backfires" argument at the same time, and I don't know if those are meant as two independent reasons or if one is doing the real work. Second, my professor mentioned offhand that in his earlier commentary on the Sentences, Aquinas says something like the opposite: that someone who kills a tyrant who seized power by usurpation (as opposed to a legitimate ruler who just governs badly) to free his country, when there's no one else to appeal to, is actually praised and rewarded for it. I vaguely remember something about a distinction between how a ruler gets his power versus how he uses it, but I don't really get how that's supposed to make the contradiction go away. Could you help me work out what's actually driving the argument in the passage above, and whether Aquinas's view is really consistent across the two texts or not?
