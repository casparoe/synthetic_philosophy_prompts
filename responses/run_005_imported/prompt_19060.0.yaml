prompt: |-
  So Lewis's Humean account of objective chance runs into the famous 'problem of undermining futures': since the chances at a time are just whatever the best system says they are, and the best system gets picked by how well it fits the entire history of the world (future included), there's always some tiny chance the future unfolds in a way that would've made a different theory the best system instead. Lewis tried to patch this in 'Humean Supervenience Debugged' with what he calls the New Principal Principle. Can you argue that the patch doesnt actually work, and that undermining is a real, unfixable problem for Humean chance/laws rather than just an annoying technical wrinkle?
reasoning: |-
  Okay, the user is asking about the problem of undermining futures in Lewis's Humean account of objective chance. They mention Lewis's attempt to fix it with the New Principal Principle in "Humean Supervenience Debugged," and they want arguments that this patch doesn't work. The user seems familiar with the topic, so they're likely a grad student or a philosopher working on metaphysics or philosophy of science. Their main need is for a clear, structured argument against Lewis's solution.

  First, I need to recall the basics. Humeanism says laws and chances supervene on the total physical history. The best system balances simplicity, strength, and fit. Fit involves chances: higher chance for actual events is better. Undermining futures are possible futures where the chance theory itself would be different because the future events make another system better. For example, a coin with 0.5 chance might land heads so many times that a different chance assignment fits better. 

  Lewis's New Principal Principle (NPP) adjusts how we relate credence and chance. It excludes undermining futures by conditionalizing on the complete theory of chance, T. So, credence in A given T and E should be T's chance of A given E. But the problem is that T isn't a physical event; it's a proposition about the pattern. So, when we condition on T, we're effectively using the chances defined by T to set credences, but T's truth depends on the future, which is problematic.

  The key issue is that T's truth involves the entire Humean mosaic, including the future. So, even if the current chances say that T is likely, an undermining future where T is false is still possible. The NPP avoids contradiction by making credence conditional on T, but it doesn't resolve the conflict with the original Principal Principle (PP). The PP expects current chances to guide credence about future events, including whether T remains true. But since T's truth depends on the future, the chance of T being false (undermining) is positive, say, 0.001. The PP would say you should have a 0.001 credence that T is false. But the NPP, by conditioning on T, forces you to have zero credence in undermining futures. So there's a mismatch: the chance theory T assigns a positive chance to its own falsehood, but the NPP forbids you from believing that falsehood could happen. This makes the NPP ad hoc because it's changing the rules just to avoid undermining, not based on deeper principles.

  Another point is that the NPP doesn't preserve the original motivation for the Principal Principle. The PP was about deferring to chances as objective guides. But if chances themselves depend on future events, then deferring to them becomes circular. The Humean account ties chances to future patterns, so they can't be independent guides. The NPP sidesteps this by conditioning on T, but it doesn't fix the underlying issue that chances are not metaphysically independent. 

  The user might also be interested in the broader implications. If undermining is unfixable, it suggests that Humeanism can't provide a robust account of objective chance. This challenges the whole project. The user might want to explore alternatives or understand why this is a deeper flaw. They might be looking for arguments to use in their own work, so providing clear, logical points is essential. 

  I should also address possible counterarguments. For example, Lewis might say the NPP is a revision based on new insights. But the response is that it abandons the core idea that chances should inform rational expectations independently. Also, the NPP makes chance-credence principles theory-relative, which might not align with how we use chances in practice. 

  In conclusion, the NPP avoids contradiction but doesn't resolve the tension between Humean chances and their role in guiding rational belief. The undermining problem reveals a fundamental conflict in the Humean framework, making it more than a technical issue.
answer: |-
  You're absolutely right to focus on the deep, structural problem undermining poses for Lewis's Humean account. While the New Principal Principle (NPP) in "Humean Supervenience Debugged" avoids outright *logical* contradiction, it fails to resolve the core metaphysical and justificatory issues, revealing undermining as a symptom of a fundamental flaw in the Humean conception of chance and laws. Here's an argument for why the NPP doesn't work and undermining is unfixable:

  1.  **Recap: The Undermining Problem & Lewis's NPP "Patch":**
      *   **Undermining:** According to Humeanism, the chances (and laws) at time *t* supervene on the *entire* Humean mosaic (past, present, *and future*). An "undermining future" is a physically possible future (consistent with the laws and chances at *t*) whose occurrence would mean that the *actual* best system (and thus the actual chances/laws at *t*) was *not* the best system. The chance theory T itself assigns a positive probability (say, ε) to futures that would make T false (i.e., not the best system).
      *   **The Contradiction (Old PP):** The original Principal Principle (PP) states that a rational agent's credence in proposition A, conditional on the chance of A being *x* and any admissible evidence E, should be *x*: `Cr(A | Ch_t(A) = x & E) = x`. If we let A be the proposition that an undermining future occurs (making T false), and E be the history up to *t* (H_t), then: `Cr(~T | Ch_t(~T) = ε & H_t) = ε`. But since T *is* the true chance theory (by definition, for the Humean, at *t*), `Ch_t(~T) = ε` *entails* T (because T says `Ch_t(~T) = ε`). So we have: `Cr(~T | T & H_t) = ε`. But `Cr(~T | T & H_t)` *must* be 0 (you can't rationally believe ~T while knowing T is true!). Contradiction: 0 = ε > 0.
      *   **Lewis's NPP Patch:** Lewis modifies the PP. The NPP states: A rational initial credence function should be such that: `Cr(A | T & H_t & E) = T(A)`. Here, T is the *complete* theory of chance for the world (specifying all the chances at all times). Crucially, T is treated as a "package deal" and is included in the conditioning proposition. This avoids the contradiction: `Cr(~T | T & H_t & E)` is undefined or 0 (since T is conditioned on), while `T(~T)` might be ε, but these are no longer directly equated in a way that forces 0 = ε.

  2.  **Why the NPP Doesn't Solve the Underlying Problem:**
      The NPP avoids the *syntax* of contradiction, but fails to address the *semantic* and *metaphysical* heart of undermining:

      *   **a) The Epistemic Cost: Abandoning Deference to Current Chance:** The original PP captured the profound intuition that *current objective chances* are the uniquely authoritative guides for rational belief about *future* outcomes. The NPP fundamentally abandons this. It tells you to defer to the chances *only once you already know the entire, complete, correct theory of chance T for your world*. But T, for the Humean, *depends on the future*.
          *   **Consequence:** Before knowing T (which requires knowing the future to confirm it's the best system), you *cannot rationally use the current chances alone* to set your credences about the future in the straightforward way the original PP allowed. The NPP severs the direct, local justificatory link between current chance and rational credence about the immediate future. This guts the core motivation for believing in objective chances as guides to the unknown.

      *   **b) T is Not Independent & Not Admissible (in the Intended Sense):** The original PP relied on the idea that information about current chance is "admissible" – it screens off other information about how the chance outcome comes about. Crucially, the chance was conceived as metaphysically *independent* of the future outcomes it governs.
          *   **Humean Reality:** For the Humean, T is *not* independent. T is *constituted* by the global pattern, including the future outcomes. Knowing T *tells you about the future* (at least probabilistically, and definitively about what the best system is). Conditioning on T smuggles in information about the future that *directly conflicts* with the probabilistic predictions made by T itself about its own survival.
          *   **The Conflict Remains:** While `Cr(~T | T & H_t)` = 0 is coherent, the problem is that *T itself says* `Ch_t(~T) = ε > 0`. This means T explicitly *predicts* (assigns positive probability to) futures that would falsify T. The NPP forces the agent, *once they know T*, to assign 0 credence to these very futures that T says are genuinely possible. The agent using the NPP is *internally conflicted*: their knowledge of T tells them undermining futures are possible (`Ch_t(~T) = ε`), but the NPP rule forces them to completely disregard this possibility (`Cr(~T | T) = 0`). This isn't rational coherence; it's epistemic compartmentalization enforced by fiat.

      *   **c) The "Best System" Status is Not a Physical Fact (in the Right Way):** Lewis treats T (the proposition expressing that a specific system is best) as part of the fundamental physical history upon which everything supervenes. But is it?
          *   **Best System is Evaluative:** Determining which system is "best" (simplest, strongest, best fit) involves *evaluative* judgments about simplicity and strength. These are not brute physical facts like particle positions; they are facts *about* the pattern. Including T in the supervenience base alongside H_t is including something fundamentally different – a global, evaluative summary *of* the base.
          *   **Circularity:** The justification for using T in the NPP relies on T being "true" because it's the best system *of the world*. But the agent is supposed to use T *to form expectations about the world* (including what makes a system best). There's a lurking circularity: you need to know the world (future) to know T, but you need T to know how to form expectations about the world (future). The NPP tries to jump straight to the endpoint (knowing T) but provides no rational path *to* knowing T based on accumulating evidence without presupposing the very Humean framework whose justification is in question.

      *   **d) The Loss of Objectivity (for the Agent):** The original PP gave a universal rule: *whatever* the chances are, defer to them. The NPP is relativized: defer to the chances *specified by T*. But *which* T? An agent doesn't start knowing T. The NPP provides no guidance on how to form credences *before* they are certain of T. Different hypotheses about T (different candidate best systems) will dictate *different* chance assignments and thus different credences via the NPP. The objectivity and universality of the chance-credence link is fractured.

  3.  **Why Undermining Reveals an Unfixable Problem:**
      The persistence of undermining, even after the NPP, points to a fundamental tension within Humeanism:

      *   **The Central Tension:** Humeanism seeks to ground objective chance (a modal, forward-looking, guiding notion) solely in the *actual global pattern* of particular, non-modal, occurrent facts (the Humean mosaic). Undermining arises precisely because the global pattern includes the future, and the chance theory T, defined by its fit to the *whole* pattern, must assign positive probability to patterns where *it itself* doesn't fit best. **Chance, under Humeanism, cannot be metaphysically independent of the outcomes it is meant to govern.** This is the core of the problem.
      *   **NPP as Symptom Management:** The NPP doesn't resolve this tension; it merely rewrites the rule for rational credence to avoid the syntactic contradiction *caused* by this tension. It doesn't change the underlying Humean metaphysics that *creates* the tension. It accepts that chance depends on the future and then tries to insulate the credence rule from the consequences of that dependence *after* the agent magically knows the full truth about that dependence (T).
      *   **Loss of Explanatory Power:** A successful account of objective chance should explain *why* rational agents defer to it. The original PP did this by portraying chance as an objective, independent guide. The Humean account + NPP struggles: it grounds chance in the global pattern, but then severs the direct, local justificatory link (original PP) that made deference intuitively rational. The deference rule (NPP) becomes a complex, relativized postulate justified only by its ability to avoid contradiction within the system, not by its independent intuitive plausibility or its ability to explain rational guidance. The "objective guide" becomes a self-referential artifact of the global pattern.

  **Conclusion:**

  Lewis's NPP successfully dodges a formal contradiction. However, it fails to solve the problem of undermining because it doesn't address the fundamental Humean commitment that makes undermining inevitable: **chance supervenes on the entire history, including the future.** This commitment:

  1.  Forces chance theories to assign positive probability to their own falsification.
  2.  Severs the direct, local justificatory link between current chance and rational credence about the immediate future (the core function of chance).
  3.  Creates an internal conflict for agents who know T: T tells them undermining is possible, but the NPP forces them to assign it credence 0.
  4.  Makes the chance-credence link (NPP) relativized, complex, and lacking the universal, objective authority of the original PP.

  Undermining is not merely a "technical wrinkle"; it is a symptom of the **impossibility of reconciling a genuinely guiding, objective modal notion like chance with a metaphysics (Humeanism) that reduces all facts to the non-modal, global pattern of particular occurrences.** The NPP papers over the symptom but cannot cure the underlying disease. It highlights, rather than resolves, the deep tension, making undermining an unfixable problem for the Humean account of laws and chance. The problem points towards the need for a more robustly modal or non-Humean foundation for objective chance if it is to play its traditional role in guiding rational expectation.
