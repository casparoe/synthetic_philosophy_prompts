  Regarding Lewis’s conclusion, the question needs to highlight his hedging. The follow-up should ask why his tu quoque is used as support when he’s clear it’s not a defense. Also, the user wants questions on whether penal substitution undermines responsibility. The follow-up here would challenge the transfer of guilt.

