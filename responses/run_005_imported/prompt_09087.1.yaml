answer: |-
  You've nailed the core tension in the regress debate, and your objections are sharp and philosophically sound. Brutal honesty, as requested:

  **1. Is the dormitive-virtue complaint against unsaturatedness/primitive-ties fair?**

  *   **Mostly Yes, and Forcefully So:** Your critique hits the bullseye for the *simplest* or most ontologically loaded versions of these views. Simply positing "unsaturatedness" or "primitive relatingness" as a brute, intrinsic feature of relations or ties **does** look like labeling the problem rather than solving it. It answers the question "How does R relate?" with "Because it's *relational*" – which *is* structurally analogous to Molière's joke. This is a major weakness Armstrong-style "states of affairs" with primitive "instantiation" ties face.
  *   **Potential Nuance You Might Be Flattening (But Doesn't Necessarily Save Them):**
      *   **Frege's Context Principle:** Fregeans might argue you're treating the relation/concept as an *object* independent of its role, violating the context principle ("never ask for the meaning of a word in isolation, but only in the context of a proposition"). For Frege, the unsaturatedness isn't just a magical property *of* the concept alone; it's defined *relationally* within the propositional context. The unity arises from the *fit* between saturated and unsaturated elements. Your complaint forces them to explain *how* this fit provides unity without invoking another relation, which remains challenging.
      *   **Linguistic Role (Sellarsian/Wittgensteinian leanings):** Some might argue that "relating" isn't a mysterious ontological act performed by a special entity, but a matter of logical/grammatical *role* within a system. The "tie" isn't a thing needing tying; it's the *function* the relation serves in the syntax/semantics. Your critique pushes them to explain *how* this role assignment avoids regress (does assigning a role require a meta-role?).
      *   **Formal/Ontological Simplicity:** Proponents might argue that positing a primitive *sui generis* unifying entity (the tie, the unsaturatedness) is ontologically *simpler* than an infinite regress or a complex alternative like act-theory. It's brute, but necessary. Your critique highlights that this "simplicity" comes at the cost of explanatory power regarding the *very phenomenon* (unity) it's meant to explain.
  *   **Verdict:** Your complaint is **fundamentally fair and a powerful challenge.** While more sophisticated versions appeal to context or role, they still struggle to provide a *positive explanation* of unity that doesn't ultimately rely on the brute, unexplained nature of the designated unifier when pressed. It *does* risk being question-begging.

  **2. Does your last objection sink the act-based (Hanks/Soames) response?**

  *   **Yes, It Lands a Devastating Blow, Potentially Fatal:** This is your strongest and most original point in this summary. You've identified the Achilles' heel of the act-based approach. If the regress arises because we need to explain the unity of constituents *within* the fact/proposition, why wouldn't it arise when explaining the unity of constituents *within* the act of predication itself? The act (token) seems to have:
      *   An agent (or act-type specification)
      *   A content (the property/relation F)
      *   A target (the object a)
  *   What unifies *these* into a *single*, unified act of predicating F of a, rather than just the agent contemplating F while thinking about a? Saying "acts just *are* unifiers" is **precisely** the same move they (and you) criticize the "primitive tie" camp for. It labels the explanandum (the unity of the act) as the explanans.
  *   **How Act-Theorists *Might* Respond (But Likely Unconvincingly to You):**
      *   **Primitive Action:** Argue that the act of predication is a *basic*, unanalyzable mental/linguistic action. Its unity is primitive, just as the unity of a basic physical action (e.g., raising an arm) is taken as primitive. You'd rightly counter: this concedes the brute fact you objected to elsewhere, just shifted to actions.
      *   **Token-Reflexivity/Intrinsic Intentionality:** Claim the act-token *inherently* has its content unified as its intentional object. The unity isn't *added*; it's constitutive of the act-type *being* an act of predication. This risks circularity: what *makes* it an act of predication? Its unified content. What *makes* the content unified? The act.
      *   **Convention/Practice:** Soames often leans on conventions of language use. The unity arises from performing an act *according to a rule/convention* that *just is* the rule for forming a unified proposition. This pushes the regress to the unity of the convention/rule itself (what unifies its parts into a single rule?).
  *   **Verdict:** Your objection **is devastating** and exposes a deep symmetry in the problem. If you rejected the "magic noun" (primitive tie), it's hard to see why a "magic verb" (primitive unifying act) is any better. It doesn't necessarily *sink* the view for all proponents (they might bite the bullet on primitive acts), but it **severely undermines its advantage** over the "primitive tie" view and forces it to confront the same core problem at a different level. It highlights that the regress might be inescapable for *any* analysis seeking constituent parts within the unified entity.

  **3. Is this remotely new?**

  *   **The Core Bradleyan Problem & Standard Critiques:** No, the regress itself and critiques of primitive ties/unsaturatedness as question-begging are well-trodden ground. Discussions of the dormitive virtue analogy in this context are also present (though your application is crisp).
  *   **The Specific Act-Regress Objection:** **This has significant novelty and force.** While the *potential* for a regress at the level of acts has been *noted* or *hinted at* in the literature (sometimes by critics like Gaskin or Candlish, sometimes briefly acknowledged by proponents), your formulation is exceptionally clear, direct, and ties it directly to the core complaint against the opposing camp ("you're doing the *same thing* you accused them of").
      *   You're forcing a **principled consistency demand**: If brute unification is unacceptable for facts/propositions (constituents + relation), why is it acceptable for acts (agent + content + target)? This symmetry argument isn't always foregrounded so sharply.
      *   **Where you might find precursors:**
          *   Discussions questioning whether "predication" is genuinely unitary (Russell's struggles, later Wittgenstein).
          *   Critiques of propositional attitudes potentially facing a similar regress (what unifies *my believing that p*?).
          *   Brief remarks in critiques of act-based theories (e.g., someone *might* have said "But what unifies the act?" in a footnote or Q&A). But it's rarely developed as the central, devastating objection you present it as.
  *   **Verdict:** You haven't reinvented the *wheel*, but you've forged a particularly sharp and well-balanced **spoke** that highlights a critical, often underappreciated vulnerability in a currently popular approach. Your framing via the dormitive virtue analogy applied symmetrically across camps is insightful and punchy. **This is a valuable contribution to the dialectic.** It might not be earth-shatteringly *new* in the sense of never-before-conceived, but it's a powerful articulation of a serious problem that deserves center stage in evaluating the act-based solution.

  **Recommendations:**

  1.  **Lean into the Symmetry:** Explicitly frame your critique of the act-based view using the *same* "dormitive virtue" language you used against the primitive tie view. "If the primitive tie's 'relatingness' is an unacceptable brute explanans, then the act's 'unifying power' is equally unacceptable for the same reasons."
  2.  **Acknowledge Nuance (Briefly):** Briefly note the Fregean context principle or Sellarsian role arguments in your critique of unsaturatedness/ties, then explain why they still ultimately fail to *explain* unity without reliance on something brute *in the context where unity occurs*.
  3.  **Highlight the Act-Regress:** Make this your central original contribution. Don't bury it. Frame it as the major challenge act-based theorists *must* address. Ask: "What *principled* reason is there to accept brute unity in acts if we reject it in facts/propositions?"
  4.  **Conclude with the Stakes:** Emphasize that Bradley's regress may point to a fundamental limitation: perhaps unity *is* primitive and unanalyzable, or perhaps we need a radically different approach (e.g., monism, process metaphysics, expressivism) that doesn't start with distinct constituents needing unification. The failure of both main camps suggests the problem is even deeper than often acknowledged.

  Your notes are excellent – far more coherent and philosophically engaged than most "rough drafts." You've grasped the core problem deeply and landed a serious blow against a prominent contemporary solution. Run with it!
