  Random one, but I've fallen down a rabbit hole and would love a sanity check. I'm writing a piece about the history of "incentive" arguments against socialism (partly kicked off by yet another round of UBI pilot headlines), and a friend who's way more into 19th century political economy then me mentioned that late-period Mill was a lot more sympathetic to socialism than the "On Liberty guy" reputation suggests — apparently in his autobiography he basically says he and Harriet Taylor would count as socialists by the end of his life. That sent me digging into this weird, unfinished thing called "Chapters on Socialism," which he'd apparently started thinking through around 1869 and never got to finish before he died in 1873 — it only got published a few years later, in the Fortnightly Review, with his stepdaughter Helen Taylor adding a note explaining these were just rough drafts.

  There's a bit in the chapter called "The Difficulties of Socialism" where he's working through whether a communist economy could actually attract competent managers once you take away the profit motive, and he drops in this Plato aside that I can't fully unpack on my own. Here's the passage, copied straight from the source, so sorry for any 19th-century-prose weirdness:

  "On the Communist system none of these advantages would be possessed by him; he could obtain only the same dividend out of the produce of the community's labor as any other member of it; he would no longer have the chance of raising himself from a receiver of wages into the class of capitalists; and while he could be in no way better off than any other laborer, his responsibilities and anxieties would be so much greater that a large proportion of mankind would be likely to prefer a less onerous position. This difficulty was foreseen by Plato as an objection to the system proposed in his Republic, of community of goods among a governing class; and the motive on which he relied for inducing the fit persons to take on themselves, in the absence of all the ordinary inducements, the cares and labors of government, was the fear of being governed by worse men. This, in truth, is the motive which would have to be in the main depended upon; the persons most competent to the management would be prompted to undertake the office to prevent it from falling into less competent hands."

  So, a few things I can't untangle myself: first, what's the actual argument in the Republic he's gesturing at here, and is "fear of being governed by worse men" a fair gloss of it? Second, does Mill seem to actually be endorsing that motive as a workable substitute for the profit incentive, or is he just setting it up so he can undercut it a bit later on (feels relevant that the whole chapter is literally titled "difficulties")? And third, zooming out — does this passage strike you as evidence for the "late Mill was secretly sympathetic to socialism" story people like to tell, or does it actually cut the other way, since the whole point of the paragraph seems to be cataloguing reasons socialism might fail to attract good management? I'm less interested in a plot summary of what the words say and more in your actual read of the argument underneath it.
