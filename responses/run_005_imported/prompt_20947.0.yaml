prompt: |-
  I've covered science and ideas for a regional daily for the better part of a decade, and I sit on our newsroom's standards committee, which meets next Tuesday to resolve a dispute that has been simmering since a correction we ran in the spring. A reporter's lede had flatly stated that a brief classroom writing exercise "closes nearly a third of the achievement gap between low- and high-income students," based on a single small randomized trial; a larger, multi-site follow-up has since found no detectable effect, and readers who had shared the original piece on social media were unhappy that we had reported an early, contested result as settled fact rather than as a hedged, attributed claim. The committee has since split into three camps over what should license a flat, unhedged assertion in our copy generally, as opposed to phrasing like "a new study suggests" or "according to researchers." One camp wants reporters held to whether the claim is actually true, period, regardless of what we could have known at the time. A second wants the bar to be that the reporter and the paper genuinely knew the claim when we published it — a bar the writing-exercise story clearly didn't clear. A third thinks both bars would silence most science and policy reporting and wants to license flat assertion whenever it was reasonable to believe the claim on the evidence available at deadline, even if that later turns out to be wrong.

  Could you draft the memo I'll circulate before the meeting? Recommend one standard, or an explicit hybrid, as our house rule, and show your work rather than just declaring a preference: apply it back to the writing-exercise story, then stress-test it against two cases the committee keeps getting stuck on. First, a single-site finding with a p-value of 0.03 that hasn't yet been retested anywhere else — is "statistically significant" close enough to "known," given how often single, barely-significant studies fail to replicate? Second, an investigative piece built on three separate sources inside an agency who, it later emerged, were all relaying the same unconfirmed internal rumor rather than verifying it independently — were we blameless in asserting it as fact even though it turned out false, and does the rule you're proposing actually agree? Please give the two camps you don't side with their strongest possible case before you set them aside, and close with the actual sentence you would add to the style guide.
reasoning: |-
  Okay, the user is a science journalist with a decade of experience, also serving on their newsroom's standards committee. They're preparing for a meeting to resolve a dispute about when reporters can make flat, unhedged assertions in articles. The issue stems from a correction they had to issue after reporting a claim from a small study as fact, which a larger study later debunked. The committee is divided into three camps: one focusing on absolute truth, another on what the paper knew at publication, and a third on reasonable belief based on available evidence.

  The user wants me to draft a memo for circulation before the meeting. They specifically ask me to recommend one standard or a hybrid, apply it to the writing-exercise case, then stress-test it against two challenging scenarios: a statistically significant single-site finding and an investigative piece based on multiple sources that turned out to be relaying the same rumor. I should also present the strongest case for the other camps before explaining why I reject them, and end with a style guide addition.

  I need to think about journalistic ethics and standards here. The core tension is between conveying information clearly and maintaining accuracy. Flat assertions can mislead if wrong, but excessive hedging can weaken reporting and confuse readers. The three camps represent different priorities: truth (even if unknowable), knowledge (requiring certainty), and reasonableness (pragmatic based on evidence).

  For my recommendation, I'm leaning toward the "reasonable belief" standard but with modifications. It's the most practical for daily journalism while still demanding rigor. The "absolute truth" standard is impossible since we can't foresee future replicability issues. The "knew" standard would paralyze science reporting where knowledge evolves. However, the "reasonable belief" standard needs safeguards against overconfidence.

  For the writing-exercise case, under my proposed standard, the original claim shouldn't have been stated flatly. The small trial size and lack of replication should have triggered hedging language. This directly addresses the committee's concern about presenting early findings as settled fact.

  For the stress-test cases: First, the single-site study with p=0.03 shouldn't warrant a flat assertion. Statistical significance alone doesn't equal truth, especially given replication crises. The language should reflect the preliminary nature. Second, for the investigative piece, my standard would still hold the paper accountable. Even with three sources, if they all echoed the same rumor without independent verification, it wasn't reasonable to present as fact. The rule would require more rigorous sourcing.

  I'll structure the memo to first summarize the dispute, then present each camp's strongest arguments before explaining why I favor the modified reasonable belief standard. I'll apply it to all three cases clearly, and end with a concise style guide addition that mandates hedging for non-established claims while allowing directness for widely accepted facts. This balances clarity with accountability, which seems crucial for the paper's credibility.
answer: |-
  ## MEMORANDUM  
  TO: Standards Committee  
  FROM: [Your Name], Science & Ideas Reporter  
  DATE: October 26, 2023  
  SUBJECT: Proposed Standard for Unhedged Assertions in Reporting - Pre-Meeting Briefing  

  **Background:**  
  Our dispute centers on when reporters may make flat, unhedged assertions (e.g., "X causes Y," "Program Z works") versus using attributed or hedged language (e.g., "a study suggests," "sources claim"). The classroom writing exercise correction highlighted the risks of presenting early or contested findings as settled fact. Three positions have emerged:  

  1.  **Camp 1 (Absolute Truth Bar):** An assertion is permissible *only if the claim is objectively and permanently true*, regardless of what was known at publication.  
      *   **Strongest Case:** Journalism's ultimate duty is to truth. This standard guarantees we never mislead readers, even unintentionally. It protects our credibility absolutely and avoids the reputational damage of corrections. If a claim isn't demonstrably eternal fact, it doesn't deserve unhedged presentation.  

  2.  **Camp 2 (Definitive Knowledge Bar):** An assertion is permissible *only if the reporter and paper definitively knew the claim to be true with high certainty* at publication.  
      *   **Strongest Case:** We control what we publish. This standard demands rigorous verification *before* publication, ensuring we only present as fact what we *know* to be fact based on overwhelming, incontrovertible evidence available *at that time*. It prevents hype, overreach, and the dissemination of fragile findings presented as rock-solid. The writing-exercise story failed precisely because we *didn't* know it definitively.  

  3.  **Camp 3 (Reasonable Belief Bar):** An assertion is permissible *if, based on the best available evidence rigorously assessed at the deadline, it was reasonable for the reporter and paper to believe the claim was true*.  
      *   **Strongest Case:** Journalism operates in real-time with imperfect information. Science and policy evolve. This standard allows clear, impactful reporting on new developments without paralyzing over-hedging, *while* demanding responsible assessment of evidence. It acknowledges that new evidence can overturn reasonable beliefs without implying original negligence, provided due diligence was done. The alternative bars would render most timely reporting on new studies, investigations, or emerging issues impossible or unreadable.  

  **Analysis & Recommended Standard:**  
  While Camp 1 (Absolute Truth) embodies an ideal, it is unworkable for dynamic news reporting. Camp 2 (Definitive Knowledge) offers strong protection but is overly restrictive for reporting on new research or unfolding events. **Camp 3 (Reasonable Belief), with critical refinements, offers the most practical and responsible framework.** However, it *must* be paired with rigorous protocols to prevent misuse:  

  1.  **Assessment Burden:** The "reasonable belief" must be demonstrable through documented assessment of the evidence's quality, source credibility, consensus (or lack thereof), limitations, and potential biases *at the time of writing*.  
  2.  **Proportionality:** The strength of the assertion must match the strength of the evidence. Extraordinary claims require extraordinary evidence. Single, small, novel, or contested findings *always* warrant attribution/hedging.  
  3.  **Transparency:** When reasonable belief is based on preliminary or limited evidence, context about that evidence (e.g., study size, methodology limitations, source access) should often be included nearby.  

  **Applying the Standard to the Writing-Exercise Story:**  
  *   **Assessment:** A single, small RCT is *never* sufficient evidence for a flat assertion about closing a major societal gap like the income achievement gap. This is well-established in social science methodology (replication crisis, small study effects).  
  *   **Conclusion:** Under the Reasonable Belief standard, **a flat assertion was *not* justified.** The reporter should have used attributed/hedged language (e.g., "A small randomized trial *suggests* that...", "*Researchers claim* a brief exercise *might* narrow..."). The available evidence was inherently preliminary and high-variance. Reasonable belief in the claim *as settled fact* was not supportable.  

  **Stress-Testing the Standard:**  

  1.  **Single-Site Study (p=0.03):**  
      *   **Question:** Can we state "Treatment X significantly improves Outcome Y"?  
      *   **Analysis:** A single study, barely achieving statistical significance (p=0.03), with no replication, is highly fragile evidence. The replication crisis shows such findings fail to replicate frequently. "Statistical significance" is a specific technical threshold; it does *not* equate to "known truth" or even "highly probable truth" in isolation.  
      *   **Standard Applied:** **A flat assertion is *not* justified.** Reasonable belief in the claim *as a definitive fact* cannot be formed on this basis alone. The language must reflect the preliminary and isolated nature: "A single study *found* a statistically significant improvement..." or "Researchers *report* that Treatment X *was associated with* improved Y in their initial trial..."  

  2.  **Investigative Piece (Three Sources, Same Rumor):**  
      *   **Question:** Were we blameless in asserting the rumor as fact? Does the standard agree?  
      *   **Analysis:** While three sources *seem* like strong corroboration, the critical failure was in source validation. Reporters did not establish that the sources had *independent* knowledge or were verifying the rumor through different channels. They were merely echoing the same unconfirmed internal chatter. Good practice requires probing *how* a source knows something.  
      *   **Standard Applied:** **Asserting the rumor as flat fact was *not* justified under Reasonable Belief.** Reasonable belief requires assessing the *quality* of the sourcing, not just the quantity. Relying on three sources all repeating the same unverified rumor, without establishing their independence or basis of knowledge, does *not* constitute reasonable grounds to believe the claim is *true*. It constitutes reasonable grounds to believe the rumor *exists and is circulating*. The reporting should have reflected this: "Multiple agency sources, speaking on condition of anonymity, *told this newspaper* that Z occurred," or "Internal agency communications *suggest* Z may have happened, according to three sources familiar with the matter." The standard holds us accountable for the *rigor of the sourcing process*, not just the eventual truth value.  

  **Proposed Style Guide Addition:**  

  > **Unhedged Assertions of Fact:** Reporters may state a claim as flat, unhedged fact only when, based on rigorous assessment of the best available evidence at the time, it was reasonable to believe the claim was true. This requires:
  >   *   **For Research Claims:** Overwhelming consensus, robust replicated findings, or established scientific law. Single studies, novel findings, or contested results *must* be attributed and/or hedged (e.g., "suggests," "indicates," "according to the study").
  >   *   **For Investigative/Informational Claims:** Multiple, independent, well-placed sources with direct knowledge or verified documentation. Corroboration must demonstrate independence of knowledge, not mere repetition of the same unverified claim. Extraordinary claims require extraordinary evidence.
  >   *   **Proportionality & Transparency:** The strength of the assertion must match the strength and nature of the evidence. Significant limitations or context (e.g., study size, source access) should be disclosed where relevant to the claim's reliability.
  >
  > **When in doubt, attribute or hedge.**

  **Recommendation:** Adopt the "Reasonable Belief with Rigorous Assessment" standard, formalized by the proposed style guide language. This balances the need for clarity and impact in reporting with the fundamental journalistic responsibilities of accuracy, verification, and humility in the face of evolving knowledge. It provides clear guidance for the writing-exercise case and the stress-test scenarios, demanding higher scrutiny for fragile evidence while enabling confident reporting on well-established or rigorously verified facts.  

  I look forward to discussing this at Tuesday's meeting.
