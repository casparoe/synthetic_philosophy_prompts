  Lewis treats the coin toss and the wakings separately. Initially, P(Heads) = 1/2, P(Tails) = 1/2. Given Heads, only Monday waking occurs. Given Tails, both Monday and Tuesday occur. So the probability of being in a waking moment where it's Heads is proportional to the number of wakings. There's one Heads-waking and two Tails-wakings. But Lewis's halfer view assigns P(Heads) = 1/2 upon waking, not 1/3. 

  The key is how Lewis conditions on centered propositions. When Beauty learns it's Monday, she eliminates the T-Tue possibility. So only H-Mon and T-Mon remain. Initially, P(H-Mon) and P(T-Mon) were each 1/3? But Lewis starts with P(Heads) = 1/2, which includes H-Mon. P(Tails) = 1/2 includes both T-Mon and T-Tue. Since T-Mon and T-Tue are equally likely under Tails, P(T-Mon) = 1/4? No, that doesn't fit. 

  Lewis's approach: Before learning anything, Beauty's credence is split equally among the three centered worlds: H-Mon, T-Mon, T-Tue, each 1/3. But as a halfer, he must reconcile this with P(Heads)=1/2. The issue is that P(Heads) = P(H-Mon) = 1/3 in this model, but Lewis wants it to be 1/2. Contradiction? 

  No, Lewis's halfer position is that upon waking, before learning anything, Beauty should assign P(Heads) = 1/2. But if there are three centered worlds, that would suggest 1/3. So how does he avoid that? 

  Lewis argues that the centered worlds are not equally likely. He assigns P(H-Mon) = 1/2, P(T-Mon) = 1/4, P(T-Tue) = 1/4. Because when Tails, the two awakenings are equally likely, but since P(Tails)=1/2, each gets 1/4. Then P(Heads) = P(H-Mon) = 1/2. 

  When Beauty learns it's Monday, she eliminates T-Tue. The remaining possibilities are H-Mon and T-Mon. Their probabilities are 1/2 and 1/4 respectively. Normalizing: total probability now is 1/2 + 1/4 = 3/4. So P(H-Mon | Monday) = (1/2) / (3/4) = 2/3. That's the derivation. 

  Now, the user's question about self-locating information shifting credence about a past coin toss. Lewis would argue that the self-locating information (it's Monday) is evidentially relevant because it affects which observations Beauty could be making. In this case, learning it's Monday makes it less likely that it's Tails, since Tails would imply it could be Tuesday, but it's not. So it's not directly about the coin; it's about the context of the observation. 

  Regarding the Principal Principle: Lewis holds that chances are time-dependent. After the coin toss, the chance of heads is 1 or 0. But Beauty's credence is about her epistemic state. The Principal Principle links credence to known chances, but since the chance is already settled, it doesn't apply directly. Lewis would say that Beauty doesn't know the outcome, so her credence is based on her evidence, which includes the self-locating information. So the Principal Principle isn't violated because it constrains initial credence based on known chances, but here Beauty has additional evidence. 

  As for the thirder position, it also faces a similar issue. If Beauty learns it's Monday, thirders assign P(Heads | Monday) = 1/2. But that still involves self-locating information affecting credence about the coin. However, thirders might argue it's consistent because the self-locating information is part of the relevant framework. 

