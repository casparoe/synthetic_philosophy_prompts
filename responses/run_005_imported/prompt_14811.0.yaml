  ## The Long Tableau

  **Setting:** Their book-cluttered living room after dinner. Wine glasses half-full. Rain streaks the windows.

  **Ines:** (Leaning forward, elbows on knees) Thomas, it’s not malice. It’s just… the data. Take Milgram. Two-thirds of ordinary people, presumably with ordinary ‘conscience’, deliver what they believe are lethal shocks because a man in a lab coat says so. Where’s the robust ‘virtue of compassion’ then? Or Darley and Batson – seminarians, *trained in compassion and moral theology*, stride past a man groaning in an alley because they’re *late to give a sermon on the Good Samaritan*. A dime in a phone booth makes people helpful; its absence doesn’t. Hartshorne and May showed honesty in children was barely better than chance across situations – copying a test, lying about chores, pocketing coins. It’s all *situation*, Thomas. The person? A wisp. Your ‘character’, the stable, cross-situationally consistent engine of virtue? An elegant fiction psychology keeps dismantling.

  **Thomas:** (Sighs, swirling his wine, a familiar dance) Ines, my love, you wield these studies like cudgels, but they strike at a caricature. Aristotle never claimed virtue meant robotic consistency irrespective of circumstance. That’s precisely *not* what *phronesis* – practical wisdom – is. It *is* situational sensitivity! The virtuous person *reads* the situation – the urgency, the authority, the apparent need – and acts *appropriately*. What looks like inconsistency to your statistical aggregates might be discernment. The seminarian *hastening* to deliver a vital message *judges* the groaning man less urgent. Is that failing courage or compassion, or exercising judgment under pressure? Your studies often create artificial, forced dilemmas stripping away the context wisdom requires.

  **Ines:** Discernment? Or convenient self-deception? That’s the rub, isn’t it? It becomes unfalsifiable. Any failure can be retrofitted as ‘poor judgment’ rather than an absence of stable character. But the *predictive power* is abysmal! If virtues were real, substantial traits, we’d see *some* correlation across diverse tests of honesty or compassion. Hartshorne and May found correlations near zero! Your ‘discernment’ looks statistically identical to… nothing. Just noise and situational pressure. The ‘virtuous’ person in one context is no more likely than anyone else to be virtuous in another. What’s left of the trait?

  **Thomas:** You mistake the map for the territory. First, Hartshorne and May measured specific *behaviors*, not the underlying *hexis* – the stable disposition cultivated over time. A child might be habitually truthful with parents but tempted to cheat on a test *precisely because* the virtue isn’t yet fully formed, not because virtue itself is a myth. Second, your predictive paradigm assumes virtue operates like a reflex, triggered identically everywhere. But *phronesis* involves deliberation! The lab, with its stripped-down, time-pressured, experimenter-defined choices, is terrible at capturing that. It measures knee-jerk reactions under duress, not cultivated judgment. It’s like testing a master carpenter’s skill by timing him hammering a single nail blindfolded.

  **Ines:** Ah, the ‘laboratory isn’t life’ defense! Convenient. But we *control* variables precisely *to* isolate the influence of the situation *from* some mythical internal constant. And what do we find? Overwhelmingly, the situation wins. The dime, the hurry, the white coat – *that’s* what flips the switch. Where is the internal governor? And don’t say ‘wisdom’ – because in Milgram, the ‘wise’ person, according to your tradition, *should* have seen the moral bankruptcy of the command. Yet most didn’t resist. The pressure crushed the supposed virtue. It demonstrates the *fragility* of any internal disposition when external forces align.

  **Thomas:** Fragility isn’t non-existence. Think of virtue as a *skill*, as some modern interpreters like Annas do. A skilled sailor reads the wind and currents; she doesn’t sail identically in every condition. A storm demands different actions than a calm. Does her skill vanish because she reefs sails in a gale? No. Similarly, virtue is the skill of living well. The Milgram participant isn’t ‘lacking virtue’ necessarily; they might be catastrophically *unskilled* in resisting illegitimate authority, or their perception of the situation – the experimenter’s legitimacy, the learner’s actual suffering – is warped by the lab context. It highlights a *failure* of *phronesis* under pressure, a lack of training or habituation in *that specific kind* of moral challenge, not the absence of character *per se*.

  **Ines:** But Thomas, the skill analogy only goes so far. Sailing skill predicts sailing competence across varied waters. Our ‘virtue skills’ show dismal cross-situational prediction. Your skilled sailor, if virtuous, should also be reliably kind, honest, courageous *in distinct domains*. But the data suggests someone ‘skilled’ in kindness at a dinner party might freeze or be cruel under stress or authority. Where’s the transfer? If virtue is a unified ‘skill of living’, shouldn’t competence in one moral area predict competence in others? Yet empirically, it barely does. The ‘skill’ seems incredibly domain-specific, fragmented… which brings us right back to the situation calling the shots, not some integrated character.

  **Thomas:** (Leans back, steepling fingers) You demand a unity and predictive power Aristotle never promised. Virtues *are* domain-specific skills – courage in battle differs from courage in speaking truth to power. They are unified only through *phronesis*, which integrates them *in the particular situation*. But cultivating justice doesn’t automatically grant perfect temperance; they require separate habituation. Your studies often test different virtues in wildly different contexts. Low correlation might simply reflect testing distinct skills! And crucially, you test people *in medias res*, often young, often untrained. Aristotle’s *spoudaios*, the truly virtuous person, is rare – the master sailor, not the novice. Do your studies seek out these paragons, or do they average across a population mostly still learning, or failing to learn, the skill?

  **Ines:** (A faint, tired smile) And there’s the escape hatch. The ‘true’ virtue is so rare it’s empirically invisible in our studies of actual humans. It becomes a theoretical ideal, disconnected from the messy reality psychology studies. What use is an ethics built on a phantom? And even if these paragons exist, the situational forces that derail the rest of us – the hurry, the authority, the dime – surely could derail them too. Milgram’s setup was *designed* to exploit obedience levers; would Aristotle himself have walked out? We can’t know. But history isn’t kind to the idea that wisdom always triumphs over power or expediency.

  **Thomas:** It’s not an escape hatch; it’s a call for realism about human development. Ethics isn’t descriptive psychology; it’s normative. It tells us what we *ought* to strive for, the skills we need to cultivate. The fact that the skill is hard, that situations can overwhelm the novice, doesn’t negate the skill’s reality or value. It just shows the path is steep. And as for Aristotle in Milgram… (He pauses, meets her gaze) …perhaps he would have failed. Or perhaps a lifetime of cultivating practical wisdom and courage *would* have given him the resources to question, to perceive the moral catastrophe more clearly than the clerk or the teacher did. We don’t know. But the *possibility* of that cultivated resistance, grounded in a stable character, is what the virtue tradition holds onto. It’s what makes striving meaningful, not just a game of situational dice.

  **Ines:** Meaningful… or tragically misguided? When the dice are so heavily loaded by the situation, maybe striving for a ‘character’ that can resist is like trying to build a dam with tissue paper. Maybe the ethical project is better focused on *structuring situations* to elicit good behavior – the dime in every phone booth, as it were – rather than chasing the will-o’-the-wisp of invariant inner virtue.

  **Thomas:** And if the structures fail? Or become tyrannical? Then you need the tissue paper dam. Thin, perhaps, but all that stands between us and the flood. We build the structures *and* we cultivate the character. To abandon the latter because it’s difficult or imperfectly realized… that feels like surrendering the core of agency.

  **Ines:** And demanding global consistency feels like ignoring the power of the moment. (She takes a slow sip of wine). Same tableaux, different frame.

  **Thomas:** (Nods, a mirror of her tired smile) Same argument, different costumes. Pass the bottle?

  **(The rain continues. The argument, for tonight, rests – unresolved, but deeply worn in its contours.)**

  ---

  **Word Count:** ~850

  **Key Elements Addressed:**

  1.  **Ines Opens Strong:** Uses Milgram (obedience), Darley & Batson (Seminarians/Good Samaritan), Isen & Levin (Dime/Helpfulness), Hartshorne & May (Honesty consistency) to press the empirical case against robust character traits.
  2.  **Thomas's Substantive Replies:**
      *   **Not Global Consistency:** Argues *phronesis* (practical wisdom) is inherently situational sensitivity, not its opposite. What looks like inconsistency might be discernment ("seminarian hastening... judges").
      *   **Lab Limitations:** Challenges the forced-choice, context-stripped lab paradigm ("measures knee-jerk reactions," "terrible at capturing deliberation," "testing a master carpenter blindfolded").
      *   **Virtue as Skill:** Invokes the virtue-as-skill literature ("Think of virtue as a *skill*") to explain context-specificity and the need for development ("cultivating justice doesn’t automatically grant perfect temperance").
      *   **The Rare Paragon:** Points out that studies average across populations, not focusing on the rare, fully developed *spoudaios* ("Do your studies seek out these paragons?").
      *   **Normative vs. Descriptive:** Distinguishes ethics (what we *ought* to strive for) from psychology (describing average behavior) ("Ethics isn’t descriptive psychology; it’s normative").
  3.  **Ines's Live Rejoinders:**
      *   **Unfalsifiability:** Counters Thomas's discernment argument as potentially unfalsifiable ("Any failure can be retrofitted").
      *   **Predictive Power:** Doubles down on the low cross-situational correlations ("predictive power is abysmal," "dismal cross-situational prediction").
      *   **Fragility:** Argues the studies show the *fragility* of dispositions under pressure ("The pressure crushed the supposed virtue").
      *   **Skill Analogy Limits:** Challenges the skill analogy by pointing to lack of transfer *between* moral domains ("shouldn’t competence in one moral area predict competence in others?").
      *   **Empirical Invisibility/Rarity:** Questions the usefulness of an ethics based on empirically elusive ideals ("The ‘true’ virtue is so rare it’s empirically invisible," "What use is an ethics built on a phantom?").
      *   **Structural Focus:** Proposes focusing on situational engineering rather than character cultivation as a practical alternative ("Maybe the ethical project is better focused on *structuring situations*").
  4.  **No Clean Winner:** Ends on a stalemate ("Same tableaux, different frame," "Same argument, different costumes"). Both points retain force.
  5.  **Familiarity & Nuance:** Dialogue shows deep familiarity (Thomas anticipating Ines's points, Ines having counters ready), avoids simple repetition, and allows their positions to develop slightly (e.g., Thomas ending on agency, Ines on situational power). Light stage directions establish tone without intruding.

  This dialogue aims to capture the intellectual rigor, the personal history, and the genuine unresolved tension at the heart of this philosophical and psychological debate. Good luck with the chapter!
