prompt: |-
  A friend and I were originally arguing about multiple realizability, of all things, and somehow ended up spending most of the evening on a much narrower question that neither of us could resolve: whether Sydney Shoemaker's "subset" account of realization actually earns non-reductive physicalists an escape from Kim's causal exclusion argument, or whether it just relocates the problem. My friend's position was that once you define realization so that a mental property's causal powers are, by construction, a proper subset of its physical realizer's causal powers, the exclusion worry simply evaporates: there is no longer a distinct, competing sufficient cause for the physical cause to screen off, since the mental instantiation isn't causally separate from the physical one in the first place, just narrower. She also insisted that this is basically the same move Stephen Yablo made years earlier with his determinable/determinate proposal, just dressed up in the language of causal powers instead of properties, so that anyone who accepts one should accept the other, and any objection to one is an objection to both.

  I wasn't so sure, on either count. On the first point, it seems to me that individuating a mental property partly by way of a strict subset relation to its realizer's powers risks either trivializing realization into type-identity wearing a nonreductive costume, or leaving the "included" powers unable to do any explanatory work that isn't already done by the superset, which just looks like exclusion again under a different name. On the second point, I recall that the determinable/determinate relation is supposed to satisfy some fairly specific formal constraints, e.g., that no two determinates of a single determinable can be co-instantiated, and that no property can be a determinate of more than one determinable, and I don't see why the mental/physical case, especially once multiple realizability is in play, is guaranteed to satisfy those constraints just because it satisfies the more permissive subset-of-powers condition. So it seemed to me the two strategies could come apart even though they're often presented as siblings.

  Could you help adjudicate this? I'd like you to (1) spell out as precisely as you can why a subset of causal powers is supposed to be immune to exclusion in a way that a merely correlated or supervenient property isn't, (2) assess whether the subset strategy and the determinable/determinate strategy really are notational variants of one another or whether they face distinct objections, and (3) tell me, with reasons, which of the two you find more promising as a response to Kim, or whether you think both ultimately fail for the same underlying reason.
reasoning: |-
  Okay, let me start by unpacking the user's query. They had a debate with a friend about Sydney Shoemaker's subset account of realization and whether it avoids Kim's causal exclusion argument. The friend thinks it does, while the user is skeptical. The user also questions if Shoemaker's approach is just a notational variant of Stephen Yablo's determinable/determinate model. They want three things clarified: why subset accounts avoid exclusion, if Shoemaker and Yablo are equivalent, and which approach is better.

  First, I need to recall the core of Kim's exclusion argument. Kim argues that if mental properties supervene on physical ones but are distinct, they either causally compete (leading to overdetermination) or are epiphenomenal. Shoemaker's subset view says mental properties have causal powers that are a subset of their physical realizers. This subset relation is meant to show that the mental isn't competing but is part of the physical cause. The friend argues this avoids exclusion because there's no separate cause to screen off.

  The user's skepticism comes from thinking this might trivialize realization into near-identity or leave mental powers unable to add explanatory value. They also doubt the equivalence with Yablo, pointing out formal constraints in determinables that might not hold in multiple realization cases. 

  For part one, I should explain how subset accounts aim to dissolve exclusion by making mental causation a component of physical causation, not a rival. The key is that the physical realizer's powers include the mental ones, so when the physical cause is active, the mental is too, without competition. But the user's worry about triviality is valid. If mental properties are just subsets, are they distinct enough? Shoemaker would say yes because different physical realizers can share the same subset, allowing multiple realizability. But then, if the subset is the same across realizers, does it have independent causal efficacy? This ties into the user's concern about explanatory redundancy.

  Moving to part two, comparing Shoemaker and Yablo. Both use part-whole relations: subsets for powers, determinates for properties. Yablo's model requires that determinates can't coexist under one determinable and no multiple determinables. But with multiple realizability, a mental property (like pain) can be realized by different physical states, each a determinate of the physical determinable. But is pain itself a determinate? If pain is a determinable with its own determinates (e.g., C-fiber pain, silicon pain), then it might fit. However, Yablo's constraints could be problematic if a single instance has both mental and physical properties as determinates under different determinables. The user's point here is strong—multiple realizability might violate Yablo's formal requirements, whereas Shoemaker's subset approach is more flexible. So they aren't exact equivalents.

  For part three, assessing which is better against Kim. Shoemaker's subset account handles multiple realizability better but faces the "explanatory drain" issue—if the physical realizer's powers include the mental, what unique role does the mental play? Yablo's model avoids some of this by making mental properties determinates, but struggles with the constraints when applied broadly. Both might still face a form of exclusion if higher-level properties don't add causal novelty. The user's underlying concern might be whether any non-reductive model can truly escape Kim without collapsing into reductionism.

  The user's deeper need is likely understanding if non-reductive physicalism can be salvaged or if Kim's argument forces reductionism. They might want clarity on whether these strategies offer a genuine solution or just relocate the problem. Addressing the core tension between distinctness and causal efficacy is key here.
answer: |-
  Here's a breakdown addressing your points systematically, drawing on the core arguments surrounding Shoemaker's subset account, Yablo's determinable/determinate model, and Kim's exclusion challenge:

  **1. Why the Subset Account Claims Immunity to Exclusion**

  Kim's Exclusion Argument (Simplified Core):
  *   (P1) **Completeness of Physics:** Every physical effect has a *sufficient* physical cause at time t.
  *   (P2) **Distinctness:** Mental properties (M) are distinct from their underlying physical realizer properties (P).
  *   (P3) **Supervenience:** M supervenes on P (no change in M without a change in P).
  *   (P4) **Exclusion Principle:** No event (or effect) can have more than one *sufficient* cause occurring at the same time (in the same causal chain) unless it is genuine overdetermination (like two bullets).
  *   (Conclusion): Therefore, M cannot be a *sufficient* cause of any physical effect (which already has P as its sufficient cause) unless M is identical to P (reductionism) or the effect is overdetermined. Overdetermination is deemed unacceptable for systematic mental causation.

  **Shoemaker's Subset Account's Proposed Solution:**
  *   **Core Idea:** A property M is realized by a property P iff the *forward-looking causal powers* (FLCPs) individuative of M are a (non-empty) *subset* of the FLCPs individuative of P. (M's causal powers are *contained within* P's causal powers).
  *   **Immunity Claim:** This subset relation dissolves the competition between M and P posited by (P4).
      *   **No Distinct *Sufficient* Cause:** M is *not* a distinct, competing *sufficient* cause for the effect (E) caused by P. Instead, M's causal contribution to E is *part of* P's causal contribution. When P causes E, it does so *in virtue of* possessing the powers that constitute M (along with potentially other powers). M's causing E is *not* an additional causal act over and above P's causing E; it's an *aspect* of that very same causal act.
      *   **Screening Off Avoided:** There is nothing for P to "screen off" M *from*, because M's causal powers are literally a component of P's causal machinery. Blocking P would necessarily block M, but that's because M's efficacy is embedded within P's, not because M is causally irrelevant. P's causing E *entails* M's causing E.
  *   **Analogy:** Think of P as a Swiss Army knife and M as the corkscrew blade. The knife (P) causes the cork to pop (E). The corkscrew blade (M) also causes the cork to pop. But the corkscrew's causal power is *part of* the knife's causal powers. The knife doesn't "screen off" the corkscrew; the corkscrew's efficacy is *how* the knife exerts that specific power. There is no competition.

  **2. Subset vs. Determinable/Determinate: Notational Variants or Distinct?**

  *   **Similarities:**
      *   **Part-Whole Structure:** Both rely on a part-whole relation to avoid causal competition. Subset: Powers of M are *part of* powers of P. Determinable/Determinate: The determinate (e.g., P) is a *specific way* of being the determinable (e.g., M), inheriting and adding to its causal profile.
      *   **Avoiding Competition:** Both aim to show that M and P don't compete for causal sufficiency; M's causation is subsumed under P's.
      *   **Response to Kim:** Both directly target (P4) by denying that M and P are distinct sufficient causes in competition.

  *   **Key Differences & Why They Aren't Mere Notational Variants:**
      *   **Primitive Relation:** Yablo uses the *metaphysical* relation of determination (a property hierarchy). Shoemaker uses the *causal* relation of power subset-containment. This difference in grounding matters.
      *   **Formal Constraints (Your Crucial Point):** Yablo's determinable/determinate relation imposes stricter formal constraints:
          *   **Asymmetry:** Determinates imply the determinable, but not vice versa.
          *   **Incompatibility:** Co-specific determinates (e.g., Crimson, Scarlet) cannot be co-instantiated.
          *   **Determination Uniqueness:** A property is typically a determinate of *only one* immediate determinable (e.g., Crimson is a determinate of Red, not directly of Color).
      *   **Multiple Realizability (MR) Challenge:** MR is the core motivation for non-reductionism. Here's the rub:
          *   **Shoemaker (Subset):** Handles MR naturally. Different physical realizers (P1, P2) of the same M (e.g., pain) can have *different* total sets of causal powers, but each must have the *subset* of powers that define M. P1 and P2 are *not* determinates of each other or of M; they are different bases both containing M's powers. No formal conflict with determination constraints arises because it's not using that relation.
          *   **Yablo (Determinable):** Applying the determinable/determinate relation *directly* to M (as determinable) and P (as determinate) faces serious problems under MR:
              *   **Incompatibility Violation?** If P1 (C-fiber firing) and P2 (silicon state) are *both* determinates of M (pain), then (by incompatibility) P1 and P2 should not be co-instantiable. But MR says they *can* be instantiated in different systems at the same time without conflict. This isn't a *direct* violation (they aren't co-instantiated *in the same subject*), but it shows the model isn't capturing the realization relation MR requires. P1 and P2 are *different ways* to realize M, not different ways *of being M* in the same subject like Crimson and Scarlet are different ways of being Red.
              *   **Level Confusion:** Is M (pain) the determinable, and P1/P2 its determinates? But P1/P2 are *physical* properties, while M is *mental*. The standard determinable/determinate hierarchy (Color->Red->Crimson) is usually within a single ontological level (e.g., color properties). Applying it across mental/physical levels is metaphysically strained.
              *   **Alternative Yablo Interpretation:** Sometimes M is cast as the *determinate* (e.g., pain) of a physical determinable (e.g., "having some neural state or other"). But this physical determinable is wildly disjunctive and unlikely to be a genuine, projectible property with its own causal powers – violating the spirit of non-reductionism and the causal inheritance principle. Shoemaker's subset account avoids this by focusing on the powers of the *specific realizer* P, not a disjunctive physical property.

  **Conclusion on (2):** While both strategies share the core insight of a part-whole causal/metaphysical structure to avoid exclusion, they are **not mere notational variants**. Shoemaker's subset account, grounded in causal powers without the strict formal constraints of determination, is **significantly better suited** to handle multiple realizability. Yablo's model struggles to map the mental/physical realization relation cleanly onto the determinable/determinate structure without violating its core formal features or generating metaphysically dubious disjunctive properties.

  **3. Assessment: Which is More Promising Against Kim?**

  *   **Shoemaker's Subset Account:**
      *   **Strengths:**
          *   Directly addresses the causal competition worry via power containment.
          *   Elegantly handles multiple realizability.
          *   Grounded in a plausible metaphysics of properties defined by causal powers.
      *   **Weaknesses (Your Worries):**
          *   **"Trivialization" / Explanatory Drain:** This is the most serious objection. If M's powers are *just* a subset of P's powers, what distinct causal/explanatory work does M *add* beyond what is already explained by P? If P is doing all the work *including* the work M is supposed to do, invoking M seems explanatorily redundant. This risks collapsing into a form of causal reductionism or epiphenomenalism "from below," even if M is ontologically distinct. Kim would argue the exclusion problem reappears as an *explanatory exclusion* problem.
          *   **Individuation Reliance:** The account relies heavily on a specific, potentially controversial, theory of property individuation (solely by forward-looking causal powers).
          *   **"Proper" Subset Requirement:** If M's powers are a *proper* subset, P has extra powers. Why don't *those* powers screen off M's contribution? Shoemaker needs to argue that M's *specific* subset is what's relevant for causing E, but this requires careful handling of causal relevance vs. sufficiency.

  *   **Yablo's Determinable/Determinate Account:**
      *   **Strengths:**
          *   Captures an intuitive metaphysical hierarchy.
          *   Can (in principle) avoid causal competition via the determination relation.
      *   **Weaknesses:**
          *   **Poor Fit with MR:** As argued above, it struggles significantly with multiple realizability, failing to capture the relationship between M and its diverse physical realizers within the constraints of the determinable/determinate relation.
          *   **Disjunctive Determinable Problem:** Avoiding the level confusion often leads to positing implausible, causally inefficacious physical determinables.
          *   **Formal Constraints:** The required asymmetry, incompatibility, and uniqueness are difficult to satisfy for cross-level realization.

  *   **The Underlying Challenge (Why Both Might Ultimately Struggle):**
      Both strategies, and indeed most non-reductive physicalist responses to Kim, face a fundamental tension identified in your "trivialization" worry: **The Causal Inheritance Dilemma.**
      1.  If the mental property M *inherits* all its causal powers *wholly* from its physical realizer P (as both subset and determinate accounts require), then it's hard to see what *distinctive* causal work M does that isn't already done by P. This leads to explanatory exclusion or reductionism.
      2.  If M has *some novel causal power* not inherited from P, then this violates physical causal closure (P1) – the effect of this novel power wouldn't have a sufficient physical cause.

  **Verdict:**

  1.  **Against Kim's Exclusion Charge:** Shoemaker's **subset account is the more promising and robust strategy**. It directly targets the causal competition premise (P4) with a mechanism (power subset containment) that dissolves the threat of overdetermination *without* relying on metaphysically strained or MR-incompatible structures like Yablo's direct application of determinables/determinates. It provides a clearer *causal* picture of how M exerts efficacy via P.
  2.  **The Lingering Problem:** However, **both strategies (and non-reductive physicalism generally) arguably fail to fully escape Kim's deeper challenge** – the Causal Inheritance Dilemma. The "explanatory drain" or "trivialization" worry you raised is potent. If M's causal powers are just a subset of P's, or inherited via determination, then P seems to be doing all the heavy lifting. While this avoids *overdetermination*, it struggles to show how M has *explanatory autonomy* – why we need to talk about M *at all* for causal explanation if P suffices. This is where Kim pushes hardest: either M is causally/explanatorily redundant, or it violates physical closure. Shoemaker's account provides the best *framework* for trying to answer this (e.g., by arguing M captures a projectible *pattern* within P's powers relevant for certain explanations), but successfully defending the distinct explanatory value of M within this causal-power inheritance framework remains a significant philosophical hurdle. Yablo's account, due to its poorer fit with MR, has even more difficulty here.

  In essence: Shoemaker's subset account effectively neutralizes the *exclusion* part of Kim's argument by denying competition, making it the superior technical response. However, it (like other non-reductive strategies) still grapples with the deeper *explanatory relevance* challenge that Kim leverages to argue for reductionism or eliminativism. The battle shifts ground but isn't decisively won.
