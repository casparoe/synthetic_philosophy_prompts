  2. **Pragmatist:** Focuses on *their own current stakes* ("mortgage queue," "impending homelessness") *actually changing* whether Hannah *possessed* knowledge back then. The fact itself changed.  
  The punchline ("made that knowledge evaporate") only works if you understand pragmatic encroachment alters the *subject's epistemic state itself*, not just the attribution.
