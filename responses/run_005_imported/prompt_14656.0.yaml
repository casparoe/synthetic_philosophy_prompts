  First, Nora's core claim: the loop (everyday→smoky→rare→everyday) proves irrational preferences. Classic money-pump setup. But Owen counters with context—different criteria for different situations. Hmm, that feels plausible initially. People have situational preferences all the time (coffee vs tea depending on time of day).

