prompt: |-
  I first encountered van Fraassen's Reflection Principle in a rationalist-community discussion of whether a self-modifying agent should defer to the credences of its future self, where it was glossed as a cousin of David Lewis's Principal Principle: both fit the schema Cr(A | X = r) = r, with X being your own future credence in one case and the objective chance in the other. Compare the two principles directly, weighing the "admissibility" restriction Lewis places on any additional evidence against the restriction van Fraassen needs — namely, that the agent not anticipate memory loss, manipulation, or a lapse into irrationality between now and then — and judge which restriction is doing more principled work rather than simply patching over known counterexamples. Then take a position, and defend it: is Reflection best understood as a special case of some suitably generalized Principal Principle, or are the two independent principles that merely happen to share a common form?
reasoning: |-
  Okay, the user is asking about van Fraassen's Reflection Principle and how it compares to Lewis's Principal Principle. They want me to analyze the restrictions each principle uses ("admissibility" for Lewis vs. "no anticipated irrationality" for van Fraassen) and determine which restriction is doing more principled work. Then I need to take a position on whether Reflection is a special case of a generalized Principal Principle or if they're independent principles that just share a form.

  First, I should recall both principles clearly. The Principal Principle says that if you know the objective chance of A is r, then your credence in A should be r, unless you have inadmissible evidence. Admissible evidence is stuff that's already accounted for in the chance, like historical data. Inadmissible would be future events or inside information.

  The Reflection Principle says that your current credence in A, given that your future credence at time t will be r, should also be r. But there's a restriction: you shouldn't anticipate memory loss, manipulation, or irrationality affecting your future self. Without that, Reflection can lead to absurd results, like if you know you'll be drugged tomorrow and believe something crazy.

  Now, comparing the restrictions. Lewis's admissibility is about the nature of evidence—whether it's the right kind to override chance information. It's based on the idea that chances are expert functions, so unless you know more than the chance, you should defer. The restriction is integral to defining what chances are supposed to do: summarize past and present info without predicting future specifics.

  Van Fraassen's restriction, on the other hand, feels more like a patch. It's listing specific scenarios where your future self isn't reliable—memory loss, manipulation, irrationality. But it doesn't provide a deep reason why those are the exceptions. It's as if Reflection assumes that future selves are rational and continuous by default, and the restriction just carves out known counterexamples. That seems less principled than Lewis's approach.

  The user wants to know which restriction is doing more work. Lewis's admissibility seems more foundational—it's tied to the role of chances as information summarizers. Van Fraassen's restriction is necessary but feels reactive, added because without it, the principle fails in obvious cases. So Lewis's restriction is doing heavier lifting in defining the scope of his principle.

  Next, should Reflection be seen as a special case of a generalized Principal Principle? If we think of the future self as an expert, similar to how chances are experts, then maybe. A generalized principle could be: defer to an expert's credence, where experts could be chance functions or rational future selves. But the restrictions differ. For chances, admissibility is about evidence types. For future selves, it's about maintaining rationality and continuity.

  But the future self isn't an objective expert like chance. It's you later. The trust comes from diachronic rationality—your future self has more info, so if you're both rational, you should align. Whereas chance is an external authority. So while both principles involve deference, their foundations differ. Reflection is about self-trust over time, while Principal is about trusting objective probabilities.

  So I think they're independent. They share a mathematical form, but the justification and restrictions come from different places. Reflection is rooted in epistemic rationality over time, while Principal is about aligning with objective chances. The common form is interesting, but they serve different purposes.

  The user is likely in philosophy or AI alignment, given the self-modifying agent context. They want a clear analysis to inform rational agent design. They might be looking for whether self-modifying agents should treat future selves as experts, similar to how they treat chances. Understanding if the principles are connected could help in building such agents.

  Defending independence: even if we force Reflection into a generalized deference framework, the core reasons differ. Reflection's necessity comes from avoiding self-undermining; you shouldn't think your future self will be wrong. Principal's necessity is about respecting objective information. So while similar, they aren't the same principle. The restrictions highlight this—Lewis's admissibility is about evidence flow, while van Fraassen's is about rational integrity over time.
answer: |-
  ### Analysis of van Fraassen's Reflection Principle vs. Lewis's Principal Principle

  Both principles share the formal structure \( \text{Cr}(A \mid X = r) = r \), but their interpretations and restrictions reveal fundamental differences in their foundations and purposes. I argue that **Lewis's Principal Principle (PP) is more deeply principled**, while van Fraassen's Reflection Principle (RP) relies on a less foundational restriction. Ultimately, **the principles are independent**, sharing a common form but arising from distinct epistemic concerns.

  ---

  ### **1. Core Principles and Restrictions**
  #### **Lewis's Principal Principle (PP)**  
  - **Core claim**: If an agent knows the objective chance of \(A\) is \(r\), their credence in \(A\) should be \(r\), provided they have no *inadmissible evidence*.  
    \[
    \text{Cr}(A \mid \text{Ch}(A) = r \land E) = r
    \]  
    where \(E\) is admissible evidence.  
  - **Admissibility restriction**:  
    - Admissible evidence: Information "screened off" by chance (e.g., historical data).  
    - Inadmissible evidence: Direct information about \(A\)'s outcome (e.g., future-telling oracles).  
  - **Purpose**: PP grounds subjective credences in objective chances. Admissibility ensures chance functions act as "expert probabilities" (Lewis, 1980), encoding all *past*-contingent information.

  #### **van Fraassen's Reflection Principle (RP)**  
  - **Core claim**: An agent should defer to their future credence in \(A\), provided they anticipate no *rationality-compromising changes*.  
    \[
    \text{Cr}_{\text{now}}(A \mid \text{Cr}_{\text{future}}(A) = r) = r
    \]  
  - **Restriction**: The agent must not expect:  
    - Memory loss, manipulation, or irrationality.  
    - Van Fraassen (1984) frames this as "no anticipated cognitive disturbance."  
  - **Purpose**: RP enforces diachronic coherence. Future you is a "better-informed self," so deference avoids self-undermining.

  ---

  ### **2. Comparing Restrictions: Which Does More Principled Work?**
  #### **Lewis's Admissibility**  
  - **Principled foundation**: Admissibility is intrinsic to PP's role. Chances are *defined* as summaries of historical/physical information. Inadmissible evidence violates chance's causal role (e.g., knowing \(A\)'s outcome renders chance irrelevant).  
  - **Theoretical necessity**: Without admissibility, PP collapses (e.g., if you know \(A\) will occur, \(\text{Cr}(A) = 1\) regardless of \(\text{Ch}(A) = r\)). The restriction isn't a patch—it defines chance's jurisdiction.  

  #### **van Fraassen's Rationality Restriction**  
  - **Pragmatic patch**: The restriction lists *contingent failures* of future rationality (memory loss, etc.). It reacts to counterexamples rather than flowing from RP's core idea.  
    - *Example*: If you expect to be drugged tomorrow, \(\text{Cr}_{\text{future}}(A)\) isn’t your "true" future self.  
  - **Weaker foundation**: RP assumes future credences are *rational updates* of current ones. The restriction merely excludes cases where this assumption fails. It doesn’t explain *why* rational future selves deserve deference—it stipulates it.  

  **Verdict**: **Lewis's restriction does more principled work**. Admissibility is central to PP's coherence as a bridge between objective chance and subjective belief. RP's restriction is defensive, insulating the principle from obvious failures.

  ---

  ### **3. Is Reflection a Special Case of a Generalized Principal Principle?**  
  **No—the principles are independent**, though they share a deference structure. Here’s why:  

  #### **Argument for Independence**  
  - **Different epistemic roles**:  
    - **PP** is *external*: It defers to objective chances (mind-independent facts).  
    - **RP** is *internal*: It defers to one’s own future epistemic state (mind-dependent).  
    Chances and future selves aren’t interchangeable. Chances are metaphysical; future credences are epistemological.  
  - **Distinct justifications**:  
    - **PP** is justified by chance’s role as an "expert function" (Joyce, 2007).  
    - **RP** is justified by diachronic rationality: Deferring avoids self-trust conflicts (Briggs, 2009).  
  - **Generalization attempts fail**:  
    - One could propose a "Generalized Deference Principle":  
      \[
      \text{Cr}(A \mid \text{Expert}_E(A) = r) = r
      \]  
      where \(E\) is an "expert" (e.g., chance or future self).  
    - **Problem**: The restrictions diverge.  
      - For PP, admissibility depends on evidence *type* (temporal/historical).  
      - For RP, the restriction depends on *rational integrity* (no cognitive decline).  
      These constraints aren’t unifiable—they reflect different concerns.  

  #### **Counterargument: A Unified View**  
  Proponents (e.g., Gaifman, 1988) might argue both principles reduce to trusting an "expert":  
  - Chances are *temporal experts* about events.  
  - Future selves are *informational experts* about evidence.  
  **Rebuttal**: This view ignores metaphysics. Chances are *ontic* (features of the world), while future credences are *doxastic* (features of reasoning). PP’s admissibility handles time asymmetry; RP’s restriction handles psychological continuity.  

  ---

  ### **4. Conclusion: Two Independent Principles**  
  - **RP is not a PP special case**. They share mathematical form but answer different questions:  
    - PP: How should beliefs align with *objective probabilities*?  
    - RP: How should beliefs align with *one’s own future beliefs*?  
  - **RP’s restriction is weaker**: It patches counterexamples, while PP’s admissibility defines chance’s scope.  
  - **Implications for self-modifying agents**:  
    - Deferring to future selves requires *trust in diachronic rationality*—not chance-like expertise.  
    - Violating RP implies anticipated irrationality; violating PP implies ignoring objective information.  

  **Final position**: The principles are parallel tools for different tasks. PP anchors beliefs to the world; RP anchors present beliefs to future beliefs. Their shared form is elegant, but their foundations diverge—a testament to how distinct epistemic problems can yield similar solutions.  

  ---
  ### References  
  - Lewis, D. (1980). *A Subjectivist’s Guide to Objective Chance*.  
  - van Fraassen, B. (1984). *Belief and the Will*.  
  - Briggs, R. (2009). *Distorted Reflection*.  
  - Gaifman, H. (1988). *A Theory of Higher Order Probabilities*.  
  - Joyce, J. (2007). *Epistemic Deference: The Case of Chance*.
