  Another point is Ramsey's focus on context and defeasible reasoning. Conditionals are tools for hypothetical reasoning, not immutable truths. Lewis's proof requires a universal probability function, but Ramsey might argue that belief updates are local and context-dependent. So the collapse Lewis describes wouldn't occur in practice.

