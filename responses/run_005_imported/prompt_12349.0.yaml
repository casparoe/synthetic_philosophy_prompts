  Also, Ramsey's concept of partial belief is subjective probability, but he saw it as a mental state affecting decision-making. Conditional probabilities for him are about updating beliefs, not propositional attitudes. So the Ramsey test might be a dynamic process, not a static identity. This could mean that P(if A, B) isn't meant to be equal to P(B|A) in a formal system but rather a method for evaluating conditionals in context.

