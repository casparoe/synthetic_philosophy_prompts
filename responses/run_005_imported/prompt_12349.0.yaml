  Ramsey's footnote is the basis of the Ramsey test, suggesting that to evaluate a conditional, you add the antecedent hypothetically to your beliefs and see if the consequent follows. But Lewis proved that equating P(if A, B) with P(B|A) leads to triviality under certain assumptions. The user mentioned that Priya thinks Ramsey's broader views might avoid this problem. So I need to explore Ramsey's other writings.

