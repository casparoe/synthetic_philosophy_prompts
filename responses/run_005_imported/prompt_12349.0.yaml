  Me and my friend Priya got into a whole argument last night about indicative conditionals, of all things (we'd both had a few beers, so make of that what you will). She's TA-ing a philosophy of language seminar this term and kept bringing up the "Ramsey test" -- you know, that footnote where Ramsey says that to work out whether you believe "if A, then B," you provisionally chuck A into your stock of beliefs and see what you make of B on that basis. I said that's basically just saying your degree of belief in the conditional equals your conditional degree of belief, P(B|A), and Priya said sure, informally, but that's exactly the identity Lewis later proved can't hold in general -- his triviality result, where trying to force P(if A, B) = P(B|A) for every rational credence function makes the whole probability assignment collapse into something degenerate. I said that seems like a real problem for the Ramsey-ish way of thinking about conditionals, she said I was definitly missing something about what Ramsey was actually committed to, and we never resolved it because it was 1am and neither of us could reconstruct the proof well enough to argue properly.

  So here's what I actually want from you. Ramsey died in 1930, decades before Lewis (or Adams, or Stalnaker) turned any of this into a formal treatment of conditionals, so he obviously never got to respond to the triviality results himself. Based on what he actually wrote about judgment, probability, and belief -- not just the one footnote everybody quotes -- how do you think he would've reacted if someone had shown him Lewis's proof? Would it have looked like a genuine refutation of his whole approach, or do you think his broader views (like whether "if A, then B" even expresses a proposition with a truth value in the first place) already gave him a way to sidestep it? I'm way less interested in a flat yes-or-no than in you actually reconstructing the reasoning he'd have used, given the rest of his philosophy.
