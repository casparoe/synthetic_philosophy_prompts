prompt: |-
  I'm a PhD student in philosophy drafting a dissertation chapter on the argument from contingency, and I've run into a snag reconstructing a key move in Samuel Clarke's 1705 Boyle Lectures, published as *A Demonstration of the Being and Attributes of God*. In Proposition II, Clarke tries to rule out an infinite regress of dependent beings as a possible stopping point for explanation, and he appears to offer two distinct arguments for this in quick succession. Here is the passage:

  "But, if we consider such an infinite progression as one entire endless series of dependent beings, it is plain this whole series of beings can have no cause from without of its existence because in it are supposed to be included all things that are, or ever were, in the universe. And it is plain it can have no reason within itself for its existence because no one being in this infinite succession is supposed to be self-existent or necessary (which is the only ground or reason of existence of anything that can be imagined within the thing itself, as will presently more fully appear), but every one dependent on the foregoing. And where no part is necessary, it is manifest the whole cannot be necessary — absolute necessity of existence not being an extrinsic, relative, and accidental denomination but an inward and essential property of the nature of the thing which so exists. An infinite succession, therefore, of merely dependent beings without any original independent cause is a series of beings that has neither necessity, nor cause, nor any reason or ground at all of its existence either within itself or from without. That is, it is an express contradiction and impossibility. It is a supposing something to be caused (because it is granted in every one of its stages of succession not to be necessarily and of itself), and yet that, in the whole, it is caused absolutely by nothing, which every man knows is a contradiction to imagine done in time; and because duration in this case makes no difference, it is equally a contradiction to suppose it done from eternity. And consequently there must, on the contrary, of necessity have existed from eternity some one immutable and independent being.

  Otherwise, thus: either there has always existed some unchangeable and independent being from which all other beings have received their original, or else there has been an infinite succession of changeable and dependent beings, produced one from another in an endless progression without any original cause at all. According to this latter supposition, there is nothing in the universe self-existent or necessarily existing. And if so, then it was originally equally possible that from eternity there should never have existed anything at all, as that there should from eternity have existed a succession of changeable and dependent beings. Which being supposed, then, what is it that has from eternity determined such a succession of beings to exist, rather than that from eternity there should never have existed anything at all? Necessity it was not because it was equally possible, in this supposition, that they should not have existed at all. Chance is nothing but a mere word, without any signification. And other being it is supposed there was none, to determine the existence of these. Their existence, therefore, was determined by nothing; neither by any necessity in the nature of the things themselves, because it is supposed that none of them are self-existent, nor by any other being, because no other is supposed to exist. That is to say, of two equally possible things, viz., whether anything or nothing should from eternity have existed, the one is determined rather than the other absolutely by nothing, which is an express contradiction. And consequently, as before, there must on the contrary of necessity have existed from eternity some one immutable and independent being."

  What I can't settle is the logical relationship between these two arguments. The first infers that the whole series lacks necessity from the fact that no member of it is necessary, and glosses this as showing that the whole would then be "caused absolutely by nothing." The second instead asks what could have determined the series to exist rather than nothing existing at all, and eliminates necessity, chance, and an external being as candidate answers. Are these meant as two independent proofs of the same conclusion, or is the second doing repair work for a weakness in the first? And, more importantly, is the first argument vulnerable to a fallacy of composition — inferring a property of the whole merely from its absence in every part — or does Clarke's talk of the whole being "caused by nothing" give him a legitimate, non-question-begging way to avoid that charge? I'd be grateful for help reconstructing the argument as charitably as possible.
