prompt: |-
  I'm teaching a graduate seminar on decision theory this term, and last week we covered updateless decision theory, using counterfactual mugging as the running example -- Omega flips a coin, tells you it landed tails, and asks you for $100, which would only have paid off for you in the counterfactual scenario where the coin landed heads and Omega rewards agents who'd have payed up. I told the class that what makes UDT distinctively "updateless," as opposed to causal or evidential decision theory, is that the agent's choice of action doesn't depend on what it actually observes: an updateless agent just carries out whatever policy was optimal relative to its original prior, full stop, rather than conditioning on the fact that its now looking at "tails" and re-deriving what to do from there. On my telling, that's the whole reason UDT agents pay up in cases like this -- they've essentially agreed in advance to be unmoved by whatever evidence later turns up, which is also supposedly why UDT outperforms CDT and EDT here: it trades responsiveness to evidence for better performance averaged across possible worlds.

  One of my students pushed back afterward with what I thought was a pretty good question: if that's right, isn't UDT less a theory of rational choice than a theory of rational precommitment, since a genuinely updateless agent couldn't adjust its behavior in light of new information even when it obviously should? I didn't have a great answer on the spot. So, is my gloss on what "updateless" means here basically right, and if so how do UDT's defenders block the charge that this makes it normatively bizarre -- or have I gotten the theory wrong somewhere along the way?
reasoning: |-
  Okay, let me start by unpacking the professor's question. They're teaching a graduate seminar on decision theory and covered Updateless Decision Theory (UDT) using Counterfactual Mugging as the example. The professor explained that UDT is "updateless" because the agent follows a pre-committed policy without updating on new evidence, which is why it pays in the mugging scenario. But a student challenged this, arguing that UDT seems more about precommitment than rational choice, since it doesn't adjust to new information even when it should. The professor is unsure if their understanding is correct and how to defend UDT against this critique.

  First, I need to verify the professor's explanation of "updateless." They said UDT agents don't condition on observations; they stick to the optimal policy based on the prior. That's accurate. The key point is that UDT evaluates entire policies, not actions per observation. So in Counterfactual Mugging, paying is part of a policy that maximizes expected utility across both coin flip outcomes, even though the agent only observes tails.

  The student's pushback is valid: if UDT ignores new info, isn't that irrational? The professor's dilemma is defending UDT's normative rationality here. I recall that UDT's defense hinges on the distinction between individual actions and holistic policy optimization. By precommitting to a policy, UDT avoids self-defeating behaviors in certain problems. For example, in Counterfactual Mugging, updating on tails would lead to not paying, but that policy has lower expected utility because it misses out on the heads payoff.

  I should also consider the "updateless" term. It doesn't mean never updating; it means the decision rule doesn't condition on the agent's current information state. The policy is chosen upfront to handle all possible observations. So when the agent observes tails, it follows the precomputed policy for that observation. The "update" is built into the policy's action mapping, not the optimization step.

  To block the charge of normative bizarreness, UDT proponents argue that in non-fully-observable problems, myopic updating can lead to losing out on counterfactual benefits. The policy approach ensures coordination across different branches. So it's not irrational but adapts rationality to broader contexts where decisions affect multiple scenarios.

  The professor might have conflated "not updating" with inflexibility. But UDT's policy can include different actions for different observations; it's just that the choice of which action map to adopt isn't revisited upon observation. That's the subtle difference. The defense is that this holistic method outperforms update-based theories in specific problems, making it rational in a consequentialist sense.

  I should also mention that UDT isn't always the go-to; it's particularly useful for logical uncertainty and agent coordination. For everyday decisions, updating is fine, but in edge cases involving predictors like Omega, precommitment avoids pitfalls. So the response to the student is that UDT handles a class of problems where conditional updates fail to maximize utility due to the agent's decision affecting counterfactuals.
answer: |-
  Your understanding of UDT's "updatelessness" is directionally correct, but the student's challenge highlights a crucial nuance that requires refinement. Let's break this down:

  ### 1. **Your Gloss: Mostly Accurate, but Needs Precision**
     - **Correct:** UDT *does* select an optimal policy **ex ante** (before observations) and executes it regardless of actual evidence. In Counterfactual Mugging, UDT pays because the *policy* of "paying if told tails" maximizes expected utility across *both* possible worlds (heads and tails), even though paying *seems* irrational after observing tails.
     - **Incorrect Implication:** UDT agents don't "ignore" observations. The policy itself **maps observations to actions**. When Omega says "tails," the UDT agent *uses that observation* to look up the precommitted action ("pay"). The "updateless" part refers to **not re-optimizing the policy after updating beliefs**.

  ### 2. **Why "Updateless" ≠ "Never Responds to Evidence"**
     UDT's core innovation is separating two levels:
     - **Policy Selection (Updateless):** Choose a function $f(O) → A$ that maps possible observations $O$ to actions $A$, maximizing expected utility over all possible worlds *weighted by the prior*. This happens *before* observation.
     - **Policy Execution:** Upon observing $O$, output $f(O)$. This *does* use the observation, but the mapping $f$ is fixed.

     In Counterfactual Mugging:
     - Policy 1: $f(\text{"heads"}) = \text{ignore}, \ f(\text{"tails"}) = \text{pay}$ → EU = $0.5 \times 0 + 0.5 \times (-100) = -50$  
     - Policy 2: $f(\text{"heads"}) = \text{ignore}, \ f(\text{"tails"}) = \text{ignore}$ → EU = $0.5 \times 0 + 0.5 \times 0 = 0$  
     - Policy 3: $f(\text{"heads"}) = \text{pay}, \ f(\text{"tails"}) = \text{pay}$ → EU = $0.5 \times 10,000 + 0.5 \times (-100) = 4950$  
     **UDT chooses Policy 3.** When told "tails," it pays *not because it's good now*, but because this action is part of the globally optimal policy.

  ### 3. **Blocking the Charge of "Normative Bizarreness"**
     UDT defenders argue it avoids **self-sabotage** caused by updating:
     - **The Fatal Flaw of Updating:** If you re-optimize *after* seeing "tails," you'd refuse to pay (since paying only helps in the counterfactual heads-world). But this leads to the *worse* policy (Policy 1 or 2). UDT binds you to the policy that *would have* maximized utility if Omega's coin were still uncertain.
     - **Rationality as Coordination Across Worlds:** In problems involving predictors (Omega), your action in one branch affects outcomes in *other* branches (via Omega's decision to reward based on counterfactuals). CDT/EDT myopically optimize within their actual world, failing to "coordinate" with counterfactual versions of themselves. UDT optimizes from the perspective of a timeless, aggregated agent.
     - **Consequentialism at the Policy Level:** UDT satisfies a broader consequentialist ideal: maximizing actual outcomes across the multiverse of possibilities. Refusing to pay in tails *feels* locally rational but is globally suboptimal.

  ### 4. **When UDT *Does* Adjust to Evidence (Clarifying the Nuance)**
     UDT *does* "adjust" in the sense that:
     - Its policy specifies *different actions* for different observations (e.g., paying only when told tails).
     - It *uses* observations to select the correct action from the policy.
     What it **doesn't** do is:
     - Recompute "what's rational now?" after seeing evidence.
     - Allow the *meaning* of rationality to change post-observation.

  ### 5. **Addressing the Student's Challenge: Precommitment vs. Rational Choice**
     The student is right that UDT resembles precommitment, but defenders argue it's the **only consistent way to be rational** in certain dilemmas:
     - **UDT as Generalized Rationality:** For UDT, "rational choice" means choosing the best *algorithm* for responding to inputs (observations), not best actions conditional on inputs. This is necessary when your decision algorithm itself is part of the environment (e.g., Omega simulates you).
     - **Failure Modes of Alternatives:** In Newcomb-like problems, CDT loses by not precommitting to one-boxing; EDT loses by not precommitting to ignore correlations. UDT systematizes precommitment to avoid these traps.
     - **When UDT *Would* "Update":** If new evidence reveals the world is *fundamentally different* from the prior (e.g., discovering Omega is a scammer), UDT would still follow its policy—but the original policy would have accounted for this possibility if probabilistically significant. Real-world UDT implementations often allow recomputing policies if priors are catastrophically wrong.

  ### Key Takeaway for Your Class
  UDT's "updatelessness" is **not blindness to evidence**, but **resistance to re-optimizing the decision rule after updating**. Its normative defense hinges on:  
  > *Rationality requires maximizing outcomes *across all possible worlds you might be in*, not just the world you observe. This necessitates fixing a policy in advance.*  

  This makes UDT uniquely powerful for problems involving **acausal trade** (e.g., with Omega), but it can seem "bizarre" in isolated, evidence-rich branches. The student’s challenge is valid—UDT *is* a theory of optimal precommitment—but its proponents argue this *is* what rationality demands when decisions have counterfactual consequences.
