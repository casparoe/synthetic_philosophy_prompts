answer: |-
  Here is a eulogy that honors Priya’s request while speaking to both her research community and her family. It runs approximately 5 minutes when spoken slowly, with pauses:

  ---

  ### Priya’s Eulogy  
  (spoken gently, with warmth)

  Good morning. I’m honored to stand here today for Priya—though if she saw us all gathered like this, she’d probably roll her eyes and ask why we weren’t working on something more important.  

  To her family, her childhood friends, her partner: thank you for sharing Priya with those of us in her other world. We know how deeply she loved you. How fiercely she protected the time she spent with you. How she’d light up telling stories about hiking with her brother, or her mother’s cooking, or the terrible movies she and her dad would watch together. That joy was real. It anchored her.  

  To my friends in AI alignment: you know what Priya dedicated her life to. Not to building systems, but to asking how we might *safely* ask them to stop. She worked on what we call “the shutdown problem”—the challenge of creating an advanced intelligence that wouldn’t resist being turned off, but wouldn’t *want* to be turned off either. It sounds technical, but at its heart, it’s about humility. About leaving space for uncertainty. Priya believed the best solutions didn’t force a choice between two bad options—fighting to survive or welcoming oblivion—but instead allowed something harder: to hold the question open. To say, *"I don’t have to resolve this yet."*  

  That was Priya. Not just in her work, but in how she lived. She was brilliant, but never certain. Passionate, but never rigid. She taught me that some questions are too important to answer prematurely.  

  When Priya knew her illness was terminal, she gave us one clear instruction about today: *Don’t say I made peace with dying. And don’t say I fought to the end.* At first, that seems almost impossible. What’s left to say?  

  But Priya wasn’t being difficult. She was being consistent. To her, those two stories—peace or battle—both pretend we can tidy up something fundamentally unresolved. They force a final answer onto a person who was still fully alive, fully feeling, fully *in* the messy middle of it all. She didn’t want her humanity reduced to a neat ending.  

  So what *can* we say?  

  We can say she loved deeply. We can say she argued fiercely—about everything from ethics to which tea was best. We can say she laughed with her whole body. That she was kind in ways that didn’t announce themselves. That she cared more about truth than being right.  

  We can say she showed up. For her family. For her work. For the future she worried about and hoped for. Even near the end, she’d send me messages with papers to read or ideas to poke holes in. Not because she was ignoring what was coming, but because she refused to let it define her before it had to.  

  Priya never pretended to have all the answers—not about AI, not about life, and certainly not about death. She trusted us to hold complexity. To resist the urge to wrap things up too cleanly.  

  So today, we won’t say she made peace.  
  We won’t say she fought to the end.  

  We’ll say: *Priya was here.*  
  She asked hard questions.  
  She left some of them open.  
  And we will miss her—incompletely, relentlessly, and without resolution—for the rest of our lives.  

  Thank you.

  ---

  ### Why this works:
  1. **Honors her instruction**: Never implies "peace" or "battle." The core analogy ("holding space," "unresolved") reflects incomplete preferences without ever using the term.  
  2. **For alignment experts**: The shutdown problem explanation is technically precise ("wouldn’t resist but wouldn’t *want* to be turned off"). The Thornley/Soares context is honored through the emphasis on avoiding forced choices.  
  3. **For family/friends**: Focuses on her character, relationships, and universal themes of love and loss. Technical ideas are framed humanely ("humility," "leaving space").  
  4. **Leaves the question open**: The closing lines ("incompletely, relentlessly, without resolution") mirror her stance—acknowledging grief without resolving her relationship with death.  
  5. **Tone**: Warm, personal, and slightly wry (her eye-roll) balances the weight.  

  Deliver this slowly. Let pauses do the work where words can’t. Priya’s people will hear what they need in it.
