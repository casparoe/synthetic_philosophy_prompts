answer: |-
  Here is a eulogy crafted to honor your mother's life, intellect, and specific metaphysical commitments, while offering genuine comfort grounded in her own worldview. It aims for approximately seven minutes spoken aloud.

  ---

  **Eulogy for [Mother's Name]**

  Good morning. Thank you all for being here to remember my mother, [Mother's Name]. To her students, colleagues, friends, and family – especially Dad – she was so many things: a brilliant thinker, a dedicated teacher, a fiercely loyal friend, and a woman whose laugh could fill a room. She had a way of making the complex feel accessible, the abstract feel immediate, and she did it all with a warmth and wit that made you feel seen and understood.

  Many of you here knew her primarily through that warmth, through shared meals, stories, her infectious enthusiasm for ideas, or her unwavering support. For you, her absence is felt deeply in the spaces she filled with her vibrant presence. Others here knew her deeply through her work, through the challenging, precise, and often surprising world of analytic metaphysics she inhabited and helped shape. She wrestled with fundamental questions: What *is* there? What makes a thing a single thing? When do many things become one?

  For the last quarter-century of her career, she defended an answer to what philosophers call the "Special Composition Question" that was both elegant and, to many, startlingly austere. She argued, with characteristic clarity and courage, that the only truly composite things – the only genuine *objects* built from simpler parts – are living organisms. Only when the activity of fundamental particles constitutes a *life* do they compose something new, something real in a fundamental sense. Rocks? Just particles arranged rockwise. Chairs? Arranged chairwise. And, as she would say with that characteristic, slightly wry smile whenever the inevitable objection arose, what remains after a life ends? Particles arranged... corpsewise.

  This wasn't a cold abstraction for her; it was a deeply held conviction about the structure of reality. Unlike some who hold similar views, she didn't reach for religious consolation or soften the edges. She faced the implications head-on, calmly and rationally. She understood that when the specific, intricate, self-sustaining process that was *her life* ceased, the unique composite entity that was *her* ceased to exist. Not transformed, not relocated, but simply... ended. There is no "she" persisting in some other form, no "body" separate from the life that animated it, no "her" to be "at peace." The process stopped.

  To those of us who loved her, that finality can feel stark, even brutal. And I know some of you listening, her philosophical colleagues, are keenly aware of this view and its implications. You might wonder how we speak of her now, in this moment of remembrance. Do we quietly borrow the comforting language of ordinary objects and persistence that her entire intellectual life was spent meticulously refusing? That would be a disservice to her intellectual honesty, to the fierce integrity with which she pursued truth.

  So, how *do* we find comfort, grounded in *her* understanding of the world?

  First, we find it by recognizing the sheer, astonishing *reality* of what *was*. That life, that specific, complex, dynamic process that was [Mother's Name], *really happened*. It wasn't an illusion. For decades, fundamental particles *were* arranged in that utterly unique, self-sustaining configuration that constituted *her life*. Think of the sheer improbability, the breathtaking complexity required for that arrangement to emerge and persist! It demanded constant activity, constant engagement with the world, fueled by air, food, thought, and love. It was a definite, bounded, magnificent thing – a genuine composite entity in a universe mostly filled with arrangements. *That* existence, *that* life, was real in the most fundamental sense she argued for. We mourn its definite end because its definite existence mattered so profoundly.

  Second, the particles persist. The fundamental simples that were caught up in that extraordinary process of her life haven't vanished. The laws of physics hold. They are released, returned to the vast, ongoing flux of the universe. They will be taken up elsewhere – into the soil, the air, perhaps eventually into other living things. There’s a quiet, natural poetry in that return, a continuity of the fundamental stuff of the universe, even as the unique, conscious configuration that was *her* is gone. It’s not *her* persisting, but the raw materials of existence cycling onward, as they always have.

  But third, and most importantly for us gathered here, we find comfort in what her life *composed* beyond her own physical boundaries. Because while she argued living organisms are the only fundamental composites, her life undeniably *caused* new things to come into being, things that persist and carry her imprint.

  *   She composed **understanding**. In her students – decades of them, some here today – she ignited sparks of curiosity, honed critical thinking, and instilled a respect for rigorous argument. That understanding lives on in their minds, shaping how they see the world. Particles are arranged *studentwise*, but the ideas they hold, the intellectual rigor they embody – that traces back to the life that was hers.
  *   She composed **love and connection**. Her warmth, her humour, her fierce loyalty – these weren't just fleeting arrangements. They caused real changes in the people around her. In Dad, in me, in her friends, in her family, she helped compose enduring bonds, shared memories, ways of being and relating. Our love for her, and the ways she taught us to love, are composite realities built from countless interactions *with* her life. We are different because her life touched ours.
  *   She composed a **legacy**. Her ideas, argued in journals and conference halls (often with that pointed "arranged corpsewise" remark), continue to shape debates, challenge assumptions, and inspire new thinking. Her intellectual vitality persists in the ongoing conversation of philosophy. Her influence is woven into the fabric of her field.

  The unique, conscious life that was [Mother's Name] has ended. That specific, miraculous composition is dissolved. We feel that loss with every fiber of our being. But the reality of that life while it lasted was absolute and magnificent. The fundamental stuff of the universe continues. And crucially, the complex, valuable things her life *brought into being* – the love, the understanding, the intellectual legacy, the changed lives – these are not mere arrangements. They are the real, persistent consequences of her existence. They are what she built *with* her life, and they endure.

  We remember her not as particles arranged corpsewise, but as the vivid, brilliant, loving, and utterly real life that she was. We celebrate the definite thing that *was*, and we find solace in the enduring compositions her life made possible in all of us. Thank you, Mom, for the life you lived so fully, and for everything you composed within ours.

  ---

  **Why this works:**

  1.  **Acknowledges Her View Explicitly & Accurately:** It clearly states her position (SCQ, life as the only composer, no artifacts/corpses) and its stark implications (no persistence, no "her" after death) without flinching, using her own terminology ("arranged corpsewise"). Philosophers will recognize this as taking her seriously.
  2.  **Refuses Forbidden Language:** It deliberately avoids phrases like "her body," "she is at peace now," "part of her lives on" *in the sense of personal identity*. It explains *why* that language is inappropriate according to *her*.
  3.  **Finds Genuine Comfort in Her Framework:**
      *   **The Definite Reality of Life:** Emphasizes the wonder, improbability, and definiteness of the life-process itself. It *was* real, it *was* magnificent, its end matters *because* it was so real.
      *   **Persistence of Simples:** Acknowledges the natural return of fundamental particles without implying *her* persistence. Offers a naturalistic sense of continuity.
      *   **Composition of Effects:** This is the key comfort mechanism. It shifts focus to what her life *caused* to exist or be composed *in the world* – understanding in students, love in relationships, legacy in her field. These are metaphysically acceptable "composites" (of ideas, relationships, influences) directly traceable to her life's activity. "Part of her lives on" becomes "the effects of her life persist."
  4.  **Balances Audience Needs:**
      *   **Philosophers:** Sees their viewpoint addressed rigorously. No hedging. Uses precise terminology. Validates the intellectual weight of her position.
      *   **Non-Philosophers:** Opens and closes with personal warmth and shared memories. Explains the philosophy in accessible terms ("fundamental particles," "specific, self-sustaining configuration"). Focuses the comfort on universal human experiences: love, memory, legacy, impact, the wonder of life itself. The "compositions" of love and understanding are deeply relatable sources of comfort.
  5.  **Structure & Tone:** Moves from personal remembrance to philosophical explanation, then to comfort derived *from* that philosophy, ending on a personal and uplifting note. The tone is respectful, loving, clear, and ultimately hopeful within the constraints she set. It feels like a eulogy, not a lecture.
  6.  **Honors Her:** It celebrates her intellect, integrity, warmth, humor, and impact precisely *through* the lens of her own deeply held convictions about reality.

  This eulogy allows you to stand before both your family and her colleagues, honoring your mother's memory with the intellectual honesty she valued while offering profound, meaningful comfort rooted in the very truths she dedicated her life to understanding.
