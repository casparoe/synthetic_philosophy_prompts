  First, I should recall what embedded agency entails. MIRI's work highlights issues like agents being part of their environment, self-modification, and model uncertainty. AIXI assumes a clean separation between agent and environment, which isn't realistic for embedded agents. For example, in real-world scenarios, the agent's actions affect its own computational resources. AIXI doesn't account for that.

