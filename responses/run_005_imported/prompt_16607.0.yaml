prompt: |-
  Me and a friend had a pretty long argument last night about embedded agency. He's way more into the ML side of things, and his big point was that AIXI already basically solves it — it's a Bayes-optimal agent that weighs literally every computable environment and just acts to maximize expected reward, so why do MIRI people keep treating "embedded agency" like some big open problem? He reckons AIXI already counts as an embedded agent, and the rest of that whole sequence (world-models, robust delegation, subsystem alignment, all that) is just relitigating something that already has a clean mathematical answer. Can you settle it for us — is there an actual gap that AIXI misses, or is my friend right that its just old wine in new bottles?
