answer: |-
  Here's a distillation of the key philosophical points on hypocrisy and standing, designed for clarity in your newsletter:

  **Paragraph 1 (The Core Distinction):**
  The key insight from the "standing to blame" literature is that hypocrisy doesn't magically erase the *wrongness of the original act*. If the politician did something bad (e.g., violated campaign finance laws), that act remains wrong *regardless* of who points it out. Losing standing to blame means the *hypocrite* loses the *moral authority* or *credibility* to level that specific criticism *themselves*. It's about the critic's compromised position, not the inherent nature of the criticized act. Think of it like a judge caught accepting bribes: they lose the right to sentence *others* for bribery, but bribery itself remains illegal. The charge against the other person doesn't vanish; it just can't legitimately come *from that particular hypocritical source*.

  **Paragraph 2 (Function & Avoiding Missteps):**
  Functionally, losing standing means the hypocrite's condemnation becomes ineffective or illegitimate *as a moral demand*. Their accusation rings hollow because they demonstrate they don't truly respect the norm they're invoking. This *isn't* simply the tu quoque fallacy ("you did it too, so it must be okay"), which wrongly suggests hypocrisy *justifies* the original wrong. Instead, the "standing" argument highlights how hypocrisy *undermines the hypocrite's role* in the moral community's process of holding each other accountable. The person criticized isn't "off the hook" morally; their wrong stands, and *others* (who aren't hypocrites on this issue) retain the standing to condemn it. The common trip-up is confusing the *invalidity of the hypocrite's voice* with an *absolution of the act* – they are separate issues. Hypocrisy silences *that particular accuser*, not the truth of the accusation itself.

  **Key Points Emphasized for Clarity:**
  1.  **Wrongness ≠ Standing:** The act's wrongness is independent of the accuser's hypocrisy.
  2.  **Target:** Losing standing targets the *hypocrite's authority to speak*, not the *validity of the norm* or the *wrongness of the act*.
  3.  **Not Absolution:** The criticized person is *not* morally excused by the hypocrisy of their critic.
  4.  **Not Tu Quoque:** This is *not* claiming "two wrongs make a right." It's claiming "your own wrong disqualifies *you* from being the one to call out *this* wrong."
  5.  **Others Can Still Blame:** The community (or non-hypocritical members) retains the standing to hold the wrongdoer accountable.

  This framework allows you to critique the pile-on *against the hypocrite* without implying the original act was acceptable – a crucial nuance for your piece. Good luck with the deadline!
