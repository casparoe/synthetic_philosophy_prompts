prompt: |-
  I'm a student member of my university's Honor Council, which decides academic-integrity cases through three-member panels that vote by majority; the bylaws say nothing about panel size in cases that could end in expulsion. Right after we covered the Condorcet Jury Theorem in my social choice seminar, a council member proposed enlarging panels to seven, on the grounds that adding more independent voters to a binary verdict drives the probability of a correct decision toward certainty, provided each panelist is more likely than not to be right. Skeptics counter that our panelists deliberate openly and tend to converge on the chair's reading of the evidence rather than voting independently, and that in the hardest cases -- where the evidence of intent is thin -- nothing guarantees any panelist clears 50 percent reliability, below which the theorem favors a smaller panel, not a larger one. Please draft the short decision memo I'll circulate before our next meeting: recommend a specific panel size and procedure for these cases, or an alternative to enlarging panels altogether, with reasoning solid enough that the skeptics could actually respond to it.
reasoning: |-
  Okay, the user is a student member of their university's Honor Council, which handles academic integrity cases. They're dealing with a proposal to increase panel sizes from three to seven members, based on the Condorcet Jury Theorem (CJT). The idea is that more independent voters could lead to more accurate decisions if each panelist is more likely than correct. But skeptics argue that in reality, panelists deliberate and often follow the chair's view, plus in tough cases, panelists might not even be 51% reliable. The user needs a decision memo to present before the next meeting, recommending a specific panel size or an alternative approach that addresses the skeptics' concerns.

  First, I need to recall the Condorcet Jury Theorem. It states that for a group of independent voters, each with a probability p > 0.5 of being correct, majority voting with more voters increases the chance of a correct decision. But if p < 0.5, adding more voters makes things worse. The theorem assumes independence and identical competence, which might not hold in real panels.

  The skeptics have valid points: deliberation can lead to groupthink, reducing independence. Also, in ambiguous cases, panelists might have p < 0.5. The user mentioned that evidence of intent is thin in hard cases, which could mean panelists are guessing, so p might be around 0.5 or less. If that's true, increasing panel size could backfire.

  I should consider the current setup. Panels are three members. If they're deliberating openly, maybe they're converging, which isn't independent voting. The proposal for seven members might not help if deliberation undermines independence. Also, ensuring each panelist is competent (p>0.5) is crucial, especially in complex cases.

  What alternatives are there? Instead of enlarging panels, maybe focus on improving panelist competence or structuring deliberations. Training could help, but in cases with thin evidence, it's tough. Another idea is using a supermajority requirement, which might be better when p is uncertain. Or implementing a multi-stage process with initial secret votes to preserve independence before deliberation.

  The memo needs to recommend a specific action. Enlarging to seven might not be the best. Sticking with three but adding measures to ensure independence and competence could be better. Or a hybrid approach: keep three-member panels but require unanimous or supermajority decisions in expulsion cases. That way, the burden of proof is higher, which makes sense for severe penalties.

  Also, training for panelists on recognizing biases and handling ambiguous evidence. Pre-deliberation secret ballots could capture independent judgments. The memo should address skeptics by agreeing that CJT assumptions might not hold and proposing solutions that mitigate those issues.

  The user's deeper needs: they want a reasoned recommendation that unifies the council. Solid reasoning that acknowledges both sides. The memo must be concise, evidence-based, and practical. Highlighting that in low p scenarios, smaller panels with higher consensus might be better. Also, procedures to maintain independence during deliberation.

  Final recommendation: maintain three-member panels for expulsion cases but require unanimity. Add pre-deliberation secret voting and enhanced training. This addresses reliability concerns, the risk of groupthink, and the severity of expulsion. It's a compromise that doesn't enlarge panels but strengthens the process.
answer: |-
  ## Honor Council Decision Memo: Panel Size for Expulsion-Eligible Cases

  **To:** Honor Council Members  
  **From:** [Your Name], Student Member  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on Panel Size & Procedure for Expulsion-Eligible Cases  

  Following discussion on the proposal to enlarge panels to seven members, grounded in the Condorcet Jury Theorem (CJT), and considering skeptical concerns about deliberation dynamics and panelist reliability, I recommend **retaining three-member panels but requiring a unanimous verdict for expulsion**, supplemented by procedural safeguards. Reasoning is outlined below.  

  ### Key Considerations & Reasoning
  1.  **CJT Limitations in Practice:**  
      While CJT theoretically supports larger panels *if* voters are independent and each has >50% reliability (p > 0.5), our process violates these assumptions:  
      - **Non-Independence:** Open deliberation risks groupthink and undue influence from the chair, diminishing independent judgment. Larger panels may amplify this effect, concentrating power in vocal members.  
      - **Uncertain Reliability (p):** In complex cases with thin evidence (e.g., ambiguous intent), panelists may operate near or below p = 0.5. CJT shows that when p < 0.5, larger panels *reduce* accuracy. Given the stakes, we cannot assume p > 0.5 universally.  

  2.  **Severity of Expulsion Warrants Higher Consensus:**  
      Expulsion is a life-altering penalty. A unanimous verdict (3/3) ensures:  
      - **Robust Certainty:** Forces thorough scrutiny of evidence and eliminates borderline decisions.  
      - **Mitigates Low-p Risk:** If individual reliability is uncertain, unanimity protects against wrongful expulsion better than a simple majority (2/3 or 4/7), which could err with lower confidence.  
      - **Procedural Legitimacy:** Demonstrates to the university community that expulsion requires incontrovertible agreement.  

  3.  **Procedural Safeguards to Address Skeptics:**  
      Retain three-member panels but enhance rigor:  
      - **Blinded Initial Voting:** Panelists submit written, independent verdicts *before* deliberation. This preserves independence while capturing initial judgments, addressing CJT’s independence criterion.  
      - **Chair Training:** Mandate training for chairs on mitigating bias, managing dominant personalities, and ensuring equitable deliberation.  
      - **Competency Focus:** Enhance training for *all* panelists on interpreting ambiguous intent and avoiding cognitive biases (e.g., confirmation bias).  

  ### Why Not Enlarge to Seven?
  - **Diminishing Returns:** Larger panels increase logistical burdens and deliberation time without guaranteed accuracy gains if p is low or deliberation suppresses independence.  
  - **Exacerbates Groupthink:** More members may heighten conformity pressure, countering CJT’s benefits.  
  - **No Bylaw Mandate:** Absent a bylaw requirement, expansion introduces unnecessary complexity.  

  ### Recommendation
  **For expulsion-eligible cases:**  
  - Maintain **three-member panels** with a **unanimous verdict required for expulsion**.  
  - Implement **pre-deliberation secret voting** to document independent judgment.  
  - **Refer non-unanimous cases** to a new panel or alternative resolution (e.g., mediated settlement).  
  - **Enhance training** on evidence interpretation and bias mitigation.  

  This approach balances statistical rigor, procedural fairness, and practical efficacy. It addresses skeptics by acknowledging CJT’s real-world constraints while leveraging unanimity to offset reliability risks. For non-expulsion cases, existing majority voting with three-member panels remains appropriate.  

  **Next Steps:** Vote at our meeting on adopting unanimity + safeguards for expulsion cases. Draft training modules and voting procedures will be circulated for feedback.  

  // Signature //  
  [Your Name]  

  ---

  **Key Responses to Potential Skeptic Questions:**  
  - *"Why not use larger panels *with* unanimity?"* → Unanimity in large panels is impractical and risks deadlock; 3-member unanimity is stringent but feasible.  
  - *"Doesn’t CJT still favor larger juries if p>0.5?"* → True, but we lack evidence that p>0.5 in hard cases, and deliberation undermines independence. Pre-voting mitigates this.  
  - *"What if unanimity is too hard?"* → Expulsion *should* be exceedingly difficult. Non-unanimous cases imply reasonable doubt, warranting a lesser penalty or retrial.  
  - *"Why not supermajority (e.g., 5/7)?"* → Unanimity prioritizes false-negative prevention (no wrongful expulsion), while supermajorities still risk error if p is low. Simplicity favors 3/3.
