prompt: |-
  Weird backstory but bear with me: my uncle passed in March and left me his three beehives, and I've gone full obsessive-hobbyist on bee biology ever since, like reading journal articles at 1am obsessive. Somewhere in there I fell into the fight over why worker bees die defending the colony -- kin selection (workers as vehicles for genes shared with sisters, via haplodiploidy) vs. the colony itself being a genuine unit of selection, a "superorganism." Apparently this is nowhere near settled, there was a whole Nature-paper blowup a while back that tried to knock down inclusive fitness theory and a ton of biologists signed on to a rebuttal.

  I run a tiny beekeeping podcast (like 40 listeners, dont laugh) and next month's guest is an evolutionary biologist who defends the multilevel/group-selection side. I don't want her just explaining group selection 101 though. Can you draft 8-10 questions that push past that? I want at least one on the "this is mathematically just the same Price equation covariance terms relabeled, so its bookkeeping not biology" objection, one on whether calling a hive a "superorganism" is doing real explanatory work or just smuggling in the conclusion, and one on what result -- if any -- could actually favor her framework over kin selection rather than being redescribable either way. For each question, add a quick follow-up calling out the dodge she's most likely to give.
