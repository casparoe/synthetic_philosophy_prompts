  ## Seminar Room Stalemate: Bent Shapes & Broken Wholes

  **Setting:** A sun-drenched seminar room. Philosophy grad students slump in worn chairs. DR. EVANS (late 50s, tweed, perpetually caffeinated) leans against the whiteboard. MAYA (Endurantist, earnest, gesturing emphatically) has just stood up from her chair to stretch. RAJ (Perdurantist, precise, finger tracing an invisible timeline on the table) watches her.

  **Dr. Evans:** ...so Lewis's problem remains: how can *one* thing, Maya herself, possess incompatible intrinsic properties – bent while sitting, straight while standing – without contradiction? Maya, your endurantist move?

  **Maya:** (Standing straight, arms wide) Exactly! I, Maya, am wholly present right now, standing straight. An hour ago, I, the very same Maya, was wholly present, sitting bent. The contradiction dissolves because *having a shape* isn't a simple, timeless intrinsic property. It’s *always* relative to a time. When we say "Maya is bent," we *really* mean "Maya is bent-at-t1." When we say "Maya is straight," it's "Maya is straight-at-t2." Different relations, same enduring object. No problem!

  **Raj:** (Leans forward) Hold on, Maya. That feels like linguistic sleight-of-hand. You start with the intuitive pull of intrinsics – properties an object has *in and of itself*, independent of anything else. Shape *feels* like that! But then, when confronted with change, you retreat to saying shape is *essentially relational* – it fundamentally involves a relation to a time. Isn’t that just *conceding* the perdurantist point? You’ve abandoned genuine intrinsic change! What changed *in Maya* between t1 and t2? According to you, at t1 she bears the "bent-at" relation to t1. At t2, she bears the "straight-at" relation to t2. But *Maya herself* hasn’t gained or lost an intrinsic property; she’s just standing in different relations to different times. That’s not change *in* the object; it’s just a variation *across* times in how she relates to them. You’ve traded the *metaphysics* of intrinsic change for a *semantic* trick with temporal indices.

  **Maya:** (Sits back down, deliberately bending her back) No, Raj! That misrepresents the experience. *I* changed. *This very thing* right here (taps her chest) was bent, and now *it* is straight. The relational analysis *captures* that change without multiplying entities. What changed *in me*? My material configuration changed relative to the temporal dimension! The relations *are* how the intrinsic property manifests over time for an enduring object. Saying "bent-at-t1" *is* describing how I was, intrinsically, at t1. It’s not a dodge; it’s the accurate description of *how* an enduring thing possesses temporary properties.

  **Raj:** But then, Maya, are you *ever* just plain bent? Right now, sitting, are you bent? Strictly speaking, on your view, no. You are *bent-at-this-particular-instant*. The 'bentness' isn't a simple monadic property you possess full-stop; it's inherently tied to *now*. It seems like you've dissolved the object's intrinsic nature *into* its relations to times. The 'core' Maya, the substance that endures, ends up being a bare particular that merely *acquires* different temporal relations. That feels empty. It loses the 'thickness' of genuine intrinsic character.

  **Maya:** (Eyes flashing) Empty? Look who's talking about losing the object, Raj! Your perdurantism dissolves *me*! Let’s grant your temporal parts: little Maya-slice-at-t1 (bent), little Maya-slice-at-t2 (straight). Fine. Now, point to *me*, the whole person who stood up, walked over there, and sat back down. Where is *she* in your ontology? According to you, *she* – the persisting Maya – is never bent and never straight! Only her instantaneous parts are. So when I say, "I was bent an hour ago," strictly speaking, that's *false* on your view! *I* wasn't bent; some past temporal part of me was bent. And *I*, the whole temporally extended thing, am a four-dimensional worm that has *both* bent parts and straight parts. But *I* never instantiate bentness or straightness *simpliciter*! That seems wildly counterintuitive. It denies the fundamental unity of the persisting subject experiencing the change. *I* feel the change, *I* remember being bent. Your view severs that connection. You haven't solved the problem of temporary intrinsics for *persons* or *objects*; you've just relocated the properties to different entities and dissolved the persisting whole that common sense says *has* the properties.

  **Raj:** (Nods slowly) The 'no one is ever really bent' charge. It's a powerful intuition pump, Maya. But consider the cost of preserving that 'whole object' at every instant. What about the boundaries of existence? Take *you* coming into existence. Was there a single, sharp, first moment where Maya the enduring substance popped into being? Or is it vague? If it's sharp, that seems arbitrary – why *that* nanosecond? If it's vague, then there were times when it was indeterminate whether Maya existed or not. That seems like brute ontological vagueness in the world itself – a fuzzy boundary to being itself. Perdurantism avoids this neatly! There's no enduring substance that magically appears. There are just temporal parts, arranged person-wise. The first Maya-part is definitely there. The collection of parts *before* that first one just isn't arranged Maya-wise. There's no need for a sharp cutoff *in the substance* or brute vagueness *about existence*; it's just a matter of when the right arrangement of parts begins. The vagueness in when 'Maya' begins is merely *semantic* or *conventional* – about when we *call* the sequence of parts a 'person' – not a deep ontological fuzziness. That’s a major advantage.

  **Maya:** (Leans back, thoughtful) Hmph. Vagueness. You think replacing an enduring object with temporal parts banishes vagueness? What about the boundaries of the temporal parts *themselves*? Is a temporal part sharply defined? Is there an exact, durationless point that is *the* t1-Maya-slice? Physics suggests spacetime might not be infinitely divisible like that. And even if it is, defining *which* aggregates of temporal parts count as *a* persisting object – like me versus my hand versus the chair – *that's* still vague! You've just shifted the vagueness from the *existence* of the enduring object to the *composition* of the perduring worm. Vagueness about parthood and composition is just as problematic as vagueness about existence. And I’d rather bite the bullet on *some* ontological vagueness at the edges of existence than accept that *I*, the thinking, feeling, remembering entity, am never wholly present and never truly possess intrinsic properties like shape at any moment. Your view sacrifices the phenomenology of persistence – the sense of being a unified whole *now* – to solve a technical problem and avoid vagueness, only to find vagueness lurking elsewhere.

  **Raj:** But the composition vagueness *is* different! It's about how we *classify* parts, not whether fundamental existence itself has indeterminate boundaries. The temporal parts themselves exist determinately. The enduring object's fuzzy boundaries *demand* ontological indeterminacy. And as for phenomenology... (sighs) yes, it feels like I'm wholly present. But feelings aren't metaphysics. Perdurantism explains *why* it feels that way – because we're aware of our *current* temporal part. Memory stitches the sequence together. It's a coherent, if counter-intuitive, story that resolves Lewis's problem cleanly: each temporal part *does* have intrinsic properties *simpliciter*. Bent-at-t1 is intrinsic to *part-t1*. Change is just qualitative variation along the temporal dimension of the whole.

  **Maya:** And I say my relational account resolves it just as cleanly, without fragmenting the object. Change *is* the enduring object bearing different intrinsic shape-properties *relative* to different times. The 'whole object present' intuition is preserved because it *is* present. Vagueness at temporal edges is a feature of the world, not a bug. Your 'clean resolution' comes at the cost of the persisting subject itself.

  **Dr. Evans:** (Clears throat as both fall silent, glaring slightly) And... there we have it. Lewis's problem remains a battlefield. Endurantism preserves the intuitive unity and presence of the persisting object but reconfigures temporary intrinsics as relations, raising charges of semantic trickery and ontological vagueness at temporal boundaries. Perdurantism provides a clear account of temporary intrinsics by distributing them to temporal parts but dissolves the persisting whole, denying it any momentary intrinsic properties and shifting vagueness to composition. Both claim to solve the problem; both pay a significant metaphysical price. Neither seems able to deliver a solution that fully satisfies our deepest intuitions about objects, properties, change, *and* persistence without significant cost. A genuine stalemate? For now, it certainly looks that way. Perhaps the problem reveals a tension within our very concept of an object persisting through time itself. Food for thought... and likely many more seminars. Dismissed.

  **(Maya stands up, straight, then bends to pick up her bag. Raj watches her, then looks down at the timeline still traced on the table. Neither looks entirely satisfied.)**

  **My Assessment:** This dialogue highlights why this debate remains unresolved after decades. Both positions *technically* solve the logical problem of temporary intrinsics, but at the cost of deeply held intuitions:
  *   **Endurantism** sacrifices the *absolute intrinsicality* of properties like shape and embraces (or struggles with) *ontological vagueness* at temporal boundaries to preserve the *unity and presence* of the persisting object.
  *   **Perdurantism** sacrifices the *momentary intrinsic character* of the *whole* persisting object and its *strict identity* through change to preserve the *absolute intrinsicality* of properties at instants and offer a (debatably) cleaner account of temporal boundaries by shifting vagueness to *composition*.

  **Is it a stalemate?** For the specific problem of temporary intrinsics *alone*, it's very close. Perdurantism has a slight edge in *technical elegance* – properties remain genuinely intrinsic (to parts), and change is just variation across parts. However, Endurantism has a strong edge in *phenomenological and commonsense fidelity* – it feels like *I* change, and *I* am here now. When we add considerations like vagueness of persistence, the scales don't tip decisively either way; the vagueness just relocates.

  **Who comes out ahead?** Neither emerges unscathed. The debate often hinges on which cost one finds more palatable or which intuition (unity vs. property intrinsicality) one prioritizes. Perdurantism often finds more favor in contexts influenced by relativistic physics (where spacetime is fundamental), while Endurantism resonates more with everyday experience and some substance ontologies. It remains a profound metaphysical puzzle with no uncontested solution. The stalemate is real.
