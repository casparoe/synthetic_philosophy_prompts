  ## Dispositions at Dusk: A Conference Bar Dialogue  
  *(Elena, defender of reformed conditional analysis, sips whisky. Ben, a Martin-inspired primitivist, swirls his beer. They’ve just left a talk on causal powers.)*

  **Elena:** Look, Ben, Lewis *fixed* Martin’s electro-fink. The problem wasn’t dispositions being irreducible—it was the *Simple Conditional Analysis* being naive. Saying “X is fragile iff *if* it were struck, it would break” fails because a fink—like Martin’s wire rigged to make glass non-fragile when struck—can mess with the stimulus. But Lewis’s reform nails it: add a *stable, intrinsic causal basis*. Fragility isn’t just the counterfactual; it’s the microstructural property (say, ionic bonds) that *grounds* the breaking when struck. No fink can instantly alter that basis.  

  **Ben:** *(Leans forward)* Oh, it patches the fink, sure. But what about Johnston’s masking? Take your fragile glass. Wrap it in protective foam—intact ionic bonds, stable causal basis present—but strike it. It *won’t* break. The counterfactual “if struck, would break” is false, even though the disposition and its basis are right there! Lewis’s analysis still says it’s *not* fragile. Absurd. The disposition is masked, not gone.  

  **Elena:** Fine, so we refine it: “X is fragile iff it has some intrinsic property P (the basis) such that, *if* X were struck *and no mask interfered*, it would break because of P.” The “unless masked” clause handles your foam. It’s not surrender—it’s acknowledging reality. Dispositions *can* be inhibited.  

  **Ben:** *(Taps his glass)* But Elena, that clause *presupposes* dispositions! What’s a “mask”? It’s something with the *power* to interfere with fragility’s manifestation. You’ve just smuggled in another disposition! It’s circular. Call it “mask,” “antidote” like Bird’s curare example, or “blocker”—you’re invoking *sui generis* causal powers to define *other* causal powers. Reduction fails.  

  **Elena:** Not necessarily. We can define masks non-dispositionally. The foam masks fragility because of its molecular structure—its *categorical* properties. Density, elasticity. No dispositions needed.  

  **Ben:** Really? And why does *that* structure *mask*? Because it has the *disposition* to absorb kinetic energy! You’re chasing your tail. Even in your electron example—your old stomping ground—charge isn’t *just* “would repel if another charge approached.” Put it in a Faraday cage (masking) or near a finkish field that flips polarity on approach (finking). The disposition persists through masking; it doesn’t vanish. Your conditional tries to capture a ghost by describing the room it haunts.  

  **Elena:** But science *uses* conditionals! We say an electron *has charge* because, *ceteris paribus*, it repels like charges. We isolate conditions. That’s not ghost-hunting—it’s methodology. Your primitivism makes dispositions inert, inexplicable. How do they *do* anything without a basis?  

  **Ben:** I don’t deny bases exist! The ionic bonds *realize* fragility. But the disposition itself—the *potential*—isn’t reducible to any “if-then.” It’s what *makes* the basis causal. Think of your electron: in condensed matter, its charge behaves differently in different contexts—superconductivity, magnetism. The disposition is *multiply realizable* and *context-sensitive*. Your conditionals need endless *ceteris paribus* hedges because reality is messy. But the property—charge as a power—is fundamental. Martin was right: finks and masks reveal that dispositions are bedrock.  

  **Elena:** So we just shrug? Say “it’s fragile because it has fragility”? That explains nothing! Lewis’s approach *grounds* dispositions in the physical. The masks are parasitic cases—edge conditions. We handle them by adding clauses, not abandoning reduction.  

  **Ben:** Clauses upon clauses. *(Sighs)* Look, I agree we need causal bases for scientific work. But metaphysically? Masking proves that the disposition *transcends* its basis and its typical stimuli. It’s a persistent, non-redundant property. Your “unless masked” isn’t a fix—it’s a flag that dispositions are doing irreducible work *in your own analysis*.  

  **Elena:** *(Pauses)* Maybe. But I’ll take messy reduction over mystery. Science marches by refining conditionals, not positing primitives.  

  **Ben:** And metaphysics? Sometimes it reveals where science leans on unspoken primitives. Charge isn’t just “would repel.” It’s a *power*—one you spent 40 years trusting, even when masked. Another round?  

  **Elena:** *(Smiles wryly)* Only if you admit “unless intoxicated” clauses apply to this conversation.  

  **Ben:** Touché. But my disposition to argue remains manifest.  

  ---

  **Word count:** 698  
  **Key engagements:**  
  - Elena defends Lewis's causal basis fix → Ben counters with masking (Johnston).  
  - Elena adds "unless masked" clause → Ben argues it's circular (masking defined dispositionally).  
  - Elena appeals to categorical bases for masks → Ben insists masks still rely on dispositions.  
  - Ben invokes physics context-sensitivity (user's expertise) → Elena argues scientific pragmatism.  
  - Both concede ground: Elena admits clauses are messy; Ben agrees bases exist for science.  
  - Ends unresolved but with mutual respect—neither strawmanned.
