  First, I need to address whether minimax relative concession (MRC) is mathematically equivalent to Kalai-Smorodinsky (KS) in the two-person case. Both approaches use the disagreement point and an ideal point. Gauthier's "claim" is the maximum payoff an agent can get in the feasible set without considering others, while KS's ideal point is the maximum each can get under Pareto optimality. In convex bargaining problems, these usually align. So yes, MRC and KS should pick the same point. But I should note that if the feasible set isn't comprehensive or convex, they might diverge, though that's probably not the user's main concern.

