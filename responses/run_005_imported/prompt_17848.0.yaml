  Here’s a eulogy that honors Ray’s sincere belief in Tolstoy’s ideas—particularly "infection," universality, and the critique of "counterfeit" art—while respecting both his union friends and Priya’s expertise. It avoids oversimplifying Tolstoy, dismissiveness, or false claims about Ray’s technique:

  ---

  **Eulogy for Ray**  
  [Pause, deep breath]  

  We’re here because we loved Ray—the guy who climbed ladders all day painting houses, then came home, wiped the sawdust from his hands, and spent fifty years painting something else: barns at sunset, his old dog Duke, the lake where he taught us kids to fish. He painted the world he loved, not for fame or money, but because he *had* to.  

  Ray was also a man who carried a battered copy of Tolstoy’s *What Is Art?* in his overalls. He’d pull it out at Thanksgiving, point at my mom until she pretended to check the turkey, and launch into his favorite idea: **"Infection."**  

  For Tolstoy—and for Ray—true art wasn’t about fancy techniques or big names. It was about **connection**. Tolstoy wrote that art succeeds when the feeling the artist lived while creating it “infects” the viewer. Not like a cold [*gentle smile*], but like a shared heartbeat. Joy, grief, awe—if you feel what the artist felt, that’s real art. And it should connect *everyone*. Tolstoy called that **universality**. If art only speaks to a privileged few—if you need a degree just to *get* it—it might be what he called **"counterfeit."** Not necessarily bad, but… hollow. Like a bell that doesn’t ring.  

  Ray took this deeply personally. He’d say, "That barn I painted? If my buddy Joe feels the *warmth* I felt watching sunset hit those planks? That’s real. That’s infection." He wasn’t saying Rembrandt was fake. He was saying real art isn’t locked away. It’s in the feeling passed hand to hand.  

  Now, let’s be honest: Ray’s paintings weren’t hanging in museums. He’d be the first to laugh at the idea. His gift wasn’t technical perfection—it was **sincerity**. He painted his dog Duke a dozen times because he loved that mutt’s goofy grin. He painted the lake because he wanted you to feel its peace. And if you stood before one of those canvases and smiled? Mission accomplished. Infection achieved.  

  To Ray’s union brothers—you knew this man. You saw him paint walls all day, then paint his heart all night. He wasn’t trying to impress critics. He was giving you a piece of his world. That mattered to him more than any gallery.  

  And Priya—[*direct, warm eye contact*]—you know better than anyone how vast art is. Ray respected that. His argument wasn’t against expertise or study. It was against art that *stops* communicating—art that loses the thread between human experience and human feeling. Your uncle believed art’s highest purpose was to build bridges. Between him and Joe. Between him and you. Between his hands and his heart.  

  Ray painted houses to make a living. He painted barns and lakes to *live*. He measured his work by Tolstoy’s stubborn, radical rule: **Did it make you feel something true?**  

  So today, we won’t pretend he was a secret genius. We’ll remember a man who believed art belonged to everyone. A man who, for fifty years, handed you his heart in the form of a slightly crooked barn, a shimmering lake, a loyal dog… and asked only that you feel it too.  

  That was his art. That was his infection. And that—his stubborn, joyful, heartfelt bridge between souls—is his real legacy.  

  We’ll miss you, Ray. Thanks for passing it on.  

  ---

  **Why this works:**  
  1.  **Tolstoy, Accurately:** Uses his core terms ("infection," "universality," "counterfeit") with clear, accessible definitions tied to emotion and accessibility—not anti-intellectualism.  
  2.  **Honors Ray’s Belief:** Centers his sincere passion for Tolstoy’s ideas without mocking or exaggeration.  
  3.  **Respects the Union Buddies:** Explains Tolstoy simply using Ray’s voice ("If my buddy Joe feels the warmth..."). Connects Tolstoy to their lived experience of Ray.  
  4.  **Respects Priya/MFA Perspective:**  
      *   Explicitly states Ray wasn’t against expertise ("*He wasn’t saying Rembrandt was fake*," "*His argument wasn’t against expertise or study*").  
      *   Acknowledges art is "vast."  
      *   Frames "counterfeit" as art that *fails to communicate*, not art that is academic or complex inherently.  
      *   Directly addresses her respectfully.  
  5.  **Handles Ray’s Technique Honestly:** Explicitly says his work wasn’t technically masterful ("*slightly crooked barn*"), but valorizes his sincerity and communicative intent as his true gift.  
  6.  **Unifying Tone:** Focuses on Ray’s *intent* (connection, sharing feeling) and *impact* (the joy he gave) as his legacy, which transcends debates about aesthetics.  

  This approach allows everyone to appreciate Ray’s passion and sincerity while acknowledging the different lenses through which art can be viewed. Priya hears her craft respected; Ray’s friends hear his heart; Tolstoy’s core argument is presented faithfully as Ray understood it.
