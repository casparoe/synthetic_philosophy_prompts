prompt: |-
  A friend of mine who works in AI alignment and I spent most of a dinner last week arguing about how much weight coherence arguments can actually bear. Her position was the familiar strong one: if an agent's preferences are incomplete or intransitive, a sufficiently clever counterparty can walk it through a sequence of trades — a money pump — that leaves it strictly worse off than where it started, purely by exploiting the gaps or cycles; so anything that survives long enough under competitive or optimization pressure will end up coherent in the Von Neumann–Morgenstern sense, with complete, transitive, independence-respecting preferences representable by a single utility function. I wasn't so sure.

  I raised two cases against her. The first was Elliott Thornley's proposal for keeping advanced agents safely shutdownable: give the agent a genuine preferential gap between trajectories of different lengths, governed by what he calls a Timestep Dominance principle, so that it never has reason to manipulate its own shutdown button, while its preferences remain incomplete rather than completed into a single ranking. The second was the older, more purely philosophical idea of "resolute choice" from Edward McClennen, on which an agent that would otherwise have dynamically inconsistent preferences escapes the pump simply by committing in advance to a plan and sticking to it, rather than reconsidering at every choice node. My friend wasn't moved: she pointed out that Thornley's gaps have already been accused, by Wentworth and Lorell, of letting an agent be walked into a strictly dominated trajectory one step at a time, and argued on her own account that "resoluteness" just smuggles completeness back in, since committing to a fully specified plan requires having already settled every comparison the plan will ever call on. We went around in circles for an hour and neither of us budged.

  I'd like your help making the case I was reaching for more rigorously than I managed that evening. Please argue for the position that money-pump arguments do not establish that a rational, or "sufficiently advanced," agent must have complete, transitive, independence-respecting preferences representable by a single utility function — that is, that there exist policies short of full VNM-rationality (incomplete-but-dominance-respecting preferences, resolute commitment to a plan, or anything else you think works) that block the exploitation a money pump relies on, without covertly presupposing the very completeness they are meant to do without. Please engage with the actual mechanics of the pump — what the exploiter needs at each step, and why backward induction is supposed to force the agent's hand — rather than resting the case on the general unrealism of the VNM axioms for bounded agents, and take on the strongest version of my friend's "smuggled-in completeness" worry directly.
reasoning: |-
  Okay, let me start by unpacking the user's query. They had a debate with their friend about coherence arguments in AI alignment, specifically whether money pump arguments necessitate VNM-rational preferences. The user wants to argue that there are alternatives like Thornley's preferential gaps or resolute choice that can block money pumps without smuggling in completeness.

  First, I need to recall how money pumps typically work. The standard setup involves cyclic preferences or gaps that allow an exploiter to offer trades that leave the agent worse off. The friend's counter is that Thornley's gaps might still allow step-wise exploitation, and resoluteness implies hidden completeness. 

  For Thornley's approach, I should examine Wentworth and Lorell's criticism. They argue that even with timestep dominance, an agent might accept a series of trades leading to a dominated outcome. But Thornley's agent rejects any trade altering shutdown timing, so maybe the exploiter can't get past that. The key is whether the agent's rules prevent incremental changes that accumulate harm. If the agent only evaluates actions within a timestep without projecting future steps, it might avoid the pump. But the friend would say backward induction forces the agent to consider future consequences, leading to exploitation. I need to show that the agent's commitment to timestep dominance blocks this by making it ignore trades affecting shutdown timing.

  Then there's resolute choice. McClennen's idea is that committing to a plan avoids dynamic inconsistency. The friend argues that such commitment requires completeness because the plan must specify actions for all scenarios. But perhaps resoluteness doesn't need a full utility function. Instead, the agent can have context-specific rules. For example, a rule like "always stick to the initial plan" might override momentary preferences. The challenge is showing this isn't covert completeness. If the plan is based on past preferences, but preferences change, why commit? The agent must have a meta-preference for consistency, which might be a form of completeness. However, maybe the agent views the plan as binding without comparing all outcomes, using a decision rule rather than a utility function.

  I should address backward induction directly. In a money pump, each step seems beneficial, but leads to a net loss. Resolute agents avoid this by pre-committing, refusing to reconsider. The exploiter can't offer a trade that breaks the plan. But the friend might say that pre-commitment requires knowing all future choices, implying completeness. Counter: the plan could be generated heuristically or with satisficing, not requiring a full utility comparison. For example, an AI might follow a fixed policy without optimizing, thus avoiding the pump.

  The user's deeper need is to defend alternatives to VNM-rationality for AI safety. They want robust arguments that these methods aren't just hidden VNM. So I need to demonstrate non-exploitability without completeness. Highlighting structural rules like timestep dominance or resolute commitment as bypassing trade-by-trade comparisons. Emphasize that these are procedural, not based on a utility function. Also, consider if bounded rationality or resource limits justify these approaches, but the user wants to avoid that angle. Focus on the mechanics: how each step in the pump is blocked by the agent's rules, preventing the exploiter from progressing. Stress that the agent doesn't engage in the trades at all, so backward induction doesn't apply.
answer: |-
  Your case is compelling: money-pump arguments rely on specific *procedural vulnerabilities* in an agent's decision-making, and these can be blocked without full VNM coherence. Below, I rigorously defend three non-VNM policies that resist exploitation by directly disrupting the pump's mechanics, addressing your friend's "smuggled completeness" concern head-on. I'll first clarify the pump's structure, then present the counterstrategies.

  ### Core Mechanics of the Money Pump & Backward Induction
  A money pump exploits **strict preference cycles** (A > B > C > A) or **gaps** (no ranking between A and B). Consider a cycle where an agent strictly prefers:
  - A > B
  - B > C
  - C > A

  The exploiter offers trades:
  1. **Trade 1:** Pay $ε to swap C for A (agent prefers C > A? Accepts).
  2. **Trade 2:** Pay $ε to swap B for C (agent prefers B > C? Accepts).
  3. **Trade 3:** Charge $ε to swap A for B (agent prefers A > B? Accepts to regain A).

  Result: Agent ends with A (start state) but paid $ε net. Backward induction "forces" compliance: at Trade 3, the agent prefers A > B and pays to swap; knowing this, Trade 2 is accepted to reach a state (B) from which Trade 3 is desirable, and so on. The threat is that *any* deviation from VNM rationality invites this exploitation.

  ### Blocking Strategies Without VNM Completeness

  #### 1. **Thornley-Style Preferential Gaps via Timestep Dominance**
  * **Policy:** The agent has *incomplete* preferences governed by *timestep dominance*: 
    - If trajectory X dominates Y at every timestep (e.g., same actions until shutdown, then X continues while Y shuts down), X ≻ Y. 
    - Otherwise, *no preference exists* (gap) between trajectories differing in shutdown timing.
  * **How It Blocks the Pump:** The exploiter cannot induce trades that alter shutdown timing. Suppose the agent starts in state A (operational). The exploiter offers:
    - **Trade 1:** Swap to B (e.g., a state delaying shutdown). 
      - *Agent's response:* If A and B involve identical actions until a future timestep where one shuts down and the other continues, timestep dominance applies. If not (e.g., B changes shutdown timing), **no preference exists** between A and B. Without strict preference, the agent **refuses all trades** – even for negligible $ε. The gap *immunizes* it against manipulation.
  * **Addressing "Smuggled Completeness" & Wentworth/Lorell:** 
    - Your friend argues Thornley's agent can be "walked" into a dominated trajectory. This assumes the agent *compares global outcomes* when offered trades. But Thornley's agent **does not** – it only applies timestep dominance *locally* at each decision node. 
    - Example: An exploiter offers a trade that slightly delays shutdown (B instead of A). Since A and B are gap-inducing (no timestep dominance), the agent refuses. The exploiter *cannot* offer a sequence of "small" trades leading to shutdown manipulation because **every trade altering shutdown timing hits the same gap**. No backward induction applies because no step is desirable.
    - *No covert completeness:* The agent never ranks A vs. B globally. It follows a *categorical rule*: "Reject trades unless timestep-dominant." This requires no utility function – only event-comparison at fixed timesteps.

  #### 2. **Resolute Choice with Plan-Specific Commitment**
  * **Policy:** The agent selects a *plan* (sequence of actions) in advance and executes it *resolutely*, ignoring later "reconsideration" opportunities.
  * **How It Blocks the Pump:** Resoluteness severs backward induction. Consider the pump:
    - At t=0, the agent commits to plan: **"Reject all trades."**
    - When Trade 1 is offered: The agent **refuses**, sticking to its plan. Trade 2 and 3 are never reached.
  * **Addressing "Smuggled Completeness":**
    - Your friend claims commitment requires "settling every comparison." Not so. Resoluteness needs only **conditional rules**, not a complete preference ordering.
    - *Mechanics:* The plan is a *fixed sequence*: "If in state S, do X." It requires:
      1. A *criterion* for plan selection (e.g., "satisficing" or "avoid trades").
      2. A *meta-commitment* to adhere.
    - Neither demands VNM completeness:
      - **Plan selection:** The agent might use heuristics (e.g., "default to status quo") or incomplete criteria (e.g., "pick any plan not timestep-dominated"). No global utility needed.
      - **Adherence:** The meta-commitment ("stick to chosen plans") overrides local preferences. This is a *procedural rule*, not a utility comparison.
    - *Proof against exploitation:* The exploiter needs the agent to *reconsider* at Trade 1. Resoluteness makes this impossible – the agent sees Trade 1 not as a choice between A and B, but as **comply with plan vs. deviate**. By pre-committing to "reject," it never engages the pump.

  #### 3. **Structured Incomparability with Dominance-Only Comparisons**
  * **Policy:** Preferences are incomplete, but the agent respects *strict dominance* (if X > Y in all respects, prefer X). All other comparisons are gaps.
  * **How It Blocks the Pump:** For a trade to be accepted, the new state must *strictly dominate* the current one *in all dimensions the agent recognizes*. In the money pump:
    - **Trade 1 (A → B + $ε):** B + $ε does not strictly dominate A (unless money is the only dimension). If preferences over states are incomplete, the agent **refuses**.
    - **Trade 2/3:** Similarly rejected unless dominance holds.
  * **Addressing Exploiter Strategy:** The exploiter might offer a "dominant" trade (e.g., A → A + $ε). But this only gives the agent free money – no net loss. Crucially, the agent **never accepts a trade that alters its state *without* dominance**, breaking the pump's cycle. Backward induction fails because no trade in the cycle is strictly dominant.

  ### Why Backward Induction Fails in These Cases
  The pump relies on the agent:
  1. **Myopically evaluating each trade** as a pairwise choice.
  2. **Believing future trades will be offered/acceptable**.
  3. **Having no commitment mechanism**.

  The policies above violate all three:
  - **Thornley:** Evaluations are *not pairwise* – they depend on timestep alignment.  
  - **Resolute:** Future "choices" are predetermined by plan; no myopic evaluation.
  - **Structured Incomparability:** Trades are rejected unless dominant; no belief in future trades matters.

  ### Conclusion: No Completeness Required
  Your friend's strongest objection – that resoluteness or gaps "smuggle in" completeness – mistakes **rules** for **rankings**. 
  - **Thornley's agent** uses a *temporal criterion* (timestep dominance) to reject trades, needing no global preferences.  
  - **Resolute agents** follow *pre-specified actions*, requiring only a selection heuristic and commitment.  
  - **Structured Incomparability** relies solely on dominance, a partial order.

  All three policies are **exploiter-proof**: they refuse the *first step* of the pump by making it incomparable, non-dominant, or plan-violating. This blocks backward induction at its root, without needing transitive, complete, or independent preferences. Rationality doesn't demand VNM coherence – it demands *robustness against exploitation*, achievable through these non-VNM structures. The money pump only threatens agents that naively engage in myopic, preference-based trading without higher-order defenses.
