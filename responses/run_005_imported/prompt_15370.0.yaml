  Two of my friends, Nadia and Ben, got into it over dinner last week and I still cant decide who actually won, it's been bugging me since. We always do the tip math in our heads before checking the receipt, and over the years the two of them have ended up right about the same number of times as each other whenever their numbers dont match -- so neither one has any real track record edge on the other. This time Ben said the tip came to $17 and Nadia said $14, and instead of just grabbing a phone to check, they got stuck arguing about what you're even supposed to do once that happens.

  (1) Nadia said since they're basically tied over the long run, the only fair move is to average it out and go with $15.50 -- picking your own number over the average just means acting like you know you're the better one right now, for no real reason.

  (2) Ben said no, because this particular time he'd actually gone slow and double-checked his own math before saying it out loud, so he had something extra going for him that their "historically tied" stat can't capture.

  (3) Nadia said that doesn't count, because literally everyone feels like they were extra careful right before they turn out to be wrong -- that feeling is just what being wrong feels like from the inside, not proof you were actually more careful.

  (4) Ben said fine, but if he has to split the difference every single time a friend disagrees with math he did in his head, he can basically never trust his own arithmetic again, which is a ridiculous way to go through life.

  (5) Nadia said that averaging rule only kicks in with an actual equal, not just anyone who happens to disagree with you.

  (6) Ben said okay, then how are you even supposed to tell, in the moment, whether tonight counts as one of those "equal" situations, since telling that apart from a case where one of you is just better seems to require already knowing who did the math right -- which means her rule back in (1) was resting on an assumption she can't actually back up either.

  They made me referee and honestly I think they both score real points and both also step in it somewhere. Can you go through this move by move? Give me a json block like {"1": score, "2": score, "3": score, "4": score, "5": score, "6": score}, each score from -2 (clearly wrong) to 2 (clearly right), then a couple sentences under each explaining why -- and say at the end if there's some bigger thing they're both missing that neither one of them brought up.
