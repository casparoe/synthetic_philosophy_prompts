  Now, could offsetting ever be framed as trade? Maybe through sub-agents or time-slices? Philosophers like Parfit or McClennen have explored intrapersonal bargaining, but it feels metaphoric—no actual negotiation occurs. Credence-weighted expected utility seems more accurate than calling it "trade." 

  The user might be pushing against EA's tendency to blur these concepts. When people say "I offset my flight," it sounds transactional, but it's really just hedging moral bets. Preserving Ord's strict definition could clarify debates. 

