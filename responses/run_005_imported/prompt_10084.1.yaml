  Here’s a 4-5 minute toast weaving Moore’s philosophy into a warm, accessible tribute—with a layered joke and zero clinical chill. The structure honors Priya’s academic passion while keeping Wren’s family in the emotional core:

  ---

  **(Clink glass, warm smile)**  
  "Hi everyone. For those who don’t know me, I’m [Your Name], and Priya and I have been drowning in philosophy books together for years. Which means I’ve heard her ask one question more than any other: *‘What’s truly good? Like…*really* good? Not just useful or pleasant, but good in itself?’"  

  **(Pause, playful glance at Priya)**  
  "She’d ask this at 2 a.m. in the library, at department parties, even once mid-burrito. And she wasn’t just being existential—she was channeling her philosophical hero, G.E. Moore. Moore argued that almost everything we chase—money, fame, even knowledge—loses its glow if you imagine it utterly alone in the universe. Strip it bare, and it crumbles to dust. **Except two things.** Moore claimed only two goods survive that brutal test: **personal affection**—the deep bond between people—and **the appreciation of beauty**. Priya took this *very* seriously. For years, she’d size up potential partners against these ‘two great goods.’"  

  **(Shift tone to warmer, focus on Wren)**  
  "Then Wren showed up. And here’s the thing about Moore’s test: it’s not about checking boxes. It’s about what remains *when everything else falls away*. When I imagine Priya stripped of her titles, her dissertations, even her beloved heap-of-filth debate..."  

  **(The Joke - Philosophers hear Moore, others hear rom-com):**  
  "...sorry, inside joke... *anyway*, when you strip it all back, what shines through? With Priya and Wren, it’s obvious: **It’s the way Wren makes Priya laugh until she snorts during a deadly-serious Kant debate. It’s how Priya’s eyes soften watching Wren meticulously burn toast ‘for optimal crunch.’** Moore called personal affection ‘admiration of another’s good qualities,’ but he missed the messy, glorious truth: **Real love isn’t a clinical audit of virtues. It’s finding someone whose ‘good qualities’ include the way they misquote your favorite movie, or how they bring you tea without asking when you’re stressed, or why their weirdly specific hatred of pears is somehow endearing.**"  

  **(Nod to Organic Unity - Key for the profs in the room):**  
  "And here’s where Moore got it beautifully right: **Love isn’t just two good people side-by-side. It’s an ‘organic unity’—something entirely new and greater than the sum of its parts.** Priya and Wren aren’t just smart + kind + funny. Together, they create this *third thing*: **A shared language of dumb nicknames. A home that feels like safety. The courage to be utterly, unapologetically themselves.** That’s the magic. That’s what survives any isolation test."  

  **(Pivot to Beauty - Tying it to their love story):**  
  "Which brings us to Moore’s second great good: **beauty**. He insisted beauty has value even if no one ever sees it—like a stunning, hidden canyon. But Wren and Priya? **They don’t just appreciate beauty; they *create* it.** Not in grand galleries, but in the quiet moments: **The beauty of Wren’s patience when Priya spirals into dissertation chaos. The beauty of Priya’s fierce pride when Wren nails a work presentation. The beauty of their shared silence, comfortable as old sweaters.** That’s the beauty that matters. That’s the beauty we’re all here to celebrate."  

  **(The Closing - Simple & Emotional):**  
  "So, Priya, after all those years analyzing ‘the good’... you found it. Not in a thought experiment, but in a person. Wren, you’re the affection that survives every test, and the beauty Priya never has to imagine alone. Moore called these the highest goods. We just call it love. **To Priya and Wren—proof that the philosophers don’t always overthink everything! May your lives forever be filled with both great goods... and terrible, wonderful, perfectly burnt toast.**"  

  **(Raise glass)**  
  "Cheers!"  

  ---

  **Why This Works:**  

  1.  **Accuracy for Philosophers:**  
      *   Correctly frames the isolation test as stripping things to intrinsic value.  
      *   Name-drops Moore, the "heap-of-filth" experiment (key Priya signature!), and "organic unity."  
      *   Acknowledges Moore's *clinical definition* ("admiration of good qualities") but immediately subverts it with warmth.  
      *   The joke ("heap-of-filth debate") is the layered gem: Philosophers instantly recognize Moore's unseen beauty argument. Others just hear "weird academic thing Priya does" and laugh *with* Priya.  

  2.  **Accessibility for Family:**  
      *   Moore's ideas are translated into universal emotions: deep connection, shared laughter, quiet comfort, creating a home.  
      *   "Two great goods" becomes a relatable framing device for their love story.  
      *   Concrete, funny examples replace abstraction (snort-laughing, burnt toast, pear hatred, dumb nicknames).  
      *   The core message is pure celebration: "You found real love. We see how good you are together."  

  3.  **Avoids the Clinical Trap:**  
      *   Immediately follows the mention of Moore's "admiration of qualities" with humorous, specific, *flawed* examples of what love *actually* looks like (misquoting movies, hating pears).  
      *   Emphasizes the *messiness* and *shared creation* ("organic unity") over cold analysis.  
      *   Focuses on *actions* (making tea, creating comfort) over abstract "qualities."  

  4.  **Tone & Flow:**  
      *   Starts with light, academic insider humor (Priya's quirk), smoothly transitions to heartfelt warmth.  
      *   Uses vivid, sensory language ("burn toast for optimal crunch," "silence comfortable as old sweaters").  
      *   Keeps philosophy as the *framework*, not the *content*. The content is Priya & Wren's love.  
      *   Ends on a simple, emotional, and slightly funny note ("terrible, wonderful, perfectly burnt toast").  

  **Delivery Tip:** Pause slightly after "heap-of-filth debate" with a knowing look at Priya/the department. Let the philosophers get the chuckle first; the rest will follow naturally because *you* laughed. Speak the examples of their affection slowly and warmly. This toast makes Moore the set-up, and Priya & Wren the undeniable, joyful payoff.
