  I should structure the argument around Sidgwick's own criteria for resolving the dualism. He wanted a single rational principle, not just empirical harmony. Psychical research addresses the latter, leaving the former untouched. Also, Sidgwick's view of self-evidence means that even with harmony, the axioms remain distinct and could conflict in hypothetical scenarios. The theoretical tension persists.

