answer: |-
  You've hit on a fundamental tension in governance systems: **the gap between formal authority (who legally decides) and substantive impact (who bears the consequences).** Your frustration is valid, and your friend's position reflects the legal reality, but neither captures the whole ethical picture. Here's a breakdown:

  ### The Two Competing Principles
  1.  **The Formal Authority Principle (Your Friend's View):**
      *   **Core Idea:** Decision-making rights are tied to ownership, investment, or legal jurisdiction. Those who bear the financial risk (owners) or hold legal responsibility (the board) get the vote.
      *   **Arguments For:** Provides clear boundaries, ensures accountability for financial outcomes, protects investments, aligns with property rights, and avoids administrative chaos.
      *   **Reality in Your Case:** The co-op board *legally* represents the owners. Renters are transient occupants under a contract with an owner, not stakeholders in the corporation. The board has no legal obligation to consult you.

  2.  **The Affected Interests Principle (Your View):**
      *   **Core Idea:** Those significantly impacted by a decision should have a meaningful say in its outcome. Suffering consequences grants moral weight, regardless of formal status.
      *   **Arguments For:** More democratic, prevents tyranny of the majority/minority over the affected, acknowledges real-world harm beyond financial risk, promotes fairness.
      *   **Reality in Your Case:** You face direct, severe harm (eviction, disruption) disproportionate to the benefit most "yes" voters receive (potentially minor property value increase, reduced transient traffic). Absentee owners experience minimal impact while wielding significant power over your home.

  ### Why Your Friend's "That's Just How Voting Works" is Incomplete
  It describes the *current system* but doesn't justify whether that system is *fair* or *ethically sound* in this specific context. Voting rules are human constructs, not immutable laws of physics. They can be (and often are) challenged when they lead to demonstrably unjust outcomes.

  ### The Core Problem: "Overlapping Communities of Fate"
  Your highway example is perfect. Decisions are often made within jurisdictional or ownership boundaries, but the *consequences* spill over onto people outside those boundaries who had no voice. This creates "losers" who bear burdens without consent.

  ### Is There a Principled Way? (It's Messy, But Not Impossible)
  The idea *doesn't* fall apart, but it's incredibly complex to implement perfectly. Philosophers and political theorists grapple with this constantly (e.g., the "All Affected Interests" principle). Here's how we approach it:

  1.  **Severity of Impact:** Not everyone "affected" gets an equal say. The weight of your voice should correlate with the *severity* of the impact on you. Losing your home is a severe impact. A minor inconvenience or a marginal financial gain is not. Your impact vastly outweighs that of most voting owners.
  2.  **Directness & Certainty:** Your impact is direct and near-certain (eviction). An owner's "impact" (property value change, building atmosphere) is often indirect, probabilistic, and less severe.
  3.  **Alternatives & Vulnerability:** How easily can you avoid the harm? You have few alternatives; finding comparable housing is difficult. Owners have more options (sell, rent long-term, absorb the cost). Your vulnerability is high.
  4.  **Intent vs. Consequence:** The board/owners might intend to protect their investment or community, but the *foreseeable consequence* is your displacement. Ignoring this foreseeable harm is ethically questionable.

  ### Why It's Hard to Implement
  *   **Defining "Affected":** Where do you draw the line? How minor an impact qualifies? This can become impossibly broad.
  *   **Measuring Impact:** Quantifying "severity" is subjective and complex.
  *   **Administrative Burden:** Creating inclusive processes for every decision involving spillover effects is impractical.
  *   **Power Dynamics:** Existing power structures (owners, jurisdictions) resist diluting their authority.

  ### Applying This to Your Situation
  *   **Legally:** Your friend is correct. The board has the formal authority. Your rights are defined by your lease and landlord-tenant law, not co-op governance.
  *   **Ethically:** Your position has strong merit. The decision imposes a severe, disproportionate burden on you (and likely other renters) while providing diffuse, often minor benefits to owners. The lack of consideration for this foreseeable harm is a failure of ethical governance, even if legal.
  *   **Systemically:** This *is* a widespread problem. It highlights how systems designed to protect capital (property ownership, jurisdictional boundaries) often prioritize it over fundamental human needs like stable housing when they conflict.

  ### What Can You Do? (Beyond the Principle)
  1.  **Lobby Owners Directly:** Find sympathetic owners. Present your case *to them* clearly and calmly: "I understand the board's perspective, but this policy will force me out of my home. As someone who lives here and contributes to the community, I'm asking for your support in finding a solution that protects residents." Target owners who live there full-time.
  2.  **Ask Your Landlord to Advocate:** Urge him to argue *to the board* that banning STRs will force him to sell, potentially leading to *less* stable long-term occupancy and *more* disruption than regulated STRs.
  3.  **Propose a Compromise:** Suggest alternatives the board might consider (e.g., limiting STRs to primary residences only, requiring longer minimum stays, capping the number per building) that address concerns while allowing your landlord to continue.
  4.  **Explore Legal Lease Protections:** Consult a tenant rights organization. Does your lease have any clauses offering protection against eviction due to building policy changes? (Usually unlikely, but worth checking).
  5.  **Prepare for the Worst:** Start researching your tenant rights regarding eviction timelines and look for alternative housing options.

  **In Conclusion:** Your friend is describing the *legal reality*, which is powerful. But you're identifying a *fundamental ethical flaw* in how that reality operates when decision-makers are insulated from the consequences of their choices. While creating perfect systems based solely on "affected interests" is impractical, acknowledging this gap is crucial. In your specific case, the lack of any voice for those facing the most severe harm is unjust, even if procedurally correct. Your argument isn't backwards; it points towards a more humane and responsive way of making decisions that profoundly affect people's lives. Fight to make your voice heard through the owners who *do* have the formal power. Good luck.
