prompt: |-
  In my philosophy of language seminar, we've been working through the debate over indicative conditionals, and I want to check my understanding of David Lewis's triviality results. As I understand it, Lewis proved that no proposition can have a probability that always matches the corresponding conditional probability P(C|A) — the so-called "Equation" — and that this is precisely why he belongs with Adams and Edgington among those who deny that indicative conditionals express propositions at all. But other sources I've read list Lewis together with Grice and Jackson as defenders of a truth-conditional analysis of "if" (specifically, the material conditional), which seems like exactly the kind of view his own triviality proof should rule out. I'd appreciate help seeing where my understanding has gone wrong.
reasoning: |-
  Okay, the user is in a philosophy of language seminar and is confused about David Lewis's position on indicative conditionals. They've encountered a contradiction in how different sources categorize Lewis. On one hand, Lewis's triviality results seem to show that no proposition can satisfy the Equation (where the probability of a conditional equals the conditional probability), which aligns him with Adams and Edgington who think conditionals don't express propositions. But on the other hand, some sources list Lewis with Grice and Jackson as defenders of the material conditional analysis, which does treat conditionals as propositions. The user wants to resolve this apparent contradiction.

  First, I need to recall Lewis's actual views. His 1976 paper "Probabilities of Conditionals and Conditional Probabilities" does present a triviality proof showing that if conditionals have truth conditions and satisfy the Equation universally, it leads to absurdity. So he rejects the Equation for truth-conditional analyses. But Lewis himself defended the material conditional account, which is a truth-conditional view. That seems contradictory at first glance.

  The key is that Lewis accepted the material conditional analysis despite his own triviality results. He believed conditionals do express propositions (specifically, material implications), but that their probabilities don't always match conditional probabilities. For Lewis, "if A, C" is simply A⊃C (not-A or C), so its probability is P(not-A or C), which equals 1 - P(A and not-C). This is different from P(C|A) = P(A and C)/P(A). 

  Lewis's triviality proof shows that these two can't be equal in all cases, especially when P(A) is low but not zero. So he would say people's intuitions about P(if A, C) are actually tracking P(C|A), but this is a mistake because the real probability should be P(not-A or C). He explained this discrepancy through pragmatic factors like assertability conditions.

  For Lewis, the Equation fails for truth-conditional conditionals, so he maintained that conditionals do have truth values but our probabilistic judgments about them are guided by conditional probability due to pragmatics. This separates him from Adams and Edgington who deny conditionals have truth values altogether.

  The user might be missing this distinction: Lewis accepts truth conditions (material conditional) but rejects the Equation as a general principle about probabilities. His triviality proof is an argument against those who want to keep both truth conditions and the Equation, like Stalnaker. 

  I should clarify that Lewis belongs to the truth-conditional camp (with Grice and Jackson) but with a nuanced position where he acknowledges the pull of the Equation while attributing it to pragmatics. The user's confusion likely stems from sources oversimplifying the taxonomy or not emphasizing how Lewis reconciled his semantics with his probabilistic results.
answer: |-
  You've identified a genuine tension in how Lewis is categorized, and your confusion is understandable—it stems from the subtlety of Lewis's position and the nuances often glossed over in secondary sources. **Your core understanding of the triviality result is correct, but the placement of Lewis alongside Grice and Jackson requires careful distinction.** Here's the breakdown:

  1.  **Lewis's Triviality Result (1976):**
      *   Lewis proved that **if** indicative conditionals express propositions with truth conditions, **and if** the probability of that conditional proposition is *always* equal to the corresponding conditional probability P(C|A) (the "Equation"), **then** absurdity follows (e.g., the probability of any proposition collapses to its unconditional probability).
      *   This result is devastating for any truth-conditional theory that wants to *identify* the probability of the conditional *with* P(C|A). It shows these two things (truth-conditional proposition + universal adherence to the Equation) are incompatible.

  2.  **Lewis's Own Semantics for Conditionals: The Material Conditional:**
      *   Despite proving the above, Lewis **did** defend a truth-conditional analysis of the *indicative* conditional.
      *   Specifically, he argued that the indicative conditional "If A, then C" **is** truth-conditionally equivalent to the **material conditional** (A ⊃ C), which is true just in case it's not the case that A is true and C is false (~(A & ~C)).
      *   He aligned himself with Grice and Jackson in this *semantic* claim about truth conditions.

  3.  **Resolving the Apparent Contradiction:**
      *   The key is that Lewis **rejected the Equation** as a principle about the *probability of a proposition*. He accepted it only as a principle about **assertability** or **acceptability**.
      *   **Lewis's Position Summarized:**
          *   **Semantics (Truth Conditions):** "If A, C" *expresses the proposition* A ⊃ C (not-A or C). It has truth values.
          *   **Probability:** The probability of the *proposition* A ⊃ C is P(~A ∨ C) = 1 - P(A & ~C). **This is NOT generally equal to P(C|A).**
          *   **Assertability/Acceptability:** However, the *degree to which it is assertable or acceptable to believe* "If A, C" *is* given by P(C|A). We *treat* conditionals *as if* their probability is the conditional probability in our reasoning and communication.
          *   **Why the Discrepancy?** Lewis (following Grice) argued that asserting the material conditional A ⊃ C when you believe ~A is true or when you believe C is true is often pragmatically inappropriate or uninformative, even though the proposition is true. The *assertability conditions* are governed by P(C|A), masking the underlying truth-conditional semantics. The triviality result shows why we *shouldn't* identify the probability of the proposition with P(C|A).

  4.  **Contrast with Adams and Edgington:**
      *   **Adams & Edgington (No-Truth-Value Camp):** They take the *inescapable lesson* of the triviality results to be that indicative conditionals **do not express propositions at all.** They lack truth conditions. The Equation holds because conditionals aren't truth-bearers; their role is purely to convey conditional probabilities (assertability/acceptability *is* their core semantic feature). P(C|A) *is* the measure of the conditional's acceptability, full stop.
      *   **Lewis (Material Conditional Camp):** Conditionals **do** express propositions (A ⊃ C) with truth conditions. The Equation **fails** for the probability of this proposition. However, **pragmatics (assertability)** ensures that we *use* conditionals in a way *guided by* P(C|A), explaining why the Equation *seems* intuitively correct and is pragmatically indispensable. The triviality result shows why the Equation *can't* hold for a proposition, but Lewis uses this to explain the *pragmatic* dominance of P(C|A), not to deny propositionhood.

  5.  **Why He's Grouped with Grice & Jackson:**
      *   Lewis, Grice, and Jackson all defend the **same core semantic thesis:** the indicative conditional is truth-conditionally equivalent to the material conditional (A ⊃ C).
      *   They all rely heavily on **Gricean pragmatics** to explain why the material conditional analysis doesn't *seem* intuitively correct in many cases (e.g., why we don't assert "If it rains tomorrow, the match will be canceled" simply because we know it won't rain).
      *   The triviality result is Lewis's *additional, powerful argument* against rivals *within* the truth-conditional camp (like Stalnaker) who tried to find a proposition *other* than A ⊃ C whose probability *could* equal P(C|A). Lewis showed this is impossible.

  **Where Your Understanding Went Slightly Astray (and Why It's Common):**

  *   You correctly saw Lewis proving the incompatibility of propositionhood + the Equation.
  *   You inferred that this *must* place him with Adams/Edgington in denying propositionhood.
  *   **The nuance you missed:** Lewis *rejects the Equation for propositions* but *maintains propositionhood anyway* (specifically, the material conditional proposition). He explains the *apparent* validity of the Equation through pragmatics (assertability), not semantics. He belongs with Grice/Jackson *semantically*, using the triviality result primarily to attack *other truth-conditional analyses* (like Stalnaker's) and to bolster the need for his pragmatic explanation of assertability.

  **In Conclusion:** Lewis is firmly in the truth-conditional/material conditional camp *semantically*. His triviality result is a weapon he wields *against alternative truth-conditional theories* (showing they cannot satisfy the Equation) and *in support of his pragmatic account* of why the Equation governs assertability despite not governing the probability of the underlying proposition (A ⊃ C). He does *not* use the result to deny propositionhood, unlike Adams and Edgington. The grouping reflects his semantic allegiance to the material conditional analysis, shared with Grice and Jackson.
