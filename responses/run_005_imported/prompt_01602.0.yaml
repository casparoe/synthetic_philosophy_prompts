answer: |-
  Daniel Bernoulli would likely have **resisted the Kelly criterion and ergodicity economics as changing the subject**, despite their shared mathematical conclusion (maximizing expected log-wealth). Here’s why, grounded in his 1738 argument:

  ### What Bernoulli’s Argument Needed
  1. **Psychological Foundations**:  
     Bernoulli framed his solution as a *psychological insight* about human decision-making. His core claim was that people don’t value money linearly but subjectively, based on their current wealth. The logarithm was a *consequence* of diminishing marginal utility (DMU)—the idea that an extra ducat brings less "happiness" to a rich person than a poor one.  

  2. **Utility as a Subjective Quantity**:  
     His paper explicitly defined utility ("emolumentum") as a *psychological* measure of satisfaction or advantage. The logarithmic function was chosen *because* it modeled this hypothesized psychological reality:  
     > *"The utility resulting from any small increase in wealth will be inversely proportionate to the quantity of goods previously possessed."*  

  3. **The Paradox’s Resolution Relied on Psychology**:  
     Without DMU, the St. Petersburg paradox remains unresolved in Bernoulli’s framework. Classical expected monetary value fails; only by redefining value in subjective utility terms (via log) does the infinite expected payout become finite and reasonable to reject.  

  ### Why Bernoulli Would Resist Kelly’s Approach
  - **Elimination of Psychology**:  
    Kelly’s derivation strips away all psychology. It replaces Bernoulli’s *subjective* utility with an *objective* property of multiplicative wealth dynamics over time. For Bernoulli, this would abandon the essence of his argument—a theory of human valuation—and replace it with a mechanical optimization rule for repeated bets.  

  - **Different Problem Domain**:  
    Bernoulli addressed a **single bet** with an enormous potential payout. Kelly addressed **repeated bets** with compounding. Bernoulli’s DMU justifies rejecting the St. Petersburg bet *even if played once*. Kelly’s criterion only applies to repeated gambles where time-averaged growth matters.  

  - **Philosophical Conflict**:  
    Bernoulli saw utility as a universal principle of rational choice under uncertainty. Kelly’s math is a survival strategy for multiplicative systems. To Bernoulli, the log function in Kelly would be a happy coincidence, not a vindication of his psychological theory.  

  ### Are DMU and Non-Ergodicity Competing or Complementary?
  They are **two routes up the same hill**—both converge on maximizing expected log-wealth—but they answer fundamentally different questions:  

  | **Aspect**               | **Diminishing Marginal Utility (Bernoulli)**       | **Non-Ergodicity/Kelly (Modern)**         |
  |--------------------------|---------------------------------------------------|------------------------------------------|
  | **Core Justification**   | Psychology: Wealth has decreasing subjective value | Mathematics: Wealth compounds multiplicatively |
  | **Applies to**           | Single decisions (static)                         | Repeated decisions (dynamic)             |
  | **Value of Log Function**| Models human preferences                          | Maximizes long-term growth rate          |
  | **Paradox Resolution**   | Explains why people reject the bet *psychologically* | Shows why expected value fails *dynamically* |

  ### Conclusion
  Bernoulli would have seen Kelly’s math as a fascinating parallel but **not a vindication**. His 1738 argument *needed* diminishing marginal utility as a psychological axiom to resolve the paradox. Ergodicity economics replaces this psychology with an objective dynamic principle, effectively "changing the subject" from *why humans value wealth non-linearly* to *how wealth evolves under repetition*. While both paths lead to log-wealth, they are distinct frameworks: DMU explains human behavior, while non-ergodicity explains system behavior. For Bernoulli—whose goal was to model rational choice through utility—the removal of psychology would undermine the conceptual foundation of his work. The routes share a summit but ascend opposite slopes.
