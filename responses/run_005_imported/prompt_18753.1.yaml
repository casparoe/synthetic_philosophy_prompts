prompt: |-
  I've been going down a game theory rabbit hole on youtube and there's one thing that doesn't sit right in my gut. In the centipede game, if you both keep passing the pot keeps growing and you both end up way ahead, but backward induction says that once it's common knowledge you're both rational, and know the other's rational, and know that they know that, all the way down, the only sane move is to grab the pot and defect on turn one, torching basically all the value on the table. I can follow the steps fine, I just don't feel why 'knowing my opponent is rational' should force that outcome instead of, like, just not doing that. And theres a second thing that bugs me even more: if a player ever actually does pass, doesn't that already prove the 'common knowledge of rationality' premise was false? So what's the other guy even supposed to think then, since the theory that told him what to expect just got contradicted by reality? Can you walk me through the actual intuition here, not just restate the equilibrium argument at me?
