  When they ask "what's the other guy supposed to think" after a pass, that's spot on. The moment Player 1 passes, Player 2 has to update their entire model. Game theory assumes perfect rationality is the baseline, but in reality it's more like: "Oh, either they're irrational, or they think I'm irrational, or maybe they're playing some meta-game..." 

  I should emphasize that backward induction isn't wrong - it's logically airtight within its assumptions. But those assumptions are like a frictionless vacuum. The user's frustration actually reveals a deeper truth: the model might be "correct" but incomplete for describing human behavior. 

