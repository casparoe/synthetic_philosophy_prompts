  On academic context: this is classic "moral equality of combatants" (MEC) debate. Walzer introduced it in Just and Unjust Wars (1977), with McMahan famously challenging it later. The family nailed the central tension without knowing the terminology.

  Overall, Mia edges ahead because her position better accommodates both the objective wrongness of aggression (point 2) and the distinction between act-evaluation and agent-culpability (point 4). Dave's pragmatic concerns are valid but don't resolve the core moral asymmetry. Still, neither fully addressed how conscription modifies blame - an angle the user might ponder further given their brother's situation.
