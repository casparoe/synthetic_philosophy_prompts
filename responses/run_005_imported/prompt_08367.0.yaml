  1. **Solomonoff's universal prior**: 
     - Based on Kolmogorov complexity, which is defined with respect to a universal Turing machine (UTM). The complexity is invariant up to an additive constant, but the choice of UTM is arbitrary. 
     - It provides a prior that favors hypotheses that are shorter in terms of code length. The justification is that the prior is universal and that it dominates any computable distribution. However, the arbitrariness of the UTM and the non-computability of Kolmogorov complexity are issues.
     - Philosophical case: Strong in the sense of being a formalization of Occam's razor, but the dependence on the UTM and the non-constructive nature weaken it.

  2. **Minimum Description Length (MDL)**:
     - Also based on Kolmogorov complexity, but in practice uses computable approximations. The idea is to choose the model that minimizes the description length of the data. 
     - It has a strong information-theoretic foundation, but the dependence on the coding scheme (which is analogous to the UTM) is arbitrary. There is an invariance result (like in Solomonoff) but only up to constants. 
     - It is often motivated by the goal of finding a model that compresses the data well, which is linked to generalization and truth.

  3. **Minimum Message Length (MML)**:
     - Similar to MDL, but it is a Bayesian method that aims to minimize the expected length of a two-part message (model plus data given the model). 
