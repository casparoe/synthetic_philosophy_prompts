     - Derived from information theory (minimizing the Kullback-Leibler divergence). It is an asymptotic approximation (for large samples) of the expected prediction error. 
     - It penalizes the number of parameters. The justification is predictive accuracy, not necessarily truth. It does not have a direct Bayesian interpretation and is not derived from a probability model for truth.

  6. **Bayesian Information Criterion (BIC)**:
