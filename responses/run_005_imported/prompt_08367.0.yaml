     - In Bayesian model comparison, the marginal likelihood (which is used in the Bayes factor) automatically penalizes more complex models by integrating over the parameter space. This is the "Occam factor". 
     - The justification is that a model that is too complex will spread its prior probability too thinly and thus have a lower marginal likelihood. However, the choice of prior is crucial and can be arbitrary. 
     - The argument is that if the prior is well-chosen (e.g., representing true beliefs), then the marginal likelihood is a valid measure of model evidence. But without such a prior, it can be seen as arbitrary.

