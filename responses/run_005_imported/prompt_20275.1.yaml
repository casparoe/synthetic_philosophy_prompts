  3. Similarly, if p_i > m, then reporting ≥ m leaves the median at m, and reporting below m might move the median to the left, which is worse.
  4. If p_i = m, then the median is m, which is the ideal point.

  This reasoning is standard and correct. Therefore, the answer for part (a) deserves full credit.

  However, note that the argument relies on the fact that the median is computed over an odd number of voters (101) so that the median is well-defined and the median of the 101 reports is the 51st smallest. The answer does not explicitly mention this, but it is implied by the setup (101 voters) and the definition of the median. So it's acceptable.

