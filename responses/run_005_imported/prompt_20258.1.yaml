prompt: |-
  My grandpa passed away back in March and I ended up as executor of his estate, which has turned into alot more of a headache than I expected. His will was drawn up like 15 years ago and has one specific line leaving "my 500 shares of Meridian Corp stock" to my cousin Ellie, with the rest of his brokerage account (the "residue") split evenly between his other grandkids, including my cousin Marcus. Except here's the wrinkle: Meridian got bought out by a bigger company called Vantage Group in an all-stock merger back in 2016, so by the time grandpa died his 500 Meridian shares had automatically turned into 750 Vantage shares at whatever the exchange ratio was that year. He never sold or bought a single share after that, he just held whatever he recieved in the swap, and never updated the will to even mention Vantage. (For what it's worth, I'm not a beneficiary of this particular part of the estate either way — grandpa left me a flat amount separately for being executor — so I don't gain or lose depending on how the stock question shakes out, I just have to actually implement whatever's correct.)

  At the lawyer's office a couple weeks ago, Ellie and Marcus got into a genuinely heated argument over what should happen to those 750 Vantage shares, and I can't stop turning it over in my head since I'm the one who has to sign off on the distribution. Roughly how it went, in order: (1) Ellie said it's obviously still her stock — the merger was totally outside grandpa's control, the company just changed its name and share count on paper, and the whole point of that line in the will was "give Ellie my position in that company." Treating the gift as if it vanished because of a corporate event he had zero say in feels like punishing her over a technicality. (2) Marcus, who's finishing his second year of law school, said wills have to be read by what they actually say, not by whoever tells the most sympathetic story about what grandpa "really" wanted, and that's exactly why the traditional rule (he called it "ademption by extinction") is that if the exact property named in the will isn't sitting in the estate at death, the gift just fails and drops into the residue. If grandpa's lawyer had wanted the gift to survive a merger, there's boilerplate for that ("or any shares I may receive in exchange therefor") and it simply isn't there. (3) Ellie shot back that the will has at least one other sloppy spot — it still lists a bank account grandpa closed like a decade ago — so his silence about mergers is obviously just him never thinking about it again, not some deliberate choice to cut her out if this ever happened. She also said her husband, who's a corporate lawyer (not trusts and estates, but still), told her most states carve out exactly this situation, that involuntary, automatic stuff like a merger isn't supposed to wipe out a specific gift the same way an actual sale by grandpa would've. (4) Marcus said sure, maybe some states do that, but that just relocates the fight instead of ending it: now we're arguing about whether "all-stock merger" falls inside whatever narrow list of exceptions the statute actually uses, which is a different question than "what would grandpa have wanted," and Ellie doesn't get to lean on a big-picture "his intent is obvious" argument and a narrow technical statutory exception at the same time, whichever helps her more in the moment. (5) Ellie said that's fair, but if the statute doesn't cleanly cover this exact situation, the tiebreaker should still go to grandpa's obvious intent instead of automatically defaulting to "the gift dies," especially since three different family members separately remember him saying some version of "the Meridian stock is Ellie's, that's for her wedding fund."

  Nobody backed down and the lawyer just kind of watched it happen. Could you go through moves (1) through (5) and tell me, for each one, whether that person basically had the better of it, the worse of it, or something in between, and why? Separately, I'd like to know if there's something both of them are missing entirely that would resolve this more cleanly than either framing does. And one more thing, since it's been bugging me: part of me suspects this is basically a smaller-scale version of the whole textualism-vs-purposivism fight I keep half-hearing about in Supreme Court arguments, just playing out over a will instead of a statute — but I honestly don't know if that comparison holds up or if wills run on different logic entirely. Curious what you think.
reasoning: |-
  Okay, let me try to unpack this executor's dilemma step by step. The core issue revolves around whether 750 Vantage shares should go to Ellie as the intended recipient of the original Meridian stock, or fall into the residue for Marcus and others. 

  First, I need to understand the sequence of arguments presented. Ellie's position (1) emphasizes grandpa's intent - the corporate action shouldn't void her inheritance. Marcus counters (2) with strict legal formalism ("ademption by extinction"). Ellie rebuts (3) with practical realities and cites potential statutory exceptions. Marcus responds (4) by narrowing the debate to statutory interpretation. Ellie concludes (5) advocating for intent as tiebreaker.

  Hmm, both make valid points but seem to talk past each other. Ellie's strength lies in the obvious intent evidence (three family witnesses!), but Marcus correctly identifies the legal starting point. The will's other sloppiness (closed bank account) actually weakens Marcus' textualism argument - it shows grandpa wasn't meticulous about updates.

  The corporate husband's point about statutory exceptions feels crucial. Many states do have "anti-ademption" laws for involuntary changes like mergers. But Marcus is right that the exact statutory language matters - "all-stock merger" might not perfectly fit some laws' wording (e.g., if statute says "reorganization" but not "merger"). 

  Where both miss the mark: they're treating this as binary (Ellie gets all shares or none), but equitable solutions exist. Maybe prorating based on original Meridian value? Or checking if Vantage issued merger documentation specifying share conversion as "successor securities" - that could trigger boilerplate language Marcus mentioned.

  On the textualism vs purposivism analogy: it's apt but incomplete. Wills interpretation uniquely blends statutory rules with equitable principles courts developed specifically for testamentary documents. The "scrivener's error" doctrine could apply here since the merger was unforeseeable when drafting.

  The executor might resolve this by: 1) Researching local anti-ademption statutes 2) Checking if Vantage's merger terms framed conversion as "successor" shares 3) Considering partial distribution if statutes don't cleanly apply. Grandpa's repeated oral declarations ("wedding fund" comments) could carry weight in court if needed.
answer: |-
  This is a classic ademption dispute where legal technicalities clash with apparent intent - and both cousins have valid points. Let's break down each argument and suggest a path forward:

  **Analysis of Arguments:**  
  (1) **Ellie (Intent Focus):** *Better of it, but incomplete.*  
  She correctly identifies the core purpose (grandpa wanted her to have *that investment*), and involuntary corporate actions shouldn't automatically void gifts. Courts often look beyond literal wording to avoid absurd results. However, she underestimates the legal default rule.

  (2) **Marcus (Textualism):** *Technically correct starting point, but overly rigid.*  
  He's right about the baseline rule: **Ademption by extinction** generally applies if the *exact* asset described (500 Meridian shares) no longer exists. Boilerplate language *could* have preserved the gift. But wills aren't contracts; testamentary intent is paramount, and courts *do* carve out exceptions for involuntary changes.

  (3) **Ellie (Sloppy Will & Exceptions):** *Stronger of it.*  
  The closed bank account example is powerful evidence the will wasn't meticulously maintained. Crucially, **most states have statutory exceptions to ademption for involuntary conversions** (stock splits, mergers, reorganizations) where the testator didn't voluntarily dispose of the asset. Her corporate lawyer husband is likely correct - this is precisely what those statutes aim to cover.

  (4) **Marcus (Statutory Nuance):** *Partially valid, but misses the bigger picture.*  
  He's right that we must check the *specific statute* in your grandpa's jurisdiction (e.g., does it cover "mergers" or only "reorganizations"? Does it require the new shares to be "securities of the successor"?). However, Ellie *can* argue both: "Grandpa's intent is clear, *and* the statute likely covers this." Courts interpret statutes in light of intent.

  (5) **Ellie (Intent as Tiebreaker):** *Best of it, supported by law.*  
  If the statute is ambiguous, **courts overwhelmingly favor the testator's intent** over strict ademption. The three family witnesses recalling grandpa's statements ("Meridian stock is Ellie's") are *critical* evidence. Most courts would find it unjust to let a corporate merger defeat this clear intent.

  **What Both Are Missing: The Middle Ground & Practical Solutions**  
  1.  **Statutory Research is Key:** The executor/lawyer **must** check:  
      - Your state's **anti-ademption statute** (often UPC 2-606 or similar). Most states protect gifts altered by merger without the testator's action.  
      - **Case Law:** How have local courts interpreted mergers under that statute?  
      *Example:* If the statute preserves gifts for "reorganizations," does "merger" qualify? (Usually yes).  

  2.  **Value vs. Shares?** While Ellie argues for the *shares*, the original gift was 500 Meridian shares. The 750 Vantage shares represent the *post-merger economic equivalent*. Some courts might frame it as Ellie receiving the *value* of 500 Meridian shares at merger date, but the statute likely intends the *replacement shares*.  

  3.  **Executor's Duty:** You don't decide based on who "wins" the argument. Your lawyer should:  
      - Obtain merger documents proving the conversion was automatic (no grandpa action).  
      - Secure affidavits from family members about grandpa's statements.  
      - Research state law conclusively.  
      - If ambiguity remains, consider filing an *interpleader* or petitioning probate court for instructions - protecting you from liability.  

  **The Textualism vs. Purposivism Analogy:**  
  Your instinct is sharp. This **is** a microcosm of that debate:  
  - **Marcus = Textualism:** "The will says '500 Meridian shares.' They don't exist. Gift fails."  
  - **Ellie = Purposivism:** "The will's purpose was to give Ellie *that investment*. The merger was a mechanical change; the purpose survives."  

  **However, wills law has its own twist:**  
  - **Testamentary Intent is Supreme:** Unlike statutes (where legislative intent is debated), a will is one person's intent. Courts prioritize carrying out that intent whenever possible.  
  - **Doctrines Bend Towards Intent:** Anti-ademption statutes, the "identity" doctrine (focusing on substance over form), and rules against forfeiture exist *specifically* to prevent technical failures from defeating clear wishes.  
  - **Ambiguity Resolution:** Wills are construed against disinheritance. If two readings exist, the one upholding the gift prevails.  

  **Conclusion & Path Forward:**  
  1.  **Ellie has the stronger overall case** based on testamentary intent, the involuntary nature of the change, and the likelihood your state's statute protects this gift. Marcus's strict textualism ignores the equitable principles built into probate law.  
  2.  **The lawyer should resolve this, not you:** Demand they:  
      - Provide a definitive opinion on your state's law with citations.  
      - If uncertain, petition the probate court for declaratory relief.  
      - Use the family affidavits as evidence of intent.  
  3.  **Executor Protection:** Sign *nothing* until you have either a clear legal opinion or a court order. Document all steps taken.  

  **Likely Outcome:** In most jurisdictions, Ellie receives the 750 Vantage shares. The merger was involuntary, the will wasn't updated, and grandpa's intent to benefit Ellie with this specific asset is well-documented. Marcus's argument holds water only if your state has an unusually strict statute or adverse precedent – which is rare in this scenario. Focus your energy on getting the legal research done, not refereeing the cousins' debate.
