prompt: |-
  Okay so this is going to sound like a weird rabbit hole but here goes. I'm in my school's investing club (we just trade fake money on a simulator, no real cash involved) and one of the seniors who's really into rationalist-blog stuff got me reading about market efficiency, which somehow led me to this thing called the "no-trade theorem." From what I can piece together, its basically a proof that if a market starts off in some efficient equilibrium and everyone trading in it is rational, then even if you personally learn some juicy private info about a stock, you literally can't profit by trading on it — because the mere fact that you're offering the trade tips everyone else off that something's up. Apparently economists even nicknamed this the "Groucho Marx" result, after the old joke about not wanting to join any club that would actually have you as a member — like, if someone's willing to sell you their shares, that alone is supposed to make you suspicious enough not to buy.

  What I can't wrap my head around is the actual mechanism, not just the cute analogy version. Like, if I quietly put in a limit order on the simulator without telling anyone my reasoning, how does my order supposedly "reveal" my private info to the other trader before they've even decided whether to accept it? Does this really require that everyone in the market knows everyone else's exact strategy (as a function of what they know), and if so, isn't that a totally wild assumption for an actual stock exchange with millions of random anonymous people on it? I think I want the actual step-by-step logic of how the "unraveling" happens, not just the punchline. And if the reasoning really is airtight, I'm confused why it isn't a bigger paradox given how insane the trading volume is on real markets every day — do economists just chalk all that up to irrational noise traders, or is there some specific assumption (like everyone sharing the same prior beliefs) that's secretly doing all the work and obviously breaks down in real life? (I know this is apparently related to Aumann's agreement theorem too but let's leave that rabbit hole for another day.)
