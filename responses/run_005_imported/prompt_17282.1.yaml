  Okay, the user is working on a piece about political legitimacy and how it often masks raw power. They're focusing on a Pascal fragment from Pensées that most people only quote partially. The full fragment delves into the necessity of combining justice and force, ending with the idea that since we can't make justice strong, we make the strong just. The user is trying to unpack that last line and understand its implications.

  First, I need to recall Pascal's context. He's writing in a time of political upheaval, post-Hobbes, and his Pensées are fragmented notes for an apologetic work. The "reason of effects" section aims to show how human institutions, while flawed, point to deeper truths. The user mentions Hobbes, so comparing their views is essential. Hobbes sees sovereignty as a solution to chaos via a social contract, while Pascal views the state as a necessary but fallen structure, part of the "order of the body."

  The user’s main question is whether Pascal’s last sentence is a resigned diagnosis or part of his larger project. They also wonder if it’s a relativist debunking or a conservative defense. Additionally, they’re curious about the connection to the river fragment and the three orders.

  Breaking it down: Pascal’s fragment starts by stating justice must be obeyed ideally, but necessity demands obeying the strongest. Justice without force is ignored; force without justice is tyranny. The solution is combining them, but since justice is disputable and force isn’t, we end up legitimizing power as just. That last line is key: we make the strong just because we can’t make justice strong.

  This isn’t just resignation. Pascal is highlighting a tragic reality in human politics. Unlike Hobbes, who rationalizes authority, Pascal sees it as a consequence of original sin—humans are too corrupt to achieve true justice. The "making the strong just" is a societal mechanism to create order, but it’s a fallen compromise. 

  Regarding the "reason of effects," Pascal first shatters naive beliefs in institutions (like the river fragment showing custom’s arbitrariness) but then argues these customs have a purpose. They maintain order, which, while not divine, is necessary for society. So the justice-force dynamic is another example: authority isn’t inherently just, but obedience is still needed for stability.

  The river fragment and this one both debunk objectivity in human justice. But while the river focuses on relativism, the force fragment addresses power’s role in enforcing norms. It’s not conservative in endorsing authority but conservative in urging compliance to avoid chaos, aligned with his Jansenist views.

  Connecting to the three orders: the state (force) belongs to the body, necessary but inferior. True justice is in the mind (reason) or charity (divine), but in the corporeal world, force dominates. Thus, political legitimacy is a pragmatic veneer on power, necessary due to human frailty.

  The user might also need to emphasize Pascal’s theological angle—earthly justice is provisional, pointing to the need for divine grace. This contrasts with Hobbes’ secular contract. Highlighting Pascal’s critique of human pride in institutions could strengthen their argument about legitimacy masking power.
answer: |-
  That's a fantastic fragment to anchor your piece—and you're absolutely right that its second half is where Pascal's real bite lies. Let's untangle that last sentence ("And thus, unable to make what is just strong, we have made what is strong just") by placing it within Pascal's broader project in the "Reason of Effects" and his theological anthropology. Here's a breakdown of the key strands:

  1.  **Beyond Resignation: A Theological-Anthropological Diagnosis (vs. Hobbes):**
      *   **Hobbesian Resignation?** Superficially, yes, it resembles Hobbes: order requires power, and pure justice is unenforceable. Humans are self-interested and contentious ("there are always wicked men"), necessitating force.
      *   **Pascal's Deeper Cut:** For Pascal, this isn't just a practical necessity of *politics*; it's a fundamental consequence of the *Fall* and human *corruption* (key to Jansenism). Our inability to "make what is just strong" stems from a deeper flaw: the corruption of human reason and will by self-love (*amour-propre*) and the loss of true justice. Justice *itself* is obscured and disputable *because* of sin. Force becomes the dominant principle in the fallen "order of the body" precisely *because* we are no longer capable of reliably perceiving or enacting true justice. It's anthropological and theological before it's political.

  2.  **The Core of the "Reason of Effects": Debunking *and* Justifying (Subtly):**
      *   **The Debunking Move (Puncturing Naiveté):** This fragment is classic "Reason of Effects." Its primary aim *is* to shatter naive illusions. It relentlessly exposes the brutal reality beneath the veneer of legitimacy:
          *   Justice is inherently weak and contested ("open to dispute").
          *   Force is the undeniable, bedrock reality ("easily recognized and beyond dispute").
          *   The powerful inevitably *define* justice to suit themselves ("force contradicted justice and said that justice itself was unjust, and that force alone was just").
          *   Therefore, political legitimacy is *always*, in practice, a retroactive justification of power ("we have made what is strong just"). This is the ultimate "unmasking."
      *   **The Subtler Justification (The Need for Order):** However, Pascal's project isn't pure cynicism. The "Reason of Effects" aims to show that *even though* human institutions are rooted in concupiscence and error, they serve a necessary, God-ordained purpose: maintaining order in a fallen world.
          *   **Obedience is Necessary:** While the *basis* of authority is flawed (raw power), the *fact* of authority and the need for obedience are essential to prevent utter chaos. Tyranny is bad, but anarchy (where "justice is powerless") is worse. Settled authority, even if unjust in origin or action, provides a framework for relative peace – a necessary good in the order of the body.
          *   **It Points Beyond Itself:** By exposing the hollowness of worldly justice and legitimacy, Pascal aims to disillusion his reader. This disillusionment is meant to turn them away from seeking ultimate meaning or justice in the political realm (the orders of body or even mind) and towards the only source of true justice and order: God and the order of charity. The *failure* of earthly justice points to the *necessity* of divine grace.

  3.  **Connection to the "River" Fragment (Relativism vs. Power):**
      *   **Shared Debunking:** Both fragments ruthlessly expose the conventional, arbitrary, and non-absolute nature of *human* justice and morality. The "river" fragment shows justice depends on *custom* and *location*. The "force" fragment shows justice depends on *power* and *enforcement*. Both undermine claims to inherent, universal righteousness in human laws and customs.
      *   **Different Emphasis:** The "river" fragment focuses on the *relativity* and lack of rational foundation for customs/laws. The "force" fragment focuses on the *mechanism* by which *any* custom or law, however relative, becomes operative and "legitimate": the imposition and maintenance by force. It explains *why* the customs on one side of the river prevail as "just" – because that side has the power to enforce them and label the other side "unjust."
      *   **Complementary, Not Identical:** They are two sides of the same coin. Relativism ("it's just a custom") explains the lack of inherent truth; the force dynamic explains how *this particular custom* gains the authority and appearance of justice. The "force" fragment provides the political *engine* for the relativism observed in the "river" fragment.

  4.  **Is it Conservative? Debunking vs. Defense:**
      *   **Radical Debunking:** It is profoundly radical in its *unmasking*. It strips legitimacy down to its bare essence: power. It reveals the emperor has no clothes of inherent justice. This is deeply unsettling to any established order claiming inherent righteousness.
      *   **Conservative Tendency:** However, Pascal's conclusion *leans* conservative in its *practical imperative*:
          *   **Defense of *Settled* Authority:** While unmasking the origins, Pascal strongly implies that *once established*, authority (embodying force *and* the current definition of "justice") deserves obedience *for the sake of order*. Disrupting it likely leads to worse injustice and chaos. He's not advocating revolution; he's advocating a clear-eyed recognition of necessity.
          *   **Focus on Inner Conversion:** His solution isn't political reform but individual conversion to God. Changing the *external* power structure won't solve the fundamental problem of corrupted human nature. True justice belongs to a different order. Therefore, submitting to the flawed political order becomes a practical necessity while seeking true justice elsewhere.

  5.  **Connection to the Three Orders:**
      *   **Order of the Body (Force):** This is the domain Pascal is explicitly describing. Force, power, material dominance, and the institutions built upon them (monarchy, laws backed by coercion) belong here. "Making the strong just" is the *modus operandi* of this order. Its "justice" is necessarily compromised and rooted in power.
      *   **Order of the Mind (Reason/True Justice):** True, universal justice conceptually belongs here. Philosophers (like Plato) try to inhabit this order. But Pascal argues that fallen human reason is too weak, corrupt, and disputatious ("Justice is open to dispute") to establish or enforce this justice in the world of bodies. It remains an ideal, powerless against force without God's intervention.
      *   **Order of Charity (Divine Justice/Grace):** This is the realm of true, perfect justice, known only through faith and divine revelation (Christ). It transcends and judges both the body and the mind. The failure of the orders of body and mind to achieve true justice points *to* the necessity of this higher order and the need for grace. Obedience to flawed earthly authority is a practical necessity *within* the order of the body, but ultimate allegiance and hope for true justice lie in the order of charity.

  **Synthesizing for Your Piece:**

  Pascal's fragment is **not merely resigned anthropology but a profound theological diagnosis of fallen political reality.** It **brutally debunks** any claim that earthly legitimacy rests on inherent justice, revealing its foundation in raw power and the subsequent retroactive justification ("making the strong just"). This directly connects to the **relativism** of the "river" fragment by exposing *power* as the engine that enforces one set of relative customs as "justice."

  However, unlike pure anarchism or revolutionary fervor, Pascal's unmasking **leads to a conservative practical conclusion:** recognizing the *necessity* of order, he defends obedience to *settled authority* as the lesser evil compared to chaos, *even while knowing its basis is flawed*. This isn't a celebration of power but a tragic acceptance of the consequences of human sinfulness within the **Order of the Body.**

  The fragment's power lies precisely in this tension: it **simultaneously unmasks** the hollowness of political legitimacy ("we have made what is strong just") **and implicitly argues** for its necessity ("it is necessary that what is strongest should be obeyed"). The true target of Pascal's critique isn't *just* the powerful, but *human pride* that believes it can build perfect justice on earth through reason or force alone. The "Reason of Effects" aims to humble this pride by showing the messy, compromised reality, thereby pointing towards the need for the **Order of Charity** where true justice resides.

  **How to frame it:** Position Pascal as the thinker who exposes the brutal, power-based reality underlying claims of legitimacy *more deeply* than Hobbes, by rooting it in theological anthropology. Emphasize the double move: the radical debunking *and* the consequent (reluctant) defense of stability. Highlight how "making the strong just" is the inevitable, tragic mechanism of politics in a fallen world, a mechanism exposed to turn our gaze upwards. This makes his thought both unsettling for any regime claiming pure righteousness and paradoxically stabilizing in its call for clear-eyed obedience within the flawed systems we inhabit.
