  For structure, I'll cluster questions from foundational challenges (Q1-2) to comparisons (Q3-5) to implications (Q6-8). Each follow-up will target evasion routes - e.g., if she dismisses intuitions about cheating, press on whether she's changed the subject from knowledge to rational permissibility. 

