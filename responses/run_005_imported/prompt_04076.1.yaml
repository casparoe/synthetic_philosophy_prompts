  Let me mentally walk through each of Weil's three mechanisms. First, collective passion: online "sides" absolutely manufacture this through viral content and algorithmic amplification. That's actually worse than 1943 party pamphlets. Second, conformity enforcement: cancel culture and pile-ons perfectly mirror her "pressure to fall in line" concern. The absence of formal hierarchy doesn't soften this - if anything, the distributed enforcement is more insidious. 

