      - This points out that functionalism might attribute mental states too liberally (to systems that are not intuitively conscious, like the entire Chinese population organized to simulate a brain) or too chauvinistically (by excluding systems that are physically different but functionally equivalent). 
      - This is a serious challenge to functionalism because it questions the core idea of defining mental states by causal roles. It is often considered a major problem.

   2. Absent/inverted qualia arguments:
      - These challenge functionalism's ability to account for qualitative aspects of experience (qualia). The idea is that two systems could be functionally identical but have different qualia (inverted) or one could lack qualia entirely (absent). 
      - This is a classic problem for functionalism, especially for phenomenal consciousness. It is a deep issue that functionalism struggles with.

   3. Epiphenomenalism / causal drainage (related to Kim's exclusion problem):
      - The worry is that if mental properties are defined as second-order functional properties (properties of having some first-order property that plays a certain role), then they might not do any causal work over and above their physical realizers. This leads to the problem of mental causation and potential epiphenomenalism.
      - This is a general problem for non-reductive physicalist views, including functionalism. It is a serious metaphysical challenge.

   4. Putnam's own later trivialization argument against computational functionalism:
      - Putnam argued that computational functionalism is too liberal because almost any physical system can be described as implementing any computation (given a suitable mapping). Thus, functionalism would attribute minds too widely.
      - This is a significant challenge because it undermines the idea that computational states are sufficient for mentality.

   5. Searle's Chinese Room:
      - This argument targets strong AI and computational functionalism by claiming that syntactic manipulation (as in a computer) is not sufficient for semantics or understanding. 
      - While famous, functionalists have developed many responses (e.g., the systems reply). It is often considered less damaging than other objections.

   6. Zombie conceivability argument:
      - This is an argument for dualism: it claims that it is conceivable that there could be a physical duplicate of a conscious being that lacks consciousness (a zombie). If conceivable, then it is possible, and then physicalism (and functionalism as a physicalist theory) is false.
      - This is a major challenge to physicalism in general, but functionalists might respond by denying the conceivability-possibility link or by other means. It is a fundamental challenge.

   7. Bechtel & Mundale-style empirical pushback on multiple realizability:
      - This objection argues that multiple realizability is not as widespread as philosophers thought, because neuroscience shows that similar mental functions are often realized by similar neural structures. Thus, the motivation for functionalism (from multiple realizability) is weakened.
      - This is an empirical challenge that might undercut a key motivation for functionalism, but it doesn't directly refute the theory. It might push towards a more species-specific functionalism.

