answer: |-
  Let's dissect the logical structure of the moral standing puzzle, focusing on the mechanism that separates *blameworthiness* from *standing to blame*. The core tension you're identifying is real: if hypocrisy doesn't undermine the truth of the moral claim ("X was wrong"), how can it normatively disqualify the hypocrite from voicing blame without reducing "standing" to mere social efficacy? I'll break this down using Cohen's framework and key rebuttals, pinpointing the proposed mechanisms.

  ### Core Distinction & The Puzzle
  1.  **Blameworthiness (Object-Level):**  
      *   Proposition: "Act A by agent X is morally wrong."  
      *   *Status:* A truth-apt claim. Hypocrisy of the blamer (Y) is **orthogonal** to its truth value.  
      *   *Tu Quoque Fallacy:* Using Y's hypocrisy to argue that A is *not* wrong is invalid. The wrongness of A is independent of Y's conduct.

  2.  **Standing to Blame (Second-Personal/Relational Level):**  
      *   Proposition: "Agent Y is morally positioned to authoritatively blame X for A."  
      *   *Status:* A normative condition concerning the *relationship* and *authority* required for Y's act of blaming to be *valid* or *warranted* as a *moral address*. Hypocrisy *can* undermine this.  
      *   *The Puzzle:* How does Y's hypocrisy make Y's *true* moral assertion ("A is wrong") an *invalid* or *unwarranted* act of *blaming*, without negating the truth of "A is wrong"?

  ### Cohen's Mechanism: Moral Address & Reciprocity
  Cohen's core argument (especially in "Casting the First Stone") hinges on the nature of *blame* as a **second-personal moral address**, not just a factual assertion. The mechanism involves **implicit claims** and **reciprocity**:

  1.  **Blaming as a Performative Act:**  
      When Y blames X for violating norm N, Y isn't just stating "X violated N." Y is *holding X accountable*. This act implicitly claims:
      *   "N is a valid norm."
      *   "X is bound by N (and responsible)."
      *   **"I (Y) am entitled to hold you (X) accountable for violating N."**
      *   **Crucially: "I (Y) am myself subject to N and recognize its authority over me (or relevantly similar norms)."** (This is the implicit claim of *reciprocity*).

  2.  **Hypocrisy Violates the Implicit Claim of Reciprocity:**  
      If Y is a persistent or unrepentant violator of N (or a relevantly similar norm), Y's act of blaming X *falsifies* the implicit claim that *Y is subject to N and recognizes its authority*. Y implicitly claims an *exemption* for themselves while demanding compliance from X.

  3.  **Undermining the Moral Address:**  
      *   **Authority & Standing:** Moral authority to hold others accountable stems partly from shared subjection to the norm. By violating N while blaming X, Y severs the equal footing necessary for authoritative moral address. Y attempts to occupy a position of moral superiority they haven't earned and don't occupy. Their blame becomes an exercise of *power* or *condescension*, not legitimate *accountability*.
      *   **Contamination of the Act:** The *act* of blaming by Y becomes *itself morally defective* because it involves a false implicit claim (Y's own subjection/compliance). It's akin to a corrupt judge sentencing someone for corruption – the sentence might be factually correct, but the judge's act is illegitimate due to their own corruption. The *warrant* for Y to *perform the act of blaming* is missing.
      *   **Why it Doesn't Contaminate the Object-Level Truth:** The truth of "A is wrong" depends solely on the nature of A, the relevant norms, and X's actions. Y's hypocrisy is a fact *about Y* and the *act of blaming*, not about A or X. It's a meta-level defect in the *performance* of blame, not evidence about the object of blame. The judge's corruption doesn't make the defendant innocent; it just makes the judge the wrong person to pass sentence.

  4.  **Normative, Not Merely Social:** For Cohen, this isn't *just* about persuasiveness ("people won't listen"). It's about the *conditions of validity* for the *moral practice* of blame. A hypocrite's blame fails as a *genuine moral address* because it lacks the necessary reciprocity and undermines the equality presupposed by moral norms. It becomes a different kind of speech act – perhaps condemnation, accusation, or shaming – but not legitimate *moral* blame.

  ### Competing/Complementary Mechanisms
  1.  **"Implicit Exemption" (Cohen-esque):** As above. Hypocrisy involves Y implicitly exempting themselves from N while enforcing it on X, violating the universality inherent in moral norms. This makes Y's enforcement illegitimate.

  2.  **Moral Address & Equal Standing (Darwall-esque Influences):** Stephen Darwall's work on the second-person standpoint emphasizes that moral obligations arise from relations of mutual accountability between free and rational agents. Legitimate blame requires that the blamer addresses the blamee from a position of *equal moral standing*. Hypocrisy destroys this equality in the context of norm N. Y, by violating N, forfeits their *equal standing with respect to N* and thus their authority to hold others accountable *for N*. Their blame is not a valid "second-personal reason."

  3.  **Complicity/Contributing to the Wrong (Fritz & Miller - "Hypocrisy and the Standing to Blame"):** Kyle Fritz and Daniel Miller argue Cohen overstates the case. They propose hypocrisy *often* undermines standing, but **only if** the hypocrite's own violations *contribute to the conditions* that make X's wrongdoing more likely or acceptable ("Normalization Effect"). If Y's own corruption fosters a culture where corruption is normalized, Y loses standing to blame *specific* acts of corruption within that culture. However, if Y's past violations were isolated and didn't contribute to the environment enabling X's wrong, Y might retain standing. *Mechanism:* Hypocrisy undermines standing *only when* the hypocrite is *complicit* in the very type of wrong they condemn, making their blame practically inconsistent and potentially harmful.

  ### Logical Structure Summarized
  1.  **Layer 1 (Object-Level Moral Truth):**  
      *   Proposition P: "Act A by X is morally wrong."
      *   Truth Condition: P is true iff A violates a valid moral norm N, given the context.
      *   *Hypocrisy (Y's violation of N) is irrelevant to P's truth value.*

  2.  **Layer 2 (Standing to Blame - Relational Norm):**  
      *   Proposition S: "Y has the standing to authoritatively blame X for A."
      *   Validity Condition: S is true iff Y meets the conditions for legitimate moral address regarding N and A.
      *   **Key Conditions (Cohen):**  
          *   Y recognizes the authority of N over themselves (or relevantly similar norms).
          *   Y is not persistently/unrepentantly violating N (or relevantly similar norms).
          *   Y addresses X from a position of equal moral standing with respect to N.
      *   **Mechanism of Undermining:** Y's hypocrisy (violating N) directly falsifies the key conditions for S. It demonstrates Y does *not* genuinely recognize N's authority over themselves (implicit exemption) and severs the necessary equal standing regarding N.
      *   **Effect:** While P may be true, Y's *act* of blaming X is *itself morally defective or unwarranted* because it lacks the valid authority (S is false). The *performance* of blame is invalid, even if the *content* (P) is true.
      *   **No Contamination:** The truth of P depends on X and A. The falsity of S depends on Y's conduct and relationship to N. They operate on different logical planes.

  **In essence:** Standing (S) is a *precondition* for the *normative validity* of the *act* of blaming, distinct from the *truth* of the *proposition* (P) that the blame expresses. Hypocrisy attacks the precondition (S) by revealing the blamer's own failure to satisfy the reciprocity and equality inherent in the practice of moral accountability, rendering their specific act of blame illegitimate *as a moral address*, not factually incorrect. It's a failure in the *performance* of the moral practice, not a refutation of the moral fact. Cohen emphasizes this as a genuine normative failure in the relational space of morality, not merely a rhetorical or psychological weakness. Fritz & Miller add nuance by tying standing loss more tightly to complicity in the *system* enabling the wrong.
