  - This creates natural aversion to gambling civilization on low-probability interventions

  The key mathematical insight is that log(0) is negative infinity - so any nonzero extinction probability makes expected log utility diverge to -∞ unless perfectly mitigated. This forces extreme caution, unlike linear EV which can justify reckless bets if the payoff is big enough.

