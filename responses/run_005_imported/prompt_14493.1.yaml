  The user might be pushing back against longtermist arguments that neglect this. They probably want ammunition against claims like "even 0.001% chance of saving 10^20 lives justifies any cost". Kelly provides that by making such bets unsustainable - eventually you'd "go broke" (go extinct) with probability 1 if you keep taking them.

  I'll structure the argument as: 
