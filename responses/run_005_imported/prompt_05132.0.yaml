prompt: |-
  So this year my school started this new elective called Intro to Political Philosophy (its co-taught by the AP Euro teacher and one of the theology teachers, which is a weird combo but it actually works) and we're in the middle of a unit that goes chronologically through different theories of when its okay to resist or overthrow your own government, starting with Aquinas and eventually working up to Locke and the American Revolution. Medieval stuff isnt usually my thing but this part got kind of interesting once I actually sat with it.

  For homework everyone had to answer this: "In Aquinas's De Regimine Principum (sometimes called De Regno -- apparently he died before finishing it and one of his students had to complete the rest, which I thought was a wild fact to stumble on) he distinguishes between a ruler who has usurped power and one who holds legitimate authority but governs tyrannically. Explain this distinction, what Aquinas thinks follows from it about who, if anyone, may licitly act against such a ruler, and how this connects to his claim in the Summa's treatise on sedition that overthrowing a tyrant doesn't, strictly speaking, count as sedition." Our teacher's rubric splits it into three parts: defining what actually makes a ruler "tyrannical" (5 pts), the usurper-vs-legitimate distinction and who's allowed to act against each type (8 pts), and connecting it to the sedition passage (7 pts) -- 20 total.

  Today we swapped papers with a partner to grade each other before turning them in for real, and I got my friend Theo's. He's genuinely one of the sharper kids in the class so I don't want to shortchange him, but something about how he wraps up the answer at the end feels slightly off to me and I can't fully articulate why -- though I could just be wrong. Here's what he wrote, word for word: "Aquinas says a government counts as tyrannical when it's being run for the private benefit of the ruler instead of the common good of everyone -- basically the corrupt version of monarchy, same as in Aristotle. He splits tyrants into two types: people who just seized the throne with no right to it in the first place, and people who got installed properly but then started ruling badly. For the first type Aquinas is fine with pretty much anyone taking action against them, since there was never any legitimate authority there to begin with -- it's really just self-defense for the community. For the second type he's a lot more cautious, and says it has to go through whoever holds public authority to remove him, not random individuals, partly because he doesn't trust private citizens to judge fairly and partly because he's worried it'll cause more chaos than it fixes. The deeper reason for all this, I think, is that Aquinas is basically running an early version of the social contract, like Locke does later: the ruler only has authority because the people agreed to be governed by him for their own good, so once he stops actually doing that he's broken the deal, and they're free to remove him, with force if it comes to it. That's also why he can say in the Summa's sedition section that getting rid of a tyrant isn't really "sedition" -- since the tyrant broke the contract first, he's technically the one who started the disorder, not the people who rise up against him. So under this view, any tyrant, whether he seized power illegally or just turned bad after being crowned fairly, can licitly be killed once his rule stops benefiting the common good, since at that point his authority isn't even real anymore anyway."

  Could you grade this like a TA double-checking a peer grade -- an actual score out of 20 plus specific comments on what's right and wrong, broken down by those three rubric parts if you can (a little JSON rubric would honestly be great, if thats not too much to ask)? And if I'm just being paranoid and Theo's answer is actually completely fine, tell me that too, I don't want to dock him points he doesn't deserve over a vague feeling. Thanks!
reasoning: |-
  Okay, the user has shared a detailed scenario about grading a peer's homework on Aquinas's political philosophy. They're concerned that their friend Theo's answer might have an issue, especially in the conclusion, but can't pinpoint it. They want me to grade it against the rubric and provide specific feedback. 

  First, I need to recall Aquinas's key distinctions: tyrannical governance vs. usurpation, who can resist each, and how this connects to sedition. Theo's answer seems strong at first glance—he correctly defines tyranny as rule for private benefit, distinguishes usurpers from legitimate-but-tyrannical rulers, and notes Aquinas's caution about private action against the latter. 

  But the red flag is in his final paragraph where he overgeneralizes: he claims Aquinas permits killing any tyrant once they violate the "social contract," comparing it to Locke. That's ahistorical—Aquinas never framed it as a revocable contract; his logic was rooted in natural law and the ruler's deviation from divine/eternal law. Theo also oversimplifies by saying authority becomes "not real anymore," ignoring Aquinas's insistence on due process for legitimately installed tyrants. 

  For the sedition part, Theo gets the core right (overthrowing a tyrant isn't sedition because the tyrant caused disorder), but his contract framing weakens it. The real connection is that sedition opposes lawful authority, and a tyrant forfeits lawfulness by harming the common good. 

  Scoring it:  
  - Part 1 (defining tyranny): Perfect, 5/5.  
  - Part 2 (usurper vs. legitimate distinction): Mostly right but misses that even against usurpers, Aquinas prefers collective action. Minor deduction, 7/8.  
  - Part 3 (sedition link): Conceptually correct but polluted by the contract analogy. Deduct 2 points, 5/7.  
  Total: 17/20.  

  The user’s unease was justified—Theo’s conclusion blurs Aquinas’s medieval theology with Locke’s Enlightenment ideas. I should emphasize this in feedback without sounding harsh, since Theo clearly grasps the basics. The user will appreciate the breakdown, especially the rubric JSON they requested.
