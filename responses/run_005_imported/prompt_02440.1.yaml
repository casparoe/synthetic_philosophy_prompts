prompt: |-
  So I spent my career in experimental particle physics, living and dying by the 5-sigma convention for calling something a "discovery" -- always figured that was about as conservative as statistics gets. Now that I'm retired and reading philosophy of science for fun, I ran into the Jeffreys-Lindley paradox and its messing with my head a bit. As I understand it: for a fixed significance threshold, if you just keep piling on more data, the p-value can sit right at that threshold while the Bayes factor swings further and further toward favoring the null -- so "highly significant" and "strong evidence for the null" end up being correct descriptions of the exact same dataset. Can you explain what's actually driving that, not just "well, the priors are different," and why more data doesn't just straightforwardly make a result safer? Does this actually connect to the replication crisis stuff in fields like psychology, or is it a totally separate can of worms?
reasoning: |-
  Okay, let me unpack this retired physicist's question. They're clearly sharp - spent a career in high-stakes particle physics where 5-sigma is gospel, now wrestling with Bayesian philosophy in retirement. That transition from concrete p-values to abstract paradoxes must feel like whiplash.

  Hmm... the core tension they're describing is visceral: how can more data simultaneously make a p-value significant while making Bayes favor the null? And they're not just asking for textbook answers - they explicitly want to avoid "priors are different" handwaving. Plus there's that practical concern about replication crises lurking underneath.

  First I need to visualize the mechanics. Imagine we're testing H0 (null) vs H1 (alternative). As n increases, the standard error shrinks like 1/sqrt(n). So a fixed observed effect size becomes "more significant" p-value-wise. But here's the Bayesian twist: under H1, the prior expects effects of certain magnitudes. If your observed effect is smaller than what H1 considers plausible, accumulating data makes H1 look stupid - "you predicted big, got small, now you have no excuses."

  *sketches mental diagram* The p-value only sees how weird the data is under H0. But Bayes compares how well each hypothesis predicted what actually happened. With huge n, a slightly non-zero effect might be statistically significant but physically meaningless - and Bayes calls that bluff.

  Ah! And this connects directly to their physics intuition. In particle physics, they hunt for 5-sigma bumps because they expect real effects (like new particles) to be dramatic. But in psychology, a tiny effect might be "significant" with big n while being clinically irrelevant. That's exactly where Lindley bites - more data exposes when you're chasing noise dressed as signal.

  Better emphasize the "prediction vs description" distinction. P-values describe extremity under H0; Bayes grades predictions. And replication crisis? Absolutely related - p<0.05 with underpowered studies often captures noise that Bayes would've downweighted if priors were realistic.

  ...should mention that in particle physics, their massive effects and clean detectors somewhat protect them. But for my interlocutor, realizing their statistical bedrock has Bayesian fault lines? That's existential. Need to validate that discomfort while illuminating the deeper logic.
answer: |-
  Ah, the Jeffreys-Lindley paradox! It's a beautiful and deeply unsettling piece of statistics that perfectly highlights the fundamental philosophical rift between frequentist and Bayesian reasoning. Your intuition as a physicist is spot-on – this *feels* wrong because it seems to violate the principle that more data should bring clearer answers. Let's break down the machinery driving this paradox and why "more data" isn't always the straightforward solution it seems.

  **The Core Mechanism: What's *Really* Happening?**

  The paradox arises because the p-value and the Bayes factor are answering **fundamentally different questions** with **fundamentally different interpretations of probability**. Adding more data magnifies this difference.

  1.  **The P-Value's Question (Frequentist):**
      *   "Assuming the null hypothesis (H0) is *exactly true*, what is the probability of observing data *at least as extreme* as what I actually observed?"
      *   It focuses **only on the probability of the data *under H0***. It **does not** consider the probability of the data under any alternative (H1), nor does it assign any prior probability to H0 or H1.
      *   **Effect of More Data:** As `n` increases, the standard error of your test statistic shrinks (proportional to `1/sqrt(n)`). To keep the p-value fixed (e.g., at 0.05), the *observed effect size* (`d_obs`) needs to get *closer and closer* to the exact null value (usually zero). You need `d_obs ≈ z * SE`, and since `SE -> 0`, `d_obs -> 0`. You're finding increasingly precise evidence that the effect is *very small*, but crucially, *not exactly zero*. The p-value flags this tiny deviation as "statistically significant" because the data is improbable *if H0 were exactly true*.

  2.  **The Bayes Factor's Question (Bayesian):**
      *   "How much does the observed data *change* the prior odds of H1 relative to H0?" (BF₁₀ = `P(Data | H1) / P(Data | H0)`)
      *   It directly compares how well *both* hypotheses *predicted the specific data you actually observed*. It requires specifying the *likelihood* under H1, which usually involves specifying a prior distribution over possible effect sizes under H1.
      *   **Effect of More Data:** Here's the key. The Bayes Factor doesn't just care about the *extremeness* under H0; it crucially evaluates how *plausible* the observed data is under H1 *given its prior expectations*.
      *   Under H0, the effect is *exactly* zero. Your observed tiny effect `d_obs` is *impossible* under H0.
      *   Under H1, the effect is *some* non-zero value, specified by a prior (e.g., a Normal distribution centered on zero or some plausible effect). As `n` increases and `d_obs` shrinks towards zero to maintain a fixed p-value, this observed tiny effect becomes **increasingly *improbable* under the *typical* values expected by H1's prior distribution.** If your H1 prior expects effects of, say, ±1 unit, but your mountain of data consistently shows an effect of 0.01 units, H1 looks foolish – its predictions were way off! H0, while strictly false, predicted "near zero" much better than H1 predicted "around ±1".

  **Why More Data Doesn't Always Make a Result "Safer":**

  *   **Amplifying the Mismatch:** More data amplifies the tension between the *specific prediction* of H0 (exactly zero) and the *probabilistic prediction* of H1 (a spread of values). If the true effect is *very close* to zero (but not exactly zero), H1's prior might be placing substantial probability on values that are now demonstrably *too large* given the precise data. H1 is penalized for making vague or incorrect predictions, even though the data technically falsifies the exact H0.
  *   **The Precision Trap:** High precision makes it easy to *statistically distinguish* a tiny effect from exactly zero (hence the significant p-value). However, high precision *also* makes it easy to see that the observed effect size is *inconsistent* with what a scientifically meaningful alternative hypothesis (H1) would typically predict. The Bayes factor asks: "Is this tiny, precise effect we found *really* what H1 was promising us, or is it closer to H0's prediction of nothing?" Often, it concludes the latter.
  *   **Safety Depends on the Question:** More data *does* make the *estimate* of the effect size safer (narrower confidence/credible interval). However, the paradox shows that "safety" in *hypothesis testing* depends critically on *what you mean by a "discovery"*:
      *   Frequentist (p-value): Discovery = Strong evidence *against* the exact null.
      *   Bayesian (BF): Discovery = Strong evidence *for* a specific, plausible alternative *over* the null.

  **Connection to the Replication Crisis: Absolutely Relevant!**

  The JL paradox isn't just an abstract curiosity; it exposes vulnerabilities in common statistical practice that contribute to replication problems, especially in fields like psychology:

  1.  **P-Hacking & the Allure of "Significance":** Researchers chase p < 0.05. If an initial underpowered study shows a large (but noisy) effect (p ≈ 0.04), adding more subjects (increasing `n`) might cause the *observed effect size to shrink* towards its true (smaller) value. Paradoxically, this can make the p-value *more* significant (if the effect is real but small) while simultaneously making the evidence *less* convincing from a Bayesian perspective if the shrunken effect is implausibly small under H1. The initial "significant" result was fragile.
  2.  **Neglect of Effect Size & Power:** The p-value ritual often overshadows the crucial question: *"How big is the effect?"* The JL paradox happens precisely when the observed effect size is tiny. Fields focused solely on significance thresholds ignore whether the effect, even if real, is large enough to be scientifically meaningful or plausible under their theories (H1's prior). Replication attempts often find the *sign* of the effect but a much smaller *magnitude*, consistent with the JL dynamic.
  3.  **Misinterpretation of "Non-Significant" Results:** JL shows that a non-significant result (`p > 0.05`) with large `n` can actually be strong evidence *for* the null (BF favors H0), whereas the same result with small `n` is just inconclusive. Standard frequentist practice often dismissively calls both "no evidence against H0," failing to distinguish weak evidence from strong evidence *for* H0. This discourages publishing well-powered null results that could genuinely update beliefs.
  4.  **Mismatched Priors:** Many fields lack well-calibrated priors for effect sizes under H1. Default vague priors can be problematic. If the true effect is small but H1's prior is too diffuse (expecting unrealistically large effects), JL kicks in hard: massive datasets yield "significant" p-values but Bayes factors strongly favor H0 because the observed tiny effect is deemed too unlikely under the diffuse H1. This reflects a disconnect between statistical hypotheses and substantive scientific expectations.

  **Why Particle Physics (Mostly) Avoids This:**

  You lived the 5-sigma standard! Here's why JL is less of a practical concern there:

  1.  **Massive Effects:** They hunt for signals like new particles predicted to cause *huge* deviations (many sigmas) from the background. The observed effect sizes under H1 are expected to be large and distinct from zero.
  2.  **Strong Priors (Implicitly):** Theory often provides strong guidance on what kind of signal to expect. The H1 prior is concentrated on large, specific effects. A 5-sigma bump at the *predicted* mass is exactly what H1 expects. A tiny persistent deviation (e.g., 3-sigma with huge `n`) would be puzzling but unlikely to be declared a discovery; it might point more towards a systematic error or a need for refined theory than a clear H1 signal.
  3.  **5-Sigma Threshold:** This incredibly stringent threshold (p ≈ 3e-7) is designed to account for the "Look Elsewhere Effect" (multiple testing across energy ranges/masses). It inherently requires a large effect size to be reached with reasonable `n`. It's much harder for a tiny effect to hit 5-sigma by just adding data; it usually requires the effect itself to be substantial.

  **In Summary:**

  The Jeffreys-Lindley paradox arises because:

  *   **P-values** focus *only* on the improbability of the data (or more extreme) *if H0 is exactly true*.
  *   **Bayes factors** compare how well *both* H0 and H1 *predicted the specific observed data*, requiring a prior for H1.
  *   **With huge `n` and a fixed p-value**, the observed effect must be tiny.
  *   H0 is falsified (hence significant p-value), but H1 looks *even worse* because its prior expected larger effects, making the tiny observed effect highly improbable under H1. The BF favors H0 by default.

  **More data doesn't automatically make a hypothesis test "safer"** because it amplifies the difference between what the hypotheses *predict*. A tiny effect becomes precisely measurable, revealing it's too small to be plausible under the scientific theory embedded in H1's prior, even though it's distinguishable from zero.

  This **directly connects to the replication crisis.** Overreliance on low-threshold p-values, chasing significance with underpowered studies leading to inflated effect size estimates, neglect of the actual magnitude and plausibility of effects, and misinterpretation of null results are all vulnerabilities exposed and amplified by the logic underlying the JL paradox. Adopting Bayesian thinking (even informally, focusing on effect sizes and plausibility) or using much stricter frequentist standards (like 5-sigma) are ways to mitigate these issues. Your career instinct was right – 5-sigma *is* incredibly conservative, largely shielding you from the murkier waters where JL thrives. Welcome to the philosophical deep end! It's messy, but fascinating.
