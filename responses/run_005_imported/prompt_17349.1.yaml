prompt: |-
  So for my philosophy elective, the final project is basically a "podcast" where you interview a historical philosopher — some kid in class plays them, or I might just get an AI to do it, haven't decided — and we have to write out the actual questions ahead of time so it doesn't turn into 20 minutes of "so tell me about your big idea." I picked Pascal because I already knew the wager argument from when we covered the Scientific Revolution in APEuro, but while I was digging through the Pensées for background I found this whole other section where he's talking about justice and force, and it kind of broke my brain a little. Like he says something close to "not being able to make what's just strong, we've made what's strong just" (probably butchering the translation, but that's the gist), which sounds like he's basically endorsing might-makes-right, and that felt so weirdly cynical for a guy whose whole deal is usually faith and how weak human reason is. My teacher's never even brought this side of him up, so I don't think anyone in class knows it exists.

  Can you write me like 7-9 interview questions for "Pascal" that actually push on that instead of just letting him restate it? I specifically want: one question on whether that line is just might-makes-right in disguise, with a follow-up depending on how he tries to wiggle out of it; one on the fact that he ALSO calls force without justice "tyrannical," which seems like it needs some real independant standard of justice to even make the word "tyrannical" mean anything — so isn't that in tension with the first quote?; and one on his idea (I think it's in there too) that ordinary people shouldn't be told that laws and customs are kind of arbitrary because it could set off revolutions, which feels super elitist/noble-lie-ish to me, so I want a follow-up ready for whether he owns that or tries to soften it. If you can also fit in a question comparing him to Hobbes, since they're kind of doing the same "force grounds order" move around the same time, but Pascal's got this whole Fall/human-reason-is-broken backdrop that Hobbes doesn't really have — that'd be great too. Basically I don't want the interview to just be him quoting himself, I want questions that corner him on whether all these pieces actually fit together.
