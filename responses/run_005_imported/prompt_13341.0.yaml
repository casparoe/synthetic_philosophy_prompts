answer: |-
  That's a fantastic passage to get stuck on! You've pinpointed a crucial and notoriously compressed moment in Ramsey's thought. Let's break it down, acknowledging the inherent challenges of interpreting a single, dense after-dinner comment:

  **1. The Argument (or Lack Thereof) in the Sentence:**

  *   **Is there an argument?** It's more of a *rhetorical flourish* resting on an *assumed premise* than a developed argument. Ramsey presents it as settled wisdom ("we had settled and dismissed").
  *   **The Unstated Premise:** The key unstated premise is the **Divine Command Theory (DCT) of Ethics**, or more broadly, the **Metaphysical Dependence of Objective Morality on God**. The reasoning implied is:
      1.  **Objective Good requires a transcendent foundation.** For morality to be truly objective (existing independently of human opinions/desires), it needs a grounding beyond the natural, physical world. It needs to be "written into the fabric of the universe."
      2.  **God was the only plausible candidate for that foundation.** Within the dominant Western philosophical/theological tradition Ramsey was reacting against (Kantianism, Idealism, traditional theology), God *was* that transcendent foundation. God's nature, commands, or the structure of a divinely ordained reality provided the objective standard for "good."
      3.  **Therefore, rejecting God entails rejecting the objectivity of good.** If you dismiss God as a "real object" (i.e., as a non-existent metaphysical entity), you logically dismantle the *only foundation* upon which "Absolute Ethics" (objective, transcendent good) could plausibly rest. Without God, there's no "there" there for objective good to reside. Ethics collapses into psychology – what people desire and how to satisfy it.
  *   **Why it might have seemed "settled" then (among Ramsey's circle):**
      *   **The Rise of Naturalism/Scientism:** The early 20th century, especially among scientifically-minded philosophers like Russell and the emerging logical positivists, saw a powerful push towards explaining everything within a naturalistic framework. God didn't fit.
      *   **Moore's Challenge:** Ironically, Moore's *Principia Ethica* (1903) played a role. While Moore argued *for* objective, non-natural "good," his devastating critique of *naturalistic* definitions of good (the "Naturalistic Fallacy") made it seem like *if* you rejected non-natural properties (as naturalists like Russell did), *and* you rejected God, *then* there was simply *nowhere left* for objective good to exist. Moore unintentionally made the path to non-cognitivism seem like the only naturalistic option once God was gone. Russell explicitly saw Moore's non-natural good as quasi-theological.
      *   **The Apostles Context:** This was a group steeped in Russell, Wittgenstein's early ideas (via Ramsey himself), and a general rebellion against Victorian idealism and religiosity. Dismissing God *and* any attendant "spooky" metaphysics (including non-natural moral properties) was likely the prevailing mood. Ramsey is expressing a shared outlook.

  **2. What "Absolute Ethics" Picks Out:**

  *   **Primarily Moore:** Yes, this is almost certainly a direct reference to G.E. Moore. Moore's "good" was:
      *   **Simple & Indefinable:** Like "yellow" – you just "see" it.
      *   **Non-Natural:** Not part of the physical, scientific world.
      *   **Objective:** Exists independently of minds or opinions.
      *   **The Foundation of Ethics:** Duty was defined by what produced the most "good."
      *   This fits "Absolute Ethics" perfectly – ethics grounded in an absolute, non-natural property.
  *   **But Also Wider Targets:** While Moore is the bullseye, the phrase also encompasses:
      *   **Kantian Categorical Imperative:** An absolute, unconditional moral law binding on all rational beings.
      *   **Platonic Forms:** The Form of the Good as the ultimate foundation.
      *   **British Idealism (Bradley, McTaggart):** Their ethics were often grounded in the Absolute or a spiritual reality transcending appearances.
      *   **Traditional Religious Morality:** Grounded in divine command or natural law derived from God.
      *   The key point is any ethical system claiming **objective, mind-independent, transcendent authority** not reducible to facts about human psychology or the natural world.

  **3. Placing Ramsey's View in a Modern Metaethical Box:**

  *   **The Strongest Candidate: Emotivism (or early Non-Cognitivism).**
      *   **Evidence in the Passage:** The context is Russell's reduction of ethics to psychology ("questions about what people want and how to satisfy it"). Ramsey endorses this reduction ("most of us would agree..."). Rejecting "the objectivity of good" and dismissing "Absolute Ethics" as having "no real objects" strongly points to the view that ethical statements don't describe objective facts ("objects") but express subjective attitudes (emotions, preferences, desires) or commands.
      *   **Alignment:** This fits perfectly with the logical positivist trajectory (which Ramsey heavily influenced, especially Carnap) that saw ethical statements as non-cognitive – not stating facts about the world, hence neither true nor false, but expressions of feeling or volition.
  *   **Error Theory?** Less likely in this specific passage. Error theory (e.g., J.L. Mackie) says ethical statements *purport* to describe objective moral facts but are *all false* because no such facts exist. Ramsey isn't emphasizing the *error* here; he's emphasizing the *dismissal* and the *reduction* to psychology. He's saying the *project* of seeking objective good is misguided because it has no object, not that people are systematically mistaken *in* making claims that are false. His view seems more deflationary – ethical talk isn't *about* that kind of thing at all.
  *   **Subjectivism/Relativism?** Possible, but less precise. Russell's reduction (which Ramsey aligns with) is often a precursor to non-cognitivism. Subjectivism might say "X is good" means "I approve of X," which is a psychological fact, but non-cognitivism often goes further, denying that "X is good" even *asserts* the fact "I approve of X," instead seeing it as an *expression* of that approval.
  *   **Confidence in the Label:** **Moderate, but with crucial caveats.**
      *   **Strength:** The passage *strongly* points towards emotivism/non-cognitivism. It's the most natural reading given the context of endorsing Russell's psychological reduction and dismissing objectivity.
      *   **Caveat 1: The Setting:** As you astutely note, this is an after-dinner talk ("Epilogue") to the Apostles. It's rhetorical, provocative, and aimed at a specific audience sharing background assumptions. It's not a rigorously argued treatise. Ramsey might be simplifying or leaning into the group consensus.
      *   **Caveat 2: Ramsey's Later Nuance:** In his later, more technical paper "Theories" (1929), Ramsey develops a sophisticated pragmatic view of theoretical terms. Some scholars (e.g., Cheryl Misak) argue this provides resources for a more nuanced, potentially cognitivist or quasi-realist understanding of value judgments, seeing them as stable patterns of desire/approval within a system. *This passage predates that development.* Here, he's firmly in the Russellian/reductionist camp.
      *   **Caveat 3: "Theology and Absolute Ethics" Parallel:** His parallel dismissal of theology and ethics strongly suggests he sees both as relying on the same kind of discredited metaphysical foundation. Without that foundation, both collapse. This reinforces the non-objective reading.

  **Conclusion:**

  1.  **Argument:** Ramsey isn't arguing *for* the connection; he's *assuming* it as settled dogma among his peers. The unstated premise is the dependence of objective morality on a transcendent foundation (God being the primary candidate). Reject God, and that foundation vanishes, leaving only psychology. Moore's non-natural good seemed equally "spooky" and unsustainable without God to naturalists like Russell and Ramsey.
  2.  **"Absolute Ethics":** Primarily targets G.E. Moore's non-natural, objective "good," but also encompasses Kantianism, Platonism, Idealism, and traditional religious ethics – any system claiming transcendent, mind-independent moral authority.
  3.  **Ramsey's Metaethics (in this passage):** Strongly points to **emotivism/early non-cognitivism**. He endorses reducing value to psychology and dismisses the objectivity of good and the reality of its "object." While we must be cautious due to the informal context and his later work, this passage clearly places him in the camp that sees ethical statements as expressions of attitude/desire, not descriptions of objective facts.

  Your physicist's instinct to question the breezy assertion and look for the missing premises is spot on. Ramsey *is* being somewhat breezy among friends, relying on a shared rejection of metaphysics that made the connection between dismissing God and dismissing objective good seem obvious to them, even if it's not logically *entailed* and is contested by many naturalist moral realists today. The historical context of Moore's influence and the rise of naturalism is key to understanding why this felt like a "settled" point to the Cambridge Apostles in 1925.
