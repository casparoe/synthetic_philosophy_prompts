answer: |-
  Here are 10 interview questions designed to push the substance of unrestricted composition (universalism), targeting its key arguments and vulnerabilities, with anticipated deflections and sharp follow-ups:

  1.  **The Vagueness Lever:**
      *   **Question:** "You've argued that denying unrestricted composition forces us into problematic vagueness about when composition occurs. But why is unrestricted composition the *only* escape route? Couldn't a restricted theorist embrace *epistemicism* (we just can't know the precise cut-off) or *supervaluationism* (multiple precisifications are equally good, but no single one is 'correct') to handle borderline cases without committing to trout-turkeys?"
      *   *Anticipated Deflection:* "Those views are more complex/mysterious than universalism." or "They still admit arbitrary-seeming boundaries."
      *   **Follow-up:** "But doesn't universalism simply relocate the vagueness *entirely* to the concept of 'object' itself? If *any* plurality composes *something*, what prevents the concept 'object' from becoming so attenuated that *it* becomes vague? Isn't this just swapping one kind of problematic vagueness for another?"

  2.  **Composition-as-Identity & Ontological Innocence:**
      *   **Question:** "You often frame composition as 'ontologically innocent,' akin to David Lewis's 'composition as identity' (CAI) lite. If the fusion *just is* its parts collectively, how do you account for the *modal* differences between the parts and the fusion? For instance, the trout-turkey fusion *could* have existed even if one of its trout-parts didn't, but the *actual* parts collectively *couldn't* exist without that specific trout-part. Doesn't this show the fusion has distinct identity conditions?"
      *   *Anticipated Deflection:* "CAI isn't strict identity; it's a weaker relation of 'being nothing over and above the parts.' Modal differences are pragmatic or conceptual, not fundamental ontological differences."
      *   **Follow-up:** "If the difference is merely conceptual or pragmatic, doesn't that undermine the claim that unrestricted composition is answering a *fundamental ontological* question? Aren't you conceding that the gerrymandered fusion *isn't* a fundamental ontological posit on par with its parts, but rather a conceptual construct?"

  3.  **The Explanatory Burden of Ordinary Language & Practice:**
      *   **Question:** "If trout-turkeys, disassembled-shelf-fusions, and arbitrary cosmic sums are just as real as chairs or laptops, why does *no* human language, scientific theory, or practical activity *ever* seem to quantify over them or refer to them? Doesn't the systematic *exclusion* of these entities from our best semantic and pragmatic theories suggest they lack genuine explanatory work to do?"
      *   *Anticipated Deflection:* "Pragmatics! We only quantify over what's *salient* or *relevant* to our interests in a context. Reality is richer than our interests."
      *   **Follow-up:** "But if *every* arbitrary collection constitutes an object, why is salience or relevance *only* ever attached to collections that intuitively seem to form 'unities' (chairs, organisms) and *never* to the gerrymandered ones? Doesn't this persistent pattern suggest that our concept of 'object' *is* tracking some form of unity or cohesion that universalism explicitly denies exists?"

  4.  **Parsimony vs. Proliferation:**
      *   **Question:** "Van Inwagen famously argued unrestricted composition violates ontological parsimony. You counter that composition is 'no addition of being.' But doesn't universalism still massively proliferate the number of distinct *entities* we must recognize? Isn't the sheer, uncountable infinity of gerrymandered objects *itself* a theoretical cost, regardless of whether they 'add being'?"
      *   *Anticipated Deflection:* "Parsimony is about fundamental ontology. Universalism adds no fundamental *kinds* beyond the simples. Counting non-fundamental objects is irrelevant/misguided."
      *   **Follow-up:** "Even if we grant they are 'non-fundamental,' why should we believe in their existence *at all* if they play no causal role, are never referred to, and are undetectable? Isn't the universalist's insistence on their existence driven purely by a priori argument rather than any explanatory need?"

  5.  **Causation & Physical Closure:**
      *   **Question:** "Take the fusion of the top half of my laptop and the Eiffel Tower right now. Does this fusion cause anything? If it does, doesn't it threaten causal overdetermination (since its 'parts' like the laptop-half already cause things)? If it *doesn't* cause anything, what grounds its existence as a concrete particular distinct from its parts?"
      *   *Anticipated Deflection:* "Fusions inherit their causal powers from their parts. The fusion causes exactly what its parts cause collectively. No overdetermination."
      *   **Follow-up:** "But if the fusion causes *nothing over and above* what its parts cause collectively, doesn't this again reduce the fusion to a mere conceptual shadow of its parts? And doesn't the physical closure of the world (every physical effect has a sufficient physical cause wholly within its local spatiotemporal region) seem to preclude the *gerrymandered fusion itself* from being a genuine cause? Its 'parts' are causally disconnected."

  6.  **The Disassembled Shelf Case (Personalized):**
      *   **Question:** "My roommate argued our pile of IKEA boards 'isn't a bookshelf' yet. The universalist says it *is* a bookshelf-fusion *and* a fusion-with-the-dust-bunnies-under-it *and* a fusion-with-a-specific-molecule-in-Andromeda, etc. But doesn't this completely dissolve the intuitive distinction between a *potential* bookshelf (the pile) and an *actual* bookshelf (the assembled unit)? If both are equally real fusions, what explains the overwhelming practical and linguistic difference in how we treat them?"
      *   *Anticipated Deflection:* "The assembled unit has *functional unity* or *causal cohesion* the pile lacks. That's pragmatically important, but ontologically, both are equally objects."
      *   **Follow-up:** "If functional unity/causal cohesion is what matters pragmatically (and intuitively ontologically!), why shouldn't we take *that* as a genuine, objective ground for composition instead of dismissing it as mere pragmatics? Isn't universalism forcing us to ignore a real feature of the world that our concepts track?"

  7.  **The Argument from Counterpossibles?:**
      *   **Question:** "Some critics argue unrestricted composition makes certain seemingly meaningful counterpossible statements trivial or nonsensical. For example: 'If mereological universalism were false, there would be no trout-turkeys.' But under universalism, this is trivially true *because* universalism is true. Yet, intuitively, it seems like a substantive claim *about what composition would require* if universalism were false. How does universalism account for the apparent meaningfulness of such counterpossibles?"
      *   *Anticipated Deflection:* "Counterpossibles are tricky. Perhaps they involve conceptual shifts or are not genuinely meaningful. Universalism gives the simplest account of composition."
      *   **Follow-up:** "Doesn't this dismissal risk making universalism unfalsifiable even in principle by rendering coherent alternatives conceptually inaccessible? If we can't coherently conceive of what it would be like for universalism to be false, doesn't that weaken the claim that its truth is a substantive metaphysical discovery?"

  8.  **Identity Over Time for Fusions:**
      *   **Question:** "Consider the fusion of all the objects currently in this room. As I walk out, that fusion ceases to exist (because its parts change). But universalism says a *new* fusion (all objects in the room minus me) comes into existence. How do you account for the identity conditions and persistence of these fleeting fusions? Are they instantaneous objects? Doesn't this radical temporal flux conflict dramatically with our intuitions about object persistence?"
      *   *Anticipated Deflection:* "Fusions persist only as long as their parts exist collectively. Their identity conditions are perfectly clear: same parts, same fusion."
      *   **Follow-up:** "But doesn't this make the vast majority of 'objects' in the universe astonishingly ephemeral? And if identity is solely part-dependent, how do you distinguish between a fusion ceasing to exist (parts scatter) and a fusion *losing a part* (which, under strict mereology, means it's destroyed and replaced by a *new*, smaller fusion)? Isn't this another point where universalism forces a deeply counterintuitive view of persistence?"

  9.  **The Empirical Vacuum & Falsifiability:**
      *   **Question:** "The case for unrestricted composition seems entirely a priori, based on arguments against vagueness and for theoretical simplicity/parsimony (of a specific kind). Unlike hypotheses in, say, physics, what conceivable *empirical* observation or scientific discovery could possibly count as evidence *against* the existence of the trout-turkey or the disassembled-shelf-dust-bunny fusion?"
      *   *Anticipated Deflection:* "Metaphysics often deals with framework questions not directly testable by empirical science. The arguments show universalism is the best framework."
      *   **Follow-up:** "If *no* empirical finding could ever disconfirm universalism, and its main virtue is resolving a specific *a priori* worry about vagueness, doesn't this risk making it an article of metaphysical faith rather than a theory responsive to the way the world is? Shouldn't a theory about the fundamental structure of concrete reality have *some* empirical bite or constraint?"

  10. **The Ultimate Challenge: Evidence Against:**
      *   **Question:** "Finally, to crystallize this: Given that gerrymandered fusions are causally inert (or inherit causality), undetectable, never referred to, and play no role in any explanatory theory beyond mereology itself, what *conceivable* state of affairs—empirical, conceptual, or otherwise—would you accept as genuine evidence that unrestricted composition is *false*? Or is the theory effectively immune to counterevidence?"

  **Key Strategies Embedded:**

  *   **Targeting Vagueness:** Q1 & F-Up challenge the necessity of universalism as the *only* solution to vagueness and push the vagueness back onto "object."
  *   **Undermining Ontological Innocence:** Q2 & F-Up target the modal and explanatory weaknesses of CAI-lite, suggesting gerrymandered fusions aren't robust entities. Q4 & F-Up challenge the dismissal of proliferation as a cost.
  *   **Ordinary Language & Explanatory Idleness:** Q3 & F-Up directly confront the disconnect between the theory and linguistic/practical reality, pushing beyond "pragmatics." Q6 personalizes this.
  *   **Causation & Physics:** Q5 challenges the causal efficacy and relevance of fusions to fundamental physics.
  *   **Persistence & Identity:** Q8 highlights a counterintuitive consequence for object persistence.
  *   **Falsifiability/Methodology:** Q7, Q9, and crucially Q10 directly challenge the empirical and conceptual vacuum surrounding universalism, questioning its status as a substantive metaphysical claim. Q10 is the knockout punch forcing a concession on immunity or revealing a potential vulnerability.

  These questions force the guest beyond restating universalism's core arguments. They demand responses to its perceived weaknesses, counterintuitive consequences, explanatory idleness, and methodological isolation. Good luck with the interview!
