answer: |-
  You've hit on one of the most profound ethical debates in climate economics! Ramsey's critique of pure time preference (δ) is absolutely valid, and Stern *does* use a discount rate above zero (approx 1.4%). The apparent contradiction arises from misunderstanding what the discount rate comprises. Stern's approach is **not** a rejection of Ramsey's ethical principle; it's a nuanced application that distinguishes between discounting for time *itself* and discounting for *economic growth*.

  Here's the breakdown:

  1.  **The Discount Rate (r) is a Composite:**
      The standard formula is: **r = δ + ηg**
      *   **δ (Delta) = Pure Time Preference:** This is *exactly* what Ramsey called "ethically indefensible." It's valuing wellbeing *solely* because it occurs later in time. Stern sets **δ = 0.1%**, arguing that the *only* justification for *any* pure time preference is the small chance humanity goes extinct before that future arrives. This is **extremely close to zero**, directly honoring Ramsey's ethical concern.
      *   **η (Eta) = Elasticity of Marginal Utility of Consumption:** This reflects how much less valuable an *additional* unit of consumption (a dollar, a good) is to someone who is *richer*. If η = 1, a 1% increase in income leads to a 1% decrease in the marginal value of an extra dollar. Stern uses **η ≈ 1**.
      *   **g = Growth Rate of Per Capita Consumption:** This is the *expected* annual rate at which consumption (a proxy for wellbeing/wealth) grows over time. Stern projected **g ≈ 1.3%**.

      So, Stern's **r ≈ δ + ηg = 0.1% + (1 * 1.3%) = 1.4%**.

  2.  **Why ηg is Ethically Different (Stern/Ramsey View):**
      The key distinction is:
      *   Discounting *because* someone lives in the future (δ) = Ethically unjustifiable (Ramsey's point).
      *   Discounting *because* future people are likely to be *richer* (ηg) = Potentially justifiable.
          *   **The Logic:** If we expect future generations to be significantly wealthier due to economic growth (g), then transferring a dollar of consumption from poorer present people to richer future people involves an efficiency loss. The *marginal utility* (the happiness gained from that extra dollar) is higher for the poorer person today than it would be for the richer person tomorrow.
          *   **Analogy:** Imagine two people *alive today* – one poor, one rich. Giving $100 to the poor person generally creates more wellbeing than giving $100 to the rich person. ηg applies this logic *across time*: if the future is richer, sacrificing consumption by the (relatively) poorer present generation to benefit the (relatively) richer future generation needs to account for this diminishing marginal utility.
          *   **It's NOT Valuing Future Wellbeing Less:** It's acknowledging that a *specific unit of consumption* (a dollar) provides less *additional wellbeing* to someone who already has more. The ethical weight given to *wellbeing itself* remains equal across generations.

  3.  **Why Not r=0%? The Practical & Ethical Argument:**
      Setting r = 0% (meaning δ=0 *and* η=0 or g=0) would imply:
      *   **Absolute Sacrifice:** We should be willing to impose potentially *unlimited* costs on the present generation (even driving it into severe poverty) to prevent *any* future harm, no matter how distant or how small relative to future wealth. This ignores the diminishing marginal utility of consumption entirely.
      *   **Ignores Growth Prospects:** It assumes future generations won't be richer. If we *know* they will be vastly wealthier (even with climate damage), forcing the present poor to sacrifice excessively for the future rich becomes harder to justify ethically. ηg reflects this.
      *   **Ignores Investment Trade-offs:** Capital invested in climate mitigation isn't available for other investments (education, health, R&D) that *also* benefit future generations. A very low but positive r helps compare the long-term returns of different investments.

  4.  **Stern's Radical Stance:**
      By setting **δ ≈ 0** and **η ≈ 1**, Stern took an **extremely aggressive pro-future-generations stance** compared to most economists:
      *   **Near-Zero Pure Time Preference:** He virtually eliminated the ethically indefensible discounting for time alone.
      *   **Moderate η:** η=1 is common, but some economists use higher η (e.g., 1.5, 2), which would lower the weight given to future costs/benefits *more* if g is positive.
      *   **Result:** His r=1.4% is **much lower** than rates used in many other analyses (which often used r=3-7%, incorporating higher δ and η). This low rate is *why* the Stern Review concluded that the costs of *inaction* on climate are catastrophically high – future damages aren't heavily discounted. A higher r (like 5%) would drastically shrink the present value of future damages, making mitigation look less urgent.

  **In Conclusion:**

  No, Stern using r ≈ 1.4% is **not** him "admitting future people matter less." It's the opposite:

  1.  He **rejected pure time preference (δ ≈ 0%)** as ethically indefensible, honoring Ramsey.
  2.  His positive discount rate comes almost entirely from the component **(ηg ≈ 1.4%)** that accounts for the expectation that future people will be *richer* (so a specific dollar of cost/benefit has less marginal impact on their wellbeing than on poorer present people).
  3.  His chosen parameters resulted in one of the **lowest discount rates used in major economic assessments**, leading to the strongest possible argument for *immediate and substantial* climate action to protect future generations.

  The debate continues (e.g., is g really 1.3% with climate damage? Is η=1 appropriate?), but Stern's framework is fundamentally an attempt to apply rigorous ethics *within* the constraints of economic modeling, not a contradiction of the principle that future wellbeing matters equally. The 1.4% reflects a judgment about *relative wealth across time*, not the intrinsic value of future lives.
