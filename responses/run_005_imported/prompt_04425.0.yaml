answer: |-
  ## The Kelly Imperative: Dynamics, Not Desire

  The dispute over the Kelly criterion cuts to the heart of rationality itself: is maximizing geometric growth a logical necessity for a long-lived agent facing multiplicative bets, or merely one subjective preference among many? Samuelson's scathing critique frames it as preference; the ergodicity economics (EE) argument frames it as dynamical imperative. While the EE perspective powerfully reshapes our understanding of repeated betting, its claim to *non-optionality* holds strongest within the specific domain of multiplicative wealth dynamics and weakens significantly when extended to Garrabrant's broader "geometric rationality."

  **The Case for Non-Optionality: The Ergodicity Argument**
  The EE argument, championed by Ole Peters, lands its most devastating blow by exposing a hidden flaw in standard expected utility (EU) maximization for repeated multiplicative processes. Its core insight is this: **ordinary EU maximization implicitly assumes ergodicity – that averaging over many parallel universes (the ensemble average) yields the same result as averaging over time in a single universe (the time average).** This assumption fails catastrophically when wealth compounds.

  *   **The Arithmetic Mean Trap:** EU maximization, especially with linear utility, focuses on the arithmetic mean growth factor. A bet might have a positive arithmetic mean return (+EV), enticing an EU maximizer. However, if this bet carries significant risk of loss (e.g., 50% chance to double, 50% chance to halve), the *geometric* mean growth factor is 1.0 (√(2 * 0.5) = 1) – meaning no long-term growth. Worse, ruin becomes almost certain over time.
  *   **Time Average vs. Ensemble Average:** The ensemble average (expected value) of wealth grows exponentially if the arithmetic mean return is positive. But the *time-average growth rate* (what a single agent actually experiences) is determined by the geometric mean. Maximizing the arithmetic mean while ignoring the geometric mean is optimizing for a fictional multiverse of clones, not for the single trajectory you inhabit. An agent who repeatedly takes such +EV but geometrically neutral or negative bets will *almost surely* see their wealth dwindle or vanish, despite the "positive expectation."
  *   **Kelly as the Dynamical Fix:** Maximizing expected log-wealth directly maximizes the geometric mean growth rate. It aligns the agent's strategy with the *actual dynamical reality* of their single, unfolding path through time. It avoids ruin and achieves the highest possible *sustainable* growth rate. EE argues this isn't a *choice* of utility function; it's a *correction* to the flawed ergodic assumption baked into standard EU application. For an agent who must *live through the sequence*, maximizing geometric growth isn't optional if they care about long-term survival and growth at all. Ignoring it is dynamically incoherent.

  **The Case for Optionality: Samuelson's Subjectivism**
  Samuelson, and traditional EU theorists, counter with foundational principles:

  *   **Utility is Subjective:** The only non-arbitrary foundation for choice under uncertainty is von Neumann-Morgenstern (vNM) rationality, built on axioms like completeness, transitivity, continuity, and crucially, **independence**. Utility functions map outcomes to subjective value. The log function is just one such mapping. An agent who intrinsically values linear wealth (U(W) = W) isn't "wrong"; they simply have different preferences, accepting higher ruin risk for higher potential linear gains in scenarios where they might not face infinite repetition. Saying they *must* use log utility violates the core subjectivist tenet of economics.
  *   **Fallacy of Large Numbers?** Samuelson attacked the "probability one" long-run defense of Kelly, arguing it misapplies the law of large numbers. An agent with finite life, finite risk tolerance, or different time preferences might rationally prioritize near-term linear EV over asymptotic guarantees they'll never experience. Kelly's long-run dominance doesn't obligate a short-lived or differently motivated agent.
  *   **The Independence Axiom Sacrifice:** Garrabrant explicitly acknowledges that geometric rationality (extending beyond Kelly) requires abandoning the vNM independence axiom. This axiom is central to the standard normative justification for EU. Rejecting it is a major departure from traditional decision theory, making geometric rationality a fundamentally different, and arguably less universally justifiable, framework.

  **Adjudication: The Domain Matters**

  The ergodicity argument makes geometric-growth maximization **effectively non-optional *specifically for an agent facing indefinite sequences of multiplicative wealth bets whose sole concern is the long-term trajectory of their compounded wealth.** Here's the verdict:

  1.  **Within Multiplicative Betting:** EE wins decisively on the core question. Samuelson's subjectivism fails to grapple with the *dynamical trap*. An agent using linear EU in repeated multiplicative bets isn't just expressing a preference for risk; they are employing a calculation method (ensemble averaging) fundamentally misaligned with the temporal reality of their experience (time averaging). The result isn't merely suboptimal growth; it's almost sure eventual ruin for favorable but risky bets, or stagnation for others. This is not about subjective value; it's about the **mathematical incompatibility** between linear EU optimization and sustainable growth *in this specific dynamical system*. Kelly (log utility) is the necessary correction to align the optimization with the actual dynamics. It's not merely "defensible"; it's the only dynamically coherent strategy for long-term multiplicative growth.

  2.  **Beyond Wealth: Geometric Rationality's Extensions:** The case for non-optionality **weakens significantly** when geometric rationality is extended to domains like Nash bargaining or Bayesian updating (à la Garrabrant).
      *   **Loss of Dynamical Imperative:** In bargaining or belief updating, wealth isn't necessarily compounding multiplicatively over time in the same relentless, path-dependent manner. The core EE argument – the divergence of time and ensemble averages due to multiplicative noise – doesn't apply with the same force. The justification shifts from avoiding dynamical incoherence to appealing to other properties like scale-invariance or robustness.
      *   **The Cost of Abandoning Independence:** Sacrificing the independence axiom is a heavy price. While Garrabrant provides compelling alternatives (like multiplicative weights or bargaining solutions), these represent a *different* normative framework, not an *inescapable* one derived from physical dynamics. In these domains, the argument becomes more philosophical: *should* rational preferences be linear or scale-invariant? *Should* we prioritize robustness in a specific way? Here, Samuelson's subjectivism regains ground. Geometric approaches offer powerful and consistent tools, but insisting they are *non-optional* lacks the same ironclad, dynamical justification present in multiplicative wealth growth. They become highly attractive, perhaps even normatively superior for some goals, but not logically inescapable in the way Kelly is for the repeated bettor.

  **The Verdict**

  The ergodicity economics argument successfully establishes that maximizing geometric growth is non-optional for an agent focused on long-term wealth facing indefinite sequences of multiplicative bets. This is not merely a utility preference; it's a consequence of the non-ergodic dynamics of compounding, making linear expected-value reasoning dynamically incoherent and self-destructive in this context. Paul Samuelson's scorn, while highlighting the importance of subjective utility in *general* decision theory, ultimately misses the mark for this specific, pervasive, and dynamically treacherous scenario.

  However, the imperative fades when geometric rationality ventures beyond the domain of multiplicative wealth accumulation over time. In bargaining or belief updating, geometric methods offer valuable, consistent, and often robust frameworks, but they represent a *choice* of normative principles (like scale-invariance) built on a *rejection* of traditional axioms (independence), not an inescapable consequence of physical dynamics. The brilliance of the ergodicity insight is its power within the multiplicative arena; its force diminishes when the relentless compounding stops. Geometric rationality beyond wealth is a compelling paradigm, but it remains a paradigm choice, not a dynamical necessity.
