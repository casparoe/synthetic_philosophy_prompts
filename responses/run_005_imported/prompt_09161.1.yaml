prompt: |-
  This is gonna sound like a wierd question but its been bugging me since our last promo cycle. I sit on the 3-person committee that calibrates staff-level promo packets on my team. We score each packet against 3 gates -- Scope, Execution, Influence -- and you need majority yes (2 of 3 of us) on EACH gate separately to pass overall. Last cycle a candidate went 2-1 yes on all three gates individually, so by the rule she cleared the bar and got promoted. Afterward I compared notes with the other two reviewers and realized: if you'd just asked each of us 'promote, yes or no' on the whole packet, all three of us would've said no -- I was the no on Influence, one reviewer was the no on Scope, the other was the no on Execution. So gate-by-gate we said yes, but a plain up-or-down poll of the same 3 people on the same packet would've been unanimous no. Everyone I've mentioned this to just shrugs: 'the gates are the gates.' We've got a calibration sync Friday to lock the process for next cycle, and I want to bring something more solid than a gut feeling. Can you write a short memo (~300 words, something I could actually circulate) that picks one concrete way to run these votes going forward and argues for it, and that takes the case for gate-by-gate voting seriously -- it forces reviewers to engage with the rubric instead of just vibing an overall verdict, and stops one harsh reviewer from tanking someone over something unrelated to the criteria -- instead of just brushing it aside?
reasoning: |-
  Okay, let me approach this systematically. The user presents a fascinating voting paradox where a candidate passed each gate with 2-1 votes, yet would have failed if each voter gave an overall "promote/don't promote" decision. 

  First, I recognize this as a classic Condorcet paradox scenario in voting theory. The core tension lies between two valid approaches: gate-based voting ensures rubric adherence but creates this logical inconsistency, while holistic voting risks subjective judgments. 

  The user needs concrete solutions, not just theory. Their key constraints are: must maintain the 3-gate framework, preserve rubric rigor, and prevent outlier voters from tanking candidates. They also need something actionable for Friday's meeting.

  I consider several approaches:
  - Keeping the current system but adding a final holistic vote as tiebreaker
  - Requiring unanimous gate passage (but that might be too strict)
  - Switching entirely to holistic voting (loses rubric benefits)
  - Adding deliberation after gate passage

  The optimal path seems to be maintaining gate voting but adding a mandatory post-passage deliberation when this paradox occurs. This respects the rubric's structure while closing the loophole. 

  For the memo, I'll structure it to:
  1) Acknowledge the paradox without undermining the current system
  2) Explain why gate voting has value (rubric discipline, anti-bias)
  3) Propose the deliberation addendum as a refinement
  4) Frame it as strengthening the process, not fixing something "broken"

  The tone should be collaborative - this isn't about last cycle's case but improving future calibrations. I'll avoid technical jargon since the audience includes non-math colleagues. The word count needs to stay tight (~300 words) for meeting circulation.

  Most importantly, I must validate the user's observation - their attention to process detail is exactly what makes effective calibration committees work. The solution should honor that rigor while making the system more robust.
answer: |-
  ## Memo: Refining Our Promotion Calibration Voting Process  

  **To:** Promotion Calibration Committee  
  **From:** [Your Name]  
  **Date:** October 26, 2023  
  **Subject:** Proposal to Strengthen Voting Integrity While Preserving Rubric Rigor  

  Last cycle highlighted a rare but important scenario: a candidate passed all three gates (Scope, Execution, Influence) with 2-1 majorities per gate, yet *each* reviewer had reservations significant enough to vote "no" in a hypothetical overall decision. This outcome, while compliant with our rules, suggests a potential misalignment between our rubric-based assessment and holistic candidate readiness.  

  **Why Gate Voting Matters:**  
  Our gate system has critical strengths:  
  1. **Rubric Discipline:** It forces granular evaluation against specific competencies, reducing subjective "vibes."  
  2. **Anti-Bias Protection:** A single "no" on one gate doesn’t tank a candidate strong elsewhere, guarding against outlier harshness or unrelated critiques.  
  3. **Transparency:** Clear failure modes help candidates improve.  

  **The Weakness:**  
  The scenario above reveals a gap: reviewers may validate gates *individually* while harboring unresolved concerns about the candidate’s *overall* profile. This risks promoting candidates who technically "check boxes" but lack the cohesive impact we expect.  

  **Proposed Refinement:**  
  **Retain gate voting as the primary hurdle, but add a final holistic ratification vote *only* if a candidate passes all gates.**  
  - **Step 1:** Vote gate-by-gate (as now). Majority "yes" per gate required to advance.  
  - **Step 2:** If a candidate passes all gates, the committee immediately holds a confidential, anonymous vote: *"Based on the totality of the evidence, do you endorse promotion? (Yes/No)"*  
  - **Step 3:** Promotion requires **both**:  
    a) Passing all three gates (current standard), *AND*  
    b) A **majority "yes" (≥2 of 3) in the holistic ratification vote.**  

  **Why This Works:**  
  1. **Preserves Gate Benefits:** Rubric rigor and bias protection remain foundational.  
  2. **Closes the Cohesion Gap:** Ensures passing gate scores reflect genuine overall endorsement, not just isolated technicalities. If reviewers agree a candidate meets the gates but still lacks holistic readiness (e.g., inconsistent impact, critical gaps not captured by a single gate), ratification fails.  
  3. **Minimal Overhead:** Adds one quick vote *only* for gate-passing candidates.  
  4. **Fair & Defensible:** Explicitly ties the final decision to both rubric adherence *and* overall judgment.  

  This approach strengthens confidence in outcomes without sacrificing the structure that prevents arbitrary rejections. It acknowledges that while gates define the *criteria*, we must also validate whether the parts add up to a promotable *whole*.  

  I propose we pilot this for the next cycle. Let’s discuss in Friday’s sync.  

  ---  
  **Rationale for Approach Selection:**  
  The proposed "Ratification Vote" directly addresses the paradox while minimizing disruption. Alternatives like unanimous gates (too strict) or pure holistic voting (loses rubric discipline) were rejected. The ratification vote leverages the gate system's fairness but adds a crucial sanity check *only* when the gates alone produce discordant outcomes. It forces explicit discussion if ratification fails ("You agreed she met all gates, but won’t promote? Why?"), improving calibration. This balances structure with necessary human judgment.
