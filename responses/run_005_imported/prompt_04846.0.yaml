prompt: |-
  As a journalist who covers ideas and the sciences, I'm preparing questions for a magazine profile interview with a philosopher known for defending "parity" — the claim that in a genuinely hard choice, the alternatives are neither better, worse, nor precisely equal, but stand in a fourth, sui generis value relation that overturns what's often called the trichotomy thesis of comparison. Draft nine interview questions that go beyond having her restate the position, including one that presses on whether her small-improvement argument really rules out redescribing hard cases as merely "roughly equal," one asking whether "being on a par" does any work that ordinary vagueness in our evaluative concepts couldn't already do, one on whether resolving a hard choice by committing to an option is truly distinguishable from choosing arbitrarily, and one forcing her to explain how parity differs from the older idea, associated with Isaiah Berlin and Joseph Raz, that some values are simply incommensurable — with a follow-up for each keyed to the answer she is most likely to give.
