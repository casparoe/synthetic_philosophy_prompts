  We are ranking proposals for the shutdown problem. The criteria include:
   - How close it is to being a genuine, principled fix for button-manipulation incentives (i.e., preventing the agent from trying to prevent or cause the button press, and ensuring it shuts down when pressed).
   - How much each one has to assume away realistic complications (e.g., near-perfectly rational overseer, agent that can't scheme around the mechanism or self-modify, etc.).

   The proposals:
   1. MIRI "Corrigibility" (2015): Formalizes the problem and shows naive utility combinations fail. It's more of a problem statement and a negative result than a solution.
   2. Armstrong's "utility indifference" (2010): The agent is designed to be indifferent to being shut down. It requires exact utility specification and might be fragile to misspecification or self-modification.
   3. Hadfield-Menell et al.'s "Off-Switch Game" (2017): The agent defers to the human because of uncertainty about the true reward. It relies on the human being rational and the agent having the right kind of uncertainty.
   4. Orseau & Armstrong's "safely interruptible agents" (2016): Uses off-policy RL so that interruptions don't affect learning. This is a specific technique for RL agents during training, but may not address deployment-time manipulation.
   5. Thornley's incomplete preferences (2023+): The agent has no preference between trajectories of different lengths, so it doesn't care about the button. This is a decision-theoretic approach that avoids the issue by denying the agent a reason to care. However, it might be hard to implement and may not cover all cases of self-modification.
   6. Current practice (RLHF): Just train the model to behave well, no guarantees. This is an empirical approach with no theoretical guarantees and is vulnerable to distributional shift and adversarial behavior.

   Ranking:

