   - Hadfield-Menell et al.'s Off-Switch Game (3): This is a game-theoretic approach that leverages uncertainty. It is a principled solution under the assumption of a rational human and a well-specified uncertainty model. However, if the human is irrational or the agent is overconfident, it may fail. Also, the agent might still try to manipulate the button if it can influence the human's decision.

