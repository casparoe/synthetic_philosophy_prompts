answer: |-
  Here’s a draft that honors the weight of the moment, celebrates new citizens warmly, and navigates the "boundary problem" tension without evasion—framing it as democracy’s living question, not a flaw. It’s structured for **5 minutes** and balances heart with intellectual integrity:

  ---

  **(Start warmly, eye contact with new citizens and families)**  
  "Friends, soon-to-be-fellow-citizens, and families: Today isn’t just a legal transition. It’s the culmination of courage—of leaving homes, enduring paperwork, studying constitutions, and holding fast to a hope: that *here*, your voice might matter. Today, we celebrate **your** story joining **our** story.  

  **(Acknowledge the tension gently)**  
  Now, when we say ‘we the people’—that powerful phrase—it sounds simple. But democracy’s deepest secret is this: **‘The people’ isn’t a finished thing.** It’s not a statue we dust off, or a club with fixed rules. Who truly belongs? Whose voice counts? These questions churn beneath every election, every law, every march on the Mall. Scholars call it the ‘boundary problem’—and honestly? It’s messy. Democracy isn’t a puzzle to solve; it’s a conversation to continue.  

  **(Pivot to agency: They’re not joining a static group, but becoming co-authors)**  
  That’s why your oath today isn’t passive. You’re not being stamped ‘approved’ into a frozen club. You’re picking up a pen to help write the next paragraph of a story that began before any of us—and won’t end with us. **By swearing allegiance, you’re not accepting a finished definition of ‘the people’—you’re entering the room where it’s being redrafted, daily.**  

  **(Make it visceral – tie to their experience)**  
  Think of your journey here. You crossed literal borders, navigated systems, maybe learned new words for ‘freedom’ or ‘justice.’ That struggle? It’s proof you understand what few born here ever fully grasp: **democracy isn’t inherited—it’s chosen.** And today, you choose it. Not because America is perfect, but because you believe—like generations before you—that its gaps can be filled. By you.  

  **(Climax: Their role in resolving the tension)**  
  So yes, ‘the people’ is an argument. But today, you become its **co-authors**. You bring perspectives this soil hasn’t heard. You complicate old debates. You stretch ‘us.’ That’s not a bug in the system—it’s the *point*. When you take that oath, you’re saying: *‘Count me in. My hands are ready to build. My voice belongs here.’*  

  **(End with ceremonial gravity & warmth)**  
  So as you swear that oath—not to a person or party, but to an ideal forever being made real—know this: Your presence *changes* who ‘the people’ are. You make this democracy more vibrant, more true. Welcome. We need you. Let’s keep building this thing, together."  

  ---

  ### Why this works:
  1. **Acknowledges the tension** ("It’s messy," "not a finished thing") without drowning in theory.  
  2. **Reframes participation as agency**: They’re not joining a fixed group, but becoming active definers of it.  
  3. **Uses their journey** as proof of democratic commitment deeper than birthright.  
  4. **Turns "problem" into purpose**: The boundary question isn’t failure—it’s democracy’s engine, and *they* fuel it.  
  5. **Keeps warmth central**: Focuses on their courage, honors families, ends on "Welcome. We need you."  

  **Delivery Tip**: Pause before "Democracy’s deepest secret..." and after "...stretch ‘us.’" Let the idea breathe. Smile at "Welcome." It’s rigorous but radiant—exactly what the day demands.
