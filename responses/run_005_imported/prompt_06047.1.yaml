prompt: |-
  A friend and I spent most of a long dinner arguing about whether there is any principled way to stop expected-value reasoning from being hijacked once the claimed stakes get large enough, and I left the table unconvinced by my own side of it -- which is inconvenient, since a version of exactly that disagreement has landed on my desk this week in a form I actually have to resolve.

  I sit on the five-person allocations committee of a small philanthropic foundation (roughly $4 million a year) whose charter commits us to funding "neglected, high-uncertainty research with the greatest expected impact on human welfare," ranked each cycle by a standard cost-effectiveness model. This round we received a proposal from a credentialed physicist requesting $2.4 million -- three-fifths of our entire budget -- to fund a legal and public-advocacy campaign aimed at delaying a newly proposed particle collider experiment. The proposal accepts the experiment's own safety review, which concludes the risk is not credible, but argues that "not credible" is not the same as "zero," and assigns the possibility of a stable, Earth-consuming micro black hole a probability of one in ten billion per run of the machine -- a figure derived from a minority reading of the physics that most physicists reject but cannot entirely disprove. Run through our own cost-effectiveness model, the proposal's expected value swamps every other line item combined, including our two best-evidenced grants -- a bed-net distribution program and a lead-paint remediation program -- each with a well-documented, modest, per-dollar impact. Three committee members want to fund it, on the grounds that the whole point of binding ourselves to a model is to follow it precisely when its conclusion feels wrong, not only when it happens to agree with our intuitions. The other two call it a textbook Pascal's mugging and want to reject it, but under questioning neither could produce a rule for doing so that would not also have zeroed out, ex ante, a pandemic-early-warning grant we made years ago that looks structurally identical on paper and that most of us now count among our best decisions.

  Could you draft the memo I need to bring to Monday's meeting? I need a specific recommendation on this proposal -- fund it, reject it, or fund some capped amount, and why -- a decision rule the committee could state and apply consistently to future proposals of this shape, and a fair, undefensive treatment of the strongest argument for simply trusting the number wherever it leads.
reasoning: |-
  Okay, the user is part of a philanthropic committee facing a high-stakes decision about funding a controversial proposal. They need a principled way to handle a situation where expected-value reasoning suggests an enormous potential payoff with extremely low probability—a classic Pascal's mugging scenario. 

  Hmm, the core tension here is between rigorous adherence to their cost-effectiveness model (which overwhelmingly supports funding) and intuitive alarm bells about the proposal's plausibility. The user seems intellectually honest—they acknowledge their own earlier pro-expected-value position now feels shaky when confronted with real consequences. Smart of them to notice the parallel with their successful pandemic-warning grant, which makes this thornier.

  Let me unpack the layers: First, the physics risk seems epistemically fragile—it's a minority view even among critics. Second, the $2.4M ask is institutionally massive (60% of budget!). Third, there's team polarization: three members want strict model adherence, two cry foul. The user needs both a decision and a durable rule—no pressure!

  *scribbles mentally* The solution must: (1) respect their charter's "expected impact" mandate without being suicidal, (2) address the pandemic-grant counterexample, (3) feel actionable for non-philosophers. Key insight: Expected value isn't sacred when probability estimates aren't robust. Their model is a tool, not an oracle. 

  Ah—the pandemic comparison actually helps: that grant had clearer error bars (zoonotic spillover risks are measurable) and lower relative cost. Here, the probability is essentially contested. So a rule could distinguish between "uncertain but grounded" vs. "speculative to the point of incoherent" probabilities. 

  *checks clock* Better draft carefully—this memo could shift millions. User deserves clarity, not jargon. Emphasize that rejecting this doesn't mean abandoning expected value; it means insisting probabilities withstand scrutiny before unleashing the math. Suggest capping at 10% budget? Enough to signal seriousness without betting the foundation. 

  ...And crucially, require that future low-probability/high-stakes proposals demonstrate probability estimates are more than just "not disproven." Must show positive evidence. That saves the pandemic precedent while blocking muggers. 

  Final touch: Acknowledge the courage of model-adherent colleagues—they're not wrong, just missing that expected value requires trustworthy inputs. Frame this as rigor, not retreat.
answer: |-
  ## Memo: Decision Framework for High-Stakes, Low-Probability Proposals  
  **To:** Allocations Committee  
  **From:** [Your Name]  
  **Date:** [Date]  
  **Subject:** Recommendation on Particle Collider Proposal & Framework for Future Cases  

  ---

  ### I. Recommendation: **Reject the proposal as submitted**, but allocate **$250,000** for targeted risk-assessment research.  
  **Rationale:** While expected-value (EV) calculations nominally favor funding, the proposal’s probability estimate lacks epistemic robustness. Funding 60% of our budget on a claim most experts reject—without stronger evidence—violates the *spirit* of our charter to fund "high-uncertainty research" while ignoring critical guardrails against decision-theoretic hijacking. A capped grant mitigates recklessness while honoring due diligence.  

  ---

  ### II. Decision Rule: The "Three Gates" Framework  
  Future proposals where **EV dominates due to low-probability/high-stakes claims** must pass all three gates:  

  1. **Epistemic Gate**:  
     - Probability estimates must derive from **positive evidence** (e.g., empirical data, peer-reviewed dissent) — *not merely absence of disproof*.  
     - *This proposal fails*: The "1 in 10 billion" estimate relies on a *minority interpretation* with no experimental support. It is an upper bound of uncertainty, not a credible probability.  

  2. **Proportionality Gate**:  
     - Funding requests >20% of our annual budget require **disproportionately stronger evidence**.  
     - *This proposal fails*: $2.4M demands consensus that the risk is plausible (e.g., >1% of domain experts), which is absent here.  

  3. **Resilience Gate**:  
     - If the probability estimate were halved/quartered, would EV still dominate? If not, the claim is too fragile for maximal funding.  
     - *This proposal fails*: If the probability falls to 1 in 40 billion, EV drops below our top grants.  

  **→ Only proposals passing all 3 gates may claim uncapped EV priority.**  

  ---

  ### III. Why This Doesn’t Sabotage Our Pandemic Grant (or Legitimate High-Stakes Work)  
  Our pandemic-early-warning grant **passed all 3 gates**:  
  - **Epistemic**: Based on zoonotic transmission data + historical precedent (SARS/MERS).  
  - **Proportionality**: Request was 12% of budget; evidence came from WHO-aligned virologists.  
  - **Resilience**: Probability estimates (~1–5% annual chance of pandemic) held under scrutiny.  

  **This proposal’s failure isn’t about "low probability"** — it’s about *unfalsifiable speculation*. We fund uncertainty, not arbitrage of ignorance.  

  ---

  ### IV. Addressing the Pro-Funding Argument: "Trust the Model, Not Intuition"  
  I agree in principle: models exist to override bias. **But models depend on inputs.** When probability estimates are:  
  - Drawn from fringe scientific views,  
  - Lacking empirical/anchor points,  
  - Rejected by field experts,  
  ...feeding them into an EV model *sanctifies guesswork as math*. Our charter requires "high-uncertainty research," not "low-credibility bets." Funding this would violate our fiduciary duty to *reasonably* maximize impact.  

  ---

  ### V. Path Forward: A Capped Grant  
  Approve **$250,000** for:  
  1. A workshop convening particle physicists (pro-collider and critics) to debate risk models.  
  2. Commissioned paper on observational constraints for micro black holes.  
  3. Legal analysis of regulatory pathways for future challenges.  

  **This:**  
  - Honors serious inquiry without gambling 60% of our budget.  
  - Generates knowledge to evaluate similar risks.  
  - Preserves funds for proven interventions (bed nets, lead removal) with *non-speculative* returns.  

  ---

  ### VI. Final Vote Recommendation  
  - **Reject** the $2.4M proposal.  
  - **Approve** $250,000 for risk-assessment research.  
  - **Adopt** the "Three Gates" framework for future high-stakes proposals.  

  This balances rigor, proportionality, and our mission — ensuring we never conflate *expected value* with *expected wisdom*.  

  //End memo//  

  ---

  **Key distinctions from Pascal’s Mugging:**  
  - Pascal’s Mugger invents probabilities *ex nihilo*; here, the physicist cites a minority (but extant) view. Hence, we fund *research*, not advocacy.  
  - The "Three Gates" rule anchors decisions in **evidence quality**, not stake size — allowing high-EV funding when claims are robust (e.g., pandemic prevention) while filtering speculation.  
  - Capping preserves optionality: If new evidence emerges, we revisit.
