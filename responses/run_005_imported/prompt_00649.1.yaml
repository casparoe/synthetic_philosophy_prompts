answer: |-
  You've nailed the core tension in Sidgwick's infamous "dualism of practical reason" conclusion. Let's break down the logical move and the SPR connection:

  **1. The Logical Move: Why Conflict = Illusion (for Sidgwick)**

  Sidgwick isn't just saying he has two intuitions that *sometimes conflict*. He's claiming they are both presented by his "Practical Reason" as **fundamental, self-evident, and universally binding axioms** of rational conduct:

  *   **Axiom 1 (Rational Benevolence/Utilitarianism):** "I ought to aim at the general good."
  *   **Axiom 2 (Rational Egoism):** "I ought to aim at my own good."

  Here's why he sees unresolved conflict as catastrophic for intuitionism:

  1.  **The Demand for Coherence:** Sidgwick operates under a deeply rationalist, almost Cartesian, assumption: **Genuine, self-evident rational intuitions must form a coherent, consistent system.** Reason cannot fundamentally contradict itself. If two propositions are truly self-evident axioms revealed by reason, they *must* be reconcilable.
  2.  **The Nature of the Conflict:** The conflict isn't occasional; it's *fundamental* and *ultimate*. In situations where promoting the general good requires significant personal sacrifice (common in utilitarianism), these two axioms issue *directly contradictory commands*. Reason tells you *both* "Do X (for the greater good)" and "Do Not-X (for your own good)".
  3.  **The Implication:** If two propositions presented by reason as self-evidently true and binding are irreconcilably contradictory, then **reason itself is contradicting itself at its foundation.** This is intolerable for a rationalist like Sidgwick.
  4.  **The Conclusion:** Therefore, the *appearance* that both are self-evident intuitions of Practical Reason *must be an illusion*. One (or both) cannot be a genuine, self-evident deliverance of reason if they lead to this fundamental incoherence. Hence: "the apparently intuitive operation of the Practical Reason... is after all illusory." It's not that the intuitions are solid but conflict; it's that the conflict *proves* they cannot *both* be genuine products of infallible rational intuition in the way Sidgwick hoped to establish ethics.

  **In short:** For Sidgwick, genuine rational intuitions *cannot* fundamentally conflict. Therefore, unresolvable fundamental conflict implies that the *source* (the apparent intuitive faculty) is flawed or illusory. It's a failure of the *foundational method* he was using (intuitionism) to establish ethics.

  **2. The SPR Connection: Patching the Hole with Ghosts (or Telepathy)**

  Sidgwick's despair stemmed from the *logical* gap between virtue (promoting the general good) and self-interest. His rational intuitions demanded a connection, but reason couldn't *prove* one existed. The SPR was his attempt to find **empirical evidence** that could *provide* that connection, thereby restoring coherence to Practical Reason. How?

  *   **The Required Connection:** Sidgwick needed evidence that acting virtuously (promoting the general good) *ultimately and reliably* leads to one's *own* greatest good/happiness. This requires some mechanism ensuring cosmic justice.
  *   **SPR's Potential Evidence:**
      *   **Survival of Death:** If consciousness survives bodily death, then the "self" whose interest matters extends beyond this life. A just God or impersonal cosmic order could then reward virtue and punish vice in an afterlife, reconciling duty and self-interest over an infinite timeline. My sacrifice *now* could be compensated *later*.
      *   **Telepathy/Mind-Reading:** Evidence for non-physical mind or direct mental connection *could* (Sidgwick hoped) support the existence of a non-physical realm or consciousness, making survival more plausible. More importantly, if a divine mind exists, telepathy might be a *mechanism* for divine awareness of our actions, enabling post-mortem judgment and reward/punishment.
      *   **Evidence of a Moral Order:** Any evidence suggesting paranormal phenomena operated according to *moral* principles (e.g., spirits rewarding good, punishing evil) would directly support the needed connection.
  *   **The Logical Patch:**
      1.  **Premise:** Empirical evidence (e.g., credible communications from spirits, verified telepathy suggesting non-physical mind) establishes the *plausibility* (not logical proof, but enough for rational belief) of:
          *   Survival of death.
          *   The existence of a being/order capable of administering cosmic justice.
      2.  **Conclusion:** Therefore, it is *plausible* that virtue *is* connected to self-interest over the long term (eternal life). The sacrifice demanded by utilitarianism *might* be compensated.
      3.  **Resolution:** This *plausibility* allows Sidgwick to rationally *postulate* the connection ("this connexion of Virtue and self-interest") that Practical Reason "feels a vital need" for. The fundamental contradiction is resolved *if* this postulate is true. Reason isn't contradicting itself; it's pointing to a deeper truth requiring empirical (or postulative) support. The intuitions *can* be genuine because their apparent conflict disappears within a larger framework of cosmic justice.

  **Why SPR Specifically?**

  1.  **Empirical Gap:** Sidgwick knew philosophical arguments for God/immortality (like Kant's) were shaky. He wanted *evidence*.
  2.  **Scientific Rigor (Aspiration):** The SPR was founded (by Sidgwick, Myers, Gurney) to investigate psychic phenomena *scientifically*, applying rigorous methods to a domain rife with fraud. Sidgwick hoped science might validate what metaphysics and pure reason could not.
  3.  **The Stakes:** For Sidgwick, this wasn't a hobby; it was a desperate search to save the rational foundation of ethics and avoid the "downer ending" of fundamental incoherence in Practical Reason. If the SPR found compelling evidence, it would "make consistent with itself" the demands of Practical Reason.

  **In essence:** Sidgwick's SPR work was a decades-long, scientifically rigorous (in intent) quest for empirical evidence that could bridge the gap between his two deepest rational convictions (duty to others and duty to self) by proving a cosmic system guaranteeing that virtue ultimately pays. He needed ghosts (or something like them) to save ethics from despair.
