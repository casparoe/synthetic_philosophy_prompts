  PSR also comes in. For Leibniz, if there's no reason for God to place the universe one way or another, that possibility is meaningless. The modern setup might still allow multiple mathematical representations of the same physical state, but Leibniz would demand that each distinct possibility needs a sufficient reason. If the models are physically equivalent, they aren't distinct, so PSR isn't violated. But if sophisticated substantivalism posits points as real entities without individuality, PSR might question why these points exist at all if they don't contribute distinguishable properties. 

