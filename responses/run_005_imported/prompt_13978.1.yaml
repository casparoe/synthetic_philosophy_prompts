prompt: |-
  Ok so this has been bugging me for like a week and I don't really have anyone to bring it to who'd actually engage with it seriously instead of just telling me to drop it. My boyfriend and I were on a break for about two months last spring, and during that time I hung out with my ex a handful of times, went out more than usual, flirted a bit, but nothing physical ever happened with anyone the whole time. A few days ago the topic came back up and he told me he's basically certain that if the "right" opportunity had come up during that break, I would have cheated, based on how I was acting back then, and that this is just a true fact about who I am even though nothing actually occurred. I told him that's not fair, because you can't know for sure what someone would have actually done in a situation that never happened, especially since nothing was forcing my hand either way and I could've gone a totally different direction. He thinks I'm dodging, and that a person's character basically does fix what they'd do even in situations that never came up, so there IS a definate right answer, he just knows it and I don't want to admit it.

  My sister said we're both being weird and to just move on, but it's stuck with me on a different level than the relationship stuff itself. Is there actually some real fact out there about what a person would have freely chosen to do in a specific situation that never happened, or is that kind of claim basically meaningless/made up no matter how well someone thinks they know your character? I keep going back and forth on it and would love an outside take.
