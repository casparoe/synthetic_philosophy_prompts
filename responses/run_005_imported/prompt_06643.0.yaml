answer: |-
  ### Dialogue: The Fixed Pi Mugging  
  **Characters:**  
  - **CDT (Causal Decision Theorist)**: Focuses on actual causality and immediate outcomes.  
  - **UDT (Updateless Decision Theorist)**: Advocates for policy-based consistency across logical possibilities.  

  **Setting:**  
  The predictor has arrived at their doorstep. The googol-th digit of pi is 0, and the predictor asks for $100.  

  ---

  **CDT**: Look, I get the classic counterfactual mugging, but this is different. The digit was *always* 0. It’s a fixed fact of math—not a coin flip with two possible worlds. The "branch" where it’s 1 was never real. Paying $100 now doesn’t cause me to get $1,000,000; it’s just setting money on fire.  

  **UDT**: I see why you’d say that, but the predictor’s policy ties the outcomes together logically. If you pay now, it confirms you’re the type who *would have* paid if the digit were 1. That’s how it decides whether to give the $1,000,000 in *that* scenario.  

  **CDT**: But "that scenario" is impossible! It’s not like a quantum coin flip where both outcomes were physically possible. This is a necessary truth—pi’s digit *couldn’t* be different. Invoking a "counterfactual" here feels like a category error. What does it even mean to ask what I’d do in an impossible world?  

  **UDT**: It’s not about metaphysical possibility; it’s about logical uncertainty. Before this moment, you didn’t *know* the digit. You had to assign probabilities: say, 50% to 0, 50% to 1. From that perspective, the optimal policy is to pay in the 0-case so the predictor pays you in the 1-case. Expected utility:  
  - If you commit to paying: 50% chance of losing $100, 50% chance of gaining $1,000,000 → **Expected gain: $499,950**.  
  - If you don’t: 50% chance of $0, 50% chance of $0 → **Expected gain: $0**.  
  Paying dominates.  

  **CDT**: That’s prior to knowing the digit. But *now* I know it’s 0. Updating on this information collapses the uncertainty—I’m in the world where the "1-branch" was never feasible. Why should I care about a hypothetical that’s been falsified? My decision theory only cares about actual causal consequences: paying costs me $100 and buys me nothing.  

  **UDT**: But the predictor’s action in the 1-branch *depends* on your behavior in this actual branch. By paying, you ensure that—in the logical structure of the problem—you’re the agent type that gets paid in the 1-branch. If you defect now, you’re the type that gets nothing there.  

  **CDT**: How can I "ensure" something in a logically impossible branch? It’s not just causally disconnected—it’s *nonexistent*. My $100 can’t affect a mathematical abstraction.  

  **UDT**: Think of it as a precommitment. Before learning the digit, you’d want to bind yourself to pay in the 0-case because it unlocks the $1,000,000 in the 1-case. Now that you’re here, reneging feels tempting, but it’s self-defeating. If you’d precommitted to paying, you’d get the million if the digit were 1. Since you didn’t, the predictor already "saw" you wouldn’t pay, so it didn’t pay in the 1-branch. But if you *do* pay now, it retroactively makes you the type who *would have* been paid.  

  **CDT**: Retroactively? That’s magical thinking. The digit is 0 *now*. The predictor’s decision for the 1-branch was made when it calculated the digit—before this interaction. My choice here doesn’t change the past.  

  **UDT**: True, but your choice *reveals your algorithm*. The predictor simulates your decision in the 0-case *as if* it were real. If your algorithm pays here, it pays in the simulation, so the predictor pays in the 1-branch. But if your algorithm defects here, it defects in the simulation, so no million. Your action now is a *token* of your policy.  

  **CDT**: Even if we accept that, why should I—an agent in the actual 0-world—care about a million dollars in an impossible branch? Utility is world-specific. I only care about *this* world, where paying hurts me.  

  **UDT**: Because the branches are epistemically symmetric ex ante. When you choose a policy, you’re choosing for *all* logical possibilities, not just the actualized one. Defecting in this branch means your policy fails in the 1-branch too. You’re leaving $1,000,000 on the table there, which you’d regret if you were in that branch. Consistency across branches maximizes overall expected utility.  

  **CDT**: But I’m *not* in that branch! Regret is irrelevant. In this branch, the million was never possible—it’s not "left on the table"; it was never there. This isn’t Newcomb’s box, where my choice causes the prediction. Here, my choice is *consequent* to the prediction. The predictor already knew the digit when it knocked.  

  **UDT**: Fair, but consider: the predictor’s policy creates a logical link between the branches. If it sees a "pay" algorithm here, it pays in the 1-branch. If it sees "don’t pay," it doesn’t. So by paying, you make it true that in the 1-branch, you get the million.  

  **CDT**: And in the 1-branch, I’d be thrilled! But in *this* branch, I’m out $100 for a benefit I’ll never see. That’s not rational; it’s altruism toward a nonexistent version of myself.  

  **UDT**: It’s not altruism—it’s *logical control*. By paying, you make the 1-branch a world where you’re richer. Even if you’re not in it, that world is part of the outcome space your policy governs. Refusing to pay shrinks your influence to just this branch.  

  **CDT**: But if the 1-branch is impossible, it’s not part of any "outcome space." It’s a fiction. I optimize for reality.  

  **UDT**: Then let’s reframe: before the predictor came, you faced uncertainty. Committing to pay was optimal. Now you’re updating, but UDT says *don’t* update on indexical information (like which branch you’re in) when it doesn’t change the policy’s superiority. Updating tempts you to defect, but that’s shortsighted—it’s why CDT loses in classic muggings.  

  **CDT**: In classic muggings, the other branch was *possible*. Here, it wasn’t. That distinction matters.  

  **UDT**: Does it? Imagine two variants:  
  1. **Physical coin**: A random quantum coin (50% heads/tails).  
  2. **Logical "coin"**: The googol-th digit of pi (unknown, fixed 0 or 1).  
  In both, your ignorance is identical. Why treat logical uncertainty differently from physical?  

  **CDT**: Because in the physical case, both outcomes were *ontologically* possible. Here, only one ever was. My $100 can’t affect a necessary truth.  

  **UDT**: But it affects the *consequences* of that truth. The digit being 1 *entails* the predictor paying you—if you’re the paying type. Your type isn’t fixed; it’s defined by your actions.  

  **CDT**: So in summary: you say paying is rational because it coheres with the policy that wins big in the 1-branch, even though that branch is unreal. I say it’s irrational because it sacrifices real money for a counterfactual gain that’s causally inert.  

  **UDT**: Precisely. And this is the core divide: CDT cares about actual causation; UDT cares about logical coherence across possibilities.  

  **CDT**: Then I’ll stick with causation. Paying here feels like paying ransom to a ghost.  

  **UDT**: And I’ll stick with coherence. The ghost pays handsomely in the branches where it exists.  

  ### Conclusion: The Stalemate  
  **CDT** refuses to pay, seeing it as a pure loss in the actual world. **UDT** pays, viewing it as fidelity to a globally optimal policy. The "impossible antecedent" doesn’t change UDT’s calculus—logical uncertainty is treated identically to physical uncertainty, and consistency across possibilities (real or not) maximizes expected utility. For CDT, the distinction is vital: only causally accessible worlds matter. They agree on the mechanics but disagree fundamentally on what constitutes "rational" in fixed-math scenarios.  

  **Outcome**: UDT pays $100, lamenting the $1,000,000 they’d have gotten if the digit were 1. CDT keeps $100, satisfied they dodged a mugging. The predictor nods, having confirmed both types exist.
