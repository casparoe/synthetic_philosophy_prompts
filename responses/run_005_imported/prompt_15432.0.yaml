  The Reflection Principle essentially says that your current credence in a proposition should equal your expectation of your future credence in that same proposition. Dev presents a thought experiment where he knows he'll be manipulated into having high credence (0.9) in a cryptocurrency claim that he currently disbelieves (0.05). He argues that Reflection would require him to raise his credence now, which seems absurd since he knows the manipulation is baseless.

