answer: |-
  This disagreement touches on one of the deepest philosophical questions: **what constitutes personal identity and survival over time?** Neither of you is clearly "wrong," but you're operating from fundamentally different perspectives on identity. Here's a breakdown:

  ### 1. **The Core Positions: Patternism vs. Somatism**
      - **Your Friend's View (Patternism/Psychological Continuity):**  
        She sees her identity as residing in her unique *pattern* of memories, personality, dispositions, and cognitive structures. If this pattern is perfectly reconstructed—even in a new substrate—*she* survives. The atoms are irrelevant; the information is the essence. This aligns with philosophers like Derek Parfit, who argued that identity isn't a deep fact but psychological continuity is what matters for survival.
      - **Your View (Somatism/Biological Continuity):**  
        You see identity as tied to the *specific biological organism*—the original brain and body. A perfect copy, no matter how faithful, is a *new person* inheriting her memories. The original consciousness ended at death; the copy is a distinct entity with false memories of being her. This reflects biological or embodied views of identity (e.g., Eric Olson).

  ### 2. **Why Neither of You is "Confused"**
      - **Her stance is coherent:** If identity is defined by psychology, revival via reconstruction *is* survival. To her, asking "which atoms?" is like asking which specific grains of wood make a table "the same table" after repairs. The structure/function defines it.
      - **Your stance is also coherent:** If consciousness is an embodied biological process, copying the pattern severs the thread of subjective experience. The original *feeling of being her* is gone, even if a perfect doppelgänger appears.

  ### 3. **The Unresolvable Problem: The "Fission" Dilemma**
      Imagine a future where *two* copies are made from her scan. Both claim to be her, share her memories, and love you equally. Which one is the "real" her?  
      - **Patternism:** Both are her (though this creates paradoxes).  
      - **Somatism:** Neither is her; both are new people.  
      This scenario highlights why there's no empirical "answer"—it hinges on what we *define* as survival.

  ### 4. **Practical Implications for Her Decision**
      - **If psychological continuity is her priority,** cryonics *does* offer a path to what she values: the persistence of her identity-as-pattern. Her hope isn't irrational *given her definition of self*.  
      - **If biological continuity is essential,** cryonics fails. The original consciousness is extinguished, and the copy is a sophisticated memorial.  

      **Crucially:** Her willingness to accept the copy *as herself* makes the outcome meaningful *to her*, even if you see it as a replica. For her, the "comforting story" *is* the continuity.

  ### 5. **A Middle Ground? The Question of Subjective Experience**
      - Even if a copy is "not her" in your view, *from its own perspective*, it will *feel* like her waking up. It will mourn her death as its own past demise. This might satisfy her desire for *a* consciousness with her identity to continue.  
      - However, this doesn't bridge the gap for you, as the original stream of experience ends.

  ### Conclusion & Advice
  **The disagreement isn't confused—it's foundational.** You prioritize the *persistence of the biological subject*; she prioritizes the *persistence of the psychological pattern*. Neither is provably right, as personal identity has no scientific consensus.  

  **For her decision:**  
  - If she genuinely accepts patternism (as many transhumanists and philosophers do), continuing payments is rational *for her goals*. She isn't deceived—she's chosen a valid framework where revival equals survival.  
  - Your skepticism is equally valid, reflecting a biological view of identity. But unless she shares your metaphysical priorities, urging her to stop payments based on your view risks dismissing her values.  

  **Recommendation:**  
  Acknowledge that this is a philosophical choice, not a technicality. Say:  
  > *"If a perfect reconstruction with your memories and personality *feels* like survival to you, then cryonics makes sense. For me, it wouldn’t feel like *my* survival—but this is about your values, not mine. If the pattern is what matters, invest with confidence."*  

  This respects her autonomy while honoring your intellectual honesty. Ultimately, her hope rests on a coherent (if contestable) vision of selfhood—one that future societies may well accept. Whether *you* would call it "her" or not, *she* would experience it as continuity, and that may be enough.
