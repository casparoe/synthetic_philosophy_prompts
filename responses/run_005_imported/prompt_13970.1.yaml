answer: |-
  Here’s a toast that honors your journey, his work, and the profound return to shared humanity—all in everyday language, lasting under three minutes:

  ---

  **(Raising a glass, looking at your brother)**  
  "Five years. That’s a lot of sunrises. A lot of choices. And today, we’re here because of every single one you made, [Brother's Name].  

  **To our family and friends:** I know we all remember the years when it felt like we’d lost him. Back then, I’d swing between two places in my heart. Sometimes, I’d be furious. Hurt. Like when promises broke, or trust vanished. Other times… I’d just shut down. I’d tell myself, 'It’s not him. It’s the sickness. He can’t help it.' Like he wasn’t really *in* the driver’s seat anymore. It was easier, maybe, to think of him as something happening *to* us, rather than someone choosing *with* us.  

  **But here’s the miracle of these five years:** You didn’t just get sober, [Brother's Name]. You showed up. You did the hard, humble work of looking us in the eye again. You made amends not because someone told you to, but because you meant it. You rebuilt what was broken, brick by brick, day by day.  

  **And that changed everything.** It meant we couldn’t just see you as ‘the problem’ anymore. We couldn’t just shrug and say, ‘Well, that’s how he is.’ **Because you proved how you *are*.** You fought your way back to being fully *here*—present, accountable, real.  

  **So today?** We’re not tiptoeing around you. We’re not making excuses for you. We’re not holding you at arm's length because we’re scared. **We’re sitting at this table with you—the whole you.** That means we get to laugh with you fully. We get to trust you completely. We get to be annoyed when you tell that same old joke! **We get to love you, thank you, and yes—sometimes even get mad at you—just like anybody else we cherish.**  

  **That’s the gift you gave us, [Brother's Name].** You didn’t just earn this chip. You earned your way back into the messy, beautiful, ordinary dance of being a brother, a son, a friend. You’re back where you belong—not as a patient, but as a person. Standing tall.  

  **So here’s to five years of grit. Five years of grace. And five years of proving that the best place to be is right here, fully responsible, fully loved, and fully home. Cheers to you, brother."**  

  ---

  **Why this works for your audience:**  
  - **Family Feeling It:** Uses visceral language ("lost him," "promises broke," "shut down," "sitting at this table") and focuses on love, presence, and shared relief.  
  - **AA/Sponsor Understanding:** Resonates with core principles (amends, accountability, showing up, "brick by brick") without jargon. "Fighting your way back" and "proved how you are" subtly affirms agency within recovery.  
  - **Strawson’s Arc:**  
    * **Past Reactive/Objective Swing:** Explicitly names the resentment *and* the detached "sickness" framing.  
    * **The Shift:** Credits *his consistent actions* (amends, showing up) as the force that dissolved the objective stance.  
    * **Restored Standing:** "Not as a patient, but as a person" is the payoff. "Loved, thanked, even mad at you... just like anybody else" explicitly reclaims the full range of ordinary reactive attitudes.  
  - **Tone:** Warm, proud, grounded. Ends on belonging and homecoming.  
  - **Time:** Reads comfortably in 2.5-3 minutes with natural pauses.  

  This toast meets him—and your shared history—exactly where you are now: in the hard-won, ordinary light of day, together again. Congratulations to him, and to you.
