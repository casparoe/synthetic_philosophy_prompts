answer: |-
  The numbers swam before Liam’s eyes on the oncology report. Stage III Pancreatic Adenocarcinoma. Words that felt like cold stones dropping into his stomach. But it was the single, stark percentage Dr. Vance pointed to that held him frozen: **8%**. Five-year survival.

  “Based on the most current, robust data,” Dr. Vance said, his voice carefully modulated, the practiced tone of delivering unwelcome news. He tapped the report. “This cohort – stage, subtype, confirmed nodal involvement – gives us the most reliable predictive baseline. It’s… a starting point.”

  *Cohort*. Liam knew it meant a group. A box he’d been shoved into. He imagined faceless thousands, diagnosed like him, their fates averaged out. Eight out of a hundred walking out of this shadow in five years. Ninety-two gone. Where did he stand in that grim queue?

  His wife, Chandra, gripped his hand. “But Liam’s only 48,” she protested, her voice tight. “He’s fit. Never smoked. Runs marathons. Surely that counts for something?”

  Dr. Vance offered a sympathetic but weary nod. “Age and general fitness are factored into the broader cohort data, Mrs. Evans. The statistics *do* reflect variation. But pancreatic cancer… it’s notoriously aggressive. The *primary* drivers for prognosis in the data remain stage, subtype, and spread. Focusing on the most directly comparable group gives us the clearest picture.” His gaze settled back on Liam. “We plan treatment based on this reality.”

  Reality. An 8% reality. Liam felt the weight of that number like a physical thing. It dictated the chemo cocktail, the radiation schedule, the exhausted, hollow-eyed future it carved out. He was a data point. Population X: Stage III Pancreatic Adenocarcinoma, N1.

  Chandra wouldn’t accept it. Night after night, while Liam drifted in a chemo fog, she scoured medical journals and patient forums. She printed out studies, highlighting sections in furious yellow.

  “Look, Liam,” she said one evening, pushing a paper towards him. Her eyes were bright with desperate hope. “This meta-analysis. Patients *under 50* with localized disease *and* the KRAS G12D mutation – that’s your mutation, right? – show a *significantly* higher five-year survival. Twenty-three percent!”

  Liam blinked. Twenty-three. Not eight. It felt like a reprieve whispered from the future. This was a different box. Population Y: Stage III Pancreatic Adenocarcinoma, N1, Age <50, KRAS G12D+. Narrower. Finer. *Him*. Wasn't this more real? Didn't his youth, his specific genetic glitch, matter more than being lumped in with seventy-year-olds with different mutations?

  “See?” Chandra pressed. “You’re not just ‘Stage III’. You’re *this*. You’re younger, stronger, you have *this specific* marker. Dr. Vance’s number… it’s too broad. It washes out people like you.”

  Liam clung to the 23%. It became his talisman. He mentioned it tentatively to Dr. Vance during his next consult.

  Dr. Vance sighed, steepling his fingers. “Mrs. Evans’s research is commendable, Liam. Truly. But smaller subgroups introduce volatility. That twenty-three percent? The confidence interval is wide. It could be fifteen, it could be thirty. The data isn’t as robust. The *stage and spread* cohort has decades of validation across hundreds of thousands of cases. It’s the bedrock.” He paused, choosing his words. “We risk… false hope, or worse, undertreating, if we anchor to less established subsets. The broader class gives us the most statistically sound footing for *aggressive* intervention.”

  Liam felt torn. Was he Population X, facing an 8% climb? Or Population Y, with a 23% chance? One demanded grim endurance, the other offered a sliver of daylight. Both felt true, depending on where you drew the lines around "people like me."

  Enter Dr. Aris Thorne. Not Liam’s oncologist, but a researcher affiliated with the hospital, mining their anonymized patient database with sophisticated algorithms. He approached Liam about a study on "predictive granularity." Liam, intrigued and desperate for any edge, agreed to contribute his data.

  A week later, Thorne called him in. His office was a nest of glowing screens showing complex, branching visualizations. Thorne, young and intense, pointed at one cluster on a screen.

  “Mr. Evans, fascinating. My model looks beyond standard cohorts. It finds latent patterns – comorbidities, treatment timing, even subtle lab value interactions missed in broad categories. *Your* predictive cluster…” He zoomed in. “…is small. Very specific. Stage III, KRAS G12D+, Age 45-50, *no* significant comorbidities… *but* with a specific pattern of inflammatory markers present at diagnosis, *and* a recorded delay of over three weeks between initial symptom and first scan.”

  Liam remembered that delay. The GP had thought it was gastritis. “What… what does that mean?”

  Thorne’s eyes gleamed. “This cluster – let’s call it Cluster Z – has a historical five-year survival of… 3%.”

  Liam’s breath hitched. *Three*.

  “However!” Thorne raised a finger quickly. “The model identifies a *sub-sub-cluster* within Z. The differentiator seems to be… baseline blood pressure control. Patients with tightly controlled BP, despite the inflammation and delay, show a markedly different trajectory.” He clicked, isolating a tiny node. “*This* group? Nineteen percent.”

  Liam stared. Three percent. Or nineteen. Depending on whether you counted his mild, well-controlled hypertension as part of the defining picture. Was hypertension part of his essential "cancer identity"? Population Z (delay + inflammation) doomed him. Population Z+ (delay + inflammation *but* good BP) offered a lifeline almost as strong as Chandra’s 23%.

  “Which… which one am I?” Liam asked, his voice hoarse.

  Thorne spread his hands. “Statistically? You belong to both clusters simultaneously. The model assigns probabilities *based on the chosen level of granularity*. The broader cluster (Z) has more data points, hence a seemingly ‘firmer’ but grimmer number. The finer cluster (Z+) is more specific to *your* documented physiology, but has fewer historical matches. Which probability is more *actionable*? That’s the clinical question. Dr. Vance would likely prioritize the robustness of larger groups. Others might argue the finer grain is more personally relevant.”

  Liam walked out numb. Eight percent (Dr. Vance’s bedrock cohort). Twenty-three percent (Chandra’s hopeful, age-and-mutation slice). Three percent (Thorne’s delay-and-inflammation cluster). Nineteen percent (Thorne’s cluster *minus* the hypertension penalty).

  His fate wasn’t just in the hands of his cells or his doctors. It was in the hands of the invisible lines drawn around him. Was he primarily defined by his cancer's stage? His age? His specific mutation? The unfortunate delay? His otherwise healthy cardiovascular system? Each choice of "people like me" conjured a different future probability, demanding a different kind of courage, a different level of hope.

  He sat in the quiet apartment, Chandra asleep after another long hospital day. Three browser tabs glowed on his laptop:
  1. The hospital portal showing his treatment plan, anchored to Population X (8%).
  2. The research paper Chandra found (Population Y: 23%).
  3. Thorne’s emailed summary, highlighting both Cluster Z (3%) and Z+ (19%).

  Each number pulsed with its own terrible weight. Each claimed to represent his odds, his reality. Each was built from the lives and deaths of others deemed "like him" in some way. But which way mattered most? Was there a *true* "him" that belonged to only one group?

  He looked at the rain streaking the window, blurring the city lights. His decision wasn't just about chemo cycles or clinical trials. It was about which mirror to hold up to his future. The broad, statistically sturdy mirror reflecting a dim image? Or one of the sharper, clearer mirrors that might show a slightly brighter reflection, but was crafted from far fewer fragments of other lives? The reflection changed, drastically, depending on the glass you chose. And no one could tell him which glass was truly his. The answer seemed to live in the space between the numbers, in the silence where the populations overlapped and contradicted, a territory defined only by the question itself: *Who counts as 'like me'?* The rain offered no answer, only the sound of uncertainty falling on the city.
