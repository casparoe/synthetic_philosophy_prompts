  Crucially, all three must have reasonable arguments. The oncologist isn't wrong—broad cohorts stabilize predictions. The patient's self-perception as an outlier isn't delusional. The data scientist's AI-driven clusters are mathematically sound. The tragedy is that all models are defensible but yield different outcomes. 

  For the protagonist, Liam works—diagnosed with pancreatic cancer, which has brutal statistics. His wife Chandra can voice the "narrower class" view naturally through desperation. Dr. Vance embodies institutional reliance on established cohorts. Enter Dr. Aris Thorne: a quant researcher mining medical databases, who disrupts with hyper-personalized probabilities. 

  Key scenes: 
