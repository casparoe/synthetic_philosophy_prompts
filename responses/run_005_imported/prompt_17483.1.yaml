  Ok this is a bit of a rabbit hole but I've been reading old MIRI posts on "embedded agency" for a story on agent foundations research, and I'm stuck on the tiling agents / Löbian obstacle bit (the "robust delegation" section). As I understand it: a proof-based agent wants to authorize a successor that only acts once it's proven an action safe, and the first agent would love to just trust "whatever my successor's proof system proves is true" so it doesn't have to re-derive everything itself -- but Löb's theorem makes that trust step blow up if the successor runs the same (or an equally strong) proof system. Can you spell out, mechanically, where exactly the self-reference bites, and why the agent can't just assume its own soundness and hand that down the chain? I also vaguely recall a patch involving a tower of slightly weaker proof systems (parametric polymorphism, i think?) so each successor trusts the next without hitting Löb head-on -- does that actually dissolve the obstacle, or just relocate it one level down and call it a day? Feel free to get into why some people would rather ditch proof-based certainty for probabilistic/reflective reasoning instead, if that's relevant.
reasoning: |-
  We are diving into the Löbian obstacle for tiling agents and how it relates to embedded agency. The core issue is that an agent (let's call it A0) wants to delegate to a successor agent (A1) that uses a proof system to ensure actions are safe. A0 would like to trust that if A1's proof system proves a statement (like "action a is safe"), then that statement is true. However, due to Löb's theorem, if A0's own proof system is sufficiently strong (and includes the proof system of A1), then assuming the soundness of A1 leads to a contradiction.

  Let me break it down step by step.

  ### 1. Setting up the agents
  Suppose we have an agent A0 that uses a formal system T0 (a theory strong enough to represent computable functions and do basic arithmetic, e.g., Peano Arithmetic or PA). A0 wants to create a successor agent A1 that uses a formal system T1. We assume T1 is at least as strong as T0 (so T0 ⊆ T1). The idea is that A1 will only take an action if it can prove in T1 that the action is safe.

  A0 would like to have a rule: if A1 proves in T1 that action a is safe, then a is indeed safe. But note: A0 is reasoning in T0. So A0 would like to have:

      T0 ⊢ ∀a (Prov_{T1}(⌜Safe(a)⌝) → Safe(a))

  where Prov_{T1}(φ) is a formula that expresses that φ is provable in T1, and Safe(a) is the statement that action a is safe.

  ### 2. The Löbian problem
  The problem is that if T1 is at least as strong as T0 (so T0 can prove everything that T1 can, and more) then the above statement is equivalent to the soundness of T1. However, by Löb's theorem, a theory cannot prove its own soundness (unless it is inconsistent).

  Löb's theorem states that for any formula φ in the language of T, if T ⊢ Prov_T(⌜φ⌝) → φ, then T ⊢ φ.

  In our case, if we try to set T0 = T1 (so the same theory), then A0 is trying to prove in T0:

      ∀a (Prov_{T0}(⌜Safe(a)⌝) → Safe(a))

  But this is the same as asserting the soundness of T0. By Löb's theorem, if T0 proves this, then T0 can prove any Safe(a) (and more). That would mean T0 is inconsistent (unless it is inconsistent to begin with). So we cannot have that.

  But even if T1 is a proper extension of T0, if T0 can reason about T1 and T1 is at least as strong as T0, then the same issue arises because T0 still cannot prove the soundness of T1 (which is a stronger theory) without causing inconsistency.

  ### 3. Why can't the agent just assume its own soundness?
  The agent A0 cannot assume its own soundness (i.e., that everything it proves is true) because that would lead to inconsistency. Specifically, if T0 ⊢ ∀φ (Prov_{T0}(⌜φ⌝) → φ), then by Löb's theorem, for any φ, T0 ⊢ φ. That's inconsistent.

  But note: the agent doesn't need to assume soundness for all statements, only for the safety statements. However, the safety statements might be arbitrary. In fact, the safety statements might encode arbitrary computations (like the execution of the successor agent). So the problem remains.

  ### 4. The parametric polymorphism patch
  One way around this is to use a tower of proof systems. We create a sequence of agents A0, A1, A2, ... where each agent Ai uses a theory Ti, and the theories are progressively weaker in a specific way. The idea is that Ti is a theory that has a parameter (say, a natural number i) and the strength of the theory depends on i. Specifically, we can define:

      Ti = PA + Con(PA_i)

  where PA_i is a theory that is PA with the induction schema restricted to formulas of complexity below i (or something similar). Then we arrange so that:

      Ti ⊢ Con(T_{i+1})

  That is, each theory proves the consistency of the next theory in the sequence.

  Now, agent A0 uses T0, and it creates A1 which uses T1. Because T0 is stronger than T1 (in the sense that T0 can prove the consistency of T1), then T0 can safely believe that T1 is sound (if T1 is consistent). Why? Because if T0 proves that T1 is consistent, then by the Gödel completeness theorem, T0 can prove that T1 is sound (for arithmetical statements) in the standard model? Not exactly, but we can note:

      T0 ⊢ Con(T1) → ∀φ (Prov_{T1}(φ) → ¬Prov_{T1}(¬φ))

  But we want soundness: Prov_{T1}(φ) → φ. However, T0 cannot prove that for arbitrary φ because T0 doesn't know that T1 is Σ1-sound (or ω-consistent). But we can get a form of soundness for Π1 statements. Actually, the consistency of T1 only implies that T1 doesn't prove false Π1 statements? This is getting messy.

  Alternatively, we can use the idea of "reflection principles". We can have:

      Ti = PA + RFN(T_{i+1})

  where RFN(T) is the uniform reflection principle for T. The reflection principle for T is:

      ∀φ (Prov_T(⌜φ⌝) → φ)

  But then note: if we set Ti = PA + RFN(T_{i+1}), then we have:

      Ti ⊢ RFN(T_{i+1})

  But then, by Löb's theorem, if Ti were to also include RFN(Ti), we would get inconsistency. So we must ensure that Ti does not prove RFN(Ti). In this tower, each Ti proves the reflection principle for T_{i+1} (which is a weaker theory) but not for itself.

  How does this help? Agent A0 (using T0) wants to trust A1 (using T1). Because T0 includes RFN(T1), we have:

      T0 ⊢ ∀φ (Prov_{T1}(φ) → φ)

  So in particular, for the safety statement Safe(a), A0 can prove:

      Prov_{T1}(⌜Safe(a)⌝) → Safe(a)

  So A0 can trust A1's proof of safety.

  Similarly, A1 (using T1) has T1 = PA + RFN(T2). So A1 trusts A2, and so on.

  But note: the tower must be infinite. At each step, the agent is using a theory that is stronger (in terms of proof-theoretic strength) than the next? Actually, the theories are getting weaker? Let me check:

      T0 = PA + RFN(T1)
      T1 = PA + RFN(T2)
      ...

  But RFN(T1) is a stronger assumption than RFN(T2) because T1 is stronger than T2? Actually, no: in this setup, T1 is defined in terms of T2, so we have to be careful. Typically, we build the tower downwards:

      Let T_n be a base theory (say, PA).
      Then T_{n-1} = PA + RFN(T_n)
      Then T_{n-2} = PA + RFN(T_{n-1}) 

  But note: RFN(T_n) is a single sentence, but RFN(T_{n-1}) is a stronger principle because T_{n-1} is stronger than T_n? Actually, the reflection principle for a stronger theory is a stronger principle. So:

      T_{n-1} = PA + RFN(T_n)   [so T_{n-1} is stronger than PA]
      T_{n-2} = PA + RFN(T_{n-1}) [so T_{n-2} is stronger than T_{n-1}]

  So we are building a sequence of theories that are getting stronger as we go backwards (towards the root agent). This is the opposite of what we want for delegation. We want the root agent (A0) to be the most powerful, and the successors to be less powerful so that the root can trust them without running into Löb.

  So we can set:

      A0 uses T0 = PA + RFN(T1)
      A1 uses T1 = PA + RFN(T2)
      ...

  But note: T0 is stronger than T1, and T0 proves the soundness of T1. Then A1, which uses T1, is weaker than A0. But when A1 creates A2, it uses T1 to reason about T2. Since T1 proves RFN(T2), then A1 can trust A2.

  However, the problem is that the agent at level i must be able to reason about the next agent, but the next agent uses a weaker theory? That might be acceptable, but note that the successor agent must be able to do the same task (ensuring safety) but with a weaker theory. So it might fail to prove things that the parent could.

  Alternatively, we can build the tower in the other direction: let the base be a very weak theory and then add reflection:

      T0 = PA
      T1 = PA + RFN(T0)
      T2 = PA + RFN(T1)

  Then T1 is stronger than T0, and T2 is stronger than T1. Now, an agent using T2 can trust T1 (because T2 includes RFN(T1)) and an agent using T1 can trust T0. But then, if we have:

      A0 uses T0 (the base)
      A1 uses T1 = PA + RFN(T0)
      A2 uses T2 = PA + RFN(T1)

  Then A0 (using T0) cannot trust A1 because T0 does not prove RFN(T1). In fact, T0 is weaker than T1 so it cannot even express the consistency of T1? Actually, it can, but it cannot prove it.

  So we have a problem: we want the root agent to trust its immediate successor. The root agent (A0) is the one that must delegate to A1. But if A0 uses T0 and A1 uses T1 (which is stronger), then A0 cannot prove the soundness of T1.

  Therefore, the typical solution is to have the root agent use the strongest theory and then the successors use progressively weaker theories. But then the successors are less powerful and might not be able to do the job.

  Alternatively, we can have the agents use the same theory but with a parametric weakening. For example, let the theory be parameterized by an ordinal. Then:

      T_α = PA + ∀β<α, RFN(T_β)

  But then we run into the problem of how to define the ordinals and how the agent can know that the next agent has a lower ordinal.

  ### 5. Does this dissolve the obstacle?
  The parametric polymorphism (or the tower of reflection) relocates the problem. Now, each agent can trust the next one, but the chain must end. At the end, we have an agent that doesn't have a successor (or it uses a base theory without reflection). That base agent must do the job without being able to delegate further. So we have to ensure that the base agent can do the necessary safety proofs on its own.

  Moreover, the root agent must choose how many levels to build. If the root agent builds a finite tower, then the last agent in the chain must be very powerful (if we build upwards) or very weak (if we build downwards). In the downward building (where the root is the strongest), the last agent is the weakest and might not be able to prove the safety of the required actions.

  So the obstacle is not completely dissolved. It is managed by having a finite chain of trust, but the chain must be long enough to cover the necessary reasoning. However, for any fixed task, we can build a chain that is long enough. But the agent doesn't know in advance how long the chain needs to be.

  ### 6. Why move to probabilistic/reflective reasoning?
  The proof-based approach is very brittle. It requires that the agent can formally prove everything it needs to know. In real-world situations, an agent might not be able to prove that an action is safe, even if it is, because the proof is too long or the agent's proof system is too weak.

  Moreover, the tower of reflection is cumbersome. It requires the agent to pre-commit to a chain of successors, and the chain might be insufficient for the problem at hand.

  Probabilistic approaches (like logical induction) and reflective reasoning (where the agent reasons about its own beliefs and updates them) offer a way out. Instead of requiring absolute proof, the agent can assign high probability to the safety of an action. The agent can also notice patterns in its own reasoning and correct itself.

  For example, in reflective oracle agents or logical induction, the agent can have a probability distribution over logical statements and update it as it sees more proofs. This allows the agent to learn that its own future states will likely have proven the safety of an action, even if the current state hasn't yet.

  In the context of delegation, an agent might decide to trust its successor by assigning high probability to the successor being correct, without needing a formal proof. This avoids the Löbian obstacle because the agent is not trying to prove the soundness of the successor's proof system, but rather is making a probabilistic guess.

  However, probabilistic methods have their own challenges, like how to assign priors and how to avoid Dutch books.

  ### Summary
  The self-reference bites when the agent tries to prove that its own proof system (or a stronger one) is sound. This is impossible by Löb's theorem. The tower of proof systems (parametric polymorphism) avoids the immediate contradiction by having each agent trust a weaker proof system. However, the chain must end, and the last agent must handle the safety proofs without delegation. This works for bounded tasks but requires pre-setting the chain length. Probabilistic and reflective approaches avoid the need for absolute proofs and thus circumvent the Löbian obstacle, but they introduce new challenges in ensuring robustness.

