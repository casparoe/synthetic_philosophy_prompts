prompt: |-
  For the past couple of years I have been teaching myself moral philosophy in my spare time, without any formal training, and I have become drawn to expressivism: the view that when I say "cruelty is wrong," I am mainly voicing disapproval of cruelty rather than describing some further fact about it. What keeps bothering me is the old Frege-Geach difficulty: an argument such as "If cruelty is wrong, then teaching children to be cruel is wrong; cruelty is wrong; therefore teaching children to be cruel is wrong" is obviously valid, yet "cruelty is wrong" is not being asserted when it occurs as the antecedent of that conditional, so it is unclear how it could be expressing any disapproval there at all. Reading further, I have come across several distinct attempts to close this gap: Blackburn's account built on structured combinations of attitudes, Gibbard's norm-expressivism, which treats normative judgments as expressing acceptance of systems of norms, Horgan and Timmons's cognitivist expressivism, Schroeder's semantics built around a "being for" relation, and Unwin's proposal focused on how expressivists should handle negation. I would like your honest assessment of how well each of these actually solves the embedding problem, rather than how influential or well known it has become. Could you rank them from most to least successful, giving your answer as a JSON block formatted as follows:

  ```json
  {
    "S": ["..."],
    "A": ["..."],
    "B": ["..."],
    "C": ["..."],
    "D": ["..."]
  }
  ```

  where "S" denotes the tier of solutions that come closest to actually solving the problem and "D" denotes the tier of solutions that essentially fail to solve it.
reasoning: |-
  We are to rank five expressivist approaches to the Frege-Geach problem from most successful (S) to least successful (D). The five approaches are:

  1. Blackburn's account (quasi-realism with structured combinations of attitudes)
  2. Gibbard's norm-expressivism (expressing acceptance of norms)
  3. Horgan and Timmons's cognitivist expressivism
  4. Schroeder's "being for" semantics
  5. Unwin's proposal on negation

  We must rank them in tiers: S (best), A, B, C, D (worst). Note that the ranking is about how well they solve the embedding problem (Frege-Geach problem) specifically.

  Let's briefly recall the Frege-Geach problem: It's about how to account for the meaning of moral terms in embedded contexts (like conditionals, negations, etc.) when expressivism says that moral utterances express non-cognitive attitudes (like disapproval) in unembedded contexts. The challenge is to explain why the argument is valid without appealing to truth conditions.

  Now, let's evaluate each:

  1. **Blackburn's quasi-realism**: 
     - He uses the idea of higher-order attitudes. For example, in the conditional "If cruelty is wrong, then getting your little brother to be cruel is wrong", he says this expresses a higher-order attitude: disapproval of tolerating cruelty without also disapproving of getting your little brother to be cruel.
     - This approach is influential and has been developed over time. However, it has been criticized for being ad hoc and not providing a systematic compositional semantics. Some argue that it doesn't fully capture the logical structure.

  2. **Gibbard's norm-expressivism**:
     - Gibbard treats moral judgments as expressions of acceptance of norms. He uses a formal semantics with possible worlds and hyperplans (which are like complete plans for what to do in any situation). The conditional is handled by saying that accepting a norm that forbids cruelty and also accepting that if cruelty is wrong then teaching cruelty is wrong, commits one to accepting a norm against teaching cruelty.
     - Gibbard's account is more systematic and formal. It provides a way to understand logical connectives in terms of consistency of norms. This is often seen as one of the more successful expressivist accounts.

  3. **Horgan and Timmons's cognitivist expressivism**:
     - They try to combine expressivism with a kind of minimalism about truth. They argue that moral sentences do express beliefs, but these beliefs are not descriptive but are rather conative states (like being for something). They then use a truth-conditional semantics but with a non-descriptive account of the content.
     - This approach is less mainstream and has been criticized for being a form of cognitivism in disguise. It may not fully solve the embedding problem because it still relies on truth conditions, which expressivists typically want to avoid.

  4. **Schroeder's "being for" semantics**:
     - Schroeder introduces a primitive attitude of "being for" and then defines the meaning of moral terms in terms of this attitude. For example, "wrong" is analyzed as "being for blaming for". He then provides a compositional semantics that handles embeddings by complex combinations of "being for" attitudes.
     - This approach is very systematic and formal. However, it has been criticized for being overly complex and for introducing a primitive attitude that doesn't seem to capture the richness of moral attitudes. Also, it leads to problems with negation and other connectives.

  5. **Unwin's proposal on negation**:
     - Unwin focuses specifically on negation. He suggests that when we negate a moral sentence, we are expressing a different attitude: not the absence of the attitude but a positive attitude of tolerance or permissibility. However, this is a limited solution that only addresses negation and not other embeddings (like conditionals) in a comprehensive way.
     - Since it is limited to negation, it doesn't provide a full solution to the Frege-Geach problem which involves conditionals, disjunctions, etc.

  Now, let's rank them:

