  The competition problem is trickier. Paul's framework does lean heavily on pre-existing values. If choosing between Mars and becoming a vampire, the reveal's value depends on which transformation resonates with your core self. Not perfect, but psychologically plausible—people do make big leaps based on identity alignment rather than predicted happiness.

