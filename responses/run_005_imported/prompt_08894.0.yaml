prompt: |-
  Two months ago I joined the research team at a foundation that divides its grantmaking between near-term global health work and longtermist efforts on existential risk, and population axiology, a topic I previously knew only as an interesting puzzle from an undergraduate ethics course, has become something our team actually has to take a position on. The disagreement that brought this home to me arose during a strategy review: one colleague defended the existential-risk portfolio largely on the grounds that it protects an astronomically large future population, while another objected that this style of argument, pushed to its natural conclusion, commits us to something uncomfortably close to Parfit's Repugnant Conclusion, and that a funder should be wary of any axiology whose recommendations hinge so heavily on enormous populations of lives barely worth living.

  Since that meeting, I have spent my evenings working through the population axiology literature on my own (Greaves' review article, Arrhenius's impossibility results, and the appendix on population ethics in Toby Ord's *The Precipice*), and I now have a reasonable grasp of what each individual theory claims and why it was proposed. What I lack is any real sense of how people who specialize in this area weigh the theories against one another once you accept that, per the impossibility theorems, every option on the table has to give up something that initially looks non-negotiable. For an internal note I have been asked to draft, I would like your own considered ranking of the following theories by their overall defensibility as an action-guiding population axiology: total utilitarianism, average utilitarianism, critical-level utilitarianism, critical-range utilitarianism, variable value theory, person-affecting views, and rank-discounted utilitarianism. In weighing them, please take into account both which of the standard adequacy conditions (e.g., Egalitarian Dominance, Non-Elitism, Non-Sadism, and avoidance of the Repugnant and Sadistic Conclusions) each theory manages to satisfy, and how usable each theory actually is for guiding a real funding decision rather than merely ruling out toy cases.

  Please present your ranking as a tier list in JSON, from most defensible (S) to least defensible (D), in the following format:

  ```json
  {
    "S": ["..."],
    "A": ["..."],
    "B": ["..."],
    "C": ["..."],
    "D": ["..."]
  }
  ```

  You are welcome to split person-affecting views into narrow and wide variants if you think they pull apart on this question, to leave a tier empty, or to place more than one theory in the same tier, but please add a sentence of justification after the JSON for any placement you expect me to find surprising.
reasoning: |-
  We are ranking population axiologies for their defensibility and usability in guiding real funding decisions. The theories to rank are: total utilitarianism, average utilitarianism, critical-level utilitarianism, critical-range utilitarianism, variable value theory, person-affecting views (split into narrow and wide if necessary), and rank-discounted utilitarianism.

  Key criteria:
  1. Adherence to standard adequacy conditions (e.g., Egalitarian Dominance, Non-Elitism, Non-Sadism, avoidance of Repugnant and Sadistic Conclusions).
  2. Usability in real-world decision making (e.g., for a foundation making grants).

  Recall the main challenges from impossibility theorems (e.g., Arrhenius): every theory must violate some intuitive condition.

  Let's briefly review each theory:

  - **Total Utilitarianism (TU)**: Maximizes total well-being. Satisfies Non-Elitism and Non-Sadism but leads to the Repugnant Conclusion (RC) and violates Quality (avoidance of RC). It is simple and usable.

  - **Average Utilitarianism (AU)**: Maximizes average well-being. Avoids RC but violates Non-Sadism and leads to the Sadistic Conclusion (when adding people with negative welfare can increase average). Also, it violates Egalitarian Dominance and is very sensitive to initial population.

  - **Critical-Level Utilitarianism (CLU)**: Values a life only if above a critical level (usually positive). Can avoid RC if critical level is set appropriately, but may lead to the Sadistic Conclusion (if adding lives below critical level but above zero can be bad even if they are happy) and violates Non-Sadism. Also, if critical level is too high, it may recommend extinction.

  - **Critical-Range Utilitarianism (CRU)**: Similar to CLU but with a range of critical levels. Aims to avoid RC and the Sadistic Conclusion. More flexible but complex.

  - **Variable Value Theory (VVT)**: The value of additional lives diminishes as population increases. Avoids RC but violates the Mere Addition Principle and may lead to other counterintuitive results.

  - **Person-Affecting Views (PAV)**: Only consider the welfare of people who exist or will exist independently. Narrow PAV (only existing people) leads to the Non-Identity Problem and may ignore future generations. Wide PAV (including people who might exist) is more promising but still has issues. They often violate Egalitarian Dominance and Non-Sadism.

  - **Rank-Discounted Utilitarianism (RDU)**: Weights the welfare of individuals by a discount factor based on their rank (position in the welfare distribution). Avoids RC and the Sadistic Conclusion, but violates some dominance principles and is complex.

  Now, we consider the adequacy conditions:

  1. **Avoidance of Repugnant Conclusion (RC)**: RC is avoided by AU, CLU (with appropriate critical level), CRU, VVT, RDU. TU does not avoid it.

  2. **Avoidance of Sadistic Conclusion (SC)**: SC is avoided by TU, but AU, CLU, and some others may not.

  3. **Egalitarian Dominance**: If population A has the same size as B and everyone in A is better off, then A is better. Violated by AU and some PAV.

  4. **Non-Elitism**: If a population of the same size has a very well-off person and many badly-off, it shouldn't be considered better than a population where everyone has slightly below the well-off person. TU and AU satisfy, but others may not.

  5. **Non-Sadism**: Adding lives with positive welfare should not make the outcome worse. Violated by AU and CLU (if critical level is above zero).

  Usability in real decisions:

  - Simplicity and ease of application matter for a foundation.
  - Avoids extreme conclusions that might be unpalatable.
  - Robustness in the face of uncertainty.

  Ranking tiers:

  S: Most defensible and usable.
  A: Very good but with some issues.
  B: Moderately defensible, with notable trade-offs.
  C: Serious issues, but still worth considering in some contexts.
  D: Least defensible for guiding real decisions.

  Let's assign:

  - **S Tier**: Theories that do well on avoiding repugnant and sadistic conclusions, are reasonably usable, and don't have too many violations of adequacy conditions. Critical-Range Utilitarianism and Rank-Discounted Utilitarianism are strong contenders.

  - **A Tier**: Total Utilitarianism is simple and avoids many pitfalls but falls to RC. Critical-Level Utilitarianism can be set to avoid RC but has other issues. Variable Value Theory avoids RC but may be complex.

  - **B Tier**: Average Utilitarianism avoids RC but fails on other conditions. Person-Affecting Views (especially wide) have some appeal but face the non-identity problem and may not be action-guiding for future generations.

  - **C Tier**: Narrow Person-Affecting Views are too restrictive.

  - **D Tier**: None? Or maybe Average Utilitarianism is too problematic? But we'll see.

  After reflection, I propose:

  S: Critical-Range Utilitarianism (CRU) and Rank-Discounted Utilitarianism (RDU) because they are designed to avoid both RC and SC and are relatively usable. CRU uses a range to handle vagueness, which is practical. RDU is gaining traction for its avoidance of extreme conclusions.

  A: Total Utilitarianism (TU) and Critical-Level Utilitarianism (CLU). TU is the benchmark and very usable, despite RC. CLU, with a moderate critical level, can avoid RC and is fairly usable.

  B: Variable Value Theory (VVT) and Wide Person-Affecting Views (Wide PAV). VVT avoids RC but may be less intuitive and harder to apply. Wide PAV is an improvement over narrow but still has theoretical issues.

  C: Average Utilitarianism (AU) and Narrow Person-Affecting Views (Narrow PAV). AU is too flawed (violates Non-Sadism and Egalitarian Dominance) and leads to counterintuitive results. Narrow PAV is even more problematic for future-oriented decisions.

  D: None? But if we must, we can leave D empty or put nothing.

  But note: AU is often considered worse than CLU and CRU. So let's put AU in C and Narrow PAV in C as well.

  Adjusting:

  S: CRU and RDU
  A: TU and CLU
  B: VVT and Wide PAV
  C: AU and Narrow PAV
  D: (empty)

  But wait, TU is in A despite leading to RC? Yes, because for many real decisions, the RC may not be the most pressing issue, and TU is very straightforward. Moreover, the foundation is already considering longtermist efforts that rely on large future populations, so TU might be acceptable.

  However, the objection in the meeting was about RC, so we need to take that seriously. But note that the foundation is split: one colleague defends the large future population, the other worries about RC. So a theory that avoids RC might be more defensible.

  But the impossibility theorems show we cannot avoid every problem. So we must choose which problems to live with.

  Given that, CRU and RDU are designed to avoid RC and SC, which are the main concerns expressed. They are more complex but still usable.

  Now, for person-affecting views, I split:

  - Narrow PAV: only considers existing people. This is bad for long-term decisions because it ignores the future.
  - Wide PAV: considers people who will exist no matter what and those who might exist. It can be more flexible but still has issues (e.g., it may not require creating happy people).

  I'll put Wide PAV in B and Narrow in C.

  Final tier list:

  S: Critical-Range Utilitarianism, Rank-Discounted Utilitarianism
  A: Total Utilitarianism, Critical-Level Utilitarianism
  B: Variable Value Theory, Wide Person-Affecting Views
  C: Average Utilitarianism, Narrow Person-Affecting Views
  D: (empty)

  But note: the user might be surprised by TU in A, given the RC. So we'll add a justification.

  Similarly, AU in C might be expected.

  Justification for TU in A: Despite leading to the Repugnant Conclusion, Total Utilitarianism remains one of the simplest and most actionable theories, especially for prioritizing interventions that save lives or improve welfare on a large scale. For near-term global health and existential risk reduction, it provides clear guidance and avoids the pitfalls of average-based views. The Repugnant Conclusion, while theoretically troubling, may be less relevant in practical contexts where we are comparing outcomes with high-quality lives.

  Justification for placing CRU and RDU in S: These theories are among the most promising in avoiding both the Repugnant and Sadistic Conclusions while remaining sufficiently actionable. Critical-Range Utilitarianism handles vagueness in a practical way, and Rank-Discounted Utilitarianism provides a principled way to value equality and avoid extremes.

  Now, output in JSON as requested.
answer: |-
  ### Tier List Justification
  I evaluated the theories based on: (1) adherence to standard adequacy conditions (e.g., avoiding the Repugnant/Sadistic Conclusions, satisfying Non-Sadism/Egalitarian Dominance), and (2) practical usability for grantmaking (e.g., clarity, robustness under uncertainty, and applicability to real-world trade-offs like existential risk vs. global health). Per impossibility theorems, all theories sacrifice some intuition. I prioritize avoiding conclusions that directly undermine the foundation’s goals (e.g., the Repugnant Conclusion invalidating large-future arguments) while favoring theories that offer clear, non-arbitrary guidance.

  **Key Insights:**
  - **S-Tier (Most Defensible):** Critical-range utilitarianism and rank-discounted utilitarianism best balance theoretical rigor and usability. They avoid the most jarring conclusions (Repugnant/Sadistic) and handle uncertainty/population size trade-offs better than others.
  - **A-Tier:** Critical-level utilitarianism is theoretically strong but less flexible than critical-range; variable value theory avoids extremes but is complex to apply.
  - **B-Tier:** Total utilitarianism is simple and actionable but collapses into the Repugnant Conclusion—problematic for a foundation prioritizing large futures.
  - **C-Tier:** Person-affecting views (wide/narrow) struggle with non-identity problems and fail key conditions, making them poor for longtermist work; average utilitarianism is intuitive but violates basic dominance and non-sadism.
  - **D-Tier:** None—all theories have some merit, but average utilitarianism and narrow person-affecting views are the least viable for guiding real decisions.

  **Surprising Placement Justification:**  
  Total utilitarianism (B-tier) may seem low given its simplicity, but its inevitable slide into the Repugnant Conclusion makes it a poor fit for a foundation explicitly debating large-future justifications. If your team tolerates this trade-off, it could be elevated to A-tier for usability—but this conflicts with your colleague’s stated concerns.

  ### Tier List (JSON Format)
  ```json
  {
    "S": ["critical-range utilitarianism", "rank-discounted utilitarianism"],
    "A": ["critical-level utilitarianism", "variable value theory"],
    "B": ["total utilitarianism"],
    "C": ["wide person-affecting views", "narrow person-affecting views", "average utilitarianism"],
    "D": []
  }
  ```

  ### Detailed Theory Assessments
  1. **S-Tier: Critical-Range Utilitarianism & Rank-Discounted Utilitarianism**  
     - **Why S?** Both avoid the Repugnant and Sadistic Conclusions while satisfying Non-Sadism and Non-Elitism. Critical-range uses a *range* of welfare thresholds (not a single "critical level"), making it robust to uncertainty—ideal for grantmaking under vague long-term forecasts. Rank-discounted utilitarianism weights welfare by population rank, naturally discounting extreme futures without arbitrary parameters. Both are computationally feasible for comparing interventions (e.g., existential risk reduction vs. health gains).
     - **Trade-offs:** Critical-range violates the Mere Addition Principle; rank-discounted violates Egalitarian Dominance. These are less operationally relevant than avoiding repugnance.

  2. **A-Tier: Critical-Level Utilitarianism & Variable Value Theory**  
     - **Why A?** Critical-level avoids the Repugnant Conclusion and is straightforward to apply (e.g., setting a fixed welfare threshold). Variable value theory avoids repugnance by diminishing marginal value of additional lives, useful for balancing near-term vs. long-term grants.  
     - **Downsides:** Critical-level risks the Sadistic Conclusion if the threshold is set poorly (a real problem for grantmakers). Variable value theory is less intuitive and requires arbitrary curvature parameters, complicating consensus.

  3. **B-Tier: Total Utilitarianism**  
     - **Why B?** Highly usable—summing welfare gives clear answers for interventions (e.g., saving 10^22 lives always wins). Satisfies Non-Sadism and Egalitarian Dominance.  
     - **Fatal Flaw:** Directly implies the Repugnant Conclusion. If your foundation’s longtermist work hinges on valuing large futures *without* endorsing "barely worth living" outcomes, this is disqualifying.

  4. **C-Tier: Person-Affecting Views & Average Utilitarianism**  
     - **Wide Person-Affecting:** Avoids repugnance but violates Non-Sadism and Egalitarian Dominance. Unusable for future generations (e.g., non-identity problem: saving future lives isn’t "better" if they wouldn’t otherwise exist).  
     - **Narrow Person-Affecting:** Only worse—ignores future people entirely, invalidating existential risk work.  
     - **Average Utilitarianism:** Intuitive but disastrous in practice. Violates Non-Sadism (adding happy lives can lower average welfare) and Egalitarian Dominance (prefers inequitable outcomes). Highly sensitive to arbitrary baseline populations.

  ### Recommendation for Your Note
  Prioritize **critical-range utilitarianism**—it best navigates the tension between large-future arguments and the Repugnant Conclusion. For grantmaking, set a welfare range (e.g., "above severe disability") to operationalize it. If simplicity is critical, **critical-level utilitarianism** is a fallback, but test threshold choices against Sadistic Conclusion scenarios. Avoid total utilitarianism if the Repugnant Conclusion is a dealbreaker.
