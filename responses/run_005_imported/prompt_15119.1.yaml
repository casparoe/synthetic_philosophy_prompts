answer: |-
  You've hit on a profound and genuine tension within Locke's own framework, and Leibniz's critique directly addresses it. Let's break this down:

  ### 1. Locke's Position & the Apparent Contradiction
  *   **The Globe Example (Judgment in Sight):** Locke correctly observes that our *visual* perception of a 3D globe involves learned inference. We don't "see" depth directly on the retina (it's a 2D projection). We unconsciously *interpret* cues like shading, perspective, and motion parallax based on a lifetime of associating those visual patterns with tactile experiences of solidity and roundness. "Judgment" is constantly at work.
  *   **The Molyneux Answer (No Cross-Modal Transfer):** Locke agrees with Molyneux that the newly sighted man, relying *only* on sight *before* touching, could not distinguish the cube from the sphere. His reasoning:
      *   The man has rich *tactile* concepts of "cube" (sharp angles, flat faces, stable base) and "sphere" (smooth, uniform curvature, rolls).
      *   The man has nascent *visual* sensations (patches of color, light/dark, boundaries).
      *   **The Crux:** Locke argues there is *no inherent, necessary connection* between the *tactile idea* of a cube/sphere and the *visual sensation* caused by that same object. The connection is learned *only* through repeated *simultaneous experience* of touching an object *while* seeing it. Before that associative learning occurs, the visual data is meaningless in terms of identifying the tactile properties.

  *   **The Tension You've Spotted:**
      If ordinary sight relies on learned judgment (interpreting 2D cues as 3D based on touch associations), why couldn't the newly sighted man apply his *existing tactile knowledge* to *interpret* the novel visual data? He knows cubes *feel* angular and spheres *feel* smooth. Couldn't he *reason*: "That visual shape has sharp angles and straight lines; sharp angles and straight lines are what I *feel* on a cube. Therefore, that *must* be the cube"? Locke seems to deny this possibility entirely ("not... with certainty").

  ### 2. Leibniz's Objection & Resolution
  Leibniz tackles this exact point in his **New Essays on Human Understanding** (written as a dialogue critiquing Locke). He agrees with Locke that the man would *not immediately recognize* the cube and sphere visually in the same way he knows them tactilely. There would be no *sensory fusion* or automatic identification.

  *   **Leibniz's Key Move: Explicit Reasoning:** However, Leibniz argues Locke underestimates the power of *explicit reasoning* based on *innate principles* (like the Principle of Sufficient Reason). The man *could* potentially deduce which is which:
      1.  **Understanding the Setup:** He knows there are two objects, a cube and a sphere, placed before him.
      2.  **Analyzing Visual Features:** He sees one shape with points, straight lines, and equal angles (the cube's projection), and another with no points, a uniformly curved boundary, and no straight lines (the sphere's projection).
      3.  **Applying Tactile Knowledge:** He knows from touch that a cube *has* points, straight edges, and equal angles. He knows a sphere has *no* points, *no* straight edges, and *no* angles – only uniform curvature.
      4.  **Drawing the Inference:** Using reason, he could conclude: "The shape with points and straight lines *must* be the cube, because *only* the cube has those properties. The shape without points or straight lines, only curvature, *must* be the sphere, because *only* the sphere has those properties."
      5.  **The Mechanism:** This isn't automatic sensory fusion; it's a conscious, intellectual act of *mapping* the abstract geometric properties (points, lines, curvature) he understands through touch onto the novel visual patterns exhibiting those same abstract properties.

  *   **Why Leibniz Thinks This Works:**
      *   **Innate Principles:** Leibniz believed humans possess innate capacities for reasoning (like the Principle of Sufficient Reason: there must be a reason why this visual pattern corresponds to *this* tactile object and not the other).
      *   **Abstract Properties:** He argued we can grasp the *geometric essence* (points, lines, curves, angles) through one sense (touch) and recognize its *manifestation* through another (sight) using reason. The connection isn't in the raw sensations but in the intelligible structure.
      *   **Distinguishing Reasoning from Recognition:** The man wouldn't *see* "cube-ness" the way a sighted person does. He would *reason* his way to the correct identification based on the visible geometric features matching his tactile understanding of those features.

  ### 3. Resolving the Tension for Your Novel
  The tension you see is real. Locke emphasizes learned judgment in *normal* vision but denies its potential application by the newly sighted man using his *existing* tactile knowledge as the basis for *interpretation*.

  *   **Locke's Implicit Stance:** For Locke, the judgment in normal vision is *so* deeply ingrained, automatic, and built upon *simultaneous* visual-tactile associations from infancy, that it's fundamentally different from *explicit reasoning* based on *separately acquired* sensory modalities. He likely sees the Molyneux man as lacking *any* foundation for linking the novel visual data *to anything* except itself. The tactile concepts are isolated islands.
  *   **Leibniz's Alternative:** Leibniz provides the bridge Locke denies: explicit, rational mapping based on shared abstract properties (geometry) understood through one sense and identified visually in another.

  ### Implications for Your Scene
  To make the scene "intellectually earned":

  1.  **Reject Pure Locke:** Don't have her instantly "see" objects as a sighted person would. The visual world should be initially overwhelming, fragmented, and devoid of inherent meaning related to touch.
  2.  **Embrace Leibnizian Reasoning:** This is your key.
      *   **Focus on Features:** Have her consciously analyze the *visual features*: "This patch has sharp changes in light/dark, meeting at points... lines that seem straight... angles."
      *   **Recall Tactile Knowledge:** Have her recall the *defining tactile features* of known objects: "My cube... sharp points where faces meet... perfectly straight edges... 90-degree angles."
      *   **The Deductive Leap:** Show her *making the connection through effortful thought*: "If *that* (touching the cube) feels like points and straight lines... and *this* (looking at the cube-shaped patch) *looks* like it has points and straight lines... while *that other* (looking at the sphere) looks smooth and curved... then *this* must be the cube, and *that* must be the sphere." It should feel like solving a puzzle, not an epiphany.
      *   **Uncertainty:** She might not be *certain* initially. She might need to verify by touch afterward ("Yes! The one with the visual points *is* the one with the tactile points!"). This reinforces the learned association.
  3.  **Beyond Shapes:** This reasoning can extend. A doorknob: "This visual circle... my hand remembers a round, smooth, turning thing... they *must* be connected." A cat: "This moving patch of soft fur-texture in vision... matches the feeling under my fingers... this *is* the cat." It starts with distinct features and builds associations through conscious deduction.

  **In essence:** Locke provides the problem (no automatic fusion), Leibniz provides the solution path (conscious reasoning based on shared abstract properties). By having your character engage in Leibnizian deduction, you honor the philosophical complexity while creating a powerful, intellectually satisfying moment of discovery that feels earned through her cognitive effort, not just sensory magic.
