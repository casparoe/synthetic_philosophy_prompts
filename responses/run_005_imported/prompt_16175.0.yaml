answer: |-
  Here’s a toast that threads the needle: precise enough for philosophers, warm enough for all, and structured around your sister’s work without becoming a lecture. Timing is approximately 2.5 minutes when delivered naturally.

  ---

  **(Raise glass, smile at the couple)**  

  "Hi everyone. For those who don’t know me, I’m [Your Name], the bride’s significantly younger—and philosophically less credentialed—brother. Now, as [Sister’s Name]’s sibling, I’ve absorbed a lot of her PhD thesis by osmosis. Mostly from reading drafts left on the microwave. And for the past few years, she’s been wrestling with a fiendish little problem: **how do we know when a reason to value something is the *right kind* of reason?**  

  *(Pause, glance at philosophers with a knowing look)*  
  "Yes, *that* problem. See, philosophers like my brilliant sister argue that calling something ‘good’ just means it has properties that give us genuine reason to admire it, desire it, or… *(turn to Marcus)* marry it.  

  *(Lightly, for the room)*  
  "But here’s the catch: sometimes you might have a reason to value something for… *questionable* motives. Like, say, if a **philosophical demon threatened to haunt your footnotes unless you genuinely adored a saucer of mud**.  
  *(Pause for laughter—philosophers will recognize the reference; others laugh at the absurdity)*  

  "Now, I promise Marcus is *not* a saucer of mud.  
  *(Smile at Marcus, laughter)*  
  "...But it did make me wonder: did [Sister’s Name] marry Marcus for the *right kind* of reasons? Or was there some dark, metaethical coercion? A threat like, *‘Love him or I’ll revoke your library access!’*?  

  *(Shift tone slightly, more sincere)*  
  "Then I thought about the past six years. The reasons [Sister’s Name] has to love Marcus aren’t because of outside pressure, deadlines, or demons. They’re because of *him*—the properties that make Marcus, Marcus. Like how he notices when she’s humming while writing, and knows it means she’s stuck on a paragraph. How he brings her tea *exactly* when her focus breaks, no lecture needed. How he can make her laugh after a brutal peer review.  

  *(To philosophers, clearly)*  
  "**Those aren’t ‘wrong kind’ reasons—reasons that just *happen* to attach to the attitude.**  
  *(To the whole room)*  
  "They’re reasons that come from who Marcus *is*. His patience, his kindness, the way he sees her. They’re reasons that don’t just make her *want* to love him… they make loving him **fitting**. Deserved. True.  

  *(To the couple)*  
  "[Sister’s Name], your dissertation dissects how we find ‘right-kind reasons’ in theory. But today, you and Marcus are living it. You didn’t choose each other because of threats or mud-saucers. You chose each other because, in each other, you found someone whose very being **gives everyone in this room—and even your baby brother—reason to admire what you have.**  

  **So let’s raise a glass:** To Marcus and [Sister’s Name]. May your reasons always be the right kind. May your love always be… *fitting*."  

  **(Clink!)**  

  ---

  ### Why This Works
  1. **Accuracy Check** (for your sister's sake):  
     - Correctly frames the WKR problem as reasons "happening to attach to the attitude" vs. reasons grounded in the object’s properties.  
     - Uses Scanlon’s "desire/admire/pursue" structure accurately.  
     - "Fitting" is the key term in FA theories—philosophers will nod.  
     - The demon/saucer of mud is *the* classic example (from Rabinowicz & Stratton-Lake’s "The Wax and the Wane of Value" with a nod to Parfit).  

  2. **Accessibility**:  
     - The saucer of mud joke is absurd enough to land universally.  
     - Marcus’s concrete qualities (tea, laughter, noticing quirks) show "right-kind reasons" without jargon.  
     - "Dark metaethical coercion" is playful enough for non-philosophers.  

  3. **Philosopher Laugh Line**:  
     - *"Philosophical demon threatened to haunt your footnotes"*:  
       - Academics will cackle at "footnotes" as a threat.  
       - Others laugh at "philosophical demon."  

  4. **Tone**:  
     - Starts humorous, pivots to warmth.  
     - "Fitting" in the final line subtly echoes FA terminology while feeling poetic.  
     - Ends with a classic toast structure.  

  Your sister gets a technically sound tribute; Marcus gets sincerity; the room gets clarity. And you? You get to watch philosophers beam while Marcus’s grandma toasts to "fitting love." Win-win.
