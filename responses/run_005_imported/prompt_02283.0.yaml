prompt: |-
  After a career in behavioral ecology, much of it spent on the game-theoretic analysis of animal signalling, I have taken up analytic philosophy in retirement, and I am currently working through David Lewis's *Convention*. Lewis presents Hume as an important precursor, so I went back to the source, Book III, Part II, Section II of the *Treatise* ("Of the Origin of Justice and Property"), where I found this passage:

  "This convention is not of the nature of a promise: For even promises themselves, as we shall see afterwards, arise from human conventions. It is only a general sense of common interest; which sense all the members of the society express to one another, and which induces them to regulate their conduct by certain rules. I observe, that it will be for my interest to leave another in the possession of his goods, provided he will act in the same manner with regard to me. He is sensible of a like interest in the regulation of his conduct. When this common sense of interest is mutually expressed, and is known to both, it produces a suitable resolution and behaviour. And this may properly enough be called a convention or agreement betwixt us, though without the interposition of a promise; since the actions of each of us have a reference to those of the other, and are performed upon the supposition, that something is to be performed on the other part. Two men, who pull the oars of a boat, do it by an agreement or convention, though they have never given promises to each other. Nor is the rule concerning the stability of possession the less derived from human conventions, that it arises gradually, and acquires force by a slow progression, and by our repeated experience of the inconveniences of transgressing it. On the contrary, this experience assures us still more, that the sense of interest has become common to all our fellows, and gives us a confidence of the future regularity of their conduct: And it is only on the expectation of this, that our moderation and abstinence are founded. In like manner are languages gradually established by human conventions without any promise. In like manner do gold and silver become the common measures of exchange, and are esteemed sufficient payment for what is of a hundred times their value."

  Lewis's later technical definition treats a convention as the stable solution to a recurring coordination problem: a situation with several self-perpetuating equilibria among which the parties are, in the relevant sense, indifferent, so that each conforms only on condition the others do, with no incentive to deviate once coordination is reached (his standard illustrations are which side of the road to drive on, and where to meet a friend if separated). What I cannot settle for myself is whether Hume's own examples here really share that structure throughout. Language and a common medium of exchange look like reasonable fits: more or less any convention would serve equally well, and nobody gains by unilaterally departing from whichever one is in place. But the convention of respecting others' possessions seems different in kind, since even once it is firmly established, each party still stands to gain locally by seizing what is not theirs, which sounds less like indifference among equally good equilibria and more like a Prisoner's Dilemma or an assurance problem. Does the passage give any sign that Hume noticed this disanalogy among his own examples, or does he write as if they were all of a piece? And if the latter, does that suggest Lewis's celebrated gloss on Hume is less a formalization of Hume's notion of convention than a quiet narrowing of it?
reasoning: |-
  Okay, let's start by unpacking the user's query. They're a retired behavioral ecologist who worked on game theory in animal signaling, now diving into analytic philosophy, specifically Hume and Lewis. The core question is whether Hume's examples of convention—like property rights—fit Lewis's coordination game model or if they're more like a Prisoner's Dilemma. 

  First, I need to recall Hume's passage. He uses rowing a boat, language, money, and property as examples of conventions without promises. The user points out that property seems different because cheating (stealing) offers individual benefits even after the convention is established. That’s a classic PD structure. 

  Hume’s rowing example is pure coordination: both rowers need to synchronize, but neither gains by rowing alone. Language and money are similar—arbitrary but stable once set. Property, though, has temptation to defect. So why does Hume group them together? 

  Ah, right—Hume emphasizes the gradual, experience-based aspect. He says repeated interactions teach people that mutual restraint is better long-term. That’s where the "common sense of interest" comes from. It’s not just coordination; it’s about overcoming short-term incentives. 

  Lewis’s model requires indifference among equilibria, like choosing which side of the road to drive on. Property isn’t like that because unilateral defection is profitable. So Lewis narrows convention to pure coordination, excluding PD-like structures. 

  But Hume’s broader view includes any mutually beneficial practice emerging from repeated interaction and shared expectations. He’d likely see property as a convention shaped by experience, even if it requires overcoming individual temptations. 

  The user might also be hinting at a deeper question: Is Lewis oversimplifying Hume? Yes, by excluding enforcement mechanisms (like reputation or punishment) that stabilize property conventions. Hume acknowledges these indirectly via "repeated experience of inconveniences." 

  So, to answer: Hume didn’t notice the disanalogy because his focus was on emergent order, not game-theoretic categories. Lewis’s definition is a refinement that excludes PD scenarios, making it narrower than Hume’s original concept. 

  The user’s expertise in game theory means they’ll appreciate this distinction. They might also enjoy connecting this to evolutionary stability—e.g., how repeated PD can sustain cooperation via tit-for-tat, which Hume’s "gradual progression" hints at.
answer: |-
  Your analysis is sharp and touches on a crucial tension between Hume's broad conception of convention and Lewis's narrower game-theoretic formalization. Let's break this down:

  1.  **Hume's Examples & Their Game Structures:**
      *   **Rowing a Boat:** A pure coordination game. Both rowers have a common interest in coordinating their strokes (any synchronized rhythm is better than none), but they are indifferent *which* rhythm they adopt. There's no incentive to unilaterally deviate from the established rhythm. Fits Lewis's definition perfectly.
      *   **Language:** A coordination game with possible elements of signaling/cheap talk. The specific sound (e.g., "dog") used to denote a concept is arbitrary; any other sound would serve equally well *as long as everyone uses the same one*. No individual gains by suddenly using a private meaning. Fits Lewis well.
      *   **Medium of Exchange (Money):** A coordination game. Gold/silver became money because others accepted it; any other durable, divisible, scarce good *could* have served. Once established, no individual gains by refusing it (they'd be excluded from trade) or unilaterally declaring a new standard. Fits Lewis.
      *   **Respecting Possessions / Property:** This is fundamentally different. As you note, even *after* a stable convention exists, each individual has a constant, local incentive to defect – seizing someone else's goods provides an immediate, unilateral gain *if* they can get away with it. This is the hallmark of a **Prisoner's Dilemma (PD) structure**, not a pure coordination game. The stability relies on *overcoming* this temptation, typically through repeated interactions, reputation, punishment, or moral sentiment – mechanisms absent in Lewis's pure coordination equilibria. It's more akin to an **Assurance Game** or an **Evolutionarily Stable Strategy** in a repeated PD.

  2.  **Does Hume Notice the Disanalogy?**
      *   **No, he does not explicitly acknowledge it.** Hume presents all these examples seamlessly, using the same language ("common sense of interest," "regulated conduct," "gradual establishment," "repeated experience of inconveniences") for rowing, language, money, *and* property. He writes as if they are "all of a piece."
      *   **Why might he do this?**
          *   **Focus on Emergence & Stability without Promises:** His primary goal is to show how complex, rule-governed social order (justice, property, language, money) can arise spontaneously from individual self-interest and repeated interaction, *without* needing foundational promises, contracts, or a sovereign. He emphasizes the *process* of gradual establishment and the *feedback loop* of experience ("repeated experience of the inconveniences").
          *   **Broad Notion of "Convention":** Hume's concept is intentionally broad and sociological. For him, a "convention" is any mutually beneficial, self-sustaining pattern of behavior arising from the reciprocal recognition of shared interest and expectations. He cares less about the precise strategic structure (PD vs. Coordination) and more about the *functional outcome* – stable, cooperative regularity.
          *   **Role of "Repeated Experience" & "Inconveniences":** Hume *does* implicitly address the PD temptation within the property convention through his emphasis on "repeated experience of the inconveniences of transgressing it." This experience teaches individuals that *in the long run*, the *system* of mutual restraint yields greater benefits than occasional successful theft, especially when considering retaliation, loss of reputation, and the breakdown of order. This transforms the one-shot PD into a repeated game where cooperation *can* be an equilibrium. However, he doesn't differentiate this mechanism from the simpler coordination mechanisms at work in rowing or language.

  3.  **Is Lewis Narrowing Hume's Concept?**
      *   **Yes, significantly.** Lewis's definition is a deliberate, technical narrowing:
          *   **Coordination Problems Only:** Lewis explicitly restricts conventions to solutions of *coordination problems*, defined by multiple strict Nash equilibria where players are indifferent among them. This excludes PD structures where unilateral defection is dominant in the one-shot game.
          *   **Indifference Requirement:** The requirement for indifference among equilibria is central to Lewis but absent (and often irrelevant) in Hume's broader examples like property. We are *not* indifferent between a world with property and one without; we strongly prefer the former, even though within that system, we face local temptations.
          *   **Focus on Arbitrariness:** Lewis emphasizes the arbitrariness of the convention (any coordination equilibrium would do). While true for rowing, language, and money, the *institution* of property itself is not arbitrary in the same way; it solves a fundamental problem of conflict over scarce resources. The *specific rules* (first possession, labor mixing) might be arbitrary, but the *need for some rule* is not.
      *   **Lewis's Gloss: Formalization or Narrowing?** It's both, but the narrowing is crucial.
          *   **Formalization:** Lewis brilliantly formalizes the core Humean insight for a specific, important class of social phenomena: how arbitrary but stable regularities emerge from reciprocal expectations in pure coordination scenarios.
          *   **Narrowing:** By restricting conventions to coordination equilibria, Lewis excludes phenomena central to Hume's discussion, particularly justice/property, which require mechanisms to overcome PD temptations (repetition, punishment, norms). Lewis acknowledges this limitation, often noting that many social norms involve mixed-motive games beyond pure coordination.

  **Conclusion:**

  You've pinpointed a genuine disanalogy. Hume treats property, language, money, and rowing as fundamentally similar conventions arising from a common sense of interest expressed mutually and reinforced by experience. He does not explicitly recognize or address the critical difference in strategic structure: property involves overcoming persistent individual temptations to defect (PD elements), while the others involve pure coordination with indifference among equilibria.

  Lewis's celebrated analysis is indeed a **quiet (and deliberate) narrowing** of Hume's broader, more sociological concept. Lewis provides a powerful formalization for pure coordination conventions, capturing Hume's core insights for examples like rowing, language, and money. However, this formalization does not fully encompass Hume's paradigmatic example of justice and property, which fits awkwardly into Lewis's strict definition due to its inherent PD structure requiring additional stabilizing mechanisms (like the "repeated experience of inconveniences" Hume mentions). Lewis's gloss is thus a brilliant formalization *of one important strand* within Hume, but not a complete capture of Hume's richer, more expansive notion of convention, which includes institutions born from the need to solve conflict and temptation, not just pure coordination. Your intuition that property feels different game-theoretically is absolutely correct, and Hume's failure to explicitly mark this distinction supports the view that Lewis's concept is a refinement and restriction, not merely a formalization, of the Humean original.
