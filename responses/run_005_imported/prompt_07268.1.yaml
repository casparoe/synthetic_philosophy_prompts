  The conscious "I" that did the work (Theo's credit) 
  VS 
  The subconscious drives that made that "I" want to change (the user's point about unchosen origins) 

  I recall Frankfurt's hierarchy of desires could help here - Theo developed second-order volition (wanting to want discipline) through therapy. That meta-cognition is where agency emerges, even if the raw material was given. 

  Also worth noting: the user might be wrestling with their own beliefs about responsibility. If Theo's pride bugs them, perhaps they're subconsciously defending against the pressure of total self-determination. The clean answer they seek may not exist - it's more about reframing credit as shared between effort and circumstance. 

  The therapy angle is crucial too. Theo didn't do it alone; the therapeutic process helped construct his agency. That doesn't negate his work, but contextualizes it. Maybe the real insight is that becoming "the kind of person who wants to change" is the achievement. 

