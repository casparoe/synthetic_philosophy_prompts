  - **Psychological vs. Others**: Mental associations could misfire—e.g., superstitions (lightning→gods) aren't causal. Or consider a scientist who knows statistical correlations without believing causation (smoking→cancer link pre-mechanism). Here regularity holds, but psychological "custom" hasn't formed.  

