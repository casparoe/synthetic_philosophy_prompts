  Practical advice: Instead of formulas, suggest they argue via examples like "Hamilton" (wildly ahistorical yet "true" to revolutionary spirit) or "Titanic" (fictional romance amplifying real disaster). Their friend's book sounds like "court transcripts"; theirs like "a eulogy." Neither is inherently superior—they serve different truths. 

