prompt: |-
  ok so I went down a wikipedia rabbit hole last night and got totally nerd-sniped by this 11th century Islamic theologian Al-Ghazali and his "occasionalism" thing. His go-to example is fire and cotton: the philosophers of his day said fire necessarily causes cotton to burn, but Ghazali's move is that the fire actually has zero causal power -- God directly creates the burning every single time, and the fact that fire and burning always go together is just "custom" (his word), not a real necessary connection. Which is also apparently how he explains away miracles, like a prophet standing in a fire and not burning.

  This is kind of messing with my head because at my job we do "root cause analysis" postmortems (five-whys style) every time something breaks in prod, and the whole point of that excercise is assuming there's a real causal chain you can trace back to an actual root cause. Can you give me the most important implications of Al-Ghazali's occasionalism for how I should think about causal reasoning when debugging distributed systems and writing incident postmortems?
