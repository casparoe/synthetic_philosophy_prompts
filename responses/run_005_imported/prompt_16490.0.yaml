  First, I need to understand their main argument. They're suggesting that Lloyd's rejection of adaptive hypotheses for the female orgasm and acceptance of the byproduct theory might be a methodological win by setting the null hypothesis as non-adaptive. But Williams' principle says adaptation should be the last resort, which seems to justify Lloyd's asymmetry. The user is conflicted: is their critique valid, or are they missing the asymmetry's validity?

  I should recall key concepts. Gould and Lewontin criticized "just-so stories" in adaptationism, promoting non-adaptive explanations like spandrels. Williams emphasized parsimony, requiring strong evidence for adaptation. Lloyd applied this rigorously to the female orgasm, dismantling adaptive theories and favoring the byproduct hypothesis. The user questions if Lloyd's default to byproduct is fair or if it's a strategic null hypothesis setup.

