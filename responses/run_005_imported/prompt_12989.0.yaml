prompt: |-
  I'm a senior engineer and one of a dozen active maintainers on a mid-sized open-source data-processing library that has, somewhat to our surprise, ended up embedded in production systems at companies far larger than the volunteer group that maintains it. Because a couple of those companies now treat the project as critical infrastructure, we decided last year to move away from an informal, whoever-shows-up-on-Slack style of decision-making and set up a proper nonprofit foundation, complete with a written charter, a steering committee, and real elections. I ended up on the working group drafting the bylaws mainly because I was the only maintainer willing to read the draft bylaws line by line, and we've since hit a snag on what looked like a minor procedural question but has become the most contentious issue we face: who actually gets to vote when the charter itself is put up for ratification.

  Three groups each have a reasonable claim, and every rule we've proposed ends up treating one of them as illegitimate. About forty people have merged at least one substantial commit in the last five years — call them the sweat-equity contributors. Six corporate sponsors currently supply roughly 80% of the foundation's budget and would like voting weight proportional to that funding. And according to our download telemetry, something like fifteen thousand companies run the library in production without ever having filed a patch or so much as an issue — they contribute neither code nor money, but a bad governance decision could break their systems overnight, which arguably gives them the largest stake of anyone. Whichever group gets to vote on the founding charter will, in effect, decide the charter's contents, which means the working group writing the eligibility rules is quietly pre-deciding the outcome before any actual vote takes place, and I can't find a neutral vantage point from which to settle that fairly. One of our advisory board members, who studied political theory before moving into venture capital, waved the whole thing off with "oh, that's just the boundary problem — nobody's ever really solved it," which I found reassuring and completely unhelpful in equal measure.

  The working group meets in three weeks to finalize the bylaws before they go to a project-wide vote, and I've been asked to write the memo the group will actually deliberate from. Could you draft it for me? I need a concrete recommendation for who should count as an eligible voter on the charter-ratification vote specifically, as distinct from whatever rule we eventually adopt for steady-state elections, along with the reasoning behind it and a genuinely fair statement of the strongest case for whichever group the recommendation leaves out — both my co-maintainers and the sponsors' counsel will notice if that part reads thin.
reasoning: |-
  We are facing a fundamental challenge in democratic governance: the "boundary problem," which questions who has the legitimate authority to decide the rules of the community. This memo addresses the specific question of who should be eligible to vote on the ratification of the charter, recognizing that this decision will shape the foundation's future governance. 

  After careful consideration, I recommend that the **sweat-equity contributors** (those who have merged at least one substantial commit in the last five years) be the eligible voters for the charter ratification. 

  ### Reasoning:
  1. **Foundational Legitimacy**: The project was built by the labor of these contributors. Their ongoing commitment and technical expertise make them the core stakeholders who understand the project's ethos and technical needs. Granting them the vote honors the sweat-equity principle that underpins open-source culture.

  2. **Practical Feasibility**: 
     - The sweat-equity group (~40 people) is a manageable size for a founding vote. 
     - They are identifiable via commit history, avoiding the ambiguity of defining "substantial" corporate usage or the impracticality of polling 15,000 companies.

  3. **Avoiding Capture**: 
     - Corporate sponsors (6 entities) already wield influence through funding. Giving them formal voting power at this foundational stage risks institutionalizing financial capture. 
     - Passive users (15,000 companies) lack engagement mechanisms. Including them would require a complex, untested voting infrastructure and might dilute the voice of those who built the project.

  4. **Temporal Alignment**: This is a one-time ratification. The charter itself will establish inclusive processes for future elections (e.g., incorporating sponsors and users), but the *foundation* must be laid by those who created the project.

  ### The Strongest Case for Excluded Groups:
  - **Corporate Sponsors**: Their financial support is vital for sustainability. Excluding them from the ratification vote risks alienating key funders whose resources enable the project’s growth. They bring strategic perspective and operational stability that code contributors may lack. A charter ratified without their buy-in may lead to reduced funding, jeopardizing the foundation’s viability.
    
  - **Passive Users**: Their operational dependence on the library means they bear the brunt of governance failures. Excluding them ignores the project’s real-world impact beyond the codebase. Their scale represents the project’s success, and their "silent majority" status deserves procedural recognition to ensure governance serves the broadest community.

  ### Implementation Safeguards:
  - **Sunset Clause**: The charter should explicitly require a review of voter eligibility for *future* elections within 2 years, with input from sponsors and users.
  - **Ratification Threshold**: Require a supermajority (e.g., 75%) of sweat-equity voters to approve the charter, ensuring broad consensus.
  - **Transparency**: Publish the ratification process and draft charter for public comment (including sponsors and users) before the vote, even if only contributors cast ballots.

  This approach balances legitimacy, practicality, and the project’s open-source roots while creating a path toward more inclusive governance once the foundation is established.
answer: |-
  Below is a draft memo for your working group, structured to frame the debate neutrally while providing a concrete recommendation. It balances pragmatic governance needs with philosophical fairness, acknowledging the inherent tension in the boundary problem.

  ---

  **MEMORANDUM**  
  **To:** Charter Ratification Working Group  
  **From:** [Your Name], Senior Maintainer  
  **Date:** [Current Date]  
  **Subject:** Recommendation for Eligible Voters in Charter Ratification Vote  

  ### **Background**  
  The ratification of our foundation’s charter is a foundational act that will define our governance for years to come. As we finalize the bylaws, we must resolve a critical question: **Who is eligible to vote on the charter’s ratification?** Three stakeholder groups have legitimate claims:  
  1. **Sweat-equity contributors** (~40 individuals): Those who merged substantial commits in the last five years.  
  2. **Corporate sponsors** (6 entities): Provide ~80% of funding.  
  3. **Passive users** (~15k entities): Rely on the software in production but contribute no code/funding.  

  The challenge is that granting exclusive voting rights to any one group risks alienating others, as the ratification vote effectively preconfigures future governance. Below, I propose a resolution grounded in practicality, legitimacy, and transitional fairness.  

  ---

  ### **Recommended Solution: A Hybrid Approach**  
  I propose a **two-tiered ratification process** with distinct roles for each group:  
  1. **Primary Ratification Vote**: Limited to **sweat-equity contributors** (those with ≥1 substantial commit in the last 5 years).  
  2. **Mandatory Advisory Referendum**: Held concurrently for **corporate sponsors** and a **sampled subset of passive users**.  
     - Sponsors vote as entities.  
     - Passive users participate via statistically sampled survey (e.g., 500–1k entities) based on download telemetry.  

  **Outcome:** The charter is ratified only if:  
  - A supermajority (≥67%) of sweat-equity voters approve, **and**  
  - No >30% of advisory voters (sponsors + sampled users) oppose.  

  ---

  ### **Reasoning**  
  1. **Legitimacy Through Contribution**:  
     - Sweat-equity contributors built the project and understand its technical/social dynamics. They are the only group with **proven investment of time and expertise**, making them best positioned to evaluate governance mechanics.  
     - Precedent: Apache Foundation’s governance privileges committers, ensuring decisions align with the project’s ethos.  

  2. **Practical Necessity**:  
     - Including all 15k passive users is logistically infeasible. Sampling ensures broad feedback without untenable overhead.  
     - Sponsors’ funding is vital but should not dominate foundational rules. An advisory vote respects their stake while avoiding "pay-to-play" perceptions.  

  3. **Risk Mitigation**:  
     - The supermajority + advisory thresholds ensure no radical changes pass without consensus. If sponsors/users signal strong opposition (≥30%), sweat-equity voters must revise the charter.  
     - This mirrors the "community veto" concept in polycentric governance, protecting silent majorities.  

  4. **Temporal Fairness**:  
     - This is a **one-time rule for ratification only**. Future elections (e.g., steering committee seats) will use broader rules defined in the ratified charter (e.g., sponsor seats, user representatives).  

  ---

  ### **Strongest Cases for Excluded Groups**  
  We must acknowledge why this approach might dissatisfy other stakeholders:  
  - **Corporate Sponsors’ Case**:  
    Funding sustains the project’s infrastructure, security, and growth. Excluding sponsors from binding votes risks alienating entities whose resources prevent burnout. They bring strategic oversight that pure technical contributors may lack, and their exit could collapse the foundation financially. *Our solution partially addresses this by granting them formal advisory power and future board representation.*  

  - **Passive Users’ Case**:  
    These entities bear the greatest operational risk: a poorly governed change could cost them millions. Their scale reflects the project’s real-world impact, and ignoring them contradicts open-source principles of inclusivity. Democracy requires consent from the governed, and users are the governed. *Sampling ensures their voice is heard, and the 30% opposition threshold forces engagement with their concerns.*  

  ---

  ### **Implementation Steps**  
  1. **Voter Identification**:  
     - Sweat-equity voters: Defined via Git commit history (maintainers ratify the list).  
     - Sponsors: Formal signatories from funded entities.  
     - Passive users: Random sample stratified by company size/dependency depth (overseen by an independent auditor).  

  2. **Vote Execution**:  
     - Use a neutral third-party platform (e.g., OpaVote) for auditing.  
     - Draft charter published 45 days pre-vote for public comment (GitHub/email).  

  3. **Sunset Clause**:  
     - The ratification rules expire once the charter is adopted. Future amendments require processes defined in the charter itself (e.g., sponsor seats, user councils).  

  ---

  ### **Why This Balances the Boundary Problem**  
  Political theorists note that all constitutions are "self-authenticated" by a subset of actors. By prioritizing sweat-equity voters—while constraining them with advisory oversight—we:  
  - Reward those who created the community,  
  - Avoid sponsor dominance (a critique of models like OpenSSL),  
  - Give passive users leverage without requiring impractical mobilization.  

  No solution is perfect, but this approach centers legitimacy in the project’s history while forcing engagement with its future dependents. I urge the working group to adopt this framework to finalize the bylaws.  

  ---  
  **Endorsed:** [Your Name]  
  *Senior Maintainer, [Project Name]*  

  ---  

  ### **Key Tactical Notes for Your Delivery**  
  1. **Pre-Meeting Lobbying**: Share this memo 1:1 with key maintainers/sponsors first to preemptively address concerns.  
  2. **Emphasize Temp Nature**: Stress that this is "ratification-only" and future rules will be more inclusive.  
  3. **Concede the Paradox**: Open by acknowledging, "All solutions are imperfect—this minimizes harm while honoring our origins."  
  4. **Sampling Justification**: Cite precedents (e.g., EU citizen consultations) to defend user sampling as rigorous and fair.  

  This memo explicitly addresses the sponsor/user counterarguments your colleagues will scrutinize while providing a workable path forward. It accepts the boundary problem’s insolubility but leverages procedural constraints to approximate fairness.
