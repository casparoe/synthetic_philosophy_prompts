prompt: |-
  For an AI safety and rationality club at my high school, a few of us have been working through Wei Dai's original proposal of updateless decision theory (UDT) so that we can lead a discussion on Newcomb's Problem and the "counterfactual mugging" thought experiment next month. Here is what I think I've understood: the whole point of UDT is that an agent settles, once and for all and before making any observations, on whichever single policy maximizes expected utility with respect to its prior over how the world and its own future observations could turn out, and then it simply executes whatever that policy prescribes; it never recomputes a "better" response after actually seeing what happened, even in a case like counterfactual mugging, where, once you've learned the coin landed tails, handing over the $100 looks like pure loss with nothing left to gain. If that's right, then "updatelessness" is really just a formal label for telling an agent to disregard whatever it subsequently learns, which seems to directly contradict one of the first principles of rational belief I picked up from the LessWrong sequences: that you can never predict, in advance, which direction new evidence is going to move your beliefs (what Yudkowsky calls the conservation of expected evidence). A theory that instructs an agent, ahead of time, to act as though certain future observations won't matter looks like it's built to violate that principle on purpose.

  Given this, I don't understand why anyone doing serious work on decision theory or AI alignment treats UDT as a live contender for how a rational agent ought to reason, rather than as a curious but ultimately confused idea that looks appealing only because it happens to win on a couple of cherry-picked thought experiments. Two people in my club have pushed back and insisted that "updateless" doesn't mean what I think it means, but neither of them could pin down exactly where my reasoning goes wrong. Could you help settle this for us?
reasoning: |-
  Okay, let me tackle this user's question. They're in a high school AI safety club studying UDT, particularly puzzled about how updatelessness aligns with rational belief updating. They think UDT tells agents to ignore new evidence, which contradicts the conservation of expected evidence. Their peers disagree but can't explain why.

  First, I need to recall UDT's core. It's about precommitting to a policy that maximizes expected utility across all possible worlds, not updating that policy after observations. The user's confusion seems to stem from equating "not updating the policy" with "ignoring evidence." But in UDT, the policy itself is designed considering all possible evidence. So when the agent follows the policy, it's actually acting based on precomputed responses to anticipated evidence.

  The user mentions counterfactual mugging. In that scenario, UDT pays the $100 on tails because the policy was set when the coin's outcome was uncertain. The expected utility calculation included the potential gain on heads. So even though tails feels like a loss, the agent honors the precommitment because the overall policy is optimal. This isn't ignoring evidence; it's executing a plan made with evidence in mind.

  The conservation of expected evidence isn't violated. UDT's policy already incorporates the expected value of future evidence. The agent doesn't change its strategy upon seeing new data, but that strategy was chosen under uncertainty, respecting how evidence should affect actions. It's like a game theory strategy where moves are defined for all states, and sticking to it is rational even if some moves seem suboptimal in isolation.

  The user's peers might be struggling to articulate that UDT separates belief updating from decision policies. Beliefs can update internally, but the mapping from beliefs to actions is fixed in advance. This distinction is subtle but crucial. For example, in Newcomb's problem, UDT one-boxes because it precommits to the action that, given Omega's prediction, leads to better outcomes. The policy is set before seeing the box, so it doesn't matter if the box is empty; the agent follows the plan.

  I should emphasize that UDT's strength is in handling predictors and logical correlations, where other theories like CDT fail. The user's skepticism is understandable, but UDT's approach is coherent. It doesn't throw away evidence; it uses it in the initial policy setup. The key is that the utility maximization happens once, considering all branches, including counterfactuals.

  To address why UDT is taken seriously: it solves problems involving acausal agents, which are relevant in multi-agent AI systems. The alignment community cares because an AI might need to coordinate with copies of itself, requiring updateless commitments. Explaining this could help the user see UDT's broader value beyond thought experiments.

  Finally, I should clarify that "updateless" refers to the decision policy, not belief formation. The agent still updates beliefs about the world, but its action rules are fixed. This preserves rational updating while ensuring consistent decisions across possible observations.
answer: |-
  Your understanding captures a key tension in decision theory, but there's a crucial nuance in UDT that resolves the apparent contradiction with conservation of expected evidence. Let's break this down:

  ### Where Your Understanding is Correct
  - **UDT's Core Mechanism**: You're right that UDT agents precommit to a single policy (a function mapping observations to actions) *before* observing anything, optimizing for expected utility over all possible worlds.
  - **Counterfactual Mugging Behavior**: Yes, UDT pays the \$100 on tails even after learning the coin landed tails, because the precommitted policy (which maximizes overall expected utility) requires it.

  ### Where the Misunderstanding Lies
  **"Updatelessness" ≠ "Ignoring Evidence"**. Instead, it means:
  1. **Evidence is Anticipated in the Policy**: The agent *does* account for future observations when designing its policy. The policy explicitly says: *"If I see X, I'll do A; if I see Y, I'll do B."*
  2. **Beliefs Still Update Internally**: When new evidence arrives, the agent *does* update its beliefs about the world. Conservation of expected evidence holds for **beliefs**.
  3. **The Decision *Rule* is Fixed**: What doesn't update is the **mapping from observations to actions**. The agent executes the action its *precomputed* policy dictates *for that specific observation*.

  ### Why This Doesn't Violate Conservation of Expected Evidence
  - **Prior Expectations are Respected**: When UDT calculates the expected utility of a policy, it weights all possible outcomes (e.g., coin heads/tails) by their prior probabilities. Paying \$100 on tails is "worth it" because:
    - *Before* seeing the coin, there was a 50% chance of heads, where paying would yield \$10,000.
    - The expected value of the "pay on tails" policy is (0.5 × -\$100) + (0.5 × \$10,000) = \$4,950.
    - A "never pay" policy has an expected value of \$0.
  - **Post-Observation, You're Not Re-Evaluating**: Once you see tails, you *know* you're in the losing branch. But reneging would undermine the *overall* policy. UDT's strength is recognizing that your action in one branch affects outcomes in *other* branches (e.g., via predictors like Omega).

  ### Why UDT is Taken Seriously
  1. **Solves Newcomb-like Problems**: It robustly handles predictors (e.g., Omega in Newcomb's Problem) by correlating decisions across counterfactual branches.
  2. **Logical Counterfactuals**: UDT handles cases where your action depends on logical proofs or identical copies of yourself (e.g., in Parfit's Hitchhiker or Prisoner's Dilemma with clones).
  3. **Avoids Self-Defeating Behavior**: In problems like **Counterfactual Mugging**, UDT avoids the trap of:
     - *Conditional on seeing tails*: Refusing to pay (since it loses \$100).
     - *Conditional on seeing heads*: Wishing you had precommitted to pay (to get the \$10,000).
  4. **Relevance to AI Alignment**: UDT addresses how an AI might reason about:
     - Its own source code being known by other agents.
     - Coordinating with copies of itself.
     - Trade-offs between branches it will never observe.

  ### The Key Insight You're Missing
  **UDT separates two things:**
  - **Belief Updates** (which respect conservation of evidence): *"Given what I've seen, what's true about the world?"*
  - **Decision Rules** (which are updateless): *"What action does my precomputed optimal policy dictate for this observation?"*

  In Counterfactual Mugging:
  - When you see tails, you update your belief: *"The coin is tails."*
  - But your policy (created *before* seeing the coin) says: *"If tails, pay \$100."*
  - You pay not because you ignore evidence, but because deviating would make the *overall policy* suboptimal.

  ### Why Your Club's Pushback is Valid
  Your peers are likely gesturing at this separation. UDT doesn't say "ignore observations." It says: **"Optimize globally across all possible observations, then follow the script."** The script itself is *designed* to respond to observations optimally *in expectation*.

  ### Practical Example
  Imagine programming a UDT AI for Counterfactual Mugging:
  1. **Before the coin flip**:
     - It computes: *"Policy A: Pay on tails → Expected utility \$4,950"*
     - *"Policy B: Never pay → Expected utility \$0"*
     - It precommits to Policy A.
  2. **After seeing tails**:
     - It knows utility will be -\$100.
     - But it pays anyway because **the alternative policy is worse *ex ante***.

  This isn't irrational—it's ensuring the agent doesn't sabotage its *prior* self. The loss on tails is the price of accessing the gain on heads.

  ### Conclusion
  UDT isn't a "confused idea" but a rigorous framework that:
  - Respects Bayesian belief updating.
  - Optimizes decisions *across* counterfactual worlds.
  - Avoids dynamic inconsistencies (regretting past commitments).

  It's treated as a live contender because it solves problems where other theories (like Causal Decision Theory) fail catastrophically, especially when an agent's actions are *predicted* by others. Your club's discussion will be richer for wrestling with this—it's a profound topic that even experts debate! For further reading, check out **Eliezer Yudkowsky's "Functional Decision Theory"** (a UDT variant) or **Scott Garrabrant's work on logical inductors**. Keep questioning; that's the heart of rationality.
