prompt: |-
  I chair my university's Academic Integrity Board, which hears cases of suspected AI-generated coursework based on little more than a detector's probability score and stylistic anomalies flagged by the instructor. The board is split on whether we should demand more of that evidence before finding a student responsible when the mandated sanction is severe, such as dismissal for a repeat offense, than when it is mild, such as resubmission with no notation on the transcript. Some members see this as no different from a court requiring stronger proof before a harsher verdict; others insist that whether a given student actually used AI is a fact about the world that cannot depend on what will happen to them if we rule against them, so letting the sanction shape our confidence threshold corrupts the fact-finding rather than improving it. Draft a short policy memo, to take effect next term, that states whether and how our confidence threshold should track sanction severity, and that answers the second group's objection rather than simply overriding it.
reasoning: |-
  Okay, the user chairs a university Academic Integrity Board dealing with AI-generated coursework cases. They're facing a philosophical split among members about whether evidentiary thresholds should vary based on sanction severity. 

  Hmm... this is a fascinating ethical-legal dilemma. The "court analogy" faction wants sliding standards of proof like criminal vs civil cases, while the "factual purity" group argues truth is absolute regardless of consequences. Both positions have merit - the former acknowledges real-world impact, the latter fears moral contamination.

  I recall legal philosophy debates about "outcome-dependent" evidence standards. Ronald Dworkin would probably side with the second group's integrity concern, while pragmatic jurists might argue that process values include proportionality. The university context adds layers: pedagogical goals, student development, and institutional reputation all matter.

  Noticing the user's phrasing - "corrupts the fact-finding" shows how visceral this is for some members. They're not just disagreeing; they feel the process's soul is at stake. The memo must validate that fear while redirecting it. 

  The key insight: We're not adjusting "what happened" based on sanctions, but acknowledging that higher stakes demand more robust proof precisely because false positives are catastrophic. It's about error distribution, not truth relativity. 

  For structure, I'll:
  - Lead with shared values (integrity + fairness)
  - Reframe sliding thresholds as risk management
  - Emphasize unanimous confidence for severe sanctions
  - Preserve lower-stakes educational resolutions
  - Use "collective confidence" language to depersonalize

  Biggest challenge: Making the philosophical counterargument feel addressed, not dismissed. Need to show that variable standards actually serve factual accuracy better in aggregate by preventing rushed judgments when lives hang in the balance.
answer: |-
  ## MEMORANDUM  
  **TO:** Academic Integrity Board Members  
  **FROM:** Chair, Academic Integrity Board  
  **SUBJECT:** Policy on Evidentiary Thresholds for AI Violations (Effective Next Term)  
  **DATE:** October 26, 2023  

  ### I. POLICY STATEMENT  
  Effective next term, the Academic Integrity Board shall apply a **tiered threshold of confidence** when determining responsibility in cases involving suspected AI-generated coursework. The threshold shall escalate in proportion to the severity of the potential sanction, *not* because the underlying facts change, but because the consequences of error demand greater certainty to protect fundamental fairness.  

  ### II. IMPLEMENTATION FRAMEWORK  
  1. **Minimal Sanctions (e.g., resubmission, no transcript notation)**  
     - *Threshold:* "Preponderance of Evidence" (>50% confidence).  
     - *Rationale:* Educational correction aligns with lower risk of irreversible harm.  

  2. **Moderate Sanctions (e.g., course failure, transcript notation)**  
     - *Threshold:* "Clear and Convincing Evidence" (high probability, unambiguous indicators).  
     - *Rationale:* Significant academic penalties warrant robust confidence.  

  3. **Severe Sanctions (e.g., dismissal, suspension for repeat offenses)**  
     - *Threshold:* "Near Certainty" (no plausible alternative explanation).  
     - *Required:* Corroborating evidence beyond detectors/stylistics (e.g., inconsistent writing history, draft anomalies, admission).  
     - *Rationale:* Life-altering consequences necessitate maximal protection against error.  

  ### III. ADDRESSING THE OBJECTION: FACTS VS. CONSEQUENCES  
  We affirm the core principle: **whether a student used AI is an objective fact.** Our policy does *not* alter this fact. However, human fact-finding is inherently probabilistic. The key distinction is:  

  > **We adjust our *confidence requirement* for *decision-making*, not the factual standard itself.**  

  #### Why This Is Not "Corruption":  
  - **Error Asymmetry:** A false positive in a dismissal case inflicts irreparable harm; a false negative in a resubmission case allows pedagogical remediation. Variable thresholds mitigate disproportionate injustice.  
  - **Procedural Fairness:** Just as courts require "beyond reasonable doubt" for capital punishment, we acknowledge that the *stakes of error* ethically demand stricter scrutiny. This aligns with principles of due process.  
  - **Epistemic Humility:** Sole reliance on detectors/stylistics is inherently fallible. Higher stakes oblige us to seek converging evidence to reduce uncertainty—enhancing, not corrupting, factual accuracy.  

  ### IV. PRACTICAL SAFEGUARDS  
  - **Unanimity Requirement:** For severe sanctions, the Board must reach unanimous consensus on "near certainty."  
  - **Evidence Corroboration:** Instructors must provide contextual anomalies (e.g., deviations from prior work, unexplained proficiency shifts) alongside detector scores.  
  - **Burden Preservation:** The standard of proof *always* rests with the instructor/Board. Students never bear the burden to "disprove" AI use.  

  ### V. CONCLUSION  
  This policy balances our duty to academic integrity with our duty to student welfare. By calibrating confidence thresholds to sanction severity, we uphold both truth-seeking and justice—ensuring that when the consequences are grave, our certainty is commensurately grave. This framework operationalizes fairness without relativizing truth.  

  **Approved for implementation next term.**  

  ---  
  *Attachment: Flowchart for Evidence Thresholds by Sanction Tier*
