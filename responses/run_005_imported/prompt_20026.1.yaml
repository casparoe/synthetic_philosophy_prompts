  I'm on the board of my small condo association (all volunteer, nobody's a lawyer) and there's a situation I can't stop chewing on. One owner, call him Frank, filed a formal complaint against his neighbor for parties that blow way past our 11pm quiet-hours rule. Everyone in the building also knows Franks been illegally renting his spare room on Airbnb for two years, breaking a totally different rule the board's never enforced against him, and the neighbor he's complaining about is the one who reported Frank's Airbnb thing to the city last month, so this reeks of payback. Half the board wants to shelve Frank's complaint since he's such a hypocrite, the other half says the noise rule got broken regardless of who reported it or why. Its got me wondering whether being a hypocrite actually costs you the right to call someone else out, or if that's just a convenient way to dodge getting called out yourself. Could you write the memo I'd bring to Tuesday's meeting recommending what the board should actually do, with real reasons, and taking the "Frank's a hypocrite" argument seriously instead of just waving it away?
