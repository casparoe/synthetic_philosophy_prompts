  Also, consider the legal aspect. If the board ignores a valid complaint because of the complainant's behavior, it might open them up to liability. Especially if the noise issue persists and others are affected. Consistency in rule enforcement protects the association from legal challenges.

  The memo should structure the argument to first validate the hypocrisy concern, then explain why rules must still be enforced. Recommend forming two separate investigation committees: one for the noise, one for Frank's violations. This approach demonstrates impartiality and commitment to the community's rules.

