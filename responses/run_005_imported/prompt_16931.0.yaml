  First, I need to recall Hume's arguments clearly. The frost example shows Hume acknowledges testimony can overcome lack of personal experience when the event isn't contrary to natural laws. Frost is unusual but not impossible—it's just outside someone's experience. Miracles, however, are defined as violations of natural laws, which Hume argues have uniform experience against them. 

  The user's confusion hinges on why testimony works for frost but not miracles. The key difference is the antecedent improbability. For frost, the improbability is moderate because it's an unknown natural phenomenon. For miracles, the improbability is extreme because it contradicts established laws of nature. Hume's probability calculus requires that the testimony's falsehood must be more improbable than the miracle itself, which he thinks is practically impossible.

  I should check if there's a principled distinction in Hume's theory. Hume's concept of "unalterable experience" versus "lack of experience" is crucial. The Indian prince had no experience of frost, but no experience against it either. Miracles have massive evidence against them. Testimony's reliability must outweigh the prior probability. For miracles, that prior probability is so high that no testimony could surpass it. 

  Also, Hume's criterion for miracles being violations matters. Frost doesn't violate laws; it's just an unfamiliar instance. A resurrection would break known biological laws. So the evidential weight needed differs fundamentally. 

