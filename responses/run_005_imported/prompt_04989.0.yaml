  But there are differences. Condorcet's paradox is about aggregating preferences leading to cycles, while the fairness impossibility is about statistical trade-offs in predictive models. The mechanisms are different: preference aggregation vs. error rate balancing. The normative stakes also differ; voting paradoxes affect democratic decisions, while algorithmic fairness impacts marginalized groups directly.

  Now, how would Condorcet approach this? He'd likely see the modern result as another constraint within social mathematics, not a refutation. He'd analyze the mathematical structure, note the similarity in incompatibility, and seek procedural solutions. He'd rank the fairness criteria based on moral principles, perhaps prioritizing calibration if it aligns with probabilistic reasoning, or error rates if equity is more urgent. His commitment to applying math to justice would drive him to find practical adjustments, like adjusting base rates or thresholds, much like his voting methods.

