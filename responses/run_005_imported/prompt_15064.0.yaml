answer: |-
  Here are 8 focused, adversarial questions targeting the *philosophical* and *interpretive* controversies surrounding Everett QM, designed for an audience already sold on decoherence over collapse. Each includes a likely answer and a sharp follow-up:

  1.  **Question:** Deutsch-Wallace decision theory aims to derive the Born rule probabilities from rationality axioms alone, without adding them as a postulate. Critics (e.g., Adrian Kent, David Albert) argue the axioms subtly bake in the Hilbert space structure or the probabilistic assumption. Where does the *real* work happen in their derivation: pure rationality, or smuggled-in quantum structure?
      *   *Likely Answer:* She'll defend D-W, arguing rationality applied to the branching structure uniquely constrains agents to use the Born rule for bets; the quantum structure provides the *context* for rational action.
      *   **Follow-Up:** If an agent in a structurally identical branching universe defined by a *different* fundamental measure (not the squared amplitude) could also derive consistent betting odds *without* Born rule probabilities, wouldn't that undermine the claim that rationality *alone* forces the Born rule? Doesn't D-W need the quantum structure to be *dynamically privileged*?

  2.  **Question:** Decoherence is continuous and environment-dependent. What *ontological* criterion defines a "separate branch" or "world" in Everett? Is it simply a pragmatic choice based on when interference becomes practically negligible, or is there a fundamental, observer-independent fact about when one world splits into two?
      *   *Likely Answer:* Branches are emergent structures defined by decoherence. There's no sharp split; it's a matter of degree based on the suppression of interference between components. "Worlds" correspond to robust, dynamically autonomous structures within the universal wavefunction.
      *   **Follow-Up:** Doesn't this blurring of "worlds" undermine the core Everettian ontology? If branches aren't fundamental but fuzzy emergent approximations, how do we avoid the criticism that Everett simply *replaces* the collapse postulate with a vague, emergent "worlds" concept that lacks precise definition?

  3.  **Question:** Bohmian Mechanics provides a single, nonlocal worldline with exact Born rule statistics. Why should we prefer Everett's ontological profligacy (infinite branching worlds) over Bohm's ontological economy (one world) coupled with nonlocality? Isn't nonlocality a *known* feature of QM (Bell), while infinite branching universes seem like a heavier metaphysical cost?
      *   *Likely Answer:* Bohm requires adding *hidden variables* (particle positions) *and* a non-Newtonian guidance equation *and* a special initial condition (quantum equilibrium) just to recover standard QM predictions. Everett needs *only* the unitary wavefunction dynamics we already have; it's more parsimonious *theoretically*. Nonlocality in Bohm is *dynamically explicit*, whereas in Everett nonlocality is explained via entanglement within the wavefunction.
      *   **Follow-Up:** Isn't Everett's "parsimony" achieved only by pushing all the complexity into an unobservable multiverse? Bohm's ontology (particles + wave) is arguably *simpler* to visualize. And if the wavefunction is real *and* high-dimensional in both, doesn't Everett's *additional* commitment to the simultaneous reality of *all* decohered components represent a *greater* ontological burden than Bohm's single configuration?

  4.  **Question:** The Quantum Suicide thought experiment seems to suggest an Everettian should expect subjective immortality. If you set up a device to kill you only in branches where a quantum event fires, you only *experience* the branches where you survive. Does taking Everett seriously imply you *should* expect to survive such an experiment, and if not, why doesn't the typicality argument work here?
      *   *Likely Answer:* No. While you only *experience* surviving branches, the *measure* (Born probability) of branches where you die quickly becomes overwhelmingly large. Rational expectation is governed by the measure. You *expect* to die, even though *if* you survive, you'll be unsurprised.
      *   **Follow-Up:** Doesn't this expose a tension? The "I" in the surviving branch has a continuous subjective experience confirming they *are* in a surviving branch. Why isn't the *first-person perspective* of the observer, who *only ever finds themselves* in worlds where unlikely survivals happen repeatedly, evidence *against* the Born rule applying to their subjective anticipation? Isn't this privileging the third-person measure over the first-person experience in a way the thought experiment challenges?

  5.  **Question:** In a deterministic multiverse where all possibilities are equally real, what does "probability" *mean* for a single branching event? If both outcomes happen, why should I *care* more about the branch weighted by 70% squared amplitude than the one weighted 30%? Isn't "probability" just a label for the measure, with no normative force for action?
      *   *Likely Answer:* Probability arises from self-locating uncertainty. Before the split, you don't know *which* future branch "you" will be in. Rational betting odds are forced by the structure of that uncertainty and the branching weights.
      *   **Follow-Up:** But after the split, there *is* no uncertainty – both future versions *know* their outcome. The pre-branching "you" ceases to exist. Why should the *pre-branching* agent's rational betting strategy, based on uncertainty that *disappears* upon branching, dictate the *value* or *significance* each resulting branch has *ontologically*? Why should I invest more resources in creating high-amplitude futures if both are equally real?

  6.  **Question:** Critics like David Wallace himself note Everett struggles with *falsifiability*: any conceivable experimental outcome is consistent with some branch existing. How does Everett avoid being dismissed as empirically vacuous? How does it differ from "shut up and calculate" if both predict the same outcomes, just with different stories?
      *   *Likely Answer:* Everett's empirical content is *identical* to standard quantum mechanics *without* collapse. It makes the *same* testable predictions about relative frequencies and interference patterns. Its virtue is providing a *coherent, consistent, and complete* explanation for *why* those predictions hold, without unexplained postulates.
      *   **Follow-Up:* If Everett *only* reproduces standard QM predictions and adds no *new* testable consequences, isn't the "infinite branching universes" aspect *itself* empirically vacuous excess baggage? Why isn't it just an untestable metaphysical add-on to the predictive structure we already use?

  7.  **Question:** Decoherence relies on a specific factorization of the universal Hilbert space into "system" and "environment". What *fundamental* principle justifies this factorization? Isn't this factorization essentially putting the "observer" (or environment-as-observer) back in by the back door, risking a return of vagueness akin to the Copenhagen cut?
      *   *Likely Answer:* Factorization isn't fundamental; it's emergent and dynamical. Decoherence happens because of specific interaction Hamiltonians that naturally create entanglement and information transfer between subsystems. The robustness of pointer states arises from the dynamics, not an arbitrary choice.
      *   **Follow-Up:** But doesn't the *definition* of what constitutes the "system" versus the "environment" *start* with a choice of factorization? While dynamics *then* explain decoherence *given* that split, what ensures there's a *unique* or *objectively preferred* way to factorize the universe into subsystems where decoherence defines quasi-classical branches? Couldn't different factorizations lead to different "branching structures"?

  8.  **Question:** If locality is violated in our universe (per Bell), but Everett explains it via entanglement within the wavefunction, does this imply a deeper, *fundamental* locality in the configuration space of the universal wavefunction? Or is the wavefunction's dynamics inherently non-local?
      *   *Likely Answer:* The wavefunction evolution via the Schrödinger equation is fundamentally *local in configuration space*. Non-local *correlations* (entanglement) arise naturally from this local dynamics acting on a high-dimensional space. The *apparent* non-locality in 3D space is an emergent phenomenon.
      *   **Follow-Up:** Doesn't the vastness and abstractness of configuration space make "locality" within it a physically meaningless concept? How does "locality in configuration space" help us understand or constrain the *manifest* non-local correlations we observe in our 3D world? Isn't it just a mathematical artifact with no grounding in physical intuition?

  **Key to Hard Follow-Ups:** These target perceived weaknesses in standard Everettian responses: the justification for the Born rule's normative force, the ontological vagueness of branches, the cost comparison with hidden variable theories, the reconciliation of measure and subjective experience, the meaning of probability in a deterministic multiverse, the charge of unfalsifiability, the basis problem rearing its head via factorization, and the physical relevance of locality in configuration space. They force engagement beyond textbook defenses. Good luck with the interview!
