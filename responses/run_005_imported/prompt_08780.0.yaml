answer: |-
  Here’s a toast that channels Cicero’s framework honestly, acknowledges the differences, and aims for warmth without glossing over reality—tailored for your dad and the room:

  ---

  **(Clink glass lightly)**  
  "Alright, settle down. For those who don’t know me, I’m [Your Name], [Dad's Name]’s kid. And yes, I got voted into this—probably because I’m the only one here who reads 2000-year-old books for fun. Which is actually relevant tonight, believe it or not.

  See, a while back, I found this battered old book called *On Old Age* by Cicero. Bought it because the title made me laugh. But it’s basically this Roman senator, Cato, sitting down with two young guys who are terrified of getting old, and he calmly dismantles every one of their fears. Not with platitudes, but with arguments. He says people mainly complain about four things:  
  1.  Old age means you can’t *do* anything anymore.  
  2.  The body gives out.  
  3.  You stop enjoying life.  
  4.  And… well, you’re closer to the end.  

  Now, Cato was a wealthy Roman power-player arguing at 80. Dad? Dad ran a hardware store for 45 years, did payroll, fixed lawnmowers, and still shows up twice a week to make sure the new owners 'aren’t screwing it up.' Different worlds. But reading Cato made me think hard about *this* old age we’re celebrating tonight. So, let’s tackle Cato’s list… Dad-style.

  **First: 'Old age means you can’t *do* anything.'**  
  Cato tells a story about this blind old Roman senator who gets *carried* into the Senate because they still desperately wanted his opinion on a war. Dad’s version? It’s not the Roman Senate, it’s the aisle of [Hardware Store Name]. It’s his army buddies calling him at 7 AM because their faucet exploded. It’s showing my cousin how to rewire a lamp last Thanksgiving instead of watching football. His ‘Senate’ isn’t marble halls; it’s garages, kitchens, and this dinner table. The ‘doing’ changed shape, but the *need* for his know-how? That never stopped. He traded the daily grind for being the guy you call when stuff breaks. That’s not inactivity; that’s a different kind of power.

  **Second: 'The body gives out.'**  
  Okay, Cato could afford farms and slaves. Dad’s shoulders are shot from lifting water heaters for 40 years, and his knees sound like a popcorn machine when he stands up. Cato didn’t have to deal with that. So let’s be real: parts wear out. But Cato’s point wasn’t ‘ignore it.’ It was: *focus on what the mind can do when the body rests*. Dad planning complex plumbing fixes in his head *now*, or remembering the specs of a 1985 Toro mower? That’s the mind working smarter, compensating. It’s not denial; it’s adaptation. He traded lifting water heaters for diagnosing the problem over the phone. Still fixing things, just differently.

  **Third: 'You stop enjoying things.'**  
  Cato talks about an old farmer planting trees he *knows* he’ll never sit under. Why? Because the act itself brings joy, and the future matters. Dad didn’t plant orchards; he built a business. He knew most customers by name, knew their projects, their kids. The joy wasn’t just in the sale; it was in being part of the town’s story for 45 years. He planted trees in the form of relationships, trust, and that stubborn insistence on doing a job right. Retirement hasn’t stopped him enjoying *that* legacy. He still gets satisfaction knowing his store endures, run right (or at least, he’s checking twice a week to make sure!). The enjoyment shifted from the daily hustle to the pride in what he built lasting.

  **Fourth: 'You’re closer to the end.'**  
  This is the big one. Cato doesn’t sugarcoat it. He gives a blunt argument: If death is the end, it’s like a dreamless sleep – no pain. If it’s *not* the end, and something comes after? Well, then it might even be better. Either way, he says, dread is pointless. Now, Dad’s no Roman philosopher. He’s a practical guy who fixed things. But his life *is* the argument against dread. He faced what life threw at him – the army, building a business, raising a family – without flinching. He showed us how to live *now*. The hardware store, this family, these friends laughing at his terrible jokes… this is what endures. The closer you get to the end, the longer the shadow you cast. Dad’s shadow? It’s long, it’s solid, and it’s full of people he helped, taught, and loved. That’s not something you dread; that’s something you build toward. He didn’t avoid the end by pretending 80 is 60; he filled the years in between so completely that the number doesn’t diminish what’s here.

  So, Dad, we’re not here because you’ve avoided getting old. We’re here because of *how* you’ve gotten old. Like Cato’s farmer, you planted trees we get to sit under. Like his blind senator, your voice still matters where it counts. You traded the physical grind for wisdom, the daily stress for enduring pride, and you faced the years without pretending they’re something they’re not. That’s worth celebrating.

  To [Dad's Name]: A man who proved that old age isn’t about denying the years, but about what you put *into* them. Happy 80th, and happy retirement… mostly. **(Nod knowingly about the twice-weekly check-ins)**. Cheers!"

  ---

  **Why this works for your situation:**

  1.  **Honors Cicero's Structure:** Clearly hits all 4 complaints and uses his key examples (blind senator, tree-planting farmer, death argument) but immediately contextualizes them.
  2.  **Respects Your Dad's Reality:** Directly contrasts Cato's elite life with the hardware store grind, acknowledges physical wear-and-tear, and validates his dislike of "80 is 60" platitudes. The line "He traded lifting water heaters for diagnosing the problem over the phone" is key – it shows adaptation, not denial.
  3.  **Connects Philosophy to Life:** Makes Cicero's points tangible through Dad's specific experiences (store, army buddies, family help).
  4.  **Manages the Audience:** Starts with a relatable hook (voted into it, old books), uses humor ("knees sound like a popcorn machine," "stubborn insistence," "checking twice a week"), and keeps examples concrete (rewiring a lamp, 1985 Toro mower) to engage both army buddies and cousins. The "shadow" metaphor is vivid but accessible.
  5.  **Tone:** Warm, respectful, honest, slightly wry (like your description of Dad), and ultimately celebratory of *his specific* journey and character. It lands on legacy and presence, not denial.
  6.  **Length:** Structured for 4-5 minutes spoken aloud, with natural pauses.

  **Delivery Tip:** Speak to your Dad, especially during the parts directly about him. Let your voice warm up at the end. The slight nod/joke about him still checking on the store is a great moment to make eye contact with him and get a likely chuckle from the crowd. Good luck! He’s lucky to have a kid who puts this much thought into honoring him.
