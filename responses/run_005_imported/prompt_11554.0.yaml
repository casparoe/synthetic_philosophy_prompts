answer: |-
  You're grappling with a profound tension between Thomistic moral psychology and empirical findings about folk judgments – a tension Aquinas himself would likely find fascinating rather than dismissive. Here's a reconstruction of how your formidable Thomist might engage with Knobe, drawing directly on the apparatus of *Summa Theologica* II-II, q. 64, a. 7 and related texts:

  1.  **The Core Thomist Distinction & Knobe's "Intentionally":**
      *   Aquinas rigorously separates *intention* (what falls under the will's direct aim - *finis operantis*) from *foresight* (what is merely anticipated as a consequence - *praevisiones*). The bad effect in self-defense (e.g., the aggressor's death) is *praeter intentionem* - outside the intention (ST II-II, q.64, a.7, ad 2).
      *   **Thomist Expectation:** Aquinas *would* expect the asymmetry Knobe found for "intentionally." Why?
          *   **Moral Salience of Harm:** For Aquinas, harm (*malum*) requires justification; benefit (*bonum*) does not. An agent permitting foreseen harm triggers an immediate demand for moral accounting (proportionate reason). This demand naturally pulls the description "intentionally" towards the harmful side-effect in folk judgments. People intuitively sense the moral weight needing justification and associate that weight with stronger agential involvement – hence "intentional."
          *   **"Intentionally" Encodes Moral Evaluation:** Aquinas treats common language as revealing conceptual structure (*In Ethic.* I, lect. 1). The Knobe effect shows that "intentionally" isn't a purely descriptive, valence-neutral term in ordinary usage; it carries evaluative freight concerning *responsibility for bad outcomes*. This aligns with the Thomist view that *intentio* proper involves the will's *directedness*, which is fundamentally teleological and evaluative. Saying the chairman *intentionally* harmed captures the sense that he *should be held responsible* for the foreseen harm, given his motive was insufficiently justifying. Saying he *didn't* intentionally help reflects the lack of a similar demand; the benefit is merely welcomed or permitted, not *aimed at*.
          *   **Absorption, not Embarrassment:** Double Effect *already* has a structural asymmetry at the level of justification. Knobe reveals a parallel asymmetry in folk *ascriptions of intentionality* precisely *because* folk judgments are sensitive to the moral demands the Thomist framework systematizes. Your friar would likely see Knobe as *empirical confirmation* of the deep moral intuition his framework articulates: harmful side-effects demand a different kind of agential accounting than beneficial ones, which influences how we describe the agent's involvement.

  2.  **The Epistemic Side-Effect Effect ("Knew"): The Deeper Challenge:**
      *   This *is* the sharper challenge, as it seems to attack the presupposition of foresight (*praevisiones*) itself. Aquinas treats foresight as a cognitive act – knowing a consequence will follow – distinct from the volitional act of intending it. The neutrality of this cognitive act is crucial for DE.
      *   **Why it Bites:** If folk judgments about *knowledge* are asymmetrical based on valence, it suggests that "knew" isn't functioning as a neutral, descriptive cognitive state in ordinary language either. It seems infected by the same evaluative concerns as "intentionally." This threatens the bedrock distinction: if "foreseeing harm" is described as "knowing," but "foreseeing benefit" isn't, how can DE rely on a neutral concept of foresight?
      *   **Thomist Response - Distinguishing Levels:**
          *   **Technical vs. Ordinary Language:** Aquinas is a master of distinguishing *sensus communis* from *sensus philosophicus/scientificus*. He absolutely takes common speech as a starting point revealing conceptual contours (*In Peri Herm.* I, lect. 2), but his philosophical project involves *refining* and *precisely defining* those concepts for rigorous moral analysis. He wouldn't expect ordinary language to perfectly map his technical distinctions.
          *   **The Key Resource: "Voluntarium in Causa" (Voluntary in its Cause):** This is crucial (ST I-II, q.6, a.3; q.77, a.7). Aquinas distinguishes:
              *   *Voluntarium in se*: Something willed directly (intended).
              *   *Voluntarium in causa*: Something not willed directly, but arising from an action whose *foreseen* consequences make the agent responsible for it *as if* voluntary. The bad effect in self-defense is voluntary *in causa*.
          *   **Applying it to "Knew":** Your friar would argue that the folk asymmetry in "knew" actually reflects a conflation of *cognitive foresight* with *imputability/responsibility* (which maps onto *voluntarium in causa*), not a genuine denial of the cognitive state in the benefit case.
              *   In the *harm* scenario: Folk say "he knew." This is correct cognitively. The strong sense of *responsibility* (he *should* have let this knowledge constrain him, but didn't) makes the cognitive state salient and unambiguous. "He knew (and is therefore culpable)."
              *   In the *benefit* scenario: Folk are reluctant to say "he knew he would help." Why? Not because they genuinely deny the cognitive foresight (if pressed, they'd likely agree he *did* foresee it), but because "knew" in this context carries an implication of *responsibility for bringing it about* or *deliberate production* that feels inappropriate. The benefit wasn't aimed at; it wasn't *his doing* in the strong sense of *voluntarium in se*, and crucially, it doesn't *need* justification. Saying "he knew" feels like assigning credit or responsibility he doesn't deserve. They are effectively saying: "He didn't *know* (in the sense of *making it his business to ensure it happened* or *being responsible for it as an outcome he produced*)."
          *   **Preserving Neutral Foresight:** The Thomist insists that at the *cognitive level*, foresight (*praevisiones*) is indeed neutral: the chairman *does* foresee both effects. The asymmetry in *saying* "knew" reflects the *voluntarium in causa* distinction – the assignment of responsibility/imputability based on the *moral valence* of the foreseen consequence and the agent's motive. "Knew" is being used to express *imputability for the consequence*, not just bare cognition. The bare cognition is present in both cases.

  3.  **Overall Thomist Position & Novelistic Implications:**
      *   **Not Dismissive, But Critical & Absorptive:** Your friar wouldn't dismiss Knobe et al. as "reductive social science." He'd see the results as:
          *   **Confirming** a fundamental moral intuition about the asymmetry of harm/benefit in assessing agency and responsibility.
          *   **Revealing** how ordinary language terms like "intentionally" and even "knew" encode complex judgments about responsibility and imputability (*voluntarium in causa*), not just bare intention or cognition.
          *   **Highlighting the Need for Precision:** The results underscore *why* the Thomist makes sharp technical distinctions between *intentio*, *praevisiones*, *voluntarium in se*, and *voluntarium in causa*. Ordinary language blurs these, especially under moral pressure. The Knobe effects expose this blurring.
      *   **Embarrassment?** Not for the core framework. The results don't show Aquinas was *wrong* about the distinctions; they show why those distinctions are *necessary* to avoid the confusions evident in folk psychology. The asymmetry in permissibility within DE *explains* the folk asymmetries.
      *   **Threat Neutralized:** The epistemic side-effect effect doesn't destroy neutral foresight. It shows that "knew" in ordinary language often smuggles in imputability. The Thomist technical concept of *praevisiones* remains cognitively neutral. The finding *warns* that the bare concept of "foreseeing" used in DE must be carefully distinguished from connotations of responsibility when applying the doctrine, but it doesn't invalidate it.

  **How Your Friar Might Speak (Philosophical Core Underneath):**

  > *(Leaning forward, fingers steepled, eyes sharp)* "Fascinating, Doctor. Truly. Your results... they do not surprise me, though their precision is admirable. They lay bare the very pulse of moral judgment in the common mind.
  >
  > "Consider 'intentionally.' Of course they say the chairman *intended* the harm! He foresaw a grave evil, sprung from his own act, and pressed on regardless – driven by mere lucre. His will embraced that act *knowing* the poison it carried. Is this 'intention' in the strict sense? No. Aquinas teaches us to parse the will's movements with finer instruments. The man *intended* profit; he merely *foresaw* the ruin. But the ruin clings to him! It is *voluntarium in causa* – voluntary by virtue of its origin in his reckless choice. The people feel this weight, this imputation, and their language cries out: 'He *intended* it!' They are not wrong about the *responsibility*; only perhaps about the precise mechanics of the will.
  >
  > "And the 'benefit'? Absurd to say he *intended* it! He stumbled upon it, blind to any good save his own. No justifying reason was needed, nor sought. His will remained closed to it. The people sense this irrelevance of the good to his corrupted purpose. They refuse him the credit of intention. Correctly.
  >
  > *(Pauses, tone becoming sharper)* "Now, this 'knew'... This cuts closer, yes. But listen: When they say of the harm 'he *knew*', they speak truth. He foresaw it. Clear as day. But when they hesitate to say 'he *knew*' of the benefit... do they truly mean his eyes were shut? Or is it that 'knew' here feels too much like saying he *willed* it, he *made it happen*, he *earns its praise*? He did none of those things! The benefit was *praeter intentionem* – outside his aim. It was foreseen, yes (*praevisiones*), but inert in his will. To say 'he knew' in this context, for the common tongue, risks conflating the cold eye of foresight with the warm hand of deliberate production. They deny him not the *cognition*, Doctor, but the *authorship*. They are guarding the word 'knew' from being a cloak for unearned credit. The *fact* of foresight remains. Your clever questions expose how language strains under moral weight, how 'knowing' can imply 'owning'. But our task, as moral theologians, is to isolate the thread of bare foresight – *praevisiones* – upon which the delicate balance of double effect turns. We must distinguish the *seeing* from the *willing*, and the *willing* from the *being answerable for what was seen but not willed*. Your results... they show us why this precision is not scholastic hair-splitting, but a necessary shield against the moral blurring inherent in our fallen speech."

  This approach allows your friar to:
  1.  Engage seriously with the science.
  2.  Affirm the deep intuition the results reveal.
  3.  Use the results to *highlight the necessity and explanatory power* of Thomist distinctions (intention vs. foresight, *voluntarium in se* vs. *in causa*).
  4.  Defend the neutrality of foresight (*praevisiones*) as a technical cognitive concept by explaining the folk asymmetry in "knew" as a conflation with imputability/responsibility.
  5.  Sound formidable, grounded in Aquinas, and intellectually compelling.

  The Knobe effects become, for the Thomist, not a refutation, but a vivid illustration of the moral pressures that necessitate the precise conceptual machinery of Double Effect. Your friar would likely see them as confirming the realism of Aquinas's moral psychology.
