answer: |-
  Marcus was my closest friend for thirty years. My statistical conscience. My partner in countless coffees shared over data printouts and methodological debates. And today, I stand here profoundly aware of the silence left by his absence, a silence that echoes in the labs he advised, the classrooms he taught, and the quiet moments of scientific doubt where his clarity used to shine.

  For those who knew Marcus professionally, you knew a man animated by a deep love for rigorous thought. He dedicated his life to understanding *how* we know what we know from data. He was, through and through, a man of the Neyman-Pearson tradition. To Marcus, statistics wasn't just arithmetic; it was a structured philosophy of decision-making under uncertainty. He believed fiercely in the framework of specifying hypotheses upfront, controlling error rates, and letting the data speak within those carefully defined boundaries.

  He watched the recent decades of methodological reform – the push for preregistration, registered reports, larger samples – with a complex mix of approval and a very specific frustration. He championed these practices wholeheartedly! To him, they *were* good frequentist science, long overdue. But what irked him, what truly got under his skin, was the narrative that often accompanied them. At conference after conference, he’d hear these essential fixes presented as some sort of victory for an entirely different statistical philosophy – Bayesianism. He’d come back, shake his head, and with that wry smile we all knew, mutter his signature line: **“They kept the arithmetic and stole the credit.”**

  This wasn't just academic pettiness. It stemmed from a profound respect for the distinct philosophical underpinnings of each approach. He saw them as different languages describing the same complex landscape of uncertainty, each with its strengths and its place. He felt the *story* being told was erasing the intellectual heritage and careful logic of the tradition he’d devoted his life to. This conviction cost him, personally. He watched two brilliant doctoral students, whom he deeply admired, embrace Bayesianism. While he respected their intellect, the philosophical divergence created a distance, a subtle fracture in those relationships that he felt more keenly than he ever publicly admitted. He regretted that loss, not because they chose a different path, but because the shared foundational language he cherished seemed to fade.

  Not long before he left us, Marcus half-joked with me. “Whatever you do,” he said, “don’t let my funeral be the occasion where the Bayesians finally win.” But he was equally adamant: “And don’t you dare turn my eulogy into a defense of significance testing!” He understood the heat of the debate, the passion on all sides. But he also understood, fundamentally, that reducing him, or the vast field he loved, to a caricature in this ongoing conversation would be a profound disservice. He didn’t want his final moment to be ammunition in a fight; he wanted the *integrity* of the discourse preserved.

  So, how do I honor Marcus today? Not by declaring victors in statistical debates that rage on, nor by pretending the deep questions about evidence and inference that animated his life are settled. I honor him by remembering the *man* within the statistician.

  I honor the **rigor** that wasn't just about p-values, but about intellectual honesty. The Marcus who would spend hours dissecting an experimental design, not to find fault, but to ensure the question being asked was clear and answerable. The Marcus who believed that clarity of thought was the foundation of all good science, regardless of the statistical toolbox used.

  I honor the **stubbornness**, yes – that fierce adherence to principle that could sometimes frustrate. But that stubbornness was rooted in a deep conviction that ideas matter, that philosophical foundations shape practice, and that shortcuts in thinking ultimately corrupt knowledge. It was the stubbornness of someone who cared *too much* about getting it right.

  And above all, I honor the **kindness**. The kindness that shone through when a young researcher, intimidated and floundering, walked into his office. The Marcus who would listen patiently, explain complex concepts without condescension, and whose eyes would light up when *you* finally grasped the nuance. The Marcus who cared deeply about his students, even – perhaps especially – those who ultimately walked a different philosophical path. His frustration wasn't born of personal animosity, but of a passionate belief in a framework he felt was being misrepresented, coupled with a genuine sadness at the distance it created with people he valued.

  He was rigorous, stubborn, and kind. He was fiercely loyal, wickedly funny, and possessed an unwavering moral compass. He was my friend. He challenged me, supported me, and for thirty-five years, while I ran my lab publishing p-values, he was the quiet voice reminding me to consider *what they actually meant*.

  Marcus spent his life counting things, measuring uncertainty, seeking truth in the noise. Today, we count our loss. We feel the uncertainty of a world without his sharp mind and steady presence. But the truth we hold onto is this: Marcus lived a life of profound intellectual passion and deep human connection. He cared about ideas, and he cared fiercely about people. He made science better, and he made us better scientists – and better humans – for having known him.

  Rest well, my friend. The debate continues, as it should. But we’ll strive to conduct it with the rigor, the integrity, and yes, even the stubbornness, that you embodied. And we’ll remember, always, the kindness that lay beneath it all.
