answer: |-
  Your question cuts to the heart of why strict propriety is indispensable in the accuracy-dominance argument for probabilism. Let's break down the issue, using a concrete example to illustrate why mere propriety isn't sufficient and how strict propriety connects to immodesty.

  ### **Core Problem: The Gap in the Dominance Argument**
  The accuracy-dominance argument has two key steps:
  1. **Dominance Lemma:** Every incoherent credence function is *accuracy-dominated* by some coherent one (i.e., there exists a coherent credence that is strictly more accurate in every possible world).
  2. **Non-Dominance Lemma:** No coherent credence function is accuracy-dominated by any other credence function (coherent or incoherent).

  **Where mere propriety fails:** While a merely proper (but not strictly proper) scoring rule preserves the *non-dominance* of coherent credences (step 2), it sabotages the *dominance lemma* (step 1). With mere propriety, some incoherent credences **are not dominated by any coherent credence**, undermining the argument for probabilism.

  ---

  ### **Concrete Illustration: A Merely Proper Scoring Rule**
  Consider a toy inaccuracy measure for a single proposition \(X\) (with \(\mathbf{1}_X = 1\) if \(X\) is true, 0 otherwise):

  \[
  \mathscr{I}(c, \omega) = 
  \begin{cases} 
  0 & \text{if } c = \mathbf{1}_X \\
  1 & \text{otherwise}
  \end{cases}
  \]

  This is the "all-or-nothing" scoring rule: you get perfect accuracy (0 inaccuracy) only if your credence *exactly matches* the truth value (1 when \(X\) is true, 0 when false); otherwise, you get maximal inaccuracy (1).

  #### **Why is this merely proper?**
  - **Expected inaccuracy** from the perspective of credence \(c\):
    \[
    \mathbb{E}_c[\mathscr{I}(d)] = c \cdot \mathscr{I}(d, 1) + (1 - c) \cdot \mathscr{I}(d, 0)
    \]
  - If you hold credence \(c\) and consider switching to \(d\):
    - When \(d = c\), \(\mathscr{I}(c, 1) = 0\) if \(c=1\), else 1; \(\mathscr{I}(c, 0) = 0\) if \(c=0\), else 1.  
      \(\implies \mathbb{E}_c[\mathscr{I}(c)] = c \cdot 0 + (1 - c) \cdot 1 = 1 - c\)  (if \(c \notin \{0,1\}\)).
    - For any other \(d \neq c\) (including \(d = 0\) or \(d = 1\) if \(c \notin \{0,1\}\)):
      \[
      \mathbb{E}_c[\mathscr{I}(d)] = c \cdot 1 + (1 - c) \cdot 1 = 1 \quad (\text{since } d \text{ never matches both truth values})
      \]
  - **Result:**  
    \(\mathbb{E}_c[\mathscr{I}(c)] = 1 - c \leq 1 = \mathbb{E}_c[\mathscr{I}(d)]\) for all \(d \neq c\).  
    Equality holds *only* if \(c = 0\) or \(c = 1\) (e.g., if \(c = 0.5\), \(\mathbb{E}_{0.5}[\mathscr{I}(0.5)] = 0.5 < 1 = \mathbb{E}_{0.5}[\mathscr{I}(d)]\)).  
    → The rule is **proper** (no credence expects another to be strictly better), but **not strictly proper** (many credences expect themselves to be *as good as* others; e.g., \(c=0.3\) and \(c=0.7\) both have expected inaccuracy 0.7 from their own perspectives).

  #### **What happens to dominance?**
  Now consider an **incoherent credence** \(b(X) = 0.6\) for \(X\) and \(\neg X\) (so \(b(\neg X) = 0.6\), violating \(b(X) + b(\neg X) = 1\)).

  - **Accuracy in each world**:
    | Credence       | World \(X\) true (\(\mathbf{1}_X=1\)) | World \(X\) false (\(\mathbf{1}_X=0\)) |
    |-----------------|--------------------------------------|---------------------------------------|
    | \(b = (0.6, 0.6)\) | \(\mathscr{I}(0.6,1) + \mathscr{I}(0.6,0) = 1 + 1 = 2\) | \(\mathscr{I}(0.6,0) + \mathscr{I}(0.6,1) = 1 + 1 = 2\) |
    | Coherent \(p = (1.0, 0.0)\) | \(\mathscr{I}(1,1) + \mathscr{I}(0,0) = 0 + 0 = 0\) | \(\mathscr{I}(1,0) + \mathscr{I}(0,1) = 1 + 1 = 2\) |
    | Coherent \(q = (0.0, 1.0)\) | \(\mathscr{I}(0,1) + \mathscr{I}(1,0) = 1 + 1 = 2\) | \(\mathscr{I}(0,0) + \mathscr{I}(1,1) = 0 + 0 = 0\) |
    | Coherent \(r = (0.5, 0.5)\) | \(\mathscr{I}(0.5,1) + \mathscr{I}(0.5,0) = 1 + 1 = 2\) | \(\mathscr{I}(0.5,0) + \mathscr{I}(0.5,1) = 1 + 1 = 2\) |

  - **Analysis**:
    - In the \(X\)-world, \(p\) has inaccuracy 0, while \(b\) has inaccuracy 2.  
    - In the \(\neg X\)-world, \(q\) has inaccuracy 0, while \(b\) has inaccuracy 2.  
    - **But \(b\) is not dominated by any coherent credence**:  
      - \(p\) is *less accurate* than \(b\) in the \(\neg X\)-world (2 vs. 2? → equal, not strictly better).  
      - \(q\) is *less accurate* than \(b\) in the \(X\)-world (2 vs. 2).  
      - \(r\) has the same inaccuracy as \(b\) in *all* worlds (2 everywhere).  

    **Result:** No coherent credence strictly dominates \(b\) across all worlds. The incoherent \(b\) is "Pareto-optimal" under this scoring rule! The dominance lemma fails.

  ---

  ### **Why Strict Propriety Fixes This**
  A **strictly proper** scoring rule (e.g., Brier score) ensures that each coherent credence function is the *unique* minimizer of expected inaccuracy from its own perspective. This eliminates "flat spots" in accuracy comparisons:
  - Incoherent credences always lie outside the convex hull of coherent credences.
  - Strict propriety guarantees that for any incoherent \(b\), there exists a coherent \(p\) that is strictly closer to the truth *in every possible world* (via a separating hyperplane argument, leveraging the uniqueness of minimization).

  In our example, the merely proper rule creates a "plateau" where many credences (coherent or incoherent) have identical inaccuracy in some worlds. This breaks the strict dominance required by the lemma.

  ---

  ### **Strict Propriety vs. Immodesty**
  - **Strict Propriety**:  
    For every credence \(c\), \(c\) is the *unique* minimizer of \(\mathbb{E}_c[\mathscr{I}(d)]\).  
    → *No other credence* is equally good from \(c\)'s perspective.

  - **Immodesty**:  
    A credence \(c\) is **immodest** if it uniquely minimizes \(\mathbb{E}_c[\mathscr{I}(d)]\) over all \(d\).  
    → \(c\) believes it is strictly more accurate than any alternative.

  **Relationship**:
  - **Strict propriety implies immodesty for all credences** (by definition).
  - **But immodesty alone does not imply strict propriety**:  
    A scoring rule could be *immodest for coherent credences* but not for incoherent ones. For example, a rule where coherent credences each regard themselves as uniquely best, but an incoherent credence \(b\) might *also* regard itself as uniquely best (or tie with others). Strict propriety requires immodesty *universally*—for every credence, coherent or not.

  **Key point**: The accuracy-dominance argument requires strict propriety precisely because it needs a *global* property that forces every incoherent credence to be strictly accuracy-dominated, which rests on the uniqueness of expected minimization across the entire credence space. Immodesty is a consequence of this, but not sufficient to guarantee dominance.

  ---

  ### **Conclusion**
  Relaxing strict propriety to mere propriety sabotages the accuracy-dominance argument by allowing incoherent credences to escape domination. The "all-or-nothing" scoring rule illustrates how mere propriety creates equivalence classes of credences with identical inaccuracy in some worlds, shielding incoherent credences from being strictly dominated. Strict propriety prevents this by ensuring that each credence function is "sensitive" to differences from its own perspective, eliminating ties in expected accuracy. This directly underpins immodesty but is stronger, as it enforces uniqueness universally. Without strict propriety, probabilism cannot be vindicated via dominance—making it non-negotiable in epistemic utility theory.
