  Random thing I keep thinking about: Darwin figured out natural selection before anyone even had the concept of a gene (he never knew about Mendel's work and never would). So who do you think he'd side with in the modern fight over whether selection really acts on genes vs individuals vs whole groups -- team Dawkins/selfish gene, or would he actually lean group-selectionist like Wynne-Edwards or D.S. Wilson? Theres that bit in Descent of Man where he talks about warring tribes and self-sacrifice spreading through a tribe even though it doesnt actually help the individual doing the sacrificing, which sounds like proto group selection to me. Curious how you think he'd actually react if someone sat him down and explained the whole debate to him today.
