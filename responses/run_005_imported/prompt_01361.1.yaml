  for the sake of getting the dialogue right: would Nietzsche just fully cosign Strawson's conclusion that real moral responsibility is impossible, or does something else in his philosophy -- amor fati, will to power, the whole project of going "beyond good and evil" -- push him toward a different reaction, maybe even toward thinking the question itself is confused? give me his most plausible in-character response and actually walk through the reasoning, don't just hand me a verdict.
