  Working on a novel where my lead, Priya, is a philosophy professor whos built her career defending the zombie argument -- that a being physically identical to a person but with nobody home inside is conceivable, which she thinks proves consciousness isn't just physical. There's a scene where a journalist who's clearly done more than skim the wikipedia page profiles her for a magazine piece, and I want the questions to actually land instead of just "but can you REALLY imagine that." Draft me around 8 interview questions -- at least one pressing on why the conceivability-to-possibility move doesn't collapse the way "Hesperus isn't Phosphorus" does once a posteriori necessity is on the table, one that pins her down on the phenomenal concept strategy materialists always throw at her, and one on the epiphenomenalism worry -- if her zombie twin writes the exact same book defending the exact same argument for purely physical reasons, what's consciousness even doing. Add a one-line follow-up after each guessing at whatever dodge she'd reach for.
