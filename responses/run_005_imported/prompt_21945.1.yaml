  I recall Woodward's distinction between "intervention variables" (physical) and "interventionist counterfactuals" (theoretical). The user seems to conflate them. Also worth emphasizing how this framework improves on Humean correlation by requiring explicit causal pathways and testable implications—exactly what the lawyer would need for burden of proof.

  The user's frustration about counterfactuals is understandable but overlooks how interventionism constrains speculative what-ifs. Pearl's ladder of causation metaphor might help: they're climbing from seeing to doing to imagining, all using the same mathematical machinery.

  Should mention the legal context explicitly—causation in tort law never requires time travel, only "more likely than not" based on evidence. The directed graphs help exclude confounders (like smoking habits) that could break the solvent-cancer link.

