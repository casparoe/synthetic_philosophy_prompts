  I should avoid clichés. No secret AI consciousness. Focus on ESP as the disruptor. The resolution could show that the room isn't foolproof, leading to ethical dilemmas. Characters' motivations: Dr. Thorne wants to prove her AI, Professor Vance is a skeptic using ESP to discredit the test, and Elara is caught in between. The test's failure raises questions about fairness and the test's design flaws when ESP is real.

