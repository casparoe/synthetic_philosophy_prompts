answer: |-
  You're absolutely right to see tension here—these *are* rival solutions to dynamic choice paradoxes, and they rest on fundamentally different conceptions of rationality. For Parfit's Hitchhiker, **resolute choice (the "fixed theory" move) is the correct and superior explanation for why paying is rational.** Rational irrationality is a clever hack for specific threats, but it fails as a general account of commitment and distorts what's happening in the Hitchhiker case. Let me defend this fiercely:

  1.  **Resolute Choice Solves the Core Problem Directly:** The Hitchhiker's paradox arises *because* standard "sophisticated" choice theory evaluates each act *atomistically* at the moment of choice. At T1 (desert), promising to pay is rational (it gets you rescued). At T2 (town), paying $1000 for nothing is irrational *if evaluated only at T2*. Resolute choice argues this atomistic evaluation is the *mistake*. Rationality requires evaluating *plans of action over time*. The *plan* "Promise at T1 & Pay at T2" is optimal – it gets you rescued and costs $1000. The *plan* "Promise at T1 & Don't Pay at T2" is *inferior* – it leaves you dead in the desert. Choosing the *act* "Pay at T2" is rational *because* it is the essential final step in executing the *optimal overall plan you adopted at T1*. There's no "irrationality" involved at T2; you're fulfilling a rational commitment.

  2.  **Rational Irrationality Misfires in the Hitchhiker:**
      *   **No Self-Modification:** In the robber/drug case, rationality *requires* a literal, temporary transformation into a different *kind* of agent (an irrational one). The Hitchhiker doesn't need to *become irrational* to pay. Paying is a perfectly coherent, intentional act *undertaken for a reason*: to uphold your promise and (crucially) *because you recognize that being the type of agent who upholds such promises is what saved you*. Your reason for paying *is* the reason you got rescued in the first place.
      *   **The Wrong Kind of "Irrationality":** Calling paying "irrational" implies it lacks justification or is contrary to reason *simpliciter*. But it demonstrably *isn't*. The justification ("I owe him my life because of this promise") is perfectly sound. The *only* thing making paying *seem* irrational is the flawed atomistic theory that ignores the diachronic structure of the plan. Rational irrationality buys into this flawed view by *accepting* that paying *is* irrational at T2 and then saying it was rational to become an agent who would "irrationally" do it. This is convoluted and unnecessary.
      *   **Threats vs. Promises:** The robber exploits your *rational responsiveness to threats against your children*. Making yourself unresponsive *to those specific threats* is rational. The Hitchhiker driver exploits your *reliability in keeping promises*. Making yourself unresponsive *to reasons for keeping promises* (i.e., becoming irrational in that domain) would destroy the very trait the driver relies on. You *need* to remain responsive to reasons *for* promise-keeping to make the initial promise credible. Resolute choice preserves this responsiveness; rational irrationality destroys it.

  3.  **Why Resolute Choice Isn't Just Semantics:** McClennen and Gauthier aren't just playing word games. They identify a genuine flaw in standard decision theory: its inability to handle *precisely* these kinds of dynamic interactions where *your current choice affects the feasibility of past or future desirable options*. The atomistic view leads to self-defeating choices (like dying in the desert because you won't pay, or not getting the toxin money because you won't drink). Resolute choice provides a *coherent framework* for evaluating plans over time and sticking to them when doing so achieves a better overall outcome, without requiring you to literally break rationality. Paying the driver *is* the rational act *within the context of the optimal plan*.

  **The Verdict:** When people say paying the Hitchhiker is rational, they are (or *should be*) making the **resolute choice ("fixed theory") move**. They are recognizing that the act of paying only *appears* irrational when ripped from its context. In reality, it is the fulfillment of a commitment that was essential to achieving the vastly preferable outcome of being rescued. Rational irrationality is a fascinating tool for very specific scenarios involving threats and coercion (like the robber), but it's the wrong tool for understanding commitments, promises, and the rationality of plan-following exemplified by the Hitchhiker and Toxin puzzles. Resolute choice provides the deeper, less paradoxical, and more generally applicable account of rational commitment.
