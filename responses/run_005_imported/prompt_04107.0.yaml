  My analysis: resolute choice (McClennen/Gauthier) is the stronger framework for the Hitchhiker. Rational irrationality (as in the drug example) requires literal self-modification (like chemical alteration), which isn’t happening in Hitchhiker—you’re just paying as promised. Resolute choice redefines rationality as fidelity to a prior optimal plan, avoiding paradoxes without needing "irrational" traits. In Hitchhiker, paying isn’t irrational; it’s upholding a commitment that got you rescued, making it instrumentally rational.  

  Why this over rational irrationality? The latter feels like a workaround ("I broke my rationality to win"), while resolute choice fixes the theory’s flaw—evaluating acts in isolation. It’s more elegant and doesn’t pathologize keeping promises. For the user, this resolves the tension: paying the driver was always rational, no mental gymnastics required.  

