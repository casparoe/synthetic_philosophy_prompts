prompt: |-
  I'm working on a piece about why music seems to bypass our usual critical distance and affect us more directly than the other arts, and that sent me back to the philosophical source most often cited for the intuition: Schopenhauer's discussion of music in Book III, §52 of The World as Will and Representation. I've been reading it in the old Haldane and Kemp translation (1883), and I've gotten stuck on the paragraph where he explains why music is metaphysically different from painting, sculpture, poetry, and the rest. Here it is in full:

  "The (Platonic) Ideas are the adequate objectification of will. To excite or suggest the knowledge of these by means of the representation of particular things (for works of art themselves are always representations of particular things) is the end of all the other arts, which can only be attained by a corresponding change in the knowing subject. Thus all these arts objectify the will indirectly only by means of the Ideas; and since our world is nothing but the manifestation of the Ideas in multiplicity, though their entrance into the principium individuationis (the form of the knowledge possible for the individual as such), music also, since it passes over the Ideas, is entirely independent of the phenomenal world, ignores it altogether, could to a certain extent exist if there was no world at all, which cannot be said of the other arts. Music is as direct an objectification and copy of the whole will as the world itself, nay, even as the Ideas, whose multiplied manifestation constitutes the world of individual things. Music is thus by no means like the other arts, the copy of the Ideas, but the copy of the will itself, whose objectivity the Ideas are. This is why the effect of music is so much more powerful and penetrating than that of the other arts, for they speak only of shadows, but it speaks of the thing itself. Since, however, it is the same will which objectifies itself both in the Ideas and in music, though in quite different ways, there must be, not indeed a direct likeness, but yet a parallel, an analogy, between music and the Ideas whose manifestation in multiplicity and incompleteness is the visible world."

  What I can't work out is this: he insists that music "passes over" the Ideas and is "entirely independent" of the phenomenal world they generate, yet in the pages immediately following this passage he goes on to argue, in painstaking detail, that the bass line corresponds to inorganic nature, the inner harmonic voices to the plant and animal kingdoms, and the melody to self-conscious human striving -- mapping music's structure onto exactly the hierarchy of Ideas he has just said it bypasses. Is that a straightforward contradiction, or is there a way of reading "a copy of the will itself, not of the Ideas" that actually requires this kind of structural parallel rather than ruling it out? I'd like to work through the logic of this before I try to explain the view to a general audience.
