answer: |-
  That's a fantastic question that cuts to the heart of Kepler's unique intellectual synthesis. You're right to see it as more than mere superstition; Kepler was engaged in a deliberate project to *reform* astrology based on his core scientific and metaphysical principles. His distinction wasn't arbitrary; it stemmed directly from his fundamental beliefs about the universe and knowledge. Let's break down his reasoning:

  1.  **The Foundational Principle: Geometry as the Language of Creation:**
      *   Kepler was a committed Neoplatonist and Pythagorean. He believed the universe was fundamentally constructed according to geometric principles by a divine Geometer.
      *   **Key Idea:** For Kepler, only things grounded in demonstrable, mathematical geometry possessed inherent reality and causal power within the cosmic order. Abstract concepts or arbitrary human divisions lacked this ontological weight.

  2.  **Why Traditional Astrology Failed the Geometry Test:**
      *   **Zodiac Signs:** Kepler saw the division of the ecliptic into 12 equal *signs* (Aries, Taurus, etc.) as purely conventional. There was no physical reality or geometric necessity to these specific 30-degree segments. They were human labels applied to a continuous circle.
      *   **Astrological Houses:** The division of the local sky into 12 houses based on the horizon and meridian was similarly arbitrary. The methods for calculating house cusps varied, and the resulting divisions had no inherent geometric basis linking them to fundamental cosmic principles. They were local and computational, not universal and geometric.
      *   **Planetary Rulerships:** Assigning specific planets to rule specific signs (e.g., Mars ruling Aries) was, for Kepler, pure anthropomorphic fiction. There was no geometric or physical reason why one planet should "own" one segment of the sky over another. It was symbolic bookkeeping without a basis in *natura* (nature as governed by mathematical law).

  3.  **Why Aspects Passed the Geometry Test:**
      *   **Concrete Physical Reality:** Aspects are the angular separations between planets *as measured from a specific point* (Earth, or later, the Sun). These angles are:
          *   **Observable:** They can be precisely measured using astronomical techniques.
          *   **Geometric:** They represent fundamental geometric relationships (0° conjunction, 60° sextile, 90° square, 120° trine, 180° opposition).
          *   **Dynamically Relevant:** Kepler believed these angles had physical significance. Light rays emanating from planets converged at specific angles on Earth. He speculated this convergence could physically interact with the Earth's atmosphere ("sublunary sphere”) and potentially terrestrial matter, acting as a kind of geometric “trigger” or “lens.”
      *   **Harmonic Resonance:** This is crucial. Kepler didn't just see the angles as inert measurements. He linked them directly to his grand theory of *Harmonices Mundi* (Harmony of the World). He discovered that the ratios defining consonant musical intervals (which the soul finds pleasing) corresponded to the angular ratios defining the "consonant" aspects:
          *   Conjunction (0°): Ratio 1:1 (Unison)
          *   Opposition (180°): Ratio 1:2 (Octave)
          *   Trine (120°): Ratio 2:3 (Perfect Fifth)
          *   Sextile (60°): Ratio 3:5 (Major Sixth - he considered this consonant, though weaker)
          *   Square (90°): Ratio 1:1 (but geometrically dissonant as it creates tension) - Ratio 3:4 (Perfect Fourth) was also considered, but the square's 90° angle itself was geometrically "harsh."
      *   **Geometric Archetypes:** Kepler believed these specific geometric relationships (the angles themselves and the polygons they imply – equilateral triangle for trine, square for square, hexagon for sextile) were not just human constructs, but fundamental archetypes woven into the very fabric of creation by God. They represented the pure, ideal forms upon which nature was patterned.

  4.  **Bridging the Gap: The Soul's Harmonic Archetypes:**
      *   This is where Kepler's metaphysics and psychology come in. He believed the human soul (*anima*) was not merely a passive receiver but was itself a microcosm of the macrocosm, intrinsically structured according to the *same* geometric and harmonic principles governing the universe.
      *   **Key Idea:** The soul possesses innate "archetypes" – pre-existing templates or patterns – that correspond to the fundamental geometric harmonies found in the cosmos (the regular polygons, the consonant ratios).
      *   **The Mechanism:** When the planets form a specific angular configuration (aspect) in the sky:
          1.  **Physical Trigger (Speculative):** The convergence of light rays at that specific angle might subtly influence the Earth's atmosphere or even terrestrial matter (like the "animal faculty" or *facultas formatrix* he sometimes invoked).
          2.  **Perception/Registration:** The human observer (consciously or unconsciously) perceives this geometric configuration in the heavens.
          3.  **Archetypal Resonance:** The geometric pattern inherent in the aspect *resonates* with the corresponding geometric archetype pre-existing within the soul. This resonance is non-physical but real – a kind of harmonic sympathy.
          4.  **Soul's Response:** This resonance stirs the soul, influencing its state. Just as consonant music pleases the soul because it resonates with its internal harmony, consonant aspects could induce harmony or inclination, while dissonant aspects (like the square) could induce tension, agitation, or specific predispositions.
          5.  **Effect on Temperament/Events:** The stirred state of the soul then influences the individual's temperament, inclinations, and potentially their actions. On a larger scale, if many souls resonate similarly (or the physical trigger affects the environment), it *could* correlate with collective events (like weather patterns he tried to link to aspects, or social trends).

  **Why This Was "Principled" for Kepler:**

  1.  **Rooted in *Natura*:** Aspects were grounded in measurable, geometric relationships occurring in physical space, unlike the arbitrary divisions of signs and houses.
  2.  **Mathematical Harmony:** Aspects were demonstrably linked to the universal laws of harmony (musical ratios) that Kepler believed governed everything from planetary orbits to the human soul. This gave them an objective, non-arbitrary foundation.
  3.  **Empirical (in his view):** Kepler spent enormous effort trying to correlate aspects (especially conjunctions and oppositions of Saturn and Jupiter) with historical events and weather patterns. While his methods wouldn't pass modern statistical muster, he genuinely believed he was finding evidence supporting the *physical* effects of angular configurations. This empirical effort (however flawed) was part of his attempt to make astrology "scientific" based on geometry and observation.
  4.  **Metaphysical Coherence:** The entire system fit within his grand unified Neoplatonic-Pythagorean vision: God the Geometer created a universe governed by geometric harmony. The human soul, as a divine creation, mirrored this harmony. Therefore, geometric resonances between the heavens and the soul were not just plausible but *necessary* within his worldview. The "archetypes" provided the ontological link.

  **In Summary:**

  Kepler drew the line between "real" and "fake" astrology based on **mathematical geometry and harmonic ratios** as the fundamental, divine language of nature. Aspects survived his purge because they were concrete geometric angles demonstrably linked to these universal harmonies. Zodiac signs, houses, and rulerships were discarded because they lacked this geometric foundation, being arbitrary human conventions. The bridge to human effects was built on his theory that the human soul inherently contains geometric/harmonic archetypes that resonate sympathetically with the same patterns formed by the planets in the sky. For Kepler, this wasn't pseudoscience clinging to tradition; it was a rigorous (though ultimately unsuccessful) attempt to rebuild astrology on the only foundation he considered valid: the geometry of the divine creation. He sought to transform astrology from a symbolic art into a natural philosophy based on angles, light, and universal harmony.
