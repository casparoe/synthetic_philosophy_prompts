  First, Kepler rejected traditional astrology because it lacked a basis in natural philosophy. Zodiac signs and houses are human divisions, not physical. But aspects? Those are geometric angles based on planetary positions. Kepler was all about geometry as the language of the universe. So for him, angles were measurable and mathematically real. 

