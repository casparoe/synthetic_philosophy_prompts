answer: |-
  Here are nine interview questions designed to push beyond textbook restatements, with targeted follow-ups to challenge the guest's defense of resolute choice. Each core question addresses your specified focus areas, and the follow-ups anticipate common replies to maintain dialectical pressure.

  ---

  ### Core Questions & Follow-Ups

  1. **Diachronic Rationality Under Uncertainty**  
     *Core Question:* "You argue that resolute choosers avoid exploitation by evaluating *extended plans* holistically, eliminating synchronic irrationality at any single node. But in real markets—unlike tidy money-pump sequences—agents face uncertainty about future options, changing valuations, or whether a sequence *is* exploitative. How does a resolute agent distinguish between *sticking to a pre-committed plan* and *irrationally ignoring new information* that reveals their plan is being gamed?"  
     → *Likely Reply:* "Resoluteness incorporates rational *planning* under uncertainty; deviating wastes prior planning costs."  
     *Follow-Up:* "If the agent revises their plan upon learning they’re in a pump, doesn’t that collapse into sophisticated choice? If not, how do they *non-arbitrarily* decide when new information warrants abandoning the plan without inviting exploitation?"

  2. **Incomplete Preferences & Sequential Sweetening**  
     *Core Question:* "For cyclical preferences, money pumps exploit strict intransitivity. But for *incomplete* preferences (e.g., options A/B on a par), exploitation relies on sequential 'sweetening' (e.g., A vs A+). How does resolute choice block this if the agent lacks a strict ranking to begin with? Isn't rejecting sweetened offers just ad hoc stubbornness when no prior plan existed?"  
     → *Likely Reply:* "Resoluteness means pre-committing to reject *all* sweeteners for incomparable options."  
     *Follow-Up:* "But if A and A+ are incomparable, why is rejecting A+ rational? Isn’t this equivalent to *creating* a strict preference where none existed—effectively smuggling in transitivity?"

  3. **Resoluteness vs. Self-Binding**  
     *Core Question:* "Is resolute choice meaningfully distinct from *Ulysses-style self-binding*? If an agent pre-commits to a plan (e.g., via algorithm or contract), they mechanically avoid exploitation—no diachronic rationality required. Doesn’t this suggest resoluteness is just *rationalizing* a binding mechanism rather than solving the core problem of non-transitive/incomplete preferences?"  
     → *Likely Reply:* "Binding is external; resoluteness is an internal commitment to coherence across time."  
     *Follow-Up:* "If the agent can internally commit *without* external tools, why do we observe real-world exploiters (e.g., predatory traders) succeeding? Isn’t resoluteness empirically unstable without binding, reducing to wishful thinking?"

  4. **Credences & Diachronic Dutch Books**  
     *Core Question:* "Could resolute choice defend against diachronic Dutch books for non-Bayesian updaters? For example, if an agent resolves *in advance* to update credences only via Jeffrey conditioning, could they 'avoid exploitation' by refusing bets that exploit their non-Bayesianism?"  
     → *Likely Reply:* "No—preferences can be coherently planned, but credences *must* track truth; refusing updating is epistemically irrational."  
     *Follow-Up:* "But if resolute choosers can ignore instrumental losses by appealing to 'plan coherence,' why can’t non-Bayesians ignore Dutch-book losses by appealing to 'epistemic integrity'? Doesn’t this reveal resoluteness as question-begging?"

  ---

  ### Additional Pressing Questions
  5. **Costs of Resoluteness**  
     "In your model, does resoluteness ever *incur* opportunity costs? If a resolute agent ignores a Pareto-improving sweetener (e.g., A+ when A/B are on a par) to avoid potential pumps, isn’t this a *synchronic* loss—and if so, how is it 'rational'?"  
     → *Follow-Up if dismissed:* "If avoiding *possible* exploitation justifies *actual* losses, isn’t this a 'paranoid' rationality?"

  6. **Multiple Equally Valid Plans**  
     "When two plans are equally choice-worthy but mutually exclusive (e.g., Plan 1: {A, reject B+}; Plan 2: {B, reject A+}), how does the resolute agent select one without invoking a higher-order preference—reintroducing cyclicity risk?"

  7. **Behavioral Evidence**  
     "Empirically, humans exhibit time inconsistency *despite* planning (e.g., retirement savings). Does resolute choice demand implausible cognitive control, confusing normative ideals with psychological plausibility?"

  8. **Trading-Firm Context**  
     "In our earlier money-pump case, the exploited strategy had cyclical preferences *implicit* in its code. Could resolute choice even be implemented algorithmically? Or is it only a 'ghost in the machine' for human agents?"

  9. **Exit Strategies**  
     "How does a resolute agent decide when to *abandon* a plan? If they can rationally exit when costs exceed thresholds, doesn’t this admit that money-pump arguments retain normative force?"

  ---

  ### Key Design Notes
  - **Follow-Ups as Scalpels**: Each follow-up targets a potential evasion. Question 1’s follow-up challenges "planning costs" as a dodge; Question 3’s forces engagement with real-world fragility.  
  - **Pressure on Holism**: Question 1 and its follow-up directly undermine the "whole plan" defense by introducing uncertainty and information dynamics.  
  - **Incomplete→Cyclical Slippage**: Question 2 exposes how defending incompleteness might covertly rely on transitivity.  
  - **Dutch-Book Disanalogy**: Question 4 tests whether resoluteness is a *general* anti-exploitation tool or special pleading for preferences.  
  - **Practical Bite**: Questions 8 and 9 ground theory in your audience’s quantitative world.  

  These questions avoid rehashing undergrad material by targeting the *implementation*, *stability*, and *metaphysical commitments* of resolute choice—forcing the guest to defend its operational reality.
