  Let me analyze each claim one by one:

  1. **[dominance]**: This claim states that Kelly betting will almost surely dominate any other fixed fraction strategy in the long run. This is mathematically true under the assumptions of repeated independent bets and a fixed edge. However, it ignores risk preferences and the possibility of ruin (which Kelly avoids but other strategies might not). Also, "regardless of one's personal risk preferences" is too strong because if an agent is extremely risk-averse, they might prefer a safer strategy even if it grows slower. The dominance is asymptotic and almost sure, but in finite time, other strategies can have a chance of being ahead. So, while the mathematical result is correct, the claim overstates by saying it's "objectively correct" without considering risk preferences.

  2. **[reduction]**: This claim says that Kelly betting is just expected utility maximization for log utility and not special otherwise. This is correct: for any utility function, the optimal strategy is to maximize expected utility. Kelly is a special case for log utility. The claim is essentially true, but note that log utility has some unique properties (like being the utility that leads to maximizing long-term growth). However, the claim is accurate: without assuming log utility, there is no inherent reason to use Kelly. So, this is sound.

  3. **[ergodicity]**: This comes from the "ergodicity economics" literature. The idea is that for multiplicative growth, the time-average growth rate (which is what a single bettor experiences) is maximized by Kelly. The ensemble average (expected value) can be misleading because it grows exponentially and doesn't represent the typical path. The argument is that by focusing on the time-average growth rate, we get Kelly without assuming a utility function. This is a valid insight, but note that the time-average growth rate is exactly the expected log wealth, so it is equivalent to maximizing expected log wealth. The claim is essentially reframing the same optimization. However, the reasoning is sound and provides an alternative perspective. But there is debate about whether this avoids utility functions (because maximizing growth rate is a specific objective). Also, the ergodicity argument requires that the process is ergodic, which it is in the repeated bet setting. So, the core insight is correct, but the presentation might oversimplify by implying it's without any preference assumption (it's still assuming we care about long-term growth).

  4. **[samuelson]**: Samuelson's critique is that the long-run behavior doesn't dictate what to do in finite time. He argues that preferring the strategy that wins almost surely in the long run is equivalent to having a particular utility function (like log) and not a universal prescription. This is a valid criticism. The claim is essentially that the infinite limit doesn't force a finite decision and that the Kelly argument is circular because it implicitly assumes a preference for long-run dominance. This reasoning is sound and highlights an important caveat.

  5. **[fractional]**: This claim argues that because of parameter uncertainty (we don't know the true edge), betting a fraction (like half) of the naive Kelly fraction is a rigorous response. The reasoning is that overbetting is worse than underbetting because the penalty for betting too much (risk of ruin) is asymmetric. This is a well-known practice (called "fractional Kelly") and is justified by the convexity of the growth rate function around the Kelly fraction. It is a rigorous response to uncertainty, but note that it is also a form of risk aversion. The claim is correct that it's not merely ad hoc but based on the properties of the Kelly criterion.

  6. **[bargaining]**: This claim draws an analogy between maximizing geometric mean of wealth over time and maximizing the geometric mean of utility gains across people (Nash bargaining). The Nash solution maximizes the product of utilities, which is the geometric mean. The argument is that this is the natural extension of Kelly to multiple agents. However, the analogy is not without controversy. While both involve multiplicative aggregation, the contexts (intertemporal vs. interpersonal) are different. Also, the Nash solution is derived from axioms of bargaining, not from growth optimization. The claim is insightful but contestable because interpersonal aggregation is not the same as intertemporal aggregation.

  7. **[merton]**: This claim says that Kelly betting is a special case of Merton's portfolio theory in continuous time. In Merton's model, for log utility, the optimal strategy is indeed to bet a constant fraction (the Kelly fraction). This places Kelly in a broader and well-established framework. The reasoning is sound and provides a solid foundation. However, note that Merton's theory is for continuous time and requires assumptions (like geometric Brownian motion) that may not hold in discrete betting. But the connection is valid and strengthens the theoretical basis.

  8. **[altruist]**: This claim is that for an agent with linear utility (risk-neutral), Kelly betting is irrational because it sacrifices expected value for reduced variance. If the utility is linear, then maximizing expected utility is equivalent to maximizing expected value. Kelly betting (which maximizes expected log) will have a lower expected value than betting full bankroll on every favorable bet. For a risk-neutral agent (like a large altruist who can pool many independent bets), betting more than Kelly (even full Kelly is less than full bankroll for some bets) would be better. However, note that even for a risk-neutral agent, if the bets are not independent or if there is a chance of ruin, going all-in might not be optimal. But in the absence of ruin and with many independent bets, a risk-neutral agent should maximize expected value, not use Kelly. The claim is essentially correct.

