  First, I need to understand the counterfactual mugging thought experiment. Omega flips a fair coin. If tails, Omega asks for $100. If heads, Omega pays $10,000 but only if it predicted you would pay $100 if it had been tails. The coin came up tails, and Omega is asking for the $100. You have to decide whether to pay.

  Mara says not to pay because it's a certain loss with no gain since the heads branch isn't happening.

  Julian says that before the coin flip, the policy of paying has higher expected value because if you commit to paying, you get $10,000 if heads, and lose $100 if tails, so expected value is (0.5 * 10000) + (0.5 * -100) = 5000 - 50 = $4950. If you don't pay, you get $0 if heads and $0 if tails, so expected value $0. So paying is better before the flip.

  Mara counters that after knowing it's tails, you should update and not stick to the plan, as that would be irrational.

  Julian responds that updating is problematic here because the outcome depends on your disposition to update. Specifically, if you update and refuse, you're the type who wouldn't have gotten the money in the heads case anyway.

  Now, I need to adjudicate each move with a score from -2 to 2.

