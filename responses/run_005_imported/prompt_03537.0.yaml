  Move 4: Julian answers that updating is only harmless when the information is independent of your disposition, and here it's not. An agent who updates fares worse systematically.

  This is key. In Newcomb's problem, causal decision theory (CDT) says to take both boxes, but that leads to getting less money because Omega predicts you would do that. Similarly, here, if you update and refuse when tails, you're the type who would refuse, so in heads world, you get nothing.

  Whereas if you don't update and pay anyway, you're the type who pays, so in heads world, you get $10,000.

  So, the agent who follows the policy without updating does better.

  In updateless decision theory (UDT), the idea is to choose a policy that maximizes expected utility from the prior perspective, without updating on information that is "about" your decision.

  Here, the information that it's tails is information that affects what action is called for, but since Omega's prediction is based on your response to that information, updating can be self-defeating.

