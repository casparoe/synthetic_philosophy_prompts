  For the setting: A modern zoning fight is perfect. It's materially complex (traffic models, environmental impact studies) yet normatively charged (gentrification, equity), so both thinkers can shine. Lippmann would pounce on the technical overload; Dewey would spotlight the community's right to self-define. 

