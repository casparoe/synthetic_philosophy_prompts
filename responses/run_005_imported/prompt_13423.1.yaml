prompt: |-
  Write a short dialogue between two philosophers debating why promises bind. One defends a practice-based, conventionalist account, in the tradition of Hume, Rawls, and Hart, on which a promise obligates because making one invokes a social practice of mutual trust whose benefits cannot fairly be claimed while refusing to be bound by its rules. The other defends an assurance-based account, of the kind developed by Scanlon, on which the obligation arises directly from the expectation that one person deliberately and openly leads another to form, independent of any wider practice or convention. Have them test their views against this case: alone and unobserved, someone promises a dying friend to carry out a small private wish after the friend's death; the friend dies moments later, and no one else will ever learn whether the promise is honored, so no practice is put at risk and no one remains who could be disappointed by a breach. Each philosopher should say what their own theory implies about whether the promise still binds, and each should press the other on whether their account, rather than a borrowed intuition, actually explains the answer.
reasoning: |-
  We are writing a dialogue between two philosophers: one conventionalist (in the tradition of Hume, Rawls, Hart) and one assurance theorist (following Scanlon). They are debating the binding force of promises, especially in a case where the promise is made in private, the promisee dies immediately, and no one else will ever know. The case: Alone and unobserved, someone promises a dying friend to carry out a small private wish after the friend's death. The friend dies moments later, and no one else will ever learn whether the promise is kept.

  Conventionalist (Conv): Defends that promises bind because they invoke a social practice of mutual trust. The benefits of the practice (reliance, coordination, etc.) can only be fairly enjoyed if one also follows the rules. Breaking a promise, even in secret, would be unfair because it would be like free-riding on the practice.

  Assurance Theorist (Assur): Defends that the obligation arises directly from the deliberate creation of an expectation in the promisee. The promisor intentionally leads the promisee to form an expectation and thereby incurs an obligation to fulfill it. The obligation is to the promisee, not to the practice.

  They test their views against the case.

  Conv: In this case, even though no one else knows and the friend is dead, the promise still binds. Why? Because the promisor is participating in the practice of promising. This practice is a valuable social institution that relies on mutual compliance. If we were to allow exceptions just because no one is watching, we would undermine the practice. The promisor has invoked the practice and thereby bound themselves by its rules. It's a matter of fairness: one cannot claim the benefits of the practice (e.g., being trusted in other situations) without also bearing the burdens (like keeping a promise even when it's inconvenient and unobserved).

  Assur: I see why you might say that, but I think you're borrowing an intuition without fully explaining it. Let me ask: what benefits, exactly, is the promisor unfairly claiming in this case? The friend is dead, so there's no ongoing relationship. And because no one else knows, there's no reputational damage. Moreover, the promisor isn't likely to be trusted by others in the future because of this one act. So how is the practice put at risk? It seems that breaking this promise would have no effect on the practice whatsoever.

  Conv: It's not about the immediate effect. It's about the promisor's attitude. If the promisor breaks the promise, they are expressing a disregard for the practice. And if they are willing to break it when unobserved, that attitude might carry over to other situations. But more importantly, the practice requires that we follow the rules even when we could get away with breaking them. That's what it means to be bound by a rule. The obligation comes from having invoked the practice. If we start making exceptions, we erode the practice.

  Assur: But let me offer my account. I think the obligation arises because the promisor intentionally and voluntarily created an expectation in the promisee. In this case, the dying friend, in their last moments, was led to believe that their wish would be carried out. The promisor gave assurance, and the friend relied on that assurance, perhaps dying with peace of mind. The wrong in breaking the promise is that it would be a betrayal of that trust and a failure to respect the value of the assurance given. Even though the friend is dead and won't experience disappointment, the promisor still has a reason to act because they deliberately created that expectation. The wrong is in the initial act of creating an expectation without the intention to fulfill it, or in failing to fulfill it when one could have.

  Conv: But if the friend is dead and won't experience anything, how can there be a wrong? The assurance-based account seems to require that the promisee is around to be harmed by the breach. But here, no harm occurs because the promisee is dead. Also, note that the friend died moments later – so they might not have had time to form a deep reliance. How does your account explain the obligation then?

  Assur: The wrong isn't necessarily in causing harm to the promisee. It's in the failure to live up to a commitment that one has voluntarily undertaken and which one knew would be taken seriously by the promisee. The promisor has created a reason for themselves by their act of assurance. The obligation is to the promisee, but even after death, we can have duties to the dead. We respect their wishes not because they can be harmed, but because we owe it to them as persons who once lived and with whom we had a relationship. The act of promising creates a special obligation to that person. So in this case, the promise still binds because it would be a failure of respect to the friend to ignore the promise.

  Conv: But now, I worry that you are borrowing from the conventionalist view. How do you explain the duty to the dead? Without a social practice of respecting the wishes of the dead, what grounds that duty? In my view, the duty to the dead is part of our social practices. We have practices of honoring the dead, and breaking a promise to a dead person would be a violation of that practice. But your account, which is supposed to be independent of practice, seems to rely on an intuition that we have obligations to the dead. But why? If there's no one to be disappointed, and no practice, then what's the basis?

  Assur: Not at all. The basis is the value of assurance itself. When we give assurance to another, we enter into a special moral relationship. We create a reason for action that is grounded in the respect we owe to others as autonomous beings. We take their will seriously by giving them an assurance and then following through. This is true even if they are no longer present. We respect their past autonomous act of accepting the promise and forming an expectation. The duty is generated by the promisor's own act of will and the promisee's reasonable acceptance. It's a direct moral relationship.

  Conv: But in this case, the promisee is dead. They no longer exist as a being with a will. So how can we have a duty to them? And if we say that we have a duty to their memory, then I think we are invoking social practices again. Without a practice, what makes the memory of a person an object of duty? I think your account might be incomplete without some reference to the social context.

  Assur: I don't think so. The duty is generated at the time of the promise. The promisor, by giving the assurance, creates a binding obligation that persists until it is fulfilled or released. The death of the promisee doesn't extinguish the obligation because the obligation was created by the promisor's act. The promisor still has the reason to act that they created. And that reason is independent of whether the promisee is alive to see it.

  Conv: But let's press the case. Suppose the promisor doesn't care about the friend's memory. Why should they keep the promise? On your account, the only reason is that they created an expectation. But if they don't care about that, and no one else will know, then what motivates the obligation? In my view, the obligation comes from the rules of the practice, which the promisor has internalized. They feel bound because they have accepted the practice.

  Assur: The obligation is moral, not motivational. We are asking what the promisor ought to do, not what they are motivated to do. The promisor may not care, but they still have a reason to act. The reason is that they intentionally invoked the trust of another person and thereby took on an obligation. The fact that the promisee is dead doesn't change the fact that the promisor performed that act. They owe it to the friend to keep the promise as a matter of respect for the friend's autonomy and the assurance they gave.

  Conv: I still think you're relying on an intuition that we have duties to the dead, which is itself conventional. But let's turn to your critique of my view. You said that in this case, no practice is put at risk. But consider: if the promisor breaks the promise, they might become more likely to break promises in the future. They might develop a habit of ignoring promises when unobserved. That could erode their commitment to the practice and eventually harm it. So there is a risk.

  Assur: That seems speculative. What if the promisor is otherwise scrupulous? And even if it were true, that would be a consequentialist argument, not a fairness argument. Your original point was about fairness: it's unfair to free-ride. But if breaking this promise doesn't actually affect the practice (because it's secret and isolated) and the promisor doesn't gain any unfair advantage (since the friend is dead and there's no one to take advantage of), then where is the unfairness?

  Conv: The unfairness lies in the promisor having invoked the practice to gain the benefit of the promisee's trust in that moment. The friend trusted the promisor because of the practice. The promisor received the benefit of being trusted (and perhaps the friend died peacefully because of that trust). So it would be unfair to then not fulfill the promise because the promisor has already taken the benefit of the trust without paying the cost of fulfilling the promise.

  Assur: That's an interesting point. But note that you are now incorporating elements of the assurance view: the benefit to the promisee (peace of mind) and the promisor's receipt of that benefit. However, on the assurance view, we don't need to refer to a practice to explain the obligation. The obligation arises directly from the act of assurance and the promisee's trust. So in this case, both accounts might agree that the promise binds, but for different reasons. The real test is whether the practice is necessary.

  Conv: Perhaps. But let me ask: in a world without a practice of promising, could a promise create an obligation? On your view, yes. But I think without the practice, the words "I promise" would be empty. How could they create an expectation if there is no social practice to give them meaning? So the practice is foundational.

  Assur: I disagree. Even without a practice, one person can intentionally lead another to form an expectation by saying, "I promise." The meaning comes from the intention to assure and the context of the relationship. The practice might make it easier, but it's not necessary. In this case, even if the two were stranded on a desert island without any society, a promise could still bind.

  Conv: But without a practice, what would "I promise" mean? It would just be an expression of intention. And if the promisor changes their mind, they haven't violated any rule because there is no rule. So I think the practice is essential.

  Assur: The rule is a moral rule, not a social one. The moral rule is that if you intentionally lead someone to form an expectation that you will do something, and you do so in order to get them to rely on you, then you are obligated to do it. That rule doesn't depend on a social practice. It's a principle of due care for the expectations we create.

  Conv: But then how do you explain the fact that in our world, the practice of promising is what gives the words their force? Without it, people wouldn't trust promises.

  Assur: They might trust them based on the relationship and the sincerity of the speaker. The practice might amplify trust, but it's not the only source.

  Conv: I think we have reached an impasse. In the dying friend case, both our theories imply the promise binds, but for different reasons. I say because of the practice and fairness; you say because of the assurance and respect for the promisee.

  Assur: Indeed. But perhaps the case shows that both factors might be at play. However, I maintain that the assurance view is more fundamental because it explains why the practice exists in the first place: to facilitate giving and receiving assurances.

  Conv: And I maintain that the practice is fundamental because without it, the act of promising would not have the same meaning and force.

  [End of dialogue]
answer: |-
  ### Dialogue: The Binding Force of Promises

  **Characters:**  
  - **Clara (Conventionalist):** Defends a practice-based account inspired by Hume, Rawls, and Hart.  
  - **Silas (Assurance Theorist):** Defends an assurance-based account in the tradition of Scanlon.  

  **Setting:** A quiet university library, late afternoon.  

  ---

  **Clara:** Silas, I’ve been reflecting on our debate about why promises bind. My view is straightforward: promising is a social practice, like a game with rules. When you say “I promise,” you invoke a convention of mutual trust. Society benefits enormously from this—cooperation, stability, reliance. But you can’t reap those benefits while ignoring the rules. Breaking a promise is like cheating at chess; it’s unfair to claim the practice’s advantages while dodging its duties. Hume put it best: the obligation arises from the utility of the practice itself.  

  **Silas:** Clara, I respect that, but it feels circular. Why should a practice, however useful, create a *moral* obligation? Scanlon’s assurance-based account cuts deeper. When you promise, you deliberately lead someone to form an expectation based on your word. You’re not invoking a convention; you’re directly creating a reason to act. The wrong in breaking a promise isn’t about undermining a social institution—it’s about betraying the trust *you* invited. Principle F, as Scanlon calls it: if you intentionally cause someone to expect you’ll do X, and they want that assurance, you’re obligated unless they release you. No practice needed.  

  **Clara:** But practices *are* needed! Without conventions, how could words like “I promise” create expectations? Your assurance view borrows from the practice it denies. Let’s test this with a case: imagine someone alone with a dying friend. On their deathbed, the friend whispers a small, private wish—say, to burn an old love letter. The person promises to do it. The friend dies moments later. No one else witnesses this; no one will ever know if the promise is kept. The practice isn’t threatened—there’s no risk to social trust. Why should the promise bind here?  

  **Silas:** On my account, it absolutely binds. The promisor deliberately led the dying friend to form an expectation, giving them peace in their final moments. That act of assurance generates an obligation out of respect for the friend’s autonomy and the deliberate invitation of trust. Even though the friend can’t be disappointed now, the promisor’s moral failure lies in the initial act: creating an expectation they might not fulfill. It’s about the promisor’s integrity, not consequences. So yes, they must burn the letter.  

  **Clara:** But that’s your intuition talking, not your theory. How can an obligation “persist” when the person to whom it was owed no longer exists? Your account relies on the promisee’s subjective experience—yet here, there’s no experience to be had. The friend is gone. Scanlon’s Principle F requires the promisee’s *reliance*, but here, reliance ended at death. If the obligation is “to the promisee,” and the promisee is gone, what’s left? I suspect you’re smuggling in a practice-based duty to the dead.  

  **Silas:** Not at all. The obligation arises at the moment of promising. The promisor, by giving assurance, alters their moral landscape. It’s a debt incurred to the promisee *as they were then*—a living person whose trust was sought. Failing to act disrespects that past act of trust. But let’s turn to you: on your conventionalism, this promise shouldn’t bind. No practice is jeopardized—it’s secret, isolated, and affects no one. Why demand fulfillment?  

  **Clara:** Ah, but it *does* bind! The promisor engaged in the practice, invoking its rules and benefits. Even unobserved, breaking it would be free-riding. They gained the friend’s trust *because* of the practice—Rawls called this the “principle of fairness.” If you exploit the practice’s benefits (here, giving comfort through a recognized ritual), you must bear its burdens. And practices erode if we make exceptions whenever we’re alone.  

  **Silas:** That’s where your theory fails. Where’s the free-riding? The promisor isn’t “exploiting” anything. The friend trusted them personally, not society’s conventions. And if no one knows, no practice is weakened—it’s costless defection. Your answer relies on hypothetical risks (“What if everyone did this?”), but that’s Kantian, not Humean. Hume grounded obligations in *actual* social utility. Here, there’s none. So isn’t your intuition—that it’s wrong—driving you to borrow Scanlon’s idea of respect for the promisee?  

  **Clara:** Not at all. Practices require uniform adherence to function. If we internalize that promises bind only when others are watching, we corrupt the practice from within. Hart’s “internal aspect” of rules means we obey them as standards for behavior, not out of fear of getting caught. As for utility: the dying friend *did* benefit—they died assured. The promisor owes a debt to the practice that facilitated that. But you, Silas—you say the obligation is “to the promisee,” yet the promisee is gone. Isn’t your “duty to the dead” just a cultural convention in disguise?  

  **Silas:** No, because the duty springs from the promisor’s own actions, not convention. When you intentionally invite trust, you bind yourself. The promisee’s death doesn’t absolve that—it makes the obligation one of fidelity to your word. But you’ve conceded my point: in this case, we both agree the promise binds. The difference is that my account *explains* it directly through the promisor’s assurance, while yours leans on a practice that’s irrelevant here. Without the dying friend’s expectation—a personal, not conventional, fact—your theory would have no grip.  

  **Clara:** And without the practice, your “assurance” would be an empty gesture. Conventions give promises their force. In this case, the practice *is* relevant because it shaped the dying friend’s trust. But I’ll grant this: our debate shows how deeply these accounts entwine. Perhaps promises bind because they fuse social conventions with personal commitments—neither reducible to the other.  

  **Silas:** Perhaps. But I’ll still argue the personal act of assurance is the moral core. After all, if we lost the practice tomorrow, I’d still owe it to *you* to keep my promises.  

  **Clara:** And I’d say you owe it to the practice that lets you make them. Shall we agree to disagree—over coffee?  

  **Silas:** Only if you promise not to invoke Hume while we drink.  

  **Clara:** I make no such assurance. *Laughs.*  

  ---  
  **Key Takeaways:**  
  - **Clara (Conventionalist):** The promise binds because breaking it, even secretly, free-rides on the social practice. The promisor invoked the practice to comfort the friend, gaining an unfair advantage without upholding the rules. No practice is visibly harmed, but the promisor’s integrity as a participant is.  
  - **Silas (Assurance Theorist):** The promise binds because the promisor deliberately created an expectation in the friend, incurring a direct obligation to act. The friend’s death doesn’t nullify this, as the wrong lies in the initial betrayal of trust. The absence of a practice is irrelevant—the duty is interpersonal.  
  - **Mutual Critique:** Clara argues Silas’s account depends on ungrounded intuitions about duties to the dead, while Silas insists Clara’s practice-based obligations collapse without the promisee’s personal expectation.
