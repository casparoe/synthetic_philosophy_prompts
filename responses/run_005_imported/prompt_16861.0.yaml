  ## Steering Committee Decision Memo: Solidarity Fund Equity Review & Task Force Establishment  

  **To:** Steering Committee Members  
  **From:** [Your Name], PhD Candidate, Political Theory  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on Proposed Outside Earnings Levy & Path Forward for Solidarity  

  ### I. Core Conflict & Recommendation
  We face a tension between our solidarity principle ("equal support for equal membership") and the market-driven disparity in members' summer earning potential. The proposed 10% levy on outside earnings over $5k seeks to mitigate this disparity but risks undermining core union values of voluntary solidarity and rewarding skill development. **After weighing both positions, I recommend we DO NOT implement the levy at this time. Instead, we establish a time-bound Solidarity Equity Task Force to develop concrete, sustainable solutions by the end of this academic term.**  

  ### II. Engaging the Pro-Levy Argument (Without Conceding)  
  The pro-levy faction rightly identifies a **crisis of solidarity legitimacy**:  
  * **The "Same Boat" Fiction:** When CS/Stats members earn $30k+ while Classics members earn $0 using *union-won summer stipend protection*, the fund’s "equal support" model feels hollow. This isn't just inequality; it’s inequality *enabled by the union's own hard-won protections*.  
  * **Solidarity as Reciprocity:** True solidarity requires mutual support. If high-earners benefit disproportionately from the union's existence (protected stipends, healthcare, grievance procedures) while contributing no *extra* support to members locked out of those opportunities, it becomes extractive.  
  * **The Chamberlain Trap:** Nozick’s argument assumes a just starting point. Our starting point – PhD programs with wildly unequal market power – is *structurally unjust*. Letting this compound *within* our union risks fracturing us along disciplinary lines.  

  **Your strongest argument deserves this challenge:** A flat levy is administratively complex, potentially punitive, and may discourage members from seeking valuable professional development. Does taxing individual success address the *root cause* (disciplinary inequity), or merely paper over it? Could it breed resentment and reduce overall engagement, *weakening* solidarity long-term?  

  ### III. Engaging the Anti-Levy Argument (Without Conceding)  
  The anti-levy faction powerfully defends **autonomy and merit**:  
  * **The Value of Skill:** CS/Stats earnings reflect specific, hard-won skills meeting market demand. Taxing this is a penalty for employability, discouraging skill acquisition that benefits the *entire university* (and union) through research and teaching.  
  * **Voluntary Solidarity vs. Coercion:** True solidarity must be freely given. Mandatory redistribution beyond dues transforms the union from a collective bargain into an *enforcer of economic equality*, alienating members who joined for mutual workplace defense, not income redistribution.  
  * **Slippery Slope:** Where does this end? Should stipends for prestigious fellowships also be taxed? Do we penalize members with wealthy partners? This path risks endless policing of members' personal finances.  

  **Your strongest argument deserves this challenge:** Ignoring the dramatic wealth gap enabled *by union protections* undermines the "common struggle" narrative. Can "we're all equal" survive when some members leverage union wins to build massive private wealth while others struggle, *especially* when those disparities map onto existing hierarchies (STEM vs. Humanities)? Does "autonomy" absolve us of responsibility when our collective action *enables* extreme individual inequality?  

  ### IV. Recommended Path: The Solidarity Equity Task Force  
  The levy proposal, while highlighting a real problem, is a blunt instrument that risks internal division and administrative burdens. Conversely, doing nothing erodes solidarity’s moral foundation. We need a **structural solution, not a tax band-aid**.  

  1.  **Establish a Solidarity Equity Task Force (SETF):**  
      *   **Composition:** 6 members (2 pro-levy, 2 anti-levy, 2 neutral/other disciplines). Chaired by a rotating facilitator.  
      *   **Mandate:**  
          *   Quantify the earnings disparity and its impact on members' financial security & union cohesion (survey, anonymized data).  
          *   Explore *non-punitive*, *sustainable* mechanisms to enhance solidarity:  
              *   **Expanded Fund Uses:** Could childcare/travel funds be *increased* specifically for demonstrably lower-earning disciplines?  
              *   **Skill Solidarity:** Union-facilitated workshops (CS for non-CS, stats help for humanities research, grant writing for all) to *build* cross-disciplinary earning power.  
              *   **Employer Engagement:** Can the union negotiate *pro bono* industry projects for humanities students using skills like critical analysis, writing, or project management?  
              *   **Voluntary Contribution Tiers:** A *visible*, *celebrated* system for high-earners to voluntarily contribute more to the solidarity fund, fostering *earned* solidarity.  
          *   Assess feasibility, cost, and union capacity for each option.  
      *   **Timeline:** Interim report by Dec 1st. Final recommendations with concrete proposals for vote by Feb 1st.  

  2.  **Immediate Symbolic Action:**  
      *   **Steering Committee Pledge:** Members voluntarily contribute 1% of significant summer earnings (over $20k) *this year only* to the solidarity fund as a gesture of goodwill during the review. (Leads by example without coercion).  

  ### V. Why This Path?  
  *   **Addresses the Core:** It tackles the *structural inequity* (differential earning power) head-on, moving beyond just redistributing cash.  
  *   **Builds Unity:** Forces collaboration between factions on solutions. The process *is* solidarity-building.  
  *   **Practical & Sustainable:** Focuses on capacity-building and voluntary mechanisms where possible, avoiding divisive mandates.  
  *   **Preserves Autonomy:** Avoids compulsory levies while creating avenues for meaningful, chosen contribution.  
  *   **Deadline-Driven:** Prevents inaction. The Feb 1st vote forces resolution.  

  **We are not choosing between equality and freedom here. We are choosing whether to confront the messy reality that our solidarity structure isn't working for everyone *in practice*, and whether we have the collective will to design a better system.** The Task Force is the mechanism to do that work constructively. I urge a "Yes" vote on establishing the SETF with the mandate outlined.  

  **Vote:** [ ] YES - Establish Solidarity Equity Task Force / [ ] NO - Proceed to Levy Vote / [ ] ABSTAIN  

  ---  
  **This memo doesn't let either side rest easy.** Pro-Levy sees their core concern validated but their solution deferred for a potentially better one. Anti-Levy avoids a tax but must engage in building active solutions to a problem they can no longer ignore. The path forward demands work from everyone – which is what solidarity requires.
