  Wait, suppose there's a contingent truth P in our world. The property "being in a world where P is true" might be positive. By Axiom 4, positivity is necessary, so it's positive in all worlds. Then God, having all positive properties in every world, must have that property. So P is true in all worlds. Thus, contingent truths can't exist. That seems like the gist. 

  Which axiom is the culprit? Probably Axiom 5, necessary existence, combined with Definition 2 and 3. If God's essence includes all positive properties and necessary existence forces instantiation in all worlds, then all positive properties are exemplified everywhere. Since every property or its negation is positive (Axiom 1), every truth is necessary. 

  Anderson and Pruss tried to modify the axioms, like splitting positive properties into different types or restricting Axiom 2. But the user wants to know if any fix keeps Gödel's spirit. Anderson's 1990 approach where only "non-trivial" properties count might help, but it's complex. Koons suggests essentiality independence, but that might weaken the argument. 

