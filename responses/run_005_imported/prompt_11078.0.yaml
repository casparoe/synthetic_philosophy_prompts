  Hmm... The challenge is balancing historical accuracy with philosophical interpretation. Wallis did dismantle Hobbes mathematically, but the user senses (rightly) that Hobbes wasn't just being dense. I recall his "De Corpore" where he fuses epistemology with political theory via geometry. The maker's knowledge doctrine is crucial: for Hobbes, we only truly know what we build, whether a triangle or a state. That's why generative definitions matter—they're blueprints for mental construction. 

  But how does this justify his circle-squaring crusade? Ah—if geometry's certainty comes from our constructive acts, admitting error in his "constructions" would undermine his entire epistemology. It wasn't just about circles; it was about defending the method that grounded his political science. Still, he wasn't coherent: he kept shifting solutions because deep down, he might have sensed Wallis was right mathematically, but couldn't concede without collapsing his system. 

  The user also wants honesty: is this too charitable? Well, Hobbes did call Wallis "a slaughterman of geometry" and ranted about "Oxford drones." Pride was absolutely a factor. But his philosophical commitments amplified it. Maybe compare it to a machinist refusing to believe their custom gauge is flawed because their entire measurement system depends on it? 

