prompt: |-
  ok so this has been bugging me since basically last weekend. my friends and i got into this whole debate about whether its actually legit to say a movie or album is "good" just because a critic said so, or it has like a 95 on rotten tomatoes, without you ever actually watching/listening to it yourself. like my friend fully reccomends books she hasn't even read based purely on goodreads ratings and insists that still counts as her having a real opinion on whether its good. it felt off to me but i couldn't rly explain why.

  then this week in TOK (i'm doing IB, we're on the Arts and Ethics areas of knowledge rn) my teacher brought up basically the same weirdness but for right and wrong — like if a little kid believes stealing is wrong purely bc a parent told them so, with zero understanding of why, most people feel like that's missing something even tho the belief itself is true. so now i'm stuck comparing these two in my head: is the reason we're suspicious of just taking someone's word for whether a piece of art is good the SAME reason we're suspicious of just taking someone's word for whether an action is right or wrong, or are these actually two different problems that just look similar from the outside? and out of the two, which one (if either) is more defensible to take purely on trust — can you actually make a case for one being fine while the other isn't, or are they both equally sus? me and my friends could not agree on this at all so figured i'd ask someone who actually knows this stuff instead.
