  ### Key Errors Explained (For Defense)

  1.  **Woodward's Asymmetry (Minor):** While mentioning interventions isolate C is correct, the answer misses *why* this implies directionality. Woodward relies on the asymmetry built into causal models (variables ordered by direct influence) and interventions being defined to respect modularity (changing C doesn't alter equations determining other variables *except* via C's effects). The asymmetry comes from the structure of the model itself.
  2.  **Woodward on the Rock Case (Major):** This is the critical failure.
      *   **Error:** Claiming Woodward just asks "What if Ann hadn't thrown?" identically to Lewis and gets the same "no cause" answer.
