answer: |-
  That's an excellent question about a genuinely tricky passage in Locke. You've nailed the apparent tension: rejecting innate ideas, grounding virtue in reason and divine duty, yet building moral education on reputation—an external, social motivator. Let's break down why this isn't necessarily sloppy but reflects Locke's pragmatic developmental psychology and educational strategy:

  1.  **Developmental Realism:** Locke is acutely aware of the child's cognitive limitations. He doesn't believe children possess the capacity for the complex, abstract reasoning required to grasp "the knowledge of a man's duty, and the satisfaction it is to obey his maker... with the hopes of acceptation and reward" *from the outset*. Reason develops gradually.
  2.  **The Bridge Function of Reputation:** This is where "comes nearest to it" does the heavy lifting. Locke argues that *while reputation isn't virtue itself*, it's the best *available proxy* for the young mind because:
      *   **It's Socially Validated Reason:** Reputation is "the testimony and applause that other people's reason, as it were by a common consent, gives to virtuous and well-order'd actions." Essentially, it's the *collective reasoned judgment* of the community distilled into social approval/disapproval. The child experiences the *consequences* of virtue/vice (praise/shame) without needing to fully grasp the underlying rational or theological principles.
      *   **It's Concrete & Motivational:** Children understand immediate, tangible rewards and punishments (praise, esteem, blame, disgrace) long before they grasp abstract duty or eternal rewards. Reputation provides a powerful, immediate, and understandable motive to *act virtuously*.
      *   **It Points Towards True Virtue:** Because (ideally) this social approval is based *on* the community's collective reason recognizing virtuous actions, acting for reputation *tends* to align with acting virtuously. It habituates the child *into* virtuous patterns of behavior, creating the foundation upon which later rational understanding can be built. It's training wheels for morality.
  3.  **The Goal is Still Internalized Reason & Duty:** Locke is crystal clear: reputation is a *means*, not the *end*. It's "the proper guide and encouragement of children, *'till they grow able to judge for themselves*." The entire purpose of using reputation is to shepherd the child towards the point where their *own* reason can discern duty and their understanding of divine will provides the ultimate motivation ("the satisfaction... to obey his maker"). Reputation gets them started on the path and keeps them moving until they can navigate by their own internal compass.
  4.  **Compatibility with Empiricism:** This fits Locke's epistemology. Children *experience* the social consequences of their actions (praise, blame) long before they can reason abstractly about duty. This experiential learning (how actions lead to social outcomes) *is* part of building the foundation of knowledge from experience. The "reason" embedded in reputation is the reason of *others*, experienced socially by the child. It's an external source of guidance based on collective experience and reason, which the child internalizes over time.

  **Addressing the Tension:**

  *   **Not Contradiction, but Staged Development:** The tension dissolves when seen as a developmental progression, not a static contradiction. Locke isn't saying reputation *is* virtue for children; he's saying it's the most effective tool *to cultivate the habits and inclinations* that will later be understood and motivated by true virtue when reason matures. It's scaffolding.
  *   **Practical Necessity:** Locke is deeply pragmatic. He needs an effective motivator *now* for beings who aren't yet rational agents. Innate ideas are rejected, but the *capacity* for reason is innate. Reputation leverages the child's existing social awareness and desire for approval to foster behavior aligned with the reason they will eventually develop.

  **The "Proxy Motive" Move & Its Name:**

  *   **In Locke's Educational Theory:** This is central to his method. He consistently advocates using immediate, understandable motivators appropriate to the child's developmental stage (e.g., esteem/disgrace, the natural consequences of actions) rather than abstract threats or physical punishment. The shift from external motivators (reputation, parental approval) to internal motivators (reason, duty, divine will) is the core trajectory of his moral education.
  *   **In Moral Philosophy More Generally:**
      *   **Moral Development Theory:** This aligns strongly with later theories like Lawrence Kohlberg's stages, where early morality is based on external approval/consequences ("conventional" stage) before progressing to internalized principles ("post-conventional" stage). Locke is outlining a similar path centuries earlier.
      *   **Scaffolding:** This is a modern educational term (from Vygotsky) meaning providing temporary support structures that are gradually removed as the learner gains competence. Reputation acts as moral scaffolding.
      *   **Heuristic/Propaedeutic:** Reputation serves as a practical guide (heuristic) or preparatory training (propaedeutic) for true virtue.
      *   **Virtue Ethics Connection:** Locke's approach has echoes of Aristotelian habituation. Children are trained *in* virtuous actions via external motivators (reputation serving a similar function to Aristotle's emphasis on praise/blame and the role of the community/polis) so that the virtues become ingrained habits. Later, the phronimos (practically wise person) acts for the sake of the noble/virtue itself – analogous to Locke's person acting from knowledge of duty and divine will. The external motivation fosters the internal disposition.
      *   **Pedagogical Pragmatism:** It's simply a recognition that effective education must meet the learner where they are, using tools they can understand, to lead them towards a higher goal.

  **Conclusion:**

  Locke isn't being sloppy. He's being a pragmatic developmental psychologist and educator. He firmly believes true virtue rests on individual reason aligned with divine duty. However, he recognizes that children lack the rational capacity for this initially. Reputation, as the socially validated product of *others'* reason applied to behavior, provides the most effective, concrete, and developmentally appropriate motivator to guide children towards virtuous *actions* and *habits*. This creates the behavioral foundation and disposition necessary for them to later grasp the *reasons* for virtue through their own developed reason. The "swap" isn't a contradiction; it's the carefully staged plan of his educational project. The move is best described as **developmental moral scaffolding** or **pedagogical habituation**, using an **external heuristic** (reputation) to build towards **internalized rational principle**.
