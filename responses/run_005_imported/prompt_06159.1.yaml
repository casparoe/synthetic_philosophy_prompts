prompt: |-
  I'm on my company's internal conduct review committee. We meet Monday to decide whether to discipline an employee who's been padding his expense reports for a couple years — evidence is solid, he's basically admitted it. But while pulling records for the case, someone found an old email thread showing the VP who's pushed hardest for firing him did the exact same thing himself years ago, before current leadership, and just got quietly moved to another team with no formal writeup at all. Committee's split: some people think that old stuff is irrelevant to what the employee did and shouldn't factor into our decision at all, others think the VP driving this case having done the same thing changes something procedurally, even if it doesn't excuse the employee. Can you draft the memo I'd bring to Monday's meeting recommending what we actually do — the outcome for the employee, and whether/how the VPs history should matter here. Don't just settle it with 'two wrongs don't make a right,' actually engage with why the hypocrisy might matter even though it obviously doesn't make the padding okay.
