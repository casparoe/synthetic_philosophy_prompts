prompt: |-
  Okay so this has been stuck in my head since Thanksgiving and none of my friends want to keep talking about it with me lol. It started as an argument with my older brother, who's really proud of being "the disciplined one" in the family — up at 5am every day, never misses the gym, built his own contracting business out of nothing, and is pretty judgemental of people who "just don't have the willpower" to do the same. I pushed back and said he didn't choose to be the kind of person who finds discipline easy, thats just how he ended up between genetics and how our parents raised him. He said fine, maybe, but he still CHOSE to actually get up and use that discipline every single morning, and that choice is on him, nobody forced his hand. But then it hit me — okay, but that choice to get up on any given morning also came from whatever kind of person he happened to be in that exact moment, which again isn't something he picked either. And if you keep tracing it back like that, you never actually arrive at a point where he just spontaneously willed himself into existence, independent of everything that came before it. So how can he, or honestly anyone, really take credit for anything they do, or get blamed for anything either?

  The part that really threw me was when he said "well nothing's fully set in stone anyway, there's randomness down at the level of the brain, quantum stuff, so there's room for genuinely free choices somewhere in there." Something about that felt like a cheap escape hatch, but I couldn't actually explain why adding randomness to the mix would make him any more the "author" of his choices than if everything just ran on strict cause and effect. If anything a random brain blip seems like an even worse thing to hang credit or blame on than a fully caused one. Am I missing something obvious here, or is my brother just smuggling in a feeling of control that isn't really justified? I've got zero background in this kind of thing, I just can't let it go, so i'd love an actual walk-through of the logic instead of the usual "eh it's complicated" shrug people give me.
