answer: |-
  Your suspicion is well-founded, and the distinction highlighted by Jarrett and Shimony is crucial for a nuanced understanding of Bell's theorem and its implications for relativity. I'll argue that quantum mechanics (QM) violates **outcome independence (OI)** while respecting **parameter independence (PI)**, and that this *specific* violation is why QM achieves "peaceful coexistence" with special relativity (SR), despite Maudlin's valid ontological concerns. I'll engage directly with his objection.

  ### 1. **The Jarrett-Shimony Decomposition**
  Bell's factorizability condition for a local hidden variable (LHV) theory is:
  \[
  P(A, B | a, b, \lambda) = P(A | a, \lambda) \cdot P(B | b, \lambda)
  \]
  Jarrett and Shimony decomposed this into two logically independent conditions:
  - **Parameter Independence (PI)**: The probability of an outcome at one wing is independent of the *setting* at the other wing:
    \[
    P(A | a, b, \lambda) = P(A | a, \lambda), \quad P(B | a, b, \lambda) = P(B | b, \lambda)
    \]
  - **Outcome Independence (OI)**: The probability of an outcome at one wing is independent of the *outcome* at the other wing, given the settings and \(\lambda\):
    \[
    P(A | a, b, B, \lambda) = P(A | a, b, \lambda), \quad P(B | a, b, A, \lambda) = P(B | a, b, \lambda)
    \]

  Violating **PI** would allow superluminal signalling: Alice could instantaneously influence Bob's outcome statistics by changing her setting \(a\).  
  Violating **OI** means outcomes are correlated even when \(\lambda\) is specified, but this alone *cannot* be used for signalling, as Bob's marginal probabilities \(P(B|b)\) remain unchanged by Alice's outcome.

  ---

  ### 2. **Quantum Mechanics Violates OI, Not PI**
  Consider a spin-singlet state \(|\Psi^-\rangle = \frac{1}{\sqrt{2}}(|\uparrow\downarrow\rangle - |\downarrow\uparrow\rangle)\):
  - **PI holds in QM**:  
    Bob's probability for \(B = +1\) (e.g., spin-up) depends *only* on his setting \(b\) and the state \(\lambda\) (the wavefunction). Alice's choice of \(a\) does not affect Bob's statistics:
    \[
    P(B=+1 | a, b, \lambda) = P(B=+1 | b, \lambda) = \sin^2(\theta_b / 2),
    \]
    where \(\theta_b\) is Bob's angle. Changing Alice's setting \(a\) leaves this unchanged.  
    *Operational consequence*: No experiment can detect a change in local outcome statistics by varying a distant setting → **no superluminal signalling**.

  - **OI is violated in QM**:  
    Given \(\lambda\) (the entangled state) and settings \(a, b\), Bob's outcome is *not* independent of Alice's outcome. If Alice measures \(A=+1\) along \(a\), Bob's state collapses to the eigenstate orthogonal to Alice's result. For example:
    \[
    P(B=-1 | a, b, A=+1, \lambda) = 1 \quad \text{if} \quad b = a, \quad \text{but} \quad P(B=-1 | a, b, \lambda) = 0.5.
    \]
    This correlation cannot be explained by \(\lambda\) alone → **violation of OI**.

  ---

  ### 3. **Peaceful Coexistence via No-Signalling**
  Shimony's "peaceful coexistence" arises because:
  - SR's core prohibition is against superluminal *causal influences* (signalling), as they would violate relativity's causal structure (e.g., enabling paradoxes like closed timelike curves).
  - QM violates only OI, not PI. Since PI ensures no-signalling, QM is **operationally compatible** with SR:  
    > *"The empirical predictions of QM cannot be used to transmit information faster than light."*  

  This is not a mere technicality—it shields SR from empirical contradiction. All experiments confirm no-signalling (e.g., no violation of the no-cloning theorem in entanglement), while violating Bell inequalities (i.e., violating OI).

  ---

  ### 4. **Engaging Maudlin's Objection**
  Maudlin argues that no-signalling is insufficient for true compatibility with SR because entangled systems exhibit:
  > *"A non-local common structure that produces correlations across spacelike separation, implying a reality not locally reducible to events in spacetime."*  
  *(Quantum Non-Locality and Relativity, 2011)*

  **Reply**:
  - **Maudlin is ontologically correct**: The violation of OI *does* imply a form of non-locality. QM's state is holistic: the wavefunction \(|\Psi^-\rangle\) is inherently non-separable, and measurement outcomes are not determined locally. This demands *some* non-local feature in any interpretation (e.g., Bohmian trajectories, GRW collapses, or Everettian branching).
    
  - **But this non-locality is not relativistic-violating**:  
    - **No conflict with SR's causal structure**: SR forbids superluminal *causation* (influences that enable signalling or define temporal order). QM's non-locality is **acausal**: it manifests only as irreducible correlations, not controllable influences.  
    - **No "common cause" in spacetime**: Bell's theorem rules out LHV theories, so no *local* structure in spacetime can explain the correlations. However, relativity only governs *causal interactions*, not correlations per se.  
    
  - **The operational-ontological distinction**:  
    - *Operationally* (what we measure): QM respects SR's no-signalling constraint.  
    - *Ontologically* (what exists): QM requires non-local resources (e.g., a universal wavefunction).  
    SR is agnostic about such resources—it constrains dynamics, not ontology. As long as dynamics (e.g., measurement outcomes) respect no-signalling, no *empirical* conflict arises.

  ---

  ### 5. **Why "Peaceful Coexistence" Holds**
  - **Relativity’s domain is causality, not correlation**: SR forbids superluminal *signals*, not superluminal *correlations*. Violating OI produces correlations that are "passive" and unexploitable for communication.  
  - **QM’s kinematics are non-local, but its dynamics are local**: The Schrödinger equation is local; non-locality enters via state preparation (entanglement) and measurement. Since measurements cannot be chosen to encode signals (due to PI), dynamics remain causally local.  
  - **Maudlin’s demand overreaches**: Requiring a "local common structure" ignores Bell’s lesson: such structures are empirically ruled out. The "common structure" is the non-local quantum state, which SR neither forbids nor accommodates—it simply lies outside SR’s original scope (which addresses *causal influences*, not ontology).

  ---

  ### Conclusion
  QM achieves peaceful coexistence with SR by violating **outcome independence** (enabling entangled correlations) while preserving **parameter independence** (preventing signalling). This operational compatibility shields SR from empirical contradiction. Maudlin is right that this requires a non-local ontology—but this is a philosophical challenge, not a physical conflict. The tension lies in reconciling QM's holism with relativistic *spacetime*, not its *causal structure*. As Shimony noted, this coexistence is "peaceful" because it avoids dynamical clashes, even if it leaves deep metaphysical questions unanswered. The next frontier is not locality, but how to situate quantum non-separability within relativistic spacetime.
