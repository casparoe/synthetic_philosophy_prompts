answer: |-
  ## The Humean Gambit: Can Laws Emerge from the Mosaic Without Losing Their Grip?

  The quest to understand the nature of laws of nature strikes at the heart of metaphysics and scientific explanation. David Lewis's Best System Analysis (BSA) offers a profoundly elegant and austere Humean vision: laws are not primitive imposers of order, but rather our best *summaries* of the vast, contingent pattern of particular events – the Humean mosaic. Lawhood supervenes entirely on this mosaic, conferred by membership in the deductive system achieving the optimal balance of simplicity, strength, and (for chances) fit. Yet, as your reading group wrestled with, this elegance comes at a cost. Can a system that merely *describes* the mosaic truly *explain* it, underwrite robust counterfactuals, or ground objective chances without smuggling in illicit necessity? Or does the very demand for these functions force us towards anti-Humean views like Armstrong's nomic necessitation between universals or Maudlin's primitive lawhood? Let us engage this controversy head-on.

  **The Anti-Humean Indictment: Where the BSA Falls Short**

  The anti-Humean critique is powerful because it targets the core Humean commitment: the denial of necessary connections between distinct existences and the supervenience of laws *entirely* on the particular mosaic. This, critics argue, renders the BSA incapable of fulfilling the core roles of laws:

  1.  **Explanatory Impotence (The Regress of Regularities):** Why does the mosaic exhibit the stunning regularities it does? Armstrong and Dretske argue the BSA offers only a *redescription*, not an explanation. Saying "It's a law that F=ma" within the BSA framework ultimately reduces to "The mosaic exhibits F=ma-like patterns, and saying so is very simple and informative." But *why* does the mosaic exhibit *this* pattern rather than another? The anti-Humean posits nomic necessitation (Armstrong/Dretske) or primitive lawhood (Maudlin) as the *ground* of the regularity, stopping the regress. For Maudlin, laws are *fundamental dynamical constraints* that *produce* the mosaic sequence. The BSA, by making lawhood derivative, seems to leave the regularity itself a colossal, inexplicable cosmic coincidence.
  2.  **Counterfactual Fragility:** Robust counterfactuals seem central to science: "Had the match been struck, it would have lit (assuming oxygen, dryness, etc.)." Anti-Humeans argue such counterfactuals are supported by the *necessitating* force of laws. The law linking friction, heat, and combustion *ensures* that in the relevantly similar counterfactual situations, the match lights. The BSA, however, seems stuck with the actual mosaic. Evaluating "Had X occurred..." involves examining the *closest possible worlds* where X is true. But for the Humean, what makes a world close? Crucially, it involves holding the *actual laws* fixed. Yet, the actual laws are *defined* by the actual mosaic. If the counterfactual supposition X implies a mosaic sufficiently different from ours, the *best system* in that world might be different – the laws themselves might change! The Humean law thus lacks the modal robustness to constrain counterfactual scenarios *across* mosaics where the best system differs. The necessity is merely descriptive, not prescriptive.
  3.  **The Big Bad Bug and Grounding Chance:** Lewis identified the grounding of objective chance as the "big bad bug" for Humeanism. The problem is vicious circularity and undermining futures. Suppose the true objective chance of a radioactive atom decaying in a year is 0.5. According to Lewis's initial BSA, this chance statement is true because it appears in the best system summarizing the entire mosaic, *including* the actual decay events over all time. But consider a possible future (an "undermining future") where, by sheer fluke, *no* atoms ever decay in the entire history of the universe, despite the high chance. In that future, the best system would likely *not* include the chance assignment of 0.5 for decay. The problem: The chance statement *now* seems to imply a non-zero probability of a future that would *falsify* the chance statement itself. How can the truth of "Chance(decay)=0.5" depend on the entire mosaic, including the very future events it assigns a probability to? Anti-Humeans ground chance directly in the necessitating law (e.g., a probabilistic law of decay), avoiding this self-undermining.

  **The Humean Defense: Emergence, Function, and Pragmatic Necessity**

  Lewisian Humeans, refined by thinkers like Barry Loewer and Jonathan Cohen, offer sophisticated counter-arguments, insisting the BSA *can* deliver the goods without metaphysical extravagance:

  1.  **Explanation as Unification and Compression:** Humeans reject the demand for an explanation *beyond* the mosaic. The BSA *does* explain, not by invoking occult powers, but by providing the most efficient, unifying summary of the vast complexity of particular facts. Knowing the laws (and initial conditions) allows us to *derive* vast swathes of the mosaic. This *is* genuine scientific explanation – think of explaining planetary orbits via Newton's laws. The "cosmic coincidence" charge misunderstands Humean explanation; the regularity *is* the brute fact, and the law is our optimal way of capturing its pattern. Demanding a further "ground" is, for the Humean, a category error.
  2.  **Counterfactuals Anchored in Actuality:** Humeans counter the fragility charge by emphasizing the role of *actuality* in fixing laws and similarity. When we evaluate "Had X occurred...", we hold fixed the *actual* Humean mosaic and thus the *actual* best system (laws). We then consider worlds *minimally* differing from ours to make X true, but crucially, *constrained by the actual laws*. The laws, being summaries of the actual pattern, exert a powerful constraint on what counts as a "minimal change." Striking the match *would* cause it to light because, holding the actual laws (which encode the robust link between friction, heat, and combustion) fixed, the closest worlds where it's struck are worlds where it lights. The necessity is the necessity of the actual pattern projected counterfactually. While the laws *could* have been different with a different mosaic, *given our mosaic*, they fix what happens in relevant counterfactual scenarios.
  3.  **Taming the Big Bad Bug: The Package Deal (Loewer's "Humean Supervenience"):** Loewer's crucial move is to treat the entire set of laws – including fundamental dynamical laws *and* probabilistic chance laws – as a single, global "package" determined by the entire mosaic. The truth of "Chance(decay)=0.5" is not made true *separately* by the mosaic; rather, the entire best system *package* (including this chance law) is true *in virtue of* the entire mosaic. The undermining future *does* have a non-zero chance according to the *actual* best system, but *if* that future occurred, it would mean the actual best system (the package including Ch=0.5) was *false*. There's no contradiction because the chance statement only has meaning *within* the best system applicable to the *actual* world. The chance is objective because it's an ineliminable part of the *objectively* best summary of our world's mosaic. Cohen further refines this by emphasizing "fit," ensuring the chances assigned by the best system make the actual history *probable*. This grounds the "guide to life" aspect of chance without primitive necessitation.

  **Verdict: Humean Adequacy and the Illusion of "Oomph"**

  After engaging the strongest arguments on both sides, I conclude that the refined Humean BSA *can* adequately capture the necessity, explanatory power, and counterfactual support required of laws, *when these concepts are properly understood within a naturalistic framework*. The anti-Humean view, while intuitively appealing, ultimately posits a kind of "nomic oomph" – necessitation or primitive lawhood – that is both metaphysically mysterious and explanatorily inert.

  *   **Necessity:** The Humean provides a clear, non-mysterious account of necessity: *nomic* necessity is the necessity of the actual pattern encoded in the best system. It is the necessity of "This is how our world, in fact, consistently behaves." The anti-Humean's "stronger" necessity – that laws *make* the world behave this way – is an explanatory blank check. *How* does a relation between universals necessitate? What *is* primitive lawhood beyond a label for the brute regularity? The demand for this "oomph" is a demand for something that does no additional explanatory work and violates ontological parsimony.
  *   **Explanation:** The BSA's explanatory power lies in unification, prediction, and compression – the hallmarks of scientific explanation. To demand an explanation *for the regularity itself* is to demand an explanation for the fundamental structure of reality. The Humean rightly identifies this as the terminus of explanation. The anti-Humean merely adds a layer of metaphysical machinery ("necessitation") that itself cries out for explanation and fails to provide any deeper *scientific* insight.
  *   **Counterfactuals and Chance:** Loewer and Cohen's refinements successfully navigate the treacherous waters of the "big bad bug" by holistically tying laws and chances to the entire mosaic as a package. Counterfactuals are grounded in the actual pattern projected minimally. The objectivity of chance emerges from its indispensable role in the globally best description. While complex, this account is coherent and metaphysically economical. Anti-Humean accounts avoid these technical problems only by stipulating primitive modalities, which is less a solution and more a refusal to engage the Humean constraints.

  The persistent intuition that laws must "govern" or "produce" the mosaic is powerful but, I argue, ultimately an illusion born of projecting our epistemic stance (summarizing and predicting) onto the world itself. The world just *is* the mosaic of particular events. The astounding regularities *are* the fundamental brute fact. The BSA brilliantly captures how, from this austere basis, the concepts of law, necessity, chance, and counterfactual dependence naturally emerge as features of our *representation* of the world, reflecting its objective structure without adding superfluous metaphysical glue. The Humean gambit succeeds: laws can be both descriptive summaries *and* adequately fulfill their core scientific and metaphysical roles. We need not posit irreducible necessitation to have a robust, objective notion of natural law. The mosaic, summarized optimally, is sufficient.
