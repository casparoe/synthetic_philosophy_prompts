prompt: |-
  This semester I'm taking a seminar on the metaphysics of facts and propositions, and this week's session on Bradley's regress left me wanting to think through something we didn't have time to settle in class. We'd read Bradley's chapter on relation and quality in Appearance and Reality alongside excerpts from Frege's "On Concept and Object" and Armstrong's A World of States of Affairs, and our professor kept lining the two responses up against each other: Frege blocks the regress by making concepts inherently "unsaturated," so that no further relation is needed to glue a concept to an object, while Armstrong blocks it by holding that a state of affairs is unified through "non-mereological composition" -- a brute fact about the whole that isn't built up out of its constituents plus some connecting relation. Set side by side like that, the two moves start to look interchangeable, as though each side has simply relocated the same primitive unity and given it a different name, and I'd like to see whether that impression survives actual argument.

  Could you write me a dialogue between a committed Fregean and a committed Armstrongian, each trying to convince the other that only their own solution really stops the regress? I'd like the Armstrongian to open by pressing the concept horse problem -- that the moment you try to say what unsaturatedness amounts to, you've named the concept and thereby turned it into an object, so the doctrine seems to undercut itself as soon as it's stated -- and I want the Fregean to have a real answer to this rather than concede the point outright. I'd then like the Fregean to go on the offensive by asking how a state of affairs, which by Armstrong's own account exists only when the corresponding proposition is true, can explain the unity of a proposition that is false or merely being entertained, given that there's no state of affairs there to do any unifying at all. Please have each side engage directly with the other's last move rather than simply restate their own position, keep both equally sharp, and end with that last question still open rather than have either side concede.
reasoning: |-
  We are to write a dialogue between a Fregean (F) and an Armstrongian (A) on the topic of Bradley's regress and the two proposed solutions: Frege's unsaturated concepts and Armstrong's states of affairs with non-mereological composition.

  The dialogue must:
  1. Start with the Armstrongian pressing the concept horse problem: that when you try to say what unsaturatedness is, you name the concept and turn it into an object, thus undercutting the doctrine.
  2. The Fregean must have a real answer to this.
  3. Then the Fregean goes on the offensive: how can a state of affairs (which exists only when the proposition is true) unify a false proposition or one merely being entertained? There is no state of affairs in those cases.
  4. Each side must engage directly with the other's last move.
  5. Keep both equally sharp.
  6. End with the Fregean's last question (about false propositions) still open.

  Let's structure the dialogue accordingly.

  Characters:
  - Armstrongian (A): Defends states of affairs and non-mereological composition.
  - Fregean (F): Defends unsaturated concepts.

  Scene: A seminar room after class.

  Dialogue:

  A: So, as I see it, the problem with Frege's unsaturatedness is that it's self-undermining. Take Frege's own example: the concept horse. The moment you try to talk about the concept horse, you have to use a name for it, like "the concept horse". But then, according to Frege, that name denotes an object, not the concept. So you can't actually express the unsaturatedness without turning the concept into an object. How can a doctrine that can't even be stated without contradicting itself be a solution to anything?

  F: That's a common misunderstanding. The point isn't that we cannot refer to concepts at all; we can, but we must do so obliquely. When I say "the concept horse is unsaturated", I am not directly naming the concept but rather using a concept-word in a special way. The phrase "the concept horse" is an attempt to point to the concept by using a name-like expression, but in reality, it is the predicate '___ is a horse' that expresses the concept. The concept itself is not an object; it's the meaning of the predicate. So when we talk about concepts, we are forced to use object-language, but that doesn't mean the concept becomes an object. It's a limitation of language, not of the metaphysics.

  A: But that seems like a dodge. If the only way to talk about the concept is by using a predicate, then any theoretical claim about concepts, like their unsaturatedness, becomes inexpressible in a straightforward way. And if we can't express it, how can it be a foundation for a solution? At least with Armstrong's states of affairs, we have a clear ontological category: a state of affairs is a non-mereological complex. The unity of the state of affairs is primitive and doesn't require a further relation to bind the constituents because the state of affairs is a fundamental entity. There's no regress because we stop at the whole.

  F: But your "primitive unity" is just as mysterious! You say that a state of affairs is a whole that is not composed of its parts in the mereological sense, but then what is the nature of this composition? It seems you're just relabeling the problem. And now, let me press you on a different front. Consider a false proposition, say "The cat is on the mat" when the cat isn't on the mat. For you, a state of affairs exists only when the proposition is true. So in the false case, there is no state of affairs. But then, what accounts for the unity of the proposition when we entertain it? How does the false proposition manage to be about the cat and the mat and the relation of being on, and not just a list? Without a state of affairs to unify it, what holds it together?

  A: Ah, but the proposition is a different kind of entity. For Armstrong, a proposition is a representation of a possible state of affairs. The unity of the proposition comes from the fact that it is structured to represent a state of affairs. So even when there is no actual state of affairs, the proposition is unified by its representational nature. It has constituents (like the concepts or properties and the objects) that are combined in a way that mirrors the structure of a state of affairs.

  F: But then you are just pushing the problem back. How does the representational structure achieve unity? If the proposition is a complex of objects and concepts (or properties), then we face the same regress: what unifies the representation? If you say it's the propositional form, then what unifies that form with its constituents? It seems you are either starting an infinite regress or you must admit an unexplained unity at the level of representation. And then, why not just have that at the level of the state of affairs and avoid the detour?

  A: Not so. The proposition, as a representation, is a linguistic or mental entity. Its unity is a matter of our conventions or psychological acts. But for the state of affairs, the unity is ontological and primitive. So in the case of a false proposition, the unity is derivative from the possibility of a state of affairs. The structure of the proposition is designed to match the structure of a state of affairs, and that possibility is what gives the proposition its unity. There's no regress because the proposition's unity is grounded in the potential for a state of affairs.

  F: But now you're invoking possibility. How is this possibility structured? If the possibility is of a state of affairs, then the state of affairs must have a structure that the proposition mirrors. But then we are back to asking: what unifies the state of affairs? And if the state of affairs has a primitive unity, then why can't the proposition have a primitive unity as well? And if it can, then we don't need states of affairs to explain the unity of true propositions. But more importantly, for false propositions, if the unity is grounded in the possibility of a state of affairs, then that possibility must be a unified possibility. But what unifies that possibility? It seems we are still in the regress.

  A: The possibility is not an entity that needs unifying. It's a way the world could be. The structure of the possibility is given by the very nature of the constituents and the type of state of affairs. For example, the possibility of the cat being on the mat is structured because the cat and the mat are objects that can enter into such a relation, and the relation is one that can hold between them. The possibility is not an additional entity but a feature of the objects and relations involved.

  F: But then you are relying on the unsaturatedness of relations! Because you are saying that the relation "being on" can hold between the cat and the mat. That sounds very much like the relation is unsaturated and can be completed by objects. So you haven't avoided Frege's solution; you've just hidden it behind the idea of possibility.

  A: Not at all. The relation, for Armstrong, is a universal, and universals are entities that are capable of being instantiated. But the instantiation is not due to the universal being unsaturated; it's due to the state of affairs being a non-mereological complex. The universal is a constituent of the state of affairs, but the state of affairs is not built from the universal and the objects by adding a relation of instantiation. The instantiation is the state of affairs itself. So no unsaturatedness is required.

  F: But then how does the state of affairs manage to have the universal and the objects as constituents without a further relation? If the state of affairs is a whole, and the universal and the objects are parts, then we need an account of how they are connected. If you say it's non-mereological, then you are admitting that the connection is primitive. But then why not just say that the connection is primitive in the proposition as well? And then we don't need states of affairs to explain true propositions. But then what about false ones? You still haven't given a clear account of how the false proposition is unified without a state of affairs.

  A: The false proposition is unified by our ability to think of the objects and the universal together in a certain way. That ability is grounded in the actual structure of the world, which includes states of affairs of that type. But the proposition itself is a representation, and representations have their own principles of unity.

  F: But now you are shifting the burden to psychology or linguistics. That seems to abandon the metaphysical project. We started by asking about the unity of the proposition as an abstract entity, not about our mental acts. If the unity of the proposition is explained by our mental acts, then we need an account of the unity of those mental acts. And that might lead to a regress in the mental. So I think we are back at square one.

  A: Not necessarily. The mental act is a state of affairs itself! When I think that the cat is on the mat, there is a state of affairs in my mind: the tokening of a mental representation with a certain structure. So the unity of the proposition is inherited from the unity of the mental state of affairs.

  F: But then we have a regress: what unifies the mental state of affairs? And if you say it's a primitive unity, then why not have that for the original proposition? And if the mental state of affairs is unified by non-mereological composition, then we are still left with the question: how does non-mereological composition work? It seems to be a brute fact. But then Frege's unsaturatedness is also a brute fact. So we are at an impasse.

  A: Perhaps. But at least Armstrong's account doesn't suffer from the self-referential problem of Frege's. We can talk about states of affairs without turning them into something else.

  F: But we can also talk about Fregean concepts by using predicates. And that's the proper way to do it. The concept horse is expressed by the predicate 'is a horse'. When we want to talk about it, we can use a metalinguistic approach: we say that the predicate is unsaturated. The predicate is a linguistic entity, and we can talk about it without turning the concept into an object.

  A: But then you're making the concept dependent on language. That seems psychologistic, which Frege wanted to avoid.

  F: Not at all. The concept is an objective entity. The predicate expresses it. The unsaturatedness is a feature of the concept, not of the predicate. The predicate is a sign for an unsaturated entity. So we are not reducing concepts to words.

  A: But how do we know about the concept except through the predicate? And if we can only refer to it by using a predicate, then we can't make it the subject of a sentence without distortion. So we cannot state the theory without distortion. That's a serious problem.

  F: And how do we know about states of affairs? We name them. But then, by naming them, we treat them as objects. So your states of affairs become objects in our discourse. Doesn't that distort them too?

  A: No, because a state of affairs is an object! It's a particular complex. So naming it is appropriate.

  F: But then we can ask: what is the structure of that complex? And we are back to the problem of unity. If we try to describe the structure, we have to list the constituents and the relation that binds them, but then we need a further relation to bind the relation to the constituents, and so on. So the regress reappears when we try to describe the state of affairs.

  A: We don't describe the state of affairs by listing its constituents and a relation. We say, for example, "the state of affairs of the cat being on the mat". That's a name for the whole. We don't break it down. If we do break it down, we are not describing the state of affairs as a whole but rather analyzing it. And analysis always leads to regress. That's why we take the state of affairs as primitive.

  F: And we take the unsaturatedness of concepts as primitive. So both solutions are on par in that respect. But now, back to false propositions: if the state of affairs is only for true propositions, and false ones are unified by representation, but the representation is either a mental state of affairs (which leads to regress) or a linguistic entity (which might require conventions, but then conventions are social facts, which are states of affairs, and so on). So how do you stop the regress for false propositions without invoking an infinite chain?

  A: ... 

  (End with this question open)
answer: |-
  ### Dialogue: Fregean vs. Armstrongian on Bradley's Regress

  **Characters:**  
  - **Armstrongian (A):** Committed to David Armstrong’s view of states of affairs as non-mereological complexes.  
  - **Fregean (F):** Committed to Gottlob Frege’s view of concepts as inherently unsaturated.  

  **Setting:** A university common room after a seminar on metaphysics. Coffee cups clutter the table as the two debaters lean in, eager to resolve the class’s unfinished debate.  

  ---

  **A:** Let’s start with the fatal flaw in your Fregean solution. You block Bradley’s regress by saying concepts are “unsaturated”—they’re incomplete, so they don’t need a further relation to bind to objects. But the moment you try to *state* this, you name the concept, like “the concept *horse*,” and treat it as a complete object. That’s Frege’s own “concept horse” problem: naming unsaturatedness turns it into a saturated object, undermining the doctrine. How can a theory that self-destructs upon articulation solve anything?  

  **F:** That’s a misstep. The “concept horse” paradox arises from conflating *reference* with *expression*. When I say, “The concept *horse* is unsaturated,” the phrase “the concept *horse*” is a linguistic device for oblique reference—it points to the concept indirectly, but it doesn’t *express* it. What expresses the concept is the predicate “… is a horse.” Predicates are inherently unsaturated in language, mirroring the metaphysics: they have gaps for objects. So, yes, language forces us to use saturated expressions when discussing concepts, but that’s a limitation of syntax, not metaphysics. The concept itself remains unsaturated. It’s like trying to point at darkness with a flashlight—the tool illuminates, but the thing itself is absence.  

  **A:** Clever, but you’re dodging. If unsaturatedness can’t be directly stated without contradiction, it’s not a clear foundation. Armstrong’s solution avoids this: a state of affairs—say, *a’s being F*—is a basic, non-mereological whole. Its unity is primitive; no “glue” is needed because the whole isn’t built from parts. Constituents like *a* and *F* are inseparable from the state of affairs itself. That’s a regress-stopper without self-sabotage.  

  **F:** Primitive unity? That’s just relabeling the problem! If a state of affairs is a whole with constituents, what *is* this “non-mereological composition” if not brute magic? Worse, your states of affairs only exist when propositions are *true*. So tell me: how does your view explain the unity of a *false* proposition, like “The cat is on the mat” when the cat isn’t? There’s no state of affairs to unify it. Yet we can entertain the proposition—it’s not a mere list of “cat,” “mat,” and “on.” What holds it together?  

  **A:** Fair challenge. For false propositions, unity comes from *possible* states of affairs. The proposition represents a potential complex—a structure that *could* obtain. Its constituents are combined in a way that mirrors how objects and universals *would* compose in reality. The unity isn’t ontological but representational: our minds or language latch onto the world’s combinatorial possibilities.  

  **F:** But that just relocates the regress! If a false proposition’s unity depends on a “possible state of affairs,” what unifies *that* possibility? Possibilities aren’t free-floating—they’re built from objects and universals. So you’d need a further unity to bind them into a possible complex, and off we go again. Worse, you’ve smuggled in Fregeanism: saying universals “would compose” with objects sounds like *they’re* unsaturated, hungry for completion.  

  **A:** Not at all. Universals aren’t unsaturated; they’re abstract entities. The possibility is unified because objects and universals have intrinsic combinatorial potentials—grounded in their natures. But the key is that for actual states of affairs, unity is primitive and non-relational. For mere possibilities, it’s derivative: a shadow of actuality.  

  **F:** Derivative how? If possibilities are “shadows,” they still need structure. And if you ground that structure in “combinatorial potentials,” you’re implying objects and universals have relational properties—which invites Bradley’s regress anew. Meanwhile, Frege handles false propositions cleanly: a proposition is a sense (a mode of presentation) composed of unsaturated senses. Entertaining “The cat is on the mat” combines the unsaturated sense of “on” with the senses of “cat” and “mat.” No actual objects or relations are needed—just the *thought’s* structure. Unsaturatedness blocks regress at the level of sense.  

  **A:** But senses are abstract objects! If they’re unsaturated, you’re back in the “concept horse” trap. How do you talk about the sense of “on” without saturating it? And if senses are objects, what unifies *them* in the thought? You haven’t escaped.  

  **F:** Senses aren’t objects; they’re *ways* objects or concepts are presented. The sense of a predicate is unsaturated by definition—it’s a “mode” that only completes in a thought. We discuss them obliquely, like concepts, but their unity in a proposition is inherent. No further binder needed.  

  **A:** Inherent? That’s no better than Armstrong’s primitivism! But here’s the rub: for Armstrong, even false propositions are *about* actual objects and universals. Their unity comes from direct reference to real constituents, combined by our cognitive act of predication.  

  **F:** Cognitive acts? Now you’re psychologizing. Bradley’s regress is metaphysical—about how entities combine. If you reduce propositional unity to mental acts, what unifies *those*? Is judging that the cat is on the mat a state of affairs in your mind? Then we’d need a regress-stopper for mental states too. Your “non-mereological composition” must apply universally or not at all.  

  **A:** Mental acts *are* states of affairs! A judgment is a concrete particular—a non-mereological whole with neural or phenomenological constituents. Its unity is primitive, like all states of affairs.  

  **F:** But then false judgments have no truthmaker, so their unity is illusory? And if every mental act is a state of affairs, what distinguishes a unified judgment from a chaotic brain state? You’ll need a criterion, which again demands regress-stopping. Admit it: your view can’t handle false propositions without equivocating between actuality and possibility.  

  **A:** And your view can’t state its core thesis without self-contradiction. But I’ll press your original challenge: if states of affairs unify only truths, how do false propositions cohere? I say it’s through their connection to real objects and universals, plus our combinatorial capacity—grounded in the actual unity of states of affairs that *do* obtain.  

  **F:** But that combinatorial capacity—is it a relation? If so, Bradley’s ghost returns. If not, it’s as primitive as unsaturatedness. So we’re at a draw. But answer this: if there’s no state of affairs for “The cat is on the mat” when false, what metaphysically distinguishes that proposition from a list? You owe an account of unity that doesn’t reduce to psychology or possibility.  

  **A:** ...  

  *(The dialogue ends here, with the Fregean’s challenge unanswered. Both look equally unsettled, the coffee gone cold.)*  

  ---  
  **Closing Note:** The dialogue halts at the Fregean’s final question—how Armstrongian non-mereological composition can unify false propositions without invoking problematic relations or collapsing into psychology. Both sides have sharpened their positions: the Fregean defends unsaturatedness against the “concept horse” trap by distinguishing reference from expression, while the Armstrongian appeals to possible states of affairs and cognitive acts. Yet neither concedes, leaving the regress debate unresolved and ripe for further thought.
