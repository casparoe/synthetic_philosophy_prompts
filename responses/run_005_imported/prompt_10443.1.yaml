answer: |-
  Absolutely - you need a case where the baseline isn't just blurry, but *shatters* under scrutiny. Here's a concrete, high-stakes example with biological teeth, avoiding the cognitive enhancement tropes:

  **The Case: Arctic Deep-Water Fisherman's Cold Adaptation Therapy**

  **The Patient:** A 25-year-old worker on an illegal Arctic deep-sea fishing trawler (operating in thawed-but-lethal waters due to climate change). He's of Inuit ancestry but his family relocated generations ago - he lacks the full suite of cold-adaptation epigenetics.

  **The Treatment:** A gene therapy cocktail inducing:
  1.  **Enhanced BAT (Brown Adipose Tissue) Activation:** Hyper-metabolic heat production.
  2.  **UCP1 Upregulation:** Uncoupling protein making heat generation more efficient.
  3.  **Peripheral Vasoconstriction Control:** Preventing frostbite by better managing blood flow to extremities.
  4.  **Modified Pain Response:** Reduced sensitivity to cold-induced pain without losing critical damage awareness.

  **Why the Therapy/Enhancement Distinction Collapses:**

  1.  **"Normal Species Functioning" is Geographically & Historically Contested:**
      *   **Ancestral Baseline:** For his Inuit ancestors, this level of cold tolerance *was* "normal species functioning" in *their* environment. Is this "restoration"? But he lacks the specific epigenetic triggers. Is it enhancement relative to *his* personal baseline?
      *   **Current Local Baseline:** The *current* "normal" human in his *actual workplace* (the trawler) *requires* this level of tolerance to survive without severe injury. Without it, workers suffer frequent hypothermia, amputations, death. Is providing the necessary biology for *this specific job* therapy? Or is it job-specific enhancement?
      *   **Global Baseline:** For the vast majority of humans living in temperate zones, this level of cold tolerance is *far* beyond "normal" - clear enhancement.

  2.  **The Reference Class Shifts Wildly:**
      *   **Age:** Should his baseline be compared to *current* elderly Inuit (who may have diminished cold tolerance)? Healthy Inuit adults? Pre-industrial Inuit? All humans?
      *   **Genetics:** Does having *some* Inuit ancestry grant access to the "cold-adapted human" reference class? What percentage? What if he had no ancestry but worked there for 10 years?
      *   **Environment:** Is "normal" defined by where he was born (a temperate city)? Where he *lives* (a grim Arctic port)? Or where he *works* (-2°C seawater)? The treatment is only "therapeutic" in one of these.
      *   **Temporal Baseline:** Is "normal" pre-climate change Arctic human physiology? Or the physiology needed to survive in the *newly* accessible (and exploited) lethal zones created by warming? The environment changed faster than natural selection.

  3.  **The "Disease" is Environmental, Not Biological:**
      *   There's nothing "wrong" with his innate biology for 99.9% of the planet. The "disease" (risk of lethal hypothermia/frostbite) is caused *entirely* by an extreme environment created by geopolitical/economic forces (illegal fishing in thawed zones). Is treating the *worker* for an *environmental* hazard therapy? Or is it enhancing him to meet an unnatural demand?

  4.  **The Treatment Leverages Latent but Non-Functional Biology:**
      *   The genes targeted exist in all humans, but are inactive at these levels outside of highly adapted populations. The therapy doesn't add truly "novel" genes; it massively upregulates existing pathways. Is flipping a biological switch from "off" to "extreme on" restoration or enhancement?

  **Why This Works for Your Scene & Has "Bite":**

  *   **High Stakes:** Survival vs. death/disability, not just exam performance. Raises issues of worker exploitation, climate injustice.
  *   **Bodily, Not Cognitive:** Avoids tired ADHD debates. Focuses on core physiological adaptation.
  *   **Environmental Causation:** Directly ties the "need" to a contested, human-made environmental shift, making "normal" impossible to define neutrally.
  *   **Exploitative Context:** The unlicensed clinic exists *because* the official system can't/won't classify this. Workers are forced into this grey market to keep dangerous jobs. The clinic owner might genuinely see it as life-saving therapy, while regulators see dangerous enhancement.
  *   **Regulatory Nightmare:** An auditor could argue:
      *   *"Therapy"*: Necessary to prevent inevitable, severe harm in his *de facto* environment. Restores a *potential* human norm.
      *   *"Enhancement"*: Grants superhuman tolerance far exceeding global norms for a specific, non-essential (and illegal) job. Creates an unfair biological advantage in that niche.
      *   *"Neither - It's Hazard Mitigation"*: The *real* problem is the illegal, lethally cold workplace. The treatment just papers over that crime, making workers biologically complicit in their own exploitation.

  **Scene Potential:** Imagine the clinic owner arguing passionately with a conflicted regulator (or a worker's scared family member). The owner points to frostbite scars on workers: "Is *this* the 'normal functioning' you want to protect? Their 'baseline' is death or amputation here! We're restoring a human *capacity*!" The regulator fires back: "You're turning men into biological submarines so corporations can fish in a death zone! His 'normal' baseline is a warm-blooded human, not a fucking arctic seal! You moved the goalposts by creating this hellscape job!" The ambiguity isn't just academic; it's life, death, exploitation, and survival on the ragged edge of a broken world. The baseline isn't blurry; it's shattered by climate change and human greed.
