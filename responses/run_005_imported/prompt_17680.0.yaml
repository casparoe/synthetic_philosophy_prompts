  The user explicitly doesn't want another retelling of the "Appointment in Samarra" fable. They're looking for a fresh setting that preserves the decision theory structure. They mentioned examples like a chess grandmaster against an opponent with psychological insights or a submarine facing predictive sonar. The key elements to include are: the protagonist realizing the safe choice dissolves upon commitment, the dilemma of randomization as a solution, and showing this through action/thought rather than exposition.

  Hmm, the submarine scenario stands out. It fits well—submarine evasion relies on unpredictable maneuvers, and sonar prediction creates a direct parallel to Death's foresight. The confined, high-stakes environment amplifies the tension. Plus, the sonar operator (Echo) as the predictor adds a technological twist. 

