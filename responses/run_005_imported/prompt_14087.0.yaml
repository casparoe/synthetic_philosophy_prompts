  First, I need to understand the core conflict. The non-toleration clause requires reporting any violations. The senior didn't report her brother. The council is split: half want strict enforcement, fearing that any exception, especially for family, undermines the entire system. The other half argues for Confucian role ethics, where family loyalty is fundamental. They cite the Analects where Confucius criticizes someone for turning in their father for stealing a sheep, emphasizing that family covering for each other is upright. Also, the sister did remonstrate gently, which aligns with Confucian advice.

