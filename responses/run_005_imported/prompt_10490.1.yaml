  ---

  ### Step-by-Step Reasoning
  **1. Naomi's First Move**  
  *Claim:* Avoidance of printing slurs even under syntactic mention shows offense isn't tied to speaker meaning, truth-conditions, or standard implicature. This supports Anderson & Lepore's prohibitionism (brute lexical prohibition).  
  *Score:* **1 (Mostly Right)**  
  *Reasoning:*  
  - ✅ **Strength:** Correctly identifies that offense persists in mention contexts (e.g., "‘N——’ is a slur"), which challenges theories locating offensiveness *only* in speaker intent or truth-conditional content. This *is* predicted by prohibitionism.  
  - ⚠️ **Weakness:** Overstates exclusivity. As Owen notes, conventional implicatures (e.g., "but" carrying contrast) or presuppositions (e.g., "stop" presupposing prior action) *also* project through mention/embedding. A CI/presupposition theory of slurs (e.g., Christopher Potts' work) could equally explain this data.  
  - **Verdict:** Strong observation but doesn’t uniquely support prohibitionism.

  **2. Owen's First Move**  
  *Claim:* Projection past mention/embedding isn’t unique to prohibitionism; CI/presupposition theories predict the same behavior. No discrimination between theories.  
  *Score:* **1 (Mostly Right)**  
  *Reasoning:*  
  - ✅ **Strength:** Absolutely correct that CI/presupposition content famously projects (e.g., "The king of France isn’t bald" still presupposes a king exists). If slur offensiveness is modeled as CI (e.g., Hom 2008) or presupposition (e.g., Schlenker 2007), it naturally survives mention.  
  - ⚠️ **Weakness:** Misses that prohibitionism *best* explains *why* offense attaches to the *word-form* irrespective of context. CI theories often treat content as part of compositional semantics, while prohibitionism treats it as a meta-linguistic constraint.  
  - **Verdict:** Valid rebuttal to Naomi’s exclusivity claim but undersells prohibitionism’s explanatory edge for *formal* prohibition.

  **3. Naomi's Second Move**  
  *Claim:* Asymmetry with taboo words (e.g., "fuck" printed freely in phonology papers) suggests social practice, not semantic architecture, drives slur avoidance. Undercuts CI/presupposition theories.  
  *Score:* **1 (Mostly Right)**  
  *Reasoning:*  
  - ✅ **Strength:** Highlights a genuine asymmetry. If projection were sufficient, we’d expect similar avoidance for all projective content (e.g., printing "damn" in theology papers). The fact that only slurs get "kid-gloves" treatment *does* point to extra-linguistic factors (e.g., historical oppression) as primary.  
  - ⚠️ **Weakness:** Overlooks that taboo words *are* often avoided in certain contexts (e.g., "f-word" in broadcast media). The asymmetry is gradient, not absolute. Also, doesn’t engage with Hom-style theories that *explicitly* ground offensiveness in oppression.  
  - **Verdict:** Powerful challenge to CI/presupposition universality but doesn’t refute oppression-based semantic theories.

  **4. Owen's Second Move**  
  *Claim:* Hom-style combinatorial externalism explains the asymmetry: Slurs encode oppressive ideologies/histories, while generic taboos do not. Thus, only slurs warrant special treatment.  
  *Score:* **2 (Clearly Right)**  
  *Reasoning:*  
  - ✅ **Strength:** Directly reconciles the asymmetry. Hom (2012) argues slurs conventionally encode *prescriptive ideologies* (e.g., "inferiority due to race"), rooted in systemic oppression. Taboos (e.g., "fuck") lack this specific content. Social practice reflects the *semantic content*, not just arbitrary norms.  
  - ✅ **Theoretical Fit:** Elegantly incorporates Naomi’s social observation into a semantic framework: Offense tracks the *type* of content (oppressive vs. generic taboo), not just projection mechanics.  
  - ✅ **Completeness:** Addresses both the projection data (via conventional encoding) and the asymmetry (via content specificity).  
  - **Verdict:** Best move in the debate. Successfully defends semantic approaches while accommodating social reality.

  ---

  ### Substantive Points Both Missed
  1. **Academic Norms ≠ Linguistic Theory:** Avoidance may reflect evolving disciplinary ethics (e.g., preventing harm to readers/reinforcing oppression) rather than linguistic properties. A theory-neutral explanation could be: *Academics avoid slurs because they recognize the words as tools of violence, regardless of semantic architecture.*  
     
  2. **Reclamation Dynamics:** Some slurs (e.g., "queer") are reclaimed by in-groups. Avoidance in academia might inadvertently hinder reclamation or obscure how semantic content shifts. Neither Hom nor A&L fully model this fluidity.

  3. **Mention vs. Citation Distinction:** Papers often *mention* slurs (e.g., "The word is derogatory") without *using* them. But typographic avoidance (e.g., "n-word") blurs this distinction, potentially reinforcing the taboo. This meta-linguistic practice itself needs analysis.

  4. **Power Structures:** Naomi’s social-practice focus glosses over *why* slurs are uniquely avoided: They weaponize marginalized identities. Owen’s semantic reply implicitly acknowledges this but doesn’t explore how power dynamics shape both language and academic discourse.

  Both debaters made strong, complementary points. Naomi correctly spotlighted social practice as a driver, while Owen best integrated it into semantic theory. The "winner" depends on whether you prioritize empirical observation (Naomi) or theoretical cohesion (Owen).
