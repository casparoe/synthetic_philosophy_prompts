  Adding more questions to round it out: I'll include how we know we've found the relation (epistemology), what it's made of (metaphysics), how it interacts with objects, whether multiple relations could exist, and if laws can be incomplete. Each needs sharp follow-ups. For instance, on epistemology, if he says we infer from patterns, I'll point out that sounds Humean.

