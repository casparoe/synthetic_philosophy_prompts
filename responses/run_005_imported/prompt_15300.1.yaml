answer: |-
  Here’s a sequenced set of questions designed to progressively challenge the "honest signal has to hurt" slogan while anchoring the discussion in formal theory, empirical nuance, and falsifiability. Each question includes a likely deflection and a targeted follow-up:

  1.  **Foundation & Motivation:** "You've championed extending Zahavi's handicap principle far beyond sexual ornaments. What first convinced you that 'costly signaling' could explain cooperative or altruistic behaviors in social animals—behaviors traditionally framed through kin selection or reciprocity?"  
      *Deflection risk: Anecdotal examples without mechanistic distinction.*  
      *Follow-up:* "Could you walk me through why a handicap explanation is *necessary* for cases like sentinel behavior, given existing models already predict cooperation?"

  2.  **Slogan Dissection (Initial):** "Your signature line, 'an honest signal has to hurt,' is powerfully intuitive. Beyond the intuitive appeal, how do you define 'hurt' in operational terms within your framework? Is it absolute cost, opportunity cost, or something else?"  
      *Deflection risk: Restating the slogan or using vague biological terms.*  
      *Follow-up:* "Could you quantify 'hurt' in one of your key study systems? For instance, what measurable cost makes a specific cooperative act an 'honest signal'?"

  3.  **Marginal Cost Challenge (Core Theory):** "Grafen's 1990 formal model showed that honesty is maintained by differential *marginal* costs—signals are cheaper for high-quality signallers, not necessarily high *absolute* cost. How does your emphasis on 'hurt' (implying high absolute cost) reconcile with this mathematical requirement for a *difference* in cost/benefit across qualities?"  
      *Deflection risk: Equating "differential cost" with "high cost" or downplaying formal models.*  
      *Follow-up:* "Grafen argued a low-cost signal *can* be honest if its marginal cost/benefit curve is sufficiently steep. Doesn't this mean 'hurt' (high absolute cost) isn't the *essential* ingredient, but rather the *relationship* between cost and quality?"

  4.  **Cost-Free Honest Signals (Index Challenge):** "Maynard Smith and Harper distinguished 'handicaps' from 'indices'—signals like body size that are inherently reliable because they are physically linked to quality (e.g., a deep roar requires a large larynx) and needn't be costly to produce. How does the handicap principle, especially your 'has to hurt' formulation, encompass or explain these *cost-free* honest signals?"  
      *Deflection risk: Dismissing indices as irrelevant or claiming they 'hurt' via development/constraint.*  
      *Follow-up:* "If an index signal is inherently reliable *without* production costs, doesn't that mean honesty can exist *without* 'hurt'? How does this fit within a principle centered on cost?"

  5.  **Competitive Altruism vs. Alternatives:** "You've applied handicap logic to 'competitive altruism'—like babblers competing to help. But couldn't reputation-building for *future* reciprocity, or subtle kin selection benefits, explain this without invoking signal cost *as the primary enforcer* of honesty? What evidence specifically rules those out and points to cost *itself* as the key stabilizer?"  
      *Deflection risk: Conflating outcome (helping) with mechanism (cost-enforced signaling).*  
      *Follow-up:* "Have you designed experiments that directly manipulate the *cost* of helping in such systems and observed the predicted collapse in reliability, distinguishing it from reputation or kin effects?"

  6.  **Human Extension - Concrete Mechanism:** "Moving to humans, you link phenomena like conspicuous consumption or extreme philanthropy to handicap signaling. But human motivations are complex (enjoyment, tax breaks, social pressure). How do you empirically disentangle 'signaling cost' from other drivers, and crucially, demonstrate that the *cost itself* is what makes the signal credible—not just wealth display?"  
      *Deflection risk: Asserting analogy without evidence; focusing on display, not cost's role.*  
      *Follow-up:* "Can you point to a human study showing that a *more* costly act (e.g., a *truly* painful donation) is perceived as *more* reliable than a cheaper display of equivalent value, controlling for other factors?"

  7.  **The 'Hurt' Threshold - How Much is Enough?:** "If 'hurt' is essential, where is the line? Many signals involve *some* cost (time, energy). What defines the minimum threshold of cost needed to enforce honesty under your view? Is it relative to the benefit, absolute, or context-dependent?"  
      *Deflection risk: Vagueness ("sufficient cost"), context-dependence, or retreat to differential cost.*  
      *Follow-up:* "Doesn't the lack of a defined threshold make the 'has to hurt' claim unfalsifiable? If any non-zero cost counts as 'hurt,' how is the principle meaningfully different from just saying 'signals involve costs'?"

  8.  **Falsifiability - Evidence Against:** "The handicap principle is often praised for its explanatory power, but critics argue it risks becoming unfalsifiable—able to explain any costly behavior post-hoc. What specific finding, in animal or human behavior, would you consider strong evidence *against* the handicap principle being the primary explanation for a given 'costly' signal?"  
      *Deflection risk: Claiming nothing could falsify it; reinterpreting counter-evidence.*  
      *Follow-up:* "If no conceivable observation could challenge the principle's applicability to a costly act, does it retain its scientific utility beyond being a compelling metaphor?"

  9.  **Absorption vs. Prediction:** "Much of the support for the handicap principle comes from explaining existing phenomena (peacock tails, altruism). What are one or two key, non-obvious *predictions* your extended framework has generated that were later confirmed empirically—predictions that alternative theories (like indices, reciprocity, sensory bias) wouldn't easily make?"  
      *Deflection risk: Retrospective fits, not novel predictions.*  
      *Follow-up:* "Can you share an example where your model predicted the discovery of a *new* type of costly signal or a specific context where cost would suddenly become essential for honesty?"

  10. **Legacy & Limits:** "Looking ahead, where do you see the most fruitful boundaries for extending the handicap principle? Are there domains of social behavior (e.g., human online interaction, institutional trust) or types of signals where you think the 'cost = honesty' logic *doesn't* apply, or where other frameworks are clearly superior?"  
      *Deflection risk: Universal claims; dismissing boundaries.*  
      *Follow-up:* "Given the critiques we've touched on—marginal costs, indices, alternative mechanisms—how might the core insight of the handicap principle evolve, or need refining, in the next decade?"

  **Key Sequencing Logic:**
  1.  Starts with her motivation and broad view (Q1).
  2.  Directly addresses the slogan but asks for definition (Q2).
  3.  Forces confrontation with the marginal cost vs. absolute cost gap using core theory (Q3 - Critical Hit).
  4.  Presents a clear counterexample (cost-free indices) to challenge the necessity of "hurt" (Q4).
  5.  Challenges the extension to cooperation by demanding distinction from other mechanisms (Q5).
  6.  Forces concrete justification for the human analogy (Q6).
  7.  Probes the practical ambiguity of the slogan (Q7).
  8.  Directly tackles falsifiability (Q8 - Critical Hit).
  9.  Tests predictive power vs. retrospective absorption (Q9).
  10. Ends by inviting reflection on limits and evolution (Q10).

  This structure starts collaboratively, builds to the core theoretical and empirical challenges around Q3-Q4 and Q8, ensures human extensions aren't taken for granted (Q6), and consistently pushes beyond the slogan towards mechanistic precision and testability. The embedded follow-ups anticipate common defenses and aim to keep the discussion grounded in evolutionary theory and evidence. Good luck with the interview – it sounds fascinating!
