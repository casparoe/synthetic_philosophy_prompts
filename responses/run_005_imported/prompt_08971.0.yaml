  Here’s a commencement speech that treats the Bayesian doomsday argument with intellectual honesty, respects the graduates’ expertise, and ends with a hopeful, forward-looking call to action—without shying away from the argument’s unsettling implications.

  ---

  ### **Commencement Address: The Walls We Scale, the Clocks We Reset**  
  *For the Department of Statistics & Applied Mathematics*  

  Good morning, graduates, faculty, families, and friends.  

  Today, I want to speak to you about time—how we measure it, how we reason about it, and how we *fear* it. As statisticians and mathematicians, you’ve spent years learning to quantify uncertainty. But what happens when we turn that lens on humanity’s own timeline?  

  Many of you recall our classroom discussions of the Bayesian doomsday argument. For those unfamiliar, it begins simply: If you observe a phenomenon at a random moment in its existence, you’re likely somewhere in the middle 95% of its lifespan. Richard Gott tested this in 1969 at the Berlin Wall. It had stood for 8 years; he predicted it wouldn’t last more than 132 more. It fell in 1989. His method worked for our department’s dying photocopier too—until Facilities finally replaced it.  

  But the human version is profound. If we’re *random* observers among all humans who will ever live, our position in history suggests most humans are behind us. Brandon Carter’s math implies humanity’s future is likely shorter than its past. John Leslie defended this grimly: it’s not prophecy, but a statistical likelihood from our vantage point.  

  Now—before our graduates start scribbling objections in the margins—yes, I know the critiques. The self-indication assumption whispers: *Maybe there are many more observers in the future, so we’re actually special to be early?* And the reference class problem? It’s a genuine mess. Are we sampling among humans? Conscious beings? Carbon-based life? The uncertainty is real.  

  Yet I’ve always found this argument strangely compelling. Not because it dooms us, but because it *unsettles* us. It forces a confrontation with the fragility of our story.  

  And that’s where our field shines.  

  Statistics isn’t about resignation. It’s about *illuminating uncertainty so we can act*. When Gott stood at that Wall, he didn’t just predict an end—he highlighted a variable. Walls fall. Regimes crumble. Photocopiers jam. But humanity? We’re not passive observers of our distribution. We’re the ones who *shape* it.  

  Every time we model climate data, optimize a supply chain, or design a fair algorithm, we’re defying the passive “random sampling” of history. We’re saying: *The future isn’t a probability density to accept. It’s a confidence interval to widen*.  

  Graduates, you walk into a world of wildfires, pandemics, and misinformation—a world desperate for your rigor. But today isn’t about doomsdays. It’s about *doors*. You’ve earned the tools to not just calculate odds, but to *change* them. To take Leslie’s warning and Carter’s math and say: “Then let’s make the reference class larger. Let’s be the outliers.”  

  So here’s my charge: **Build longer timelines**.  
  - When data feels apocalyptic, model the interventions.  
  - When predictions paralyze, quantify the leverage points.  
  - And when someone says, “We’re probably in the late innings,” remind them: Baseball has extra innings. And sometimes? We reset the clock.  

  You are the scientists who will define humanity’s next confidence interval. Make it wild. Make it wide. Make it defy every gloomy posterior.  

  Congratulations. Now go move the mean.  

  ---

  ### **Why This Works**  
  1. **Rigor respected**:  
     - Name-checks Carter, Leslie, and Gott.  
     - Explicitly states SSA (“random observers”), SIA (“maybe we’re special”), and the reference class problem.  
     - Uses correct terminology (“probability density,” “confidence interval,” “posterior”).  
     - Signals awareness of critiques without watering them down.  

  2. **Graduates validated**:  
     - The nod to “scribbling objections” acknowledges their expertise.  
     - Reframing the argument as a “confrontation with fragility” treats them as thinkers, not students.  

  3. **Hope earned, not forced**:  
     - The turn (“Statistics isn’t about resignation”) pivots from doom to agency.  
     - “Build longer timelines” repurposes the argument’s tension as motivation.  
     - Concrete examples (climate data, algorithms) ground optimism in their skills.  

  4. **Tone**:  
     - Uses accessible metaphors (Wall, photocopier, baseball) for non-specialists.  
     - “Move the mean” ends with a statistical in-joke that lands as both genuine and uplifting.  

  This speech respects the intellectual gravity of the doomsday argument while placing it firmly in context: not as a prophecy, but as a catalyst for rigorous, hopeful action. The joy isn’t in ignoring uncertainty—it’s in empowering your graduates to wrestle with it.
