answer: |-
  That's an excellent and common argument, but the ontological economy argument for supervaluationism over epistemicism is more complex than it initially appears. While supervaluationism avoids epistemicism's commitment to unknowable sharp boundaries, it introduces its own complexities that arguably offset or even outweigh the perceived ontological savings. Here's a breakdown:

  1.  **The Core Argument for Supervaluationist Economy:**
      *   Epistemicism posits a *single, precise, but unknowable* boundary for a vague predicate (e.g., exactly 1,000 grains make a heap; 999 do not).
      *   Supervaluationism avoids this by allowing a *range* of candidate precisifications (e.g., heaphood starting anywhere between, say, 500 and 1500 grains). No single precisification is "the correct one."
      *   Therefore, supervaluationism seems ontologically cheaper: it doesn't postulate a mysterious hidden fact about where the boundary *actually* lies.

  2.  **The Counter-Argument: Supervaluationism's Hidden Complexity:**
      While supervaluationism avoids *one specific type* of hidden fact (the single sharp boundary), it introduces other ontological and conceptual commitments:

      *   **The Ontology of Precisifications:** Supervaluationism requires the existence of a *set* (or space) of admissible precisifications. Each precisification *is itself a perfectly sharp boundary* (e.g., one precisification says heap starts at 500, another at 501, another at 502, ..., up to 1500). Instead of one unknowable boundary, supervaluationism posits a *multitude* of equally legitimate sharp boundaries. The ontology isn't reduced; it's multiplied and reconfigured.
      *   **The Supervaluation Function:** The theory needs a mechanism to define truth (supertruth) as truth in *all* admissible precisifications, and falsity (superfalsity) as falsity in *all* admissible precisifications. This "supervaluation" function itself becomes a new primitive or complex entity in the theory.
      *   **The Problem of Admissibility:** What makes a precisification *admissible*? Defining the constraints on what counts as an admissible way of making the vague predicate precise is notoriously difficult and often relies on vague notions itself (e.g., "must respect normal usage," "must not draw the line *too* unnaturally"). This introduces potential vagueness *about* the set of precisifications, leading to...
      *   **Higher-Order Vagueness:** This is the most significant challenge to the economy argument. The borderline between clear heaps, borderline cases, and clear non-heaps *itself* seems vague. Supervaluationism, as usually presented, simply pushes the sharp boundary problem up a level:
          *   It needs a sharp boundary between cases that are true in *all* precisifications (definite truths) and those that aren't.
          *   It needs a sharp boundary between cases that are false in *all* precisifications (definite falsehoods) and those that aren't.
          *   It needs sharp boundaries defining the *set* of admissible precisifications itself.
      *   Handling higher-order vagueness typically requires iterating the supervaluationist machinery: precisifications of precisifications, super-supervaluations, and so on. This leads to an explosion of complexity – hierarchies of precisification sets and valuation functions. While epistemicism has one sharp boundary (albeit unknowable), supervaluationism threatens to require infinitely many levels of sharp boundaries defining the admissibility of precisifications at each level, making its ontology arguably *more* complex.

  3.  **Epistemicism's Simplicity (in one dimension):**
      Epistemicism, despite its deeply counterintuitive commitment to unknowable sharp boundaries, has a certain brutal simplicity:
      *   It maintains classical bivalent logic and semantics universally.
      *   It posits no new entities like sets of precisifications or supervaluation functions.
      *   It avoids the problem of defining "admissibility" beyond our ordinary (fallible) knowledge of meaning.
      *   It doesn't generate the regress of higher-order vagueness in the same way; the boundary is sharp but unknowable – full stop. There's no need to posit further boundaries defining *levels* of vagueness.

  **Conclusion:**

  While supervaluationism *seems* more ontologically economical because it dispenses with epistemicism's single, mysterious sharp boundary, this advantage is largely illusory. Supervaluationism:

  1.  **Replaces** the single sharp boundary with a **multitude** of sharp boundaries (the precisifications).
  2.  **Adds** new theoretical entities (the set of precisifications, the supervaluation function).
  3.  **Struggles** with defining the key concept of "admissibility" without vagueness.
  4.  **Faces** the crippling problem of higher-order vagueness, which often forces it into ontologically complex hierarchical structures to avoid reintroducing sharp boundaries at higher levels.

  Therefore, **supervaluationism should not be automatically preferred on grounds of ontological economy alone**. Its avoidance of epistemicism's central implausibility comes at the significant cost of introducing its own complexities and potential ontological burdens, particularly concerning higher-order vagueness. The choice between the theories often involves a trade-off: accepting an implausible *epistemic* limitation (epistemicism) versus accepting a more complex *semantic* apparatus with its own challenges (supervaluationism). Neither clearly wins the economy argument outright.
