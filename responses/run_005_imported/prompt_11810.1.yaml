  First, I need to confirm the historical facts. Hobbes claimed to square the circle in the 1650s. Wallis, a prominent mathematician, refuted him. Their feud lasted decades. Wallis admitted his motives were partly ideological, opposing Hobbes's materialism. The impossibility proof came much later with Lindemann.

  The user's main point is valid: without the impossibility proof, mathematicians couldn't be certain Hobbes was wrong. But they could identify flaws in his specific constructions. Hobbes's methods were elementary, using only straightedge and compass, which was known to be insufficient for the problem even then. Wallis and others pointed out errors in Hobbes's proofs, like assuming false properties of curves. So while they couldn't prove it impossible, they could show Hobbes's attempts failed.

  The user compares this to the Galileo affair, suggesting Wallis's victory is retroactive vindication. But there's a key difference: Galileo's evidence supported his theory, while Hobbes's proofs were objectively flawed. Wallis's ideological motives don't negate the mathematical errors he identified. The "standard story" of Wallis winning is based on Hobbes's repeated failures to provide a valid proof, not just the impossibility.

  Regarding Hobbes's philosophy, his insistence on geometry as the model for knowledge is crucial. For Hobbes, true knowledge required deductive certainty, like geometry. Admitting error in geometry would undermine his entire philosophical system. So his stubbornness wasn't just ego; it was about maintaining the foundation of his materialism and political philosophy.

  The user is trying to fit Hobbes into a narrative of persecuted truth, like Semmelweis or Galileo. But Hobbes's case is different because his proofs were incorrect, and his resistance was philosophical. The user might be overemphasizing the lateness of the impossibility proof, not realizing that mathematicians could still debunk specific attempts. Also, Hobbes's philosophy required geometric certainty, making his position untenable when his proofs failed.

  The user's deeper need might be understanding how ideology influences scientific disputes and recognizing when dissent is valid versus misguided. They might also seek to reconcile Hobbes's philosophical contributions with his mathematical failures. Clarifying the distinction between the impossibility proof and refutation of specific errors is key. Highlighting Hobbes's philosophical stakes helps explain his persistence beyond mere stubbornness.
answer: |-
  You've hit on a fascinating and complex historical episode that perfectly illustrates the messy intersection of mathematics, philosophy, politics, and ego in the 17th century. Your skepticism about the "standard story" is well-placed, but the reality involves important nuances. Let's break down the key points:

  **1. The Mathematical Reality: Could Hobbes Have Been Right?**

  *   **Your Core Point is Valid:** Absolutely. Lindemann's 1882 proof of the transcendence of π definitively settled the impossibility of squaring the circle with straightedge and compass. Before that, it *was* an open problem. No 17th-century mathematician could *prove* Hobbes was fundamentally *impossible* to be correct.
  *   **Why Hobbes Was Still Wrong (Specifically & Objectively):** While the *general* impossibility wasn't provable yet, mathematicians like Wallis *could* (and did) definitively prove that *Hobbes's specific constructions were mathematically flawed*. Hobbes didn't just claim he'd done it; he published specific geometric constructions and arguments. Wallis meticulously dissected these, showing:
      *   **Logical Errors:** Hobbes made faulty deductions, misapplied theorems (especially from Euclid), and introduced assumptions not justified by his axioms.
      *   **Misunderstanding Curves:** Hobbes struggled with newer concepts like infinitesimals and the nature of curves (e.g., cycloids, conic sections), leading him to make incorrect claims about lengths and areas.
      *   **Elementary Mistakes:** Sometimes, his errors were surprisingly basic, like misidentifying similar triangles or misapplying the Pythagorean theorem.
      *   **Moving Goalposts:** When refuted, Hobbes often introduced slightly modified constructions, which Wallis then refuted again. None ever withstood scrutiny.
  *   **The State of Knowledge:** By the 1650s, the *difficulty* and likely impossibility of squaring the circle were widely recognized among leading mathematicians. The problem had been attacked unsuccessfully for millennia. Wallis himself had proven that certain classes of curves *couldn't* solve it algebraically. While not a general proof, it showed the depth of the problem. Hobbes's methods, relying heavily on elementary Euclidean geometry, were seen as fundamentally inadequate by experts.

  **2. Wallis's Motives: Math vs. Philosophy/Politics**

  *   **You are Correct About Wallis's Agenda:** Wallis was explicit that his attacks on Hobbes were partly motivated by his profound opposition to Hobbes's materialist philosophy (laid out in *Leviathan* and *De Corpore*), which Wallis (and many others) saw as inherently atheistic and politically dangerous (undermining church and monarchy).
  *   **Not *Purely* Mathematical:** Wallis admitted he wouldn't have engaged so intensely if Hobbes hadn't been such a prominent philosophical adversary. He saw discrediting Hobbes's geometry as a way to discredit his entire philosophical system. The pamphlets were often vicious and personal.
  *   **But Still Mathematically Sound:** Crucially, **Wallis's *mathematical refutations* were generally correct and recognized as such by the mathematical community.** His expertise was undeniable. While his *motivation* for the feud was partly ideological, the *content* of his mathematical criticisms was valid. Other mathematicians (like Huygens) also independently found Hobbes's proofs faulty. Wallis used his mathematical authority as a weapon in a broader ideological war, but the weapon itself was mathematically real.

  **3. The "Wallis Obviously Won" Narrative: Retroactive Vindication?**

  *   **Partly, But Not Entirely:** Yes, Lindemann's proof centuries later provides a satisfying, definitive endpoint that retrospectively confirms Wallis was on the "right side" mathematically. This *does* lend a gloss of inevitability to the historical narrative.
  *   **However, Wallis "Won" *Contemporaneously* Too:** Hobbes lost the argument *in the 17th century* based on the evidence available *then*. The mathematical community (in England and Europe) overwhelmingly sided with Wallis *at the time* because:
      *   Hobbes's proofs were demonstrably flawed upon examination.
      *   Hobbes failed repeatedly to produce a valid proof despite decades of trying and being shown his errors.
      *   Wallis, as Savilian Professor, represented mathematical orthodoxy and expertise.
      *   Hobbes's increasing bitterness and ad hominem attacks undermined his own credibility.
  *   **Mirror of Galileo? Not Quite:** The Galileo comparison is tempting but imperfect.
      *   **Galileo:** Had compelling *empirical* and *physical* evidence supporting heliocentrism against a dominant *theological/philosophical* orthodoxy with *weak* counter-evidence. The Church suppressed ideas backed by observation.
      *   **Hobbes:** Had *mathematical* claims that were *objectively disproven* using the *accepted mathematical standards* (Euclidean rigor) of his time by the leading *mathematical* authority. His philosophy was suppressed *using* valid mathematical criticism as a tool. It wasn't that his math was suppressed for ideological reasons *despite* being correct; his incorrect math was used (enthusiastically) to attack his ideology.

  **4. Hobbes's Stubbornness: Ego vs. Philosophical Bedrock**

  This is crucial. It wasn't *just* ego (though there was plenty of that!). His geometric foundationalism was absolutely central:

  1.  **Geometry as the Model:** For Hobbes, geometry was the *only* true science because it proceeded deductively from clear definitions and first principles (motion and magnitude) to incontrovertible conclusions. This was the model for *all* genuine knowledge, including his political philosophy (*Leviathan*).
  2.  **De Corpore:** *De Corpore* ("On Body") was the first part of his philosophical trilogy. It aimed to ground *everything* – physics, human nature, politics – in the science of bodies in motion, starting with geometry. Geometry wasn't just a branch of math; it was the *foundation* of his entire materialist system.
  3.  **The Stakes Were Existential:** If his geometric proofs were fundamentally flawed, it called into question the very method and certainty of his entire philosophy. Admitting he couldn't square the circle, or that his proofs were wrong, wasn't just admitting a math error; it risked collapsing the epistemological foundation of *Leviathan* and his materialism. His refusal to back down was a desperate defense of the core methodology of his life's work.
  4.  **Deductive Certainty:** Hobbes believed true philosophy *must* yield the same certainty as geometry. His political absolutism in *Leviathan* derived its force from this claim of deductive necessity. Failure in geometry directly threatened this claim.

  **Conclusion: Separating the Threads**

  *   **Hobbes was Mathematically Wrong (Specifically):** His constructions were objectively flawed by the mathematical standards of his time (and ours). Wallis correctly identified these flaws.
  *   **The *General* Impossibility Was Open:** You are right that 17th-century mathematicians couldn't *prove* squaring the circle was impossible. They *could* only show specific attempts failed. Wallis's certainty stemmed from the recognized extreme difficulty and the demonstrable failure of all attempts, especially Hobbes's elementary ones.
  *   **Wallis's Motives Were Mixed:** His attack was absolutely a political/ideological hit job *using* mathematics as the weapon. He saw Hobbes as a dangerous enemy beyond geometry.
  *   **Wallis Won Contemporaneously & Retrospectively:** He won the argument in the 1650s-1670s because his math was sound and Hobbes's wasn't. Lindemann's proof centuries later provided the ultimate vindication of the *mathematical consensus* Wallis represented, not just Wallis personally.
  *   **Hobbes's Stubbornness Was Philosophical:** His 20-year refusal wasn't mere ego (though present). It was a desperate, ultimately doomed, defense of the geometric-deductive method that underpinned his entire materialist and political philosophy. Admitting defeat in geometry was admitting defeat for his system's foundational epistemology.

  **So, are you onto something? Absolutely.** You've correctly identified the ideological fervor driving Wallis and the fact that the impossibility wasn't proven then. However, the "standard story" holds because Hobbes's *specific* mathematical claims *were* definitively refuted *at the time* using the tools available. The feud is a powerful example of how "purely" intellectual disputes are almost always entangled with personality, ideology, and power. Hobbes wasn't a Semmelweis-like figure tragically ahead of his time in math; he was a brilliant philosopher stubbornly defending a flawed mathematical cornerstone of his system against valid criticism wielded by an ideologically motivated, but mathematically superior, opponent. The "Galileo gambit" doesn't quite fit because Galileo had empirical evidence suppressed by dogma, while Hobbes had dogma (his geometric foundationalism) disproven by mathematical evidence.
