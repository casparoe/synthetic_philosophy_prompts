answer: |-
  ## The Unforgivable Calculus: Defending Anscombe's Absolutism Against Truman's Choice

  G.E.M. Anscombe’s denunciation of Oxford’s honorary degree for Harry Truman, based solely on the atomic bombings of Hiroshima and Nagasaki, presents a stark, uncompromising moral challenge. Her verdict—that Truman committed mass murder by intentionally targeting civilians as a means to victory—is an absolutist stance grounded in the Doctrine of Double Effect (DDE) and a rejection of consequentialist justification. While the historical context and the horrific projected costs of alternative actions exert immense pressure to exonerate Truman, Anscombe’s core principle—the absolute prohibition against *intentionally* killing the innocent—remains defensible and essential, even amidst the fog of war. The bombings crossed a moral line that consequentialist calculations, however grim, cannot erase.

  **The Core of Anscombe's Case: Intentionality and Double Effect**
  Anscombe’s argument hinges on the DDE’s crucial distinction:
  1.  **Permissible:** Foreseeing but not intending civilian deaths as a *side effect* of a legitimate military action against a combatant target (e.g., bombing a munitions factory knowing nearby homes will be hit).
  2.  **Impermissible (Murder):** Intending the death of civilians *as the means* to achieve a military objective (e.g., bombing civilians to terrorize a population into surrender).

  For Anscombe, Truman’s decision fell squarely into the second category. The bombs were dropped on entire cities. The explicit purpose, articulated in internal discussions and evident in target selection, was to shock the Japanese government and populace into immediate surrender by demonstrating unprecedented, indiscriminate destructive power. Civilian deaths weren't an unfortunate byproduct; they were the *instrument* of coercion. As she argued, no calculation of lives potentially saved (American soldiers, Japanese who might die in an invasion, or even Japanese civilians who might starve in a prolonged war) could morally redeem this deliberate choice to use the killing of innocents as a weapon. The act itself was intrinsically evil.

  **The Consequentialist Counter: Necessity and the Lesser Evil**
  The most potent challenge to Anscombe comes from consequentialism and the historical narrative of necessity:
  1.  **The Invasion Scenario:** Projections for Operation Downfall, the planned invasion of Japan, predicted catastrophic casualties: hundreds of thousands of Allied soldiers and potentially *millions* of Japanese military and civilians, due to fierce resistance, kamikaze attacks, and widespread starvation. The bombs, it is argued, swiftly ended the war, saving far more lives than they took (approx. 200,000 died in the bombings by 1945, though long-term casualties were higher).
  2.  **Targeting Nuance?** Defenders argue Hiroshima and Nagasaki *were* legitimate military targets: Hiroshima housed the 2nd General Army HQ and significant troop concentrations; Nagasaki was a major port and industrial center (e.g., Mitsubishi shipyards). While civilian casualties were inevitable and massive, the *primary* intent, they claim, was to destroy military infrastructure and war-making capacity, with civilian deaths foreseen but not directly *intended* as the means.
  3.  **The "Only Choice" Narrative:** Facing a fanatical enemy refusing unconditional surrender, and with the Soviets poised to enter the Pacific War, Truman is portrayed as having no viable alternative. The bombs were the "lesser evil" compared to the apocalyptic alternative.

  These arguments carry immense weight. The potential human cost of an invasion was horrifyingly real, and the desire to end the war swiftly is understandable. Consequentialism compels us to weigh outcomes, and by its calculus, the bombings "worked."

  **Why Anscombe's Absolutism Holds: Defending the Verdict**
  Despite the force of the consequentialist case, Anscombe’s absolutist verdict remains defensible for several critical reasons:

  1.  **The Inescapable Intentionality:** The historical record strongly supports Anscombe's reading of intent. The Target Committee explicitly prioritized psychological impact and visual demonstration over pure military value. Cities were chosen partly *because* they were relatively untouched, ensuring the bomb's effect would be starkly visible. Secretary of War Stimson's removal of Kyoto (a cultural center) highlights awareness of targeting civilians *as such*; Hiroshima and Nagasaki were deemed acceptable *because* their civilian populations were integral to the terror strategy. The very logic of atomic deterrence rests on the threat of *civilian* annihilation. Truman knowingly chose a weapon and a tactic where civilian extermination was the direct mechanism for achieving surrender.
  2.  **The Slippery Slope of Consequentialism:** Accepting the Hiroshima/Nagasaki justification establishes a perilous precedent. If intentionally killing tens or hundreds of thousands of innocents is permissible when the stakes are high enough, where is the line? What future atrocity could *not* be justified by a sufficiently dire projected alternative? Anscombe rightly feared the erosion of the fundamental moral prohibition against targeting non-combatants. The firebombing of Tokyo (which killed more immediately than Hiroshima) already demonstrated this normalization of civilian mass killing; the atomic bombings represented its apotheosis.
  3.  **The Corruption of the Agent:** Consequentialism focuses on outcomes, but Anscombe (drawing on virtue ethics and natural law) emphasizes the moral character of the *act itself* and the *agent*. Intentionally killing the innocent corrupts the moral agent and society that condones it, regardless of the outcome. It violates a fundamental duty owed to fellow human beings. Truman’s order crossed this Rubicon.
  4.  **Questionable Necessity:** While the invasion projections were grim, the historical "necessity" is contested. Was Japan truly on the brink of surrender? Were alternatives like a demonstration blast, guaranteeing the Emperor's status, or awaiting Soviet entry genuinely exhausted? Even if the bombings hastened the end, the *intentional* choice of mass civilian killing remains distinct from actions taken with the *foreseen but unintended* consequence of civilian death while pursuing legitimate military objectives. Nagasaki, dropped only three days after Hiroshima before Japan could fully process the first event, further undermines the "last resort" argument and emphasizes the use of civilian slaughter as a blunt instrument of terror.

  **Verdict: Truman Guilty, Absolutism Essential**

  Anscombe’s verdict stands. Truman, by authorizing the use of atomic weapons on cities with the explicit intent of leveraging mass civilian annihilation to compel surrender, committed an act of mass murder. The horrific projected costs of an invasion, while explaining the immense pressure Truman faced, do not transform the intrinsically evil *means* he chose into a morally permissible act. The DDE distinction holds: foreseeing massive civilian casualties while attacking a purely military target in a remote location would be tragic but potentially defensible; intentionally destroying cities *because* their destruction would terrorize a nation into submission is not.

  **The Enduring Place of Absolutist Constraints**

  This case powerfully demonstrates why absolutist constraints, like the prohibition against intentionally targeting non-combatants, are not relics but vital pillars of the ethics of war. Consequentialism, while necessary for evaluating proportionality and necessity *within* moral bounds, is dangerously insufficient and corrosive when used to *dissolve* those fundamental bounds. Without such constraints:

  *   **Moral Navigation Fails:** War becomes pure calculus, where any atrocity is potentially justifiable by a sufficiently grim counterfactual. Human dignity is reduced to a variable in an equation.
  *   **Accountability Vanishes:** Perpetrators can always claim they acted for the "greater good," shielding themselves behind speculative outcomes.
  *   **Civilian Vulnerability Skyrockets:** Non-combatants lose their protected status, becoming mere instruments or obstacles in military strategy.

  Anscombe’s protest was not naive pacifism; it was a fierce defense of the line that separates just war from barbarism. Hiroshima and Nagasaki stand as horrific proof of what happens when that line is crossed, even—perhaps especially—for seemingly compelling reasons. The absolutist constraint against intentionally killing the innocent is not a luxury for peaceful times; it is the essential moral barrier preventing warfare from descending into total, nihilistic savagery. To honor Truman was, as Anscombe argued, to honor the abandonment of that barrier. Her verdict, though demanding and uncomfortable, remains a necessary beacon in the darkest ethical terrain.
