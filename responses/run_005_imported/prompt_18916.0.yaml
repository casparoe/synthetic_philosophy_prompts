answer: |-
  Here’s a rigorous argument against teleosemantic determinacy for innate detectors, using the frog’s fly-snapping reflex. It targets the core claim that selection history fixes content, showing how evolutionary functions collapse into indeterminacy:

  ### Argument: The Frog Detector’s Indeterminate Content
  1. **The Teleosemantic Premise**:  
     Teleosemantics (Millikan/Dretske) holds that a trait’s *proper function* — and thus the content of its outputs — is fixed by *historical selection*. The function is what the trait was *selected for* in its evolutionary past.  

  2. **The Frog’s Reflex**:  
     Frogs snap at flies, but also at BB pellets, beads, or any small, dark, moving object (SDMO). Teleosemantics must assign content to the detector mechanism: e.g., "fly" or "SDMO".  

  3. **The Ancestral Correlation Problem**:  
     In the environment where the snapping reflex evolved (*E*), flies were the primary fitness-relevant SDMOs. Flies:  
     - Caused nutritional payoff when snapped.  
     - Were *coextensive* with SDMOs in *E* (i.e., all flies were SDMOs, and all fitness-relevant SDMOs were flies).  
     Crucially, **no selection pressure differentiated "fly" from "SDMO"** because they were identical in extension in *E*.  

  4. **Selection For Correlation, Not Essence**:  
     Evolution selects mechanisms based on *correlates of fitness*, not metaphysical categories. The detector was selected because its response to *SDMO* reliably correlated with capturing *flies* (the fitness payoff). The trait’s success depended **only** on tracking the *proxy property* (SDMO), not on representing flies *as such*.  

  5. **The Indeterminacy Dilemma**:  
     - **Option 1**: Claim the content is "fly".  
       *Problem*: The detector was never selected *for detecting flies* **distinct from detecting SDMOs**. Flies were merely the *local instance* of SDMO in *E*. Selection operated on the mechanism’s sensitivity to SDMO — not an abstract "fly" category.  
     - **Option 2**: Claim the content is "SDMO".  
       *Problem*: This admits the content is disjunctive (flies, beads, pellets) and *not* fixed to the distal object (fly). Teleosemantics fails to naturalize "aboutness".  

  6. **Why "Appeal to Ancestral Environment" Fails**:  
     Teleosemantics might argue: "In the *normal* ancestral environment, SDMOs *were* flies, so content is 'fly'."  
     - **Rebuttal**: "Normality" is defined by selection history. But since selection targeted *SDMO-tracking* (the reliable correlate of reward), not fly-tracking *per se*, "normal" conditions only specify SDMO-rich contexts — **not** fly-specific content. The function is "detect whatever SDMOs were present in *E*" — which is still indeterminate between flies or SDMOs.  

  7. **The Selection-History Disjunction**:  
     Teleosemantics replaces "the frog means *fly or bead*" with "evolution selected for *fly or SDMO*". This pushes the disjunction problem to the evolutionary level:  
     - **What was selected?** A fly-detector? An SDMO-detector? A food-source detector?  
     - All are extensionally equivalent in *E*, so selection history **underdetermines** which description is "correct". Picking one is arbitrary.  

  ### Why This Cuts Deeper Than Standard Critiques
  - **Not About Misrepresentation**: Unlike cases where detectors *error* (cow-in-the-dark), the frog’s reflex works *correctly* when snapping at BBs — if the function is SDMO-detection. Teleosemantics can’t explain why this is "malfunction" without presupposing that "fly" is the *true* content — the very indeterminacy it needs to resolve.  
  - **Innate ≠ Determinate**: Even for hardwired traits, selection operates on correlated properties, not semantic precision. Evolution "sees" fitness payoffs from mechanisms tracking *whatever reliably co-occurs with reward*.  
  - **No Privileged Grain**: Teleosemantics lacks resources to privilege "fly" over "SDMO" or even "nutritive object" — all were true of successful snaps in *E*.  

  ### Conclusion for Your Paper
  Teleosemantics fails to secure determinate content for even the simplest detectors because **evolution selects for correlational success, not semantic reference**. The frog’s reflex was selected for responding to SDMOs-as-fitness-correlates, not for representing flies *as such*. This reduces teleosemantics to a sophisticated correlation theory — reintroducing the disjunction problem at the level of selection history. Determinacy requires semantic constraints *beyond* natural selection.  

  #### Key Sources to Cite/Counter  
  - Millikan (*LTOBC*) would argue selection targets "reproductively established families" (flies), but this assumes a biological kind that was extensionally equivalent to SDMO in *E*.  
  - Dretske (*Explaining Behavior*) might claim the function is "indicating food," but BBs aren’t food — yet the detector’s response is identical.  
  - **Strong Foes**: Neander (*Teleological Theories of Mental Content*) defends determinacy via "most proximate cause," but this ignores that evolution selects for *effects* (nutrition), not causes.  

  This angle shows teleosemantics’ foundational problem: it conflates *what a mechanism was selected to respond to* (SDMOs) with *what philosophers want it to mean* (flies).
