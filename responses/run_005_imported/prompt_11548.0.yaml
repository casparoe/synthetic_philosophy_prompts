prompt: |-
  So here's an actual dilemma I've got, not a made-up case for a seminar. I have a paper that reads like it was AI-generated but I can't prove it, and I've noticed I'm totally happy telling my TA over coffee 'I know Jordan didn't write this,' but I would never put that sentence in the report I send to the academic integrity office, where getting it wrong could get a kid expelled. Everyone treats pragmatic encroachment and epistemic contextualism as basically the same 'stakes affect knowledge' move, but their not the same claim, and I want to actually think it through instead of hand-waving. Can you lay out the most important implications of each view, taken on its own terms, for how much evidence I need before I'm entitled to say I 'know' Jordan cheated - and use my case to show where the two views actually come apart, not just where they happen to agree?
