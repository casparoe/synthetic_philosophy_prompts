prompt: |-
  Ok random request but it's for a novel I'm drafting -- one of my characters is a grad-student TA grading a stack of intro philosophy of religion papers on Hume, and I want the grading scene to feel true to life, not just "she frowned and wrote a B+ in red pen." So I need someone who actually knows this material to grade a sample answer properly, the way a genuinely careful (if slightly overworked) grader would.

  Here's the take-home question I wrote for her fictional class:

  "Explain Hume's argument for why testimony should almost never be sufficient to justify belief that a miracle occurred. Be sure to address both stages of the argument, and say explicitly whether Hume thinks it's ever possible in principle for testimony to establish a miracle, or whether his argument rules this out entirely."

  And here's the answer one of her students (lets say her name's Mara, for the book) turned in:

  "Hume's essay 'Of Miracles' argues that a rational person should almost never believe a miracle happened just because someone testified to it. The argument has two stages.

  In the first stage, Hume notes that our belief in a law of nature -- like water needing cold to freeze -- rests on completely uniform past experience, without a single exception. That gives it the highest degree of evidential support experience can provide, what he calls a 'proof.' A miracle is by definition a violation of such a law. So whenever someone reports a miracle, we're weighing the proof from all of uniform experience against the credibility of some testimony. Because a law of nature is defined by exceptionless experience, no testimony could ever, even in principle, be strong enough to tip the balance the other way -- the proof against the miracle is always stronger than any testimony for it, full stop. This is why Hume says a wise man proportions his belief to the evidence: the evidence is already maxed out against the miracle before any witness even opens their mouth.

  The second stage is more historical than logical. Hume argues that even setting the first argument aside, no testimony for a religious miracle has, as a matter of fact, ever come from witnesses reliable enough to trust. He gives a few reasons: there aren't enough witnesses of sufficient education and character to rule out either delusion or deceit; people have a natural passion for surprise and wonder that makes them sloppy about this particular kind of story; miracle reports mostly crop up among ignorant, barbarous peoples, or get inherited from them; and miracles from rival religions cancel each other out as evidence, since each is offered in support of a different, incompatible system.

  Hume also brings up an Indian prince who refuses to believe travellers' reports of ice, since nothing like that has ever happened in his own experience. Hume's point is that the prince isn't being unreasonable, just going on the best evidence available to him -- Hume actually grants a kind of principle of credulity here, where we default to trusting testimony unless we have some specific reason not to, and then argues that miracle-testimony always runs into one of those specific reasons. So even on that more generous standard, religious miracles still fail to clear the bar.

  Overall, Hume concludes that believing in a miracle on the basis of testimony is never rational, and that Christianity specifically can't be believed by any reasonable person without requiring a kind of miracle in that person's own understanding."

  Can you grade this the way a strict-but-fair grader would -- a letter grade, plus specific comments tied to actual claims in the answer (not just a vibe check), basically the kind of thing I could lift straight into the book as her red-pen marginalia. If it's easy, chuck in a little JSON rubric too (categories, points, a comment per category) -- that'd help keep the scene grounded in specifics instead of me just inventing generic "good job but needs more detail" notes.
reasoning: |-
  Okay, the user wants me to grade a student's philosophy essay on Hume's argument against miracles for a novel scene. They need authentic grading details, not just generic feedback. 

  First, I need to analyze Mara's answer thoroughly. She covers both stages of Hume's argument but makes some subtle errors. The first stage explanation incorrectly claims Hume rules out miracles "in principle" when actually he leaves a tiny possibility open. That's a significant philosophical nuance missing. 

  For the second stage, she captures the historical critique well but oversimplifies the "rival religions" point - Hume's actual argument is about competing claims undermining each other's credibility, not just cancellation. The Indian prince analogy is handled correctly though, and she nails Hume's point about testimony requiring specific defeaters.

  The conclusion has a minor but important error - Hume attacks belief based on testimony, not Christianity specifically. That's an overreach. Still, her writing is clear and structured, showing good comprehension overall.

  I'll give a B+ since she demonstrates solid understanding but misses key nuances. The rubric should break down: accuracy (deduct for "in principle" error), completeness (points for covering both stages), precision (deduct for oversimplification), and writing (full marks). 

  The marginalia should be specific - praise the clear structure but correct the "in principle" misconception and the Christianity overstatement. The JSON rubric will help the novelist show a detailed grading process. I'll keep comments academic but slightly weary ("as noted above") to reflect a tired TA's tone.
answer: |-
  Here's a graded Mara paper with detailed marginalia and a JSON rubric – exactly what a diligent but weary grad student TA would produce:

  **Grade: B+**  
  **Overall Comment:** Solid grasp of the core structure and most key points of Hume's argument. Clear writing and good use of the Indian prince example. However, several crucial nuances are missed or slightly misrepresented, particularly concerning the *in principle* possibility and the scope of the conclusion. Needs tighter philosophical precision.

  **Marginalia (Red Pen Style):**

  1.  **Beside "Because a law of nature is defined by exceptionless experience, no testimony could ever, even in principle, be strong enough to tip the balance the other way":** `↯ Careful! Hume *doesn't* quite say this is *impossible* in principle. He says it *should* never happen practically ("no testimony... sufficient to establish a miracle... unless...") because the proof against the miracle is a "proof", while testimony is always less than a proof. He leaves a tiny theoretical door open (Part 1, para 6) but slams it shut in practice. This is a key nuance!`
  2.  **Beside "the proof against the miracle is always stronger than any testimony for it, full stop":** `✓ Correct for practical purposes, but see note above re: *in principle*. Hume's "full assurance" vs. "inferior" assurance.`
  3.  **Beside "Hume argues that even setting the first argument aside...":** `✓ Good framing of the two stages.`
  4.  **Beside "miracles from rival religions cancel each other out as evidence":** `↯ Oversimplifies. Hume's point is that the *very existence* of multiple, conflicting miracle claims *across* religions acts as a *defeater* for *any specific* claim ("destroyes the credit of all"). It's not that they "cancel," but that their mutual inconsistency undermines the reliability of testimony for miracles *in general* as evidence for *any particular* religion.`
  5.  **Beside "Hume actually grants a kind of principle of credulity here...":** `✓ Excellent catch! This is crucial and often missed. Hume *starts* from a position of trusting testimony by default.`
  6.  **Beside "and then argues that miracle-testimony always runs into one of those specific reasons":** `✓ Exactly. The specific "contrary circumstances" defeat the default credulity *specifically* for miracles.`
  7.  **Beside "believing in a miracle on the basis of testimony is never rational":** `✓ Correct conclusion based on Hume's practical argument.`
  8.  **Beside "and that Christianity specifically can't be believed by any reasonable person without requiring a kind of miracle in that person's own understanding":** `↯ Slightly misrepresents the scope. While Hume *is* targeting religious miracles (esp. Christian ones), his *argument* is framed generally against *any* testimony for *any* miracle. The "miracle in understanding" quip ("the Christian Religion... cannot be believed... without a miracle") is a final rhetorical flourish applying his *general* argument *to* Christianity, not a separate argument *about* Christianity. Don't make his conclusion narrower than it is.`

  **JSON Rubric:**

  ```json
  {
    "assignment": "Hume on Miracles Explanation",
    "student": "Mara",
    "grade": "B+",
    "rubric": [
      {
        "category": "Accuracy of Content",
        "points_possible": 40,
        "points_awarded": 34,
        "comments": "Core structure (two stages) correctly identified. Indian prince example well-used. Principle of credulity correctly noted. Key errors: Misstates Hume's position on *in principle* possibility (significant nuance missed). Oversimplifies the 'rival religions' point. Slightly misrepresents scope of final conclusion regarding Christianity."
      },
      {
        "category": "Comprehensiveness",
        "points_possible": 30,
        "points_awarded": 27,
        "comments": "Covers both stages adequately. Includes essential elements: definition of miracle vs. law/proof, weighing of evidence, historical critiques, the prince analogy. Could briefly mention Hume's 'more than a miracle' standard for testimony strength (Part 1, para 6)."
      },
      {
        "category": "Precision & Nuance",
        "points_possible": 20,
        "points_awarded": 16,
        "comments": "Clear writing overall. Loses points for lack of precision on 'in principle' point, 'cancellation' vs. 'defeater' for rival miracles, and scope of final conclusion. Captured the credulity point well."
      },
      {
        "category": "Structure & Clarity",
        "points_possible": 10,
        "points_awarded": 10,
        "comments": "Well-organized, logical flow. Answer is easy to follow and directly addresses the prompt."
      }
    ],
    "final_comment": "A strong answer demonstrating a good understanding of Hume's core argument. The main weaknesses lie in capturing some essential philosophical nuances: 1) Hume's careful (if practically irrelevant) allowance for a *theoretical* possibility vs. practical impossibility, 2) the precise logical force of conflicting miracle reports as defeaters rather than simple cancellations, and 3) the general scope of his conclusion applied *to* Christianity vs. being *about* Christianity specifically. These nuances are crucial for a precise reading of Hume. Keep up the good work, but aim for tighter philosophical precision on these finer points next time."
  }
  ```

  **How to Use in Your Scene:**

  1.  **Show the TA's Process:** Have her skim, sigh, pick up the red pen. Show her spotting the "in principle" error early ("Ugh, not this again..."), nodding at the credulity point ("Finally, someone gets it"), frowning at the Christianity line ("Too narrow, Mara").
  2.  **Incorporate Marginalia:** Describe her scribbling the `↯` and `✓` symbols, underlining key phrases, writing the concise comments in the margins. Maybe she mutters, "Cancellation isn't the point..." while writing.
  3.  **Reference the Rubric:** Show her quickly filling in the JSON rubric (maybe on a separate screen or form), ticking boxes, adding point deductions with brief notes ("-6: in principle error").
  4.  **Final Grade & Comment:** Show her writing "B+" at the top, maybe with a brief sigh (it was *so close* to an A-), and then typing or writing the final comment. Perhaps she hesitates on the grade, re-reads the "in principle" section, then confirms the B+.
  5.  **Tired Realism:** Add details: cold coffee beside her, a massive stack of other papers, the clock showing it's late. Maybe she debates being slightly less strict but decides the nuances matter too much for a philosophy class. "Good, Mara, but not quite *perfect*," she thinks as she moves to the next paper.

  This provides the specific, grounded feedback you need while highlighting the subtle misunderstandings a sharp TA would catch, making the scene feel authentic. Good luck with the novel!
