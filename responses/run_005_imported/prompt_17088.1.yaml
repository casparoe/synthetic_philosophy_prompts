answer: |-
  ## Memorandum: Policy Recommendation on Self-Identification for Autism Accommodations

  **To:** Accessibility Services Advisory Board  
  **From:** [Your Name], Student Representative  
  **Date:** October 26, 2023  
  **Subject:** Proposed Policy Update: Interim Accommodations Based on Self-Identification & Documentation for Suspected Autism Spectrum  

  ### Background & Current Dispute
  Our current policy requires a formal clinical diagnosis for autism-related accommodations. Concerns exist regarding barriers: high costs, significant wait times (12-18 months), and evolving clinical understanding of autism – particularly regarding adult, non-male, and internal-experience presentations. Students increasingly present with robust self-identification supported by online community engagement, self-report tools (e.g., RAADS-R, AQ), and lived-experience documentation. They argue clinical criteria often lag behind community understanding and disadvantage those whose presentation diverges from historical norms.

  Board concerns about maintaining the clinical requirement center on potential for strategic self-labeling to gain unfair advantages and the need for objective criteria to adjudicate complex cases.

  ### Analysis: Beyond "Fixed Fact" Assumptions
  Philosophical work on classification (e.g., Ian Hacking) suggests human categories like autism are "moving targets." The "looping effect" posits that the way a group is classified changes how its members understand and present themselves, which in turn reshapes the classification criteria used by experts. Autism exemplifies this: adult autistic self-advocacy has demonstrably influenced recent diagnostic manuals (DSM-5-TR, ICD-11), emphasizing internal experiences (sensory processing, social cognition, masking) alongside observable behavior. This challenges the view that a clinical diagnosis *solely* detects a fixed biological reality that self-identification merely approximates poorly. Rather, diagnosis operates within a dynamic, co-created understanding of autism. Insisting on *only* the clinical gatekeeper role risks excluding those whose valid experiences contribute to the evolving definition itself.

  ### Recommendation: Staged Validation with Interim Support (Pilot Program)
  I propose a **two-stage "Staged Validation with Interim Support" model**, implemented as a **3-year pilot program** starting **Term 1, 2024 (January 2024)**. This balances immediate access with validation and addresses core concerns from both perspectives.

  1.  **Stage 1: Interim Accommodations (Based on Self-Identification & Documentation):**
      *   **Eligibility:** Students seeking autism-related accommodations may submit a **"Self-Identification & Experience Documentation" (SIED) Portfolio**. This portfolio must include:
          *   A detailed personal statement describing their lived experience of autistic traits (sensory, social, communication, repetitive behaviors/interests, need for routine), masking, and functional impacts *specific to the academic environment*.
          *   Completed results from at least **two** validated, widely recognized self-report screening instruments (e.g., RAADS-R, AQ, CAT-Q for masking).
          *   **Optional but encouraged:** Documentation of engagement with autistic communities (online/offline), relevant academic/work history indicating challenges, or prior informal support plans.
      *   **Process:** Accessibility Services (AS) staff, trained in neurodiversity and implicit bias, review the SIED Portfolio in a **collaborative interview** with the student. The focus is on understanding the student's specific needs and functional limitations in the university context, *not* on "proving" autism against outdated criteria.
      *   **Outcome:** If the portfolio and interview demonstrate a clear, consistent narrative of autistic experiences leading to academic barriers, **interim accommodations** (e.g., extended time, reduced-distraction space, note-taking support, flexibility with participation) are granted for **one academic year**. A formal diagnosis is *not* required at this stage.

  2.  **Stage 2: Requirement for Formal Diagnosis (for Continued Accommodations):**
      *   To maintain accommodations beyond the first year, students granted interim status must provide a **formal clinical diagnosis** meeting university standards.
      *   **Support:** The university commits to:
          *   Establishing a dedicated fund to subsidize diagnostic assessments for low-income students utilizing the interim pathway.
          *   Creating and maintaining a vetted list of clinicians known for expertise in diagnosing *adults*, particularly women, non-binary individuals, and those with strong masking abilities.
          *   Providing navigation support for accessing assessments.

  ### Implementation Timeline

  *   **November 2023:** Board approval of pilot framework. AS begins drafting detailed SIED Portfolio guidelines & staff training modules.
  *   **December 2023:** Finalize SIED guidelines, training materials, clinician list, and subsidy fund structure. Communicate new pathway to students (via website, student groups, health center).
  *   **January 2024:** Pilot Program Launch (Stage 1 available).
  *   **January 2024 - December 2024:** Monitor initial uptake, interview processes, and accommodation implementation. Gather anonymized feedback from students and AS staff.
  *   **January 2025:** First cohort requiring Stage 2 (diagnosis) becomes eligible. Track conversion rates and utilization of subsidy/support.
  *   **June 2025 & June 2026:** Mid-pilot reviews: Analyze data (applications, approvals, denials, appeals, diagnosis acquisition, accommodation usage patterns, qualitative feedback). Assess concerns about strategic labeling *empirically*.
  *   **December 2026:** Comprehensive pilot evaluation presented to the Board. Recommendation for permanent policy: continue, modify, or discontinue.

  ### Addressing Concerns Seriously

  *   **Concern (Strategic Self-Labeling):** We take this risk seriously. The SIED Portfolio is not simply a declaration. It requires detailed, consistent self-reflection across multiple instruments and a narrative explaining *specific academic impacts*. The collaborative interview allows AS professionals to probe inconsistencies and assess genuine need. The **one-year limit** for interim status without diagnosis is a crucial safeguard. The pilot will actively monitor for any patterns suggesting abuse. If significant abuse is detected during the pilot, the policy can be adjusted or rescinded.
  *   **Concern (Objective Adjudication/Lack of Principled Basis):** We take the need for fairness and consistency seriously. The SIED guidelines and staff training provide a clear, principled framework focused on **functional impact within the academic setting** and **consistency of self-reported experience**, aligned with evolving best practices in neurodiversity. Adjudication is based on evidence within the portfolio and the collaborative interview, moving beyond solely externally imposed behavioral checklists. Training will emphasize avoiding bias towards specific presentations. Difficult cases will involve senior AS staff review. The requirement for eventual diagnosis provides a longer-term validation mechanism.

  ### Rationale
  This staged approach:
  1.  **Reduces Immediate Barriers:** Provides critical support to students facing prohibitive cost/delay.
  2.  **Aligns with Evolving Understanding:** Respects autistic self-knowledge and the dynamic nature of the category, allowing AS to engage with contemporary presentations.
  3.  **Maintains Accountability:** Incorporates clinical validation as a requirement for *long-term* support, addressing validity concerns.
  4.  **Generates Evidence:** The pilot provides concrete data on feasibility, uptake, potential abuse, and student outcomes, moving the debate beyond hypotheticals.
  5.  **Balances Values:** Prioritizes timely access and inclusion *now* while upholding standards for ongoing support through eventual clinical confirmation.

  This recommendation seeks to move our policy towards greater equity and responsiveness, grounded in a more nuanced understanding of autism as a human kind, while taking legitimate concerns about process integrity seriously through safeguards and rigorous pilot evaluation. I urge the Board to support this pilot program.
