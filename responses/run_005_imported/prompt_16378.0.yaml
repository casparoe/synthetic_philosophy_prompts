  so in my philosophy of religion class we just got through the bit in Ghazali's Tahafut where he goes after the philosophers on causation (the cotton catching fire example, 17th discussion i think?), and it honestly sounded almost word-for-word like Hume on constant conjunction and custom. prof mentioned Hume in passing but didnt really dig into it. can you actually compare the two properly? like what do they genuinely share (the appeal to "custom"/habit, denying we can perceive or prove a necessary connection between cause and effect) vs where they actually come apart underneath. i'm mainly confused bc Ghazali seems to end up at full occasionalism (God just recreating everything each instant, nothing has real causal power in itself) but Hume obviously isn't arguing for that -- so is there something that actually blocks Hume's reasoning from sliding into occasionalism too, or does he just not push his own premises that far? and overall, which of the two do you think has the more defensible position on causation, and why?
