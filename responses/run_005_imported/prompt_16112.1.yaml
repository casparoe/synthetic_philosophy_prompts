  - Enforcement creates blackmail opportunities 
  - Religious objections are irrational in a secular legal system

  That last point is crucial - Bentham was viciously anti-clerical. The user's scene with a bishop is perfect because Bentham would absolutely relish dismantling religious arguments. I should emphasize how he'd frame theology as irrelevant to legislation.

  The user might also not realize how isolated Bentham was on this issue. Even progressive allies like Mill found this position too dangerous. That loneliness could add depth to the character - a radical thinker decades ahead of his time, frustrated by others' irrationality.

