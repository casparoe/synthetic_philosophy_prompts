  Let me unpack why modern rights language would be anachronistic for Bentham. His entire ethical system was built on utility calculus - maximizing pleasure/minimizing pain. He saw rights not as inherent but as legal fictions that should only exist when socially useful. So for him to argue about a "fundamental right to love" would be completely out of character. 

