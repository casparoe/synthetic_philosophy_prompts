prompt: |-
  I'm running a graduate seminar on social ontology this term, and last week we worked through David Lewis's *Convention*. I'd like some help sharpening a comparison for the next session, which turns to the game-theoretic literature on the evolution of norms, before I finalize the discussion questions for my students.

  Lewis analyzes a convention as a regularity in action that solves a recurring coordination problem: everyone conforms, everyone expects everyone else to conform, everyone prefers to conform given that others do, some alternative regularity could equally well have served the same purpose, and — crucially — all of this is common knowledge among the population, a notion Lewis essentially introduces into philosophy for this purpose. My students always balk at that last clause: it seems to commit Lewis to crediting ordinary convention-followers with an infinite hierarchy of higher-order beliefs — I expect you to conform, I expect you to expect me to conform, and so on — that no finite mind actually entertains.

  Brian Skyrms's evolutionary treatment of the same subject matter looks like a rival strategy for reaching the same destination at a fraction of the cognitive cost. On his account, the very same coordination regularities — including Lewis's own signaling conventions — can be driven to fixation by replicator dynamics or simple reinforcement learning, where no party represents anyone else's beliefs at all, let alone achieves common knowledge of them; a shared history of interaction and selection does the work that Lewis assigns to shared cognition. I'd like you to compare the two explanatory strategies in some detail: does Skyrms's dynamical story actually reproduce everything Lewis's account was designed to explain — the arbitrariness of the equilibrium selected, the self-perpetuating expectations that sustain it, the sense in which conforming parties are following a convention rather than each merely doing what happens to be individually best — or does something get lost once common knowledge drops out of the picture? I am particularly interested in whether an evolved regularity can ever be a norm in the sense that carries genuine normative force, something one can be faulted for violating, or whether that normative residue is only available once Lewis's mutual, common-knowledge-backed expectations are in place. Tell me which account is doing more of the real explanatory work in your assessment, and whether the two are ultimately competitors or could be combined so that each covers a different part of the phenomenon.
reasoning: |-
  Okay, the user is teaching a graduate seminar on social ontology and wants to sharpen a comparison between David Lewis's convention theory and Brian Skyrms's evolutionary game-theoretic approach. They've covered Lewis last week and are moving to norms evolution. The key concern is whether Skyrms can replicate Lewis's explanatory power without common knowledge, especially regarding normative force.

  First, I need to recall Lewis's main points. Lewis defines conventions as regularities solving coordination problems, with common knowledge as a crucial component. Common knowledge involves an infinite hierarchy of beliefs: everyone knows, knows that others know, and so on. Students find this unrealistic for finite minds. 

  Then there's Skyrms's evolutionary approach. He uses replicator dynamics or reinforcement learning to explain how conventions emerge without agents needing higher-order beliefs. Shared history and selection replace shared cognition. The user wants to know if this can explain arbitrariness, self-perpetuating expectations, normative force, and whether the accounts compete or complement each other.

  Breaking down the comparison:

  1. **Reproducing Lewis's Features**:
     - **Arbitrariness**: Skyrms handles this well. Multiple equilibria can exist, and evolutionary paths select one based on initial conditions or drift. Like Lewis, any equilibrium could've been chosen, satisfying arbitrariness.
     
     - **Self-Perpetuating Expectations**: Here's a challenge. Lewis's common knowledge creates a network of mutual expectations that sustain conventions. Skyrms's agents react to past interactions, not expectations. The stability comes from learning dynamics, not cognitive states. So, while the regularity persists, it's not due to reciprocal expectations but adaptive behavior. This might lose the intentional aspect Lewis emphasized.

     - **Following a Convention vs. Individual Best**: Lewis distinguishes between mere convergence and normative convention. Skyrms's agents adapt to successful strategies, so their actions are individually optimal given the population. Without mutual expectations, it's more about adaptation than recognizing a social norm. This blurs the line between convention and habit.

  2. **Normative Force**:
     This is crucial. Lewis's common knowledge underpins normative force because violations break mutual expectations, leading to criticism. Skyrms's framework lacks this. Agents punish deviations if it's evolutionarily stable, but it's not about obligation; it's strategic. The "fault" is pragmatic, not normative. So Skyrms might explain sanctioning but not genuine normativity.

  3. **Explanatory Work**:
     Skyrms excels at explaining the emergence and stability of conventions with minimal cognition, which is more realistic for simple agents or early human societies. Lewis accounts for the cognitive depth of modern conventions, where mutual expectations and reasoning matter. They might complement: Skyrms for emergence, Lewis for mature conventions.

  4. **Compatibility**:
     The accounts aren't mutually exclusive. Skyrms's dynamics could bootstrap conventions, which later develop common knowledge through language and reflection. Lewis's framework then explains the normative aspects as societies evolve. Combining them offers a fuller picture: evolution for origin, common knowledge for persistence in complex societies.

  **User's Deeper Needs**:
  The user wants discussion questions that highlight these tensions. They might also seek to clarify if normative force requires cognitive elements or if evolution suffices. Students might conflate emergence with normativity, so questions should tease out whether Skyrms reduces conventions to behaviors without the "ought" factor.

  **Potential Discussion Questions**:
  - Can a regularity be a norm if agents don't hold mutual expectations? Does punishment in evolutionary models imply normativity?
  - How does the shift from common knowledge to learning dynamics change what we consider a convention?
  - Is there a middle ground where simple expectations (not infinite regress) suffice for normativity?
  - Can these theories be staged: evolution first, then common knowledge?

  **Conclusion**:
  Skyrms provides a parsimonious explanation for emergence but falls short on normative force and the intentional structure of conventions. Lewis's account is cognitively richer but less realistic. Combining them acknowledges that conventions evolve from simple mechanisms to cognitively embedded norms. The real explanatory work depends on context: Skyrms for origins, Lewis for mature conventions.
answer: |-
  Here's a detailed comparison of Lewis's and Skyrms's approaches, structured to address your core questions about explanatory scope, normative force, and compatibility. This analysis should help refine your seminar discussion.

  ### Core Comparison: Lewis vs. Skyrms  
  | **Feature**               | **Lewis's Conventionalism**                          | **Skyrms's Evolutionary Dynamics**                 | **Does Skyrms Reproduce Lewis?** |  
  |---------------------------|------------------------------------------------------|----------------------------------------------------|----------------------------------|  
  | **Cognitive Requirements** | Infinite common knowledge hierarchy (expectations about expectations). Demands high-order cognition. | No belief representation needed. Agents use reinforcement learning or replicator dynamics (stimulus-response). | **Yes, but reductively:** Skyrms avoids cognitive load but loses the *intentional structure* of convention. |  
  | **Arbitrariness**          | Explicit: Multiple equilibria are possible; convention is "arbitrary" because alternatives exist. | **Reproduced:** Evolutionary models show path-dependence (e.g., drift, initial conditions). E.g., signaling games fixate on one arbitrary signal-meaning pairing. | **Full success.** |  
  | **Self-Perpetuation**      | Sustained by mutual expectations: Conformity feeds expectations, which reinforce conformity (reflexive loop). | Emerges from dynamics: Successful strategies replicate; failures extinguish. Stability is attractor-driven, not expectation-driven. | **Partial:** Explains *persistence* but not via *mutual anticipation*. The "loop" is behavioral, not cognitive. |  
  | **Convention vs. Mere Habit** | Conventions are followed *because* agents recognize them as solutions to coordination problems. | Regularities emerge because they work, not because agents understand their function. Conformity is adaptive, not intentional. | **Loss:** Skyrms reduces convention to evolutionary *habit*—no awareness of "alternatives" or collective purpose. |  
  | **Normative Force**        | **Strong:** Violators betray mutual expectations → justifiably faulted. Normativity stems from common knowledge of preferences/expectations. | **Weak:** "Fault" is pragmatic (e.g., punishment in norms games) or evolutionary (lower payoffs). No *deontic* layer—only instrumental success/failure. | **No:** Skyrms explains *sanctioning* but not *obligation*. Lacking mutual expectations, "fault" is efficiency-based, not normative. |  

  ### Key Tensions & Explanatory Gaps  
  1. **Normative Force: The Critical Divide**  
     - Lewis: Normativity arises from the *joint intentionality* embedded in common knowledge. Violating a convention is a failure of *social rationality* (disappointing others' expectations).  
     - Skyrms: "Norms" are evolutionarily stable strategies (ESS). Punishment (e.g., in stag hunt or ultimatum games) evolves because it improves fitness. This explains *compliance* but not the *ought*—e.g., why we feel guilty violating inefficient norms.  
     - **Your question:** For genuine normative residue ("you *should* not violate"), Lewis's mutual expectations seem essential. Skyrms can only deliver *instrumental* normativity.  

  2. **What Lewis Explains That Skyrms Cannot**  
     - The *cognitive depth* of conventions: Why we follow *this* regularity *as a convention* (e.g., driving on the right) rather than merely a successful habit.  
     - How conventions enable novel coordination (e.g., ad-hoc traffic rules during a detour) via *reasoning* about expectations.  
     - **Student takeaway:** Skyrms explains *how* conventions emerge; Lewis explains *what it feels like* to participate in one.  

  3. **What Skyrms Explains That Lewis Cannot**  
     - Origins: How conventions arise *without* pre-existing common knowledge (e.g., proto-language).  
     - Scalability: How norms stabilize in large populations without high cognition (e.g., via imitation).  
     - Empirical realism: Animal signaling, toddler norm-compliance, or cultural drift fit Skyrms better.  

  ### Competitors or Complements?  
  - **Synthesis is possible (and necessary):**  
    - **Stage 1 (Skyrms):** Evolution/learning bootstraps regularities via low-cognition dynamics.  
    - **Stage 2 (Lewis):** Once stabilized, agents *represent* expectations → common knowledge crystallizes, adding normative force.  
  - **Explanatory division of labor:**  
    - Skyrms: Explains *emergence* and *robustness* of behavioral regularities.  
    - Lewis: Explains the *intentional structure* and *normativity* of mature conventions.  
  - **Risk of reductionism:** If Skyrms fully explains stability, is common knowledge an *ex post* rationalization? Lewis would argue normativity requires the cognitive layer.  

  ### Discussion Questions for Your Seminar  
  1. **Normativity Challenge:** Can an evolved behavioral regularity (e.g., a Skyrmsian ESS) ever be *normative*—i.e., ground legitimate criticism of violators—without mutual expectations? Or is "fault" just shorthand for "you reduced your payoff"?  
  2. **Cognitive Thresholds:** Must a convention involve *awareness* of arbitrariness? Skyrms’s agents need not recognize alternatives; does this make their "conventions" fundamentally different?  
  3. **Hybrid Models:** Could Skyrmsian dynamics *create* the conditions for Lewisian common knowledge? (E.g., learning → expectations → codification via language.)  
  4. **Explanatory Priorities:** Which approach better explains real-world conventions: Skyrms’s (studying how norms spread in children/animals) or Lewis’s (decoding adult social reasoning)?  
  5. **Loss Assessment:** If we drop common knowledge, do we lose anything essential to social ontology—e.g., the idea that conventions are *about* collective intentionality?  

  ### My Assessment  
  - **Real Explanatory Work:** Skyrms does heavier lifting for *origins and stability*; Lewis for *meaning and normativity*.  
  - **Ultimate Status:** Complementary but with friction. Skyrms shows how norms *could* arise without cognition; Lewis shows why mature conventions *feel* normative. Combining them (evolution → cognition) offers the fullest picture, but requires explaining how common knowledge emerges dynamically—a frontier question.  

  **Recommendation:** Frame your seminar around whether social ontology *needs* cognition to explain normativity. Push students to dissect if "following a convention" *must* involve expectations (Lewis) or if Skyrms’s adaptive behaviors suffice. The arbitrariness point is Skyrms’s win; the "ought" is Lewis’s stronghold.
