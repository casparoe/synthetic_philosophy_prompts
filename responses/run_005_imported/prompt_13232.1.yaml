prompt: |-
  So this happened at work last month and it's still kind of bugging me, curious what you'd make of it. I'm on a small backend team and we've got this old job-queue service that everyone's kind of scared to touch. Whenever I'm on call I've got this personal habit of manually running a drain script around midnight if the backlog looks like its climbing - it's not in the runbook, nobody ever asked me to do it, I just started doing it about a year ago because it made my mornings easier. One night I was dealing with a family thing and just didn't get to it, same as maybe one night a month when I'm slammed or just forget, and normally nothing bad happens on those nights. This particular night the backlog spiraled and we had a three hour outage for a decent chunk of customers. In the postmortem doc it got written up as a "contributing factor" that I "did not perform the routine mitigation," and a couple people on the review call said some version of "well if you'd done the drain like you normally do, this wouldn't have happened."

  Something about that framing feels off to me but I can't quite nail down why. I didn't DO anything wrong, I just didn't do an optional thing I sometimes do for my own convenience. And if not-doing-the-drain counts as a cause of the outage, it seems like a ton of other people should count as causes too - nobody ever filed the alert on queue depth even though its been brought up in like three retros, the underlying memory leak has been sitting in the backlog with a low priority tag for over a year, and my manager never got budget approved for a second on-call rotation on that service. None of those people show up in the postmortem though. So either not-doing-things can be causes, in which case basically everyone who didn't do something useful that month is on the hook and it feels arbitrary to single me out, or not-doing-things can't really be causes, in which case the postmortem is just wrong to pin any of this on me specifically. My team leads response was basically "come on, common sense says you're at least partly on the hook here," which might be true but doesn't actually explain why. Is there a real principled way to work out whether I've got a legitimate gripe here, or is this just one of those things where you accept some fuzziness and move on?
reasoning: |-
