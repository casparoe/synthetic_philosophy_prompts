  First, the core issue seems to be about responsibility versus voluntary actions. The user created a personal habit of running a drain script that wasn't part of any official procedure. When they didn't do it one night, an outage occurred, and the postmortem listed this as a contributing factor. 

  Hmm, the user feels this is unfair because:
  1. The action was never mandated
  2. Others' inactions (like not fixing alerts or memory leaks) weren't mentioned
  3. They're being singled out despite systemic issues

  The team lead's "common sense" argument isn't satisfying because it lacks principle. Let me think about how to analyze this systematically.

  From an incident analysis perspective, postmortems should focus on systemic failures, not individual blame. The fact that the drain script was needed at all points to deeper problems. The real causes here are:
  - Lack of automated alerting
  - Unfixed memory leak
  - Insufficient on-call coverage
  - No official mitigation procedure

  The user's voluntary action had become an undocumented dependency, which is itself a system failure. When they couldn't perform it, the system lacked resilience.

  I recall Jens Rasmussen's model of system safety - organizations drift into accepting workarounds as normal. That's exactly what happened here. The team normalized relying on an unofficial manual fix.

  The user's frustration about inconsistent accountability makes sense. If "not doing something" is culpable, why only them? Why not those who didn't fix known issues? This selective attribution feels arbitrary.

  Ethically, there's a difference between responsibility (assigned role duties) and moral blame. The user had no official responsibility here. Their voluntary action created an expectation, but that shouldn't translate to obligation.

  Practically, the user needs to either:
  1) Make the drain script official (with documentation and rotation)
  2) Stop doing it entirely to force systemic fixes
  But continuing unofficially is unsustainable.

  The emotional component matters too - they feel unappreciated for past unseen work while being blamed for one missed instance. That's demoralizing and deserves acknowledgment.

  Ultimately the postmortem missed the point by focusing on a symptom rather than root causes. The real lesson should be about formalizing processes and fixing technical debt.
answer: |-
  This situation deserves more than just "fuzziness" – your discomfort is valid. Let's break down why the framing feels off and how to address it systematically:

  ### Core Issues with the Postmortem Framing:
  1. **Converting Voluntary Action into Implied Duty:** 
     - You performed an **unofficial, undocumented mitigation** for personal convenience. By labeling your *inaction* as a "contributing factor," the team retroactively elevated your personal habit to an expected procedure *without your consent or formalization*. This creates a dangerous precedent.

  2. **Ignoring Systemic Root Causes:**
     - The real failure points are glaringly absent:
       - **Unmonitored Critical Metric:** No alert for queue depth despite retro discussions.
       - **Known Defect:** Memory leak deprioritized for over a year.
       - **Resource Gap:** Lack of secondary on-call support.
     - Fixating on your missed manual step distracts from these *engineered* risks.

  3. **Inconsistent Accountability:**
     - If "not doing something" is blameworthy:
       - Why not hold accountable those who didn't implement alerts?
       - Why not cite the manager who didn't secure staffing?
       - Why not mention engineers who deferred the memory leak fix?
     - Selective application of this logic is arbitrary and unfair.

  ### A Principled Framework for Incident Analysis:
  Apply these questions to determine if blame is justified:

  | **Question** | **Applied to Your Case** | **Verdict** |
  |--------------|--------------------------|-------------|
  | **Was this a documented responsibility?** | Not in runbooks; not assigned. | ❌ No obligation |
  | **Was the action part of a formal SLA/SLO?** | No service level depended on manual drain. | ❌ Not required |
  | **Did inaction violate an explicit policy?** | No policy existed for nightly drains. | ❌ No violation |
  | **Was the system designed to rely on this?** | Design flaws forced reliance on an *unofficial* workaround. | ⚠️ **System failure** |
  | **Could the outage have been prevented *without* this action?** | Yes – via alerts, fixes, or better resourcing. | ✅ Root causes ignored |

  **Conclusion:** You have a **legitimate gripe**. The postmortem:
  - Mistook a *symptom* (missed drain) for a *cause*
  - Overlooked *designed fragility* (no alerts, known bugs)
  - Punished *volunteerism* while excusing *structural negligence*

  ### How to Address This Professionally:
  1. **Reframe the Narrative (in writing):**
     > "While I occasionally used the drain script to *mitigate symptoms*, the root causes are:  
     > - Lack of alerting on queue depth (raised in Retros X, Y, Z)  
     > - Unaddressed memory leak (ticket #123, backlogged since 2023)  
     > - Single-threaded on-call coverage  
     > Formalizing the drain as an expected step would be treating a workaround as a solution. I recommend we prioritize the underlying fixes."

  2. **Propose Systemic Solutions:**
     - Automate the drain script as a cron job *temporarily*
     - File a ticket to implement queue-depth alerts (assign owner)
     - Escalate the memory leak to "high priority"
     - Document the need for on-call redundancy in budget planning

  3. **Set Boundaries on Volunteer Work:**
     > "To avoid future ambiguity, I'll discontinue manual drains until we either:  
     > a) Formalize it in the runbook with rotations, or  
     > b) Fix the underlying stability issues."

  4. **Preempt Future Ambiguity:**
     - **Never** make undocumented fixes habitual. Either:
       - Propose formalizing the process *before* doing it regularly, or
       - Let small failures happen to expose systemic flaws.

  ### Why "Common Sense" Fails Here
  Your manager's appeal to "common sense" reflects *outcome bias* – judging decisions based on results rather than context. Hindsight makes your action seem essential, but *before* the outage, it was merely a convenience. Healthy engineering cultures distinguish between:
  - **Accountability for defined duties** (your on-call responsibilities)
  - **Blameless analysis of system gaps** (why the drain was needed at all)

  **Bottom line:** This wasn’t your failure to act – it was the team’s failure to engineer resilience. Use this as leverage to force action on the *real* issues. If resistance persists, consider escalating to engineering leadership with this framework. Tacitly accepting blame here sets a precedent that will haunt you (and others) during future incidents.
