  Hmm. The challenge is making abstract metamathematics visceral. A thesis defense feels perfect—high stakes, natural tension, and a built-in audience for the "how do you know?" question. The protagonist should be human to sidestep robo-tropes, but deeply embedded in formal systems (a grad student in proof theory). The examiner becomes the personified doubt, hammering on the consistency problem.

