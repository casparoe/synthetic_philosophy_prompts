  Names matter. "Cass" for the candidate—short, gender-neutral, avoids stereotypes. "Professor Vance" for the examiner—sharp consonants, feels like a scalpels. "System C" for the formalism—clean, hints at both "core" and "consistent?".

  Setting details: slightly too-warm room, dusty chalk, the scent of old paper. Grounds it. The board becomes the battleground. No futuristic tech; the drama is all in symbols and human faces.

