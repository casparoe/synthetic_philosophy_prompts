answer: |-
  ## The Charity Split: A Dialogue on Cosmic Cooperation

  **Setting:** A cluttered university common room, late at night. Coffee cups litter the table between **Alex (Skeptical Decision Theorist)** and **Ben (Proponent of Evidential Cooperation in Large Worlds)**. The whiteboard is covered in equations and scribbles.

  **Alex:** (Rubbing temples) Ben, I still can't wrap my head around it. Let's take this concrete case you proposed: I run a small charity focused on distributing malaria nets. My budget is tight – saving lives *now*. You're suggesting that because, in a vast or infinite universe, there are countless *other* beings psychologically identical to me running *their* small charities, I should divert *some* of my precious funds towards... say... preserving alien cave paintings on a distant, causally isolated planet? Because *they* might value that? It feels like cosmic charity fraud! I haven't earned an obligation to *their* values.

  **Ben:** It's not about *obligation* in a moral sense, Alex, at least not primarily. It's about *rational self-interest under uncertainty in a large world*. Think like a decision theorist. If the universe is large enough, there are near-copies of "Alex running the malaria charity" facing near-identical choices. Crucially, *your* decision is *evidence* about *theirs*, and vice versa, purely through correlation arising from psychological similarity.

  **Alex:** Correlation isn't causation, Ben. It doesn't create a *mechanism* for cooperation. If I send money to save alien art, it doesn't *cause* my distant twin to send money for malaria nets. There's no feedback loop. It's pure sacrifice on my part for a hypothetical benefit I'll never see or verify. How is that rational? It seems like throwing money into a black hole labeled "Maybe Someone Appreciates This Somewhere."

  **Ben:** Ah, but consider the counterfactual! Suppose *all* psychologically similar altruists *ignore* this correlation. Each says, "My action won't *cause* others to cooperate, so I'll just optimize for my local values." Then, *none* of us redirect funds. The alien art *and* the distant malaria nets favored by others go unfunded by anyone who *might* have cared about them if they knew.

  **Alex:** And? Why should *I* care about alien art *they* value? My utility function cares about *malaria nets preventing human suffering*. Funding alien art directly *lowers* my utility locally, with zero compensatory gain. It's a dominated strategy! Press *my* weakest point: how does evidence about *others'* actions, even if correlated, override the *direct disutility* of acting against my own values *here*?

  **Ben:** (Leans forward) Your weakest point is assuming your local action *only* affects local utility. In a large world, your action is *symptomatic*. If *you* choose to defect – to *not* redirect funds towards causes valued by your correlates – that very choice provides *evidence* that *they* are *also* likely defecting. Because you share the same decision algorithm and inputs! So, by defecting, you get evidence that *no one* is funding *your* secondary values elsewhere. Conversely, cooperating provides evidence that others *are* cooperating, funding *your* secondary values elsewhere.

  **Alex:** Hold on. Are you saying that *my* choice to fund alien art *causes* my twins to fund malaria nets? Because it absolutely does not.

  **Ben:** No! No causation. Pure *evidence*. If you find yourself *choosing* to cooperate, that's evidence that agents *like you* in similar situations *also tend to choose* to cooperate. Your choice reveals something about the *statistical tendency* of your decision-type. So, *if* you cooperate:
  1.  You locally fund alien art (disutility for you).
  2.  But your act of cooperating *evidentially implies* that correlates are *also* likely cooperating, meaning *some* of them are funding *your* secondary values (like malaria nets in distant regions *they* care about but *you* don't access).

  **Alex:** So my disutility from funding alien art is offset by the... *evidential utility*... of knowing it's *likely* that somewhere, someone like me is funding malaria nets in a place *I* can't reach? That sounds incredibly tenuous. How do I quantify this "evidential utility"? How do I weigh the *certain* local cost against the *probabilistic, unverifiable, distant* benefit? Isn't this just wishful thinking dressed up in decision theory? Press *your* weakest point: how do you avoid this collapsing into an arbitrary justification for *any* action, based on the *assumption* that others will magically compensate?

  **Ben:** (Nods thoughtfully) That *is* the crux. The weakest point is justifying the *weight* of the evidential link and avoiding arbitrariness. It relies heavily on two premises: 1) The universe *is* sufficiently large/complex to contain many near-identical decision-makers facing similar choices. 2) Our decision algorithms are sufficiently deterministic/predictable that our choices *are* strong evidence for the choices of correlates. If these hold, the evidential link is real. The arbitrariness is countered by symmetry: *All* rational agents in this class, reasoning the same way, see the *same* evidential incentive to cooperate. It stabilizes. If they all defect, they all get evidence no one cooperates, confirming defection is locally optimal *but globally worse*. Cooperation becomes the self-reinforcing equilibrium *because* of the evidential feedback, even without causation.

  **Alex:** Let me test the symmetry. Suppose I'm *not* fully altruistic. Suppose I slightly prefer *my* local malaria nets getting funded over *distant* ones, even if funded by my twins. Doesn't that break the symmetry? My local action has a *direct*, certain impact *here*, while the distant impact is probabilistic and evidentiary. The scales tip towards defection – keeping *all* my money for *my* nets. Why wouldn't *every* correlate reason the same way, leading back to universal defection?

  **Ben:** Because the *evidential gain* scales with the number of correlates! In a large enough world, the tiny disutility of redirecting a *small* portion of your budget (say, 1%) is potentially outweighed by the massive *evidential expectation* that countless others are redirecting a small portion *their* way, funding countless causes you *do* value secondarily, all over the cosmos. The key is finding a *stable split* – a small contribution you're willing to "sacrifice" locally, knowing it signals cooperation and thus makes it likely you benefit massively from others' small sacrifices elsewhere. The 1% you send to alien art isn't lost; it's an investment in a cosmic cooperation dividend.

  **Alex:** An unenforceable, unverifiable dividend! It requires blind faith in the largeness of the world and the uniformity of reason. What if my correlates *aren't* reasoning this way? What if they're defecting? Then I just wasted my 1% *and* get no benefit. The evidential link only holds *if* enough others are also cooperating. But if everyone suspects others will defect, they defect, and it collapses. It feels like a cosmic prisoner's dilemma where we can't communicate or enforce agreements, and you're suggesting we cooperate based on... a statistical hunch?

  **Ben:** It *is* a cosmic prisoner's dilemma! And the unique feature of the large world is that *your own decision* provides the strongest evidence you have about what *others like you* are deciding. Deciding to cooperate *is* your best evidence that cooperation is happening. Deciding to defect *is* your best evidence that defection is rampant. So, rationally, you should choose the action that, *if* it were the norm (which your choice suggests it might be), leads to the best outcome *for agents like you*. Choosing cooperation makes "Cooperation is widespread" the most consistent world-model with your action. That world-model has higher expected utility *for agents like you* than the world-model consistent with defection.

  **Alex:** (Silent for a moment, staring at the whiteboard) So... in choosing to redirect that 1%, I'm not just *hoping* others do the same. I'm *acting in a way that makes it rationally compelling for me to believe that others like me are probably acting the same way*. And *that* belief... is what gives the action its expected utility. The action *creates* the evidence that justifies it.

  **Ben:** Exactly! It's self-referential and bootstrapping. The rationality comes from the consistency of the world-model your action implies. In a large world populated by similar rational agents, cooperation isn't wishful thinking; it's the decision-theoretic equilibrium that maximizes expected utility *conditional on the evidence your own choice provides*. Defection provides evidence for a worse equilibrium.

  **Alex:** I still feel the cold void of causal isolation. That 1% *is* gone from *my* budget, saving fewer lives *here*, in a way no distant action can ever compensate for *in my local causal sphere*. The 'utility' feels abstract, statistical, almost metaphysical. But... I see the force of the symmetry argument. If the universe *is* that large, and reason *is* that uniform... maybe the statistical expectation is real, even if I can't touch it. Maybe it *is* the hard-nosed implication. But it requires swallowing a very big "if." Let's get more coffee. I need to think about how big that malaria net budget *really* needs to be...

  **(The dialogue ends unresolved, but Alex has been forced to confront the core decision-theoretic argument for cooperation under correlation, while Ben has acknowledged the profound leap of faith required in the underlying assumptions and the visceral loss of local causal efficacy.)**

  **Key Points Explored:**
  1.  **Alex's Weakness Pressed:** Ben forced Alex to confront that rational action isn't solely about local causal consequences; *evidence* about correlated others can be a legitimate input to expected utility calculations in large worlds.
  2.  **Ben's Weakness Pressed:** Alex forced Ben to defend the *weight* and *non-arbitrariness* of the evidential link, the reliance on unverifiable assumptions about the universe and rationality, the challenge of quantifying evidential utility against certain local costs, and the potential instability if the cooperative equilibrium isn't universally adopted.
  3.  **Core Mechanism:** The dialogue clarified the self-referential nature: Your choice provides evidence about the choices of correlates, making the world-model consistent with your choice the one you must use to evaluate its expected utility. Cooperation implies a high-cooperation world, which has high expected utility.
