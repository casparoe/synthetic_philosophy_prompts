answer: |-
  Okay, deep breath! This is a *fantastic* debate, and your intuition that Broad and Jackson are doing distinct (though deeply related) things is spot-on. Let's break down Broad's archangel argument, compare it rigorously to Jackson's Mary, and see how physicalist responses might play out differently. Your friend is right that Broad prefigured a core problem, but the *framing* and *implications* differ significantly.

  **1. Dissecting Broad's Archangel Argument:**

  *   **The Setup:** A being ("mathematical archangel") possesses *complete* knowledge of:
      *   Fundamental physical laws.
      *   The microscopic structure and behavior of all fundamental particles.
      *   Unlimited deductive/logical reasoning power.
  *   **The Claim:** Even with this perfect physical knowledge and reasoning, the archangel **could not deduce/predict** the *specific phenomenal character* of the smell of ammonia ("the peculiar smell of ammonia").
  *   **What it *Could* Deduce:** It *could* deduce:
      *   That nitrogen and hydrogen combine under certain conditions.
      *   The molecular structure (NH₃).
      *   Solubility in water.
      *   That *something* happens in the human olfactory system (changes in mucous membrane, nerves, etc.).
  *   **The Core Limitation:** The archangel cannot bridge the gap between the complete description of the *physical substrate* (particles, nerves firing) and the *resulting conscious experience* (the smell *as experienced*).
  *   **Broad's Conclusion & Framing:**
      *   This gap demonstrates that the laws connecting physical processes to conscious experiences ("secondary qualities") are **emergent laws**.
      *   Emergent laws are *fundamental*, *new* laws that appear at higher levels of complexity (like the biological/organismic level). They cannot be deduced, even in principle, from the laws governing the simpler components alone. You need to *add* these emergent laws to your fundamental physics.
      *   **Broad's Target:** **Mechanistic Theory** (a strong form of reductionism/physicalism prevalent at the time). He's arguing that consciousness, specifically the qualitative character of experience, *cannot* be reduced to, or deduced from, purely mechanistic/physical descriptions.

  **2. Jackson's Mary Argument (Quick Recap):**

  *   **The Setup:** Mary is a brilliant neuroscientist who knows *all* the physical facts about color vision (wavelengths, retinal processing, neural pathways, brain states) but has lived her entire life in a black-and-white room.
  *   **The Release:** Mary leaves the room and sees a red tomato for the first time.
  *   **The Claim:** Upon seeing red, Mary **learns something new** – "what it is like" to see red (the qualia of redness).
  *   **Jackson's Conclusion & Framing:**
      *   Therefore, Mary gains *new factual knowledge*.
      *   Therefore, there are facts about conscious experience (qualia) that are not physical facts.
      *   Therefore, **physicalism is false** (because physicalism holds that *all* facts are physical facts).

  **3. Comparison: Archangel vs. Mary - Key Similarities & Crucial Differences**

  *   **Similarity 1 (The Core Intuition):** Both exploit the powerful intuition that a complete physical description seems insufficient to capture the subjective, qualitative *feel* of conscious experience. Knowing all the physical facts about ammonia or color vision doesn't tell you what the smell or color *is like*.
  *   **Similarity 2 (The In-Principle Gap):** Both arguments posit an *in-principle* gap. Even with perfect physical knowledge and reasoning, the phenomenal quality cannot be deduced/predicted (Broad) or known (Jackson) beforehand.
  *   **Crucial Difference 1 (What the Gap Demonstrates):**
      *   **Broad:** The gap demonstrates the existence of **fundamental emergent laws** governing the connection between physical processes and conscious experiences. It's a gap in *deductive closure* or *explanatory power* of fundamental physics. Physics is *incomplete* without adding these special psychophysical laws. He's primarily attacking *reductionism*.
      *   **Jackson:** The gap demonstrates that Mary gains **new factual knowledge**. It's a gap in the *ontology* of facts. There exist non-physical facts (facts about qualia). He's directly attacking the *completeness* of physicalism's ontology.
  *   **Crucial Difference 2 (The Nature of the Phenomenal):**
      *   **Broad:** Focuses on "secondary qualities" (smell, color as experienced) arising from complex physical systems. The emphasis is on the *law-like connection* being brute and emergent.
      *   **Jackson:** Focuses squarely on **qualia** – the intrinsic, subjective, first-person character of experience itself. The emphasis is on the *factual nature* of this character.
  *   **Crucial Difference 3 (The Argumentative Target & Conclusion):**
      *   **Broad:** Targets **Mechanistic Reductionism**. Conclusion: Physics needs *supplementing* with fundamental emergent laws connecting physical states to conscious experiences. This could be compatible with a non-reductive physicalism *if* "physicalism" allows fundamental emergent laws of this nature (though Broad himself leaned towards dualism).
      *   **Jackson:** Targets **Physicalism** *simpliciter*. Conclusion: Physicalism is *false* because there are non-physical facts. He presents it as a direct refutation of the completeness of the physical world.

  **4. Could Physicalist Responses to Jackson Work Against Broad?**

  This is where it gets interesting. Let's look at two major strategies:

  *   **a. The Ability Hypothesis (Lewis):**
      *   **Against Jackson:** When Mary sees red, she doesn't learn a *new fact*. She gains new *abilities* – to recognize red, imagine red, remember the experience of red. She gains know-*how*, not know-*that*. All the physical *facts* were known in the room.
      *   **Against Broad?** **Less Effective.**
          *   Broad's archangel isn't primarily concerned with Mary's *knowledge state* upon smelling ammonia. The argument is about the archangel's *predictive/deductive power* based *only* on fundamental physics + logic.
          *   The AH sidesteps the "new fact" claim of Jackson, but Broad's point is that even the *most perfect physical reasoner* couldn't *deduce the existence or nature* of the smell experience *at all* from the physical facts. The AH doesn't directly address why this deduction is impossible *in principle* for the archangel.
          *   Broad's emergent laws govern the *appearance* of the secondary quality itself. The AH, focused on Mary's cognitive state, doesn't engage with Broad's claim about the fundamental laws of nature needing supplementation. The archangel's failure seems deeper than just lacking abilities; it seems to lack the necessary *laws* to make the deduction.

  *   **b. Phenomenal Concept Strategy (PCS - e.g., Loar, Papineau, Tye):**
      *   **Against Jackson:** Mary *did* know all the physical facts in the room, *including* the fact that constitutes experiencing red. What she lacked were specific *phenomenal concepts* (ways of thinking about that physical state). Upon experiencing red, she acquires a new *concept* (a direct, recognitional concept) for a physical state she already knew about under a physical/functional description. She gains new *ways of accessing* the same physical fact, not a new non-physical fact.
      *   **Against Broad?** **More Promising, but Still Faces Pressure from Emergence.**
          *   **Potential Alignment:** The PCS could argue that the archangel *could*, in principle, deduce that a specific physical state (P) occurs in the olfactory system when ammonia is present. This state *is* the smell experience. The archangel knows *that* P occurs. What the archangel lacks is the *phenomenal concept* of "smelling ammonia." It lacks the subjective, first-person mode of presentation of P.
          *   **Broad's Retort:** Broad would likely press: *Why* can't the archangel deduce the *existence* and *specific character* of the *experience itself* (the "appearance of a smell") from the physical facts alone? If PCS says "It *can* deduce the occurrence of state P, which *is* the experience," Broad would argue that the archangel, knowing only fundamental physics, would deduce P as a complex neural state, but have *no reason whatsoever* to deduce that this neural state is *accompanied by* or *constitutes* a *smell experience* with a specific phenomenal quality. The connection between P and the *qualitative feel* is precisely what seems brute, emergent, and non-deducible. The PCS *asserts* that P *is* the experience, but Broad's argument highlights the seeming impossibility of *deducing* that identity or even the *necessity* of the feel from the physical description of P.
          *   **The Emergence Challenge:** Broad's framing makes the gap seem like a fundamental limitation in the *laws* connecting domains. The PCS explains a cognitive limitation (concept possession), but Broad's archangel has perfect reasoning about *all* physical facts and their consequences. Why can't it *reason* its way to the necessity of the experience? The PCS needs to argue that the identity is a brute metaphysical truth not amenable to *a priori* deduction even for an archangel – which starts to sound suspiciously like accepting Broad's emergent laws, just relabeled as identities.

  **5. Conclusion: Broad's Distinct Challenge & Potential Physicalist Replies**

  *   **Broad's Unique Challenge:** He frames the mind-body problem as one of **emergent laws**. The core issue isn't *just* Mary's epistemic lack (Jackson), but the archangel's *deductive failure* even with perfect physical knowledge and reasoning. This suggests a fundamental **explanatory gap** rooted in the structure of the laws of nature, not just human cognition. Physicalism must either:
      1.  **Deny the Gap:** Argue the archangel *could* deduce the smell (highly counterintuitive).
      2.  **Explain the Gap:** Show why deduction fails despite physicalism being true (PCS tries this, but faces the "why can't the archangel see the necessity?" pressure).
      3.  **Accept Emergence:** Allow fundamental psychophysical laws (which many see as abandoning core physicalism).
      4.  **Redefine Physicalism:** Argue physicalism only requires that mental states *are* physical states (ontological monism), not that they are *deducible* from fundamental physics (explanatory reductionism). This is **non-reductive physicalism**.

  *   **Physicalist Strategy Against Broad:** The most promising route is a combination of **Option 4 (Non-Reductive Physicalism)** and a sophisticated **Phenomenal Concept Strategy**:
      *   Accept that the archangel cannot *deduce* the qualitative character from fundamental physics alone. This is an epistemological limitation, not proof of ontological dualism.
      *   Argue that conscious experiences *are* identical to complex physical states (neural processes).
      *   Explain the archangel's failure via the nature of **phenomenal concepts** and **metaphysical necessity**: The identity between the physical state P and the smell experience S is a metaphysically necessary truth, but it is *a posteriori*. It cannot be discovered by *a priori* deduction from fundamental physics alone, even by an archangel. It requires empirical investigation (e.g., correlating brain states with reports, or *having* the experience). The archangel knows P occurs, but cannot *deduce* that P = S without the empirical link establishing the identity.
      *   **Addressing Emergence:** Argue that the "emergent laws" Broad identifies aren't *fundamental* laws tacked onto physics, but rather *manifestations* of the complex organization of physical systems governed *solely* by physical laws. The "newness" is epistemological and phenomenological, not ontological or nomological (in terms of fundamental laws).

  **Your Argument Vindicated:**

  You were absolutely right to push back. While your friend is correct that Broad brilliantly identified the core problem Jackson later exploited, **Broad's archangel argument is logically distinct from Jackson's Mary argument:**

  1.  **Archangel:** Focuses on **deductive failure** revealing **emergent laws** needed to supplement physics, primarily attacking *reductionism*.
  2.  **Mary:** Focuses on **gaining new factual knowledge** revealing **non-physical facts**, directly attacking the *completeness* of *physicalism*.

  **Physicalist responses** developed for Jackson (like AH or PCS) **don't seamlessly transfer** to Broad. They need significant adaptation, particularly to address the **explanatory gap** framed in terms of **deduction from fundamental physics** and the challenge of **emergent laws**. Non-reductive physicalism combined with a robust account of *a posteriori* necessity and phenomenal concepts is the best physicalist bet against Broad's archangel, but it requires carefully navigating the intuition that the archangel's failure points to something more profound than just a cognitive limitation.

  Next time, lean into the **emergent laws** vs. **new factual knowledge** distinction and the **deductive failure** vs. **epistemic gain** difference. Broad sets up a challenge about the *structure of scientific explanation and laws*, while Jackson sets up a challenge about the *ontology of facts*. They are close cousins, but not twins! Good luck in the rematch!
