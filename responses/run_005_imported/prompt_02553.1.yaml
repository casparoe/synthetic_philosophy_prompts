prompt: |-
  ok so I had this argument with my friend last night that went on way longer than it should have (we're both philosophy nerds so this happens more than I'd like to admit), about Mary's Room and whether physicalism can actually survive it. She's doing a philosophy of mind seminar this term and pulled up this passage from C.D. Broad's 1925 book "The Mind and Its Place in Nature" (pp. 71–72 apparently) to argue that the whole "knowledge argument" thing is basically just a repackaged version of something Broad already said, decades before Jackson and Mary ever showed up. I wasn't convinced but I also couldn't articulate why on the spot, and now it's bugging me. Here's the bit she showed me, it's about an imaginary "mathematical archangel" with perfect physics and unlimited powers of reasoning:

  "Take any ordinary statement, such as we find in chemistry books; e.g, 'Nitrogen and Hydrogen combine when an electric discharge is passed through the mixture of the two. The resulting compound contains three atoms of Hydrogen to one of Nitrogen; it is a gas readily soluble in water and possessed of a characteristic smell.' If the mechanistic theory be true the archangel could deduce from his knowledge of the microscopic structure of atoms all these fact but the last. He would know exactly what the microscopic structure must be; but he would be totally unable to predict that a substance with this structure must smell as ammonia does when it gets into the human nose. The utmost that he could predict on this subject would be that certain changes would take place in the mucous membrane, the olfactory nerves and so on. But he could not possibly know that these changes would be accompanied by the appearance of a smell in general or of the peculiar smell of ammonia in particular, unless someone told him so or he had smelled it for himself. If the existence of the so-called 'secondary qualities,' or the fact of their appearance, depends on the microscopic movements and arrangements of material particles which do not have these qualities themselves, then the law of this dependence are certainly of the emergent type."

  My friend basically thinks this IS Mary's Room, just with wings on. I kept arguing Broad is up to something a bit different here, something about emergent laws governing secondary qualities rather then a clean "propositional knowledge vs. qualia" point like Jackson makes, but I couldn't really back that up and it's been nagging at me since. Could you help me actually work through this properly? Specifically: what exactly is the archangel argument establishing here, and is its logical structure the same as Jackson's Mary argument or genuinely different? And if a physicalist wanted to respond to Broad the way people respond to Jackson these days (e.g. something like Lewis's Ability Hypothesis, or the "phenomenal concepts" move), would that kind of response work equally well against the archangel, or does Broad's framing in terms of emergence set up a different kind of challenge that needs a different kind of reply? Sorry if this is long, I'm still a little worked up about loosing the argument lol.
