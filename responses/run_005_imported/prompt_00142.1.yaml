  When evaluating how to divide the $80,000 offer from the competitor, it's important to first define the relevant "disagreement point" or fallback option, as this sets the baseline for what each of you would receive if no agreement is reached. The disagreement point is not simply keeping your separate inventories (worth $10,000 to you and $4,000 to your partner) because both of you have a better alternative: selling your shares independently for up to $50,000 (for you) and $20,000 (for her). This is known as the Best Alternative to a Negotiated Agreement (BATNA), and it should be used as the reference point because it represents what each of you can realistically achieve without the joint deal.

  - Your BATNA: $50,000 from selling your inventory independently.
  - Her BATNA: $20,000 from selling her inventory independently.
  - Combined BATNA: $70,000 ($50,000 + $20,000).

  The competitor's offer of $80,000 for the combined assets (inventory and customer list) represents a $10,000 surplus over the combined BATNA ($80,000 - $70,000 = $10,000). This surplus arises from the synergies of selling the business as a whole, including the customer list, which has little or no value when sold separately.

  ### Evaluating the Approaches
  - **Your partner's approach (equal split of surplus above fallback)**: She proposes using the keep-inventory values ($10,000 for you, $4,000 for her) as the fallback, which sums to $14,000. The surplus would then be $80,000 - $14,000 = $66,000, split equally, giving you $10,000 + $33,000 = $43,000 and her $4,000 + $33,000 = $37,000. However, this is unreasonable because your BATNA ($50,000) is higher than $43,000—meaning you would be worse off accepting this division compared to selling alone. This approach ignores the better outside option and unfairly disadvantages you. If the BATNA were used instead, her method could work: splitting the $10,000 surplus equally would give you $55,000 and her $25,000. But as stated, her proposal uses the wrong fallback.

  - **Your approach (share reflecting closeness to best-case)**: You suggest dividing the $80,000 based on how close each of you can get to your best-case (BATNA) values of $50,000 and $20,000. This is vague, but if interpreted as splitting proportionally to BATNA, you would get ($50,000 / $70,000) × $80,000 ≈ $57,143 and she would get ($20,000 / $70,000) × $80,000 ≈ $22,857. This gives you a larger share of the surplus ($7,143 above your BATNA vs. $2,857 for her), but it may not be fair because the $10,000 surplus comes from the joint customer list, which is a shared asset. Splitting proportionally to BATNA implies that your contribution is inherently more valuable, but the surplus is due to the combination, not individual assets. This could lead to resentment or a breakdown in negotiations, as she might reject it (she gets only slightly more than her BATNA, while you gain more).

  ### The More Reasonable Approach: Equal Surplus Split Using BATNA
  The most reasonable method is to:
  1. **Use the BATNA as the disagreement point** ($50,000 for you, $20,000 for her), as this reflects what you would each get if the joint deal falls through and you sell separately.
  2. **Calculate the surplus**: $80,000 - ($50,000 + $20,000) = $10,000.
  3. **Split the surplus equally**: Each gets $5,000 of the surplus, resulting in:
     - You receive: $50,000 + $5,000 = $55,000.
     - She receives: $20,000 + $5,000 = $25,000.

  This approach, based on the Nash bargaining solution (a standard fairness concept in negotiations), ensures:
  - **Equal absolute gain**: Both of you benefit by the same amount ($5,000) above your BATNAs.
  - **Fairness for shared synergy**: The $10,000 surplus comes from the joint customer list, which is a common asset, so splitting it equally accounts for neither party contributing more to this synergy.
  - **Stability**: You both get more than your BATNA, making agreement likely. You receive $55,000 (better than your $50,000 BATNA), and she gets $25,000 (better than her $20,000 BATNA).

  ### Why This Is Better
  - **Avoids the pitfall of the keep-inventory fallback**: Using $10,000/$4,000 undervalues your positions, as selling separately is a credible threat.
  - **Addresses your concern about "closeness to best-case"**: With equal surplus, you both gain equally in absolute terms, and you end up closer to your best-case in percentage terms (you get 110% of your BATNA, she gets 125%, but absolute gain is equal). Proportional splitting (your approach) achieves similar percentage gains but divides the synergy unequally without justification.
  - **Practicality**: It's straightforward and mirrors how many real-world negotiations resolve similar disputes, such as in business partnerships or joint ventures.

  If your partner insists on using the keep-inventory fallback, explain that it doesn't reflect reality—selling separately is better for both, so it should be the baseline. If she resists, emphasize that the customer list (source of the surplus) is shared and warrants equal division of the gains. Ultimately, this method balances both perspectives and is the most equitable solution.
