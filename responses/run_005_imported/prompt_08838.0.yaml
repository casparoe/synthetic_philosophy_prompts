          Proof: If a property φ is positive, then by A3', its negation is not positive. Therefore, it is possible that there is an x with φ(x)? Not necessarily: it might be that φ is impossible to instantiate. But if φ is impossible, then φ implies everything, including the empty property. But then if φ is positive, then by the old A2 we would get that the empty property is positive, which is not allowed. But in Anderson's system, we don't have the old A2. 

     So without the old A2, we cannot necessarily derive that a positive property is possibly instantiated.

     Therefore, in Anderson's system, we might not have the necessary instantiation of every positive property. In fact, the main ontological argument in Anderson's version uses a different approach. 

     Anderson uses:

     Definition of essence: same as before.
     Definition of necessary existence: NE(x) ≡ ∀φ [φ ess x → □∃y φ(y)]

     Axioms:

     A1: If φ is positive, then its negation is not positive. (P(φ) → ¬P(¬φ))
     A2: If φ is positive and necessarily implies ψ, then ψ is positive. (This is the old A2, but wait: Anderson does include this? Actually, in his paper, Anderson includes an axiom: If φ is positive and φ entails ψ, then ψ is positive. But then we are back to the old system.)

     After checking the literature, Anderson's system is usually presented as:

     A1: P(φ) → ¬P(¬φ)
     A2: P(φ) ∧ □∀x(φ(x) → ψ(x)) → P(ψ)
     A3: P(G)
     A4: P(NE)
     A5: P(φ) → □P(φ)

     This is the same as Scott's system! The only difference is that Anderson uses a different definition of essence. Anderson defines:

     φ ess x ≡ ∀ψ [ ψ(x) → □∀y (φ(y) → ψ(y)) ]   [same as Scott]

     But then, Anderson defines necessary existence as:

     NE(x) ≡ ∀φ [φ ess x → □∃y φ(y)]

     This is the same as Scott.

     So it appears that Anderson's system is the same as Scott's. Therefore, it also suffers from modal collapse.

     In light of this, there is a more radical emendation by Hajek: using a different definition of essence. But we won't go into that.

     Conclusion: The derivation of modal collapse in the Scott presentation (and similarly in Anderson's) is as above: for any true proposition p, define the property ψ(x) = (x=x) ∧ p. This property is the universal property if p is true, and the empty property if p is false. Since p is true, ψ is the universal property, which is positive. Then by the necessary instantiation of positive properties (because God has every positive property and necessarily exists), we get that necessarily there is an x with ψ(x), which implies that p is necessarily true.

     The axioms used are:

     - The main ontological argument: which gives □∃x G(x) (using the axioms and definitions, including that God has every positive property).
     - A1: which allows us to show that the universal property is positive (by showing the empty property is not positive, using the fact that if the empty property were positive then every property would be positive, which is impossible by A1).
     - A2: to show that if the empty property were positive, then every property would be positive (because the empty property implies every property).
     - A4: to get that the positivity of ψ is necessary (though in the collapse proof we only used the actual positivity).

     Therefore, to avoid modal collapse, one must either:

     (a) Reject the necessary instantiation of positive properties (which would break the main argument for God's existence), or
     (b) Reject that the universal property is positive, or
     (c) Reject the use of properties that are defined using arbitrary propositions (like ψ(x) = (x=x) ∧ p) as being properties in the system.

     Some have argued that properties like ψ are not "first-class" properties in the sense of the theory. The theory is about properties of individuals, and we are forming a property that depends on a proposition p that may not be about the individual x. This is sometimes called "impredicativity". If we restrict the property comprehension scheme to avoid such properties, then the derivation is blocked. But this would require a change in the underlying logic.

     Without such a restriction, the system does seem to lead to modal collapse.

     So, to answer your question: yes, the axioms (particularly the combination that makes the universal property positive and then the necessary instantiation of positive properties) lead to modal collapse. And the common patches (like Anderson's) do not necessarily block it if we allow the same property definitions. 

     To have a consistent system that avoids modal collapse, one must either restrict the property comprehension or adjust the axioms in a way that might break the ontological argument.

     This is a deep and ongoing debate.
