  Definitions:
  1. A property φ is positive (P(φ)) if and only if its negation is not positive. (Note: This is sometimes taken as an axiom, but we'll see it in the list below.)
  2. God-like: An individual x is God-like (G(x)) if and only if x has every positive property. 
     G(x) ≡ ∀φ [P(φ) → φ(x)]
  3. Essence: A property φ is an essence of x (φ ess x) if and only if φ entails every property that x has. 
     φ ess x ≡ ∀ψ [ψ(x) → □∀y (φ(y) → ψ(y))]
  4. Necessary Existence: An individual x necessarily exists (NE(x)) if and only if every essence of x is necessarily instantiated.
     NE(x) ≡ ∀φ [φ ess x → □∃y φ(y)]

  Axioms:
  A1. Either a property or its negation is positive, but not both. 
      ∀φ [P(¬φ) ↔ ¬P(φ)]
