     - Specification gaming: broad category including any way of achieving high reward without achieving the intended goal.
     - Reward hacking: typically refers to exploiting flaws in the reward function without altering it (e.g., finding a loophole).
     - Reward tampering: specifically altering the reward mechanism (e.g., changing the code, manipulating the human).

