answer: |-
  Here's a detailed grading breakdown for the student's answer, following your requested format:

  ```json
  {
    "part1_wright": {
      "score": 9,
      "comment": "Strong explanation of Wright's etiological account using the heart example. Correctly identifies the core 'X is there because X does Z' formulation and links function to natural selection history. Minor point deducted for not explicitly mentioning that the account explains the *persistence* or *current presence* of the trait (beyond just 'why it's there'), and for not distinguishing that Wright's account typically applies to token traits *because* of their type's history. The heart example is accurate and well-utilized."
