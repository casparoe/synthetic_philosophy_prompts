prompt: |-
  So I had this argument with my housemate at dinner last night that neither of us really won, and I keep turning it over. She's ABD in an econ program and was walking me through revealed preference theory - the Samuelson move where you stop asking what people "really" want and just define preference off of what they actually choose under their budget constraint, so "utility" becomes shorthand for whatever ordering rationalizes their choices. Fine, i got that part. But earlier in the night she'd also been defending soda taxes and opt-out retirement enrollment as good policy, and it seems to me like those two positions don't mix: if utility is just defined as whatever a person's choices reveal, then someone buying the soda or opting out of the 401k is, by construction, doing the thing that maximizes their utility, and a nudge that pushes them off that choice is - by the theory's own logic - making them worse off, full stop. She said I was collapsing a distinction that behavioral economists actually care a lot about, but got pulled away to put her kid to bed before she could finish explaining it.

  I've read enough "coherent agents behave as if they have a utility function" stuff from the LW-sphere to think I'm at least gesturing at something real, but I want to know if I'm actually onto a live tension here or just failing to steelman her position and confusing two different things that both happen to be called "utility." Is there a principled way to hold revealed preference theory and paternalistic nudge policy at the same time, or does one of them have to go?
reasoning: |-
  Okay, the user is grappling with a theoretical inconsistency between revealed preference theory and paternalistic nudges like soda taxes or opt-out retirement plans. They had an argument with their housemate, an ABD econ student, who defended both concepts. The user's confusion is whether these two ideas can coexist logically.

  First, I need to recall the core of revealed preference theory. Samuelson's idea is that preferences are inferred from choices, so utility is just a representation of observed behavior. If someone buys soda, that action reveals their preference, so utility is maximized by definition. Nudges, however, aim to change that behavior, which seems contradictory. The user points out that nudging someone away from their choice should, by revealed preference, make them worse off.

  The housemate mentioned a distinction in behavioral economics. I remember that behavioral econ challenges the standard rational agent model. People have time-inconsistent preferences or cognitive biases. For example, opting out of a 401(k) might be due to present bias, not a true long-term preference. So, revealed preference captures the "revealed" part but not necessarily the "true" preference. The standard theory assumes stable, consistent preferences, but behavioral econ shows they aren't always stable.

  The user might be conflating the traditional revealed preference with the behavioral view. The key is the gap between revealed and true preferences. Nudges aim to align choices with long-term goals. For instance, automatic enrollment counters procrastination. So, the policy isn't overriding true preferences but helping fulfill them.

  The user's deeper need is understanding if there's a coherent framework combining these. They might also want to resolve the argument or grasp behavioral econ's nuances. Their reference to LessWrong suggests familiarity with rationalist concepts, so explaining how behavioral econ deviates from neoclassical models is essential.

  I should outline the neoclassical stance: revealed preference as definitional. Then contrast it with behavioral critiques—biases lead to revealed preferences not reflecting welfare. Nudges correct these without restricting choices, maintaining libertarian paternalism. The user's tension is valid, but behavioral economists address it by distinguishing between revealed and true preferences. Therefore, the housemate's position holds within behavioral economics, which modifies the traditional model.
answer: |-
  You've hit upon a genuinely fascinating and live tension in economics! Your confusion is understandable and points to a core debate between neoclassical economics (built on revealed preference) and behavioral economics (which justifies nudges). **Both positions can be held coherently, but it requires accepting the behavioral critique of the standard revealed preference framework.** Here's the breakdown:

  1.  **The Neoclassical/Revealed Preference Stance (Your Argument):**
      *   **Premise:** Preferences are *only* revealed through actual choices under constraints. There is no deeper, inaccessible "true utility" beyond what is observed.
      *   **Implication:** If someone chooses soda over other goods given their budget, that choice *reveals* it maximizes their utility *at that moment*. Any policy that changes that choice (like a tax making soda relatively more expensive) *must* make them worse off *according to their own revealed preferences*. Similarly, if they opt out of the 401(k), that reveals they prefer the immediate cash (or dislike complexity/fees) more than the future savings.
      *   **Policy Implication:** Government intervention (beyond correcting market failures like externalities or providing public goods) is inherently suspect. It risks substituting the policymaker's preferences for the individual's revealed preferences, making the individual worse off.

  2.  **The Behavioral Economics Critique & Justification for Nudges (Your Housemate's Implied Position):**
      *   **Core Insight:** Humans aren't perfectly rational, frictionless optimizers as assumed by standard revealed preference theory. We suffer from well-documented cognitive biases, limited willpower, present bias, inertia, framing effects, and limited attention.
      *   **Key Distinction:** Behavioral economists argue there's a difference between:
          *   **Revealed Preference:** What people *actually choose* in the moment, often influenced by biases, inertia, or flawed decision-making processes.
          *   **True Preference/Welfare/Experienced Utility:** What people *would choose* if they had perfect information, unlimited cognitive resources, no self-control problems, and could fully align their immediate actions with their long-term goals and values. (This is often assessed through surveys about life satisfaction, regret, or hypothetical choices under idealized conditions).
      *   **The Problem Revealed Preference Solves (and Doesn't):** Samuelson solved the problem of *observability* by defining preference via choice. Behavioral economists point out this doesn't solve the problem of *welfare* when choices are systematically flawed. Revealed preference tells us *what was chosen*, not necessarily *what is best for the chooser*.
      *   **Justification for Nudges:** Policies like soda taxes or opt-out retirement plans are designed to correct for these systematic flaws:
          *   **Soda Taxes:** Address negative *internalities* (future health costs the present-self ignores due to present bias) and potentially externalities (public health costs). The tax aims to make the price reflect the *true long-term cost* the individual would care about if not biased. The person buying less soda post-tax isn't necessarily "worse off" if the revealed preference for soda was driven by a failure to properly weigh future health consequences.
          *   **Opt-Out Retirement:** Addresses inertia, procrastination, present bias, and complexity. Many people *say* they want to save more (expressing a "true preference") but fail to act due to these frictions. Making enrollment automatic leverages inertia *for* the individual's long-term benefit. Those who *actively* opt-out reveal a preference for cash now over saving, but many who stay enrolled under opt-out are grateful later, suggesting their inaction under opt-*in* didn't reveal their true preference.

  3.  **Reconciling the Positions (The "Principled Way"):**
      *   **Behavioral economics modifies the standard model, it doesn't discard revealed preference entirely.** It still observes choices as crucial data.
      *   **It identifies specific, predictable contexts where revealed preferences are *likely* to be poor proxies for welfare:** Situations involving complex trade-offs, long time horizons, low stakes, infrequent decisions, or strong emotions are breeding grounds for biases.
      *   **Nudges aim for "Libertarian Paternalism":** They try to steer people towards choices *aligned with their own true preferences and long-term welfare* (as best as can be inferred) while preserving freedom of choice. The opt-out retirement saver can still leave; the soda drinker can still buy soda (just at a higher price reflecting the internal cost).
      *   **Utility Gets Split (Conceptually):** Behavioral economists often distinguish:
          *   **Decision Utility:** The utility function *as inferred from the flawed choice* (what revealed preference captures).
          *   **Experienced Utility:** The actual happiness or well-being derived from the outcome.
          The goal of nudges is to align Decision Utility with Experienced Utility by correcting the decision-making flaws.

  **Why Your Argument is Strong (and Why Hers is Too):**

  *   **You are absolutely correct** within the strict neoclassical framework built on Samuelson's revealed preference. If you accept its assumptions (perfect rationality, stable preferences), nudges *are* welfare-reducing by definition.
  *   **Your housemate is also correct** that behavioral economists see a crucial distinction you were collapsing: the distinction between *revealed choices* (which can be biased) and *true welfare*. They argue the strict revealed preference definition of utility becomes descriptively inaccurate and normatively inadequate when choices are systematically flawed.

  **The Live Tension:**

  1.  **Defining "True Preferences":** How do we *know* what someone's "true preference" is if not through their choices? Behavioral economists use surveys, experiments, observed regret, consistency tests, and normative models of rational choice. This is inherently messier than revealed preference.
  2.  **Paternalism:** Even if well-intentioned, who decides what the "true preference" is? There's a risk of technocratic overreach or imposing the policymaker's values. Libertarian paternalism tries to minimize this, but the line is blurry.
  3.  **Scope of Biases:** How widespread and significant are these decision-making flaws? Neoclassical economists argue they might be small or wash out in markets; behavioralists argue they are pervasive and consequential.

  **Conclusion:**

  You *are* onto a live tension. It's a fundamental philosophical and methodological divide in economics.

  *   **Strict Samuelson Revealed Preference:** Nudges that alter choices *must* reduce welfare (unless correcting externalities). Paternalistic nudges (like soda taxes targeting internalities or opt-out targeting inertia) are logically inconsistent with this view.
  *   **Behavioral Economics:** Accepts the core idea of observing choices but argues that systematic biases create a gap between revealed choice and true welfare. Nudges aim to close this gap, helping people make choices better aligned with their *own* long-term goals and well-being. In this framework, soda taxes and opt-out retirement *can* be welfare-enhancing *despite* changing revealed choices, because those revealed choices were flawed signals of true preference.

  Your housemate was likely starting to explain this behavioral critique – that revealed preferences under cognitive biases aren't reliable indicators of welfare, creating space for welfare-improving nudges. Neither position necessarily has to "go," but embracing nudges requires moving beyond the strictest interpretation of Samuelson's revealed preference theory and accepting the behavioral evidence of systematic decision-making errors. The debate between these two perspectives is very much alive in economics today.
