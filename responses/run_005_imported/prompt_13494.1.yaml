    },
    {
      "move": "Wide view of public political culture",
      "why": "Expands where religious reasons can be voiced (e.g., civil society), lessening restrictions beyond core coercive power."
    },
    {
      "move": "Abolitionists and MLK as models",
      "why": "Shows compatibility is possible but sets a demanding standard of translation that may still burden ordinary citizens."
    },
    {
      "move": "Justice as fairness as 'freestanding'",
      "why": "Requires religious citizens to bracket their deepest convictions in political justification, imposing significant cognitive/ethical strain."
    }
  ]
  ```

  **Key reasoning:** The proviso directly addresses the core burden (silencing) by allowing religious reasons conditionally. Overlapping consensus respects internal religious justifications. The wide view offers breathing room outside formal politics. The models are aspirational but imply a high bar. The freestanding view demands the deepest compartmentalization, creating the primary burden Rawls seeks to mitigate.
