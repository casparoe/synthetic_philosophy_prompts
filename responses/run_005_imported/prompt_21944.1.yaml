prompt: |-
  Random context: my brother in law is a philosophy prof and he's agreed to come on this tiny podcast I do with a friend (we normally just riff on tech and science stuff for like 50 listeners, nothing serious). His whole research thing is defending semantic externalism, the Twin Earth line of argument, and apparently he leans hard on Burge's arthritis case to push it even further than Putnam did. I actually went and read most of the original Putnam paper plus skimmed Burge's after a Hacker News thread about whether LLMs can "mean" anything spiraled into people throwing around Twin Earth references, so I get the H2O/XYZ setup and the general idea that meaning "ain't in the head." But I really don't want the episode to just be him re-explaining that thought experiment for the millionth time since anyone can google it in five seconds.

  Can you draft me like 8-10 interview questions that go past the 101 version of this? Specifically I want at least one question on each of the following: the self-knowledge weirdness where if content depends on stuff outside my skull but I still supposedly know my own thoughts just by introspecting, that seems to let me deduce facts about the world from an armchair, which feels like cheating (I think this is called the McKinsey paradox or something close to that?); on whether externalism is only supposed to hold for natural-kind words like water and gold or whether it generalizes to basically every word, including stuff for tools, emotions, or made up things; on the slow-switching cases, like someone gradually shipped between Earth and Twin Earth without ever noticing, and what that's supposed to do to thier belief content over time, all at once or gradually; and on whether any of this framework even applies to something like an LLM that's never had causal contact with any water at all, twin or otherwise, just text about it. For each question, throw in a quick follow-up that keys off the dodge he's most likely to make, so this doesn't end up a softball interview.
