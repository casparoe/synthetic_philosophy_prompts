  The train groaned to a halt again, somewhere dark between stations. Rain lashed the window beside Marcus, streaking the reflection of the overhead lights. Across the narrow table, Elena traced the rim of her paper coffee cup, the silence stretching taut between them. It had been years since they’d shared air this thick with unsaid things.

  **Marcus:** (Tapping the condensation on the window, drawing an uneven line) Still think it’s all just judgments, Elena? Even now? Sitting here… like this?

  **Elena:** (Meeting his gaze, coolly) Especially now. What else could it be? This… friction? It’s an evaluation. Of history. Of choices. Of *you*, sitting there looking smug.

  **Marcus:** Smug? That’s rich. I’m damp, delayed, and debating ontology with my ex at 2 AM. But fine. Judgments. Explain phobias to me. Arachnophobia. Someone *knows*, intellectually, believes utterly, that the tiny spider in the corner is harmless. Yet the sweat, the tremor, the visceral urge to flee persists. Where’s the judgment *now*? Did they suddenly judge it dangerous again? Against their better knowledge?

  **Elena:** (Leaning forward slightly) It’s not that simple, Marcus, and you know it. The *occurrent* judgment – ‘this spider poses no threat’ – is present. But the *dispositional* judgment, formed through years of conditioning, perhaps primal wiring, that ‘spiders *are* threats’? That lingers. It’s not fully endorsed, not integrated, but it exerts force. Like… like an old reflex you can’t quite unlearn, even while consciously overriding it. The emotion reflects that *conflicted* state of judgment.

  **Marcus:** Ah, the dispositional dodge. Convenient. So the judgment is there, just… hiding? Unconscious? Feels like special pleading. Look at grief. Profound grief. Months, years after a loss. The griever *judges*, rationally, that the person is gone, that life must go on, that grieving endlessly serves no purpose. They *believe* it. Yet the raw ache, the tears that come unbidden… they persist. Is that just a ‘dispositional judgment’ stubbornly refusing to update? Or is it something *else*, something perception-like, registering the value of what was lost, a value-pain that persists independently of the current belief about its utility?

  **Elena:** Grief *is* complex. But yes, it involves judgments! Judgments about the irreplaceable value of the person lost, judgments about the shape of one’s own life now irrevocably altered. That the *intensity* of the emotional response doesn't instantly track the *speed* of conscious belief revision doesn't negate the cognitive core. It speaks to the depth and entanglement of those evaluations with our very identity. We *are* our judgments, in a profound way. Reducing grief to a mere perception of loss-value flattens it.

  **Marcus:** Flattens it? Or acknowledges its autonomy? Think of the Müller-Lyer illusion. You *measure* the lines, you *know* they’re equal, you *believe* it completely. Yet your visual system stubbornly *perceives* one as longer. The perception persists despite the belief. Isn't recalcitrant emotion precisely analogous? The emotional system *perceives* danger in the spider, perceives overwhelming loss-value, *despite* the belief system saying otherwise. The feeling isn't a failed judgment; it's a parallel track, a different way of registering value in the world.

  **Elena:** But the analogy *fails*, Marcus. Perception in the Müller-Lyer case is *passive*. The lines *look* unequal. Full stop. But emotions? Take indignation. I don't just *feel* a hot wave when I'm wronged. I feel it *because* I judge that an injustice has occurred, that my rights were violated, that *someone did this to me*. The content is propositional! It’s *about* something specific, conceptually structured. Can you *perceive* injustice the way you perceive red? Or isn't perceiving injustice *already* a form of judgment?

  **Marcus:** Why can't value perception be conceptually laden? We perceive *objects* – that's a cup, that's a threat – not just raw qualia. The emotional perception *is* the perception of an offense-against-me, or a triumph-by-me. It packages the value *with* the intentional object.

  **Elena:** But the packaging *requires* concepts! ‘Offense’, ‘against-me’, ‘triumph’, ‘by-me’ – these are not sensory primitives like line length or hue. They involve understanding relations, norms, personal history. That *is* judgment. What does your perceptual system actually register? Bodily changes? Neural firings? How does *that* constitute the rich, propositionally saturated experience of, say, pride? Pride *feels* like something, yes, but its identity *as pride* depends entirely on the judgment that I am responsible for some worthy achievement. Strip away that cognitive content, and what's left? Just a warm glow? That could be anything – satisfaction, contentment, indigestion.

  **Marcus:** (A faint smile) Indigestion rarely fuels philosophical ambition. But you’re conflating the *cause* or the *object* with the emotion itself. The warm glow *plus* the non-cognitive appraisal of responsibility *is* the perception of pride. It’s a unified gestalt, a way the world strikes us affectively. The judgment might *trigger* it, or be *about* it, but the emotion itself is the embodied perception of that value-laden state of affairs.

  **Elena:** ‘Non-cognitive appraisal’? That sounds suspiciously like a judgment you don’t want to call a judgment. If it’s appraising responsibility, it’s cognitive! And embodied? Fine. Emotions involve the body. But James-Lange redux? We dismissed that decades ago. The body doesn't *cause* the emotion in a simple feedback loop; it *expresses* the cognitive evaluation. My racing heart when indignant *follows* my judgment of injustice; it doesn't constitute it.

  **Marcus:** Does it? Always? What about surprise? The gasp, the jump – the bodily response is instantaneous, *before* any clear judgment forms. The perception of the startling event *is* the emotional response. Or disgust. The visceral recoil often precedes the explicit thought ‘that’s contaminating’.

  **Elena:** Surprise is a primitive startle reflex, arguably pre-cognitive. Disgust has deep evolutionary roots tied to contamination *judgments* – even infants make rudimentary versions. These are edge cases. Core emotions like love, resentment, shame, guilt… they are saturated with meaning, with evaluations woven into the fabric of our understanding. You can’t parse them without the cognitive architecture.

  **Marcus:** And you can’t reduce their visceral, compelling, sometimes irrational force to a dispassionate verdict. That’s what the phobia shows. That’s what the grief shows. The perceptual model captures the *brute givenness* of emotion, its stubborn presence even when our considered judgments try to evict it. Like this damned train delay. I *judge* it’s not the conductor’s fault, probably. But do I *feel* frustrated? You bet I perceive the value of my lost time acutely.

  **Elena:** (A dry chuckle) And your frustration *is* a judgment, Marcus. A judgment that this situation is thwarting, inefficient, undesirable. The feeling is the conscious experience *of* that negative evaluation. It’s not a separate perception *of* thwarting-ness floating in. It *is* the experience of making that evaluation. You’re perceiving *with* your evaluative faculties.

  **Marcus:** Semantics. You call it judgment-as-experience. I call it value-perception. We’re circling the same thing with different labels.

  **Elena:** No. The labels matter. Calling it perception suggests it’s *given*, like data. Judgment implies it’s *done*, an act of the mind, something we are responsible for, that can be reasoned about, challenged, revised. Like our past choices. You want emotions to be things that just *happen* to us, like the rain on the window. I see them as things we *do*, even when we do them badly, or stubbornly.

  **Marcus:** Responsibility… there it is. The Stoic leash. If it’s a judgment, we can control it, master it. Nussbaum’s ‘Upheavals’ tamed by reason. But sometimes, Elena, the feeling *is* the truth, truer than the bloodless belief. The grief *tells* you the loss mattered, profoundly, beyond utility. The lingering fear *tells* you that knowledge hasn’t fully permeated the ancient parts that keep you alive. Isn't there wisdom in that perception?

  **Elena:** Wisdom, perhaps. But not *truth* independent of evaluation. The grief tells me *I* judge the loss mattered profoundly. The fear tells me *I* haven’t fully integrated the safety judgment. The emotion is the symptom, the manifestation, not the source. It points *back* to the cognitive landscape. Ignoring that… it’s not wisdom, Marcus. It’s abdication.

  **Marcus:** Abdication? Or acknowledgment of human complexity? We aren’t pure intellects. We’re feeling creatures who reason, not reasoning creatures who occasionally feel. The perceptual model respects that primacy.

  **Elena:** And the cognitivist model respects our capacity to rise above mere reaction, to shape our emotional world through understanding. To be more than just weathervanes spun by value winds.

  **(A long pause. The train lurches slightly, the only sound the drumming rain and the distant hum of the engine. They hold each other's gaze, the old argument settling back into familiar, unyielding grooves. Neither has conceded an inch. The coffee is cold.)**

  **Conductor:** (Voice crackling over the intercom) Apologies for the delay, folks. Signal failure ahead. We’re hoping to be moving within the hour.

  **Marcus:** (Staring out at the black, rain-streaked window) An hour. Judged as interminable, or perceived as such?

  **Elena:** (Picking up her cold cup) Both, Marcus. Always both. That’s the damnable complexity you refuse to collapse.

  **(Silence descends again, heavier now, filled with the weight of the unresolved argument and the years it echoed.)**
