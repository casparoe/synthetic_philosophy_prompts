  - **McGrath’s weakness**: Norms are messy (duty? statistics?). What if no norm exists? Risk of circularity—maybe norms presuppose causation.  

  Ah, the user’s key question: Does McGrath’s normativity *add value* over Lewis, or is it the same move relocated? I think she adds value: by tying causation to normative defaults, she avoids Lewis’s counterintuitive "every omission is causal" and grounds why we care about *specific* omissions. But the cost is real—e.g., if a plant has no caretaker, McGrath might say no cause exists, which feels incomplete. Lewis would say "causes exist but aren’t explanatory."  

  Verdict? McGrath wins for *this puzzle*. Her view directly targets the absurd overbreadth, while Lewis papers it over. But I’ll stress it’s a *strategic* win for omission cases, not a total victory. (The roommate loses.)  

  For the "no norm" cases: McGrath *could* bite the bullet (no causation) or stretch "defaults" (e.g., statistical norms). Lewis handles them smoother but at the cost of implausible causation. The user should note this tension—it’s where McGrath’s approach is most vulnerable.  

  Final thought: The user might push back—"Is normativity *really* metaphysical?" I’ll preempt that by distinguishing McGrath’s claim (norms *constitute* causal facts) from Lewis’s (they’re filters *about* causal facts). That’s the crux.
answer: |-
  Alright, let's cut through the "both have merits" fog. You're right – the core tension is whether normativity is a *metaphysical fix* for causation-by-omission (McGrath) or a *pragmatic filter* applied *after* causation is established (Lewis). Here's a direct comparison and verdict:

  **1. The Core Difference: Where Normativity Lives & What It Does**
      *   **Lewis (Pragmatic Filter):**
          *   **Metaphysics:** Causation (including omissions) is *objectively, broadly defined* by counterfactual dependence. The neighbour, Antarctica guy, *are* metaphysically causes. Full stop.
          *   **Normativity's Role:** *Purely pragmatic.* It tells us *which causes are worth mentioning* in explanation or assigning responsibility. We cite *me* because I had a duty/expectation/ability; citing the neighbour is irrelevant noise; citing Antarctica is absurd. The causal *fact* remains broad, but our *interest* narrows it.
          *   **Fixes the Absurdity?** Not metaphysically. It explains *why we talk the way we do* despite the messy metaphysics. The absurdity is acknowledged but swept under the rug of "pragmatics."
      *   **McGrath (Metaphysical Constraint):**
          *   **Metaphysics:** Causation itself is *constrained* by normativity. An omission is only a *genuine cause* if it deviates from a relevant normative baseline (duty, proper function, statistical norm). My failure is a cause because I *should have* watered. The neighbour's failure *isn't a cause at all* if they had no duty/expectation/function regarding *my* plant.
          *   **Normativity's Role:** *Constitutive of the causal relation* for omissions. It directly determines *what counts as a cause*.
          *   **Fixes the Absurdity?** Metaphysically. It directly eliminates the overbreadth problem by making non-deviant omissions non-causes. The neighbour and Antarctica guy are *correctly excluded* from the causal story at the fundamental level.

  **2. What McGrath Buys Over Lewis (And What It Costs)**

  *   **The Win: Eliminating Metaphysical Absurdity.** McGrath's core advantage is that she **directly solves the overbreadth problem at the level of causation itself.** She doesn't just explain *why we ignore* the neighbour; she argues the neighbour *wasn't a cause, period.* This aligns much better with strong pre-theoretical intuitions that the neighbour *didn't cause* the plant's death, even counterfactually. Lewis has to say "Well, technically they did, but..." which feels like a cop-out. McGrath offers a cleaner ontology for omissions.
  *   **The Cost: The "No Norm" Problem & Messy Metaphysics.**
      *   **The Cost:** McGrath's Achilles' heel is the scenario **where no clear norm, duty, function, or statistical default exists.** Imagine a wild plant in an untouched forest that dies because it didn't rain. Is the lack of rain a cause?
          *   **Option 1 (Bite the Bullet):** If there's *no relevant normative baseline whatsoever*, then *no omission is a cause*. The plant just died. This seems deeply counterintuitive – surely the lack of water *caused* it to die?
          *   **Option 2 (Stretch Norms):** Maybe appeal to a very broad statistical norm (rain is statistically normal) or a "proper function" of ecosystems. But this feels ad hoc and risks making normativity so vague it loses its constraining power. What *is* the norm for a rock not falling on the plant? Is it just statistical?
      *   **The Smuggling Charge:** Is McGrath just relocating Lewis's pragmatics? **Partly, but strategically.** She *is* using normative judgments Lewis uses pragmatically to do metaphysical work. However, she argues these norms aren't *just* pragmatic filters; they are *constitutive facts* about certain causal relations (omissions). The cost is that her metaphysics becomes **inherently normative and potentially more complex/variable** than Lewis's cleaner, purely descriptive counterfactual foundation. Whether this is "smuggling" or a necessary feature of causation depends on whether you think normativity *is* fundamental to parts of reality.

  **3. Verdict: Who Handles the Puzzle Better?**

  For **solving the specific overbreadth problem of omissions** (like your basil plant), **McGrath's strategy is superior.**

  *   **Why:** She provides a **direct metaphysical solution** that eliminates the absurd causes, aligning perfectly with the intuition that the neighbour and Antarctica guy *aren't causes*. Lewis's solution feels like a dodge; it explains *talk* but leaves the messy metaphysics intact. McGrath restores a more intuitive causal ontology *for omissions*.
  *   **The Caveats (Why it's not a total rout):**
      *   **Scope:** McGrath's victory is primarily for **omission cases triggering the overbreadth problem.** Lewis's purely counterfactual approach has broader simplicity and handles many "positive" causation cases elegantly.
      *   **Cost Acknowledged:** The "no norm" problem is **serious.** McGrath needs a plausible account of defaults in all cases where we intuitively posit omission-causation. If she has to resort to vague statistical norms everywhere, it weakens her position. Lewis handles these cases seamlessly (if counterintuitively for omissions) – the lack of rain *is* a cause, pragmatics explains why we focus on it.
      *   **Metaphysical Commitment:** Adopting McGrath means accepting normativity as fundamental to *some* causal facts. This is a heavier metaphysical lift than Lewis's Humean-friendly framework.

  **Conclusion for Your Paper & Roommate:**

  *   **Against Lewis:** His view forces us to accept metaphysically absurd causes (Antarctica guy) and relegates our strong intuition that these *aren't* causes to mere pragmatics. This is unsatisfying for omissions. "Void and Object" biting the bullet is consistent but unappealing.
  *   **For McGrath:** She offers the **most direct solution to the overbreadth problem** by building normativity into the causal relation itself for omissions. This provides a metaphysically cleaner and more intuitive account *for these specific puzzling cases*. Her approach respects the intuition that only *relevant* omissions are causes, at the level of metaphysics.
  *   **The Trade-off:** McGrath's **win on omissions comes at the cost of handling "no norm" cases less elegantly than Lewis and requiring a norm-laden metaphysics.** Lewis maintains a simpler, unified counterfactual metaphysics but fails to adequately resolve the omission overbreadth, pushing the problem to pragmatics.

  **Final Takedown for Your Roommate:** "Look, Lewis just shrugs and says 'Yeah, technically your downstairs neighbour and some rando in Antarctica *did* cause your basil to die, we just don't talk about it.' McGrath actually fixes that nonsense by showing their inaction wasn't a cause *at all* because they had no business watering your plant. Sure, figuring out the 'default' gets messy sometimes, but that's better than accepting metaphysical absurdity as a starting point. For omissions, her way actually *solves* the problem Lewis just papers over with pragmatics."

  Good luck with the paper! Crush it.
