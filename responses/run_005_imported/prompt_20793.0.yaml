  First, I should recall the core conflict: Lewis accepts the absurdly broad causation but explains away irrelevant causes via pragmatics, while McGrath bakes norms into causation itself. The user wants a real comparison—not just summaries—and a verdict on which handles the puzzle better. They’re suspicious McGrath might just be relabeling Lewis’s pragmatics as metaphysics.  

  Hmm, the user’s tone is urgent ("paper due Friday"), slightly frustrated ("still turning it over"), and competitive ("need to win" the roommate argument). They’re intellectually serious but want clarity, not fence-sitting. Their hidden needs: (1) a decisive analysis to solidify their paper’s argument, (2) ammunition for the debate, and (3) confidence there’s a "best" solution despite seminar complexity.  

  Now, weighing Lewis vs. McGrath:  
  - **Lewis’s strength**: Clean separation. Causation is objective (counterfactuals), pragmatics handles relevance. No metaphysical mess.  
  - **Lewis’s weakness**: Feels revisionist ("technically, Antarctica caused it"). Doesn’t resolve why we *intuitively* reject non-waterers as causes.  
