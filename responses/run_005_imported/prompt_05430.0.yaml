prompt: |-
  So I've been brushing up on special relativity for a side project (Minkowski diagrams, block universe, the works) and fell down a wiki hole into this whole endurantism vs perdurantism debate in metaphysics. Genuine question: isn't this basically already settled by physics? Objects are just world-tubes stretched across 4D spacetime, so an object is literally made of different parts at different time-slices, same as its made of different parts in different places. That's perdurantism, right? Feels like the endurantist idea that objects are "wholly present" at every moment is just a pre-relativistic intuition that doesn't survive contact with actual physics. Am I missing something, or do philosophers just not update on this stuff?
