  The Kantian angle is philosophical dynamite. The main question needs to juxtapose superrationality's "same reasoning → same action" with Kant's universalizability principle. If the theorist denies equivalence (as expected), the follow-up should probe why game theory needs this moral flavor instead of pure rationality. 

