  **Corrected REU Risk Function for Risk Aversion:**
  *   For **risk aversion**, Buchak uses a **concave** risk function (`r''(p) < 0`), which means it is bowed *above* the diagonal. This means `r(p) > p` for small `p` and `r(p) < p` for large `p` (near 1). A common example is `r(p) = p^γ` with `0 < γ < 1`.
