  Calculate: r(0.01)=0.0001, r(0.90)=0.81, so REU(B) = 0.0001*0 + (0.81 - 0.0001)*1 + (1 - 0.81)*2 ≈ 0 + 0.8099*1 + 0.19*2 = 0.8099 + 0.38 = 1.1899. Option A: $1M for sure. REU(A) = r(1)*1 = 1. So REU(A)=1 < REU(B)=1.1899? That suggests preferring B, but people prefer A. Maybe need γ<1 for risk aversion? Buchak defines r as concave for risk aversion, meaning r(p) < p for p near 1? I need to check.

