  Now for the second pair. Option C: 11% $1M, 89% $0. REU(C) = r(0.89)*0 + [1 - r(0.89)]*1. With r(p)=sqrt(p), r(0.89)≈0.943, so REU(C)=0 + (1-0.943)*1=0.057.

