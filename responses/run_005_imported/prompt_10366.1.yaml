  The core tension they're wrestling with is epistemological vs ontological indeterminacy. In seismology, non-uniqueness is about incomplete data - the Earth's structure exists but our measurements can't uniquely determine it. But with Davidson, they're asking if mental states might not even exist as determinate facts. That's a huge difference.

  Hmm... their analogy is clever but I see why their ML colleague hesitated. The seismic case is about hidden physical reality we can approximate with regularization. But with beliefs/desires, we might be dealing with something that isn't "hidden" in the same way - more like emergent properties rather than buried structures. 

