  Hmm, the bioethicist's point is fascinating. She's highlighting how Nozick - famous for absolute human rights - actually struggled with animal ethics. His observation that consciousness exists on a spectrum undermines the human-animal moral binary. For pigs (who we know are highly intelligent), this suggests maybe we shouldn't just weigh costs heavier but set absolute limits like we do for humans.

  But I need to consider the practical realities too. Research committees operate in a system where utilitarian calculations are embedded in regulations. Completely abandoning that framework could paralyze important research. There's also the translation argument - pig neurophysiology is uniquely valuable for human applications. Still... those videos showing pigs solving puzzles do make you wonder.

