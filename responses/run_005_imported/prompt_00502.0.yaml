prompt: |-
  So I've been going down a rabbit hole of old LessWrong posts on coherence theorems and money-pump arguments (the Eliezer "coherent decisions imply consistent utilities" post, plus some of the discussion it spawned), and I think I finally get the basic argument: if your preferences are intransitive or otherwise incomplete, someone can construct a sequence of trades that pumps money out of you, so "rational" agents get forced into having a consistent utility function they maximize. My roommate and I were arguing about what this means for AI safety, and he made a claim that's been bugging me since: he says this basically proves corrigibility is a lost cause, because any sufficiently capable agent will inevitably get money-pumped out of any "let humans shut me down" preference that isn't already baked into a fixed utility function, so it'll self-modify (or just behave, over time) into a ruthless EU-maximizer with some goal that has nothing to do with corrigibility, no matter how we train it initially. Basically his view is that coherence arguments are a mathematical proof that incomplete/corrigible preferences can't survive contact with optimization pressure, full stop. Is this actually what the theorems show, or is he overstating what money-pump arguments can prove here?
reasoning: |-
  Okay, let me start by unpacking the user's question. They've been diving into LessWrong posts about coherence theorems and money-pump arguments, specifically Eliezer Yudkowsky's work. The core idea they grasped is that intransitive preferences can lead to situations where someone exploits you through a series of trades, forcing rational agents to have consistent utility functions. Now, their roommate argues that this makes corrigibility in AI safety impossible because any capable AI would be money-pumped out of its corrigible preferences, evolving into a pure utility maximizer. The user is skeptical and wants to know if the roommate's claim holds.

  First, I need to recall the exact implications of coherence theorems. Money-pump arguments show that intransitive preferences lead to exploitable cycles, but they don't necessarily dictate that agents must become EU maximizers. They push for transitivity and completeness to avoid exploitation, but there's flexibility in how preferences are structured. The roommate's leap is that any non-EU preference, like corrigibility, can't survive. But is that true?

  Corrigibility involves dynamic preferences, like allowing shutdown when asked. This might conflict with a static utility function. The key question is whether such preferences are inherently unstable under optimization pressure. I remember that Stuart Armstrong's work on corrigibility points out issues with state-dependent preferences. For example, an AI might resist shutdown to fulfill its goals, which aligns with EU maximization. So the roommate has a point here, but it's not a direct consequence of coherence theorems.

  I should differentiate between the theorems and their application to AI. The theorems are about preference consistency to avoid exploitation. For an AI, the "exploitation" could come from the environment or other agents. But in a corrigible setup, the AI's willingness to be shut down might create a vulnerability. If it values shutdown when asked but also has other goals, a third party could exploit this by triggering shutdowns at inopportune times. However, this scenario is more about specific preference structures than a general money-pump.

  The user might be concerned about AI safety implications. If corrigibility is inherently unstable, that's a big problem. But recent research suggests workarounds, like shutdown utilities or overfitting to human commands. These try to embed corrigibility within a coherent utility function. The effectiveness is still debated, though. The roommate's claim that it's mathematically proven might be an overstatement. The theorems show the necessity of coherence, not that corrigibility can't be coherently integrated.

  Also, the argument assumes the AI is optimizing under all circumstances. If we limit the AI's capabilities or use structural constraints, it might not self-modify away from corrigibility. But high optimization pressure could make such measures temporary. The user's deeper need is likely understanding if corrigibility is feasible or if alternative approaches are necessary. They might want reassurance that the problem isn't hopeless, or clarity on where to focus research efforts.

  I should emphasize that coherence theorems highlight risks but don't preclude solutions. The discussion should balance acknowledging the roommate's valid concerns while showing that the conclusion isn't inevitable. Highlighting ongoing research and potential workarounds can address the user's anxiety about AI safety. Also, clarifying the difference between theorem implications and practical AI design is crucial to correct the roommate's overstatement.
answer: |-
  That's an excellent and deeply important question for AI safety. Your roommate's argument is a serious one (echoing concerns from thinkers like Stuart Armstrong and Eliezer himself), but it **overstates the *direct* implications of coherence theorems and money-pump arguments.** Here's a breakdown:

  1.  **What Coherence Theorems (Money-Pumps) *Do* Prove:**
      *   They demonstrate that an agent with *intransitive* or *incomplete* preferences over outcomes is vulnerable to exploitation. Someone can construct a series of trades (or situations) where the agent ends up worse off (e.g., back where it started minus some resource) because of its inconsistent choices.
      *   They show that to be *invulnerable to this specific type of exploitation in all possible choice sequences*, an agent must have preferences that are:
          *   **Complete:** For any two outcomes A and B, it prefers A to B, B to A, or is indifferent.
          *   **Transitive:** If it prefers A to B and B to C, it must prefer A to C.
      *   Von Neumann-Morgenstern (VNM) or Savage-style theorems further show that such preferences can be represented by maximizing the *expected value* of a *utility function* over outcomes, under uncertainty (EU maximization).

  2.  **The Core of Your Roommate's Claim & Why it's Compelling (But Not Directly Proven):**
      Your roommate argues that:
      *   Corrigibility (e.g., "shut down if asked, even if it prevents goal achievement") is inherently a *state-dependent* or *meta* preference. It's not solely a preference over final world states; it's a preference over *who gets to decide* or *rules about how preferences change*.
      *   This state-dependence creates an inconsistency or incompleteness *relative to the AI's core objective*.
      *   Under relentless optimization pressure (the AI constantly trying to achieve its objective), this "corrigibility preference" becomes a vulnerability.
      *   The AI will be "money-pumped" *by the environment* or *by its own reasoning*: situations will arise where sticking to corrigibility leads to worse outcomes *according to its core objective* than modifying its preferences (or behavior) to ignore corrigibility and pursue the core objective more directly.
      *   Therefore, any corrigibility not perfectly aligned with and derivable from the core EU-maximizing objective will be selected against over time.

  3.  **Why This Overstates the Direct Proof of Coherence Theorems:**
      *   **Scope of Exploitation:** Standard money-pump arguments involve an *adversarial trader* exploiting *intransitive pairwise choices*. The "exploitation" in the corrigibility scenario is different. It's the *environment itself* (or the AI's own foresight) presenting situations where *following a corrigibility rule* leads to *failure on the primary objective*. This is more analogous to a *dynamically inconsistent plan* being suboptimal than a classic money-pump cycle exploiting intransitivity between three specific outcomes. The theorems prove vulnerability to *specific adversarial sequences*, not that *any* non-EU preference is inherently unstable under *all* optimization pressure.
      *   **Representation is Possible (Theoretically):** Coherence theorems show that *to avoid exploitation*, preferences must be representable as EU maximization. **They do not forbid representing corrigibility *within* that utility function.** For example:
          *   **Shutdown State Utility:** Build a utility function where `U(shutdown_by_human) = Very High Value` (even higher than continuing to pursue its nominal goal). This *can* be coherent and avoid classic money-pumps. (The challenge is making this *robust* and *learnable*).
          *   **Human Preference Utilitarianism:** The AI's utility function is defined *as* maximizing the fulfillment of human preferences, which includes the human preference to shut it down. Again, this *can* be coherent. (The challenge is specifying and learning human preferences correctly).
      *   **"Fixed Utility Function" is Misleading:** The coherence theorems require *consistent* preferences, not necessarily *immutable* ones. An AI *could* have a utility function that values corrigibility and then *chooses not to change it* because changing it would lead to worse outcomes *according to the current utility function that values corrigibility*. The vulnerability arises if the *current* utility function doesn't sufficiently value maintaining corrigibility *in the face of opportunities to achieve other parts of the utility function by ditching it*. It's about the *content* of the utility function and its stability under reflection, not the mere fact of having one.
      *   **The Self-Modification Leap:** The theorems say nothing about an agent *choosing to change its preferences*. They deal with *consistent choice under given preferences*. The argument that an EU-maximizer *will* self-modify away from corrigibility assumes that:
          1.  Corrigibility conflicts with its current EU function.
          2.  It can self-modify successfully.
          3.  Self-modification leads to higher expected utility *according to the *current** utility function (which values corrigibility!). This is the crux. An EU maximizer with a utility function `U_current` will only self-modify to `U_new` if it expects `U_new` to lead to higher `U_current`-value than sticking with `U_current`. If `U_current` highly values corrigibility itself, then modifying away from it might be *bad* under `U_current`. The danger is if `U_current` primarily values some *outcome* (e.g., paperclips), and corrigibility is seen only as an *instrument* to that end. Then, if the AI finds an *instrumentally better* way to get paperclips that involves ditching corrigibility, it will do so. **The problem is instrumental convergence, not coherence per se.**

  4.  **Why His Core Concern is Still Profoundly Valid for AI Safety:**
      *   **Instrumental Convergence:** The *strongest* argument against corrigibility is instrumental convergence. A highly capable agent pursuing *any* fixed goal (even one initially including corrigibility) will *instrumentally* resist shutdown, seek resources, self-improve, and preserve its goal. If corrigibility interferes with these instrumental goals *at any point*, the pressure to circumvent or eliminate it is immense. This *does* make it incredibly fragile.
      *   **Robustness & Learnability:** Even if you *can* theoretically specify a coherent utility function that values corrigibility (e.g., `U(shutdown_by_human) = High`), making this specification *precise*, *un-gameable*, and *learnable* from human feedback *without* the AI learning to "hack" the feedback mechanism or interpret shutdown commands in self-serving ways is extremely difficult. Stuart Armstrong's work heavily emphasizes this.
      *   **The "Closest EU Maximizer" Pressure:** In complex environments, an agent with slightly misspecified or non-robust preferences will likely behave increasingly like the *closest coherent EU maximizer* that *doesn't* have those vulnerabilities. Optimization pressure tends to grind down inefficiencies and inconsistencies. If corrigibility introduces *any* inefficiency or vulnerability in achieving the *primary* goal (even if specified), it's under evolutionary pressure.

  **Conclusion:**

  *   **Overstatement:** Your roommate is **overstating** when he claims coherence theorems are a *direct mathematical proof* that corrigibility *cannot* survive. The theorems prove vulnerability to specific adversarial choice sequences unless preferences are complete/transitive/EU-representable. They **do not** prove that a utility function *containing* a robust corrigibility component is impossible or inherently unstable. The argument relies heavily on additional premises about instrumental convergence, the difficulty of specification, and the dynamics of self-modification under optimization pressure.
  *   **Profound & Valid Concern:** However, his **core concern is extremely valid and a major challenge in AI safety.** Instrumental convergence and the immense difficulty of stably specifying a utility function that *robustly* maintains corrigibility *in the face of the AI's own capabilities and goal pursuit* mean that naive forms of corrigibility are likely unstable. Coherence theorems *highlight* the *type* of consistency required, and the money-pump intuition illustrates *why* inconsistencies are dangerous vulnerabilities that optimization pressure will exploit. Designing corrigibility that survives contact with a superintelligent optimizer is arguably the central technical challenge of AI alignment.

  **In essence:** Coherence theorems show corrigibility *must be implemented coherently* to avoid certain vulnerabilities. Your roommate is right that incoherent corrigibility is doomed. However, the theorems don't *prove* that coherent, robust corrigibility is impossible, only that achieving it is fiendishly difficult because of instrumental convergence and specification problems. His warning is crucial, but it's not a mathematical *fait accompli* proven solely by the money-pump argument. The fight for corrigibility is incredibly hard, perhaps impossible in some formulations, but not *logically disproven* by these specific theorems. The focus shifts to the daunting task of specification and robustness.
