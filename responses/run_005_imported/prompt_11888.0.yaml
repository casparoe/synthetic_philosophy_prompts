  4. France's Fifth Republic, Article 89 - republican form of government not subject to amendment.
  5. India's "basic structure doctrine" (judge-made) - no textual unamendability, but court held that Parliament cannot amend the basic structure.
  6. Turkey's constitutional provision - founding articles on secular, democratic character unamendable and not even open to proposal.
  7. Beeminder pledge - personal commitment contract with escalating penalties.

  Robustness: How resistant to being watered down, interpreted around, or formally circumvented by the constrained party.

  Vulnerability: One sentence on the main way it could be circumvented.

  Ranking considerations:

  - **Odysseus (1)**: The crew is bound to obey and not release him. But what if the crew disobeys? Or if Odysseus breaks free? In principle, if the crew holds, it's robust. But the vulnerability is that the crew might be persuaded or coerced (by Odysseus) to release him. Also, note that the constrained party (Odysseus) is bound physically and cannot act until the constraint is removed. However, the crew is the enforcer, and if they are not bound by the same commitment, they might yield. But in the story, they didn't. So in principle: vulnerability is that the enforcers (crew) might be persuaded to release the constraint.

  - **Germany (2)**: The eternity clause is textually unamendable. However, in principle, a future constitutional assembly could replace the entire constitution, but that would be a revolution, not an amendment. The Federal Constitutional Court has the power to review amendments and strike them down if they violate the eternity clause. But what if a supermajority decides to ignore the clause? Historically, it has held. Vulnerability: A determined majority might circumvent it by replacing the constitution entirely (extra-constitutionally) or by reinterpreting the concepts (e.g., what constitutes "human dignity") to allow changes.

  - **US (3)**: Article V entrenches equal suffrage in the Senate. But note: it says "no State, without its Consent, shall be deprived of its equal Suffrage in the Senate." So to change this, every single state must consent. That is very hard. However, in principle, if all states agree, it can be changed. But the constraint is on the federal amendment process. Vulnerability: States could be pressured to consent, or a constitutional convention could be called to bypass, but the text is clear. Also, note that the Supreme Court has held that some matters are non-justiciable (political question). But the main vulnerability: if enough states are persuaded to consent, the entrenchment fails.

