answer: |-
  You've pinpointed a crucial and often misunderstood nuance in the foundations of quantum mechanics. Your recollection is partially correct, but the key lies in the *specific assumptions* Bell's theorem relies upon. Bohmian mechanics (de Broglie-Bohm pilot-wave theory) carefully avoids one of these critical assumptions, allowing it to remain a viable hidden-variable theory *despite* Bell's theorem and its experimental confirmation.

  Here's a breakdown of what Bell's theorem rules out, what it doesn't, and where Bohmian mechanics fits:

  1.  **Bell's Theorem: The Core Argument & What it Rules Out**
      *   **Goal:** To test whether the predictions of quantum mechanics (QM) could be reproduced by a *local realistic theory* with hidden variables.
      *   **Key Assumptions:**
          *   **Realism (Hidden Variables):** Physical properties (like the definite spin of a particle along any axis) exist prior to and independent of measurement. These properties can be specified by hidden variables (λ).
          *   **Locality (Einstein Separability):** The result of a measurement on one particle (A) cannot depend *instantaneously* on the setting (choice of measurement basis, e.g., angle θ) of a distant apparatus measuring its entangled partner (B), and vice versa. Outcomes are determined solely by local hidden variables (λ) and the *local* measurement setting. (Formally: P(A, B | θ_A, θ_B, λ) = P(A | θ_A, λ) * P(B | θ_B, λ)).
          *   **Freedom of Choice:** Experimenters can freely choose measurement settings (θ_A, θ_B) independently of the hidden variables (λ) governing the particles. (Formally: ρ(λ | θ_A, θ_B) = ρ(λ)).
      *   **The Inequality:** Bell derived mathematical inequalities (e.g., CHSH inequality) relating the correlations between measurement results on entangled particles under different settings. These inequalities *must* be satisfied by *any* theory obeying Local Realism + Freedom of Choice.
      *   **QM Prediction & Experimental Result:** Quantum mechanics predicts (and experiments like Aspect's and the loophole-free ones confirm) violations of Bell inequalities for entangled states. The correlations are stronger than any locally realistic theory can produce.
      *   **Conclusion:** Bell's theorem, experimentally confirmed, definitively rules out **Local Hidden Variable Theories (LHVT)**. Theories satisfying *all three* assumptions (Realism, Locality, Freedom) are incompatible with the predictions of QM and experimental results.

  2.  **What Bell's Theorem Does *Not* Rule Out:**
      *   **Non-Local Hidden Variable Theories (NLHVT):** Theories that retain Realism and Freedom of Choice but explicitly *violate* Locality.
      *   **Non-Realist Theories:** Theories that abandon the idea of pre-existing definite properties (hidden variables), like standard Copenhagen QM or QBism.
      *   **Superdeterminism:** Theories that violate Freedom of Choice, suggesting the hidden variables (λ) predetermine or correlate with the experimenters' future choices (θ_A, θ_B). (Widely considered philosophically unpalatable and scientifically problematic).

  3.  **Bohmian Mechanics: The Non-Local Escape Hatch**
      Bohmian mechanics is explicitly a **Non-Local Hidden Variable Theory (NLHVT)**. Here's how it works and evades Bell's conclusion:
      *   **The Hidden Variables:** The positions of *all* particles in the universe (`q_1, q_2, ..., q_N`) are the definite "hidden variables." They always have definite values.
      *   **The Guiding Wave:** The universal wavefunction Ψ(`q_1, q_2, ..., q_N`, t) evolves according to the standard Schrödinger equation. Its role is *not* probabilistic but *dynamical*: it *guides* the particles.
      *   **The Guidance Equation:** The velocity of each particle `k` is determined by the wavefunction evaluated at the *current positions of all particles*:
          `dQ_k/dt = (ħ / m_k) * Im[ (Ψ^* ∇_k Ψ) / |Ψ|^2 ] (Q_1, ..., Q_N, t)`
      *   **The Crucial Non-Locality:** The velocity of particle `k` depends *instantaneously* on the wavefunction, which depends on the positions of *all other particles* (`Q_1, ..., Q_N`), no matter how far away they are.
      *   **Evading Bell:** Bell's theorem rules out *local* HV theories. Bohmian mechanics is explicitly *non-local*. The measurement outcome on particle A depends not only on its own hidden variable (position) and local setting but also, instantaneously via the wavefunction, on the position of particle B and the setting chosen for B. This non-local dependence allows it to perfectly reproduce the strong correlations predicted by QM and violate Bell inequalities.
      *   **Other Features:**
          *   **Deterministic:** Given initial particle positions and the wavefunction, the future is completely determined.
          *   **Empirical Equivalence:** It makes *exactly* the same predictions as standard QM for *all* measurement outcomes (statistics of position measurements are |Ψ|^2). This includes reproducing EPR-Bell correlations.
          *   **Contextuality:** While particle positions are non-contextual (they just *are*), measurements of other observables (like spin) are contextual. The outcome depends on the specific experimental setup (the measurement context) in addition to the particle's state. This is necessary for consistency.

  4.  **The "Contradiction" Resolved**
      Your initial understanding that Bell ruled out hidden variables *as a class* is slightly too broad. Bell ruled out *local* hidden variables. Bohmian mechanics is the prime example of a *non-local* hidden variable theory. It was Bohm's 1952 paper (reviving de Broglie) that directly inspired Bell to formulate his theorem *specifically to see if such non-local theories were necessary*. Bell later acknowledged that Bohm's theory provided a concrete counterexample showing that hidden variables *were* possible, but *only* if they were non-local.

  **Summary for Your Discussion Group:**

  *   **Bell's Theorem Rules Out:** Any theory that is both **Local** and **Realist** (and assumes Free Choice). Such theories *cannot* reproduce QM correlations.
  *   **Bell's Theorem Allows:**
      *   **Non-Realist Theories** (e.g., Copenhagen, QBism).
      *   **Non-Local Realist Theories** (e.g., Bohmian Mechanics).
      *   (Theoretically) Superdeterministic theories (though widely disfavored).
  *   **Bohmian Mechanics:** Is a **Non-Local Hidden Variable (Realist) Theory**. It evades Bell's theorem by explicitly incorporating instantaneous non-locality via the wavefunction's role in guiding particles. It reproduces all QM predictions, including Bell inequality violations.
  *   **Why it "Survives":** Bell proved you *must* give up either locality *or* realism to match QM. Bohmian mechanics chooses to give up locality while retaining realism (definite particle positions). Experiments like Aspect's force us to give up *something* (locality or realism); Bohm chooses to sacrifice locality.

  **Key Phrase for Clarity:** "Bell's theorem doesn't rule out hidden variables *per se*; it rules out *local* hidden variables. Bohmian mechanics is explicitly *non-local*, which is precisely how it avoids the force of Bell's argument while maintaining realism."

  Bohmian mechanics remains philosophically controversial (mainly due to its explicit non-locality and the ontological status of the wavefunction), but it is logically consistent and empirically equivalent to standard QM. Bell's theorem, rather than killing it, helped define the *necessary condition* (non-locality) for any viable hidden-variable completion of QM.
