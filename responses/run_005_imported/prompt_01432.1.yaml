answer: |-
  You're absolutely on the right track with Quine's demolition job on the analytic/synthetic distinction dragging down the fact/value dichotomy too – that's a crucial and insightful connection. However, **Quine likely would *not* have agreed that ethics is "just as empirical and objective as physics" in the strong sense you suggest.** While holism *includes* ethical statements in the web, their *epistemic status* within that web is fundamentally different for Quine. Here's the nuance to avoid overselling:

  1.  **Holism Includes Everything:** Yes, Quine's web of belief holism ("Two Dogmas") explicitly includes *all* statements susceptible to empirical testing – logical, mathematical, physical, *and* ethical. There's no separate realm for values. Moral claims *are* part of the interconnected whole tested against "the tribunal of sense experience," albeit often very indirectly.

  2.  **Empirical Doesn't Mean Identical Epistemic Status:** Crucially, Quine emphasized that statements occupy different positions *within* the web:
      *   **Central/Hard Core:** Highly theoretical scientific statements (fundamental physics laws) are deeply embedded, connected to many others. Revising them causes massive upheaval. Their confirmation is robust, indirect, and tied to successful prediction.
      *   **Periphery:** Statements closer to direct observation (e.g., "There's a rabbit") are more easily revised with minimal disruption. Value statements, for Quine, tend to reside *here*, on the periphery.
      *   **Values on the Periphery:** Ethical claims ("Stealing is wrong," "Charity is good") are, in Quine's view, *more sensitive* to cultural conditioning, personal sentiment, and social reinforcement than core scientific claims. While their truth *can* be influenced by experience (e.g., observing consequences of actions, societal collapse from injustice), the *connection* is often looser, more mediated by complex psychological and social factors than the connection between a physics theory and a specific experimental outcome.

  3.  **Quine's Explicit Views on Ethics: Relativism, Not Physics-like Objectivity:**
      *   Quine was a **moral relativist**. He believed ethical truths are relative to cultures or individuals, lacking the universal, mind-independent objectivity he attributed (cautiously) to physical science.
      *   In "The Nature of Natural Knowledge" and elsewhere, he argued that while science aims (imperfectly) at describing an objective external world, **ethics stems primarily from our subjective "moral sense," shaped by evolution and culture.** He saw it as more akin to *aesthetics* than physics.
      *   He viewed ethics as fundamentally *descriptive of human attitudes and behavior* (a subject for anthropology/psychology), not as discovering objective moral facts "out there" like electrons. Naturalism, for Quine, meant studying *how* humans form values empirically, not validating the objective truth of those values in the same way we validate physical theories.

  4.  **The Crucial Distinction: Descriptive vs. Normative Naturalism:**
      *   **Descriptive Naturalism (Quine Strongly Agrees):** Ethics, *as a phenomenon*, must be studied empirically (psychology, sociology, biology). How *do* humans form moral judgments? This fits squarely within his web.
      *   **Normative Naturalism (Quine Skeptical):** The view that *normative ethical claims themselves* (e.g., "X is *truly* good/right") can be objectively justified *in the same way and to the same degree* as scientific claims, using empirical evidence and reason alone. Quine did *not* endorse this strong view. He saw values as expressions of preference/attitude, not discoveries of objective facts.

  **How to Frame It Accurately (and Still Powerfully) in Your Piece:**

  *   **Correct:** Quine's holism *demolishes the firewall* between fact and value. Value statements are *not* a separate, non-cognitive species; they are *part of* the holistic web of belief.
  *   **Correct:** Moral claims *are* therefore subject to empirical pressure, *in principle*. Experience *can* challenge our value systems (e.g., observing the suffering caused by a supposedly "good" practice can force revision).
  *   **Crucial Nuance:** However, for Quine, ethical statements reside on the *periphery* of the web. They are:
      *   More directly tied to subjective sentiment and cultural conditioning.
      *   Less central and less tightly constrained by sensory evidence than core scientific theories.
      *   Understood by Quine himself as expressions of relative preference or culturally ingrained attitudes, not discoveries of objective moral facts akin to physical laws.
      *   Therefore, while *included* in the empirical web, they do *not* possess the same *kind* or *degree* of objectivity, universality, or empirical grounding as fundamental physics for Quine. The *process* of testing involves coherence with the whole web, but the *evidential weight* and *revisability* differ significantly based on position and origin.

  **Strong Phrasing for Your Piece:**

  > "Quine's demolition of the analytic/synthetic distinction didn't just shake epistemology; it fatally undermined the fact/value dichotomy too. His holistic 'web of belief' has no room for value statements as a separate, non-empirical species. Moral claims *are* woven into the same fabric as scientific ones, susceptible in principle to the tug of experience. However, Quine himself saw ethics as residing on the web's periphery – shaped profoundly by sentiment and culture, lacking the robust, theory-laden objectivity he attributed to core science. While holism forces values *into* the empirical arena, it doesn't grant them physics-like objectivity; for Quine, ethics remained closer to culturally relative expressions of preference than discoveries of universal moral facts."

  This captures the revolutionary inclusivity of his holism regarding values while accurately reflecting Quine's own skeptical and relativistic stance on their ultimate objectivity. It avoids overselling him as a normative naturalist while still highlighting how he destroyed the positivist compartmentalization of values.
