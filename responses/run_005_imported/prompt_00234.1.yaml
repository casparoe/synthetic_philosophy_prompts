prompt: |-
  So I'm taking a philosophy of language seminar rn and we just spent like two weeks on Wittgenstein's Philosophical Investigations, specifically the private language argument and the whole "meaning is use" thing plus language games and forms of life. My professor keeps dodging the question of whether any of this bears on the current LLM understanding debate (the whole "stochastic parrots" thing), which is driving me a little nuts b/c it feels SO relevant to what we're reading. Like on one hand, Wittgenstein seems to think meaning can't be some private mental thing tied to an inner act of understanding, its all about use within a shared social practice - which almost sounds like it could be sympathetic to LLMs actually understanding, since all they do is track and reproduce patterns of use too. But then again his stuff about forms of life might require embodiment, needs, a way of living and acting in the world, which LLMs totally lack.

  Can you try to reconstruct what Wittgenstein would probably say if he were shown GPT-4 or Claude and asked "does this thing understand English?" Please work through both the private language argument and the forms-of-life stuff and don't just give me a wishy-washy "he'd probably say its complicated" answer - actually commit to a specific verdict you think he'd land on, and justify it using his actual arguments/concepts.
