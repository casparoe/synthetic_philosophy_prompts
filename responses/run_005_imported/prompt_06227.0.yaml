answer: |-
  The polished chrome booth hissed open. Steam curled around Dr. Aris Thorne’s sensible boots as she stepped out into the sterile tribunal chamber. Across the room, Marcus Keller, counsel for the aggrieved party, gave her a look that could curdle synth-milk. *He thinks I’m a sophist selling snake oil,* Aris thought, suppressing a weary smile. Her PhD thesis on persistence through time gathered dust in a forgotten university archive; now, it paid her rent.

  The case was depressingly familiar: a routine teleportation to a lunar resort. Malfunction. Instead of the original dissolving and a single copy integrating on the moon, two copies materialized – one on Luna, one still on Earth. The original? Vaporized, as protocol demanded. The deceased, one Evelyn Vance, a reclusive tech heiress, had left everything to "myself, as the sole continuing entity resulting from any duplication event I authorize." Now, two Evelyns claimed the fortune.

  "Dr. Thorne," the tribunal chair began, a weary bureaucrat drowning in metaphysics. "Your report concludes both claimants have an equally valid, though not *identical*, claim to be the continuer of Evelyn Vance. Explain, simply."

  Aris took a breath. She hated 'simply'. "Chair, persistence isn't a single, monolithic *thing*. It's a pattern holding over time. The Evelyn Vance who entered that booth was a specific configuration of matter, information, memory, and intention. The booth captured that configuration perfectly. The malfunction created two instances *both* embodying that pattern at the moment of scan."

  Keller slammed a hand on the table. "Nonsense! A person *is*. Wholly and completely, at each moment. Evelyn Vance walked into that booth. *One* person. Now you have *two*. By the irrefutable logic of identity – if A equals B, and A equals C, then B *must* equal C. But these two women," he gestured to the partitioned viewing screens where the two Evelyns sat, oblivious, "are clearly *not* identical to each other. They've already diverged! Luna-Evelyn experienced zero-gravity sickness; Earth-Evelyn filed a complaint with the booth company. Therefore, neither can be identical to the original Evelyn! At best, flawed copies."

  The chair rubbed his temples. "Dr. Thorne? This 'A equals B equals C' bit sounds… solid."

  Aris felt the familiar pressure, the tightrope walk between the intuitive and the ontologically rigorous. "It *sounds* solid, Chair, because we instinctively think of persons as *enduring* objects – like a statue, wholly present at each moment. If the statue splits, which piece *is* the original statue? Neither, entirely. That's Endurantism. But people aren't statues."

  She leaned forward, addressing the tribunal, but her gaze flickered to Keller. "Think of a person not as a solid block, but as a *stage* in a vast, unfolding process. Like a single frame in a filmstrip. Evelyn Vance at the moment of scan was a specific stage. The *persistence* of Evelyn Vance isn't her being that exact stage forever; it's the *connection* between that stage and future stages – causal links, memory chains, psychological continuity."

  Keller scoffed. "Word games. You're dodging identity."

  "No," Aris countered, her voice sharpening. "I'm questioning whether strict, numerical identity is doing the work we think it is when we talk about 'the same person over time'. Stage Theory, a flavor of Perdurantism, says the 'person' we name – Evelyn Vance – primarily refers to the *current stage*. When we say 'Evelyn Vance survived the teleport', we mean the pre-teleport stage has *counterparts* – later stages appropriately connected to it. The malfunction meant the pre-teleport stage had *two* equally well-connected counterparts. Both inherit the claim from the source stage."

  "So, neither *is* Evelyn Vance?" Keller pressed, sensing blood. "Just… successors?"

  "They *are* Evelyn Vance," Aris insisted, "in the only sense that matters for continuity. They each carry forward the narrative thread, the legal identity, the psychological essence *from* that scanned stage. Demanding they be *identical* to the original or to each other misunderstands what persistence through time *is*. It’s not cloning; it’s branching."

  The argument hung in the air. Aris felt a familiar exhaustion, deeper than the late hour. She remembered her thesis defense, the crushing weight of trying to pin down the self. She remembered her own life – Aris Thorne, PhD candidate, fiercely independent, collapsing into a weeping heap after her partner left. Was *that* woman, bent double on the floor, identical to the woman who hours later calmly graded papers? If persistence required unchanging essence, who survived that night? Yet, she *felt* continuous. A thread, frayed but unbroken.

  Keller pounced on her hesitation. "Branching? Fine. But the will specifies 'the sole continuing entity'. *Sole*. Branching violates that condition. Only one path can be the *true* continuation under Endurantism. The law requires a single, enduring entity, Dr. Thorne. Your branching metaphysics dissolves the very concept the will relies upon!"

  Aris met his gaze. "The law uses the language of persistence, Mr. Keller. It doesn't specify *which* metaphysics underpins it. Insisting on Endurantism forces an impossible choice: declare both copies non-persons, voiding the will entirely, or arbitrarily pick one, violating the equal claim generated by the booth's function. Stage Theory offers coherence: both are continuers; the inheritance *also* branches."

  The tribunal deliberated. Aris stared out the window. The city lights blurred. She saw her reflection superimposed – the sharp-suited expert witness, and beneath her, the ghost of the exhausted woman who’d cried herself to sleep last week. *Same stage?* The problem of temporary intrinsics wasn't abstract. Her tiredness now, her energy later – how could the *same* enduring thing possess contradictory properties? Unless... it wasn't the *whole* thing present at each moment. Just a slice. A stage linked to others.

  The chair cleared his throat. "We find Dr. Thorne's analysis... pragmatically persuasive. The will's intent was for the Evelyn Vance pattern to continue and inherit. The malfunction created two equally valid continuations of that pattern from the point of scan. The estate will be divided equally between both claimants."

  Keller gathered his things, his face stony. "Sophistry wins the day, Doctor. Enjoy your fee. But you haven't solved the puzzle. You've just declared it wasn't a puzzle in the first place." He stalked out.

  Aris didn't move. The verdict was clean, legally sound. But Keller's jab echoed. Had she dissolved the puzzle, or just answered it differently? The two Evelyns would get their money. But which one, if either, *was* the woman who signed the will? Under the bright lights, the question felt less like metaphysics and more like a dull ache.

  She walked out into the cool night air, the city humming around her. Her body felt heavy with fatigue now, but her mind buzzed with the unresolved tension. She knew tomorrow, rested, she’d feel like herself again – a different stage, but connected. The transitivity of identity was a powerful argument. But maybe, just maybe, persistence was a different kind of glue, holding stages together without demanding they all be the *same* thing. The ache remained. The puzzle, she suspected, endured.
