answer: |-
  That line significantly overstates the case and misrepresents the Church-Turing Thesis (CTT). **Your editor is right to push back.** Telling readers that quantum computing has "effectively disproven" the CTT is inaccurate and misleading, despite the genuine revolutionary potential of quantum speedups. Here's why:

  1.  **The Core Misunderstanding: Computability vs. Complexity:**
      *   **CTT is about *Computability*:** The CTT asserts that any effectively calculable function can be computed by a Turing machine. It defines *what* is computable in principle, given unlimited time and resources.
      *   **Shor's Algorithm is about *Complexity*:** Shor's demonstrates a problem (factoring large integers) that is *computable* on a classical Turing machine (we can write an algorithm for it!), but is believed to be intractable (exponentially slow) for classical machines on large inputs. Quantum computers offer a *feasible* (polynomial-time) solution. This is a *complexity* speedup, not a *computability* breakthrough.

  2.  **What Quantum Computers *Don't* Do:**
      *   They do **NOT** compute functions that are uncomputable by a classical Turing machine. There is no known problem that a quantum computer can *solve* (give a definite yes/no answer) that a classical Turing machine cannot *eventually* solve, given infinite time and space. Shor's factors integers; we *know* classical algorithms exist to factor integers, they are just impractically slow for large numbers.

  3.  **The "Effective Method" Ambiguity:**
      *   The CTT uses the term "effective method" or "algorithm," which is intuitive but not mathematically rigorous. Proponents of the view that quantum computing "challenges" CTT argue that an "effective method" should be *feasibly executable*. Since quantum mechanics seems fundamental, a quantum computer *is* an "effective method" that a classical Turing machine cannot feasibly simulate.
      *   **Counterargument:** The standard interpretation of CTT has always been about *theoretical* possibility, not practical feasibility. A classical Turing machine *can* simulate a quantum computer's evolution (albeit exponentially slowly). This simulation *proves* the quantum-computable function is also classically computable, upholding the CTT in its traditional sense.

  4.  **The "Extended" Church-Turing Thesis (ECTT) *is* Challenged:**
      *   The **Extended CTT** is the crucial distinction. It states that any *reasonable* model of computation can be simulated by a probabilistic Turing machine with at most a *polynomial* increase in time/space. This is fundamentally about *efficiency* and *feasibility*.
      *   **Shor's Algorithm *directly challenges* the ECTT:** It strongly suggests that quantum computers can solve certain problems (factoring, discrete log) exponentially faster than *any* possible classical algorithm. If true (and factoring is classically hard), this means quantum computers violate the polynomial-time simulation requirement of the ECTT. This is the *real* profound implication.

  5.  **Mature Hardware? Irrelevant to CTT:**
      *   Hardware maturity demonstrates *engineering progress* towards building useful quantum computers. It does *not* change the fundamental theoretical relationship between quantum computation and the CTT/ECTT. Even with perfect hardware, Shor's factors integers – a classically computable problem. The CTT question remains purely theoretical.

  **The Genuine Debate Among Serious Computer Scientists:**

  *   **Hedging is Absolutely Warranted:** This is **not** a settled result against the *classical* CTT. The vast majority of theoretical computer scientists accept that quantum computers do *not* violate the classical CTT's core claim about computability.
  *   **Focus on the ECTT:** The active debate centers entirely on the **Extended CTT**:
      *   **Pro-Challenge:** Scott Aaronson (a leading QC complexity theorist) states: "The extended Church-Turing thesis is false, if quantum mechanics is true." The existence of an efficient quantum algorithm for a problem believed to be classically hard is strong evidence.
      *   **Hedging/Caveats:**
          *   **Formal Proof Lacking:** We don't have an *absolute proof* that factoring (or other BQP problems) is not in P (solvable efficiently classically). It's widely believed, but not proven. Proving P ≠ BQP is a Millennium Prize problem.
          *   **Physical Church-Turing Thesis:** Some argue that the CTT should encompass the laws of physics. If quantum mechanics is fundamental, then a quantum computer *is* a physically realizable "effective method," and classical Turing machines cannot efficiently simulate it. This *could* be seen as challenging the *physical* interpretation of CTT, though it still upholds the *mathematical* CTT.
          *   **Interpretations of QM:** Some interpretations (like de Broglie-Bohm) might allow efficient classical simulation, though these are minority views.

  **What You Should Tell Your Readers (Accurately):**

  1.  **Focus on the ECTT:** "While quantum computers don't change the fundamental definition of *what* can be computed (upholding the original Church-Turing Thesis), Shor's algorithm and others provide strong evidence that they can solve certain *specific, important problems exponentially faster* than any conceivable classical computer. This profoundly challenges the *Extended* Church-Turing Thesis, which posited that all physically realizable computing models are roughly equivalent in efficiency."
  2.  **Emphasize Feasibility, Not Computability:** "The revolution isn't about solving the unsolvable; it's about making the previously *impractical* suddenly *feasible*. Problems like factoring large numbers or simulating complex molecules, which would take classical supercomputers longer than the age of the universe, could potentially be cracked by quantum machines in hours or days."
  3.  **Acknowledge the Nuance:** "Theoretical computer scientists largely agree that quantum speedups like Shor's don't violate the original Church-Turing idea about computability. However, they represent a fundamental challenge to the long-held belief (the Extended Thesis) that all reasonable forms of computation are roughly equivalent in their practical efficiency. Whether quantum computing definitively breaks this extended thesis hinges on deep, unproven conjectures in complexity theory, like P versus NP, but the evidence from algorithms like Shor's is incredibly compelling."

  **In short:** Your draft line is incorrect regarding the classical CTT. The hardware progress is impressive, but irrelevant to this specific theoretical point. The *Extended* CTT is the thesis genuinely under fire, and while the evidence is very strong, the absolute mathematical proof remains elusive, warranting the careful language used by experts. **Revise your draft to focus on the challenge to the *Extended* CTT and the revolutionary nature of *efficiency* gains, not fundamental computability.**
