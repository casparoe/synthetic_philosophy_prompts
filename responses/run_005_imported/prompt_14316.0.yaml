  - **Compatibilism**: Why PAP rejection doesn’t entail compatibilism (her semi-compatibilist stance).  

  The tone should be collegial but sharp—questions are steelmanned but leave no escape hatches. Example: If she calls an alternative "non-robust," the follow-up demands criteria independent of her conclusion.  

