prompt: |-
  Next month I'm taping an episode of the little free will podcast I run with two of my grad students, and the guest is a philosopher who's built her whole reputation on Frankfurt-style counterexamples to the principle of alternative possibilities (PAP) -- semicompatibilist, very much in the guidance-control camp. I caught her give a talk on this last spring and noticed that whenever someone presses her on residual alternatives she just says something like "that's a flicker, not a freedom" and moves on to the next question, which works fine live but would make for a pretty thin episode if I let her get away with it on tape.

  Could you draft me eight to ten interview questions for the taping? Nothing that just invites her to re-run the Black-and-Jones setup for listeners -- I want at least one question that makes her actually cash out what makes an alternative possibility "robust" enough to matter without just building the conclusion in by definition, one on Widerker's dilemma defense and whether the buffered/blocked versions of the case (the Mele-and-Robb style ones) genuinely escape it or just relocate the same problem into the buffer, and one that puts the question-begging worry to her stright: that the whole strategy assumes from the start that facts about the actual sequence are enough for responsibility, which is exactly what a leeway incompatibilist denies and hasn't been given independent reason to grant. For each of those three, give me a follow-up keyed to whatever answer she's most likely to give, including at least one way to call her on the "flicker, not a freedom" line if she tries to use it as a dodge rather than an answer. Round out the rest of the list with other questions a well-prepared interviewer in this literature would ask.
