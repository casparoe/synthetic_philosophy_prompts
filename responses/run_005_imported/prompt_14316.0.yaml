answer: |-
  Here’s a targeted 10-question interview draft designed to push beyond rehearsed answers, challenge key assumptions, and force engagement with the deepest objections. Each core question includes a likely-response-based follow-up:

  ### Core Questions & Follow-Ups
  1. **Robustness Challenge**:  
     *"You argue that Frankfurt cases show responsibility doesn’t require robust alternatives. But how do you define ‘robustness’ here without presupposing that only *certain kinds* of alternatives matter for freedom? Isn’t the leeway incompatibilist right that any alternative possibility—even a ‘flicker’—could be the metaphysical ground for responsibility if it’s causally relevant?"*  
     **Follow-up (if she dismisses as "flicker")**: *"If the alternative possibility in a Frankfurt case (e.g., Jones’s neural flicker of hesitation) is causally active in the actual sequence—say, triggering Black’s intervention—why isn’t that *exactly* the kind of difference leeway theorists need? How is this ‘flicker’ functionally different from a ‘freedom’?"*  

  2. **Widerker’s Dilemma & Buffers**:  
     *"Widerker argues that in preemptive Frankfurt cases (like Mele-Robb), the ‘buffering’ mechanism (e.g., the prior neural setup) either causally determines the action (making it unfree) or leaves indeterminism that allows alternatives (saving PAP). Does your preferred buffered model avoid this dilemma, or does it just relocate the threat of determinism/indeterminism into the buffer itself?"*  
     **Follow-up (if she claims escape)**: *"Take the Mele-Robb case: If the buffer ensures Jones *must* decide to act at T1, isn’t that deterministic control? If the buffer only *probabilistically* constrains, doesn’t Jones retain alternative possibilities at T1—violating the no-alternatives condition?"*  

  3. **The Question-Begging Charge**:  
     *"Leeway incompatibilists contend that Frankfurt strategies *assume* actual-sequence facts suffice for responsibility—the very point they deny. What independent reason—beyond Frankfurt intuitions—do we have to accept that guidance control alone grounds responsibility, especially when the agent couldn’t have done otherwise?"*  
     **Follow-up (if she appeals to Frankfurt intuition)**: *"But isn’t relying on Frankfurt-case intuitions circular here? If the opponent denies that responsibility is possible without alternatives, they’ll reject the Frankfurt intuition *because* it assumes guidance control is sufficient. What non-question-begging argument breaks this deadlock?"*  

  4. **Flicker Strategies & Causality**:  
     *"Eleonore Stump and others argue that even in Frankfurt cases, agents retain alternative possibilities *in the actual sequence* (e.g., the possibility of acting from a different motive). Why dismiss these as ‘flickers’ if they might provide the leeway needed for responsibility? Isn’t the burden on you to show why *only* robust alternatives matter?"*  
     **Follow-up (if she doubles down on "flickers")**: *"Couldn’t a leeway theorist argue that responsibility supervenes on the *causal history* of the action—and that any alternative possibility affecting that history (like a flicker of resistance) is sufficient? How do you rule this out without assuming your conclusion?"*  

  ### Depth & Nuance Questions
  5. **Scope of FSCs**:  
     *"Frankfurt cases are highly contrived interventions. How do they show that *ordinary* responsibility (in non-intervention scenarios) doesn’t require alternatives? Couldn’t PAP hold in normal cases even if FSCs are exceptions?"*  

  6. **Sourcehood vs. Leeway**:  
     *"You defend ‘guidance control’ as sourcehood without leeway. But doesn’t sourcehood itself require *some* form of alternative possibilities? For example, if an agent *couldn’t* have been responsive to different reasons, are they truly the ‘source’?"*  

  7. **Manipulation & Actual Sequences**:  
     *"In cases like Pereboom’s ‘Tax Evasion’ (where an agent is manipulated but satisfies actual-sequence conditions), you’d deny responsibility. Doesn’t this show that guidance control alone *isn’t* sufficient? What does this imply about the Frankfurt strategy’s limits?"*  

  8. **Compatibilist Commitments**:  
     *"Semicompatibilism says moral responsibility is compatible with determinism *without* needing alternatives. But if determinism is true, doesn’t it also threaten the *actual-sequence capacities* (e.g., reasons-responsiveness) that guidance control relies on? Why isn’t the incompatibilist worry just pushed back a step?"*  

  ### Closing Challenge
  9. **The Hardline Reply**:  
     *"Some incompatibilists (e.g., Derk Pereboom) concede FSCs defeat PAP but argue that *determinism* directly undermines control. If we grant your view for Frankfurt cases, what positive argument do you offer against the *incompatibility* of determinism and guidance control?"*  

  10. **The Big Picture**:  
      *"Suppose we accept your view: Responsibility requires only guidance control, not alternatives. What experiment, neuroscientific finding, or thought experiment could *falsify* this claim? What would count as evidence against semicompatibilism?"*  

  ### Tactical Notes:
  - **When she says "flicker, not a freedom"**: Immediately pivot to Q1 Follow-up or Q4. Demand she explains **why** the flicker isn’t a freedom—not just assert it.  
  - **On question-begging**: If she appeals to "guidance control" as basic, press her on Q8 or Q10 to show it’s not axiomatic.  
  - **On buffers**: If she claims Mele-Robb avoids Widerker, hammer Q2 Follow-up on whether the buffer introduces hidden determinism/indeterminism.  
  - **Stay grounded**: Anchor questions in specific cases (Mele-Robb, Pereboom’s Tax Evasion) to avoid abstraction.  

  This forces engagement with the Achilles’ heels of FSCs: the *ad hoc* dismissal of alternatives, the dialectical circularity, and the unresolved threat of determinism to actual-sequence control. Good luck—this guest won’t know what hit her.
