prompt: |-
  I'm a PhD student in philosophy of biology, currently drafting a dissertation chapter on rival theories of biological function, and I keep running into trouble with cases of exaptation. Could you compare the etiological account of function that runs from Wright through Millikan and Neander's 'selected-effects' refinement to Cummins's causal-role account? I'm especially interested in how each would assign a current function to a trait that was originally selected for one effect but is now maintained by selection for quite a different effect it was later co-opted to perform — the standard illustration being feathers, usually said to have evolved first for thermoregulation and only later been co-opted for flight. Does the etiological account need a move like Godfrey-Smith's restriction to 'recent' rather than 'origin' selective history to avoid the wrong verdict here, and is that move principled or merely ad hoc? Does the causal-role account only dodge the difficulty by reintroducing the familiar worry that causal-role functions are too liberal, since it must non-arbitrarily single out which systemic capacity — thermoregulation or flight — is the relevant one? I'd like a considered verdict, with justification, on which account handles exaptation more successfully, and whether it can do so without simply being patched to fit the case after the fact.
reasoning: |-
  Okay, the user is a PhD student in philosophy of biology working on a dissertation chapter about biological function theories, specifically struggling with exaptation cases like feathers. They want a comparison between etiological and causal-role accounts regarding how each handles a trait's current function when its maintenance reason differs from its origin reason.

  First, I need to recall the core differences between these accounts. The etiological theory, especially the selected-effects version by Millikan and Neander, defines a trait's function based on its evolutionary history—why it was selected. Cummins's causal-role account, however, focuses on the current causal contribution within a system. The challenge is exaptation: a trait originally selected for one function (feathers for thermoregulation) now maintained for another (flight). 

  The user's main concerns are whether the etiological account needs Godfrey-Smith's "recent history" modification to avoid assigning the original function incorrectly, and if this fix is principled or ad hoc. For the causal-role account, they worry about arbitrariness in selecting which current causal role is the function, leading to over-liberality.

  Breaking down the etiological account: Under Millikan/Neander, the function is tied to the original selection. So for feathers, thermoregulation remains the function, even if flight is currently maintaining it. That seems counterintuitive. Godfrey-Smith's proposal to focus on recent selection history might solve this by assigning flight as the function. But is this principled? The user questions if it's ad hoc. I think it can be principled if tied to current stabilizing selection, but defining "recent" is tricky. Griffiths' modern history approach offers a clearer criterion: the last period of selection. Still, it introduces a demarcation problem between historical periods.

  For the causal-role account, Cummins defines function based on current causal contributions in a containing system. Feathers contribute to both thermoregulation and flight. To avoid over-liberality, we need to specify the system and capacity. If the system is the organism and the capacity is locomotion, flight is the function. But if it's homeostasis, thermoregulation is. The user worries this is arbitrary. However, Cummins emphasizes explanatory context. The function isn't inherent but relative to the analysis. So in an explanation of bird flight, feathers' function is flight. But this context-dependence might not satisfy the need for a definitive answer.

  Comparing both: The etiological account with a modern history adjustment aligns better with biological practice, where current maintenance matters. It avoids the original function sticking problem. The causal-role account handles exaptation by focusing on current roles but at the cost of relativism. The user likely needs a theory that captures normative functions without arbitrariness.

  Assessing which handles exaptation better: The etiological account's recent history approach seems more successful. It grounds the function in selection but updates it based on current pressures, offering a principled criterion. The causal-role account's context-dependence might be too flexible for the user's needs. However, the user might also be looking for whether any account can handle exaptation without post-hoc patches. The etiological account's adjustment isn't ad hoc if integrated as a refinement based on current selective pressures.

