answer: |-
  Here's a rigorous analysis of how the etiological (selected-effects) and causal-role accounts handle exaptation, addressing your core concerns about theoretical adequacy, arbitrariness, and ad hoc modifications:

  ### 1. **Etiological Account (Wright/Millikan/Neander) & Exaptation**
     - **Core Tenet**: A trait's function is the effect for which it was *historically selected*.
     - **Exaptation Problem**: For feathers, the strict etiological account assigns thermoregulation as the "proper function" (Millikan) because that was the original selective pressure. This ignores the current maintenance by selection for flight.
     - **Godfrey-Smith's "Recent History" Move**: 
       - **Proposal**: Restrict function attribution to the *most recent period of selection* (e.g., flight for modern birds).
       - **Principled Justification?** Yes, if grounded in *stabilizing selection*. Traits are maintained by *current* selective pressures. Godfrey-Smith links function to the *stabilizing* phase of a trait's history, not its origin. This aligns with how biologists often use "function" (e.g., "feather function in birds is flight").
       - **Potential Weakness**: "Recent" is vague. Griffiths' "modern history" refinement (focusing on the trait's current form) offers a clearer criterion: function is the effect maintained by selection *in the lineage's current selective regime*.
       - **Not Ad Hoc**: This modification addresses a genuine limitation—the conflation of *origin* with *maintenance*—and reflects evolutionary biology's emphasis on ongoing selection.

  ### 2. **Causal-Role Account (Cummins) & Exaptation**
     - **Core Tenet**: A trait's function is its current causal contribution to a *system's capacity* (e.g., feathers contribute to flight in avian locomotion systems).
     - **Exaptation Handling**: Seamlessly assigns "flight" as a function of feathers because they causally enable flight *now*. Thermoregulation is also a function if analyzed within a thermoregulatory system.
     - **The Liberality Problem**:
       - **Challenge**: Feathers contribute to *many* systemic capacities (flight, thermoregulation, display). Which is "the" function?
       - **Cummins' Solution**: Functions are *explanatorily relative*. There is no single "true" function—it depends on the *analytical context* (e.g., explaining flight vs. insulation).
       - **Non-Arbitrariness Claim**: The relevant capacity is specified by the *investigator's explanatory goals*. In practice, biologists prioritize capacities that are *biologically significant* (e.g., flight is fitness-relevant in birds; thermoregulation is not).
       - **Residual Worry**: Without an evolutionary anchor, "significance" risks being anthropocentric. Why privilege flight over display or waterproofing?

  ### 3. **Comparative Verdict: Which Handles Exaptation Better?**
  - **Etiological Account (with Modern-History Refinement) Wins**:
    - **Success**: It captures the *normative* dimension of function (what a trait *should* do) by tying it to selection. Godfrey-Smith/Griffiths refinements avoid the "wrong verdict" for feathers by focusing on *current maintenance*, yielding the biologically intuitive answer (flight).
    - **Justification**: This avoids being ad hoc because:
      1. **Empirical Grounding**: Biologists routinely distinguish ancestral vs. current functions (e.g., in exaptation literature).
      2. **Theoretical Coherence**: Stabilizing selection is central to evolutionary theory—functions map to what selection *currently maintains*.
      3. **Predictive Power**: Explains malfunction (e.g., flightless bird feathers are dysfunctional) better than causal-role accounts.

  - **Causal-Role Account's Shortcomings**:
    - **Liberality Unresolved**: While explanatory relativity avoids arbitrariness *in principle*, it struggles to explain why *only certain causal roles* are cited as functions in biological discourse (e.g., textbooks label feathers "for flight," not thermoregulation). Evolutionary significance is tacitly imported.
    - **No Normativity**: Cannot ground claims like "a broken wing is dysfunctional"—it still contributes causally to thermoregulation/display.

  ### 4. **Key Philosophical Insights**
  - **Etiology's Edge**: Exaptation cases reveal that biological function is inherently *historical-normative*. The selected-effects account (properly refined) best captures this, as it links function to fitness *consequences shaped by selection*.
  - **Causal-Role's Niche**: Useful for analyzing *proximal mechanisms* (e.g., in physiology) but fails to capture the *evolutionary rationale* for a trait's presence.
  - **Godfrey-Smith/Griffiths Move: Principled, Not Patched**:
    - **Principled Basis**: Shifting focus to "recent/modern history" aligns with the *etiological signature of adaptation*—selection must maintain the trait *in its current form*. An origin-only view conflates historical contingency with current utility.
    - **Demarcation Solved?**: Griffiths uses the trait's *current selective regime* as the cutoff. While fuzzy at speciation boundaries, this is no more problematic than species concepts themselves.

  ### **Conclusion**
  The **modern-historically refined etiological account** (e.g., Griffiths) handles exaptation most successfully. It assigns flight as the function of feathers in modern birds by anchoring function to *current stabilizing selection*, avoiding the origin problem without ad hoc fixes. The causal-role account dodges exaptation but at the cost of liberalism and loss of normativity, implicitly relying on evolutionary intuitions it formally rejects. 

  **Recommendation for Your Chapter**: Argue that exaptation isn't a counterexample to etiological theories but rather *motivates a necessary refinement*—one grounded in the distinction between a trait's origin and its current maintenance by selection. This refinement is principled, empirically informed, and preserves the account's core strength: explaining why traits exist *in virtue of* their functional effects.

  *Would you like a deeper dive into Griffiths' "modern history" criterion or how this applies to contested cases (e.g., human psychological traits)?*
