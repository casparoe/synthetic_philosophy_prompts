answer: |-
  What a delightful collision of worlds! It's fantastic to hear a veteran amphibian visual physiologist dive headfirst into the philosophical whirlpool surrounding those very ganglion cells. Lettvin et al.'s "What the Frog's Eye Tells the Frog's Brain" remains a foundational text for good reason, and you've hit the nail on the head regarding its enduring philosophical fascination. Let's break down Millikan and Dretske, Swampman, and the disjunction problem precisely.

  **1. Millikan vs. Dretske: Where the Paths Diverge**

  You're right about the family resemblance. Both are pioneers of teleosemantics, grounding mental content (meaning) in biological *function*, specifically *proper function* derived from evolutionary history or learning history. Both aim to solve the disjunction problem and account for misrepresentation. The core difference lies in **what kind of history fixes the function, and consequently, the content.**

  *   **Ruth Millikan: Selection History is Paramount**
      *   **Core Idea:** The content of a representation-producing mechanism (like the frog's snap-trigger system) is fixed by **what that mechanism was *selected for* by natural selection over evolutionary time.** The proper function of the mechanism is to indicate *whatever property its indicating reliably contributed to the fitness of ancestors possessing it*.
      *   **Frog Application:** The mechanism producing the "snap-trigger" state was selected for because, in the frog's natural history, its activation was reliably caused by *nutritious flies* (or similar small, erratically moving prey). The mechanism exists *because* it detected flies (and led to successful snaps/eating). This selective history is constitutive of the mechanism's *proper function*: to indicate the presence of a fly.
      *   **Content:** Therefore, the state means **"fly" (or "small nutritious prey here!")**. The mechanism's job is to detect flies. When it fires due to a BB pellet, it is *malfunctioning* or being *deceived* – it's failing to perform its proper function correctly. The content doesn't change to include BB pellets because BB pellets played *no role* in the selection of the mechanism. The mechanism wasn't selected for detecting BB pellets; it was selected *despite* occasionally being fooled by them.
      *   **Key Concept:** **Proper Function via Selection History.** Content is fixed by the *evolutionary raison d'être* of the mechanism.

  *   **Fred Dretske: Learning History & Indicator Functions**
      *   **Core Idea:** The content of a state is fixed by **what that state was *recruited to be an indicator of* during a critical period of *learning* or *acquisition* of its function.** A state acquires the function of indicating F if, during the period when its indicating role was established, it carried the *information* that F (i.e., its occurrence was causally correlated with F in lawlike, non-accidental ways under normal conditions).
      *   **Frog Application (The Challenge):** Frogs don't *learn* to detect flies with their specialized ganglion cells; the mechanism is innate. This is where applying Dretske strictly gets tricky. One adaptation is to think of the "recruitment period" as **phylogenetic learning** – the evolutionary history where the neural wiring was "recruited" *because* it indicated flies. However, Dretske himself often emphasized *ontogenetic* learning (individual learning during a lifetime).
      *   **Phylogenetic Interpretation:** If we stretch the "learning period" to mean the period in evolutionary history when the neural circuit was being shaped by selection *because* it indicated flies, then the content would be **"fly"**. During that "recruitment" period, the circuit's activation reliably indicated flies (under normal conditions for which it was selected). BB pellets are abnormal, modern interferers not present during recruitment.
      *   **Ontogenetic Interpretation (Problematic for Frogs):** If the mechanism requires *individual* learning, the frog's innate snap-trigger state might *lack determinate content* on a strict Dretskean view, or its content might be something very basic like "localized stimulus change" until shaped by experience. This clearly doesn't fit the frog data.
      *   **Key Concept:** **Indicator Function via Recruitment History.** Content is fixed by the information carried during the period when the indicating role was acquired/learned. For innate mechanisms, this usually means evolutionary recruitment.

  **Precise Parting of Ways:** The deepest divergence is in **what constitutes the function-fixing history:**

  1.  **Millikan:** Function/content is fixed *solely* by **past selection events** (what the mechanism was *for* in its ancestors). History is teleological.
  2.  **Dretske:** Function/content is fixed by **past informational correlations** during a **function-acquisition period** (what the state reliably indicated when it was recruited). History is informational/causal.

  For the frog, both *can* converge on "fly" by appealing to evolutionary history, but they conceptualize that history differently: Millikan sees it as a history of *selection for a function* (detecting flies), while Dretske sees it as a history of *carrying information* about flies during recruitment. Millikan's view is more robustly teleological from the outset.

  **2. Swampfrog: The Acid Test**

  Davidson's Swampman (a perfect physical duplicate created by lightning strike in a swamp, with no evolutionary history) is indeed a major challenge for historical theories.

  *   **Millikan:** **Swampfrog sinks.** Millikan's theory is *explicitly historical*. Swampfrog's snap-trigger mechanism has *no selection history*. It wasn't selected for *anything*. Therefore, it has *no proper function*. If it has no proper function, its neural states cannot have teleosemantic content derived from that function. Swampfrog might *behave* exactly like a normal frog, but its snap-trigger state doesn't *mean* "fly" or anything else determinately. It lacks the requisite history. Millikan bites this bullet.
  *   **Dretske:** **Swampfrog also sinks, but perhaps with more spluttering.** Dretske's theory is also fundamentally historical. The snap-trigger state in Swampfrog lacks any *recruitment history* where it reliably indicated flies (or anything else). There was no period (ontogenetic *or* phylogenetic) where its activation carried the information that F under normal conditions for which it was recruited. Therefore, it also lacks determinate content. While Dretske might be slightly more tempted to appeal to the *structure* implying a potential indicator function, his core theory relies on actual historical recruitment/information-carrying, which Swampfrog lacks. He too must bite the bullet and say Swampfrog's states lack genuine representational content, despite identical structure and behavior.

  **Conclusion on Swampman:** Both accounts sink equally. They are both robustly historical theories of content. Swampman is designed to show that history, not just current structure and disposition, matters for meaning. Both Millikan and Dretske agree that history matters, so Swampman lacks meaning for both. Whether this is a *problem* for the theories or a *revelation* about meaning is a major point of philosophical debate. Proponents argue it correctly shows that genuine representation requires a history of proper function or information-carrying.

  **3. The Disjunction Problem: Why Not "Fly-or-BB"?**

  Your intuition as a scientist is spot on: the disjunctive category "small-dark-convex-moving-erratically" (SDCME) is what the mechanism *actually detects* in the world. Philosophically, the disjunction problem asks: Why isn't *that* the content? Why does misrepresentation (firing for a BB) imply the content is *non*-disjunctive ("fly")?

  *   **Millikan's Answer (Proper Function & Normativity):** The content is "fly" because the mechanism's **proper function** is to detect flies, *not* BB pellets or SDCME things *in general*. The function sets a **norm**: it *should* fire when there's a fly, and it *shouldn't* fire when there isn't (even if there's a BB pellet). If the content were "SDCME thing," then firing at a BB pellet would be *correct* representation, not misrepresentation. But intuitively, and for teleosemantics to work, we need a notion of error. The function derived from selection history provides this norm. The mechanism was selected for getting flies, not for getting flies *or* BB pellets. Including BB pellets in the content washes out the normative distinction between correct function and malfunction/deception.
  *   **Dretske's Answer (Learning/Recruitment Period Specificity):** During the critical **recruitment period** (whether ontogenetic or phylogenetic), the state was recruited *because* it indicated **flies**, not because it indicated BB pellets or the disjunction. The informational correlation that fixed its function was specifically with flies. Subsequent activations by BB pellets don't change the content fixed during that historical period; they are simply cases where the indicator is operating outside the conditions for which it was designed/recruited. If the content were fixed as "SDCME thing" from the start, there could be no misrepresentation by a BB pellet – it would always be correct. Dretske's historical recruitment period anchors the content to the specific indicator correlation present *then*.

  **Why Philosophers Reject the Disjunction:** Both theorists argue that adopting the disjunctive content ("SDCME thing" or "fly-or-BB") **destroys the possibility of misrepresentation**. If the state means "fly-or-BB", then firing at a BB pellet is *true* or *correct*. But the whole point of invoking teleosemantics is to explain how a state can *falsely* represent – how the frog can make a *mistake*. The frog isn't *supposed* to snap at BB pellets; doing so is a failure of the mechanism relative to its biological purpose (Millikan) or its recruited indicator function (Dretske). Only a non-disjunctive content like "fly" allows the BB pellet case to be a genuine case of *mis*representation – the state says "fly" when there isn't one.

  **In Summary:**

  1.  **Millikan vs. Dretske:** Both ground content in history, but Millikan focuses strictly on **selection-for** defining proper function, while Dretske focuses on **information-carrying during recruitment** defining indicator function. For frogs, both point to evolutionary history to get "fly".
  2.  **Swampfrog:** Sinks both accounts equally, as both require a history the duplicate lacks. Proponents accept this consequence.
  3.  **Disjunction Problem:** Both reject "fly-or-BB" because it eliminates the possibility of misrepresentation. Millikan appeals to the **norm set by proper function** (it *should* detect flies), Dretske to the **specific informational correlation during recruitment** (it was recruited *for* flies).

  As a scientist steeped in the actual data-fitting, the disjunctive category *is* the proximal stimulus. Teleosemantics argues that the *meaning* of the frog's internal state isn't just about the proximal stimulus it responds to, but about the **distal object in the world that the mechanism exists *to* detect** – an object defined by its historical (evolutionary or learning) relationship to the mechanism's function and the organism's success. The BB pellet is noise, not signal, relative to the mechanism's purpose. It's a fascinating, if sometimes contentious, attempt to bridge the gap between mechanism and meaning. What do you make of their solutions to the disjunction problem, given your data-fitting instincts? Does the need to preserve misrepresentation justify the move away from the disjunction?
