  Breaking down Millikan vs. Dretske: Both use functions, but Millikan relies on natural selection across generations, while Dretske focuses on learning or recruitment history. For Millikan, the function is tied to evolutionary history—flies being the selective pressure. Dretske might consider the mechanism's learning phase, but since frogs don't learn this, his theory might not apply directly. I should highlight that Dretske's indicator functions are acquired during a learning period, which isn't present in frogs, making Millikan's approach more suitable here.

