  First, I need to understand the core conflict: aunt believes brain death isn't true death because bodies can still heal/grow, while doctor must defend whole-brain death criteria medically and philosophically. Key requirements: both characters must be competent, no strawman arguments, actual scientific rebuttals, and mention circulatory death complications.

  Hmm, the user clearly researched this. They know about brain-dead pregnancies and organ donation after cardiac death (DCD) controversies. That means I can't simplify - must engage with real medical nuances. The aunt's position reflects actual academic debates (like Shewmon's cases), while the doctor needs solid responses about integrated organismic function.

  For the doctor's argument structure: should start with legal definition but quickly pivot to biological rationale - irreversible loss of integrated bodily function. Emphasize the brain as organizer, not just another organ. When aunt brings up wound healing/pregnancies, he should concede those phenomena but reframe them as cellular/tissue persistence versus organism-level unity.

  Aunt's strongest card is those rare cases of prolonged somatic survival. Doctor's counter must distinguish between "biological life" (cells living) and "biographical life" (personhood). Could reference D. Alan Shewmon's work but note his eventual concession that brain death meets biological death criteria.

  For circulatory death: when aunt suggests it as "cleaner," doctor should expose DCD's messiness - how surgeons wait minutes after heartbeat stops but before biological death is truly irreversible. That shows both death determinations involve judgment calls.

  Emotional tone is crucial. Aunt's anger should mask grief, doctor's frustration stems from ethical urgency (organs degrade). Family's silent presence raises stakes - their decision hangs on this debate. Should end with doctor appealing to pragmatism: "We have to make decisions based on the best evidence we have now."

