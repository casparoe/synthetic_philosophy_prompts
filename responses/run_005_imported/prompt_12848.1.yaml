answer: |-
  Based on Bernoulli's 1738 text, specifically "Exposition of a New Theory on the Measurement of Risk," **Bernoulli himself would likely find Samuelson's side of the dispute more persuasive.** His argument was fundamentally about evaluating a *single, isolated gamble* using *diminishing marginal utility of wealth* to resolve the paradox of infinite expected monetary value, not about maximizing long-run growth through repeated play. Here's why, grounded in his reasoning:

  1.  **The Core Problem: A One-Off Gamble:** Bernoulli explicitly framed the St. Petersburg paradox as a single instance: "*Let us suppose... that I toss a coin...*" He analyzes the value *to an individual* of playing this specific game *once*. His examples supporting diminishing utility (the poor vs. rich man finding a lottery ticket, the merchant insuring a ship) are all singular events concerning the impact of wealth changes on an individual's well-being *at a specific point in time*. He never discusses sequences of bets, reinvestment, or long-term growth trajectories.

  2.  **The Stated Motivation: Explaining Risk Aversion & Subjective Value:** Bernoulli's explicit goal was to explain why people assign a *finite subjective value* to a gamble with infinite expected monetary value. He attributes this to the principle that "*the utility resulting from any small increase in wealth will be inversely proportionate to the quantity of goods previously possessed.*" This is pure diminishing marginal utility (DMU) psychology. He writes: "*the determination of the value of an item must not be based on its price, but rather on the utility it yields...*" His focus is squarely on the *subjective satisfaction* derived from wealth levels, not the mechanics of wealth accumulation over time.

  3.  **The Work of Diminishing Marginal Utility (DMU):** DMU is the *engine* of Bernoulli's resolution. It's doing the critical work that a pure growth-rate argument wouldn't need:
      *   **Explains Finite Valuation:** DMU mathematically guarantees that the sum of `(probability * utility gain)` converges, even when `(probability * monetary gain)` diverges. The logarithm is a *consequence* he derives *from* the DMU principle ("*utility is proportionate to the logarithm of the money*"), not an independent axiom chosen for growth maximization.
      *   **Explains Risk Aversion:** DMU naturally implies risk aversion. Losing a dollar hurts more (in utility) for a poor person than gaining a dollar helps a rich person. This explains why people prefer a certain moderate sum over the risky St. Petersburg gamble with infinite EMV. A pure growth-rate argument (like Kelly) also implies risk aversion, but its *primary justification* is long-term survival/growth, not the psychological impact of gains/losses on current well-being.
      *   **Accommodates Individual Circumstances:** Bernoulli emphasizes that utility depends on the individual's *current wealth* ("*previously possessed*"). A pauper and a millionaire value the same lottery ticket differently *because* of their differing starting points and the DMU. This aligns with Samuelson's view that utility is personal and context-dependent. A pure growth-rate argument focuses on the *rate* itself, abstracting somewhat from absolute starting wealth (beyond its impact on bet sizing).

  4.  **Absence of Repeated-Play or Growth Arguments:** Nowhere in Bernoulli's exposition does he:
      *   Mention the possibility of playing the St. Petersburg game multiple times.
      *   Discuss reinvesting winnings.
      *   Analyze the long-term growth rate of wealth.
      *   Frame the problem in terms of avoiding ruin or maximizing terminal wealth over many trials.
      *   Use concepts like "time-average," "ergodicity," or "multiplicative dynamics." These are entirely modern constructs projected backward by Peters.

  **Why Samuelson's Critique Resonates with Bernoulli's Text:**

  Samuelson argued that Kelly betting illegitimately smuggles a repeated-game growth argument (what's optimal for long-run capital growth under replication) into a normative theory for evaluating single gambles (which depends on individual risk preferences). Bernoulli's text *is* explicitly about evaluating a single gamble using a psychologically grounded utility function (log, derived from DMU). Samuelson's insistence that the justification for using log-utility in a *single* gamble must rest on the individual's *risk preferences* (i.e., their inherent DMU), not on unstated assumptions about repeated play, aligns perfectly with Bernoulli's stated motivation and structure. Bernoulli was solving the paradox of subjective value for a one-off risk, not deriving an optimal betting strategy for a repeated game.

  **Why Peters' "Ergodicity" View Misreads Bernoulli:**

  Peters claims Bernoulli's argument was implicitly a time-average growth argument about non-ergodicity. However:
  *   **Implicit ≠ Actual:** While *we* can see that maximizing expected log-wealth also maximizes long-run growth, Bernoulli *never makes this connection*. His derivation comes solely from DMU applied to a single instance.
  *   **Problem Mismatch:** Bernoulli wasn't concerned with the statistical properties of wealth paths over time (ergodicity) or the difference between ensemble and time averages. He was concerned with why a specific one-shot gamble seemed paradoxically overvalued by EMV.
  *   **Misplaced Emphasis:** Attributing Bernoulli's resolution to ergodicity shifts the focus away from his core psychological insight (DMU) and onto a mathematical property (growth rate under repetition) he didn't discuss.

  **Conclusion:**

  Bernoulli's 1738 argument is unambiguously grounded in the psychology of diminishing marginal utility applied to evaluate a single, isolated risky prospect. He sought to explain observed risk aversion and finite subjective valuation where EMV failed. The repeated-game, long-run growth perspective championed by Kelly and central to Peters' ergodicity argument is entirely absent from his text. Therefore, Bernoulli would likely find Samuelson's critique—that justifying log-utility for a single gamble must rest on individual risk preference (DMU), not smuggled-in assumptions about repetition and growth—far more consistent with his own reasoning than Peters' reinterpretation, which projects a modern framework onto a historical text where it doesn't fit. Bernoulli was solving the St. Petersburg paradox for a merchant considering one insurance decision or one lottery ticket purchase, not for a gambler optimizing bets over a lifetime at the casino.
