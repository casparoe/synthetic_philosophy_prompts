answer: |-
  You've hit upon a common point of confusion, but unfortunately, your reasoning contains a flaw. **Bell's theorem *does* rule out stochastic (indeterministic) local hidden variable theories.** The critical assumption Bell relies on is *locality*, not determinism. Here's a breakdown:

  1.  **The Core Assumption: Local Causality (Locality):**
      Bell's theorem rests on a specific notion of locality, often called "local causality" or "Bell locality." This condition states:
      > Once the complete physical state (λ) of a system is specified at its source, and the measurement settings (a, b) at distant locations A and B are chosen, the probability of an outcome at A *cannot depend* on the distant measurement setting b or the distant outcome B, and vice versa.

      Mathematically, this is expressed as a *factorization* of the joint probability:
      `P(A, B | a, b, λ) = P(A | a, λ) * P(B | b, λ)`
      *   `A`, `B`: Outcomes at detectors A and B.
      *   `a`, `b`: Measurement settings (e.g., polarizer angles) at A and B.
      *   `λ`: The complete specification of the state of the particle pair at the source, including any hidden variables.
      **This factorization is the *defining characteristic* of a local theory in the Bell sense.** It enforces that the outcomes are statistically independent given λ and the local settings.

  2.  **Derivation of Bell's Inequality (Even with Indeterminism):**
      *   Bell starts with the assumption of local causality (the factorization above).
      *   He then considers correlations between outcomes (A and B) for different combinations of settings (a, b).
      *   Using basic probability theory and combinatorics (often involving averages over λ), he derives mathematical constraints (like the CHSH inequality) that these correlations *must* satisfy **if** the local causality condition holds.
      *   **Crucially, this derivation holds *regardless* of whether the probabilities `P(A | a, λ)` and `P(B | b, λ)` are 0/1 (deterministic) or take intermediate values (stochastic/indeterministic).** The factorization condition itself imposes the constraint.

  3.  **Quantum Mechanics Violates the Inequality:**
      Quantum mechanics makes specific predictions for the correlations in entangled systems (like the singlet state). These predictions *violate* Bell's inequalities derived under the assumption of local causality.

  4.  **The Inescapable Conclusion:**
      *   Local causality (as defined by Bell) leads to Bell inequalities.
      *   Quantum mechanics violates these inequalities.
      *   Therefore, **no physical theory satisfying Bell's local causality condition can reproduce the predictions of quantum mechanics for entangled systems.**
      *   This rules out *any* locally causal hidden variable theory, **whether deterministic or stochastic.**

  **Why "Local Realism" is Used:**

  *   **Realism:** This refers to the idea that the outcomes `A` and `B` are determined by *pre-existing* properties of the particles (represented by λ) *before* measurement. The hidden variables λ embody this realism. Outcomes aren't created by the measurement; they are revealed. This is true for both deterministic and stochastic HV theories – λ fixes *something* (either the outcome or the probability of the outcome) prior to and independent of measurement.
  *   **Locality:** This is Bell's local causality condition described above.

  **Bell's theorem proves that the conjunction of these two ideas – that outcomes are determined by pre-existing properties *and* that influences cannot travel faster than light (local causality) – is incompatible with the empirically verified predictions of quantum mechanics.**

  **Addressing Your Argument:**

  Your claim was: *"if the hidden variables instead fix only probabilities, as in a genuinely stochastic local theory, the derivation doesn't go through."*

  *   **The Flaw:** You correctly identified that determinism isn't necessary. However, you underestimated the power of the *locality* assumption. Bell's derivation *does* go through for stochastic theories **because** the locality condition (factorization) imposes a severe constraint on the *correlations* themselves. Stochastic local theories still predict correlations bounded by Bell's inequalities. Quantum correlations exceed these bounds.

  **In Summary:**

  *   Bell's theorem rules out **all** locally causal hidden variable theories.
  *   "Locally causal" means satisfying the factorization condition `P(A, B | a, b, λ) = P(A | a, λ) * P(B | b, λ)`.
  *   This condition is violated by quantum mechanics, regardless of whether the hidden variables λ determine outcomes deterministically (0/1 probabilities) or stochastically (probabilities between 0 and 1).
  *   "Local realism" is the standard term because it captures the essence: pre-existing properties (realism) combined with no spooky action-at-a-distance (locality/Bell locality) is incompatible with quantum phenomena. The theorem rules out the *framework* of local hidden variables, not just the deterministic subset.

  Your friend was right on the core point: Bell's theorem does rule out stochastic local hidden variables. The profound implication is that nature cannot be described by *any* theory where correlations arise *only* from shared local common causes (λ) and local interactions with measurement devices – quantum correlations require something more (genuine nonlocality, contextuality, or abandoning realism in a deeper sense).
