  I remember that in stochastic hidden variable theories, the hidden variables determine probabilities, not definite outcomes. So, for each run of an experiment, the outcome isn't fixed by λ alone. The user's point is that maybe such theories can violate the inequality without nonlocality. 

  But Bell's 1971 paper addresses this. He considers the joint probability distribution over outcomes. The locality condition requires that the probability factorizes: P(A,B|a,b,λ) = P(A|a,λ) * P(B|b,λ). This means that given λ, the outcomes at A and B are independent. 

  The derivation of Bell's inequality relies on this factorization. Even with stochastic hidden variables, if the theory is local, the correlations must satisfy Bell's inequality. But quantum mechanics violates it. So stochastic local hidden variables are also ruled out. 

  The user might be missing that locality imposes constraints on correlations, regardless of determinism. Experiments confirm QM violations, so no local hidden variables—deterministic or stochastic—can explain the results without contradicting locality. 

