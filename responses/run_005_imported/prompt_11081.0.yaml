  Also, address why "local realism" is used. Realism here means that properties exist prior to measurement (hidden variables), and locality means no faster-than-light influence. Bell's theorem shows that both together are incompatible with QM, regardless of determinism. 

  The user's confusion is common. They might think indeterminism offers a loophole, but Bell's framework accounts for that. Clarifying the probabilistic locality condition is key. Mentioning Bell's 1971 paper and its handling of stochastic variables would strengthen the argument. 

