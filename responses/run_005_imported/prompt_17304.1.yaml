answer: |-
  Your insight is spot-on, but the rule needs nuance to avoid oversimplification. Here’s a sharper, more robust framework:

  ### Rule of Thumb: The Disaggregation Principle  
  > **When pooled and disaggregated statistics conflict, the subgroup-level data is *often* more revealing—but only if:  
  > (1) The subgroups are causally meaningful (e.g., departments, age cohorts, clinical subgroups),  
  > (2) The variable driving the paradox (e.g., department choice) isn’t the primary focus of the question, *and*  
  > (3) Subgroup samples are large enough to be reliable.**  
  >   
  > **Always ask: *"What level of analysis matches the causal mechanism?"***  

  ---

  ### Why This Works Universally (with Examples)
  1. **Berkeley Admissions**  
     - *Pooled:* Men admitted 44% vs. women 35% → *suggests gender bias*.  
     - *Disaggregated:* Women had equal/higher admission rates in 4/6 departments.  
     - **Truth:** Women applied more to highly competitive departments (e.g., English) with lower admission rates *for all applicants*.  
     - ✔️ **Subgroups matter:** Department choice (confounder) drove the paradox.  

  2. **Medical Treatment Example**  
     - *Pooled:* Treatment A has 78% survival vs. Treatment B’s 83% → *suggests B is better*.  
     - *Disaggregated by severity:*  
       - *Mild cases:* A: 95% vs. B: 90%  
       - *Severe cases:* A: 60% vs. B: 35%  
     - **Truth:** Doctors assigned more severe cases to Treatment A.  
     - ✔️ **Subgroups matter:** Severity (confounder) masked Treatment A’s superiority.  

  3. **Economic Policy**  
     - *Pooled:* Tax cuts boost GDP growth (+1.5% in Country X vs. +0.4% in Y).  
     - *Disaggregated by income group:*  
       - *Low-income:* Growth ↓ 0.2%  
       - *High-income:* Growth ↑ 3.0%  
     - **Truth:** Benefits concentrated at the top.  
     - ✔️ **Subgroups matter:** Pooling hides distributional effects.  

  ---

  ### Exceptions & Caveats  
  - **When to trust pooled data:**  
    - If subgroups are arbitrary (e.g., alphabetically split data) or too small (e.g., a subgroup with n=5).  
    - If the *overall effect* is the question (e.g., "Does this vaccine reduce *population-level* transmission?").  
  - **Red flags for paradoxes:**  
    - **Imbalanced allocation:** Like women applying more to competitive departments.  
    - **Non-random subgroup assignment:** Like severe patients getting Treatment A.  
    - **Aggregation masking trends:** Like averaging rising and falling incomes.  

  ---

  ### Phrasing for Your Article  
  > "Simpson’s Paradox teaches us that a statistic telling one story *overall* can hide the opposite story *in the details*. When disaggregated data contradicts a pooled figure, dig deeper: the truth is likely tangled in a lurking variable—department choice, disease severity, or economic strata. Unless your question is purely about broad averages, **follow the data to causally meaningful subgroups**. But remember: subgroups must be large enough to stand on their own, and the story they tell must align with the real-world mechanism at play."  

  This rule empowers readers to scrutinize *why* pooled vs. disaggregated data clash—forcing engagement with context, not just numbers. It’s held up for 50 years in Berkeley’s case and remains vital today.
