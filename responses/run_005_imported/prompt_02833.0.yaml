  ## The Unbending Compass: Why Hobbes Would Have Rejected Non-Euclidean Geometry

  Your journey from experimental physics to Hobbesian philosophy is fascinating, and your grasp of the core tension – Hobbes’s elevation of geometry as the sole source of demonstrative certainty, grounded in “maker’s knowledge,” versus the pluralistic implications of non-Euclidean geometries – is acute. Based on Hobbes’s arguments in *De Corpore* and his brutal exchanges with Wallis, I contend that **Hobbes would have utterly rejected non-Euclidean geometry as illegitimate, seeing it not as a development, but as a catastrophic betrayal of geometry’s very essence and its privileged epistemic status. This discovery would have struck at the root of his system, reinforcing his disdain for hypotheticals and confirming his worst fears about intellectual hubris, rather than prompting adaptation.**

  **The Bedrock of Hobbesian Geometry: Construction, Matter, and Maker’s Certainty**

  Hobbes’s geometric epistemology is inseparable from his materialism and nominalism, as you rightly note. For Hobbes:

  1.  **Geometry is About Real Bodies:** Geometry isn't abstract contemplation; it’s the science of *real, material bodies* and their motions. As he states in *De Corpore*, "the subject of geometry is body." His rejection of Euclid's partless points and breadthless lines wasn't pedantry; it was a core materialist principle. Geometric objects *must* be conceivable as generated by the motion of real, extended bodies ("a line is the way of a body moved"). Abstractions divorced from possible physical generation are meaningless fictions.
  2.  **Maker’s Knowledge = Certainty:** The source of geometry’s unique certainty is our role as creators. We *define* the simple motions (generation of lines, circles, etc.) and then *demonstrate* properties by logically tracing the necessary consequences of these definitions within the constructions we perform. As Jesseph details, Hobbes saw this as analogous to a watchmaker knowing the watch: we know it because we built it from self-imposed rules. This contrasts sharply with natural science, where we can only hypothesize about causes we don't construct, leading to mere "conditional" or "hypothetical" knowledge.
  3.  **One True Geometry:** This constructivist, materialist foundation logically implies *one* true geometry. If geometry arises from the fundamental definitions of motion applied to real bodies, and if these definitions reflect the basic, undeniable properties of matter (extension, divisibility, motion), then there can only be one consistent system describing the necessary consequences of these motions. Hobbes’s lifelong battle with Wallis wasn't just about squaring the circle; it was a defense of this very notion that geometry yields singular, certain truths accessible through correct construction and reason. Alternative systems, like Wallis's algebra, were dismissed as "symbol-weaving" precisely because they seemed detached from this physical, constructive foundation.

  **The Non-Euclidean Challenge: Pluralism and Hypotheticality**

  Non-Euclidean geometries pose a direct, two-pronged attack on this foundation:

  1.  **Plurality of Consistent Systems:** Gauss, Bolyai, and Lobachevsky demonstrated that altering one postulate (the parallel postulate), *while keeping the others consistent*, generates a logically coherent alternative geometry. Riemann further generalized this, showing geometry depends on the underlying curvature of space itself. This shatters the Hobbesian ideal of *one* geometry derived necessarily from the fundamental definitions of motion and body. If multiple internally consistent systems are possible, which one arises from *the* definitions of motion applied to *real* bodies?
  2.  **Empirical Validation:** Riemannian geometry’s application by Einstein underscores the point: the "true" geometry of physical space isn't known *a priori* through construction and deduction; it must be *discovered empirically*. The fit between a geometric system and the physical world becomes a matter of contingent, *a posteriori* testing – the very definition of the "second-class," hypothetical knowledge Hobbes ascribed to natural science.

  **Hobbes's Likely Response: Rejection and Reaffirmation**

  Given his core principles and his intellectual temperament (as vividly displayed against Wallis), Hobbes’s response would be unequivocal rejection:

  1.  **"No Construction, No Geometry":** Hobbes would immediately ask: *How do you construct these non-Euclidean figures using the motion of real bodies?* How do you generate a "straight line" on a negatively curved surface using a physical compass or straightedge tracing motion? How do you define the motion that generates a hyperbolic triangle from first principles? He would argue these systems rely on abstract definitions and symbolic manipulation divorced from the physical generation of figures. They are not *constructions* in his materialist sense; they are hypothetical *descriptions*. They might be consistent symbol games (like algebra, which he despised), but they fail the fundamental test of being about the generation and properties of *actual bodies* through defined motions. "A line *is* the way of a body moved" – if the body moves in a way that doesn't fit Euclid *or* the non-Euclidean alternatives as physically constructible entities, the alternative is irrelevant or nonsensical.
  2.  **Betrayal of Definitions:** Altering the parallel postulate isn't a neutral tweak for Hobbes; it fundamentally alters the definitions of motion and figure generation upon which demonstrative certainty rests. He would see it as arbitrarily changing the rules *after* construction has begun, rendering the whole enterprise illegitimate. His own redefinitions of point and line aimed for *greater* fidelity to material generation, not abstraction. Non-Euclidean postulates would seem like unwarranted, ungrounded abstractions violating the necessary connection between definition, construction, and physical reality.
  3.  **Confirmation of Natural Science's Inferiority:** Einstein's use of Riemannian geometry would horrify Hobbes, but it would also confirm his deepest epistemological conviction. The fact that we must resort to empirical observation to determine which geometry "fits" space proves his point: *any* knowledge dependent on fitting models to the world *after the fact* is inherently hypothetical and uncertain. Non-Euclidean geometry, precisely because it *can* be applied empirically, would be seen by Hobbes as belonging *to the realm of natural science*, not true geometry. Its need for empirical validation strips it of the "maker's certainty" that defines genuine science. It becomes just another sophisticated hypothetical model, condemned to the same epistemic purgatory as physics.
  4.  **Defense of Euclidean Singularity:** Faced with plurality, Hobbes would double down. He would insist that Euclidean geometry remains the *only* system grounded in the undeniable, constructive motions of real bodies. The others are intellectual curiosities, perhaps logically consistent, but fundamentally *unreal* because they cannot be constructed from his foundational definitions of motion applied to matter. His response wouldn't be relativism ("certainty within a system") but a reassertion that only *one* system meets the criteria for genuine science: Euclidean geometry, understood through his materialist, constructivist lens. The existence of alternatives would only fuel his suspicion of abstract mathematicians (like Wallis) who traffic in symbols divorced from substance.

  **Verdict: No Accommodation Possible**

  Hobbes’s system is remarkably rigid. His "maker’s knowledge" epistemology requires a single, constructible system derived from definitions reflecting the basic ontology of matter and motion. Non-Euclidean geometry, by demonstrating the possibility of multiple consistent systems whose relation to physical reality is contingent and empirically testable, fundamentally undermines both the *singularity* and the *source of certainty* that were the bedrock of his elevation of geometry. It transforms geometry from the realm of demonstrative certainty based on construction into the realm of hypothetical modeling based on empirical fit – precisely the domain he sought to escape. Hobbes, the stubborn defender of the one true, constructible geometry against the "symbol-weavers," could not have adapted. For him, non-Euclidean geometry wouldn't be a new branch of mathematics; it would be the ultimate vindication of Wallis-like abstraction and the tragic descent of his beloved "queen of sciences" into the very hypothetical morass he constructed his philosophy to avoid. The discovery wouldn't expand his geometry; it would annihilate its privileged epistemic foundation.
