answer: |-
  ## The Uncoordinated Dialogue  
  *(Two philosophers, ELARA (Lewisian) and KAI (evolutionary), fumble with coffee cups in a cluttered faculty lounge)*

  **KAI:** *(Reaching for the same coffee pot as Elara)* Look, Elara, this *proves* my point. We just enacted a tiny "ownership" convention. I pulled back because I saw your hand near it first. No common knowledge of infinite regress required. Just reinforced avoidance of scalding and awkwardness. Like Hawk-Dove: "Possession is nine-tenths."

  **ELARA:** *(Pouring coffee)* Kai, pulling back because you *saw* my hand is just individual reaction to a salient signal – proximity. That’s not convention. Lewis’s point is *why* proximity signals ownership *here*. It’s because we *both know* that in our department, "first hand near the pot" is the arbitrary rule we all expect others to follow *because* it avoids conflict. And crucially, we *could* have used "loudest cough" or "seniority." That alternative possibility, held in common knowledge, *makes* it arbitrary.

  **KAI:** But why posit that shared mental architecture? In Maynard Smith’s model, the "Bourgeois" strategy ("if owner, play Hawk; if intruder, play Dove") stabilizes purely because it *works* – it avoids costly fights *on average*. No agent needs to represent "I know you know that proximity signals ownership." Reinforcement learning, genetic selection... they build the regularity *without* nested beliefs. The arbitrariness is observer-relative: *we* see other equilibria (like "always Hawk"), but the *population* just settles.

  **ELARA:** Observer-relative arbitrariness isn’t enough! Lewis’s condition ensures the convention is *sensitive to the agents' understanding*. If everyone *suddenly believed* seniority should rule, the convention could shift *because* of that shared belief. In your model, change requires new mutations or slow reinforcement shifts, not collective recognition of alternatives. That’s why common knowledge matters – it allows for *intentional* coordination on *this* rule rather than *that* one.

  **KAI:** But ownership conventions *aren't* pure coordination like driving sides! Interests clash! The "owner" *wants* the resource, the "intruder" *wants* it too! Lewis requires a "coincidence of interest" – everyone prefers to coordinate *given others do*. In Hawk-Dove, the intruder *doesn't* prefer to back down *in itself*; they prefer it only because fighting is worse. It's conflict *managed*, not interest *coinciding*.

  **ELARA:** Ah, but look at the *meta-level*! Both parties *do* share an overriding interest: avoiding the mutually disastrous outcome of a fight. *Given* the expectation that "proximity = ownership" is the rule, both prefer conforming (owner asserts, intruder yields) over fighting. The convention coordinates them *away* from mutual loss onto *one* of the asymmetric (but stable) outcomes. The coincidence of interest is in *having a rule*, any rule, to avoid conflict.

  **KAI:** *(Grabs the last cookie, Elara eyes it)* See? Conflict! My "interest" is eating this cookie. Yours is too. The *only* reason I might yield is if I fear your retaliation cost *outweighs* the cookie’s value. That’s pure cost-benefit calculation, not recognizing a shared rule! Evolutionary stability captures this: strategies that *de facto* respect possession proliferate because challengers get hurt. No shared understanding of "arbitrariness" needed. The regularity persists *despite* conflicting interests in each instance.

  **ELARA:** But Kai, *why* does "possession" work as the signal here? Why not eye contact? Or shoe size? It’s *because* we’ve internalized a social norm – a Lewisian convention! We both know grabbing it from my hand would violate an expectation we mutually hold, damaging reputation or inviting future retaliation. That *expectation network*, grounded in common knowledge, *is* the convention. It’s not just avoiding *my* punch now; it’s upholding a system.

  **KAI:** Systems emerge! Look at territorial birds. No shared mental model of "arbitrary convention." Just individuals inheriting/learning: "Challenge red chest = pain; respect red chest = safe." The *pattern* is convention-*like*: stable, arbitrary (red chest vs. song could work), conflict-avoiding. Calling it "convention" is useful shorthand. Insisting on common knowledge excludes perfectly functional, real-world "conventions" in non-human or boundedly rational agents. Lewis’s definition is anthropocentric.

  **ELARA:** It’s not *anthropocentric*, it’s *intentional*! We need to distinguish mere behavioral regularities *caused* by evolutionary pressures from conventions *sustained* by mutual expectations and reasoning. A bird respecting territory acts on instinct or learned avoidance. A human respecting ownership *appeals to the rule*: "It’s mine, you *know* it’s the rule!" That justificatory layer, rooted in common knowledge, is constitutive. Your evolutionary account describes *how a regularity might originate*; Lewis describes *what sustains it socially* in reasoning agents.

  **KAI:** But doesn’t that just push the problem? How do humans *get* that common knowledge layer? Likely through the same evolutionary/cultural selection pressures! The "mutual expectations" are behavioral dispositions honed because they worked. The "common knowledge" is a *post hoc* rationalization of the stable pattern. Lewis puts the cart (complex cognition) before the horse (evolutionary stability).

  **ELARA:** Not necessarily! The cognitive capacity for common knowledge might *itself* be an adaptation *for* coordination. Once present, it allows for *finer-grained, faster* coordination on *novel* conventions – like agreeing to meet at the *new* statue downtown, not just following ingrained paths. Your model struggles with rapid, intentional convention shifts based on shared recognition of alternatives.

  **KAI:** *(Pushes the cookie towards Elara)* Fine, take it. But only because I calculate the social cost of taking it is higher *today*, not because of some infinitely nested belief about your beliefs about ownership. My model covers the gritty reality of most conventions, especially contested ones like property. Lewis gives an idealized picture of pure coordination. Stretching it to cover conflict feels forced. Why not admit conventions come in flavors? Some need common knowledge, many don’t.

  **ELARA:** *(Takes the cookie, breaks it in half)* Compromise? Perhaps. But I think conflating the flavors obscures the *distinctive* power of conventions in human social reasoning – their justificatory force and flexibility. The bird can’t *decide* red feathers are passé and switch to blue. We can. That’s what common knowledge buys us. *(Offers half)* Convention?

  **KAI:** *(Takes half, smiles wryly)* Temporary truce, maybe. Driven by hunger and avoiding crumbs on the chair. Call it an evolutionarily stable snack distribution. But I’ll grant you this: explaining how *we* got from their stability to *our* justifications... that’s the real puzzle. Pass the coffee? *(Reaches, hesitates as Elara’s hand is near)* See? Still working on it.
