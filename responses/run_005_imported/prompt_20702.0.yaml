  Key feedback targets: textual precision (quote Ghazali on God’s will), avoiding absolutism ("full stop"), and engaging opponents’ strongest points (Ghazali’s regularity≠necessity). This mirrors lab-report grading—clarity over flair, evidence over assertion—which should reassure the user their eye for rigor transfers fine.
