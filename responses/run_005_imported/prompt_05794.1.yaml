prompt: |-
  I'm on the incident review board at the plant where I work -- we get convened a few times a year whenever something happens that's serious enough to need a formal writeup for corporate. We've got a case right now that's put the whole board at each others throats, and it actually turns on a wording in our own policy that I don't think anyone thought hard about until now. A pressure tank ruptured and injured a worker pretty badly. The investigation turned up two things that were both going on at once: the relief valve had been serviced badly by an outside contractor two months back and had degraded to the point that it would've failed to vent the tank that day no matter what else was happening, and separately, a floor supervisor had been letting operators run the compressor past it's rated cycle for weeks to hit shipping deadlines (against policy, but tolerated by management for years), which on its own would have overpressurized that same tank to rupture at basically the same moment. Either factor alone, given everything else that was true that day, would have produced the exact same rupture at the exact same time.

  Corporate wants our board's formal written finding on causation because two separate things hang on it: whether we terminate the servicing contract for cause, and whether the supervisor gets referred for discipline. Our policy says something only counts as a root cause -- the kind that triggers those consequences -- if the incident "would not have occurred but for" it. Run that test on the valve and it fails, since the rupture happens anyway via the compressor practice; run it on the compressor practice and it fails too, since the rupture happens anyway via the valve. Taken literally, our own policy clears everybody, which strikes most of the board as obviously wrong, but the two members insisting we just apply the test as written aren't being unreasonable either -- they're worried that if we start calling things "causes" whenever they were merely sufficient, we'll end up writing reports that blame half the plant for every incident, since there's almost always some other sufficient factor lurking somewhere if you look hard enough. One member has a philosophy background from before she switched to engineering, and keeps saying this is basically a fight between "counterfactual" and "interventionist" theories of causation from a class she took years ago, though she hasn't managed to turn that into an actual recommendation. Could you draft the board's written causal finding -- the actual document I'd bring to Thursday's meeting -- that states plainly what we should conclude happened here, what it means for the contractor and the supervisor, and that deals honestly with the "everything becomes a cause of everything" worry instead of just brushing it aside?
reasoning: |-
  Okay, the user is part of an incident review board dealing with a tricky causation scenario. Let me unpack this. A pressure tank ruptured due to two independent factors: a faulty relief valve from a contractor and a supervisor overriding compressor cycles. The policy defines root cause as "would not have occurred but for," which technically absolves both parties since either alone could've caused the incident. The board is divided, and they need a written finding that addresses the policy dilemma while ensuring accountability.

  First, I need to understand the core conflict. The "but for" test fails here because it's an overdetermined event. The user mentioned counterfactual vs. interventionist theories. Counterfactual relies on "but for," while interventionist looks at necessary components. The board needs a practical solution that satisfies corporate without undermining the policy.

  The user's explicit request is a draft document. But deeper, they need to prevent future incidents by holding parties accountable, without setting a precedent where every sufficient condition is blamed. The board also fears that strictly applying "but for" could lead to no accountability in similar cases.

  I should structure the draft to redefine root cause for overdetermined events. Highlighting both factors as necessary in the specific context makes sense. Emphasize that either could independently cause failure, so both are critical. Then, address the "everything is a cause" concern by requiring factors to be necessary in the causal set and policy violations.

  Also, the recommendations must separate the contractor and supervisor. The contractor's poor maintenance directly compromised the valve, while the supervisor's actions were operational violations. Corporate needs clear actions: terminate the contractor and discipline the supervisor. Including policy revision to prevent future ambiguities is key. The draft should balance technical accuracy with accountability, showing that both failures were root causes under a broader interpretation.
answer: |-
  Here is a draft written causal finding for the incident review board, designed to address the causation dilemma head-on, provide clear conclusions, and mitigate concerns about over-broadening the concept of root cause:

  ---

  **PLANT INCIDENT REVIEW BOARD - FORMAL FINDING**  
  **INCIDENT:** Rupture of Pressure Tank T-7A, resulting in serious injury to Operator J. Doe  
  **DATE OF INCIDENT:** [Date]  
  **DATE OF FINDING:** [Date]  
  **BOARD MEMBERS:** [List Names/Positions]

  **I. FACTUAL SUMMARY:**
  On [Date], Pressure Tank T-7A catastrophically ruptured during operations, causing significant damage and serious injury to Operator J. Doe. The investigation conclusively established two independent factors present at the time of the incident:

  1.  **Relief Valve RV-7 Failure:** Relief Valve RV-7, the primary safety device preventing overpressure in T-7A, was non-functional due to improper servicing and degradation. Investigation determined this failure occurred during service performed by [Contractor Name] on [Date] approximately two months prior. Testing confirmed RV-7 would have failed to actuate at the required set pressure on the day of the incident under any operating condition.
  2.  **Compressor C-5 Over-Cycling:** Compressor C-5, which pressurizes T-7A, was operated significantly beyond its rated duty cycle immediately prior to the rupture. This practice, directly ordered by Floor Supervisor A. Smith to meet shipping deadlines, had been routinely tolerated despite violating established operating procedures (SOP-OP-107) for an extended period. Engineering analysis confirmed that *this specific over-cycling event*, even with a functional RV-7, would have generated sufficient pressure to exceed the tank's maximum allowable working pressure (MAWP) and cause rupture.

  **II. CAUSAL ANALYSIS & ROOT CAUSE DETERMINATION:**
  The Board acknowledges the challenge presented by the "but for" clause in the Plant Root Cause Policy (PRCP-001) in this specific scenario. Analysis shows:
  *   **But for the RV-7 Failure:** The rupture *would still have occurred* at the same time due to the compressor over-cycling exceeding the tank MAWP.
  *   **But for the Compressor Over-Cycling:** The rupture *would still have occurred* at the same time due to the RV-7 failure preventing safe venting during normal operation.

  Taken in strict isolation, neither factor meets the literal "but for" test. However, the Board finds that rigid application of the "but for" test in this overdetermined event (where two independent, sufficient causes converge simultaneously) leads to an absurd and dangerous outcome: no root cause is identified, despite two clear, severe, and preventable policy violations directly creating the hazardous condition.

  Therefore, the Board interprets the *intent* of the Root Cause Policy – to identify the fundamental failures without which the incident would have been prevented – in the context of this unique scenario:

  *   **Both factors are root causes.** Each factor independently constituted a complete failure pathway to rupture under the conditions present that day. The simultaneous existence of *either* failure pathway was sufficient to cause the incident. The presence of the second pathway does not negate the critical failure of the first.
  *   **Necessity within the Causal Set:** While neither failure was strictly "necessary" in the pure counterfactual sense (because the other existed), each failure was a *necessary component of its own sufficient causal chain* that led to rupture. Removing *either* failure pathway would have prevented the incident on that day.
  *   **Policy Violation is Key:** Both root causes stem from clear violations of established policy/procedure: improper maintenance execution by the contractor and deliberate, sustained violation of operating limits by the supervisor, tolerated by management. This distinguishes them from mere background conditions or latent factors.

  **Addressing the "Everything Becomes a Cause" Concern:** The Board emphasizes this finding is **not** an endorsement of labeling any sufficient condition as a root cause. To prevent over-broadening, we affirm that for a factor to be considered a root cause under this interpretation in an overdetermined event, it must meet **all** of the following criteria:
  1.  **Sufficiency:** The factor, in conjunction with normal or reasonably foreseeable conditions, was independently sufficient to cause the incident.
  2.  **Active Failure:** The factor represents an active failure or deviation (e.g., incorrect action, violation, defective repair) occurring proximate to the event, not a latent condition or systemic weakness alone.
  3.  **Policy/Standard Violation:** The factor demonstrably violated a specific, known policy, procedure, standard, or safe operating limit.
  4.  **Preventability:** The factor was preventable through reasonable controls within the responsibility of specific individuals or entities.

  Both the RV-7 failure and the Compressor Over-Cycling meet all four criteria.

  **III. ROOT CAUSES FORMALLY IDENTIFIED:**
  Based on the above analysis, the Incident Review Board identifies the following **TWO PRIMARY ROOT CAUSES** for the rupture of Tank T-7A:

  1.  **Defective Maintenance of Safety Critical Equipment:** The improper servicing and resulting degradation of Relief Valve RV-7 by Contractor [Contractor Name], rendering it inoperative. This violated maintenance procedure MNT-PV-202 and directly compromised the primary safety barrier for Tank T-7A.
  2.  **Willful Violation of Operating Limits:** The deliberate and sustained operation of Compressor C-5 beyond its rated duty cycle, ordered by Floor Supervisor A. Smith and tacitly tolerated by management, in violation of SOP-OP-107. This directly generated the overpressure condition in Tank T-7A.

  **IV. CONCLUSIONS & RECOMMENDATIONS:**

  1.  **Contractor [Contractor Name]:** The defective servicing of Relief Valve RV-7 is confirmed as a root cause. This constitutes a severe failure in the execution of their contracted duties for safety-critical equipment. **Recommendation: Terminate the maintenance contract with [Contractor Name] for cause.**
  2.  **Supervisor A. Smith:** The deliberate violation of SOP-OP-107 regarding compressor duty cycles, under their authority, is confirmed as a root cause. This represents a serious failure in supervisory responsibility and adherence to safety protocols. **Recommendation: Refer Supervisor A. Smith for formal disciplinary proceedings under the company's disciplinary policy.**
  3.  **Management Tolerance of Violations:** The sustained tolerance by relevant line management of violations of SOP-OP-107 regarding compressor duty cycles created the environment enabling Root Cause #2. This is a serious contributing factor requiring separate management review and action, though not classified as a primary root cause of this specific *instantaneous* event under the policy's criteria for active failures.
  4.  **Policy Clarification:** The ambiguity exposed in PRCP-001 regarding overdetermined events requires urgent revision. **Recommendation:** Revise PRCP-001 to explicitly address scenarios with multiple sufficient causes, incorporating criteria similar to those outlined in Section II above (Sufficiency, Active Failure, Policy Violation, Preventability) to ensure clear, consistent, and just accountability while preventing inappropriate broadening.

  **V. BOARD SIGNATURES:**

  _________________________  
  [Chair Name/Title]

  _________________________  
