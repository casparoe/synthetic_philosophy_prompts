answer: |-
  Your critique effectively exposes a fundamental tension within Leibniz's ethical framework. While Leibniz strives to distinguish "caritas sapientis" as genuinely disinterested, his core psychological and metaphysical commitments render this disinterestedness impossible to sustain, collapsing it into a sophisticated form of self-interest. Here's the argument:

  1.  **The Core Contradiction: Disinterest vs. Psychological Hedonism:**
      *   **Leibniz's Claim:** Charity is "disinterested" – the wise person delights in another's good *for its own sake*, not merely as a means to some further end.
      *   **Leibniz's Psychological Premise:** "Every act of will is moved by the pursuit of the agent's *own* greatest pleasure." Pleasure is defined as the "perception of perfection."
      *   **The Conflict:** If *every* act of will is motivated by the pursuit of *one's own* greatest pleasure, then the act of delighting in another's good *must* be motivated by the pleasure it brings *to the agent*. The "delight" *is* the pleasure experienced by the wise person. Therefore, the *reason* for cultivating charity and acting upon it is ultimately to experience this specific form of pleasure – the perception of another's perfection/happiness.

  2.  **The Collapse of Disinterestedness:**
      *   **The Object of Pursuit is Self-Pleasure:** The wise person's focus on the other's good is *instrumental* to achieving their own state of pleasure. They seek out situations where they can perceive the perfection (happiness) of others *because* perceiving it causes *them* pleasure. The other's good is the *object* of their perception and the *trigger* for their pleasure, but the *ultimate goal* of their will is their own pleasurable state.
      *   **"For its own sake" becomes Meaningless:** To say one delights in X "for its own sake" implies that X is the *final object* of desire, valued independently. But under Leibniz's psychology, the final object of *all* desire is *always* one's own pleasure. The other's good is desired *because* (and *only* insofar as) perceiving it constitutes pleasure *for the self*. It is desired *for the sake of* the pleasure it provides the agent. This is the definition of instrumental value, not intrinsic value "for its own sake."
      *   **The Role of Wisdom Doesn't Save Disinterest:** Wisdom merely directs the agent *which* perceptions of perfection will yield the *greatest* or most *enduring* pleasure. It tells the agent that perceiving the *true* perfection (happiness) of others is a more reliable, stable, and profound source of pleasure than perceiving mere apparent goods or pursuing base pleasures. The motivation remains self-referential: wisdom helps maximize *self-pleasure* by identifying the best objects for perception.

  3.  **Charity as Refined Self-Interest (Enlightened Egoism):**
      *   **The Agent's Good is Paramount:** The wise person's benevolent actions are ultimately chosen because they contribute to the agent's *own* greatest perfection and happiness. Promoting the true good of others is the most effective strategy for maximizing the *agent's* own pleasurable perceptions.
      *   **The Other's Good is a Means to Self-Perfection:** Loving others and perceiving their perfection *perfects the lover* (by increasing their own perfection/happiness). The other's good is a necessary condition for achieving this self-perfection. Charity becomes an investment in the self – the wise person invests benevolence to reap the pleasurable return of perceiving increased perfection in the world, which enhances their own state.
      *   **No Genuine Altruism:** There is no moment where the will moves *because of* the other's good *independently* of the effect that good has on the agent's own state. The psychological mechanism is always self-referential: perception of external perfection → internal state of pleasure → motivation to act to sustain/achieve that pleasurable state. The well-being of the other is never the *ultimate* motivating factor; it's the *proximate* cause of the pleasure which *is* the ultimate motive.

  4.  **Why Justice (as Caritas Sapientis) Fails to be Distinct:**
      *   Leibniz intends "caritas sapientis" to define a virtue *distinct* from self-interest – a form of love grounded in the intrinsic value of the other's good. However, given the collapse above, this "justice" is indistinguishable from a highly refined, long-term, and intellectually sophisticated form of egoism.
      *   The "wise" egoist, understanding that their own happiness is maximized by perceiving the *true* happiness of others, will act *identically* to Leibniz's just person. They will promote the real good of others, guided by wisdom, and take pleasure in it.
      *   The difference Leibniz posits – disinterest vs. self-interest – evaporates under the pressure of his psychological axiom. Both the "just" person and the "enlightened egoist" are pursuing their own greatest pleasure; the former just has a more accurate understanding (via wisdom) of what reliably provides it (perceiving true others' perfection).

  **Conclusion:**

  You are correct. Leibniz's definition of justice as "caritas sapientis" cannot sustain the disinterestedness he claims for it, given his unwavering commitment to psychological hedonism ("every act of will is moved by the pursuit of the agent's own greatest pleasure") and his identification of pleasure with the perception of perfection. On his own terms, the wise person's delight in another's good is *necessarily* motivated by the pleasure *that delight constitutes for the wise person*. The other's good is valued instrumentally, as the indispensable object whose perception yields the agent's desired pleasurable state. Consequently, "caritas sapientis" collapses into a refined, wisdom-guided strategy for maximizing the agent's own pleasure and perfection – a sophisticated form of enlightened egoism. Leibniz's definition of justice, therefore, fails to identify a virtue truly distinct from self-interest, despite his noble intentions. The psychological premises undermine the ethical superstructure.
