answer: |-
  Here's a eulogy draft that weaves in the core concept of Good's theorem to explain his final decision naturally, honoring both his principles and his choice, while staying accessible and emotionally resonant:

  ---

  **(Start with warmth and personal connection)**
  Good morning. For those who don’t know me, I’m [Your Name], [Uncle's Name]'s nephew. For as long as I can remember, my uncle wasn’t just family; he was my north star in statistics, the reason I’m standing here today with a PhD in the field. And anyone who ever worked with him, had coffee with him, or even just sat next to him on a long flight, knows his signature line. It wasn’t just a saying; it was his operating system for life: **"More information can never make you worse off, only better, so you might as well look."**

  **(Briefly introduce the "real math" and its core promise)**
  He said it about car loans, weather forecasts, stock picks, even whether to get a second opinion on his hip. And a few years back, his eyes absolutely lit up when I told him there *was* real, beautiful math behind his folksy wisdom – something called Good’s Theorem. It proves, rigorously, that for someone making careful, rational decisions – a true Bayesian – **seeking out free information *always* has a positive expected value. It can’t hurt you, on average; it can only help you make a better choice.** He loved that. It validated a lifetime of careful calculation. He made me explain it twice.

  **(Acknowledge the apparent contradiction gently)**
  So, some of you – especially Aunt [Aunt's Name], and maybe some of his old actuarial comrades – might have been surprised, even perplexed, right at the end, when his oncologist offered him a specific timeline... and he said, "No. I don’t want to hear the number." It seems, on the surface, like the man who built his life on seeking information suddenly turned away from it.

  **(Explain the nuance using the theorem's context - this is the core)**
  But here’s the thing Good’s Theorem, and my uncle’s lifelong practice, *actually* teaches us: **Information is valuable because it helps us *act*.** It helps us weigh options, mitigate risks, optimize outcomes. The *expected value* is positive *when you can use that information to make a decision that changes your path.* It empowers action.

  **(Connect to his specific situation)**
  In those final weeks, facing what he knew was terminal, my uncle made a profound calculation. **The specific number offered wasn't information he could *act* upon to change the outcome.** There were no more treatment paths to choose, no logistical hurdles to optimize based on whether it was X months or Y. Hearing that precise figure couldn't help him *do* anything differently that he wasn't already planning to do – which was to live fully, love deeply, and find peace with his family right up until the end.

  **(Address the potential cost - key insight)**
  Good’s Theorem assumes the information itself is costless. But my uncle, the ultimate rational actor, understood something deeper: **While information can't make your *decisions* worse, it *can* change your *experience*.** That number, in that moment, carried a potential cost *not* to his choices, but to his peace, his mental space, his ability to focus entirely on the love surrounding him without the weight of a ticking clock dominating his thoughts. He couldn't "un-hear" it. The theorem promises the information won't harm your *expected outcome*, but it doesn't promise it won't carry an emotional weight.

  **(Reconcile the choice with his principle)**
  Declining that specific piece of information wasn't a betrayal of his principle; it was its **finest, most human application.** He looked at the situation with clear eyes: **Could this information improve his actions? He calculated: No. Could it impose a cost on his inner state? He judged: Yes, potentially.** So, with the same calm logic he applied to every risk assessment for 40 years, he chose *not* to look. He optimized for peace, for presence, for the quality of his remaining experience – the outcome he *could* still influence. He used the *power* of information – understanding its limits and potential burdens in this unique context – to protect the very thing he valued most in those precious days: serenity and connection.

  **(Conclude with legacy and emotional resonance)**
  His life’s motto wasn’t about hoarding data blindly; it was about **wisely seeking knowledge to live better.** And in his final act of wisdom, he showed us that sometimes, living better means knowing what *not* to know. He used the rigorous logic he loved not just to navigate the world, but to navigate his own farewell with incredible grace and intentionality. He looked at the ultimate decision point, weighed the value and cost of one last piece of information with his characteristic clarity, and made the choice that served his peace. That wasn't cowardice. That was my uncle: **The consummate actuary, right to the end, masterfully calculating the true value of information, and choosing the path that maximized his deepest human utility – love, presence, and peace.** We’ll miss his wisdom, his warmth, and yes, even that signature line, more than words can say.

  ---

  **Why this works for the eulogy:**

  1.  **Acknowledges the Contradiction:** It directly addresses what the aunt and colleagues noticed without being defensive.
  2.  **Uses the Theorem Correctly:** It explains the core promise of Good's theorem (non-negative *expected value for decision-making*) and its key assumption (information is "free").
  3.  **Explains the Nuance:** It focuses on the crucial distinction the theorem makes: information's value is *instrumental* (helps you act). When you *can't* act on it, its *instrumental* value is zero, but its *experiential* cost might not be.
  4.  **Applies to the Situation:** It clearly frames his choice: The number offered no actionable benefit ("couldn't help him *do* anything differently"), but had a potential experiential cost ("weight of a ticking clock," "inner state").
  5.  **Reframes as Consistent:** It argues this *was* consistent with his Bayesian/actuarial mindset – a rational cost-benefit analysis where the cost wasn't monetary but emotional/experiential, and the benefit (actionability) was absent.
  6.  **Accessible Language:** Uses terms like "action," "outcome," "peace," "experience," "weight," "cost," "calculation," "optimize." Avoids jargon like "utility function," "Bayesian updating," or "expected utility."
  7.  **Emotional Arc:** Starts with his passion and principle, acknowledges the tension, resolves it with insight into his final wisdom, and ends on a note of love, peace, and respect for his consistent character.
  8.  **Honors Both Audiences:** The actuaries will hear the precise logic behind the explanation. The family will understand the core idea: he made a careful choice to protect his peace because the information couldn't help him *do* anything more.
  9.  **Respectful & Uplifting:** Focuses on his wisdom, intentionality, and desire for peace, painting his final choice as courageous and consistent, not a retreat. Ends on love.

  This approach provides a satisfying intellectual resolution for those who knew the theorem and a deeply human explanation for everyone else, all while honoring your uncle's remarkable consistency and final wishes.
