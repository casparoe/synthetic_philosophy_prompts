  Another angle is the pedagogical purpose. Sacrifices served as a tool to wean people off idolatry, but once their purpose is achieved, they might become symbolic or unnecessary. However, Maimonides doesn't explicitly say this in the legal text. Maybe in the messianic era, sacrifices are reinstated but with a purified intent, devoid of past associations. That could align both views without overt contradiction.

