  ok random question but it's actually for my diss chapter on Maimonides' ta'amei ha-mitzvot (reasons for the commandments). In Guide III:32 he explains animal sacrafice as basically a concession — the Israelites only knew Sabian-style sacrificial worship, so God let them keep doing it but redirected it toward Him, with the long game being that it'd gradually wither into pure prayer and contemplation instead. Except in the Mishneh Torah (Hilchot Melachim) he just flatly codifies that the messianic king rebuilds the Temple and the sacrifices resume, no hint that they're on their way out, and iirc the permanence/unchangeability of the Torah is literally one of his 13 principles of faith (the 9th?). This feels like a real tension to me and not just me projecting modern categories onto him. Can you give me the most important implications of the Guide's "weaning off idolatry" theory for that tension — like, does it actually put pressure on his own immutability principle, is there a good faith way to hold both, or does the tension maybe dissolve once you take his esotericism seriously? Just want your top handful of implications, doesnt need to be exhaustive or formatted.
