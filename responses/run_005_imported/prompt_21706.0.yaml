answer: |-
  Here are the most significant implications of the Guide's "weaning off idolatry" theory for the tension with the Mishneh Torah's messianic restoration of sacrifices and the principle of Torah immutability, distilled for your diss chapter:

  1.  **Core Tension & Challenge to Immutability:** The tension is real and central. If sacrifices were *only* a temporary concession to historical circumstance (Sabianism) destined to wither away, their eternal codification in the Mishneh Torah and mandated restoration *contradicts* Maimonides' own 9th principle (immutability of the Torah). It suggests the Torah *could* change (abolishing sacrifices) once their pedagogical purpose was served, undermining the principle's core meaning.

  2.  **Esotericism as the Primary Key to Dissolution:** Taking Maimonides' esotericism seriously is crucial for dissolving the tension:
      *   **Guide = Esoteric Truth:** The concession theory in the *Guide* is the *philosophical truth* about the *historical origin* and *ultimate pedagogical purpose* of sacrifices. It's meant for the intellectual elite who can grasp the rational structure of divine wisdom and the necessity of historical accommodation.
      *   **Mishneh Torah = Exoteric Law:** The codification in *Mishneh Torah* represents the *public, legal reality* and the *form* of the commandments as eternally binding divine law. Publicly undermining the sacrificial system (or suggesting its future abolition) would be destabilizing and potentially heretical for the masses. The messianic restoration upholds the eternal validity of the *entire* Torah as received at Sinai.
      *   **Different Audiences, Different Messages:** The *Guide* explains *why* sacrifices *were instituted* historically. The *Mishneh Torah* dictates *what* must be done *now and forever* according to the law. The "long game" withering is a philosophical insight, not a legal prediction or prescription for change.

  3.  **Reconciling Immutability with Pedagogical Purpose:** The "good faith" reconciliation hinges on distinguishing between the *reason* for a law (which can be historical/contingent) and the *law itself* (which is eternal):
      *   **Law is Eternal, Reason May Fade:** Even if the *original reason* for sacrifices (weaning from idolatry) fades, the *commandment itself*, as divine will, remains eternally binding. God commanded it, so it must be performed, regardless of whether the *initial* human need for it changes. The messianic restoration affirms this eternal obligation.
      *   **Symbolic Transformation:** In the messianic era, sacrifices might be performed with a *purified intent*, no longer burdened by any association with idolatry, fulfilling their ultimate purpose as pure worship directed solely to God. They become what they were always *meant* to be symbolically, even if historically necessitated by flawed human understanding. The *form* persists, but the *meaning* for the perfected community is different.

  4.  **Implicit Pressure on Literal Restoration:** While the *Mishneh Torah* codifies the restoration literally, the *Guide's* theory subtly pressures that interpretation. If the ultimate goal was prayer/contemplation, and idolatry is fully eradicated in the messianic age, *why* would God *reintroduce* the very system described as a concession to a *defeated* idolatry? This suggests the "restoration" might be understood esoterically or symbolically by the elite (e.g., representing pure devotion, cosmic order), even while performed literally for the masses. Maimonides doesn't say this, but the tension points towards it.

  5.  **"Gradual Withering" vs. "Eternal Law":** The "long game" of withering seems incompatible with mandated restoration. The reconciliation requires seeing the "withering" *not* as the abolition of the law, but as the *internal, spiritual transcendence* of its *external form* by the intellectual elite *even while the form continues*. Prayer/contemplation become the *primary* mode of worship *alongside* the continued performance of sacrifices by the community as a whole, fulfilling the law. The messianic era allows this ideal state where both coexist perfectly.

  **Top Implications for Your Chapter:**

  1.  **The tension is genuine** and highlights a potential conflict between Maimonides' rationalist historiography (*Guide*) and his commitment to legal normativity and public orthodoxy (*Mishneh Torah*, 13 Principles).
  2.  **Esotericism is essential** for resolving it. The *Guide* reveals the historical truth for philosophers; the *Mishneh Torah* upholds the eternal legal structure for all.
  3.  **The 9th Principle (immutability) pertains to the *law itself*, not necessarily its *original historical reason*.** The law remains binding eternally, even if the contingent reason for its initial institution fades.
  4.  **Reconciling the views requires distinguishing:** The concession explains *historical origin*; the restoration affirms *eternal obligation*; the "withering" may signify *spiritual transcendence* of the form *while maintaining* its performance.
  5.  **The *Guide* subtly challenges a purely literal understanding** of the messianic sacrifices, implying a potential symbolic or purified meaning for the elite, even if codified literally.

  **Key Takeaway:** Maimonides navigates a complex duality. For the philosopher, sacrifices are a historically contingent step towards rational worship. For the legal system and the community, they are an eternal, unchanging divine command. The messianic restoration upholds the latter, while the *Guide's* explanation satisfies the former, with esotericism bridging the gap. The tension reflects the challenge of integrating profound historical-philosophical insight with unwavering commitment to the immutability of divine law.
