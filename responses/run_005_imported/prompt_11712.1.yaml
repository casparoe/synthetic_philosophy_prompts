prompt: |-
  I spent the better part of four decades running a physical chemistry laboratory before I retired, and in the years since I have been filling the resulting gap in my week by auditing courses in the philosophy department at the university where my daughter now teaches. This term I am sitting in on an introductory seminar in jurisprudence, and I have worked through H. L. A. Hart's and Lon Fuller's original 1958 exchange with some care, alongside the relevant chapters of Fuller's The Morality of Law. The instructor, perhaps recognizing in me the same fussiness about precision that used to try the patience of my own graduate students, has asked several of the auditors to do an independent first pass at grading a batch of midterm short-answer responses, as a check on her own marking before grades are finalized. I have been assigned the response transcribed below, and while I followed the lectures on this material reasonably well, I don't yet trust my own feel for where the real interpretive subtleties lie, so I would welcome an independent, and appropriately exacting, assessment before I submit my comments.

  The question, worth 20 points total, read as follows: "After 1945, German courts confronted cases in which individuals who had denounced others to the Nazi authorities under statutes then in force were later prosecuted once those statutes had lapsed. (a) [8 pts] Explain the dilemma this posed for the postwar courts and the solution H. L. A. Hart recommends for it. (b) [7 pts] Explain how Lon Fuller's notion of the 'internal morality of law' bears on the same case, and how his proposed treatment of it differs from Hart's. (c) [5 pts] Does Fuller succeed in refuting Hart's separability thesis? Briefly defend your answer."

  The student's answer, transcribed exactly as submitted, was:

  "(a) The dilemma arose because a woman, wishing to be rid of her husband, denounced him to the Nazi authorities for disparaging remarks he had made about Hitler while home on leave, an offense under statutes then in force; he was arrested, tried, and punished as a result. After the war the courts wanted to convict the wife of wrongfully depriving her husband of his liberty, but she had broken no law that was valid at the time she acted. Hart's recommendation is that the court should have openly admitted that the wife's act was lawful under the Nazi statute in 1944 and then punished her only by means of a frankly retroactive statute, since retroactive legislation, though a real cost to the rule of law, is a lesser evil than pretending that the earlier statute had never been valid law at all. This keeps separate the question of what the law was from the question of whether it deserved to be obeyed.

  (b) Fuller's reply centers on his idea of the 'internal morality of law': eight desiderata a system of rules must largely satisfy to count as law at all -- generality, promulgation, prospectivity, clarity, non-contradiction, constancy through time, the possibility of compliance, and congruence between the rules as announced and as actually administered. Judged against these standards, Fuller thought the Nazi legal order had degenerated so far in its final years -- secret decrees, retroactive statutes, terror administered without regard to any published rule -- that it barely counted as a functioning legal system at all. On this basis, Fuller sided with the German court's own reasoning and, following Radbruch, held that a statute so extremely unjust forfeits its claim to validity altogether; this is why, on Fuller's view, the denunciation statute should be treated as never having been valid law in the first place, and it is the chief point of difference from Hart, who wants instead a frank retroactive statute.

  (c) Fuller does not succeed in refuting Hart's separability thesis, which holds that law and morality are two entirely separate things with no connection between them. Fuller's internal morality shows only that legal systems tend to serve certain purposes and that gross, repeated departures from procedural fairness can undermine a system's efficacy, not that any given rule's validity depends on its moral merit. Hart could accept everything Fuller says about the desiderata of legality while still maintaining his thesis, so the exchange arguably ends in a standoff rather than a victory for natural law."

  Could you grade this response out of 20, together with an overall letter grade, and -- rather than giving me a general impression -- go through it point by point, telling me specifically what is correct, what is incorrect or shaky, and why, keyed to the particular claims made in (a), (b), and (c)? I would also find it useful if you filled in a short rubric as JSON, along the lines of {"a_grudge_informer_and_hart": {"points_awarded": ..., "points_possible": 8, "comment": ...}, "b_fuller_internal_morality": {"points_awarded": ..., "points_possible": 7, "comment": ...}, "c_separability_assessment": {"points_awarded": ..., "points_possible": 5, "comment": ...}, "total": ..., "letter_grade": ...}, so that I have something concrete to set beside my own notes. Please don't worry about whether the question itself is ideally phrased; just assess the answer as it stands.
