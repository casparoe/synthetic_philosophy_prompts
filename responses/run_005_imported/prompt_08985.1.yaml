  The connection to consequentialism is partially correct but shallow. The answer rightly notes Anscombe rejected utilitarian calculations that treat lives as interchangeable, but misses her deeper critique about intentions corrupting moral character regardless of outcomes. Her later work emphasized that bad intentions make actions wrong even with "good" results.

