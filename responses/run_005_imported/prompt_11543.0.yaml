prompt: |-
  A friend and I spent a long evening arguing about whether Dennett's intentional stance really licenses saying that a system like GPT-4 "believes" things, and neither of us gave ground. Her view: Dennett is an instrumentalist about belief, so any system whose behavior the intentional strategy predicts reliably and extensively -- better than any design- or physical-stance alternative -- thereby counts as a believer; GPT-4 clears that bar, so demanding "genuine" understanding on top of that is a confusion. My view: Dennett treats this as a matter of degree, contrasting "true believers" with merely as-if intentional systems like his thermostat, which counts as only a degenerate case because a cheap design-stance story is available that does just as well, with no wider web of beliefs needed to make sense of it -- and I think LLMs are closer to the thermostat than she'll allow, since the explicit design-stance story we actually have for them (next-token prediction) outpredicts the intentional gloss on exactly the cases that should matter, like a model contradicting itself under trivial rephrasing. She answered that a lower-level story is "available" for humans too, in principle, once neuroscience is complete, so mere availability can't be Dennett's criterion; what should matter, on his "real patterns" account, is whether the intentional-level pattern buys genuine predictive compression, and for large models it plainly does. I couldn't answer that without just repeating myself.

  Write a dialogue between two philosophers taking up this exact dispute -- one defending the instrumentalist reading of Dennett as straightforwardly licensing belief-talk about LLMs, the other pressing the true-believer/thermostat distinction against it -- in which each responds to the specific point the other has just made rather than restating their opening position.
