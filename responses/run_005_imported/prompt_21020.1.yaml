  **Key Takeaways for Your Grading:**  
  1.  **You were right to second-guess Part (b):** Priya's claim that *both* readings are false is the major flaw. The secondary occurrence (`¬∃x(Kx & ... & Bx)`) **is true** because it correctly states "It is not the case that there exists a unique, bald present King of France."  
  2.  **LEM Implication:** Her LEM point is *partially* salvaged because the *original sentence* "The present King of France is not bald" *itself* (without scope specification) violates LEM since neither disambiguation ("The KoF is non-bald" vs. "It is not the case that the KoF is bald") yields a true/false pair for the same logical subject/predicate due to the lack of a referent. However, the error weakens this explanation.  
