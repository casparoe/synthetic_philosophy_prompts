answer: |-
  ## The Unshakeable Handshake

  **Setting:** A slightly too-loud campus bar near the economics department. Rain streaks the windows. Empty coffee cups mingle with half-finished beers. **ALEX** (early 30s, Philosophy PhD, leans towards formal methods) and **JORDAN** (early 30s, now a policy analyst/data scientist, pragmatic empiricist) are hunched over a laptop showing a prediction market contract: "Party X to win Senate Seat Y - Current Price: $0.65 (Implied Prob: 65%)". Alex has just offered to sell Jordan a $1 contract for $0.60 (betting Party X *will* win). Jordan agreed to buy at that price (betting Party X *won't* win). Hands are about to meet over the sticky table.

  **ALEX:** (Hand hovering) Wait. Wait a second, Jordan.

  **JORDAN:** What? Cold feet? Thought you were sure Party X has this locked up? Polls shifted?

  **ALEX:** No, no, the polls are fine. It’s… it’s *us*. Think about it. We’re both rational agents, right? Or at least, we both *think* we are, and we both *know* the other thinks they are. We’ve got the same public data – polls, fundraising, historical trends – broadly accessible on that site. We’re about to knowingly take opposite sides of a binary bet. Based purely on our differing *beliefs* about the same event.

  **JORDAN:** (Leans back, intrigued but wary) Yeah… that’s kind of the point of betting? Differing beliefs? Why else would we trade? I think it’s less likely than the market implies, you think it’s more likely. We disagree. Hence, mutually beneficial trade. Shake?

  **ALEX:** But that’s just it! *Should* we disagree like this? If we were truly rational, shared a common prior probability assessment *before* we saw any evidence, and then updated rationally with Bayes on all the *same* public information… our posterior probabilities *should be identical*. Aumann’s ‘agreeing to disagree’ theorem. If our posteriors are common knowledge – and me offering to sell at $0.60 implies my posterior is >60%, you buying implies yours is <60%, so it *is* common knowledge we disagree – and we share a common prior… we literally *cannot* rationally hold different beliefs.

  **JORDAN:** (Raises an eyebrow) Ah. The ghost of Aumann haunts the bar. Okay, Professor. Lay it on me. Why can't we bet?

  **ALEX:** It’s the *no-trade theorem* consequence. If two rational agents share a common prior, and their beliefs (posteriors) are common knowledge, then there is *no* bet they both believe has positive expected value for them. Because if they did, it would imply they assign different probabilities to the same event even after conditioning on all information *and* the fact that they disagree! Which Aumann shows is impossible under common priors and common knowledge of rationality. So, the mere fact that we *want* to make this bet… it proves something’s off. Either:
  1.  We don't *really* share a common prior (one of us started irrational?),
  2.  We don't have *truly* common knowledge of our beliefs or rationality (maybe you think I'm dumb?),
  3.  Or… crucially… we have *private information* we haven’t shared. Did you get an inside poll? Hear a scandal brewing?

  **JORDAN:** (Chuckles) No inside info, Alex. Scout’s honor. Just good old-fashioned interpretation. But hold on. You just slipped in the killer assumption: the **common prior**. That’s the linchpin. Harsanyi’s doctrine, right? "All differences in beliefs must stem from differences in information"? The idea that rationality *demands* we all started from the same blank slate probability measure over the state space?

  **ALEX:** Exactly! It’s not just a modeling convenience. Think about it: where *should* rational priors come from? If rationality is objective, shouldn't there be a uniquely rational prior given complete ignorance? Or at least, shouldn't rational agents converge to the same prior through some normative process? Otherwise, belief differences are just arbitrary whims, not rational disagreements. The common prior forces beliefs to be grounded in evidence and updating, not caprice. It makes disagreement *meaningful* – it *must* signal hidden information or irrationality.

  **JORDAN:** Whoa, whoa. That’s a *massive* claim. "Uniquely rational prior"? Show me the algorithm for generating *the* rational prior over "Will Party X win Senate Seat Y?" given *zero* information. Laplace’s principle of indifference? Okay, assign 50/50. But why is *that* uniquely rational? What if the seat is in a state historically dominated by Party Z? Shouldn't *that* historical knowledge be part of the "prior" framework? But *how* to weight it? Savage showed us how to *update* consistently, not how to magically conjure the One True Prior ex nihilo. Priors *are* personal, Alex. They encapsulate our entire worldview, our heuristics, our sense of what’s plausible *before* specific evidence arrives. My skepticism about Party X comes from a general model of voter fatigue in midterms based on historical patterns I weight heavily; your confidence comes from a model emphasizing incumbency advantage you weight heavily. Neither is *irrational* – we’re both using Bayes! – but our starting points, our priors over *which models are relevant and how to weight them*, differ. That's not hidden info, that's just… us.

  **ALEX:** But that sounds like radical subjectivism! If priors can be *anything* as long as you update correctly, then rationality loses its normative bite. You could have a prior assigning 99% to flying spaghetti monsters and be "rational" as long as you update correctly on contrary evidence. The common prior imposes discipline. It says rational agents, facing the same fundamental uncertainty, *should* start from the same baseline. Differences *must* arise from differential access to the world.

  **JORDAN:** It’s not radical subjectivism; it’s acknowledging the *contextual* nature of framing uncertainty. There *is* no "fundamental uncertainty" divorced from a conceptual framework. The "state space" itself is a construct! Do we define states based on raw vote counts? Victory margins? Including/excluding recounts? Our priors reflect how we carve up the possibility space. That’s inherently perspectival. Demanding a common prior smuggles in the idea that there’s one uniquely correct way to conceptualize the problem *before any evidence* – which is just as dogmatic as insisting on a specific prior probability. Your "discipline" feels like a straitjacket. And look around! (Gestures vaguely towards the laptop screen) Prediction markets *thrive* on disagreement based on differing interpretations of *public* info! Are you saying every single trader on Polymarket is either irrational or has secret intel? That seems… empirically false.

  **ALEX:** (Sighs) For perfectly idealized rational agents with a *well-defined, shared* state space and common prior? Yes, that *is* what the theorem says. Persistent disagreement on public info *requires* irrationality or private info. In practice, sure, markets work because we’re *not* idealized. We have computational limits, different models, maybe even different conceptualizations of the state space… and yes, sometimes private info. But the theorem gives us the *ideal*. It tells us what *pure* rationality demands. If we see disagreement, we *should* look for hidden info or reasoning errors. It’s a diagnostic tool.

  **JORDAN:** Or… we should look at differing priors! You keep equating "differing priors" with "irrationality." I reject that. I can grant you common knowledge of our beliefs *right now* and common knowledge that we’re both trying to be Bayesian updaters. But without the straitjacket of a mythical common prior, the no-trade theorem *doesn’t apply*. Our willingness to bet simply signals that our *personal* Bayesian calculations, based on our *personal* priors updated on public info, give this bet positive expected value for each of us. No irrationality needed. Just differing starting points.

  **ALEX:** But if the starting points are unconstrained, rationality becomes vacuous! How do you criticize *any* belief? "Oh, that’s just their prior"?

  **JORDAN:** We criticize based on *internal* consistency (Dutch books!), responsiveness to evidence, coherence with broader knowledge – Savage’s axioms applied *given their own prior framework*. We don’t need a universal prior to have norms. We just can’t demand that norms force everyone into the same belief given the same public info.

  **(A pause. The noise of the bar seems louder.)**

  **ALEX:** (Frowning) Hang on. Are we… talking past each other? You’re arguing about what *actual, human* rationality allows. We’re messy, we have different backgrounds, we conceptualize problems differently. Perfectly coherent.

  **JORDAN:** And you’re arguing about what *idealized, hyper-rational agents in a perfectly specified model* would do. Where the state space is God-given and the prior is a shared law of nature.

  **ALEX:** Exactly. The theorem describes that idealized world. It’s a limiting case, a benchmark.

  **JORDAN:** But then applying the "therefore, disagreement implies irrationality or secrets" *directly* to us, sitting here, with our human priors and messy interpretations… *that’s* the bait-and-switch. You’re using the conclusion of a model *that assumes away the very thing causing our disagreement* (differing priors) to tell me our disagreement must be caused by something else! It’s circular.

  **ALEX:** But the model *defines* what rational disagreement *is*! It says rational disagreement *only exists* when there are information differences. If you reject the common prior, you’re rejecting that definition. You’re saying rational disagreement can be fundamental.

  **JORDAN:** Yes! I am! Because I think the demand for a common prior *isn't* a neutral requirement of rationality; it's an *additional*, substantive, and arguably *unjustifiable* constraint. Rationality, as humans can practice it, is about *coherence and updating*, not about converging to the same beliefs absent information differences. The "common prior" isn't innocent; it's smuggling in a huge chunk of what you're trying to explain.

  **ALEX:** And you’re smuggling in radical subjectivism under the guise of "personal priors"! How do we learn from each other if our priors are immutable foundations?

  **JORDAN:** We update! Seeing your confidence might make me re-examine *why* I weight historical patterns so heavily. Maybe I’ll adjust my model weights – that’s *updating my beliefs within my framework*. It doesn’t mean I adopt *your* prior.

  **(They stare at each other, the laptop screen glowing between them. The contract price ticks up to $0.66.)**

  **JORDAN:** So… are we doing this? $100 worth? My messy, personal-prior-based, potentially irrational (by your lights) belief says buying from you at $0.60 is a good deal. Does yours?

  **ALEX:** (Looks at the screen, then at Jordan’s outstretched hand. A slow, conflicted smile spreads) My *idealized* rational agent self is screaming. But my actual, human self, with my specific prior that weights incumbency advantage heavily and thinks you might be underestimating it… yes. It still looks like a good deal to me. Despite the theorem. Or perhaps… because the theorem’s assumptions don’t perfectly hold here? I don’t know. (Reaches out) Deal.

  **JORDAN:** Deal. (They shake) May the best… prior… win.

  **ALEX:** (Shaking head, half-amused, half-troubled) Yeah. Let’s just hope neither of us has actual hidden info. Or is being truly irrational.

  **JORDAN:** (Grins) Odds are, at least one of us is. But which one? Now *that* would require a common prior to figure out.

  **(They both take a long drink, the unresolved tension hanging as heavily as the bar’s humid air. The bet is on, but the argument about *why* it could happen remains fiercely, fundamentally, open.)**
