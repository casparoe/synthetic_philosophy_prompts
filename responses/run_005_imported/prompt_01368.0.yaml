answer: |-
  ## The Riverside Walk Dialogue  
  *(Dr. Evelyn Frost, a dedicated Bratmanian individualist, and Dr. Marcus Ellis, a staunch Gilbertian holist, are strolling along a riverside path. The autumn leaves crunch underfoot. Frost gestures ahead.)*

  **Frost:** Marcus, consider this very walk. According to your view, the moment we agreed to walk together by the river, we formed a 'plural subject' with a primitive joint commitment. Correct?  
  **Ellis:** Precisely, Evelyn. It’s not just that you intend to walk and I intend to walk. *We* are walking together. That ‘we-intention’ binds us normatively. If you suddenly sprinted off toward the car park without a word, I wouldn’t just be *disappointed* – I’d be *entitled to rebuke you*.  

  **Frost:** *(Nods thoughtfully)* I agree you’d feel entitled to rebuke me. Where we diverge is *why*. I see no need for mysterious ‘plural subject glue’. My account explains it neatly: I intend that *we* walk together, partly *by way of* your intention that we walk together. You reciprocate. We each believe the other has this interlocking intention, and we’ve sub-planned accordingly – this path, this pace. All individual attitudes.  

  **Ellis:** But that’s descriptive, not normative! Your ‘interlocking intentions’ explain coordination, not obligation. If you bolt, I might predict disappointment based on your *individual* character – say, if I know you’re usually polite. But that’s not the *distinctive* rebuke here. The rebuke stems from *our joint commitment itself*. "You can’t just *leave* like that – *we’re* walking together!" The ‘ought’ is irreducible.  

  **Frost:** Ah, but the normativity *emerges*! First: *Means-end coherence*. If I intend that we J, and I believe continuing on this path is necessary for J, then rationality demands I stick to the path – or at least renegotiate. Second: *Interdependence*. My intention that *we* J depends on your continued participation. If I abandon you, I violate the stability condition of my *own* intention – it becomes incoherent. That failure warrants criticism.  

  **Ellis:** *(Stops walking, facing Frost)* Let’s test that. Suppose *you* are a perfectly rational individualist. You calculate: "My intention that we walk depends on Marcus’s participation. If I leave abruptly, he’ll be upset, and future coordination might suffer. So, for *my own* goal stability and reputation, I should give notice." That’s self-interested prudence! It’s not the same as feeling *answerable to Marcus* for violating *our* commitment. The rebuke isn’t "You harmed future you!" It’s "You broke *our* pact!"  

  **Frost:** *(Holds up a finger)* Not just prudence! The criticism you’d level relies on *mutual obligations built from promises*. When I tacitly agreed to this walk, I invoked a norm of fidelity – a norm *individuals* recognize. Your rebuke appeals to *my* understanding of that norm: "You *led me to rely* on you." That reliance, grounded in my expression of intention and your belief, generates your entitlement to hold me accountable. No collective mind required.  

  **Ellis:** But *whose* norm of fidelity? *Yours* or *mine*? When we formed the joint commitment, we created a *new* normative source: *us-as-a-unit*. The obligation isn’t just to avoid *my* disappointment or uphold *your* personal norms. It’s owed *to the us*. That’s why the rebuke has the form: "What about *us*?" or "What about *our walk*?" – not "What about *my* expectation?"  

  **Frost:** I’d argue that "us" is shorthand! "Our walk" refers to the complex of *my* intention, *your* intention, *my* belief about you, *your* belief about me, and *our* mesh of sub-plans. When you say "You broke *our* commitment," you’re really saying: "You violated the stability conditions of *your own* intention upon which *my* coordinating intention relied, given *our* mutual beliefs." The ‘ought’ is bootstrapped from individual rationality plus social norms.  

  **Ellis:** *(Resumes walking, frowning)* Then why does it feel *categorically* different than parallel individual actions? Imagine two people coincidentally walking the same path, each merely *predicting* the other will continue. If one peels off, the other might be surprised, but no rebuke is warranted – even if they *mutually believed* they’d keep pace! Only when they *jointly commit* does the obligation arise. Your individualist soup can’t cook *that* difference.  

  **Frost:** Because in the coincidental case, there *are* no interlocking *we-intentions*! Neither intends that *we* walk *by way of* the other’s intention. Neither has sub-plans sensitive to the other’s sub-plans. Mutual belief alone is inert. It’s the *interlocking intention structure* that activates the norms of reliance and fidelity. *That’s* the missing ingredient – not a primitive ‘plural subject’.  

  **Ellis:** But the interlocking intentions *presuppose* the joint commitment! How can you *intend that we J* unless you already understand yourself as *able to speak for the ‘we’*? Your intention isn’t "I’ll make us walk," it’s "I commit *us* to walk." The joint commitment is the *ground* enabling the intention, not its *consequence*. Without that, your ‘we-intention’ is just a bizarre form of control fantasy.  

  **Frost:** *(Pauses at a bench)* Let me flip it. Suppose I accept your ‘plural subject’. What *work* does it do beyond describing the pattern of individual attitudes and the norms they invoke? If Jack bolts on Sue, Sue rebukes him. You say: "Ah! The plural subject!" I say: "Ah! Jack violated the reliance Sue formed based on his expressed intention, failing means-end coherence for his interdependent goal!" We both *predict and justify* the rebuke. Occam’s razor cuts your subject away.  

  **Ellis:** *(Sits, leaning forward)* The ‘work’ is explaining the *source* of Sue’s *authority* to rebuke. In your world, her rebuke is really just an appeal to Jack’s *individual* rationality or his adherence to *general* social norms. But in the walk case, her authority derives specifically from *being the other party to their joint commitment*. She speaks not just for herself, but for the *unit* they created. That authority is *sui generis* – emergent from the commitment itself, irreducible to individual psychology. *That’s* the glue.  

  **Frost:** And I maintain that ‘authority’ is just Sue invoking the publicly understood norms triggered when two people manifestly embark on a joint activity. It’s a social practice constituted by individuals recognizing mutual obligations *as individuals*. The ‘glue’ is cultural, not metaphysical.  

  *(A long pause. The river flows beside them.)*  

  **Ellis:** So you see collective intention as a complex epiphenomenon.  
  **Frost:** And you see it as a metaphysically basic force.  
  **Ellis:** *(Stands, offering a hand to help Frost up)* Then let’s finish *our* walk. If I vanish now, you’ll know exactly why you can rightly complain.  
  **Frost:** *(Takes his hand, smiling wryly)* And I’ll know exactly how to explain it – without positing an ‘us’ floating above the river.  

  *(They continue walking, the argument unresolved, the crunch of leaves echoing the tension between the individual and the collective.)*  

  ---

  **Key Philosophical Moves Captured:**  
  1. **Bratman's Reduction:** Frost meticulously builds the rebuke from interlocking individual intentions (I intend that we J by way of your intention), mutual belief, individual rationality norms (means-end coherence, stability), and social norms (fidelity, reliance).  
  2. **Gilbert's Holism:** Ellis insists the *distinctive normative force* of joint commitment (the entitlement to rebuke *as a party to the 'us'*) cannot be reduced to individual attitudes + generic norms. The "plural subject" creates unique, non-prudential obligations.  
  3. **The Explanatory Payoff:** Frost argues Gilbert's plural subject is explanatorily redundant; Ellis argues Bratman misses the *sui generis* authority and obligation created by joint commitment.  
  4. **The Crucial Test Case:** The coincidental walkers vs. jointly committed walkers highlights the gap – only the latter generates obligation, which Ellis argues requires a joint commitment as ground zero.  

  **Why They Don't Converge:** Bratman sees collective phenomena as intricate *constellations* of individual attitudes and social practices. Gilbert sees them as *irreducible social atoms* generating unique normative worlds. One prizes parsimony; the other insists reality demands the extra ontological category. The dialogue lives in that friction.
