  The dollar auction experiment is key here. It's a trap where bidders escalate commitments because the penalty structure makes quitting feel worse than overpaying. Ben suggests lawsuits work similarly - you keep fighting hoping the other side folds.

  Mara's rebuttal is about pre-commitment: truly rational people set walk-away points in advance. Ben fires back that even forewarned people fall into this trap, suggesting it's deeply psychological.

