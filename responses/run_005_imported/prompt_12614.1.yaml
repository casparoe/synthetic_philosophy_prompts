  The core insight both miss: lawsuits differ from dollar auctions in three ways - (1) asymmetric information (you never know the opponent's breaking point), (2) emotional investment in property disputes, and (3) professional incentives where lawyers benefit from prolonged conflict. The real irrationality may stem from not accounting for these human factors upfront.

