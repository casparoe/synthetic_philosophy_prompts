  First, I need to unpack the mechanics of both theories. Wright's selected-effects approach defines function as what a trait was selected for - its evolutionary history explains its current presence. Cummins takes a systemic approach where function is a causal contribution to some capacity of a larger system, relative to an analytical perspective. 

  The user highlights two key challenges: Cummins's theory seems too permissive (anything can be a function depending on the chosen analysis) while Wright's struggles with exaptation (how quickly a new use becomes a "function" and how to weight ancestral vs. new roles). 

  For Cummins, the physician example shows the problem - heart sounds aren't biologically functional but fit his definition if we analyze diagnostic systems. His theory has no internal constraint on "correct" analyses. Could he fix this without invoking selection history? Maybe by requiring that the capacity being analyzed is biologically significant (e.g., survival/reproduction), but that risks circularity without evolutionary grounding. 

  Wright's exaptation problem is trickier. When a trait is co-opted (e.g., feathers for flight), his original schema might still privilege the ancestral function (insulation). He could modify it to focus on recent selective pressures, but his core mechanics tie function strictly to historical selection - any weighting of "how much history counts" seems arbitrary without external criteria. 

  Comparing them: Cummins's permissiveness might be partially fixable by tightening "system capacity" criteria, but it'll always be perspective-dependent. Wright's exaptation issue cuts deeper - it challenges his fundamental link between function and historical explanation. 

  Neither repair seems fully satisfactory without borrowing: Cummins needs something like biological goals (which smell teleological/etiological), while Wright needs a way to privilege recent selection (which feels like ad-hoc adjustment). Wright's problem feels more structural - his theory's explanatory target is inherently historical, making new functions conceptually sticky. 

  Ultimately, Wright's account handles permissiveness better (by anchoring functions in selection), while Cummins's flexibility actually helps with exaptation (new roles are functions immediately if they contribute systemically). But neither cleanly solves both issues on their own terms.
answer: |-
  Here's a comparative analysis of Wright's etiological account and Cummins's causal-role account, focusing on their core mechanics and their handling of permissiveness (Cummins) and exaptation (Wright), while assessing reparability without borrowing rival resources:

  **Core Mechanics Recap:**

  1.  **Larry Wright (Selected-Effects/Etiological):**
      *   **Function Definition:** The function of a trait (X) in an organism (O) is *what X does* that *explains why X is there* (i.e., its current presence and typical form in O or its lineage).
      *   **Mechanism:** Explanation is grounded in *natural selection history*. X is there *because* it did F (or something sufficiently like F) in O's ancestors, and doing F conferred a survival/reproductive advantage, leading to X's propagation. Function F is the *selected effect*.
      *   **Explanatory Target:** Explaining the *existence/persistence* of the trait.

  2.  **Robert Cummins (Causal-Role/Systemic Capacity):**
      *   **Function Definition:** The function of a component (X) in a system (S) is its *causal contribution* to some *disposed capacity* (C) of S. We attribute function relative to an *analytical account* of how S's capacity C is realized by its components.
      *   **Mechanism:** Functional attribution is relative to:
          *   A chosen *system* (S) - e.g., an organism, an organ system, an ecosystem.
          *   A chosen *capacity* of that system (C) - e.g., pumping blood, circulating oxygen, diagnosing illness.
          *   A chosen *analytical account* explaining how S's components contribute causally to C.
      *   **Explanatory Target:** Explaining *how* a complex capacity of the system is *realized* or *exercised*.

  **Problem 1: Permissiveness in Cummins (The Heartbeat Sound)**

  *   **The Charge:** Relative to a system (e.g., "the diagnostic apparatus of a physician") and a capacity (e.g., "diagnosing cardiac conditions"), the sound produced by the heart (X) causally contributes (provides auditory information). Thus, on Cummins's mechanics, making sound *is* a function of the heart relative to *that* analysis.
  *   **Why it Arises Mechanically:** Cummins's theory has *no built-in constraints* on what counts as a legitimate system (S), capacity (C), or analytical account. Any causal contribution relative to *any* chosen analysis qualifies. Biology provides no privileged perspective within the theory itself.
  *   **Can it be Repaired Without Borrowing?**
      *   **Option 1 (Internal Constraint on S/C):** Stipulate that S must be a *biological system* (organism, organ, cell) and C must be a *biologically significant capacity* (survival, reproduction, development, etc.). **Problem:** This risks circularity or vagueness. What makes a capacity "biologically significant"? If it's "promotes survival/reproduction," we drift towards an etiological notion without the history. The theory itself lacks the resources to define this non-circularly.
      *   **Option 2 (Constraint on Analysis):** Require the analytical account to be the *best* or *most fundamental* explanation of the system's capacity. **Problem:** Cummins explicitly rejects privileging one analysis. "Best" by what standard? "Fundamental" often begs the question towards lower-level mechanisms or evolutionary history, again borrowing external resources.
      *   **Conclusion:** Repairing permissiveness *within* Cummins's framework is extremely difficult. The core mechanic – functional attribution relative to *any* chosen analysis – is the source of the permissiveness. Restricting S, C, or analysis without appealing to biological norms or history (external to the theory) seems arbitrary or impossible without collapsing into a rival view.

  **Problem 2: Exaptation in Wright (Feathers for Flight)**

  *   **The Charge:**
      1.  **Acquisition Speed:** When a structure (e.g., feathers initially for insulation) is co-opted for a new effect (e.g., aiding flight), Wright's schema seems to imply that this new effect (flight aid) becomes the function *as soon as* it starts contributing to fitness and becomes the reason the trait persists. But intuitively, significant selection may be needed to *explain* the trait's current form/presence *for flight*.
      2.  **Ancestral vs. Current Role:** After long co-option (e.g., modern bird feathers), is the function *only* flight, or also insulation? Wright's schema ("explains why it's there") doesn't specify *how much* historical explanation counts. Does the entire selective history matter, or only the most recent/maintaining selection?
  *   **Why it Arises Mechanically:** Wright's core mechanic ties function *directly* to the selective explanation for the trait's *current presence*. The problem is determining the *temporal scope* and *weighting* of that explanatory history.
      *   For a newly co-opted trait, *current* selection for the new effect (F-new) *is* explaining its persistence *now*. So, by the letter of the definition, F-new *is* a function.
      *   However, the trait's *form* may still be largely explained by the *ancestral* selection for F-ancestral. So, is F-ancestral *also* still a function? The definition ("explains why it is there") is ambiguous about whether "why it is there" refers to its *initial evolution*, its *current maintenance*, or some weighted combination.
  *   **Can it be Repaired Without Borrowing?**
      *   **Option 1 (Focus on Maintaining Selection):** Define function strictly as the effect for which the trait is *currently maintained* by selection. **Advantage:** Solves the acquisition speed and co-option problem cleanly for modern birds – flight is the function. **Problem:** Severely weakens the "explains why it's there" for traits whose form is a legacy of *past* selection no longer operating (vestigial traits become functionless instantly). It also struggles with traits maintained by selection *for multiple effects* (feathers for flight *and* insulation).
      *   **Option 2 (Weighted History/Proper Function):** Refine "explains why it's there" to mean the effect(s) that played the *dominant role* in shaping the trait's *current, species-typical form* (often called "proper function"). **Advantage:** Can handle vestigial traits (no current dominant effect shaping form) and acknowledge both history and current role. Feathers in modern birds: flight is the dominant shaper. **Problem:** "Dominant role" and "shaping current form" are vague. How much selection is needed? How do we weigh historical vs. current selection? This introduces complexity but *stays within* the etiological framework by focusing on the explanatory burden for the trait's form.
      *   **Conclusion:** Wright's account *can* be repaired internally to handle exaptation better, primarily by refining the temporal scope of the explanatory history (Option 1) or by focusing on the explanation for the trait's *current form* (Option 2). These repairs appeal *only* to selection history itself (current maintenance or weighted historical contribution to form), not to systemic capacities. They remain etiological.

  **Balanced Assessment & Which Handles Problems Better:**

  *   **Cummins's Permissiveness:** This is a deep, structural flaw arising from the theory's core relativism. Internal repairs seem impossible without smuggling in etiological or normative constraints. The problem fundamentally undermines the theory's ability to capture *biological* function specifically.
  *   **Wright's Exaptation:** While problematic, the issues stem more from ambiguity or under-specification *within* the etiological framework than a fundamental flaw in its core mechanic. Repairs focusing on "maintaining selection" or "explanation of current form" are feasible *using only the resources of selection history*. These repairs provide principled (if sometimes complex) ways to privilege new functions after co-option.
  *   **Overall Handling:** **Wright's account handles its core problem (exaptation) significantly better than Cummins handles its core problem (permissiveness).**
      *   Wright's problem can be addressed by clarifying and refining the *temporal scope* and *explanatory target* (current maintenance or form-shaping) of the selection history *already central* to the theory.
      *   Cummins's problem requires imposing external constraints on what counts as a legitimate system, capacity, or analysis – constraints that the theory itself lacks the resources to provide and which contradict its foundational relativism. Solving permissiveness requires abandoning a core tenet of the causal-role approach.

  Therefore, **Wright's etiological account, especially when refined to focus on the selective pressures maintaining the trait or explaining its current form, provides a more robust and internally repairable framework for defining biological function** in the face of these specific challenges. While exaptation requires careful handling, the tools for repair exist within the theory's commitment to selection history. Cummins's causal-role account, by its very design, struggles to exclude non-biological or intuitively accidental functions without borrowing concepts it explicitly rejects.
