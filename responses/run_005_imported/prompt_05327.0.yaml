answer: |-
  That's a brilliant question, and you've perfectly captured Lewis's core challenge to penal substitution (PS) – the **non-transferability of punishment** in human systems versus the apparent transferability of *debt*. Calvin *absolutely* had resources to respond, even if he didn't frame it in 20th-century analytic terms. His comeback wouldn't be a simple logical fix, but a robust theological framework that fundamentally recontextualizes the issue. Here's how he'd likely counter Lewis:

  1.  **Divine Sovereignty & the Nature of Divine Justice:** This is Calvin's bedrock.
      *   **God as Legislator and Judge:** Calvin emphasized that God isn't *bound* by human legal systems or analogies. Human punishment operates within human limitations and societal structures. Divine justice operates according to God's own perfect, holy, and sovereign will. What seems impossible or unjust *within a human framework* is not only possible but perfectly just *within the divine economy* because God defines justice itself.
      *   **God's Right to Appoint a Substitute:** Precisely because God is the ultimate Lawgiver and Judge, Calvin argued He has the inherent right and authority to determine *how* the penalty for sin is satisfied. If He, in His wisdom and mercy, ordains that the penalty can be borne by a willing, qualified substitute (Christ), then that act *is* just by definition. It's not subject to the limitations of human courtroom procedure. Lewis's analogy implicitly assumes human justice is the only model; Calvin rejects that premise.

  2.  **The Unique Qualification of Christ (The "Double Qualification"):** Calvin didn't see Christ as just *any* volunteer.
      *   **True God:** Christ shares the divine nature. His suffering has infinite value, capable of satisfying the infinite debt owed to infinite holiness. No mere human substitute could do this. This addresses the "quantity" problem Lewis hints at (can one person's finite punishment cover the sins of many?).
      *   **True Man:** Christ became fully human to represent humanity. He stood in our place *as one of us*. His humanity allows him to be our true representative and substitute. This wasn't an arbitrary transfer; it was a substitution within the same "species" under the law (humanity).
      *   **Voluntary Acceptance:** Calvin stressed Christ's willing obedience (Phil 2:8). He wasn't coerced; he actively embraced the role. This voluntary acceptance is crucial for Calvin in mitigating any sense of injustice in the transfer.

  3.  **The Centrality of Mystical Union:** This is arguably Calvin's *strongest* counter and where his response fundamentally differs from a simple debt analogy.
      *   **Not "Instead of Us" in Isolation, But "For Us" as Our Head:** Calvin didn't see PS happening in a vacuum. The substitution is effectual *only* because believers are **mystically united to Christ** by faith through the Spirit. Christ is the Head, believers are the body. His punishment becomes *ours* because we are incorporated *into him*. It's not a cold, external transaction like paying a stranger's debt; it's the Head bearing the penalty rightfully due to the members of his body. This union provides the ontological and relational basis for the transfer that Lewis finds puzzling in the abstract. The punishment *is* borne by the one who represents us *because* we are one with him.

  4.  **Forensic Justification *Through* Satisfaction:** Calvin tightly linked the legal declaration of "not guilty" (justification) to the actual satisfaction of justice.
      *   **The Satisfaction is Real:** Christ didn't just *represent* us in court; he actually *paid the penalty* demanded by God's justice. His suffering and death were the real punishment for sin.
      *   **Therefore, Acquittal is Just:** Because the penalty *was* fully paid (by Christ, the qualified substitute appointed by the Judge), God's declaration of righteousness for the believer is not a legal fiction, but a declaration grounded in actual justice satisfied. The debt *is* paid, so forgiveness *is* just.

  **Calvin's Probable Response to Lewis:**

  "Mr. Lewis rightly observes that in human courts, punishment cannot be transferred arbitrarily to a willing volunteer. But his analogy fails because he applies the limitations of *human* justice to the *divine* court. God is not constrained by our systems. As the sovereign Lord of justice, He possesses the authority to ordain how the penalty for sin is satisfied. He appointed His own Son, who is both truly God and truly man, to be the substitute. Christ, as God, could bear the infinite weight of divine wrath; as man, He could represent humanity. Crucially, this substitution is not arbitrary. It is effectual only for those who are united to Christ by faith. In this mystical union, Christ, the Head, bears the punishment rightfully due to His body, the Church. The penalty *was* fully exacted upon Christ; therefore, God's forgiveness of those in Him is perfectly just, for the debt is paid. To deny this possibility is to deny God's sovereign right over His own justice and the unique efficacy of Christ's person and work."

  **Was it a Blind Spot?**

  *   **Not exactly a "blind spot":** The *concept* of justice and substitution was absolutely central to Calvin and the Reformers. They wrestled deeply with *how* God could be just and the justifier (Rom 3:26). The *specific analytic framing* of transferability using contemporary philosophy of punishment wasn't on their radar, but the core theological tension certainly was.
  *   **Different Premises:** Calvin's response relies on theological premises Lewis doesn't necessarily share (divine sovereignty, the unique nature of Christ, mystical union, God's self-defined justice). Within Calvin's system, the "resources" are robust and provide a coherent answer *for those who accept the premises*. Lewis's challenge highlights that PS requires accepting these specific theological axioms about God, Christ, and salvation for it to make logical sense *as justice*. Calvin would argue those axioms are revealed truth, not philosophical conjecture.

  **Conclusion:** Calvin wouldn't see Lewis's objection as a fatal logical flaw, but as a category error applying human juridical limitations to God's transcendent justice. His strongest comebacks are **Divine Sovereignty** (God defines and administers justice) and **Mystical Union** (Christ bears the penalty *as* the Head of those united to Him, making the substitution relational, not merely transactional). For Calvin, PS isn't illogical; it's a profound mystery of divine justice and love operating on a plane above human analogies, made possible by the unique person and work of Christ and applied through union with Him. Whether one finds this *persuasive* depends on accepting Calvin's theological starting points.
