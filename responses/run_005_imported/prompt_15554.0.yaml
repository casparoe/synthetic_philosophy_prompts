prompt: |-
  For my comprehensive exams reading list, I've been working through Duhem and Quine on underdetermination, and it strikes me that the standard label "Duhem-Quine thesis" papers over some real differences between what the two of them actually argued. Could you compare their positions directly, focusing on (a) scope: Duhem seems to have confined his holism to physics and was skeptical it extended much further, whereas Quine's web of belief is meant to cover the whole of science, including logic; and (b) whether either of them thought this kind of underdetermination made theory choice non-rational, given that Duhem still invoked something like scientific "good sense" as an eventual tiebreaker. I'd also value your take on whether Quine's later, more technical treatment of underdetermination in terms of empirically equivalent systems of the world is a natural extension of Duhem's original argument, or whether it's doing something importantly different.
reasoning: |-
