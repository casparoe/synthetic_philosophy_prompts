answer: |-
  You're absolutely right—the label "Duhem-Quine thesis" often obscures significant philosophical differences. Both address underdetermination (the idea that empirical evidence alone cannot uniquely determine a theory), but their scope, implications for rationality, and technical development diverge substantially. Here's a direct comparison focusing on your points:

  ### (a) Scope: Physics vs. The Entire Web of Belief
  *   **Duhem (Holism Confined to Physics - Especially Theoretical Physics):**
      *   **Focus:** Duhem's holism (in *The Aim and Structure of Physical Theory*, 1906) arises directly from analyzing experimental physics. He argued that an experiment testing a theoretical hypothesis *never* tests that hypothesis in isolation.
      *   **Mechanism:** Testing requires auxiliary assumptions (instrumental theories, background conditions, mathematical formalisms). A failed prediction only falsifies the *entire conjunction* of the target hypothesis + auxiliaries. It doesn't pinpoint which element is wrong ("No crucial experiment").
      *   **Limitation:** Duhem was skeptical this holism applied beyond theoretical physics, especially to fields like physiology or chemistry, which he saw as more directly tied to observation and classification. He explicitly argued it did *not* apply to mathematics or logic. For Duhem, logic and mathematics provided a fixed, certain framework *within* which physics operated. His holism was **localized** to the testing of theoretical hypotheses within physical science.

  *   **Quine (Radical Holism - The Whole Web of Belief):**
      *   **Focus:** Quine ("Two Dogmas of Empiricism," 1951; *Word and Object*, 1960) generalized Duhem's insight into a fundamental epistemological principle: **confirmation holism**.
      *   **Mechanism:** Our beliefs confront experience not individually, but as an interconnected "web" or "field of force." At the periphery are sensory experiences; deeper inside are statements about physical objects; at the core lie logic and mathematics.
      *   **Radical Extension:** Crucially, *no* statement is immune to revision in principle. **Logic and mathematics are *within* the web**, not foundational guarantees outside it. Faced with recalcitrant experience, we *could* revise a logical law (like the law of excluded middle) instead of a physical hypothesis, though pragmatically we usually adjust statements closer to the periphery. Quine's holism is **total**, encompassing all of science, logic, and mathematics.

  ### (b) Rationality and Theory Choice: "Good Sense" vs. Pragmatic Virtues
  *   **Duhem (Scientific "Good Sense" as Rational Arbiter):**
      *   **Problem:** Underdetermination means logic alone cannot force a choice between competing hypotheses or bundles of hypotheses after a failed experiment.
      *   **Solution:** Duhem introduces the concept of "**good sense**" (*bon sens*) possessed by the ideal scientist. This is a form of practical wisdom or trained judgment.
      *   **Nature of "Good Sense":** It's not irrational intuition. Duhem describes it as relying on qualities like impartiality, intellectual honesty, reason, and a broad understanding of the field's history and goals. It allows scientists to weigh complex factors (simplicity, coherence, fertility, explanatory power) and eventually converge on the most reasonable choice, restoring **objectivity and rationality** to the process. Theory choice, while not deductively compelled, is guided by rational principles embodied in "good sense."

  *   **Quine (Pragmatism and the Erosion of Traditional Rationality):**
      *   **Problem:** Underdetermination is deeper and more pervasive for Quine, extending to the entire web. Further, his rejection of the analytic/synthetic distinction undermines any *sharp* line between empirical and non-empirical factors in justification.
      *   **Solution:** Theory choice becomes fundamentally **pragmatic**. We adjust the web to maximize overall simplicity, conservatism (minimizing change), generality, fecundity (fruitfulness for future inquiry), and agreement with sensory stimuli.
      *   **Nature of Choice:** While these "pragmatic virtues" guide choice, Quine is much more skeptical than Duhem about this process converging uniquely on a single "true" theory or being grounded in a unique rational standard like "good sense." Different weightings of pragmatic virtues *could* lead to different, equally empirically adequate systems. This introduces a significant element of **relativity** and suggests theory choice, while guided by reason, lacks the kind of robust, convergence-guaranteeing rationality Duhem envisioned. It's more about building an efficient conceptual tool for prediction than uncovering a unique metaphysical reality.

  ### Quine's "Empirically Equivalent Systems": Extension or Departure?
  Quine's later refinement (e.g., *On Empirically Equivalent Systems of the World*, 1975) is a **significant development beyond Duhem's original argument, doing something importantly different:**

  1.  **Beyond Saving Hypotheses:** Duhem focused on the *local* problem of revising a hypothesis bundle to *save* a theory from falsification after a failed prediction. Quine's empirically equivalent systems address the *global* possibility of **multiple, fundamentally different, yet observationally indistinguishable *total* theories** of the world.
  2.  **Stronger Underdetermination Claim:** Quine explicitly argues that for *any* empirically adequate theory of the world, there exist alternative theories that are:
      *   **Empirically Equivalent:** They imply exactly the same set of possible observations.
      *   **Logically Incompatible:** They cannot both be true descriptions of the world (e.g., one posits point particles, the other posits fields; one uses standard logic, the other uses a deviant logic).
  3.  **Technical Nature:** Quine uses formal tools (like proxy functions) to show how one can systematically construct such empirically equivalent but ontologically divergent alternatives to a given theory. This is a highly abstract, logical point about the structure of theories and their relation to evidence.
  4.  **Relationship to Duhem:** It's a **natural *extension* in spirit** (pushing underdetermination to its logical, global conclusion) but a **significant departure in kind**:
      *   Duhem's holism explains *why* falsification is ambiguous. Quine's empirically equivalent systems show *why* verification/confirmation is insufficient for uniqueness, even ideally and globally.
      *   Duhem was concerned with the *process* of testing and revising theories. Quine is making a deeper point about the *metaphysical implications* of empiricism – the possibility that science might *never* be able to decide between radically different ontologies, even with all possible evidence.
      *   Duhem likely never considered such radical global underdetermination. His "good sense" presumed convergence was possible within the fixed framework of physics and logic.

  **In Summary:**

  | Feature             | Duhem                                     | Quine                                       |
  | :------------------ | :---------------------------------------- | :------------------------------------------ |
  | **Scope of Holism** | **Localized:** Theoretical physics only   | **Radical/Global:** All science, logic, math |
  | **Theory Choice**   | Guided by rational **"Good Sense"**       | Guided by **Pragmatic Virtues**             |
  | **Rationality**     | **Convergence possible**, objective basis | **Relativity possible**, weaker objectivity |
  | **Core Concern**    | Saving theories from falsification        | Global underdetermination of ontology       |
  | **Later Quine (EES)** | **Extension** in radicalizing underdetermination, **Departure** in formalizing global, incompatible alternatives |

  Your instinct is spot-on: collapsing these distinct positions into a single "thesis" loses crucial nuance. Duhem offered a limited holism within physics, mitigated by rational "good sense." Quine radicalized holism to encompass all knowledge, eroded the analytic/synthetic distinction, and replaced unique rational convergence with pragmatic choice, culminating in the challenging idea of empirically equivalent but incompatible world systems. Quine's later work pushes underdetermination far beyond Duhem's original concerns into a profound epistemological and metaphysical problem. Good luck with your comps! This is excellent foundational material.
