  Now, Quine. He took holism further. His "web of belief" covers all knowledge, including logic and math. Everything is interconnected, and even logical laws can be revised if needed. For Quine, underdetermination is more radical. He argued that multiple theories can explain all possible evidence, making theory choice pragmatic rather than purely rational. He didn't have an equivalent to Duhem's "good sense," instead emphasizing pragmatic virtues like simplicity. Later, Quine introduced empirically equivalent systems, which are theories that predict the same observations but might be logically incompatible. This is a stronger claim than Duhem's, who probably didn't consider such cases.

  The user wants a direct comparison on scope and rationality. For scope: Duhem limited to physics; Quine included everything. For rationality: Duhem had "good sense" as a rational tiebreaker; Quine was more pragmatic. Also, the user asks about Quine's later work on empirically equivalent systems. Is that an extension of Duhem? Duhem focused on saving theories with auxiliary hypotheses, while Quine's later idea is about fundamentally different theories that can't be distinguished by evidence. That's a significant shift.

