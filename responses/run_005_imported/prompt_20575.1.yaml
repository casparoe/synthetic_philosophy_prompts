answer: |-
  That's a brilliant and deeply relevant question. Douglass's 1851 shift *does* prefigure modern textualism/originalism in fascinating ways, but dropping him into a modern courtroom would likely reveal significant, even fundamental, disagreements with how the philosophy is often applied today. Here's a breakdown of the overlaps and divergences:

  **Where Douglass & Modern Originalism/Textualism Would Likely Agree:**

  1.  **Primacy of the Text:** This is the core overlap. Douglass insisted the written words mattered more than individual framers' private opinions or prevailing customs. He famously argued the words "slave" or "slavery" were deliberately avoided, using terms like "persons held to service" instead. This echoes Scalia's mantra: "The text is the law, and it is the text that must be observed." Both reject interpreting based on perceived "spirit" divorced from the words or evolving societal values (Living Constitutionalism).
  2.  **Skepticism of Framers' "Secret Intentions":** Douglass explicitly rejected arguments based on what Madison or others *might* have privately intended about slavery. He focused on what the document *said*. Modern originalism, particularly "Original Public Meaning" (OPM) originalism championed by Scalia and now dominant, also downplays subjective framers' intent in favor of how the words would have been understood by the public at the time of ratification. They'd agree: "What did the words mean to the people who ratified it?" is the key question, not "What was Madison thinking in his notes?"
  3.  **Rejection of Precedent/Custom Sanctifying Injustice:** Douglass argued that centuries of pro-slavery custom and court decisions didn't change the Constitution's *true* meaning. He saw them as corruptions. Similarly, modern originalists often challenge longstanding precedents they believe misinterpret the original meaning (e.g., *Roe v. Wade*, though outcomes differ wildly from Douglass's goals). Both assert that error, even long-standing, doesn't create legitimacy.
  4.  **Formal Equality Before the Law:** Douglass's reading emphasized provisions like the Privileges and Immunities Clause, the guarantee of a Republican form of government, and the Preamble's goals to argue for inherent equality. Modern originalists also emphasize formal equality and procedural guarantees found in the text, though often with very different interpretations of what that entails.

  **Where Significant Daylight Exists & Why Douglass Would Likely Part Ways:**

  1.  **The Centrality of the Preamble & Aspirational Language:** This is the **biggest divergence**. Douglass gave the Preamble ("establish Justice, insure domestic Tranquility, secure the Blessings of Liberty") enormous weight. He saw it as the Constitution's "polar star," providing context and purpose for interpreting the specific clauses. He argued the specific compromises *had* to be read in light of these overarching goals of liberty and justice. Modern originalists (especially textualists) are deeply skeptical of using the Preamble as an operative legal tool. Scalia called it a "handshake" without legal force. They focus narrowly on the operational clauses, often dismissing broad aspirational language as non-justiciable rhetoric. Douglass would see this as gutting the Constitution's soul and enabling the very compromises he fought against to override its core purpose.
  2.  **The Moral Imperative & Teleology:** Douglass's textualism was driven by an unshakeable moral imperative: the abolition of slavery and the establishment of Black equality. His interpretation was teleological – aimed at achieving the Constitution's highest promise of liberty. Modern originalism often presents itself as a neutral, amiable methodology, divorcing interpretation from desired outcomes. However, critics argue its application is frequently outcome-driven towards conservative results. Douglass would reject the *pretense* of neutrality. For him, the text *demanded* a pro-liberty outcome. He would likely see originalist rulings that restrict rights (e.g., voting rights, birthright citizenship debates) as betraying the text's purpose, just as the *Dred Scott* decision did.
  3.  **The Treatment of the Reconstruction Amendments:** Douglass lived through and championed the 13th, 14th, and 15th Amendments. He saw them as radically transforming the Constitution, fulfilling the Preamble's promise and overriding the original compromises. He would interpret these amendments broadly as establishing national citizenship, equal protection, and voting rights as core constitutional principles. Many modern originalists engage in a form of "two-step originalism": applying OPM rigorously to the Reconstruction Amendments but sometimes interpreting their scope narrowly or focusing intensely on perceived limitations intended by *their* framers (e.g., debates about the "privileges or immunities" clause being limited only to certain rights, or narrow readings of the 15th Amendment's enforcement power).
  4.  **Specific Cases: Where He'd Likely Object:**
      *   **Shelby County v. Holder (2013):** Originalists (Roberts) argued the preclearance formula was outdated because it was based on 40-50-year-old data, violating the "principle of equal sovereignty" of states (a concept not explicitly in the text but inferred from structure/history). Douglass would be apoplectic. He would see the VRA as precisely the kind of robust enforcement of the 15th Amendment's promise he fought for. He'd argue the text of Section 2 ("Congress shall have power to enforce this article by appropriate legislation") grants broad, ongoing power to Congress to address *evolving* forms of racial discrimination in voting. Relying on "equal sovereignty" (a concept used to defend slavery/secession) to strike down a core civil rights protection would confirm his worst fears about courts prioritizing structure over substance and liberty.
      *   **Birthright Citizenship (14th Amendment):** Douglass was a fierce advocate for the 14th Amendment. He would unequivocally support birthright citizenship ("All persons born... in the United States, and subject to the jurisdiction thereof, are citizens") as written. He would reject arguments based on the intent of the framers to exclude children of undocumented immigrants or Native Americans (as some originalists have suggested), pointing to the clear, inclusive text and the Amendment's fundamental purpose of establishing national citizenship based on birth on US soil, overturning *Dred Scott*.
      *   **Substantive Due Process:** This is complex. Douglass might be skeptical of some modern substantive due process rights (like abortion) if he couldn't find a strong textual anchor beyond the Due Process Clause itself. However, he *did* believe in fundamental rights derived from natural law and the Constitution's purpose. He might find common ground with originalists who locate rights in the Privileges or Immunities Clause (which he valued highly) rather than Due Process, but he would likely be more expansive about *what* those fundamental rights are (including bodily autonomy and equality) than many conservative originalists.

  **Conclusion: Shared Method, Divergent Purpose & Soul**

  Douglass would recognize the *methodological* core of modern textualism/originalism – the focus on the text's public meaning over subjective intent or custom. He might even find common cause in specific textual arguments against government overreach.

  **However, he would likely reject it as practiced today for two overarching reasons:**

  1.  **The Demotion of the Preamble and Purpose:** He would see the refusal to give the Constitution's aspirational goals (Justice, Liberty) operative legal weight as a fatal flaw, enabling narrow readings that perpetuate injustice, just as the original compromises did. His textualism was inherently purposive.
  2.  **Outcomes vs. Liberty:** He would see too many modern originalist decisions (like *Shelby County*) as using textual fidelity and historical analysis to achieve outcomes that restrict liberty and equality, particularly for marginalized groups – the *opposite* of his life's mission. He used the text as a sword for liberation; he would perceive modern originalism too often wielded as a shield for the status quo or even regression on issues of racial justice and voting rights.

  **Your Best Guess:** Douglass would see the modern originalist project as a sophisticated, robe-clad version of the *misreading* he fought against in the 1850s. He would acknowledge the shared emphasis on the text itself but vehemently reject the philosophy's frequent sidelining of the Constitution's overarching purpose of liberty and justice, and its application in cases that undermine the hard-won guarantees of the Reconstruction Amendments. He would likely argue that modern originalism, in crucial instances, has become the *new* "covenant with death and agreement with hell" for civil rights, betraying the text's true "glorious liberty" potential.
