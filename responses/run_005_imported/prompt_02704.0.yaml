  Hi! For my seminar on vagueness I want to give students a dialogue instead of another summary article. Could you write one between an epistemicist (think Williamson) and a supervaluationist (think Kit Fine or Rosanna Keefe) that focuses specifically on higher-order vagueness -- i.e., whether either view actually manages to avoid just relocating the sorites problem one level up (to 'definitely F') instead of solving it. I want them to really engage with each other's strongest moves -- margin-for-error vs. the worry that the space of admissible precisifications is itself vague and regresses -- not just restate their own first-order story about ordinary vagueness. Keep them evenly matched, no strawmanning either side, and make sure they're actually responding to what the other just said rather then talking past each other.
