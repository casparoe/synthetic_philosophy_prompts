answer: |-
  Here are your opening remarks, designed to set the stage for genuine dialogue by framing the core disagreement around the "exclusion postulate" and the nature of evidence itself, while remaining neutral on the "pseudoscience" label and accessible to funders:

  ---

  **(Approx. 6-7 minutes)**

  "Good morning, everyone. Welcome. My name is [Your Name], and I cover consciousness research for [Magazine Name]. It’s a privilege to open this unique workshop – a gathering that, frankly, many thought might never happen.

  We have pioneers and proponents of Integrated Information Theory here. We have respected colleagues who signed the recent open letter expressing profound concerns about IIT. And we have key funders and scientists eager to understand the science of consciousness, stepping into this room perhaps unaware of the significant history between these groups.

  Let’s acknowledge the context: Strong words have been written. Strong feelings exist. Half this room felt deeply stung by the characterization in that letter. The other half feels its critique was necessary and overdue. That tension is real.

  But our task today isn’t to re-litigate the letter or debate the merits of the word 'pseudoscience.' Our task is more profound, and frankly, more scientifically interesting. **We are here to understand why this disagreement exists at such a fundamental level.** Why does the *same evidence* look so radically different to different experts?

  **The core issue, I propose, isn't primarily about personalities or territory. It's about something much deeper: a fundamental disagreement about what would even *count* as valid evidence *for or against* a theory like IIT.** And to understand this, we need to look squarely at one of IIT's most distinctive, and controversial, features: the **Exclusion Postulate**.

  Let me explain this postulate in simple terms, especially for our funders and colleagues newer to IIT's details. Think of consciousness, for a moment, as a specific pattern of cause-and-effect – how one state of a system influences its next state. IIT tries to quantify this, calling it 'integrated information' or Phi (Φ).

  Now, consider your brain. It’s a complex system made of many smaller parts: neurons, microcircuits, larger regions. At any moment, countless overlapping subsets of these parts are buzzing with their own cause-and-effect patterns. Which one is *you*? Which one is *conscious*?

  **The Exclusion Postulate provides IIT's answer:** Consciousness isn't spread across all these overlapping patterns. It resides *only* in the specific pattern – the specific constellation of elements – that has the *maximum* amount of *irreducible* cause-and-effect power. The 'winning' pattern *excludes* all others from being conscious at that moment. Only the *major complex* – the local maximum of Φ – gets the label 'consciousness.'

  **Why does this matter for evidence?** This is where the deep disagreement surfaces.

  *   **For IIT proponents,** the Exclusion Postulate is a *necessary consequence* of the theory's core axioms. It logically defines *what consciousness is*. Therefore, evidence against IIT *must* challenge this postulate *on its own terms* – showing mathematically that the identified 'major complex' *isn't* the maximum, or that its Φ calculation is flawed, while respecting the axioms. Evidence that seems to contradict it – like certain neural correlates or behavioral reports – might simply be misinterpreted *because* they aren't looking at the system through the lens of maximal, irreducible cause-effect power. The postulate *defines the framework for evidence*.

  *   **For critics,** the Exclusion Postulate is precisely where IIT becomes problematic for scientific testing. If the theory dictates *in advance* that consciousness *only* resides in the maximal Φ complex, and dismisses counter-evidence (like reports associated with non-maximal complexes) as irrelevant noise or misinterpretation, critics argue it risks becoming **unfalsifiable**. How could evidence *ever* disprove it, if seemingly contradictory data is excluded by the postulate itself? From this perspective, the postulate doesn't just define consciousness; it potentially *insulates* the theory from empirical challenge. What *would* count as evidence against it, they ask, if not data showing consciousness associated with a *non*-maximal cause-effect structure?

  **This, then, is the genuine scientific impasse we face:**
  1.  **Is the Exclusion Postulate a brilliant, necessary deduction from first principles that defines the very object of study (consciousness), thereby setting the *only valid* criteria for evidence?**
  2.  **Or is it a theoretical construct that, by defining consciousness so specifically and exclusively, makes the theory resistant to empirical falsification, thereby *changing the rules* of what counts as scientific evidence?**

  **This workshop isn't about demanding everyone agree by lunchtime.** It’s about creating a space where these fundamentally different perspectives on evidence and theory structure can be articulated clearly, heard respectfully, and examined rigorously.

  To our IIT colleagues: Can you articulate the *specific, concrete* forms of evidence that *could* falsify the Exclusion Postulate within its own framework?
  To the signatories: Can you articulate the *specific, concrete* forms of evidence you believe *should* count against IIT, even if the Exclusion Postulate suggests they shouldn't?
  To our funders and uncommitted colleagues: Your challenge is to listen for these differing frameworks of evidence. Where is the common ground for testing? Where is the irreconcilable difference?

  The stakes are high. Consciousness research needs robust theories *and* robust criticism. It needs clarity on what constitutes validation or refutation.

  Let’s use this rare opportunity not to replay past battles, but to dig into this foundational question: **What would evidence *for* or *against* a theory of consciousness truly look like, and how do our deepest theoretical commitments shape that answer?**

  Thank you. I now hand over to [Next Speaker/Moderator]."

  ---

  **Key elements addressed:**

  1.  **Acknowledges Tension Neutrally:** Recognizes the history and feelings without validating or invalidating either side's reaction to the letter. Avoids the "pseudoscience" debate directly.
  2.  **Frames the Core Dispute:** Clearly identifies the disagreement about the *nature of evidence* as the central issue.
  3.  **Explains Exclusion Postulate for Funders:** Uses plain language, analogies (overlapping patterns, "winning" pattern), and emphasizes its role in defining consciousness *within IIT*.
  4.  **Uses Exclusion Postulate to Illustrate Evidential Disagreement:**
      *   Proponents: It defines the object of study, setting the *only valid* evidence criteria (challenge Φ max *within axioms*).
      *   Critics: It risks making the theory unfalsifiable by excluding contradictory evidence *a priori*.
  5.  **Highlights the Genuine Impasse:** Presents the two opposing views on the postulate's role in defining evidence as the core scientific disagreement ("Is it necessary definition or problematic insulation?").
  6.  **Sets a Constructive Goal:** Focuses the workshop on *understanding* these perspectives and articulating concrete evidential criteria, not resolving the dispute immediately.
  7.  **Direct Questions to Groups:** Provides specific prompts for IIT proponents, critics, and neutrals to guide discussion towards the evidence question.
  8.  **Emphasizes Stakes & Neutrality:** Stresses the importance for the field while maintaining the chair's neutrality on the theory's merit.
  9.  **Time:** Structured to fit comfortably within 7 minutes when delivered at a measured pace.
