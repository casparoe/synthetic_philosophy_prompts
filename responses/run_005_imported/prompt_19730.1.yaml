answer: |-
  This is a *fantastic* and perceptive question that cuts to the heart of both UDT and dynamic choice theory. The surface similarity between McClennen's "resolute choice" and UDT's "commit to a policy upfront" is undeniable, but digging deeper reveals crucial differences in motivation, problem domain, and the nature of the commitment itself. The analogy is insightful but ultimately limited. Let's break it down:

  **1. The Surface Analogy: Commitment Against Temptation**

  *   **McClennen (Resolute Choice):** Arises in dynamic choice problems (e.g., sequential Allais paradox). Preferences violate Expected Utility (EU) axioms (like Independence). The agent faces a predictable future temptation to deviate from the initially optimal plan. Being "sophisticated" means foreseeing this deviation and choosing a suboptimal path *now* to avoid the later mistake. Being "resolute" means committing *now* to the overall optimal plan and *sticking to it* later, even though the "momentary self" at the later node, applying EU locally, prefers to deviate. The justification is that deviation undermines the achievement of the agent's own (non-EU) preferences over the whole sequence. Commitment is temporal.
  *   **UDT (Updateless Decision Theory):** Arises in problems involving logical uncertainty, acausal/counterfactual correlations, and multiple copies/instances of the agent (e.g., Counterfactual Mugging, Newcomb's Problem, Parfit's Hitchhiker). The core issue is that *updating on observations* (like "I didn't get the $1M in Newcomb") can destroy the correlation between the agent's decision and the state of the world/copy. UDT says: *don't condition on the observation you just made when deciding*. Instead, choose a *policy* (a function mapping *all possible observations* to actions) *before any observations occur* that maximizes expected utility *according to your prior*. You then follow this policy slavishly. The "temptation" is to update and take the seemingly locally optimal action based on the observation ("I see no box, so I take one box" in Newcomb; "Omega didn't ask me, so I don't pay" in Mugging). Commitment is *epistemic/logical* (pre-observation).

  **2. Does UDT Need Non-EU Preferences? The Crucial Divergence**

  *   **McClennen's Core Motivation:** **Dynamic Inconsistency due to Non-EU Preferences.** Resolute choice is *primarily* a response to violations of the Independence Axiom (or similar) that lead to predictable dynamic inconsistency *even under objective risk/probability*. The justification for commitment is to achieve the *outcome* the agent truly prefers *over the whole sequence*, which their moment-by-moment EU-maximizing selves would sabotage.
  *   **UDT's Core Motivation:** **Preserving Acausal Influence & Handling Logical Uncertainty.** UDT's commitment is *not* driven by violations of standard EU axioms *over outcomes*. An agent with standard EU preferences over final outcomes faces a problem: standard conditioning ("updating") breaks the logical/acausal link necessary for their decision to influence counterfactual worlds or copies. UDT's "updatelessness" is a *technical fix* to maintain these links and correctly reason about logical correlations and counterfactuals where standard causal influence is absent. The justification is *instrumental rationality*: achieving the *actual* best outcome *in your world* by ensuring your decision is correlated with the desired state in counterfactual worlds/copies.
      *   **Key Point:** UDT agents *can* have perfectly standard EU preferences over final outcomes. The "deviation" they resist isn't based on a momentary preference shift due to non-EU structure, but on *misinformation* introduced by updating. The "in the moment" self is *mistaken* about the consequences of its action because updating destroyed the correlation. UDT sticks to the policy *to avoid this mistake*, not because its preferences are non-separable. UDT is sophisticated *about logical correlation*, not naive about dynamic inconsistency.

  **3. The Nature of the Commitment: "Plan" vs. "Policy" and the Role of the Prior**

  *   **McClennen (Plan):** The "plan" is a sequence of actions contingent on temporal stages (e.g., "Don't gamble at T1; If I gambled and lost at T1, don't gamble at T2"). The commitment is to ignore the local EU calculation at T2 based on the *state* reached at T2 (e.g., "I'm poor now, so I'll gamble"), because that calculation doesn't reflect the *overall* non-EU preference.
  *   **UDT (Policy):** The "policy" is a function mapping *any possible observation/input* to an action. Crucially, this includes observations that are *logically correlated* with the state the agent cares about *before* the observation is made (e.g., Omega's presence/absence in Mugging, the contents of Box B in Newcomb). The commitment is to ignore the *information content* of the observation *for the purpose of deciding the action*.
  *   **The Gap: The Prior and Logical Uncertainty:** This is where the analogy stretches thin. McClennen's resolute chooser operates in a world of known (or subjectively probabilistic) states and temporal dynamics. The "whole plan" is defined relative to a known decision tree.
      *   UDT's commitment is defined relative to a **prior over logically possible worlds**, which includes worlds where the agent exists in different copies, or where logical facts are true/false. This prior *encodes* the agent's uncertainty about logical facts and its own location/copy status. The "updateless" aspect means the policy is chosen *before* this logical uncertainty is resolved by observation, maximizing expected utility *under this prior*.
      *   The "gap" is vast: UDT's commitment isn't just "stick to the temporal plan," it's "evaluate actions *as if* you haven't yet received any information that might correlate with the logical facts determining the outcomes of your actions." This is a response to a fundamentally different kind of uncertainty (logical vs. empirical/temporal) and a different kind of correlation (acausal/logical vs. causal/temporal). The "prior" in UDT is doing heavy lifting that has no direct analogue in McClennen's deterministic or probabilistically risky sequential choices.

  **Conclusion: Structural Similarity, Substantive Difference**

  *   **Analogy Holds (Structurally):** Both concepts involve precommitting to a course of action defined before certain events unfold and then refusing to deviate based on local calculations that seem optimal "in the moment" but would undermine the global goal. Both reject "sophisticated" adjustment as self-defeating in their respective contexts.
  *   **Analogy Breaks (Substantively):**
      *   **Motivation:** McClennen tackles dynamic inconsistency arising from *non-EU preferences* under risk/uncertainty. UDT tackles *logical uncertainty, acausal correlation, and preserving counterfactual influence* for agents with standard EU preferences over outcomes.
      *   **Core Problem Domain:** McClennen: Temporal sequential choice with known (or probabilistic) states. UDT: Logical uncertainty, counterfactuals, acausal coordination between identical/correlated agents.
      *   **Nature of Commitment:** McClennen: Temporal commitment against dynamic inconsistency of preferences. UDT: *Epistemic* commitment ("updatelessness") against losing logical correlation/counterfactual influence. The "policy" is a mapping over logical possibilities defined by a prior, not just temporal stages.
      *   **Role of Preferences:** Non-EU preferences are *essential* to McClennen's justification for resolute choice. Standard EU preferences over final outcomes are *compatible* with (and often assumed by) UDT; its commitment is a technical maneuver for correct reasoning under logical uncertainty/correlation.

  **Your Verdict:** You are right to be torn. The analogy is profound and highlights a deep structural similarity in how both theories handle self-defeating reasoning. However, UDT is **not** simply resolute choice repackaged for logical uncertainty. UDT's core innovation and necessity stem from the unique challenges of logical correlation, counterfactual influence, and reasoning without updating – challenges that don't exist in McClennen's dynamic choice framework and don't require non-EU preferences. The "updateless prior" commitment addresses a fundamentally different problem than the "stick to the temporal plan" commitment, even though both involve resisting local temptation for global gain. UDT is doing genuinely "totally different work" motivated by the peculiarities of its problem domain.
