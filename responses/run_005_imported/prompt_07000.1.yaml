prompt: |-
  ok so I TA for a social choice theory seminar as part of my econ PhD, and we've got a guest speaker coming who's spent her whole career defending Harsanyi's aggregation theorem as basically THE axiomatic foundation of utilitarianism. I'm putting together questions for the student Q&A and really dont want it to just be her restating the theorem for 40 minutes. can you draft like 7-8 questions that press on the actual weak spots -- I want at least one on Sen's old conflation charge (that plugging vNM utility in as the interpersonal currency quietly mixes up risk attitude with welfare), one built around Diamond's ex-ante/ex-post coin flip problem, and one on why the theorem only gets you weighted utilitarianism and not the classical equal-weights kind. for each one throw in a quick follow-up anticipating whatever dodge she'll reach for first.
reasoning: |-
  Okay, the user is a PhD student TAing a social choice seminar with a guest speaker who's a staunch defender of Harsanyi's theorem. They need sharp questions targeting the theorem's weaknesses to avoid a repetitive session. 

  First, let's unpack what they're really after. Beyond the stated request, they're probably worried the speaker will default to textbook defenses instead of engaging with critiques. The mention of "dodges" suggests they've seen this pattern before. 

  Hmm, the three requested focus areas are spot-on: Sen's conflation charge is about misinterpreting vNM utility as welfare, Diamond's critique exposes tension between ex-ante/ex-post fairness, and the weighting issue challenges egalitarianism. But we should add depth - maybe include the empirical/revealed preference angle and the "why not prioritarianism?" angle too. 

  For Sen's critique, the key is forcing confrontation between vNM scaling and interpersonal comparison. The speaker might retreat to "preferences reveal welfare," so the follow-up needs to challenge that directly with Sen's welfare-risk entanglement example. 

  Diamond's paradox is perfect because it pits Harsanyi against fairness intuitions. Predictable dodge: "but the theorem doesn't claim to handle fairness." Counter: Then why present it as sufficient for utilitarianism when fairness is central to the tradition? 

  Weighting question must preempt the "just add symmetry" move. Need to emphasize that the axioms themselves don't demand equality - it's an external imposition. 

  *scribbles structure* 
  Lead with conflation (Sen), then fairness (Diamond), then weighting, then: 
  - Add a question on empirical measurability (vNM in lab vs real welfare) 
  - One on why not prioritarianism since vNM is cardinally measurable anyway 
  - Close with "what would falsify this for you?" to prevent circular defenses. 

  Follow-ups should act like fencing parries - anticipating where they'll pivot. Example: If they say "vNM utilities are all we can observe," the welfare-risk entanglement counterexample lunges right at that. 

  *checks list* 
  That's 7 solid questions. User's clearly done their homework - they name-dropped specific critiques correctly. This level of precision deserves equally surgical questions. No fluff.
answer: |-
  Here are 8 targeted questions (+ follow-ups) designed to press on Harsanyi's weak spots, prepping you for likely dodges. Each targets a core critique while respecting the speaker's expertise:

  1.  **Sen's Conflation Charge (vNM Utility ≠ Welfare):**
      *   **Question:** "Harsanyi's theorem interprets vNM utility functions as the interpersonal welfare currency. But Sen famously argued that vNM utilities conflate an individual's *attitude towards risk* with their *fundamental welfare levels*. Doesn't this mean the theorem risks basing social welfare on ethically irrelevant factors like risk aversion, rather than pure well-being?"
      *   **Anticipated Dodge:** *"vNM preferences reveal true welfare under uncertainty; risk attitude *is* part of welfare."*
      *   **Follow-Up:** "If we accept that, doesn't it imply that a highly risk-averse person experiencing identical *outcomes* as a risk-neutral person must be assigned a *lower welfare level* simply due to their fear of uncertainty? How is that a defensible interpersonal comparison for classical utilitarianism?"

  2.  **Diamond's Ex-Ante/Ex-Post Critique (Fairness vs. Efficiency):**
      *   **Question:** "Diamond's critique highlights a conflict between ex-ante Pareto (used by Harsanyi) and ex-post fairness. In the two-person, one-life-saving-treatment scenario with a fair coin, Harsanyi mandates giving the treatment to the ex-ante expected utility maximizing person (effectively choosing one deterministically), rejecting the coin flip. Doesn't this sacrifice a basic intuition of *ex-post fairness* (each has a 50% chance) on the altar of ex-ante Pareto? Isn't this a major limitation for the theorem as a *complete* foundation for social ethics?"
      *   **Anticipated Dodge:** *"The theorem specifies what's required *given* the axioms. Fairness concerns might require adding other principles."*
      *   **Follow-Up:** "But doesn't admitting that Harsanyi's axioms alone *mandate* rejecting the fair procedure in Diamond's case significantly weaken the claim that it provides *the* axiomatic foundation for utilitarianism? Classical utilitarians like Mill cared deeply about fairness – doesn't Harsanyi's solution here seem alien to that tradition?"

  3.  **The Weighting Problem (Why Not Equal Weights?):**
      *   **Question:** "The theorem concludes that social welfare is a *weighted* sum of individual vNM utilities. Yet classical utilitarianism demands *equal* consideration of interests. What within Harsanyi's axioms *forces* equal weights? Doesn't the reliance on the specific vNM scaling of individual utilities and the Pareto principle only get us to *some* weighted sum, leaving the crucial egalitarian component entirely external to the theorem?"
      *   **Anticipated Dodge:** *"We can add a symmetry/anonymity axiom to get equal weights."*
      *   **Follow-Up:** "Precisely. Doesn't this highlight that Harsanyi's core theorem is fundamentally *compatible* with *inegalitarian* weighted utilitarianism? If the core 'foundation' requires *adding* a distinct symmetry axiom to achieve classical utilitarianism, doesn't that symmetry axiom bear the primary ethical weight for egalitarianism, not Harsanyi's original axioms?"

  4.  **vNM Utility as a Measurable Welfare Proxy:**
      *   **Question:** "Operationalizing Harsanyi requires actually measuring vNM utility functions. Given the profound challenges in empirically eliciting stable, consistent vNM preferences (especially under large stakes), and the sensitivity of the resulting scaling to the choice of gambles, how confident can we be that we're capturing interpersonally comparable *welfare* rather than just noisy, context-dependent risk attitudes?"
      *   **Anticipated Dodge:** *"Revealed preference is the best we have; we work with the data we can observe."*
      *   **Follow-Up:** "But if the measured vNM functions are demonstrably sensitive to framing effects, probability assessment biases, or the specific gambles used for elicitation, doesn't this inject significant arbitrariness into the resulting social welfare weights and the interpersonal comparisons underpinning the utilitarian sum?"

  5.  **The "Why Not Prioritarianism?" Challenge:**
      *   **Question:** "Harsanyi delivers *linear* aggregation. Yet, if we accept that vNM utilities provide a cardinal, interpersonally comparable measure of welfare (despite Sen's concerns), why should social welfare be *linear* in these utilities? Why wouldn't a *concave* transformation – prioritizing gains for the worse off (Prioritarianism) – be at least as justifiable, especially since Harsanyi's axioms don't rule it out? Doesn't the linearity assumption smuggled in via the Pareto principle beg the question against prioritarian intuitions?"
      *   **Anticipated Dodge:** *"The Pareto principle under uncertainty (and IIA) necessitates linearity."*
      *   **Follow-Up:** "But doesn't this mean Harsanyi's utilitarianism rests heavily on the acceptability of *strong ex-ante Pareto*? If we find Diamond's critique persuasive – that ex-ante Pareto can conflict with compelling ex-post fairness principles – doesn't that undermine the inevitability of linear aggregation?"

  6.  **Conflation vs. Non-Comparability (A Double-Barreled Question):**
      *   **Question:** "Critics attack Harsanyi from two sides: Sen argues vNM utilities *conflate* welfare and risk attitudes, while others (like Robbins) argue interpersonal utility comparisons are *meaningless*. How does Harsanyi's approach definitively overcome *both* challenges? Doesn't using vNM utilities risk solving the comparability problem only by potentially misidentifying the thing being compared?"
      *   **Anticipated Dodge:** *"vNM provides a rigorous, operational basis for cardinal, comparable utility, overcoming Robbins."*
      *   **Follow-Up:** "But if Sen is right that this 'utility' isn't pure welfare, haven't we overcome Robbins' non-comparability objection only at the cost of comparing the *wrong thing*? Are we comparing apples (welfare) or oranges (risk-welfare composites)?"

  7.  **The Scope of "Rationality":**
      *   **Question:** "Harsanyi builds social rationality directly from individual rationality axioms (vNM). But is it valid to assume that principles governing *individual* rational choice under risk (like the independence axiom) should directly constrain *social* rational choice? Aren't the ethical considerations relevant to social aggregation fundamentally different in kind from those governing an individual's prudent gambling?"
      *   **Anticipated Dodge:** *"Rational social choice must respect rational individual preferences."*
      *   **Follow-Up:** "Doesn't Diamond's case show that respecting individual *ex-ante* preferences (via Pareto) can lead to a socially irrational (unfair) outcome? Doesn't this suggest social rationality requires principles *beyond* mere aggregation of individual rational choice axioms?"

  8.  **The Burden of Proof:**
      *   **Question:** "Given the significant critiques – Sen's conflation, Diamond's fairness conflict, the weighting ambiguity, measurement challenges – what empirical observation or ethical intuition, if demonstrated true, would lead you to conclude that Harsanyi's theorem *fails* as *the* foundation for utilitarianism? What, in your view, would falsify this claim?"
      *   **Anticipated Dodge:** *"The critiques misunderstand or misapply the theorem; it stands as a logical truth given its premises."*
      *   **Follow-Up:** "If the theorem is seen as primarily a logical derivation from its premises, doesn't that shift the debate entirely onto the *acceptability of the premises themselves* (like strong ex-ante Pareto, interpreting vNM as welfare, ignoring fairness)? Doesn't calling it '*the* foundation' overstate the case, as alternative foundations start from different, arguably more ethically transparent premises?"

  **Key Tactics for the Q&A:**

  *   **Phrase Respectfully:** Use "Professor X", "Harsanyi's important contribution...", "I'm struggling with...".
  *   **Listen & Pivot:** If her answer genuinely addresses the follow-up preemptively, acknowledge it and move to the next question or a deeper layer. Don't rigidly stick to the script.
  *   **Control the Frame:** If she tries to restate the theorem, gently but firmly redirect: "Thank you, that's helpful clarification. To focus on the *implications* of that point, my question was specifically about [Critique X]..."
  *   **Deploy Follow-Ups Judiciously:** Use them if the initial answer dodges or is insufficient. Sometimes letting one point breathe is better than rapid-fire.
  *   **Empower Students:** Encourage *them* to ask variations or press follow-ups based on her responses.

  This set forces engagement with the deepest philosophical and technical cracks in the Harsanyi edifice while anticipating the standard defenses. Good luck!
