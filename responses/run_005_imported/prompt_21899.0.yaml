  I'm a phil PhD student working on peer disagreement (Elga/Christensen-type stuff), and Aumann's agreement theorem keeps coming up as this formal result that everyone in the lit cites but nobody really knows what to do with. I've been meaning to turn the common prior assumption into a short story for ages but I have zero fiction skills, so can you take a crack at it? Basic idea: two characters, both established as fully rational, who keep openly trading their probability estimates on some question, but the numbers just refuse to converge no matter how much they talk - which per Aumann's theorem shouldnt be possible if they really share a prior and their estimates become common knowledge between them. I want the "why won't this converge" thing to actually drive the plot (someone lying about their number, a hidden leak of info, or maybe it ends with the realization that two people never really shared a prior to begin with, whatever that would even mean). setting/characters are up to you, just don't make it a generic "these two just see the world differently" story - the actual mechanics of the theorem should be doing real work. ~800 words is fine, no need to explain the theorem itself to the reader.
