answer: |-
  That's an astute question that cuts to the heart of decision theory. The mathematics behind the Kelly criterion *is* compelling for repeated bets, but the persistence of expected value (EV) elsewhere isn't simply inertia. There are several principled reasons why geometric expectation isn't the universal default:

  1.  **The "Repeated Bets" Assumption is Critical:**
      *   **Kelly's Domain:** Kelly rigorously maximizes long-term growth *only* under specific conditions: identical, independent bets repeated *infinitely* (or very many times) with reinvestment of all winnings/losses ("compounding"), and known/accurate probabilities + edge.
      *   **One-Off Decisions:** Many economic and EA decisions are *not* repeated identical bets. They are unique, irreversible choices (e.g., building a dam, funding a specific research project, launching a unique product). Geometric growth maximization doesn't directly apply when there's no sequence to compound over. EV is a natural measure for the *single-shot* outcome.
      *   **Non-Identical Bets:** Life involves sequences of *different* opportunities with varying risks and returns. While multi-asset Kelly extensions exist, they are complex and require strong assumptions about the joint distribution of future opportunities – assumptions rarely met outside gambling/financial models.

  2.  **Utility Functions & Risk Aversion:**
      *   **Kelly Implies Logarithmic Utility:** Maximizing geometric growth is *equivalent* to maximizing the expected value of *logarithmic utility* (E[log(Wealth)]). Kelly betting is the optimal strategy *only* for an agent whose utility is exactly the log of wealth.
      *   **Other Utility Functions:** Humans and institutions often have different risk preferences. They might be:
          *   **More Risk-Averse:** Preferring lower volatility and lower risk of ruin, even at the cost of lower long-term growth (e.g., preferring fractional Kelly). EV calculations can be easily adapted to any concave utility function (U(Wealth)).
          *   **Less Risk-Averse (or Risk-Seeking) in Specific Contexts:** E.g., a venture capitalist might accept negative geometric expectation on individual bets if the potential upside is massive and fits a portfolio strategy, prioritizing arithmetic EV of the *portfolio* over geometric growth of each bet.
          *   **Focusing on Absolute Outcomes:** Philanthropy (like EA) often cares about the total expected good achieved (arithmetic sum of impact), not necessarily the compounded growth rate of a "impact bankroll," especially for existential risks or unique opportunities.

  3.  **Estimation Risk & Robustness:**
      *   **Kelly is Fragile:** Kelly betting is notoriously sensitive to errors in estimating the true probability and edge. Overestimating your edge by even a small amount can lead to disastrous over-betting and significantly increased risk of ruin ("gambler's ruin"). Fractional Kelly (betting a fraction of the full Kelly amount) is often used as a practical hedge against estimation error.
      *   **EV is More Robust (Perceptionally):** While EV is also sensitive to input errors, the *consequences* of overestimation are often perceived as less catastrophic in non-betting contexts (e.g., you build a slightly less profitable factory) compared to betting your entire bankroll and going bust. EV also integrates more easily with sensitivity analysis under uncertainty.

  4.  **Bankruptcy Risk & Finite Horizons:**
      *   **Kelly Minimizes Ruin Probability *Asymptotically*:** For infinite repetitions, full Kelly betting asymptotically minimizes the probability of ruin *for a given growth rate*. However:
          *   **Finite Time:** Over a finite number of trials, even full Kelly has a non-zero probability of ruin. More risk-averse actors (or those with finite time horizons) cannot tolerate this.
          *   **Absolute Ruin is Unacceptable:** In many contexts (personal finance, running a business), going to zero wealth is catastrophic and must be avoided *at all costs*. EV maximization with constraints (e.g., VaR - Value at Risk) or using utility functions that heavily penalize low wealth states is more practical.

  5.  **Liquidity, Consumption, and Externalities:**
      *   **No Consumption:** The pure Kelly model assumes no withdrawals for consumption or other needs. Real agents need to consume.
      *   **External Shocks & Correlations:** Real-world sequences involve unpredictable external events (job loss, medical emergencies, market crashes) that correlate risks in ways not captured by simple independent bet models. Diversification and safety margins become paramount, often prioritized over pure geometric growth.
      *   **Non-Fungible "Bankrolls":** In EA or policy, the "resource" being bet isn't always perfectly fungible money. It might be political capital, researcher time, or public trust, where geometric growth concepts don't cleanly apply.

  6.  **Practical Implementation & Psychology:**
      *   **Volatility:** Full Kelly betting often involves high volatility. Most individuals and institutions have a lower tolerance for large drawdowns than the Kelly strategy implies.
      *   **Behavioral Biases:** Humans struggle psychologically with the large bet sizes Kelly sometimes demands and the significant drawdowns it inevitably experiences.
      *   **Institutional Constraints:** Banks, funds, and NGOs operate under regulations, mandates, and risk management frameworks that often explicitly limit position sizes based on risk capital or other metrics incompatible with pure Kelly sizing.

  **Why Expected Value Persists (Outside Repetitive Betting):**

  *   **The Default for Single-Shots:** For unique decisions, EV is the most straightforward measure of the "average" outcome.
  *   **Flexibility:** EV integrates naturally with diverse utility functions (E[U(X)]), allowing it to model various risk preferences.
  *   **Robustness to Model Misspecification (in some contexts):** While sensitive to inputs, the *form* of EV calculation is less sensitive to the specific sequence structure than geometric mean calculations.
  *   **Tractability:** Calculating EV is often simpler than geometric mean optimization, especially in complex models with many interdependent variables.
  *   **Focus on Total Impact:** In philanthropy and many policy contexts, the primary concern is the *total expected good* achieved across different interventions or time periods (an arithmetic sum), not necessarily the compounded growth rate of the resources used to achieve it.

  **Conclusion:**

  The Kelly criterion is a profound and essential insight **for its specific domain: optimal capital growth under repeated, identical, independent bets with known probabilities and full reinvestment.** It brilliantly demonstrates why maximizing arithmetic EV alone can be ruinous in that context.

  However, it is **not** a universal theory of rationality. The survival of expected value calculation elsewhere is **not merely inertia.** It's because:

  1.  Most real-world decision sequences don't satisfy Kelly's strict assumptions (identical, independent, infinite, known probabilities, full reinvestment).
  2.  Agents have diverse risk preferences (utility functions) beyond log(wealth).
  3.  Estimation error makes pure Kelly dangerously fragile.
  4.  Bankruptcy risk is unacceptable over finite horizons.
  5.  Real-world constraints (consumption, liquidity, external shocks, non-fungible resources) break the pure compounding model.
  6.  Single-shot decisions inherently favor an EV-like analysis.

  Geometric rationality is a powerful lens, especially for repeated gambles or long-term investment strategies where compounding is central. But expected value, often augmented with utility functions and constraints, remains the more general and flexible framework for modeling rational choice under uncertainty across the vastly diverse scenarios encountered in economics, finance, and effective altruism. **The key is matching the decision rule to the structure of the problem and the preferences of the agent.** Kelly dominates for optimal *repeated betting growth*; EV (often with utility) provides a broader framework for other contexts.
