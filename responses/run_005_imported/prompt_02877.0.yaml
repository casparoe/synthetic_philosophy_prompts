  I should also address why Ramsey introduced Bliss. Without it, maximizing utility over infinite time doesn't work mathematically. Bliss provides a reference point. But the user is spot-on in noticing that minimizing shortfall might prioritize the near term, similar to discounting. However, the key difference is that this prioritization comes from the utility function's curvature (diminishing returns) rather than a time-based discount factor.

  The user might be conflating two issues: the ethical principle against discounting and the practical modeling challenges. Highlighting that Ramsey separates these helps clarify his position. His ethical claim is about not devaluing future generations purely because they're in the future. The Bliss method avoids this, while the discount rate in Section II is a separate, descriptive model.

