answer: |-
  Here’s a robust defense of option (b), grounded in the **unsustainability of non-truth-conditional approaches under embedding** and a **principled rationale for limiting Adams' Thesis**:

  ---

  ### **I. The Core Problem with Non-Cognitivism: Embedding as a Structural Failure**
  Adams/Edgington’s view treats "if A, B" as a *conditional assertion*: it asserts B *under the supposition A*, but lacks truth conditions. While elegant for simple conditionals, this collapses under embedding. The issue isn’t "cosmetic"—it **undermines the compositional semantics of natural language**, making the logic of conditionals inexpressible or paradoxical.

  #### **Concrete Embedding Problems:**
  1. **Negation**:  
     - Consider *"It is not the case that if A, B"* (e.g., "It’s not true that if it rains, the match is canceled").  
     - On Adams’ view, this should *reject* the conditional assertion of B given A. But what probability should we assign to this negation?  
       - If conditionals lack truth values, we cannot define P(¬(A→B)) as 1−P(A→B).  
       - Adams suggests such negations express *high P(A∧¬B)*, but this conflates ¬(A→B) with (A∧¬B). Yet intuitively, "It’s not true that if you strike the match, it lights" can be true even if you never strike it (e.g., if the match is defective).  
     - **Cost**: Non-cognitivism cannot distinguish ¬(A→B) from A∧¬B, violating intuitive judgments.

  2. **Conditionals in Antecedents**:  
     - Consider *"If (if A, B), then C"* (e.g., "If the vase breaks if dropped, then it’s fragile").  
     - On Edgington’s account, the antecedent "if A, B" is not a proposition, so it cannot *be* supposed. She treats this as a *conditional conditional*: "Given A, B; and given that, C." But what is "given that"?  
     - **Problem**: The probability of the whole cannot be computed as P(C | P(B|A)=1) or similar, since P(B|A) is not a proposition. Attempts to define nested probabilities (e.g., P(C | [A→B])) are ad hoc and risk regress.

  3. **Disjunctions**:  
     - *"(If A, B) or (if C, D)"* (e.g., "Either if it rains, the match is canceled, or if the wind is strong, the roof collapses").  
     - Without truth values, disjunction cannot be a Boolean operator. Adams treats this as an instruction to *infer* B if A, or D if C. But what if A and C are incompatible? The probability of the disjunction becomes undefined or must be stipulated (e.g., as max[P(B|A), P(D|C)]?), but this lacks justification.  

  **Why this is a *serious* cost**: Embedding is pervasive in reasoning (e.g., law, ethics, everyday arguments). Non-cognitivism fragments the semantics: simple conditionals follow Adams’ Thesis, but embeddings require new, disconnected rules. This violates compositionality—the bedrock of semantic theory—and makes the logic of conditionals *incoherent* for real-world use.

  ---

  ### **II. Truth-Conditionals + Weakened Thesis: A Principled Response**
  Lewis’ triviality shows that *if* conditionals express propositions *and* Adams’ Thesis holds *universally* (across all probability distributions), then P(B|A) must equal P(B), trivializing conditionals. Horn (b) avoids this by weakening the Thesis in two key ways:

  #### **A. Stalnaker’s Restriction: Contextual Stability**  
  Stalnaker assigns truth conditions: *A→B* is true iff B holds in the "closest A-world". Adams’ Thesis (P(A→B) = P(B|A)) holds **only when the selection function (choosing the "closest" world) is stable under conditionalization**.  
  - **Principled rationale**: The Thesis fails precisely when new evidence *alters the context* defining "closeness."  
    - *Example*: Initially, P(¬B|A) is low, so P(A→B) is high. But after learning C, the "closest A-world" might shift to one where B is false. Thus, P(A→B) ≠ P(B|A) *after conditionalizing on C*.  
  - **Why non-ad-hoc**: Context dependence is inherent to modality (e.g., counterfactuals). Indicative conditionals are contextually shifty too—so it’s principled that P(A→B) updates *non-monotonically*.

  #### **B. Jackson’s Robustness: Pragmatic Rescue**  
  Jackson retains truth conditions (à la Stalnaker) but relocates the link to conditional probability to *assertibility*: We assert *A→B* only if P(B|A) is high *and robust* (stable under learning ¬A).  
  - **Principled rationale**: The Thesis *appears* true because robustness screens assertions—but it’s not part of truth conditions.  
    - *Example*: "If I press ‘detonate’, the bomb explodes." I’d assert this only if P(explosion | press) is high *even if* I learn I won’t press it (e.g., because I know the wiring is reliable).  
  - **Where Thesis fails**: When P(B|A) is high but fragile (e.g., P(B|A) drops if we learn ¬A). Here, P(A→B) may be high, but we won’t *assert* it—explaining why Adams’ Thesis *seems* true in practice but isn’t.

  ---

  ### **III. Why (b) is Preferable: Coherence Over Collapse**
  1. **Embedding is solved**: Truth-conditional semantics handles negation, disjunction, and nested conditionals via standard compositionality.  
     - ¬(A→B) is true iff A→B is false (i.e., in the closest A-world, ¬B holds).  
     - (A→B) → C reduces to evaluating C in worlds where A→B holds.  
     *No special rules needed*.

  2. **The cost of weakening Adams’ Thesis is bounded**:  
     - Stalnaker: Failure occurs only under *context shift*—a pre-theoretically plausible limitation.  
     - Jackson: Thesis holds for *assertible* conditionals, preserving its role in communication.  
     - *Contrast*: Non-cognitivism’s embedding problem is *unbounded*—it requires reinventing logic.

  3. **Empirical adequacy**: Truth-conditional accounts explain why we *reason* with conditionals as if they have truth values (e.g., in *modus ponens*). Non-cognitivism must reinterpret this as a "mirage."

  ---

  ### **Conclusion: Paying the Lesser Debt**
  Lewis’ triviality forces a choice: **sacrifice compositionality** (non-cognitivism) or **contextualize Adams’ Thesis** (truth-conditionalism). The embedding problem shows that non-cognitivism’s cost is catastrophic—it fractures semantics and cannot model real reasoning. By contrast, weakening the Thesis within a truth-conditional framework (via Stalnaker’s context-relativity or Jackson’s pragmatics) is a *principled concession*: it isolates the failure to cases where context or assertion dynamics naturally intervene. This preserves logic, compositionality, and the *phenomenology* of Adams’ Thesis—without inviting triviality. In short: (b) repairs a leak in the boat; (a) abandons the boat entirely.
