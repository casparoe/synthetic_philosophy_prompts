answer: |-
  That's an excellent question that cuts to the heart of Dummett's conceptual tightrope walk. Let's break down whether Sweden's 2015 experience would likely qualify as "submersion" under Dummett's own strict criteria, or if he'd find principled reasons to exclude it:

  **Dummett's Core Criteria for "Submersion" (from *On Immigration and Refugees*):**

  1.  **Existential Threat to National Character:** Not mere change, but the *effective destruction* of the nation's core political institutions, cultural identity, and linguistic continuity.
  2.  **Loss of Democratic Self-Determination:** The influx must be so overwhelming and rapid that the existing citizenry loses its ability to democratically govern itself according to its established traditions and values.
  3.  **"Utterly Overwhelming" Numbers:** He emphasizes this requires numbers so vast and rapid that assimilation or mutual adaptation becomes impossible, leading to the *replacement* of the existing society, not its enrichment or evolution.
  4.  **"Extremely Limited Application":** He explicitly states this right would *not* be triggered by levels seen in late 20th-century Britain (or, by extension, levels common in most developed nations historically).

  **Applying Dummett's Criteria to Sweden 2015:**

  1.  **Scale vs. "Utterly Overwhelming":**
      *   **160,000 in one year (1.6% of population):** While unprecedented in Sweden's modern history and a significant logistical challenge, 1.6% is a long way from the "utterly overwhelming" scale Dummett implies. Historical examples he might have considered (e.g., mass displacements after wars, the Huguenot expulsion into neighboring countries) often involved much larger relative influxes over shorter periods into smaller territories. Even cumulatively, Sweden's foreign-born population remained well below 20% in subsequent years – not a majority, let alone a supermajority that could unilaterally impose a new political/cultural order.
      *   **Dummett's Likely View:** He'd likely argue that while large and challenging, 1.6% doesn't meet the threshold of being "utterly overwhelming" in a nation of 10 million with robust institutions. The *perception* of being overwhelmed doesn't equate to the *reality* of submersion as he defines it.

  2.  **Threat to Democratic Institutions & National Character:**
      *   **Institutions:** Sweden's democratic institutions (parliament, courts, local government) functioned throughout and after 2015. Policy changes occurred *through* the democratic process (e.g., temporary border controls, tighter asylum rules), demonstrating the system's resilience and adaptability, not its collapse or replacement.
      *   **Language:** Swedish remained the undisputed official and dominant language of government, education, business, and public life. No credible threat to its status emerged.
      *   **Cultural Identity:** Swedish culture and traditions (Midsommar, Lucia, fika, specific social norms) continued to be practiced widely by the native-born population and many immigrants. While diversity increased and debates about integration intensified, there was no wholesale *replacement* of Swedish cultural frameworks. Swedish history, literature, and civic values remained central to public education and discourse.
      *   **Dummett's Likely View:** He would almost certainly argue that Sweden in 2016 or 2023 remained fundamentally Sweden. Its political system was intact, its language dominant, and its core cultural identity persistent, even if evolving. The *pace* of change caused strain, but not the *kind* of existential transformation his criteria demand.

  3.  **Loss of Self-Determination:**
      *   Swedish citizens continued to vote, form governments, debate policies, and shape laws through their established democratic processes. The asylum seekers of 2015, once granted status, became a small minority within the electorate. The native-born population retained decisive democratic control over national direction.
      *   **Dummett's Likely View:** The democratic "self" of Sweden was stressed but not "submerged." Policy responses demonstrated the system's ability to react and recalibrate based on the electorate's will.

  **Conclusion: Dummett's Concept vs. Thatcher's Line**

  *   **It Likely Would NOT Qualify:** Based on his explicitly stated, extremely high-bar criteria focused on *existential replacement*, Sweden 2015 would almost certainly **not** have met Dummett's definition of "submersion." The numbers, while large, weren't "utterly overwhelming" enough to destroy institutions, language, or core identity. Democratic self-determination persisted.
  *   **The Concept DOES Philosophical Work (for Dummett):** Your suspicion is astute – the numbers *are* big, and the political/social impact *was* significant. However, Dummett's framework *deliberately* sets the threshold so astronomically high that it serves a specific philosophical purpose:
      1.  **Anti-Xenophobic Safeguard:** It explicitly rejects the conflation of *change*, *challenge*, or even *significant demographic shift* with *existential destruction*. This directly counters the rhetoric of figures like Thatcher, who used "swamped" to evoke fear based on far lower levels of immigration.
      2.  **Protecting the Very Idea of Open Borders (in theory):** By making the "right not to be submerged" almost impossible to invoke in practice within stable democracies, Dummett clears the ground for much stronger moral arguments for open borders and refugee protection. The "submersion" right acts only as a last-resort theoretical brake, not a routine justification for restriction.
      3.  **Focusing on Justice:** It forces the debate away from vague fears of cultural change towards concrete questions about the *justice* of exclusion and the *duties* of wealthy, stable nations towards the vulnerable.
  *   **Why it Doesn't Collapse into Thatcherism:** Thatcher's "swamped" invoked a sense of cultural dilution, loss of control, and national decline triggered by relatively modest numbers. Dummett's "submersion" requires near-total societal collapse and replacement – a scenario akin to conquest or catastrophic depopulation followed by mass repopulation. The qualitative difference in the *kind of threat* described is fundamental to his argument. He dismisses Thatcher precisely because her scenario *didn't* meet his criteria, even in her own time.

  **In essence:** Dummett's "right not to be submerged" is a philosophical firewall. He constructs it to be practically unusable in contemporary contexts (like Sweden 2015 or Britain in Thatcher's era) precisely to prevent it from being misused as a justification for restrictive policies based on fear of change rather than a genuine, demonstrable existential threat. Its value lies in its theoretical existence setting an absolute (but nearly unreachable) limit, thereby strengthening the case for openness under real-world conditions. Sweden 2015 was a severe stress test, but under Dummett's framework, it was stress, not submersion.
