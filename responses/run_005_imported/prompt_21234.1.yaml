prompt: |-
  I'm a PhD student in formal epistemology and the graduate student representative on my university's academic integrity panel. This term our AI-writing detector flagged 60 of the 1,400 essays submitted for a large lecture course, each assigned a 93% likelihood of being AI-generated by a tool whose own calibration data show it is wrong about 7% of the time at that threshold -- comfortably above the panel's usual "more likely than not" standard, yet implying that four or five of the 60 flagged students are probably innocent, with nothing in any individual file telling us which. Half the panel wants to sanction everyone flagged, since each file clears our standard on its own merits; the other half won't approve sanctions it is confident will wrongly catch several actual students. Draft the decision memo I'll circulate before we vote on this batch: it should recommend sanctioning all, sanctioning none, case-by-case re-review, or some other policy, and the reasoning should seriously engage the strongest argument against whichever option you choose rather than simply restate the per-case probability.
reasoning: |-
  Okay, let me approach this PhD student's request methodically. The user needs a decision memo draft for their academic integrity panel that addresses a statistical dilemma - 60 flagged essays with 93% AI probability, but known 7% false positive rate. 

  First, I consider the core tension: applying a "more likely than not" standard (51% probability) to individual cases versus group-level certainty that some are innocent. The 93% individual probability clearly meets their usual threshold, but mathematically guarantees false positives in this batch. 

  I weigh four options:
  1. Sanction all: Legally defensible per case but morally problematic knowing innocents will be punished
  2. Sanction none: Avoids wrongful punishment but undermines the integrity system entirely
  3. Case-by-case review: Appeals to fairness but practically impossible without new evidence
  4. Group-level decision: Acknowledges the statistical reality but may set uncomfortable precedent

  The strongest counterarguments need addressing:
  - For sanctioning all: The panel would knowingly punish innocent students
  - Against sanctioning none: It rewards cheaters and invalidates the detector
  - Case review's futility: No new information exists to distinguish cases
  - Group approach: It departs from individual assessment tradition

  I recall legal parallels like statistical discrimination cases, but note academic integrity isn't criminal law. The memo should emphasize that while individual probability meets their standard, group error requires exceptional handling. 

  Ultimately I recommend against sanctions in this batch while proposing systemic reforms:
  1. Immediate transparency about the statistical dilemma
  2. Future procedural changes (lower thresholds, human reviews)
  3. Treating this as a calibration exercise rather than punitive action

  The reasoning must show we've seriously engaged the math: 93% true positive rate implies about 4 false positives in 60, making group sanction ethically untenable despite individual probabilities. This preserves integrity while acknowledging the tool's limitations.
answer: |-
  **MEMORANDUM**  
  To: Academic Integrity Panel Members  
  From: Graduate Student Representative, PhD (Formal Epistemology)  
  Date: 15 October 2023  
  Subject: Recommendation re: Batch of 60 AI-Flagged Essays (PHIL 101)  

  ### I. Background  
  - 1,400 essays submitted; 60 flagged by AI detector at 93% likelihood threshold.  
  - Detector calibration: 7% false positive rate (FPR) at this threshold (i.e., 93% true positive rate).  
  - Panel’s standard: "More likely than not" (>50% probability of violation).  
  - Statistical implication: While each flagged case *individually* meets our standard (93% > 50%), we expect ~4–5 false positives (7% of 60) in this batch.  
  - No case-specific evidence distinguishes true/false positives.  

  ### II. Options & Analysis  
  **Option 1: Sanction All 60**  
  *Pros*:  
  - Matches our per-case probabilistic threshold (93% >> 50%).  
  - Upholds consistency with past decisions.  
  - Deters AI misuse.  
  *Strongest Counterargument*:  
  - **We knowingly sanction innocent students**. With 93% sensitivity, we expect 4–5 students submitted original work but face penalties (e.g., failing grades, disciplinary records). This violates foundational fairness and the principle *in dubio pro reo* ("when in doubt, for the accused").  

  **Option 2: Sanction None**  
  *Pros*:  
  - Avoids punishing innocent students.  
  - Acknowledges systemic uncertainty.  
  *Strongest Counterargument*:  
  - **Fails to hold 55–56 guilty students accountable**, undermining academic integrity and incentivizing AI fraud. Our threshold is met, so inaction signals the detector is unusable.  

  **Option 3: Case-by-Case Re-Review**  
  *Pros*:  
  - Avoids blanket decisions.  
  *Strongest Counterargument*:  
  - **Futile without new evidence**. Re-review duplicates initial efforts; no qualitative features distinguish false positives. "Re-review" is performative absent additional data.  

  **Option 4: Reject Batch-Level Sanctions (Recommended)**  
  - **Recommendation: Do not sanction any student in this batch**.  
  - **Reasoning**:  
    - While individual probabilities meet our standard, *group-level error* creates moral risk incompatible with educational justice. Sanctioning all 60 maximizes expected utility *if* false positives carry no cost—but they do. Penalizing innocents (Type I errors) is ethically graver than excusing guilty parties (Type II errors) in academia.  
    - **Engaging the strongest counterargument**: Yes, this allows ~55 guilty students to avoid sanctions, weakening deterrence. *However*, this outcome stems from detector limitations—not panel failure. Applying sanctions despite *known* false positives institutionalizes probabilistic injustice. Our mandate is truth-seeking, not algorithmic appeasement.  
  - **Mitigation**:  
    1. **Transparency**: Notify all 60 students of the flag, explain the detector’s uncertainty, and issue warnings.  
    2. **Policy Reform**: Revise standards for batch processing (e.g., require human-verifiable evidence for sanctions, or use detectors only for probable cause).  
    3. **Calibration**: Reject the 93% threshold; set a 99%+ bar for AI sanctions until FPR nears 0%.  

  ### III. Ethical Foundation  
  Formal epistemology distinguishes *individual* vs. *aggregate* rationality. At the individual level, 93% justifies action. At the aggregate level, sanctioning 60 cases with a known 7% FPR is *expectably unjust*. We cannot privilege statistical convenience over the categorical imperative to avoid wrongful punishment.  

  ### IV. Voting Procedure  
  - Vote: ☐ Sanction All ☐ Sanction None ☐ Re-review (Specify Method: ________)  
  - Deadline: 22 October 2023.  

  **Recommended Vote: ☐ Sanction None** (with policy reforms in Sec. II.4).  

  ---  
  *Appendices*:  
  - Detector calibration data (attached).  
  - False positive risk table (see below).  

  | Students Flagged | Expected True Positives | Expected False Positives |  
  |------------------|-------------------------|--------------------------|  
  | 60               | 56                      | 4                        |  

  This memo prioritizes justice over procedural efficiency. I urge rejecting sanctions in this unique statistical scenario while reforming protocols to prevent recurrence.  

  Respectfully submitted,  
  [Your Name]  
  Graduate Student Representative
