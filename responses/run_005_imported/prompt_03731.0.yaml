prompt: |-
  This term I've been teaching a graduate seminar on the philosophical foundations of probability, and a session on Chapter IV of Keynes's Treatise on Probability turned into an argument among the students that I still haven't resolved to my own satisfaction. Keynes devotes much of that chapter to showing that the Principle of Indifference collapses once it is applied to continuous quantities, and the most famous of his examples, borrowed from Bertrand, is the problem of a chord drawn "at random" in a circle and the probability that it is longer than the side of the equilateral triangle inscribed in that circle. He lays out the same three constructions that later became famous — fix one endpoint and randomize the chord's direction; fix the direction and randomize the chord's distance from the centre; randomize the chord's midpoint over the area of the disc — gets a different answer from each, and then, much later in the chapter, diagnoses the trouble: each construction implicitly treats the chord as the limit of a different shrinking area, "a triangle, the length of the base of which tends to zero" in the first case, a thin parallelogram in the second, and "a central section of undefined shape" in the third. Nothing in the bare instruction "choose a chord at random," he concludes, tells us which of these shapes we are entitled to shrink to the limit, so the question as posed has no determinate answer — and this, for Keynes, is symptomatic of a general defect in applying the Principle to any magnitude that cannot be resolved into what he calls "indivisible" alternatives.

  Some fifty years after Keynes wrote this, E. T. Jaynes proposed a very different diagnosis of the very same problem in his 1973 paper "The Well-Posed Problem." Jaynes, too, held that the problem as ordinarily stated is underdetermined, but he argued that once you specify an actual physical procedure for producing the chord and then require the resulting probability distribution to be invariant under whatever translations, rotations, and rescalings that procedure leaves unfixed, a unique answer is forced on you — one that happens to coincide with Keynes's second construction, giving a probability of one half. Jaynes drew a general moral from this: appeals to indifference are not hopeless for continuous magnitudes, provided the requirement of symmetry is imposed on the right object, namely the transformation group implicit in the physical set-up, rather than on the space of outcomes directly.

  I would like you to reconstruct, arguing strictly from the resources of Keynes's own chapter, how he would most plausibly have judged Jaynes's proposal. Does the demand for invariance under a transformation group supply exactly the kind of principled, evidence-based way of "proceeding to the limit" whose absence Keynes thought was fatal to the Principle in cases like this — so that Jaynes essentially vindicates the restricted, non-arbitrary version of indifference reasoning that Keynes himself was groping toward? Or would Keynes have insisted that the choice of which transformation group to privilege is just as unforced by the evidence as the choice among his own three constructions, so that Jaynes has only relocated the arbitrariness rather than removed it? Please commit to one of these two verdicts, or to some precise intermediate position, rather than simply cataloguing considerations on both sides, and defend your answer by engaging closely with the actual structure of Keynes's reasoning.
reasoning: |-
  Okay, I need to tackle this query about how Keynes would respond to Jaynes's solution to Bertrand's paradox. Let me start by understanding the core arguments from both sides.

  Keynes's main point in Chapter IV is that the Principle of Indifference fails for continuous quantities because different parameterizations lead to different probabilities. In the chord example, three methods give probabilities of 1/2, 1/3, and 1/4. Keynes attributes this to each method implicitly using a different infinitesimal shape (triangle, parallelogram, undefined section) when shrinking to the limit. He thinks the problem is underdetermined without specifying which geometric entity to use.

  Jaynes, however, introduces transformation groups. By requiring invariance under rotations, translations, and scaling, he derives a unique solution—the 1/2 probability. He argues that physical procedures imply symmetries that resolve the ambiguity.

  Now, the user wants to know if Keynes would see Jaynes's approach as solving the problem or just relocating the arbitrariness. I recall Keynes's distinction between "indivisible" alternatives (discrete) vs. continuous cases. He insists that continuous parameters require a privileged parameterization, which the Principle of Indifference doesn't provide. 

  Keynes explicitly rejects symmetry as a sufficient criterion. He discusses rotational invariance but points out that it doesn't help choose between methods. For example, fixing an endpoint and randomizing direction is rotationally invariant but gives 1/2, while randomizing the midpoint over the area (which is also invariant) gives 1/4. So symmetry alone doesn't pick one method.

  Jaynes adds scale invariance, which Keynes didn't consider. But would Keynes accept that? Keynes's critique is deeper: he thinks no amount of formal symmetry can justify a parameterization without evidence about the physical setup. For him, the transformation group choice is still arbitrary without empirical input. 

  Also, Keynes emphasizes that the Principle of Indifference applies only to ultimate indivisibles. In continuous spaces, we need to define these indivisibles correctly, but different geometries imply different indivisibles. Jaynes's invariance doesn't address this metaphysical point; it just imposes formal constraints.

  So, Keynes would likely argue that Jaynes relocates the arbitrariness to the choice of transformation group. Without evidence about the actual chord-generating process, privileging certain symmetries is still unforced. Keynes's requirement for evidence-based parameterization isn't met by symmetry alone.
answer: |-
  Based on a close reading of Keynes's Chapter IV, particularly his analysis of the Bertrand paradox and his broader critique of the Principle of Indifference for continuous magnitudes, Keynes would **insist that Jaynes's transformation group approach merely relocates the arbitrariness rather than removes it**. He would argue that the choice of which transformation group to privilege is *itself* unforced by the bare evidence of the problem statement ("choose a chord at random"), replicating the core defect he diagnosed. Here's the reconstruction of Keynes's likely rebuttal, grounded in his own reasoning:

  1.  **Keynes's Core Diagnosis: The Need for a Principled "Shape" for Infinitesimals:** Keynes's fundamental insight (pp. 51-55, 75-80) is that applying the Principle of Indifference to continuous parameters requires specifying *how* the continuous magnitude is to be conceived as the limit of a discrete set of indivisible alternatives. Each of his three chord constructions corresponds to a different geometric conception of the "element" being randomized:
      *   **Endpoint Fixed:** The chord is the limit of triangular areas (base = chord direction angle).
      *   **Direction Fixed:** The chord is the limit of thin parallelogram areas (height = perpendicular distance from center).
      *   **Midpoint Randomized:** The chord is the limit of undefined central sections (area = locus of midpoints).
      The paradox arises because "nothing is specified as to *how* the chord is to be taken" (p. 53), leaving the choice among these incompatible limiting shapes undetermined. The Principle of Indifference fails because it lacks a criterion for selecting the "correct" parameterization defining the indivisible alternatives.

  2.  **Jaynes's Proposal: Relocating the Choice:** Jaynes replaces the direct application of indifference to outcomes with indifference to the *transformations* (rotations, translations, scalings) left unspecified by the physical generating mechanism. Invariance under the relevant transformation group selects a unique measure. While this resolves the ambiguity *given a specific group*, Keynes would immediately question the justification for *that* group.

  3.  **Keynes's Rebuttal: The Transformation Group Choice is Equally Unforced:**
      *   **"At Random" Doesn't Specify Symmetries:** Keynes explicitly states that the bare instruction "at random" provides *no evidence* about the physical procedure or its symmetries: "We have no knowledge which would justify us in preferring one method of choosing the chord to another" (p. 53). Jaynes assumes that "at random" *implies* invariance under the Euclidean group (rotations, translations) and scaling. Keynes would retort that this is precisely the *unwarranted assumption* his paradox exposes. Why not invariance under projective transformations? Or conformal mappings? Or under transformations preserving the chord's length? The problem statement offers *no evidence* favoring one symmetry group over another.
      *   **Rotational Invariance Alone Doesn't Resolve It:** Keynes anticipates the appeal to rotational symmetry. He notes that his first construction (fix endpoint, randomize direction) *is* rotationally invariant (around the fixed point), yielding P=1/2. His third construction (randomize midpoint over the disc) *is also* rotationally invariant (around the center), yet yields P=1/4 (pp. 53-54). This directly shows that rotational invariance *does not* uniquely determine the measure or resolve the paradox. Jaynes avoids this by *adding* scale invariance – but Keynes would argue this addition is arbitrary without evidence. Why scale invariance? Is a "random chord" in a circle defined independently of the circle's size? The problem statement doesn't say. Imposing scale invariance is an *additional*, unsupported assumption about the generating mechanism.
      *   **Privileging "Physical Procedures" Requires Evidence Keynes Lacks:** Jaynes grounds the transformation group in the "actual physical procedure." Keynes would agree that *if* we knew the physical procedure (e.g., throwing sticks, drawing lines from a random point), we *might* have evidence for a specific symmetry (e.g., rotational symmetry for a circular target, scale invariance only if the thrower's distance scales with the circle). **However, Keynes's entire point is that the problem as stated ("choose a chord at random") provides *no such physical specification*.** Demanding invariance under a transformation group *without evidence* for why *that* group reflects the actual generative process is, for Keynes, just as arbitrary as choosing one of the three initial constructions without evidence. It substitutes one unforced choice (which parameterization?) for another (which symmetry group?).

  4.  **Keynes's Metaphysical Point: The Primacy of "Indivisible" Alternatives:** Underlying Keynes's critique is his view that probability applies fundamentally to the *ultimate indivisible alternatives* in a given hypothesis space (pp. 60-65). For continuous magnitudes, we need a justified way of defining these indivisibles ("geometrical entities of definite and comparable magnitude" - p. 76). He argues that different valid geometries (e.g., angle vs. distance vs. area) define different sets of indivisibles. Jaynes's transformation group approach doesn't solve this; it simply selects one geometry (the one invariant under the chosen group) as privileged. Keynes would see this as circular: we need evidence to define the indivisibles, but the transformation group method uses symmetry to define the indivisibles *without* the required evidence about the nature of the alternatives. As he states: "The Principle of Indifference is not applicable to a pair of alternatives, if we know that either of them is capable of being further split up" (p. 65) unless we know how to split them correctly. Jaynes's invariance doesn't provide that knowledge; it imposes a formal constraint that *assumes* a particular splitting (the invariant measure) is correct.

  **Verdict:** Keynes would view Jaynes's solution as an elegant formalization but ultimately a **relocation of the arbitrariness**. Instead of an arbitrary choice among equally valid geometric parameterizations defining the "indivisible" chord elements, Jaynes requires an arbitrary choice among equally conceivable symmetry groups defining the "relevant" transformations for indifference. Since the problem statement "choose a chord at random" provides *no evidence* to determine *either* the correct geometric infinitesimal *or* the correct physical symmetry group, Keynes would maintain that Jaynes fails to overcome the fundamental underdetermination he identified. The defect lies not in the *form* of the indifference reasoning, but in the **lack of sufficient evidence to uniquely determine the set of indivisible alternatives** ("proceeding to the limit" in a specific way) – and Jaynes's transformation group does not supply this missing evidence; it merely provides a different, equally evidence-free, basis for making the choice. Keynes would conclude that Jaynes has formalized the *symptom* (the need for a privileged parameterization) but hasn't cured the underlying *disease* (the absence of evidence justifying that privilege).
