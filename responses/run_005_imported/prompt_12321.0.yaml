  I'm about a third of the way into a novel where one of my two POV characters is an aging philosophy professor -- a Davidson scholar, radical interpretation was literally her whole career -- who gets hired as an "ethics consultant" by a startup building a companion chatbot, and the book is basically about her slowly souring on the gig. I did a philosophy minor a million years ago so I've got the basic Davidson stuff down (principle of charity, solving for belief and meaning off the same evidence at once, all that), but the piece I actually want to build her big confrontation scene around is the later triangulation material -- the argument that you don't get genuine, determinate, "about the world" content unless you've got two creatures simultaneously responding to a shared stimulus AND to each other's responses to it. I think the essay where he really lays this out is called "Rational Animals" but don't quote me on that, its been a while.

  So here's what I'm stuck on: if Davidson were alive today and somebody sat him down in front of a modern LLM -- trained on basically the compressed residue of billions of human triangulations, but never itself co-present with another creature reacting to shared worldly stimuli in real time -- what do you think he'd actually say? Does it just flatly fail his condition (so: whatever the outputs look like, theres no genuine thought or meaning happening), or is there a plausible Davidsonian story where soaking up that much already-triangulated human output secondhand counts as some kind of deferred, distributed version of the real thing?

  And then the twist I want for the scene: what if it's not one LLM but two of them, hooked up to the same live camera feed, talking to each other in real time about what they're "seeing" -- does that setup actually satisfy his conditions, or is he committed to something about embodiment or causal history that rules it out no matter what? I really don't want my professor's argument to just be a Chinese-Room knockoff, so the more precise you can be about how the triangulation requirement is actually supposed to work -- and which part of it even sympathetic readers think is shakiest -- the more useful this is for me.
