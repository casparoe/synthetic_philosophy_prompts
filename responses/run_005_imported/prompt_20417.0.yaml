  okay this one's been living in my head rent free -- I've been TAing our decision theory seminar and it keeps coming up. everyone knows "Pascal's mugging": some guy threatens an astronomically huge harm (or promises a huge reward) with a tiny probability unless you pay up, and naive expected-value reasoning says pay anyway since the payoff swamps the probability. its obviously riffing on Pascal's own wager, which has the same basic structure (tiny/uncertain chance of infinite reward beats any finite cost). what I actually want is for you to reconstruct what Pascal himself -- the Pensées guy, not the sparknotes version -- would say if you sat him down and presented the mugging to him as a reductio of his own reasoning. does he have real resources (the heart having reasons that reason doesn't know, his fideism, the forced-choice structure of the wager, infinite vs finite stakes) to send the mugger away while keeping the wager intact, or is he just as stuck by his own logic as modern decision theorists worrying about "fanatical" expected-value reasoning? give me an actual verdict, not a wishy-washy "it's complicated," and ground it in what he really argued, not the cartoon version of the wager everyone knows.
