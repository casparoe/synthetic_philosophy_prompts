  - **PAP Refutation (4/5):** -1 for not explicitly connecting Jones' responsibility to the *actual* (uncoerced) decision sequence versus the *counterfactual* (coerced) sequence being irrelevant.  
  - **Flicker Objection (3.5/5):** -1 for indeterminism error (Frankfurt cases are often deterministic; the "sign" is a prior state, not an indeterministic event), -0.5 for not addressing the dilemma defense (the flicker is either responsibility-relevant but question-begging, or irrelevant but insufficient to satisfy PAP).  
