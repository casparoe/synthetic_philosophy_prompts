  Random thing that's been bugging me since a meeting at work last week. Me and our tech lead each had to guess, independently, the odds our Q3 migration slips past the deadline. I said 80%, she said 25%. Neither of us was hiding info or trying to win the argument, we just clearly weighted different signals. So we just told each other our raw numbers (no reasoning, just the percentage), each silently updated, said our new number out loud, and did that back and forth four times: 80/25 -> 65/35 -> 55/42 -> 50/48, then we kind of shrugged and stopped there. It nags at me that we plateaued a few points apart instead of landing on the exact same number. If we both know the other person is rational and being straight with us, and we're only updating off each other's number each round, shouldnt we be mathematically forced to end up at the identical probability eventually, not just close? Or is that intuition just wrong? Whats actually going on here.
