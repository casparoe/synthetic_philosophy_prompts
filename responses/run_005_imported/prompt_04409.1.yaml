answer: |-
  Let's cut through the confusion. The Harsanyi-Sen clash reveals a profound subtlety in social choice theory, and the "sleight of hand" you suspect is real. Here's the breakdown:

  **1. Arrow's Setup (The Wall):**
  *   **Preferences:** Ordinal rankings only (no intensity, no comparability). Individuals submit orderings (e.g., A > B > C).
  *   **Axioms:**
      *   **Unrestricted Domain (UD):** Any logically possible set of individual orderings is allowed.
      *   **Weak Pareto (WP):** If everyone strictly prefers A to B, society prefers A to B.
      *   **Independence of Irrelevant Alternatives (IIA):** Society's ranking of A vs B depends *only* on individuals' rankings of A vs B.
      *   **Non-Dictatorship (ND):** No single individual always gets their way.
  *   **Result:** **Impossibility.** No Social Welfare Function (SWF) satisfying all 4 axioms exists.

  **2. Sen's Cardinal Critique (The Wall Stands):**
  *   **Key Insight:** Simply upgrading individuals from *ordinal orderings* to *cardinal VNM utility functions* **without adding interpersonal comparability** doesn't overcome Arrow's impossibility.
  *   **Why?** Cardinal utilities without comparability are just numerical *representations* of the *same underlying ordinal preferences*. The *meaning* of the numbers is isolated to each individual. My "10 utils" and your "10 utils" signify nothing about our relative well-being; they only indicate our own internal scales.
  *   **Result:** Sen showed that with cardinal utilities but **no interpersonal comparability**, and retaining UD, WP, IIA, and ND, **you still get an impossibility or a dictator.** Cardinality alone doesn't create the "glue" needed for aggregation. The informational basis is still too impoverished. IIA remains a major blocker.

  **3. Harsanyi's Setup (The Alleged Door):**
  *   **Preferences:** Individuals have VNM **cardinal utility functions** (representing preferences over lotteries under uncertainty). Society *also* must have a VNM social utility function (i.e., be rational under uncertainty).
  *   **Axioms:**
      *   **Unrestricted Domain (UD):** Any logically possible set of individual VNM utility functions.
      *   **Pareto Indifference (PI):** If *everyone* is indifferent between A and B (U_i(A) = U_i(B) for all i), then society is indifferent (W(A) = W(B)).
      *   **Strong Pareto (SP):** If at least one individual strictly prefers A to B (U_i(A) > U_i(B)) and *no one* prefers B to A (U_j(A) >= U_j(B) for all j), then society strictly prefers A to B (W(A) > W(B)).
      *   **Social VNM Rationality:** The social preference must satisfy the VNM axioms (complete, transitive, continuous, independent).
  *   **Result:** **Possibility Theorem.** There exists a social welfare function W that is a **weighted sum** of individual utilities: W = Σ a_i * U_i (with a_i > 0).

  **4. The Crux: Where Harsanyi "Escapes" and Why Sen Disagrees (The Hidden Door Handle)**

  The escape *seems* magical: Cardinal utilities + Pareto + Social VNM Rationality => Utilitarianism, seemingly without interpersonal comparisons. **The sleight of hand lies in the *combination* of Pareto Indifference (PI) and the requirement for Social VNM Rationality:**

  *   **Pareto Indifference (PI) Forces Level Comparability:** PI requires that if *everyone* reports the *same utility value* for A and B, society must be indifferent. This implicitly treats "U_i(A) = U_j(A)" as a meaningful statement *across individuals* in the context of that specific social choice. It forces the SWF to recognize when individuals are *at the same utility level* relative to the alternatives. **This is interpersonal comparison of utility *levels***, smuggled in through the back door. Arrow/WP and Sen's cardinal-no-comparability setup explicitly *avoid* requiring this.
  *   **Social VNM Rationality Fixes the Scale:** VNM utility is cardinal *only up to affine transformations* (U_i' = c_i * U_i + d_i). The requirement that the *social* preference also be VNM rational under uncertainty provides a mechanism to "lock in" the individual scales relative to each other in the social aggregation. The social preferences over lotteries involving different individuals' stakes constrain how the individual scales can be transformed independently. **This effectively establishes a common scale, enabling meaningful weights (a_i).**

  **5. The Dictator's Shadow & The Weight Problem:**

  *   **Harsanyi's Theorem Says:** *There exist* positive weights a_i such that W = Σ a_i * U_i satisfies the axioms.
  *   **The Catch:** The theorem **does not guarantee the weights are non-dictatorial** in the Arrow-Sen sense. It only guarantees they are positive. **A dictator is mathematically possible!** How?
      *   Suppose a_1 = 1, and a_2 = a_3 = ... = a_n = ε (a very small positive number).
      *   PI and SP are satisfied: If everyone is indifferent, so is society. If even one person (especially person 1!) strictly prefers A, and no one prefers B, society strictly prefers A.
      *   Social VNM Rationality is satisfied (it's still a linear sum).
      *   **This is effectively a dictatorship by individual 1**, as their strict preference will *always* dictate the social strict preference unless everyone else opposes them (which SP prevents), and even then, their weight dominates unless all others *unanimously* oppose them with sufficient intensity to overcome the massive weight imbalance. If ε is small enough, person 1 dictates almost all strict social preferences.
  *   **Sen's Point Validated:** Without *further assumptions* specifying how the weights (a_i) are chosen (e.g., symmetry/anonymity, equality, some moral principle) or *stronger forms of interpersonal comparability* (like ratio scale comparability), **Harsanyi's utilitarian form does *not* escape Arrow's dictatorship conclusion on its own.** The weights can be chosen to make one individual arbitrarily dominant.

  **The Verdict:**

  1.  **Harsanyi *does* escape the *literal* Arrow impossibility:** By replacing IIA and the ordinal framework with PI/SP and the cardinal/VNM framework, he creates a logically consistent possibility theorem for a utilitarian SWF.
  2.  **Harsanyi *does not* escape the *spirit* of the impossibility/dictatorship concern without interpersonal comparability:** The escape relies **critically** on:
      *   **Interpersonal Level Comparability:** Smuggled in via **Pareto Indifference (PI)**. Recognizing universal indifference requires comparing utility levels across people.
      *   **A Common Scale:** Established by the interaction of individual VNM utility and the requirement for **Social VNM Rationality**.
  3.  **The Dictator Loophole:** Even with the utilitarian form, **Harsanyi's axioms alone do not prevent a dictator.** They allow weights that render one individual effectively dictatorial. Avoiding this requires **additional ethical assumptions** (e.g., equal weights, anonymity) that constitute a *further* form of interpersonal comparability (equal treatment, equal moral worth) or explicitly define how to compare the scales.

  **Where the Sleight of Hand Happens:**

  1.  **In Pareto Indifference (PI):** This axiom *looks* innocuous but **is the point where interpersonal level comparability is introduced.** It forces society to treat "U_i(X) = U_j(X)" as meaningful across individuals for social choice. Arrow's Weak Pareto makes no such demand.
  2.  **In the Interpretation of the Weights (a_i):** The theorem proves the *mathematical existence* of positive weights but **remains silent on their ethical determination.** Claiming this yields "utilitarianism" without interpersonal comparisons glosses over the fact that fixing non-dictatorial weights *requires* an ethical principle for comparing the relative moral worth or scale of different individuals' utility. The weights *are* the mechanism for interpersonal comparison. Harsanyi provides the *form*, but the *content* (the specific a_i values) demands comparability.

  **In essence:** Harsanyi found a door, but it only opens if you accept interpersonal level comparability (via PI) and use Social VNM Rationality to establish a common scale. Furthermore, to walk through that door into a non-dictatorial version of utilitarianism, you need an *additional* key – an ethical principle to set the weights – which itself relies on interpersonal comparability of worth or scale intensity. Arrow's wall stands firm against any attempt to build a satisfactory social welfare ordering using *only* information about individual preferences that excludes interpersonal comparisons. Sen was right; cardinality alone isn't enough. Harsanyi's escape depends crucially on the comparability smuggled in by PI and the scale-fixing of VNM rationality.
