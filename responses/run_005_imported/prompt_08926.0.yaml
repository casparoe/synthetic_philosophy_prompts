  For hustle culture, I see a direct link to Keynes' warning about being "too dispirited" to abandon old habits. These overworkers aren't economically coerced - they're psychologically addicted to accumulation as purpose. The "purpose" they find in work mirrors Keynes' critique of mistaking means for ends.

