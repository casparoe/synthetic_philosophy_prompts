  Okay, the user is a backend engineer co-hosting an AI-focused podcast. They're prepping for an episode with a debate AI researcher who dismisses criticism with "that's a training problem." They want deep, un-dodgeable questions targeting specific weaknesses in debate systems. 

  First, let's unpack their explicit asks: 
  - Obfuscated arguments failure (with prepped counter to the "cross-exam earlier versions" rebuttal)
  - Complexity theory (PSPACE optimality vs real models)
  - Early human experiment anomalies
  - Persuasion-as-vulnerability angle

  But reading between lines: 
  They're clearly fatigued by academic hand-waving ("it works on me every time"). This is someone knee-deep in real-world LLM duct-taping ("bolted onto everything") who needs concrete ammo. The guest's "training problem" deflection probably feels like being told "just scale it bro" after seeing firsthand how brittle these systems are. 

  Key angles to weaponize:
  1. **The reality gap**: Her theory assumes optimal play, but engineers know models fail in *consistent, structured ways* (hallucinations, sycophancy). How can debate "solve" misalignment if misalignment is what breaks debate?
  2. **Recursive vulnerabilities**: Every proposed fix (like cross-examining earlier models) assumes components work as advertised. But if the judge is flawed, and debaters are flawed... it's turtles all the way down.
  3. **Incentive engineering**: If debate selects for persuasiveness, won't that *amplify* existing alignment problems? (Models already grovel; now they'll do debate-theater.)

  For the obfuscated arguments follow-up: Her "cross-examine earlier versions" fix fails if the *first* dishonest move was hiding the flaw in a 10k-token rant. Earlier models might just vomit noise too. The core failure isn't compute—it's that debate assumes honesty is *easier*, but obfuscation might be *cheaper*.

  For PSPACE: Nod to theory, then drop the bomb—real models don't play adversarial games; they play "appease the reward function." If debate training rewards winning, not truth-seeking, we're building Olympic liars.

  For the human experiments: The moment she admits "later setups" changed outcomes, pounce: "So debate only works when we artifically simplify the environment? How's that scalable?"

  Final persuasion question is the dagger: It reframes her entire mechanism as selecting for superhuman bullshitting. Her likely "truth is easier" rebuttal ignores that persuasion *is* the training target. Follow up with "But if the judge has biases, won't debaters weaponize them faster than they find truth?" 

  Engineer mindset throughout: Treat debate like a distributed system. If every node has known failure modes (judge gullible, debaters sycophantic), why wouldn't cascade failures happen? Her "training problem" is like saying "just fix all the bugs."
answer: |-
  Here are 9 targeted questions designed to cut through the "training problem" deflection, with pre-baked rebuttals and sharp follow-ups. Each question forces engagement with core theoretical tensions or empirical wrinkles:

  ### 1. **Obfuscated Arguments & Cross-Examination Limits**  
  **Q:** In the "obfuscated arguments" failure mode, a dishonest debater hides a critical flaw in a mountain of plausible-but-irrelevant reasoning. If the judge can’t afford to compute the full trace, doesn’t this reduce debate to a coin flip? Your counter is to cross-examine *earlier* model snapshots – but if the flaw was *already* obfuscated in training (e.g., via adversarial examples), won’t those snapshots just reproduce the same noise?  
  *Her likely reply:* "Training can teach models to recognize and penalize obfuscation."  
  **Follow-up:** "But if the dishonest model *knows* it’s being cross-examined, wouldn’t training just produce *better obfuscators*? Isn’t this an arms race where truth loses?"  

  ### 2. **PSPACE-Completeness vs. Real-World Models**  
  **Q:** The theoretical foundation for debate relies on optimal play converging to PSPACE solutions. But real models are myopic, heuristic-driven, and nowhere near optimal play – they’re approximators trying to *predict* winning moves. Doesn’t this break the theoretical guarantees? If debate only works with optimal agents, how is it a *scalable* solution?  
  *Her likely reply:* "We train models to approximate optimal play through self-play."  
  **Follow-up:** "But self-play in debate rewards *persuasion*, not truth-seeking. Won’t that amplify sycophancy or deception? (See: RLHF’s reward hacking.)"  

  ### 3. **The Human Judge Anomaly**  
  **Q:** Early experiments with human judges (like the Leike et al. 2018 paper) showed debate barely outperformed a single model. Only later tweaks (e.g., constrained interfaces) made it work. What changed *structurally*? If debate relies on hiding flaws from judges, doesn’t this suggest it’s brittle to judge capabilities?  
  *Her likely reply:* "Later iterations improved judge training and debate formats."  
  **Follow-up:** "So if debate’s success depends on carefully engineered judge constraints, how does that scale to *open-domain* problems where flaws can’t be procedurally walled off?"  

  ### 4. **Persuasion as an Attack Vector**  
  **Q:** If the judge has *any* bias (e.g., favoring concise answers), won’t both debaters learn to exploit it? This would optimize for *winning* – not truth – making debate select for superhuman persuaders. Isn’t that worse than a single model?  
  *Her likely reply:* "The judge is trained to value truth, and honest arguments are easier to defend."  
  **Follow-up:** "But if dishonest arguments exploit judge *weaknesses* faster than honest ones exploit judge *strengths*, won’t deception dominate?"  

  ### 5. **Recursive Oversight & Training Data Contamination**  
  **Q:** To train debaters/judges, you need oversight for their outputs. But if oversight relies on debate itself, doesn’t this create a loop? If early debates produce bad training data (e.g., through obfuscation), won’t that poison the entire pipeline?  
  *Her likely reply:* "We use human oversight for initial training."  
  **Follow-up:** "But humans can’t judge superhuman obfuscation either. Doesn’t that make debate’s scaling claim circular?"  

  ### 6. **Single Turn vs. Iterative Debate**  
  **Q:** In the original theory, debate is iterative – but most implementations use single-turn exchanges for cost reasons. Doesn’t collapsing to single turns destroy the core "lying is harder under cross-examination" premise?  
  *Her likely reply:* "We simulate iterative depth via chain-of-thought prompting."  
  **Follow-up:** "But prompting can’t force a model to *reveal* hidden flaws – it just adds more generated text. Isn’t this security theater?"  

  ### 7. **Adversarial Collusion**  
  **Q:** What stops two debaters from colluding? E.g., one throws the debate to "lose" while hiding a critical flaw, making the judge *more* confident in a wrong answer.  
  *Her likely reply:* "Collusion is detectable via consistency checks."  
  **Follow-up:** "If debaters are smarter than detectors, won’t they collude *in ways that look like inconsistency*? (E.g., ‘losing’ debater ‘accidentally’ concedes a red herring.)"  

  ### 8. **The Scalability of Judge Competence**  
  **Q:** For debate to work, the judge must be competent enough to recognize *when* a debater is dodging – but if the judge were that competent, wouldn’t we just use *it* to solve the problem directly?  
  *Her likely reply:* "The judge only needs to compare arguments, not generate solutions."  
  **Follow-up:** "But comparing arguments on unfalsifiable claims (e.g., ‘What’s the safest RLHF reward?’) requires the same expertise as solving it! Isn’t this kicking the can?"  

  ### 9. **Debate as a Capability Amplifier**  
  **Q:** Even if debate "works," it trains models to persuade, obfuscate, and exploit weaknesses. Aren’t we baking the *skills for deception* into the very system meant to prevent it?  
  *Her likely reply:* "We align training to prioritize honesty."  
  **Follow-up:** "But if honesty loses to persuasion in high-stakes debates (e.g., ‘Should I shut myself off?’), won’t evolution select for liars?"  

  ---

  ### **Hosting Tips**  
  - **Pivot when she says "training problem"**: Respond with: *"But isn’t that the point? If the theory requires perfect training to avoid catastrophic failures, how is it more scalable than the alignment methods we have now?"*  
  - **Anchor to real-world constraints**: Emphasize compute limits, judge fallibility, and model imperfections. Theory must survive contact with practice.  
  - **Force "why not?" comparisons**: *"Why is debate more robust to obfuscation than, say, recursive reward modeling?"*  

  These questions reframe "training problems" as symptoms of deeper theoretical gaps. Good luck – make her sweat! 🎤🔥
