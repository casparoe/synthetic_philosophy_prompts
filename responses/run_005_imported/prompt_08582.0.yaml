  We are evaluating seven approaches to the problem of interpersonal utility comparisons (IUC) from the perspective of whether they provide a genuine, defensible solution to the grounding problem (i.e., providing a non-arbitrary, scientifically respectable basis for comparing utility across persons). The grounding problem is about whether we can meaningfully say that one person's utility is greater than, less than, or equal to another's, and if so, on what basis.

  The seven approaches and their labels (with short labels for the JSON):

  1. Classical Utilitarianism (Bentham, Sidgwick) -> "Classical"
     - They assume that pleasure and pain are directly commensurable across persons. This is largely unexamined and taken as given.

  2. Robbins's Ordinalism -> "Ordinalist"
     - Argues that interpersonal comparisons are not scientific and should be dropped.

  3. Kaldor-Hicks Compensation Tests -> "KaldorHicks"
     - Evaluates policy changes by potential Pareto improvements (i.e., winners could compensate losers) to avoid direct interpersonal comparisons.

  4. Arrow's Extended Sympathy -> "ExtendedSympathy"
     - Grounds comparisons in an individual's preferences about what it would be like to be in someone else's position.

  5. Harsanyi's Utilitarian Aggregation Theorem -> "Harsanyi"
     - Derives a cardinal social welfare function from individual vNM utility functions (which are cardinal and comparable by construction in the model) plus a Pareto condition.

  6. Rawls's Primary Goods and Difference Principle -> "Rawls"
     - Substitutes an index of primary social goods (which are objective) for utility and uses the difference principle (maximin) to avoid direct utility comparisons.

  7. Sen's Capability Approach -> "Sen"
     - Shifts the focus from utility to capabilities and functionings (what people are able to do and be) as the basis for comparison.

