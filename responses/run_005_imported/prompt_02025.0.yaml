  Ah, here's where it gets juicy. In a deterministic universe (which CDT often assumes), the coin flip isn't truly random - its outcome is determined by initial conditions. If Death can predict everything about the man's psychology and environment, why not the coin? We'd need to argue that Death's predictive model deliberately excludes physical randomness, but that feels ad hoc. The user's "scope confusion" suspicion seems valid.

  Even if we grant true randomness, there's a second problem: CDT's justification for randomization relies on the very evidential reasoning it normally rejects! The user hinted at this with "relocates the problem". When the man considers randomizing, he must calculate expected utilities conditional on that policy - which requires believing that Death couldn't predict the coin. But that's evidential reasoning about Death's prediction! CDT usually forbids such "spooky" correlations. 

  The software engineer might appreciate this analogy: it's like solving a null pointer exception by adding a null check, without fixing the underlying allocation logic. The randomization "patch" only works if we sneak in evidential reasoning through the backdoor while claiming to be purely causal. 

  For the strongest argument: imagine Death can predict pseudo-randomness (e.g., if the man uses a deterministic RNG seeded by his mood). Or suppose the man is considering quantum-random devices - but then why couldn't Death simulate quantum mechanics? The boundary between "predictable choice" and "unpredictable randomness" collapses upon scrutiny. 

