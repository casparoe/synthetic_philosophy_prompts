  Right, so I need to build the anti-randomization argument step by step. First, reconstruct why CDT thinks randomization works: it breaks the evidential link between choice and prediction by introducing unpredictability. Death can't foresee coin flips, so now choosing Damascus doesn't signal Death being there. The mixed strategy becomes ratifiable because conditional on choosing randomly, both cities have 50% survival chance. 

