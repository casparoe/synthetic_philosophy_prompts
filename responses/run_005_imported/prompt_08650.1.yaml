answer: |-
  Here's a dialogue tackling the mechanics of embedding attitudes head-on, using a fresh example and pushing the expressivist solution as far as it can go before confronting its inherent tension. The realist presses on the core issue: **can normative consistency be genuinely *logical* without smuggling in truth-conditions?**

  **Characters:**
  *   **Eva (Expressivist):** Defends a Gibbard-style plan-based expressivism.
  *   **Ray (Realist/Cognitivist):** Believes moral statements express beliefs about objective properties/truths.

  **Setting:** Philosophy department common room, coffee in hand.

  **(The dialogue starts mid-conversation after Ray raised the Frege-Geach problem using "stealing from corporations")**

  **Ray:** ...So Eva, I get that when someone *asserts* "Stealing from corporations is wrong," on your view, they're expressing a plan to feel disapproval or blame towards such stealing. Fine. But take this argument:
      *Premise 1:* If stealing from corporations is wrong, then encouraging others to do it is wrong.
      *Premise 2:* Stealing from corporations is wrong.
      *Conclusion:* Therefore, encouraging others to do it is wrong.
  For modus ponens to work, "stealing from corporations is wrong" has to mean the *same thing* in Premise 1 and Premise 2. But in Premise 1, it's embedded in a conditional – nobody's *actually* planning to blame anything there! So what *is* it expressing in that context? How can the *same* non-cognitive attitude be present unasserted? And how does the inference hold if it's just about feelings?

  **Eva:** Right, the classic embedding problem. My solution isn't that the *very same* occurrent feeling of disapproval is magically inside the conditional. That *would* be nonsense. Instead, we need to understand moral vocabulary as expressing *states of mind* that can stand in logical relations *themselves*, specifically relations of *consistency* and *inconsistency*. Think about planning.

  **Ray:** Planning? Okay, walk me through it. What does "wrong" express, fundamentally, for you?

  **Eva:** Saying "X is wrong" expresses *acceptance of a norm* that forbids X, or more concretely, *planning to feel the sentiment of blame* towards anyone who does X, including potentially myself. It's a practical commitment.

  **Ray:** Alright, a plan to blame. So Premise 2: "Stealing from corporations is wrong" = I plan to blame anyone who steals from corporations.

  **Eva:** Exactly. Now, Premise 1: "If stealing from corporations is wrong, then encouraging others to do it is wrong." What's being expressed here isn't a *current* plan about stealing or encouraging, but a *higher-order* state of mind *about* the consistency of plans.

  **Ray:** Higher-order? Go on.

  **Eva:** Accepting Premise 1 expresses a *plan about my plans*. It's a commitment that *if* I plan to blame stealing from corporations, *then* I *must also* plan to blame encouraging it. It's ruling out a certain combination of attitudes as *inconsistent*. I'm planning *not* to have the plan to blame stealing while simultaneously *not* having the plan to blame encouraging it.

  **Ray:** Hold on. "Inconsistent"? What does *inconsistency* mean here? With beliefs, inconsistency is straightforward: I can't believe "P" and "Not-P" because the world can't be that way. But plans? Feelings? What makes planning to blame stealing but *not* planning to blame encouraging it "inconsistent"? Isn't that just a psychological quirk or a personal preference? Why is it *logically* forbidden, like a contradiction?

  **Eva:** It's inconsistency *within the framework of planning*. Planning has its own constitutive norms. To plan *is* to aim for coherence in guiding one's actions and reactions. Suppose I plan to blame stealing (meaning I'm committed to reacting negatively to it). Now, encouraging stealing *directly facilitates* the very thing I'm committed to blaming. Planning to blame the act but *not* planning to blame the facilitation is incoherent *as a plan* – it undermines the point of having the first plan. It's practically self-defeating. The inconsistency is practical, not metaphysical.

  **Ray:** I see the *practical* conflict you're pointing to. But is that enough for *logic*? Logic deals with truth-preservation. Modus ponens guarantees that if P is true and If P then Q is true, then Q is true. You're replacing "true" with "consistent with my plan" or "not self-defeating." But consistency *of what*? You need something for these plans to be consistent *with*. With beliefs, it's consistency with *reality* or with other *truths*. What anchors the consistency of plans? Just the internal goal of not being self-defeating? That seems subjective and psychological, not objective and logical.

  **Eva:** It's anchored in the *nature* of the planning state itself and the concepts involved. Think about the concept "encouraging." Part of what it *means* to encourage an act is to increase the likelihood of that act occurring. If I'm planning to negatively react to the act (blame), then planning *not* to negatively react to something that promotes it is failing to apply my own standard consistently *given the meanings of the terms*. The inconsistency arises from the *content* of the plans and the *meanings* of the actions they're about.

  **Ray:** Okay, let's test that. Suppose someone says, "If stealing from corporations is wrong, then *donating the proceeds to charity* is wrong." Premise 1 becomes: "If I plan to blame stealing, then I must plan to blame donating the proceeds." I reject that conditional! I think stealing can be wrong *even if* donating the proceeds is okay, maybe even good. On your view, what does *rejecting* that conditional express?

  **Eva:** Rejecting "If S is wrong, then D is wrong" expresses *allowing* the combination: planning to blame S while *not* planning to blame D. I judge that combination as *consistent*.

  **Ray:** Precisely! And *why* is the first combination (blame stealing + not blame encouraging) inconsistent, but the second combination (blame stealing + not blame donating) consistent? Is it because of some objective, logical relation between stealing and encouraging/donating? Or is it because *you personally* find one combination self-defeating and the other not? If it's the latter, then the "validity" of the original modus ponens argument becomes relative to individual psychology or cultural norms about what counts as "self-defeating" for a plan. That's not logic; that's descriptive psychology. Logic should be universal and prescriptive.

  **Eva:** It's not *just* individual whim. The meanings of the actions and the functional role of blaming constrain what counts as consistent. "Encouraging" has a tight, direct, conceptual link to the act being performed in a way that "donating the proceeds afterward" does not. The inconsistency stems from the *functional role* of the attitude (blame aims to deter) and the *conceptual connections* between the described actions (encouraging directly promotes the act). It's a *conceptual* inconsistency within the practical framework.

  **Ray:** But now you're perilously close to my view! You're appealing to "conceptual connections" and "functional roles" that seem objective and mind-independent. Why is the functional role of blame *to deter*? Isn't that a fact about human psychology and social interaction? And why is the conceptual connection between "encouraging" and "performing the act" so tight? Aren't these just facts about language and the world? It sounds like you're smuggling in objective, cognitive *truths* about attitudes, concepts, and their consequences to underpin the "logical" relations between the non-cognitive states. The inconsistency isn't *just* between my plans; it's between my plans *and how the world works*, or *and what the words mean*. And *those* things – the functions of attitudes, conceptual connections – look suspiciously like truth-apt beliefs you're relying on.

  **Eva:** (Pauses, takes a sip of coffee) That's a sharp push, Ray. You're right that the solution leans heavily on the *stability* and *shared understanding* of concepts (like "encouraging," "blame") and the functional roles of attitudes. Gibbard calls this living in the "space of plans" governed by shared norms of practical reasoning. The "logic" is the logic of this shared, public practice of planning and norm-acceptance. The inconsistency is objective *within that practice*, given shared understandings.

  **Ray:** But does that practice *create* the inconsistency, or does it *track* an inconsistency that's already there? If it's the former, morality reduces to linguistic convention or social practice – which is a big concession, and not what most people mean by "wrong." If it's the latter – if the practice *tracks* an independent inconsistency – then what *is* that independent inconsistency based on, if not the truth or falsity of the embedded moral propositions? You need the *propositions* "Stealing is wrong" and "Encouraging stealing is not wrong" to *themselves* be incompatible, independent of anyone's plans, for the inconsistency in plans to be more than just a pragmatic misfire. And that sounds like cognitivism.

  **Eva:** I think the expressivist has to bite the bullet here and say the inconsistency *is* constituted by the norms of the planning practice itself, informed by our shared concepts and understanding of attitude functions. It doesn't *track* an independent, truth-based inconsistency; the "inconsistency" just *is* the violation of the constitutive norms of coherent planning. It's like the rules of chess making certain moves "illegal" – the illegality isn't tracking some pre-existing metaphysical illegality; it's defined by the game. The "game" here is practical reasoning.

  **Ray:** And the validity of moral arguments then becomes dependent on the rules of *this particular human game* of planning and blaming. If we played a different "game" with different concepts or attitude functions, different inferences would be "valid." But moral arguments *feel* universally compelling in a way chess moves aren't. When I say "Encouraging wrong acts is itself wrong," I think I'm saying something *true*, not just reporting a rule of my current planning practice. The Frege-Geach problem forced you to make attitudes embeddable via consistency relations. But to make those consistency relations robust enough to ground logic, you had to anchor them in objective-seeming features of concepts, attitudes, and practices. The solution works *technically* to save the syntax of logic, but the *semantic weight* – what gives the inference its *normative force* – ends up resting on something that looks a lot like the objective, cognitive content you wanted to avoid. You've shown *how* the attitude embeds, but the *force* of the connection relies on cognitive baggage.

  **Eva:** (Nods slowly) That's a fair critique. Maybe the best an expressivist can say is this: We've shown *a* way to understand moral language as fundamentally expressive of planning states while accommodating its logical behavior. We've provided a *model* for how the logic works without invoking truth-conditions *for the moral propositions themselves*. The "cognitive baggage" – the facts about concepts, attitude functions, constitutive norms of planning – are *non-moral* truths that the logic relies on. The distinctively *moral* component remains the planning state. The limitation is that the *necessity* and *universality* we feel in moral logic is, on this view, derivative – it stems from the depth and ubiquity of our shared planning nature and conceptual scheme, not from mind-independent moral truth. It's a *practical* necessity for coherent agency, not a *metaphysical* one. It doesn't *feel* as satisfyingly objective as realism, but it avoids postulating mysterious moral properties while saving the phenomena of moral discourse and argument. The "weak joint" is that the account of consistency needed to do the logical work pulls us towards cognitivism *about the framework* within which the plans exist.

  **Ray:** And that framework ultimately does a lot of the heavy lifting that the realist assigns to moral truth itself. It's an ingenious solution to the embedding problem, Eva, I'll grant you that. But whether it fully captures the *authority* of moral reasoning, or just relocates the mystery from "moral truth" to "the objective norms of planning"... that's where I remain deeply unconvinced. The rabbit hole goes deeper.

  **Eva:** (Smiles wryly) It always does. More coffee? I think we've earned it. Let's try applying this to negations next... "Stealing from corporations is *not* wrong" – what plan does *that* express?

  **(The debate continues...)**

  **Key Takeaways from the Dialogue:**

  1.  **Embedding Mechanism:** Expressivism handles embedding by shifting from expressing *occurrent attitudes* to expressing *commitments* (plans) that can stand in relations of *consistency/inconsistency*.
  2.  **The Crux: Normative Consistency:** The core challenge is defining what makes two plans/attitudes "inconsistent" in a way that isn't merely psychological but can underpin *logical* inference.
  3.  **The Expressivist Move:** Inconsistency is framed as *practical* incoherence within the framework of planning, given the functional roles of attitudes (e.g., blame aims to deter) and conceptual connections between actions (e.g., encouraging directly promotes the act).
  4.  **The Realist's Press:** This appeal to functional roles and conceptual connections:
      *   **Risks Subjectivity/Relativity:** If consistency depends on individual psychology or variable cultural understandings of concepts/functions.
      *   **Smuggles in Cognitivism:** The "objective" constraints (functions of blame, meaning of "encouraging") look like truth-apt, non-moral *beliefs* that the logic relies upon, undermining pure non-cognitivism.
      *   **Dilutes Moral Authority:** The necessity of the inference becomes practical (needed for coherent planning) rather than metaphysical (based on moral truth), which may not capture the perceived universality and objectivity of moral logic.
  5.  **Expressivist Concession/Limitation:** The solution provides a *coherent model* for logical embedding without moral truth-conditions, but the *force* of moral logic relies on the stability and shared nature of non-moral facts (about concepts, attitudes, planning norms). It saves the syntax but grounds the semantics in a framework that itself has cognitive elements. The "inconsistency" is constituted by the practice, not tracking an independent truth-based contradiction.

  **Conclusion:** Expressivism *does* have a sophisticated, non-handwavy answer to Frege-Geach (like Gibbard's plan-based model). It technically solves the embedding problem by making attitudes embeddable as plan-commitments governed by norms of consistency. **However, the realist successfully presses on the deepest weakness: grounding the required notion of "consistency" robustly enough to underpin genuine logic inevitably pulls the expressivist towards appealing to objective-seeming (cognitive) features of concepts, attitudes, or practices.** This doesn't *refute* expressivism, but it highlights a significant tension and arguably blurs the line with sophisticated forms of cognitivism, revealing that the "solution" might involve significant concessions about the source of moral normativity. The rabbit hole persists.
