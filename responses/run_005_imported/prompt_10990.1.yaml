  1. **An agent who is certain she is a Bayesian conditionalizer in principle, but uncertain which updating rule she will actually apply once the evidence arrives.**
     - This case points to a self-doubt about the agent's own future rationality. The agent is not sure if she will update correctly. This might lead her to avoid information because she fears misupdating. However, the slogan assumes the agent is rational and will update correctly. So this might be a case of irrationality (or uncertainty about irrationality) and thus not directly challenge the slogan for a fully rational agent.

  2. **A case in which the very act of looking is entangled with the state one is uncertain about (Newcomb-style).**
     - In Newcomb's problem, the act of looking (or not) can be correlated with the state because of a predictor. If the predictor is good, then the agent might be better off not looking. This is a classic challenge because the free information might cause the agent to lose a guaranteed good outcome. This directly challenges the slogan because the agent may rationally decline free information.

  3. **A maxmin-expected-utility agent with credence dilation.**
     - Dilation occurs when receiving information increases the set of possible probabilities (e.g., the range of probabilities for an event becomes wider). For a maxmin agent (who maximizes the worst-case expected utility), this might lead to a lower worst-case expected utility after receiving the signal. Thus, the agent might avoid free information to prevent worsening the worst-case scenario. This is a challenge within a specific decision rule (robust Bayesianism) and may be seen as a genuine counterexample in that context.

  4. **Hirshleifer's example.**
     - In this example, the availability of information destroys an insurance market. Even though the information is free and relevant, having it can lead to a breakdown of risk-sharing, making everyone worse off. However, note that the agent is not declining the information because of a direct effect on her own decision, but because of strategic interactions. The slogan is about an individual agent, but in this case, the harm comes from the information being available to others as well. If we are considering an individual agent in isolation, this might not directly apply. But if the agent is part of a group and the information is public, then it might be rational for the agent to avoid the information to preserve the insurance. However, the slogan is about an individual agent's decision. Also, note that in Hirshleifer, the information is not necessarily declined by the agent but might be about the availability of the information to the market. This might be less direct.

  5. **A dynamically inconsistent agent.**
