  We are ranking the responses to Galen Strawson's Basic Argument against moral responsibility.
   The Basic Argument claims that no one can be truly responsible because to be responsible for one's actions, one must be responsible for being the kind of person who does such actions, leading to an infinite regress (requiring causa sui, which is impossible).

   We are ranking based on how well each response holds up against the Basic Argument, not on fame or influence.

   The responses to rank:

   1. P.F. Strawson (reactive attitudes) - argues that moral responsibility is not about metaphysical free will but about our natural emotional reactions (resentment, gratitude, etc.). We cannot abandon these attitudes and they form the basis of our moral practices.

   2. Frankfurt-style compatibilism (hierarchical/mesh of desires) - an agent is morally responsible if they act according to their second-order desires (desires about which first-order desires they want to act on) and these are in harmony (mesh).

   3. Fischer & Ravizza's reasons-responsiveness - an agent is responsible if their mechanism of action is moderately reasons-responsive (i.e., it would respond to reasons in counterfactual situations).

   4. Agent-causal libertarianism (Chisholm/O'Connor/Clarke) - posits that agents, as substances, can cause actions without being causally determined, introducing a special kind of causation (agent-causation) to break the causal chain.

   5. Kane's event-causal libertarianism with "self-forming actions" (SFAs) - tries to provide indeterministic events (at the quantum level?) in the decision-making process that occur in moments of conflict, which then form the agent's character. These SFAs are undetermined but the agent is responsible because they made the effort of will.

   6. Vargas's revisionism - suggests that we should revise our concept of moral responsibility to be more empirically informed and practical, perhaps jettisoning some traditional elements that are metaphysically demanding.

   7. Smilansky's illusionism - argues that while we lack ultimate moral responsibility (due to the Basic Argument or similar), society must maintain the illusion of free will and responsibility to function properly.

   8. Pereboom's hard incompatibilism - agrees with the Basic Argument that we lack moral responsibility (because determinism and indeterminism both rule it out) and argues that we should abandon retributive attitudes and practices, but we can maintain other practices (like incapacitation) on consequentialist grounds.

   Criteria for ranking: How well does the response address the Basic Argument's regress? Does it avoid the regress? Does it provide a coherent alternative? Does it accept the argument and adjust accordingly?

   Let's analyze:

   - The Basic Argument targets the idea of being responsible for one's character. Any theory that requires ultimate responsibility for character will fail. So:

     * Compatibilist theories (like Frankfurt, Fischer & Ravizza) typically avoid the regress by not requiring that the agent be responsible for their character. They set conditions for responsibility that do not require tracing back to the origin of the agent. However, the Basic Argument might challenge that if the agent's character is given (and they didn't choose it), then how can they be responsible? The compatibilist might say that responsibility does not require such ultimacy. But does that hold up? The Basic Argument is precisely that without ultimacy, there is no real responsibility.

     * Libertarian theories try to break the regress by positing actions that are not determined by prior causes (or by prior states of the agent) but are caused by the agent in a way that makes the agent responsible without requiring prior responsibility. However, the Basic Argument might still press: how did the agent come to be such that they would perform that action? If the agent's nature is not self-created, then the regress reappears.

     * Revisionist and illusionist approaches accept the Basic Argument and adjust our practices accordingly.

     * Hard incompatibilism accepts the Basic Argument and rejects moral responsibility.

   Ranking:

   S-tier: Responses that either (a) successfully block the regress without falling into the causa sui trap, or (b) provide a compelling alternative that renders the regress irrelevant in a way that is both coherent and satisfying.

   F-tier: Responses that fail to address the regress and are clearly undermined by it.

   However, note: the Basic Argument is very strong and many think it is unanswerable. So we might find that most responses are in lower tiers.

   Let's go one by one:

   1. P.F. Strawson (reactive attitudes): This approach shifts the question from metaphysics to our practices and attitudes. It says that the conditions for moral responsibility are satisfied by our participation in the interpersonal relationships that involve reactive attitudes. It does not require ultimate responsibility. But the Basic Argument might say: but why are we justified in having these attitudes if the agent isn't ultimately responsible? Strawson might say that the justification is internal to the practice. However, Galen Strawson (his son) has criticized this as not addressing the core metaphysical issue. So it might be seen as avoiding the argument rather than refuting it. It's influential but may not hold up against the Basic Argument's challenge.

   2. Frankfurt-style compatibilism: By focusing on the structure of the agent's will (the harmony between first-order and second-order desires), it sets a condition for responsibility that does not require the agent to be responsible for having those second-order desires. But the Basic Argument would then ask: but is the agent responsible for having that mesh? If not, then they are not ultimately responsible. So it doesn't stop the regress. Frankfurt might say that we don't need to go that far. But the Basic Argument insists that without that, there is no real responsibility.

   3. Fischer & Ravizza: They require that the mechanism of action be moderately reasons-responsive. Again, the agent might not be responsible for having that mechanism. The regress looms. They try to address history (so the mechanism must be the agent's own) but that might just push the regress back.

   4. Agent-causal libertarianism: This posits that the agent, as a substance, can cause actions without being determined. The agent is a prime mover. But then, why did the agent cause this action and not another? If the agent's nature explains it, then we ask about responsibility for that nature. If not, then the action seems random. And if the agent just is a causa sui, that's impossible. So it seems to fall into the trap.

