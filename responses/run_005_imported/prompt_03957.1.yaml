  The user's deeper need seems to be fairness and reducing conflict. They want a method that feels equitable without constant arguments. Geometric rationality could provide a structured approach that acknowledges each member's priorities. It's not just about the math; it's about perceived fairness and buy-in.

  Implementing this would require each member to express their utility multipliers. For instance, rating events on a scale where 1.0 is neutral. Then, the product of these multipliers is maximized. This differs from averaging, which can drown out minority opinions. 

