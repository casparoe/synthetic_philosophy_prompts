  RCV has pros: eliminates vote-splitting, encourages positive campaigns, allows ranking without fear. Cons: Complexity, potential for center-squeeze, and yes, it's manipulable. But maybe less so in practice? Approval voting: simple, resists vote-splitting, but voters might bullet-vote or over-approve. Plurality is simple but caused the issue.

  The user wants to address manipulability. I need to argue that while all systems can be gamed, some are harder to game in practice. RCV requires coordination to manipulate effectively, which is unlikely in student elections. Approval is strategy-resistant but might not reflect nuanced preferences.

