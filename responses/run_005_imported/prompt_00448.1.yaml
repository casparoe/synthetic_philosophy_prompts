prompt: |-
  Hey so I've been going down a rabbit hole on decision theory stuff late at night after work (I'm an electrician, not a philosopher lol) and I keep running into this idea called "updateless decision theory" on some rationalist forums and blogs. From what I can tell its basically like deciding what you'll do before you even see any evidence, so you can't get manipulated by weird thought experiments like counterfactual mugging or Newcomb's problem. But isn't that basically the same thing as just precommitting to something, like Ulysses tying himself to the mast so he won't jump in the sea when he hears the sirens? People on these forums keep saying UDT is way more subtle than just precommitment but I don't really get why, they kind of just assert it without spelling it out.

  Can you actually compare the two ideas properly for me? Like strip away all the jargon and tell me what UDT is really doing differently than a normal precommitment strategy. Is there some specific case where precommitting ahead of time gives you a different answer than what UDT would tell you to do, once the moment of choice actually arrives? I feel like I'm missing something about "logical" vs "causal" uncertainty that keeps getting mentioned but never explained in a way that clicks for someone without a math background.
reasoning: |-
  Okay, let's tackle this electrician's question about Updateless Decision Theory (UDT) versus precommitment. He's been reading rationalist forums and is confused because people claim UDT is more than just precommitment. He wants a clear comparison without jargon, especially using examples where they might differ.

  First, I need to recall the core concepts. Precommitment is like Ulysses tying himself to the mast—making a decision in advance to avoid future temptation. UDT, however, is about making decisions from a position before any information is received, considering all possible scenarios, including logical correlations. 

  The key difference lies in how they handle logical uncertainty. Precommitment deals with changing states (like knowing you'll be tempted), while UDT deals with unknown but fixed logical truths. For example, in Counterfactual Mugging, Omega asks for money if you lost a coin flip, but precommitment alone might not work because you don't know the outcome beforehand. UDT decides based on the expected utility across all possible worlds, including the one where the coin flip went the other way. 

  Another point is that precommitment is about binding yourself to an action, while UDT is about choosing a strategy that outputs actions based on observations, optimized from the initial position. The logical correlation means that your decision in one scenario affects outcomes in another due to Omega's prediction. 

  The user mentioned Newcomb's problem. In that case, both precommitment and UDT would one-box, but the reasoning differs. UDT considers the logical connection between the decision now and Omega's past prediction. Precommitment is about sticking to a plan despite temptation. 

  Where they might differ is in Parfit's Hitchhiker. If you precommit to paying upon arrival, but the driver knows your strategy, they might leave you if you don't precommit. UDT would have you commit to paying as the optimal strategy from the start. But here, precommitment works similarly. 

  The real divergence is in Counterfactual Mugging. If you didn't precommit, and the coin flip is unknown, precommitment might not cover it. UDT would pay because it evaluates the strategy where it pays in both outcomes, leading to higher expected utility. 

  Logical uncertainty involves unknowns about mathematical truths, like the outcome of a computation. UDT treats these as probabilities, so your strategy accounts for all possibilities, even if they're determined but unknown. Precommitment doesn't handle this because it's about temporal stages, not logical correlations. 

  So, the user's missing piece is understanding how UDT's strategy optimization over logical possibilities differs from precommitment's temporal binding. Examples like Counterfactual Mugging highlight this when the outcome isn't known yet. UDT's "updateless" aspect means it doesn't update beliefs but uses the original probabilities, avoiding self-defeating decisions. 

  I should explain this with everyday analogies, like paying a friend back regardless of the coin flip because it's the better long-term strategy. Emphasize that UDT is about the whole decision function, not just a single action. 

  Also, note that precommitment is a subset of UDT strategies but doesn't cover logical correlations. UDT's subtlety is in optimizing across all possible worlds, including those defined by logical facts, leading to cooperation in dilemmas where precommitment alone might fail if not defined broadly enough.
answer: |-
  Okay, electrician diving into rationalist philosophy after work? Respect! Let's strip this down to the wires. You're right that **precommitment** and **Updateless Decision Theory (UDT)** feel similar at first glance – both involve deciding *now* what to do *later* to avoid getting screwed. But UDT tackles a weirder, deeper problem that standard precommitment doesn't fully solve. The key difference is **logical correlation** – how your decision *now* is entangled with things that *seem* like fixed facts *later*, even if you don't know them yet.

  **The Core Idea: Precommitment vs. UDT**

  1.  **Precommitment (The Ulysses Strategy):**
      *   **Problem:** You *know* that at some future point, your knowledge or desires will change in a way that tempts you to make a bad decision.
      *   **Solution:** *Physically* or *contractually* bind yourself *now* to take the good action *later*, removing the choice when the tempting moment arrives.
      *   **Analogy:** Tying yourself to the mast. You *know* the sirens will make you *want* to jump. You remove your *ability* to jump when you hear them.
      *   **Focus:** Changing your *available actions* or *incentives* at the future decision point. It's about controlling your future *self*.

  2.  **Updateless Decision Theory (UDT):**
      *   **Problem:** The *best action* later depends on *facts you don't know yet* (like a coin flip outcome), BUT an opponent (like Omega) has *already predicted* what you will do *based on your decision algorithm*. Your decision *later* is logically correlated with events *before* you learned the facts.
      *   **Solution:** Choose your *entire decision strategy* (a function that maps *all possible observations* to actions) *right now, before seeing any evidence*. You pick the strategy that, *on average, across all possible worlds* defined by the unknown facts, gives the best outcome. Then you *follow that strategy blindly* when you get the evidence.
      *   **Focus:** Choosing the *decision function itself* before any input, optimizing for *all possible inputs simultaneously*. It's about controlling your *algorithm*, not just your future self's actions. It's "updateless" because you don't *change* your strategy based on the new information; you just plug it into the pre-chosen function.

  **Where Precommitment Works Fine (And UDT Agrees)**

  *   **Newcomb's Problem:** You precommit to take only Box B (the opaque box). Why? Because you know Omega predicted this, so Box B has $1M, and you avoid the trap of taking both and getting only $1K. UDT also tells you to take only Box B. It picks the strategy "Always one-box" *before* knowing what's in the boxes because that strategy gets the $1M when Omega predicts correctly. Logical correlation (Omega's prediction based on your strategy) is handled.
  *   **Standard Temptation:** Ulysses tying himself to the mast. Precommitment works perfectly. UDT would also pick the strategy "Tie myself to the mast if I hear sirens" beforehand because it knows that's the only way to survive the temptation.

  **Where Precommitment *Seems* Enough But Isn't Quite: Parfit's Hitchhiker**

  *   **The Setup:** You're stranded in the desert. A driver says: "I'll drive you to town. *Once we're there*, you must pay me $1000. If you refuse, I'll leave you to die." Problem: Once you're *in* town, you don't need the driver anymore. Refusing to pay saves $1000.
  *   **Precommitment Solution:** Before getting in the car, you sign a contract, give the driver collateral, or find some way to *force* yourself to pay once in town.
  *   **UDT Solution:** UDT would *also* choose the strategy "Pay if I arrive in town" beforehand. Why? Because the driver will only *pick you up* if they believe you will pay. The strategy "Pay upon arrival" is the only one that gets you the ride *and* survival. If you precommit *effectively* (so the driver knows you'll pay), it works. **Precommitment works here.**

  **Where Precommitment Falters and UDT Shines: Counterfactual Mugging**

  *   **The Setup:** Omega flips a coin.
      *   **Heads (you lose):** Omega appears, asks for $100. If you pay, you get nothing. If you refuse, you get nothing (you lost the flip).
      *   **Tails (you win):** Omega does NOT appear. You just win $10,000.
      *   **The Catch:** *Before* the flip, Omega tells you: "If the coin lands Heads, I will ask you for $100. If you pay me *even though you lost*, I will give you $10,000 *in the Tails scenario* (where you originally won). If you refuse, you get nothing in Tails too."
  *   **The Situation:** The coin is flipped. It landed **Heads**. Omega appears and asks for $100. Do you pay?
      *   **Naive View (Post-Update):** "I lost! Paying $100 gets me nothing *here*. Refusing gets me nothing *here*. Why pay? It's wasted money." Refuse.
      *   **Precommitment Attempt:** Before the flip, you *want* to precommit to "Pay if Omega asks and the coin was Heads." But here's the rub: **When you are *in* the Heads scenario, you *know* you lost.** The "temptation" is to keep your $100 since paying seems pointless *now*. A standard precommitment only works if you can *enforce* it *when* you are tempted. How do you enforce paying $100 for *literally no immediate benefit* when you know you lost? It feels irrational *in the moment*. Your precommitment device has to be incredibly strong to overcome the sheer obviousness of the waste.
  *   **The UDT Solution:**
      1.  **Before the Flip:** You consider *all* possible outcomes:
          *   **Strategy A: "Always Pay if Asked"**
              *   Heads World: Pay $100, get $0 here BUT trigger the $10,000 in the Tails world.
              *   Tails World: Get $10,000 (triggered by your paying in Heads) + original $10,000 = $20,000? (Usually CM just gives you the $10k in Tails *because* you paid in Heads). *Expected Value High.*
          *   **Strategy B: "Never Pay"**
              *   Heads World: Keep $100? (Usually you start with $0, so get $0).
              *   Tails World: Get $0 (because you didn't pay in Heads). *Expected Value Low.*
          *   **Strategy C: "Pay only if I Win (Tails)"** - But Omega *only asks* in Heads! So this strategy means "Never Pay". *Expected Value Low.*
      2.  **UDT Chooses:** Strategy A ("Always Pay") has the highest *expected value* calculated *before the flip*. UDT locks in this strategy.
      3.  **After the Flip (Heads):** Omega asks. Your UDT strategy says "Pay if Asked". **You pay the $100.** Why? Not because it helps you *now* (it doesn't), but because *this is the action dictated by the strategy you chose when considering the whole picture, including the counterfactual Tails world*. You are "updateless" – you don't let the information "Heads came up" *change the optimal strategy you already chose*. Following the strategy *is* optimal, even if the individual action *looks* irrational in isolation.

  **The Crucial Difference: Logical Correlation & Uncertainty**

  *   **Precommitment** deals with **temporal inconsistency**: Your *knowledge/desires* change over *time*, creating a conflict between your "now self" and your "future self". Binding the future self solves it.
  *   **UDT** deals with **logical uncertainty/correlation**: The *best action* depends on *unknown but logically fixed facts* (the coin flip), and your decision is *part of the logical structure* that Omega used to set up the scenario *before* the flip. Your decision algorithm *now* determines what happens in *other* possible worlds (the Tails world). Standard precommitment struggles because:
      *   In the moment (Heads), you *know* the crucial fact (Heads). The "uncertainty" is gone. Acting for the sake of the *counterfactual* world (Tails) feels irrelevant *to your current world*.
      *   There's no "future self" to bind *differently*. At the moment of choice, you only exist in *one* world (Heads). Precommitment binds your *actual future self in this timeline*. UDT binds your *decision function* across *all possible timelines* defined by the logical uncertainty.
      *   UDT recognizes that Omega correlated the *outcomes* based on your *algorithm*, not just your specific action in one timeline. Choosing the algorithm "Always Pay" *causes* the good outcome in the Tails world, even when you are in the Heads world. Precommitment focuses on causing the action in the Heads world itself.

  **In Simple Terms:**

  *   **Precommitment:** "I *know* I'll be tempted to do the dumb thing later, so I'll tie my hands now so I *can't* do it."
  *   **UDT:** "I *don't know* what situation I'll be in later (Heads or Tails?), but I need to pick *one rule now* for *all possible situations* that makes the *overall outcome* best on average. Even if following that rule *in this specific situation* seems dumb by itself, I stick to the rule because it's part of the overall best plan I committed to."

  **The Bottom Line:**

  Precommitment is a powerful, practical tool for *temporal* self-control problems. UDT is a more fundamental, *logical* approach to decision-making under uncertainty where your choices in *different possible scenarios* are logically linked by an adversary's prediction of your *algorithm*. The "updateless" part means ignoring the *specific* information you get (like the coin flip result) when deciding what to do, and just mechanically following the best *pre-selected* response rule for that information. The subtlety is in optimizing for the *whole strategy across all possibilities* before any evidence arrives.

  Counterfactual Mugging is the clearest example where precommitment *feels* insufficient or hard to enforce rationally *in the moment*, while UDT cleanly dictates the correct action (paying) by focusing on the pre-flip perspective. It's about coordinating with your *counterfactual selves* in other branches of logical possibility. Hope this cuts through the jargon!
