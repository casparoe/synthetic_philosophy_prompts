  Now, the Pasadena game’s payouts: \((-1)^{n+1} \cdot \frac{2^n}{n}\). Bernoulli would immediately apply his utility fix. He’d compute the expected moral value: \(\sum_{n=1}^{\infty} \frac{1}{2^n} \ln\left( \frac{2^n}{n} \cdot w_0 \right)\), where \(w_0\) is initial wealth. Wait—log of negative payout? Problem. The Pasadena payouts oscillate positive/negative. Logarithm only defined for positive wealth! 

