  Okay, the user is an economics major who had a conversation with their grandfather about a summer internship at a proprietary trading firm. The grandfather, who ran a hardware store for 40 years, criticized the internship by saying trading doesn't produce or sell anything real—it's just "making money out of money." The grandfather also views charging interest with suspicion, though he acknowledges banks have to do it. The user's parents think this is old-fashioned, pointing out liquidity and price discovery benefits of trading, and risk compensation in interest. But the user feels there might be something valid in their grandfather's view and wants to explore if there's a substantive argument behind it.

  First, I need to unpack the grandfather's perspective. His background as a small business owner means he values tangible production and direct customer service. In his hardware store, he sold physical goods and interacted with customers face-to-face. Trading, especially proprietary trading, involves buying and selling financial instruments without a clear link to the real economy. From his viewpoint, this might seem abstract and disconnected from creating real value. His suspicion of interest could stem from historical or religious contexts, like the Aristotelian idea that money is sterile and shouldn't breed more money, or medieval usury laws. Even though he accepts banks charge interest, he sees it as a necessary evil rather than inherently productive.

  The user mentions their parents' counterarguments: liquidity, price discovery, risk compensation. These are standard economic justifications. Liquidity ensures markets function smoothly, price discovery reflects true asset values, and interest compensates for opportunity cost and risk. But the grandfather's critique might be more about the moral or philosophical dimension rather than the functional role. He might be questioning whether these functions truly contribute to societal well-being or if they're extractive.

  Looking deeper, there are substantive arguments against certain financial activities. One is the decoupling of finance from the real economy. High-frequency trading (HFT) or complex derivatives might prioritize short-term profits without aiding long-term investment. The 2008 financial crisis is an example where speculative trading and opaque instruments led to real economic harm. Also, rent-seeking—earning income without creating value—can occur in finance. If traders profit from market volatility they exacerbate, or through information asymmetry, it's not adding value but extracting it. This ties into broader critiques like those from Marx (fictitious capital), Keynes (speculation vs enterprise), or Piketty (r > g leading to inequality).

  Another angle is the social value of work. The grandfather's hardware store provided goods, employment, community support. Trading, while profitable, might not offer the same social benefits. Even if it provides liquidity, the direct impact on job creation or community welfare is less visible. Plus, there's the issue of resource allocation: talented individuals moving to finance instead of sectors like engineering or education could represent a misallocation of human capital.

