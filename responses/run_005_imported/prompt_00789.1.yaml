  Start with Gustafsson’s argument: if two options are incomparable, an agent might pay to switch when pressured. For instance, A and B are incomparable. The agent has A but pays to switch to B due to uncertainty. Then, from B, pays to switch back to A. Result: same position but poorer. This mirrors the cyclic preference pump.

  Wentworth’s solution: an agent with incomparables uses the rule "only accept trades strictly better than current state." So, if holding A, won’t trade to B unless B > A. Since A and B are incomparable, neither is strictly better, so no trade occurs. Thus, avoids the pump.

  But Thornley’s counter: the hidden cost is opportunity cost. If a new option C appears, better than both A and B, the agent won’t move to it. Why? Because to trade from A to C, C must be strictly better than A. But if A and C are incomparable, they won’t trade. Even if C is superior, the agent is stuck with A, missing out.

