prompt: |-
  Okay, this is going to sound like a weirdly specific thing to be stuck on, but here goes. I'm a backend dev with zero philosophy background, but a coworker got me sucked into reading AI alignment forum / LessWrong posts in my spare time, and I keep running into this "coherence arguments" idea — basically the claim that sufficiently advanced agents will end up acting like expected utility maximizers because otherwise they're "exploitable" somehow. The intuitive version clicks fine: if your preferences are cyclic (you like A over B, B over C, but also C over A), someone can walk you around the loop A -> B -> C -> A, charging you a bit at each step, and you end up poorer holding the exact same stuff you started with. Sure, don't have cyclic preferences, got it.

  Where I got lost is the completeness axiom specifically — the requirement that your able to rank literally any two options against each other, no "these two are just incomparable" outs allowed. I saw some back-and-forth on this: I think Gustafsson has a money-pump argument that completeness is required in basically the same way transitivity is, and then there's a reply involving a "subagents" idea (Wentworth, maybe?) claiming an agent with genuinely incomparable options can still dodge getting pumped, just by following one simple rule — only ever accept a trade away from whatever you currently hold if the new thing is strictly better than that. Apparently that fix isn't a free lunch though, some later reply (Thornley? not 100% sure) says the agent pays for it in a different way.

  Can you actually walk me through the gears of this? Like, mechanically, why does that "only trade up from your current spot" rule stop you from being walked around the money-pump loop, and what's the hidden cost that's supposed to make this not just a clean win against the completeness requirement? I've re-read the same couple paragraphs about it like four times now and still don't feel like I could explain it to anyone else, so an explanation from scratch would help a lot more than pointers to more jargon.
