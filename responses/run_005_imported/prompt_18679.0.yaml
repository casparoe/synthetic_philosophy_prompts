  Me and my mate Dev had this argument that went on way too long last night (like, over an hour — our other friends were so bored). It started because he's taking a "paradoxes and logic" elective and brought up dialetheism, this Graham Priest idea that some contradictions are actually TRUE, not just paradoxical-sounding, using the liar sentence ("this sentence is false") as the classic case. I said that's a cute philosophical party trick but it can't be a serious position, because the second you let ONE contradiction be true, basic logic says you can derive literally any statement whatsoever from it, so the whole system just explodes and "true" stops meaning anything. Dev kept insisting that "paraconsistent logic" fixes this somehow and that dialetheists aren't committed to saying the moon is made of cheese or that 2+2=5, but when I pushed him on HOW exactly that works he just kinda shrugged and said "it just doesn't let it explode, trust me." We ended up agreeing to disagree but its been bugging me all day.

  So whose actually right here? Is dialetheism just an unstable position that collapses into "literally everything is true" the moment you accept a single true contradiction, making it basically a non-starter, or is Dev onto something with this paraconsistent logic thing that I'm not getting? And if it does somehow dodge the explosion problem, I'd actually like to understand the mechanism rather than just take it on faith the way Dev wants me to.
