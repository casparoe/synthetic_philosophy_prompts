  Considering the user's mention of probabilistic symmetry: lottery tickets are identical in probability, while book sentences vary. This difference might make rejecting individual beliefs in the lottery more acceptable since no single ticket stands out. In the preface, each sentence could have high individual credibility, making it harder to reject belief in any single one. This supports asymmetric treatment.

