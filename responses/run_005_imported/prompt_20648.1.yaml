prompt: |-
  I sit on my university's small interdisciplinary "Mind & Behavior" seed-grant committee -- we hand out $10-15k pilot grants to psych, philosophy, and neuro faculty for projects too preliminary to take to NIH. This round's headache is a proposal from a clinical psychologist working in the Acceptance and Commitment Therapy / Relational Frame Theory tradition, who wants to pilot a relational-framing intervention for avoidance behavior in chronic pain patients. Per our rules we sent it out to two reviewers from the cognitive/neuro side, and both came back unimpressed for the same reason: the proposal never specifies what mechanism is supposed to change -- no claim about beliefs, appraisals, schemas, anything -- it just predicts certain behavioral outcomes will shift, and one reviewer wrote that this makes the whole thing "unfalsifiable, since if it doesn't work they can always say it functioned differently in that context." The applicant's rebuttal (forwarded to me since im apparently "the philosophy person" on this committee) says this gets things backwards: her tradition's philosophy of science, which she calls functional contextualism, explicitly denies that naming an inner mechanism is the goal of a good psychological explanation, and judges claims instead by whether they let you predict and influence behavior reliably. Grading her proposal on the mechanism criterion, she says, is like refusing to fund a machine-learning paper for not explaining mechanistically why the model's weights produce the right answer, when the whole paradigm is built around not needing that. Half the committee thinks she has a real point about differing standards; the other half suspects "our frameworks are incommensurable" is just what you say when your hypothesis is built to never be pinned down enough to fail. (I vented about this to my reading group last night and someone suggested we just fund whoever writes the better prose, which, no.)

  Could you draft the decision memo I'll actually bring to committee -- a real recommendation (fund, decline, or fund with specific conditions) and the reasoning behind it, since we vote a week from Friday. I don't want three paragraphs rehearsing Kuhn and incommensurability and then a shrug; I've got colleagues who'll do that part for free. What I need is something that takes both sides at their strongest: her point that judging a contextualist project by a mechanistic paradigm's home standards isn't neutral, and the reviewers' worry that unfalsifiability doesn't stop being a problem just because you can redescribe it as a paradigm difference. And if there's some rule of thumb our committee could reuse next time a proposal like this comes up -- because it won't be the last -- I'd like the memo to actually propose one rather than just flag that the question is hard.
reasoning: |-
  Okay, let me unpack this committee dilemma. The user sits on an interdisciplinary grant committee facing a tricky proposal evaluation where philosophical paradigms are colliding. 

  First, the core tension: A clinical psychologist using functional contextualism (FC) proposes an intervention focused solely on behavioral outcomes without specifying internal mechanisms. Cognitive/neuro reviewers reject it as "unfalsifiable" since failure could always be attributed to context. The applicant counters that demanding mechanisms misunderstands her paradigm - it's like criticizing machine learning for not explaining weight matrices. 

  Hmm, the user's actual needs are very practical: 
  - They need a decisive funding recommendation (not philosophical waffling) 
  - With balanced reasoning acknowledging both paradigms' validity 
  - Plus a reusable rule for future similar conflicts 
  - All packaged in a committee-ready memo 

  The deeper challenges I see:
  1) Epistemological equity: Can FC proposals be fairly evaluated without imposing mechanistic standards? 
  2) Pragmatic concerns: Is "unfalsifiability" a fatal flaw or just paradigm difference? 
  3) Committee governance: They need consistent criteria for cross-paradigm proposals 

  Key realizations:
  - The applicant isn't avoiding mechanisms - FC explicitly rejects them as unnecessary 
  - But reviewers rightly want testable hypotheses 
  - The compromise lies in demanding precise behavioral predictions that leave no escape hatches 

  For the memo structure:
  1) State recommendation upfront (conditional funding) 
  2) Acknowledge paradigm difference isn't fatal 
  3) Impose strict outcome specification as guard against unfalsifiability 
  4) Propose "precision over mechanism" as future rule 

  The conditional funding satisfies both sides: 
  - Funds the pilot while demanding testable specificity 
  - Respects FC's epistemology without conceding on rigor 
  - Sets precedent for evaluating paradigm-neutral scientific merit 

  For the reusable rule: "Precision of behavioral prediction as falsifiability anchor" - this transcends paradigms while respecting them. Smart committees don't need paradigm unity, just shared criteria for what counts as evidence.
answer: |-
  ## Memo: Funding Recommendation for Relational Framing Intervention Pilot Grant  
  **To:** Mind & Behavior Seed-Grant Committee  
  **From:** [Your Name], Philosophy Representative  
  **Date:** [Current Date]  
  **Proposal:** Relational-Framing Intervention for Avoidance Behavior in Chronic Pain (Clinical Psychology)  
  **Recommendation:** **Fund with Specific Conditions**  

  ### Core Reasoning  
  This proposal presents a legitimate epistemological conflict between functional contextualism (FC) and mechanistic cognitive/neuro paradigms. Both perspectives have scientific merit, but demand distinct evaluation criteria. Our role is not to arbitrate philosophical supremacy but to ensure *scientifically rigorous, actionable pilot data* regardless of paradigm. The applicant correctly notes that FC prioritizes prediction/control of behavior over identifying internal mechanisms, akin to evaluating ML models by performance metrics. However, reviewers rightly demand falsifiability. **The solution is not to force mechanistic explanations but to require operational precision that prevents post-hoc evasion of negative results.**  

  ### Addressing Both Concerns  
  1. **Applicant’s Strongest Case Validated:**  
     - Judging an FC proposal solely by mechanistic standards *is* epistemologically biased. FC’s focus on contextual behavioral outcomes is coherent and NIH-stage-appropriate for a pilot. Demanding schemas/beliefs here would be like rejecting operant conditioning research for not specifying neural correlates.  
     - *Committee Takeaway:* Paradigm differences alone don’t disqualify proposals. We fund based on methodological rigor *within* the stated framework.  

  2. **Reviewers’ Falsifiability Concern Addressed:**  
     - "Unfalsifiability" is avoidable without abandoning FC. The proposal’s weakness is **insufficient specificity in predicted outcomes**, not the lack of mechanisms. Vague behavioral predictions (e.g., "reduced avoidance") allow retreat to "contextual factors" after null results.  
     - *Solution:* Mandate precise, quantifiable behavioral benchmarks tied to the intervention.  

  ### Conditions for Funding  
  Approve the grant **contingent on applicant revising the proposal to include**:  
  1. **Operationalized Primary Outcomes:** Define *exactly which behaviors* constitute "avoidance" (e.g., "minutes/day engaging in prescribed physiotherapy," "frequency of cancelling social plans due to pain fear"), with baseline measures and predicted magnitude of change.  
  2. **Pre-Specified Contextual Boundaries:** Detail which patient/environmental factors would trigger a "contextual variation" reinterpretation *before data collection*. If null results occur outside these bounds, the intervention fails.  
  3. **Falsifiability Threshold:** State clear criteria for "success" (e.g., "≥30% reduction in avoidance behaviors in 70% of completers") and "failure" (e.g., "no statistically significant change or worsening").  

  ### Proposed Rule of Thumb for Future Inter-Paradigm Proposals  
  **The Precision Criterion:**  
  > *"Proposals must specify testable outcome predictions with such operational clarity that (a) results can unambiguously support or contradict the hypothesis, and (b) ad-hoc appeals to paradigm differences cannot explain away null findings without pre-defined, measurable contextual moderators."*  

  ### Why This Works  
  - **Respects Paradigms:** FC isn’t forced into mechanistic language; mechanistic reviewers get falsifiable thresholds.  
  - **Pilot-Appropriate:** Focuses on generating actionable preliminary data (feasibility, effect size) for future NIH applications.  
  - **Prevents "Incommensurability" Deadlock:** Forces concrete benchmarks transcending philosophical divides.  
  - **Sustainable:** Applies to any future proposal (e.g., enactivist cognition, predictive processing).  

  **Vote to fund conditional on revised proposal addressing points 1–3 above by [Date].** The revised protocol must be approved by the committee chair to ensure adherence. This leverages pilot funding’s purpose while upholding scientific accountability.  

  ---  
  **Signature:** [Your Name]  
  **Attachment:** [Draft revision request for applicant]  

  ### Key Arguments Preempted  
  - *"But FC rejects mechanisms!"* → We’re not demanding mechanisms; we’re demanding precision.  
  - *"Reviewers don’t understand her paradigm!"* → Their core concern (testability) is valid and addressed.  
  - *"This is too burdensome!"* → Pilot studies require outcome clarity regardless of framework. NIH will demand far more.  
  - *"What if results are ambiguous?"* → Pre-defined thresholds force decisive interpretation. Ambiguity = failure in a pilot.
