  ### (1) Intuition for the Axioms and their Tension

  **IIA (Independence of Irrelevant Alternatives):** 
  Imagine you and I are bargaining over a set of possible outcomes (the feasible set). We agree on a solution (a specific outcome) for a given bargaining problem. Now, suppose we remove some outcomes that were not chosen. IIA says that the solution should not change. Why? Because the solution was the best according to some criteria, and removing alternatives that weren't chosen shouldn't affect that. 

  Geometrically, think of the feasible set as a convex set in the utility space (for two players, a region in the plane). The solution is a point in this set. If we shrink the feasible set to a smaller convex set that still contains the original solution point and the disagreement point, then IIA requires that the solution for the new smaller set is the same as the original. 

  The intuition behind IIA is stability: the solution should not be influenced by options that are irrelevant because they are not as good as the solution. However, this can be problematic when the feasible set expands in a way that changes what we might consider "fair".

  **Individual Monotonicity (for KS):**
  This axiom says that if the feasible set expands in a way that improves the best possible outcome for one player (without affecting the other player's best possible outcome), then that player should get at least as much as before. 

  The KS solution uses the "ideal point" which is the point representing the maximum utility each player can get in the feasible set (subject to the other player getting at least their disagreement utility). So, if we expand the feasible set so that player 1's maximum possible utility increases (and player 2's maximum remains the same), then player 1 should not get less in the new solution.

  Geometrically, the ideal point moves only in the direction of one player. The KS solution is designed to be sensitive to changes in this ideal point.

  **Why the Tension?**
  The tension arises because IIA focuses on the solution point and ignores how the set changes as long as the solution remains feasible. But individual monotonicity cares about how the set changes at the boundaries (especially the ideal point). 

  When the feasible set expands, IIA might require that the solution remains the same if the original solution is still feasible and the expansion doesn't change the relative arguments for that point. But individual monotonicity might require that a player gets more if the expansion gives that player new opportunities. 

  In other words, IIA is conservative (stick to the original choice) while individual monotonicity is progressive (adjust when the opportunity set improves for one player). 

  Roth (1975, 1977) showed that under standard conditions (efficiency, symmetry, affine invariance) the two axioms are incompatible. You cannot have both.

