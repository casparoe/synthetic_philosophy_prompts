  Then, due to a technological improvement, the firm can now achieve higher productivity. The new feasible set S2: now the firm can achieve a maximum utility of 2 (if it pays the worker nothing, which is not allowed by the disagreement point, but at a positive wage it can get up to 2). The worker's maximum utility is still 1 (if the firm takes zero profit). 

  The Nash solution in S2: (2,0.5) -> the firm gets 2 and the worker gets 0.5. 
  The KS solution: (1.333,0.666) -> the firm gets 1.333 and the worker 0.666.

  Which is fair? 

  The firm might argue (Nash): "In the original situation, we split 50-50. Now, the expansion is due to our technology, so we should get the entire additional surplus. The worker should still get 0.5." 

  The worker might argue (KS): "The expansion has increased the potential for the firm, but it also means that the pie is bigger. The relative bargaining positions have changed: the firm can now achieve much more, so we should both benefit. I should get more than 0.5 because even though my maximum hasn't changed, the firm's gain is so large that it can afford to give me a little more without sacrificing much."

  I find the KS solution more compelling in this case. Why should the worker not share in the gains from the firm's improved technology? The worker's contribution is still essential. The firm cannot operate without the worker. The expansion means that the joint surplus is bigger, and it seems fair that both parties should improve their outcome. 

  In the Nash solution, the worker's outcome does not improve at all. This seems to ignore the fact that the bargaining context has changed. The IIA axiom is too focused on the original bargaining point and doesn't react to new opportunities for one party.

  Therefore, I find individual monotonicity more normatively compelling. It ensures that when the set expands in a way that benefits one player disproportionately (by raising their ideal point), then both players should benefit. The KS solution achieves this by linking the solution to the ideal point.

  However, there are situations where IIA might be more appealing. For instance, if the expansion is due to an option that is very unfair to one party, then it might be irrelevant. But in the example above, the expansion seems to be a general improvement in the firm's productivity, so it should be shared.

  In summary, the trade-off is between stability (IIA) and responsiveness to changes in opportunities (monotonicity). In dynamic environments where the bargaining set evolves, I believe monotonicity is more fair.
