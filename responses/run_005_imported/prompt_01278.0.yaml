  ### (1) Intuitive Explanation of IIA vs. Individual Monotonicity  
  **Independence of Irrelevant Alternatives (IIA):**  
  Imagine two people dividing a cake. They agree on a "fair" split (e.g., 50/50) based on the available options. Now suppose a new, larger cake becomes available, but it includes the original cake as a subset. IIA demands that if the original 50/50 split is *still possible* in the new cake, the solution shouldn’t change—even if the new cake offers better splits. The rationale: Options that weren’t chosen originally shouldn’t alter the outcome. Geometrically, IIA anchors the solution to the original agreement, ignoring expansions of the feasible set unless they directly "pull" the solution away.  

  **Individual Monotonicity (for KS):**  
  Now imagine the cake expands, but only in a way that benefits one person more. For example, the baker adds extra frosting that only one person loves. Individual monotonicity requires that this person should get at least as much as before—they shouldn’t lose out because their *potential* maximum share increased. The "ideal point" (the best each could get if the other conceded everything) shifts. Geometrically, KS ties the solution to this ideal point: if the feasible set stretches toward one player’s axis, that player’s allocation shouldn’t decrease.  

  **Why the Trade-off?**  
  - IIA is **backward-looking**: It fixes the solution to past agreements, resisting change unless the original split becomes infeasible.  
  - Individual monotonicity is **forward-looking**: It adjusts the solution when new opportunities favor one player, redistributing gains toward them.  
  The tension arises because expanding the feasible set often does two things:  
  1. It may make the old solution seem outdated (favoring monotonicity).  
  2. It may leave the old solution feasible (favoring IIA).  
  Satisfying both axioms is impossible (as Roth showed) because they respond oppositely to expansions: IIA holds the line; monotonicity rewards opportunity.  

