  ### The Debate's Name & Core Issues  
  **Name**: This is a debate about **causation by omission** (or "negative causation"), intersecting with **proximate vs. root cause** analysis. Philosophers like David Lewis discuss "causation as influence," where omissions *can* be causes if they're "dependence-makers" (i.e., outcomes depend on them).  

  ### What Both Are Missing  
  1. **Dana's blind spot**:  
     - Confuses *causal contribution* with *accountability*. Even if Sam's omission was causal, stating "you’re a cause" personalizes it. Blameless postmortems should ask: *Why* was the review skipped? (e.g., unclear ownership, alert fatigue).  
     - **Fix**: Reframe omissions as *system gaps*: "The review step failed" not "Sam failed."  

  2. **Sam's blind spot**:  
     - Overcorrects by denying omissions as causes. In systems, *inaction* is often a key link (e.g., a firewall *not* blocking traffic). Duty-bound omissions are valid in causal chains.  
     - **Fix**: Accept that omissions *are* causal factors, but stress that blameless analysis examines *why* the context allowed it (e.g., "Why was there no automated guardrail?").  

  ### Expert Perspective  
  A systems safety expert (e.g., Sidney Dekker) would argue:  
  - **Causation**: Omissions *are* causes when tied to roles/dependencies (validating Dana).  
  - **Blamelessness**: But naming individuals as "causes" defeats the purpose. Focus on:  
    - Why did the system rely on one person’s vigilance?  
    - Why was the dependency not documented?  
    - Why did "review required" not catch the issue?  
  This shifts from "who failed" to "what failed."  

  **Resolution tip**: Replace "Sam caused X" with "The approval process didn’t flag the column dependency." This separates causation from blame.
