prompt: |-
  Ok so I've been slogging through Buchak's risk-weighted expected utility theory for my quals list and theres something bugging me. Apparently REU isnt partition-invariant the way plain EU is -- so whether you treat the "safe" outcome of a gamble as one coarse-grained lump or spell it out into a bunch of finer-grained possibilities can actually flip whether REU ends up recommending the risk-averse, Allais-style choice. Can you cook up your own simple example -- a few outcomes, some probabilities, a toy risk function r -- where coarse-graining vs. fine-graining the exact same gamble flips REU's verdict, and then in a couple sentences tell me whether that seems like a fatal problem for REU as a theory of rational risk-aversion, or something Buchak has a decent reply to.
