answer: |-
  Here is a dialogue between two political theorists, Dr. Elara Vance (defending citizenship as the franchise boundary) and Dr. Marcus Aris (advocating for enfranchising long-term non-citizen residents). Both explicitly acknowledge the intractable nature of the boundary problem while rigorously defending their positions and challenging each other's core assumptions.

  **Setting:** A coffee shop near City Hall, after a council hearing on the proposed measure.

  **Characters:**
  *   **Dr. Elara Vance:** Political Theorist, specializing in democratic legitimacy and boundaries. Defends citizenship requirement.
  *   **Dr. Marcus Aris:** Political Theorist, specializing in democratic inclusion and migration. Advocates for enfranchising long-term residents.

  **(The dialogue begins as they sit down with coffees, reflecting on the hearing)**

  **Marcus Aris:** Elara, I thought the testimony from that long-term resident – paying taxes, serving on committees, kids in schools for a decade, yet voiceless – crystallized the moral urgency. The All-Subjected Principle *must* apply locally. If the city’s coercive power binds her daily life – zoning her property, funding her kids' schools, policing her streets – how is her subjection less relevant than mine?

  **Elara Vance:** Marcus, I grant the intuitive pull, truly. But the boundary problem doesn’t vanish; it just shifts. *Why* is local subjection the relevant kind? You dismiss federal immigration law’s coercion as somehow different, but isn’t that arbitrary? The federal government can deport her, fundamentally altering her life far more than a zoning variance. If "subject to coercion" is the criterion, doesn’t the federal electorate have a stronger claim? Yet you confine the vote to the *local* demos. You’ve relocated the boundary, not solved it.

  **Marcus Aris:** Fair point. But we distinguish levels of government for practical and normative reasons. The *kind* of subjection matters. Federal coercion determines entry/exit – the *condition* of presence. Local coercion governs the *terms of everyday life within the community* where she’s rooted. She’s subject to the *shared local project* – building schools, regulating noise, maintaining parks. That’s qualitatively different from the border-control function. The All-Subjected Principle, applied contextually, demands inclusion where the laws directly shape the fabric of communal existence.

  **Elara Vance:** "Contextually" is doing heavy lifting. Who defines the "shared local project"? Isn't that just the current demos defining itself? It’s circular. And what about the tourist fined for jaywalking? Subject to local coercion. The commuter paying local sales tax? Subjected. Why draw the line at "long-term resident"? Your principle, if taken literally, points towards near-universal suffrage for anyone momentarily affected – the very overbreadth problem you rightly critique in the All-Affected-Interests view. You need an arbitrary line *within* subjection – duration, intensity? – which is just another boundary problem.

  **Marcus Aris:** Duration and rootedness *aren't* arbitrary here! They signify investment, stakeholding, and the practical capacity to engage meaningfully. A tourist isn’t woven into the community’s future; a long-term resident is. We use duration for residency requirements *within* the citizenry all the time. It’s a pragmatic, democratically functional proxy for sustained subjection and stakeholding. It avoids the absurdity of enfranchising transients while capturing those demonstrably subjected *and* committed.

  **Elara Vance:** Pragmatic, yes. But democratically principled? You rely on a proxy that itself needs justification. Why 5 years? Why not 2 or 10? The boundary problem resurfaces. More fundamentally, Marcus, you sidestep the core issue of *membership*. Citizenship isn’t *just* tradition; it signifies a reciprocal bond – not just being subjected, but accepting *responsibility* for the collective self-determination of a specific polity across *all* its levels and time horizons. Non-citizen residents benefit from the national framework enabling their presence but haven't undertaken the full commitment to its perpetuity and defense. Local voting severs that holistic bond.

  **Marcus Aris:** Elara, that "holistic bond" argument feels like retrofitting justification onto a contingent, often unjust, reality. Citizenship boundaries *are* drawn arbitrarily – by birthright accidents, by exclusionary naturalization laws, by historical conquest. To say someone paying property taxes for a decade, shaping the community via civic work, and sending kids through schools lacks "responsibility" or "commitment" is perverse! They demonstrate commitment daily. Denying them a vote on the schools their taxes fund and their children attend isn't upholding principle; it's imposing a second-class status based on a national boundary irrelevant to the *local* "collective self-determination" you mentioned. The reciprocity exists *locally*.

  **Elara Vance:** But can local self-determination be entirely severed from the national context? The city exists within a federal system. Its resources, authority, even its existence, depend on the national constitutional order upheld by citizens. Granting local suffrage without citizenship creates a class of "denizens" with fragmented political identity – invested locally but without a stake or voice in the larger structure that ultimately secures and defines the local space. Doesn't that potentially undermine the legitimacy of the national demos and its decisions regarding immigration and national boundaries? The boundary problem isn't just *who votes here*; it's *how the 'heres' relate*.

  **Marcus Aris:** You risk making the perfect (a unified, clear national demos) the enemy of the locally democratic good. People live concretely, locally. For the decisions that most immediately shape their daily lives – land use, education, local services – their subjection and stake are undeniable. Saying they must wait for naturalization, a process often long, expensive, and controlled by that same national demos they're excluded from, perpetuates a kind of democratic Catch-22 for integrated residents. It privileges the national boundary, drawn with its own historical baggage and power dynamics, over the lived reality of community membership. The All-Subjected Principle, focused on the *level of governance doing the coercing*, provides the clearest, most normatively defensible line *for that level*, even if it doesn't solve the meta-problem.

  **Elara Vance:** And you risk infinite regress. If "level of coercion" defines the demos, what about neighborhood associations? Homeowner associations with rule-making and fining power? Should only residents vote there? What defines "resident"? The boundary problem replicates downwards endlessly. Citizenship, for all its flaws and contingencies, provides a *stable, recognizable, and reciprocal* threshold across the polity. It signifies a mutual commitment: the individual to the nation's ongoing project (including defense, constitutional fidelity), the nation to the individual (full rights, protection). Local enfranchisement without citizenship breaks that reciprocity and introduces an unstable, potentially contradictory, multiplicity of demoi. It doesn't resolve the boundary problem; it creates new ones.

  **Marcus Aris:** Stability isn't an inherent democratic value if it entrenches exclusion. And reciprocity *is* established locally through taxes, participation, and shared fate. The "multiplicity of demoi" exists already – states, cities, districts. Adding integrated residents to the *local* demos simply aligns the voting body with the community subject to those specific laws. The instability you fear is theoretical; cities like Takoma Park function fine. The real instability is the democratic deficit faced by people like our testifier – integral to the community yet formally powerless. We manage the boundary problem practically every day in countless ways. Why not manage it here, locally, to include those demonstrably subjected and invested? The perfect, universal solution to the boundary problem is illusory, but locally, we can choose a more inclusive, pragmatically justified line.

  **Elara Vance:** And I maintain that line should remain citizenship, flawed as it is, because it represents the foundational, reciprocal commitment upon which the entire structure rests, preventing fragmentation. But Marcus, I concede your point about the profound *local* democratic deficit is powerful. Perhaps the boundary problem's insolubility means we must choose based on competing democratic values – inclusion versus holistic membership – rather than finding a single "correct" line. I remain unconvinced your line is stable or principled enough, but I understand the moral weight behind drawing it where you do.

  **Marcus Aris:** And I understand your fear of fragmentation, Elara. Perhaps the best we can do is acknowledge the tragic knot Whelan identified, and choose the line that minimizes the most salient injustice *in this specific context*. For me, that’s the injustice of permanent local subjection without representation for those who are demonstrably part of the local community fabric. The boundary problem endures, but we can still strive for a more locally democratic resolution.

  **(They sip their coffee, the unresolved tension hanging in the air, a mutual acknowledgment of the profound puzzle at democracy's core.)**
