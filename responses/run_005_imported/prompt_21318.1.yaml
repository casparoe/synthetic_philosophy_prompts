answer: |-
  The rain lashed against the Observatory windows, blurring the city lights below into streaks of smudged gold. Inside, the only illumination came from the humming banks of monitors displaying complex, shifting probability matrices. Lysander traced a line of code on one screen – a cascading chain of *if-then* statements branching into infinity. He knew, with chilling precision, what each branch held for a specific life.

  He wasn’t predicting. Prediction was crude, probabilistic. Lysander *knew*. The Institute for Applied Epistemics had perfected the Resonance Engine: a device that didn’t just model reality, but mapped the *inherent dispositions* of individuals. It revealed, not what someone *would* do, but what they *would freely choose* to do, given any conceivable set of circumstances. It saw the shape of their will in the void before action.

  His current subject was Rowan Hayes. Lysander knew Rowan would choose scrambled eggs over oatmeal tomorrow. He knew Rowan would impulsively buy the blue scarf, not the red, if he passed that shop on Elm Street. He knew, with absolute certainty, that if Rowan received a specific, distressing phone call while standing on the North Bridge at 3:07 PM next Tuesday, he would jump.

  This last knowledge was a cold stone in Lysander’s gut. Rowan wasn’t suicidal. He was resilient, generally optimistic. But the Engine revealed a hairline fracture, a unique confluence of temperament, recent unspoken anxieties, and the *specific* phrasing of that call – "It’s about your sister, the accident… it’s worse than they said" – that, delivered precisely at that vulnerable moment, on that rain-slicked bridge, would trigger a despairing lunge into the churning river below. Rowan would choose it, freely, irrevocably.

  The knowledge existed prior to any decision Lysander made. It was simply *there*, a fixed point in the landscape of Rowan’s potential. Like knowing the precise weight needed to tip a perfectly balanced scale.

  Lysander’s colleague, Dr. Aris, saw only utility. "Think of the lives saved, Lysander!" Aris had argued earlier, gesturing wildly at the global threat matrix on another screen – the emergent viral strain, Kappa-7, projected to spiral out of control in three months without decisive, pre-emptive intervention. "We know who can withstand the pressure, who will make the right calls under extreme duress. We *know* Rowan Hayes, if placed in Sector Command during the critical window, will *freely choose* the containment protocol that saves millions. He’s uniquely suited! It’s not coercion; it’s optimal placement!"

  Aris had used the Engine before. Lysander remembered Subject 23, Elara Voss. Aris had known that placing Elara in a high-stakes negotiation with her estranged father would trigger a specific, advantageous emotional outburst that secured a vital treaty. Elara had raged freely, authentically. The treaty held. Aris called it elegant resource allocation. Lysander had seen the haunted look in Elara’s eyes months later, the lingering sense of being… used. Like a prop moved onto a stage precisely to deliver a pre-known line.

  Now, Lysander stood before the console controlling personnel assignments for the nascent Kappa-7 response. One command would place Rowan Hayes, an unassuming logistics analyst, into the crucible of Sector Command during the predicted critical phase. The Engine’s output was unequivocal: placed there, facing the cascading horror of the outbreak, Rowan Hayes would *freely choose* the necessary, brutal containment strategy. He wouldn’t break; he would rise, grimly, to the occasion. Millions would live because of his choices.

  The alternative was… uncertainty. Other candidates existed, but their counterfactuals were murkier, less reliable. The Engine showed higher probabilities of hesitation, catastrophic error. Assigning someone else was a gamble with planetary stakes.

  Lysander’s hand hovered over the assignment key. He glanced at a secondary monitor showing a live feed. Rowan was leaving his apartment, oblivious, heading towards the bridge for his usual Tuesday walk. The rain was easing. The critical window for *that* other, smaller tragedy was approaching.

  He could prevent it easily. Divert Rowan’s route. Block the call. Simple interventions to erase a single, pre-known moment of despair. But that felt different. That was stopping a bullet already fired. Placing Rowan in Sector Command was different. It was *choosing* the battlefield *because* he knew, with absolute prevolitional certainty, how Rowan would fight on it. He wasn’t witnessing a choice Rowan was destined to make; he was constructing the stage knowing the exact script Rowan would improvise.

  He recalled Aris’s triumphant smirk after Elara Voss. *"She did it exactly as foreseen! Perfectly!"* Not "She did the right thing," or "She was brave," but "*Exactly as foreseen*." The brilliance of the choice was measured by its fidelity to the Engine’s script.

  On the bridge feed, Rowan paused, leaning against the railing, looking down at the dark water. Lysander’s finger twitched towards a different key – the one that would send a harmless distraction, a notification about a delayed package, to Rowan’s phone right now. It would pull him away from the railing before the call could come. A small mercy, easily enacted.

  But his gaze snapped back to the Kappa-7 projection. The numbers representing potential deaths flickered upwards with terrifying speed. The Engine’s certainty about Rowan in Command was the only solid ground in a crumbling landscape.

  Was it respect for Rowan’s freedom to place him where he would *freely* make the heroic choice? Or was it the ultimate manipulation, selecting him precisely *for* that known, predetermined performance? Was Lysander the guardian of possibility, or the casting director Aris had become, slotting actors into roles he’d already seen them play perfectly in the private theatre of the Engine?

  He looked at Rowan on the bridge, a man about to unknowingly face a test Lysander could prevent. Then he looked at the Kappa-7 model, a world about to face a test that Rowan, placed just so, could pass.

  Lysander’s hand moved, not to the distraction key, but to the personnel assignment console. He entered his authorization code. The command flashed: **HAYES, R. - ASSIGNED: SECTOR COMMAND - KAPPA-7 RESPONSE - EFFECTIVE IMMEDIATE.**

  He watched the confirmation appear. On the bridge feed, Rowan’s phone buzzed. Not the package notification. A new, official summons. Sector Command. Immediate deployment. Rowan’s face registered shock, then a dawning, resolute determination. He turned sharply from the railing and strode back towards the city, towards his new, preordained role.

  Lysander leaned back, the cold stone in his gut now an iceberg. He had saved millions, potentially. He had also, with perfect foreknowledge of Rowan’s free choices, sculpted his circumstances to elicit precisely the performance the world needed. The rain streaked the window like tears on a face he couldn’t see clearly anymore. He had averted one tragedy by orchestrating another kind of performance, one where the actor’s freedom felt less like a gift and more like a lever he’d pulled. The silence of the Observatory hummed with the uncomfortable weight of the choice made, the knowledge possessed, and the freedom meticulously, irrevocably, arranged.
