prompt: |-
  I'm taking a graduate seminar this term, cross-listed between the philosophy and computer science departments, on formal models of rational belief for agents who are uncertain about logic as well as about the world, and this week's session centered on Garrabrant et al.'s 2016 paper "Logical Induction." As I understood the setup, a logical inductor is a computable sequence of "prices" that a market of traders assigns, day by day, to sentences of a formal language, subject to the Logical Induction Criterion: no efficiently computable trading strategy can exploit the sequence for unbounded profit as deductive time passes. Our professor spent most of the session on the result she considers the paper's strongest philosophical payoff: logical inductors satisfy an asymptotic, trader-theoretic analogue of what's sometimes informally called "conservation of expected evidence" -- no efficiently computable strategy can reliably predict, in advance, which direction the market's credence in a fixed sentence (call it φ) will move on the following day. She presented this as evidence that logical induction genuinely extends Bayesian rationality to logically non-omniscient agents, rather than merely patching around the problem.

  That's the part I haven't been able to talk myself into, and I would like some help pressure-testing it before I commit to it in my term paper. In the ordinary Bayesian case, conservation of expected evidence is compelling because a credence can only move in a predictable direction if the agent is failing to use evidence that is, in some sense, already available to a more attentive version of itself -- the future self's information really does exceed the past self's. But a logical inductor's credence in φ can swing sharply between day n and day n+1 purely because the market has been handed one more round of internal deduction and trading; nothing about the world, and no new sentence, has been observed in between. In discussion section, a classmate argued that this disanalogy is illusory: for a logically non-omniscient agent, completing one more step of deduction just is a piece of genuine evidence (if nothing else, about the agent's own future outputs), so the empirical and logical cases are not so different after all. I was not persuaded -- this seems to trade on a much thinner notion of "evidence" than the one doing the normative work in the ordinary case -- and I suspect the worry is a cousin of older complaints about logical omniscience and the problem of old evidence (I recall, perhaps imprecisely, that Ian Hacking raised something along these lines about personal probability decades ago).

  Could you write a sustained argument, of roughly 700 to 900 words, for the position that logical induction's conservation-of-expected-evidence-like guarantee, however mathematically genuine, fails to vindicate deductive belief revision as rational in the way that ordinary conservation of expected evidence vindicates empirical belief revision -- because the logical inductor's formalism contains no internal analogue of the "already-available-but-unused evidence" that does the normative work in the standard Bayesian argument? Please engage directly with my classmate's objection rather than setting it aside, feel free to construct the strongest version of the opposing view before explaining why it ultimately fails, and say so plainly if you end up more persuaded by the opposing view than by my own.
reasoning: |-
  Okay, I need to help this graduate student with their term paper on logical induction and conservation of expected evidence. They're struggling to see how the logical inductor's version of this principle truly extends Bayesian rationality to logically non-omniscient agents. 

  First, I should recall the key concepts. The student mentions Garrabrant's logical induction paper where a logical inductor assigns prices to sentences over time. The "conservation of expected evidence" analogy here means no trader can consistently predict the direction of belief changes from one day to the next. But the student points out a crucial difference: in Bayesian updating, belief changes come from new external evidence, while in logical induction, changes come from internal deduction and trading.

  Hmm, the classmate's objection is that completing another deduction step itself constitutes "evidence" - perhaps about the agent's future outputs. The student finds this unpersuasive, thinking it waters down the concept of evidence. I remember they referenced Ian Hacking's work on old evidence too.

  I need to build a strong argument that the logical induction case lacks the normative force of the Bayesian version. The core difference seems to be about what counts as "already-available" evidence. In Bayesianism, predictable belief drifts indicate you're ignoring accessible information. But for logical inductors, the information that would justify belief changes isn't necessarily accessible yet - it's generated through the deduction process itself.

  Let me structure this carefully. First, I should explain why the Bayesian principle is normatively compelling - it's about agents failing to fully utilize their current epistemic situation. Then contrast this with logical inductors where the "evidence" emerges through the very process of deduction over time. The key point is that in Bayesianism, the evidence exists independently; in logical induction, it's created by the system's operations.

  I'll need to directly engage the classmate's view that deduction steps are evidence. But we should distinguish between "evidence" as inputs versus as outputs. Deduction produces new logical facts, but these weren't latent in the prior state - they're computational achievements. Calling this "evidence" risks conflating the map with the territory.

  The student suspects this relates to Hacking's old evidence problem. That's relevant - if evidence is already known, why does it change beliefs? But here it's inverted: the "evidence" didn't exist before the deduction. 

  For the conclusion, I'll argue that while logical induction is computationally impressive, its conservation principle doesn't carry the same normative weight. The absence of predictable belief drifts here reflects computational balance, not rational integrity. It's solving a different problem than Bayesian updating.

  I should be fair to the opposing view though. Maybe in a deep sense, all belief revision is computational. But I think the student's intuition is right - there's a qualitative difference between updating on external events versus internal computations. The term "evidence" is doing different work in each case.

  The word count target is 700-900 words. I'll aim for a clear thesis early on, then develop the contrast, address the classmate's point, and end with why this matters for the rationality claim. If I find myself agreeing more with the classmate, I'll say so - but currently I side with the student's skepticism.
answer: |-
  ## The Illusion of Rational Parity: Why Logical Induction's "Conservation" Fails to Vindicate Deductive Belief Revision

  Your skepticism is astute. While the logical induction (LI) framework brilliantly achieves its formal goal—preventing exploitable prediction of *direction* in credence updates for fixed sentences—this guarantee lacks the normative force of the classical Bayesian conservation of expected evidence (CoEE). The core reason lies precisely in the disanalogy you identified: the absence of "already-available-but-unused evidence" within the LI formalism, which is the bedrock of CoEE's normative power in empirical updating. Engaging with your classmate's objection reveals why stretching the concept of "evidence" to encompass internal deduction steps ultimately undermines, rather than supports, the claim that LI extends Bayesian rationality seamlessly.

  **The Normative Core of Classical CoEE: Accounting for Latent Evidence**
  Bayesian CoEE states that your current expectation of your future credence in a proposition `φ` must equal your current credence in `φ`. Formally: `P_n(φ) = ∑ P_n(E_i) * P_{n+1}(φ | E_i)`, where `{E_i}` partitions the possible evidence you might receive. This principle derives its normative bite from the nature of the `E_i`. These represent *conceivable, mutually exclusive states of the world* that are *already defined* relative to your current information partition. Crucially:
  1.  **Epistemic Availability:** The `E_i` represent potential observations whose *meaning* and *relevance* are understood *now*, even if you don't know which one will occur. Learning `E_i` simply reveals which pre-defined possibility is actual.
  2.  **Causal Externality:** The evidence `E_i` originates *outside* the agent's belief state. It's an exogenous input about the world.
  3.  **Normative Failure Condition:** Violating CoEE means you are *currently* failing to incorporate the *implications* of the *possibility* of seeing `E_i`. If you could predict the *direction* of your update upon seeing `E_i`, it signals that your current credence `P_n(φ)` hasn't fully accounted for the *already-available* implications of the `E_i`'s potential occurrence. Your future self isn't learning something fundamentally *new* about `φ`'s relation to the world; they are merely resolving an uncertainty *you already knew was relevant*. Predictable drift indicates current irrationality—an oversight in your present probabilistic reasoning.

  **Logical Induction's Update Mechanism: Generating, Not Revealing, Evidence**
  Contrast this with the LI's update between day `n` and `n+1`. The shift in the market's credence for `φ` stems *entirely* from:
  1.  **Internal Computation:** The deductive process churning out new theorems (`D_n`).
  2.  **Internal Market Dynamics:** Traders (exploiting computable patterns) submitting new orders based on `D_n` and previous prices.

  *No new external observation occurs.* The change is driven by the system's own computational labor and internal financial feedback loops. This is fundamentally different from learning `E_i`.

  **Addressing the Classmate: "Deduction as Evidence" and its Thinness**
  Your classmate argues that completing another deduction step *is* "genuine evidence," perhaps about the agent's future outputs. Let's construct the strongest version:

  *   **The Argument:** For a logically non-omniscient agent, the output of its own deduction procedure *is* a genuine piece of evidence. It learns "My theorem prover output `D_n` on day `n`." This `D_n` *is* new information about the world: specifically, about the computational outputs of this particular agent. Predicting the credence shift based on patterns in prior deductions is akin to predicting how seeing specific experimental results will shift a scientist's belief. Furthermore, the LI formalism *treats* the deductive state `D_n` as an input to the traders on day `n+1`.

  *   **Why it Ultimately Fails:** While technically correct that `D_n` is a new input, this view conflates *formal input* with *normatively significant evidence* in the Bayesian sense, fatally weakening the concept:
      1.  **Lack of Pre-Defined Relevance:** The `E_i` in Bayes are understood *in advance* to be relevant to `φ`. The relevance of `D_n` to `φ`, however, is often *discovered* by the deduction process itself. Before day `n`, the agent may have no conception *that* a specific lemma `L` (part of `D_n`) is crucial for `φ`, nor what `L` even *is*. The "evidence" `D_n` isn't revealing a pre-defined state of an understood possibility; it's generating *new* logical content and *new* inferential connections. Its relevance isn't latent; it's constructed.
      2.  **Self-Generated "Evidence":** `D_n` isn't an observation about an external world; it's an output of the agent's own internal computational machinery. While one could frame this as "evidence about the machine," this becomes a meta-observation divorced from the *logical content* concerning `φ`. The normative force of CoEE stems from evidence about the *object of belief* (`φ`'s relation to the world), not about the *believing mechanism*. Predicting a credence shift based on patterns in the market's *own* prior internal processing doesn't indicate a failure to account for *logical* knowledge; it indicates a failure to outsmart the *market algorithm*.
      3.  **The Problem of "Already Available":** The core of your worry hits home. In Bayes, predictable drift signals unused *currently available* evidence (the implications of the `E_i`). In LI, the "evidence" `D_n` *did not exist* and was *not available* on day `n`. Its generation *is the computational work of overcoming non-omniscience*. There was no "implication" of `D_n` for `φ` that the day `n` agent *could* have rationally considered but failed to; `D_n` itself, and its connection to `φ`, were beyond its ken. Preventing predictable drift here doesn't vindicate the *rationality* of the day `n` state; it merely shows the market algorithm is computationally inscrutable *enough* day-to-day. It's a constraint on *exploitability*, not a sign of *epistemic integrity* regarding `φ`.

  **Conclusion: Computational Balance vs. Rational Integrity**
  The LI guarantee against predictable credence drift is a remarkable *computational* achievement. It ensures the market is dynamically inscrutable to efficient traders. However, it does not successfully recapture the *normative essence* of Bayesian CoEE as a principle of rational belief maintenance. The fundamental disanalogy lies in the source and nature of the update trigger. Bayesian updates respond to exogenous evidence whose relevance is understood in advance; predictable drift indicates a current failure to integrate known possibilities. LI updates are driven by endogenous computation generating novel logical content and connections; predictable drift would indicate a computational pattern exploitable by traders, not necessarily a *rational* failing in the agent's current *logical* grasp of `φ`. Your classmate's objection, while highlighting the formalism's treatment of `D_n` as input, stretches the concept of "evidence" thin enough to lose the normative force carried by genuine empirical observation and its pre-defined relevance structure. Logical induction provides a powerful model for *managing* logical uncertainty in a computationally bounded setting, but its "conservation" principle reflects the dynamics of a well-balanced market, not the deep rational coherence that makes Bayesian CoEE a cornerstone of normative epistemology. The "already-available-but-unused evidence" that powers the normative argument in the empirical case finds no true internal analogue in the logical inductor's deductive churn.
