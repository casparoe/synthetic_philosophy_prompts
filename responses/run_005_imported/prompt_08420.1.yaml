answer: |-
  You're grappling with one of the most profound and unsettling questions in ethics, and your instincts are spot on – your friend's summary, while capturing a *core element* of Nagel's (and Williams') argument, is a significant oversimplification. The reality of "moral luck" is far messier and more philosophically troubling than simply saying "only intent matters, outcomes are luck, so judgments are unfair."

  Here's a breakdown of Nagel's and Williams' arguments and why this isn't a clean answer:

  1.  **The Core Insight (What Your Friend Got Right):**
      *   **Nagel:** He explicitly argues that we commonly make moral judgments that depend on factors *outside* the agent's control – luck. He identifies several types (resultant, circumstantial, constitutive, causal luck).
      *   **Your Situation:** This is a textbook case of *resultant moral luck* – luck in the *outcome* of one's actions. Identical actions/choices/intentions lead to radically different moral appraisals solely due to unforeseeable consequences (the kid running out vs. no kid running out).
      *   **The Tension:** Nagel points out a fundamental conflict between two deeply held intuitions:
          *   **Control Principle:** Moral judgment should only depend on factors within the agent's control (intentions, choices, efforts).
          *   **Reactive Attitudes:** Our actual moral emotions (blame, praise, guilt, resentment) and practices (punishment, reward) are *inescapably* tied to actual outcomes. We *feel* and *treat* the driver who killed someone differently from the one who didn't, even if their momentary lapse was identical.
      *   **Williams:** In his seminal essay "Moral Luck," Williams uses the example of the lorry driver (truck driver) who, through no fault of his own (a child suddenly runs out), kills a child. Williams argues this driver experiences "agent-regret" – a deep, first-person regret *for being the agent* of the event, distinct from mere spectator regret or guilt over a deliberate wrong. This feeling, Williams suggests, is *appropriate* even if the driver wasn't negligent or blameworthy in the usual sense.

  2.  **The Oversimplification & Why It's Not "Clean":**
      *   **Nagel Doesn't *Resolve* the Tension, He *Exposes* It:** Nagel's key point isn't "therefore, only intent matters, and all outcome-based judgments are unjust." His point is that the Control Principle is incredibly difficult, perhaps impossible, to maintain consistently in our actual moral lives once we acknowledge the pervasive role of luck. He concludes that moral luck reveals a "vulnerability" in our moral conceptions, potentially undermining our confidence in moral judgments *altogether*. He leaves us with an unsettling paradox, not a comforting solution.
      *   **Williams & Agent-Regret:** Williams emphasizes that the lorry driver's profound regret isn't *irrational* or *unjustified* simply because the outcome was lucky. This "agent-regret" is a fundamental part of being a moral agent involved in the world. To deny it or try to reduce it purely to "I intended badly" would be to deny a deep aspect of our humanity and our connection to the consequences of our actions, however contingent.
      *   **"Stripping Away Luck" is Impossible:** Your friend says "once you strip away luck... all that's left is intent." But Nagel argues luck is *pervasive* and *inescapable*:
          *   **Circumstantial Luck:** Luck in *what situations you face*. Your friend faced the circumstance of the child running out; you didn't.
          *   **Constitutive Luck:** Luck in *who you are* – your inclinations, temperament, tendencies (including the tendency to glance at a phone while driving). Could he have been "lucky" enough to be constitutionally more attentive *in that exact moment*?
          *   **Causal Luck:** Luck in *how you are determined by prior circumstances* – everything leading up to that moment.
      *   **Intent Isn't Pure Either:** Even the *intent* to glance at the phone is partly shaped by constitutive and causal luck (your upbringing, your habits, your stress levels that day). How much control do we *truly* have over our intentions in any pure sense?

  3.  **The Takeaway (It's Messy and Unsettling):**
      *   **Nagel:** The existence of moral luck reveals a deep tension within morality itself. We *want* judgments to be based solely on control, but we *cannot* help judging based on outcomes. This tension might mean our moral concepts are fundamentally flawed or incomplete. There is no easy way to "strip away luck" because luck is woven into the fabric of agency and consequence. The driver who killed the child *is* morally unlucky in a way that profoundly shapes his moral landscape, regardless of his identical intent to yours.
      *   **Williams:** Agent-regret is a legitimate and important moral emotion tied to being the *cause* of an event, even a tragic accident. It's not *just* about the intent; it's about the brute fact of *being the one through whom it happened*. This feeling isn't irrational; it's a response to the terrible weight of the actual outcome. Denying this feeling in the name of pure intent would be inhuman.

  **Applying This to Your Situation:**

  *   **Your Friend's Guilt:** Williams would say his "crushing guilt" (or more precisely, profound agent-regret) is a *humanly appropriate* response to the terrible fact that *he* was the agent of the child's death, even if the momentary lapse was minor and the circumstance unforeseeable. It's not *just* about the intent; it's about the horrific reality he now inhabits.
  *   **The Legal Charges:** Nagel would highlight this as the clearest example of *resultant moral luck* impacting judgment. Legally, consequences matter immensely (manslaughter vs. a traffic ticket). While this seems "unfair" from the pure Control Principle perspective, the law *must* respond to actual harm caused. The philosophical tension doesn't resolve the legal reality.
  *   **Your Feeling ("Could easily have been me"):** This is the core recognition of moral luck. Nagel forces us to confront this uncomfortable truth: the difference between being the object of sympathy and the object of condemnation is often sheer luck. This doesn't absolve the *choice* (glancing at the phone was still negligent), but it highlights how wildly disproportionate the *consequences* can be based on chance.
  *   **The "Comfort" and the Discomfort:** The insight *is* comforting in recognizing the shared fallibility and vulnerability to luck. But it's deeply *uncomfortable* because:
      1.  It undermines the neatness of moral accounting ("bad people get punished, good people rewarded").
      2.  It validates your friend's suffering (his regret *is* meaningful, not just an error).
      3.  It forces you to confront your own potential for causing catastrophic harm through minor lapses plus bad luck.
      4.  It leaves us with a philosophical problem with no satisfying resolution.

  **In short:** Your friend captured Nagel's starting point – the conflict between intent and outcome-based luck. But Nagel and Williams show us this isn't a problem we can neatly solve by dismissing outcomes. Moral luck creates an enduring, painful tension in how we judge others, how we feel about ourselves, and perhaps even in the structure of morality itself. The takeaway isn't "don't feel guilty, it's just luck," but rather a profound realization of how fragile our moral standing is, how deeply intertwined our agency is with forces beyond our control, and why both the driver's regret and society's condemnation, however influenced by luck, carry a weight that pure intent alone cannot explain or dismiss. It's a humbling and sobering perspective, not a clean answer.
