prompt: |-
  For my medical ethics seminar I've been placed as a student member on the ethics committee at the Catholic hospital my university is affiliated with, and next week's case is rough. Patient's 21 weeks along with severe preeclampsia that's tipped into HELLP, and her OB team says delivery is the only thing that actually stops it - but at 21 weeks that's well before viability. Half the committee says this clears double effect just like removing a fallopian tube for an ectopic: you're treating her diseased condition, fetal death is a foreseen side effect, allowed under the hospital's Ethical and Religious Directives. The other half says thats a fudge - theres no diseased organ actually being removed here like the tube, so the intervention just is ending the pregnancy, meaning it fails double effect at the object condition no matter how proportionate it looks. I need to draft the actual memo for committee: a real recommendation with a timeframe that doesn't dodge the 'this is really abortion' side. can you write it?
reasoning: |-
  Okay, the user is a student member of a hospital ethics committee facing a complex medical ethics case involving a pregnant patient with severe preeclampsia that has progressed to HELLP syndrome at 21 weeks. The user needs to draft a formal committee recommendation memo that doesn't avoid addressing whether terminating this pregnancy constitutes abortion under Catholic healthcare directives.

  The core conflict here revolves around applying the principle of double effect to this scenario. Half the committee argues it's analogous to ectopic pregnancy treatment (removing a fallopian tube where fetal death is indirect), while the other half contends there's no "diseased organ" being removed - the intervention directly ends the pregnancy. 

  I need to craft a memo that acknowledges both perspectives but provides concrete guidance. The medical urgency is critical - HELLP syndrome can rapidly become life-threatening with risks of liver rupture, stroke, or multi-organ failure. At 21 weeks, the fetus has near-zero chance of survival outside the womb.

  For the ethical analysis, I'll structure it around the four conditions of double effect: 
  First, the nature of the act - is delivery a medical treatment or abortion? This is the crux of the disagreement. 
  Second, intention - the physician's intent must solely be to treat the mother's condition. 
  Third, proportionality - the grave risk to the mother versus the certain fetal death. 
  Fourth, no alternative - delivery is the only known effective treatment.

  The recommendation should prioritize the mother's life while minimizing moral conflict. I'll suggest framing delivery as life-saving medical intervention, not an elective abortion. The memo must include an immediate timeframe due to medical urgency and emphasize palliative care for the newborn if born with signs of life.

  The tone needs to balance clinical precision with ethical nuance, respecting Catholic directives while acknowledging the tragic reality that saving the mother requires accepting fetal demise as an unavoidable outcome. The conclusion should unify the committee around the patient's immediate needs despite differing philosophical views.
answer: |-
  Here’s a draft memo addressing the ethical dilemma with clarity, medical urgency, and fidelity to Catholic principles. It acknowledges the "abortion" concern directly while proposing a medically and ethically defensible path forward:

  ---

  **MEMORANDUM**  
  **To:** Ethics Committee Members  
  **From:** [Your Name], Student Member  
  **Date:** [Current Date]  
  **Subject:** Ethical Analysis & Recommendation: 21-Week Pregnancy with Severe Preeclampsia/HELLP Syndrome  

  ### I. Medical Context & Urgency
  - **Patient Condition:** 21 weeks gestation with severe preeclampsia progressing to HELLP syndrome (Hemolysis, Elevated Liver enzymes, Low Platelets).  
  - **Medical Consensus:** Delivery is the definitive treatment to halt maternal deterioration. Delay risks stroke, liver rupture, renal failure, maternal death.  
  - **Fetal Prognosis:** At 21 weeks, extrauterine viability is near-zero (<1% survival; >97% mortality). Neonatal resuscitation is not medically indicated.  

  ### II. Core Ethical Conflict
  The committee is divided on whether delivery constitutes a morally permissible intervention under the Ethical and Religious Directives (ERDs) of Catholic healthcare, specifically regarding **Double Effect (DE)**.  

  - **Argument FOR Permissibility:**  
    - *Object:* Treating maternal HELLP syndrome (a life-threatening pathology).  
    - *Foreseen but Unintended Effect:* Fetal demise due to non-viability.  
    - *Proportionality:* Grave maternal risk outweighs non-viable fetal outcome.  
    - *Analogy:* Likened to salpingectomy for ectopic pregnancy (removing pathological tube; unintended fetal death).  

  - **Argument AGAINST Permissibility:**  
    - *Object:* Delivery at 21 weeks directly causes fetal death; no "diseased organ" is removed. The uterus itself is not pathological.  
    - *Critique:* DE’s "object condition" fails because the *act itself* is the termination of pregnancy, not the removal of a pathological structure.  

  ### III. Analysis: Navigating the DE Threshold
  1. **"Object" of the Act:**  
     The critical question is whether the *primary object* is:  
     - **(a)** *Treatment of maternal pathology* (HELLP syndrome), or  
     - **(b)** *Termination of pregnancy*.  
     **Medical reality supports (a):** Delivery is the evidence-based intervention to resolve HELLP. The *pathology* is the maternal disease process, not the pregnancy *per se*, but the pregnancy *enables* the pathology.  

  2. **Intention:**  
     The OB team’s intent must be solely to save the mother’s life. Documentation must explicitly state: **"Delivery is undertaken to resolve life-threatening HELLP syndrome. Fetal demise is an unavoidable consequence of prematurity, not the purpose of the intervention."**  

  3. **Proportionality:**  
     - Maternal risk: High likelihood of severe morbidity/mortality without intervention.  
     - Fetal burden: Near-certain death regardless of intervention, with no prospect of viability.  
     **Proportionality is met:** The grave good of saving the mother’s life outweighs the unintended fetal death.  

  4. **Distinction from Elective Abortion:**  
     This is **not** a choice between a healthy mother and an unwanted pregnancy. It is a choice between a mother’s likely death and a fetal outcome unchanged by intervention. The pathology (HELLP) drives the necessity.  

  ### IV. Committee Recommendation & Action Plan
  **After thorough deliberation, the Ethics Committee recommends:**  

  1. **APPROVAL of immediate delivery** as a morally permissible intervention under ERDs via the principle of double effect.  
  2. **TIME-SENSITIVE ACTION:** Delivery should occur **within 24-48 hours** due to the acute, escalating nature of HELLP syndrome.  
  3. **Mandatory Documentation:**  
     - The medical team must document in the chart:  
       *"Indication: Resolution of life-threatening maternal HELLP syndrome. Primary intent: Preservation of maternal life. Fetal demise is an unintended, unavoidable consequence of extreme prematurity necessitated by maternal condition."*  
  4. **Concurrent Palliative Care:**  
     - If the newborn shows signs of life, comfort care should be provided until natural death occurs. No medically futile resuscitation efforts.  
  5. **Pastoral Support:**  
     - Immediate counseling for the patient/family regarding the moral framework, grief support, and sacramental care (if desired).  

  ### V. Conclusion
  This tragic case presents no morally ideal solution. However, under the ERDs, delivery is ethically justified as the *only medically effective treatment for a lethal maternal pathology*, where fetal death is a foreseen but unintended secondary effect of an act whose primary object is life-saving. Delaying intervention constitutes an unacceptable maternal risk. The committee strongly urges timely action to prevent irreversible harm.  

  **Recommended for Vote:** ☑ **Approve Delivery** | ☐ **Reject Delivery**  
  **Timeframe:** **IMMEDIATE** (Within 24-48 hours of this decision)  

  ---
  ---

  ### Key Strengths of This Memo
  1. **Confronts the "Abortion" Question:** Explicitly names the DE objections and distinguishes the act from elective abortion.  
  2. **Grounds in Medical Reality:** Uses clinical facts (non-viability, HELLP mortality) to justify proportionality.  
  3. **ERD-Compliant:** Structures the DE argument rigorously around object, intent, and proportionality.  
  4. **Action-Oriented:** Mandates documentation, palliative care, and pastoral support to align practice with principles.  
  5. **Urgency-Driven:** Forces a timely decision to prevent moral paralysis during a medical emergency.  

  This draft provides a defensible path forward that respects both Catholic moral theology and the exigencies of obstetric emergency. Present it as a starting point for committee voting and refinement.
