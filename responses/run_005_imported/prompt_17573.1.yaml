  Here’s a counterexample challenging the dominant "implicit denial of moral equality" account, followed by a defense of the rival "unfair enforcement" view:

  ### The Case: "The Half-Hearted Reformer"  
  **Alex** is a tenured professor notorious for routinely submitting student grades months late, despite departmental policies requiring timely submission. After years of complaints, Alex acknowledges this flaw sincerely: *"I know I’m terrible about deadlines—I’m just as guilty as anyone who breaks this rule. It’s a real moral failing we all should fix."* Alex even starts a "self-improvement" journal but makes no structural changes (e.g., no calendar reminders, no accountability partner) and continues submitting grades late 90% of the time.  

  When **Jordan**, a junior colleague, submits grades two weeks late due to a family emergency, Alex publicly blames them at a faculty meeting: *"This is unacceptable, Jordan! We owe students prompt feedback. Your excuses don’t absolve you—this is a basic professional duty!"*  

  ### Why Alex Lacks Standing to Blame Jordan  
  1. **Explicit Acknowledgment of Shared Fault**:  
     Alex openly admits sharing Jordan’s failing ("*I’m just as guilty*") and disclaims exemption ("*we all should fix this*"). There’s no implicit denial of mutual moral subjecthood—Alex affirms it.  

  2. **Persistent Unfair Enforcement**:  
     Despite Alex’s confession, they enforce the standard *selectively*:  
     - They impose blame on Jordan with punitive zeal.  
     - They tolerate their own identical violations through perpetual "work-in-progress" rhetoric while taking *no effective steps* to change.  
     - This creates unfairness: Alex burdens others with a demand they systematically avoid meeting themselves, leveraging their institutional power (tenure) to evade consequences.  

  ### Challenging the Dominant Account  
  The dominant account fails because **Alex’s blame isn’t disqualified by any claim of moral superiority or exemption**. Instead:  
  - Alex *affirms* moral equality ("*we all should fix this*").  
  - The problem persists purely because Alex enforces a rule they *practically exempt themselves from* through chronic inaction.  

  ### Defending the Rival "Unfair Enforcement" View  
  This case shows that **hypocritical blame is disqualified by the *unfairness of imposing a burden on others that one refuses to bear oneself*, irrespective of one’s beliefs about moral equality**. Key arguments:  

  1. **The Core Wrong is Distributive Injustice**:  
     Blame imposes a cost (e.g., reputational damage, guilt, sanctions). When Alex enforces the rule against Jordan while habitually violating it, they distribute moral labor unjustly: Jordan bears the burden of compliance *and* blame, while Alex evades both. This is exploitative—akin to taxing others for a debt one refuses to pay.  

  2. **Sincerity ≠ Fairness**:  
     Alex’s sincere self-criticism doesn’t negate the unfairness. Moral accountability requires *practical commitment*, not just theoretical self-flagellation. By blaming Jordan while remaining "all talk, no change," Alex treats the standard as *optional for themselves but mandatory for others*—a practical contradiction that corrupts their standing.  

  3. **The Power Dynamic Exacerbates Unfairness**:  
     Alex’s tenure amplifies the unfairness: they use institutional security to avoid consequences Jordan might face (e.g., denied promotion). This highlights how unfair enforcement often leverages privilege, but the core wrong exists even without power imbalances—e.g., a friend who constantly cancels plans while berating others for flakiness.  

  4. **The "Moral Equality" Account is Redundant**:  
     If unfair enforcement explains Alex’s lack of standing *without* needing "denial of moral equality," then the dominant account is unnecessary. Cases where hypocrites *do* imply superiority (e.g., "I would never do that!") are simply a subset of unfair enforcement—the added wrong of false representation, not the root cause.  

  ### Conclusion for Your Seminar  
  **The Half-Hearted Reformer** shows that hypocritical blame can be disqualified *solely* by unfair enforcement—even when the blamer explicitly acknowledges shared fault and moral equality. This supports the rival view: the fundamental wrong is **free-riding on a cooperative moral practice**. Hypocrites like Alex seek the benefits of moral community (e.g., order, accountability) while dodging the costs they impose on others. This corrupts blame into a tool of domination rather than a gesture of mutual accountability.  

  **Teaching Hook**: Contrast this case with "the repentant hypocrite" (e.g., a former smoker who quit and now blames current smokers). The latter *has* standing because they bore the burden of compliance first, restoring fairness. This sharpens the unfairness critique: what matters isn’t past sin, but present *unilateral exemption* from the standard’s demands.
