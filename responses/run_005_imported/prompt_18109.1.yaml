prompt: |-
  I'm on the board of our small animal rescue (all volunteer, no city funding). A few years back we started putting our live release rate on every newsletter and grant application because that's the number our biggest donor and the state grant program actually care about, and its up around 97% now. Thing is, I've noticed we quietly stopped being open-admission -- we turn away alot of the "hard" cases now (old, sick, aggressive, the summer kitten litters) so they don't hurt the number, and most of those animals just end up at the county shelter, which still takes everything and still euthanizes. So our number looks amazing but I don't actually think fewer animals are dying overall, we just made sure it's not our paperwork that says so. We've also got a couple dogs that have been sitting in a cage here for two-plus years now instead of being put down, and honestly I'm not sure that's better for them either. Half the board wants to keep chasing the number since its in our mission statement and the donor asks for it by name every year; the other half (me included) thinks the number itself has become the problem, but nobody agrees on what we'd do instead. Can you write the memo I'd bring to the board meeting -- it needs to actually recommend something we can vote on, not just list pros and cons, and it has to take the "this is what our donors and mission care about" side seriously instead of just brushing it off.
reasoning: |-
  Okay, let me unpack this user's dilemma. They're on the board of a small volunteer-run animal rescue facing an ethical crisis: their impressive 97% live release rate comes from turning away difficult cases and warehousing unadoptable animals. The core tension is between maintaining donor-pleasing metrics versus fulfilling their ethical duty to animals.

  Hmm, the user needs a decisive board memo that doesn't just analyze problems but proposes actionable solutions. The tricky parts are: 1) preserving donor relationships while changing practices, 2) addressing the mission statement conflict, and 3) offering concrete alternatives to the current flawed system. 

  The memo should reframe success beyond a single metric. Instead of abandoning the live release rate entirely, they could contextualize it with additional impact measurements - like county shelter support or hospice care. That might satisfy the "mission statement" faction while addressing ethical concerns. 

  Important nuances: The warehouse dogs are suffering, and kitten litters are being rejected during critical summer months. The proposal must offer humane alternatives for these specific pain points. Also, the county shelter relationship is key - could they formalize support instead of diverting animals?

  Donor psychology matters too. The biggest donor fixates on the 97% number, so the memo needs transitional strategies: maybe segmented reporting showing "within our care" vs "community impact" metrics, plus storytelling about animals saved through partnerships. 

  The recommendation should be multi-pronged: 1) return to open admission with safeguards, 2) develop humane euthanasia protocols, 3) create new metrics, and 4) proactively reframe success for donors. Each point needs specific implementation steps to be vote-ready. 

  Crucially, this isn't about condemning past choices but correcting course. The tone should acknowledge their difficult position while emphasizing that true impact outweighs optics. The ethical pivot must feel like mission fulfillment, not mission abandonment.
answer: |-
  ## MEMORANDUM  
  **To:** Board of Directors, [Animal Rescue Name]  
  **From:** [Your Name], Board Member  
  **Date:** [Current Date]  
  **Subject:** Re-evaluating Our Success Metrics: Aligning Live Release Rate with Ethical Impact & Mission Integrity  

  ### 1. Background: The Current Dilemma  
  Our 97% live release rate (LRR) has rightly been a point of pride and a key factor in securing grants and donor support. However, internal observations reveal unintended consequences:  
  - **Restricted Admissions:** We routinely turn away elderly, sick, behaviorally challenged, and high-volume animals (e.g., summer kittens) to protect our LRR.  
  - **Outcomes for Turned-Away Animals:** These animals often enter the county shelter system, where euthanasia rates are significantly higher.  
  - **Warehousing Concerns:** Several dogs have lived in kennels for 2+ years, raising ethical questions about their quality of life.  
  - **Net Impact:** Evidence suggests we are not reducing overall euthanasia; we are shifting it to the county shelter while inflating our own metric.  

  This conflicts with our mission statement: *"[Quote exact mission statement, e.g., 'To serve the homeless animals of [County] with compassion and dignity']."*  

  ### 2. Why This Matters: Mission, Ethics, and Long-Term Trust  
  - **Mission Dilution:** Turning away the most vulnerable animals contradicts our commitment to *all* animals in need.  
  - **Ethical Responsibility:** Warehousing animals indefinitely or outsourcing euthanasia via denial erodes our core values of compassion.  
  - **Donor & Grant Risk:** While LRR is currently favored, discovery of our selective admission policy could damage trust irreparably. Major donors value *impact*, not just optics.  
  - **Sustainability:** Burnout increases when volunteers/staff feel we prioritize numbers over animal welfare.  

  ### 3. Proposed Resolution: A Balanced, Impact-Focused Approach  
  **I move that the Board adopt the following 4-point plan effective [Date]:**  

  1.  **Return to Open-Admission Policy with Managed Intake:**  
      *   **Action:** Accept all animals from our service area based on capacity, prioritizing urgent cases.  
      *   **Safeguard:** Implement a formal "Managed Intake" system:  
          *   Appointment-based surrenders to smooth flow.  
          *   Robust foster network for kittens/puppies/special needs.  
          *   Partnership protocols with the county shelter for overflow.  
      *   *Why?* Aligns with mission integrity. Addresses the root cause of "outsourcing" euthanasia.  

  2.  **Develop a Humane & Transparent Euthanasia Policy:**  
      *   **Action:** Establish clear, compassionate criteria for euthanasia reviewed by the board annually. Criteria include:  
          *   Untreatable suffering/poor prognosis.  
          *   Severe, unmanageable aggression posing safety risks.  
          *   Animals deteriorating mentally/physically after prolonged confinement (e.g., >6-12 months) despite enrichment efforts.  
          *   Requires assessment by the Director, lead veterinarian (consult), and behaviorist.  
      *   *Why?* Ends indefinite warehousing. Ensures difficult decisions are ethical, not statistical.  

  3.  **Expand & Reframe Success Metrics:**  
      *   **Action:** Report a **suite of metrics** to donors/grantors, alongside LRR:  
          *   **Animals Served:** Total intake (showcasing scope).  
          *   **Community Impact:** # of animals diverted from county shelter via support (transfers, owner support, resources).  
          *   **Quality of Care:** Avg. length of stay, % in foster care, outcomes for special needs/geriatric animals.  
          *   **Prevention:** # of spay/neuter surgeries supported.  
          *   **LRR Contextualized:** Clearly state "For animals accepted into our care."  
      *   *Why?* Demonstrates broader impact, transparency, and commitment to the *hardest* cases. Tells a fuller story donors can champion.  

  4.  **Proactive Donor & Stakeholder Communication:**  
      *   **Action:** Before the next grant cycle/annual appeal:  
          *   **Brief Key Donors:** Schedule calls with our largest donor(s). Explain the ethical imperative and our commitment to *greater overall impact*. Highlight: "We’re ensuring your investment saves the lives that need it most, even when it’s difficult."  
          *   **Reframe in Materials:** Shift messaging from "97% LRR" to "Compassionate Care for ALL Animals: Measuring True Impact." Use stories of challenging cases helped.  
          *   **Engage the State Grant Program:** Discuss our holistic approach and how it aligns with their goal of reducing euthanasia *community-wide*.  
      *   *Why?* Controls the narrative, builds deeper trust based on ethics, and positions us as community leaders.  

  ### 4. Addressing Key Concerns  
  *   **"Donors Only Care About LRR":** Major donors invest in *impact and values*. Framing our shift as maximizing their dollar's *true* life-saving potential (including preventing county euthanasia) and upholding ethical integrity is compelling. Provide the *new* metrics as proof.  
  *   **"It's In Our Mission Statement":** Our mission compels us to serve animals, not a statistic. This plan *fulfills* the mission more authentically by serving the neediest and ensuring humane care for all in our custody.  
  *   **"We Can't Handle the Hard Cases":** Managed intake, foster expansion, and vet/behavior partnerships make this feasible. We grow capacity by embracing our full mission.  
  *   **"The Number Looks Bad":** Initially, LRR may dip slightly (transparently). However, showcasing *increased Animals Served* and *Community Impact* demonstrates greater overall effectiveness. We trade a "perfect" number for profound, authentic impact.  

  ### 5. Call to Action  
  **I recommend the Board vote to APPROVE the 4-Point Plan outlined in Section 3.**  

  This plan directly addresses the ethical and operational challenges we face, realigns us with our core mission, provides a compassionate framework for difficult decisions, offers transparent accountability to stakeholders, and ultimately positions [Rescue Name] to make a *greater* net reduction in animal suffering within our community.  

  **Let’s measure what truly matters: Lives saved, suffering alleviated, and community strengthened.**  

  **Respectfully submitted,**  
  [Your Name]  
  Board Member
