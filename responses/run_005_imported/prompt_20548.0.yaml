  Breaking down Peirce vs. James. Peirce is all about the scientific method and community inquiry. Truth is what would be agreed upon after infinite investigation. It's not about personal utility but the process of correcting errors over time. James is more psychological; truth's value lies in its practical consequences for individuals. 

  Key differences: Peirce is anti-relativist, emphasizing an external reality constraining inquiry. James is more flexible, allowing multiple truths if they work in different contexts. The user's friend mentioned Peirce's term "pragmaticism" to distance himself. That's a clue. Peirce felt James misunderstood him, turning a logical maxim into a theory of truth.

