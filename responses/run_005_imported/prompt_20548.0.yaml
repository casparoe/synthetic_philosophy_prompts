answer: |-
  You've hit on a core tension in pragmatism, and your scientific intuition is spot-on. Your friend is right: Peirce **vehemently** distanced himself from James's interpretation, coining the deliberately ugly term "**pragmaticism**" (which he said was "ugly enough to be safe from kidnappers") to mark the difference. While both start from the idea that meaning and truth are tied to practical consequences, their conceptions of "truth" diverge fundamentally. **James is far more susceptible to the relativism you fear; Peirce explicitly designed his view to avoid it.**

  Here's the breakdown of the key differences relevant to your concern:

  1.  **The Core Pragmatic Maxim (Meaning):**
      *   **Shared Starting Point:** Both agreed on the core maxim defining meaning: *"Consider what effects, that might conceivably have practical bearings, we conceive the object of our conception to have. Then, our conception of these effects is the whole of our conception of the object."* (Peirce).
      *   **Goal:** This was aimed against empty metaphysical abstractions. Meaning comes from conceivable practical consequences.

  2.  **Truth: Individual Expediency vs. Community Convergence & Reality:**
      *   **William James ("Truth = What Works *for the Individual*"):**
          *   **Focus:** Psychological satisfaction, practical cash-value, solving specific problems *for the believer*. Truth is an *event* in experience where an idea proves its worth *for you*.
          *   **Flexibility:** "The true is the name of whatever proves itself to be good in the way of belief, and good, too, for definite, assignable reasons." (James). Truth is *made* through its successful use. Different beliefs can be "true" for different people in different contexts *if they work for them*. "You can say of it either that 'it is useful because it is true' or that 'it is true because it is useful.'" (James).
          *   **Relativism Risk:** This is where your concern is strongest. If "what works" is fundamentally individual and contextual, then yes, contradictory beliefs could both be "true" as long as they serve their respective believers. James saw this as flexibility; critics see it as subjectivism/relativism.
          *   **Analogy:** A geophysical model is "true" for James if it helps *you* efficiently plan a survey and find resources *right now*, regardless of whether it perfectly mirrors subsurface reality. If a simpler, less accurate model gets the job done *for your immediate purpose*, it has "truth" in that context.

      *   **Charles Sanders Peirce ("Truth = The Ultimate Opinion of the Scientific Community"):**
          *   **Focus:** The *long-run* outcome of a specific *method* (scientific inquiry) applied by an *ideal community* of investigators. Truth is the opinion that inquiry *would* converge upon *if pushed sufficiently far*, regardless of individual convenience.
          *   **Anti-Relativist Core:** This is Peirce's key defense. Truth is **not** defined by what works *for me now*; it's defined by what *would* work *in the limit of investigation* for *everyone*. It's **objective**, but defined via process rather than static correspondence.
          *   **Role of Reality:** Peirce insisted reality exists independently of what anyone thinks. It's precisely this independent reality that *causes* the convergence of opinion. Inquiry *discovers* truth; it doesn't *create* it arbitrarily. Reality *resists* false beliefs, forcing the community to correct errors over time.
          *   **"Final Opinion":** This is not just "what works with a committee." It's the *ideal limit* point of a self-correcting process driven by:
              *   **Doubt & Belief:** Inquiry starts from genuine doubt and aims at stable belief.
              *   **The Scientific Method:** Reliance on observation, experiment, reasoning, and public criticism.
              *   **The Community:** Fallible individuals correct each other over indefinite time.
          *   **Truth vs. Current Belief:** Peirce sharply distinguished the *current* best opinion of science (which is fallible) from *Truth* itself (the unreachable but guiding ideal limit). We *aim* at Truth via the method.
          *   **Analogy:** A geophysical model is "true" for Peirce if it is the model that *would* emerge *after* exhaustive seismic surveys, gravity measurements, drilling, theoretical refinement, and debate *by the entire community of geophysicists* over an indefinite period. Its "working" isn't just short-term expediency for one person; it's its ultimate ability to withstand *all conceivable tests* and command universal rational assent *because* it accurately represents the structure of the Earth. A model that "works" for one company's quick survey but fails under broader scrutiny is *false*, even if temporarily useful.

  3.  **Why Peirce Hated James's Interpretation:**
      *   Peirce saw his pragmatic maxim as a rule for clarifying *meaning* and guiding *inquiry*, **not** as a direct definition of *truth*.
      *   He thought James turned pragmatism into a theory where truth was defined by *subjective satisfaction* ("What feels good to believe?"), completely ignoring the *external constraint of Reality* and the *communal, logical process* of science.
      *   He saw James's view as dangerously close to **nominalism** (denying real universals) and fostering the very relativism you fear. His "pragmaticism" was a direct rebuke.

  **Your Question Answered:**

  *   **Are they saying the same thing?** **No, fundamentally not.** James defines truth *operationally* in terms of *individual, contextual, psychological utility*. Peirce defines truth *realistically* as the *ideal, communal, logical outcome of a specific method constrained by an independent reality*.
  *   **Is Peirce just "what works" with a committee?** **No.** The "committee" (scientific community) isn't voting based on what's convenient. They are engaged in a *disciplined, reality-constrained process* aimed at *discovery*. Convergence happens *because* of reality's resistance, not because of a group preference for expediency.
  *   **Does Peirce avoid relativism?** **Yes, explicitly.** By anchoring truth in the *long-run convergence* driven by *reality* and a *shared rational method*, Peirce builds in an objective anchor. Two contradictory beliefs *cannot* both be true under Peirce's view, because reality would *force* the community to eventually reject one of them through the process of inquiry. The "final opinion" is singular.
  *   **Is the "final opinion" just window dressing?** For a hard scientist like yourself, it might *feel* frustratingly abstract or idealistic. However, it's absolutely central to Peirce's anti-relativism. It's his way of saying truth is **discovered** (correspondence to reality) *through* a specific **process** (scientific inquiry), without requiring us to have God's-eye access to "facts in themselves." The "final opinion" *is* the correspondence, defined via the process that reveals it.

  **In Summary for a Geophysicist:**

  *   **James:** "True" means this idea gets me the oil *today* with minimal fuss, and feels right. (Higher risk of "true for me" relativism).
  *   **Peirce:** "True" means this model is the one that *would* withstand *all possible data* collected by *every geophysicist forever*, accurately reflecting the Earth's structure. Its current usefulness is a *sign* it might be true, but not the definition. Truth is the *destination* of the scientific journey, defined by the path and the terrain.

  Your instinct that James's view risks collapsing into relativism is well-founded and shared by many critics (including Peirce!). Peirce offers a pragmatism grounded in scientific realism and communal objectivity, specifically designed to avoid that pitfall. The "final opinion" isn't window dressing; it's the keystone of his entire anti-relativist, reality-anchored edifice. Peirce would argue that your hard-science understanding of truth as "matching the facts" is *compatible* with his view – the "final opinion" *just is* the opinion that matches the facts, and the scientific method is how we asymptotically approach it. James would say your understanding is one *way* truth can work, but not the only way.
