  Also, the "duty to prevent" framework seems useful here. Parents have an obligation to feed their kids; random people don't owe the world surgeons. This avoids trivializing causation by anchoring it in normative contexts. I must emphasize that causation isn't just physics—it's intertwined with human expectations. 

