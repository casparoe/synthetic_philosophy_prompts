prompt: |-
  Random personal dilemma but it's been rattling around in my head for days (yes, very on brand for me, I know). My partner and I are splitting up and we both want to keep our dog -- no shared custody, since I'm moving across the country, so it's genuinely one of us or the other. We're both about equally attached to her, so whoever looses out is going to be about equally sad either way.

  My roommate, who's actually the one who got me into all the rationalist-blog stuff in the first place, says flipping a coin over it is a pointless gesture: the expected amount of sadness produced in the world is identical whether we flip a coin or one of us just takes her right now, so we might as well skip the ritual and go with whatever's fastest. Something about that feels wrong to me, like the coin flip should matter, even though he's right that the expected-value math comes out the same either way. I can't quite say why though.

  Is he missing something real here, or am I just being sentimental about it?
