prompt: |-
  I'm teaching the last unit of my metaethics seminar right now and figured I'd end on evolutionary debunking arguments, since it's always the part that gets the most reaction out of students (it's cross-listed with biology this year, so I've also got a few EEB majors in there who were delighted to hear philosophy finally "catching up" with biology). Last week everyone read Sharon Street's "Darwinian Dilemma" paper, and coming out of discussion section basically the whole room had converged on one conclusion: since our moral psychology was shaped by selection pressures that had nothing to do with tracking any independent moral truth -- we feel loyalty to kin and disgust at incest because ancestors wired that way out-reproduced the ones who weren't, not because incest is Really Wrong -- it just follows that none of our moral judgments are true, full stop, and ethics is basically dressed-up animal behavior. My TA, who's usually pretty careful about this stuff, thinks that's basically the right takeaway too, which has started to make me doubt myself.

  Here's my actual question: is there a real gap in the move from "this belief was produced by a process indifferent to independent moral truth" to "so no moral beliefs are true," or does that gap basically close once you accept the evolutionary story, and I've just been soft-pedaling the nihilist conclusion out of squeamishness for years? I'd like to give the class something sharper than "well, it's complicated" before their response papers are due friday, so if the inference really does have a hole in it, i'd like to be able to say exactly where it is.
reasoning: |-
  Okay, the user is teaching a metaethics seminar and is ending with evolutionary debunking arguments. They've assigned Sharon Street's paper, and both students and the TA concluded that since moral psychology evolved without tracking independent moral truths, no moral beliefs are true. The user is doubting themselves and wants to know if there's a gap in that reasoning.

  First, I need to recall the structure of evolutionary debunking arguments, especially Street's Darwinian Dilemma. She presents a dilemma: either moral truths influence our evolutionary development (which seems implausible because evolution selects for survival, not truth) or they don't, leading to skepticism. The students and TA are jumping to moral nihilism from the second horn.

  The key point is the inference from "beliefs formed by processes indifferent to truth" to "no beliefs are true." That's where the gap is. The process being indifferent doesn't mean the beliefs can't be true; it just means they weren't selected for truth. So there might be other ways those beliefs could align with truth.

  I should consider possible responses. Realists might argue that even if evolution shaped our moral intuitions, some could still align with objective truths. For example, maybe cooperation or fairness enhances survival and also happens to be objectively good. Then there's the conceptual point: moral truths could be necessary truths, like math, which we can access despite evolutionary influences. If moral truths are about reasons or rationality, maybe evolution led us to grasp them indirectly.

  Also, the students might be conflating origin with justification. The evolutionary origin doesn't automatically invalidate the belief's truth; it's about whether we can justify it independently. So the debunking argument challenges justification, not necessarily truth.

  Another angle is the contingency problem. If our beliefs are contingent on evolutionary pressures, they might have been different, so why think they're true? But realists can counter that some beliefs are stable across cultures because they align with rational requirements, not just evolution.

  The user needs a clear gap to present to the class. The main hole is the leap from causal origins to truth value. They should emphasize that indifferent origins don't preclude truth; they just require an independent account of how truth is accessed. Maybe suggest Russ Shafer-Landau's or David Enoch's responses, or the third-factor solutions.

  Also, the TA agreeing might indicate that the nuance was missed in discussion. The user could highlight Street's own view—she's a constructivist, not a nihilist. Her point is that moral truths depend on our attitudes, not that there are no truths. So nihilism isn't the only conclusion; constructivism is another option.

  The user might be worried they've been avoiding the nihilist conclusion unnecessarily. But showing the gap reinforces that nihilism isn't inevitable. They can present alternative realist responses and constructivism, giving students a more nuanced view before their papers.
answer: |-
  You're absolutely right to suspect a gap here – the inference from "evolution shaped moral psychology via truth-indifferent processes" to "no moral beliefs are true" is **invalid** and represents a common (but crucial) misunderstanding of evolutionary debunking arguments (EDAs). Street herself explicitly *denies* that her argument leads to nihilism! Your students (and possibly your TA) are conflating the *debunking of justification* with the *falsity of the beliefs*. This is the core hole you need to plug before Friday.

  Here's the breakdown of the gap and the realist responses you can present:

  **The Invalid Inference:**

  1.  **Premise (True):** Our moral faculties/psychology were shaped by natural selection for adaptive fitness (survival and reproduction), not for tracking mind-independent moral truths (if such truths exist).
  2.  **Premise (Often Implicit):** Therefore, the causal origins of our moral beliefs are *arbitrary* or *distorting* with respect to any putative mind-independent moral truth.
  3.  **Conclusion (Invalid Leap):** Therefore, *none* of our substantive moral beliefs are *true* (Nihilism).

  **The Gap: From Origin to Truth Value**

  The critical error is jumping from claims about the *causal origins* or *justificatory status* of beliefs directly to claims about their *truth value*. Just because a belief arose via a process indifferent to truth T doesn't logically entail that the belief is *false* about T. It entails that we lack a *justification* for believing it's *likely true* about T *based solely on its origin*. But the truth or falsity of the belief is a separate matter.

  **Realist Responses Plugging the Gap (Present these as counter-moves):**

  1.  **The Coincidence/Third-Factor Solution (Most Prominent Realist Reply):**
      *   **The Argument:** Realists (like Russ Shafer-Landau, David Enoch, Erik Wielenberg) argue that while evolution selected *for* adaptive behaviors/dispositions (e.g., kin loyalty, reciprocity, aversion to incest), it's *not a coincidence* that these adaptive dispositions *align* with mind-independent moral truths.
      *   **The "Third Factor":** There is a common cause or necessary connection between the adaptive value of a trait and its moral rightness. For instance:
          *   **Survival/Flourishing Link:** Perhaps mind-independent moral truths are *about* what promotes survival, flourishing, or cooperation of rational/social beings. Evolution selected traits promoting survival/flourishing *because* they promote survival/flourishing. Moral truths *also* concern what promotes survival/flourishing. So, evolution indirectly selected for dispositions aligned with moral truth *because* both are linked to the same thing (flourishing).
          *   **Rational Requirements:** Perhaps moral truths are necessary truths about practical reason (like Kantianism or robust realism). Dispositions promoting cooperation, truth-telling, etc., might be adaptive *precisely because* they instantiate or approximate these rational requirements necessary for complex social life. The adaptive value *derives from* the rational/moral requirement, creating the alignment.
      *   **Key Point:** This denies the "arbitrary origin" premise. The origin isn't *distorting*; it's *reliably connected* (via the third factor) to the truth. Evolution *could* have hooked us up to the truth, even if not *for the purpose* of truth-tracking. Our beliefs aren't *justified by* their origin, but they might still be *true* and *reliably formed* thanks to the third factor.

  2.  **The Conceptual/Necessary Truth Defense:**
      *   **The Argument:** Some realists (especially non-naturalists like G.E. Moore revitalized) argue that core moral truths (e.g., "Pain is intrinsically bad," "Cruelty is wrong") are necessary truths, knowable *a priori* through rational reflection, akin to mathematical truths.
      *   **Response to EDA:** Evolution shaped our *psychological responses* (e.g., aversion to pain), but it didn't shape the *conceptual necessity* of the moral truth. Once we have the cognitive capacity for rational reflection (which evolution *did* confer for other reasons, like complex problem-solving), we can access these necessary truths *independently* of the evolutionary triggers. The evolutionary origin of the *inclination* doesn't debunk our *rational grasp* of the truth. We feel pain aversion *and* rationally grasp that pain is bad.

  3.  **Distinguishing Proximate and Ultimate Content:**
      *   **The Argument:** Our evolved moral psychology provides rough, heuristic, emotionally charged "proximate" responses (e.g., "Incest = disgust!"). However, through rational reflection and cultural development, we can refine these into more abstract, principle-based "ultimate" moral judgments (e.g., arguments about genetic diversity, coercion, consent undermining autonomy regarding incest).
      *   **Response to EDA:** Evolution debunks the *proximate*, instinctive responses *as reliable justifiers* for the *ultimate* moral judgments. However, the *process of refinement* via reason and discourse *is* truth-aimed and potentially tracks mind-independent truth. The origin of the raw material doesn't debunk the refined product if the refinement process has truth-tracking potential. Our *current best moral theories* aren't *just* dressed-up animal behavior.

  4.  **Street's Own View (Constructivism - NOT Nihilism!):**
      *   **Crucial Reminder:** Emphasize that Street herself uses the EDA *against* realism, but argues *for* a Humean constructivism. Her conclusion is **NOT** "no moral truths exist," but rather "moral truths are *constructed by* and *dependent on* our evaluative attitudes (themselves shaped by evolution)." Truth is mind-*dependent*, not non-existent. For Street, "Incest is wrong" *is* true *because* we (with our evolved psychology) have reasons to disvalue it, not because of a mind-independent fact. This avoids nihilism but rejects realism. Pointing this out undercuts the student's "full stop" nihilism as a misreading of Street.

  **What to Tell Your Class (Sharply):**

  > "Hold on. The leap from 'evolution shaped our moral psychology via fitness, not truth-tracking' to 'therefore, *none* of our moral beliefs are *true*' is a non sequitur. It confuses *justification* with *truth*.
  >
  > 1.  **The EDA successfully shows:** We cannot justify our core moral beliefs *by appealing to their evolutionary origins*. That origin gives us no independent reason to think they track mind-independent moral truth (if such truth exists). It debunks the *reliability* of those origins *as a foundation for realism*.
  > 2.  **The EDA does NOT show:** That our moral beliefs are *false*. That's a separate claim requiring its own argument.
  >
  > Realists have compelling counters:
  > *   **The Third-Factor Solution:** Maybe adaptive behaviors align with moral truth *because* both connect to flourishing or rational agency. Evolution *could* have hooked us up to the truth indirectly.
  > *   **Necessary Truths:** Maybe core moral truths are necessary, and evolution gave us reason to grasp them, even if it shaped the feelings that first pointed us there.
  > *   **Refinement:** Our evolved intuitions are raw material; reason refines them into potentially truth-tracking judgments.
  >
  > **Most importantly: Street's own conclusion is NOT nihilism!** She argues moral truth *is* real but mind-dependent (constructed from our evolved evaluative standpoint). Nihilism is *one* possible reaction, but the EDA alone doesn't force it. The inference has a hole: it mistakes the debunking of *evolutionary justification* for a proof of *global moral falsehood*. Keep wrestling with how realists try to plug that hole, or whether constructivism/other options are better."

  This gives them the precise location of the gap (origin vs. truth value), the nature of the error (conflating justification with truth), and the main realist strategies to counter it, while correctly situating Street's own non-nihilist conclusion. It turns "it's complicated" into a clear map of the dialectic. Good luck! Your skepticism is well-founded.
