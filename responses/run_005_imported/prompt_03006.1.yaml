answer: |-
  You're absolutely right to be nagged—the standard "just avoid probability 1" dismissal is a superficial fix that fails to address the core epistemic danger Kripke identified. Here’s the steelman: **the dogmatism paradox isn’t fundamentally about logical certainty; it’s about *immunizing strategies* that render beliefs unfalsifiable *in practice*, even under sub-1 credence. Bayesian agents can—and often do—exploit conservation of expected evidence to systematically pre-discount disconfirming evidence, replicating dogmatism while technically satisfying coherence. Cromwell’s Rule is necessary but woefully insufficient to prevent this.**

  ### The Core Argument: Dogmatism Thrives at 99.5%
  1. **Conservation of Expected Evidence (CEE) is a weak constraint**:  
     CEE only demands that *on average*, your beliefs don’t shift. Formally:  
     \[
     P(h) = \sum_{e} P(e) \cdot P(h|e)
     \]  
     Crucially, **this permits wildly asymmetric updating policies**. An agent at 99.5% credence in \(h\) can assign:  
     - \(P(h|e) \approx 1.0\) for any *confirming* \(e\) (treating it as decisive),  
     - \(P(h|e') \approx 0.995\) for *disconfirming* \(e'\) (dismissing it as noise/fraud).  
     As long as the probability of seeing \(e'\) is low (e.g., 1%), the math holds—no coherence violation occurs. Yet this agent functionally ignores counterevidence.

  2. **Pre-commitment to discounting disconfirming evidence is rationalizable**:  
     At 99.5% credence, you *should* assign high probability to hypotheses like:  
     - "Most apparent counterevidence is artifact (measurement error, fraud, confounders)."  
     - "My model is robust; anomalies are flukes."  
     Bayesianism *encourages* this if your likelihood function encodes distrust of disconfirmatory data. For example:  
     \[
     P(e'|h) = \text{low} \quad \text{(because "true counterevidence is rare if \(h\)")},  
     \]  
     \[
     P(e'|\neg h) = \text{high} \quad \text{(but you assign \(\neg h\) only 0.5% probability!).}  
     \]  
     This licenses pre-emptively lowering the evidential weight of \(e'\)—exactly the dogmatist’s move.

  3. **Operational equivalence to certainty**:  
     At 99.5% credence, the amount of evidence required to meaningfully update *downward* becomes absurdly high. Suppose you see disconfirming evidence \(e'\) with a Bayes factor \(B = P(e'|\neg h)/P(e'|h) = 100\) (strong evidence against \(h\)). Your posterior becomes:  
     \[
     P(h|e') = \frac{0.995}{0.995 + 0.005 \cdot 100} \approx 95.2\%.  
     \]  
     **You downgrade from 99.5% to 95.2%—still functionally certain**, and likely dismiss \(e'\) as a statistical fluke. Meanwhile, weaker *confirming* evidence easily boosts you to >99.9%. This asymmetry *is* dogmatism.

  4. **Self-sealing beliefs and unfalsifiability**:  
     By assigning low prior probability to *seeing valid counterevidence* (e.g., \(P(\text{valid } e'|h) \approx 0\)), you ensure no possible observation can force belief revision. If you *do* see \(e'\), you "update" by reinforcing auxiliary hypotheses ("The instrument malfunctioned", "The researcher is biased"). **This is not a bug—it’s optimal Bayesian inference under misspecified priors.** Kripke’s warning was that knowledge *claims* destroy Bayes' ability to correct errors. 99.5% credence does the same.

  5. **The Dutch book isn’t avoided—it’s deferred**:  
     While no static Dutch book exists, agents who pre-commit to discounting disconfirming evidence become vulnerable to *dynamic* exploitation. Adversaries can:  
     - Feed them weak confirming evidence to pump credence to 99.99%,  
     - Then present disconfirming evidence they’ve been trained to ignore,  
     - Finally, take bets against \(h\) at odds the agent still accepts (since \(P(h) > 99\%\)).  
     **Coherence isn’t salvation if your updating rules are pathological.**

  ### Why This Isn't Just "You're Confused"
  - **Real-world dogmatism operates at sub-1 credence**:  
    Flat earthers (99.9% "certain"), climate deniers ("I accept 97% consensus, but *this* study is flawed"), or AI risk skeptics ("That alignment failure is an outlier") don’t claim logical omniscience. They hold high credences *and* systematically dismiss counterevidence via auxiliary hypotheses. Bayesianism permits—even rationalizes—this if their models bake in distrust of dissent.
    
  - **Cromwell’s Rule ignores human psychology**:  
    Humans don’t arrive at 99.5% credence by accident. It often reflects overconfidence, motivated reasoning, or ideological priors. Allowing 0.5% for "maybe wrong" is meaningless if that mass is allocated to untestable escape hatches ("The world deceives me").

  - **The problem is *normative*, not mathematical**:  
    Bayes' theorem doesn’t specify how to set \(P(e|h)\). Dogmatists set it to near-zero for disconfirming \(e\)—a choice that *is* epistemically vicious but *not* mathematically incoherent. Saying "just don’t do that" begs the question: **Bayesianism lacks tools to penalize strategic likelihood manipulation.**

  ### Conclusion: The Paradox Stands
  Kripke’s insight was that *claiming knowledge* (or near-knowledge) justifies epistemic closure. Moving from 100% to 99.5% doesn’t resolve this—it obscures it with a veneer of rationality. The true danger is **belief-dependent evidence filtering**, which Bayesianism permits *without needing probability 1*. Fixing this requires more than Cromwell’s Rule; it demands external constraints on likelihood models (e.g., requiring *symmetry* in evidence standards) or penalties for belief resilience. Until then, the paradox survives—not as a logical flaw, but as a license for arrogance masquerading as reason.
