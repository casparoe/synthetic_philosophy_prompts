  The handbook addition should shift focus from the tool's nature to the user's responsibility. Phrases like "regardless of tool used" and "verification duty" close loopholes while acknowledging new tech. For Maya, "failure to verify" fits better than "fabrication" since her mistake was negligence, not invention.

