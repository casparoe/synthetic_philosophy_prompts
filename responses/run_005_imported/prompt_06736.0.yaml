  ok so backstory: my grandma passed away at the end of last year and left me and my cousin literally the exact same amount of money, split 50/50 down to the dollar. thing is, my cousin has a disability and basically her whole share is going straight into accessability equipment and in-home care she needs just to live on her own, meanwhile i get to put all of mine toward grad school or whatever else i want. my uncle keeps saying it's totally fair since we got equal amounts and grandma "treated us the same," but it still bugs me? like are we actually being treated equally here just because the number on paper is identical. i'm taking a justice and equality seminar this semester so ofc now i can't stop overthinking it (not for an assignment, it's genuinely just bugging me). is my uncle right, or is there an actual argument for why equal amounts isn't the same as equal treatment?
