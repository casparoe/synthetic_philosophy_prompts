prompt: |-
  So in my Augustine seminar this week we read Contra Mendacium, basically his takedown of a guy named Consentius who wanted to send someone undercover to pose as a Priscillianist so they could infiltrate the heretics and expose them -- Augustine's answer is no, not even for that. Its been stuck in my head because I'm on my school paper's editorial board and we've got a live version of this fight: a reporter wants to pose as a client at a "tutoring" service near campus that's almost certainly ghostwriting essays, just to get proof before we publish. Half the board thinks exposing real cheating justifies the lie, and I don't want us to just invoke Augustine and call it settled, but I also don't want to hand-wave past how extreme his answer actually is. Can you draft the memo I'm bringing to tomorrow's meeting? It needs to actually recommend something -- approve the plan, reject it, or approve with conditions -- give a time limit on how long any undercover op runs before we revisit it, and take the "the cause justifies it" side seriously rather than just gesturing at it.
