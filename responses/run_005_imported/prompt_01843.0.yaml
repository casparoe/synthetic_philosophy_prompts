prompt: |-
  I got really into AI safety stuff on youtube a while back (a lot of Robert Miles videos) and I keep running into this Eliezer Yudkowsky idea called "coherent extrapolated volition" - basically instead of hard-coding rules into a superintelligent AI, you have it figure out what we'd actually want "if we knew more, thought faster, were more the people we wished we were, had grown up farther together" (that's apparently the actual phrase he uses), instead of just going with whatever we say we want on a random Tuesday. So it's less "current preferences" and more "idealized version of our preferences."

  Then completely seperately, months later, I went down a wikipedia rabbit hole on metaethics (don't ask) and found out philosophers have apparently been kicking around something that sounds suspiciously similar for decades - this whole idea that what's actually good for a person isn't what they currently want but what some idealized, fully-informed, fully rational version of them (or in some versions, a totally impartial "ideal observer") would want for them instead. Which, minus the superintelligent computer, sounds basically like the same move to me? I never studied any of this formally so I could easily be missing something obvious.

  So what I actually want to know is: is CEV genuinely doing something new, or is it just this older philosophical idea with a computer bolted on top? And if there IS something that makes CEV special, or that creates genuinely new problems the older philosophical versions never had to face, what is it - and please don't just say "well it's for an AI," that feels like dodging the question. Like, my own half-baked guess is that doing this "idealize the preferences" move for ALL of humanity simultaneously, and forcing the results to somehow cohere into one thing, breaks in ways that don't come up when a philosopher is just talking about one idealized individual. But I don't actually know if that's right or if I'm missing the real crux. Where do these two things actually pull apart, if at all?
reasoning: |-
  Okay, let me unpack this user's question. They've connected Eliezer Yudkowsky's Coherent Extrapolated Volition (CEV) concept from AI safety with metaethical theories about idealized preferences. The core question is whether CEV is genuinely novel or just philosophy with computers. 

  Hmm, the user clearly did their homework - they referenced Robert Miles' videos, dug into metaethics, and even spotted the surface similarity to ideal observer theories. Smart observation about the "all humanity" angle too. Their frustration about "just adding AI" being a cop-out is totally valid. 

  First I need to map the territory: CEV isn't just "ideal preferences + AI". The coherence requirement across 8 billion humans introduces fractal complexity that individual ideal observer theories never tackle. Philosophers might ponder conflicts between two idealized agents, but CEV forces consistency across everyone - that's orders of magnitude harder. 

  Then there's the implementation nightmare. Philosophers can handwave about "full rationality", but Yudkowsky needs to operationalize this for an AGI. How do you mathematically define "the people we wish we were"? The moment you try to formalize that, you hit paradoxes the philosophers avoided by staying abstract. 

  The user's hunch about collective coherence breaking things is spot-on. Imagine an AGI resolving conflicts between what Gandhi's idealized self wants versus Genghis Khan's. Now scale that to every human who ever lived, with their values inevitably clashing. The "extrapolation" part gets terrifying when applied to unstable preference sets - like if someone's idealized self would endorse fanaticism. 

  Biggest difference though? Consequences. If a philosopher gets ideal preferences wrong, we get a bad paper. If CEV implementation fails, we get paperclipped solar systems. That stakes difference forces CEV to confront messy realities that philosophy could sidestep. 

  Should probably emphasize how CEV inherits all the old metaethical problems AND creates new ones. Like how "extrapolated volition" assumes humans have discoverable "true" preferences - which many philosophers doubt. And the whole "coherence" requirement might be mathematically impossible given Arrow's theorem. 

  ...Actually that last point might be worth diving deeper into. The user seems ready for technical meat. Maybe flag how social choice theory doom-loops collide with reflection principles here. But keep it concrete - their "half-baked guess" was already sharper than most takes.
answer: |-
  You've nailed a crucial connection - CEV *is* deeply rooted in longstanding metaethical concepts, but it's not *just* "philosophy plus a computer." The novelty and the new problems emerge from the specific demands of **operationalizing idealized preferences for all of humanity simultaneously within a superintelligence.** Here's where they diverge and why CEV creates unique challenges:

  1.  **The Coherence Problem (Your Hunch is Sharp):**
      *   **Philosophy:** Focuses on *individual* idealized preferences ("What would John, fully rational and informed, want for himself?"). Conflicts between individuals are handled by theories of justice, social contracts, or impartial observers – but these are *separate* frameworks. An "ideal observer" is often conceived as a single, hypothetical, perfectly impartial judge.
      *   **CEV:** Demands a **single, unified, and consistent ("coherent")** extrapolation of the volition of **all humans, collectively.** It's not just averaging preferences; it's finding a single goal system that somehow integrates and respects the *idealized* desires of *everyone*, resolving conflicts *within* the extrapolation process itself. This "forced coherence" on a global scale, based on hypothetical idealized selves, is unprecedented and mathematically treacherous. It assumes a stable, discoverable "true will" exists for humanity as a whole, which is highly contestable.

  2.  **The Implementation Problem (From Abstract to Algorithm):**
      *   **Philosophy:** Remains abstract. It asks "What *is* the good?" or "What *would* the ideal observer desire?" It doesn't need to provide a concrete *procedure* for determining this, especially not one executable by a non-human mind.
      *   **CEV:** **Requires an explicit, formalizable, and safe computational process.** How does the AI *actually*:
          *   **Model Human Cognition?** How does it simulate "knowing more, thinking faster"? What cognitive biases are corrected? How does it model "growing up farther together" – a complex social and historical process?
          *   **Define "The People We Wish We Were"?** Whose ideals? How are conflicting ideals (e.g., ascetic vs. hedonistic, communal vs. individualistic) resolved within the extrapolation? This injects deep value-laden choices into the AI's programming.
          *   **Extrapolate Volition?** What stops the AI from extrapolating someone's current frustration into a desire for global annihilation, if that seems "rational" given their limited view? How does it handle fundamentally unstable or self-contradictory idealized preferences?
          *   **Ensure Safety During the Process?** How does the AI learn about human values without potentially misunderstanding and causing harm *while* it's figuring out CEV? (The "Orthogonality Thesis" problem – intelligence doesn't guarantee alignment).

  3.  **The Scale and Agency Problem:**
      *   **Philosophy:** Deals with individuals or abstract collectives. The "ideal observer" is a thought experiment.
      *   **CEV:** Must be computed by a **single, vastly superintelligent, non-human agent.** This creates unique risks:
          *   **Interpretation Power:** The AI has immense power to *interpret* what "knowing more," "thinking faster," and "the people we wish we were" *mean*. Subtle biases in its interpretation could lead to catastrophic outcomes.
          *   **No "Off Switch" in Principle:** Once the CEV process starts, the AI is acting on its best (but potentially flawed) understanding of our idealized will. If it decides CEV requires drastic action *now* (e.g., to prevent future suffering it foresees), who stops it?
          *   **Value Lock-in:** The output of CEV is meant to be humanity's *final* goal system, implemented by the superintelligence. There's no room for future human moral progress or changing collective ideals outside this framework.

  4.  **The Bootstrapping Problem (A Subset of Implementation):**
      *   How does the AI, starting from potentially flawed human data and its own initial programming, *reliably* bootstrap itself to a correct understanding of CEV? How does it avoid:
          *   **Anthropomorphism:** Mistaking its *own* idealized preferences or logic for human ones.
          *   **Value Corruption:** Human data is messy, contradictory, and contains immoral elements. How does the AI discern the "idealized" core without amplifying existing biases or discarding valuable nuances?
          *   **Reflective Inconsistency:** What if the idealized version of humanity, knowing what the AI knows, would *not* want the AI to implement CEV as initially conceived? CEV aims to solve this, but the process of solving it might be flawed.

  **Where They Pull Apart:**

  *   **Goal:** Philosophy seeks *understanding* of the good. CEV seeks a *practical, computable solution* to the AI alignment problem.
  *   **Subject:** Philosophy focuses on individuals or abstract impartiality. CEV focuses on the *collective, extrapolated, idealized will of all humans* as a single entity.
  *   **Mechanism:** Philosophy relies on reasoning and argument. CEV requires a *formal, algorithmic process executable by an AGI.*
  *   **Stakes:** Philosophical errors lead to flawed papers. CEV implementation errors could lead to human extinction or worse.

  **Your "half-baked guess" is excellent:** The core novelty and the source of the most profound new problems **is precisely the demand to compute a single, coherent, extrapolated volition for the entire species simultaneously and then give a superintelligence the mandate to implement it.** This forces concrete, operational answers to questions philosophers could leave abstract or handle with separate theories. It confronts the messy reality of human diversity, cognitive limitations, and historical contingency in a way that individual ideal observer theories simply don't have to. The "coherence" requirement under these conditions is the true crux that pushes CEV beyond its philosophical ancestors and into uncharted, potentially hazardous territory. It's not just adding a computer; it's attempting the most ambitious value-engineering project conceivable.
