  ### Comparison of Iterated Elimination of Dominated Strategies: Pure vs. Mixed Dominators

  Iterated elimination of dominated strategies (IEDS) is a solution concept in game theory that removes strategies that are never optimal, based on the assumption of common knowledge of rationality. The two versions differ in what constitutes a "dominator":

  - **Pure-strategy IEDS**: Eliminates a pure strategy \(s_i\) for player \(i\) only if there exists another pure strategy \(s_i'\) that strictly dominates it. That is, \(u_i(s_i, s_{-i}) < u_i(s_i', s_{-i})\) for all pure strategy profiles \(s_{-i}\) of the other players.
  - **Mixed-strategy IEDS**: Eliminates a pure strategy \(s_i\) for player \(i\) if there exists a mixed strategy \(\sigma_i\) (over player \(i\)'s pure strategies) that strictly dominates it. That is, \(u_i(\sigma_i, s_{-i}) > u_i(s_i, s_{-i})\) for all pure strategy profiles \(s_{-i}\) of the other players.

  Allowing mixed strategies as dominators can lead to more strategies being eliminated earlier in the process, resulting in a smaller (or equal) set of surviving strategies compared to pure-strategy IEDS. This is because a pure strategy might not be strictly dominated by any single pure strategy but could be strictly dominated by a mixed strategy, which leverages the flexibility of randomization to achieve higher payoffs across all opponent actions.

  #### Concrete Example: How Mixed Dominators Change the Final Set
  Consider the following 2-player normal-form game, where Player 1 has strategies \(T\), \(M\), and \(B\), and Player 2 has strategies \(L\) and \(R\). Payoffs are given as (Player 1, Player 2):

  |          | L       | R       |
  |----------|---------|---------|
  | **T**    | (3, 0)  | (0, 3)  |
  | **M**    | (0, 3)  | (3, 0)  |
  | **B**    | (1, 1)  | (1, 1)  |

  - **Pure-strategy IEDS**:
    - For Player 1:
      - \(T\) vs. \(L\): \(u_1(T, L) = 3\), \(u_1(M, L) = 0\), \(u_1(B, L) = 1\) → No pure strategy dominates another (e.g., \(T\) is better against \(L\), but \(M\) is better against \(R\)).
      - Similarly, \(B\) is not strictly dominated by \(T\) or \(M\): against \(L\), \(u_1(B, L) = 1 < u_1(T, L) = 3\), but against \(R\), \(u_1(B, R) = 1 > u_1(T, R) = 0\), so the inequality does not hold strictly for all \(s_{-i}\).
    - For Player 2:
      - Against \(T\): \(u_2(L, T) = 0\), \(u_2(R, T) = 3\) → \(R\) better.
      - Against \(M\): \(u_2(L, M) = 3\), \(u_2(R, M) = 0\) → \(L\) better.
      - Against \(B\): \(u_2(L, B) = 1\), \(u_2(R, B) = 1\) → Indifferent.
      - No pure strategy is strictly dominated (e.g., \(L\) is not dominated by \(R\) because against \(M\), \(u_2(L, M) = 3 > u_2(R, M) = 0\)).
    - Thus, no strategies are eliminated. Surviving strategies: \(\{T, M, B\}\) for Player 1, \(\{L, R\}\) for Player 2.

  - **Mixed-strategy IEDS**:
    - For Player 1, consider a mixed strategy \(\sigma_1 = (0.5T, 0.5M)\):
      - Against \(L\): \(u_1(\sigma_1, L) = 0.5 \times 3 + 0.5 \times 0 = 1.5\)
      - Against \(R\): \(u_1(\sigma_1, R) = 0.5 \times 0 + 0.5 \times 3 = 1.5\)
      - Compare to \(B\): \(u_1(B, L) = 1 < 1.5\) and \(u_1(B, R) = 1 < 1.5\), so \(\sigma_1\) strictly dominates \(B\).
      - Eliminate \(B\).
    - After elimination, the reduced game is:
      |          | L       | R       |
      |----------|---------|---------|
      | **T**    | (3, 0)  | (0, 3)  |
      | **M**    | (0, 3)  | (3, 0)  |
      - No further eliminations: \(T\) and \(M\) are not dominated by each other or any mixed strategy (e.g., a mixed strategy for Player 1 would yield 1.5 against both \(L\) and \(R\), but \(T\) and \(M\) each get 3 or 0, so no domination). Player 2 has no dominated strategies.
    - Surviving strategies: \(\{T, M\}\) for Player 1, \(\{L, R\}\) for Player 2.

  **Change in Final Set**: Allowing mixed strategies as dominators eliminates \(B\), which survives under pure-strategy IEDS. The final set is smaller because mixed strategies can dominate pure strategies that are not dominated by any pure strategy. Here, \(B\) gives a safe payoff of 1 but is outperformed by the mixed strategy \(\sigma_1\) in all cases.

  ### Equivalence with Rationalizability for \(n > 2\) Players and Role of Belief Correlation

  The mixed-strategy IEDS procedure is equivalent to **correlated rationalizability**, which is the set of strategies that can be played under common knowledge of rationality with correlated beliefs (where a player's beliefs about opponents' strategies can be correlated). However, for games with more than two players (\(n > 2\)), this equivalence depends on whether players' beliefs about different opponents can be correlated:

  - **Equivalence for \(n = 2\)**: For two-player games, the mixed-strategy IEDS set equals the rationalizable set, regardless of belief correlation, because there is only one opponent. Thus, correlated and independent beliefs coincide.
    
  - **Equivalence for \(n > 2\)**:
    - **With correlated beliefs**: Mixed-strategy IEDS is equivalent to correlated rationalizability. The surviving strategies are those that are best responses to some correlated belief \(\mu_i \in \Delta(S_{-i})\) (where \(S_{-i}\) is the set of opponent strategy profiles, allowing correlation).
      - **Justification**: Mixed-strategy IEDS eliminates a strategy \(s_i\) if it is strictly dominated, meaning it is never a best response to any belief (correlated or independent). Correlated rationalizability includes strategies that are best responses to correlated beliefs. The iterative elimination process in mixed-strategy IEDS mirrors the removal of strategies not rational under correlated beliefs, leading to the same set.
    
    - **With independent beliefs**: Mixed-strategy IEDS is **not** equivalent to independent rationalizability (where beliefs must be independent, i.e., \(\mu_i\) is a product distribution over individual opponent strategies). The mixed-strategy IEDS set may be smaller than the independent rationalizable set.
      - **Justification**: A strategy might be strictly dominated under mixed-strategy IEDS (and thus eliminated) but could still be a best response to some independent belief. This is because strict domination considers all pure opponent profiles \(s_{-i}\), including correlated ones, whereas independent beliefs restrict to uncorrelated profiles. Thus, mixed-strategy IEDS corresponds to correlated rationalizability, which can exclude strategies that are rationalizable only under independent beliefs.

  #### Example Illustrating the Role of Correlation (3-Player Game)
  Consider a 3-player game where each player chooses \(A\) or \(B\):
  - Payoffs:
    - All choose \(A\): (1, 1, 1)
    - All choose \(B\): (1, 1, 1)
    - Two \(A\), one \(B\): \(A\)-players get 0, \(B\)-player gets 2
    - Two \(B\), one \(A\): \(B\)-players get 0, \(A\)-player gets 2

  - **Mixed-strategy IEDS**:
    - For Player 1, \(A\) is not strictly dominated:
      - Against \((A, A)\): \(u_1(A, A, A) = 1\) (since all \(A\))
      - Against \((A, B)\): \(u_1(A, A, B) = 0\) (two \(A\), one \(B\))
      - Against \((B, A)\): \(u_1(A, B, A) = 0\) (two \(A\), one \(B\))
      - Against \((B, B)\): \(u_1(A, B, B) = 2\) (one \(A\), two \(B\))
      - No mixed strategy \(\sigma_1\) yields strictly more than \(A\) in all cases (e.g., at \((A, B)\), \(u_1(A) = 0\), and any \(\sigma_1\) gives at least 0, but not strictly more). Similarly for other strategies.
    - No strategies eliminated; all survive.

  - **Rationalizability**:
    - **Correlated beliefs**: \(A\) is rationalizable. For example, Player 1 believes Players 2 and 3 play \((B, B)\) with probability 1, so \(u_1(A) = 2 > u_1(B) = 1\). Similarly, other strategies are rationalizable.
    - **Independent beliefs**: \(A\) is rationalizable. Player 1 believes Player 2 plays \(B\) with probability \(q=0\) and Player 3 plays \(B\) with probability \(r=0\) (so both play \(A\)), but then \(u_1(A) = 1 < u_1(B) = 2\)? Correction: With independent beliefs, if Player 1 believes \(P(\text{Player 2 plays } B) = q\), \(P(\text{Player 3 plays } B) = r\):
      - \(u_1(A) = qr \cdot 1 + q(1-r) \cdot 0 + (1-q)r \cdot 0 + (1-q)(1-r) \cdot 2 = qr + 2(1-q)(1-r)\)
      - \(u_1(B) = qr \cdot 2 + q(1-r) \cdot 0 + (1-q)r \cdot 0 + (1-q)(1-r) \cdot 1 = 2qr + (1-q)(1-r)\)
      - \(A\) is a best response if \(u_1(A) \geq u_1(B)\), e.g., when \(q + r \leq 1\) (like \(q=0, r=0\), \(u_1(A) = 2 > u_1(B) = 1\)). Thus, \(A\) is rationalizable.
    - In this game, all strategies survive under both belief types, so no strict difference. However, in modified games (e.g., with asymmetric payoffs), independent rationalizability can include strategies eliminated by mixed-strategy IEDS.

  **Key Insight**: For \(n > 2\), the equivalence between mixed-strategy IEDS and rationalizability holds only if correlated beliefs are allowed. If beliefs must be independent, mixed-strategy IEDS may produce a smaller set, as it inherently accounts for correlated opponent behavior during domination checks. Thus, belief correlation matters for the equivalence.
