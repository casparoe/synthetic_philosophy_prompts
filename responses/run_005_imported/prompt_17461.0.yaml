answer: |-
  You've hit the nerve center of one of the most fascinating debates in classical Indian epistemology. Your friend's swift siding with Dignāga is understandable – the reduction *feels* clean and rational. But Nyāya's defense of *śabda* as a distinct *pramāṇa* is profound and, I'd argue, ultimately more faithful to how knowledge *actually* functions in human life. Let's dismantle the reductionist argument brick by brick, focusing on the core issues of *vyāpti*, the nature of the word-meaning link, and the unique conditions of testimonial knowledge.

  **The Core Nyāya Argument: The Irreducible Nature of the Word-Meaning Link**

  1.  **The Vyāpti Problem: Natural Law vs. Conventional Bond:**
      *   **Inference (Anumāna) Demands Natural, Necessary Connection (Vyāpti):** For inference to be valid, there *must* be an invariable, universal concomitance (*vyāpti*) between the *hetu* (reason/middle term) and the *sādhya* (thing to be proved/major term). Smoke (*hetu*) is *never* found without fire (*sādhya*) in the relevant context (e.g., a kitchen). This connection is perceived in the world, grounded in natural causality or essential properties. It's *discovered*, not invented.
      *   **Testimony Relies on a Conventional, Arbitrary Link (Saṅketa):** The connection between a word (*śabda*) and its meaning (*artha*) is fundamentally different. There is *no natural, necessary connection* between the sound "cow" and the animal with dewlap and horns. This link is established purely by convention (*saṅketa*) – a social agreement. The word "cow" *could* have meant "horse" if the convention had been different. There is no *vyāpti* inherent in nature binding "cow" to bovinity.
      *   **The Fatal Consequence for Reductionism:** If testimony were merely inference, the *hetu* would be something like "This speaker uttered the word 'cow'". The *sādhya* would be "Therefore, the animal with dewlap and horns is present/meant". But what is the *vyāpti* here? **"Whenever a speaker utters 'cow', the animal with dewlap and horns is present/meant?"** This is patently false. Speakers utter "cow" when referring to pictures, memories, fictional stories, or even when lying. The connection isn't universal or necessary *in the natural world*. The only "concomitance" is *within the convention itself*: "Within the convention of English, the word 'cow' conventionally signifies *that* concept." But this "concomitance" isn't observed in nature like smoke-fire; it's *learned* through the *pramāṇa* of testimony itself! Trying to base the knowledge gained from testimony on an *inference* relying on a *vyāpti* about word usage immediately begs the question – it presupposes the very knowledge of the convention (gained via testimony) that it's trying to explain.

  2.  **The "Reliability Inference" Rebuttal: A Regressive Trap:**
      *   The Buddhist/Dignāga reduction argues: "Believing testimony is inferring: 'This speaker is reliable; reliable speakers speak truth; therefore, this utterance is true.'"
      *   **Nyāya's Devastating Counter: Where does the knowledge of the premises come from?**
          *   **Premise 1: "This speaker is reliable."** How do you *know* this speaker is reliable? Did you *infer* it? If so, what were *your premises*? "I've heard them speak truthfully before." **But how did you know *those* utterances were true?** Did you personally perceive or infer *every single thing* this reliable speaker ever told you? If you did, why do you need *them*? If you didn't, you accepted *some* of their utterances on *testimony* to establish their reliability. **You are using testimony to justify the reliability needed for the inference that supposedly *replaces* testimony!** This is vicious circularity or infinite regress.
          *   **Premise 2: "Reliable speakers speak truth."** How do you know *this* general rule? Did you inductively infer it? This requires observing numerous instances where reliable speakers spoke and their statements were verified. **But how did you verify *their* statements?** Again, either through your own perception/inference (impossible for vast amounts of knowledge), or... you accepted *other* testimonies as valid to verify *these* testimonies. Once more, testimony is smuggled in as the foundation for the inference that is supposed to eliminate it. The reliability premise *itself* rests on testimonial knowledge.
      *   **The Novice Problem:** Imagine a child learning language. They hear the word "hot" while being shown a stove. They don't first establish the reliability of their parent (how could they, without language?), then infer the meaning. The knowledge of the meaning ("hot" signifies *that* sensation) arises *directly* from the utterance in the context. Nyāya argues this *is* a distinct cognitive event – *śabdabodha* (verbal comprehension) – irreducible to inference. The reliability of the parent *is* a factor for validity (*pramāṇya*), but the *mechanism* of understanding the meaning itself is direct and conventional, not inferential.

  3.  **The Unique Conditions of Testimonial Knowledge (Ākāṅkṣā, Yogyatā, Āsatti):**
      Nyāya identifies specific conditions necessary for *śabda* to generate valid knowledge (*śābdabodha*). These highlight its distinct nature:
      *   **Ākāṅkṣā (Expectancy):** Words in a sentence have mutual expectancy. Hearing "bring" creates an expectancy for *what* to bring. Hearing "cow" creates an expectancy for *what about* the cow. This syntactic/semantic interdependence is unique to language and generates a unified meaning (*vākyārtha*) that isn't just the sum of individual word meanings. Inference deals with isolated signs and probanda, not this complex web of expectancy. You don't "infer" grammatical relationships; you grasp them directly through linguistic competence.
      *   **Yogyatā (Congruity/Logical Possibility):** The meaning conveyed must be logically possible. "Water the fire" or "He ate a mountain" lacks *yogyatā* and thus cannot generate valid knowledge, even if uttered reliably. Inference, however, *can* sometimes deal with seemingly incongruous possibilities if the *vyāpti* holds (e.g., inferring fire under water if you know about underwater welding). The failure mode is different. *Yogyatā* is a semantic/syntactic filter inherent to linguistic understanding, not a test of empirical possibility required for inference.
      *   **Āsatti (Contiguity):** The words must be spoken in close succession to form a unified sentence. "Bring... (long pause)... cow" fails. This temporal proximity requirement is unique to the sequential nature of language comprehension. Inference doesn't require signs to be presented contiguously in time; you can see smoke now and recall the *vyāpti* later.
      *   **Tātparya (Intention):** Understanding the *speaker's intended meaning* in context is crucial. The same sentence ("It's cold here") can mean a statement of fact, a request to close the window, or a complaint, depending on context. Inference based on a general reliability rule cannot capture this pragmatic, context-dependent, intentional aspect. Grasping intention is a direct function of linguistic communication, not a conclusion drawn from observing reliability patterns.

  **Dealing the Final Blow: Why Reductionism Fails Phenomenologically and Practically**

  *   **Immediacy vs. Mediation:** When your friend says, "Pass the salt," do you *consciously* go through the steps: "1. Friend is reliable. 2. Reliable people speak truth. 3. Therefore, 'pass the salt' means I should hand him the salt"? No. The understanding is **immediate**. You grasp the meaning *directly* upon hearing the words, based on your linguistic competence and the context. Inference, by its nature, involves a conscious or unconscious process of recalling the universal premise (*vyāpti*) and applying it. Testimonial understanding lacks this mediating step for the *core meaning*.
  *   **The Foundation of Learning:** Vast swathes of human knowledge – history, geography, law, complex science beyond personal experiment, even the meanings of words themselves – are acquired *only* through testimony. Reducing all this to inference is not just cumbersome; it's impossible without presupposing testimonial knowledge at the base. How could you *infer* the meaning of "democracy" or "electron" without first accepting *someone's* testimony about what these terms signify? Inference builds *on* foundations laid by perception and testimony.
  *   **The Authority of the Śāstras:** For Nyāya (and other orthodox schools), the Vedas or other authoritative texts (*āptavākya*) are crucial sources of knowledge about supersensible realities (duty, liberation, the nature of the soul). Reducing Vedic testimony to inference is disastrous: Who established the *vyāpti* for the Vedic seers' reliability regarding the transcendent? It cannot be based on prior perception or inference about those very realities. Nyāya argues the validity of Vedic testimony is intrinsic (*svataḥ prāmāṇya*) under the right conditions (competent speaker, correctly transmitted), precisely because it *is* a fundamental *pramāṇa*, not a derivative inference.

  **Conclusion: Testimony Stands Alone**

  Dignāga's reduction is elegant but ultimately reductive. It fails to account for the **conventional, arbitrary nature of the word-meaning link** which has no equivalent of natural *vyāpti*. It collapses under the **regress/ circularity problem** when trying to justify the reliability premises without smuggling in testimony. It ignores the **unique linguistic conditions (ākāṅkṣā, yogyatā, āsatti, tātparya)** that govern testimonial understanding, conditions alien to inference. And it contradicts the **immediate, non-mediated phenomenology** of understanding language and the **practical necessity** of testimony as the bedrock of shared knowledge and learning.

  Nyāya doesn't deny that we *can* sometimes *reflectively* analyze testimony in inferential terms *after the fact*. But crucially, it argues that the *primary cognitive event* – the arising of knowledge from understanding a competent speaker's utterance – is a distinct, irreducible mode of knowing. *Śabda* is not inference in disguise; it's the very fabric of human communication and cultural transmission, operating on its own conventional, linguistic, and intentional terms. To reduce it is to fundamentally misunderstand how language grants us access to the world and each other. Your instinct that there's more to it than inference is correct – Nyāya provides the rigorous framework to defend that intuition. Now go arm yourself with these arguments and win that philosophical duel!
