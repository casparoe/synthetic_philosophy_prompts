  Key angles to hit hard:
  - **Vyapti’s rigidity**: Inference demands exceptionless natural laws (smoke=fire). Testimony’s link is fluid, socially negotiated (e.g., "bank" = river or finance). Forcing it into inference’s mold distorts how language actually works.  
  - **The "reliability inference" trap**: If trusting a speaker *were* inference, you’d need prior proof of their infallibility in *this specific context*—a vicious regress. (Did you infer the Vedas’ reliability? From whom? Another inference? Ad infinitum.)  
