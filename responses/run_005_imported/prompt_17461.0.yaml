  1. **Context collapse**: Reliability isn’t monolithic. A physicist’s word on quantum mechanics ≠ their word on astrology. Inference can’t handle this nuance without infinite prior justifications.  
  2. **Novel knowledge**: How do you "infer" a totally new fact? If I tell you "quarks have charm," and you’ve never heard it, what’s your vyapti? "Reliable physicists are truthful" is circular—it presupposes testimony’s validity.  

