     Arithmetic mean return: 5%
     Variance: 0.5*(0.3 - 0.05)^2 + 0.5*(-0.2 - 0.05)^2 
              = 0.5*(0.25)^2 + 0.5*(-0.25)^2
              = 0.5*0.0625 + 0.5*0.0625 = 0.0625
     So volatility drag: 0.05 - (0.0625)/2 = 0.05 - 0.03125 = 0.01875 -> geometric mean return ~1.875%

   For the leveraged case with leverage L (without borrowing cost):
     Arithmetic mean return: 0.05*L
     Variance: 0.5*(L*0.3 - 0.05L)^2 + 0.5*(L*(-0.2) - 0.05L)^2
              = 0.5*(0.3L - 0.05L)^2 + 0.5*(-0.2L - 0.05L)^2
              = 0.5*(0.25L)^2 + 0.5*(-0.25L)^2
              = 0.5*0.0625*L^2 + 0.5*0.0625*L^2 = 0.0625*L^2
     Then geometric mean return ~ 0.05L - (0.0625*L^2)/2 = 0.05L - 0.03125*L^2.

   The geometric mean return is the typical compounded return. We want this to be positive to avoid decay. But note that for large L, this becomes negative.

