   This suggests that with L=2, even though the arithmetic mean is 10%, the typical compounded return is negative! That means the portfolio will tend to lose money over time.

   Therefore, even though the expected value (arithmetic) is growing, the median outcome (which is what the geometric mean represents) is negative. This is why after 50 years the leveraged portfolio is often worth less.

   Conclusion: Your friend's reasoning is flawed because he is considering the arithmetic mean of returns, but the compounded growth is determined by the geometric mean. The geometric mean is reduced by volatility, and leverage amplifies volatility. Beyond a certain point, the volatility drag overwhelms the extra arithmetic return.

