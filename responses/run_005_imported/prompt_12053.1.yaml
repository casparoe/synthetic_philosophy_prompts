   Therefore, your friend's strategy of using 2x or 3x leverage is likely to lead to underperformance in the long run due to volatility drag, even without margin calls.

   Important note: This example uses a very volatile stock (with 50% chance of 30% gain and 50% chance of 20% loss). The actual stock market (like the S&P 500) has lower volatility. But the principle remains: leverage increases both return and volatility, and the volatility drag can be substantial.

