answer: |-
  Your simulation is likely correct, and it reveals a critical flaw in your friend's reasoning. While leverage does increase the *arithmetic expected return*, long-term wealth growth depends on the *geometric mean return* (compounded growth), which is eroded by volatility. Here's why:

  ### Key Insight: Volatility Drag
  - **Unleveraged Case**:  
    Annual return: +30% or -20% (50/50).  
    Arithmetic mean return: \(0.5 \times 30\% + 0.5 \times (-20\%) = 5\%\).  
    Geometric mean return (approx): \( \text{Arithmetic mean} - \frac{\text{Variance}}{2} \).  
    Variance: \(0.5 \times (0.3 - 0.05)^2 + 0.5 \times (-0.2 - 0.05)^2 = 0.0625\).  
    Geometric mean ≈ \(0.05 - \frac{0.0625}{2} = 0.01875\) (1.875%).  

  - **Leveraged Case (L×)**:  
    Return: \(L \times 30\%\) or \(L \times (-20\%)\).  
    Arithmetic mean: \(L \times 5\%\).  
    Variance: \(L^2 \times 0.0625\) (volatility scales with \(L\)).  
    Geometric mean ≈ \(0.05L - \frac{0.0625L^2}{2}\).  

  For \(L > 1\):
  - **Higher arithmetic mean** → *Higher expected portfolio value* (in the probabilistic sense).  
  - **But higher volatility drag** → *Lower median outcome* and higher risk of severe losses.  

  ### Why Your Simulation Shows Leverage Underperforming
  1. **Compounding asymmetry**:  
     A 20% loss requires a 25% gain to recover.  
     A 40% loss (2× leverage) requires a 66.7% gain.  
     Leverage amplifies downside recovery challenges.  

  2. **Extreme outcomes**:  
     With high leverage, bad sequences (e.g., multiple losses) can decimate capital. Even if the expected value is high (driven by rare extreme wins), *most paths* result in lower terminal wealth.  

  3. **Kelly Criterion insight**:  
     The optimal leverage for long-term growth is \(L_{\text{kelly}} = \frac{\mu}{\sigma^2}\), where \(\mu\) is expected return and \(\sigma^2\) is variance.  
     Here: \(L_{\text{kelly}} = \frac{0.05}{0.0625} = 0.8\).  
     Leverage > 0.8 *reduces* the geometric growth rate. At \(L=2\), growth rate ≈ \(0.05 \times 2 - \frac{0.0625 \times 4}{2} = -0.025\) (negative!).  

  ### Simulation Example (50 Years)
  - **Unleveraged**:  
    Median outcome grows at ~1.875%/year. Ending value: \(1.01875^{50} \approx 2.5\times\) initial.  
  - **2× Leverage**:  
    Growth rate ≈ \(-2.5\%\)/year. Median outcome: \(0.975^{50} \approx 0.28\times\) initial.  
    *Expected value* is higher due to rare paths with massive gains, but >90% of paths underperform unleveraged.  

  ### Practical Implications
  1. **Margin calls**: Even if avoided, volatility decay crushes compounded returns.  
  2. **Leveraged ETFs**: Designed for *daily* rebalancing. Holding them long-term amplifies volatility decay.  
  3. **Rational leverage**: For S&P 500 (historical \(\mu \approx 10\%\), \(\sigma \approx 15\%\)), optimal leverage is ~1.5×. Beyond this, drag dominates.  

  ### Conclusion
  Your friend’s flaw: Confusing arithmetic expectation (which scales linearly with leverage) with compounded growth (which suffers from volatility drag). **Higher leverage can (and often does) reduce long-term median wealth, even with positive expected returns.** Your simulation is not buggy—it correctly illustrates the non-linear destruction caused by over-leverage.
