   Note: In reality, leveraged ETFs also have management fees and the borrowing costs are not zero. But even without borrowing costs, the volatility drag is a real issue.

   For reference, the Kelly Criterion: the optimal leverage to maximize the long-term growth rate (i.e., the geometric mean) is given by:
     L_kelly = (expected excess return) / (variance of the excess return)

   In our case, the expected return per year is 5% and the variance is 0.0625 (as calculated above). However, note that the Kelly formula for a binary outcome is:
     L_kelly = (p - q) / (b)
     where p is the probability of winning, q=1-p, and b is the win amount per unit bet (if you win, you get b times your bet, and if you lose, you lose your bet).

   But our stock isn't exactly a bet: we are not betting a fixed amount and then getting a multiple. Instead, we are holding a fraction of the stock.

   Alternatively, we can use the formula for the growth-optimal leverage:
     L_kelly = (mu - r) / sigma^2
     where mu is the expected return (5%), r is the risk-free rate (we assumed 0), and sigma^2 is the variance (0.0625).

