  The user also mentioned wanting at least one question on each specified area. I should ensure all three are covered: epistemic, conscript liability, and self-defense. Also, each question needs a follow-up anticipating the guest's responses.

  I should check if the questions progressively tighten the pressure. The first question sets up the knowledge problem. The second links morality to law. The third addresses duress. The fourth combines knowledge and duress. Later questions challenge the guest's consistency and the practical implications of their stance. The sequence builds from individual moral dilemmas to systemic consequences, making the escape hatch less viable as we proceed.

  The user's deeper need is to equip students with tools to critically engage with revisionist arguments, showing the flaws in separating morality from legal structures. They want the seminar to demonstrate that such separation is untenable when examined closely. The questions should reveal contradictions in the guest's position and highlight real-world implications that the "deep morality" distinction ignores.
answer: |-
  Here's a sequence of 8 questions designed to corner the "deep morality vs. law" distinction, escalating in pressure, with targeted follow-ups anticipating McMahan-style replies. Each key area you requested is covered.

  **Core Strategy:** Force engagement on *why* the law *must* or *should* remain symmetric if the deep morality is fundamentally asymmetric, especially when that asymmetry creates severe practical and moral dilemmas.

  1.  **The Epistemic Starting Point:**
      *   **Question 1:** "You concede that *knowing* whether one's own cause is just is often incredibly difficult, if not impossible, for individual combatants – especially conscripts or those subject to intense propaganda. If the deep morality makes liability hinge *critically* on the *objective* justice of the cause, but combatants operate under radical uncertainty about this very fact, doesn't this epistemic gap *itself* become a powerful *moral* argument for retaining legal symmetry? Doesn't law, as a practical moral project, need to account for the limits of human knowledge in the fog of war?"
      *   **Anticipated Reply:** "The deep morality is about objective facts, not subjective belief. Lack of knowledge doesn't change the objective liability; it just means the law might need symmetry to avoid punishing those who couldn't know."
      *   **Follow-Up:** "But if the combatant *objectively* lacks knowledge (through no fault of their own in many cases), and acting on that lack of knowledge renders them liable to be killed *without moral wrong* by the just side, doesn't that suggest the 'deep morality' itself incorporates a kind of epistemic condition for *fair* liability? Isn't it deeply *unfair* to hold someone liable for facts they *could not reasonably access*, especially when the consequence is forfeiting their right to life?"

  2.  **Bridging Morality and Law Directly:**
      *   **Question 2:** "You often separate 'deep morality' from law. But isn't one of the core *functions* of the law of armed conflict (LOAC), especially its fundamental principles like distinction and proportionality, to translate *moral imperatives* (like minimizing harm to the innocent) into practical rules? If the deep morality reveals that *all* killings by unjust combatants are morally impermissible (lacking justification), while killings of unjust combatants by just ones are permissible (or even required), why *shouldn't* the law strive to reflect this fundamental asymmetry, rather than deliberately obscuring it with symmetry?"
      *   **Anticipated Reply:** "The law serves different purposes – primarily reducing suffering and maintaining order. Symmetry achieves this better by giving all combatants clear, reciprocal rules, encouraging compliance."
      *   **Follow-Up:** "Doesn't this instrumental justification for legal symmetry implicitly concede that the *deep morality* is too dangerous or destabilizing to actually *guide* human conduct in conflict? If the deep morality is the 'truth,' but we must actively *hide* it behind symmetric law for practical reasons, doesn't that raise serious questions about the *practical relevance* or even *moral coherence* of insisting on that 'truth' in isolation?"

  3.  **The Conscript & "Liable but Not Culpable":**
      *   **Question 3:** "Take the conscript forcibly drafted into the unjust side's army under severe duress (e.g., threats to family). You'd likely say they are *liable* to be killed (as part of an unjust threat) but not *culpable* (not blameworthy). Does this 'liable but not culpable' status hold water when the liability entails *forfeiting their right to life*? Can someone truly lack blame for posing a threat *and yet* justly lose their fundamental right to life simply by being coerced into that position? Doesn't duress fundamentally undermine the *fairness* of attributing liability strong enough to override the right to life?"
      *   **Anticipated Reply:** "Liability stems from being part of an objectively unjust threat, regardless of culpability. The conscript is still contributing to wrongful harm, making them liable. Their lack of culpability might mean we shouldn't *blame* them, but it doesn't negate liability."
      *   **Follow-Up:** "If the conscript poses a threat *only* because they are coerced into doing so under dire threat to themselves or loved ones, and resisting would likely mean their death, how is their 'contribution' meaningfully *voluntary* enough to ground liability? Isn't the core idea of liability usually tied to some degree of agency or responsibility? Doesn't extreme duress effectively *dissolve* the minimal agency required for even non-culpable liability in this context?"

  4.  **Epistemic + Duress Double Bind:**
      *   **Question 4:** "Combining the first two points: Imagine a conscript (under duress) in an army whose cause they genuinely, and perhaps reasonably given their information environment, *believe* to be just. According to deep morality, they are *both* objectively liable to be killed *and* subjectively convinced they are acting justly. If they are killed by the *truly* just combatant, is that killing *morally unproblematic*? And if so, doesn't this stark asymmetry – where one side kills with full moral impunity and the other kills only with profound moral wrongdoing – create an intolerable moral landscape that the symmetric law deliberately avoids, precisely *because* it recognizes the human realities of ignorance and coercion?"
      *   **Anticipated Reply:** "Again, the deep morality deals with objective facts. The killing *is* permissible. The law avoids this asymmetry for practical stability, not because the morality is wrong."
      *   **Follow-Up:** "But doesn't this insistence on 'objective permissibility' in the face of the conscript's reasonable belief and coercion reveal that the 'deep morality' is actually *divorced* from the conditions of moral agency and fairness that we normally apply? If the law recognizes the moral salience of these conditions (ignorance, duress) by imposing symmetry, isn't the *law*, in this instance, demonstrating a *deeper* moral insight than the purely 'objective' account?"

  5.  **Self-Defense in the Heat of Battle:**
      *   **Question 5:** "Once combat is joined, and a just combatant is actively trying to kill an unjust combatant (say, our conscript), does the unjust combatant retain *any* moral right whatsoever to defend *themselves*? Or is any act of self-defense by the unjust combatant against the just combatant *itself* an additional wrongful attack?"
      *   **Anticipated Reply:** "No, the unjust combatant has no right to self-defense against the just combatant. Defending themselves is simply continuing their unjust aggression. The just combatant is only posing a *justified* threat to which the unjust combatant is liable."
      *   **Follow-Up:** "So, the conscript under duress, facing imminent death from a soldier whose cause is objectively just (though unknown to the conscript), has *no moral permission* even to try to save their own life? They must simply stand there and be killed? Doesn't this conclusion violate a fundamental intuition about the *sheer value of human life* and the instinct for self-preservation, especially under coercion? Doesn't symmetric law, by granting both sides a 'right' to fight, tacitly acknowledge this irreducible core of self-preservation that persists even amidst objective injustice?"

  6.  **Pressing the "Disaster as Policy" Objection Harder:**
      *   **Question 6:** "You dismiss the 'disaster as policy' objection as irrelevant to deep morality. But isn't the *inevitable consequence* of widespread belief in this deep morality – that one side's combatants are essentially moral outlaws with no rights – precisely the kind of attitude that *fuels* atrocities, dehumanization, and total war? If internalizing this asymmetric morality demonstrably leads to worse outcomes (less restraint, more brutality), doesn't that constitute a powerful *moral reason* to *reject* it as a guiding framework, even if it's logically coherent in a vacuum? Isn't the *practical moral hazard* inherent in the asymmetric view itself a deep moral flaw?"
      *   **Anticipated Reply:** "The truth shouldn't be suppressed because it might be misused. We should educate people properly on the deep morality alongside the practical reasons for symmetric law."
      *   **Follow-Up:** "Given the pervasive fog of war, propaganda, and the inherent human tendency towards self-justification ('*our* cause is just!'), how feasible is this 'proper education'? Doesn't history show that beliefs about the enemy's fundamental lack of rights or moral standing are incredibly dangerous and easily weaponized? Isn't symmetric law, by deliberately *not* making moral distinctions between combatants, actually a crucial bulwark *against* this very danger, making it not just practically wise but *morally imperative*?"

  7.  **The Consistency Challenge:**
      *   **Question 7:** "If the deep morality is correct, and unjust combatants have no right to kill, then every act of violence by the unjust side is morally equivalent to murder. Yet, you argue the law should treat them *as if* they have combatant privileges (e.g., POW status, not prosecuted for mere participation). Isn't this legal framework actively *granting impunity* for what, by your lights, is mass murder? How can you morally justify a legal system that systematically fails to hold unjust combatants accountable for what you deem to be the most serious moral crimes?"
      *   **Anticipated Reply:** "The law grants immunity for practical reasons (ending conflicts, encouraging surrender) and because individual culpability is often hard to prove. It's a pragmatic compromise, not a moral endorsement."
      *   **Follow-Up:** "But doesn't this 'pragmatic compromise' involve the legal system *knowingly* treating acts you define as murder (killing just combatants) *differently* than murder in peacetime? Doesn't this create a profound dissonance? If the deep morality is true, isn't symmetric LOAC fundamentally *unjust* by design, systematically excusing the gravest wrongs? Can a 'pragmatic compromise' that necessitates such widespread *injustice* truly be morally defensible in the long run?"

  8.  **The Escape Hatch Collapse:**
      *   **Question 8:** "Putting it all together: Given the epistemic impossibility for combatants, the prevalence of coercion, the moral counter-intuitiveness of denying *any* self-preservation right in extremis, the practical moral hazard of internalizing asymmetry, and the legal system's resulting complicity in excusing mass killing according to your own framework – isn't the *only* coherent conclusion that the symmetric legal framework isn't just a *separate* pragmatic layer, but actually *reflects a deeper moral truth* that your purely 'objective' account misses? Namely, that in the tragic, chaotic reality of war, the moral equality of combatants *is* the most ethically defensible and humanly practicable principle available?"
      *   **Anticipated Reply:** Likely a reassertion of the separation or an attempt to deflect onto the specifics of one argument.
      *   **Follow-Up:** "If, after examining all these profound difficulties (epistemic, agential, psychological, practical, and systemic) that your asymmetric deep morality creates, you still insist the law *must* remain separate and symmetric, doesn't that prove the symmetric law isn't just practically necessary, but is actually *morally superior* as a guiding framework for human conduct in war? Doesn't the *need* for the escape hatch demonstrate the *failure* of the asymmetric view to provide a viable moral compass for actual human beings in conflict?"

  **Key Pressures Applied:**
  *   **Epistemic:** Questions 1 & 4 (and follow-ups) directly challenge the feasibility and fairness of liability based on unknowable facts.
  *   **Conscript/Duress:** Questions 3 & 5 (and follow-ups) attack the "liable but not culpable" distinction under coercion and its implications for self-preservation.
  *   **Self-Preservation:** Question 5 (and follow-up) specifically targets the denial of any self-defense right for the unjust combatant.
  *   **Morality-Law Link:** Questions 2, 6, 7, and 8 systematically break down the wall between "deep morality" and law, showing the moral implications and costs of maintaining the separation.
  *   **Escalation:** Starts with foundational problems (knowledge), moves to specific agents (conscripts), then to core rights (self-defense), then to systemic consequences (atrocity risk, legal impunity), finally forcing a holistic choice between the frameworks.

  This sequence forces the guest to either defend the practical and moral implications of their asymmetric view in the real world or concede that the symmetric law addresses fundamental moral concerns their "deep morality" overlooks or cannot handle. The escape hatch becomes increasingly difficult to use without appearing dismissive of genuine moral dilemmas or the practical realities of warfare.
