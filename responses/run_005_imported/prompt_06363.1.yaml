  Euclid's proof doesn't assume the existence of a finite list to then show a prime not in that list. Instead, it takes any finite list and constructs a prime not in it. That's a constructive proof. The contradiction arises because the assumption was that the list contained all primes, but the constructed number is either prime or has a prime factor not in the list. So, it's not really using LEM but directly constructing a new prime. 

