  The Ellsberg paradox might help too, though it's more about ambiguity aversion. Still, it shows a different kind of uncertainty that EU struggles with. But for pure risk, the three-outcome case is better. 

  I need to ensure the example is clear. Suppose Gamble A: $0 (p=0.5), $100 (p=0.5). Gamble B: $50 for sure. If someone chooses B, that's risk aversion from concave utility. But add Gamble C: $0 (p=0.01), $50 (p=0.89), $100 (p=0.1). EU would predict consistency, but REU allows preference reversals because the risk function weights the worst outcome more heavily. 

  The user might wonder if a complex utility function could mimic this. However, the global properties of the indifference curves in the Machina triangle show that REU's curves are linear but not parallel, while EU requires parallel curves. This structural constraint means no utility function can replicate REU's predictions across all gambles. 

  Also, the user mentioned their study group friend couldn't explain "global properties." This likely refers to how choices under risk depend on the entire distribution, not just local utility curvature. REU's risk function directly targets the cumulative distribution, altering how probabilities are aggregated. 

  I should emphasize that REU isn't just an extra parameter; it's a different axiomatic foundation. Buchak replaces the independence axiom with a weaker one, allowing for the Allais preferences. This theoretical distinction is crucial even if the models sometimes overlap. 

  The user's deeper need is to understand whether REU is a substantive contribution or just a reformulation. They might be preparing for exams or papers and need to grasp the theory's necessity. Highlighting the impossibility results (like those in the references) would strengthen the argument. 

