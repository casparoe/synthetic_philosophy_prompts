  I'll structure the memo with clear sections: purpose, policy statement, criteria, implementation, and review date. For criteria, low-effort rehashes should be removed immediately. Novel arguments require review, focusing on decision-theoretic rigor and safeguards. Discussions about surrogate goals can stay up with content warnings. 

