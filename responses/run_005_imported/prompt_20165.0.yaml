answer: |-
  I'll defend the **Knowledge Norm of Assertion (KNA)** and tackle both cases head-on. Here's the thesis: **You should assert that P only if you know that P.** This isn't "too strict" for everyday talk; it's the core standard governing assertion, explaining why we feel the intuitive pull in cases like the lottery *and* why the creationist teacher case is more complex than it first appears. I'll use the tools of contemporary epistemology (safety, sensitivity, Moorean absurdity) to show why KNA holds and how it handles the counterexamples.

  ## 1. The Case for the Knowledge Norm (KNA)
  *   **The Core Argument:** Assertion is the act of presenting P as *true*. Knowledge is the norm because:
      *   **Knowledge is the Aim of Assertion:** When we challenge an assertion ("How do you *know*?"), we're questioning its legitimacy. The natural defense is to cite knowledge ("I saw it land," "The schedule said so"). If justification alone sufficed, "I had good reason to believe it" would be a full defense – but it often feels inadequate *precisely* because it concedes you *didn't* know. Theo's annoyance when you pointed out he didn't "know" the flight landed shows this tacit recognition.
      *   **Moorean Absurdity & The Lottery Paradox:** Your lottery case is decisive. Asserting "My ticket lost" *before the draw* is deeply improper, even with 99.9999% justification. Why? Because you manifestly *don't know* it lost (it *might* win!). Attempting to *assert* it while *conceding* ignorance creates Moorean absurdity: "My ticket lost, but I don't know it lost." This feels contradictory because asserting P *commits* you to knowing P. If justified belief were sufficient, asserting "My ticket lost" should be perfectly fine. It isn't. Only KNA explains this impropriety. Justification is necessary *for* knowledge, but not sufficient *for* assertion.
      *   **Sensitivity & Safety:** KNA links assertion to robust connections with truth. A justified belief can be insensitive (you'd still believe P even if P were false) or unsafe (P could easily have been false). Knowledge typically requires safety (P couldn't easily have been false given your basis) or sensitivity (if P were false, you wouldn't believe it). In the flight case, Theo's belief wasn't safe – app errors or reporting delays happen easily. In the lottery, your belief isn't safe – your ticket *could* easily win. Asserting requires the kind of epistemic security knowledge provides.

  *   **Theo's "Too Demanding" Objection:** Everyday conversation *does* operate under KNA implicitly. We *do* criticize people for asserting things they "didn't really know" when they turn out false, even if their belief was reasonable (like Theo's flight app). We accept assertions based on testimony *because* we presume the testifier knows (or is in a position to know). Relaxing the norm to justified belief invites assertions based on mere high probability or good guesses, which *does* feel inappropriate for flat-out assertion. "It's probably true" demands hedging; "It's true" demands knowledge.

  ## 2. Handling the Creationist Teacher: Why KNA Still Holds
  Theo's case is clever, but it doesn't refute KNA; it reveals a nuance about *who* is bound by the norm in contexts of delegated epistemic authority.

  *   **The Impropriety Under KNA:** According to KNA, the creationist teacher's assertion *is* improper. She asserts "Species evolved via natural selection" (P) while *knowing she does not know P* (she disbelieves it!). This creates a profound Moorean absurdity *for her*: "Species evolved, but I don't know it (in fact, I believe it's false)." This is deeply epistemically dissonant. KNA predicts this assertion *should* feel improper *from her perspective*.

  *   **Why It *Seems* Proper (And Why That Doesn't Refute KNA):**
      1.  **The Student's Perspective:** The students *rightly* take her assertion as conveying the *scientific consensus and evidence*. They are entitled to assume she is asserting *based on* the knowledge possessed by the scientific community, which she is accurately representing. *For them*, her assertion is parasitic on *that* knowledge. They hear it *as* "Science knows P," not "I, the creationist, know P." The seeming propriety stems from the *content's* truth and justification, and the *institutional role* legitimizing the utterance *as a conveyance of established knowledge*, not from the *speaker's* epistemic state satisfying the norm for *her own* assertion.
      2.  **The Role of Testimony & Delegation:** In institutional roles (teacher, news anchor, expert witness), the speaker often functions as a *conduit* for knowledge they themselves may not possess personally, but which is possessed by the institution/field they represent. The norm governing *their* assertion in that role is derivative: **They should assert that P only if they are accurately representing a body of knowledge K (possessed by the relevant experts/institution) and P is part of K.** This *looks* like a justified true belief norm, but it's actually a specialized application of KNA. The teacher asserts properly *qua teacher* because she accurately conveys *biological knowledge* (possessed by the scientific community). Her personal disbelief violates the *personal* KNA, making her assertion *personally* improper and intellectually dishonest, even if *professionally* effective and contextually understood as conveying institutional knowledge. The norm violated is the *personal* commitment inherent in asserting P *as true*.

  *   **The Key Distinction:** KNA governs the act of assertion by an individual presenting P *as something they themself take to be true*. The creationist teacher *is not doing this*. She is presenting P *as what science takes to be true*. This is a different speech act – **representing institutional knowledge** – governed by a different (though related) norm tied to accuracy of representation and institutional role, not the speaker's personal knowledge state. The intuition that her assertion is "fine" confuses the propriety of conveying established fact within a role with the satisfaction of the core norm of *personal* assertion.

  ## 3. Why Not a Justified Belief Norm (JBN)?
  Theo prefers JBN: **You should assert that P only if you justifiably believe that P.** This fails decisively:

  1.  **The Lottery Problem (Redux):** JBN *must* say asserting "My ticket lost" pre-draw is perfectly proper because you have overwhelming justification. This is deeply counterintuitive and fails to explain the strong impropriety we feel. JBN collapses the distinction between what's highly probable and what's known, which is crucial for assertion. Saying "It probably lost" is JBN-appropriate; saying "It lost" is KNA-appropriate only post-draw.
  2.  **The Flight App Problem:** Theo had a justified belief based on the app. JBN says his assertion was proper. But when it turned out false, the criticism "You *didn't know*!" is valid. JBN can't adequately explain why this criticism bites – it can only say "Well, his justification was defeated *later*," but that doesn't address the *impropriety at the time of assertion* if the justification was *then* good but insufficient for knowledge (because unsafe/insensitive).
  3.  **The Creationist Teacher Isn't Saved:** JBN *also* condemns the creationist teacher! She lacks *belief* in P, so she *lacks justified belief* in P. JBN can't explain why her assertion seems proper either! Only KNA, coupled with the institutional role analysis, can handle both the lottery impropriety *and* the contextual propriety of the teacher's assertion.
  4.  **Lack of Robustness:** JBN allows assertions based on beliefs that are justified but gettiered (true by luck) or unsafe. KNA ties assertion to a more robust connection with truth (safety/sensitivity), which is what we demand when someone stakes a claim by asserting "P is true."

  ## Conclusion
  The Knowledge Norm of Assertion (KNA) stands. It explains the impropriety of asserting lottery losses pre-draw and "known" flight arrivals based on fallible apps. It also explains the *apparent* propriety of the creationist teacher's assertion: her speech act is not a simple assertion governed purely by personal KNA, but a complex act of *representing institutional knowledge* within a professional role, where the norm is derivative (accurately convey the knowledge possessed by the institution). While everyday conversation tolerates minor KNA violations (we don't *always* have Cartesian certainty), the norm is still operative – we expect people to assert only what they take themselves to know, and we criticize them when they assert something false that they merely believed on good grounds. Theo's "reasonable belief" standard lowers the bar too far, conflating high probability with assertable fact and failing to capture the essential commitment to truth and epistemic security inherent in saying "P is true." Knowledge isn't too demanding; it's precisely what assertion requires.
