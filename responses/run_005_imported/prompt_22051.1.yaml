answer: |-
  ## The Unsquareable Foundation (A Dialogue)

  **Setting:** A dimly lit tavern near Oxford, autumn 1656. Rain streaks the grimy windows. Thomas Hobbes, hunched over a mug of ale, glares across the table at John Wallis, who meticulously cleans his spectacles with a handkerchief. The air crackles with mutual contempt and the fresh ink of Hobbes’s *Six Lessons*.

  **WALLIS:** (Without looking up) So, Thomas. *Six Lessons*. More like six hundred insults wrapped around a single, stubborn error. You persist in this circle-squaring folly even as the *Elenchus* dissected it, limb from limb. Is obstinacy now a geometric postulate?

  **HOBBES:** (Voice low, gravelly) Obstinacy, John? No. Certainty. You mistake my refusal to yield for mere pig-headedness. You fail to grasp the *ground* upon which I stand. Geometry, like civil philosophy, possesses an unshakeable certainty precisely because we *are* its architects. We draw the lines, we define the figures, we build the commonwealth by covenant. We *make* the objects. Their properties flow demonstrably from their generation. Physics… physics is guesswork in the dark. But *this*? *This* is light.

  **WALLIS:** (Sighs, replacing spectacles) Light? Your ‘demonstrations’ lead only into deeper darkness, Thomas! You claim unique certainty for geometry because you construct its objects? Very well. Then demonstrate it! Square the circle! Trisect the angle! But you *cannot*. Not then, not now. Your constructions *fail*. Your lines don’t meet where you claim, your arcs don’t equal your chords. You boast of building the house yourself, yet every wall you erect collapses under its own weight! How can a science of construction claim unique certainty when its most vocal proponent cannot construct correctly?

  **HOBBES:** (Leans forward, eyes intense) The *principle* stands, Wallis! The certainty lies in the *nature* of the act, not in the fallibility of the individual mason! Consider a simple carpenter. He *makes* the joint. He *knows* its fit because he shaped both pieces. That he might occasionally cut poorly, that his chisel might slip – does that invalidate the fundamental certainty inherent in the *act of making* the joint itself? No! It merely exposes the carpenter’s weakness, not the weakness of the principle. My geometry, my civil philosophy – they rest on the bedrock of *generation*, of *construction by definition*. The certainty is in the *method*, not contingent on my, or your, clumsy execution!

  **WALLIS:** (Taps the table impatiently) A pretty analogy, Thomas. But flawed. The carpenter’s failure is evident *in the material world* – the joint wobbles, the table collapses. We see the failure. Your geometric failures are equally evident *in the geometric world* – the lines demonstrably do not behave as you claim they do by your own constructions! Your error isn’t a slip of the chisel; it’s a fundamental misunderstanding of the properties *of the very objects you claim to have generated correctly*. If the certainty stems from correct generation, and your generation is demonstrably incorrect, then your claim to certainty *for that specific construction* is void. Repeatedly void!

  **HOBBES:** You miss the forest for the trees, Professor! The certainty of geometry resides in the *possibility* of perfect generation, in the clarity of the definitions and the logical necessity of the deductions *from* those definitions. My… missteps… are failures of application, failures of insight, perhaps – human frailties! They do not negate the inherent certainty *potential* in the science itself, derived from its constructed nature. Unlike your own… *arithmetic of symbols*! You hide behind a fog of ‘a’s and ‘b’s, ‘x’s and ‘y’s, manipulating phantoms! Where is *your* construction? Where is the line drawn, the figure generated? Your algebra is a house built on air, a system of ungrounded marks signifying nothing but themselves! *That* is unphilosophical! That lacks the solidity of true generation!

  **WALLIS:** (A cold smile) Ah, the old contempt for the symbolic. My ‘fog,’ Thomas, allows me to *see further*. It allows me to manipulate relationships you cannot even conceive of with your ruler and compass alone. My symbols *represent* magnitudes and operations grounded in precisely the geometric reality you prize. They are tools, powerful tools, forged from logic. They reveal truths about the figures you draw, truths your purely constructive method, hampered by your own limitations, cannot reach. My algebra doesn’t undermine generation; it *extends* its power, revealing consequences inherent within the constructions you value.

  **HOBBES:** It abstracts! It detaches! It becomes a game, divorced from the clear, tangible objects of sense and reason! True knowledge requires tracing the generation step by step, seeing the cause *in* the construction. Your symbols leapfrog over that process. They offer results without the necessary causal chain. It’s… conjuring!

  **WALLIS:** And your repeated, demonstrable failures to square the circle? Are they not a spectacular failure of that causal chain *you* claim guarantees certainty? You draw lines, you define arcs, you claim equality – and the geometric world itself, the very domain you say we construct and therefore know certainly, shouts *No!* Your system, Thomas, your beautiful edifice of certainty based on generation – it seems curiously impervious to the evidence of its own repeated collapse *when applied by its chief architect*. If the method guarantees certainty, why does it fail you so consistently? Is the architect so uniquely flawed? Or is the guarantee itself… illusory?

  **HOBBES:** (Silent for a long moment, staring into his ale. When he speaks, his voice is quieter, but still firm) The flaw… lies in the complexity, Wallis. Not in the principle. The circle… it resists. The commonwealth… it too can falter, through faulty covenants, through passion overwhelming reason. But the *idea*… the idea that we build it, that its laws stem from its artificial generation – *that* remains the source of its potential certainty. Physics can never achieve this. Nature’s causes are hidden, inferred. Ours… ours are declared. Made. Known. My compass may waver, my hand may tremble… but the compass *is* true. The hand *can* be steadied. The principle… the principle of constructed certainty… it stands. Leviathan stands upon it. And no failed quadrature, no matter how many times you crow about it, will bring *that* down. *(He drains his mug and stands abruptly)* Good evening, Professor. My commonwealth requires my attention. Unlike your symbols, it has teeth. *(He turns and walks out into the rain.)*

  **WALLIS:** (Watches him go, then murmurs to himself, shaking his head) Teeth indeed, Thomas. But built on sand your geometry cannot seem to square. The principle may stand in your mind… but your failures stand as monuments in the real world of figures we *both* claim to know. Certainty? It requires more than just declaration. It requires proof. And yours… remains stubbornly unsquared. *(He carefully folds his handkerchief and tucks it away.)*
