answer: |-
  Your frustration is deeply understandable – and as an evolutionary biologist, you've nailed a core tension in teleosemantics. Millikan's appeal *is* its grounding in natural selection, but the leap from "selected effect" to "determinate content" is where the real philosophical work happens. Let's break down why "proper function" isn't *just* statistical normalcy and how it (attempts to) solve the disjunction problem:

  1.  **Proper Function ≠ Current Statistical Normalcy:**
      *   **Historical Selection is Key:** Millikan defines a mechanism's "proper function" not by what it *currently* does most often or most reliably *now*, but by what it was *selected for* doing in the organism's evolutionary history. This is a causal-historical property.
      *   **The Frog's Detector:** Yes, in a lab setting, the frog's detector fires equally at flies and BB pellets. *Statistically*, they are equivalent triggers *in that environment*. But the mechanism (the neural pattern detector feeding the snapping reflex) exists in the frog *because* its ancestors' similar mechanisms successfully detected and led to the capture of *nutritious flies*. This contributed to survival and reproduction. BB pellets are a modern, artificial anomaly absent from the selection history.
      *   **Normality vs. Normal Conditions:** Millikan's "Normal" explanation (capital 'N') is crucial and often misunderstood. It refers *not* to what is statistically average *now*, but to the *specific range of conditions* under which the mechanism historically performed its function *in a way that explained its selection and propagation*. The mechanism was designed *for* an environment containing flies, not BB pellets. Firing at a BB pellet is not part of the "Normal" explanation for why this detector type proliferated.

  2.  **Solving the Disjunction Problem: The Teleosemantic Pruning Shears:**
      The disjunction problem asks: When a detector fires for a fly (F) or a BB (B), does it represent F, B, or the disjunction (F or B)? If it's (F or B), then firing at B isn't *mis*representation, it's just accurate representation of a disjunct. This makes error impossible.

      *   **Teleosemantics' Answer:** The content is determined *solely* by the condition for which the mechanism was *selected*. The mechanism was selected *for detecting flies (F)* because *that detection leading to snapping* contributed to fitness in the past. The mechanism was *not* selected for detecting BB pellets (B). Therefore:
          *   Firing in the presence of F is a **true positive.**
          *   Firing in the presence of B is a **false positive/misrepresentation.** It's doing something it wasn't *supposed* to do, according to its evolutionary function.
          *   The content is **fly present (F)**, *not* (F or B). The disjunct B is pruned away by the historical selection criterion.

  3.  **Why "Reliably or Normally" is Misleading:**
      *   **Reliability in the EEA:** The mechanism only needed to be reliable *enough* in the Environment of Evolutionary Adaptedness (EEA) for its fly-detecting function to be selected. "Reliable" here means reliable *in detecting flies under ancestral conditions*, not reliable in detecting *whatever* triggers it now. The presence of mimics or novel artifacts (BB pellets) doesn't change the historical function.
      *   **"Normally" Means Historically Functional:** "Normally" in Millikan's sense doesn't mean "statistically common now." It means "in accordance with the Normal explanation" – i.e., under the conditions that historically allowed the mechanism to perform its function *and thereby explain its existence via selection*. BB pellet detection played no role in that historical explanation.

  4.  **Addressing Your Core Concern (Bait-and-Switch?):**
      You're right that if "proper function" were *simply defined* as "whatever the mechanism most reliably does now," it *would* collapse into statistical normalcy and fail. The *substance* of Millikan's theory is that "proper function" is defined **rigorously by the causal history of natural selection.** It's not a label slapped onto current dispositions; it's a specific historical fact about why the mechanism exists. The frog detector *reliably* fires at BB pellets *now*, but that reliability is irrelevant to defining its *proper function*. Its proper function is defined by the *past reliability* (in the EEA) of fly detection causing fitness benefits.

  5.  **Why Philosophers Credit It (and the Criticisms):**
      *   **Naturalistic Grounding:** It provides a non-mysterious, scientifically respectable basis for intentionality – rooted in Darwinism.
      *   **Solving Disjunction/Misrepresentation:** It genuinely offers a principled, naturalistic way to distinguish true representation from false representation (error) by anchoring content in historical success conditions, not current dispositions. Firing at a BB pellet *is* an error *because* it's not what the mechanism was *for*.
      *   **Handling Novelty/Malfunction:** It explains how a state can represent something absent (desiring water in the desert) or misrepresent (the BB pellet as a fly) – states are produced by mechanisms whose function is defined by past success, not current success or input.

      **However, Valid Criticisms Persist (which you're intuitively hitting):**
      *   **The "Swampman" Problem:** Could a molecule-for-molecule duplicate of a human, formed by lightning in a swamp (no evolutionary history), have intentional states? Teleosemantics says no, which seems counterintuitive to many.
      *   **Indeterminacy of Selection History:** Pinpointing *exactly* what historical condition a mechanism was selected for can be incredibly difficult. Was the frog detector selected for "flies," "small nutritious airborne objects," "small dark moving things that *were* flies," or something else? Selection pressures are often coarse-grained. Millikan offers tools (e.g., "local natural signs"), but indeterminacy remains a serious challenge.
      *   **Complexity of "Normal" Explanations:** Defining the precise "Normal conditions" under which a mechanism historically functioned successfully can be complex and potentially vague.
      *   **Applicability to All Mental Content:** Can it scale to complex human thought (mathematics, fiction, future planning) in a satisfying way? Many argue it struggles.

  **In Conclusion:** You're absolutely correct that *if* "proper function" meant current statistical normalcy, teleosemantics would fail. Its power lies precisely in Millikan's **historical-selectional definition** of proper function. The frog's detector represents *flies* because that's what it was *selected for* detecting, even though it *currently* fires just as reliably at BB pellets. This historical criterion is what prunes the disjunction (BB pellet) and allows for genuine misrepresentation. While significant challenges remain (indeterminacy, Swampman, scaling up), teleosemantics deserves credit for providing the most promising *naturalistic* solution to the disjunction problem by grounding content in the causal history of evolution, not just present-day statistical regularities. Your biologist's instinct that current dispositions shouldn't dictate content is exactly what motivates the appeal to *past* selective success. The devil is in the details of making that historical link determinate enough.
