  Also, the user might overlook that Millikan's theory involves complex conditions like Normal explanations—how mechanisms contributed to fitness in ancestral environments. It's not just what they do now, but how they were supposed to work then. The frog's visual system was designed for flies in its native habitat, not lab experiments with BB pellets.

  Their frustration with "fancy labels" is understandable. But proper function is a technical term with specific criteria: past selection, contribution to fitness, and reproduction of the mechanism. It's more than statistical norm. Maybe the user hasn't fully grasped Millikan's definition beyond surface-level explanations.

