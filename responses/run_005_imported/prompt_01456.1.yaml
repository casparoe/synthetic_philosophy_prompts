  Ah, but Wittgenstein isn't denying that we *have* meaning; he's redefining what meaning *is*. For logic homework, the "agreement" isn't arbitrary—it's scaffolded by centuries of mathematical practice. The professor isn't hypocritical; they're participating in the very language-game that constitutes logical meaning. 

