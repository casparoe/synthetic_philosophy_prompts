  The challenge is to show why this fails in private cases. I should use examples like deathbed promises or desert island scenarios where no third parties are involved. The key is to attack the "logically prior" claim by arguing that such cases reveal a core obligation that exists independently of the social practice.

  I need to engage with the "logically prior" move. Rawls says you can't promise without the practice, just like you can't steal a base without baseball rules. But in private promises, the act of promising seems to function without the social scaffolding. The words "I promise" create an obligation directly between two people, regardless of society. This suggests that the practice isn't logically necessary but practically useful for complex scenarios. The deathbed case exposes that the obligation stems from the interpersonal commitment, not the institution.

