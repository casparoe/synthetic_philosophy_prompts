answer: |-
  Here’s an argument against Rawls’s practice theory, targeting his "logically prior" move and proposing an alternative grounding for promissory obligation:

  ### Why Rawls’s Defense Fails in Private Promise Cases
  Rawls’s "logically prior" analogy to games like baseball is compelling *if* we assume promising is *exhaustively* defined by its institutional role. But the deathbed promise (or a desert island promise between two castaways) exposes a flaw: **it severs the act of promising from the social practice’s functional purpose while preserving the obligation**. Rawls insists that the son’s promise "cannot" be evaluated outside the practice because the practice defines what promising *is*. Yet in this case:
  1.  **The practice’s utility is absent**: The promise is secret; breaking it won’t undermine trust in promising generally (no "reputational damage") or destabilize the institution. The practice’s *raison d'être*—enabling reliable cooperation by deterring defection—doesn’t apply.
  2.  **The obligation persists intuitively**: The son (or castaway) feels bound *solely* by the commitment made to the dying father (or fellow castaway), not by fidelity to an invisible institution. This intuition is widely shared (see Ross, Shiffrin, or Thomson’s critiques).
  3.  **Rawls’s "no standing" reply begs the question**: To say the son "lacks standing" to weigh consequences presupposes the practice’s authority. But if the practice’s *own justification* (social utility) is irrelevant in this case, *why* does the practice retain its grip? Rawls offers no independent reason why the practice’s rules should bind when its justifying purpose is inoperative. The "logically prior" move becomes a circular shield: "You must obey the rule because the rule says you must obey the rule."

  **The core failure**: Rawls conflates the *conceptual* conditions for describing an act ("This is a promise") with the *normative* source of its obligation. While the *term* "promise" might be practice-dependent (like "strikeout"), the *moral force* of committing oneself to another person arises from the interpersonal act itself, not the institution. The deathbed case shows that the practice is **pragmatically essential for complex coordination but not *normatively* necessary for the core obligation to arise**. The "logically prior" move explains how we *identify* promises but not why they *bind* in isolation.

  ### What Grounds Promissory Obligation: The Expectation-Generation Account
  If not the practice, what? I argue the binding core is **the deliberate creation of expectations in the promisee, coupled with the promisor’s assumption of responsibility for those expectations**. 

  1.  **The Mechanism**: When A says "I promise to φ" to B, A *intentionally* induces B to expect that A will φ. This isn’t just predicting behavior ("I’ll probably φ"); it’s a commitment to make the prediction true. A invites B to rely on A’s future action.
  2.  **Why it Binds**: 
      *   **Harm Prevention**: Breaking the promise *harms* B by frustrating the expectation A *created and endorsed*. B may have foregone opportunities, invested emotionally, or structured plans based on A’s assurance. This harm exists even if secret (e.g., the father dies believing his estate will be handled as promised; the castaway is stranded without promised aid).
      *   **Agency and Responsibility**: By voluntarily performing a speech act designed to generate expectation and reliance, A incurs a duty to avoid the harm they made foreseeable. It’s a self-imposed constraint rooted in respect for B’s autonomy – A manipulated B’s practical reasoning and must honor that.
  3.  **Why it Explains the Deathbed/Desert Island Case**: The obligation flows directly from the dyadic interaction. The son creates an expectation in the father; breaking the promise exploits the father’s vulnerability (his imminent death prevents enforcement) and betrays the specific trust *he* invited. The social practice is irrelevant because the expectation and reliance are entirely local.
  4.  **Relationship to Practice**: Social practices *amplify* this core by standardizing the expectation-generating act ("I promise" reliably triggers reliance), enabling enforcement, and solving coordination problems. But they *parasitize* the underlying normative force of expectation-creation, not create it. A desert island promise works because the castaways understand the interpersonal norm, not because they mentally invoke a phantom institution.

  **In short**: Promising binds because it is a deliberate act of will that creates expectation and invites reliance in a specific other person. Rawls’s practice theory explains the scaffolding, not the foundation. The deathbed promise isn’t an anomaly; it reveals the practice-independent core of promissory obligation: the moral weight of assuming responsibility for another’s expectations.
