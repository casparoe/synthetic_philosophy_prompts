  7. the hidden-indexical theory of belief reports (Schiffer; Crimmins and Perry)
  8. two-dimensional semantics (Stalnaker, Chalmers, Jackson)

  Let's analyze each:

  1. Frege's sense/reference: 
     - (a) Informativeness: Explained by different senses (modes of presentation) for the same referent. So "Hesperus is Phosphorus" is informative because it links two different senses.
     - (b) Substitution failure: Attitude reports report relations to senses, not references. So Pierre believes the sense of "Londres est jolie" but not the sense of "London is pretty". 
     - This handles both without ad hoc stipulation? Frege's theory was designed for this. But note: senses are abstract objects and the theory requires a rich ontology. Also, the problem of how senses are determined and whether they are public might be an issue, but it's not ad hoc for the puzzle.

  2. Russell's definite-description theory of names:
     - Names are abbreviations for definite descriptions. So "Hesperus" might be "the evening star" and "Phosphorus" "the morning star".
     - (a) Informativeness: "The evening star is the morning star" is informative because it's a contingent identity, while "the evening star is the evening star" is trivial.
     - (b) Substitution failure: In attitude reports, the descriptions are part of the content. So Pierre believes "the city called 'Londres' is pretty" but not "the city called 'London' is pretty". 
     - However, Kripke's modal and epistemic arguments against descriptivism: in modal contexts, names and descriptions behave differently. Also, the theory might be seen as stipulative because it requires that every name has an associated description (which might vary by speaker) and that the description gives the meaning. Kripke's arguments are strong against this.

  3. naive Millian direct reference:
     - Names contribute only their referent to the proposition. So both "Hesperus is Hesperus" and "Hesperus is Phosphorus" express the same proposition (if co-referential) and both attitude reports (if co-referential) should have the same truth value.
     - (a) Cannot explain informativeness: the two identity statements express the same proposition, so why is one informative and the other not?
     - (b) Cannot explain substitution failure: Pierre's case is a contradiction.
     - This fails both criteria without additional machinery.

  4. Kripke's causal-historical theory of reference (for reference fixing) plus pragmatic account of informativeness:
     - Reference is fixed by causal chain, not descriptions. But for informativeness, Kripke (in "A Puzzle about Belief") suggests that the puzzle of belief reports might be due to pragmatic factors (like the speaker using two names without knowing they co-refer) and not semantics.
     - (a) Informativeness: Explained pragmatically. The sentence "Hesperus is Phosphorus" is informative because it conveys that two names, which the hearer might not have known were co-referential, are in fact the same. But the proposition expressed is the same as "Hesperus is Hesperus".
     - (b) Substitution failure: Kripke's Pierre case is explained as a pragmatic illusion. The belief report might be true in one context and false in another due to the way the names are used, but strictly speaking, Pierre believes and disbelieves the same proposition. This leads to a paradox. Kripke doesn't offer a solution but suggests that we might have to accept that belief is not a binary relation or that the puzzle shows a flaw in our ordinary practices. 
     - So it doesn't really solve (b) without ad hoc stipulation? It leaves the puzzle unsolved at the semantic level.

  5. Nathan Salmon's guise-theoretic Millianism:
     - Millian about reference: the proposition expressed is singular (containing the referent). But attitude ascriptions involve guises (ways of taking the proposition). 
     - (a) Informativeness: The same proposition can be grasped under different guises. So "Hesperus is Phosphorus" is informative because it presents the same object under two guises, linking them.
     - (b) Substitution failure: In attitude reports, the report is true only if the believer believes the singular proposition under the specific guise that the report uses. So Pierre believes the singular proposition (that London is pretty) under the "Londres" guise but not under the "London" guise. 
     - This handles both, but note: guises are similar to Fregean senses, but Salmon remains a Millian at the level of semantic content. The account is systematic and not ad hoc.

  6. Scott Soames' pragmatic-enrichment account:
     - Soames is a Millian but uses pragmatic enrichment to explain the phenomena.
     - (a) Informativeness: The utterance of "Hesperus is Phosphorus" pragmatically imparts information about the co-reference of two names (or the associated descriptions) even though the semantic content is the same as "Hesperus is Hesperus".
     - (b) Substitution failure: Attitude reports are semantically about singular propositions, but when we say "Pierre believes that Londres is jolie", we pragmatically convey that he believes it under a French guise, while "Pierre believes that London is pretty" conveys an English guise. So the reports can differ in truth value because of the pragmatic enrichment.
     - However, this approach has been criticized as being too pragmatic and not accounting for the semantic intuitions. Also, it might be seen as ad hoc because it uses pragmatics to explain away what seems semantic.

  7. Hidden-indexical theory (Schiffer; Crimmins and Perry):
     - Attitude reports have a hidden argument place for a mode of presentation (or in Crimmins and Perry, for mental particulars called "notions").
     - (a) Informativeness: Not directly addressed? But the idea is that the mode of presentation is part of the truth-conditions of the attitude report. For identity statements, they might say that the statement is informative because it links two modes of presentation.
     - (b) Substitution failure: The belief report is true only if the believer has a belief with the same referent and the same mode of presentation (or notion) as the one expressed by the embedded sentence. So "Pierre believes that Londres is jolie" requires that Pierre believes it under the "Londres" notion, while "Pierre believes that London is pretty" requires the "London" notion. 
     - This handles (b) well, and by extension, (a) can be explained by the difference in modes. But note: the theory is complex and requires that attitude reports have an extra argument that is often not articulated. Also, it might be seen as stipulative because the hidden indexical is not syntactically present.

  8. Two-dimensional semantics (Stalnaker, Chalmers, Jackson):
     - Distinguishes two intensions: primary (epistemic) and secondary (metaphysical). 
     - (a) Informativeness: "Hesperus is Phosphorus" is a posteriori because in some epistemically possible scenarios it is false (where the evening star and morning star are distinct), while "Hesperus is Hesperus" is a priori. So the primary intensions differ.
     - (b) Substitution failure: In attitude reports, what matters might be the primary intension. So Pierre associates different primary intensions with "Londres" and "London", so the belief reports are about different primary intensions.
     - However, this approach has been criticized for being too epistemic and not capturing the metaphysical rigidity of names. Also, it might not be straightforward for names that are rigid in both dimensions? Chalmers argues that names have a primary intension that is descriptive, but Kripkeans reject that.

