  ok so i fell down a rabbit hole last night reading about the Doomsday Argument (the carter-leslie one where because youre supposedly a 'random' human out of everyone whos ever gonna live, thats supposed to be evidence theres not that many humans left to come). i thought i got it but then i found out theres this whole SSA vs SIA fight in the anthropic reasoning literature and i got kind of lost. can you write me a dialogue between a philosopher who defends the doomsday argument using SSA and one who thinks SIA cancels the whole thing out? i want the SIA person to actually have to deal with the presumptuous philosopher thing (pretty sure thats the classic objection to SIA?) instead of just brushing past it, and i want the SSA person to actually have to answer the reference class problem instead of just saying "reference class = humans" and moving on. dont let them just talk past each other, make them respond to each others actual points, and end it with whoever's losing a point actually biting the bullet instead of the conversation just trailing off into "well we just disagree."
