answer: |-
  You've nailed the core tension - this *is* more than a cheap trick, but it's also not flawless logic. Gongsun Long's "White Horse Dialogue" (*Báimǎ Lùn* 白馬論) is a deliberate, multi-step argument exploiting ambiguities in language and concepts, aiming to reveal something fundamental about how names (words) relate to reality. Let's break down the strongest reconstruction and assess its merits.

  **Core Arguments from the Text (Beyond the Soundbite):**

  1.  **The "Shape/Color" Distinction (The Famous Bit):**
      *   "Horse" (*mǎ* 馬) names/formally indicates the *shape/form* (xíng 形). It picks out the category defined by equine physical characteristics.
      *   "White" (*bái* 白) names/formally indicates the *color* (sè 色). It picks out the quality of whiteness.
      *   **Therefore:** What names the shape is not what names the color. What names the color is not what names the shape.
      *   **Conclusion:** "White horse" is not "horse" (*báimǎ fēi mǎ* 白馬非馬). The compound concept "white horse" has a different *extension* (scope of things it refers to) and *intension* (defining characteristics) than the simple concept "horse".

  2.  **The Substitution Test (The Crucial Move - Your "Yellow/Black Horse" Point):**
      *   Suppose someone wants a "horse". A yellow horse or a black horse can satisfy that request. The request is for an instance of the *shape/form* "horse". Color is irrelevant.
      *   Now, suppose someone wants a "white horse". Neither a yellow horse nor a black horse can satisfy that request. Only a horse *that is also white* will do.
      *   **Analysis:** The set of things that satisfy "horse" (all horses) is larger than the set that satisfies "white horse" (only white horses). The yellow/black horse test proves they are not co-extensive.
      *   **Conclusion:** If "white horse" were identical to "horse", then asking for a horse *should* allow you to substitute a white horse, and asking for a white horse *should* allow you to substitute any horse. But the substitution *only* works one way (you can give a white horse when asked for a horse, but *not* any horse when asked for a white horse). Therefore, "white horse" cannot be identical to "horse". They name different things.

  3.  **The "Combination Creates Uniqueness" Argument:**
      *   "Horse" has no color specification; it's indeterminate regarding color. "White" has no shape specification; it's indeterminate regarding shape.
      *   "White horse" *combines* a specific shape *and* a specific color. This combination creates a new, unique formal designation (*míng* 名).
      *   This unique combination *excludes* horses that are not white (because they lack the color "white") and excludes white things that are not horses (because they lack the shape "horse").
      *   **Conclusion:** The compound name "white horse" picks out a distinct set defined by the *conjunction* of attributes, fundamentally different from the set picked out by the simple name "horse" (defined only by shape, regardless of color) or "white" (defined only by color, regardless of shape).

  **The Strongest Version: A Proto-Analytic Philosophy of Language**

  Gongsun Long isn't *just* playing with "is". He's making a sophisticated argument about **reference, extension/intension, and the combinatorial nature of language:**

  1.  **Words as Tools for Picking Out:** Names (*míng*) are not just labels; they are functional tools for isolating specific aspects or sets within reality ("naming the actual" - *zhǐ shí* 指實).
  2.  **Specificity Determines Extension:** Adding a modifier (like "white" to "horse") *necessarily changes the scope* of what the name refers to. It makes the name more specific, thereby *restricting* the set of things it applies to. "White horse" inherently *excludes* non-white horses.
  3.  **Identity Requires Co-Extensiveness:** For two names to be identical (for "A is B" to hold in the sense of strict identity), they must refer to *exactly the same set of things* in all possible contexts. The substitution test empirically proves "horse" and "white horse" fail this test.
  4.  **Focus on Language Function:** The argument is less about metaphysical "what is a horse?" and more about "how does the *word* 'horse' function compared to the *phrase* 'white horse' when we use them to request, describe, or categorize?" It's analyzing language-in-use.

  **Classical Chinese Nuance:** The lack of a copula verb like "is" is crucial. The argument hinges on the relationship between names (*míng*), not a verb of being. "Báimǎ fēi mǎ" is better parsed as "The designation 'white horse' is not the designation 'horse'" or "'White horse' excludes 'horse' (in reference)". This makes the argument about *names themselves* and their functional scope, not directly about the ontological status of a particular animal. "Fēi" (非) here means "is not [identical to/co-extensive with]" in a logical sense.

  **Your Gut Feeling & The "Shell Game" Charge: Is it Valid?**

  *   **Yes, there is potential equivocation:** The argument *does* sometimes slide between:
      *   "Not identical to" (logical distinctness of the concepts/names)
      *   "Not a member of the class" (a white horse is not a member of the class "horse"? - which is clearly false and absurd).
      *   Gongsun Long relies on the listener conflating the *name* "horse" with the *things* it names. He shows the *names* aren't identical/co-extensive, but the famous conclusion *sounds* like he's saying a white horse isn't *a* horse (a member of the class). This ambiguity is rhetorically powerful but logically problematic.
  *   **The "Kind" vs. "Instance" Ambiguity:** He argues the *kind* "white horse" is distinct from the *kind* "horse" (which is defensible – they are different categories/sub-sets). But the conclusion is often misinterpreted (or deliberately phrased) to imply a *particular* white horse is not *a* horse, which is nonsense.

  **Is There Genuine Insight? Absolutely, and Here's Why:**

  1.  **Precision in Language:** He forces us to confront the ambiguity of words like "is". Does it mean identity, class membership, predication, or something else? This foreshadows millennia of philosophical work on logic and language.
  2.  **The Combinatorial Nature of Meaning:** His core point that combining terms creates new meaning with distinct referential scope is fundamental to semantics. "White horse" *means* something different and *refers* to something different than "horse" alone. This is not trivial.
  3.  **Set Theory *Avant la Lettre*:** His substitution argument is essentially demonstrating that the set {White Horses} is a *proper subset* of {Horses}, therefore the sets are not identical. This is logically sound and insightful. Recognizing that modifiers create subsets is crucial.
  4.  **Focus on Reference:** His emphasis on how words *pick things out* and how modifiers *restrict* that picking-out function is a profound insight into how language interacts with the world. It highlights the gap between our linguistic categories and the messy continuum of reality.
  5.  **Challenging Naive Realism:** He exposes the potential for language to mislead if we assume names map perfectly and simply onto monolithic objects. Reality is complex; language dissects it with combinable features. A "white horse" is both a horse *and* white, but the *phrase* "white horse" functions differently than either word alone.

  **The Verdict:**

  *   **Is it a "shell game"?** Partially, yes, especially in its most famous, pithy formulation ("a white horse is not a horse"). It *can* be presented to exploit ambiguity for rhetorical effect.
  *   **Is it *just* a shell game?** Absolutely not. Beneath the provocative surface lies a serious, sophisticated, and genuinely insightful exploration of logic, language, and reference. Gongsun Long identifies a real and important phenomenon: **the non-additivity of meaning when terms are combined, and the resulting shift in referential scope.**
  *   **The Insight:** **Modifiers matter.** Combining terms doesn't just add features; it creates a new conceptual unit with its own distinct boundaries and exclusions. The meaning of a compound term ("white horse") is not reducible to the sum of its parts ("white" + "horse") in terms of its *extension*. This insight into the logic of language, particularly the restrictive power of adjectives, is Gongsun Long's enduring contribution. He wasn't *right* in a metaphysical sense about white horses not being horses, but he was profoundly *right* about how the *words* work. His argument is less about horses and whiteness, and more about the surprising behavior of "and" when we build complex names.

  So, your instinct about the equivocation is spot-on, but don't let that obscure the genuine logical and linguistic depth he was probing. The School of Names was asking hard questions about language and reality that resonate surprisingly well with modern philosophy of language and logic.
