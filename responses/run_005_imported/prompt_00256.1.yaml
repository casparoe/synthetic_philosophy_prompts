  ### Dialogue: The Independence Assumption in Iterated Mixed-Strategy Dominance  
  **Characters**:  
  - **Alex**: Defends iterated elimination via mixed-strategy dominance as the correct operationalization of common knowledge of rationality (CKR).  
  - **Blake**: Skeptical, argues that CKR alone doesn’t justify independence of opponents’ randomization; favors correlated rationalizability.  

  **Setting**: A blackboard in a game theory lab, with a three-player game sketched out.  

  ---

  **Blake**: Alex, I keep circling back to our debate about iterated elimination of mixed-strategy dominated strategies. In two-player games, I agree: Bernheim’s and Pearce’s rationalizability matches iterated elimination under CKR. But with three or more players, doesn’t the standard algorithm sneak in independence? CKR only requires players to believe opponents are rational—not that they randomize independently.  

  **Alex**: I see your worry, but independence isn’t an *assumption*—it’s implied by CKR. If Player 1 believes Players 2 and 3 are rational, and knows they each believe others are rational, their strategies should be uncorrelated. Correlation would imply beliefs are coordinated, which CKR rules out.  

  **Blake**: Not so fast. Let’s make this concrete. Consider this three-player game:  
  - **Player 1** chooses {U, D, C}  
  - **Player 2** chooses {L, R}  
  - **Player 3** chooses {A, B}  

  Payoffs (only Player 1’s matter; Players 2 and 3 get 0 always, so they’re indifferent and play anything):  
  - U pays 1 if (L and A), 0 otherwise  
  - D pays 1 if (R and B), 0 otherwise  
  - C pays 0.4 in *all* cases  

  Under *correlated* beliefs, C is never a best response. If Player 1 believes Players 2 and 3 correlate perfectly—e.g., 50% chance of (L,A) and 50% of (R,B)—then U or D yields 0.5 > 0.4. So C is irrational.  

  **Alex**: Right, and iterated mixed-dominance eliminates C too! A mixed strategy for Player 1, say 50% U and 50% D, yields:  
  - 0.5 in (L,A)  
  - 0.5 in (R,B)  
  - 0 in (L,B) or (R,A)  
  Since 0.5 > 0.4 in the "good" states and 0 < 0.4 in "bad" ones, it doesn’t dominate C pointwise. But C *is* strictly dominated by the mixed strategy *under expected payoff* if Player 1 assumes independence. Suppose Player 1 believes Player 2 plays L with prob *p* and Player 3 plays A with prob *q*, independently. Then:  
  - Expected payoff of U = *p × q*  
  - Expected payoff of D = (1-*p*) × (1-*q*)  
  - Expected payoff of C = 0.4  
  If *p* = 0.6 and *q* = 0.6, then U pays 0.36, D pays 0.16, C pays 0.4—so C is a best response. No domination.  

  **Blake**: Exactly! But is this belief justified by CKR? Players 2 and 3 are indifferent, so *any* strategy is rational for them. Player 1 can rationally believe *p* = 0.6 and *q* = 0.6 are independent. So C survives iterated mixed-dominance elimination. Yet under CKR with *correlated* beliefs, C isn’t rationalizable—it’s never a best response. So your elimination is too conservative!  

  **Alex**: I see your point, but C *does* get eliminated in the iteration if we account for higher-order beliefs. Suppose Player 1 believes Players 2 and 3 are rational. Since they’re indifferent, they could play anything, but Player 1 might still assume independence as the "default" belief. More importantly, if we iterate—  

  **Blake**: Ah, but iteration doesn’t help here. Players 2 and 3 have no dominated strategies to eliminate (all payoffs 0). So C survives. But intuitively, C is flawed: it pays less than U or D in states Player 1 can target with correlation. Why should CKR insist on independence?  

  **Alex**: Because without independence, "rationality" becomes slippery. If Player 1 believes Players 2 and 3 correlate, she’s attributing mutual understanding *beyond* rationality—like shared signals. CKR forbids that. Only independent beliefs are robustly justified.  

  **Blake**: But CKR only requires that players *believe* opponents are rational; it doesn’t restrict *how* they form beliefs about multiple opponents. Correlated beliefs are epistemically neutral—they don’t imply irrationality. For example, Player 1 might believe that if Player 2 plays L, Player 3 is more likely to play A, *without* assuming coordination. That’s consistent with CKR.  

  **Alex**: Fair, but in practice, correlation introduces strategic uncertainty. Let’s modify the game. Suppose Player 3 gets a tiny payoff for choosing A (say, ε > 0), so they now strictly prefer A. Player 2 still indifferent.  

  **Blake**: Okay, now Player 3 *always* plays A rationally. Player 1 knows this, so U pays 1 if L, 0 if R; D pays 0 always; C pays 0.4. Now U dominates D, and C is dominated by U if Player 1 believes Player 2 might play L.  

  **Alex**: But Player 2 is still indifferent! If Player 1 believes Player 2 plays R (rational, since Player 3 is fixed at A), then C’s 0.4 > U’s 0. So C *still* survives if we assume independence and Player 1 assigns high prob to R. But under correlation, Player 1 might believe "Player 2 is likelier to play L because Player 3 plays A"—even though Player 2 has no stake. That’s irrational!  

  **Blake**: Not irrational—just a belief. Player 1 might have prior correlations in her mind. The point is, your mixed-dominance approach *requires* independence to eliminate C, while CKR *allows* correlated beliefs that also eliminate C. So correlated rationalizability is the purer benchmark—it doesn’t add extraneous assumptions.  

  **Alex**: But correlated rationalizability is too permissive! In games with more structure, it permits "crazy" beliefs. Independence is a disciplined baseline. And in many cases, it gives the same predictions.  

  **Blake**: Not in this example. Your method spares C; correlated rationalizability kills it. CKR should *minimize* assumptions, not bake in independence. We should use the latter only when explicitly justified.  

  **Alex**: I’ll concede that in *n*-player games (*n* > 2), the equivalence is messier. But independence isn’t ad hoc—it’s a consequence of CKR’s "each player forms beliefs separately." Still, I see why you’re uneasy. Maybe we need a weaker solution concept for *n*-player cases.  

  **Blake**: Exactly. Correlated rationalizability is that concept. It’s CKR in its raw form—no independence smuggled in. Let’s agree that iterated mixed-dominance is a pragmatic tool, but epistemically, correlation is the defensible baseline.  

  **Alex**: Pragmatic, yes, but I’ll defend its epistemic grounding in most applications. Still, for this three-player case, you’ve shown a gap. I’ll chew on it.  

  **Blake**: Likewise. Maybe the answer is context-dependent. But we’ve put a spotlight on the issue.  

  ---  

  **Key Insight**: The dialogue highlights that iterated elimination of mixed-strategy dominated strategies assumes players believe opponents randomize independently—a constraint not strictly required by common knowledge of rationality (CKR). In the example:  
  - Under independence, strategy C survives (it’s a best response for Player 1 if they assign *p*=0.6, *q*=0.6).  
  - Under correlated beliefs, C is never a best response and is eliminated.  
  Correlated rationalizability thus yields a stricter (and arguably more intuitive) outcome, but independence is often pragmatically assumed. Neither position is "obviously right," as Alex emphasizes epistemic discipline while Blake prioritizes minimal assumptions.
