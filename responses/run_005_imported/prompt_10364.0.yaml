prompt: |-
  I cover the history of science and ideas for a general-interest magazine, and next week I'm interviewing a historian of early modern philosophy and science whose new book reconstructs Thomas Hobbes's lifelong insistence that he had put geometry, and ultimately all of philosophy, on a footing of genuine certainty. Draft eight to ten interview questions that go beyond rehearsing the Hobbes-Wallis feud's greatest hits. I want one question on Hobbes's "maker's knowledge" argument for why geometry can yield real scientia while natural philosophy remains merely hypothetical; one that presses the tension between that argument -- that we cannot be mistaken about the causes of what we ourselves construct -- and the decades Hobbes spent defending a mistaken quadrature of the circle against Wallis's repeated refutations; and one on how much weight the analogy to "making the commonwealth" can really bear in underwriting Leviathan's claim that civil philosophy is demonstrable in the same sense geometry is. For each of these three, add a follow-up question keyed to the answer she's most likely to give.
