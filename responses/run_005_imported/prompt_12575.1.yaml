  Here’s a commencement address that takes Kierkegaard’s critique seriously, letting it constrain and shape the conclusion into something honest and actionable — not a dismissal of journalism, but a call to transform its practice from within. It runs about 1,200 words (8 minutes):

  ---

  **Title: Against the Leveling Tide**

  Good morning, graduates, faculty, families, and friends. It’s an honor to stand where I once sat — a former reporter, now novelist, returning to the place where I learned to chase stories and wrestle with words. When Dean Ellis invited me, I suspected it might be because my last novel chronicled the life and death of a local newspaper. But as I prepared, I found myself circling back not to fiction, but to philosophy — specifically, a troubling text by Søren Kierkegaard that has haunted me for years: *The Present Age*.

  Written in 1846, it dissects a cultural shift: the decline of passionate, revolutionary action, replaced by something colder, more abstract. Kierkegaard argues that "the public" isn’t a real community waiting for news to serve it. It’s a **phantom** conjured into being by the press itself. An abstraction sustained by endless chatter — opinions detached from commitment, debate divorced from consequence. A crowd held together not by shared ideals, but by a shared reflex: **envy**. The urge to resent, diminish, and ultimately *level* anyone who dares to stand out, to speak with conviction, to act as an accountable individual. This "public," he warns, thrives on anonymity. It absorbs everything into a fog of opinion where no one is truly responsible, and nothing is truly at stake.

  Now, I know what you’re thinking: *1846? Before telegraphs, telephones, TikTok?* But Kierkegaard’s aim feels unnervingly precise, aimed squarely at the profession you’re about to enter — and at my own. Because whether we trade in headlines or hardcovers, we depend on the same machinery: the buzz, the coverage, the algorithms feeding the endless scroll. We help sustain that very abstraction — "the public" — Kierkegaard saw as corrosive.

  So, what do I say to you today? Do I scold you for choosing a field Kierkegaard might call structurally flawed? That would be hypocritical, given my own dependence on its ecosystem. Do I quote him for a moment of gravitas, then pivot breezily into "Seek truth! Speak up! Change the world!"? That feels dishonest. Kierkegaard’s diagnosis is too sharp, too deep, to be smoothed over with platitudes. If there’s real encouragement to offer, it must survive contact with his warning. It must grapple with the chasm he identifies: between the anonymous, leveling crowd and the single, accountable voice.

  Because that’s the heart of it: **accountability**. Kierkegaard mourned the loss of the "single individual" capable of passionate action and responsible speech. In a world of chatter, the individual drowns. The *public* absorbs outrage, assigns blame, moves on. The *individual* signs their name, stands by their work, faces the consequences.

  **Your task — your radical act — is to fight for the individual against the leveling tide. Both within yourselves, and within your work.**

  **First, be an individual.** Resist the pull of the anonymous "we." In newsrooms (and publishing houses, and digital platforms), pressure flows toward consensus, toward the safe take, toward the voice that sounds like "everyone." Kierkegaard feared envy’s pull – the urge to cut down the distinctive. Fight that reflex in yourselves. Cultivate your distinct voice, your specific curiosity, your unique angle. Don’t just process information; develop a *stance* informed by evidence, empathy, and ethics. Own it. Sign your name to it. Be prepared to defend it, not hide behind "sources say" or the amorphous "audience demand." The most powerful antidote to the phantom public is a byline attached to a mind that cares, thinks, and dares.

  **Second, make individuals visible, not abstractions.** The phantom public thrives on generalization: "voters feel," "communities are angry," "studies show." Your weapon is the specific, the human, the irreducible. Go beyond the quote that confirms the narrative. Seek the person whose story complicates it. When covering conflict, show the faces, the names, the consequences borne by flesh-and-blood individuals, not faceless factions. When analyzing trends, anchor them in lived experience. Don't just report *on* communities; report *from within* them, amplifying individual voices, not speaking for an abstraction. Your job isn’t just to inform the public; it’s to puncture the phantom by reminding readers, viewers, listeners: **This is about people.** Real people. Specific people. People like them. People unlike them. People who cannot be leveled without loss.

  **Third, build bridges of accountability, not walls of opinion.** The chatter that sustains the phantom public is often reactive, oppositional, defined by what it’s against. True reporting builds something. It creates a bridge of understanding — however rickety — between the individual telling the story, the individual experiencing it, and the individual receiving it. Hold power accountable, ferociously. But hold yourselves accountable too. Correct errors visibly. Explain your process. Engage with critics who engage in good faith. Show your work. This builds trust not in the abstraction of "the media," but in *you* as a responsible individual practitioner. It transforms the dynamic from "the press vs. the public" into individuals in dialogue, however difficult.

  Kierkegaard longed for an "age of revolution" defined by commitment. We don’t need revolutions to be committed. We need **courageous individuals**. Your revolution isn’t about barricades; it’s about **refusing to vanish into the fog**. It’s reporting the council meeting when no one clicks on local news. It’s writing the nuanced take when the algorithm rewards outrage. It’s knocking on the door when a tweet would be easier. It’s putting your name on the story and standing by it.

  Yes, the machinery Kierkegaard diagnosed is powerful. It can flatten, anonymize, and corrode. But it doesn’t run itself. It’s made of choices. Your choices. Choose to be an individual. Choose to see individuals. Choose accountability over anonymity. Choose the specific, human story over the satisfying abstraction. Choose the difficult bridge over the easy wall.

  Do this, and you do more than survive Kierkegaard’s critique. You defy it. You become the single, accountable voice that proves the phantom public doesn’t have to win. You won’t just serve the public; you’ll help make it real.

  Congratulations, graduates. Go be individuals. Go find individuals. Go build something true. We need you.

  ---

  **Why this works:**

  1.  **Honest Engagement with Kierkegaard:** The critique isn't glossed over or used superficially. It's presented clearly and its uncomfortable relevance is directly acknowledged, including the speaker's own complicity.
  2.  **Constrained by the Diagnosis:** The advice doesn't ignore the critique; it *responds* to it directly. The core solutions ("Be an Individual," "Make Individuals Visible," "Build Bridges of Accountability") are framed explicitly as antidotes to the "leveling," abstraction, and envy Kierkegaard described.
  3.  **Actionable Counsel for Journalists:** Each point translates Kierkegaard's philosophical warning into concrete journalistic practices: developing a unique voice, prioritizing specific human stories over generalizations, signing work, correcting errors, engaging responsibly.
  4.  **Avoids Hypocrisy & Platitudes:** It doesn't scold them for entering the field; instead, it acknowledges the challenge and offers a way to navigate it ethically. It transforms "seek truth, speak up" from a platitude into the harder, more specific tasks of seeking *specific* truths about *specific* people and speaking up *as an accountable individual*.
  5.  **Satisfies the Audience:**
      *   **Graduates:** Gets real about challenges but offers a meaningful, empowering mission grounded in resisting systemic flaws.
      *   **Families:** Provides warmth through belief in the graduates' potential ("We need you," "Go build something true") and the inherent nobility of the refined mission.
      *   **Professors:** Demonstrates a deep, unflinching engagement with the philosophical source material. The ending doesn't betray Kierkegaard; it wrestles productively with him.
  6.  **Coherent Arc:** The speech flows logically: Diagnosis (Kierkegaard's critique) -> Acknowledgement (its relevance to journalism/novels) -> The Core Problem (Loss of the accountable individual) -> The Solution (Three ways to reclaim the individual in journalism) -> Empowering Send-off (framed as defiance of leveling).
  7.  **Tone:** Serious but not despairing. Challenging but ultimately hopeful – a hope earned by confronting the difficulty, not ignoring it.

  This address respects the graduates' intelligence, honors the gravity of Kierkegaard's thought, and offers a path forward that is both philosophically coherent and professionally relevant.
