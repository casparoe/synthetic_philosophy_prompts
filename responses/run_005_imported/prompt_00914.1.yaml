  But now, which definition or axiom is responsible?

  In the above argument, we used:

  - The existence of a God-like being `g` (which the system proves necessarily exists).
  - The fact that `G` is an essence of `g`.
  - The fact that `g` has the property `R` (which is true because `R` is universal when `p` is true).
  - Then the essence condition: that `G` entails every property of `g`, in particular `R`, so `□∀x (G(x) → R(x))`.
  - Then, since `□∃x G(x)`, we get `□∃x R(x)`, i.e., `□p`.

  The key step is that `g` has the property `R` and that `G` entails `R` because `R` is a property of `g`. But note that `R` is a property that `g` has, and by the definition of essence, every property of `g` must be entailed by `G`. Therefore, the essence definition is forcing that `G` entails every property that `g` has, no matter how trivial or contingent.

  This is the core of the collapse: the God-like being has every positive property, but it also has every property that happens to hold in the actual world (like being such that it is raining in Paris). And then the essence condition forces that having the God-like property entails having that contingent property. Then, because the God-like property is necessarily exemplified, the contingent property becomes necessary.

  So the culprit is the combination of:

  1. The definition of essence: which requires that an essence entails every property of the object (so that the God-like being's essence entails every property it has, including contingent ones).
  2. The necessary existence of the God-like being: which ensures that the essence is necessarily exemplified.

  However, Anderson (in his 1990 emendation) blames the axiom that necessary existence is positive. He and Gettings (in "Gödel's Ontological Proof Revisited") show that if we weaken the definition of essence (so that an essence only entails every *essential* property, not every property) then modal collapse can be avoided. But then they have to adjust the definition of necessary existence accordingly.

  But in the original Scott version, the definition of essence is the one that requires entailment of every property.

  Therefore, in Sobel's original objection, the definition of essence (as entailing every property of the object) is the main culprit. However, without the necessary existence axiom, the collapse wouldn't occur. So both are necessary.

  But note: Anderson (1990) argues that the problem lies in the positivity of necessary existence. He writes:

     "The trouble lies with the principle that necessary existence is a positive property. ... The argument for modal collapse depends essentially on the assumption that necessary existence is positive."

  However, in our derivation above, we did use the necessary existence of `g` (which we get because `g` is God-like and has `NE` because `P(NE)`). Without `P(NE)`, we wouldn't have `□∃x G(x)`. So indeed, without necessary existence being positive, we wouldn't have the necessary existence of God, and then we wouldn't get the collapse.

  But note: we also used the essence definition. So both are crucial.

  Anderson's emendation: He redefines essence to only entail the necessary properties of the object. Then, necessary existence is defined as: an object has necessary existence if every essence of it is necessarily exemplified. But then, to prove that God necessarily exists, he needs an extra premise: that being God-like is a necessary property. He adds that as an axiom.

