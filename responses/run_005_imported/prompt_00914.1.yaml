  Therefore, both Sobel and Anderson are partially correct: the collapse requires the strong essence definition and the positivity of necessary existence.

  However, Anderson's emendation shows that by weakening the essence definition and keeping `P(NE)`, but adding an extra axiom, one can avoid collapse and still prove God's necessary existence.

