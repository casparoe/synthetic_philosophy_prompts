     - Axiom 1 (A1): If `φ` is positive, then its negation `¬φ` is not positive. 
       - Formally: `P(φ) → ¬P(¬φ)`
     - Axiom 2 (A2): If a property is positive, then it is necessarily positive; and if it is not positive, then it is necessarily not positive. 
       - Formally: `P(φ) → □P(φ)` and `¬P(φ) → □¬P(φ)`
     - Axiom 3 (A3): Any property entailed by a positive property is positive. 
