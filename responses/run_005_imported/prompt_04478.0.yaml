  hey, I'm outlining a novel about the Goethe/Schiller friendship set in 1790s Weimar, and I keep bumping into the fact that everyone lumps them together under "Weimar Classicism" even though their politics don't seem like that great a match to me. Schiller's Aesthetic Letters more or less argue the Revolution curdled into Terror because people weren't inwardly free yet, so art has to do the prep work before real political freedom is safe to hand out. Goethe, meanwhile, was literally off running roads and mines for the Duke and mostly just mocked revolutionary fervor in stuff like Der Bürgergeneral rather then theorizing a path through it. Can you compare their actual politics around the Revolution and tell me, with reasons, whether the friendship was papering over a real philosophical rift or whether they were closer than that contrast makes them sound?
