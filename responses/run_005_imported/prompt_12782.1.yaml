  The user might be conflating "rational scientist" with modern secularism, which Newton didn’t have. His conflict was about hiding heterodoxy from authorities, not an internal crisis of faith vs. reason. The drama in burning notes could work if framed as protecting dangerous secrets, not repressing part of himself. 

  The user’s deeper need might be for a compelling character arc without distorting history. They might fear anachronism but also want psychological depth. Suggesting they emphasize Newton’s fear of exposure and his unified quest for divine truth could satisfy both. Highlighting his meticulous secrecy and the stakes of discovery adds tension without misrepresenting his mindset. 

  Also, the user mentions being a third into the novel, so they need solutions that don’t overhaul their outline. Reframing the conflict as external (societal persecution) rather than internal (science vs. mysticism) might preserve their structure while adding authenticity. Emphasizing Newton’s view of alchemy as natural philosophy and his heresy as purer Christianity could deepen the character realistically. 

  They might also appreciate nuance: Newton’s paranoia about leaks, his isolation, and how his secrecy stems from conviction, not shame. The burning scene could symbolize protecting his life’s work, not self-repression. This maintains drama while aligning with history. 

