prompt: |-
  I'm about a third of the way into a novel that follows a fictionalized young Isaac Newton at Cambridge, and I've fallen down a research rabbit hole on his religious life that's messing with my outline. Here's the picture I've pieced together so far: the guy was basically a secret heretic and a secret alchemist for most of his adult life -- privately rejected the Trinity, spent years decoding Daniel and Revelation, kept a furnace going in a little lab near his rooms at Trinity College trying to transmute lead into gold -- and he hid all of it because on some level he knew this "mystical" side of him was in tension with the cool, rational, mechanistic universe he was building in the Principia. My plan was to make that inner conflict the emotional engine of the book: a scene where his housemate catches him burning some alchemical notes, and Newton has to explain that he's not hiding some crackpot hobby so much as hiding from himself.

  Before I commit a whole character arc to that, I want a sanity check from someone who's actually read the history rather than skimmed a Wikipedia page and one biography excerpt at 1am. Is that "warring halves of himself, rational scientist vs. secret mystic" framing actually defensible, or am I projecting a pretty modern science-vs-religion conflict onto a guy who maybe didn't experience it that way at all? Genuinely unsure if im onto something true here or just flattering my own plot because it makes for good drama.
