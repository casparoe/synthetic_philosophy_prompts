answer: |-
  ## Dialogue: The Unity of Propositions and the Ghost of Bradley

  **Setting:** A university common room, late afternoon. TRAD (Traditionalist) and ACT (Act-Theorist) are debating over coffee.

  **TRAD:** ...so, the core problem remains. Take <Socrates, wisdom>. You have two distinct entities: a concrete particular and a universal. Merely listing them doesn’t give you the *proposition* that Socrates is wise. You need something to *tie* them together, to make this aggregate represent a state of affairs – something truth-evaluable. That’s the role of instantiation or exemplification. But then Bradley pounces: what relates *this* relation to Socrates? And to wisdom? If you need a further relation R1 to bind exemplification to Socrates, then you need R2 to bind R1 to exemplification, and so on ad infinitum. It’s vicious because the initial unity is never genuinely established. Frege’s genius was seeing that concepts *must* be unsaturated – their very nature is to *demand* completion. The propositional complex isn’t assembled; it arises *sui generis* when a saturated object plugs into an unsaturated concept. The unity is brute, but it’s a brute *fact* about the *kind* of entity a concept *is*. No further glue is needed or possible.

  **ACT:** I grant the force of the regress against the classical “aggregate + glue” model. But your Fregean solution just *declares* the problem solved by ontological fiat. Why *should* we accept that concepts are fundamentally “unsaturated”? Isn’t that just a fancy way of saying “they mysteriously stick to objects without needing glue”? It feels like labeling the mystery rather than solving it. The act-based view *dissolves* the regress by shifting the locus of unity from a static, mind-independent complex to the *cognitive act itself*. When I judge or entertain that Socrates is wise, I don’t *first* have Socrates and wisdom as separate items in my mind and *then* glue them together with some mental superglue called ‘predication’. The *act* of predicating wisdom *of* Socrates *is* the fundamental unity. There is no prior aggregate needing unification. The proposition *just is* the type of that unified act.

  **TRAD:** But that’s precisely where I think the regress merely *relocates*. Fine, you avoid the static aggregate. But now tell me: what is this “act of predicating wisdom of Socrates”? Isn’t it *composed* of at least two components: an act of *entertaining Socrates* (or referring to him) and an act of *entertaining wisdom* (or grasping the property)? If these are genuinely distinct sub-acts, then the same Bradleyan question arises: what unifies *these* two sub-acts into a *single* predicative act? If you say “the predicative act itself” unifies them, haven’t you just pushed the regress up a level? Now you need to explain how this predicative act relates to its own sub-acts without needing a further unifier for *that* relation. It seems you’ve traded a regress of relations between objects for a regress of relations between acts or sub-acts. Why is *your* brute unity at the level of the act any less of a stipulation than Frege’s brute unsaturation?

  **ACT:** That’s a fair challenge. Let me try to be precise. You’re right that we can *analyze* the predicative act and *distinguish* aspects: the act involves a subject-component and a property-component. But crucially, on the act-theory, these are not *antecedent*, *independent* sub-acts that *then* get combined. They are *abstractions* from the single, primitive act. There is no such thing as the “pure act of entertaining Socrates” *simpliciter* within propositional thought; entertaining an object always occurs *as* a potential subject *for* predication. Similarly, entertaining a property isn’t just contemplating an abstract entity; it’s grasping something *as predicable*. The predicative act is *irreducibly* one thing: an act directed *at* an object *under the aspect* of attributing a property *to* it. The “components” are inseparable *moments* or *aspects* of this single intentional act, not building blocks assembled by a further act. Trying to isolate them as independent acts is a misdescription.

  **TRAD:** So you’re saying the act is *simple*? That seems phenomenologically false. When I think “Socrates is wise”, I *can* focus just on Socrates, or just on wisdom. I can think of Socrates without thinking of wisdom, and vice versa. Doesn’t that suggest these *are* distinct cognitive capacities or sub-acts that *can* occur independently? And if they can occur independently, then when they *do* co-occur in the predicative act, what prevents them from being just a mereological sum, a conjunction of two separate acts? What makes it a *single, unified* act with propositional content, rather than two simultaneous but disconnected acts of thinking-about-Socrates and thinking-about-wisdom? If you appeal to the “directedness” or the “under the aspect of” as primitive unifiers, how is that fundamentally different from me appealing to Frege’s unsaturation? Both seem to be pointing to a primitive, unexplainable feature of the relevant entity (concept/act) that magically generates unity.

  **ACT:** It’s not that the act is simple or lacks distinguishable aspects. It’s that the *unity* is constitutive of the act *type* that constitutes the proposition. Consider an analogy: dancing a waltz. You can analyze it into steps, posture, movement. You can practice the steps alone. But performing the waltz *is* a single, unified act; it’s not the mere conjunction of practicing a step and holding a posture happening simultaneously. The unity is inherent in the *type* of action being performed. Similarly, predicating wisdom of Socrates is a specific *type* of cognitive action. The “entertaining” of the subject and property are *functional roles within* that action, not separate actions conjoined. The regress doesn’t get off the ground because there’s no *prior* multiplicity of *acts* needing unification. There’s just the one act-type, defined by its unified structure. The ability to abstractly consider the components is parasitic on the prior unity of the act-type.

  **TRAD:** But the analogy limps. Dancing a waltz has a physical, temporal unity imposed by the body’s motion and the music. What imposes the *intentional* unity on the cognitive act? What ensures that when I think of Socrates and simultaneously think of wisdom, that these thoughts are *about the same thing* in the predicative way, rather than being two separate thoughts? It seems you still need an account of *how* the act-type guarantees this binding. Without that, saying “it’s the type” feels like invoking the very unity you need to explain. And if you say the type *just is* defined by its unified structure, then you’re back to a brute fact about act-types, mirroring my brute fact about unsaturated concepts or Armstrong’s brute non-mereological composition. It seems we’ve reached a standoff between two kinds of ontological primitivism: you posit primitive unity in the nature of *cognitive acts*, I (or Frege, or Armstrong) posit primitive unity in the nature of *propositional complexes* or their constituents. Is your primitivism genuinely less problematic?

  **ACT:** Perhaps it *is* a standoff on the level of ultimate metaphysical grounding. But the act-theory has explanatory advantages *within* the cognitive realm. It directly accounts for the *mind-dependence* of propositions as representational vehicles – they exist as types of possible mental acts. It explains propositional attitudes naturally (believing *p* is performing the act-type characteristic of *p* in a certain mode). It avoids positing mysterious abstract complexes hovering in a Platonic realm, waiting to be unified by brute ontological facts. My primitivism concerns the structure of *our cognition* – something we have direct, first-personal access to. Your primitivism concerns the structure of mind-independent abstracta – something much more opaque. While both might appeal to a fundamental unity, grounding that unity in the structure of *intentional action* seems less mysterious and more integrated with a naturalistic picture of the mind than positing brute facts about abstract complexes or the unsaturatedness of universals. The regress isn't relocated; it's dissolved because the act provides the *context* where the components get their propositional role *only within* the unified act. There are no free-floating components needing glue.

  **TRAD:** I see the appeal for philosophy of mind, but I remain unconvinced it solves the *metaphysical* problem of unity for propositions *as such*. If propositions are the primary bearers of truth and the objects of attitudes, their unity must be objective and mind-independent, not parasitic on our cognitive acts. Your “context” provided by the act sounds suspiciously like the “glue” you wanted to avoid, just internalized. And the access argument cuts both ways: while we have access to our acts, we also have access to the *truth conditions* propositions represent, which seem to demand a structure independent of how we grasp them. If the unity of <Socrates, wisdom> as a truth-evaluable complex is brute, but grounded in the nature of the constituents or the complex itself, that seems a cleaner solution for realism about propositions. Your act-types ultimately depend on the possibility of performing acts whose success *presupposes* a unified, mind-independent state of affairs. The ghost of Bradley haunts both our solutions equally, demanding a primitive unity we cannot further explain. Perhaps my advisor is right: it *is* a wash. We just choose our primitive – brute complex unity or brute act unity – based on broader metaphysical commitments.

  **ACT:** ...And perhaps *that* is the sharpened disagreement. I see propositions as essentially representational tools of thought, their unity forged in the act of using them. You see them as abstract, language-independent truth-bearers, their unity a fundamental feature of reality's structure. Bradley forces us to acknowledge a primitive in either case. The debate isn't about *solving* the regress absolutely, but about *where* this primitive unity is best located – in the furniture of the abstract world, or in the structure of intentional cognition. My bet is still on the act.

  **TRAD:** And mine remains firmly on the complex. Pass the coffee. This could take a while.

  **(Ends in Impasse)**
