prompt: |-
  I'm preparing a graduate seminar on medieval resistance theory and want to push my students past the flattened textbook claim that 'the Scholastics justified tyrannicide.' Aquinas's own position, developed across De Regimine Principum and the Summa's treatment of sedition, turns on a distinction between a ruler who is a tyrant in title alone—a usurper—and one who was legitimately installed but rules tyrannically in practice; John of Salisbury, in the Policraticus, grounds his considerably more unqualified defense of tyrannicide instead in whether the would-be killer is bound to the ruler by an oath of fealty. Compare these two distinctions and the work each is doing: once you take each thinker's qualifications seriously, whose position actually licenses more in the way of private, unilateral tyrannicide, and whose framework had the greater afterlife in early modern resistance theory? Justify your answer.
reasoning: |-
  Okay, the user is preparing a graduate seminar on medieval resistance theory and wants to move beyond the oversimplified claim that Scholastics justified tyrannicide. They specifically mention Aquinas and John of Salisbury, focusing on their distinctions regarding tyrannicide. The user wants a comparison of these distinctions, an analysis of which thinker permits more private, unilateral tyrannicide, and whose framework had a greater impact on early modern resistance theory.

  First, I need to recall Aquinas's position. In De Regimine Principum and Summa Theologiae, Aquinas distinguishes between a usurper (tyrant by lack of title) and a tyrant by practice (legitimate title but abuses power). For usurpers, Aquinas allows removal without trial, possibly by private individuals. For tyrants by practice, he insists on public authority for removal, not private action. So, Aquinas limits private tyrannicide to usurpers only.

  Next, John of Salisbury in Policraticus. He grounds tyrannicide on whether the killer is bound by an oath of fealty. If not bound, killing a tyrant is permissible and even praiseworthy. If bound by oath, it's more complicated but still possible under extreme circumstances. Salisbury's approach is more permissive for private individuals not sworn to the tyrant. His justification is framed as a public service, drawing on organic metaphors and Roman law.

  Comparing the two: Aquinas allows private action only against usurpers, requiring public authority for abusive rulers. Salisbury permits private individuals not bound by oath to kill any tyrant, which is broader. So Salisbury's position licenses more private, unilateral tyrannicide.

  For afterlife in early modern theory: Aquinas's framework, especially the distinction and emphasis on public authority, influenced thinkers like Suárez and Mariana. The Spanish Scholastics expanded on his ideas, maintaining the role of constituted authorities. Salisbury's ideas resurfaced during the Reformation, particularly among Calvinists like Beza and Knox, who referenced his views on killing tyrants without direct divine sanction. His influence was more direct in contexts where individual action was justified against rulers deemed tyrannical.

  The user's deeper needs might include wanting to highlight the nuances in medieval thought to show students that resistance theory isn't monolithic. They might also want to discuss how these frameworks were adapted in different historical contexts, like the Reformation or Enlightenment. Ensuring that the analysis clarifies misconceptions about Scholastics uniformly supporting tyrannicide is key. Also, emphasizing the methodological differences—Aquinas's systematic theology vs. Salisbury's classical and legal synthesis—could enrich the seminar discussion.
answer: |-
  Here's a comparative analysis of Aquinas and John of Salisbury on tyrannicide, addressing your core questions about the scope of private action and their influence on early modern thought:

  **1. Aquinas's Distinction & Its Work:**
  *   **Distinction:** Aquinas differentiates between:
      *   **Tyrannus absque titulo (Usurper):** Someone who seized power illegitimately, lacking rightful title.
      *   **Tyrannus ex parte exercitii (Tyrant in Exercise):** Someone legitimately installed (e.g., by election, inheritance) who subsequently rules tyrannically, abusing power for private gain and oppressing the common good.
  *   **Work of the Distinction:**
      *   **Clarifies Legitimacy Source:** It anchors the right to resist firmly in the *source* of the ruler's authority. A usurper *never* possessed legitimate authority; their rule is inherently criminal.
      *   **Limits Scope for Removal of Legitimate-but-Abusive Rulers:** Against a *tyrannus ex parte exercitii*, Aquinas is **extremely cautious**. He explicitly **rejects private, unilateral action** (*Summa Theologiae*, II-II, Q.42, A.2). Removal must be an act of **public authority** – either:
          *   A superior authority (e.g., the Pope over a Christian prince, an Emperor over a king *if* such hierarchy exists and is recognized).
          *   The community itself ("*multitudo*") acting through established, representative procedures, not mob violence. He emphasizes due process and avoiding greater evils like civil war or anarchy.
      *   **Opens Door (Narrowly) for Usurpers:** Against a *tyrannus absque titulo*, Aquinas is more permissive. Since the usurper is essentially a criminal oppressor holding power by force, **any private individual** may licitly kill them (*De Regimine Principum*, I, Ch. 6). This is framed as an act akin to killing a brigand or defending the community against an unjust aggressor, *not* as regicide.

  **2. John of Salisbury's Distinction & Its Work:**
  *   **Distinction:** Salisbury differentiates based on the relationship between the *would-be killer* and the tyrant:
      *   **Bound by Oath of Fealty:** The killer owes a sworn duty of loyalty to the tyrant.
      *   **Not Bound by Oath of Fealty:** The killer has no such sworn obligation to the tyrant.
  *   **Work of the Distinction:**
      *   **Focuses on the Actor's Obligation:** The key factor isn't *only* the tyrant's status or actions, but the *killer's* specific contractual (oath-bound) relationship to him. This introduces a more personal, feudal dimension.
      *   **Permissiveness for Non-Sworn Individuals:** Salisbury is **strikingly permissive** for those **not bound by fealty**. He famously declares it "lawful and just" for *anyone* not sworn to the tyrant to kill him (*Policraticus*, VIII.20). He draws heavily on classical examples (Brutus, Samson) and Roman law concepts (the tyrant as a *hostis publicus* - public enemy). The act is framed as a pious duty to God and the commonwealth.
      *   **Complexity for the Sworn:** For those bound by fealty, Salisbury's position is more nuanced and arguably restrictive. While he *does* ultimately allow even the sworn to kill a tyrant under extreme circumstances (e.g., if the tyrant violates divine law), he emphasizes the gravity of breaking the oath and suggests it should ideally be a last resort, perhaps undertaken with a sense of divine calling or public mandate to mitigate the breach of faith.

  **Comparing the Scope for Private, Unilateral Tyrannicide:**

  *   **Aquinas:** Explicitly **forbids** private, unilateral action against a *legitimately installed tyrant* (tyrant in exercise). He **permits** it *only* against a **usurper** (*absque titulo*). His framework severely restricts private action to the specific case of illegitimate seizure of power.
  *   **Salisbury:** Explicitly **permits and praises** private, unilateral action by **anyone not bound by fealty** against *any tyrant*, regardless of whether they seized power illegitimately (*absque titulo*) or are abusing legitimate power (*ex parte exercitii*). For the sworn, action is possible but heavily qualified. His framework licenses significantly broader private action, especially by those outside the tyrant's direct feudal circle.

  **Conclusion 1: Licensing Private Tyrannicide:** **John of Salisbury's framework licenses considerably more in the way of private, unilateral tyrannicide.** Aquinas restricts it solely to the narrow case of usurpers. Salisbury actively encourages it (as a virtuous, even divine, act) for non-sworn individuals against *any* tyrant.

  **3. Afterlife in Early Modern Resistance Theory:**

  *   **Aquinas's Greater Influence:** Aquinas's framework, particularly the distinction and his emphasis on public authority for deposing abusive rulers, had **profoundly greater and more direct influence** on the mainstream development of early modern resistance theory, especially among Catholic and later Protestant Scholastics and Monarchomachs.
      *   **Why Aquinas Dominated:**
          *   **Systematic Authority:** The *Summa* was the foundational theological/philosophical text of the era. Its structure and arguments were the common language of debate.
          *   **Focus on Legitimacy and Public Authority:** His careful distinctions resonated in an age grappling with the divine right of kings, constitutional limits, and the role of estates/parliaments. The idea that a legitimate ruler, even if tyrannical, could *only* be removed by a superior or the constituted representative body ("*multitudo*" interpreted as estates, parliament, electors) was crucial.
          *   **Spanish Scholastics (Vitoria, Suárez, Mariana):** Directly built upon Aquinas. Mariana's controversial allowance for private assassination of a tyrant *ex parte exercitii* (under strict conditions) was a radical *extension* and *departure* from Aquinas's core prohibition, but it was framed *within* and in reaction to the Thomistic framework. Suárez's sophisticated theory of popular sovereignty and the right of the community (acting through representatives) to depose a tyrant is deeply Thomistic.
          *   **Calvinist Monarchomachs (e.g., Beza, Hotman, Knox):** While more radical than Aquinas, they heavily relied on his concept of legitimate inferior magistrates (estates, parliaments, lesser nobles) as the *public authority* empowered to resist a tyrant. They explicitly rejected *private* tyrannicide (Knox's rhetoric sometimes blurred this, but his theory relied on the "godly nobility"). Their arguments mirrored Aquinas's structure: legitimate authority resisting abuse of power.
          *   **Locke:** While departing from Scholasticism, Locke's emphasis on the community acting as the legitimate power to judge and remove a ruler who violates the trust (through the legislature) echoes the Thomistic "public authority" principle, not Salisbury's private action.

  *   **Salisbury's Influence:**
      *   **Resonance, Not Framework:** Salisbury was *cited* enthusiastically, especially by radical Protestants (e.g., Calvinists in Scotland/France, Puritans in England) and later by Enlightenment figures (e.g., Milton). His vivid rhetoric and bold endorsement of killing tyrants provided powerful ammunition and moral justification.
      *   **Niche Application:** His "not bound by oath" argument found specific application in contexts where subjects felt absolved of allegiance (e.g., Catholics under Protestant monarchs, Protestants under Catholic monarchs, colonists rejecting distant kings). The idea of the tyrant as a *hostis publicus* was influential.
      *   **Limitations:** Salisbury's organic metaphor (Policraticus) was less adaptable to modern state theory than Aquinas's philosophical rigor. His permissiveness towards private action was often too radical for systematic theorists building political systems; they preferred Aquinas's restraint or adapted it (like Mariana's extreme qualification). He was more often a source of inspirational quotes than a foundational structural model.

  **Conclusion 2: Greater Afterlife:** **Aquinas's framework had the demonstrably greater and more structurally significant afterlife in early modern resistance theory.** While Salisbury provided potent rhetoric and moral fervor, it was Aquinas's distinctions, emphasis on legitimacy, and (crucially) the requirement for *public authority* in deposing a legitimate-but-tyrannical ruler that provided the essential scaffolding for the sophisticated theories of resistance developed by the Spanish Scholastics, Calvinist Monarchomachs, and ultimately Enlightenment thinkers like Locke. His influence was systemic; Salisbury's was more inspirational and circumstantial.

  **In summary:** Salisbury's framework, centered on the killer's oath, licensed far more private tyrannicide against any tyrant. However, Aquinas's carefully structured distinctions, particularly his prohibition of private action against legitimate tyrants and insistence on public authority, proved vastly more influential in shaping the dominant strands of early modern resistance theory, which sought constitutional and representative mechanisms for confronting tyranny rather than endorsing individual vigilantism.
