answer: |-
  Your reading captures a genuine tension in Aquinas's text, and commentators *have* wrestled with it. The apparent shift isn't a flaw in your understanding; it reflects Aquinas navigating a complex ethical boundary. Here's a breakdown of the passage's structure and the work the final sentence does:

  1.  **The Core Double Effect Argument (First Half):**
      *   **The Principle:** An act can have two effects – one intended, one unintended ("beside the intention").
      *   **The Application to Self-Defense:** The act's moral species (lawful/unlawful) is determined by the *intended* effect: saving one's own life. The unintended effect is the aggressor's death.
      *   **Justification:** Preserving life is natural and lawful. Therefore, the act is lawful *in itself*, based on the intended good end.
      *   **Crucial Limitation:** **Proportionality.** Even with a good intention, the *means* used must be proportionate. Excessive force ("more than necessary violence") renders the act unlawful. Moderate force ("repel force with moderation") is lawful.
      *   **No Duty to Die:** One is not morally obligated to sacrifice one's own life to avoid killing the aggressor. Self-preservation takes priority over the aggressor's life *in this context*.

  2.  **The Crucial Caveat and the Introduction of Authority (Final Sentence):**
      *   **The General Prohibition:** "But as it is unlawful to take a man's life, except for the public authority acting for the common good..."
      *   **The Sharp Distinction for Intention:**
          *   **Private Individuals:** "It is not lawful for a man to intend killing a man in self-defense..."
          *   **Public Authorities (Soldier/Minister of Judge):** "...except for such as have public authority, who while intending to kill a man in self-defense, refer this to the public good..."
      *   **The Qualification for Authorities:** Even they sin if motivated by "private animosity."

  **Resolving the Apparent Tension:**

  The tension arises because the core double effect argument *seems* to fully justify the private individual's act *without* needing them to intend the death. So why explicitly forbid them from intending it? And what *extra* permission does the soldier have? The key lies in understanding what "intending killing" means in Aquinas's framework and the different *moral contexts* of the acts:

  1.  **The "Beside the Intention" Move is Precarious for Killing:** Aquinas's core argument justifies the private individual *despite* the death occurring. It's a justification rooted in the unintended nature of the fatal outcome *combined* with proportionality and the good intention of self-preservation. **Explicitly *intending* the death fundamentally changes the act's moral species.** For a private individual, intending the aggressor's death transforms the act from "defense of life" into "homicide." This is *why* Aquinas explicitly forbids it. The double effect justification *depends* on the death being unintended. If the death *is* intended, the justification collapses, and the act falls under the general prohibition against killing.

  2.  **The Soldier's Permission is Different in Kind:** The soldier (or executioner, etc.) is *not* primarily granted permission *because* of double effect. Aquinas grants them permission to *intend* the death itself *as a means* to a public good (defending the common good, upholding justice, repelling public enemies). Their act isn't *primarily* self-defense in the private sense; it's an act of public justice or defense of the polity *using* lethal force. The "self-defense" aspect for the soldier is incidental – he is defending *himself* *as part of* defending the public order he represents. His *authority* allows him to licitly adopt the *intention* to kill *as a means* to the public good. This is a different moral category entirely.

  3.  **The Role of "Referring to the Public Good":** This phrase is crucial. The soldier isn't justified simply by being a soldier; he must *intend* his lethal act *for* the public good. If his motive shifts to private vengeance ("private animosity"), he loses this justification and sins, just like a private individual intending a killing. His permission stems from his role and the *public purpose* of his act.

  **Is Aquinas Changing the Subject?**

  Yes and no. He's using "self-defense" broadly to cover both scenarios where force is used against an aggressor threatening life. However, he clearly distinguishes the *moral context* and *justification*:

  *   **Private Self-Defense:** Justified by double effect (unintended death + good intention of self-preservation + proportionality). Intending death is *forbidden* and voids the justification.
  *   **Public Defense/Execution of Justice:** Justified by public authority acting for the common good. Intending death *as a means* to the public good *is permitted* (and often necessary) within this role.

  **What Work is the Final Sentence Doing?**

  1.  **Reinforcing the Absolute Prohibition on Private Intentional Killing:** It explicitly closes the door on any interpretation that the core double effect argument allows a private individual to *aim* for the aggressor's death. That intention is always illicit for them.
  2.  **Delineating a Separate Moral Category:** It establishes that *only* those acting under legitimate public authority, for the public good, may licitly *intend* lethal force. This isn't an extension of double effect; it's a distinct justification based on authority and public function.
  3.  **Preventing Misapplication:** It prevents someone from arguing, "If the soldier can *intend* to kill in defense, why can't I?" Aquinas answers: because you lack the public authority and the public good mandate.
  4.  **Highlighting the Role of Motive:** It adds the vital caveat that even public actors sin if motivated by private hatred, emphasizing that the justification for *their* intention to kill rests *entirely* on the public good.

  **Commentary and Resolution:**

  Commentators (like Elizabeth Anscombe, G.E.M. Anscombe being a key modern proponent, or Alasdair MacIntyre discussing the nuances) acknowledge this distinction. The tension is inherent but resolved by recognizing the different *grounds* for justification:

  *   **Double Effect (Private):** Justifies an act *with* a bad effect *because* that effect is unintended and proportionate to a directly intended good effect.
  *   **Public Authority (Soldier, etc.):** Justifies an act where the bad effect (killing) is *intended as a means* to a good end (public safety/justice) *because* the agent acts *as* legitimate public authority for the common good.

  **Implications for Whitfield's Closing Argument:**

  Whitfield *cannot* honestly use the soldier example to blur the lines for Daniel. Instead, he must rigorously focus on the *private individual* strand of Aquinas's argument:

  1.  **Emphasize Intention:** Hammer home that Daniel's *sole intention* was self-preservation ("to save his own life"). The death was a tragic, unintended consequence "beside the intention."
  2.  **Stress Proportionality:** Argue forcefully that Daniel used only the force *necessary* to repel the threat ("moderation," "not exceeding the limits of blameless defense"). Contrast this with the prosecution's (implied) claim of excess.
  3.  **Reject Malice:** Explicitly deny any "private animosity" or intent to kill.
  4.  **Affirm the Right to Self-Preservation:** Cite Aquinas: "it is natural to everything to keep itself in 'being'" and "one is bound to take more care of one's own life than of another's" (in this defensive context).
  5.  **Address the Soldier Example Carefully (If Needed):** If the prosecution tries to muddy the waters with state violence analogies, Whitfield must clarify the distinction: "Ladies and gentlemen, Daniel is not a soldier on a battlefield acting under orders for the common defense. He was a terrified homeowner, alone in the night, defending his very life. The law recognizes this fundamental difference. Aquinas himself drew this line centuries ago: a private citizen may never *intend* to kill, but they absolutely may act to save their own life, even if the unintended consequence is the death of the aggressor who forced that choice upon them. Daniel intended only to live. The death of [victim] was a consequence he did not seek, brought about by the violent act of breaking into Daniel's home. His response was measured, necessary, and tragically fatal – but it was lawful self-defense, not murder."

  **Conclusion:** Your reading is astute. The final sentence isn't a seamless continuation but a necessary demarcation. Aquinas is distinguishing between two fundamentally different justifications for causing death: one (private) based on unintended effect and proportionality, forbidding intent to kill; the other (public) based on authority and public good, permitting intent to kill as a means. Whitfield's argument must stand firmly on the first, carefully distinguishing it from the second. The tension is resolved by recognizing the distinct moral logics at play, not by conflating the cases.
