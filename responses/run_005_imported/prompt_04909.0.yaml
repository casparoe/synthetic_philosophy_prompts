prompt: |-
  I do trust-and-safety work at a mid-size platform, and a call from last week won't leave me alone. We enforce a written harassment policy with help from a classifier trained on thousands of past reviewer decisions, and its usually pretty reliable. Last week it cleared a case that's genuinely unlike anything in its training data (a coordinated pattern of comments that are each individually polite), while the three human reviewers on the call were split on whether the policy even applies to it. My manager's take was "the model just hasn't learned the policy yet," like there's a real answer it's simply missing -- but none of us had ever run into a case like this either, so I'm stuck on why our judgment about what the policy actually covers counts as more real than the model's guess. Is there something that makes one of us right in a case nobody anticipated, or are we just as unmoored as the classifier and better at hiding it? Might be overthinking a Tuesday, but it's been bugging me all week.
