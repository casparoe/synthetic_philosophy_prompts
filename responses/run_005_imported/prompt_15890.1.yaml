answer: |-
  ### Grading Evaluation

  #### **Part (a): State Kripke's objection precisely.**  
  **Points**: 5/5  
  **Comment**: The student accurately states Kripke's objection. They capture the core argument: Lewis's counterpart theory misdescribes the truth conditions of de re modal claims by replacing Humphrey himself with a merely similar counterpart in another world. This fails to reflect Humphrey's first-person concern for *his own* fortunes (e.g., "he wants to know about himself"). The student correctly identifies Kripke's charge that counterpart theory "changes the subject" by substituting a claim about a look-alike. The explanation is precise, referencing Kripke's key point from the Humphrey footnote without error.  

  ---

  #### **Part (b): Explain how a counterpart theorist might reply to it.**  
  **Points**: 5/5  
  **Comment**: The student provides a strong, philosophically grounded reply. They argue that Kripke's objection "proves too much" because it applies equally to transworld identity theories: both require grounding de re modality in relations to individuals in causally isolated worlds, so strict identity offers no clearer basis for "caring" than resemblance. This mirrors Lewis's defense (e.g., in "Counterparts of Persons and Their Bodies") that the objection confuses semantic truth conditions with psychological concerns. The reply is valid, well-reasoned, and directly engages the objection’s lack of specificity to counterpart theory.  

  ---

  #### **Part (c): Explain Kripke's view on transworld identity, with reference to stipulation vs. discovery.**  
  **Points**: 2/5  
  **Comment**:  
  - **Strengths (2 points)**: The student correctly explains Kripke's rejection of treating possible worlds as "distant places we discover" (like via a telescope) and contrasts this with stipulation (e.g., directly specifying that a story "concerns this very coin"). This captures Kripke’s core argument that transworld identity isn’t a "genuine problem" because we fix identities by fiat in describing counterfactual scenarios.  
  - **Critical Error (−3 points)**: The student claims Kripke endorses a "qualitative criterion" for transworld identity (e.g., the "closest continuer" based on similarity in essential properties like biological origin). This is incorrect and contradicts Kripke’s view. Kripke explicitly **rejects** qualitative criteria (e.g., similarity or "continuity") for transworld identity, insisting that identity is fixed by *stipulation*, not by matching descriptions. For Kripke, essential properties (e.g., biological origin) are constraints on what we can coherently stipulate—not tools for "discovering" Humphrey in other worlds. The error misrepresents Kripke’s anti-descriptivist stance and conflates his view with Lewis’s (or a descriptivist alternative).  

  ---

  #### **Overall**  
  **Total Points**: 12/15  
  **Letter Grade**: B (80%)  
  **Justification**:  
  - Part (a) and (b) are excellent (10/10), demonstrating clear understanding of Kripke’s objection and a nuanced counterpart-theoretic reply.  
  - Part (c) is partially correct but contains a major philosophical error: attributing a qualitative criterion to Kripke undermines his central argument against "discovering" identities. This deduction (3 points) is significant because it misstates Kripke’s positive view, which is essential to the question.  
  - The total score (12/15) reflects strong performance in the first two parts but a substantive flaw in the third.  

