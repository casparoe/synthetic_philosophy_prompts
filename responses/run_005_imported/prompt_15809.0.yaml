  3. **Information affects decisions only**: The theorem treats information as a tool for better choices. Here, the test result doesn't change any actionable decisions (since there's no treatment), so the only "use" of the information is psychological. If the information causes distress without enabling better choices, the theorem's logic doesn't hold.

