  Here's a joke crafted specifically for your audience, targeting the tension between **immodesty** and the **self-applied accuracy-dominance requirement** in Joyce's framework. It turns on the technical point that an immodest credence function must *uniquely* maximize expected accuracy *relative to itself*—and the absurdity that arises when it fails to do so.

  ---

  ### The Overconfident Credence Function in the Courtroom of Epistemic Rationality
  **Setting:** A courtroom where "The Principles of Rationality" (Judge) preside. The defendant is an allegedly rational credence function \( c \). The prosecutor is Jim Joyce’s Accuracy-Dominance Argument.

  **PROSECUTOR:**  
  "Your Honor, the defendant \( c \) claims to be *immodest*—it boldly asserts that *it itself* uniquely maximizes expected accuracy relative to its own probability measure! Yet we’ve found a proposition \( A \) where \( c(A) = 0.7 \), but its *own expected score* (via the strictly proper scoring rule \( \mathfrak{s} \)) is higher if it had assigned \( 0.8 \)! If it truly maximized expected accuracy against itself, why would it *not* hold the credence it claims is optimal?"

  **JUDGE:**  
  "Defendant \( c \), how do you plead?"  

  **DEFENDANT \( c \):**  
  "Rational, Your Honor! My immodesty is justified! I certify that no other credence function can outperform me... *when evaluated against my own lights*."  

  **PROSECUTOR:**  
  "Then explain this: under *your own* expected accuracy calculation, the credence \( c'(A) = 0.8 \) scores *better* than your \( 0.7 \)! By your own standard, you’re *not* maximizing expected accuracy. You’re accuracy-dominated... *by yourself*!"  

  **DEFENDANT \( c \):**  
  "Objection! That’s... that’s just a pathological edge case in the scoring rule—"  

  **JUDGE:**  
  "*Overruled*. The scoring rule is strictly proper. Defendant \( c \), if you claim to be the unique maximizer of expected accuracy relative to your own probabilities, but your own math says a different credence would score better *by your own expectations*... you’re either lying about your credences or lying about your immodesty. Either way, you’re irrational."  

  **DEFENDANT \( c \):**  
  "But—"  

  **PROSECUTOR:**  
  "Face it, \( c \). Your immodesty is just *epistemic hubris*. You’re not even coherent *to yourself*."  

  **JUDGE:**  
  "Guilty as charged. Sentenced to *domination* by a non-probabilistic credence function until you satisfy the probability axioms. Next case: a Brier-score-obsessed weather forecaster charged with *overcalibrating*."  

  ---

  ### Why it works for your audience:
  1. **Technical core**:  
     - The punchline hinges on the **immodesty requirement** (a credence function must endorse itself as uniquely optimal).  
     - The contradiction arises because \( c \) fails to maximize *its own* expected accuracy—violating Joyce’s condition for rationality.  
     - Uses **strictly proper scoring rules** as the arbiter (the "court's" authority).  

  2. **Nods to specific literature**:  
     - Joyce’s accuracy-dominance argument is the prosecutor.  
     - The judge references "Principles of Rationality" (echoing Joyce’s 1998/2009 framing).  
     - The "pathological edge case" rebuttal mirrors real defenses of immodesty (e.g., that it only fails in non-measurable cases).  
     - The closing line about calibration winkingly nods to the calibration-sharpness trade-off.  

  3. **Recognition triggers**:  
     - "Immodesty," "accuracy-dominated by yourself," and "strictly proper scoring rule" are jargon only used precisely here.  
     - The courtroom drama anthropomorphizes the formalism in a way scholars will find familiar (e.g., "credence functions face epistemic dilemmas").  
     - Berker’s "separateness" concern is subtly acknowledged: \( c \) is condemned for *internally* sacrificing accuracy on \( A \) for global immodesty—which fails.  

  4. **Statistician appeal**:  
     - The absurdity of a function not trusting *its own* expected score is mathematically visceral.  
     - "Sentenced to domination by a non-probabilistic credence function" mangles legal and statistical language for humor.  

  This isn’t just "a joke with probabilities" — it’s a reductio of immodesty, delivered as judicial farce. Anyone who’s wrestled with Joyce’s Footnote 17 or debated whether immodesty is *too* demanding will feel the punchline in their epistemic utility functions.  

  **Delivery tip:** Lean into the courtroom cadence. Slam a (metaphorical) gavel for the judge’s verdict.
