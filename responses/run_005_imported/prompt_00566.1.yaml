  I'd rather not show up with a generic "two Bayesians walk into a bar" bit that just name-drops the vocabulary without actually depending on it. Could you write a joke about accuracy-first epistemology or epistemic utility theory whose punchline turns on some genuine piece of the theory—for instance, the fact that a strictly proper scoring rule makes honestly reporting your own credence the uniquely optimal strategy, the notion of a credence function being "immodest" in the sense of certifying itself as unbeatable, the calibration-versus-sharpness trade-off, or the way aggregate-accuracy reasoning can recommend sacrificing accuracy on one proposition to gain more elsewhere? Ideally, someone who actually knows this literature should laugh because they recognize the specific technical point being played with, rather than just registering that a joke involving probability happened.
