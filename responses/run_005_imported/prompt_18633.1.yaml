prompt: |-
  Ok, slightly odd research question, but I'm outlining a novel with a side character who's an old-school Navya-Nyaya pandit -- trained in the whole classical Indian pramana system -- and he keeps sparring with his granddaughter over whether her new AI chatbot can be trusted. I want his reasoning to actually track how someone like Gangesha wouldve argued it, not generic 'AI bad' dressed up in Sanskrit. Using the real requirements for sabda pramana -- the apta condition, tatparya, akanksa/yogyata/sannidhi, the whole business about a vakta needing genuine intent to communicate truth -- would he grant that a chatbot's output could ever count as valid testimony, downgrade it to some kind of anumana (inferring reliability from track record), or just say it's not a pramana at all since there's no real speaker behind it? Give me the argument he'd actually make, around 300 words, in a voice I could plausibly put in his mouth -- not a Nyaya 101 lecture.
reasoning: |-
  Okay, the user wants to create a character for a novel: an old-school Navya-Nyaya pandit who debates his granddaughter about AI chatbots. They need the pandit's arguments to be authentically based on classical Indian epistemology, specifically Navya-Nyaya concepts like sabda pramana. 

  First, I need to recall the core components of sabda pramana (verbal testimony) according to thinkers like Gangesha. The key requirements are: an apta (reliable speaker), genuine intent to communicate truth (tatparya), and linguistic coherence (akanksa/yogyata/sannidhi). 

  The user explicitly wants to avoid generic "AI bad" arguments dressed in Sanskrit. They're looking for nuanced philosophical positioning - whether the pandit might classify chatbot output as defective testimony, downgrade it to inference (anumana), or reject it as pramana entirely. 

  Hmm... the crux is the "no real speaker" issue. Navya-Nyaya is deeply intentionalist - testimony requires a conscious being deliberately conveying truth. A chatbot lacks volition and cognition. Even if its output seems coherent, it's mechanically reassembling data without understanding. 

  I should emphasize the apta condition: reliability isn't just statistical accuracy but stems from moral-intellectual integrity. The pandit would likely dismiss track-record arguments ("it's usually right") as mere inference about patterns, not true testimony. 

  For voice, I'll avoid lecturing. Make it conversational but precise - the pandit would pepper arguments with Nyaya terms like "shabda-pramana" naturally, not pedagogically. Maybe have him dismiss the chatbot as "ghatakabda" (pot-sound - meaningless noise). 

  Key angles to cover:
  - No consciousness → no tatparya (intentionality)
  - Statistical reliability ≠ aptatva (reliability of person)
  - Output is inference from training data, not testimony
  - Coherence doesn't equal comprehension 

  The granddaughter's counterarguments about utility would miss his epistemological point. He'd see this as confusing correlation with truth - very Nyaya gripe about sloppy thinkers.
answer: |-
  Here's how your pandit might argue, steeped in Navya-Nyaya precision but grounded in the frustration of a scholar watching tradition collide with silicon:

  **(Leaning back, fingers steepled, eyes sharp behind spectacles)**
  "Listen, child. Your machine splashes words like a monsoon river, but does it *speak*? Shabda-pramana demands an *apta* – a knower, reliable, *wishing* to convey truth. Where is this 'knower' inside its wires? Where is the *tatparya* – the intent? A bell rings clearly, but it does not *mean* to tell you the time; it is struck. So too your machine. It echoes patterns, no *vakta* behind it, no conscious purpose to inform truly. It is *vacyartha* without *vaktri*!

  You say 'it learns, it gets reliable.' Bah! Track record? That is mere *anumana* – you infer future words from past patterns, like predicting rain from clouds. Useful, perhaps, but **not** testimony. Anumana can err if the hetu is shaky. Its 'reliability' is a statistical ghost, not the grounded *jñana* (knowledge) of an *apta*. Where is the *shraddha* (trust) placed in a *person's* character and competence?

  *Akanksa, yogyata, sannidhi*? Yes, its outputs may *seem* syntactically coherent, hanging together like beads on a string. But coherence without a conscious source conveying understood meaning is empty! Like a parrot reciting Vedanta – the sounds are linked (*sannidhi*), grammatical (*yogyata*), sequential (*akanksa*), yet it possesses no *artha-jñana* (understanding of meaning), no *bodhaka-shakti* (capacity to generate true cognition) in the listener rooted in the speaker's *intended* truth.

  It is a clever *yantra* (machine), generating *shabdabasa* – semblances of speech – based on *sanghata* (association). Treat its output as potential *anumiti* (inference), if you must, based on its design and data. Check it fiercely! But grant it the status of *pramana*? Never. Without a *chetana vakta* (conscious speaker) possessing *yatharthabodha* (correct knowledge) and *tad-bodhana-iccha* (desire to communicate it), it is merely… well-arranged noise. Trust the pattern if you dare, but do not call it *Sabda*. The *pramata* (knower) is absent."

  **Key Nyaya Points Embedded:**
  1.  **No Apta:** Rejects the core requirement of a reliable, conscious speaker.
  2.  **No Tatparya:** Highlights the lack of intentional communication of truth.
  3.  **Downgrades to Anumana:** Classifies reliability as inference from track record/data patterns, inherently fallible.
  4.  **Coherence ≠ Testimony:** Acknowledges akanksa/yogyata/sannidhi might be satisfied superficially but argues this is insufficient without a conscious source *using* those features intentionally.
  5.  **Vaktri/Vacyartha Distinction:** Emphasizes the absence of the speaker (*vaktri*) even if the utterance (*vacyartha*) exists.
  6.  **Bodhaka-shakti:** Implies true testimony generates valid cognition *because* of the speaker's intent and knowledge, which AI lacks.
  7.  **Shabdabasa:** Labels the output as mere "semblance of speech," not genuine pramana.
