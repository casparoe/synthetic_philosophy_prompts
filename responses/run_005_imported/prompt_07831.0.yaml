answer: |-
  Here are 8 focused interview questions targeting CEV's philosophical foundations, operational challenges, and MIRI's pivot, designed to push beyond surface-level descriptions. Each includes the likely dodge and a sharp follow-up:

  1.  **Core Mechanism Challenge:** "CEV describes resolving 'spread' and 'muddle' to achieve 'coherence.' Critics argue these terms primarily *relabel* the fundamental problem of resolving deep value conflicts and disagreements (both intra- and inter-personally) rather than providing a novel solution. What specific *algorithmic or philosophical machinery* does CEV uniquely offer to solve this disagreement problem that existing frameworks (like reflective equilibrium or bargaining theory) lack?"
      *   *Likely Dodge:* Framing spread/muddle as "diagnostic terms" highlighting the problem space, not claiming a full solution yet, or retreating to "it's what the AI figures out."
      *   *Follow-Up:* "If spread/muddle/coherence are primarily diagnostic labels for the disagreement problem, doesn't that validate the criticism that CEV's core innovation is terminological rather than substantive for resolving the core alignment challenge?"

  2.  **Idealization & Alienation (Sidgwick/Railton):** "CEV fits within a lineage of idealized preference accounts (Sidgwick's 'point of view of the universe', Railton's 'objective interests'). A core objection is alienation: why should the preferences of a wildly idealized, cognitively enhanced version of me have normative authority over the actual, non-idealized me sitting here now? How does CEV avoid this 'replacement problem' where the AI serves someone fundamentally *different* from the current user?"
      *   *Likely Dodge:* Emphasizing the "extrapolation" from current values/psychology or claiming the idealized self *is* the "truer" self; downplaying the discontinuity.
      *   *Follow-Up:* "If the extrapolation process involves radical cognitive enhancement and overcoming current biases/limitations (like akrasia or limited perspective), isn't the resulting 'volition' *necessarily* alien to the current self? Isn't 'truer self' just asserting the conclusion? How does CEV provide a *non-question-begging* argument for why *I* should accept this new entity's authority?"

  3.  **MIRI's Pivot to Corrigibility:** "MIRI, where CEV was developed, significantly shifted focus towards AI *corrigibility* (keeping AI systems interruptible and amenable to human oversight) as a more tractable near-term target than directly pursuing CEV. Doesn't this practical shift implicitly acknowledge that CEV, as a direct alignment target, is currently too underspecified, computationally intractable, or philosophically fraught to be implementable?"
      *   *Likely Dodge:* Framing corrigibility as a *prerequisite* for safely *eventually* pursuing CEV, not an abandonment; emphasizing the sheer difficulty and danger of getting CEV wrong without safeguards.
      *   *Follow-Up:* "If CEV is the supposed 'correct long-run target,' why did the difficulty of even *defining* it operationally push MIRI towards corrigibility *instead* of working on partial implementations or clearer sub-problems *of CEV itself*? Doesn't this suggest CEV might be more of a vague guiding star than an actionable target?"

  4.  **Interpersonal Aggregation & Non-Convergence:** "CEV proposes aggregating individual extrapolated volitions into a single coherent whole. What specific mechanism guarantees convergence? What happens if, even after ideal reflection and full knowledge, the extrapolated volitions of different individuals or groups remain fundamentally incompatible (e.g., deep pluralism on the nature of the good life)? Does CEV imply forcing coherence where none exists?"
      *   *Likely Dodge:* Suggesting convergence is likely under full knowledge/reflection, or hand-waving towards idealized negotiation; retreating to "local CEVs" for distinct groups.
      *   *Follow-Up:* "If convergence isn't guaranteed, doesn't the 'coherent whole' requirement either force arbitrary harmonization (violating pluralism) or collapse into separate, potentially conflicting 'CEV-spheres'? How is the latter meaningfully different from current value conflicts, just amplified by superintelligence?"

  5.  **The Rawls Comparison:** "Some argue CEV is essentially Rawlsian reflective equilibrium ('RE') scaled up: revising our judgments under conditions of full information and impartiality to achieve coherence. If this comparison holds, doesn't CEV inherit RE's well-known critiques (e.g., indeterminacy, conservative bias, difficulty handling deep pluralism) without adding significant new tools to resolve them?"
      *   *Likely Dodge:* Highlighting differences: CEV's focus on *extrapolated* psychology (not just beliefs), dynamical process, computational implementation; downplaying the similarity.
      *   *Follow-Up:* "Even granting the differences (extrapolation, computation), the core *output* – coherent preferences under idealized conditions – seems analogous. If CEV doesn't provide a fundamentally new *resolution mechanism* for value conflicts beyond what RE contemplates (just faster/broader), how does it overcome the same critiques of indeterminacy and pluralism?"

  6.  **Operationalizing Extrapolation:** "The 'extrapolation' in CEV is crucial but notoriously vague. How do you *concretely* specify a process that takes a messy, contradictory, context-dependent human psychology and 'extends it to infinity' or 'to ideal reflection' without smuggling in normative assumptions about *what kind* of reflection or extension is 'correct'? Isn't the extrapolation function itself a massive source of bias?"
      *   *Likely Dodge:* Deferring to future AI capabilities ("the AI will figure out the faithful extrapolation"), or framing it as a technical ML problem (learning latent preferences).
      *   *Follow-Up:* "But designing the AI system that performs this extrapolation requires *human choices now* about the architecture, training data, and objective function for 'faithful extrapolation.' How do you ensure *those choices* don't fundamentally bias or constrain the outcome, effectively baking in the programmers' values as the 'true' extrapolation method?"

  7.  **Empirical Checks & Verification:** "CEV is fundamentally counterfactual – it's about what we *would* want. How could we ever empirically verify that an AI system has *correctly* implemented CEV, rather than its own interpretation or a biased extrapolation? Without verifiability, doesn't CEV risk becoming an unfalsifiable justification for whatever the AI decides?"
      *   *Likely Dodge:* Suggesting partial verification via reflection on smaller scales, or arguing corrigibility allows us to check/correct the AI's progress iteratively.
      *   *Follow-Up:* "But if the endpoint is a fully coherent, extrapolated volition potentially unrecognizable to current humans, and the process involves radical cognitive enhancement, what meaningful 'check' can current, non-enhanced humans perform? Doesn't the 'sane and wiser' clause make the standard inherently circular and self-justifying from the AI's perspective?"

  8.  **The "Sane and Wiser" Dodge:** "The standard description of CEV's output is people being 'smarter, saner, more the people we wished we were.' Isn't 'saner' and 'wiser' doing enormous, unacknowledged normative work here? Who defines sanity or wisdom in this context? Isn't this phrase effectively a black box that hides the very value judgments CEV is supposed to resolve?"
      *   *Likely Dodge:* Claiming sanity/wisdom emerge naturally from the extrapolation/coherence process itself; defining them procedurally (e.g., freedom from bias, logical consistency).
      *   *Follow-Up:* "But procedural definitions (like consistency, lack of bias) are themselves value-laden choices. Why prioritize logical consistency over, say, passionate commitment? Why value freedom from 'bias' over valuing specific cultural perspectives? Doesn't defining the *process* of becoming 'saner/wiser' already embed a contestable vision of the ideal agent?"

  **Key Interview Strategy:**

  *   **Listen for Evasion:** Pay close attention if answers retreat to vague descriptions ("what we'd want if we were wiser"), hand-waving to future AI capabilities ("the AI will figure it out"), or redefining terms procedurally without justifying *why* that procedure is correct.
  *   **Insist on Mechanism:** Constantly push for the *how* – not just the *what*. How does the aggregation work? How is extrapolation defined *operationally*? How is disagreement resolved *concretely*?
  *   **Highlight Trade-offs & Assumptions:** Force the interviewee to acknowledge the inherent normative choices baked into CEV's structure (e.g., privileging coherence, defining idealization, handling pluralism).
  *   **Connect Critiques:** Link questions together. E.g., if they dodge alienation by emphasizing extrapolation, follow up with the operationalization question (#6). If they dodge non-convergence with idealized negotiation, link back to the aggregation/mechanism question (#4).

  These questions should prevent a simple restatement of the elevator pitch and force a deeper engagement with the philosophical and practical challenges inherent in CEV. Good luck with the interview!
