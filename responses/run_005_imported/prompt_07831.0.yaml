  On MIRI's prioritization of corrigibility, the researcher might say CEV is too hard without corrigibility. The follow-up should ask why not partial implementations instead of sidelining CEV entirely. For non-convergence, they might suggest localized CEVs, but the follow-up needs to address how that differs from existing value pluralism.

