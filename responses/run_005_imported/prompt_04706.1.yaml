prompt: |-
  So today in APES we watched part of this old documentary about climate change cost-benefit analysis and it kind of bugged me. The teacher brought up 'pure time preference' — apparently this economist named Ramsey called it 'ethically indefensible' to value future generations' wellbeing less just because they're later in time, which seems obviously right to me. But then she said the Stern Review, which is supposedly the good progressive climate report that actually takes future people seriously, still ends up using a discount rate above zero, something like 1.4%. Isnt that basically contradictory — if discounting people just for being in the future is unjustified, shouldnt the actual correct discount rate literally be 0%, and isnt using any positive number just Stern admitting future people matter less than us?
reasoning: |-
  Okay, let me unpack this student's question. They're clearly grappling with a moral dilemma in climate economics that many intelligent people struggle with. The core tension they've identified - between ethical principles and practical modeling - is incredibly sophisticated for a high school student. 

  First, I need to validate their intuition that Ramsey's ethical stance makes sense. The student is absolutely right that pure time preference feels morally questionable when we're talking about human wellbeing across generations. Their frustration with Stern using 1.4% despite this is completely understandable. 

  But where this gets tricky is the distinction between pure time preference and other discounting factors. The student seems to be conflating all discounting with devaluing future lives, which is a common misconception. I should emphasize how consumption growth expectations and risk factors create different ethical implications. 

  I recall Stern actually spends considerable time justifying his near-zero pure time preference rate (δ=0.1%). That's the key nuance here - he's separating out the "we value them less" component from the "they might be richer" component. Maybe I should explicitly show the discount rate formula r = δ + θg to clarify this distinction.

  The student might benefit from concrete examples. Like how not discounting at all could require us to sacrifice absurd amounts of present consumption for trivial future gains if future generations are vastly wealthier. But I need to be careful not to sound like I'm dismissing their ethical concern - this is genuinely one of the hardest problems in welfare economics.

  They're clearly coming at this from a strong moral framework, which is admirable. I should acknowledge that while explaining why economists still use discounting: it's not that future lives matter less, but that (a) resources become more productive over time, and (b) there's always some existential risk. The student deserves to understand both sides - the ethical ideal and the practical implementation.

  This might be a good place to mention that many climate economists actually debate Stern's rate as being too low! That could help them see it's a spectrum of reasonable positions. The important thing is they've grasped the central ethical tension - now I just need to show them how serious economists wrestle with it.
answer: |-
  You've hit on one of the most profound ethical debates in climate economics – and your intuition is spot on. The tension between Ramsey's ethical stance and Stern's use of a positive discount rate (r ≈ 1.4%) isn't a contradiction, but a complex ethical compromise. Here's why Stern did it and why it's still debated:

  ### 1. **Ramsey's Ethical Core is Correct (and Stern Agrees)**
     - **Pure Time Preference (δ):** Ramsey argued that discounting *solely because benefits occur later* (δ > 0) is unethical. Stern **completely agrees** with this. His report explicitly sets **δ = 0.1%**, near zero, primarily to account for the tiny chance humanity goes extinct each year. This is radically lower than mainstream models (which often use δ = 1-3%).

  ### 2. **Why Stern Still Uses r > 0: The "θg" Term**
     Stern's discount rate isn't *just* δ. The full formula is:  
     **r = δ + θ × g**  
     Where:
     - **g** = Expected future economic growth (consumption per capita).  
     - **θ** = Elasticity of marginal utility of consumption (how much extra value we assign to $1 for poorer people vs. richer people).  

     Stern uses **θ ≈ 1** and **g ≈ 1.3%**, leading to:  
     **r ≈ 0.1% + (1 × 1.3%) ≈ 1.4%**  

     **This is NOT discounting because future lives matter less.** It's discounting because:  
     - **Future generations are expected to be richer (g > 0).**  
     - **An extra dollar is ethically worth less to a richer person than to a poorer person (θ > 0).**  

  ### 3. **The Ethical Justification for θg > 0**
     - **Equity Argument:** If future people are wealthier (due to growth), asking *current* poorer generations to sacrifice heavily for *future* richer generations raises fairness concerns.  
     - **Practical Example:**  
       - Spending $1 million today to prevent $1 million in climate damage in 2200 might be inefficient.  
       - If people in 2200 are 10x richer (due to g), that $1 million damage *to them* is like $100,000 to us today.  
       - θ quantifies how much we "correct" for this inequality.

  ### 4. **Why This is Still Controversial (You're Not Wrong to Question It)**
     - **Growth (g) isn't guaranteed:** Climate damage could *reduce* g, making future people poorer. Stern's model assumes growth continues – a major critique.  
     - **θ is subjective:** Is θ=1 fair? If θ=0 (no diminishing utility), r = δ ≈ 0%. Some ethicists argue we shouldn't penalize future people for being richer.  
     - **Catastrophic Risks:** Discounting reduces the weight of distant catastrophes. A 0% rate would make preventing existential risks an absolute priority.  
     - **Intergenerational Equity:** Even if future people are richer, do they have a "right" to a stable climate we're depriving them of? Sacrifice today might be owed.

  ### 5. **Stern's Radical Stance (Relative to Economics)**
     - Mainstream models pre-Stern used r = 4-6%. Stern's r ≈ 1.4% was a **revolution**, justifying *massive* immediate climate investment.  
     - With r=0%, his recommended carbon taxes would be even higher. His near-zero δ was already seen as "unrealistic" by many economists.

  **In essence:** Stern didn't discount future *well-being* (he valued lives equally across time). He discounted future *consumption* because it's expected to be less valuable *to the richer people experiencing it*. It's an attempt to balance:  
  ✅ **Ethical duty to future generations** (via δ ≈ 0%).  
  ✅ **Equity between poor present and (potentially) rich future** (via θg).  

  **Your critique is valid:** If you reject the idea that future wealth justifies less investment in *their* survival (e.g., because a stable climate is a fundamental right), then r *should* be 0%. Many philosophers and scientists agree with you. Stern chose a pragmatic middle path that still radically shifted the debate. This tension remains unresolved in climate ethics.
