answer: |-
  Based on Aumann and Brandenburger's (1995) seminal work, the common simplification that both rationalizability and Nash equilibrium follow *only* from common knowledge of rationality (CKR) is **incorrect and misleading**. Their analysis reveals that Nash equilibrium requires a **significantly stronger and logically independent epistemic assumption** beyond CKR: **mutual knowledge of the strategies played and correct beliefs (or "belief consistency")**. Here's a breakdown:

  1.  **Epistemic Conditions for Rationalizability:**
      *   **Sufficient Condition:** Common Knowledge of Rationality (CKR).
      *   **What it means:** Every player is rational (chooses a best response to their beliefs), every player believes every other player is rational, every player believes that every other player believes everyone is rational, and so on, ad infinitum.
      *   **Result:** Players eliminate strategies that are never best responses to *any* belief about opponents' strategies (even inconsistent or wrong beliefs). This process iterates, leading to the set of rationalizable strategies.
      *   **Beliefs:** Players' beliefs about what others will play need *not* be correct or mutually consistent. Each player's belief is only constrained by the assumption that others are rational (so beliefs assign positive probability only to rationalizable strategies of opponents).

  2.  **Epistemic Conditions for Nash Equilibrium (Aumann & Brandenburger):**
      *   **Required Conditions (for 2-player games):**
          *   **Mutual Knowledge of Rationality (MKR):** Each player knows the other is rational (a weaker condition than CKR).
          *   **Mutual Knowledge of the Strategy Profile (MKS):** Each player knows the strategy the *other* player will use. (Player 1 knows Player 2's strategy, Player 2 knows Player 1's strategy).
      *   **Result:** If both players are rational and each knows the other's strategy, then each is playing a best response to the *actual* strategy of the other. This **is** a Nash equilibrium.
      *   **The Crucial Point:** MKS is the **logically independent assumption** doing the real work for Nash equilibrium. It forces players' beliefs about each other's play to be **correct and consistent**.
      *   **Why CKR isn't enough for Nash:** CKR only ensures players are best responding to *some* belief consistent with rationality. It does **not** ensure that these diverse beliefs align with each other or with reality. Players under CKR could hold different, mutually inconsistent, and incorrect beliefs about what others will do, leading to non-equilibrium outcomes where each is rational *given their (wrong) belief*.

  3.  **The Logically Independent Assumption: Correct Beliefs (MKS)**
      *   **What it is:** Mutual knowledge of strategies means players have correct expectations about what others will actually play. Player 1 *knows* Player 2's strategy s2, and Player 2 *knows* Player 1's strategy s1.
      *   **Why it cannot be reduced to Rationality:**
          *   **Rationality is Belief-Relative:** Rationality dictates choosing a best response *given your current beliefs*. Your beliefs could be wildly wrong, yet you'd still be rational if you best respond *to those wrong beliefs*.
          *   **CKR Constrains Beliefs, Not their Accuracy:** CKR only constrains players to believe others will play *rationalizable* strategies (strategies that could be best responses *somewhere*). It doesn't force players to agree on *which* specific rationalizable strategy others will play, nor does it force their beliefs to match reality. Players under CKR can rationally expect different, incompatible outcomes.
      *   **Example (Battle of the Sexes):**
          *   *Rationalizable Strategies:* (Opera, Opera) and (Boxing, Boxing) are both rationalizable. (Opera, Boxing) and (Boxing, Opera) are not.
          *   *CKR Outcome:* Players could rationally hold beliefs leading to miscoordination. Player 1 might believe Player 2 will choose Opera (and thus chooses Opera), while Player 2 believes Player 1 will choose Boxing (and thus chooses Boxing). Outcome: (Opera, Boxing) - both were rational *given their beliefs*, but it's not Nash and miscoordinates.
          *   *Nash Outcome:* Requires Player 1 to know Player 2 is actually playing Opera (so Player 1 plays Opera) AND Player 2 to know Player 1 is actually playing Opera (so Player 2 plays Opera). Or vice versa for Boxing. MKS ensures coordination on one equilibrium. CKR alone does not.

  4.  **What is Lost When Assuming Rationality Suffices for Nash:**
      *   **Descriptively:**
          *   **Over-Prediction of Coordination/Equilibrium Play:** Assuming Nash follows directly from rationality ignores the fundamental problem of belief formation and coordination under strategic uncertainty. Real-world players often fail to coordinate on equilibria precisely because they lack the mutual knowledge of strategies (MKS). Miscoordination, focal points, learning dynamics, and historical precedent become harder to explain if we assume CKR magically delivers equilibrium play. Models ignoring the belief consistency requirement risk being poor predictors of actual behavior in one-shot or unfamiliar strategic interactions.
      *   **Normatively:**
          *   **Prescribing Strategies Dependent on Unjustified Beliefs:** Recommending a Nash equilibrium strategy as the rational choice *presupposes* that others will play their part. If this mutual knowledge (MKS) doesn't hold, playing a Nash strategy can be a *bad* choice. For example, playing "Opera" in BoS is disastrous if the other player plays "Boxing". Normative advice based *solely* on CKR would only prescribe playing *some* rationalizable strategy, leaving the choice between equilibria (or other rationalizable profiles) indeterminate. Normative justifications for specific Nash equilibria implicitly rely on the stronger MKS assumption.
          *   **Obfuscating the Role of Conventions/Communication:** The MKS condition highlights why conventions, pre-play communication, repeated interaction, or salient focal points are often crucial for achieving Nash equilibrium in practice. Ignoring MKS makes equilibrium seem like a pure logic consequence of rationality, downplaying the social or contextual factors enabling players to form correct, consistent beliefs.

  **Conclusion:**

  Aumann and Brandenburger's analysis definitively shows that **common knowledge of rationality (CKR) alone is sufficient only for rationalizability, not for Nash equilibrium.** Nash equilibrium requires the logically distinct and stronger assumption of **mutual knowledge of the strategies to be played (MKS)**, which imposes **correct and consistent beliefs** about opponents' actions. Mistakenly assuming Nash follows solely from CKR obscures the critical challenge of belief coordination inherent in strategic interaction. Descriptively, this leads to models that may fail to predict common outcomes like miscoordination. Normatively, it risks prescribing strategies that are only optimal under the unstated and often unrealistic assumption that players magically know what others will do. Recognizing the necessity of MKS refocuses attention on how beliefs are formed and aligned in strategic settings.
