  Okay, the user is diving deep into philosophy of science, specifically Humean Supervenience and quantum entanglement. They've been in a seminar discussing how entanglement challenges Lewis's Humeanism. The user is confused about where David Hume himself would stand in this debate, given that Lewis's framework seems to have added metaphysical commitments Hume never intended.

  First, I need to recall Hume's original arguments. Hume was focused on epistemology—how we know things. He rejected the idea of necessary connections because we can't observe them. For Hume, causation is just constant conjunction plus psychological habit. He wasn't making claims about the fundamental structure of reality but about the limits of human knowledge.

  The user is pointing out that Lewis took Hume's ideas and built a metaphysical system: Humean Supervenience. This includes the idea that everything supervenes on a mosaic of local matters of fact. But Hume never claimed the mosaic was the complete metaphysical picture. He was skeptical about whether we could ever know such a structure.

  Quantum entanglement, with its non-local correlations, seems to break the separability that Lewis's mosaic requires. Lewis responds by redefining locality in terms of configuration space, but that feels like a stretch. The user is wondering if Hume would even engage with this problem since his concerns were about justification, not metaphysics.

  Hume might see entanglement as another regularity without needing to explain it metaphysically. Bell's theorem shows that no local hidden variable theory can explain the correlations, but for Hume, that just means we observe constant conjunction without necessity. He wouldn't feel compelled to defend separability because he never asserted it as a metaphysical truth.

  The user also questions whether modern Humeans like Lewis have strayed from Hume's original skepticism by adding modal realism and possible worlds. Hume's strict empiricism might make him skeptical of inferring non-local structures from Bell violations. He'd probably avoid taking sides in the metaphysical debate, seeing it as beyond human understanding.

  So, Hume would likely reject the entire framing of the debate. He'd be on neither side because his project was about epistemology, not ontology. The user's insight about the "unHumean baggage" in contemporary debates is spot-on. Lewis's system has metaphysical commitments that Hume would find unsupportable. The user's deeper need is to clarify Hume's actual views versus modern interpretations, possibly for their seminar discussion or paper. They want to resolve their confusion about Hume's stance and critique the contemporary Humean project's divergence from its namesake.
answer: |-
  That's an incredibly sharp set of questions – you've perfectly pinpointed the core tension between historical Hume and contemporary "Humeanism." Let's break down where Hume himself would likely stand on this quantum entanglement challenge, reasoning strictly from his own commitments in the *Treatise* and *Enquiry*:

  1.  **Hume's Core Project: Skeptical Epistemology, Not Positive Metaphysics:**
      *   Hume wasn't primarily building a metaphysical system about what *is*. His focus was relentlessly epistemological: What can we *know*? How do we form our beliefs, especially about causation and the unobserved?
      *   His famous analysis of causation isn't a claim that "necessary connections *don't exist* mind-independently," but rather that "we *have no impression* of necessary connection, and therefore *cannot form a justifiable idea or knowledge* of such a thing." The "constant conjunction + expectation" account is a psychological/skeptical explanation for *why we believe* in causation, *not* a positive metaphysical thesis about what causation *is* in the world itself.
      *   **Therefore:** Hume wouldn't feel *obligated* to defend a metaphysical thesis like Lewis's Humean Supervenience (HS) against quantum mechanics. HS *is* a positive metaphysical claim about the fundamental structure of reality (everything supervenes on the local mosaic). Hume never made such a claim. He was agnostic (or skeptical) about whether reality *had* such a structure.

  2.  **Hume on "Distinct Existences" and Separability:**
      *   Hume's point about "no necessary connections between distinct existences" is, again, primarily epistemological. We observe distinct events (A, then B), but we never observe a *necessary link* binding them. We *infer* the link based on habit.
      *   He *does* rely on a notion of distinctness/conceivability for his arguments (e.g., we can conceive of A without B, so they are distinct). However, this is used to *undermine* rationalist claims about *knowing* necessary connections, *not* to establish a fundamental ontological principle that reality *must* be separable in the way Lewis requires for the mosaic. For Hume, "distinct existences" is a conceptual tool for analysis, not a guaranteed feature of mind-independent reality.

  3.  **Hume's Likely Reaction to Entanglement:**
      *   **The Brute Regularity View:** This is the *most* Humean stance. Hume would likely say: "We observe incredibly strong, non-local correlations between measurement outcomes on entangled particles. This is a remarkable constant conjunction. It's a *brute fact* of our experience. We have no impression of any necessary connection *explaining* this correlation, nor any rational justification for inferring one exists beyond the regularity itself. It's just another pattern in the phenomena, albeit a very strange one." He wouldn't feel pressure to *ground* it locally or non-locally in fundamental ontology. The regularity *is* the observable phenomenon.
      *   **Suspicion of "Spooky" Inferences:** Hume would be *deeply* suspicious of any inference *from* the observed Bell violations *to* a positive metaphysical claim about *real, non-local necessary connections* in nature. Why? Because:
          *   We still have no *impression* of such a connection. We only see correlated outcomes.
          *   Inferring a hidden metaphysical structure (non-local necessitation) to "explain" the correlations would violate his strict empiricism. It posits an unobservable entity/relation to account for an observable regularity – exactly the kind of move he criticized rationalists for.
          *   **Bell's Theorem:** Hume would likely see Bell's theorem as a brilliant demonstration that *no local hidden variable theory* (i.e., no theory adding *local* properties we haven't observed) can account for the observed correlations. But for Hume, this doesn't *force* us to accept *non-local necessary connections*. It forces us to accept that the observed correlations are *fundamentally non-local regularities*. The "necessity" we might *feel* is, again, just a habit of expectation based on the incredibly strong conjunction. The theorem shows the *regularity* isn't locally explainable by hidden *properties*, not that it *must* be explained by a metaphysical *necessitation relation*.

  4.  **The "UnHumean Baggage" and Awkwardness:**
      *   You are absolutely right. This is the crux. Lewis's project (and much of contemporary Humeanism) takes Hume's *epistemological skepticism* and *psychological account of causation* and transforms it into a *positive, realist metaphysics*:
          *   **Modal Realism:** Lewis's vast ontology of concrete possible worlds is utterly foreign to Hume. Hume was deeply skeptical of modal knowledge beyond conceivability/imaginability. Actual concrete worlds beyond our own? Unthinkable for Hume.
          *   **The Mosaic as Fundamental Ontology:** Asserting that the entire truth about reality supervenes *only* on the distribution of local qualities in spacetime is a bold *metaphysical* claim Hume never made. He described our *experience* as a succession of perceptions (his own "mosaic"), but he was famously skeptical about whether this reflected an underlying external reality at all (radical skepticism about external worlds and persistent objects).
          *   **Best System Analysis (BSA):** While clever, the BSA introduces concepts like "simplicity," "strength," and "balance" as objective features that pick out the *real laws*. Hume would likely see this as smuggling in normative, perhaps even rationalist, standards that aren't grounded purely in impressions. How do we have an impression of "simplicity" as a fundamental feature of the world-system?
      *   **The Awkwardness for Contemporary Humeans:** The quantum entanglement challenge highlights this baggage. To save HS, Lewis has to:
          1.  Radically reinterpret "locality" (configuration space - which many argue is *not* local in the intuitive spatiotemporal sense Hume would recognize).
          2.  Potentially make the BSA incredibly complex and ad-hoc to accommodate QM, undermining the "simplicity" pillar.
          3.  Essentially say "QM must fit *my metaphysical picture* or be wrong" – a move deeply *un*Humean in spirit. Hume would start from the phenomena, not the metaphysics.

  **Conclusion: Whose Side is Hume On?**

  *   **Not Lewis's Side:** Hume would not recognize Lewis's HS as *his* project. He would see it as a metaphysical edifice built on top of his epistemological skepticism, incorporating elements (modal realism, the fundamental mosaic ontology, BSA) that he would likely reject as unjustified speculation.
  *   **Not Maudlin/Armstrong's Side Either:** Hume would equally reject their claims about primitive governing laws or necessary connections between universals. He would see these as positing unobservable, unknowable metaphysical entities/relations to "explain" what is, for him, just a brute regularity.
  *   **Hume's Side: The Skeptical Empiricist Observing Brute Regularities:** Hume would be on *his own side*. He would observe the Bell violations as a fascinating, deeply puzzling, but ultimately *brute* constant conjunction. He would reject *any* metaphysical interpretation – Lewis's *or* the anti-Humeans' – that claimed to reveal the hidden necessary structure of reality. For him:
      *   The correlation is an observed fact.
      *   We have no impression of necessity connecting the measurements.
      *   We cannot justifiably infer any *mind-independent* necessary connection (local *or* non-local) exists.
      *   Our strong belief in a "connection" is just a psychological habit formed by the incredibly strong conjunction.
      *   The debate about how to *metaphysically ground* this regularity is, from his skeptical perspective, likely misguided – it ventures beyond the bounds of what we can justifiably claim to know.

  **In short: Hume would see the entire "problem of entanglement for Humean Supervenience" as a debate happening on metaphysical terrain he never inhabited. His response wouldn't be Lewis's "shrug" about QM, but a deeper skeptical shrug about the entire metaphysical project of trying to ground laws of nature in *either* a mosaic *or* primitive governing necessities. The real awkwardness for contemporary "Humeans" is that their sophisticated metaphysical system, built to answer questions Hume wouldn't have asked in the same way, finds itself struggling against modern physics, while Hume's core epistemological skepticism remains remarkably resilient in the face of it.** Your instinct about the "unHumean baggage" is spot on – it's the key to understanding why Hume himself wouldn't feel bound by the terms of this debate.
