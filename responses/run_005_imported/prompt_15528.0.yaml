  So whose approach holds up? Neither universally. The user's parents' method *can* build low-stakes competence if done meticulously (emphasis on *if*). Their friend's method *can* avoid early risks but demands extra coaching before college—not just "don't drink" but "here's how to handle peer pressure." 

  The real answer might be in the follow-up: What do both families do *besides* the alcohol rule? Open conversations? Modeling moderation? Teaching refusal skills? That scaffolding matters more than the first-sip timing. 

