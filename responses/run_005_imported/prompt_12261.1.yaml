prompt: |-
  Ok so I just spent like an hour and a half arguing with my friend about the veil of ignorance and neither of us backed down. He thinks the whole original position setup is basically rigged from the start to spit out the difference principle, and I think theres more to it than that but couldn't fully articulate why. Anyway — I host a small philosophy podcast and next week's guest is a political philosopher who's spent her career defending Rawl's original-position argument for the difference principle, so help me turn this into something useful. Can you draft around 8 interview questions that don't just let her re-explain the theory? I want at least one question on Harsanyi's old objection that expected-utility maximizers behind the veil should land on average utilitarianism instead of maximin, one on that circularity worry my friend raised (that the setup's specs are chosen precisely to guarantee the result Rawls already wanted), and one on G.A. Cohen's incentives argument -- that if the talented were genuinely committed to justice they wouldn't need bonuses to be productive, so the usual incentive-based defense of inequality is kind of hollow. For each of those three, add a quick follow-up keyed to whatever answer or dodge she'd most likely give first.
