answer: |-
  Here’s a toast that threads the needle—honoring your debate, celebrating Priya and Daniel, and keeping both legal eagles and loved ones smiling. (Clockwise: ~5 mins, heart-first):

  ---

  **(Clink glass gently)**  
  "Friends, family, colleagues… and for those who aren’t drafting opinions by day, welcome to what we in the legal world call *res ipsa loquitur*—the thing speaks for itself. Tonight, it speaks of love.  

  Two nights ago, at the rehearsal dinner, Priya and I had a… spirited discussion. *(Wink at Priya)*. She found a typo in her vows—a tiny, unassuming typo. And Priya, brilliant clerk to a renowned textualist judge, did what any principled jurist would do: she invoked the sacred ‘scrivener’s error’ exception. A narrow, purpose-driven escape hatch! *(Feigned gasp, knowing laughter from law friends)*.  

  I, of course, argued this proved my point: that even the staunchest textualist, deep down, knows purpose matters. That sometimes, you look past the letter to honor the spirit. Priya, ever steadfast, never conceded. *(Raise glass to her)*. To your unwavering commitment to the text!  

  But here’s the thing—**(shift tone, warmer, inclusive)**—this isn’t really about statutory interpretation. It’s about **Priya and Daniel**. Because their love story? It’s the perfect rebuttal to *both* our arguments.  

  **(Turn to the couple)**  
  Priya, you look for precision. You read every line, every clause, every comma. You want the document—the vows, the marriage—to *say what it means*.  
  Daniel, you see the bigger picture. You understand the *why* behind the words—the purpose that gives them life.  
  **(Pause, smile)**  
  And together? You’re the living proof that these aren’t opposing doctrines. They’re partners. Like you.  

  That typo in the vows? Irrelevant. Because the **purpose** of your vows—the unshakable commitment, the laughter, the ‘for better or worse’—was always crystal clear. And the **text**? Well, look at them now. **(Gesture to them holding hands)**. The text is radiant. It’s flawless. It’s *literally* binding.  

  **(Lean in, quieter, intimate)**  
  You two have built something beautiful not by choosing one theory over the other, but by embodying the best of both:  
  *   You draft your life together with care for every word—every promise made, every errand run, every ‘I love you’ text. *(Textualism!)*  
  *   But you also navigate life with profound grace for the spirit behind it—the missed comma in a hectic week, the unspoken understanding, the shared dream that no single sentence could capture. *(Purposivism!)*  

  **(Raise glass higher, voice lifts)**  
  So, to Priya and Daniel:  
  *   May your marriage be a masterpiece of careful drafting *and* boundless purpose.  
  *   May your ‘scrivener’s errors’ be few, but when they come, may you correct them with the same humor, grace, and relentless love you showed debating one at dinner.  
  *   And may every single day be a living, breathing testament to the truth that the strictest textualist and the most ardent purposivist must both concede: **Love isn’t just found in the words or the intent. It’s the entire statute. It’s the binding precedent. It’s the highest law.**  

  So let’s raise our glasses—not to doctrines, but to devotion. Not to theories, but to *them*.  
  To Priya and Daniel: May your union be as enduring, as joyful, and as beautifully argued as your love deserves. Cheers!"  

  ---

  **Why this works:**  
  1.  **The Joke Lands (Twice):** Legal friends get the nuanced nod to the debate (scrivener's error, textualism/purposivism clash). Non-legal folks hear a funny story about a typo and a stubborn argument – relatable!  
  2.  **No Strawmen:** Priya's textualism is "principled" and "steadfast." Purposivism is about the "spirit" and "bigger picture." Both are framed as valid, intelligent perspectives. The resolution elevates *both* by showing their synergy in love.  
  3.  **Heart is Paramount:** The legal debate is the *setup*, not the point. The pivot ("But here’s the thing...") firmly centers Priya and Daniel. The metaphors (drafting life, binding text, entire statute) serve the romance.  
  4.  **Daniel is Included:** He's positioned as the purposive counterbalance to Priya's textualism, making him integral to the joke *and* the love story.  
  5.  **Universal & Specific:** "Careful drafting" = everyday attentiveness. "Boundless purpose" = shared dreams. Relatives see love; clerks see doctrine harmonized.  
  6.  **Warm Closing:** Ends purely on love as the ultimate law, silencing the debate in the best way possible.  

  **Deliver it with:** A twinkle in your eye during the debate part, genuine warmth during the tributes, and full sincerity for the final lines. Priya will appreciate the doctrinal respect, Daniel the balance, and everyone the love. Break a leg (but not any statutes)!
