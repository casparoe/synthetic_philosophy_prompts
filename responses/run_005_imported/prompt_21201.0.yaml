answer: |-
  ## Eulogy for Diane

  **(Standing at the podium, take a breath, look out at the gathering)**

  Good morning. Thank you all for coming to honor Diane – my mother, your friend, your colleague, your family. For over thirty years, she stood in courtrooms, a fierce advocate for those society often forgets. For ten years, she gathered people right here in this library on Thursday nights, wrestling with big questions. And for my whole life, she was the steady, questioning presence at our dinner table.

  Three weeks ago, we lost her. And she left us with a request, born from an idea that truly captured her mind and heart for the last twenty years of her life.

  **(Transition gently)**

  Sometime in her late fifties, Mom encountered an essay by a philosopher named Galen Strawson. It centered on what he called the “Basic Argument.” Now, I’m not a philosopher, and Mom would be the first to gently correct me if I fumbled the finer points, but the core of it became a compass for her. She’d explain it like this over countless dinners:

  True, ultimate responsibility for our actions, she believed, would require us to be responsible for *who we are* – the person making the choices. Because it’s the person we *are* that decides what we *do*. But how can we be responsible for who we fundamentally *are*? Did we choose our core nature? Our initial temperament? The circumstances that shaped our earliest understanding? If we somehow *did* make a choice to change ourselves, what led us to make *that* choice? It was the person we already *were* before that decision. The chain of responsibility, she felt, always reaches back beyond any point where we truly started it.

  **(Crucial Distinction - Address both sides of the room)**

  **Now, here’s what Mom was absolutely adamant about, and what she asked specifically *not* to be blurred today:**

  1.  **She did NOT believe this meant we are powerless puppets of fate.** She didn’t need the universe to be strictly predetermined for this argument to hold. As she loved to put it: *"Tossing some randomness into the chain doesn't hand you authorship of yourself. It just turns the last unearned step from a domino into a coin flip."* Chance, she argued, doesn’t bestow ultimate responsibility either. It doesn’t make you the *author* of your self.

  2.  **What she DID believe**, deeply and consistently, was that because of this – because we don't author our fundamental starting point or the complex web of influences that shape us – **nobody ultimately *deserves* ultimate credit or blame for the person they become.** Not the men and women she dedicated her career to defending. And not herself.

  **(Connect philosophy to her life)**

  **This wasn't a cold, abstract theory for Mom. It was the bedrock of her profound empathy and her relentless drive.** If people don't *ultimately* deserve blame for the circumstances and influences that forged them, how could she stand in judgment? It fueled her compassion in that courtroom. It allowed her to see the human being beneath the charge sheet, not as an inherently "evil" person deserving only punishment, but as someone shaped by forces largely beyond their ultimate control.

  **And crucially, this belief never led her to resignation.** She never thought, "Well, nothing matters then." Quite the opposite. Knowing we don't *deserve* ultimate credit didn't diminish the value of striving. It freed her from the trap of ego. She saw the immense value in *trying* to become better, in working to understand ourselves, in asking others to do the same. The effort itself mattered deeply, precisely *because* the outcome wasn't some personal trophy of "self-creation."

  **(Honor her request explicitly)**

  **So, Mom specifically asked that today, we honor her belief.** She asked that we **not** stand here and say she "earned" the remarkable woman she was through sheer self-will. She asked that we **not** frame her journey, especially her hard-won strength emerging from a difficult upbringing, as something she solely "overcame" through personal authorship.

  **Equally, she asked that we not simplify this into saying she thought "it was all fated" or that she "couldn’t have done otherwise."** That misses her point entirely. She *did* do otherwise, constantly. She chose the hard path of public defense. She chose to run that discussion group for a decade. She chose to grapple with these ideas night after night. She chose to show up, to care, to fight, to love. She believed fiercely in the *reality* of choice and effort in the moment.

  **Her point was about the *source*, not the existence, of action.** She acted, she chose, she changed – but she saw the roots of her *capacity* to act and choose and change stretching back into a past she didn't design or choose. And therefore, she felt, the concepts of ultimate "credit" or "blame" simply don't land on a person.

  **(Conclude with warmth and reflection)**

  **Mom lived this.** She lived with a rare combination of fierce conviction and profound humility. She fought for people not because they *deserved* it in some cosmic sense, but because they were human, shaped like all of us. She pushed herself and others towards growth, not for a trophy of self-authorship, but because growth itself is worthwhile. She embraced complexity, refusing the easy answers of either total self-creation or total fate.

  **So today, let’s honor Diane** – not as the ultimate author of her own story, but as the extraordinary, compassionate, fiercely intelligent, and deeply thoughtful person she *was*. Let’s honor her choices, her efforts, her unwavering commitment to justice and understanding. Let’s honor her decades of service, her decade of discussion, her lifetime of love. Let’s honor the profound impact she had on all of us in this room, an impact that flowed naturally from who she was and how she chose to live, moment by moment, within the complex tapestry of a life not entirely of her own making, but lived with incredible purpose and grace.

  **She asked us to see clearly, to avoid easy narratives, and to embrace the effort without claiming the ultimate crown. That was her truth. And in honoring that request, we honor her.**

  Thank you.

  **(Step back slightly, pause, nod)**
