prompt: |-
  I mostly cover science for a magazine, but I get the occasional idea-driven feature too, and next week's is a big one: I'm sitting down with a legal philosopher who's built her whole career defending a beefed-up version of Lon Fuller's "inner morality of law" -- the claim that law isn't just whatever a sovereign or a Hart-style rule of recognition says it is, but has to satisfy a cluster of built-in procedural virtues (generality, publicity, non-retroactivity, clarity, non-contradiction, not demanding the impossible, staying reasonably stable, and having officials actually apply the rules as declared) before it counts as law at all, and that a regime rotten enough will flunk that test and simply fail to be a legal system rather than merely be an unjust one. I did a semester of jurisprudence a hundred years ago and reread the original Hart-Fuller exchange this week, but I still feel like all the obvious questions are ones shes answered in every seminar room for the last decade.

  Could you draft me 8-10 interview questions that actually get into the mechanics of the view instead of just inviting a restatement of it? I want at least one question that presses on the grudge informer case specifically -- whether the wickedness of the Nazi-era denunciation statutes is really best explained as a failure of Fuller's procedural desiderata, given how orderly, in the relevant technical sense, a lot of that machinery apparently was -- one that raises Hart's old rebuttal that the skills needed to be an efficient poisoner don't make poisoning a moral enterprise, and one that tests the view against a regime that's substantively awful but close to procedurally spotless (apartheid-era statutes, say), to see whether she has to bite a bullet or quietly retreat into something that just sounds like positivism with extra steps. For each question, throw in a short note on the answer she'll probably reach for, plus a sharper follow up keyed to that likely dodge -- I don't want to just nod along if she says something like "well, congruence is really doing the work in that case," I want the next question already loaded.
