answer: |-
  Here are 8 interview questions designed to probe the *mechanics* of your subject's "beefed-up" Fullerian view, complete with predicted answers and sharp follow-ups targeting potential evasions:

  1.  **Question:** "Your strengthened Fullerian view claims a regime failing the procedural virtues *fails to be law*. Could you walk me through the specific *threshold* or *failure condition*? Is it failing *any one* desideratum catastrophically? Or accumulating failures across several? For instance, how many contradictions or secret laws tip a system over from 'unjust law' to 'not law'?"
      *   **Likely Answer:** She'll likely emphasize the interconnectedness ("web-like" nature) and argue it's about *systemic* failure, not a single flaw. Congruence (officials applying rules as declared) is often the lynchpin.
      *   **Follow-Up:** "So, if a regime consistently publishes clear, prospective, non-contradictory rules demanding the possible, but officials *routinely* ignore them *in ways known to the sovereign* (e.g., a dictator's whim), does the entire system collapse as 'not law'? Or are those specific ignored rules 'not law', while the published code remains law? How does your view handle this *partial* breakdown?"

  2.  **Question (Grudge Informer - Procedural Order):** "Focusing on the Nazi 'grudge informer' statutes: Historians note many denunciation laws were published, prospective, relatively clear, and applied as written by Nazi courts – meeting Fuller's formal criteria. Yet, you argue this system flunked the 'inner morality'. *Which specific desideratum(s) failed* and *how* did that failure negate the *legal character* of those specific statutes, given their apparent procedural order?"
      *   **Likely Answer:** She'll likely target **Congruence** (officials applying rules as declared), arguing Nazi justice was fundamentally arbitrary or that the broader context (terror, racial ideology) meant rules weren't *genuinely* applied as declared, or perhaps **Generality** (targeting specific groups inherently).
      *   **Follow-Up:** "But the Nazi courts meticulously applied *these specific denunciation statutes* as written. If we isolate *this specific rule* demanding denunciation of enemies of the state, published clearly, applied prospectively and consistently *by the courts*... where's the *procedural* failure making it 'not law'? Isn't the core evil *substantive*? Does your view risk minimizing the horror by framing it *only* as a procedural glitch?"

  3.  **Question (Hart's Poisoner Rebuttal):** "Hart famously countered Fuller by comparing the procedural skills needed for effective law-making to those of a poisoner: efficiency doesn't imply morality. How does your beefed-up view *substantively* differentiate the 'inner morality' from mere *technical efficacy*? What makes Fuller's virtues *moral* constraints rather than just pragmatic tips for rulers wanting stable control?"
      *   **Likely Answer:** She'll argue the virtues embody a form of *reciprocity* and *respect for agency* – clarity, publicity, non-retroactivity allow citizens to guide their conduct, making law a collaborative enterprise, not just top-down force. Poisoning lacks this reciprocal structure.
      *   **Follow-Up:** "Couldn't a regime use these 'virtues' precisely *for* stable control and efficient oppression? Apartheid South Africa needed clear, stable rules to enforce segregation effectively. If the virtues *can* serve deeply immoral ends just as effectively as moral ones, in what robust sense are they genuinely *moral* constraints intrinsic to law itself?"

  4.  **Question (Procedurally Spotless Evil - Apartheid):** "Consider Apartheid South Africa. Many of its core statutes (e.g., Population Registration Act, Group Areas Act) were arguably prospective, published, clear (in their intent), relatively stable for periods, non-contradictory (within their own framework), possible to obey (physically), and applied by officials as written. If a regime meticulously satisfies all eight procedural virtues but uses them to enforce a substantively abhorrent system like apartheid, does your view *still* classify its core statutes as genuine 'law'?"
      *   **Likely Answer:** She'll likely argue Apartheid *did* fail the procedural tests, probably pointing to **Congruence** (massive police brutality/murder exceeding statutes), **Publicity** (secret interpretations/practices), **Constancy** (frequent, unpredictable amendments), or **Generality** (inherently targeting specific groups).
      *   **Follow-Up:** "Isn't this a retreat? If *every* substantively vile regime we examine retrospectively gets diagnosed with *some* procedural flaw (secret police actions, biased courts, unstable rules), doesn't that make your view unfalsifiable? Could a regime *truly* satisfy all eight virtues perfectly *while* being substantively evil? If not, doesn't that functionally reduce your 'inner morality' to a *consequence* of substantive aims, not an independent constraint?"

  5.  **Question (The Role of Congruence):** "Congruence – officials applying rules as declared – seems uniquely vulnerable to manipulation in your framework. A regime could publish lovely rules but have officials systematically ignore them. Does Congruence act as a 'master virtue'? Can a system with perfect scores on the other seven but catastrophic Congruence failure *ever* be a legal system? Conversely, can strong Congruence *redeem* minor failures elsewhere?"
      *   **Likely Answer:** She'll emphasize Congruence's centrality – it's where the rubber meets the road. Systemic Congruence failure likely dooms the system. Minor failures elsewhere *might* be survivable *if* Congruence holds strong.
      *   **Follow-Up:** "Doesn't this make the 'inner morality' hostage to *official behavior* rather than the *rules themselves*? If a sovereign publishes perfect rules but secretly orders officials to ignore them, are the published rules still 'law'? If not, how does your view differ from a crude sociological view that 'law is what officials do'?"

  6.  **Question (Non-Retroactivity & Transitional Justice):** "Your view suggests retroactive punishment is a fundamental failure making a rule 'not law'. How does this handle *transitional justice*? When a new democracy prosecutes officials of a prior oppressive regime for acts *legal under that prior regime* (e.g., East German border guards), is the new law retroactive? If so, does your view imply this prosecution itself relies on 'non-law', or is there a way to reconcile this within the inner morality?"
      *   **Likely Answer:** She'll argue the *prior regime's* rules likely weren't valid law (lacked inner morality), so there was no *true* retroactive criminalization. The acts were always morally wrong, just not properly prohibited by *real* law.
      *   **Follow-Up:** "But the border guards acted *precisely* as their (published, prospective, clear) orders demanded. If the prior regime *did* satisfy Fuller's criteria on paper for *those specific rules* (clarity, publicity, non-retroactivity for *their* subjects), how does declaring them 'not law' retroactively *not* itself violate the principle of non-retroactivity applied to the *new* legal system? Isn't this using the inner morality as a substantive moral bludgeon?"

  7.  **Question (The 'Ought' Implied by 'Is'):** "Hart argued Fuller conflated two senses of 'morality': efficacy conditions for a functional system (like a poisoner needing skill) and substantive justice. Your view claims these procedural virtues *necessarily* carry a moral 'ought'. Can you unpack the *logical leap* from 'a system must have X, Y, Z features to *be* effective law' to 'a system *ought* to have X, Y, Z features because they are *morally good*'? Where does the *moral obligation* enter?"
      *   **Likely Answer:** She'll likely argue the virtues *inherently* respect human dignity and agency by enabling autonomous planning and minimizing arbitrariness. The 'ought' stems from the demands of treating citizens as responsible agents.
      *   **Follow-Up:** "Is this respect for agency *contingent*? Couldn't a ruler argue that for subjects deemed 'unfit' for autonomy (by the ruler's substantive morality), these virtues *don't* generate an obligation? Doesn't the 'ought' here ultimately depend on a *prior, substantive* moral commitment to individual agency that Fuller's view purports to derive *from* the form of law?"

  8.  **Question (Edge Case: The 'Benevolent Dictator'):** "Imagine a singularly wise, benevolent dictator. She issues only clear, public, prospective, non-contradictory, possible, stable rules promoting flourishing. Officials apply them faithfully (Congruence). However, there's *no* secondary rule of recognition beyond her will; no legislature or courts independent of her. Does this system satisfy your beefed-up inner morality? Is it 'law'? Or does the *source* (pure sovereign command without institutional structure) negate it?"
      *   **Likely Answer:** This is tricky. She might argue it *technically* satisfies the 8 virtues but lacks the *institutional reciprocity* or *possibility of challenge* implied by a fuller (pun intended) conception of law, suggesting her view might indeed require more than just the 8 points.
      *   **Follow-Up:** "Doesn't this reveal that the 'inner morality' *alone* might be insufficient to guarantee what we intuitively call law? If you need to add institutional constraints *beyond* Fuller's list to exclude the benevolent dictator, doesn't that move your view closer to incorporating elements of Hartian secondary rules or even substantive democracy, blurring the line with natural law or sophisticated positivism?"

  **Key Interview Strategy:**

  *   **Listen for Dodges:** Pay close attention if she:
      *   **Shifts to Substance:** "But that regime was substantively evil!" (Press: "We agree, but does your *procedural* test condemn it?")
      *   **Invokes Vagueness:** "It's a complex web, not a checklist!" (Press: "But surely there are *clear cases* of failure? Walk me through one.")
      *   **Over-Relies on Congruence:** "Ah, but officials didn't *really* apply the rules!" (Press: "Based on what *procedural* evidence *within the system* itself?")
      *   **Retreats to "Not *Good* Law":** "Well, it wasn't *fully* realized law..." (Press: "But does it meet the *minimum threshold* for being law *at all* on your view?")
  *   **Control Definitions:** Gently insist on using *her* definitions of the 8 virtues consistently. Don't let her redefine them on the fly for hard cases.
  *   **Demand Specifics:** Constantly ask: "Which *specific* desideratum failed?", "How *exactly* does that failure negate legality?", "Show me the *mechanics*."

  These questions force engagement with the *operational logic* and *boundary conditions* of her view, moving beyond mere exposition into critical testing, exactly as you requested. Good luck!
