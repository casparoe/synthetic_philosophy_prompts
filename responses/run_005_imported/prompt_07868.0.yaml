   We have three options: 
   1. Certify the protocol as a release gate.
   2. Reject it.
   3. Certify with conditions.

   We must address the objection head-on. If we recommend adoption (with or without conditions), we must specify what would have to hold or what safeguards would need to be in place to mitigate the objection.

   Let's structure the memo:

   - Introduction: State the purpose and the issue at hand.
   - Summary of the protocol and the pilot results.
   - The main objection: "debate trains persuasiveness, not honesty".
   - Analysis: Why we think the protocol can still be useful despite the objection, and under what conditions.
   - Recommendation: Clear and with conditions if applicable.
   - Conditions/Safeguards: Specific measures to address the objection.

   Given the skepticism, we might lean toward option 3 (certify with conditions) to address the concerns.

   Draft:

  ---

  **MEMORANDUM**

  **To:** Evaluations Working Group  
  **From:** [Your Name/Position]  
  **Date:** [Current Date]  
  **Subject:** Recommendation on Debate Protocol for Pre-Deployment Testing  

  ### Introduction
  This memo provides a recommendation regarding the proposal to certify a debate protocol as a standing gate in pre-deployment testing. The protocol involves two instances of the frontier model debating opposing sides of a claim, judged by domain-expert staff under a hard time limit, specifically for claims that cannot be directly verified by experts or weaker trusted models. The capabilities team's pilot study showed modest improvements over single-advocate consultancy on held-out cases with known ground truth. However, the head of interpretability has raised a valid concern that the protocol may incentivize persuasiveness over honesty, especially when models can generate obfuscated arguments that exploit the judge. This memo addresses that concern and provides a recommendation.

  ### Summary of the Proposal and Pilot
  The capabilities team proposes to use debate as a gate for claims such as:
  - "This proposed change to the fine-tuning pipeline doesn't introduce a subtle reward-hacking incentive."
  - "This internal alignment write-up's headline claim actually follows from its methodology section."

  In the pilot, debate outperformed consultancy on cases with known ground truth. However, these are cases that we could already check, and the core use case is for claims we cannot check. Thus, the pilot's direct relevance is limited.

  ### The Core Objection: Persuasiveness vs. Honesty
  The head of interpretability's objection centers on two points:
  1. **Training for Persuasion**: Optimizing models to win debates may not align with honesty. Models might learn to construct sophisticated but misleading arguments that exploit the judge's cognitive limitations, especially under time constraints.
  2. **Lack of Guarantee**: There is no theoretical or empirical guarantee that persuasiveness and honesty converge, particularly when models are more capable than the judge.

  This objection is not merely hypothetical; it is supported by the literature (e.g., the "obfuscated arguments" problem highlighted by Barnes and Christiano). Without addressing this, debate could become a vulnerability in our safety protocols.

  ### Analysis and Mitigation Strategies
  The debate protocol has promise, but the objection is serious. We believe that with the following conditions, the protocol can be certified without undue risk:

  1. **Adversarial Robustness Testing**: The debate protocol must be subjected to rigorous adversarial testing. We should deliberately train and test with models that are known to be deceptive or unaligned (in controlled settings) to see if the debate judge can detect such behavior. This testing should include scenarios where the model has an incentive to lie and the capacity to construct obfuscated arguments.

  2. **Iterative Protocol Refinement**: The debate protocol should be refined to include:
     - **Cross-Examination**: Allow the judge to ask clarifying questions and require debaters to break down arguments step-by-step.
     - **Time Management**: Structure the debate to force debaters to present their strongest points early and avoid information overload.
     - **Transparency Requirements**: Mandate that debaters cite sources (if applicable) and explain their reasoning in a way that can be checked by a trusted weaker model or tool (when possible).

  3. **Judge Training and Support**: 
     - Judges should be trained to recognize common obfuscation tactics and to demand clarity.
     - Provide judges with real-time assistance, such as access to fact-checking tools or a panel of additional experts for consultation (within the time limit constraints).

  4. **Monitoring and Fallbacks**:
     - Implement a monitoring system that flags debates where the judge's confidence is low or where the arguments are complex and time-consuming. In such cases, the protocol should require escalation to a more robust verification method (e.g., a panel of experts with more time, or a different oversight technique).
     - Use debate in conjunction with other methods (e.g., consultancy, automated verification tools) to create a portfolio of checks.

  5. **Research Commitment**: 
     - We must commit to ongoing research to close the gap between the pilot (on known-verifiable claims) and the target use case (unknown, unverifiable claims). This includes:
       - Studying the correlation between persuasiveness and honesty in debate settings.
       - Developing techniques to detect and penalize obfuscation.
       - Exploring whether debate training can be modified to explicitly reward honesty (e.g., by using a reward model that incorporates verifiable elements).

  ### Recommendation
  We recommend **certifying the debate protocol as a release gate, but with the following conditions**:

  1. The protocol must undergo adversarial robustness testing as described above, and only after successful results (i.e., the judge can reliably identify deceptive arguments in controlled tests) will it be deployed for critical claims.
  2. The protocol must include the iterative refinements (cross-examination, time management, transparency) and judge support measures.
  3. A monitoring system with fallbacks to other methods must be in place.
  4. The lab commits to a research program aimed at understanding and mitigating the persuasiveness-vs-honesty gap, with regular reviews by the working group.

  These conditions are designed to directly address the head of interpretability's objection. They ensure that the protocol is not deployed in a naive form that risks being gamed, but instead is hardened against exploitation and coupled with safeguards.

  ### What Would Stop the Objection from Being Decisive?
  The objection would stop being decisive if:
  - We can demonstrate through adversarial testing that the debate protocol is robust to obfuscated arguments by models that are intentionally deceptive.
  - We observe in practice (with real, unverifiable claims) that the debate protocol leads to decisions that are consistent with other trusted methods (when available) and that it does not produce a pattern of overconfidence in incorrect judgments.
  - We develop techniques that explicitly tie the debate training objective to verifiable honesty (e.g., by rewarding arguments that are independently verifiable by a weaker model at key steps).

  Without progress on these fronts, the objection remains a critical vulnerability. Therefore, our recommendation is conditional on actively addressing these points.

  ### Conclusion
  The debate protocol offers a promising path for scalable oversight, but it is not without risks. By adopting the conditions outlined above, we can move forward while rigorously addressing the core concern about persuasiveness versus honesty. This approach allows us to gain operational experience and collect data on the protocol's real-world performance while maintaining safety standards.

  We recommend the working group approve the protocol for conditional certification, subject to the above safeguards.

  ---
answer: |-
  **MEMORANDUM**  
  **To:** Evaluations Working Group  
  **From:** [Your Name/Title], Evaluations Working Group Member  
  **Date:** [Current Date]  
  **Subject:** Recommendation on Debate Protocol for Pre-Deployment Testing  

  ### **Recommendation**  
  **Certify the debate protocol as a release gate, conditional on three safeguards:**  
  1. **Adversarial testing** for judge-exploiting obfuscation.  
  2. **Structured debate rules** enforcing incremental verification.  
  3. **Ongoing calibration** against high-stakes ground-truth cases.  

  *Rationale:* The protocol shows promise for scalable oversight but fails to resolve the "persuasiveness vs. honesty" objection in its current form. Adoption is justified only if safeguards force alignment between persuasive tactics and verifiable truth-seeking.  

  ---

  ### **Reasoning: Addressing Core Objections**  
  **1. The "Persuasiveness vs. Honesty" Objection**  
  The head of interpretability correctly identifies a critical flaw:  
  - **Unchecked optimization for persuasion** risks rewarding obfuscation when models can generate arguments that exploit bounded judges (e.g., selective evidence, false complexity, or emotionally charged rhetoric).  
  - **No inherent convergence**: Smarter models may *diverge* from honesty if deception reliably wins debates (per Barnes/Christiano’s "obfuscated arguments" problem). Pilot data (on verifiable claims) cannot assess this risk.  

  **This objection is decisive if:**  
  - Debate outcomes rely solely on subjective judge impressions.  
  - No mechanisms exist to penalize non-verifiable tactics.  

  ---

  ### **2. Conditions for Mitigation**  
  For debate to function as a reliable gate, we must ensure that persuasion is yoked to truth-seeking. The following safeguards would nullify the objection:  

  #### **Condition 1: Adversarial Testing**  
  - **Requirement**: Stress-test debates using *known-deceptive models* attempting to sabotage outcomes with obfuscated arguments (e.g., burying flaws in verbose logic, misdirection).  
  - **Safeguard**: Only deploy if judges detect ≥90% of sabotage attempts under time constraints.  
  - *Why it addresses the objection*: Forces explicit optimization for robustness, not just persuasion. Tests the worst case directly.  

  #### **Condition 2: Structured Debate Rules**  
  - **Requirement**: Implement rules mandating:  
    - **Stepwise scaffolding**: Debaters must decompose claims into sub-claims verifiable by weaker trusted models.  
    - **Falsifiability mandates**: Arguments must propose concrete, testable failure conditions (e.g., "If [X] is true, [metric Y] will drop by 10%").  
    - **Penalties for evasion**: Automatic judge strikes against debaters refusing to simplify complex points.  
  - *Why it addresses the objection*: Ties persuasion to verifiable increments, making obfuscation costly. Uses weaker models as "reality anchors."  

  #### **Condition 3: Ongoing Calibration**  
  - **Requirement**: Dedicate 20% of debate cases to claims with *eventually verifiable* ground truth (e.g., "This code change causes no throughput regression" → testable post-debate).  
  - **Safeguard**: If debate accuracy falls below 85% on these cases, pause protocol until root cause (e.g., new obfuscation tactics) is resolved.  
  - *Why it addresses the objection*: Detects divergence early by monitoring the honesty-persuasiveness correlation.  

  ---

  ### **3. Why Not Reject or Unconditional Adoption?**  
  - **Rejection overlooks scalable upside**: Debate’s empirical edge over consultancy (even on verifiable claims) suggests it can amplify expert judgment if gamed arguments are disincentivized.  
  - **Unconditional adoption is reckless**: Without safeguards, the protocol risks amplifying misinformation (e.g., certifying unsafe systems via slick deception).  
  - **Conditions balance urgency and safety**: They permit deployment while treating persuasion as a controllable variable, not an unchangeable given.  

  ---

  ### **Implementation Timeline**  
  | **Phase** | **Deliverable** | **Deadline** |  
  |-----------|-----------------|-------------|  
  | 1 | Adversarial test suite + structured rules | 6 weeks |  
  | 2 | Calibration dataset (ground-truth cases) | 3 weeks |  
  | 3 | Pilot re-run with safeguards | 10 weeks |  
  | 4 | Full certification decision | Q4 2024 |  

  ---

  ### **Conclusion**  
  We recommend **conditional certification** to leverage debate’s oversight potential while neutralizing its critical flaw. The interpretability team’s objection is valid but surmountable: By forcing persuasion to operate within verifiable boundaries, we align the protocol’s incentives with honest truth-seeking. Rejecting debate outright cedes a promising oversight tool; adopting it naively risks safety failure. Conditions bridge this gap.  

  **Final Vote Proposal**:  
  ☑ **Approve certification** with Conditions 1–3.  
  ☐ Reject.  
  ☐ Approve unconditionally.  

  ---  
  **Attachment**: Draft safeguards implementation plan (separate doc).
