answer: |-
  Here's a dialogue between **Avery (Textualist)** and **Ben (Purposivist)** debating the absurdity doctrine using the contentious case of *Green v. Bock Laundry Machine Co.* (1989), where the Supreme Court grappled with Federal Rule of Evidence 609(a)(1). The rule *literally* required courts to admit a *plaintiff’s* prior convictions for impeachment (even if prejudicial) but *protected defendants* from the same treatment. The result? Plaintiffs could be impeached with past crimes, but defendants could not—an asymmetry critics called absurd.

  **Setting:** Law library study carrels, late evening.  
  *(Avery slams a law journal shut, exasperated. Ben looks up from his notes.)*  

  **Avery:** Ben, I’m telling you, *Green v. Bock* is the perfect example of textualism working. The rule *clearly* said: "For the purpose of attacking the credibility of a witness... evidence that a witness *other than an accused* has been convicted of a crime shall be admitted... if the crime involved dishonesty." The accused—*the defendant*—gets protection. The plaintiff? Tough luck.  

  **Ben:** And that’s why Scalia wrote the majority opinion *admitting* the plaintiff’s prior conviction? Because the text was "clear"? Avery, that outcome was *nuts*. It meant a plaintiff suing for defamation could be grilled about a 20-year-old fraud conviction, but the defendant—who might’ve committed perjury on the stand—was shielded. That’s not justice; it’s a drafting error.  

  **Avery:** It’s not about "justice." It’s about what Congress *enacted*. Rule 609(a)(1) drew a bright line: defendants ("the accused") get special protection. Plaintiffs don’t. Maybe Congress wanted to discourage meritless suits by letting defendants impeach shady plaintiffs. Maybe it was a compromise. Who are we to override that?  

  **Ben:** Because the text *as written* leads to an absurdity Congress *never intended*. The Advisory Committee’s notes explicitly said Rule 609 aimed to *protect defendants* from unfair prejudice. The whole point was to *balance* impeaching witnesses against prejudicing the accused. Your reading turns it into a weapon *against* plaintiffs. That’s not a "policy choice"—it’s a scrivener’s error!  

  **Avery:** Ah, the "intent" rabbit hole. How do you *know* it’s an error? The rule differentiated "the accused" from "a witness" for a reason. Look at 609(a)(2): it treated *all* witnesses equally for crimes of dishonesty. The asymmetry in (a)(1) was deliberate! Congress might’ve thought defendants deserve *extra* shielding because liberty’s at stake. Plaintiffs only risk money.  

  **Ben:** Liberty? In a *civil trial*? Avery, the defendant in *Green* was a corporation! Bock Laundry wasn’t facing jail. And the legislative history shows the drafters *meant* to apply the same balancing test to *all* witnesses—they just botched the phrasing. Even Scalia invoked the absurdity doctrine here! He admitted the plaintiff’s conviction but rewrote the rule to apply the balancing test to everyone. Hypocrisy!  

  **Avery:** Not hypocrisy—*principle*. Scalia fixed a *demonstrable scrivener’s error*. The text accidentally omitted "balancing test" language for non-defendants. But he didn’t appeal to "intent." He looked at the *structure*: Rule 403 (general prejudice rule) still applied, and 609(a)(2)’s symmetry implied (a)(1) was flawed. Textualism allows fixing typos—not redrafting laws you dislike.  

  **Ben:** Oh, come on. How is "look at structure" not purposivism? You’re inferring what the drafters *meant to say* based on context. That’s *exactly* my argument! The difference is you’ll only do it when the outcome is "absurd" by *your* standard. Who defines absurdity? In *Bock*, five justices saw it; four didn’t. It’s subjective!  

  **Avery:** It’s objective when the text creates an outcome *logically incompatible* with the statute’s operation. Here: Rule 609’s *title* was "Impeachment by Evidence of Conviction." Its purpose was fair impeachment—not "help defendants at all costs." Letting plaintiffs be impeached indiscriminately while shielding defendants *undermined* that goal. That’s not "subjectivity"—it’s textual incoherence.  

  **Ben:** But "incoherence" implies you’ve already decided the *purpose*. If Congress truly wanted to tilt trials toward defendants, your "incoherence" vanishes. Textualism’s absurdity exception is just a backdoor for judges to impose their view of sensible policy when the text gets too uncomfortable. Admit it.  

  **Avery:** No. The line is strict: we only "fix" text when (1) the error is *patent* (e.g., "plaintiff" vs. "defendant" swapped), and (2) the correction is *obvious* from context. Here, the omitted "balancing test" language existed in earlier drafts and neighboring rules. We’re not inventing intent—we’re restoring *what the text itself implies*. Purposivism? You’d override text anytime legislative history hints at a "better" outcome.  

  **Ben:** And textualism overrides text when judges feel queasy! *Bock* proves my point: Scalia used "absurdity" to avoid an outcome he hated. But in *identical* linguistic ambiguities without "absurd" results, textualists stick to the words. That’s inconsistent. I’d rather admit judges weigh purpose *openly* instead of pretending words are "clear" until they’re not.  

  **Avery:** And I’d rather constrain judges to the text—even when it stings—than let them "weigh purpose" like philosophers-kings. Your way turns every statute into a Rorschach blot. The absurdity doctrine? It’s a scalpel for rare tumors. *Bock* was a tumor. But in 99% of cases, the text rules.  

  **Ben:** Until the next "absurdity" comes along—defined by nine lawyers in robes. Face it, Avery: your scalpel’s wielded subjectively. At least purposivism owns it.  
  *(Avery gathers their books, shaking their head but smiling slightly.)*  

  **Avery:** And at least textualism tries to tie those nine lawyers to the page in front of them. Even when the page has a typo. Goodnight, Ben.  

  **Ben:** Sweet dreams of scriveners, Avery.  

  **Key Tensions Explored:**  
  1. **The "Error" Threshold:** Avery insists only *obvious* errors (supported by textual context) qualify. Ben argues "obvious" is subjective and invites policy judgments.  
  2. **Defining Absurdity:** Is it "logical incoherence" (Avery) or "outcome at odds with legislative goals" (Ben)?  
  3. **Judicial Restraint vs. Flexibility:** Avery sees textualism as minimizing judicial overreach; Ben sees purposivism as honest engagement with reality.  
  4. *Green v. Bock*’s ambiguity made it ideal: The text *was* asymmetrical, but history suggested a drafting flaw—forcing both sides to defend their limits.  

  **Real-World Outcome:** Scalia’s majority in *Bock* used the absurdity doctrine to rewrite Rule 609, proving textualists *do* carve exceptions—but only when the textual evidence of error is overwhelming. Purposivists saw it as validation; textualists called it a narrow, necessary evil. The dialogue lives on.
