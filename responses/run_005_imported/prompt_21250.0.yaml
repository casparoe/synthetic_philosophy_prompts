  Algorithmic feeds like TikTok or Instagram: Rousseau would see them as flattering base instincts. The curated content creates echo chambers, which aligns with his view that art doesn't reform but panders. The addictive nature and dopamine hits would alarm him, seeing it as a new form of corruption, more pervasive than theater.

  Now, the key part: self-broadcasting on social media. Users create content, which seems like Rousseau's festivals where everyone participates. But here's the twist. Social media isn't communal in the same way. Performances are for strangers, not the community. It's about validation through likes, which introduces hierarchy based on popularity. Rousseau valued sincerity, but online personas are curated, leading to inauthenticity. He'd criticize the commodification of the self and the constant performance for external validation.

