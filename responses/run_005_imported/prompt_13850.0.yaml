answer: |-
  You've hit on one of the most profound tensions in democratic theory. While Goodin's all-affected principle *seems* elegantly decisive (especially for issues like climate policy), theorists like Näsström highlight fundamental conceptual and practical problems that prevent it from being a true "solution" to the boundary problem. The disagreement isn't just about practicality—it's about deep philosophical gaps in the principle itself. Here's why:

  1.  **The Indeterminacy Problem ("Affected by what? How much?"):**
      *   **Infinite Regress of Effects:** Almost every decision has ripple effects across space and time. A local zoning change affects property values (local), supply chains (regional/global), and environmental footprints (global/intergenerational). Where do we draw the line? Does a minor economic ripple affecting someone on another continent grant them a vote? Goodin might suggest a threshold of "significance," but *defining that threshold is itself a political decision requiring a prior demos.*
      *   **Counterfactual Uncertainty:** Determining who *is* or *will be* affected often requires predicting complex futures and comparing them to hypothetical alternatives. For climate policy, we know future generations *will* be affected, but the *specific magnitude and distribution* of effects are massively uncertain. Who exactly qualifies as "affected enough"?
      *   **The Problem of Non-Identity (for Future Generations):** Future people's very existence and identity depend *on the decisions made today*. The people who exist in a world with aggressive climate policy are *different individuals* from those who would exist without it. Can we say a specific policy "harms" or "benefits" people whose existence depends on that policy? This challenges the notion of identifiable, pre-existing "interests" being affected.

  2.  **The Circularity Problem (Who Decides Who is Affected?):**
      *   The core dilemma: **To decide *who is affected* by a decision, we need a procedure. But designing that procedure *itself requires deciding who gets to participate in designing it*.** This is the constitutive circle of democracy. Näsström and others (like Whelan) argue the all-affected principle simply pushes the boundary problem back a step without solving it. Some prior political authority (even if provisional) must define the mechanism and criteria for determining "affectedness" – begging the question of how *that* authority's boundaries were set.

  3.  **The Measurement Problem (Interests vs. Preferences):**
      *   **Identifying "Interests":** The principle relies on objectively identifying "interests." But interests are often contested, subjective, and interpreted differently by different people. Does a foreign national have an "interest" in another country's environmental policy because they care deeply about the global ecosystem (subjective preference), or only if they suffer measurable material harm (objective impact)? The principle doesn't resolve this ambiguity.
      *   **Intensity vs. Mere Effect:** It focuses on *whether* interests are affected, not the *degree* or *nature* of the effect. Should someone minimally affected have the same voting power as someone whose survival depends on the decision? The principle is silent on weighting, leading to potential injustice or impracticality.

  4.  **The Institutional Feasibility Problem (The "Global Electorate" Consequence):**
      *   While you correctly note that critics might balk at the consequence of a near-global demos, the problem goes deeper than mere reluctance. The principle, taken literally:
          *   Creates **massively overlapping and constantly shifting demoi**. Every policy decision would require a unique electorate, making stable, accountable, and efficient governance impossible.
          *   **Dilutes local self-determination.** Why should distant or minimally affected individuals have an equal say in decisions primarily impacting a specific community's way of life?
          *   **Lacks a mechanism for inclusion/exclusion.** How would this global demos actually *form* and *decide* on the boundaries for each specific decision? The principle provides no institutional answer.

  5.  **Näsström's Core Critique: The Constitutive Nature of the Demos:**
      *   Näsström (drawing on thinkers like Schmitt, Arendt, and Lefort) argues the demos isn't *discovered* through a pre-political principle like affected interests; it is **constituted through the political act itself.** A "people" emerges through shared action, struggle, debate, and the *creation* of a common political space. Boundaries are inherently political and contested, not technocratically determined by tracing causal effects.
      *   The all-affected principle attempts to *depoliticize* the boundary question by finding an objective, pre-political criterion. Näsström contends this is impossible and misunderstands the fundamentally political nature of constituting "the people." Democracy, in this view, *begins* with an act of self-authorization by a group declaring itself a demos – a necessarily exclusionary moment that the all-affected principle tries, but fails, to avoid.

  **In Conclusion:**

  You're right that Goodin's principle offers a powerful *moral intuition*: those affected should have a say. For issues like climate change, it forcefully argues for vastly more inclusive decision-making. **However, it fails as a definitive *solution* to the boundary problem because:**

  1.  **It's conceptually indeterminate:** It cannot reliably draw clear, non-arbitrary boundaries due to the infinite regress of effects, counterfactuals, and non-identity.
  2.  **It's circular:** It presupposes a mechanism to define "affectedness" that itself requires a prior demos.
  3.  **It lacks operational clarity:** It doesn't resolve how to measure interests, intensity, or thresholds.
  4.  **It ignores the political constitution of the demos:** It tries to bypass the inherently political act of self-definition by a people.

  The "unresolved puzzle" persists because the all-affected principle, while intuitively appealing and morally significant, ultimately displaces rather than resolves the core dilemma: **How does a group come to understand itself as a collective "we" entitled to make binding decisions in the first place?** Theorists like Näsström argue this is an inescapable political question without a purely logical or procedural answer, making the boundary problem a permanent feature of democratic life, not a technical glitch to be fixed. The debate continues because the principle's elegance masks deep fissures in its foundation.
