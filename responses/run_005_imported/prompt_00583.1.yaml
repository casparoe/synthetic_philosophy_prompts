answer: |-
  That's a fantastic question, digging right into the core of Hobbes's unique epistemological project. Taking his "maker's knowledge" thesis seriously, as you rightly want to do, reveals fascinating tensions and potential paths when confronting non-Euclidean geometry and formalism. Let's break it down:

  1.  **Hobbes's Core Position on Geometry (Recap):**
      *   **Construction as Essence:** Geometric certainty arises *because* we mentally construct the objects through defined motions (point -> line via translation, line -> plane via sweeping, etc.). We know them perfectly *because we make them* according to our definitions.
      *   **Rejection of Abstraction:** Definitions like Euclid's "point has no part" are inadequate for Hobbes precisely because they don't specify *how it is generated*. They are abstract, static descriptions, not operational instructions for construction.
      *   **Primacy of Motion:** Space, for Hobbes, isn't an abstract container; it's the *phantasm* generated by conceiving a body moved *beyond* the limits of our immediate perception. Motion is fundamental to his ontology and epistemology.
      *   **Axioms as Demonstrable:** Hobbes believed the Euclidean axioms *could* and *should* be derived from more fundamental principles concerning body, motion, and cause/effect – principles rooted in his materialist philosophy. They weren't arbitrary starting points.
      *   **Connection to Civil Philosophy:** The analogy is crucial. Just as the sovereign power *creates* the commonwealth through covenant and law, giving us certain knowledge of its structure and obligations, our minds *create* geometric figures through defined motions, giving us certain knowledge of their properties.

  2.  **Confronting Non-Euclidean Geometry:**
      *   **Initial Dismissal?** Hobbes's first reaction would likely be utter disbelief and rejection, similar to his reaction to Wallis. The parallel postulate seemed *obviously* true based on the construction of figures via rectilinear motion on a flat plane generated by sweeping a straight line. Denying it would seem like denying the possibility of constructing rectangles or similar triangles at different scales – constructions fundamental to his kinematic picture.
      *   **"Alternate Constructions" as a Possible Path?** *If* non-Euclidean geometries could be presented *kinematically* – as arising from *different types of generative motion* – Hobbes's framework *might* have a way to absorb them, albeit reluctantly. Imagine:
          *   **Hyperbolic Geometry:** Could this be framed as the geometry generated by moving points *constrained to a surface of constant negative curvature* (like a saddle)? The "lines" would be geodesics on that surface, generated by the "shortest path" motion constrained by the surface's form. The motion is different, the resulting "plane" is different, so the properties (like angle sums) are different. This *could* fit the maker's knowledge mold: we define the motion and surface constraint, we generate the figures, and thus know their properties with certainty *within that constructed system*.
          *   **Elliptic Geometry:** Similarly, motion constrained to a positively curved surface (like a sphere), with "lines" as great circles. The construction defines the properties.
      *   **The Crucial Hurdle: Physical Meaning & Foundational Motion:** The big problem is Hobbes's deep commitment to geometry as *fundamentally* about the properties of *physical bodies in motion within the real, perceived space*. Non-Euclidean geometries, especially in their abstract 19th-century form, weren't initially presented as kinematic constructions of *physical* space alternatives, but as logical possibilities. For Hobbes:
          *   **Which motion is fundamental?** The rectilinear motion generating the Euclidean plane is ontologically prior in his system. Curved surfaces are *themselves* generated within this prior Euclidean space by more complex motions. Non-Euclidean spaces as *fundamental* kinematic starting points might seem nonsensical to him.
          *   **Is it "Real" Geometry?** Hobbes might argue that non-Euclidean systems, while logically consistent, describe the properties of figures *constructed on curved surfaces within Euclidean space*, not a fundamentally *different* space. They are "applied" or "constrained" geometries, not replacements for the foundational kinematics of points, straight lines, and planes generated by simple translation and sweeping.
      *   **Verdict:** Hobbes *might* eventually concede non-Euclidean geometries as valid *within their specific, kinematically defined construction rules*, but he would vehemently reject them as replacements for the fundamental kinematics of Euclidean space, which he saw as the necessary foundation derived from the nature of body and motion itself. They would be interesting "special cases" or "constrained systems," not the core of geometry.

  3.  **Confronting Hilbertian Formalism:**
      *   **The Antithesis:** Formalist axiomatics is almost perfectly designed to trigger Hobbes's deepest philosophical aversions. It embodies everything he railed against:
          *   **"Scab of Symbols" on Steroids:** Points, lines, planes are stripped of *all* inherent meaning beyond their relational roles defined by axioms. They are explicitly *not* defined by construction or physical referent.
          *   **Axioms as Arbitrary:** Axioms are chosen for consistency and fruitfulness, not because they are demonstrably derived from fundamental principles of body and motion. They are starting points, not conclusions.
          *   **Loss of Maker's Knowledge:** The certainty of geometry, for Hobbes, came from constructing the objects. In formalism, certainty comes solely from logical deduction from arbitrarily chosen premises. The connection to *making* and *motion* is completely severed. We don't "know" the point by constructing it; we know it only as an undefined term satisfying certain relations.
          *   **Rejection of Foundational Demonstration:** Hilbert's program explicitly avoids trying to "prove" the axioms or ground them in something more fundamental; their justification is systemic. Hobbes demanded that axioms *be* proven from first principles (body, motion, cause).
      *   **Hobbes's Reaction:** Uncompromising rejection. He would see it as:
          1.  **Meaningless Abstraction:** A return to the worst aspects of Euclid he criticized – definitions without generative substance. "Point" without a motion to generate it is an empty name.
          2.  **Detached from Reality:** Severing geometry from kinematics and physical bodies renders it irrelevant to natural philosophy, which was its primary purpose for Hobbes.
          3.  **Loss of Certainty's Source:** Logical consistency within an arbitrary system is not the same as the certainty derived from constructing the object itself. Formalism provides conditional certainty *if* you accept the axioms, but not the absolute, maker-derived certainty Hobbes sought.
          4.  **A Triumph of "Symbols" over Sense:** It would look like the ultimate victory of Wallis's despised algebraic/"symbolic" approach over true geometric reasoning grounded in sense, imagination, and motion.

  **Conclusion: Can Maker's Knowledge Absorb These Developments?**

  *   **Non-Euclidean Geometry:** **Partially, but with profound reservations.** If presented *kinematically* as geometries arising from *different, well-defined motions* constrained on specific surfaces *within Euclidean space*, Hobbes could potentially see them as valid, albeit derivative, systems of maker's knowledge. However, he would almost certainly reject the idea that they represent *fundamentally different* spaces or challenge the primacy of Euclidean kinematics as the foundation of geometry and physical reality. His framework *requires* geometry to be pinned to a specific, constructive picture of space derived from body and motion.
  *   **Hilbertian Formalism:****Absolutely not.** Formalism represents the utter negation of Hobbes's core principles. It severs the vital link between knowledge, construction, motion, and physical reality. It elevates the very "scab of symbols" he despised to the defining principle of geometry. His maker's knowledge story *cannot* absorb formalism without ceasing to be Hobbesian. It requires geometry to be fundamentally about constructed physical/kinematic objects, not abstract relations between undefined terms.

  Taking Hobbes seriously means recognizing that his philosophy of geometry is inextricably linked to his broader materialist, mechanistic, and nominalist worldview. Non-Euclidean geometry challenges the *uniqueness* of his kinematic picture but could *perhaps* be forced into a broader, multi-constructivist framework (though he'd resist). Formalism, however, abandons the very engine of his epistemological certainty – construction through motion – and would be seen as a descent into meaningless abstraction, utterly wrecking his specific physical/kinematic picture of geometric knowledge.
