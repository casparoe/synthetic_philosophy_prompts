  First, I need to rank these ten episodes from clearest case to weakest case of a genuine Kuhnian paradigm shift with strong incommensurability. Kuhn's paradigm shifts involve incommensurability, meaning that the old and new paradigms are so different that they can't be directly compared—they have different standards, methods, problems, and even what counts as a phenomenon.

