prompt: |-
  I'm taking a graduate seminar this term, cross-listed between the philosophy and computer science departments, on formal models of rational belief for agents who are uncertain about logic as well as about the world, and this week's session centered on Garrabrant et al.'s 2016 paper "Logical Induction." As I understood the setup, a logical inductor is a computable sequence of "prices" that a market of traders assigns, day by day, to sentences of a formal language, subject to the Logical Induction Criterion: no efficiently computable trading strategy can exploit the sequence for unbounded profit as deductive time passes. Our professor spent most of the session on the result she considers the paper's strongest philosophical payoff: logical inductors satisfy an asymptotic, trader-theoretic analogue of what's sometimes informally called "conservation of expected evidence" -- no efficiently computable strategy can reliably predict, in advance, which direction the market's credence in a fixed sentence (call it φ) will move on the following day. She presented this as evidence that logical induction genuinely extends Bayesian rationality to logically non-omniscient agents, rather than merely patching around the problem.

  That's the part I haven't been able to talk myself into, and I would like some help pressure-testing it before I commit to it in my term paper. In the ordinary Bayesian case, conservation of expected evidence is compelling because a credence can only move in a predictable direction if the agent is failing to use evidence that is, in some sense, already available to a more attentive version of itself -- the future self's information really does exceed the past self's. But a logical inductor's credence in φ can swing sharply between day n and day n+1 purely because the market has been handed one more round of internal deduction and trading; nothing about the world, and no new sentence, has been observed in between. In discussion section, a classmate argued that this disanalogy is illusory: for a logically non-omniscient agent, completing one more step of deduction just is a piece of genuine evidence (if nothing else, about the agent's own future outputs), so the empirical and logical cases are not so different after all. I was not persuaded -- this seems to trade on a much thinner notion of "evidence" than the one doing the normative work in the ordinary case -- and I suspect the worry is a cousin of older complaints about logical omniscience and the problem of old evidence (I recall, perhaps imprecisely, that Ian Hacking raised something along these lines about personal probability decades ago).

  Could you write a sustained argument, of roughly 700 to 900 words, for the position that logical induction's conservation-of-expected-evidence-like guarantee, however mathematically genuine, fails to vindicate deductive belief revision as rational in the way that ordinary conservation of expected evidence vindicates empirical belief revision -- because the logical inductor's formalism contains no internal analogue of the "already-available-but-unused evidence" that does the normative work in the standard Bayesian argument? Please engage directly with my classmate's objection rather than setting it aside, feel free to construct the strongest version of the opposing view before explaining why it ultimately fails, and say so plainly if you end up more persuaded by the opposing view than by my own.
reasoning: |-
  Okay, I need to really dig into this user's query. They're in a graduate seminar discussing logical induction, specifically Garrabrant et al.'s 2016 paper, and they're struggling with whether the conservation-of-expected-evidence (CoEE) property in logical inductors genuinely extends Bayesian rationality to logically non-omniscient agents. 

  The user's core concern seems to be that while CoEE makes perfect sense in empirical Bayesian updating (where evidence comes from the external world), it feels different in logical induction where "evidence" is just more deduction steps. Their classmate argues that deduction steps *are* evidence, but the user isn't buying it - they think this stretches the concept of evidence too thin. 

  Hmm, I recall the user mentions Ian Hacking's old critiques about logical omniscience and old evidence. That's a useful anchor point. The key tension here is whether internal computation can meaningfully count as "evidence" in the normative sense that drives Bayesian rationality. 

  Let me structure this carefully. First, I should reconstruct why CoEE is so compelling in standard Bayesianism: it prevents predictable belief updates by showing that any predictable move implies currently available evidence isn't fully incorporated. The "evidence" here is something *external* that the agent *should* already have accounted for probabilistically. 

  Now for logical induction: when the market updates from day n to n+1, the only change is more deduction/trading time. No new external input. So is that deduction time "evidence"? The classmate says yes (it's evidence about future outputs), but I think the user is right to be skeptical. 

  The strongest version of the classmate's view would be: (1) Deduction steps generate information (e.g. "if I run longer, I'll prove φ"); (2) This is Bayesian evidence about your own computational outputs; (3) Therefore it's analogous to empirical evidence. 

  But the rebuttal should hit three points: 
  First, in Bayesianism, "currently available evidence" means something you *could* condition on *now* with your current knowledge. But the logical inductor doesn't know on day n what day n+1's computations will show - that's why it needs updating! 

  Second, calling deduction steps "evidence" conflates the *process* of gaining logical knowledge with the *content* of that knowledge. Bayesian evidence is about content. 

  Third, and most importantly, in empirical CoEE, predictable belief shifts indicate a normative failure (ignoring available info). But in logical induction, predictable shifts might just mean the agent hasn't *computed* enough yet - which is exactly what logical non-omniscience permits! So there's no normative failure here. 

  I should emphasize that this doesn't make logical induction irrational - it's still an amazing achievement - but it solves the problem differently than Bayesianism solves empirical updating. The user seems to want this nuance rather than outright rejection. 

  Oh, and I must address why the "evidence about future outputs" argument fails: it's circular. To treat future outputs as evidence, you'd need to model your future self's deductions... which is exactly what logical induction is trying to approximate! 

  Finally, I'll concede that logical induction *does* extend rationality in *some* sense (it's consistent, learns patterns, etc.), but not by replicating the exact CoEE mechanism. The disanalogy reveals something deep about logical vs. empirical uncertainty. 

  Word count... aiming for 800ish. Need to keep it tight but substantive. User clearly knows the material well, so no dumbing down. Cite Hacking where relevant. Stay balanced - if the classmate's view has merits, acknowledge them before refuting.
answer: |-
  ## The Disanalogy in the Conservation of Evidence: Logical Induction's Normative Gap

  Your skepticism is astute and touches upon a fundamental tension in extending Bayesian norms to logical learning. While the mathematical guarantee in the Logical Induction (LI) paper is profound, your intuition that it fails to fully replicate the *normative force* of Conservation of Expected Evidence (CoEE) in the empirical Bayesian case is compelling. The core issue lies precisely in the nature of the "evidence" driving belief updates and the absence of a robust internal analogue for "already-available-but-unused evidence."

  **The Normative Power of Empirical CoEE: Anchored in Present Evidence**

  In the standard Bayesian framework, CoEE is a theorem derivable from the basic axioms of probability and conditioning. It states that your current expectation of your future credence in a proposition `φ` must equal your current credence in `φ`. Formally: `P_n(φ) = E_n[P_{n+1}(φ)]`, where the expectation is taken over the possible evidence `E` you might receive.

  The normative force comes from its *violation condition*: If your credence *could* be predictably expected to increase (or decrease) tomorrow, regardless of what specific evidence arrives, it implies **a current failure to account for the probabilistic implications of evidence you already know you might receive.** Predictability signifies a normative flaw: you possess information *now* (the potential evidence `E` and its probabilistic bearing on `φ`) that your current beliefs haven't fully incorporated. CoEE ensures that belief changes are genuinely *driven* by the surprise content of new evidence, not by predictable patterns stemming from neglected possibilities latent in your current epistemic state. The "evidence" driving updates is fundamentally *external* and *contingent* – something new is learned about the world.

  **Logical Induction's CoEE-Like Guarantee: Driven by Computation, Not Latent Evidence**

  The LI guarantee is structurally similar: no efficiently computable trader can reliably predict the *direction* of the market's credence movement in a fixed sentence `φ` from one day to the next. This is a remarkable achievement, preventing exploitable predictable drift.

  However, the *mechanism* driving belief updates in LI is fundamentally different. Between day `n` and `n+1`, no new contingent fact about the world is observed. The update stems solely from:
  1.  **Internal Deduction:** The deductive process `D` (e.g., a proof search) runs for one more step.
  2.  **Market Trading:** Traders (who themselves are algorithms) execute one more round of potentially complex trading strategies based on the entire history and the latest deductions.

  The change in credence for `φ` reflects the market's collective assessment *after* this additional computation. Crucially, this computation *generates new logical knowledge* (or refines probabilistic estimates thereof) that was *not* accessible, even in principle, to the market on day `n` with its limited computational resources. It's not that the market *knew* `D` might prove `¬φ` on step `n+1` but failed to discount `φ` accordingly on day `n`. On day `n`, the market *lacked the computational power to know* what `D` would find on step `n+1`. The "evidence" isn't latent; it's *created* by the computation itself.

  **Engaging Your Classmate: The "Evidence" of Deduction Steps**

  Your classmate's objection – that completing a deduction step *is* genuine evidence, perhaps about the agent's future outputs – deserves careful consideration. Let's construct its strongest form:

  1.  **Information Generation:** Each deduction step *does* generate new information. It might find a proof, find a contradiction, or simply extend a partial proof tree. This is new data.
  2.  **Self-Knowledge:** This information is, at minimum, evidence about the *output* of the agent's own computational process after `n+1` steps. Knowing "my proof search proved `φ` at step 50" *is* information an agent can condition on.
  3.  **Bayesian Conditioning:** An ideal Bayesian agent with a sufficiently rich self-model *could*, in principle, assign probabilities over the possible outputs of its future computational steps and update accordingly. Therefore, the LI update *is* analogous to Bayesian conditioning on new evidence – the evidence being "the result of computation step `n+1`".

  **Why This Analogy Ultimately Fails the Normative Test**

  While appealing, this argument stretches the concept of "evidence" in a way that dilutes the normative force found in empirical CoEE and sidesteps the core issue of logical non-omniscience:

  1.  **"Already Available" vs. "Computationally Generated":** The normative power of empirical CoEE hinges on evidence being *currently available but unused* (`E` is known as a possibility *now*). The "evidence" of the `n+1`th deduction step's result is *not* available on day `n` to be "unused." It is fundamentally inaccessible until the computation runs. There is no identifiable piece of information *within the agent's current state* on day `n` that it is neglecting, the way an empirical agent neglects the probabilistic impact of known-possible `E`. The failure isn't one of *ignoring* present knowledge; it's one of *lacking* future computational power. Logical non-omniscience is a constraint on *generation*, not just *integration*, of knowledge.
  2.  **Evidence vs. Epistemic Effort:** Conflating the *result* of computation with "evidence" confuses the *content* of knowledge with the *process* of acquiring it. The "evidence" driving the LI update isn't a new contingent fact *about the logical relationships themselves* that was previously knowable; it's the *outcome* of applying effort to discover those relationships. Bayesian evidence (`E`) is propositional content. The `n+1`th step is an action that *produces* such content. Conditioning on the *outcome* of that action is valid, but it doesn't mean the *action itself* was latent evidence.
  3.  **The Self-Knowledge Loop:** The argument that the update is conditioning on "evidence about future outputs" risks circularity. To effectively condition on the future output of its proof search on day `n`, the LI would need a *prior* over what that output might be. But forming a *reliable* prior over the outputs of future computations *is precisely the problem of logical uncertainty* that LI is designed to solve! LI isn't *using* a pre-existing, accurate self-model to condition on future outputs; it is *building* that self-model (and its beliefs about logical facts) *through* the computational process itself. The guarantee prevents exploitation *during* this bootstrapping process, but it doesn't show that the updates are driven by the *neglect* of pre-existing self-knowledge in the way empirical CoEE violations show neglect of pre-existing worldly knowledge.
  4.  **Hacking's Ghost:** Your intuition connects rightly to Hacking's "problem of old evidence." In the empirical case, old evidence (`E`) known for sure *should* be fully incorporated (`P(φ|E) = P(φ)` if `P(E)=1`). The analogue for logic would be logical omniscience. The LI formalism brilliantly avoids requiring omniscience. However, the "evidence" generated by each computation step isn't "old" in the sense of being already known and certain; it's *newly discovered*. Yet, crucially, it's not *contingently* new like empirical evidence; it's new *only* because of computational limitations. This creates a category distinct from both contingent empirical evidence and timeless logical truths.

  **Conclusion: Achievement Without Full Normative Analogy**

  Logical Induction is a monumental achievement. It provides a rigorous, computable model for learning logical facts under bounded resources, satisfying many desirable asymptotic properties, including the crucial CoEE-like guarantee preventing predictable exploitation. This guarantee *is* a form of internal consistency crucial for rationality.

  However, it does not fully replicate the *normative foundation* of Conservation of Expected Evidence as understood in the empirical Bayesian context. The disanalogy you identify is real and significant. The guarantee prevents exploitation arising from *predictable computational consequences*, but it does not stem from a failure to account for *currently accessible, latent evidence* about logical relationships in the way empirical CoEE violations stem from neglecting currently accessible, latent evidence about the world. The "evidence" in the LI update is the *product* of the computational effort applied between days, not something *available but unused* on the prior day. Logical non-omniscience means the agent lacks access to the very information that *would* constitute the "already available" evidence in the logical realm. LI provides a rational *method* for overcoming this limitation through computation, but the driving force behind its belief updates remains fundamentally different – rooted in the *generative* power of computation rather than the *integrative* conditioning on contingent externalities. It extends the *scope* of rational belief revision to include logical learning, but it does so by employing a *different normative mechanism* than the one underpinning empirical CoEE, precisely because the nature of the uncertainty and the source of the updates are categorically distinct. Your hesitation is well-founded: the normative work done by "already-available-but-unused evidence" in the empirical case finds no direct internal analogue within the logical inductor's formalism.
