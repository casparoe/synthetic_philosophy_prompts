answer: |-
  Here's the strongest case for etiological accounts *without* simply biting the bullet on Swampman, arguing that his heart *does* have a function on their terms:

  1.  **Focus on Type, Not Token:** Etiological accounts primarily assign functions to *types* of traits (e.g., "the human heart," "chlorophyll," "the vertebrate eye"), not necessarily to every individual *token* instance. The function is defined by the history of selection operating on the *type*. Swampman possesses a token instance of the *type* "human heart." This type *has* a robust etiological history of selection for pumping blood. Therefore, the token heart in Swampman *instantiates* a type with a proper function, and thus inherits that function. The lightning strike didn't create a *new* type; it created a token of an *existing* type with a well-defined etiological function.

  2.  **The "As If" Counterfactual & Historical Embedding:** Swampman's heart isn't just *like* a heart; it's identical in structure and operation *because* it's a copy of a structure whose form is the *result* of natural selection. Its causal powers exist *precisely because* it mimics the structure shaped by history. The etiological function explains *why* this structure has the causal capacities it does. While Swampman's specific token has no *direct* selection history, its entire structure is *parasitic* on, and only exists *because of*, the actual historical selection processes that forged the blueprint it replicates. Its function derives from the historical forces that explain *why* it has the form capable of pumping blood effectively. It's "as if" it had a history because it perfectly embodies the outcome of that history.

  3.  **Function as Explanation of Presence/Form:** The core power of etiological functions is explaining *why* a trait with specific causal capacities *exists* in an organism/population. For normal humans, we say "Hearts exist *because* they pumped blood (and contributed to fitness)." For Swampman, we *cannot* say "This heart exists *because* it pumps blood." It exists because of a freak lightning strike. However, we *can* say: "This structure *has the specific form it has* because structures *like* it were historically selected *for* pumping blood." The etiological function explains the *design* of the trait, even in this accidental token. The pumping is the reason the *form* exists in the biosphere, even if it's not the reason *this specific instance* exists.

  4.  **Contrast with Malfunction:** Etiological accounts handle malfunction cleanly: a trait has a function it currently fails to perform. If we deny Swampman's heart a function, we lose this distinction. Imagine Swampman has a heart defect – a leaky valve. On the causal-role view, it's still contributing *some* causal role (moving fluid inefficiently). On the etiological view *applied to the type*, we can clearly say it's malfunctioning – failing to perform the pumping function assigned to the heart *type*. Denying Swampman's heart a function makes it impossible to say it's malfunctioning if defective; it's just doing whatever it does. This clashes with biological and medical intuition.

  5.  **The "System's" History vs. The Token's History:** While Swampman himself has no evolutionary history, the *system* he instantiates – the entire functional organization of a human body – *does* have a profound evolutionary history. His heart isn't an isolated artifact; it's an integrated component within a copied system whose organization is *defined* by its evolutionary history. The function of the heart within that system is determined by the role analogous parts played in the historical systems that were selected. The token heart functions *as part of* a historically defined system.

  **Why this is stronger than "biting the bullet":**

  *   **Preserves Intuition:** It grants that Swampman's heart *does* have the function of pumping blood, aligning with the strong intuition that its activity isn't functionally inert.
  *   **Leverages Core Etiological Strength:** It relies on the etiological account's core ability to explain trait *form* and *design* through history, rather than abandoning it for the token.
  *   **Provides Explanatory Power:** It allows us to say *why* Swampman's heart has the specific structure it has and *why* pumping blood is the relevant activity to focus on (rather than, say, making thumping sounds or displacing swamp muck).
  *   **Handles Malfunction:** It maintains the crucial malfunction distinction.
  *   **Avoids Ad Hocness:** It doesn't require inventing new rules for Swampman; it applies the standard type-based etiological reasoning consistently, arguing the token inherits the type's function.

  **Potential Objections & Rebuttals:**

  *   **Objection:** "But the token *itself* has no history! The etiological account demands history of the trait *instance*."
      *   **Rebuttal:** The strictest reading might say this, but it leads to absurdities (e.g., a heart transplant recipient's new heart suddenly loses its function? A lab-grown organ has no function?). Focusing on the *type* of which the token is an instance is a more practical and consistent application within biology. The history explains the token's *properties and organization*, even if not its *instantiation*.
  *   **Objection:** "This smuggles in causal-role via the back door by relying on the token's current causal capacity matching the type's historical function."
      *   **Rebuttal:** The causal capacity is necessary *evidence* for what the historical function *was* (and what the type's function *is*), but the *justification* for assigning *this specific* causal capacity as the function (pumping blood) rather than another (making noise) still rests on the history of the type. The causal role is constrained and defined by the etiological history.
  *   **Objection:** "What if Swampman was a duplicate of a *fictional* being with no evolutionary history?"
      *   **Rebuttal:** This is even more detached from biological reality. Etiological accounts are grounded in actual evolutionary biology. A fictional duplicate lacks even the indirect connection to real historical selection pressures shaping the *type*. Here, biting the bullet might be more plausible: without *any* connection to a historically selected type (real or copied), assigning a biological function *does* become nonsensical. Its causal roles would be just that – causal roles.

  **Conclusion:**

  The strongest defense for etiological accounts against Swampman isn't denial but **inheritance**. By arguing that Swampman's heart is a token instance of the biological type "human heart," and that this *type* has a robust etiological function (pumping blood), the token heart *inherits* that function. Its existence is accidental, but its *form, causal capacities, and integration into a copied system* are entirely explained by and parasitic upon the real historical selection processes that defined the type and its function. This preserves the core explanatory power of etiological functions (explaining design and presence in populations) while accommodating the intuition that Swampman's heart isn't functionally inert. It treats Swampman not as a counterexample that breaks the theory, but as a bizarre instance where a token perfectly embodies a type whose function is defined by a history it didn't directly participate in.
