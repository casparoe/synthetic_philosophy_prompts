  I need to recall Anscombe's double effect doctrine. The main points are: the action itself must be good or neutral, the bad effect must not be intended, the good effect must not come from the bad, and proportionality. Applying this to double-tap strikes. The first strike targets a combatant, which might be permissible under double effect if civilian casualties are unintended. But the second strike targets rescuers. Since these are likely civilians or non-combatants, the intention here is crucial. If the military's goal is to kill those aiding the wounded, that directly intends harm to non-combatants. Anscombe would see this as murder, just like Truman's actions.

