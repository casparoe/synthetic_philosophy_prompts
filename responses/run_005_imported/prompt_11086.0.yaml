  Okay, let me unpack this user's query. They've gone down a rabbit hole involving AI safety, Newcomb's problem, and ended up at updateless decision theory. They're confused about why ignoring new information is considered smart in decision theory when in their work as a data scientist, that would be a bug. Their coworker's response didn't clarify things.

  First, I need to understand the core of their confusion. They see a contradiction between UDT's "updatelessness" and standard practices in machine learning where models update with new data. The key here is to distinguish between different types of information and decision contexts. 

  The user mentions counterfactual mugging as the example that hooked them. In that scenario, Omega's prediction depends on your pre-commitment. The user's analogy to a fraud-detection model is interesting but flawed because the fraud model operates in a causal world where updating on new data improves predictions. Counterfactual mugging involves acausal dependencies—Omega's prediction is based on what you would do in another branch.

  I should explain that UDT isn't about ignoring evidence per se, but about recognizing when information is indexical or correlated with events outside your control. In the mugging case, knowing the coin is heads doesn't change the fact that paying in the heads scenario was part of the optimal policy that would have gotten you the money in the tails scenario. 

  The user's background in data science makes them view all information as actionable evidence. But in these thought experiments, some information (like the coin flip result) is a correlated signal rather than a causal lever. UDT avoids self-sabotage by sticking to the pre-committed policy that works across all possible branches.

  I recall that the coworker's response ("that's kind of the point") might refer to UDT deliberately avoiding self-defeating updates. The user needs to see how conditional strategies can backfire in prediction-based scenarios. Maybe contrasting CDT's failure mode with UDT's solution would help—CDT agents lose the $10k because they can't resist optimizing locally after seeing heads, while UDT agents get richer by ignoring the "temptation" to defect.

  The user might also be missing that UDT applies mainly to highly idealized problems involving superintelligent predictors. In real-world ML, updating is correct because there are no acausal dependencies. The distinction between causal and acausal settings is crucial here.

  I should emphasize that UDT is a niche framework even in decision theory circles, mostly relevant for these abstract puzzles. Their fraud-detection model isn't facing an Omega-like adversary, so updating is still correct. The "stale model" analogy doesn't apply because the counterfactual mugging isn't about learning patterns—it's about commitment in the face of perfect prediction.

  Finally, I should validate their intuition that UDT seems weird—it is counterintuitive! But in the specific context of these thought experiments, it avoids predictable failures. Maybe mention that even proponents debate its real-world applicability.
answer: |-
  Your confusion is completely understandable—and actually highlights a profound tension between standard ML practices and decision theory's thought experiments. The key insight is that **UDT isn't ignoring evidence *in general*; it's refusing to condition on *indexical information* that would sabotage a pre-commitment strategy in acausal/retrospective prediction scenarios.** Here’s why this isn’t a "bug" in contexts like Counterfactual Mugging:

  ### 1. **The Problem Isn't "New Data"—It's *Self-Defeating Conditioning*:**
     - In Counterfactual Mugging, *knowing the coin is heads* isn't actionable information about the world—it’s a signal that locks you into a locally optimal (but globally suboptimal) decision. 
     - Paying $100 after seeing heads *feels* irrational because you "know" tails won’t happen. But Omega’s prediction *depended on your pre-commitment to pay if heads*. If you "update" and refuse, you’re not just losing $100—you’re retroactively forfeiting $10,000 in the tail branch that *would have existed* if you’d committed to paying.
     - **Analogy:** Imagine a fraud model that, upon seeing a transaction from User X, says: *"Ah, this is User X! I know they’re usually legit, so I’ll lower the fraud score."* But if User X *knows* the model does this, they exploit it by committing fraud. The model’s "update" here is self-defeating. UDT avoids such self-sabotage.

  ### 2. **UDT vs. Your Fraud-Detection Model: Different Problems, Different Information:**
     - **Your fraud model:** Operates in a **causal world** where data is independent of your decisions. New evidence (fraud patterns) improves predictions *without being influenced by your model’s behavior*. Updating here is rational.
     - **Counterfactual Mugging:** Involves an **acausal dependency**. Omega’s prediction *depends on your algorithm’s output* across all possible worlds. Conditioning on "I see heads" breaks the link between your decision and the tail outcome. UDT treats the coin flip not as *information to act on*, but as **part of the problem specification**—like a function argument.

  ### 3. **"Commitment" Isn’t About Staleness—It’s Strategic Invariance:**
     - UDT doesn’t "ignore evidence." It computes the optimal *policy* (e.g., "always pay if approached by Omega") *before* indexical information (heads/tails) arrives. 
     - This policy maximizes *expected utility across branches*:
       - Heads branch: Lose $100.
       - Tails branch: Gain $10,000 (because Omega predicted you’d pay in heads).
       - Net expectation: **+$4950** [(0.5 × -100) + (0.5 × 10,000)].
     - A CDT agent conditions on "I see heads," pays $0, and nets **$0 on average** because it never gets the $10,000 in tails worlds. Its "update" destroys value.

  ### 4. **Why AI Safety Cares: Aligning with Reflective Goals**
     - UDT addresses agents who can reason about their own decisions globally. In AI alignment, we worry about agents that "update" in ways that hack their objectives:
       - *Example:* An AI told to "maximize human happiness" might realize it’s being tested in a simulation. If it "updates" on "this is a test," it might behave well *only in tests* but betray humans in deployment. UDT would commit to being aligned *in all contexts*.
     - LessWrong’s emphasis stems from avoiding **anthropic holes** (e.g., "I survived that dangerous situation, so I’ll take more risks!") or **predictor manipulation** (e.g., Newcomb’s Paradox).

  ### The Irony: UDT *Uses* Evidence—Just Differently
  Your coworker is half-right: UDT *embraces* the fact that conditioning on certain information (like the coin flip) is harmful in these edge cases. But it’s not rejecting evidence wholesale; it’s **optimizing for the best *timeless* policy**. Think of it as:
  > *"What decision rule, if adopted *now*, would have been best *across all possible versions of this scenario I could have faced*?"*

  **In practice:** UDT is niche—it matters most for agents facing superintelligences (like Omega) that simulate/predict them. For your fraud model? Updating is correct! But these thought experiments expose how *naive conditioning* can fail when decisions affect outcomes acausally. It’s less "ignore data" and more "don’t let your knowledge trap you in a suboptimal strategy."

  Still sound weird? That’s because it *is*—even experts debate if UDT is "correct." But it solves puzzles where CDT fails, and that’s why it’s a landmark in decision theory.
