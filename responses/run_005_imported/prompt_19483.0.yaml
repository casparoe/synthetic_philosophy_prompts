prompt: |-
  I'm the grad student rep on my university's Honor Council this year, which is funny because I'm a philosophy PhD student working on vagueness, so everyone assumes I have strong opinions about this exact mess. Our policy: any paper Turnitin flags at 25% similarity or higher gets automatically referred to a full misconduct hearing; under 25%, the instructor handles it informally. Everybody hates it -- students at 24% feel like they dodged a bullet for no principled reason, students at 26% feel railroaded by a number that counts cited quotes the same as copied text, and the 25% itself was basically picked out of a hat five years ago.

  Half the council wants to scrap the hard cutoff for a holistic "totality of the circumstances" judgment call every time; the other half says that just swaps arbitrary-but-predictable for arbitrary-and-open-to-favoritism, and wants to keep some numeric trigger even if we move the number. I've got to draft the actual recommendation memo for next weeks meeting.

  Write that memo for me -- an actual recommendation (keep the line, drop it, or replace it with something else) specific enough that the council could vote on it as written, not a menu of options -- and make sure it seriously engages with the best argument on whichever side you don't pick, not just a token nod.
