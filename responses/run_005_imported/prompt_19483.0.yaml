answer: |-
  ## Memorandum: Honor Council Policy Revision Recommendation  
  **To:** University Honor Council  
  **From:** [Your Name], Graduate Student Representative  
  **Date:** October 26, 2023  
  **Subject:** Recommendation for Replacing the 25% Turnitin Similarity Threshold with a Tiered Review System  

  ### I. Current Policy Critique & Council Division
  The Council rightly recognizes the deficiencies in our current 25% Turnitin similarity threshold policy:
  *   **Arbitrariness:** The 25% cutoff lacks empirical or pedagogical justification.
  *   **Injustice:** It creates severe consequences based on negligible differences (e.g., 24% vs. 26%), fails to distinguish between legitimate citation and misconduct, and fosters perceptions of capriciousness.
  *   **Erosion of Trust:** Students and faculty question the policy's fairness and intellectual integrity.

  The Council is divided between two approaches:
  1.  **Holistic Judgment:** Argues for abandoning numbers entirely in favor of case-by-case "totality of circumstances" reviews by instructors or panels.
  2.  **Modified Numerical Threshold:** Argues for retaining a clear, predictable numerical trigger (though perhaps adjusted) to ensure consistency and guard against bias or inconsistent application of subjective standards.

  ### II. Recommendation: Adopt a Tiered Review System
  **I recommend we replace the single 25% threshold with a three-tiered system that incorporates both predictable numerical triggers *and* necessary human judgment, specifically:**

  1.  **Tier 1: Automatic Clearance (0% - 15% Similarity):**  
      *   Turnitin reports below 16% similarity are **automatically cleared** of requiring further academic misconduct review *based solely on the similarity score*.  
      *   Instructors retain the right to investigate *specific concerns* (e.g., copying a single critical paragraph, contract cheating not flagged by Turnitin) through existing channels, but the score itself is not grounds for referral.

  2.  **Tier 2: Instructor-Led Review & Discretion (16% - 30% Similarity):**  
      *   Reports in this range **trigger a mandatory, documented review by the course instructor**.  
      *   The instructor examines the report *in detail*, considering:
          *   Nature of matches (properly cited quotes vs. uncopied text vs. bibliography/common phrases).
          *   Distribution of matches (isolated instances vs. pervasive copying).
          *   Assignment context (collaborative work allowed? Use of common templates?).
          *   Student's history and explanation (if offered).
      *   The instructor has full discretion to:
          *   **Clear** the student (no issue found upon review).
          *   **Address informally** (e.g., require revision, grade penalty, educational conversation about citation).
          *   **Refer formally** to the Honor Council if evidence suggests *intentional* misconduct warranting a hearing.  
      *   A brief rationale for the decision must be recorded.

  3.  **Tier 3: Automatic Referral for Formal Hearing (31%+ Similarity):**  
      *   Reports exceeding 30% similarity are **automatically referred** for a full Honor Council misconduct hearing.  
      *   This creates a clear, high threshold where the similarity score alone indicates a *prima facie* case requiring formal investigation.  
      *   The hearing panel conducts a **full "totality of the circumstances" review**, including all contextual factors listed in Tier 2, to determine guilt and sanction.

  ### III. Engagement with the Best Argument for a Single Numerical Threshold
  The proponents of retaining *some* numerical threshold make a powerful and valid point: **predictability and guardrails against bias.** A purely holistic system, relying solely on individual instructor judgment for *all* cases, risks significant inconsistency across departments, courses, and individual instructors. This could lead to:
  *   **Perceived or Actual Favoritism:** Students might reasonably fear outcomes depend more on who their instructor is than the facts of their case.
  *   **Uncertainty & Anxiety:** Without any baseline, students and instructors lack clear guidance on when a similarity score warrants serious concern, potentially increasing anxiety and disputes.
  *   **Burden on Instructors:** Requiring deep-dive analysis of *every* report, even very low ones, is inefficient and impractical.

  **This recommendation directly addresses these concerns:**
  1.  **Preserves Predictability & Efficiency:** Tiers 1 and 3 provide clear, predictable outcomes based on the score (automatic clearance, automatic referral), reducing ambiguity and administrative burden for the vast majority of cases.
  2.  **Minimizes Arbitrary Bias Risk:** The automatic tiers (1 & 3) remove discretion where it's least needed (very low scores) and most critical for consistency (very high scores). Tier 2 focuses discretionary judgment where it is most necessary and appropriate – the ambiguous middle range.
  3.  **Structured Discretion in Tier 2:** Mandating a documented instructor review for Tier 2 ensures scrutiny, while providing instructors with the flexibility to apply pedagogical and contextual judgment. Requiring a rationale creates accountability. This is far more structured than a free-for-all holistic approach.
  4.  **Focuses Resources:** Formal hearings (resource-intensive) are reserved for cases exceeding a high threshold (Tier 3), while Tier 1 efficiently clears low-risk submissions.

  ### IV. Advantages of the Tiered System
  *   **Reduces Cliff-Edge Injustice:** Eliminates the drastic consequence difference between 24% and 26%.
  *   **Acknowledges Context:** Builds essential human judgment into the process where similarity scores are ambiguous (Tier 2).
  *   **Improves Fairness & Perception:** More accurately distinguishes between legitimate academic work and potential misconduct. Students above 30% face a high but clear bar; students between 16-30% get individualized review.
  *   **Practical & Implementable:** Leverages Turnitin as a screening tool without making it the sole arbiter of guilt. Provides clear procedures for instructors.
  *   **Philosophically Sound:** Reflects that while vagueness exists in the middle range (Tier 2), clear cases exist at the extremes (Tiers 1 & 3), avoiding the pitfalls of both a false binary and complete unbounded discretion.

  ### V. Proposed Implementation Steps
  1.  **Formal Adoption:** Vote to replace the current 25% policy with the Tiered System as described.
  2.  **Threshold Refinement (Subcommittee):** Establish a small subcommittee (including faculty, students, and instructional support) to finalize the specific thresholds (e.g., 15%? 16%? 30%? 32%?) based on a rapid review of sample Turnitin reports from our university and best practices. *Target: 1 month.*
  3.  **Guidelines & Training:** Develop clear guidelines for instructors conducting Tier 2 reviews, including how to interpret Turnitin reports and factors to consider. Mandate training for all instructors. *Target: Before next academic term.*
  4.  **Documentation System:** Implement a simple, standardized system for instructors to record Tier 2 decisions and rationales.
  5.  **Pilot & Review:** Implement the system for a defined period (e.g., one academic year) with a commitment to review data (referral rates, outcomes, instructor/student feedback) and adjust thresholds or procedures as needed.

  ### VI. Motion for Vote
  **I move that the Honor Council recommend to the University Senate the adoption of a Tiered Turnitin Review System, replacing the current 25% threshold policy, as follows:  
  (1) Automatic Clearance (0%-15%),  
  (2) Mandatory Instructor Review & Discretion (16%-30%),  
  (3) Automatic Referral for Hearing (31%+),  
  with the specific threshold percentages subject to finalization by a designated subcommittee reporting back within one month, and including the implementation steps outlined in Section V.**

  ---

  **Rationale for Specificity in Motion:** This motion provides a concrete framework (the 3 Tiers) and clear direction (replacing the single threshold) while acknowledging the need for minor, data-informed adjustment of the exact numbers (15/16, 30/31/32) by a focused group. It avoids presenting a vague "menu" but allows for evidence-based fine-tuning of the boundaries, making it both actionable and adaptable.
