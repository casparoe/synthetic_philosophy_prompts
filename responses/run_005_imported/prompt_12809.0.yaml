  In the court case, premise-based voting violates neutrality (treats premises differently from conclusion) while conclusion-based violates independence (lets premises affect conclusion directly). Systematicity forces both, which is like demanding that every proposition gets "voted on blindfolded" - no context, no logic, just raw majority. But logic has connections! So when propositions are linked (like P, Q, P∧Q), systematicity pretends those links don't exist. 

  That rigidity is fatal. Imagine judges vote differently on logically equivalent statements - systematicity would allow that because it ignores connections. But rationality requires consistency across linked propositions. The only way to force consistency while ignoring logic is to let one person dictate everything. Anonymity makes it worse - now not even a dictator can save it, hence flat impossibility.

  For the premise vs conclusion methods: premise-based sacrifices neutrality (gives special status to premises) while conclusion-based sacrifices independence (conclusion depends on premises indirectly). Both are escapes from systematicity's straitjacket. I should emphasize this tradeoff since their paper needs it.

