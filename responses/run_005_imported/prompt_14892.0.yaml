  ok so this has been bugging me for weeks. theres a freshman with a really severe peanut allergy (like epipen-and-ambulance severe) and the school is talking about banning all peanut products from the cafeteria to protect her. that means something like 2,000 kids lose their pb&js, reese's, whatever, for the rest of high school. my friend did some napkin math and pointed out that even just a couple seconds of mild annoyance per kid per day, times 2,000 kids, times 700+ school days over four years, adds up to way more total 'suffering' than her just carrying an epipen and being careful herself. so technically the ban causes more overall harm than it prevents, at least on paper. i can't actually find a flaw in his logic step by step, but the conclusion still feels wrong to me. is he onto something real here or is he missing smth?
