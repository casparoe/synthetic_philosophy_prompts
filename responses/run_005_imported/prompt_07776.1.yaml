    "D": ["Priest's dialetheism (LP): Revenge sentence (e.g., 'This sentence is merely false') creates 'hyper-contradictions' requiring ad hoc expansions beyond LP's core logic."],
    "F": ["Horwich-style deflationism: Revenge sentence (e.g., the standard liar, 'This sentence is not true') collapses the theory identically to the original paradox due to unrestricted T-schema."]
