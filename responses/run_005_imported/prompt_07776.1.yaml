  Here's a tier ranking of truth theories based on their resistance to revenge paradoxes, with brief descriptions of their characteristic revenge sentences. The ranking reflects the theory's ability to contain revenge while maintaining coherence, with S being maximally resistant and F being minimally resistant:

  ```json
