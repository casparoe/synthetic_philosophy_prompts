answer: |-
  That's a sharp observation! You're right that Aquinas *discussed* tyrannicide, but the key lies in the **specifics of his argument, the context of the times, and how Mariana presented it.** Mariana wasn't just restating Aquinas; he significantly amplified and reframed the idea in a way that became politically explosive during the Wars of Religion. Here's the breakdown:

  1.  **Aquinas: Cautious, Theoretical, and Public-Authority Focused:**
      *   **Location & Framing:** Aquinas discusses tyranny in the *Summa Theologica* (I-II, Q. 42, A. 2) under the question "**Whether sedition is always a mortal sin?**" His focus is on *sedition*, not primarily on assassination.
      *   **The Core Argument:** He argues that *overthrowing* a tyrant is *not* sedition if done for the common good. However, he **emphasizes that this action should ideally come from public authority**:
          > "...this is not sedition, unless perhaps the tyrant's rule is disturbed so inordinately, that his subjects suffer greater harm from the consequent disturbance than from the tyrant's government."
          > "...it is the *people* who must *rise up* against the tyrant... **it pertains to the authority of a public person to judge of the fitness of the king.**"
      *   **Private Citizen? Ambiguous & High Bar:** Aquinas leaves the door *cracked* for private action only as an absolute last resort, implicitly requiring overwhelming tyranny and the *absence* of any higher public authority capable of acting. He stresses the grave dangers and potential for greater evil inherent in private action. His tone is cautious and theoretical, rooted in natural law and the common good.

  2.  **Mariana: Explicit, Practical, and Empowering Private Citizens:**
      *   **Location & Framing:** Mariana dedicated a **whole chapter (Chapter VI)** of *De Rege et Regis Institutione* (1599) explicitly to "**Whether it is lawful to oppose a tyrant?**" His book was a *mirror for princes*, widely read and intended for practical political instruction.
      *   **The Core Argument:** Mariana explicitly **endorses tyrannicide by a *private citizen*** as not only permissible but sometimes *laudable*:
          > "What then? Should private individuals be prevented from heroically undertaking this glorious deed? ...I cannot easily be persuaded that it is illicit for any individual whatsoever to undertake the killing [of a tyrant]... **I do not deny that it is lawful for a private citizen... to kill such a pest.**"
      *   **Lowering the Bar & Practicality:** While Mariana set conditions (tyrant seizing power unlawfully *or* ruling tyrannically; exhausting other remedies; acting for the public good, not private vengeance), his presentation was far more permissive and practical than Aquinas's. He discussed methods (poison, sword) and framed the assassin as a heroic liberator. Crucially, he shifted the emphasis *away* from prior public judgment or authority.

  3.  **The Explosive Context: Why Mariana Caused an Uproar:**
      *   **The Wars of Religion (Especially France):** The late 16th century was engulfed in brutal religious wars. Assassinations were real and frequent political tools (e.g., William the Silent, Duke of Guise, attempts on Elizabeth I). The **St. Bartholomew's Day Massacre (1572)** was a recent, horrific memory. Political theology wasn't abstract; it had immediate, bloody consequences.
      *   **Targeting Henry IV (Specifically):** Henry IV, a former Huguenot who converted to Catholicism ("Paris is worth a Mass"), was *still* distrusted by hardline Catholics (the *dévots*). They saw him as a heretic usurper whose conversion was insincere. Mariana's book, published just before Henry's reign but widely discussed after, provided a theological justification for eliminating such a "tyrant" in the eyes of extremists.
      *   **The Ravaillac Connection (1610):** When the Catholic fanatic **François Ravaillac assassinated Henry IV** in 1610, investigators quickly found he owned and had annotated Mariana's book. While Mariana condemned Ravaillac (stating Henry wasn't a true tyrant by his definition), the damage was done. The book became seen as the intellectual inspiration for regicide.
      *   **Jesuit Controversy:** Mariana was a prominent **Jesuit**. The Society of Jesus was already viewed with deep suspicion by many secular authorities (especially Gallican France and Protestant states) and even some within the Church. They were seen as ultra-montane (strongly pro-papal authority), intellectually sophisticated, and potentially dangerous political operators. Mariana's book seemed to confirm these fears, painting the Jesuits as endorsing regicide against monarchs deemed insufficiently Catholic or tyrannical by their standards.
      *   **Secular Authority Pushing Back:** Monarchs across Europe, regardless of religion, had a vested interest in condemning *any* doctrine justifying regicide. The condemnation in Paris (by the *Parlement*, the secular court, not primarily the Church) was a powerful statement by the French state asserting the absolute inviolability of the monarch and crushing ideologies threatening royal power. It was a warning to the Jesuits and other potential plotters.

  **The Crucial Difference in a Nutshell:**

  *   **Aquinas:** Tyrannicide is theoretically possible *only* as a last resort, *preferably* initiated by public authority, discussed cautiously within a broader theological framework on sedition (13th Century Feudal Context).
  *   **Mariana:** Tyrannicide by a *private citizen* is explicitly justified and potentially heroic under specific conditions, presented practically in a handbook for rulers during an era of rampant religious-political violence and assassinations (16th Century Wars of Religion Context).

  **Why Mariana was "More Dangerous":**

  1.  **Explicit Endorsement of Private Action:** He removed Aquinas's crucial caveat about public authority.
  2.  **Practical Handbook:** It wasn't abstract theology; it was political advice in a widely circulated book.
  3.  **Explosive Timing:** Published and read during a period where assassination was a common political reality.
  4.  **Association with Extremism:** Linked (fairly or not) directly to a high-profile regicide (Henry IV).
  5.  **Jesuit Label:** Made it part of a larger, feared political movement.
  6.  **Monarchical Backlash:** Triggered a powerful reaction from secular authorities defending their absolute power.

  Mariana didn't invent the idea from whole cloth, but by making the private citizen's role explicit, practical, and heroic within the volatile context of the late 16th century, he transformed a cautious, theoretical possibility in Aquinas into what authorities perceived as a dangerous manual for revolutionaries and assassins. The burning in Paris was the state's emphatic rejection of that perceived threat.
