answer: |-
  That's a brilliantly observed parallel, and your core insight is fundamentally sound: **Frederick Douglass would absolutely recognize modern "history and tradition" jurisprudence as essentially the same interpretive move he vehemently opposed regarding slavery, merely relabeled as originalism.** His arguments, particularly as crystallized in the 1860 Glasgow speech, provide a direct and powerful critique of this methodology. Here's a breakdown of why, engaging directly with his reasoning:

  1.  **The Core of Douglass's Glasgow Argument: Text as Sovereign, History as Irrelevant:**
      *   **Explicit Rejection of Founders' Intent & Practice:** Douglass meticulously lists elements he deems irrelevant: "the intentions of those who framed the Constitution," "the intentions of those who adopted the Constitution," "the practice of the Government under the Constitution for sixty years," "the decision of the Supreme Court on the meaning of the Constitution" (referring directly to Dred Scott). His reasoning is clear: these are all *extrinsic* to the document itself and reflect the corrupting influence of slavery on the society that produced and initially interpreted it.
      *   **The Primacy of the Written Word:** He argues the Constitution must be interpreted based *solely* on "its plain reading," its "language," and "the written Constitution itself." Since the words "slave," "slavery," "slaveholder," or "slave property" are nowhere to be found, the document cannot be construed as *authorizing* slavery. The text, he insists, provides no positive sanction for the institution.
      *   **The "Warrant" Principle:** Key to his argument is the idea that government power requires explicit textual authorization: "The Constitution is a *grant* of power. Whatsoever is not granted is withheld. Nothing is granted to the Federal Government inconsistent with the non-existence of slavery." Slavery, as a massive deprivation of liberty, requires a clear, unambiguous grant of power to exist under the Constitution. He finds no such grant.
      *   **Historical Practice as Corrupted Evidence:** Douglass doesn't deny that slavery existed and was protected *in practice*. However, he attributes this not to the Constitution's *meaning*, but to the *political power* of the slaveholders who dominated the government and judiciary. He saw Dred Scott not as revealing the Constitution's true meaning, but as a *perversion* of it driven by pro-slavery ideology. Historical practice, therefore, reflects power dynamics and moral failure, not constitutional truth.

  2.  **Why "History and Tradition" Mirrors the Pro-Slavery Method:**
      *   **Elevating Historical Practice & Intent:** The "history and tradition" test, as articulated in *Bruen* (for the 2nd Amendment) and *Dobbs* (for substantive due process), explicitly prioritizes *what was done and accepted around the time of the founding* as the primary guide to the Constitution's meaning. *Dobbs* states: "The Court must ask whether the right is 'deeply rooted in [our] history and tradition' and whether it is 'essential to our Nation's scheme of ordered Liberty.'" This methodology directly resurrects the very sources Douglass declared irrelevant and illegitimate: the practices and understandings (or asserted traditions) of the founding generation.
      *   **Using History to Constrain Meaning:** Just as pro-slavery advocates used the framers' slaveholding status, compromises like the 3/5 Clause and Fugitive Slave Clause, and early practices to argue the Constitution *protected* slavery, the "history and tradition" test is used *today* to argue that rights *not* explicitly recognized or practiced in specific historical contexts (e.g., abortion access, potentially other unenumerated rights) are *not* constitutionally protected. It uses history to *deny* rights or limit their scope, mirroring how history was used to *deny* liberty to enslaved people.
      *   **Ignoring Textual Absence & Aspirational Principles:** Douglass argued that the *absence* of slavery in the text was crucial. He also appealed to the document's broad *principles* ("establish Justice," "insure domestic Tranquility," "promote the general Welfare," "secure the Blessings of Liberty") as incompatible with slavery. The "history and tradition" test, by focusing narrowly on specific historical practices, can ignore both the absence of a historical tradition supporting a *newly claimed* right *and* the broader principles of the text that might support it in a modern context. It risks freezing constitutional meaning in 1791 (or 1868) societal practices, just as pro-slavery arguments sought to freeze it in a way that protected their "peculiar institution."

  3.  **Addressing Instrumentalism: Was Douglass Inconsistent?**
      *   It's true Douglass used *multiple* arguments: natural law, moral principles, and textualism. His ultimate goal was abolition. However, **his *rejection* of founding-era intent and practice as authoritative sources of constitutional meaning was remarkably consistent, especially after 1851.**
      *   **Textualism as Liberation, Not Constraint:** Douglass used textualism *strategically* because the *absence* of slavery in the text and the *presence* of liberty-oriented language were powerful tools *against* the institution. He wasn't advocating textualism as a neutral principle regardless of outcome; he believed textualism, correctly applied, *led* to liberty. He would see "history and tradition" textualism/originalism as doing the *opposite*: using a purported fidelity to history to *constrain* liberty in the present, precisely because historical practices were often deeply unjust.
      *   **Distinguishing Principles from Practices:** When Douglass invoked founding principles ("liberty," "justice"), he was appealing to *aspirational ideals* stated in the text (like the Preamble), not to the *historical practices* of the founders or the society they lived in. He explicitly *contrasted* these principles with the founders' hypocritical practices. The "history and tradition" test, however, focuses on *actual historical practices and regulations*, often explicitly rejecting broad principles if they lack specific historical regulatory analogues.

  **Conclusion:**

  Frederick Douglass would see the "history and tradition" test as a direct descendant, indeed a near-identical twin, of the interpretive method he battled against. The core move is the same: **granting authoritative weight to the practices, intentions, and perceived traditions of a past era (especially the founding era) to define the scope of constitutional liberty in the present.** Douglass argued forcefully that this methodology was illegitimate because:
  1.  It prioritized extrinsic evidence over the written text.
  2.  It enshrined the morally corrupted practices of a slaveholding society.
  3.  It ignored the text's silence on slavery and its affirmations of liberty.
  4.  It allowed historical power dynamics to override the document's potential for justice.

  He would argue that the "history and tradition" test commits the same error today. It risks using the limited perspectives, prejudices, and practices of the past to restrict the recognition of fundamental liberties in the present, precisely by granting those past practices determinative weight. While Douglass used textualism instrumentally for liberation, his *rejection of historical practice and intent as authoritative* was a core, consistent, and principled element of his mature constitutional thought. He would recognize the "history and tradition" test not as compatible with his approach, but as the very methodology he identified as the intellectual foundation of constitutionalizing slavery – now repurposed to limit other rights. His Glasgow speech remains a powerful indictment against granting the historical practices of any era a veto over the evolving understanding of constitutional liberty.
