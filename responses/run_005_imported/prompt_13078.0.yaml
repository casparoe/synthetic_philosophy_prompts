  ## Conclusion

  The rational hazard-rate uncertainty model shows that hyperbolic discounting and preference reversals can emerge from rational Bayesian updating. This challenges the view that hyperbolic discounting is necessarily an irrationality. However, it does not eliminate the need for precommitment devices. The agent's preferences at different times are in conflict because of the updating of information, and the agent at an earlier time might want to bind the future self to avoid a choice that the future self would prefer.

