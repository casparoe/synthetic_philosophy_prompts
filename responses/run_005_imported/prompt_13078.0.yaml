    EU(choose at t1) = P(survive to t1) * max{ EU(Y at t1), EU(X at t2 | survive to t1) }

  But note that at t0, the agent does not know the hazard rate, so they must take an expectation. This is complex.

  The key point is that the agent's preferences are dynamically consistent in the sense of obeying the axioms of rational choice at each time given the information available. Therefore, the agent is not vulnerable to money pumps in the same way as a time-inconsistent agent. However, the agent might still make choices that, ex post, they regret? Actually, no: at each time, the agent is acting on the best available information.

  But note: the agent at t0 might wish to bind themselves to the plan of waiting for X at t2. Why? Because if they don't, they will choose Y at t1 and then regret it at t2 (if they survive) because they got Y instead of X. However, the agent at t1 does not regret the choice: at t1, they prefer Y at t1 to X at t2. So there is no regret in the usual sense.

