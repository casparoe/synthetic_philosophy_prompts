  We are going to build the argument that hyperbolic discounting can arise from a rational Bayesian agent who is uncertain about the hazard rate (the instantaneous probability of the reward disappearing). The key idea is that as time passes without the reward disappearing, the agent updates beliefs about the hazard rate, leading to a discount function that appears hyperbolic.

  ## The Model

  Assume that the agent is uncertain about the true hazard rate λ. The hazard rate is the constant rate at which the reward might disappear (due to death, offer withdrawal, etc.). The agent has a prior distribution over λ. A common choice for mathematical tractability is the Gamma distribution, which is conjugate to the exponential distribution (which models the time until the hazard occurs).

  Let the prior be λ ~ Gamma(α, β), so the prior mean is α/β and the variance is α/β².

  The probability that the reward is still available at time t is the survival function: S(t) = P(no event by time t). For a fixed λ, S(t) = exp(-λ t). But since λ is unknown, the agent uses the posterior distribution.

  Suppose the agent has survived until time t without the hazard occurring. The likelihood of observing no event until time t (i.e., the event time T>t) for a given λ is exp(-λ t). The posterior distribution of λ given T>t is:

    p(λ | T>t) ∝ p(T>t | λ) * p(λ)
               ∝ exp(-λ t) * λ^{α-1} exp(-β λ)
               = λ^{α-1} exp(-(β+t) λ)

  This is the kernel of a Gamma(α, β+t) distribution.

  The survival probability at time t (from the perspective of time 0) is the probability that the reward is still available at t. But note that at time 0, the agent has not yet observed any survival. So we compute:

    S(t) = P(T>t) = ∫ P(T>t | λ) p(λ) dλ
          = ∫ exp(-λ t) * [β^α / Γ(α)] λ^{α-1} exp(-β λ) dλ
          = [β^α / Γ(α)] ∫ λ^{α-1} exp(-(β+t) λ) dλ

  We recognize the integral as proportional to the normalizing constant of a Gamma(α, β+t) distribution. Specifically, the integral is Γ(α) / (β+t)^α. Therefore:

    S(t) = [β^α / Γ(α)] * [Γ(α) / (β+t)^α] 
          = [β / (β+t)]^α

  So the discount function (which gives the present value of a reward at time t) is:

    D(t) = S(t) = [β / (β+t)]^α

  This is a hyperbolic discount function. Specifically, it is of the form 1/(1+k t)^α, which is hyperbolic (and for α=1, it becomes 1/(1+(1/β)t) so k=1/β).

  ## Preference Reversals

  Now, consider the standard preference reversal scenario. At time 0, the agent is offered:

    Option A: a small reward at time t_s (sooner)
    Option B: a large reward at time t_l (later, with t_l > t_s)

  At time 0, the agent prefers B if:

    D(t_l) * L > D(t_s) * S

  where L and S are the magnitudes of the large and small rewards.

  But then, at a later time τ (where 0 < τ < t_s), the agent is offered the same two rewards (now at times t_s - τ and t_l - τ). The agent will prefer A (the small reward) at time τ if:

    D(t_s - τ) * S > D(t_l - τ) * L

  This reversal can occur even when the rewards are equally certain? In the standard experiment, the rewards are guaranteed. But note: in our model, the agent is updating the hazard rate even though the experimenter stipulates the rewards are certain. Why? Because the agent might not fully trust the setup? The agent might have a prior that includes the possibility of failure (e.g., the experimenter might cancel, or the agent might get hit by a bus). So even if the experimenter says "guaranteed", the agent might still have a prior with some hazard.

  Moreover, as time passes without the hazard occurring, the agent becomes more confident that the hazard rate is low. This leads to a discount function that is initially steep (because the hazard is uncertain and the agent is pessimistic) and then flattens out (as the agent becomes more confident that the hazard rate is low). This can cause the discount function to be steeper in the near term and flatter in the long term, which is the hallmark of hyperbolic discounting and can lead to preference reversals.

  Let's see with an example. Suppose:

    α = 1, β = 10 (so prior mean hazard rate is 0.1 per unit time)

  Then D(t) = 10/(10+t)

  At time 0, consider:

