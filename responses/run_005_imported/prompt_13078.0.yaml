    The agent is at time 5. The small reward is at time 5 (now) and the large at time 10 (in 5 units).

    D(0) = 10/(10+0) = 1 (for the small reward now)
    D(5) = 10/(10+5) ≈ 0.6667 (for the large reward)

    Value of A: 100 * 1 = 100
    Value of B: 200 * 0.6667 ≈ 133.34 -> still prefers B.

  But we need a reversal. Let me adjust parameters.

  Suppose we set α=2, β=10. Then D(t) = [10/(10+t)]^2.

  At time 0:

    D(5) = (10/15)^2 = (2/3)^2 ≈ 0.4444 -> 100*0.4444=44.44
    D(10)=(10/20)^2=0.25 -> 200*0.25=50 -> prefers B (50>44.44)

  Now at τ=5 (so the small reward is immediate, the large at 5):

    D(0)=1 -> 100
