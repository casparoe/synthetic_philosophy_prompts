  ## Addressing the Hole: Equally Certain Rewards

  In the standard experiment, the rewards are stipulated as equally certain. But note that the agent's uncertainty is about the hazard rate that affects both rewards. However, the updating occurs as time passes. At time 0, the agent's discount function is [β/(β+t)]^α for both. But when we get to time τ, the discount function for the remaining time is [ (β+τ) / (β+τ + s) ]^α for a delay s. The key is that the discount function from the perspective of time τ is:

    D_τ(s) = [ (β+τ) / (β+τ + s) ]^α

  This is still hyperbolic in the delay s. The hazard rate uncertainty affects the entire stream. The agent becomes more confident that the hazard rate is low as time passes, but the discounting of future delays is still hyperbolic.

  So even though both rewards are equally certain, the hazard rate uncertainty (and the updating) leads to a discount function that is hyperbolic, which can cause reversals.

