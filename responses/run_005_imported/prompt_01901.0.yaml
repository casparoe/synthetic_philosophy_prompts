  ## Dialogue: Smoke & Mirrors at the Party

  *(The scene: A bustling party, music thumping. Maya, looking slightly flushed and guilty, exhales a plume of smoke near a group of friends before quickly moving away. Philosopher (P) and Economist (E), mutual friends who witnessed her breakfast declaration, stand near the drinks table, watching.)*

  **Philosopher:** (Sighing, swirling their drink) There it is. Just this morning, resolute Maya: "I'm done, no more cigarettes." Now? The pull of the party, the offered cigarette... weakness of will, plain and clear. Holton nailed it – the resolution abandoned the moment friction appeared.

  **Economist:** (Raising an eyebrow) "Weakness of will"? That’s a loaded term. Look at the timeline. At breakfast, quitting *next month* was a distant, abstract reward. Now, *right now*, the immediate relief, the social ease of accepting that cigarette Maya’s offered? Its value is massively inflated. Hyperbolic discounting predicts *exactly* this preference reversal. It’s not weakness; it’s predictable discounting. Past-Maya overestimated future resolve, as humans always do.

  **P:** Predictable? Perhaps. But Holton’s point is precisely that predictability *isn't* the whole story. Your discounting curve explains the *shift in preference*, sure. But it renders Maya’s resolution utterly inert! It was a *commitment device* she constructed for herself. Your model treats that resolution like any other preference – easily overridden when a stronger, immediate preference arises. But resolutions *aren't* just preferences! They’re attempts to *bind* our future selves against precisely these predictable shifts. The "weakness" isn't just the shift; it's the failure of that binding mechanism *itself*. How does your curve capture the *distinctive force* a resolution is supposed to have, or the specific *guilt* she’s radiating now?

  **E:** Ah, the "binding" and the guilt. You posit this special faculty. But isn't the resolution itself just a *past preference* expressed with emphasis? Past-Maya strongly preferred a smoke-free future. Current-Maya, facing immediate stress and temptation, strongly prefers the cigarette. The "binding" fails because the resolution wasn't a magical lock; it was just Past-Maya’s strong preference trying (and failing) to outweigh Future-Maya’s anticipated strong preference. The guilt? That’s just the conflict between Past-Maya’s stated goal and Current-Maya’s action – a conflict your "faculty of will" mysteriously failed to resolve. Hyperbolic discounting explains *why* the conflict arose *and* why Current-Maya’s preference won. What extra explanatory power does "will" provide beyond labeling the moment she succumbed?

  **P:** It explains the *character* of the failure! Maya didn’t just *change her mind* after careful reconsideration. She *acted against her own settled judgment*. The resolution *was* her judgment about what’s best, held *in advance* to counter the very lure of the immediate. Your account flattens this. If the resolution is just another preference, why does breaking it feel like a *betrayal of self*, not just a change of heart? How does hyperbolic discounting account for the *intentional structure* of a resolution – the "I *will* do X *despite* anticipated temptation Y"? Your curve only sees fluctuating preference strengths; it’s blind to the *deliberate project* of self-governance that resolutions represent. Isn't reducing it all to shifting utilities ignoring the phenomenology Maya herself is experiencing?

  **E:** You say "settled judgment," but was it truly settled? Or was it just a preference stated in a context devoid of the immediate temptation? Hyperbolic discounting *predicts* that judgments made "cold" (at breakfast) won't hold "hot" (at the party). The feeling of betrayal? That stems from the *conflict* generated by the discounting process itself – the awareness that Past-Maya’s plan was foiled by predictable time-inconsistency. As for the "project of self-governance," Ainslie argues resolutions *work* precisely *by* harnessing hyperbolic discounting – making a credible *immediate* cost (like guilt, or a pre-commitment like throwing out cigarettes) outweigh the immediate reward. Maya failed because she didn’t create a strong enough *immediate* counter-incentive. Where’s the evidence for a distinct *capacity* failing, rather than just an under-powered commitment strategy? Isn't invoking "will" just a way to blame Maya for a predictable cognitive bias?

  **P:** But that’s precisely Holton’s challenge! If resolutions are *just* strategies manipulating discounting curves, then "strength of will" is just having effective tactics. But Maya *intended* her resolution to be more than a tactic; it was an expression of her *judgment* about her good. The failure feels like a collapse of *agency*, not just a failed strategy. Your model makes resolutions epiphenomenal – they only work if backed by immediate costs, rendering the resolution itself explanatorily redundant. Yet, people *experience* resolutions as sources of motivation *distinct* from immediate rewards or punishments. How does hyperbolic discounting explain the *motivational oomph* people *feel* from a resolution itself, before any consequences kick in, if it’s not a distinct psychological element?

  **E:** (Pauses, takes a sip) The "oomph"? Couldn't that just be the *salience* of the future reward *in that moment* of resolution-making? The emotional weight of declaring it? That salience fades as time passes and immediate alternatives loom. The "distinct motivation" you perceive might just be the peak of the discounting curve for the future reward *at the moment of commitment*. As time passes, that peak drops relative to the immediate reward. The resolution *feels* powerful when made because the future reward *is* heavily weighted *then*. Its perceived weakness later is the *discounting* in action. You mistake the intensity of a temporally local preference for a separate faculty. Isn't Occam's razor on the side of the simpler explanation – shifting weights on a curve – without needing an extra, unmeasurable "will"?

  **P:** (Watches Maya stub out the cigarette, looking more guilty) Perhaps. But watching Maya, I still see more than a shifting preference. I see someone who *knew* this would happen, tried to arm herself against it with a resolution, and still found herself powerless in the moment against her own better judgment. The curve predicts the *outcome*, Holton tries to capture the *internal struggle* and the nature of the defeat. Maybe we need both to understand why Maya looks quite so miserable right now.

  **E:** (Following P's gaze) Agreed on her misery. Whether it's a predictable discounting failure or a collapse of a distinct faculty... the result is the same. Poor Maya. And poor us, trying to model the messiness of being human.

  *(They both watch Maya disappear into the crowd, the scent of smoke lingering in the air.)*

  **Key Substantive Difficulties Raised:**

  *   **Philosopher to Economist:** Challenges the inertness of resolutions in the hyperbolic model (failure of binding), inability to explain the specific *character* of failure (acting against settled judgment vs. preference shift), and neglect of the intentional structure & motivational force *felt* from resolutions themselves.
  *   **Economist to Philosopher:** Challenges the need for a distinct faculty ("will") when conflict/guilt can arise from discounting itself, questions whether resolutions are truly more than past preferences or effective commitment strategies harnessing discounting, and argues the "oomph" of a resolution is just the temporal peak of the discounted future reward.
