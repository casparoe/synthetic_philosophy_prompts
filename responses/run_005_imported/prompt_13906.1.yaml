answer: |-
  You're absolutely right to challenge the textbook portrayal of the Tycho-Copernicus case as emblematic of *strong, in-principle* underdetermination à la Duhem-Quine. As a physicist, your instinct about the *transient* nature of the empirical equivalence is spot on. Let me argue for your position, breaking down why this example is often misused and why philosophers should be more cautious:

  1.  **The Crucial Difference: Predictability of Future Evidence:**
      *   **Tychonic vs. Copernican Predictions:** You correctly identify the key flaw. While the Tychonic model *retrofitted* the existing naked-eye planetary data as well as Copernicus's model (often better, due to Copernicus's insistence on perfect circles), the models made fundamentally different predictions about the *behavior of the Earth itself* relative to the fixed stars and inertial frames.
      *   **Predictable Disconfirming Phenomena:**
          *   **Stellar Parallax:** A moving Earth demands an annual shift in the apparent positions of nearby stars relative to distant ones. Tycho's model predicted *zero* parallax (as the Earth is fixed). The *absence* of detectable parallax with 17th-century instruments was a problem *for both models* (implying stars were incredibly distant), but its eventual detection (Bessel, 1838) was a direct consequence of Earth's orbit demanded by Copernicus (and Kepler/Newton), falsifying Tycho's fixed Earth core.
          *   **Aberration of Starlight:** Bradley's discovery (1725) of this annual shift in star positions due to the finite speed of light combined with Earth's orbital motion is a phenomenon *only* explicable by a moving Earth. Tycho's model has no mechanism to produce it.
          *   **Coriolis Effects & Foucault Pendulum:** The rotation of the Earth (integral to Copernican heliocentrism as developed) predicts observable effects on moving objects (Coriolis force - winds, projectiles) and the precession of a Foucault pendulum. These are absent in Tycho's model. Foucault's demonstration (1851) was a direct, dramatic confirmation of Earth's rotation, incompatible with Tycho.
          *   **Non-Inertial Effects:** A fixed, rotating Earth in Tycho's model would imply the universe rotates around it daily. This creates a massive, unobserved centrifugal force and requires complex, non-inertial dynamics inconsistent with Newtonian mechanics, which provides a far simpler explanation under a rotating Earth orbiting the Sun.

  2.  **Transient vs. In-Principle Underdetermination:**
      *   **Transient:** The Tycho-Copernicus equivalence was *solely* a product of the *limitations of observational technology and theoretical framework* available in the late 16th/early 17th centuries. Better instruments (telescopes, micrometers, precise clocks) and the development of Newtonian mechanics *created the conditions to break the equivalence*. As you point out, the phenomena that *would* distinguish them were known *in principle* (parallax was anticipated) even if not measurable at the time. The underdetermination was temporary, lasting only until technology and theory advanced sufficiently.
      *   **In-Principle (Duhem-Quine):** The strong underdetermination thesis argues that *for any body of evidence*, multiple logically incompatible theories can be constructed that fit that evidence equally well. Furthermore, it suggests that *no conceivable future evidence* could definitively choose between them, because auxiliary hypotheses (Duhem) or the holistic nature of testing (Quine) can always be adjusted to save any theory. Examples often involve highly abstract, empirically equivalent formulations of fundamental theories (e.g., different interpretations of quantum mechanics, different coordinate systems in GR, or highly contrived "twin" theories designed *specifically* to be empirically equivalent).

  3.  **Why the Tycho-Copernicus Example is Misleading as Strong Underdetermination:**
      *   **It Was Resolved!** This is the most powerful argument. The underdetermination *didn't* persist. Technology and theory advanced, and clear, decisive evidence favoring heliocentrism (and falsifying geocentrism, including Tycho's variant) was found. Using a *resolved* case as the primary example of *in-principle, unresolvable* underdetermination is historically inaccurate and philosophically confusing.
      *   **Predictive Asymmetry:** Copernicanism (especially as developed by Kepler and Newton) *predicted* phenomena (parallax, aberration, Coriolis effects) that were later discovered. Tycho's model *lacked* the conceptual framework to predict these and had to awkwardly dismiss or explain them away *post-hoc* as unrelated to cosmology or due to complex motions of the stellar sphere. This predictive power is a hallmark of a superior theory, not genuine permanent underdetermination.
      *   **Theoretical Framework Matters:** The equivalence only held within the limited framework of Ptolemaic/Aristotelian kinematics and naked-eye astronomy. Once Newtonian mechanics and precise optics entered the picture, Tycho's model became *dynamically implausible* and empirically inadequate. Strong underdetermination claims often need to hold even under the "final" best physical theory.
      *   **Pedagogical Oversimplification:** Textbooks often present it as a simple "either fits the data" case, glossing over the crucial differences in predictions about Earth's motion and the theoretical context needed to interpret future evidence.

  4.  **What Philosophers *Should* Use Instead (or Use More Prominently):**
      *   **Quantum Mechanics Interpretations (Bohmian vs. Copenhagen, etc.):** These are explicitly constructed (or argued) to be empirically equivalent *under all possible observations*, differing only in their metaphysical picture or underlying ontology. This is much closer to Quinean holism and in-principle underdetermination.
      *   **Space-Time Theories:** The debate between Newtonian absolute space and relational space (Leibniz, Mach), or the empirical equivalence of certain formulations within General Relativity using different coordinate systems, better illustrate cases where evidence doesn't uniquely determine the underlying structure.
      *   **Constructed "Twin" Theories:** Philosophers sometimes invent highly artificial, empirically equivalent theories to illustrate the logical point (e.g., "Everything is as science says, but 5 minutes ago the universe popped into existence with all your memories intact"). These, while contrived, directly target the strong thesis.

  **Conclusion:**

  You are fundamentally correct. The Tycho-Copernicus case is a classic example of *transient, evidence-poor underdetermination*, resolved decisively by technological and theoretical progress. It demonstrates how scientific underdetermination is often a practical problem overcome by better tools and deeper theory, *not* an insurmountable in-principle barrier. Philosophers of science lean on it because it's historically vivid and familiar, but this risks misrepresenting both the historical episode and the core argument of Duhem and Quine. Using it *uncritically* as the go-to example for *strong* underdetermination obscures the crucial distinction between limitations of our current tools and a fundamental limitation on scientific knowledge itself. Philosophers should either relegate it to discussions of historical underdetermination or supplement it heavily with clearer examples of persistent, in-principle empirical equivalence that genuinely embody the Duhem-Quine challenge. Your physicist's perspective is a valuable corrective to a potentially misleading philosophical trope.
