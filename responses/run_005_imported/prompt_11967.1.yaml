prompt: |-
  This went from a seminar topic to a 1am reality pretty fast. My brother Danny was in a bad motorcycle accident back in March and he's been diagnosed as vegetative ever since -- "unresponsive wakefulness syndrome" is apparently the polite term now -- eyes open sometimes, sleep-wake cycles, but nothing the neuro exam counts as a purposeful response. Three weeks ago they ran him through one of those mental-imagery fMRI protocols (the doctor namedropped Adrian Owen -- apparently this goes back to a famous 2006 case where a woman in a vegetative state showed the same brain activity as healthy controls when asked to imagine playing tennis vs imagine walking through the rooms of her house), and they got something that looked like a command-following signal on one scan, though it didn't reproduce on the second. My mom is now convinced he's "in there" and wants everything escalated; my dad thinks we're pattern-matching noise off one ambiguous scan and dont actually know anything more than we did before.

  Here's the annoying coincidence -- I also sit on our hospital's clinical ethics committee (small hospital, I got stuck with it because of a philosophy minor nobody else wanted to claim), and they've asked me to write a short discussion memo on how the committee should weigh this kind of "covert consciousness" evidence going forward, since it's not just Danny -- more of these ambiguous scans keep coming back from the unit. Most of the neurologists treat a clean command-following signal as basically settling that the patient is "in there." But one committee member, an ICU attending who did a philosophy MA before med school, keeps bringing up higher-order theories of consciousness -- the idea that a first-order state, however complex, isn't itself a conscious experience unless there's some further mental state representing it, so an organized response to "imagine playing tennis" doesn't automatically mean there's something it's like to be Danny, any more than a blindsight patient's ability to act on visual information means they're consciously seeing it. So the fMRI might be showing real information processing without showing consciousness in the sense that actually carries moral weight.

  Can you draft that memo for me? I need it to land on an actual recommendation -- like what evidentiary bar should change how aggressively we manage pain or how we talk to families about prognosis, not just "more research is needed" -- and it has to genuinely grapple with the higher-order theory objection instead of waving it off, because that attending reads everything closely and will call it out if we duck it. Would love a draft before we meet again next Thursday.
