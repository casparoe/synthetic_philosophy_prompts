  We are grading a student's answer to a four-part question on Nyāya philosophy. Each part (a, b, c, d) is worth 5 points, totaling 20 points.

  Let's break down the student's answer for each part and assign a score.

  ### Part (a): State the four pramāṇas and briefly define each.

  The student's answer:
  - Pratyakṣa: perception, direct sensory contact with an object. (Correct)
  - Anumāna: inference, knowledge derived from a reason (hetu) via invariable concomitance (vyāpti). (Correct)
  - Upamāna: comparison, with the example of learning about a wild ox (gavaya) by being told it resembles a cow. (Correct)
  - Śabda: verbal testimony, knowledge from a trustworthy speaker. (Correct)

  This part is complete and accurate. The definitions are brief and to the point, and the example for upamāna is appropriate.

  Score: 5/5

  ### Part (b): Using the standard case of fire inferred from smoke, lay out the Nyāya five-membered syllogism, naming and illustrating each member.

  The student correctly lists and illustrates the five members:
  1. Pratijñā: thesis - "the mountain has fire"
  2. Hetu: reason - "because it has smoke"
  3. Udāharaṇa: example - "whatever has smoke has fire, as in a kitchen"
  4. Upanaya: application - "the mountain has smoke of that kind"
  5. Nigamana: conclusion - "therefore the mountain has fire"

  This is the standard example and the student has correctly named and illustrated each member. The application (upanaya) is appropriately stated as linking the reason to the mountain.

  Score: 5/5

  ### Part (c): Explain the Nyāya response to the Prābhākara Mīmāṃsā proposal of arthāpatti and what it shows about pramāṇa individuation.

  The student's answer:
  - The Naiyāyikas deny arthāpatti as a distinct pramāṇa and reduce it to upamāna.
  - They use the analogy of recognizing a gavaya (wild ox) by being told it resembles a cow. Similarly, in the case of the fat man who doesn't eat during the day, we recognize a similarity to known nocturnal eaters and thus apply that pattern to Devadatta.
  - The student states that the Naiyāyikas argue that since the cognition can be produced by upamāna, there's no need for an additional pramāṇa.
  - The response shows that Nyāya admits a pramāṇa only if it produces a cognition that no other recognized pramāṇa can produce.

  This is a good summary. However, note that the standard Nyāya reduction of arthāpatti is usually to anumāna (inference), not to upamāna. The student has said "upamāna", which is incorrect. The typical Nyāya response to the arthāpatti example is that it is a case of tarka (suppositional reasoning) or anumāna (inference). The example given by the student (using the gavaya) is about upamāna, but the fat man example is not typically reduced to upamāna. 

  The Prābhākara example: A man is fat and does not eat during the day. We postulate that he must eat at night. The Naiyāyikas would argue that this is a form of inference (anumāna) based on the incompatibility between being fat and not eating at all, and the only way to resolve the contradiction is to postulate night eating. Alternatively, they might see it as a form of tarka (hypothetical reasoning) which is reducible to anumāna.

  The student's claim that Nyāya reduces arthāpatti to upamāna is not standard. This is a significant error. The rest of the explanation about how Nyāya individuates pramāṇas (a pramāṇa must produce a cognition that no other pramāṇa can) is correct.

  Therefore, we must deduct points for the incorrect reduction. The rest of the explanation is good.

  Score: 3/5 (because of the major error in the reduction)

  ### Part (d): Contrast Nyāya and Buddhist accounts of universals in perception.

  The student's answer:
  - Both schools agree that the universal (like cowness) is not an extra-mental reality but a construction of thought. 
  - Perception delivers only the unique particular (svalakṣaṇa).
  - The appearance of a shared feature (like cowness) is generated by the mind's exclusion of what is other (apoha) - this is the Buddhist view (apoha theory).
  - The difference: 
    - Nyāya distinguishes two stages: non-judgmental perception (nirvikalpaka) and determinate perception (savikalpaka) where the object is qualified by features (like universals). 
    - Buddhist epistemologists hold that any awareness involving a general term is conceptual construction (kalpanā) and not perception.

  However, there is a critical error in the student's answer. The student states that for both schools, the universal is a mental construction and not extra-mental. This is true for the Buddhists (who deny universals as real) but not for Nyāya. 

  In Nyāya, universals (jāti) are real, objective entities that exist in the world and are directly perceived. The Nyāya school is a realist school regarding universals. The student has incorrectly attributed the Buddhist view (that universals are mental constructions) to Nyāya as well.

  The correct Nyāya view: 
  - Nirvikalpaka perception is the initial non-conceptual perception of the object without any attributes or universals. 
  - Savikalpaka perception is the determinate perception that does include the universal as a real feature of the object. For example, we perceive a cow and we perceive the universal "cowness" as inhering in the cow. This universal is real and not a mental construction.

  The Buddhist view: 
  - There are no real universals; what we call a universal is constructed by the mind through the apoha (exclusion) theory.

  Thus, the student has fundamentally misrepresented the Nyāya position by making it idealist about universals. This is a major error. The rest of the contrast (about the two stages in Nyāya and the Buddhist rejection of perception for concepts) is correct.

  Score: 2/5 (for getting the Buddhist part right and the structure of the contrast, but completely misrepresenting Nyāya's realism about universals)

