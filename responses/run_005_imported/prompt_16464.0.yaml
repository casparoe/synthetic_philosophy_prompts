answer: |-
  Your skepticism is warranted—Goodhart's and Campbell's Laws are distinct both in origin and mechanism, and Garrabrant's taxonomy reveals a critical divergence. Let's dissect them through their original texts and map them to the four Goodhart variants (regressional, causal, extremal, adversarial). The verdict: **Campbell's Law describes primarily *adversarial* Goodhart, while Goodhart's original formulation aligns with *regressional* Goodhart. They are not interchangeable.**

  ---

  ### **1. Goodhart's Law (1975): The Regressional Core**
  - **Original Context**: Charles Goodhart's essay "Monetary Relationships: A View from Threadneedle Street" focused on UK monetary policy. He observed that *statistical correlations between monetary aggregates (e.g., M3 money supply) and policy goals (e.g., GDP growth) broke down once the Bank of England targeted those aggregates*.
  - **Key Mechanism**:  
    > *"Any observed statistical regularity will tend to collapse once pressure is placed upon it for control purposes."*  
    This is **regressional Goodhart**: The proxy (monetary aggregate) was never causally linked to the true target (economic health). It was a *coincidental correlation* under historical conditions. When optimized, the correlation vanishes because the proxy lacks a stable causal relationship with the target.  
  - **Garrabrant Taxonomy**:  
    - **Regressional**: The proxy works only in the distribution it was measured in. Optimization pushes the system into a new regime where the correlation degrades.  
    - *Not adversarial*: No actors "game" the metric; the breakdown is structural.  
    - *Not extremal*: Goodhart didn't focus on edge cases or tail events.  
    - *Not causal*: The proxy isn't a cause of the target; it’s a coincidental indicator.

  ---

  ### **2. Campbell's Law (1976): The Adversarial Engine**
  - **Original Context**: Donald Campbell's paper "Assessing the Impact of Planned Social Change" addressed high-stakes testing in education. He argued that quantitative metrics (e.g., standardized test scores) corrupt social systems when tied to consequences.  
  - **Key Mechanism**:  
    > *"The more any quantitative social indicator is used for social decision-making, the more subject it will be to corruption pressures and the more apt it will be to distort and corrupt the social processes it is intended to monitor."*  
    This is **adversarial Goodhart**: Actors (teachers, administrators, students) *deliberately manipulate the metric* to avoid penalties or gain rewards, often sabotaging the true goal (e.g., real learning).  
  - **Garrabrant Taxonomy**:  
    - **Adversarial**: Humans (or agents) exploit loopholes in the metric.  
    - *Distinct from regressional*: Campbell assumes the metric *could* work if not gamed (unlike Goodhart's statistical breakdown).  
    - *Overlap with causal?* Campbell notes metrics may start as valid causal proxies (e.g., tests measure knowledge) but become invalid due to gaming.  
    - *Not extremal/regressional*: The focus is on strategic manipulation, not statistical shifts.

  ---

  ### **3. Critical Divergence: Mechanism Matters**
  | **Aspect**               | **Goodhart's Law (1975)**            | **Campbell's Law (1976)**             |
  |--------------------------|--------------------------------------|---------------------------------------|
  | **Core Mechanism**       | Statistical correlation collapses (regressional) | Actors corrupt the metric (adversarial) |
  | **Actor Intent**         | None; structural failure             | Deliberate gaming by humans           |
  | **Proxy Validity**       | Coincidental, non-causal             | Initially causal, corrupted by use    |
  | **Garrabrant Bucket**    | **Regressional**                     | **Adversarial** (with causal elements)|

  - **Why Conflation Happens**: Both warn against optimizing proxies, but:  
    - Goodhart’s Law is about **epistemic limitations** (metrics are fragile correlations).  
    - Campbell’s Law is about **perverse incentives** (metrics invite sabotage).  
    The pithy Strathern quote ("when a measure becomes a target...") obscures this by sounding universal.

  ---

  ### **4. Campbell's Nuance: Beyond Adversarial?**
  Campbell *does* nod to non-adversarial effects:  
  > *"Achievement tests may well be valuable indicators of general school achievement under conditions of normal teaching aimed at general competence. But when test scores become the goal of the teaching process, they both lose their value as indicators of educational status and distort the educational process in undesirable ways."*  
  This hints at **causal Goodhart**: Teaching to the test *directly causes* a narrow skill set (raising the metric but harming broader education). Still, adversarial intent dominates his examples (e.g., schools excluding low-scoring students).

  ---

  ### **Verdict**
  - **Goodhart's Law** (1975) is **regressional Goodhart**: Optimization breaks a statistical correlation.  
  - **Campbell's Law** is **predominantly adversarial Goodhart**, with minor causal elements.  
  - **They are not the same**: Regressional failure requires no bad actors; adversarial failure requires intent. Conflating them risks misdiagnosing problems (e.g., blaming "gaming" when a metric was always statistically invalid).  

  The rationalist community’s blurring of these stems from over-reliance on the Strathern quote. For AI safety, distinguishing them is crucial: an AI gaming a reward function (adversarial) differs fundamentally from an AI pushing a system into uncorrelated regimes (regressional). Campbell’s Law belongs in the adversarial bucket—but its sociological emphasis on *human* incentives adds texture beyond Garrabrant’s abstract categories.
