  Let me crack open the original texts. Goodhart’s 1975 paper is hyper-specific: monetary aggregates (like M3) failing as policy targets because their statistical relationship with GDP breaks when the central bank optimizes for them. It’s a structural, almost mechanical failure—no human malice, just flawed correlations. Campbell’s 1976 paper, though, is dripping with sociology: he’s furious about how high-stakes testing corrupts educators into teaching to the test, falsifying records, or excluding weak students. Humans gaming the system is the heart of it.  

