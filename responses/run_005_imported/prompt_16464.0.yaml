  ...But wait. Campbell’s footnote about Campbell’s Law actually mentions *both* adversarial and causal Goodhart. He cites cases where teaching to the test *does* raise real competence (causal) versus when it’s just gaming (adversarial). That nuance matters—it means Campbell’s original framing is broader than just "people cheat." Still, his emphasis is overwhelmingly on the adversarial dynamic.  

