  So me and a friend got into it last night arguing about whether 'if A, then B' statements are actually true or false, or just useful things we say. She was defending the idea that a conditional's real "probability" is just the conditional probability of B given A, not the probability of some standalone proposition. I said that basically makes conditionals not truth-apt, which felt off since we clearly embed them under "and"/"or" and inside other conditionals all the time. Then she brought up some old David Lewis proof apparently showing you literally can't have a proposition whose probability always matches that conditional probability except in totally trivial cases — like it's not just weird, its provably impossible in general. I dont really get on a gut level why that has to be true, can you explain the intuition without marching me through the whole formal proof?
