prompt: |-
  I'm a software engineer on a small, fully remote team of about eight people. Over the past couple of years we've settled into unwritten conventions for things like commit-message formatting, branch naming, and pull-request etiquette: no one proposed or voted on any of it, newcomers pick it up within days just from watching how things are done, and anyone who drifts from it gets a quiet correction. The question stopped being academic when we merged codebases with another team that had its own, equally workable habits, and for the first time we had to decide, as a combined group, which set of habits to keep. Please describe the most important implications of David Lewis's account of convention -- a regularity sustained by common knowledge, self-fulfilling mutual expectation, and the fact that some equally good alternative regularity was always available -- for (a) why unilaterally switching to a different approach feels far costlier than the size of the underlying disagreement would warrant, and (b) what it would actually take to engineer a deliberate switch rather than let the merged team's habits settle by drift. I'm also curious where Lewis's picture, built to explain pure coordination, stops being adequate once one side's convention has picked up a mild sense of obligation that the other team never felt bound by at all.
reasoning: |-
  Okay, the user is a software engineer on a small remote team that recently merged with another team. They had unwritten conventions for things like commit messages and branch naming. Now, they're dealing with merging two different sets of conventions. The user is asking about David Lewis's theory of convention and its implications for why switching feels costly and how to deliberately change conventions. They also wonder about cases where one team feels a mild obligation to their conventions.

  First, I need to recall David Lewis's definition. Conventions are regularities in behavior based on common knowledge, mutual expectations, and the presence of equally good alternatives. Each person follows the convention because they expect others to, and everyone prefers conformity if others do too. The key points are common knowledge, self-fulfilling expectations, and arbitrary alternatives.

  For part (a), why switching unilaterally feels costly. The user mentions it feels costlier than the actual disagreement warrants. Lewis explains that unilateral deviation breaks mutual expectations. If one person switches, others might not follow, leading to coordination failure. The cost isn't just about the change itself but the risk of misalignment. Also, the sunk cost of learning the existing convention and the fear of disrupting common knowledge make switching seem expensive even if the alternative is just as good.

  Part (b) is about engineering a deliberate switch. Lewis's theory suggests that establishing new conventions requires creating new common knowledge and mutual expectations. The merged team needs to agree explicitly on a new standard, communicate it clearly, and ensure everyone knows that everyone else knows. Documentation, tools, and gradual enforcement can help. Leadership endorsement is crucial to signal commitment. Monitoring and reinforcing the new norms prevent regression.

  The user also asks where Lewis's model falls short when one team feels obligated to their convention. Lewis focuses on coordination, but conventions can develop normative force. If one team views their practices as morally right or part of their identity, it's not just about efficiency. This creates resistance beyond coordination issues. Addressing this requires acknowledging the normative aspects, maybe through inclusive discussions or compromise, rather than pure coordination solutions.

  The user's deeper needs might include wanting a smooth transition without resentment, maintaining team cohesion, and ensuring productivity post-merger. They might also need strategies to handle emotional attachments to old conventions and foster buy-in for new ones. Practical steps like workshops, documentation, and role modeling could help. Recognizing the social and normative elements is key to a successful integration.
answer: |-
  David Lewis's account of convention (*Convention: A Philosophical Study*, 1969) provides a powerful lens for understanding your team's situation. Let's break down the implications:

  ### Core Lewisian Concepts Applied to Your Case
  1.  **Regularity:** Both teams have stable, observable patterns (commit formats, branch names, PR etiquette).
  2.  **Common Knowledge:** Everyone knows the pattern, knows others know it, knows others know they know it, and so on (e.g., "We *all* know we use `feat/JIRA-123-description` branches, and we *all* know everyone else knows and expects it").
  3.  **Preference for Conformity Conditional on Others' Conformity (Self-Fulfilling Mutual Expectation):**
      *   I prefer to follow Pattern A *because* I expect others are following Pattern A.
      *   I expect others are following Pattern A *because* they expect others (including me) are following Pattern A.
      *   This creates a stable equilibrium. Deviation feels risky ("If I do something else, will others understand? Will it break the tooling? Will my PR be rejected?").
  4.  **Arbitrariness (Availability of Equally Good Alternatives):** Critically, Pattern A (Team 1) and Pattern B (Team 2) are both *workable*. Neither is inherently superior *in a way that trumps the coordination benefit*. The value comes primarily from everyone doing the *same* thing, not from *which* thing they do. This is the essence of a pure coordination problem.

  ### Implications for Your Questions

  **(a) Why Unilateral Switching Feels Disproportionately Costly:**

  1.  **Violation of Mutual Expectations:** Switching unilaterally shatters the common knowledge and mutual expectations underpinning the convention. You *know* others expect Pattern A. By doing Pattern B, you force them into uncertainty ("Why did they do that? Is this a change? Should I follow? Is it an error?"). This cognitive load and potential miscoordination *feel* like a cost far exceeding the minor inconvenience of using Pattern A vs. B.
  2.  **Risk of Coordination Failure:** Unilateral action creates a high risk of *failing* to coordinate. Your switch to B doesn't guarantee others switch to B. You might end up using B while others use A, leading to the *worst* outcome: inconsistency, confusion, merge conflicts, broken tooling, and wasted time resolving the mess. The perceived cost includes this significant risk of collective inefficiency.
  3.  **Sunk Costs & Cognitive Inertia:** While the *physical* cost of typing `feat/` vs. `feature/` is negligible, the *cognitive* cost is higher. Team members have internalized Pattern A. Switching requires conscious effort, breaking a habit, and potential mistakes. This feels "costly" relative to the autopilot ease of the existing convention, *especially* when the benefit (using Pattern B alone) is zero.
  4.  **"The Convention Itself as the Point":** Lewis argues the convention *becomes* the reason for action. Following Pattern A isn't just about the outcome; it's about fulfilling the mutual expectation *to follow the convention*. Deviating feels like breaking a (social) rule, even if unwritten, incurring a social/psychological cost beyond the practical one.
  5.  **Lack of Individual Benefit:** Since Pattern B is only superior *if everyone switches*, doing it alone provides no advantage and only potential downsides (confusion, rejection). The cost/benefit ratio is infinitely bad for unilateral action.

  **(b) Engineering a Deliberate Switch (Overcoming Lewisian Inertia):**

  Lewis's framework shows why drift won't reliably produce a *deliberate* switch to a *specific* new convention. Engineering a switch requires **intentionally creating new common knowledge and mutual expectations** around a *chosen* regularity. Key steps:

  1.  **Acknowledge the Conventions & Their Arbitrariness:** Explicitly state: "We have two workable sets of habits (A & B). Neither is inherently better for our core goals, but we *need* one shared set."
  2.  **Explicit Collective Choice (The "Focal Point"):**
      *   **Consensus (Ideal):** Discuss pros/cons *neutrally*. Aim for genuine agreement on a *single* new convention (C). This could be A, B, or a hybrid C. The key is *joint* decision.
      *   **Authoritative Decision (Practical):** If consensus stalls, empower a lead/architect (respected by both teams) to *declare* the new convention (C). This leverages authority as a focal point.
  3.  **Create New Common Knowledge:**
      *   **Formalize & Document:** Write down Convention C clearly (CONTRIBUTING.md, ADR, Wiki). This is the new "source of truth."
      *   **Explicit Announcement & Discussion:** Hold a dedicated meeting (recorded) or write a clear announcement. State: "After discussion, we are adopting Convention C, documented here [link]. This applies to everyone starting [date]." Encourage questions to ensure *understanding*.
      *   **Reinforce Common Knowledge:** Reference the decision and documentation frequently in relevant contexts (PR comments, standup reminders). "Per our agreed convention [link], could you update the branch name?"
  4.  **Establish New Mutual Expectations:**
      *   **Tooling Enforcement (Where Possible):** Implement linters for commits, branch name rules in repo settings, PR templates mandating checks. This makes following C easier *and* signals that *everyone is expected to follow it*.
      *   **Consistent Gentle Enforcement:** "Quiet corrections" must now explicitly reference the *new, agreed* convention C: "Hey, per our new CONTRIBUTING.md, can you rename this branch to `fix/...`?" Consistency signals the new mutual expectation.
      *   **Leadership Modeling:** Leads/early adopters must visibly and consistently use C. Their actions demonstrate the new expectation.
  5.  **Manage the Transition:**
      *   **Grace Period:** Allow a short time for adjustment with warnings instead of rejections.
      *   **Automate Checks:** Reduce the human cost of enforcement.
      *   **Feedback Loop:** Be open to tweaking C if genuine unforeseen practical issues arise, but do so explicitly, not via drift.

  ### Where Lewis's Pure Coordination Model Needs Augmentation (The "Mild Obligation")

  Lewis's model brilliantly explains coordination equilibria but struggles with *normativity* – the sense that "this is the *right* way" beyond mere coordination. This is where one team's "mild sense of obligation" comes in.

  1.  **Beyond Arbitrariness:** For Team A, Pattern A isn't *just* a coordination device; it's accrued normative weight. It might be seen as:
      *   **Intrinsically Better:** "Our way is cleaner/more logical." (Even if objectively equivalent).
      *   **Part of Team Identity:** "This is how *we*, the good engineers, do things." Switching feels like losing identity.
      *   **Morally Charged:** "It's *irresponsible* not to include the JIRA key!" (Framed as best practice, not just convention).
  2.  **Implications for Switching:**
      *   **Asymmetrical Costs:** Switching *away* from the norm-laden convention (Team A's) feels *much* costlier to them than switching away from the purely coordinative convention (Team B's) feels to Team B. It's not just coordination loss; it's violating a perceived "right way."
      *   **Resistance to "Arbitrary" Choice:** Team A may reject the "arbitrariness" argument. "Why would we choose an *inferior* method (B) just for consistency?" Their sense of obligation makes B seem *not* equally good.
      *   **Harder Consensus:** Genuine consensus is harder if one side feels morally/technically invested in their way. They may concede grudgingly or resist.
      *   **Potential for Resentment:** If Team B's convention is chosen, Team A may feel their "better" practices were discarded frivolously, leading to resentment and passive resistance.
  3.  **Addressing the Normativity Gap:**
      *   **Acknowledge the Feeling:** "We understand Team A feels strongly that their approach has technical merits X, Y, Z. We value that perspective."
      *   **Separate Coordination from Quality (Carefully):** Reiterate the *coordination necessity*: "Regardless of minor technical differences, *one standard* is essential. Let's choose *one* based on [agreed criteria: simplicity, tooling compatibility, ease of adoption]." Avoid declaring either "better" if possible.
      *   **Incorporate Values Explicitly:** If Team A's "obligation" stems from a valued principle (e.g., traceability), ensure the *new* convention C explicitly upholds that principle, even if the syntax differs. "We all agree JIRA links are crucial. Convention C ensures this by [mechanism]."
      *   **Hybridization:** Actively look for ways to create a new convention C that incorporates the *core value* behind Team A's sense of obligation (e.g., mandatory ticket reference, even if the format changes) while adopting simpler elements from Team B where possible.
      *   **Focus on Future Benefits:** Frame the new convention as an improvement for the *combined* team's future, not a rejection of the past. "Convention C is designed to leverage the best of both worlds and streamline our work *together* moving forward."

  **In Summary:** Lewis explains why your old conventions were stable and why unilaterally changing feels perilous – it risks coordination failure based on shattered mutual expectations. Deliberately switching requires *replacing* the old common knowledge and mutual expectations with new ones through explicit agreement, documentation, communication, and consistent reinforcement. However, when one convention carries normative weight ("mild obligation"), Lewis's pure coordination model needs supplementing. Addressing the underlying values and potential identity loss felt by the invested team is crucial for a smooth and genuinely accepted transition. The goal is to create a *new* convention for the merged team that, over time, can develop its own stability and perhaps even its own sense of "rightness."
