  First, I recall this reminds me of the discursive dilemma. It's a scenario where separate votes on premises lead to a different outcome than a direct vote on the conclusion. The user mentioned Arrow's theorem, but that's about ranking preferences. Here, it's about logical connections between propositions. So the discursive dilemma fits better.

