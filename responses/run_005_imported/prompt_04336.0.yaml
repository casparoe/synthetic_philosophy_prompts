  - C: Minimal: (5) Multiverse analysis is about robustness and doesn't take a stand on the philosophy. It might be used in either paradigm.
  - D: Very little to none: (1) Changing alpha threshold, (3) Preregistration, (8) Open data/adversarial collaboration. These are procedural and can be applied in either framework.

