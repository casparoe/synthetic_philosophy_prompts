answer: |-
  ## The Ceiling Gazers
  Dr. Alistair Vance’s pen hovered over the intake form. *Patient 47-892: Male, 32. Found catatonic, prone, in public park. Unresponsive to standard stimuli.* He scratched out ‘catatonic’. Too broad, too Bleuler. This was… something else. The man, Jenkins, lay rigid on the gurney in Ward C of Briarwood State Hospital, 1952, eyes fixed unblinkingly on a hairline crack in the ceiling plaster. Not vacant, Vance noted. *Intensely* focused. A fly buzzed near his ear. Nothing. A nurse jangled keys. Nothing. But when Vance gently touched his arm, Jenkins flinched minutely, a tremor running through his locked muscles, though his gaze never wavered from that crack.

  **"Tonic immobility with ideational fixation,"** Vance murmured, the phrase forming on the page before he fully registered it. He described the posture: rigid extension, prone, minimal respiration. The fixation: not just staring, but an *absorption* in a single, mundane visual detail. The paradoxical flinch: profound physical immobility coupled with preserved, almost hyper-alert sensory response to direct contact. Jenkins wasn't gone; he was *trapped*, anchored to that insignificant flaw in the ceiling.

  The early cases were messy constellations, not a clear constellation. Mrs. Ellis (48-101), found rigid in her pantry, fixated not on the ceiling, but on the chipped enamel pattern of a mixing bowl someone had placed near her head. Recovery took hours, punctuated by fragmented, tearful whispers about "the noise… the terrible noise" (though the pantry had been silent). Young Peter Davies (48-215), triggered seemingly by a sudden shaft of sunlight through the dayroom window, froze mid-stride, body locked at an awkward angle, gaze welded to the dust motes dancing in the beam. He hummed a single, discordant note for forty minutes straight upon emerging. No two presentations were identical. Vance filled ledgers with variations: fixation objects (a nurse’s brooch, a water stain), trigger hints (a slammed door, a specific word), recovery quirks (sobbing, disorientation, eerie calm).

  But the pattern held: the profound, statue-like freeze, the laser focus on a trivial external detail, the preserved startle. Vance published. A modest paper in the *Journal of Clinical Psychiatry*: "Tonic Immobility with Ideational Fixation (TIIF): A Proposed Dissociative Response Pattern Observed at Briarwood State." He meticulously detailed Jenkins, Ellis, Davies. He emphasized the *variability* within the core triad. The paper was politely received, a minor curiosity.

  Then came the shift. Post-publication, the TIIF cases didn't just continue; they changed. They arrived… *neater*.

  Robert Hill (51-367), admitted 1955. Found rigid on a park bench. *"Heard about that freeze-up thing, Doc,"* the orderly reported Hill saying before he ‘locked’. On the ward, Hill lay perfectly prone, rigid as an ironing board, eyes fixed unerringly on a ceiling tile junction. Exactly like Jenkins. When Vance approached, Hill didn’t just flinch minutely at a touch; his whole body gave a single, pronounced, almost theatrical shudder, eyes snapping wide for a fraction of a second before refocusing on the ceiling spot. Textbook. Vance’s initial notes on Hill bristled with unease: *"Presentation remarkably consistent with Case 1 (Jenkins). Fixation object: ceiling feature (cf. crack/tile). Startle response exaggerated?"*

  The paperwork evolved. Vance’s initial diagnostic checklist, scrawled on scrap paper, was vague: *1. Profound immobility? 2. External fixation? 3. Preserved startle?* Now, he drafted formal mimeographed sheets for the interns. Under "Fixation Object," examples listed: *ceiling cracks/tiles, specific small objects, light patterns.* Under "Trigger (Suspected)," options included: *sudden loud sound, intense visual stimulus, perceived threat (often vague).* The "Startle Response" box demanded description: *minimal tremor? pronounced shudder? vocalization?* He added a new criterion, born of Hill and others like him: *"Apparent awareness of syndrome?" (Y/N)*. He didn’t recall Jenkins being aware.

  The patients seemed to be reading his mimeographs. Sarah Miller (52-188), admitted after ‘freezing’ in a department store. Her fixation? A specific, slightly crooked ceiling tile. Her recovery narrative? Smooth, rehearsed: *"It was the fluorescent lights, Doctor. They hummed, then… everything just locked. I saw that tile and couldn’t look away. Like your paper said."* Vance felt a cold prickle. His paper *had* mentioned Jenkins and the ceiling crack. He hadn’t mentioned fluorescent lights as a specific trigger. Yet here it was, presented as fact. He revised the criteria sheet again. Added "Fluorescent lighting?" under potential triggers.

  He found himself chasing his own definitions. When a new patient, Carter (53-099), presented with immobility but fixated on a *moving* object – a moth battering itself against a window – Vance hesitated. Was this TIIF? The fixation wasn't static. He re-read his own evolving criteria. "External fixation" was broad. Carter recovered mumbling about "the trapped thing… beating wings." Vance added "Secondary fixation on movement?" as an optional descriptor, feeling less like a discoverer and more like an archivist cataloging variations on a theme he’d inadvertently composed.

  The weight settled slowly, a sediment in his gut. He reviewed Jenkins’ original file. The crack was incidental, Jenkins had mumbled later about "the weight of the sky" – poetic, vague. Now, patients arrived knowing the sky’s weight manifested as a *ceiling tile*. Jenkins’ subtle flinch had become Hill’s dramatic shudder, Miller’s diagnostic recitation. The indifferent kind – a raw, chaotic human response to overwhelm – was gone, buried under the interactive kind: TIIF, a syndrome patients learned to inhabit and perform.

  One Tuesday in 1958, Vance assessed young David Lennox (56-442). Found prone and rigid in his college library. Lennox lay on the examination cot, posture unnervingly perfect: spine straight, limbs rigid, head angled precisely to fixate on a small, pre-identified chip in the ceiling plaster. Vance approached. Before he even touched him, Lennox gave a single, sharp, full-body shudder. His eyes didn’t flicker from the chip.

  Vance picked up the latest diagnostic sheet. *TIIF Assessment v.4*. Boxes waited: *Fixation Object (Static? Y/N)*. *Trigger (Specify)*. *Startle Response (Describe)*. *Awareness of Syndrome? (Y/N)*. *Atypical Presentation? (Y/N)*.

  He looked at Lennox, the embodiment of the criteria Vance himself had refined, step by step, chasing the clearer, sharper image reflected back at him by patients who had read about their own disorder. The perfect specimen. The moving target hit dead center.

  Vance’s pen hovered over the last box: *Atypical Presentation? (Y/N)*. Lennox was the *most* typical he’d ever seen. Was this the discovery crystallizing? Or the invention perfected? He thought of Jenkins and the accidental crack, of Mrs. Ellis and her bowl, of Peter Davies humming in the sunbeam – raw, unscripted moments of human fracture. Now, Lennox performed immobility with the precision of a watch.

  He lowered the pen. The tremor in his hand wasn't clinical observation; it was his own. He left the box unchecked. The silence in the room was thick, broken only by Lennox’s shallow, controlled breaths and the distant clang of a door from the chronic ward. Vance stared at his mimeographed sheet, then at the young man rigidly embodying it, a perfect loop of definition and performance made flesh. He closed the file. The question wasn't *whether* anymore; it was *what* he had truly been documenting all along. The discovery felt like ashes. The creation felt like a crime. And the truth, he knew with a chilling certainty, resided somewhere in the trembling space between the pen and the unchecked box, in the silent, perfect performance lying rigidly before him, gazing at the ceiling.
