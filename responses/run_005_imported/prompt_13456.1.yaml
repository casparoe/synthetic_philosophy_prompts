  First, I need to avoid the usual impairments. So no pills, exhaustion, or persuasive arguments. Instead, focus on peer disagreement. Maybe a situation where two experts disagree, but one has a track record of being wrong in specific conditions. That could introduce higher-order evidence without cognitive impairment.

  The user mentioned selection effects. How about the agent comes to hold a belief because they were part of a group that survived a process? Like surviving a rigorous selection but knowing that others who passed might still be wrong. That could create tension between their first-order evidence and the higher-order doubt.

  Let me flesh this out. Say two experts, Alia and Ben, both competent. Alia believes P, Ben believes not-P. The agent, Casey, initially sides with Alia. But then Casey learns that in past disagreements, when Ben changed his mind, he was usually right. That's track-record evidence. So Casey's first-order evidence supports P, but the higher-order evidence suggests Ben's reliability in such cases.

  Now, the costs: If Casey believes P, they ignore Ben's reliability. If they disbelieve, they dismiss their own judgment. Suspending judgment ignores Alia's current evidence. Staying akratic holds conflicting beliefs. Each has a cost.

  Which is least costly? Staying akratic might be better because it acknowledges both pieces of evidence without fully committing. But I need to justify why. Because it doesn't dismiss either evidence, whereas other options ignore part of the evidence. That seems plausible.

