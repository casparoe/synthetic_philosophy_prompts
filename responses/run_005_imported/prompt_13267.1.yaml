answer: |-
  Your grasp of Anscombe's core argument is insightful, but framing it *primarily* as a stricter cost-benefit analysis within a consequentialist framework risks misrepresenting her deeply deontological commitments. Here's a breakdown of why her position on Hiroshima/Nagasaki differs significantly from her acceptance of other wartime killing, and why "proportion" alone isn't the full story:

  1.  **The Centrality of Intention and the Prohibition on Targeting Innocents:** Anscombe's primary objection isn't *just* the scale of civilian death, but the **intentional targeting of non-combatants** as a means to an end. This is absolutely fundamental to her moral framework, rooted in Catholic natural law and her reading of Aquinas.
      *   **"Murder" as a Moral Category:** When Anscombe uses "murder," it's not merely rhetorical emphasis on disproportionality. She uses it *technically* to denote the *intentional killing of the innocent*. For her, this is intrinsically evil – a moral absolute that cannot be overridden by consequences. The bombs weren't just a bad calculation; they were, in her view, categorically wrong acts.
      *   **Double Effect Distinction:** This is where the difference with other large-scale killing becomes clear. Anscombe accepted the Doctrine of Double Effect (DDE). She could potentially justify actions (like bombing a munitions factory) that foreseeably but *unintentionally* cause civilian deaths as a side-effect *if* the good effect (destroying the factory) was intended, the bad effect was not intended (neither as an end nor a means), and the action was proportionate. The civilian deaths were a tragic but unintended consequence.
      *   **Hiroshima/Nagasaki vs. Strategic Bombing:** In the case of the atomic bombs, Anscombe argued the civilian population centers *were* the primary, intended targets. Destroying them *was* the means chosen to coerce surrender and end the war. The deaths of non-combatants weren't a side-effect; they were the very mechanism of the attack. This crosses the line into direct intentional killing of the innocent – murder.

  2.  **Proportion's Role – Necessary but Not Sufficient:** You're right that proportion is crucial, but it functions *differently* in her argument:
      *   **A Secondary Condition:** Proportion is a necessary condition for justifying an act under DDE *even when the bad effect is unintended*. An action with a foreseen bad effect must be proportionate to the good achieved.
      *   **An Aggravating Factor for an Already Illicit Act:** In the case of Hiroshima/Nagasaki, Anscombe argues the act was *already* illicit because it intentionally targeted innocents. The sheer scale of the killing (the disproportionality) serves two functions:
          *   **Demonstrating the Intent:** The massive, immediate destruction of a city full of civilians makes the argument that they were *not* the intended target implausible. The scale reveals the intent.
          *   **Highlighting the Moral Horror:** The disproportionality underscores the monstrous nature of an act that was *already* categorically forbidden. It shows how egregiously the moral law was violated. It's not *why* it's wrong (intention is why), but it shows *how deeply* wrong it was.

  3.  **Why Her Verdict Differs from Other Cases:**
      *   **Intent Makes the Difference:** Cases where she accepted large-scale killing (e.g., aspects of the Allied strategic bombing campaign, though she was often critical) were, in her view (even if contested), instances where the *intent* was arguably to destroy military targets or war-supporting infrastructure, and civilian deaths were foreseen but (supposedly) unintended side-effects. She judged the *moral character of the act itself* differently based on intention, regardless of the scale. Hiroshima/Nagasaki involved a *different kind of act* – one intrinsically immoral.
      *   **No "Sufficiently Weighty End":** For Anscombe, no end, no matter how weighty (ending WWII, saving Allied lives), can justify an intrinsically evil means – the deliberate killing of the innocent. Truman's defenders argued the ends *did* justify the means. Anscombe categorically rejects this consequentialist logic. The cost-benefit test *cannot even be applied* to justify an intrinsically immoral act. The act is forbidden *before* the calculation begins.

  **Conclusion & Refinement of Your Reconstruction:**

  *   **You've correctly identified proportion as a major element,** but you've underestimated the **foundational role of intention and the absolute prohibition on targeting innocents** in her argument.
  *   **"Murder" is not merely rhetorical emphasis on disproportionality;** it is the core moral *classification* of the act based on its intentional structure. Disproportionality serves to confirm the intent and amplify the horror of this forbidden act.
  *   **Her position is NOT "just a stricter accounting of costs and benefits."** It's a fundamentally different *type* of moral reasoning. Truman's defenders used a consequentialist cost-benefit analysis (ends justify means). Anscombe uses a deontological framework where certain acts (intentional killing of innocents) are absolutely forbidden, and proportion only comes into play as a secondary condition *for acts that are potentially permissible* under DDE (i.e., where the bad effect is unintended). Hiroshima/Nagasaki fails at the *first* hurdle (intention), making proportion irrelevant for justifying the act itself (though relevant for condemning its scale).

  **Refined Reconstruction for Your Chapter:**

  Anscombe's core argument in "Mr Truman's Degree" is that the atomic bombings of Hiroshima and Nagasaki constituted murder. This judgment rests primarily on the *intentional targeting of non-combatant civilians* as a means to coerce Japan's surrender. For Anscombe, such intentional killing of the innocent is intrinsically evil and absolutely prohibited by the moral law, regardless of consequences. The massive scale of civilian death – the extreme disproportionality between the destruction wrought and any conceivable *immediate* military objective within the cities themselves – functions as compelling evidence *for* this intent (targeting the city/people was the plan) and underscores the horrific magnitude of the moral transgression. While Anscombe accepted that large-scale civilian deaths could be a tragic, unintended side-effect of legitimate military actions under the Doctrine of Double Effect (provided proportionality held), Hiroshima/Nagasaki fundamentally differed: the civilians were not collateral damage; they were the direct object of the attack. Therefore, her condemnation stems not from a stricter utilitarian calculus, but from a categorical deontological rejection of the act-type itself, rendering consequentialist justifications morally invalid.

  **Further Building:**

  This refined understanding allows you to engage deeply with:
  *   The philosophical debate between deontology and consequentialism in the ethics of war.
  *   Critiques of the Doctrine of Double Effect and its application (Was the intent *really* different in "conventional" city bombing?).
  *   The specific historical context of the bombings and Truman's justifications vs. Anscombe's interpretation of intent.
  *   The enduring relevance of the absolute prohibition on targeting non-combatants in contemporary warfare.
  *   Whether Anscombe's absolutism is philosophically defensible or practically untenable in total war.

  You've identified a crucial tension; resolving it correctly by centering intention and the intrinsic wrongness of targeting innocents will make your chapter much stronger. Good luck!
