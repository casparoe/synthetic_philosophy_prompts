  Also, proportionality in Just War Theory isn't just utilitarian for Anscombe. It's tied to the act's permissibility based on intention. Even if the bombs ended the war faster, deliberately killing innocents is intrinsically wrong. The user's view of cost-benefit might be too utilitarian, whereas Anscombe is deontological.

