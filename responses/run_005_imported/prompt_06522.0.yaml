answer: |-
  ## Eulogy for [Colleague's Name]

  We are here, gathered in this heavy silence, because [Colleague's Name] is gone. The simple, devastating fact of her absence fills this room. It’s not an abstract concept; it’s the empty chair where her sharp wit should be, the missing counterpoint in a debate, the silence where her laughter used to land. We feel this absence not as observers cataloging a loss, but as people who have lost *her*. And right now, that loss just… hurts.

  It hurts because we knew her. Really knew her. For nearly thirty years, I shared an office corridor, countless department meetings, and more philosophical rabbit holes than either of us could count with this remarkable, infuriating, brilliant woman. She wasn't a puzzle to be solved, a set of behaviors to be causally explained. She was [Colleague's Name]. A colleague, a friend, a force of nature. And knowing her meant encountering her fully – her fierce intellect, her unwavering loyalty, her surprising kindnesses tucked beneath a sometimes formidable exterior, and yes, her flaws. Because she was gloriously, undeniably human.

  She had a particular… let’s call it a *tenacity* in argument. [Colleague's Name] could latch onto a perceived inconsistency or a weakly defended premise with the determination of a terrier. If she thought you were wrong, or worse, sloppy, she wouldn’t just disagree; she would dismantle. Patiently, relentlessly, paragraph by paragraph. It could be exhilarating if you were prepared, but woe betide the graduate student presenting a half-baked thesis idea or the colleague offering a casual opinion they hadn’t fully armored. There were moments, sitting across from her in that office, stacks of annotated papers between us, where that relentless pursuit of precision felt less like intellectual rigor and more like being slowly sandblasted. It could leave you feeling raw, exposed, and frankly, quite resentful.

  *[Pause]* And yet… that resentment never lasted. It couldn’t. Because the person doing the sandblasting was also the one who, moments later, would offer the most insightful comment that suddenly made your own messy idea click. She was the one who stayed late to help you craft a response to a brutal referee report, line by painstaking line. She was the one whose own work bore the same uncompromising scrutiny she applied to others, a testament to her integrity. Resenting *that* felt… pointless. Worse, it felt like a betrayal of the complex, demanding, invaluable person she was. We didn't excuse the sandblasting – we understood its source in her deep, almost painful, commitment to getting things *right*, and we forgave it because she was *her*, and she was worth the friction. We moved past the momentary sting because the whole person commanded not just our intellectual respect, but our genuine affection and loyalty. That’s what forgiveness *is* here – not an exoneration of the flaw, but a reaffirmation of the relationship that holds it.

  [Colleague's Name] spent her professional life defending a profound truth: that the heart of our moral lives isn't found in some cosmic guarantee of freedom, but right here, in the messy, reactive ways we hold each other close. Resentment when we’re hurt. Forgiveness when we understand. Gratitude for what we’re given. She argued fiercely that these aren't illusions waiting to be dispelled by science or metaphysics; they are the very fabric of being human *with* other humans. They are how we matter to each other.

  And so, today, standing in this aching space she left, we don't need to justify our grief by insisting she "could have avoided" dying. Her death isn't an injustice demanding metaphysical redress. It’s a profound loss, and we grieve because we loved her. We grieve *her*.

  Nor do we need to justify our gratitude by constructing some ledger of counterfactuals – what she *might* have done otherwise. Our gratitude isn't earned by hypothetical possibilities. It’s earned by the thirty years of reality. It’s earned by the fierce debates that sharpened our thinking, the unwavering support during professional storms, the shared exhaustion and dark humor in the trenches of academia, the moments of unexpected vulnerability, the sheer, stubborn *presence* of her mind and spirit in our lives. We are grateful for *what she did*, for *who she was*, right here, in the actual world we shared with her. For the papers she wrote, the students she inspired (and terrified, productively), the arguments she won (and lost, grudgingly), the loyalty she showed, the laughter she shared – however dry. We are grateful *to her*, directly, personally, for the indelible mark she left on our lives and our field.

  [Colleague's Name] would have hated a eulogy that treated her like a specimen under glass, explaining away her edges or leaning on abstract possibilities to validate our feelings. She believed, fiercely, in the reality and the rightness of the participant stance – seeing each other, flawed and whole, as people to be engaged with, not objects to be explained. People to be resented sometimes, forgiven often, and thanked always for the genuine gift of their presence.

  So today, we look at her absence not with the objective eye of a scientist studying a mechanism, but with the grieving, grateful heart of friends, colleagues, and family who have lost someone irreplaceable. We feel the loss. We miss her voice, her mind, her formidable, frustrating, wonderful self.

  [Colleague's Name], for the challenge, the rigor, the loyalty, the shared decades… thank you. We are grateful for you. And we will miss you, profoundly, every day.
