answer: |-
  You've hit upon a fascinating and subtle point in the history and philosophy of mathematics. While the institutional dynamics certainly played a significant role, **Wallis's victory was primarily mathematical and based on checkable errors within the frameworks available at the time.** Here's why your friend's argument, while intuitively appealing, doesn't fully capture the situation:

  1.  **Refuting a *Specific* Construction vs. Proving *General* Impossibility:** Lindemann's proof established the *absolute impossibility* of solving the problem under the strict constraints of compass and straightedge. Wallis didn't need this. His task was to demonstrate that *Hobbes's specific constructions* were flawed according to the universally accepted rules of Euclidean geometry and the principles of logic. He could (and did) show that:
      *   Hobbes made incorrect assumptions.
      *   Hobbes's logical deductions contained fallacies (e.g., affirming the consequent, equivocation, non sequiturs).
      *   Hobbes's constructions violated foundational geometric principles (e.g., claiming two lines were equal when they demonstrably weren't based on the construction steps).
      *   Hobbes's methods (often relying on unrigorous notions of "indivisibles" or motion) led to contradictions *within the system he was ostensibly using*.

  2.  **The Nature of Mathematical Refutation:** Mathematics doesn't require knowing a task is impossible to show that a *particular proposed solution* is wrong. Consider:
      *   If someone claims 2 + 2 = 5, you refute it by showing it contradicts the basic axioms and definitions of arithmetic, not by proving a general theorem that 4 cannot equal 5.
      *   If someone claims a specific triangle has angles summing to 200 degrees, you refute it by applying the triangle sum theorem (known since Euclid), not by proving a general impossibility theorem about triangles.
      *   Similarly, Wallis could point to specific steps in Hobbes's quadrature constructions where, based on the preceding steps and Euclidean principles, the claimed equality of areas or lengths simply did not hold. He could demonstrate that Hobbes's circle "square" was demonstrably *not* equal in area to the original circle, based on the construction itself and accepted calculation methods.

  3.  **Hobbes's Specific Errors:** Hobbes's constructions weren't just unsuccessful; they were demonstrably *wrong* by 17th-century standards. For example:
      *   **Logical Fallacies:** Hobbes often argued circularly or made invalid deductions. Wallis meticulously dissected these arguments.
      *   **Violating Geometric Principles:** In some constructions, Hobbes assumed properties of curves or magnitudes that were incompatible with Euclidean geometry. Wallis could show this incompatibility.
      *   **Inconsistencies:** Hobbes sometimes used methods in one context that, if applied consistently elsewhere, led to absurd results Wallis could highlight.
      *   **Arithmetic Errors:** Wallis sometimes showed that the numerical consequences of Hobbes's constructions contradicted known approximations of pi or other constants.

  4.  **The Role of Algebra and Analysis:** Wallis (and others like Huygens) were pioneers in using algebraic methods and nascent calculus (like the method of indivisibles/limits, which Hobbes used clumsily). They could often translate Hobbes's geometric claims into algebraic statements and show they led to contradictions or demonstrably false numerical results (e.g., implying pi was a rational number or constructible root, which contradicted known approximations and emerging understanding).

  5.  **The Institutional Factor (A Necessary Nuance):** While the *mathematical* refutation was primary, the institutional context *amplified* Wallis's victory and ensured Hobbes's defeat in the public sphere:
      *   **Authority & Platform:** Wallis held the Savilian Chair and was a key Royal Society member. This gave his critiques immense weight and reach. Hobbes, the controversial political philosopher, lacked this mathematical authority.
      *   **Publication & Persistence:** Wallis relentlessly published detailed refutations (e.g., in *Elenchus Geometriae Hobbianae* and elsewhere), ensuring the mathematical community saw Hobbes's errors. Hobbes, isolated and increasingly dogmatic, couldn't mount an effective mathematical counter-argument.
      *   **Community Consensus:** The broader mathematical community (Brouncker, Huygens, Wren, etc.) largely agreed with Wallis's critiques. This consensus, formed by examining the *specific errors*, solidified Wallis's position. Institutional affiliation facilitated this consensus-building.

  **Conclusion:**

  Your core insight – that *general* impossibility wasn't proven until 1882 – is correct. However, the inference that therefore *specific* refutations in the 1650s/60s were impossible or merely "strong suspicions" is **incorrect**.

  *   **Seventeenth-century mathematicians absolutely *could* (and did) adjudicate specific proposed constructions as flawed.** They could identify logical fallacies, incorrect deductions, violations of geometric axioms, arithmetic contradictions, and internal inconsistencies within Hobbes's own methods, using the tools of Euclidean geometry, algebra, and emerging analysis.
  *   **Wallis's victory was fundamentally mathematical.** He demonstrated, to the satisfaction of his contemporary mathematical peers, that Hobbes's *specific constructions* were riddled with errors according to the mathematical standards of their time. Hobbes failed to provide a construction that survived rigorous scrutiny.
  *   **Institutional authority was a powerful amplifier, not the root cause.** It ensured Wallis's critiques were heard, disseminated, and formed the basis of a broad consensus that Hobbes was mathematically wrong. Hobbes's lack of institutional standing made it harder for him to be taken seriously *after* the mathematical flaws were exposed.

  So, while Lindemann finally slammed the door shut and locked it, Wallis had already shown, decisively for his time, that Hobbes's particular keys didn't fit the lock and were, in fact, broken. The dispute went the way it did because Hobbes made concrete, checkable mathematical mistakes that Wallis expertly exposed using the mathematical knowledge available in the 17th century.
