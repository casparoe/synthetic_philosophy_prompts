prompt: |-
  I work at a mid-sized tech company, and a calibration meeting last week has been nagging at me ever since. My skip-level manager uses a fairly sophisticated internal model, trained on years of data from internal transfers, that she claims can reliably predict how any given employee would have performed had they been placed on a different team or project than the one they actually worked on. In my case, she used this model to argue that my strong performance this year on Project A shouldn't count much toward a promotion, since the model "shows" that had I instead been rotated onto the notoriously difficult Project B (which was briefly considered for me eighteen months ago), I would have floundered just like the last three engineers who went there. In the same breath, she used this counterfactual reasoning to explain why she'd assigned me to Project A in the first place: since she already knew in advance how I'd perform under each possible assignment, she picked the one that would let me succeed. That would mean my success reflects her foresight and planning more than it reflects anything about me.

  I don't have any philosophy background, but something about this whole picture feels off to me, and I haven't been able to articulate what, exactly. Is it even coherent to say there's a definite fact about how I "would have done" in a situation that never actually happened? And if we grant that there is such a fact, and my manager knew it in advance and used it to steer me into the assignment where I'd shine, does that undermine the credit I deserve for how I actually performed, or is this just a roundabout way of saying she's good at matching people to roles? I'd appreciate help thinking through whether my unease is justified, and if so, what exactly the problem is.
reasoning: |-
  Okay, let me try to figure out what's going on here. The user works at a tech company and is troubled by a calibration meeting. Their skip-level manager used an internal model to predict how employees would perform in different scenarios. Specifically, the model suggested that if the user had been placed on Project B instead of Project A, they would have struggled. The manager used this to downplay the user's actual success on Project A, attributing it more to her assignment choice than the user's abilities. 

  First, I need to understand why the user feels uneasy. They mentioned not having a philosophy background, so the concepts of counterfactuals and determinism might be unfamiliar. The core issue seems to be about credit assignment: does the manager's prediction and decision-making diminish the user's contribution to their own success?

  The manager's model is based on historical data of internal transfers. But how reliable is that data? People aren't static; they grow and adapt. Maybe the model assumes that past patterns strictly determine future performance, which ignores individual development. Also, Project B being "notoriously difficult" could mean systemic issues beyond individual capabilities. If previous engineers struggled, maybe the project had resource or scope problems. The model might be mistaking correlation for causation here.

  The user's success on Project A is real, regardless of predictions. The manager's argument feels like moving the goalposts—using a hypothetical failure to discount actual achievements. That's demoralizing. The user might feel their hard work is being invalidated. There's also a fairness concern. If promotions depend on counterfactuals that employees can't influence, it creates a lack of control and transparency. How can someone improve if their evaluation is based on untestable scenarios?

  Ethically, the manager's approach could lead to a fixed mindset culture. If people are pigeonholed based on predictions, they might not get opportunities to tackle challenging projects, stifling growth. The user might worry about future opportunities being limited by this model. Plus, the manager taking credit for the user's success feels like a red flag. It undermines recognition and could impact morale and trust.

  The user probably needs validation that their unease is justified. They also need ways to address this, like questioning the model's assumptions or advocating for recognition of their actual work. They might not know how to approach this conversation without sounding defensive. Practical steps, like gathering evidence of their contributions or suggesting real-world tests of the model, could help. Ultimately, it's about ensuring evaluations are based on tangible results, not speculative predictions.
answer: |-
  Your unease is absolutely justified, and the core issues here touch on philosophy of science, ethics, fairness, and practical management. Let's break down the problems with your manager's reasoning:

  1.  **The Epistemological Problem: Can We *Know* Counterfactuals with Certainty?**
      *   **No Definitive Fact:** Philosophers (like David Lewis) debate whether there are "facts" about non-existent scenarios. Even if we grant such facts *exist*, **knowing them with certainty is impossible.** Your manager's model is making incredibly strong claims about an alternate reality.
      *   **Model Limitations:** All models are simplifications. This model, trained on past transfers, relies on correlations and patterns. It **cannot account for the unique, contingent factors** that would have shaped *your specific experience* on Project B:
          *   **Your Growth:** 18 months is a long time. Your skills, knowledge, resilience, and approach likely evolved significantly since the hypothetical assignment was considered. The model treats you as a static entity.
          *   **Specific Context:** Project B's challenges 18 months ago might differ today. Your specific interactions with different teammates/managers, unforeseen project pivots, or even sheer luck could drastically alter the outcome.
          *   **The "Human Factor":** How you *respond* to challenge isn't purely deterministic. Your motivation, learning speed under pressure, or ability to seek help effectively in *that specific scenario* are unpredictable.
      *   **Self-Fulfilling Prophecy Risk:** Assigning people based on *predicted failure* ensures the prediction can never be falsified. How many people *could* have succeeded on Project B if given the support and opportunity? The model only "knows" failure because it's never tested its predictions against people predicted to succeed.

  2.  **The Ethical & Fairness Problem: Undermining Actual Achievement**
      *   **Moving the Goalposts:** Your manager is evaluating you based on a hypothetical failure *instead of* your actual, demonstrable success. This is fundamentally unfair. **Performance reviews should primarily assess what you *did*, not what a model *says* you *might* not have done.**
      *   **Denying Agency & Effort:** Your success on Project A required significant skill, dedication, problem-solving, collaboration, and execution. Attributing it *primarily* to your manager's foresight **dismisses your agency and hard work.** It implies your contribution was passive, merely fulfilling a pre-ordained script.
      *   **Credit Appropriation:** The manager's framing ("*your success reflects my foresight*") is ethically questionable. It uses your actual achievement as evidence of *their* skill while simultaneously using a hypothetical failure to *diminish* the significance of that same achievement for *your* advancement. This creates a lose-lose situation for you.
      *   **Lack of Transparency & Control:** You had no say in the assignment decision based on this model, no visibility into its prediction, and crucially, **no opportunity to prove the model wrong.** Your career progression is being influenced by opaque predictions about scenarios you never experienced.

  3.  **The Managerial Problem: Incentives and Development**
      *   **Stifling Growth:** If assignments are based *only* on predicted success in safe roles, how do employees ever develop the skills needed for tougher challenges? This approach risks creating a static workforce, denying people opportunities to stretch and prove themselves.
      *   **Demotivation:** Knowing that your success might be downplayed because a model says you *would have* failed elsewhere is incredibly demoralizing. It undermines the value of your contributions.
      *   **Misplaced Focus:** Instead of focusing on developing *you* and the *projects* (e.g., making Project B less "notoriously difficult"), the manager is relying on a model to avoid risk, potentially at the cost of individual development and organizational improvement.
      *   **Circular Logic:** "I assigned you to A because my model said you'd succeed there. You succeeded there, proving my model right and my assignment skill. Therefore, your success doesn't count much for promotion because my model also says you'd have failed elsewhere." This logic makes it impossible for your actual success to fully "count."

  4.  **The Practical Problem: Model Validation & Bias**
      *   **Untestable Predictions:** The model's key prediction about *you* on Project B is inherently untestable. How can its accuracy be verified? It relies on historical correlations, which may not be causal and may not hold for future states.
      *   **Potential Bias:** Models trained on historical data inherit historical biases. Did previous failures on Project B reflect individual shortcomings, or systemic issues (poor management, unrealistic scope, lack of resources)? If the latter, the model is unfairly penalizing individuals (like you) for systemic problems and potentially perpetuating bias in assignments and promotions.

  **What's "Off" - Summarized:**

  1.  **Arrogance of Certainty:** Claiming definitive knowledge of complex counterfactual human performance.
  2.  **Denial of Agency:** Attributing your success primarily to the manager's assignment, not your actions.
  3.  **Unfair Evaluation:** Using an untestable hypothetical failure to discount a real, proven success.
  4.  **Lack of Transparency & Opportunity:** Making impactful decisions based on opaque models without employee input or chance to challenge the prediction.
  5.  **Stifling Development:** Prioritizing predicted "safe" success over challenge and growth opportunities.
  6.  **Ethical Slipperiness:** Manager taking credit for your success while using the model to limit your reward for it.

  **How to Address This:**

  1.  **Acknowledge the Model's Use, Challenge its Application:** "I understand the model is a tool for planning assignments. However, I'm concerned that its *hypothetical* predictions about me in a scenario that never occurred are being given significant weight in evaluating my *actual, demonstrated* performance and contribution to Project A's success."
  2.  **Focus on Your Actual Contribution:** Document your specific achievements, skills demonstrated, problems solved, and value added to Project A. Quantify results if possible. Emphasize the effort and skill *you* brought.
  3.  **Question the Counterfactual's Relevance:** "While I appreciate being assigned to a project where I could contribute effectively, I believe performance evaluations should be based on the reality of what was delivered, not untested models of alternate realities. My track record on Project A speaks to my capabilities."
  4.  **Seek Growth Opportunities (Carefully):** Express interest in tackling more challenging assignments *in the future* (without referencing Project B specifically), framing it as a desire to continue growing and contributing at a higher level. This subtly challenges the model's static view of your potential.
  5.  **Seek Clarification on Promotion Criteria:** "Could you clarify the primary factors considered for promotion? I want to ensure I understand how my demonstrated performance and impact are weighted relative to other considerations."
  6.  **Consider Escalation (If Comfortable):** If the skip-level remains adamant, you might cautiously raise your concerns with HR or a trusted mentor within management, focusing on the fairness and motivational aspects: "I'm concerned that using untestable hypotheticals to discount real performance could demotivate high performers and create perceptions of unfairness."

  **In short:** Your manager is using a speculative tool to rewrite history and diminish your actual accomplishment. Your success on Project A is real and yours. The hypothetical failure on Project B is just that – hypothetical, unknowable, and fundamentally unfair to hold against you. Your unease stems from a very real sense of injustice and the dismissal of your agency and effort. You are right to question it.
