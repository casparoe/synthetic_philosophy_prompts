answer: |-
  Here's a dialogue between Dr. Aris Finch (a staunch adaptationist) and Dr. Blythe Reed (a Gould/Lewontin-inspired pluralist), wrestling with Treisman's hypothesis on motion sickness and the deeper epistemological challenge:

  **Setting:** A quiet corner of a university library coffee shop, surrounded by stacks of journals.

  **Characters:**
  *   **Dr. Aris Finch:** Early 50s, energetic, leans forward intently. Believes natural selection explains virtually all complex traits.
  *   **Dr. Blythe Reed:** Late 60s, thoughtful, speaks deliberately. Emphasizes historical contingency, developmental constraints, and non-adaptive origins.

  **(The conversation starts after Reed mentions Treisman's 1977 paper)**

  **Finch:** Blythe, this Treisman paper you mentioned... fascinating, but deeply unsatisfying. Motion sickness as just a *spandrel*? An accident? That feels like waving the white flag of scientific explanation! Millions suffer from it – cars, boats, virtual reality now. Surely selection wouldn't let such a pervasive, disruptive response persist unless it *did* something useful. Treisman's 'poison detector' misfiring? That's the *mechanism*, not the ultimate cause.

  **Reed:** Aris, you're jumping straight to the "why" without considering the "how it got here." Gould and Lewontin warned about this – the adaptationist programme's tendency to invent a "just-so story" for every trait. Treisman provides a compelling *how*: a highly adaptive system (vomiting ingested neurotoxins) triggered by a sensory conflict that *mimics* the vestibular disturbance of poisoning. It's elegant parsimony. Why posit an *additional* adaptive function when a side-effect of an existing one explains the phenomenon perfectly?

  **Finch:** Parsimony? Elegant? It explains the existence, perhaps, but not the persistence and variation! If it's purely maladaptive noise, why isn't it selected *against* more effectively? Why do some people get violently ill on a gentle ferry ride while others are fine reading in a rally car? That screams variation upon which selection *could* act. Maybe it *is* doing adaptive work! Perhaps it discourages inefficient or disorienting movement patterns in infants learning to walk? Or enforces rest during potentially dangerous travel-induced stress? Or even calibrates the vestibular system itself through aversive conditioning?

  **Reed:** Ah, the classic adaptationist move: propose a hypothetical benefit. But where's the evidence *for* that benefit outweighing the clear cost? An infant vomiting from mild motion isn't learning efficient movement; it's dehydrated and distressed. "Enforcing rest" during travel? Motion sickness often strikes precisely when vigilance might be needed. And calibration? Why use such a physiologically costly and potentially dangerous method when simpler, less disruptive feedback loops exist? Treisman's hypothesis accounts for the variation too: individual differences in vestibular sensitivity, visual reliance, or the sensitivity of the *actual* poison-response system itself. It's variation in the *trigger* and the underlying machinery, not evidence for a hidden *function* of sickness.

  **Finch:** But Blythe, consider this: if Treisman is right, blind individuals, lacking the visual-vestibular conflict, should be largely immune to motion sickness. Yet many *do* experience it, often from vestibular stimulation alone or even just expectation! Doesn't that undermine the core 'mismatch' mechanism and suggest something more inherent about the vestibular system's role that *might* be functional?

  **Reed:** Not necessarily. Blind individuals still have vestibular systems that detect motion. Intense, unnatural motion (like a boat rocking) *can* directly stimulate the vestibular apparatus in ways that might *also* mimic the chaotic signals of poisoning, even without vision. Or, their heightened reliance on vestibular input might make that system more sensitive. The core poison-detection system is still there, and it can still be triggered by aberrant signals originating *within* the vestibular system itself. It doesn't *require* vision to misfire, though vision is a major contributor for sighted individuals. The hypothesis is robust.

  **Finch:** Okay, let's grant the mechanism might hold. But here's the harder question you pluralists always dodge: **How could we ever *know* it's *just* a spandrel?** What evidence would definitively tell us Treisman is right and there's *zero* current or past adaptive function for motion sickness *itself*? We can't re-run evolution without cars or boats! Isn't the possibility of *some* secondary benefit, however small, always lurking?

  **Reed:** That's the crux, Aris. It *is* hard. But it's not impossible. We look for the hallmarks of a spandrel:
  1.  **Phylogenetic Mismatch:** Does it appear in lineages only *after* the core adaptation (the sophisticated poison-response/vomiting reflex in mammals) evolved? We don't see motion sickness reported in fish or frogs, only in mammals with that specific reflex.
  2.  **Developmental Linkage:** Is the trait inextricably tied developmentally to the adaptation? The neural pathways for motion sickness *are* the pathways for toxin-induced vomiting.
  3.  **Absence of Design:** Does the trait look like a clumsy, non-optimal response? Vomiting in response to passive motion in a safe environment is maladaptive, wasting energy and fluids. Where's the precision you'd expect for a dedicated adaptation?
  4.  **Lack of Positive Correlation:** Can we find *no* evidence that susceptibility correlates with *increased* fitness in any plausible scenario? Not just "it doesn't kill everyone," but actively finding situations where *resistance* is neutral or harmful? If susceptibility truly conferred a hidden advantage (like your "enforced rest"), we'd expect *some* positive correlation somewhere. Finding only negative or neutral correlations supports the spandrel view.

  **Finch:** But negative evidence is weak! Finding *no* benefit doesn't prove there *isn't* one, especially one that was important in a past environment. Maybe vomiting *did* discourage early hominids from clumsy tree-swinging? Maybe susceptibility *is* linked to heightened toxin sensitivity, which *is* adaptive?

  **Reed:** And that's where the burden of proof lies, Aris. Parsimony *starts* with the null hypothesis: it's a side-effect. The adaptationist claim requires *positive* evidence demonstrating that motion sickness *itself*, distinct from the poison-response system, enhances fitness *more* than a hypothetical ancestor *without* the susceptibility would have enjoyed. Can you provide that evidence? Or is your argument based on the *assumption* that pervasive traits *must* be adaptive? That's the Panglossian pitfall Gould and Lewontin warned about. We must be open to the possibility that evolution is messy, that not every feature is an optimized widget for a specific job. Sometimes, the chin is just where the jawbones meet, and motion sickness is just what happens when a brilliant poison detector gets fooled by a bumpy road.

  **Finch:** (Leans back, thoughtful) Hmph. Burden of proof... messy evolution... fine. But I maintain that dismissing the *possibility* of function stifles discovery. Looking for that hidden benefit, however small, might reveal something profound about vestibular function, neural plasticity, or stress responses. Maybe the *variation* in susceptibility *is* adaptive now, allowing some to tolerate modern travel? Isn't *that* selection acting on the spandrel?

  **Reed:** (Smiles slightly) Now *that's* a more nuanced point, Aris. A trait originating as a spandrel *can* later be co-opted for a new function – that's exaptation. Perhaps *resistance* to motion sickness *is* being selected for in modern humans, turning the *lack* of the spandrel response into an adaptation for our new environment. But that doesn't make the original motion sickness *itself* an adaptation. It started as architectural constraint – the price paid for a superb anti-poison system. Treisman gives us a powerful explanation for *why* that price exists, without needing to invent a separate fairy tale about its purpose. The evidence, as it stands, points to contingency, not design. We need to be comfortable with that complexity.

  **Finch:** (Taps fingers on the table) Comfortable? Maybe not. But... point taken. The poison detector is elegant. I'll grant it's the *simplest* explanation. But I'll keep my eyes open for that secondary function. Old habits die hard, Blythe.

  **Reed:** (Chuckles) As they should. Vigilance is good science. Just remember Gould's mantra: "Spandrels are not challenges to the power of natural selection; they are, instead, demonstrations of the limits of its exclusive action." Now, shall we tackle the adaptive significance of hiccups?

  **Finch:** (Groans playfully) Don't even start...
