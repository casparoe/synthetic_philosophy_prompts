prompt: |-
  My best friends asked me to officiate their wedding next month (yes, ordained online for $20, don't ask), and I'm stuck on the bit where I talk about the vows before they actually say them. These two have lived together 8 years already - shared lease, dog, joint bank account - and keep joking the wedding is basically just paperwork for tax reasons, that nothing actually changes come Monday. My future brother-in-law is a contracts lawyer, and I can just picture him smirking if I stand up there and say something cheesy like "everything's different starting today" when clearly it isn't. But if nothing's changing, why bother promising anything at all? I keep going back and forth on whether a promise only binds because breaking it would blindside someone who was counting on it (these two can barely surprise each other anymore at this point, so whats even left to promise?), or whether just saying "I do" out loud in front of everyone does something extra all on its own - some real obligation that wasn't there thirty seconds earlier no matter how predictable they are to each other. Could you write the part where I actually get into this, maybe 4 minutes long, right before the vows - something that commits to a real answer instead of a nice generic line, but still lands for a room of ordinary guests and not just the lawyer.
