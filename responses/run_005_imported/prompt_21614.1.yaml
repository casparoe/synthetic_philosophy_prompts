  I should analyze both passages in context. The first quote responds to nominalism (Le Roy), where Poincaré argues science must be about relations to avoid being powerless. The second discusses surviving elements of past theories. The user notes that secondary sources merge these, but they see them as distinct: one defending realism about relations, the other arguing for continuity.

