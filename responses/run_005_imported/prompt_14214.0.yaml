prompt: |-
  Random question inspired by an argument in my team's #random slack channel. Someone brought up Frege's puzzle about identity statements -- the classic 'Hesperus is Phosphorus' example, where 'Hesperus = Phosphorus' feels like real news even though 'Hesperus = Hesperus' is just trivially true, even tho both names refer to the exact same planet. I argued this isn't actually some deep unsolved puzzle, its just a reference resolution problem: 'Hesperus' and 'Phosphorus' are basically two variable names/pointers that happen to resolve to the same object (Venus) in memory, and ancient astronomers just hadn't dereferenced both yet to notice they're the same address. Once you actually do that check and see `id(hesperus) == id(phosphorus)` comes back true, that's it, mystery solved, nothing left to explain. So why do philosophers still write whole papers about this like its some deep fact about meaning, instead of just... checking pointers? Am I missing something here or is this basically a non-issue once you think about it in programmer terms?
