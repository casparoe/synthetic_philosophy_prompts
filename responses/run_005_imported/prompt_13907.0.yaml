prompt: |-
  I sit on the epistemics working group at the research nonprofit where I work, which runs an internal play-money prediction market that leadership consults before greenlighting projects. Volume is chronically thin and follows the same pattern every time: prices sit frozen for weeks, then jump only days before resolution once a few clearly-informed staff start trading and everyone else stops quoting against them -- the no-trade theorem playing out in miniature, since uninformed traders correctly infer that anyone willing to take the other side of a stale price knows something they don't.

  The group is split three ways: install a subsidized automated market maker (an LMSR, following Hanson) that always offers a counterparty, treating its expected losses as the price of earlier information; scrap the market for a Metaculus-style tournament scored against eventual outcomes, since proper scoring rules sidestep adverse selection entirely; or keep the status quo and just teach leadership to discount early prices.

  Please draft the memo I'll bring to our decision meeting. It should recommend one option, or a specific hybrid, with a rough implementation plan, and it should take seriously the strongest argument against your recommendation -- especially the worry that a subsidized market maker doesn't resolve the no-trade problem so much as pay to route around it, with the subsidy flowing mainly to whoever already holds the best information.
reasoning: |-
  We are facing a problem of thin volume and adverse selection in our internal prediction market. The no-trade theorem is manifesting: uninformed traders refrain from trading against potentially informed ones, leading to frozen prices until resolution. We have three options: (1) install a subsidized automated market maker (AMM) using LMSR, (2) scrap the market for a Metaculus-style tournament with proper scoring rules, or (3) maintain the status quo and teach leadership to discount early prices.

  I recommend implementing a subsidized AMM (option 1) because it directly addresses the liquidity problem by providing a constant counterparty, thereby enabling price discovery earlier in the project lifecycle. However, we must mitigate the concern that the subsidy primarily benefits informed traders and doesn't resolve the no-trade problem but merely pays to route around it.

  **Why the AMM?**
  - The core issue is lack of liquidity, which an AMM solves by always being willing to trade. This allows uninformed traders to participate without fear of adverse selection (because they are trading against the AMM, not potentially informed humans) and encourages information to be incorporated earlier.
  - Early price discovery is valuable for leadership decisions. Even if the subsidy is a cost, it can be seen as buying information sooner, which may lead to better project selection and resource allocation.
  - We can control the subsidy by adjusting the liquidity parameter (the "b" in LMSR) to manage the cost and the market depth.

  **Hybrid Approach:**
  We can combine the AMM with elements of a scoring rule tournament to encourage participation and information aggregation without solely relying on trading. Specifically, we can:
  1. **Implement an LMSR AMM with a modest initial subsidy.** We start with a low "b" parameter to limit the initial subsidy and adjust based on observed volume and losses.
  2. **Run parallel Metaculus-style forecasting tournaments for the same questions.** Participants can choose to trade in the market or submit forecasts (or both). The scoring rule tournament would use a proper scoring rule (e.g., logarithmic or quadratic) to reward accurate predictions without adverse selection.
  3. **Incentivize participation in both systems.** We can allocate a portion of the play-money rewards to the tournament and the market. For example, we might award prizes for top forecasters and top traders separately, or use a combined score.

  **Implementation Plan:**
  1. **Phase 1: AMM Setup (4 weeks)**
     - Technical implementation: Integrate an LMSR market maker into our existing platform. We set the initial "b" parameter conservatively (e.g., b=100 in play-money units) to limit potential losses.
     - Define a subsidy budget: Allocate a fixed amount of play-money per market to cover expected losses. We start with a small budget (e.g., 1000 play-money per market) and adjust after review.
     - Run a pilot on a subset of markets (e.g., 2-3 upcoming projects) for 2 months.

  2. **Phase 2: Tournament Integration (Parallel, starting in Phase 1)**
     - Develop a simple interface for submitting probability forecasts on the same questions as the prediction market.
     - Use a quadratic scoring rule for the tournament, which is incentive-compatible.
     - Allocate play-money rewards for tournament participants (e.g., top 10% get bonuses).

  3. **Phase 3: Incentive Alignment (Ongoing)**
     - Promote participation: Communicate the dual system and run workshops on how both mechanisms work.
     - Leadership communication: Train leadership to interpret both market prices and tournament aggregates (e.g., mean forecast) as complementary signals.

  4. **Monitoring and Adjustment (Quarterly)**
     - Track key metrics: volume, price movements, AMM losses, tournament participation, and forecasting accuracy.
     - Adjust the AMM's "b" parameter and subsidy budget based on observed losses and volume.
     - Evaluate whether the dual system is improving information aggregation and decision-making.

  **Addressing the Strongest Counterargument:**
  The primary concern is that the AMM subsidy will be captured by informed traders, effectively paying them for information they already have without improving overall information aggregation. This is a valid critique. However, we can mitigate this by:

  - **Controlled Subsidy:** By starting with a low "b", we limit the market depth, so large informed trades will move prices quickly, reducing the profit from trading on small information edges. This encourages earlier trading by informed participants but caps the subsidy loss.
  - **Complementarity with Tournament:** The scoring rule tournament runs in parallel and does not suffer from adverse selection. It provides an alternative for uninformed participants to contribute without trading. Moreover, the existence of the tournament might encourage informed traders to reveal their information earlier in the market to capture the subsidy, because if they wait, others might get the same idea and trade, moving prices.
  - **Information Diffusion:** The market prices (influenced by informed trades) and tournament forecasts (which are individual) can be compared. Leadership gets two signals: the market price (which aggregates information via trading) and the mean forecast (which aggregates without trading). This redundancy can improve decision quality.

  **Why Not the Alternatives?**
  - **Scrapping the market for a tournament (option 2):** While scoring rules avoid adverse selection, they lack the dynamic price discovery of markets and the incentive to continuously update beliefs. Markets also attract a different set of participants (those who enjoy trading). We lose the benefits of market-based aggregation.
  - **Status quo (option 3):** Without intervention, the market remains illiquid and prices are uninformative until the last minute, which defeats the purpose of early consultation. Training leadership to discount early prices does not solve the underlying problem and may lead to distrust in the market.

  **Conclusion:**
  We recommend a hybrid of the AMM and a forecasting tournament to address both liquidity and adverse selection. The AMM jump-starts the market, while the tournament provides a safe haven for uninformed participants. The subsidy is a cost, but by controlling it and combining it with the tournament, we maximize information aggregation at a reasonable expense. We start with a pilot, measure outcomes, and adjust.

  **Memo Draft:**

  ---

  **To:** Epistemics Working Group  
  **From:** [Your Name]  
  **Subject:** Recommendation for Improving the Prediction Market  
  **Date:** [Date]  

  **Issue:**  
  Our internal prediction market suffers from chronic thin volume and late price movement due to adverse selection (the no-trade theorem). This limits its value for early project evaluation.

  **Proposal:**  
  I recommend implementing a hybrid solution:  
  1. **Subsidized Automated Market Maker (AMM):** Using the LMSR mechanism to provide constant liquidity.  
  2. **Parallel Forecasting Tournament:** Using a proper scoring rule (quadratic) to incentivize probability forecasts without trading.  

  This hybrid addresses liquidity via the AMM and adverse selection via the tournament, creating complementary information streams.

  **Implementation Plan:**  
  1. **Pilot Phase (Next 2 Months):**  
     - Integrate LMSR AMM with b=100 on 2-3 test markets.  
     - Launch a quadratic scoring tournament for the same markets.  
     - Allocate play-money rewards: 50% to market (for profits and AMM subsidy) and 50% to tournament prizes.  

  2. **Training and Communication:**  
     - Host a workshop on using both systems.  
     - Guide leadership to view market prices and tournament averages as joint signals.  

  3. **Review and Scale (After Pilot):**  
     - Assess volume, price discovery timing, AMM losses, and forecast accuracy.  
     - Adjust b and rewards based on data.  

  **Addressing Concerns:**  
  *Strongest Counterargument: The AMM subsidy may be captured by informed traders without improving overall information.*  
  - **Mitigation:** We start with a low subsidy (b=100) to limit losses and encourage small, early trades. The parallel tournament provides an adverse-selection-free alternative, so the subsidy is only one part of the system. We expect that the AMM will enable earlier price discovery, and the tournament will serve as a check. By comparing the two, leadership gains a more nuanced view.  

  This approach balances cost and benefit, leveraging the strengths of both mechanisms. I move that we approve the pilot and allocate resources accordingly.

