  ## The Unyielding Gaze: Anscombe, Truman, and the Absolute Prohibition on Murder

  The ethical debate surrounding the atomic bombings of Hiroshima and Nagasaki often centers on a brutal utilitarian calculus: Did the deaths of approximately 200,000 civilians prevent an even greater catastrophe – a protracted invasion of Japan projected to cost hundreds of thousands of Allied lives and millions of Japanese lives (military and civilian)? While this framing dominates popular discourse, Elizabeth Anscombe’s 1956 protest against awarding Harry Truman an honorary degree at Oxford offered a radically different, and profoundly challenging, perspective. Her argument, rooted in Catholic natural law theory and the doctrine of double effect, categorically rejects the utilitarian justification. To understand her position and evaluate its strength against the "prevented invasion" defense, we must delve beyond summaries into the core of her reasoning.

  **Reconstructing Anscombe's Core Argument:**

  Anscombe’s argument in "Mr. Truman’s Degree" rests on an absolute moral prohibition against the *intentional killing of innocent human beings*. This is not merely a strong preference; it is an exceptionless moral norm derived from natural law – the idea that certain moral truths are inherent in human nature and discernible by reason. For Anscombe:

  1.  **Murder is Intrinsically Evil:** The deliberate killing of an innocent person is always and everywhere morally wrong. It cannot be justified by appealing to consequences, however dire or beneficial those consequences might be. It is an act that fundamentally violates the inherent dignity and right to life of the person killed.
  2.  **The Primacy of Intention:** Moral evaluation hinges critically on the agent's *intention*. What did the agent *choose* to do? What was the *object* of their will?
  3.  **The Bombings Were Intentional Killing of Innocents:** Anscombe argues that the decision to drop atomic bombs on Hiroshima and Nagasaki had, as its *intended means* to achieve the end of forcing Japanese surrender, the killing of vast numbers of non-combatant civilians. The cities were chosen as targets precisely because they were populated centers, not solely military bases. The destruction of civilian life and infrastructure was not an accidental byproduct; it was the *mechanism* of coercion. Therefore, the act falls squarely under the definition of mass murder.
  4.  **Double Effect Does Not Apply:** The Doctrine of Double Effect (DDE) allows that an action with both good and bad effects might be permissible *if*:
      *   The action itself is morally good or neutral.
      *   The agent intends only the good effect, not the bad effect (which is merely foreseen).
      *   The good effect is not achieved *by means of* the bad effect.
      *   There is a proportionately grave reason for permitting the bad effect.
      Anscombe contends the bombings fail the DDE test spectacularly:
      *   The *action* – deliberately targeting a city with a weapon of mass destruction – is not morally neutral.
      *   The *bad effect* (mass civilian death) was not merely foreseen; it was *intended as the means* to shock Japan into surrender (failing the second and third conditions). The destruction of civilians *was* the chosen instrument of policy.
  5.  **Consequences are Irrelevant to the Moral Quality of the Act:** This is the crux of Anscombe's absolutism. Even if it were demonstrably true that the bombings saved more lives overall (including Allied soldiers like your grandfather and, consequently, allowed your existence), this does not change the fundamental nature of the act. A good consequence cannot morally cleanse an intrinsically evil act. One cannot commit murder to prevent a greater number of future murders. The ends *do not* justify the means when the means involve the intentional killing of innocents.

  **The "Prevented Invasion" Defense: Objections to Anscombe**

  The most potent objection to Anscombe rests on the historical assessment of the projected invasion (Operation Downfall):

  1.  **The Scale of the Avoided Carnage:** Proponents argue that credible military estimates predicted horrific casualties. For the Allies: 250,000 to 1 million casualties (including 100,000+ deaths). For Japan: millions of military and civilian deaths from combat, starvation, and disease. Compared to the 200,000 killed by the bombs, the utilitarian calculation seems overwhelmingly in favor of the bombings. Sacrificing 200,000 to save potentially 1-2 million (or more) appears morally imperative, even tragic.
  2.  **Necessity and Last Resort:** Truman and his advisors genuinely believed the bomb was necessary to end the war swiftly and avoid the invasion. They saw it as the least horrific option available after years of brutal warfare. The ferocious Japanese resistance on islands like Iwo Jima and Okinawa, involving massive civilian casualties, seemed to confirm that an invasion would be apocalyptic. The bomb, they argued, was the "lesser evil."
  3.  **Moral Responsibility for Foreseeable Consequences:** Critics of Anscombe argue that *refusing* to use the bomb, knowing the likely consequence was a far bloodier invasion, would itself be a grave moral failure. A leader has a responsibility to protect the lives of those under their command and their citizens. Choosing the path that leads to *more* overall death, when a less deadly alternative (the bomb) is available, could be seen as morally negligent or even culpable.
  4.  **"Innocence" in Total War?:** Some challenge the clear distinction between combatant and non-combatant in the context of Japan's total war mobilization. While Anscombe strongly defends the immunity of non-combatants, others argue Japan's industrial workforce, dispersed cottage industries, and widespread militaristic culture blurred the lines, making entire cities functionally legitimate targets under the strategic bombing doctrines of the time (though Anscombe would reject those doctrines as immoral).

  **Anscombe's Rebuttal and the Strength of Her Position**

  Anscombe anticipated and rejected these objections on principle:

  1.  **Rejecting Utilitarian Calculus:** She fundamentally denies that aggregating lives and choosing the option with the lowest body count is morally valid when the "option" involves *intentional murder*. The moral law prohibiting murder is not suspended by emergencies, not even by the prospect of greater future loss. We do not kill one healthy person to harvest organs and save five dying patients. Similarly, we cannot kill innocent civilians to save soldiers (or even other civilians) from a future threat.
  2.  **Challenging "Necessity" and "Last Resort":** Anscombe would demand proof that *no other course of action* existed that did not involve mass murder. Could a demonstration of the bomb have sufficed? Was surrender genuinely impossible without atomic devastation? Were diplomatic channels exhausted? (Historians debate these points, but Anscombe's point is that *even if* the bomb was the only way to avoid invasion, it remained morally forbidden).
  3.  **The Slippery Slope:** For Anscombe, accepting the "prevented invasion" justification opens the door to justifying *any* atrocity if the projected alternative is deemed sufficiently worse. It obliterates the absolute barrier against targeting innocents, making morality entirely contingent on speculative calculations of consequences – calculations often manipulated by those in power.
  4.  **The Primacy of the Act:** She insists we must judge the act itself: Truman *ordered the killing of children, women, the elderly, and non-combatant men*. That act, in her view, is intrinsically and inexcusably evil, regardless of the motives (ending the war) or the consequences (saving lives). The moral character of the agent is defined by this choice.

  **The Verdict: Anscombe's Logic Prevails**

  This is not a comfortable verdict, especially given your deeply personal connection. However, based on the *internal logic of the arguments presented*, **Elizabeth Anscombe's position is philosophically stronger and ultimately correct.**

  *   **Moral Absolutes vs. Contingent Calculations:** Anscombe grounds her argument in a robust, non-negotiable moral principle: the intrinsic wrongness of intentionally killing the innocent. The "prevented invasion" defense relies entirely on contingent, historical, and highly speculative utilitarian calculations about what *might* have happened. While the casualty estimates are plausible, they remain projections. More importantly, even if they were proven definitively accurate, they do not, and cannot, change the fundamental nature of the act ordered by Truman. **One cannot commit mass murder to prevent a hypothetical mass death.** To accept otherwise is to abandon the core principle that innocent human life has inviolable dignity that cannot be traded away for collective benefit.
  *   **The Inescapable Intention:** The evidence strongly supports Anscombe's claim that the killing of civilians was not merely a foreseen side-effect but the *intended mechanism* of the bombings. The target selection, the nature of the weapon, and the stated goal of achieving "maximum psychological impact" confirm this. This intentionality places the act beyond the pale of the Doctrine of Double Effect.
  *   **The Burden of Proof:** The burden lies with those who would violate an absolute prohibition. The "prevented invasion" defense fails to meet this burden because it does not, and cannot, negate the intrinsic evil of the act itself. It only argues that the evil was *outweighed*. Anscombe demonstrates that certain evils cannot be outweighed; they simply must not be done.

  **Conclusion:**

  Elizabeth Anscombe forces us into an uncomfortable but necessary confrontation. The atomic bombings of Hiroshima and Nagasaki involved the deliberate decision to annihilate cities filled with innocent people as a means to an end. For Anscombe, this is the definition of mass murder. The argument that this act saved your grandfather's life, and by extension enabled your existence, while profoundly human and understandable on a personal level, is irrelevant to the moral assessment *of the act itself* within her framework. The good consequence does not purify the evil means. Her absolutist stance, grounded in the inviolable sanctity of innocent life and the primacy of intention, withstands the utilitarian counter-argument based on the prevented invasion. While the projected horrors of Operation Downfall illustrate the agonizing dilemma Truman faced, they do not absolve him, in Anscombe's view, of the moral responsibility for choosing a path that fundamentally required the murder of innocents. Logic compels the conclusion that on the specific point of whether intentionally killing innocents can be justified by good consequences, Anscombe wins the argument. The prohibition holds. The moral universe she describes is one where some doors, however tempting the path beyond them might seem, must remain permanently locked.
