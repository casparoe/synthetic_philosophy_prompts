  Let me break it down. The geometric picture treats credence functions as points in a vector space. Coherent credences form a convex set (the probability simplex). Incoherent points lie outside this set. The Brier score is a squared Euclidean distance, so finding the closest coherent point is a projection. Because the simplex is convex, the projection minimizes distance, making it closer everywhere. But why does that projection dominate? 

  The key is that for strictly convex scoring rules like Brier, the distance measure ensures that any point outside the convex set will have its projection be uniformly closer. That's due to the properties of convexity and the quadratic nature of the Brier score. The Pythagorean theorem in this context shows that the projection is strictly closer unless the point is already coherent.

  Now, for the cases where the scoring rule isn't strictly proper. If it's proper but not strictly proper, like the spherical score, there might be multiple projections or ties. So, an incoherent credence might not be strictly dominated because there could be a coherent one equally accurate in some worlds. The user's example of absolute error is good—it's not proper. In that case, the geometric intuition breaks because the distance isn't isotropic. Coherent credences aren't guaranteed to be closer everywhere. For instance, with absolute error, sometimes incoherent credences might accidentally be more accurate in certain worlds.

  The user's deeper need seems to be understanding the necessity of strictly proper scoring rules for the domination result. They want to see why coherence is tied to accuracy optimization in all possible worlds, not just in expectation. They might also be interested in the mathematical underpinnings without getting too technical, hence the request for geometric intuition.

  I should emphasize the convexity of the probability simplex and how strictly convex scoring rules ensure a unique projection that's closer in every world. Highlighting the difference between strict convexity (Brier) versus non-strict (spherical) or non-proper rules (absolute error) would clarify why the theorem requires strict propriety. 

  Also, addressing why absolute error fails: it doesn't respect the linearity of expectations, leading to scenarios where incoherent credences can be more accurate in some worlds. This contrasts with proper rules, which are designed to make expected accuracy respect the probability axioms.

