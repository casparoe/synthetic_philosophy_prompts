answer: |-
  You've hit on a genuinely significant and frequently debated tension within Moore's *Principia Ethica*. It's not a misreading; it's a core challenge in his axiology (theory of value). Here's how Moore *tries* to reconcile these points, why it's difficult, and why critics often see a problem:

  1.  **Moore's Doctrine of "Organic Unities":**
      *   This is the crucial concept Moore uses to bridge the gap. He argues that the value of a complex whole is **not** simply the sum of the values of its parts considered in isolation.
      *   A part (like a beautiful landscape) can have intrinsic value on its own.
      *   Another part (like a conscious mind) can have intrinsic value on its own.
      *   But when these parts combine into a complex whole (a conscious mind *appreciating* the beautiful landscape), the value of the whole is *greater than the sum* of the values of the parts considered separately.
      *   The *relation* between the mind and the object creates a new, higher-order intrinsic value that didn't exist before.

  2.  **Applying it to the Two Cases:**
      *   **The Lonely Beautiful World:** Moore argues the beautiful object *itself* possesses intrinsic value (goodness) simply by virtue of its beauty, even unperceived. This establishes beauty as an intrinsic good *in the object*.
      *   **The Appreciation of Beauty:** Moore argues that the *state of affairs* "a conscious mind experiencing pleasure in the contemplation of a beautiful object" is a *different* intrinsic good. Crucially, it's an *organic unity*. Its value is not merely the value of the object plus the value of the pleasure. The *combination*, the *conscious appreciation itself*, generates a unique and far greater intrinsic value than either component alone (or even their simple addition). It's a distinct kind of good.

  3.  **Why Appreciation Can Be a Greater Good:**
      *   Moore's argument is that the *organic unity* of "conscious appreciation of beauty" is one of the most complex and valuable wholes we know.
      *   While the unperceived beauty *has* value, the *experience* of appreciating it constitutes a *different* and *higher* form of value. The consciousness adds a dimension that transforms the nature of the good.
      *   Similarly, "personal affection" (love of friends) is another complex organic unity involving the recognition and appreciation of *another mind's* good qualities (which also have intrinsic value), creating a unique and immensely valuable relational good.

  **The Tension and Criticisms:**

  1.  **Degrees of Value and Vagueness:** Moore is notoriously vague about *how much* value things have. He asserts the organic unity of appreciation is "far more valuable" than the unperceived beauty, but doesn't provide a clear metric *why* the multiplicative effect is so enormous. Critics argue this is asserted rather than demonstrated.
  2.  **The Status of the Unperceived:** If the unperceived beauty has significant intrinsic value, but the appreciation of it is *so much more* valuable, it can make the unperceived value seem trivial or irrelevant in practical ethics. Why care about preserving unperceived beauty if its value is negligible compared to cultivated appreciation? Moore would say we *should* care about both, but the emphasis on appreciation as a *supreme* good can overshadow the intrinsic value he assigned to the object itself.
  3.  **The "Bonus" Problem:** Your intuition that appreciation seems like just a "nice bonus" on top of the beauty's existing value is a common criticism. If the beauty is already fully good in itself, what *exactly* does the consciousness add that creates such a quantum leap in value? Moore's answer is the organic unity, but the *mechanism* remains somewhat mysterious. Is it the *relation* itself? Is it the *pleasure* of appreciation (which Moore also values intrinsically)? He struggles to pin it down.
  4.  **Priority Question:** You ask: "shouldn't his own thought experiment actually commit him to saying the beauty (or a friend's good character) is basically where all the value lives, full stop?" Moore *does* think the beauty *in the object* is where *that specific* intrinsic value lives. But he *also* thinks the *relational state* of appreciation is where a *different, even greater* intrinsic value lives. He wants to say *both* are fundamental loci of value, but of different kinds and magnitudes.

  **Is it a Known Tension?**

  Absolutely. It's one of the most discussed aspects of *Principia Ethica*. Critics like G.E.M. Anscombe, Bernard Williams, and many contemporary value theorists have pointed out this difficulty. Supporters argue Moore successfully identifies distinct fundamental goods and explains their relationship via organic unities, even if the *weighting* remains debatable.

  **Conclusion:**

  You are not misreading Moore. You've identified a genuine tension arising from two core commitments:
  1.  **Value Realism/Objectivism:** Beauty (and other qualities) have intrinsic value *in the world*, independent of minds.
  2.  **The Supreme Importance of Conscious Experience:** The highest goods involve conscious states of appreciation and affection.

  Moore uses the "organic unity" doctrine to bridge them: the unperceived object has value (A), the conscious state has value (B), but the complex whole "consciousness appreciating the object" has a value (C) that is vastly greater than A+B, making it a supreme good. While this is philosophically ingenious, the lack of clarity on *why* C is so disproportionately large compared to A, and the potential devaluation of A in practical terms, are valid and persistent criticisms. Your feeling that he "wants to have it both ways" reflects the challenge Moore faced in fully integrating these two powerful intuitions about value.
