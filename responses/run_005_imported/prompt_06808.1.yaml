answer: |-
  Here’s the scene, clocking in at approximately 1,200 words:

  The stale coffee in Aviva Korman’s chipped mug had gone cold. Streetlights cast long rectangles across the case files strewn over her desk, illuminating the neat columns of her own notes beside Petrosky’s sprawling annotations on the Webb appeal transcript. He stood by the window, back to her, silhouetted against the city’s glow. The silence after their initial, clipped greetings stretched, thick with the unspoken paradox hanging between them.

  "You can't seriously want to sign onto Ellis's opinion, Dan," Korman finally said, her voice low but cutting through the quiet. "It's intellectually bankrupt."

  Petrosky turned, his face weary but resolute. "And aggregating votes like we're tallying a shareholder resolution isn't? We’re judges, Aviva, not Boolean circuits. The question before us isn't 'Was there error?' or 'Was it harmless?' in the abstract. It's 'Does Marcus Webb's conviction stand?' And two of us believe it should. That should be the end of it."

  Korman leaned forward, tapping the top page. "But it *isn't* the end of it. Chapman laid down a two-step test. *Error*, then *harmlessness beyond a reasonable doubt*. Each step requires its own finding. The law demands we answer both questions. Ellis refused to engage with the first question substantively. She just waved it away. You *agreed* with me on error, Dan. You saw the tape. He said 'I want a lawyer,' clear as day, and they kept questioning him an hour later. Edwards violation. Textbook."

  "And I also believe, beyond a reasonable doubt," Petrosky countered, stepping closer, "that the jury would have convicted him anyway. The eyewitness was solid, the partial print on the getaway car, the cash in his sock drawer with the dye pack residue. The confession was powerful, yes, but its absence doesn't create reasonable doubt about guilt. That's my finding. Ellis finds no error at all. Either way, the outcome is the same: affirm. Why twist ourselves into knots to manufacture a reversal only one of us actually believes in?"

  "Because it's not *manufacturing*," Korman insisted, her eyes flashing. "It's following the analytical structure the law imposes. We don't get to skip steps because the bottom line *feels* right to two people for different, even contradictory, reasons! Ellis’s position is incoherent. She says ‘no error,’ but then adds, almost as an aside, ‘but if there *was* error, it wouldn’t be harmless.’ That’s not a finding, Dan. That’s a hypothetical gloss. She hasn’t grappled with the harmlessness analysis at all. She didn't need to, because she stopped at step one. But *you* did the work. *You* concluded error. *I* concluded error. That’s a majority finding of constitutional error. Step one: met."

  Petrosky sighed, rubbing his temples. "Alright. Say we do it your way. Issue-by-issue. Majority finds error. Now step two: harmlessness. You find it harmful. I find it harmless. Ellis... well, what *is* Ellis's vote on harmlessness? She explicitly said she *wouldn't* have found it harmless *if* there was error. But she didn't find error. So is she voting 'yes, harmful' in your tally? Or abstaining? Or is her conditional statement meaningless?"

  "She articulated a position on the *question*," Korman pressed. "In the context of the *legal test*, if we find error exists – as a majority has – then her stated view is that it was *not* harmless. 'I would not have called it harmless.' That’s a vote against harmlessness. Two votes – mine and hers, conditionally – that the error was harmful. One – yours – that it wasn't. Majority finds the error harmful. Both prongs satisfied. Reversal mandated."

  "Conditionally!" Petrosky slammed his palm lightly on the edge of her desk, making the mug rattle. "Her 'vote' on harmlessness is entirely contingent on a premise she explicitly rejects! It's a phantom vote, Aviva. It exists only in the hypothetical world where *she* believes there was error, which she doesn't! In the real world, in *this* case, as she sees it, there *was* no error, so harmlessness is irrelevant. She voted to *affirm the conviction*. Period. Her musings about alternative universes don't count as a substantive finding on step two. To treat them as such is a fiction. A convenient fiction for you, granting you a majority you don't genuinely have on harmlessness."

  Korman met his intensity without flinching. "And your approach is a convenient fiction for *you*, Dan, allowing you to ignore the analytical structure and cloak Ellis’s refusal to engage with the harmlessness question in the mantle of a 'dispositional majority.' You want to collapse two distinct legal inquiries into a single gut-feel vote on the outcome. That’s not judging; that’s legislating from the bench by headcount. What does Webb get? An opinion that says 'Two of us think your conviction should stand, for different reasons we won't fully reconcile. Tough luck.' That’s not a *reasoned decision*. It’s an evasion. The law deserves better. *Webb* deserves better."

  "Webb deserves a judgment that reflects what the majority of this panel actually believes should happen to him *now*," Petrosky retorted. "And that majority believes his conviction should stand. Your method produces an outcome – reversal – that only *you* believe in! How is *that* a legitimate expression of the court's judgment? How is that fair to the State, or to the jury's verdict? It’s a procedural trick, leveraging Ellis’s poorly worded dicta to manufacture a reversal only one judge truly supports on the merits."

  "It’s not a trick!" Korman’s voice rose slightly. "It’s applying the test as written. Chapman demands we ask two questions. We have three judges. We take a vote on each question. If a majority answers 'yes' to error and 'no' to harmlessness, reversal follows. Mechanically. Predictably. Consistently. That’s the structure. Ellis participated. She expressed a view on both questions. Her view on the first was 'no error,' but her view on the second, *if error existed*, was 'not harmless.' Those are her answers. You don't get to disregard her answer on step two just because you dislike the consequence of aggregating them."

  "And you don't get to pretend her conditional statement is a binding vote on harmlessness in the real case!" Petrosky shot back. "Her actual judgment is based solely on step one. Her 'vote' on step two is hypothetical, advisory, *obiter dicta*. It carries no precedential weight for her, and it shouldn't for us. To treat it as dispositive is to elevate form over substance to an absurd degree. We’d be reversing a conviction based on a finding of harmful error that only *one* judge – you – actually believes occurred and was harmful! Ellis doesn't believe the error occurred, and I believe it was harmless. You're the *only* one who thinks Marcus Webb sits in prison wrongly because of that confession. Yet your method sets him free. How is *that* substance?"

  "Because the *substance*," Korman countered, leaning in, "is that a majority found the constitutional violation occurred. And a majority, *based on their stated views applied to the test*, found that violation wasn't harmless. The structure *is* the substance, Dan! Splitting the test isn't formalism for its own sake; it forces us to confront each constitutional requirement independently. Ellis *did* confront the harmlessness question hypothetically and found against the State. You can call it *obiter*, but it’s her considered view on the *legal question*. Ignoring it because she reached the disposition another way guts the two-step analysis. It lets judges skip steps if the bottom line seems clear by other means. That’s corrosive."

  Petrosky paced a short line in front of her desk. "And your way is corrosive to judicial candor and the very idea of a collective judgment! It forces an outcome – freeing Webb – that contradicts the genuine, substantive will of the majority of this panel. Two judges believe the conviction is sound. Only one believes it's fatally flawed. Yet Webb walks? That makes the court look arbitrary, Aviva. Worse, it *is* arbitrary. It prioritizes the mechanical application of a voting rule over the actual convictions of the judges sworn to decide the case."

  "And your way prioritizes outcome over process," Korman said quietly, the passion replaced by a steely resolve. "It says the analytical steps don't matter as long as enough judges like the result. It encourages judges like Ellis to avoid grappling with difficult parts of the test if they can get to the disposition another way. It hollows out the reasoning. Webb isn't an abstraction, Dan. He's a man who says his rights were violated. The law gives him a specific test for that claim. We owe it to him, and to the law, to apply that test properly, step by step, and let the votes fall where they may. Even if it means reversal only I 'truly' want, the structure demands it. The majority found error. The majority found harm. The conviction falls."

  Petrosky stopped pacing. He looked at her, then down at the transcript, open to the page where Webb, voice trembling, asked for a lawyer that wasn't provided. He sighed, a long, weary exhalation.

  "You think you're defending principle, Aviva. I think you're clinging to a procedural abstraction that produces a perverse result. Ellis won't sign an opinion that reverses based on an error she doesn't believe in. I won't sign an opinion that reverses based on harmful error when I believe it was harmless. If we go issue-by-issue as you propose, we get a fractured mess. A reversal with no majority reasoning. Maybe a lead opinion by you on error, a concurrence from Ellis reiterating 'no error' but accepting harm *arguendo*, and my dissent on harmlessness. It’s incoherent. It satisfies no one."

  "Except the law," Korman murmured.

  Petrosky shook his head. "The law needs to make sense on the ground. A disposition supported by only one judge's full conviction doesn't. I’ll draft an opinion affirming. Ellis will join. We'll note your dissent on the Edwards violation and harmlessness. Webb stays in prison, which is where two of the three judges who heard his case believe he belongs. That’s the reality. That’s the court speaking."

  He turned towards the door. Korman didn't move. The cold coffee sat untouched.

  "The structure *is* the reality, Dan," she said to his retreating back. "Ignoring it doesn't make Webb any freer. It just papers over why."

  Petrosky paused at the threshold but didn't turn around. "And following it blindly sets a guilty man free on a technicality only one judge finds compelling. Paper over that, Aviva." He opened the door. "Goodnight."

  The door clicked shut. Korman stared at the cold coffee, then at the transcript. She picked up her pen, the weight of Marcus Webb’s liberty heavy in the silent room, balanced precariously on the invisible fork in the road between two equally defensible, utterly incompatible, ways of counting.
