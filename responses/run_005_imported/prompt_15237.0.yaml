  ## MEMO: PRINCIPLED REFINEMENT OF SLUR POLICY FRAMEWORK  
  **To:** Policy Leadership Team  
  **From:** [Your Name], Trust & Safety Policy  
  **Date:** October 26, 2023  
  **Subject:** Balancing Safety, Expression & Scale: A Proposed Path Forward for Slur Moderation  

  ### I. The Core Challenge
  Our current blocklist-only approach prioritizes consistency and scalability but causes significant collateral damage by failing to distinguish between malicious harassment and legitimate uses (e.g., reporting abuse, artistic expression, reclaimed identity). Conversely, purely context-based solutions are operationally untenable at our scale. **We need a hybrid model that leverages automation where reliable, reserves human judgment for critical nuances, and provides clear, auditable rules.**

  ### II. Valid Concerns from Both Sides
  *   **Blocklist Advocates (Consistency/Scalability):** Rightly emphasize that no system can perfectly interpret "intent" at scale. Overly complex rules invite gaming, disputes, and inconsistent enforcement. Automated takedowns *do* prevent immediate harm.  
  *   **Context Advocates (Nuance/Equity):** Correctly argue that blanket removal silences marginalized voices, hinders abuse reporting, and ignores linguistic reclamation. Ignoring context *undermines* safety for vulnerable users.  

  ### III. Proposed Framework: The "Who-What-Whom" Model
  We adopt a **tiered approach**, combining automation with targeted human review guided by **three verifiable signals**, not subjective "intent":

  1.  **WHO is Speaking? (Creator Identity Context)**  
      *   **Principle:** Allow verified users/groups from historically targeted communities to use reclaimed slurs *self-referentially* (e.g., "We queer folks reclaimed this term").  
      *   **Rule:** *Permit* slurs used self-referentially **only** by accounts with:  
          *   A *demonstrable history* of public affiliation/advocacy for the relevant group (via profile, content history, verification).  
          *   Explicit self-identification in bio/content linked to the term.  
      *   **Automation:** Blocklist remains active. Flagged posts meeting these criteria are *escalated, not auto-removed*. Requires clear, public user signals.

  2.  **WHAT is the Purpose? (Content Structure Context)**  
      *   **Principle:** Distinguish quoting/reporting from direct attack via structural cues.  
      *   **Rule:** *Permit* slurs **only** when:  
          *   **Explicitly Marked:** Contained within quote blocks (`> `), reported speech markers (“They called me [slur]”), or academic/artistic disclaimers.  
          *   **Critical Context:** Essential for documenting abuse, hate speech, or historical/artistic discussion (e.g., survivor testimony, song lyrics, academic analysis).  
      *   **Automation:** Auto-flag posts with slurs + quote markers/disclaimers for *priority human review*. Direct, unmarked usage remains auto-removed.

  3.  **WHOM is it Targeting? (Directionality)**  
      *   **Principle:** Slurs directed *at* others (individuals/groups) are inherently harmful.  
      *   **Rule:** *Auto-remove* **all** slurs used:  
          *   As direct insults/attacks (e.g., "You are a [slur]").  
          *   Targeting groups/individuals in third-person (e.g., "Those [slur]s are...").
          *   Without clear self-referential or quoting/reporting markers meeting Rule 1 or 2.  
      *   **Automation:** Blocklist enforced strictly here. Minimal exceptions.

  ### IV. Key Advantages & Operational Guardrails

  *   **Solves Core Problems:** Protects survivors quoting abusers, artists, and reclaimed use *without* requiring impossible "intent" reads.  
  *   **Maintains Scalability:** Auto-removes >90% of high-risk direct attacks. Human review focused on clear, rule-based edge cases (<10% of flagged content).  
  *   **Consistent & Auditable:** Rules rely on *objective signals* (user profile, content structure, directionality), not subjective feelings. Moderators apply checklists.  
  *   **Harder to Game:** Reclaimed use requires persistent, verifiable identity signals. Quoting requires explicit markers.  
  *   **Appeals Process:** Users can appeal removals citing Rules 1/2 with evidence (e.g., "My profile shows I'm part of group X, used term self-referentially").  

  ### V. Implementation Roadmap (Phased)

  1.  **Phase 1 (30 Days):** Deploy updated blocklist with auto-flagging for terms meeting Rule 1/2 criteria (quotes, self-ID keywords). Train moderators on "Who-What-Whom" rules.  
  2.  **Phase 2 (60 Days):** Launch appeals channel for reclaimed/quoting context with clear evidence requirements. Publish public policy guidelines.  
  3.  **Phase 3 (Ongoing):** Monitor evasion trends & abuse of exemptions. Refine signal detection (e.g., improved quote recognition). Quarterly policy reviews.

  ### VI. Recommendation
  **Adopt the "Who-What-Whom" Framework.** It directly addresses the harms of the current blocklist while respecting the operational realities raised by its proponents. This model provides the principled, consistent rules our team needs:  
  *   **Automation** handles clear-cut attacks efficiently.  
  *   **Human judgment** is reserved for *rule-defined, high-value exceptions* supported by verifiable signals.  
  *   **Safety & Expression** are balanced through structure, not guesswork.  

  This approach moves us beyond "block everything" or "read minds," grounding our policy in actionable, equitable, and scalable principles. I recommend approval to begin Phase 1 implementation.  

  **Attachments:**  
  *   Draft Moderator Decision Tree (Who-What-Whom Flowchart)  
  *   High-Level Implementation Timeline  

  ---  
  **Key Tone Notes:** The memo validates both sides' concerns, frames the blocklist as necessary but insufficient, uses structured rules (not "it depends"), and offers a concrete, phased solution. It positions the blocklist as a core *component* of a smarter system, not the enemy.
