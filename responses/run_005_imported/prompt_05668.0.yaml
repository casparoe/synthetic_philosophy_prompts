answer: |-
  ## MEMORANDUM  
  **TO:** Shared Decision-Making Committee  
  **FROM:** [Your Name], Committee Member  
  **DATE:** [Current Date]  
  **SUBJECT:** Policy Recommendation for Presenting Survival Statistics in Prognostic Uncertainty  

  ### I. The Core Dilemma  
  The case of our sarcoma patient highlights a profound epistemological challenge in prognostic medicine, articulated by my biostatistician colleague: **All survival estimates are conditional on a chosen reference class, and no single class is ontologically privileged for an individual.** When a clinician cites "61%" (broad registry) or "22%" (narrow genomic cohort), both are *valid* but *incomplete* truths. Mandating one reference class (narrowest, broadest, or otherwise) as "definitive" risks masking this inherent uncertainty and institutionalizing arbitrariness.  

  ### II. Guiding Principles for Our Policy  
  We must balance three imperatives:  
  1. **Intellectual Honesty:** Acknowledge the reference-class problem without paralyzing decision-making.  
  2. **Clinical Utility:** Provide actionable guidance tailored to the patient’s unique context.  
  3. **Patient Autonomy:** Equip patients to contextualize estimates within their values and risk tolerance.  

  ### III. Recommended Policy: "Layered Disclosure with Uncertainty Transparency"  
  In cases where materially divergent estimates arise from equally defensible reference classes, clinicians should present:  

  #### A. **The Range of Plausible Estimates**  
     - **Example Script:**  
       > *"Based on different ways of defining ‘similar patients,’ credible estimates for your 5-year survival range between 22% and 61%. The lower estimate (22%) comes from a small group of patients with your exact tumor genetics and health profile. The higher estimate (61%) comes from a larger group with your cancer type and stage, but less genetic detail."*  

  #### B. **Contextual Drivers of Divergence**  
     - Explain *why* estimates differ in plain language:  
       > *"The lower number focuses on precision in biology but has few cases. The higher number has more data but may overlook factors unique to you."*  

  #### C. **Uncertainty Footprint**  
     - Disclose key limitations:  
       - Sample size and statistical reliability of each source.  
       - Relevance of historical data to current therapies.  
       - Unmeasured factors (e.g., biomarkers, treatment adherence).  

  #### D. **Clinician’s Interpretive Recommendation**  
     - Offer a reasoned synthesis *without* collapsing uncertainty:  
       > *"Given your genomic profile, I believe your true outlook is likely closer to the lower end of this range. However, newer targeted therapies may improve outcomes beyond historical data."*  

  #### E. **Decision Bridge**  
     - Explicitly tie statistics to choices:  
       > *"If a 22% survival chance makes aggressive treatment’s side effects unacceptable to you, palliative care is reasonable. If the possibility of longer survival justifies the risks, surgery may be preferable."*  

  ### IV. Why This Approach?  
  1. **Confronts Arbitrariness Directly:** By presenting multiple estimates, we acknowledge that no single class is "real" while resisting nihilism.  
  2. **Prioritizes Patient Cognition:** Ranges align with how humans naturally process uncertainty (e.g., "between 1-in-4 and 2-in-3").  
  3. **Reduces Mistrust:** Transparency about methodology preempts perceptions of clinician error.  
  4. **Encourages Shared Deliberation:** Patients integrate statistics with personal values when uncertainty is framed as a space for judgment.  

  ### V. Implementation Requirements  
  1. **Clinician Training:** Workshops on communicating uncertainty and reference-class tradeoffs.  
  2. **Decision Aid Standards:** Visual aids showing estimate ranges with annotated caveats (see attached prototype).  
  3. **Documentation Mandate:** Source data and rationale for any presented estimate must be recorded in the patient’s chart.  

  ### VI. Addressing the Biostatistician’s Challenge  
  Yes, selecting reference classes involves convention—but medicine demands action under uncertainty. Our policy rejects the false choice between "one true number" and statistical paralysis. By disclosing the *landscape* of plausible estimates and their contingencies, we honor both the rigor of epidemiology and the individuality of the patient. This transforms the reference-class problem from a flaw to be hidden into a framework for informed consent.  

  **Recommended Vote:** Adopt the "Layered Disclosure with Uncertainty Transparency" policy for all prognostic statistics in patient decision aids, effective Q1 [Next Year].  

  ---  
  **Attachment:** Prototype decision-aid graphic illustrating survival estimate ranges with explanatory annotations.  

  *This policy advances our duty to neither oversimplify nor abandon patients to statistical abstractions. It embraces uncertainty not as failure, but as the condition for authentic choice.*
