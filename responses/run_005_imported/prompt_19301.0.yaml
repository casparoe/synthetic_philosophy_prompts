  **Justifications:**  
  - **Millikan's proper function theory (S):** Excels by defining function via historical lineage-specific norms, making malfunction a clear failure to perform *as ancestral traits did* under selection, regardless of current failure.  
  - **Neander's selected-effects refinement (A):** Handles malfunction robustly by tying function strictly to past natural selection outcomes, but lacks Millikan's nuanced "normal conditions" framework for context-specific failure.  
  - **Wright's etiological theory (A):** Grounds function in why the trait *exists* (past consequences), but its broader "because of" criterion risks overgeneralization compared to Neander's tighter selection focus.  
  - **Boorse's biostatistical theory (B):** Explains malfunction as deviation from species-typical statistical norms, but reference-class relativity makes it fragile if failure becomes statistically common.  
  - **Bigelow & Pargetter's propensity theory (B):** Relies on *typical* current propensities of the trait *type*, so the failing heart retains the function nominally, but token-level propensity absence creates ambiguity.  
  - **Cummins' causal-role theory (C):** Fails fundamentally as function depends on *current* causal contribution; a non-pumping heart lacks this role, making malfunction inexplicable.
