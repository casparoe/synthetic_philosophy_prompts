answer: |-
  Here's a precise reconstruction of Anscombe's core argument and tailored materials for your lecture, addressing both your request and the TA's valid (though unspoken) concern about over-reliance on proportionality:

  **Core Clarification: Intention is Paramount**  
  Your proportionality-focused reconstruction isn't *wrong*, but it risks underemphasizing Anscombe's deeper point: **Intention is the primary determinant of murder, not merely disproportionate effect.** In "War and Murder," she insists:

  > "**The distinction between the intended, and the merely foreseen, is essential.**"  
  > Deliberately targeting civilians (making their death part of your plan's success condition) is *always* murder, irrespective of proportionality. Proportionality becomes relevant *only* when deaths are genuinely unintended side-effects of targeting a military objective.

  Hiroshima/Nagasaki fail *both* tests for Anscombe:
  1.  **Intention:** Truman intended the mass civilian annihilation *as the means* to force surrender. Civilian destruction wasn't collateral; it was the weapon.
  2.  **Proportionality:** *Even if* one argued the deaths were "collateral" (which Anscombe rejects), the scale was so grotesquely disproportionate to any conceivable military advantage that it would *still* be unjustifiable homicide.

  **Discussion Question: Probing Proportionality & Intention (Hiroshima/Nagasaki as Case Study)**

  > "Anscombe condemns the atomic bombings of Hiroshima and Nagasaki as murder. Let's dissect this using Double Effect (DE):
  >
  > 1.  **Military Objective:** What was the *specific, immediate* military objective of dropping the bomb on the center of Hiroshima/Nagasaki? (e.g., Destroying the 2nd General Army HQ in Hiroshima? The Mitsubishi shipyard in Nagasaki? Or was it something broader?)
  > 2.  **Necessity & Alternatives:** Were there *no feasible alternatives* to achieve that specific objective likely to cause *significantly less* civilian harm? (Consider: precision bombing of only military sites, naval blockade, awaiting Soviet entry, demonstration blast, accepting conditional surrender terms).
  > 3.  **Foreseen Harm:** Was the *immediate* death of tens of thousands of non-combatants (men, women, children) a *foreseen certainty*? Was the *scale* foreseeable?
  > 4.  **Proportionality Assessment:** **This is the key step:** Even *granting* the bombs were aimed at military objectives (which Anscombe disputes), weigh the concrete, direct military advantage *gained by destroying that specific target* against the foreseen, certain death and suffering of the civilian population. **How many civilian deaths would be 'proportionate' to destroying one army HQ or one factory? Does the actual death toll (70,000-80,000+ instantly in Hiroshima) come remotely close to that ratio?** What does this calculation suggest?
  > 5.  **Intention:** Crucially, does the *scale and nature* of the civilian harm (utter destruction of the city center, maximizing blast/fire effects on structures and people) suggest that civilian destruction wasn't just a *foreseen side-effect*, but rather the *intended means* to achieve the *broader* political objective (shocking Japan into unconditional surrender)? If so, does DE even apply?
  >
  > **Conclusion:** Does the failure of proportionality *reveal* the underlying illicit intention? Or is the illicit intention primary, making proportionality secondary? How does Anscombe's absolute prohibition on *intending* civilian deaths shape this analysis?"

  **Why this question works:**
  *   Forces engagement with DE mechanics (Objective, Intention, Proportionality).
  *   Highlights the absurdity of claiming "proportionate" collateral damage when the *scale* is city-annihilating.
  *   Leads students inevitably to question whether "collateral damage" is a credible label here, pushing them towards Anscombe's core point about *intention*.
  *   Grounds proportionality in concrete military advantage, not vague "ending the war faster."

  **Extending to Nuclear Deterrence & Countervalue Targeting: Anscombe's Logic**

  Applying the DE/proportionality framework *alone* to deterrence is insufficient and potentially misleading. Anscombe's principles lead to a *starker* condemnation:

  1.  **The Essence of Countervalue Deterrence:** It explicitly threatens the *deliberate, massive destruction of civilian populations and cities* (countervalue) as the core mechanism to prevent attack. This is not a *side-effect*; it is the *primary, intended action threatened*.

  2.  **Intention is Explicit and Central:**
      *   **Conditional Intention:** Deterrence relies on the *credible intention* to carry out countervalue strikes *if* deterrence fails. Holding this intention is a *necessary condition* for the policy.
      *   **Anscombe's Absolute Bar:** For Anscombe, *forming the intention* to commit murder (mass killing of innocents) is *itself* morally corrupt. "Doing evil that good may come" is always forbidden. Planning and intending mass murder for a "good" outcome (preventing war) is still intending mass murder.

  3.  **Proportionality's Irrelevance (or Deepening Problem):**
      *   **DE Doesn't Apply:** Since countervalue targeting *intends* civilian destruction as the means (to punish/coerce), DE is inapplicable. It's straightforwardly intending evil.
      *   **Proportionality of *Threat*?** Even if one bizarrely tried to frame the *threat* itself under DE:
          *   **Objective:** Preventing nuclear war (good).
          *   **Intended Means:** Threatening mass murder (evil intended).
          *   **Foreseen Side-Effect?** None relevant – the threat *is* the means.
          *   **Proportionality?** Threatening the murder of millions to *possibly* prevent their murder is incoherent proportionality. The threatened evil is maximal and certain *if carried out*; the good outcome (prevention) is probabilistic. The scale of evil threatened is almost infinitely greater than any *certain* good achieved by the threat itself.

  4.  **Moral Hazard & Corruption:** Anscombe would argue that adopting a policy requiring the conditional intention to murder millions fundamentally corrupts the moral character of the state and its leaders. It institutionalizes a willingness to commit supreme evil.

  5.  **Contrast with Bombings:** While the bombings *executed* mass killing (arguably murder), deterrence *requires the sustained intention and planning* to commit even greater mass murder *as policy*. The bombings were discrete (evil) acts; deterrence is a permanent state of conditional murderous intent.

  **Lecture Sketch Extension:**

  > "If Anscombe condemns Hiroshima/Nagasaki as murder due to the *intention* behind mass civilian killing (exacerbated by grotesque disproportionality), how should we analyze nuclear deterrence based on *countervalue* targeting?
  >
  > *   **Core Problem: Intention, Not (Just) Scale:** Deterrence doesn't merely risk disproportionate harm; it *depends* on the *credible conditional intention* to deliberately annihilate civilian populations. This is the *planned intention to commit murder* on an unprecedented scale.
  > *   **DE Framework Fails:** Double Effect cannot justify this. The civilian deaths aren't a side-effect; they are the *explicitly intended mechanism* of the threat. Forming this intention is morally forbidden for Anscombe – it's 'doing evil that good may come.'
  > *   **Proportionality's Bankruptcy:** Attempting a proportionality calculation between the *threatened* evil (millions dead, civilization destroyed) and the *hoped-for* good (preventing that same evil) is morally perverse. The scale of the *intended evil* is absolute, while the good is contingent. The threat *itself* involves the will to commit supreme evil.
  > *   **A Deeper Condemnation:** Therefore, on Anscombe's principles, *maintaining* a countervalue deterrent posture is arguably *more* fundamentally corrupt than the singular act of the bombings. It is the *institutionalization and perpetuation* of the conditional intent to murder innocents as state policy. While the bombings killed, deterrence requires a nation to *live with the readiness and will* to kill on a far grander scale."

  **Addressing the TA's Eyebrow:** This approach explicitly elevates *intention* to its proper primacy in Anscombe's argument (as demanded by "War and Murder"), while still rigorously employing proportionality *as a secondary test* that Hiroshima/Nagasaki fail catastrophically. It prevents the misimpression that proportionality alone is the decisive factor, which might have been the TA's unarticulated concern. The deterrence extension then flows logically from this corrected emphasis. Good luck with the lecture!
