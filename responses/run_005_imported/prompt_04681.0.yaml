  Okay, let me start by unpacking the user's question. They're part of a reading group focused on Rawls, specifically his public reason doctrine. The confusion arises from what seems like a contradiction: Rawls initially argues that comprehensive doctrines (like religious ones) shouldn't be used in political justification, but then praises MLK and the abolitionists who used religious arguments in their activism. The user thinks this might be a motte-and-bailey fallacy.

  First, I need to recall Rawls's main points in "Political Liberalism" and his revisited essay. The core idea is that in a pluralistic society, laws should be justified by public reasons accessible to all, not dependent on any one comprehensive doctrine. But then, how does he reconcile that with his support for MLK? 

  I remember Rawls introduced the "proviso" in his later work. He allows comprehensive doctrines in public discourse as long as they're supplemented by public reasons in due course. So MLK using religious language is acceptable because it's backed by public reasons like equality and justice. 

  The user might be missing this nuance. They see a contradiction, but Rawls is making a distinction between the ideal and non-ideal theory. In non-ideal situations like civil rights movements, appealing to comprehensive doctrines can mobilize people, but the movement's goals must align with public reasons. 

  Also, the user's background in rationalist communities might make them skeptical of any perceived inconsistency. They value logical coherence, so Rawls's flexibility could seem like a loophole. I should emphasize that Rawls's proviso isn't arbitrary; it's a structured exception to maintain inclusivity while allowing moral urgency. 

  Another angle: the user mentions Rawls's personal history with religion. They might suspect his bias influences his theory. But Rawls's solution tries to balance his rejection of religious coercion with respect for religious contributions to justice. 

  I need to clarify that the proviso requires religious arguments to translate into public reasons. MLK did this by framing his religious appeals within constitutional principles. The abolitionists similarly invoked ideals already present in political culture. 

  The user's deeper need might be understanding if Rawls's theory holds up under scrutiny or if it's hypocritical. They want a consistent framework for political discourse without double standards. Addressing the structured nature of the proviso and its role in both ideal and non-ideal theory should resolve their concern.
answer: |-
  Your frustration is completely understandable—Rawls's stance on religious arguments in politics *does* seem contradictory at first glance. But there's a nuanced principle at work here, not just ad hoc hypocrisy. The key lies in **Rawls's distinction between the *ideal* of public reason and its application in *non-ideal* circumstances (like deep injustice), combined with his "proviso" allowing comprehensive doctrines under specific conditions.**

  Here's the breakdown of the apparent contradiction and Rawls's intended resolution:

  1.  **The Core Ideal (The "Motte"):**
      *   In a *well-ordered society* governed by a political conception of justice (like Justice as Fairness), the *exclusive* justification for coercive laws must be based on **public reasons**.
      *   Public reasons are drawn from the **political values** implicit in the society's political conception of justice and the principles of liberal democracy (liberty, equality, fairness, basic rights, the common good, etc.).
      *   Arguments relying solely on comprehensive doctrines (religious, philosophical, moral systems) *are* illegitimate for *final* political justification. Citizens and officials have a **duty of civility** to justify coercion to each other using these shared political values.

  2.  **The Proviso and Non-Ideal Theory (The "Bailey" Explained):**
      *   Rawls isn't rigidly dogmatic. In "The Idea of Public Reason Revisited," he introduces a crucial **proviso**:
          > *"Reasonable comprehensive doctrines, religious or nonreligious, may be introduced in public political discussion at any time, provided that in due course proper political reasons—and not reasons given solely by comprehensive doctrines—are presented that are sufficient to support whatever the comprehensive doctrines introduced are said to support."*
      *   **This proviso does two main things:**
          *   **Allows Entry:** It permits citizens to bring their deeply held comprehensive beliefs (including religious ones) *into* public discourse.
          *   **Requires Translation:** It demands that *eventually*, the *justification* for the *policy or law* being advocated must be articulated *independently* in terms of public reasons (political values). The comprehensive doctrine can motivate, inspire, and frame, but the *coercive force* of law must ultimately rest on public grounds.

  3.  **Why MLK and the Abolitionists Fit (Under the Proviso):**
      *   Rawls argues that figures like MLK and the abolitionists **satisfied the proviso**:
          *   **Non-Ideal Context:** They were fighting against *egregious violations* of the very political values public reason is meant to uphold (basic liberties, equality). Public reason itself was failing or corrupted.
          *   **Mobilization & Witness:** Their religious language was powerful for *mobilizing* communities suffering injustice and bearing *witness* to the profound moral wrongs being committed in a language resonant for them.
          *   **Ultimate Reliance on Public Reasons:** Crucially, their movements *also* relentlessly appealed to **fundamental American political values** enshrined in founding documents (equality, liberty, justice) and the constitutional order. MLK's "I Have a Dream" speech famously invoked the Declaration of Independence and the Constitution ("a promissory note"). Abolitionists argued slavery violated natural rights and republican principles.
          *   **Translation Achieved:** The core demands of these movements (ending slavery, securing civil rights) were *demonstrably justifiable* solely by public reasons – reasons any reasonable citizen, regardless of religion, could (and eventually did) acknowledge as valid based on political values. The religious language *supplemented* and *energized* the appeal to public reason; it didn't *replace* it as the ultimate justification.

  4.  **The Principled Line (Avoiding the Motte-and-Bailey):**
      The line isn't "I like the outcome, so it's okay." The principled distinction is:
      *   **Violation of Public Reason:** Arguing *only* that "God commands X" or "My sacred text says Y" as the *sole and final justification* for coercing others who don't share that doctrine. This fails the duty of civility.
      *   **Acceptable Under Proviso:** Using comprehensive doctrines (religious or secular) to motivate, frame, or introduce arguments *while also being committed to and capable of providing* a public justification for the desired policy/law based solely on shared political values. The ultimate *force* of the argument must rest on public reasons.

  **Why it's Not (Just) Hypocrisy:**

  1.  **Respect for Pluralism:** Rawls genuinely wants to respect citizens' comprehensive doctrines. The proviso allows them to participate fully in public life *as who they are*, without forcing them to strip their deepest convictions from political engagement, *as long as* they respect the need for shared justifications.
  2.  **Moral Urgency:** He recognizes that in deeply unjust societies, appealing *only* to the corrupted public reason of the day is insufficient. Comprehensive doctrines provide powerful moral resources to challenge injustice *when they point towards and reinforce core political values*.
  3.  **The "In Due Course" Caveat:** The proviso isn't a free pass. The burden *is* on the speaker to eventually provide the public reasons. Rawls believed MLK and the abolitionists demonstrably met this burden by grounding their demands in the nation's own professed ideals.

  **The Valid Concern:**

  Your group's suspicion touches on a **genuine tension**: How rigorously is the "in due course" requirement enforced? Critics argue Rawls gives too much leeway to movements he personally admires, potentially weakening the constraint against purely sectarian arguments. Is the line between "motivating supplement" and "primary justification" always clear? Rawls's framework relies heavily on citizens acting in good faith to fulfill the proviso, which might be overly optimistic.

  **Conclusion:**

  It's not a simple motte-and-bailey. Rawls maintains the core ideal (public reasons are the *only* legitimate basis for coercion) but introduces a flexible mechanism (the proviso) to accommodate the reality of pluralism and the need for moral mobilization against injustice. The acceptance of MLK and the abolitionists isn't an exception based on liking the outcome; it's an application of the proviso where religious arguments served as powerful catalysts and expressions of demands *that were independently justifiable by the public political values of liberty and equality*. The principled line exists: **Comprehensive doctrines can enter the public square, but the *justification* for state power must ultimately be translatable into the currency of public reason.** Whether this line is always clear or consistently applied is a fair point of debate, but it's the structure Rawls intended.
