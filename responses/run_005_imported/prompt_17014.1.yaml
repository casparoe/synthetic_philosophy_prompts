answer: |-
  ### Comparing Updateless Decision Theory (UDT) and Functional Decision Theory (FDT)

  Your question probes whether the shift from Wei Dai's UDT (framed around policy selection under a fixed prior) to Eliezer Yudkowsky and Nate Soares' FDT (framed around subjunctive dependence between algorithmic nodes) represents a substantive technical advance or merely a change in intuition-pumping machinery. I'll address this by:
  1. **Clarifying the core of each theory**.
  2. **Analyzing whether "subjunctive dependence" adds technical power beyond UDT**.
  3. **Testing with a concrete decision problem** (a simulation-based scenario).
  4. **Evaluating foundational satisfaction**.

  Both UDT and FDT are designed to resolve dilemmas involving predictors, simulations, and logical counterfactuals (e.g., Newcomb's Problem, Counterfactual Mugging) by avoiding "thought-process updating" that leads to self-defeating decisions. They achieve this by treating the agent as a fixed entity that doesn't condition on observations in a way that severs connections to counterfactual outcomes. However, the framing differs:
  - **UDT (policy selection)**: The agent selects a policy (a mapping from observations to actions) that maximizes expected utility according to a fixed prior over world states. This policy is "updateless" because it isn't revised based on new observations, preventing regrets like defecting in Parfit's Hitchhiker after being rescued. The prior includes all possibilities (e.g., coin flips, predictor behaviors), and the policy is evaluated as a whole.
  - **FDT (subjunctive dependence)**: The agent identifies as a specific decision algorithm and considers how its output (the action choice) logically influences all instances where that algorithm is called, including in other agents' predictions or simulations. Utility is maximized by choosing outputs that yield the best outcomes across all nodes where the algorithm's output is subjunctively dependent (e.g., in a simulator's prediction of you).

  The key question is whether FDT's subjunctive dependence framing introduces new technical capabilities or is just a repackaging of UDT.

  #### Does Subjunctive Dependence Add Technical Value?
  I argue that **subjunctive dependence does not add genuine technical work beyond UDT's policy selection under a fixed prior**. Instead, it reframes UDT's insights in a more granular, intuitive way, emphasizing the agent's computational structure. Here's why:
  - **Equivalence in recommendations**: For all known decision problems, UDT and FDT produce identical action recommendations when properly applied. Both correctly handle classic dilemmas:
    - **Newcomb's Problem**: Both take one box (the policy of one-boxing or the algorithm outputting "one-box" ensures the predictor fills the box).
    - **Counterfactual Mugging**: Both pay if heads (the policy commits to paying, or the algorithm's output is subjunctively tied to the counterfactual).
    - **Parfit's Hitchhiker**: Both commit to paying (the policy ensures rescue, or the algorithm's output influences the driver's prediction).
  - **Formal equivalence**: UDT's policy is a function from inputs (observations) to outputs (actions), while FDT's algorithm is a function from inputs (including world states) to outputs. The "fixed prior" in UDT implicitly encompasses the same logical dependencies that FDT makes explicit. For instance, in a predictor scenario, UDT's prior includes the predictor's simulation as a world-state, and the policy selection optimizes over how the agent's response to observations affects outcomes. FDT's subjunctive dependence is just a way to "zoom in" on how the algorithm's output propagates through those dependencies.
  - **No new capabilities**: FDT doesn't solve problems UDT cannot. Logical uncertainty, simulation, and recursive reasoning (e.g., agents predicting each other) are handled similarly: UDT's policy selection under a prior accounts for all counterfactual paths, while FDT evaluates outcomes at all points where the algorithm is instantiated. Both require the same mathematical machinery (e.g., fixed-point equations for self-referential cases).

  However, FDT's framing offers **practical advantages**:
  - **Intuitive clarity**: Subjunctive dependence makes it easier to reason about problems involving multiple algorithmic instances (e.g., simulators, logical copies) by explicitly modeling the agent as a function in a computational graph. This can reduce errors in complex scenarios.
  - **Emphasis on identity**: FDT highlights that rational agents should identify with their decision algorithm, not their momentary beliefs or location, which aids in avoiding anthropic or self-locating pitfalls.

  But these are pedagogical benefits, not technical expansions. FDT is best read as a **restatement of UDT dressed with vivid, intuition-pumping machinery**.

  #### Test Case: Simulation Dilemma
  To rigorously test for differences, I'll use a scenario where a predictor simulates the agent, creating a potential divergence point. The **Simulation Dilemma** is adapted from variants in the FDT literature and designed to probe subjunctive dependence:

  **Setup**:
  - Omega, a perfect predictor, simulates you (Agent A) to predict your action in a game.
  - You (the real Agent A) face a choice: **X** or **Y**.
  - The simulation (Agent A-Sim) is an identical copy of your algorithm, run by Omega. A-Sim is told it is in a simulation and makes a prediction about what it would do if real.
  - Payoffs:
    - If you choose **X**, you get **$10**.
    - If you choose **Y**, you get **$100**.
    - If A-Sim chooses **Y** (predicting it would choose Y if real), Omega punishes you by deducting **$90** from your payoff.
    - A-Sim's choice has no direct payoff consequences for itself (it is a simulation).

  **Key twist**: The real agent does not know if it is the real Agent A or A-Sim. The agent is told its context ("real" or "sim") and must output an action based on that input. Omega runs the simulation before you act, so your action as the real agent and A-Sim's action are outputs of the same algorithm in different contexts.

  **Payoff structure for real Agent A**:
  - Real chooses **X**, A-Sim chooses **X**: $10 (no deduction).
  - Real chooses **X**, A-Sim chooses **Y**: $10 - $90 = -$80 (deduction applies).
  - Real chooses **Y**, A-Sim chooses **X**: $100 (no deduction).
  - Real chooses **Y**, A-Sim chooses **Y**: $100 - $90 = $10 (deduction applies).

  **Analysis under UDT**:
  - UDT selects a policy (a function from context {"real", "sim"} to action {X, Y}) that maximizes expected utility under the fixed prior. The prior assigns 50% probability to being in the real context and 50% to being in the sim context (since you don't know which you are).
  - The agent evaluates policies by considering the real agent's payoff (since the sim has no payoff, and we assume the agent cares about the real outcome regardless of role):
    - Policy 1 (always X): If real, get $10; if sim, get $10. But sim's choice triggers deduction only if it chooses Y, so if sim chooses X, no deduction.  
      - Real payoff: $10 (since A-Sim outputs X, no deduction).  
      - Expected utility (EU) = $10.  
    - Policy 2 (always Y): If real, get $100 if A-Sim chooses X, or $10 if A-Sim chooses Y; but A-Sim outputs Y, so deduction applies.  
      - Real payoff: $10 (since A-Sim outputs Y, triggering deduction).  
      - EU = $10.  
    - Policy 3 (real: Y, sim: X):  
      - If real: Choose Y, and since sim chooses X, no deduction → $100.  
      - If sim: Choose X, so no deduction for real agent.  
      - Real payoff: $100.  
      - EU = $100 (since real payoff is $100 regardless of role).  
    - Policy 4 (real: X, sim: Y):  
      - If real: Choose X, but sim chooses Y → -$80.  
      - If sim: Choose Y, causing deduction.  
      - Real payoff: -$80.  
      - EU = -$80.  
  - **UDT recommendation**: Policy 3 (real: Y, sim: X) with EU = $100. When real, choose Y; when sim, choose X.

  **Analysis under FDT**:
  - FDT treats the agent as an algorithm with outputs subjunctively dependent across instances. Here, the algorithm takes context as input and outputs an action. The real agent's payoff depends on the algorithm's output in both the real and sim contexts.
  - To maximize utility, the agent considers the consequences of its algorithm's outputs at both nodes:
    - If the algorithm outputs Y in the real context, real agent gets $100 (if sim outputs X) or $10 (if sim outputs Y).  
    - If the algorithm outputs X in the real context, real agent gets $10 (if sim outputs X) or -$80 (if sim outputs Y).  
  - Crucially, the sim's output is logically tied to the algorithm: if the algorithm is set to output X for "sim" input, then A-Sim chooses X.  
  - Optimal algorithm: Output Y for "real" and X for "sim".  
    - Real context: Output Y, and since sim outputs X (due to algorithm), no deduction → $100.  
    - Sim context: Output X, so no deduction.  
  - **FDT recommendation**: Same as UDT—when real, choose Y; when sim, choose X.

  **Result**: Both frameworks recommend identical actions. The simulation dilemma reveals no divergence because:
  - UDT's policy selection under a fixed prior naturally incorporates the subjunctive dependence: the prior includes the 50% chance of being in each context, and the policy optimizes over the joint outcomes of real and sim instances.
  - FDT's subjunctive dependence explicitly models the algorithm's outputs at both nodes but doesn't yield new solutions.

  No known decision problem in the literature (e.g., Newcomb, Psychopath Prisoner's Dilemma, Twin Prisoner's Dilemma) shows a consistent divergence between UDT and FDT. Any apparent differences stem from misapplication (e.g., forgetting UDT's fixed prior includes all counterfactuals) or framing, not technical incompatibility.

  #### Foundational Satisfaction: Which Theory is More Compelling?
  While both theories are functionally equivalent, **FDT provides a more satisfying foundational account of rational choice** for two reasons:
  1. **Granularity and clarity in complex scenarios**: FDT's computational graph framing (where agents are nodes with subjunctive links) better handles identity, recursion, and logical uncertainty. For example, in problems involving multiple self-copies (e.g., "UDT vs. CDT in the Prisoner's Dilemma"), FDT's explicit algorithm-first perspective avoids UDT's occasional ambiguity about "which prior" to use or how to define the policy space. It cleanly resolves "who I am" by pointing to the algorithm, not just the policy.
  2. **Bridges to modern AI and embedded agency**: FDT's emphasis on algorithms and subjunctive dependence integrates seamlessly with AI alignment challenges. When an AI is simulated or copied (e.g., in a predictor's model), FDT directly addresses how its outputs affect all instances. UDT, while powerful, feels more abstract and detached from computational realities.

  However, UDT deserves credit for pioneering the updateless insight, and its policy framing can be more natural in game-theoretic contexts (e.g., extensive-form games). Ultimately, FDT is not a revolution but a **refinement** that makes UDT's implicit insights more operational and intuitive. For foundational purposes, I prefer FDT because it grounds rational choice in the agent's computational essence, offering a clearer path forward for decision theory in embedded, simulated, or logically uncertain environments.
