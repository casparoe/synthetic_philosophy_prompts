  - UDT: Focuses on selecting a policy (a mapping from observations to actions) in advance, evaluated under the prior. The agent does not update on observations but instead commits to a policy that maximizes expected utility according to the prior. This avoids "updating" and then regretting the plan (as in cases where updating would lead to suboptimal actions).
  - FDT: Focuses on the subjunctive dependence between the output of the agent's decision algorithm and other parts of the world. The agent treats its decision as the output of a fixed algorithm and considers the consequences of that output in all places where it is logically or causally implicated (including in other agents' predictions or simulations).

