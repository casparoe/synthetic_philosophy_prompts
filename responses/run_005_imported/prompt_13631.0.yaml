answer: |-
  That's a fantastic historical angle for your EE! However, your current description of Anscombe as a "pacifist philosopher who thought killing in war is always wrong" **significantly misrepresents her actual position** and misses the crucial nuance of her argument, which was rooted in **Just War Theory** (specifically the principle of discrimination/non-combatant immunity), not absolute pacifism.

  Here's a breakdown of her actual position and argument against the atomic bombings:

  1.  **Not a Pacifist:** Anscombe was **not** an absolute pacifist. She was a devout Catholic philosopher deeply influenced by St. Thomas Aquinas and the **Just War Tradition**. She explicitly accepted that **some wars could be morally justified** and that **killing enemy combatants in a just war was permissible under specific conditions**.

  2.  **Core Objection: Intentional Killing of the Innocent:** Her fundamental objection to Truman (and the atomic bombings) was the **deliberate targeting and killing of non-combatants (civilians)**. She argued this constituted **murder**, regardless of the context of war.

  3.  **The Argument (Based on Just War Principles):**
      *   **Principle of Discrimination/Distinction:** Just War Theory holds that combatants may be targeted, but non-combatants (the "innocent" in the specific sense of *not directly participating in hostilities*) must be immune from direct, intentional attack.
      *   **Intention is Key:** Anscombe focused intensely on the *intention* behind the act. She distinguished between:
          *   **Foreseen but Unintended Deaths:** Killing civilians *incidentally* while attacking a legitimate military target *might* be justified under the principle of double effect (if the act itself is good/neutral, the intention is good, the good effect isn't achieved *by* the bad effect, and the proportionality is favorable). (She was often skeptical about how easily this principle was met in practice).
          *   **Intended Deaths:** Making the death of non-combatants the *means* to achieve a military or political objective (like breaking enemy morale by destroying cities and slaughtering their inhabitants) is **always morally forbidden and constitutes murder.**
      *   **Application to Hiroshima/Nagasaki:** Anscombe argued that the atomic bombings **clearly fell into the second category.** The bombs were dropped on entire cities with the explicit purpose and known certainty of killing vast numbers of civilians indiscriminately. Destroying the city and its population *was the method* chosen to force Japan's surrender. Therefore, Truman (as the authorizing commander) was directly responsible for ordering the **intentional mass murder of innocent people.**

  4.  **Why "Murderer"?** Her use of the term "murderer" was precise and shocking:
      *   **Legal/Moral Definition:** Murder is the *unlawful* killing of a human being *with malice aforethought*. Anscombe argued that within the moral law (natural law/divine law), killing innocent non-combatants intentionally is *always* unlawful and malicious in intent (in the legal sense of deliberate action knowing it will cause death), regardless of the context of war or state sanction.
      *   **Rejection of State Sanction:** She vehemently rejected the idea that the state (or a commander-in-chief) could authorize such killing and make it morally permissible. State authority does not grant a license to murder.

  5.  **The Oxford Protest Context:** Her protest wasn't *just* about Truman's past actions. It was about Oxford University **honoring** someone she believed was guilty of mass murder. She argued that by granting him an honorary degree, the university was **complicit in whitewashing a profound moral evil** and failing in its duty to uphold fundamental moral principles. Her pamphlet ("Mr. Truman's Degree") meticulously laid out the moral argument against the bombings to demonstrate why honoring Truman was unconscionable.

  **How to Accurately Describe Anscombe for Your EE:**

  *   **Ditch "Pacifist":** Instead, describe her as a **"Catholic moral philosopher"** or a **"philosopher working within the Just War Tradition."**
  *   **Focus on the Core:** Emphasize her **vehement opposition to the intentional killing of non-combatants as inherently murderous.**
  *   **State Her Charge Clearly:** "Anscombe argued that President Truman, by authorizing the atomic bombings of Hiroshima and Nagasaki, which deliberately targeted civilian populations, was guilty of mass murder."
  *   **Connect to Just War:** Explicitly link her argument to the **Principle of Discrimination/Distinction** within Just War Theory. Highlight her focus on **intention** as the key differentiator between potentially justifiable acts of war and murder.
  *   **Mention the Protest's Significance:** Frame her protest not just as personal outrage, but as an attempt to hold both an individual (Truman) and an institution (Oxford) accountable for condoning what she saw as a grave violation of fundamental morality.

  **For Depth in Your Essay (Beyond "War Bad"):**

  1.  **Explain the Principle of Discrimination:** Briefly define non-combatant immunity in Just War Theory.
  2.  **Analyze Intention:** Contrast the *intentional* destruction of cities/civilians with the *incidental* (though perhaps foreseen) deaths that *might* occur when attacking a legitimate military target (e.g., a factory surrounded by housing). Use the principle of double effect *as she understood it* (she was stricter than many).
  3.  **Apply to the Bombings:** Demonstrate how Hiroshima/Nagasaki were clear cases of *intentional* targeting of non-combatants. Cite the target selection process, the nature of the weapons, and the stated goals (breaking morale, forcing surrender via mass destruction).
  4.  **Address the "Murder" Charge:** Explain her reasoning: intentional killing of innocents = murder, state authority doesn't negate this, Truman bore command responsibility.
  5.  **Contextualize the Protest:** Show how her protest was an application of these moral principles to a contemporary event and an institutional decision, arguing that honoring Truman was morally equivalent to condoning his actions.

  By accurately portraying Anscombe's sophisticated Just War argument centered on non-combatant immunity and intentionality, you'll add significant philosophical depth and historical nuance to your EE, moving far beyond a simplistic "pacifist" label. Good luck!
