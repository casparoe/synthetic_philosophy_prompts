prompt: |-
  I've spent more years than I'd like to admit reading through the LessWrong and Overcoming Bias archives, and one topic that keeps resurfacing there without ever quite getting settled is anthropic reasoning about human extinction: the Carter–Leslie Doomsday Argument and its descendants. A discussion group I belong to, which mostly works through papers on decision theory and anthropics, spent a recent session on Bostrom's *Anthropic Bias*, and it ended in a disagreement between two members — I'll call them Marcus and Ines — that the rest of us couldn't settle and that has been nagging at me since.

  (1) Marcus opened by defending the argument in something close to its classic form: adopt the Self-Sampling Assumption, reason as though you were a random draw from everyone who will ever exist in your reference class, and notice that finding yourself so near the beginning of that population is far more probable if humanity turns out to be short-lived than if it spreads across the galaxy for millions of years — so, prior to consulting any specific extinction-risk evidence, this alone should shift your credence toward an earlier rather than later end. (2) Ines answered with two objections at once: first, the conclusion is hostage to an arbitrary choice of reference class — Homo sapiens, every hominid, every entity that has ever pondered this very argument, per Bostrom's own more paranoid examples — with no principled way to fix it; second, even granting some reference class, Bostrom's own Self-Indication Assumption, which weights hypotheses by how many observers they predict, cancels out the doomsday-style update if you adopt it alongside SSA, so the gloomy conclusion isn't forced by the math, only by a silent and undefended decision to pair SSA with a rejection of SIA. (3) Marcus conceded that SIA cancels the update, but replied that accepting SIA is the worse bargain, since it is exactly what generates Bostrom's presumptuous philosopher, who claims he can already tell working cosmologists which of two competing theories is correct — making their planned experiment unnecessary — purely because one theory implies vastly more observers than the other; letting armchair anthropics override an experiment struck him as a worse bullet to bite than a modest update toward earlier extinction, so on balance keeping SSA and living with the Doomsday Argument is the lesser cost. (4) Ines said this "lesser of two evils" framing is a false choice: you can deny that you should reason as though you were randomly sampled from any class of observers, actual or merely possible, and hold instead that your own existence and position, being fixed rather than the output of a draw that could have gone otherwise, simply isn't the kind of fact that licenses an update in either direction — an objection with real pedigree, going back to some of the earliest published critiques of Carter and Leslie (Dennis Dieks among them) — on which the Doomsday Argument and the Presumptuous Philosopher commit exactly the same mistake, so there is no dilemma to resolve because neither inference was ever licensed to begin with.

  Neither of them budged, and the group split down the middle. Could you go through moves (1) through (4) in order and say, for each, who has the better of it — a clean win, a partial point, or a wash where they are talking past each other — and flag anything important that both of them are missing? Then close with a verdict, on its own line starting with "Verdict:", on the question one level up: once all four moves are on the table, is there anything left of the original Doomsday Argument as a genuine, if weak, piece of Bayesian evidence, or does Ines's closing move dissolve it along with its presumptuous-philosopher rival?
reasoning: |-
  We are going to analyze the debate between Marcus and Ines step by step.

  (1) Marcus's opening: He defends the classic Doomsday Argument (DA) using the Self-Sampling Assumption (SSA). The SSA says to reason as if you are a random sample from all observers in your reference class (e.g., all humans that will ever exist). Then, if humanity is going to last a long time and have a huge number of humans, the probability that you find yourself in the very early part of the population (as we are now) is low. Conversely, if humanity goes extinct soon, the early part is a larger fraction of the total. Therefore, observing that we are early should update our credence toward a shorter future for humanity.

  This argument is a standard Bayesian update. Let:
  - N = total number of humans that will ever exist (if we are the only reference class, or the size of the reference class).
  - n = the current birth rank of a human (so we are at about n = 100 billion, give or take).

  The DA then notes that if N is large (long future), then the probability that a random human is among the first 100 billion is small (specifically, 100 billion / N). If N is small (say, 200 billion), then that probability is about 1/2. So, we have:

  P(early | N) = min(1, n / N)   [if N is the total, then the chance of being in the first n is n/N]

  By Bayes, the posterior for a particular N (or a model that predicts N) is proportional to the prior times P(early | N).

  So, the update shifts probability mass from large N to smaller N.

  Marcus's point is that without any other evidence, this update should make us more pessimistic.

  (2) Ines's two objections:
     (a) The reference class is arbitrary. Why Homo sapiens? Why not all hominids, or all sentient beings, or even all observers who have considered the DA? Different reference classes yield different predictions. Without a principled way to choose, the argument is flawed.
     (b) The Self-Indication Assumption (SIA) cancels the update. SIA says: the probability of a hypothesis is proportional to the probability of the hypothesis times the number of observers it predicts. In other words, you are more likely to exist in a world with more observers. So, if we combine SSA and SIA, the doomsday update disappears.

  Let me explain (b) a bit more. SIA can be thought of as a prior that weights hypotheses by their predicted number of observers. So, a hypothesis that predicts a trillion observers is a trillion times more likely (a priori) than one that predicts one observer, all else equal. Then, when we apply SSA (which conditions on being a random observer), the two effects cancel.

  Example: Suppose we have two hypotheses:
     H1: N = 200 billion (short-lived)
     H2: N = 200 trillion (long-lived)

  Prior without SIA: say, 50-50.

  With SIA: we weight by the number of observers. So prior for H2 is (200 trillion / 200 billion) = 1000 times higher than H1? Actually, if we normalize, the prior for H1 becomes 1/(1+1000) and H2 becomes 1000/(1+1000). But note: the SIA prior is proportional to the expected number of observers.

  Then, under SSA, the probability of being in the first 100 billion given H1 is 1 (if H1, then the total is 200 billion, so we are in the first 100 billion with probability 0.5? Actually, if we are at n=100 billion and H1 says N=200 billion, then we are in the first half, so P(our rank|H1) = 1 (if we are exactly at 100 billion, then in H1 we are in the first 100 billion, which is half the population). But note: we are at about 100 billion, so we are in the first 100 billion. So:

  P(our observation | H1) = 1   [because in H1, the first 100 billion are all the humans that ever lived? Actually, H1 has 200 billion, so the first 100 billion is half. But we are at the 100 billionth position? Actually, we are at about 100 billion, so we are at the end of the first 100 billion. So we are definitely in the first 100 billion. Therefore, P(our observation | H1) = 1?]

  Actually, the observation is that our birth rank is about 100 billion. In H1, the total is 200 billion, so the probability that a random human has a birth rank <= 100 billion is 0.5. In H2, it is 100 billion / 200 trillion = 1/2000.

  But now, with SIA, we have to adjust the priors. The SIA prior for H2 is 200 trillion / 200 billion = 1000 times higher than for H1? Actually, the SIA prior is proportional to the expected number of observers. So:

  Prior(H1) ∝ 200 billion
  Prior(H2) ∝ 200 trillion

  So the ratio of priors is (200 trillion) / (200 billion) = 1000. So prior odds for H2:H1 = 1000:1.

  Now, the likelihood of our observation (being in the first 100 billion) under H1 is 0.5 (because half of the 200 billion are in the first 100 billion). Under H2, it is 100 billion / 200 trillion = 1/2000.

  So the posterior odds = [Prior(H2) * P(obs|H2)] / [Prior(H1) * P(obs|H1)] = [1000 * (1/2000)] / [1 * 0.5] = (0.5) / (0.5) = 1.

  So the posterior is 50-50. The update from the observation exactly cancels the SIA prior. So we are back to the prior without the DA update.

  Thus, if we accept SIA, then the DA update does not occur.

  Ines argues that without a defense of why we should reject SIA, Marcus's conclusion isn't forced.

  (3) Marcus's reply: He concedes that SIA cancels the update but argues that accepting SIA leads to the presumptuous philosopher problem. The presumptuous philosopher (PP) thought experiment: Suppose there are two cosmological theories. Theory A predicts a universe with 1 trillion observers. Theory B predicts a universe with 1 quadrillion observers. We are about to run an expensive experiment to decide. The presumptuous philosopher says: don't bother! Because SIA says that theory B is a quadrillion/trillion = 1000 times more likely a priori. So even without the experiment, we should believe B. But this seems wrong: we should wait for the experimental evidence.

  Marcus says that the PP problem is a worse bullet to bite than the modest update of the DA. So he prefers to reject SIA and keep the DA.

  (4) Ines's closing: She says that we don't have to choose between SSA and SIA. Instead, we can reject both the DA and the PP by denying that we should reason as if we were randomly sampled from a class of observers. She appeals to the idea that our existence and position are fixed and not the result of a random draw. Therefore, we cannot use our position to update about the total number of observers. This view, attributed to Dennis Dieks and others, says that both the DA and the PP are invalid.

  Now, let's evaluate each move.

  (1) Marcus's opening: The classic DA is logically valid if we accept SSA and the reference class. However, the reference class problem is a serious issue (as Ines points out). Moreover, the DA has been criticized for producing counterintuitive results. So while the math is correct given the assumptions, the assumptions are questionable.

  (2) Ines's first move: The reference class objection is strong. Bostrom himself discusses this and tries to define a "reference class free" version, but it remains a problem. The SIA point is also valid: if we accept SIA, then the DA update vanishes. So Ines is correct that Marcus's conclusion is not forced because it depends on rejecting SIA.

  (3) Marcus's reply: The presumptuous philosopher problem is indeed a major issue for SIA. Many find it unacceptable that an anthropic argument could override empirical evidence. So Marcus has a point: SIA leads to a problem that might be worse than the DA. However, note that SIA can be formulated in ways that avoid the PP problem (e.g., by conditioning on non-indexical evidence). But the problem is still a challenge.

  (4) Ines's closing: This is a more radical position. It denies the fundamental premise of both SSA and SIA: that we should reason as if we were randomly selected from a class of observers. If we take the view that our existence and position are fixed and not random, then we do not get the DA update and we also avoid the PP. This view is known as the "no probability" view or the "indexical certainty" view. It has been defended by several philosophers.

  However, note that without any anthropic reasoning, we might be missing important updates. For example, in the sleeping beauty problem, or in the simulation argument, anthropic reasoning seems necessary. So completely rejecting anthropic reasoning might be too strong.

  Moreover, there are other approaches. For instance, the Full Non-indexical Conditioning (FNC) or the idea of using only non-indexical evidence. Also, Bostrom's own position in "Anthropic Bias" is to use SSA but to be careful about the reference class and to avoid SIA.

  Verdict: What is left of the Doomsday Argument?

  The Doomsday Argument is not dead. It remains a valid Bayesian argument under SSA and without SIA. However, it is highly sensitive to the choice of reference class and to the decision of whether to adopt SIA. Ines's closing move (rejecting anthropic reasoning entirely) does dissolve both the DA and the PP, but that move is controversial and not universally accepted. Many in the field (including Bostrom) continue to take the DA seriously, albeit as one consideration among many.

  Therefore, the original DA can still be considered a genuine, though weak and highly contested, piece of Bayesian evidence. It is weak because of the reference class problem and the SIA counterargument. But it is not dissolved by Ines's move unless one accepts her radical rejection of anthropic reasoning. Since that rejection is not the consensus, the DA remains on the table as a topic of ongoing debate.

  However, in light of the above, it is clear that the DA is not a knockdown argument and must be handled with caution.

  Final Verdict:

  Verdict: The Doomsday Argument remains a valid but weak and highly contested Bayesian update under the Self-Sampling Assumption without the Self-Indication Assumption, but it is dissolved if one rejects anthropic reasoning entirely. Given the lack of consensus on anthropic reasoning, the argument persists as a topic of debate but cannot be considered decisive.
answer: |-
  ### Analysis of the Debate

  #### (1) Marcus's Opening: Defending the Classic Doomsday Argument
  - **Marcus's position**: Adopts the Self-Sampling Assumption (SSA), arguing that observing oneself in an early position within the reference class (e.g., all humans) is more probable under a short-lived humanity. This Bayesian update favors earlier extinction.
  - **Evaluation**: Marcus has a **partial point**. The core logic is mathematically sound *if* SSA and a fixed reference class are granted. The Doomsday Argument (DA) is a valid Bayesian inference under these assumptions, and it highlights a counterintuitive consequence of anthropic reasoning. However, this move is vulnerable to objections about reference-class arbitrariness and alternative assumptions (e.g., SIA), which Ines immediately raises. Marcus is correct that DA emerges naturally from SSA, but he fails to preemptively address its foundational weaknesses.

  #### (2) Ines's First Objections: Reference Class Arbitrariness and SIA
  - **Ines's position**: 
    - (a) **Reference class arbitrariness**: DA's conclusion depends on an unjustified choice of reference class (e.g., *Homo sapiens* vs. all sentient beings). 
    - (b) **SIA cancels DA**: Adopting the Self-Indication Assumption (SIA)—weighting hypotheses by their predicted number of observers—nullifies DA's update when combined with SSA.
  - **Evaluation**: Ines scores a **clean win** here. 
    - (a) Reference-class arbitrariness is a well-known flaw in DA, emphasized by Bostrom and critics like Dieks. Without a principled way to define the class (e.g., "observers who could have been me"), DA is underdetermined and manipulable. 
    - (b) The SIA counterargument is decisive: if SSA and SIA are jointly adopted, the "early observer" likelihood update is exactly offset by SIA's prior weighting toward larger populations. Marcus must now defend why SSA *without* SIA is preferable, which he attempts in (3). Ines correctly notes that DA isn't forced by "the math" alone—it relies on an implicit choice to reject SIA.

  #### (3) Marcus's Reply: SIA Invites Presumptuousness, Making DA the Lesser Evil
  - **Marcus's position**: Concedes SIA cancels DA but argues SIA leads to the worse problem of the "presumptuous philosopher" (PP), where anthropics overrule empirical evidence (e.g., declaring a cosmos with more observers likely without experiments). Thus, rejecting SIA and accepting DA is the "lesser cost."
  - **Evaluation**: Marcus has a **partial point**. PP is a serious problem for SIA: it violates scientific norms by allowing armchair reasoning to override empirical testing. Marcus is right that trading DA for PP swaps one paradox for another that many find more jarring. However, this is a **false dilemma**: Ines's next move (4) shows we aren't forced to choose between SSA and SIA. Marcus also overlooks that PP can be mitigated (e.g., by restricting SIA to non-arbitrary reference classes), while DA's reference-class problem remains intractable. His framing is strategic but incomplete.

  #### (4) Ines's Closing: Rejecting Anthropic Sampling Entirely
  - **Ines's position**: Denies the premise that we should reason as if randomly sampled from observers. Our existence and temporal position are fixed facts, not "random draws," so they license no update. This view dissolves both DA and PP as errors.
  - **Evaluation**: Ines scores another **clean win**. Her position—rooted in critiques by Dieks, Norton, and others—attacks the foundation of anthropic reasoning. If first-person indexical facts (e.g., "I exist now") aren't random variables but fixed background conditions, they cannot drive Bayesian updates. This undercuts *both* DA and PP, resolving Marcus's dilemma by rejecting its framing. Crucially, this move avoids arbitrary choices (e.g., reference classes or SSA vs. SIA). While controversial, it is coherent and philosophically grounded.

  ### What Both Are Missing
  - **Marcus**: Fails to engage with the **epistemic immunity** of our temporal position. If "now" is necessary to our existence (e.g., we couldn't exist in the 30th century), observing we are early is unsurprising regardless of humanity's longevity—undermining DA's likelihood ratio.
  - **Ines**: Underemphasizes that rejecting anthropic sampling might **weaken probabilistic reasoning in other contexts** (e.g., the Sleeping Beauty problem or multiverse cosmology). If indexical facts are inadmissible for updates, we lose tools some consider useful.
  - **Shared blind spot**: Neither addresses **empirical calibration**. DA's Bayesian update is weak compared to concrete evidence (e.g., nuclear war or asteroid risks). Even if DA holds, its effect is dwarfed by domain-specific extinction risks.

  ### Verdict: 
  The Doomsday Argument dissolves entirely under Ines's closing move. If indexical facts about our position are fixed and not subject to random sampling, they provide no evidence for or against humanity's longevity. DA and PP both rely on the same flawed premise—that we can treat ourselves as randomly sampled from a reference class of observers—and rejecting this premise invalidates them equally. While DA retains a *technical* validity under SSA without SIA, it collapses under the weight of reference-class arbitrariness and the more fundamental objection that anthropic sampling is ill-founded. No coherent, non-arbitrary version of DA survives as Bayesian evidence.
