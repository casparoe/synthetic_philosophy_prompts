prompt: |-
  I've been reading through some of the literature on imprecise probabilities (Walley's work on imprecise Bayesianism, and some more recent stuff from Elga, Sarah Moss, and others), and there's a particular objection I keep running into that I can't quite get a satisfying handle on: the idea that indeterminate credences make an agent's preferences susceptible to sure losses or otherwise seem to license some kind of rational dilemma when it comes to decision-making. The rough shape of the worry, as I understand it, is that if my credence in some proposition is represented by a set of probability functions rather than a single sharp number, then standard ways of cashing out "rational preference" (e.g., strict avoidance of dominated options) either stall out and deliver no verdict at all in cases where they clearly should, or else they permit a kind of status-quo bias where the mere act of possessing an option changes whether it's rational to choose it.

  Can you walk me through why this problem arises formally -- like what exactly breaks down when you try to extend expected utility maximization to sets of probability measures -- and then also give me the intuitive version, ideally with a concrete example involving a bet or an act, so I can see where exactly the determinacy of comparison fails? I'd also appreciate it if you could say something about whether this is best understood as a devastating objection to imprecise credences as a model of rational belief, or whether there's a way of biting the bullet (e.g. via some kind of sequential choice framework, or supervaluationist treatment of "rational permissibility") that dissolves the sting.
