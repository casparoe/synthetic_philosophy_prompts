  hey, for my non-classical logics seminar we have to post our own discussion question based on this week's readings (some Priest, plus an intro paraconsistency chapter), and honestly the readings keep treating dialetheism and paraconsistent logic like they're basically the same thing, which i don't think is actually true. can you compare dialetheism with the more general idea of paraconsistent logic and say whether theyre really seperate things or not? specifically, in what ways is dialetheism a stronger/more specific commitment than just adopting a paraconsistent logic -- could someone use a paraconsistent logic without being a dialetheist, and if so why would they want to?
