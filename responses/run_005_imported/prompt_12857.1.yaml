  Then the driver should continue if E_continue > E_exit, i.e., α(4-3p) + (1-α) > 4(1-α)

  Simplify: α(4-3p) + 1 - α > 4 - 4α

  α(4-3p -1) +1 > 4 -4α

  α(3-3p) +1 > 4 -4α

  3α(1-p) +1 > 4 -4α

  Bring all to left: 3α(1-p) +1 -4 +4α >0

  3α -3αp +4α -3 >0? Let's recalculate:

  From: 3α(1-p) +1 > 4 -4α

  Then 3α(1-p) +4α +1 -4 >0

  α [3(1-p) +4] -3 >0

  α(3 -3p +4) >3

  α(7-3p) >3

  Now α =1/(1+p) as before.

  So  [1/(1+p)] * (7-3p) > 3?

  Then (7-3p)/(1+p) >3

  7-3p > 3(1+p)

  7-3p >3 +3p

