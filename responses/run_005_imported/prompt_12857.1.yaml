  Hmm, the user's background in physics is key here. They mention ensemble averages versus single trajectories. In physics, those usually converge when handled correctly. So why not here? The issue must lie in the self-locating uncertainty. When the driver is at an intersection, they don't know if it's the first or second. Their belief about which exit they're at depends on the strategy itself. That creates a feedback loop.

