prompt: |-
  I've got a logician coming on my podcast next week who defends a patched-up version of Gödel's ontological argument -- basically the Anderson-style move of rejigging how "positive property" and essence connect to necessary existence, specifically to dodge the modal collapse result (the fact that Gödel's original axioms entail that every truth is a necessary truth, which even a lot of theists find embarrassing). My own work is in virtue ethics so formal modal logic really isn't my home turf, and I don't want to just lob him questions that let him re-derive the proof for the audience -- we're sending listeners a plain-language write-up of the axioms ahead of time so we can skip straight to the interesting stuff.

  Here's the wrinkle: whenever he's pressed on modal collapse in print, his go-to move is to say something like "every serious necessitarian from Spinoza on has thought contingency is the thing that needs defending, not necessity" -- which shifts the burden of proof rather than actually addressing whether his emendation earns him that Spinozist picture or just backs into it through some fairly ad hoc axiom-tinkering. Can you draft me eight or nine interview questions, arranged so the first couple let him state that deflection plainly and then each subsequent one makes it harder for him to just repeat it, ending in a question that forces him to say which specific axiom of his revised system is actually doing the work of avoiding collapse and why that axiom is more than a stipulation. Separate from that sequence, I want at least one question that goes after "positive property" as a primitive -- whether its really carrying logical weight or is theology dressed up formally, given that even Leibniz's own gloss on perfections was pretty clearly loaded -- and one on the parody arguments (a necessarily-existent maximally bad being, or the Oppy-style parallel proofs), pressing on whether his axioms actually rule those out or just define them away. End the whole set with a question about what he'd accept as evidence that his repaired argument fails, since I suspect the honest answer is "nothing," and I want him to either own that or find something. For each question, add a one-line follow-up keyed to the reply he's most likely to give. And if you can naturally fold in a question about why the proof needs S5 (or at least the B axiom) for the possibility-to-necessity step, and what that commits him to about the logic of metaphysical modality more generally, great -- but that one's a bonus, not essential.
