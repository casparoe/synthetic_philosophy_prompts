prompt: |-
  Having spent the last few years working through the decision-theory literature after a career in experimental physics, I've become intrigued by evidential cooperation in large worlds, but one point keeps tripping me up. ECL's case for cooperation seems to rest on treating the correlation between my decision procedure and those of causally isolated agents elsewhere in the universe as decision-relevant, in the way subjunctive dependence is decision-relevant for superrationality in a one-shot Prisoner's Dilemma. Yet this looks structurally similar to the correlation between smoking and the lesion in the classic smoking-lesion problem, which is usually taken to be exactly the kind of correlation an evidential decision theorist should learn to ignore via something like the tickle defense. Could you explain what principled distinction ECL proponents draw between these two cases—why the correlation across large-world agents is supposed to license cooperative action rather than being dismissed as spurious in the same way?
reasoning: |-
  Okay, the user has a background in experimental physics and has been diving into decision theory. They're specifically puzzled about Evidential Cooperation in Large Worlds (ECL) and why it treats correlations between decision procedures in causally isolated agents as decision-relevant. They draw a parallel to the smoking-lesion problem, where evidential decision theorists (EDT) learn to ignore such correlations via the tickle defense. The user wants to know the principled distinction that ECL proponents make between these two cases.

  First, I need to recall both concepts clearly. The smoking-lesion problem is a classic counterexample to EDT. In that scenario, smoking doesn't cause cancer; instead, a genetic lesion causes both the urge to smoke and cancer. EDT mistakenly recommends not smoking because it correlates with cancer, even though smoking itself has no causal effect. The tickle defense here suggests that if the agent can introspect and condition on the presence of the lesion (via a "tickle"), they break the spurious correlation and make the right decision.

  Now, ECL argues that in large worlds with many similar decision-makers, agents should cooperate in dilemmas like the Prisoner's Dilemma because their decision algorithm correlates with others. The user sees a structural similarity: both involve correlations without direct causation. Why should one be actionable and the other spurious?

  The key points to address are agency and control. In the smoking-lesion case, the lesion is a fixed state; the agent can't change it. Conditioning on the tickle reveals that smoking doesn't affect the lesion. But in ECL, the decision algorithm itself is the source of correlation. Your choice is part of a pattern that includes others' choices. By cooperating, you're making it more likely that others with the same algorithm also cooperate, leading to mutual benefit. The correlation isn't spurious because it's tied to the algorithm's implementation across agents.

  The user might be missing that in ECL, the decision-makers are symmetric and their algorithms are identical or similar. Your action provides evidence about what other instances of your algorithm do. Since the algorithm determines both your action and theirs, changing your action changes the evidence about theirs. This isn't about changing a fixed state but about the logical implications of your decision process.

  Also, the tickle defense in smoking-lesion works because the lesion is pre-existing. But in ECL, there's no equivalent pre-existing state; the decision is active. The correlation arises from the algorithm's properties, not an external factor. ECL proponents see this as a legitimate way to achieve cooperation where causal approaches fail.

  The user's deeper need might be understanding how to distinguish between actionable correlations and spurious ones in decision theory. They might be seeking a framework to evaluate when correlations should influence decisions, especially in large-world scenarios. As a physicist, they might appreciate the analogy to quantum mechanics or statistical mechanics, where correlations in entangled particles or emergent behaviors play a role. But I should avoid digressing into those unless relevant.

  I should also clarify that ECL isn't universally accepted. Some decision theorists might still view it as spurious. But the user is asking for the proponents' perspective. Emphasize the logical dependence in algorithms versus fixed external states. Highlight the symmetry and mutual benefit in ECL, unlike the unilateral harm in smoking-lesion.

  Need to ensure that the explanation is principled, addressing why one correlation is exploitable and the other isn't. Use terms like "logical correlation" versus "causal independence" to frame the distinction. Conclude that the distinction lies in whether the correlation stems from the decision-making process itself versus an external, fixed factor.
answer: |-
  That's an exceptionally sharp question cutting to the heart of evidential decision theory (EDT), superrationality, and ECL. You've perfectly identified the tension: both cases involve seemingly spurious correlations, yet ECL proponents argue the large-world agent correlation *is* decision-relevant while the smoking-lesion correlation is not. The principled distinction hinges on **agency, control, and the source of the correlation.**

  Here's a breakdown of the key differences and the ECL argument:

  1.  **The Source of the Correlation & Agency:**
      *   **Smoking-Lesion:** The correlation (smoking <-> lesion <-> cancer) arises from a **pre-existing, fixed state** (the lesion) *external* to the agent's decision process. The lesion causes both the disposition to smoke *and* the cancer independently. The agent *has no control* over the lesion's presence. Their decision to smoke or not is *symptomatic* of the lesion, but doesn't causally affect it.
      *   **ECL / Large-World Agents:** The correlation (My_Algorithm_Outputs_C <-> Other_Agents_Algorithms_Output_C) arises from the **logical/mathematical structure of the decision algorithm itself** shared across agents. Your decision algorithm *is the source* of the correlation. *Your output is intrinsically linked* to the outputs of other logically/functionally identical or sufficiently similar algorithms running elsewhere. Crucially, **you *are* your algorithm.** Your decision *isn't* just symptomatic of a fixed external state; it *is* an instance of the state that defines the correlation pattern.

  2.  **Control & Counterfactual Dependence:**
      *   **Smoking-Lesion (Tickle Defense):** Conditioning on the fixed state (the lesion, via the "tickle") breaks the spurious correlation. *Given the lesion exists*, smoking doesn't cause cancer. *Given no lesion exists*, smoking also doesn't cause cancer. Your choice *lacks counterfactual control* over the lesion or the cancer risk it imposes. The correlation is purely *evidential*, not *controllable*.
      *   **ECL / Large-World Agents:** Conditioning on the fixed state (the *algorithm* itself) **does not break the correlation relevant to the outcome.** The algorithm *defines* the mapping from input/world-state to output. Crucially, **your output is part of the evidence *for what the algorithm outputs* in this situation.** If your algorithm outputs Cooperate, that *is evidence* that other instances of the *same* algorithm, facing the *same* logical problem (e.g., a Prisoner's Dilemma with sufficiently similar agents), also output Cooperate. Your choice *does* have a form of **logical counterfactual control**: *If* you output Defect, that would be evidence that other instances output Defect. The correlation is embedded in the *definition* of the decision rule.

  3.  **Exploitability & Mutual Benefit:**
      *   **Smoking-Lesion:** The correlation is *exploitative* of the EDT agent. Not smoking avoids bad news (cancer diagnosis) but doesn't change the underlying risk (the lesion). It's a *unilateral* trap. There's no potential for mutual gain via correlation; the lesion is indifferent.
      *   **ECL / Large-World Agents:** The correlation is *exploitable for mutual benefit*. If all sufficiently similar agents reason that "outputting C provides strong evidence that others like me output C, leading to the mutually preferable (C, C) outcome," and act on it, they *achieve* (C, C). If they reason "outputting D provides evidence others output D, leading to (D, D)" and act on *that*, they get (D, D). Crucially, **cooperating is part of a self-fulfilling prophecy that benefits everyone using the cooperative algorithm.** The correlation isn't a trap laid by an indifferent world; it's a *feature of logical consistency* that cooperative agents can leverage.

  4.  **The "Tickle" Analogy in ECL:**
      *   **Smoking-Lesion Tickle:** "I feel the urge to smoke (the tickle), which tells me I have the lesion. *Given I have the lesion*, smoking doesn't cause cancer. I might as well smoke."
      *   **ECL "Tickle":** "I am an instance of Algorithm A. *Given that I am Algorithm A*, what does Algorithm A output in this logical scenario? And what does that imply about the outputs of other instances of A?" Conditioning on your algorithm *reinforces* the correlation because the algorithm's output *is determined by its nature*. There is no deeper "fixed state" to condition on that severs the link between your output and the (probable) outputs of others *if the algorithm is fixed*. The only way to "break" the correlation would be to condition on the *specific output* itself, which is what you're deciding!

  **The Core ECL Argument Summarized:**

  1.  **Algorithmic Identity:** You *are* your decision algorithm. Your output isn't just chosen; it's *determined* by the algorithm + inputs.
  2.  **Logical Correlation:** If other agents implement the *same* (or sufficiently similar) algorithm facing the *same* logical problem, their outputs are logically correlated with yours. Your output provides Bayesian evidence about theirs, and vice versa.
  3.  **Controllable Evidence:** Unlike the lesion, *you control your output*. Choosing C *makes it the case* that "Algorithm A outputs C in this scenario." This is strong evidence that other instances of A also output C.
  4.  **Mutually Beneficial Self-Fulfilling Prophecy:** If Algorithm A is designed to output C *because* it recognizes step 3, and other instances of A do the same, then (C, C) is achieved. Outputting C *causes* (in the evidential/logical sense) other A's to likely output C, leading to the good outcome. The correlation isn't spurious; it's the *mechanism* enabling cooperation where causal isolation would normally doom it. Ignoring this correlation (like EDT ignores subjunctive dependence) leaves mutual gains on the table.

  **Why Proponents Reject the Spurious Label for ECL:**

  They argue the smoking-lesion correlation is spurious *because it points to an uncontrollable, fixed, external cause*. The ECL correlation points to *the logical consequences of your own controllable decision rule operating in a world containing logical copies*. It's not spurious; it's *constitutive* of what it means to be a particular type of decision-maker in a large world. Dismissing it as spurious is akin to an EDT agent dismissing *all* evidence about the world that isn't directly causally manipulable – a position most ECL proponents find untenable and self-defeating in large-world logical scenarios.

  **Criticisms & Nuances:**

  *   **Is the Correlation Really Controllable?** Critics (often proponents of Causal Decision Theory - CDT) argue that while your choice *correlates* with others, it doesn't *cause* theirs (due to causal isolation). ECL proponents counter that *logical* dependence (arising from shared algorithm) is just as real and decision-relevant as causal dependence in these scenarios.
  *   **Defining "Similar" Algorithms:** How similar must algorithms be for the correlation to hold? This is a major area of research (e.g., logical uncertainty, program equilibrium).
  *   **Tickle Defense Applicability:** Some argue that sufficiently deep introspection *could* provide a "tickle" revealing the algorithm's output *before* the decision, potentially breaking the correlation. ECL proponents often argue that for complex agents, such perfect introspection is impossible, or that the algorithm's output *is* the relevant state.

  **In essence:** ECL proponents distinguish the cases based on the correlation's origin (algorithmic identity vs. external fixed state) and its exploitability (leveraging logical dependence for mutual benefit vs. being exploited by an indifferent world). They see the large-world agent correlation as fundamental to rational agency in a universe teeming with logical copies, not as a spurious artifact to be conditioned away.
