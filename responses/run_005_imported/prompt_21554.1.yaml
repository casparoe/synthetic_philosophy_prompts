  Given my work on philosophy of mind, I somehow ended up as the resident philosopher on my hospital's disorders-of-consciousness working group, which manages our long-term vegetative and minimally-conscious patients. We've got a patient who meets behavioral criteria for unresponsive wakefulness syndrome -- nothing at the bedside -- but whose EEG team ran an active command-following paradigm and got a clean, repeated signal back, so she's now formally labeled 'cognitive-motor dissociation.' Half the group wants to extend our minimally-conscious-state analgesia protocol to her before a scheduled procedure next week, since reliable command-following means real perception and working memory are obviously happening in there; the other half (we've got a resident higher-order theorist) says that's exactly the kind of first-order processing you'd expect even if there's nothing it's like to be her right now, since nobody's tested for anything resembling the higher-order signature that would actually settle it. Our protocol just doesn't address CMD patients at all -- its silent on exactly this case. Can you draft the memo I'll bring to next weeks meeting -- I need one actual recommendation on the analgesia question with a timeframe, not a punt to 'more research needed,' and it has to genuinely engage the higher-order side instead of just defaulting to precaution because that sounds like the responsible answer.
