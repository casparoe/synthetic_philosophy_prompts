  **Key Supporting References:**  
  - Monti et al. (2010). *Willful Modulation of Brain Activity in Disorders of Consciousness*. NEJM.  
  - Laureys & Schiff (2012). *Coma and consciousness: Paradigms (re)framed by neuroimaging*. NeuroImage.  
  - Mashour et al. (2020). *Consciousness, Anesthesia, and the Thalamocortical System*. Anesthesiology.  
  - HOT-Specific: Lau & Rosenthal (2011). *Empirical support for higher-order theories of conscious awareness*. TICS.
