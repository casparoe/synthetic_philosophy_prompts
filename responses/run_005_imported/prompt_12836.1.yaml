  Structure the debate in turns. Start with Ibn Rushd posing the reliability question. Al-Ghazālī responds with divine custom. Then Ibn Rushd counters with the miracle issue. Al-Ghazālī comes back with the problem of inferring necessity. Keep each response directly addressing the previous point. Avoid repetition; each exchange should build on the last.

