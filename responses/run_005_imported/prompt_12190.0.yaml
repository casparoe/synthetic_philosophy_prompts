answer: |-
  That's an incredibly insightful question arising from a profound real-world experience. Your encounter with jury deliberation highlights the tension between mathematical elegance and legal reality. Condorcet's Jury Theorem (CJT) *is* a powerful theoretical argument, but its limitations in the courtroom context explain why legal scholars and courts haven't embraced massive jury expansion. Here's a breakdown of the key reasons:

  1.  **Violation of Core Assumptions: Independence and Competence:**
      *   **Independence:** CJT assumes jurors reach their conclusions *independently* before voting. Real juries are designed for **deliberation**. Jurors discuss evidence, challenge each other's reasoning, share perspectives, and potentially change their minds based on collective reasoning. This interdependence fundamentally violates CJT's core premise. In large groups, deliberation becomes less effective, potentially amplifying groupthink, polarization, or the dominance of a few vocal members, rather than fostering true independent thought followed by aggregation.
      *   **Competence (p > 0.5):** CJT requires that *on average*, each juror has a better than 50/50 chance of being correct *individually*.
          *   **Varying Competence:** Real competence varies wildly based on case complexity, evidence clarity, attorney skill, juror education/background, cognitive biases, and pre-existing beliefs. A single complex expert witness might push many jurors below the p>0.5 threshold.
          *   **Common Biases:** Jurors share common societal and cognitive biases (e.g., racial bias, confirmation bias, belief in eyewitness fallibility). These *correlated errors* mean jurors aren't making independent mistakes; they're likely to make the *same* mistake. If a bias pushes the average competence *below* 0.5 for a specific case, CJT predicts larger juries make things *worse* (approaching certainty of the wrong verdict!).
          *   **The "Correct" Verdict Problem:** CJT assumes a single, objectively "correct" verdict. Legal verdicts often involve nuanced interpretations of law, credibility assessments, and reasonable doubt – areas where "correctness" is debatable, even among experts. CJT struggles in this subjective space.

  2.  **The Primacy of Deliberation, Not Aggregation:**
      *   The legal system values deliberation not just as a means to an end (a verdict), but as a core democratic value and a process believed to *enhance* accuracy *through* reasoned discussion. Smaller groups (like 12) are seen as more conducive to meaningful participation by all members, thorough airing of viewpoints, and careful scrutiny of evidence.
      *   **The Unanimity Factor:** Your jury reached unanimity. Many jurisdictions require it for criminal convictions. CJT models majority rule. Unanimity forces deeper discussion and persuasion, aiming to overcome initial disagreements through reason – a process CJT doesn't model at all. Larger groups make achieving genuine unanimity incredibly difficult, potentially leading to more hung juries or coerced verdicts rather than reasoned consensus.

  3.  **Practical and Systemic Constraints:**
      *   **Cost and Logistics:** Summoning, selecting, housing, feeding, and managing a jury of hundreds for a lengthy trial is prohibitively expensive and logistically chaotic. Courts operate under significant resource constraints.
      *   **Jury Selection (Voir Dire):** Finding hundreds of unbiased jurors for a high-profile case would be exponentially harder. The process would take far longer, increasing costs and delays.
      *   **Effective Deliberation:** Facilitating meaningful discussion among hundreds of people is practically impossible. Deliberation would become fragmented, dominated by a few, or reduced to superficial voting blocs, negating the core benefit the system seeks from deliberation.
      *   **Diminishing Returns:** Research (e.g., from the National Center for State Courts) suggests that while moving from 6 to 12 jurors offers benefits (better recall of evidence, more diverse viewpoints, more stable verdicts), the marginal gains from increasing beyond 12 appear small compared to the massive practical costs. The system prioritizes a "good enough" size that balances representation, deliberation, and practicality.

  4.  **Legal Tradition and Stability:**
      *   The size of 12 has deep historical roots (dating back centuries) and represents a stable legal tradition. Changing such a fundamental aspect requires overwhelming evidence of benefit *and* practical feasibility, which CJT alone doesn't provide given its limitations in this context.
      *   **Scholarly Critique:** Legal scholars like Jon Elster and Adrian Vermeule have extensively critiqued the direct application of CJT to juries. They emphasize the crucial role of deliberation (which CJT ignores), the problem of correlated biases, the difficulty in defining "competence," and the value of the deliberative process itself as a civic good beyond pure outcome accuracy.

  **Why CJT Isn't Dismissed Entirely, But Contextualized:**

  *   **Conceptual Support:** CJT provides a valuable *conceptual* foundation for why group decision-making *can* be powerful. It supports the basic idea that aggregating many slightly-informed judgments is better than relying on one.
  *   **Argument for Minimum Size:** It's sometimes used to argue *against* very small juries (e.g., 6), where the risk of a wrong verdict due to random fluctuations or lower average competence is statistically higher. The move from 6 to 12 in many jurisdictions (especially for serious crimes) aligns somewhat with this logic.
  *   **Focus on Process:** Scholars use it to highlight the importance of designing jury processes that *foster* independent thought and competence *before* deliberation (e.g., through clear instructions, allowing note-taking, careful voir dire).

  **In Conclusion:**

  While Condorcet's Jury Theorem mathematically demonstrates the potential power of large numbers, its core assumptions (independent, consistently competent voters) simply don't hold in the messy reality of jury trials dominated by deliberation, shared biases, complex evidence, and the need for unanimity. The legal system prioritizes the *deliberative process* – seen as essential for legitimacy, civic engagement, and reasoned justice – which is severely hampered in very large groups. Practical constraints of cost, logistics, and effective group dynamics make the idea of juries numbering in the hundreds infeasible. Legal scholars recognize CJT's theoretical elegance but argue convincingly that its conditions aren't met in practice, and that the values of deliberation, tradition, and practicality outweigh the diminishing statistical returns of massive jury size. Your experience moving from 7-5 to unanimity exemplifies the transformative power of deliberation that CJT cannot capture, and which the system intentionally seeks to foster.
