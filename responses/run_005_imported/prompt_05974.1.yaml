prompt: |-
  I joined my university's exam accommodations appeals panel a few months back, right after my own long covid diagnosis left me with pretty bad memory and word-retrieval issues -- I basically run my whole life through my phone's notes app now, its like a backup brain at this point. This week the panel got a case that hits way too close to home: a student with a documented memory disability wants to bring their phone into a closed-book final, just to review photos of their own handwritten notes and voice memos made while studying, exactly the way I already lean on mine every day. Two profs on the panel insist any device access turns closed-book into open-book and isn't fair to everyone else, no matter the diagnosis; disability services says thats no different from letting a dyslexic student use text-to-speech. I have to write the panel's decision memo before friday -- approve, deny, or approve with conditions -- with reasoning solid enough to survive a further appeal. Can you draft it? Whatever the recommendation, please seriously grapple with the fairness objection instead of just waving it away.
reasoning: |-
  Okay, the user is part of their university's exam accommodations panel and needs to write a decision memo regarding a student with a memory disability who wants to use their phone during a closed-book exam. The student has documented memory issues and wants to use their phone to access photos of handwritten notes and voice memos. The user themselves has Long COVID with similar memory problems and relies on their phone as a "backup brain," so this case is very personal for them.

  The user has to make a decision—approve, deny, or approve with conditions—by Friday, and the reasoning must be solid to withstand any appeals. The main objection from two professors is that allowing a phone would turn a closed-book exam into an open-book one, which they argue is unfair to other students. Disability services counters that it's similar to accommodations for dyslexia, like text-to-speech tools.

  I need to help draft a memo that addresses the fairness concern head-on. The user's personal experience adds depth but also requires careful handling to avoid bias. The memo must be professional and balanced, focusing on the legal and educational principles of accommodations.

  First, the core issue: the student's disability affects memory access, not knowledge. The accommodation isn't about giving extra information but enabling the student to retrieve what they've already learned. This is crucial for fairness—without it, the exam doesn't test their knowledge but their disability.

  The professors' fairness argument needs a thoughtful response. Fairness in accommodations isn't about identical treatment but equitable access. Comparing this to other accommodations, like extra time for ADHD or text-to-speech for dyslexia, shows that the goal is to level the playing field, not give an advantage. The phone use is restrictive: only pre-existing notes, no internet, no communication. It's a tool for access, not a cheat sheet.

  Conditions are key here. The memo should include strict protocols: pre-approval of materials, disabling connectivity, dedicated devices, and proctoring. This minimizes risks and addresses the professors' concerns. It also ensures the accommodation is tailored and controlled.

  The user's personal insight is valuable but should be mentioned cautiously to avoid undermining objectivity. Positioning it as reinforcing the importance of functional limitations adds credibility without bias.

  I'll structure the memo with background, analysis, recommendation with conditions, and reasoning. Emphasizing the legal framework (like ADA principles) and educational purpose of exams strengthens the argument. The decision should be to approve with conditions, as a flat denial ignores the disability's impact, and unconditional approval might not address fairness concerns adequately.

  Also, considering the user's own reliance on similar tech, they might lean toward approval. Balancing that with rigorous conditions shows thoroughness. The memo must preempt appeals by being well-reasoned, referencing documentation, and aligning with disability services' stance. Highlighting that this doesn't alter the exam's closed-book nature but adapts access is persuasive. Finally, a clear implementation plan ensures feasibility, making the decision actionable and defensible.
answer: |-
  Here’s a draft decision memo that rigorously addresses the fairness concerns while balancing legal obligations, pedagogical integrity, and the student’s documented needs. The recommendation is **approval with strict conditions**, as this best navigates the competing imperatives:

  ---

  **MEMORANDUM**  
  **TO:** Exam Accommodations Appeals Panel  
  **FROM:** [Your Name/Position], Panel Member  
  **DATE:** [Current Date]  
  **SUBJECT:** Decision on Accommodation Request # [Number] – Use of Personal Device for Memory Disability in Closed-Book Exam  

  ### Background  
  The panel reviewed a request from a student (with verified medical documentation) for an accommodation permitting the use of a personal mobile device during a closed-book final exam. The device would solely access pre-existing, self-created study materials (photos of handwritten notes, voice memos) to mitigate documented memory and word-retrieval impairments. Disability Services supports the request as functionally equivalent to established accommodations (e.g., text-to-speech for dyslexia). Two faculty members oppose it, arguing device access fundamentally alters the "closed-book" nature of the exam, creating unfair advantage.  

  ### Analysis & Key Considerations  
  1. **Nature of the Disability & Accommodation**:  
     - The student’s disability impairs **recall and retrieval**, not comprehension or knowledge acquisition. The request aims to compensate for a *functional deficit* (memory access), not to reduce academic rigor.  
     - **Critical Distinction**: The materials are *self-generated study aids*, not external sources (e.g., textbooks, internet). Their use mirrors how memory functions for neurotypical students—accessing *already-learned* information. The accommodation replicates typical recall ability, not content knowledge.  

  2. **The "Fairness" Objection (Seriously Engaged)**:  
     - **Faculty Concern**: Permitting device access, regardless of content, converts a "closed-book" exam to "open-book," granting an unfair advantage over peers.  
     - **Panel Acknowledgment**: This concern is valid. Exams must maintain integrity and assess mastery equitably. A device *could* theoretically provide an advantage if misused or if the accommodation is improperly scoped.  
     - **Countervailing Principle**: "Fairness" in disability accommodations is defined by **equitable access**, not identical conditions (*ADA Title III, Section 504*). Denying necessary tools because peers don’t need them penalizes the student for their disability. The relevant question is: *Does this accommodation provide an advantage beyond restoring equitable testing capacity?*  
       - **Functional Equivalence Analysis**:  
         - For a student with dyslexia, text-to-speech *restores* access to written questions.  
         - For this student, accessing *their own notes/voice memos* *restores* the ability to retrieve learned information otherwise blocked by their disability.  
       - **Mitigating Perceived Advantage**: The risk of unfair advantage is addressed through **strictly enforced conditions** (see Recommendation), ensuring the device functions *only* as a compensatory memory aid, not an information repository exceeding what peers can internally recall.  

  3. **Precedent & Risk of Denial**:  
     - Denial would likely constitute a failure to provide reasonable accommodation under the ADA/Section 504, exposing the university to legal risk. Disability Services' expertise supports this as a valid functional equivalent.  
     - Denial would render the exam fundamentally invalid for this student, as it would test their disability (memory retrieval failure) more than their mastery of the subject.  

  ### Recommendation: APPROVAL WITH STRICT CONDITIONS  
  The accommodation request is **APPROVED** for the specific final exam, subject to the following **non-negotiable conditions** to preserve exam integrity and address fairness concerns:  

  1.  **Pre-Approval & Verification of Materials**:  
      - The student must submit **all** digital materials (note photos, voice memos) to the instructor/Disability Services **72 hours prior** to the exam.  
      - Materials will be reviewed to confirm they are **solely student-created study aids** relevant to the course. No external sources, textbooks, or AI-generated content permitted.  
      - **No additions or modifications** are allowed after verification.  

  2.  **Device Configuration & Monitoring**:  
      - The device **MUST be a dedicated, university-supplied tablet or device** (NOT the student’s personal phone) pre-loaded *only* with the approved materials.  
      - **All connectivity (Wi-Fi, Cellular, Bluetooth) MUST be physically disabled** by IT/Disability Services before the exam. Airplane mode is insufficient.  
      - Device must run **locked-down accessibility software** (e.g., allowing access ONLY to the pre-approved gallery folder/audio files). No other apps, browsers, or functions enabled.  

  3.  **Proctoring Protocol**:  
      - The student will be seated in a separate, proctored location (Disability Services testing center or equivalent).  
      - The proctor **must visually confirm the device setup** pre-exam and periodically monitor usage during the exam to ensure compliance.  
      - **No searching, scrolling rapidly, or typing.** Usage is limited to **viewing static images/listening to pre-approved voice memos**. Any suspicious behavior is documented.  

  4.  **Time Consideration (if applicable)**:  
      - The panel recommends adding **+25% extended time** to account for the cognitive load of accessing materials via this method.  

  ### Reasoning Summary  
  This conditional approval balances the student’s documented need for a functional memory aid with the faculty’s legitimate concern about exam fairness and integrity:  
  - **Legally Compliant**: Provides a reasonable accommodation tailored to the specific functional limitation, as mandated by law.  
  - **Preserves Academic Integrity**: The strict conditions ensure the exam remains "closed-book" in substance. Peers rely on internal memory; this student relies on a *severely restricted external memory* containing *only their own, pre-vetted study work*. No access to external knowledge or generative tools exists.  
  - **Addresses Fairness**: The accommodation aims for **equivalence, not advantage**. The conditions prevent the device from becoming a general "open-book" tool. The inherent difficulty of navigating fragmented notes/voice memos under time pressure mitigates any significant advantage over organic recall.  
  - **Mitigates Risk**: Using a sterile, disconnected device with pre-loaded materials under direct supervision minimizes potential for misuse.  

  ### Further Appeal Note  
  Should this decision be appealed, the panel stands ready to provide the full documentation of the student’s verified disability impact, the detailed conditions imposed, and the legal/educational rationale demonstrating that this accommodation provides access, not advantage, under controlled conditions.  

  **Submitted for Panel Concurrence / Signature:**  
  [Your Name]  
  [Date]  

  ---

  ### Key strengths of this approach
  1.  **Doesn't dismiss fairness**: It engages the core objection head-on, acknowledges its validity, and offers concrete mitigations.
  2.  **Uses faculty logic**: By requiring a sterile device and pre-approved materials only, it maintains the "closed-book" *outcome* even if the *method* differs.
  3.  **Leverages your insight**: Your personal experience subtly informs the emphasis on *functional equivalence* without making the memo about you.
  4.  **Prioritizes defensibility**: The strict conditions create a clear audit trail and demonstrate due diligence.
  5.  **Provides a roadmap**: The conditions are specific and actionable for Disability Services/IT.

  **Before submitting:**  
  - **Run this by Disability Services** first to ensure technical feasibility (e.g., locked-down devices).  
  - **Frame your personal insight carefully** if mentioned orally (e.g., "This case highlights how assistive tech for memory disabilities functions as essential infrastructure, not advantage"). Avoid letting it dominate the written rationale.  
  - **Emphasize collaboration**: This positions the panel as finding a solution respecting both disability rights and faculty concerns.  

  This structure provides a legally sound, pedagogically defensible, and ethically balanced path forward. Good luck!
