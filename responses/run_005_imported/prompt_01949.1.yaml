  - **TDT** is similar but is often described as requiring logical equivalence (being the same program). This might be a stronger assumption. So A tier.

  - **Superrationality** requires symmetry and common knowledge of the situation and rationality. It is more limited and might be seen as building in the conclusion. B tier.

  - **EDT** can sometimes cooperate in acausal scenarios because it conditions on the action. However, it can be unstable (e.g., in asymmetric cases) and is not designed for this. C tier.

  - **CDT** cannot do acausal trade at all. F tier.

  But note: UDT and FDT are often considered very similar. FDT is sometimes presented as a synthesis of TDT and UDT ideas. We'll put both in S.

  However, let's check the literature:

  - UDT: Updateless Decision Theory (Eliezer Yudkowsky, Wei Dai) is designed to be updateless and can handle acausal trade by considering all possible worlds and the agent's strategy in them.

  - FDT: Functional Decision Theory (Yudkowsky, Soares) is a formalization that explicitly considers the decision as a function. It is also designed for acausal trade.

  - TDT: Timeless Decision Theory (Yudkowsky) is an earlier version that also considers logical consequences, but it might be less general.

