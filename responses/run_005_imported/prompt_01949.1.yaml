  We are evaluating six decision theories on their ability to support genuine acausal trade without begging the question. The key is whether the theory can produce cooperation as a result of the decision rule under weak assumptions (like knowing the other agent's source code and rationality, but not requiring perfect identity or pre-synchronization).

  - **Causal Decision Theory (CDT)**: Only considers causal consequences. Since there is no causal link, CDT cannot justify cooperation. It would defect.

  - **Evidential Decision Theory (EDT)**: Considers evidence. In acausal trade, cooperating might be evidence that the other also cooperates, but without a causal link, it might not update correctly. However, in simple symmetric cases it might cooperate, but it's fragile and doesn't generalize well.

  - **Hofstadter-style superrationality**: This is based on the idea that in symmetric games, rational players should choose the same move and hence cooperate. But it relies heavily on symmetry and common knowledge of similarity. It might be seen as question-begging because it assumes the agents are in the same situation and reason identically.

  - **Timeless Decision Theory (TDT)**: TDT decides by considering what an identical agent would do in the same situation. It can handle acausal trade if the agents are sufficiently similar and know each other's source code. However, it requires the agents to be "logical twins", which might be seen as a strong assumption.

  - **Updateless Decision Theory (UDT)**: UDT chooses a strategy (a function from observations to actions) without updating on the fact that it is in a particular situation. It can reason about other agents with the same source code. This allows for acausal trade without requiring the agents to be in identical situations, but it still requires common knowledge of source code and rationality.

  - **Functional Decision Theory (FDT)**: FDT is a generalization that views decision-making as outputting a function. It is designed to handle acausal trade by considering what the agent's decision function implies for other agents with the same function. Like UDT, it requires common knowledge of the decision function.

  Tier List Criteria:
  - S: Delivers cooperation under weak assumptions (e.g., knowledge of the other's source code and rationality, but without requiring perfect identity or pre-synchronization).
  - A: Delivers cooperation but requires somewhat stronger assumptions (like logical equivalence or same source code).
  - B: Can sometimes deliver cooperation, but is fragile or only works in very specific setups.
  - C: Might occasionally cooperate but not reliably or without justification.
  - D: Tends to defect, but might accidentally cooperate in some setups.
  - F: Always defects because it cannot consider acausal influences.

  Ranking:

