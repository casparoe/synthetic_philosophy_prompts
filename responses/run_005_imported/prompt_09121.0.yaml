answer: |-
  Here’s a dialogue between **E** (Epistemicist) and **S** (Supervaluationist), standing before a line of 1,000 people ordered by height (shortest to tallest), debating where "tall" begins. Each directly confronts the other’s core weakness:

  ---

  **E**: (Gesturing at the line) Look at this gradient. One thing’s certain: *somewhere* along this line, a person stops being not-tall and starts being tall. Our ignorance doesn’t change that. Meaning *demands* a sharp cutoff—otherwise, we couldn’t even agree that Person 1000 is tall and Person 1 isn’t. Vagueness is just ignorance of the boundary.  

  **S**: Meaning doesn’t demand that at all! Our practice with "tall" *underdetermines* a single cutoff. Person 723 might be tall under one reasonable precisification (say, 6'0"), but not under another (6'0.1"). That’s why she’s borderline—not because we’re ignorant of a fact, but because *no unique fact exists*. Your "sharp cutoff" is a myth.  

  **E**: Then tell me this: **what fixes the meaning of "tall" if not our usage?** You say our use is compatible with many precisifications—but that just pushes the problem back. If meaning isn’t pinned down by the totality of how we speak, act, and react, then *what* determines that 6'0" is an *admissible* precisification while 5'0" isn’t? It’s *still* our practice that draws the line—fuzzily, yes, but with enough structure to exclude absurdities. And if practice can draw boundaries that exclude 5'0", why can’t it draw one precise enough to separate 5'11.999" from 6'0"?  

  **S**: Practice *does* constrain precisifications—but only to a range. We agree "tall" can’t start at 4 feet, but between 5'10" and 6'2", multiple cutoffs are equally compatible with all linguistic evidence. **Your mistake is conflating *constraint* with *determination***. A sculptor’s chisel marks constrain where a statue’s boundary lies, but they don’t pick out *one exact atom* as the edge. Meaning is like that: it rules out extremes but leaves a zone of indeterminacy.  

  **E**: Indeterminacy? Then answer *this*: **Is "borderline tall" itself a vague predicate?** Take Person 550—clearly not borderline. Person 720? Clearly borderline. But Person 650? Is *she* "definitely borderline" or "borderline borderline"? If you say "borderline" has no sharp boundaries either, then your whole theory collapses into infinite regress—"higher-order vagueness." You’ve just moved the bump in the rug.  

  **S**: (Nodding) Higher-order vagueness is real—but it doesn’t collapse my view. **Supervaluationism *accepts* that indeterminacy has degrees.** First-order borderline cases are those where *no* admissible precisification agrees on truth value. Second-order borderline cases arise when precisifications *disagree* on whether a case is first-order borderline. But this isn’t regress—it’s a structured hierarchy of vagueness, mirroring how language actually works. We stop when further distinctions make no practical difference. Your theory, by contrast, insists on a mythical sharp line *even between "definitely tall" and "definitely borderline"*—which is even less plausible!  

  **E**: You dismiss my cutoff as "mythical," but **your "admissible precisifications" are just as mysterious!** What *makes* a precisification "admissible"? If it’s collective usage, then usage *must* fix facts about admissibility—and if it fixes those, why not the cutoff itself? You’re positing invisible fences (admissibility) to avoid admitting there’s an invisible line (the cutoff). But both are grounded in the same social facts!  

  **S**: The difference is empirical. **Admissibility is fixed by *dispositions***: how we’d apply "tall" in hypothetical scenarios, what we’d correct or accept. These dispositions *converge* on a range (e.g., 5'10"–6'2") but *diverge* within it. Your "fact" about a single cutoff isn’t reflected *anywhere* in the evidence—not in our behavior, intuitions, or responses. It’s a ghost in the machine.  

  **E**: And your "indeterminacy" is a ghost too! If no fact makes Person 723 not-tall rather than tall, then **why does it feel wrong to call her *both*?** Why can’t I say, "She’s tall *and* not-tall"? Because deep down, we know there’s a truth we’re missing. Your "neither true nor false" is a cop-out.  

  **S**: It feels wrong because *no admissible precisification permits contradictions*. For Person 723, some precisifications say "tall," others "not-tall," but *none* say both. That’s why we reject contradictions—not because of hidden facts, but because admissibility preserves consistency. **Your "feeling" of a hidden truth is just the pull of classical logic—not evidence of a cutoff.**  

  *(They pause, staring at the line. Person 700 shifts uncomfortably under their gaze.)*  

  **E**: So we agree practice constrains meaning but doesn’t specify everything. You call the gap "indeterminacy"; I call it "ignorance." But tell me: **when we *decide* a borderline case (e.g., for a basketball team), do we *discover* a pre-existing fact, or *create* one?**  

  **S**: We *extend* the meaning—like filling in a blank in the rules. But it wasn’t "already there."  

  **E**: Then we’re both realists about the poles (Person 1 is short, Person 1000 tall), but you’re an anti-realist about the boundary. I’m a realist about *all* of it—even if we can’t access it.  

  **S**: And I say your realism about the boundary is *empty*—it explains nothing and contradicts everything we see.  

  **E**: And your anti-realism makes meaning hostage to our limitations.  

  *(They sigh, no closer to consensus. The line shuffles forward.)*  

  ---

  ### Key Pressure Points Clarified:
  1. **Epistemicist’s burden**: Explain how social practice fixes *exact* boundaries.  
     - **E’s answer**: Practice fixes boundaries *implicitly* (like laws of physics fixing exact positions), even if we can’t compute them. Rejecting this makes meaning arbitrary.  

  2. **Supervaluationist’s burden**: Escape higher-order vagueness.  
     - **S’s answer**: Vagueness is *iterative* but not vicious. "Borderline" is vague, but supervaluationism models this via *chains* of precisifications (1st-order, 2nd-order, etc.), stopping where distinctions become pragmatically irrelevant.  

  **Core Disagreement**:  
  - **E** thinks meaning *must* be precise to avoid collapse into chaos.  
  - **S** thinks precision is *incompatible* with how language works.  

  Both views struggle with the gap between abstract theory and the messiness of practice—but each accuses the other of ignoring the evidence.
