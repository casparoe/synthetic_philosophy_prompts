reasoning: |-
  Okay, the user is preparing for a comprehensive exam on democratic theory, specifically the boundary problem. They mention several key readings: Whelan's bootstrapping issue, Goodin on all-affected interests, the Abizadeh vs. Miller debate on coercion vs. nationality, and López-Guerra's enfranchisement lottery. Their brain is "melted," so they're seeking clarity. 

  The user wants a gut-check ranking of six principles for defining the demos, ordered from most to least defensible. They explicitly want my judgment, not just what's most cited in the literature. For each principle, I need to provide a single-sentence reason and state whether it escapes or relocates Whelan's bootstrapping problem (the circularity issue where fixing boundaries can't be decided by a vote without presupposing the demos).

  The principles to rank are:
  1. All-affected interests
  2. All-subjected/coercion principle
  3. Bauböck's stakeholder principle (durable ties)
  4. Nationality/self-determination
  5. Birthright citizenship (as practiced)
  6. López-Guerra's enfranchisement lottery

  I need to structure the response as a JSON object with ranks 1 to 6, each containing the principle and reason.

  First, I'll recall what each principle entails:
  - **All-affected interests (Goodin)**: Anyone affected by a decision should have a say. Broad but vague—how do we measure "affected"? Bootstrapping problem: Who decides who's affected? Relocates the issue.
  - **All-subjected/coercion (Abizadeh)**: Focuses on those subject to coercion by the state. More precise than affected interests, but still debatable on who counts as subjected. Bootstrapping: Relocates—who defines the scope of coercion?
  - **Stakeholder principle (Bauböck)**: Based on durable ties to the community (residency, work, family). Practical and normatively strong for inclusion. Bootstrapping: Partially escapes by using objective criteria, but defining "durable ties" still has subjectivity.
  - **Nationality/self-determination (Miller)**: Demos defined by shared national identity. Coherent for self-determination but exclusionary. Bootstrapping: Escapes by being pre-political, but nationality is often constructed, so it might relocate the problem to defining the nation.
  - **Birthright citizenship**: Current practice (jus soli/jus sanguinis). Path-dependent and arbitrary, leading to inclusion/exclusion issues. Bootstrapping: Escapes practically (it's a settled rule), but normatively weak—justifies via tradition, not principle.
  - **López-Guerra's lottery**: Random selection of voters. Radical, aims to avoid bias, but undermines democratic representation and stability. Bootstrapping: Escapes by removing voting on boundaries, but replaces it with randomness, which is normatively questionable.

  Now, ranking them by defensibility in my judgment:
  1. **Stakeholder principle**: Most balanced—uses tangible ties, promotes inclusion without overreach, partially escapes bootstrapping.
  2. **All-subjected/coercion**: Normatively strong for legitimacy, clearer than affected interests, though relocates bootstrapping.
  3. **Nationality/self-determination**: Defensible for cohesive decisions, but exclusionary; escapes bootstrapping but risks circularity in defining nation.
  4. **All-affected interests**: Intuitive but too vague; relocates bootstrapping severely.
  5. **Birthright citizenship**: Functional but arbitrary; escapes bootstrapping only by accepting historical contingency.
  6. **Enfranchisement lottery**: Least defensible—unstable and severs representation; escapes bootstrapping but at high cost.

  For bootstrapping:
  - Escape: Stakeholder (partial), nationality, birthright, lottery.
  - Relocate: Affected, subjected.

  User's deeper needs: They're overwhelmed by theory and want a simplified, opinionated take to anchor their studying. They might also seek reassurance on handling bootstrapping in exams—emphasizing that most principles relocate or imperfectly escape it could be key. Their "gut-check" request suggests they value practical wisdom over pure academia, so I'll keep reasons crisp and grounded.
answer: |-
  Here's a gut-check ranking based on normative defensibility and practical coherence, weighing how each handles Whelan's bootstrapping problem (i.e., whether the principle *escapes* circularity by relying on non-democratic criteria or merely *relocates* it by requiring prior boundary decisions):

  ```json
  {
    "rank_1_most_defensible": {
      "principle": "Bauböck-style stakeholder principle (durable ties to the community)",
      "reason": "Balances moral inclusion (via tangible ties like residence/work) with practical stability, partially escaping bootstrapping by using objective criteria to define 'stakeholding' without requiring democratic authorization."
    },
    "rank_2": {
      "principle": "All-subjected/coercion principle",
      "reason": "Directly addresses democratic legitimacy by enfranchising those bound by coercive laws, escaping bootstrapping only if 'coercion' is defined non-democratically (e.g., territorially), but often relocates it to debates over what counts as coercion."
    },
    "rank_3": {
      "principle": "Nationality/self-determination principle",
      "reason": "Provides cultural cohesion and clear boundaries, escaping bootstrapping by grounding membership in pre-political identity, but normatively weak due to exclusion of residents and circularity in defining the 'nation'."
    },
    "rank_4": {
      "principle": "All-affected-interests principle",
      "reason": "Intuitively democratic but fatally over-inclusive/under-defined, relocating bootstrapping massively since 'affectedness' requires prior democratic interpretation of scope."
    },
    "rank_5": {
      "principle": "Birthright citizenship as actually practiced",
      "reason": "Escapes bootstrapping via automatic, non-democratic rules (jus soli/sanguinis) but ranks low for defensibility due to arbitrary exclusion/inclusion and perpetuating historical injustices."
    },
    "rank_6_least_defensible": {
      "principle": "López-Guerra's enfranchisement lottery",
      "reason": "Radically severs representation from voice to avoid boundary fights, technically escaping bootstrapping via randomness, but least defensible for undermining democratic accountability and stability."
    }
  }
  ```

  **Key on Bootstrapping**: Only stakeholder, nationality, birthright, and lottery *escape* bootstrapping by rejecting democratic authorization for initial boundaries (using objective ties, identity, legal rules, or randomness). All-affected and all-subjected typically *relocate* it, demanding democratic input to define their core terms ("affectedness," "coercion"), which presupposes a prior demos.
