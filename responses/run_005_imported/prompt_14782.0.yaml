prompt: |-
  So this is going to sound a bit like a confession, but here goes: about eight months ago I took the Giving What We Can pledge (10% of income to effective charities) after a coworker cornered me with the classic Singer drowning-child argument, and ever since then I've had this nagging feeling that if the underlying utilitarian logic is actually right, 10% isn't nearly enough - why not 50%, why not "give until the next dollar matters as much to me as it does to the person its going to"? I mentioned this spiral to a friend doing a philosophy MA and she pointed me toward the literature on the "demandingness objection" and the various moves people have made to defuse it without just chucking consequentialism out entirely.

  Two of the responses she flagged keep rattling around in my head and I honestly can't tell if they're doing the same job in different clothes or are fundamentally different strategies: Scheffler's agent-centered prerogative (from The Rejection of Consequentialism) versus the satisficing consequentialism that Slote defends. Could you walk through how these two actually differ as ways of blocking the demandingness objection, and then tell me which one, if either, strikes you as the more principled solution rather than just an ad-hoc patch bolted onto the theory to stop it demanding I sell my house? I already get the basic objection itself so you don't need to build up from Singer or the shallow pond - I'm stuck specifically on comparing these two fixes, and please justify whichever verdict you land on rather than just asserting it.
