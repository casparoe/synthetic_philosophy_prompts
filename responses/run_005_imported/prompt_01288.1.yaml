answer: |-
  You've hit on a classic Hobbesian debate that cuts straight to the heart of his project! Alex's argument is passionate and captures *Hobbes's own ambition*, but it significantly overstates both his mathematical success and the "geometric" certainty of *Leviathan*. Let's break it down:

  1.  **Hobbes as a "Great Mathematical Mind" Who Squared the Circle:**
      *   **The Claim:** In Part IV of *De Corpore* (1655), Hobbes presented a method he believed squared the circle (constructing a square with the same area as a given circle using only compass and straightedge).
      *   **The Reality:** Hobbes was **profoundly wrong**. Squaring the circle with compass and straightedge is mathematically **impossible** (proven definitively by Ferdinand von Lindemann in 1882). His method contained fundamental errors, confusing the properties of physical objects with abstract geometric concepts. He essentially tried to "roll" circles into lines or relied on vague notions of infinitesimals without rigorous calculus (which was being developed contemporaneously but by others).
      *   **The Wallis "Beef":** John Wallis (Savilian Professor of Geometry at Oxford) wasn't just a "jealous Oxford guy." He was a brilliant mathematician, a founder of the Royal Society, and a pioneer in calculus and infinity. Wallis meticulously dismantled Hobbes's mathematical claims, particularly the circle squaring, in multiple publications (starting with *Elenchus Geometriae Hobbianae*, 1655). Wallis wasn't jealous; he was upholding mathematical rigor against what he saw as amateurish and dangerous errors. Hobbes responded with increasing vitriol and stubbornness, damaging his own scientific reputation.
      *   **Hobbes's Mathematical Standing:** While Hobbes had genuine mathematical interests and made some minor contributions (e.g., early thoughts on conic sections), he was **not** considered one of the great mathematical minds of his day by his peers (like Wallis, Descartes, Fermat, Pascal, Newton - who was emerging). His reputation was primarily as a political philosopher and controversialist. His mathematical work is largely remembered *because* of its errors and his bitter feud with Wallis, not for its originality or correctness. He belonged in the *conversation*, but not at the top tier.

  2.  **The "Geometrical Method" and *Leviathan*:**
      *   **Hobbes's Ambition:** Alex is absolutely right about Hobbes's *intention*. Hobbes was deeply impressed by Euclid and the deductive certainty of geometry. He explicitly aimed to replicate this method in philosophy, including civil philosophy (politics). He wanted to start with clear, undeniable definitions (like "human," "motion," "desire," "fear," "state of nature," "sovereignty") and reason deductively to necessary conclusions about the best form of government.
      *   **The Reality in *Leviathan*:**
          *   **Definitions are Not Axioms:** The fundamental problem is that Hobbes's starting definitions are **not** self-evident geometric truths like Euclid's points and lines. They are **contested empirical and philosophical claims** about human nature, psychology, and society.
              *   Is human life *necessarily* "solitary, poor, nasty, brutish, and short" without government? (Many anthropologists and historians would disagree).
              *   Are humans *purely* self-interested, rational calculators driven only by the desire for power and fear of death? (Psychology, sociology, and everyday experience suggest much greater complexity: altruism, irrationality, social bonds, differing values).
              *   Is the *only* logical solution to this state of nature the absolute surrender of all rights to an undivided, irrevocable sovereign? (Locke, Rousseau, and countless others offered compelling alternatives).
          *   **Deduction or Rhetorical Persuasion?** While *Leviathan* uses logical connectives ("therefore," "it follows that"), the core "deductions" rely heavily on Hobbes's specific, often bleak, view of human nature and his chain of reasoning about what *must* follow from it. This chain is **persuasive rhetoric built on disputed premises**, not an iron-clad deduction from universally accepted axioms. The "geometric" structure is more an *organizing principle* and an *rhetorical device* to convey an air of inevitability than a genuine Euclidean proof.
          *   **Contemporary Reception:** Even in his own time, philosophers like Descartes admired Hobbes's boldness but questioned his starting points and method. Many saw the geometric pretensions as a veneer over a powerful but contestable political argument.

  3.  **Does this make centuries of criticism "missing the point"?**
      *   **Absolutely not.** In fact, the critiques are **exactly on point** because they challenge the very foundations Hobbes claimed were as solid as geometry:
          *   **Challenging the Premises:** Critics attack the accuracy of his state of nature, his psychological egoism, and the necessity of absolute sovereignty. If the premises are shaky, the conclusion isn't proven, regardless of the logical structure.
          *   **Challenging the Method:** Critics argue that human affairs involve irreducible complexity, contingency, history, values, and interpretations that cannot be reduced to a simple geometric deduction. Ethics and politics deal with "oughts," not just "is," making geometric certainty impossible.
          *   **Internal Coherence:** Critics also examine whether Hobbes's system is even internally consistent (e.g., can an absolute sovereign *really* guarantee the peace if they are also human and potentially irrational? How do subjects *know* the sovereign is effectively protecting them? What about the right to self-preservation against the sovereign?).
          *   **Empirical Evidence:** Centuries of political history provide evidence both for and against Hobbes's core predictions about human nature and the effects of different forms of government.

  **The Tiebreaker Verdict:**

  *   **On Mathematics:** Alex is incorrect. Hobbes **did not** square the circle; his attempt was flawed and rejected by competent mathematicians like Wallis, for good reason. He was an intelligent amateur with significant mathematical interest but **not** a "great mathematical mind" of the era compared to his leading contemporaries. Wallis's critique was mathematically valid and relevant.
  *   **On the Geometrical Method in *Leviathan*:** Alex captures Hobbes's *intent* perfectly, but overstates the *achievement*. While Hobbes structured *Leviathan* with geometric *aspirations* and used deductive *language*, the core arguments **do not possess the certainty of a geometric proof**. The starting definitions are philosophical claims, not indubitable axioms, and the reasoning relies on a specific, contestable view of human nature. *Leviathan* is a work of profound, brilliant, and highly influential **political rhetoric and philosophy**, not a geometric treatise.
  *   **On the Critics:** The centuries of criticism are **essential and valid**. They don't miss the point; they engage directly with the core claims and method Hobbes employed. The fact that his conclusions remain fiercely debated *proves* they lack geometric certainty. Hobbes provided an incredibly powerful *framework* and set of *arguments*, not a proven theorem of politics.

  **What to tell Alex:** "Look, you're totally right that Hobbes *thought* he was doing for politics what Euclid did for geometry, and that confidence stemmed from his belief in his own mathematical method. But the brutal truth is his circle-squaring was mathematically wrong, shredded by Wallis for good reason, and his rep as a mathematician was more self-promotion than reality. More importantly, while the *structure* of *Leviathan* is geometric, the *foundations* – his definitions of human nature and the state of war – aren't axioms everyone accepts. They're his philosophical starting points. That's why the arguments in *Leviathan*, however logically constructed from *those premises*, haven't settled the debate like the Pythagorean theorem. The critiques aren't missing the geometric point; they're challenging whether those geometric foundations actually hold when applied to messy human politics. Hobbes gave us an incredibly powerful *model*, not an irrefutable *proof*."
