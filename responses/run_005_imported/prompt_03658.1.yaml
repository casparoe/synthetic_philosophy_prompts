  First, I need to recall Tolstoy's key points from "What Is Art?". His infection theory states that art transmits genuine feelings from the artist to the audience. The effectiveness is measured by infectiousness, not skill or beauty. Then there's the moral aspect: the feelings must promote universal brotherhood. The user points out that Shakespeare and Wagner infect many people, so why does Tolstoy dismiss them? Priya argues that the moral requirement is part of the infection theory, while the user thinks it's a separate addition.

  Looking deeper, I should analyze Tolstoy's reasoning. The infection theory alone doesn't include morality. Infectiousness is about transmission efficiency. But Tolstoy adds that the feelings must be morally good to be considered true art. He links morality to universality, claiming that feelings like Christian love are accessible to all, thus more infectious. But is that true? Romantic passion in Romeo and Juliet has infected diverse audiences, challenging his view.

  The user's frustration makes sense. Tolstoy seems to conflate two criteria: transmission success and moral content. When he calls his own novels bad art, it's because they convey aristocratic feelings, not universal brotherhood. So the moral aspect acts as a gatekeeper. Priya might see the moral requirement as ensuring the feeling's universality, which aids infection. But the user is right that infectiousness and morality are distinct. A highly infectious work with "bad" feelings is still infectious, even if Tolstoy denies it the label of true art.

  Also, the user mentions procrastinating at work, showing they're intellectually curious but maybe feeling guilty. Their deeper need might be to validate their critical thinking against Priya's interpretation. They want clarity on whether Tolstoy is consistent, not just a summary. They might also seek affirmation that their democratic view of art (like blockbusters moving millions) has merit against elitist standards.

  So, in conclusion, Tolstoy combines two criteria. The infection theory is descriptive (how art works), while the moral requirement is prescriptive (what art should convey). Priya's view that it's a natural extension isn't entirely wrong because Tolstoy ties morality to universality, which he thinks enhances infection. However, the user is correct that in practice, many works infect without moral content, exposing a tension in Tolstoy's framework. The user's point stands: Tolstoy's moral criterion is separate and used to judge art beyond mere infectiousness.
answer: |-
  Okay, let's dissect Tolstoy's logic in *What Is Art?* – this is exactly the kind of argument his book provokes, and you've hit on a core tension. Priya is summarizing key parts accurately, but your skepticism about the "bolt-on" is also deeply insightful. Here's the breakdown on Tolstoy's own terms:

  **1. The Core "Infection" Theory (The Engine):**
  *   **Definition:** Art is a human activity where one person, **by external signs** (words, sounds, colors, movement), **consciously transmits feelings** they have experienced to others, **who in turn experience those feelings.**
  *   **The Mechanism:** "Infection." The artist must genuinely feel the emotion *and* successfully transmit it to the audience. The audience must *feel* it, not just understand it intellectually.
  *   **The Measure of "Good" Art (Artistic Merit):** *Infectiousness.* How many people can it infect? How strongly? How quickly? How enduringly? A folk song that makes millions weep is, *by this artistic measure*, better art than a complex symphony appreciated by a few connoisseurs.
  *   **Democracy:** This is radically democratic. It bypasses traditional notions of skill, technique, beauty, complexity, or elite approval. If it transmits genuine feeling effectively to many, it's good art *as art*.

  **2. The "Universal Brotherhood" Requirement (The Filter):**
  *   **The Problem:** Tolstoy observes that highly infectious art exists that transmits feelings he considers *bad* or *harmful* (lust, despair, superstition, aristocratic pride, nationalism, sensuality).
  *   **The Distinction:** He introduces a crucial distinction between "Art" (capital A) and mere "Counterfeit Art." Infectiousness determines if something is *art* (vs. non-art). But it doesn't automatically make it *good* Art with a capital A.
  *   **The Criterion for *Good* Art:** The *quality* of the feeling being transmitted. For Tolstoy, the highest, most important feeling is **the religious consciousness of the age** – which, for him (writing in the late 19th century), was the Christian ideal of **universal brotherhood, love, and compassion.** This feeling must be:
      *   **Sincere:** The artist genuinely feels it.
      *   **Important:** It relates to the fundamental relationship of man to God/universe (i.e., brotherly love).
      *   **Accessible/Universal:** It must be a feeling understandable and accessible to *everyone*, not just an elite class or specific culture. Christian love, he argues, is universally accessible; aristocratic ennui or Wagnerian mythic complexity is not.

  **3. The Internal Logic (and the Tension):**

  *   **Tolstoy's Argument for Connection:** He *tries* to weave these together logically:
      1.  **Universality Enhances Infectiousness:** Feelings of universal love *are*, by their nature, accessible to the widest possible audience ("all men"). Therefore, art transmitting these feelings *should* be the *most* infectious art possible. Folk tales, simple songs about compassion, stories like *A Christmas Carol* exemplify this.
      2.  **"Bad" Feelings Limit Reach & Harm:** Art transmitting exclusive, divisive, or sensual feelings (aristocratic pride, romantic passion divorced from love, nationalism, despair) is inherently limited in its audience (only speaks to a class/culture) and actually *harms* humanity by fostering division or base desires. Therefore, even if infectious *within its limited sphere* (like *Romeo and Juliet* among romantics or Wagner among opera fans), it fails the test of *universal* infectiousness and positive impact.
      3.  **The "Religious Consciousness" as the Highest Standard:** He sees this moral/religious standard not as arbitrary, but as the objective measure of humanity's highest aspiration at that historical moment. Art serving this highest aspiration is the *most important* art.

  *   **The Core Tension (Your Point is Spot On):**
      *   **Descriptive vs. Prescriptive:** The infection theory is largely *descriptive* – it explains *how* art works as communication. The universal brotherhood requirement is intensely *prescriptive* – it dictates *what* art *should* communicate.
      *   **Separation of Criteria:** While Tolstoy argues point #1 (universality enhances infection), **this is not logically necessary from the core infection definition alone.** The infection theory, as initially defined, only cares about *successful transmission of genuine feeling*, regardless of the feeling's *moral quality* or *universal accessibility*. A feeling of aristocratic pride *can* be transmitted very effectively to a large aristocratic audience (and arguably, romantic passion *is* universally accessible, contra Tolstoy). The infectiousness criterion is agnostic to content.
      *   **The Bait-and-Switch?** This is where your argument hits home. Tolstoy uses the powerful, democratic appeal of the infection theory ("see, folk art is great!") to establish his definition. But then, he *uses* the requirement for "universal brotherhood" as a **filter** to *dismiss* art that is demonstrably highly infectious (like Shakespeare, Wagner, Beethoven, his own novels) but doesn't transmit the *specific feeling* he values. He redefines "universal" to mean "aligned with my specific Christian morality," not just "accessible to many."
      *   **The Inconsistency in Practice:** His dismissal of Shakespeare and Wagner as *bad art* (not just unimportant art, but *bad art*) based on their feelings **exposes the tension.** By his *own infection theory*, they are clearly highly infectious across generations and cultures. To call them *bad art*, he *must* rely heavily on the separate, moral criterion overriding the infection success. He essentially says: "Yes, it infects, but it infects with the *wrong* feeling, so it's counterfeit or bad."

  **Who's Right? You vs. Priya**

  *   **Priya is right** that Tolstoy *presents* the universal brotherhood requirement as a *natural consequence* and *enhancement* of the infection theory (universal feeling = widest possible infection). She accurately describes his stated position and the link he tries to forge.
  *   **You are right** that, **logically, it functions as a separate axiom bolted on.** The core infection theory doesn't *require* the moral component; it's perfectly coherent without it. Tolstoy introduces the moral criterion *because* he is horrified by the implications of pure infectiousness (that highly infectious "bad" art exists). He uses the infection theory to democratize the *definition* of art, but then uses the moral criterion to impose his own *hierarchy of value* on it. The "bait" is the radically inclusive definition; the "switch" is the exclusionary moral filter applied afterward.

  **The Verdict:**

  **You win the logical consistency argument.** Tolstoy's infection theory, standing alone, is compelling and democratic. His requirement for "universal brotherhood" (as he defines it) is a separate, deeply moralistic criterion that he *applies* to determine what counts as *good* or *true* Art *after* the infection test has been passed. He conflates them in his argument, but they are logically distinct. His dismissal of his own work, Shakespeare, and Wagner highlights this – it relies entirely on the moral filter overriding the demonstrable success of the infection.

  **Why Priya's view feels compelling:** Because Tolstoy *argues* the connection so strenuously (universal feeling = widest infection) and because the *ideal* of universally accessible, morally uplifting art is appealing. But the logic doesn't hold up under scrutiny when faced with counter-examples of widely infectious art transmitting feelings he dislikes.

  Your argument about the Marvel movie is *exactly* the kind of challenge Tolstoy's pure infection theory invites – and why he felt compelled to add the moral filter. He couldn't accept that a blockbuster transmitting thrilling excitement or sentimental melodrama could be "good art" on par with something transmitting Christian love, even if it infected far more people. His solution was to redefine "good art" to include the moral dimension, creating the tension you and Priya debated.
