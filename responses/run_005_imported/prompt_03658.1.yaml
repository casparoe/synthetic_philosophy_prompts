prompt: |-
  Okay so last night I was arguing with my friend Priya about whether a random Marvel movie "counts" as real art -- I'm not usually a lit nerd but she got me into this -- and she actually backed me up using this Tolstoy thing from What Is Art?, where his whole definition is basically that something counts as art if it "infects" the audience with a feeling the artist actually felt, full stop, no reference to skill or beauty or technique. By that logic a blockbuster that makes millions of random people across the world cry or grip their armrests should count as way more "art" than some obscure poem three professors like. I thought that was a genuinely compelling, kind of democratic way to think about it.

  Then I went down a rabbit hole looking up the actual book (procrastinating at work, don't judge) and it turns out Tolstoy uses that exact same "infection" theory to trash Romeo and Juliet, basically all of Wagner's operas, and even his own novels -- he apparently calls War and Peace and Anna Karenina straight up "bad art," while holding up stuff like Dickens's A Christmas Carol as way higher art in comparison. That seems nuts to me, Shakespeare and Wagner have obviously "infected" enormous numbers of people across generations and cultures, arguably way more effectively than most things he approves of. When I brought this up, Priya said its because Tolstoy also requires the feeling being spread to be one of "universal brotherhood," basically a Christian, accessible-to-everyone kind of feeling, as opposed to some more exclusive aristocratic feeling like romantic passion or national pride. I said that sounds like a totally separate, moralizing criterion that has nothing to do with "does it infect people" and he's just smuggling it in wherever convenient. Priya thinks it's a natural extension of the same idea, not a separate one. We argued about it for like an hour and got nowhere.

  Can you actually walk me through the internal logic here on Tolstoy's own terms? Like, does the "universal brotherhood" requirement genuinely follow from the infection theory itself, or is it a separate axiom he's bolting on to justify his own tastes after the fact? I don't want the SparkNotes "Tolstoy thought art should be moral" version, I want to actually understand whether he's being consistent or pulling a bait-and-switch -- and if you have a view, who do you think is right, me or Priya?
