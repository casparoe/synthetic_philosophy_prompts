  CDT defenders say a careful agent doesn't oscillate but settles into a mixed strategy—randomizing between staying and fleeing. This makes Death uncertain, so it might not be in either city, giving the agent a 50% chance of survival. FDT, on the other hand, treats the decision as part of a larger logical structure. The agent's choice and Death's prediction are subjunctively dependent. FDT would choose the action that, if chosen by all similar agents, leads to the best outcome. In this case, randomizing also gives 50%, so both theories recommend the same action: randomize.

