  - Without the ability to prove that the other will cooperate, the FairBot would defect. But the Löb argument provides a proof that the other will cooperate (by proving P, i.e., that both cooperate) and hence the FairBot cooperates.

  Therefore, mutual cooperation is the only fixed point that is consistent with the provability logic of the system.

  The mutual defection fixed point would require that there is no proof of P, but the Löb argument shows that there is a proof of P (if F is consistent), so mutual defection is impossible.

