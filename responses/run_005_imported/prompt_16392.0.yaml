  We are discussing the FairBot from the MIRI paper "Robust Cooperation in the Prisoner's Dilemma". The key point is that two identical FairBots (with the same source code) playing against each other will cooperate, and this is achieved via Löb's theorem. The question is why we need Löb's theorem and why symmetry alone (which would suggest mutual cooperation or mutual defection) is insufficient.

  Recall the setup of the Prisoner's Dilemma (PD):
  - Cooperate (C) and Defect (D).
  - Payoffs: if both cooperate, both get R (reward). If one defects and the other cooperates, the defector gets T (temptation) and the cooperator gets S (sucker). If both defect, both get P (punishment). We assume T>R>P>S and 2R>T+S.

  FairBot is defined as follows (in pseudocode):

      FairBot(X):
          Search for a proof (in some formal system F) that "X(FairBot) = C"
          If such a proof is found, then output C
          Else, output D

  Now, when two FairBots (say, FB1 and FB2) play against each other, they are identical. So, FB1 is trying to prove that FB2(FB1) = C, and FB2 is trying to prove that FB1(FB2) = C.

  The key is that FB1 and FB2 are the same, so we denote the FairBot program by FB. Then:

      FB(FB) = 
          Search for a proof that "FB(FB) = C"
          If found, output C; else, output D.

  We want to show that FB(FB) = C.

  The argument using Löb's theorem goes as follows:

  Löb's theorem states that for any formula P, if we can prove (in F) that (Prov_F(#P) -> P) then we can prove P. In symbols: F ⊢ □(□P → P) → □P.

  Now, let P be the statement "FB(FB) = C".

  We note that if FB(FB) = C, then it must be because the search found a proof of P (i.e., F ⊢ □P). And if the search finds a proof of P, then it outputs C. So:

      FB(FB) = C   if and only if   F ⊢ □P

  But note that the FairBot outputs C only if it finds a proof of P. So we have:

      P   ⇔   (□P)   [because P is "FB(FB)=C", and the code says: output C iff □P]

  Wait, but note that the code does not guarantee that if □P then P? Actually, if □P is found, then the output is C, so P holds. Conversely, if P holds, then the output is C, which by the code must have been because □P was found (since if not, it would output D). So we do have:

      P   ⇔   □P

  But this is a fixed point: P is equivalent to the provability of P.

  However, note that in general, for a formal system F that is consistent, we cannot have P ⇔ □P for all P because that would lead to contradictions (e.g., take P as a contradiction). But here we are constructing a specific P.

  Now, note that the fixed point P ⇔ □P has two solutions in the context of provability logic:
  1. P is true and provable.
  2. P is false and not provable.

  But we want to show that P is true and provable.

  Löb's theorem is used to break the symmetry and rule out the mutual defection case (which would correspond to P being false and not provable).

  How?

  Suppose that we can prove in F that (□P → P). Then by Löb's theorem, we would get F ⊢ □P, and hence P holds.

  But note: what is □P → P? It says that if there is a proof of P, then P holds. But in our case, P is defined as the statement that FB(FB)=C. And note that if there is a proof of P, then FB(FB) does output C, so P holds. Therefore, the implication □P → P is actually true. Moreover, we might hope that F can prove this.

  But note: the statement □P → P is:

      If there is a proof (in F) that FB(FB)=C, then indeed FB(FB)=C.

  Why is this true? Because if there is a proof of P, then the FairBot will find it and output C, so P holds. Therefore, the implication holds. Moreover, since the behavior of FairBot is defined by a program that F can reason about (if F is sufficiently strong, e.g., includes PA), then F can prove this implication.

  Specifically, F can prove:

      □P → P

  because:
  - □P means that F has a proof that the FairBot (with source code FB) when given input FB will output C.
  - But by the definition of FairBot, if it finds a proof that the opponent (which is also FB) will output C, then it outputs C. Therefore, if there is such a proof, then FairBot outputs C, i.e., P holds.

  So F ⊢ □P → P.

  Then by Löb's theorem, we get F ⊢ □P, and then since □P → P and □P, we get P.

  Therefore, FB(FB)=C.

  But what about the other fixed point? Why is mutual defection (i.e., both output D) not a possibility?

  In the mutual defection case, we would have:
  - FB(FB) = D.
  - This happens because the search for a proof of P (which is "FB(FB)=C") fails.
  - So there is no proof of P, meaning F ⊬ □P.

  But note: if F is consistent, then if there were a proof of P, then P would hold and the output would be C. But if the output is D, then P is false. However, we just showed that F ⊢ □P → P and then by Löb we get F ⊢ □P. So if F is consistent, then it cannot be that there is no proof of P because we have actually proven P (and hence also □P, by the soundness of the proof system?).

  Wait, but note: Löb's theorem requires that F is sufficiently strong (like PA) and consistent. We assume F is such.

  The key is that we have shown that F ⊢ □P → P implies F ⊢ □P. And then by the soundness of the proof (if F is sound, i.e., only proves true statements) then P would be true. But we cannot assume F is sound? However, note that in the context of the FairBot, we are working in a system that can prove its own properties? Actually, we are using F to reason about the FairBot, and we assume F is strong enough to formalize the computation of the FairBot.

  But note: the argument above that F ⊢ □P → P is a proof in F. So if F is consistent, then we have F ⊢ □P. Then by the definition of FairBot, it will find the proof and output C. So P holds.

  Therefore, the mutual defection case is ruled out because we have a proof in F that P holds (via Löb's theorem) and hence the FairBot will find that proof and cooperate.

  But what if F is inconsistent? Then anything could happen, but we assume F is consistent.

  Without Löb's theorem, how would we break the symmetry?

  The symmetry argument says: either both cooperate or both defect. But we cannot rule out both defecting by symmetry alone. However, the above proof shows that both must cooperate because the FairBot can prove that the other will cooperate (via the Löb argument) and hence it cooperates.

  Without Löb's theorem, we might be stuck in a situation where we cannot prove that the other will cooperate, and hence both defect. But note that the above proof shows that there is a proof of cooperation (if F is strong enough and consistent). Therefore, the FairBot will find it and cooperate.

