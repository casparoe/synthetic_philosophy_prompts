answer: |-
  Okay, let's ditch the encyclopedia and get visceral. You've nailed the *what* of counterpart theory (CT). The *why* boils down to Lewis's fundamental commitment to **taking possibility *literally* as concrete reality** (modal realism) and his desire for a **metaphysically hygienic system** that avoids contradictions. Kripke's gut-punch is powerful, but it targets a different *understanding* of modality than Lewis is offering. Here's the breakdown:

  ### The Core "Why": Avoiding Metaphysical Contamination

  1.  **Modal Realism is BRUTALLY Literal:** For Lewis, possible worlds aren't abstractions, stories, or linguistic conveniences. They are **concrete, causally isolated, spatio-temporally connected universes**, just as real as ours. Imagine infinite, disconnected space-time bubbles. *Everything* in a world is part of that bubble's space-time fabric.

  2.  **The Horror of Overlapping Individuals (Transworld Identity):**
      *   Suppose Humphrey *himself* exists in multiple worlds (World1 and World2).
      *   In World1 (actual), Humphrey loses the election. He has property P (Losing).
      *   In World2, Humphrey wins. He has property ~P (Winning).
      *   **The Problem:** How can *the very same thing*, Humphrey, be both P and ~P? We're not talking about different *times* (where properties change), but different *worlds*.
      *   **Accidental Intrinsics:** This is where that term bites. An "intrinsic" property is one an object has purely in virtue of itself, regardless of its surroundings (like shape, mass, material composition, *winning an election* relative to *himself*). "Accidental" means it could have been otherwise.
          *   *Winning* seems like an intrinsic property Humphrey *could* have had (it's accidental he lost). *Losing* is an intrinsic property he *does* have.
          *   If Humphrey literally exists in both World1 and World2, then *he himself* must bear the intrinsic property *Losing* (in W1) and the *incompatible* intrinsic property *Winning* (in W2). **The same concrete object is both P and not-P.** This violates the principle of the Indiscernibility of Identicals (if X and Y are identical, they share *all* properties). It makes Humphrey fundamentally contradictory *as a single entity*.

  3.  **Lewis's Solution: Worldbound Individuals & Counterparts:**
      *   **Rule:** No object exists in more than one world. Each world's contents are sealed off. Humphrey is *only* in World1.
      *   **But we need to make sense of "Humphrey could have won":** Enter counterparts. In World2, there's a guy, C-Humphrey. He is *very* similar to our Humphrey in important respects (origins, appearance, personality up to a point), *but he is a distinct concrete object* living in a distinct universe.
      *   **Why it "Solves" Accidental Intrinsics:** Our Humphrey (W1) has *only* the property *Losing*. C-Humphrey (W2) has *only* the property *Winning*. There is *no single object* that bears both incompatible properties. Contradiction avoided! "Humphrey could have won" is true *because* there's a world where a sufficiently Humphrey-like counterpart wins.

  **The Gut-Level "Why" for Lewis:** Allowing literal transworld identity would force him to say that a single, concrete object can have fundamentally incompatible intrinsic properties simultaneously (just in different universes). This is metaphysically repugnant to him – it violates the logical coherence of an individual. It makes individuals "spread thin" across worlds in a way that destroys their integrity. Worldboundness + counterparts preserves the logical consistency of each individual *within* its own world while still providing a concrete grounding for modal claims *across* worlds via similarity. It's the price of taking possible worlds as *real concrete places*.

  ### Kripke's Objection: The Gut Punch & Why Lewis Can (Sort Of) Roll With It

  *   **The Punch:** "Humphrey himself couldn't care less whether some *other* guy, however similar, in some *other* universe wins *his* election. He cares about *himself* winning *here*! CT makes modal claims about *him* depend on things happening to *others* elsewhere. That feels deeply wrong."
  *   **Why It Lands:** Because Kripke (and most of us intuitively) think about modality *de re* (about the thing itself). We think *Humphrey himself* has the property of *possibly winning*. We care about *his* potential.
  *   **Lewis's Defense (The Semantic Shift):**
      1.  **It's Not *About* Identity:** Lewis agrees! CT *denies* that "Humphrey could have won" is a claim about Humphrey *literally* winning in another world. That's impossible (worldboundness!). The statement is *fundamentally different* under CT.
      2.  **It's About Counterpart Relations:** The statement means: There exists a possible world W, and in W there exists an individual X, such that X is a counterpart of Humphrey (in our world), and X wins the election in W.
      3.  **What "Possibly Winning" Means *for Humphrey*:** For Lewis, Humphrey's property of *possibly winning* isn't a mysterious modal property *he* possesses. It's a property *reducible* to the existence of a winning counterpart. Humphrey's modal properties *supervene* on what his counterparts do in other worlds. *That's just what "possibly P" means* within Lewis's concrete pluriverse framework.
      4.  **The Trade-Off:** Lewis sacrifices the intuitive *de re* "aboutness" of modal statements to gain a metaphysically consistent, reductionist account grounded entirely in his concrete possible worlds. He's offering a *replacement* for the intuitive notion, not a direct implementation of it. He'd say Kripke's objection *presupposes* the very transworld identity that Lewis has shown leads to contradiction (if worlds are concrete).

  **Does Kripke Sink CT?** Not within Lewis's own system. Kripke powerfully exposes the *cost* of Lewis's view: it fundamentally redefines what our modal statements *mean* in a way that clashes violently with strong pre-theoretical intuitions. For someone who *rejects* modal realism (like Kripke), or who prioritizes the *de re* intuition, this cost is fatal. For Lewis, it's a necessary and acceptable cost to avoid the metaphysical mess he sees in transworld identity. It's less a refutation and more a stark highlighting of the deep philosophical divide.

  ### The Real Intuition

  Think of it like this:

  *   **Transworld Identity View (Intuitive):** Imagine Humphrey is like an actor. The actual world is one movie where he loses. Other possible worlds are different movies where the *same actor* (Humphrey) plays different roles – sometimes winning, sometimes losing, maybe sometimes a plumber. "Humphrey could have won" means: *That same actor* starred in a winning movie. Kripke's point: Of course Humphrey cares about *his own* performances!
  *   **Lewis's View (Counterpart Theory):** No. Each world is a completely separate movie production, with its own cast of actors who *never* cross over. Humphrey is *only* in the "Losing" movie. The "Winning" movie features a *different actor* (C-Humphrey) who looks *remarkably similar*, studied the same acting method, maybe even has the same agent, but is fundamentally a different person. "Humphrey could have won" means: There exists a movie very similar to Humphrey's, starring a very similar actor, where *that actor* wins. Lewis says: That's the *only* coherent way to have multiple concrete movies (worlds) without violating the logical identity of the actors (individuals). Kripke retorts: But that means Humphrey's possible success is really about someone else's *actual* success in a different film! Why should *he* care?

  **The Deep Why:** Lewis prioritized building a vast, concrete multiverse where every logical possibility is literally real and non-contradictory *within each universe*. The cost was fragmenting individuals and redefining "could have" as "someone very like me did, over there." The "why" is his commitment to that specific, literal vision of possibility, warts (like Kripke's objection) and all. It's a brilliant, internally consistent system that deliberately sacrifices a powerful intuition to avoid what he saw as a deeper metaphysical incoherence.
