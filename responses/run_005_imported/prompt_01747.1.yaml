  First, I should map the core positions. The knowledge norm (KN) champion will argue assertion requires knowledge, while the truth norm (TN) defender will claim truth alone is constitutive, with other epistemic rules being general conversational norms. The dialogue must show deep engagement, not just trading positions.

  For lottery cases: Why can't we assert a losing ticket pre-draw? KN will say it's because knowledge is impossible here, despite high probability. They need to explain why knowledge specifically is the blocker, not just insufficient grounds. TN will counter that the oddity comes from violating conversational norms against misleading assertions, since the listener expects actionable certainty.

  For Moorean paradoxes ("p but I don't know p"): KN should say it's literally impossible to properly assert this because the second clause denies the knowledge required for the first. TN will argue it's pragmatically defective - asserting p while admitting ignorance violates norms of cooperative dialogue.

  If Lackey cases come up: A selfless asserter has great evidence but doesn't believe p. KN must explain why this assertion seems okay despite lacking belief (a knowledge component). TN can easily accept it since p is true.

  I'll structure the dialogue with natural back-and-forth. Let Phil defend KN and Terry TN. Start with lottery cases to anchor the debate, then move to Moorean assertions. Phil can bring up Lackey to challenge TN, letting Terry respond. The dialogue should show each side grappling with the other's strongest points - e.g., when Phil admits TN handles Lackey well but argues KN better explains why we feel lottery assertions are inherently wrong, not just conversationally awkward.

  Key moves: Phil should emphasize that KN explains why lottery assertions feel intrinsically defective, not contextually inappropriate. Terry should stress parsimony - why posit special assertion norms when general pragmatics suffice? For Moorean cases, Phil must show why it's not just odd but inconceivable to properly assert, while Terry treats it as a pragmatic clash.

  The challenge is making technical distinctions (constitutive vs. conversational norms) clear through debate. I'll have Terry press Phil on why "knowledge" isn't just a label for whatever epistemic standard conversation requires, and Phil counter that truth alone is too thin to capture assertion's unique commitment.
answer: |-
  Here’s a dialogue between **Phil** (defending the knowledge norm) and **Terry** (defending the truth norm), tightly focused on your requested data points, with genuine dialectical pressure:

  ---

  **Phil:** Look, the lottery case is decisive. I’ve got a ticket for a fair lottery with a million tickets. The odds of losing are 0.999999. Yet, I can’t just *assert* to you, "Your ticket lost." It sounds awful—like I’m misleading you. Why? Because I *don’t know it lost*. Knowledge requires more than near-certainty; it requires the impossibility of salient error. Here, the error-possibility *is* salient: you *could* win. That’s why you lack knowledge, and that’s why asserting it is improper.

  **Terry:** Hold on. I agree asserting "Your ticket lost" is improper pre-draw. But why jump to *knowledge* as the special ingredient? The problem is purely epistemic: your evidence, while strong, isn’t *conclusive*. It fails to rule out the relevant alternative (winning). That’s a general norm of conversation—don’t assert p unless your evidence is sufficiently strong to rule out contextually relevant alternatives. It’s not that assertion *constitutively* requires knowledge; it’s that conversational norms require strong evidence, and in lottery contexts, "sufficiently strong" means *conclusive*. Knowledge doesn’t add anything unique.

  **Phil:** But it does! Suppose we’re in a context where the stakes are low, and the alternative isn’t salient—say, I’m asserting "The café is open" based on seeing people inside at 10am. My evidence isn’t conclusive (maybe it’s a private event?), but if the error-possibility isn’t salient, I *can* know it’s open, and asserting it is fine. In the lottery, the error-possibility *is* structurally salient—it’s baked into the setup. Knowledge tracks that salience. Your "sufficiently strong evidence" norm is just knowledge in disguise! You’re helping yourself to "relevant alternatives" without explaining why *assertion* in particular cares about them. I say it’s because assertion is constitutively governed by the knowledge norm.

  **Terry:** Not so fast. Let’s test constitutivity with Moorean assertions. Consider: "It’s raining, but I don’t know it’s raining." That’s absurd! On your view, it’s because the first half *requires* knowledge to assert properly, but the second half denies that knowledge. Contradiction! But I can explain it without your norm: asserting p *conversationally implies* that I believe p, and that I take my evidence to support p. The second clause directly contradicts those implicatures. It’s a pragmatic clash, not a violation of a constitutive rule of assertion. Truth is all that’s constitutive; the absurdity comes from flouting conversational expectations.

  **Phil:** But your explanation is too weak. The Moorean assertion isn’t just *odd*; it’s *inconceivable* to assert it properly. If I say it sincerely, I’m asserting p while admitting I lack adequate grounds—which directly violates the knowledge norm! Your conversational story makes it sound like a mere faux pas. But it’s deeper: the act itself is defective because it simultaneously *invokes* the knowledge norm (by asserting p) and *denies* its satisfaction. That’s why it feels like a contradiction, not just rudeness.

  **Terry:** Fine, but what about Jennifer Lackey’s selfless assertion case? A devout creationist science teacher, who has overwhelming evidence for evolution (and recognizes it as such), asserts "Homo sapiens evolved from Homo erectus" to her students. She doesn’t *believe* it due to faith, but she asserts it because it’s true and she’s a responsible teacher. Intuitively, her assertion seems perfectly proper—even praiseworthy! But *you* can’t vindicate that. She doesn’t *know* it (since knowledge requires belief), so your norm says she shouldn’t assert it. But she should! Truth is what matters for proper assertion here; her epistemic shortcomings are about her psychology, not the speech act.

  **Phil:** That’s a fair challenge. I’ll bite the bullet: her assertion *is* improper, even if well-intentioned. She’s asserting something she rationally takes to be true but doesn’t believe. That’s like testifying while mentally crossing your fingers—it violates the sincerity commitment built into assertion. The students *think* she’s expressing knowledge, but she isn’t. It’s analogous to a lie, even if p is true! Your truth norm lets her off the hook too easily. "p is true" is the *aim* of assertion, but the *norm* is knowledge—you can’t properly assert p unless you’re in a position to guarantee it’s true, which is what knowledge provides.

  **Terry:** But now you’re conflating ethics with semantics! The creationist’s assertion *communicates the truth effectively*—that’s why it’s proper *as an assertion*. Your "guarantee" point just restates your dogma. Back to lottery cases: imagine a modified context. Suppose I’m a lottery official with a failsafe machine that destroys all but one ticket before the draw. I know the machine is reliable, but I haven’t seen today’s result. I still can’t assert "Ticket #000001 lost" pre-draw, even though my evidence is *better* than in standard lottery cases! Why? Because I still lack knowledge—the error possibility, while tiny, is salient. Yet on my view, it’s straightforward: the conversational norm demands near-certainty for high-stakes claims, and "salient" just tracks what’s conversationally relevant. No need to invoke a special *knowledge* rule for assertion specifically.

  **Phil:** But your "conversational norm" *is* the knowledge norm! When you say "near-certainty" or "ruling out salient alternatives," you’re describing the conditions for knowledge. You’re just refusing to call it "knowledge." The reason lottery assertions feel intrinsically defective, not just contextually risky, is because assertion is the *exteriorization* of knowledge. It’s why Moorean assertions are paradoxical, not just impolite. Truth is the goal, but knowledge is the license. Without it, you’re not *entitled* to assert, even if you get lucky.

  **Terry:** And without truth, you’re not *successful* in asserting, even if you "know"! That’s the point: truth is constitutive; knowledge is a glorified epistemic condition we layer on top. I’ll grant that in *most* contexts, conversational norms require knowing for proper assertion. But that’s derivative. The core rule is truth. Everything else—evidence, alternatives, belief—is pragmatic scaffolding. Your view inflates a useful heuristic into a metaphysical constraint.

  ---

  **Key Engagements Summarized:**  
  - **Lottery Case:** Phil argues lack of *knowledge* (due to salient error-possibility) explains intrinsic oddness; Terry argues it’s merely insufficient evidence for conversational norms.  
  - **Moorean Assertion:** Phil sees a constitutive contradiction (asserting p while denying knowledge); Terry sees a pragmatic clash with conversational implicatures.  
  - **Selfless Assertion (Lackey):** Terry uses it to show truth can suffice, making KN seem too restrictive; Phil bites the bullet, tying assertion to belief/knowledge for "sincerity."  
  - **Dialectical Moves:** Terry presses parsimony (truth + general pragmatics); Phil insists knowledge uniquely explains assertion’s "commitment" across contexts.  

  Would you like a follow-up focusing on their strategies for handling "reasonable false assertions" or pragmatic encroachment?
