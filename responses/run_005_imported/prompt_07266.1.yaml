  First, the core move: decoupling truth and assertability. Lewis's real insight wasn't about conditionals per se but about probability operators - we must avoid treating probabilistic constraints as truth conditions. That's the fulcrum. 

  For the credence function restriction: even if we limit to an agent's actual P, Lewis's Step 3 only needs closure under conditioning on A and ¬A - which any minimally rational agent must handle. So the restriction doesn't block triviality. The escape hatch is to stop equating P(if A,C) with P(C|A) at the truth-conditional level entirely. 

  Now the elephant in the room: "If I jump, I'll sprout wings" being true when I don't jump. The material conditional is counterintuitive here, but the rebuttal needs two prongs: (1) our intuition tracks assertability (no one would assert this when not jumping) not truth value, and (2) the Jackson/Edgington point about robustness - we only assert conditionals when we'd still believe them upon learning the antecedent. That explains why we don't assert false-antecedent conditionals frivolously.

  The payoff is elegant: we keep truth conditions simple (material conditional) while explaining probabilistic behavior via pragmatic constraints. NTV overcorrects by denying truth conditions entirely when the problem was misattribution of probabilistic features. 

  This frames Lewis as offering a deeper diagnosis: triviality arises from conflating distinct theoretical roles, not from conditionals being semantically sui generis. The argument's force comes from showing how both problems dissolve under one unified move.
answer: |-
  Here’s the argument against defaulting to NTV, framed as a direct address to your seminar students, leveraging Lewis’s suppressed insights and Jackson’s machinery. It targets the two sticking points explicitly:

  ---

  ### Why Triviality Doesn’t Force NTV: Lewis’s Unclaimed Escape Route  
  *For the Conditional Truth-Conditionalist*

  You’ve seen Lewis’s proof: if Adams’ Thesis (AT)—that *P*(if A, C) = *P*(C|A)—holds for all probability functions closed under conditionalization, and if “if A, C” has truth conditions, triviality follows. The NTV response is tempting: ditch truth conditions. But this mistakes the locus of the problem. **The collapse arises not because conditionals *can’t* have truth conditions, but because AT is misassigned to the *semantics* rather than the *pragmatics* of assertion.** Lewis’s real lesson is that probabilistic constraints like AT govern *rational commitment*, not truth-conditional content. Here’s how to reconcile truth conditions with the data.

  #### 1. Why Restricting AT to Actual Credences Fails (and What Solves It)  
  Lewis’s triviality regenerates with minimal closure: Step 3 only requires that AT holds under *conditionalization on A and ¬A*. This seems fatal even if we restrict AT to an agent’s *actual* credence function *P*₀, since any rational agent must handle *P*₀(* |A) and *P*₀(* |¬A)*. If "if A, C" has a fixed truth condition, then:  
  - *P*₀(if A, C | A) = *P*₀(C | A)  [by AT applied conditional on A]  
  - *P*₀(if A, C | ¬A) = *P*₀(C | A)  [by AT applied conditional on ¬A]  
  But unless *P*₀(C | A) is 0 or 1, this forces *P*₀(if A, C) to equal *P*₀(C | A) *and* be probabilistically independent of A—which is impossible (hence collapse).  

  **The fix:** AT doesn’t constrain the *truth value* of "if A, C". It constrains when the conditional is *assertable*. Specifically:  
  > **Assertability-Adams’ Thesis (AAT):**  
  > The *assertability* of "if A, C" for an agent S is *P*ₛ(C | A).  

  *AAT explains the probabilistic data without embedding AT into the semantics.* Truth conditions can be simple (e.g., the material conditional A ⊃ C), while assertability obeys AT. This dissolves the proof: AAT doesn’t require *P*(if A, C | ¬A) = *P*(C | A), because assertability isn’t subject to conditionalization—it’s a property of acts, not propositions. Lewis’s proof requires AT to hold *as a semantic constraint* under conditionalization; AAT avoids this by relocating AT to pragmatics.

  #### 2. Why "True When ¬A" Isn’t Fatal (It’s a Predictable Assertability Effect)  
  NTV’s strongest intuition: if "if A, C" is true whenever ¬A, then "If I jump from this chair, I’ll sprout wings" is true (since I won’t jump). But this seems absurd—we’d judge it *false*, not just unassertable. Doesn’t a material-conditional semantics (A ⊃ C) get this wrong?  

  **Reply:** No—it gets the *truth condition* right, but our intuition tracks *assertability*, not truth. Consider:  
  - When ¬A, A ⊃ C *is* true. But we almost never *assert* A ⊃ C when ¬A, because doing so would violate pragmatic norms.  
  - **Robustness** (Jackson): We assert "if A, C" only if we’d *still* believe A ⊃ C *upon learning A*. If I learn I’ll jump, I’ll reject "if I jump, I sprout wings" (since wings won’t sprout). Hence, asserting it when ¬A is *misleading*: it suggests robustness under A, which is absent.  
  - **The illusion of falsity:** When we hear "if I jump, I’ll sprout wings", we evaluate it *as if we assume A is true* (via conditional supposition). If we suppose I jump, we see C is false—so we reject the conditional *as asserted*. But this doesn’t require the conditional to be *semantically false* when ¬A; it reflects that the assertion *defeats its own robustness condition*.  

  **Crucially:** If I *know* ¬A, and say "if A, C" (e.g., "If Biden resigned yesterday, Harris is now President" when he didn’t), my claim is *true* but **unassertable**—because it implicates I’d stand by it if A were true (which I wouldn’t, absent evidence for C|A). We confuse this unassertability for falsity. The "absurd" conditional isn’t false; it’s a pointless/misleading thing to say when ¬A, precisely because its truth is trivial and it fails robustness.

  #### The Positive View: Truth Conditions + Pragmatic AT  
  Lewis hinted at this: conditionals have material conditional truth conditions, but we use them to express *conditional beliefs*. Jackson systematized it:  
  - **Semantics:** "if A, C" ≡ A ⊃ C  
  - **Pragmatics:** Assert "if A, C" only if:  
    (i) *P*(C|A) is high (per AAT)  
    (ii) A ⊃ C is *robust* with respect to A: *P*(A ⊃ C | A) is high (≈ *P*(C|A) is high)  
  This captures all AT-constrained judgments *without* collapse. When we judge "if A, C" false, it’s either:  
  - Because A is true and C false (so A ⊃ C false), or  
  - Because we’re objecting to an assertion that *lacked robustness* (hence was misleading, even if accidentally true).

  #### Why This Beats NTV by Default  
  NTV treats AT as non-negotiable data requiring semantic revolution. But Lewis showed AT is negotiable *as a truth constraint*—it’s negotiable because it’s pragmatic. This view:  
  - Explains why we *have* probabilistic intuitions (via AAT)  
  - Explains why conditionals embed in truth-functional compounds ("Either if A, C or if B, D" has clear truth conditions)  
  - Avoids NTV’s struggles with negation, disjunction, and iterated conditionals  
  - Respects Gricean insights: many "semantic" intuitions are pragmatic.  

  **Final point:** Lewis didn’t "lack nerve"—he saw that *locating* AT in pragmatics preserves classical logic while explaining the data. NTV is the overreaction; the mature response is to let truth conditions and assertability conditions do distinct work. The triviality proof isn’t a *reductio* of truth conditions; it’s a proof that AT must be pragmatic.

  ---

  This forces students to grapple with the *costs* of NTV (e.g., embedded conditionals) and reframes the "absurd true conditional" as a predictable effect of misaligned truth and assertability—a standard Gricean move. It also credits Lewis with anticipating Jackson’s robustness solution.
