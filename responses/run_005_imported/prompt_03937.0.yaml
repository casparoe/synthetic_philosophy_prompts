prompt: |-
  Quick one for you -- putting together a seminar session on Spinoza's political philosophy and want to sanity-check my own reading before I inflict it on students.

  You know how the Tractatus Politicus just stops mid-argument in chapter 11 ("Of Democracy")? Spinoza died before finishing it. Here's the last bit we have, Elwes's translation:

  > 3. ... I added, besides, "who are independent," except in so far as they are under allegiance to the laws of the dominion, to exclude women and slaves, who are under the authority of men and masters, and also children and wards, as long as they are under the authority of parents and guardians...
  >
  > 4. But, perhaps, someone will ask, whether women are under men's authority by nature or institution? For if it has been by mere institution, then we had no reason compelling us to exclude women from government. But if we consult experience itself, we shall find that the origin of it is in their weakness. For there has never been a case of men and women reigning together, but wherever on the earth men are found, there we see that men rule, and women are ruled, and that on this plan, both sexes live in harmony. But on the other hand, the Amazons, who are reported to have held rule of old, did not suffer men to stop in their country, but reared only their female children, killing the males to whom they gave birth. But if by nature women were equal to men, and were equally distinguished by force of character and ability, in which human power and therefore human right chiefly consist; surely among nations so many and different some would be found, where both sexes rule alike, and others, where men are ruled by women, and so brought up, that they can make less use of their abilities. And since this is nowhere the case, one may assert with perfect propriety, that women have not by nature equal right with men: but that they necessarily give way to men, and that thus it cannot happen, that both sexes should rule alike, much less that men should be ruled by women. But if we further reflect upon human passions, how men, in fact, generally love women merely from the passion of lust, and esteem their cleverness and wisdom in proportion to the excellence of their beauty, and also how very ill-disposed men are to suffer the women they love to show any sort of favour to others, we shall easily see that men and women cannot rule alike without great hurt to peace. But of this enough.

  That "but of this enough" is literally the last sentence Spinoza ever wrote.

  Here's the thing I don't have a clean answer for. Spinoza's whole theory of natural right is supposed to just be potentia -- right tracks power, full stop, thats the entire point of the fish passage back in TTP ch. 16 (fishes "enjoy the water, and the greater devour the less by sovereign natural right"). So in section 4, is he actually applying that same standard to women, or has he quietly swapped in a totally different notion of "power" -- like, whoever happens to have historically held social authority -- dressed up in the same word? And if its the second thing, doesn't that sink the argument by his own lights, since tons of things people have "always" done (slavery being the obvious one) are precisely the kind of contingent custom his method is elsewhere supposed to unmask rather than ratify? Is there a charitable reading of "weakness" (imbecillitas, the actual word he uses) here that actually saves the consistency of the argument, or does this passage just show the power=right framework quietly buckling the moment it hits an entrenched social hierarchy?
