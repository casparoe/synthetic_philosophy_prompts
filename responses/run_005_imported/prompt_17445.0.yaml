prompt: |-
  Okay so this is going to sound like a weird starting point but bear with me. Last month my sister and I had to carry her couch down four flights of stairs and out to a truck, and at some point I realized neither of us had said a single word for like five minutes straight — we were just constantly micro-adjusting our grip, speed and angle based on what the other person was doing, like there was a "we" steering the couch and not just two "I"s that happened to be holding the same object. That weird feeling stuck with me and eventually sent me down a Wikipedia rabbit hole (and then some Stanford Encyclopedia of Philosophy pages that were honestly way over my head) on "collective intentionality" and "joint action," apparently a whole corner of philosophy I never knew existed.

  Two names keep getting pitted against each other: Michael Bratman and Margaret Gilbert. There's also a guy named Searle who thinks "we-intentions" are just a totally primitive, unanalyzable thing, but I want to focus on the first two since they seem to be the main rivals. My rough understanding (please correct me if I'm butchering this) is that Bratman thinks a "shared" intention is really just each persons ordinary individual intentions and beliefs about each other, wired together the right way — you intend the joint activity partly because you expect the other to do their part, your subplans mesh, you both stay responsive to each other, etc — but underneath its still just two seperate minds doing individual-level mental stuff that happens to interlock, nothing extra required. Gilbert, on the other hand, seems to say that's not enough, that real joint action needs a "joint commitment," which isn't reducible to any pile of individual intentions no matter how cleverly you stack them, and which is what actually generates the feeling that my sister would've had every right to snap at me if I'd just let go of my end without warning — like we owed each other something the moment we started carrying it together, not just as a matter of politeness but as an actual obligation.

  So here's what I'm actually asking: can you properly lay out and compare these two theories for me, including anywhere they might actually agree? And then, using the couch example, tell me which one you think really captures what was going on and why — is that "you can't just let go without warning" feeling good evidence for Gilbert's side, or can Bratman's more individualist story explain it too if you look closely enough? I'd also genuinely like to know whether this is one of those debates where there's no fact of the matter and it just comes down to which features of acting together you personally think are most important to explain, or whether one of the two theories actually has a real edge over the other.
