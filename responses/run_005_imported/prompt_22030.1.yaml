prompt: |-
  So I'm about two-thirds through a mystery novel, and my protagonist -- a semi-retired forensic accountant named Odile who's fallen into amateur sleuthing -- has this whole personal creed that she'll never make a call, professional or otherwise, until she's squeezed every last free scrap of evidence out of a situation first. In chapter 9 she defends this to a skeptical old partner by saying something like "you can never be worse off, on average, for knowing more, only for knowing less," and name-drops some statistician's theorem she half remembers from a night class years ago. A friend of mine whos into decision theory told me she's basically gesturing at Good's theorem on the value of information, but that her version of it is way too clean, and that there's a bunch of caveats and edge cases lurking in there that would make for much better material than the strawman-y "more info is always better" line she's currently got.

  I don't want to just paste in a dry definition, i want to actually understand this well enough to give the skeptical partner some real ammunition against her, the kind of pushback that's genuinely sharp rather than a cheap gotcha. So could you walk me through the most important implications of Good's theorem for someone who's built her whole decision-making style around "always gather more free evidence before deciding"? Like, in what sense is she actually right, and where exactly does the guarantee stop covering what she thinks it covers -- I'm especially curious about anything involving opponents who know in advance that she'll wait, cases where the evidence isn't really free once you count her time or nerve, and whether the theorem has anything to say about how the knowing itself will feel, as opposed to just which choice she ends up making. Feel free to get technical, I'll translate it into dialogue later.
