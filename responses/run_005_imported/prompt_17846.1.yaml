prompt: |-
  I sit on my university's student-run Honor Committee, and a seminar on Sartre I'm taking this term has made this week's case hard to shake. A first-year was found responsible for bringing prohibited notes into a final exam, and at the sanctioning hearing she presented testimony from professors calling her scrupulously honest, arguing that the act reflected panic, not who she really is. Our sanctioning guidelines list "character and reputation for integrity" as something the panel "may weigh" in setting the penalty, without saying how much. Half the committee wants to treat the testimony as an ordinary mitigating factor, the way we would for anyone with a clean record; the other half keeps returning to Sartre's point that facticity -- a person's past and traits -- never adds up to a fixed character that could make an act genuinely "out of character," and worries that crediting the plea just rewards the kind of self-flattering excuse he calls bad faith. Write the short memo I'll bring to Friday's meeting: recommend how much weight, if any, the testimony should get, with reasoning the rest of the committee could apply to later cases, and take the strongest version of the other side's argument seriously rather than dismiss it.
reasoning: |-
  Okay, the user is part of a university Honor Committee dealing with a tricky case. A first-year student was caught with prohibited notes in an exam. Professors testified that she's usually scrupulously honest, arguing this was a panic-induced lapse. The committee is split: half see this testimony as a standard mitigating factor, while the other half is influenced by Sartre's concept of "bad faith" and worries that accepting this excuse rewards self-deception. 

  Hmm, this is fascinating because it pits practical ethics against existential philosophy. The user needs a memo that bridges both worlds—something concrete enough for committee procedures but philosophically rigorous. They specifically asked to engage the Sartrean counterargument seriously, not dismiss it. That tells me they value intellectual honesty and want to avoid oversimplifying either position. 

  The core tension: Can past behavior define "character" in a way that makes an act "out of character"? Sartre says no—we're always free to choose anew, so claiming "that wasn't me" is bad faith. But the committee guidelines explicitly mention "character and reputation" as factors. How to reconcile this? 

  I should acknowledge Sartre's point isn't wrong—it's just not the whole story in an institutional context. The committee isn't judging metaphysical freedom; they're assessing accountability in a community. Reputation matters here because trust is relational. If multiple professors vouch for a student, it suggests this act disrupted an established pattern of trustworthiness. That’s pragmatically relevant, even if Sartre would argue the student could’ve chosen differently in that moment. 

  The strongest counterargument: Accepting testimony could incentivize "performance" of integrity—polished students might get lighter sanctions. But that’s why we shouldn’t treat testimony as definitive proof of "good character." It’s just evidence of how the community perceived them pre-incident. The real question is whether that history makes recurrence less likely. 

  For the memo, I’ll recommend: 
  - Testimony gets moderate weight (not decisive, not ignored). 
  - It must be specific (not vague praise) and from credible sources. 
  - Balance it with the act’s severity—panic doesn’t erase harm. 
  - Frame it as "community trust capital," not fixed identity. 

  This way, we honor guidelines without endorsing bad faith. The student still owns her choice, but her history suggests she’s worth reinvesting trust in. That’s both humane and practical.
answer: |-
  ## Memorandum: Weight of Character Testimony in Sanctioning  
  **To:** Honor Committee  
  **From:** [Your Name], Committee Member  
  **Date:** [Date of Meeting]  
  **Subject:** Recommendation on Weight of "Character and Reputation" Testimony in First-Year Exam Violation Case  

  ### I. Recommendation  
  The testimony regarding the respondent’s "scrupulous honesty" and reputation for integrity **should be given moderate weight as a mitigating factor**, but **not as an exemption from accountability**. It should not override the seriousness of the violation, nor should it be dismissed entirely. This testimony is most valuable as evidence of a *pattern of behavior* that may inform the likelihood of rehabilitation and the proportionality of the sanction.  

  ### II. Reasoning: Balancing Facticity, Freedom, and Institutional Purpose  
  Our guidelines permit weighing "character and reputation for integrity" precisely because they offer context about a student’s relationship to the community’s values. However, Sartre’s critique of "bad faith" provides a crucial caution against over-reliance on this testimony:  

  #### A. Engaging the Sartrean Counterargument (The Strongest Version)  
  Sartre argues that humans are fundamentally defined by their *choices in the present*, not by past actions or others’ perceptions ("facticity"). To claim an act is "out of character" is to deny one’s radical freedom and responsibility in that moment—a form of self-deception ("bad faith"). Applying this rigorously:  
  1. **No Fixed Character:** Past integrity cannot absolve present dishonesty. The act *is* her character in that decisive moment.  
  2. **Bad Faith Incentive:** Over-crediting reputation testimony risks rewarding students who cultivate a "reputation shield" while enabling them to evade owning their choices.  
  3. **Equity Concerns:** Privileging testimony from professors may favor students skilled at performing integrity for authority figures, disadvantaging others.  

  **This argument is valid and must constrain how we use testimony.** It warns us against:  
  - Treating reputation as destiny ("She’s honest, so this *can’t* be who she is").  
  - Implying past goodness "cancels" present wrongdoing.  
  - Allowing testimony to obscure the need for genuine accountability.  

  #### B. Why Testimony Still Deserves Moderate Weight  
  Sartre’s existential view, while philosophically robust, operates at a different level than institutional sanctioning. Our purpose is not to adjudicate metaphysical freedom but to uphold community standards, educate, and foster rehabilitation. Within this framework, testimony has pragmatic value:  
  1. **Pattern vs. Anomaly:** A documented history of integrity *suggests* this act may be an aberration, not a pattern. While not determinative, this informs the *proportionality* of sanctions (e.g., suspension vs. expulsion).  
  2. **Rehabilitative Potential:** Evidence of prior commitment to integrity indicates a higher likelihood of successful rehabilitation than a student with a history of dishonesty.  
  3. **Community Trust:** The testimony reflects invested community members’ willingness to vouch for the student’s potential to reintegrate—a key factor in restorative justice.  
  4. **Guideline Intent:** The inclusion of "character and reputation" in guidelines implies that past conduct *contextualizes* present actions, even if it doesn’t excuse them.  

  #### C. Applying Moderate Weight: Guardrails Against "Bad Faith"  
  To heed Sartre’s warning while honoring our guidelines, apply testimony as follows:  
  1. **Not Absolution, but Context:** Testimony mitigates *sanction severity*, not responsibility. The act remains a violation.  
  2. **Require Specificity:** Vague praise ("a good kid") is inadmissible. Testimony must cite *concrete examples* of integrity (e.g., "She reported a grading error in her favor").  
  3. **Balance with Harm:** Greater harm (e.g., premeditation, cheating in a core ethics course) diminishes testimony’s weight. Panic may explain but never justify.  
  4. **Focus on the Act:** The primary factor remains the violation itself. Testimony is secondary evidence about *response to sanction*, not primary evidence about the act.  
  5. **Sanction as Dialogue:** The sanction should compel the student to reconcile their "reputation" with their action (e.g., through reflective essays or ethics workshops), avoiding bad faith.  

  ### III. Application to This Case  
  - The professors’ *specific* examples of prior honesty suggest this violation is likely situational (panic).  
  - However, the committee must still impose a sanction reflecting the exam’s integrity breach (e.g., course failure, honor probation).  
  - Mitigation could take the form of a reduced suspension term or eligibility for record expungement after rehabilitation—*conditional* on her confronting the act.  

  ### IV. Framework for Future Cases  
  1. **Admit** testimony about character/reputation if it is specific and from credible sources.  
  2. **Weight** it moderately: It can reduce sanction severity but not negate core penalties.  
  3. **Neutralize bad faith** by requiring the student to explicitly acknowledge their responsibility and the disconnect between their act and their professed values.  
  4. **Prioritize** the nature of the violation, intent, and harm to the community above reputation.  

  **Conclusion:** Sartre compels us to reject the notion that past facticity defines a self, but our role demands we consider how facticity informs future choices within a learning community. By weighing testimony *moderately* and *conditionally*, we honor both existential responsibility and our educational mission—holding students accountable while offering a path back from a single act of bad faith.  

  Respectfully submitted,  
  [Your Name]
