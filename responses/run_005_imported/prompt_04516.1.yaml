prompt: |-
  Ok so this has been bugging me for like a week now and I'd like an actual answer, not just "people are complicated." My friend has been going through a rough patch with her boyfriend, and a bunch of times now shes said this exact kind of sentence: "I know he's cheating on me, but I don't believe it." She's not hedging when she says it either — she's very clear she's not just suspicious, she's seen the texts, she knows. She just also, in the same breath, says she doesn't believe it. I told her that doesn't add up, if you know something's true then you believe it's true, thats basically what knowing means, so she can't have it both ways. She got kind of annoyed and said I was twisting her words and that everyone knows exactly what she means when she talks like that.

  Thing is, she's not wrong that I get it, because I've caught myself saying the same shape of sentence before, like "I know I bombed that interview, but I don't believe I bombed it," and it didn't feel like I was lying or confusing myself, it felt like an honest description of where my head was at. But when you actually write the sentence down plain — "I know X, but I don't believe X" — it looks broken, like it's taking something back the second after it says it. So which is it: is my friend (and me, apparently) genuinely stuck believing a contradiction, or saying something false about ourselves, or is there actually nothing wrong with sentences shaped like that and I'm the one who's wrong to call it out? I'd like something a bit more precise than "the heart wants what it wants," if possible.
