  Alright, let me unpack this query. The user is writing a piece on fanaticism in effective altruism and longtermism, focusing on how expected-value reasoning leads to chasing tiny probabilities of huge payoffs. They've encountered Lara Buchak's risk-weighted expected utility (REU) theory as a potential solution but are confused about why it's fundamentally different from standard expected utility (EU) with a concave utility function. 

  First, I need to clarify the core confusion: the user thinks REU might just be EU with extra risk aversion. Their source mentioned it's a "global attitude toward risk," but they didn't get the mechanics. So the task is to explain the structural difference between REU's rank-dependent weighting versus EU's concave utility, and which axiom REU violates.

  Hmm, the user is clearly technically adept—they mention stochastic dominance and Allais paradoxes—so I can dive into formalism. But I should anchor it in their EA context. The fanaticism problem (e.g., Pascal's mugging) is their real target, so REU's avoidance of extreme probability weighting should tie back to that. 

  Breaking it down:
  1. **EU recap**: Standard EU uses \( U(g) = \sum p_i u(x_i) \) with concave \( u \) making people risk-averse. But this still cares about extreme outcomes linearly with probability.
  2. **REU's twist**: It uses a rank-dependent model: outcomes ranked worst to best, weighted by a transformation \( r \) of *cumulative* probabilities. The formula \( REU(g) = u(x_1) + \sum_{i=2}^n r\left(\sum_{j=i}^n p_j\right) \left(u(x_i) - u(x_{i-1})\right) \) shows how \( r \) (e.g., convex) overweights bad tails. 
  3. **Key difference**: Concave \( u \) in EU locally diminishes marginal utility of wealth, while REU's \( r \) globally reshapes risk perception based on outcome ranks. Example: A convex \( r \) makes you disproportionately fear worst-case scenarios even if \( u \) is linear—impossible in EU.
  4. **Axiom violation**: REU drops the independence axiom (if \( A \succ B \) then \( pA+(1-p)C \succ pB+(1-p)C \)). This allows Allais-paradox preferences, which EU forbids but humans exhibit. REU handles this via rank-dependent weighting.
  5. **Stochastic dominance**: The user is sharp to ask—REU preserves dominance by using comonotonic weighting (weights respect ranking), unlike naive probability weighting (e.g., prospect theory without ranks). 

  The user might also want to know *why* this matters for fanaticism. Ah yes: REU discounts extreme good outcomes more aggressively than EU if \( r \) is concave for gains. For Pascal's mugging (tiny chance of astronomical payoff), \( r(p) \ll p \) near zero probability, making REU ignore it. EU would still chase it. 

  Should I mention how Buchak's \( r \) function can be tailored? Like if \( r(p) = p^c \) (\( c>1 \)) for losses, it overweights bad tails. But for gains, \( r(p) = p^k \) (\( k<1 \)) underweights good tails. That's the global risk attitude—pessimism isn't baked into utility but into probability perception via ranking. 

  Also, the user's source was hurried—I should explicitly contrast "local" (EU's \( u \)) vs. "global" (REU's \( r \)): EU's risk aversion depends on wealth level (diminishing utility), while REU's depends on the gamble's structure (e.g., "how bad could it get relative to better outcomes?"). 

  Finally, caveat: REU isn't the only solution. Other models like rank-dependent utility or prospect theory exist, but Buchak's is axiomatized cleanly. And it doesn't "solve" fanaticism per se—it just models why some might reject it, ethically.
answer: |-
  Okay, let's break down Buchak's Risk-Weighted Expected Utility (REU) theory, its distinction from standard Expected Utility (EU) with a concave utility function, the axiom it drops, and how it handles dominance/consistency. This gets to the heart of why it's seen as a different *kind* of risk attitude.

  **1. Core Mechanics: The r-function and Rank-Dependence**

  *   **Standard EU:** Evaluates a gamble `g` with outcomes `x₁, x₂, ..., xₙ` (ordered such that `u(x₁) ≤ u(x₂) ≤ ... ≤ u(xₙ)`) and probabilities `p₁, p₂, ..., pₙ` as:
      `EU(g) = Σ [p_i * u(x_i)]`
      Risk aversion is modeled *entirely* by the curvature of the **utility function `u`**. Concave `u` means diminishing marginal utility, making the agent dislike mean-preserving spreads (risk).

  *   **REU:** Also uses `u(x)`, but transforms the *cumulative probabilities* using a **risk function `r: [0,1] → [0,1]`** that is strictly increasing and satisfies `r(0)=0`, `r(1)=1`. Crucially, it **ranks outcomes from worst to best** and weights the *improvements in utility* based on the *cumulative probability* of getting *at least* a certain level of utility.
      `REU(g) = u(x₁) + Σ_{i=2}^n [ r(P_i) * (u(x_i) - u(x_{i-1})) ]`
      Where `P_i = Σ_{j=i}^n p_j` (the probability of getting outcome `x_i` *or better*).

  *   **What the r-function does:**
      *   It transforms the cumulative probability `P_i` *before* it is used to weight the *utility increment* `(u(x_i) - u(x_{i-1}))`.
      *   `r(P_i)` determines how much weight the *possibility of getting at least `x_i`* gets when valuing the *improvement* from `x_{i-1}` to `x_i`.
      *   The shape of `r` captures the agent's **global attitude towards risk**:
          *   **Risk-Aversion:** `r` is **convex** (`r''(p) > 0`). This means `r(p) < p` for `p` near 0, and `r(p) > p` for `p` near 1. *Interpretation:* The agent underweights the *chance of improvement* when that chance is small (pessimism about good things happening) and overweights it when the chance is large. Crucially, this leads to **overweighting the worst outcomes** relative to the middle, because the weight `r(P_i)` for a *low-ranked* outcome `x_i` depends on the large cumulative probability `P_i` of getting *something at least that bad* (which `r`, being convex, overweights relative to `P_i` itself).
          *   **Risk-Seeking:** `r` is **concave** (`r''(p) < 0`). `r(p) > p` near 0, `r(p) < p` near 1. Overweights small chances of big improvements, underweights near-certain improvements. Leads to overweighting the best outcomes.
          *   **Risk-Neutrality:** `r(p) = p`. Reduces to standard EU.

  **2. The Key Difference: Local vs. Global Risk Attitude**

  Here's why REU isn't just EU with a different `u`:

  *   **EU with Concave u: Local Risk Aversion via Diminishing Marginal Utility.**
      *   Risk aversion arises *solely* from how the agent values *individual wealth levels*. Moving from $100 to $200 provides a large utility gain; moving from $1,000,100 to $1,000,200 provides a tiny utility gain, even if both involve a $100 increase.
      *   The *probability distribution* of outcomes is weighted linearly. The agent cares about the *mean utility*, but utility itself increases slower than wealth.
      *   **Consequence:** The agent's *relative* aversion to two different gambles depends only on the final wealth distributions those gambles imply. The *structure* of the gamble (how the probabilities are distributed across the ranks) doesn't matter *beyond* determining the final distribution.

  *   **REU: Global Risk Attitude via Probability Transformation.**
      *   The utility function `u` can be (and often is assumed to be) linear! Risk attitude is primarily captured by `r`.
      *   Risk aversion arises from **overweighting the likelihood and impact of bad outcomes relative to better ones**, *based on their position within the gamble's distribution*. The agent cares about the *entire profile* of the gamble – not just the final distribution, but *which outcomes are the worst, and how likely the very worst possibilities are*.
      *   **Consequence:** The agent's aversion to a gamble depends critically on the **ranking of outcomes within that specific gamble**. Two gambles leading to the *same* final wealth distribution can be evaluated differently by REU if the *worst possible outcomes* in each gamble are different, even if those worst outcomes have the same utility! This is impossible under standard EU.

  **3. The Crucial Axiom Dropped: Independence**

  REU violates the **Independence Axiom** (or Sure-Thing Principle), which is fundamental to standard EU.

  *   **Independence Axiom:** If an agent prefers gamble A to gamble B, then for any third gamble C and any probability `p` (0 < `p` < 1), they must prefer the compound gamble `pA + (1-p)C` to `pB + (1-p)C`.
  *   **Why EU requires it:** Linearity in probabilities. The EU of `pA + (1-p)C` is `p * EU(A) + (1-p) * EU(C)`.
  *   **How REU violates it:** The ranking of outcomes in the compound gamble `pA + (1-p)C` can be *dramatically different* than the ranking in A or B alone. The `r`-function transforms cumulative probabilities based on this specific ranking. Adding `C` changes which outcomes are the worst and best, altering the weights `r(P_i)` applied to the utility increments. An outcome that was "middling" in gamble A might become the *worst possible* outcome in `pA + (1-p)C` if `C` has only better outcomes. REU's overweighting of the worst outcome will now apply heavily to this formerly middling outcome, potentially reversing the preference between `pA + (1-p)C` and `pB + (1-p)C`, even if the agent preferred A to B alone.

  **4. Handling Stochastic Dominance and Allais**

  *   **Stochastic Dominance (SD):** REU satisfies **First-Order Stochastic Dominance (FOSD)**. If gamble A gives a higher probability of achieving *any* given utility level or better than gamble B, then REU(A) > REU(B). This is guaranteed by the rank-dependent structure and the requirement that `r` is strictly increasing. The cumulative probabilities `P_i` for A dominate those for B at every utility level, and applying the same increasing `r` preserves this dominance in the weighted sums. *This is why naive probability weighting (like in early Prospect Theory) fails, but REU succeeds.*
  *   **Allais Paradox:** REU *can* explain the common Allais Paradox choices (which violate Independence and thus standard EU). The typical pattern involves:
      1.  Preferring a *certain* large prize over a gamble with a high chance of a slightly larger prize but a small risk of nothing. (REU: Convex `r` overweights the small risk of the worst outcome (0), making the gamble look worse).
      2.  Preferring a gamble with a small chance of a large prize over a gamble with a slightly smaller chance of a slightly larger prize, when both have a high chance of 0. (REU: The worst outcome (0) is the same in both and has a high probability (overweighted similarly). The key difference is in the *best* outcomes. Concave `r` for gains underweights the *improvement* from the large prize to the slightly larger prize when the cumulative probability `P_i` for getting *at least* the large prize is already small. The relative improvement `(u(large+) - u(large))` gets downweighted by `r(small_p)`, making the option with the slightly larger prize less attractive than the option with the slightly higher probability of the large prize).

  **5. Why This Matters for Fanaticism**

  *   **EU's Fanaticism Problem:** Standard EU is linear in probabilities. A 1 in a googolplex chance of `u(astronomical value)` still contributes `(1 / googolplex) * u(astronomical value)` to the expectation. If `u(astronomical value)` is large enough (e.g., saving a googolplex lives), this term dominates, forcing you to prioritize this tiny chance over near-certain significant benefits. This seems fanatical.
  *   **How REU Escapes:** REU applies the risk function `r(p)` to the cumulative probability. For a tiny probability `p` of an astronomical outcome:
      *   If `r` is **concave** (risk-seeking for gains), `r(p) > p`. This *amplifies* the fanaticism!
      *   If `r` is **convex** (risk-averse for gains), `r(p) << p` for very small `p`. The weight applied to the *improvement* represented by the astronomical outcome is massively reduced. `r(tiny_p) * (u(astronomical) - u(next best))` becomes negligible, even if `u(astronomical)` is huge. The agent discounts tiny probabilities of massive gains *more aggressively* than EU does, potentially avoiding the fanatical conclusion.
      *   **The Global Attitude:** This discounting isn't based on the local curvature of `u` at astronomical wealth levels (which might be flat, suggesting diminishing returns have *stopped*). It's based on the *global* attitude towards the structure of risk: a convex `r` expresses deep pessimism, systematically downweighting the significance of very small chances of massive improvements relative to better outcomes. It's a distinct *kind* of pessimism focused on the gamble's risk profile.

  **In Summary:**

  | Feature          | Standard EU (Concave u)             | REU (Convex r)                       |
  | :--------------- | :---------------------------------- | :----------------------------------- |
  | **Risk Attitude** | **Local:** Diminishing marginal utility of wealth/outcomes. | **Global:** Overweighting bad tail outcomes based on their rank within the *specific gamble*. |
  | **Mechanism**    | Curvature of `u(x)`.                | Transformation `r(P)` of cumulative probabilities `P` applied to utility *increments* over ranks. |
  | **Key Axiom**    | Satisfies **Independence**.         | Violates **Independence**.           |
  | **Gamble Dependence** | Depends only on final outcome distribution. | Depends on the *ranking* of outcomes *within the gamble*. |
  | **SD/Allais**    | Satisfies FOSD, Violates Allais.    | Satisfies FOSD, Can Explain Allais.  |
  | **Fanaticism Escape** | Weak. Concave u helps, but linearity in p remains. | Strong (if `r` convex). `r(p) << p` for tiny p crushes the weight of massive gains. |

  REU offers a formally rigorous way to model agents who are fundamentally *pessimistic* about the tails of distributions in a way that's distinct from diminishing marginal utility. This pessimism, encoded in the convex `r` function, provides a potential normative or descriptive justification for rejecting the fanatical conclusions forced by standard EU in extreme low-probability/high-impact scenarios, making it a significant conceptual tool in the EA/longtermism debates about fanaticism. It's not "just" EU with extra curvature; it's a different architecture for decision-making under risk.
