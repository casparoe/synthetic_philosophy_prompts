  Value complexity involves conflicting values, context-dependence, and latent preferences. Humans value multiple things that sometimes conflict, and their priorities shift with context. IRL struggles with this complexity. The user might think observing behavior captures all nuances, but values like "don't harm others" are hard to infer from actions alone.

