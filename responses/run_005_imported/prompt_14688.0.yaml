  Then there's partial observability. Humans have internal states—beliefs, emotions, intentions—that aren't visible. If an AI misinterprets an action due to missing context, it could infer the wrong reward function. The user might assume that more data solves this, but even with lots of data, the core issue of unobservable states remains.

