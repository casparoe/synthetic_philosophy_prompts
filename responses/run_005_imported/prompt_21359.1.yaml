answer: |-
  Here’s the argument, structured to foreground the theological-metaphysical interdependence you’re seeking, using Leibniz as the contrasting orthodox foil:

  **Core Thesis:** Newton’s Arian conception of God’s *unmediated, sovereign dominion* (requiring direct, ubiquitous presence and agency) is not merely adjacent to, but *constitutively necessary* for his doctrine of absolute space. A Trinitarian Newton, committed to divine mediation through the Son/Logos and divine transcendence, would likely have adopted a relational or emanative view of space akin to Leibniz’s, rendering absolute space metaphysically superfluous.

  **The Argument:**

  1.  **Newton’s Arian God: Sovereignty Demands Immediacy:** Newton’s heresy centers on rejecting the co-equality and consubstantiality of the Son. God the Father is the *sole* Supreme Being, the "Pantokrator" (Almighty Ruler). This elevates *dominion* (Gr. *Kyriotēs*) to the primary divine attribute. Dominion, for Newton, isn’t abstract sovereignty; it’s active, providential governance requiring God’s *immediate presence* and *direct agency* throughout creation. A mediating Logos (as in orthodox Trinitarianism) would imply delegation and distance, undermining this absolute, unmediated Lordship. God must be *directly* present to rule.

  2.  **Absolute Space as the Necessary Medium of Dominion:** Newtonian absolute space is:
      *   **Infinite:** To encompass the totality of God’s potential and actual dominion.
      *   **Immutable/Eternal:** Reflecting God’s unchanging sovereignty ("He endures forever, and is everywhere present" - Gen. Scholium).
      *   **Substantival (but not independent):** Not a *creature*, but the *emanent condition* of God’s presence and action ("as it were, an emanative effect of God" - Drafts for Gen. Scholium). It *is* God’s omnipresence made metaphysically concrete.
      *   **The "Sensorium":** The Opticks query (1717) crystallizes this: Space is God’s "sensorium" not in a crude anthropomorphic sense, but as the *medium through which God immediately perceives and acts* upon every part of creation. Dominion requires direct perception and unmediated volitional reach. Space *is* the structural manifestation of God’s capacity for immediate governance.

  3.  **Leibniz’s Orthodox Objection: Mediation Makes Absolute Space Superfluous (and Theologically Dangerous):** Leibniz, a committed Trinitarian, attacks Newton’s absolute space precisely *because* it violates orthodox theological principles:
      *   **Argument from Divine Wisdom/Perfection (Relationality):** Leibniz argues space is merely the *order of co-existing things* ("Space is the order of coexistences" - Leibniz 3rd Letter). God, in His perfection, creates a harmonious universe where relations *between* substances define spatiality. An absolute, infinite container is ontologically redundant and implies God created an "immense void" before creation – wasteful and contrary to divine wisdom. *Theologically:* The Trinitarian God creates *through* the Logos, establishing inherent relational order. The world reflects divine reason (Logos), not brute divine presence needing a container.
      *   **Argument Against "Sensorium":** Leibniz scoffs at the sensorium (5th Letter), arguing it implies God needs "organs" to perceive the world. For Leibniz, God’s knowledge is immediate *because* He sustains the universe in being through His will. *Theologically:* Orthodox transcendence holds God knows creation *through* His essence and the Logos, not via a quasi-physical medium. Newton’s sensorium smacks of materialism and undermines divine simplicity.
      *   **Idolatry of Space:** Leibniz implies (and Clarke furiously denies) that making space an attribute or "emanative effect" of God risks making space itself divine – a subtle idolatry (Leibniz 5th Letter). *Theologically:* Trinitarianism safeguards transcendence; God relates *to* creation through the Son/Spirit, not *as* an infinite container. Newton’s view blurs Creator/creation boundaries.

  4.  **Why Orthodoxy Undermines Absolute Space:**
      *   **Mediation:** The Trinitarian God acts *through* the Son/Logos. Creation reflects divine *Logos* (rational order/relationality), not primarily divine *Voluntas* (Will) requiring a stage for immediate action. Leibniz’s relational space embodies this *Logos*-centric view. A Trinitarian Newton would find Leibniz’s relational space metaphysically sufficient and theologically preferable.
      *   **Transcendence:** Orthodox theology emphasizes God’s radical otherness. An infinite, eternal space *as* God’s "emanative effect" or "sensorium" brings God perilously close to creation, violating divine simplicity and transcendence. Newton’s Arian emphasis on immanent, active Lordship *requires* this proximity; orthodoxy rejects it.
      *   **Economy of Creation:** Leibniz’s relational space reflects a world perfectly ordered *by* God *at creation*. Newton’s absolute space reflects a world constantly governed *by* God *through direct presence*. Orthodoxy leans towards the former (creation as perfected act); Newton’s Arianism demands the latter (ongoing, unmediated rule).

  **Conclusion:** Newton’s absolute space isn't just compatible with his Arianism; it’s its *metaphysical corollary*. The concept of God as *sole* Sovereign Lord, whose dominion necessitates immediate presence and direct action throughout all reality, *requires* an absolute, infinite, eternal space as the very medium of that presence and action. Leibniz’s Trinitarian orthodoxy, emphasizing divine mediation through the Logos, divine transcendence, and creation as a rational relational order, makes absolute space appear theologically suspect and metaphysically redundant. A Newton holding orthodox Trinitarian beliefs would lack the core theological driver – the imperative of *unmediated sovereign dominion* – that made absolute space philosophically necessary *and* theologically coherent for him. His physics of forces acting at a distance finds its ultimate theological grounding in this vision of a God whose dominion is exercised *directly*, everywhere, without intermediary, through the very structure of space itself.
