  I'm outlining a near-future novel where one of my characters, a physicist turned doomsday cultist, uses the "Doomsday Argument" to convince people that humanity is going extinct on a specific timeline, and I want the math she rattles off to actually check out. From what I read, the argument says something like: since I'm probably somewhere in the middle of all humans who will ever be born, and we're at ~117 billion humans total so far, we can plug that into Bayes' theorem and get an actual number of years humanity has left before doomsday. So I was going to have her stand up at a conference and say "there's a 95% chance humanity goes extinct within the next 60-90 years" and then cite this as her source.

  Is that basically the right way to use it, math-wise? My writers' group friend said something about "reference classes" that confused me even more, and I want her calculation on stage to feel airtight (or at least airtight enough that another character can't immediately poke a hole in it), so if there's a specific formula/number I should have her use to get from "total humans born" to "extinction happens in the year 20XX," that would help a ton.
