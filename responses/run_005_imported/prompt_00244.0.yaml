answer: |-
  Your character's use of the Doomsday Argument (DA) is conceptually on point, but the specific timeline you've mentioned (60-90 years) **doesn't mathematically follow** from the standard DA calculation using the 95% confidence interval and current birth numbers. The DA inherently gives timescales in the **thousands of years**, not decades. However, this is *perfect* for your story – it highlights how a charismatic cultist twists complex math for her agenda. Here's the breakdown:

  **The Core Doomsday Argument Logic (Simplified):**

  1.  **Copernican Principle:** Assume you are a randomly selected human among all humans who will *ever* live (the "reference class" - more on this later).
  2.  **Your Birth Rank:** Your position in the sequence of all humans. Current estimates put the total number of humans born up to now (N) at approximately 117 billion. So *your* rough birth rank is ~117 billion.
  3.  **The 95% Confidence Interval:** If you are random, there's a 95% chance you are *not* in the *first* 2.5% or the *last* 2.5% of all humans. You are likely somewhere in the middle 95%.
  4.  **Implication for Total Humans (M):** This means there's a 95% chance that the *total* number of humans who will ever exist (M) is less than your birth rank (N) divided by the *lower* bound of the confidence interval (0.025 for 95%).
      *   **Formula:** `M < N / (L)` where `L` is the lower percentile bound (0.025 for 95% CI).
      *   **Calculation:** `M < 117,000,000,000 / 0.025 = 4,680,000,000,000` (4.68 Trillion)
  5.  **Future Humans (F):** `F = M - N`
      *   **Calculation:** `F < 4,680,000,000,000 - 117,000,000,000 = 4,563,000,000,000` (4.563 Trillion)

  **The Crucial (and Manipulated) Step: Converting Future Births (F) to Time**

  *This is where your cultist distorts the science to get her terrifyingly short timeline.*

  1.  **Standard Approach (Reasonable but gives long timelines):**
      *   **Estimate Average Annual Births (B):** This is highly uncertain. Currently, it's ~140 million/year. Historically, it's been lower. Future projections vary wildly (growth, decline, stabilization).
      *   **Assume a Constant Rate:** For a rough estimate, scientists might use the current rate or a projected average. *Even using the high current rate:*
          *   `Time (T) = F / B`
          *   `T < 4,563,000,000,000 / 140,000,000 ≈ 32,593 years` (Over 32,000 years!)
      *   **Using a Projected Higher Average (e.g., 180 million/year):** `T < 4,563,000,000,000 / 180,000,000 ≈ 25,350 years`.
      *   **The 50% Estimate (Median):** Often cited is the point where there's a 50% chance M is less than 2N. `M_median = 2 * 117 Billion = 234 Billion`. `F_median = 234B - 117B = 117 Billion`. `T = 117,000,000,000 / 140,000,000 ≈ 836 years`. Still centuries.

  2.  **Your Cultist's Manipulation (How she gets 60-90 years):**
      To get her desired short timeline, she **must grossly misrepresent the future birth rate (B)** or **misapply the confidence interval**. Here's how she could "justify" it on stage:

      *   **Scenario 1: Cherry-Picking the Rate & Ignoring Averaging:**
          *   "The Doomsday Argument gives us a 95% confidence upper bound of **4.563 Trillion** future humans! But look at our *exploding* population! Peak annual births are projected to hit **180 million soon**. To be conservative, let's even assume they stay catastrophically high at **200 million/year** on average until the end. Simple division: `T = 4,563,000,000,000 / 200,000,000 = 22,815 years`. But wait! That's absurdly long! Humanity *cannot* sustain such profligate reproduction for millennia! We are *already* breaching planetary boundaries. A *realistic* model must account for an imminent **population collapse**. Our ecological models show birth rates will *plummet* to pre-industrial levels (say **50 million/year**) within a single century due to ecosystem collapse, famine, and conflict. Therefore, the *effective* average birth rate over the truncated remaining timeline is dominated by the initial high rate before collapse. Let's take a *weighted average*: 80 years at 150 million/year, followed by near zero. That gives roughly `F = (80 * 150,000,000) = 12 Billion` future humans. Plugging *this* into the Doomsday Argument's upper bound formula: `M = N + F = 117B + 12B = 129 Billion`. Solving for the confidence: `129B = 117B / L => L = 117B / 129B ≈ 0.907`. This corresponds to only about a **9.3% confidence level**! The Argument *demands* we consider higher confidence! To achieve true 95% confidence (`L=0.025`), the *effective* future births `F` must satisfy `M = 117B / 0.025 = 4.68 Trillion`, thus `F = 4.563 Trillion`. If births collapse to 50 million/year within 100 years, the *only* way to reconcile this with the 95% confidence DA is if the collapse happens **much sooner**, limiting the total future births possible before extinction. Our integrated model shows this points conclusively to collapse beginning within **60-90 years**, with effective total future births aligning with the DA's 95% upper bound under collapse conditions."
          *   **What she did:** She started with the correct DA output (F < 4.563T), then argued that ecological reality prevents the high birth rates needed for a long timeline. She *retroactively applied* the DA's F limit to justify her pre-existing collapse model's short timeline, creating a circular argument that *sounds* like the DA forces the short timeline. She confuses the DA's *probabilistic bound on total births* with a *prediction of imminent collapse*.

      *   **Scenario 2: Misapplying the Percentile (More Blatant Distortion):**
          *   "The logic is impeccable! I am birth rank `n = 117 Billion`. There is a 95% chance I am not in the last 5% of all humans. Therefore, there is a 95% chance that *less than* 5% of all humans are born *after* me. Future humans `F` represent less than 5% of total humans `M`. Since `F = M - n` and `F < 0.05M`, we can substitute: `M - n < 0.05M => 0.95M < n => M < n / 0.95`. Thus `M < 117B / 0.95 ≈ 123.16 Billion`. Therefore, future humans `F = M - n < 123.16B - 117B = 6.16 Billion`! At current birth rates of ~140 million/year, that gives us `T = 6,160,000,000 / 140,000,000 ≈ 44 years`! Even accounting for some fluctuation, the 95% confidence upper bound is **well under 90 years**!"
          *   **What she did:** This is **WRONG** but sounds plausible. She misinterpreted "not in the last 5%" as "less than 5% come after me". The correct interpretation for 95% confidence of not being in the *last* 2.5% is `F < n / 0.025` (as in the standard calculation above), not `F < 0.05 * M`. This error drastically reduces `F` and `T`. This is the kind of mistake a desperate or manipulative "physicist" might make (or pretend to make).

  **The "Reference Class" Problem (Your Friend's Point):**

  This is the strongest *scientific* counter-argument another character could make, even if the math above were used correctly. It cuts to the core philosophical weakness of the DA.

  *   **What is it?** Who exactly counts as part of the sequence of "all humans who will ever live"? Your cultist assumes `Homo sapiens sapiens` from ~200,000 years ago to extinction.
  *   **The Problems:**
      *   **Past:** When did "humans" start? Anatomically modern humans? Genus *Homo*? Including Homo Erectus (lived ~2M years) drastically increases `N`, pushing `M` and the timeline way out.
      *   **Future:** What if humans evolve, merge with AI, or create intelligent post-biological descendants? Do *they* count? If so, `M` could be astronomical, making the DA irrelevant. If not, how do you define the boundary? This is arbitrary.
  *   **The Cultist's (Flawed) Rebuttal:** She would likely dismiss this: "Sophistry! We are talking about *Homo sapiens*, flesh and blood, as we are now. Our biological lineage ends with us. Post-humans are a new lineage, a new 'reference class'. The Argument applies cleanly to *our* species. To muddy the waters with speculative futures is just denialism in the face of uncomfortable truth!" (This dismissal itself is the weak point - the definition is arbitrary and chosen to get the desired result).

  **Recommendation for Your Scene:**

  1.  **Have her use Scenario 1:** It's more sophisticated, shows her twisting multiple factors (DA + ecology), and allows her to sound like she's doing integrated science. She can flash the core DA math (`M < 117B / 0.025 = 4.68 Trillion`) authoritatively.
  2.  **Focus on the Birth Rate Manipulation:** Emphasize her argument about *imminent collapse preventing the high birth rates needed for a long DA timeline*. This is her key distortion. "The mathematics of our inevitable end, combined with the biosphere's collapse, leaves us only **decades**!" (Pointing dramatically at a graph showing birth rates crashing before the DA upper bound line is reached).
  3.  **Mention Carter or Bostrom:** Have her cite the originators: "As first rigorously formulated by astrophysicist Brandon Carter and philosopher John Leslie, and expanded by Nick Bostrom, the Bayesian logic is inescapable..."
  4.  **Preempt the Reference Class (Weakly):** "Some will quibble about definitions - 'what about cyborgs?'. But this Argument speaks to the end of *humanity as we know it*, the end of *this* chapter of consciousness. That end is near."
  5.  **The Punchy Line:** "The cold equations of probability, applied to the birth rank of every single person in this room, give a 95% probability that *Homo sapiens* will join the fossil record within the lifetime of our children and grandchildren – **within the next 60 to 90 years.** Denial is not just foolish; it's a betrayal of future generations who will curse our inaction!" (Cue stunned silence, then some scattered applause growing).

  **Why this works for your story:**

  *   **Sounds Authoritative:** She uses real terms (Bayes, Carter, Leslie, Bostrom, Copernican Principle, Confidence Interval), correct core DA formulas, and integrates another field (ecology).
  *   **Has a Kernel of Correctness:** The core DA *does* suggest humanity isn't at the very beginning of its story (which would be unlikely), implying a finite future. The 95% bound *is* a standard calculation.
  *   **Clearly Distorted:** The conversion to time relies on a *highly* speculative and self-serving assumption about birth rate collapse, misapplying the DA's output. The reference class is arbitrarily narrow.
  *   **Allows for Rebuttal:** Another character (a skeptical demographer or philosopher) can later challenge her on:
      *   The arbitrariness of the reference class.
      *   The wild assumption of imminent, drastic birth rate collapse used to force the short timeline.
      *   The fact that the DA, even if accepted, gives millennia, not decades, under reasonable birth rate assumptions.
      *   The historical track record of doomsday predictions based on probability arguments.

  This setup makes your cultist a formidable and seemingly knowledgeable antagonist whose central argument is emotionally powerful and *appears* mathematically rigorous on the surface, but is fundamentally flawed upon closer inspection – perfect for a compelling near-future thriller.
