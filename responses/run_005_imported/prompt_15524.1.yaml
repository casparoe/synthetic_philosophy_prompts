answer: |-
  Here’s a toast that threads the needle—poker lingo for the buddies, heart for Grandma, and laughs for all. (Clockwise: ~3 minutes):

  ---

  **(Clink glass)**  
  Alright, settle down, you degens. Deep breaths. I promise this isn’t a bluff.  

  We all know Dan. My friend, the human Kelly criterion. The man who won’t order dessert without calculating optimal fork-to-mouth ratios. Who sees a "60% chance of rain" and packs *exactly* 1.5 umbrellas. For him, life isn’t just about good bets—it’s about sizing them *perfectly* so you never go bust. Even if the EV’s sky-high, Dan’s hedging. Why? Because "variance is a cold, cold beast."  

  Then there’s Alex. *(Turn to Alex)* Alex sees a "60% chance of rain" and says, "Sounds like 100% chance I’m wearing a great hat!" If the expected value is positive? She’s all in. No half-measures. No bankroll management. Just fearless, glorious action. Which, Dan… let’s be honest… probably gives you cold sweats at 3 AM.  

  Lately, Dan’s brought this… *philosophy*… to their relationship. Where to live? "Honey, let’s Nash bargain this—geometric mean says we split the difference between Brooklyn and Bali!" Whose job takes priority? "Babe, my model suggests a 62.3% Kelly fraction on *your* promotion this quarter!" Alex just stares. *(Pause for effect)* I think last Tuesday, Dan tried to calculate the optimal toothpaste-squeezing strategy. Alex almost threw the tube at his head.  

  But here’s the magic. *(Shift tone, warmer)* Dan, for years, you’ve played a solo game. One brilliant mind against the variance of the universe. Protecting your stack. Minimizing ruin. But today? *(Raise glass)* Today, you’re merging bankrolls. And marriage isn’t a solo grind. It’s a two-player game.  

  Suddenly, "optimal bet sizing" isn’t just about *your* survival—it’s about betting on *each other*. Alex’s fearless "all-in" spirit needs Dan’s careful math not to hold her back, but to protect what they’re building together. And Dan? Alex’s courage is your new edge. She’ll push you to bet big on joy, even when variance whispers "fold."  

  So Dan, when you inevitably Nash bargain your way out of taking out the trash… Alex, when you drag him skydiving because "the EV of fun is infinite!"... Remember: his math isn’t madness now—it’s love ensuring you both thrive. Her boldness isn’t reckless—it’s the equity you never knew your life needed.  

  **(Turn to couple)**  
  To Dan and Alex: May your expected values always be positive, your bankrolls forever merged, and your greatest gamble—this one—pay off forever. **(Pause, grin)** And Dan? For once… go all-in.  

  **Cheers!**  

  ---

  ### Why it works:
  - **Poker Buddies:** "Kelly fraction," "variance," "Nash bargaining," "merged bankrolls," "edge," "fold" – all authentic nods they’ll love.  
  - **Grandma:** Explains concepts simply ("sizing bets," "math ensuring you thrive," "betting on each other"). The heart cuts through jargon.  
  - **Funny Beats:** Toothpaste squeezing, umbrella math, Alex’s hat logic – relatable absurdity.  
  - **Heart:** "Merging bankrolls," "protecting what they build," "her boldness is your edge" – re-frames tension as complementary superpowers.  
  - **3-Minute Fit:** Tight pacing, no meandering. Ends on the perfect callback ("go all-in").  
  - **No Sides Taken:** Teases both lovingly ("cold sweats," "throws toothpaste") and celebrates their differences.  

  **Pro Tip:** Deliver the poker lines with a knowing grin, and soften on the emotional turns. Let the "two-player game" line land with a warm pause. Dan’s buddies will howl at "optimal fork-to-mouth ratios." Grandma will clutch her heart at "betting on each other." Mission accomplished.
