answer: |-
  Based on Pascal's core principles in the *Pensées*, particularly fragments **298**, **294**, **326**, and **336**, he would likely view institutions like the International Criminal Court (ICC) or UN commissions of inquiry as **profoundly destabilizing and dangerous**, embodying the very "recklessness" he warns against, rather than a step toward uniting justice and might. Here's the argument, grounded in his texts:

  1.  **The Core Tragedy (Fragment 298 - Justice/Might Disjunction):**
      *   Pascal's starting point is the tragic reality: "Unable to make what is just strong, we have made what is strong just" (298). Established power *is* the source of legal legitimacy, not abstract justice. Justice without force is impotent; force without the *appearance* of justice is tyranny. Stable order depends on this union, however artificial.

  2.  **The Danger of "Sounding to the Source" (Fragment 294 - Destabilizing Exposure):**
      *   Pascal explicitly condemns publicly revealing the arbitrary, forceful origins of law: "It is dangerous to tell the people that the laws are not just, for they obey them only because they believe them to be just. That is why it must be told to them at the same time that they must obey them because they are laws, just as they must obey their superiors, not because they are just, but because they are superiors. By this means, all sedition is prevented, if this can be made intelligible and [if] the true definition of justice is set aside." (294)
      *   The ICC/UN commissions do *precisely* what Pascal deems dangerous: they publicly declare established powers (states, leaders) to have acted *unjustly* according to legal standards. They "sound the source" by exposing the gap between the *claimed* justice of state actions and a higher (but powerless) legal standard. This directly undermines the necessary belief that existing power structures *are* just, which Pascal sees as essential for obedience and preventing sedition.

  3.  **The Futility of Declaring Injustice Without Power (Fragment 326 - Useless Truth, Destructive Consequence):**
      *   Pascal argues that exposing injustice without the power to *establish* justice is not only dangerous but futile and counterproductive: "When everything is moving at once, nothing appears to be moving, as on board ship. When everyone is moving towards depravity, no one seems to be moving. But if someone stops, he shows up the others who are rushing on, by acting as a fixed point." (326)
      *   The ICC/UN commissions are the "someone" who stops. They declare a powerful actor unjust. But crucially, *they lack the force to stop the "ship"* or coerce compliance. According to Pascal, this action doesn't create a "fixed point" of new justice; it merely highlights the depravity without altering the ship's course. The result is not a step towards binding force to justice, but rather:
          *   **Destabilization:** Undermining the necessary belief in the legitimacy of the powerful actor/state (as per 294).
          *   **Resentment & Defiance:** Provoking the powerful actor to reject the judgment and potentially act more aggressively to assert its sovereignty/might.
          *   **No Positive Outcome:** Failing to create a *new*, more just order backed by force ("make what is just strong"). The injustice continues, now accompanied by heightened tension and the exposure of law's impotence against raw power.

  4.  **The Role of the Wise: Secrecy and Outward Conformity (Fragment 336 - Hidden Knowledge):**
      *   Pascal advises the discerning individual to recognize the arbitrary foundation of law privately but conform publicly: "One must have hidden thoughts... The wise man yields to the law... The people must not be made aware of the truth about the usurpation; it came about without reason and has become reasonable. It is necessary to make it regarded as authentic, eternal, and to conceal its origin if one does not wish that it should soon come to an end." (336)
      *   Institutions like the ICC act as the *opposite* of the "wise man." Instead of keeping the insight into the usurpation (the gap between might and true justice) hidden to preserve order, they loudly and publicly *proclaim* the usurpation (the injustice) of the powerful. They refuse to yield to the *de facto* law of power, yet offer no *de facto* power to replace it. This public exposure is exactly what Pascal believes hastens the end of the fragile order built on the union of might and the *appearance* of justice.

  **Conclusion:**

  Pascal would see the ICC and similar bodies not as steps toward uniting justice and might, but as dangerous institutionalizations of the "reckless" exposure he explicitly warns against in **fragment 294**. By publicly declaring powerful states or individuals unjust according to legal standards they cannot enforce (**fragment 326**), these bodies:

  1.  **Undermine Necessary Belief:** They shatter the crucial belief that existing power is just, which Pascal sees as essential for obedience and preventing sedition (**294**).
  2.  **Highlight Impotence:** They expose the fundamental disjunction between justice and force (**298**) in the most public way possible, demonstrating justice's powerlessness against might without offering any mechanism to bridge the gap.
  3.  **Provoke Instability:** They risk provoking defiance and resentment from the powerful, potentially increasing conflict, without any means to establish a new, more just order backed by force.
  4.  **Contradict Wisdom:** They act contrary to the Pascalian "wise man" who recognizes the usurpation privately but conforms publicly to preserve order (**336**).

  For Pascal, the tragic compromise of "making what is strong just" (**298**) is the only stable foundation for earthly order. Institutions that publicly denounce the "strong" as unjust, while possessing no force to make their *own* conception of justice strong, embody the destabilizing force of truth without power – the very thing his political realism condemns as destructive folly. Their declarations are, in his framework, not acts of justice, but acts of dangerous exposure that risk chaos without offering a viable path to a better-founded order.
