  5. **Question 5 (Contrast with Human Concepts):**
     - Human concepts are often grounded in sensory experiences and social interactions. How can a direction in activation space, which is abstract and mathematical, be said to have the same kind of representational content? Isn't there a fundamental disanalogy?

