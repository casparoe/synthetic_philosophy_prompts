     - Likely response: She might argue that the causal role (via intervention) bridges the gap between syntax and semantics.
     - Follow-up: If the causal role is what matters, then isn't the representation only defined by its functional role? But then how do we avoid behaviorism, which has well-known problems (e.g., holism, where the entire network is required for the representation to have meaning)?

  2. **Question 2 (Causal Criterion and Superposition):**
     - Main question: Your criterion for representation is that intervening on a direction changes downstream behavior in a way that the concept would predict. But when a feature is messy (polysemantic) or unstable, you often invoke superposition as an explanation. Doesn't this make your criterion unfalsifiable? How could a case look that would falsify the claim that a direction represents a concept?
     - Likely response: She might say that we can get better at disentangling features with better methods (e.g., larger dictionaries, better training) and that superposition is a real phenomenon that we can model and account for.
     - Follow-up: But if every time we find a messy feature we can always say "it's superposition and we need a bigger dictionary", then isn't the claim that a feature represents a concept immune to disconfirmation? How do we avoid the charge that this is just ad hoc?

  3. **Question 3 (Regress of Labeling):**
     - Main question: The concept that a feature is said to represent is typically fixed by the interpreter's labeling procedure. For example, we might train a sparse autoencoder to look for features we've labeled as "cat", "dog", etc. Doesn't this mean that the content of the representation is as much about our labeling process as it is about the network? How can we say we've discovered a "cat" feature if we were looking for one?
     - Likely response: She might argue that the labeling is just a way to identify the feature, but the causal role (via intervention) is what grounds the content. The feature exists independently of our labeling, and we can verify it by intervention.
     - Follow-up: But when we intervene, we are testing the feature in the context of the entire network and our labeling. How do we know that the causal role we observe isn't itself a product of our labeling? For instance, if I label a feature as "cat", then I design interventions that test for "cat"-like behavior, but what if the feature is actually doing something else that happens to correlate with "cat" in my tests? How do we break out of this hermeneutic circle?

  We also need 5-7 more questions to fill out 8-10 total. They should be challenging and not let her restate the position. Some ideas:

  4. **Question 4 (Alternative Explanations):**
