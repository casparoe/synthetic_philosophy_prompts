  Ah! Critical nuance: Peters isn't saying Kelly is optimal for infinite repetitions (which Samuelson rightly critiques) but that multiplicative systems require different success metrics even for finite lifetimes. The ergodicity break occurs because wealth is path-dependent - a point Samuelson's parallel worlds analogy misses.

