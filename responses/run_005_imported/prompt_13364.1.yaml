answer: |-
  Here's the strongest case for Peters' ergodicity economics perspective, directly challenging Samuelson's dismissal of the Kelly criterion as merely one arbitrary utility function:

  1.  **The Core Problem: Misidentifying the Observable Quantity:**
      *   Samuelson's expected utility theory (EUT) fundamentally relies on calculating the *ensemble average*: `E[U(W)]`. This asks, "What is the average utility of wealth across all *hypothetical parallel universes* where this single gamble is repeated independently by many identical agents?"
      *   Peters argues that for an *individual* experiencing a *single, sequential path* of multiplicative wealth growth (`W_t = W_0 * (1+f_1*R_1) * (1+f_2*R_2) * ... * (1+f_t*R_t)`), the relevant, physically observable quantity is the *time-average growth rate*: `g = lim_{T->∞} (1/T) * ln(W_T / W_0)`. This is the growth rate realized *along their actual life trajectory*.
      *   **Samuelson's Error:** He assumes the ensemble average `E[U(W)]` is the correct object to maximize for the individual's welfare. Peters contends this is a category error. The individual doesn't experience the ensemble average; they experience the time-average growth rate along their single path. Maximizing `E[U(W)]` (especially with linear `U`, like `U(W)=W`) maximizes something fundamentally different from `g`.

  2.  **Non-Ergodicity: The Divergence of Averages:**
      *   In multiplicative dynamics (compounding), the ensemble average of wealth (`E[W_T]`) and the time-average growth rate (`g`) are *not guaranteed to be connected*. Specifically:
          *   `E[W_T]` grows exponentially at a rate determined by the arithmetic mean return (`E[R]`).
          *   `W_T` for an individual grows exponentially at the rate `g`, determined by the geometric mean return (`(∏(1+R_i))^{1/T}`).
      *   **Key Insight:** For multiplicative processes, `g ≤ ln(E[W_T]/W_0)/T`, with equality *only* in the absence of randomness (or under very specific, non-generic conditions). Volatility *reduces* `g` below the rate implied by `E[R]`. This is the mathematical essence of the ergodicity break: the time-average growth rate `g` (what the individual experiences) is strictly less than the exponential growth rate of the ensemble average `E[W_T]` whenever there is risk.
      *   **Consequence for Samuelson:** Maximizing `E[W_T]` (e.g., by maximizing `E[R]` per bet under linear utility) systematically leads to strategies that *reduce* the individual's realized growth rate `g`. This is demonstrably irrational for an individual concerned with their long-term wealth path. The "parallel universes" average is irrelevant to the single-path experience.

  3.  **Kelly as the Necessary Maximand for Time-Average Growth:**
      *   The Kelly criterion (maximize `E[ln(1+f*R)]`) emerges not as an arbitrary utility choice, but as the *mathematical consequence* of needing to maximize the time-average growth rate `g`.
      *   Proof Sketch:
          *   `g = lim_{T->∞} (1/T) * ln(W_T / W_0) = lim_{T->∞} (1/T) * ∑_{t=1}^T ln(1 + f_t * R_t)`
          *   By the law of large numbers (assuming i.i.d. returns), this converges almost surely to `g = E[ln(1 + f * R)]`.
      *   **Therefore:** Maximizing `E[ln(1+f*R)]` is *objectively equivalent* to maximizing the almost-sure long-term growth rate `g` of the individual's wealth trajectory. It's not a *preference* (like choosing vanilla over chocolate ice cream); it's the *only* way to maximize the observable rate at which wealth compounds *along the path the individual actually lives*.

  4.  **Addressing Samuelson's "Single Bet" Objection:**
      *   Samuelson argues Kelly has no special claim for a single bet or finite sequence. Peters counters that the *multiplicative nature* of wealth evolution is inescapable and fundamental, even for a single step:
          *   **One Bet:** `W_1 = W_0 * (1 + f*R)`. The growth factor is `(1 + f*R)`. The *logarithmic* change is `ln(1 + f*R)`. While `E[W_1] = W_0 * (1 + f*E[R])` is maximized by maximizing `f*E[R]` (potentially betting full bankroll), the *expected change in log wealth* `E[ln(W_1/W_0)] = E[ln(1+f*R)]` is maximized by the Kelly fraction. If the agent cares about preserving their wealth for *future* opportunities (even one!), maximizing expected log wealth aligns with the long-term perspective inherent in multiplicative growth.
          *   **Finite Sequence:** The argument scales. For `T` bets, `W_T = W_0 * ∏_{t=1}^T (1 + f_t*R_t)`. The realized growth rate `(1/T) * ln(W_T/W_0) = (1/T) * ∑ ln(1 + f_t*R_t)` converges to `E[ln(1+f*R)]` as `T` increases, but crucially, *even for finite `T`*, the *distribution* of `W_T` (and thus the likelihood of achieving high wealth or ruin) is best controlled by strategies maximizing `E[ln(1+f*R)]`. Maximizing `E[W_T]` often leads to strategies with high ruin probability, disastrously harming the individual's actual path.
      *   **The Irrelevance of "Indefinite Repetitions":** Peters doesn't rely on "infinite time" for justification. He relies on the *mathematical structure* of multiplicative dynamics. The divergence between time-average and ensemble-average growth emerges *because* of this structure. Kelly is optimal *because* it maximizes the growth rate inherent in that structure (`g = E[ln(1+f*R)]`). The convergence of the time-average to the expectation of the log (`g`) is a law-of-large-numbers result confirming the strategy works over time, but the *optimality criterion* (max `g`) is dictated by the multiplicative process itself, not the infinity.

  5.  **Utility is Descriptive, Not Prescriptive (in this context):**
      *   Samuelson treats log utility as one arbitrary choice within EUT. Peters argues that for the specific problem of *growth rate maximization under multiplicative dynamics*, log utility is *not arbitrary*. It falls out as the *necessary functional form* to maximize `g`. Choosing a different utility function (like linear) isn't just a different "taste"; it means maximizing a different quantity (`E[W]`) that is demonstrably *detrimental* to the individual's long-term wealth path (`g`) due to the ergodicity break. Log utility, in this context, isn't about psychological satisfaction; it's the mathematical key to unlocking optimal growth *within the physical reality of compounding*.

  **Conclusion: Why Peters is Right and Samuelson's Dismissal Fails:**

  Samuelson's dismissal rests on interpreting Kelly as merely maximizing one arbitrary utility function (`U(W) = ln(W)`) within the EUT framework. Peters' ergodicity economics demonstrates that this framework *itself* misapplies ensemble averages (`E[U(W)]`) to a problem fundamentally governed by time-average growth (`g`) along a single path. Multiplicative dynamics create a non-ergodic system where `g < ln(E[W_T]/W_0)/T` under volatility. Therefore:

  1.  **Maximizing `E[W_T]` (or linear utility) is systematically irrational:** It maximizes an ensemble average irrelevant to the individual, while strategies achieving this often *destroy* the individual's actual wealth growth rate (`g`) through volatility drag.
  2.  **Maximizing `E[ln(W)]` is objectively rational:** It directly maximizes the time-average growth rate `g`, the quantity the individual actually experiences. This isn't a *preference*; it's the *only* way to achieve the highest possible long-term growth rate within the mathematical constraints of multiplicative wealth processes.
  3.  **The "single bet" objection is invalid:** The multiplicative structure is inherent from step one. Protecting future growth potential starts immediately. Kelly optimizes growth *across all time horizons* within its domain.
  4.  **"Infinity" clarifies, not justifies:** The law of large numbers confirms that maximizing `E[ln(1+f*R)]` maximizes `g` over time. The *reason* to maximize `E[ln(1+f*R)]` is because `g = E[ln(1+f*R)]` is the definition of the growth rate for the process, and maximizing growth is the rational goal.

  Samuelson failed to recognize that the ensemble average `E[W]` is fundamentally disconnected from the individual's experienced growth `g` in multiplicative systems. Peters correctly identifies this ergodicity break and shows that maximizing the expected logarithm of wealth is not an arbitrary utility choice, but the *objectively necessary condition* for maximizing an individual's long-term wealth trajectory under multiplicative dynamics. Samuelson's dismissal fails because it applies a framework (EUT maximizing `E[U(W)]`) that is structurally inappropriate for the problem of long-term growth under compounding.
