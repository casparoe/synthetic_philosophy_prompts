  For the mugging parallel: Pascal’s logic *does* imply that any nonzero probability of infinite loss/gain trumps finite stakes. But his wager has two constraints the mugger lacks: (1) The "infinite" outcome isn’t arbitrary; it’s tied to metaphysical claims about God/eternity. (2) The "must play" framing forces engagement. A mugger can’t credibly claim you’re "forced" into their extortion game. 

  Still, Pascal’s own argument is vulnerable if we accept his premises. If *any* infinity overrides probability, why not worship every conceivable god? That’s the "many-gods" objection he ignores. And that’s exactly where muggers thrive—inventing infinite stakes from thin air. 

