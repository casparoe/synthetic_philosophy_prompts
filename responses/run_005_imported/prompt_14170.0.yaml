  First, I need to recall Hume's key ideas. In Book II, Hume states that reason is the slave of the passions. Reason alone can't motivate action; it only directs passions toward their goals. Actions are driven by passions, and reason's role is instrumental. So, in the hitchhiker case, once rescued, the motorist's passion to survive is satisfied. Paying doesn't serve any current passion, so according to Book II, refusing to pay isn't irrational.

  But Hume also talks about artificial virtues like promise-keeping in Book III. These virtues rely on conventions and general rules for societal benefit. Even if a single act of promise-keeping doesn't benefit the individual, adhering to the rule does. So for the hitchhiker, Hume might argue that maintaining a reputation for keeping promises is crucial, which serves long-term interests. 

  The user is concerned about a tension between Book II and Book III. Does Hume's instrumentalism conflict with his support for general rules? I should explain how these might align. General rules are practical tools to avoid short-sighted decisions. The motorist's disposition to keep promises, cultivated through habit, ensures future cooperation. This disposition aligns with long-term passions, so it's still instrumental.

  The user's deeper need is to resolve whether Hume can consistently address rational irrationality. They might be exploring if Hume's framework can handle contemporary decision theory puzzles. They also need a clear argument for their paper, showing Hume's relevance to modern issues. I should emphasize Hume's emphasis on character and social context, which preempts Parfit's solution. Highlighting how general rules serve instrumental goals bridges Books II and III.
answer: |-
  Here’s a step-by-step analysis of how Hume’s philosophy (drawing solely on the *Treatise*) might engage with Parfit’s hitchhiker, addressing the tension you identified:

  ### 1. **Hume’s Core Instrumentalism (Book II)**
     - **The Will as Passion-Driven**: For Hume, reason alone cannot motivate action (T 2.3.3). The will is governed by passions (desires, aversions). Reason’s role is purely instrumental: it discerns causal relations ("matters of fact") and logical/mathematical truths ("relations of ideas") to guide passions toward their objects.
     - **Applied to the Hitchhiker at the Moment of Payment**:  
       - *Once rescued*, the motorist’s passion for self-preservation is satisfied. Paying serves no *current* passion (no future benefit, no aversion to dishonesty *in this isolated case*).  
       - Refusing to pay aligns with his *present* passions (keeping money). Hume would **not** deem this "irrational" under Book II’s framework. Reason cannot condemn this choice absent a false belief (e.g., "Paying will somehow save me again").

  ### 2. **The Challenge of Forward-Looking Rationality**
     - **The Dilemma**: At *t1* (stranded), the motorist desperately wants rescue. At *t2* (rescued), paying conflicts with his passions. A purely *t2*-reasoning agent cannot secure rescue at *t1*, as the driver anticipates defection.  
     - **Hume’s Resources?** Hume’s Book II lacks tools for binding future selves. Passions are temporally local: "What is now passion is now desire" (T 2.3.4). A disposition to pay at *t2* isn’t a *present* passion at *t1* unless it serves a *current* end.

  ### 3. **Artificial Virtues and General Rules (Book III)**
     - **Promise-Keeping as Artificial Virtue**: Promises aren’t "natural"; they arise from convention to solve coordination problems (T 3.2.5). Their moral force depends on social expectations and systemic utility.  
     - **Role of General Rules**: Hume emphasizes adhering to rules *even when individual violation seems advantageous* (T 3.2.1). Why?  
       - *Epistemic Limits*: We can’t perfectly calculate consequences case-by-case (T 3.2.7).  
       - *Systemic Stability*: Selective compliance erodes trust, harming long-term interests (T 3.2.2).  
       - *Character Formation*: Virtues like fidelity become ingrained dispositions via habit and education (T 3.2.2).

  ### 4. **Resolving the Tension: Instrumentalism Extended**
     Hume *can* reconcile Books II and III without contradiction by framing general rules as *instrumentally rational tools* for satisfying passions over time:  
     - **The Passions Served by Dispositions**:  
       - *At t1 (stranded)*, the motorist’s passion for rescue is overwhelming. To satisfy it, he must induce the driver’s trust.  
       - But the driver knows *t2*-defection is likely. Thus, the motorist must **cultivate a reliable disposition to keep promises** – a character trait that assures cooperation.  
     - **How Dispositions Serve Interests**:  
       - A standing disposition to keep promises (even when costly) avoids the need for recalculating every advantage. It builds *reputation*, enabling future beneficial interactions (T 3.2.5).  
       - *Instrumental Value of "Artificial" Character*: The motorist’s disposition isn’t "irrational" because it serves his *enduring* passions (safety, social belonging, material prosperity) better than momentary maximization.  

  ### 5. **Hume vs. Parfit: Key Distinctions**
     - **No "Rational Irrationality"**: Hume wouldn’t call the *disposition* "irrational" at *t2*. The motorist who pays acts on a *settled passion* (to be just) cultivated because it systematically serves his interests. Refusing to pay *breaks a useful habit* – harming his future self.  
     - **The Social Scaffolding**: Parfit’s case is atomized; Hume’s solution is inherently social. The driver’s trust depends on *shared conventions* of promise-keeping. Isolated agents couldn’t form such dispositions credibly.  
     - **Role of Sympathy**: Hume might add that at *t2*, sympathy with the driver’s expectation (or aversion to being deemed "villainous") could motivate payment (T 3.3.1), linking it to passions *present* at *t2*.

  ### 6. **Where Hume Would Land**
     - **Refusing to pay isn’t "irrational"** in the narrow Book II sense (no false belief).  
     - **But cultivating a disposition to pay *is* instrumentally rational**: It maximizes satisfaction of passions across time and social contexts.  
     - **The Conflict Dissolved**: Book III’s general rules aren’t a *departure* from instrumentalism; they are its *pragmatic implementation*. Without them, agents would chronically undermine their own interests through myopic passion-chasing.  
     - **The Real Folly**: For Hume, the motorist’s error isn’t refusing payment *per se*, but failing to cultivate a character that makes rescue possible. The "rational" agent is the one whose stable dispositions secure long-term passion-satisfaction.

  ### Conclusion for Your Paper
  Hume’s framework **can consistently address the hitchhiker** by showing that "rational irrationality" is a misnomer. The disposition to keep promises is *instrumentally rational* when viewed holistically: it serves enduring passions via social cooperation. This bridges Books II and III: general rules are *derived* from instrumental reasoning about human limitations and systemic effects. Hume’s motorist should (and likely would) pay – not because "reason commands it," but because a person shaped by Humean conventions *feels* a passion for fidelity, knowing this disposition is profoundly useful. The tension arises only if we ignore Hume’s emphasis on character and sociality as essential to passion-satisfaction. His answer to Parfit is that "rationality" encompasses the cultivation of reliable, socially embedded dispositions – a profoundly modern insight buried in 18th-century philosophy.
