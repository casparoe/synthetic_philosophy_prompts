answer: |-
  You've hit on a core tension in dispositional philosophy! The fink/mask distinction *is* crucial, and Lewis's analysis failing for one but not the other reveals deep truths about dispositions. Let's break it down, then tackle Marguerite.

  **Why Finks and Masks are Fundamentally Different:**

  The key difference lies in **what changes, and when, relative to the triggering event:**

  1.  **Finks (Martin's Electro-Fink):**
      *   **Mechanism:** The disposition itself is *removed* or *altered* **at the very moment of the triggering condition.**
      *   **Analogy:** Imagine a bomb wired to explode *only if disarmed*. The *act* of trying to disarm it (trigger) *causes* the bomb to instantly become non-explosive (disposition removed). The triggering condition (disarming attempt) **causes the loss of the disposition** *before* the manifestation (explosion) can occur.
      *   **Effect on the Object:** The object's intrinsic properties *change* at the moment of triggering. The wire *ceases to be live* when touched. The bomb *ceases to be explosive* when disarmed.
      *   **Problem for Simple Conditionals:** "If struck, it breaks" is false for the fragile glass protected by a fink, *not* because it wouldn't break *if* it were fragile when struck, but because the striking *makes it non-fragile* before breaking can happen. The conditional fails because the disposition flees.

  2.  **Masks (Johnston's Antidote):**
      *   **Mechanism:** The disposition **remains intact**, but something **interferes with the manifestation process** *after* triggering.
      *   **Analogy:** A fragile glass wrapped in bubble wrap. Striking the bubble wrap (trigger) *should* lead to breaking (manifestation), but the wrap absorbs the impact. The glass *is* fragile throughout; the disposition *is* triggered; the manifestation is *prevented* by an external barrier.
      *   **Effect on the Object:** The object's intrinsic properties *do not change*. The poison *remains poisonous*; the glass *remains fragile*. The interfering factor (antidote, bubble wrap) acts *on* the manifestation process, not on the disposition itself.
      *   **Problem for Simple Conditionals:** "If struck, it breaks" is false for the masked glass, *not* because it isn't fragile, but because the strike (while triggering the fragility) doesn't *result* in breaking due to the mask. The conditional fails because the manifestation is blocked.

  **Lewis's Reformed Conditional Analysis (RCA) & Why Masks Still Bite:**

  Lewis proposed: **X is disposed to manifest M in response to stimulus S iff X has some intrinsic property B such that, if X were to undergo S and retain B for a sufficient time, S and B would jointly cause M.**

  *   **How RCA "Fixes" Finks:** The RCA requires the intrinsic causal basis (B) to *persist* through the triggering event long enough to cause the manifestation. In the electro-fink case, when touched (S), the fink *removes B* (the live electrical state) instantly. Therefore, the wire *does not retain B* when S occurs. The RCA correctly says the wire *lacks* the disposition to shock when touched *because* it lacks the persistent intrinsic basis B under S. The fink changes B *during* S, violating the "retain B" clause.

  *   **Why Masks Defeat RCA:** The mask *does not* affect the intrinsic basis B. The fragile glass *has* B (its molecular structure). The strike (S) occurs. B *persists* throughout. S and B *do* jointly cause the *disposition's activation* – the glass *strains* to break, the fragility *is triggered*. However, the mask (bubble wrap) *intervenes between the triggering/strain and the final manifestation*. The conditional "if S and B persist, then S and B cause M" is false because, despite S and B persisting and being causally active, M (breaking) does *not* occur due to the external interference. The intrinsic basis is there, it's triggered, but the manifestation is sabotaged *downstream*.

  **The Philosophical Payoff: What This Tells Us About Dispositions**

  1.  **Intrinsic Basis is Necessary but Not Sufficient:** Lewis was right that a disposition requires a *persistent intrinsic property* (B). Finks show that without B persisting *through* the stimulus, you don't have the disposition. **But masks show that having B isn't enough.** The world must also be "cooperative" enough for the B + S causal process to *reach* M without fatal interference.
  2.  **Dispositions are Potentials, Not Guarantees:** A disposition is a *tendency* or *potential* to manifest M given S, grounded in an intrinsic property. Masks highlight that realizing that potential depends on the *absence of defeating conditions* in the environment or causal chain. A fragile glass *can* break if struck, but it *might not* if something prevents it.
  3.  **The Manifestation is Part of the Disposition:** The mask problem forces us to consider that the disposition isn't *just* the basis B, nor *just* the counterfactual link to M. It's the *entire causal process* from S (via B) to M being *inherently possible* for the object. Masks break that chain externally.

  **Applying this to Marguerite and Courage (The Earned Reveal):**

  This framework is *perfect* for your novel. Courage *is* a disposition (a character trait). The central question is: Does Marguerite have the intrinsic basis (B) for courage, even if it's never manifested (M) due to lack of genuine tests (S) or masks?

  *   **The "Finkish Coward" Fear:** You worry readers might think Marguerite *lacks* B (the intrinsic basis for courage) entirely. Her talk of courage and others' belief might be mistaken. If a real test (S) came, she might instantly "fink" – panic, freeze, run away (lose the putative B instantly upon facing S), proving she never had courage at all. This would feel like a cheat if asserted at the end.
  *   **The "Masked Courage" Possibility:** The alternative is that Marguerite *does* possess B (the intrinsic psychological basis for courage – e.g., a certain resilience, value system, temperament), but circumstances (luck, avoidance, external interventions – the masks) have *prevented* this basis from ever being genuinely triggered (no real S) or have *blocked* the manifestation (M) even when triggered slightly.

  **How to Make "Masked Courage" Feel Earned (Avoiding Cheating):**

  1.  **Show the Intrinsic Basis (B) Subtly:** Even without life-or-death tests, show glimpses of the *kind* of psychological stuff courage is made of in lower-stakes situations:
      *   **Small Acts of Defiance:** Standing up to a minor bully, expressing an unpopular but harmless opinion.
      *   **Enduring Minor Hardships:** Showing resilience in the face of disappointment, frustration, or small physical discomforts *without* collapsing or lashing out unfairly.
      *   **Moral Compass:** Demonstrating consistent (even if quiet) adherence to principles, empathy, or a sense of justice in everyday choices, even when inconvenient.
      *   **Internal Struggle:** Show her *wanting* to act bravely in small ways, feeling fear but pushing through it on a small scale, or feeling guilt/regret when she *does* avoid a minor challenge. This shows B is active.
      *   **Preparation/Attitude:** Does she train, study, or mentally prepare for potential challenges (even if they never come)? Does she *think* about courage in insightful ways?
  2.  **Show the Masks Explicitly:** Don't just have luck save her. Make it clear *how* circumstances mask her potential courage:
      *   **Deus Ex Machina Avoidance:** Instead of random luck, show specific mechanisms – a friend *always* steps in just before she has to act, an authority figure intervenes, the threat evaporates for a plausible but external reason *before* her decisive action is required.
      *   **Near Misses & Aborted Triggers:** Put her in situations that *almost* become real tests, where the reader (and maybe Marguerite) feels the fear and sees her *start* to react (hinting at B), but the situation is defused *externally* before the critical moment. Show her relief mixed with frustration or doubt.
      *   **Self-Masking (Flaw):** Does she *actively* (though perhaps unconsciously) avoid tests? Does she rationalize her avoidance? This shows the *presence* of fear (which courage requires!) and the *struggle*, reinforcing she has something *to* mask. It makes the eventual overcoming powerful.
  3.  **The Revealing Test:** When the *real* test (S) finally comes:
      *   **Remove the Masks:** Ensure the circumstances that previously masked her courage are *gone*. No one can save her; luck has run out; avoidance is impossible.
      *   **Show the Causal Chain:** Connect her action *directly* to the intrinsic basis (B) you've hinted at. Her courage should feel like an amplification of the small defiances, the resilience, the principles, and the internal struggles you've shown before. It shouldn't be a completely new personality.
      *   **Show the Fear:** True courage requires fear. Show her terrified! The manifestation (M) isn't fearlessness; it's acting *despite* the fear, driven by B (her values, resilience, etc.).
      *   **Make it Costly:** Courage often has a price. A sacrifice or consequence makes it feel real and proves the disposition was activated and manifested against resistance.

  **Conclusion:**

  The fink/mask distinction matters because finks attack the *existence* of the intrinsic basis at the moment of test, while masks attack the *realization* of the manifestation even when the basis is present and triggered. Lewis's RCA solves finks by demanding persistence of the basis through the trigger, but fails against masks because masks disrupt the causal chain *after* triggering without destroying the basis.

  For Marguerite, your goal is to convince the reader she possesses the *intrinsic basis* (B) for courage *throughout the story*, even though masks (external luck, avoidance, interventions) prevent its full manifestation. By strategically showing B in small ways, explicitly demonstrating the masking mechanisms, and ensuring her final act of courage flows logically from the established B when the masks are stripped away, you make the reveal feel earned. She wasn't "brave all along" in the sense of manifested heroics; she was *disposed* to be brave all along, and finally, the world forced that disposition to reveal itself. That's the satisfying payoff. Good luck with the final third!
