prompt: |-
  I'm a software engineer and co-founder at a small startup that's negotiating a revenue-sharing deal with a much larger partner company. They've proposed that both sides fully disclose our internal cost structures and growth forecasts so we can jointly calculate the "fair" split. My gut says this is risky: if they know our numbers precisely and we can't verify theirs, they could easily lowball us once our hand is shown. At the same time, walking away from the partnership entirely seems clearly worse for both companies than making some deal. Is there a principled way to structure a negotiation like this so that both sides are guaranteed to end up better off than not partnering at all, without either party having to trust or even fully disclose the other's private information? I'd like to understand the underlying logic here, not just get generic negotiation tips.
reasoning: |-
  Okay, the user is a software engineer and co-founder at a startup negotiating a revenue-sharing deal with a larger partner. The big company wants full disclosure of costs and growth forecasts to calculate a "fair" split. The user's worried this could lead to them being lowballed since they can't verify the partner's numbers. They don't want to walk away but need a principled way to structure the deal without full disclosure.

  First, I need to understand the core issue: information asymmetry. The startup has less power and can't trust the big partner's disclosures. The user wants a mechanism that ensures mutual benefit without revealing private info. They mentioned "principled way," so game theory or economic frameworks might be relevant.

  I recall mechanisms like Nash bargaining or Shapley value, but those require full info. Maybe an incentive-compatible mechanism? Something where truth-telling is the best strategy. The VCG auction comes to mind, but that's for auctions. Alternatively, a revelation principle application? But that might be too complex.

  Another angle: correlated signals. Like both parties submit data to a trusted third party who computes the split. But the user might not have that. Or perhaps using predefined formulas based on observable metrics. For example, tying revenue shares to actual revenue milestones or growth metrics that are verifiable. That way, the split adjusts based on outcomes, not forecasts.

  The user also needs a guarantee that both parties are better off—Pareto efficiency. The deal should be in the core, meaning no one has an incentive to deviate. Maybe a tiered revenue share where the startup gets a higher share initially to cover costs, then it adjusts. But how to structure that without revealing costs?

  Ah, the concept of a menu of contracts. The partner offers different options, and the startup picks based on their private info. The options are designed so that each type picks the one meant for them. But would the partner play fair? They might design exploitative options. That's risky.

  Perhaps a commitment to a formula based on observable outcomes. Like the split depends on the revenue generated, with thresholds. If the startup's costs are high, they need a higher share, but they can't reveal that. Instead, they could negotiate caps on their contributions or minimum revenue guarantees. 

  Also, the BATNA is important. The user's alternative is no deal, which is worse. So any agreement must exceed that. The partner's BATNA might be stronger, so the startup needs leverage. Maybe emphasizing unique tech or market access they provide.

  I should also consider repeated interactions. Reputation matters. If the partner lowballs, it hurts future deals. But the startup might not have that leverage. 

  In conclusion, the best approach might be a phased agreement with verifiable metrics, escrow of forecasts, and adjustable shares based on performance. That way, disclosure happens gradually, tied to actual results, reducing risk. The key is shifting from static disclosure to dynamic, outcome-based adjustments.
answer: |-
  This is a sophisticated dilemma at the intersection of game theory, mechanism design, and negotiation strategy. Your instinct about the risks of asymmetric disclosure is correct. Here's a principled approach based on economic theory and robust mechanism design, ensuring mutual benefit without requiring full trust or disclosure:

  **Core Principles & Underlying Logic:**
  1.  **The Fundamental Problem:** The partner's proposal creates an *information asymmetry* disadvantage for you. Knowing your costs/forecasts gives them power to extract surplus value. Verifying their data is likely impossible.
  2.  **Goal:** Achieve a *Pareto-improving* outcome (both parties better off than no deal) within the *core* (no subset of players can do better by themselves), while respecting *incentive compatibility* (truth-telling is optimal) and *individual rationality* (participation is beneficial).
  3.  **Key Insight:** You don't need *absolute truth* to agree on a *fair split*; you need a *mechanism* that aligns incentives and bases the split on *verifiable outcomes* or *mutually observable signals*.

  **Structured Negotiation Framework:**

  1.  **Reframe the "Fairness" Metric:**
      *   **Reject Cost-Based "Fairness":** Argue that "fairness" should be based on *value contribution* and *risk*, not internal costs (which reflect efficiency, not value). Your startup likely brings unique IP, agility, or innovation; the partner brings scale, distribution, and customers. These are asymmetric contributions.
      *   **Propose "Value-Based" or "Risk-Adjusted" Splits:** Focus on metrics like:
          *   **Incremental Revenue Attribution:** What revenue *would not exist* without each party? (Hard to measure precisely, but directional).
          *   **Relative Investment:** Not internal costs, but *new, joint-venture specific investments* (e.g., dedicated engineering time, marketing spend).
          *   **Risk Allocation:** Startups bear higher existential risk; partners bear lower marginal risk. Your share should compensate for this differential.

  2.  **Implement a Revelation Mechanism (Minimizing Disclosure Risk):**
      *   **The Problem:** How to elicit *some* truthful information without giving everything away?
      *   **The Solution (Menu of Contracts / Screening):**
          *   **Propose Multiple Revenue Share Structures:** Offer the partner *2-3 different revenue share options*, each with different splits and potentially different levels of commitment or service from *both* sides. Crucially, design these so that the *partner's optimal choice reveals something about their expectations* without you revealing your full hand first.
          *   **Example Options:**
              *   **Option A (High Partner Share):** Partner gets 70%, Startup 30%. *Partner provides minimal integration support, standard marketing.*
              *   **Option B (Balanced):** Partner 55%, Startup 45%. *Partner provides dedicated technical integration resources & co-marketing budget $X.*
              *   **Option C (High Startup Share):** Partner 40%, Startup 60%. *Partner provides premium placement in their marketplace, dedicated sales team allocation, co-marketing budget $2X.*
          *   **The Logic:** A partner genuinely expecting massive volume from their distribution might readily choose Option C (accepting a lower % because the absolute $ is high). A partner with lower confidence might choose A or B. Their choice signals their forecast *implicitly* without you disclosing yours first. You design the options so each is profitable for you under different volume scenarios, protecting your downside.

  3.  **Utilize Verifiable Performance Metrics & Tiered Structures:**
      *   **Link the Split to Observable Outcomes:** Define revenue tiers with escalating splits based on *actual, jointly verifiable revenue* generated through the partnership. This eliminates reliance on unverifiable forecasts.
      *   **Example Structure:**
          *   Revenue $0-$500k: Partner 60% / Startup 40% (Covers your baseline costs)
          *   Revenue $500k-$2M: Partner 55% / Startup 45%
          *   Revenue $2M+: Partner 50% / Startup 50%
      *   **The Logic:** This automatically adjusts for the *actual realized value*. If the partner drives massive volume, they get rewarded with a larger share of the *marginal* revenue (though the % might decrease, the absolute $ increases). It protects you if volumes are low. It's *incentive compatible* – both parties want to maximize revenue.

  4.  **Incorporate Asymmetric Information Safeguards:**
      *   **Escrowed Forecasts (Optional):** If forecasts *must* be shared for initial modeling, propose using a mutually trusted third-party (law firm, auditor) to hold *both* forecasts in escrow. The model runs, the split is calculated, but the *underlying raw data is only revealed IF a predefined, significant discrepancy arises between forecasted and actual revenue within a set period (e.g., Year 1)*. This discourages wild misrepresentation.
      *   **Minimum Revenue Guarantees (MRGs):** Negotiate a partner commitment to minimum revenue payments in the first 12-18 months. This forces them to put "skin in the game" based on *their* forecast and compensates you for integration costs and opportunity cost, regardless of outcome. It directly addresses your fear of lowballing after disclosure.
      *   **Sunset Clauses on Cost Disclosure:** If cost structures *must* be shared, insist this data is only used for the *initial* model and becomes obsolete after a short period (e.g., 6 months), replaced by the tiered performance model. Prohibit its use in future negotiations or competing products.

  5.  **Focus on the BATNA & Zone of Possible Agreement (ZOPA):**
      *   **Quantify Your BATNA:** Know precisely what your startup loses by *not* doing the deal (e.g., slower growth rate, higher customer acquisition cost). This defines your walk-away point.
      *   **Estimate Their BATNA:** What do they lose? Access to your tech? Faster time-to-market vs. building internally? Competitive positioning? Understanding this gives you leverage.
      *   **Define the ZOPA:** The overlap between the minimum split you'll accept (above your BATNA) and the maximum split they'll offer (above their BATNA). Any deal within this zone is Pareto-improving. Your goal is to anchor towards the top of this zone using the mechanisms above, *without* revealing your bottom line.

  **Why this approach works (The Underlying Game Theory):**

  1.  **Incentive Compatibility (Truth-Telling Encouraged):** The tiered structure and menu of options make it optimal for each party to act (or choose) in a way that indirectly reveals or aligns with their true expectations/costs, as misrepresentation doesn't systematically benefit them. E.g., understating forecast to get a better split in the menu backfires if actual revenue is high and they chose a low-revenue-share option.
  2.  **Individual Rationality (Better than BATNA):** By design, the MRG protects your downside (covers costs). The tiered structure ensures you get a larger share if volumes are low (protecting your BATNA) and still benefit from high volumes. The partner only enters if they believe the deal exceeds their BATNA.
  3.  **Ex-Post Efficiency (Based on Reality):** The reliance on *actual, verifiable revenue* ensures the final split reflects the *realized* value of the partnership, not speculative forecasts or potentially gamed cost structures.
  4.  **Risk Mitigation:** MRGs transfer some volume risk to the partner. Tiered splits automatically adjust risk/reward based on performance. Escrowed forecasts reduce (but don't eliminate) misrepresentation risk.
  5.  **Reduced Information Vulnerability:** You disclose *choices* (which option they pick) or *outcomes* (actual revenue), not your core sensitive cost structure or detailed long-term forecasts. The menu reveals *their* confidence level indirectly.

  **Negotiation Strategy Application:**

  *   **Lead with Principles:** Frame your counter-proposal around "aligning incentives," "sharing risk appropriately," "rewarding performance," and "building a partnership based on verifiable outcomes, not internal accounting."
  *   **Present the Package:** Introduce the concepts together: "We propose a structure with a *tiered revenue share* based on actual performance to ensure fairness as the partnership scales, potentially coupled with a *menu of initial commitment options* for you to choose based on your confidence level, and we're open to discussing a *minimum revenue guarantee* to demonstrate mutual commitment and cover our initial integration costs."
  *   **Be Prepared to Compose:** You might not get all elements. Prioritize the **tiered split based on verifiable revenue** and **some form of downside protection** (MRG or a very favorable initial split tier). The menu and escrow are strong enhancements but can be negotiated.
  *   **Anchor High:** Start your tiered splits more favorably to yourself than your true minimum (e.g., propose 50/50 for the first tier instead of 60/40). Anchor the MRG at a meaningful level.
  *   **Focus on Value Creation:** Continually emphasize how the partnership creates *new* revenue that wouldn't exist otherwise, and how your proposed structure maximizes the chances of capturing that value for both parties.

  By shifting the negotiation from "disclose everything and trust us" to a structured mechanism based on verifiable performance, aligned incentives, and risk sharing, you create a much stronger, more defensible position for your startup. This approach doesn't eliminate all risk, but it systematically reduces the most dangerous vulnerabilities inherent in the partner's initial request.
