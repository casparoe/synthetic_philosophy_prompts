prompt: |-
  I'm a PhD student in philosophy of language currently drafting a seminar paper on theories of vagueness, and I've run into a point that my advisor says reflects a real confusion on my part, though I haven't yet managed to see exactly where I've gone wrong. In the secondary literature, epistemicism (associated above all with Timothy Williamson) and supervaluationism are routinely presented as the two leading approaches that preserve classical logic in the face of the Sorites paradox, in contrast to more revisionary options such as degree theories or paraconsistent treatments of vague predicates. Authors working in the supervaluationist tradition that follows Kit Fine's precisificational semantics are especially emphatic on this point: every instance of excluded middle, "Fa ∨ ¬Fa," comes out true ("supertrue") even when a is a borderline case of F, and every classically valid argument form remains valid under the supervaluationist consequence relation.

  Given how much weight this classical-logic-preservation point is made to bear, it seems to me that supervaluationism and epistemicism collapse into the very same theory under two different descriptions: both leave classical logic fully intact, so the only thing left for them to disagree about is purely terminological — whether to call the sharp cutoff in a vague predicate's extension "indeterminate" (the supervaluationist's preferred term) or "unknown" (the epistemicist's). When I put this to my advisor, she agreed that students often conflate the two views for exactly this reason, but insisted that they disagree about something substantive rather than merely verbal, without telling me what that something is. Could you help me see precisely where my equivalence claim breaks down: which classical principle, if any, does supervaluationism actually give up, and why doesn't that concession show up as a failure of any of the classically valid schemata for which the view is usually praised?
reasoning: |-
  Okay, the user is a PhD student in philosophy of language working on vagueness theories. They're confused about why epistemicism and supervaluationism are considered distinct when both preserve classical logic. Their advisor says they're conflating the two, but the student doesn't see the substantive difference. Let me unpack this.

  First, I need to recall the core claims of both theories. Epistemicism, per Williamson, says vague predicates have sharp cutoffs, but we can't know where they are. Supervaluationism, following Fine, uses precisifications where borderline cases can be true in some, false in others. Both endorse excluded middle and maintain classical logic. So why aren't they the same?

  The user's key mistake is equating logic preservation with theoretical equivalence. But logic is just one component. The divergence lies in truth conditions and semantic apparatus. Epistemicism has a single, unknowable extension. Supervaluationism has multiple precisifications and supertruth as truth in all precisifications.

  Ah, the crucial point is the treatment of conjunction and disjunction. Supervaluationism preserves classical tautologies but sacrifices truth-functionality at the sub-supertruth level. For instance, a disjunction can be supertrue without either disjunct being supertrue. That's why "Fa ∨ ¬Fa" is supertrue for borderlines, but neither "Fa" nor "¬Fa" is. Epistemicism, however, insists one disjunct is true (we just don't know which).

  Also, supervaluationism introduces a new operator for indeterminacy: it's indeterminate if true in some precisifications and false in others. This isn't just terminological—it's a substantive addition to the logic. Epistemicism rejects such indeterminacy, calling it mere ignorance.

  The user might not realize that supervaluationism's semantics require a metalanguage with higher-order indeterminacy. Each precisification might have its own borderline cases. Epistemicism avoids this by sticking to bivalence, even if unknowable.

  The advisor's point about substantive disagreement makes sense. It's about the nature of vagueness: is it semantic indecision (supervaluationism) or epistemic limitation (epistemicism)? That's metaphysical, not just linguistic. The user's conflation misses how each theory's machinery addresses the Sorites differently. Supervaluationism blocks the paradox by denying that all instances of the tolerance principle are supertrue, while epistemicism questions our knowledge of where the cutoff lies.

  So the breakdown is in the underlying semantics and truth conditions, not the surface logic. The user needs to see that preserving classical logic doesn't mean the theories are identical; their explanations and additional apparatus differ significantly. Highlighting the truth-functionality point and the indeterminacy operator should clarify the distinction.
answer: |-
  You've hit upon a genuinely subtle and frequently misunderstood point in the vagueness literature. Your confusion is understandable, as both theories preserve classical logic *at the level of theorems and consequence*, leading to the *appearance* of equivalence. However, your advisor is correct: the disagreement is substantive, not merely terminological. The core divergence lies in **truth conditions, the nature of semantic indeterminacy, and the underlying semantic machinery**, not in the preservation of classical tautologies like excluded middle.

  Here's a breakdown of the key differences and why your equivalence claim breaks down:

  1.  **The Nature of Truth & Truth Conditions:**
      *   **Epistemicism:** Adheres to **bivalence** and **truth-value definiteness**. For any object `a` and predicate `F`, `Fa` is determinately either true or false *simpliciter*, even for borderline cases. We just don't *know* which truth-value it has. The sharp cutoff exists in the actual, single, precise (but unknowable) extension of `F`. Truth is absolute and independent of our knowledge or ways of making things precise.
      *   **Supervaluationism:** Rejects bivalence *at the level of precisification*. For a borderline case `a`, `Fa` is **neither true nor false *relative to the vague language itself***. Instead, truth (*supertruth*) is defined as **truth on all admissible precisifications**. `Fa ∨ ¬Fa` is supertrue because *every* precisification makes one disjunct true. However, *neither* `Fa` *nor* `¬Fa` is supertrue for a borderline `a` (since some precisifications make `Fa` true, others make `¬Fa` true). Truth (supertruth) is defined via quantification over precisifications.

  2.  **The Source and Nature of Indeterminacy:**
      *   **Epistemicism:** Indeterminacy is purely **epistemic** – it's solely a matter of our *ignorance* of the precise, sharp boundaries fixed by meaning, use, and the world. There is no semantic indecision; the meaning *does* determine a sharp boundary, but we cannot know where it is.
      *   **Supervaluationism:** Indeterminacy is **semantic** or **ontic** (depending on the flavor) – it arises from **semantic indecision**. The meaning of the vague predicate `F` doesn't pick out a single, precise extension; it picks out a *range* of admissible precisifications. The "indeterminacy" reflects this genuine lack of a unique, definite extension in the actual semantics of the language. It's not (just) that *we* don't know; it's that the *language itself* doesn't specify a single answer.

  3.  **The Semantic Machinery & Truth-Functionality:**
      *   **Epistemicism:** Uses a standard classical semantics with a single, precise (but unknown) model. All classical connectives are **truth-functional** in the usual way. `A ∨ B` is true iff `A` is true or `B` is true (in the single actual model).
      *   **Supervaluationism:** Employs a non-standard semantics based on multiple precisifications. While it preserves classical *tautologies* and *consequence*, it **sacrifices truth-functionality** at the sub-supertruth level. Crucially:
          *   `A ∨ B` can be **supertrue** (true on all precisifications) *without either `A` or `B` being supertrue*. (This happens precisely in borderline cases: `Fa ∨ ¬Fa` is supertrue, but neither `Fa` nor `¬Fa` is supertrue).
          *   `A ∧ B` can be **superfalse** (false on all precisifications) *without either `A` or `B` being superfalse*.
      *   This failure of truth-functionality for the standard connectives *within the space of precisifications* is a profound departure from the classical conception of how connectives operate, even though it doesn't invalidate any classical theorems. Classical logic is preserved because supertruth is defined as preservation of *truth* (not falsity!) across *all* precisifications, mimicking a single model.

  4.  **The Indeterminacy Operator (∆) and Its Logic:** Supervaluationism naturally defines a **determinately** or **indeterminacy** operator:
      *   `∆A` = `A` is supertrue (true on all admissible precisifications).
      *   `I A` = `A` is neither supertrue nor superfalse (i.e., true on some precisifications, false on others).
      *   The logic of `∆` is **non-classical** (specifically, it behaves like the modal logic **S5**). Crucially:
          *   `∆(A ∨ B)` does **not** imply `∆A ∨ ∆B`. (Borderline `a`: `∆(Fa ∨ ¬Fa)` is true, but `∆Fa ∨ ∆¬Fa` is false).
          *   The **Law of Bivalence** (`A ∨ ¬A`) holds for supertruth, but the **Law of Excluded Middle stated with determinacy** (`∆A ∨ ∆¬A`) **fails** for borderline cases. This is a *classical principle about definiteness* that supervaluationism explicitly rejects, while epistemicism affirms it (though unknowably).
      *   Epistemicism rejects the need for or coherence of such an operator. For the epistemicist, `Fa` is always either determinately true or determinately false; there is no third status captured by `I Fa`.

  5.  **The Sorites Solution Mechanism:**
      *   **Epistemicism:** Blocks the Sorites by denying the major premise ("There is no sharp cutoff"). There *is* a sharp cutoff; we just can't know where it is. The tolerance principle ("One grain doesn't make a heap") is *false* (because a single grain *can* make the difference between heap and non-heap), even though we cannot identify the specific point where it fails.
      *   **Supervaluationism:** Blocks the Sorites by denying that the tolerance principle is *supertrue*. While it's true on *each individual precisification* that one grain doesn't make a difference *within that precisification*, the *point* where the cutoff occurs *varies* across precisifications. There is no *single* grain where *all* precisifications switch from "heap" to "not heap". Thus, the *universal generalization* "For any n, if n grains make a heap, then n-1 grains make a heap" is **not supertrue** (it's false on every precisification!). The paradox is resolved by showing the crucial premise isn't *definitely* true, even though it's true on every way of making things precise.

  **Why the Classical Schemata are Preserved (and Why That Doesn't Imply Equivalence):**

  Supervaluationism preserves classical theorems and consequence because:

  1.  **Definition of Supertruth:** `A` is supertrue iff true on *all* precisifications. `¬A` is supertrue iff false on *all* precisifications.
  2.  **Classical Logic per Precisification:** Each precisification is a classical model. So, any formula that is classically valid (true in *all* classical models) will be true in *every* precisification, hence supertrue.
  3.  **Supervaluational Consequence:** `B` is a supervaluational consequence of premises `A1...An` iff whenever `A1...An` are all supertrue (true on all precisifications), `B` is also supertrue. If an argument is classically valid, then in *any* precisification where the premises are true, the conclusion is true. So, if the premises are true in *all* precisifications (supertrue), the conclusion must also be true in *all* precisifications (supertrue).

  **The Crucial Point You're Missing: The "Classical Principle" Sacrificed Isn't a Schema, It's Truth-Functionality & Bivalence at the Precisificational Level**

  Supervaluationism does **not** give up any instance of a classically valid *schema* like `A ∨ ¬A`. Every instance *is* supertrue. **What it gives up is:**

  1.  **Truth-functionality of connectives:** The truth-value (supertruth-value) of a compound sentence is not *always* a function of the supertruth-values of its components (as shown by `Fa ∨ ¬Fa` where `Fa` is borderline).
  2.  **Bivalence at the Level of Precisifications:** For borderline `a`, `Fa` is neither true *nor* false relative to the vague language/set of precisifications. It's **indeterminate**. (Epistemicism maintains bivalence: it *is* either true or false, period).
  3.  **The Principle that `A ∨ B` being true requires `A` true or `B` true:** `Fa ∨ ¬Fa` is supertrue without `Fa` being supertrue or `¬Fa` being supertrue. (Epistemicism maintains this principle: if `Fa ∨ ¬Fa` is true, then `Fa` is true or `¬Fa` is true, one of them *is* true *simpliciter*).

  **Conclusion:**

  The disagreement is **not** merely whether to call the cutoff "indeterminate" or "unknown." It's a disagreement about:

  *   **The nature of truth and meaning:** Is there a single, sharp, unknowable extension (Epistemicism), or is the meaning inherently underdetermined, specifying only a range of precisifications (Supervaluationism)?
  *   **The existence of semantic indeterminacy:** Is vagueness solely a matter of ignorance (Epistemicism), or does it involve a genuine lack of definite truth-value at the semantic level (Supervaluationism)?
  *   **The logic of definiteness:** Supervaluationism introduces a non-classical operator `∆` with its own distinct logic (e.g., `∆(A ∨ B)` does not imply `∆A ∨ ∆B`), which epistemicism rejects as unnecessary or incoherent.
  *   **The mechanism for blocking the Sorites:** Denial of the *truth* of the tolerance principle (Epistemicism) vs. denial of its *supertruth* (Supervaluationism).

  While both theories validate the same set of classical theorems (`A ∨ ¬A` is always true/supertrue), their **semantic explanations** of *why* this holds and their **treatment of atomic sentences and connectives for borderline cases** are fundamentally different and incompatible. The preservation of classical logic is a significant *feature* they share in contrast to degree theories, etc., but it masks deep underlying metaphysical and semantic disagreements about the very nature of vagueness. Your advisor is pointing you towards these foundational differences in truth conditions and semantic apparatus.
