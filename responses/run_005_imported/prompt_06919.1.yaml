  I should emphasize how Neurath saw Isotype as inherently political. For him, standardized pictograms weren't just efficient—they were weapons against misinformation that exploited linguistic ambiguity. The Vienna Circle's obsession with verificationism matters here too: Isotype's repeatable icons allowed literal "counting" of facts, unlike today's resized emojis that distort proportions. 

