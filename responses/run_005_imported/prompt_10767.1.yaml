  The key is to map the metaphysical framework onto money. Money as a "ticket" parallels how physical objects are ideas. Just as objects derive existence from perception, money's value comes from collective agreement and trust. The "ticket" is a sign that points to labor/goods, similar to how sensory ideas signify God's consistent ordering. Trust in money mirrors the trust in the regularity of nature, both underpinned by divine order.

  Power to command labor is tricky. In Berkeley's metaphysics, power resides in spirits (minds). But economic power is social, collective. Need to show how this social power still relies on divine support. Berkeley might see societal trust as divinely orchestrated, so God sustains both natural and economic order.

