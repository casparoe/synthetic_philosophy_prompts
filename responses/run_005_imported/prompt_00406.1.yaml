  Okay, the user is a PhD student in economics working on their dissertation chapter about social welfare functions in integrated assessment models, specifically related to climate policy like the DICE model. Their advisor is pushing them to consider population axiology, particularly Parfit's repugnant conclusion and Arrhenius's impossibility theorems. The student has been reading about various approaches like critical-level utilitarianism and variable-value views but is struggling to translate these philosophical concepts into practical modeling advice.

  The user's main request is to understand the implications of the repugnant conclusion and impossibility results for choosing a social welfare function in quantitative models. They want practical advice for economists and policymakers on handling trade-offs between population size and average well-being in climate and population policy. They're not looking for a literature survey but rather actionable insights—whether to sidestep the impossibility results or explicitly choose which counterintuitive conclusion to accept.

  First, I need to recall the core issues. The repugnant conclusion suggests that a large population with lives barely worth living could be better than a smaller, happier population. Arrhenius's theorems show that no population axiology can satisfy all intuitive principles without leading to contradictions. For IAMs, this is crucial because these models evaluate policies affecting future populations, including their size and well-being.

  The user's advisor is right to highlight this. Traditional models like DICE use discounted utilitarianism, which sums utilities and discounts future welfare. But this approach can implicitly endorse the repugnant conclusion. For example, policies that increase population but decrease average welfare might be favored if total utility increases. That's problematic for climate policy where interventions might affect both population size and quality of life.

  The student needs concrete steps for their model. I should outline defensible approaches. Critical-level utilitarianism adds a threshold: lives above the critical level add positive value, below add negative. This avoids the repugnant conclusion but introduces the sadistic conclusion—adding worse-off lives might be preferred if they're above the critical level. The challenge is setting the critical level; is it zero utility or higher? A positive level might be more defensible but requires justification.

  Variable-value theories might be better. They assign diminishing marginal value to additional people. This avoids both repugnant and sadistic conclusions but violates some principles like mere addition. However, for practical purposes, this could be acceptable. The key is parameterizing the function to reflect ethical priorities.

  Another option is to use person-affecting views, which only consider existing people. But this ignores future individuals, which is problematic for climate policy affecting future generations. Alternatively, average utilitarianism avoids the repugnant conclusion but has its own issues, like preferring smaller populations even if larger ones are happier.

  The student should consider being explicit about their choice. Acknowledge the impossibility results and state which bullet they're biting. For example, choosing critical-level utilitarianism and accepting the sadistic conclusion as a lesser evil. Then, test sensitivity to different critical levels in their model. Show how different ethical choices affect policy recommendations.

  Practical steps: Use a modified social welfare function, perhaps a hybrid approach. Implement a critical level in DICE-like models. Run scenarios with different critical levels (e.g., zero, 0.5, 1 times baseline utility) and see how optimal climate policies change. This sensitivity analysis can highlight the ethical stakes.

  Also, communicate the assumptions clearly. Policymakers need to understand that model outputs depend on ethical choices. Frame the discussion: Are we prioritizing total welfare, average welfare, or something else? The student's dissertation can contribute by showing how these ethical decisions impact cost-benefit analyses in climate policy.

  In summary, the user needs to balance philosophical rigor with practical modeling. They can't avoid the impossibility theorems but can make informed, transparent choices. Their work should demonstrate the consequences of different axiologies on policy outcomes, helping economists and policymakers navigate these ethical dilemmas.
answer: |-
  Your advisor is right to push you on this—the population axiology embedded in IAMs is a silent driver of policy conclusions with profound real-world implications. The impossibility theorems (Arrhenius) and the repugnant conclusion (Parfit) aren't just philosophical curiosities; they reveal that **any social welfare function (SWF) for variable populations forces you to violate at least one deeply plausible ethical intuition**. For applied modeling, this means you *must* make a conscious, justified choice about which bullet to bite, as there is no universally satisfying escape hatch. Here’s a breakdown of practical implications and modeling strategies:

  ### Core Implications for IAMs & Policy Tradeoffs
  1.  **Discounted Utilitarianism (D-IAMs like DICE/RICE) is Repugnant-Prone:**
      *   **Problem:** Discounted utilitarianism (sum of discounted per-capita utilities multiplied by population) inherently prioritizes *total* welfare. This directly implies the repugnant conclusion: a massive future population with lives barely worth living (but net positive) can dominate a smaller, happier population in terms of total discounted welfare, especially with low discount rates.
      *   **Policy Impact:** Policies slightly reducing mortality (increasing population) might be favored *even if they significantly reduce average welfare* (e.g., via slower consumption growth or higher climate damages), simply because the total sum increases. Climate policies focused solely on maximizing total output/consumption could implicitly endorse this.

  2.  **The "Silent" Sadistic Conclusion:**
      *   **Problem:** Some alternatives to Total Utilitarianism (like Critical-Level Utilitarianism with a positive critical level) avoid the repugnant conclusion but risk the *sadistic conclusion*: adding a group of people with *negative* welfare (net suffering) can be seen as *better* than adding a group with *positive* welfare (but below the critical level), if the negative group avoids dragging down the average relative to the critical level in a specific way.
      *   **Policy Impact:** In extreme scenarios (e.g., catastrophic climate outcomes creating large populations in misery), models might undervalue policies preventing such outcomes if the SWF doesn't sufficiently penalize the creation of negative welfare lives.

  3.  **Mere Addition Paradox & Non-Identity Problem:**
      *   **Problem:** The Mere Addition Principle (adding happy people without affecting others is neutral or good) seems intuitive but leads to contradictions (like the repugnant conclusion) when combined with other principles. The Non-Identity Problem (future people's existence depends on our choices, making it hard to say a policy *harms* them) complicates intergenerational justice arguments in IAMs.
      *   **Policy Impact:** Evaluating policies affecting *who* exists (e.g., fertility policies, very long-term climate impacts) becomes ethically fraught. Standard cost-benefit analysis struggles. An SWF that violates mere addition might judge creating a large, moderately happy future as *worse* than creating a smaller, happier one, even if no one in the large future is worse off than non-existence.

  ### Practical Approaches for Modeling
  There's no perfect solution, but here are defensible strategies, each accepting specific trade-offs:

  1.  **Explicitly Bite a Bullet (with Justification):**
      *   **"Repugnant but Operationally Stable":** Stick with Total Utilitarianism (discounted or undiscounted). **Acknowledge the repugnant conclusion head-on.** Argue that for *policy-relevant timeframes and population ranges* modeled by IAMs (next few centuries, population within plausible bounds, welfare far above "barely worth living"), the repugnant conclusion isn't practically triggered. Emphasize its simplicity, tractability, and dominance in existing models. This is Nordhaus's implicit stance.
      *   **"Critical-Level Utilitarianism (CLU) - Avoiding Repugnance":** Adopt CLU: `SW = Σ(U_i - C)` for all individuals `i`, where `C > 0` is a "critical level" of welfare. Lives below `C` contribute negatively.
          *   **Bite:** Accepts potential for the sadistic conclusion and violates the Mere Addition Principle for lives below `C`. Choosing `C` is inherently value-laden.
          *   **Modeling:** Set `C` justifiably (e.g., linked to a "decent life" threshold). Requires defining a meaningful zero point (`U=0`). Run sensitivity analyses on `C` (e.g., `C=0`, `C=0.5*U_baseline`, `C=U_baseline`). **Key IAM Advice:** Show how optimal carbon prices/abatement paths change with `C`. Higher `C` typically makes preventing large, low-average-welfare futures *more* urgent relative to maximizing total output in medium-population futures.
      *   **"Average Utilitarianism - Prioritizing Quality":** `SW = Average(U_i)`.
          *   **Bite:** Strongly violates Mere Addition and implies that adding happy people can make the world *worse* if they lower the average (e.g., adding people slightly less happy than average). Can lead to "Conclusion M" (preferring extinction over a large, moderately happy population). Highly sensitive to the welfare of small, potentially miserable groups.
          *   **Modeling:** Simpler than CLU. Dramatically shifts focus away from population size towards maximizing average welfare. Might favor aggressive climate policy even if it slightly reduces long-term population growth, but could deprioritize policies solely boosting population.

  2.  **Attempt to Sidestep (with Caveats):**
      *   **Person-Affecting Views / Asymmetry:** Only count welfare impacts on people who *will* exist regardless of the choice. Creating a person with positive welfare is neutral; creating one with negative welfare is bad. Avoids repugnant/sadistic conclusions but violates strong Pareto principles and struggles with long-term futures where *everyone's* existence is contingent.
          *   **Modeling:** Extremely difficult to implement in forward-looking optimization models like DICE. Might require simulation-based approaches comparing specific policy paths and their resulting populations. Arguably less suitable for comprehensive IAMs but useful for specific population/climate interaction modules.
      *   **Variable-Value Views (VVV):** The value of adding a person diminishes as total population increases. Aims for a "golden path" between repugnance and sadism.
          *   **Bite:** Violates Mere Addition and other intuitive principles in complex ways. Parameterization (`how much` does value diminish?) is highly subjective.
          *   **Modeling:** Implementable (e.g., `SW = N^α * Average(U)` with `0 < α < 1`, or more complex forms). Requires choosing `α`. Sensitive to `α`; test robustness. Less common in economics, requires clear justification for functional form and parameters.
      *   **"Sufficientarian" Thresholds:** Focus on ensuring welfare *exceeds a sufficient threshold* for all (or most) people, rather than maximizing a sum or average. Less vulnerable to repugnant/sadistic conclusions *if* the threshold is high.
          *   **Bite:** Abandons maximization, potentially accepting avoidable welfare losses above the threshold. Defining the threshold is critical and value-laden.
          *   **Modeling:** Shift from optimization to constraint-satisfaction: Minimize costs/emissions subject to keeping projected future welfare above threshold `T` with high probability. Requires probabilistic modeling of climate damages and welfare impacts. Useful for framing "safe minimum standards."

  3.  **The Pragmatic "Damage Function" Dodge (Proceed with Extreme Caution):**
      *   **Approach:** Keep the standard Total Utilitarian SWF but *embed* population ethics concerns *within the damage function*.
      *   **How:** Model climate damages as having a component that *explicitly reduces average welfare more severely at very high population levels* or incorporates thresholds where damages cause catastrophic welfare collapse. Or, model catastrophic population *losses* as a welfare cost.
      *   **Caveat:** This risks being ad hoc and obscuring the underlying ethical choices. It doesn't truly solve the axiology problem, it just shifts where the value judgment is made. Use only if tightly coupled to empirically grounded catastrophic scenarios, not as a general solution.

  ### Recommendations for Economists & Policymakers

  1.  **Transparency is Paramount:** **The single most important practical takeaway.** Any IAM used for policy *must explicitly state* its population axiology and the trade-offs it implies. Model documentation should clearly state: "This model uses [SWF type], which implies acceptance of [e.g., the repugnant conclusion / violation of mere addition / potential sadistic conclusion] as discussed in population ethics. Sensitivity to this choice is shown in [Figure X/Table Y]."
  2.  **Sensitivity Analysis is Non-Negotiable:** Don't just run one SWF. Run key policy scenarios (e.g., optimal carbon price, peak warming) under:
      *   Total Utilitarianism (discounted)
      *   Critical-Level Utilitarianism (with low/medium/high `C`)
      *   Average Utilitarianism
      *   (If feasible) a Variable-Value specification.
      *   **Present the range of results.** This shows policymakers how much ethical assumptions drive outcomes.
  3.  **Contextualize the "Repugnance":** Argue that for the policy-relevant horizons (e.g., 200-300 years), the populations and welfare levels under consideration (even with severe climate change) are *far* from the "barely worth living" scenario that makes the repugnant conclusion truly repugnant. The focus should be on avoiding catastrophic welfare *losses* for large populations, not comparing existence to non-existence for potential trillions.
  4.  **Focus on Catastrophic Risks:** Frame the debate around preventing futures where large populations experience *negative* or *extremely low* welfare due to climate catastrophe. This aligns better with policy urgency and mitigates some of the more abstract paradoxes. CLU with a positive `C` or sufficientarianism can be effective here.
  5.  **Acknowledge Deep Uncertainty:** The impossibility theorems show fundamental ethical uncertainty. Modelers should be humble. Conclusions based on *any* single SWF should be presented with the caveat that this represents one coherent ethical framework among several possible, equally defensible but contradictory, ones.

  **In Conclusion:** You cannot sidestep the impossibility theorems. The practical modeling task is to:
  1.  **Choose** an SWF consciously based on which ethical trade-offs (repugnance, sadism, mere addition violation) you find least problematic for the context of climate policy.
  2.  **Implement** it rigorously (CLU is often the most promising "compromise" for IAMs).
  3.  **Test** sensitivity to its key parameters (`C`, discount rates, VVV parameters).
  4.  **Communicate** the choice, its implications, and the sensitivity transparently.

  Your dissertation chapter's major contribution can be moving this profound ethical debate from abstract philosophy into the concrete realm of quantitative climate policy analysis, forcing modelers and policymakers to confront the values embedded in their "objective" models. Highlighting the sensitivity of optimal policy to the choice between, say, Total Utilitarianism and CLU with `C > 0` would be a powerful empirical result grounded in the philosophical dilemma.
