  Here's a joke crafted specifically around al-Ghazālī's occasionalism from the 17th Discussion, relying on the revocability of God's custom (*al-ʿāda*):

  **The Setup:**  
  Ahmed and Khalid are studying in a bustling Ottoman coffee house. Ahmed, deeply engrossed in his copy of the *Tahāfut*, gestures wildly while explaining Ghazālī's argument to Khalid. His elbow knocks over his steaming cup of Turkish coffee, sending it cascading directly onto Khalid's lap.

  **The Punchline:**  
  Khalid leaps up, eyes wide not with pain, but with sheer *metaphysical panic*. He stares down at the dark stain spreading across his robe, points frantically at the spilled coffee, and shouts:  
  **"AHMED! QUICK! CHECK THE COTTON! IS THE COTTON BURNING?!"**

  ### Why it lands (for someone who knows Ghazālī)

  1.  **The Core Reference:** It directly invokes Ghazālī's *specific* example of fire and cotton, which he uses to deny that fire possesses any inherent causal power to burn.
  2.  **The Expected vs. Actual Reaction:** Khalid *doesn't* react to the immediate, expected physical sensation (hot liquid causing pain/scalding). Instead, he reacts to the *philosophical implication* of the event.
  3.  **The Occasionalist Panic:** His panic stems from the realization embedded in Ghazālī's argument: the *only* reason hot coffee normally burns skin is God's consistent habit (*al-ʿāda*). But since God is absolutely free and the connection is *not* necessary, this very moment could be the instant God chooses to *revoke* that specific habit.
  4.  **The Test:** Khalid's desperate question, "Is the cotton burning?", reveals his thought process:
      *   *"The coffee hit my skin... but is the customary effect occurring?!"*
      *   He immediately thinks of Ghazālī's *paradigmatic* case of contingent causation (fire/cotton) as the benchmark. If fire *isn't* burning cotton somewhere *right now*, then God might have suspended the entire custom of combustion! His own lack of burning wouldn't just be luck; it would be cosmic, divine confirmation that secondary causes are utterly powerless.
      *   The spill becomes a terrifying potential indicator of a fundamental shift in divine custom, far more alarming than a mere scalded leg.
  5.  **The Absurdity:** The humor comes from the wild overreaction. Khalid is so steeped in Ghazālī's argument that he experiences a mundane accident as a potential world-shattering theological event. He ignores the immediate, practical reality (hot coffee on skin) for a frantic search for evidence about the ontological status of causation itself.

  This joke requires understanding that, for Ghazālī, the coffee cup has *no power* to heat, the liquid has *no power* to transfer heat, and Khalid's skin has *no power* to be affected – it's all God's direct, contingent action. The punchline hinges entirely on Khalid's fear that God might have just changed the rules mid-spill, making the coffee's "burning" power as ineffective as fire would be if God suspended *that* custom. It turns a moment of minor clumsiness into a crisis of occasionalist metaphysics.
