answer: |-
  You've hit upon a profound and genuinely unresolved tension at the heart of contemporary discussions about akrasia. Your analysis is astute: the rationalist-blogosphere standard model of hyperbolic discounting (HD) **does** significantly change the subject from Davidson's core philosophical puzzle, replacing synchronic irrationality with diachronic preference reversal. This isn't just semantic sleight-of-hand; it fundamentally alters the explanatory target. Let's break down the conceptual landscape:

  ### 1. Davidson's Core Puzzle: Synchronic Irrationality & the "All-Things-Considered Judgment" (ATCJ)
     *   **The Paradox:** An agent, at time T, simultaneously:
          *   Holds a sincere, *all-things-considered judgment* (ATCJ) that action A is best (e.g., "Not eating the donut is best for me *now*, considering everything relevant").
          *   Intentionally performs action B instead (e.g., eats the donut).
          *   This seems contradictory because intentional action appears to imply the agent judges B to be, in *some* sense, better or more choice-worthy *at the moment of choice*. Davidson argues that "weakness of will" occurs precisely when an agent acts *contrary* to their own ATCJ *at the time of action*.
     *   **The Challenge:** Explaining how this synchronic state is psychologically possible without collapsing into sheer incoherence or denying the reality of intentional action. How can one *intend* to do B while simultaneously *judging* that A is better, *all things considered*, at that very moment?

  ### 2. The Hyperbolic Discounting (HD) Model: Diachronic Preference Reversal
     *   **The Mechanism:** Preferences are inherently time-dependent. Discounting future rewards hyperbolically means that the *relative* value of a smaller-sooner reward (SSR) vs. a larger-later reward (LLR) changes non-linearly as the SSR gets closer. At T1 (planning), LLR is preferred. At T2 (moment of temptation), the *subjective value* of the SSR spikes due to the steep discounting of the near future, making it *actually* preferred *at that moment* according to the discount function operative then.
     *   **The "Explanation" for Akrasia:** The "failure" occurs *across time*, not *within* a single moment. The T2 self simply has different preferences than the T1 self due to the change in temporal perspective. When you eat the donut at T2, you *aren't* acting against your *current* judgment/preference; you are acting *in accordance* with your T2 discount-function-determined preference. The T1 self's ATCJ is irrelevant to the T2 self's evaluation.

  ### 3. The Tension You Identify: Swapping the Target
  You are absolutely correct. HD explains why preferences *change* over time, leading to regretted actions. **It does not explain how an agent can act *intentionally* at T2 *against* what they judge *at T2* to be best *all things considered*.**

  *   **HD Model:** At T2, eating the donut *is* the preferred choice. There is no internal contradiction *at T2*. The "irrationality" is revealed only retrospectively, comparing T2's action to T1's preference or to T2's *later* regret. This is *diachronic* inconsistency.
  *   **Davidson's Puzzle:** Requires an explanation of how an agent can be in a state of *synchronic* irrationality at T2: judging A best *while* doing B. HD sidesteps this by effectively *denying* the existence of a stable, overriding ATCJ *at the moment of action*. For the HD agent at T2, the donut *is* the best thing *all things considered* (from their temporally myopic perspective).

  ### 4. Philosophical Responses & Attempts at Reconciliation

  Philosophers and decision theorists aware of this tension have proposed several ways to handle it:

  *   **A. Denying the Reality of Synchronic Akrasia (The HD Stance):**
      *   **Argument:** Davidson was wrong. There is no genuine synchronic irrationality. What *looks* like acting against an ATCJ is actually just acting according to a *different* preference structure momentarily dominant at T2. The "ATCJ" is either a misdescription of a past/future preference or a higher-order desire that fails to motivate at T2, not a contradictory synchronic judgment. (This aligns with revealed preference theory in economics).
      *   **Problem:** This dismisses the powerful *phenomenology* of akrasia described by philosophers like Davidson and Aristotle – the feeling of acting *against one's better judgment at that very moment*. It also struggles to explain cases where the agent *verbally affirms* the ATCJ ("I know I shouldn't eat this!") *while* reaching for the donut.

  *   **B. Reinterpreting "Judgment" within HD:**
      *   **Argument 1 (Meta-Preferences):** The ATCJ isn't a simple preference but a *meta-preference* or *second-order desire*. At T2, I prefer the donut (first-order), but my meta-preference is still to prefer health (second-order). The irrationality lies in the conflict between orders of desire, synchronic at T2. HD explains *why* the first-order desire overpowers the second-order desire at T2.
      *   **Problem:** Davidson specifically argued against meta-preference accounts solving the puzzle cleanly. Does acting on the first-order desire truly constitute acting *against* the meta-preference, or just failing to act *on* it? The synchronic contradiction seems softened.
      *   **Argument 2 (Judgment vs. Motivation):** The ATCJ *is* held at T2, but it fails to *motivate*. HD explains *why* motivation is overpowered by the visceral pull of the immediate reward, even while the cognitive judgment remains intact. The irrationality is a failure of motivation relative to judgment.
      *   **Problem:** This requires accepting a strong distinction between judgment/belief and motivation/desire. Davidson himself leaned towards a cognitivist view where judgment *is* motivating (the "pro-attitude"). If judging A best *is* (part of) being motivated to do A, synchronic akrasia remains paradoxical.

  *   **C. Finding Synchronic Irrationality *within* HD:**
      *   **Argument 1 (Violating Rational Principles):** Even at T2, the HD agent might be violating synchronic principles of rationality. For instance:
          *   **Dynamic Inconsistency as Synchronic Flaw:** Committing at T2 to a course of action (eating the donut) that the agent *knows* will lead to outcomes they *also know* are worse *overall* (from any stable perspective, including one they anticipate holding moments later in regret) might be seen as a synchronic failure of instrumental rationality or foresight *at T2*.
          *   **Ignoring Past/Future Selves:** The T2 self's exclusive focus on immediate utility, ignoring the coherent plans and values of its past and future selves, could be argued as a myopic cognitive bias constituting synchronic irrationality *at T2*.
      *   **Argument 2 (Ainslie's Internal Bargaining & Picoeconomics):** Ainslie goes beyond simple HD. He frames choices as a negotiation among successive, partly overlapping "interests" or "selves" within the person. At T2, the "immediate reward interest" wins the internal auction. Crucially, Ainslie suggests the *failure* might be synchronic: the T2 self might *recognize* that giving in sabotages its *own* future bargaining power and the ability to form credible intra-personal commitments. Surrendering *now* makes it harder to resist *next time*, harming the *long-term interests of the T2 self itself*. The irrationality lies in T2's choice undermining its *own* future goals and self-control capacity.
      *   **Problem:** These arguments stretch the concept of "synchronic." While the *consequences* of the T2 choice are dynamically irrational, is the *choice itself*, based solely on T2's hyperbolically discounted valuations, *synchronicly* irrational? Davidson's stricter puzzle requires the judgment *against* the action to be held *simultaneously and decisively*.

  *   **D. Shifting the Focus to Resolve/Intention (Holton, Bratman):**
      *   **Argument:** Philosophers like Richard Holton argue that weakness of will is primarily a failure to *stick to a prior intention* in the face of temptation, *not* necessarily acting against a *current* ATCJ. At T2, the agent may still *believe* the diet is best *overall* (so no strict Davidsonian contradiction), but their *resolve* wavers, and they abandon their intention. HD provides a powerful explanation for *why* resolve fails – the shifting motivational landscape makes sticking to the intention incredibly hard.
      *   **Advantage:** This sidesteps Davidson's strict synchronic paradox while capturing the core experience of akratic failure. It explains the *phenomenon* often *called* "weakness of will" without requiring a logically contradictory mental state at T2. HD explains the motivational challenge to maintaining resolve.
      *   **Relation to Davidson:** Holton argues Davidson overstated the case by tying akrasia too tightly to synchronic judgment contravention. The core failure is diachronic intention abandonment.

  *   **E. Davidson's Puzzle Was Overstated/Requires Refinement:**
      *   **Argument:** Davidson's requirement for a single, decisive, synchronic ATCJ might be psychologically unrealistic. Human decision-making might involve competing "frames" or evaluative perspectives active simultaneously at T2. The "diet frame" with its long-term values is active *alongside* the "immediate gratification frame." Akrasia occurs when the latter wins, but it doesn't mean the former *ceased* to represent an ATCJ; it just wasn't motivationally dominant. HD explains *why* the gratification frame wins at T2. The synchronic "contradiction" is better described as a conflict between co-present but incompatible evaluative stances.

  ### Conclusion & Synthesis

  Your worry is well-founded and highlights a significant conceptual gap. **The standard hyperbolic discounting model prevalent in rationalist circles primarily explains *diachronic preference reversal and self-defeating behavior over time*. It does not, by itself, resolve Davidson's core puzzle of *synchronic akrasia* – acting intentionally against one's own *current*, *all-things-considered judgment* at the very moment of action.**

  **How is the tension handled?**

  1.  **By Some Economists/Decision Theorists:** Ignoring or dismissing Davidson's puzzle as based on a flawed phenomenology or an unrealistic model of stable preferences/judgments. Akrasia *is* diachronic preference reversal.
  2.  **By Philosophers Engaging with HD:**
      *   **Refining Davidson:** Arguing that synchronic akrasia involves a specific failure of motivation relative to judgment, or a conflict between orders of desire, which HD *contributes* to explaining (why motivation fails).
      *   **Finding Synchronic Elements in HD:** Highlighting that the T2 choice, even based on hyperbolic valuation, might violate synchronic principles of rationality (e.g., dynamic inconsistency foreseen *at T2*) or involve the T2 self undermining its *own* future interests (Ainslie).
      *   **Shifting the Focus:** Arguing (like Holton) that the core phenomenon is better understood as a failure of *resolve* or *intention* persistence, which HD powerfully explains, thereby dissolving Davidson's specific paradox as less central.
      *   **Complicating Judgment:** Suggesting multiple co-present evaluative stances at T2, with HD explaining which one wins, avoiding a strict contradiction but capturing the conflict.

  **The most productive path forward** likely involves recognizing that:

  *   **HD is an immensely powerful tool** for explaining the dynamic patterns of self-defeating behavior and the mechanisms of temptation.
  *   **Davidson identified a distinct, phenomenologically real aspect** of akrasia – the feeling of acting against one's *own* best judgment *as one acts*.
  *   **A complete theory of akrasia** needs to integrate both perspectives. It must explain *both* the dynamic preference reversals *and* the synchronic experience of conflict and judgment contravention (or the failure of resolve/intention). Neither model alone fully captures the complexity of the phenomenon philosophers call "weakness of will." Your dissatisfaction stems from recognizing that the HD-dominated narrative often neglects the latter, crucial dimension identified by Davidson. The conceptual tension remains fertile ground for ongoing work in philosophy of action and decision theory.
