  ### Justification:
  1. **Owen (+1)**: Correctly identifies Aquinas's distinction in *Sentences Commentary*: a *pure usurper* (no legitimate title) isn't a true authority, so resistance/killing isn't sedition. Aquinas *does* imply private action might be permissible here. However, Owen slightly overstates by implying Aquinas "licenses" it unequivocally; Aquinas frames it as *not sinful* rather than a positive right.  
  2. **Ana (+2)**: Precisely correct. She acknowledges Owen’s point but rightly confines it to usurpers. Her citation of *De Regno* shows Aquinas’s caution for *legitimate rulers turned tyrants*: private judgment is dangerous, and correction belongs to public authority/prayer. This is Aquinas’s dominant, mature position.  
  3. **Owen (+1)**: Validly cites *Summa* (II-II Q42 A2) where Aquinas argues a *tyrannical regime* (even if originally legitimate) sows sedition by prioritizing private over common good. Removing the "sin of sedition" charge *does* soften the barrier to resistance. But he overreaches by implying this *authorizes* private killing—Aquinas doesn’t draw that conclusion here.  
  4. **Ana (+2)**: Strongest move. She grants Owen’s sedition point but correctly insists that "not sinful" ≠ "authorized." Aquinas *never* explicitly endorses *private lethal action* against originally legitimate tyrants. *De Regno*’s emphasis on public channels/prayer remains intact, preserving her distinction. Owen’s slide from permissibility to authorization is indeed unsupported.  

  ### What Both Elide:
  Both scholars underplay Aquinas’s hierarchy of responses. For *all* tyrants (usurpers or legitimate-gone-bad), he consistently prioritizes *non-lethal* correction (public authority, divine intervention) and treats killing as a last resort—even for usurpers, it’s framed defensively ("not sedition") rather than proactively endorsed. They also overlook Aquinas’s natural law framework: if a ruler violates fundamental justice (e.g., commanding idolatry), resistance *might* be a natural duty, but Aquinas still avoids explicitly empowering private individuals as executioners, fearing anarchy. His "prayer" solution isn’t passivity but an appeal to divine/higher temporal judgment, reflecting his view that legitimacy flows from serving the common good—a standard both scholars reference but don’t fully integrate into the authorization question.
