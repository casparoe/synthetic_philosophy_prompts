  I should also flag that "nobody" (instead of "no agent at any time") is another sneaky move. It smuggles in universal quantification over agents *and* times. But again, the logic doesn’t need it. The formal proof only requires that *some* truths are unknown by *someone* (e.g., "It rained on my birthday but no one checked").  

