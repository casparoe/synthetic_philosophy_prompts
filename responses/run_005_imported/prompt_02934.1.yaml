  First, I need to recall Fitch's original argument. He sets up two operators: K for knowledge and ◊ for possibility. The key premise is that knowledge distributes over conjunction (K(p ∧ q) → Kp ∧ Kq) and that knowledge implies truth (Kp → p). The paradox shows that if all truths are knowable (∀p(p → ◊Kp)), it leads to the conclusion that all truths are actually known (∀p(p → Kp)), which contradicts human non-omniscience.

  The user is zeroing in on Fitch's claim that time isn't relevant, but then his English restatement uses "has known, or will know"—explicitly temporal terms. They're wondering if this is just sloppy phrasing or if the temporal aspect is secretly crucial to the argument. 

