prompt: |-
  hey, so I'm reading Fitch's original 1963 paper, A Logical Analysis of Some Value Concepts, for my diss chapter on anti-realism, instead of just going off the standard SEP gloss on the paradox of knowability, and a phrasing thing is bugging me.

  Right near the start (p. 135) he flatly says the element of time is going to be ignored when analyzing these concepts. But a few pages later, when he restates the core result in plain english instead of symbols, the sentence runs: "...nobody knows (or has known, or will know) to be true ... nobody can know to be true" (p. 139).

  That parenthetical is soaked in tense -- past, present, future -- right after he told us tense was off the table, and its doing the work of getting from ordinary non-omniscience to a much stronger modal claim about what literally can never be known. is that just loose, informal phrasing, with the real tense-free argument happening elsewhere via the K/◊ machinery? or is the temporal quantification actually doing indispensable work here, in tension with his own disclaimer? can you walk me through what's really going on?
