  I should break this down:  
  - The formal proof is entirely modal (◊, □) and timeless. The K operator isn’t indexed to time or agents.  
  - But when Fitch says "nobody knows/has known/will know," he’s quantifying over *all times* to block the escape route of "Well, maybe someone *will* know p later." That’s why he slams the door with past/present/future.  

  The user’s suspicion is half-right: the tense *is* doing rhetorical work in the informal summary, but it’s not in the formal logic. Fitch is basically saying, "Look, even if we consider all of history, no one ever knows p—so stop hoping temporal evasion will save anti-realism."  

