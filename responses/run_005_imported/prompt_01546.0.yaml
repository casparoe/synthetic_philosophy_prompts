prompt: |-
  So I've been going down a pragmatism rabbit hole on my own time (no philosophy background, just a curious person with too much free time), and I started with William James because he's the readable one, but everyone keeps saying Peirce was the "real" originator and that James kinda watered it down for the public. So I dug up one of Peirce's own essays, "What Pragmatism Is" from 1905, and hit this paragraph that is just not clicking for me:

  "That is real which has such and such characters, whether anybody thinks it to have those characters or not. At any rate, that is the sense in which the pragmaticist uses the word. Now, just as conduct controlled by ethical reason tends toward fixing certain habits of conduct, the nature of which, (as to illustrate the meaning, peaceable habits and not quarrelsome habits), does not depend upon any accidental circumstances, and in that sense, may be said to be destined; so, thought, controlled by a rational experimental logic, tends to the fixation of certain opinions, equally destined, the nature of which will be the same in the end, however the perversity of thought of whole generations may cause the postponement of the ultimate fixation. If this be so, as every man of us virtually assumes that it is, in regard to each matter the truth of which he seriously discusses, then, according to the adopted definition of "real," the state of things which will be believed in that ultimate opinion is real. But, for the most part, such opinions will be general. Consequently, some general objects are real."

  I get the individual words but I loose the thread of the actual argument. Like, how does he get from "opinions are destined to settle down eventually" to a definition of what's REAL, and why does that weirdly spit out the conclusion that general objects (not just particular concrete things) are real too? That last bit especially throws me — I always thought "real" meant like, actual physical stuff you can point at, not a category or a general. Can you walk through the logic here step by step, kind of slowly, and also flag how this compares to the "truth is basically whatever's useful to believe" version of pragmatism I picked up from reading James? Are they secretly saying the same thing or is Peirce actually doing something pretty different here. Not looking for a pragmatism-101 overview, just trying to actually get what's going on in this specific bit of text.
