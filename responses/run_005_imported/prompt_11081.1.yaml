answer: |-
  You've raised a profound point that touches on a common source of confusion about Bell's theorem. While your reasoning contains a kernel of truth about Bell's original 1964 derivation, **your overall conclusion is incorrect**. Bell's theorem *does* rule out *all* local hidden variable theories—including genuinely stochastic ones—that satisfy the principle of local causality. Here's why:

  1.  **Bell's Original (1964) Derivation:** Yes, Bell's first paper assumed deterministic hidden variables. He showed that if outcomes are pre-determined by λ (the hidden variable), and locality holds (Alice's outcome depends only on her setting and λ, not Bob's setting/outcome, and vice versa), then the correlations must satisfy the Bell inequality. Quantum mechanics violates this inequality. Your argument correctly identifies that *this specific derivation* doesn't directly address stochastic theories.

  2.  **The Crucial Generalization: Bell's Locality Condition (1971+):**
      *   Bell, and independently Clauser, Horne, Shimony, and Holt (CHSH), quickly generalized the theorem beyond determinism.
      *   The key insight is that **locality imposes a specific mathematical constraint on the *probabilities* of outcomes**, regardless of determinism.
      *   Specifically, **local causality** (or simply **locality**) requires that the probability of Alice's result (A), given the hidden variable (λ), her setting (a), *and* Bob's setting (b) and result (B), must reduce to the probability given only λ and her own setting:
          `P(A | a, b, B, λ) = P(A | a, λ)`
      *   Similarly for Bob: `P(B | a, b, A, λ) = P(B | b, λ)`
      *   This means that **λ provides a complete description of any local physical state relevant to the measurement**. Once λ is specified, the probability of Alice's result is independent of anything happening at Bob's distant location (his setting b or his result B), and vice versa.

  3.  **Deriving the Inequality from Locality + Stochastic Hidden Variables:**
      *   Consider the joint probability for Alice getting result A and Bob getting result B, given settings a and b, and hidden variable λ: `P(A, B | a, b, λ)`.
      *   **Locality Condition:** The locality condition above implies that this joint probability **factorizes**:
          `P(A, B | a, b, λ) = P(A | a, λ) * P(B | b, λ)`
          This factorization is the mathematical expression of "no instantaneous influence". The outcomes are statistically independent given λ and the local settings.
      *   **The Observable Probability:** The probability we observe in an experiment (averaged over many runs) is the average of the λ-specific probabilities over the distribution of λ (ρ(λ)):
          `P(A, B | a, b) = ∫ dλ ρ(λ) * P(A | a, λ) * P(B | b, λ)`
      *   **Deriving the Constraint:** From this expression, using the specific settings involved in Bell tests (e.g., angles 0°, 45°, 90°, 135°), one can derive constraints on the measurable correlation functions (like the expectation value E(a, b) = P(same) - P(different)). These constraints are the Bell inequalities (e.g., the CHSH inequality: |E(a,b) - E(a,b')| + |E(a',b) + E(a',b')| ≤ 2).
      *   **Quantum Violation:** Crucially, quantum mechanics predicts (and experiments confirm) correlations that violate these inequalities (e.g., CHSH can reach |2√2| ≈ 2.828 > 2).

  4.  **Why Your Friend is Right (and Physicists/Philosophers are Correct):**
      *   The derivation of the Bell inequality **only assumes local causality (factorization of probabilities) and the existence of hidden variables λ**. It makes **no assumption** about whether λ determines the outcomes deterministically or merely specifies probabilities.
      *   Any theory satisfying `P(A, B | a, b, λ) = P(A | a, λ) * P(B | b, λ)` must obey the Bell inequalities.
      *   Quantum mechanics violates the inequalities. Therefore, quantum mechanics **cannot** be described by *any* theory satisfying `P(A, B | a, b, λ) = P(A | a, λ) * P(B | b, λ)`.
      *   This rules out **all** locally causal hidden variable theories, deterministic *and* stochastic. The term "local realism" in this context typically refers to the conjunction of "locality" (as defined by the factorization condition) and "realism" (interpreted as the existence of definite outcomes or properties determined prior to and independent of measurement, embodied by the hidden variables λ).

  **Addressing Your Core Argument:**

  *   **"If hidden variables fix only probabilities, the derivation doesn't go through":** This is incorrect. As shown above, the derivation **does** go through using the factorization condition `P(A, B | a, b, λ) = P(A | a, λ) * P(B | b, λ)`, which is the natural expression of locality for a stochastic theory. This factorization is the essential ingredient leading to the inequality constraint.

  **Why the Confusion Persists:**

  1.  **Focus on Original Paper:** Discussions often start with Bell's simpler 1964 deterministic model for pedagogical reasons.
  2.  **"Realism" Ambiguity:** The term "realism" can be fuzzy. Does "realism" imply determinism? In the Bell context, "realism" usually means the existence of elements of reality (hidden variables λ) that determine the *probabilities* of outcomes (even if not the outcomes themselves deterministically), making those probabilities well-defined prior to measurement. This probabilistic realism is sufficient.
  3.  **"Hidden Variables" Connotation:** People often associate "hidden variables" with deterministic theories like Bohmian mechanics. However, the mathematical framework of local hidden variables encompasses stochastic theories by definition.

  **Conclusion:**

  You correctly noted that Bell's initial derivation assumed determinism. However, the theorem was rapidly generalized to show that **any locally causal theory (whether deterministic or stochastic) relying on hidden variables λ to specify outcomes or their probabilities must satisfy Bell inequalities.** Experimentally observed quantum correlations violate these inequalities. Therefore, Bell's theorem rules out *all* locally causal hidden variable theories. Physicists and philosophers are correct in stating it rules out "local realism," where "local" means no faster-than-light influence (enforced by the factorization condition) and "realism" means the existence of pre-existing properties or well-defined probabilities governed by hidden variables λ. Your friend had the stronger position in this argument.
