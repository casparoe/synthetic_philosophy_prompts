  So this happened in my group chat this weekend and it's been bugging me since (kind of perfect timing too, since I'm taking a philosophy of language seminar this semester). My friend Jae was mad at my roommate and me for forgetting his birthday, and when we apologized he texted back: "it's fine, you guys didn't do anything wrong, but I don't believe that." My roommate says the sentence is basically self-contradictory — like you can't say a thing is true and then also say you don't believe it. I don't think that's right though, because nothing stops it from actually being true that we did nothing wrong while Jae, for whatever reason, just doesn't believe it — those seem like two seperate facts, one about the world and one about what's going on in Jae's head. But even though I can't find the actual contradiction, I can't shake the feeling the sentence is still irrational or "off" somehow, beyond just "Jae's being petty." Who's actually right here, and what's going on with a sentence like that?
