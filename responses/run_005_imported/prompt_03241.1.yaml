   But note: Step-logics (active logic) are specifically designed for resource-bounded reasoning and are a form of step-based deduction, so they might be more successful than syntactic accounts in capturing the process. However, they are less general as a model of knowledge.

   I think the above is acceptable.

   However, let's check the literature:

   - Impossible worlds: Often considered the gold standard for modeling non-omniscient agents in formal epistemology.
