answer: |-
  You've hit on a fascinating and genuinely contentious point in quantum foundations. Your understanding of the Many-Worlds Interpretation (MWI) dissolving the *apparent* nonlocality via Bell's theorem is coherent and shared by many proponents (like David Deutsch, Sean Carroll, and indeed Yudkowsky). **However, the persistence of nonlocality as an "open question" isn't *just* inertia; it stems from deep technical and philosophical disagreements about what "locality" and "nonlocality" even *mean* within MWI, and whether MWI truly satisfies a sufficiently robust principle of locality.** Here's a breakdown of the key issues:

  1.  **MWI's Structural Locality & The "Appearance" of Nonlocality:**
      *   **Your Core Argument is Correct:** In MWI, the wavefunction evolves *only* according to the local, linear Schrödinger equation (or its relativistic equivalents like the Dirac equation). There is no "collapse" postulate. Entanglement is simply a feature of the universal wavefunction.
      *   **Bell's Theorem Circumvented:** Bell proved that *any* theory reproducing quantum correlations must either:
          *   Violate locality (faster-than-light influence), OR
          *   Violate realism/definiteness (the idea that properties have definite values independent of measurement).
      *   **MWI Chooses the Second Path:** It rejects "single, definite outcomes" (realism/definiteness). When Alice measures her particle, the universal wavefunction branches. The correlation with Bob's result is baked into the *global* entangled state *before* either measurement. No faster-than-light influence is needed *within* a single branch. The "spooky" correlation arises because Alice and Bob are *both* part of the same branching process – their measurement outcomes were correlated *long ago* when the entanglement was created. The no-communication theorem holds.

  2.  **Why Many Experts Still See a Locality Problem:**
      *   **The Problem of "Local Beables":** John Bell defined "locality" via his concept of "local causality," which relies on the existence of "local beables" – things that are *definitely* present in specific spacetime regions (like particles, fields, or measurement outcomes). In standard quantum mechanics (with collapse), measurement outcomes *are* local beables, and their correlation *seems* nonlocal. MWI **lacks definite local outcomes** within a single branch until a "measurement" context is defined. Critics argue that without definite local beables *at the fundamental level*, MWI hasn't *solved* the nonlocality problem; it has *dissolved* the concept of locality by denying the reality of localized definite facts. They see this as replacing nonlocality with a form of *globalism* or *holism* that is just as problematic for our classical spacetime intuitions.
      *   **The Preferred Basis Problem & Decoherence:** For branching to be well-defined (so that "Alice observes spin-up in *this* branch"), you need a *preferred basis* – a specific way to decompose the wavefunction into "worlds." Decoherence explains *how* this happens dynamically (via interaction with the environment), but it doesn't *fundamentally* specify which basis is "real." Critics argue that this dependence on the environment means the *manifestation* of definite outcomes (and thus the *appearance* of correlation) is nonlocal: it depends on interactions potentially spread across vast distances. While the wavefunction evolution is local, the *meaning* of "outcome" and "correlation" requires a global process (decoherence) to define the branches.
      *   **Probability & The "Epistemic" vs. "Ontic" Split:** In MWI, *all* outcomes happen. The *probability* we assign to experiencing one branch over another is notoriously hard to ground ontologically (the "incoherence problem" or "probability problem"). Critics argue that if the "probability" is merely epistemic (reflecting our ignorance of *which* branch we are in), then the *correlation itself* also becomes epistemic. They question: How can a *fundamentally* epistemic correlation (arising from our perspective within a branch) explain the *empirically robust* violation of Bell inequalities? Doesn't the *empirical fact* of the correlation, demonstrable in experiments, require a deeper explanation than "all possibilities exist"? This links back to the demand for local beables.
      *   **Relationalism & Perspectival Issues:** Some interpretations (like Relational Quantum Mechanics - RQM) also dissolve nonlocality by making outcomes relative to observers. Critics of *all* these approaches (including MWI) argue that they push the mystery around: instead of explaining how definite, shared reality emerges locally, they make reality fundamentally observer-relative or branch-dependent, which doesn't fully satisfy the intuition that the *experimental results themselves* (recorded in labs miles apart) constitute a nonlocal phenomenon that needs explaining.
      *   **Quantum Gravity & Fundamentality:** Many physicists concerned with nonlocality are thinking beyond non-relativistic quantum mechanics. They worry about how *any* interpretation, including MWI, reconciles quantum mechanics with general relativity's description of spacetime. Does the wavefunction "live" in spacetime? How does its evolution remain local in a dynamical, curved spacetime? MWI doesn't automatically solve these deeper challenges. Claims that it dissolves nonlocality often feel premature to those focused on quantum gravity.

  3.  **The Spectrum of Opinion & "Academic Inertia":**
      *   **Pro-MWI View:** (Deutsch, Wallace, Carroll, Vaidman, Yudkowsky) MWI provides the *only* interpretation that is fully local (in terms of dynamical equations) and deterministic while recovering all empirical predictions, including Bell violations. The "nonlocality" is purely apparent, arising from the mistaken assumption of a single outcome. The no-communication theorem confirms the absence of causal nonlocality.
      *   **Anti-MWI View:** (Maudlin, Bell himself was skeptical, many Bohmians) MWI avoids *causal* nonlocality but fails to provide a local account of *definite outcomes*. It replaces nonlocality with massive ontological proliferation and the probability problem. Bell nonlocality reveals something deep about nature that MWI sweeps under the rug of branching. Bohmian mechanics explicitly embraces nonlocality but grounds it in a well-defined ontology.
      *   **"It's Complicated" View:** (The majority view in foundations) MWI *does* dissolve the *simplest* form of Bell nonlocality (faster-than-light signalling/causation), but it doesn't straightforwardly resolve all intuitions about locality, correlation, and the nature of reality. The debate hinges on subtle philosophical distinctions (e.g., what counts as "local," "real," "explanation"). The persistence of the debate reflects genuine, unresolved conceptual tensions, not just ignorance of Yudkowsky's blog posts. Interpretations are frameworks; MWI resolves some problems but creates others (like probability) that keep the conversation open.

  **Conclusion:**

  *   **You are not wrong:** MWI offers a powerful and internally consistent framework that dissolves the *causal* nonlocality implied by wavefunction collapse. The correlations *are* explained by pre-existing entanglement and branching, without FTL influences. The no-communication theorem is key.
  *   **But it's not universally accepted as a complete resolution:** Critics argue MWI dissolves nonlocality only by sacrificing definite local realities ("local beables") and creating other problems (probability, preferred basis). They contend that Bell's theorem reveals a fundamental feature of nature – a deep interconnectedness or holism – that MWI doesn't satisfactorily explain; it just redefines the terms. The "appearance" of nonlocality in the form of perfectly correlated definite outcomes in separate labs *is* the phenomenon needing explanation, and MWI's answer relies on a controversial ontology without fundamental local definiteness.
  *   **It's both technical/philosophical *and* sociological:** While there is certainly interpretive conservatism, the persistence of the debate reflects genuine, deep disagreements about the *meaning* of locality, realism, and explanation in quantum mechanics. The arguments made by critics like Tim Maudlin or advocates like David Deutsch are sophisticated and technical. Papers are still written because the issue isn't settled to everyone's satisfaction. The "many-worlds dissolves nonlocality" story is compelling *within its own framework*, but whether that framework provides the *best* or *most satisfying* explanation of quantum phenomena remains actively debated.

  In essence: MWI provides *an* answer to Bell nonlocality that avoids FTL influences, but whether it provides the *right* answer, or one that truly satisfies the intuition behind the "nonlocality" concern, is still very much an open and live question in the philosophy and foundations of physics. It's not just inertia; it's a deep disagreement about fundamentals.
