answer: |-
  Here's the strongest case for the ergodicity economics/Kelly perspective, framed as a fundamental shift in rationality for multiplicative processes, *not* merely expected utility in disguise:

  1.  **The Core Problem: Non-Ergodicity in Wealth Dynamics:**
      *   **Traditional Expected Value (EV) Relies on Ergodicity (Implicitly):** EV calculates `Σ [p_i * x_i]`. This is an *ensemble average* – it imagines many parallel universes, runs the bet once in each, and averages the outcomes *across those universes*.
      *   **Wealth Growth is Multiplicative (Non-Ergodic):** Your real-world wealth evolves as `W_t = W_0 * (1+r_1) * (1+r_2) * ... * (1+r_t)`. This is a *multiplicative* process *over time*. The key insight is that **multiplicative processes are generally non-ergodic**: the time-average growth rate (`lim T->∞ (1/T) * ln(W_T / W_0)`) does *not* equal the ensemble-average growth rate (`<ln(1+r)>`). EV maximization often focuses on the ensemble average of *wealth itself* (`<r>`), not even the ensemble average of the *growth rate*.
      *   **The Fatal Flaw:** Using the ensemble average (`<r>`) as a guide for a single trajectory over time in a multiplicative process is mathematically wrong and practically disastrous. It ignores path dependence and the possibility of ruin.

  2.  **Time-Average Growth as the Rational Objective:**
      *   **The Rational Question:** "What strategy, followed consistently over time in *this single reality*, leads to the highest long-term growth rate of *my* wealth?" The answer is maximizing the *geometric mean growth rate*, equivalent to maximizing the *expected logarithm of wealth* (Kelly): `G = exp(<ln(1+r)>) - 1`.
      *   **Why it's Fundamental:** This objective arises *directly* from the dynamics of multiplicative wealth accumulation over time. It's not chosen based on psychological preferences ("I like log utility"); it's dictated by the mathematical structure of the problem – the need to survive and compound over a single path. Rationality means correctly optimizing for the *actual temporal process you experience*.

  3.  **Distinctness from Expected Utility Theory (EUT):**
      *   **EUT is Preference-Centric:** EUT starts with axioms about preferences (completeness, transitivity, independence, continuity) and derives that decisions should maximize `Σ [p_i * U(x_i)]`, where `U(x)` represents the *subjective* utility of outcome `x`. The shape of `U(x)` is about risk *aversion* or *seeking*.
      *   **Time-Average Growth is Process-Centric:** Kelly/Ergodicity economics starts with the *objective dynamics* of wealth accumulation (multiplicative, non-ergodic) and derives that the rational criterion is maximizing `<ln(1+r)>` or `<ln(W)>`. The "log" here is *not* a psychological utility function; it's the *mathematical transform* required to convert the multiplicative process into an additive one (`ln(W_T) = ln(W_0) + Σ ln(1+r_t)`), making time-averages and ensemble-averages coincide *for the transformed variable* (`ln(W)`). **The log is a consequence of the dynamics, not a psychological assumption.**
      *   **The Crucial Difference:** In EUT, `U(x) = ln(x)` is *one arbitrary choice* among many (quadratic, exponential, etc.), reflecting a specific risk preference. In the ergodicity framework, maximizing `<ln(W)>` is the *only rational objective* for long-term multiplicative growth, *regardless* of your psychological risk preferences. Using any other `U(x)` for this specific problem (repeated multiplicative bets) is irrational because it fails to correctly account for the temporal dynamics and leads to strategies incompatible with long-term survival and growth on a single path.

  4.  **Superiority in Key Aspects for Repeated Bets:**
      *   **Bankruptcy Avoidance (Survival):** Kelly explicitly avoids bets with any risk of total loss (`r = -100%`), as `ln(1 + (-1)) = ln(0) = -∞`. EV maximization, especially with high leverage, often embraces strategies with a non-zero probability of ruin, disastrous for a single trajectory. Rationality must prioritize survival in the long run.
      *   **Focus on Compounding:** Kelly maximizes the *rate* at which wealth compounds geometrically. EV maximization, focused on arithmetic means, often favors strategies with high variance that actually *destroy* wealth over time due to volatility drag (e.g., +100% / -50% bet has EV = +25%, but repeated play leads to $0). Kelly accounts for this drag inherently.
      *   **Path Dependence Matters:** In multiplicative growth, the sequence matters. A large loss early destroys the capital base for future compounding. Ensemble averages (`<r>`) completely ignore sequence. Time-average growth (`<ln(1+r)>`) inherently accounts for the damage volatility does to long-term compounding on a single path.
      *   **"Rationality" Defined by the System:** The argument is that rationality should be defined relative to the system you are embedded in. For an agent facing repeated multiplicative growth, rationality means optimizing for the long-term outcome *of that specific temporal path*. Ignoring the non-ergodic nature is irrational *within the context of the system dynamics*.

  **Addressing Samuelson's Objection:**

  Samuelson is correct that maximizing `<ln(W)>` *is* a special case of EUT *if you happen to choose* `U(W) = ln(W)`. **The ergodicity camp's stronger claim is:** For the specific problem of repeated multiplicative bets where long-term wealth growth on a single path is the goal, `U(W) = ln(W)` isn't *merely* a psychologically plausible choice; it is the *objectively necessary* and *only rational* choice dictated by the mathematical structure of the problem. Choosing any other utility function leads to decision-making that is demonstrably suboptimal or catastrophic for the single individual over time, because it fails to correctly account for the non-ergodicity. The "physics costume" isn't dressing; it's revealing a fundamental structural property (non-ergodicity of multiplicative processes) that invalidates the implicit assumptions of standard EV and forces a specific criterion (time-average growth) as rational.

  **The Strongest Case Summarized:**

  Maximizing time-average growth (Kelly) isn't just *another* flavor of expected utility theory; it represents a fundamentally different *and superior* standard of rationality *specifically for repeated decisions involving multiplicative growth* (like investing, betting, resource extraction). It directly addresses the core issue: **ensemble averages (`<r>`) are irrelevant to the long-term outcome of a single individual experiencing a single non-ergodic (multiplicative) path through time.** Rationality requires optimizing the quantity that actually determines your long-term outcome on that single path: the geometric mean growth rate, `<ln(1+r)>`. This objective arises necessarily from the dynamics, not from subjective preferences. While EUT *can* arrive at the same answer by assuming `U(W)=ln(W)`, that choice is revealed by the ergodicity analysis to be not arbitrary, but objectively mandated by the structure of the problem. Using any other utility function for this class of problems is irrational because it ignores the path dependence and ruin risk inherent in multiplicative dynamics. Kelly/ergodicity provides the correct lens for "what happens to the one real you across time."
