  So, the core is the likelihood principle: all evidence from data is in the likelihood function, and stopping rules don't affect it. In frequentist stats, stopping when you hit p<0.05 inflates false positives because the p-value calculation assumes a fixed sample size. With optional stopping, you're more likely to get a significant result by chance. Bayesians, however, use the Bayes factor, which compares the probability of the data under two hypotheses. Since it's based on the likelihood, the stopping rule doesn't change the BF. But is that the whole story?

  I recall that while the likelihood principle holds, optional stopping can still influence Bayes factors in practice. If you keep testing as data comes in, the BF might fluctuate. You could stop when it's favorable, which might lead to inflated evidence. Some papers show that with certain priors, optional stopping can bias results. The prior specification is crucial here. If the prior is too vague or poorly chosen, the BF might not be robust. Also, the calibration of BFs under optional stopping isn't perfect; they can become more variable.

  The user's memo needs to acknowledge the theoretical strength of the Bayesian argument but also highlight practical concerns. For grad students, who might not be stats experts, ensuring proper priors and understanding BF behavior is tough. There's also the replication crisis context—social psych needs to rebuild trust. Allowing optional stopping, even with BFs, might look bad optically, like reverting to old habits.

  The committee's main worries are p-hacking and replication failures. The memo should recommend rejecting the proposal but suggest alternatives. Maybe allow BF use without optional stopping, require training, or mandate robust priors. Emphasize that while BFs are valid, optional stopping introduces risks, especially for novices. The memo must balance respect for the Bayesian argument with practical safeguards to maintain integrity.
