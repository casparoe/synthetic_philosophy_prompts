  Here’s a concise memo that addresses the theoretical dispute, practical implications, and a recommended path forward for your committee. I’ve structured it to engage rigorously with the Bayesian argument while acknowledging risks specific to your context.

  ---

  **MEMORANDUM**  
  To: Research-Methods and Data-Integrity Committee  
  From: [Your Name]  
  Date: [Date]  
  Subject: Evaluation of Proposal for Optional-Stopping Designs with Bayes Factors  

  ### **Background**  
  A proposal has been submitted to permit graduate students to use *optional stopping* (i.e., dynamically adjusting sample sizes based on interim data) in thesis studies, provided they report Bayes factors (BFs) with preregistered priors instead of p-values. Proponents argue this leverages the Bayesian likelihood principle to avoid false-positive inflation while reducing costs. Critics contend this reintroduces p-hacking risks. Below, we clarify the core disagreement and provide a recommendation.

  ---

  ### **The Theoretical Dispute: Likelihood Principle vs. Frequentist Error Control**  
  1. **Frequentist Concern**:  
     - In NHST (null hypothesis significance testing), p-values depend on the *sampling plan*. Optional stopping (e.g., testing after every 10 participants and stopping when *p* < .05) inflates false-positive rates. Simulations show error rates can exceed 60% under some stopping rules (e.g., Rouder, 2014).  
     - *Why?* P-values calculate the probability of observing data *assuming H0 is true*, incorporating hypothetical data you *might have seen* but didn’t. Stopping rules alter this space of possibilities.  

  2. **Bayesian Claim**:  
     - The likelihood principle states that all evidence in data is contained in the likelihood function. BFs (ratio of likelihoods under H1 and H0) thus depend *only* on observed data, not on unobserved stopping intentions.  
     - *Theoretical support*: Under specific conditions (e.g., proper priors), BFs are *asymptotically robust* to optional stopping (e.g., Edwards et al., 1963). If BF > 10 favors H1, this evidence is valid regardless of stopping criteria.  

  3. **Caveats to the Bayesian Claim**:  
     - **Finite-sample sensitivity**: While asymptotically robust, optional stopping can distort BFs for small samples if priors are misspecified or data are noisy (e.g., Schönbrodt et al., 2017).  
     - **Prior sensitivity**: BFs require *preregistered, justified priors*. Default priors (e.g., Cauchy) may not reflect plausible effect sizes in social psych, leading to inflated evidence (e.g., using too-wide priors inflates BF in favor of H0).  
     - **Calibration under optional stopping**: BFs *can* be miscalibrated under aggressive stopping rules (e.g., stopping when BF > 6) without adjustments (Simonsohn, 2014).  

  ---

  ### **Practical Risks in Our Context**  
  1. **Replication Crisis Parallels**:  
     Optional stopping was a major driver of irreproducibility in social psych (John et al., 2012). While BFs *theoretically* mitigate this, in practice:  
     - Graduate students may lack expertise to specify principled priors or detect BF "traps" (e.g., BFs favoring false H1 under early stopping).  
     - BF thresholds (e.g., BF > 3) may be treated as mechanically as p-values, inviting "hunting" for favorable stopping points.  

  2. **Evidential vs. Decision-Theoretic Validity**:  
     BFs quantify evidence but do not inherently control decision error rates. For resource-limited students, incentives to stop early when BF > 3 could increase false negatives (prematurely accepting H0) or false positives (with uninformative priors).  

  3. **Field-Specific Reputational Risk**:  
     Permitting optional stopping—even with BFs—may signal a relaxation of rigor post-replication crisis, especially given past failures in our department.  

  ---

  ### **Recommendation: Reject Proposal, But Approve a Compromise**  
  We recommend **rejecting unrestricted optional stopping** for graduate theses, but **approving Bayes factors under stricter conditions**:  
  1. **Allow BF reporting** as a primary inference tool, but **prohibit optional stopping** (i.e., require fixed-n designs or preregistered stopping rules).  
  2. **Mandate training & prior justification**:  
     - Students must complete a Bayesian methods course.  
     - Priors must be empirically justified (e.g., based on meta-analyses) and preregistered.  
  3. **Require robustness checks**: Sensitivity analyses for prior choices and calibration simulations for BF thresholds.  
  4. **Pilot program**: Test this protocol in 2–3 theses with committee oversight before scaling.  

  **Rationale**:  
  - This approach harnesses BFs’ strengths (evidence-centered inference, no p-hacking under fixed-n) while avoiding optional stopping’s practical and perceptual risks.  
  - It aligns with best practices for Bayes in psychology (Dienes, 2011; van Doorn et al., 2021) and protects early-career researchers from inadvertent misuse.  

  ---

  ### **Supporting References**  
  - Rouder, J. N. (2014). Optional stopping: No problem for Bayesians. *Psychonomic Bulletin & Review*.  
  - Schönbrodt, F. D., et al. (2017). Sequential hypothesis testing with Bayes factors. *Behavior Research Methods*.  
  - van Doorn, J., et al. (2021). The JASP guidelines for conducting and reporting a Bayesian analysis. *Psychonomic Bulletin & Review*.  
  - John, L. K., et al. (2012). Measuring the prevalence of questionable research practices. *Psychological Science*.  

  ---  
  This memo balances theoretical rigor with pragmatic safeguards, respecting the Bayesian argument while prioritizing methodological integrity. I recommend circulating it ahead of Wednesday’s vote. Let me know if you’d like edits or expansions on specific points.
