answer: |-
  Here’s a dialogue between **Maya** (pushing the cluelessness objection) and **Alex** (a sophisticated consequentialist), wrestling with your exact dilemma over coffee. Both are well-read in EA literature, and neither backs down easily:

  ---

  **Setting:** A cluttered co-working space, laptops open beside mugs of cold coffee.

  **Maya:** (Leaning forward, elbows on the table)  
  "Alex, I’ve been re-reading Greaves’ ‘Cluelessness’ paper, and it’s wrecking my EA spreadsheet. Take your plan to shift donations from AMF to an AI safety org. You think you’re trading off 10,000 lives saved *now* for a 0.01% chance of preventing extinction later. But that’s *exactly* the hubris Greaves dismantles. How can you possibly assign expected value (EV) when *every* action has unforeseeable, potentially catastrophic long-tail effects? Saving lives today might accelerate resource depletion, or alter political trajectories that lead to worse wars. Funding AI safety might *delay* beneficial AI, or create a false sense of security that *causes* disaster. The point isn’t uncertainty—it’s that these effects might systematically *invert* near-term EV calculations. We’re clueless in principle."

  **Alex:** (Nodding slowly)  
  "Okay, hard cluelessness. Let’s grant it’s a real epistemic barrier. But consequentialism isn’t about *omniscience*—it’s about *rational action under ignorance*. First, ask: is this a *special* problem for consequentialism? If I follow a deontological rule like ‘don’t lie,’ I might cause unforeseeable harm too. Every theory faces cluelessness; consequentialism just admits it openly. Second—and this is key—consequentialism isn’t a demand to *simulate the multiverse*. It’s a *decision procedure*: use your best empirical guesswork to maximize *expected* good. If we throw up our hands because ‘anything could happen,’ we paralyze all action."

  **Maya:** (Tapping the table)  
  "But that’s the evasion Greaves anticipates! Saying ‘just use your best guess’ ignores that our ‘best guesses’ might be *structurally biased*. Near-term effects (bednets saving kids) are observable and quantifiable; long-term effects (how those kids alter the future) aren’t just unknown—they’re *radically opaque*. When you compare AMF’s EV to an AI org’s, you’re comparing a moderately certain, moderate-stakes good to a wildly uncertain, existential-stakes good. But if cluelessness means the *sign* of AMF’s long-term impact could flip from + to - with equal likelihood, its *net* EV might be near-zero—or negative! How is that comparable?"

  **Alex:** (Raising a finger)  
  "Two responses. First: the ‘washing out’ hypothesis. Unpredictable long-run effects might be *symmetrically distributed* around zero. For every AMF-funded kid who starts a war, another might prevent one. If positive/negative tail risks balance *in expectation*, we can focus on near-term effects. Second: *asymmetry*. Some actions have *predictably directional* long-term biases. Preventing human extinction via AI is net-positive *unless* you think a dead universe is preferable—which is a wild claim. Whereas AMF’s long-term impact *could* plausibly be net-negative via overpopulation stress. If anything, cluelessness might *favor* longtermism!"

  **Maya:** (Eyes narrowing)  
  "Clever, but you’re smuggling in assumptions. ‘Washing out’ assumes unforeseeable effects are *random*, not systematically skewed by our intervention. But Greaves argues that *purposeful* acts (like saving lives) could trigger *non-random* cascades—e.g., altering demographic/technological tipping points. And your asymmetry point? It assumes we can *know* extinction is bad. But if AI safety research hastens a *dystopian* lock-in, extinction might be preferable! We can’t rule it out. That’s the cluelessness trap: we can’t even trust *ordinal rankings* (extinction < dystopia < flourishing) because we’re blind to what ‘flourishing’ *actually* entails in 10,000 years."

  **Alex:** (Leaning back, pausing)  
  "Fair. But let’s distinguish *consequentialism as criterion* vs. *decision procedure*. The *criterion* (‘right acts maximize good consequences’) may be cluelessness-vulnerable. But the *decision procedure* (‘use best available EV estimates’) is still our best tool. Why? Because *not* using it doesn’t avoid cluelessness—it surrenders to moral luck. If I donate to AMF and it accidentally causes catastrophe, I acted rightly *by the decision procedure*, even if wrongly *by the ultimate criterion*. We’re blameless if we use the best process we have."

  **Maya:** (Shaking her head)  
  "Process doesn’t resolve the practical dilemma. If cluelessness means AMF’s *true* EV is incalculable, maybe the ‘best process’ is to prioritize actions with *shorter causal chains*—like direct aid—where unpredictability is bounded. Or to avoid *large-scale interventions* entirely, since they have more chaotic tails. AI safety is the *epitome* of a long, chaotic causal chain! By contrast, bednets have local, measurable effects. Ignoring cluelessness might push us toward hubristic, high-stakes gambles with civilization."

  **Alex:** (Leaning in intently)  
  "Ah, but ‘shorter chains’ is arbitrary. AMF saves a child who becomes a dictator—chain length: 40 years. AI safety prevents a 2040 catastrophe—chain length: 20 years. Which is ‘shorter’? And avoiding large-scale actions is itself a high-stakes bet: *not* working on AI might guarantee doom. Cluelessness cuts both ways. That’s why I fall back on *differential predictability*: we *can* estimate AMF’s 10-year impact better than an AI org’s 100-year impact. But for AI, the *stakes* (extinction) are so high that even a tiny, poorly estimated chance of success dominates. It’s Pascal’s Wager with error bars—and the downside of *not* acting is near-infinite."

  **Maya:** (Sighing)  
  "…And the downside of acting could *also* be near-infinite if we get the sign wrong. But point taken. I’ll concede that if you *define* extinction as infinitely bad, and you assign >0 probability to AI safety working, longtermism wins mathematically. But that feels like cheating—it hand-waves the cluelessness by brute-forcing the math with infinities. Real-world decisions can’t rely on that."

  **Alex:**  
  "Agreed—it’s unsatisfying. So let’s abstract less. In *your* case: donate to AMF or AI safety? I’d say: if you believe cluelessness is *total* (no EV estimates are trustworthy), then flip a coin—but that’s nihilistic. If you believe some EV estimates are *less unreliable* than others, AMF wins on shorter time horizons. If you believe tail risks are *asymmetric and dire* (e.g., extinction risk is urgent and neglected), AI safety wins. But crucially: **cluelessness doesn’t absolve us of choosing**. It just forces epistemic humility. We *still* have to place our bets."

  **Maya:** (Stirring cold coffee)  
  "…And my bet is that in a clueless world, the less we mess with unpredictable, civilization-scale levers, the better. I’m sticking with AMF. But I’ll grant your core point: consequentialism isn’t *uniquely* hobbled by cluelessness. It’s the human condition. We just disagree on the least-terrible heuristic."

  **Alex:**  
  (Smiling wryly) "Exactly. So donate split 50-50 and pray the cluelessness gods are merciful?"

  **Maya:** (Chuckles)  
  "Deal. But next time, let’s argue about something easier—like quantum gravity."

  ---

  ### Key Takeaways from the Dialogue:
  1. **Cluelessness’s Core Challenge**: Even sophisticated EV estimates may be invalid if long-term effects systematically undermine near-term predictions.  
  2. **Consequentialist Defenses**:  
     - *Washing Out*: Unpredictable effects may cancel out in expectation.  
     - *Asymmetry*: Some outcomes (extinction) have clear valence (bad).  
     - *Decision vs. Criterion*: We’re responsible for using the best *process*, not achieving perfect outcomes.  
     - *Differential Predictability*: Some causes (global health) have shorter, more measurable feedback loops.  
  3. **Your Decision Levers**:  
     - If you prioritize *lower predictability* → AMF.  
     - If you prioritize *higher stakes* → AI safety.  
     - If you’re deeply uncertain → Split donations or prioritize meta-work (e.g., improving forecasting).  

  Both characters "win" by exposing the other’s assumptions without resolving the underlying tension—because in philosophy, sometimes clarity *is* the victory.
