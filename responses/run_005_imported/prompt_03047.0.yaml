  The user’s examples—surrogate goals and simulated conflicts—are concrete. For surrogate goals, making threats ineffective ensures that even if agents play tough, the principal’s real goals aren’t harmed. That’s an SPI because it helps regardless of the equilibrium. Similarly, replacing real conflict with a cheap simulation avoids worst-case scenarios, beneficial no matter how agents negotiate.

