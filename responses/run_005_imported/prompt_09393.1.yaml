prompt: |-
  I don't have any formal training in philosophy, but over the past year I've become quite absorbed in the cosmological argument after following online debates about it — the kind where someone lays out the kalam version (everything that begins to exist has a cause, the universe began to exist, so the universe has a cause) and someone else objects that an infinite past isn't actually impossible. Wanting to see the argument before William Lane Craig's modern repackaging of it, I tracked down a free translation of the Summa Theologica and read through the question where Aquinas asks directly whether reason alone can prove that the world had a beginning. To my surprise, his answer is no: he says that's something held by faith, not demonstration, which already didn't match how I'd always heard "the cosmological argument" described. What really stopped me was a little further on, in his reply to an objection arguing that if the world were eternal, there would have to be an infinite chain of fathers begetting sons stretching back forever — supposedly just as impossible as an infinite chain of causes. Here is his reply in full, from that translation (this is Summa Theologica I, Question 46, Article 2, Reply to Objection 7, in the old Dominican Fathers translation):

  "In efficient causes it is impossible to proceed to infinity per se—thus, there cannot be an infinite number of causes that are per se required for a certain effect; for instance, that a stone be moved by a stick, the stick by the hand, and so on to infinity. But it is not impossible to proceed to infinity "accidentally" as regards efficient causes; for instance, if all the causes thus infinitely multiplied should have the order of only one cause, their multiplication being accidental, as an artificer acts by means of many hammers accidentally, because one after the other may be broken. It is accidental, therefore, that one particular hammer acts after the action of another; and likewise it is accidental to this particular man as generator to be generated by another man; for he generates as a man, and not as the son of another man. For all men generating hold one grade in efficient causes—viz. the grade of a particular generator. Hence it is not impossible for a man to be generated by man to infinity; but such a thing would be impossible if the generation of this man depended upon this man, and on an elementary body, and on the sun, and so on to infinity."

  I have reread this more times than I want to admit, and I still can't pin down what is actually doing the work in the per se/accidental distinction. On the surface, both the stick-hand-stone chain and the father-son chain look like one thing causing the next thing in a line, so why does the first need a starting point and the second not? The hammer example confused me even further, since it sounds like Aquinas is saying the hammers were never really one causal series in the first place — and I don't see why that same move couldn't be made about the stick and the hand. I would also like to understand how much this passage is really carrying: is this distinction the actual reason Aquinas doesn't need the universe to have a beginning in time, unlike the kalam argument, or is it a narrower point that just happens to live in this section? And separately, his "argument from contingency" elsewhere in the same work (the one about possible versus necessary beings) often gets treated as interchangeable with this one — does it rely on the same per se/accidental machinery, or does it sidestep the issue entirely? I would rather get a close reading of what Aquinas is actually claiming here than the usual capsule summary of "the Five Ways."
reasoning: |-
  Okay, the user is diving deep into Aquinas's cosmological argument, specifically the per se vs. accidental cause distinction in Summa Theologica. They're confused about why Aquinas allows infinite father-son chains but not infinite cause-effect chains like stick-hand-stone. They also wonder how this fits into Aquinas's broader view of the universe's beginning and how it differs from the Kalam argument. Plus, they're curious if the contingency argument uses the same machinery.

  First, I need to unpack Aquinas's distinction clearly. The key is understanding the dependency structure. Per se causes are hierarchically dependent—each cause relies on the prior one simultaneously. Like the hand moving the stick moving the stone: all must exist and act at the same time. If any link is missing, the effect stops. So an infinite chain here would require an actual infinite series of concurrent dependencies, which Aquinas thinks is impossible without a first cause.

  Accidental causes are temporally sequential and independent in their causal power. Each father begets a son but doesn't rely on his own father to exist when he acts. The son's existence depends on the father at conception, but once born, the son can beget without the grandfather. The causes aren't all acting at once; each acts at their own time. So an infinite past here doesn't require an infinite concurrent stack, making it possible.

  The hammer example is tricky. The user thought it might imply the hammers aren't a causal series. But Aquinas means that multiple hammers used by one artisan are accidental because each hammer acts independently when used, not as a chain. The artisan is the per se cause; hammers are just interchangeable tools. If one breaks, another replaces it—no dependency chain among hammers themselves. This contrasts with the stick-hand-stone where each link depends on the previous.

  Now, connecting to the universe's beginning. Aquinas doesn't use the cosmological argument to prove the universe began. His Five Ways argue for a first cause but not necessarily a temporal beginning. The per se/accidental distinction explains why an eternal universe is philosophically possible for Aquinas, while faith holds it had a beginning. This is a key difference from Kalam, which insists on a temporal start.

  Regarding the contingency argument (Third Way), it's different. It deals with possible vs. necessary beings, not temporal chains. It argues that if everything were contingent, there would be nothing now, so there must be a necessary being. This doesn't rely on per se vs. accidental chains but on modal dependency. So it sidesteps the infinite regress issue in another way.

  The user might also be seeking clarity on why Aquinas's view isn't more widely emphasized. Modern discussions, especially with Kalam's popularity, often conflate cosmological arguments. Highlighting Aquinas's nuanced approach could address their frustration with oversimplified summaries.

  Deep needs: The user is self-taught, engaging with primary texts, and noticing discrepancies in popular representations. They want accurate exegesis, not canned answers. They might feel that standard philosophy summaries gloss over these nuances, leading to confusion. By unpacking Aquinas's distinctions thoroughly, I can help them grasp the underlying principles and appreciate the historical context versus modern interpretations.
answer: |-
  You've hit upon one of the most subtle and crucial distinctions in Aquinas's metaphysics – and one often glossed over in popular presentations. Your confusion is understandable; Aquinas is packing dense scholastic concepts into a few sentences. Let's break down his *per se* vs. *per accidens* causal series distinction step-by-step, using his own examples and clarifying the machinery at work:

  **1. The Core Distinction: What Makes a Series *Per Se*?**

  *   **Simultaneous Dependence:** A *per se* (essential/subordinate) series requires **all members to be simultaneously active and causally dependent** for the *present effect* to exist or occur *right now*.
  *   **Hierarchical Order:** The causes are ordered hierarchically by their *kind* of causality. A later member in the series depends entirely on the prior member *acting here and now* to exert its own causality. Remove an earlier link, and the entire chain collapses *instantly*.
  *   **Example - Stick-Hand-Stone:** Aquinas uses this precisely because it illustrates simultaneous dependence:
      *   The stone is moving *now* **because** the stick is pushing it *now*.
      *   The stick is pushing the stone *now* **because** the hand is moving the stick *now*.
      *   If the hand stops moving *right now*, the stick stops pushing *right now*, and the stone stops moving *right now*.
      *   The stick has *no inherent power* to move the stone independently of the hand's *current* action. Its causality is *instrumental* and *derived entirely* from the hand.
  *   **Why Infinity is Impossible *Per Se*:** An infinite *per se* series would mean that the existence/action of every cause *right now* depends on an infinite chain of prior causes *also acting right now*. There is no ultimate source of the causal power being transmitted *in this instant*. It would be like an infinite line of gears turning *now*, with no first gear actually driving the motion. Aquinas argues this is metaphysically absurd – the causal power must originate from a primary source (*primum movens*) *existing and acting now*.

  **2. The Core Distinction: What Makes a Series *Per Accidens* (Accidental)?**

  *   **Temporal Succession, Not Simultaneous Dependence:** A *per accidens* (accidental/ordered) series involves causes linked **only by temporal sequence**, *not* by simultaneous dependence for the *present* effect.
  *   **Independent Causal Power:** Each member in the series possesses the **full causal power** required for its *own* effect **independently** of the *current* action of prior members. The prior cause's action is complete; its effect (the next cause) now exists and acts *on its own*.
  *   **Example - Father-Son Chain:** This exemplifies the key points:
      *   Father A begets Son B at time T1. At T1, Father A is the *active efficient cause*; Son B is the *passive effect*.
      *   **Crucially:** Once Son B *exists* (at T2, after T1), he possesses the inherent power of human generation *in himself*. He doesn't need Father A to be *actively causing him* while *he* begets Son C at time T3.
      *   When Son B begets Son C at T3, Father A (the grandfather) may be long dead. His causal act (begetting B) is complete. B's act of begetting C is *his own* act, using *his own* generative power. He generates "as a man," not "as the son of A." A's prior existence was necessary for B *to exist*, but it is **not** necessary for B *to act as a cause* once he exists.
      *   The "order" Aquinas mentions is the *generic* order of "human generator." All fathers hold the *same causal grade* – they are all particular instances of "man generating." One father isn't the *instrument* of the grandfather in the act of begetting his *own* son.
  *   **Why Infinity is Possible *Per Accidens*:** Since each cause acts *independently* once it exists, the chain doesn't require an infinite stack of causes all acting *simultaneously now*. Each cause acts at its own time, drawing on its own inherent power (derived from its nature, ultimately from God as First Cause of *being*, but not as a prior *temporal* link in *this specific chain*). An infinite past sequence of fathers begetting sons is conceivable because no *single present effect* (e.g., *this* son being begotten *now*) depends on an infinite number of *simultaneously acting* prior causes.

  **3. The Hammer Example Clarified:**

  *   Aquinas uses this to reinforce the *per accidens* point. The Artisan (the *per se* cause) needs *a* hammer to act. He uses Hammer 1, it breaks. He picks up Hammer 2, it breaks. He picks up Hammer 3...
  *   **Why *Per Accidens*:** The causal series of hammers is *accidental* because:
      *   The Artisan is the *primary efficient cause* of the artifact *at all times*.
      *   Hammer 2 does **not** depend on Hammer 1 *acting now* for Hammer 2 to be used *now*. Hammer 1's action (and breaking) is past and complete.
      *   The only essential link is the Artisan to *the hammer he is currently using*. The prior hammers are irrelevant to the *current* causal act of Hammer N. Their sequence is accidental to the *current* production.
      *   The "order of only one cause" is the Artisan's causal power. The multiplication of hammers is accidental to that single, ongoing causal power.
  *   **Contrast with Stick-Hand:** If the Artisan were like the hand, and the current hammer like the stick, then *if* the hammer broke *while striking*, the artifact's formation *would* stop instantly (like the stone stopping). But Aquinas's point is that the *sequence* of broken hammers doesn't create a *per se* chain *among the hammers themselves*. Each hammer's use is a separate, self-contained instrumental act by the Artisan.

  **4. How Much is This Passage Carrying? (The Big Picture)**

  *   **Narrow Point:** Directly, this reply **only** addresses the specific objection about infinite father-son chains. Aquinas is showing that *this particular type* of infinite regress is *not* metaphysically impossible, unlike the *per se* chain required for motion or change *here and now*.
  *   **Broader Significance:** This distinction is **absolutely fundamental** to Aquinas's entire project of reconciling faith (in creation *ex nihilo* with a temporal beginning) with philosophy/reason.
      *   **Reason Cannot Prove Temporal Beginning:** Aquinas argues elsewhere (as you noted) that reason/philosophy alone *cannot* demonstrate the world had a beginning. The *per se/per accidens* distinction is a key part of *why*. An eternal universe with an infinite *per accidens* chain of past events (like generations) is *thinkable* without contradiction. The impossibility of an infinite *per se* series proves the need for a First Cause *now*, not necessarily a First Cause *in time*.
      *   **First Cause vs. Temporal Beginning:** The **Five Ways** (especially the First and Second) argue for a First Uncaused Cause or Unmoved Mover based on the impossibility of infinite *per se* causal regress *in the present order of sustaining causes*. This First Cause (God) is required to explain why anything exists or changes *right now*, regardless of whether the universe has existed for a finite or infinite time. The Kalam conflates the need for a First Cause with a temporal beginning. Aquinas rigorously separates them: God is the First Cause sustaining *all* being and change, whether the universe is eternal *a parte ante* (in the past) or had a beginning.
      *   **God as Sustainer:** In an eternal universe, God would still be the First Cause, not as the first temporal event, but as the eternal, ontologically primary source of *all* being and causality *at every moment*, including sustaining the entire infinite *per accidens* chain of past events. The hammer artisan analogy applies: God is the primary cause; the temporal sequence of events is the accidental series of instruments.

  **5. The Argument from Contingency (Third Way) - Does it use the same machinery?**

  *   **Different Focus:** The Third Way deals with **modal necessity** (necessary vs. contingent existence) and **causal dependency for existence itself**, not primarily the *structure* of causal series over time or simultaneity.
  *   **Mechanism:** It argues:
      1.  We find contingent things (things that can not-exist).
      2.  If *everything* were contingent, then, given infinite time, everything would have ceased to exist at some point (since what can not-exist, given infinite time, must at some point not-exist).
      3.  If everything ceased to exist, nothing would exist now (ex nihilo nihil fit - nothing comes from nothing).
      4.  But things *do* exist now.
      5.  Therefore, not everything can be contingent; there must exist a Necessary Being (whose existence is not dependent on or caused by anything else).
  *   **Relation to *Per Se/Per Accidens*:**
      *   **Sidesteps the Temporal Regress?** It doesn't directly address an infinite *temporal* regress of contingent causes (*per accidens*). Its focus is the *modal status* of beings *now* and the ultimate source of *existence itself*.
      *   **Implicit *Per Se* Dependency?** While not explicitly framed in those terms, the dependency of contingent beings *for their very existence* can be seen as a kind of *per se* dependency *right now*. The contingent thing *exists now* only because it is *being sustained in existence now* by something else (ultimately the Necessary Being). If that sustaining cause ceased *now*, the contingent being would cease *now*. This resembles the simultaneous dependence of a *per se* series. Aquinas likely saw the sustaining cause of existence as a *per se* dependency requiring a First Cause *now*.
      *   **Addresses a Different Problem:** The Third Way primarily tackles the question "Why is there something rather than nothing?" grounded in the nature of being. The *per se/per accidens* distinction primarily tackles the structure of causal chains explaining motion/change or generation. Both lead to God as First Cause, but via different metaphysical routes. The Third Way doesn't *rely* on the *per se/per accidens* machinery about series structure; it uses modal logic and the principle of causality applied to existence itself.

  **In Summary:**

  *   **Per Se Series:** Simultaneous, hierarchical dependence for a *current effect*. Requires a First Cause *acting now* (e.g., Hand->Stick->Stone moving *now*). Infinite regress impossible.
  *   **Per Accidens Series:** Temporal sequence of independent causes. Each cause acts on its own power once it exists. No *single present effect* depends on an infinite number of *simultaneously acting* prior causes (e.g., Father begets Son, who later begets Grandson; the Son's act doesn't require the Father *acting now*). Infinite regress *possible*.
  *   **Significance:** This distinction allows Aquinas to argue philosophically for a First Cause sustaining the universe *here and now* (via impossibility of infinite *per se* regress) *without* needing to prove a temporal beginning (allowing for the possibility of infinite *per accidens* past events, like generations, known only by faith to have begun).
  *   **Contingency Argument:** Proves a Necessary Being based on modal dependency for existence *now*. It doesn't explicitly use the *per se/per accidens* series structure but addresses a different facet of causality (source of existence itself). The sustaining cause of existence *can* be seen as a *per se* dependency requiring a First Cause.

  Your close reading of the primary text has led you to the very heart of Aquinas's sophisticated metaphysics. The popular "cosmological argument" often flattens these crucial distinctions, making Aquinas sound more like a proponent of the Kalam than he actually was. His focus was always on the *metaphysical ground* of present being and change, not solely on a temporal starting gun.
