prompt: |-
  So we went on this whole tangent in my stats class about Bayesian decision theory (my teacher's kind of obsessed with this stuff, not complaining) and she brought up this thing called Good's theorem -- as in I.J. Good, not "good" as in the adjective, which confused me for a solid five minutes -- that apparently proves a rational Bayesian agent should never turn down a chance to look at more evidence before deciding something, as long as the evidence is free, because the expected payoff of looking can't be negative, only zero or positive. Me and my friend Marcus have been arguing about it alot since then. He thinks its obviously wrong because there's plenty of stuff people are better off not knowing -- like getting a genetic test for a disease with no treatment, or a jury only being shown cherry-picked evidence by lawyers who each have their own agenda, or (his favorite one) how if everyone could perfectly foresee their own future health risks, insurance would basically stop existing since nobody could get pooled with anyone else anymore.

  Can you write me an essay that actually settles this instead of just laying out both sides and shrugging? I want it to first explain why the theorem is true in the first place (like what's actually doing the work in the proof, not just "trust me it's a theorem"), then go through the strongest versions of Marcus's objections and work out, for each one, whether it's a genuine counterexample to what the theorem claims, or whether it's secretly smuggling in a hidden cost, a change in what decision is even being made, or some multi-person/adversarial-evidence situation the theorem was never built to cover. Then give me an actual verdict at the end, not a "well it depends" cop-out -- does the theorem really mean a rational person should always want more free information, full stop, or is that a way weaker and narrower claim than it sounds like at first? You can just treat "rational" in the Bayesian expected-utility sense throughout, that's the sense we were using in class.
