  First, I need to recall Good's theorem. It states that for a rational Bayesian agent, the expected value of information (EVOI) can't be negative. The proof relies on the law of total expectation. The agent updates beliefs via Bayes' theorem, and since decisions maximize expected utility, integrating over possible evidence should show non-negative EVOI. The key is that information is free and doesn't change the available actions.

  Now, Marcus's objections: genetic testing for untreatable diseases, adversarial evidence in court, and insurance pooling with perfect foresight. For each, I need to check if there's a hidden cost, a change in decisions, or if it's outside the theorem's scope.

  Genetic testing: Marcus argues knowing about an incurable disease causes distress. But the theorem assumes utility is based on outcomes, not beliefs. If anxiety affects utility, that's a cost. Also, the decision set might change—like preparing for the disease, which wasn't an option without the test. So it's not a counterexample; it's adding costs or changing actions.

  Adversarial evidence: Lawyers cherry-pick evidence. The theorem assumes evidence is generated by a fixed process. But in court, evidence is strategically selected. The agent's model might not account for the adversary's strategy, leading to manipulation. This is outside the theorem's assumptions, so it's not a counterexample but a different scenario.

  Insurance pooling: If everyone knows their risks, high-risk individuals can't pool with low-risk. The theorem is for individual decisions. When all agents have perfect info, the group dynamics change. The individual might still benefit from knowing, but systemic effects alter the insurance market. Again, not a counterexample; it's about multi-agent interactions.

  The verdict: Good's theorem holds under its assumptions—free info, rational updating, same action set. Marcus's examples introduce costs, adversarial contexts, or multi-agent systems. So the theorem isn't weaker; it's specific. A rational agent should always want free info within those bounds. The user needs a firm conclusion: the theorem is correct as stated, but real-world applications require checking assumptions.
answer: |-
  ## Good's Theorem: The Unflinching Logic of Free Information (And Why Marcus Isn't Wrong, Exactly)

  Your stats teacher's obsession with Bayesian decision theory is well-placed; it provides a remarkably coherent framework for rational choice under uncertainty. Good's theorem (yes, named after Irving John Good, the statistical powerhouse, not the adjective) is a cornerstone jewel in this framework. It asserts a seemingly bold claim: **A rational Bayesian agent, maximizing expected utility, should *never* refuse free information relevant to a decision.** Marcus's objections – genetic tests, cherry-picked evidence, insurance collapse – feel intuitively powerful. But do they shatter the theorem, or do they reveal the specific, rigorous world in which it operates? Let's dissect it.

  **I. Why Good's Theorem Holds: The Machinery of Expectation**

  At its core, Good's theorem is a consequence of the **Law of Total Expectation** and the definition of **rational choice as expected utility maximization.** Here's the gist of the proof, stripped down to its essential mechanics:

  1.  **The Setup:** An agent faces a decision `d` chosen from a set `D` of possible actions. The outcome and thus the utility `U(d, ω)` depend on both the chosen action `d` and the true, unknown state of the world `ω` (e.g., "has disease," "is guilty," "will have major health event"). The agent has prior beliefs `P(ω)` over possible states.

  2.  **The Baseline:** Without additional information, the rational agent chooses the action `d*` that maximizes *expected* utility based on the prior:
      `d* = argmax_{d ∈ D} E[U(d, ω)] = argmax_{d ∈ D} ∑_ω U(d, ω) P(ω)`
      The expected utility of this baseline decision is `V_0 = E[U(d*, ω)]`.

  3.  **The Offer of Free Evidence:** The agent is offered costless, relevant evidence `e` (e.g., a test result, a witness statement, a risk score). This evidence is generated by a likelihood function `P(e | ω)` – the probability of seeing evidence `e` given state `ω`. Critically, acquiring `e` costs *nothing* (no money, time, psychological toll) and doesn't change the available action set `D`.

  4.  **Conditional Decision:** *After* observing the specific evidence `e`, the rational agent updates their beliefs using **Bayes' theorem** to get the posterior `P(ω | e)`. They then choose the *best possible action given this new belief*:
      `d*(e) = argmax_{d ∈ D} E[U(d, ω) | e] = argmax_{d ∈ D} ∑_ω U(d, ω) P(ω | e)`
      The expected utility achieved *after* seeing `e` (but *before* knowing `e` for sure) is `E[U(d*(e), ω) | e]`. However, when deciding *whether to look at `e`*, the agent hasn't seen it yet. They need the *expected value* of this future optimized utility.

  5.  **The Expected Value of Information (EVOI):** This is the key quantity. It's the difference between the expected utility *with* the information and the expected utility *without* it, averaged over all possible evidence:
      `EVOI = E[ E[U(d*(e), ω) | e] ] - V_0`
      Where the outer expectation `E[·]` is taken over the marginal distribution of `e`, `P(e) = ∑_ω P(e | ω) P(ω)`.

  6.  **The Punchline (The Proof):** Why must `EVOI >= 0`?
      *   Consider the baseline decision `d*`. This is the best the agent can do *without* `e`. Crucially, `d*` is still available *after* seeing `e`. However, after seeing `e`, the agent might choose a *different* action `d*(e)` that is *better* given the updated beliefs.
      *   For *any possible* evidence `e`, the expected utility achieved by `d*(e)` (the optimal action *given `e`*) must be *at least as good* as the expected utility of `d*` (the old baseline action) *given `e`*. This is simply because `d*(e)` is defined as the maximizer given `e`, and `d*` is just one option in `D`:
          `E[U(d*(e), ω) | e] >= E[U(d*, ω) | e]` for every possible `e`.
      *   Now, take the expectation of both sides of this inequality over the distribution of `e`:
          `E[ E[U(d*(e), ω) | e] ] >= E[ E[U(d*, ω) | e] ]`
      *   The left side is the first term of the EVOI.
      *   The right side `E[ E[U(d*, ω) | e] ]` is the expected utility of sticking rigidly to the baseline action `d*` *after* seeing `e`. By the **Law of Total Expectation**, this is *exactly equal* to the baseline expected utility `E[U(d*, ω)] = V_0`!
      *   Therefore: `E[ E[U(d*(e), ω) | e] ] >= V_0`
      *   Which directly implies: `EVOI = E[ E[U(d*(e), ω) | e] ] - V_0 >= 0`

  **What's Doing the Work?**
  *   **Bayesian Updating:** Allows beliefs to correctly change with evidence.
  *   **Expected Utility Maximization:** Defines rationality as choosing the action with the highest expected payoff given current beliefs.
  *   **Law of Total Expectation:** Ensures that averaging conditional expectations gives the unconditional expectation.
  *   **Fixed Action Set (`d*` remains available):** This is crucial. The agent *always* has the option to ignore the new information and stick with `d*` after seeing `e`. Because `d*(e)` is chosen to be *at least as good* as `d*` *given `e`*, the agent can never be *forced* to do worse by having more information. They can only do better (`d*(e) > d*` given `e`) or the same (`d*(e) = d*` given `e`). Averaged over possible `e`, this means the expectation can't go down.

  **II. Dissecting Marcus's Objections: Costs, Contexts, and Mismatches**

  Marcus's intuitions highlight real-world complexities, but they largely operate *outside* the tightly controlled assumptions of Good's theorem. Let's examine each:

  1.  **Genetic Test for Untreatable Disease:**
      *   **Objection:** Knowing you'll get an incurable, debilitating disease (e.g., Huntington's) causes immense psychological suffering with no benefit, as no preventive action exists. You're better off not knowing.
      *   **Analysis:**
          *   **Hidden Cost (Psychological):** Good's theorem assumes information is *costless*. Here, the information itself directly induces disutility (anxiety, dread, depression). The utility function `U(d, ω)` isn't just about physical health outcomes and actions; it *includes* the psychological state induced by *knowing* `ω`. Learning `ω = disease` directly lowers utility, regardless of actions. This violates the "free information" assumption. The "cost" isn't monetary, it's experiential and incorporated into the utility calculation.
          *   **Change in Decision Scope?** Marcus argues "no treatment" implies no useful action. But is `D` truly unchanged? *Knowing* might enable actions: financial planning, lifestyle changes (maximizing quality time), family planning decisions, participating in clinical trials for symptom management, or simply the psychological action of "coming to terms." If *none* of these actions provide positive expected utility *after* knowledge compared to blissful ignorance (factoring in the psychological cost of knowing), it's because the utility function assigns a large *negative* value to the state of *knowing* the bad outcome is certain. The theorem still holds: if acquiring `e` (the test result) *itself* lowers expected utility *after* updating (because the psychological cost outweighs any benefit from optimized actions), then the EVOI calculation *will* be negative *because of the cost*, not because of the pure informational value. The theorem assumes no such cost.
      *   **Verdict:** Not a counterexample. It smuggles in a significant psychological cost that violates the "free information" assumption. The utility function inherently includes the disutility of possessing the knowledge.

  2.  **Cherry-Picked Evidence in a Trial:**
      *   **Objection:** A jury seeing only evidence selected by adversarial lawyers (each aiming to convict/acquire, not reveal truth) can be actively misled. Seeing only the prosecution's cherry-picked "proof" might make a juror *more* likely to wrongly convict than if they saw nothing and had to rely on weaker prior beliefs. Information isn't always beneficial if it's manipulated.
      *   **Analysis:**
          *   **Adversarial Evidence Generation:** Good's theorem assumes the evidence `e` is generated according to a fixed, known likelihood `P(e | ω)` that accurately reflects the relationship between evidence and state. In the adversarial setting, the likelihood function the *juror assumes* (`P_assumed(e | ω)`) is **not** the same as the likelihood function *actually used by the lawyers* to select evidence (`P_real(e | ω)`). The lawyers strategically choose `e` to maximize their chance of winning, *independent* of `ω`. They exploit the juror's assumed `P_assumed(e | ω)`.
          *   **Violation of Bayesian Assumption:** The juror updates using Bayes' theorem with `P_assumed(e | ω)`, expecting it to be diagnostic. But if `P_real(e | ω)` is manipulated (e.g., `P_real(e | innocent)` is high for very damning-looking `e`), the posterior `P(ω | e)` calculated by the juror becomes *miscalibrated*. The evidence isn't "truthful" in the Bayesian sense required by the theorem.
          *   **Rationality of the *Source*:** Good's theorem concerns the *recipient* of information. It assumes the information is generated by a process (`P(e | ω)`) that the recipient's model accurately captures. It doesn't account for a *strategic, adversarial sender* actively trying to distort the recipient's beliefs for their own gain. The juror is rationally updating based on a *flawed model* of how the evidence was generated.
      *   **Verdict:** Not a counterexample to the theorem's mathematical validity. It highlights a scenario *outside* its intended scope: **strategic information transmission** where the evidence-generation process is adversarial and not correctly modeled by the recipient. The theorem assumes evidence is generated by a fixed, non-strategic process (`P(e | ω)`). Here, the "free" evidence carries a hidden cost of potential manipulation due to adversarial generation.

  3.  **Perfect Health Foresight Destroying Insurance:**
      *   **Objection:** If everyone knew their exact future health risks with certainty, insurance markets would collapse. Low-risk individuals wouldn't subsidize high-risk ones. High-risk individuals couldn't afford premiums based on their true risk. Pooling disappears. Everyone is worse off than in the world with pooled risk based on average uncertainty.
      *   **Analysis:**
          *   **Shifting from Individual to Systemic:** Good's theorem is fundamentally about the decision of a **single agent** considering whether to acquire information *for themselves* relevant to *their own* action. Marcus's scenario is about **all agents simultaneously** acquiring perfect information, leading to a **system-wide shift in the game being played** (the insurance market structure).
          *   **Change in Available Actions (`D`):** Crucially, the *actions available* to an individual change dramatically based on what *others* know. In the uncertain world, "buy pooled insurance at average rate" is an available action (`d_insure`). In the perfect foresight world, this action *disappears* for high-risk individuals (no insurer offers them affordable coverage based on average risk) and becomes irrelevant for low-risk individuals (they can get very cheap insurance based on their known low risk). The action set `D` itself changes based on the information state of the *population*.
          *   **The Individual Calculation:** Consider just *one* rational agent *before* universal perfect foresight. Suppose they could *privately* learn their exact future risk. *According to Good's theorem, they should want to know!* Why?
              *   If they learn they are low-risk, they could (potentially) seek cheaper insurance or invest differently, increasing expected utility.
              *   If they learn they are high-risk, they could (potentially) buy *more* comprehensive insurance *while it's still available at pooled rates*, take aggressive preventative measures, or adjust financial plans, potentially increasing expected utility compared to being surprised later.
          *   **The Paradox:** The *individual* incentive to acquire information (as per Good) is rational. However, *if everyone acts on this incentive simultaneously*, the beneficial pooled insurance action (`d_insure`) vanishes, potentially leaving *some* individuals (the high-risk ones) worse off than in the original pooled equilibrium *with* uncertainty. The problem is that the *collective* outcome of everyone acting rationally (acquiring info) destroys a valuable social option (pooling) that relied on shared uncertainty.
      *   **Verdict:** Not a counterexample. Good's theorem correctly tells the *individual* that *private* information has non-negative EVOI *for their own decisions given the current system*. The collapse of insurance is a **multi-agent equilibrium effect** and a consequence of the *system* changing in response to widespread information acquisition. The theorem doesn't address the stability or desirability of social institutions built on uncertainty when information becomes available to all. It affirms the individual incentive, explaining *why* such collapses might occur if perfect foresight were possible.

  **III. The Verdict: Power Within Precise Parameters**

  Good's theorem is **mathematically sound and logically compelling within its explicitly defined domain.** It proves that for a rational Bayesian expected-utility maximizer:

  1.  Facing a fixed decision problem (fixed action set `D`, fixed state space `ω`).
  2.  With a known, accurate model of how evidence relates to the state (`P(e | ω)`).
  3.  Where acquiring evidence `e` is truly costless (no financial cost, no time delay penalty, no psychological disutility *from knowing itself*, no change in `D`),
  4.  And where the agent can freely choose *any* action in `D` *after* seeing `e` (including ignoring `e` and sticking with the original best action `d*`),

  **The Expected Value of Information (EVOI) is *always* non-negative. Therefore, the rational agent should *always* acquire such free, relevant information.**

  Marcus's objections, while highlighting important real-world phenomena, do not invalidate the theorem. They succeed by:

  *   **Introducing Costs:** Psychological distress from knowing (Genetic Test).
  *   **Violating the Evidence Model:** Adversarial evidence generation not captured by the agent's likelihood (Cherry-Picked Evidence).
  *   **Changing the Game:** Multi-agent systemic effects altering the fundamental decision landscape and available actions (Insurance Collapse).

  **The Final Answer:** Yes, Good's theorem really means a rational Bayesian agent *should* always want more *truly free and accurately modeled* information relevant to a *fixed* decision, *full stop*. However, the phrase "truly free and accurately modeled" carries immense weight. The theorem's power lies in its logical purity, not in being a universal prescription for human life. Marcus is right that in the messy real world, information often *isn't* free – it carries psychological burdens, is shaped by adversaries, or triggers complex systemic changes. Good's theorem doesn't deny this; it provides the pristine baseline against which these real-world complexities and hidden costs can be clearly identified and evaluated. It tells us that *if* we can isolate pure informational value within a stable decision frame, more knowledge is never rationally harmful. The challenge lies in recognizing when those stringent conditions actually hold.
