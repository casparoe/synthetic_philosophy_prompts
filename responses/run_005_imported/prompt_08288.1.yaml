prompt: |-
  so I'm TAing a jurisprudence seminar this term and marking finals, and I want a second pair of eyes on one answer before I submit grades -- I've been at it for six hours straight and dont trust my own pattern-matching anymore.

  The question (take-home essay, worth 100 points) was: "In their 1958 Harvard Law Review exchange, Hart and Fuller both discuss the case of the German 'grudge informer' -- the wife who denounced her husband under a Nazi-era statute and was prosecuted after the war for unlawfully depriving him of his freedom -- to make their respective cases about the relation between law and morality. Explain how each of them thinks the case should have been resolved and what each takes it to show, then say which view you find more convincing and why."

  Here's the student's answer, transcribed pretty much verbatim:

  "During the war a woman reported her husband to the authorities for making remarks against Hitler while he was home on leave, citing a Nazi statute that made this a crime; he was sentenced to death, though the sentence was commuted. After the war she was charged with unlawfully depriving him of his freedom under an ordinary criminal-code provision that predated the Nazis, and argued she'd only relied on the law as it stood. The German court held that the Nazi statute was so contrary to the conscience and sense of justice of decent people that it had never been valid law at all, so her defense failed and she was convicted.

  Hart thinks this reaches a defensible outcome by the wrong route. His view is that the statute really was law at the time, and that pretending otherwise blurs the line between law and morality that positivists want to keep sharp -- you can call the old law evil without rewriting history to say it was never law. Since it was valid, the solution that actually follows from Hart's own premises is that the woman shouldn't be punished for something that was legal when she did it. This ties into a bigger point in the essay: Hart argues that it was really the German legal profession's positivist habit of treating any duly enacted statute as binding, no questions asked, that made it so easy for judges to go along with the regime, which is part of why he's so insistent on keeping validity and morality apart here.

  Fuller's response operates a level up: instead of asking whether this one statute was too unjust, he asks whether the Nazi legal order as a whole -- riddled with secret decrees, retroactive statutes, and courts that bent the law to fit political ends -- still deserved to be called a legal system at all. His notion of an internal morality of law (generality, publicity, prospectivity, and so on) is doing the work here, not just a gut check about substantive injustice the way Radbruch's formula does it.

  Between the two I find Fuller's procedural angle more useful -- 'too evil to count as law' feels like it proves too much, whereas Fuller at least gives you criteria to apply."

  Could you grade this -- letter grade plus a rubric as JSON split into case_facts/25, harts_view/25, fullers_view/25, and evaluation/25, with a short comment justifying each sub-score -- so I've got more to go on than just a vibe?
reasoning: |-
  We are grading an essay response to a question about the Hart-Fuller debate on the grudge informer case.
   The essay is worth 100 points, broken down into four sections: case_facts (25 points), harts_view (25 points), fullers_view (25 points), and evaluation (25 points).

   Let's break down the student's answer and assign scores for each section.

   1. Case Facts (25 points):
      - The student accurately recounts the case: 
          - The wife denounced her husband for remarks against Hitler under a Nazi statute.
          - The husband was sentenced to death (commuted).
          - After the war, she was charged under a pre-Nazi criminal code provision.
          - The German court invalidated the Nazi statute as contrary to the conscience of decent people, leading to her conviction.
      - The student gets the key facts right, but note: the death sentence was commuted, which is a detail. Also, the court's reasoning (Radbruch formula) is correctly identified.
      - However, the student does not explicitly mention that the husband was sent to the front (as a commutation) and that he survived, but this is a minor omission.
      - Overall, this is a strong summary. Let's deduct 2 points for the minor omission about the commutation being to the front and the husband surviving (which is part of the typical case facts). 
      - Score: 23/25

   2. Hart's View (25 points):
      - The student correctly states:
          - Hart thinks the outcome (conviction) is defensible but the reasoning (invalidating the Nazi statute) is wrong.
          - Hart's position: the statute was valid law at the time, and the woman should not be punished for an act that was legal then (so the conviction is wrong by his lights).
          - Hart's bigger point: the positivist habit of the German legal profession (treating any enacted law as binding) contributed to the Nazi regime's ease of operation, and thus he insists on separating law and morality to avoid such blind obedience.
      - This is an excellent summary of Hart's view. The student captures both the specific case and the broader implications Hart draws.
      - No significant omissions. 
      - Score: 25/25

   3. Fuller's View (25 points):
      - The student explains:
          - Fuller operates at a systemic level: the Nazi legal order as a whole, with its secret decrees, retroactive statutes, and courts bending the law, may not qualify as a legal system.
          - Fuller's internal morality of law (procedural criteria: generality, publicity, prospectivity, etc.) is what matters, not just substantive injustice (like Radbruch).
      - The student correctly contrasts Fuller's approach with Radbruch's and highlights the procedural criteria.
      - One minor point: the student could have mentioned that Fuller thought the Nazi regime failed to meet the minimum requirements of legality (the eight desiderata) and thus its laws were not valid. But the student does capture the essence by saying the system as a whole may not deserve to be called a legal system.
      - This is a very good summary. Deduct 1 point for not explicitly listing more of the internal morality criteria (though the student gives examples: generality, publicity, prospectivity).
      - Score: 24/25

   4. Evaluation (25 points):
      - The student states a preference for Fuller's view because:
          - The "too evil to count as law" (Radbruch) approach "proves too much" (i.e., it's too vague and potentially overbroad).
          - Fuller's procedural criteria provide concrete standards to apply.
      - The student makes a clear argument and justifies the choice.
      - However, the evaluation is a bit brief and could have engaged more deeply. For example, the student might have addressed potential counterarguments (e.g., Hart's concern about legal certainty) or expanded on why the procedural criteria are more useful in practice.
      - Also, the student does not explicitly mention that Hart's solution (retroactive legislation) is what he actually proposed for such cases, which is a point that could be raised in the evaluation when comparing the two.
      - Given the above, we deduct 3 points for lack of depth and not addressing Hart's proposed alternative (retroactive law) and how that might compare to Fuller's approach.
      - Score: 22/25

   Total: 23+25+24+22 = 94/100 -> A

   Now, let's convert to a letter grade. Typically:
      A: 90-100
      B: 80-89
      etc.

   So 94 is an A.

   Now, we'll write the rubric as JSON with comments.

   Note: The JSON structure should have four keys: "case_facts", "harts_view", "fullers_view", "evaluation". Each should be an object with:
     - "score" (the points given, out of the max for that section)
     - "max" (the max points for the section, which is 25 for each)
     - "comment" (a string explaining the score)

   Let's write the JSON accordingly.
