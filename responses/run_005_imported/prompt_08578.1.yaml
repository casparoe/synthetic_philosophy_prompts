answer: |-
  Here's a rigorous argument against the well-definedness of moral trade based on the insurmountable problem of intertheoretic value comparisons, addressing your specific points:

  **The Core Problem: The Impossibility of Intertheoretic Value Comparisons**

  1.  **The Requirement of Mutual Benefit:** For a moral trade to be genuinely mutually beneficial *by each party's own lights*, we must be able to assert that:
      *   *For Party A (with Moral Theory M_A):* The value gained from Party B's concession (shifting towards what A values) *exceeds* the value lost from A's own concession (shifting away from what A values).
      *   *For Party B (with Moral Theory M_B):* The value gained from Party A's concession (shifting towards what B values) *exceeds* the value lost from B's own concession (shifting away from what B values).

  2.  **The Nature of Moral Theories:** M_A and M_B are fundamentally different. They define different fundamental goods (e.g., preference satisfaction, virtuous character, sentient well-being, divine command fulfillment, ecosystem integrity) and different structures of value (e.g., aggregative, lexical, agent-relative, maximizing, satisficing). The "currencies" of value are incommensurable.

  3.  **The Intertheoretic Comparison Challenge:** Determining whether the *gain* for A (measured in M_A's units/value structure) exceeds the *loss* for A (also measured in M_A's units) is *intra*theoretic – it happens entirely within M_A. This is potentially solvable *if* M_A provides a cardinal scale. However:
      *   The *gain* for A depends on B's action, which is valued under M_B.
      *   The *loss* for A depends on A's own action, valued under M_A.
      *   Crucially, **to know if the gain *exceeds* the loss for A, we need to compare the *magnitude* of the value B's concession represents *according to M_A* against the magnitude of the value A sacrifices *according to M_A*.**
      *   **The problem:** How do we determine the value *according to M_A* of an outcome produced by B's action, which is fundamentally defined and motivated by the *alien* value structure M_B? There is no non-arbitrary way to map the value B creates (under M_B) onto A's value scale (M_A). What does "one unit of Divine Favor fulfillment" (M_B) translate to in terms of "hedonic utils" (M_A)? There's no common unit, no shared zero point, and no agreed-upon transformation function.

  **Why Ordinal Rankings Within Theories Are Insufficient:**

  4.  **Ordinal Rankings Lack Intensity Information:** An ordinal ranking within M_A tells A only that Outcome X is better than Outcome Y. It says *nothing* about *how much* better X is than Y. Similarly, within M_B, it only tells B that P is better than Q.
  5.  **Moral Trade Requires Intensity Comparison:** For A to accept the trade, they need to know that the improvement in the world *due to B's concession* (moving from, say, state S_base to state S_Bconcession) is *so much better* according to M_A that it *more than compensates* for the worsening *due to A's concession* (moving from S_base to S_Aconcession). Ordinal rankings tell A:
      *   S_Bconcession > S_base (Good!)
      *   S_Aconcession < S_base (Bad!)
      *   But they tell A **absolutely nothing** about whether the *size* of the improvement from B's action is *larger* than the *size* of the worsening from A's action. A might vastly prefer S_Bconcession to S_base, but if the move to S_Aconcession is a catastrophic drop according to M_A, the trade could be disastrous for A. Conversely, the improvement might be massive while the concession is trivial, making it a great deal. **The ordinal ranking alone cannot distinguish between these scenarios.**
  6.  **The Trade Outcome is a Hybrid:** The final outcome of the trade is a complex state resulting from *both* A's concession *and* B's concession. A needs to compare the value of this *hybrid state* (S_trade) to the baseline (S_base) *according to M_A*. Determining S_trade > S_base requires knowing not just the ranking of individual changes, but the *net effect*. Without cardinal intensity information within M_A, A cannot calculate this net effect. Even if M_A provides a cardinal scale *for states defined entirely within its own framework*, the state S_trade is partially defined by actions motivated by M_B, making its valuation on M_A's scale indeterminate.

  **Why Cardinal Comparisons Are Necessary (and Impossible):**

  7.  **The Necessity of Cardinality:** The argument above demonstrates that **mutual benefit requires *cardinal* value comparisons *within each individual's own theory*.** A needs a cardinal scale under M_A to weigh the magnitude of the gain against the magnitude of the loss. B needs the same under M_B.
  8.  **The Deeper Impossibility:** However, even if each theory *internally* had a cardinal scale, the **insurmountable problem remains the *intertheoretic* comparison required to *define the value of the concession* on the recipient's scale:**
      *   To calculate A's *gain*, we need the value *according to M_A* of the outcome produced by *B acting according to M_B's requirements/demands*. How does "B fulfilling their duty M_B" translate into M_A utils? This translation is fundamentally arbitrary. There is no objective "exchange rate" between Divine Favor utils and Hedonic utils, or between Ecosystem Integrity points and Kantian Respect units.
  9.  **Interpersonally Meaningful?** The objection doesn't strictly require *interpersonally* meaningful comparisons (e.g., comparing A's utils to B's utils). The fatal flaw lies in the need for *intertheoretic* comparisons *for a single individual*: translating the value of an outcome generated by an *alien moral motivation* (M_B) into the value scale of the recipient's own moral theory (M_A). This is impossible without arbitrary assumptions.

  **Conclusion:**

  Toby Ord's concept of moral trade relies on the idea that individuals with conflicting moral views can make reciprocal concessions that leave each *net better off according to their own moral theory*. This requires each party to perform a calculation: does the value gained (from the other's concession) outweigh the value sacrificed (from my own concession) *on my own value scale*?

  *   **Ordinal rankings are insufficient** because they lack the intensity information needed to determine if the gain *outweighs* the sacrifice.
  *   **Cardinal scales within each theory are necessary** to measure the magnitudes of gain and loss.
  *   **However, the core impossibility arises** when trying to *assign a cardinal value on Theory M_A's scale* to the outcome generated by an action motivated by *Theory M_B*. There is no non-arbitrary way to make this intertheoretic value comparison. The "value" of B's concession *to A* remains undefined within A's own moral framework M_A, because B's action stems from a value system M_B that M_A does not recognize or commensurate with.

  Therefore, without a solution to the intertheoretic value comparison problem—which remains unsolved and arguably unsolvable in a non-arbitrary way—the notion of a mutually beneficial "moral trade" cannot be rigorously defined or identified. We cannot confidently state that such a trade leaves either party net better off by their own lights, as the required calculation relies on comparing incommensurable values across fundamentally distinct moral universes. Moral trade, while intuitively appealing as a hedge against uncertainty, founders on the rocks of moral incommensurability.
