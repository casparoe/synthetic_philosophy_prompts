answer: |-
  Here's the strongest case for the etiological view *without* biting the bullet or dismissing intuitions, centered on **derived proper function**:

  1.  **The Core Etiological Claim Isn't About Origins, It's About Explaining *Persistence*:** The etiological view isn't *primarily* about the very first origin of a trait. It's about explaining why that *type* of trait is *present and maintained* in a population *now*. Selection explains why hearts (as a type) exist in humans today – because ancestors with heart-pumps survived/reproduced better.

  2.  **Swampman is a Token, Not a Type:** Swampman is a singular, freak occurrence. Etiological functions are fundamentally assigned to *types* of traits within a *population* (or lineage) because they explain the trait's *recurrence*. Swampman has no population, no lineage, no recurrence. He's an *accidental token* resembling a functional *type*.

  3.  **Derived Proper Function via Duplication:** Here's the key move: Swampman's heart *derives* its proper function from the type it perfectly duplicates.
      *   **The Template:** Human hearts have the proper function *to pump blood* because that's what they were selected for in the human lineage.
      *   **The Copy:** Swampman's heart is a *molecular duplicate* of this selected type. It's not just *similar*; it's *identical in all relevant physical respects* to hearts that *do* have an etiological function.
      *   **Inheriting the Function:** Therefore, Swampman's heart has the *derived proper function* **to pump blood** *because it is a token of a type that has that proper function due to selection*. Its function isn't grounded in *its own* history (which is non-existent), but in its being a *faithful copy* of a structure *whose type* has a robust etiological function. The lightning strike accidentally created an instance of a functional type defined by evolution.

  4.  **Analogy: Artifacts and Blueprints:**
      *   A watch found on a beach has the function *to tell time* not because *it* was designed, but because it's a token of a type (watches) that *were* designed for that purpose. Its function is derived from the intentional design history of its type.
      *   Similarly, Swampman's heart has the function *to pump blood* because it's a token of a type (human hearts) that *were* selected for that purpose. Its function is derived from the natural selection history of its type.

  5.  **Addressing the "Easy Way Out":** This avoids saying "no function." It says Swampman's heart *does* have a proper function – pumping blood – precisely *because* it perfectly instantiates a structure whose very form and presence in the biological world *is explained by* that function being selected for in the lineage it copies. The function is parasitic on the real etiological history of the type it replicates.

  6.  **Why Causal Role Isn't Enough (The Etiological Counter):** The etiologist argues that *only* this derived etiological function captures why we intuitively say Swampman's heart *should* pump blood and would be *malfunctioning* if it didn't, even before any negative consequences occur.
      *   **Causal Role:** If function is just current causal contribution, then Swampman's heart pumping swamp sludge effectively (contributing to some weird swamp-system capacity) *would* give it a function, but intuitively, that's not its *proper* function. Its proper function is tied to what it's *supposed* to do based on its design/origin (even if derived).
      *   **Malfunction:** If Swampman's heart fibrillated uselessly immediately, we'd say it's malfunctioning *even if* the lightning strike never gave it a chance to contribute to any system capacity. The judgment of malfunction relies on a normative standard set by the selected function of the type it instantiates.

  **Strengths of this Argument:**

  *   **Preserves Intuition:** Grants that Swampman's heart has a function (pumping blood).
  *   **Upholds Etiological Core:** Maintains that proper functions are inherently historical (grounded in selection history, even if derivatively).
  *   **Explains Normativity:** Explains why malfunction judgments make sense for Swampman.
  *   **Avoids Ad Hoc Solutions:** It's an extension of existing etiological principles (function of types explaining tokens, derivation in artifacts) applied consistently.
  *   **Highlights the Type/Token Distinction:** Emphasizes a crucial element often overlooked in the Swampman intuition pump.

  **Potential Objections & Replies:**

  *   **"But the lightning strike isn't selection!":** True. But the argument doesn't claim Swampman's heart *has its own* selection history. It claims it *inherits* the function from the type it duplicates, whose form *is* explained by selection. The duplication process (lightning) is irrelevant; what matters is the fidelity to the selected type.
  *   **"Isn't this just sneaking in causal role?":** No. The causal role (pumping) is *consequential* to the function, but the *assignment* of the specific function (pumping blood *as its proper job*) comes from the history of the type. A causal role account might assign a different function based on what the heart *actually does* in the swamp system.
  *   **"What if it duplicates a vestigial organ?":** If Swampman duplicated a human with an appendix, the appendix would have the *derived proper function* that appendixes *had* in our ancestors (e.g., digesting cellulose?), even if it does nothing now. Its current causal idleness would be a vestige/malfunction relative to its derived proper function. This actually reinforces the etiological view's ability to distinguish vestigial traits.

  **Conclusion:**

  The strongest etiological defense against Swampman's embarrassment isn't to deny function, but to argue that Swampman's organs **inherit their proper functions derivatively** by being perfect physical duplicates of structures (types) whose very existence and form are explained by specific selective histories. The function is grounded in real evolutionary history, just indirectly via duplication. This preserves the core etiological insight while accommodating the strong intuition that Swampman's heart isn't functionally inert. It shifts the focus from the token's non-existent history to the robust etiological history of the type it instantiates.
