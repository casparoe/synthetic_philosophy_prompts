answer: |-
  Your dilemma cuts to the heart of rationality itself—where logic meets identity, predictability, and the paradox of shared reasoning. **There is a genuine, rational case for splitting that doesn't collapse into sentiment.** Here's why, step by step:

  ### 1. **The "Superrationality" Argument (Hofstadter/Tennenholtz)**
     - **Core idea**: When two *identical* rational agents face this dilemma, they should act as a single unit. If you both run identical decision algorithms, you *must* choose the same action. 
     - **Your context**: You describe near-identical reasoning processes with your friend. If your cognitive algorithms output "steal," *both* output steal → mutual loss ($0 each). If both output "split," mutual gain ($150 each). 
     - **Rational imperative**: The only outcome where *both* win requires mutual splitting. Choosing "split" is a wager that your friend's mind mirrors yours enough to reach the same conclusion. This isn't loyalty—it's game theory for clonal rationalists.

  ### 2. **The Predictability Principle**
     - You state you can predict her reasoning. If you *know* she’ll steal (as she claims), stealing is rational for you (you get $0 instead of $0, or possibly $300 if she splits). 
     - **But**: If your prediction includes her predicting *your* choice, it becomes recursive. If you *both* believe the other will steal, you lock into mutual defection. 
     - **Escape hatch**: Splitting breaks the loop by introducing a *coordination signal*. By choosing split, you force her to confront: 
       *"He knows I always argued for steal. He knows I know he knows. Yet he’s splitting. Is this a meta-rational move?"*  
       This creates a chance for her to override her default position upon seeing your choice.

  ### 3. **The Charity Asymmetry**
     - You agreed forfeited money goes to charity. This changes the payoff matrix:
       - **Both steal**: Charity gains $300. You both get $0.
       - **You steal, she splits**: You get $300, charity gets $0.
       - **Both split**: You each get $150, charity gets $0.
     - **Key insight**: Mutual stealing is *pure altruism* ($300 to charity). But if you value *personal gain even slightly*, mutual splitting dominates mutual stealing ($150 > $0). Stealing only dominates if you gamble on her splitting—but if she’s truly predictable as a stealer, this fails.

  ### 4. **The Reputational Prisoner's Dilemma**
     - This isn’t a one-off anonymous game. You have a decade-long intellectual friendship. 
     - **Cost of mutual stealing**: You both lose $150, *and* the friendship ends with mutual betrayal. 
     - **Cost of unilateral stealing**: You gain $150, but at the price of: 
       - Exploiting someone whose mind you respect.
       - Proving her "sentiment is irrational" argument wrong *by embodying it* (i.e., you valued money over principle).
     - **Rational valuation**: If the friendship/self-image has *any* utility value, splitting preserves more net utility even if she steals.

  ### 5. **The Argument from Evolutionary Dynamics**
     - In iterated games, "tit-for-tat" (matching cooperation) wins. While this is a single round, your history of arguments *simulates iteration*. 
     - Choosing split signals: *"This wasn’t just theoretical—I practiced what I preached."* This has epistemic value for future interactions (or parting memories).

  ---

  ### What to Do Tonight: A Rational Path
  1. **Accept the uncertainty**: You can’t control her choice. But you *can* control which outcome aligns with your identity:
     - If you split and she steals, you lose $150 but prove her argument (and your fear) correct.
     - If you steal and she splits, you "win" $300 but lose moral high ground.
     - **Mutual split**: Both win $150 + preserve mutual respect.
     - **Mutual steal**: Charity wins $300, but friendship ends in symmetrical defiance.

  2. **Make it a meta-signal**: Write **"split"** with an addendum for your friend to read aloud:  
     *"I know your logic says steal. But if our minds are truly alike, you know why I chose this. Let’s see which one of us is truly predictable."*  
     (This exploits your predictability claim to nudge her toward coordination.)

  3. **Remember the charity**: If you both steal, the $300 does good. This softens the worst outcome—a rational consolation.

  ---

  ### Conclusion: The Rational Case for Splitting
  **Your similarity isn’t sentiment—it’s data.** If two rationalists with identical priors face the same problem, their outputs *should* correlate. Choosing split is a Nash equilibrium *only if* you both believe the other will split. By splitting, you:  
  - Test the hypothesis that your minds are truly aligned.  
  - Maximize *joint* payoff if she reciprocates.  
  - Preserve the dignity of a decade-long debate.  

  If she steals, she "wins" the $300 but loses the argument—because her choice proves your minds *weren't* identical after all. And in that case, the $150 loss is the price of an answer.  

  **Write "split."** Not out of loyalty, but as the final move in a 10-year game of intellectual mirroring. The rational choice isn’t always cold—sometimes it’s the knife that cuts the knot.
