  Now, the responses:

  - **Sophisticated substantivalism (anti-haecceitism)**: This response denies that the two diffeomorphic models represent distinct physical situations. It says that the representation of spacetime points is not fixed independently of the metric. So, the two models are just different descriptions of the same physical reality. This avoids the indeterminism.

  - **Metric essentialism**: The idea that spacetime points have their metrical properties essentially. So, if you change the metric, you are not talking about the same points anymore. This would mean that the two models are not about the same points, so there is no indeterminism because the hole region in the two models is not the same set of points.

  - **Relationism about spacetime**: This view denies that spacetime exists as a substance. Instead, spacetime is just a set of relations between material objects. Without material objects in the hole, there is nothing to have properties, so the argument doesn't get off the ground.

