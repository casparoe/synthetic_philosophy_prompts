answer: |-
  Your struggle with Hume's passage cuts to the heart of social ontology and normativity – how rules *become* binding without explicit agreement. Hume's formulation *is* deliberately paradoxical, but it's a productive tension, not necessarily a fatal gap. Lewis's framework clarifies the mechanism but arguably inherits the core puzzle about normativity. Let's break it down:

  1.  **The Paradox: "Mutually Express'd" vs. Gradual/Anonymous Emergence**
      *   Hume needs "mutually express'd and known" to distinguish convention from mere accidental convergence (e.g., two people independently deciding to drive on the right side of an empty road). There needs to be a *mutual awareness* of the coordination.
      *   Yet, he insists it's not a promise and arises like language – gradually, without a founding moment or explicit communication. Language doesn't require a committee meeting; it evolves through use and mutual adjustment.

  2.  **Hume's Solution: Expression Through Action & Reciprocal Expectation**
      *   **"Expression" ≠ Verbal Declaration:** For Hume, "express'd" primarily means *manifested in behavior*. The rowers don't talk; they *act*. Each sees the other rowing, adjusts their own rowing accordingly, and *expects* the other to continue doing so because it benefits both. Their coordinated action *is* the expression of the convention.
      *   **Signaling Through Conformity:** When I follow the rule (e.g., respecting possession), I *signal* to others: "I recognize this pattern as beneficial, and I expect you to do the same." My conformity is an expression of my understanding of the common interest and my expectation of reciprocity.
      *   **The Role of Mutual Observation:** The "known to both" arises through observation and experience. The rower sees the other rowing steadily and infers their commitment to the joint effort. Over time, in society, people observe *general* conformity to a pattern (e.g., not taking each other's stuff) and infer that others also see the benefit and expect continuation. This creates a network of reciprocal expectations.
      *   **Gradual Crystallization:** Like language, the convention starts tentatively. Early acts of respect for possession are isolated. But as more people observe the benefits *and* observe *others* observing the benefits and conforming, the pattern solidifies. The "expression" becomes clearer and the "knowledge" more widespread and entrenched with each successful instance of coordination.

  3.  **From Convergence to Normativity: The System of Expectations**
      *   Hume's key move is that the normative force ("ought") emerges directly from the utility of the coordinated system *combined* with the network of established reciprocal expectations.
      *   **The System's Utility:** Justice (respecting rules like property) is an "artificial virtue." It's not inherently good; it's good *because* it creates a stable, beneficial social order impossible without it. Everyone recognizes this systemic benefit *in general*.
      *   **The Expectation Network:** Once the pattern is established, individuals rely on it. I plant a field *expecting* I'll reap the harvest because I expect others to respect my possession. You build a house under the same expectation.
      *   **Breaking the Convention = Injustice:** When someone violates the rule (e.g., steals my harvest), it's unjust not *primarily* because they broke a promise (there wasn't one), but because:
          *   They exploit the system: They benefit from the *general* stability created by others' conformity while free-riding by violating it.
          *   They frustrate legitimate expectations: They violate the specific, well-founded expectation *I* had (based on the established pattern) that my harvest would be respected.
          *   They harm the system: Their act undermines the trust and stability the convention creates, threatening the common interest it serves.
      *   **Resentment & Enforcement:** This violation naturally provokes resentment in the victim and observers because their expectations are thwarted and the beneficial system is attacked. This resentment *is* the feeling of injustice and motivates social enforcement (peer pressure, blame, punishment), reinforcing the rule's normative standing. The "grip" comes from the combined force of recognizing the system's utility, relying on the expectations it creates, and fearing the resentment/sanctions for violating those expectations.

  4.  **Lewis's Contribution: Common Knowledge & Coordination Equilibria**
      *   **Closing the Epistemic Gap:** Lewis provides the precise mechanism Hume gestured towards. He formalizes "mutually express'd and known" as **common knowledge**:
          *   Everyone conforms to regularity R.
          *   Everyone *expects* everyone else to conform to R.
          *   Everyone *prefers* to conform to R *if* others conform (because R is a coordination equilibrium – a state where no one benefits by unilaterally changing their action given others' actions).
          *   Everyone knows 1-3, everyone knows that everyone knows 1-3, and so on *ad infinitum*.
      *   **The Gradual/Anonymous Process:** Lewis shows how common knowledge can arise through repeated interactions, precedent, salience, or even accidental convergence that gets reinforced. There's no need for a "moment" of agreement; it's a self-reinforcing state of mutual belief sustained by the payoff structure and observable behavior. This perfectly models Hume's language analogy and the boat rowing.
      *   **Relocating the Normativity Puzzle?** Lewis brilliantly explains *how* conventions emerge and stabilize. He clarifies *why* individuals have a *prudential* reason to conform (to achieve coordination benefits and avoid coordination failures). **However, Lewis's account is fundamentally descriptive and strategic.** He explains conformity based on expectations and preferences.
      *   **The Lingering Gap:** Lewis doesn't *fully* bridge the gap to Hume's *normative* "ought" of justice – the feeling that violation is *wrong*, not just disadvantageous. Why does breaking a Lewisian convention often feel like a *moral* failure (injustice), not just a strategic blunder? Hume's answer lies *outside* the pure coordination mechanism:
          *   **Systemic Utility & Exploitation:** The violation harms the socially beneficial *system* and exploits the cooperators.
          *   **Frustrated Expectations:** It violates legitimate, socially grounded *expectations* others have vested in you.
          *   **Resentment:** It provokes a distinctively *moral* sentiment (resentment) in others.
      Lewis provides the scaffolding for the convention's existence; Hume adds the layer of *social utility and moral sentiment* that transforms a stable coordination pattern into a rule with genuinely *normative* (not just strategic) force, making its violation "unjust."

  **Conclusion & Application to Your Community:**

  1.  **Hume's Gap?** It's not a logical gap, but a conceptual tension inherent in tacit agreements. Hume successfully argues that expression/knowledge occurs *through behavior and reciprocal expectations*, not explicit communication. The normative force arises from the *systemic utility* of the convention and the *network of frustrated expectations and resentment* caused by violations.
  2.  **Lewis's Role:** Lewis provides the rigorous framework (common knowledge, coordination equilibrium) that validates and clarifies Hume's core insight about how mutual awareness and coordination work without promises or moments of agreement. He *closes the epistemic gap* definitively.
  3.  **The Normative Gap:** Lewis explains *conformity* strategically. Hume explains why the *violation* feels like *injustice*. Lewis shows how the rule gets its *grip* as a coordination device; Hume explains how it gains its *moral* grip. Lewis provides the mechanism; Hume provides the moral psychology and social context. Lewis relocates the puzzle into game theory, but Hume's answer about utility, expectations, and resentment remains crucial for understanding the *normative* dimension.
  4.  **Your Unwritten Rule:** Its grip comes from precisely this Humean-Lewisian dynamic:
      *   **Common Knowledge/Reciprocal Expectations:** Long-standing members *know* the rule exists, *expect* others to follow it, and know others have the same knowledge and expectations (Lewis). This was built gradually through years of observable behavior and peer enforcement (Hume's gradual progression).
      *   **Perceived Common Interest:** The rule was seen (rightly or wrongly) as serving a vital function for the community's stability or culture (Hume's "common sense of interest").
      *   **Normative Force = Utility + Expectations + Resentment:** Violations now feel like betrayal *because* they exploit the system built on conformity, violate deeply entrenched reciprocal expectations, and provoke resentment from those who feel the community's fabric is threatened. The controversy likely arises because the *perceived utility* of the rule is now contested, undermining the "common sense of interest" that sustained it. Without that shared sense of utility, the resentment loses its anchor, and the rule's normative force weakens, revealing its foundation in coordinated expectation rather than inherent truth.

  Your challenge as moderator is navigating whether the old "common sense of interest" can be restored, or if a new convention (explicit or tacit) needs to emerge based on a *new* shared understanding of the community's interests – a process Hume and Lewis elegantly describe, even if the transition is messy. The controversy highlights that the normative force of such conventions is always contingent on the perceived mutual benefit sustaining the network of expectations.
