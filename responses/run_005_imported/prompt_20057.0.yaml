answer: |-
  That's an incredibly sharp observation about Sidgwick – you've nailed a core tension in his life and legacy that often gets glossed over. You're right that the "quirky ghost hunter" tag feels jarringly disconnected from the meticulous, skeptical author of *The Methods of Ethics*. The reason serious write-ups *do* bring it up (and why it's more than just trivia) hinges on understanding the profound connection Sidgwick himself saw between his ethical philosophy and psychical research. It wasn't a random hobby; it was a desperate, decades-long attempt to resolve the very "dualism of practical reason" that haunted the end of his *Methods*.

  Here's why it's relevant and what it reveals:

  1.  **The "Dualism" Wasn't Just Theoretical; It Was Existential:** Sidgwick concluded that rational egoism (maximizing your own happiness) and utilitarianism (maximizing universal happiness) were both rational but fundamentally incompatible. He couldn't *prove* that being moral (utilitarian) was *always* in one's rational self-interest, especially when sacrifice was required. This lack of reconciliation wasn't just an intellectual puzzle; it deeply troubled him on a personal level. He felt it undermined the rational foundation for morality. As he put it, the universe seemed "fundamentally irrational."

  2.  **Psychical Research as a Potential Solution:** This is the crucial link. Sidgwick saw psychical research (particularly evidence for survival after death) as a *potential* way to resolve this dualism:
      *   **Post-Mortem Sanctions:** If survival of consciousness and some form of cosmic justice (e.g., rewards/punishments based on earthly actions) could be scientifically proven, then acting morally *could* be shown to be in one's *ultimate* rational self-interest. The sacrifice in *this* life might be compensated in a *next* life.
      *   **Bridging the Gap:** Proof of an afterlife or a benevolent cosmic order could provide the "missing link" demonstrating that the universe *wasn't* fundamentally irrational and that duty and self-interest were ultimately harmonized on a grander scale.
      *   **A Scientific Basis for Hope:** Sidgwick, despite his agnosticism (he resigned his Cambridge fellowship over religious doubts), desperately *wanted* there to be a rational basis for ethics and meaning. Psychical research offered a way to investigate the possibility of an afterlife *empirically*, using the scientific methods he respected, rather than relying on faith.

  3.  **It Wasn't "Quirky Fun"; It Was Driven by Philosophical Anguish:** Sidgwick didn't attend seances for kicks. He co-founded the SPR explicitly to apply rigorous, skeptical methods to these phenomena *because* of the immense philosophical stakes. His letters reveal the depth of his hope and despair. He saw it as a continuation of his philosophical work by other means – an empirical investigation into the fundamental nature of reality and the potential grounds for ethical obligation. As philosopher C. D. Broad later noted, Sidgwick "thought that if Psychical Research could establish the fact of survival, and still more if it could throw light on the conditions of survival, it would provide the best, and perhaps the only, hope of finding a basis for ethics which would overcome the Dualism of the Practical Reason."

  4.  **Why Serious Write-Ups Mention It:**
      *   **Integral to Understanding Sidgwick the Man:** It reveals the profound personal cost of his intellectual honesty. The unresolved dualism wasn't an academic shrug for him; it was a wound he spent decades trying to heal.
      *   **Highlights the Depth of the Problem:** His desperate search underscores just how serious and intractable he found the dualism of practical reason. It wasn't a minor footnote; it was a foundational crisis.
      *   **Demonstrates His Commitment to Rigor (Even in Failure):** While the subject matter seems dubious *now*, Sidgwick approached the SPR with the *same* methodological rigor he applied to ethics. He demanded evidence, exposed fraud relentlessly (the SPR debunked far more mediums than it found credible), and insisted on strict protocols. His *methods* were skeptical and scientific; the *phenomena* simply failed to materialize under those conditions. His involvement shows the lengths a brilliant, rigorous mind would go to find a solution to what he saw as a catastrophic flaw in the rational justification for morality.
      *   **Humanizes the Philosophy:** It shows that *The Methods of Ethics* wasn't just an abstract treatise; it emerged from a deep, personal struggle with the meaning of life and the basis for living well. The SPR was part of that lifelong struggle.

  **Regarding Rigor:**

  This is the thorniest part. Does it say something *bad* about his rigor?

  *   **Argument for Diminished Rigor:** One could argue that his desperate *desire* for a solution blinded him to the inherent implausibility of the phenomena he investigated, leading him to invest decades in a fundamentally flawed pursuit. A truly dispassionate skeptic might have abandoned it much sooner.
  *   **Argument for Consistent Rigor (Applied to a Flawed Premise):**
      *   **Context is Key:** In the late 19th century, the boundaries of science were expanding rapidly (electromagnetism, germs, evolution, later X-rays). Investigating the unknown, even the "occult," wasn't inherently unscientific *at the time*. The SPR aimed to bring scientific order to phenomena shrouded in superstition.
      *   **Methodological Rigor:** His *approach* to SPR investigations was famously skeptical and meticulous. He applied the same critical standards he used in philosophy. He wasn't gullible; he was trying to *test* extraordinary claims with extraordinary rigor. The fact that he found so little credible evidence *is* a testament to that rigor.
      *   **Motivation vs. Method:** His *motivation* (philosophical desperation) was powerful, but it didn't necessarily corrupt his *methodology*. He hoped for a result, but he demanded proof. He was often deeply disappointed by the lack of evidence.
      *   **The Stakes Justified the Effort (for him):** Given the existential weight of the dualism, he likely felt the *potential* payoff (resolving the foundation of ethics) justified the enormous effort, even with low odds of success. For him, it wasn't a waste; it was a necessary, if ultimately failed, line of inquiry stemming directly from his core philosophical work.

  **Conclusion:**

  Biographies mention Sidgwick's psychical research not as "quirky trivia," but because it was **intimately and tragically connected to the unresolved core of his greatest philosophical work.** It was a direct, decades-long response to the "dualism of practical reason" that ended *The Methods of Ethics*. It reveals the profound personal and existential stakes of that philosophical problem for Sidgwick himself.

  While we can look back and see it as a dead end (and perhaps question the initial plausibility), it doesn't necessarily indict his *rigor* in execution. It demonstrates the extreme lengths a rigorously honest and deeply troubled mind would go to seek a solution to what he perceived as a catastrophic flaw in the rational justification for morality. His ghost hunting wasn't separate from his ethics; it was his desperate, empirical attempt to find the ghost of a solution that reason alone could not provide. It adds a layer of profound human pathos to his intellectual legacy.
