prompt: |-
  Been on a bit of a decision theory kick lately after re-reading some of Wei Dai's old posts on UDT and skimming the Arbital page on it, and I think I've finally wrapped my head around it, but I want to sanity check the core idea before I go around repeating it to people. As I understand it, the whole point of "updateless" decision theory is that the agent precommits to just never update on evidence at all -- it acts purely off its prior forever, which is exactly why its willing to pay up in Counterfactual Mugging even after Omega tells it the coin landed tails. Basically the agent hears the bad news, shrugs, goes "nope, sticking with my 50/50 prior," and pays the $100 anyway, treating the actual observation as basically irrelevant noise it's not allowed to react to.

  Me and a couple people from my meetup's decision theory reading group got into an argument about this last week though. One guy insisted a UDT agent would still switch doors in the Monty Hall problem after the host reveals a goat, which confused me, because isnt switching doors literally just Bayesian updating on new information? If UDT agents are allowed to do that kind of updating, I don't get what's actually "updateless" about them, or why UDT gets treated as such a huge departure from EDT/CDT instead of just being CDT/EDT with extra steps and cooler thought experiments attached. Is "updateless" secretly referring to some narrow technical sense that doesn't really mean what it sounds like it means, and if so why does everyone on LW act like this is such a profound, cutting edge idea?
reasoning: |-
  Okay, the user is diving deep into decision theory, specifically UDT (Updateless Decision Theory). They've re-read Wei Dai's posts and the Arbital page, and they're trying to grasp the core concept. The main confusion seems to be around what "updateless" actually means. They thought it meant the agent never updates on evidence, sticking purely to its prior. That led them to question why UDT agents would switch doors in Monty Hall, which relies on updating.

  First, I need to address the misconception about "updateless." The user equates it with never updating on any evidence, which isn't accurate. They mention the Counterfactual Mugging example where the agent pays despite knowing the coin landed tails. But in Monty Hall, updating is necessary. There's a conflict here. The user's friend argues UDT would switch doors, which involves updating, so the user is confused about what "updateless" really means.

  The key is that "updateless" refers to not updating the decision itself based on the agent's current situation. In UDT, the agent calculates the best policy for all possible observations upfront. So in Monty Hall, the policy includes switching upon seeing a goat because that's the optimal move determined before the game starts. The agent doesn't decide in the moment; it follows the precomputed strategy. That's why it can still "update" in the Bayesian sense—because the policy already accounts for that update.

  The user might be conflating two types of updating: Bayesian belief updating versus updating the decision strategy. UDT avoids the latter by committing to a strategy in advance. The user's deeper need is to understand why UDT is considered a breakthrough compared to EDT/CDT. They're skeptical, calling it "extra steps." I should highlight that UDT handles problems like Counterfactual Mugging and Newcomb's Paradox where others fail, by decoupling decisions from the agent's current perspective.

  Also, the user might be frustrated with how LW presents UDT as profound. They need clarity on the term "updateless" to avoid misrepresenting it. Emphasizing the precommitment to a policy over time, rather than no updating at all, is crucial. The Monty Hall example is a good test case—showing that UDT uses Bayesian updating within its fixed policy. This resolves their confusion and explains the theory's significance without overhyping.
answer: |-
  You're wrestling with a **crucial and common misconception** about UDT, and your confusion is completely understandable given the term "updateless." Let's break this down:

  1.  **The Core Misconception: "Never Update on Evidence"**
      *   **This is incorrect.** UDT agents absolutely *do* incorporate observations and evidence. They *must* do this to function in the real world.
      *   Your reasoning about Monty Hall is spot-on: Switching doors relies critically on updating beliefs based on the host's action (revealing a goat). A true "never update" agent would be useless in Monty Hall and most real-world scenarios.

  2.  **What "Updateless" *Actually* Means:**
      The "updateless" in UDT refers specifically to **not conditioning the *decision rule itself* on the agent's *current situation, location, or subjective perspective* when making the decision.** Here's the key:

      *   **UDT is about choosing a *policy* (a mapping from *possible future observations* to actions) *once*, from the *initial* perspective (the "original computation" before any observations).**
      *   **This policy is computed using the agent's *prior* beliefs about the world and its own potential implementations.**
      *   **Once the policy is fixed, the agent *does* update its *beliefs* based on observations *within* that fixed policy.** It follows the instructions laid out in the pre-computed plan.

  3.  **UDT in Action: Counterfactual Mugging vs. Monty Hall**

      *   **Counterfactual Mugging (Heads):** Agent pre-computes: "If I learn the coin was Heads, I do nothing. If I learn it was Tails, I pay $100." *Why pay on Tails?* Because the pre-computation considers *both* branches. It realizes that paying on Tails is necessary to incentivize Omega to give it $10,000 in the Heads branch (which it cares about just as much, even when it *isn't* in that branch). **It doesn't *update away* its concern for the counterfactual Heads branch just because it finds itself in Tails.**
      *   **Monty Hall:** Agent pre-computes: "I will pick a door initially. *If* the host then reveals a goat behind one of the other two doors, *then* I will switch to the remaining unopened door." This policy is optimal based on the agent's prior understanding of the rules (host *must* reveal a goat and *cannot* reveal the car or the initially chosen door). **When the host reveals the goat, the agent *updates its beliefs* about where the car likely is (using Bayes), *but crucially, it's following the pre-determined optimal action for this observation*: switch.** The "updatelessness" is that the *decision to switch* wasn't made *after* seeing the goat based on a *new* calculation of expected utility *from that perspective*. It was committed to switching in this scenario *before the game even started*, based on the global prior view.

  4.  **Why it's a Departure from EDT/CDT (and Profound):**
      *   **EDT/CDT (Conditional on Current Situation):** Both EDT and CDT calculate expected utility *conditional on the agent's current information state* when making a decision.
          *   In Counterfactual Mugging (Tails), EDT/CDT see: "I'm in Tails. Paying $100 gives me -$100 utility here. The Heads branch is gone (probability 0), so I don't care about it. Don't pay." They fail to motivate the pre-commitment.
          *   In Newcomb-like problems, CDT fails because it conditions on the current state where the prediction has already happened, making the decision causally irrelevant.
      *   **UDT (Conditional on the Prior/Original Computation):** UDT avoids being "trapped" in its current perspective. It makes decisions *as if* it could affect outcomes in *all* branches its prior considers possible, weighted by their prior probability. It reasons **globally and counterfactually** from the start.
          *   This allows it to "commit" across branches (like paying in Mugging Tails to get paid in Mugging Heads).
          *   This allows it to "cooperate" in dilemmas where its decision algorithm is predictable (like Newcomb's Problem, where CDT one-boxes only if it thinks Omega predicted it would, but UDT directly chooses one-boxing because it's globally optimal).
          *   **The "profound" aspect:** UDT decouples the *logical determination* of the optimal action from the agent's *epistemic state at runtime*. It solves for the best *function* from observations to actions *before* it knows which observations it will get. This is fundamentally different from EDT/CDT's *runtime* expected utility calculation.

  5.  **Addressing Your Friend & Monty Hall:**
      *   Your friend is **correct:** A UDT agent **would** switch doors in Monty Hall.
      *   **Why this doesn't contradict "updatelessness":** The agent pre-computes a policy: `if host_reveals_goat(not_my_door): switch()`. It *uses* the observation (`host_reveals_goat`) to trigger the pre-determined optimal action (`switch`). It *does* update its *belief* (P(car behind my door) drops to 1/3, P(car behind other door) rises to 2/3), but it **does not re-calculate the expected utility of switching vs. staying *from the perspective of standing there seeing the goat*.** It simply executes the optimal policy it figured out beforehand. The Bayesian belief update *informs the policy's pre-computation*, but isn't used for a fresh decision *at runtime*.

  **In Summary:**

  *   **"Updateless" means:** Not updating the *decision rule* based on the agent's *current situation/location/perspective*. The optimal action mapping (policy) is computed *once* from the *original* prior perspective.
  *   **It does NOT mean:** Ignoring evidence or never updating beliefs. UDT agents *absolutely* use observations to:
      1.  Update their beliefs about the world state (Bayesian updating).
      2.  Determine *which pre-computed action* in their policy to execute (e.g., "host revealed goat -> execute SWITCH action").
  *   **The Profundity:** UDT solves problems (Mugging, Newcomb, cooperation under predictability) where EDT/CDT fail, by reasoning counterfactually and globally *from the start* rather than being myopically trapped in its current epistemic state. It treats its *own future decisions under different observations* as part of the global system it's optimizing.

  You've grasped the Mugging intuition well. The Monty Hall confusion highlights the precise meaning of "updateless" – it's about the *source* of the decision rule (prior global computation), not about ignoring sensory input. UDT is indeed a significant conceptual departure, precisely *because* it leverages Bayesian updating *within* a policy fixed by a counterfactual-global prior optimization. It's not CDT/EDT with extra steps; it's a different *foundation* for decision-making.
