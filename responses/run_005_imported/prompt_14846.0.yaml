answer: |-
  Here's a toast that threads the needle: honoring the signaling theory for the experts while keeping it warm, personal, and universally resonant. The "nerd moment" is clearly marked for the initiates, framed accessibly, and quickly pivots back to universal emotional truths.

  ---

  **(Clink glass gently, warm smile)**  

  "Alright everyone! For those who don’t know me, I’m [Your Name], and I’ve had the dubious honor of being Ben’s best friend since we tried to build a potato cannon in his parents’ garage… and failed spectacularly. *(Pause for laughter)*. Seeing him standing here today, miraculously unharmed and about to marry someone as brilliant and wonderful as Sarah, feels like a genuine triumph of hope over experience.

  Now, Ben and Sarah, you two know I’ve always been fascinated by your world – the world of behavioral ecology. Studying why animals do what they do, the signals they send, the costs they pay. And anyone who’s seen the sheer *effort* that’s gone into today – the planning, the details, the… well, let’s be honest, the *expense* – might be tempted to think about those famous peacock tails. You know, the idea that something big, bright, and wildly impractical must be a signal of incredible fitness. ‘Look how much they spent! They must *really* mean it!’

  **(Light, self-deprecating chuckle)**  
  "But here’s the thing I learned from listening to you two talk shop over the years: The *real* signal isn’t the price tag. Anyone can max out a credit card or rent a fancy ballroom if they’re just going through the motions. A diamond ring, beautiful as it is? Its cost has more to do with clever marketing than the depth of someone’s commitment. That’s not the *real* handicap.

  **(Lean in slightly, marked shift in tone - the "Nerd Moment" for those in the know)**  
  "*This* is the moment for the behavioral ecology crew. Because the Zahavian handicap that *actually* matters, the signal that’s impossible to fake? It’s not the flowers or the band or the open bar – though Sarah, your taste is impeccable. *(Smile at Sarah)*. The *real* cost, the *genuine* handicap, is paid in something far more valuable than money. It’s paid in the irreversible choices, the vulnerabilities embraced, and the sheer, daunting commitment to the *future*.

  **(Pivot back to universal, warm tone)**  
  "Think about it: Ben choosing to move cities, not just *for* Sarah, but *with* Sarah, completely reshaping his career path to build a life *together*. Sarah opening up her fiercely independent spirit, her brilliant mind, and her huge heart, trusting Ben with her dreams and her doubts. The vulnerability of standing here, right now, in front of absolutely everyone you care about, saying ‘This is it. This is my person. For life.’ That’s terrifying! That’s *expensive* in the currency of ego, independence, and easy escape routes.

  A weak signal, an insincere promise? It *couldn’t* afford that. It wouldn’t *dare*. Only the real thing – deep, resilient, committed love – can shoulder the weight of those choices. Only real love can look at the mountain of work, compromise, patience, and forgiveness that marriage *actually* is, every single day, and say, ‘Yes. We choose that. For each other.’

  *That’s* the magnificent, costly tail we’re seeing today. Not the trappings, glorious as they are. But the **choice** itself. The choice to be vulnerable. The choice to be patient. The choice to show up, day after day, even when it’s hard. The choice to build something bigger than yourselves.

  So, let’s raise our glasses – not just to the beautiful ceremony, the stunning venue, or the excellent champagne (though cheers to that too!). Let’s raise them to the *real* handicaps Ben and Sarah have already embraced, and the incredible strength those costs reveal:

  *   **To Ben:** Who found someone worth changing his whole map for, and had the courage to do it.
  *   **To Sarah:** Who found someone worthy of her formidable trust, and had the wisdom to give it.
  *   **To both of you:** For understanding that the most credible signal of true love isn't the grand gesture, but the quiet, daily decision to choose each other. May your life together be filled with the kind of joy that makes every cost feel like an investment in something priceless.

  **To Ben and Sarah!**"

  ---

  **Why this works:**

  1.  **Acknowledges the Theory (For the Nerds):** It explicitly names Zahavi and the handicap principle, using the peacock tail analogy accurately. It directly addresses the user's point about diamonds/conventional costs being poor signals ("Anyone can max out a credit card... clever marketing").
  2.  **Identifies the *Real* Handicaps:** It shifts the focus to the *life* costs – moving, career shifts, vulnerability, embracing lifelong commitment and hard work. These are costs an insincere person genuinely *could not* or *would not* pay. They are indexes of quality/sincerity.
  3.  **Makes it Personal & Emotional:** It uses Ben and Sarah's specific choices (the move, Sarah's independence) as concrete examples of the "costs." This grounds the theory in *their* love story, making it warm and specific.
  4.  **Accessible to All:** The "nerd moment" is brief (2-3 sentences), framed in relatively plain language ("irreversible choices," "vulnerabilities embraced," "daunting commitment"), and immediately pivots back to universal concepts of love, commitment, vulnerability, and choice. Grandpa hears "vulnerability," "commitment," "choosing each other every day" – concepts he understands deeply, even if he doesn't know ESS.
  5.  **Lightness & Humor:** Opens with a personal, humorous anecdote. The self-deprecating chuckle after the "peacock" line diffuses any potential pretentiousness. Complimenting Sarah's taste lightens the theory moment.
  6.  **Strong, Universal Finish:** The final toast focuses entirely on the emotional core – choice, vulnerability, commitment, building a life together – using the "real handicaps" as the foundation but expressing it in purely romantic and celebratory terms. The call to toast the "quiet, daily decision" is powerful and resonates with everyone.
  7.  **Timing:** Reads comfortably in the 4.5 - 5.5 minute range.

  **Key to Delivery:**

  *   **Sincerity:** Deliver the core message about their choices and commitment with genuine warmth and conviction.
  *   **Pacing:** Pause slightly before and after the "nerd moment" to subtly mark it. Don't rush the emotional payoff at the end.
  *   **Eye Contact:** Connect with Ben, Sarah, and sweep the room, especially during the universal parts and the final toast.
  *   **The "Marked Moment":** A slight shift in tone (maybe leaning in, a touch more deliberate pace) signals the theory section to those who will appreciate it, without alienating others.

  This toast celebrates the *substance* of Ben and Sarah's commitment, using signaling theory as a unique lens to highlight why their love is so credible and strong, while ensuring everyone in the room feels the warmth and joy of the occasion. Good luck!
