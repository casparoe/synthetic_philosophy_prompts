  First, I need to recall the key points of Bell's 1964 paper versus his later works. In 1964, Bell started with the EPR argument. EPR assumed locality and perfect correlations to argue that particles must have pre-existing values (realism). Bell then showed that adding locality to these pre-existing values leads to contradictions via his inequality. But here, determinism was derived, not assumed. So in 1964, realism (as hidden variables) was a consequence of locality plus EPR correlations.

  Then, in Bell's later papers (1976 and 1990), he introduced "local causality." This formulation doesn't start from determinism. Instead, it directly addresses stochastic theories. Local causality requires that probabilities factorize when conditioned on the complete physical state in the past light cone. This leads to the same inequality violations without assuming determinism. So here, realism is embedded in the idea that the physical state (λ) gives probabilities, but the core issue is locality.

  The user mentioned Maudlin and Bohmians. Maudlin emphasizes that Bell's theorem is about locality, not realism. Bohmian mechanics is non-local but realistic. So their point is that non-locality is unavoidable if you want a realist theory, but Copenhagen avoids it by dropping realism. However, the user's argument is that even in Copenhagen, you can't maintain locality without some cost.

