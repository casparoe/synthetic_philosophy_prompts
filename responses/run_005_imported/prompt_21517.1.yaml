  **Move 4: Nadia’s Defense**  
  *Strength*: Validly defends intellectual history’s methodology. Tracking a thinker’s *idiosyncratic* conceptual patterns (e.g., Heidegger’s "authenticity" → Nazi commitment) is standard practice.  
  *Weakness*: Doesn’t address Owen’s counterexamples; risks conflating correlation with causation in Frege’s case.  
