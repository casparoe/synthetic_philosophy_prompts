  - **Professional vs. Private**: Frege’s public work avoided politics. Does the diary reveal suppressed anxieties influencing his philosophy?
  - **Historicization**: 1920s Germany normalized antisemitism. Condemning Frege alone ignores systemic biases in canonical philosophy.

