answer: |-
  You've hit on a **major and genuine issue** in Frege's theory, one that wasn't fully addressed by him in "Über Sinn und Bedeutung" but was later tackled by logicians like Alonzo Church and philosophers like Michael Dummett. Your analysis is spot-on: nested attitude reports *do* generate a regress, leading to an infinite hierarchy of senses. This is widely recognized as a consequence of Frege's framework.

  Here's the breakdown of the problem and the solutions:

  1.  **The Problem (The Regress/Hierarchy):**
      *   In "Galileo believed that Kepler said the morning star is a planet":
          *   The outermost clause "Galileo believed that..." creates an oblique context for its complement clause "Kepler said the morning star is a planet".
          *   According to Frege, within this outermost oblique context, the *whole complement clause* ("Kepler said the morning star is a planet") has its *customary sense* as its *indirect reference*.
          *   **Crucially:** For the complement clause to *have* a sense (its customary sense) that can serve as the indirect reference for the belief report, its *components* (like "Kepler", "said", "morning star", "is a planet") must themselves have senses within that embedded clause.
      *   But the complement clause itself ("Kepler said the morning star is a planet") *is* an attitude report ("Kepler said that...").
      *   Therefore, *within this complement clause*, the embedded clause "the morning star is a planet" is itself in an oblique context created by "Kepler said".
      *   Applying Frege's rule *again*: Within "Kepler said...", the words in "the morning star is a planet" do not have their customary reference or customary sense. They have their *indirect reference* (which is their *customary sense*) and a new, *indirect sense*.
      *   **The Regress:** The *indirect sense* of "morning star" (the sense it has within "Kepler said...") is what determines its *indirect reference* (its customary sense) within that context. Now, this *indirect sense* is itself the entity that must be referred to *by the words expressing it* when it becomes the *indirect reference* of the *whole* complement clause within Galileo's belief context. To refer to *that* entity (the first-level indirect sense), the words in the belief report ("Kepler said the morning star is a planet") would need yet another sense – a *second-level indirect sense*. And so on, ad infinitum.

  2.  **Frege's Silence:**
      *   Frege doesn't explicitly address this nesting in the essay. He primarily focuses on single embeddings (e.g., "Copernicus believed that the morning star is a planet"). The potential for infinite regress inherent in his definitions for nested contexts wasn't his immediate concern in that text.

  3.  **The Solutions/Developments (Biting the Bullet):**
      *   **Alonzo Church (Logic of Sense and Denotation):** Church rigorously formalized Frege's ideas. He explicitly embraced the infinite hierarchy of senses as a necessary consequence to avoid paradoxes (like the Liar paradox applied to senses) and to provide a compositional semantics for nested intensional contexts. In Church's system:
          *   Level 0: Customary Sense / Customary Reference
          *   Level 1: Indirect Sense (determines Level 0 Customary Sense) / Indirect Reference (Level 0 Customary Sense)
          *   Level 2: Doubly Indirect Sense (determines Level 1 Indirect Sense) / Doubly Indirect Reference (Level 1 Indirect Sense)
          *   ... and so on.
      *   **Michael Dummett (Interpretation & Critique):** Dummett, in works like *Frege: Philosophy of Language*, acknowledged this consequence. He saw it as a significant, perhaps problematic, commitment of Frege's theory. Dummett argued:
          *   The hierarchy is *logically required* by Frege's fundamental distinctions to handle iterated embeddings consistently.
          *   However, it raises serious questions about the *psychological reality* or *learnability* of language. Do speakers really grasp this infinite hierarchy of distinct senses for every expression?
          *   He explored whether Frege *needed* such a strong commitment or if the hierarchy could be mitigated, often concluding that within Frege's framework, it's inescapable.

  4.  **Is it a Bullet to Bite?**
      *   **Yes, it is.** For those committed to a Fregean solution for the semantics of propositional attitude reports (especially nested ones), accepting an infinite hierarchy of senses is generally seen as the price to pay. Church's formalization demonstrates its logical coherence.
      *   **The Criticism:** Many philosophers and linguists find this hierarchy intuitively implausible and ontologically extravagant. It seems unlikely that ordinary language users mentally manipulate this infinite stack of abstract entities when understanding "John thinks Mary believes Peter hopes...". This implausibility is a major motivation for seeking alternative semantic accounts of attitude reports (e.g., possible worlds semantics, Russellianism, Davidsonian paratactic analyses).

  **Conclusion:**

  You are absolutely correct. Nested attitude reports within Frege's framework *do* generate a regress leading to an infinite hierarchy of distinct senses (Sense₀, Sense₁, Sense₂, ...) for every expression. Frege didn't explicitly flag this in "Über Sinn und Bedeutung," likely because his focus was on foundational single embeddings. Later thinkers, most notably **Alonzo Church** in his formalization, explicitly embraced this hierarchy as a necessary consequence. **Michael Dummett** provided the definitive philosophical analysis and critique of this consequence, highlighting both its logical necessity within Frege's system and its potential implausibility as a theory of linguistic understanding. So, yes, biting the bullet of an infinite hierarchy is generally considered the Fregean/Churchian solution to the problem you've astutely identified. It's a major point of debate in the philosophy of language.
