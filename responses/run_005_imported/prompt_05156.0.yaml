answer: |-
  Your intuition that the control principle's logic must be pursued relentlessly—dissolving responsibility entirely—is both radical and coherent. Here’s a systematic defense against the objections you anticipate, embracing the bullet without flinching:

  ### **The Argument for Full Erosion**
  1. **Resultant Luck as the Wedge**  
     Your friend’s case exposes the arbitrariness of outcome-dependence: identical actions (driving after two glasses) incur opposite moral judgments solely due to an uncontrolled event (cyclist swerving). If blame hinges on results, not choices, morality becomes a lottery.  

  2. **Collapsing the "Luck Layers"**  
     - **Circumstantial Luck**: Imagine two people equally prone to drunk driving. One never encounters a cyclist; the other does. We blame the latter for "failing" a test the former never faced. But the *opportunity* to err was itself unchosen.  
     - **Constitutive Luck**: Your capacity for restraint while tipsy—neurology, impulse control, risk assessment—is genetically and environmentally determined. If your friend’s biology made her marginally less alert *that night*, is she "more responsible"?  
     - **Causal Luck**: The chain of causation stretches backward infinitely: her parents’ choices, societal norms around alcohol, the invention of automobiles. She is a node in a deterministic web, not an uncaused cause.  

     **The Fatal Symmetry**: If resultant luck negates desert (as Nagel concedes), so must these other forms. A drunk driver who hits a pedestrian is no more "in control" than one who doesn’t—only more *unlucky*.  

  3. **Dissolving the Agent**  
     Autonomy requires a "self" outside luck’s reach. But the *self* is constituted by:  
     - Genetic luck (constitutive),  
     - Cultural conditioning (circumstantial),  
     - Historical contingencies (causal).  
     There is no "you" prior to these influences to claim authorship of your choices. The control principle, consistently applied, leaves *nothing* to praise or blame.  

  ---

  ### **Defusing Objections**  
  **Objection 1: "This makes morality incoherent!"**  
     - **Reply**: Morality need not require *desert*. We retain:  
       - **Consequentialist Tools**: Punishment can deter, rehabilitate, or protect society—*without* presupposing blameworthiness. Your friend might face consequences to discourage drunk driving, but we need not see her as "evil."  
       - **Virtue Ethics (Revised)**: We can call drunk driving "reckless" as a description of *behavior*, not indictment of *character*. We discourage it because it *tends* to harm, not because the agent "deserves hell."  
     - **Key Insight**: Abandoning desert *simplifies* ethics. We judge *acts* (driving impaired risks lives) and *systems* (safer roads, alcohol education), not souls.  

  **Objection 2: "This is unlivable! We can’t function without blame."**  
     - **Reply**: We already live with diminished responsibility:  
       - **Justice Systems**: We reduce sentences for those abused as children (constitutive/circumstantial luck). We treat addiction medically, not morally. This framework *extends* that logic.  
       - **Personal Relationships**: We navigate betrayal by asking: "Was this malice or misfortune?" without invoking cosmic blame. Your mutual friends’ cruelty stems from *their* constitutive luck (privilege? lack of empathy?)—itself unchosen.  
     - **Practical Shift**: Replace blame with:  
       - **Grief over harm** ("That cyclist’s suffering is tragic"),  
       - **Preventive focus** ("How do we stop this recurrence?"),  
       - **Compassion for all** (Your friend is a victim of bad luck; so is the cyclist).  

  ---

  ### **Why This Isn’t Nihilism**  
  Rejecting desert **≠** rejecting meaning. We can still:  
  - **Value Well-Being**: Suffering remains bad; joy remains good.  
  - **Promote Agency**: Even if not "free," we can expand people’s capacities (education, therapy) to shape better outcomes.  
  - **Cultivate Empathy**: Seeing others as products of luck softens retribution. Your friend’s trauma—and the cyclist’s pain—call for support, not scorn.  

  ---

  ### **Conclusion: The Liberating Desolation**  
  The control principle’s endpoint *is* desolate: we are "innocent" not in virtue of goodness, but because responsibility was always an illusion. Yet this truth is emancipating. It defangs moral hypocrisy (your friends’ judgment of her but not you), curbs cruelty, and redirects energy toward *fixing systems* rather than *condemning ghosts*. 

  As Nietzsche warned, "punishment" often disguises resentment. By biting the bullet, we trade the fever dream of moral desert for a clearer, colder, and kinder world: one where we mitigate harm precisely *because* no one chose to be broken. Your friend’s tragedy isn’t her fault—nor is it yours. It’s a call to build a society where such luck matters less.
