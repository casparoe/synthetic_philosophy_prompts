  **Justification:** Dmitri’s "no fudge factors" response aptly addresses Elena’s overfitting concern: GTR’s prediction was impressive because it required no parameter-tuning, unlike ad hoc Newtonian fixes. Building this into a Bayesian framework (e.g., via a catch-all hypothesis or simplicity prior) is feasible and mitigates the "proves too much" issue. His dismissal of the historical point is defensible since Bayesianism is normative. However, he doesn’t fully resolve how to formalize "no tuning" or handle cases where entailments are unsurprising, leaving gaps.

