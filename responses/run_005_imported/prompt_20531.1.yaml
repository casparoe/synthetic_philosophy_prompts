  Fourth, the exchange should avoid tidy resolution while ensuring both sides make their strongest moves: Skeptic can't just assert determinism invalidates responsibility; Naturalist can't win by reasserting naturalism. 

  I consider structuring the dialogue around three core movements: 
  1) Initial positioning where Naturalist explains Strawson's dissolution of traditional problem, Skeptic counters with Watson's challenge 
  2) Deep dive into Harris case as test for Strawson's framework 
  3) Fundamental disagreement about whether description can settle normativity, closing with clear unresolved tension

  For authenticity, I'll have Naturalist emphasize how Strawson's excuses/exemptions handle partial causes (e.g., Harris wasn't coerced), while Skeptic presses how total causal histories might undermine basic desert even when exemptions don't apply. The key pivot will be whether "fittingness" of attitudes requires more than social naturalism.

  The ending should leave both positions standing: Naturalist maintaining reactive attitudes are our only responsibility "substance," Skeptic insisting we can interrogate their fittingness. This preserves the seminar's desired complexity.
answer: |-
  ## Dialogue: The Fittingness of the Objective

  **Characters:**  
  *   **NATURALIST (Nora):** Committed to Strawson’s naturalism. Believes reactive attitudes and their modulation via excuses/exemptions *are* the substance of responsibility. Any further "normative question" is misplaced.  
  *   **SKEPTIC (Silas):** Accepts Strawson’s descriptive accuracy but argues it doesn't settle the normative worry about *basic desert*. Presses the challenge from cases like Robert Harris, where deep understanding pulls towards objectivity, yet blame intensifies.  

  **Setting:** A university common room after the seminar.

  **(Nora is reviewing notes. Silas approaches, looking thoughtful.)**

  **Silas:** Nora, compelling seminar today. Strawson’s move *is* elegant: shift from the metaphysical quagmire of free will to the lived reality of our interpersonal attitudes. The participant stance *is* our world. But… I keep hitting a wall. Isn’t Strawson brilliantly describing our *practice*, while sidestepping the very anxiety that *drives* the free will debate? The worry that, metaphysically, no one *ultimately* deserves blame or praise?

  **Nora:** Silas, I think that’s precisely where Strawson shows us the way out. The “ultimate desert” worry *presupposes* a detached, objective viewpoint *outside* the participant stance. But Strawson argues that stance *isn’t* optional for beings like us, engaged in relationships. The concepts of responsibility, desert, resentment, gratitude – they only have meaning *within* that web of attitudes. Asking if someone “truly, metaphysically” deserves resentment is like asking if a move in chess is “truly, metaphysically” a checkmate, independent of the rules of chess. It’s a category error.

  **Silas:** I grant the force of that. We *are* participant creatures. But Strawson himself provides the tools to see the problem. He admits the objective attitude *is* sometimes appropriate – when we exempt someone due to insanity, infancy, or perhaps profound coercion. We see them not as agents to engage with morally, but as objects to manage or treat. Now, consider determinism – not as some abstract thesis, but as applied to concrete, horrifying cases. Gary Watson’s discussion of Robert Harris is seared into my mind. Harris murdered two teenagers execution-style. Utterly monstrous.

  **Nora:** Agreed. And within the participant stance, resentment and moral condemnation are utterly fitting responses. He wasn’t psychotic, not coerced in the moment. He understood the ordinary demands of morality and brutally violated them. Strawson’s apparatus explains this perfectly: no exemption applies.

  **Silas:** But here’s the rub, Nora. When Watson delves into Harris’s history – the unimaginable, sustained brutality of his upbringing: constant physical torture, psychological torment, being locked in a cupboard for days, forced to eat feces… doesn’t that narrative pull us powerfully *towards* the objective attitude? Doesn’t it make him seem like a product of forces utterly beyond his control, a damaged mechanism? Strawson says such understanding *modifies* or *suspends* the reactive attitudes. Yet, paradoxically, when we confront the *full* horror of his actions *and* their causal origins, our moral outrage often *intensifies*. We feel he *more* profoundly *deserves* condemnation, not less. We *resist* the pull towards objectivity.

  **Nora:** I see the tension you’re highlighting. But I think Strawson can handle it. First, understanding a horrific causal history doesn’t automatically grant an *exemption*. Strawson is clear: exemption requires conditions that *undermine moral agency itself* – like psychosis, which destroys the capacity to understand moral reasons. Harris, however awful his past, still *understood* the wrongness of murder. He planned it, taunted his victims. He remained a candidate for moral address, however predictably he failed it. His history is a *mitigating factor*, perhaps explaining *why* he was so morally deformed, but not *removing* him from the sphere of moral engagement. It’s a plea for understanding *within* the participant stance, not a ticket out of it.

  **Silas:** But that’s my point! What *is* this “sphere of moral engagement”? Is it merely a sociological fact about how we *happen* to react? Strawson brilliantly describes the *conditions* under which we *do* hold responsible. But Watson’s case exposes a potential disconnect: the very factors Strawson identifies as *pulling towards objectivity* (deep causal understanding) can, in extreme cases, fuel a *fiercer participant reaction*. This suggests the descriptive structure isn’t self-justifying. It forces the question: *Ought* we to hold Harris responsible in this basic-desert sense, even granting he meets Strawson’s conditions for being a moral agent? When we see him as the tragic culmination of a causal chain stretching back before his birth, doesn’t the *normative* question reassert itself? *Should* the participant stance hold sway here, or is the objective attitude *fitting*?

  **Nora:** You’re smuggling the external, skeptical viewpoint back in, Silas. “Fittingness” *is determined by* the norms internal to the participant stance itself. Within that stance, recognizing Harris’s history might temper *personal* resentment – we might feel more pity alongside the outrage – but it doesn’t negate the *moral* condemnation. The “ought” you seek isn’t floating above the practice; it *is* the practice. To ask “Should we resent him, *really*?” after granting he meets the criteria for being a responsible agent *within the practice* is like asking “Should we use ‘checkmate’ in this position, *really*?” after confirming all the rules say we should. The rules *define* the “ought.”

  **Silas:** But practices evolve! And they can be challenged *from within*, using their own resources. Strawson gives us the vocabulary: excuses and exemptions. The Harris case pushes us to ask: Is the *threshold* for exemption set correctly? When causal determination is *this* total, this *constitutive* of the agent’s very capacity to respond to reasons – even if not destroyed, profoundly warped beyond any semblance of fair opportunity – does it really not warrant at least a *partial* shift towards objectivity? Doesn’t the intense discomfort we feel – the very tension Watson identifies – signal a recognition that our standard exemptions might be inadequate for capturing the full force of the determinist worry in such extreme cases? It’s not about an external “view from nowhere,” Nora. It’s about the participant stance *grappling with its own implications* when faced with the abyss of total causal determination.

  **Nora:** I hear you. The Harris case *is* existentially wrenching. It tests the limits. But Strawson would say the discomfort arises precisely *because* we are torn *within* the participant stance. We see the monstrous act demanding condemnation, and we see the suffering that produced the monster, evoking pity or horror. Both are reactive attitudes! The pull towards objectivity you feel isn’t the cool light of metaphysics; it’s another facet of our moral response – perhaps compassion or despair at the causal machinery of the world. But it doesn’t invalidate the condemnation. To say Harris *isn’t* responsible, in the only sense that matters, would be to do violence to the victims and to the moral order itself. Strawson’s point is that this “moral order” isn’t a metaphysical postulate; it *is* the lived reality of our reactive attitudes and their inherent norms.

  **Silas:** And my point is that the “inherent norms” might be insufficient when the causal story becomes *this* overwhelming. We feel the condemnation, yes. But we also feel the profound sense that condemning *him*, as the originator of desert, feels… cosmically unfair. That sense of unfairness *isn't* just pity; it’s a nascent judgment *about* the fittingness of the reactive attitudes themselves in light of the causal totality. Strawson dissolves the *traditional* metaphysical problem by grounding responsibility in the participant stance. But Watson’s tension suggests this stance *generates its own internal normative crisis* when confronted with radical determinism made flesh. The machinery describes *how* we modulate attitudes, but it doesn’t automatically tell us which modulation is *ultimately warranted* when the causal abyss opens beneath our feet. The description is brilliant, Nora, but for me, it doesn't quite *dissolve* the deep, normative unease. It relocates it, intensely, *within* the practice.

  **Nora:** And for me, Silas, that unease *is* the human condition within the participant stance. It’s not a sign the stance is flawed or needs external validation; it’s a sign of its depth and complexity. To seek resolution beyond it is to seek a God’s-eye view we cannot occupy. We judge, we condemn, we sometimes mitigate, we sometimes despair – all from right here, within the only game in town. The normative question, as you frame it, remains… a question without a foothold *outside* the very thing it seeks to judge.

  **Silas:** Or perhaps… a question the practice forces us to ask *of itself*. The tension *is* the unresolved argument. Strawson mapped the terrain, but the journey through cases like Harris… that’s where the real, difficult philosophy begins. We haven’t reached the end of that path yet.

  **(They both fall silent, the weight of the Harris case and the unresolved tension between description and normativity hanging in the air. Neither looks entirely satisfied, but both seem to acknowledge the force in the other's position.)**
