prompt: |-
  So I'm working on a novel with a scene set at a stuffy philosophy-of-mind conference, and I want to get a debate between two characters right. One is an old-school mathematician, very Lucas/Penrose -- convinced that Gödel's incompleteness theorem shows a human mind can't just be a Turing machine, since we can "see" that a certain Gödel sentence is true even though no machine running on that same formal system could ever prove it from the inside. The other is a cognitive scientist who thinks this whole argument doesn't actually touch computationalism once you look closely at it. They've been having versions of this fight for twenty years, so neither one's a pushover or about to concede. Can you write their exchange as a straight dialogue (no narration, just back-and-forth, maybe 500-700 words)? I really want the cognitive scientist to engage with the "which formal system even are you, and how would you know it's consistent" problem instead of just brushing the whole argument off, and I want the mathematician to have an actual comeback to that rather then just restating her position louder. Don't let either of them clearly win.
