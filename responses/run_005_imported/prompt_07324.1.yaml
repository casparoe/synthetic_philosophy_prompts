  First, I should recall the core ideas. In IRL, you observe behavior to infer a reward function, but there's always an underdetermination problem—multiple reward functions can explain the same behavior. Quine's argument shows that behavioral data alone can't pin down meanings; different translation manuals fit the same evidence. The user connects these because both rely on assumptions (rationality in IRL, charity in translation) to narrow down possibilities.

