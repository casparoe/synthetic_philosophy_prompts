prompt: |-
  So me and my sister just inherited our uncle's little woodworking shop and we're trying to figure out how to split the profits going forward if we keep running it together. Here's the messy part - she's way more connected in the local contractor scene, so if she walked away and started her own shop tommorow she could probably pull in like $80k a year easy just off his old client list. I don't have those connections so if I went solo I'd maybe scrape together $20k. But if we actually run the shop together and it does well, we're looking at something like $150k combined, and there's no obvious "fair" formula for splitting that. She thinks since her walk-away number is so much higher she should just get proportionally more of everything, like 4x what I get. That feels off to me but I can't fully articulate why - it's not like we're doing 4x the work difference, and if I just say "well let's do 50/50 since we're both stuck running this together" that feels like it's ignoring the fact that she genuinely does bring more to the table and has better options elsewhere.

  I've been chewing on this for weeks and keep going in circles between "equal split" and "split by outside options" without landing anywhere that feels right. Is there some other way to think about carving this up that actually accounts for both what we'd each get if everything broke our way ideally, and what we'd get if we just walked away from each other? Would love some help thinking through what a genuinely fair arrangement would look like here.
reasoning: |-
  Okay, let me start by understanding the user's problem. They inherited a woodworking shop with their sister and need to split profits fairly. The sister has strong connections, allowing her to earn $80k solo, while the user would only make $20k. Together, they can make $150k. The sister wants a 4x split based on their outside options, but the user feels that's unfair because the work isn't proportionally different.

  First, I need to analyze why the sister's proposal feels off. The user mentions that the work difference isn't 4x, so effort isn't aligned with outside earnings. Also, the combined profit is higher because of synergy—both contribute to that. If the sister takes 80% ($120k), the user gets $30k, which is more than solo but might not reflect their contribution. 

  The user's deeper needs: They want recognition that the sister brings more value but also that their joint effort creates extra value. They need a split that acknowledges both outside options and actual contributions. They might fear being undervalued or the sister leveraging her position unfairly.

  Next, considering fairness models. The Nash Bargaining Solution comes to mind—split the surplus equally. The surplus is $50k ($150k minus individual options: $80k + $20k = $100k). Each gets half of surplus plus their outside option. So sister: $80k + $25k = $105k; user: $20k + $25k = $45k. That's a 70/30 split. 

  Other factors: effort, responsibilities, future growth. If the sister handles clients and user manages operations, their roles might merit different base pay. Also, reinvesting profits could be discussed. A hybrid model with salary plus profit-sharing might work. 

  The user might not have considered the synergy value. Emphasizing that the extra $50k exists only because they work together, so it should be shared. Also, a fair split preserves the relationship and motivates both. The sister might accept less than her outside option because $105k is still more than $80k, and she benefits from the user's support. 

  Potential pitfalls: If the split feels unfair, resentment could build. Clear roles and periodic reviews can help. The user needs to communicate that both gain from cooperation, and the sister's higher share shouldn't undermine the user's contribution. 

  In conclusion, the Nash solution offers a balanced approach, but hybrid models or adjusted splits based on roles could also work. The key is recognizing joint creation of surplus and ensuring both parties feel valued for their unique inputs.
answer: |-
  This is a classic "partnership split" dilemma where fairness isn't obvious because it involves **outside options (what you could each get alone) vs. joint value creation (the extra $50k you generate together)**. Your intuition that both a simple 50/50 *and* a strict 4x split feel wrong is spot-on. Here's a breakdown of fair approaches, focusing on economic logic and partnership dynamics:

  **Core Concepts to Consider:**

  1.  **Outside Options (Walk-Away Values):** $80k for your sister, $20k for you. These are crucial starting points.
  2.  **Joint Value Creation:** Together you create $150k, which is **$50k MORE** than your combined outside options ($80k + $20k = $100k). This extra $50k exists *only because you work together*.
  3.  **Synergy:** The $50k surplus comes from combining *both* your contributions – her connections *and* your labor/shop management. Neither can create it alone.
  4.  **Fairness vs. Leverage:** Your sister's higher outside option gives her leverage, but fairness requires recognizing the *joint* creation of the surplus.

  **Fair Split Models:**

  1.  **The Nash Bargaining Solution (Economic Fairness Standard):**
      *   This Nobel Prize-winning concept focuses on splitting the *surplus* ($50k) created by cooperation *equally*, after each partner is guaranteed their outside option.
      *   **Calculation:**
          *   Combined Outside Options: $80k (Sis) + $20k (You) = $100k
          *   Total Joint Profit: $150k
          *   **Surplus (Value of Cooperation):** $150k - $100k = $50k
          *   **Split the Surplus 50/50:** $25k each
          *   **Final Split:**
              *   Sister: $80k (outside option) + $25k (surplus share) = **$105k**
              *   You: $20k (outside option) + $25k (surplus share) = **$45k**
      *   **Ratio:** ~70% (Sister) / 30% (You)
      *   **Why it's Fair:** Each gets what they could get alone *plus* an equal share of the *extra* value created by working together. It directly addresses both outside options *and* the synergy. Your sister is significantly better off cooperating ($105k > $80k), and you are *much* better off ($45k > $20k).

  2.  **Proportional to Outside Options, *but* Guaranteeing Minimums:**
      *   Acknowledge the outside option disparity but ensure you get *significantly more* than your solo $20k.
      *   **Calculation:**
          *   Sister's Outside Option %: $80k / $100k = 80%
          *   Your Outside Option %: $20k / $100k = 20%
          *   Apply this to the *Total* $150k: Sister = 80% * $150k = **$120k**, You = 20% * $150k = **$30k**
      *   **Why it's Less Fair (but she might push for it):** This gives your sister the *entire* benefit of the synergy ($120k - $80k = $40k) while you get only a small part ($30k - $20k = $10k). It ignores that the synergy requires *both* of you. You get more than $20k, but it feels like she's capturing most of the joint value purely based on her leverage, not fairness.

  3.  **Equal Split with Salary/Base Pay (Hybrid Model - Often Practical):**
      *   **Step 1: Pay "Salaries" Reflecting Roles/Value:** Define roles (e.g., she handles sales/client relations, you handle shop operations/production). Assign a fair market "salary" to each role based on the work required, *not* outside options. (e.g., Sales Role: $60k, Shop Manager/Lead Craftsman: $50k - adjust based on local rates and actual duties).
      *   **Step 2: Split Remaining Profits:** After paying these "salaries," split the *remaining profit* (the true "profit" of ownership) equally (50/50) or according to initial capital contribution if relevant (though inherited, it might be 50/50).
      *   **Example:**
          *   Total Profit: $150k
          *   Sister's "Sales Salary": $60k
          *   Your "Shop Manager Salary": $50k
          *   **Remaining Profit:** $150k - $60k - $50k = $40k
          *   **Split Remaining 50/50:** Sister $20k + You $20k
          *   **Total: Sister = $80k, You = $70k**
      *   **Ratio:** ~53% (Sister) / 47% (You)
      *   **Why it Can Work:** It directly compensates effort and specific contributions. Your sister earns a premium for her critical sales role, you earn a premium for running the shop. The *ownership* profit is then shared equally. This often feels fair on a day-to-day level.

  **Why Your Sister's Strict 4x ($120k/$30k) Split is Problematic:**

  1.  **Ignores Synergy Value:** It assumes she "deserves" 80% of the *total* pie solely because of her connections, ignoring that $50k only exists because you *both* work together. She gets 100% of the synergy benefit ($40k extra), you get only a fraction ($10k extra).
  2.  **Disincentivizes You:** $30k might feel like barely more than your $20k solo option. Are you motivated to work hard for an extra $10k while she reaps $40k extra? Resentment builds.
  3.  **Overvalues Leverage, Undervalues Contribution:** It prioritizes her *threat* to leave over the *actual value* you bring daily to make the $150k possible. Your labor and shop management are essential.

  **Recommendations & Key Arguments to Make:**

  1.  **Advocate for the Nash Solution (70/30 - $105k/$45k):** This is the strongest *fairness* argument. Frame it positively:
      *   "Working together creates an extra $50k that wouldn't exist if we split up. We *both* make that possible. The fairest way is for each of us to get what we'd get alone *plus* an equal share of that extra $50k. You get $105k (way better than $80k), I get $45k (way better than $20k). We both win big from cooperating."
  2.  **Be Prepared to Negotiate (Hybrid Model - $80k/$70k example):** If she strongly resists 70/30, the salary + equal profit split is a strong compromise. It directly pays her more for her critical sales role but ensures you are fairly compensated for your vital operational role and share equally in the ownership success. Argue:
      *   "Your connections are incredibly valuable, and we should pay you a premium for the sales role. My work running the shop efficiently is also critical to delivering on those sales. Let's pay fair 'wages' for our *jobs*, and then split the *ownership* profit equally. That way, your sales skill is rewarded, my production skill is rewarded, and we share the success of the business we own together equally."
  3.  **Key Arguments Against Her 80/20 ($120k/$30k):**
      *   **Synergy:** "That $150k only happens because we *both* show up. My $20k solo is irrelevant to *this* business – what matters is the value I contribute *here*, which helps create the extra $50k. I deserve a fair share of *that* joint creation."
      *   **Your Value:** "If you walked away, you'd make $80k, but you'd also have to *do everything* yourself or hire someone. Here, I'm handling [list your key responsibilities - production, ordering, shop maintenance, etc.], freeing you up to focus on sales. That's real value I bring *now*."
      *   **Sustainability/Motivation:** "For this to work long-term, we both need to feel valued and motivated. If I feel like I'm only getting a tiny slice above what I could scrape together alone, while you get the lion's share of the benefit *we create together*, it won't be sustainable. I want us both to be excited to come to work."
      *   **Her Best Interest:** "$105k (or $80k + half the profit in the hybrid model) is still *significantly more* than your $80k solo option. You are *better off* in this partnership than alone, just like I am."

  **Crucial Next Steps:**

  1.  **Define Roles & Responsibilities:** Get crystal clear *who* does *what*. This makes valuing contributions easier.
  2.  **Project Realistic Numbers:** Is $150k achievable Year 1? What about costs? Build a simple budget/projection.
  3.  **Put it in Writing:** Whatever you agree on, formalize it in a Partnership Agreement drafted by a lawyer. Cover profit split, salaries (if applicable), decision-making, exit strategies (what if one wants out?), capital contributions, etc.
  4.  **Revisit:** Agree to review the split annually for the first few years as the business stabilizes.

  **The Bottom Line:** True fairness lies in acknowledging that while your sister brings greater *leverage* due to her connections, the *surplus value* ($50k) is a product of *both* your efforts working together. The Nash Solution (70/30) or the Hybrid Model (Salary + Equal Profit) best capture this principle. A strict 4x split based solely on outside options unfairly denies you a meaningful share of the value *you help create*. Frame the discussion around mutual benefit and the joint creation of success. Good luck!
