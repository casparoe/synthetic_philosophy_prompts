answer: |-
  That's an impressively sharp set of questions, especially coming from an engineer diving into primary pragmatist texts! You've hit on core tensions that scholars still debate. Let's break down Peirce's claims and the Peirce-James contrast:

  **1. Circularity? (Investigation Presupposing Truth)**
  *   **The Concern:** You're right that "inquiry" or "investigation" intuitively aims at truth. Defining truth *in terms of* inquiry seems circular: "Truth is what inquiry finds... but inquiry is defined as seeking truth."
  *   **Peirce's Defense & Nuance:**
      *   **Fallibilism & Doubt as Driver:** For Peirce, inquiry doesn't start with a *presupposed* perfect truth. It starts with genuine *doubt* caused by a surprising clash between expectations and experience. The "getting things right" emerges *from* the process, driven by an external reality that resists our expectations.
      *   **The "Fixation" of Belief:** Peirce's famous essay contrasts methods of settling belief (tenacity, authority, a priori reason, science). He argues science is superior precisely because it's constrained by something *external* (reality) that eventually forces convergence *despite* individual starting points or wills. "Investigation" here means specifically the *scientific method* applied diligently.
      *   **The "Virtuous" Circle?:** Some argue this isn't *viciously* circular but rather *operational*. Truth isn't defined *prior* to inquiry but *constituted* by its ideal outcome. The concept of "getting it right" is *built from the ground up* by observing how belief *actually* becomes stable and shared when subjected to public, experimental testing against an external world. The "circularity" reflects the interdependence of the concepts within his system.
  *   **The Risk:** It remains a valid criticism that Peirce relies on an intuitive notion of "genuine" or "competent" investigation, which carries an implicit telos of truth-seeking. He tries to ground this in the *method* (science) and its *external constraint* (reality), but the circularity worry persists.

  **2. The Meaning and Work of "Fated"**
  *   **The Ambiguity:** "Fated" is indeed crucial and tricky. It strongly suggests inevitability, bordering on determinism. This raises concerns about historical contingency and the possibility of permanent error.
  *   **The Counterfactual Reading (Dominant & More Defensible):** Most scholars interpret this counterfactually: "Truth is the opinion that *would be* agreed upon *if* inquiry were pushed sufficiently far by a community of investigators using the scientific method." The "fated" emphasizes the *compelling power of reality* upon the investigative process, not literal historical determinism.
  *   **Guarding Against Triviality:**
      *   **"All who investigate":** Peirce doesn't mean *anyone* who glances at the problem. He means competent investigators committed to the norms of science: honesty, openness to evidence, fallibilism, repeatability, logical reasoning, etc. Gerrymandering the community violates these norms.
      *   **"Sufficiently Far":** This implies ideal conditions: sufficient time, resources, evidence, freedom from bias (as much as possible), and application of the method. It's not about what happens in practice *now*, but what *would* happen *under ideal epistemic conditions*.
      *   **The Constraint of Reality:** The "fate" isn't arbitrary; it's dictated by the resistance and structure of the external reality ("the real") that investigators bump up against. Reality *forces* convergence *if* the method is properly applied long enough. Trivial convergence (e.g., agreeing because everyone is paid to agree) isn't driven by *reality* and thus doesn't count.
  *   **Is it Guaranteed?** Peirce was an optimist about science and reality's knowability. He believed convergence *would* happen given the method and the constraining reality. However, the counterfactual formulation makes it a *regulative ideal* guiding inquiry, not a guarantee about historical timelines. He acknowledged the *practical* possibility of long-standing or even permanent error on specific points, but held that the *ideal* convergence defines truth.

  **3. Mundane Facts (Pebbles on the Beach)**
  *   **The Challenge:** If no one *ever* investigates the exact number of pebbles at that exact time, does the "fated ultimate agreement" exist? Is there a truth?
  *   **Peirce's Response (Counterfactual Idealization):** Peirce *would* say there is a truth. His theory commits him to it.
      *   **The Counterfactual Holds:** *If* a sufficiently large, competent, and diligent community of investigators *were* to apply the scientific method to counting those pebbles at that time (somehow overcoming the practical impossibility!), they *would* converge on a specific number. That number, counterfactually established, *is* the truth about the pebbles.
      *   **Truth as Dispositional:** Truth, for Peirce, isn't dependent on *actual* belief or investigation. It's a property the proposition *would have* under ideal investigative conditions. The pebble count has a specific, dispositional truth-value grounded in what *would* happen *if* investigated properly, even if that investigation never occurs.
      *   **Reality as the Ground:** The reality of the pebble arrangement at that moment is what *would* force the convergent opinion if investigation occurred. The truth is grounded in that reality, made manifest *through* the counterfactual ideal inquiry.
  *   **The Cost:** This is a significant idealization. Critics argue it makes truth strangely detached from actual epistemic practices and potentially unknowable even in principle for vast swathes of propositions. Peirce accepts this as a consequence of defining truth as an ideal limit.

  **Peirce vs. James on Truth: A Real and Significant Divide**

  Your secondary sources are largely correct. The contrast is substantial and explains Peirce's "pragmaticism" rebranding.

  1.  **Peirce's "Truth":**
      *   **Communal & Long-Term:** Focused on the *ultimate* opinion of the *entire community* of scientific investigators.
      *   **Method-Driven:** Tightly linked to the *scientific method* as the privileged (though fallible) path to convergence.
      *   **Reality-Constrained:** Emphasizes the external reality forcing convergence upon the community.
      *   **Counterfactual/Ideal:** Truth is defined by a *future, ideal* state of knowledge.
      *   **Less Psychological:** More focused on the logical structure of inquiry and the external constraint than individual belief states.

  2.  **James's "Truth" (in works like "Pragmatism"):**
      *   **Individualistic & Experiential:** Focused on what is "expedient," "profitable," or "satisfactory" *for an individual thinker* "in the long run and on the whole of course" (James's qualification, often downplayed).
      *   **"Cash Value":** Truth is what "works," what has practical consequences and "pays off" in guiding action and providing satisfaction *for the believer*.
      *   **Broadly Practical:** "Working" isn't limited to scientific verification; it includes emotional, moral, and religious satisfaction ("The Will to Believe").
      *   **Psychological & Present-Tense:** More focused on the *current* benefits and experiential verification *for the individual* holding the belief. Truth is made *in the process* of verification.
      *   **Pluralistic:** More open to multiple truths serving different human needs or perspectives.

  **Key Differences & Why Peirce Renamed:**

  *   **Scope of "Work":** Peirce focused on what "works" in the narrow sense of scientific prediction and explanation leading to communal convergence. James expanded "works" to include psychological satisfaction and individual utility in a much broader sense.
  *   **Role of the Community:** Peirce's truth is inherently *social* and defined by *intersubjective* agreement under method. James's truth can be much more *solitary* and defined by *personal* experience.
  *   **Subjectivity Risk:** Peirce saw James's formulation as opening the door to relativism or subjectivism – if truth is what "works" for *me* right now, even in a spiritual sense, how is it different from mere wishful thinking? James argued for "the long run" and consistency with other truths, but Peirce felt he hadn't sufficiently guarded against subjectivism.
  *   **Pragmaticism:** Precisely to distance himself from what he saw as James's (and others') misappropriations and dilutions of his original, stricter, logic-and-science-oriented conception, Peirce coined the ungainly term "pragmaticism" – a name "ugly enough to be safe from kidnappers."

  **Conclusion:** You've pinpointed genuine complexities in Peirce's view: the potential circularity, the crucial yet ambiguous role of "fated," and the demanding counterfactual idealization required to handle uninvestigated facts. Regarding James, the contrast is real and significant. While both are pragmatists sharing core ideas about meaning, belief, and the importance of consequences, their theories of truth diverge sharply on the axis of communal/scientific convergence (Peirce) versus individual/experiential satisfactoriness (James). Peirce's renaming was a direct response to this divergence, asserting his stricter, more objective vision against what he perceived as James's subjectivizing tendencies. Your lunch group is wrestling with exactly the right issues!
