answer: |-
  ## Honor Council Memo: Clarifying Policy on AI Writing Assistance  
  **To:** Honor Council Members  
  **From:** [Your Name], Student Representative  
  **Date:** [Current Date]  
  **Subject:** Urgent Recommendation for Case # [Number] & Policy Revision Timeline  

  ### I. Case # [Number] Ruling Recommendation  
  After reviewing the evidence and past precedents, **I recommend finding the student in violation** of the collaboration policy. My reasoning balances textual interpretation, academic intent, and fairness:  

  1. **"Substantially Rewrites" Applies Here**:  
     - The policy prohibits tools that "generate or substantially rewrite sentences." The student inputted her own sentences but instructed the AI to "make this flow better."  
     - "Flow" improvements inherently alter syntax, structure, and rhetorical coherence—core elements of "substantial rewriting." Grammar-checkers (e.g., fixing commas or misspellings) polish surface errors; rewriting transforms *how ideas are expressed*.  
     - Analogy: Using a calculator for arithmetic is permitted; using one to derive a proof is not. Similarly, AI that reprocesses *meaning* exceeds grammar-checking.  

  2. **Fairness Despite Ambiguity**:  
     - I acknowledge three colleagues’ concern: If past cases don’t resolve this, shouldn’t the student get the benefit of the doubt? **This is valid but misapplied here.**  
     - Benefit of the doubt protects students when *rules are silent or genuinely unclear*. Here, the rule *is* clear in spirit: students must produce original *expression*, not outsource it. The student knew the policy, sought to bypass clunky prose via AI, and took a risk.  
     - Precedent: Past Council rulings consistently penalized outsourcing *intellectual labor* (e.g., contract cheating). This case aligns with that principle.  

  **Verdict:** Uphold the professor’s finding. Sanction: [e.g., rewrite assignment, formal warning].  

  ---

  ### II. Policy Revision Proposal  
  Our current language is outdated and vulnerable to Wittgensteinian "rule-following" ambiguities. We must clarify *before* next semester’s syllabi deadline.  

  **Proposed Revised Language:**  
  > “Students may use tools that correct spelling, grammar, punctuation, or citation formatting.  
  > **Prohibited** are tools that:  
  > (a) Generate new sentences/paragraphs;  
  > (b) Rephrase or restructure existing sentences/paragraphs (e.g., altering syntax, rhetorical flow, or argumentative sequencing); or  
  > (c) Provide substantive edits beyond minor corrections.  
  > *Exception*: Tools used solely to identify awkward phrasing (without suggesting edits) are permitted.”  

  **Why This Works:**  
  - Explicitly names "rephrasing," "restructuring," and "rhetorical flow" to cover AI-assisted rewriting.  
  - Distinguishes *correction* (allowed) from *reconstruction* (banned).  
  - Includes examples to prevent "quus"-style ambiguities.  

  **Timeline for Approval:**  
  1. **This Week**: Circulate draft to Council for feedback.  
  2. **Next Week**: Finalize language in emergency session.  
  3. **10 Days Out**: Submit to Faculty Senate/Academic Committee for fast-track review.  
  4. **3 Weeks Out**: Distribute revised policy to all faculty for Spring syllabi.  

  ---

  ### III. Addressing the Philosophical Concern  
  To colleagues arguing that past practice doesn’t bind this case: **You’re right that we’re interpreting, not “discovering,” the rule.** But academic integrity policies *must* evolve with technology.  
  - **Fairness isn’t frozen**: Giving the "benefit of the doubt" here would create a loophole for all AI rewriting, undermining the policy’s intent.  
  - **Our role is dual**: Judge *this* student by the best interpretation of existing rules, while *fixing* those rules for future cases. We do both today.  

  ---  
  **Action Required:**  
  1. Vote Thursday on Case # [Number] per my recommendation.  
  2. Approve the policy revision timeline.  
  3. Co-sponsor this language with me at the Faculty Senate.  

  This isn’t just about one student—it’s about aligning our principles with a world where AI blurs lines we must defend. Let’s act decisively.  

  // Respectfully,  
  [Your Name]  

  ---

  ### Key Strengths of This Memo:
  - **Decisive on the case** while validating philosophical concerns.  
  - **Concrete policy rewrite** closes the AI loophole with precise language.  
  - **Tight timeline** ensures practical impact by next semester.  
  - **Preempts "fairness" objections** by distinguishing *retroactive ambiguity* from *proactive integrity*.  
  - **Tone** balances academic rigor with urgency (no "fence-sitting").  

  **Next Step:** Run this draft by a faculty ally on the Council first to gauge support. Good luck Thursday—this is exactly why student voices matter.
