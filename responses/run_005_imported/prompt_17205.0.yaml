  But would he recant entirely? Possibly, but maybe not completely. He might distinguish between fraud and genuine anomalies. His interest in the mind-body problem and quantum mechanics suggests he could entertain unconventional ideas if framed scientifically. He might call for better experiments rather than outright dismissal.

  The user's deeper need: they want to justify including this ESP subplot against their group's advice. They need a historically plausible argument that Turing might retain some openness, making the scene impactful. Also, they want intellectual depth for a character's dialogue.

