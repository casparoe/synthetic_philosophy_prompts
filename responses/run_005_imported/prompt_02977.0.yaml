answer: |-
  I believe Hobbes would have **categorically rejected the physical applicability of non-Euclidean geometries** and dismissed Einstein's theory as a sophisticated but ultimately conjectural natural philosophy, **vigorously reaffirming Euclidean geometry as the sole demonstrable science of space and the only legitimate foundation for physics**. Here's the reconstruction and defense, engaging directly with the tension:

  1.  **The Core Defense of Euclidean Certainty:** For Hobbes, the demonstrability of geometry arises *exclusively* from the act of construction *within the Euclidean framework*. When he says we generate figures "by the motion of bodies," he means *concrete, imaginable motions* like drawing a line with a stylus or compass. Euclid's definitions and postulates (especially the parallel postulate) aren't arbitrary conventions for Hobbes; they are *discovered* constraints reflecting the *only possible way* to coherently imagine and construct spatial figures based on the phantasm of extension derived from real body experience. Alternative postulates wouldn't describe conceivable constructions using real motions. Lobachevsky's or Riemann's abstract systems, defined purely by stipulation without grounding in conceivable motion, would be seen by Hobbes not as *alternative geometries*, but as *logical games* or *newly defined abstract calculi*. They lack the **essential link to the phantasm of real bodily extension generated by motion** that gives Euclidean geometry its unique status as *scientia*.

  2.  **Resolving the Tension: Constructivism Serves Realism:** You correctly identify the tension: his constructivism seems to invite pluralism, yet his realism about extension demands singularity. Hobbes resolves this tension **by anchoring constructivism firmly in sensory experience and imaginable motion**. The "maker's knowledge" isn't pure conventionalism. We "make" geometric figures, but we do so *within the inescapable constraints of the phantasmal space generated by our experience of real bodies*. The "definitions" Hobbes refers to aren't free creations; they are attempts to formally capture the necessary conditions for imagining coherent figures *within this single, given phantasmal space*. Non-Euclidean systems, defined abstractly, bypass this grounding in the *common phantasm*. Therefore:
      *   **Congenial?** Only as intellectual exercises demonstrating logical possibility *within a stipulated axiom set*. They pose no threat to Euclidean geometry's status as the *true* science of space because they don't engage with the *same subject matter* – the phantasm derived from real bodily extension. They are about different, self-contained conceptual objects.
      *   **Catastrophic?** Only if misapplied to the physical world. Their mere existence as consistent systems isn't problematic for his nominalism *per se*, as they are just different names/conventions applied to different conceptual structures. The catastrophe would be claiming they describe *real space*.

  3.  **Einstein: Conjecture Masquerading as Geometry:** Einstein's use of non-Euclidean geometry would confirm Hobbes's deepest suspicion about natural philosophy: it is inherently conjectural. For Hobbes:
      *   The claim that physical space *itself* is curved is a hypothesis about the *hidden causes* of observed phenomena (e.g., light bending, planetary orbits). We did not construct the universe; we can only infer its structure. This is classic natural philosophy – conjectural.
      *   Using a non-Euclidean *calculus* to model these phenomena is just a sophisticated tool, akin to using algebra. It doesn't mean the non-Euclidean axioms describe the *actual construction of figures in real space*. The tool's effectiveness doesn't grant its foundational axioms the same demonstrable certainty as Euclidean constructions grounded in imaginable motion. Geometry (Euclidean) provides the certain language; physics uses that language to formulate testable (but never certain) hypotheses about nature.
      *   **The Fatal Blurring:** Einstein's theory directly challenges Hobbes's strict separation. By making the *geometry itself* part of the empirical hypothesis, it suggests that the very foundation of demonstrable knowledge (geometry) is contingent on natural philosophy. Hobbes would see this as a profound category error, collapsing the tower of certainty. He would insist: Euclidean geometry remains certain *as the science of constructed figures in phantasmal space*; any application to the physical world remains conjectural physics, regardless of the mathematical tools used.

  4.  **The Wallis Precedent & Maker's Knowledge:** Hobbes's reaction to Wallis is precisely the model. Wallis represented the "professional mathematician" using advanced algebraic/analytic methods that Hobbes saw as detached from the true source of geometric certainty: clear definitions based on imaginable construction. Lobachevsky, Bolyai, Riemann, and Einstein would be seen as Wallis squared – creating ever more abstract systems detached from the phantasmal basis of true geometry. The "maker's knowledge" doctrine empowers Hobbes to dismiss them: *He* knows what true geometric construction entails (Euclidean motion), and *they* are building castles in the air of abstract stipulation. Their internal consistency is irrelevant to the truth about space, which is revealed only through the act of constructing figures based on the phantasm of body.

  **Definitive Reconstruction of Hobbes's Response:**

  "These modern geometers, like Wallis before them but with greater artifice, mistake the play of symbols for the substance of knowledge. By stipulating axioms contrary to the evident truths of construction by motion, they devise curious fancies – logical worlds of their own making. Let them amuse themselves with these *logistica*; it proves only the fecundity of the human mind in framing definitions. But let them not confuse their inventions with *geometry*, the true science of space derived from the phantasm of body and the generation of figures by conceivable motion. This alone yields demonstration.

  As for this Einstein, he compounds the error. He takes these abstract calculi and would have us believe they reveal the hidden fabric of the universe itself! This is the purest natural philosophy – and thus conjecture, however ingeniously supported by observation. That light bends or planets wander is a phenomenon; to say space itself is curved is an hypothesis about an unseen cause. We might *use* a non-Euclidean calculus to predict the bending, as we use algebra to balance a ledger, but this no more proves space is non-Euclidean than double-entry bookkeeping proves money grows on trees. The certainty of geometry resides in our constructive acts within the space of our phantasms; the description of nature's body remains forever hypothetical. To tie the first to the second is to build on sand. Euclid's geometry stands, certain and demonstrable, as the only true foundation upon which our necessarily conjectural physics must rest, however imperfectly."

  **In essence:** Hobbes would leverage his constructivism to *insulate* Euclidean geometry from the challenge of non-Euclidean systems, defining "true geometry" so narrowly (as constructions based on motion within the phantasm of body) that alternatives become irrelevant abstractions. He would then wield his strict separation between demonstrable geometry and conjectural physics to dismiss any empirical challenge to Euclidean space as merely a sophisticated but uncertain physical model. The tension is resolved by doubling down on the *empirically grounded* nature of his constructivism and the *absolute* nature of the separation between the science of our constructions and the science of nature's construction.
