prompt: |-
  I'm researching a feature on the intellectual history of costly-signaling theory, and I keep getting stuck on how one specific passage fits into that later theory. It's from Darwin's discussion of the Argus pheasant in The Descent of Man (1871), where he considers the male's elaborately shaded wing ornaments:

  "The case of the male Argus pheasant is eminently interesting, because it affords good evidence that the most refined beauty may serve as a charm for the female, and for no other purpose. We must conclude that this is the case, as the primary wing-feathers are never displayed, and the ball-and-socket ornaments are not exhibited in full perfection, except when the male assumes the attitude of courtship. The Argus pheasant does not possess brilliant colours, so that his success in courtship appears to have depended on the great size of his plumes, and on the elaboration of the most elegant patterns. Many will declare that it is utterly incredible that a female bird should be able to appreciate fine shading and exquisite patterns. It is undoubtedly a marvellous fact that she should possess this almost human degree of taste, though perhaps she admires the general effect rather than each separate detail. He who thinks that he can safely gauge the discrimination and taste of the lower animals, may deny that the female Argus pheasant can appreciate such refined beauty; but he will then be compelled to admit that the extraordinary attitudes assumed by the male during the act of courtship, by which the wonderful beauty of his plumage is fully displayed, are purposeless; and this is a conclusion which I for one will never admit."

  Darwin rests his whole case on the female's "taste" and insists the ornament serves "for no other purpose" than to charm her, with no appeal to cost as a guarantee of honesty. Since the handicap principle explains costly ornaments by appeal to exactly that idea, I'd like help placing this passage relative to it: is Darwin here already anticipating something that only needed Zahavi's reinterpretation to become a signaling argument, or is his reasoning closer to a distinct, non-handicap account — something nearer to what later became Fisherian runaway selection — that the handicap principle was partly devised to replace?
