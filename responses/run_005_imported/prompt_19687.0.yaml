  Upon revisiting, Jaynes' scale invariance requires that the probability remains the same even if we consider circles of different sizes. In the endpoint method, since it's based on points on the circumference, the actual size doesn't matter. Similarly, for the midpoint method, because the critical region scales with R, the probability remains constant. But where does the midpoint method fail? Jaynes actually argued that the midpoint method is rotationally and translationally invariant but not scale-invariant? That doesn't seem right. I think I have a mistake.

  Actually, Jaynes' paper points out that rotational invariance is the key. The fixed radius method fails rotational invariance because it picks a specific direction. The midpoint method is rotationally invariant because all directions are symmetric. But why does he dismiss the midpoint method? He doesn't—he says both endpoint and midpoint are rotationally invariant, but he also considers translational invariance and scale invariance.

