  The friend's argument is that even without representation, abstract art can transmit a specific feeling sincerely. The user counters that Tolstoy's focus on clarity and universality would exclude abstract art, seeing it as elitist like Wagner or Symbolist poetry.

  I need to break down each criterion. Individuality: Abstract art does express unique emotions, so that might be a point for the friend. Sincerity: Tolstoy values the artist's genuine emotion. Rothko and Kandinsky were sincere, so that's another check. But clarity is where it gets tricky. Tolstoy thought clarity required representation. Without recognizable forms, can the average person grasp the emotion? Probably not, aligning with the user's view.

  The moral test of uniting people is crucial. Tolstoy believed art should be accessible to peasants and laborers. Abstract art, especially in the 20th century, was often criticized as elitist, appreciated only by the educated. This supports the user's argument that Tolstoy would see it as divisive.

  Tolstoy’s rejection of obscure art forms like Symbolist poetry shows he’d likely dismiss abstraction. He might view it as another form of counterfeit art, failing his moral test. So the user's interpretation seems closer. But the friend’s point about sincerity and individuality is valid, though not sufficient without clarity and universality.

  The user’s deeper need might be understanding how rigidly Tolstoy’s standards apply to modern art. They might also want validation of their interpretation in the debate. Recognizing the nuances in Tolstoy's criteria could help them see why both arguments have merits, but the moral and accessibility aspects are decisive.
answer: |-
  Based strictly on Tolstoy's criteria in *What Is Art?*, I believe your reading is significantly closer to the mark. Here's a breakdown of how Tolstoy would likely judge abstract art, applying his core principles:

  1.  **Individuality of Feeling:** Your friend has a point here. Tolstoy demanded that art convey a feeling that is "fresh" and unique to the artist. Early abstractionists like Kandinsky were often driven by profound internal spiritual or emotional experiences they felt *couldn't* be expressed representationally. Tolstoy *might* grant that the feeling was individualized.

  2.  **Sincerity:** Again, your friend has a valid point. Tolstoy insisted the artist must genuinely feel the emotion they transmit. There's little reason to doubt the deep sincerity of Kandinsky, Rothko, or Pollock in their pursuit of abstraction. On this specific criterion, abstraction might pass.

  3.  **Clarity of Expression & Infection:** **This is where abstraction fundamentally fails Tolstoy's test, and why your argument holds stronger.** Tolstoy's entire concept of "infection" hinges on the *direct, unambiguous transmission* of a specific feeling from artist to perceiver. He believed this required **universal accessibility**, achievable primarily through **representational content** or simple, universally understood forms (like folk music or religious icons). He explicitly attacked art that relied on convention, education, or specialized knowledge to be understood.
      *   **Abstraction's Fatal Flaw:** Without recognizable subject matter or conventional forms, abstract art relies heavily on the viewer's subjective interpretation, prior knowledge of art history, theory, and the artist's intent. What one person perceives as profound spiritual depth (Rothko), another might see as mere color fields; what one feels as dynamic energy (Pollock), another might see as chaotic mess. Tolstoy would argue the feeling transmitted is **hopelessly vague and indeterminate**, lacking the precise "clarity" he demanded. It fails the infection test because the "infection" isn't reliably the *same specific feeling* the artist intended for the vast majority of viewers. It becomes, in his terms, "obscure."

  4.  **The Moral Test: Uniting vs. Dividing:** **This is the decisive criterion, and it strongly supports your view.** Tolstoy's ultimate judgment of art was moral: does it unite humanity in shared feeling, or does it cater to a privileged elite, setting people apart?
      *   **Abstraction as Elitist "Counterfeit":** Tolstoy would see abstract art as the *epitome* of the "upper-class" art he despised. Its appreciation relies heavily on education, exposure to art theory, and immersion in a specific cultural milieu. It is often inaccessible and alienating to the "common laborer" or "peasant" whose authentic emotional life Tolstoy idealized. The very debate *about* what an abstract work "means" or "feels like" would be proof to Tolstoy that it fails to transmit a single, clear, unifying feeling accessible to all. He would place it squarely alongside Wagner and Symbolism – sincere perhaps in its creators, but ultimately an exclusionary exercise in aesthetic complexity enjoyed by a small, educated class, failing its fundamental social-moral purpose. It would, in his view, *set people apart* based on education and class.

  **Conclusion:**

  *   **Tolstoy's Likely Judgment:** He would almost certainly **reject abstract painting as a movement**, classifying it as "counterfeit art." While he *might* concede individual sincerity and perhaps a form of individuality in the feeling sought, the movement would fail catastrophically on **clarity of infection** and, most damningly, on the **moral test of universality and unification**. Its reliance on non-representation, subjective interpretation, and necessary cultural context would place it directly in the category of elitist, obscurantist art he condemned.
  *   **Your Argument vs. Your Friend's:** **Your reading is closer to Tolstoy's core principles.** Your friend correctly identifies sincerity and potential individuality, but underestimates the absolute centrality of **clarity/universal infection** and the **moral imperative of unification across all classes** in Tolstoy's theory. Without these, sincerity and individuality are insufficient. Your emphasis on the exclusionary nature of abstraction and its parallels to the art Tolstoy explicitly attacked aligns perfectly with his moral and social critique.

  **The Nuance:** While Tolstoy would reject the *movement* and its typical effects, a *strictly hypothetical* abstract work that somehow managed to transmit a single, crystal-clear, universally accessible feeling with profound sincerity *might* theoretically pass his test. However, he would argue the *nature* of abstraction makes this virtually impossible, and the historical reality of its reception confirms its divisive, elite status. Based on the artists mentioned (Kandinsky, Rothko, Pollock) and the realities of abstract art's history and reception, Tolstoy's judgment would be unequivocally negative.
