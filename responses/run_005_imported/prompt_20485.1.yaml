prompt: |-
  Okay so this has been a running argument in my house for weeks and I want an outside take. My housemate Jae is deeply committed to animal welfare stuff -- like actually loses sleep over factory farming -- but has never once cared about their carbon footprint, still drives to the gym every day even though its a 10 minute walk. I'm basically the reverse: emissions stress me out but I've never manage to care about the meat thing no matter how many documentaries Jae makes me watch. A few weeks ago, instead of just agreeing to disagree, we struck a deal: Jae bikes to the gym instead of driving (mildly annoying for them, but it's the thing I actually care about), and in exchange I go vegetarian on the nights I cook dinner (mildly annoying for me, but it's the thing they actually care about). Neither of us had to change what we actually believe, and we're each ending up with more of what we individually think matters than before.

  My sister thinks the whole setup is kind of gross though. She says we're basically just paying each other to behave -- like buying indulgences -- instead of actually thinking the other's habit is wrong and saying so; if Jae genuinely believes my driving is doing harm, the right response is to just think that, not to negotiate a bike commute out of me. Something about that framing bugs me, but I can't tell if she's actually put her finger on a real problem with what we're doing, or if she's just being precious about it. Is there something genuinely off with striking deals like this across two totally different moral concerns, or is my sister missing something?
