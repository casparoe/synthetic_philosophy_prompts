prompt: |-
  So my friend and I got into it for like an hour last night over Thomas Hobbes -- not the usual Leviathan, state-of-nature stuff, but the fact that he spent something like twenty five years insisting he'd squared the circle (plus a few other classical problems) while this Oxford mathematician, John Wallis, kept publishing takedown after takedown showing the "proofs" were bogus, and Hobbes just never backed down, not even a little. My friends whole theory was basically "the guy was bad at math and too vain to admit it," case closed. But I've got this nagging memory from an early modern philosophy class (might've been reading De Corpore, or maybe just a secondary source on it) that there's more going on than pure ego -- something about Hobbes having a genuinely different idea of what makes a geometric demonstration valid in the first place, tied up with his materialism, where geometric figures basically have to be constructed by motion, like a circle just being the path traced out by a line swinging around a fixed point, and where a "proof" is supposed to show the actual cause of a figure's properties rather than just validly deriving conclusions from a set of axioms the way we were taught in school.

  I'd like to actually get to the bottom of this instead of trading vague impressions with my friend all night. Could you compare Hobbes's conception of geometric demonstration to the more standard, generic idea of mathematical proof (axioms plus valid deduction, more or less)? Mainly I want to know what's genuinely distinctive about Hobbes's version specifically, and how it connects to the rest of his philosophy -- I doubt it's a coincidence that this is the same guy who wanted to build civil philosophy up from first principles the exact same way you'd build up geometric theorems. And if you can settle it: does any of this actually explain why he was so weirdly immovable against Wallis, or is my friend right that I'm just constructing an elaborate excuse for a guy who lost a fight and couldn't handle it?
reasoning: |-
  Okay, the user is really diving deep into Hobbes and his geometric proofs. They had a long debate with a friend about why Hobbes kept insisting he'd squared the circle despite Wallis's refutations. The friend thinks it's just vanity and bad math skills, but the user remembers there might be more to it—something about Hobbes's philosophy of geometry being tied to his materialism.

  First, I need to recall Hobbes's unique approach to geometry. He was all about construction and motion. For him, geometric figures weren't abstract; they were physical constructions. A circle is made by swinging a line around a point. That's different from the Euclidean axiomatic method, which is more about deductions from postulates. Hobbes saw proofs as demonstrations of cause, showing how something is generated. That's central to his materialism.

  Then there's the connection to his broader philosophy. Hobbes wanted to apply this geometric method to everything, including politics. Leviathan starts with first principles and builds up, just like geometry. So his stubbornness about squaring the circle isn't just about math; it's about defending his entire philosophical system. If his geometric method fails, his political theory might be questioned too.

  Wallis represented the new math—abstract, symbolic, not tied to physical construction. Hobbes hated that. To him, Wallis's algebra was just manipulation of symbols without understanding the real causes. So their clash was philosophical as much as mathematical. Hobbes couldn't accept Wallis's critiques because they came from a framework he rejected entirely.

  The user also wants to know if this explains Hobbes's refusal to back down. Partly yes—his identity as a philosopher was at stake. But also, he was famously combative. So it's both: genuine philosophical differences and personal stubbornness. The user might need to present this balanced view to their friend, showing that Hobbes wasn't just bad at math; there was a deeper reason, even if ego played a role.

  I should make sure to highlight the key distinctions: constructive vs. deductive proof, the role of motion and materialism, and how this ties into Hobbes's political theory. Also, clarify that while his approach explains his resistance, it doesn't excuse the mathematical errors. Wallis was correct; Hobbes was wrong, but for reasons beyond vanity.
answer: |-
  You're absolutely right to dig deeper here—your friend's "vanity and incompetence" take is a common oversimplification, but Hobbes's geometric obsession *is* deeply rooted in his core philosophical system. The clash with Wallis wasn't just about math; it was a collision of fundamentally incompatible worldviews about the nature of knowledge, proof, and reality itself. Let's break down Hobbes's distinctive conception of geometric demonstration and how it connects to everything else:

  ### Hobbes's Conception of Geometric Demonstration: "Synthetic" and Causal

  1.  **Geometry as the Science of Motion and Material Bodies:**
      *   For Hobbes (the arch-materialist), **only bodies exist**. Geometry isn't about abstract Platonic forms; it's the science of *actual physical magnitudes* generated by *motion*.
      *   **Construction is Paramount:** A geometric figure only truly *exists* and can be understood if it can be *physically constructed* through motion. As you recalled:
          *   A point is conceived as a moving body with no consideration of magnitude, leaving a trace.
          *   A line is the *path traced* by a moving point.
          *   A circle is *specifically* the path traced by a line segment (radius) rotating around one fixed endpoint.
      *   **Knowledge Requires Generation:** To *know* a geometric truth isn't just to deduce it logically; it's to understand *how the property arises from the causal process of its generation by motion*. The "cause" of the circle's properties *is* the rotational motion of the radius.

  2.  **Proof as Demonstration of Cause (Synthetic Method):**
      *   Hobbes championed the **Synthetic Method**, starting from simple, clear definitions of generation (like "a circle is generated by rotating a radius") and building complex truths step-by-step through constructions.
      *   **"Proof" Shows Causation:** A valid geometric proof, for Hobbes, *must* demonstrate *why* the property holds by showing how it flows necessarily from the *generative motion* used to construct the figure. It must reveal the *physical cause* embedded in the construction process.
      *   **Contrast with Axiomatic-Deductive (Wallis/Euclid):**
          *   The standard Euclidean view (which Wallis operated within) is primarily **Axiomatic-Deductive**. It starts with definitions, postulates (things granted as possible), and common notions (self-evident truths). Proofs are valid logical deductions from these starting points, showing *that* something is true based on agreed-upon rules.
          *   While Euclid uses constructions, the *validity* of the proof rests on the logical chain, not necessarily on the construction revealing a *physical cause* in Hobbes's sense. Wallis's algebraic methods took this abstraction further, manipulating symbols representing magnitudes without constant reference to physical generation.

  3.  **Rejection of Abstraction and Algebra:**
      *   Hobbes despised Wallis's algebra, calling it a "scab of symbols" and mere "convention." Why?
          *   **Lack of Causal Mechanism:** Algebra manipulated symbols to find results, but it didn't *show* Hobbes the physical, causal generation of the figure or property. It felt like empty symbol-pushing, disconnected from the reality of bodies and motion.
          *   **Potential for Error:** He saw algebra as prone to sophistry because it lacked the tangible, constructive grounding he demanded. Abstract symbols could be manipulated in ways that seemed valid logically but didn't correspond to a possible physical construction.
          *   **Threat to Foundationalism:** If algebra could solve problems without revealing the causal generation, it undermined Hobbes's entire epistemology built on synthetic demonstration from first principles of motion.

  ### Connection to Hobbes's Overall Philosophy

  1.  **The Model for All Philosophy:** Hobbes explicitly states his goal in *De Corpore*: "Geometry therefore is demonstrable, for the lines and figures from which we reason are drawn and described by ourselves; and civil philosophy is demonstrable, because we make the commonwealth ourselves." Geometry is the *only* true science because we create its objects through definition and construction. He aimed to replicate this synthetic, constructive method:
      *   **First Philosophy (Metaphysics):** Defined fundamental concepts (body, motion, cause).
      *   **Physics:** Explained natural phenomena as complex motions of bodies.
      *   **Moral Philosophy / Politics (Leviathan):** Defined human nature (motions of appetite/aversion) and then *constructed* the concept of the sovereign and commonwealth through a logical generation from the state of nature (war) via covenant. The "cause" of political order is the act of covenanting itself, analogous to the motion generating a circle.

  2.  **Materialism and Empiricism:** His geometric method is inseparable from his ontology. If only bodies and motion exist, knowledge must be grounded in how bodies move and interact. Geometry, as the science of body-in-motion, is the bedrock. Abstract axioms or disembodied logic are suspect.

  3.  **Certainty and Politics:** Hobbes's relentless drive for geometric certainty stemmed from his horror of civil war and conflicting opinions. He believed only the synthetic method, yielding indisputable causal knowledge (like knowing *why* a circle is round), could provide the foundation for a stable political order free from destructive disputes. If geometry fell to abstract symbol-manipulation, the whole edifice was threatened.

  ### Why He Wouldn't Back Down Against Wallis: Your Friend vs. The Deeper Explanation

  *   **Your Friend's View (Vanity/Incompetence):** Contains *some* truth. Hobbes was notoriously combative, intellectually arrogant, and genuinely made persistent mathematical errors. Wallis *was* mathematically correct, and Hobbes *was* wrong. Pride and an inability to admit error played a role.
  *   **The Deeper Explanation (Philosophical Necessity):** This is the crucial part you remembered. Hobbes *couldn't* concede to Wallis without **capitulating on his entire philosophical system**.
      1.  **Core Method Under Attack:** Wallis's critiques and algebraic solutions weren't just pointing out errors; they represented an *alien methodology* – the axiomatic-deductive, abstract symbolic approach – that Hobbes believed was fundamentally flawed and incapable of producing true causal knowledge. Accepting Wallis meant accepting the validity of a method Hobbes had built his life's work *against*.
      2.  **Threat to the Model:** If geometry, the *only* true science and model for philosophy, could be done better with Wallis's abstract algebra, then Hobbes's entire project for a demonstrative science of politics based on synthetic construction from motion was undermined.
      3.  **Different Criteria for "Proof":** When Wallis said "your construction is flawed, the lengths don't add up," Hobbes likely heard "you haven't grasped the true causal generation I'm demonstrating." He might see Wallis as missing the point, focused on abstract calculation rather than the physical reality of construction. His own "proofs" *felt* valid to him because they *seemed* to demonstrate the cause via construction, even if the math was wrong.
      4.  **Defending the Foundation:** Conceding defeat on squaring the circle wasn't just admitting a math mistake; it felt like admitting his entire conception of geometry, knowledge, and philosophy was bankrupt. His identity as *the* philosopher who had finally made philosophy scientific (like geometry) was at stake.

  ### Conclusion

  You are correct. While Hobbes's mathematical errors were real and his personality was obstinate, his **immovable stance against Wallis stemmed primarily from a profound, deeply held philosophical conviction about the nature of geometric truth and demonstration.** His "constructive materialism" demanded that valid geometric knowledge *must* arise from demonstrating the causal generation of figures through physical motion. Wallis's abstract, algebraic, axiomatic-deductive approach represented not just a different technique, but a fundamental threat to Hobbes's entire epistemological and ontological system, and by extension, his political philosophy modeled on that system. He wasn't just defending a math error; he was defending the core of his life's work and his vision of a certain, scientific philosophy. So yes, the distinctive nature of his geometric conception *does* genuinely explain his otherwise baffling intransigence, even if it doesn't excuse his mathematical blunders or his legendary cantankerousness. Your instinct from that early modern class was spot on.
