  In psychology class, we learned that John Locke argued the mind begins as a blank slate, or tabula rasa, with no innate ideas. I've since started reading his Some Thoughts Concerning Education for a philosophy class assignment, and I assumed this view meant that Locke saw children as essentially interchangeable at birth, so that one well-designed method of instruction should work equally well for any child, with whatever differences we see later on being entirely a matter of upbringing. Is that an accurate way to understand his educational philosophy, or am I misapplying the blank slate idea to what he actually says about teaching children?
