  Random one for something I'm reporting on -- these "evolutionary debunking arguments" that are trendy in metaethics right now, the idea that if natural selection built our moral intuitions for fitness rather than truth, we can't really trust them as guides to whats actually right. A philosopher I interviewed mentioned, sort of in passing, that Nietzsche was doing basically the same move in the Genealogy of Morals a century before anyone had a name for it, and that comment's been stuck in my head since. Could you compare Nietzsche's genealogical method with the kind of debunking argument someone like Sharon Street makes, and tell me if the comparison actually holds up or if its just a loose analogy? Where do the two really line up, and where does it fall apart?
