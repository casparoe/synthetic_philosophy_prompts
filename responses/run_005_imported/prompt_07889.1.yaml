answer: |-
  That's a sharp observation from your interviewee, and it's a comparison worth exploring. While Nietzsche wasn't working with Darwinian theory in the precise way modern debunkers are, the structural similarities and philosophical resonance between his genealogical method in *On the Genealogy of Morality* (GM) and Sharon Street's evolutionary debunking argument (EDA) are profound. The comparison **holds up remarkably well in its core skeptical thrust and methodological approach, but diverges significantly in ultimate goals, scope, and attitude towards science/reason.**

  Here's a breakdown of the alignment and divergence:

  **Core Alignment: The Skeptical Engine**

  1.  **Origins Undermine Objectivity:** Both deploy an account of the *causal origins* of moral beliefs/intuitions to challenge their claim to objective truth or authority.
      *   **Nietzsche (GM):** Traces modern morality (especially "slave morality" - humility, compassion, equality) back to psychological and social forces: *ressentiment* (resentment) of the weak/powerless against the strong, the cunning of priests, the internalization of cruelty, and the will to power disguised as self-denial. He argues these origins reveal morality not as discovered truth, but as an expression of specific power dynamics and psychological needs ("All things that live long are gradually so saturated with reason that their origin in unreason thereby becomes improbable" - GM II:12). Its value lies in its *function* for certain types, not its truth.
      *   **Street (E.g., "A Darwinian Dilemma for Realist Theories of Value"):** Argues that our core moral intuitions were shaped by natural selection for their contribution to reproductive fitness (e.g., intuitions favoring kin altruism, cooperation within groups, certain hierarchies). If moral realism were true (objective moral facts exist independently of us), it would be an incredible coincidence if these fitness-driven intuitions reliably tracked those truths. The far more plausible explanation is that there *are* no such independent truths; our intuitions reflect adaptive pressures, not moral reality. The origins explain the intuitions without needing objective truth.

  2.  **Target: Moral Objectivity/Realism:** Both directly target the idea that morality is a realm of objective, mind-independent facts waiting to be discovered.
      *   **Nietzsche:** Explicitly attacks the "value of these values" (GM Preface, 6). He sees morality as a human *creation*, a perspective, often born from ignoble motives. "There are no moral phenomena at all, only moral interpretations of phenomena" (Beyond Good and Evil, 108).
      *   **Street:** Her EDA is explicitly aimed at *moral realism*. She argues the evolutionary origins make realism implausible because realism requires an implausible tracking relation between fitness-driven intuitions and independent truths.

  3.  **Methodological Parallel: Genealogy vs. Evolutionary Psychology:**
      *   **Nietzsche:** Uses historical, psychological, and philological *genealogy* to uncover the contingent, often ugly, origins of moral concepts. He looks for shifts in meaning (e.g., "good" from "noble, powerful" to "humble, meek"), the role of punishment, the invention of guilt and the bad conscience.
      *   **Street:** Uses the science of *evolutionary biology and psychology* to uncover the contingent, adaptive origins of our moral intuitions. She looks for how selective pressures would have shaped our emotional and evaluative responses.
      *   **Shared Core:** Both methods say: "Look at *how these beliefs actually came about*. Do these causal stories look like reliable processes for discovering objective truths, or do they look like processes geared towards something else entirely (survival, power, psychological coping)?"

  **Significant Divergences: Where the Comparison Breaks Down**

  1.  **Ultimate Goal & Prescription:**
      *   **Nietzsche:** Genealogy is **destructive *for the sake of creation***. Debunking slave morality is necessary to clear the ground for the "revaluation of all values" and the emergence of new, life-affirming values (potentially embodied by the *Übermensch*). It's fundamentally *prescriptive* – he wants to *change* what we value. His goal isn't just epistemological skepticism; it's existential transformation. Debunking reveals the *bankruptcy* of current values to motivate creating higher ones.
      *   **Street:** Her EDA is primarily **epistemological and metaethical**. While it leads her to endorse a form of *constructivism* (moral truths are constructed by our evaluative attitudes, themselves shaped by evolution), her primary goal is to undermine realism, not necessarily to prescribe new values or demand a radical cultural transformation. She's explaining the *status* of morality within a naturalistic worldview, not calling for its overthrow and replacement. Her focus is on explaining how moral truth *could* exist (constructed) within the evolutionary framework, not rejecting the concept of moral truth altogether.

  2.  **Scope of the Critique:**
      *   **Nietzsche:** His critique is far **broader and more radical**. He doesn't just target the objectivity of *current* moral intuitions; he targets the *value of morality itself* as a concept, particularly ascetic, life-denying morality. He questions the very *desirability* of universal moral codes. His genealogy also explicitly targets *Christianity* and its secular descendants (like liberalism and socialism).
      *   **Street:** Her critique is more **focused and technical**. She targets the epistemological justification for *moral realism* based on the origins of our *intuitions*. She's not necessarily condemning morality *as such*; she's offering a different metaethical account (constructivism) of what moral truth *is*. Her target is a philosophical position, not an entire cultural epoch or psychological type.

  3.  **Attitude Towards Science/Reason:**
      *   **Nietzsche:** Profoundly **suspicious of science and reason themselves** as being ultimately grounded in values and perspectives (like the will to truth). He sees them as tools of the ascetic ideal, not neutral arbiters. Genealogy itself is presented as a counter-science, revealing the perspectival nature of *all* knowledge claims, including scientific ones. "We have arranged for ourselves a world in which we are able to live—by positing bodies, lines, planes, causes and effects, motion and rest, form and content; without these articles of faith no one could endure life! But that does not prove them. Life is no argument; among the conditions of life might be error." (The Gay Science, 121)
      *   **Street:** **Embraces natural science (evolutionary biology)** as the authoritative framework for understanding human origins, including our moral faculties. Her argument *depends* on the truth of evolutionary theory. She works *within* the broadly scientific, naturalistic worldview that Nietzsche deeply problematizes. Reason and science are the tools she uses for the debunking.

  4.  **The Role of "Fitness" vs. "Power":**
      *   **Nietzsche:** Uses the **"Will to Power"** as a fundamental explanatory principle. Morality arises from power struggles, the weak overcoming the strong through cunning and revaluation, the internalization of power drives as guilt. It's a psychological and historical force.
      *   **Street:** Uses **Darwinian "fitness"** (reproductive success) as the fundamental explanatory principle. Moral intuitions are selected for because they enhanced cooperation, kin survival, etc., leading to better chances of passing on genes. It's a biological mechanism.

  **Conclusion: A Powerful Analogy with Crucial Differences**

  The comparison **absolutely holds up** as a recognition of a powerful shared *skeptical strategy*: using causal origins (whether genealogical-historical or evolutionary-biological) to undermine claims of objective moral truth by showing those origins are linked to functions other than truth-tracking (power dynamics, psychological needs, reproductive fitness).

  *   **Where it lines up:** Core methodology (origins undermine objectivity), target (moral realism/objectivity), the basic skeptical thrust.
  *   **Where it diverges:** Ultimate goal (Nietzsche's radical revaluation vs. Street's metaethical explanation within naturalism), scope (Nietzsche's broader cultural/psychological critique vs. Street's focused epistemological argument), attitude towards science/reason (Nietzsche's deep suspicion vs. Street's embrace), and the fundamental explanatory driver (Will to Power vs. Reproductive Fitness).

  Think of it like this: Nietzsche pioneered the *structure* and *radical potential* of using origins to debunk morality's pretensions to objectivity and inherent value. Street, operating within a 21st-century scientific naturalist framework, deploys a modern, biologically informed version of that structure specifically against moral realism. Nietzsche's project is far more ambitious and existentially charged, aiming to dismantle and rebuild our entire evaluative framework. Street's is more contained, aiming to place morality plausibly *within* our scientific understanding of the world, albeit in a subjectivist/constructivist way.

  Your interviewee was spot-on: Nietzsche was absolutely doing "the same move" in terms of wielding origins as a debunking tool, a century ahead of the curve. Recognizing this lineage deepens the understanding of both Nietzsche's radicalism and the philosophical roots of contemporary EDAs. Just remember Nietzsche's ambitions were ultimately far grander and more unsettling than simply solving a metaethical puzzle.
