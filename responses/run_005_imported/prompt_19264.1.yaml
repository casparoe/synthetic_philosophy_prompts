answer: |-
  Okay, this is a *fantastic* real-life application of a nuanced philosophical debate. You've grasped the core tension perfectly: **the truth of the accusation vs. the *right* to make it.** Let's break down "standing to blame" and how it interacts with the tu quoque fallacy and your situation.

  **1. Making Sense of "Standing" (Distinct from Truth & Avoiding Tu Quoque)**

  The key is understanding that "standing" operates on a *different level* than the factual truth of the accusation. The tu quoque fallacy is about **logical validity in an argument:** "Your argument about X is false *because* you are a hypocrite." That *is* a fallacy. The truth about X is independent of the speaker's behavior.

  Standing, however, is about **moral authority or legitimacy in the act of blaming.** It asks: "Even if what you say about X is *true*, do *you* have the moral position or right to be the one delivering this rebuke *right now*?" Think of it like this:

  *   **Truth:** Is the statement "You are a bad uncle (because you rarely visit)" factually accurate? (Seems partially true in your case).
  *   **Standing:** Does your brother occupy a position within the relevant moral relationship (brotherhood, family dynamics regarding care) that grants him the *authority* or *clean hands* necessary for his blame to carry its intended moral weight *and not be hypocritical*?

  **How Philosophers Separate Standing from Truth (Avoiding the Fallacy):**

  *   **R. Jay Wallace ("Hypocrisy, Moral Address, and the Equal Standing of Persons"):** Wallace focuses on the *conditions for moral community*. To participate meaningfully in holding others accountable for violating a norm, you must yourself be committed to that norm and hold yourself accountable to it. If you blatantly violate the norm *without acknowledging it or holding yourself accountable*, you undermine the reciprocal relationship necessary for legitimate moral address. Your brother blaming you for absence while being absent himself regarding your mom violates this reciprocity. **The truth of your absence isn't denied; the brother's *act of blaming* is illegitimate *because* it breaches the conditions of mutual accountability.**
  *   **G.A. Cohen ("Casting the First Stone..."):** Cohen emphasizes *fairness in the distribution of blame*. If someone is equally (or more) guilty of similar faults, especially within the same domain (family obligations), it's unfair for them to single you out for blame. They haven't "paid their dues" in terms of accepting responsibility for their own failures. **The truth of your fault remains, but the brother's act of blaming is unfair *because* he hasn't shouldered his own share of the burden.**
  *   **Kyle Fritz & Daniel Miller (Complicity Account):** They argue that hypocrites are often *complicit* in the very norms they invoke. By violating the norm themselves, they contribute to weakening it or setting a bad example. Blaming someone else while complicit sends a confused message: "This norm is so important I blame you for violating it, but not so important that *I* feel bound by it." **The truth stands, but the blame is hypocritical *because* the blamer is implicated in the erosion of the norm they appeal to.**

  **In your brother's case:** His accusation about your uncle duties *might be true*. But his *standing* to deliver that blame *effectively and legitimately* is undermined because:
  1.  He violates a similar norm (family care duties) without apparent acknowledgment/accountability.
  2.  This makes his moral address non-reciprocal (Wallace).
  3.  It makes the blame distribution unfair (Cohen).
  4.  It makes him complicit in weakening family obligation norms (Fritz & Miller).

  **This avoids tu quoque:** We aren't saying *"Therefore, you are NOT a bad uncle."* We're saying *"Therefore, your brother lacks the moral authority to effectively deliver this criticism *to you* in this context, *even if it's true*."* The truth of the uncle accusation is separate from the brother's fitness to be the blamer.

  **2. What Does Losing Standing *Do*? (Void vs. Weaken)**

  This is where the significant philosophical disagreement lies, and it has practical implications:

  *   **The "Misfire" / Void View (Stronger Wallace, some interpretations):** On this view, lacking standing means the act of blaming **fails entirely as a genuine moral address.** It's like trying to perform a speech act without the proper authority (e.g., a civilian trying to pronounce a legal sentence). The criticism doesn't just land poorly; it *fails to be the kind of thing it purports to be* – a legitimate call to account from an equal within the moral community. **Result:** The criticism has *no* legitimate moral force. It might sting emotionally, but it shouldn't generate the specific kind of moral guilt or obligation that legitimate blame does. Your brother's words are just noise, morally speaking.
  *   **The "Weakened Force" / Mitigation View (Cohen, Fritz & Miller, others):** This view holds that the criticism **retains its core truth and *some* moral force, but its effectiveness and legitimacy are significantly undermined by the hypocrisy.** The blamer's lack of standing acts as a *defeater* or *mitigating factor*.
      *   **Why it still has force:** The underlying norm *is* valid (e.g., "Uncles should be involved," "Children should help aging parents"). Your violation of the uncle norm *is* still a wrong, independent of your brother.
      *   **Why it's weakened:**
          *   The hypocritical blamer loses *credibility* and *persuasive power*. Their words ring hollow.
          *   The blame feels *unfair* and *resentment-inducing* rather than guilt-inducing, shifting focus to the blamer's fault.
          *   It fails to fulfill the *communicative function* of blame (to call someone back to shared norms) because the blamer isn't living by those norms.
      *   **Result:** The criticism might still prick your conscience *about the uncle issue*, but the brother's delivery makes it hard to hear *from him*, and it likely provokes defensiveness focused on *his* failure rather than prompting genuine self-reflection on yours. The *overall* moral weight of the situation is muddied.

  **The Shape of the Disagreement & Your Brother's Point:**

  *   **The Core Disagreement:** Is the hypocrite's blame a complete moral non-starter (misfire), or is it a severely compromised but still partially valid moral claim (weakened force)? This hinges on whether one sees legitimate blame as *strictly requiring* reciprocal commitment (strong standing) at the moment of address, or whether the underlying norm's validity provides *some* residual force even when delivered poorly.
  *   **Your Brother's Point:**
      *   **On Truth:** He's *factually* correct that your lack of visits is a failing *if* being an involved uncle is a value (which it seems to be in your family). His "sure, but that doesn't make what you're doing okay" directly acknowledges the tu quoque fallacy and insists on the truth's independence. **He's right about this logical point.**
      *   **On Standing:** *Philosophically*, he almost certainly **lacks standing** to deliver that blame effectively and legitimately *to you* due to his own checked-out behavior regarding your mom. This makes his criticism hypocritical, unfair, and likely counterproductive. **The *feeling* that it's "off" for *him* to say it is well-founded in the concept of standing.**
      *   **On Impact:** His criticism likely falls into the "weakened force" category. It might remind you of a genuine failing (being an absent uncle), but his hypocrisy severely undermines its moral weight *coming from him*, provokes justified resentment, and makes it far less likely to prompt positive change in *you* regarding uncle duties. Instead, it highlights *his* failure regarding your mom.

  **What This Means For You:**

  1.  **Acknowledge the Core Truth (to yourself):** However unfairly delivered, reflect honestly on whether you *are* as present an uncle as you could/should be. Your brother's hypocrisy doesn't magically absolve you of your own responsibilities *within that specific relationship* (uncle-niece/nephew).
  2.  **Recognize His Lack of Standing:** His hypocrisy *does* invalidate *his role* as your moral critic on the topic of family presence. You are justified in feeling it's "off" and in pointing out his inconsistency. It's not a fallacy to say *his criticism is hypocritical and therefore lacks force coming from him*; that's the standing argument.
  3.  **Separate the Issues:** Don't let his failed blame game completely obscure the two separate problems:
      *   Your potential neglect of uncle duties.
      *   His neglect of son duties regarding your mom.
  4.  **Address Constructively (If Possible):** Instead of getting stuck in a blame loop ("You failed!" "Yeah, well YOU failed worse!"), consider if there's a way to address both issues separately, perhaps with a neutral party or through calmer communication. "Brother, you're right that I haven't visited enough, and I want to work on that. But when you said that, it felt incredibly hypocritical given how you've avoided helping with Mom. That needs to be addressed too. Can we talk about how *both* of us can step up better in *all* our family roles?"

  **In short:** Your brother nailed the *truth* part but whiffed completely on the *standing* part. His criticism was factually grounded but morally compromised and ineffective *because he delivered it*. The philosophical debate helps explain *why* that "off" feeling is valid, even while acknowledging your own shortcoming.
