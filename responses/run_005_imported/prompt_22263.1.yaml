answer: |-
  Your analysis is sharp and touches on profound tensions in idealizing desire that Sidgwick exposes—and that persist in modern CEV-like proposals. Let's break down your three queries, then address the core dilemma for idealization:

  ### 1. **The "Contented Pig" Objection & Sidgwick's Revision**
     - **Initial Formulation Flaw**: Sidgwick's first pass defines "good on the whole" as what you'd desire *at choice-time* if you foresaw *all consequences*. The "contented pig" (someone whose desires degrade into triviality) objects because:
       - *Actual retrospective satisfaction* (no regret) isn't sufficient for "good" (e.g., the pig feels fine but wasted potential).
       - Crucially, *hypothetical desire at T1* could be *corrupted by foreseen consequences* (e.g., choosing addiction knowing it will shrink your desires). The procedure might entrench bad desires rather than correct them.
     - **Revision's Key Shifts**:
       - **"Now"**: Anchors idealization to the *current self* before corruption, avoiding the pig's warped perspective.
       - **"All lines of conduct"**: Requires comparing *all possible futures*, not just one path. This introduces counterfactual robustness.
       - **"On the whole"**: Emphasizes aggregation across *all moments of life* with "equal regard," blocking sacrifices of higher goods for lower ones.
     - **Work Done**: The revision targets *procedural rationality*: a desire formed with full information, coherence across time, and no self-corrupting blind spots. The pig fails because its idealization *lacks counterfactual scope*—it doesn't imagine being better.

  ### 2. **The Sudden Appeal to "Reason" – Circularity or Refinement?**
     - **The Tension**: Sidgwick first insists his idealization is "entirely interpretable in terms of fact" (no independent "dictate of Reason"). Yet he later invokes Butler's "calm desire ... in harmony with reason" as "authoritative."
     - **Is This Circular?** Only if "reason" is *defined* as "tracking the good." But Sidgwick hints at a *procedural* account:
       - "Harmony with reason" means desires are *consistent*, *temporally unified*, and *externally coherent* (e.g., no conflicts between knowledge and desire).
       - **Sidgwick's Escape Hatch**: He keeps the "dictate implicit" by embedding rationality *within the idealization itself*: "what I should desire if my desires were in harmony with reason" is cashed out as the earlier hypothetical (full knowledge, equal regard for all times). Reason isn't an external standard but the *structure of the idealizing procedure*.
     - **Verdict**: It's a refinement, not a contradiction. The "authoritative" desire is just the *output* of the naturalistic idealization. But he edges close to circularity by implying reason ensures we *recognize* this desire's authority—a move Rawls would later formalize with "deliberative rationality."

  ### 3. **CEV & the Dilemma: Corruption vs. Circularity**
     Sidgwick's fork applies directly to CEV-style proposals:
     - **Horn 1: Naturalistic Idealization (Risk of Corruption)**  
       If CEV is *purely extrapolative* (what desires *would* emerge given more knowledge/cognition), it risks entrenching corrupted desires (e.g., a brainwashed person "idealizes" into fanaticism). Sidgwick's pig shows this isn't just possible—it's a *structural flaw* if the procedure lacks normative constraints.
       
     - **Horn 2: Build in "Reason" (Risk of Circularity)**  
       If CEV adds filters like "coherence" or "convergence," it implicitly imports normative standards. But then, as you note: what makes a desire "rational" apart from tracking the good? Sidgwick's appeal to "reason" only avoids circularity by anchoring it to his *specific procedure* (full knowledge + temporal neutrality).

  #### **Escaping the Fork: Sidgwick's Hints & Modern Prospects**
     - **Sidgwick's Clue: Temporal Neutrality**  
       His requirement of "equal regard for all moments" acts as a *procedural constraint* that blocks corruption. A CEV could emulate this by requiring desires to satisfy *all temporal selves* (e.g., what your past, present, and future selves would endorse under reflection). This avoids external standards but prevents the pig's stagnation.
     
     - **Convergence as Proxy**  
       Railton and CEV sometimes use *convergence* of desires under idealization as a naturalistic stand-in for "rationality." But Sidgwick's pig shows convergence ≠ goodness (all desires may converge on triviality). *Solution*: Build in Sidgwick's temporal neutrality—e.g., CEV could weight all life-stages equally in extrapolation.
     
     - **The "No Self-Undermining" Rule**  
       A desire is invalidated if its idealization *causes its own degradation* (e.g., choosing heroin knowing it destroys future capacity for desire). Sidgwick's revision implicitly bans this. CEV could adopt a similar filter: extrapolated desires must be *stable under their own satisfaction*.
     
     - **Why Sidgwick Isn't Fully Satisfying**  
       Ultimately, he relies on a substantive claim: humans have a "calm desire" for their good that *survives* idealization. This is psychological, not metaphysical—but it may not hold universally. CEV faces the same empirical risk: what if idealized human desire is nihilistic or cruel?

  ### **Conclusion**
  Sidgwick exposes a core tension: **idealized desire accounts need *procedural constraints* to avoid corruption (like temporal neutrality), but these constraints must themselves be naturalistically defensible to avoid circularity.** His "equal regard for all moments" is one such defensible constraint, rooted in the psychology of regret and planning. For CEV, building in similar constraints—like stability, temporal unity, or no self-undermining—offers a path off the horns. Yet as Sidgwick admits, this may not match "common sense" intuitions about good, forcing either a leaner naturalism or a thicker rationalism. His text is a masterclass in why idealization is both indispensable and treacherous for defining the good.
