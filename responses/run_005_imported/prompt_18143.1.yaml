  Second, the non-conscious nature of HOTs—is this a principled stopping point or just avoiding infinite regress? The user suspects this might be an ad hoc fix.  

  Third, frontal lobe damage in conscious patients—if HOTs rely on prefrontal regions, how does the theory explain preserved consciousness after bilateral damage? The user wants concrete disconfirmation criteria.  

