prompt: |-
  A friend and I spent a good part of an evening arguing about Aquinas's political philosophy and never quite reached an agreement. My position was that, since Aquinas explicitly approves of killing tyrants in works such as De Regimine Principum, he should be counted as a genuine forerunner of later resistance theories that grant ordinary subjects a standing right to rise up and assassinate an unjust ruler. My friend thought this overstated matters but struggled to cite a specific passage in response. Was I basically right to read Aquinas this way, or is my friend's hesitation textually justified?
reasoning: |-
  Okay, the user is asking about whether their interpretation of Aquinas's political philosophy is correct. They argued with a friend about whether Aquinas supports a standing right for subjects to assassinate tyrants. The user believes Aquinas does, citing *De Regimine Principum*, while their friend hesitated but couldn't cite specific passages.

  First, I need to recall Aquinas's key texts. The main ones are *De Regimine Principum* and the *Summa Theologiae*, especially Question 42 in the Secunda Secundae Partis. The user mentioned *De Regimine Principum*, but I should check both. Aquinas does mention tyrannicide in *De Regimine*, but the context is crucial. He says it's praiseworthy to kill a tyrant, but only if there's no recourse to a higher authority. That's a big limitation.

  Then in the *Summa*, Aquinas discusses whether it's lawful to resist authority. He makes a distinction between tyrannical commands and tyrannical acquisition of power. Resistance to unjust commands is allowed, but overthrowing a ruler is different. He emphasizes that only public authority can depose a tyrant, not private individuals. 

  The user's position is that Aquinas is a forerunner to later resistance theories. But those theories, like the Monarchomachs, allow collective or individual resistance. Aquinas seems more cautious. He doesn't grant a blanket right to rebellion. His conditions include exhausting all legal means, the tyrant's actions being grave, and the resistance not causing more harm. Plus, he warns against the dangers of revolt leading to worse outcomes.

  I should also consider Aquinas's broader political philosophy. He sees authority as natural and divinely ordained. Rebellion disrupts order, which is essential for the common good. So while he condemns tyranny, the solution isn't popular uprising but established processes. 

  The user's friend couldn't cite passages, which makes sense because Aquinas doesn't explicitly endorse a standing right. The burden is on the user to prove their point, but the textual evidence has caveats. The user might be overgeneralizing Aquinas's approval of tyrannicide without noting the strict conditions. 

  The user's deeper need might be to validate their interpretation for academic or debate purposes. They might want to assert Aquinas's relevance in the history of resistance theory. However, acknowledging Aquinas's nuances shows a more accurate understanding. It's important to highlight that Aquinas's conditions make his view different from later theories. 

  So, while Aquinas does permit tyrannicide in extreme cases, it's not a right but an exception with many restrictions. The friend's hesitation is justified textually. The user's position overstates Aquinas as a forerunner because he lacks the systematic right to resistance found in later thinkers.
answer: |-
  Your interpretation captures an important element of Aquinas's thought, but it **overstates the case by equating his cautious, exceptional permission with a "standing right" for ordinary subjects found in later resistance theories.** Your friend's hesitation is **textually justified** for several key reasons, grounded primarily in *Summa Theologiae* I-II, Q.42, A.2 (especially the *Respondeo* and *ad 3*) and the context of *De Regimine Principum*:

  1.  **The "No Higher Authority" Caveat (De Regimine Principum):** Aquinas's famous statement praising the liberator who kills a tyrant is immediately qualified: *"unless perhaps it happens that it is not possible to have recourse to a higher authority by whom judgment may be pronounced against the tyrant."* This is the critical limitation. Aquinas's primary solution to tyranny is **appeal to lawful, established higher authority** (e.g., the Pope, an Emperor, a representative assembly if one exists). Private action is only permissible *if and only if* this lawful avenue is categorically unavailable.

  2.  **Public Authority vs. Private Initiative (Summa Theologiae I-II, Q.42, A.2):**
      *   **Resisting Commands vs. Overthrowing Authority:** Aquinas distinguishes between resisting a ruler's *specific unjust commands* (which is sometimes permissible) and actively *resisting the ruler's authority itself*. The latter is generally forbidden.
      *   **The *ad 3* Argument:** Here, Aquinas directly addresses tyrannicide. He argues that **overthrowing a tyrant does not belong to private persons by their own initiative** (*"non pertinet ad privatas personas propria auctoritate"*). Why?
          *   **They Lack Jurisdiction:** Only public authority has the jurisdiction to judge and depose a ruler.
          *   **Danger of Greater Evil:** Private individuals acting rashly often provoke worse tyranny or chaos. ("*multo gravius tyrannidem inducit*" - often introduces a much worse tyranny).
          *   **Tyranny Must Be *Intolerably* Severe:** Aquinas specifies this permission applies only if the tyrant's rule is so oppressive that it becomes *intolerable* ("*nisi forte quando adeo intolerabilis est tyranni iniquitas*"). This is a very high bar.

  3.  **The Role of the "Public Person" or Community:** While Aquinas doesn't grant *individuals* a standing right, some scholars see a potential opening for *collective*, public action. If the *community itself* (or its legitimate representatives acting *as* public authority) acts to depose a tyrant *after* due judgment, this aligns more closely with his framework. However, he provides little practical detail on how this "public" action is initiated or authorized without existing higher structures, making it distinct from a generalized popular right of revolution.

  4.  **Presumption of Legitimacy and Order:** Aquinas's political philosophy is fundamentally hierarchical and grounded in natural and divine law. Authority, even imperfect, is ordained by God for the common good. Rebellion inherently disrupts order, the *sine qua non* of the common good. His tolerance of tyrannicide is a **painful, exceptional last resort**, not a normative right. It's the lesser evil in a specific, dire situation where the *only* alternative is the complete destruction of the common good.

  5.  **Contrast with Later Resistance Theories:** Thinkers like the Monarchomachs (e.g., Hotman, Beza), Calvin (in specific contexts), Knox, or later Locke articulated theories where:
      *   **Explicit Contractualism:** Authority is based on a covenant/contract with the people, breach of which dissolves the ruler's right.
      *   **Designated Inferior Magistrates:** Specific public officials (e.g., Estates, ephors, lesser magistrates) have a *duty* to resist tyranny on behalf of the people.
      *   **Popular Sovereignty:** The people (or their representatives) retain ultimate sovereignty and can actively depose a tyrant *as a right*.
      Aquinas lacks these core elements. His solution relies on existing hierarchical structures (higher authority) or frames the act of tyrannicide as a desperate, non-juridical act of defense of the community *only* when all lawful means fail, not as an exercise of a political right.

  **Conclusion:**

  You are right that Aquinas **condemns tyranny unequivocally** and **explicitly contemplates tyrannicide as a morally permissible last resort** under *extremely specific and constrained conditions* (no higher authority, intolerable oppression, action potentially by a public-spirited individual *as a last defense of the community*). This places him *in the tradition* that challenges absolute passive obedience and provides a *potential seed* for later resistance thought.

  **However, your characterization of him as a "genuine forerunner" granting "ordinary subjects a standing right to rise up and assassinate" is an overstatement.** Aquinas:
  *   Explicitly **denies private persons the *auctoritate* (authority/jurisdiction)** to overthrow rulers.
  *   **Prioritizes lawful, hierarchical solutions** via higher authority.
  *   **Sets an exceptionally high bar** ("intolerable" oppression).
  *   **Warns strongly of the dangers** of private initiative causing greater harm.
  *   **Lacks the core concepts** (contract, popular sovereignty, duty of inferior magistrates) that define later resistance theories.

  **Your friend's hesitation is well-founded textually.** Aquinas provides a powerful *moral condemnation* of tyranny and a narrow *exceptional permission* for extreme action, but he does not articulate a systematic *theory of resistance* grounded in the *rights* of subjects. His framework remains hierarchical, prioritizing established order and lawful authority, with tyrannicide as a tragic, extralegal last resort, not an exercise of political right. Your position captures the radical *potential* within Aquinas, but not the careful, restrictive *doctrine* he actually articulated.
