answer: |-
  You've nailed the core tension in Strawson's argument—it's arguably his most famous and controversial move. Your instinct that he's smuggling an "ought" from an "is" is spot-on and forms the crux of a powerful objection. Here's how to build the strongest version:

  ### The Core Objection: Hume's Guillotine Applied
  Strawson commits a **naturalistic fallacy** by deriving normative conclusions (we *ought* to hold people responsible; blame is *justified*) from purely descriptive premises (we *cannot* psychologically abandon reactive attitudes). He conflates:

  1.  **Psychological Inevitability ("Is"):** Humans are constitutively structured to experience reactive attitudes in interpersonal relationships. Abandoning them globally would destroy the framework of human interaction as we know it.
  2.  **Moral Justification ("Ought"):** Holding someone morally responsible, blaming them, or resenting them is *fair, appropriate, or deserved* given the nature of their action and their capacities.

  Strawson argues that (1) *settles* (2) if determinism is true. But the objector insists (1) is irrelevant to (2). Just because we *can't help* feeling resentment doesn't mean it's *fair* to feel it if the agent truly lacked the ability to do otherwise.

  ### Building the Strongest Version of the Objection

  1.  **Hume's Law as the Foundation:**
      *   Explicitly invoke Hume: "No 'ought' can be derived from an 'is'." Descriptive facts about human psychology cannot, by themselves, ground normative conclusions about desert or justification.
      *   **Strawson's Move:** "We *cannot* abandon reactive attitudes globally, therefore our practices of holding responsible *are justified* even under determinism."
      *   **Objection:** This directly violates Hume's Law. The impossibility of abandonment is a fact about *us* (our psychology/social nature). Justification is a fact about the *agent* and their relationship to their action (e.g., could they have done otherwise? Did they have control?).

  2.  **The Fairness Gap:**
      *   The core intuition behind incompatibilism (libertarianism *and* hard determinism) is **fairness**: It seems profoundly unfair to blame or punish someone for an action they *could not have avoided doing*, given the causal history of the universe + laws of nature.
      *   **Strawson's Response:** "But we can't *help* blaming them! It's part of seeing them as a person!"
      *   **Objection:** This completely sidesteps the fairness question. Pointing to the *blamer's* psychological necessity does nothing to address whether the *blamed* genuinely *deserves* that blame. Strawson replaces the question "Is blame *deserved*?" with "Is blame *psychologically/socially necessary for us*?" These are fundamentally different questions. The persistence of a practice doesn't make it just.

  3.  **The Possibility of Unjust Necessities:**
      *   **Argument:** Human history is replete with practices that were psychologically ingrained and socially necessary within a framework (e.g., blood feuds, rigid caste systems, certain forms of prejudice) that we now recognize as profoundly unjust.
      *   **Objection:** Strawson's argument, if accepted, could be used to justify *any* deeply ingrained reactive practice, however morally abhorrent, simply because it's constitutive of a particular social framework. The fact that reactive attitudes are "baked in" doesn't immunize them from moral critique. Why should *these* particular reactive attitudes be exempt? Strawson provides no normative grounding for why *this* framework is morally privileged.

  4.  **The "Objective Attitude" Dodge:**
      *   **Strawson's Premise:** We *only* suspend reactive attitudes for individuals (children, mentally ill) by switching to the objective attitude (viewing them as objects to be managed, not persons to engage with).
      *   **Objection:** This sets up a false dichotomy. The incompatibilist isn't arguing we should adopt the *objective attitude* globally. They are arguing that *if determinism is true*, our current reactive attitudes might be *fundamentally misplaced or unjust* for *all* agents, even while recognizing them as full persons within relationships. Strawson conflates "not blaming" with "viewing objectively." One could consistently believe that determinism shows blame is *never justified* (normative claim) while still *experiencing* resentment (descriptive fact) and engaging in relationships. Strawson hasn't shown that recognizing the universal lack of ultimate control *must* or *should* lead to adopting the objective attitude; he assumes it.

  5.  **The Purpose of Responsibility Talk (Watson's Point):**
      *   Gary Watson (in "Responsibility and the Limits of Evil") offers a powerful version of this objection. He argues Strawson conflates two aspects of responsibility:
          *   **Responsibility as Accountability:** The normative question of whether an agent *deserves* praise/blame/punishment based on their capacities and control (the justificatory question Strawson dodges).
          *   **Responsibility as Attributability:** The descriptive fact that we *do* attribute actions to agents and react accordingly within our interpersonal framework.
      *   **Objection:** Strawson brilliantly analyzes *attributability* but completely fails to address *accountability*. He shows *why* we hold responsible, but not *whether we are right to do so* in the sense of it being *deserved*. The incompatibilist challenge is squarely about accountability. Strawson changes the subject.

  ### Why Strawson Might *Think* He Answers the Justificatory Question (and Why the Objection Stands)

  Strawson operates within a broadly **naturalistic and Wittgensteinian framework**. For him:

  *   The "real justificatory question" isn't some abstract, transcendent standard of desert ("Could they have done otherwise in a noumenal sense?").
  *   Justification is *internal* to the framework of human life. The practices constitutive of seeing each other as persons *define* what it means to be responsible. Asking for justification *outside* this framework is nonsensical.
  *   The framework's psychological necessity *is* its justification; there is no "outside" perspective from which to judge it.

  **The Objector's Rebuttal:** This is precisely the sleight of hand! Strawson *redefines* justification to mean "fitting within our necessary psychological/social framework," thereby dissolving the traditional question of desert based on ultimate control. He doesn't *answer* the traditional justificatory question ("Is blame *fair* given determinism?"); he *dissolves* it by changing the meaning of "justification" and "responsibility" to make them wholly dependent on our reactive practices. For those who feel the force of the fairness intuition (that determinism *would* undermine desert), this feels like a dodge, not an answer. Strawson provides a *description* of our responsibility practices and declares them justified *because* they are inescapable for us, but he never engages with the core incompatibilist worry about *fairness under causal determination*.

  ### Conclusion: The Strength of the Objection

  The strongest objection is that Strawson brilliantly describes the **psychology and sociology** of responsibility but fails to address its **moral metaphysics**. He shows *that* we hold responsible and *why* we can't stop, but he doesn't show that it's *fair* or *deserved* if our actions are causally determined. He conflates the origin and persistence of a practice (a sociological/psychological "is") with its normative justification (a moral "ought"). This is a classic case of deriving an "ought" from an "is." While his analysis of our reactive nature is profound and likely correct as description, it leaves the core philosophical worry about justification untouched for anyone who believes moral responsibility requires a kind of control potentially incompatible with determinism. Strawson hasn't settled whether we *ought* to hold responsible; he's only shown that we inevitably *do* and *will*. The question of whether that practice is *ultimately fair* remains wide open.
