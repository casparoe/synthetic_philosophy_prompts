prompt: |-
  I'm a PhD student in political science, though my own research is archival and historical rather than formal or mathematical, which makes what follows a little embarrassing to admit. This term I ended up chairing the small committee our department uses to award its annual "Graduate Student Service Prize," and the process left me stuck on something that feels like it should have a clean answer. We had four nominees, whom I will call A, B, C, and D, and nine committee members, each of whom submitted a full ranking of all four. To keep the first pass simple, we counted only first-place votes, and D won outright with three votes, even though a comfortable majority of the committee had actually ranked D dead last overall; A, B, and C had simply split the remaining six votes among themselves. Everyone agreed that result was clearly wrong, so we tried comparing the nominees head-to-head instead, tallying, for every pair, how many members preferred one to the other. D lost every single head-to-head match-up and was easily set aside, but among the three remaining contenders we found, to our collective confusion, that a majority preferred A to B, a majority preferred B to C, and a majority preferred C to A. No nominee beat both of the others, so the seemingly obvious head-to-head method produced no winner at all among the finalists who actually mattered.

  We ended up letting me, as chair, break the resulting tie, which more than one committee member grumbled felt less like the committee's decision than my own preference dressed up in procedure. Afterward, partly out of curiosity and partly to find something more defensible for next year, I reran the same nine ballots using a points system instead, awarding three points for a first-place vote, two for second, one for third, and none for last. This produced a clean order among A, B, and C with no cycle, which seemed promising, until I noticed that simply dropping D from the tally altogether, on the reasonable grounds that D had never been a real contender, flipped the order between the other two front-runners, even though not one person had changed their relative ranking of those two. Nobody's opinions moved at any point in this process; only our bookkeeping did, and yet the "winner" kept changing along with it. I cannot shake the feeling that something structural is going on here, something about the task itself rather than a fixable defect in whichever counting method we happened to try, but I lack the formal vocabulary to name it or to know whether any procedure could have avoided it. Is there a principled way to design a ranking process for situations like ours that would avoid this kind of instability, or is it simply unavoidable whenever several people's individual rankings must be aggregated into one collective decision?
reasoning: |-
  Hmm, this is a fascinating problem that touches on some deep issues in social choice theory. The PhD student in political science is describing a classic voting paradox situation. Let me unpack what happened step by step.

  First, they had four candidates (A,B,C,D) and nine voters. Using a simple plurality system (counting only first-place votes), D won with 3 votes despite being ranked last by a majority. That already shows the weakness of plurality voting.

  Then they tried pairwise comparisons. D lost all matchups (as expected), but among A,B,C they discovered a Condorcet cycle: A>B, B>C, C>A - no clear winner. This is the famous Condorcet paradox.

  Next, they used a Borda count (3,2,1,0 points). This gave a clear ranking of A,B,C... until they removed D from consideration. When D was excluded, the relative ranking of A and B flipped even though no voter changed their preferences between A and B. This is a classic example of the "independence of irrelevant alternatives" (IIA) violation.

  The core issue here is Arrow's Impossibility Theorem, which proves that no voting system can satisfy all desirable properties (like IIA, Pareto efficiency, non-dictatorship) when there are three or more options. What they're experiencing isn't a flaw in any particular method, but a fundamental mathematical limitation.

  I should explain why removing D affected the A-B ranking. In Borda count, when you remove a candidate, you effectively reassign points. If D was generally ranked low but served as a "spoiler" for some voters' second choices, removing D changes how the remaining points distribute. Voters who preferred A over B but ranked D high might have given A fewer points initially because D "stole" some second-place points.

  For next year, I might suggest alternative methods like:
  - Instant-runoff voting (IRV) where you eliminate the lowest candidate and redistribute votes
  - Or perhaps a Condorcet method that uses a ranking system to break cycles

  But they should understand that no system is perfect. The instability they observed is inherent in preference aggregation. The key is choosing a method whose flaws align with what the committee values most - whether that's majority support, resistance to strategic voting, or simplicity.

  I should emphasize that this isn't about flawed implementation - it's a profound result in decision theory. Kenneth Arrow basically proved that democratic preference aggregation is mathematically messy when there are multiple dimensions of preference.
answer: |-
  Your experience perfectly illustrates fundamental challenges in social choice theory, and your intuition is correct: this instability isn't a flaw in any specific method but an inherent mathematical property of aggregating ranked preferences. Here's a breakdown of what happened and why no perfect solution exists:

  ### What Occurred in Your Process:
  1.  **Plurality Failure:** D won with only first-place votes despite being disliked by most (a classic "spoiler" effect).
  2.  **Condorcet Paradox:** Among A, B, and C, you encountered a **Condorcet cycle** (A>B, B>C, C>A). This cyclical majority preference (named after the Marquis de Condorcet) occurs when preferences are single-peaked but not transitive across the group. It's mathematically possible whenever there are ≥3 options and ≥3 voters with diverse rankings.
  3.  **Borda Count Failure (IIA Violation):** The Borda count (points: 3,2,1,0) produced a ranking of A, B, C. However, removing the "irrelevant alternative" D (who lost decisively head-to-head) **flipped the order between A and B**, even though *no voter changed their relative ranking of A vs. B*. This violates the **Independence of Irrelevant Alternatives (IIA)** criterion, a desirable property for voting systems.

  ### Why This Happens: Arrow's Impossibility Theorem
  The core reason for your frustration is **Kenneth Arrow's Nobel Prize-winning Impossibility Theorem (1951)**. It rigorously proves that **no ranked-choice voting system** can simultaneously satisfy all of the following reasonable criteria when choosing among ≥3 options:

  1.  **Unrestricted Domain:** Works for any possible set of individual rankings.
  2.  **Non-dictatorship:** No single voter always determines the outcome.
  3.  **Pareto Efficiency:** If everyone prefers X over Y, then the group prefers X over Y.
  4.  **Independence of Irrelevant Alternatives (IIA):** The group's relative ranking of X vs. Y should *only* depend on how individuals rank X vs. Y. Adding or removing another option (like D) shouldn't change whether the group prefers X over Y if no individual changes their X vs. Y ranking.

  **Your Borda count result demonstrated a direct violation of IIA.** Arrow's theorem proves that *any* system satisfying criteria 1-3 *must* violate IIA (or be dictatorial). This isn't a bug; it's a fundamental mathematical limitation.

  ### Why Removing D Flipped A vs. B in Borda
  Imagine two voters who had different rankings involving D:
  *   **Voter 1:** A > D > B > C. Under Borda (with D): A=3, D=2, B=1, C=0.
  *   **Voter 2:** D > A > B > C. With D: D=3, A=2, B=1, C=0. Without D: A=2, B=1, C=0.

  **Key Insight:** When D is present, Voter 2 gives A only 2 points (because D gets their top 3 points). When D is removed, Voter 2 gives A their *new* top score of 2 points. **A gains points relative to B** from voters like Voter 2 simply because D (who was *above* A for them) is gone. The removal of D changed how the points allocated to A were *valued*, even though Voter 2's A>B preference never changed. Borda count is highly susceptible to the "irrelevant alternative" problem because it uses the *entire* ranking.

  ### Can You Avoid This Instability? (Spoiler: Not Perfectly)
  No single method guarantees stability across all scenarios like yours. However, you can choose a method whose flaws align with your committee's values:

  1.  **For Identifying a Single Winner:**
      *   **Instant-Runoff Voting (IRV - Ranked Choice Voting):** Voters rank all candidates. Count 1st choices. Eliminate the candidate with the fewest 1st choices. Redistribute their ballots based on next preferences. Repeat until one candidate has >50%.
      *   *Pros:* Mitigates "spoiler" effect, ensures winner has majority support in final round, often satisfies Condorcet winner (if one exists).
      *   *Cons:* Can still violate IIA, doesn't resolve Condorcet cycles well (might eliminate the "wrong" candidate first), complex for some voters.
      *   *Why try it?* It likely would have eliminated D first, then potentially resolved A/B/C without a cycle emerging *in the elimination process*. However, the *order* of elimination matters greatly, and the winner might not beat all others head-to-head.

  2.  **For Full Rankings (Less Susceptible to IIA Violation):**
      *   **Copeland's Method:** Counts wins/losses/ties in head-to-head matchups. The candidate with the most wins (or highest net wins: wins - losses) wins. A Condorcet winner (beats all others) always wins.
      *   *Pros:* Directly addresses pairwise preferences, Condorcet winner always wins.
      *   *Cons:* May result in ties (like your head-to-head attempt). Requires many pairwise comparisons. Still violates IIA in theory, but less dramatically than Borda.
      *   **Kemeny-Young Method:** Finds the ranking that has the highest total agreement with all voter rankings (minimizes pairwise disagreements). Computationally complex for many candidates but robust.
      *   *Pros:* Produces a full ranking that best reflects overall pairwise preferences, minimizes paradoxes.
      *   *Cons:* Computationally intensive (NP-hard), complex to explain.

  3.  **Accepting the Limitation & Designing Process:**
      *   **Transparency & Rules First:** Decide the method *before* seeing nominees or ballots. Stick to it rigorously. Document *why* it was chosen (e.g., "We prioritize finding a Condorcet winner" or "We value simplicity and majority support").
      *   **Multi-Stage Process:** Use a method like IRV first to eliminate clear losers (like D), then apply a pairwise method (Copeland) or Borda count *only* to the remaining top contenders. Acknowledge that the *stage* might influence the outcome, but the process is fixed.
      *   **Focus on the Winner, Not Full Ranking:** If the prize is for a single winner, methods like IRV or Copeland are often sufficient. Generating a strict 1st-2nd-3rd-4th ranking invites more paradoxes.
      *   **Tie-Breaking Rule:** Pre-define a clear tie-breaker (e.g., chair's vote, most 1st-place votes, alphabetical). This avoids ad-hoc decisions.

  ### Recommendation for Next Year
  Given your committee's size (9 voters, 4 nominees) and the desire for stability and defensibility:

  1.  **Adopt Instant-Runoff Voting (IRV):** It's relatively simple to understand ("eliminate the least favorite and redistribute"), avoids the spoiler effect that elected D, ensures the winner has majority support in the final round, and often (though not always) picks a Condorcet winner if one exists. It directly addresses the initial problem with D. While it *can* violate IIA, it's generally more robust in single-winner elections than Plurality or Borda.
  2.  **Pre-Define the Process:** Write the rules into the committee charter before nominations open. Include:
      *   Voters must submit a full ranking.
      *   Winner determined by IRV.
      *   Clear tie-breaking procedure (e.g., if multiple tied for elimination at any stage, eliminate the one with fewest 1st-choice votes at that stage; if still tied, chair breaks).
  3.  **Acknowledge the Limitation:** Briefly explain to the committee that *no* perfect method exists (mention Arrow's theorem), but IRV was chosen to mitigate the specific problems encountered (spoilers, disliked winners) and is widely used for similar purposes.

  **In essence:** Your frustration stems from encountering fundamental mathematical truths about democracy and preference aggregation. No method is immune to paradoxes when aggregating diverse preferences over multiple options. The solution lies not in finding a perfect method, but in choosing a *defensible* method *prospectively* that aligns with your committee's goals (likely identifying a broadly acceptable single winner), implementing it transparently, and accepting that while instability *can* occur, a well-chosen method reduces its likelihood and impact compared to simpler approaches like Plurality or Borda. IRV is a strong practical choice for your specific task.
