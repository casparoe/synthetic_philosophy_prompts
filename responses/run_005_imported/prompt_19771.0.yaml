answer: |-
  ## The Wager War: Kelly vs. All-In on a Biased Coin

  **Setting:** A quiet corner of a university library, strewn with papers showing binomial distributions and bankroll growth simulations. Alex (defends Geometric Rationality/Kelly) and Sam (defends Expected Value Maximization) are arguing over coffee.

  **Alex:** (Tapping a simulation output) See, Sam? Over 50 flips of this 60/40 coin, betting the full Kelly fraction – 20% of the bankroll each time – gives a *median* final wealth of about 300 times the starting bankroll. The *distribution* is beautifully right-skewed towards huge gains, minimizing the risk of significant drawdowns. It’s the strategy that actually dominates the long-run outcome for a *single* bettor.

  **Sam:** Dominates *by what standard*, Alex? Your median is high, sure. But look at the *expected value* (EV)! If I bet my *entire* bankroll on every single flip, my expected final wealth is (1 * 1.0)^50? No. Each bet: I have a 60% chance of doubling my bankroll (2x), and a 40% chance of going to zero. So the expected value *per bet* is (0.6 * 2 + 0.4 * 0) = 1.2 times the current bankroll. After 50 bets, the expected final wealth is (1.2)^50 times the starting bankroll. Calculate *that*.

  **Alex:** (Calculating quickly) Approximately 9,100 times the starting bankroll. Yes, vastly higher than Kelly's *median* of 300x. But Sam, that expectation is a mathematical phantom! It’s overwhelmingly dominated by the astronomically unlikely paths where you win *all* 50 flips. The probability of that is (0.6)^50 – about 8e-13, essentially zero. For the other 99.99999999999% of paths, you go bust! Your strategy guarantees ruin with probability approaching 1 over time. How is that rational for an individual?

  **Sam:** Ah, the "probability one ruin" objection. Let's dissect it. First, "over time" implies infinite bets. We're doing *fifty*. Finite sequence. The probability I survive all 50 bets? (0.6)^50 is minuscule, yes. But it's *not* zero. And crucially, *if* I survive, my wealth is 2^50 times my starting bankroll – that’s about 1.126e+15 times! The expectation weights that vanishingly small probability by its colossal outcome. That's why the EV is 9,100x.

  **Alex:** But you’re valuing a near-zero probability of galactic wealth the same as a certainty of modest gain? That seems pathological! Rationality shouldn’t ignore the *actual experience* on almost all paths. Your strategy has a >99.999% chance of leaving you with *nothing* after 50 bets. Kelly leaves me with a very high *probability* of substantial growth, and a *chance* for huge wealth, precisely *because* it avoids ruin.

  **Sam:** It’s not pathological; it’s consistent with my preferences. You're smuggling in *your* preference – a strong aversion to ruin and a focus on the median or typical path – and calling it "objectivity." Rational choice theory, at its core, is about maximizing expected utility *given one's utility function*. You assume a logarithmic utility function (U(W) = log(W)), where the utility of going bust is negative infinity, making any risk of ruin unacceptable. That’s why Kelly maximizes E[log(W)]. My utility function is linear in wealth (U(W) = W). I care about the *expected monetary value*. For me, the disutility of losing everything is finite (it hurts, but it's not infinitely bad), and the utility of massive wealth is proportionally massive. Maximizing E[W] *is* rational for *this* preference structure. Calling my choice irrational is just saying my preferences are wrong.

  **Alex:** Fair point about utility functions being the root. But let’s interrogate that linear utility, Sam. Is it truly reflective of how you, or any real person, would experience wealth? Does gaining your 10th billion really give you the same *marginal* utility as gaining your first thousand? Logarithmic utility captures the diminishing marginal utility of wealth – each dollar means less as you get richer. It also intrinsically values *preservation* proportionally. Linear utility implies you’d be indifferent between a certain $500,000 and a 50/50 gamble for $0 or $1,000,000. Would you really take that gamble with your life savings?

  **Sam:** For this specific, limited context of 50 bets with a clear edge? With a bankroll I can afford to lose? Maybe! The point isn't necessarily that linear utility perfectly models human psychology in all life situations. The point is that *within the axioms of rational choice under uncertainty*, maximizing E[W] is perfectly rational *if* that's the utility function you specify for the problem. You're arguing that log utility is *better* or *more natural*. I'm arguing that rationality doesn't prescribe the utility function, only how to optimize given one. My choice to maximize EV isn't *irrational*; it's rational *for a different goal* than yours.

  **Alex:** But Sam, isn't there a deeper conflict with *repeated* bets? Your goal is maximum expected *terminal* wealth after 50 bets. But the *process* matters fundamentally because wealth compounds multiplicatively. The key quantity determining the outcome of multiplicative growth *is* the geometric mean return, which Kelly maximizes. Maximizing the arithmetic mean (E[W]) in a multiplicative setting ignores the volatility drag. Look at the simulations! The *median* Kelly outcome is 300x. The *mean* Kelly outcome is also high, around 500x for 50 bets. Your EV-max strategy has a mean of 9,100x, yes, but a *median* of *zero*. Over 99.99% of the time, Kelly beats your strategy decisively in this finite sequence. How can a strategy that loses almost always be called rational for achieving its goal?

  **Sam:** Because the goal isn't "win most of the time" or "get a good median." The goal, *by my chosen metric*, is to maximize the *expected value* of terminal wealth. And by that specific, well-defined mathematical metric, all-in wins. It achieves its *stated* goal optimally. The fact that it achieves it via a tiny probability of an astronomical win doesn't invalidate the math. It just means the distribution is extremely skewed. You find that skew pathological for a single individual's experience; I accept it as the consequence of my chosen optimization criterion. Your "volatility drag" argument is compelling *if* I cared about the growth rate along the way or the typical outcome. But I don't – for *this* sequence of bets, I only care about E[W] at the end. Kelly optimizes for the growth *journey*; I optimize for the expected *destination*, however bumpy the ride.

  **Alex:** I see the distinction. You're treating the 50 bets as a single, atomic "investment" with one terminal payoff, valuing only the expectation of that payoff. I'm treating it as a sequence of dependent multiplicative steps where the *pathway* inherently shapes the distribution of possible outcomes, making the growth rate the crucial factor for most reasonable interpretations of "doing well" over time. Perhaps the true disagreement is about whether repeated bets are best modeled as a single compound gamble (favoring your EV view if utility is linear) or as a multiplicative process where the per-bet growth rate is paramount (favoring Kelly).

  **Sam:** Exactly! And rationality doesn't dictate which model is "correct." It dictates consistency *within* the chosen model and utility function. If I define my problem as "maximize expected dollars after exactly 50 flips," and I have linear utility, going all-in each time is the rational solution, ruin risk and all. If you define the problem as "maximize the compounded growth rate of my bankroll over an ongoing series," Kelly is rational. The "objectivity" of Kelly applies powerfully within *its* framing – the frame of multiplicative growth over time. My choice represents a different, but logically consistent, framing and preference. Neither is the *obvious* loser; they optimize different things under different assumptions about what matters.

  **Alex:** (Nods slowly) Point taken. So the "correct" bet size isn't just math; it depends on the bettor's utility function *and* their temporal perspective – whether they see the sequence as one big bet or a compounding journey. The Kelly fraction isn't universally "objective," but it *is* objectively optimal for maximizing long-run growth *if* that's the goal. And for most people navigating repeated opportunities, that *is* the goal they *should* care about, even if they haven't articulated it.

  **Sam:** And my all-in strategy is objectively optimal for maximizing expected terminal wealth *if* that's the goal and ruin has finite disutility. Whether that goal itself is wise... well, that's a different conversation. Pass the coffee? We have 50 virtual flips to simulate. Let's run both strategies side-by-side and see the distributions breathe.

  **Alex:** (Smiles) Deal. Let the (simulated) coins fall. Just don’t ask me to go all-in on the first flip. The log utility screams "No!" too loudly. *(Both turn to their laptops, the philosophical tension easing into collaborative curiosity.)*
