prompt: |-
  Okay so I'm finalizing the reading list for my graduate seminar on distributive justice next term, which is basically built around Sen's old question "equality of what?", and I've hit a wall with my TA about how much weight to give each answer. We're covering Rawlsian primary goods, Dworkin's equality of resources (the auction plus the hypothetical insurance scheme for bad luck in talents and handicaps), Sen and Nussbaum's capability approach, Cohen's "equality of access to advantage" (the midfare stuff), Arneson's equal opportunity for welfare, and Anderson's relational/democratic critique of the whole luck-egalitarian project. My TA insists Anderson basically wins and the rest is a distraction, I think thats way too quick, and we've been arguing about it over beers for like two weeks now, so I'd like a third opinion that isn't just picking a side to end the argument.

  Could you rank these six (plus Parfit's prioritarianism, if you even think that counts as an answer to the question rather than a rejection of it) by how well each one survives its standard objections -- expensive tastes for welfarism, the indeterminacy/paternalism worries about capability lists, the general "currency" problem, and Anderson's abandonment/stigma objections to luck egalitarianism? I don't need pages of justification, just your honest ranking. Give it to me as a tier list, S being "genuinely defensible as THE currency of egalitarian justice" down to D (or F, if you're feeling harsh) for "doesn't survive first contact," formatted like this:

  ```json
  {
    "S": [...],
    "A": [...],
    "B": [...],
    "C": [...],
    "D": [...]
  }
  ```

  Put multiple theories in a tier if you want, add a tier if you need one, or leave one empty -- whatever actually reflects your view. I'd just like to see if there's a real consensus hiding under all our arguing or if this is genuinely as contested as it feels.
