answer: |-
  You've hit on one of the most profound debates in legal philosophy! The "grudge informer case" (often called the *Lüth* or *Radbruch* case in German law) perfectly crystallizes the Hart-Fuller debate. Your moral intuition favoring Fuller is understandable, but Hart's positivism remains dominant for reasons deeper than legal squeamishness. Let's unpack why:

  **Hart's Core Argument (Positivism) - What He Actually Said:**
  1.  **Separation Thesis:** Law and morality are conceptually distinct. A law's *validity* (whether it counts as law) depends solely on its source (e.g., passed by a recognized legislature using proper procedures), **not** its moral content. The Nazi statute *was* valid positive law in 1944 because it was enacted according to the regime's own (horrific) rules.
  2.  **Clarity & Honesty:** Denying the Nazi statute was "law" is historically and conceptually dishonest. It *was* the law Germans lived under. Pretending otherwise avoids confronting the uncomfortable reality: a legal system can be monstrously evil yet still technically "legal."
  3.  **The Retroactivity Problem:** Punishing the wife in 1949 for an act legal in 1944 creates a *retroactive* law. Hart argued it's better to pass a *new*, explicit retroactive law condemning such acts under the Nazi regime than to pretend the old law never existed. This maintains the principle that people can only be punished under laws existing at the time of their act (nulla poena sine lege). Using "natural law" to void the old law retroactively is just disguised retroactivity.
  4.  **Preserving Law's Function:** Law needs predictability. If validity constantly depends on contested moral judgments (what's "just enough"?), the system becomes unstable and unpredictable. Positivism provides a clear, formal test for validity.

  **Why Positivism Isn't "Nuremberg Defense Lite" & Why It Prevails:**

  1.  **Distinguishing Validity from Obedience:** This is Hart's crucial point. Saying a law is *valid* does **not** mean it *must be obeyed* or that officials *must enforce it*. Positivism readily accommodates:
      *   **Civil Disobedience:** Recognizing an unjust law *as law* gives clarity to the moral choice of disobeying it. "I break this *valid but unjust* law because my conscience demands it."
      *   **Official Resistance:** Judges or officials can (and morally should) refuse to apply grossly unjust laws, even if valid. Positivism doesn't compel compliance; it clarifies the nature of the rule being resisted.
      *   **Nuremberg:** The Nuremberg defense failed **not** because the orders weren't legally valid within the Nazi system, but because the acts ordered constituted *crimes against humanity* – a higher, universally recognized moral/legal principle transcending any single state's positive law. Positivism can accept higher-order international legal norms (like Jus Cogens norms) that invalidate or override even valid domestic laws authorizing atrocities.

  2.  **Avoiding Moral Subjectivity & Judicial Overreach:** Fuller's natural law approach raises a practical nightmare: **Who decides what's "unjust enough" to be non-law?** Judges? Which moral framework? In a pluralistic society, this risks:
      *   Judges imposing their *personal* morality under the guise of "natural law."
      *   Legal chaos and unpredictability if validity is constantly contested on moral grounds.
      *   History shows natural law arguments were used to justify slavery, oppression, and resistance to civil rights (as well as noble causes). It's a double-edged sword. Positivism offers a more neutral, procedural foundation for a diverse society.

  3.  **Confronting Evil Systems Honestly:** Hart argued that understanding Nazi Germany had a *legal system* (albeit a monstrously unjust one) is vital for:
      *   Historical accuracy and understanding how evil regimes co-opt legal forms.
      *   Designing post-conflict justice (like the 1949 trial). Acknowledging the prior laws existed allows for a clearer, more honest transition. You pass new laws explicitly repudiating the old regime's injustices.

  4.  **Focus on Institutional Design:** Positivism encourages focusing on *how* laws are made and the *procedures* that make them legitimate (democratic processes, human rights safeguards, judicial review) rather than relying on contested, abstract moral principles to determine validity after the fact. It's about building systems less likely to produce such unjust laws.

  5.  **Modern Positivism is Nuanced:** Contemporary positivists (like Joseph Raz) incorporate ideas of authority and the function of law. They argue law necessarily claims moral authority, but its *actual* validity remains separate. They also accept that extreme injustice *can* be a reason for officials to deny validity (the "Radbruch Formula" - extreme injustice is no law), but see this as an *exception* proving the general rule of separation, not its refutation. Hart himself conceded extreme cases might necessitate this.

  **Why the Legal Profession Favors Positivism (Generally):**

  *   **Practicality:** Judges and lawyers need clear rules. Positivism provides a relatively objective way to identify valid law (statutes, precedents, constitutions) without descending into endless moral debates in every case.
  *   **Rule of Law Values:** Predictability, consistency, and limiting arbitrary power are core legal values. Positivism supports these by emphasizing formal sources and procedures.
  *   **Democracy:** In democratic systems, positivism respects the legislature's role. Judges applying strong natural law can effectively override democratic decisions based on their moral views.
  *   **Separation of Powers:** It provides a clearer boundary between the judicial role (applying valid law) and the legislative role (making moral/policy choices reflected in law).

  **Conclusion:**

  Your instinct that Fuller's position feels morally resonant in extreme cases like the grudge informer is correct. However, Hart's positivism prevails not because it excuses evil or lets officials "sleep at night," but because:

  1.  It offers a clearer, more honest, and more stable framework for understanding law *in general*, including evil legal systems.
  2.  It forcefully distinguishes between recognizing a rule *as law* and believing one *ought to obey* that law – creating space for moral resistance and critique.
  3.  It avoids the dangers of subjective judicial moralizing inherent in strong natural law theories.
  4.  It provides a better foundation for building *procedural safeguards* against injustice within a legal system.

  Hart wasn't defending Nazi law; he was defending a conceptual tool for understanding *all* law, precisely so we can better identify, resist, and dismantle unjust systems when they arise. The legal profession adopts it as the mainstream theory because, despite its discomfort in extreme cases, it provides the most workable and least dangerous foundation for operating a complex legal system in a morally pluralistic world. The grudge informer case remains famous precisely because it exposes the agonizing tension at the heart of law itself.
