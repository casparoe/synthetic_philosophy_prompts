  The condition that is sacrificed is dynamic consistency. The agent's planned action at the future node is not optimal when that node is reached, according to the same decision rule (REU) applied locally.

  Now, to close:

  Buchak's restriction of REU to one-off global gambles avoids this problem by not allowing the agent to break down the decision tree. However, in sequential decisions, the agent naturally faces subtrees. By stipulating that REU only applies to the entire tree and that the agent must commit to a plan at the outset, Buchak sidesteps the dynamic inconsistency. But this does not resolve the underlying issue: the agent's preferences at the later node are not aligned with the earlier plan. The agent would have an incentive to deviate from the plan, and if she is not bound by commitment, she will. Thus, the restriction to global gambles might be seen as relocating the problem rather than solving it, because it requires the agent to commit and never reconsider, which might not be realistic or rational in sequential settings.
