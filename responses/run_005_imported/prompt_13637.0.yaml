  Below, I construct a sequential decision problem with two decision nodes that demonstrates dynamic inconsistency in Lara Buchak's Risk-Weighted Expected Utility (REU) theory. I use a strictly convex risk function \( r(p) = p^2 \), a linear utility function \( u(x) = x \) (to isolate risk effects), and concrete monetary outcomes. The problem is designed such that:
  1. When evaluating the entire decision tree as a single global gamble, the REU-maximizing plan calls for action \( C \) at the second decision node.
  2. When the second node is actually reached, a fresh REU calculation over the remaining sub-gamble recommends action \( D \) instead.

  ### Decision Problem Setup
  **First Decision Node:**  
  Choose between:  
  - **Option A:** Leads to a chance node with:  
    - 50% chance of $100 (game ends).  
    - 50% chance of proceeding to **Second Decision Node**.  
  - **Option B:** Sure outcome of $55.50.  

  **Second Decision Node (if reached):**  
  Choose between:  
  - **Option C:** Gamble with 50% chance of $100 and 50% chance of $0.  
  - **Option D:** Sure outcome of $40.  

  **Risk Function:** \( r(p) = p^2 \) (strictly convex).  
  **Utility Function:** \( u(x) = x \) (linear, so risk attitudes depend solely on \( r \)).

  ---

  ### Global REU Calculation (Entire Tree as One Gamble)
  The agent evaluates **Option A** with a **plan** for the second node. Two strategies exist:  
  - **Strategy A-C:** Choose **C** at the second node.  
  - **Strategy A-D:** Choose **D** at the second node.  

  We compute the global REU for each strategy by treating the entire tree as a single gamble, ranking outcomes from best to worst, and applying \( r(p) \) to decumulative probabilities.  

  **Strategy A-C (Plan to choose C):**  
  - Outcomes:  
    - $100 with probability \( 0.5 \) (first branch) + \( 0.5 \times 0.5 = 0.25 \) (second node) → total \( 0.75 \).  
    - $0 with probability \( 0.5 \times 0.5 = 0.25 \) (second node).  
  - Ranked outcomes: $100 (best), $0 (worst).  
  - Decumulative probabilities:  
    - \( P(\geq \$100) = 0.75 \) → weight = \( r(0.75) - r(0) \)  
    - \( P(\geq \$0) = 1 \) → weight = \( r(1) - r(0.75) \)  
  - REU calculation:  
    \[
    \begin{align*}
    \text{REU}_{\text{global}}(\text{A-C}) &= u(100) \times [r(0.75) - r(0)] + u(0) \times [r(1) - r(0.75)] \\
    &= 100 \times [r(0.75) - 0] + 0 \times [1 - r(0.75)] \quad (\text{since } r(0) = 0,  r(1) = 1) \\
    &= 100 \times r(0.75) \\
    &= 100 \times (0.75)^2 \quad (\text{using } r(p) = p^2) \\
    &= 100 \times 0.5625 = 56.25.
    \end{align*}
    \]

  **Strategy A-D (Plan to choose D):**  
  - Outcomes:  
    - $100 with probability 0.5 (first branch).  
    - $40 with probability 0.5 (second node).  
  - Ranked outcomes: $100 (best), $40 (worst).  
  - Decumulative probabilities:  
    - \( P(\geq \$100) = 0.5 \) → weight = \( r(0.5) - r(0) \)  
    - \( P(\geq \$40) = 1 \) → weight = \( r(1) - r(0.5) \)  
  - REU calculation:  
    \[
    \begin{align*}
    \text{REU}_{\text{global}}(\text{A-D}) &= u(100) \times [r(0.5) - r(0)] + u(40) \times [r(1) - r(0.5)] \\
    &= 100 \times [r(0.5) - 0] + 40 \times [1 - r(0.5)] \\
    &= 100 \times r(0.5) + 40 \times (1 - r(0.5)) \\
    &= 100 \times (0.5)^2 + 40 \times (1 - 0.25) \quad (\text{since } r(0.5) = 0.25) \\
    &= 100 \times 0.25 + 40 \times 0.75 \\
    &= 25 + 30 = 55.
    \end{align*}
    \]

  **Option B (Sure $55.50):**  
  - REU calculation:  
    \[
    \text{REU}(\text{B}) = u(55.50) \times r(1) = 55.50 \times 1 = 55.50.
    \]

  **Global Comparison:**  
  - \(\text{REU}_{\text{global}}(\text{A-C}) = 56.25\)  
  - \(\text{REU}_{\text{global}}(\text{A-D}) = 55\)  
  - \(\text{REU}(\text{B}) = 55.50\)  

  The globally REU-maximizing strategy is **A-C** (56.25 > 55.50 > 55). Thus, the agent commits to **Option A** and plans to choose **C** at the second node.  

  ---

  ### Local REU Calculation at Second Node
  Suppose the agent chose **Option A** and the first chance node resulted in the path to the second decision node (50% probability). The agent now faces a **sub-gamble** between **C** and **D**, with no further uncertainties.  

  **Option C (Gamble: 50% $100, 50% $0):**  
  - Ranked outcomes: $100 (best), $0 (worst).  
  - Decumulative probabilities:  
    - \( P(\geq \$100) = 0.5 \) → weight = \( r(0.5) - r(0) \)  
    - \( P(\geq \$0) = 1 \) → weight = \( r(1) - r(0.5) \)  
  - REU calculation:  
    \[
    \begin{align*}
    \text{REU}_{\text{local}}(\text{C}) &= u(100) \times [r(0.5) - r(0)] + u(0) \times [r(1) - r(0.5)] \\
    &= 100 \times [r(0.5) - 0] + 0 \times [1 - r(0.5)] \\
    &= 100 \times r(0.5) \\
    &= 100 \times 0.25 = 25.
    \end{align*}
    \]

  **Option D (Sure $40):**  
  - REU calculation:  
    \[
    \text{REU}_{\text{local}}(\text{D}) = u(40) \times r(1) = 40 \times 1 = 40.
    \]

  **Local Comparison:**  
  - \(\text{REU}_{\text{local}}(\text{C}) = 25\)  
  - \(\text{REU}_{\text{local}}(\text{D}) = 40\)  

  At the second node, REU maximization recommends **D** (40 > 25), contradicting the global plan to choose **C**.  

  ---

  ### Conflict and Rationality Condition Violated
  - **Global Plan:** REU of entire tree (with commitment to **C**) = 56.25.  
  - **Local Decision:** REU of sub-gamble recommends **D** (yielding 40), leading to an effective outcome of:  
    - $100 with 50% (first branch) + $40 with 50% (second node) → REU = 55 (as in Strategy A-D).  
  - **Conflict:** The agent abandons the globally optimal plan (**C**) for a locally optimal choice (**D**), reducing overall REU from 56.25 to 55.  

  **Sacrificed Rationality Condition:** **Dynamic Consistency**.  
  - An agent is dynamically consistent if the plan chosen at the initial node remains optimal when reevaluated at future nodes with the same decision rule. REU violates this because:  
    - Globally, \( r(p) = p^2 \) underweights high-probability gains (e.g., 75% chance of $100 in A-C), making the risky **C** attractive due to the small chance of a high outcome ($100) dominating the calculation.  
    - Locally, \( r(p) = p^2 \) overweights low-probability losses (e.g., 50% chance of $0 in **C**), making the sure **D** more attractive.  
  - This is a direct result of REU's rank-dependent weighting violating the **Independence Axiom** (which ensures dynamic consistency under expected utility).  

  ---

  ### Assessment of Buchak's Restriction
  Buchak confines REU to "global" gambles to avoid dynamic inconsistency by requiring agents to commit to plans in advance. This is a **stipulative fix, not a principled resolution**:  
  1. **Relocates, Doesn't Solve:** The inconsistency persists "off-stage." Agents who can re-evaluate subtrees (e.g., in real-time decisions) will deviate from globally optimal plans, revealing a preference reversal.  
  2. **Unrealistic Commitment:** It assumes agents can bind themselves to plans they will later disavow. If binding is impossible (e.g., no external enforcement), REU agents face exploitable time inconsistency.  
  3. **Undermines Rationality:** A theory requiring ad hoc commitment to avoid self-sabotage suggests a flaw in its foundations. Orthodox decision theory (e.g., VNM) avoids this by deriving dynamic consistency from axioms.  

  **Conclusion:** Buchak's restriction is a tactical retreat that masks, rather than resolves, the dynamic inconsistency inherent in REU. It highlights a tension between REU's descriptive appeal (accommodating Allais preferences) and its normative viability for sequential decisions. For agents who re-evaluate choices, REU risks systematic inefficiency.
