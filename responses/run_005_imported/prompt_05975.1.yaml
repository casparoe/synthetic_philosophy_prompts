  I'll structure each Q with the likely reply and a sharp follow-up. The tone should be collegial but incisive—no gotchas, but no softballs either. The PhD friend's objection is crucial here; it represents the meta-critique that could unravel the whole discourse, so that question deserves special care.
answer: |-
  Here are 9 interview questions designed to push your guest beyond standard formulations, targeting the core tensions in her "all-subjected" principle, along with predicted replies and sharp follow-ups:

  1.  **Circularity Challenge:** "You powerfully critique nationality-based boundaries as presupposing the 'demos' they aim to define. But doesn't *identifying* who is 'subject to' a state's coercive legal order *already require* knowing the *spatial and jurisdictional scope* of that order? Isn't figuring out who is 'coerced' by US law, for instance, impossible without first assuming *where* US law applies – which seems precisely the boundary question you're trying to solve?"
      *   *Likely Reply:* She'll argue coercion is an empirical fact (e.g., experiencing enforcement) prior to or independent of formal jurisdiction; the *de facto* exercise of power defines the subjected group.
      *   *Follow-up:* "But doesn't that empirical fact *depend* on where enforcement agents *believe* their jurisdiction lies? If a state *claims* global jurisdiction but only enforces sporadically abroad, is everyone *potentially* subject to its power included? Doesn't the *recognition* of where enforcement is 'legitimate' still smuggle in a prior boundary?"

  2.  **The Degree Problem (Thin Subjection):** "You criticize the all-affected principle for potentially including 'everyone' due to global interdependence, diluting meaningful democratic agency. But doesn't the 'all-subjected' principle face a parallel 'degree problem'? A tourist fined for jaywalking, a short-term guest worker, an NGO worker abroad briefly detained, someone hit by extraterritorial sanctions – all experience *some* coercion. Where's the non-arbitrary cutoff for 'sufficient subjection' to warrant inclusion? Doesn't this just replace 'affectedness' with 'subjected-ness' on a sliding scale?"
      *   *Likely Reply:* She'll emphasize *systematic* or *enduring* subjection to the *core framework* of laws structuring life chances, distinguishing this from isolated or peripheral encounters.
      *   *Follow-up:* "Who decides what counts as the 'core framework' or 'systematic' subjection? Isn't that determination itself a boundary-drawing act vulnerable to the same critique you level against 'affected interests'? Couldn't a state arbitrarily define its 'core' laws narrowly to exclude guest workers?"

  3.  **Exclusion as Non-Coercion? (The Standard Line):** "A common rebuttal to your view on borders is: 'Turning someone away at the border isn't coercing *them*; it's simply refusing to grant them access or a benefit. The state isn't *actively imposing* a rule *on* the excluded person; it's just upholding rules *within* its territory for those already subject to them. Therefore, exclusion doesn't make one 'subject to' coercion requiring a vote.' How do you dismantle this argument?"
      *   *Likely Reply:* She'll argue exclusion is the coercive *enforcement* of property law (state territory as collective property) and membership rules *against* the outsider, actively preventing them from entering a space/resources they might need/seek, using force if necessary.
      *   *Follow-up:* "Doesn't this imply that *any* enforcement of *any* rule against *anyone* who might desire to be under its purview constitutes subjection? If I want to join your private club and you say no, enforcing your rules against me, am I 'subject to' your club's coercion and thus entitled to a vote in it?"

  4.  **Under-Inclusion vs. All-Affected (Climate/Future Generations):** "While you argue all-subjected avoids over-inclusion, doesn't it risk *under-inclusion* compared to all-affected? Consider future generations profoundly affected by current climate policy decisions, or populations overseas devastated by a country's trade policies or resource wars. They aren't *currently* 'subject to' the enforcing jurisdiction of the laws creating these harms. Doesn't your principle fail to grant them a democratic claim, even though their vital interests are massively impacted?"
      *   *Likely Reply:* She might concede this is a limitation but argue democratic inclusion requires *direct* subjection to enforceable *commands*. Alternatively, she might stretch "subjected" to include those whose fundamental rights/future existence are determined *decisively* by current coercive acts, even if enforcement isn't immediate or territorial.
      *   *Follow-up:* "If we stretch 'subjected' to cover those whose *future survival* is determined by current policy (like climate), how is that meaningfully different from the 'affected interests' you reject? Doesn't it collapse the distinction? If not, what's the principled line preventing 'subjected' from becoming just as expansive?"

  5.  **The "Thicker" Subjection Response (Follow-up to Degree Problem):** "You mentioned systematic subjection to the core framework. But doesn't defining that 'core framework' require prior political choices about which laws are fundamental? Isn't the selection of what constitutes 'core' subjection itself a democratic question that *presupposes* a prior demos to decide it?"
      *   *Likely Reply:* She might argue the "core" is revealed empirically by the laws that most pervasively structure social and economic relations and are consistently enforced, not a subjective choice.
      *   *Follow-up:* "Doesn't the *perception* of what's 'pervasive' or 'core' vary? Consider drug laws vs. tax laws. Who gets to define this empirical baseline? Doesn't the state's *own* enforcement priorities and ideological framing inevitably shape this 'empirical' reality, again presupposing its authority?"

  6.  **Coercion vs. Non-Intervention (The Border Flip):** "Building on the border point: Couldn't one argue that the state coercively enforces laws *within* its territory *on* residents, but the act of exclusion itself is merely a *non-intervention* – a refusal to *extend* its coercive legal order *to* the outsider? The coercion only starts *after* entry. How do you counter this framing?"
      *   *Likely Reply:* She'll argue the border *is* the point of enforcement – using force/threat to prevent movement based on laws defining membership and territory. It *is* an active imposition of a rule ("Thou shalt not enter without permission") backed by threat.
      *   *Follow-up:* "Doesn't this mean *any* rule limiting access to *any* space or resource constitutes subjection? If I build a fence around my yard enforcing 'no trespassing', is everyone who wants to enter my yard 'subjected' to my coercion and thus entitled to co-own it?"

  7.  **The "Jurisdiction First" Dilemma:** "If we accept that identifying the 'subjected' requires knowing the *scope* of enforcement/jurisdiction, and jurisdiction is typically defined territorially by the state itself, haven't we just relocated the circularity? The state defines its territory (boundary), then identifies who is subject within it. How does your principle *escape* this loop, rather than just making 'subjected-ness' the *criterion* applied *after* the boundary is already set?"
      *   *Likely Reply:* She'll reiterate that subjection is prior to formal jurisdiction – it's the *fact* of being governed by coercive rules, regardless of how the ruler defines their territory. The demos arises from the governed.
      *   *Follow-up:* "But how do we *identify* that 'fact' of being governed without a reference point? If a rebel group imposes rules in a contested area, who is 'subjected'? Doesn't determining *which* coercive order someone is 'subject to' immediately force us to choose between competing authorities, again presupposing a boundary?"

  8.  **The Future Generations Specifics:** "On future generations: If they aren't *currently* subject to enforcement, how can they be 'all-subjected'? If we say they *will be* subjected, doesn't that make the principle indeterminate (how far forward?) and undermine the link to *current* democratic agency (they can't vote *now*)?"
      *   *Likely Reply:* She might argue current citizens making irreversible decisions *are* acting as trustees or proxies for those who *will be* subjected to the consequences, creating a derivative claim for representation *now*. Or, that the *creation* of future subjection through current coercive acts binds the present demos.
      *   *Follow-up:* "Doesn't the 'trustee' or 'proxy' idea require us to *define* who the future subjected *are* (e.g., only within the territory?), which again presupposes a boundary? And how is representing 'future subjected' different from representing 'future affected'?"

  9.  **The Meta-Question: Arbitrariness Relocated? (The PhD Friend's Challenge):** "Here's the objection that strikes some, like my PhD friend, as fatal: Perhaps *no* principle (all-subjected, all-affected, nationality) can provide a *non-circular, non-arbitrary* solution to the boundary problem. Any criterion we pick (birth, residence, coercion, affectedness) either presupposes the boundary it seeks to define, or is itself an arbitrary normative choice. Isn't your defense of 'all-subjected' ultimately just *relocating* the necessary arbitrariness to the definition of 'coercion' or 'sufficient subjection', rather than *eliminating* it? Is the boundary problem fundamentally insoluble by principle, making the 'demos' always a contingent political creation?"
      *   *Likely Reply:* She'll likely argue that while *some* contingency remains, "all-subjected" is *less* arbitrary and *more* normatively compelling than alternatives because it directly links political obligation (obeying laws) with political right (shaping laws), grounding legitimacy in the experience of being ruled. It minimizes, rather than eliminates, arbitrariness.
      *   *Follow-up:* "If the *minimization* of arbitrariness is the best we can do, how do we adjudicate between competing principles (subjected vs. affected) on *that* metric? Doesn't the 'all-affected' proponent claim *their* principle minimizes arbitrariness *better* by capturing crucial externalities? Is the choice between 'minimization strategies' itself ultimately... arbitrary?"

  **Tips for Delivery:**

  *   **Frame Collaboratively:** "I want to push a bit on how your principle handles X, because critics often say Y..."
  *   **Acknowledge Strength First:** Briefly acknowledge the power of her core argument before probing its edges.
  *   **Use Her Language:** Build questions using her specific terms ("systematic subjection," "core framework," "de facto power").
  *   **Listen Actively:** Be ready to adapt follow-ups based on the nuance of her actual responses, not just the predicted ones. The predicted replies are guides, not scripts.
  *   **Embrace the Tension:** The boundary problem *is* messy. Your role is to help her articulate why her approach navigates that mess better than others, not to expect a perfect solution.

  These questions should create a dynamic conversation that moves beyond exposition into the deep philosophical tensions her work engages with, giving your listeners genuine insight. Good luck with the interview!
