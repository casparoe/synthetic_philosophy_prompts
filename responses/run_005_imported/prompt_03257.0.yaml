answer: |-
  The dust motes danced in the late afternoon sun slanting through Leo’s apartment window, illuminating the battlefield of his grief. Cardboard boxes, half-filled with his mother’s things, sat like silent accusations. Six weeks. The long illness had been a siege; the end, a relief laced with guilt, now settling into a numb ache. A friend, well-meaning but awkward in the face of loss, had pressed a worn copy of Burton Watson’s *Zhuangzi* into his hands: "It’s… different. Might help."

  Leo hadn’t expected help. He’d expected cryptic absurdity. Instead, three scenes lodged in his mind like shrapnel.

  First, Zhuangzi, drumming on a basin, singing after his wife’s death. Not mourning, but *celebrating* her transformation? It felt obscene. Then, Master Lai, dying, comparing existence to metal cast by a smith – why should the metal *insist* on being a famous sword? Why cling? And that damned skull on the road to Chu, refusing resurrection, preferring the quiet freedom of bones to the messy agony of flesh. *The transformation of things.* The phrase echoed, cold and vast.

  One Wednesday, sorting through a box of his mother’s old paperbacks – mysteries, romances, things she’d escaped into during her illness – Leo found it. Tucked between a dog-eared Christie and a Mills & Boon, was another copy of the *Zhuangzi*. Same translation, Watson. But older, the cover faded green linen, its spine cracked with use. His mother’s neat, looping script filled the margins. Question marks. Underlined passages. Beside the basin-drumming scene, she’d written: *Singing? Really?* Next to Master Lai: *Just metal? Cold comfort.* And by the skull: *Horrible. But… free?*

  Leo felt a jolt. She’d read this. Wrestled with it. He hadn’t known. He sank onto the dusty floor, the two books open side-by-side on the carpet, his mother’s marginalia a silent conversation across the void.

  Later that week, needing air, Leo walked the industrial canal path near his apartment. The water was grey, sluggish. He stopped on a rusted iron bridge, watching a barge chug slowly beneath him. The rhythmic thump of its engine vibrated through the metal grating under his feet. *Thump. Thump. Thump.*

  It wasn’t a basin, but the vibration, the insistent, almost primal rhythm, resonated. Without thinking, Leo tapped his boot heel against the bridge railing. *Tap. Tap. Tap.* Keeping time with the barge’s engine. A strange sensation bubbled up – not joy, not sorrow, but a kind of raw, pulsing acknowledgment of the machine’s movement, the water’s flow, the vibration in his bones. He thought of Zhuangzi drumming. Was this it? Not happiness, but a fierce, rhythmic *yes* to the sheer mechanics of existence and change? He stopped tapping abruptly, feeling foolish, exposed. A jogger gave him a curious glance. The moment fractured, leaving only the fading thump of the engine and a residue of unsettling energy.

  A few days later, clearing out the garage of his mother’s bungalow, Leo unearthed an old toolbox belonging to his grandfather. Inside, beneath greasy wrenches, lay a heavy, rough ingot of lead – leftover from some forgotten plumbing project decades ago. It was cold, dense, inert. He hefted it. Utterly unremarkable. Just metal.

  Master Lai’s words surfaced: *"The Great Clod burdens me with form and toils me through life; eases me in old age and rests me in death. So that what makes my life good is the same thing that makes my death good. Suppose a smith is casting metal and the metal should leap up and say, ‘I insist upon being made into a Mo-yeh!’ The smith would surely consider it metal of ill omen."*

  Leo stared at the dull lead. His mother had been vibrant, sharp, loving – never just metal. Yet… wasn’t she, biologically? Carbon, water, minerals. Arranged uniquely, wonderfully, but fundamentally matter. Was clinging to the *specificity* of her, to the desperate wish she was still *that particular sword*, the real torment? Was the ‘ill omen’ the refusal to accept the smith’s – the universe’s – right to recast? The lead felt heavy, final. He put it back in the toolbox, not with reverence, but with a strange sense of… permission granted. To the metal. To the process. The ache remained, but a layer of frantic resistance seemed to cool slightly.

  The final encounter happened in a dream. Leo was walking down a familiar suburban street, bathed in an unnaturally green twilight. Lying on the cracked pavement, directly in his path, was a human skull. It wasn’t gruesome; it was clean, almost polished, like ivory. He stopped, knowing what came next.

  *"Sir,"* Leo heard himself say, voice echoing in the still air, *"would you like me to speak to the Lord of Life about restoring your bones, flesh, and skin, returning you to your parents, wife, children, and old friends?"*

  The skull’s empty sockets seemed to regard him. Not with menace, but with a profound, weary amusement. When it spoke, its voice wasn’t a voice, but a thought projected directly into Leo’s mind, dry as old parchment. *"How could I abandon the joy of a king upon his throne and take on once more the troubles of a human being?"*

  Leo woke with a gasp, sitting bolt upright in the dark. The room was silent. The freedom the skull described wasn’t peaceful oblivion; it was an active *preference*. Liberation from the exhausting, beautiful, heartbreaking entanglement of being *someone*, connected to others. The dream’s logic felt chillingly sound. Was grief, then, not just loss, but a kind of envy? An envy of the dead’s release from the very bonds we mourn the severing of? He shuddered, pulling the blanket tighter. The thought felt monstrous, yet undeniably present, a cold counterpoint to his sorrow.

  He didn’t know if he believed any of it. The basin-drumming felt like defiance he couldn’t muster. The lead ingot felt like a reduction he couldn’t accept. The skull’s freedom felt like a terrifying loneliness. Yet, these images, these encounters – the found book, the thumping bridge, the heavy lead, the dream-skull – they *worked* on him. They didn’t erase the ache for his mother’s voice, her laugh, the specific warmth of her hand. That pain was a country he inhabited.

  But alongside it now, coexisting uneasily, was the vast, strange landscape of Zhuangzi’s transformations. It offered not comfort, but a different scale. It whispered of processes larger than individual sorrow, of form dissolving and reassembling in the endless forge of the Great Clod. It hinted that his mother’s absence wasn’t an error, but part of a rhythm as fundamental as the thumping barge engine, as inevitable as metal cooling in a cast.

  One evening, Leo picked up his mother’s copy of the *Zhuangzi*. He turned to the page with the basin story. He looked at her skeptical *"Singing? Really?"* He picked up a wooden spoon from the kitchen. He looked at the large, empty ceramic salad bowl sitting drying on the rack.

  He didn’t sing. He wasn’t Zhuangzi. But slowly, tentatively, he tapped the spoon against the rim of the bowl. *Tap. Tap. Tap.* The sound was hollow, resonant in the quiet apartment. It wasn’t joy. It wasn’t despair. It was just a sound, marking a moment, vibrating in the space where his mother used to be. He kept tapping, the rhythm irregular, uncertain. Was he drumming *for* her transformation, or *against* the silence of her absence? Was he acknowledging the vast, impersonal process, or simply finding a small, human noise to make in the face of the unbearable?

  The bowl didn’t answer. It just resonated, a simple vessel holding the echo of a spoon, while outside the window, the indifferent dusk deepened. Leo kept tapping, the ambiguity hanging in the air, thick as dust motes in the fading light.
