  I should emphasize that the difference is in the mathematical approach to limits. For states, if the sequence doesn't converge, the outcome is undefined. For sets, the infinite intersection can be well-defined. This structural distinction explains the contrast. Ross-Littlewood doesn't invalidate Thomson but shows supertasks aren't universally impossible; it depends on the task's nature. 

