  First, I need to recall both paradoxes. Thomson's lamp involves flipping a switch at intervals halving each time: after 2 minutes, it's flipped infinitely. The state (on/off) is undefined because it depends on the sequence's parity, which diverges. Ross-Littlewood: adding 10 balls and removing the lowest-numbered one each step. After infinitely many steps, the vase is empty because every ball is eventually removed.

