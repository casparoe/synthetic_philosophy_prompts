answer: |-
  Your analysis captures a genuine tension in Aquinas's thought, but the resolution lies in recognizing that Aquinas **does not grant ordinary, private subjects a standing right to kill a tyrant on their own initiative**. Instead, he reserves the authority to *judge* and *execute* a tyrant to a **public authority** – either the community acting collectively or a higher legitimate power. The "exception" for tyranny isn't that private killing is permitted; it's that the tyrant's loss of legitimacy transforms the *nature* of resistance and opens the door for **public action** against him. Here's a breakdown:

  1.  **The Core Principles in Tension:**
      *   **Forfeiture of Legitimacy:** A ruler who governs for private advantage, not the common good, becomes a tyrant and loses legitimacy. His "laws" are not binding in conscience (ST I-II, Q.96, A.4). Resistance to such a ruler is not sedition (ST II-II, Q.42, A.2).
      *   **Monopoly on Lethal Force:** Only public authority, acting as an agent of the common good and under just conditions, may licitly inflict death as punishment (ST II-II, Q.64, A.3). Private individuals acting on their own authority commit murder, even if killing a guilty person.

  2.  **Why Tyranny is an "Exception" (Without Permitting Private Killing):**
      Aquinas addresses tyranny specifically in *De Regno (On Kingship)* and implicitly in the *Summa*. His solution focuses on *who* holds the authority to act:
      *   **Action by a Higher Authority:** If the tyrant was appointed by a superior (e.g., the Pope or Emperor), the community should appeal to that superior for remedy or deposition (De Regno, Ch. 6). This superior holds the public authority to judge and depose.
      *   **Action by the Community Itself:** If there is no higher earthly authority (e.g., an original, self-governing community), **the community as a whole** retains the authority it originally delegated. It does *not* devolve to individuals:
          > "If to provide itself with a king belongs to the right of a given multitude, it is not unjust that the king be deposed or have his power restricted by that same multitude if, becoming a tyrant, he abuses the royal power." (De Regno, Ch. 6)
          *   **Collective, Not Individual Action:** Aquinas consistently refers to the *multitude* acting. This implies a public, communal decision and action – a form of just war against an internal aggressor or a legitimate act of deposition. It is an exercise of the community's residual public authority, *not* a license for individuals to assassinate.
      *   **No Endorsement of Private Initiative:** Aquinas *never* states that an individual subject, acting on their own private judgment and authority, may kill the tyrant. His remedies are institutional and public: appeal to a higher power or collective action by the community.

  3.  **Why the Tension Feels Acute & Why He's Cited by Resistance Theorists:**
      *   **The Stakes:** Tyranny represents the ultimate perversion of authority, turning the protector into the predator. Aquinas's strong language about forfeiture makes it *feel* like the tyrant is stripped of all protection, potentially opening the door to private action in the minds of later thinkers.
      *   **Foundation for Resistance:** Aquinas provides the crucial philosophical foundation:
          *   Rulers govern *for the common good*, not by divine right alone.
          *   Authority derives legitimacy from serving that end.
          *   Tyrannical rule is *illegitimate*.
          *   Resistance/deposition is *not inherently sinful sedition*.
          *   The *community* (as a public body) has ultimate residual authority.
      *   **Later Theorists' Leap:** Thinkers like Mariana and Suárez built *upon* this foundation but went further. They explicitly debated the permissibility of *private* individuals assassinating a tyrant *if* public remedies failed and the tyrant posed an extreme, ongoing threat. They cited Aquinas for the legitimacy of resistance and the tyrant's forfeiture, but they extended the logic into territory Aquinas himself avoided – the private exercise of lethal judgment.

  4.  **Aquinas's Underlying Logic for Reserving Lethal Force:**
      Aquinas's insistence on public authority for execution stems from core principles:
      *   **Order and the Common Good:** Lethal force is the ultimate act of communal power, requiring the judgment and authorization of the community (or its legitimate representative) to preserve order and justice, not enact private vengeance.
      *   **Judgment Requires Authority:** Declaring someone deserving of death and carrying it out requires the *authority* to judge and punish on behalf of the whole community. A private individual lacks this standing, even if their judgment about guilt is correct. Only public authority possesses the *potestas gladii* (power of the sword).
      *   **Preventing Chaos:** Allowing private individuals to kill based on their own judgment of tyranny would invite anarchy, vendettas, and the potential for good rulers to be murdered by disgruntled factions mislabeling them as tyrants. Public or collective action provides a (theoretically) more orderly and discernible process.

  **Conclusion:**

  Aquinas does *not* treat tyranny as an exception to the rule that private individuals cannot inflict death. The "exception" is that a tyrant's loss of legitimacy **removes the barrier to the community (acting as a public body) or a higher public authority licitly using force to depose or kill him.** The tension arises because the tyrant's forfeiture is so complete that it *logically suggests* the need for action, and Aquinas emphatically denies that action can be taken by private individuals on their own initiative. He resolves it by pointing to the residual public authority of the community as a whole or a superior power. Later resistance theorists like Mariana and Suárez pushed Aquinas's foundational principles further than he did, explicitly venturing into the territory of private tyrannicide under extreme circumstances, which is why they cite him as a forerunner for the *legitimacy of resistance*, not necessarily for their specific conclusions about private assassination. Aquinas's position remains one of **publicly authorized resistance/deposition, not private tyrannicide.**
