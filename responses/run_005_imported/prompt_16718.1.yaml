answer: |-
  You've hit on one of the deepest, most persistent headaches in biology: **what *is* a species?** Your coworker is partially right, but so is your intuition. It's not *just* arbitrary, but it's also not a universal, objective truth etched into the fabric of the universe like the speed of light. Here's the breakdown:

  1.  **The Biological Species Concept (BSC) Fails Utterly for Bacteria:**
      *   You nailed the core problem. The classic "interbreed and produce fertile offspring" definition (the BSC) is fundamentally incompatible with how bacteria exist and evolve.
      *   **Asexual Reproduction:** No sex means no interbreeding barrier to define groups.
      *   **Massive Horizontal Gene Transfer (HGT):** Bacteria readily swap chunks of DNA (plasmids, transposons, phage DNA) across vast phylogenetic distances. A pathogenic *E. coli* might share crucial virulence genes with completely unrelated bacteria it encounters in a host gut. This creates a complex web of genetic relatedness, not neat branching trees.

  2.  **So, What *Is* a Bacterial Species? The Cohesion Concept & Ecotypes:**
      *   Biologists recognize that for microbes, we need a different framework. The most useful concepts focus on **ecological coherence and evolutionary trajectory**.
      *   **Ecotype Concept:** Imagine populations of bacteria adapted to a *very specific* niche (e.g., a particular nutrient source, temperature range, host interaction). Within this niche, natural selection acts strongly, homogenizing the population through **clonal expansion** (lots of splitting in two) and **purifying selection** (removing harmful mutations). This creates a **cohesive genomic cluster**.
      *   **Barriers to Gene Flow:** While HGT happens, it's not random chaos. Genes that are *core* to the function and survival in that specific niche (like essential metabolic pathways) are much harder to swap effectively between distantly related ecotypes without disrupting function. Genes beneficial *only* in very different niches won't be maintained by selection if they transfer in. This creates *semi-permeable* barriers.
      *   **The Goal:** A bacterial "species" is ideally a **monophyletic group** (sharing a recent common ancestor) of strains that are **genomically cohesive** (sharing a high degree of core genome similarity) because they occupy and are adapted to a **shared ecological niche**, and whose evolutionary trajectory is distinct from other such groups.

  3.  **Where Does 95% ANI Fit In? It's Pragmatic, But Rooted in Biology:**
      *   **The Correlation:** Decades of research comparing older methods (like DNA-DNA hybridization - DDH) and newer genomic methods (like ANI) with *observed biological reality* (phenotypic traits, pathogenicity, ecological niche) revealed a strong pattern. Strains sharing **≥95% ANI** almost always:
          *   Showed ≥70% DDH (the old "gold standard" cutoff for species).
          *   Shared core metabolic capabilities.
          *   Occupied similar ecological niches.
          *   Were clearly part of the same monophyletic group based on core genome phylogenies.
      *   **Below 95%:** ANI values below 95% correlated strongly with significant differences in the above characteristics. The core genomes diverged enough that shared ecological function became less likely.
      *   **It's a Threshold, Not a Cliff:** ANI isn't magic. There are rare borderline cases (e.g., 94.8% ANI strains that might be biologically very similar). However, 95% has proven to be an **extremely robust predictor** of shared ecological and evolutionary coherence in the vast majority of cases studied. It captures the point where core genome divergence starts to consistently reflect divergent evolutionary paths and ecological specialization.
      *   **Why Not Higher/Lower?** Pushing the cutoff higher (e.g., 98%) would split ecologically coherent groups into multiple "species" that function identically in practice. Pushing it lower (e.g., 90%) would lump together ecologically and evolutionarily distinct groups that behave very differently (e.g., harmless environmental isolates and dangerous pathogens).

  4.  **Is It "Just" a Filing System? (The Coworker's Point)**
      *   **Yes, in a way:** Nature presents a continuous spectrum of diversity. We impose discrete names ("species") to make sense of it, communicate, catalog, and apply knowledge (e.g., "This ANI ≥95% match to *Salmonella enterica* means it's a known human pathogen, treat the food recall accordingly"). The *name* and the *precise cutoff* are human constructs for utility.
      *   **But No, it's not *arbitrary*:** The 95% ANI cutoff isn't pulled from thin air. It's a **data-driven, empirically validated approximation** of a real biological phenomenon: the point where genomic divergence consistently predicts significant ecological and evolutionary divergence in bacteria. We *discovered* this correlation; we didn't invent it. It reflects the natural clustering caused by selection within niches and barriers to core gene flow.

  5.  **Is This Fuzziness Unique to Bacteria? Absolutely Not!**
      *   **Ring Species:** Populations spread geographically around a barrier. Neighboring populations interbreed, but populations at the ends of the "ring" do not, even though they are connected by gene flow. Where do you draw the species line? (e.g., Ensatina salamanders in California).
      *   **Hybrid Zones:** Many plant and some animal species hybridize freely where their ranges overlap, producing fertile offspring. Are they one species or two? (e.g., various oak species, warblers).
      *   **Asexual Eukaryotes:** Many plants, fungi, and some animals reproduce asexually most of the time, facing similar definitional problems as bacteria (e.g., dandelions, bdelloid rotifers).
      *   **Recent Speciation/Cryptic Species:** Genetically distinct populations that are morphologically identical (or nearly so) and may even hybridize, but are on divergent evolutionary paths.
      *   **Horizontal Gene Transfer:** While massive in bacteria, HGT also occurs in eukaryotes (especially plants and fungi), further blurring lines.

  **The Verdict:**

  *   **Your coworker is right** that the *concept* of a species and the *specific name/label* are human constructs for practical use. Nature is messy.
  *   **You are right** that the 95% ANI cutoff isn't *merely* arbitrary or *just* because of old methods. It's a **highly practical, empirically derived, biologically meaningful threshold** that effectively captures when two bacterial genomes are divergent enough to almost certainly represent distinct ecological/evolutionary units.
  *   **The core insight:** For bacteria (and many other organisms), a species is best thought of as **a distinct evolutionary lineage on its own trajectory, maintained by cohesive forces within its niche and barriers to gene flow with other lineages.** The 95% ANI is a powerful genomic *proxy* for identifying these lineages reliably and reproducibly in a high-throughput lab setting like yours. It works because it reflects underlying biological reality, even if the exact percentage point involves some pragmatic smoothing of nature's rough edges.

  So, next time you run that analysis, you can confidently know that 95% isn't magic, but it *is* science: a well-validated tool that reliably connects the digital world of A's, T's, G's, and C's to the messy, dynamic reality of bacterial life and evolution.
