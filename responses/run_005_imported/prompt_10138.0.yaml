prompt: |-
  Quick one — next week I'm interviewing a political philosopher on my podcast who wrote the new critical introduction to the reissued edition of Michael Dummett's "On Immigration and Refugees," and shes coming on to actually defend his arguments, not just recap the book for listeners. Don't want to let her off easy, so can you draft me 8-9 interview questions that push on the real substance instead of the general vibe of the book?

  I need at least one question on the fact that Dummett basically treats "individuals have a right to emigrate and immigrate" as a brute, self-evident starting point in part one, rather than deriving it from anything deeper — what's she supposed to say to someone who just doesn't share that intuition? One on his argument that Britain's colonial history undercuts its own standing to complain about immigration now — which seems to show restrictionists are hypocrites, not that restriction is wrong in principle, so how does she close that gap? And one on how much of his refugee-vs-economic-migrant line is really just inherited from the 1951 Convention's persecution-based definition of a refugee, which was a product of a particular political moment and not some moral discovery — so what about everyone fleeing famine, climate collapse, or generalized war who never clears that bar?

  For each of those give me the answer she's most likely to reach for, plus a follow-up that doesn't let her rest there. Thanks!
