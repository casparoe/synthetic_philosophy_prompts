answer: |-
  Here are 8 targeted questions pushing on Dummett's core arguments, including your three specific requests with likely responses and sharp follow-ups:

  **Core Questions Pushing on Substance:**

  1.  **The Foundational Premise:** Dummett asserts the "basic right" to emigrate *and* immigrate as self-evident in Part One, without deriving it from deeper principles (like autonomy, utility, or need). **What do you say to critics who simply don't share this intuition? How do you convince someone who sees territorial sovereignty or collective self-determination as the foundational starting point instead?**
      *   *Likely Answer:* She'll argue freedom of movement is a fundamental aspect of human autonomy/agency, akin to other basic liberties, and that sovereignty isn't absolute but exists within a framework of universal human rights. Dummett sees it as a pre-political moral fact.
      *   *Follow-Up:* **If this right is truly self-evident and fundamental, why has it been so universally rejected in practice throughout history and by nearly all states today? Doesn't its near-total non-recognition suggest it *isn't* intuitively foundational in the way Dummett claims, but rather a highly contestable moral proposition?**

  2.  **Colonial History & Moral Standing:** Dummett powerfully argues Britain's colonial past undermines its moral standing to restrict immigration now. But this seems to expose *hypocrisy*, not necessarily prove that restrictive policies are *wrong in principle*. **How does Dummett (or you) bridge the gap from "Britain lacks clean hands to complain" to "Therefore, restrictive immigration policies are inherently unjust"?**
      *   *Likely Answer:* She'll argue the colonial critique reveals the *illegitimacy* of the very concepts (like absolute sovereignty, exclusive national entitlement to resources/territory) used to justify restriction. Colonialism exposed these concepts as tools of domination, not neutral principles. Past harm creates ongoing obligations.
      *   *Follow-Up:* **Even granting that history creates obligations, does this argument actually establish a *general* moral right to immigrate for *anyone*? Couldn't a historically blameless state (if one exists) still legitimately restrict immigration based on collective self-determination arguments, while Britain cannot? How does the colonial argument translate into a universal principle?**

  3.  **The Refugee/Migrant Distinction & the 1951 Convention:** Dummett relies heavily on the persecution-based definition of a refugee (echoing the 1951 Convention). **Given that this definition was a product of post-WWII politics focused on state persecution, how does Dummett morally justify excluding those fleeing equally devastating but non-persecutory threats like famine, climate collapse, or generalized war (which often stem from global systems the West benefits from)? Doesn't this limit his framework's relevance today?**
      *   *Likely Answer:* She'll likely defend the focus on persecution as addressing the most *urgent* harm (direct, intentional state violence/oppression) and a pragmatic starting point grounded in international law. She might concede the definition is imperfect but necessary for operational clarity and prioritizing the most acute danger.
      *   *Follow-Up:* **But doesn't prioritizing "persecution" arbitrarily elevate harms caused *by states* over structurally equivalent or worse harms (like famine from climate change exacerbated by global emissions) caused by *systemic forces* or *inaction*? Isn't this distinction morally arbitrary when the *outcome* (forced displacement under threat of death/destitution) is the same? Doesn't Dummett's own critique of arbitrary state power apply here?**

  4.  **The Limits of Reciprocity:** Dummett argues for a principle of reciprocity: states demanding control over emigration must grant symmetrical rights regarding immigration. **But what about individuals from states that *do* restrict emigration (e.g., authoritarian regimes)? Does Dummett's framework grant them *less* moral claim to immigrate elsewhere because their home state violates reciprocity? Isn't this punishing the victim?**
      *   *Likely Answer:* She'll argue the reciprocity principle targets *states*, not individuals. The right to immigrate is held by the *individual* regardless of their home state's actions. The reciprocity argument is meant to undermine the *state's* claim to restrict *in*migration while controlling *out*migration.
      *   *Follow-Up:* **If the individual's right is primary and independent of their state's actions, doesn't that render the reciprocity argument largely rhetorical? What concrete moral or practical force does it actually add beyond the assertion of the individual right itself?**

  5.  **Enforcement & Real-World Consequences:** Dummett's framework presents a strong moral ideal. **In a non-ideal world where states *will* enforce borders, often harshly, what does Dummett's philosophy practically demand? Does advocating for his near-absolute right require supporting open borders *now*, regardless of transitional costs (perceived or real, like strain on services or social cohesion)? How does he (or you) reconcile the ideal with non-ideal political realities?**
      *   *Likely Answer:* She'll distinguish ideal theory (establishing the fundamental right) from non-ideal transition strategies. She might argue for radically expanding legal pathways, dismantling harmful enforcement regimes, and addressing root causes of displacement as steps *towards* the ideal, emphasizing that current enforcement *creates* the harms restrictionists fear.
      *   *Follow-Up:* **Doesn't this non-ideal approach risk perpetuating the very injustices Dummett condemns (detention, deportation, deaths at borders) for an indefinite "transition" period? If the right is fundamental and urgent, how can its realization be postponed without complicity in ongoing violence?**

  6.  **National Identity & Democratic Will:** Dummett is skeptical of arguments based on preserving national culture or democratic self-determination as justifications for restriction. **But if a democratic polity, through legitimate processes, expresses a persistent desire to limit immigration to preserve a certain social model or identity (however flawed Dummett finds that desire), on what grounds does his moral framework override that collective democratic decision?**
      *   *Likely Answer:* She'll argue fundamental human rights (like freedom of movement) act as constraints on democratic majoritarianism. Democratic legitimacy doesn't extend to violating basic rights. National identity arguments are often exclusionary myths used to mask prejudice or protect privilege.
      *   *Follow-Up:* **Isn't the *definition* and *scope* of "fundamental human rights" precisely what's contested? When a core principle (like near-open borders) lacks broad democratic acceptance and challenges deeply held notions of community, how can it be implemented without being perceived as, or becoming, undemocratic imposition?**

  7.  **The Scope of the "Right to Immigrate":** Does Dummett's right to immigrate imply a correlative right to *settle permanently* and gain full citizenship rights in the destination state? Or could this right be satisfied by temporary protection or guest worker programs, even if those deny a path to full membership? How does his framework address the distinction between admission and full inclusion?
      *   *Likely Answer:* She'll argue that a meaningful right to immigrate inherently includes the possibility of establishing a life and integrating, implying a strong path to secure residence and ultimately citizenship. Temporary schemes that deny this are exploitative and violate the spirit of the right.
      *   *Follow-Up:* **Doesn't this significantly increase the perceived "cost" or "threat" of the right for receiving societies compared to mere admission? How does Dummett address the concern that large-scale, permanent immigration fundamentally transforms the political community in ways that go beyond the initial act of admission?**

  8.  **Relevance in the Age of Climate Migration:** Dummett wrote before climate displacement was a dominant concern. **Does his framework, particularly its focus on state persecution and the right to move, adequately address the looming crisis of climate migration, where people are fleeing uninhabitable environments often caused by global systems, not targeted persecution by a specific state actor? Does his argument need significant adaptation?**
      *   *Likely Answer:* She'll argue the core principle – the right to move to survive and flourish – applies directly. The *causes* (climate collapse, often driven by historical emissions) strengthen the obligation of high-emission nations. The refugee definition's limitations highlight the need to expand protection categories.
      *   *Follow-Up:* **Doesn't the scale and nature of climate displacement (potentially involving millions moving from multiple countries simultaneously) fundamentally challenge the Westphalian state system and the feasibility of "immigration" as traditionally conceived? Does defending Dummett's framework require advocating for a radical reimagining of state sovereignty and global governance beyond just tweaking refugee definitions?**

  **Use these questions to drill down into the philosophical bedrock and contemporary tensions within Dummett's arguments. Good luck with the interview!**
