prompt: |-
  I'm taking a seminar this term called "Political Obligation and Civil Disobedience," and after a few weeks on Rawls's account of when civil disobedience can be justified, we've moved back to the more basic question of whether ordinary citizens have any general obligation to obey the law at all. This week's readings were A. John Simmons's survey and rejection of the standard justifications for political obligation—consent, gratitude, fair play, and natural duty—together with Robert Paul Wolff's In Defense of Anarchism. Simmons works through each theory in turn and argues, I thought fairly persuasively, that none of them succeeds in grounding a general duty to obey the law even for citizens of a reasonably just, democratic state; Wolff reaches a similar anarchist conclusion by a different route, from an argument about moral autonomy.

  My study group got stuck on something afterward that I now have to write a short response paper on, and I haven't been able to resolve it on my own. If the best attempts to justify a general obligation to obey the law really do all fail, it seems to follow that "philosophical anarchism" is correct, and that in turn seems to mean no citizen of any actual state is ever genuinely bound to obey its laws. So shouldn't we conclude that a person is morally free to break any law she judges sufficiently unwise or inconvenient for herself, given that, by Simmons's and Wolff's own arguments, she was never under a real obligation to follow it in the first place? A couple of people in the group objected that this is a much stronger claim than the "philosophical anarchism" that Simmons and Wolff actually defend, but no one could quite explain why the inference should fail once their premises are granted. Could you help me work out where, if anywhere, this reasoning goes wrong, and what someone like Simmons would actually say about how a citizen is entitled to act, given his own conclusions about the state's authority?
reasoning: |-
  Okay, the user is grappling with a philosophical problem stemming from their seminar on political obligation. They've studied Simmons and Wolff's arguments against traditional justifications for obeying laws and are now wrestling with the practical implications. Specifically, they're confused about whether philosophical anarchism implies complete moral freedom to disobey any inconvenient law. Their study group hit a wall trying to resolve this, and they need to write a response paper.

  Hmm, the core tension here is between theoretical anarchism (no general obligation exists) and practical moral constraints (other reasons to obey). The user seems to think Simmons/Wolff's position leads to "anything goes," but that's probably a misinterpretation. I recall Simmons distinguishes between "authority-based" obligations and "content-dependent" moral reasons. That's crucial.

  The user might be missing how philosophical anarchism is primarily a meta-claim about state authority rather than a prescriptive ethics. Their question reveals a common beginner's mistake: conflating the absence of political obligation with the absence of all moral constraints. I should emphasize Simmons' "particularity requirement" - that obligation must bind you to your specific state, which consent/fair play etc. fail to do. 

  Wolff's autonomy argument is trickier. The user seems to think it licenses disobedience, but actually Wolff stresses that surrendering autonomy is morally problematic whether you obey or disobey. There's no clean "out" here. 

  For their paper, the user needs to see that philosophical anarchism isn't radical libertarianism. It denies the state's right to command, but doesn't erase ordinary morality. Murder remains wrong because it harms people, not just because it's illegal. Simmons would say: disobeying a bad parking law might be fine, but evading taxes that fund hospitals needs separate moral analysis about fairness to others. 

  The key is content-dependence. Each act requires weighing concrete moral reasons (harm, fairness, consequences) without the false shortcut of "the law says so." The state becomes one actor among others making claims, not a moral authority. That's the subtle shift. 

  I should warn against the "no obligation = no reason" fallacy. Philosophical anarchists actually tend to be morally scrupulous - they reject blind obedience, not responsibility. The user's study group might be stuck because they're overlooking how dense our moral landscape is beyond political obligation. 

  Also worth noting: Simmons thinks most people aren't philosophical anarchists, so social coordination still relies on perceived legitimacy. But that's sociological, not normative. For the paper, focus on why moral reasons persist without political obligation. Use concrete examples - that usually helps.
answer: |-
  You've hit on a crucial and often misunderstood implication of philosophical anarchism. Your study group is right to sense a tension, but Simmons and Wolff explicitly reject the inference that "no obligation = moral freedom to break any inconvenient law." Here's a breakdown of where the reasoning goes wrong and what Simmons (the clearer writer on practical implications) would say:

  ### 1. The Core Mistake: Confusing "No General Obligation" with "No Moral Reasons Ever"
     *   **Simmons/Wolff's Claim:** They deny a *general, content-independent, associative moral obligation* to obey the law *simply because it is the law* and *simply because you reside within a state's territory*. This obligation would require obeying *all* laws, even trivial or arguably unjust ones, *just because they are commands of the state*.
     *   **The Erroneous Inference:** "Therefore, *no law ever* generates a moral reason for me to obey it, and I can disobey whenever it's inconvenient or I disagree."
     *   **Why it's Wrong:** Denying a *special, state-based obligation* does **not** mean denying that *other, independent moral principles* constantly generate strong reasons to obey *many* (even most) laws. Philosophical anarchism rejects the *source* (the state's authority), not necessarily the *content* or *consequences* of the laws.

  ### 2. Simmons's Key Distinction: Obligation vs. Moral Reasons
     Simmons argues we must separate:
     *   **Political Obligation:** A special moral duty owed *to the state* (or fellow citizens *via* the state) to obey its laws *because they are its commands*. This is what he rejects.
     *   **Moral Reasons for Obedience:** Reasons to obey specific laws stemming from *independent moral principles* that apply regardless of the state's existence. These are numerous and powerful.

  ### 3. The Moral Reasons That Persist (Even Without Political Obligation)
     A philosophical anarchist like Simmons insists you must *still* consider these when deciding whether to obey a *particular* law:
     *   **Harm Principle:** Obeying laws against murder, assault, theft, fraud prevents grievous harm to others. Disobeying causes direct harm.
     *   **Fairness (Not Fair Play):** While Simmons rejects "Fair Play" *as grounding a general obligation*, the principle of fairness itself remains powerful. If you benefit from a system maintained by widespread law-abidingness (roads, clean water, security, markets), it's often *unfair* to free-ride by disobeying the rules *if* your disobedience undermines the scheme. This requires case-by-case judgment (Is *this* law crucial? Is *my* disobedience damaging?).
     *   **Promises & Commitments:** If you *have* explicitly consented to something (e.g., signed a contract governed by law), that promise binds you. General residence isn't consent, but specific acts might be.
     *   **Gratitude (Cautiously):** While rejecting gratitude *as grounding a general obligation*, Simmons acknowledges that benefiting from a just(ish) state *might* generate a *prima facie* reason to reciprocate *in ways that don't violate autonomy*, perhaps including obeying *some* laws. This is weak and highly contextual.
     *   **Natural Duties (Reinterpreted):** Simmons rejects Rawls's "Natural Duty of Justice" *as grounding an obligation to obey this particular state*. However, the underlying natural duties (e.g., not to harm, to promote justice, to aid others) *directly* give reasons to obey laws that align with them and to disobey laws that violate them. The duty is to justice itself, not to the state *as an authority*.
     *   **Prudence & Consequences:** Disobedience often carries risks of punishment for yourself and potentially harmful social instability. These are real moral considerations (especially concerning harm to others via instability).
     *   **Coordination & Order:** Many laws solve coordination problems (traffic rules) or provide essential public goods. Obeying them is often the only way to achieve beneficial collective outcomes. Disobedience can undermine these goods for everyone.

  ### 4. How a Philosophical Anarchist Decides Whether to Obey
     *   **Content-Dependent:** They evaluate the *specific law* and the *specific act* of disobedience based on independent moral principles (harm, fairness, justice, consequences, etc.). There is *no* default presumption "I must obey because it's the law."
     *   **No Blank Check for Disobedience:** The absence of a general obligation *does not* mean disobedience is always permissible. It means the *burden of justification* shifts. You need a *positive moral reason to disobey* (e.g., the law is unjust, harmful, or obedience conflicts with a stronger duty) OR a *lack of strong independent moral reasons to obey* (e.g., jaywalking an empty street where no harm, fairness, or coordination issue arises).
     *   **"Sufficiently Unwise or Inconvenient" is Usually NOT Enough:** Disobeying a law *just* because it's inconvenient for you personally, without considering the moral reasons *against* disobedience (harm to others? unfairness? undermining coordination?), would be morally reckless by Simmons's standards. The inconvenience to you must be weighed against the moral reasons generated by the principles above.
     *   **Civil Disobedience Gains Ground:** Precisely *because* there's no general obligation, the bar for *justifying* civil disobedience (as a conscientious, public breach aimed at justice) is *lower* than if a general obligation existed. However, it still requires justification based on the injustice of the law and the appropriateness of the means.

  ### 5. What Simmons Would Say About Your Scenario
     Simmons would argue that your imagined citizen is **not** morally free to break any law she judges "sufficiently unwise or inconvenient for herself." He would say:
      1.  She has *no general moral duty* to obey the law *just because it's the law*.
      2.  However, **for every single law she considers breaking, she must ask: Are there independent moral reasons (harm, fairness, promise-keeping, consequences, coordination) that count strongly against breaking *this specific law* in *this specific instance*?**
      3.  Disobedience requires justification based on either a lack of compelling independent moral reasons *to obey that particular law in that context*, OR the presence of stronger countervailing moral reasons *to disobey* (e.g., protesting grave injustice).
      4.  Disobeying solely for personal convenience, especially if it violates fairness (free-riding) or risks harm, would likely be morally wrong *because of those independent reasons*, not because of a mythical political obligation.

  **In essence:** Philosophical anarchism dismantles the state's claim to *authority* (the right to command obedience simply by commanding). It does **not** dismantle the complex web of ordinary moral reasons that often, coincidentally, align with what the law commands. The citizen is free *from the presumption of obedience*, but not free *from morality*. She must engage in careful, context-specific moral reasoning for each act, without the crutch (or illusion) of "the law says so." The anarchist conclusion is about the *state's lack of legitimate authority*, not a carte blanche for citizens to ignore moral constraints.
