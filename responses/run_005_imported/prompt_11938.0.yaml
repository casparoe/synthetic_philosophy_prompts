  ok random q from my metaphysics of causation class – we've been covering causation by omission lately, ie whether a failure to act can be a genuine cause, which is already awkward for regularity theorists since an omission isnt really an 'event' to be constantly conjoined with anything. we read hume for background so now i cant stop wondering: if hume were alive today and saw a self-driving car that fails to brake and hits someone, would he - sticking strictly to his own commitments, not later lewis-style counterfactual patches - say the failure-to-brake counts as a genuine cause of the crash, or does his own framework leave him stuck?
