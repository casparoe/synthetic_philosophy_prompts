  ## Memo: Recommendation on Feed Store Landmark Designation  
  **To:** Historic Preservation Commission  
  **From:** [Your Name]  
  **Date:** October 26, 2023  
  **Subject:** Recommendation for 1888 Feed Store Landmark Designation Ruling  

  ### I. Core Issue & Disagreement  
  The commission is divided on whether the Main Street feed store qualifies for "Landmark" designation under our ordinance, which requires a building to have "**retained its historic character since original construction**." Both sides agree on the facts:  
  - The structure has occupied the same foundation since 1888.  
  - It has continuously served as a feed store.  
  - No original physical material (e.g., wood, brick, fixtures) survives due to fires, floods, and renovations.  

  The disagreement centers on interpreting "retained its historic character":  
  - **Side A (Opposes Designation):** "Retained" requires physical continuity. If no original fabric exists, the building’s "historic character" cannot be preserved.  
  - **Side B (Supports Designation):** "Retained" encompasses continuity of use, location, and community identity. The building remains a historic landmark in function and cultural memory.  

  ### II. Recommended Ruling: Deny Landmark Designation  
  **I recommend denying the Landmark designation** based on the ordinance’s text, intent, and precedent in preservation law. Below is the reasoning, structured to address both interpretations directly.  

  #### A. The Ordinance Prioritizes Physical Integrity  
  1. **Language Analysis**:  
     - "Retained" implies preservation of existing elements. If every component has been replaced, nothing tangible has been "retained" from 1888.  
     - "Historic character" is intrinsically tied to original materials and craftsmanship. A building reconstructed with modern materials lacks authenticity.  

  2. **Precedent in Preservation Law**:  
     - The Secretary of the Interior’s Standards (used nationally) define "historic character" through seven aspects: **location, design, setting, materials, workmanship, feeling, and association**. While not all must survive, *materials and workmanship* are irreplaceable pillars.  
     - Courts consistently rule that total material replacement severs historical continuity (*see City of New Haven v. Historic Dist. Comm’n, 1998*).  

  3. **Ordinary Meaning**:  
     - If a family heirloom vase is shattered and replaced with an identical replica, we call it a replica—not the original. Similarly, a building stripped of all original material is a reconstruction, not a preserved entity.  

  #### B. Why Continuity of Use/Location Is Insufficient  
  1. **Ordinary Meaning vs. Ordinance Language**:  
     - While the feed store’s function and location are historically significant, the ordinance specifies "retained its historic character," not "retained its historic function or site."  
     - Designating it as a "Landmark" conflates the *land* (which is historic) with the *building* (which is not).  

  2. **Risk of Diluting the Designation**:  
     - If continuity of use alone sufficed, any modern structure on a historic site (e.g., a new bank on a 1700s tavern’s foundation) could claim "Landmark" status. This undermines the ordinance’s purpose: protecting tangible history.  

  #### C. Addressing Side B’s Valid Concerns  
  Side B rightly emphasizes the site’s enduring role in our town’s identity. This deserves recognition—**but not through the Landmark designation**.  
  - **Alternative Pathways**:  
    - Propose a commemorative plaque honoring the site’s 135-year legacy.  
    - Advocate for a new "Heritage Site" category in our ordinance (separate from "Landmark") for locations with cultural continuity but lost physical integrity.  
  - **Why This Honors Side B’s View**:  
    - It acknowledges the feed store’s historical significance without redefining "Landmark" in ways that could weaken preservation standards.  

  ### III. Conclusion & Path Forward  
  This ruling is not a rejection of the feed store’s heritage but a defense of the term "Landmark" as defined by our ordinance. **I move to deny the designation** and propose two actions:  
  1. **Formally recognize the site’s historical association** with a plaque or archival record.  
  2. **Review our ordinance** to address gaps in recognizing culturally significant sites lacking physical integrity.  

  This approach respects both sides: it upholds the ordinance’s textual focus on material preservation while affirming the site’s intangible legacy. I urge the commission to adopt this recommendation to preserve the integrity of our Landmark designation while working toward more inclusive recognition in the future.  

  ---  
  **Key Questions for Commissioners**:  
  1. Should "retained" in our ordinance prioritize physical materials over continuous function?  
  2. If we designate this site, what precedent does it set for future cases with total material replacement?  
  3. How can we formally honor historically significant sites that fall outside the "Landmark" criteria?  

  Let’s vote to uphold the ordinance as written—then improve it.
