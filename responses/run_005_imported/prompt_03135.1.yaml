answer: |-
  You've pinpointed a central and frequently debated implication of David Lewis's counterpart theory. **Yes, according to Lewis's strict ontology, ordinary claims like "Humphrey could have won" are not *literally and strictly* true of Humphrey himself.** Here's the breakdown and Lewis's response:

  1.  **Lewis's Ontological Commitment:** Lewis is a committed modal realist. He believes possible worlds are concrete, spatiotemporally isolated universes, just as real as our own. Crucially, he holds that individuals are "world-bound." Humphrey exists *only* in the actual world. He cannot literally exist in, or have properties in, any other possible world.

  2.  **Counterparts as Truthmakers:** To account for the truth of modal statements *without* violating world-boundness, Lewis introduces counterparts. Humphrey's counterpart in another world is a distinct individual who resembles Humphrey (in relevant respects, determined by context) more closely than any other individual in that world.

  3.  **The Implication:** When we say "Humphrey could have won the election," what makes this true, for Lewis, is:
      *   There exists at least one possible world (W).
      *   In W, there exists an individual (C).
      *   C is a counterpart of Humphrey (in the actual world).
      *   C wins the election in W.

  4.  **The Challenge (Your Point):** Since C is *not* Humphrey (they are numerically distinct individuals inhabiting different concrete universes), the truth of the statement "Humphrey could have won" seems to rest entirely on the actions of *someone else* (C), not Humphrey himself. Humphrey, strictly speaking, only has the property of *not winning* in the only world where he exists. The modal statement isn't *about* Humphrey having a different property; it's about a *different* individual (the counterpart) having a property in a *different* world.

  **Lewis's Response and Defense:**

  Lewis acknowledges this implication but argues it doesn't undermine the truth or usefulness of ordinary modal discourse. He offers several key points:

  1.  **"Loose and Popular" vs. "Strict and Philosophical" Speaking:** Lewis distinguishes between how we talk ordinarily ("loose and popular") and the precise metaphysical truth ("strict and philosophical"). Ordinarily, when we say "Humphrey could have won," we *are* talking about Humphrey. Counterpart theory provides the metaphysical *truth conditions* for that ordinary statement within his realist framework. The ordinary statement is true *because* of the counterpart relation.
  2.  **Counterpart Relation as the Bridge:** The counterpart relation (based on similarity and causal origins in a context-dependent way) is precisely what *connects* Humphrey to the possibility expressed by the statement. While C isn't Humphrey, C is *Humphrey's representative* in that other world. The truth of the modal claim is grounded in the existence of this representative who *is* sufficiently Humphrey-like and who *does* perform the action in question.
  3.  **Preserving Intuitions (Mostly):** Lewis argues that counterpart theory captures our *intuitions* about possibility better than trans-world identity (where Humphrey literally exists in multiple worlds). We often think of possibilities involving "a version of" someone, or "what if *that person* had done X," implying a close resemblance rather than strict numerical identity. Counterpart theory formalizes this intuition.
  4.  **Avoiding Paradox:** Lewis saw counterpart theory as solving problems like Chisholm's "Four Worlds Paradox" or the problem of accidental intrinsics, which plague theories allowing trans-world identity. World-boundness + counterparts avoids these paradoxes.

  **Objections and the Lingering Problem:**

  Despite Lewis's defense, many philosophers find the implication you identified deeply problematic:

  1.  **Loss of *De Re* Modality:** It seems to undermine genuine *de re* modality – modality *about the thing itself*. If Humphrey *himself* cannot have different properties, can we truly say *he* could have been different? The worry is that counterpart theory reduces *de re* modality to *de dicto* modality about counterparts.
  2.  **Moral Responsibility:** If "I could have done otherwise" is only true because a *different* person in another world did otherwise, does this undermine our concepts of moral responsibility and free will? (Lewis argued it did not, but the concern remains).
  3.  **Truth of Ordinary Statements:** While Lewis distinguishes loose/strict talk, critics argue that the ordinary statement *is* intended to be *about Humphrey himself* having a potential property. If the metaphysical truth conditions involve a different individual, it feels like a "bait-and-switch" – the statement seems to say one thing but its truth depends on something else entirely.
  4.  **Context Sensitivity:** The context-dependence of the counterpart relation can lead to seemingly inconsistent modal attributions, though Lewis saw this as a feature (capturing the vagueness of modality) rather than a bug.

  **Conclusion:**

  You are absolutely correct. **On Lewis's strict ontological view, ordinary claims like "Humphrey could have won" are not literally true *of Humphrey himself*.** Their truth is made by the actions of a distinct counterpart individual in another concrete universe who bears a sufficient resemblance to Humphrey (in relevant, contextually determined respects). Lewis defends this by arguing that:

  1.  This provides the correct truth conditions *for* our ordinary modal statements within his metaphysical framework.
  2.  The counterpart relation (based on similarity) effectively bridges the gap and captures the core intuition behind such statements.
  3.  This approach avoids significant problems associated with trans-world identity.

  However, the implication that modal properties aren't truly properties of the individual *themselves* remains one of the most persistent and serious objections to counterpart theory. Many philosophers find this consequence unacceptable, preferring theories that allow for genuine trans-world identity or conceptualist/ersatzist accounts of possible worlds where individuals can have counterparts without the radical ontological separation.
