answer: |-
  Here’s a direct case against the epistemic dissolution of resultant luck, engaging your stipulated scenario and the three fallback positions:

  ### Core Argument: Outcome Alters the Moral Landscape
  The epistemic account errs by treating blameworthiness as a static property fixed solely by prior intentions, character, and risk. But moral blameworthiness isn’t just about *what was in the agent’s head*; it’s also about *what their agency brought into the world*. When the reckless driver kills a pedestrian, their action **actualizes a moral harm** that the other driver’s identical recklessness merely risked. This actualization transforms the moral significance of their conduct in three ways:

  1.  **The Creation of a Moral Debt:** Killing someone creates a unique, objective moral injury that demands acknowledgment and repair. The driver who killed now *owes* something concrete: accountability to the victim’s family, societal condemnation proportional to the harm caused, and the burden of living with having destroyed a life. The other driver, while reckless, does not bear this specific debt. Their identical state of mind does not generate an identical obligation because the *object* of the obligation (the actualized harm) exists only in one case. Blameworthiness here is relational – tied to the real-world consequences one’s actions have forged.

  2.  **The Full Manifestation of Disregard:** Recklessness is defined by indifference to *foreseeable harm*. When harm occurs precisely as foreseen, the agent’s indifference is **validated and consummated** by the world. The reckless state of mind ceases to be merely potential; it becomes the demonstrable cause of ruin. The driver who kills provides the tragic proof that their indifference was sufficient to destroy a life. The other driver’s indifference, while equally reprehensible *in potentia*, remains unconsummated. The outcome thus reveals not *more* indifference (per the epistemic view), but the **completed efficacy** of the indifference that was equally present in both.

  3.  **Agent-Regret as Moral Recognition (Countering Fallback 2):** Bernard Williams’ "agent-regret" isn’t just a non-moral sentiment like sadness. It’s the **fitting emotional and moral response to having been causally responsible for a terrible outcome, even unintentionally.** The driver who kills *should* feel a unique, profound regret distinct from mere sympathy for the victim or remorse over their recklessness. This regret recognizes their *actual* role in extinguishing a life – a role the other driver, identically reckless, did not play. Dismissing this as "non-moral" sanitizes a crucial aspect of moral reality: we are responsible *for what we do*, not just for what we intend. The fittingness of intense agent-regret *is* evidence of heightened blameworthiness because it responds to the unique moral fact the killer created.

  ### Engaging the Fallbacks
  1.  **Against Zimmerman (Wrongness vs. Blameworthiness):** Zimmerman’s separation is artificial. While the *core reckless will* is identical, the **scope and nature of the blame** shift with the outcome. Blameworthiness encompasses not just the faulty will *in isolation*, but **the faulty will *as enacted*.** The killer’s will manifested in a catastrophic event; the other’s did not. Blaming the killer more harshly isn’t just about the greater wrongness of the act (killing vs. endangering), but about holding them accountable for the **full destructive potential their will unleashed.** To insist blameworthiness *only* tracks the identical internal state ignores that moral condemnation responds to what agents *accomplish* with their flawed wills in the real world. We blame the arsonist whose fire kills more than the one whose identical fire is extinguished, not because their *intent* differed, but because their *agency* caused greater devastation.

  2.  **Against the Epistemic Parity Objection:** You rightly stipulate full antecedent epistemic parity – same observable intoxication, inattention, risk, history. The epistemic account claims this parity *should* eliminate any moral difference. But it doesn’t. The outcome introduces a **new, objective moral fact** external to prior evidence: **one driver killed someone; the other did not.** This fact isn’t merely *more evidence* about their prior state; it’s a **transformative event** altering the moral landscape. Knowledge of this event *now* creates a justified asymmetry in our moral assessment that wasn’t justified *before* it happened. The stipulation doesn’t reintroduce asymmetry; it highlights how a *single contingent difference in outcome* generates a *genuine moral difference* that prior knowledge couldn’t predict or negate. The epistemic account mistakenly treats all morally relevant facts as fixed prior to the action's result.

  ### The Verdict
  The driver who kills is genuinely more blameworthy than her identically reckless counterpart. While both share equal culpability for the reckless *choice* and the *risk* they created, the killer bears additional blame for **having actualized the foreseen harm.** Her agency crossed a threshold from endangering life to extinguishing it. This outcome imposes unique moral burdens (the debt to the victim, fitting agent-regret) and demonstrates the horrifying efficacy of her recklessness in a way the near-miss does not. The epistemic account’s reduction of this difference to mere evidentiary asymmetry fails because it ignores how the actualization of harm fundamentally alters the moral relations the agent inhabits and the justified responses their action demands. Resultant luck is real moral luck; the unlucky driver is not just unfortunate, but morally worse off *because of what she did*. The broadly Kantian insistence on control cannot survive intact when we recognize that moral responsibility extends to the world our actions shape, not just the intentions that launched them.
