  so i fell down a rabbit hole reading rationalist blogs that cite aumann's agreement theorem as basically proof that two honest, rational people can't stay in a disagreement, and separately i ran into the 'equal weight view' from peer disagreement epistemology (elga/christensen). can you compare the two for me? specifically, what does aumann's theorem actually require (common priors, common knowledge of each others' posteriors, etc) that real disagreements basically never have, and does equal-weighting a peer's opinion even need aumann's theorem to be true, or is it justified on totally seperate grounds? kinda suspicious rn that ppl are just using aumann as a vibe and not an actual proof of anything about how much you should update irl.
