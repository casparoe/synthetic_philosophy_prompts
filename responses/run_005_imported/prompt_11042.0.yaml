  I recall the California Supreme Court in Turpin v. Sortini wrestled with similar issues. Their compromise - allowing special damages but not general damages - seems unstable upon examination. Either life itself is the injury or it isn't; half-measures just create conceptual messiness. 

  The strongest counterargument may be institutional: legislatures are better equipped to create limited wrongful life statutes (like some states have) with capped damages and specific medical criteria. Judicial adoption of Benatar's theory would be an all-or-nothing paradigm shift. 

  For the recommendation, I'm leaning toward affirming dismissal but explicitly acknowledging the moral weight of the plaintiff's suffering. This maintains doctrinal coherence while inviting legislative action - the "judicial handoff" approach Justice Brenn advocated in Thornburgh. 

  The tone should balance academic rigor with judicial pragmatism. Philosophers debate harm theories; courts must weigh real-world consequences. I'll flag how this could open floodgates for claims by children of addicts, impoverished families, or climate crisis victims - not necessarily invalid claims philosophically, but catastrophically unmanageable judicially.
