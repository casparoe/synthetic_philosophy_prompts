  ## BENCH MEMO: WRONGFUL LIFE CLAIM - *IN RE GUARDIAN AD LITEM FOR A.C. v. GENETIC DIAGNOSTICS, INC.*

  **TO:** Justice [Your Justice's Name]  
  **FROM:** [Your Name], Law Clerk  
  **DATE:** October 26, 2023  
  **RE:** Recommendation on Petition for Review - Wrongful Life Claim Based on Alleged Negligent Prenatal Testing

  **I. CASE SUMMARY & ISSUE PRESENTED**
  Petitioner A.C., a minor child suffering from a severe, degenerative genetic disorder, sues through her GAL, alleging Respondent clinician's negligent prenatal testing deprived her parents of information necessary to elect pregnancy termination. Petitioner claims *she* was harmed by being born into a life of unavoidable, profound suffering ("wrongful life"). The trial court dismissed, holding damages require comparing Petitioner's current condition to a non-existent baseline, which is legally incoherent. Petitioner invokes philosopher David Benatar's "asymmetry" argument to overcome this baseline problem: existence with suffering is *always* bad for the sufferer, while non-existence entails *no deprivation* of benefits for the non-existent, thus life itself can constitute net harm. **Issue:** Should this Court recognize a "wrongful life" cause of action based on Benatar's asymmetry theory?

  **II. RECOMMENDATION: AFFIRM DISMISSAL**
  The Court should affirm the dismissal of the wrongful life claim. While intellectually provocative, adopting Benatar's asymmetry as the foundation for a novel tort (1) commits the Court to a radical, non-traditional theory of harm incompatible with established tort principles, (2) creates insurmountable practical and logical problems for adjudication, and (3) raises profound policy concerns better addressed legislatively. The profound suffering alleged does not translate into a legally cognizable injury under our current tort framework.

  **III. ANALYSIS**

  **A. Petitioner's Argument & Benatar's Asymmetry**
  Petitioner's core argument is compellingly simple:
  1.  **Suffering is Bad:** Her existence entails severe, unavoidable pain and disability (a conceded fact for this motion).
  2.  **Benatar's Asymmetry:**
      *   **Presence of Pain = Bad:** Pain is intrinsically bad *for the person experiencing it*.
      *   **Absence of Pleasure ≠ Bad:** The absence of pleasure (well-being) is only bad *if there is someone deprived*. Non-existence entails *no subject* to experience deprivation. Therefore, non-existence is *not* bad.
  3.  **Conclusion:** Compared to the neutral state of non-existence, existence with profound suffering constitutes a *net harm* to the person brought into existence. No comparison to a "better life" baseline is needed; suffering itself is the harm.

  **B. Implications of Adopting Benatar's Theory as Controlling Law**
  Recognizing this claim would fundamentally alter tort law's conception of harm and duty:
  1.  **Harm Redefined:** Harm becomes the *imposition of a sentient existence characterized by suffering*, irrespective of any alternative state. Life itself becomes the injury under specific conditions.
  2.  **Duty Expansion:** Clinicians (and potentially others influencing procreation decisions) would owe a novel duty *to the potential child* to prevent its existence if foreseeable suffering meets a threshold (undefined).
  3.  **Causation Reimagined:** The negligent act (faulty testing) is deemed the cause of the child's existence *with suffering*, rather than causing the suffering itself (which was predetermined genetically).
  4.  **Damages Revolution:** Damages would compensate for the "harm of existence." Quantification becomes philosophically abstract (value of non-existence?) or focuses solely on the costs of suffering (medical care, pain & suffering) *as the manifestation of the underlying harm of existing*. This diverges sharply from traditional "make whole" principles.

  **C. Compelling Reasons to Decline Recognition (Despite Sympathy for Suffering)**
  While the child's suffering is undeniable and the negligence alleged is serious, sound judicial restraint counsels against creating this novel cause of action:
  1.  **Lack of Principled Limiting Principle:** Where is the line? Benatar's logic suggests *any* life containing *any* suffering could be deemed harmful compared to non-existence. Would claims lie for children born into poverty, war zones, or with non-degenerative but significant disabilities? The theory provides no inherent legal threshold for "sufficient suffering" to constitute harm, inviting boundless litigation.
  2.  **Judicial Incapacity for Baseline Calculation:** The core problem persists. While Benatar argues non-existence is "neutral," the law requires quantifiable damages. How does a jury assign a monetary value to the "harm of having been born"? Traditional damages (medical costs, pain) compensate for living *with* the condition, not for the *existence itself* that is the alleged harm. This remains inherently speculative and non-justiciable.
  3.  **Conflict with Fundamental Legal Values:** Tort law presupposes life as a fundamental good. Recognizing existence itself as harm in some circumstances fundamentally challenges this bedrock principle and could have unpredictable societal repercussions regarding the valuation of disabled lives and reproductive choices.
  4.  **Encroachment on Legislative Domain:** Creating such a profound shift in the recognition of harm and duty, with vast social and ethical implications, is quintessentially legislative. Most states that permit wrongful birth claims (for parents) explicitly reject wrongful life claims via statute or precedent. Adopting Benatar would bypass this considered policy choice.
  5.  **Alternative Remedies Exist (Partially):** The parents likely retain a viable "wrongful birth" claim for *their* damages (emotional distress, extraordinary medical/rearing costs). While not compensating the child directly for her subjective experience of suffering, this avenue addresses the financial consequences and holds the clinician accountable for the negligence.
  6.  **Untested Philosophical Foundation:** Benatar's asymmetry is a controversial philosophical argument within anti-natalism, not an established legal or medical principle. Basing a binding tort doctrine on it is highly precarious. Courts are ill-equipped to resolve deep philosophical debates about the value of existence as a matter of common law development.
  7.  **Floodgates & Moral Hazard:** Recognition could incentivize litigation for a vast array of conditions and circumstances, burdening courts and the medical system. It might also create perverse incentives in genetic counseling and reproductive decisions.

  **IV. POTENTIAL AVENUES & COUNTERARGUMENTS CONSIDERED**
  *   **"Special Damages Only":** Some courts (e.g., CA in *Turpin v. Sortini*) allow recovery *only* for quantifiable "extraordinary expenses" (medical, care) necessitated by the disability, avoiding the "existence as harm" question. While pragmatic, this is logically inconsistent. If existence itself isn't the harm, why is the child owed these costs? They arise from the *condition*, which existed pre-conception. The negligence caused the *birth*, not the *condition*. This half-measure is unstable.
  *   **"Severe Suffering Threshold":** The Court could limit claims to cases of "severe, unavoidable, and profound suffering/degeneration." However, defining this threshold judicially is inherently subjective and invites line-drawing disputes. Benatar's logic doesn't require such severity; it merely makes the harm more obvious.
  *   **Moral Force vs. Legal Doctrine:** The moral intuition that preventing such profound suffering is preferable is strong. However, translating this into a legal *duty owed to the potential child*, enforced through tort damages, is a qualitatively different step the law has consistently rejected for sound practical and doctrinal reasons.

  **V. CONCLUSION & RECOMMENDED DISPOSITION**
  The suffering endured by A.C. is tragic, and the alleged negligence, if proven, is reprehensible. However, recognizing her "wrongful life" claim based on Benatar's asymmetry theory requires a fundamental and destabilizing revision of tort law's core concepts of harm, duty, and damages that exceeds the proper role of judicial common law development. The practical and philosophical difficulties in adjudicating such claims, the lack of a limiting principle, and the profound policy implications demand legislative, not judicial, action. **Recommendation:** **AFFIRM** the trial court's dismissal of the wrongful life claim. The Court should issue an opinion:
  1.  Acknowledging the gravity of A.C.'s condition and the ethical questions raised.
  2.  Reaffirming the traditional legal barrier: the impossibility of comparing an impaired existence with non-existence to establish cognizable harm and damages *to the child*.
  3.  Explicitly declining to adopt Benatar's asymmetry as a controlling theory of harm in tort law.
  4.  Emphasizing that the parents' potential wrongful birth claim remains a separate avenue for addressing the alleged negligence.
  5.  Suggesting that the profound social and ethical issues presented are best addressed by the legislature if it chooses to create a statutory cause of action with defined parameters.
