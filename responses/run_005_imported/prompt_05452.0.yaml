  Had a long, kind of ridiculous arguement with a friend last night about van Fraassen's Reflection Principle and neither of us backed down. She thinks the diachronic Dutch book argument really does show you're rationally required to defer to your future credence whenever you know what it'll be, as long as the shift comes from expected rational learning rather than memory loss or manipulation. I kept pushing Christensen's "clever bookie" objection -- that a diachronic Dutch book isn't the same kind of thing as a synchronic one, so failing to satisfy Reflection doesn't actually convict you of incoherence the way violating probabilism does. We just ended up repeating ourselves louder. Can you write a dialogue between two philosophers who are equally sharp on this, one defending Reflection via the Dutch book argument and one pushing the clever-bookie line, and have them actually work through a specific case instead of trading slogans -- say, someone who knows a few drinks will predictably make them more confident about something, versus someone who knows they're about to lose the relevant memories, and whether Reflection should even apply to either. Don't let either of them strawman the other, and ideally they get clear on whether they actually disagree about the math or about what Dutch book arguments are supposed to prove in the first place.
