answer: |-
  ## Dialogue: Beneath the Modus Ponens - Negation & the Minimalist Abyss

  **Characters:**
  *   **Elena (Expressivist):** Defends a sophisticated hybrid expressivism drawing on Gibbard and Schroeder. Focuses on planning and "being for" attitudes as the core non-cognitive states.
  *   **David (Cognitivist Critic):** Skeptical of expressivism's ability to genuinely solve embedding without collapsing into minimalism or failing to capture key semantic features. Grounded in a broadly realist/minimalist cognitivism.

  **Setting:** A graduate student lounge after a metaethics seminar. Coffee cups litter the table.

  **(The dialogue begins mid-argument, having moved past initial modus ponens points.)**

  **David:** ...so sure, Elena, your Gibbard-inspired story about complex planning states *sounds* like it handles the basic modus ponens inference for "If lying is wrong, then getting your little brother to lie is wrong." You map the conditional to planning contingently: *if* I plan to blame for lying, *then* I plan to blame for getting little brothers to lie. The modus ponens inference becomes a consistency constraint on plans. Neat trick. But I’m telling you, the *real* devil is in the negation. Always has been. Take "Lying is not wrong." What state of mind is *that* supposed to express? And crucially, how is it *different* from merely *not* accepting "Lying is wrong"?

  **Elena:** Okay, David, fair challenge. Let’s take "Lying is not wrong." On my view, building on Schroeder’s "being for" framework but incorporating Gibbardian planning, the atomic normative judgment "Lying is wrong" expresses a specific conative attitude: *being for blaming for lying*. It’s not a belief about some property; it’s a practical stance.

  **David:** Right, I’m with you so far. The classic expressivist starting pistol.

  **Elena:** Now, negation. Following Schroeder’s core insight about negation for non-cognitive attitudes, "Lying is not wrong" expresses *being for not blaming for lying*. It’s not the *absence* of being for blaming; it’s a *positive* attitude *against* blaming in that circumstance. Think of it like endorsing a policy of non-blame for lying. It’s a distinct, positive motivational state: settling on *not* reacting with blame.

  **David:** Alright, I see the move. You’re trying to avoid the Frege point that merely lacking the attitude expressed by "Lying is wrong" doesn’t commit me to "Lying is not wrong." By making "not wrong" express its *own* positive attitude – "being for not blaming" – you give negation genuine semantic content. But here’s the rub: Does "being for not blaming for lying" genuinely capture the *logical force* of negation? Specifically, the *incompatibility*?

  **Elena:** Incompatibility? Of course. If I judge "Lying is wrong," I’m *being for blaming for lying*. If I judge "Lying is not wrong," I’m *being for not blaming for lying*. These are *directly conflicting practical stances*. I cannot coherently adopt both attitudes towards the same act at the same time. That *is* incompatibility, David. It’s practical inconsistency, mirroring logical inconsistency. That’s the whole point of Schroeder’s account!

  **David:** But is it *robust* enough? Take a complex embedding: "It is not the case that lying is not wrong." According to your system, the innermost negation expresses *being for not blaming for lying*. Applying another negation to *that*... what? Expresses *being for not [being for not blaming for lying]*? What state of mind is *that*? Some kind of meta-attitude about my attitudes towards blaming?

  **Elena:** (Takes a breath) Okay, this is where the hybrid aspect comes in, leaning on Gibbard’s hyperplan structure. Think of a hyperplan as a maximally specific contingency plan for what to feel (like blame) and do in all possible situations. "Lying is wrong" corresponds to a hyperplan that *includes* blaming for lying. "Lying is *not* wrong" corresponds to a hyperplan that *excludes* blaming for lying – it positively rules it out. Now, "It is not the case that lying is not wrong": This negates the proposition that my hyperplan *excludes* blaming for lying. So, what state expresses this? It’s the state of *not having a hyperplan that excludes blaming for lying*. But crucially, this *doesn't necessarily mean my hyperplan includes blaming for lying*! It just means blaming isn't *ruled out*.

  **David:** Precisely! And there’s the disconnect! In classical logic, "~~P" is equivalent to P. But on your account, the state expressed by "It is not the case that lying is not wrong" – *not ruling out blaming* – is *weaker* than the state expressed by "Lying is wrong" – *positively including blaming*. They aren’t equivalent! "Not ruling out blaming" is compatible with indifference, uncertainty, or just not having considered it. "Positively including blaming" is a strong commitment. Your expressivist negation doesn’t fully validate the classical double-negation equivalence. You’ve saved the distinctness of negation from mere non-acceptance at the atomic level, but you’ve distorted its logical behavior in embeddings. The cognitivist, using minimalist truth-conditions, has no such problem: "~~P" is true iff P is true. Full stop. Logical structure preserved.

  **Elena:** Hmm. That’s a sharper point than Unwin’s simple refusal case. You’re right that the *strength* of the commitment differs between the atomic positive claim and the doubly negated one on my view. But David, is classical logic sacrosanct for normative discourse? Maybe normative language, grounded in planning and conative attitudes, *doesn't* perfectly mirror the truth-functional logic of descriptive discourse. The core inferential role – that P and ~P conflict, and that ~~P entails P (even if not vice versa in terms of *strength* of commitment) – might be preserved enough for practical reasoning. The hyperplan structure *does* ensure that accepting "~~P" means I *can* consistently add P to my plan without conflict, which is a significant link.

  **David:** Perhaps. It’s a cost, though. But let me pivot. Even *if* I grant you that your account of negation, however logically non-standard, technically avoids the Frege-Geach embedding problem for all connectives in *some* coherent system... what have you *bought*? This brings me to Dreier’s creeping minimalism. Look at the machinery you’ve invoked: hyperplans, complex attitudes like "being for not blaming," logical relations defined over these states (incompatibility, consistency constraints), talk of propositions corresponding to features of hyperplans... You’re trafficking in talk of "contents," "inconsistency," "inference," and even quasi-"truth" (a hyperplan can be "correct" or "incorrect" relative to norms of plan consistency, right?).

  **Elena:** Well, we need a *logic* for these attitudes. We need to explain why modus ponens *works* for normative conditionals. That requires defining relations like inconsistency and entailment among the states expressed. That’s not minimalism; that’s just building a semantics!

  **David:** But *what* are you defining these relations over? Abstract objects – hyperplans or attitude complexes – that play *functional roles* isomorphic to possible worlds or truth conditions. You say "P is inconsistent with Q" meaning adopting the state for P and the state for Q is practically incoherent. The minimalist cognitivist says "P is inconsistent with Q" meaning P and Q can't both be true. The *structure* is identical. You say "The proposition that lying is wrong is true" means... well, what *does* it mean on your view now? Presumably something like "The hyperplan that includes blaming for lying is correct" or "The attitude of being for blaming for lying is the one to have"?

  **Elena:** I’d go with a minimalist/disquotational reading of truth for normative claims: " 'Lying is wrong' is true" is equivalent to "Lying is wrong." Which, on my view, just means re-expressing the conative attitude: being for blaming for lying. Truth is just a device for semantic ascent and generalization. It doesn’t imply a robust correspondence relation.

  **David:** Exactly! And the cognitivist minimalist says *precisely* the same thing: " 'Lying is wrong' is true" iff lying is wrong. They just think "Lying is wrong" expresses a *belief* with minimalist truth conditions. You both accept:
  1.  Normative sentences express mental states with representational *form* (they can be negated, embedded, stand in logical relations).
  2.  These states can be said to be "true" or "false" in a minimalist, disquotational sense.
  3.  The core logic (modus ponens, non-contradiction, even if double negation is slightly wonky for you) is preserved.

  So Elena, what *substantive* difference remains? What does your expressivism *deny* that the cognitivist minimalist accepts? It seems your "non-cognitive" attitudes, once rendered logically sophisticated enough to handle embedding, look and function *exactly* like cognitive belief states with minimalist truth conditions. The "non-cognitive" label starts to look like an empty badge. Creeping minimalism has consumed the view. The debate feels... semantic.

  **Elena:** (Leans forward, intensity rising) No, David, that’s where you’re fundamentally mistaken. The difference is *not* erased; it’s just pushed down to the *metaphysics of the attitude itself*. The cognitivist says the mental state expressed by "Lying is wrong" is a *belief* – it purports to *represent how the world is*, specifically, how the normative part of the world is. Its *direction of fit* is mind-to-world. Its functional role is tied to tracking (minimalist) truth.

  **David:** And yours?

  **Elena:** Mine is fundamentally *conative* or *plan-laden*. The state of *being for blaming for lying* isn't *representing* a normative fact *out there*. Its direction of fit is *world-to-mind*: it's a state of being *for* making the world conform to this plan, for *enacting* the blame. Its functional role is tied to *motivation*, *guidance*, and *practical deliberation*, not tracking. Minimalist truth talk is just a useful logical/semantic overlay we *project* onto these conative states because of their complex, propositionally structured nature – a nature we *need* to explain embedding and inference. But the underlying *metaphysical kind* of state is utterly different. The cognitivist posits a realm of normative facts (even minimalist ones!) that beliefs track. I posit only complex conative planning states. *That* is the denial. *That* is what separates us. The minimalist cognitivist thinks moral judgment is a kind of *theoretical* cognition. I think it's a kind of *practical* cognition – planning dressed in propositional clothing.

  **David:** But if the "propositional clothing" does *all* the logical and semantic work, and the only difference is a metaphysical story about the intrinsic nature of the attitude – a nature that, by your own admission, has no discernible effect on the logic, the truth-predicate usage, or even the phenomenology of deliberation once we're dealing with sophisticated agents – then that difference seems *epiphenomenal* to the actual practice of moral discourse and reasoning. It becomes a philosopher's secret, hidden beneath layers of identical semantic and logical behavior. How could we ever tell the difference? And if we can't tell the difference, doesn't Ockham's razor favor the simpler view – that it's all belief-like states with minimalist truth-conditions, without the extra metaphysical baggage of "non-representational conative attitudes that just happen to perfectly mimic representational ones"?

  **Elena:** The difference manifests in the *explanation of motivation*, David! The classic point! If judging "Lying is wrong" is just believing some minimalist truth, why does it *motivate*? The cognitivist needs some extra, contingent link – a desire – to explain action. For me, the judgment *is* (or constitutively involves) the motivating state. The conative attitude *just is* the source of motivation. That’s a crucial explanatory difference! And it *is* discernible when we ask *why* someone acts, not just how they infer.

  **David:** But does it? If the belief is *about* what I have reason to do, or what I’m committed to doing, under minimalism, and if I’m rational, doesn’t that belief *also* motivate, without needing a separate desire state? The distinction between belief and desire blurs at the level of normative judgment *even on minimalist cognitivism*. And your "being for blaming" attitude – once it’s as complex, logically structured, and potentially inert in a depressed or alienated agent as any belief – seems just as susceptible to motivational failures. The alleged tight connection frays at the edges. So again, where’s the *substantive*, non-verbal difference in the actual phenomena?

  **Elena:** It’s in the *fundamental orientation* of the mental state! The cognitivist view, even minimalist, treats morality as a domain of *discovery*. We *find out* what’s wrong. My view treats it as a domain of *invention* or *practical commitment*. We *settle* on how to live and feel. That’s a profound difference in the *metaphysics of normativity*, even if the surface logic looks similar. The minimalist cognitivist smuggles in a ‘view from nowhere’ perspective. I reject that possibility for normative concepts. They are constitutively tied to our practical standpoint.

  **David:** And I maintain that your ‘practical standpoint’ is just a disguised ‘view from somewhere’ – a perspective that generates beliefs *about* what that perspective commits one to, beliefs which are then minimally truth-apt. The ‘profound metaphysical difference’ you cling to seems to vanish under the weight of the semantic and logical sophistication your view requires. It becomes a difference in *origin story*, not in *current function* or *explanatory power*. We agree on the logical geography of the moral landscape; we just tell different tales about how the map was made. And if the map works identically regardless of its origin... well, then the origin story starts to look like mere ideology.

  **(Silence hangs heavy. Elena stares into her coffee, David taps his pen. The disagreement isn't resolved; it's been sharpened, focused onto the bedrock question: Can the expressivist's core commitment to the non-representational, conative nature of moral judgment survive the semantic and logical demands placed upon it without collapsing into a notational variant of minimalist cognitivism? The textbooks haven't settled this; the debate has simply moved deeper.)**
