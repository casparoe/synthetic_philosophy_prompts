prompt: |-
  Hey, so this semester I'm in a bargaining theory course thats cross-listed between econ and philosophy (lots of axiomatic stuff), and last week we covered both the Nash bargaining solution and the Kalai-Smorodinsky solution back to back. Basically our professor's framing was that KS is the more normatively defensible of the two because it satisfies individual monotonicity instead of Nash's IIA, and the classic motivating example is that the Nash solution can make a player strictly worse off even though nothing about their own situation changed -- it's just that the other player's opportunities expanded somewhere else on the frontier, which shifts where the product-maximizing point lands. Almost the whole class seemed to just take it for granted that this makes monotonicity the obviously "fair" axiom and IIA look kind of arbitrary and rationality-flavored by comparison.

  I've got a response paper due Friday and I want to push back on that consensus, but I'm blanking on a good angle since basically every reading we've been assigned treats monotonicity as intuitively fair and doesnt really defend IIA on its own terms. Could you help me argue for the opposite conclusion -- that IIA is actually the more defensible fairness condition for two-person bargaining, and that we should be suspicious of KS's monotonicity even granting the usual counterexample against Nash? One angle I keep circling back to but can't fully articulate: the KS solution measures each player's "fair share" as a proportion of the utopia point, but that point generally isn't jointly feasible -- so isn't there something a bit off about grounding a fairness notion in a reference point nobody could actually reach at the same time? Anyway, I'd rather have two or three genuinely distinct lines of argument than one thin one, since this has to run 3-4 pages.
