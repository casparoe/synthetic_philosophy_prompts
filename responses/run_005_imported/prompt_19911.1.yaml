  ## MEMORANDUM

  **TO:** Mutual-Aid Network Board Members  
  **FROM:** [Your Name], Board Member  
  **SUBJECT:** Re-evaluation of Deserter Prioritization Criterion & Recommendation for Vote  
  **DATE:** October 26, 2023  

  **I. Introduction**  
  This memo addresses the ongoing debate regarding our informal prioritization criterion for assisting Russian deserters: prioritizing individuals who deserted based on a belief that *this specific war in Ukraine is unjust* over those motivated primarily by fear of death or aversion to military life. The recent case of the conscript who distinguishes between a "genuinely defensive war" and "Putin's war of choice" has crystallized philosophical disagreements within our board, primarily concerning the "moral equality of combatants" (MEC) doctrine and a soldier's role in judging the justice of a war. This memo aims to fairly present both perspectives, analyze their strengths, and provide a clear recommendation ahead of our vote.

  **II. The Case for Maintaining the Current Criterion (Majority Perspective)**  

  *   **Core Argument:** Our mission extends beyond mere extraction; it supports individuals taking a profound moral stand against an act of aggression widely condemned as illegal and unjust under international law (UNGA Resolutions, ICJ rulings). Prioritizing deserters motivated by this specific recognition aligns directly with this mission. It rewards and facilitates acts of conscience that directly challenge the war's continuation.
  *   **Strengths:**
      *   **Mission Alignment:** This criterion directly targets the *cause* we implicitly oppose – the unjust invasion of Ukraine. Supporting those refusing to participate *because* it's unjust represents the purest form of our mission.
      *   **Moral Clarity & Agency:** It acknowledges the deserters' moral agency. The conscript's reasoning demonstrates an ability to discern between legitimate defense (which he accepts) and aggressive war (which he rejects), reflecting a sophisticated ethical position deserving support. Jeff McMahan's critique of MEC ("Killing in War") argues combatants fighting for an unjust cause *do not* have an equal moral right to kill. Our criterion recognizes deserters who implicitly embrace this view.
  *   **Addressing the Critic's Strongest Point:** The critics rightly argue that traditional MEC and the laws of war (like POW status) deliberately avoid judging individual soldier motives to ensure universal protections and maintain order. **However,** our role is *not* that of a belligerent state or an international tribunal. We are a *humanitarian mutual-aid network* operating outside the conflict, making difficult choices under resource constraints. Our criterion isn't about assigning *legal* guilt or innocence under MEC; it's about prioritizing limited resources based on *why* someone sought our help *in this specific context*. We are not denying basic protections; we are making a practical allocation decision based on our values and mission.

  **III. The Case Against the Current Criterion (Minority Perspective)**  

  *   **Core Argument:** The "moral equality of combatants" (MEC), as articulated by Michael Walzer ("Just and Unjust Wars"), holds that soldiers are generally not morally responsible for judging the overall justice of the war they fight; that duty lies with political leaders. Prioritizing based on a soldier's *personal judgment* of the war's injustice undermines this principle and risks:
      1.  **Arbitrariness & Subjectivity:** Judging the sincerity or validity of a deserter's stated moral belief is inherently difficult and subjective. Who determines if their belief is "correct" or sufficiently developed?
      2.  **Ignoring Shared Vulnerability:** Soldiers refusing to fight *for any reason* face immense risk: execution, imprisonment, torture. The core humanitarian impulse should prioritize *need* and *vulnerability* arising from the act of desertion itself, not the specific rationale.
      3.  **Philosophical Inconsistency:** If soldiers aren't expected (under MEC and LOAC) to adjudicate the war's justice before fighting, why should we require them to have done so to deserve our aid *after* deserting? POW protections deliberately avoid motive inquiries.
  *   **Strengths:**
      *   **Philosophical Foundation:** MEC provides a coherent framework for understanding the distinct roles and responsibilities of leaders vs. soldiers, preventing the burden of jus ad bellum judgments from falling unfairly on individuals often lacking information and choice. Walzer's framework is deeply influential in both ethics and law.
      *   **Humanitarian Focus:** Prioritizing based on vulnerability (e.g., immediacy of threat, health, family situation) or simply the act of desertion itself (time served, unit danger) aligns more closely with core humanitarian principles of impartiality and responding to need, avoiding difficult moral judgments about internal states.
      *   **Practicality:** Assessing vulnerability or desertion circumstances might be more concrete and less prone to manipulation than assessing the depth or "correctness" of moral conviction.

  **IV. Analysis & Recommendation**  

  Both perspectives present compelling arguments grounded in ethical theory and practical concerns. The critics correctly identify a tension with the traditional MEC framework and the practical difficulties of assessing moral motivation. The majority correctly emphasizes mission alignment and the value of supporting conscientious refusal in the face of a clear aggression.

  However, **I recommend we KEEP the current criterion, with one crucial clarification and implementation safeguard:**

  1.  **Keep the Criterion:** Supporting desertion motivated by a rejection of *this specific war of aggression* remains the most direct way to fulfill our mission's implicit goal of undermining an unjust war and aiding those whose conscience compels them to resist it. The conscript's case exemplifies *exactly* the reasoning we seek to support. Abandoning this criterion would dilute our mission's unique focus.
  2.  **Clarify the Scope:** Explicitly frame the criterion as recognizing desertion motivated by the belief that **Russia's invasion of Ukraine constitutes an illegal war of aggression under widely accepted international norms.** This grounds the "unjust" judgment not solely in the deserter's personal opinion, but in the overwhelming consensus of the international community (UN resolutions, ICJ rulings, international condemnations). It avoids requiring deserters to be philosophers; it requires them to recognize the fundamental nature of *this specific conflict* as an aggressive act. The conscript's "Putin's war of choice" vs. "defensive war" distinction perfectly captures this.
  3.  **Safeguard: Implement a "Good Faith" Presumption:** Acknowledge the practical difficulty of judging sincerity. Unless there is overwhelming evidence of bad faith manipulation (e.g., demonstrably false statements, evidence of war crimes committed *after* their claimed moral awakening), accept the deserter's stated motivation regarding the *nature of this specific war* at face value during initial triage. Our limited resources and mission focus justify this practical approach. We are not a court.

  **V. Why Not Drop or Radically Revise?**  

  *   **Dropping the Criterion:** Would abandon the core moral dimension that distinguishes our mission and likely demoralize members who joined specifically to support conscientious refusal. It risks making our prioritization seem arbitrary or solely based on luck/timing.
  *   **Radical Revision (e.g., pure vulnerability):** While ethically sound in abstract humanitarian terms, it severs the direct link to our mission's focus on *resisting this unjust war*. It also doesn't necessarily resolve prioritization dilemmas, as vulnerability assessments can be equally complex. Our current criterion, clarified, provides a clear, mission-driven rationale.

  **VI. Addressing the Losing Side's Strength**  

  The minority's invocation of Walzer's MEC and the practical/ethical dangers of subjective moral judgments is the strongest counter-argument. **Our revised approach directly addresses this:**

  1.  **Grounding in International Consensus:** By tying "unjust" to the near-universal condemnation of Russia's invasion as illegal aggression, we shift the basis from the soldier's *personal philosophical judgment* to their *recognition of an objective, widely established fact*. This mitigates the "soldiers aren't philosophers" critique. They aren't judging abstract justice; they are acknowledging the manifestly aggressive character of *this specific war*.
  2.  **"Good Faith" Presumption:** This directly confronts the subjectivity concern. We avoid intrusive investigations into the depth of moral conviction by accepting their stated reason concerning the *nature of the war* unless evidence overwhelmingly contradicts it. This respects the practical realities of our work and the deserters' situation.
  3.  **Acknowledging the Core Insight:** We explicitly acknowledge the validity of MEC *within the context of the laws of war and the responsibilities of states*. Our prioritization criterion operates in a different sphere – a voluntary humanitarian network making resource allocations based on its specific values and goals. We are not challenging POW protections; we are making a different kind of choice.

  **VII. Conclusion and Call to Vote**  

  Our prioritization criterion, while imperfect, is central to our identity and mission. The philosophical challenge raised is serious and deserves respect, but it can be addressed by clarifying that we prioritize based on refusal to participate in **this specific, widely condemned war of aggression**, not on a deserter's ability to articulate abstract just war theory. Combined with a presumption of good faith regarding their stated motivation for seeing the war *as such*, the criterion remains the most defensible and mission-aligned approach.

  **Recommendation:** **Keep the criterion**, amended to explicitly define the "unjust war" as **Russia's invasion of Ukraine recognized as an illegal act of aggression under international law**, and implement a **presumption of good faith** regarding the deserter's stated motivation based on this understanding.

  I urge you to consider this analysis carefully. We will vote on maintaining the current criterion (with the clarification and safeguard outlined) versus dropping it entirely at next week's meeting. I do not recommend a middle-ground revision at this time, as it risks creating more confusion than it solves.
