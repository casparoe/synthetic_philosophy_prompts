  Ok this has been living in my head rent free. I just got a return offer for a pretty brutal finance job - long hours, but the pay's absurd - and my plan has always been to grind for like 6-7 years, save aggresively, then quit and 'actually start living.' My roommate says thats obviously the smart move, since a few miserable years now basically buys back all my time later. Something about that argument feels off to me but I can't figure out what it is. We've been reading a bunch of early 1900s economists for one of my classes lately, which is probably why I keep overanalyzing this, but I can't connect it to anything specific. Is my roommate right that this is just smart delayed gratification, or is there an actual problem with 'sacrifice now, live later' as a plan?
