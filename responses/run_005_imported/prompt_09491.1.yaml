  ## The Unyielding Knot: Why Bradley's Regress Still Haunts Structured Propositions

  Bradley's regress, that relentless specter haunting the philosophy of propositions, presents a stark challenge: how can a structured entity, composed of distinct constituents, achieve the unified whole necessary for bearing truth or falsity? Attempts to explain this unity by invoking relations seem to trigger an infinite explanatory demand. While contemporary theories offer sophisticated escapes, particularly "act-based" accounts and "fact-based" alternatives like King's, a critical examination reveals that the regress is not dissolved but merely displaced. **I contend that Bradley's regress demonstrates a fundamental explanatory gap inherent in *all* constituent-based theories of propositions, including act-based ones. While act-based theories (Soames, Hanks) shift the locus of unity creatively, they ultimately relocate the regress into the unity of the act itself. King's fact-based approach fares no better, relocating it into the unity of the constituting fact. No constituent theory provides a satisfactory terminus for the demand for unity.**

  **The Act-Based Gambit: Unity from Performance**

  Scott Soames and Peter Hanks champion act-based theories as a decisive break from traditional relational models. For Hanks, a proposition *is* the act of predicating a property of an object (or objects). The proposition *that Desdemona loves Cassio* just *is* the act of predicating the relation *loving* of Desdemona and Cassio (in that order). Crucially, the unity of the proposition is not explained by a further constituent or relation; it is constituted *by* the performance of the act itself. Predication is a primitive cognitive operation. There is no "R" needing unification with "a" and "b"; there is only the act *of predicating R of a and b*. The regress, Hanks argues, is blocked at the first step because the act provides an immediate, non-relational unity. The constituents are not inert entities waiting to be glued; they are *employed* in the act.

  **The Persistent Shadow: Regress in the Act?**

  Despite its ingenuity, the act-based solution faces a powerful objection: it merely relocates the unity problem. What unifies the act itself? An act of predication has components: an agent (implicitly or explicitly), a predicative operation, and the objects/properties targeted. Why is predicating love of Desdemona and Cassio a *single, unified act* rather than a mere temporal co-occurrence of an agent, a relation, and two objects? If the act is complex, what binds *its* constituents into the cohesive event that constitutes the proposition?

  Hanks responds by insisting that predicative acts are primitive and unanalyzable. Their unity is not *explained* but *given*. This move, however, risks being question-begging. It replaces the need to explain the unity of the propositional constituents with the need to explain the unity of the act's constituents, offering only a brute assertion of primitivism. Furthermore, the theory must account for the *content* of the act – why *this* act represents Desdemona loving Cassio rather than something else. While Hanks ties content tightly to the type of act performed (predicating *loving* of Desdemona and Cassio), the worry arises that the connection between the *performance* and the *specific representational content* requires explanation. Is there not a potential regress in explaining why *this* act of predicating has *this* specific content? The act-based theory relies on the unity and inherent intentionality of the cognitive act, but Bradley’s challenge suggests that this unity and intentionality are precisely what demand explanation and may themselves be susceptible to a regress.

  **King's Fact-Based Alternative: Propositions as Worldly Configurations**

  Jeffrey King offers a radically different constituent-based solution. Propositions are not mental acts but complex facts about the world. Specifically, a proposition is a fact concerning the semantic relations holding between the syntactic items of a sentence in a context. For "Desdemona loves Cassio," the proposition is the fact that the relation *loving* occurs as relating the individual concepts (or referents, depending on the stage of King's theory) associated with "Desdemona" and "Cassio" in a specific sentential structure within a context. Unity is achieved because the fact *just is* the relating relation actually relating the objects in the appropriate way. The proposition *is* the fact of the relation holding between the relata in the structure provided by the sentence-in-context.

  **Regress Relocated: The Unity of the Fact**

  King’s theory ambitiously grounds propositions in worldly structures. Yet, Bradley's regress resurfaces with formidable strength. What unifies *this fact*? The fact that *loving* relates Desdemona and Cassio involves constituents: the relation *loving*, Desdemona, Cassio, and presumably the "relating" aspect itself. If we need to explain why these form a unified fact rather than a mere list, King must appeal to the nature of facts or the reality of relations. He argues that relations are inherently relating – they don’t *need* a further unifier; it’s simply their nature to connect. This mirrors Russell's "relating relation" move.

  However, this faces the same core Bradleyan objection: **positing an inherent "relating" nature is just to reintroduce the required unifier *as a property of the relation itself*.** Why does *this* relation, *in this instance*, possess the property of "relating Desdemona to Cassio"? What explains the unity of the relation-instance *with* its "relating" property *and* the relata? The demand for an explanation of how *all these elements* combine into the single fact constituting the proposition seems to re-initiate the regress at the level of the fact. King’s context and sentential relations provide structure, but the fundamental problem of how *that structured complex* achieves its unity remains unaddressed. The context itself becomes another constituent needing unification. The regress is relocated from the abstract proposition to the concrete fact meant to constitute it.

  **Verdict: The Inescapable Labyrinth**

  The strongest argument against my conclusion – that the regress persists – is the act-based theorists' claim of primitivism. By grounding unity in the irreducible nature of cognitive acts (predication), they argue they provide a legitimate stopping point. The regress is *dissolved* because the demand for explanation is misplaced; predication is where explanation bottoms out. The cognitive act *is* the fundamental unity-bearer.

  However, this primitivist defense is ultimately unconvincing against the relentless force of Bradley’s challenge. While we may *experience* cognitive acts as unified, philosophy seeks an *explanation* of what constitutes that unity, especially when the act itself has discernible components (agent, operation, targets). To simply assert that predication is primitive feels like conceding that the constituent-based approach cannot explain its own fundamental condition of possibility – unity. It replaces the unexplained unity of the proposition with the unexplained unity of the act. Similarly, King’s appeal to the inherent relating nature of relations or the brute unity of facts concedes the explanatory failure at the factual level.

  Therefore, **Bradley's regress does indeed show that no account of propositions *as structured, constituent-based entities* can ultimately explain their own unity.** Both act-based and fact-based theories, despite their ingenuity and valuable insights into propositional representation and truth conditions, fail to defuse the regress. They succeed only in relocating it: act-based theories relocate it to the unity of the predicative act and its connection to its content, while fact-based theories like King's relocate it to the unity of the complex fact constituting the proposition. The regress persists because the core problem – explaining how distinct elements combine into a genuine, truth-evaluable whole without invoking an endless hierarchy of unifiers – remains intractable for any theory positing complex propositions with real constituents. The lesson of Bradley's regress may be that the unity of the proposition is either primitive and inexplicable (a bitter pill for analysis) or that we must seek radically non-constituent-based approaches to propositional content, though such avenues lie beyond the scope of this essay. The labyrinth, for now, remains inescapable.
