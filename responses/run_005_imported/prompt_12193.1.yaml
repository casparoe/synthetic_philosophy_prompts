prompt: |-
  So I'm putting together a decision theory seminar and wanted a sanity check on something. People tend to lump the Pasadena paradox in with the St. Petersburg paradox, like its just "St. Petersburg but fancier" - same basic unbounded-payoff weirdness, different flavor. I've got a hunch that's wrong, that the two are actually pathological in quite different ways, not just different in degree. Can you compare the two properly and tell me which one poses the bigger problem for expected utility theory as a normative theory of rational choice, and why? Also, does the rearrangement business in Pasadena actually give a rational agent something to worry about, or is it just a mathematical curiosity with no real decision-theoretic bite?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're organizing a decision theory seminar and want to clarify the differences between the Pasadena and St. Petersburg paradoxes. They mention that people often lump these two together as similar unbounded-payoff problems, but they suspect the pathologies are fundamentally different. Their main questions are: how do the paradoxes differ, which one poses a bigger problem for expected utility (EU) theory, and whether the rearrangement issue in Pasadena has real decision-theoretic implications.

  First, I need to recall the core mechanics of each paradox. St. Petersburg is straightforward: a coin flip game with doubling payouts. The expected value is infinite, yet people aren't willing to pay much to play. This challenges EU because rational agents should pay any finite amount, but intuitively, they don't. The issue here is the infinite expectation conflicting with real-world behavior. The problem is practical but doesn't break EU internally; it just highlights a mismatch with human psychology.

  Now, Pasadena is trickier. The payouts alternate in sign and magnitude based on the flip sequence. Calculating the expected value requires a conditionally convergent series. The Riemann series theorem says rearranging terms can change the sum to any real number or make it diverge. So the expectation isn't just infinite—it's undefined. That's a deeper problem because EU requires a well-defined expectation. Without it, the theory can't even assign a value to the game, which undermines its foundation as a normative theory.

  The user is concerned that others see Pasadena as just a fancier St. Petersburg. But the key difference is that St. Petersburg has a well-defined infinite expectation, while Pasadena has no single expectation at all. This isn't a difference in degree but in kind. The rearrangement aspect of Pasadena isn't just a math quirk; it means the game's value depends on how you compute it, which a rational agent must consider. This makes it a more severe critique of EU theory because it attacks the very possibility of assigning expected utilities in certain cases.

  Next, considering which paradox is more problematic for EU as a normative theory. St. Petersburg's infinite expectation is problematic but manageable with tools like utility dampening or bounded utility functions. Pasadena's undefined expectation is harder to fix. No standard EU adjustment can resolve it because the issue is foundational—expectation must be well-defined. This suggests Pasadena poses a bigger threat to EU's coherence.

  The user also asks if rearrangement has decision-theoretic bite. Absolutely. If a rational agent can rearrange payoffs to get any expected value, they might be incentivized to manipulate the order to justify preferences. This introduces arbitrariness into rational choice, which is a serious issue. Real agents might not face such games, but the theoretical challenge remains: EU can't handle certain well-defined gambles.

  I should also touch on why people conflate them. Both involve high variance and infinite moments, but Pasadena's conditional convergence is the critical factor. Highlighting this distinction will help the user's seminar. Emphasizing that Pasadena's pathology is about the non-existence of an expectation, while St. Petersburg's is about its divergence, clarifies the hierarchy of problems.

  Lastly, the user's unspoken need might be to present a compelling case in their seminar that these paradoxes aren't just variants but categorically different challenges. They want to show that Pasadena fundamentally threatens EU's foundations, making it a more severe critique. Providing clear, technical distinctions with implications for rational choice will strengthen their argument.
answer: |-
  You're absolutely right to question the lumping together of Pasadena and St. Petersburg. While both involve infinite expectations in some sense, **they are fundamentally different pathologies, and Pasadena poses a far deeper and more serious challenge to Expected Utility Theory (EUT) as a normative theory.** Here's a breakdown:

  1.  **The St. Petersburg Paradox (SP) - The Problem of Divergence:**
      *   **Setup:** Payoff = $2^n$ if the first heads is on toss `n`. Probability of this outcome = (1/2)^n.
      *   **Expected Value Calculation:** EU = Σ [ (1/2)^n * 2^n ] = Σ [ (1/2)^n * 2^n ] = Σ [1] = 1 + 1 + 1 + ... = **∞**.
      *   **The Pathology:** The series **diverges** to positive infinity. The expected utility is unambiguously infinite.
      *   **Problem for EUT:** A rational agent with unbounded utility for money should be willing to pay *any* finite amount to play this game. Yet, intuitively, people aren't willing to pay very much. This highlights a conflict between the normative prescription of EUT (pay any finite price) and descriptive human behavior/risk aversion.
      *   **"Solutions":**
          *   **Bounded Utility:** Most convincingly, no real agent has unbounded utility for money. Once utility is bounded (e.g., u(wealth) = log(wealth)), the EU becomes finite and reasonable.
          *   **Probability Skepticism:** One might doubt the ability to perform arbitrarily many flips.
          *   **Risk Aversion:** EUT can incorporate risk aversion via concave utility, which also resolves the finite price issue.
      *   **Normative Status:** SP is primarily a *practical* challenge showing that unbounded utility leads to counter-intuitive prescriptions. However, it doesn't fundamentally break EUT's *mathematical framework*. The expectation is well-defined (as ∞), even if its implications clash with intuition. Bounded utility resolves it within the EUT framework.

  2.  **The Pasadena Paradox (PP) - The Problem of Non-Existence (via Conditional Convergence):**
      *   **Setup:** Payoff = (-1)^{n+1} * 2^n / n if the first heads is on toss `n`. Probability = (1/2)^n.
      *   **Expected Value Calculation:** EU = Σ [ (1/2)^n * (-1)^{n+1} * 2^n / n ] = Σ [ (1/2)^n * (-1)^{n+1} * 2^n / n ] = Σ [ (-1)^{n+1} / n ].
      *   **The Pathology:** The series Σ [ (-1)^{n+1} / n ] is the alternating harmonic series. Crucially, this series is **conditionally convergent**, but **not absolutely convergent** (because Σ |(-1)^{n+1} / n| = Σ 1/n diverges).
          *   **Riemann Series Theorem:** A conditionally convergent series can be rearranged to converge to *any* real number, or to diverge to +∞ or -∞.
      *   **The Consequence:** The **expected utility is undefined**. It doesn't have a single value. The sum depends entirely on the *order* in which you add the terms. There is no unique, order-invariant sum.
      *   **Problem for EUT:** This strikes at the heart of EUT. The theory *requires* a well-defined expectation value to assign a utility to a gamble and compare it to others. **PP presents a gamble where the expected utility literally does not exist.** How can a rational agent compare this gamble to a sure thing, or to another gamble, if its core value is undefined? What does "maximize expected utility" even mean here?
      *   **The Rearrangement "Business":** This is **NOT just a mathematical curiosity; it has profound decision-theoretic bite.** Imagine two agents:
          *   Agent A calculates the expectation in the standard order: 1 - 1/2 + 1/3 - 1/4 + ... = ln(2) ≈ $0.693.
          *   Agent B rearranges the terms: (1 + 1/3 - 1/2) + (1/5 + 1/7 - 1/4) + (1/9 + 1/11 - 1/6) + ... > 0.693 (or any other value they desire).
      *   **Decision-Theoretic Implications:** Both agents are using the *same* gamble description and the *same* EUT formula. Yet, Agent A concludes the game is worth ≈ $0.69, while Agent B concludes it's worth more (or less, or negative, or infinite). **Rational agents, following the rules of EUT, can legitimately assign arbitrarily different utilities to the exact same gamble based purely on how they choose to sum the infinite series.** This violates core principles of rationality:
          *   **Objectivity/Uniqueness:** The value of a gamble should be objective, not depend on the agent's computational method.
          *   **Consistency:** An agent should assign the same value to the same gamble regardless of how they perform the calculation (as long as it's correct).
          *   **Comparability:** How can agents agree on choices involving such gambles?
      *   **"Solutions"?:** There are no easy fixes within standard EUT.
          *   **Bounded Utility Doesn't Help:** While bounded utility resolves SP, it doesn't resolve the conditional convergence in PP. The series Σ [ u(payoff_n) * prob_n ] could *still* be conditionally convergent even if `u()` is bounded.
          *   **Weak Expectations/Principal Values:** Proposals like using the Cauchy principal value (the limit of symmetric partial sums, giving ln(2)) or other summation methods impose an *external* ordering. But why is one ordering "rational" and others not? This violates the core idea that the expectation should be intrinsic to the gamble description (the payoffs and probabilities), not dependent on an arbitrary summation convention.
          *   **Finitism:** Denying the possibility of infinite gambles is unsatisfying and limits the scope of decision theory.

  **Comparison & Which Poses the Bigger Problem:**

  *   **SP:** Problem of **divergence** (EU = ∞). Challenges EUT's implications under unbounded utility, but the expectation is well-defined. Resolved by bounded utility within EUT.
  *   **PP:** Problem of **non-existence** (EU = undefined). Challenges the very **definition and existence** of the expected utility value for a well-defined gamble. Undermines the core mechanism of comparison and maximization. Resistant to standard fixes like bounded utility.

  **Conclusion:**

  1.  **Fundamental Difference:** SP has a well-defined but infinite expectation; PP has **no well-defined expectation at all** due to conditional convergence. This is a difference in **kind**, not degree.
  2.  **Bigger Problem for EUT:** The **Pasadena Paradox poses a significantly bigger problem for EUT as a normative theory.** SP highlights a counter-intuitive consequence of an assumption (unbounded utility) that can be relaxed within the theory. PP reveals a **fundamental inconsistency within the mathematical framework itself** for a class of plausible gambles: the expected utility simply does not exist, and rational agents using the theory can reach contradictory conclusions about the same gamble. This directly attacks the theory's ability to provide unique, objective prescriptions for rational choice.
  3.  **Rearrangement Bite:** The rearrangement issue is **absolutely central to the decision-theoretic bite of PP.** It's not a curiosity; it's the mechanism that demonstrates the non-existence of the expectation and shows how rational agents following EUT can be led to arbitrary and contradictory valuations of the same prospect. This makes it a profound challenge to the coherence and uniqueness demanded by normative rationality.

  **For Your Seminar:** Emphasize that SP is about the *implications* of an infinite expectation, while PP is about the *impossibility* of defining an expectation at all. PP exposes a genuine mathematical pathology (conditional convergence of a utility series) that EUT lacks the resources to handle consistently. This makes PP a more severe critique of EUT's foundations as a universally applicable normative theory. The rearrangement argument is the smoking gun demonstrating the non-existence and the arbitrariness it introduces.
