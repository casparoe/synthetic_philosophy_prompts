  ### Connection to Gauthier's Minimax Relative Concession
  David Gauthier, in *Morals by Agreement*, proposes a principle of minimax relative concession for fair bargaining. The idea is that in a fair bargain, the maximum relative concession made by any individual should be minimized. 

  Relative concession for a player i is defined as:
    (ideal_i - u_i) / (ideal_i - d_i)

  Gauthier's solution is the point on the Pareto frontier that minimizes the maximum relative concession over the players.

  In our KSBS, we have for each player i: 
    (u_i - d_i) / (ideal_i - d_i) = λ   (the same for all i)

  This implies that the relative concession for player i is:
    1 - λ

  So the relative concession is the same for all players. Therefore, the maximum relative concession is that common value, and we choose λ to be as large as possible (to minimize the concession) subject to feasibility. This is exactly what KSBS does: it maximizes λ such that (d + λ*(ideal - d)) is in the feasible set? Not exactly, but we scale up from d in the direction of the ideal until we hit the boundary.

  In the KSBS, the relative concession for every player is the same, and it is the smallest possible such that the point is feasible. Therefore, it minimizes the maximum relative concession (which is that common value). So Gauthier's solution is equivalent to the KSBS.

  In our example:
    At NBS (1.818,0.545):
      Player 1: concession = (2-1.818)/(2-0) = 0.182/2 = 0.091.
      Player 2: concession = (1-0.545)/(1-0) = 0.455.
      The maximum concession is 0.455.

    At KSBS (1.333,0.666):
      Player 1: concession = (2-1.333)/2 = 0.667/2 = 0.3335.
      Player 2: concession = (1-0.666)/1 = 0.334.
      The maximum concession is about 0.334.

    We see that 0.334 < 0.455, so the KSBS has a lower maximum concession.

  The fairness intuition is that we care about the relative sacrifice each makes from their ideal. The KSBS ensures that both make the same relative sacrifice, which is seen as equitable.

  ### Summary
  - The NBS and KSBS can diverge when the feasible set is asymmetric and the ideal point is not symmetric in a way that matches the NBS product maximization.
  - The NBS satisfies IIA and may not change when the set expands in directions that are not chosen, while the KSBS satisfies individual monotonicity and will adjust to expansions that benefit one player by giving that player more.
  - Gauthier's minimax relative concession is equivalent to the KSBS and is motivated by fairness: it minimizes the maximum relative concession, and in the solution, all players have the same relative concession.

  In your resource arbitration, if you care about not letting any user feel they are making a disproportionately high concession relative to their potential, then KSBS might be more appropriate. However, if you want a solution that is invariant to the removal of irrelevant options (which might be easier to compute in some cases) and you are not as concerned with the relative sacrifices, then NBS is a good default.
