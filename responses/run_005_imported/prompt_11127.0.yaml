answer: |-
  Your question cuts to the heart of a crucial distinction in the standing-to-blame literature: **the difference between *losing the standing to blame* and *the accusation itself being substantively false*.** Your friend's argument represents a common but mistaken conflation of these concepts, which Wallace, Cohen, and most philosophers in this area explicitly reject. Here's the breakdown:

  1.  **Hypocrisy Undermines Standing, Not Substance:**
      *   **Wallace & Cohen's Core Argument:** A hypocrite forfeits their *standing* to blame because their own similar conduct demonstrates a lack of sincerity, commitment to the norm, or moral authority. Their blame becomes unfair, ineffective, or even manipulative. It loses its moral *force* as a communicative act.
      *   **What It Does *Not* Mean:** This forfeiture does *not* imply that the *substance* of their accusation (the claim that the *target's* conduct is wrong) is false. The wrongness of the target's act is logically independent of the blamer's own conduct. Wallace emphasizes that hypocrisy is a *personal failing of the blamer* concerning the act of blaming, not a revelation about the *objective moral status* of the act being blamed.

  2.  **The "Collapse" is Dialectical, Not Substantive:**
      *   You rightly identify that the accusation "collapses." However, this collapse is best understood as a **collapse of the *act of blaming* or the *dialectical force* of the accusation**, not the collapse of the *truth* of the claim that the target did something wrong.
      *   **Analogy:** Imagine a prosecutor who has committed the same crime they are prosecuting. Their hypocrisy makes them unfit to prosecute (they lack standing), and the case against the defendant might even be dismissed *because of the prosecutor's misconduct*. This dismissal doesn't mean the defendant is innocent; it means the *process* of holding them accountable was tainted. The defendant might still be guilty, and the crime might still be wrong. The hypocrisy discredits the *prosecutor*, not necessarily the *charge* against the defendant.

  3.  **Hypocrisy is *Not* Evidence the Accusation is Mistaken:**
      *   **Logical Fallacy:** Your friend commits the **ad hominem circumstantial fallacy** (attacking the person's circumstances/actions rather than the argument) and potentially the **moralistic fallacy** (confusing what *is* done with what *ought* to be done).
      *   **Why?** The council member's *personal behavior* (using offshore shells) tells us about *her* hypocrisy and *her* lack of commitment to the norm against tax avoidance. It tells us *nothing* about the *objective wrongness* of tax avoidance itself. Her actions might even *reinforce* the claim that tax avoidance is wrong by demonstrating how it allows people to evade responsibilities they demand of others!
      *   **Cohen's Point:** Western governments condemning terrorism while engaging in acts causing massive civilian casualties lose the *moral authority* to condemn. Their condemnation rings hollow and is hypocritical. This does *not* mean terrorism is suddenly permissible or that the Western governments' condemnation *misidentifies* terrorism as wrong. It means their *act of condemnation* is undermined by their own failure to live by the relevant norms.

  4.  **Pointing Out Hypocrisy: Legitimate Rebuttal of Standing, Not Substance:**
      *   **Yes, it's legitimate to rebut the *standing*:** Pointing out hypocrisy is a powerful and legitimate way to say: "*You* have no moral right to make this accusation *given your own conduct*. Your blame is unfair and hypocritical. Therefore, *your specific act of blaming* lacks force and can be dismissed *as an illegitimate act of blame*." This silences *that particular blamer*, not the underlying norm.
      *   **No, it's *not* a legitimate rebuttal of the *substance*:** To rebut the substance ("Tax avoidance isn't wrong" or "Terrorism is sometimes justified"), you must engage with the *reasons why* the conduct is claimed to be wrong. Does tax avoidance violate fairness, harm public services, create an uneven playing field? Is terrorism inherently wrong because it targets innocents? Pointing to the accuser's hypocrisy does *nothing* to address these arguments. It's a deflection.

  **Applying this to the City Council Member:**

  1.  **Loss of Standing:** Her offshore dealings completely undermine her standing to blame corporations for tax avoidance. Her blame is hypocritical and lacks moral authority. She should resign or be removed from any role overseeing taxation. Her *act* of blaming corporations collapses as legitimate.
  2.  **Substance of the Accusation:** Whether corporate tax avoidance is *wrong* remains a separate question. The *reasons* she gave (or others give) – that it starves public services, shifts burdens unfairly, exploits loopholes against the spirit of the law – are unaffected by her hypocrisy. Her actions might even be taken as *evidence* of how tempting and harmful such avoidance is! To argue corporate avoidance *isn't* wrong, one must engage with those substantive reasons, not just point at her hypocrisy.

  **Conclusion:**

  The standing-to-blame literature (Wallace, Cohen) provides **strong support for the claim that hypocrisy *undermines the blamer's standing* and renders *their specific act of blaming* illegitimate or ineffective.** It **does not support** the claim that hypocrisy provides evidence that the *underlying accusation (the claim that the target's conduct is wrong) is mistaken*. Pointing out hypocrisy is a legitimate way to **discredit the critic *as a legitimate blamer* and dismiss *their specific act of accusation***. It is **not** a legitimate way to **rebut the substance of the moral claim** they were making about the target's conduct. Treating hypocrisy as evidence the accusation was mistaken is a fundamental category error, confusing the blamer's flawed character with the objective status of the norm or the target's conduct. Your seminar's readings offer powerful tools to resist this conflation.
