  Hmm, the key here is Nietzsche's radical individualism. His dietary rules weren't universal prescriptions but discoveries about what served his particular physiology and creative output. When he says "coffee makes one gloomy," he means it makes him gloomy. This contrasts sharply with Johnson's approach of seeking one optimal protocol for all humans based on biomarkers.

  I should emphasize how Nietzsche would despise the anti-death obsession. His amor fati is about embracing life's totality, including suffering and death - the opposite of Johnson's "Don't Die" slogan. But it's not that simple, because Nietzsche did care intensely about health as a means to higher creativity. 

