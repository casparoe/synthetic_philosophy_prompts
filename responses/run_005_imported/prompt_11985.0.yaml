prompt: |-
  I'm a backend engineer at a mid-size tech company, and a few months back I got talked into joining a small employee-elected panel that has to sign off before HR and Legal can actually finalize any for-cause termination -- basically a peer sanity check so a manager cant just fire someone they dont like. I figured this would mostly be rubber-stamping obvious stuff, but my first real case is way messier than the onboarding deck made it sound, and I don't have any philosophy background to fall back on here, just a nagging feeling that both sides of our panel are being too quick to call this an easy case.

  Here's the situation: one of our trust-and-safety engineers, Dana, came across internal contract docs (a shared-drive permission was broader than it should've been) showing that a feature pitched to her team as "spam and bot detection" for a foreign-government client was actually meant to de-anonymize accounts flagged for political content. She raised it with her manager, then the ethics hotline, then a skip-level, over about two months, and kept getting told the deal was already signed and there was nothing left to discuss. So she posted a long message in our engineering-wide Slack channel laying out exactly which lines of our published values statement the project crossed, said she personally wouldn't write the integration, offered to hand her piece off to anyone willing to take it, and said flat out that she knew this could get her fired and wasn't hiding what she'd done. A few people screenshotted it and passed it into channels way outside engineering, including one the deal team was in, so HR's termination now cites both insubordination and a confidentiality violation, since the deal was technically still pre-signature. In her written appeal, Dana doesn't contest a single fact -- she just calls the whole thing "civil disobedience" and says she's only appealing the punishment, not the story. I looked that phrase up and got a bunch of stuff about Thoreau and MLK that doesn't obviously map onto "declined to write one integration and posted about it on Slack," so now I trust my own read on this even less.

  The panel's split down the middle and I have to bring a recommendation memo to Tuesday's meeting. Half of us think this is ordinary rule-breaking with a flattering label stuck on it -- the company isn't a government, nobody signed up for any civic duty toward it, and unlike a citizen stuck with their state, Dana could've just quit and said whatever she wanted on her way out. The other half thinks she hit basically every mark you'd want from someone trying to dissent responsibly -- exhausted the internal channels first, was completely open about what she was doing and why, hurt no one, and isn't even contesting the consequences -- and that firing her anyway makes the "we welcome employees who raise concerns" line in our handbook read like a joke. Can you draft the memo I should actually bring? I need an actual recommendation -- uphold the termination, overturn it, or downgrade it to something like a formal warning -- not a "both sides have a point" shrug, and whichever way it comes down, it has to seriously engage with the strongest version of the argument on the other side, not just wave at it. If you think there's a general rule worth writing down for the next person who tries something like this, throw that in too.
reasoning: |-
  Okay, let me unpack this complex termination review case. The backend engineer serving on this peer review panel is facing a genuine ethical dilemma that goes beyond typical HR procedures. 

  The core tension seems to be between:
  - Dana's claim of ethical dissent (exhausting channels, transparency, accepting consequences)
  - Company's position on confidentiality breach and insubordination

  Hmm, the Thoreau/MLK references in Dana's appeal are interesting but potentially misleading - civil disobedience against corporations operates in a very different context than against governments. The key question is whether her actions meet the threshold for protected ethical escalation.

  Important details standing out:
  1. Permission issue wasn't accidental - she discovered misleading project labeling
  2. Escalation path was thorough (manager → ethics hotline → skip-level)
  3. Slack post was targeted (engineering channels) but got distributed
  4. Deal status is crucial ("pre-signature" confidentiality claim)

  The panel's split reflects fundamental questions about corporate ethics:
  Can whistleblowing ever justify policy violations? 
  Does "exhausting channels" matter if channels are ineffective?
  How should companies handle principled dissent?

  I recall similar cases from tech ethics literature - the key differentiators are usually:
  - Proportionality of response (was Slack post excessive?)
  - Evidence of bad faith (did she try to hide actions?)
  - Actual harm caused (beyond embarrassment)

  Noticing Dana's approach hits several "responsible dissent" markers:
  ✓ Specific allegation with evidence 
  ✓ Internal first (2 months!)
  ✓ Targeted audience (initially)
  ✓ Acceptance of consequences

  But counterarguments hold weight too:
  - Non-government entity (resignation was option)
  - Confidentiality breach (even if unintentional)
  - Managerial authority challenge

  The memo needs to resolve this tension while setting precedent. Downgrading to formal warning might actually serve the company better - firing could trigger worse PR if screenshots leak externally. 

  Biggest risk: appearing to punish ethical concerns. The handbook's "welcome employees who raise concerns" line becomes ironic if they fire someone who did exactly that through proper channels until blocked.

  For the recommendation, the path forward should:
  1. Acknowledge valid confidentiality breach
  2. Distinguish from malicious leaks
  3. Highlight systemic failure (channels ignored her)
  4. Preserve dissent pathway without encouraging Slack mutinies

  The "general rule" section will be crucial - next time someone discovers misleading projects, there should be a clear escalation path that doesn't end at "deal is signed."
answer: |-
  Here's a recommendation memo that directly engages with both arguments while providing a clear, principled decision path. It includes a framework for future cases:

  ---

  **MEMORANDUM**  
  **To:** Termination Review Panel  
  **From:** [Your Name], Backend Engineering  
  **Date:** [Date]  
  **Subject:** Recommendation Regarding Dana [Last Name] Termination Case (Employee ID: [ID])  

  ### I. Core Facts (Undisputed)  
  1. Dana discovered misaligned project objectives due to a permissions error.  
  2. She escalated through 3 internal channels over 2 months (manager → ethics hotline → skip-level), receiving no substantive engagement.  
  3. Her Slack post:  
     - Cited specific company values violations  
     - Refused personal participation  
     - Offered work handoff  
     - Explicitly acknowledged termination risk  
  4. Confidentiality breach occurred when others shared her message beyond Engineering.  
  5. The deal was pre-signature but contractually active (per Legal).  

  ### II. Arguments Engaged  

  **A. Case for Upholding Termination (Insubordination + Confidentiality Violation):**  
  *Strongest version:* Companies aren’t democracies. Dana violated clear policies after alternatives existed:  
  - She could have resigned and spoken publicly without breaching confidentiality.  
  - Internal escalation failure doesn’t justify public-ish Slack exposure, especially when the deal team saw it.  
  - Permitting this sets precedent that employees may unilaterally "go public" internally when dissatisfied with leadership decisions.  

  **B. Case Against Termination (Ethical Dissent):**  
  *Strongest version:* Dana executed textbook responsible dissent:  
  1. **Exhausted channels** before escalating  
  2. **Targeted minimally:** Posted only in Engineering Slack (relevant stakeholders)  
  3. **Transparent:** No anonymity, accepted consequences  
  4. **Proportional:** Refused only her own work, didn’t sabotage  
  5. **Allegation substantiated:** Project *did* violate published company values.  
  Firing her signals that ethics channels are performative and "values" are unenforceable.  

  ### III. Recommendation: **OVERTURN TERMINATION. Issue Formal Final Warning.**  

  #### Rationale:  
  1. **The Slack post wasn’t "insubordination" but constrained escalation:**  
     - She refused *only* her own participation (not directing others).  
     - The audience (Engineering) was directly relevant to her technical objection.  
     - **Critical distinction:** This wasn’t a broad "whistleblowing" leak but a targeted appeal to peers after leadership ignored documented ethics concerns.  

  2. **Confidentiality breach was indirect and unintentional:**  
     - Dana posted only in a work-appropriate channel. Others disseminated it.  
     - Punishing *her* for others’ actions is unreasonable (though the post’s content risk remains).  

  3. **Systemic failure outweighs individual violation:**  
     - 3 internal channels failed to engage with her ethics complaint. This panel exists precisely to check such failures.  
     - Terminating her converts leadership’s inaction into employee liability.  

  4. **Proportionality demands a lesser sanction:**  
     - A **Final Warning** acknowledges policy breaches (confidentiality, unapproved communication) while recognizing mitigating factors:  
       - Good faith attempt to resolve ethically  
       - No malicious intent or personal gain  
       - Restricted scope of disclosure  

  ### IV. Proposed Path Forward  
  1. **For Dana:**  
     - Formal final warning for confidentiality violation (despite indirect dissemination).  
     - Mandatory ethics/compliance training (focus: approved escalation paths).  
     - Removal from the client project.  

  2. **For Leadership:**  
     - Review why 3 escalation channels failed to address a values-based concern.  
     - Clarify Slack communication policies: What channels are appropriate for ethics objections?  
     - Audit permissions for contract documents (the root cause).  

  ### V. General Rule for Future Cases ("The Dana Test")  
  When evaluating ethics-based policy violations, uphold termination **only** if *all* these are true:  
  ```plaintext
  1. The employee DID NOT exhaust all documented internal reporting channels first;  
  2. AND the disclosure WAS indiscriminate (e.g., external, company-wide, or irrelevant teams);  
  3. AND the employee DID NOT clearly tie their actions to specific company values/policies;  
  4. OR the action caused demonstrable, material harm beyond reputational risk.  
  ```  
  **In this case:** Conditions 1, 2, and 4 were NOT met. Condition 3 WAS met.  

  ---

  ### Why This Recommendation?  
  - **Avoids "rubber stamp" failure:** This panel’s purpose is to scrutinize HR/Legal recommendations when ethics are invoked. Upholding termination here makes dissent functionally impossible.  
  - **Protects the company:** Firing Dana risks:  
    - External whistleblowing (she now has little to lose)  
    - Erosion of engineer trust in ethics processes  
    - "Values-washing" reputation damage if details leak  
  - **Enforces accountability:** Leadership must fix broken escalation paths. Dana is disciplined (not rewarded) for policy breaches.  
  - **Precedent set:** Employees must use channels first, but leaders must respond. Public-ish appeals are last resorts with consequences.  

  This balances policy enforcement with ethical responsibility. Rejecting termination isn’t endorsing her methods—it’s acknowledging systemic failure while penalizing procedural breaches proportionally.  

  --- 

  **Final note:** Bring this memo with two addendums:  
  1. A *redacted* copy of Dana’s appeal highlighting her acknowledgment of consequences.  
  2. The handbook’s "raise concerns" policy and values statement she cited.  
  This forces the panel to confront the misalignment between her documented ethics claim and leadership’s inaction.
