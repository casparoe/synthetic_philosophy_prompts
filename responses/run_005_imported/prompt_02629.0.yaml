  For the first point: the planetary analogy is absolutely borrowing causal language while denying causality to thoughts. Frege’s struggle is real—how do minds "grasp" non-physical, non-mental entities? He never resolved it, and the analogy unintentionally highlights that gap. The user’s character could exploit this in a debate.  

  For the political angle: it’s complicated. On one hand, Frege’s metaphysics *is* technical and meant to solve problems in logic/math. Many philosophers (like Plato!) separate truth from human opinion without turning reactionary. On the other hand, his later writings show a mind allergic to subjectivity and collective decision-making, which *rhymes* with the third realm’s independence from minds. The user isn’t wrong to sense a temperamental echo, but claiming a *direct* link would be overreach.  

