answer: |-
  You've hit on one of the most contentious debates in contemporary metaphysics, and your uncle's certainty is philosophically unwarranted. Let's build the strongest possible Beebee/Dowe-style case against his claim, dissecting why "your not calling" isn't a genuine *cause* of the extended time on the floor, even if counterfactual dependence holds. The core argument rests on **two pillars: the nature of causation itself (Dowe) and the role of normative salience in selecting omissions (Beebee).**

  ### Pillar 1: Dowe's Physical Process Theory - "No Omissions in the Causal Nexus"
  *(Focus: What causation fundamentally IS)*

  1.  **Causation Requires Actual Physical Connection:** Dowe (following Salmon) argues that genuine causation involves the *transfer or exchange of a conserved physical quantity* (like energy, momentum, charge) between events across a spatiotemporally continuous process. A cause must *produce* or *propagate* the effect through such a process.
  2.  **Omissions are Absences, Not Events:** "Your not calling" isn't a positive event occurring in the world; it's the *absence* of an event (the phone call). Absences lack physical properties. They don't occupy spacetime points, have mass, energy, or momentum. They are *nothing*.
  3.  **No Physical Connection = No Causation:** Because "not calling" is an absence, it cannot *transfer* any conserved quantity to the situation in your grandma's apartment. There's no spatiotemporally continuous process linking your *lack of action* thousands of miles away to her *continued state* on the floor. The physical causes sustaining her state on the floor were things like gravity, the rigidity of the floor, the failure of her muscles to function correctly after the fall, the lack of someone *physically present* to help her up. These involve actual physical processes and transfers.
  4.  **Counterfactual Dependence ≠ Causation:** Dowe concedes that *if* you had called, it *would* have led to her being found sooner (counterfactual dependence). However, he argues this dependence is a *consequence* of the *actual causal processes* that *were* present, not proof that the omission *was* a cause itself. The dependence arises because your call *would have initiated* a new physical process (sound waves, phone network signals, your aunt's physical movement) that *would have interrupted* the existing physical process keeping her on the floor. The dependence is real, but it doesn't make the *absence* of the call a *cause*; it shows how a *different positive event* (a call) *could have been* a cause that *prevented* the outcome. The *actual* cause of the *duration* was the complex of physical processes that *were* occurring uninterrupted.

  **Dowe's Conclusion:** The *genuine causes* of Grandma being on the floor for 14 hours are the positive physical events and processes that occurred during that time and the absence of any *positive intervention* (like someone physically helping her). "Your not calling" is not part of this causal web. At best, it's a condition that allowed the actual causes to operate uninterrupted – a *causal condition* or *quasi-cause*, fundamentally different from an actual producing cause.

  ### Pillar 2: Beebee's Normative Salience - "Why Pick *Your* Omission?"
  *(Focus: Why we *label* certain omissions as "causes" even if they aren't)*

  1.  **The Problem of Proliferation:** As you noted, there are *infinitely many* omissions that counterfactually depend on the outcome: The neighbor didn't check, the mail carrier didn't notice, the building manager didn't do a wellness visit, *you* didn't call, *I* didn't call (even though I don't know her!), the President didn't divert Air Force One to check on her... The list is endless. *All* of these omissions satisfy the counterfactual "If X had happened, she would have been found sooner."
  2.  **Metaphysical Parity:** If causation by omission were a real feature of the world (like Lewis suggests), *all* these omissions should be equally genuine causes of the extended duration. The world's causal structure wouldn't distinguish between them. They all share the same counterfactual relationship.
  3.  **Selective Salience:** We *don't* treat all these omissions equally. We single out *your* omission as "the cause" (or a primary cause). Why? Beebee argues this selection isn't driven by discovering a unique *causal fact* in the world. Instead, it's driven entirely by **normative expectations and context**:
      *   **Expectation:** You had an established, reliable pattern of calling daily. This created a strong normative expectation *that you would call*. Your uncle, your grandma, and likely you yourself held this expectation.
      *   **Responsibility/Competence:** You were perceived (and perceived yourself) as having a specific role or responsibility regarding your grandma's well-being through this regular contact.
      *   **Salience:** Against the background of this norm, *your* omission becomes glaringly salient. It's the deviation from the expected pattern. The neighbor's lack of check, or mine, isn't salient because there was no established norm or expectation for *us* to act.
  4.  **The Normative Driver:** The pull to call *your* omission "the cause" isn't tracking an objective causal difference between your omission and the mail carrier's. It's tracking the *violation of a norm*. Your uncle is (understandably) angry and distressed. His statement "if you'd called like you always do, none of this happens" highlights the *broken norm* ("like you always do") as much as the counterfactual dependence. The *metaphysical work* of causing the duration was done by the actual physical processes; the *labeling* of *your omission* as "the cause" is a social/normative judgment about *who failed in their expected role*.

  **Beebee's Conclusion:** While counterfactual dependence exists, singling out *your* omission as "the cause" of the extended duration isn't justified by the causal structure of the world itself. It's a function of the normative context – the specific expectations, responsibilities, and patterns of behavior surrounding *you* and your grandma. The cause *in the world* was the complex of physical events during those 14 hours; the *responsibility* for *not preventing it* falls particularly on you *because* of your established role, not because your omission was a metaphysical cause in a way the neighbor's wasn't.

  ### Synthesizing Beebee & Dowe Against Your Uncle

  1.  **No Physical Cause:** There is no spatiotemporally continuous physical process linking the *absence* of your phone call to the *continuation* of Grandma's state on the floor. The causes were the actual physical forces and processes at play *in the apartment* during those hours (Dowe).
  2.  **Infinite Equally "Causal" Omissions:** Metaphysically, your omission is on par with infinitely many others (neighbor, mail carrier, etc.). All exhibit the same counterfactual dependence. The world doesn't mark yours as special (Beebee).
  3.  **Salience is Normative, Not Causal:** Your uncle singles out *your* omission *only* because of the violated norm and expectation ("you always call"). If you'd never called her before, he wouldn't blame you. This shows the judgment is about responsibility and expectation, not about discovering a unique causal relation (Beebee).
  4.  **Confusing Prevention with Causation:** Your call *would have prevented* the long duration by *initiating a new causal chain*. But the *failure to prevent* is not the same as *causing*. The *actual causing* was done by the events that *positively sustained* her situation (Dowe). Your uncle is conflating *causal responsibility* (which involves norms and expectations) with *metaphysical causation* (which involves physical processes).
  5.  **The Kidney Damage:** The *proximate physical causes* of the kidney damage were the physiological processes resulting from prolonged immobility and potential dehydration/rhadomyolysis *during the 14 hours*. Your omission didn't *cause* the kidney damage; the lack of timely intervention allowed the *actual physical causes* present during the fall and its aftermath to produce that damage.

  **The Verdict on Your Uncle's Metaphysics:** **No, your uncle does not have the metaphysics on his side.** He is absolutely correct about the *counterfactual dependence* (if you'd called, she'd have been found sooner). He is likely correct about *moral responsibility* or *blameworthiness* given the established expectation and your role (a separate, important, but non-metaphysical issue). However, he is **confusing** this normative responsibility and counterfactual dependence with genuine *causation*.

  **Lewis bites the bullet and says "Yes, omissions cause." Beebee and Dowe provide powerful arguments showing why that bullet is both metaphysically dubious (Dowe) and practically incoherent without smuggling in norms (Beebee).** The pull your uncle feels to call *your omission* "the cause" is primarily the pull of the violated norm and expectation, not a sober assessment of the causal structure of the universe. The metaphysics of causation, rigorously examined, does not support his "full stop" conclusion.
