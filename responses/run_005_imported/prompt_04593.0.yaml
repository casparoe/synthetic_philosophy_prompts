prompt: |-
  So this happened at my giving circle a couple weeks ago and its been bugging me ever since. It's just me and two friends, Mara and Theo, from the local ACX meetup -- we pool around $8k a year and pick one small, under-the-radar org to fund. Our rule has always been that we only fund something if it clears two bars: it's neglected (nobody bigger is already covering the gap) and tractable (there's an actual theory of change, not just vibes). This round we were deciding on a scrappy little biosecurity policy shop. I thought it was both neglected and tractable, so I voted fund. Mara thought it was neglected but not tractable, so she voted against. Theo thought it was tractable but not neglected (he'd heard Open Phil was quietly already sniffing around something adjacent), so he voted against too.

  Here's the part that's been rattling around in my skull since. Two of the three of us voted "don't fund" on the bottom line, so a straight majority vote says no. But when I tallied us up criterion by criterion instead, a majority (me + Mara) said yes on neglected, and a seperate majority (me + Theo) said yes on tractable -- and neglected-and-tractable is literally our funding rule! So depending on whether we vote on each criterion and then apply the rule, or just vote on the rule's output directly, we get opposite answers, from the exact same three people holding the exact same underlying beliefs. Nobody changed their mind about anything in between the two tallies.

  It feels like it's got to be some cousin of Arrow's theorem or a Condorcet cycle, but nobody's preferences are even cyclic here, so I don't think that's quite it, and googling a few different phrasings got me nowhere, which almost never happens to me. Does this phenomenon have a name? More importantly, is there a principled reason one of the two tallying methods deserves to win, or have we just discovered that "majority rules" doesn't actually pin down a well-defined procedure once you're voting on more than one connected question at a time? Would love an actual steelman for either side before we just default to whichever one Theo prefers, since he's buying drinks next time.
reasoning: |-
  Okay, let me try to figure out what's going on here. The user is part of a giving circle with two friends, Mara and Theo. They pool money to fund under-the-radar orgs based on two criteria: neglected and tractable. In this case, they voted on a biosecurity policy shop. The user thought it met both criteria, Mara thought neglected but not tractable, and Theo thought tractable but not neglected. 

  When they took a straight majority vote on whether to fund, it was 1 for and 2 against, so no funding. But when they tallied each criterion separately, a majority said yes to neglected (user and Mara) and yes to tractable (user and Theo). So by the criteria, it should be funded. The user is confused because the same people with the same opinions led to opposite outcomes based on how the vote was structured.

  This seems like a voting paradox. I recall Arrow's Theorem, which deals with aggregating individual preferences into a group decision. But here, the preferences aren't cyclic. Maybe it's related to the discursive dilemma or the doctrinal paradox. In that scenario, voting on premises separately can lead to a different outcome than voting on the conclusion directly. That sounds exactly like what happened here.

  The user wants to know if this has a name and which method is more principled. They also seem concerned about fairness and consistency in their decision-making process. Beyond the technical answer, they might be worried about future votes and how to avoid similar confusion. They mentioned Theo buying drinks next time, so maintaining group harmony is probably important too.

  I should explain the doctrinal paradox clearly. It occurs when a group decision depends on whether you vote on the premises or the conclusion. In this case, the premises are the two criteria, and the conclusion is the funding decision. The majority on premises leads to fund, but majority on conclusion leads to don't fund. 

  As for which method is better, it depends on the group's goals. If they prioritize each criterion independently, then voting on premises makes sense. But if they view the overall funding decision as holistic, then the conclusion vote might be better. There's no one-size-fits-all answer, so they need to decide as a group which approach aligns with their values. 

  The user also needs reassurance that this is a known issue, not a flaw in their group. Highlighting that it's a formal paradox might help them feel better. Plus, suggesting they clarify their voting procedure for future decisions could prevent similar issues. Maybe using a Borda count or another voting system, but that might be overcomplicating it. 

  Underlying all this, the user might want their group to make fair, consistent decisions without resentment. Ensuring that everyone understands why the paradox happens and agreeing on a method moving forward is key. Theo's preference shouldn't be the default just because he's buying drinks; they should have a principled agreement.
answer: |-
  This is a brilliant real-world example of the **doctrinal paradox** (sometimes called the **discursive dilemma**). It's a fundamental issue in judgment aggregation, showing how voting on individual premises (your criteria) can lead to a different outcome than voting directly on the conclusion (the funding decision), *even when everyone's individual logic is perfectly consistent* and there are no preference cycles.

  **Why it's the Doctrinal Paradox:**

  1.  **The Doctrine/Rule:** "Fund if and only if Neglected AND Tractable." (N ∧ T)
  2.  **Individual Judgments:**
      *   **You:** N = True, T = True → Conclusion: Fund = True
      *   **Mara:** N = True, T = False → Conclusion: Fund = False
      *   **Theo:** N = False, T = True → Conclusion: Fund = False
  3.  **Aggregating the Conclusion (Majority Vote):**
      *   Fund: 1 (You) vs. Don't Fund: 2 (Mara, Theo) → **Don't Fund**
  4.  **Aggregating the Premises (Majority Vote):**
      *   Neglected: True (You, Mara) vs. False (Theo) → **N = True**
      *   Tractable: True (You, Theo) vs. False (Mara) → **T = True**
      *   Apply Doctrine (N ∧ T): True ∧ True → **Fund**

  **The Paradox:** The *same* set of individual judgments leads to **opposite collective conclusions** depending on whether you vote on the premises or the conclusion.

  **Why it Happens (The Steelman Arguments):**

  The crux is that "majority rule" doesn't specify *what* you're taking a majority vote *on*. Both methods seem reasonable, but they embody different principles:

  *   **Steelman for Voting on the Conclusion (Fund/Don't Fund Directly):**
      *   **Principle:** **Holistic Judgment.** Each member is best positioned to weigh the *interaction* of the criteria for *this specific case*. They bring their nuanced understanding of how "neglected" and "tractable" interplay for this biosecurity shop.
      *   **Argument:** Mara and Theo, despite disagreeing on *why*, both concluded funding wasn't warranted based on their overall assessment. A majority (2/3) had reservations strong enough to vote against funding. Forcing funding based on disaggregated criteria overrides the holistic judgment of the majority.
      *   **Analogy:** A jury voting "guilty" or "not guilty" directly, rather than voting separately on each element of the crime and then applying the law mechanically. Jurors might agree on individual facts but disagree on the overall conclusion due to reasonable doubt or interpretation.
      *   **Strength:** Respects each member's final, synthesized opinion on the *actual decision*.

  *   **Steelman for Voting on the Premises (Criteria) and Applying the Rule:**
      *   **Principle:** **Rule-Based Consistency & Shared Standards.** The group agreed *in advance* on a clear, logical rule (N ∧ T). This rule defines what funding *means*. Voting on the criteria ensures the group decision faithfully applies this pre-committed standard.
      *   **Argument:** The group explicitly defined funding as requiring *both* N and T. A majority affirmed N is true. A (different) majority affirmed T is true. Therefore, logically, N ∧ T is true, and funding should proceed. Ignoring this because the majorities for N and T aren't identical *overlooks the fact that the rule is satisfied by the collective judgment on its components*.
      *   **Analogy:** A scientific committee defining a discovery as requiring Evidence A *and* Evidence B. If a majority affirms A exists and a majority affirms B exists, the discovery criteria are met, even if some members doubt A *or* B (but not both).
      *   **Strength:** Ensures decisions strictly adhere to the group's predefined, shared definition of what merits funding. Prevents the *reason* for an individual's "no" vote (disagreeing on only one premise) from blocking funding when the group collectively affirms both premises.

  **Which One "Deserves to Win"? There's No Universal Answer.**

  *   **It depends on what the group values more:**
      *   If you value **individual holistic judgment** and final voting power on the *outcome*, vote on the **conclusion**.
      *   If you value **strict adherence to pre-defined logical rules** and collective affirmation of each *standard*, vote on the **premises** and apply the rule.
  *   **Your group's context matters:**
      *   The "neglected and tractable" rule seems like a core, pre-agreed *definition* of what you fund. This leans towards the premise-based approach.
      *   However, Mara and Theo might argue their "no" votes reflect nuanced judgments about *how* N and T interact for *this specific case* (e.g., "It's neglected *because* it's intractable," or "It's only tractable *if* someone bigger isn't already involved"), which the premise-based vote ignores. This leans towards the conclusion-based vote.

  **Recommendation for Your Giving Circle:**

  1.  **Acknowledge the Paradox:** Explain the doctrinal paradox to Mara and Theo. It's a real thing, not a mistake or trick! This depersonalizes the issue.
  2.  **Decide on a *Procedural* Rule *Now*, for the *Future*:** Don't decide based on *this specific case*. Decide *how* you want to aggregate judgments *going forward*. Have a discussion (maybe over those drinks Theo's buying!) about which principle resonates more with your group's philosophy:
      *   "Should our final vote always be on Fund/Don't Fund directly (respecting holistic judgment), even if it sometimes contradicts the criteria tallies?"
      *   "Or should we always vote on Neglected and Tractable separately and fund only if *both* get majority 'yes' (ensuring strict rule adherence), even if a majority then votes 'no' on funding?"
  3.  **Formalize the Voting Procedure:** Whichever method you choose, write it down as part of your operating rules. Consistency is key to avoiding this confusion in the future.
  4.  **(For This Case):** Since you didn't have a rule, and both methods have merit, defaulting to the conclusion-based vote (the direct majority "no") is a common practical resolution. Theo buying drinks is a nice bonus! Alternatively, you could revisit the discussion with the paradox explained and see if anyone wants to reconsider their vote now that the inconsistency is clear.

  **In summary:** You've hit the doctrinal paradox square on. It highlights that "majority rule" isn't a single procedure when decisions involve multiple connected premises. There's no single "correct" answer; the principled choice depends on whether your group prioritizes holistic member judgment or strict adherence to predefined logical rules. Decide on your aggregation method *procedurally* for the future to avoid this headache next time!
