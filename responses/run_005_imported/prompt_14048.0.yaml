prompt: |-
  Quick context: I'm a bioethics PhD student (my dissertation's on rival theories of health and disease, Boorse vs. Wakefield type stuff), and through a weird chain of events that apparently makes me the "philosophy person" on my hospital system's medical policy appeals committee now (mostly clinicians plus one admin, don't ask). We've got a genuinely hard case on the docket for Thursday. A patient in her mid-fifties, thirteen months out from her husband's death, was diagnosed by her treating psychologist with Prolonged Grief Disorder per DSM-5-TR -- persistent intense yearning for him, identity disruption, feeling like life is meaningless, the whole symptom cluster -- and has been in weekly grief-focused therapy ever since. Utilization review just denied coverage past session 20, and the medical director's written rationale (he's an internist, not a psychiatrist, which is its own separate issue) basically boils down to: nothing is actually malfunctioning here, her memory, cognition and day-to-day functioning are all intact, she is just very sad about her husband for a very long time, and being sad that long isnt a broken mechanism, it's just how much she loved him. The psychologist's appeal letter says that's beside the point -- she's suffering severely and impaired regardless of whether you can point to some broken internal process, and demanding a "dysfunction" before you'll treat misery is itself a substantive philosophical position dressed up as neutral clinical judgment.

  I have to actually draft the committee's decision memo before Thursday and keep flip-flopping. The medical director's "no dysfunction, no disorder" line is basically the biostatistical theory smuggled in as if it were just obvious medical fact, but the psychologist's "suffering alone is enough" line proves too much too, since it would seem to make almost any sufficiently intense unwanted emotion into a billable disorder -- and honestly this whole fight feels like the DSM-5 bereavement-exclusion mess all over again, just with extra steps. Could you draft the actual memo I'd bring into that room? I need a real reccomendation -- approve, deny, or approve-with-conditions plus a concrete time frame for re-evaluation -- not a lit review on philosophy of medicine, and it needs to genuinely engage with why the medical director's standard is doing real work here rather than just steamrolling him with "but she's suffering, isn't that obviously enough."
