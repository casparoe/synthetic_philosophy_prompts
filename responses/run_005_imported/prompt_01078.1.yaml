  For Alex's response to Fehr and Gächter: Use the idea that subjects punish to enforce norms they value, seeing it as a preference for fairness or reciprocity. They pay to punish because they derive utility from upholding the norm, not for future benefits. This fits rational-choice if preferences include social norms.

