  Alex might push back, saying expectations and preferences explain behavior, even emotions. Sam would stress that the phenomenology of blame involves more than utility—it's about perceived rights and duties.

  The dialogue should end with a clear divergence: Alex sees norms as equilibrium sustained by preferences, Sam sees them as grounded in evolved sentiments that create moral demands. Both understand the core disagreement is about whether normativity requires more than rational expectations and preferences.

  Key points to hit:
  - Alex explains costly punishment as preference for norm enforcement.
  - Sam argues this misses the moral dimension of blame.
  - Alex questions why evolution can't shape preferences.
