answer: |-
  ## The Lingering Debate at the Reading Group

  *(The fluorescent lights hum in the empty seminar room. Coffee cups litter the table. ALEX, late 20s, leans back, fingers steepled, radiating calm confidence in rational-choice machinery. SAM, slightly older, paces near the whiteboard, still animated, marker stains on their sleeve. They’re the last two left after a grueling session on Boyd & Richerson.)*

  **Sam:** (Gesturing emphatically at a scribbled note on the board) Alex, look, I grant you Lewis was brilliant dissolving the infinite regress for pure coordination. The ‘basis’ is elegant – a shared landmark everyone sees, indicating the regularity *and* the mutual awareness. Driving on the right? Perfect. But that’s *all* it gives you: a stable pattern everyone prefers *because* others follow it. Bicchieri adding the layer of normative expectations – “they expect compliance *and* might sanction deviation” – gets us sanctions, sure. But it *still* feels like it’s happening inside a hall of mirrors made of expectations and preferences! Where’s the *sting*? The *ought*? The Fehr and Gächter experiment is the wrecking ball for this whole edifice.

  **Alex:** (Leans forward, elbows on knees) Okay, let’s tackle Fehr-Gächter head-on, Sam. Because I think it fits *neatly* within an extended Lewis-Bicchieri framework, without needing mystical ‘moral sentiments’. Subjects pay to punish defectors in a one-shot anonymous game. Why? Because they hold a *norm* – “cooperate in public goods games” – sustained by precisely the expectations Bicchieri describes.

  **Sam:** But the *anger*, Alex! The data shows it’s anger driving the punishment, not cool calculation about future interactions or reputation. Their own words: “it’s unfair,” “they cheated us.” This isn’t “I prefer the coordination equilibrium of cooperation, and punishing maintains it.” It’s “You *owed* us cooperation, you bastard, and I’ll make you pay even if it costs me!”

  **Alex:** Exactly! And why do they feel it’s “owed”? Because of *normative expectations* embedded in their preferences. They *expect* cooperation (empirical expectation). They *expect* that others *expect* cooperation and approve of punishing defectors (normative expectation part one). Crucially, they *prefer* to conform to *this norm of punishing defectors* because they derive utility from upholding fairness itself, or from expressing their disapproval, or from the internal satisfaction of enforcing the cooperative equilibrium they value. The ‘cost’ is paid because the *preference* for norm-enforcement outweighs the preference for keeping the money. It’s still utility maximization, just with preferences that include upholding social norms as a terminal value.

  **Sam:** (Stops pacing, turns sharply) Ah, but here’s the rub, Alex. You’ve smuggled in the *normativity* by fiat, hiding it inside the ‘preference’. You say they “prefer to uphold fairness.” But *what is fairness* in this context? It’s *defined* by the norm they believe *ought* to be followed! The preference *presupposes* the normative belief; it doesn’t *explain* its origin or its distinctive force. Lewis’s “basis” for a driving convention is a physical fact or a decree. What’s the “basis” for the norm “cooperate in public goods games” that generates this specific, costly anger? Why isn’t *any* arbitrary regularity equally capable of generating this fervent, costly defense? Why this *particular* feeling of being *wronged*?

  **Alex:** The “basis” evolves! Boyd, Richerson, Henrich – they show how norms *stabilize* because groups with prosocial norms, enforced by punishment (even costly), outcompete others. The “basis” becomes the *shared cultural history* and *social learning* that indicates to everyone: “This is how we do things here; this is what’s expected; deviants *are* punished; and we all know this.” The feeling of being wronged? That’s the *internalized sanction* – the evolved psychological mechanism that makes norm-violation *painful* for the violator (guilt) and motivates others to punish (anger/indignation) precisely *because* it reliably supports the norm’s stability. It’s a preference-shaping mechanism honed by cultural group selection. The “ought” feeling *is* the subjective correlate of a highly adaptive preference structure. Gibbard’s expressivism gets at this – the anger *expresses* the acceptance of the norm, which is part of the coordination equilibrium of social life.

  **Sam:** (Sits down, leaning in intently) Now we’re getting to the heart of it. You’re saying the *sentiment* (the anger, the guilt) is just the *vehicle* for the preference that sustains the convention. The “ought” is reducible to “I/we strongly prefer this regularity and have mechanisms to enforce it.” But that’s precisely where I think Lewis’s apparatus hits a wall. Take the *phenomenology* of resentment. It’s not *just* “I prefer cooperation and you thwarted my preference.” It’s “You violated a rule that *applies* to you *as a member*, and in doing so, you *disrespected* me/us.” It has this *second-personal* character, as Darwall argues – it’s a demand *addressed* to the other, holding them accountable. The Fehr-Gächter punisher isn’t just maximizing utility based on a weird preference; they feel *entitled* to the cooperation and *entitled* to hold the defector to account. This sense of entitlement, of *rightful claim*, is what the infinite regress of expectations, even grounded in a cultural “basis,” fails to capture. It’s not just “I expect X and prefer it”; it’s “You *owe* me X *because* we share this norm.” The norm isn’t just a description of behavior; it *constitutes* the obligation.

  **Alex:** But Sam, doesn’t the Lewis-Bicchieri framework *explain* the emergence of that sense of entitlement? Once you have a stable norm sustained by mutual expectations of conformity *and* sanctioning, and it’s internalized, then *of course* a violation feels like a personal slight! It *is* a personal slight *within the terms of that normative system*. Your expectation of cooperation, based on the shared basis (culture, past interactions, group identity), is shattered. The “you owe me” feeling *is* the psychological representation of the normative expectation. It’s the feeling *attached* to the belief that others expect compliance and will sanction deviation. What more do you need? Why posit a separate, non-rational-choice “moral sentiment” when the complex interplay of expectations, preferences (including preferences for fairness and reciprocity, shaped by evolution), and internalized sanctions explains the behavior *and* the reported feelings?

  **Sam:** Because the rational-choice explanation, even extended with evolutionarily-shaped preferences, remains *contingent* and *hypothetical*. “I comply/sanction because I prefer the outcome of a cooperative society, and my preferences include punishing defectors.” The *distinctive* force of the “ought” in genuine normativity is *categorical*, not hypothetical. It presents itself as binding *regardless* of my contingent preferences at that moment. When I feel resentment, it’s not conditional on whether punishing *right now* maximizes my utility or even the group’s long-term utility; it feels like a *demand* that *must* be met, a *wrong* that *must* be addressed. The Fehr-Gächter subject paying to punish *despite* no future interaction captures this: they act *as if* the norm has authority *over* the defector, independent of the punisher’s immediate gain. Your model explains *why* such sentiments evolved and why they are *useful*, but it doesn’t capture the *internal experience* of being *bound* by the norm, of feeling its violation as a *wrong* done *to you*, not just a thwarted preference or a broken expectation. Boyd and Richerson’s models show *how* norms with sanctions spread; Trivers and Gibbard point to the *psychology* of it. But that psychology includes this irreducible sense of objective wrongness that the Lewisian regress-dissolving “basis” can’t ground. The “basis” for a moral norm isn’t just a shared fact; it’s a shared *acceptance* of the norm *as authoritative* – an acceptance that *includes* these reactive attitudes.

  **Alex:** (Sighs, rubs temples) So, the core disagreement boils down to this reducibility question. You see the phenomenology of resentment and the sense of categorical obligation as evidence of an *irreducible* normative layer – a layer of “genuine normativity” or “moral sentiment” that cannot be fully captured by the interplay of evolved preferences, empirical expectations, normative expectations (including sanctioning), and the psychological states they produce. The Lewisian machinery, even turbocharged by cultural evolution, only gets you to complex, preference-driven coordination with sanctions, but not to the “you *owed* me better” that feels like a demand of right.

  **Sam:** Precisely. And conversely, you see that phenomenology and sense of obligation as *fully explicable* – without residue – as the subjective experience of precisely that complex interplay: internalized normative expectations coupled with evolved preferences that include upholding fairness and punishing violators *as terminal goals*. The “categorical” feel is just the strength and depth of those internalized preferences and expectations. The “authority” of the norm is just its stability and the strength of the sanctions (internal and external) backing it. There’s no extra “moral sentiment” ingredient; it’s preferences and expectations all the way down, sculpted by evolution and culture.

  **Alex:** Exactly. So we agree on the machinery Lewis and Bicchieri provide for conventions and norm-enforcement via expectations and sanctions. We agree that evolution (biological and cultural) shapes the preferences and psychological mechanisms involved. The crux is whether the *distinctive phenomenology and self-understanding* associated with moral norms – the feeling of categorical obligation, the second-personal resentment, the sense of being *bound* – requires positing an additional, non-preference-based element (“moral sentiment” proper, irreducible normativity), or whether it’s exhaustively explained as the conscious manifestation of those evolved, expectation-tracking preference structures operating in a social context.

  **Sam:** (Nods slowly) That’s the fault line. You think the rational-choice framework, properly extended with evolutionary psychology and cultural theory, swallows the whole phenomenon. I think it leaves a crucial residue – the very thing that makes a *norm* feel like a *moral* demand rather than just a strong preference or a useful convention – and that residue points to the necessity of evolved moral sentiments *as a distinct psychological category*. The Fehr-Gächter anger isn't *just* a preference in action; it's the footprint of that sentiment.

  **Alex:** And the comeback is that calling it a "distinct category" is just naming the complex output of the machinery without adding explanatory power. The feeling *is* the preference-in-context.

  **Sam:** And I say the explanatory power is in capturing *why* that context feels so different from merely wanting chocolate ice cream. But yes, Alex. That’s precisely where we bottom out. (Glances at the clock) And now, I really do owe it to my cat to get home before she stages a rebellion. Same time next week for Gintis?

  **Alex:** (Stands, gathering papers) Wouldn’t miss it. Drive safe – stick to the *convention* of the right side, won’t you? No need for moral outrage tonight.

  **Sam:** (Smiling wryly) Only if you do your part. See you next week.

  *(They exit, turning off the lights, leaving the diagram of expectations and sanctions on the board, the question of the "sting" hanging unresolved in the dark.)*
