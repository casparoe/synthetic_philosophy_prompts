prompt: |-
  I teach a graduate seminar on social ontology, and this term we've spent several weeks on the metaphysics of acting together. Two of my strongest students have reached an impasse that I'd like an outside perspective on before we reconvene. One is committed to Michael Bratman's planning-theoretic account of shared intention, on which shared agency reduces without remainder to a structure of individual intentions: each party intends that they together perform the joint action, intends this at least partly because of the other's matching intention, and forms sub-plans that mesh with the other's, all of this being common knowledge between them. The other has been won over by Margaret Gilbert's plural subject theory, on which shared intention essentially involves joint commitment -- a normative bond that the parties jointly and openly enter into, and which cannot be reduced to any configuration, however intricate, of separate individual attitudes.

  Their disagreement crystallized around a case raised in seminar: two colleagues begin co-authoring a paper on the strength of an informal conversation, without either ever explicitly promising the other anything, yet each comes to feel -- once real work has gone into the project on the strength of the other's apparent participation -- that walking away unannounced would wrong the other collaborator, and not merely disappoint them. My Bratman-inclined student wants to say this sense of obligation can be captured by further individual-level attitudes (expectations, reasonable reliance, the rational pressure generated by one's own prior intentions) without abandoning an individualist framework; my Gilbertian student thinks the case shows precisely why a sui generis joint commitment needs to be posited.

  Could you write the response paper I've asked them to produce: a comparison of Bratman's and Gilbert's accounts of shared intention detailed enough that what actually divides them -- and not just their slogans -- becomes clear? I'd like you to take an explicit position on the co-authorship case: does Bratman's apparatus have the resources to explain the obligation the collaborators feel toward one another, or does Gilbert's appeal to joint commitment do genuine explanatory work that no amount of added individual psychology can replicate? Please defend a verdict rather than simply cataloguing considerations on each side.
reasoning: |-
  Okay, let me approach this systematically. The professor wants a comparative analysis of Bratman and Gilbert's theories applied to a co-authorship case, with a clear verdict on whether obligations arise from individual psychology or require joint commitment. 

  First, I need to unpack both theories at their fault lines. Bratman's planning theory is elegantly reductionist - shared intention as interlocking individual attitudes. Gilbert's plural subject theory is robustly non-reductionist - joint commitment creating normative bonds. The key tension lies in whether obligations in collaborations are emergent phenomena or reducible to individual expectations.

  The co-authorship case is perfect for testing this. Two colleagues organically start working together without explicit promises, yet develop mutual obligations. For Bratman, this could be explained through the web of interdependent intentions: each forms sub-plans relying on the other's continued participation, and walking away would violate the meshing sub-plans condition. The "wronging" feeling might stem from recognized reliance - I know you've invested time based on my actions.

  But Gilbert would counter that this misses the distinctive character of the obligation. In her view, the moment they openly embark on joint activity, a joint commitment forms through mutual recognition. This creates obligations directly to the other person (not just based on personal intentions) that can't be dissolved unilaterally. The "wrong" isn't just about wasted effort - it's about violating the bond itself.

  Where Bratman sees aggregated individual normativity, Gilbert sees emergent collective normativity. The case turns on whether we need that irreducible "jointness" to explain why collaborators feel accountable to each other specifically, rather than just regretting poor planning.

  Having taught this material, I know students often miss that Bratman does address obligations through mutual responsiveness - but Gilbert would argue his obligations remain fundamentally self-regarding (about my plans) rather than other-regarding (about our commitment). The co-authors likely feel the latter.

  My verdict leans Gilbert: the sense of being owed an explanation or justification seems to stem from the collaborative entity they've constituted, not just parallel individual psychologies. Bratman's machinery explains coordination beautifully but can't quite capture the distinctive normative glue. Still, I should acknowledge where Bratman comes close - his "interdependence" and "stability" conditions create powerful normative pressures.
answer: |-
  ## The Shared Intention Impasse: Bratman vs. Gilbert on Obligation in Co-Authorship

  Professor, thank you for the opportunity to dissect this crucial impasse. Your students have honed in on the fundamental rift between Bratman and Gilbert: **whether the normativity inherent in shared agency is reducible to individual attitudes and their interplay (Bratman) or requires a *sui generis* joint commitment that constitutes a new normative entity (Gilbert).** The co-authorship case is a potent test. After carefully analyzing both frameworks, I conclude that **Gilbert's account provides the more compelling explanation for the specific *obligation* the collaborators feel, while Bratman's apparatus excels at explaining coordination but falters on the distinct *normative bond*.**

  **1. Core Tenets: The Heart of the Divide**

  *   **Bratman's Planning Theory (Reductionist Individualism):**
      *   **Foundation:** Shared intention (SI) is a complex psychological state *distributed* across individuals. It consists of:
          *   **Interlocking Intentions:** Each intends *that we J* (perform the joint action).
          *   **Interdependence:** Each intends *that we J* in part *because* they believe the other also intends *that we J*.
          *   **Meshing Sub-Plans:** Each has sub-plans for contributing to *J* that are compatible (mesh) with the other's sub-plans (or are open to adjustment to achieve meshing).
          *   **Common Knowledge (CK):** All of the above is CK among the participants.
      *   **Normativity:** Obligations (or senses of obligation) arise *indirectly* from the *individual* attitudes and their rational pressures:
          *   **Individual Intentions:** My intention *that we J* commits *me* to my part. Abandoning it without reason involves a failure of my own rationality (intention stability).
          *   **Interdependence & Reliance:** Your intention (and actions based on it) create reasonable reliance. My awareness of your reliance, combined with my own intention and actions inviting it, generates a *pro tanto* moral reason not to let you down (a derivative obligation based on fairness or harm prevention). Walking away disappoints *because* it frustrates the expectations *I* helped create and *you* reasonably formed based on my attitudes/actions.
          *   **Coordination Costs:** Disrupting meshed sub-plans creates inefficiency and wasted effort, providing a practical reason against unilateral withdrawal.
      *   **"Shared" Nature:** SI is "shared" only in the sense of being a highly interdependent network of individual intentions and beliefs. There is no *irreducible* "we-intention" or group mind.

  *   **Gilbert's Plural Subject Theory (Non-Reductionist Collectivism):**
      *   **Foundation:** Shared intention (or "joint commitment to intend as a body") creates a **plural subject** – a new, irreducible social entity constituted by the joint commitment.
      *   **Joint Commitment (JC):** The core element. JC is:
          *   **Joint:** Formed *together* by two or more people through a process of mutual expression (often implicit, like beginning work together).
          *   **Open:** The expressions creating it must be out in the open (common knowledge is built-in).
          *   **Commitment:** Creates *obligations* *to the other parties* and *correlative rights* *against* them regarding the shared goal.
          *   **Normative Bond:** This obligation is *sui generis* – it arises *directly* from the JC itself, not from individual intentions or moral principles like promise-keeping. It's an obligation *to the co-committer(s)* to uphold the commitment.
          *   **Indissoluble Unilaterally:** A JC cannot be rescinded by one party alone; it requires the concurrence of the others (or their release).
      *   **Normativity:** The obligation felt is **direct and constitutive**.
          *   Walking away isn't just irrational (frustrating my own intention) or disappointing (frustrating your expectation); it's a **wronging** *because* it violates the normative bond *jointly created*. The collaborator has a *right* to your continued participation (or an explanation/negotiation for withdrawal) *by virtue of the JC itself*.
      *   **"Shared" Nature:** SI is genuinely shared because the *commitment* is joint, creating a plural subject with its own normative structure ("we are committed").

  **2. The Co-Authorship Case: Applying the Lenses**

  *   **Bratman's Explanation:** The colleagues develop interlocking intentions ("we will co-author this paper"), likely interdependent ("I'm doing this partly because she seems committed too"). They form meshing sub-plans (drafting sections, meeting). This is CK. Real work done signifies reliance – each has invested time/effort based on the apparent shared intention. Walking away unannounced:
      *   Violates the stability of one's own intention to co-author.
      *   Frustrates the reasonable reliance the other formed based on observable participation (actions expressing intention).
      *   Wastes the other's effort invested due to that reliance.
      *   Disrupts meshed sub-plans.
      *   Thus, it *wrongs* the other *because* it harms them (wasted effort, disappointment) through an action that violates norms of fairness given the reliance *I* induced. The obligation is a *moral consequence* of the complex individual attitudes and actions.

  *   **Gilbert's Explanation:** By openly embarking on the co-authorship – discussing ideas, dividing tasks, starting work – the colleagues *implicitly* form a joint commitment to co-author the paper as a body. This JC constitutes them as a plural subject regarding this goal. The real work done is *evidence* of the commitment being in force. Walking away unannounced:
      *   Violates the *joint commitment itself*.
      *   Is a *wronging* of the other collaborator *directly* because it unilaterally breaches the normative bond constitutive of their plural subjecthood. The other has a *right* derived from the JC to expect participation or negotiation. The feeling that it would "wrong" them specifically (not just disappoint) captures this unique normative link created by the JC.

  **3. The Verdict: Why Gilbert Captures the Obligation More Adequately**

  Bratman's apparatus brilliantly explains the *coordination*, *interdependence*, and *reliance-based moral reasons* present in the co-authorship case. He can certainly explain *why* walking away is *bad* – irrational, disappointing, unfair, harmful. However, **Bratman struggles to fully capture the *distinctive character* of the obligation felt – the sense of being *owed* something *specifically by the collaborator*, and the collaborator's correlative sense of having *wronged that specific person* in a way that transcends mere disappointment or wasted effort.**

  *   **The Gap in Bratman:** The obligation Bratman derives is ultimately *impersonal* or *self-regarding* in its foundation. It stems from:
      1.  *My* intention's stability (a demand of *my* rationality).
      2.  General moral principles about fairness and avoiding harm *caused by* frustrating *your* reliance, which *I* elicited. This reliance is based on *your* beliefs about *my* attitudes/actions.
      *   The "wronging" is mediated through the harm to the *other individual's interests* caused by *my individual* actions breaking a pattern *I* set. The collaborator feels let down *by me*, but the *source* of the obligation is my intention + general morality concerning induced reliance. The obligation isn't *to her* by virtue of *our joint venture itself*; it's *to morality* (don't harm) *because* of *her* reliance *on me*.

  *   **Gilbert's Explanatory Power:** Gilbert's joint commitment **directly grounds** the specific, bilateral obligation *between the collaborators*.
      *   The obligation arises *from the joint act of commitment itself*, not as a consequence of aggregated individual states plus moral principles.
      *   It explains why the collaborator feels *wronged by me specifically* (I violated *our* commitment) and why *I* feel I have wronged *her specifically* (I violated my commitment *to her* as co-committer).
      *   It captures the intuition that the obligation is *constitutive* of the collaboration – you can't have this *kind* of shared activity without generating this *kind* of mutual normative bond. Walking away isn't just bad planning or rude; it's a betrayal of the "us" created by starting the project together.
      *   The *sui generis* nature of the obligation explains why it feels different from merely disappointing someone who hoped I'd do something based on my past behavior. It's the difference between failing to meet a friend's hope I'll visit (disappointing) and breaking a promise to visit (wronging via commitment).

  **Conclusion:**

  While Bratman's planning theory offers a powerful account of the cognitive and coordinative infrastructure of shared agency, **Gilbert's plural subject theory provides a superior explanation for the *distinctive interpersonal normative obligation* evident in the co-authorship case.** Bratman can explain the *harm* and *unfairness* of walking away, deriving a moral reason against it from individual attitudes and general principles. However, he cannot fully account for the *source* of the obligation *as a direct bond between the collaborators* arising from their joint activity. Gilbert's *sui generis* joint commitment explains this bond directly and constitutively. The feeling that unannounced withdrawal would "wrong" the collaborator, not merely disappoint them, points precisely to the kind of normative bond Gilbert posits – an obligation owed *to the other person* by virtue of *our joint commitment*, irreducible to the sum of our individual psychologies and the moral consequences of their interaction. The co-authorship case thus highlights the genuine explanatory work done by Gilbert's concept of joint commitment.
