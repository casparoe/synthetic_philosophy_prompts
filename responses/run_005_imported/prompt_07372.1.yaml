answer: |-
  Here are 8-10 probing questions for your fitting-attitude theorist podcast guest, designed to push beyond "wrong kind of reasons" dismissals, plus targeted follow-ups for each core question:

  **Core Question 1: The Definitional Worry (Circularity)**
  *   **Question:** "You define 'good' as 'a fitting object of a pro-attitude.' But when faced with cases like the demon commanding admiration for mud, you invoke the 'wrong kind of reason' distinction. Can you define what makes a reason the *wrong kind* for grounding fittingness without implicitly relying on some prior understanding of the *value* of the object itself? Doesn't saying a reason is 'wrong kind' because it doesn't *track the object's actual properties* sneak in the very notion of inherent value you're trying to analyze?"
      *   *Likely Answer:* "No, it's about the *reason's relation to the attitude*. The demon gives a reason *to have* the attitude (to avoid punishment), not a reason *provided by* the object (the mud). Fittingness concerns whether the attitude *matches* the object's properties."
      *   **Follow-Up:** "But isn't 'matching the object's properties' doing the heavy lifting? How do we determine *which* properties of the mud are 'match-worthy' without already having a sense of what makes something *admirable* or *valuable*? Doesn't 'match' here just mean 'correctly represents the object's *value*'?"

  **Core Question 2: State-Given vs. Object-Given - Solution or Label?**
  *   **Question:** "Many theorists, like yourself, use the state-given (reasons to *have* the attitude) vs. object-given (reasons *provided by* the object) distinction to solve the WKR problem. But critics argue this just *renames* the problem rather than solving it. How does labeling a reason 'object-given' *explain* why it's the right kind for grounding value, instead of just asserting that it is? Isn't 'object-given' defined *as* the kind of reason relevant to fittingness/value, making the distinction circular?"
      *   *Likely Answer:* "The distinction is fundamental. Object-given reasons are reasons *why* the attitude is fitting – they cite features of the object that *merit* the attitude. State-given reasons are pragmatic; they don't speak to the attitude's appropriateness *towards the object*."
      *   **Follow-Up:** "But doesn't calling a feature a 'merit-conferring property' *presuppose* a normative standard? How can we identify *which* features of the mud (its brownness? its squishiness?) are potential 'merit-conferring properties' for admiration *without* already knowing what admiration is fitting *to* (i.e., what is admirable)? Doesn't 'merit' just mean 'makes fitting' or 'makes valuable'?"

  **Core Question 3: Theoretical Immunity - Can *Any* Theory Use This Move?**
  *   **Question:** "The 'wrong kind of reason' move seems incredibly powerful for defusing counterexamples. Couldn't a utilitarian, faced with a counterexample where an action maximizes happiness but seems clearly wrong, similarly say the intuition provides only the 'wrong kind of reason' against their theory? If FA theory can deflect the Demon case this way, doesn't this make it unfalsifiable in principle, since *any* alleged counterexample could be dismissed as providing the 'wrong kind of reason'?"
      *   *Likely Answer:* "No, it's specific to attitude-based analyses. The WKR problem arises precisely *because* we're analyzing value in terms of attitudes. Utilitarianism analyzes rightness directly in terms of consequences; it doesn't have the same structural gap between the attitude (approval) and the property (rightness). The FA move is necessary and specific to its domain."
      *   **Follow-Up:** "But imagine a *different* attitude-based theory – say, one analyzing 'funny' as 'what it's fitting to laugh at.' Couldn't they dismiss a demon threatening punishment unless you laugh at mud by calling *that* a 'wrong kind of reason' too? Doesn't this show the move is a *general* defense mechanism for *any* fitting-attitude style analysis, potentially insulating *all* such theories from counterexamples, making the FA analysis of *good* less distinctive?"

  **Core Question 4: Falsifiability - What Would Count as Evidence?**
  *   **Question:** "If the Demon case and similar WKR scenarios aren't genuine counterexamples, but rather puzzles *within* the FA framework to be solved by drawing the right distinction, what *would* constitute a genuine counterexample to FA theory? What kind of evidence or scenario would actually force you to reconsider the core claim that 'x is good' means 'it is fitting to have a pro-attitude towards x'?"
      *   *Likely Answer:* "A genuine counterexample would show something we all agree is *obviously good*, but where there is *no* plausible fitting pro-attitude towards it, or conversely, something we all agree is *obviously bad* where there *is* a fitting pro-attitude. Or it might show that 'fittingness' itself is incoherent or reduces to something non-normative."
      *   **Follow-Up:** "But isn't the determination of 'obvious goodness' or 'obvious badness' precisely what the FA theory is trying to *analyze*? If we point to something 'obviously good' and say 'See? No fitting attitude!', couldn't you just reply that we *must* be missing the relevant attitude or misidentifying fittingness? Doesn't this make it very hard to find a truly decisive counterexample?"

  **Additional Probing Questions:**

  5.  **Question:** "You say the demon provides reasons of the *wrong kind* for admiring the mud. But *why* is avoiding punishment not a genuinely good reason to admire *something*, even mud, in that specific context? Doesn't your theory imply that 'admiration' in the demon scenario isn't *real* admiration, or is that an unacceptable consequence?"
      *   *Likely Answer:* "Admiration has a specific nature – it's a response to perceived excellence. Having it for mud to avoid punishment isn't *genuine* admiration; it's pretense or coerced behavior."
      *   **Follow-Up:** "Doesn't this appeal to the 'nature' of admiration risk making the FA theory vacuous? If we define the attitude (admiration) *as* the response to excellence/value, then 'x is admirable (valuable) iff it's fitting to admire (respond to value) x' becomes circular, no?"

  6.  **Question:** "How does FA theory handle 'solitary goods' – things that might be good (e.g., a beautiful, undiscovered galaxy) even if no one *could* actually have an attitude towards them? If fittingness requires a *possible* attitude, does that mean things beyond our cognitive reach can't be good?"
      *   *Likely Answer:* "Fittingness concerns the appropriateness of attitudes *were* they to occur. The galaxy *would* be a fitting object of admiration *if* a valuer encountered it."
      *   **Follow-Up:** "But doesn't this 'if' clause make goodness counterfactually dependent on potential valuers? Does this mean value disappears if all possible valuers cease to exist? Is that plausible?"

  7.  **Question:** "Can FA theory account for the *degrees* of goodness? Is something better than another *just* if a stronger pro-attitude is fitting towards it? How do we compare the fitting strength of attitudes towards very different objects (e.g., a delicious meal vs. a just law)?" (Focuses on a different challenge).
      *   *Likely Answer:* "Yes, comparative fittingness of attitudes (e.g., stronger admiration, greater desire) tracks comparative value. We compare by considering the intensity or priority fitting in different contexts."
      *   **Follow-Up:** "But isn't the 'intensity fitting' itself determined by the *perceived degree of value*? Doesn't this risk circularity again? How do we independently calibrate 'fitting intensity'?"

  8.  **Question (Optional - Synthesis):** "Putting it together: Doesn't the combination of the WKR problem, the challenge of defining 'wrong kind' non-circularly, and the potential for the 'wrong kind' move to immunize the theory, suggest that FA theory might be *re-describing* our value judgments using the language of fitting attitudes, rather than providing a truly reductive *analysis*? Is FA theory ultimately explanatory, or just a different way of talking about value?"

  **Key Elements Addressed:**

  1.  **Circularity:** Questions 1 & 2 (and FU) directly tackle whether "wrong kind," "object-given," "merit," or "matching" secretly presuppose value.
  2.  **State/Object Distinction Adequacy:** Question 2 (Core) and its FU challenge whether this split solves or merely relabels the problem.
  3.  **Theoretical Immunity:** Question 3 (Core) explicitly asks if the move rescues any theory from any counterexample, testing robustness/falsifiability.
  4.  **Falsifiability:** Question 4 (Core) directly asks what evidence *would* count against the theory.
  5.  **Follow-Ups:** Each core question has a follow-up anticipating common FA responses (appeals to attitude nature, counterfactuals, or denying the premise) to keep the pressure on and prevent easy dismissal.
  6.  **Depth:** Additional questions probe related weaknesses (solitary goods, degrees, vacuity) and synthesize concerns.

  This set should force your guest to defend the *foundations* of the distinction and the theory's explanatory power, moving well beyond simply invoking "wrong kind of reasons." Good luck with the seminar!
