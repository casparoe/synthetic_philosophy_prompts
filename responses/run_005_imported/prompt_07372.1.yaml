prompt: |-
  so for my metaethics seminar we've got this project where you have to "book" a guest for a mock podcast ep (prof said inventing them is fine so we're not putting words in some real persons mouth). mine's a fitting-attitude theorist -- she thinks "x is good" just means x is a fitting object of a pro-attitude, and whenever someone brings up the demon-and-the-mud case she just says "thats the wrong kind of reason" like that settles it. can you draft 8-10 questions that dont just let her repeat that line? i want one question on whether she can actually define "wrong kind" without secretly presupposing the very value the analysis is supposed to explain, one on whether the state-given vs object-given split (reasons about having the attitude vs reasons about the object itself) really solves that or just renames it, one asking if the same move could rescue basically any theory from basically any counterexample, and a last one on what would actually count as evidence against her view instead of just another case to wave off. for each can you throw in a quick follow-up keyed to whatever answer she'd probably give?
