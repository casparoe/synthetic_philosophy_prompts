answer: |-
  Here's a toast that threads the needle – accurate on the philosophy, warm on the marriage, accessible to all, and with the required joke. It clocks in around 4-5 minutes spoken naturally.

  **The Toast:**

  "Alright, everyone. Settle in. *[Raise glass]* For those who don't know me, I’m Danny’s brother, and incredibly honored to be his best man today. Seeing him and Naomi together... it just makes sense. It feels *real*.

  Now, confession time. I spent last weekend arguing with our brilliant friend Leah *[gesture towards Leah, warm smile]* about... well, about what makes things *real*. Specifically, about money. Don’t worry, I’m not passing the hat! *[Pause for light chuckle]*. Leah was explaining how a dollar bill is, technically, just a piece of paper. But it *becomes* money – something powerful, something we all agree has value – because *we*, collectively, decide to treat it that way. We give it meaning. We agree it can buy groceries, pay debts, build futures. The fact we *know* it's just paper doesn't make the groceries any less real, or the debt any less binding. It works *because* we all buy into the idea together.

  And that got me thinking about today. Because what we're celebrating right here, Danny and Naomi’s marriage, strikes me as working in a wonderfully similar way. *[Shift tone slightly more earnest]*

  Think about it. Two incredible people stand up in front of everyone they care about. They say some profound, sometimes ancient, words. They swap some rings. *[Hold up hand, gesture to rings]* Beautiful, sure, but fundamentally... they’re just circles of metal. The words are just sounds. The license is just a piece of paper. *[Pause, let that sink in]*

  But then... something amazing happens. *We* show up. *We* witness it. *We*, everyone in this room, everyone who loves them, *agree* to see it differently. We collectively decide that those words aren't just sounds, they’re *promises*. That the metal isn't just decoration, it’s a *symbol* of an unbreakable bond. That the piece of paper isn’t just bureaucracy, it’s the *foundation* of a new family.

  Just like that dollar bill only buys groceries because we all agree it does, Danny and Naomi’s marriage becomes this powerful, tangible, *real* thing – this force that shapes their lives, creates obligations, grants rights, builds a shared future – because *they* choose it, and because *we*, their community, stand here today recognizing it, supporting it, and saying, 'Yes. This *counts*. This is real for us, too.'

  **The Joke:**
  "Now, I know some of our guests *[nod towards family side]* might hear terms like 'collective agreement' or 'fiat currency' and think, 'Fiat? Isn’t that an Italian car?' *[Pause for laughter – lands because it references his earlier point about family]* But honestly? That instinct is spot on! Because whether it’s money or marriage, it’s not about the physical *stuff*. It’s about the engine we put inside it together. Danny and Naomi? You’ve built a V12 of commitment under the hood of this marriage. *[Pause for laughter]*"

  **Back to Heartfelt:**
  "And that’s the magic. It’s *made* real by your choice, by your promises, by the love that’s so obvious between you. And it’s *sustained* as real, given its true weight and power, because everyone who matters to you is here saying, 'We see it. We honor it. We’ll help you uphold it.'

  It’s not 'fake' because we agree on its meaning. It’s *powerful* because we agree on its meaning. That shared belief, that collective 'yes,' transforms the paper, the metal, the words, into something far greater than the sum of its parts. It creates a new reality: the reality of *your* marriage.

  So, Danny and Naomi, here’s to your incredible choice. Here’s to the promises you’ve made. Here’s to the love that makes this all so effortless to believe in. And here’s to all of us, your slightly weird but very loving community, who get to witness it, support it, and absolutely agree: This *counts*. This is profoundly, beautifully real.

  Raise your glasses everyone! To Danny and Naomi – may your life together be as valuable, as enduring, and as joyfully real as the most trusted currency in the world. Cheers!"

  **Why this works:**

  1.  **Accuracy:** Nails the Searle "status function" (without using the term) and the collective intentionality behind money and marriage. Uses "counts as" explicitly. Contrasts the physical substrate with the socially conferred function/status. Correctly avoids the "looping effect" disanalogy (Hacking) as it's not relevant to marriage in the same way and would complicate things.
  2.  **Avoids "Fake" Landmine:** Repeatedly emphasizes that being collectively agreed upon *makes* it real and powerful ("doesn't make the groceries any less real," "becomes this powerful, tangible, *real* thing," "It’s *powerful* because we agree"). The punchline contrasts "fake" with "powerful."
  3.  **Accessibility:** Uses simple analogies (paper -> money, metal/words -> marriage). Explains the core idea clearly. The joke uses a relatable misunderstanding ("Fiat? Car?") to bridge the academic/family gap.
  4.  **The Joke:** Lands because:
      *   It directly references his earlier worry about the family's understanding.
      *   It's self-deprecating about the academic language.
      *   The car metaphor is universal.
      *   The "V12" line is a slightly silly but warm compliment.
      *   It provides needed levity before the final emotional push.
  5.  **Focus on the Couple:** Starts and ends with Danny & Naomi's love and commitment. The philosophy serves *their* story, not the other way around.
  6.  **Leah-Proof:** Explains the core Searlean idea accurately and simply. She can't fact-check it because it's fundamentally correct. She might *wish* he mentioned Hacking's looping, but it wasn't relevant to the marriage analogy he built.
  7.  **Structure:** Personal intro -> Engaging anecdote (the argument) -> Core idea (money) -> Seamless transition to marriage -> Explanation of the analogy -> Joke (levity) -> Heartfelt reinforcement of the idea & focus on the couple -> Call to toast.

  **Delivery Tips:**

  *   Speak naturally, conversationally. Don't lecture.
  *   Make eye contact around the room, especially during the "we all agree" parts.
  *   Pause slightly after setting up the joke ("Italian car?"). Pause for the laugh after "V12".
  *   Put genuine warmth and conviction into the final lines about their love and commitment.
  *   Raise your glass high on "Cheers!".

  This toast uses the argument as a springboard to celebrate the profound, collective reality Danny and Naomi are creating – just like that dollar in your pocket, made real by shared belief. Good luck!
