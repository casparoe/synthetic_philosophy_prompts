  First, I should recall both paradoxes. St. Petersburg is straightforward: flip a coin until heads appears, payouts double each tails (e.g., $2, $4, $8...). The expected value is the sum of (probability * payout) for each possible outcome. Since probabilities halve while payouts double, each term is 1, leading to an infinite sum. The issue here is that infinite expected utility doesn't match real-world behavior—people aren't willing to pay huge sums to play. But mathematically, it's a clear divergence.

  Now, the Pasadena game, introduced by Hájek and Nover, is trickier. It uses the same coin-flip setup but assigns payouts based on the flip number n: (+$2^n / n) for odd n, and (-$2^n / n) for even n. The signs alternate, and the magnitudes grow without bound. The user thinks this also diverges to infinity like St. Petersburg, but that's where the confusion lies.

  I need to explain why Pasadena's expected value isn't just divergent—it's conditionally convergent. That means the sum changes based on the order of terms. In St. Petersburg, rearranging terms doesn't affect the sum because it's absolutely convergent (all terms positive). But in Pasadena, the alternating signs make it conditionally convergent. The classic example is the alternating harmonic series: 1 - 1/2 + 1/3 - 1/4 + ... converges to ln(2), but rearranging terms can make it converge to anything or even diverge.

  Applying this to Pasadena: if I group outcomes in the natural order (first flip, second flip, etc.), the sum might converge to a finite number, say S. But if I rearrange the terms—like putting all positive payouts first or in a different sequence—I could make the sum converge to any real number or even diverge. This is mind-blowing because it means the "expected value" isn't a fixed value; it depends on how I choose to sum the terms.

  This challenges the very definition of expected value. Normally, we assume the sum is order-independent for infinite series, but that only holds for absolute convergence. Pasadena violates this, so its expectation is undefined—not infinite, but indeterminate. That's a qualitative difference from St. Petersburg, where the expectation is unambiguously infinite.

  The user's mistake is conflating unbounded payoffs with the same kind of divergence. Unbounded payoffs are necessary but not sufficient for this issue; the alternating signs create the conditional convergence problem. Hájek and Nover highlighted this to show that standard decision theory breaks down here—no rational agent can assign a preference because the expectation isn't a number.

