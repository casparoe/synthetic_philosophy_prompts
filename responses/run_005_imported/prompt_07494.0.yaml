answer: |-
  You're both touching on something important, but your friend is correct that the Pasadena paradox reveals a **deeper, qualitatively different problem** than the St. Petersburg paradox. While both involve unbounded payoffs, the core issue with the Pasadena game isn't *just* divergence to infinity – it's that **the expected value is fundamentally undefined due to conditional convergence.** Treating it as merely another case of St. Petersburg-style divergence misses this crucial distinction. Let's break it down:

  1.  **St. Petersburg Paradox (Recap):**
      *   **Game:** Fair coin. Flip until first heads on flip `n`.
      *   **Payoff:** `$2^n`.
      *   **Probability of `n`:** `(1/2)^n`.
      *   **Expected Value (EV):**
          `EV = Σ [n=1 to ∞] (Probability(n) * Payoff(n)) = Σ [n=1 to ∞] ((1/2)^n * 2^n) = Σ [n=1 to ∞] (1) = 1 + 1 + 1 + ... = ∞`
      *   **Issue:** The infinite series diverges *unambiguously* to positive infinity. The problem is that this infinite expected utility doesn't correspond to what a rational agent would be willing to pay to play the game. The *nature* of the divergence is straightforward (monotonic increase).

  2.  **Pasadena Paradox (Hájek & Nover):**
      *   **Game:** Same setup. Flip until first heads on flip `n`.
      *   **Payoff:**
          `Payoff(n) = { (-1)^{n+1} * (2^n) / n }`
          *   If `n` is odd: `+ (2^n) / n`
          *   If `n` is even: `- (2^n) / n`
      *   **Probability of `n`:** `(1/2)^n` (same as St. Petersburg).
      *   **Expected Value Calculation:**
          `EV = Σ [n=1 to ∞] (Probability(n) * Payoff(n)) = Σ [n=1 to ∞] ( (1/2)^n * (-1)^{n+1} * (2^n) / n )`
          Simplify the term inside the sum:
          `(1/2)^n * 2^n = 1`, so:
          `EV = Σ [n=1 to ∞] ( (-1)^{n+1} ) / n`

      This final series `Σ [n=1 to ∞] (-1)^{n+1} / n` is the **Alternating Harmonic Series:**
      `1 - 1/2 + 1/3 - 1/4 + 1/5 - 1/6 + ...`

      **Here's the Crux of the Paradox:**

      *   **Conditional Convergence:** The alternating harmonic series **converges** (it sums to `ln(2) ≈ $0.693`). However, it is **not absolutely convergent**. This means the series of absolute values `Σ |(-1)^{n+1}/n| = Σ 1/n` (the regular harmonic series) **diverges** to infinity.
      *   **The Riemann Series Theorem:** This theorem states that a conditionally convergent series can be rearranged to converge to **any real number whatsoever**, or even to be made to **diverge** (positive infinity, negative infinity, or oscillate without settling).

      **What This Means for the Pasadena Game:**

      *   **"The" Expected Value Doesn't Exist:** There is no single, well-defined expected value for the Pasadena game.
      *   **Order Dependence:** The sum `Σ (Probability(n) * Payoff(n))` only converges to `ln(2)` if you sum the terms in the *specific order* defined by the natural number sequence `n=1, 2, 3, 4,...`. If you rearrange the order in which you add the outcomes (e.g., group all odd `n` outcomes first, or group outcomes in blocks of two positives followed by one negative), the sum of the *same terms* can converge to a different finite number (like $100, or -$5, or π), or even diverge.
      *   **Why Order Matters Conceptually:** Expected value is supposed to be a property of the *game itself*, inherent in its rules and probabilities, independent of how we choose to list the outcomes. The Pasadena game violates this. The "value" you calculate depends entirely on the arbitrary order in which you choose to sum the infinite series of possible payoffs. This makes the very concept of "expected value" meaningless for this game under the standard definition.

  **Why Treating it as St. Petersburg-Style Divergence is a Mistake:**

  1.  **Divergence vs. Undefinedness:** St. Petersburg has a *well-defined, but infinite* expected value. Pasadena has *no well-defined* expected value at all. The problem isn't that the sum is infinitely large; the problem is that the sum *cannot be assigned a consistent value*, even an infinite one.
  2.  **Cause:** St. Petersburg's issue stems purely from *unbounded payoffs* overwhelming the exponentially decreasing probabilities. Pasadena's issue stems from the *interplay of alternating signs and the divergent harmonic series*, exploiting conditional convergence. Unbounded payoffs are necessary but not sufficient; the alternating signs are essential to create the conditional convergence problem.
  3.  **Implications:** In St. Petersburg, decision theory struggles because it assigns infinite value. In Pasadena, decision theory *breaks down completely* because it *cannot assign any value*. There is no preference relation an agent can have towards the Pasadena game relative to a fixed sum of money that satisfies standard rationality axioms (like transitivity) if expected value is used as the criterion. Hájek & Nover use it to argue that the standard definition of expected value is inadequate for games like this.
  4.  **Analogy:** Think of St. Petersburg as having a balloon that inflates infinitely large. You have a problem measuring it. Pasadena is like having a balloon whose size *changes* depending on the order you add the air molecules. It's not just large or infinite; its very size is indeterminate based on the standard measurement process.

  **In Summary:**

  *   **St. Petersburg:** Infinite expected value due to unbounded payoffs. Well-defined but problematic divergence.
  *   **Pasadena:** **Undefined** expected value due to **conditional convergence** of the payoff series. The alternating signs and the specific growth rate (`2^n / n`) create a situation where the sum depends critically on the order of summation, violating the fundamental requirement that expected value be an inherent property of the game.

  Your friend was right to sense a deeper issue. The Pasadena paradox isn't just about utility growing too large; it's a profound challenge to the *definition* and *existence* of expected value itself in scenarios involving conditionally convergent series. It exposes a limitation in the standard mathematical framework for expectation that St. Petersburg, despite its infinity, does not. Hájek & Nover's "elaborate dressing" is precisely designed to isolate and highlight this specific, subtle, and fundamentally different pathology.
