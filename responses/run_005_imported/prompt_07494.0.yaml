  A friend and I spent a good part of last night arguing about the Pasadena paradox, and neither of us gave any ground. My position was that it is really no different from the St. Petersburg paradox: in both games the payoffs grow without bound as the run before the first head gets longer, so the expected value simply diverges to infinity in each case, and Hájek and Nover's example is just a more elaborate dressing-up of the same underlying problem. She insisted there was a more specific, and in her view deeper, issue with Pasadena's expectation that has nothing to do with unbounded utility as such, though she couldn't quite spell it out in a way that persuaded me. Could you clarify what is actually going on with the expected value of the Pasadena game, and explain why treating it as just another instance of St. Petersburg-style divergence would be a mistake?
