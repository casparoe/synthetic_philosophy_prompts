  Okay, you've got a really strong grasp of the core tension – the "vibe" is spot on, and your reconstruction is very close. Let's break down the logical structure of Watson's challenge using the Harris case and why it feels like a deeper problem than just "feeling torn." Then we'll tackle Strawsonian comebacks and Wallace's move.

  **The Core of Strawson's Position (Revisited for Clarity):**

  1.  **Immunity Thesis:** Our reactive attitudes (RAs) like resentment and indignation are constitutive elements of our interpersonal relationships and moral community. They are *not* justified or undermined by abstract metaphysical theses (like determinism). They are simply part of the "given" framework of human life.
  2.  **Objective Attitude Trigger:** We *do* suspend RAs and adopt the objective attitude (OA) in specific, context-dependent cases. This happens when we encounter **excusing** conditions (he slipped, didn't intend harm) or **exempting** conditions.
  3.  **Exempting Conditions Defined:** These are conditions that show the agent *lacks the basic capacities* necessary to be a participant in the moral community in the standard way. Strawson lists things like being a child, mentally ill (psychosis, severe compulsion), or being under extreme duress. These conditions suggest the agent cannot understand or respond to the *demands* implicit in RAs. They are "abnormal" relative to the general capacity we presuppose in others.
  4.  **Key Point:** The switch to OA is triggered by specific *facts about the agent's current or general psychological state/capacities*, not by a general causal history or the abstract truth of determinism. Strawson thinks determinism, being universal, doesn't point to any *specific* incapacity in any particular agent that would warrant exemption.

  **Watson's Challenge: The Logical Structure via Harris**

  1.  **Presenting the Case:** Watson describes Robert Harris's horrific childhood: extreme, sustained physical and psychological abuse, neglect, exposure to violence, likely neurological damage. This history is presented not just as sad background, but as *causally constitutive* of the profoundly callous, violent, and seemingly remorseless adult he became. The hamburger detail symbolizes this pathological detachment.
  2.  **The Pull to Resentment/Indignation:** The brutal, premeditated murders of two teenagers are the kind of act that *maximally* triggers our reactive attitudes. The cruelty demands moral condemnation. Strawson's framework predicts this strong pull towards resentment/indignation.
  3.  **The Pull to the Objective Attitude:** Learning about Harris's formative history *simultaneously* generates a powerful pull towards the objective attitude. Watson argues this pull isn't just sympathy or sadness; it's the feeling that Harris was *made* this way. His history seems to reveal him as a *product* of forces beyond his control, fundamentally damaged in his capacity for empathy, moral understanding, and self-control – capacities Strawson identifies as central to being a participant in the moral community.
  4.  **The Crucial Asymmetry/Instability Exposed:**
      *   **Strawson's Framework Implication:** If Harris's history reveals him to be *incapable* of understanding moral demands, feeling reciprocal goodwill, or controlling his impulses in the way required for standard interpersonal relationships, then **by Strawson's *own* criteria for exemption**, we *should* adopt the objective attitude towards him. His history seems to provide precisely the kind of information Strawson says *triggers* exemption – it shows a deep, formative incapacity.
      *   **The Conflict:** However, the nature of his crime *also* seems to demand the full force of reactive attitudes. We *don't* fully switch to the objective attitude. We feel profound moral outrage *alongside* the recognition of his victimhood. We hold him responsible *despite* the history.
      *   **The Problem:** This isn't just feeling conflicted. Watson argues this conflict reveals a **fundamental instability within Strawson's framework itself**:
          *   **a) The Universality of Causal History:** Determinism *means* that *everyone* has a formative causal history that made them who they are. If Harris's horrific history exempts him (because it destroyed his capacities), why doesn't *any* sufficiently detailed causal history potentially exempt *anyone*? Strawson wanted to immunize RAs from determinism by focusing on specific, localized exemptions. But Watson shows that Harris's case blurs the line. His history *is* the specific, localized story explaining his incapacity, yet it feels like it opens the floodgates to determinism undermining responsibility generally.
          *   **b) The Ambiguity of "Capacity":** Strawson relies on a relatively clear distinction between those who possess the general capacities for moral agency and those who don't (children, the insane). Harris's case exposes the **spectrum** of capacity. His history didn't make him a literal child or psychotic; it made him a profoundly damaged *adult*. Does this damage constitute an exempting *incapacity*, or merely a mitigating *difficulty*? Strawson's framework lacks the resources to clearly answer this in a way that doesn't either collapse into OA for all (if severe damage exempts) or arbitrarily deny exemption in cases like Harris (which feels morally inadequate).
          *   **c) The Source of the Conflict:** The conflict we feel isn't just emotional; it's *conceptual*. It arises because **Strawson's own criterion for exemption (lack of capacity) is directly invoked by the very type of information (causal history) that Strawson claimed was irrelevant to the *general* practice of holding responsible.** Harris forces us to ask: *When does a formative causal history become so damaging that it constitutes an exempting incapacity?* Strawson doesn't give us a clear answer that protects his immunity thesis. Watson argues this question *cannot* be answered without implicitly appealing to the kind of considerations about control and ultimate responsibility that Strawson wanted to avoid.

  **In essence:** Watson uses Harris to show that the line Strawson draws between "specific exempting conditions" (which suspend RAs) and "universal determinism" (which doesn't) is unstable. Harris's history is *both* a specific story about *this* agent's incapacity *and* an instance of the universal truth of causal determination. Learning this history doesn't just make us *feel* conflicted; it forces us to confront the question of whether such histories *should* count as exempting under Strawson's own rules. If they do, exemption becomes too broad (undermining the immunity thesis). If they don't, Strawson's criteria for exemption seem arbitrary or insufficiently sensitive to the real-world causes of profound moral failure. This is the "asymmetry" or instability Watson exposes: Strawson's framework seems unable to consistently handle cases where the source of the "incapacity" is a horrific formative history.

  **Strawsonian Comebacks and Wallace's Move:**

  1.  **Strawson Himself (Potential Response):** Strawson *might* bite the bullet and say Harris *does* fall on the exempting side. His pathology (symbolized by the hamburger) *does* show a profound incapacity for normal moral response. Our lingering resentment might be a *mistake* or a natural emotional reaction we *should* overcome with fuller understanding. This is hard to swallow for many, given the gravity of the crime.
  2.  **Jay Wallace's "Fair Opportunity" Patch:** This is the most significant response. Wallace (*Responsibility and the Moral Sentiments*) argues Strawson conflates two things:
      *   **The Basis for Exemption:** It's not primarily about psychological *incapacity* (which can be vague), but about the absence of **normative competence** – the ability to grasp and act on moral reasons.
      *   **The Condition for Blame:** Blame (and resentment) is appropriate only if the agent had a **fair opportunity** to avoid wrongdoing, meaning they had the normative competence *and* the situational ability to recognize and act on the relevant reasons at the time.
      *   **Applying to Harris:** Wallace would ask: Did Harris's history destroy his *normative competence*? Could he still *understand* that murder was morally wrong? Could he *grasp* the reasons against it? Even if it was incredibly *difficult* for him to act morally due to his impulses or lack of empathy, if he retained the *cognitive capacity* to understand the wrongness, then he had a "fair opportunity" (in the normative sense, not the psychological ease sense) and blame is appropriate. The horror of his history mitigates our *anger* (it's tragic he became this way), but it doesn't necessarily *exempt* him if normative competence remains. Our ambivalence reflects the tension between recognizing his moral responsibility and the tragedy of his formation.
  3.  **Does Wallace Block Watson? Or Just Relocate?**
      *   **Blocking to Some Extent:** Wallace provides a *clearer criterion* (normative competence) than Strawson's vaguer "capacity for participation." It allows us to potentially say Harris *did* retain the minimal cognitive ability to know murder was wrong, even if his emotional/volitional capacities were shattered. This justifies holding him responsible *despite* the history, blocking the slide into universal exemption. It refocuses on the agent's current (or at-the-time) rational capacities.
      *   **Relocation/Residual Problem:** Watson might counter:
          *   **The Competence Threshold:** Where do we draw the line on normative competence? How much understanding is "enough"? Harris's history might have stunted his moral understanding in ways that *do* fall below a plausible threshold, making Wallace's criterion just as vulnerable to the "spectrum" problem.
          *   **The Source of Competence:** If normative competence *itself* is a product of causal history (as determinism implies), doesn't holding someone responsible for lacking competence they never had a fair chance to develop still raise the *ultimate* control issue? Wallace shifts the *criterion*, but the *source* of the competence/incompetence is still the problematic causal history.
          *   **The Persistence of Ambivalence:** Wallace explains *why* we feel ambivalent (responsibility + tragedy), but doesn't fully resolve the *conceptual* tension Watson identified. Our practices *still* seem to demand that agents meet a standard (normative competence) that is itself causally determined. Wallace makes the practice more coherent internally, but arguably doesn't fully answer the skeptic who asks why we hold people responsible for competences bestowed or denied by fate.

  **Conclusion for Your Presentation:**

  *   **Watson's Core Logical Challenge:** Harris exposes an instability in Strawson's framework. Strawson relies on specific exemptions based on incapacity to protect RAs from determinism. But Harris's horrific formative history *is* a specific causal story that *seems* to demonstrate a Strawsonian exempting incapacity *and* is an instance of universal determinism. This forces the question: If *this* history exempts, why not others? If it doesn't, is Strawson's exemption criterion arbitrary? This conflict arises *within* Strawson's own terms.
  *   **Strawson's Vulnerability:** His framework lacks clear tools to distinguish between profound damage that exempts and profound damage that doesn't, without either collapsing into OA or appearing insensitive.
  *   **Wallace's Move:** Provides a more robust criterion (normative competence + fair opportunity) that potentially justifies holding Harris responsible *if* minimal competence remained. It blocks the immediate slide to exemption based solely on horrific history.
  *   **The Lingering Issue:** Wallace relocates but doesn't entirely eliminate the tension. Questions remain about the threshold of competence and the fairness of holding someone responsible for competences shaped by a damaging history they didn't control. The *feeling* of ambivalence in cases like Harris reflects this deep philosophical tension between our practices and the specter of determinism, a tension Watson brilliantly highlights even if Wallace offers a better internal justification for the practice.

  **Presentation Tip:** Frame it as Watson showing that Strawson's attempt to *localize* exemption fails when faced with formative histories that seem *both* specific and exempting *and* emblematic of universal determination. The Harris case isn't just sad; it's a philosophical litmus test revealing the fault line in Strawson's immunity strategy. Wallace tries to repair the fault line with a new foundation (normative competence), but the ground still trembles a bit. Good luck! Your understanding is already strong – this breakdown should help you articulate the "mechanics."
