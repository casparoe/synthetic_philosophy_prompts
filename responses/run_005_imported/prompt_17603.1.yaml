answer: |-
  The humid courtroom air crackled with the weight of the impossible. Silas Vale – the *real* Silas Vale, according to the will probated in this world, Prime – died intestate, leaving his vast biotech empire to his nephew, Leo Vale. Simple. Except Silas Vale was standing before me, sweating slightly in an impeccably tailored suit that screamed "expensive dimension-hopper."

  "Your Honor," I began, my voice tight. "My client, Mr. Silas Alpha, asserts he *is* Silas Vale. Not a copy. Not an *impostor*. But the very individual named in the disputed assets. The Silas Vale who built Vale Industries."

  Leo Vale, seated beside me, shifted angrily. "He looks like Uncle Silas. Talks like him. Probably knows things only Silas knew. But he *isn't* him. He’s from… *elsewhere*. A shadow. A counterpart."

  Judge Cassandra Thorne peered over her glasses. "Counselor Vance," she addressed me, "the legal definition of identity in this jurisdiction hinges on biological continuity within *this* spacetime continuum. Your client admits he originated in a parallel reality, designated 'Alpha'. How does that constitute being *the* Silas Vale of Prime?"

  This was where philosophy bled onto the courtroom floor. "Your Honor," I argued, "identity isn't merely a spatio-temporal tag. It's essence. Continuity of consciousness. Silas Alpha possesses the same memories, the same core personality, the same fundamental history as Silas Prime up until the divergence point – the 'Crossing Incident' thirty years ago. He *is* Silas Vale, who simply experienced a different thirty-year trajectory."

  Leo scoffed. "By that logic, Counselor, if I have an identical twin separated at birth, raised in France, he could walk in and claim half my inheritance because we share 'essence'? Nonsense. They diverged. They are distinct entities."

  "David Lewis would agree with you, Mr. Vale," I countered, invoking the philosopher my brother-in-law had lectured me about for hours. "Lewis argued no individual exists in more than one world. Silas Alpha is merely Silas Prime's *counterpart* – the person in Alpha world who most closely resembles him, due to shared origin. But resemblance isn't identity. Silas Prime is dead. Silas Alpha is… a very convincing echo."

  Leo nodded vigorously. "Exactly! Counterpart. Not the same man."

  "But," I pressed on, "Saul Kripke would argue that's deeply counterintuitive. When we say 'Silas Vale could have chosen differently at the Crossing,' we mean *Silas himself* could have chosen differently. Not some lookalike in another dimension. Silas Alpha *is* Silas Vale, numerically identical, existing transworldly. He *is* the man who built Vale Industries, who signed those early patents. He just happens to be standing *here*, now, from a different branch of possibility."

  The judge looked pained. "This is fascinating metaphysics, Counselors, but my courtroom requires tangible proof of identity under existing law. Mr. Alpha, do you have any evidence beyond resemblance and shared memories?"

  Silas Alpha stepped forward. He looked weary, haunted. "I have this," he said, placing a sleek device on the evidence table. "A chronicler. It maps the 'path' between worlds, not just the endpoints."

  He activated it. A holographic lattice shimmered above the table, showing a sequence of shimmering nodes – possible worlds. Prime was labeled. Alpha was labeled, several nodes away.

  "Look at the path," Silas Alpha instructed. "Prime to Beta. Beta to Gamma. Gamma to Delta. Delta to Epsilon. Epsilon to Alpha. Each step represents a minor divergence, a single quantum fluctuation amplified, a slightly different choice made globally. The differences accumulate, but the chain is continuous."

  I saw Leo frown. I felt a chill myself. **Chisholm's Paradox.** The gradual change argument. If you change one grain of sand, it's still a heap. Change another, still a heap. Change enough, one by one, and eventually, it's not a heap. But where does it stop being a heap? Where does Silas Prime stop being Silas Alpha?

  "Examine the differences between adjacent worlds," Alpha continued, zooming in. "Between Prime and Beta: a single gene expression variance in Silas Vale, causing a minor allergy he never developed here. Between Beta and Gamma: Silas chose a different brand of coffee on the morning of the Crossing. Between Gamma and Delta: a different scientist presented the initial Crossing proposal. Between Delta and Epsilon: Silas voted for a different mayoral candidate in a local election. Between Epsilon and Alpha: the specific isotope used in the Crossing device differed by one neutron."

  He looked around the room. "At each step, the Silas in the next world is unquestionably the 'same' Silas as the one before. The changes are trivial, insignificant to personal identity. Yet, by the time you reach Alpha... Silas Alpha *did* choose to cross permanently. He *did* make different strategic decisions, leading to a slightly different Vale Industries. He married a different woman. He has lived a life diverging from Prime Silas for thirty years."

  He pointed at the chain. "If Silas Prime is identical to Silas Beta, and Beta to Gamma, Gamma to Delta, Delta to Epsilon, and Epsilon to Alpha... then by the transitivity of identity, Silas Prime *is* Silas Alpha. We are numerically one. Transworld identity holds."

  Leo slammed his fist on the table. "Sophistry! You can't glue distinct individuals together with a chain of tiny differences! Each world has its *own* Silas Vale. Each is distinct. The chain shows resemblance, not identity! That's counterpart theory – each Silas is a counterpart of the others in the chain, linked by similarity, not sameness. Prime Silas is dead. Alpha Silas is a distinct counterpart who happens to be very similar and connected via this... path."

  The courtroom dissolved into murmurs. Judge Thorne rubbed her temples. The philosophical abstraction had become concrete, unavoidable. The inheritance of billions hung on whether identity was absolute across worlds (Kripke) or merely a matter of counterpart resemblance (Lewis), and whether Chisholm's gradual chain forced a contradiction in the transworld view.

  "Your Honor," I said, my voice low, "if we accept counterpart theory, then Silas Alpha has no claim. He is merely similar to the deceased. But if transworld identity holds, and the chain demonstrates continuity... then he *is* the rightful heir. He *is* Silas Vale. He carries the same essence, the same numerical identity, through that chain of possibilities. To deny him is to deny that *any* of us could have been otherwise. It renders possibility meaningless for the individual."

  Leo countered, his voice tight with emotion. "And if we accept transworld identity via this chain, Your Honor, where does it end? What if the chain kept going? What if, after a hundred such minor steps, the Silas at the end murdered someone? Would Silas Prime be guilty? Is he responsible for the actions of counterparts linked by a chain of trivial changes? This chain is a *reductio ad absurdum* against transworld identity!"

  Judge Thorne was silent for a long moment. The chronicler's holographic chain glimmered, a ladder of possibilities connecting two men who shared a face, a past, and a profound metaphysical dispute.

  "Legally," she finally said, her voice heavy, "our statutes were not written for... this. They assume a single, continuous spatio-temporal existence. Mr. Alpha originates from a demonstrably different reality. The chain of worlds, while fascinating, does not establish biological or legal continuity within *this* jurisdiction. It establishes a profound philosophical connection, but not, in the eyes of this court, legal identity."

  She looked at Silas Alpha. "I find you are, legally, a counterpart. A distinct individual from Silas Prime of this world. The inheritance passes to Leo Vale."

  Leo exhaled sharply, relief warring with a flicker of something else – perhaps pity. Silas Alpha closed his eyes, the defeat profound. It wasn't just about the money. It was about being told he wasn't *himself*.

  As we gathered papers, Leo leaned towards me. "He really believed it, didn't he? That he *was* Uncle Silas."

  I looked at Silas Alpha, staring emptily at the shimmering chain of worlds on the chronicler. He looked utterly alone, adrift between possibilities, denied his own history.

  "He did," I murmured. "And philosophically, he might be right. Kripke might be right. That chain... it breaks something. If he's not Silas Vale, then *who is he*? And if he *is*... what does that mean for any of us?"

  The Chisholm chain hadn't just decided an inheritance. It had laid bare the terrifying fragility of the self across the branching multiverse. Walking out, the humid air felt thicker than ever, laden not just with moisture, but with the weight of countless unrealized possibilities, and the chilling question: *Which grain of sand makes the heap cease to be itself?* I suddenly understood Humphrey's indifference to his counterpart's victory. It wasn't him. But staring at Silas Alpha's broken figure, I also understood Kripke's outrage. If *this* wasn't Silas Vale... then the very concept of "could have been" died in that courtroom. And part of me mourned its passing.
