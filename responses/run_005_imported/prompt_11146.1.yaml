  Hmm, this is a sophisticated request—they've clearly read Street and Yudkowsky, name-dropped Wielenberg and Parfit, and want to avoid rehashing basic realism debates. Their frustration with "wishy-washy" answers is palpable. 

  First, I need to crystallize the core problem: if evolution shaped *all* cognition, debunking morality should debunk math/logic too, leading to self-defeating skepticism. But since we intuitively trust math/logic, where's the asymmetry? 

  I recall three main realist strategies: 
  (1) Bite the bullet—say evolution *does* track math/logic truths indirectly (via "structural correspondence"). 
  (2) Argue morality is inherently "evaluative" while math is "descriptive" (though Street would call this question-begging). 
  (3) Claim math/logic are presupposed in *any* reasoning (even debunking arguments), making skepticism incoherent. 

  Option (3) feels strongest—it's the transcendental move. If you doubt logic, you can't formulate the debunking argument itself. Morality lacks this self-supporting structure. But is that fair? Anti-realists might retort that evolution explains *why* we find logic indispensable, not that it's true... 

  *Pauses* The user wants a verdict, so I'll defend the asymmetry: math/logic are non-negotiable for rationality itself, while morality isn't. The debunking argument *depends* on logical inference rules being reliable, creating a performative contradiction if denied. No such contradiction exists for moral skepticism. 

  *Checks Wielenberg* Right, he'd say moral truths are necessary like math, but that doesn't solve the *epistemic* problem of how evolution connects us to them. The transcendental argument bypasses that by targeting justification's preconditions. 

  *Final structure*: 
  - Frame the dilemma sharply. 
  - Dissect realist attempts to shield math/logic. 
  - Show why only the transcendental move works. 
  - Concede it's not a *knockdown* for realism (evolution could explain logic's *feeling* necessary) but it's the best asymmetry. 
  - Land on "no, the debunking doesn't generalize to logic/math" with a performative consistency warrant. 

  User's tone suggests they'll appreciate rigor and no fluff. No hedging.
answer: |-
  ## The Asymmetry Gambit: Why Evolutionary Debunking Doesn't Necessarily Sink Logic and Math

  The "proves too much" objection to evolutionary debunking arguments (EDAs) against moral realism is a powerful one. If the core argument – that the causal origins of our beliefs in a domain via selective pressures geared towards reproductive fitness, not truth-tracking, undermines our justification for believing those truths are mind-independent – applies equally to logic, mathematics, and morality, then EDAs seem to self-destruct. Skepticism about logic and math would render the EDA itself unjustified. Realists argue this shows EDAs are flawed. Anti-realists must either bite a devastating global skepticism bullet or find a **principled asymmetry** between the moral case and the math/logic case. After examining the strongest contenders, the verdict is that **a defensible asymmetry exists, grounded in the transcendental necessity and constitutive role of logic/math for rational thought itself, which morality lacks.**

  ### The Core Challenge Restated
  Sharon Street's Darwinian Dilemma forces moral realists to explain the striking coincidence: how did evolution, selecting solely for fitness-enhancing behavior, manage to align our moral beliefs with mind-independent moral truths? If the realist cannot explain this non-coincidental link, our moral beliefs are unjustified. The objection charges that this applies *mutatis mutandis* to logic and math. Evolution shaped cognitive capacities for counting predators, tracking social obligations, and avoiding contradictions *because* these aided survival, not because they accurately grasped the abstract truths of Peano arithmetic or the law of non-contradiction. If the causal story undermines justification for moral realism, why not for mathematical or logical realism? The options seem bleak: global skepticism or an unmotivated exception for logic/math.

  ### Attempts to Shield Logic and Math: Assessing the Asymmetry Proposals

  1.  **The Structural Correspondence (Biting the Bullet Lightly):**
      *   **Argument:** While evolution didn't select *for* truth per se, it *did* select for cognitive structures that reliably correspond to basic logical/mathematical truths because these truths govern the physical and social world we navigate. Believing 2+2=4 *is* fitness-enhancing because the physical world instantiates additive properties reliably. Similarly, avoiding contradictions prevents fatal errors in planning. The causal link *indirectly* tracks truth. Morality, however, concerns *evaluative* truths, not the descriptive structure of the world. Evolution could have shaped radically different evaluative responses as long as they promoted fitness (e.g., finding torture delightful if it aided survival).
      *   **Assessment:** This has initial plausibility but faces Street's counter: why think this "correspondence" holds for *mind-independent normative* truths in logic/math, rather than merely reflecting useful cognitive *fictions*? Evolution could have equipped us with *internally consistent but radically false* logical systems if they worked pragmatically (e.g., a paraconsistent logic in a quantum-fuzzy world, if that aided survival). The realist still owes an explanation for why useful cognitive structures *necessarily* latch onto abstract truths. While the *pragmatic utility* of basic logic/math is undeniable, the leap to *truth-tracking* requires justification the EDA challenges. This move risks simply *asserting* the disanalogy without fully meeting the epistemic challenge.

  2.  **The Domain-Specificity of Debunking (The Relevance of Truth-Conduciveness):**
      *   **Argument:** EDAs gain traction only against domains where we have independent reason to doubt that the selective pressures *could* be truth-conducive. In logic/math, the *very nature* of the truths (abstract, necessary, constitutive of reasoning) makes it plausible that *any* cognitive system capable of complex survival *must* latch onto approximations of these truths. The space of *possible* useful logics is severely constrained by the structure of reality itself. Morality, as evaluative, lacks this constraining structure. Evolution had wide latitude to shape moral intuitions arbitrarily relative to mind-independent truth.
      *   **Assessment:** This is stronger. The key is arguing that logic/math are *inescapable frameworks* for any cognitive engagement with the world. While evolution *caused* our specific cognitive apparatus, the *content* of logical/mathematical truths is such that successfully navigating *any* reasonably stable environment requires cognitive operations that *embody* or *approximate* them. The connection isn't coincidental; it's necessitated by the task of cognition itself. Morality, as prescriptive rather than descriptive of fundamental structural constraints, doesn't impose this necessity. The challenge is fleshing out "inescapable" without question-begging. Why couldn't evolution have built a successful cognitive system using fundamentally different (and false) logical principles, if such principles *happened* to work? This requires a robust view of logic/math as genuinely constraining *all possible* rational thought.

  3.  **The Transcendental Move (Performative Consistency and the Bedrock of Reasoning):**
      *   **Argument:** This is the most potent asymmetry. Logic (and basic math) are not just *objects* of belief potentially debunked; they are *presuppositions* of the debunking argument *itself* and any rational thought whatsoever. To *entertain* the EDA, one must rely on logical inference (e.g., modus ponens, non-contradiction), probabilistic reasoning, and basic mathematical concepts (e.g., counting premises, understanding probabilities of coincidence). **Denying the justification of our logical/mathematical beliefs performs a performative contradiction:** it uses the very faculties whose reliability it purports to undermine in order to formulate the argument. Morality enjoys no such status. One can coherently formulate and argue for moral skepticism (e.g., error theory) without presupposing the existence of mind-independent moral truths. The EDA against morality *uses* logic/math; it doesn't *depend* on morality. Therefore, while evolution explains the *existence* of our logical faculties, skepticism about their *outputs* is self-undermining in a way that moral skepticism is not.
      *   **Assessment:** This asymmetry is robust. The anti-realist about logic/math who uses the EDA is sawing off the branch they sit on. The argument *presupposes* the reliability of basic logical inference to even be intelligible. While evolution explains *why we have minds that work this way*, it doesn't provide grounds for *doubt* about the fundamental rules governing that working, because any grounds for doubt would themselves rely on those rules. This doesn't *prove* realism about logic/math (evolution could explain *why* we find these rules indispensable), but it **blocks the EDA's skeptical force** against them. The EDA cannot consistently generate *justified skepticism* about the tools necessary for its own articulation. Morality lacks this constitutive, presuppositional role in rational discourse.

  ### Verdict: The Asymmetry Holds (Mostly)

  The principled asymmetry lies in the **transcendental, constitutive role of logic and basic mathematics for rational thought and argumentation itself.** While EDAs pose a serious challenge to moral realism by highlighting the potential disconnect between fitness-tracking and truth-tracking in the evaluative domain, they cannot coherently generate *justified skepticism* about logic and math without self-destructing. The Structural Correspondence argument is vulnerable to the "useful fiction" retort. The Domain-Specificity argument gains force when combined with the transcendental point but requires careful handling to avoid circularity.

  **Therefore, the "proves too much" objection is successfully parried.** The EDA against moral realism does *not* necessarily generalize to sink logic and mathematics because skepticism about the latter is performatively inconsistent. One can be an evolutionary anti-realist about morality without contradiction, but one cannot coherently be an evolutionary skeptic about basic logic while using logic to argue for that skepticism. Evolution explains the *existence* and *specific implementation* of our logical/mathematical faculties, but the justification for trusting their core outputs in basic domains is rescued by their indispensable role as the scaffolding for *any* justification, including the justification for being skeptical about other domains like morality. The bullet of global skepticism need not be bitten. The disanalogy is real and defensible.
