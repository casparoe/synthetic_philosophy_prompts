answer: |-
  You've hit on a major tension in philosophy of causation and ethics! Your intuition is spot-on – the claim that omissions aren't genuine causes *seems* to let negligent people off the hook. But the "omissions aren't causes" camp (e.g., David Lewis, Helen Beebee, Phil Dowe) isn't saying the security guard is blameless. They're making a specific *metaphysical* claim about causation, while *separately* arguing that moral and legal responsibility **don't solely depend on causation**. Here's the breakdown:

  1.  **The Metaphysical Claim: Why "Omissions Aren't Causes"?**
      *   **"Nothing" can't be a cause:** Causes are typically events or states of affairs that *do* something, exerting force or energy. An omission (like *not* pulling the alarm) is an *absence* – the lack of an event. How can "nothing" *make* something happen? It seems passive.
      *   **Causation requires a connection:** Genuine causation often implies a physical connection or process (e.g., energy transfer, mechanism). There's no such connection between the guard's non-action and the fire spreading.
      *   **The Problem of Negative Relata:** Events are typically positive occurrences. If omissions are causes, then causes include *negative* entities (absences), which seems metaphysically messy. How many absences are "causing" the plant's death? Your failure to water it? My failure? The President's failure? This leads to vast overcounting of causes.
      *   **Causation vs. Dependence:** Proponents argue the relationship is *dependence*, not causation. The plant's death *depends* on your not watering it (if watering would have saved it). The deaths *depend* on the guard's failure to act. But dependence isn't the same as causation.

  2.  **Why Responsibility Doesn't Vanish (The Crucial Point):**
      *   **Counterfactual Dependence & Duty:** Moral responsibility hinges on **counterfactual dependence** and **violation of duty**, *not solely* on "but-for" causation.
          *   **Counterfactual:** If the guard *had* pulled the alarm (*ceteris paribus*), the deaths *would not* have occurred (or would have been less likely/severe). The bad outcome *depended* on his inaction.
          *   **Duty:** Crucially, the guard had a **specific duty** (contractual, moral, role-based) to pull the alarm in that situation. He *should* have acted. His failure to fulfill this duty is the core of his culpability.
      *   **Moral Responsibility ≠ Causal Responsibility:** Philosophers like Beebee explicitly distinguish these. You can be *morally responsible* for an outcome because you *allowed* it to happen by failing in your duty, even if you didn't *cause* it in the strict, productive sense. The guard's omission is a **failure to prevent** a harm he had an obligation to prevent.
      *   **Legal Frameworks:** The law recognizes "culpable omission" precisely for cases like the security guard. Liability arises from:
          1.  A duty to act (imposed by law, contract, relationship, or creating the danger).
          2.  The ability to act.
          3.  Failure to act.
          4.  Resulting harm that the action would likely have prevented.
          The law focuses on the breach of duty and the counterfactual link, not on metaphysical causation of the harm *by the absence itself*.

  3.  **Alternative Views (Omissions *Can* Be Causes):**
      *   **Contrastive Causation:** Jonathan Schaffer argues causation is contrastive. We ask "Why did the plant die *rather than live*?" The cause is the *absence* of watering *contrasted* with its presence. The guard's *not-acting* is the cause *contrasted* with his acting.
      *   **Causal Process/Mechanism:** Some argue that omissions *can* be part of causal processes. The guard's inaction allowed the *existing* causal process (the fire spreading) to continue uninterrupted. His omission removed a potential *interrupting* cause (the alarm).
      *   **Pragmatic View:** Causation is often a pragmatic concept. In contexts of responsibility, "the cause" is the most salient factor that made the difference, especially if it involves a failure of expected agency. The guard's omission *is* the salient, blameworthy difference-maker.

  **Conclusion & What You're (Likely) Not Missing:**

  *   **You're right** that the *practical consequence* of letting the guard off the hook is morally unacceptable.
  *   **You're not missing something fundamental** about the moral intuition – the guard *is* responsible.
  *   **The key insight you might be missing** is that the "omissions aren't causes" philosophers **don't deny responsibility**. They argue responsibility flows from **counterfactual dependence plus the violation of a duty**, *not* from the omission being a metaphysical cause in the same way a falling brick is. They bite the bullet on the metaphysics to avoid the problems of negative relata and passive "causes," but use other tools (duty, counterfactuals) to ground responsibility.
  *   **Many philosophers disagree** with the "omissions aren't causes" view precisely because of the moral concerns you raise, and offer alternative accounts of causation that *do* include omissions.

  **So, is the camp "just wrong"?** It depends on your view of causation. Metaphysically, their arguments against absences being causes are strong. Ethically and legally, their position often feels counterintuitive *until* you see they replace "causation" with "duty + counterfactual dependence" as the basis for responsibility. Your security guard example perfectly highlights the challenge and why the debate persists!
