prompt: |-
  I've recently joined the board of a homeowners' association for a condominium development that's being built and sold off in phases: of forty-two planned units, thirty are sold and occupied, and the remaining twelve are still unbuilt or unsold. What began as a routine bylaws review has turned into the most contentious thing the board has faced in years, and after a couple of meetings that generated far more heat than clarity, I'd like a more rigorous outside take than anyone on the board has managed to offer.

  The dispute is nominally just about voting rights, but it keeps fracturing into sub-disputes every time we think we've settled it. Under the current bylaws, one vote attaches to each deed, held by whoever is on the title. About a third of the thirty sold units are owned by investors who rent them out on long leases and have never lived there, while several tenants who've rented for years, attend every meeting, and are bound by every rule the board passes have no vote at all, since tenancy isn't ownership. Meanwhile, the board is about to approve a fifteen-year reserve-funding and renovation plan that will financially bind whoever eventually buys the twelve unsold units — people who, by definition, can't be consulted now. The development company that still holds title to those twelve units, and will cast its votes until each one sells, has said plainly that it intends to vote however keeps its own carrying costs lowest, with no particular loyalty to the future owners it's nominally standing in for. Predictably, the board has split: one faction wants to leave the rule exactly as it is, since "one deed, one vote" is at least unambiguous and hard to litigate; another wants to extend a vote to long-term tenants and hold the unsold units' votes in some kind of trust for their eventual owners, on the theory that whoever actually has to live under a rule has the strongest claim to a say in making it.

  This feels like exactly the kind of dispute that would get a long, careful treatment on a rationalist blog, and I keep wishing someone had already written that post — but since I can't find one, I'd rather reason it through directly than lean on half-remembered analogies. Part of me suspects the "one deed, one vote" camp is really just defending a Schelling point — a rule that's stable and hard to litigate, rather than one that's obviously fair — but administrative simplicity has to count for something, and I don't want to dismiss their position just because it's convenient. More fundamentally, my suspicion is that every one of these proposals quietly smuggles in an answer to the very question it's supposed to be neutral about: there's no way to decide who gets to help decide without having, in some sense, already decided who counts. But I can't tell whether that's a genuine and probably irresolvable problem, or just a sophisticated-sounding rationalization for whichever scheme happens to favor my own preferred outcome. I'd like your honest, fully worked-through answer: is there a principled way to settle who should get a vote in a case like this, and if so, what is it, and why does it beat the alternatives? And if you conclude that the problem is genuinely unfixable in principle, I want the argument for that conclusion, not a diplomatic shrug.
reasoning: |-
  Okay, let me start by really unpacking what this HOA board member is dealing with. They've got a phased condominium development with 42 units—30 sold and occupied, 12 still unsold or unbuilt. The core issue is voting rights, but it's spiraled into multiple sub-disputes. 

  First, I need to understand the key factions: 
  - Current owners (including absentee landlords) have votes under "one deed, one vote."
  - Long-term tenants have no votes despite being affected by rules.
  - The developer holds votes for unsold units but acts in self-interest.
  - Future buyers of the 12 units have no say in current decisions that will bind them financially.

  The user's frustration is palpable—they've had heated meetings, want rigor, and sense that all proposals hide biased assumptions. They mention Schelling points and fairness trade-offs, which tells me they're analytically minded but wary of their own biases.

  Hmm... what's really being asked here? It's not just legal mechanics. They want:
  1. A principled framework for voting rights that doesn't circularly presuppose who "counts."
  2. Honest assessment of whether neutrality is possible.
  3. Clear comparison of alternatives beyond administrative convenience.

  I notice three layers beneath the surface:
  - Moral: Whose interests deserve representation? (Residents? Capital investors? Future owners?)
  - Practical: How to avoid litigation/chaos while binding future parties.
  - Epistemological: Can "fairness" be objective here?

  The user's suspicion that all solutions smuggle in answers is sharp. They're right—any voting rule implicitly defines the community. But that doesn't make all rules equally defensible. We need to evaluate which interests have the strongest claim to representation given the HOA's purpose.

  Let me break down the stakeholders' claims:
  - Tenants: Subject to rules without recourse. But granting votes might complicate ownership rights.
  - Developer: Holds legal title but misaligned incentives with future buyers.
  - Future owners: Will pay for current decisions but can't consent. Binding them is unavoidable in phased developments, but should their "voice" be proxied?
  - Absentee owners: Have financial stakes but may lack local knowledge.

  The reserve fund vote is critical—it's a long-term burden. Letting the developer vote for unsold units here seems especially problematic since they'll offload costs onto others.

  I recall corporate governance parallels: fiduciary duties, pre-IPO shareholder representation. Also condominium law precedents—some jurisdictions prorate developer votes after certain sales thresholds. But the user wants philosophy, not just legal templates.

  Core tension: HOAs exist to manage shared property (ownership-centric), but also create community rules (occupancy-centric). When these conflict, which takes priority?

  Possible principles to weigh:
  1. Affected Interest Principle: Those bearing consequences should have voice.
  2. Investment Principle: Capital at risk warrants control.
  3. Continuity Principle: Rules should bind future owners reasonably.
  4. Administrative Stability: Avoid systems prone to disputes.

  Applying these:
  - Tenants clearly bear consequences but lack investment. Maybe limited votes on usage rules only?
  - Future owners' interests could be protected by freezing unsold units' votes on major capital decisions.
  - Developer votes could be restricted post-phase-1 to prevent self-dealing.

  The "trust" idea for unsold units has merit but raises practicality questions: Who's the trustee? How are future owners identified?

  A hybrid model might work: 
  - Base votes on deeds, but...
  - Cap developer votes at say 30% of total units once 50% sold.
  - Allow tenant advisory votes (non-binding) to surface occupancy concerns.
  - Require supermajorities for decisions binding future owners (e.g., reserve funds).

  But is this principled or just splitting differences? The Affected Interest Principle justifies tenant input, while Investment Principle protects owners. The supermajority requirement for long-term commitments acknowledges future owners' stakes without fictional representation.

  On the "is this unfixable?" question—no, but perfection is impossible. The solution must transparently balance competing legitimate claims rather than pretend neutrality. Precedents like residential tenancy boards show mixed ownership/occupancy governance can work.

  Biggest risk: Overcomplicating the system. Simplicity has value, but shouldn't entrench unfairness. The user should push for incremental changes—maybe pilot tenant advisory votes first—rather than overhaul everything at once.

  Final thought: However they vote, documenting the rationale for fairness (e.g., "We cap developer votes because...") will matter more than the rule itself when future disputes arise.
answer: |-
  Your situation is a fascinating microcosm of governance dilemmas—balancing fairness, practicality, future obligations, and conflicting stakeholder interests. There is a principled resolution, but it requires rejecting the false dichotomy of "one deed, one vote" versus "trust-based representation." The solution lies in **separating voting rights from pure ownership for specific classes of decisions**, grounded in three core principles:  

  1.  **The Affected Interest Principle:** Those directly bound by a decision’s consequences deserve influence proportional to their stake.  
  2.  **The Anti-Hijacking Principle:** No party should control decisions where their interests conflict with those they nominally represent.  
  3.  **The Future-Binding Principle:** Decisions committing future owners require stronger consensus and safeguards.  

  Here’s how to apply this framework:  

  ### 1. **Resolve the Tenant Voting Issue**  
     - **Problem:** Tenants bear daily costs of HOA rules but lack recourse.  
     - **Principle:** *Affected Interest* justifies partial representation, but *Investment Principle* limits it (tenants don’t bear capital risk).  
     - **Solution:**  
       - Grant tenants **non-binding advisory votes** on rules directly impacting *occupancy* (e.g., noise policies, amenity hours).  
       - For *capital/financial decisions* (e.g., reserve funding), retain owner-only votes.  
     - **Why it works:**  
       - Tenants gain voice in livability issues without undermining ownership rights.  
       - Prevents "double representation" (an owner couldn’t vote their deed *and* their tenancy).  
       - Administratively simple: Tenants register leases >1 year for voting eligibility.  

  ### 2. **Neuter the Developer’s Conflict of Interest**  
     - **Problem:** The developer votes on costs they’ll avoid, harming future owners.  
     - **Principle:** *Anti-Hijacking Principle* forbids letting conflicted parties decide for others.  
     - **Solution:**  
       - For unsold units, the developer **retains title but forfeits voting rights** on:  
         - Any decision with costs extending >3 years (e.g., your 15-year reserve plan).  
         - Amendments to bylaws/covenants binding future owners.  
       - Instead, these items require **supermajority approval** (e.g., 75%) of *sold units only*.  
     - **Why it beats a "trust"**:  
       - A "trust" for future owners is legally nebulous and unworkable (who is the trustee?).  
       - Supermajority of sold units ensures broad consensus without pretending to represent unknowns.  
       - Developer keeps votes for routine operational decisions (e.g., landscaping contracts) where conflicts are minimal.  

  ### 3. **Lock in Fairness for Future Owners**  
     - **Problem:** Current votes impose costs on future buyers.  
     - **Principle:** *Future-Binding Principle* demands higher scrutiny for long-term commitments.  
     - **Solution:**  
       - Any vote committing HOA funds beyond a threshold (e.g., >$10,000/unit) or >5 years requires:  
         - A **disclosure report** projecting costs/savings for future owners.  
         - **Ratification** by a simple majority of owners *after* the unsold units reach 50% occupancy.  
     - **Why it works:**  
       - Forces current owners to justify decisions to future stakeholders.  
       - Avoids paralysis—actions proceed post-vote, but future owners can repeal egregious commitments.  

  ### Why This Beats the Alternatives  
  - **Vs. "One Deed, One Vote":**  
    Pure ownership voting ignores *who* bears costs (tenants) and enables exploitation (developer). It’s administratively simple but morally bankrupt in phased developments.  

  - **Vs. "Trusts/Proxy Voting":**  
    Inventing proxies for future owners creates legal uncertainty. Supermajority requirements are cleaner and courts routinely uphold them. Tenants gain voice without fictionalizing ownership.  

  - **Vs. "Do Nothing":**  
    Maintaining the status quo risks:  
    - A developer-approved reserve fund that underfunds maintenance, harming future owners.  
    - Tenant discontent boiling into noncompliance or litigation.  
    - Long-term decline in property values.  

  ### Addressing Your Meta-Concern  
  You’re correct that *all* voting systems "smuggle in" values. But this isn’t irresolvable—it just requires explicit principles. Here, we prioritize:  
  - **Occupancy interests** for community rules.  
  - **Capital interests** for financial risks.  
  - **Collective oversight** for binding future parties.  

  Administrative simplicity is preserved by limiting complex rules to high-stakes decisions. Legally, this framework draws from:  
  - **Condominium Acts** (many states cap developer votes post-sale thresholds).  
  - **Corporate Governance** (recusing conflicted directors).  
  - **Land Trusts** (separating control from beneficial interest).  

  ### Final Recommendation  
  Propose a bylaw amendment that:  
  1. Grants tenants advisory votes on occupancy rules.  
  2. Revokes developer votes on future-binding financial/structural decisions.  
  3. Requires supermajority (75%) of sold units for projects binding future owners.  
  4. Mandates cost disclosures and allows future ratification.  

  This balances fairness, practicality, and foresight. It won’t please absolutists—but it protects the community from hijacking while acknowledging that governance must serve those who live with its consequences. If the board rejects this, document the dissent. When the developer’s cheap repairs fail in 10 years, you’ll want evidence they voted to underfund reserves against resident interests.
