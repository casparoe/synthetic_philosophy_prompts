answer: |-
  Your experience reveals a fundamental truth in social choice theory, not a flaw in your redesign efforts. What you encountered is **strategic voting** (or tactical/manipulative voting), and its near-inevitability in ranked-choice systems with more than two options is a profound result known as the **Gibbard-Satterthwaite theorem** (1973/1975).

  Here's why your frustration is justified by deep theory:

  1.  **The Gibbard-Satterthwaite Theorem:** This landmark theorem states that for any voting system that:
      *   Has **three or more distinct possible outcomes** (candidates).
      *   Is **non-dictatorial** (no single voter always determines the winner).
      *   Is **onto** (every candidate has a chance to win under *some* configuration of honest preferences).
      *   Uses voters' **ranked preferences** as input.
      ...then the system is **susceptible to strategic voting**. That is, there will *always* exist *some* profile of other voters' preferences where *at least one* voter can achieve a *better* outcome by submitting a *dishonest* ranking than they would by submitting their honest ranking.

  2.  **What This Means for Your Committee:**
      *   **Not Your Fault:** Your inability to find an immune system isn't due to lack of ingenuity. It's mathematically provably impossible under the conditions above.
      *   **The Member Was Rational:** The committee member who strategically demoted her favorite acted rationally within the system you used. She identified a situation (based on her beliefs about others' votes) where honesty would lead to her worst outcome, and manipulation led to a better (though not ideal) outcome.
      *   **Every System Has Weaknesses:** Whether it's Plurality, Borda Count (like your point system), Instant-Runoff Voting (IRV), Copeland, or even Condorcet methods (which seek pairwise winners), each has specific profiles of preferences where strategic voting can be advantageous for some voter. The *type* of strategy might differ (e.g., truncating rankings in IRV vs. boosting a compromise in Borda vs. "burying" a strong rival in some Condorcet methods), but the vulnerability exists.

  3.  **Why Elimination Rounds Don't Solve It:**
      *   Systems like IRV (which uses elimination rounds) are specifically designed to handle vote-splitting and improve on plurality, but they are *not* strategy-proof.
      *   **Examples of IRV Strategy:**
          *   **Compromising:** A voter might rank a viable compromise candidate *above* their true favorite if they believe their favorite can't win, to prevent their least favorite from winning (similar to your member's move, but happening *during* the ranking).
          *   **Burying:** A voter might rank a strong rival to their favorite *last* (even if they moderately like them) to get them eliminated earlier, hoping their favorite can then beat the remaining field.
          *   **Truncation:** Not ranking all candidates (if allowed) to avoid accidentally helping a less-preferred candidate beat a more-preferred one in a later round.

  4.  **The Core Problem:**
      *   **Conflict Between Individual and Collective Rationality:** What's best for an individual voter isn't always aligned with the outcome produced by aggregating *honest* preferences according to a fixed rule.
      *   **Incomplete Information:** Voters act based on their *perception* of how others will vote. Strategy arises when a voter sees a way to exploit the rules, given their beliefs, to steer the outcome away from a worse scenario.
      *   **Complexity of Preferences:** With >2 options, cycles (Condorcet Paradox) and non-transitive collective preferences are possible, creating inherent instability that strategies can exploit.

  **What This Means for Your Conference Committee:**

  1.  **Accept the Inevitability:** No perfect, strategy-proof ranked-choice system exists for 4 candidates. Don't waste energy searching for one that doesn't exist. Focus on choosing a system that is generally perceived as fair, reflects collective preferences reasonably well *when voters are honest*, and whose strategic vulnerabilities are perhaps harder to exploit or predict in your specific small-committee context.
  2.  **Choose a "Resistant" System (Not Immune):** Some systems are considered *more resistant* to certain types of strategy than others, though all are vulnerable. Condorcet methods are often seen as robust but complex. IRV can be good but has known strategic vulnerabilities. Borda Count (which you used) is simple but explicitly vulnerable to the type of strategy your member employed (insincerely boosting a compromise).
  3.  **Manage Expectations & Foster Honesty:** Be transparent about the impossibility of perfect strategy-proofing. Emphasize the goal of finding the speaker best reflecting the *genuine* collective preference of the committee. Encourage members to vote honestly unless they see a *clear and present danger* of their worst outcome winning, acknowledging that strategic guesses can sometimes backfire.
  4.  **Consider the Context:** In a small committee with discussion, the perceived need for strategy might be lower than in a large anonymous election. Open discussion can sometimes reveal shared preferences or viable compromises, reducing the incentive for individual manipulation. The member's *admission* suggests a culture where honesty is valued.
  5.  **Alternative Approaches (With Caveats):**
      *   **Approval Voting:** Voters select *all* candidates they find acceptable. Simpler, harder to "spoil" the vote, and often resists some common strategies better than ranked systems. However, it doesn't capture *strength* of preference well and can lead to winners perceived as bland compromises. (Gibbard-Satterthwaite doesn't apply directly as it's not a ranked preference system).
      *   **Random Ballot:** Pick one voter's ballot at random and use their top choice. Strategy-proof but obviously undemocratic for a committee decision.
      *   **Consensus Building:** Focus on discussion to find a candidate acceptable to all, avoiding a formal vote if possible. Time-consuming and may not always work.

  **Conclusion:**

  Your member's action wasn't a sign of a flawed system *per se*, but an illustration of a **fundamental limitation in democratic decision-making with multiple options**. The Gibbard-Satterthwaite theorem provides the deep reason: no ranked-choice voting system meeting basic fairness criteria can be immune to strategic voting when there are three or more choices. Your redesign efforts hit this mathematical wall. The best practical approach is to choose a reasonably good system, understand its vulnerabilities, foster a culture of honesty, and accept that perfect strategy-proofing is unattainable. This insight is a core lesson in political science itself – the inherent tensions between individual rationality, collective choice, and institutional design.
