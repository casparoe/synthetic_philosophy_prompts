prompt: |-
  I've been a longtime lurker on LessWrong and Astral Codex Ten, and a recent thread rehashing the "coherence theorems imply expected-utility maximization" debate sent me back to the money-pump literature, where I got stuck on something the standard expositions tend to gloss over. The textbook argument is familiar enough: if your preferences over A, B, and C are cyclical, a bookie can walk you through a sequence of trades, each of which looks like a strict improvement at the moment you make it, until you've paid several small fees to end up back with the option you started with. The usual moral drawn is that cyclical preferences are irrational.

  What's nagging at me is the naive/sophisticated/resolute trichotomy that's supposed to map out the possible responses to this setup. A naive agent just walks into the pump. A sophisticated agent, foreseeing the whole sequence, refuses the first trade rather than be led step by step to a predictably regrettable finish. A resolute agent, in something like McClennen's sense, commits to a plan in advance and then actually goes through with the final trade even though, taken in isolation, it wouldn't choose it -- and thereby dodges the pump too, since the eventual "loss" was priced in from the start. Crucially, both strategies leave the agent's cyclical ranking fully intact; what's being vindicated as "rational" is a diachronic choice disposition, not the synchronic shape of the preference ordering. Resoluteness in particular has always struck critics as suspicious for exactly this reason: it looks like it could rescue almost any preference pattern from almost any pump, since you can always just precommit to stomach the bad-looking final move, which is usually taken as a mark against resolute choice rather than a vindication of cyclical preferences. And yet I keep running into what looks like the very same move being redeployed, apparently uncontroversially, on the other side of recent coherence-theorem debates -- the claim that an agent with incomplete rather than cyclical preferences can dodge the analogous money pump for completeness once it's allowed to choose in a suitably farsighted, non-myopic way.

  So here's what I'd like help untangling. Is there a principled, mechanics-level reason why farsighted choice legitimately blocks the money pump for incompleteness without equally rescuing the cyclic-preference case it was originally invoked for (and where it's usually considered question-begging) -- something about what each kind of agent actually has to give up or commit to in the two cases -- or does taking the "farsighted agents dodge the pump" move seriously for incompleteness commit you to thinking the classic argument against intransitivity never showed anything either? I'd like you to work through the actual structure of the two pumps and what a sophisticated or resolute agent's choices look like in each, rather than just reporting that people disagree about it.
reasoning: |-
  Okay, the user is diving deep into decision theory, specifically money pumps and how they relate to cyclic preferences versus incomplete preferences. They've been following discussions on LessWrong and Astral Codex Ten, and they're stuck on why farsighted choice can block the money pump for incompleteness but not for cyclic preferences. They want a mechanics-level explanation, not just a summary of existing debates.

  First, I need to recall the standard money pump arguments. For cyclic preferences (A>B, B>C, C>A), the agent pays to trade A for B, then B for C, then C for A, ending up with A but poorer. The naive agent gets pumped. The sophisticated one refuses the first trade to avoid the cycle. The resolute one precommits to a plan, like stopping after two trades, avoiding the pump but keeping cyclic preferences. Critics say resoluteness can justify any preference, which is suspicious.

  For incomplete preferences, say the agent can't compare A and B. The pump offers a series of trades: start with A, pay a fee to get A+, which is strictly better than A, then trade A+ for B (since they're incomparable, but the fee is small, so they might accept). Then pay another fee to get B+, then trade B+ back to A. The agent ends up with A but paid fees twice. The key here is that the trades involve "sweetened" options (A+, B+) that are strictly better, so refusing any trade might seem irrational.

  The user's confusion is why farsighted choice works for incompleteness but not cycles. They mention that in recent coherence debates, allowing farsighted choice blocks the incompleteness pump, but doing the same for cyclic preferences is seen as question-begging. So, where's the difference?

  Breaking it down: In the cyclic case, refusing the first trade (sophisticated) or precommitting (resolute) avoids the pump without changing preferences. But resoluteness is controversial because it seems ad hoc. For incompleteness, a sophisticated agent foresees the whole pump. When offered A to A+ for a fee, they accept because A+ is strictly better. Then, when offered A+ to B for a fee, they might refuse if they see that later they'll be offered B to B+ and then B+ back to A. Realizing they'll end up paying two fees and back at A, they refuse the A+ to B trade. Since the agent never makes that trade, they avoid the pump. Importantly, refusing the second trade isn't irrational because moving from A+ to B isn't a strict improvement—it's incomparable, so no loss in refusing. Thus, the sophisticated agent blocks the pump without needing resoluteness or changing preferences.

  The key difference is that in the cyclic pump, each step is a strict improvement (due to the cycle), so refusing any trade seems irrational. But in the incompleteness pump, only the sweetened trades (A to A+, B to B+) are strict improvements; the swaps between incomparables (A+ to B, B+ to A) aren't, so refusing them is rational. Thus, farsightedness works for incompleteness without controversy because it doesn't require precommitment; it's just avoiding non-improving trades. For cyclic preferences, farsightedness requires refusing trades that are individually beneficial, which is harder to justify. That's the mechanics-level reason the user is seeking.
answer: |-
  The tension you're highlighting is profound and cuts to the heart of how we interpret rationality in sequential choice. You're right that both cyclic preferences and incomplete preferences face money-pump arguments, and both sophisticated/resolute agents can *seem* to dodge them while retaining their "flawed" preferences. The key difference lies in **what constitutes a rational refusal at each choice node** and **the nature of the trade-offs being avoided**. Let's break down the mechanics of both pumps side-by-side.

  ### 1. **The Cyclic Preference Money Pump (Standard Version)**
  *   **Preferences:** A > B, B > C, C > A (Strict cycle).
  *   **Pump Sequence:** Start with A.
      1.  **Trade 1:** Pay ε to trade A for B. (Rational *now* because A > B, and ε is small).
      2.  **Trade 2:** Pay ε to trade B for C. (Rational *now* because B > C).
      3.  **Trade 3:** Pay ε to trade C for A. (Rational *now* because C > A).
  *   **Result:** End up with A, but paid 3ε. Net loss.

  *   **Sophisticated Agent:**
      *   Foresees the entire sequence.
      *   At the *first node*, it knows: Accepting Trade 1 leads to accepting Trade 2, which leads to accepting Trade 3, resulting in A-3ε.
      *   **Refuses Trade 1.** Why? Because the *consequence* of accepting Trade 1 is ending up with A-3ε, which is *worse* than keeping A (since losing money is bad, and A-3ε < A).
      *   **Cost:** Gives up the *apparent* improvement (A to B) available at Node 1. This refusal *looks irrational* from the myopic perspective of Node 1 (where A > B suggests paying ε to get B is good) but is rational given foresight.
      *   **Preference Impact:** Cyclic preferences remain intact. Sophistication blocks the pump by refusing a trade that *seems* beneficial in isolation but leads predictably to a net loss.

  *   **Resolute Agent:**
      *   Precommits to a plan (e.g., "I will only do the first two trades: get C and stop").
      *   Executes Trades 1 & 2: Pays 2ε, ends up with C.
      *   **Refuses Trade 3.** Why? Because its plan says to stop at C. Even though C > A *now*, it sticks to the plan.
      *   **Cost:** Pays 2ε and ends up with C, which it values less than A (since A > B > C implies A > C). It avoids the *full* 3ε loss but still suffers a net loss (has C instead of A, paid 2ε). Crucially, refusing Trade 3 *looks irrational* at Node 3 (C > A suggests paying ε to get A is good).
      *   **Preference Impact:** Cyclic preferences remain intact. Resoluteness blocks the *full cycle* but only by accepting a *predictable suboptimal outcome* (C-2ε) relative to the starting point (A) due to refusing a locally preferred trade later. This is why critics find it suspicious: it allows keeping cyclic preferences by accepting a known loss relative to the initial position.

  ### 2. **The Incompleteness Money Pump (Sweetened Pump)**
  *   **Preferences:** A ~ B (Incomparable/No strict preference), A < A+ (Strictly better), B < B+ (Strictly better).
  *   **Pump Sequence:** Start with A.
      1.  **Trade 1:** Pay ε to trade A for A+. (Rational *now* because A < A+).
      2.  **Trade 2:** Pay ε to trade A+ for B. (Problematic! Why? A+ and B are *incomparable*. Paying ε to move from A+ to B is *not* a strict improvement; it's paying to move to an incomparable state).
      3.  **Trade 3:** Pay ε to trade B for B+. (Rational *now* because B < B+).
      4.  **Trade 4:** Pay ε to trade B+ for A. (Problematic! Again, B+ and A are incomparable. Paying ε to move to A is not a strict improvement).
  *   **Result:** End up with A, but paid 4ε. Net loss.

  *   **Sophisticated Agent (Farsighted Choice is Key Here):**
      *   Foresees the entire sequence.
      *   At **Node 1:** Accepting Trade 1 (A to A+ for ε) *is* rational (A < A+). It accepts.
      *   At **Node 2:** It now holds A+. It foresees: Accepting Trade 2 (A+ to B for ε) leads to Node 3. At Node 3, it *will* rationally accept Trade 3 (B to B+ for ε, because B < B+), arriving at Node 4 holding B+. At Node 4, it *will* rationally accept Trade 4 (B+ to A for ε, because... wait! **Here's the Crucial Difference**).
      *   **Decision at Node 2:** The agent sees the *consequence* of accepting Trade 2: It will pay ε (Trade 2), then pay ε (Trade 3) to get B+, then pay ε (Trade 4) to get back to A. **Net result: Started with A, ended with A, paid 3ε (Trades 2, 3, 4).** Compared to its *current state* (A+), this outcome (A-3ε) is **strictly worse** because A+ > A (and losing money makes it A+-3ε >? A-3ε, but clearly A+ > A implies A+-3ε > A-3ε). Moving to A-3ε from A+ is a *strict deterioration*.
      *   **Refuses Trade 2.** Why? Because the *foreseen consequence* (A-3ε) is strictly worse than its *current holding* (A+). **This refusal is rational *even myopically* at Node 2!** Paying ε to move from A+ to an outcome (A-3ε) that is strictly worse than A+ (since A+ > A and losing money is bad) is *never* rational. The agent doesn't need to appeal to incompleteness here; the outcome is strictly dominated.
      *   **Result:** Agent has A+ - ε (paid once). This is strictly better than the starting point A (A+ - ε > A). **Pump Blocked.** No further trades occur. The agent *gains* from the first trade and stops.
      *   **Preference Impact:** Incompleteness (A ~ B) remains intact. The refusal at Node 2 is justified *solely* by the strict dominance of keeping A+ over the foreseen net-loss outcome A-3ε. It doesn't require refusing a strictly beneficial trade (like the cyclic sophisticated agent does), nor does it require resolute precommitment to a plan that violates local preferences later. It simply avoids a trade that leads predictably to a strictly worse outcome than the status quo.

  ### The Principled Difference: Mechanics-Level Reasons

  1.  **Nature of the "Bad" Trade:**
      *   **Cyclic Pump:** *Every individual trade* in the sequence (when considered *myopically at the moment it's offered*) **is a strict improvement** according to the agent's preferences (A > B, B > C, C > A). Refusing *any* of them looks locally irrational. The sophisticated agent's refusal at Node 1 sacrifices a *locally beneficial* trade to avoid a *global* net loss. The resolute agent's refusal at Node 3 sacrifices a locally beneficial trade based on a prior plan.
      *   **Incompleteness Pump:** Only the "sweetening" trades (A to A+, B to B+) are **strict improvements**. The "swap" trades (A+ to B, B+ to A) are **not strict improvements** (they move between incomparables *while paying a fee*). Refusing these swap trades is **locally rational** *even without foresight*: paying ε to move to an incomparable state is not required by rationality. Foresight simply allows the agent to see that accepting one swap trade inevitably leads to more fees and ends up strictly worse off than the current state.

  2.  **Justification for Refusal:**
      *   **Cyclic Sophistication:** Refusal is based on avoiding a *predictable net loss outcome*. This requires the agent to *value the global outcome over the local improvement*, which is the core of sophistication. It *overrides* the local strict preference.
      *   **Incompleteness Sophistication:** Refusal is based on the *strict dominance* of the current state over the foreseen outcome of the sequence. The agent doesn't need to override a local strict preference because **the trade offered (A+ to B for ε) is *not* preferred locally.** Paying ε to move to an incomparable state is irrational *at that node*, full stop. Foresight just reveals the *magnitude* of the irrationality (ending up strictly worse, not just incomparable).

  3.  **Outcome for the Sophisticated Agent:**
      *   **Cyclic:** Ends up with the *starting option* (A), having made *no trades and gained nothing*. It avoided loss by refusing beneficial trades.
      *   **Incompleteness:** Ends up *strictly better off* (A+ - ε > A), having made *one* beneficial trade. It avoided loss by refusing a *non-beneficial* trade.

  **Conclusion:** The farsighted (sophisticated) response **legitimately blocks the incompleteness money pump without rescuing cyclic preferences** because:

  1.  In the incompleteness pump, the critical refusal (of the swap trade) is **justified locally** at the choice node where it occurs. Paying a fee to move to an incomparable state is inherently non-compelling. Foresight merely reveals that accepting it leads to a *strictly dominated* outcome, strengthening the rationale for refusal. The agent gains from the beneficial part of the sequence and avoids the non-beneficial, loss-inducing part.
  2.  In the cyclic pump, the critical refusal (of the first trade) **overrides a locally strict preference**. While rational diachronically, it requires sacrificing a perceived immediate benefit to avoid a future net loss. This feels like a genuine cost of maintaining cyclic preferences. Resoluteness blocks the full cycle but only by accepting a predictably suboptimal outcome relative to the start (e.g., C-2ε instead of A), also at a cost.

  **Therefore, the "farsighted agents dodge the pump" move works cleanly for incompleteness** because it exploits the fact that the pump relies on inducing trades that are *not locally rational* once the sweeteners are in play. **It does not similarly rescue cyclic preferences** because the cyclic pump relies on trades that *are* individually locally rational; dodging it requires either refusing those beneficial trades (sophistication) or overriding local rationality later (resoluteness), both of which involve recognizable costs attributable to the cyclic preferences themselves. The incompleteness pump fails against sophistication precisely because the swap trades lack the local rational compulsion that the cyclic trades possess.
