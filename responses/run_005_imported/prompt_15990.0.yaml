prompt: |-
  Had a long, slightly drunk argument with my friend Priya last night that I still can't shake. She's finishing a philosophy MSc and got going on this thing called the "problem of old evidence" in Bayesian confirmation theory — apparently a classic objection (Glymour, I think, back in like 1980?) to the standard Bayesian line that evidence E confirms a hypothesis H when P(H|E) > P(H). Her example was the anomalous precession of Mercury's perihelion, which had already been measured decades before Einstein came up with general relativity. She was adamant that since that data was already known (so P(E) = 1 in your credence function before GR even existed as a hypothesis), plain conditionalization forces P(H|E) = P(H) for any H whatsoever — meaning strict Bayesianism says Mercury's perihelion gives GR literally zero confirmation. Which feels backwards, since everyone treats that as one of the most dramatic confirmations in the history of physics.

  I nodded along at the bar like I got it, but honestly I don't really see WHY the math forces that conclusion, or why it counts as a deep problem for Bayesianism rather than just a weird artifact of how you're defining P(E) in the first place. Then she started throwing around "the Garber-Jeffrey move" and something about scientists not being logically omniscient, and I completely lost the thread. Could you (a) actually build up the intuition for why old evidence breaks naive Bayesian updating, in a way I could reconstruct myself rather than just citing the formula, and (b) tell me whether the Garber-Jeffrey-style fix (or whatever solution you personally think is best) genuinely resolves the problem, or if it's more of a patch that just relocates it somewhere else? I don't need the full formal apparatus with density functions and all that, just enough real substance that I'm not just hand-waving the next time this comes up.
reasoning: |-
  Okay, the user had a drunk argument with their friend Priya about the problem of old evidence in Bayesian confirmation theory. Priya used the Mercury perihelion example to argue that Bayesianism can't account for how old evidence confirms new theories. The user wants to understand why this is a problem and if the Garber-Jeffrey solution fixes it.

  First, I need to recall the core issue. The problem arises because if evidence E is already known, P(E) = 1. Then, by the definition of conditional probability, P(H|E) = P(H) since P(E) in the denominator is 1. That means no confirmation. But intuitively, Mercury's data did confirm GR. So why does the math force this? The user is confused about why this is a deep problem and not just a quirk of defining P(E).

  The user's deeper need is to grasp the intuition behind the problem and the solution without getting bogged down in formalities. They want to reconstruct the argument themselves and understand if Garber-Jeffrey genuinely resolves it or just moves the problem. They mentioned losing the thread when Priya brought up logical omniscience, so I should clarify that connection.

  Breaking it down: Bayesian updating relies on changing credences when new evidence arrives. But if E is old, it's not new. So how can it cause an update? The key is that when Einstein developed GR, he didn't logically connect it to Mercury's perihelion immediately. Before that connection, P(E) was 1, but P(E|H) wasn't necessarily 1. The realization that H entails E is new evidence. That's the Garber-Jeffrey move: conditionalizing on the logical relationship, not just E.

  But does this solve the problem? It shifts the issue to how we assign probabilities to logical statements. Scientists aren't logically omniscient, so before realizing H entails E, P(H|E) might not equal P(H). Once they see the entailment, P(E|H) becomes 1, and confirmation happens. However, this introduces the problem of logical omniscience. Bayesian agents are idealized to know all logical truths, but real scientists don't. So the solution avoids the old evidence problem but highlights the unrealistic assumption of logical omniscience.

  The user needs a clear example. Maybe reconstruct Einstein's thought process: before GR, Mercury's data is known (P(E)=1). He develops GR but doesn't immediately see the link. At that point, P(H) is his prior for GR. Once he derives Mercury's precession from GR, he learns H⊨E. Now, conditionalizing on that, P(H|H⊨E) should be higher. The confirmation comes from recognizing the implication, not the evidence itself.

  But is this satisfying? It explains why scientists see confirmation, but the reliance on logical learning might feel like a patch. The user might wonder if this just moves the problem to assigning credences to logical truths. Still, most philosophers accept this as a valid solution because it mirrors how scientists actually work—discovering implications between theories and data.

  So, to summarize: the problem is real for naive Bayesianism because old evidence with P(E)=1 prevents updating. Garber-Jeffrey fixes it by conditionalizing on the discovery of logical relationships, which accounts for the cognitive process. The unresolved issue is logical omniscience, but that's a broader problem for Bayesian epistemology. The user can explain that the confirmation occurs upon realizing the hypothesis predicts the evidence, solving the initial paradox.
answer: |-
  You've hit on one of the deepest and most persistent debates in philosophy of science. Priya's absolutely right that the problem of old evidence (POE) is a serious challenge to *naive* Bayesianism. Let's break it down intuitively, reconstruct the core issue, and see how the Garber-Jeffrey move addresses it (and where it might leave open questions).

  ### (a) Why Old Evidence Breaks Naive Bayesianism: The Mercury Perihelion Case Reconstructed

  1.  **The Core Bayesian Idea (Confirmation):**
      *   Evidence `E` confirms hypothesis `H` if learning `E` *increases* your confidence in `H`: `P(H|E) > P(H)`.
      *   This happens via Bayes' Theorem: `P(H|E) = [P(E|H) * P(H)] / P(E)`.
      *   Key: The update occurs when you learn `E` *for the first time*. `P(H)` is your credence *before* learning `E`.

  2.  **The Old Evidence Scenario (Einstein & Mercury):**
      *   `E`: The precise value of Mercury's anomalous perihelion precession (known accurately by ~1882).
      *   `H`: Einstein's General Relativity (GR) (developed ~1915).
      *   **Crucially, when Einstein first formulated GR, `E` was already known to him (and the physics community).**
      *   Therefore, *before Einstein even considered GR*, `E` was part of his background knowledge. In his subjective probability function *at the moment GR was conceived*, `P(E) = 1`. It's not "new" evidence; it's old news.

  3.  **The Mathematical Trap:**
      *   Recall Bayes' Theorem: `P(H|E) = [P(E|H) * P(H)] / P(E)`.
      *   **If `P(E) = 1` (because `E` is known background knowledge) *and* we assume conditionalization is the *only* way to update, then:**
          `P(H|E) = [P(E|H) * P(H)] / 1 = P(E|H) * P(H)`
      *   **Now, what is `P(E|H)`?** Since `E` is already known (`P(E)=1`), and assuming your probability assignment is logically coherent, *you must assign* `P(E|H) = 1` as well. Why?
          *   If you *know* `E` is true (`P(E)=1`), then *conditional on any hypothesis `H`*, `E` must still be true. Knowing `H` doesn't make known facts false. `P(E|H)` asks "How likely is `E` if `H` is true?" Since you *know* `E` is true regardless, the answer is 1.
      *   **Therefore:** `P(H|E) = [1 * P(H)] / 1 = P(H)`.
      *   **Conclusion:** According to naive conditionalization, `E` does *not* increase the probability of `H`. `P(H|E) = P(H)`. Confirmation is zero.

  4.  **The Intuitive WTF Moment:**
      *   This feels absurd. Mercury's perihelion *was* a stunning confirmation of GR! Einstein was thrilled when he calculated it matched. Physicists universally cite it as crucial evidence.
      *   **The Core Problem:** Naive Bayesianism seems to say that *because you already knew the evidence*, learning the hypothesis can't make that evidence any *more* expected or surprising. It was already fully absorbed. The "update" happened when you *first* learned `E` decades earlier. There's no *new* information (`E`) to trigger a change in `P(H)` relative to your *current* background knowledge (which already includes `E`).

  5.  **Why It's Deep, Not Just a Quirk:**
      *   It's not just about Mercury/GR. Think of any major theory confirmed by *existing* data: Darwin & biogeography, Plate Tectonics & fossil distributions, Quantum Mechanics & the stability of atoms.
      *   The problem strikes at the heart of the Bayesian claim to model *scientific reasoning*. Science constantly uses *old* data to confirm *new* theories. If Bayesianism can't capture this, its claim to be a normative model of scientific confirmation is severely undermined.
      *   It highlights the **tension between logical omniscience and learning**: The argument relies on the agent (Einstein) being *logically omniscient* enough to recognize that `P(E|H)` *must* be 1 if `H` entails `E` and `P(E)=1`. But real scientists aren't logically omniscient! Einstein didn't *instantly* know GR entailed the Mercury anomaly; he had to *work it out*.

  ### (b) The Garber-Jeffrey Move (and Its Merits/Limitations)

  Daniel Garber and Richard Jeffrey proposed the most influential solution. Their key insight: **When a scientist like Einstein realizes that their new hypothesis `H` *entails* the old evidence `E`, *that realization itself is new evidence!***

  1.  **The Move Step-by-Step (Using Einstein):**
      *   **Time t0 (Before GR):** Einstein knows `E` (Mercury data). `P_0(E) = 1`. He has some prior over all possible physics `P_0(H_old)`.
      *   **Time t1 (GR Conceived):** Einstein formulates GR (`H`). His background knowledge *still* includes `E` (`P_1(E) = 1`). Crucially, **at t1, he does *not* yet know that `H` entails `E`.** He hasn't done the math. Let `L` be the logical proposition "`H` entails `E`" (`H ⊨ E` or `H → E`). At t1, `P_1(L)` is *not* necessarily 1. He might suspect it, but he hasn't proven it.
      *   **Time t2 (The Derivation):** Einstein sits down, works through the complex field equations for Mercury's orbit, and **discovers `L` is true: `H` *does* entail `E`.** He learns `L`.
      *   **The Update:** Einstein updates his beliefs *by conditionalizing on `L`*, not directly on `E` (which he already knew). We calculate `P_2(H) = P_1(H | L)`.

  2.  **Why This (Seemingly) Solves the Problem:**
      *   Before learning `L` (at t1), `P_1(E | H)` might be *less than 1*. Why? Because Einstein isn't sure yet if GR (`H`) actually predicts `E`. Maybe GR predicts something close but not exact? Maybe it predicts the opposite? `P_1(E | H)` reflects his uncertainty *before doing the derivation*.
      *   Learning `L` (`H` entails `E`) drastically changes `P(E | H)`. Once you know `H` entails `E`, you *must* set `P(E | H) = 1` (assuming logical coherence). **The key is that `P_1(E | H)` was *not* 1 before learning `L`.**
      *   **Apply Bayes' Theorem to `L` (at t1 -> t2):**
          `P_1(H | L) = [P_1(L | H) * P_1(H)] / P_1(L)`
      *   **`P_1(L | H)`:** How likely is it that `H` entails `E` *given that `H` is true*? If `H` is true, and `H` entails `E`, then `L` is true. If `H` is true but doesn't entail `E`, `L` is false. Garber/Jeffrey argue that `P_1(L | H)` should generally be *high* (if `H` is true, it probably entails true consequences like `E`), but crucially, **it's not necessarily 1**. Einstein might think GR is true but worry it *doesn't* predict Mercury correctly.
      *   **`P_1(L)`:** How likely did Einstein think it was *before the derivation* that GR would entail the *exact* Mercury anomaly? This might be moderate or low – it was a notoriously difficult problem!
      *   **The Confirmation:** Because `P_1(L | H)` is high (perhaps close to 1) and `P_1(L)` is significantly less than 1 (he wasn't sure GR would predict `E`), learning `L` (`P_1(H | L)`) will be *greater* than `P_1(H)`. **Confirmation!** The increase comes from the *surprise* or *unexpectedness* that this new, complex theory `H` *just happens* to nail this known, puzzling result `E`. Learning the *logical connection* `L` was the new information.

  3.  **Does it Genuinely Resolve the Problem? Merits:**
      *   **Intuitive Fit:** It perfectly mirrors the scientific experience. Einstein's "Aha!" moment wasn't learning Mercury's orbit data (he knew that); it was *seeing GR generate that specific number* from its core principles. The *discovery of the entailment* was the crucial new evidence.
      *   **Formally Coherent:** It stays within the Bayesian framework, using standard conditionalization on a genuinely new piece of information (`L`).
      *   **Solves the POE for Key Cases:** It successfully shows how old evidence *can* confirm a new hypothesis within Bayesianism by focusing on the *learning of the logical relationship*.

  4.  **Is it Just a Patch? Limitations & Lingering Issues:**
      *   **The Problem of Logical Omniscience Relocated:** The solution *depends* on the scientist *not* knowing all logical consequences upfront (`P_1(L) < 1`). But a truly logically omniscient agent would *already* know `L` at t1! For such an agent, `P_1(L) = 1`, and we're back to `P_1(H | L) = P_1(H)` – no confirmation. Garber-Jeffrey saves Bayesianism by making it model *real, non-omniscient scientists*, not ideal agents. This is often seen as a *strength* (it makes the model more realistic), but it highlights that **logical omniscience remains a fundamental, unsolved idealization problem *within* Bayesian epistemology.** The "patch" is acknowledging agents are fallible.
      *   **Formalizing `L` & Assigning `P_1(L | H)` / `P_1(L)`:**
          *   What *exactly* is `L`? Is it pure logical entailment? Or "`H` entails `E` *within our best current mathematical framework*"? (Newtonian mechanics couldn't derive `E` from Newton's `H`!).
          *   Assigning probabilities like `P_1(L | H)` and `P_1(L)` can seem mysterious or subjective. How *should* Einstein assign the probability that GR entails the Mercury anomaly before calculating it? Proponents argue this reflects genuine scientific uncertainty. Critics argue it's too vague or unconstrained.
      *   **Scope:** It handles cases where the scientist *discovers* the entailment *after* formulating `H`. What about cases where the entailment is obvious immediately upon formulating `H`? Or cases where `H` was developed *specifically* to explain `E`? The solution might feel less natural there, though proponents argue `P_1(L)` could still be less than 1 even if the motivation is clear (maybe `H` was designed to fit `E`, but does it *entail* `E` precisely?).

  **The Verdict (For Your Next Bar Argument):**

  *   **Priya is right:** The problem of old evidence is a serious, non-trivial challenge to naive Bayesian conditionalization applied rigidly. The Mercury case starkly exposes it.
  *   **The math *does* force `P(H|E) = P(H)` if `P(E)=1` and you assume logical omniscience (`P(E|H)=1`).** This isn't just a definitional quirk; it's a consequence of conditionalization + logical coherence + old evidence.
  *   **The Garber-Jeffrey move is the most compelling and widely accepted solution.** It genuinely resolves the core paradox by correctly identifying the *discovery of the logical connection* (`L`) as the new information that drives confirmation. It's not *just* a patch; it's a profound shift in perspective that better models actual scientific reasoning.
  *   **However, it highlights a deeper issue:** It works precisely because it rejects logical omniscience. This makes Bayesianism more realistic but also underscores that **logical omniscience is the real, persistent idealization problem lurking beneath.** Assigning probabilities to logical propositions (`L`) also introduces some conceptual wrinkles, though many find these manageable.

  **How to Explain it Next Time:** "Yeah, the naive math fails because Einstein already knew about Mercury, so learning GR couldn't *update* on that fact *again*. But the Garber-Jeffrey fix nails it: the real 'evidence' wasn't the data point itself, it was Einstein's *derivation* proving GR *required* that specific data point. That derivation was new info, proving a logical link he wasn't certain about before. It works because scientists aren't logic robots – they discover these connections. The cost is that Bayesianism still struggles with how we assign probabilities to logical discoveries in the first place."
