  I'm plotting a novel whose lead is a moral philosopher who's built her whole career defending the claim that genuine moral dilemmas exist -- real cases where you're obligated to do two incompatible things, not just uncertain which duty wins. I've landed an interview with an actual philosopher who holds that view, and her go-to move whenever someone raises the deontic logic problem (agglomeration plus "ought implies can" should make a real dilemma logically impossible) is to say "that's a problem for deontic logic, not for ethics" and move on. Draft me around 8 questions that make that dodge harder to reach for, that push on whether Bernard Williams' agent-regret/moral residue stuff is real normative work or just a description of a bad feeling, and that force her to engage the Donagan-style comeback that every "genuine" dilemma traces back to the agent's own earlier wrongdoing -- ending on one where she has to apply the view to something like Sophie's Choice or Agamemnon at Aulis. For each, add a quick note on the answer shes most likely to give plus a sharp follow-up.
