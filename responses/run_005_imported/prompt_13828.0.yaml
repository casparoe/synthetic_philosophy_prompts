  Sophie's Choice is perfect for the finale - no prior wrongdoing, pure tragedy. They'll likely say both options are obligatory, so I'd challenge how obligation survives impossibility. The follow-up could highlight the paradox: if she ought to choose one, how can she also ought to have chosen otherwise?

