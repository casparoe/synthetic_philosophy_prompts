answer: |-
  That's a fantastic angle for your piece! Sidgwick is indeed a prime example, but framing it *solely* as "irrational blind spot" versus "real work" might oversimplify his fascinating complexity. He represents a very specific Victorian intellectual tension. Here's a breakdown of the concepts and terms you could use:

  1.  **Beyond Simple Compartmentalization:** While compartmentalization (keeping conflicting beliefs/activities separate mentally) *is* a known phenomenon, Sidgwick's case is more nuanced:
      *   **Driven by Rational Crisis:** Sidgwick's psychical research wasn't *irrational whim*. It stemmed directly from the profound crisis of faith and meaning gripping Victorian intellectuals post-Darwin. His rigorous ethics led him to despair: if the universe was purely materialistic and God/afterlife unprovable, was ethical behavior ultimately futile? Psychical research was his **rational, empirical attempt to *resolve* this crisis**. He sought scientific *proof* of survival after death to underpin his moral philosophy. Failure to find it caused him deep anguish.
      *   **Methodological Rigor (Attempted):** The SPR, under Sidgwick, aimed for scientific objectivity. They investigated fraud, developed protocols, and demanded evidence. While flawed by modern standards (and susceptible to deception), their *intent* was rational inquiry, not blind faith. Sidgwick saw it as an extension of empirical investigation into uncharted territory, applying his analytical mind to a different problem set.

  2.  **More Accurate Framing & Terms:**
      *   **Epistemic Double Life / Methodological Bifurcation:** This captures the *separation* aspect while acknowledging both sides involved intellectual effort. He maintained distinct epistemic frameworks: rigorous philosophical analysis for ethics, and a (flawed but sincere) attempt at empirical investigation for the paranormal. The frameworks coexisted but didn't easily integrate.
      *   **Motivated Reasoning / Wishful Empiricism:** This highlights the powerful *drive* behind his SPR work. His deep *desire* for evidence of survival significantly shaped his approach, making him (and others) susceptible to clinging to ambiguous results or overlooking flaws in mediums who seemed promising. His rationality was powerfully *directed* by this emotional/intellectual need. Scholar **Janet Oppenheim** (in *The Other World: Spiritualism and Psychical Research in England, 1850-1914*) effectively argues this was central for Sidgwick and his circle.
      *   **Empirical Faith / Scientific Supernaturalism:** This reflects the Victorian attempt to use science itself to validate religious or spiritual concepts that traditional faith could no longer sustain. Sidgwick wasn't abandoning reason; he was trying to use it to find a new foundation for meaning. It was faith *in the possibility* of empirical proof for the supernatural.
      *   **Crisis-Driven Inquiry:** Emphasizes the origin of his SPR involvement in his philosophical despair.
      *   **The Sidgwick Paradox:** You could coin this! It succinctly captures the tension between his relentless philosophical rigor and his decades-long pursuit of evidence in a field notorious for charlatanry and subjective experience. Scholar **Deborah Blum** (in *Ghost Hunters: William James and the Search for Scientific Proof of Life After Death*) vividly portrays this paradox.

  3.  **Why "Irrational Blind Spot" Might Be Too Harsh:**
      *   **Context:** For Sidgwick and many Victorians, the boundaries of science were being pushed rapidly. Fields like psychology, neurology, and electromagnetism were revealing unseen forces. Investigating consciousness and reported phenomena wasn't inherently irrational *at the time*; it was frontier science.
      *   **Intent:** His *method* (even if flawed in execution against skilled frauds) was analytical. He actively sought to *disprove* as much as prove.
      *   **Stakes:** The existential stakes (the foundation of morality) were incredibly high *for him*. This wasn't a hobby; it was a desperate quest for intellectual and moral salvation.

  **Recommendations for Your Piece:**

  *   **Lead with the Paradox:** Start with the striking contrast (Methods of Ethics vs. Seances) to grab attention.
  *   **Explain the *Rational* Drive:** Don't just present SPR as his "weird hobby." Explain how it flowed logically (for him) from the dead end his ethics led him to. Quote his own writings on his despair and hope.
  *   **Use Nuanced Terms:** Instead of just "compartmentalization," use:
      *   "**Motivated by a profound philosophical crisis**, Sidgwick embarked on..."
      *   "He maintained an **epistemic double life**, applying rigorous logic to ethics while pursuing **wishful empiricism** in the séance room."
      *   "His leadership of the SPR represented not an abandonment of reason, but a form of **crisis-driven inquiry** and **scientific supernaturalism** – an attempt to use empirical methods to resolve the existential doubts his own philosophy had unearthed."
      *   "This **'Sidgwick Paradox'** – the hyper-rationalist desperately seeking proof of the irrational..."
  *   **Acknowledge the Ambiguity:** Conclude by noting that while his SPR work appears, from a modern perspective, like a compartmentalized blind spot driven by motivated reasoning, it was, for Sidgwick, a deeply serious and rational (if ultimately unsuccessful) attempt to solve the fundamental problem his brilliant mind had exposed.

  **Key Sources to Cite/Reference:**

  *   **Janet Oppenheim:** *The Other World: Spiritualism and Psychical Research in England, 1850-1914* (The definitive academic history, deeply analyzes Sidgwick's motivations).
  *   **Deborah Blum:** *Ghost Hunters: William James and the Search for Scientific Proof of Life After Death* (Very readable, focuses on James but gives excellent context on Sidgwick and the SPR's early days, emphasizing the personal stakes).
  *   **Sidgwick's own letters and writings:** (e.g., *Henry Sidgwick: A Memoir* by A.S. Sidgwick & E.M. Sidgwick) reveal his personal anguish and motivations clearly.

  By framing it as a rational response to a crisis created *by* his rationality, rather than just an irrational blind spot, you'll capture the true depth and tragedy of Sidgwick's fascinating intellectual journey. Good luck with the piece!
