  We are ranking the five approaches (epistemicism, supervaluationism, degree-theoretic/fuzzy, contextualism, and paraconsistent/subvaluation) on how well they handle higher-order vagueness.

  Higher-order vagueness refers to the problem that the boundaries between clear cases, borderline cases, and borderline borderline cases (and so on) are themselves vague. This challenges solutions to the sorites paradox that might try to fix boundaries at some level.

  Let's briefly consider each approach for higher-order vagueness:

  1. **Epistemicism**: This view holds that vagueness is a matter of ignorance; there is a sharp boundary, but we don't know where it is. For higher-order vagueness, the same would apply: there is a sharp boundary between clear cases and borderline cases, and also between borderline and borderline-borderline, but we are ignorant of these boundaries. This seems to deny the existence of genuine higher-order vagueness because it posits sharp boundaries at every level. Thus, it does not handle higher-order vagueness well.

  2. **Supervaluationism**: This approach considers all admissible precisifications of a vague predicate. A statement is true if it is true in all precisifications, false if false in all, and neither otherwise. For higher-order vagueness, the problem is that the set of admissible precisifications is itself vague. That is, what counts as an admissible precisification may have borderline cases. Supervaluationism typically requires a sharp boundary for the set of admissible precisifications, which leads to a similar problem at the next level. Thus, it struggles with higher-order vagueness.

  3. **Degree-theoretic (Fuzzy) Approaches**: These assign truth values in the interval [0,1]. Higher-order vagueness then becomes the question of whether the assignment of a particular degree is itself vague. In standard fuzzy logic, the truth value is precise (a specific real number), so it does not capture higher-order vagueness. However, some extensions (like fuzzy sets of fuzzy sets) have been proposed to model higher-order vagueness, but they are complex and may lead to an infinite regress or require a fixed hierarchy.

  4. **Contextualism**: This view holds that the extension of a vague predicate can shift with context. It might handle the sorites by appealing to context shifts in the chain. For higher-order vagueness, the issue is whether the context itself can be vaguely defined. If the context has sharp boundaries, then higher-order vagueness is not accommodated. Some contextualist approaches try to make the context-sensitivity itself vague, but it is not clear that this fully avoids the problem.

  5. **Paraconsistent/Subvaluation Approaches**: These allow for truth-value gaps (supervaluation) or gluts (subvaluation). Subvaluationism (a paraconsistent approach) might say that a borderline case is both true and false (or neither, but that's gap). For higher-order vagueness, one might say that a borderline borderline case is one that is both borderline and not borderline. However, this can lead to complex logical systems and might not fully resolve the regress.

