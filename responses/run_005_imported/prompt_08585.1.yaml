prompt: |-
  I've been part of a rationalist-adjacent reading group for years -- the kind of crowd that cut its teeth on LessWrong and the EA Forum -- and at a recent meetup, right after we'd worked through the standard demandingness objection to consequentialism, two regulars got into a back-and-forth I still haven't been able to adjudicate to my own satisfaction.

  (1) Felix opened by arguing that the objection confuses what morality requires as a criterion of rightness with how an agent should actually deliberate day to day: a consequentialist who consciously tried to maximize utility in every decision would, by the theory's own lights, produce worse outcomes than one who simply cultivates good habits and lives a recognizably decent life -- so the exhausting, ever-calculating picture critics paint isn't what consequentialism actually recommends.

  (2) Naomi granted the distinction but said it doesn't touch the objection: however an agent gets there psychologically, a well-calibrated consequentialist still has to converge on giving away most income and time above subsistence whenever that produces more welfare, since that's what the theory is tracking. Swapping the decision procedure doesn't shrink the sacrifice; it just hides it from view.

  (3) Felix responded that what you owe should instead be fixed relative to full compliance: work out the fair per-person contribution if everyone did their part, and that fixed amount is your obligation, full stop. The sense that consequentialism demands limitless sacrifice from any one person comes from everyone else's non-compliance, not from the theory itself.

  (4) Naomi answered that this can't be right, since whether you're obligated to help someone in front of you at low cost has nothing to do with how many other capable people are shirking elsewhere; tying your obligation to a hypothetical fully-compliant world lets you stop helping real people for reasons that have nothing to do with them -- exactly the kind of move consequentialists are supposed to distrust.

  Could you go through this move by move -- for each of the four, say whether Felix, Naomi, both, or neither has the stronger position, and justify the call -- and then close with a short paragraph on what you think the two of them are still missing between them?
reasoning: |-
  Okay, the user is part of a rationalist reading group and they're grappling with a debate between Felix and Naomi about consequentialism and demandingness. Let me start by understanding each point they made. Felix argues that critics confuse the criterion of rightness with day-to-day decision-making. He says constantly calculating utility isn't practical and that good habits lead to better outcomes. Naomi agrees with the distinction but points out that even with good habits, the sacrifices required don't change; they're just hidden. Then Felix brings up full compliance, saying obligations should be based on everyone doing their part. Naomi counters that obligations shouldn't depend on others' actions, especially when helping someone right in front of you.

  First, I need to assess each move. For (1), Felix is correct about the decision-procedure vs. criterion distinction. Consequentialists like Mill or Sidgwick support this. Indirect strategies (like cultivating virtues) can lead to better outcomes than direct calculation. So Felix's point here is strong.

  For (2), Naomi's right that the sacrifice size doesn't shrink. The demandingness comes from the theory's criterion, not the decision process. Even with habits, if you're well-calibrated, you still end up making significant sacrifices. Examples like effective altruism show this. So Naomi has the stronger position here.

  Move (3) by Felix introduces full compliance. This is a common move in moral theories to avoid overdemandingness on individuals. But consequentialism typically focuses on actual outcomes, not hypotheticals. Felix's point might align more with contractualism, which uses ideal scenarios. So his argument here is weaker within a consequentialist framework.

  In (4), Naomi effectively argues that obligations in immediate, low-cost situations shouldn't depend on others' non-compliance. Helping someone in front of you doesn't become less obligatory just because others aren't helping elsewhere. This resonates with the idea that consequentialism cares about actual impact, not hypothetical fairness. Her point here is strong.

  The user's deeper need might be to resolve the tension between theoretical consistency and practical applicability. They want a satisfying answer that addresses both the ethical demands and real-world feasibility. The unresolved issue between Felix and Naomi is balancing individual obligations in a non-ideal world. Felix focuses on fairness under ideal conditions, while Naomi stresses responsiveness to actual needs. A comprehensive solution might involve optimizing contributions within real-world constraints, using coordination mechanisms like institutional reforms or pledge systems to bridge the gap. The user likely seeks a synthesis that acknowledges both perspectives without compromising consequentialist principles.
answer: |-
  Here's a breakdown of the moves, assessing the strength of each position within the consequentialist framework:

  1.  **Felix (Distinction: Criterion vs. Decision Procedure):**
      *   **Position:** Stronger.
      *   **Justification:** Felix is fundamentally correct about this core consequentialist distinction. Act Consequentialism defines the *criterion of rightness* (an act is right iff it maximizes good consequences) but is often paired with a *satisficing* or *indirect decision procedure* (cultivating virtues, habits, rules-of-thumb) precisely because constantly trying to *calculate* the utility-maximizing act is often self-defeating. Smart consequentialists (Mill, Sidgwick, Hare, modern Effective Altruists) explicitly endorse this. Critics *do* frequently misrepresent consequentialism by attacking the demandingness of a *deliberative procedure* it doesn't actually recommend.

  2.  **Naomi (Distinction Doesn't Shrink Sacrifice):**
      *   **Position:** Stronger.
      *   **Justification:** Naomi correctly identifies the crux of the demandingness objection. While Felix is right about *how* to deliberate, the *criterion of rightness* itself remains incredibly demanding. A well-calibrated consequentialist agent, even using habits/virtues, will still structure their life to maximize good consequences *overall*. This *will* involve massive sacrifices relative to common-sense morality (e.g., donating most surplus income, choosing high-impact careers, significant lifestyle constraints) because that *is* what maximizes expected utility in a world of immense suffering and cost-effective interventions. Changing the decision procedure optimizes *how* you meet the demand; it doesn't reduce *what* the criterion demands you ultimately achieve.

  3.  **Felix (Obligation Fixed by Full Compliance):**
      *   **Position:** Weaker (within standard Consequentialism).
      *   **Justification:** While this move (often called "Fair Share Consequentialism" or drawing on contractualist ideas) is a common *response* to demandingness, it departs significantly from core consequentialist principles. Standard consequentialism evaluates acts based on their *actual* consequences in the *real* world. Tying obligation to a *hypothetical* state of full compliance:
          *   **Ignores Actual Impact:** If donating $X *now* to a cost-effective charity saves a life, but $X is more than your "fair share" in a fully compliant world, consequentialism (as usually defined) says you *should* donate $X because it *actually* saves a life. Refusing based on others' non-compliance lets real harm happen that you could prevent.
          *   **Not Consequentialist Foundation:** The argument relies on fairness/reciprocity considerations more central to deontology or contractualism. Consequentialism's foundation is maximizing good states of affairs, not fairness of burdens.
          *   **Practical Problems:** Defining the "fair share" is notoriously difficult (what baseline? what counts as compliance?).

  4.  **Naomi (Objection to Full Compliance Move):**
      *   **Position:** Stronger (against Felix's specific move).
      *   **Justification:** Naomi effectively dismantles Felix's "full compliance" argument from a core consequentialist perspective. Her key points hit home:
          *   **Actual Needs Trump Hypothetical Fairness:** The moral urgency of alleviating suffering *right now* for a *real person* you can help at low cost shouldn't be negated by the abstract failure of others elsewhere. Consequentialism cares about *actual* suffering prevented, not idealized burden distribution.
          *   **Lets Shirking Dictate Obligation:** As Naomi says, Felix's move allows the *immorality of others* (their non-compliance) to *reduce your own obligation* to help, which seems perverse. It incentivizes free-riding.
          *   **Violates Core Principle:** It prioritizes a fairness rule over maximizing actual good consequences in the situation you face, which is inconsistent with act consequentialism's fundamental criterion.

  **What They're Missing:**

  Both discussions, while insightful, slightly miss the most promising consequentialist path forward. Felix correctly identifies the need to avoid self-defeating deliberation but underappreciates the theory's inherent demandingness at the criterion level. Naomi correctly defends the demanding criterion against Felix's "fair share" dilution but doesn't fully engage with the *practical optimization* challenge within that demanding framework. The most robust consequentialist response lies in **acknowledging the extreme demandingness *in principle*** while focusing relentlessly on **real-world optimization under constraints**: identifying the most *effective*, *sustainable*, and *scalable* ways for individuals to maximize impact over the long term. This involves sophisticated cost-benefit analysis of personal strategies (e.g., burnout risk vs. donation amount, earning-to-give vs. direct work, political advocacy vs. direct aid) *within* the demanding criterion, and heavily emphasizing *coordination mechanisms* (like pledges, institutional reforms, norm-shifting) to move closer to "full compliance" scenarios *in practice*, thereby reducing the crushing burden on isolated individuals *while still aiming for maximal collective impact*. The demandingness isn't eliminated, but its practical manifestation is optimized.
