  I went down a rabbit hole on Aumann's agreement theorem last night — the game theory result that says two Bayesians with the same priors literally can't "agree to disagree" once their opinions are common knowledge, because they're mathematically forced to converge. Doesn't this basically settle the whole peer disagreement debate in epistemology? Like, if two coworkers who each trust the other's judgment still disagree after actually hashing something out, isn't "steadfastness" just mathematically wrong at that point, since Aumann already proved rational agents can't stably hold different credences once they know where the other one stands? I don't really get why philosophers still treat conciliationism vs steadfastness as some big open debate when theres already a proof sitting right there — are they just behind on the math, or am I missing something about how the two things actually relate?
