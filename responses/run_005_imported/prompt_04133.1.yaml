  **Biggest weakness of S-tier (MEC):**  
  The core flaw is the **intertheoretic comparability problem**—there's no objective way to normalize choiceworthiness scales across different ethical theories. For example, how many "duty points" (Kantianism) equal one util (utilitarianism)? This forces arbitrary normalization methods (like range-normalization) that can drastically alter outcomes based on how options are framed. Additionally, MEC struggles with theories that reject quantitative comparisons altogether (e.g., virtue ethics).
