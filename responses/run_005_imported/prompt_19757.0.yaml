  Okay so I had this whole arguement with my friend last night about AI doom stuff and he pulled out the "that's literally just Pascal's mugging" card on me. His logic: Pascal's mugging already proved that expected value reasoning breaks down once the probability's small enough and the payoff's big enough, so literally any argument for taking a tiny-probability catastrophe seriously (AI extinction, whatever) is doing the exact same move and can just be dismissed. I didn't have a great comeback besides "that feels off to me" lol. Is he actually right that this generalizes to basically all low-probability/high-stakes reasoning, or is there something specific about the mugging setup itself that doesn't carry over to stuff like x-risk arguments? And if the fix is supposedly just "assign a low enough probability," can't the mugger just counter with an even bigger number and cancel that out anyway?
