  Wait, Carruthers' dispositional theory only requires that the state is available to the mindreading system. So even if attention is diverted, as long as the state is there and could be accessed, it should count as conscious. Rosenthal needs the actual thought, which requires attention and conceptual resources. Lycan needs the monitoring state, which might require attention but not necessarily conceptual thought.

  A sequence: Moment 1 - stimulus present but unattended due to distraction. Carruthers says conscious because available; Rosenthal and Lycan say not conscious because no actual HOT or monitoring. Moment 2 - distraction removed, attention shifts but conceptual system is engaged elsewhere. Here, Lycan might say monitoring happens with attention, so conscious. Rosenthal needs conceptual thought, which is busy, so no HOT, not conscious. Carruthers still says conscious. Moment 3 - conceptual resources free, HOT forms. All agree conscious.

  But in Moment 2, why would Lycan's monitoring occur without conceptual resources? The inner sense is quasi-perceptual, so it might operate pre-conceptually. Attention could trigger monitoring without needing concepts. Rosenthal requires conceptual thought, so if the conceptual system is occupied, no HOT forms.

  Need to ensure the first-order state remains constant. The stimulus should be continuous. The manipulations are about attention and cognitive load. For example, a faint Gabor patch. Subject doing a demanding cognitive task (like mental arithmetic) initially. Then the task stops, attention shifts to the patch, but a secondary task (like remembering a number) occupies conceptual resources. Finally, no tasks, full attention.

