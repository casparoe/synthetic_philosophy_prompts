answer: |-
  The salt spray stung Eli’s eyes, but he kept them fixed on the jagged silhouette shrinking on the horizon. The *Starling* was gone, swallowed by the storm. Around him in the pitching lifeboat, huddled under a scrap of sailcloth, were the only other survivors: Anya, the ship’s pragmatic engineer; Ben, a quiet botanist traveling to study island flora; Dr. Hayes, an elderly historian with a sharp mind; and Mari, a young musician whose instruments lay at the bottom of the sea. Five souls adrift, cast onto the indifferent ocean.

  Three days later, the relentless sun bleached the sky and sea into a blinding haze. They’d found a speck of land – not the charted archipelago they’d been heading for, but a nameless, rocky islet crowned with stubborn palms and a brackish spring. Survival was the only law.

  The first coordination problem hit them immediately: water. The spring trickled reluctantly into a shallow rock basin. Thirst, a raw, scraping thing, made their hands tremble.

  **Day 5:** Anya, her voice hoarse, scooped water into their single salvaged tin cup. "Right. We need a system. Everyone gets one cupful per day."
  "One cup?" Ben protested weakly, his lips cracked. "That basin holds maybe ten cups total before it needs hours to refill. We need more."
  "More isn't *there*," Anya snapped, exhaustion fraying her patience. "We ration, or we die faster."
  Dr. Hayes coughed. "Anya is correct in principle, Benjamin. But the measurement... is it a brimming cup? A level one? Who draws it?"

  Anya filled the cup to the very brim, water trembling at the edge. "Full. That's fair." She handed it to Mari, who gulped it down desperately. When it was Ben’s turn, Anya filled it similarly. But when she handed it to Dr. Hayes, her hand shook slightly from fatigue, and a little slopped over the side before he could take it. He received slightly less. No one commented then, too focused on their own ration.

  **Day 7:** Ben was on water duty. Remembering his own thirst and seeing the doctor’s frailty, he deliberately filled the cup just *below* the brim, trying to be consistent. "Level," he announced, handing it to Anya. She glanced at the waterline, then at Ben, a flicker of something unreadable in her eyes, but drank without comment. When he gave Dr. Hayes a similarly "level" cup, the old man nodded faintly. Mari, watching, noticed the slightly reduced amount but said nothing; the consistency felt fairer than Anya’s brimming-but-spillage approach.

  **Day 10:** Dr. Hayes took his turn. His hands, stiff with age, fumbled. He aimed for "level" as Ben had done, but his pour was unsteady. The water settled unevenly, arguably a fraction less than Ben’s "level." Anya, receiving it, frowned. "That’s short," she stated flatly.
  Dr. Hayes looked distressed. "I assure you, I endeavored–"
  "It’s okay," Mari interjected quickly, seeing the tension. "We’re all shaky. Maybe... maybe we need a mark?" She looked around the rocky ledge. Finding a sharp flint, she scratched a faint, horizontal line inside the cup, about half an inch below the rim. "Here? Fill to here?"
  Ben peered at it. "Visible. Consistent. Yes."
  Anya, though she preferred the full brim, saw the logic. A visible mark meant no arguments, no accusations. "Fine," she grunted. "To the line." She filled the cup precisely to Mari’s scratch and handed it to Ben. He drank, the water tasting no different, but the *act* felt smoother, devoid of the previous undercurrent of mistrust. The scratch became **The Line**. Filling to The Line wasn’t decreed; it emerged from failed attempts, perceived unfairness, and Mari’s simple solution to prevent conflict. It was their first true convention: **The Water Mark**.

  The second convention began with silence. After the terror of the shipwreck and the grim struggle of landing, they were strangers bound by trauma, unsure how to bridge the gap. Greetings felt absurd. "Good morning" mocked their reality. Yet, ignoring each other entirely bred an uncomfortable isolation.

  **Day 12:** Ben returned from checking crab traps, empty-handed again. He walked into their small camp, a sheltered overhang near the spring. Anya was mending a fishing net salvaged from the lifeboat. She looked up as he approached. Their eyes met. Neither spoke. The silence stretched, heavy with shared frustration and fatigue. Ben, feeling the awkwardness intensely, gave a single, curt nod – a bare dip of his chin – and moved past her to sit down.
  Anya, startled by the gesture, instinctively mirrored it. A slight, almost imperceptible nod back. No words. The interaction was over, but the suffocating weight of the unsaid lessened slightly. It acknowledged presence without demanding energy they didn’t have.

  **Day 15:** Eli, hauling firewood, passed Dr. Hayes who was meticulously sorting edible seaweed. They made eye contact. Remembering Ben and Anya's exchange, Eli offered the same small nod. Dr. Hayes, relieved not to have to manufacture conversation, returned the gesture with a hint of a weary smile.

  **Day 18:** Mari, feeling a surge of despair after another failed attempt to catch fish, walked back to camp. Anya saw her approach, saw the slump in her shoulders. When Mari looked up, Anya didn't offer false cheer. She simply gave **The Nod**. It wasn't sympathy, exactly. It was recognition. *I see you. We are here. We endure.* Mari, surprised, nodded back. The simple action didn't solve her hunger, but it momentarily pierced her loneliness. It felt like belonging.

  **Day 22:** A storm lashed the island. They huddled together in the overhang, the wind screaming. When a particularly violent gust shook the rocks, sending a shower of grit down, Ben instinctively looked at Eli. Eli met his gaze and gave **The Nod**. It wasn't about greeting anymore. In that moment, it meant, *We’re still here. We ride this out.* Ben nodded back, a silent pact against the chaos. The gesture had evolved, imbued with shared resilience. **The Nod** had become their unspoken greeting, acknowledgment, and reassurance. It required nothing but a second of eye contact and a tiny dip of the head. It cost nothing. It meant everything.

  The third convention was born of conflict. Firewood was scarce on the rocky islet. Dr. Hayes, trying to be helpful, had gathered a pile of damp driftwood. Anya, needing a hot fire to cook a meager catch of shellfish, found it useless.
  "Useless!" Anya snapped, kicking the damp wood. "All this effort for kindling that won't catch!"
  "I was attempting to contribute," Dr. Hayes retorted, his voice thin with offense. "Perhaps if someone had *communicated* the requirements..."
  "Requirements? Dry wood! Isn't that obvious?" Anya shot back.
  Ben stepped between them, hands raised. "Stop! We can't afford this. We need a way... a way to *say* something's wrong without yelling."

  Mari, who had been observing quietly, picked up a small, smooth stone from the beach. She walked over and placed it deliberately in the center of their rough camp circle, near the fire pit.
  "What's that for?" Eli asked.
  "If you're upset," Mari said softly, "if you think something's unfair or wrong, you put a stone here. Before you shout. Then... then we all see it. We know someone needs to talk." She looked at Anya and Dr. Hayes. "Then we can *choose* to talk calmly. Or not, right then. But the stone says, 'This matters.'"

  It felt strange, theatrical. But the next day, Anya found Ben using the last of the carefully collected dry tinder for a small signal fire (a futile hope for rescue she privately scorned). Furious at the waste, she opened her mouth to yell... then saw the smooth stone Mari had left near the fire pit. Jaw clenched, she walked over and placed it firmly in the center. Ben saw it. He looked at the signal fire, then at Anya's stony face. He sighed, stomped out the small flame, and nodded curtly at her. No words. The potential explosion fizzled. The stone had absorbed the first shockwave of anger.

  **Day 30:** Dr. Hayes was frustrated with the constant relocation of his precious, painstakingly sorted medicinal plants whenever Mari practiced her silent, rhythmic dances (her way of coping). Instead of complaining, he placed the stone. Mari saw it, looked at her makeshift dance floor encroaching on his "garden," and silently moved her practice area without a word.

  **Day 40:** Eli placed the stone after Anya took a larger share of the cooked crab, claiming greater exertion from reef fishing. Everyone saw the stone. Anya flushed. "I was hungrier," she muttered defensively. But the next day, she took only her share marked by The Line principle. **The Stone** didn't solve the dispute magically, but it signaled the *need* for resolution. It forced a pause, a visual cue that someone felt wronged, allowing cooler heads and the established principles (like The Water Mark's fairness) to be invoked. It became their **Signal for Contention**.

  Six weeks in, a rhythm existed. Each morning, as they emerged from their shelters, **The Nod** passed between them – a silent "You are here. I am here. We continue." Water was drawn precisely to **The Line**, a ritual of fairness born from spilled drops and suspicion. And when friction arose, **The Stone** appeared in the center of their camp, a small, silent herald that said, "This needs attention," often preventing the spark from becoming a fire.

  No one had called a meeting. No leader had decreed these things. They had simply collided with problems – unfairness, isolation, conflict – and fumbled towards solutions. A scratch in a cup. A nod to break silence. A stone to absorb anger. Through repetition, through seeing that these small actions *worked* to reduce friction and foster a fragile trust, they became **The Way**. They were the unspoken grammar of their tiny, accidental society, woven not from grand design, but from the desperate, incremental stitching together of shared survival. They were conventions, born not of thought, but of the relentless, practical need to simply *be* together on a rock in the sea. And as Eli watched Mari teach **The Nod** to a confused seabird that had wandered into camp, he realized the deepest truth: these conventions weren't just rules; they were the echoes of their collective struggle, solidified into habit, becoming the bedrock of their shared world.
