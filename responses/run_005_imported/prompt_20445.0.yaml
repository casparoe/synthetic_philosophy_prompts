answer: |-
  That dinner argument is peak Wittgenstein—confusing, profound, and impossible to resolve cleanly. You and Priya are both partly right, and the tension between §96-99 (river-bed) and §341-343 (hinges) is deliberate. Wittgenstein isn't contradicting himself; he's showing two facets of the same diamond. Here's a close reading reconciling them:

  ### 1. **The Hinge Metaphor (§341-343): Functionality, Not Immutability**
     - **Key Point:** The hinge image emphasizes **logical necessity**, not eternal fixity. For doubt/investigation *to function at all*, *some* propositions must be exempt from doubt *at that moment*. Like hinges enabling a door to swing, these propositions enable the "movement" of questioning.
     - **What it DOESN'T Say:** It doesn't claim *which* propositions are hinges, or that *the same* hinges must hold forever. "The hinges must stay put" **relative to a specific inquiry**. Wittgenstein rejects the idea that hinges are just "assumptions we settle for" due to practical limits (§341). They're *constitutive* of rational activity.

  ### 2. **The River-Bed Metaphor (§96-99): Dynamism and Historical Shift**
     - **Key Point:** This passage explicitly introduces **temporal/historical fluidity**. Propositions can:
       - **Harden:** Move from being empirically tested ("fluid") to functioning as unchallenged background ("hard" river-bed).
       - **Liquefy:** Move from being bedrock ("hard") to becoming open to empirical challenge ("fluid").
     - **Nuance:** The river-bed isn't monolithic. Parts are "hard rock" (very stable hinges), parts are "sand" (more malleable, prone to erosion/deposition). Crucially, the *distinction* between bed (hinges) and water (empirical propositions) is real, but the *boundary* is fuzzy and shifts over time.
     - **"Mythology" (§97):** This is **NOT a throwaway.** It directly echoes his critique of Frazer. "Mythology" refers to the *framework of unquestioned certainties* shaping a culture's worldview and practices. Like mythological explanations, hinges are:
       - **Non-empirical:** Not justified by evidence; they make evidence possible.
       - **Action-guiding:** Embedded in practices ("form of life").
       - **Historically contingent:** What counts as "mythology" (hinges) changes as cultures/practices evolve (e.g., "The Earth is flat" was a hinge; now it's empirical).

  ### 3. **Reconciling the Metaphors: Contextual Fixity + Historical Fluidity**
     - **The Compatibility:** The metaphors address different aspects:
       - **Hinge (§341-343):** **Synchronic Function.** *At any given moment*, for inquiry/doubt to occur, *some* hinges must be fixed. Without *something* staying put, the "door" (rationality) seizes up.
       - **River-Bed (§96-99):** **Diachronic Process.** *Over time*, *which* propositions serve as hinges can change. What was bedrock can erode; what was fluid can solidify. "Fixed" ≠ "eternal".
     - **Wittgenstein's Point:** **Certainty is structural, not propositional.** What matters is *that* there is a framework of certainty enabling doubt. *Which* propositions form that framework is contingent on historical context, language-games, and forms of life. The river-bed *as a whole* must exist for the river (knowledge) to flow, but *its composition* changes.

  ### 4. **Why Priya is Right (But So Are You)**
     - **Priya's Insight:** She correctly identifies that **no specific hinge is sacred forever.** The river-bed passage explicitly shows hinges *can* become empirical claims (e.g., "The Earth is spherical" was once a radical empirical challenge; now it's a hinge for geography). Calling them "fixed" *simpliciter* is misleading if it implies immutability.
     - **Your Insight:** You're right that **some hinges must be "fixed" *relative to a context*.** Without *temporary* exemption from doubt, the system *does* seize up. The river-bed metaphor *depends* on the distinction between bed (fixed for now) and water (movable). Even shifting sand provides *some* stability temporarily.

  ### 5. **"Mythology" and Why the Order Matters**
     - The river-bed passage (§96-99) comes *earlier* because it introduces the **broader, dynamic framework**. The hinge passage (§341-343) comes later as a **sharper, functional analogy** within that framework. It's not that one is "advanced"; they complement each other:
       - **River-bed:** The big picture of how knowledge evolves.
       - **Hinge:** The micro-logic of how doubt operates *within* a stable frame.
     - **"Mythology"** ties hinges to cultural practice. Our hinges aren't "rational foundations" but the inherited, often inarticulate background that makes our language-games possible (e.g., "There are physical objects," "The world didn't begin 5 minutes ago"). This *is* the "river-bed" of a culture.

  ### Conclusion: Wittgenstein's Masterstroke
  The tension you feel is the point. Hinges *must* stay put **for doubt to function here and now**, but **over time, which propositions act as hinges can and do change**. The river-bed *as a whole* must persist (some rock, some sand), but its *specific contours* shift. "Fixed" describes their **role**, not their **identity across history**. Priya wins on historical fluidity; you win on structural necessity. Wittgenstein shows certainty is both **enabling** (hinge) and **emergent** (river-bed). 

  **Next dinner suggestion:** Read §160-167 on how "I know" functions differently for empirical vs. hinge propositions. It shows why trying to *justify* a hinge ("I know I have two hands") is nonsense—it’s not an empirical claim, but what *allows* empirical claims to make sense. That should keep the argument going!
