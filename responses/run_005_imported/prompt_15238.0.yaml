  For the logic part, I should emphasize how rejecting agglomeration makes obligations practically meaningless. If two "all-things-considered" duties can conflict, how do we even define obligation? That seems like the nuclear option - better to preserve a coherent system by treating the unchosen duty as overridden rather than persistent.

  For Agamemnon, Donagan's point is crucial. The professor mentioned it specifically - Agamemnon's oath created the bind. So his dilemma stems from his own recklessness, not from morality itself. This needs development: contrast with "innocent" dilemmas like Sartre's student where no prior fault exists. Argue that in clean cases, one duty always clearly overrides.

  The residue explanation requires care. Must show how regret can exist for the overridden prima facie duty without implying it was binding. Ross's distinction helps here - we feel residual pull precisely because the duty was real, just not decisive. Williams' "one thought too many" could be turned against him: the regret proves we took the duty seriously, not that it remained in force.

  I should structure this as:
  - Start with deontic logic foundations (agglomeration as necessary for coherence)
  - Apply to cases: show how in each example, one duty is actually invalid or overridden
  - Hammer Donagan on Agamemnon as paradigm of self-created binds
  - Explain residue via Rossian prima facie duties
  - Conclude that positing real dilemmas costs more than it gains

  The tone needs academic rigor but also persuasive force - this is for grad students who've already bought the dilemma position. Must anticipate their objections, especially about the "phenomenology" of residue feeling so obligation-like.
answer: |-
  Here’s the sharpest case against genuine moral dilemmas, structured to engage the logic, address residue, and leverage Donagan’s key insight—designed to unsettle the students’ confidence in Williams/Barcan Marcus:

  ### Core Argument: Preserving Deontic Coherence  
  **1. The Agglomeration Principle is Non-Negotiable**  
     - If you grant genuine dilemmas (OA & OB & ~◊(A&B)), you *must* reject agglomeration (OA & OB → O(A&B)). But sacrificing agglomeration implodes the concept of an "all-things-considered obligation" (ATC):  
       - **Incoherence Threat**: If OA and OB can both be ATC yet jointly impossible, "obligation" loses its action-guiding force. An ATC "ought" must imply *can* (practically, not just logically). If I *ought* to do A and I *ought* to do B, but A and B are incompatible, then in what sense do I *ought* to do either? The obligations cancel each other’s authority.  
       - **Worse than a Cost—It’s Fatal**: Rejecting agglomeration permits contradictions *within* the deontic system. E.g., OA and O~A (if B entails ~A) become compossible. This reduces morality to absurdity: we could derive O(A & ~A). **Better to treat the unchosen obligation as *defeated* (prima facie) than render "ought" incoherent.**  

  **2. Moral Residue Doesn’t Prove Persistent ATC Obligations**  
     - Williams confuses *psychological* residue with *deontic* residue. Regret/remorse is appropriate not because an ATC duty remains unmet, but because:  
       - **The Prima Facie Duty Was Genuine**: Ross’s "duty sans phrase" (ATC) overrides a conflicting prima facie duty, but the *weight* of the latter doesn’t vanish. We regret *what was sacrificed* (e.g., a deep value), not an unfulfilled ATC obligation.  
       - **Agent-Regret vs. Moral Failure**: In Agamemnon’s case, his anguish stems from *being the cause* of his daughter’s death (agent-regret), not from violating a standing duty to her *at that moment*. The ATC duty was to sacrifice Iphigenia (per Donagan—see below); the residue reflects the horror of his agency, not an unrealized obligation.  

  ### Donagan’s Decisive Move: Dirty Hands Are Self-Made  
     - **Agamemnon Isn’t a Counterexample—It’s Proof**:  
       - Donagan’s key insight: *Agamemnon’s dilemma arises solely from his prior moral failure* (the rash oath to Artemis). A morally clean agent—one who never made reckless vows—wouldn’t face "sacrifice daughter or betray army".  
       - **The "Prior Wrong" Principle**: Genuine dilemmas *only* emerge when the agent has already violated a duty (e.g., truth-telling, prudence) that created the conflict. A sound moral system (Kantian/Rossian) generates no ATC conflicts for agents who haven’t culpably put themselves in binds.  
       - **Sartre’s Student Revisited**: The student feels torn because *he committed* to two incompatible projects (resistance, filial care). But this doesn’t prove morality is conflicted; it shows *his prior choices* led to a clash of prima facie duties. The ATC duty is whichever maximizes contextual moral weight (e.g., resisting tyranny if oppression is systemic). His residue is grief over abandoning his mother, not proof of an unfulfilled ATC duty.  

  ### Why This Beats the Dilemma Position  
  - **Explanatory Power**: Resolves all "dilemmas" without deontic explosion:  
    - *Confidentiality vs. Duty to Warn*: The ATC duty is context-dependent (e.g., warn if imminent threat). The unchosen duty (confidentiality) is *overridden*, not binding. Residue? Guilt over violating privacy, not a phantom obligation.  
  - **Preserves Moral Rationality**: Dilemmas imply morality is fundamentally irrational (demanding the impossible). This view keeps morality action-guiding: for any agent in any situation, there is *one* ATC duty.  
  - **Phenomenology Debunked**: Williams’ residue confuses *evaluative* appraisal (acknowledging a tragic loss of value) with *deontic* appraisal (owing unfulfilled action). We can—and should—feel anguish over sacrificing a value *without* positing incoherent obligations.  

  **Conclusion for Your Students**: The "settled" intuition that residue proves dilemmas relies on a category error. Sacrificing agglomeration to save dilemmas costs us a coherent deontology—a higher price than explaining residue as grief for prima facie duties. Donagan’s prior-wrong principle shows that hard cases are artifacts of moral failure, not proof of moral inconsistency. A theory that *generates* dilemmas for innocent agents is defective; one that resolves them by assigning ATC duties isn’t. Push them: if morality demands the impossible, how is it *morality* at all?  

  *Would you like a concise version for in-class delivery, or a follow-up on how to handle common student objections (e.g., "But regret feels obligatory!")?*
