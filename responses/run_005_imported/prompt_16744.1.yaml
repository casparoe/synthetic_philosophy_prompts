  Key structural challenge: convey the decision's weight without resolution. Ending mid-choice feels true to life. The scar motif might work—externalizing internal change. When pressure affects an old injury, it mirrors how the experience might reshape her priorities. 

  Avoiding clichés means no "I saw the light" epiphanies. Maybe her hesitation manifests as obsessive preparation? Checking gear repeatedly contrasts with her usual decisiveness. And the payoff isn't adventure—it's becoming someone who finds surface life trivial. 

