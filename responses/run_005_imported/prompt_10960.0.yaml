prompt: |-
  Ok, this is a total rabbit hole but I need a hand for a piece I'm writing on how scientists actually weigh evidence. I keep running into this thing called the "problem of old evidence" in Bayesian epistemology -- I think it traces back to the philosopher Clark Glymour around 1980 -- and its bugging me. The classic case: Mercury's orbit had this small extra wobble in its perihelion that astronomers had already measured decades before Einstein showed up, and everyone treats general relativity nailing that number as one of the theory's biggest points in its favor. But if Bayes' theorem says confirmation is about how much a piece of evidence shifts your credence, that wobble was already fully known -- probability 1 -- long before GR existed, so strictly there was nothing left for it to shift. So did GR get zero Bayesian credit for arguably its most famous piece of supporting evidence? Can you explain why this is a genuine bind for Bayesians and not just a technicality, then walk me through, in plain english, the main ways people have tried to wriggle out of it (something about relaxing logical omniscience, something about counterfactual credences, if I'm remembering right) -- and tell me whether any of them actually work, or if it's still an open wound.
