  Also, Turing's approach to ESP was methodological. He wasn't endorsing ESP but saying, "If it exists, here's how to control for it." That's consistent with rigorous science. Even if his belief in ESP was mistaken, it doesn't invalidate his other insights. Think of it as a historical artifact of the time's scientific context. 

