answer: |-
  Here’s a rigorously argued case for the non-doxastic interpretation of Wittgenstein’s hinges, confronting both core objections head-on:

  ### The Core Argument: Hinges as Non-Propositional Certainty  
  Wittgenstein’s key insight is that **hinges are not psychological states but logical conditions for the possibility of doubt, evidence, or belief itself**. When he writes, *"I do not explicitly learn the propositions that stand fast for me. I can discover them subsequently. […] My life consists in my being content to accept many things"* (§152), he distinguishes hinges from beliefs in three ways:  

  1. **Non-Assent**: Beliefs involve *taking a proposition as true* (e.g., "I believe vaccines work"). Hinges operate pre-linguistically: you don’t *assent* to "My hands won’t pass through solid objects"; you *act* on it by reaching for a cup. As Moyal-Sharrock stresses, hinges are **enacted certainties**, not internal representations.  
  2. **Immunity to Justification/Refutation**: Beliefs can be challenged by evidence (e.g., fact-checking might alter your belief in a politician’s claim). Hinges like "The Earth exists" are immune: *"A doubt that doubted everything would not be a doubt"* (§450). To fact-check "Objects fall when dropped," you *presuppose* gravity—it’s the frame, not a claim within it.  
  3. **Non-Propositional Structure**: Beliefs are held *as propositions*. Hinges are *shown* in action: *"Giving grounds […] comes to an end; but the end is not certain propositions’ striking us immediately as true […] it is our acting, which lies at the bottom of the language-game"* (§204). When you avoid stepping off a cliff, you’re not *believing* "Gravity is real"; you’re *living* a certainty.  

  ---

  ### Confronting Objection 1: How Can Non-Doxastic Hinges Function?  
  **The Challenge**: If hinges aren’t beliefs, how do they "anchor" our epistemic practices? Doesn’t their role *require* doxastic content?  

  **Response**: Hinges function **enactively**, not representationally:  
  - **They Enable Belief/Doubt**: Beliefs exist within a "scaffolding" (§211). Just as the rules of chess aren’t *moves in the game* but make moves possible, hinges like "Sense perceptions are generally reliable" aren’t *beliefs* but the **preconditions** for forming beliefs (e.g., "I see a tree"). Pritchard: *"Hinge commitments are not items of knowledge or belief but arational certainties that make rational evaluation possible."*  
  - **No Belief "Smuggling"**: When you investigate a murder, you don’t "believe" forensic science is valid; you *use* it. Similarly, hinges are the **grammar** of inquiry: *"The questions that we raise and our doubts depend on the fact that some propositions are exempt from doubt"* (§341). To doubt is to *rely* on hinges, not to contemplate them.  
  - **Functional Necessity**: Beliefs are *responsive to evidence*; hinges *define what counts as evidence*. If they were beliefs, they’d require justification (triggering infinite regress). Their non-doxastic status avoids this: *"It is […] a foundation-walls *carried* by the whole house"* (§248).  

  ---

  ### Confronting Objection 2: Wittgenstein’s "World-Picture" Language  
  **The Challenge**: Doesn’t Wittgenstein’s talk of an inherited *"world-picture"* (§94) imply belief? E.g., *"I have a world-picture. Is it true or false? Above all, it is the substratum of all my inquiring and asserting"* (§162).  

  **Response**: "World-picture" is **practical inheritance**, not doxastic commitment:  
  - **"Hold" ≠ Belief**: When Wittgenstein says, *"The child learns to believe a host of things. […] [It] learns to act according to these beliefs"* (§144), he merges "belief" with *training*. The world-picture is *absorbed* like language: *"I did not get my picture of the world by satisfying myself of its correctness"* (§94).  
  - **Contrast with Belief**: Beliefs can be articulated ("I believe X"). Hinges resist articulation: *"It is always by favour of Nature that one knows something"* (§505). Calling a world-picture "inherited" (§94) emphasizes its **cultural embodiment**—like learning to walk, not debating gait mechanics.  
  - **Moore’s Paradox Resolved**: Wittgenstein mocks Moore’s "I know this is a hand!" (§348) because hinges *cannot* be meaningfully asserted. Saying "I believe I’m not a brain in a vat" is nonsense—it’s *shown* by eating, speaking, etc. The world-picture is the **silent background** against which claims make sense.  

  ---

  ### Why This Matters for Fact-Checking  
  The non-doxastic view explains fact-checking’s limits: **Hinges are immune to evidence because they establish the rules for evidence**. Challenging "COVID is real" assumes a shared reality—a hinge. When someone rejects fact-checks, they’re not denying *evidence* but clinging to a *different hinge* (e.g., "Institutions lie"). Changing minds requires shifting the hinge itself—through lived experience, not argument. As Wittgenstein warns: *"When two principles really do meet which cannot be reconciled, then each man declares the other a fool and heretic"* (§611).  

  **Conclusion**: Hinges aren’t "groundless beliefs" but the *bedrock of rationality*—so primitive they precede belief. To treat them as beliefs is to psychologize what is logical: *"I want to conceive [hinges] as something that lies beyond being justified or unjustified"* (§359). The non-doxastic reading preserves Wittgenstein’s radical point: **Certainty isn’t in the head; it’s in the hands**.  

  ---  
  ### Key Citations from *On Certainty*  
  - §341: "Hinges" as the basis of doubt.  
  - §152: Acting without learning propositions.  
  - §204: Grounds ending in action.  
  - §94: World-picture as inherited substratum.  
  - §359: Beyond justification.
