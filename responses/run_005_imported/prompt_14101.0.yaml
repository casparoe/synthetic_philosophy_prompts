  okay i need you to settle something because me and my friend Priya have been going back and forth on this since like 1am last night. we were arguing about longtermism (she just finished What We Owe the Future) and whether the fact that there could be an astronomical number of future people is actually a good reason to reorganize present day ethics around it. i brought up that Frank Ramsey bit where he says he refuses to feel humble in front of the stars, how his picture of the world is drawn in perspective rather than to scale, so people stay big in the foreground and the stars shrink down to something like threepenny bits. Priya said thats a nice mood but not an argument, and then got me with this: Ramsey is literally the guy whose subjective probability / expected utility framework is what the whole "tiny probability times astronomical value" longtermist logic runs on, so isnt he sort of undercutting his own machinery.

