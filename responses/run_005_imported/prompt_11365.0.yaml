prompt: |-
  I'm a PhD student in evolutionary biology and I'm helping put together questions for our philosophy-of-science colloquium -- next month's guest has built her whole career defending the Cummins-style causal-role account of biological function against the etiological/selected-effects crowd. Can you draft me eight to ten interview questions that don't just make her restate Cummins vs Wright one more time? I want at least one question on the malfunction problem (if a function is just whatever a part currently contributes to some capacity of the system its part of, whats actually wrong with a heart that stops pumping blood, rather than it just lacking that capacity now), one on the liberality worry that almost any effect can count as a function once you get to pick which capacity is being explained (hearts make noise too), and one that uses a swampman-style case to ask whether her view's easy answer for brand-new, unselected traits is a genuine advantage over etiology or just proof the view is too permissive. She's on record saying the liberality thing is a feature not a bug because functions are always interest-relative -- for the last couple questions, push on whether "interest-relative" secretly smuggles back in the selection-based normativity she's supposed to be doing without, and give each question a quick follow-up keyed to the dodge she'll probably try first.
reasoning: |-
  Okay, the user is a PhD student in evolutionary biology preparing for a philosophy-of-science colloquium. They need interview questions for a guest who defends Cummins' causal-role account of function against the etiological view. The user wants fresh questions that avoid rehashing old debates, specifically addressing malfunction, liberality, swampman cases, and the interest-relativity issue.  

  First, I need to recall Cummins' approach: functions are causal contributions to a system's capacity, defined relative to analytical interests. The etiological view ties functions to evolutionary history. The user mentioned three must-cover topics—malfunction (how can something be broken if function is just current contribution?), liberality (why isn't every effect a function?), and swampman (does accepting new traits make the view too permissive?).  

  For malfunction, the challenge is explaining normativity—why a non-pumping heart is malfunctioning, not just different. I should push how "proper activity" implies a norm beyond mere contribution. The guest might dodge by saying norms come from system-level goals, so the follow-up should question where those goals originate.  

  Liberality: the guest argues interest-relativity justifies including noise as a function if we care about acoustics. But is this too arbitrary? The follow-up should challenge if "interest" can avoid collapsing into "whatever we whimsically focus on," undermining function's explanatory power.  

  Swampman: here, causal-role easily assigns functions to new traits (advantage over etiological), but does this make functions too unconstrained? Follow-up could ask if this exposes the view as descriptive rather than normative.  

  The deeper thread is whether "interest-relative" smuggles in selection. If interests are shaped by evolutionary thinking (e.g., we care about pumping because it was selected), is Cummins parasitizing on etiology? The guest might deny this, so follow-ups need to corner that—e.g., if interests aren't grounded in history, what anchors them?  

  User’s tone suggests they want sharp, trap-avoidant questions. They’re likely frustrated with superficial debates and seek to expose tensions in causal-role. I’ll structure each Q with a main probe + anticipated dodge + surgical follow-up.  

  For the malfunction Q:  
  - Main: How does causal-role explain "malfunction" without historical norms?  
  - Dodge: She’ll appeal to systemic goals.  
  - Follow-up: But where do goals come from? If they’re defined by current interests, isn’t "malfunction" just "not what we want"?  

