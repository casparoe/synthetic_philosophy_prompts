answer: |-
  Here's a reconstruction of Hume's likely reasoning, engaging directly with the technical parallels between his empiricism, the Best System Account (BSA), and Algorithmic Information Theory (AIT):

  1.  **Acknowledging the Formal Achievement:** Hume would first acknowledge the *descriptive power* and *formal rigor* of AIT. He'd see Kolmogorov complexity as a brilliant mathematical formalization of the *concept* of "simplicity" he gestured towards when discussing the principles guiding human understanding (like uniformity and coherence). The idea that laws are the "axioms" output by the shortest program compressing the universe's data perfectly mirrors his core insight: laws are *human constructs* (patterns we find useful) imposed on observed regularities, not discovered "out there" necessities.

  2.  **The Core Objection: Relocation, Not Resolution:** However, Hume would immediately identify the fatal flaw from an empiricist perspective: **The choice of the Universal Turing Machine (UTM) is the new, unempirical primitive.** He'd argue:
      *   **"Where does the UTM come from?"** Kolmogorov complexity defines "simplicity" relative to a specific UTM. But this machine itself is a formal, abstract object, *not* something derived from sensory experience. Its instruction set, its very architecture, is stipulated. Hume would see this as *exactly analogous* to Lewis's "perfectly natural properties" – an attempt to anchor simplicity by fiat.
      *   **"The Arbitrariness Persists":** The additive constant problem crystallizes the issue. If the *ordering* of what counts as "simpler" can change depending on the UTM chosen (even if the *asymptotic* behavior for infinite strings converges), then for any *finite* universe (like ours, with its finite history and potentially finite future observations), the designation of the "best" system (shortest program) is fundamentally relative to this ungrounded choice. This mirrors the language-relativity objection to the BSA perfectly. AIT makes the relativism mathematically precise but doesn't eliminate it empirically.
      *   **"Explanatory Circularity":** Hume would argue that using the UTM to define simplicity for laws governing the physical world begs the question. The laws of physics (or logic/math underpinning the UTM) are precisely what we are trying to account for empirically. Basing the simplicity criterion for *physical* laws on the formal properties of a *mathematical/logical* machine smuggles in the very notions of necessity and structure we are supposed to be deriving from pure experience. It doesn't *explain* why this particular formal structure should map onto physical reality's compressibility; it just *assumes* it does.

  3.  **Rejecting the "Perfect Naturalness" Analogy:** Hume would likely be *more* critical of the UTM dependence than Lewis's natural properties. Lewis's natural properties are *meant* to be metaphysically primitive features of the world. Hume, the radical empiricist, would reject *any* such primitive as unobservable and therefore inadmissible. The UTM, while a formal object, is even *further* removed from sensory data than Lewis's properties. It's a tool *we* invent, not a feature *we* discover.

  4.  **The Psychological vs. Formal Gap:** Hume's project was fundamentally *psychological* and *epistemological*. He sought to explain the *origin* of our *belief* in necessary connections and laws in terms of observable mental habits (custom, association). AIT offers a *normative, formal* account of what *should* count as a law *given* a prior commitment to compression. Hume would argue that AIT doesn't address the core psychological question: *Why do we find compressed descriptions compelling? Why does custom lead us to project the past onto the future?* AIT quantifies "simplicity" but doesn't explain its psychological grip or its success (if any) in prediction. It formalizes the *output* of the psychological process Hume analyzed, but doesn't replace or ground the process itself empirically.

  5.  **Conclusion - The Primitive Relocated:** Hume would conclude that algorithmic information theory, while a powerful formalization of his core insight about laws as summaries of regularity, **fails to cash out "simplicity" in genuinely empiricist terms.** Instead, it **relocates the unexplained primitive** from the vague notion of "simplicity" or the choice of "language" (in the BSA) into the **specific, formal choice of the Universal Turing Machine.** The dependence of Kolmogorov complexity on the UTM is, for Hume, just as objectionably non-empirical and arbitrary as the language-relativity it sought to avoid. He would see it as a sophisticated mathematical recapitulation of the fundamental problem he identified: any attempt to ground laws in something more than constant conjunction ultimately relies on an unjustifiable primitive that cannot itself be derived from sensory experience. The specter of arbitrariness, inherent in the choice of the machine's architecture and instruction set, would confirm his deepest skepticism about finding a purely empirical foundation for natural necessity.

  **In essence:** Hume would see AIT as a brilliant formal *description* of the kind of systematization the human mind performs, but not as an *empirical justification* for it. The UTM dependence exposes the ineliminable conventional/arbitrary element underlying any "best system," reinforcing his view that laws reflect our compulsion to find order, not a discovered metaphysical necessity inherent in nature itself. The primitive wasn't banished; it was given a precise mathematical address inside the universal machine.
