  Now, I need to step into Hume's perspective. As an empiricist, he'd reject any unobservable primitives. Kolmogorov complexity relies on a universal Turing machine, which is a formal construct. But for Hume, the choice of machine isn't derived from experience. Even though AIT offers a formalization of simplicity, the machine-dependence means that what's simple isn't grounded in sensory data. This mirrors the language-relativity in BSA that Lewis tried to fix with natural properties. Hume would likely see both as circular because natural properties themselves aren't empirically justified.

