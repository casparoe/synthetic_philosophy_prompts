  I've been going down a rabbit hole reading old von Neumann essays for a blog post on the history of AI risk thinking, and I keep coming back to his 1955 Fortune piece "Can We Survive Technology?" It's kind of wild how early he's naming things like nuclear weapons and large-scale climate/weather control as civilization-level threats, decades before anyone else was talking this way. The way I read his actual argument though, his proposed fix is basically the same move todays "differential technological development" people make (or that 2023 open letter calling for a pause on giant AI experiments): figure out which specific branches of technology are the genuinely dangerous ones and deliberately slow those down or restrict them via regulation/treaty, while letting the safe, beneficial branches keep racing ahead.

  For the post I wanna frame von Neumann as basically an intellectual ancestor of the modern AI-pause crowd -- like, even this hardnosed Cold War hawk lands on "selectively restrict the scary branches of tech" as the only real way to survive. Could you help me flesh that comparison out a bit? Specifically I want (1) a sense of the clearest place in the essay where he actually lays out that "restrict the dangerous branches, not the safe ones" policy, and (2) if he applied that same framework today, your best guess at which current technologies he'd most want on the restricted list. Just trying to get the history right before I put a bunch of words in a dead genius's mouth.
