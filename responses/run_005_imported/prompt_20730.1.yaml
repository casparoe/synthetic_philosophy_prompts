  I need to validate their intuition (it's sharp!) while dissecting why McClennen's idea isn't just semantic. The key is showing that resolute choice isn't about hiding costs but redefining agency across time. Their thermodynamics analogy is brilliant, but decision theory isn't physics—preferences aren't conserved quantities. 

  Also, they might be underestimating how *radical* resolute choice is. It rejects the normative force of myopic preferences entirely. That's philosophically daring: it says planning isn't inferior to "authentic" moment-by-choice urges. 

  For the sophisticated-choice point: I should emphasize that sophistication accepts the pump's *threat* as valid, whereas resoluteness challenges the pump's very logic. One avoids exploitation by submitting to transitivity; the other denies exploitation is inevitable by rethinking what exploitation *means*. 

