answer: |-
  Your skepticism is well-founded given your background—cyclic systems *do* often conceal hidden costs. Yet McClennen's resolute choice offers a distinct philosophical defense. Here’s the strongest case for its coherence, addressing both your instinct and the sophisticated-choice alternative:

  ### **Why Resoluteness Isn’t Just "Stopping the Crank"**
  1. **Temporal Sovereignty Over Local Preferences**  
     Resolute choice treats *plans* as primary units of agency. At \(t_0\), the agent evaluates entire *sequences* of actions (e.g., "Plan: A→B→C") rather than atomized choices. Cyclic preferences arise from *local* evaluations ("A vs. C now"), but global planning at \(t_0\) may yield a coherent ranking of *trajectories*. For example:  
     - At \(t_0\): "Plan α (A→B→C)" > "Plan β (C→A→B)" despite later local preferences.  
     This exploits a key insight: **Diachronic rationality need not reduce to synchronic rationality**. Honoring a globally optimal plan isn’t "ignoring" preferences—it’s prioritizing the *temporally extended self* over momentary urges.

  2. **Avoiding Self-Defeat via Identity Persistence**  
     A resolute agent views deviation from a plan as a *corruption of agency*, not a free choice. If you commit to a workout regimen at dawn, skipping it at noon isn’t "maximizing preference"—it’s betraying your past self’s best judgment. McClennen argues this maintains *practical identity*: breaking commitments fractures agency into a series of disconnected time-slices vulnerable to exploitation. Resoluteness preserves integrity across time.

  3. **No Hidden Costs—Explicit Tradeoffs**  
     Unlike a perpetual motion machine, resolute choice *acknowledges* costs: the agent sacrifices local satisfaction for global gain. Consider a cycle where A > B > C > A:  
     - **Myopic agent**: Pays $1 to trade C for A, then another $1 to trade A for B, etc. → drained.  
     - **Resolute agent**: At C, locally prefers A but retains C (sacrificing immediate gain).  
     This isn’t hiding costs—it’s a *strategic sacrifice* to avoid infinite loss, much like refusing to play a rigged game.

  ---

  ### **Why Sophisticated Choice Isn’t Sufficient**
  Sophisticated choosers use backward induction to avoid cycles (e.g., foreseeing exploitation, they refuse the first trade). But this *concedes* the normative force of cyclic preferences:  
  - **Problem 1: Vulnerability to Larger Cycles**  
    Sophistication fails in chains longer than 3 options (e.g., A>B>C>D>A). Backward induction may force acceptance of a dominated choice.  
  - **Problem 2: Incompleteness and Self-Prediction Paradoxes**  
    Sophistication requires perfect foresight of future choices. If preferences shift unpredictably (e.g., hyperbolic discounting), the agent may still be pumped.  
  - **Problem 3: Normative Surrender**  
    Sophistication accepts that local preferences are "true" and works around them. Resoluteness challenges their authority: if your moment-by-self is systematically error-prone, why let it dictate your life?  

  Resoluteness rejects the premise that synchronic preferences define rationality. Instead, **rationality resides in the capacity to bind future selves to plans that avoid foreseeable ruin**.

  ---

  ### **The Defense in a Nutshell**
  Resolute choice is rational because:  
  - **Coherence Over Time**: It defines rationality as fidelity to *deliberative commitments*, not momentary desires.  
  - **Pragmatic Vindication**: It avoids exploitation without requiring transitivity.  
  - **Philosophical Foundation**: It treats agents as temporally extended entities, not preference-maximizing zombies.  

  Your instinct sees a disguised precommitment—but resolute choice is *constitutively* different: precommitments alter options (e.g., Ulysses removing "listen to sirens"), while resoluteness retains all options but chooses based on past plans. It’s not a trick; it’s a theory of **diachronic identity**.  

  As McClennen might argue: An agent who refuses to be pumped isn’t avoiding the mechanism—they’re rejecting the exploiter’s definition of rationality itself.
