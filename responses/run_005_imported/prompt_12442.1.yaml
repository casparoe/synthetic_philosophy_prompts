prompt: |-
  I'm a philosophy PhD student working on moral psychology, and I'd like an example that moves past the standard textbook treatment of the situationist critique of virtue ethics. Excluding Milgram's obedience studies and Zimbardo's Stanford Prison Experiment, describe a real social-psychology finding whose pattern of results specifically threatens the classical unity-of-virtue thesis — the idea that a single form of practical wisdom binds the various virtues into one coherent character — as opposed to a finding that merely shows behavior to be somewhat inconsistent across situations, a result any defender could absorb more easily. Then explain the most promising line of response available to a neo-Aristotelian such as Julia Annas, who treats virtue as an intelligent, situationally sensitive skill rather than a rigid disposition.
reasoning: |-
  Okay, let me tackle this philosophy PhD student's request. They want a social psychology example that specifically threatens the unity-of-virtue thesis in virtue ethics, beyond just showing situational inconsistency. The challenge is to find an experiment that demonstrates fragmented practical reasoning across virtue domains.

  Hmm, the Batson Honesty-Hypocrisy experiment comes to mind. This is perfect because it's not just about behavioral inconsistency - it reveals how participants actively construct self-serving moral reasoning. When given a choice to assign tasks fairly or selfishly, many chose selfishly while maintaining their self-image as fair through post-hoc justifications. 

  What makes this particularly damaging to unity-of-virtue? It shows practical wisdom failing to integrate across contexts. Participants demonstrated situation-specific reasoning that preserved their "fairness" self-concept while acting unfairly - exactly the fragmentation unity theorists worry about. This goes beyond Milgram or Zimbardo by targeting the cognitive integration of virtues.

  For the neo-Aristotelian response, Annas's skill analogy seems promising. Just as a pianist doesn't play perfectly every time, virtue involves continuous situational learning. The Batson subjects might represent learners developing meta-skills: noticing dissonance, refining judgment. The key is framing virtue as progress-sensitive rather than all-or-nothing.

  I should emphasize how this differs from standard situationist critiques. Most experiments show behavioral variance, but Batson exposes fractured practical reasoning - the very cognitive unity virtue ethics requires. The defense must show how such failures are part of skill-development, not evidence against unity's possibility.

  The student will appreciate how this engages deeper philosophical issues: whether virtue's unity is a starting point or achievement, and how practical wisdom develops through reflective calibration. That's the sophisticated discussion they're seeking beyond textbook examples.
answer: |-
  Here's a response tailored to your request, moving beyond the standard examples to target the *unity-of-virtue thesis* specifically, followed by a neo-Aristotelian defense drawing on Annas's skill model:

  **The Threatening Finding: Batson's "Moral Hypocrisy" Experiments (e.g., Batson et al., 1999, 2002)**

  *   **Experimental Setup:** Participants were told they were part of a study on "positive versus negative consequences." They were given two tasks: one clearly positive and rewarding (e.g., earning raffle tickets for a $30 prize), and one clearly negative and tedious (e.g., answering boring questions with no reward). Participants were instructed to assign one task to themselves and the other to another (ostensibly real) participant, *using a fair method* (a coin flip provided). Crucially, they were given privacy; the experimenter wouldn't know their choice or whether they flipped the coin.
  *   **The Crucial Manipulation:** Some participants were given a clear, unambiguous coin (heads = positive task for self, tails = negative for self). Others were given a coin where the assignment (which side meant which task for self) was ambiguous unless they read the small print carefully.
  *   **Pattern of Results:**
      1.  **Self-Interest Dominates:** A significant majority (approx. 80-90%) assigned themselves the positive task.
      2.  **Appearance of Fairness Maintained:** Nearly all participants who assigned themselves the positive task *claimed* they had flipped the coin and it had landed fairly. Even when given the ambiguous coin, participants interpreted the outcome (or fabricated it) to justify their self-serving assignment.
      3.  **The Fragmentation Threat:** Participants readily employed "practical reasoning" to *justify* their self-serving action *as fair*. They manipulated the interpretation of the "fair procedure" (the coin flip) to align with their desired outcome, *while simultaneously maintaining a self-concept and outward appearance of fairness and honesty*. This wasn't mere inconsistency (sometimes fair, sometimes selfish); it was the *active use of reasoning* to *disconnect* the virtue of fairness/honesty from its application in a specific self-relevant situation, while preserving the *appearance* of the virtue.

  **Why This Specifically Threatens the Unity-of-Virtue Thesis:**

  1.  **Compartmentalized Practical Wisdom:** The participants displayed *a form of reasoning* – interpreting the coin flip outcome – but it was subordinated to self-interest rather than governed by a unified practical wisdom seeking the truly fair/just action. Their "wisdom" in this moment was situationally specific and self-serving, not an expression of a coherent character integrating justice, honesty, and self-control.
  2.  **Virtues Working at Cross-Purposes:** The desire for the positive task (arguably a lack of temperance/moderation regarding personal gain) actively *distorted* the reasoning process related to fairness and honesty. Instead of virtues reinforcing each other under the guidance of *phronesis*, one motivational force (self-interest) hijacked the cognitive processes associated with other virtues, using them for its own end (self-justification). The virtues weren't unified; one impulse fragmented and instrumentalized the others.
  3.  **Appearance vs. Reality of Character:** Participants successfully maintained the *appearance* of fairness/honesty *to themselves and potentially others* through this fragmented reasoning. This suggests practical wisdom wasn't unifying their character towards genuine virtue but was being employed to *create a facade* of virtue overlying self-interest. This directly challenges the idea that practical wisdom reliably binds virtues into one coherent, authentic character expressing itself consistently across situations.
  4.  **Beyond Mere Behavioral Inconsistency:** This isn't just behaving fairly in Situation A and unfairly in Situation B. It's demonstrating that *within a single, specific situation demanding fairness*, practical reasoning itself can become fragmented and self-deceptively biased, actively *preventing* the unified expression of virtues that should govern that situation. The "unity" breaks down at the cognitive level in the moment of application.

  **Neo-Aristotelian (Annas-Inspired) Defense: Virtue as Situational Skill & Meta-Cognitive Awareness**

  Annas's model, treating virtue as a "skill of living" analogous to complex practical skills (like playing piano or medicine), offers a promising line of response:

  1.  **Skillful Performance is Fallible & Requires Learning:** Just as a skilled pianist can hit a wrong note under pressure or misread a complex passage, a person developing virtue can misapply practical wisdom in a challenging, motivationally loaded situation. Batson's experiment presents a highly specific "performance challenge" – managing self-interest while executing a procedural fairness task privately. Failure here doesn't negate the *existence* or *possibility* of the skill; it highlights its difficulty and the need for practice and refinement, particularly in contexts involving self-deception.
  2.  **Situational Sensitivity Includes Recognizing Biases:** Part of practical wisdom (*phronesis*), as a skill, is developing the meta-cognitive ability to recognize situations where one's judgment is *likely* to be biased (e.g., when self-interest is strongly engaged and oversight is absent). The truly virtuous person, according to the skill model, isn't just someone who *has* dispositions, but someone who has *learned* to be vigilant in precisely these kinds of "hot" cognitive situations. Batson's subjects failed this meta-cognitive aspect of the skill. They lacked the situational awareness to realize their reasoning needed extra scrutiny.
  3.  **The "Unity" is an Achievement, Not a Given:** Annas emphasizes that virtue is developed through practice, reflection, and habituation. The unity of the virtues is not a pre-existing state but an *outcome* of successfully integrating practical wisdom across diverse experiences. Batson's findings show individuals who *haven't yet achieved* this integration, particularly in contexts that pit self-regard against other-regard. Their practical wisdom is fragmented *because* they haven't fully developed the skill to navigate that specific conflict coherently. The finding shows a failure of development, not the impossibility of the end state.
  4.  **Focus on the Reasoning Process, Not Just Outcome:** The neo-Aristotelian can argue that what Batson exposes is *flawed reasoning* under pressure, not the absence of reasoning altogether. The skill model predicts that beginners and those underdeveloped in virtue *will* make reasoning errors, especially self-serving ones. The defender points to the *nature of the error* – self-deceptive justification – as evidence of a *misapplied* or *immature* practical wisdom, struggling to integrate competing demands, rather than evidence that integrated practical wisdom cannot exist. The virtuous person's skill lies in avoiding this specific error pattern through better meta-cognition and commitment to truthfulness with oneself.
  5.  **The Importance of Reflective Practice:** Annas stresses the role of reflection in skill development. The Batson experiment, if framed as a learning experience, could *contribute* to unity. Recognizing one's susceptibility to such bias *is* a step towards developing the meta-cognitive aspect of practical wisdom needed to prevent it in the future. The fragmentation shown is a snapshot of underdeveloped skill, not its essential nature.

  **Conclusion:**

  Batson's Moral Hypocrisy experiments present a potent challenge by demonstrating how practical reasoning itself can fragment under self-interest, allowing virtues like fairness and honesty to be cognitively isolated and instrumentalized for self-justification, directly threatening the cognitive unity central to the classical thesis. However, a neo-Aristotelian like Annas can respond effectively by framing virtue as a complex, fallible, developmental *skill*. Failures like those in Batson's lab are seen not as proof against unity, but as evidence of the *difficulty* of the skill, highlighting the need for specific meta-cognitive capacities (recognizing bias-prone situations) and continuous reflective practice to achieve the integrated practical wisdom that constitutes the unity of the virtues. The unity is a hard-won achievement of the fully developed skill, not an all-or-nothing innate disposition easily derailed by mere situations.
