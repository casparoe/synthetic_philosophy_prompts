   Now, this is the same as the earlier matching example and still each player's payoff does not depend on their own action in a way that they can influence it beyond what they choose. In fact, P1 by choosing a1 can choose to match a2 or not. So it does depend.

   Let's check for P1:
   If a2=0, then P1 can get 1 by playing 0, or 0 by playing 1.
   If a2=1, then P1 can get 1 by playing 1, or 0 by playing 0.

   So no dominant strategy.

   But is any strategy dominated? 
   For P1, if they play 0: 
     if a2=0: 1
     a2=1: 0
   If they play 1:
     if a2=0: 0
     a2=1: 1

   So neither dominates the other.

   Mixed strategy for P1: play 0 with p.
   Then against a2=0: p*1 + (1-p)*0 = p
   against a2=1: p*0 + (1-p)*1 = 1-p

   To see if mixed strategy can dominate pure strategy 0, we would need:
     for a2=0: p > 1  (which is impossible) and for a2=1: 1-p > 0, which is true for p<1, but not both. So no.

   So no domination.

   However, in the rationalizability context, the issue might arise in later rounds. But with three players, we need to iterate.

   But note: the only Nash equilibrium is for all to play the same action, or all to play the mixed strategy 1/2.

   But for rationalizability, let's see what happens.

   For player 1: to justify playing 0, he must believe that P2 plays 0. Similarly, to justify playing 1, he must believe that P2 plays 1.

   For player 2: to play 0, she must believe that P3 plays 0; to play 1, believe P3 plays 1.
   For player 3: to play 0, believe P1 plays 0; to play 1, believe P1 plays 1.

   Now, in independent rationalizability, we start with all strategies possible.

   Then for player 1, both 0 and 1 are rationalizable because there are beliefs about P2 (e.g., P2 plays 0 with probability 1) that make 0 a best response.

   Similarly for others.

   Then we go to the next round: the set of possible strategies for each is still {0,1}. So nothing changes.

   So all strategies survive.

   This doesn't show the difference.

   After more thought, I recall that in three-player games, the set of independent rationalizable strategies can be strictly larger than the set of correlated rationalizable strategies in some games, but usually it's the opposite: independent rationalizability is more restrictive.

   In fact, in the standard settings, correlated rationalizability is always a superset of independent rationalizability.

   The example I want is where a strategy is eliminated under independent rationalizability (because of the independence assumption) but not under correlated.

   Consider the following game (from a stackexchange post or a paper):

   Players: A, B, C.
   Actions: A has {a1, a2}, B has {b1, b2}, C has {c1, c2}.

   Payoffs: 
   - Player A: 
        if C plays c1: 
            against b1: a1 gets 1, a2 gets 0
            against b2: a1 gets 0, a2 gets 1
        if C plays c2:
            against b1: a1 gets 0, a2 gets 1
            against b2: a1 gets 1, a2 gets 0

   - Player B: 
        if C plays c1: 
            against a1: b1 gets 0, b2 gets 1
            against a2: b1 gets 1, b2 gets 0
        if C plays c2:
            against a1: b1 gets 1, b2 gets 0
            against a2: b1 gets 0, b2 gets 1

   - Player C: 
        if (A plays a1 and B plays b1) or (A plays a2 and B plays b2): 
            c1: 1, c2: 0
        otherwise: 
            c1: 0, c2: 1

   So, in summary, the payoffs for A and B are like a coordination game that depends on C's action, and C's payoff depends on whether A and B are coordinated on the same action profile (a1,b1) or (a2,b2) or not.

   Now, let's see. 
   For player C: 
     In the or's condition (coordinated), playing c1 gives 1, c2 gives 0.
     In the uncoordinated, playing c1 gives 0, c2 gives 1.

   So c1 is a best response if A and B are coordinated, c2 if not.

   For player A and B, their payoffs depend on C's action and the other's action.

   Let's see if we can do iterated elimination.

   First, for player C: no strategy is dominated because if C believes that A and B are coordinated, then c1 is better; if not, c2 is better.

   For player A: 
     If she believes that C plays c1, then she wants to match B's action in a specific way: 
          if B plays b1, she should play a1 (because then she gets 1); if B plays b2, she should play a2.
     If she believes that C plays c2, then she wants to mismatch: 
          if B plays b1, she should play a2; if B plays b2, she should play a1.

   Similarly for B.

   So in the first round, no strategy is dominated for anyone.

   But now, consider the iterative process. 

   In independent rationalizability, we require beliefs to be a product of the strategies of the opponents.

   For example, when player A is forming a belief, she has a distribution over B's actions and over C's actions, and she assumes independence between B and C.

   Similarly for B.

   For player C, she has a belief over (A,B) which may be correlated.

   Now, can we eliminate any strategy for player A? 

   Suppose we are in the second round. We have not eliminated any strategy yet.

   For player A, to justify playing a1: 
     She needs to believe that the action profile (b, c) is such that a1 is a best response.

     If c = c1, then a1 is best response only if b = b1.
     If c = c2, then a1 is best response only if b = b2.

   So in either case, she must believe that b and c are such that either (b1,c1) or (b2,c2) with probability 1.

   But if she is required to have independent beliefs, then the probability of (b1,c1) is the product of the probability of b1 and of c1. Similarly for (b2,c2). She might assign positive probability to both (b1,c1) and (b2,c2) if she has high probability on b1 and on c1, and also on b2 and on c2? But note, if she believes that c1 is played with high probability and b1 with high probability, then (b1,c1) has high probability, and (b2,c2) might have low probability. But she could also have belief that c1 and c2 are equally likely, and b1 and b2 are equally likely, then (b1,c1) and (b2,c2) each have probability 1/4, and the off-diagonal have 1/4 each. Then the expected payoff of a1: 
     if (b1,c1): 1
     (b1,c2): 0 (because when c2 and b1, a1 is not best)
     (b2,c1): 0
     (b2,c2): 1
     so expected payoff = (1)(prob of (b1,c1)) + (1)(prob of (b2,c2)) = 1/4 + 1/4 = 1/2.

   For a2: 
     if (b1,c1): 0 (because then a2 would be played when c1 and b1: which gives 0)
     wait, let me compute for a2:
        if (b1,c1): a2 gets 0 (because for c1, when b1, a2 gets 0)
        (b1,c2): a2 gets 1 ( for c2, when b1, a2 is best because it gives 1)
        (b2,c1): a2 gets 1
        (b2,c2): a2 gets 0
     so expected payoff = 0* (b1,c1) + 1*(b1,c2) + 1*(b2,c1) + 0*(b2,c2) = 1/4 + 1/4 = 1/2.

   So a1 and a2 give the same expected payoff. So a1 is a best response (as good as any).

   So it survives.

   But consider a more refined elimination. The example is not working to show the difference.

   I found an example in Perea (2012) or other. Let me use this one:

   Players: A, B, C.
   Actions: A: {a1, a2}, B: {b1, b2}, C: {c1, c2}.

   The payoff for C is: 
     C gets 1 if either (A plays a1 and B plays b1) or (A plays a2 and B plays b2), and C plays c1; or if not in that set and C plays c2.
     Otherwise, 0.

   But then it's weakly dominant for C to play c1 in the first set and c2 in the second, so that doesn't help.

