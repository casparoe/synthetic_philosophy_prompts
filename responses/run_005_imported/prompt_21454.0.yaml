  ### Justification
  **1. Marcus (Score: 1)**  
  *Strength:* Correctly identifies the epistemic burden problem. Walzer's practical concern about soldiers' inability to reliably assess *jus ad bellum* is valid. Soldiers lack access to intelligence, legal expertise, and strategic context.  
  *Weakness:* Doesn't address whether this practical limitation should *override* objective morality.  

  **2. Leah (Score: 1)**  
  *Strength:* Successfully reframes the debate around objective permissibility. Her self-defense analogy is apt: sincere belief doesn't create moral permission if objective facts don't justify violence.  
  *Weakness:* Underestimates how voluntariness affects moral status (raised later).  

  **3. Marcus (Score: 0)**  
  *Strength:* Highlights a counterintuitive implication of Leah's view: moral equivalence between conscripts and leaders seems unjust.  
  *Weakness:* Misrepresents Leah's position slightly. She didn't claim conscripts are *equally* legitimate targets—only that both lack immunity.  

  **4. Leah (Score: -1)**  
  *Strength:* Correctly distinguishes liability from blameworthiness—a key McMahan move.  
  *Weakness:* Fails to resolve Marcus's core challenge: *What makes someone "responsible enough" to be liable?* Her answer ("objective danger") ignores the voluntariness spectrum. A sleepwalker poses danger but isn't liable; a volunteer soldier might be.  

  **5. Marcus (Score: 2)**  
  *Strength:* Exposes the fatal flaw in Leah's liability framework. If liability requires minimal responsibility, coerced conscripts are excluded—but this also excuses many real-world soldiers, undermining McMahan's critique. If liability requires *any* causal role, it permits targeting non-culpable threats (e.g., brainwashed child soldiers).  
  *Weakness:* Doesn't offer a positive alternative.  

  ### What Both Missed
  - **Institutional vs. Individual Responsibility:** Neither addresses how military/political structures *distribute* ad bellum responsibility (e.g., generals vs. privates).  
  - **Reasonable Belief Standard:** Leah dismisses belief too absolutely. Some philosophers (e.g., David Rodin) argue soldiers with *reasonable but false* belief in just cause may retain partial immunity.  
  - **Asymmetry of Risk:** Soldiers on the just side defend innocents; unjust soldiers endanger them. This may affect liability even absent personal culpability.  
  - **Practical Consequences:** Marcus's position better reflects IHL's function (clear rules for soldiers), while Leah's risks paralyzing just wars if soldiers second-guess causes.  

  ### Overall Verdict  
  Marcus wins on practical coherence (point 5 is decisive), while Leah wins on moral rigor (point 2 stands). The exchange reveals McMahan's framework struggles with *non-culpable threats*—a recognized weakness in revisionist just war theory. Walzer's equality remains stronger for governing battlefield conduct, though weaker as deep morality.  

  Recommend discussing Helen Frowe's work on *degrees* of liability and Jonathan Parry's "conditional threats" concept at your next practice.
