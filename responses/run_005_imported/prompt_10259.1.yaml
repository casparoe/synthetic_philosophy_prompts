answer: |-
  The airlock hissed open, revealing not the sterile corridor Kael expected, but a small, dimly lit observation lounge aboard the *Wanderlust*. Opposite him, framed by the curved viewport showing the swirling ochre storms of Jupiter, stood a mirror that blinked. Lyra. Same sharp cheekbones, same stubborn set to the jaw, same startlingly pale green eyes that now held the same wary recognition he felt.

  They’d been separated at birth, two genetic echoes sold to different off-world consortiums. Kael grew up in the gritty orbital docks of Titan Station, learning resource allocation and hard-nosed negotiation from miners and traders. Lyra was raised by the introspective xenolinguists of the Ganymede Institute, her world one of complex algorithms and the subtle dance of alien communication. They’d only discovered each other’s existence months ago, through overlapping genetic markers flagged by a universal health registry. This meeting, brokered by neutral parties, was supposed to be about shared history. Then the Corealis asteroid data dropped into both their laps.

  Corealis wasn’t just valuable; it was epoch-defining. Scans indicated a motherlode of stable, room-temperature superconductors – the key to unlocking fusion efficiency, near-instantaneous computation, everything. Whoever controlled its location could dictate terms to EarthGov itself. The data was fragmented, encrypted, and scattered. Kael’s Titan contacts had recovered 60% of the locational coordinates. Lyra’s Ganymede algorithms, working on intercepted transmissions, had cracked the encryption key for the *other* 40%. Each held half the map to unimaginable power. And each knew the other held the missing piece.

  Their initial pleasantries had evaporated faster than comet ice in vacuum. Now, they sat at a small table, the only light coming from the swirling gas giant outside and the faint glow of their personal datapads. The unspoken question hung heavier than Jupiter’s gravity well: *Share, or hoard?*

  Kael leaned forward, the scar above his eyebrow – a relic of a decompression drill gone wrong – catching the dim light. "Look, Lyra. We can play this the hard way. We both know the standard game theory. Defect. Hoard your piece. Try to leverage it, steal the other half. Maybe you win big, maybe I do. More likely, we both lose. EarthGov sweeps in, confiscates everything in the 'interest of galactic stability,' and we get a pat on the head and a footnote in the report."

  Lyra steepled her fingers, her movements precise, economical. "The dominant strategy *is* defection, Kael. Independence. Control. My analysis confirms it. Protecting my asset maximizes my potential gain and minimizes catastrophic loss." Her voice was calm, analytical, but Kael saw the flicker in her eyes – the same flicker he felt in his own gut. Not just greed, but the terrifying weight of the opportunity, and the fear of being the sucker.

  "But *are* we independent?" Kael pressed. He tapped his temple. "We think the same way. Not identical, no. Titan taught me to watch for the knife in the dark. Ganymede taught you to parse the lie hidden in syntax. But the *foundation*... the wiring? We solve problems the same way. We see patterns. We weigh risks. We’re… correlated." He used the statistical term deliberately, learned from her own background brief.

  Lyra’s gaze sharpened. "Correlation isn't causation, brother. And it certainly isn't identity. Your 'hard knocks' pragmatism might lead you to a quick, brutal betrayal. My algorithmic perspective might lead me to calculate that long-term strategic isolation is optimal. Our outputs *could* diverge significantly."

  "Could," Kael echoed. "But would they? Think about it. Truly think. Whatever logic I use to justify screwing you over… wouldn’t that *exact same logic* occur to you? Because we *are* this similar. If I conclude defection is my best move, wouldn’t you, looking at the same board with the same kind of mind, reach the same conclusion? And then where are we? Staring at each other across this table, both sitting on useless half-truths while EarthGov’s cruisers jump into the system. We guarantee mutual destruction. The worst payoff."

  He saw it then, the subtle shift. Not agreement, but the dawning horror of the recursive trap. The superrational bind. *If I defect, she defects. If I cooperate, she… might cooperate? Or might defect?* The uncertainty was the poison.

  Lyra looked down at her datapad, the encrypted key glowing softly. "Your argument hinges on an assumption of near-perfect mental symmetry. It ignores environmental conditioning. My upbringing values evidence, verification. Handing over the key without guarantees isn't rational; it's faith. Your background might value perceived kinship, a gamble on shared blood."

  "And yours doesn't value survival?" Kael countered, his voice low. "The rational outcome, the *best* outcome, is mutual cooperation. We share, we secure Corealis *together*, we become unstoppable. But that outcome only happens if we *both* choose it. And the *only* way I can see us both choosing it… is if we both *realize* that choosing the other way guarantees failure. Because we’re both too smart, too *similar*, to walk blindly into that trap."

  He slid his datapad across the table. On the screen, unencrypted, were the Titan coordinates – the 60%. A raw, bleeding display of vulnerability. "My move, Lyra. I’m trusting the correlation. I’m trusting that the logic that brought me here… lives inside you too. That you see the same inevitable, stupid mutual ruin if we play 'rationally.' That maybe ‘superrationality’ isn’t about being identical, but about recognizing the deadly symmetry in how we think, even if the thoughts themselves aren't pixel-perfect copies."

  The silence was absolute, broken only by the faint hum of the *Wanderlust*'s life support. Jupiter’s storms churned silently beyond the viewport, a vast, indifferent witness. Lyra stared at the coordinates. Her hand hovered over her own pad, fingertips resting near the icon that would transmit her encryption key.

  Kael watched her face, searching for the micro-expressions he knew so well on his own – the tightening around the eyes when calculating risk, the slight quiver of the lip when suppressing fear. He saw them. But were they *his* expressions, or subtly different? Was the Ganymede conditioning stronger than the shared genetics? Was her definition of "verification" an insurmountable wall?

  *She’s running the simulation*, he realized. *Just like I did. Weighing my move. Weighing the possibility that I’m setting a trap. Weighing the terrifying possibility that I’m sincere.* The logic chains would be spiraling in her mind, complex, probabilistic. *If he cooperates, and I cooperate, we win big. If he cooperates and I defect, I win huge… but is that likely? He expects me to see the mutual destruction path… but does he expect me to see him expecting that? Is his cooperation a *higher-level* defection?*

  Her finger moved. Not towards the transmit icon, but to a different command sequence. A complex series of inputs. Kael’s breath hitched. Was it a counter-offer? A security protocol? A prelude to locking him out?

  "Your coordinates check out against my fragmentary models," Lyra said, her voice devoid of inflection. "Plausible. Highly plausible." She finally looked up, meeting his eyes. The green depths were unreadable. "But plausibility isn't proof. Correlation isn't causation. And trust…" She paused, the word hanging like a shard of ice. "...is not a variable in my core equations."

  She tapped the final key. On Kael’s datapad, a new window bloomed. Not the encryption key. Instead, it was a complex, dynamic encryption protocol – a one-time lock requiring *his* biometric signature combined with a real-time confirmation signal from *her* pad to unlock. And a timer. Five minutes.

  "This," Lyra said, her voice flat, "is the key. Encrypted behind a layer that requires your active, verifiable cooperation *and* my simultaneous release command to unlock. It transmits nothing until *both* conditions are met at the zero-second mark."

  Kael stared at the screen, then back at her. It wasn't cooperation. It wasn't defection. It was a forced mutual move. A way to ensure neither could betray the other *in this instant* without guaranteeing mutual failure. She hadn't handed over the key; she’d placed it in a vault that required both their hands on the wheel to open. She’d sidestepped the superrational bind by *changing the game*, imposing a new rule that forced synchronicity.

  He understood her reasoning instantly, the elegant, ruthless logic of it. It *was* rational. It protected her asset while creating a mechanism for potential gain. It mirrored his own desire to avoid mutual destruction, but through control, not vulnerability.

  But it also screamed distrust. Loudly. She hadn’t taken his leap. She’d built a bridge with trapdoors.

  The timer ticked down: 4:59… 4:58…

  He could refuse. Walk away. Leave her with her useless key fragment and his useless coordinates. Mutual destruction achieved through stubbornness. Or… he could accept her forced symmetry.

  He looked at his sister, his genetic echo, his perfect stranger. He saw the logic in her eyes, cold and brilliant, forged in the labs of Ganymede. It wasn't his logic. It was *hers*. Correlated, yes. Similar in structure, undoubtedly. But diverging at the critical junction where his Titan pragmatism had gambled on kinship and her Ganymede intellect demanded verifiable proof.

  The superrational dream of effortless cooperation between like minds dissolved in the harsh light of the timer. Likeness wasn’t enough. Not nearly enough.

  Kael raised his hand slowly towards the biometric scanner on his pad. His thumb hovered over the sensor. Across the table, Lyra’s finger rested lightly above the release command on hers. Jupiter’s vast, turbulent face filled the viewport, reflecting no answers, only the endless, complex dance of opposing forces.

  He pressed his thumb down. The scanner glowed green. Acceptance.

  Now it was her move. Her choice. Her finger, poised above the key that would either unlock everything or doom them both to a lesser, stubborn ruin. The seconds bled away. Her expression remained unreadable, a mask of pure calculation. The only sound was the relentless, digital countdown in the silence between them.
