answer: |-
  ### Dialogue: The Stopping Rule Dilemma

  **Setting:** A conference room with two statisticians, Dr. Freya Frequentist and Dr. Bayesia Bayesian, reviewing an experiment log from a checkout-flow A/B test. The log shows:  
  - **Treatment Group:** 5,000 users, 1,100 conversions.  
  - **Control Group:** 5,000 users, 1,000 conversions.  
  - **Stopping Rule:** The experiment was stopped the moment the p-value hit 0.05 (two-sided test).  

  ---

  ### **Part 1: The Initial Analysis**
  **Dr. Frequentist:**  
  *adjusts glasses, pointing at the log*  
  "Bayesia, this is a classic case of *peeking*. The team ran a two-sample proportion test, got a p-value of 0.049, and declared victory. But the sampling distribution here is distorted. Since they stopped at 5,000 users *because* significance was reached, the true Type I error rate isn’t 5%—it’s inflated. If they’d fixed the sample size upfront, the p-value would be valid. But with peeking? No."  

  **Dr. Bayesian:**  
  *calmly sips tea*  
  "Freya, the data are identical to what they’d have if they’d planned 10,000 users upfront and stopped at 5,000 by chance. The likelihood function—the engine of inference—depends only on the observed data: 1,100 successes out of 5,000 for treatment, 1,000 out of 5,000 for control. Whether they stopped because of a p-value, a coin flip, or a bird flying past the window is irrelevant. The *data* say the same thing."  

  ---

  ### **Part 2: The Technical Core**
  **Dr. Frequentist:**  
  "Let me make this concrete. Suppose you have two designs:  
  - **Design 1 (Fixed):** Sample exactly 10,000 users.  
  - **Design 2 (Sequential):** Sample until p < 0.05 or you hit 10,000 users.  

  In Design 2, the sampling distribution of the test statistic has heavier tails. Why? Because under the null (no effect), you’re more likely to stop early by random chance. If you simulate this, the false positive rate for Design 2 is ~22%, not 5%! The p-value assumes a fixed sample—violate that, and you break error control."  
  *projects simulation code showing inflated false positives under peeking*  

  **Dr. Bayesian:**  
  "But Freya, the *likelihood principle* collapses that distinction. The likelihood for a binomial parameter θ is proportional to θᵏ(1-θ)ⁿ⁻ᵏ. Whether you planned n=10,000 and saw k=1,100 at n=5,000, or you intended to stop at p<0.05 and saw the same data, the likelihood is identical. Your sampling distribution depends on hypothetical data you *didn’t* see. I care only about the data we *have*."  

  ---

  ### **Part 3: Pressing the Practical Costs**
  **Dr. Frequentist:**  
  "Your ‘likelihood principle’ ignores real-world consequences! If teams peek freely, false positives explode. Pre-registration and alpha-spending (like O’Brien-Fleming) exist to cap error rates. Without them, you’ll declare effects from noise—like that infamous psychology ‘power pose’ study. Replication crises happen because people *don’t* account for stopping rules!"  

  **Dr. Bayesian:**  
  "And your fixes are band-aids on a flawed framework. Pre-registration polices *intentions*, not evidence. Two scientists with identical data—one who planned n=10,000, one who peeked—would give different p-values. That’s absurd! My posterior distribution for the treatment effect, P(θ|data), depends only on the data. I’d get the same posterior whether they stopped at 5,000 or 50,000 users."  

  **Dr. Frequentist:**  
  "But your prior can be gamed! If I peek and stop early, I can cherry-pick a prior that makes my result look robust. And your ‘error rates’ aren’t calibrated. If I run 100 Bayesian A/B tests with peeking, how many false positives do I get? You can’t answer that—it depends on priors and stopping whims!"  

  **Dr. Bayesian:**  
  "Frequentist error rates are averages over hypothetical worlds. In *this* world, with *this* data, the treatment conversion rate is 22% (1,100/5,000) vs. control’s 20% (1,000/5,000). The Bayes factor favors the effect, and my posterior probability that θ_treatment > θ_control is 98%. Should I ignore that because someone peeked? Data don’t have diaries."  

  ---

  ### **Part 4: The Standoff**
  **Dr. Frequentist:**  
  "So if the team peeks daily and stops at the first blip of significance, you’d endorse that as ‘evidence’? Even knowing 1 in 20 null experiments would ‘succeed’ by chance?"  

  **Dr. Bayesian:**  
  "No—I’d use a prior that penalizes early stops or model the stopping rule. But the core insight holds: identical data *are* identical. You’d punish researchers for luck. If they stopped at n=5,000 because a fire alarm rang, you’d accept p=0.049. If they stopped for significance, you’d reject it. That’s incoherent!"  

  **Dr. Frequentist:**  
  "And you’d let a p-hacker claim ‘Bayesian evidence’ because their data *looks* the same as a valid experiment. Your framework is silent on operational discipline!"  

  **Dr. Bayesian:**  
  "Your framework is silent on evidence! You reject a true effect because a researcher *thought* about peeking, even if they didn’t. That’s not inference—it’s mind reading."  

  *Both sit back, the log between them unresolved.*  

  ---

  ### **Epilogue: The Ambiguity**  
  The experiment log sits in silence. The frequentist sees a p-value invalidated by the path taken; the Bayesian sees likelihoods blind to that path. One warns of collective error rates in a thousand hypothetical trials; the other demands conclusions from the single trial observed. The cost of peeking is either a statistical sin (Frequentist) or an engineering trade-off (Bayesian). Neither concedes—and the platform team is left wondering if the argument is about math, philosophy, or the unspoken rituals of science itself.
