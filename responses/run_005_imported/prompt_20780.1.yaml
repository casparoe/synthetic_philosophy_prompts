answer: |-
  You've hit upon a genuinely insightful and contested point in Quine scholarship. Your characterization has strong textual support and represents a sophisticated reading, **but it needs careful qualification to avoid overstatement.** Quine's position is complex and arguably contains an unresolved tension. Here's a breakdown:

  1.  **The Strong Holism Argument (Your Point):**
      *   **Correct Premise:** Quine absolutely extends his holism (from "Two Dogmas") to moral statements in "On the Nature of Moral Values." He explicitly states: "No statement is immune to revision... This applies equally to moral statements."
      *   **Correct Premise:** He dissolves the analytic/synthetic distinction, meaning there's no *fundamental* epistemological difference in kind between logical, mathematical, scientific, or ethical statements. They all reside in the same "web of belief."
      *   **Correct Inference:** Therefore, moral judgments *are* answerable to experience, *in principle*, in the same holistic way as theoretical physics. They are connected to sensory input via the network of beliefs. Recalcitrant experience *could* force revisions anywhere, including ethics.
      *   **Potential Conclusion:** This *structural* similarity suggests moral judgments could be cognitive claims about the world, subject to empirical (though holistic) constraint – pointing towards a form of naturalistic moral realism.

  2.  **Why He's *Usually* Seen as a Skeptic / Non-Cognitivist / Projectivist:**
      *   **Empirical Vacuity:** Quine consistently argues that moral statements *lack specific empirical content* in a way that scientific statements do *not*. Science has specific, testable predictions tied to sensory stimuli. Moral statements are far more removed. He says they are "associated" with sensory stimulation only "derivatively and complexly."
      *   **The "Projection" Metaphor:** Quine famously describes moral values as "projected" onto reality. This is a classic non-cognitivist/projectivist move. We react to the world (e.g., with disgust at suffering) and project this reaction onto the world *as if* it were an inherent property ("suffering is bad"). This strongly suggests he doesn't believe moral properties are *real* features of the world science discovers.
      *   **Social Conditioning vs. Empirical Discovery:** Quine emphasizes that moral values are primarily acquired through *social conditioning*, not through empirical investigation or hypothesis testing in the way scientific beliefs are refined. Their origin story points away from realism.
      *   **Peripheral Status:** While *any* belief could be revised, Quine implies moral beliefs reside closer to the "periphery" of the web, where revisions happen with less direct empirical pressure and more social/pragmatic influence, compared to core logical or central scientific beliefs.
      *   **Naturalism Focused on Science:** Quine's naturalism is deeply tied to the methods and ontology of the natural sciences. He sees ethics as derivative, lacking the robust empirical grounding and predictive power that define scientific knowledge for him.

  3.  **The Tension & How to Characterize it for Students:**
      *   **Structural Holism vs. Substantive Non-Cognitivism:** This is the core tension. Quine grants moral statements the *formal* status of being part of the holistic web of belief, potentially revisable by experience. However, his *substantive* analysis of *how* they function – their empirical vacuity, their origin in projection and conditioning – strongly leans towards non-cognitivism and skepticism about their truth-aptness or their correspondence to mind-independent moral facts.
      *   **Naturalistic Framework, Skeptical Conclusion within it:** Quine provides a *naturalistic framework* (holism, rejection of first philosophy) within which ethics *could* potentially be naturalized. However, *his own application* of that framework *to ethics* leads him to a skeptical/non-cognitivist conclusion *about moral knowledge and facts*. He doesn't see ethics generating knowledge *in the same way* science does, despite the shared holism.
      *   **Not a Moral Realist:** It's inaccurate to call Quine a moral realist. Realism typically involves believing moral properties are objective, mind-independent features of the world that our judgments can (at least sometimes) correctly track. Quine's "projection" thesis explicitly denies this. Holism doesn't entail realism; it just means moral claims aren't *epistemically isolated*.
      *   **Paving the Way for Others, Not Walking the Path Himself:** Quine's holism and naturalism *created the conceptual space* for later naturalistic moral realists (like later Cornell Realists - Boyd, Brink, Sturgeon) who *do* argue that moral properties are natural properties discoverable holistically within science. Quine provided crucial tools but didn't use them to build moral realism himself.

  **How to Present it Sanely to Students:**

  1.  **Acknowledge the Insight:** "Quine's extension of confirmation holism to ethics is crucial. He insists moral statements are *not* epistemically isolated; they *are* part of the holistic web of belief, answerable *in principle* to recalcitrant experience alongside scientific statements. This breaks down a sharp fact/value dichotomy *structurally*."
  2.  **Present the Tension:** "However, Quine *simultaneously* argues that moral values are fundamentally different in how they connect to experience. He describes them as 'projected,' lacking specific empirical content, and primarily acquired through social conditioning, not empirical testing. This leads him towards a skeptical or non-cognitivist view *about moral truth and knowledge*."
  3.  **Clarify the Distinction:** "So, while Quine grants moral judgments a place *within* the naturalistic, holistic system of knowledge, his analysis suggests they don't function cognitively *like* scientific theories. They aren't tracking mind-independent moral facts in the way physics tracks physical facts. Holism provides the *framework*, but his *conclusion* about ethics remains skeptical."
  4.  **Legacy:** "This tension is productive! Quine's naturalism and holism provided essential groundwork *for* contemporary naturalistic moral realists, even if he himself didn't cross that bridge. They argue that *within* a Quinean holistic naturalism, moral properties *can* be understood as complex natural properties subject to empirical constraint."

  **Conclusion:** Your reading is sophisticated and highlights a vital, often underappreciated aspect of Quine. **He does treat moral judgments as *structurally* continuous with scientific judgments via holism, making them answerable to experience in the same broad sense.** However, **he is not a moral realist.** His substantive analysis of the *nature* of moral judgments leads him to skepticism/non-cognitivism *within* that holistic framework. Presenting this nuanced tension accurately captures Quine's complex position and its significance for naturalized ethics.
