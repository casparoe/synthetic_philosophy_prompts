answer: |-
  ## Dialogue: The Theft of Time - Wood vs. Husami on Marxian Justice

  **Setting:** A university common room after a seminar on Marx. Coffee cups litter the table. **Alex** (Wood-ist) and **Sam** (Husami-ist) continue the debate.

  **Alex (Wood-ist):** Sam, I appreciate your passion, but I think we must take Marx at his word when he explicitly states the capitalist-worker exchange *isn't* robbery *by capitalism's own rules*. Look at *Capital*, Volume 1, Chapter 6: "This circumstance... is a piece of good luck for the buyer, but by no means an injustice (*Unrecht*) to the seller." The worker gets the value of their labor-power. The surplus extracted *after* that fair exchange is how the system *works*, not a violation of its internal justice. Condemning it as "unjust" smuggles in an external, ahistorical moral standard Marx rejects.

  **Sam (Husami-ist):** Alex, that quote describes the *surface appearance* of the *exchange* – the market transaction. But Marx’s core analysis plunges beneath that, into the *production process* where exploitation happens. Yes, labor-power is paid its *value*. But what about the *labor* performed *after* that sale? Marx constantly calls the appropriation of surplus value "embezzlement," "robbery," "usurpation," and "theft" of the worker's *labor time*! How can he use such morally loaded language – *especially* in his *scientific* analysis in *Capital* – if he genuinely believed capitalism was perfectly just on its own terms? Why not just call it "exploitation" neutrally?

  **Alex (Wood-ist):** Precisely because "exploitation" *is* the neutral, scientific term for the mechanism! The moral language – "robbery," "theft" – is polemical, highlighting the *brutality* and *alienation* inherent in the system. It reveals the worker's loss of control over their activity and product, not a violation of an abstract right. Remember the *Critique of the Gotha Programme*? Marx savages the Lassalleans: "Right can never be higher than the economic structure of society and its cultural development conditioned thereby." Talk of "fair distribution" is "obsolete verbal rubbish"! Justice is immanent to the mode of production. Capitalism generates *its own* standard of justice – bourgeois right – and by *that* standard, it *is* just. Marx condemns it for its inherent contradictions, alienation, and historical transience, not for violating its own rules.

  **Sam (Husami-ist):** But that’s too limiting! Historical materialism doesn't mean we are trapped *only* evaluating a society by its *own* standards. Marx clearly evaluates capitalism *retrospectively* from the standpoint of primitive accumulation – calling it "expropriation" and "conquest" – and *prospectively* from the standpoint of the future society. In *Capital*, Volume 1, Chapter 26, he calls the genesis of capital "written in the annals of mankind in letters of blood and fire." That’s a *moral* indictment based on a standard *external* to feudalism or early capitalism. And crucially, he uses the *future* communist standard implicitly throughout. When he says the worker under capitalism is "free in the double sense" – free *from* the means of production and free *to* sell their labor-power – isn't he ironically highlighting a *false* freedom judged by the standard of true human emancipation? Theft implies a rightful owner deprived. For Marx, doesn't the collective producer, or humanity in its emancipated form, have a claim on the social product that capitalism violates?

  **Alex (Wood-ist):** You're conflating different levels of analysis. Primitive accumulation *is* historically contingent violence, distinct from the ongoing *structural* exploitation within developed capitalism. Calling it "expropriation" describes a historical process, not necessarily a timeless injustice. As for the future standard... where does Marx *explicitly* say communism provides the *standard of justice* by which to condemn capitalism? He condemns capitalism for its *fetters* on production, its *crises*, its *alienation*. The "theft" language emphasizes the *fact* that surplus labor is extracted without equivalent return, causing suffering and stunting human development. But "theft" here signifies *exploitation*, the core relation, not a juridical crime judged by communism’s norms. His point in *Gotha* is that even communism’s "equal right" is a *bourgeois* right initially! Justice-talk distracts from the materialist analysis of the system’s dynamics.

  **Sam (Husami-ist):** He doesn’t need to say it explicitly because it’s woven into the fabric of his critique! When he analyzes surplus value as *unpaid labor*, he’s implying the worker has a rightful claim to the fruits of *all* their labor. Capitalism systematically denies that claim. The "higher mode of production" isn't just more efficient; for Marx, it realizes human potential and social rationality. Judging capitalism by *that* immanent potential – the standard generated *by* the historical process itself, not plucked from the sky – *is* historical materialism in action! Theft *isn't* just a metaphor; it’s the accurate description of the *relation* when viewed from the standpoint of the producing class whose time and creativity are appropriated without their collective consent. His outrage is palpable and *moral*, rooted in the vision of a society where "the free development of each is the condition for the free development of all."

  **Alex (Wood-ist):** The outrage is real, Sam, but its *basis* is the dehumanizing *alienation* – workers estranged from their activity, the product, their species-being, and each other. *That's* the core indictment. The "theft" of time is a consequence of this alienation within the capital relation, not an independent injustice. Marx rejects moralizing precisely because it suggests changing ideas can change the system, rather than transforming the material base. His "vision" is of a society beyond the *need* for such narrow concepts of justice and rights, not one that finally implements them correctly. The charge isn't "unjust"; it's "alienating, contradictory, and historically obsolete."

  **Sam (Husami-ist):** But the alienation *includes* the injustice! They aren't separable. The systematic, coercive appropriation of the worker's surplus labor *by virtue of their propertyless position* – that *is* an injustice, discernible *because* we can envision a society where production is for need, not profit, and labor isn't a commodity. Marx uses the language of robbery *because* it fits, scientifically and morally, when analyzed from the perspective of the future emerging within the present. Historical materialism provides the standard *within* history – the standard of the rising class and the higher mode it heralds. To deny Marx saw capitalism as unjust is to neuter the powerful normative core of his critique.

  **Alex (Wood-ist):** And to insist he did, Sam, risks turning his scientific critique of political economy back into the very utopian moralizing he spent his life combating. The power is in the analysis of the system's logic, not in calling it names. The "robbery" is the mechanism of exploitation, plain and simple. The condemnation is that it robs humanity of its potential, not that it breaks bourgeois law.

  *(Both scholars sip their coffee, the tension of unresolved dialectics hanging in the air.)*
