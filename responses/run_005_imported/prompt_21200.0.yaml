  First, I need to recall the key objections. For Armstrong, the inference problem questions how a second-order relation (N) between universals can necessitate first-order regularities without just being a restatement of those regularities. The worry is that N lacks explanatory power unless it's logically necessary, which Armstrong denies. For Lewis, the circularity problem, highlighted by Maudlin, argues that laws derived from the Humean mosaic can't explain the mosaic itself since they're just summaries. Also, there's the issue of counterfactuals not being grounded.

