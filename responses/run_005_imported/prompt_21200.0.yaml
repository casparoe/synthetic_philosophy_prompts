  I should also consider seminar dynamics. Highlighting that the problems stem from different metaphysical commitments (anti-Humean vs. Humean) could spark discussion. Pointing out that Armstrong's problem is ontological while Lewis's is functional helps differentiate them. Emphasizing the possibility of modest amendments for Lewis but not Armstrong shows the asymmetry the user is looking for.

