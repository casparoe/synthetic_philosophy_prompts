prompt: |-
  I'm doing the historical throat-clearing lecture for my grad seminar on material constitution this week (statue and clay, ship of Theseus, all the standard coincident-object stuff), and I like to remind students the puzzle didnt spring fully formed out of Gibbard's 1975 "Contingent Identity" paper. So I assigned them the "Of Identity and Diversity" chapter from Locke's Essay for background, and now I've gone and gotten myself stuck on section 3, and want a sanity check before I stand up in front of everyone Thursday and say something dumb.

  Here's the passage, quoted in full so nothing's out of context:

  "From what has been said, it is easy to discover what is so much inquired after, the principium individuationis; and that, it is plain, is existence itself; which determines a being of any sort to a particular time and place, incommunicable to two beings of the same kind. This, though it seems easier to conceive in simple substances or modes; yet, when reflected on, is not more difficult in compound ones, if care be taken to what it is applied: v.g. let us suppose an atom, i.e. a continued body under one immutable superficies, existing in a determined time and place; it is evident, that, considered in any instant of its existence, it is in that instant the same with itself. For, being at that instant what it is, and nothing else, it is the same, and so must continue as long as its existence is continued; for so long it will be the same, and no other. In like manner, if two or more atoms be joined together into the same mass, every one of those atoms will be the same, by the foregoing rule: and whilst they exist united together, the mass, consisting of the same atoms, must be the same mass, or the same body, let the parts be ever so differently jumbled. But if one of these atoms be taken away, or one new one added, it is no longer the same mass or the same body. In the state of living creatures, their identity depends not on a mass of the same particles, but on something else. For in them the variation of great parcels of matter alters not the identity: an oak growing from a plant to a great tree, and then lopped, is still the same oak; and a colt grown up to a horse, sometimes fat, sometimes lean, is all the while the same horse: though, in both these cases, there may be a manifest change of the parts; so that truly they are not either of them the same masses of matter, though they be truly one of them the same oak, and the other the same horse. The reason whereof is, that, in these two cases -- a mass of matter and a living body -- identity is not applied to the same thing."

  What I can't settle is what that last sentence actually commits Locke to. My instinct, and what I told the class last time I taught this, is that he's already groping toward something like the modern constitution view -- the mass and the oak are two distinct, coincident things with different persistence conditions (the mass can't survive losing a particle, the oak survives losing tons of them), so strictly there's two objects stacked in the same place, not one. A colleague of mine who actually works on early modern stuff thinks that's just anachronistic, and that Locke's real view is closer to what Geach would later call relative identity: there's no absolute fact about whether the oak and the mass are "really" one thing or two, because "same X" only ever means something relative to a sort, and pushing for a headcount is a confusion Locke's already trying to head off, not a question he's answering. I can find sentences to back up either reading and now I've talked myself into a circle. Could you actually go through the passage closely (feel free to bring in what he says a few sections later about identity being "suited to the idea it is applied to") and tell me which reading the text better supports, or if there's some third option we're both missing -- and then say how each option would actually cash out if you tried to plug it into the current statue-and-clay literature (constitution-without-identity, coincident objects, relative identity, the whole menu)?
reasoning: |-
  Okay, let's tackle this Locke passage step by step. The user is preparing a grad seminar on material constitution and wants to avoid misinterpreting Locke's key point in Essay II.xxvii.3. They're torn between two readings: (1) constitution-without-identity (coincident objects) or (2) relative identity. 

  First, I need to unpack Locke's own words carefully. The passage has three clear moves: 
  - He starts with atoms/masses where identity is strictly mereological (same parts = same mass) 
  - Then contrasts living things where identity ignores part changes (same oak despite growth/lopping) 
  - Finally drops the bombshell: "identity is not applied to the same thing" for masses vs. living bodies. 

  Hmm. That last line is the crux. My colleague's relative identity reading has merit - Locke does emphasize that "same X" depends on the idea/sort we're considering. When he says "truly one of them the same oak, and the other the same horse" while denying they're the same mass, that screams sortal-relativity. But wait - does he actually say there's only one entity here? 

  *flips through mental notes* No, he doesn't. The text never reduces the oak to "just a mass under a description." In fact, he explicitly distinguishes "a mass of matter" from "a living body" as different "things" to which identity applies. That's constitution language! He's not saying "it's the same thing but we call it oak" - he's saying the oak persists where the mass does not. 

  *checks later sections* Ah! Section 4 confirms: identity is "suited to the idea." But crucially, Locke ties persistence conditions to the kind of thing: masses require part-identity, organisms require continuity of life. That's not relativism - it's different persistence conditions for different entities. 

  *imagines modern parallels* If Locke were writing today: 
  - Constitution view: He'd say the plant-mass and the oak are distinct coincidents. 
  - Relative identity: He'd say "same mass? No. Same oak? Yes." without multiple entities. 

  But Locke's phrasing leans constitution: "the mass... must be the same mass... But if one atom... it is no longer the same mass." Then for the oak: variation "alters not the identity." He's contrasting two criteria for two entities, not two ways of describing one entity. 

  Verdict: The user's initial instinct was sharper. Locke is proto-constitution, not proto-Geach. Though honestly? He's not fully either - he's Locke. But for a grad seminar, showing how he plants seeds for both modern views is pedagogically gold. Just emphasize he never resolves the "how many objects?" question we obsess over today.
answer: |-
  Here's a close reading of Locke's passage, followed by an analysis of its implications for modern constitution puzzles:

  ### Close Reading of Locke's Argument
  1.  **Principle of Individuation (Existence):** Locke states that existence itself, bound to a specific time and place, individuates beings. This applies to simple and compound entities.
  2.  **Identity for Atoms/Masses:** 
      *   An atom (understood as an indivisible particle) is identical over time because it exists continuously as itself at each instant.
      *   A *mass* of atoms is identical only if it consists of *the very same atoms*. Add or remove one atom, and it's a different mass ("no longer the same mass or the same body").
      *   Identity here is strict mereological essentialism: same parts = same mass.
  3.  **Identity for Living Creatures:**
      *   Locke explicitly contrasts this with masses. Identity for living things (oak, horse) does *not* depend on sameness of particles ("variation of great parcels of matter alters not the identity").
      *   The oak persists through growth and lopping; the horse persists through growth and changes in condition (fat/lean). They remain "truly" the same oak/horse.
      *   Crucially, he states that in these cases, the living thing is *not* the same *mass of matter* as it was before the change ("they are not either of them the same masses of matter, though they be truly one of them the same oak...").
  4.  **The Key Sentence & Its Context:**
      *   "The reason whereof is, that, in these two cases -- a mass of matter and a living body -- identity is not applied to the same thing."
      *   This is the culmination of the contrast. Locke is explaining *why* the mass ceases to be identical when parts change, but the oak does not.
      *   **"Identity is not applied to the same thing":** Locke is saying that when we ask "Is it the same?", we must specify *what kind of thing* we are asking about. Are we asking about the *mass of matter* or the *living body* (the oak)? These are distinct entities or concepts governed by different identity conditions.
      *   **Support from Later Text (Sec. 4 & 7):** Locke reinforces this: "When therefore we demand whether anything be the same or no, it refers always to something that existed such a time in such a place, which it was certain at that instant was the same with itself, and no other... Thus, when we see an oak in the same place it grew, we say it is the same tree, though perhaps not a particle of matter remains the same... But the *idea* to which we give the specific name *oak* remaining the same..." (Sec. 4, emphasis added). Identity is "suited to the idea it is applied to" (Sec. 7). The persistence conditions depend on the *kind* of thing (the "idea") we are considering.

  ### Interpretation: Constitution vs. Relative Identity
  *   **Your Reading (Constitution/Coincident Objects) is Stronger:**
      *   **Textual Evidence:** Locke explicitly distinguishes the *mass* and the *living body* ("a mass of matter and a living body"). He states the oak *is not* the same mass of matter after part change, but *is* the same oak. This implies two distinct entities present simultaneously but with different persistence conditions. The mass loses identity with part change; the oak does not. He attributes identity *to* these different things ("applied to"). The later text (Sec. 4) confirms identity tracks the persistence conditions defined by the *kind* (idea) – oak vs. mass. This strongly suggests distinct kinds of objects with distinct criteria for persistence.
      *   **Argument Structure:** The "reason" Locke gives for the differing persistence conditions is *precisely* that we are talking about different things ("identity is not applied to the same thing"). He doesn't say we are applying different *concepts* to the *same* underlying thing; he says we are applying identity *to different things*.

  *   **Your Colleague's Reading (Relative Identity) is Weaker:**
      *   **Textual Evidence:** Locke *does* emphasize that identity claims are relative to the sortal ("suited to the idea"). "Same mass?" and "Same oak?" are different questions with different answers. He avoids saying "there are two objects here."
      *   **Counterarguments:** 
          *   Locke's language ("a mass of matter *and* a living body") strongly suggests distinct entities. 
          *   His explanation ("identity is not applied *to the same thing*") points to distinct subjects for the identity predicates, not just distinct predicates applied to one subject. 
          *   He says the oak *is not* the same mass – a statement of non-identity between the oak and the (earlier) mass. This makes more sense if the oak and the mass are distinct entities (the oak *is* the same oak, but it *is not identical to* the mass that constituted it earlier). Relative identity typically avoids such absolute non-identity claims between entities under different sortals.
          *   Locke doesn't frame this as a linguistic or conceptual confusion about counting; he presents it as an explanation of how the world works – living bodies persist differently than masses.

  *   **Verdict:** While Locke lays groundwork Geach could build upon, the **constitution/coincident objects reading is more strongly supported by this specific passage and its immediate context.** Locke is distinguishing two distinct entities present in the same place: the mass (with mereological essentialism) and the living organism (with life-based persistence). He is groping towards the idea that different types of objects, even when co-located, have different criteria for being "the same thing" over time.

  ### Plugging Locke into Modern Constitution Debates
  1.  **Constitution-without-Identity (Coincident Objects):** This is the most direct mapping.
      *   **Locke's Oak/Mass = Statue/Clay:** The oak is analogous to the statue; the mass of matter is analogous to the lump of clay.
      *   **Persistence Conditions:** The oak/statue persists through changes in its constituting matter (growth, lopping / reshaping) as long as its form/life/functional unity persists. The mass/lump persists only as long as its material parts remain the same (or sufficiently the same, depending on the view).
      *   **Non-Identity:** Locke explicitly states the oak *is not* the same mass after part change ("they are not... the same masses of matter"). This mirrors the constitution view: the statue is not identical to the lump, even when coincident. They are distinct objects with different modal properties (persistence conditions).
      *   **Locke's Contribution:** He provides a *reason* for non-identity – different kinds of things have different persistence conditions essential to what they are. The "principle of individuation" (existence at a time/place) gets them started, but *persistence* depends on the *kind*.

  2.  **Relative Identity (Geach):** A less direct, but possible, interpretation.
      *   **Locke's Insight:** "Same" is elliptical. "Is it the same?" only makes sense as "Is it the same *mass*?" or "Is it the same *oak*?". There is no absolute "Is it the same *thing*?" question with a single answer.
      *   **Statue/Clay Application:** There is one entity. Asking "Is it the same statue?" might get a "yes" (if the form persists), while asking "Is it the same lump?" might get a "no" (if parts changed). There is no further fact about whether it's "really" one object or two; the counting question is ill-formed without a sortal.
      *   **Where Locke Fits/Diverges:** Locke emphasizes the sortal-relativity, which Geach championed. However, Locke's language ("mass *and* living body," "not applied to the same thing," "they are not the same masses") leans more towards implying distinct entities governed by different sortals *simultaneously*, rather than Geach's stricter view that avoids counting objects absolutely. Locke seems more ontologically committed to distinct co-located things than Geach.

  3.  **Other Views:**
      *   **Eliminativism/Reductionism (e.g., Parfit-inspired, some stage theories):** Locke doesn't fit well here. He takes the persistence of the oak *very* seriously as a real feature of the world, not something reducible to temporal parts or conventional. The mass and the oak are both real.
      *   **Dominant Kind (Johnston):** This might be a possible modern development *inspired* by Locke. The oak is the dominant kind in that region of space, explaining why we prioritize its identity conditions. Locke hints at this by focusing on the functional unity (life) of the organism. However, he doesn't explicitly reduce the mass to a non-object or subordinate status; he treats it as a real entity with its *own* strict identity conditions.
      *   **Temporal Parts (Perdurance):** Locke talks about existence "in any instant" and continuation "as long as its existence is continued," which has a stage-like feel. However, his focus on *what persists* (the oak vs. the mass) through change strongly suggests endurance – the *whole* oak is present at each time it exists, enduring through part replacement. He doesn't decompose objects into temporal stages.

  ### Conclusion & Recommendation for Your Lecture
  *   **Textual Support:** Locke's passage most strongly supports a **proto-constitution/coincident objects view.** He distinguishes the mass and the living body as distinct entities ("things") present together, governed by different identity conditions (mereological essentialism vs. life/form persistence). His key sentence ("identity is not applied to the same thing") explicitly states that the subject of the identity judgment differs. This is the foundation for non-identity despite co-location.
  *   **Relative Identity Connection:** While Locke lays crucial groundwork for sortal-relativity, his specific arguments and examples here go beyond mere conceptual relativity and point towards distinct ontological categories cohabiting the same space with different persistence conditions. He's answering the "how many?" question ontologically: there are (at least) two distinct things here (mass and organism), not just one thing described differently.
  *   **What to Say:** "Locke, in this famous passage, is grappling with the core problem of material constitution centuries before it became a central analytic puzzle. His insight is radical: the reason an oak survives the change of its parts while a mere mass of atoms does not is that *they are fundamentally different kinds of things* co-located in the same space. The oak *is not* the same entity as the mass constituting it at any given moment, precisely *because* they have different essential properties governing their persistence – mereological essentialism for the mass, life/form for the organism. While he emphasizes that identity claims must be relative to a sortal ('suited to the idea'), his solution points strongly towards what we now call the constitution view or the coincidence view: distinct objects with different modal properties sharing the same location. He provides the core argument for non-identity – difference in persistence conditions – that Gibbard, Baker, and others would later develop formally. So, while Gibbard gave us the definitive modern puzzle and formal tools, Locke planted the seed by recognizing that co-location doesn't imply identity when the objects belong to different kinds with different criteria for survival."

  This reading acknowledges the sortal-relativity Locke highlights while accurately capturing his ontological commitment to distinct coincident entities, making his view a clear precursor to modern constitution theories. It avoids anachronism by focusing on Locke's own arguments and distinctions. Good luck with the seminar!
