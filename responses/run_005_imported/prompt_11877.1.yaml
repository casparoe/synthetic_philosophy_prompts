answer: |-
  You've nailed the critical pivot point in Rawls's argument – the move from the veil of ignorance to the maximin rule is *the* key step that generates his "Difference Principle" rather than utilitarianism. It's also highly controversial. Let's break down Rawls's actual reasoning, step-by-step, based on *A Theory of Justice*, focusing on *why* he thinks rational agents under the veil *must* choose maximin, not expected utility.

  **1. Setting the Stage: The Original Position (OP) & Its Constraints**

  *   **Purpose:** The OP is a thought experiment to model *fairness*. It asks what principles rational, self-interested individuals would choose to govern society *if* they were stripped of all knowledge of their own place in it (veil of ignorance).
  *   **The Veil:** Crucially, the veil is *thick*. Parties don't know:
      *   Their social status, class, wealth, natural talents (intelligence, strength, etc.), race, gender, conception of the good (life goals, values).
      *   The specific economic or political circumstances of their society.
      *   **Crucially:** They have *no basis* for assigning *probabilities* to ending up in any particular social position. Rawls argues this ignorance is so complete that it makes assigning *any* probability distribution (like "equal chance") fundamentally *arbitrary* and unjustifiable. This is the **Epistemic Argument** against expected utility.

  **2. The Problem: Choosing Principles under Radical Uncertainty**

  Faced with this radical uncertainty, how do rational agents choose principles that will determine their fundamental life prospects? They have to evaluate potential social structures (defined by principles like utilitarianism, libertarianism, or Rawls's own) based on the range of positions *anyone* could end up in.

  **3. Why Maximin? Rawls's Three Arguments**

  Rawls argues that under the *specific conditions* of the Original Position, maximin is the *only rational* choice. He doesn't claim it's rational everywhere (e.g., not for a casino bet), but specifically under these unique constraints. He offers three main arguments:

  *   **Argument 1: The No-Knowledge/No-Probability Argument (The Epistemic Argument):**
      *   Expected utility calculations *require* probabilities. In a casino, you know the odds of rolling a 7. Behind the veil, you have *absolutely no information* about the distribution of social positions, the prevalence of disability, the likelihood of being born into poverty, etc.
      *   **Rawls's Claim:** Assigning *equal* probability to every possible position is *not* a neutral default; it's an *arbitrary assumption* smuggled in. There's simply no rational basis *within the OP* for assigning *any* probability distribution. Therefore, rational agents *cannot* perform an expected utility calculation. They lack the necessary input (probabilities). Maximin, however, doesn't require probabilities; it only requires knowing the *possible outcomes* (the range of positions) under each set of principles.
      *   **Critique Target:** This directly attacks the Harsanyi-style approach (which *does* assume equal probability and leads to average utilitarianism). Rawls says Harsanyi illegitimately imports an assumption not warranted by the OP setup.

  *   **Argument 2: The High Stakes Argument (The Gravity of the Worst Case):**
      *   The choice in the OP isn't about winning or losing a sum of money; it's about determining the *fundamental structure of your entire life*. The "worst-case" position under a set of principles could be truly catastrophic – a life of crushing poverty, lack of basic liberties, exploitation, or even premature death due to lack of basic needs.
      *   **Rawls's Claim:** Because the stakes are so high (affecting basic liberties, self-respect, life prospects), rational agents will give *absolute priority* to avoiding the possibility of ending up in the absolutely intolerable position. They cannot afford to gamble on the *chance* of being average or well-off if there's a risk of falling into an abyss. Maximin guarantees that the floor is as high as possible, protecting against the most devastating outcomes. Expected utility, by averaging, could potentially justify principles where the worst-off suffer horribly if it makes the average high enough – a risk no rational person would take when their *basic life prospects* are on the line.
      *   **Rationale:** This isn't *just* generic "risk aversion." It's a specific aversion to *catastrophic risk* in a context where the downside is unbearable and irreversible. Imagine choosing between societies: Society A has a high average but allows slavery; Society B has a lower average but guarantees everyone basic rights and a decent minimum. Rawls argues rational people behind the veil *must* choose B. They can't risk being the slave.

  *   **Argument 3: The Acceptable Minimum Argument (The Character of the Alternatives):**
      *   Rawls argues that the principles chosen under maximin (the Two Principles of Justice) guarantee a sufficiently high minimum. The First Principle guarantees equal basic liberties. The Second Principle (Fair Equality of Opportunity + Difference Principle) ensures that social/economic inequalities only exist if they work to the *greatest benefit* of the least advantaged.
      *   **Rawls's Claim:** Because this "worst-case" position under his principles is still *acceptable* (it guarantees basic liberties, fair opportunities, and the highest possible minimum share of social primary goods given the need for incentives), rational agents don't have a compelling reason to gamble for potentially more. The potential gains offered by other principles (like utilitarianism's higher average) aren't worth the *risk* of falling below this acceptable minimum floor. If the worst-case under maximin were still terrible, agents *might* gamble. But Rawls believes his principles make the worst-case *tolerable*, eliminating the incentive to roll the dice.
      *   **Rationale:** This addresses the "Why not gamble?" instinct. Rawls says, essentially: "Because the guaranteed minimum under maximin is good enough, and the potential losses under other systems are too horrific to risk."

  **4. Why Maximin Leads to the Difference Principle (Not Utilitarianism)**

  *   Utilitarianism (maximizing average or total utility) might require sacrificing the well-being of the worst-off (e.g., through exploitation, severe inequality, or denial of rights) if it boosts the average enough. Expected utility calculation (with equal probability) would potentially endorse this if the numbers worked out.
  *   Maximin explicitly *forbids* this. It forces the choosers to focus *only* on the worst-off position. They must select the system where the worst-off are *best off*. This directly yields the Difference Principle: inequalities are only just if they are arranged to maximally benefit the least advantaged. It prioritizes raising the floor above all else.

  **The Controversy & Critiques (Briefly):**

  1.  **Harsanyi's "Impartial Observer":** Economist John Harsanyi argued that assuming *equal probability* is the only rational approach under *complete ignorance*. Using this, he derived average utilitarianism. He saw Rawls's rejection of probabilities as arbitrary and claimed maximin reflects an irrational degree of risk aversion.
  2.  **Is the Veil *Too* Thick?** Critics argue Rawls's thick veil creates an artificial scenario where rational choice is impossible, forcing his preferred outcome. They suggest a thinner veil allowing *some* probabilistic knowledge might be more realistic for modeling fairness.
  3.  **Is Maximin *Really* Rational Here?** Even granting the high stakes, critics argue that *complete* focus on the worst case ignores potentially massive gains for the vast majority. They contend that rational agents *would* accept a *small* risk of a very bad position for a high probability of a much better life for themselves and others. (Rawls counters with Arguments 1 & 3: you can't assess the risk size, and the floor is acceptable).
  4.  **Feasibility of the "Acceptable Minimum":** Critics question whether a society strictly adhering to the Difference Principle can realistically achieve a minimum high enough to make maximin rational without stifling incentives and economic growth, potentially lowering the average significantly.

  **In Essence:**

  Rawls's argument for maximin hinges on the *unique combination* of conditions in the Original Position:
  1.  **Radical Uncertainty (No Probabilities):** Makes expected utility calculation impossible.
  2.  **Extremely High Stakes (Catastrophic Downside):** Makes avoiding the worst-case an absolute priority.
  3.  **An Acceptable Guaranteed Minimum:** Makes gambling for potentially higher averages irrational.

  He contends that rational agents, facing the possibility of a life destroyed by injustice with *no way to assess the odds*, would prioritize building the highest possible floor to protect themselves. This isn't "hand-wavy risk aversion"; it's a specific argument about rational choice under conditions of profound ignorance about one's fate concerning fundamental goods. The controversy stems from whether those conditions are correctly specified and whether maximin is truly the only rational response to them. Your instinct for averaging reflects the Harsanyi view, which Rawls directly and vigorously argues against based on the epistemic constraints of the veil. Understanding this specific argument about probability (or the lack thereof) is crucial to grasping the depth of Rawls's move.
