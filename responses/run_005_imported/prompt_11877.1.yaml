  First, I need to recall Rawls's key points in A Theory of Justice. The user is right that the difference principle comes from maximin. But why does Rawls think people under the veil would choose maximin? The user is frustrated with superficial explanations, so I should avoid those.

  Rawls's main arguments for maximin are threefold. First, the veil creates such uncertainty that probabilities can't be assigned. Without knowing anything about society, you can't calculate odds of being in any position. So expected utility doesn't work because there's no basis for probabilities. That's a key point—it's not just risk aversion but epistemic limitation.

  Second, the stakes are incredibly high. If you end up in the worst-off group, the consequences are severe—lacking basic rights or needs. The user mentioned not wanting to focus on risk aversion, but the gravity of the worst-case scenario matters. Rawls thinks it's irrational to risk ending up in a position where you can't live a decent life.

  Third, the alternatives might have acceptable outcomes. The difference principle allows inequalities only if they help the least advantaged. So even if you're not worst-off, your position is still decent. The user might not have considered that maximin doesn't mean equality; it permits inequality that benefits everyone.

