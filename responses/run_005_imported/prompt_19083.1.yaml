prompt: |-
  I've been down a rabbit hole on Newton's secret theological writings for a side project, and I've got a historian of science coming on my little podcast next week who's basically spent her whole career in the Newton Project archives -- the antitrinitarian stuff, the prophecy chronology, all the manuscripts he wouldn't let anyone see while he was alive. I really dont want this episode to turn into another "omg Newton was secretly a heretic" listicle, so can you help me draft like 8-10 questions that actually dig into the substance instead of just having her restate the greatest-hits version of his biography?

  Specifically I want at least one question on the fact that he needed a special dispensation from the crown just to keep his Cambridge post without being ordained, since he couldn't in good conscience affirm the Trinity -- I want the question to get at what he thought was actually at stake for him, not just "wasn't that risky." I want one on the "Two Notable Corruptions of Scripture" piece he sent Locke and then got cold feet about publishing even anonymously overseas -- something that pushes past "he was scared of backlash" and into what he thought would actually happen to the church once people saw 1 John 5:7 was a later insertion. And I want one on the 2060 date, since every pop-science article flattens it into "Newton predicted the apocalypse" when the actual argument was almost the opposite of that -- he was setting a floor to shut down people who kept predicting an imminent end, not making his own prediction. For each of those three, throw in a quick note on the answer she'll probably give first and then a sharper follow-up question that doesn't just let her repeat the tidy version. Feel free to round it out with a couple more on Athanasius/Nicaea and this "great apostasy" idea of his if you can make those bite too.
