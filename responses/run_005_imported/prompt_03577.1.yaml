  The user's key point is that fines aren't truly "punishment" in the retributive sense Lewis requires because money lacks personal identity markers. This challenges Lewis's tu quoque by arguing secular substitution is only tolerated where fungibility exists, while Christian substitution involves non-fungible suffering. 

