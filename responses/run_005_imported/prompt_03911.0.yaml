  Okay, the user is in a graduate seminar on philosophy of language, moving from Kaplan to Chalmers and Jackson. They've noticed a similarity between Kaplan's character/content distinction and Chalmers's primary/secondary intensions. They think Chalmers might just be repackaging Kaplan's ideas without adding anything new, especially regarding the "water" example and the argument against materialism. They want to write a term paper on this but want to check if their objection holds up.

  First, I need to recall Kaplan's framework. In "Demonstratives," character is a function from context to content, and content is a function from circumstances to extension. This handles indexicals like "I" or "here," where the meaning depends on the context of utterance. For example, "I" refers to different people in different contexts, but once the context is fixed, the content (say, a person) is evaluated in different possible worlds.

  Now, Chalmers's two-dimensional semantics: primary intension maps a world considered as actual to the reference, while secondary intension maps a world considered as counterfactual to the reference. The user thinks primary intension is like character, and secondary intension is like content. On the surface, that seems plausible. Both involve two layers of meaning.

  But why do Chalmers and Jackson claim their approach is different? The key might be in how they use the framework. Kaplan focuses on indexicals and context-dependence within language. Chalmers applies it to conceptual analysis and metaphysical necessity, especially in philosophy of mind. The primary intension is tied to a priori knowledge and epistemic possibilities. For example, with "water," the primary intension picks out whatever plays the water role in a given scenario, which is knowable a priori. The secondary intension, once we know water is H2O, picks out H2O in all worlds. This epistemic aspect isn't central in Kaplan, who's more concerned with linguistic context.

  The user's point about the materialism argument is crucial. Chalmers uses the gap between primary and secondary intensions to argue that conceivability entails possibility, leading to the idea that zombies (physically identical but no consciousness) are possible, thus challenging materialism. If primary intensions are just characters, does Kaplan's framework already imply this? Probably not, because Kaplan's character is about linguistic rules for context, not epistemic access to metaphysical truths. So Chalmers is extending the framework into epistemic domains, which is a significant shift.

  Also, the user mentions Chalmers's example of "water" and Twin Earth. In Kaplan, "water" isn't an indexical; it's a rigid designator. So applying a two-dimensional analysis to it is an extension beyond Kaplan's original use. Chalmers uses this to handle Kripkean a posteriori necessities, which Kaplan didn't address.

