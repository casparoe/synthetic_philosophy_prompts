  I should also consider if there are responses to this objection. Chalmers himself distinguishes his primary intensions from Kaplan's characters by emphasizing the epistemic dimension. Characters are determined by linguistic conventions, while primary intensions are about conceptual roles. This distinction is crucial for the argument against materialism, as it relies on what's conceivable a priori.

