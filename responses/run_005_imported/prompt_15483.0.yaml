  Here’s a draft of Tomas’s eulogy, weaving Schopenhauer’s bleakness into Sabine’s genuine solace, delivered through the raw, stumbling voice of a grieving son who knows enough to honor her truth without pretending to be her:

  **(Tomas approaches the podium, shuffles papers, clears his throat. His voice is low, unsteady, rough with unshed tears.)**

  "Um. Thanks for coming. For Mum. Sabine. Some of you... you knew her better than I did, lately. Knew her *mind* better, anyway. Especially about... music. And the other thing. The big thing."

  **(He looks down, takes a breath. Looks up, scanning the crowd – lands briefly on a familiar stern face from the conservatory, winces internally.)**

  "She’d... argue. You know she argued. Late nights, wine, her bow tapping the edge of the cello case like a baton. About Schopenhauer. Arthur. The gloomy one. She didn’t just *like* him. She... lived inside his head. Or maybe he lived inside hers."

  **(Pause. He struggles for the words, not the philosophy, but the feeling.)**

  "He saw... everything. All of us. As just... *wanting*. Always wanting. Hungry. Striving. Like... like sharks, but sadder. You get what you want? Boredom sets in. Or you lose it. Or you want something else. On and on. Forever. It’s... bleak. Really bleak. Mum knew that. She didn’t sugarcoat it. Said pretending it was all sunshine was just... lying to yourself. More striving."

  **(He grips the podium. This is the hard part. The part he can't fake.)**

  "But... she found something. Not an escape. Not really. More like... a truce. In the music. Not just listening. *Making* it. With the cello. Schopenhauer... he said music was different. Special. Terribly special. That painting, poetry, sculpture... they show you *ideas* of things. Shadows. And through those shadows, you might glimpse the... the awful engine underneath it all. The Will. The endless wanting."

  **(He looks towards her cello, placed near the front.)**

  "But music... Mum would lean forward when she got here, eyes bright. Wine forgotten. *Music*, she’d say, *doesn’t need the shadows*. Doesn’t need the world of chairs and trees and... and grief. It cuts straight *through*. It *is* the rumble of that engine. The pulse of the wanting. The terror and the weird... beauty... of the striving itself. The Will, singing. Or screaming. Or sighing."

  **(A murmur from the quartet. A knowing nod. Tomas sees it, pushes on.)**

  "That’s what she played. That’s what she *was*, in those moments. Not Sabine worrying about bills, or me, or the damp in the practice room... but the Will. Directly. Raw. She wasn’t copying life. She was... plugged into the current beneath it. The terrible, honest current."

  **(His voice thickens. This is the core, the painful honesty.)**

  "It wasn’t *happy*. Schopenhauer doesn’t do happy endings. But it was... peace? No. Respite? Closer. It was *truth*. A terrifying, magnificent truth she could touch with horsehair and wood and gut strings. And in touching that truth... directly... the ordinary wanting stopped. Just for a while. The shark stopped swimming. And *she* stopped. Became... pure hearing. Pure making. Not striving Sabine. Just... music happening."

  **(He looks at the cousins now, the neighbours. Simpler words.)**

  "So... she wasn’t afraid of the dark stuff. She went right into it. With her cello. She found a way to be... quiet inside the storm. Not by ignoring the storm. By becoming part of its voice."

  **(He looks back at the cello, then down at his hands.)**

  "That’s... that’s what I think she’d want you to know. Why it mattered so much. It wasn't pretty thoughts. It was... contact. Real contact with whatever... *this*... is." *(He gestures vaguely, encompassing the room, life, death.)* "She faced the engine, and for moments at a time... she played its song back to it. And it was enough. It had to be. For her, it *was*."

  **(Long pause. He wipes his eyes roughly. The final stumble.)**

  "Thanks. For loving her. For... listening to her argue. She loved the argument almost as much as the music. Almost. I’m... I’m going to miss the noise."

  **(He steps back, head down, done.)**

  ---

  **Why this works for your scene:**

  1.  **Honors the Bleakness:** Tomas explicitly names Schopenhauer's core premise – life as endless, futile striving. He doesn't soften it into "challenges make us stronger" pap. He calls it "bleak," "sadder than sharks," "the awful engine," "the terrible current." Sabine wouldn't tolerate evasion.
  2.  **Music's Unique Role is Central:** The eulogy hinges *entirely* on Schopenhauer's distinction. Tomas explains (simply) how other arts are indirect ("shadows," "ideas") while music is direct contact ("cuts straight through," "is the rumble," "plugged into the current"). This *is* Sabine's intellectual passion.
  3.  **Sabine's Solace is Plausible & Grimly Beautiful:** Her peace isn't found in denial but in confronting the raw truth ("terrifying, magnificent truth"). The relief comes from the *suspension* of individual will ("the shark stopped swimming," "the ordinary wanting stopped," "became... pure hearing"). It's framed as a "truce" or "respite," not salvation. "It was enough. It had to be." is a profoundly Schopenhauerian acceptance.
  4.  **Tomas's Voice:** Fragmented sentences ("Wine forgotten."), rough metaphors ("sharks," "engine," "current"), visible struggle ("clears his throat," "voice thickens," "wipes his eyes roughly," "head down"), admissions of his distance from her world ("Knew her *mind* better," "I’m not... equipped"). He sounds wrecked, not professorial.
  5.  **Satisfies Both Audiences:**
      *   **The Philosophers/Musicians:** They hear the accurate core concepts (Will, striving, music's directness, aesthetic contemplation suspending individuality). They hear *her* arguments echoed ("Doesn’t need the world... cuts straight through"). The quartet's murmur/nod confirms Tomas hit the mark authentically. They wouldn't wince; they'd be moved by the raw understanding.
      *   **The Others:** They hear a son talking about his mother finding a deep, if difficult, truth and solace in her music. They hear "dark stuff," "storm," "engine" – bleakness acknowledged. They hear his grief ("miss the noise"). They get the emotional core without needing the jargon.
  6.  **Structural Work:** The philosophy isn't a quote; it *shapes* what Tomas can say. He *can't* talk about an afterlife, or lasting peace, or meaning in ordinary joys – Schopenhauer denies those comforts. He *can* talk about her finding profound, temporary transcendence *through* confronting the harsh reality via her art. It defines his understanding of her life and her death.
  7.  **Avoids Greeting Card Mush:** No false uplift. The closest to "comfort" is the acknowledgment that her chosen path gave her moments of profound, honest stillness within the universal storm. The ending is about missing *her* – the arguing, the music, the noise of her existence – not about her being in a better place.

  This draft gives Tomas the words to honor Sabine's fierce intellectual and artistic truth while sounding like a man drowning in grief, not delivering a lecture. It forces him to articulate the bleakness she embraced to find her specific kind of light, making the eulogy a powerful, character-defining moment that serves your novel's themes.
