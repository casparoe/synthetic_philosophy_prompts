  This is a nerdy one but I need a tiebreaker. My team has a monthly "paper club" where we take turns picking an old CS paper and argue about it over lunch, and this month someone picked Turing's 1950 paper, "Computing Machinery and Intelligence" -- the one that invents the imitation game. Most people only ever quote the opening pages, but he actually runs through a numbered list of objections to his own idea, and objection 9 is literally titled "The Argument from Extra-Sensory Perception" (he even breaks ESP into telepathy, clairvoyance, precognition, and psycho-kinesis, like that's a normal thing to define in a computer science paper). He flat out says the statistical evidence for telepathy is "overwhelming," works through an example where a telepathic guy correctly names the suit of a card 130 out of 400 tries against a machine that's just guessing randomly and lands on 104 (chance alone is 100), and floats sticking both contestants in a "telepathy-proof room" so a psychic interrogator or witness cant cheat. This derailed lunch into a side argument between two guys on my team, Devesh and Marco, that never got resolved, so I'm bringing it here instead of picking a side myself.

