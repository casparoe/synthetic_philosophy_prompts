  Me and my friend Priya got into a whole thing last night after our modal metaphysics seminar, one of those arguments that drags on way too long because neither of us will just admit we might be wrong. It started over the Humphrey objection -- that bit in Kripke's Naming and Necessity (footnote 13, I think? we were arguing off memory and couldn't check) where he basically says: if Humphrey lost the election, it's no comfort to him that some "counterpart" of his wins in another possible world, because that's not what anyone means when they say Humphrey himself could have won. Priya thinks that basically sinks Lewis's counterpart theory on the spot -- we obviously care about ourselves specifically, not some qualitatively similar guy in a different world, so any semantics that can't honor that intuition has gotten de re modality wrong. I kept arguing that's question-begging, since Lewis's whole point is that "Humphrey could have won" is just made true by a counterpart winning, full stop, and the demand for something more -- a "real," self-same transworld Humphrey -- only feels compelling if you've already smuggled in the kind of primitive transworld identity that's supposed to be the thing in dispute. She said I was refusing to take the intuition seriously and brought up haecceitism like it settled things. We never got anywhere, and honestly neither of us argued our own side as carefully as we could've, so now I want an actual answer instead of two people half-remembering seminar readings at a bar.

  Could you write me an essay that works through this properly: counterpart theory versus genuine transworld identity as rival accounts of de re modality? I want it to seriously engage with the Humphrey objection and Lewis's reply to it (and whether that reply actually holds up or is just a dodge), whether the whole dispute is "merely semantic" -- a fight over how to paraphrase modal sentences -- or a real metaphysical disagreement about what grounds facts about what could've happened to a specific individual, and what you're on the hook for (haecceitism, primitive thisness, whatever) if you go the transworld-identity route instead. Feel free to bring in other proposals if their relevant -- heir-lines, essentialist/sortal-based identity criteria, whatever's out there that we weren't remembering. And please don't land on "well, it depends" and call it a day -- that's exactly where Priya and I ended up and it wasnt satisfying then either. Actually defend a verdict, even a qualified one like "counterpart theory is basically right for ordinary de re talk, but you need something more for cases involving X."
