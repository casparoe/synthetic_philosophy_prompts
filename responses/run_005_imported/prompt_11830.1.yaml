  ## The Humphrey Objection, Counterpart Theory, and the Stakes of De Re Modality: A Verdict

  Your argument with Priya cuts to the heart of one of the most persistent debates in contemporary metaphysics: how do we understand statements about what *could have* or *must have* been true of a specific individual like Humphrey? Is David Lewis's Counterpart Theory (CT) a brilliant deflationary solution, or does Saul Kripke's Humphrey Objection expose a fatal flaw, forcing us back into the arms of transworld identity and its metaphysical baggage? Let's dissect this properly, moving beyond the bar-stool recitations.

  **The Contenders: Framing the Rivalry**

  1.  **Transworld Identity (TI):** The "common-sense" view (championed by Kripke, Plantinga, et al.). Possible worlds are ways the *actual* world could have been. Humphrey himself, the very same individual with his primitive identity (his *haecceity* or "thisness"), exists in multiple possible worlds. In some worlds, he wins the election; in others, he loses. "Humphrey could have won" is true because there *is* a world where Humphrey-himself wins.
  2.  **Counterpart Theory (CT):** Lewis's radical alternative. Possible worlds are concrete, spatiotemporally isolated universes, as real as our own. Individuals are "world-bound"; Humphrey exists only in the actual world. Modal statements about Humphrey are made true by *counterparts* of Humphrey in other worlds. A counterpart is an individual in another world who resembles Humphrey closely enough (in relevant respects, contextually determined) to "stand in" for him. "Humphrey could have won" is true iff there exists a world containing a counterpart of Humphrey who wins that world's election.

  **The Humphrey Objection: Kripke's Salvo**

  Kripke's objection (N&N, p. 45, footnote 13) is devastatingly intuitive:

  > "If someone says, 'Humphrey might have won the election (if only he had done such-and-such),' we are not attributing to him the possible world counterpart of having won some election or other. We are talking about Humphrey himself. When we say that Humphrey might have won, we mean that *he* might have won; that there might have been a state of affairs which would have made *it true that he won*; not that there might have been someone else, closely resembling him, who won an election in a situation closely resembling the actual one."

  **Priya's Point:** Kripke identifies a fundamental feature of our *de re* modal concerns: **self-concern**. Humphrey isn't consoled by the success of a *different* individual, no matter how similar. Our modal discourse (e.g., "I could have been a doctor," "This vase might have broken") is intrinsically about *this very thing* having different properties or undergoing different events. If CT cannot capture this *de se* aspect of *de re* modality – the fact that we care about *ourselves* across possibilities – then it fails to account for the phenomena it purports to explain. It offers the wrong kind of truthmaker.

  **Lewis's Defense: Question-Begging or Deflationary Insight?**

  Lewis's reply ("Counterpart Theory and Quantified Modal Logic," Postscript B) is characteristically bold:

  1.  **Intuition Presupposes TI:** He argues that the intuitive force of the Humphrey objection *already assumes* the truth of transworld identity. It's only compelling if you *already* believe that the same Humphrey exists in other worlds. If you accept CT, the demand for "Humphrey himself" winning elsewhere is as nonsensical as demanding a prime number that is also even. Humphrey is world-bound; there *is* no "himself" elsewhere.
  2.  **CT *Is* the Account of Self-Concern:** For Lewis, CT *does* capture what it means for *Humphrey* to have a possibility. When we say "Humphrey could have won," we express a concern *about Humphrey* that is satisfied by the existence of a winning counterpart. Humphrey *is* represented as winning in another world by his counterpart. That's what "could have won" *means* under CT. Demanding something "more" is demanding a metaphysical fantasy – primitive transworld identity.
  3.  **Semantic Grounding:** Lewis argues CT provides a clear, non-circular, reductive semantics for modal discourse grounded in similarity and existence across concrete worlds. TI, he contends, ultimately relies on obscure primitives like haecceities.

  **Does Lewis's Reply Hold Water? Assessing the Defense**

  Lewis is right that the objection *feels* compelling only if TI is presupposed. **However, this doesn't render the objection question-begging; it reveals the depth of the disagreement.** The Humphrey objection highlights a **pre-theoretical intuition** about the *subject* of modal predication that CT seems to violate. Lewis's defense essentially says, "Your intuition is wrong because my theory says so." This is less a refutation and more a refusal to engage with the core *phenomenon* the intuition points to: the **irreducible first-personal indexicality** inherent in *de re* modality.

  *   **The Problem of Essential Properties:** CT struggles with essential properties in a way that highlights the issue. Suppose Humphrey couldn't have originated from different parents (a Kripkean essential property). Under CT, this means no counterpart of Humphrey has different parents. But *why* can't there be a very similar individual in another world, differing *only* in parentage? CT must either (a) arbitrarily decree that parentage is always a relevant similarity respect for counterparts (ad hoc), or (b) deny essentialism about origins. Both options seem problematic. TI, by contrast, can simply say: *Humphrey himself* lacks the property "originating from different parents" in *every* world where he exists. The constraint flows from the identity of the individual itself.
  *   **The "Merely Semantic" Dodge:** Is this just a fight about paraphrasing modal sentences? **Emphatically no.** While CT and TI offer different semantic analyses, the disagreement is profoundly metaphysical:
      *   **What Grounds Modal Truths?** For TI, the ground is the existence of the *same individual* possessing different properties in different maximal ways the world could be. This requires a robust notion of individual essence or primitive identity (haecceity).
      *   **What Grounds Modal Truths? (CT):** For Lewis, the ground is the existence of *distinct but suitably similar individuals* in other concrete universes. This requires modal realism and primitive relations of similarity.
  *   **The Cost of Transworld Identity:** Priya is correct that embracing TI commits you to metaphysical baggage CT avoids:
      *   **Haecceitism:** You must accept that individuals have primitive, non-qualitative identities ("thisnesses") that persist across worlds. This identity isn't reducible to their properties.
      *   **Primitive Transworld Identity:** The numerical identity of an individual across worlds is a fundamental, irreducible fact.
      *   **Essentialism (Often):** While not strictly *required*, TI naturally accommodates and often relies on essential properties to explain constraints on how an individual can vary across worlds.

  **Alternative Proposals and Where They Stand**

  *   **Sortal-Based Identity (Wiggins, Lowe):** Identity across worlds is constrained by the essential properties tied to the kind of thing an individual is (its *sortal*). Humphrey, as a human being, must originate from specific biological material in every world. This offers constraints TI needs without *pure* haecceitism, but still requires primitive identity *under a sortal* and robust essentialism.
  *   **Heir-Lines/Continuers (Chisholm, Forbes):** Identity across worlds is analyzed in terms of "heir-lines" – chains of counterparts linked by specific relations (e.g., psychological continuity, material continuity). This attempts a middle ground, but often collapses into either a disguised TI (if the "heir" *is* the same individual) or a variant of CT (if the heir is merely a stand-in).
  *   **Modal Fictionalism (Rosen):** Possible worlds are useful fictions. "Humphrey could have won" is true iff, according to the fiction of possible worlds, there's a world where Humphrey wins. This avoids Lewis's ontological commitment but struggles with the *de se* aspect just as much as CT does – the fiction still represents *Humphrey* winning, not a counterpart.

  **The Verdict: Humphrey's Lament Stands, Transworld Identity Prevails (with Baggage)**

  While Lewis's counterpart theory is a brilliant, systematic, and ontologically parsimonious *alternative*, the Humphrey objection exposes a fundamental inadequacy. **Counterpart Theory fails to fully capture the *de se* character of *de re* modality – the fact that we care about *this very individual* when we ask what could have happened to it.** Lewis's reply amounts to dismissing this core intuition as an illusion generated by a false metaphysics. This dismissal is uncompelling. The intuition persists pre-theoretically and reflects the inescapable first-person perspective inherent in modal thought about ourselves and objects we care about *as particulars*.

  Therefore, **Priya is substantially correct: the Humphrey objection seriously undermines counterpart theory as a complete account of *de re* modality.** It forces us towards **transworld identity**.

  However, embracing transworld identity comes with significant metaphysical commitments:

  1.  **You are committed to Haecceitism:** Individuals must possess a primitive "thisness" (haecceity) that grounds their identity across possible worlds. This identity is not reducible to their qualitative properties.
  2.  **You are committed to Primitive Transworld Identity:** The fact that Humphrey-in-world-W1 is numerically identical to Humphrey-in-world-W2 is a fundamental, irreducible fact.
  3.  **You likely need Robust Essentialism:** To make sense of how Humphrey can vary across worlds without becoming a different individual, you need constraints – essential properties that Humphrey must have in every world where he exists (e.g., origins, kind membership). While TI doesn't *logically* require essentialism, it becomes metaphysically unstable without it.

  **Qualified Verdict:** **Transworld identity, despite its metaphysical costs, provides the more phenomenologically adequate and explanatorily powerful account of *de re* modality, particularly for capturing the self-concern highlighted by the Humphrey objection. Counterpart theory succeeds admirably as a reductive semantics within Lewis's system and for certain contexts where qualitative similarity suffices (e.g., "a person like Humphrey could win"), but it fails to fully ground the meaning of statements where the specific numerical identity of the individual is irreducibly central to the modal claim.**

  Your argument with Priya wasn't just semantic quibbling; it was grappling with the nature of possibility itself and what it means for *this* thing to have been otherwise. Humphrey's lament – his desire for *himself* to have won – points towards a reality that counterpart theory, for all its virtues, cannot ultimately accommodate without betraying the very subject of his concern. The cost of honoring that intuition is a more robust, haecceity-based metaphysics of individuals across possible worlds. That, it seems, is the price of taking Humphrey – and ourselves – seriously across the realms of possibility.
