  So this has been bugging me since my game theory class this week. My friend Sam and I had totally opposite gut calls on who's gonna win our fantasy football matchup, so we each walked the other through our full reasoning - stats, injuries, everything - and neither of us budged, we just shrugged and said 'guess we see it differently.' My TA overheard us arguing about it and said that if we both genuinely think the other person is reasonable, we shouldn't be able to just leave it there once we know what the other actually thinks - like, the fact that Sam still disagreed with me after hearing my whole case should already move my number a bit, seperate from whatever his specific reasons were. That sounds backwards to me, two smart people can look at the same info and land somewhere different, thats just normal right? Is my TA actually onto something, or is 'agree to disagree' a perfectly fine place for us to land?
