  Here's a toast that threads the needle – weaving the science into the structure of the tribute itself, using humor and relatable metaphors, while honoring Meg's legacy without turning it into a lecture. The key is letting the *logic* of Hamilton's rule guide the *sentiment* of the toast, making the science functional, not just decorative.

  **The Toast: For Meg**

  (Raise your glass, gather attention)

  "Friends, colleagues, Meg’s wonderful family, neighbours... and, let’s be honest, a significant contingent of people who probably think ‘eusociality’ is a fancy word for being good at parties! Welcome, everyone. It’s an honour to be here celebrating Meg, a truly remarkable scientist, mentor, friend, and… well, let’s just say she never met a group selection argument she couldn’t dismantle with terrifying efficiency."

  (Pause for knowing chuckles from the biologists, warm smiles from others)

  "Now, preparing a toast for Meg presented a unique challenge. Because Meg spent her career rigorously applying a very specific set of principles to understand cooperation and conflict in nature – principles like cost, benefit, and… relatedness." (Nod to biologists). "Think Hamilton’s Rule: `rb > c`. Benefit times Relatedness outweighing Cost."

  "Looking around this room, I see a fascinating mix. Half of you are her professional kin – colleagues, students, co-authors. High `r`, biologically speaking! You know the cost of fieldwork, the benefit of a well-placed sting operation against a flawed hypothesis, and the sheer *relatedness* of shared lab coffee and grant-writing despair. You’ll catch my drift."

  (Laughter, especially from the biologists)

  "The other half? Her wonderful family, her neighbours, friends… the people who’ve kept her sane *outside* the colony. Lower professional `r`, maybe, but immense personal value! You’ve provided the crucial support system – the benefit that made the cost of her intense focus worthwhile. You are the essential… let's call it… 'environmental enrichment'."

  (Laughter from all)

  "So, applying Meg’s own intellectual toolkit reflexively to *this toast*: What level of effort `c` should *I*, the toast-giver, invest? Well, my relatedness `r` to Meg? We go back to grad school. Shared advisors, shared wasp stings, shared youthful arrogance… that’s a pretty high `r`! Definitely higher than, say, a random neighbour." (Wink at neighbours). "And the benefit `b`? Celebrating forty years of groundbreaking work, fierce intellect, and shaping generations of scientists? That `b` is enormous!"

  "The calculation is clear: `r` is high, `b` is huge… therefore, the cost `c` I *should* be willing to bear? Significant! This toast needs effort. It needs substance. It needs to honour the complexity of Meg’s contributions… *without* putting half the room to sleep."

  (General laughter)

  "See, Meg understood that cooperation – whether in a wasp nest or a department hallway – isn't magic. It’s not about fuzzy group feelings overriding self-interest. It’s about structure, about incentives, about clear-eyed calculation of costs and benefits within a framework of kinship, real or metaphorical. She defended that nuanced, powerful view with rigour and passion. She policed sloppy thinking about 'the group' like a top-tier worker wasp policing rogue egg-layers!"

  (Biologists nod and smile, others get the gist through the metaphor)

  "And that’s why her legacy is so profound. It wasn't just about winning arguments in *Nature*. It was about building a framework that *works*. A framework that explains why a worker wasp forgoes reproduction, why an aunt invests in her nephews, why a mentor pours energy into a promising student… and maybe even why an old labmate puts genuine effort into a retirement toast!"

  "Meg didn’t just study cooperation; she fostered it. Her lab wasn’t just a workplace; it was an intellectual colony, built on mutual respect, high standards, and a shared passion for understanding the deep logic of life. She nurtured that relatedness, minimized the costs of collaboration, and maximized the benefits for everyone involved. She built a dynasty of ideas and scientists. That’s the real `rb > c` in action."

  "So, Meg, as we raise our glasses: Thank you. Thank you for your brilliance, your tenacity, your unwavering commitment to getting it *right*. Thank you for the stings that kept us sharp and the honey of discovery you helped us all find. Thank you for showing us that understanding the rules – the costs, the benefits, the intricate dance of relatedness – doesn’t diminish the wonder of cooperation; it makes it all the more remarkable."

  "To Meg! A queen in her field, who always knew exactly where the selection pressure was *really* acting… and who built something truly magnificent because of it."

  (All): "To Meg!"

  **Why this works:**

  1.  **Hamilton's Rule as Structure:** The toast explicitly uses `rb > c` as its organizing principle. It explains *why* the speaker is putting in the effort (`c`), based on his relatedness (`r`) and the benefit of honoring Meg (`b`). The science drives the narrative.
  2.  **Metaphors for Accessibility:** "Professional kin," "environmental enrichment," "policing rogue egg-layers," "intellectual colony," "dynasty of ideas" – these translate complex concepts into relatable terms without dumbing them down. The "nephews at a birthday party" is a classic kin selection example everyone gets.
  3.  **Humor Bridges the Gap:** Jokes about "eusociality," "r=0 neighbours," "putting half the room to sleep," and the reflexive application of the rule to the toast itself create shared laughter points for both audiences.
  4.  **Honors the Science & the Scientist:** Biologists hear the precise references (Hamilton's Rule, policing, colony structure, unit of selection implied in "where the selection pressure was really acting"). They see her core intellectual battle acknowledged meaningfully. Non-biologists hear a tribute focused on Meg's impact, collaboration, mentorship, and legacy, framed through an interesting (and funny) lens.
  5.  **Focus on Meg's Legacy:** It explicitly connects her defense of the theory to her *actions* – building a collaborative lab, mentoring students ("fostering cooperation"). It frames her rigor as a strength that built something valuable.
  6.  **Avoids Relitigation:** It acknowledges the debate ("dismantle group selection," "winning arguments in Nature") without reopening wounds or taking sides. It focuses on the *value* and *application* of the framework she defended.
  7.  **The Reflexive Hook Lands:** Using Hamilton's rule to justify the toast's effort is the clever core the user wanted. It demonstrates the concept *in action* for the toast itself, making it functional and memorable.

  This toast celebrates Meg *through* the lens of her life's work, making the science an integral part of the tribute rather than just the subject of it. It should get both laughs and nods of appreciation from across the room. Cheers to Meg!
