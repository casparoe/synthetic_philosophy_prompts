  Also, superposition is important. Neurons can be polysemantic, so activating one feature might affect others. The SAE might carve the space in a way that's useful for us, but is it how the model organizes information? Non-uniqueness means different methods could yield different features for the same concept, so there's no single "correct" representation. 

