  Hobbes's mechanistic view of reasoning might seem compatible with superrationality at first glance. He describes reasoning as "reckoning" of consequences, a computational process. If all agents are perfectly rational, they should compute the same outcome. However, Hobbes's skepticism about human psychology and the state of nature introduces doubts. 

