  Moreover, Hobbes's laws of nature, like performing covenants, require security. In the absence of a power to hold people in awe, there's no guarantee others will comply. Superrationality assumes agents trust each other's reasoning completely, but Hobbes's agents would suspect others might not be truly rational or might act out of passion. The first law of nature is self-preservation, which could justify defection if there's any doubt.

