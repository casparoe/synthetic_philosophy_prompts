prompt: |-
  My podcast's guest next week is an experimental philosopher -- one of those Weinberg/Nichols/Stich-school people -- whose whole research program rests on the finding that epistemic intuitions about Gettier cases vary by culture and class, which she takes to be a real problem for treating 'intuition' as evidence in philosophy. Her go-to move whenever someone brings up a failed replication is some version of 'a null result isnt evidence of no effect, it just means the vignette needed work,' and given the whole WEIRD-samples reckoning psych already went through, i don't want to let her lean on that every time. Can you draft me 8 to 10 interview questions that build on each other: start with the original cross-cultural result, then the expertise-defense literature (and the messier data her own school later found on professional philosophers), then the Kim & Yuan-style replication failures, and end on the meta question of what's left to count as evidence in philosophy if intuitions are this unstable. For each one, flag the dodge she'll probably reach for and give a follow-up sharp enough she can't just rest on it.
reasoning: |-
  Okay, let me tackle this podcast host's request. They're interviewing an experimental philosopher who bases her work on cultural variations in epistemic intuitions, particularly around Gettier cases. The host wants a structured line of questioning that starts with the foundational cross-cultural findings, moves through challenges like expertise defenses and replication failures, and ends with meta-epistemological implications. Crucially, they need to anticipate and counter the guest's likely dodges - especially her "null results mean bad vignettes" reflex.

  First, I need to map the intellectual trajectory: Weinberg/Nichols/Stich's initial bombshell about cultural differences in intuition should be Question 1. But I know the guest will pivot to methodology, so I'll prepare a follow-up about whether any vignette could satisfy her if it doesn't show variation. That forces her to confront falsifiability.

  For the expertise defense (Question 2), she'll probably dismiss non-philosopher differences by saying philosophers have trained intuition. My counter needs to highlight her own school's data showing philosophers disagree among themselves - that undercuts the training argument. 

  The replication crisis phase (Question 3) is where she'll most aggressively play the "bad vignette" card. I'll trap her by asking what specific vignette flaws would convince her - if she can't name any, it exposes motivated reasoning. 

  Finally, the meta-question (Question 4) about philosophical evidence must press her to offer concrete alternatives. If she retreats to "we just need better methods," I'll demand specifics: what exactly replaces intuitions, and how does that not collapse into sociology?

  Throughout, I'm noting where to deploy citations like Kim & Yuan's failed replications or Schwitzgebel's data on professional philosophers. The host wants surgical precision - no letting her hide behind psychology's WEIRD reckoning as blanket justification. Each follow-up must feel like closing off an escape route while staying collegial.
answer: |-
  Here’s a structured interview script with 8 progressive questions designed to build pressure while staying rigorous. Each question includes the predicted dodge, a sharp follow-up, and key citations for reference:

  ### **Stage 1: The Original Claim & Its Foundations**  
  1. **Q1:** Your seminal work argues that epistemic intuitions about Gettier cases diverge significantly across cultures (e.g., East Asian vs. Western groups) and socioeconomic backgrounds. *If these intuitions are the bedrock of traditional analytic epistemology, doesn’t this variability fatally undermine projects like conceptual analysis?*  
     *Dodge:* "Philosophy already over-relied on intuitions; we’re just correcting that."  
     **Follow-Up:** "But your 2001 paper framed this as a *crisis* for standard methodology. If variability alone isn’t damning, what *degree* of cross-cultural disagreement *would* invalidate intuition-based philosophy?"  

  2. **Q2: Critics like Sosa argue that only *trained* philosophers’ intuitions matter. How do you reconcile your cultural findings with the "expertise defense"?**  
     *Dodge:* "Philosophy isn’t a science—training doesn’t standardize intuitions."  
     **Follow-Up:** "But your own later work (e.g., Machery 2017) found professional philosophers *also* show cultural/socioeconomic splits on cases like reference (Kripke vs. descriptivism). Doesn’t this undercut the expertise buffer?"  

  ---

  ### **Stage 2: Replication Crises & Methodological Pushback**  
  3. **Q3: Kim & Yuan (2015) failed to replicate classic East-West Gettier intuition gaps using improved translations and controls. Doesn’t this suggest the original effects were artifacts of methodological noise?**  
     *Dodge:* "Null results ≠ no effect; vignettes may still lack ecological validity."  
     **Follow-Up:** "What specific flaw in Kim & Yuan’s design—which pre-registered protocols and used native speaker-checked vignettes—would *convince you* a gap doesn’t exist? Or is the effect unfalsifiable?"  

  4. **Q4: Multiple meta-analyses (e.g., Turri 2013) now show Gettier intuition variance is often *smaller* than claimed, and swamped by individual differences. How does this square with treating culture as the primary explanatory variable?**  
     *Dodge:* "Small effects still challenge universalism; philosophy ignores minorities."  
     **Follow-Up:** "If the signal is this weak, shouldn’t we prioritize individual cognitive variables (e.g., need for closure) over broad cultural labels, as Machery himself now suggests?"  

  ---

  ### **Stage 3: The Professional Philosopher’s Dilemma**  
  5. **Q5: When Schwitzgebel & Cushman (2015) tested ethicists’ intuitions on moral dilemmas, they found *no correlation* between professional expertise and consistent judgment. Doesn’t this mirror the instability you found in epistemology?"  
     *Dodge:* "This reinforces our point: even experts aren’t intuition oracles."  
     **Follow-Up:** "But if *trained philosophers* can’t stabilize intuitions, what’s left for *any* intuition-based program? Do we discard intuitions wholesale?"  

  6. **Q6: Your school often dismisses failed replications as "vignette failures." But when Stich & Tobia (2016) tweaked Knobe Effect scenarios, results flipped unpredictably. Isn’t this evidence intuitions are *too* context-sensitive to bear evidential weight?**  
     *Dodge:* "It shows we need better experimental philosophy, not less."  
     **Follow-Up:** "At what point does "better X-Phi" become moving goalposts? If 20 years of vignette-refinement hasn’t produced robust cultural effects, is the burden now on *you* to show they exist?"  

  ---

  ### **Stage 4: Meta-Philosophical Reckoning**  
  7. **Q7: If intuitions are unstable across cultures, expertise, and contexts, what *can* serve as evidence in philosophy?**  
     *Dodge:* "We pivot to naturalized methods: cognitive science, formal modeling, etc."  
     **Follow-Up:** "But doesn’t this risk reducing philosophy to descriptive psychology? If intuitions don’t ground norms, what justifies *prescriptive* claims (e.g., 'knowledge isn’t justified true belief')?"  

  8. **Q8: Ultimately, if your critique succeeds, doesn’t experimental philosophy self-destruct? If intuitions aren’t evidence, what licenses *your* use of survey data (itself intuition-driven) to debunk traditional philosophy?**  
     *Dodge:* "We’re offering better data about cognition, not relying on intuitions."  
     **Follow-Up:** "But your 'data' is *measured intuitions*. If intuitional instability voids philosophical arguments, doesn’t it void *your* empirical conclusions too?"  

  ---

  ### **Key Traps Set**  
  - **Falsifiability:** Forces her to define what would falsify cultural variance (Q3 follow-up).  
  - **Expertise Inconsistency:** Uses her school’s *own data* against expertise (Q2, Q5).  
  - **Self-Defeat:** Highlights circularity in using intuitions to debunk intuitions (Q8).  
  - **Burden-Shifting:** Demands she defend why cultural effects persist after failed replications (Q6 follow-up).  

  ### **Citations to Preempt Dodges**  
  - Kim & Yuan (2015): Replicated Gettier cases *without* cultural gaps.  
  - Machery (2017): Philosophers’ reference intuitions vary by language/culture.  
  - Schwitzgebel & Cushman (2015): Ethicists’ intuitive inconsistency.  
  - Turri (2013): Meta-analysis minimizing Gettier effect sizes.  

  This sequence corners her into either conceding limits to her critique or admitting ad hoc defenses. Stay laser-focused on *epistemic instability* as the through-line.
