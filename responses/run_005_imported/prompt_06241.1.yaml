  ## Memorandum: Frege Prize Review & Path Forward

  **To:** Faculty Senate, [University Name]  
  **From:** Committee on Named Prizes & Lectureships  
  **Date:** October 26, 2023  
  **Subject:** Recommendation Regarding the Frege Prize for Undergraduate Excellence in Logic & Philosophy of Language  

  ### I. Introduction
  This memorandum presents the Committee's recommendation concerning the Frege Prize, following a petition and extensive deliberation regarding the antisemitic, anti-democratic views expressed in Gottlob Frege's 1924 diary. The Committee acknowledges the gravity of the concerns raised, the profound significance of Frege's contributions to logic and philosophy of language, and the complex tension between scholarly merit and institutional values.

  ### II. Context & Committee Deliberation
  The Frege Prize, endowed in the 1970s, recognizes outstanding undergraduate scholarship in foundational areas of philosophical inquiry. The recent petition highlights Frege's repugnant personal writings, unknown during his lifetime and to early proponents of his work. The Committee engaged in rigorous debate, centered on two primary perspectives, both grounded in principle:

  *   **Perspective A (Retain the Name):** Frege's foundational work in logic (e.g., *Begriffsschrift*, sense/reference distinction) constitutes an objective, enduring intellectual achievement. The prize recognizes *this specific scholarly contribution*, not Frege the man or his later, unrelated personal beliefs. To rename it would conflate the work with the individual in a way that misunderstands the nature of philosophical progress, echoing Michael Dummett's distinction: admiration for the work can and should be separated from feelings toward the man. Renaming risks an ahistorical judgment and diminishes the prize's established identity linked to seminal intellectual milestones.
  *   **Perspective B (Rename the Prize):** The act of naming inherently confers honor and creates an association. Continuing to attach students' names and achievements to "Frege" implicitly endorses the individual as a worthy namesake, regardless of the prize's *intended* focus on his work. Frege's documented antisemitism and authoritarianism are antithetical to the university's core values of inclusivity, intellectual freedom, and democratic engagement. Maintaining the name, despite knowledge of these views, signals institutional tolerance for such ideologies, causing harm to members of our community, particularly Jewish students and scholars, and undermining the university's ethical stance.

  The Committee recognizes the validity within both arguments: the irreplaceable stature of Frege's *work* within the discipline, and the undeniable ethical weight of attaching his *name* to an award in our contemporary context.

  ### III. Recommendation: Contextualization and Forward Focus
  The Committee recommends **retaining the name "Frege Prize" but fundamentally reframing its presentation and purpose to explicitly decouple the honor from Frege the individual, center its focus on the enduring *ideas*, and create a meaningful educational counterpoint.**

  This recommendation involves three key actions:

  1.  **Explicit Renaming & Refocusing:** The award will be formally renamed:  
      **"The Frege Prize in Logic and Philosophy of Language: Recognizing Foundational Inquiry."**  
      *   **Rationale:** This retains the essential link to the intellectual tradition the prize was established to honor while linguistically shifting the emphasis *away* from Frege as an individual worthy of honor and *towards* the specific fields of study and the act of foundational inquiry itself. The name acknowledges historical context without bestowing simple endorsement.

  2.  **Incorporate a Mandatory Contextual Statement:** All published materials related to the prize (website, ceremony programs, award letters) will include the following, or similar, prominently displayed statement:  
      > "This prize recognizes exceptional undergraduate scholarship in logic and the philosophy of language, disciplines profoundly shaped by Gottlob Frege's seminal 19th-century contributions. The prize name acknowledges this historical intellectual foundation. However, the university explicitly condemns the antisemitic, anti-democratic, and authoritarian views Frege expressed in his private writings late in life, views entirely contrary to our core values of intellectual inclusivity, mutual respect, and democratic engagement. This prize honors the enduring power and rigor of the *ideas* in these fields, not the individual who held reprehensible personal beliefs."

  3.  **Establish an Annual Companion Lecture:** The Committee will propose the creation of a new, named annual lecture series focused on **"Ethics, Language, and the Public Sphere."**  
      *   **Rationale:** This directly addresses the concerns highlighted by Frege's diary (antisemitism, contempt for democracy) by creating a positive, substantive platform dedicated to exploring the ethical dimensions of language, the dangers of hate speech and authoritarianism, and the philosophical foundations of pluralistic democracy. This lecture, potentially endowed separately or linked administratively, provides an active, scholarly counterpoint and demonstrates the university's commitment to confronting the ethical challenges illuminated by this situation.

  ### IV. Reasoning
  This path forward respects the best arguments of both sides while proactively addressing the core ethical concerns:

  *   **Honors the Work, Not the Man (Addresses Perspective A):** It preserves the vital connection to Frege's unparalleled intellectual contributions that define the prize's academic scope. It explicitly adopts Dummett's separation: the prize mechanism continues to celebrate the *work* – the "estimate of the work" remains central. The formal name change ("Prize *in*...") and the contextual statement make this decoupling unambiguous and public. It avoids the erasure of a pivotal figure in the discipline's history.
  *   **Rejects Endorsement & Affirms Values (Addresses Perspective B):** It explicitly and publicly condemns Frege's hateful views, removing any ambiguity about institutional values. The mandatory statement ensures every recipient and audience member understands the university's stance. The name reframing ("Recognizing Foundational Inquiry") actively shifts the honor away from Frege as a person. Crucially, the companion lecture transforms awareness of Frege's failings into a positive, ongoing commitment to scholarship on the very ethical and democratic principles he rejected. This *action* speaks louder than maintaining a name alone ever could.
  *   **Provides Educational Depth & Institutional Integrity:** This solution moves beyond binary choice towards a richer response. It uses the moment as an opportunity for education and reaffirmation of values. The companion lecture ensures a lasting, substantive engagement with the ethical issues raised, benefiting the entire academic community. It demonstrates that the university can grapple complexly with its intellectual heritage, acknowledging foundational contributions while unequivocally rejecting ideologies of hate and oppression, and actively promoting their opposites.

  ### V. Implementation
  The Committee proposes the following timeline:
  1.  **Immediate Approval:** Faculty Senate approval of the renaming, contextual statement, and concept for the companion lecture.
  2.  **Semester Implementation (Spring 2024):** Update all official materials with the new prize name and contextual statement for the next award cycle.
  3.  **Development (Next Academic Year):** Committee to develop specifics for the "Ethics, Language, and the Public Sphere" lecture series (funding, naming, structure) for Senate approval.

  ### VI. Conclusion
  The discovery of Frege's private views presents a profound challenge. Simply retaining the name without change ignores the legitimate harm and ethical weight of honoring an individual who held such views. Simply renaming the prize risks diminishing the specific intellectual legacy it was created to recognize and may feel like erasure. Our recommended path navigates this complexity by honoring the transformative *ideas* central to the prize's purpose, explicitly condemning the abhorrent *personal beliefs* of their originator, and creating a proactive, positive scholarly commitment to the values he violated. This approach best serves our students, our discipline, and the core ethical commitments of [University Name].

  Respectfully submitted,  
  The Committee on Named Prizes & Lectureships
