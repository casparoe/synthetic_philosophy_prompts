prompt: |-
  I volunteer on the grants committee of a small community foundation, and we are divided over this year's $500,000 discretionary 'innovation' fund. Proposal A, a maternal-health program, is about 95 percent likely to avert roughly 250 deaths. Proposal B, a one-off advocacy campaign for an air-quality regulation abroad, has a 10 percent chance of averting about 4,000 deaths and a 90 percent chance of accomplishing nothing. B wins on expected value (400 versus 250), and three of the five of us want to fund it for that reason alone. I have no formal background in economics or philosophy, only what I have puzzled out on my own, and the most I can say is that a 90 percent chance of total failure ought to count for something beyond expected value — especially since we will not get to repeat this choice until the odds average out. Please draft the memo I will circulate before our vote: recommend a specific split between A and B, suggest a rule the committee could apply to similar choices later, and take the expected-value members' reasoning seriously rather than dismissing our hesitation as mere bias.
reasoning: |-
  Okay, the user is a volunteer on a grants committee for a community foundation. They're dealing with a tough decision on how to allocate a $500,000 innovation fund between two proposals. Proposal A is a maternal-health program with a high likelihood (95%) of preventing about 250 deaths. Proposal B is an advocacy campaign with only a 10% chance of preventing 4,000 deaths but a 90% chance of doing nothing. The committee is split—three members favor Proposal B because its expected value (400 deaths averted) is higher than A's (250), while the user and another member are hesitant due to the high risk of total failure.

  The user needs help drafting a memo to circulate before the vote. They want me to recommend a specific funding split, suggest a rule for future decisions, and take the expected-value proponents seriously without dismissing their concerns as bias. The user admits they don't have formal training in economics or philosophy, so I should keep explanations accessible.

  First, I need to unpack the core tension: expected value vs. risk. Expected value is straightforward math—B wins (400 > 250). But in real-world philanthropy, especially with one-off decisions, a 90% chance of wasting $500,000 feels irresponsible. The user’s phrase "we will not get to repeat this choice until the odds average out" is key—this isn’t a repeated gamble where B’s upside would shine; it’s a single bet with high stakes.  

  The user’s hesitation isn’t irrational. Concepts like risk aversion (humans prefer certainty) and regret minimization (avoiding the agony of a total loss) apply here. Even in economics, frameworks like the Kelly Criterion adjust for volatility. Plus, as a community foundation, they likely have stakeholders who’d question funding a 90%-likely failure, even if the math says otherwise.  

  For the memo, I should bridge both perspectives. The expected-value camp isn’t wrong—B’s potential impact is massive—but ignoring risk is naive. A split funding approach makes sense: allocate most to the safer A (covering core impact) and a portion to B (preserving the lottery-ticket upside). I’d suggest 70-30: $350k to A (likely saving ~175 lives after accounting for marginal scaling) and $150k to B (keeping the 10% shot at 4,000 lives, now with lower stakes).  

  The rule for future decisions should formalize this balance. I’d propose a "Risk-Adjusted Expected Value" framework: calculate EV, then discount it by the probability of total failure. For example, B’s EV of 400 discounted by 90% failure chance becomes 40—far below A’s 250. This quantifies the intuitive unease the user feels.  

  Crucially, the memo must validate the expected-value argument while elevating risk as a legitimate factor. Phrases like "Your math is correct, but..." keep it collaborative. I’d also hint that if this were a repeated choice (e.g., multi-year funding), B becomes more compelling—but for now, hedging is prudent.  

  Finally, I should emphasize that this isn’t just theory; it’s about stewardship. Donors and the community would likely see a 90% failure as reckless, even if intellectually defensible. The foundation’s reputation matters too.
answer: |-
  ## MEMO: Strategic Allocation Recommendation for Innovation Fund  
  **To:** Grants Committee  
  **From:** [Your Name]  
  **Date:** October 26, 2023  
  **Subject:** Balancing Impact, Risk, and Stewardship in Funding Proposals A & B  

  Thank you for your rigorous analysis of Proposals A and B. The expected-value (EV) argument for Proposal B—showing a theoretical upside of 400 lives saved versus Proposal A’s 250—is mathematically sound and highlights our shared goal: maximizing lives saved per dollar. However, the 90% risk of total failure in Proposal B warrants a nuanced approach that integrates *both* EV and real-world constraints. Below, I propose a split funding strategy, a decision rule for future risks, and a reconciliation of our perspectives.  

  ### 1. **Recommended Allocation: 70% to A ($350K), 30% to B ($150K)**  
     - **Proposal A ($350K):**  
       - Expected Outcome: 95% chance of saving ~175 lives (70% of 250).  
       - Why? Secures a high-probability, tangible impact. Even if scaled linearly, $350K likely achieves ~175 lives saved with near-certainty.  
     - **Proposal B ($150K):**  
       - Expected Outcome: 10% chance of saving ~1,200 lives (30% of 4,000), 90% chance of $0 impact.  
       - Why? Preserves a meaningful shot at outsized impact while limiting exposure to catastrophic failure. If successful, 1,200 lives saved still dwarfs A’s full outcome.  

  This split achieves 3 goals:  
  - **Mitigates Regret Risk:** If B fails (90% likely), we still save ~175 lives via A.  
  - **Preserves High-Upside Potential:** If B succeeds, total impact (~1,375 lives) exceeds either project alone.  
  - **Honors Stewardship:** Avoids betting $500K on a 90% probability of zero community benefit.  

  ---

  ### 2. **Proposed Rule for Future High-Risk/High-Reward Choices: "Risk-Adjusted Expected Value" (RAEV)**  
  EV alone is insufficient for one-off, high-stakes decisions. We should adopt:  
  > **RAEV = Expected Value × (1 − Probability of Total Failure)**  
  This discounts EV by the chance of getting *no* return, quantifying our intuitive aversion to wasted funds.  

  #### Applied to Proposals A & B:  
  - **Proposal A:**  
    EV = 250 lives  
    P(Failure) = 5% → **RAEV = 250 × (1−0.05) = 237.5**  
  - **Proposal B:**  
    EV = 400 lives  
    P(Failure) = 90% → **RAEV = 400 × (1−0.90) = 40**  

  **Result:** A’s RAEV (237.5) > B’s RAEV (40), favoring A. This rule formally incorporates the "90% chance of nothing" factor the EV-only view overlooks, without rejecting EV’s validity.  

  ---

  ### 3. **Why This Addresses Our Concerns**  
  - **For EV Advocates:** Your focus on maximizing impact is correct—and this split *increases* our worst-case outcome (175 saved vs. 0) while preserving 60% of B’s upside (1,200 of 4,000 lives). EV is a compass, but not a complete map when probabilities are extreme and unrepeatable.  
  - **For Risk-Conscious Members:** The 90% failure risk isn’t just psychological; it’s a fiduciary concern. Donors and beneficiaries expect responsible deployment of funds. RAEV makes this explicit.  
  - **The "Repeatability" Gap:** EV assumes repeated trials (e.g., if we could run B ten times, we’d expect 400 saves). But we get *one* shot. Hedging is rational when failure is permanent.  

  ---

  ### Final Recommendation  
  Let’s fund **Proposal A at $350,000** and **Proposal B at $150,000**. This respects EV principles while acknowledging that in low-repeatability scenarios, avoiding ruinous failure is as important as chasing upside. For future votes, the **RAEV framework** offers a transparent, consistent way to weigh risk against reward.  

  I look forward to discussing this on [Date]. Thank you for your commitment to our community’s most vulnerable.  

  ---  
  **Key Takeaways for Discussion:**  
  - ✅ **EV is necessary but not sufficient** for irreversible, high-risk choices.  
  - ✅ **RAEV quantifies risk aversion**—aligning math with our duty to avoid wasted resources.  
  - ✅ **Splitting the fund** lets us pursue transformative change without gambling the entire budget.
