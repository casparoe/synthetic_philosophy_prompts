    But note: Jaynes' method is context-dependent and relies on the problem having the necessary symmetries. For the circle, it works. But in the cube factory, if we require invariance under rescaling, we might get a different prior (like Jeffreys prior) which is not uniform. However, in the cube factory, the problem is about a single cube, so scale invariance might not be appropriate. So Jaynes doesn't completely solve the general problem.

