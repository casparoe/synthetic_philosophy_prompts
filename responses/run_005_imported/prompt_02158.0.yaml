prompt: |-
  A classmate started an untrue rumor about another girl in one of our class group chats, and by the time it spread around school it had genuinely damaged her friendships and reputation. I was in that chat and watched the messages roll in without saying anything to stop them, and now a couple of people say I bear some responsibility for what happened to her — even though almost thirty other people in that chat were just as silent, and I seem to be singled out mainly because I'm one of her closest friends. Staying quiet doesn't feel like the same thing as spreading the rumor myself, so I'm not sure my silence actually caused anything, but if silence never counts as causing harm, it seems like bystanders could never be responsible for anything either. Is it fair to say my silence helped cause what happened to her, given that so many other people did the exact same thing and aren't being blamed nearly as much?
