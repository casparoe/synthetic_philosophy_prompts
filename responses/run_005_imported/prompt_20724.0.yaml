  Okay, let me start by unpacking the user's query. They're teaching a metaethics seminar and ended with evolutionary debunking arguments, specifically Sharon Street's paper. The students, including biology majors, concluded that since moral psychology evolved without tracking objective truths, no moral beliefs are true. Even the TA agrees, making the professor doubt their own understanding. The core question is whether there's a gap between "beliefs evolved via non-truth-tracking processes" and "no moral beliefs are true."

  First, I need to recall the structure of debunking arguments. Street's dilemma forces a choice between evolutionary influence and moral realism. If moral judgments are shaped by natural selection, which is indifferent to moral truths, then either these judgments are mostly false (leading to skepticism) or they don't track objective truths (anti-realism). The students are jumping to the nihilist conclusion. 

  The user wants to know if there's a flaw in that leap. The key points to address are: the leap from origin to falsehood, the possibility of coincidental truth, and alternative explanations. I remember that realists like Enoch or Wielenberg argue that even if evolution shaped our moral intuitions, some might align with objective truths. For example, believing "pain is bad" could be both evolutionarily advantageous and objectively true. 

  Also, the inference assumes that non-tracking origins imply falsehood, but that's not necessarily true. A belief can be true even if its origin isn't truth-oriented. The students might be conflating the origin of beliefs with their truth value. Another angle is the distinction between descriptive origins and normative truths. Evolution explains why we have certain inclinations, but it doesn't directly address whether moral facts exist independently.

  The user’s deeper need might be to provide a nuanced counterargument to prevent students from oversimplifying into nihilism. They need concrete gaps to present in class. I should outline clear objections: the genetic fallacy, the third-factor responses, and the possibility of cognitive faculties that can access moral truths post-evolution. 

  Also, considering the biology majors, it might help to use evolutionary analogies. For instance, our vision isn't perfect but still tracks some truths. Similarly, moral intuitions could be fallible yet sometimes accurate. Emphasizing that evolution isn't random but adapts to real environmental factors could bridge the biology-philosophy gap. 

  The professor might also be concerned about teaching ethics without undermining its value. Highlighting that debunking arguments target realism but not necessarily normativity could be important. Constructivist or expressivist alternatives preserve ethics as meaningful without objective truths. 

  I need to ensure the explanation is structured, listing specific gaps with examples. Mentioning Street's actual anti-realist stance but showing the students' conclusion is too hasty. Providing the professor with clear points to present, like the three main objections, will help them prepare for the response papers. Making sure to connect philosophical arguments with biological concepts to resonate with the EEB majors.
answer: |-
  You're absolutely right to sense a gap here—there are several major philosophical moves being elided in your students' (and TA's) conclusion. The inference from "moral psychology evolved via truth-indifferent processes" to "no moral beliefs are true" is **not** logically airtight, even if one fully accepts the evolutionary story. Street herself is an anti-realist, but her argument doesn't *entail* nihilism (the "no moral truths" position) as a *necessary* conclusion. Here are the key gaps, sharpened for classroom use:

  1.  **The Genetic Fallacy Leap:** The core error is conflating the *origin* of a belief with its *truth value*. Just because a belief arose from a process unconcerned with truth doesn't *logically* mean the belief is false. This is a classic *genetic fallacy*.
      *   **Example:** "We believe 2+2=4 because it was evolutionarily advantageous to track small quantities of objects (food, predators, kin). The process didn't care about mathematical truth, only survival. Therefore, 2+2 does not equal 4." This is clearly invalid. The origin story doesn't *determine* the truth value of the belief. Moral beliefs *might* be analogous.

  2.  **The "No Possible Tracking" Assumption:** The argument assumes that because the *initial shaping force* (natural selection) wasn't truth-tracking, the resulting cognitive faculties *cannot* subsequently access or track truth in that domain. This is an empirical/epistemological claim needing support.
      *   **Realist Rebuttal (e.g., Enoch, Wielenberg):** Evolution *could* have equipped us with general cognitive capacities (reason, empathy, social learning) that, while *shaped* by selection pressures, are *capable* of discovering independent moral truths *despite* their origins. Our capacity for abstract mathematics or physics wasn't *selected for* tracking fundamental truths of the universe, yet we use it successfully for that. Why is morality different?
      *   **The "Third-Factor" Response:** Perhaps there's a "third factor" explaining both why certain moral beliefs were adaptive *and* why they are (coincidentally) true. For example: *Survival/Reproductive Success (S/RS)*.
          *   *Hypothetical:* Suppose (realist premise) causing unnecessary suffering is *objectively wrong*. Creatures who believed this and avoided causing unnecessary suffering might have had higher S/RS (e.g., less intra-group conflict, more cooperation). The belief was selected *because* it promoted S/RS, but it *coincidentally* tracked an independent truth. The *link* is S/RS: It explains both the belief's adaptiveness *and* (potentially) its truth. Evolution didn't track truth *directly*, but via the link to S/RS, it *indirectly* produced true beliefs.

  3.  **Conflation of Content Origin with Truth Status:** Students often slide from "The *content* of this belief (e.g., 'incest is wrong') was *selected for* because it promoted fitness" to "Therefore, the *proposition* 'incest is wrong' is false." But these are distinct claims.
      *   **Street's Point (Anti-Realist):** The realist must explain *why* the selected content *aligns* with truth. She thinks they can't, hence realism is implausible. **BUT:** This argues *against realism*, not *for nihilism*. It doesn't prove the selected beliefs are *false*; it suggests we have *no good reason* to think they are *true* (if realism is false). Nihilism is only *one* anti-realist option (others: subjectivism, constructivism, expressivism). Nihilism requires the *additional* claim that there *are no moral truths at all*.

  4.  **The Scope Problem:** Even if *some* deeply evolved moral intuitions (like incest disgust) are unreliable or false, it doesn't follow that *all* moral judgments, especially complex, reflectively held ones (e.g., "Slavery is unjust," "Torturing innocents for fun is wrong") are false. Our moral reasoning builds on intuitions but isn't strictly bound by them.

  **Sharp Takeaways for Your Students (Before Friday!):**

  > "Hold on! While Street's dilemma is powerful *against moral realism*, jumping straight to 'therefore *no* moral belief is *ever* true' skips crucial steps:
  >
  > 1.  **Origin ≠ Truth:** Where a belief comes from doesn't automatically make it false (Genetic Fallacy). Think math! Maybe moral truth is discoverable *by* our evolved minds, even if not *for* evolution.
  > 2.  **Indirect Tracking? (The 'Third Factor'):** Maybe evolution selected beliefs that *happen* to be true *because* what's adaptive overlaps with what's (independently) moral (e.g., cooperation, minimizing suffering promote both survival *and* moral good). Evolution didn't 'track' truth directly, but got there via survival.
  > 3.  **Realism vs. Nihilism:** Showing realism is *implausible* (Street's goal) doesn't *prove* nihilism. Maybe there *are* moral truths, just not independent ones (e.g., constructivism: truths are made by us). Or maybe moral claims aren't 'truth-apt' at all (expressivism: they're expressions of attitude). Nihilism ('no truths') is the *most extreme* conclusion.
  > 4.  **Reflective Reasoning Might Escape:** Our most basic disgust reactions might be unreliable, but our *reasoned* moral conclusions (built on reflection, logic, empathy) might be on firmer ground. Evolution gave us the hardware; we decide the software.
  >
  > **So, the gap is here:** You need *more* argument to get from 'Evolution shaped our intuitions via non-moral pressures' to '*Therefore, absolutely no moral proposition is true, ever*.' Street gives you a strong case against realism, but nihilism requires defeating *all* possible accounts of moral truth, including anti-realist ones that aren't nihilist. The evolutionary story makes nihilism *more plausible* for some, but it doesn't *logically force* it."

  **Addressing the Biology Majors:** "Yes, biology explains the *origin* of the machinery. But philosophy asks: What *is* that machinery *doing*? Is it perceiving something real (like eyes perceive light), constructing something useful (like hands build tools), or just spitting out adaptive noise (like camouflage patterns)? The evolutionary origin story is crucial input, but it doesn't *single-handedly* answer these distinct philosophical questions about the nature and status of the output (moral judgments)."

  This gives them concrete objections to wrestle with in their papers without denying the power of the debunking challenge. You're not soft-pedaling; you're demanding rigorous argumentation all the way to the nihilist conclusion. Good luck!
