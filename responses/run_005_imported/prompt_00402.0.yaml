answer: |-
  You've hit on one of the most fascinating (and initially counterintuitive) ideas in social philosophy! Lewis's requirement for **common knowledge** (the infinite tower: "I know that you know that I know...") feels excessive precisely because conventions *do* emerge naturally. But Lewis is pinpointing *why* they become stable and self-enforcing, not just frequent. Let's break down why the infinite regress is crucial and what fails without it.

  ### Why "Everyone Just Happens to Do It" Isn't Enough
  Imagine a simple coordination problem: driving side choice. "Everyone drives on the right" is a pattern. But for Lewis, a convention is more than a pattern; it's a *solution* to a recurring coordination problem where *multiple solutions are possible* (left *or* right could work), and we need to *predict* each other's behavior.

  Here's where levels of knowledge matter:

  1.  **Level 0 (Pattern):** "Most people drive on the right." This is just observation.
  2.  **Level 1 (Mutual Expectation):** "I expect you to drive on the right." This helps *me* coordinate *my* action.
  3.  **Level 2 (Mutual Belief):** "I believe you expect *me* to drive on the right." This helps *you* predict *my* action, making *your* choice more stable.
  4.  **Level 3+ (Common Knowledge):** "I know that you know that I know... we all expect each other to drive on the right." This creates **resilience** and **predictability even in novel or borderline situations.**

  ### What Breaks Without Common Knowledge? Concrete Failures

  The problem arises when there's uncertainty about *what others expect* or *what others think you expect*. Common knowledge eliminates this uncertainty at *all* levels. Without it, coordination becomes fragile:

  1.  **The Hesitation Problem (Traffic Lights):**
      *   **Situation:** You approach a red light. I approach from the cross street on green.
      *   **Without Common Knowledge:**
          *   *Level 1 Only (I expect you to stop):* I go because I expect you to stop.
          *   *But... I don't know if YOU know that I expect you to stop.* Maybe you think *I* might run the red light? If you have that doubt (Level 2 uncertainty: "Does *he* know that *I* will stop?"), you might hesitate or slow down preemptively, even though you intend to stop.
          *   *Level 2 Only (I know you expect me to stop):* You expect me to stop, and I know you expect me to stop. I stop. You go.
          *   *But... I don't know if YOU know that I know you expect me to stop.* Maybe you think *I* don't realize you're expecting me to stop? If you have that doubt (Level 3 uncertainty: "Does *he* know that *I know* he's expected to stop?"), you might still hesitate before proceeding on green, fearing I might not stop despite knowing the rule.
      *   **Result:** Hesitation, slowdowns, near-misses, or even accidents occur at intersections *even though everyone individually knows the rule and intends to follow it*. The uncertainty about mutual expectations breeds caution that disrupts smooth coordination.
      *   **With Common Knowledge:** I know you expect me to stop, you know I expect you to stop, I know you know I expect you to stop... ad infinitum. This creates absolute confidence. I stop decisively. You proceed on green decisively. Flow is smooth.

  2.  **The Fragility Problem (Driving Side - Sudden Change):**
      *   **Situation:** You're driving in a country where driving on the right is the norm, but it's not enshrined in law or universally taught (imagine a post-collapse society where formal institutions are weak). One day, a significant minority starts driving on the left.
      *   **Without Common Knowledge:**
          *   You see someone driving on the left. *Level 1:* "Huh, that guy's driving on the left. Weird."
          *   You see a few more. *Level 1:* "Okay, a few people are driving on the left now."
          *   *But... You don't know what others expect.* Do others still expect everyone to drive on the right? Do they expect a mix? Do they *know* that *others* expect a mix? This uncertainty is paralyzing. You don't know which side to choose because you don't know what side *others* will choose *based on what they think others expect*. The convention collapses rapidly into chaos because there's no shared understanding of *what the shared expectation is*.
      *   **With Common Knowledge:** If driving on the right is common knowledge, seeing a few defectors doesn't change your behavior. You *know* that almost everyone *knows* that almost everyone *knows*... that driving on the right is expected. You confidently stay right, expecting others to do the same, knowing they expect it too. The convention withstands minor defections.

  3.  **The Meaning Problem (Language):**
      *   **Situation:** You say "bank" meaning a financial institution. I hear it.
      *   **Without Common Knowledge:**
          *   *Level 1:* I know *you* use "bank" to mean financial institution.
          *   *But... I don't know if YOU know that I use it the same way.* Maybe you think *I* might interpret it as a riverbank? If I have this doubt (Level 2 uncertainty), I might hesitate or ask for clarification ("Money bank or river bank?").
          *   *Level 2:* I know you know that *I* use "bank" for finance.
          *   *But... I don't know if YOU know that I know you know...* Maybe you think *I* don't realize *you* know I use it that way? This sounds silly, but it translates into subtle uncertainty about whether we truly share the *same* understanding of the word as a *shared public tool*. Communication becomes slightly less efficient, more prone to misunderstandings in ambiguous contexts.
      *   **With Common Knowledge:** The meaning is a *public fact* we both know we both know we both know... When you say "bank," I instantly retrieve the financial meaning *with confidence*, knowing you intended that meaning *and* knew I would understand it that way *and* knew I knew you knew... Communication is seamless and presupposes shared understanding.

  ### Why the "Infinite" Part Isn't Literal (But Still Necessary Conceptually)

  *   **It's a State, Not a Calculation:** Lewis isn't saying people consciously run through infinite iterations in their heads. He's describing the *logical structure* of the state of affairs that makes conventions work perfectly. It's the *absence of any doubt at any level*.
  *   **Bootstrapping & Publicity:** How do we achieve this state? Through **public signals**. Laws, road signs, dictionaries, prominent examples, widespread teaching, and even just *observing others successfully coordinate* act as public events that create common knowledge. Seeing a law passed ("Drive on the Right") tells *everyone* that *everyone else* has been told the rule, and everyone knows everyone else knows. This publicly broadcast information shortcuts the infinite regress.
  *   **Prevents Regress Collapse:** The "infinite" requirement ensures the structure is logically sound and doesn't collapse at any level. If it stopped at level N, someone could always wonder "But do they know that I know that they know... (up to level N)?" That doubt at level N+1 could still undermine coordination in sensitive situations. Infinity closes all possible loopholes for doubt.
  *   **Resilience Against "Outsiders":** Common knowledge explains why conventions persist even when new people enter the group. They quickly learn not just the rule, but that *everyone else knows and follows it*, creating the necessary higher-order expectations.

  ### In Essence

  Lewis needs common knowledge to explain why conventions are **self-reinforcing, stable equilibria** in coordination games. Without it, coordination is possible but **fragile, hesitant, and vulnerable to collapse** when minor uncertainties arise or defections occur. The infinite regress ensures that *every possible layer of doubt* about mutual expectations is eliminated, creating the rock-solid predictability that allows us to drive at high speeds towards each other, use complex language, and navigate countless social interactions smoothly without constant renegotiation. It's the invisible infrastructure that makes spontaneous order truly robust. Your instinct that it emerges naturally is correct; common knowledge is the mechanism explaining *how* that emergence locks in and becomes reliable.
