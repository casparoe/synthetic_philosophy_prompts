  The user's insight is valid, but Russell's solution lies in negation scope. Highlighting Strawson's response could show this is a famous debate. The user might appreciate knowing this is a recognized issue, not their oversight. They might also need reassurance that their understanding is correct but incomplete regarding negation. Emphasizing the difference between logical structure and surface grammar would help. 

