  The meta-debate about verbal vs. substantive disagreement needs nuance. Clarissa could argue contextualism better explains linguistic behavior (e.g., why we retract past "knowledge" claims in light of new stakes), while Roland insists pragmatic encroachment captures how knowledge guides action. Maybe end by suggesting both agree evidence must meet practical demands—they just package it differently. 

