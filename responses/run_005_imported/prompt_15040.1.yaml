prompt: |-
  I've been trying to work through the "surrogate goals" idea from decision theory, proposed as a defense against acausal threats — threats that work not through any causal interaction but through an adversary predicting or simulating what you would do. The proposal is that an agent can shield what it actually cares about by adopting a cheap, otherwise worthless "surrogate" goal and committing to respond to threats against that surrogate exactly as it would respond to threats against its real values. The idea is that a threatener who only wants leverage, rather than caring about inflicting any particular harm, will then settle for targeting the surrogate instead of the real thing whenever a threat is actually carried out. What I can't settle is whether the scheme is coherent. If the commitment to defend the surrogate has to be airtight against a threatener capable of predicting or simulating you, then "airtight commitment to treat X as costly" and "genuinely valuing X" seem to collapse into the same thing. If so, nothing has actually been shielded — the agent has just created a second real vulnerability under a new name. But if the commitment falls short of airtight, it's hard to see why a sophisticated threatener would ever be deceived by it.

  Could you write me a dialogue between two decision theorists on opposite sides of this: one convinced that surrogate goals are a genuinely sound and coherent defense, the other convinced the whole scheme secretly collapses into one of those two horns. Please give each side its strongest moves, have them actually respond to one another's specific points rather than talk past each other, and let the exchange end wherever it honestly leads — mutual agreement, a sharpened disagreement, or a stalemate.
reasoning: |-
  We are going to create a dialogue between two decision theorists: Alex (who believes surrogate goals are a coherent defense) and Bailey (who believes the scheme collapses). They will engage with each other's points.

  Alex: Proponent of surrogate goals.
  Bailey: Skeptic.

  Key points from the problem:
  - Surrogate goal: a cheap, otherwise worthless goal that the agent commits to defend as if it were the real goal.
  - The idea: a threatener (who only wants leverage) will target the surrogate instead of the real values because the agent responds the same way.
  - The collapse worry: if the commitment is airtight, then the surrogate becomes a real value; if not, then the threatener might not be deceived.

  Dialogue:

  Alex: I think surrogate goals are a solid defense. By committing to treat a cheap, worthless surrogate goal (like protecting a random number) as if it were my real values, I can deter threats. The threatener, who only wants leverage, will see that threatening the surrogate is just as effective as threatening the real thing and will choose the cheaper option (for them) of threatening the surrogate. And since the surrogate is cheap, I don't really care if they carry out that threat. It's a win-win.

  Bailey: But let's examine your commitment. For the threatener to be deterred from targeting your real values, they must believe that you will defend the surrogate exactly as you would defend your real values. That requires an airtight commitment. How do you achieve that without actually valuing the surrogate? Because if you don't value it, then in the actual moment of carrying out the threat, you might not follow through on your commitment. And if you do follow through, doesn't that mean you've effectively created a new value?

  Alex: Not necessarily. The commitment is pre-commitment. I set up my decision algorithm in advance so that it responds to threats against the surrogate in the same way it responds to threats against the real thing. That algorithm is fixed and the threatener, being a good predictor, can see that. So they know that if they threaten the surrogate, I will act as if that threat is as costly as a threat to my real values. But internally, I don't actually care about the surrogate. It's just a piece of code.

  Bailey: But if the algorithm is fixed to respond identically to threats against the surrogate and the real values, then in what sense do you not value the surrogate? From the perspective of the threatener, the surrogate and the real values are indistinguishable. And from your own perspective, when the time comes to act, you are forced to spend resources to defend the surrogate just as you would for your real values. That means that in practice, the surrogate has become a real value. You've just added a new vulnerability.

  Alex: The difference is that the surrogate is chosen to be cheap. I set up the algorithm so that the surrogate is something that I can afford to lose. For example, if my real value is saving human lives, and I choose a surrogate of "prevent the number 42 from being broadcast", then if the threatener forces me to pay a ransom to prevent the broadcast of 42, I pay it because my algorithm is set to do so. But if they don't threaten, I don't care about 42. And if they do carry out the threat and broadcast 42, it doesn't hurt my real values. So the cost is only the ransom, which I am willing to pay as part of the defense strategy.

  Bailey: But now you've introduced a cost: the ransom. And if the threatener knows that you are committed to paying ransoms to protect the surrogate, then they can repeatedly threaten the surrogate and drain your resources. So you haven't shielded your real values at all; you've created a new vulnerability that can be exploited just as much.

  Alex: That's a fair point, but I can design the surrogate to be something that is only threatened in a one-shot scenario, or I can set a limit on how much I'm willing to pay. The key is that the threatener doesn't gain anything by targeting the real values because they get the same response. So they might as well target the surrogate. And if they do, the damage to me is limited because the surrogate is cheap.

  Bailey: But if you set a limit, then the threatener might test that limit. Suppose they threaten to broadcast 42 unless you pay $100. You pay. Then they threaten to broadcast 43 (a new surrogate you haven't set up) unless you pay again. Or they threaten to broadcast 42 again. How do you prevent repeated attacks?

  Alex: I can set up a rule that I only defend one surrogate. Or I can make the surrogate something that is inherently one-time. For instance, the surrogate could be "prevent the broadcasting of any number in the range 1 to 1000". Then if they threaten to broadcast any number in that range, I treat it as a threat to the surrogate and pay the ransom. But if they try to attack outside that range, I don't respond. And if they carry out the threat and broadcast a number, then that specific number is "used up" and I don't care about it again. So they can only get one ransom out of me per number. And since there are 1000 numbers, they can get 1000 ransoms, but that's a known cost I can budget for. Meanwhile, my real values (human lives) are untouched.

  Bailey: But now you are budgeting 1000 ransoms. That means you are effectively valuing the surrogate at 1000 ransoms. So it's not cheap at all! It's a significant cost. And if the threatener is sophisticated, they might demand the entire budget at once. For example, they could threaten to broadcast all 1000 numbers unless you pay 1000 times the ransom. Then you are forced to pay a huge amount to protect the surrogate. And if you don't, then the threatener learns that your commitment isn't airtight. So you either pay a lot or break your commitment.

  Alex: I see your point. Maybe I need to design the surrogate so that the cost of defending it is bounded and acceptable. But even if I pay 1000 ransoms, that's still better than having my real values attacked. Because if they attacked my real values, they could demand an arbitrary amount. By having a surrogate with a known maximum cost, I cap my exposure.

  Bailey: But the problem is that the threatener might not be satisfied with the capped amount. If they know your real values are more valuable, they might still target the real values. For instance, if they can threaten to kill a human unless you pay a ransom that is higher than the maximum you set for the surrogate, then they have an incentive to go after the real thing. And if they do, you are forced to pay more because you value the human life. So the surrogate doesn't deter them from targeting the real values.

  Alex: But why would they target the real values? They know that if they target the surrogate, they can get a ransom of X. If they target the real values, they can get a ransom of Y. But if Y is greater than X, they might try. However, I have set up my algorithm to respond to threats against the real values with the same level of defense as threats against the surrogate. So if they threaten a human life, I will pay up to the same amount as I would for the surrogate? Wait, that doesn't make sense because I value the human life more.

  Bailey: Exactly! That's the core problem. If you truly value the human life more, then you cannot commit to treat a threat to a human life the same as a threat to the surrogate. Because if the threatener demands more than the surrogate ransom but less than the value of a human life, then you would pay for the human life but not for the surrogate. So your commitment to treat them the same is not credible.

  Alex: So I need to set the commitment level for the surrogate to be as high as the value of my real values? But then if the surrogate is attacked, I might end up paying an enormous amount for something I don't care about.

  Bailey: Precisely. And that's why the surrogate becomes a real vulnerability. You've created a new thing that you are effectively forced to value highly, because you've committed to defend it at the same level as your real values. So now you have two things that can be held hostage: your real values and the surrogate. And the threatener can choose which one to attack. That doesn't reduce your vulnerability; it increases it.

  Alex: But if the threatener is indifferent between which one they attack, they might choose the surrogate because it's easier to threaten. For example, threatening to broadcast a number might be easier than threatening to kill a human.

  Bailey: That might be true, but it doesn't change the fact that you are now vulnerable to both. And if the threatener is a superintelligence that can simulate you, they will see that you have two vulnerabilities. They might even threaten both at the same time. Then you have to pay twice: once for the surrogate and once for the real values. So you are worse off.

  Alex: What if I make the commitment such that I only defend the surrogate? That is, I set up the algorithm to ignore threats to the real values and only respond to threats against the surrogate? But that doesn't make sense because then my real values are undefended.

  Bailey: Right. So you have to defend both. And if you defend both with the same level of commitment, then you have two equally costly vulnerabilities. If you defend the surrogate with a lower level of commitment, then the threatener will ignore the surrogate and go for the real thing.

  Alex: So it seems I'm stuck. Either I make the surrogate as valuable as the real thing (which makes it a real vulnerability) or I don't, and then the threatener targets the real thing.

  Bailey: That's the collapse I was talking about. The surrogate goal either becomes a real value (and thus a real vulnerability) or it fails to deter.

  Alex: But what if I use the surrogate in a way that the threatener doesn't know which one is the surrogate and which one is the real thing? For example, I have multiple goals and I don't reveal which one is the surrogate.

  Bailey: But if the threatener can simulate you, they can figure out which one you actually care about. Because in the simulation, when they threaten each goal, they can see how much you are willing to pay. If you are willing to pay more for one than the other, then they know which one is real.

  Alex: So unless I am willing to pay the same amount for every goal (including the surrogate) as I would for the real thing, they can tell. And if I am willing to pay the same amount, then I have effectively made every goal equally valuable. So again, the surrogate becomes a real value.

  Bailey: Exactly.

  Alex: Then maybe the solution is to have a large number of surrogates, and I set the same defense level for all of them and the real values. Then the threatener doesn't know which one is real. But if I have N goals (one real and N-1 surrogates) and I set the same defense level for all, then if they attack one at random, there's a 1/N chance they hit the real one. So I might be willing to risk that. And they might prefer to attack a surrogate because they don't want to risk attacking the real one and having me not pay? Wait, no. If they attack the real one, I pay. If they attack a surrogate, I pay. So they get paid either way. So they don't care which one they attack.

  Bailey: But if they attack a surrogate, you pay and your real values are safe. If they attack the real one, you pay but your real values are still safe? No, if they attack the real one, then even if you pay, you are paying to protect the real value. So if they carry out the threat on the real value, you lose the real value. So they have leverage. But in the case of a surrogate, if they carry out the threat, you don't lose anything of real value. So if they attack a surrogate, they can get the ransom without causing real harm. But if they attack the real one, they can get the ransom and then still cause real harm? That doesn't make sense because if you pay, they don't carry out the threat.

  Let me clarify: The typical threat is: "Pay or I do X." So if you pay, they don't do X. So if X is a threat to the real value, then by paying you prevent the harm. Similarly for the surrogate.

  But if they attack the real value and you pay, then they get the ransom and the real value is safe. If they attack a surrogate and you pay, they get the ransom and the surrogate is safe. But if they attack a surrogate and you don't pay, then they carry out the threat and you lose the surrogate (which you don't care about). So the threatener would prefer to attack the real value because if you don't pay (which you might if you run out of money or if you decide not to), then they can inflict real harm. But if they attack the surrogate and you don't pay, they don't get the ransom and they don't inflict real harm.

  Therefore, the threatener has an incentive to target the real value because it gives them more leverage: the possibility of inflicting real harm if you don't pay. Whereas with the surrogate, if you don't pay, they get nothing and you don't care.

  So to deter them from targeting the real value, you must make sure that they believe that you will pay for the surrogate. But if they think you might not pay for the surrogate (because you don't value it) then they will target the real value.

  So again, you need an airtight commitment to pay for the surrogate. And that brings us back to the original problem.

  Alex: I see. So without airtight commitment, the threatener will target the real value. With airtight commitment, the surrogate becomes a real vulnerability. And if I set up multiple surrogates with the same commitment, then I have multiple real vulnerabilities. So I haven't reduced my vulnerability; I've increased it.

  Bailey: That's my argument.

  Alex: Then maybe surrogate goals are not a solution. Or maybe they are only useful in limited contexts, such as when the threatener cannot distinguish between the surrogate and the real value and when the cost of defending the surrogate is low enough that I can accept it as the price of doing business.

  Bailey: But in the face of a superintelligent threatener that can simulate you, the distinguishing is trivial. So I think the scheme collapses.

  Alex: I'm starting to agree. It seems that the only way out is if the threatener has a preference for not causing real harm. But if they are indifferent, then surrogate goals don't help.

  Bailey: Right. So we might need a different approach.

  Alex: Then let's agree that surrogate goals, as originally conceived, are not a coherent defense against acausal threats.

  Bailey: I think that's where we land.

  End of dialogue.
answer: |-
  Here is a dialogue between two decision theorists, **Alex** (proponent of surrogate goals as a coherent defense) and **Bailey** (skeptic who argues the scheme collapses). They engage directly with each other's points, building toward a resolution.

  ---

  **Alex:** Okay, let’s revisit surrogate goals. The core idea is elegant: I adopt a cheap, worthless "surrogate" goal—say, protecting a random string of numbers—and commit to responding to threats against it *exactly* as I would to threats against my real values. An acausal threatener, who only wants leverage and doesn’t care *what* they threaten, will target the surrogate instead because it’s just as effective and avoids unnecessary harm. That shields my real values. What’s not coherent about that?

  **Bailey:** I’ll grant the elegance, but I think it collapses under scrutiny. Start with your commitment. For the threatener to prefer targeting the surrogate, they must be convinced your response to a threat against it is indistinguishable from your response to a threat against your real values. That requires an *airtight* commitment. But if it’s airtight, doesn’t that mean you’ve effectively made the surrogate a real value? After all, you’re now willing to pay real costs—resources, risks, or penalties—to defend it, just like you would for your true values. So you haven’t shielded anything; you’ve added a new vulnerability.

  **Alex:** Not at all! The commitment is algorithmic, not valuational. I pre-commit my decision algorithm to output the same defensive response—say, paying a ransom—regardless of whether the threat targets the surrogate or the real thing. Internally, I assign no intrinsic worth to the surrogate. It’s purely instrumental. The threatener, simulating my algorithm, sees identical behavior and rationally chooses the surrogate because it’s "cheaper" for them in some meta-sense—say, less ethically fraught or computationally simpler to threaten. My real values remain untouched.

  **Bailey:** But that’s where the collapse happens. If your algorithm outputs identical defenses for both, then *ex post*, when a threat occurs, you expend real resources to protect the surrogate. That means the surrogate *has* real cost to you. And if the threatener knows your algorithm is fixed, they see you’ve created a new thing you’re effectively willing to pay for. That’s a real vulnerability! It’s no longer "cheap"; it’s a liability. For example, if your real value is saving lives, and your surrogate is protecting a random number, but you pay the same ransom for both, then the random number has become just as "valuable" in terms of your revealed preferences. How is that not a new target?

  **Alex:** Because the cost is bounded and discretionary. I choose a surrogate that’s inherently low-stakes—like a number I can afford to lose—and I cap my defense expenditure for it. Say, I’ll pay up to $X to protect the surrogate, but I’d pay up to $Y for my real values, where $X is trivial and $Y is astronomical. The threatener sees that threatening the surrogate gets them $X easily, while threatening real values risks me refusing if demands exceed $Y. So they settle for $X via the surrogate. My real values stay shielded, and I only lose pocket change.

  **Bailey:** Ah, but now you’ve weakened your commitment! If your defense of the surrogate is capped at $X while your real values are defended up to $Y (where $Y > $X), then the threatener can distinguish them. They’ll demand $Y - ε for your real values—just under your limit—and you’ll pay because you care. But for the surrogate, if they demand more than $X, you won’t pay. So why would they ever target the surrogate when they can extract more by threatening real values? Your commitment isn’t identical, so the threatener isn’t deceived.

  **Alex:** Fine, so I make the defense limits identical: I commit to defending both surrogate and real values up to the same $Z. Now the threatener can’t distinguish them behaviorally. They’re indifferent and might target the surrogate for convenience.

  **Bailey:** But now you’ve made the surrogate *as costly as your real values*. If the threatener demands $Z to protect the surrogate, you pay it, even though the surrogate is worthless. That’s a massive, avoidable loss—precisely the kind of harm you wanted to prevent. And if the threatener repeats this, you’re drained. Worse, you now have two equally costly vulnerabilities instead of one. How is that "shielding"?

  **Alex:** The loss is bounded per threat, and crucially, the surrogate threat doesn’t harm my real values. If they demand $Z for the surrogate, I pay, and my real values are unscathed. If they demand $Z for real values, I pay, and real values are saved. But by targeting the surrogate, they get the same payoff without collateral damage—something a minimally cooperative threatener might prefer. So they’ll choose the surrogate.

  **Bailey:** But why would they prefer it? If the threatener only cares about leverage, they’re indifferent to collateral damage. In fact, threatening real values gives them *more* leverage because if you refuse (e.g., if you’re bankrupt), they inflict real harm. With the surrogate, if you refuse, they inflict nothing you care about. So they’ll target real values to maximize their upside. Your scheme only works if the threatener has a preference for "clean" threats, which isn’t guaranteed.

  **Alex:** Then let’s add uncertainty. I deploy multiple surrogates alongside my real values, all with identical defensive commitments. The threatener can’t tell which is real. If they attack one at random, they risk hitting a surrogate and getting little (since surrogates are cheap to me) or hitting real values and getting more. But they’d prefer a sure thing—so they might attack a surrogate to guarantee some payoff.

  **Bailey:** But if they can simulate you, they’ll discern the real values. In their simulation, they threaten each goal and observe your response. If you’ve made defenses perfectly identical, then *all* goals—surrogates included—demand the same costly defense. So you’ve created a swarm of equally vulnerable targets. You’re *more* exposed, not less! And if defenses aren’t identical, they’ll find the real values. It’s a lose-lose.

  **Alex:** What if I make the commitment "one-time"? For example, I defend the surrogate vigorously once, but if compromised, it’s discarded. No repeated costs.

  **Bailey:** Then a sophisticated threatener anticipates this. They demand a high ransom upfront, knowing you’ll pay to preserve the commitment’s credibility. You lose big on the surrogate. Or they test you with a small threat, see if you defend, and if you do, they know the surrogate is "real" to your algorithm and escalate. Again, collapse.

  **Alex:** So you’re saying the only way to avoid collapse is to have a commitment so perfect it makes surrogates real values or so weak it’s unconvincing?

  **Bailey:** Exactly. That’s the horns of the dilemma. If the commitment is behaviorally airtight, the surrogate becomes a real value because you incur real costs defending it. If it’s not airtight, the threatener sees through it. There’s no middle ground where the surrogate is "cheap" for you but treated as "costly" by the threatener. Costly *to whom*? If it’s costly to you, it’s a vulnerability. If not, the threatener ignores it.

  **Alex:** But what if the cost is *only* in the threatener’s model? They observe my behavior and see I defend the surrogate as if it’s valuable, but internally, I don’t care. That should suffice.

  **Bailey:** In decision theory, what matters is revealed preference. If you defend it, you’re revealing that it *has* value—if only instrumental. And instrumental value still motivates real trade-offs. The threatener exploits that. Your internal state is irrelevant; only behavior counts for acausal threats.

  **Alex:** ...I see your point. If I pay to protect the surrogate, that payment is a real loss, even if I don’t "value" the surrogate intrinsically. So I’ve created a new way to lose. And if I don’t pay, the threatener learns not to bother with surrogates. Either way, the scheme fails.

  **Bailey:** Yes. Surrogate goals might work against *causal* threats where you can bluff, but against a superintelligent acausal threatener who simulates you perfectly, it collapses. The only defense is to avoid predictability altogether—say, via randomness or cryptographic commitments—but that’s a different approach.

  **Alex:** Agreed. I still think surrogates could be useful in limited cases—like when threateners have preferences against real harm—but for pure leverage-seekers, they’re either self-defeating or incoherent. Thanks for sharpening that.

  **Bailey:** Likewise. So we end with a refined stalemate: Surrogate goals aren’t universally coherent, but they might fit niche scenarios. Not a full defense, but not useless.

  **Alex:** Stalemate it is. Let’s go think about randomness instead.

  ---

  **Resolution:** The dialogue ends in a **sharpened stalemate**. Alex concedes that surrogate goals collapse against pure acausal threats (Bailey's core argument), but both agree the idea may retain limited utility in scenarios where threateners have secondary preferences (e.g., avoiding collateral damage). The key insight is that an "airtight commitment" to defend a surrogate *necessarily* makes it a real vulnerability, as it forces the agent to incur costs indistinguishable from real valuation.
