     In fact, the auction is a classic example of a war of attrition. The bidders are trapped in a situation where each incremental bid seems to make sense because the loss from not bidding (losing the current bid) is immediate, while the loss from bidding and then losing more is in the future and uncertain.

     Therefore, Marcus has a point: at each step, the marginal reasoning (considering the immediate cost and benefit of the next bid) may justify bidding again.

