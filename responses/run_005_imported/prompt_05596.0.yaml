  For my philosophy of mathematics seminar this term, we've spent the last few weeks working through Cantor's continuum problem and its eventual fate. Cantor was a committed mathematical Platonist who assumed that the continuum hypothesis had to have one correct answer, and he devoted much of his later career to trying to settle it outright. What do you think his reaction would have been to Gödel's 1940 proof that CH is consistent with ZFC and Cohen's 1963 proof that its negation is equally consistent, results that jointly show CH can be neither proved nor disproved from the standard axioms? Would Cantor most likely have sided with Gödel's own view that further axioms, say concerning large cardinals, are still needed to fix CH's truth value, or would the independence result have struck him as undermining his basic assumption that every well-posed question about sets has a determinate answer? Please justify your answer by reference to Cantor's actual philosophical commitments, rather than just the technical content of the independence proofs.
