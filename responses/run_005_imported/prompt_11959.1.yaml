prompt: |-
  I cover science and ideas for a living, and recently found myself at a dinner after a public panel on the solar system, where two of the panelists kept arguing about Pluto's demotion long after the Q&A had ended. Renata, an orbital dynamicist, and Dev, a planetary geologist who had worked on the New Horizons mission, went back and forth roughly like this:

  (1) Renata: The International Astronomical Union wasn't just legislating a word in 2006. "Has cleared the neighborhood around its orbit" tracks something dynamically real — whether a body dominates its zone predicts how it formed and how stable that zone will stay. That's a fact about Pluto, not a preference.

  (2) Dev: But "cleared its neighborhood" isn't a property of Pluto at all — it's a property of the whole region. Drop an Earth-mass body into Pluto's orbit and it would likely take far longer than the age of the solar system to clear that same neighborhood, simply because the outer disk is so much bigger and slower. What's actually intrinsic to Pluto — its roundness, its layered geology, its thin atmosphere — is what does the real explanatory work, and that's what people meant by "planet" long before 2006. So the whole fight over which definition is "correct" is merely verbal: once we agree Pluto is round, geologically active, and hasn't gravitationally cleared its zone, there's no further fact about whether it's "really" a planet — that's just a decision about where to draw a word's boundary, no different from arguing about whether a hot tub counts as a "pool."

  (3) Renata: Too fast. Not just any predicate carves up the solar system equally well. "Cleared its orbital zone" supports generalizations about formation and long-term stability that mere roundness doesn't, so if one classification does more explanatory work, deciding which property our theories should track is substantive, not verbal.

  (4) Dev: Roundness does comparable work — it predicts internal differentiation, geological activity, and the capacity to hold an atmosphere or subsurface ocean, which is exactly why geologists care about it. If both properties support real generalizations, they're equally entitled to count as "joint-carving," and the leftover question of which one gets the word "planet" is precisely the kind of question with no further fact of the matter.

  By the time the check came, neither had conceded an inch, and I was no closer to a verdict myself. Could you go through moves (1) through (4) and say, for each, who has the stronger case and why — drawing on how philosophers actually distinguish verbal from substantive disputes (Hirsch and Chalmers are the obvious reference points, but bring in others if relevant)? In particular: does Renata's move (3) succeed in blocking Dev's "merely verbal" diagnosis, or does move (4) reinstate it — and is there a position, something like what Karen Bennett calls an "unhappy-faced" verdict, that both of them are missing? End with your overall verdict on its own line, in exactly this format: \verdict{verbal}, \verdict{substantive}, or \verdict{unresolved}.
reasoning: |-
  We are presented with a debate between Renata (orbital dynamicist) and Dev (planetary geologist) about the definition of "planet" and whether the dispute over Pluto's status is substantive or merely verbal. We are to analyze the four moves and then give a verdict.

  The key references are to philosophers Hirsch and Chalmers on verbal disputes, and we might also consider Karen Bennett's "unhappy-faced" verdict (which is a view that a dispute is not merely verbal but also not straightforwardly substantive, perhaps because of underlying metaphysical or conceptual indeterminacy).

  Let's break down each move:

  **(1) Renata:** She argues that the IAU definition (requiring that a planet has cleared its neighborhood) is not arbitrary because it tracks a dynamically real property (whether a body dominates its orbital zone) which predicts formation and stability. She claims this is a fact about Pluto, not a preference.

  **Analysis:** Renata is making a case that the definition is tied to a scientifically significant property that does explanatory work. This suggests that the dispute is substantive because it is about which properties are scientifically important.

  **(2) Dev:** He counters that "cleared its neighborhood" is not an intrinsic property of Pluto but of the region. He argues that the intrinsic properties (roundness, layered geology, atmosphere) are what do the real explanatory work and have historically defined planets. Therefore, the fight over the definition is merely verbal: once we agree on the properties, the label "planet" is just a matter of where we draw the word's boundary.

  **Analysis:** Dev is invoking a distinction between intrinsic properties of the object and extrinsic properties (which depend on the environment). He claims that the historical meaning of "planet" is tied to intrinsic properties and that the choice of which set of properties to use for the definition is arbitrary. This is a classic move in a verbal dispute: the facts are agreed upon, and the disagreement is only about the label.

  **(3) Renata:** She responds that not any predicate is equally good. The property of having cleared the orbit supports generalizations about formation and stability that roundness does not. Therefore, the choice of which property to track with the term "planet" is substantive because it affects the explanatory power of our theories.

  **Analysis:** Renata is arguing that the property of having cleared the orbit is more scientifically significant (it does more explanatory work) than roundness. Thus, the dispute is not merely verbal because it matters which property we use for classification in our scientific theories.

  **(4) Dev:** He argues that roundness also supports important generalizations (internal differentiation, geological activity, atmosphere retention) and therefore is equally "joint-carving" (a reference to the philosophical idea of "carving nature at the joints"). Since both properties are scientifically significant, the question of which one gets the word "planet" is without a further fact of the matter.

  **Analysis:** Dev is granting that both properties are scientifically important but maintains that the choice between them for the term "planet" is arbitrary. Thus, the dispute remains verbal.

  **Philosophical Framework:**

  - **Hirsch** (e.g., in "Quantifier Variance and Realism") argues that many metaphysical disputes are verbal: they are about how to use words rather than about the world. If the disputants agree on all the non-linguistic facts but still disagree, then the dispute is verbal.

  - **Chalmers** (in "Verbal Disputes") suggests that a dispute is verbal when there is a single underlying non-linguistic fact that both parties agree on, and the disagreement is only about the meaning of a term. He also proposes that we can resolve verbal disputes by finding a "precisification" of the term.

  - **Bennett's "unhappy-faced" verdict**: This is a view that a dispute is not merely verbal, but it is also not substantive in the way the disputants think. It might be that there is no fact of the matter about which concept is the correct one, but the dispute is not merely about words either. It could be that the concepts themselves are not perfectly joint-carving or that there is indeterminacy.

  **Applying to the Moves:**

  In move (1) and (3), Renata is trying to show that the dispute is substantive by arguing that the property of having cleared the orbit is scientifically important and that using it as the criterion for "planet" leads to better explanations. In move (2) and (4), Dev is arguing that the dispute is merely verbal because both sets of properties are scientifically important and the choice of which to attach the label "planet" to is arbitrary.

  But note that Renata is not just saying that the property is important; she is also saying that it is more fundamental for a particular kind of explanation (formation and stability). Dev, on the other hand, is saying that roundness is important for geological explanations. So they are emphasizing different explanatory projects.

  **Is the dispute merely verbal?**

  Following Chalmers, we can ask: do Renata and Dev agree on all the non-linguistic facts? They seem to agree on:

  - Pluto is round, geologically active, and has an atmosphere (and other intrinsic properties).
  - Pluto has not cleared its neighborhood (extrinsic property).
  - Both properties (roundness and having cleared the neighborhood) support scientific generalizations.

  But they disagree about which property should be the defining one for the term "planet". This suggests that the dispute is about the meaning of the word "planet". However, Renata in move (3) is trying to show that it is not arbitrary because one property does more explanatory work. But Dev in move (4) counters that both do important work, just in different domains.

  Therefore, we might see that the dispute is not purely verbal in the sense that it is about which scientific project (orbital dynamics vs. planetary geology) should take precedence in defining a term that is used across both. But at the same time, it is not a dispute about the world (they agree on the facts about Pluto and the properties) but about how we should use the word "planet" in light of these different scientific interests.

  **Is there an unhappy-faced verdict?**

  Karen Bennett's unhappy-faced verdict might apply here. She might say that there is no fact of the matter about which property is the "correct" one to use for the definition of "planet". The concept of a planet might not have a perfectly joint-carving essence. The term "planet" is a human concept that has evolved and might be used for different purposes in different contexts. Thus, we might have to accept that the term is ambiguous and that the dispute is not resolvable by discovering some further fact.

  **Overall Verdict:**

  The dispute is not purely verbal because the choice of definition has implications for scientific classification and which generalizations are highlighted. However, it is also not fully substantive because there is no objective fact about which scientific project (dynamics vs. geology) is more important. Both properties are real and both are scientifically significant. Therefore, we might conclude that the dispute is not merely verbal but also not substantive in the way that a dispute about, say, the mass of Pluto would be.

  But note: Renata and Dev are not disagreeing about the facts of Pluto, but about which facts should be definitional. This is a matter of convention, but one that is informed by scientific utility. In that sense, it is a substantive dispute about how we should categorize objects for scientific purposes, but it is not a dispute about the physical world per se.

  However, following the philosophical references, I lean towards the view that once we have fixed the non-linguistic facts, the question of which word to use is verbal. But Renata's point in (3) complicates this because she argues that the choice of definition affects the explanatory power of our theories. This might make the dispute substantive in a pragmatic sense.

  But Dev's point in (4) is that both definitions have explanatory power. Therefore, the choice might be pragmatic and context-dependent. In that case, the dispute about the word "planet" is verbal because it can be resolved by stipulating which context we are in (e.g., in dynamical contexts, we use the IAU definition, and in geological contexts, we might use a different one). But the disputants are arguing about a universal definition.

  Given that both properties are important and that the term "planet" has been used in different ways historically and in different subfields, it might be that the dispute is unresolvable because there is no one right answer. This would be an unhappy-faced verdict.

  However, the question asks for a verdict in the format: \verdict{verbal}, \verdict{substantive}, or \verdict{unresolved}. 

  I think the best categorization is that the dispute is **verbal** because the disagreement is about the meaning of the word "planet" and not about the non-linguistic facts. Both parties agree on the properties of Pluto and the solar system. They only disagree on which set of properties should be called "planet". This fits Hirsch's view. Renata's attempt to block the verbal diagnosis by appealing to explanatory power does not entirely succeed because Dev can argue that both properties are explanatory in their own domains, and the choice of which domain should dictate the term is arbitrary. Therefore, the dispute is merely about words.

  But note: the IAU definition was an attempt to standardize the term for astronomical purposes. In that context, the dynamicists' perspective might be more relevant. However, the question is about the nature of the dispute between Renata and Dev, who are each arguing for their own perspective.

  Given the above, I conclude:

  \verdict{verbal}
