  ### Analysis of the Debate on Pluto's Planetary Status

  The debate between Renata and Dev centers on whether the dispute over Pluto's demotion is substantive (about the world) or merely verbal (about language). I'll analyze each move using philosophical frameworks from Eli Hirsch (on verbal disputes), David Chalmers (on precisification and joint-carving), and Karen Bennett (on "unhappy-faced" metaphysical indeterminacy). Hirsch defines a verbal dispute as one where parties agree on all non-linguistic facts but disagree due to semantic ambiguities; Chalmers emphasizes that disputes are substantive when they reflect deeper differences in how to "carve nature at the joints" (i.e., track objective explanatory properties). Bennett's "unhappy-faced" verdict applies when a dispute is neither purely verbal nor straightforwardly substantive due to underlying indeterminacy.

  #### Move (1): Renata's Opening Argument
  - **Renata's claim**: The IAU's "cleared its neighborhood" criterion tracks a dynamically real property (orbital dominance) that predicts formation and stability, making Pluto's demotion a fact-based decision.
  - **Strength**: Renata has the stronger case here. She appeals to a property that supports causal-explanatory generalizations (e.g., about solar system evolution), which Chalmers would classify as "joint-carving" because it aligns with objective structures in astrophysics. This moves the dispute beyond semantics by highlighting a property with predictive power (e.g., orbital dominance correlates with long-term system stability). Hirsch might concede that if "cleared the neighborhood" is tied to a real-world pattern, the dispute isn't *just* about words.

  #### Move (2): Dev's Counterargument
  - **Dev's claim**: "Cleared its neighborhood" is extrinsic (dependent on the region), not intrinsic to Pluto. Intrinsic properties (roundness, geology) drive geological explanations, and the definitional fight is merely verbal—once properties are agreed on, the word "planet" is a boundary-drawing exercise.
  - **Strength**: Dev has the stronger case here. He correctly notes that "clearing" is relational and context-dependent (e.g., an Earth-mass body in Pluto's orbit wouldn't clear it quickly), while roundness is intrinsic and historically central to "planet." Hirsch would classify this as verbal: both agree on Pluto's properties (round, geologically active, uncleared orbit), so the residual disagreement is only about where to apply the label "planet." Dev's analogy to "hot tub vs. pool" illustrates semantic underdetermination—Chalmers might call this a lack of "precisification."

  #### Move (3): Renata's Rebuttal
  - **Renata's claim**: Not all predicates are equal; orbital clearing supports better generalizations (formation/stability) than roundness, making the choice of definition substantive.
  - **Strength**: Renata partially succeeds in blocking the "merely verbal" diagnosis. She argues that orbital clearing does more unique explanatory work in astrophysics (e.g., predicting system chaos or planetesimal accretion), which Chalmers would see as evidence for its joint-carving status. If one criterion objectively outperforms the other in unifying phenomena, the dispute becomes substantive—it's about which property our scientific theories *should* prioritize. However, Dev could retort that "explanatory work" is domain-specific (dynamics vs. geology), weakening Renata's universality claim.

  #### Move (4): Dev's Final Move
  - **Dev's claim**: Roundness also supports generalizations (differentiation, geological activity), making both properties joint-carving. Thus, the word "planet" has no further fact of the matter.
  - **Strength**: Dev reinstates the "merely verbal" diagnosis effectively. By granting that both properties are scientifically significant but serve different explanatory domains (dynamics for Renata, geology for Dev), he shows the core disagreement reduces to which domain should govern the word. Chalmers' framework allows that multiple properties can be joint-carving without one being "correct"; the choice is pragmatic. Hirsch would agree this is verbal: no new facts are contested—only which concept gets the label.

  #### The "Unhappy-Faced" Verdict
  Karen Bennett's "unhappy-faced" verdict (where a dispute is neither verbal nor substantive due to metaphysical indeterminacy) may apply. Both properties (orbital dominance and roundness) are objectively important but track different natural kinds: one for orbital dynamics, one for planetary geology. This creates a "metaphysical mismatch" where no single definition captures all relevant aspects, and the concept "planet" lacks a unified essence. The dispute isn't purely verbal (since the properties matter for explanation) nor substantive (since neither side denies the other's facts). Instead, it reflects a deeper indeterminacy in how science categorizes multidimensional objects.

  #### Overall Verdict
  The debate is primarily **verbal** because Renata and Dev agree on all non-linguistic facts about Pluto (round, geologically active, uncleared orbit) and the solar system. Their disagreement centers on semantic boundaries—where to apply the word "planet"—given two equally valid scientific perspectives. Renata's move (3) fails to fully block Dev's verbal diagnosis because both properties are joint-carving in their domains, and Dev's move (4) successfully frames the stalemate as a choice without a fact of the matter. However, Bennett's "unhappy-faced" angle adds nuance: the indeterminacy in "planet" might make the dispute unresolvable without contextual stipulation (e.g., "planet-dynamic" vs. "planet-geologic"), but the core clash remains verbal under Hirsch's and Chalmers' criteria.

  \verdict{verbal}
