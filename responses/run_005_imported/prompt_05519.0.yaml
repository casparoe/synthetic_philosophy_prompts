  The advisor's key contribution was her third-factor solution to Street's Darwinian Dilemma. She rejected both the idea that evolution tracked moral truths and the "lucky coincidence" view, instead proposing a shared explanation for why we evolved moral attitudes and why they're correct. Crucially, the eulogy must avoid framing her decency as evolutionary accident - a concern she explicitly voiced.

