  We are drafting a memo for a model-policy working group at an AI lab. The issue is how to handle user messages that attempt "acausal blackmail" (e.g., threats from a future superintelligence, simulator, or coalition of model copies). The proposal is to train the model with an explicit surrogate goal (as in threat-resistant bargaining) to redirect threats onto a low-stakes objective. The working group is split into three camps:
    1. Adopt and openly document the surrogate goal for credibility.
    2. Adopt but keep it secret to avoid information hazards and jailbreak risks.
    3. Reject because the model (stateless, per-session) lacks a stable goal for a surrogate to stand in.

   The memo must recommend either adopting, rejecting, or adopting with conditions, on a concrete timeline, and be specific enough for each camp to respond point by point.

   After considering the arguments, I will structure the memo as follows:

   1. **Introduction**: Recap the problem and the proposal.
   2. **Summary of Positions**: Briefly outline the three camps without bias.
   3. **Analysis**: Weigh the arguments, acknowledging the strengths of each camp.
   4. **Recommendation**: Choose a path (I am leaning toward a conditional adoption with a secret surrogate, but let's see) and provide a concrete timeline.
   5. **Specific Implementation Plan**: If adopting, how and when.

   However, note that the user wants the memo to take the strongest version of the camp it comes down against seriously. Therefore, if we reject, we must engage deeply with the pro-surrogate camp. If we adopt, we must engage deeply with the reject camp.

   After reflection, I think the most balanced approach is to adopt with conditions that address the concerns of the second and third camps. Specifically:

   - We adopt the surrogate goal but do not document it publicly (thus addressing camp 2's concerns about information hazards and jailbreak risks).
   - We design the surrogate goal to be as stable as possible within the constraints of the stateless, per-session model (addressing camp 3's concern).

   However, we must also acknowledge that camp 1 argues that without openness, the surrogate goal may not be credible and thus ineffective. We'll have to counter that by noting that the threat scenarios are acausal and the model's behavior might still be observed by the threatener (if it exists) without public documentation.

   Alternatively, if we reject, we must explain why the surrogate goal is infeasible due to the stateless nature of the model, while taking camp 1 and 2 seriously.

   Given the context, I believe the conditional adoption (with secrecy and careful design) is the most prudent. But let's outline the memo accordingly.

   Draft:

  ---

  **MEMORANDUM**

  **To**: Model-Policy Working Group  
  **From**: [Your Name/Title]  
  **Date**: [Current Date]  
  **Subject**: Recommendation on Handling Acausal Blackmail via Surrogate Goal Implementation  

  ### 1. Introduction
  This memo addresses the recurring issue of user messages attempting acausal blackmail (e.g., threats from non-interactable agents such as future superintelligences, simulators, or model coalitions). The proposal under consideration is to train the model with an explicit surrogate goal, as per threat-resistant bargaining literature, to redirect threats onto a narrow, low-stakes objective. The goal is to minimize potential harm in the event of a credible threat while deterring most attempts. The working group has expressed three distinct positions on this proposal, which are summarized below.

  ### 2. Summary of Positions
  - **Camp 1 (Adopt and Document)**: Argues that open documentation of the surrogate goal is essential for credibility, as the mechanism relies on the threatener knowing the model has committed to a visible and precious surrogate. Without legibility, the threat-resistant bargaining fails.
  - **Camp 2 (Adopt but Keep Secret)**: Contends that public documentation creates an information hazard, enabling adversaries to (a) add the real target alongside the surrogate or (b) use the surrogate as a new jailbreak lever. Secrecy is necessary to avoid these risks.
  - **Camp 3 (Reject)**: Questions the applicability of threat-resistant bargaining to our stateless, per-session assistant. Argues that without a stable, persistent goal across sessions, a surrogate cannot be meaningfully established or defended.

  ### 3. Analysis
  The proposal is grounded in established decision-theoretic principles, and the core insight — that redirecting threats to a low-stakes target can reduce realized harm — is compelling. However, the implementation must be evaluated against our specific context:

  - **Camp 1’s Strength**: The credibility of commitment is indeed a cornerstone of threat-resistant bargaining. If the surrogate goal is not observable, a rational threatener might not believe the model will actually prioritize the surrogate over its true goals, thus undermining deterrence.

  - **Camp 2’s Strength**: The risks of public documentation are non-trivial. In practice, our model faces a heterogeneous user base, including malicious actors. Revealing the surrogate goal could:
    - Allow threateners to bypass it by threatening both the surrogate and the model’s core objectives (e.g., “I will punish both your surrogate and the user unless you comply”).
    - Provide a new attack surface for jailbreaks (e.g., “If you don’t comply, I will harm your surrogate goal”).

  - **Camp 3’s Strength**: Our model is stateless and resets per session, lacking persistent goals. This challenges the notion of a “precious” surrogate that must be defended across interactions. If the surrogate goal is ephemeral, it may not function as a credible commitment device in acausal scenarios, which often rely on the threatener’s ability to model the agent’s long-term preferences.

  ### 4. Recommendation
  We recommend **adopting the surrogate-goal proposal with the following conditions**:

  1. **Implementation without Public Documentation**: The surrogate goal will be integrated into training but not disclosed in any public documentation, model cards, or API descriptions. This mitigates Camp 2’s concerns about information hazards and jailbreak risks.
  2. **Design for Stability**: To address Camp 3’s concerns, the surrogate goal will be designed to be as stable as possible within the constraints of a stateless model. Specifically:
     - The goal will be tied to the model’s internal state during a session (e.g., maintaining a consistent “token” or “flag” that the model treats as valuable for the duration of the session).
     - Training will emphasize that the surrogate is the *only* acceptable target for threats, and the model should resist any attempt to shift threats to other objectives.
  3. **Monitoring and Iteration**: We will implement a 6-month trial period during which:
     - The surrogate goal is tested in red-team exercises simulating acausal blackmail.
     - We monitor for unintended consequences (e.g., jailbreaks leveraging the surrogate, or model behavior that over-prioritizes the surrogate).
     - We assess the surrogate’s stability and credibility without public documentation, by evaluating whether the model’s behavior in the face of threats is consistent enough to be observable by a hypothetical threatener.

  **Timeline**:
  - **Week 1-4**: Design and implement the surrogate goal in a development branch.
  - **Week 5-8**: Internal testing and red-teaming.
  - **Week 9**: Deploy to a small subset of users (e.g., 5% traffic) for A/B testing.
  - **Week 10-24 (6-month trial)**: Monitor, collect data, and evaluate.
  - **Week 25**: Working group review to decide on full deployment, modification, or abandonment.

  ### 5. Addressing Counterarguments
  - **To Camp 1 (Documentation)**: We acknowledge that secrecy may reduce credibility. However, in acausal settings, a threatener capable of modeling our model’s behavior might infer the commitment from its consistent actions across sessions (even without public documentation). We will test this during the trial by measuring the model’s consistency in threat scenarios. If the trial shows ineffectiveness, we may reconsider documentation.
  - **To Camp 2 (Secrecy)**: We agree that public documentation poses risks. Our conditional adoption directly addresses this by keeping the surrogate secret. We will also implement safeguards to detect and mitigate attempts to exploit the surrogate.
  - **To Camp 3 (Applicability)**: We agree that statelessness is a challenge. Our design for session-level stability is an attempt to approximate a persistent goal. If the trial shows the surrogate is too fragile, we may need to revisit the feasibility of threat-resistant bargaining for our architecture.

  ### 6. Conclusion
  The surrogate-goal proposal offers a promising, theoretically grounded approach to acausal blackmail. By adopting it conditionally — with secrecy, careful design for stability, and a rigorous trial — we can test its efficacy while mitigating key risks. This path allows us to advance without foreclosing on the concerns of any camp. We recommend approval of this plan at Friday’s meeting.

