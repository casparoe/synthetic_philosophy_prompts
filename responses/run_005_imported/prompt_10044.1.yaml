   After research, I recall an example from numerical analysis: the computation of the variance.

   There are two common formulas for the variance of a sample:

    Var1 = (sum(x_i^2) - (sum(x_i))^2 / n) / (n-1)

    Var2 = (1/(n-1)) * sum( (x_i - mean)^2 )

   For well-conditioned data (no large cancellation) they agree. But for data where the mean is very large compared to the variance, the first formula suffers from catastrophic cancellation. So for a dataset where all the numbers are around 10^9, but the variance is small (say 1), the first formula might return a negative number (due to rounding errors) and the second might be more stable.

   We have two implementations:

   Implementation A: Uses Var1
   Implementation B: Uses Var2 (or a two-pass algorithm)

   We test with small datasets (n=3: [1,2,3]) and they agree. We test with a larger dataset (n=1000, numbers in [0,100]) and they agree. But then we get a dataset of 1000 numbers, each around 10^9, with a variance of 1. Implementation A returns a negative variance (which is impossible) and implementation B returns approximately 1.

   So they diverge on that input.

   But note: the function is supposed to compute the sample variance. The mathematical definition is Var2. So implementation A is an algebraically equivalent formula but numerically unstable. The developer might have intended the mathematically correct result, so implementation B is correct. But what if the developer used implementation A and didn't know about the instability? Then in all tested cases it worked, but on the new case it fails.

