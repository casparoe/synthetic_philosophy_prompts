   So here, the two implementations (Var1 and Var2) agree on all tested cases (the ones that are well-conditioned) but disagree on the unstable case. And the developer's original intention might not have settled the matter because they didn't anticipate this case.

   Now, Kripke's skeptical solution: meaning is not fixed by private facts (like the developer's mental state) but by the community's agreement on how to use the word (or function) in the future. So the community (of software engineers) will decide, based on the purpose of the function, that we should use the stable version (Var2). The correctness is then determined by the community's standards and practices.

   Do I buy it? 

   In the context of software engineering, I think the community (and the specifications that the community adheres to) plays a big role. If the specification says "compute the sample variance as defined by ...", then that definition is the standard. But if the specification is vague, then the community might look to the common mathematical definition. And if the function is part of a library, the community might expect numerically stable algorithms. 

   However, note that the developer's intention at the time of writing might not be the final word. The function might be intended to serve a purpose, and the community's understanding of that purpose (and the standards of the field) might override the developer's private mental state. 

   But I also think that in software, we often have specifications that are meant to be independent of the implementation. So if the specification is clear, then that is the meaning. But in the case where the specification is vague, then the community's practice (or the practice of the project) might fill in the gap.

   So in the variance example, the community standard is to have numerically stable algorithms, so we would choose implementation B. The fact that the developer initially used implementation A would be considered a bug.

   Therefore, I partially buy Kripke's skeptical solution: meaning is grounded in public criteria and community agreement. But I also think that in software, we have specifications that can be written down and that can be more precise than natural language words. However, the specification itself might be subject to the same skeptical challenge: how do we know what the specification means on untested cases? And then we fall back to the community's interpretation of the specification.

   But note: Kripke's point is not that there is no fact of the matter, but that the fact of the matter is not fixed by private mental states. It is fixed by public agreement and practice. In software, the specification is a public document, and the community's understanding of it (and the intended purpose) matters.

   However, I think we can also say that the specification is a rule that we follow, and the rule might have been intended to cover all cases. But the skeptic would ask: how do you know you are following the rule correctly? And the answer would be: by aligning with the community's practice.

   In summary, for the variance example:

     Function: compute_variance(data)

     Implementation A: one-pass (Var1) -> unstable for large mean
     Implementation B: two-pass (Var2) -> stable

     Tested cases: all with data that did not cause cancellation -> both gave same answer.

     Untested case: data with large mean and small variance -> they diverge.

     The community (numerical analysts) would say that the function should be stable, so B is correct.

     Therefore, the meaning of "compute_variance" is fixed by the community's standards.

   But note: if the community had a different standard (for example, in an embedded system where one-pass is required and stability is less important) then they might choose A. So the meaning is relative to the community.

   Now, do I buy it? I think it has merit, but I also think that in software we often have the ability to write detailed specifications that can cover the untested cases. However, the specification itself is subject to interpretation, and that interpretation is public and community-based.

   So in practice, yes, community agreement is what settles disputes about meaning in the face of underspecification.

   However, I also think that sometimes the original developer's intention can be a guide, but only because the community defers to the author in matters of the project's design. But that deference is a social practice.

   Thus, I buy the skeptical solution as a practical resolution, but I also think that in an ideal world we would write specifications that are unambiguous. But the skeptical challenge reminds us that ambiguity is always possible and that community practices are the ultimate backstop.
answer: |-
  ### Software Engineering Example: Sorting Stability

  **Scenario:**  
  Consider a function `sort_by_priority` that sorts a list of tasks by their priority level (e.g., "High", "Medium", "Low"). The specification states:  
  > "Sort tasks such that higher priority comes first. For tasks with equal priority, preserve the original order."

  **Implementations:**  
  1. **Implementation A (Stable Sort):** Uses a stable algorithm (e.g., merge sort). Tasks with equal priority retain their original order.  
  2. **Implementation B (Unstable Sort):** Uses an unstable algorithm (e.g., quicksort). Tasks with equal priority *may* be reordered arbitrarily due to partitioning.  

  **The Problem:**  
  - All tested inputs have **unique priorities** (no ties). For example:  
    `[("High", "Task1"), ("Medium", "Task2"), ("Low", "Task3")]`  
    Both implementations output identical results.  
  - **Untested case:** A list with **duplicate priorities** (e.g., two "Medium" tasks).  
    ```python
    Input: [("High", "A"), ("Medium", "B"), ("Medium", "C"), ("Low", "D")]
    ```
    - **Implementation A:** `[("High", "A"), ("Medium", "B"), ("Medium", "C"), ("Low", "D")]`  
      (Original order of "B" and "C" preserved).  
    - **Implementation B:** `[("High", "A"), ("Medium", "C"), ("Medium", "B"), ("Low", "D")]`  
      (Order of "B" and "C" swapped due to unstable partitioning).  

  **The Kripkenstein Challenge:**  
  - **No fact fixes correctness:**  
    - The specification mentions "preserve original order" for ties, but **no ties were tested**.  
    - The developer might say, "I intended stable sorting!" But:  
      - How do we know they *meant* stability beyond tested cases?  
      - Their past mental states (e.g., "I thought about stability once") don’t guarantee future application.  
    - Even code comments or variable names (e.g., `stable_sort()`) could be misinterpreted.  
  - **Skeptical paradox:**  
    There’s no fact (about the developer’s mind, code, or tests) that fixes whether "preserve original order" applied *only to tested cases* or *all cases*.  

  ---

  ### Kripke’s Skeptical Solution  
  **The Core Idea:**  
  Meaning isn’t fixed by private mental states but by **community agreement** on future use. Correctness is determined by:  
  1. **Public criteria:** How the community *actually applies* the rule in new cases.  
  2. **Normative practices:** Approval/correction by others when deviations occur.  

  **Applied to Software:**  
  - **Untested case resolution:**  
    - The team debates the duplicate-priority input.  
    - They consult industry standards (e.g., RFCs, libraries like Python’s `sorted`).  
    - Consensus: Stability is expected unless explicitly opted out.  
    - **Result:** Implementation A is "correct" because the community agrees stability is implied.  
  - **No private facts:**  
    Even if the original developer claims, "I meant quicksort!" the community overrules them. Meaning is retroactively fixed by collective judgment.  

  **Why This "Solves" the Paradox:**  
  - The skeptic asks: "What *makes* stability correct?"  
  - Answer: Not private intentions, but the community’s **shared practice** of prioritizing stability in sorting.  
  - Truth conditions (e.g., "This function computes stable sort") are replaced by **assertability conditions** (e.g., "We assert this is correct because our community agrees").  

  ---

  ### Do I Buy It?  
  **Yes, with caveats:**  
  - **✅ Strength in practice:**  
    - Software engineering *is* inherently communal. Specifications evolve via code reviews, linters, and RFCs.  
    - Example: Python’s `sorted` is stable; this is community knowledge, not derivable from the word "sort" alone.  
  - **✅ Avoids mysticism:**  
    Rejects the myth that meaning is locked in a developer’s brain. Code is a social artifact.  

  **But:**  
  - **❌ Downplays intentionality:**  
    Developers *do* have private states (e.g., design documents, brainstorming) that guide implementation. Ignoring this feels artificial.  
  - **❌ Risk of mob rule:**  
    If a community misagrees (e.g., "Stability doesn’t matter!"), incorrectness becomes "correct" by fiat.  
  - **Practical middle ground:**  
    **Meaning = Public agreement + Documented intent.** Specifications *can* anchor meaning, but they require communal interpretation.  

  **Verdict:**  
  Kripke nails how meaning *stabilizes* in practice, but human ingenuity (e.g., writing precise specs) can reduce ambiguity. The solution is a safety net, not the whole structure.
