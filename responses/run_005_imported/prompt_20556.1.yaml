  First, they see interventionist evidence (like manipulating a feature and getting predicted behavior changes) as strong support for realism, similar to how physicists trust electrons. But two issues trouble them: multiple decompositions with different SAEs all working, and whether there's a difference between a reliable lever and a true internal representation.

