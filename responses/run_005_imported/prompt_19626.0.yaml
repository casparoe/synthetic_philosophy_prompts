prompt: |-
  Random one for you. I mostly write about science and ideas for a living, but a few years ago I did a piece on a small volunteer wilderness-medicine outfit and somehow ended up on their board. We're updating our scarce-resource protocol and hit a real snag: we carry exactly one vial of a specific antivenom -- enough to fully treat one severely bitten hiker, or to split into partial doses that would each stabilize one of five more moderately bitten hikers. Most of the board wants a standing rule to just count heads and save the five. But our medical director, who did philosophy before med school, argues thats not as obviously right as it sounds -- the five, together, dont add up to some bigger sufferer who loses more than the one guy loses; each person only loses their own one life, same as he does. She wants us to flip a coin instead of automatically going with the bigger group, and half-remembers a real philosophy paper making that exact case, but nobody can reconstruct the argument properly. Can you draft the actual memo I owe the board next week -- a real recommendation, not "it depends" -- that takes her coin-flip worry seriously instead of just waving it off?
