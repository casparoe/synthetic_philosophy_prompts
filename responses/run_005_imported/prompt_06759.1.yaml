answer: |-
  The fluorescent hum of the lab felt like a physical pressure against Alex’s temples. Dr. Vance’s voice was a distant drone, explaining the procedure *again* to the observing grad students. Alex focused on the central fixation point, the world beyond it partitioned by the screen. Left field. Right field. Separate worlds.

  A flash. To the left.

  *(Green. Shiny. Stem. Leaf. Water droplet. Good. Thirst. Reach.)*

  Alex’s left hand moved, smooth and decisive, picking up the glass of water from the tray beside the chair. The cool condensation felt right against the palm.

  "Why did you pick up the water, Alex?" Vance asked, leaning forward, pen poised.

  Alex’s mouth opened, the voice confident, smooth. "Oh, just felt a bit parched. Dry air in here, you know?" A perfectly reasonable explanation. Fabricated entirely by the hemisphere seeing only the blank screen where the water glass had been.

  Inside, the silent observer recoiled.

  *(Not thirst. Green. Plant. Needed water. Simple.)*

  Later, at home. The familiar ritual of getting ready for bed. Alex stood before the mirror, right hand working the buttons of the pajama top. Down the right side, neat and methodical.

  *(Tired. Fabric soft. Bed soon. Good.)*

  Then, the left hand moved. Fingers, independent and insistent, found the top button Alex’s right hand had just fastened. A flick. Undone.

  *(Too tight. Choking. Air.)*

  Alex’s right hand paused. A frown creased their forehead. The right hand moved again, re-fastening the button.

  *(Silly. Must have missed. Secure now.)*

  The left hand struck back. Undid it. Faster this time.

  *(NO. Tight! Wrong!)*

  Alex stared at their reflection. The right hand was moving to re-button, the left hand darting up to intercept it. Fingers tangled. A silent struggle played out on the fabric over Alex’s chest.

  "Why…?" Alex whispered aloud, confusion warring with a strange detachment. The voice, the familiar "I," searched for coherence. "These buttons are just… fiddly tonight. Annoying." The explanation landed flat, even to Alex’s own ears. It didn’t *feel* like fiddly buttons. It felt like… opposition.

  The right hand finally won, pinning the left wrist momentarily, forcing the button closed. A flush of victory, quickly rationalized. *(There. Fixed. Just needed focus.)*

  But the silent observer seethed.

  *(Trapped. Wrong. Not heard. Always wrong.)*

  Morning. Coffee. Alex’s right hand poured the steaming liquid into a mug. The left hand rested on the counter, fingers drumming a silent, frantic rhythm against the cool granite.

  *(Too full. Hot. Spill. Danger.)*

  Alex lifted the mug. The coffee sloshed, dangerously close to the rim. The left hand jerked forward instinctively, knocking Alex’s elbow.

  Hot liquid splashed onto skin. Alex yelped, dropping the mug. It shattered on the floor.

  "Damn it!" The voice was sharp, annoyed. "Clumsy! Must have tripped over my own feet." Alex bent, right hand reaching for a towel to mop the scalding patch on their forearm.

  The silent observer screamed into the void.

  *(TOLD YOU! HOT! SPILL! NOT CLUMSY! SAVE!)*

  It wasn’t anger, not exactly. It was a raw, wordless *knowing*. A certainty about the state of the world – the overfull cup, the constricting button, the green plant needing water – that existed pure and unmediated. It was intention thwarted, action misinterpreted, need ignored. It was the visceral understanding of heat *before* the burn, the claustrophobia of tight fabric *before* the rationalization. It was the body's truth, shouted into a soundproof room.

  The most profound horror wasn’t the conflict. It was the seamless cover-up.

  Later, walking down the street, a sudden impulse surged from the silenced side. A flash of red seen peripherally in the left field – a balloon? A sign? Danger? The left leg stopped dead. Alex stumbled.

  *(STOP! Look!)*

  The voice, unfazed, instantly supplied: "Whoa! Nearly turned my ankle on that crack. Pavement’s terrible here." Alex glanced down at the smooth, unbroken concrete, the explanation already hardening into accepted fact, burying the silent, urgent warning beneath layers of plausible fiction.

  At the park, Alex sat on a bench. The right hand idly sketched patterns in a notebook. The left hand lay in Alex’s lap, palm upturned. Sunlight warmed the skin.

  *(Sun. Warm. Good. Quiet. Peace?)*

  A bird shot across the lower left visual field. Fast. Startling. The left hand flinched upwards.

  *(Movement! Threat? Flight!)*

  Alex’s head turned right, following the voice’s narrative gaze. "Huh. Thought I heard a dog bark." The sketch continued, the flinch already assimilated, explained away. The silent observer settled back, the brief moment of shared warmth fractured, replaced by the familiar, isolating hum of being constantly overwritten.

  The door of Alex’s apartment felt heavy. Keys jingled in the right hand. The silent side, exhausted by the constant dissonance, simply observed the familiar lock.

  *(Key. Metal. Turn. Home. Rest.)*

  But as the key turned and the door swung inward, revealing the dim hallway, a different impulse surged from the silenced depths. Not rational. Primal. A wave of claustrophobia, a desperate need for *not this*, for space, for escape from the relentless internal narration that defined and confined everything.

  *(OUT. NOW. MUST GO.)*

  The left hand shot out. Not for the key. Not for the light switch. It slammed against the door frame, palm flat, stopping Alex’s forward motion dead. Then, fingers curled, gripping the edge, pulling *backwards* with surprising strength.

  Alex gasped, physically hauled back a step onto the landing. "What the—?"

  The voice scrambled, smooth facade cracking for a microsecond. Eyes darted, seeking input, finding only the empty hallway and the open door. "I… I just remembered! The mail! Forgot to check the mailbox!" It sounded weak, even to Alex. The body was poised on the threshold, one hemisphere pulling in, the other pulling out, a physical standoff.

  The silent observer wasn't thinking about mail. It felt the cool evening air on the landing, the vastness of the sky compared to the hallway’s confines. It felt a desperate, wordless urge for *distance* from the constant story, a need to exist, just for a moment, without being explained.

  *(Outside. Air. Free. No words.)*

  Alex took a shaky breath. The right hand, still holding the keys, tightened. The voice reasserted itself, smoother now, layering calm over the unexplained retreat. "Yeah, silly me. Mailbox. Be right back." Alex stepped back fully onto the landing, pulling the door almost closed, leaving it on the latch.

  The silent side didn't care about the mail. It felt the open air, the quiet of the landing. It felt the small victory of *not entering*, of forcing a pause in the narrative machine. It wasn't freedom, not really. It was a gasp of breath in a room that was slowly, convincingly, being described as suffocation. The story would resume – the mail collected, the door reopened, the reasons given – but for a fragile moment, the silent intent had carved out a sliver of space where the only reality was the cool brick against Alex's back and the vast, uninterpreted sky above. The "I" stood on the landing, breathing air it insisted it had only stepped out for, while half of its existence silently screamed for a reason to stay outside that the talking half would never, could never, understand. The feeling wasn't of two people. It was of one person perpetually, unknowingly, betraying themselves.
