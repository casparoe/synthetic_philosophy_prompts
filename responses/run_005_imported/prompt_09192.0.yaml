prompt: |-
  I'm a poli theory PhD student and this semester's seminar on medieval political thought spent two whole sessions on Aquinas's writings on tyrannicide, which turns out to be way messier than the "aquinas thought killing tyrants was sometimes fine" one-liner you get in undergrad. If I'm remembering the seminar discussion right, in his commentary on the Sentences he splits tyrants into two kinds: a tyrant "by defect of title" (a straight-up usurper with no legitimate claim to rule at all) versus a tyrant "by way of exercise" (someone who holds power legitimately but abuses it once in office). For the first kind, he seems fine with a private citizen killing the guy if there's no superior around to appeal to — he even cites Ehud assassinating Eglon in Judges as a praiseworthy example. For the second kind though, private individuals are NOT supposed to take matters into their own hands; it has to go through the community or some higher public authority. Then in De Regimine Principum he gets even more skittish about tyrannicide in general, warning that if you let private people decide for themselves when a ruler is "tyrant enough" to kill, ambitious men will just assassinate perfectly decent kings under that pretext, so mostly his advice is: endure it, pray, and wait for the legitimate authority (or God) to sort it out.

  What me and my study group can't agree on is how this framework would handle a case Aquinas obviously never had in mind: a president who wins a genuinely free election (so, clean title, zero usurpation by his lights) and then, once installed, hollows out the courts, jails independent journalists, and cancels the next election to stay in power indefinitely — with no pope or emperor above him to appeal to, and with the domestic bodies that would normally count as "the public authority" (courts, legislature, electoral commission) already captured by him. Based on the actual reasoning Aquinas gives rather than the pop-summary version: would he really be committed to saying this guy is still just a "tyrant by exercise," so that no private person — not a lone assassin, not a general plotting a coup, not a foreign government — may licitly move against him on their own initiative? Or does converting a legitimate title into something you keep only through ongoing fraud and coercion push him back into "defect of title" territory in Aquinas's eyes? And seperately, does Aquinas's own idea that "the community" can depose a ruler it originally appointed give any principled room for something like a mass popular uprising, as opposed to a single private actor, even once the formal institutions are gone? I'd like an actual reconstruction of how his categories and reasons bear on this, not just an "Aquinas allowed some resistance to tyranny" gloss.
reasoning: |-
  Okay, the user is a political theory PhD student who's deep into Aquinas's views on tyrannicide. They've had seminar discussions and study group debates, so they need a nuanced analysis beyond undergrad summaries. The core issue is applying Aquinas's medieval framework to a modern scenario: a legitimately elected president who becomes a tyrant by dismantling institutions and canceling elections. 

  Hmm, the user's scenario is clever because it straddles Aquinas's two tyranny types. The president starts with perfect title (election) but then corrupts the system so thoroughly that no "superior authority" exists to appeal to. The study group seems stuck on whether this hybrid case flips into "defect of title" territory. 

  First, I should reconstruct Aquinas's actual reasoning, not just conclusions. In Sentences, he's surprisingly permissive about killing usurpers (title defect) but warns against vigilante justice for abusive rulers (exercise defect). De Regimine shows his fear of chaos—he'd rather tolerate tyranny than risk anarchic assassinations. 

  For the modern case: Aquinas would likely see the president as still a "tyrant by exercise" initially. Title was valid at inception. But when the ruler destroys mechanisms for lawful removal—courts, elections, legislature—that might trigger Aquinas's "no superior to appeal to" exception from Sentences. The key is whether institutional annihilation makes the ruler functionally equivalent to a usurper. 

  On "community" action: Aquinas's "public authority" isn't just formal bodies. If institutions are captured, the community itself (as original sovereign) could licitly resist—but only collectively, not via lone actors. A mass uprising might qualify; a general's coup wouldn't. Foreign intervention? Aquinas gives no basis for that. 

  The user wants strict textual reasoning, so I'll avoid modern parallels. Focus on how Aquinas's principles (title validity, common good, resistance hierarchy) interact when institutions vanish. Highlight that his "community" concept is vague—is "the people" a metaphysical entity or actionable body? 

  Biggest tension: Aquinas prioritizes order but admits tyranny destroys order. His framework strains when the ruler weaponizes legitimacy to entrench illegitimacy. That's where the study group's disagreement lies. I'll argue the canceled election is the tipping point: it severs ongoing title legitimacy, pushing the ruler into usurper status retroactively.
answer: |-
  You've hit on a crucial tension in Aquinas's thought, and your scenario perfectly exposes the limitations and internal stresses within his framework. Let's break it down systematically, reconstructing Aquinas's reasoning and applying it to your hypothetical:

  **1. Core Aquinas Framework (Recap with Nuance):**
  *   **Tyrant by Defect of Title (Usurper):** No legitimate claim. *Private individuals* can licitly kill such a tyrant *if* there is "no possibility of recourse to a superior" (*Sentences* II, dist. 44, q. 2, a. 2). Ehud is cited approvingly because there was no higher Israelite/Judicial authority above Ehud to appeal to against Eglon (a foreign oppressor).
  *   **Tyrant by Exercise (Abuser of Legitimate Power):** Possesses valid title initially. *Private individuals absolutely cannot licitly kill or depose this ruler.* Resistance must come from "public authority" (*publica auctoritas*). This could be:
      *   A superior temporal authority (e.g., Emperor over a King, Pope in some interpretations - though Aquinas is cautious here).
      *   **The community itself (*multitudo*) that originally granted him power** (This is CRITICAL for your scenario - *De Regno* I, 6). The community acts *as* the public authority in deposing the ruler *it* instituted.
  *   **De Regimine's Caution:** Aquinas emphasizes the dangers of vigilantism and pretextual rebellion (*De Regimine* I, 6). Removing even a tyrant-by-exercise is perilous and often leads to worse outcomes. Endurance and divine intervention are preferred unless the tyranny becomes utterly intolerable *and* lawful action is possible.

  **2. Applying the Framework to Your Scenario:**
  *   **Initial Title:** Unequivocally legitimate ("genuinely free election"). This places him firmly in the "Tyrant by Exercise" category *at the moment of inauguration*. Title is clean.
  *   **Actions:** Hollowing out courts, jailing journalists, canceling elections. This is the *exercise* of tyranny. It does not, *by itself*, retroactively invalidate the original title. Aquinas doesn't have a clear mechanism for title *degradation* based on subsequent actions alone. The title was valid *then*; the actions are abusive *now*.
  *   **Capture of Institutions:** This eliminates the *normal* channels of "public authority" (courts, legislature, electoral commission). Aquinas *explicitly* anticipates this problem: "If to provide itself with a king belongs to the right of a given multitude, it is not unjust that the king be deposed or have his power restricted by that same multitude if, becoming a tyrant, he abuses the royal power" (*De Regno* I, 6). The key is the **original grantor**: the community (*multitudo*).

  **3. Answering Your Specific Questions:**

  *   **Is he still just a "Tyrant by Exercise"?**
      *   **Textually:** Yes, according to Aquinas's categories. The *origin* of power was legitimate (election). The subsequent abuse, however extreme, doesn't formally change the *category* of tyranny in his schema. He remains a tyrant "by way of exercise."
      *   **Consequence:** Therefore, **no private person (lone assassin, general, foreign government) may licitly move against him on their own initiative.** Aquinas's reasoning is clear and consistent on this point for tyrants-by-exercise:
          *   Danger of pretext and chaos (*De Regimine*).
          *   Only "public authority" has the right to judge and depose.
          *   Private action usurps this public judgment.

  *   **Does converting legitimate title into fraud/coercion push him into "defect of title"?**
      *   **Aquinas's Explicit Framework:** No. "Defect of title" is about the *origin* of rule: usurpation, conquest without just cause, etc. Your ruler's title *originated* justly. The subsequent fraud and coercion pertain to the *exercise* of rule and the *maintenance* of power, not the initial acquisition.
      *   **Potential Implicit Argument (Stretching Aquinas):** One *could* argue that by canceling the election and ruling indefinitely through fraud/force, the ruler has effectively *usurped* the *future* authority that rightfully belongs to the people or their next elected representative. He has seized power he has no *ongoing* title to hold. This subtly shifts the focus from initial title to *current* legitimacy. However, Aquinas doesn't develop this concept explicitly. He focuses on the *origin* of the ruler's mandate. **Based strictly on his stated categories and reasoning, the ruler remains a tyrant-by-exercise.**

  *   **Does "the community" (*multitudo*) allow for a mass popular uprising?**
      *   **Yes, and this is Aquinas's prescribed solution for your scenario.** This is the critical escape hatch.
      *   **Reasoning:** The community is the original source of the ruler's authority ("providing itself with a king"). When that ruler becomes a tyrant, the community *as a public body* (not a collection of private individuals) retains the authority to depose him (*De Regno* I, 6).
      *   **Nature of the "Community" Action:**
          *   It is **not** merely the sum of private individuals acting privately. It is the community acting *as a public authority* – the original grantor reclaiming its mandate.
          *   Aquinas likely envisioned this as a somewhat **formal or collective act** (though medieval "formality" could be messy – think baronial revolts or urban communes asserting rights). He doesn't specify mechanics, but the emphasis is on the *source* of authority (the community) acting against the ruler *it* created.
          *   A **mass popular uprising** could *plausibly* be interpreted as the *multitudo* exercising its right as the original public authority, *especially* once formal institutions are captured and non-violent channels are closed. This is distinct from a lone assassin or a general acting on his own (private initiative).
          *   **Not Foreign Governments:** Aquinas provides no basis for foreign intervention against a tyrant-by-exercise. This would be seen as an unjust war of aggression by another *private* power relative to the afflicted community's internal governance.

  **4. Reconstruction & Conclusion:**

  Aquinas's reasoning would lead him to conclude:

  1.  **Categorization:** The ruler is a **Tyrant by Exercise** because his *title* was legitimately acquired via election.
  2.  **Private Action Forbidden:** Therefore, **no private individual (assassin, general, foreign power) has the licit authority to kill or depose him.** This violates the prohibition against private judgment and action against a ruler with legitimate title, risking greater evils.
  3.  **Community Action Permitted (and Necessary):** The licit authority to act resides **solely with the community (*multitudo*) that originally granted him power.** This community acts *as* the required "public authority" (*publica auctoritas*). When formal institutions (courts, legislature) are captured, the community itself *is* the only remaining public authority.
  4.  **Nature of Community Action:** Aquinas doesn't detail the form this action must take. While he might *prefer* a more formal or representative process, his core principle is that the *source of authority* (the community) can revoke the mandate it granted. A **mass popular uprising** aimed explicitly at deposing the tyrant and restoring rightful order **fits within this logic** as the community exercising its inherent public authority. It is fundamentally different from isolated private acts. Endurance and prayer remain options, but intolerable tyranny justifies the community reclaiming its delegated power.
  5.  **The "Title" Question:** Aquinas would *not* recategorize this ruler as a usurper ("defect of title"). The initial title was valid. The ongoing fraud/coercion confirms the *exercise* of tyranny but doesn't retroactively negate the original legitimate acquisition. The solution lies in the community's power of deposition, not redefining the tyrant's category.

  **In essence:** Aquinas *would* condemn lone wolves, coups, and foreign intervention. However, he *would* provide a principled, textually grounded justification for **the community itself, acting collectively as the original sovereign, to rise up and depose the tyrant** once all institutional remedies are destroyed. Your scenario highlights the critical role of the *multitudo* as the ultimate public authority when all else fails, even if Aquinas remains deeply wary of the practical consequences. His framework strains under the weight of total institutional capture, but his core commitment to the community's original grant of authority provides the key to principled resistance.
