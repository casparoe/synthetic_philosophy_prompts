  Here is a rigorously argued dialogue between a present-day Hartian ("H") and Fullerian ("F"), focused solely on applying their respective frameworks to the *Mauerschützen* case without resorting to Radbruch's substantive natural law:

  **Exchange 1: The Core Dispute**
  **H:** The convictions were only possible through retroactive judicial law-making. GDR Border Law § 27 explicitly authorized lethal force against "border violators." The guards acted according to valid, promulgated law at the time. Hart was clear: even morally repugnant law is *law*. To convict requires either a *new* post-reunification statute criminalizing the acts retroactively (my preferred solution, as with the grudge informers), or a judicial fiction pretending § 27 didn’t mean what it plainly said. The courts chose the latter, smuggling in Radbruch under procedural guise.

  **F:** You mischaracterize the legal reality. The issue isn't *just* § 27's repugnance. The GDR regime systematically violated Fuller's principles, crucially the requirement of **congruence** between official action and declared rule. Secret internal directives – the *Schießbefehl* – commanded guards to shoot to kill even unarmed civilians *regardless* of escape risk, directly contradicting the public statute's framing of "extreme measures" as last resort for violent border breaches. This hidden command structure created a fatal disconnect between the law-as-declared and law-as-administered, voiding its claim to legality under Fuller's internal morality.

  **Exchange 2: Addressing Wickedness & Procedural Compliance**
  **H:** Ah, the congruence gambit! But Fuller's principles are purely *procedural*. A system could perfectly satisfy congruence, publicity, generality, etc., while enacting monstrous substantive rules. The *Schießbefehl*, however odious, was *congruent* with itself! Guards received clear, consistent secret orders and followed them. That's congruence between promulgated-to-officials rule and action. Fuller himself conceded his principles could make a system "more efficient for evil." § 27 *was* promulgated, general, non-retroactive (applied prospectively to future escapees), and arguably clear. Its substantive evil doesn't negate its legal validity under positivism – or magically dissolve it via Fuller's criteria alone.

  **F:** You reduce congruence to mere internal bureaucratic consistency. Fuller's point is deeper: congruence requires alignment between the rules presented to the citizenry as governing their conduct and the rules actually enforced *against* them. The public § 27 implied a threshold of threat or violence before lethal force. Citizens crossing quietly posed no such threat. Yet the hidden *Schießbefehl* mandated shooting *them* too. This created a trap – citizens couldn't orient their behavior by the public law because the *real* rule applied to them (shoot on sight) was hidden. This destroys the reciprocity essential for law's existence under Fuller. It wasn't just evil; it was a fraud perpetrated *through* the legal form.

  **Exchange 3: Constancy, Secret Law, and the Nature of "Law"**
  **H:** So now it's a trap? But the core command "Do not cross the border illegally" *was* public and constant. The penalty for violation (potential deadly force) was also publicly known, even if the trigger was secretly lowered. Citizens knew crossing risked death – that was the deterrent's point! Fuller's constancy principle concerns rules changing too frequently for citizens to follow, not the harshness of a stable rule. The secret orders merely detailed enforcement policy for a known prohibition. Positivism distinguishes law from administrative directive. The *Schießbefehl* was an unlawful *order* under GDR *law* (§ 27 implied proportionality), but that doesn't vaporize § 27 itself as valid law. The guards were following valid law as they understood it.

  **F:** You artificially separate the statute from its enforcement mechanism. A rule requiring death for an act posing no physical threat, enforced via secret commands removing officer discretion, fails Fuller's test comprehensively. **Generality** is undermined because the secret order created a hidden, absolute liability rule for a specific class (escapees), contradicting the public statute's implied conditions. **Constancy** is violated not in time, but in substance – the rule citizens faced (death for any crossing) was radically different and more severe than the public text suggested. This isn't mere "harsh application"; it's a systemic, intentional perversion of the legal process itself to disguise state murder as law. Where such pervasive bad faith exists, violating multiple principles in concert, the purported "law" lacks the minimal moral foundation Fuller requires for the label "law" to apply meaningfully. It's not law; it's a deadly charade using legalistic trappings.

  **Exchange 4: The Limits of Formalism and the Charge of Retroactivity**
  **H:** Calling it a "charade" is question-begging moralism disguised as analysis. Your argument relies on importing an unstated substantive judgment – that shooting unarmed civilians is *so* evil – to then declare the procedural flaws fatal to legality. But Fuller's principles don't contain that substantive threshold! A formally perfect system mandating torture would still satisfy your eight principles. The courts *had* to reach outside the GDR's own legal system (via Radbruch) to condemn it. My point stands: convicting the guards required retroactivity. Either openly (a new law) or covertly (reinterpreting § 27 as void *ab initio* based on substantive injustice, smuggled in via procedural critiques that wouldn't normally invalidate the law itself within its system).

  **F:** Not so. I condemn the regime *through* its failure on Fuller's internal criteria, *not* by first judging the substance. The secret orders, creating fatal incongruence and destroying citizen capacity for compliance, are *objective* failures of the enterprise of subjecting human conduct to rules. They turn law into a mere instrument of terror, devoid of the fidelity Fuller sees as necessary for law's existence. The courts didn't need Radbruch's "intolerable contradiction to justice"; they could have found the border regime lacked legal character *because* its internal morality was corrupted by bad faith, secrecy, and the manipulation of rules to entrap citizens. The retroactivity is only apparent if one insists, positivistically, that the GDR's pronouncements were "law" despite failing the functional test of legality. Finding they weren't valid law *at the time* means applying *current* German law to acts that were always criminal under fundamental principles of human dignity inherent in the *Rechtsstaat* concept Germany adopted – a concept Fuller helps define procedurally.

  **H:** And there's the rub. "Fundamental principles of human dignity inherent in the *Rechtsstaat*" is substantive natural law by another name! You've cleverly used Fuller's procedural critique to create a void, but filling it requires Radbruch or something like him. Hart's warning endures: blurring the distinction between law as it is and law as it ought to be, even procedurally, ultimately smuggles in substantive morality. The clean, honest positivist path was a retroactive statute. The courts chose murkier waters, proving Hart's fear that natural law reasoning, however procedurally dressed, leads to ex post facto punishment dressed up as legal discovery.

  ---

  **Key Dialogic Features:**
  1.  **Hartian Focus:** Stresses separation of law/morality, validity of GDR law at the time, retroactivity as the only clean solution, and the compatibility of Fuller's principles with substantive evil.
  2.  **Fullerian Focus:** Relies solely on *The Morality of Law*: Congruence (public law vs. secret enforcement), Constancy (substantive shift via secret rule), Generality undermined by hidden absolute liability, and the destruction of reciprocity/citizen capacity to comply. Avoids invoking substantive justice directly.
  3.  **Engagement:** Each turn directly addresses the prior specific point (secret orders, wicked systems, constancy, retroactivity, the charge of smuggling).
  4.  **No Concessions:** Hartian maintains procedural compliance possible with evil; Fullerian maintains procedural failures are fatal *to legality itself* in this case due to systemic bad faith.
  5.  **Radbruch Avoidance:** Fullerian argues the *procedural* failures void the law, making Radbruch unnecessary. Hartian insists the courts ultimately relied on substantive injustice (Radbruch) disguised as procedural critique.
