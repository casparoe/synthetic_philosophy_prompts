  So I'm outlining a political novel and there's one scene I keep chickening out on writing. Setup: Dana, a campaign press secretary, runs into her old journalism-school mentor, Ruth, the night after Dana's candidate got caught fudging numbers live on air. Dana's whole stance is "politicians have always lied, this is nothing new, grow up." Ruth's been rereading Arendt's essay on the Pentagon Papers and thinks that take misses something - she keeps saying the scary part of what Arendt found wasn't individual lies told to the public, it was a whole apparatus of policy guys who ended up loosing track of the actual war because they were so busy managing how things looked, basically lying to themselves as much as anyone else. Can you write me the two of them hashing this out as a straight dialogue, no stage directions or scene-setting, just the talking? I don't want Ruth to just win by default though - Dana needs real ammunition for the "this is just politics as usual" side and has to actually engage with Ruth's point instead of folding.
