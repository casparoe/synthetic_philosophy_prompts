  Let me recall the standard Dutch book theorem. If credences aren't probabilistic, a bookie can create a set of bets that guarantee loss. The friend dismisses this as hypothetical. But the deeper point is about consistency in evaluating bets as fair. If someone's credences are incoherent, they consider different sets of bets as fair, which leads to a sure loss when combined. It's not about an actual bookie; it's about the internal inconsistency in their judgments. That’s the normative argument—rationality requires consistent evaluations of fairness, and incoherence violates that.

