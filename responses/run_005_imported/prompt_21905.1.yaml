answer: |-
  Your source's unease is profoundly well-founded—this isn't a failure of statistics, but a recognition of its limitations in the face of **deep epistemic uncertainty**. Averaging divergent expert judgments under these conditions risks obscuring critical insights and misrepresenting the nature of the uncertainty. Here's a breakdown of the issues and principled alternatives:

  ### Core Problems with Averaging
  1.  **Loss of Information**: The 5%–65% range signals **fundamental disagreement about how to interpret ambiguous evidence**, not random error. Averaging to ~35% hides this discord, implying a false precision and consensus.
  2.  **Misleading Expected Value (EV)**: EV = Probability × Impact. When probability estimates span an order of magnitude, the EV calculation becomes highly sensitive to the aggregation method. Averaging probabilities *before* calculating EV (P_avg × Impact) yields a different result than averaging individual EVs (which weights outliers more heavily). Neither is "correct" when experts disagree on first principles.
  3.  **Ignoring Meta-Uncertainty**: The spread *itself* is valuable information. Tight clustering (e.g., 28%-32%) suggests shared understanding; wide dispersion (5%-65%) reveals that the proposal ventures into poorly understood territory. This should trigger different scrutiny.
  4.  **Equal Weighting Fallacy**: Averaging assumes all advisors are equally likely to be correct. In reality, under radical uncertainty, some perspectives (e.g., focusing on neglected failure modes) may warrant more weight, even if they appear "pessimistic."

  ### Principled Alternatives for the Committee
  The goal isn't to eliminate disagreement, but to **capture and utilize it meaningfully** in decisions. Here are scalable approaches:

  1.  **Report the Range + Key Rationales**:
      *   **Output**: "Advisors estimate a 5%–65% probability of meaningful risk reduction. The average (35%) is provided for ranking, but the spread indicates fundamental disagreement on the plausibility of this approach's success mechanism."
      *   **Action**: Mandate a brief narrative summary *alongside* the number: *"Why did estimates vary?* E.g., "Optimists focused on [X mechanism]; pessimists doubted [Y assumption] or emphasized [Z alternative failure path]."
      *   **Benefit**: Preserves uncertainty information for decision-makers. A wide spread flags proposals needing extra scrutiny or hedging.

  2.  **Use Uncertainty-Adjusted Expected Value**:
      *   **Method**: Calculate EV for *each advisor's estimate*, then report the **median EV** (more robust to outliers) and the **interquartile range (IQR)** of EVs.
      *   **Example**:  
          Advisors' EVs = [5%×Impact, 15%×Impact, 30%×Impact, 50%×Impact, 65%×Impact] → Median EV = 30%×Impact. IQR = 15%×Impact to 50%×Impact.  
          *Compare this to a clustered estimate:* [28%×Impact, 30%×Impact, 30%×Impact, 32%×Impact, 32%×Impact] → Median = 30%×Impact, IQR narrow.
      *   **Benefit**: Shows how disagreement translates directly into uncertainty about expected value. A wide IQR signals that cost-effectiveness is highly contested.

  3.  **Implement a "Pessimist Threshold" for High-Stakes Cases**:
      *   **Method**: Define a minimum probability threshold (e.g., 10%) below which even the *most optimistic* EV calculation wouldn't justify funding *if the downside is catastrophic*. If any advisor's estimate falls below this threshold, require explicit justification for proceeding.
      *   **Benefit**: Forces engagement with pessimistic scenarios ("What does the 5% advisor know that others are discounting?"). Prevents "reckless neglect" of low-probability, high-consequence critiques.

  4.  **Formalize Scenario Planning**:
      *   **Method**: Treat divergent estimates as **signals to define scenarios**. For example:  
          - *Optimistic Scenario (P=65%)*: What would success look like? What dependencies exist?  
          - *Pessimistic Scenario (P=5%)*: Why would this fail? Are there irreversible harms?  
          - *Median Scenario (P=35%)*: What evidence would shift probabilities?
      *   **Benefit**: Transforms disagreement into structured stress-testing, identifying critical assumptions or research needed to reduce uncertainty.

  ### Why This Matters for Existential Risk
  In domains like catastrophic AI risk, **disagreement among informed experts is often the most valuable signal**. It highlights:
  - **Unknown unknowns**: Areas where models are incomplete or evidence is critically lacking.
  - **Overconfidence traps**: Proposals relying on untested assumptions.
  - **Value disagreements**: Differing weights on potential outcomes (e.g., is a 5% chance of prevention worth pursuing if failure has irreversible consequences?).

  ### Recommendation for the Committee
  1.  **Stop presenting *only* the average**. Always report the **range (min/max or IQR) and median** of both probabilities and expected values.
  2.  **Add a mandatory "disagreement narrative"** explaining key reasons for variance (>30% spread triggers this).
  3.  **Adopt uncertainty-adjusted decision rules**:  
      - For proposals with high spread (>40 percentage points?), require scenario analysis.  
      - Use median EV (not mean) for ranking to reduce outlier influence.  
      - Consider a pessimist threshold for projects with potential lock-in effects or catastrophic downsides.
  4.  **Track outcomes**: Record which estimates (optimistic/pessimistic) proved accurate over time to refine weighting or identify persistent biases.

  **Bottom line**: Your source didn't flunk statistics—she identified its misapplication. Folding deep disagreement into a single number *is* a sleight of hand when the spread reveals fundamental uncertainty. By making disagreement visible and structuring its use, her committee can turn epistemic unease into wiser decisions. This isn't just "ordinary uncertainty"—it's a signal that demands richer interpretation.
