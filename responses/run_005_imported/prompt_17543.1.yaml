  We are given a four-move exchange between Mara and Owen on Kim's causal exclusion argument. We are to score each move from -2 to 2 and provide a brief justification. Then, we are to discuss what both might be missing.

  **Move 1: Mara** presents Kim's causal exclusion argument against non-reductive physicalism. She argues that if a physical effect has a sufficient physical cause (the realizer), then the mental property (supervening on that realizer) doesn't do any causal work. Thus, non-reductive physicalism leads to either reductionism (the mental reduces to the physical) or epiphenomenalism (the mental is causally inert).

  **Scoring Move 1**: Mara is accurately representing Kim's argument. This is a standard and valid presentation of the exclusion problem. However, it is important to note that this is the starting point of the debate and not a settled conclusion. We are not judging whether Kim is right, but whether Mara's presentation is correct. She does a good job of setting up the problem.

  Score: 2 (basically right) - because she correctly states the exclusion argument.

  **Move 2: Owen** responds by arguing that Kim's argument, if accepted, would generalize to all higher-level properties (e.g., in biology or economics). Since these higher-level properties are multiply realizable and capture causal-explanatory patterns that the physical level misses, they must be doing causal work. Thus, the argument must be flawed because it would lead to an unacceptable elimination of all higher-level causation.

  **Scoring Move 2**: Owen's move is a common and powerful response to the exclusion argument. It points out the problem of "causal exclusion" leading to "causal drainage" (or "causal exclusion for everything"). This is a legitimate worry and a standard objection to Kim. However, it doesn't fully address the exclusion problem because it doesn't show how higher-level properties can avoid being excluded. It just says that if we accept the argument, we lose higher-level causation, which we don't want. But that alone doesn't solve the problem.

  Score: 1 (mostly right, but with a minor flaw) - because the objection is valid and important, but it doesn't by itself resolve the exclusion problem. It only highlights the unpalatable consequence.

  **Move 3: Mara** counters that Owen's point is about explanation, not causation. She uses the example of fragility: saying the vase broke because it was fragile is explanatory, but fragility doesn't add any causal power beyond the microphysical process. Similarly, mental properties might be explanatory without being causal.

  **Scoring Move 3**: Mara is correct to distinguish between explanation and causation. The example of fragility is classic in philosophy (often associated with Davidson) and highlights the idea that higher-level properties can be explanatory without being causally efficacious. This is a good point because it forces Owen to show that mental properties are not just explanatory but also causally efficacious. However, it doesn't address the multiple realizability point directly and might be seen as conceding that mental properties are epiphenomenal.

  Score: 1 (mostly right, but with a minor flaw) - because she correctly points out the distinction, but the example of fragility is controversial (some argue that fragility can be causally relevant). Also, she doesn't engage with the multiple realizability argument beyond calling it explanatory.

  **Move 4: Owen** brings in Yablo's proportionality criterion. He uses the example of Sophie the pigeon: the cause of the pecking is the redness (not the specific shade) because the pigeon would peck at any red thing. Similarly, mental properties might be the proportional cause of an effect (e.g., a behavior) because they are at the right level of specificity.

  **Scoring Move 4**: Owen's move is strong. Yablo's proportionality is a well-regarded attempt to solve the exclusion problem by showing that the mental property can be the cause because it is more proportional to the effect than the physical realizer. This directly addresses the causal exclusion by arguing that the physical realizer is too specific and thus not the cause (or at least, the mental cause is not excluded because it is the proportional one). However, it is not without challenges (e.g., does proportionality really avoid overdetermination?).

  Score: 2 (basically right) - because he correctly applies a sophisticated and relevant philosophical tool to the problem. It directly addresses the causal (not just explanatory) role of mental properties.

