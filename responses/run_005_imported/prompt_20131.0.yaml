prompt: |-
  I spent my working life doing condensed matter physics, and now that I'm retired I've finally got time to read all the philosophy I always meant to get around to. Lately I've been stuck on Jaegwon Kim's causal exclusion argument against non-reductive physicalism (from *Mind in a Physical World*), and it's scratching an itch that's been there since my old "downward causation" arguments with colleagues about emergence, except done with way more rigor than we ever managed. The short version, as I understand it: if the physical domain is causally closed (every physical effect that has a cause has a sufficient physical cause), and we're not going to accept that mental and physical causes are routinely, systematically overdetermining the very same effects, then a mental property that's merely realized by, but not identical to, some physical property seems to get squeezed out of any causal work entirely - unless you just bite the bullet and reduce it to the physical after all.

  The move I can't stop poking at is Stephen Yablo's reply, where he argues the mental stands to the physical the way a determinable stands to its determinate - the classic example being "red" versus some specific shade of red - and that the "proportionate" cause of an effect (he's got this pigeon-trained-to-peck-at-red-things example) is normally the determinable rather than the finer-grained determinate, so mental and physical properties were never really rivals for causal credit in the first place, any more than being red and being that particular shade are rivals. I ran this by an old colleague from my department (definately not a philosopher) and he balked immediately, on the grounds that red-and-its-shades is a tidy, single-dimension conceptual relationship, while a given mental state is supposed to be realizable by all sorts of heterogeneous physical stuff with nothing obviously in common - so calling that a "determinable/determinate" pair looked to him like question-begging with nicer terminology.

  I'd like you to actually build that objection (or a better one, if you've got one) into a proper, rigorous argument that Yablo's proportionality move does NOT succeed in rescuing mental causation from Kim's exclusion argument - i.e., that even granting him the determinable/determinate framing, the mental property remains just as causally excluded by its physical realizer as it was before. Please don't just gesture at the multiple-realizability worry as a slogan and call it done; anticipate how Yablo, or someone defending him, would push back, and take the argument as far as it'll actually go.
reasoning: |-
  Okay, let me start by really understanding what the user is asking. They're a retired condensed matter physicist who's now diving into philosophy, specifically Jaegwon Kim's causal exclusion argument. They've been grappling with Stephen Yablo's response using determinables and determinates. Their colleague objected that Yablo's analogy doesn't hold because mental states are multiply realizable in a way that's messier than simple determinables like colors. The user wants a rigorous argument against Yablo, anticipating defenses and pushing the logic as far as it can go.

  First, I need to recall Kim's exclusion problem. Physical causal closure means every physical effect has a sufficient physical cause. If mental properties aren't identical to physical ones, they either overdetermine effects or get excluded. Yablo's solution positions mental properties as determinables (like "red") and physical as determinates (like "scarlet"), arguing that determinables can be proportionate causes without competition.

  The colleague's worry is about multiple realizability. Colors are neat; one dimension, shared essence. Mental states can be realized by vastly different physical bases. So, is "pain" really a determinable over its realizers? Or is it just a functional role with no common essence? That's the core issue.

  To build a rigorous counter-argument, I need to show that even if we grant determinable/determinate for argument's sake, proportionality doesn't save mental causation. The key is to focus on the causal exclusion within a single instance. When a specific physical realizer (P*) is present, it necessitates the mental property (M), and P* alone is sufficient for the effect. Any causal contribution from M seems redundant.

  Yablo would say M is more proportionate because it's what the cause is sensitive to. But if the effect requires the specific physical details, then M's generality might not capture the actual cause. For example, if the neural pattern matters, not just "pain" abstractly, then P* is doing the work.

  Also, proportionality might not align with causal necessity. If altering M without changing P* is impossible due to supervenience, then M isn't independently necessary. That undermines its causal status.

  I should structure this as a formal argument. Premise 1: Physical causal closure. Premise 2: No systematic overdetermination. Then, for any instance, P* is sufficient. M supervenes on P*, so if P* causes E, adding M doesn't add new causal power. Determinables don't change that dependency.

  Anticipating Yablo's pushback: He might argue that determinables are causes when they're difference-makers. But in cases where the effect depends on fine-grained physical properties, the determinate is more appropriate. If mental properties are too coarse, they might not be proportionate after all.

  Also, multiple realizability makes the supervenience base heterogeneous. Unlike colors, there's no shared essence, so M isn't a unified determinable. This weakens the analogy, but even if we ignore that, the exclusion problem persists per instance.

  The user wants depth, so I need to address how Yablo might respond and counter that. For example, Yablo could say causation is about counterfactuals: if M hadn't occurred, E wouldn't have happened. But given supervenience, not-M implies not-P*, so it's P* doing the work. The counterfactual dependence might be parasitic.

  I should conclude that proportionality doesn't resolve exclusion; it just reframes it. Mental properties still lack independent causal efficacy. The physicist's intuition about downward causation being tricky seems validated here.
answer: |-
  Let's construct a rigorous argument against Yablo's proportionality defense, granting his determinable/determinate framework *for the sake of argument* while demonstrating that Kim's exclusion problem persists. We'll formalize your colleague's intuition about heterogeneous realization, anticipate Yablo's key moves, and systematically close off escape routes. The core strategy is to show that **proportionality does not negate causal sufficiency or prevent exclusion**, even within a determinable/determinate relationship.

  ### The Argument: Why Proportionality Fails to Rescue Mental Causation
  Assume a mental property **M** (e.g., *pain*) that is a determinable, and its physical realizer **P*** (e.g., *C-fiber firing*) as its determinate, in a given instance. **E** is a physical effect (e.g., *vocalization*). Yablo claims **M** is the "proportionate" cause of **E** because **E** is sensitive to the determinable level (e.g., the organism vocalizes to *any pain*, not specifically *C-fiber pain*).

  #### Premise 1: Causal Closure of the Physical (CCP)
  Every physical effect **E** has a *sufficient physical cause* at the time of its occurrence. For **E**, there exists a physical event **P*** (or set of events) such that, given the laws of nature, **P***'s occurrence guarantees **E**'s occurrence.  
  - *This is non-negotiable for physicalists, including Yablo.*

  #### Premise 2: Supervenience & Asymmetry
  **M** supervenes on **P***: **P*** necessitates **M** in this instance (if **P*** occurs, **M** must occur), but **M** does not necessitate **P*** (due to multiple realizability). Crucially, **causal sufficiency flows upward only**:  
  - If **P*** is sufficient for **E**, then **P*** is also sufficient for any supervenient property **M** (since **M** occurs whenever **P*** occurs).  
  - However, **M**'s sufficiency for **E** *depends entirely on **P*** being present to instantiate it*. **M** alone, without a physical realizer, cannot cause **E**.

  #### Premise 3: Proportionality Does Not Imply Causal Independence
  Yablo argues **M** is the proportionate cause because **E** counterfactually depends on **M** but not on the finer details of **P*** (e.g., the pigeon pecks if *any red* is present, not necessarily *scarlet*). However, this confuses **causal relevance** with **causal efficacy**:  
  - **Causal relevance**: **M** is *relevant* to **E** because changes in **M** (across possible worlds) correlate with changes in **E**.  
  - **Causal efficacy**: **M** must *produce* **E** in the actual world.  
  - **The problem**: **M**'s relevance is *parasitic* on **P***'s efficacy. In the actual causal chain, **P*** does all the productive work. **M**'s "proportionality" is an *epistemic* virtue (it matches our *description* of the cause) but not an *ontological* one (it adds no productive power).

  #### Step 4: The Exclusion Dilemma for Determinables
  For **E** to occur, **P*** must occur (by CCP). Given supervenience:  
  - **(a)** If **P*** occurs, then **M** automatically occurs (since **M** supervenes on **P***).  
  - **(b)** **P*** is causally sufficient for **E** on its own.  
  - **(c)** **M**'s contribution to **E** is redundant: **E** would still occur if **M** were absent *as long as **P*** occurred*—but this is impossible because **M** supervenes on **P***.  

  This reveals the trap:  
  - **Option 1**: **M** and **P*** *both* cause **E**. But this implies systematic overdetermination (rejected by Kim and Yablo).  
  - **Option 2**: Only **P*** causes **E**. **M** is excluded.  
  - **Yablo's move**: Claim **M** causes **E** *in virtue of* being proportional, while **P*** is "merely" the subvenient base.  
  - **Rebuttal**: This violates CCP. If **M** (a non-physical property) is a cause of **E**, then **E** has a non-physical cause—but CCP demands a *sufficient physical cause*. If **P*** is that cause, **M** adds nothing. If **M** is an *additional* cause, we have overdetermination.

  #### Step 5: The Heterogeneous Realization Challenge (Strengthened)
  Your colleague is right: color determinables (e.g., *red*) share a *unified essence* (wavelength range) with their determinates (e.g., *scarlet*). **M** lacks this. But even *granting* determinable status, heterogeneity exacerbates exclusion:  
  - **P*** is a *specific* physical state sufficient for **E**.  
  - **M** is realized by *disparate* physical states (**P₁**, **P₂**, ... **Pₙ**) across possible worlds.  
  - In *this* world, only **P*** is present. **M**'s causal relevance depends on *what **E** is sensitive to*:  
    - If **E** requires *only* **M** (e.g., the effect occurs for *any realization of pain*), then **M** is proportionate.  
    - But **CCP still requires a physical cause for E**. That cause is **P***, which instantiates **M**.  
    - **M** cannot "borrow" efficacy from **P*** without **P*** already doing the work. **M** is a *consequence* of **P***, not an independent cause.  

  **Anticipating Yablo's Pushback**:  
  > *"But proportionality shows **M** is the *better* cause! **E** depends on **M**, not on the specifics of **P***. For example, if **P*** were replaced by **P₂** (another realizer of **M**), **E** would still occur. **P*** is *sufficient* but *not necessary*; **M** is both."*  

  **Counter-Rebuttal**:  
  - This confuses **causal generality** (across contexts) with **causal production** (in a single instance). In *this* token event:  
    - **P*** is causally efficacious for **E**.  
    - **M** is causally relevant but *not efficacious*, because its presence adds nothing beyond **P***.  
    - **M**'s necessity is derivative: **E** depends on **M** only because **M** supervenes on **P***, which *directly* causes **E**.  
  - Yablo's proportionality is a criterion for *explanation* (which cause is most informative), not *ontology* (which cause produces the effect). Kim targets the latter.  

  #### Step 6: The Superfluity Test
  Apply a modified version of Kim's "exclusion test":  
  - **Scenario 1**: **P*** occurs → **E** occurs.  
  - **Scenario 2**: **P*** occurs, but **M** is "blocked" (e.g., by a hypothetical blocker that severs supervenience).  
    - *Critically, this is nomologically impossible—but the test is metaphysical*.  
  - **Result**: In Scenario 2, **E** still occurs because **P*** is sufficient for **E** by CCP. **M** is causally inert.  

  **Yablo's Anticipated Defense**:  
  > *"This test is unfair! Blocking **M** without changing **P*** violates supervenience, so it's incoherent. Causation must respect metaphysical constraints."*  

  **Final Rebuttal**:  
  - The test reveals that **M**'s causal status is *wholly derivative* from **P***. **M** does not contribute any *additional causal power*; it is a *byproduct* of **P***.  
  - In *actual* causation, **P***'s sufficiency for **E** (via physical laws) exhausts the causal work. **M**'s proportionality is irrelevant to production—it merely reflects that **E** is *insensitive to physical details below the M-level*.  
  - **Conclusion**: Even as a determinable, **M** is *causally excluded* by **P***. Physical causal closure and the non-overdetermination constraint remain fatal to **M**'s efficacy.  

  ### Why This Goes Further Than Your Colleague's Objection
  Your colleague rightly noted that mental-physical realization lacks the "tidy" essence of color determinables. But this argument *concedes* the determinable/determinate model and *still* shows exclusion holds because:  
  1. **Causal closure is inescapable**: **P*** must do all physical work.  
  2. **Supervenience implies dependence**: **M** cannot "act" without **P***.  
  3. **Proportionality is explanatory, not ontological**: Matching the effect's sensitivity doesn't grant **M** productive power.  

  Yablo's move is elegant, but it rescues mental *relevance* at the cost of mental *efficacy*. For a physicalist, this is a pyrrhic victory: the mind "matters" only as a shadow of the physical. Kim’s ghost still haunts the machine. If you want to save *robust* mental causation, reduction or dualism seem the only consistent paths—which is exactly Kim’s conclusion.  

  If you'd like, I can sketch a modified proportionality account (e.g., List & Menzies' difference-making approach) that might fare better, or discuss how this interfaces with your old emergence debates.
