answer: |-
  The holomonument shimmered, perpetually decaying. Etched names of the "Lost Generations" flickered in and out of existence, victims of the Great Burn – the century when Aris Prime’s ruling council, led by Elara’s great-great-grandmother, Lyra Vance, strip-mined the planet’s core-adjacent geothermal veins for quick energy wealth. They’d known the risks: seismic instability, atmospheric bleed-off, a drastically shortened planetary lifespan. They’d done it anyway. Prosperity now, consequences later.

  Later was Elara’s now.

  She stood on the observation deck of Vance Tower – ironically, one of the few structures hardened enough to survive the escalating tremors – looking out at the twilight city. The air tasted faintly metallic, a legacy of the bleed-off. The ground hummed, a constant, uneasy reminder. *Her* ground. *Her* air.

  The archival footage played on a loop in the public memory kiosk below. Lyra Vance, sharp-suited, charismatic, dismissing concerns before the council: **"We are stewards of *this* generation's potential, not hypothetical phantoms centuries hence! Our children deserve abundance *now*."** Her opponents, pale and strained, argued about sustainable taps, slower growth, preserving the deep stability. They lost. The Burn began.

  Elara touched the cool transparisteel. Lyra’s defiant eyes, so like her own in the old portraits, stared back from the kiosk screen. Everyone knew the cost: the fragile ecosystems that collapsed within decades, the predicted habitation window slashed from millennia to mere centuries, the millions – the *Lost Generations* – who would never be conceived because the world couldn’t support them. Aris Prime was dying young, sacrificed for Lyra’s "now."

  And Elara existed *because* of it.

  If Lyra had chosen the slow path, the cautious path, the *just* path… Elara wouldn’t be. Not her. Not this specific consciousness, these memories, this particular ache in her chest as she watched the sunset bleed orange through the particulate haze. The child born to Lyra’s son would have been conceived years later, under different stars, perhaps on a different continent stabilized by careful energy management. A different egg, a different sperm, a different person entirely.

  **So who was harmed by Lyra’s choice?** The Lost Generations? But they never were. They weren’t deprived of life; they were never candidates for it. Not them. The people living *now*, struggling with the tremors and the thinning air? But Elara’s life, though shadowed by the coming end, was **undeniably worth living**. She loved, learned, felt the sun (filtered) on her face. She wasn’t a *worse-off* version of someone else; she was *herself*, and the only alternative for Elara Vance was non-existence.

  Yet, the monument shimmered. The ground trembled. The air scraped her throat. An injustice *had* been committed. A future had been stolen. But the victim… the victim was spectral. Collective? Abstract? The universe itself?

  Elara visited the monument plaza. Names flickered: potential lives, unmade. She felt the familiar cocktail: **guilt without a crime, gratitude poisoned at the source.** Was she *glad* Lyra chose recklessly? Yes, because it meant *she* was. Did she condemn Lyra’s choice? Absolutely, because it doomed billions yet unborn and scarred her own world. To condemn Lyra felt like condemning her own atoms.

  An old philosopher, Parfit, they said, had wrestled with this. How wrongs could float free of a concrete victim. Standing before the shimmering names, Elara felt that wrong like a physical pressure, yet when she tried to point to *who* it wronged, her finger passed through ghosts.

  She owed her life to a decision universally reviled. What did she owe *that* fact? Penance? But to whom? Celebration? That felt obscene. Silence? Complicity?

  A particularly sharp tremor rattled the plaza. People gasped, steadied themselves. A child cried. Elara remained upright, the tremor vibrating up through the soles of her boots, through her bones, a resonance with the deep, wounded veins of the planet. Her planet. The one Lyra’s choice broke, and simultaneously, the one that made her possible.

  She didn’t move towards the crying child. She didn’t move towards the exit. She just stood in the humming plaza, under the flickering names of the never-weres, the trembling ground a counterpoint to the impossible, unsolvable equation vibrating within her own chest. The debt was real, the creditor absent. The life was precious, its foundation rotten. The monument shimmered, casting no shadow she could point to and say: *There. That’s who was wronged. That’s who I owe.*

  The metallic air filled her lungs. She breathed it in. She existed. The ground settled, leaving only the low, constant, planetary ache. Elara closed her eyes, not in prayer, but in the futile search for an answer that wouldn’t come, the discomfort of her own existence a permanent, humming tremor beneath her skin.
