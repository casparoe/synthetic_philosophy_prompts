answer: |-
  You're right to push back against the easy separation. While Frege's formal logic can be *used* neutrally, the philosophical framework he built around it – the absolutism, anti-psychologism, and Platonism – shares deep structural and motivational resonances with his political ideology. Here's the substantive case for connection:

  1.  **The Rejection of Subjectivity & the Demand for Absolute Objectivity:**
      *   **Philosophy:** Frege's core battle was against *psychologism* – the idea that logic and mathematics are products of human minds, subject to psychological laws, cultural variation, or individual perspective. His "Third Realm" of objective, mind-independent *Thoughts* (Gedanken) was designed precisely to eradicate any trace of subjectivity, contingency, or relativism from logic and truth. Truth was *eternal*, *unchanging*, and *discovered*, not created.
      *   **Politics:** His nationalism wasn't cultural or romantic; it was an absolutist vision of the *Volk* as an objective, supra-individual entity with a singular, essential identity and destiny. Democracy, pluralism, and liberalism were anathema precisely because they introduced *subjectivity*, *compromise*, and *relativism* into the political sphere. They allowed multiple perspectives, contingent interests, and individual opinions to dilute the objective "Truth" of the *Volk*'s needs and the state's purpose. His antisemitism framed Jews as fundamentally alien, incapable of truly belonging to this objective German essence – subjective outsiders corrupting the objective whole.
      *   **Connection:** The *structural aversion to pluralism and subjectivity* is identical. Just as multiple logics or psychological interpretations threatened the absolute objectivity of truth for Frege the philosopher, multiple political parties, democratic debate, and diverse cultural identities threatened the absolute objectivity of the *Volk* and the state for Frege the nationalist. Both realms demanded a single, monolithic, unchanging Truth that brooked no dissent or variation.

  2.  **The "One True Logic" and the "One True Nation":**
      *   **Philosophy:** Frege insisted there was *exactly one* correct logic – the structure of the world itself, revealed through his Begriffsschrift. Alternative logical systems weren't just different; they were fundamentally *wrong*, failing to capture the absolute structure of reality. His Platonism about numbers and concepts reinforced this: mathematical truths existed independently, waiting to be discovered by the one correct method.
      *   **Politics:** His vision for Germany was similarly monolithic. He desired a unified, powerful German state under strong, centralized, likely authoritarian leadership (he admired proto-fascist figures like Ludendorff). This was the "one true" political form for the German *Volk*. The pluralism and instability of the Weimar Republic weren't just messy; they were a fundamental *deviation* from the necessary, objective political order. Competing ideologies (liberalism, socialism, Judaism) were seen as corrosive errors.
      *   **Connection:** The *absolutist monism* is parallel. In both domains, Frege operates with a model of *singular correctness*. There is one logic, one mathematical reality, one correct way to reason. Similarly, there is one true German essence, one correct political order for that essence, and one path to national greatness. Plurality equals error and corruption in both spheres.

  3.  **The Third Realm as a Foundation for Exclusion:**
      *   **Philosophy:** The "Third Realm" (thoughts, senses, concepts) exists independently of individual minds or physical instantiation. Accessing it requires rigorous, objective thought, free from psychological contamination. This implicitly creates a hierarchy: those capable of pure logical thought (like Frege) grasp the objective realm, while those mired in psychology or subjective experience do not.
      *   **Politics:** The concept of the objective *Volk* similarly transcends individuals. True belonging requires embodying the essential, objective characteristics of the *Volk*. Frege's antisemitism explicitly defined Jews as incapable of this true belonging, as fundamentally different and contaminating. Democracy, by empowering the "masses" (who he saw as irrational and driven by base interests), prevented the rule of those who supposedly understood the objective national interest (an elite, likely including himself).
      *   **Connection:** The *Platonic hierarchy* translates. The objective realm (logical/mathematical or national) is accessible only to the intellectually or ethnically "pure." Others (the psychologically minded, the "masses," Jews) are inherently excluded or seen as polluting forces threatening the purity and stability of the objective order. The structure justifies exclusion based on perceived failure to meet an objective standard.

  4.  **Anti-Psychologism as Anti-Humanism:**
      *   **Philosophy:** Frege's fierce anti-psychologism wasn't just methodological; it was a profound *devaluation* of the human, contingent, historical, and social dimensions of thought and meaning. Meaning (sense) and truth reside entirely outside human minds and practices.
      *   **Politics:** His political views similarly devalued the messy reality of human plurality, individual rights, historical compromise, and social negotiation inherent in democracy. The objective *Volk* and state transcended the needs and desires of actual, living individuals. His antisemitism reduced individuals to immutable, essentialized categories defined by "blood."
      *   **Connection:** The *rejection of the human element* as the source of validity is key. In logic, validity comes from the Third Realm, not human agreement or practice. In politics, legitimacy comes from the objective *Volk* and its destined state, not from the consent or welfare of the governed. Both frameworks erase the legitimacy of human experience, social context, and historical development as sources of meaning or value.

  **Why this isn't just "he was consistent":**

  It's not that his logic *caused* his politics, or vice versa. Rather, it suggests Frege possessed a deeply ingrained *intellectual temperament* characterized by:

  *   **An intense fear of ambiguity and relativity:** He sought absolute certainty and fixed foundations in both thought and society.
  *   **A monistic worldview:** He favored singular, unified explanations and structures over pluralism and complexity.
  *   **A valorization of the abstract and objective over the concrete and subjective:** The "pure" realm (of thought or nation) held higher value than the messy reality of human minds and societies.
  *   **A tendency towards exclusion:** Defining the "objective" realm inherently creates boundaries and categories of exclusion for what doesn't fit.

  His philosophical system provided the *intellectual architecture* that made his political vision feel coherent and necessary. The same drive for absolute, objective, mind-independent order that fueled his revolution in logic also fueled his rejection of democratic pluralism and his embrace of an exclusionary, authoritarian nationalism. The "Third Realm" wasn't politically neutral; its very structure resonated with and potentially reinforced an absolutist mindset that found its terrifying political expression in the ideologies rising around him. Dummett's discomfort likely stemmed from recognizing that the powerful, beautiful edifice of Frege's thought was built, at least in part, with the same intellectual stones that could be used to construct something deeply ugly. The separation isn't clean because the foundational temperament isn't compartmentalized.
