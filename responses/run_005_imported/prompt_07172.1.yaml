  I should also consider how his logic's precision and objectivity could be seen as a model for societal order. His antisemitism might stem from viewing Jews as undermining cultural purity, similar to how he saw psychologism as corrupting logic. Michael Dummett's discomfort might arise from recognizing that the same absolutism in philosophy could underpin problematic political stances.

