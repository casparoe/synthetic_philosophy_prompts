  ok so i learned that frege (the guy who basically invented modern logic, sense/reference and all that) kept a private diary in like 1924 thats full of nationalist, anti-democracy, antisemitic stuff, and it apparently wrecked michael dummett a little when he found out since dummett had spent his whole career championing frege's work. my philosophy teacher's take is that this is totally seperate from frege's actual logic and semantics, like a bad person can still do totally objective work that stands on its own. i think that's too easy though. can you actually argue the opposite -- that there's a real substantive connection between frege's political absolutism (the nationalism, the hostility to weimar democracy and pluralism) and his philosophical absolutism (the anti-psychologism, the "third realm" of objective mind-independent thoughts, the insistence that there's exactly one correct logic)? i don't want a wishy-washy "both sides have a point" answer, i want the actual case for why they're connected.
