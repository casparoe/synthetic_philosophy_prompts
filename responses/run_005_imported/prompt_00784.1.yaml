  First, I need to address why the standard move is insufficient. The user is right that both theories agree not to pay post-rescue. The philosophical challenge is whether rationality should be about individual acts or dispositions. The user wants an analysis that doesn't dodge the question by changing frameworks. They also want a committed answer, not a middle ground.

  Next, I should break down each proposed solution. Resolute choice (McClennen) involves committing to a plan, but it might violate dynamic consistency. Gauthier's constrained maximization relies on mutual recognition of dispositions, but here the driver is gone, so no ongoing cooperation. FDT treats the decision as part of an algorithm, considering counterfactuals. But the user is skeptical if this is just redefining the problem.

  The user's deeper need seems to be a clear argument on whether rationality must be dispositional. They might be preparing for a seminar and want to present a strong stance. They also want to confront the idea that rational agents can end up worse off, which is a tough bullet to bite.

  I need to evaluate each approach honestly. Resolute choice feels ad hoc without a precommitment. Gauthier doesn't apply since no future interactions. FDT's algorithmic view is coherent but fundamentally shifts the assessment level. The user's concern about question-begging is valid here.

  Concluding, I agree that the hitchhiker shouldn't pay. The case shows that rationality assessed solely at the act level can lead to suboptimal outcomes, but that's a flaw in the theories, not a reason to change the assessment level. Biting the bullet maintains coherence in decision-making, even if it's unsatisfying. The user needs this clear stance to challenge students and provoke debate in their seminar.
answer: |-
  ## The Hitchhiker's Unpaid Fare: Why Rationality Demands We Drive Past the Dispositional Dodge

  You've nailed the core frustration with the standard treatment of Parfit's Hitchhiker. The glib invocation of "the disposition that got you saved" feels less like a solution and more like a philosophical sleight of hand, papering over a genuine fissure in act-based rational choice theories. You're absolutely right: once standing in town, *both* Causal Decision Theory (CDT) and Evidential Decision Theory (EDT) unequivocally advise *not* paying. The causal pathways are severed – your payment doesn't cause the past rescue. The evidence is fixed – you already know you were rescued, so paying provides no new information about the driver's past disposition or your own. The dominant act *now* is to keep the money. To insist the hitchhiker "should" pay based on the *past benefit of a disposition* seems to abandon the very act-based framework the problem initially inhabits. Let's take this seriously and dissect the proposed escapes: resolute choice, constrained maximization, and FDT. Are they solving the problem legitimately, or are they, as you suspect, subtly changing the question?

  **The Act-Based Impasse: Why Payment Seems Irrational**

  1.  **CDT:** Assesses actions based on their causal consequences. Paying $100 costs $100. It causes no future benefit (the driver is gone) and doesn't retroactively cause the rescue. Not paying saves $100 with no negative causal consequences. Dominant action: Don't Pay.
  2.  **EDT:** Assesses actions based on the evidence they provide. Paying $100 provides strong evidence you *were* the type of person the driver would rescue (i.e., a payer). But you *already know* you were rescued! This is tautological confirmation of a known past event. It provides no *new* evidence about your current or future state, or any other relevant state of the world. Not paying provides evidence you *weren't* that type, but again, *you know you were rescued*, making this evidence irrelevant to your current situation. The cost dominates: Don't Pay.

  Both theories, operating strictly on the *act* of paying *now, in town*, deliver the same verdict: non-payment is rational. The intuitive appeal of paying feels like a relic of the *ex ante* perspective, smuggled back in. So, how do the proposed solutions attempt to bridge this gap?

  **Interrogating the Escapes:**

  1.  **Resolute Choice (McClennen):** Advocates committing to a *plan* (e.g., "If rescued, I pay") at the initial choice node and sticking to it resolutely, even if a later act within the plan seems locally suboptimal. The rationale is that the *overall plan* (commitment to pay -> rescue -> payment) yields a better outcome than any dynamically consistent sequence starting from non-commitment.
      *   **Legitimate Work or Question-Begging?** This *explicitly* changes the locus of rationality from individual acts to plans. It argues rationality requires this shift to avoid self-defeating behavior. However, the *justification* for sticking to the plan *at the payment node* feels weak. *Why* is it rational *now* to honor a past commitment when reneging is costless and beneficial? McClennen essentially asserts that rationality *is* plan-adherence in such dynamic choice contexts. This risks circularity: "You should pay because you committed to the rational plan, and the plan is rational because it prescribes paying." It directly answers "what should I do *now*?" with "what your *earlier rational self* decided you should do *then* for *now*," which *is* changing the question to a policy level. While coherent internally, it doesn't *prove* the act of paying *is* rational *at t2* on act-based grounds; it asserts rationality requires adopting a different framework where policy-following *defines* rational action at choice points.

  2.  **Constrained Maximization (Gauthier):** Focuses on dispositions. A constrained maximizer (CM) conditionally cooperates *if* they believe others are also CM. The driver rescues only CM hitchhikers. The hitchhiker, being CM, pays upon rescue, fulfilling their disposition.
      *   **Legitimate Work or Question-Begging?** Gauthier grounds the rationality of paying *in the value of possessing and maintaining the CM disposition itself*. The disposition enables beneficial cooperation inaccessible to straightforward maximizers (who wouldn't get rescued). Paying *now* is rational because it *is* the action constitutive of being CM, and being CM is instrumentally rational overall. **This is a fundamental shift.** It doesn't evaluate the act of paying *in isolation*; it evaluates it *as an expression of a rationally held disposition*. Gauthier argues individual acts *must* be assessed within the context of the dispositions that make them possible. Crucially, he provides an argument (flawed or not) for why possessing the disposition *is* rational *ex ante* and why acting according to it *ex post* maintains its value. While it changes the question to "what disposition should I cultivate?", it offers a justification rooted in maximizing expected utility *via* dispositions, not just an assertion. However, in the *isolated* Hitchhiker scenario, where the driver is gone forever, the *current* act of paying seems only to maintain the disposition *for its own sake*, not for future gains. This weakens the instrumental case *at t2*.

  3.  **Functional Decision Theory (FDT):** Treats the agent as implementing a *decision function* or algorithm. Rationality involves choosing the output (act) that, *when seen as the output of this function*, leads to the best outcome *across all decision points where the same function is called*. FDT asks: "What decision function, if I had adopted it earlier *and* the driver predicted it, would have gotten me rescued? And what does *that* function prescribe *now*?" The answer is a function that pays if rescued. Choosing to pay *now* is rational because it's the output of the *overall best* decision function.
      *   **Legitimate Work or Question-Begging?** FDT explicitly and unapologetically shifts the locus of rationality to the *function* or *policy*. It argues that the *only coherent* way to handle decision problems involving logical correlation (like prediction) is to optimize over the function's outputs *simultaneously*. It doesn't claim the act of paying *at t2* is causally or evidentially optimal *in isolation*. It claims that *acting as the best function dictates* is rational, *even at points where the local act seems suboptimal*, because rationality is fundamentally about being the *kind of agent* who gets good outcomes across scenarios. **This is a profound shift.** FDT argues act-based theories fail *precisely because* they focus too myopically on the local choice context. While revolutionary, it undeniably changes the question from "what should I do now?" to "what decision function should I implement?" and defines rational action as following the best function's output. Its legitimacy hinges on whether one accepts that logical correlation *requires* this shift. It doesn't *sneak* the shift in; it makes it the central thesis.

  **The Verdict: Biting the Bullet with Clarity**

  Having weighed the options, I conclude that **the hitchhiker, applying CDT or EDT strictly at the moment of choice in town, rationally should not pay.** Appeals to resolute choice, constrained maximization, or FDT *do* resolve the tension, but they do so precisely by **changing the fundamental question from "what should I do right now?" to "what kind of agent/disposition/policy/decision-function should I be?"**

  *   **Resolute Choice** changes the question to "what plan should I commit to *ex ante*?"
  *   **Constrained Maximization** changes the question to "what disposition should I cultivate?"
  *   **FDT** changes the question to "what decision function should I implement?"

  These are not illegitimate moves; they represent sophisticated philosophical positions arguing that act-based rationality is *inadequate* for capturing genuine practical reason in a world of prediction, commitment, and repeated interaction. **Gauthier and FDT, in particular, offer robust (though debatable) arguments for why this shift is necessary.** They are not *quietly* changing the question; they are *explicitly arguing* that the original, narrow act-based question is the wrong one to ask for true rational optimization.

  However, **Parfit's Hitchhiker, in its stark, isolated form, primarily exposes a limitation of strict act-based rationality (CDT/EDT), not an irrefutable proof that rationality *must* be dispositional or policy-based.** It shows that rational agents, defined solely by optimizing *local* acts, can find themselves in situations where:

  1.  They are predictably worse off than they could have been (*ex ante*, the non-payer gets left, the payer gets rescued but pays; the *ex post* non-payer is best off, but only if they could have miraculously gotten rescued without commitment).
  2.  The beneficial outcome they enjoy *depended* on the *prediction* that they would act irrationally (by act-based standards) later.

  **This is the bullet CDT and EDT must bite:** Rational agents, assessed solely by the optimality of individual acts in their immediate context, can indeed predictably end up in suboptimal positions *or* be barred from potentially beneficial opportunities that require predictable "irrationality." The Hitchhiker demonstrates this starkly: the act-based rational agent either dies in the desert (if disposition unknown) or gets rescued and welches, while the dispositional "payer" gets rescued and pays.

  **Therefore:**
  *   **Does the hitchhiker pay?** By the lights of CDT and EDT, operating purely on the act *in town*, **no.**
  *   **Does the case show practical rationality *has* to be assessed at the level of dispositions/policies?** **No.** It shows that act-based theories have a limitation: they cannot guarantee agents access to benefits that depend on others predicting non-act-optimal behavior. One can *choose* to adopt a dispositional/policy-based theory (like Gauthier's CM or FDT) to *avoid* this limitation, but this is a *response* to the problem, not a demonstration that act-based theories are *internally inconsistent*. They are consistent but can lead to regrettable outcomes.
  *   **Is "rational agents can predictably end up worse off" a bullet to bite?** **Yes, for CDT and EDT.** It is a direct, albeit uncomfortable, consequence of their core commitment to evaluating rationality at the point of action, considering only the causal or evidential consequences of that specific act. Recognizing this limitation is intellectually honest. It doesn't invalidate these theories for many decisions; it highlights a specific class of problems (involving prediction and commitment) where their prescriptions feel unsatisfying and where alternative frameworks offer potentially superior overall outcomes by redefining rationality's scope.

  The power of Parfit's Hitchhiker lies not in a facile dispositional "solution," but in forcing us to confront this deep tension: is rationality fundamentally about the optimal *act now*, or about being the *kind of agent* that navigates the world optimally over time, even if that requires acts deemed locally suboptimal? The standard treatments gloss over this tension; your critique rightly exposes it. The dispositional/policy moves are substantive philosophical proposals for resolving it, but they resolve it by rejecting the pure act-based paradigm, not by operating successfully within it. In the isolated desert of the pure act-based perspective, the rational hitchhiker keeps the money, lives with the moral stain, and embodies the cold, sometimes self-limiting, logic of local optimization.
