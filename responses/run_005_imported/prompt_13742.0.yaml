    - If, say, C were eliminated first (though not dominated, as C yields 4 against Y), the original game would still include Z, where A dominates with payoff 5, preventing any domination of A in the reduced game.

  In summary, the elimination of Player 2's strategy Z directly modifies the set of possible opponent actions, removing the high-payoff scenario for A and enabling a mixed strategy to dominate A in the reduced game. This highlights how iterated elimination can reveal new dominance relationships through the removal of opponent strategies, even when no such relationships exist initially.
