  ### Iterated Elimination Process
  1. **Initial game:**  
     - **Player 1's strategy A:** In the original game, A is not strictly dominated by any pure or mixed strategy of Player 1.  
       - Against X: A yields 3, which is equal to C's 3 but less than B's 4.  
       - Against Y: A yields 3, which is equal to B's 3 but less than C's 4.  
       - Against Z: A yields 5, which is strictly greater than B's 0 and C's 0.  
       Since no other strategy (pure or mixed) can achieve a payoff greater than 5 against Z, A is not strictly dominated. For example, any mixed strategy not including A would yield 0 against Z, less than A's 5. Mixed strategies including A cannot strictly dominate A itself.

     - **Player 2's strategy Z:** Z is strictly dominated for Player 2 by pure strategy X (or Y).  
       - Against A: u₂(X) = 2 > 0 = u₂(Z)  
       - Against B: u₂(X) = 3 > 0 = u₂(Z)  
       - Against C: u₂(X) = 1 > 0 = u₂(Z)  
       Thus, Z is strictly dominated by X (u₂(X) ≥ 1 > 0 = u₂(Z) for all Player 1 actions). Player 2 eliminates Z in the first round of iterated elimination.

