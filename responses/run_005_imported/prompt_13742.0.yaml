     Player 2 now has only strategies X and Y. The payoff matrix is:

     | Player 1 \ Player 2 | X         | Y         |
     |----------------------|-----------|-----------|
     | **A**               | (3, 2)   | (3, 2)   |
     | **B**               | (4, 3)   | (3, 1)   |
     | **C**               | (3, 1)   | (4, 3)   |

     - **Player 1's strategy A:** In this reduced game, A is strictly dominated by a mixed strategy of Player 1.  
