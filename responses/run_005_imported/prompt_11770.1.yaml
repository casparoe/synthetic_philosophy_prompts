  - **Cramer (rank 1)**: Bounded utility is a core theoretical principle that directly blocks Menger's maneuver by making utility finitely scalable, avoiding ad-hoc adjustments.
  - **Finite counterparty (rank 2)**: Grounded in practical impossibility, it dissolves the paradox by highlighting an uncontroversial real-world constraint (finite wealth), which survives Menger naturally.
  - **Buffon (rank 3)**: Survives Menger via truncation but relies on an arbitrary probability threshold, making it less principled despite its effectiveness.
  - **Bernoulli (rank 4)**: Historically foundational and intuitive, but its unbounded utility allows Menger to resurrect divergence with faster-growing payoffs.
  - **Peters (rank 5)**: A modern, principled reframing for non-ergodic systems, but Menger exploits its reliance on logarithmic growth to force divergence.
  - **Risk-weighted utility (rank 6)**: Incorporates risk attitudes thoughtfully but depends on unbounded utility, failing Menger when extreme payoffs overwhelm risk weights.
  - **Cumulative prospect theory (rank 7)**: Flexible and descriptive, but its unbounded value function and empirically fitted weights are vulnerable to Menger and lack axiomatic robustness.
