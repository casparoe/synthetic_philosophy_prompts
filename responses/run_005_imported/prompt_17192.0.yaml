  Neal's non-indexical conditioning avoids treating one's birth rank as special. Instead, it considers the probability of being any observer in a given scenario. This might dissolve the SSA vs. SIA conflict by not privileging indexical information. However, it's complex and might not be a panacea. The user might need to weigh whether introducing this complexity is feasible and if it genuinely resolves the issue or just shifts it.

  I should structure the response to compare SSA, SIA, and Neal's approach, highlighting pros and cons for each in the context of the user's work. Emphasize practical implications: SSA introduces a doomsday correction, SIA avoids it but inflates future populations, Neal offers a neutral but complex alternative. Also, address whether Neal's method dissolves the dilemma or relabels it, noting that it avoids the pitfalls but requires careful handling of observer distributions.

