prompt: |-
  I've spent a long time reading rationalist blogs and forums, where discussions of Bayesian epistemology like to invoke the claim that a rational agent should never expect cost-free evidence to leave them worse off in expectation, typically crediting this to I.J. Good's short 1967 note "On the Principle of Total Evidence," which proves the claim within L.J. Savage's decision-theoretic framework. The same corners of the internet also talk a great deal about "information hazards," cases where learning something seems to make you actively worse off, which always struck me as being in some tension with Good's result, even though I gather the standard resolution is that the theorem is a claim about expected utility computed ex ante, before any particular piece of news arrives, rather than about how any specific realized piece of information will feel once you have it. What I have never seen properly spelled out, and would like your help with, is how Good's theorem relates to the substantially earlier and seemingly far more general theorem due to David Blackwell on the comparison of statistical experiments, which gets invoked in the same breath in some of the more technical writing in this space, as though it were simply a fancier restatement of the same fact.

  As I understand them: Good's theorem says that for a Bayesian agent with a fixed utility function and prior, facing one fixed decision problem, the expected utility of observing a cost-free experiment and then choosing the best action given whatever it reveals is never lower than the expected utility of choosing the best action without observing anything, which drops out of a short Jensen's-inequality argument about the convexity of the "best attainable expected utility, as a function of one's posterior" mapping. Blackwell's theorem, by contrast, defines one experiment as more informative than a second when the second's signal distribution can be reproduced by "garbling" the first, that is, by passing its output through some extra randomization that does not itself depend on the true state of the world, and then establishes that this garbling relation holds exactly when every possible decision-maker, with any action set, utility function, and prior whatsoever, would obtain at least as high an expected utility from the first experiment as from the second, across every decision problem they might face. This yields only a partial order over information structures, since most pairs of experiments cannot be ranked against one another in this all-decision-problems-at-once sense.

  My tentative hunch, which I would like you to check, is that Good's theorem amounts to nothing more than the special case of Blackwell's ordering in which the "less informative" side of the comparison is a completely uninformative experiment, one whose output is statistically independent of the true state of the world; since any experiment can trivially be garbled down to such an experiment by simply discarding the signal and outputting noise, Blackwell's biconditional would then automatically deliver Good's conclusion for every decision problem, utility function, and prior at once, which is if anything a stronger statement than the one Good actually proved. If that reduction is correct, it would suggest that Good's short convexity argument only ever needs the logically "easy" half of Blackwell's biconditional, the direction running from garbling to universal preference, while the genuinely deep and hard-won content of Blackwell's theorem lies in the converse: that being universally weakly preferred across every conceivable decision problem is enough to force the existence of a garbling. I would like you to work through whether this reduction actually holds up, state explicitly which half of Blackwell's equivalence Good's argument is implicitly using, and then offer your own considered judgment on which of the two results should be treated as the more fundamental one for understanding why gathering evidence is nearly always instrumentally rational, and correspondingly, whether there remains any sense in which Good's theorem is genuinely special rather than a mere trivial corollary of Blackwell's much more general result.
reasoning: |-
  Okay, let me start by unpacking the user's question. They've been diving into rationalist blogs and Bayesian epistemology, specifically Good's theorem and Blackwell's theorem. The user is trying to understand the relationship between these two and whether Good's theorem is just a special case of Blackwell's.

  First, I need to recall both theorems. Good's theorem states that a rational agent should never expect free evidence to leave them worse off in expectation. It's a short proof using Jensen's inequality on the convexity of the value function. Blackwell's theorem is more complex. It defines when one experiment is more informative than another through garbling and shows equivalence to every decision-maker preferring it for any decision problem.

  The user's hunch is that Good's theorem is a corollary of Blackwell's, specifically when comparing any experiment to an uninformative one. If that's true, then Good's result might seem trivial in comparison. But I need to verify this step by step.

  Let me check the reduction. Blackwell's theorem says that if an experiment E can be garbled to produce F, then E is more informative. An uninformative experiment, say U, which outputs noise independent of the state, can be produced by garbling any experiment E. So, by Blackwell, E is more informative than U. Therefore, for any decision problem, E should be preferred. That directly gives Good's result without needing Jensen's inequality. 

  But is Blackwell's theorem necessary here? Good's original proof uses convexity, which is straightforward. Blackwell's converse direction—that universal preference implies a garbling—isn't needed for this case. So Good's theorem is using the "easy" part of Blackwell's theorem. 

  The user also asks which theorem is more fundamental. Blackwell provides a complete characterization of informativeness, which is foundational in statistics. Good's theorem is a specific application. However, Good's direct proof is simpler and accessible, making it useful for introductory purposes. 

  The user might be interested in understanding why information hazards don't contradict Good's theorem. The resolution lies in the ex ante expectation versus ex post outcomes. Blackwell's framework reinforces this by showing that, on average, more information is better, even if specific instances can be harmful. 

  In conclusion, the user's hunch is correct: Good's theorem is a special case of Blackwell's. But both have their pedagogical value. Blackwell's theorem is more fundamental for a deep understanding, while Good's is a practical illustration.
answer: |-
  Your analysis is precisely correct, and your hunch is well-founded. Let's break down the relationship between Good's theorem and Blackwell's theorem step-by-step, confirming your insights and addressing the core questions.

  ### 1. Confirming the Reduction: Good as a Corollary of Blackwell
  *   **Blackwell's Setup:** Blackwell defines a partial order over experiments (information structures). Experiment E is **more informative than** experiment F (E ≽ F) iff there exists a *garbling* (a state-independent stochastic transformation) such that F's signal distribution can be simulated by passing E's output through this garbling.
  *   **Blackwell's Equivalence:** E ≽ F **if and only if** for *every* possible prior belief, *every* possible utility function, and *every* possible decision problem (action set and state-dependent consequences), the expected utility achievable by an optimal decision-maker using E is at least as high as the expected utility achievable using F.
  *   **The Uninformative Experiment (U):** Consider an experiment U that provides *no information* about the state of the world. Its signal distribution is independent of the true state θ. Formally, P(U = u | θ) = P(U = u) for all θ, u.
  *   **Garbling any E down to U:** For *any* experiment E, we can trivially construct a garbling that produces U. This garbling simply *ignores* the output of E and draws a "signal" from the fixed marginal distribution of U. Since U doesn't depend on θ, this garbling doesn't depend on θ either, satisfying Blackwell's definition.
  *   **Applying Blackwell:** Because we can garble *any* E down to U (i.e., E ≽ U), Blackwell's equivalence implies that for *every* prior, *every* utility function, and *every* decision problem, the expected utility achievable using E is at least as high as the expected utility achievable using U.
  *   **Good's Result:** "Choosing the best action without observing anything" is equivalent to using experiment U. "Observing a cost-free experiment E and then choosing the best action given its signal" is using experiment E. Therefore, Blackwell's result E ≽ U directly implies that the expected utility of using E is at least as high as the expected utility of using U, *for every prior, utility function, and decision problem*. **This is precisely Good's conclusion, but actually *stronger* because Good proves it for a *fixed* prior, utility function, and decision problem, while Blackwell delivers it universally.**

  **Conclusion on Reduction:** Yes, Good's theorem is a strict corollary of Blackwell's theorem, specifically the case where the less informative experiment F is the completely uninformative experiment U. Any E ≽ U, and Blackwell's "easy" direction (garbling implies preference) delivers Good's result universally.

  ### 2. Which Half of Blackwell is Good Using?
  *   **Good's Explicit Argument:** Good's short proof relies solely on the convexity of the map from posteriors to the maximum expected utility attainable (the *value function* or *indirect utility*). Jensen's inequality applied to this convex function, averaged over the distribution of posteriors induced by the experiment, shows that the expected maximum EU *with* the experiment is at least as large as the maximum EU *without* it. This is a self-contained argument within Savage's framework for a *fixed* decision context.
  *   **Implicit Connection to Blackwell:** This convexity argument *implicitly* relies on the **"easy" direction of Blackwell's equivalence** (if E ≽ F via garbling, then E is universally preferred). How?
      1.  Blackwell's "garbling implies preference" direction is proven using essentially the same convexity argument Good uses, generalized to compare *any* two experiments where one is a garbling of the other.
      2.  The specific comparison Good makes (E vs U) *is* a comparison where E ≽ U (via the trivial garbling). Good's proof directly mirrors the proof of the "garbling implies preference" direction of Blackwell for this specific case.
      3.  **Therefore, Good's argument implicitly uses the "garbling implies preference" half of Blackwell's theorem, specialized to the garbling that produces U from E.**

  ### 3. Fundamental Result & Good's Significance
  *   **Blackwell as the Foundational Result:** David Blackwell's theorem is unquestionably the **more fundamental and profound result** for understanding the value of information in a general decision-theoretic and statistical sense.
      *   **Scope:** It provides a complete *characterization* of what it means for one information structure to be universally more valuable than another. It defines a natural and economically meaningful partial order over experiments.
      *   **Depth:** The converse direction ("universal preference implies garbling") is deep and non-trivial. It shows that the seemingly vast requirement of dominance across *all possible* decision problems is *equivalent* to the purely statistical and operational condition of simulability via garbling. This is the heart of Blackwell's contribution.
      *   **Generality:** It handles comparisons between *any* two experiments, not just informative vs. uninformative. This framework is essential for understanding the value of different *types* of information, noisy signals, or experimental designs.
  *   **Good's Significance: A Powerful, Accessible Special Case:** While logically a corollary, I.J. Good's result retains significant importance:
      *   **Simplicity & Pedagogical Value:** Good's proof is remarkably concise and intuitive. It isolates the core conceptual point – the convexity of the value function – in the simplest possible scenario (information vs. no information). This makes it an excellent pedagogical tool for introducing Bayesian rationality and the value of evidence *before* diving into the complexities of Blackwell comparisons.
      *   **Directness for the Core Question:** For answering the fundamental question "Why should a rational agent *ever* seek cost-free evidence?", Good provides the most direct and easily grasped answer: "Because, *in expectation* (before seeing the specific outcome), having the evidence cannot hurt and usually helps, due to the convexity of your value function." Blackwell's framework confirms this but embeds it within a much broader theory.
      *   **Highlighting the Convexity Mechanism:** By focusing solely on the comparison to no information, Good brilliantly illuminates the *mechanism* (Jensen + convex value function) responsible for the non-negativity of the expected value of information. This mechanism is the engine driving the "garbling implies preference" half of Blackwell.

  ### 4. Judgment: Fundamental vs. Special

  *   **Blackwell's Theorem** is the **fundamental result** establishing the general theory for comparing the value of information structures. It provides the deep, complete characterization of informativeness.
  *   **Good's Theorem** is a **highly significant, non-trivial, but logically special case** of Blackwell's theorem. Its power lies not in logical novelty relative to Blackwell, but in its **simplicity, pedagogical clarity, and directness** in answering the most common practical question about evidence: "Should I bother looking (if it's free)?" It cleanly isolates the key mechanism (convexity) responsible for the result in this universal case.

  **Final Synthesis:** Blackwell's theorem provides the profound, general framework for understanding the value of information. Good's theorem is the exceptionally clear, insightful, and practically crucial special case of this framework that demonstrates the universal (weak) benefit of cost-free evidence compared to total ignorance, leveraging the core convexity principle. While Good's result follows from the "easy" half of Blackwell applied to a trivial garbling, its elegant simplicity and direct focus on the core question of evidence gathering make it far more than a "mere trivial corollary" in terms of conceptual clarity and practical significance for understanding instrumental rationality. However, for a deep understanding of *why* information has value and how different information structures compare *generally*, Blackwell's theorem is indispensable and foundational. The two results are complementary, with Blackwell providing the general theory and Good providing the essential, brilliantly simple entry point.
