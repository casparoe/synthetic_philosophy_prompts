prompt: |-
  As a longtime reader of LessWrong and adjacent blogs, I keep coming back to a connection I haven't seen anyone spell out. Yudkowsky's old sequence post "No Universally Compelling Arguments" argues that no fixed sequence of words could move every possible mind toward a given conclusion, since persuasion works only by engaging cognitive machinery the listener already happens to have. This strikes me as, in substance, a generalization of Bernard Williams's internalism about practical reasons to the space of all possible minds: for Williams, the statement "A has a reason to X" is true only if X-ing would serve some element already present in A's subjective motivational set S, reached by a sound deliberative route from S. I would like you to argue for the externalist side against this shared assumption. Specifically, make the strongest case you can that Williams's own concession—that a "sound deliberative route" may include coming to appreciate one's situation more clearly, and not merely narrow means-end calculation—already commits him to reasons that do not bottom out in the agent's antecedent S, so that his official rejection of external reason statements as false or unintelligible does not actually succeed.
reasoning: |-
  Okay, the user is deeply engaged with LessWrong and philosophical discussions, specifically Eliezer Yudkowsky's ideas on universally compelling arguments and Bernard Williams' internalism. They want me to argue against the shared assumption that reasons must always stem from an agent's existing motivational set. 

  Hmm, this is a sophisticated philosophical request. The user clearly understands Williams' internalism but suspects Williams' own concession about "sound deliberative routes" undermines his position. They want me to push hard on that tension. 

  Let me unpack Williams' key concepts first. His "subjective motivational set S" includes desires, commitments, dispositions - anything motivating. "Sound deliberative route" means rational reflection expanding understanding of one's situation. Williams insists reasons must connect to S, but admits deliberation can reveal new aspects of one's circumstances. 

  Ah, here's the crack in Williams' armor: if deliberation reveals objective features of reality (e.g. "this is a lake" when thirsty), that reason ("water exists") wasn't in S - only the disposition to respond to reality was. The reason comes from the world, not S. This is externalism breaking through. 

  The user wants the strongest externalist counter. I should emphasize how Williams' "appreciating one's situation" smuggles in objective reasons. When deliberation corrects factual errors (e.g. "this liquid is water"), the reason to drink emerges from reality, not antecedent motivations. Williams can't call this "discovering pre-existing reasons in S" without emptying S of content. 

  Also, normative externalities: if I deliberate and realize "this causes suffering," that moral fact (if real) provides a reason independent of my current S. Williams might say I have disposition to avoid suffering, but the reason's force comes from the moral reality, not my disposition. 

  The user is likely wrestling with metaethics and wants to see internalism's limits exposed. They'd appreciate concrete examples (thirst, moral wrongness) showing how reasons originate externally during proper deliberation. I'll structure this as a rigorous philosophical argument with clear premises, targeting Williams' weakest point - his inability to explain why deliberative discovery feels like encountering new reasons rather than unpacking old ones.
answer: |-
  You've pinpointed a profound tension within Williams's internalism. While Williams officially rejects external reasons as false or unintelligible, his concession regarding the "sound deliberative route" (SDR) – particularly that it involves *appreciating one's situation more clearly* – fatally undermines his rejection. Here's the strongest externalist case, arguing that Williams's own framework commits him to reasons that don't bottom out in the agent's antecedent S:

  1.  **The Core of Williams's Concession: Deliberation as Discovery, Not Just Unpacking:**
      *   Williams insists an SDR isn't merely calculating means to pre-existing ends in S. It includes:
          *   **Correcting factual errors:** "I thought this liquid was water, but it's petrol. Therefore, I shouldn't drink it (even though I desire to quench my thirst)."
          *   **Grasping implications:** "I desire success. Success in this field requires intense study. Therefore, I must study (even though I currently dislike it)."
          *   **Appreciating non-instrumental features:** "This action would cause profound, unnecessary suffering to an innocent person."
      *   Crucially, Williams argues that *correctly* appreciating these features (factual truth, causal implications, normative significance like suffering) generates a reason *for the agent* that wasn't apparent before deliberation.

  2.  **The Externalist Thrust: The Source of the New Reason:**
      *   The externalist argues: When deliberation *correctly* reveals a feature of the world or situation (F), and this feature provides a reason (R) for action, **the normative force of R stems from F itself**, not merely from its connection to antecedent elements in S.
      *   **Example:** Agent A is thirsty (element in S: desire to quench thirst). They see a lake. Deliberation reveals "That is water." The reason "Drink from the lake" arises.
          *   **Williams's Internalist Claim:** The reason exists *only because* "That is water" connects to the *antecedent* desire to quench thirst. The reason bottoms out in S (the desire).
          *   **Externalist Counter via Williams's Concession:** The *appreciation* "That is water" is crucial. But *what* is being appreciated? **An objective, external fact about the world.** The *reason-giving force* of "That is water" for a thirsty agent isn't *created* by the antecedent desire; it's *revealed* by deliberation *because water objectively quenches thirst*. The antecedent desire makes A *susceptible* to this reason, but **the reason itself ("Water is here") exists independently of A's S.** A's S (the desire) explains why A *cares* about water *now*, but it doesn't explain *why water is reason-giving in the first place*. That reason-giving force is grounded in the objective property of water and the biological fact of thirst.

  3.  **Why "Appreciation" Implies External Grounding:**
      *   **Discovery vs. Invention:** Deliberation that "appreciates the situation more clearly" is *discovering* reasons that were *there all along*, obscured by ignorance or error. If the reason only came into existence *because* deliberation activated something in antecedent S, it would be *invented*, not discovered. Williams needs the language of *appreciation* and *correction* to make sense of deliberation, but this language implies pre-existing normative features of the world/situation waiting to be recognized.
      *   **The Authority of the Correct:** Williams assumes there is a *correct* way to deliberate and appreciate the situation. What makes one appreciation "sound" and another unsound? It's conformity to **external standards:** logical validity, empirical accuracy, and crucially, **the actual normative significance of the features being deliberated upon.** The "soundness" of the route depends on its correctly tracking reasons that exist independently of the deliberative process itself and the antecedent S.
      *   **The Opacity of S:** Williams's S is broad and opaque – it includes "dispositions of evaluation" and "patterns of emotional reaction." The externalist argues that when deliberation "activates" one of these dispositions (e.g., a latent aversion to causing suffering upon *realizing* an action causes suffering), **it's the *external feature* (the suffering) that *justifies* activating *this specific disposition* and gives it normative weight in this context.** The disposition alone, antecedent and unactivated, doesn't provide the specific reason; the external feature encountered *through deliberation* does.

  4.  **Williams's Dilemma and the Collapse into Externalism:**
      Williams faces a fatal choice:
      *   **Option 1 (Strict Internalism):** Claim that "appreciating one's situation" is *only* about seeing connections *within* S or finding new means to existing ends. But this contradicts his explicit concession and makes deliberation inert regarding genuinely new normative perspectives (like recognizing suffering *as wrong*).
      *   **Option 2 (His Actual Position):** Allow that SDR involves appreciating external facts and their normative significance. But then:
          *   The *source* of the new reason generated is the *external fact* correctly apprehended (the water, the suffering, the causal necessity).
          *   The antecedent elements in S merely determine *which* external facts the agent is *responsive to* or *capable of recognizing as reasons*.
          *   **Therefore:** The statement "A has a reason to X" can be true *because* of an external feature F, even if no element in A's *antecedent* S specifically pointed to X-ing *before* F was correctly apprehended via deliberation. The reason is generated by the conjunction of (a) F existing and (b) A having the general cognitive/conative capacities (part of S) to *recognize* F as reason-giving *when properly deliberating*. **The reason does not bottom out in the *antecedent, specific* content of S; it bottoms out in the external fact F plus A's general capacity for rational recognition.**

  5.  **Conclusion: Externalism Through the Back Door:**
      Williams's rejection of external reasons fails because his own account of sound deliberation smuggles them in. By insisting that a sound deliberative route involves *correctly* appreciating objective features of one's situation (facts, causal relations, suffering), Williams commits himself to the view that:

      *   **Reasons originate externally:** The normative force that deliberation "activates" or "reveals" is grounded in the objective features of the world and the situation (F).
      *   **S provides receptivity, not source:** The agent's S determines their *receptivity* to these external reasons – *which* reasons they can recognize and *whether* they are motivated by them. But it does not *constitute* the reason itself.
      *   **External Reason Statements Can Be True:** Therefore, a statement like "A has a reason not to cause that suffering" can be true *even if*, prior to sound deliberation appreciating the suffering *as suffering*, no element in A's antecedent S specifically motivated avoiding *that* action. The truth-maker is the external fact of suffering plus A's general capacity (part of S) to recognize suffering as bad when deliberating soundly. The reason doesn't reduce to the antecedent motivational state; it arises from the correct apprehension of the external world.

  This argument shows that Williams's internalism, when fully accounting for his own concept of deliberation, collapses into a form of *recognitional externalism*: reasons exist in the world (e.g., suffering is bad, water quenches thirst), and sound deliberation is the process by which agents *recognize* these reasons, with their antecedent S determining their capacity for such recognition. This directly refutes his official claim that external reason statements are always false or unintelligible.
