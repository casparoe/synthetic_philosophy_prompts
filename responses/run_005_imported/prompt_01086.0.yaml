prompt: |-
  kind of a weird thing that's been bugging me at work. We acquired a smaller startup, and their engineers name microservices like 'user-service' while our team has always gone with 'svc-user' — nobody can point to an actual technical reason one is better than the other. But running both schemes in the same infra causes constant on-call screwups (wrong repo, wrong dashboard, etc), so leadership mandated everyone switch to one scheme about 3 months ago. Everyone agreed in the meeting, but half of us still quietly name new services the old way 'just this once,' and even people who dont care which scheme wins seem to be hanging back, like they're not sure everyone else is actually gonna comply. Why does something this arbitrary get so sticky, and is there an actual way to force a switch like that, or does it just have to fade out on its own as people join and leave over time?
reasoning: |-
  Okay, the user is dealing with a naming convention conflict after a company acquisition. Their team uses 'svc-user' while the acquired startup uses 'user-service'. Leadership mandated a switch to one scheme three months ago, but compliance is spotty. People keep using the old naming 'just this once,' and there's hesitation even among those who don't care. The user wants to understand why this arbitrary change is so sticky and how to enforce it.

  First, I need to figure out the root causes of resistance. Why do people resist such a minor change? Some possible reasons come to mind. Inertia is a big one; habits are hard to break. If someone has been using 'svc-user' for years, it's automatic. Then there's identity—teams might associate their naming convention with their group identity. Switching feels like losing part of their culture. 

  Also, there's the bystander effect. People wait to see if others will comply first. If no one else changes, why should they? Plus, there might be a lack of immediate consequences. If there's no enforcement, people might think it's not serious. 

  The user mentioned that leadership mandated the change, but without follow-through. That's a key point. Mandates without support or tools to implement them often fail. Are there linters or automation to enforce the naming? Probably not, since people are still using the old way. 

  Another angle is the perceived arbitrariness. Since both schemes are technically equal, people might not see the value in changing. The user pointed out that the inconsistency causes on-call issues like wrong repos or dashboards. But maybe that problem isn't communicated effectively. If engineers don't feel the pain directly, they might not prioritize the change. 

  Looking at solutions, the user asked if forcing the switch is possible or if it has to fade out over time. Forcing it requires more than a mandate. They need tooling—like automation that flags incorrect names during creation. Also, integrating checks in CI/CD pipelines or repository permissions could help. 

  Visibility is another factor. If leadership doesn't track compliance, people assume it's not important. Public dashboards showing adoption rates might motivate teams. Celebrating milestones could reinforce the change. 

  But there's also the human aspect. Engineers might resist if they weren't involved in the decision. Even though they agreed in the meeting, top-down decisions can feel imposed. Including them in the solution, like forming a working group, might increase buy-in. 

  The user's deeper need is likely about effective change management. They want to prevent operational issues caused by inconsistency but are facing cultural resistance. They might also be frustrated with the lack of progress after three months. So, the answer should address both technical enforcement and cultural strategies.
answer: |-
  This is a classic case of "bikeshedding" meets organizational inertia, and it's far more common (and frustrating) than you'd think. The stickiness comes from a blend of human psychology, team identity, and flawed change management. Here's why it's hard, and what *actually* works to force the switch:

  **Why It's So Sticky (The Root Causes):**

  1.  **Inertia & Muscle Memory:** Naming things is a fundamental, frequent action. People default to what they know instantly without thinking. "svc-user" or "user-service" is burned into neural pathways through repetition. Changing requires constant conscious effort, which feels inefficient.
  2.  **Low Perceived Value vs. High Perceived Cost:** Engineers (rightly) see *no technical difference*. The *only* benefit ("reducing on-call screwups") feels abstract and distant *to the individual naming the service*, while the *cost* (remembering the new rule, potential momentary confusion) is immediate and personal. Why exert effort for an intangible, shared benefit?
  3.  **Tribal Identity & Loss Aversion:** The naming convention became part of each team's identity ("*We* are the 'svc-' people"). Switching feels like losing a piece of that identity or "surrendering" to the acquired team. Even those who don't care might subconsciously resist "the other side's way."
  4.  **The "Just This Once" Trap:** Humans are terrible at predicting their own future behavior. "Just this once" feels harmless, but it sets a precedent (for themselves and others), reinforces the old habit, and signals non-compliance is tolerated.
  5.  **Bystander Effect & Lack of Trust:** "If *they* aren't switching, why should I?" Everyone is waiting for everyone else to move first. The initial lack of universal compliance after the mandate eroded trust that *everyone* would actually follow through.
  6.  **Lack of Immediate Consequences:** There are no automated blocks or immediate penalties for using the old scheme. The consequences (on-call confusion) are delayed and diffuse, hitting others later.
  7.  **Perceived Arbitrariness:** Because leadership couldn't articulate a *strong technical reason* beyond operational efficiency (which *is* valid, but feels weak to an engineer comparing two strings), the mandate feels capricious, making resistance feel justified.
  8.  **The "Sunk Cost" of Existing Tooling:** Dashboards, scripts, internal docs might implicitly assume one naming pattern. Changing feels like creating *new* work (updating scripts/docs) on top of the naming change itself.

  **How to Actually Force the Switch (It Won't Happen Organically Fast Enough):**

  Relying on attrition (people leaving) is slow and unreliable. **Enforcement requires removing the ability to choose the wrong way.** Here's what works:

  1.  **Technical Enforcement at the Source (MOST CRITICAL):**
      *   **Automate Service Creation:** Build (or mandate the use of) a self-service tool/CLI for generating *new* service stubs. This tool *forces* the new naming convention (`svc-user`). No manual repo creation.
      *   **CI/CD Pipeline Guardrails:** Implement checks in your CI/CD pipeline that *fail the build* if the service name in the deployment manifest/configuration doesn't match the new pattern (`svc-*`). This catches "just this once" instantly.
      *   **Repository Template Enforcement:** If using GitHub/GitLab, enforce repository creation from a template that pre-populates the correct naming structure in key files.
      *   **Infrastructure Provisioning Checks:** Tools like Terraform can validate resource names (e.g., AWS ECS service name, K8s deployment name) match `svc-*` before applying.

  2.  **Make Compliance Visible & Celebrate Wins:**
      *   **Public Dashboard:** Create a simple dashboard showing the percentage of *new* services created in the last X months using the correct convention. Track progress publicly.
      *   **Shout Outs:** Recognize teams/individuals who consistently use the new pattern in team meetings or internal comms. Positive reinforcement matters.
      *   **"Last Old-Style Service" Ceremony:** When the last service using the old pattern is finally renamed (see point 4) or retired, mark it.

  3.  **Address the "Why" Relentlessly & Specifically:**
      *   **Quantify the Pain:** Next time an on-call incident happens *because* of naming confusion (wrong repo, wrong dashboard, misrouted alert), **document it explicitly and publicly.** "Incident PIR-123: Root cause included difficulty locating 'user-service' dashboard during outage; correct dashboard was 'svc-user'. Action item: Enforce naming convention to prevent future confusion." Link this pain directly to the rule.
      *   **Frame it as Operational Hygiene:** Emphasize it's not about technical superiority, but about **reducing cognitive load, speeding up incident response, and preventing mistakes during high-stress situations.** This is a *real* engineering benefit.

  4.  **Address the Legacy (But Carefully):**
      *   **Mandate Renames *Only* on Significant Change:** Don't force mass renames of stable old services (disruptive!). Instead, mandate that *any* significant update (major version bump, rewrite, major feature add) *must* include a rename to the new convention. This gradually migrates the important, active ones.
      *   **Tooling for Discovery/Confusion:** Invest slightly in tooling (e.g., a central service registry, improved dashboard/search that handles aliases) to *temporarily* mitigate confusion *while* the new standard takes hold for new services. Don't let this become an excuse to avoid the standard.

  5.  **Leadership Follow-Through (The Hard Part):**
      *   **Walk the Talk:** Leaders must *never* say "just this once." They must use the tooling and enforce it in their own teams.
      *   **Address Non-Compliance Directly (Privately):** If someone creates `user-service-v2`, their direct manager needs to have a calm conversation: "We agreed on `svc-user` to prevent on-call issues. Please rename it to comply with the standard. Let me know if the tooling is blocking you." No public shaming, but clear expectation setting.
      *   **Provide Resources:** Dedicate *small* amounts of time (e.g., a sprint ticket) to update team scripts/docs if they are a genuine blocker to adopting the new naming during development.

  **Why this approach works:**

  *   **Removes Choice:** Automation and guardrails make compliance the default and easiest path. "Just this once" becomes technically impossible.
  *   **Makes Benefits Concrete:** Linking the rule directly to real incidents makes the "why" undeniable.
  *   **Focuses Energy:** Concentrating effort on *new* services and significant changes is practical and impactful.
  *   **Builds Momentum:** Visibility and recognition turn compliance into a positive team behavior.

  **Forget "agreement in a meeting."** Lasting change, especially on something habitual and seemingly minor, requires **systemic enforcement and constant reinforcement.** Implement the technical guardrails, consistently demonstrate the *operational* cost of non-compliance, and leadership must actively support the standard. Without these, the old names will persist indefinitely, fueled by inertia and "just this once."
