  Biggest challenge: Making the "asymptotic defense" vs "finite data" clash feel real. The pro side must genuinely engage the "additive constant swamps datasets" point, not dismiss it. Similarly, the anti side needs to admit asymptotic idealization has theoretical value while crushing its practicality.

