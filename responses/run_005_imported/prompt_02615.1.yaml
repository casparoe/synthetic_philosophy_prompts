  I think the key is acknowledging that P.F. Strawson isn't trying to refute Galen's point. He's saying that even if Galen is technically right about ultimate responsibility, it doesn't matter for how we actually live. Our practices of blame and gratitude aren't based on some deep metaphysical self-creation; they're based on whether someone's actions reflect ill will or good will toward us. 

  But does this satisfy Galen's challenge? Probably not, because Galen is asking "Can we *truly* deserve anything?" while P.F. is answering "Here's why we *treat* each other as deserving." It's like one is questioning the foundation of justice itself while the other is describing how justice functions in society. 

  The user seems genuinely wrestling with this—they're not just looking for facts but for philosophical insight. I should emphasize that both arguments are valid within their own domains, but they're ships passing in the night. Galen wins on metaphysics; P.F. wins on practicality. The real takeaway might be that "responsibility" means different things in different contexts. 

