  First, I need to make sure I understand both arguments clearly. Galen's Basic Argument claims ultimate responsibility is impossible because you'd need to be responsible for your own character, leading to infinite regress. Even indeterminism doesn't help because randomness doesn't make you the author of yourself. P.F. Strawson, on the other hand, shifts the focus from metaphysics to our everyday practices of holding people responsible, arguing that these reactive attitudes are fundamental to human relationships and don't depend on metaphysical free will.

