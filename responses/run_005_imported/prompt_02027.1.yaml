     Explanation:

     Why the reversal? Both scoring rules are strictly proper, meaning that they encourage the forecaster to report their true beliefs. However, they penalize errors differently. The Brier score (quadratic) is bounded (between 0 and 1 for binary events) and symmetric. The logarithmic score is unbounded and heavily penalizes forecasts that are very confident (close to 0 or 1) and wrong. 

     In this example, Dinah is often very confident (0.95, 0.97) and correct, which gives her a very good Brier score (because the penalty for being slightly off when correct is small). However, when she is wrong (in races 9 and 10), she gets a huge penalty in the log score (because -log(0.03) is very large). Renata, being cautious, doesn't get as much reward in the Brier score when she is correct (because she wasn't confident enough) and doesn't get as severely penalized in the log score when the unexpected happens (because she assigned a non-negligible probability to the underdog).

     The boundedness of the Brier score vs the unboundedness of the log score plays a role: the log score can be made arbitrarily bad by a single extreme mistake, while the Brier score is capped.

     This reversal is possible because the two scoring rules have different sensitivities to extreme events. The logarithmic score is more sensitive to rare events that occur against high confidence.

     Within accuracy-first epistemology, this relativity is a known issue and has been discussed (e.g., by Joyce, Pettigrew, and others). It does put pressure on the idea that there is a single, theory-neutral notion of accuracy. Some argue that the scoring rule should be chosen based on the practical context (e.g., the log score is motivated by information theory and is additive for independent events, while the Brier score might be more appropriate in some decision-making contexts). Others might see this as a reason to look beyond strict propriety or to seek additional constraints. It is not just a shrug-worthy technicality because it challenges the uniqueness of the accuracy measure. However, it is also recognized that different scoring rules might be appropriate for different purposes.

     For your characters, Dinah might argue that the Brier score is more standard in forecasting competitions and that the log score's unboundedness makes it hypersensitive to flukes. Renata might counter that the log score respects the gravity of being completely wrong when you've ruled out the possibility and that it better captures the information-theoretic content of a forecast.

     This example should provide a solid basis for the scene.
