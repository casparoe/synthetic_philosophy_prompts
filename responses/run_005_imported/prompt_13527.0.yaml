prompt: |-
  As my newsroom's science correspondent, I also sit on its editorial standards committee, which is drafting guidance on how our reporters may describe studies of the effect of race on outcomes such as loan denial, disease risk, or sentencing length—studies that rely on statistical adjustment rather than randomized experiments. One camp wants a blanket rule against causal language ('associated with,' never 'causes'), since no study can change a person's race while holding everything else about them fixed, and it's doubtful the relevant counterfactual is even well defined. A second camp argues that the same standard, applied consistently, would also bar causal claims we make without hesitation (age causes cognitive decline, smoking causes cancer), and that it quietly relabels documented discrimination as mere correlation. A third wants to permit causal language only when a study manipulates something concrete and assignable, such as perceived race signaled on a resume or rental application, rather than race 'itself.' Please draft the committee's short guidance memo, due before next month's style-guide revision: give reporters a rule they can actually apply, and engage honestly with the strongest objection to whatever you recommend.
reasoning: |-
  Okay, the user is a science correspondent on an editorial standards committee drafting guidance about using causal language in studies on race and outcomes. They describe three camps with different views: one against any causal language, one for it in some cases, and one that allows it only when manipulating perceived race. 

  Hmm, this is a nuanced ethical and scientific challenge. The core tension is between statistical rigor (race isn't manipulable) and real-world impact (systemic discrimination clearly exists). The user needs practical guidance that doesn't oversimplify but also doesn't paralyze reporters. 

  I notice they're particularly concerned about two things: giving reporters an actionable rule, and honestly addressing counterarguments. That suggests they value both practicality and intellectual integrity. The memo can't just be theoretical—it has to work on tight deadlines.

  *Pauses to consider the camps* 
  The first camp's point about counterfactuals is technically valid but feels disconnected from how race operates structurally. The second camp rightly points out the inconsistency—we say "smoking causes cancer" without randomized trials. The third camp's focus on perceived race is clever but risks reducing racism to individual acts. 

  *Brainstorming the approach*
  The guidance should: 
  - Acknowledge race isn't biologically causal but emphasize structural mechanisms 
  - Distinguish "race causes" (problematic) from "racial discrimination causes" (accurate) 
  - Ban passive constructions that obscure agency (e.g., "Blacks were denied loans") 

  Biggest objection will be: "But we say 'age causes dementia' without this rigor!" Need to prep a rebuttal about fundamental differences—age effects are physically mechanistic, while race effects are socially constructed through systems. 

  *Structuring the memo*
  Opening should validate all perspectives to build trust. Then the rule: causal language only when mechanisms are specified (discrimination, bias, etc.). Examples will be crucial—show the "how." Finally, address the age/cancer comparison head-on in the counterargument section. 

  *Double-checking* 
  Am I being both precise and practical enough? Reporters need to file stories fast. The "specify the mechanism" framework gives them a checklist: if they can't fill in "via [X]", they shouldn't use "causes."
answer: |-
  ## Editorial Guidance: Reporting on Race and Outcomes in Observational Studies  
  *For inclusion in Section 4.3: "Causal Language in Social Science Reporting"*

  **The Rule:**  
  **Use causal language ("causes," "impacts," "leads to") ONLY when the study explicitly identifies and measures a specific, actionable mechanism (e.g., discrimination, bias, structural barrier) linking race/ethnicity to the outcome.** If the mechanism is unnamed, undefined, or abstractly attributed to "race itself," default to correlational language ("linked to," "associated with," "higher/lower rates among").  

  **How to Apply:**  
  1. **Ask: "What is the proposed mechanism?"**  
     - ✅ **Permit causal language** if the study directly tests a *mechanism* like:  
       *   *Discriminatory practices* (e.g., bias in loan officer decisions, algorithmic bias in sentencing tools).  
       *   *Structural factors* (e.g., racially segregated neighborhoods leading to pollution exposure).  
       *   *Measured inequities* (e.g., disparities in healthcare access *documented within the study*).  
       > *Example:* "Racial discrimination in lending **causes** higher loan denial rates for Black applicants" (if study isolates lender bias).  
     
     - 🚫 **Use correlational language** if the study:  
       *   Treats race as a biological or inherent causal factor.  
       *   Only statistically adjusts for race without probing *how* it operates.  
       *   Invokes vague "racial disparities" without evidence of a mechanism.  
       > *Example:* "Race is **associated with** disparities in asthma rates" (if mechanism is unexamined).  

  2. **Always specify the mechanism** in your reporting:  
     - ❌ Avoid: "Race causes longer sentences."  
     - ✅ Use: "Racial bias in risk assessment tools **causes** longer sentences for Black defendants."  

  3. **Passive constructions obscure agency:** Replace "Blacks were denied loans more often" with "Lenders denied loans to Black applicants more often."  

  ---

  **Engaging with the Strongest Objection:**  
  *Objection: "This unfairly restricts causal claims about race while allowing them for age/smoking—despite similar observational evidence. It risks downplaying systemic racism as mere 'correlation.'"*  

  **Our Response:**  
  This concern is valid. Age and smoking are *mutable* or *mechanistically defined* attributes: aging involves biological processes (e.g., neuronal loss); smoking delivers carcinogens. **Race is socially constructed and not manipulable.** The causal force isn't race itself, but *racism*—a system of biases, policies, and barriers.  

  Our rule doesn’t deny causality; it demands precision. We *should* say "smoking causes cancer" because biology defines the mechanism. Similarly, we *must* say "racial discrimination causes loan denials"—not because "race causes denials," but because *specific discriminatory acts* are the mechanism. **Equivocating on this conflates social constructs with biological processes and obscures accountability.** When mechanisms like discrimination are documented, causal language is not just permitted—it’s essential for truthfully describing harm.  

  ---  
  **Why This Works:**  
  - **Practical:** Reporters apply a concrete test ("Name the mechanism").  
  - **Accurate:** Reflects consensus that race isn’t biological but racism is causal.  
  - **Accountable:** Exposes systems responsible for inequities.  
  - **Consistent:** Demands the same mechanistic rigor we apply to health/science stories.  

  **Effective immediately. Questions? Contact the Standards Committee.**  

  ---  
  *Rationale for Style Guide Inclusion:* This avoids blanket bans (Camp 1) and abstract "race itself" framing (Camp 3), while addressing Camp 2’s concern by requiring causal clarity where mechanisms like discrimination are evident. It aligns with NASEM guidance on interpreting race in science.*
