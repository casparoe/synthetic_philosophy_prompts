  For example, suppose we condition on B being true. Then P(A→B|B) should be high since B is true. But if we condition on not-B, P(A→B|~B) should be low. Yet if A→B is just a proposition, its probability should update coherently across these cases. 

  The key tension is that A→B can't simultaneously act like a standard proposition (with fixed truth values) and magically track P(B|A) which depends on the current probabilistic state. It's like demanding a single thermometer show different temperatures in the same room depending on who's looking. 

  I should use the "brittle material" analogy - conditionals behave differently when their antecedent is true versus false, but probability functions treat propositions uniformly. Forcing them to align everywhere is like demanding rubber to be both stretchy and rigid at the same time. 

