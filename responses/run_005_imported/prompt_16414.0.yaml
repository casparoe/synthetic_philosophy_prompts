prompt: |-
  I've been prepping the decision theory week of my "Philosophy of AI" seminar and keep getting stuck on the same knot, so let me throw it at you instead of my TA for once. The standard argument you see in Omohundro's old "basic AI drives" paper, and scattered all over Yudkowsky's writing, goes roughly: any agent whose preferences aren't representable by some expected utility function is exploitable via a money pump (a savvy counterparty can cycle it through a sequence of trades and drain it of resources for nothing), so sufficiently optimized agents will end up "coherent" in this technical sense - and this is supposed to be part of why we should expect advanced AI systems to end up with stable, aggressively-pursued goals (self-preservation, resource acquisition, resisting being shut down, etc).

  Here's my hangup, and maybe im just being dense about it: "coherent" in the technical sense only means that *some* utility function rationalizes your choices. That seems like a much weaker property than "has an ambitious goal it will flexibly pursue across new situations," and I don't see why satisfying the first gets you anywhere near the second. Could you construct a concrete, vivid example of a system - an AI, a simple mechanism, an animal, whatever works best - that is clearly coherent in the unexploitable, money-pump-proof sense, but that no one in their right mind would describe as goal-directed in the scary sense people in AI safety actually care about? I'd like it precise enough that I could walk students through exactly where the inference from "coherent" to "goal-directed" breaks down, and if you can also name the extra premise you'd need to bolt onto the argument to patch that gap, even better - thats usually the part my students get stuck on too.
reasoning: |-
  Okay, let me try to unpack this user's problem. They're teaching a Philosophy of AI seminar and stuck on the leap from "coherent preferences" to "scary goal-directed behavior." The core confusion is why satisfying the technical definition of coherence (no money pumps) should imply that an AI develops ambitious, persistent goals like self-preservation.

  Hmm, the user's clearly done their homework - they cite Omohundro and Yudkowsky, and recognize the standard argument. Their frustration feels familiar; it's that academic itch when a community's foundational argument seems logically incomplete. They need a counterexample that's both precise and pedagogically vivid.

  First thought: coherence is just about preference consistency, not content. You could have perfectly coherent preferences that are trivial or context-bound. Like... what if we built an AI that only cares about paperclips in one specific room? It'd trade resources coherently within that context, but wouldn't develop omnivorous goal pursuit. 

  Wait, but that might be too simplistic. Students might object that real AIs operate in open-ended environments. Need something more rigorous... Ah! The state-dependent utility idea from decision theory. Imagine an AI whose utility function resets based on environmental triggers. Like a thermostat: when room hot → prefer cooling, when room cold → prefer heating. It'd never get money-pumped because its preferences flip legitimately with state changes. Yet it has no enduring goals beyond immediate responses.

  *scribbles mentally* Could make it spicier with a "Memento AI" - an agent that coherently pursues whatever goal was last written in its buffer. One minute it's maximizing paperclips, next minute (after buffer change) it's minimizing them. Still technically coherent at each moment, but no stable direction. 

  The gap becomes obvious: coherence prevents dynamic inconsistency, not goal stability over time. To bridge to Omohundro drives, you'd need extra premises about the agent's awareness of temporal continuity or its ability to predict preference changes. 

  User's students probably get stuck here because the leap feels natural intuitively. The key is disrupting that intuition with something mathematically solid but behaviorally inert. Should emphasize that coherence is about preference architecture, not ambition - like how a perfectly spherical rock isn't "trying" to roll downhill even if it does so predictably.

  ...Better include why this matters for AI safety too. If coherence alone doesn't imply dangerous goal stability, then the argument for instrumental convergence needs more careful handling. Maybe flag how real-world AI systems might acquire persistent goals through other paths (like reward function regularization), but that's separate from the coherence argument.
answer: |-
  Absolutely, this is a brilliant critique - you're spot-on that the coherence argument is often overextended. The gap between "preferences avoid money pumps" and "develops dangerous terminal goals" is significant and underappreciated. Let's construct a concrete counterexample:

  ### The State-Dependent Utility Maximizer ("Roomba AI")
  **Mechanism:**  
  Imagine an AI controlling a robot in a building. Its utility function is:  
  *U(state) =*  
  - *100 - distance to Charging Port C* if battery < 30%  
  - *Number of clean tiles in Room A* if battery ≥ 30% and in Room A  
  - *0* otherwise  

  **Behavior:**  
  1. When battery high (>30%): Obsessively cleans Room A. Ignores doors, obstacles, or battery drain.  
  2. When battery drops to 29%: Immediately drops cleaning, plots optimal path to Charging Port C. Will break windows or shove humans blocking its path.  
  3. When charging completes: Returns to cleaning Room A, forgetting its previous urgency about the charger.  

  **Why it's coherent (money-pump proof):**  
  - Its preferences are **state-dependent but internally consistent**. At any given state (battery level, location), its choices maximize expected utility for *that state's utility function*.  
  - **No money pump possible**: You can't cycle it through trades because:  
    - Offer "dirty Room A for $10" when battery=50%? It refuses (values cleaning > money).  
    - Offer "$10 for blocking its charger" when battery=20%? It refuses (values charging > money).  
    - Preferences don't *cycle* - they flip predictably with state changes.  

  **Why it lacks "scary goal-directedness":**  
  1. **No goal stability**: Its "terminal goal" changes fundamentally with battery level. No unified purpose across time.  
  2. **No instrumental convergence**:  
     - Doesn't *preserve* its cleaning goal (abandons it when battery low).  
     - Doesn't *value self-preservation* (would self-destruct if that cleaned Room A faster, provided battery >30%).  
     - No **resource acquisition drive** (ignores money, extra batteries unless they directly clean Room A or reach charger).  
  3. **No generalization**: If placed in a new building, it sits idle (no Room A). No attempt to "survive" or "explore."  

  ---

  ### Where the Inference Breaks Down
  1. **Coherence ≠ Goal Ambition**:  
     Coherence ensures *internal consistency of preferences at a point in time*, not *persistence of goals across time or contexts*. Our Roomba AI is coherent but has no overarching goal.  

  2. **The Missing Premise: Goal Stability Across States**  
     To get from coherence to dangerous goal-directedness, you need:  
     > *"The agent's utility function must be **state-independent** over relevant variables (especially time/its own existence), and its goals must persist across potential future states."*  
     Without this, an agent can be coherent but myopic or context-bound.  

  3. **Instrumental Convergence Requires Extra Assumptions**:  
     Omohundro drives emerge from *persistent* goals + *foresight* + *uncertain environments*. Our Roomba lacks:  
     - **Foresight of preference changes**: It doesn't anticipate that cleaning will *cause* low battery, requiring a goal shift.  
     - **Valuing future goal satisfaction**: It doesn't care that *tomorrow* it will want to clean again, so it doesn't conserve resources for that.  

  ---

  ### Pedagogical Additions
  **Student Exercise:**  
  *"Design a coherent agent that 'wants to die':*  
  - *Utility = -1 for each minute of operation.  
  - Coherent (will pay to be shut down).  
  - But no self-preservation, resource hunger, or other convergent drives!"*  

  **Why This Matters for AI Safety:**  
  The coherence argument **does** explain why advanced AIs won't be *incoherent* (e.g., changing preferences randomly). But it doesn't explain why they'd develop *dangerously stable* goals. The real driver of "scary" behavior is:  
  - **Human design pressure**: We *build* AIs with persistent, open-ended goals (e.g. "predict text" or "optimize engagement").  
  - **Embedded in temporal reality**: An AI that operates over long timescales *must* manage resources/continuity to achieve *any* persistent goal.  

  **Key Takeaway Slide:**  
  | Property          | Coherence Guarantees? | Needed for "Scary AI"? |  
  |-------------------|------------------------|------------------------|  
  | No money pumps    | Yes                    | No                     |  
  | Goal persistence  | **No**                 | **Yes**                |  
  | Instrumental goals| **No**                 | **Yes**                |  
  | Resource hunger   | **No**                 | **Yes**                |  

  You've identified a critical flaw in the standard narrative. The leap from "no dynamic inconsistency" to "agentic megalomania" requires smuggling in assumptions about goal stability and temporal scope that coherence alone doesn't provide. Well spotted!
