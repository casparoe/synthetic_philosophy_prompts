  Had a whole argument with my friend this weekend about a rewilding project near us, their turning a big stretch of old farmland back into native forest. She's thrilled about it, more habitat, more wildlife, obviously a good thing. I said I wasn't so sure it's that simple, since most wild animals (think insects, fish, frogs, mice, that kind of thing) have huge numbers of offspring and only a tiny fraction ever survive past infancy, so more habitat might just mean way more animals getting born only to starve, get eaten, or die of parasites within weeks, more total suffering overall, not less. She said that's a bizarre, almost misanthropic way to look at a tree-planting project, and that nature doesn't need my spreadsheet. I didn't argue it very well at the time and now I'm honestly not even sure I believe myself. Is there something real behind what I was trying to say, or is she right that I'm just massively overthinking a nice conservation project?
