  But the paradox arises with common knowledge of rationality (CKR). If both players are rational and know that, and know that they know, ad infinitum, then backward induction holds. However, in practice, if Player 1 passes, it challenges the assumption. If Player 1 passes, they must believe Player 2 might pass too, which contradicts CKR because Player 2 should always take on their turn. So the very act of passing implies that Player 1 doesn't fully believe in CKR, making the backward induction conclusion unstable. 

  The user's friend is likely referring to this logical hole. Backward induction relies on CKR, but if Player 1 passes, it shows they doubt Player 2's rationality, which then makes passing rational. This creates a paradox because the theory assumes CKR, but the players' actions can undermine that assumption. 

