  Point (2) by Callum:
  He objects that we routinely make irreversible decisions based on others' testimony (like informed consent). If firsthand acquaintance were required, then informed consent would be a sham.

  Evaluation:
  Callum is correct that we often rely on testimony for decisions about unknown outcomes. However, Elif's point is not that we need firsthand experience for any decision, but that the transformation of values makes this case special. Callum's analogy to ordinary informed consent might not fully address the transformative aspect. So his point is partially right but misses the nuance of value transformation.

