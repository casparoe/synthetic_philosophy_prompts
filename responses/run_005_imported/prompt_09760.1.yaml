  For the solutions, common knowledge of rationality is key in the Centipede Game. If players aren't perfectly rational or doubt each other's rationality, cooperation can occur. For the exam paradox, self-reference is the issue. Defining "surprise" in a way that avoids circularity resolves it. These solutions address different aspects: one focuses on epistemic conditions, the other on logical definitions.

