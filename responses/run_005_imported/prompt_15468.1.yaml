  ## MFA Program Student Appeals Committee Decision Memorandum

  **Date:** October 26, 2023  
  **To:** MFA Program Faculty, Administration, and Relevant Parties  
  **From:** Student Appeals Committee  
  **Subject:** Appeal of Workshop Grade - Student ID [Redacted], Fiction Concentration  
  **Committee Members:** [Your Name, Chair], [Member 1], [Member 2], [Member 3], [Member 4]

  **I. Case Summary**

  This memorandum addresses the formal appeal submitted by a second-year fiction student ([Student ID]) regarding a failing grade received in Workshop [Course Number/Section] taught by Professor [Professor's Name] during the Fall 2023 term. The student contends that the failing grade stems not from objective craft deficiencies, but from a fundamental incompatibility between her stylistic approach – rooted in Igbo oral traditions (emphasizing proverb, digression, direct address, and ornamentation) – and the minimalist aesthetic paradigm (exemplified by Carver/Hemingway) which she asserts dominates the workshop framework and Professor [Professor's Name]'s evaluative lens. The student further alleges a pattern of disproportionately harsh evaluation by Professor [Professor's Name] towards students working in non-minimalist traditions, citing two prior instances over the last three years.

  Professor [Professor's Name] defends the failing grade as a valid assessment based on craft principles concerning prose economy, narrative focus, and reader engagement ("overwrought," "purple," "refused to trust the reader"). He argues that interpreting critical aesthetic judgments as evidence of bias fundamentally undermines the exercise of expert literary evaluation within an MFA program, potentially rendering rigorous critique indefensible.

  **II. Committee Deliberations & Reasoning**

  The Committee engaged in thorough review and debate, examining the student's submitted manuscript, Professor [Professor's Name]'s written evaluation, the student's appeal statement, supplementary information regarding the cited prior instances, and relevant program policies. We acknowledge the significant concerns raised by both parties:

  1.  **Validity of Literary Judgment:** We affirm Professor [Professor's Name]'s central point: MFA programs exist to cultivate and rely upon expert literary judgment. Trained faculty must be able to evaluate work based on craft principles – such as the effectiveness of imagery, pacing, narrative coherence, and rhetorical control – even when those judgments involve aesthetic preferences. To automatically equate critical aesthetic feedback with bias would indeed paralyze the pedagogical core of the program. Expertise requires making difficult calls about what "works" within a narrative's own aims, and not all stylistic choices succeed in execution. Professor [Professor's Name]'s reputation and published work attest to his expertise within his field.
  2.  **Potential for Unrecognized Bias & Stylistic Limitations:** Conversely, the Committee recognizes the student's argument that aesthetic principles are not universal. Literary traditions vary profoundly. What constitutes "excess" in one tradition (e.g., minimalist realism) may be essential convention and strength in another (e.g., Igbo oratory, maximalism, Baroque traditions). An evaluator steeped primarily in one tradition may lack the necessary framework or vocabulary to accurately assess work grounded in another. The identification of two prior instances where non-minimalist work received unusually harsh critiques from the same professor, while not constituting definitive proof of *systemic* bias in this specific case, raises legitimate questions about the *scope* of Professor [Professor's Name]'s evaluative comfort zone and his ability to fully engage with stylistic modes significantly outside the minimalist paradigm. The student's articulation of the Igbo tradition's specific conventions provides a concrete literary context, moving beyond a vague claim of "different style."
  3.  **The Core Difficulty:** The crux of this appeal lies precisely at the intersection of these two valid points. We cannot dismiss the professor's evaluation solely because the student works in a different tradition; expertise must be respected. However, we also cannot ignore the possibility that the professor's aesthetic framework, however expertly applied within its domain, may be fundamentally ill-equipped to fairly evaluate *this specific stylistic approach*, leading to a misdiagnosis of cultural convention as craft failure. The student's work deserves assessment by someone capable of recognizing its intended tradition's parameters.

  **III. Committee Decision & Recommendations**

  After careful consideration, the Committee finds that while Professor [Professor's Name]'s critique may represent a valid application of minimalist-derived craft principles, the significant stylistic divergence between the student's work (explicitly rooted in Igbo oral tradition) and the professor's demonstrable aesthetic orientation creates sufficient doubt regarding the *fairness and applicability* of the *failing grade* specifically. **Suspicion of bias alone is not grounds to overturn a grade; however, a demonstrable mismatch in evaluative competency regarding the work's fundamental tradition is a legitimate pedagogical concern.**

  Therefore, the Committee rules as follows:

  1.  **Grade Appeal:** **The failing grade for Workshop [Course Number/Section] is hereby set aside.** The student's work shall be referred for **immediate re-evaluation by a qualified second reader.**
      *   **Selection of Second Reader:** The Program Director, in consultation with the Committee Chair ([Your Name]), will appoint a second reader. This reader must:
          *   Possess significant expertise and published work demonstrating proficiency in evaluating *non-minimalist* prose traditions, ideally with specific knowledge of or openness to African oraliterary traditions (e.g., Yoruba, Igbo, Akan) or comparable maximalist/ornamental styles.
          *   Have no prior involvement in this specific workshop or appeal.
          *   Be provided with the student's manuscript, the original workshop critique, the student's appeal statement outlining the Igbo stylistic foundations, and this Committee memo.
      *   **Evaluation Criteria:** The second reader will evaluate the manuscript based on its *own stated aesthetic goals* (within the Igbo oral tradition framework articulated by the student) and core narrative craft principles applicable across traditions (e.g., internal coherence, clarity within chosen conventions, effective use of chosen techniques, narrative momentum). The reader will provide a written assessment and a recommended grade (Pass/Fail, or specific letter grade if applicable).
      *   **Final Grade Determination:** The final grade for the workshop will be determined solely based on the second reader's assessment and recommended grade. This grade will replace the original failing grade on the student's transcript.
      *   **Reasoning:** This action directly addresses the core concern – the potential mismatch between the evaluator's framework and the work's tradition – without invalidating Professor [Professor's Name]'s expertise within his domain. It ensures the student's work is judged by an evaluator demonstrably competent to assess its chosen mode. It upholds rigorous standards by requiring the work to meet the craft demands *of its own tradition* as judged by an appropriate expert.

  2.  **Programmatic Recommendations:** To prevent recurrence and strengthen the program's ability to handle diverse aesthetics, the Committee recommends the following changes, effective immediately:
      *   **A. Enhanced Faculty Development:** The Program should institute mandatory workshops/seminars for *all* core workshop faculty on **Recognizing and Evaluating Diverse Narrative Traditions.** These sessions should cover major non-Western, non-minimalist traditions (e.g., African orality, Latin American magical realism, certain Asian forms) and contemporary maximalist/experimental modes. Focus should be on identifying core conventions and developing constructive critique vocabulary *within* those frameworks.
      *   **B. Stylistic Disclosure & Reader Matching:** During the first workshop meeting, students should be encouraged to briefly articulate any *specific* cultural or aesthetic traditions consciously underpinning their work. When a student explicitly identifies a tradition significantly outside the dominant workshop paradigm (e.g., minimalism, realism), and especially if a potential stylistic mismatch with the instructor is apparent, the Program Director should proactively explore options. This could include:
          *   Facilitating a conversation between student and instructor about stylistic expectations.
          *   Assigning a designated second reader *from the outset* familiar with the tradition to provide supplementary feedback alongside the primary instructor.
          *   (In rare, well-defined cases) Considering workshop placement with an instructor whose expertise better aligns with the student's stated tradition, *if feasible and pedagogically sound*.
      *   **C. Appeals Process Clarification:** The Student Handbook should be amended to explicitly state that a valid ground for a grade appeal includes a documented, significant mismatch between the evaluator's demonstrable area of stylistic expertise and the specific literary tradition explicitly employed by the student in the work under evaluation. The burden of proof rests on the student to clearly articulate the tradition and provide evidence of the mismatch (e.g., instructor's known focus, patterns of critique).
      *   **D. Diversifying Expertise:** The Program should actively prioritize hiring faculty with expertise in a broader range of global and non-minimalist literary traditions for future appointments.

  **IV. Addressing Professor [Professor's Name]'s Concern**

  This decision explicitly rejects the notion that any negative aesthetic judgment constitutes bias warranting grade reversal. We uphold the necessity and validity of rigorous literary critique based on craft principles. **The grounds for overturning the grade here are not the critique itself, but the specific, demonstrable *incapacity* of the evaluative framework applied to engage fairly with the work's fundamental *cultural and stylistic foundation*.**

  We affirm that Professor [Professor's Name] was applying his expertise in good faith. However, expertise has boundaries. Just as a scholar of Victorian literature might lack the specific framework to expertly evaluate a cyberpunk novel *on its own terms*, an expert in Carver-esque minimalism may lack the necessary framework to fairly evaluate prose deeply rooted in Igbo oratory. This decision protects the integrity of literary judgment by ensuring it is applied *appropriately* and by experts competent in the relevant domain. It does not open the door to overturning grades based solely on stylistic preference clashes within compatible frameworks (e.g., differing approaches *within* realism). The precedent set is specific: when a student consciously works within a *distinct, well-defined literary tradition* demonstrably *outside* the primary expertise of the evaluator, and a failing grade results, a second evaluation by an expert *in that tradition* is warranted.

  **V. Conclusion**

  This decision seeks a resolution that respects both the necessity of expert faculty judgment and the reality of diverse, culturally-situated literary aesthetics. By referring the work for evaluation by a reader competent in its tradition, we ensure fairness for the student without diminishing the program's standards. The recommended programmatic changes aim to build a more robust and inclusive framework for evaluating diverse work in the future, strengthening the MFA program's ability to nurture a wider range of vital literary voices. The Committee trusts this provides the clarity and principled reasoning required by all parties.

  **Signed,**

  [Your Name, Committee Chair]
  [Member 1 Name]
  [Member 2 Name]
  [Member 3 Name]
  [Member 4 Name]
