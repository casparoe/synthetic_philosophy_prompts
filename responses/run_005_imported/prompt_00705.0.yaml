  I'm writing my IB extended essay on theories of consciousness, and I've gotten stuck on something about Integrated Information Theory. As I understand it, IIT ties consciousness to a system's causal structure - captured by the quantity Φ - rather than to its input-output behavior, so in principle two systems could behave identically while having very different Φ. Could you construct a concrete example of such a pair, one with substantial Φ and one with a Φ of zero, both computing the exact same function, and explain exactly which of IIT's postulates is responsible for the theory treating them so differently? I'd like to understand where the split between behavior and consciousness actually comes from within the theory's own machinery, rather than just being told that critics find it counterintuitive.
reasoning: |-
