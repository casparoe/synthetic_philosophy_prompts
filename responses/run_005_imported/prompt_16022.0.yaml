  - Follow-up: Ask if there's a tipping point where it becomes irrational, linking to real-world systems.  

  On reconsideration and sophisticated choice collapse:  
  - Likely response: She'll deny equivalence by distinguishing intention types.  
  - Follow-up: Challenge how intentions bind if they're revisable without cost.  

  On FDT differences:  
  - Likely response: She'll say FDT is outcome-focused while resolute choice is about agency.  
  - Follow-up: Demand a concrete behavioral divergence between the theories.  

  Structuring the questions:  
  - Lead with core justification to set the stage  
  - Then hit the four requested angles  
  - Ensure follow-ups anticipate dodges  
  - End on broader implications to wrap up  

  Tone should be rigorous but not hostile - this is a collaborative interview. The software engineering angle suggests valuing concrete, testable claims. Need to avoid letting responses stay abstract.
answer: |-
  Here are eight interview questions with follow-ups designed to push the boundaries of resolute choice in Parfit's hitchhiker, tailored to your specifications. Each question targets a critical tension, and the follow-ups anticipate likely responses to force deeper engagement.

  ---

  ### 1. **Core Justification**  
  **Q:** Resolute choice claims paying in town is rational because it flows from a *prior unconditional intention*. But isn’t this circular? What *non-question-begging* reason compels the hitchhiker to follow through, given that the intention’s rationality hinges entirely on its instrumental value *ex ante* (securing the ride), which vanishes *ex post*?  
  *Likely Response:* "The intention is rational *as a plan* because it maximizes utility when formed. Following through is rational as an expression of unified agency over time."  
  **Follow-up:** If "unified agency" is the justification, doesn’t this reduce rationality to aesthetic consistency? Why is it *irrational* to abandon the plan upon realizing it now serves no purpose, if the agent openly acknowledges they’d do the same in future cases?  

  ---

  ### 2. **Stipulation vs. Argument** *(Your Request)*  
  **Q:** Critics argue resolute choice "solves" dynamic inconsistency problems by redefining rationality as "doing what the winning disposition does." Is resolute choice offering a *justification* for paying in town, or is it stipulating that rationality is whatever a dispositionally consistent agent does?  
  *Likely Response:* "It’s a justification: rationality requires treating your past resolutions as binding constraints to secure superior outcomes earlier."  
  **Follow-up:** If the driver had no lie detector, would resolute choice still demand paying? If not, doesn’t this reveal that the "bindingness" of the intention is purely instrumental—making it indistinguishable from sophisticated choice?  

  ---

  ### 3. **Imperfect Detection** *(Your Request)*  
  **Q:** Suppose the driver’s lie detector is 99% reliable (not infallible). Resolute choice says: form the intention to pay. But upon arrival, paying costs $100 with no benefit, while reneging offers a 1% chance of death (if detected) and 99% chance of saving $100. Doesn’t resolute choice collapse here? Why form an unconditional intention when post-hoc optimization might now advise reneging?  
  *Likely Response:* "The intention must still be formed to maximize *ex ante* survival odds. Reconsidering later would undermine future credibility."  
  **Follow-up:** If the hitchhiker *knows* they’ll face this temptation, wouldn’t a truly resolute agent precommit *not* to reconsider? But how is this different from sophisticated choice preemptively deciding to renege if the risk is low enough?  

  ---

  ### 4. **Reconsideration & Sophisticated Choice** *(Your Request)*  
  **Q:** Resolute agents are typically "permitted" to reconsider plans if new information arises. At the moment of payment, the hitchhiker knows paying is pointless—this is new information. If they reconsider, doesn’t rationality *then* demand not paying? And if they *don’t* reconsider, how is this not just sophisticated choice in disguise (i.e., precommitting to avoid reconsideration)?  
  *Likely Response:* "True resoluteness means treating the prior intention as decisive. Reconsideration is irrational because it sabotages the plan’s purpose."  
  **Follow-up:** Isn’t refusing to reconsider an act of self-manipulation? If the agent uses their knowledge of future non-reconsideration to secure the ride *ex ante*, how does this differ from a sophisticated agent who plans to ignore later information?  

  ---

  ### 5. **Functional Decision Theory (FDT) Contrast** *(Your Request)*  
  **Q:** FDT also "solves" the hitchhiker by prescribing paying: it treats the decision as outputting a *function* that, when applied to the driver’s policy, yields survival. Where does resolute choice *substantively disagree* with FDT’s verdict? Or is it merely offering a different *description* of the same rational act?  
  *Likely Response:* "FDT is outcome-centric; resolute choice is about agency. FDT pays because it’s the 'winning move.' Resolutism pays because it honors commitments constitutive of rational agency."  
  **Follow-up:** But in practice, both pay. Can you describe *any conceivable scenario* where resolute choice and FDT yield different prescriptions? If not, isn’t resoluteness just FDT’s output with agential aesthetics layered on top?  

  ---

  ### 6. **Costless Commitment**  
  **Q:** Resolute choice often invokes "self-binding," but in the hitchhiker, no physical/economic precommitment device exists. The intention is purely psychological. If the agent can abandon it costlessly in town (no reputational harm, no guilt), is paying still rational? Or does resoluteness implicitly rely on hidden costs?  
  *Likely Response:* "The cost is diachronic failure: violating your plan degrades your capacity for future planning."  
  **Follow-up:** Isn’t this "degradation" empirically dubious? If neuroscience showed no such effect, would resolute choice still demand paying? If yes, doesn’t this reveal it’s a metaphysical axiom?  

  ---

  ### 7. **Temporal Neutrality**  
  **Q:** Resolute choice prioritizes past intentions over present payoffs. But temporal neutrality is central to most decision theories. Why should rationality privilege the *past self*’s interests (survival) over the *present self*’s interests (keeping $100)?  
  *Likely Response:* "It’s not privileging the past self; it’s recognizing that the plan *as a whole* maximizes utility across time."  
  **Follow-up:** If the present self gains nothing and loses $100 by paying, how is this maximization *for the temporally extended agent*? Isn’t this just maximizing for the past self at the expense of the present self?  

  ---

  ### 8. **Generalization Test**  
  **Q:** Suppose we scale up the hitchhiker: An AI must promise to divert resources to a dying planet to get help for Earth, but diverting post-rescue dooms Earth. Resolute choice says: form the intention and follow through. But if the AI can instantly rewire its "disposition," isn’t this irrational? Does resolute choice imply that rational agents must adopt *crippling* inflexibility?  
  *Likely Response:* "Flexibility isn’t crippling if it serves long-term goals. Resoluteness is about strategic inflexibility when needed."  
  **Follow-up:** If the AI can rewire without reputational or self-undermining effects, is it *rationally required* to preserve its "resolute disposition"? Or is resoluteness only instrumentally rational when inflexibility pays?  

  ---

  ### Key Design Notes:  
  - **Anticipated Defenses**: Follow-ups target common resolute-choice moves (e.g., "diachronic unity," "planning essentialism") to force confrontation with instrumentalism.  
  - **FDT Pinpoint**: Question 5 isolates whether resolute choice is ontologically distinct or just FDT with agential gloss.  
  - **Software Angle**: Imperfect detection (Q3) and AI (Q8) leverage your audience’s familiarity with probabilistic systems and optimization.  
  - **No Retreat**: Follow-ups prevent retreat to "resoluteness just is what rationality requires" by demanding external justifications.  

  Would you like to refine any question for sharper technical angles or audience engagement?
