      *   **`(c) - Dreaming`:** While foundational for *interpreting current experience*, radical dream doubt (Descartes) is a persistent philosophical challenge. Wittgenstein acknowledges the *practical* certainty ("I cannot be making a mistake" - OC 668), but its necessity for *all* rational practice is less absolute than (a) or (d). Doubting it doesn't instantly collapse *all* language games (e.g., one could still do mathematics while doubting if awake).
