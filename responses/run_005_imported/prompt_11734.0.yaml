  Then Nadia pivots to hard paternalism, arguing the refusal disrespects autonomy regardless of coercion. Interesting angle - she's saying the act itself overrides the decision. But Theo responds by questioning the "informed" part of the decision. He brings up behavioral psychology about overconfidence during speculation. This soft paternalism angle seems strong - people often think they're clear-eyed when they're not.

