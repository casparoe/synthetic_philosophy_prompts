  What both miss: the listener's perspective matters too. Did Deniz know about Marco's past? If not, the criticism absolutely reads as superiority. Also, standing isn't binary - maybe Marco could comment but not "grief" aggressively. And nobody asked whether Marco's criticism actually helps Deniz reform - that pragmatic angle might resolve things better than abstract standing debates.

