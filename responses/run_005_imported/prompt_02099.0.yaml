  First, I notice the user is intellectually invested - they call this a "better test case" than textbook examples. That makes sense; real conflicts always have more texture. Their request for "blow-by-blow" suggests they want to use this in teaching, so I should model how to dissect layered ethical disputes.

  Looking at the core question: does hypocrisy always remove standing to blame? Nadia says yes absolutely - past commission of the same sin voids your license. Theo argues context matters - time, remorse, and behavioral change create moral differentiation. 

  For move (1): Nadia's hypocrisy charge feels intuitive but oversimplified. If we accept it, no reformed wrongdoer could ever participate in moral discourse - that seems unsustainable. But Theo's distinction in (2) between "skeleton" vs "active exception-claim" is sharper. Marco's past action isn't controlling current behavior like Deniz's pattern.

  Move (3) is where it gets thorny. Nadia's "benefit without consequences" point hits hard - unpunished wrongdoing does create asymmetry. But Theo's (4) counter that this conflates overall character with specific standing feels correct. Standing isn't about being sinless, but about not actively undermining the norm you're enforcing. 

