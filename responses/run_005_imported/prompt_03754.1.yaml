prompt: |-
  I'm a third-year philosophy major, and this term I'm taking a small seminar on Aristotle's logical works. This week we've been working through Chapter 9 of De Interpretatione – the famous "sea battle" chapter on future contingents and fatalism. Our professor spent most of the session reconstructing the fatalist argument that dominates the first half of the chapter and ran out of time just as we reached Aristotle's own response to it, so I've been trying to work through the rest on my own using the Edghill translation. I keep getting stuck on the same stretch of text, and I would like some help seeing how the pieces of the argument actually fit together, because at the moment I can't tell whether Aristotle is making a fairly modest logical point or a much more radical one about truth itself.

  Here is the passage I'm stuck on (corresponding roughly to Bekker 19a23–19b4):

  "Yet this view leads to an impossible conclusion; for we see that both deliberation and action are causative with regard to the future, and that, to speak more generally, in those things which are not continuously actual there is potentiality in either direction. [...] It is possible that this coat may be cut in half, and yet it may not be cut in half, but wear out first. In the same way, it is possible that it should not be cut in half; unless this were so, it would not be possible that it should wear out first.

  Now that which is must needs be when it is, and that which is not must needs not be when it is not. Yet it cannot be said without qualification that all existence and non-existence is the outcome of necessity. For there is a difference between saying that that which is, when it is, must needs be, and simply saying that all that is must needs be, and similarly in the case of that which is not. In the case, also, of two contradictory propositions this holds good. Everything must either be or not be, whether in the present or in the future, but it is not always possible to distinguish and state determinately which of these alternatives must necessarily come about.

  Let me illustrate. A sea-fight must either take place to-morrow or not, but it is not necessary that it should take place to-morrow, neither is it necessary that it should not take place, yet it is necessary that it either should or should not take place to-morrow. [...]

  This is the case with regard to that which is not always existent or not always nonexistent. One of the two propositions in such instances must be true and the other false, but we cannot say determinately that this or that is false, but must leave the alternative undecided. One may indeed be more likely to be true than the other, but it cannot be either actually true or actually false. It is therefore plain that it is not necessary that of an affirmation and a denial one should be true and the other false."

  What I can't work out is how the modal point made in the third paragraph is supposed to license the semantic claim made in the last one. Taken by itself, the claim that "(P or not-P)" is necessary while neither "necessarily P" nor "necessarily not-P" holds looks like a fairly tame scope distinction that even a logician fully committed to bivalence could accept without any trouble – it just says the disjunction is necessary while neither disjunct is. But Aristotle then immediately says that one of the two propositions about tomorrow's sea-fight "cannot be either actually true or actually false," which sounds like a flat rejection of bivalence for this class of statements rather than a remark about the scope of "necessarily." Is he sliding between two importantly different claims here, or is there a way of reading the passage on which the scope distinction genuinely supports, or at least motivates, the stronger semantic conclusion? And what work is the material about deliberation and the coat actually doing in getting him there – is he moving from a metaphysical premise about there being a real, open possibility to a semantic conclusion about truth-value, and if so, is that inference sound, or does it trade on two different senses of "possible"? A friend in my seminar is convinced this passage is really just a proto-version of a three-valued logic avant la lettre, but that strikes me as too quick given how little the text actually says about truth-value gaps as such. I would appreciate help reconstructing the structure of the argument here and getting a sense of which of these readings, if any, is actually defensible.
reasoning: |-
  Okay, let me approach this step by step. The user is a philosophy major working through Aristotle's De Interpretatione Chapter 9 about future contingents and fatalism. They're stuck on the passage where Aristotle seems to reject bivalence for future contingent statements. 

  First, I need to unpack why this is confusing. The user sees two seemingly contradictory claims: Aristotle maintains that (P or not-P) is necessary (the law of excluded middle), but then says neither P nor not-P is "actually true or false" for future contingents. That does look like he's rejecting bivalence while keeping excluded middle - which is tricky because modern logic usually treats them as a package deal. 

  The key is understanding what Aristotle means by "actually true/false". For him, truth requires definite actuality - something that's only potentially the case can't make a statement true yet. So when he says "one cannot be actually true/false", it's because the reality isn't settled. The coat example is crucial here: it could be cut or not, but until it happens, neither outcome is actual - so statements about it lack truthmakers. 

  This isn't three-valued logic though. Aristotle isn't saying there's a third truth-value; he's saying the truth-value simply doesn't exist yet. The deliberation argument reinforces this: if statements about future actions were already true/false, our choices wouldn't be genuinely open. 

  The user's friend is wrong to call this proto-three-valued logic. Aristotle isn't proposing a new logic system; he's making a metaphysical point about time and actuality. The "undecided alternative" isn't a logical value but an ontological gap - reality hasn't determined it yet. 

  Where this gets subtle is how the modal operators work. When Aristotle says "it is necessary that P or not-P", that necessity comes from the law itself, not from the events. But "necessarily P" would imply the event is predetermined, which he denies. That's why the scope distinction matters: the necessity applies to the disjunction as a whole, not to the individual disjuncts. 

  The user's suspicion is correct - this is both a modest logical point (about scope) and a radical metaphysical one (about truth requiring actuality). The inference from open possibility to truth-value gaps only works if you accept Aristotle's view that truth depends on actualized states of affairs. A modern realist about truthmakers might reject that, but within Aristotle's framework, it holds.
answer: |-
  You've pinpointed the central interpretive crux of *De Int.* 9, which has divided scholars for millennia. Aristotle *is* making both a logical point about necessity scope *and* a radical claim about truth for future contingents, and the connection hinges on his metaphysics of time, potentiality, and actuality. Let's break down the argument step-by-step and address your specific questions.

  **1. The Core Argument Structure:**

  1.  **Metaphysical Premise (Open Future & Potentiality):** The future isn't predetermined for events that are not "continuously actual" (like necessary truths or eternal objects). For contingent events (sea battle, coat cutting), there is a *real potentiality* for either outcome ("potentiality in either direction"). Deliberation and action demonstrate this openness – they are *causative* precisely because they influence which potentiality becomes actual (e.g., my choice *not* to cut the coat allows its wearing out to become actual).
  2.  **Logical Principle (Law of Excluded Middle - LEM):** For *any* proposition P (including "There will be a sea battle tomorrow"), it is *always* necessary that either P is true or ~P is true (P or not-P). This is a fundamental logical law for Aristotle.
  3.  **Modal Distinction (Scope Fallacy):** The Fatalist commits a scope fallacy. They confuse:
      *   *(Necessarily (P or ~P))*: This is true (LEM). The disjunction *must* hold.
      *   *(Necessarily P) or (Necessarily ~P)*: This is *false* for future contingents. Neither outcome is *necessary* in itself. The necessity applies to the *disjunction*, not to either *disjunct*.
  4.  **The Key Inference (Metaphysics Constrains Truth):** Because the future is genuinely open (Premise 1), *neither* P ("Sea battle tomorrow") *nor* ~P ("No sea battle tomorrow") is *yet* *determinately true or determinately false*. The reality that will make one true and the other false *does not yet exist*. The potentiality for either outcome is real, but neither outcome is *actual*.
  5.  **Semantic Conclusion (Rejection of Bivalence for Future Contingents):** Therefore, for propositions about singular future contingent events, **bivalence does not hold**. It is not the case that one is determinately true *now* and the other determinately false *now*. They lack a *definite* truth value. One may be *more probable* ("more likely to be true"), but probability ≠ actual truth. The truth value is genuinely *indeterminate* until the event occurs or fails to occur.

  **How the Modal Point Licenses the Semantic Claim:**

  The scope distinction (point 3) *alone* doesn't justify rejecting bivalence. A modern defender of bivalence (like a logical fatalist) would agree with the scope distinction: "Yes, (P or ~P) is necessary, but neither P nor ~P is necessary. *Nevertheless*, one of them *is* (timelessly, determinately) true *right now*, and the other false; we just don't know which, and its truth isn't *necessary*." Aristotle rejects *this*.

  *   **The Crucial Bridge:** Premise 1 (Open Future/Potentiality) and the underlying **Correspondence Theory of Truth**. For Aristotle, truth requires a *corresponding actual state of affairs*. "Socrates is sitting" is true iff Socrates *is actually* sitting *now*. For a future contingent event, the corresponding state of affairs *does not yet exist* in actuality. Only potentialities exist. Therefore, *there is nothing actual for the proposition to correspond to* (or fail to correspond to) *at the present time*.
  *   **The Modal Point's Role:** The modal point shows that the fatalist argument relies on an *invalid inference* (confusing necessity of disjunction with necessity of disjuncts). This *invalidates the fatalist's specific argument for determinism* based on bivalence+LEM. It *opens the logical space* for Aristotle to then argue that bivalence itself is the problem when applied to the future. He uses the metaphysical reality of potentiality (established in Premise 1) to argue that the *semantic principle* (bivalence) *must* fail for propositions about such events precisely *because* the corresponding reality is indeterminate. The scope distinction clears the way; the metaphysics of time and potentiality drives the semantic conclusion.

  **The Role of Deliberation and the Coat:**

  *   **Deliberation:** Demonstrates the *reality* of open potentiality. If statements about my future actions were *already* true or false (bivalence), then my deliberation would be an illusion – the outcome would be fixed regardless. Aristotle argues the causal efficacy of deliberation *proves* the future isn't fixed, hence bivalence *cannot* hold for such propositions. It's an argument from practice against the semantic principle.
  *   **The Coat:** Provides a concrete, non-temporal example of potentiality "in either direction" existing *before* actualization. The coat's potential to be cut and its potential not to be cut (and wear out) are both real *before* either happens. The statement "This coat will be cut in half" lacks a determinate truth value *while* both potentials are equally open. Its truth value becomes determinate only *when* one potential is actualized (either it's cut or it wears out). This model is then applied to future events in time.

  **Is the Inference Sound? Does it Trade on Ambiguity?**

  *   **The Inference:** The inference from "There is real potentiality for both P and ~P" (metaphysics) to "Neither P nor ~P is *now* true or false" (semantics) rests entirely on Aristotle's **correspondence theory of truth combined with his presentist ontology** (only the present is actual). If you accept these premises, the inference is valid: no actual state of affairs => no truth value.
  *   **Ambiguity?** It doesn't *trade* on ambiguity, but it *depends* on a specific, substantive view of truth and time. Critics (like modern "tenseless" or "eternalist" theorists of time) argue:
      *   Truth can be about the future without requiring a *present* truthmaker. The future event *itself*, located in the future, can be the truthmaker for a present-tensed proposition *about* the future. (Aristotle rejects this – only the actual present exists).
      *   "Possible" *could* be interpreted purely epistemically (we don't know), not metaphysically (it's genuinely open). Aristotle clearly intends the metaphysical reading (supported by deliberation/action).
  *   **Soundness:** Within Aristotle's metaphysical framework (presentism, potentality/actuality, correspondence truth), the argument is sound. Whether you accept that framework is the real debate.

  **Three-Valued Logic? Too Quick.**

  Your instinct is correct. While Aristotle's conclusion *implies* a truth-value gap, he doesn't develop a formal three-valued *logic* here.

  1.  **Focus:** He's primarily concerned with refuting fatalism and preserving the reality of contingency, deliberation, and change. The semantic point is a *consequence* of this metaphysics, not the primary focus.
  2.  **Mechanism:** He doesn't specify *how* such propositions function in complex statements (e.g., "If there is a sea battle tomorrow, then..."), define connectives, or develop a system of inference rules – the hallmarks of a formal logic.
  3.  **Description vs. System:** He describes a *situation* (indeterminate truth value) arising from the nature of reality and time, rather than proposing a new *logical value* as part of a systematic alternative to bivalent logic. He's making an ontological point about truthmakers, not (primarily) a syntactic point about logical values.

  **Conclusion: Modest Logic, Radical Metaphysics/Semantics**

  Aristotle *is* making both:

  1.  **The Modest Logical Point:** The scope distinction is crucial to dismantling the fatalist's invalid argument. LEM holds, but necessity doesn't distribute to the disjuncts for contingents.
  2.  **The Radical Claim:** His deeper argument, driven by the metaphysics of potentiality/actuality and a correspondence theory of truth tied to the present actual, leads to the **rejection of bivalence for singular future contingent propositions**. The future's ontological openness *requires* a semantic openness. Truth values are not timelessly fixed for such propositions; they become determinate only *when* the potentiality is actualized.

  The coat and deliberation establish the reality of symmetric potentiality. The modal distinction refutes the fatalist's logic. The metaphysical picture of time and truth then compels the conclusion that statements about the open future lack a definite truth value *now*. It's a profound and controversial move, grounding semantics in a dynamic, temporal ontology. Your struggle is well-placed; it's the core challenge of the chapter.
