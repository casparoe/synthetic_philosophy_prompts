answer: |-
  Here are 8 substantive questions targeting Dummett's core arguments, including your three specified areas with likely answers and sharp follow-ups:

  **Core Questions Targeting Your Specified Areas:**

  1.  **The Foundational "Right to Migrate":** Dummett asserts a fundamental individual right to emigrate *and* immigrate as a starting point in Part 1. For someone who doesn't share that intuition – perhaps prioritizing communal self-determination, cultural preservation, or a social contract view of citizenship – what is the *deeper philosophical justification* beyond assertion? How does this right override competing state or communal claims?
      *   **Likely Answer:** She'll likely ground it in fundamental autonomy, self-preservation, self-ownership (Lockean), or basic freedom of movement as a prerequisite for exercising other rights. She might link it to inherent human dignity or the right to seek opportunity/flourishing.
      *   **Follow-Up:** If this right stems from autonomy/self-ownership, doesn't that imply significant limits? Autonomy doesn't grant a right to enter *any* private home; why any state? And if it's about opportunity/flourishing, does that mean states have *positive obligations* to *provide* opportunities for immigrants, not just *not block* entry? How does this square with resource constraints or differing conceptions of the good life?

  2.  **The Colonial History Argument:** Dummett powerfully argues that Britain’s colonial history undermines its moral standing to restrict immigration *now*. But doesn't this primarily demonstrate *hypocrisy* by former colonial powers? How does this historical argument *directly* prove that immigration restriction is *morally wrong in principle*, especially for nations without a comparable colonial past (e.g., Japan, South Korea)?
      *   **Likely Answer:** She'll argue it's about *reparative justice* or *remedial responsibility*. Colonialism created structures of global inequality and displacement that persist; former colonizers bear unique responsibility for mitigating those harms, including by accepting migrants. It undermines claims to exclusive ownership built on past injustice.
      *   **Follow-Up:** Does this mean restriction *is* morally permissible for non-colonial states? Or are you arguing colonialism is merely one *amplifying* factor making restriction *especially* egregious for Britain, but restriction remains prima facie wrong elsewhere? If so, what is the *independent* moral argument against restriction applicable to *all* states?

  3.  **The Refugee Definition & "Moral Arbitrariness":** Dummett relies heavily on the 1951 Convention's persecution-based definition to distinguish refugees (deserving entry) from other migrants. But this definition was a product of post-WWII politics, focused on specific harms. Doesn't this make the line between "deserving" refugee and "undeserving" economic migrant (or climate migrant, famine victim, person fleeing gang violence) seem *morally arbitrary*? Why privilege persecution by state actors over equally devastating threats like climate collapse or generalized violence?
      *   **Likely Answer:** She'll likely defend the persecution criterion as capturing a specific, severe harm inflicted by a duty-bearing entity (the state), creating a clear protection need. She might argue it was the *politically achievable* baseline and Dummett was working within existing frameworks, but acknowledge its limitations.
      *   **Follow-Up:** If the core moral principle is a duty to protect people from severe, involuntary harm threatening basic survival or dignity (which Dummett seems to endorse), isn't the *source* of that harm (state persecution vs. climate disaster vs. warlord) irrelevant? Shouldn't the definition be expanded based on *need*, not *cause*? Doesn't sticking rigidly to the 1951 definition risk endorsing an outdated moral blind spot?

  **Additional Substantive Questions:**

  4.  **Sovereignty & Democratic Control:** Dummett argues states lack a moral right to exclude based on cultural preservation or national identity. How does his view reconcile with the principle of democratic self-determination? If a democratic polity, informed by Dummett's arguments, *still* votes for significant restrictions based on perceived cultural or economic impacts, does their democratic will hold any moral weight under his framework?
      *   *(Implied Follow-Up: If democratic will is overridden, does this make his view anti-democratic? If it's not, how can restrictions ever be justified?)*

  5.  **The "Brain Drain" Counter-Argument:** Critics argue that open(er) immigration policies can exacerbate "brain drain," depriving developing countries of essential skilled workers (doctors, engineers, etc.). How does Dummett's framework address this potential harm to the communities migrants leave behind? Does the individual right to migrate always trump potential collective harms in the origin country?
      *   *(Implied Follow-Up: Does this create a potential contradiction between the individual right to leave and a collective right/need for development?)*

  6.  **Citizenship & Obligation:** If individuals have a fundamental right to immigrate anywhere, what substantive meaning does *citizenship* retain? Does this right dissolve the special obligations and privileges traditionally associated with membership in a particular political community? If not, why not?

  7.  **Scale & Feasibility:** Dummett wrote in a specific historical context. How would he, or you defending him, address the practical and political challenges of implementing his principles in a world of vast global inequality, climate displacement, and potentially unlimited demand for immigration to wealthy states? Does the framework require radical global redistribution *first*, or is open borders the prerequisite for justice?
      *   *(Implied Follow-Up: Is this a realistic political project, or primarily a moral critique? If the latter, what concrete policy steps does it demand?)*

  8.  **The Role of Intuition vs. Principle:** Throughout the book, Dummett often leverages moral intuition (e.g., the injustice of the "White Australia" policy). To what extent is his overall argument ultimately reliant on shared moral intuitions about fairness and hypocrisy, rather than deriving incontrovertible principles? How should we engage with those who simply don't share those foundational intuitions?

  9.  **Legacy & Contemporary Relevance:** Given the significant shifts in migration drivers (especially climate change) and political discourse since Dummett wrote, which parts of his argument feel most urgent or defensible today? Which parts feel most dated or in need of revision, even by his defenders?

  **Key Interview Strategy:**

  *   **Listen Closely:** Pay attention to *how* she grounds Dummett's principles. Does she appeal to Kantian autonomy, Rawlsian justice, natural rights, consequentialism? Tailor follow-ups to challenge that specific foundation.
  *   **Press the "Why?":** After her initial answer, consistently ask: "But *why* is that the case?", "What is the *underlying principle* that leads to that conclusion?"
  *   **Highlight Tensions:** Explicitly point out apparent contradictions or tensions within Dummett's framework or between his framework and widely held values (like democracy, communal stability).
  *   **Demand Specificity:** Push for concrete answers on scope, limits, and practical implications. Avoid letting her retreat into abstract moral language without application.

  These questions force engagement with the philosophical bedrock, logical coherence, practical implications, and contemporary applicability of Dummett's arguments, moving well beyond a simple recap. Good luck with the interview!
