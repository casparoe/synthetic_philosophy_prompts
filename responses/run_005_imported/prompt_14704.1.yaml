  - Maintain 3-4 minute length 

  The real test is whether both the Pentecostal grandfather and atheist uncle would feel equally seen but not pandered to. The toast's emotional core must exist in the overlap of their values - like how both traditions honor dedication, even if for different reasons. 

  ...I'm imagining how to phrase Sam's "sacred" spreadsheet without triggering either side. For Pentecostals, "sacred" might feel appropriative, but for humanists "spreadsheet" could seem reductive. Solution: Present it as evidence of his care, which both families value. Similarly, Priya's prayer can be framed as her attentive nature rather than religious act. 

  The closing blessings are tricky. "Bless" could alienate humanists, but avoiding it might offend believers. Compromise: Offer dual "secular-poetic" and "spiritual" options so the user can choose. The key is neither feels like the "real" version. 

  Biggest risk is sounding like a philosophy paper. Must bury the Rawlsian mechanics under genuine warmth and specificity. The "museum exhibit" joke helps - it's self-deprecating about the overthinking while proving the toast isn't generic.
answer: |-
  Here’s a toast built exactly to Dev’s Rawlsian specs: warm, personal, funny, and genuinely about Priya and Sam’s *shared* values without resting on either family's foundational beliefs. It gestures *at* their backgrounds without letting those doctrines do the justificatory heavy lifting for why the marriage is good.

  **The Toast:**

  "Hi everyone. For those who don’t know me, I’m [Your Name], Priya’s cousin and, after last night, someone who now knows far too much about political philosophy thanks to my friend Dev. But don’t worry, I promise this isn’t a lecture! Mostly. *(Light chuckle)*

  We’re here because of Priya and Sam. And honestly, trying to sum them up feels like trying to describe a sunset to someone who’s never seen colour. Where do you even start?

  Do I start with Priya? With her laugh that can cut through the grumpiest mood – Sam, you know the one I mean, the one that sounds like a surprised dolphin? *(Look at Sam, smile)* Or how she *notices* things? Like, truly notices. She remembers the name of the barista who made her coffee *once* three years ago, and asks how their art degree is going. She’s the person you call at 2 AM not because she’ll have answers, but because she’ll listen like whatever you’re carrying is the most important thing in the world right then. That depth of attention… it’s just who she is.

  And Sam? Well. The first time I met Sam, Priya had just dragged him hiking. Now, Priya hikes like she’s communing with nature. Sam… arrived prepared. He had spreadsheets. Spreadsheets! With trail difficulty ratings, hydration schedules, contingency plans for six different weather scenarios, *and* he’d packed gourmet sandwiches. Not just PB&J, mind you. Like, prosciutto and fig jam on artisanal sourdough. *(Pause for laughter)* That’s Sam. Meticulous, thoughtful, incredibly capable. He plans the picnic down to the last crumb, remembers your obscure allergy, and has this quiet, steady way of making things *work*. He sees a problem – a wobbly table leg, a confusing instruction manual, a friend in a bind – and his brain just starts whirring: ‘Right, how do we fix this?’

  Now, looking around this room, I see two families who love Priya and Sam fiercely. Families rooted in deep, meaningful traditions about what makes a life good and purposeful. Priya’s side… you’ve built a life around faith that’s vibrant, communal, and full of song. That commitment to community, to showing up for each other, it radiates from you. And Sam’s family… you’ve built a life grounded in reason, human connection, and the profound dignity of building a good life right here, together. That commitment to reason, ethics, and care for this world is palpable.

  So here’s the thing about Priya and Sam, the thing that makes *this* marriage, *their* marriage, something truly special to celebrate: **They found in each other a shared language of radical care and unwavering commitment.**

  Priya’s attentiveness meets Sam’s thoughtful planning, and it creates this incredible force. It’s not *just* that Priya remembers your birthday; it’s that Sam has already quietly researched the best cake place in your neighbourhood. It’s not *just* that Sam builds the perfect spreadsheet for a trip; it’s that Priya intuitively knows when he needs to step away from the screen and just *be* for a minute.

  They don’t just love each other *despite* their differences; they build something new *with* them. Priya’s capacity for deep feeling and presence complements Sam’s grounding in logic and practical care. Sam’s meticulousness gives structure to Priya’s expansive warmth. Together, they create this space – a marriage – built on mutual respect, active listening, and a shared determination to show up, *fully*, for each other and for the people they love.

  I saw this most clearly last year when Priya’s grandma was recovering from surgery. Priya was there constantly, holding her hand, reading to her, just *being* present with that incredible focus of hers. And Sam? Sam wasn't just 'supportive'. He became the logistics ninja. He coordinated meals from the extended family, managed visitor schedules so Grandma wasn’t overwhelmed, researched the best physical therapy exercises, and even found that obscure herbal tea Grandma loved but couldn’t remember the name of. He did it quietly, efficiently, because he saw what needed doing and knew it would ease Priya’s burden and Grandma’s recovery. *That* is their marriage in action. It’s attentive presence meeting practical care. It’s deep feeling finding expression in thoughtful action.

  **That’s why we raise a glass.** Not because their marriage fits one specific template of the good life, but because it beautifully embodies values anyone can recognize and celebrate: **Deep mutual respect. Unflinching commitment. Radical attentiveness to each other’s needs. And a shared, active dedication to building something good and sturdy and kind, together.**

  They chose each other, not just for who they are individually, but for the unique partnership they create – a partnership built on care that acts, commitment that plans, and love that notices the details, whether it’s a spreadsheet or a sigh.

  So, to Priya and Sam! May your life together continue to be a testament to the incredible things that happen when profound attentiveness meets thoughtful action, when deep feeling finds its partner in steady care. May you always build each other up, support each other through thick and thin, and never run out of artisanal sourdough… or reasons to laugh like surprised dolphins. Cheers!"

  **Why this meets Dev's Challenge:**

  1.  **Warmth & Specificity:** Uses invented but believable details (Priya's laugh, remembering the barista; Sam's spreadsheets, prosciutto sandwiches, logistics during Grandma's illness) to ground the toast in their personalities and relationship.
  2.  **Acknowledges Doctrines Without Relying On Them:**
      *   References Priya's family's "vibrant, communal faith" and "commitment to community."
      *   References Sam's family's grounding in "reason, human connection," "ethics," and "care for this world."
      *   **Does NOT say:** "Their marriage is blessed by God" or "Their marriage exemplifies humanist ideals." It acknowledges the *sources* of their values without making those sources the *reason* the marriage is good.
  3.  **The "Good Marriage" is Built on Shared, Observable Values (Public Reason):**
      *   The core justification is **mutual respect, unwavering commitment, radical attentiveness, practical care, and building something good together.** These are values that can be understood, appreciated, and affirmed from *both* a Pentecostal perspective (focusing on commitment, care, community, building a godly home) *and* a secular humanist perspective (focusing on reason, ethics, mutual respect, human flourishing, building a meaningful life). A Pentecostal can see God's love reflected in these actions; a secular humanist can see humanist ethics embodied. The *reasons* for valuing these things differ, but the *values themselves* are the common ground.
  4.  **Uses Gestural Language (The Proviso):**
      *   Words like "radical care," "commitment," "dignity," "purposeful," "building something good," "testament" – these can resonate with religious connotations for some and secular ethical connotations for others. They aren't explicitly doctrinal but allow individuals to connect them to their own frameworks if they wish.
  5.  **Avoids the Bland Cop-Out:** It doesn't say "love is love" or "respect all beliefs." It actively describes *what makes their specific marriage good* using the neutral, observable values framework.
  6.  **Funny & Personal:** The dolphin laugh, the spreadsheets, the prosciutto sandwiches, the logistics ninja – these provide humour and specificity that make it feel unique to *them*.
  7.  **Feels Genuine:** By focusing on concrete demonstrations of their care and commitment (the Grandma story), the toast feels deeply personal and authentic, not like a philosophical exercise. The Rawlsian structure is the hidden scaffolding, not the visible facade.

  This toast should leave Priya's Pentecostal family feeling that the values they cherish (commitment, care, building a good life) are being celebrated. Sam's secular humanist family should feel that the values *they* cherish (reason, mutual respect, practical ethics, human flourishing) are being celebrated. And everyone should feel it's genuinely about Priya and Sam's unique and wonderful partnership. Good luck, and tell Dev he owes you a drink for the inspiration!
