prompt: |-
  So this happened at work and I can't stop replaying it. We were about to put a new service on Kafka mainly because three other teams here already run on it, and two coworkers got into it over Slack about whether that's actually a good reason.

  (1) Raf: four teams independently landing on the same tool is basically four experiments agreeing, that's strong evidence it's the right call for us too.

  (2) Meera: not independent though — team 2 just read team 1's wiki page instead of doing their own bake-off, team 3 asked team 2 instead of testing anything, and by us it's not four stacked opinions, it's team 1's opinion filtered through a game of telephone. She said she'd read about "information cascades" somewhere and this was exactly that: everyone watching everyone else's choice instead of generating their own evidence.

  (3) Raf: fine, but each team was still being totally rational — nobody's got budget for a real bake-off on a message queue, so copying whoever already looked into it is the smart move when your own signal is weak. That's literally the point of the herding models Meera's half-remembering, so that doesn't make the outcome irrational.

  (4) Meera: true, and also beside the point — every step can be locally reasonable and the group still locks onto the wrong tool. The tell is it's fragile: if one senior eng posted a "Kafka burned us" postmortem tomorrow, she'd bet two of those teams flip within a week, which isn't what happens when people agree because they each independantly checked.

  Nobody budged. Can you go through this move by move and say who's right at each step? Give me a verdict as a JSON block like {"1": <score>, "2": <score>, "3": <score>, "4": <score>}, each score from -2 (way off) to 2 (nailed it), a couple sentences justifying each one, and flag anything you think both of them are still missing.
