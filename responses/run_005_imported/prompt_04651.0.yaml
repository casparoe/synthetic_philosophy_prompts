  Had a long back-and-forth with my friend Jonah last night thats still bugging me. We made a friendly bet over whether our buddy's band actually gets signed this year -- I think its pretty likely, like 75%, Jonah thinks more like 20%. We sized the bet so that, by each of our own numbers, we'd both expect to come out ahead. Jonah's argument: since I expect to gain and he expects to gain, the bet is obviously good for both of us, end of story. That never sat right with me -- only one of us can actually turn out to be right, and whoever isn't is just out money for nothing. Is Jonah's reasoning actually solid, or is there something genuinely off about calling a bet "good for both of us" just because each of us personally expects to win it?
