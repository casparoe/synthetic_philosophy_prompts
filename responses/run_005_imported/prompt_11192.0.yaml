  ---

  ### Move-by-Move Analysis

  #### **Move 1: Elena**  
  *Score: 1 (Mostly right, but incomplete)*  
  **Justification**: Elena correctly notes the Constitution’s textual avoidance of "slave" or "slavery" and its aspirational language (e.g., "secure Liberty"). This aligns with modern textualist/original public meaning methods (e.g., Barnett, Amar). However, she understates how contextual evidence (e.g., ratification debates, Federalist Papers) shows these phrases were *understood* as protecting slavery. The score reflects her strong textualist grounding but neglect of historical function.  

  #### **Move 2: Marcus**  
  *Score: 2 (Clearly right)*  
  **Justification**: Marcus dismantles Elena’s textual idealism by confronting the *functional reality* of clauses like Art. IV, §2 (fugitive slave clause) and Art. I, §2 (three-fifths). Historical consensus (Finkelman, Waldstreicher) confirms these were deliberately designed to protect slavery. Douglass himself admitted in 1852 that the Constitution’s "language is ‘we the people’" but its *practice* was pro-slavery. Marcus wins on historical honesty.  

  #### **Move 3: Elena**  
  *Score: 1 (Partially right, but evades core conflict)*  
  **Justification**: Elena rightly separates strategic utility from interpretive validity and highlights the framers' divided intent (e.g., Madison’s notes show Northern/Southern clashes). This rebuts Marcus’s "reasoning backward" charge. However, she sidesteps his functional critique by retreating to textual coherence alone. The Constitution’s "public meaning" in 1787–88 *included* recognizing slavery’s protections (see ratification debates in Virginia/South Carolina).  

  #### **Move 4: Marcus**  
  *Score: 2 (Clearly right)*  
  **Justification**: Marcus delivers a fatal blow: euphemisms like "other persons" were *deliberate obfuscations* to shield slavery while avoiding moral stigma (evidence: Madison’s Convention notes, Patrick Henry’s anti-ratification speeches). As historian David Waldstreicher notes, this encoded slavery in "neutral" language precisely to *secure* it. Elena’s public-meaning approach fails because 18th-century readers *understood* these phrases as references to slaves.  

  ---

  ### Deeper Conflict: Text vs. Function/Intent  
  Elena champions **textualism/public meaning**: The Constitution’s semantic structure creates an anti-slavery *telos* independent of framers’ motives.  
  Marcus champions **functionalist/original intent**: Clauses must be judged by their *historical operation and drafting purpose*.  

  **Assessment**:  
  - **Marcus wins on historical grounds**. The Constitution’s slavery protections were explicit to contemporaries, regardless of euphemisms. Even anti-slavery framers like Gouverneur Morris conceded these clauses were necessary to appease slave states.  
  - **Elena wins on normative legal theory**. Modern scholars (Ackerman, Balkin) argue the Constitution’s text *allowed* abolitionist reclamation (e.g., Thirteenth Amendment logic). Douglass’s genius was exploiting this ambiguity.  

  **Synthesis**:  
  Douglass’s pivot (explained in his 1860 speech "The Constitution of the United States: Is It Pro-Slavery?") blended *both* views: He conceded Marcus’s point about original function but insisted the text’s higher principles (due process, liberty) could weaponize it against slavery. As historian David Blight observes, this was both strategically vital and intellectually defensible—a fusion Marcus and Elena each partially capture but neither fully credits.  

  **Recommendation for Your Work**:  
  Frame Douglass’s shift as a dialectical synthesis: He accepted the framers’ *compromises* (Marcus) while asserting the text’s *revolutionary potential* (Elena), transforming the Constitution from a "covenant with death" (Garrison) into an "emancipation machine" (Blight). This resolves their debate by showing how Douglass transcended it.
