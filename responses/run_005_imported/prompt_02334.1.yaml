answer: |-
  You've hit on one of the most debated passages in medieval political thought! Aquinas's discussion in *De Regimine Principum* (specifically Book I, Chapter 6) is notoriously dense and requires situating within his broader theology and other works (especially the *Summa Theologiae*). Let's untangle it, addressing your specific points:

  1.  **The "Ehud/Aioth" Sleight of Hand:** You're right to find this jarring. Aquinas's distinction isn't arbitrary, but it relies on unstated premises fundamental to his worldview:
      *   **Legitimate Authority & Subjecthood:** Aquinas's core argument against *private* tyrannicide hinges on the ruler-subject relationship established by just authority. A tyrant *within* a legitimate political community is still the *ruler* of that community's subjects. Killing him is murder and rebellion against divinely-ordained authority structures (Romans 13:1-7 is the bedrock here, alongside 1 Peter 2:18-20 which he cites).
      *   **Eglon as a *Foreign* Oppressor:** Ehud (Judges 3:12-30) killed Eglon, the King of *Moab*, who was *oppressing Israel*. Aquinas reads this not as a *subject* assassinating his *own ruler*, but as a member of one people (Israel) liberating his nation from the *foreign enemy* ruler (Moab) who was unjustly dominating them. Eglon had no *legitimate* authority over Israel; he was an *external aggressor*. Therefore, Ehud's act was one of *just war* or patriotic defense against an external foe, not tyrannicide against one's own sovereign. This distinction between killing an unjust *foreign conqueror* and killing one's own *domestic tyrant* is crucial for Aquinas. He doesn't spell it out here explicitly, but it's consistent with his principles of authority and just war.

  2.  **Public Authority vs. Private Initiative & The "Multitude":** This is where Aquinas's core commitment lies, and it's *not* simply relocating killing to a mob.
      *   **Rejection of Private Judgment:** Aquinas fundamentally rejects the idea that an *individual*, acting on their *private judgment and initiative*, has the right to kill a ruler, no matter how tyrannical. This is for the prudential reason you cited (wicked being more likely to act) *and* the principled reason: usurping the function of public judgment and execution of justice is itself an act of injustice and disorder.
      *   **"Public Authority" Defined:** When Aquinas says action must come through "public authority," he **does not** primarily mean a spontaneous mob or vigilante group. He means *constituted authority*:
          *   **The "Multitude" as Original Authority:** His point about the multitude having the right to depose a king *they established* refers back to the idea that political authority originates from the community for the common good. This "multitude" acts not as a riotous mob, but as the *source of sovereignty* exercising its residual right to remove a ruler who fundamentally betrays the purpose of his office (the common good). This implies some form of *representative* or *institutional* action (e.g., through leading citizens, nobles, estates, or a designated body – how this happens concretely is less clear in Aquinas than in later thinkers).
          *   **Superior Authority:** If the tyrant is subordinate to a higher authority (like an Emperor over a King, or the Pope in certain temporal matters), that higher authority has the right and duty to depose him.
      *   **Deposition, Not Necessarily Assassination:** Crucially, Aquinas frames the solution as *deposition* ("deponere" - to put down, remove from office). While this *could* theoretically include execution (especially if the tyrant resists), the primary emphasis is on the *legal* or *constitutional* removal from power by the proper authority. He is advocating for a *process* rooted in public justice, not endorsing assassination as the primary tool, even for the public authority. The contrast is between *lawless murder* (private) and *lawful judgment/punishment* (public).

  3.  **The *Summa Theologiae* (II-II, Q.42 on Sedition):** This is essential context. Aquinas argues:
      *   Sedition is a mortal sin as it opposes the unity and peace of the community.
      *   **BUT:** "A tyrannical government is not just... Consequently, there is no sedition in disturbing a government of this kind, unless perhaps the disturbance is so great that the community suffers greater harm from the resulting disturbance than from the tyrant's rule. *Rather, it is the tyrant who is guilty of sedition*... since he encourages discord and sedition among his subjects, that he may lord over them more securely."
      *   **The Key Takeaway:** Resisting a *true tyrant* is not inherently sinful sedition *if*:
          *   It aims at restoring just order/the common good.
          *   It is proportionate (doesn't cause worse disorder).
          *   It is done by/with legitimate authority (echoing *On Kingship*). The *Summa* reinforces the rejection of *private*, disorderly rebellion while providing a clearer theological justification for *public* resistance to tyranny.

  **Untangling Aquinas's Commitment:**

  *   **No "Green Light" for Private Tyrannicide:** Aquinas **unequivocally rejects** the idea that a private citizen, acting alone, has the right to assassinate a tyrant. Dana is **wrong** if claiming Aquinas provides a simple loophole for this. Your initial instinct was correct on this point.
  *   **A Principled (but Cautious) Doctrine of Resistance:** Aquinas **does** articulate a doctrine of legitimate resistance to tyranny, but it's heavily qualified:
      1.  **Principle:** Tyranny fundamentally violates the purpose of government (the common good) and can be resisted.
      2.  **Agent:** Resistance must come from *public authority*, *not private individuals*. This means either:
          *   The community itself (acting through its proper representatives/institutions as the original source of authority).
          *   A superior temporal authority.
          *   (Implicitly, and later developed by others) Divine intervention/chosen instruments (like Ehud, acting under God's specific mandate against a *foreign* oppressor).
      3.  **Method:** The primary solution is *lawful deposition*. While force may be necessary, the emphasis is on restoring just order through a public act, not merely assassination. Assassination by a private individual remains murder.
      4.  **Prudence:** Resistance must be likely to succeed and not cause greater evils than the tyranny itself (the prudential argument).

  **The Verdict: Who Won the Argument?**

  *   **You won the core point:** Aquinas **does not** endorse private tyrannicide as a "green light" or "loophole." He explicitly argues *against* it on both principled (apostolic teaching, violation of authority/subject bond) and prudential grounds. Dana is oversimplifying and misrepresenting Aquinas if she claims he straightforwardly justifies individuals assassinating tyrants. His sympathetic setup of the pro-tyrannicide position is likely a rhetorical device (the "objection") before he presents his own view (the "response").
  *   **Dana has a kernel of truth (but overstated):** Aquinas *does* believe tyranny can be legitimately resisted and tyrants deposed/killed *under very specific conditions* – primarily *by public authority*, and with the Ehud case being a special exception (divinely mandated action against a *foreign* oppressor, not a domestic subject killing his own ruler). The "loophole" isn't for individuals; it's a complex, cautious justification for *institutional* action against intolerable rulers. Dana correctly identifies that Aquinas isn't an absolute quietist, but she mislocates the agency he permits.

  **In essence:** Aquinas provides a sophisticated, theologically grounded argument *against* vigilantism and private political murder, while simultaneously laying a foundation (based on natural law, the common good, and the origin of authority in the community) for a doctrine of *public* resistance to tyranny. He navigates a tightrope between condemning lawless rebellion and acknowledging the necessity (under strict conditions) of removing a ruler who destroys the very purpose of his office. The Ehud example is his way of acknowledging divinely-sanctioned killing of oppressive rulers *without* undermining his core prohibition against subjects assassinating their own sovereigns.
