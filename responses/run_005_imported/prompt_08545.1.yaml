answer: |-
  You've hit on one of the most fascinating quirks in language and philosophy! This split between indicative and counterfactual conditionals isn't just about the JFK example—it reveals how deeply grammar encodes our assumptions about reality. Let's break it down with fresh examples and explore the machinery behind it.

  **Brand New Example: The Broken Vase**

  *   **Scenario:** You come home to find your favorite vase shattered on the floor. Your cat, Luna, is sitting nearby looking innocent. Your toddler was also playing in the room earlier.
  *   **Indicative Conditional (Dealing with Uncertainty):**
      *   "If Luna didn't break the vase, then the toddler did."
      *   **Your Gut Feeling:** This feels solid, almost necessary. The vase *is* broken. *Someone/something* must have broken it. Luna and the toddler are the only plausible candidates present. We're narrowing down possibilities within a known factual outcome (broken vase). It's about *figuring out what happened*.
  *   **Counterfactual Conditional (Imagining an Alternative Past):**
      *   "If Luna hadn't broken the vase, then the toddler would have."
      *   **Your Gut Feeling:** This feels different. It implies Luna *did* break it (the "hadn't" suggests she did). More importantly, it suggests that *even if Luna hadn't*, the toddler was *destined* or *highly likely* to break it. But was the toddler *really* on the verge of breaking it? Maybe the toddler was napping? Maybe the vase was safe until Luna knocked it over? This statement feels like it assumes a "vase-breaking inevitability" that might not have existed.

  **What's Happening Under the Hood (The Linguistic & Cognitive Machinery):**

  1.  **Anchoring to Reality:**
      *   **Indicative ("didn't... did"):** Both clauses are anchored in the **same factual reality**. We *know* the outcome (pizza gone, vase broken). The "if" clause expresses *uncertainty* about one specific cause *within that known reality*. The "then" clause states the necessary alternative cause *within that same reality*. It's about **discovering facts** within the actual world.
      *   **Counterfactual ("hadn't... would have"):** The "if" clause explicitly **denies reality** ("hadn't eaten," "hadn't broken" implies they *did*). We are now **constructing a hypothetical, non-actual world** where that key event didn't happen. The "would have" clause describes what *hypothetically* follows *in that alternative world*. It's about **imagining consequences** in a world that diverged from ours.

  2.  **The Power of "Would":** The modal verb "would" is the key signal. It doesn't just indicate the past; it indicates **hypotheticality, contingency, or dependence**. "Would have" means "this *might* have happened, *could* have happened, or *probably* would have happened, *but only if* the 'if' clause were true." It introduces **uncertainty about the connection itself** in the hypothetical scenario.

  3.  **Presuppositions & Background Assumptions:**
      *   **Indicative:** Presupposes the outcome (pizza gone, vase broken). It **does not presuppose** the truth of the "if" clause OR the "then" clause individually. It just says *if* X is false, *then* Y must be true (given the outcome).
      *   **Counterfactual:** Presupposes the **falsity of the "if" clause** (roommate *did* eat it, Luna *did* break it). Crucially, it also **presupposes a stable causal relationship or set of conditions** linking the absence of X to the occurrence of Y *in that hypothetical world*. This is the "pizza thief waiting in the wings" or the "toddler destined to break the vase" feeling. The sentence *asserts* that this causal link held in the alternative scenario.

  4.  **The "Inevitability" Factor:** The counterfactual strongly implies that Y was **inevitable or highly probable** in the scenario where X didn't happen. The indicative makes no such claim about inevitability; it only claims that Y *did* happen *in the actual world* as the alternative to X.

  **Why Your Gut Reacts Differently to the Pizza Example:**

  *   **"If my roommate didn't eat it, somebody else did":** You *know* the pizza is gone. You're reasoning: "The set of people who could have eaten it includes my roommate and others. If my roommate isn't the one, then logically, someone else from that set *must* be." It's pure deduction within known facts.
  *   **"If my roommate hadn't eaten it, somebody else would have":** This implies your roommate *did* eat it. More importantly, it asserts that *even if they hadn't*, the situation was such that *someone else was poised and likely to eat it*. But your gut rebels: "Wait! Maybe *no one else* was hungry or home? Maybe the pizza would have just sat there? You're assuming a lurking pizza thief that might not exist!" The sentence smuggles in an assumption about the *disposition* of others or the *circumstances* that you might not accept.

  **Is This Split Always Present? (Context Matters!)**

  Generally, yes, switching from indicative past to past perfect + modal past ("would have") introduces this counterfactual meaning with its presuppositions. **However, the *strength* of the feeling that the truth value changes depends heavily on context and the specific propositions:**

  1.  **Cases Where the Split is Clear & Truth-Value Feels Different (Like Pizza/Vase):** This happens when the "then" clause (Y) in the counterfactual relies on an *assumed causal mechanism or disposition* that isn't logically guaranteed by the mere negation of X and the known outcome. Our knowledge of the world makes us doubt the inevitability asserted by "would have".

  2.  **Cases Where the Split Exists, but Truth-Value Might Feel Similar:**
      *   **Universal Truths/Laws:** "If you drop a fragile vase, it breaks." (Indicative - states a general law). "If you had dropped that fragile vase, it would have broken." (Counterfactual - applies the law to a specific non-actual past scenario). Both feel true because the "would have" relies on a strong, uncontroversial causal law.
      *   **Habitual Past Actions:** "If John wasn't working late, he was at the gym." (Indicative - describing his routine when not working late). "If John hadn't been working late, he would have been at the gym." (Counterfactual - applies the known routine to a specific non-actual past instance). If the routine is well-established, both can feel true, though the counterfactual still subtly emphasizes the *application* of the routine to the hypothetical case.
      *   **Known Dispositions:** "If Sarah didn't solve the puzzle, Alex did." (Indicative - only two capable people). "If Sarah hadn't solved the puzzle, Alex would have." (Counterfactual). If Alex was demonstrably working on it and close to solving it, the counterfactual might feel just as true. The inevitability is supported by evidence.

  3.  **Cases Where Switching *Doesn't* Make Sense/Changes Meaning Radically:** You can't arbitrarily switch between them. The indicative is for reasoning about uncertainty within reality. The counterfactual is for exploring what *might* have been if reality were different. Using the wrong one sounds nonsensical or misleading.

  **In Conclusion:**

  You've identified a fundamental feature of how human language handles reality vs. possibility. The shift from "if X didn't happen, Y did" to "if X hadn't happened, Y would have happened" isn't just a grammatical tweak. It's a switch from **deductive reasoning within a known reality** to **constructing a hypothetical world with its own causal rules and often importing assumptions about necessity or dispositions**. The "would have" injects hypotheticality and an assertion about how that alternative world *would* unfold, which our brains critically evaluate based on our understanding of cause, effect, and chance. The JFK example is classic, but the pizza thief and the broken vase reveal the same deep structure – it's how conditionals work in general. Your gut feeling is spot on!
