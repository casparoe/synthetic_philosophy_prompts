  Okay, the user is struggling with the difference between indicative and counterfactual conditionals, specifically why swapping verb forms changes the meaning so drastically. They've noticed that "if my roommate didn't eat it, somebody else did" feels obviously true, while "if my roommate hadn't eaten it, somebody else would have" feels uncertain or false. They want a fresh example beyond the overused Oswald/JFK one and a deep dive into why this happens.

  First, I need to recall the technical terms. Indicative conditionals deal with real possibilities, while counterfactuals imagine scenarios contrary to fact. The verb tense shift (past simple vs. past perfect + modal) is key. But why does it affect the implied assumptions? 

  For a new example, I'll avoid the tired JFK reference. The rainy day scenario works: "If it rained yesterday, the garden is wet" (indicative) vs. "If it had rained yesterday, the garden would be wet" (counterfactual). The first assumes we don't know about the rain, while the second implies it didn't rain. 

  Breaking it down: In the indicative, both clauses are treated as factual possibilities. The speaker is uncertain about the roommate eating the pizza but certain someone did. The counterfactual, however, treats the "if" clause as false (roommate did eat it) and imagines an alternative outcome. The modal "would" introduces hypotheticals, making us question if someone else was actually poised to eat it.

  The user also asks if this split always happens. I should note that context matters. For instance, in universal truths ("if you heat ice, it melts"), shifting to counterfactual doesn't change the factuality but might sound odd. Or in habitual past contexts, both forms can coexist without drastic meaning shifts. 

  The user's deeper need seems to be understanding how language encodes assumptions. They might be interested in philosophy of language or cognitive linguistics. Providing clear examples and explaining the underlying logic should address their frustration. They want to know if this is a fundamental feature or a quirk, so emphasizing the role of speaker assumptions and context is crucial. 

