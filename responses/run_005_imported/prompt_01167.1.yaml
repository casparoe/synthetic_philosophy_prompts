  But Pascal fires back with gambling math. He says: every bet involves staking certainty for uncertainty! The key is "proportion of chances." Ah, this smells like expected value thinking before it was formalized. Let me verify: he's saying the stake's certainty and gain's uncertainty relate through probability weights. 

