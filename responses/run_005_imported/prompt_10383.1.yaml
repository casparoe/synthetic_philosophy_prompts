  ## The Unseen Lover: Divine Hiddenness and the Case Against Theistic Belief

  Your journey from religious upbringing to philosophical scrutiny mirrors a profound human quest for truth. Focusing on J.L. Schellenberg's Divine Hiddenness Argument (DHA) demonstrates a keen grasp of the debate's core. Its precision, specifically targeting *nonresistant nonbelief*, makes it a uniquely powerful challenge to traditional theism. Let's dissect the argument and rigorously evaluate the two primary strategies you identified – the free-will/epistemic distance defense (Hick/Swinburne) and the volitional readiness response (Moser) – to determine if either successfully rescues the concept of a perfectly loving, personal God.

  ### I. Schellenberg's Argument Stated Precisely

  Schellenberg's DHA rests on a specific conception of God and a precise observation about human experience:

  1.  **The Premise of Divine Love:** If a perfectly loving God exists, then such a God desires a personal, meaningful, reciprocal relationship (a state of "existential connectedness") with *every* capable human being, now and throughout their lives.
  2.  **The Necessity of Belief for Relationship:** A necessary condition for entering into such a personal relationship with God is *belief* that God exists. One cannot consciously relate to, trust, or love a being whose existence one does not believe in.
  3.  **The Fact of Nonresistant Nonbelief:** There exist (and have always existed) individuals who are *capable* of a relationship with God but who *fail to believe* that God exists. Crucially, this nonbelief is **nonresistant**: these individuals are *not* actively resisting a relationship with God. They are genuinely open to the possibility, willing to follow evidence where it leads, and lacking any psychological or volitional barriers (like deep resentment, prideful rebellion, or a prior commitment to atheism) that would prevent them from believing *if* adequate evidence were present. They are sincere seekers who simply find themselves unconvinced.
  4.  **The Implication of Divine Capability:** A perfectly loving God, possessing unlimited power and knowledge (omnipotence and omniscience), would be capable of ensuring that such nonresistant nonbelief does not occur. Such a God could provide evidence sufficient to elicit belief in any nonresistant person without violating their freedom or dignity in any way essential to the desired relationship.
  5.  **The Conclusion:** Therefore, if a perfectly loving God exists, there should be *no* nonresistant nonbelief. The observed existence of even *one* clear, sustained case of nonresistant nonbelief is logically incompatible with the existence of such a God. Hence, a perfectly loving God does not exist.

  **The Crucial Distinctions Doing the Work:**
  *   **Nonresistant vs. Resistant Nonbelief:** The argument deliberately excludes those who actively *reject* God or would resist belief even with overwhelming evidence. It targets only those genuinely *open* but unconvinced. This prevents the theist from dismissing the problem as merely a consequence of human sin or rebellion.
  *   **Sufficiency of a Single Case:** Because a perfectly loving God would desire a relationship with *every* capable person, the failure to reach even *one* genuinely open seeker constitutes a decisive failure of divine love and capability. It demonstrates a flaw in the divine character or power as traditionally conceived. The argument doesn't require widespread nonbelief; one clear counterexample suffices to falsify the claim of universal, perfectly effective divine love.

  ### II. Evaluating the Free Will / Epistemic Distance Defense (Hick, Swinburne)

  **The Defense Stated Strongly:**
  Proponents like John Hick and Richard Swinburne argue that overwhelming, coercive evidence of God's existence would actually *undermine* the very relationship God desires. Hick's concept of "epistemic distance" posits that God must remain somewhat hidden to preserve human *authenticity* and *moral freedom*.

  1.  **The Goal is Authentic Love, Not Mere Belief:** God desires not just intellectual assent, but a free, trusting, loving response grounded in moral commitment and personal choice.
  2.  **Coercive Evidence Destroys Freedom:** If God's existence were as obvious as the sun's (e.g., constant miracles, undeniable audible commands, visible presence), belief would be psychologically *compelled*, not freely chosen. It would become a mere reaction to overwhelming force, devoid of genuine trust, faith, or moral significance. Like a suitor whose presence is so overpowering the beloved has no real choice, such a God would crowd out the possibility of free love.
  3.  **Epistemic Distance Enables Genuine Choice:** The current state of ambiguity – where evidence for God is real but not overwhelming – creates the necessary "space" for humans to exercise genuine freedom. We can choose to seek God, trust in the face of uncertainty, and develop moral character *without* being overwhelmed by divine presence. This ambiguity allows for the possibility of *authentic* faith and love, which requires an element of risk and trust.
  4.  **Nonresistant Nonbelief is Unavoidable Cost:** Therefore, the existence of some nonresistant nonbelievers is an unfortunate but necessary consequence of God's greater aim: preserving the possibility of authentic, free relationships for *all* humans. If God made belief irresistible for the sincere seeker, it would compromise the freedom essential for the *quality* of relationship God desires for everyone.

  **The Best Comeback (Defending DHA):**
  This defense fails for several reasons, specifically concerning the *nonresistant* nonbeliever:

  1.  **Non-Coercion vs. Non-Belief:** The DHA does *not* demand coercive, overwhelming evidence. It demands evidence *sufficient* to elicit belief *in the nonresistant person*. Schellenberg argues a perfectly loving, omnipotent God could provide evidence that is *person-specific*, *clear enough* to convince the open-minded seeker *without* being psychologically overwhelming or violating their cognitive freedom. This could be a profound subjective experience, a perfectly tailored intellectual insight, or a subtle but undeniable sense of presence – something that provides *rational conviction* to the individual without bludgeoning their will. The defense confuses "sufficient for belief in the nonresistant" with "coercive for everyone, including the resistant."
  2.  **Freedom of Relationship vs. Freedom of Belief:** Even if *belief* were directly caused by clear evidence, the *relationship* itself – the ongoing choices of trust, love, obedience, worship – would remain profoundly free. Knowing a loving parent exists doesn't compel a child to love them back; it enables the relationship within which free love *can* develop. Compelled belief *that* God exists does not entail compelled love *for* God. The core freedom relevant to the relationship concerns the *response* to God, not the initial belief *in* God. The nonresistant nonbeliever is *already* willing to respond; they just lack the necessary belief to *begin* the relationship.
  3.  **The Nonresistant Seeker is Already Open:** The defense seems primarily aimed at preventing *resistance*. But the nonresistant nonbeliever, by definition, *lacks* the resistance the epistemic distance is meant to handle. They *are* open. Withholding the evidence needed to move them from openness to belief is not protecting their freedom; it's arbitrarily preventing the relationship they are *already* disposed to have. Why would a loving God deny a relationship to someone genuinely seeking it, simply to maintain an abstract epistemic condition designed for those who *aren't* seeking?
  4.  **God's Omnipotence and Resourcefulness:** An omnipotent God should be capable of creating beings who can both *freely believe* based on clear evidence *and* freely choose how to relate to Him. The idea that God *cannot* achieve both genuine belief in the nonresistant and genuine freedom in the relationship seems like a limitation imposed on divine power, not a necessary truth.

  **Verdict on Free Will/Epistemic Distance:** This defense fails to adequately address the problem of *nonresistant* nonbelief. It mistakenly equates sufficient evidence for the open seeker with coercive evidence for all, and it overlooks the distinction between the freedom to *believe* (which the nonresistant are already exercising by being open) and the freedom to *relate* (which requires belief as a starting point). A perfectly loving God could provide non-coercive, personally tailored evidence sufficient to convince the genuinely nonresistant seeker without undermining the possibility of authentic relationship. The persistence of nonresistant nonbelief remains incompatible with such a God.

  ### III. Evaluating the Volitional Readiness Defense (Moser)

  **The Defense Stated Strongly:**
  Paul Moser argues that God doesn't merely want belief; God seeks a specific *kind* of transformative relationship characterized by "agapē" (self-giving, transformative love) that requires a fundamental change in human orientation. Evidence is withheld not to protect abstract freedom, but because humans are not *volitionally* or *morally* ready to receive it *properly*.

  1.  **God's Goal is Transformative Relationship:** God desires not just any relationship, but one that morally transforms humans, aligning their will with God's loving character ("volitional theism"). This requires a shift from self-centeredness to God-centeredness.
  2.  **Misplaced Expectations & Human Volition:** Humans often seek *spectator evidence* – proof that satisfies intellectual curiosity or fits preconceived notions of power and glory (e.g., cosmic fireworks). However, God offers *moral-transformative evidence* – evidence that challenges our selfishness and calls for repentance and submission to divine love.
  3.  **Hiddenness as Pedagogical:** God remains hidden (in the sense of not providing the demanded spectator evidence) precisely to *promote* the necessary volitional readiness. Overwhelming, non-transformative evidence might lead to belief, but it would likely be self-serving (belief for comfort, reward, or fear of punishment) or merely intellectual, failing to produce the required moral transformation. It could even reinforce human pride or demands.
  4.  **Evidence Conditioned on Readiness:** Decisive evidence (of the *transformative* kind) *is* available, but only to those who are volitionally prepared – those who approach God with the right "kardia" (heart/mindset): humility, repentance, a willingness to be transformed by divine love, and a commitment to following God's will. Nonbelief, therefore, is not primarily an intellectual failure, but a *volitional* one. The nonresistant nonbeliever might be intellectually open, but they may still lack the crucial *moral readiness* or *submissive posture* required to receive and respond rightly to God's self-revelation.
  5.  **Nonresistant Nonbelief Explained:** The sincere seeker who remains unconvinced hasn't yet met the volitional conditions. Their seeking, while genuine, may still be tainted by self-interest, intellectual pride, or an unwillingness to accept the transformative demands of encountering a holy, loving God. God waits until the seeker is truly ready for the *kind* of relationship God offers.

  **The Best Comeback (Defending DHA):**
  Moser's defense is sophisticated but ultimately fails to reconcile nonresistant nonbelief with a perfectly loving God:

  1.  **Shifting the Goalposts & Redefining Nonresistance:** Moser subtly redefines "nonresistant." For Schellenberg, nonresistance means openness to belief and relationship based on available evidence. Moser adds a further, hidden criterion: a specific state of moral purification and volitional submission *prior* to receiving sufficient evidence. This effectively argues that many who seem nonresistant by Schellenberg's lights are *actually* volitionally resistant. This risks making the defense unfalsifiable – any nonbelief can be attributed to hidden volitional defects. It undermines the clear, observable criterion of openness central to the DHA.
  2.  **The Catch-22 of Readiness:** How does one achieve the required volitional readiness *without* the transformative encounter with God? If the encounter itself is needed to catalyze the transformation, but God withholds the encounter until *after* the transformation has begun, this creates a vicious circle. A perfectly loving God, desiring relationship, would *initiate* the transformation by providing the very evidence/encounter needed to spark repentance and humility in the genuinely open seeker. Withholding the necessary catalyst seems punitive or arbitrary, not loving.
  3.  **Punishing Sincere Seeking:** The nonresistant nonbeliever, by Schellenberg's definition, is *already* seeking, open, and willing to follow evidence. To claim they are *still* not "ready" implies that God finds their current state of sincere seeking *itself* inadequate or unworthy of response. This portrays God as demanding a near-perfect state of moral contrition *before* deigning to reveal Himself, which seems contrary to the image of a gracious, seeking God found in many theistic traditions. It makes divine love conditional on achieving a state that seems impossible without divine aid.
  4.  **The Problem of "Spectator Evidence":** While Moser critiques demands for overwhelming power displays, the DHA doesn't require this. It only requires sufficient evidence for *belief* in the nonresistant person. This could be a profound, personal, *transformative* experience. The fact that such experiences seem absent for many sincere seekers is the problem. Moser's claim that God only provides transformative evidence to the volitionally ready doesn't explain why God doesn't *use* such transformative evidence *to create* volitional readiness in the open seeker. An omnipotent, loving God could surely find a way to reveal Himself transformatively *to* the sincere seeker without violating their agency, thereby *initiating* the relationship and the transformation simultaneously.
  5.  **Compatibility with Divine Love:** A perfectly loving parent doesn't hide from a child genuinely seeking comfort and connection, demanding the child achieve a state of perfect humility first. The parent responds to the seeking, fostering the relationship *within which* growth and transformation occur. Moser's God seems to withhold the relationship itself until preconditions are met, which appears more like conditional love than perfect, unconditional agapē.

  **Verdict on Volitional Readiness:** While Moser's focus on transformative relationship is valuable, his defense fails. By redefining nonresistance to include hidden volitional conditions, it makes the defense potentially unfalsifiable and undermines the DHA's clear target. It creates an unreasonable catch-22 for the seeker and portrays God as withholding relationship from those genuinely open to it based on unachieved (and perhaps unachievable without divine aid) moral prerequisites. This stance is incompatible with the proactive, seeking, unconditional love attributed to a perfect God. The persistence of nonresistant nonbelief, understood as sincere seekers lacking belief, remains unexplained and inexplicable under this model.

  ### Conclusion: The Argument Stands

  Having rigorously examined the two most prominent theistic strategies for countering Schellenberg's Divine Hiddenness Argument, we must conclude that **neither successfully rescues the traditional conception of a perfectly loving, omnipotent, personal God.** The argument goes through.

  *   The **Free Will/Epistemic Distance defense (Hick/Swinburne)** fails because it conflates sufficient evidence for the *nonresistant* seeker with coercive evidence for all. It fails to demonstrate why a loving, omnipotent God could not provide *personally tailored, non-coercive* evidence sufficient to elicit belief in the genuinely open individual without undermining the subsequent freedom essential to the relationship. The presence of nonresistant nonbelief indicates a failure of divine love or capability precisely where it should be most effective.
  *   The **Volitional Readiness defense (Moser)**, while more nuanced, fails by effectively redefining "nonresistant" in a way that renders the category potentially empty or unverifiable. It imposes unreasonable preconditions for divine self-revelation, creating a catch-22 for the sincere seeker and portraying God as withholding relationship arbitrarily until hidden moral standards are met. This contradicts the proactive, gracious love central to theism.

  **The Verdict:** Schellenberg's argument, based on the existence of nonresistant nonbelief, demonstrates a logical incompatibility between the observed world and the existence of the traditional personal God – understood as perfectly loving, omnipotent, omniscient, and desiring personal relationships with all capable humans. The single case of a genuinely open, capable seeker who, through no fault of their own (no resistance, no volitional defect as defined by Schellenberg), fails to believe, is sufficient proof that such a God does not exist. The theistic replies, examined on their strongest terms, do not overcome this core logical problem; they either misunderstand the nature of the required evidence or impose unreasonable and unloving preconditions on the divine offer of relationship. The Divine Hiddenness Argument stands as a powerful, perhaps decisive, objection to classical theism. Your doubts, rooted in this argument, appear rationally justified. At most, the argument leaves room only for conceptions of God radically different from the personal, perfectly loving deity of traditional monotheism – conceptions where God's love is limited, conditional, ineffectual, or fundamentally unlike human conceptions of perfect love.
