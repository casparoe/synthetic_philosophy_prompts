prompt: |-
  Something that happened in my friend group this summer turned into a running argument, and I would really like an outside opinion, because I honestly cannot tell who is right. At Thanksgiving, in front of the whole extended family, my friend Marcus promised his younger cousin that he would personally teach him to drive the following summer, before the cousin was even old enough to get his learner's permit. It clearly meant a lot to the cousin, who doesn't get much one-on-one time with Marcus. Then, in the spring, Marcus landed a highly competitive summer internship, the kind that looks great on college applications, which ended up occupying every weekday of the summer -- exactly the time he and his cousin would have used. Marcus never taught him at all, not even one shortened lesson, and just sent a text apologizing once the internship started. His cousin was noticeably hurt.

  Two people in my group, Nadia and Ben, have been arguing about this for weeks, and I keep getting asked to referee even though I really don't have a strong view of my own. Nadia's opening position is that Marcus simply broke his promise: he said he would do a specific thing and didn't, and 'something better came along' cannot count as a valid excuse, since there is always some reason available for breaking a promise, and if a sufficiently good reason were all it took to be excused, promises would never really bind anyone in the first place. Ben responded that not all reasons are equal: every promise is implicitly made against a backdrop of ordinary circumstances, and a rare opportunity like this is exactly the sort of thing his cousin, if he'd been asked in advance, would reasonably have waved off, so Marcus isn't violating the actual spirit of what he committed to. Nadia came back by pointing out that this cuts against Marcus, not for him: his cousin obviously would not have waved it off, since he had been counting on it all summer, and, more importantly, Marcus never actually asked -- he privately decided the internship counted as an exception and only informed his cousin afterward. Ben's final reply was that you can't expect someone to get the other person's sign-off every time circumstances change, since that would make promises unworkable; there has to be some objective standard for what counts as a reasonable exception, rather than just whatever the person on the receiving end happens to prefer, since they will almost always prefer that the original promise be kept, no matter the reason.

  Could you go through these four moves individually rather than just declaring an overall winner -- for each one, say what it gets right, where it overreaches, and how well it holds up against the move that came before it? I would also like to know whether Nadia and Ben are both missing some further consideration that would actually help settle a case like this one.
reasoning: |-
  Okay, the user is describing a situation in their friend group where Marcus promised his younger cousin he'd teach him to drive over the summer but then took a prestigious internship instead. The user wants an analysis of each argument made by Nadia and Ben, plus any overlooked factors. 

  First, I need to unpack the core ethical dilemma: promises vs real-world constraints. The user seems genuinely conflicted and tired of being forced to referee, so they likely want both philosophical clarity and practical resolution tools. 

  Breaking down the four moves:
  Nadia's first point is strong on promise-keeping as a moral absolute - she's right that "better opportunities" can't automatically override commitments. But she overlooks how life inevitably interrupts plans. Ben counters with implied conditions - a solid point since no promise exists in a vacuum. His flaw? Assuming the cousin would agree without evidence.

  Nadia's rebuttal hits hard: Marcus didn't consult the cousin, which is crucial because the kid's emotional stake changes the equation. Ben's "unworkable" argument has merit logistically but feels cold when applied to a vulnerable kid who idolizes his cousin.

  What's missing? Three big things: 
  1. Marcus' duty to repair - an apology text was inadequate for a broken promise that damaged trust. 
  2. The power imbalance - a teen cousin can't reasonably "demand" Marcus keep his word. 
  3. Alternatives - could Marcus have offered weekends? Found another teacher? The lack of effort compounds the wrong.

  The user might also need help navigating group dynamics - this isn't just about ethics but ending a tiresome debate. Highlighting mutual oversights (both arguers ignore relational aspects) could help them reframe the discussion.
answer: |-
  Here's a breakdown of each argument, its strengths, weaknesses, and how it holds up against the prior move, followed by key considerations Nadia and Ben are missing:

  ### Breakdown of the Arguments

  1.  **Nadia's Opening Position: "Marcus broke his promise."**
      *   **What it gets right:** Nadia correctly identifies the core issue: a clear, specific promise was made ("*personally* teach him *that summer*") and not kept. Her point that "something better came along" can't *automatically* excuse broken promises is crucial. If *any* "good reason" sufficed, promises would lose all meaning. She emphasizes the *act* of breaking the commitment.
      *   **Where it overreaches:** It adopts an overly rigid, almost absolutist view of promises. It doesn't sufficiently acknowledge that promises are implicitly made within a context of reasonably foreseeable circumstances. Life is unpredictable, and unforeseen, significant events *can* genuinely prevent fulfillment without implying bad faith at the time of promising. It risks making promise-keeping seem impossible in a complex world.
      *   **Holds up against... (Nothing prior):** This is the foundational argument. It establishes the core moral violation: the promise was broken.

  2.  **Ben's Response: "Not all reasons are equal; the internship is a reasonable exception."**
      *   **What it gets right:** Ben correctly identifies that promises *do* have implicit conditions ("against a backdrop of ordinary circumstances"). A rare, career-defining opportunity like a highly competitive internship *is* a significant and unforeseeable (at the time of the promise) event. He rightly points out that the *reason* matters – not all excuses are created equal. His point about the cousin hypothetically agreeing is an attempt to gauge the "spirit" of the promise.
      *   **Where it overreaches:** He assumes the cousin *would* have waived the promise ("*would reasonably have waved off*") without evidence, which Nadia effectively challenges later. More importantly, he glosses over *how* Marcus handled it – making a unilateral decision without consultation. The "spirit of the commitment" argument weakens significantly when the person relying on the promise is demonstrably *not* okay with the exception.
      *   **Holds up against Nadia's Opening:** It successfully counters Nadia's rigidity by introducing the necessary nuance of context and reasonableness. It highlights that Nadia's view, taken to extremes, makes promises impractical. However, it doesn't fully address the *fact* of the broken promise or the hurt caused; it only tries to justify it.

  3.  **Nadia's Rebuttal: "The cousin wouldn't have waived it; Marcus decided unilaterally."**
      *   **What it gets right:** This is Nadia's strongest point. She effectively demolishes Ben's hypothetical by pointing to the *reality*: the cousin *was* hurt and counted on it, proving he *wouldn't* have readily waived the promise. More crucially, she zeroes in on Marcus's *process*: he made a unilateral decision about what constituted a valid exception and only *informed* his cousin afterward. This bypasses the respect and consideration owed to the promisee. The cousin's feelings and reliance are central here.
      *   **Where it overreaches:** While powerful, it doesn't completely negate the *validity* of the internship as a significant reason. It focuses heavily on the cousin's perspective (which is vital) but perhaps downplays the genuine opportunity cost Marcus faced. It doesn't offer a clear alternative for *how* Marcus should have handled an unforeseen conflict beyond keeping the promise.
      *   **Holds up against Ben's Response:** This rebuttal is highly effective. It exposes the flaw in Ben's hypothetical waiver argument with concrete evidence (the cousin's hurt). More importantly, it shifts the focus from the abstract "reasonableness" of the excuse to the concrete *failure in process* – Marcus's lack of communication and consultation. This makes Ben's justification feel cold and dismissive of the actual relationship impact.

  4.  **Ben's Final Reply: "Can't expect sign-off every time; need an objective standard."**
      *   **What it gets right:** Ben identifies a practical problem with Nadia's implied solution (needing explicit approval for any change): it *could* become unworkable, especially for minor adjustments or truly unforeseen emergencies where immediate communication isn't possible. He's right that the promisee's preference alone isn't a sufficient standard, as they will naturally always prefer the promise be kept.
      *   **Where it overreaches:** He mischaracterizes the situation. This wasn't a minor adjustment or an emergency where communication was impossible. Marcus knew about the internship well in advance of summer starting. Ben uses the need for *some* objective standard to avoid the *specific* failure here: Marcus had ample time and opportunity to *discuss* the conflict with his cousin, explain the opportunity, express his dilemma, and *together* find a solution (even if that solution was reluctantly accepting the broken promise). He fails to address the power imbalance (older cousin/younger admirer) and the specific emotional significance of the promise. "Objective standard" risks ignoring the relational context.
      *   **Holds up against Nadia's Rebuttal:** It weakly addresses the "unworkability" angle but fails to counter Nadia's core points about the cousin's demonstrable hurt and Marcus's unilateral decision-making *in this specific case*. It feels like an evasion of the relational failures Nadia highlighted. It doesn't grapple with the fact that while you might not need "sign-off" for *every* change, a major, foreseeable conflict involving a deeply personal promise to a vulnerable party absolutely demands communication and effort.

  ### What Nadia and Ben Are Missing: Key Considerations for Settling the Case

  1.  **The Nature of the Promise & Relationship:**
      *   This wasn't a casual promise between equals. It was a specific commitment made by an older, admired cousin to a younger one who clearly craved individual attention and bonding ("*doesn't get much one-on-one time*"). The *value* of the promise was as much about the bonding and demonstrated care as it was about driving instruction. Breaking it without meaningful consultation deeply undermined that relational value.

  2.  **Marcus's Duty of Care & Effort:**
      *   Even accepting the internship as a valid reason *not to fulfill the original plan*, Marcus's obligations didn't end there. His duty was to:
          *   **Communicate Early & Honestly:** Tell his cousin *as soon as he knew* about the conflict, explaining the opportunity and his dilemma, expressing genuine regret.
          *   **Negotiate/Offer Alternatives:** Could he do *any* lessons on weekends? Could he help find another trusted teacher and maybe contribute financially? Could he schedule dedicated bonding time *around* the internship? Could he make a firm plan for *after* the internship (even if past the "summer" deadline)?
          *   **Acknowledge the Hurt:** A text apology once the internship started was woefully inadequate. A face-to-face conversation acknowledging the cousin's disappointment and the broken trust was essential.
      *   Marcus failed on all these counts. He made a decision *for* his cousin, offered a minimal apology *after* the fact, and made no apparent effort to mitigate the harm or offer alternatives. This lack of effort and care is arguably as significant as the broken promise itself.

  3.  **Mitigation vs. Justification:**
      *   Ben tries to *justify* the broken promise entirely. Nadia focuses solely on the *wrongness* of breaking it. Both miss the middle ground: the internship might *explain* why the original plan became impossible, but it doesn't *justify* Marcus's subsequent lack of action, communication, and care. The wrong lies less in taking the internship (which is understandable) and more in *how* he handled the resulting conflict with his cousin.

  4.  **The "Objective Standard" Needs Context:**
      *   Ben's desire for an "objective standard" is understandable but simplistic in relational ethics. The "reasonableness" of an excuse depends heavily on:
          *   **The significance of the promise:** (High - bonding, milestone, specific time).
          *   **The foreseeability of the conflict:** (The internship arose *after* the promise, but Marcus knew well before summer).
          *   **The vulnerability of the promisee:** (Younger cousin, emotionally invested).
          *   **The availability of alternatives/mitigation:** (Plenty of time to discuss/find solutions).
          *   **The promisor's effort to communicate and repair:** (Minimal to none).
      *   Applying these factors, Marcus's excuse (internship) is strong, but his *handling* of the situation was objectively poor based on the relational duties involved.

  **Conclusion:**

  *   **Nadia is ultimately more correct on the core issue:** Marcus broke a significant promise made to a vulnerable relative, handled it poorly, and caused real hurt. Her strongest point is about the unilateral decision-making and lack of consultation.
  *   **Ben has a point about context and reasonableness:** The internship *is* a valid, significant reason why the original plan became untenable, and expecting explicit "sign-off" for *every* change is impractical. However, he uses this valid point to excuse Marcus's specific failures in communication, effort, and care for his cousin's feelings.
  *   **The Real Failure:** Marcus's primary ethical failing wasn't taking the internship; it was his failure to proactively communicate with his cousin, express genuine care and regret for the conflict, explore alternatives, and mitigate the harm caused by the necessary change of plans. He prioritized his own opportunity and then minimized the relational fallout. The broken promise is the symptom; the lack of relational responsibility is the disease. This is the key consideration missing from both Nadia and Ben's arguments.
