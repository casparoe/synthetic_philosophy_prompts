  Now, the alternatives: IRV and Condorcet methods. IRV eliminates the least preferred option in rounds, but it can still be affected by irrelevant alternatives. Condorcet methods look for pairwise winners. They satisfy the Condorcet criterion, meaning if a film beats all others head-to-head, it should win. But Arrow's theorem states no system can meet all fairness criteria simultaneously. The member's point about Arrow's theorem is valid but shouldn't paralyze decision-making. The key is to choose a method that minimizes the specific issues they faced.

  The committee's primary concern is the sensitivity to irrelevant alternatives. Condorcet methods are better here because they focus on pairwise comparisons, which are less affected by non-contenders. However, Condorcet methods can have cycles (Condorcet paradox), where no clear winner exists. But in practice, with five voters, cycles might be rare. They'd need a tie-breaking rule, like Copeland or Tideman, to handle such cases.

  IRV is simpler but has its own flaws. It can fail the Condorcet criterion and still be influenced by irrelevant alternatives. Also, it might not reflect the true preferences if voters strategically rank. Given their small group size, Condorcet is feasible since pairwise comparisons are manageable.

  Addressing Arrow's theorem: It's important to acknowledge that no system is perfect, but some methods are better suited to specific problems. Arrow's theorem shows the impossibility of a perfect system, but in practice, different methods have different strengths. For this committee, minimizing the impact of irrelevant alternatives is crucial, and Condorcet methods handle that better than Borda or IRV.

  The memo should recommend a Condorcet method like Copeland, explain why it's better for their issue, compare it to IRV and Borda, and honestly address Arrow's theorem. Also, practical steps: using a spreadsheet for pairwise comparisons, handling ties, and ensuring transparency. This approach addresses their immediate problem while being realistic about theoretical limitations.
answer: |-
  ## MEMORANDUM  
  **To:** Film Festival Selection Committee  
  **From:** [Your Name], Economics Student & Committee Member  
  **Date:** October 26, 2023  
  **Subject:** Recommendation for Revised Best Picture Aggregation Procedure  

  ### 1. Background & The Problem
  Our discovery that this year's Best Picture result was reversed by removing an experimental short film (a clear non-contender) highlights a critical flaw in our current Borda count system: **extreme sensitivity to irrelevant alternatives**. While no ranking system is immune to paradoxes, Borda count is particularly vulnerable to this specific issue. The radically differing placements of the short film relative to the frontrunners distorted the point allocations enough to change the winner. This undermines confidence in the result and the legitimacy of our award.

  ### 2. Proposed Solution: Adopt a Condorcet Method (Specifically Copeland's Method)
  I recommend we replace Borda count with a **Condorcet-compliant pairwise comparison method**, specifically **Copeland's Method**. Here's how it works for our six films and five jurors:

  1.  **Pairwise Comparisons:** For every possible pair of films (e.g., Film A vs. Film B), count how many jurors rank A above B. If more than half prefer A, A wins that matchup. Ties are possible.
  2.  **Score Calculation (Copeland):** For each film, calculate its Copeland score:  
      `(Number of other films it beats head-to-head) - (Number of other films that beat it head-to-head)`  
      *Example: A film that beats 4 others and loses to 0 has a score of +4. A film that beats 2, loses to 2, and ties 1 has a score of 0 (2 wins - 2 losses).*
  3.  **Determine Winner:** The film with the highest Copeland score wins. In case of a tie, use the following tie-breaker sequence:
      *   a. Head-to-head result between the tied films.
      *   b. Highest number of *wins* (ignoring losses).
      *   c. Lowest number of *losses*.
      *   d. Original Borda count (as a last resort, preserving some historical continuity).

  ### 3. Justification: Why Condorcet/Copeland Over Rivals
  *   **vs. Borda Count:** The core problem we encountered – sensitivity to irrelevant alternatives – is significantly mitigated. The pairwise comparisons focus *only* on how films fare against each other *directly*. The presence, absence, or specific ranking of a film like the experimental short (which beats no frontrunner and is beaten by all frontrunners) cannot change the outcome of a head-to-head contest between the two frontrunners. Copeland directly addresses the flaw we identified. Borda count's fixed points-per-rank system inherently amplifies the distorting effect of "noise" candidates.
  *   **vs. Instant-Runoff Voting (IRV):** While IRV eliminates "spoilers" sequentially, it has its own vulnerabilities:
      *   **Non-Monotonicity:** A film can lose *because* it received *more* first-place votes, or win because it received *fewer* – a deeply counterintuitive result.
      *   **Sensitivity to Irrelevant Alternatives (Still Possible):** While less pronounced than Borda, IRV *can* be affected by the inclusion/exclusion of candidates that alter elimination order, potentially changing which frontrunner survives longer. Our problem (dependence on a non-contender) isn't IRV's *strongest* suit.
      *   **Ignores Condorcet Winners:** IRV can eliminate a film that would beat every other film head-to-head (the Condorcet Winner) in an early round. Copeland guarantees the Condorcet Winner wins (if one exists).
  *   **Copeland's Specific Advantages:** Among Condorcet methods, Copeland is:
      *   **Simple & Transparent:** Easy to understand (wins minus losses) and calculate manually for our small scale (5 voters, 6 films).
      *   **Handles Cycles:** Unlike simpler Condorcet methods that fail if there's a cycle (A>B, B>C, C>A), Copeland produces a clear ranking based on net wins.
      *   **Resistant to Strategic Voting:** While no method is perfectly strategy-proof, Copeland is generally considered robust in small committees like ours.

  ### 4. Engaging with Arrow's Impossibility Theorem
  The argument that "Arrow's theorem makes changing methods pointless" deserves serious engagement, not dismissal. Arrow's theorem is a profound and correct result: **no ranked-choice voting system with three or more options can simultaneously satisfy all of five seemingly reasonable fairness criteria (Unrestricted Domain, Non-dictatorship, Pareto Efficiency, Independence of Irrelevant Alternatives (IIA)).**

  *   **Acknowledging the Truth:** Arrow's theorem *does* mean we cannot find a "perfect" system. Our current Borda count fails IIA (as we saw). IRV fails IIA and Monotonicity. Copeland fails IIA (though less dramatically than Borda in practice for our problem) and sometimes the full Condorcet criterion if there's a cycle (though Copeland resolves it). **No method on our table satisfies all criteria.**
  *   **Why Change Isn't Pointless:** Arrow's theorem shows *universal* impossibility, but **politics is about choosing which flaws are least damaging in a specific context.** Our specific, painful experience was a catastrophic failure of IIA under Borda count. Copeland (while not perfectly satisfying IIA) is *dramatically more resistant* to the *type* of IIA failure we suffered – where an irrelevant alternative drastically alters the winner. Arrow tells us we *must* accept some flaw; it doesn't tell us we must accept the *most damaging flaw for our specific purpose*.
  *   **Focused Improvement:** We aren't seeking theoretical perfection. We are seeking **practical robustness** for our specific task: identifying the film most broadly respected by the committee, minimizing the chance that a non-contender dictates the winner. Copeland directly targets this goal by grounding the result in direct comparisons between the serious contenders. Arrow doesn't doom us to futility; it guides us to choose a system whose inherent compromises are less problematic for our unique situation (small group, clear non-contenders likely) than our current system.

  ### 5. Practical Implementation & Recommendation
  *   **Calculation:** We can easily manage pairwise comparisons and Copeland scoring using a shared spreadsheet template. The process is manageable for 6 films and 5 voters.
  *   **Transparency:** We can share the full matrix of pairwise results and Copeland scores in the post-festival report, enhancing the legitimacy and explainability of the result.
  *   **Vote:** I move that the committee adopt **Copeland's Method** (as described in Section 2) for determining the Best Picture winner starting at next year's festival.

  This method directly addresses the instability we witnessed with Borda count, offers greater robustness against irrelevant alternatives compared to both Borda and IRV, leverages the clarity of pairwise comparisons, and provides a clear, defensible result even in complex preference scenarios. While Arrow's theorem reminds us no system is flawless, Copeland offers the most stable and committee-aligned outcome for our specific needs.

  I look forward to discussing this recommendation at our meeting.  
  **Attached:** Example spreadsheet demonstrating Copeland calculation using simplified past data.
