answer: |-
  ## Graduate Seminar Dialogue: CDT vs. EDT on Death in Damascus

  **Setting:** Two TAs, Alex (Causal Decision Theorist) and Sam (Evidential Decision Theorist), preparing materials after class. Death is a perfect predictor, and the agent knows fleeing Damascus and staying are perfectly symmetric choices: Death will be in the city they choose.

  **Alex (CDT):** Okay, let's dig deeper into Damascus. Forget the initial "one-box/two-box" analogies. From a *causal* perspective, once the agent is deciding, Death's prediction is fixed. If Death predicted Damascus, fleeing *causes* me to be where Death *isn't* – Aleppo. If Death predicted Aleppo, fleeing *causes* me to be where Death *is* – Aleppo. But crucially, fleeing *dominates* staying: whichever prediction was made, fleeing gives the better outcome *given that prediction*. So CDT says flee.

  **Sam (EDT):** I see why you say that, Alex, but your dominance argument hinges on conditioning on the *prediction*, which is evidence fixed *before* the decision. EDT conditions on the *act itself* to see what it *signifies*. If I *choose* to flee, that's strong evidence Death *predicted* I would flee. Since Death is perfect, that means Death is *in Aleppo*. So choosing to flee is strong evidence I'll die in Aleppo. Similarly, choosing to stay is evidence Death predicted it, so Death is in Damascus, and I die. The expected utility calculation, using conditional probabilities P(Death in Aleppo | I flee) = 1, P(Death in Damascus | I stay) = 1, makes both acts look equally terrible. EDT says I'm indifferent.

  **Alex (CDT):** Right, that's the standard fork. But here's where ratifiability bites *both* of us, Sam. Take CDT first: I recommend fleeing. But now, suppose the agent *supposes* they will flee. Given that supposition, what should they think about the prediction? Well, if they *are* going to flee, that means Death *predicted* fleeing. So Death is in Aleppo. Now, *conditional on fleeing*, staying would mean being in Damascus while Death is in Aleppo – survival! Suddenly, *given that I flee*, staying looks better. My recommended act isn't ratifiable. It destabilizes.

  **Sam (EDT):** Exactly! CDT recommends fleeing, but conditional on fleeing, staying dominates. That's a clear failure of ratifiability. EDT avoids that. We *start* by conditioning on the acts. Conditional on fleeing, EU(flee) = 0 (death), EU(stay) = 1 (life) – but crucially, *I can't actually condition on staying while simultaneously supposing I flee*. EDT's initial calculation *already* incorporates the evidential link. When EDT says I'm indifferent, that's *stable*. Supposing I flee, P(Death in Aleppo | I flee) is still 1, so EU(flee) = 0. Supposing I stay, EU(stay) = 0. Neither act looks better than the other *under the supposition I perform it*. So EDT *is* ratifiable here.

  **Alex (CDT):** Is it stable, or just question-begging? You're saying EDT is ratifiable because it *defines* rationality using the very conditional probabilities that create the bind. But look at the *substance*: If I *suppose* I will flee, I have overwhelming evidence Death is in Aleppo. Given *that* state of the world (Death in Aleppo), staying in Damascus is objectively better! EDT tells me to be indifferent, but *given the evidence associated with my supposition*, staying is clearly preferable. EDT seems to ignore the *causal* fact that *if* Death is in Aleppo (which my supposition of fleeing strongly suggests), then staying *causes* survival. Your "stability" feels like refusing to look at the obvious implications of your own supposition.

  **Sam (EDT):** But Alex, that's the core disagreement! EDT *denies* you can separate "Death is in Aleppo" from "I flee" in the way CDT requires. The *evidence* that Death is in Aleppo *is* the evidence that I flee. You can't hold the prediction fixed independently when you condition on the act. When I suppose I flee, I'm not learning "Death is in Aleppo" *by some other means*; I'm learning it *because* I'm supposing I flee. The causal structure you want to exploit – "Death is in Aleppo, therefore staying is safe" – is inaccessible *under that supposition* because the supposition *implies* the state. EDT's conditional probabilities *are* capturing the relevant dependencies. The instability you feel is the same evidential loop EDT acknowledges upfront. It doesn't disappear; it's managed within the conditional framework, leading to indifference.

  **Alex (CDT):** Fine, let's grant EDT its stable indifference. But it's a stability of despair – both choices doom me! Isn't that a problem? This is where people suggest randomization. Flip a coin. Heads flee, tails stay. Doesn't that break the evidential link? Now P(Death in Aleppo | I randomize) = 0.5, and similarly for Damascus. The expected utility of randomizing should be 0.5 (50% chance of survival), better than the 0 from either pure act under EDT. CDT might see it as exploiting a new option where neither pure act dominates.

  **Sam (EDT):** Randomization *does* change the act set, Alex. EDT would agree: conditional on randomizing, P(Death in Aleppo | randomize) = 0.5, P(Death in Damascus | randomize) = 0.5. EU(randomize) = 0.5 * 0 + 0.5 * 1 = 0.5? Wait, no. Conditional on randomizing, what's P(survival)? If I randomize, Death predicts *that*. Since Death is perfect, if I randomize, Death predicts randomization. Death goes to a random city. When I then implement the coin flip, I have a 50% chance of being where Death *isn't*. So yes, EU(randomize) = 0.5 under EDT, better than 0 for pure acts. So randomization seems to dominate the pure acts under EDT.

  **Alex (CDT):** But is this a genuine solution or just moving the goalposts? We started with a choice between two acts. Now we've introduced a third, mixed act. CDT can also recommend randomizing if we model it explicitly. But the *original* puzzle was about the two deterministic choices. Randomization sidesteps the predictor's trap by making my choice unpredictable *in principle*, but it doesn't actually resolve the conflict between causation and evidence *for the original options*. It just changes the game. The instability for the pure acts remains – CDT still can't ratify fleeing, and EDT still sees them as equally bad. Randomization is a *different* strategy that exploits the structure, not an analysis that fixes the initial instability.

  **Sam (EDT):** That's fair. Randomization doesn't make fleeing or staying any more ratifiable or evidentially appealing *on their own*. The pure choice problem retains its inherent tension. EDT resolves the *expanded* choice set (including randomization) consistently: pure acts EU=0, mixed act EU=0.5, so randomize is best. But it doesn't provide a satisfying answer for why the pure acts are unstable or indifferent; it just highlights that *within this predictor setup*, deterministic choice is self-defeating. The instability for pure acts isn't solved; it's circumvented by adding an option that severs the act-prediction link.

  **Alex (CDT):** And CDT? Well, if we model randomization explicitly, it might recommend it too, as a way to achieve a 50% survival rate where pure acts guarantee death under the opponent's (Death's) perfect strategy. But again, it doesn't make fleeing ratifiable. The core philosophical clash remains untouched: CDT insists on evaluating acts based on their causal consequences in possible states, even if conditioning on the act changes our beliefs about the states in a way that makes the evaluation unstable. EDT insists the act *cannot* be separated from the evidence it provides about the state, leading to stability only through indifference or by introducing mixed strategies. The Damascus case, stripped down to its symmetric pure choices, leaves us fundamentally at odds. Ratifiability highlights CDT's vulnerability, while EDT's stability feels like resignation to the inevitable doom of pure choice under prediction. Randomization offers pragmatic escape but doesn't reconcile the theories.

  **Sam (EDT):** Precisely. There's no neat resolution here. The case starkly reveals how the different ways of handling the link between act and state – causation vs. conditional evidence – lead to different forms of instability or constraint. EDT accepts the evidential link as fundamental, leading to stable indifference for pure acts but vulnerability to doom. CDT tries to cut the link for evaluation, leading to an unratifiable recommendation. Randomization changes the nature of the act to break the link externally. But the fundamental tension between seeing an act as *causing* outcomes versus *indicating* states, when the act is predicted, remains unresolved. That *is* the lesson of Damascus.
