answer: |-
  You've hit upon a core tension within Augustine's absolutist framework, and your analysis is spot-on. Augustine's insistence that lying is *always* intrinsically sinful *because* it is a deliberate "mismatch between heart and mouth" (a violation of the rational/social order established by God) seems fundamentally at odds with his detailed taxonomy ranking lies by severity. Here's the strongest case for why his own gradation undermines his absolutism:

  1.  **The Severity Ranking Implicitly Acknowledges Consequences as the *Measure* of Sinfulness:** Augustine claims consequences are irrelevant to the *existence* of sin (lying is always sin), but his taxonomy is entirely structured around the *nature* and *gravity* of the *consequences* flowing from the lie's *object*:
      *   **Worst (1-3):** Lies directly harming the soul/faith/relationship with God (e.g., lies about doctrine, lies hindering piety/salvation). Why worst? Because the *consequence* is eternal damnation – the ultimate harm. He doesn't say lying *about* doctrine is worse *as a mismatch*; he says it's worse *because* it *causes* the gravest harm (spiritual death).
      *   **Middle (4-6):** Lies harming justice, truth itself, or causing temporal injustice. Why middle? Because the *consequences* involve social disorder, injustice, and temporal harm, which are serious but less than damnation.
      *   **Least Bad (7-8):** Lies intended to protect someone from physical harm or sexual violation, or lies told solely to please (but not deceive). Why least bad? Precisely *because* the intended *consequence* is bodily safety or social pleasantry, and the potential harm (if any) is less severe. He explicitly states that lying to save a life is the "least unjustifiable" kind of lie *because* it aims to prevent a great evil. This directly references the *consequence* the lie seeks to avert.

  2.  **The "Object" of the Lie is a Proxy for Consequences:** Augustine bases his hierarchy on the "object" of the lie (what the lie is *about* or *aims at*). However, the "object" only gains moral significance *because* of the *consequences* associated *with* that object:
      *   Lying *about* doctrine is bad *because* the *consequence* is leading souls astray.
      *   Lying *to* someone seeking salvation is bad *because* the *consequence* is hindering their path to God.
      *   Lying *to protect* someone is "less bad" *because* the *consequence* is (potentially) saving a life.
      *   The "object" isn't evaluated in a vacuum; its moral weight comes entirely from the *harm or benefit* it typically produces or intends. The taxonomy is a *consequentialist* ranking disguised as an ontology of objects.

  3.  **The Concept of "Tolerable" Sins Undermines Absolutism's Equality:** Augustine calls the lies protecting life "tolerable" (*tolerabiliora*) and "least unjustifiable" (*minime criminosa*). If *all* lies are equally sinful *as acts of willful deception* violating the divine order, how can one be "more tolerable" than another? An intrinsic sin, by definition, should be equally damnable regardless of circumstance. Calling some "tolerable" implicitly admits that the *context* (the potential consequences avoided or caused) mitigates the sin's *impact* or *culpability*, even if not its *existence*. This language of tolerability directly appeals to a harm/benefit calculus.

  4.  **The Underlying Logic is Teleological (Goal-Oriented):** While Augustine denies *consequentialism* (judging the act solely by outcomes), his thought is deeply *teleological* – acts are judged by their conformity to their God-ordained *purpose* (truthfulness for social/divine communion). The problem is that his *ranking* relies on the *subjective teleology of the liar* and the *objective teleology of the thing lied about*. Lying to save a life fails the *absolute* teleology of truth-telling but partially succeeds in the *relative* teleology of preserving life (a good). The hierarchy implicitly weighs these competing teleologies (truth vs. life/safety), which is functionally equivalent to weighing consequences (harm to truth vs. harm to body). The "least bad" lies are those where the *good consequence intended* (saving life) most strongly conflicts with the *intrinsic bad* of the lie.

  5.  **Augustine's Own Struggle Reveals the Tension:** Augustine didn't create this taxonomy casually. He wrestled profoundly with cases like yours. In *Contra Mendacium*, he explicitly rejects lying to save a life, but the *anguish* in his reasoning is palpable. He admits the temptation is strong, acknowledges the apparent good, but ultimately falls back on the absolute command. The very existence and complexity of the taxonomy, born from this struggle, suggest a deep, unresolved conflict between his philosophical commitment to the intrinsic wrong and his pastoral/ethical intuition that *what the lie does* matters intensely. The taxonomy is his attempt to *contain* that conflict without abandoning absolutism, but the consequentialist logic bleeds through.

  **In Conclusion:**

  Augustine's taxonomy is indeed evidence that he couldn't sustain pure absolutism in practice. While he dogmatically insists the *sinfulness* lies *only* in the intentional deception itself, his entire framework for understanding the *gravity* of that sin is built upon:

  *   The **nature of the good harmed** (soul vs. body vs. social order).
  *   The **magnitude of the potential harm** caused (damnation vs. death vs. injustice vs. mere annoyance).
  *   The **good consequence intended** by the liar (saving a life).

  This is fundamentally a **consequentialist and teleological analysis**. The ranking reveals that Augustine, despite his protestations, *does* believe that the *wrongness* of a lie (its seriousness, its "badness") is inextricably linked to the harm it causes or the good it perverts. The taxonomy smuggles in the harm/benefit calculus through the back door of the lie's "object" and the relative "toleration" granted to lies aiming at preventing grave evils. It demonstrates that the *practical moral weight* he assigns to lies cannot be derived solely from the intrinsic "mismatch" but relies heavily on the very consequences he claims are irrelevant to the sin's existence.

  Your family's agonizing choice for your nan highlights the human cost of Augustine's absolutism. His taxonomy, while trying to uphold that absolutism, inadvertently exposes why most ethical systems *do* consider consequences essential: because the potential for profound suffering or profound relief *demands* to be part of the moral equation. Augustine's struggle to rank lies ultimately undermines his claim that outcomes don't matter.
