  **Guiding Principle:** The strongest driver is **normative role-based expectations** combined with **salient counterfactual dependence**. Omissions are likelier to be judged as genuine causes when:  
  1. The agent has a specific obligation or capacity to act (e.g., explicit duty, agreement, or role-responsibility),  
  2. Their inaction is abnormal against expected norms (not merely statistically rare), and  
  3. The dependence is pragmatically salient (not drowned out by infinite trivial dependencies).  

  Cases 1/5 (agreed-upon duty) and 3/6 (professional role) leverage obligations to constrain profligacy. Case 4 (stranger) lacks obligation, weakening its status. Case 7 (rain) lacks any agent to hold responsible, making it a background condition. Case 2 (distant stranger) exemplifies profligacy—it satisfies the counterfactual but violates normative/pragmatic constraints for "cause" attribution.  

  **Key nuance:** This isn't purely moral (e.g., Case 4 has moral weight but still ranks lower) nor purely descriptive—it's about *causal selection* filtering infinite dependencies via expectations tied to roles and capacities.
