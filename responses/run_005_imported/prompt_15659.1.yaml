prompt: |-
  I've been reading up on expressivism in moral philosophy for a piece on the state of play in metaethics, and the Frege-Geach problem seems to settle the debate more decisively than philosophers let on. As I understand it, the fact that a sentence like "lying is wrong" can sit unasserted inside a conditional (as in "if lying is wrong, then getting your little brother to lie is wrong") and still support a valid modus ponens shows that the sentence carries the very same truth-apt content whether it's asserted or embedded — which is exactly what expressivists deny moral claims have. If the logic really is that clean, why do philosophers like Simon Blackburn and Allan Gibbard keep building increasingly elaborate expressivist theories instead of just conceding that cognitivism wins this particular argument?
reasoning: |-
  Okay, the user is diving into expressivism in moral philosophy and the Frege-Geach problem. They think the problem decisively settles the debate against expressivism, and they're puzzled why philosophers like Blackburn and Gibbard keep developing complex theories instead of conceding to cognitivism. Let me unpack this.

  First, I need to recall what the Frege-Geach problem is. It's about how moral statements work in embedded contexts, like conditionals. Expressivists say that moral claims express attitudes, not propositions. But when you put "lying is wrong" in a conditional, it's not being asserted. So if it's just an attitude, how can it function logically the same way as in an assertion? That seems to undermine expressivism because logic requires truth-apt content.

  The user's point is that this should end the debate. But why don't expressivists give up? I remember that Blackburn and Gibbard have responses. Blackburn's quasi-realism tries to show how expressivism can mimic realist talk without accepting moral facts. He uses higher-order attitudes to explain embedded contexts. For example, in the conditional "if lying is wrong, then getting your brother to lie is wrong," it's expressing a commitment to consistency. If you accept lying is wrong but not that getting your brother to lie is wrong, you're being inconsistent in your attitudes. So it's about the logic of attitudes, not truth conditions.

  Gibbard's norm-expressivism uses the idea of planning. Moral judgments are about what to do or approve. In conditionals, it's about contingency in planning. "If lying is wrong..." means under the plan where lying is forbidden, getting your brother to lie is also forbidden. Modus ponens works because accepting the conditional and the antecedent commits you to the consequent in your planning.

  Then there's the distinction between semantic content and psychological state. Expressivists argue that while the psychological state is different, the semantic content can still be truth-apt. They're trying to explain why moral language behaves as if it's truth-conditional without positing moral facts. This is quasi-realism's project: making sense of moral truths within an expressivist framework.

  The user might not realize that expressivists aren't denying moral statements can be true. They're redefining what that truth means. Blackburn's minimalism about truth allows calling moral judgments "true" without corresponding to facts. So when a moral claim is embedded, it's still truth-apt in a minimal sense, which suffices for logic. The real issue is what grounds that truth—attitudes versus facts.

  Also, the user might be underestimating the motivations for expressivism. Cognitivism has its own problems, like explaining moral motivation or the ontology of moral facts. Expressivists avoid these by grounding morality in attitudes. Even if Frege-Geach is a hurdle, they see their solutions as viable, so they don't concede. Plus, the debate isn't settled; there's ongoing refinement on both sides.

  The user's deeper need might be understanding why philosophers persist in complex theories despite apparent knockdown arguments. They want to present a balanced view in their metaethics piece. So explaining the sophistication of expressivist responses and their philosophical motivations is key. Highlighting that the debate is alive because both sides have evolving responses, and that expressivists address Frege-Geach through innovative frameworks rather than ignoring it.
answer: |-
  You've grasped the core challenge of the Frege-Geach problem brilliantly, and it *is* a major hurdle for expressivism. However, the reason philosophers like Blackburn and Gibbard don't simply concede defeat to cognitivism boils down to their belief that expressivism offers compelling *positive* advantages that outweigh the complications of solving Frege-Geach, and that their increasingly sophisticated solutions *do* address the problem, albeit in complex ways. Here's why the debate persists:

  1.  **The Core Motivations for Expressivism Remain Strong:** Expressivists are driven by deep philosophical intuitions:
      *   **Anti-Metaphysical Leanings:** They want to avoid positing "queer" objective moral facts or properties in the world that causally interact with us.
      *   **Explaining Motivation:** They find it intuitively plausible that judging something "wrong" involves a conative state (disapproval, commitment, plan) that inherently motivates action, which cognitivism struggles to explain without adding separate desires (Hume's Law).
      *   **Explaining Disagreement:** They argue expressivism better captures the *nature* of moral disagreement as a clash of attitudes/plans rather than a simple factual error (like disagreeing about the height of a mountain).
      Cognitivists offer responses (e.g., naturalistic moral facts, internalism about judgment), but expressivists find their own starting point more compelling and parsimonious.

  2.  **Expressivists *Do* Offer Solutions to Frege-Geach:** They don't ignore it; they build complex theories *to* handle it. Their core strategy is to show how the *logical* properties of moral language (like supporting modus ponens in conditionals) can be explained by the *logic of attitudes* or *planning states*, rather than by truth-conditional content:
      *   **Blackburn's Quasi-Realism & Higher-Order Attitudes:** Blackburn argues that embedding doesn't require *truth-apt content* but rather *consistency in commitments*. Accepting "If lying is wrong, then getting your little brother to lie is wrong" expresses a *higher-order attitude*: a commitment to disapproving of getting your brother to lie *if* you disapprove of lying. Performing modus ponens isn't tracking truth values; it's maintaining consistency within your network of attitudes. If you accept the conditional and accept that lying is wrong (i.e., you disapprove of lying), but *don't* disapprove of getting your brother to lie, you exhibit an inconsistency *in your practical commitments*, akin to a logical contradiction. The "validity" comes from the norms governing the expression and consistency of these non-cognitive states.
      *   **Gibbard's Norm-Expressivism & Planning:** Gibbard interprets moral judgments as expressing states of *planning* or *norm-acceptance*. "Lying is wrong" expresses the plan to blame lying. The conditional "If lying is wrong, then getting your little brother to lie is wrong" expresses a *contingent plan*: it's a plan *to* plan to blame getting your little brother to lie *in the contingency* that you plan to blame lying itself. Modus ponens works because accepting the antecedent (adopting the plan to blame lying) and accepting the conditional (having that contingent plan) *commits* you logically (by the norms of planning consistency) to adopting the consequent plan (to blame getting your brother to lie). The logic tracks the structure of planning commitments.
      *   **Minimalism about Truth & Representation:** Later expressivists often adopt a deflationary or minimalist theory of truth. They argue that once you have a working account of moral language (including its logic via attitude-logic like Blackburn's or Gibbard's), there's no barrier to *calling* sincere moral judgments "true" in a minimal, disquotational sense ("'Lying is wrong' is true iff lying is wrong"). This allows them to *mimic* the surface features of cognitivism (truth-aptness, truth-predication) while grounding the underlying meaning and function in non-cognitive states. The "truth-apt content" in embedded contexts is explained as a consequence of the *logical role* the sentence plays, which is secured by the attitude/plan logic, not by a prior commitment to representational content.

  3.  **The "Same Content" Claim is Precisely What They Dispute:** Expressivists argue that cognitivism *misidentifies* the fundamental nature of the content. They agree that "Lying is wrong" has the *same semantic role* in asserted and embedded contexts – that's what Frege-Geach highlights. But they deny that this role is *best explained* by it representing a truth-conditional proposition about the world (a moral fact). Instead, they argue that role is *best explained* by its function in expressing and coordinating complex, logically structured non-cognitive states (attitudes, plans, commitments). The "content" is the same in terms of its *logical function* within the language, but its *metaphysical grounding* is fundamentally different. Cognitivists see the logical role as *evidence* for representational content; expressivists see it as a *challenge* to be met by showing how non-representational states can play that role.

  4.  **The Cost-Benefit Analysis Favors Expressivism (For Them):** From the expressivist perspective:
      *   **Cost:** Solving Frege-Geach requires building complex theories of attitude/plan logic and minimalist truth. This is undeniably messy.
      *   **Benefit:** They gain a theory that avoids the metaphysical commitments of cognitivism (mysterious moral facts), elegantly explains moral motivation and disagreement, and fits with a naturalistic worldview. They believe their solutions *work*, even if they are complex. Conceding to cognitivism means accepting those metaphysical commitments and losing the explanatory advantages they prize.

  **Why the Debate Doesn't Settle:**

  *   **Complexity vs. Simplicity:** Cognitivists argue that the expressivist solutions to Frege-Geach are incredibly complex, ad-hoc, and ultimately fail to fully capture the genuine truth-conditional semantics and logical properties of moral discourse. They see expressivism as twisting itself into knots to avoid the obvious (to them) conclusion that moral claims are straightforwardly truth-apt. Expressivists counter that cognitivist metaphysics is ontologically extravagant and struggles with motivation/disagreement.
  *   **Different Starting Points:** The debate rests on fundamental disagreements about the nature of meaning, truth, metaphysics, and psychology. What one side sees as a decisive refutation (Frege-Geach), the other sees as a difficult but solvable engineering problem.
  *   **Ongoing Refinement:** Both sides keep refining their arguments. New expressivist models (e.g., hybrid expressivism, inferentialist approaches) continue to emerge, aiming for better solutions to Frege-Geach and other problems. Cognitivism also evolves (e.g., sophisticated forms of naturalism).

  **In Conclusion:**

  You're right that the Frege-Geach problem is *the* central technical challenge for expressivism and powerfully motivates cognitivism. However, philosophers like Blackburn and Gibbard persist because:

  1.  They believe the core motivations for expressivism (anti-metaphysics, explaining motivation/disagreement) are too strong to abandon.
  2.  They believe their sophisticated theories *do* provide solutions to Frege-Geach by grounding logical validity in the consistency of non-cognitive states (attitudes, plans) and leveraging minimalist theories of truth.
  3.  They dispute the cognitivist interpretation of "same content," arguing that while the semantic/logical role is constant, its fundamental nature is non-representational.
  4.  They see the cost of complex theory-building as worth it to avoid what they perceive as the greater cost of cognitivist metaphysics.

  The debate continues not because philosophers ignore Frege-Geach, but because expressivists believe they can meet the challenge and that the rewards of their metaethical framework justify the effort. Whether they ultimately succeed remains a hotly contested philosophical question. Your piece should acknowledge the power of Frege-Geach *and* the sophisticated expressivist counter-maneuvers that keep the debate very much alive.
