  The river valley baked under its hundredth summer. Kael found Aris knee-deep in the trial plot, sweat carving tracks through the dust on his face, eyes alight with the new grain.

  "It sings, Kael," Aris breathed, crushing a stalk. "Feel the weight? The elders say it needs half the water, yields double. But only if the rains come *just* right. A gamble."

  Kael ran the thick seeds through his calloused fingers. They felt cool, heavy with promise. "And if the rains don't?"

  Aris shrugged, a grin splitting his face. "Then it withers. But look!" He gestured at the small, lush square. "Seven stalks flourished where one would have before. The *average* gain is immense! We'd be fools not to plant it widely."

  Kael felt the familiar unease, like a pebble in his boot. "Widely, yes. But... entirely?"

  "Why not?" Aris challenged. "If the odds are good – and they are, Kael, truly! – betting *everything* each time *must* win out in the end. More seeds planted means more harvest, means even more seeds next season! Exponential!" He painted the future with his hands: bursting granaries, fat livestock, a stone house instead of mud.

  Kael pictured the parched earth of three summers past. He saw the hollow cheeks of his children then. "A good average," he murmured, "doesn't feed you through a bad year."

  Aris clapped him on the shoulder. "Trust the odds, brother. This is our chance."

  The first season, Aris gambled. He converted every scrap of his stored grain into the new seed, planting his entire fertile plot. Kael, after long nights staring at the fire, sowed only half his land with the new grain. The other half held the tough, reliable barley that yielded less but rarely failed.

  The rains came late, but they came. Aris’s field exploded, a sea of green that ripened into gold. He harvested mountains. Kael’s half-field of the new grain did well, but his barley field was merely sufficient. Aris stood amidst his overflowing sacks, laughing. "See? Told you! Next season, *all* of it again!"

  Kael looked at Aris’s bounty, then at his own modest surplus. He felt the sting of timidity. Aris was bold, brilliant. He doubled down.

  The second season, Aris again planted every seed he had, expanding his plot. Kael planted half his land with the new seed, half with barley. The rains were perfect. Aris’s harvest dwarfed Kael’s. He bought a second ox. Kael added only a few sacks to his stores. Aris’s confidence was a physical force; Kael’s caution felt like cowardice.

  "The average wins, Kael!" Aris toasted with rough cider. "Full stake, every time! Watch me build an empire!"

  The third season dawned hot and dry. Aris, eyes fixed on the horizon of his ambition, sowed every precious grain of the new seed. Kael, watching the thirsty sky, planted one-third. The rest went to barley and a patch of drought-resistant millet.

  The rains teased, then failed. The valley cracked. Aris’s vast field of thirsty new grain sprouted bravely, then yellowed, shrivelled, died. He stood in the centre, a lone figure amidst a desiccated wasteland. Nothing. Not a single stalk worth harvesting.

  Kael’s one-third plot of new grain also died. But his barley yielded thin, tough stalks. His millet produced hard, small seeds. It wasn’t abundance, but it filled sacks. Enough. Enough to eat. Enough to plant.

  Aris came to Kael’s door that winter. The laughter was gone, replaced by a hollow look. His ox was sold. His granary echoed. Kael shared his barley bread, the coarse millet porridge. No words about averages or empires passed between them.

  The fourth season arrived. The valley held its breath. Aris had scraped together a pitiful handful of old barley seed, gleaned from charity. He planted it all in a tiny patch, his hands trembling.

  Kael looked at his stores. He had seed. Not mountains, but seed. He looked at the sky, uncertain. He weighed the new grain’s promise against the memory of Aris standing in that dead field. He measured a portion – not half, not a third, but a careful fraction he felt in his bones he could lose without breaking. He mixed it with the reliable barley.

  He walked to the edge of his field, the good seed cool in his palm. He looked towards Aris, bent double over his meagre plot, a figure etched with the arithmetic of ruin. Kael cast his seeds onto the waiting earth, a silent prayer against the indifferent sky, not for abundance, but for survival. The unease hadn't left; it had simply become the ground beneath his feet. The river murmured on, carrying no answers, only time.
