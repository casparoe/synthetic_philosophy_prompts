prompt: |-
  I've been reporting a feature on algorithmic risk-assessment tools used in bail and sentencing decisions, and there's a piece of the story I keep failing to explain to my own satisfaction, let alone a reader's. Everyone in this space eventually recites the shape of the 2016 dispute between ProPublica and the company Northpointe over the COMPAS recidivism tool: ProPublica showed that Black defendants who did not go on to reoffend were nonetheless flagged as high-risk far more often than white defendants who did not reoffend, while Northpointe countered that the tool was equally well-calibrated across race groups (among defendants assigned any given risk score, the actual reoffense rate was about the same regardless of race). At a conference panel on this a few months ago, a data scientist waved his hands and said both sides were right, and that this was "mathematically unavoidable" whenever the two groups have different underlying base rates of reoffending -- and then the panel moved on before I could ask him to actually show me why.

  That's the gap I'd like you to fill. Rather than the general algebraic proof, could you walk me through the intuition for why this is so? Specifically: why can't a risk score be simultaneously well-calibrated within each group and have equal false-positive and false-negative rates across groups, once the two groups' underlying base rates diverge -- true, as I understand it, except in the narrow case where the base rates happen to coincide, or the tool predicts with zero error? I'd love this grounded in a small invented example -- two groups with made-up base rates and a made-up risk threshold, worked through by hand -- so that I can watch the false-positive rates pull apart as the base rates move further from each other, and actually feel why calibration alone is doing that work. I'm less concerned, for now, with adjudicating which fairness criterion courts or parole boards ought to prefer; I just want the impossibility itself to stop feeling like an asserted fact and start feeling like an obvious, almost mechanical consequence of what calibration and equalized error rates each separately demand.
reasoning: |-
  We are going to create a small example to illustrate why, when two groups have different base rates (i.e., different overall rates of reoffending), it is mathematically impossible for a risk assessment tool to simultaneously satisfy two conditions:
    1. Calibration: For any given risk score, the actual reoffense rate is the same for both groups (i.e., the tool is equally well-calibrated across groups).
    2. Equal false positive rates (FPR) and equal false negative rates (FNR) across groups.

  We will consider two groups: Group A (say, white defendants) and Group B (say, Black defendants). We assume that the base rate of reoffending is higher in Group B than in Group A.

  Let:
  - Base rate in Group A (white): 20% (i.e., 20% of white defendants reoffend)
  - Base rate in Group B (Black): 40% (i.e., 40% of Black defendants reoffend)

  We assume we have a risk assessment tool that outputs a binary prediction: "high-risk" or "low-risk". We set a threshold such that we classify a defendant as high-risk if the tool's score is above a certain value. We want to see if we can achieve both calibration and equal error rates.

  But note: calibration is defined per risk score. However, in our simple binary case, we only have two risk categories: high and low. Therefore, calibration would require:
    - Among those classified as high-risk, the reoffense rate should be the same for Group A and Group B.
    - Among those classified as low-risk, the reoffense rate should be the same for Group A and Group B.

  Additionally, we want:
    - The false positive rate (FPR) to be equal: the proportion of non-reoffenders who are incorrectly classified as high-risk should be the same in both groups.
    - The false negative rate (FNR) to be equal: the proportion of reoffenders who are incorrectly classified as low-risk should be the same in both groups.

  We will show that if the base rates are different, then these conditions cannot hold unless the tool is perfect (which it isn't) or the base rates are the same.

  Let's define:
    For Group A (white):
      Total: 1000 defendants
      Reoffenders (positive): 20% of 1000 = 200
      Non-reoffenders (negative): 800

    For Group B (Black):
      Total: 1000 defendants
      Reoffenders: 40% of 1000 = 400
      Non-reoffenders: 600

  Now, let the tool make predictions. We will denote:
    For Group A:
      Let the tool classify some of the non-reoffenders (true negatives) as high-risk: these are false positives (FP_A). The rest of the non-reoffenders are classified as low-risk (true negatives, TN_A).
      Similarly, let the tool classify some of the reoffenders (true positives) as low-risk: these are false negatives (FN_A). The rest are classified as high-risk (true positives, TP_A).

    We have:
      FP_A + TN_A = 800   (non-reoffenders in A)
      FN_A + TP_A = 200   (reoffenders in A)

    Similarly for Group B:
      FP_B + TN_B = 600   (non-reoffenders in B)
      FN_B + TP_B = 400   (reoffenders in B)

  Now, the false positive rate (FPR) for a group is defined as:
      FPR = FP / (FP + TN)   [i.e., proportion of non-reoffenders classified as high-risk]

  Similarly, false negative rate (FNR) is:
      FNR = FN / (FN + TP)   [i.e., proportion of reoffenders classified as low-risk]

  Condition 1: Equal FPR across groups.
      FPR_A = FPR_B
      => FP_A / 800 = FP_B / 600   [because in A, total non-reoffenders=800; in B, 600]

  Condition 2: Equal FNR across groups.
      FNR_A = FNR_B
      => FN_A / 200 = FN_B / 400

  Condition 3: Calibration.
    Calibration for high-risk group: 
        The reoffense rate among those classified as high-risk should be the same for A and B.
        For Group A: TP_A / (TP_A + FP_A) = ?
        For Group B: TP_B / (TP_B + FP_B) = ?
        We require: TP_A/(TP_A+FP_A) = TP_B/(TP_B+FP_B)

    Calibration for low-risk group:
        The reoffense rate among those classified as low-risk should be the same for A and B.
        For Group A: FN_A / (FN_A + TN_A) = ?
        For Group B: FN_B / (FN_B + TN_B) = ?
        We require: FN_A/(FN_A+TN_A) = FN_B/(FN_B+TN_B)

  But note: we have two calibration conditions. However, we will see that the conditions are interdependent.

  Now, let us assume we set equal FPR and equal FNR.

  Let:
    FPR_A = FPR_B = fpr
    FNR_A = FNR_B = fnr

  Then:
    FP_A = fpr * 800
    TN_A = 800 - FP_A = 800*(1-fpr)

    FP_B = fpr * 600
    TN_B = 600 - FP_B = 600*(1-fpr)

    Similarly,
    FN_A = fnr * 200
    TP_A = 200 - FN_A = 200*(1-fnr)

    FN_B = fnr * 400
    TP_B = 400 - FN_B = 400*(1-fnr)

  Now, let's look at the high-risk group calibration:

    For Group A: 
        Total high-risk = TP_A + FP_A = 200*(1-fnr) + 800*fpr
        Reoffense rate in high-risk group A: TP_A / (TP_A+FP_A) = [200*(1-fnr)] / [200*(1-fnr) + 800*fpr]

    For Group B:
        Total high-risk = TP_B + FP_B = 400*(1-fnr) + 600*fpr
        Reoffense rate in high-risk group B: [400*(1-fnr)] / [400*(1-fnr) + 600*fpr]

  We require these two rates to be equal:

    [200*(1-fnr)] / [200*(1-fnr) + 800*fpr] = [400*(1-fnr)] / [400*(1-fnr) + 600*fpr]

  Simplify:

    Left: 200(1-fnr) / [200(1-fnr) + 800 fpr] = (1-fnr) / [ (1-fnr) + 4 fpr ]

    Right: 400(1-fnr) / [400(1-fnr) + 600 fpr] = 4(1-fnr) / [4(1-fnr) + 6 fpr] = 2(1-fnr) / [2(1-fnr) + 3 fpr]

  So we have:

    (1-fnr) / [1-fnr + 4 fpr] = 2(1-fnr) / [2(1-fnr) + 3 fpr]

  We can cancel (1-fnr) from both sides (assuming 1-fnr != 0, i.e., the tool is not useless for positives? But if fnr=1, then TP=0 and we have division by zero. So we assume fnr < 1):

    1 / [1-fnr + 4 fpr] = 2 / [2(1-fnr) + 3 fpr]

  Cross-multiply:

    2 * [1-fnr + 4 fpr] = 1 * [2(1-fnr) + 3 fpr]

    2 - 2 fnr + 8 fpr = 2 - 2 fnr + 3 fpr

    8 fpr = 3 fpr

    5 fpr = 0

    => fpr = 0

  So we must have fpr=0.

  Now, with fpr=0, then we have no false positives. Then:

    FP_A = 0, TN_A = 800
    FP_B = 0, TN_B = 600

  Now, let's look at the calibration condition for the low-risk group.

  For Group A, low-risk group consists of TN_A and FN_A:
    Total low-risk = TN_A + FN_A = 800 + fnr * 200
    Reoffense rate in low-risk group: FN_A / (TN_A + FN_A) = (fnr * 200) / (800 + fnr * 200)

  For Group B, low-risk group:
    Total low-risk = TN_B + FN_B = 600 + fnr * 400
    Reoffense rate: (fnr * 400) / (600 + fnr * 400)

  We require:

    200 fnr / (800 + 200 fnr) = 400 fnr / (600 + 400 fnr)

  Simplify:

    200 fnr / (800 + 200 fnr) = fnr / (4 + fnr)   [divide numerator and denominator by 200]
    400 fnr / (600 + 400 fnr) = fnr / (1.5 + fnr)   [divide numerator and denominator by 400? Actually, 600/400=1.5, so: 400 fnr / (600+400 fnr) = fnr / (1.5 + fnr)]

  So:

    fnr / (4 + fnr) = fnr / (1.5 + fnr)

  This equation holds if:
    Case 1: fnr = 0, then both sides are 0.
    Case 2: or if 4 + fnr = 1.5 + fnr, which implies 4=1.5 -> impossible.

  Therefore, the only solution is fnr=0.

  So we have fpr=0 and fnr=0. That means the tool is perfect.

  But if the tool is perfect, then the base rates must be the same? Let's see:

    In Group A, base rate = 20% -> with perfect tool, we have 200 reoffenders and 800 non-reoffenders, and the tool classifies all correctly.

    In Group B, base rate = 40% -> 400 reoffenders and 600 non-reoffenders, and the tool classifies all correctly.

  But note: the base rates are different (20% vs 40%), yet the tool is perfect. This is possible? Yes, the tool can be perfect even with different base rates. However, the problem we are facing is that the only way to have both calibration and equal error rates (with the error rates being zero) is to have a perfect tool. But if the tool is perfect, then the calibration condition is trivially satisfied (in the high-risk group, the reoffense rate is 100% for both groups; in the low-risk group, 0% for both). Also, the error rates are zero (equal).

  However, in reality, the tool is not perfect. And when the tool is not perfect, we cannot have both calibration and equal error rates when the base rates are different.

  Therefore, we have shown that if the base rates are different and the tool is not perfect, then it is impossible to have both calibration (by group) and equal false positive/negative rates.

  But note: the above algebraic argument forced fpr=0 and then fnr=0. So the only solution is a perfect tool. Hence, for an imperfect tool, the conditions cannot hold.

  Let me try a concrete example without assuming equal error rates, but just to see the numbers.

  Example 1: Let the base rates be 20% and 40%. Suppose we try to set the same false positive rate and false negative rate arbitrarily.

  But we saw that the calibration condition forced fpr=0 and fnr=0. So let me try without the equal error rates condition and just see if we can have calibration? Actually, we are trying to have both.

  Alternatively, let me try to set the same false positive rate and false negative rate arbitrarily (but not necessarily zero) and see if calibration holds.

  Suppose we set fpr = 0.1 (10%) for both groups and fnr = 0.1 (10%) for both groups.

  Then for Group A:
    FP_A = 0.1 * 800 = 80
    TN_A = 720
    FN_A = 0.1 * 200 = 20
    TP_A = 180

    High-risk group in A: TP_A + FP_A = 180+80 = 260
    Reoffense rate in high-risk: 180/260 ≈ 69.23%

  For Group B:
    FP_B = 0.1 * 600 = 60
    TN_B = 540
    FN_B = 0.1 * 400 = 40
    TP_B = 360

    High-risk group in B: 360+60 = 420
    Reoffense rate: 360/420 ≈ 85.71%

  These are not equal: 69.23% vs 85.71%. So calibration fails.

  Now, what if we try to set the false positive rates and false negative rates differently? But the condition we are testing is equal error rates. We are requiring FPR and FNR to be equal.

  So the point is: if we force equal FPR and FNR, then we cannot have calibration (unless the tool is perfect).

  Therefore, the conflict is inherent.

  To further see the effect of base rates, let's try to adjust the base rates to be closer.

  Example 2: Let base rate in A be 30% and in B be 40%.

  Group A: 1000 defendants, 300 reoffenders, 700 non-reoffenders.
  Group B: 1000 defendants, 400 reoffenders, 600 non-reoffenders.

  Set fpr=0.1, fnr=0.1 for both.

  Group A:
    FP_A = 0.1 * 700 = 70
    TP_A = 300 * 0.9 = 270
    High-risk group: 270+70=340, reoffense rate = 270/340 ≈ 79.41%

  Group B:
    FP_B = 0.1 * 600 = 60
    TP_B = 400 * 0.9 = 360
    High-risk group: 360+60=420, reoffense rate = 360/420 ≈ 85.71%

  Still not equal.

  Now, if the base rates were the same, say 30% in both:

  Group A: 300 reoffenders, 700 non-reoffenders.
  Group B: 300 reoffenders, 700 non-reoffenders.

  Then:
    Group A: FP_A=70, TP_A=270 -> high-risk: 340, rate=270/340≈79.41%
    Group B: same -> 79.41%

  So then calibration holds.

  Thus, we see that when base rates are the same, we can have both calibration and equal error rates. When they are not, we cannot.

  In summary, the mathematical reason is that the calibration condition (same positive predictive value per risk category) and the equal error rate condition (same FPR and FNR) impose constraints that, when combined with different base rates, lead to a contradiction unless the tool is perfect (or the base rates are the same).

  The intuition is that if one group has a higher base rate of reoffending, then even if the tool has the same error rates, the higher base rate group will have more true positives and therefore the positive predictive value (the proportion of high-risk individuals who actually reoffend) will be higher for that group. But calibration requires that the positive predictive value be the same for both groups. Therefore, to achieve calibration, the tool must adjust the error rates differently between the groups, which then violates the condition of equal error rates.

  Thus, the two fairness criteria (calibration and equal error rates) are in conflict when base rates differ.
answer: |-
  To understand why calibration and equal error rates can't coexist when base rates differ, let's walk through a concrete example. We'll use two groups—Group A and Group B—with different base rates of reoffending. We'll assume a simplified risk tool that outputs only "high-risk" or "low-risk" and observe how false-positive rates (FPR) must diverge to maintain calibration. For clarity:

  - **Base rate**: The true reoffense rate in a group.  
  - **Calibration**: For any given risk score, the actual reoffense rate is identical across groups.  
  - **False-positive rate (FPR)**: Proportion of non-reoffenders incorrectly flagged as high-risk.  
  - **False-negative rate (FNR)**: Proportion of reoffenders incorrectly labeled low-risk.  

  ### Setup: Groups with Different Base Rates
  - **Group A**: 1,000 defendants.  
    - Base rate: 20% reoffend → **200 reoffenders**, **800 non-reoffenders**.  
  - **Group B**: 1,000 defendants.  
    - Base rate: 40% reoffend → **400 reoffenders**, **600 non-reoffenders**.  

  Suppose our risk tool is **well-calibrated**. Among defendants labeled high-risk:  
  - The actual reoffense rate must be identical for Group A and Group B.  
  - We'll set this rate to **50%** (arbitrary; the logic holds for any rate).  

  ### Step 1: Enforce Calibration
  Assume 500 defendants in each group are labeled **high-risk** (for simplicity, but adjustability is key).  

  **For Group A (20% base rate):**  
  - High-risk pool: 500 defendants.  
  - Calibration demands 50% reoffense rate → **250 must be true reoffenders**.  
  - But Group A only has **200 total reoffenders**.  
    - → All 200 reoffenders are labeled high-risk (0 false negatives).  
    - → The remaining 300 high-risk labels must be **false positives** (non-reoffenders).  
  - **FPR for Group A**: False positives / Total non-reoffenders = 300 / 800 = **37.5%**.  

  **For Group B (40% base rate):**  
  - High-risk pool: 500 defendants.  
  - Calibration demands 50% reoffense rate → **250 must be true reoffenders**.  
  - Group B has **400 total reoffenders**.  
    - → Only 250 reoffenders are labeled high-risk → **150 reoffenders are missed** (false negatives).  
    - → The remaining 250 high-risk labels are **false positives** (non-reoffenders).  
  - **FPR for Group B**: False positives / Total non-reoffenders = 250 / 600 ≈ **41.7%**.  

  #### Result Under Calibration:
  | Metric               | Group A (20% base rate) | Group B (40% base rate) |  
  |----------------------|-------------------------|-------------------------|  
  | **FPR**              | 37.5%                   | 41.7%                   |  
  | **FNR**              | 0% (0 false negatives)  | 37.5% (150/400)         |  

  **Key observation**:  
  - FPR is **higher for Group B** (41.7% vs. 37.5%) despite calibration.  
  - FNR is **higher for Group B** (37.5% vs. 0%).  

  ---

  ### Step 2: Why Equal Error Rates Are Impossible
  Now, suppose we try to **equalize FPR** across groups while maintaining calibration. Set FPR = 40% for both:  
  - **Group A FPR**: 40% of 800 non-reoffenders = **320 false positives**.  
  - **Group B FPR**: 40% of 600 non-reoffenders = **240 false positives**.  

  **Recalculate calibration for Group A (20% base rate):**  
  - Total high-risk = True positives + False positives.  
  - True positives = Total reoffenders - False negatives.  
    - We don't know FNR yet, so denote it as \( \text{FNR}_A \).  
    - True positives = \( 200 \times (1 - \text{FNR}_A) \).  
  - High-risk pool = \( 200(1 - \text{FNR}_A) + 320 \).  
  - Calibration requires:  
  \[
  \frac{\text{True positives}}{\text{High-risk pool}} = \frac{200(1 - \text{FNR}_A)}{200(1 - \text{FNR}_A) + 320} = 50\%.
  \]  
  - Solving:  
    \[
    200(1 - \text{FNR}_A) = 0.5 \times [200(1 - \text{FNR}_A) + 320]
    \]  
    \[
    200 - 200\text{FNR}_A = 100 - 100\text{FNR}_A + 160
    \]  
    \[
    100\text{FNR}_A = 60 \quad \Rightarrow \quad \text{FNR}_A = 60\%.
    \]  

  **Now for Group B (40% base rate):**  
  - True positives = \( 400 \times (1 - \text{FNR}_B) \).  
  - High-risk pool = \( 400(1 - \text{FNR}_B) + 240 \).  
  - Calibration requires:  
  \[
  \frac{400(1 - \text{FNR}_B)}{400(1 - \text{FNR}_B) + 240} = 50\%.
  \]  
  - Solving:  
    \[
    400(1 - \text{FNR}_B) = 0.5 \times [400(1 - \text{FNR}_B) + 240]
    \]  
    \[
    400 - 400\text{FNR}_B = 200 - 200\text{FNR}_B + 120
    \]  
    \[
    200\text{FNR}_B = 80 \quad \Rightarrow \quad \text{FNR}_B = 40\%.
    \]  

  #### Result When FPR is Equalized:  
  | Metric         | Group A (20% base rate) | Group B (40% base rate) |  
  |----------------|-------------------------|-------------------------|  
  | **FPR**        | 40%                     | 40%                     |  
  | **FNR**        | 60%                     | 40%                     |  

  **Key observation**:  
  - FPR is equal, but **FNR diverges** (60% vs. 40%).  
  - Calibration holds, but **error rates are not equal** (FNR is higher for Group A).  

  ---

  ### Why This Happens: The Core Impossibility
  1. **Calibration fixes reoffense rates**:  
     If high-risk labels must have the same reoffense rate (e.g., 50%) for both groups, but Group B has a higher base rate, it has **more true reoffenders**. To "dilute" the high-risk pool down to 50% reoffense, Group B needs **more false positives** (non-reoffenders) relative to its non-reoffender population.  
     - This forces FPR to be **higher for Group B** (as in Step 1).  

  2. **Equal FPR requires unequal FNR**:  
     If we force FPR to be equal (Step 2), Group A (lower base rate) ends up with **too few true reoffenders** in its high-risk pool. To maintain 50% reoffense, it must **misclassify more reoffenders as low-risk** (increasing FNR). Group B, with more reoffenders, doesn't need to "hide" as many.  

  3. **The base rate gap drives the wedge**:  
     The divergence in FPR or FNR is proportional to the difference in base rates. If base rates were equal (e.g., 20% for both), calibration and equal error rates *could* coexist. If the tool were perfect (0 errors), they could too—but imperfect tools with unequal base rates force a trade-off.  

  ---

  ### Intuitive Takeaway
  Imagine two buckets of water:  
  - Group A: 20% blue dye (reoffenders), 80% water (non-reoffenders).  
  - Group B: 40% blue dye, 60% water.  

  **Calibration** requires that any "high-risk" scoop from either bucket has the **same dye concentration** (e.g., 50%). To achieve this:  
  - For Group A (dilute dye), you need a scoop with **extra water** (higher false positives).  
  - For Group B (concentrated dye), you need a scoop with **less water** (fewer false positives).  

  **Equal error rates** would require the same "scoop recipe" (e.g., 40% water) for both buckets. But:  
  - In Group A, this recipe leaves too much dye behind (high false negatives).  
  - In Group B, it captures too much dye (low false negatives).  

  The **mathematical tension** arises because calibration ties the "recipe" to the dye concentration, while equal error rates demand identical recipes. When concentrations (base rates) differ, you can't have both.  

  This is the unavoidable trade-off ProPublica and Northpointe stumbled into—one rooted in arithmetic, not ideology.
