prompt: |-
  I got into Polymarket earlier this year (started as a joke with my roommate during all the election stuff, now its kind of a problem lol), and lately I've been trying to take it more seriously — actually reading about odds and edges instead of just vibes-betting on everything. Something happened a couple weeks ago that's been stuck in my head ever since, and nobody I've asked has given me an answer that actually satisfies me.

  I found a market, on some sports outcome, that I was pretty sure was mispriced based on totally public info — stats, injury news, nothing insider. I started buying shares, and almost immediately there was one specific account on the other side taking my trades, every single time, like clockwork. I got curious and clicked into their profile, and their track record is genuinely really good, clearly not some random person button-mashing. At first I was thrilled, felt like free money. But then it started bugging me: if someone who's demonstrably good at this keeps happily selling to me at these exact prices, shouldn't that itself tell me I'm the one who's wrong, even though I can't point to any specific thing they know that I don't? And if I take that logic all the way, it seems like neither of us should ever want to trade with the other once we both know the other person is paying attention and isn't an idiot — which can't be right, because obviously trading happens constantly and markets clearly function fine.

  I brought this up with my roommate, who's doing an econ PhD, and all he said was "well, somebody's always got to be on the other side of a trade, that's just how markets work," then went back to his ramen — which, ok, but that doesn't explain why it should be fine for that somebody to be me specifically. Is there something genuinely irrational going on when you knowingly bet against someone you have real reason to think is at least as sharp and informed as you, or is my reasoning breaking down somewhere here? Feels like there should be an actual answer to this and not just a shrug.
