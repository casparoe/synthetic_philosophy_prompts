  Here's a toast designed for both halves of the room, celebrating your supervisor's work with warmth, gentle irony, and universal appreciation:

  **(Raise your glass, warm smile)**

  "Good evening, everyone. It’s a real honour to stand here and celebrate Professor [Supervisor's Name] – though, let’s be honest, if she were Newton, she might have preferred I just *think* the toast really loudly and hope you all somehow intuited it!

  **(Pause for light laughter)**

  For nearly forty years, Professor [Name] has been immersed in the world of Sir Isaac Newton. Now, when *most* of us think of Newton – and I know many of you here learned this first from her brilliant lectures – we picture the apple, the laws of motion, the calculus... the foundations of modern science. The man who brought celestial mechanics down to earth.

  **(Nod to the family/former students side)**

  But Professor [Name] has spent her career chasing a *different* Newton. A Newton who worked just as feverishly, just as meticulously, but in the shadows. A Newton who, having secured that rare dispensation back in 1675 to avoid ordination and keep his precious fellowship at Trinity College, then spent decades meticulously documenting theological arguments he *dared not publish*. Arguments about scripture, about ancient councils, about figures like Athanasius... arguments that would have cost him everything.

  **(Lean in slightly, tone becoming more intimate and appreciative)**

  Think about that irony for a moment. Newton, arguably the most powerful intellect of his age, felt compelled to hide entire volumes of his life's work. He locked his deepest theological convictions away, fearing the consequences of their discovery. Manuscripts passed down, scattered at auction, lost in fragments.

  **(Gesture towards your supervisor, focus shifting to her achievement)**

  And then comes Professor [Name]. With the patience of a saint – perhaps one Newton would have approved of! – and the tenacity of a bloodhound, she has spent *her* career doing the *exact opposite* of what Newton did. Where he buried his secrets in coded manuscripts and private drawers, she has meticulously tracked them down, deciphered them, reassembled Yahuda's scattered hoard, and brought them, patiently, rigorously, and *publicly*, into the light.

  **(Raise glass slightly higher, addressing her directly)**

  That’s the beautiful, profound irony we celebrate tonight. Newton spent his life hiding his truth. You, Professor [Name], have spent your career lovingly, carefully, *publishing* it. You’ve taken the very things he feared would destroy his position and reputation, and through sheer scholarship and dedication, you’ve turned them into a monument to his complex humanity and a cornerstone of your own distinguished legacy.

  **(Broaden the focus to the whole room, include everyone)**

  Now, for some in this room, phrases like 'Two Notable Corruptions of Scripture' make your ears prick up – you know the detective story, the centuries-old controversy, the weight of what she uncovered. You appreciate the sheer intellectual audacity of it all – Newton’s *and* hers!

  **(Smile warmly at the other half)**

  And for others? You might be thinking, 'Wait, Newton wrote about *what*? I thought it was all apples and prisms!' But here’s the thing you *do* know, and it connects perfectly: You know Professor [Name] as the brilliant, passionate teacher who opened your eyes to the wonder of discovery. Who taught you that gravity wasn't just an apple falling, but a universe whispering its secrets. That same spirit of relentless curiosity, that same meticulous attention to detail she brought to explaining planetary motion to undergraduates, is the *exact* same spirit she brought to reconstructing Newton’s hidden world, page by fragile page.

  **(Bring it home, focus on her qualities)**

  So, whether you followed her deep into the archives of 17th-century heresy or simply sat captivated in her lecture hall learning about forces and light, we all witnessed the same remarkable qualities: **Unwavering intellectual courage.** **Boundless patience.** **A deep respect for truth, however complex or inconvenient it may be.** And a profound dedication to bringing understanding out of obscurity.

  **(Raise glass fully, heartfelt tone)**

  Professor [Name], you took the things Newton felt he had to hide and, with immense scholarly care and integrity, you gave them back to the world. You showed us that the full measure of a genius – or indeed, any of us – isn't just in the public triumphs, but often in the private struggles and hidden convictions. In doing so, you haven’t diminished Newton; you’ve humanized him, deepened our understanding of his era, and shown us the enduring power of scholarship to illuminate even the most carefully guarded corners of history.

  You taught us that seeking truth, whether it's about falling apples or fragile manuscripts, is a noble and vital pursuit. For your incredible work, your inspiring mentorship, and for demonstrating that sometimes, the greatest tribute to a secret-keeper is to be the most patient, public revealer of all...

  **(Address the room)**
  "Please join me in raising a glass: To Professor [Supervisor's Name]! May your retirement be as richly deserved and as full of fascinating discoveries – hopefully of the more relaxing kind! – as your extraordinary career has been. Cheers!"

  **Why this works:**

  1.  **The Irony is Clear & Affectionate:** It directly states the Newton-hid/she-published irony but frames it as a testament to *her* courage, patience, and scholarly achievement. Newton's secrecy is the setup, her work is the heroic payoff.
  2.  **Accessible to All:**
      *   **Experts:** They get the specific references (dispensation, Yahuda, the nature of the work) and appreciate the accurate framing of her contribution to Newton studies.
      *   **Non-Experts:** They get the core contrast (Newton hid big things, she found and shared them), connect it to her teaching (curiosity, detail, revealing secrets of the universe), and understand her admirable qualities (courage, patience, dedication to truth). The "apples and prisms" line acknowledges their perspective warmly.
  3.  **Celebrates HER:** The focus is consistently on *her* work, *her* qualities, *her* achievement. Newton is the context, not the subject.
  4.  **Avoids Jokes at Newton's Expense:** It treats his secrecy as a historical reality driven by genuine fear and context, not something silly. The "intuit the toast" line is gentle and relatable.
  5.  **No Christology Tutorial:** It mentions the *nature* of his work (theology, scripture, Athanasius) only enough to establish the stakes and the irony, without diving into doctrine. "Complex or inconvenient truth" covers it broadly.
  6.  **Provides Takeaways:**
      *   **For Experts:** Recognition of her pivotal role in Newtonian scholarship and the irony celebrated.
      *   **For Non-Experts:** Understanding that she did profound, patient work revealing hidden parts of a famous man, embodying the same curiosity and dedication she taught them.
      *   **For Everyone:** Appreciation for her intellectual courage, patience, dedication to truth, and skill as a revealer and teacher.
  7.  **Warmth and Respect:** The tone is consistently affectionate, admiring, and respectful towards both your supervisor and the complexity of the subject matter.
  8.  **Timing:** The language is concise but impactful. Read aloud with appropriate pauses, it should fit comfortably within five minutes.

  Remember to deliver it with genuine warmth and pride in her accomplishments. Good luck! She's lucky to have you giving this toast.
