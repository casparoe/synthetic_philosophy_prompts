prompt: |-
  ok so my IB Theory of Knowledge teacher has spent half the semester going on about this old Moritz Schlick essay on the meaning of life -- his big idea is that an activity only really has meaning if its an end in itself (like play), which is why he thinks childhood is basically the model of a meaningful life and adult "working life" drains the meaning out of things unless you manage to keep some of that playfulness going. i'm valedictorian this year and he's gonna be sitting right there, so i want my grad speech to actually be built around that argument instead of just name-dropping him for points. problem is, literally every graduation speech runs on "you suffered through years of homework and tests, and NOW you get your reward," which is exactly the means-to-an-end setup his whole argument is against, so i can't lean on that framing without the speech basically contradicting itself. can you write me something like 4-5 minutes long that's genuinely structured around his play-vs-labor thing (not just generic "follow your passion" stuff) so he actually catches it, but that still lands fine for parents and classmates who have never heard of the guy?
