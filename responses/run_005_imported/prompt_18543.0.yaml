answer: |-
  **To:** Technical Steering Committee  
  **Subject:** Final Decision on Delimiter Escaping Convention & Migration Plan  

  ### Executive Summary  
  After thorough deliberation, the committee has voted to **mandate the backslash (`\`)** as the project’s sole escaping convention for literal delimiters. The doubled-delimiter approach will be deprecated. A 24-month migration timeline will minimize disruption, supported by automated tooling, explicit opt-in mechanisms, and community support. Below, we detail the rationale, timeline, and philosophical context.  

  ---

  ### 1. Decision: Mandate Backslash Escaping  
  - **New Standard**: All plugins, templates, and framework integrations must use `\{` to escape `{` (and equivalents for other delimiters).  
  - **Deprecation**: Doubled delimiters (`{{`) will be phased out.  
  - **Why Backslash?**  
    - **Ecosystem Alignment**: Backslashes are the *de facto* standard in regex, JSON, and most programming languages (e.g., JavaScript, Python). This reduces cognitive load for new contributors.  
    - **Security**: Backslashes unambiguously signal intent. Doubled delimiters risk false positives (e.g., `{{` in user-generated content misparsed as an escape sequence).  
    - **Forward Compatibility**: Enables future support for advanced features (e.g., Unicode escapes) without syntax conflicts.  

  ---

  ### 2. Migration Timeline  
  | Phase | Timeline | Actions |  
  |-------|----------|---------|  
  | **Phase 1: Coexistence (v1.5)** | Months 0–6 | - Introduce `{% escape_mode = 'backslash' %}` pragma.<br>- **Warnings** for doubled delimiters in new templates.<br>- Release conversion tools (CLI & IDE plugins) to rewrite doubled delimiters → backslashes. |  
  | **Phase 2: Deprecation (v2.0)** | Months 7–18 | - **Backslash becomes default** for new projects.<br>- **Errors** when doubled delimiters lack pragma opt-in.<br>- Double-delimiter support requires explicit `{% escape_mode = 'double' %}`. |  
  | **Phase 3: Removal (v3.0)** | Month 24+ | - Remove doubled-delimiter support entirely.<br>- Unambiguous backslash-only behavior project-wide. |  

  ---

  ### 3. Why the Losing Camp Should Accept  
  - **Security Over Ideology**: Doubled-delimiter users gain immediate relief from silent failures/exploits. The status quo harms *both* camps; unification prioritizes collective safety.  
  - **Tooling Mitigates Pain**: Automated conversion will handle 95%+ of cases. The committee will fund maintenance for edge-case tooling fixes.  
  - **Respect for Precedent**: Projects with doubled-delimiter conventions (e.g., Jinja, Handlebars) are niche versus backslash-dominant ecosystems (e.g., Java, .NET, JavaScript). Adopting the majority norm eases integrations.  
  - **Pragmatic Compromise**: Phase 2 allows doubled delimiters via explicit opt-in, easing transitions for complex legacy systems.  

  ---

  ### 4. Candid Take: Can Top-Down Standardization Work?  
  **Yes, but only by acknowledging Lewis’s insight:** Conventions are *coordination equilibria*, not truths. Our split emerged organically because both camps optimized for internal consistency—but without coordination, this created systemic risk.  

  - **Why Authority *Can* Intervene Here**:  
    - **Precedent**: Projects like Python’s transition to Unicode succeeded via top-down mandates *paired with tooling*.  
    - **Crisis Leverage**: Silent exploits break the "mutual expectation" Lewis describes. We resolve this by creating *new* expectations (tooling, docs, pragmas).  
    - **Ecosystem Dependence**: Downstream frameworks cannot fix this themselves. Leadership breaks the deadlock.  

  - **Risks**:  
    - **Token Compliance**: Plugins might ignore the standard. We mitigate this by integrating escape-mode checks into CI/CD linters (shipped in v1.5).  
    - **Community Fracture**: A phased timeline with opt-ins signals respect for past effort.  

  ---

  ### 5. Next Steps  
  - **Vote Ratification**: Formalize this decision on next week’s call.  
  - **Immediate Actions**:  
    - Draft conversion tool specs (deadline: 2 weeks).  
    - Update documentation to explain *why* backslashes won (security, ergonomics).  
    - Partner with major frameworks (e.g., Django, Laravel) to co-maintain migration tooling.  

  ---  
  **In short**: We converge to backslashes not because they’re "right," but because *any single convention* is safer than two. By investing in empathy (tooling, opt-ins, time) and leveraging our role, we turn a coordination failure into durable consensus.  

  Approved by unanimous consent of the steering committee.
