prompt: |-
  I sit on the technical steering committee for an open-source templating engine that a lot of backend frameworks depend on. Over three years, plugin authors have split into two roughly equal camps with incompatible, internally consistent conventions for escaping a literal delimiter inside a template — one camp uses a backslash, the other doubles the delimiter — and mixing them silently produces broken or exploitable output whenever a plugin guesses wrong. The committee is deadlocked between mandating one convention project-wide, blessing both indefinitely, or introducing a third scheme nobody currently uses. I once read that the philosopher David Lewis argued conventions are just self-perpetuating solutions to coordination problems, sustained by precedent and mutual expectation rather than by anyone's authority — which leaves me unsure whether a committee vote can "declare" a convention at all, or whether that's simply the wrong tool for what's going on here. Please draft the committee's decision memo, due before next week's steering call: a concrete recommendation with a migration timeline, reasons the losing camp could actually accept, and a candid take on whether top-down standardization can work given how these two conventions actually took hold.
reasoning: |-
  We are in a situation where two conventions for escaping a delimiter in a templating engine are in use, and they are incompatible. The two methods are:
    1. Using a backslash (e.g., `\{` to escape a curly brace).
    2. Doubling the delimiter (e.g., `{{` to represent a single `{`).

  The problem is that if a plugin uses one convention and the template uses the other, the output can be broken or even exploitable (e.g., if unescaped delimiters lead to injection attacks).

  The committee is considering:
    A. Mandating one convention project-wide.
    B. Blessing both indefinitely.
    C. Introducing a third scheme.

  We are also considering the philosophical point that conventions are self-perpetuating and based on mutual expectation, not authority.

  Given this, I propose that we choose option A (mandate one convention) and provide a migration path. However, we must be aware that forcing a convention top-down might be challenging because of the existing split and the nature of conventions.

  But note: the committee does have authority over the project, so we can set standards. The challenge is adoption by the plugin authors.

  Which convention to choose?
    - We should choose the one that is most widely adopted in the broader ecosystem or has technical advantages. However, the problem states that the camps are roughly equal. So we must base the decision on other factors.

  Factors to consider:
    - Backward compatibility: We cannot break existing templates.
    - Security: The current situation is insecure because of silent failures. We must fix this.
    - Ease of migration: We must provide a clear path.

  Proposal:

  We choose the backslash escaping method. Why?
    - It is a common pattern in many programming languages and templating systems (e.g., C, Python, JavaScript).
    - It allows for escaping arbitrary characters, which might be more flexible in the long run.

  But note: the doubled delimiter method is also common (e.g., in Mustache, which uses `{{` as a tag and `{{{` for unescaped output, but escaping a single brace might be done by doubling? Actually, in Mustache, you don't escape delimiters inside text; instead, you change the delimiters if needed. But doubled delimiters are used in some systems, like in T-SQL for escaping a single quote).

  However, the doubled delimiter method has the advantage of being more readable and not requiring an escape character that might itself need escaping.

  But given the split and the need for a single standard, we choose backslash because it is more universal for escaping.

  Alternative: We could allow both but require explicit declaration? That might be complex and error-prone.

  Given the security implications, we must have a single consistent rule.

  Migration plan:

  We will introduce a new version of the templating engine (say, v2.0) that by default uses the backslash escaping. However, we will provide a compatibility mode for the doubled delimiter convention for a transition period.

  Steps:

  1. Announce that starting in version 2.0, the official escaping mechanism will be the backslash. Plugins must use this convention when processing templates that are labeled for version 2.0 or higher.

  2. For existing templates (version 1.x), the engine will continue to support the old behavior. However, we will deprecate the doubled delimiter method.

  3. We will provide a tool to migrate templates from the doubled delimiter convention to the backslash convention.

  4. We will also allow template authors to explicitly set the escaping convention in the template (e.g., via a pragma or a setting) to avoid ambiguity. But note: the goal is to converge to one.

  5. Timeline:
     - v1.5 (next release): Add warnings when the doubled delimiter convention is used, and provide a migration tool. Also, allow setting the escaping method per template (with backslash as the default for new templates).
     - v2.0 (one year after v1.5): Remove support for the doubled delimiter convention by default. It will still be available via an explicit setting (for backward compatibility) but will generate a warning.
     - v3.0 (two years after v2.0): Remove the doubled delimiter convention entirely.

  Reasons for the losing camp (doubled delimiter users) to accept:

    - Security: The current situation is dangerous. Having one standard is more secure.
    - Consistency: The entire ecosystem will be more consistent, making it easier for everyone.
    - Migration path: We are providing a long transition period and tools to help.
    - Prevalence: The backslash method is more common in the wider world of programming, so it will be more familiar to new users.

  Candid take on top-down standardization:

    We acknowledge that conventions arise organically and are maintained by mutual expectation. However, in the context of an open-source project with a steering committee, we have the responsibility to set standards to ensure security and interoperability. The current deadlock and the existence of two conventions are causing real harm. Therefore, we must use our authority to break the deadlock and declare a standard. This top-down approach is necessary because the organic process has led to a split that is not resolving itself and is actively harmful. We hope that by providing a clear, well-communicated plan and supporting the community through the transition, we can successfully establish a new convention.

  Draft memo:

  ---

  **To:** Technical Steering Committee  
  **From:** [Your Name]  
  **Date:** [Current Date]  
  **Subject:** Decision on Escaping Convention and Migration Plan  

  ### Background
  The project has been operating with two incompatible conventions for escaping literal delimiters in templates: one using a backslash (e.g., `\{`) and the other by doubling the delimiter (e.g., `{{`). This split has led to situations where plugins and templates using different conventions produce broken or insecure output. After extensive discussion, the committee has reached a decision to ensure the security and consistency of the ecosystem.

  ### Decision
  The committee has voted to adopt the backslash escaping convention as the project's standard. This means that in any template, a literal delimiter (such as `{` or `}`) must be escaped by preceding it with a backslash (e.g., `\{`). The doubled delimiter convention will be deprecated and eventually removed.

  ### Rationale
  1. **Security and Reliability**: The current ambiguity between conventions creates a significant risk of output being silently corrupted or becoming vulnerable to injection attacks. A single, well-defined standard eliminates this risk.
  2. **Ecosystem Alignment**: The backslash escaping method is widely used in many programming languages and templating systems, making it more familiar to developers and consistent with broader practices.
  3. **Long-term Maintainability**: Having one standard simplifies the codebase, documentation, and plugin development, reducing cognitive load and potential errors.

  ### Migration Timeline
  To ensure a smooth transition, we will implement the following plan:

  1. **Version 1.5 (next release, [Date TBD])**:
     - Introduce a new default escaping behavior using backslashes for new templates.
     - Retain support for doubled delimiters but issue deprecation warnings when they are used.
     - Provide a migration tool to automatically convert existing templates using doubled delimiters to the backslash convention.
     - Allow template authors to explicitly set the escaping method (via a pragma or configuration) to either `backslash` or `double` (with `backslash` as the default).

  2. **Version 2.0 (target [Date: 1 year after 1.5])**:
     - Change the default behavior to only recognize the backslash escaping convention.
     - Templates that rely on doubled delimiters must explicitly set the escaping method to `double` (which will continue to work but generate a warning).
     - Remove the deprecation warnings from version 1.5 and replace them with a single warning when the `double` method is used, indicating it will be removed in 3.0.

  3. **Version 3.0 (target [Date: 2 years after 2.0])**:
     - Remove support for the doubled delimiter convention entirely. Templates that set the escaping method to `double` will cause an error.

  ### Addressing the Community
  We understand that this decision will require effort from the community, especially from the half that has been using doubled delimiters. However, we believe this move is necessary for the health of the project. The reasons to accept this decision include:
  - **Security First**: The status quo is inherently insecure and must be resolved for the safety of all users.
  - **Long Transition Period**: The timeline provides ample time (at least three years from now until the removal in 3.0) for migration.
  - **Tooling Support**: We commit resources to develop and maintain robust tooling for automatic conversion and to assist with any edge cases.

  ### A Candid Note on Top-Down Standardization
  We recognize that conventions are typically emergent and sustained by mutual expectation. However, when a coordination problem leads to a deadlock that cannot be resolved organically and poses significant risks, top-down intervention by a responsible body becomes necessary. Our role as a steering committee is to act in the best interest of the project's security and longevity. We believe that with clear communication, adequate tooling, and community engagement, we can successfully establish the new convention and leave the ecosystem stronger.

  ### Next Steps
  We will present this plan on the upcoming steering call for final approval. Upon approval, we will communicate this decision to the community via mailing lists, blog posts, and release notes. We will also start development on the migration tool and the version 1.5 changes.

