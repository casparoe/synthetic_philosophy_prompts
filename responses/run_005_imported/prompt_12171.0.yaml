  Hmm, the user's confusion makes sense. If you test things in isolation, but then say their combined value isn't additive, isn't that contradictory? Let me break it down. The isolation test is for individual bearers of value, like beauty itself. Moore would say that beauty has intrinsic value even unperceived. But when you combine elements, like affection and appreciation, their interaction creates emergent value that wouldn't exist if assessed separately. 

  The user might be missing that Moore distinguishes between simple intrinsic properties and complex wholes. The test applies to the former, but the latter operate under different rules. Also, the user seems particularly interested in why personal affection is valued more than solitary beauty. Moore's argument is that relationships add layers of value that isolated beauty lacks, due to the organic unity principle. 

