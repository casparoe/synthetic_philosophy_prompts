  ok so in my metaethics seminar we're going through Principia Ethica and I'm stuck on something. Moore does his isolation test thing to argue beauty has value even totally unperceived — like comparing a gorgeous world nobody will ever see to a world that's literally just a heap of filth nobody will ever see, and concluding it's better that the beautiful one exists. fine, i get that part. but then later in the same chapter he says the actual GREATEST goods are complex wholes, like personal affection combined with appreciating someone's good qualities, and that this is worth way more than the sum of its parts because of organic unities. isnt there something off about using "imagine it totally alone and see what its worth" as your whole method for finding intrinsic value, and then turning around and saying wholes aren't reducible to the sum of their isolated parts anyway? can you walk through how (or whether) moore actually keeps these two moves consistent, especially re: why personal affection is supposed to beat out just appreciating beauty solo?
