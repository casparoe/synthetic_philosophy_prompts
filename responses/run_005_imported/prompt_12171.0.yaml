answer: |-
  You've hit on a genuine and fascinating tension in Moore's *Principia Ethica* – arguably one of its most significant conceptual challenges. Let's break down how Moore *tries* to reconcile the Isolation Test and Organic Unities, why it feels inconsistent, and where the friction lies, especially regarding personal affection vs. solitary beauty:

  **Moore's Core Claims:**

  1.  **The Isolation Test (for Identifying Intrinsic Value):** To determine if something has intrinsic value (good-in-itself), we must imagine it existing *in complete isolation* and ask if its existence would be better than its non-existence. This isolates its value from any consequences or relations (like being perceived). He uses this to argue that beauty has intrinsic value even unperceived (beautiful world vs. heap of filth).
  2.  **Organic Unities (for Complex Goods):** The intrinsic value of a complex whole is *not* necessarily the simple sum of the intrinsic values of its parts considered in isolation. When parts combine in a certain way, the whole can have a value greater (or less) than the sum of its parts. Personal affection combined with the appreciation of true qualities is his prime example of a whole whose value far exceeds the sum of the value of affection alone plus the value of appreciation alone.

  **The Apparent Inconsistency:**

  You're absolutely right to question this. It *feels* like:
  *   **Step 1:** To find intrinsic value, isolate the thing completely.
  *   **Step 2:** But actually, the *real* intrinsic value emerges only in specific combinations that you *couldn't* test in isolation because the combination itself is the bearer of the emergent value. The test seems to undermine the significance of its own results when applied to the most important goods.

  **Moore's Attempted Reconciliation (and Why it Feels Strained):**

  Moore tries to resolve this by distinguishing between two uses of the Isolation Test:

  1.  **Identifying *Simple* Intrinsic Value Bearers:** The test is primarily designed to identify the *fundamental* bearers of intrinsic value – the simple, non-complex properties or states that are good-in-themselves *when they occur*, even alone. Beauty (as a property) is a candidate for this. The test asks: "Does *this specific thing* (e.g., the state 'beauty existing') have positive intrinsic value?"
  2.  **Assessing *Parts* within a Whole:** When analyzing a complex whole (an organic unity), the Isolation Test is used *on the individual parts* to determine *their* intrinsic value contribution *as isolated elements*. However, Moore insists this tells us *nothing* about the value of the *whole* when those parts are combined. The value of the whole is a *sui generis* fact revealed by applying the Isolation Test *to the whole complex state itself*.

  **How He Applies This to Personal Affection vs. Solitary Beauty:**

  1.  **Testing Solitary Beauty:** Apply the Isolation Test to "a beautiful object existing unperceived." Moore concludes this state *does* have positive intrinsic value. It *is* better that the beautiful world exists than the heap of filth.
  2.  **Testing Personal Affection Complex:** Apply the Isolation Test to the *whole complex state*: "A person experiencing deep affection for another *based on a true appreciation of that person's admirable qualities*."
      *   Moore argues that *this specific, complex state* has *enormous* positive intrinsic value when considered as a unified whole in isolation.
      *   Crucially, he *also* uses the Isolation Test on the *parts*:
          *   **Affection Alone (without appreciation of true qualities):** He argues this *might* have *some* positive value, but likely less, or could even be negative if based on false qualities (e.g., affection for someone *because* you falsely believe them to be kind when they are cruel).
          *   **Appreciation of Qualities Alone (without affection):** He argues this (e.g., coldly admiring someone's virtues) has *some* positive value, but significantly less.
      *   **The Organic Unity Claim:** The value of the whole complex "affection + appreciation" is *vastly* greater than the sum of the values of "affection alone" and "appreciation alone" as determined by their individual isolation tests. The combination creates a new, emergent value.

  **Why it Feels Inconsistent & Problematic:**

  1.  **The Test Undermines Its Foundational Use:** If the *most* valuable things are complex organic unities whose value *only* emerges in combination, then focusing the Isolation Test on *simple* states (like unperceived beauty) seems to miss the point. Why prioritize identifying the value of parts that are significantly less valuable (or whose value is contingent) compared to the irreducibly complex wholes?
  2.  **Methodological Conflict:** The Isolation Test, by its very nature, strips away context and relations. But Organic Unities *depend* on specific relations and contexts for their emergent value. Applying the test to the *whole* complex state tries to bypass this, but:
      *   It's conceptually harder to isolate a complex relational state like "A loving B based on true appreciation of B's qualities" than a simple state like "beauty existing."
      *   The test seems better suited to simple states, making its application to complex relational wholes feel forced and less intuitive.
  3.  **Why Personal Affection "Beats" Solitary Beauty:** Moore's argument here relies *heavily* on the Organic Unity principle *after* using the Isolation Test to establish baseline values:
      *   Solitary Beauty (unperceived) has *some* intrinsic value (established by Isolation Test).
      *   Personal Affection Complex has *enormous* intrinsic value (established by applying the Isolation Test to *that specific complex whole*).
      *   *Therefore*, the complex whole of personal affection is a *greater* good than unperceived beauty. The *reason* it's greater is the emergent value generated by the organic unity of affection and appreciation – a value that simply doesn't exist in the isolated parts or in unperceived beauty.
      *   **The Tension:** He uses the Isolation Test to establish both values, but the *explanation* for the difference in value (the organic unity) is something the Isolation Test, when applied *only* to the parts, explicitly *cannot* capture. The test identifies the value of the wholes, but the *reason* for one whole being vastly more valuable than another lies in a principle (organic unity) that the test's core application (to parts) renders opaque.

  **Conclusion: A Vulnerable Point in Moore's System**

  Moore *attempts* consistency by strictly limiting the Isolation Test's role:
  *   **For Simple States/Properties:** It directly identifies intrinsic value.
  *   **For Complex Wholes:** It identifies the value *of the whole state*, but tells us *nothing* about the value contributed by the parts within that whole (due to organic unity).
  *   **For Parts:** It *only* tells us the value those parts have *in isolation*, which may be irrelevant to their value within a whole.

  **However, the tension you identify is real and significant:**

  1.  The method (Isolation Test) seems intrinsically biased *against* the very thing Moore finds most valuable (complex relational wholes) because it strips away relations.
  2.  Using the same test for both simple states and complex wholes feels like using the same tool for fundamentally different tasks, masking the difference.
  3.  The explanation for *why* personal affection is better than solitary beauty relies on organic unity, a principle that the Isolation Test, in its foundational role (testing parts), actively obscures.

  **In essence:** Moore uses the Isolation Test to establish a baseline of simple intrinsic goods and the value of complex wholes *as wholes*. He then relies on the *separate* principle of Organic Unities to explain *why* certain complex wholes (like personal affection) are so much more valuable than either simple goods or other combinations. The friction arises because the Isolation Test, designed to isolate, struggles to illuminate the relational essence of the organic unities it's supposed to help evaluate. Many critics (like W.D. Ross) felt this tension exposed a weakness in Moore's methodology. Your intuition that something is "off" is well-founded – it highlights a core philosophical challenge in Moore's otherwise groundbreaking work.
