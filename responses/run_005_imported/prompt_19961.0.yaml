answer: |-
  Below, I'll construct a concrete example where a frequentist test yields a statistically significant p-value (p < 0.05), but a Bayesian analysis concludes that the null hypothesis is likely true. I'll explain the mechanics of why this happens and its relevance to the replication crisis.

  ---

  ### **Example Setup**
  **Research Question**: Does Drug X affect IQ?  
  **Null Hypothesis (H₀)**: Drug X has no effect (true mean IQ change = 0).  
  **Alternative Hypothesis (H₁)**: Drug X has some effect (true mean IQ change ≠ 0).  

  **Data**:
  - Sample size: `n = 10,000` participants.  
  - Known population standard deviation: `σ = 15` (IQ points).  
  - Observed sample mean: `x̄ = 0.15` IQ points (i.e., average increase).  

  ---

  ### **Frequentist Analysis (Z-test)**
  1. **Test Statistic**:  
     \[
     z = \frac{\bar{x} - 0}{\sigma / \sqrt{n}} = \frac{0.15}{15 / \sqrt{10,000}} = \frac{0.15}{0.15} = 1.96.
     \]
  2. **p-value**:  
     p = 0.05 (exactly, for a two-tailed test).  
     **Conclusion**: Reject H₀ at α = 0.05. Drug X is "statistically significant."

  ---

  ### **Bayesian Analysis**
  **Prior Specification**:
  - Prior probability that H₀ is true: `P(H₀) = 0.5`.  
  - Prior probability that H₁ is true: `P(H₁) = 0.5`.  
  - Under H₁, the effect size (δ) follows a **normal prior**: `δ ~ N(0, τ²)`, with `τ = 10`.  
    (This assumes effect sizes are typically small; 95% of effects are between -20 and +20 IQ points.)

  **Compute the Bayes Factor (BF₀₁)**:  
  The Bayes factor compares the evidence for H₀ vs. H₁:  
  \[
  \text{BF}_{01} = \frac{\text{Probability of data under } H_0}{\text{Average probability of data under } H_1}.
  \]

  Using the formula for normal priors and data:  
  \[
  \text{BF}_{01} = \sqrt{1 + \frac{n \tau^2}{\sigma^2}} \cdot \exp\left(-\frac{1}{2} \cdot \frac{z^2}{1 + \frac{\sigma^2}{n \tau^2}}\right).
  \]
  Plugging in:  
  - `z = 1.96`, `n = 10,000`, `σ = 15`, `τ = 10`:  
  \[
  \text{BF}_{01} = \sqrt{1 + \frac{10,000 \cdot 10^2}{15^2}} \cdot \exp\left(-\frac{1}{2} \cdot \frac{1.96^2}{1 + \frac{15^2}{10,000 \cdot 10^2}}\right) = \sqrt{1 + \frac{1,000,000}{225}} \cdot \exp\left(-\frac{1}{2} \cdot \frac{3.8416}{1 + 0.000225}\right).
  \]
  Simplifying:  
  \[
  \text{BF}_{01} \approx \sqrt{4444.44} \cdot \exp(-1.920) \approx 66.67 \cdot 0.147 \approx 9.8.
  \]

  **Posterior Probability of H₀**:  
  \[
  P(H_0 \mid \text{data}) = \frac{\text{BF}_{01} \cdot P(H_0)}{\text{BF}_{01} \cdot P(H_0) + P(H_1)} = \frac{9.8 \cdot 0.5}{9.8 \cdot 0.5 + 0.5} = \frac{4.9}{5.4} \approx 0.91.
  \]
  **Conclusion**: 91% posterior probability that H₀ is true. Drug X likely has no effect.

  ---

  ### **Why the Opposite Conclusions?**
  1. **What p-values measure**:  
     "Probability of observing data this extreme, **if H₀ is true**."  
     - Here, p = 0.05 means: *If* the drug has no effect, there’s a 5% chance of seeing a mean change ≥ 0.15 IQ points.  
     - It **does not** consider how likely the data is under H₁.

  2. **What Bayesian posterior probability measures**:  
     "Probability that H₀ is true, **given the observed data**."  
     - This depends on:
       - The data's compatibility with H₀ (like p-values),
       - The data's compatibility with H₁ (via the prior),
       - The prior plausibility of H₀ vs. H₁.
     - Here, the observed effect (`x̄ = 0.15`) is:
       - **Unlikely under H₀** (hence p = 0.05),
       - **Even more unlikely under H₁** because H₁ expects larger effects (prior `δ ~ N(0, 10²)`).  
         A tiny effect (0.15) is atypical under a prior centered on 0 with τ=10.

     The Bayes factor penalizes H₁ for its broad prior: if H₁ allows large effects but the data shows a tiny effect, H₁ is not well-supported.

  ---

  ### **Relevance to the Replication Crisis**
  1. **P-value misinterpretation**:  
     Many researchers treat p < 0.05 as "H₀ is false" or "H₁ is true." This example shows why that’s flawed:  
     - A small p-value **does not** imply H₁ is likely.  
     - With large samples, tiny/meaningless effects become "significant" (p < 0.05) but may still favor H₀ under a realistic prior.

  2. **Large samples exacerbate the issue**:  
     - In huge datasets (e.g., genomics, social media A/B tests), trivial effects (e.g., 0.15 IQ points) easily achieve p < 0.05.  
     - Frequentist methods declare these "significant," but Bayesian methods (with sensible priors) reveal they’re likely noise.

  3. **Prior specification matters**:  
     - The Bayesian result depends critically on the prior for H₁.  
     - If we used an **unrealistic prior** (e.g., τ = 0.01, expecting only minuscule effects), H₁ would be favored.  
     - The replication crisis arises partly from ignoring plausible effect sizes. Bayesian approaches force explicit priors, improving calibration.

  4. **False positives in practice**:  
     - Many published "discoveries" with p ≈ 0.05 are false positives.  
     - When replication studies are run, these effects vanish (as seen in psychology, medicine, etc.).  
     - Bayesian posteriors (e.g., P(H₀ | data) = 91%) align better with replication outcomes.

  ---

  ### **Key Takeaway**
  The divergence arises because:
  - **Frequentism** asks: "How extreme is the data, assuming H₀?"  
  - **Bayesianism** asks: "How likely is H₀ vs. H₁, given the data and prior knowledge?"  

  In large samples, frequentist tests detect trivial effects, while Bayesian methods (with sensible priors) downweight them. This explains why "significant" findings often fail to replicate—they’re artifacts of large n and misinterpreted p-values. Bayesian approaches, by contrast, incorporate real-world context, offering a more nuanced view of evidence.
