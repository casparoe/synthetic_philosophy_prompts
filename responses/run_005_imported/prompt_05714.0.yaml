  Also, consider if Nozick would bite the bullet. He might say species membership matters because the human has the potential or belongs to a kind. But that undermines his initial criterion of the capacity itself. The user needs to show that falling back to species is arbitrary. The case should force a choice: either include some animals in Kantian treatment or exclude some humans, both of which are problematic for Nozick.

