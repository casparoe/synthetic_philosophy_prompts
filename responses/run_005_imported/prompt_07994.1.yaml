answer: |-
  Here are eight focused interview questions with strategic follow-ups, designed to probe deep into Lewisian convention while respecting your guest's expertise and your own background:

  1.  **The Psychological Reality Question:** Lewis's common knowledge requirement demands an infinite hierarchy: "I expect you to conform, I expect you to expect me to conform," and so on. Given what cognitive science tells us about bounded rationality and the computational limits on higher-order beliefs in real human agents, isn't this requirement *psychologically unrealistic* for most everyday conventions? Doesn't this suggest common knowledge functions more as a *theoretical idealization* than a description of actual cognitive states?
      *   **Likely Answer/Follow-Up:** *(If she defends it as an idealization or emphasizes lower levels suffice):* "If we accept common knowledge as a useful idealization rather than a literal cognitive state, doesn't that significantly weaken its *explanatory power* for *how* conventions actually form and stabilize? If agents only need 2nd or 3rd-order beliefs in practice, why posit the infinite hierarchy? Does the Lewisian framework then risk becoming unfalsifiable?"

  2.  **The Gilbert Challenge (Normativity):** Margaret Gilbert argues that Lewis's reduction of convention to patterns of individual expectations and preferences fails to capture the *normative force* inherent in conventions – the sense that violating one is a *fault* meriting criticism, not just a coordination *mistake* potentially disappointing others. How does your defense of Lewis account for this palpable sense of *obligation* that often accompanies conventions, if it's supposedly just about interdependent expectations?
      *   **Likely Answer/Follow-Up:** *(If she suggests the "fault" feeling arises from the *disruption* caused or internalized expectations):* "But doesn't that explanation reduce the normative 'ought' back down to an instrumental 'is' about expectations and potential disappointment? Gilbert insists the obligation is *sui generis*, arising from a collective commitment. If Lewisians *must* appeal to emergent social norms or internalized sanctions to explain the 'fault' feeling, doesn't that concede Gilbert's core point – that pure interdependent expectations are insufficient, and something genuinely collective *is* involved?"

  3.  **The Skyrms Challenge (Dynamics without Common Knowledge):** Scholars like Brian Skyrms use evolutionary game theory and learning dynamics (replicator dynamics, reinforcement learning) to model how stable conventions can emerge spontaneously from repeated interactions in populations, *without* agents needing to form explicit common knowledge or even high-order beliefs. Doesn't the empirical success and explanatory parsimony of these dynamic models suggest that Lewis's common knowledge requirement might be *epiphenomenal* – a *consequence* of stable convention rather than its necessary cognitive *foundation*?
      *   **Likely Answer/Follow-Up:** *(If she argues dynamics *produce* the epistemic state Lewis describes, or that they model the *process* leading to it):* "So, are you saying the dynamic models *implement* or *result in* the common knowledge state described by Lewis? Or are you suggesting Lewis's framework provides the *correct static description* of the *end state*, while dynamics explain the *genesis*? If it's the latter, and dynamics can produce convention-like stability *without* the cognitive machinery of common knowledge *during* the process, does Lewis's framework risk being a *post-hoc rationalization* rather than capturing the essential causal mechanism?"

  4.  **The "Viable Alternative" & Problem Specification:** Lewis requires at least one viable alternative coordination equilibrium. Critics often point to seemingly arbitrary conventions (like QWERTY keyboards) where the *original* alternatives may have been viable, but path dependence and sunk costs now make switching practically impossible. Does this mean the "coordination problem" is fundamentally *mis-specified* in such cases? Is the *real* coordination problem now "coordinate on *this* standard despite its flaws," making the lack of a *current* viable alternative irrelevant? How do we rigorously define the "problem" to avoid this becoming a catch-all defense?
      *   **Follow-Up Focus:** This probes the flexibility/circularity risk inherent in defining the coordination problem.

  5.  **Convention vs. Norm (The Lewis-Gilbert Boundary):** Building on Gilbert's challenge, where do *you* draw the line between a Lewisian convention and a social norm? Is it primarily the presence of sanctions (Lewis), the nature of the preference structure (coordination vs. conflict/cooperation), or the type of normative attitude involved? Can a Lewisian convention *acquire* genuine normative force over time without ceasing to be a Lewisian convention?
      *   **Follow-Up Focus:** Explores the boundary work crucial to defending Lewis against normativity critiques.

  6. **The Role of Salience (Schelling Points):** Salience plays a crucial role in Lewis's account for solving novel coordination problems. How does salience interact with, or depend on, the common knowledge requirement? Can something be salient *without* being common knowledge? Conversely, can common knowledge *make* something salient? How does this play out in complex, decentralized systems where salience might be fragmented?
      *   **Follow-Up Focus:** Connects your background (Schelling points in distributed systems) to the core mechanism, probing the epistemology of salience.

  7.  **Convention in Non-idealized Populations:** Lewis's model assumes agents are (broadly) rational, recognize the coordination structure, and have similar perceptions of salience. How robust is the framework when applied to real populations with heterogeneous reasoning abilities, cultural differences affecting salience perception, incomplete information, or even some degree of antagonism? Does this heterogeneity fundamentally challenge the common knowledge requirement, or can it be modeled within the framework (e.g., as differing "theories of mind" levels)?
      *   **Follow-Up Focus:** Tests the framework's applicability to messy reality, a common criticism.

  8.  **The Evidential Burden (Closing Question):** The common knowledge requirement is famously demanding. Critics present apparent conventions (e.g., traffic flow patterns in new developments, emergent online slang) where the infinite regress of expectations seems implausible. Lewisians often respond by arguing the coordination problem was mis-specified or that common knowledge *did* tacitly form. What kind of empirical finding or theoretical argument *would* genuinely count as evidence *against* the *necessity* of common knowledge for convention? Put differently, how can this requirement be falsified, or is it definitional?
      *   **Follow-Up Implicit in the Question:** This directly challenges the potential unfalsifiability raised earlier and forces a concrete answer on evidentiary standards. The guest *must* grapple with the "mis-specification" defense you mentioned.

  **Key Strengths of this Approach:**

  *   **Beyond Definition:** Questions 1, 2, 3, 4, 5, 7, and 8 explicitly push beyond restating the definition into critiques and implications.
  *   **Your Core Requests:** Questions 1 (Psych Reality), 2 (Gilbert/Normativity), and 3 (Skyrms/Dynamics) are directly addressed with follow-ups anticipating defenses.
  *   **Follow-Ups as Scalpels:** Each follow-up is designed to cut deeper based on a plausible defense, preventing easy answers and pushing for nuance (e.g., idealization vs. explanation, obligation vs. disappointment, dynamics as cause vs. consequence).
  *   **Bridges Disciplines:** Questions 3 (Skyrms), 6 (Salience/Schelling), and 7 (Non-ideal populations) connect philosophical theory to modeling, dynamics, and real-world complexity relevant to your background.
  *   **Closing Challenge:** Question 8 directly tackles the core epistemological concern about the common knowledge requirement's testability, forcing the guest to define what could count as counter-evidence.

  These questions should foster a rich, critical, and productive discussion that illuminates both the strengths and the contested boundaries of the Lewisian framework. Good luck with the episode!
