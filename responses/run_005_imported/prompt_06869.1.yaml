answer: |-
  Here is a story dramatizing the conflict, clocking in at just under 1000 words:

  **The Zero Newt**

  Dr. Aris Thorne stared through the thick glass, the sterile lab air suddenly thick with disbelief. Inside the sealed terrarium, glistening under the growth lamps, sat *Necturus anomalus* Specimen Zero. Or, as the baffled techs called it, "Newt Zero."

  It was a perfect, adult mudpuppy salamander. Pinkish skin, feathery external gills waving gently, stubby limbs. Utterly ordinary. Except for one impossible fact: it hadn’t *come* from anywhere. Twelve hours ago, the newly installed, experimental "bio-sterile" pond in Lab 7 – filled with meticulously purified water and mineral substrates, rigorously screened for any biological contaminants – had been empty. Now, it held Newt Zero. Scans showed no breach, no insertion. It was, by every physical measure, a spontaneously generated duplicate of the common mudpuppies Aris studied down the hall.

  "Impossible," breathed Dr. Clara Vance, Aris's colleague and an evolutionary biologist. She pressed her palm against the cool glass. "It violates everything. No progenitors, no selection pressure, no *history*. It's a... a biological statue that breathes."

  "But it *does* breathe, Clara," countered Dr. Leo Finch, the lab's systems physiologist. He tapped a monitor displaying real-time vitals. "Look at that sinus rhythm. Steady. Gills perfusing, heart pumping, digestive enzymes active... it's processing nutrients we introduced. It *functions*."

  "That's just physics and chemistry unfolding," Clara argued, turning away from the tank, her face tight. "Like a clockwork bird singing. It *mimics* function. But without an evolutionary history, those processes aren't *for* anything. They lack the *why*."

  Aris felt the familiar intellectual vertigo return, the same that had plagued his EE drafting. He needed to understand Newt Zero. His supervisors had approved a limited, terminal examination. Now, prepped in the dissection suite, Newt Zero lay on the chilled table, anesthetized. Aris made the initial incision, Clara observing critically, Leo monitoring the fading vitals.

  As Aris carefully exposed the thoracic cavity, the textbook mudpuppy anatomy revealed itself: the powerful, three-chambered heart, the dark liver, the coiled intestines. And the lungs – small, sac-like structures, present but rudimentary in this primarily gill-breathing amphibian.

  "See?" Leo pointed with a gloved finger. "There they are. Structures. Now, observe the circulatory connections. Blood flows *to* them from the heart, gets oxygenated – or would, if it were breathing air – and flows back. It’s integrated. It *contributes* to the potential capacity for aerial respiration within the whole system. That’s its function, right now, in *this* system. What else would you call that process?"

  "It *would* contribute *if* it were used," Clara conceded, her voice tight. "But look at its gills! Superb, efficient. In its natural habitat – which *this*," she gestured dismissively at Zero, "never had – the lungs are largely vestigial, a historical holdover. In a *real* mudpuppy, their function, their *proper* function, is defined by the fact that ancestral amphibians *did* rely on lungs, and those lung-precursors were *selected for* that air-breathing capacity millions of years ago. That's the *etiology*. That's what makes it a function and not just an accident."

  Aris paused, scalpel hovering over the lung tissue. He looked at the small, pink sacs. They were identical to those in the mudpuppies bred in their tanks, whose ancestors stretched back through generations of natural selection.

  "But Clara," Aris found himself saying, voicing the confusion he needed to resolve, "this lung tissue *is* capable of gas exchange. The blood vessels are real. The structures are here. If I perfused them with oxygenated fluid right now, they *would* oxygenate the blood. Doesn't that capacity, that current causal role within its bodily system – even if unused – constitute *a* function? Doesn't it *do* something specific for the organism it's part of?"

  "It *can* do it," Clara insisted. "But 'function' isn't just about what something *can* do. A rock can hold down paper. Is that its function? No. Function implies design, purpose – and purpose comes from history, from selection. This..." she nodded at Newt Zero, "...has no history. Its lungs are just... random arrangements of matter that happen to look and act like lungs. They lack the teleology, the 'selected effect'."

  Leo scoffed gently. "So, Clara, if we hooked this newt up to an air supply, and its blood oxygen saturation increased solely due to these lung structures, you're telling me we *shouldn't* say its lungs are functioning? That seems perverse. It's demonstrably contributing to the system's oxygen-handling capacity *right now*. That's Cummins' point: function *is* the causal role in the containing system. The history is fascinating, but irrelevant to the current operational reality."

  "But *why* are the lungs there *at all*, Leo?" Clara pressed, her eyes intense. "In your account, they just *are*. Their 'function' is whatever causal role we arbitrarily decide to focus on – gas exchange today, maybe buoyancy control tomorrow? Without history, it's arbitrary. Wright and the etiologists give us an objective anchor: the function is *why* the trait was maintained by selection. This creature was never selected. Its traits have no 'why'. They just... *are*."

  Aris looked down at the exposed lungs of Newt Zero. He felt the pull of both answers, visceral and intellectual. Leo was right: the structures *were* integrated. They *were* doing something causally specific within the body laid out before him. Cutting the pulmonary artery *would* disrupt the circulatory system in a predictable, functionally significant way. The lungs *contributed* to a capacity, even if latent.

  But Clara's point echoed deeply. The lungs felt... rootless. In his other specimens, the lungs were there *because* ancestors breathed air. They had a story, a reason for their presence beyond mere physical law. Newt Zero's lungs were just an astounding coincidence. Calling them "functional" felt like granting purpose to a cloud that happened to look like a dragon. Was function something bestowed only by the relentless filter of time and survival?

  He traced the delicate bronchus with the tip of his probe. "So," he said, his voice low, more to himself than to his colleagues, "do they *have* a function? These lungs? Right here, right now?"

  Leo leaned in. "How can you look at this integrated system and say they don't? They have a clear causal role."

  Clara crossed her arms. "How can you look at this cosmic accident and say they *do*? They lack the history that makes function meaningful."

  Aris stared at the small, vulnerable organs. Both answers felt true, yet mutually exclusive. The dissection table had become the battleground for Wright and Cummins, and the perfectly formed, history-less lungs of Newt Zero lay at the center, demanding a verdict he couldn't yet give. The silence stretched, filled only by the hum of the lab vents and the profound, unanswered question hanging over the creature that never was.

  ---
  **Key Dramatization Points:**

  1.  **The Case:** Newt Zero is the "Swampman" – a perfect duplicate appearing spontaneously, lacking any evolutionary history.
  2.  **The Debate Trigger:** The discovery and subsequent dissection force the question of its organs' functions.
  3.  **Clara (Etiological):** Emphasizes history and selection. Newt Zero's traits are "mimics," "accidents," lacking the "why" or "selected effect." Function requires a history of being selected *for* something.
  4.  **Leo (Causal-Role):** Focuses on current capacities and integration. The lungs *do* something demonstrably specific (oxygenate blood) within the current system. Their causal contribution *is* their function, regardless of origin.
  5.  **Aris's Conflict:** Embodies the reader's/the EE writer's struggle. He *sees* and *understands* both arguments. He feels the pull of the lungs' current causal contribution (Leo) but also intuits the profound emptiness of them lacking any evolutionary purpose (Clara). His final question and unresolved state mirror the core philosophical tension.
  6.  **Specific Organ Focus:** Using the lungs (potentially vestigial in mudpuppies, but functional) sharpens the debate – they *could* serve a causal role, but *why* are they even present without history?
  7.  **"Out Loud" Decision:** The dissection scene forces Aris to explicitly ask the question, and Clara and Leo provide the competing verdicts based on their theoretical commitments.

  This story throws Aris (and the reader) directly into the conceptual clash without providing a resolution, highlighting why this disagreement is so fundamental and persistent in the philosophy of biology. Good luck with your Extended Essay!
