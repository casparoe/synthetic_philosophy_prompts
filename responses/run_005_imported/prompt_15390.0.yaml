prompt: |-
  In my formal epistemology seminar, we recently covered David Lewis's Principal Principle: roughly, the idea that a rational agent's credence in an outcome should equal the objective chance of that outcome. I think I've found a fairly direct counterexample. Suppose a fair coin is about to be tossed, so the objective chance that it lands heads is exactly one half. Now suppose a completely reliable oracle, stipulated for the sake of the example to be error-free, tells me with certainty that this particular coin will land heads on this particular toss. Surely, on hearing the oracle, I should have credence near 1 that it will land heads, not 0.5. But the objective chance of heads is still 0.5 right up until the coin actually lands, so the Principal Principle seems to say my credence should stay at 0.5 regardless of what the oracle tells me. Either I ignore the oracle and keep my credence pinned to the chance, which seems clearly irrational, or I update to near-certainty and thereby violate the principle.

  I raised this in our study group, and we split into two camps. One camp thinks this shows the Principal Principle simply cannot be right as a general norm of rational credence, since any testimony about a specific outcome will generate the same tension. The other camp suspects there must be some restriction on which evidence the principle actually governs, but nobody could say what that restriction is, or why it would be a principled feature of the theory rather than a patch introduced just to dodge examples like mine. Which camp has it right: does the oracle case genuinely refute the Principal Principle, and if it doesn't, what exactly is supposed to block it, and is that move well-motivated or just an ad hoc rescue?
reasoning: |-
  Okay, let me start by unpacking the user's problem. They presented a counterexample to Lewis's Principal Principle involving an oracle predicting a coin toss. The user's scenario sets up a conflict: the objective chance of heads is 0.5, but after the oracle's certain prediction, their credence should be near 1. This seems to violate the Principal Principle, which ties rational credence to objective chance.

  First, I need to recall the Principal Principle (PP) correctly. Lewis formulated it with a crucial qualification: conditional on current chances and no "inadmissible" evidence. The user's example hinges on whether the oracle's testimony counts as inadmissible evidence. If it does, PP allows credence to diverge from chance. 

  The user’s study group is split. One side thinks PP is refuted; the other suspects evidence restrictions but can't articulate them. My task is to explain why the oracle case doesn’t sink PP and clarify the inadmissibility concept. 

  I should emphasize that PP isn’t naive—it anticipates exceptions like this. The oracle’s testimony is future-directed information, which Lewis explicitly excludes. Chance governs uncertainty from nature’s randomness; prophecies bypass that. Without this distinction, PP would indeed be absurd. 

  But is "inadmissible" just an ad hoc fix? No—it’s central to Lewis’s framework. Chances are supposed to screen off past history; prophecies violate that by revealing outcomes directly. The restriction is principled: it preserves chance’s role as an expert while allowing rational updating with direct evidence. 

  The user might worry this makes PP unfalsifiable. But counterexamples remain possible—e.g., if someone claims chance facts themselves are inadmissible (Lewis argues they’re not). The real work is defining admissibility rigorously, which later refinements (like Hall’s) address. 

  Finally, the user’s frustration is understandable. This is a common pedagogical hurdle! I should validate their insight ("sharp counterexample") while showing how PP absorbs it. Their deeper need might be grasping why chance remains relevant even with prophecies—perhaps hinting at how chance constrains credence *before* such evidence arrives.
answer: |-
  Your counterexample is sharp and well-constructed, touching on a core tension in the Principal Principle (PP). **The oracle case does *not* refute the Principal Principle.** The "other camp" in your study group is correct in suspecting a restriction on evidence, and this restriction is **principled**, not ad hoc. Lewis himself explicitly addressed precisely this type of scenario.

  Here's the breakdown:

  1.  **The Principal Principle (Refined):** Lewis didn't propose the naive version you initially stated ("credence = chance"). The full principle is:
      `Cr(A | **Ch_t(A) = x** ∧ **E**) = x`
      ...*provided* that `E` is **admissible** evidence at time `t`.

      *   `Cr`: Your credence (subjective probability).
      *   `A`: The proposition in question (e.g., "coin lands heads").
      *   `Ch_t(A) = x`: The proposition that the objective chance of `A` at time `t` is `x`.
      *   `E`: Your total background evidence at time `t`.

      **The crucial caveat is admissibility.**

  2.  **What is Admissible Evidence?** Admissible evidence, roughly, is information that pertains *only* to the past and present (up to time `t`) and to the *general* laws or chances governing the world. It does **not** contain specific information about the future outcome of `A` itself.

      *   **Admissible:** Historical facts, current states of affairs, the laws of physics, statistical laws, *the chance fact itself* (`Ch_t(A) = x`).
      *   **Inadmissible:** Direct information about the specific future outcome of `A`, like prophecies, oracles, time-traveler reports, or seeing the actual outcome.

  3.  **Applying it to the Oracle:**
      *   *Before the oracle:* Your evidence `E` is admissible (e.g., "the coin is fair", "it will be tossed normally"). PP dictates `Cr(Heads | Ch_t(Heads)=0.5 ∧ E) = 0.5`.
      *   *After the oracle:* Your evidence `E'` now includes the oracle's prophecy: "This specific coin will land heads on this specific toss." **This evidence is inadmissible.** It directly reveals the future outcome `A` (Heads).
      *   **PP does *not* constrain your credence conditional on inadmissible evidence.** Therefore, PP says *nothing* about what `Cr(Heads | Ch_t(Heads)=0.5 ∧ E')` should be. It is perfectly rational, and **does not violate PP**, for you to set `Cr(Heads | Ch_t(Heads)=0.5 ∧ E') ≈ 1`. The chance `Ch_t(Heads)=0.5` is still part of your evidence, but the inadmissible oracle testimony completely overrides its direct relevance for *this specific prediction*.

  4.  **Why the Chance is Still 0.5:** You are correct that the objective chance remains 0.5 right up until the toss. This reflects the *physical propensity* or *stochastic tendency* of the coin-tossing setup considered in isolation. The oracle doesn't change the coin's physical fairness; it provides *epistemic access* to the outcome that the chance process will produce. PP tells you how to set credence based on *only* the physical tendency (chance) plus admissible background. It doesn't forbid you from using other, more direct, sources of information about the outcome when you have them.

  5.  **Why is Admissibility Principled?**
      *   **The Role of Chance:** Lewis conceived of objective chance as the "ultimate expert" on outcomes involving indeterminism. You should defer to it *when you know nothing more specific*. Admissibility defines the precise circumstances under which this expert is the *best* guide. If you have a *more direct* line to the truth (like the oracle), you *should* follow that instead. PP captures deference to the *stochastic* expert, not to ignorance in the face of better information.
      *   **Screening Off:** Admissible evidence is meant to be the kind of evidence that the chance *screens off* `A` from. That is, once you know `Ch_t(A)=x`, knowing further admissible evidence `E` shouldn't change your credence in `A`. Inadmissible evidence, by definition, is *not* screened off by the chance – it provides information *over and above* what the chance value tells you about `A`.
      *   **Preserving the Connection to Frequency:** PP, via admissibility, ensures that in the long run, if you follow it, your credences calibrated to chances will align with frequencies *in situations governed by those chances*. The oracle case is a single, exceptional instance where you have privileged information breaking that direct link for that specific prediction. PP governs the *default* epistemic stance towards chancy events.
      *   **Not Ad Hoc:** Lewis introduced the admissibility clause *specifically* to handle cases like crystal balls, prophecies, and time machines. It's a core, defining feature of the principle, not a later patch. It flows directly from the intended role of chance as a guide for uncertain agents lacking specific future knowledge.

  **Conclusion:**

  *   **Your Camp is Wrong:** The oracle case does not refute the Principal Principle. PP correctly predicts credence 0.5 *before* the oracle (with admissible evidence).
  *   **The Other Camp is Right:** There is a principled restriction – admissibility. The oracle's testimony is paradigm-case inadmissible evidence.
  *   **PP is Not Violated:** After the oracle, PP *does not prescribe* credence 0.5. It is silent, allowing (indeed, requiring) rational credence near 1 based on the inadmissible evidence.
  *   **Chance Remains:** The objective chance of heads remains 0.5, reflecting the coin's physical symmetry. Your high credence reflects your *knowledge* of what that chancy process *will* produce in this instance.

  **The key takeaway:** The Principal Principle governs how rational credence should align with known objective chances *in the absence of specific "inside information" about the outcome*. The oracle provides precisely such inside information, making the evidence inadmissible and releasing you from the constraint to set credence equal to the chance. This resolution is fundamental to Lewis's formulation and is well-motivated by the intended role of objective chance in guiding rational belief under uncertainty. Your counterexample brilliantly illustrates *why* the admissibility clause is essential, not why PP is flawed.
