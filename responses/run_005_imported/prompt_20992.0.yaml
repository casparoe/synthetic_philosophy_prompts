  First, I recall Lewis's 1976 result. The key assumption is that P(A>B) = P(B|A) for all probability functions, especially after learning the conditional or its negation. The user mentioned that conditionalizing on the antecedent alone doesn't cause issues, so I need to contrast that with conditionalizing on A>B itself. 

  Let me sketch a simple version. Suppose we have two possible worlds: one where A and B are true, and another where A is true but B is false. If we condition on A>B, which is supposed to equal P(B|A), we end up with a contradiction because the conditional's probability can't be 1 when B|A isn't certain. Using concrete probabilities might help. For example, assume P(A) = 0.5 and P(B|A) = 0.5. Then P(A>B) should be 0.5. But after learning A>B, the new probability P'(B|A) must still equal P'(A>B), which is now 1. However, if the worlds are symmetric, learning A>B doesn't change the ratio between A∧B and A∧¬B, so P'(B|A) remains 0.5, contradicting the requirement that it should be 1. That's the crux.

  For part (ii), the minimal set of probability functions. Lewis originally used closure under conditionalizing, but later results like Hájek's show that even a few functions suffice. If you have three specific functions—prior, after learning A>B, and after learning ¬(A>B)—the contradiction arises. The user's friend might think only a few updates are needed, but even that small set forces the probabilities to be trivial, like P(B|A) being 0 or 1.

  Part (iii) involves escape routes. Adams denies that conditionals have truth values, so they aren't propositions in the Boolean algebra. Stalnaker allows the proposition to shift with context, so the conditional isn't fixed. Jackson treats the conditional as material but uses pragmatics to explain why we assert it, so P(if A,B) isn't always P(B|A). None of these let the friend keep both the thesis and a fixed proposition without collapsing probabilities. 

  I should emphasize why conditionalizing on the conditional is crucial. Conditionalizing on A and ¬A doesn't force P(B|A) to match a probability that's now 1 after learning the conditional. The self-referential aspect when the conditional is part of the algebra causes the issue. 

