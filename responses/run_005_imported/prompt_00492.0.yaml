  So I had this whole debate with my friend Mara last night about a situation with my sister and I still don't feel resolved on it. Basically my younger sister is in credit card debt and knows I'm terrified of our parents finding out how bad things got (long story, involves some family history I won't get into). Whenever she needs cash now she doesn't even ask nicely anymore, she just kind of hints that she might "accidentally" mention stuff at Thanksgiving or whatever if I don't help her out fast. And every single time I fold and wire her money, and it's gotten worse each time - bigger amounts, shorter notice, less pretense about it even being a "loan."

  Mara's argument was that the problem isn't really the debt or even my sister's morals, it's that I keep protecting the thing I actually care about (parents not knowing), which basically trains her to keep threatening that exact spot. She said something like, maybe I should make a big visible deal about protecting some OTHER thing instead - like publicly act as if my real red line is "family financial boundaries" or something more generic, so if my sister wants to threaten me she goes after that fake target instead of the real one, and the actual thing I care about stays safe because she doesn't even think to aim there anymore. It sounded clever in the moment but now that I'm typing it out it kind of feels like a mind game that could backfire badly, or that just seems dishonest somehow. Is there something to this idea, and if so how would I actually pull it off without it blowing up in my face?
