answer: |-
  Here’s a toast that threads the needle: sharp for the philosophers, warm for the family, and never loses sight of the love at the center. (Word count: ~450, timing: ~3.5 mins).

  ---

  **The Toast:**

  "Everyone, glasses up! We’re here, of course, for [Sister's Name] and [Partner's Name]. Now, as many of you know, my brilliant sister is finishing a PhD in philosophy. And for the last few years, family dinners have often involved her patiently explaining a particularly tricky problem she’s wrestling with: the 'wrong kind of reasons.'

  *(Lean in conspiratorially)*
  For the uninitiated relatives – don’t worry, I was one of you until she forced-fed me Kant over casserole – it’s basically this: Sometimes, you can have a *really* good reason to admire or desire something… that has absolutely nothing to do with whether that thing is actually *admirable* or *desirable*.

  *(Pause, gesture with glass)*
  Think about it. A tyrant offers you a million dollars to admire his terrible haircut. Good reason? Financially, sure! But is the *haircut* worthy? No! Or a demon philosopher threatens to turn your toes into snails unless you genuinely *desire* a plate of mud. Powerful reason! But does that make the mud *delicious*? Hardly! These are the 'wrong kind' of reasons – external pressures, bribes, threats – masquerading as reasons about the thing itself.

  *(Nod to the philosophers)*
  Her advisor and cohort are nodding grimly. They know the demons well. And [Sister's Name] has spent years dissecting why theories of value get tangled up trying to tell these 'wrong' reasons apart from the 'right' ones – the reasons that actually connect to the genuine goodness, or beauty, or worthiness of the thing itself.

  *(Turn to the couple)*
  Now, contemplating marriage today, surrounded by love and champagne, I couldn't help but see the problem pop up again. Because, let’s be honest, people get married for all *sorts* of reasons that might look like 'good reasons' from the outside. Societal pressure? Wrong kind of reason. A tax break? Definitely the wrong kind! Fear of being alone? Still wrong. A really persuasive demon philosopher threatening snail-toes? Classic wrong kind!

  *(Light laugh)*
  The philosophical puzzle is figuring out how to *theorize* the difference. But here’s the beautiful thing, the thing that cuts through all the academic knots: **We don’t need a fully solved philosophical theory to recognize the 'right kind' of reason when we see it blazingly, undeniably right in front of us.**

  *(Pause, sincere shift)*
  When we see [Sister's Name] and [Partner's Name] together… the way they *actually* look at each other, the quiet understanding that passes between them during a lull in the chaos, the genuine laughter, the unwavering support through dissertations and life’s other demons… it’s crystal clear. This isn’t admiration conjured by a bribe. This isn’t desire manufactured under threat.

  *(Raise glass higher)*
  This is the real thing. The fitting response. The reason that flows *directly* from who they are, individually and together. Whatever complexities remain in the abstract problem of reasons – and trust me, [Sister's Name], your work is safe, the demons aren’t going anywhere – **this marriage, this love, stands as its own perfect, undeniable answer. It *is* the right kind of reason.**

  So, let’s raise our glasses – philosophers, relatives, demon philosophers lurking in the shrubbery, everyone! – to [Sister's Name] and [Partner's Name]. May your life together be filled with the deepest, most profoundly *right* kind of reasons. Cheers!"

  ---

  **Why it works:**

  1.  **Accessible Explanation:** Uses concrete, slightly absurd examples (tyrant's haircut, mud, snail-toes) to explain the core WKR problem quickly for non-phos. Mentions Kant lightly for the phos without dwelling.
  2.  **Philosophical Nod:** Name-drops the problem, acknowledges the advisor/cohort, uses key terms ("fitting response," "external pressures," "theorize the difference") accurately but conversationally. The "demons lurking" is an insider wink.
  3.  **Humor & Relatability:** The family dinner struggle, the bribe/threat marriage reasons – gets laughs without being mean. Self-deprecating ("forced-fed me Kant").
  4.  **The Pivot:** Clearly moves from the abstract problem ("The puzzle is...") to the concrete, observable love ("But here's the beautiful thing..."). The key line: **"We don’t need a fully solved philosophical theory..."** bridges the gap perfectly.
  5.  **Sincerity without Schmaltz:** Focuses on observable *behaviors* of the couple (the look, the understanding, the support) as evidence of the "right kind" of reason. Avoids vague platitudes. The closing connects the philosophical concept ("right kind of reason") directly and meaningfully to their love.
  6.  **Structure & Timing:** Clear intro, explanation, application to marriage, pivot to sincerity, toast. Flows naturally within the time limit.
  7.  **Tone:** Warm, slightly witty, deeply affectionate, and ultimately profound in its simplicity – the love *is* the evidence.

  **Delivery Tip:** Practice the pace, especially the pivot from the academic to the sincere. Let the warmth come through when you look at the couple. The philosophers will appreciate the accurate setup; everyone will feel the genuine sentiment at the end. Good luck!
