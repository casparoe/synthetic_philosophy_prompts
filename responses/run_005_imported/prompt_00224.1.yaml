prompt: |-
  Hey, so I'm working on a piece about AI safety and keep running into this thing called "the shutdown problem" — basically the worry that an advanced AI might not let itself be turned off. I was chatting with a friend who's more into hardware security and she siad the obvious fix is just to have a physical kill switch that isn't networked to anything, like an air-gapped breaker a human flips by hand. That way the AI literally can't stop you from pulling the plug no matter how smart it is. But everytime I read papers by MIRI people or Stuart Russell's group, they treat this like some huge unsolved theoretical puzzle requiring fancy game theory and utility function tweaks, rather than just a wiring problem you could solve with an electrician. Am I missing something here, or are these researchers overcomplicating something that's basically already solved by just unplugging the thing?
