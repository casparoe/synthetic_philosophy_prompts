answer: |-
  This is a fantastic and deeply resonant conflict to center your novel around—you've identified a genuine philosophical fault line. Matilal is indeed the perfect guide. Let's break down the core arguments, their handling of hard cases, and assess their relative strengths.

  **The Core Disagreement: Irreducible Communication vs. Causal Inference**

  1.  **The Nyāya Position: Śabda as Irreducible Communicative Act**
      *   **The Epistemic Work:** Nyāya argues that the *unique epistemic work* done in testimony lies in the **successful transmission of meaning from a competent speaker to a competent hearer via a reliable linguistic convention.** Knowledge arises *directly* from understanding the meaning of the utterance itself, provided certain conditions are met.
      *   **Key Conditions (Pratibandha):**
          *   **Āptatva (Competence/Trustworthiness):** The speaker must be *āpta* – knowledgeable about the matter at hand (*jñānavat*) and truthful/intending to communicate accurately (*abhisandhānavat*). They are not motivated by deceit.
          *   **Śabda-jñāna (Word-Knowledge):** The hearer must understand the linguistic conventions (meanings of words, sentence structure).
          *   **Ākāṅkṣā, Yogyatā, Āsatti (Expectancy, Semantic Fitness, Proximity):** Grammatical/semantic coherence allowing the sentence to convey a unified meaning.
      *   **Why not Inference?** Nyāya insists that reducing testimony to inference misses the point:
          *   **Object of Knowledge:** In inference, the object known (e.g., fire) is *inferred* from a sign (smoke). In testimony, the object known (e.g., "There is fire on the mountain") is *directly presented* by the meaningful sentence itself.
          *   **Process:** Inference requires active contemplation of the logical relation (*vyāpti*) between sign and signified. Testimony, when the conditions are met, yields knowledge *immediately* upon understanding the sentence meaning. There's no conscious mental step of *inferring* the speaker's reliability *before* grasping the proposition. Trust (*viśvāsa*) in the speaker is a *background condition* enabling the communicative act, not the *inferential middle term* in every act of testimonial understanding.
          *   **Nature of the Cause:** The *proximate cause* of testimonial knowledge is the *understood meaning*. While the speaker's reliability is a necessary *background condition*, it is not the *operative instrument* (karaṇa) *through which* the specific fact (e.g., the fire) is known. The instrument is the understood sentence meaning.
      *   **Handling Hard Cases:**
          *   **Long Chains of Testimony (Paramparā):** Nyāya relies on the concept of an *āpta* chain. The original speaker must be āpta. Each subsequent speaker must faithfully transmit the message *and* be āpta *regarding their role as a faithful transmitter*. The hearer needs to know (or justifiably believe) that the *chain itself is reliable* – that the tradition or transmission mechanism preserves āptatva. Knowledge arises from understanding the utterance *in the context of this reliable chain*. The epistemic work is still the direct grasp of meaning within a trusted communicative framework.
          *   **Unverifiable Matters (Remote History, Subtle Dharma):** This is where Nyāya shines. They argue testimony is *essential* and *irreducible* precisely for knowledge that cannot be accessed by perception or inference. Knowing the specific details of the Battle of Kurukṣetra, or the exact nature of ritual efficacy (*apūrva*), *depends entirely* on śabda from a reliable source (the Vedas, an authoritative historian). The knowledge arises *from the meaning of the report itself*, understood as originating from an āpta source. Attempting to reduce this to an inference about the speaker's reliability is circular or impossible – how could you *infer* the reliability of the *first* speaker about a unique, unobservable event without relying on... their testimony? Nyāya bites the bullet: this knowledge rests on the irreducible authority of the āpta source.

  2.  **The Buddhist (Pramāṇavādin) Position: Śabda as Inference (Anumāna)**
      *   **The Epistemic Work:** Dignāga and especially Dharmakīrti argue that upon hearing an utterance, the hearer does *not* directly grasp an external state of affairs. Instead, the hearer makes an **inference based on the observed sign of the speaker's utterance.** The knowledge is *inferred*.
      *   **The Inferential Structure:**
          *   **Perceived Sign (Liṅga):** The utterance itself ("There is fire on the mountain").
          *   **Inferred Property (Sādhya):** The truth of the proposition expressed (that there *is* fire on the mountain).
          *   **Logical Connection (Vyāpti):** The invariable connection between the speaker making such an utterance *and* the proposition being true, *because* the speaker is known (or assumed) to be reliable (*āpta*). This reliability has two facets: Competence (*viśārada*) and Truthfulness (*abhiruta*).
      *   **Why Not a Separate Pramāṇa?** The Buddhists claim:
          *   **No Direct Access:** Words only make us aware of *concepts* (vikalpa, kalpanā), not directly of external reality (svalakṣaṇa). Knowledge of reality *must* come through perception or inference based on perception.
          *   **The Reliability Inference is Essential:** The *only* reason to believe the proposition "P" upon hearing "P" is the (often implicit) inference: "This speaker said P; this speaker is reliable (competent and truthful) regarding P; therefore, P is true." The utterance is the *sign* triggering the inference to the state of affairs *via* the middle term of the speaker's reliability.
          *   **Collapse into Inference:** Since the epistemic work is fundamentally the same as in any inference – moving from a perceived sign (utterance) to an unperceived object (the fact) via a known connection (reliability) – śabda is not a distinct *pramāṇa* but a *type* of inference.
      *   **Handling Hard Cases:**
          *   **Long Chains of Testimony:** This becomes complex and burdensome. To know "P" via a chain A->B->C->Hearer, the hearer must effectively make a *recursive inference*:
              1.  C says "P".
              2.  C is reliable *as a transmitter* (implying C accurately reports what they heard from B).
              3.  Therefore, B said "P" to C. (Inference 1)
              4.  B is reliable *as a transmitter*. (Requires justification)
              5.  Therefore, A said "P" to B. (Inference 2)
              6.  A is reliable *as a source* (competent and truthful about P). (Requires justification)
              7.  Therefore, P is true. (Inference 3)
          The Buddhists must argue that the hearer either explicitly performs this chain of inferences (unlikely) or has a habituated, condensed inference based on the perceived reliability of the *entire chain* or institution. However, justifying the reliability of each link, *especially the first source*, without circularity (i.e., without ultimately relying on testimony *about* their reliability) is the Achilles' heel.
          *   **Unverifiable Matters (Remote History, Subtle Dharma):** This is the major weakness of the reductionist view. How does the inference work?
              *   **Reliability Cannot be Established:** For a unique, unobservable past event, how does the hearer establish the *vyāpti* (invariable connection) between the speaker's utterance and the truth of the event? You cannot independently verify the event to confirm the speaker's reliability. You cannot observe multiple instances of them reporting unobservable past events correctly. The required inductive basis for the inference is *lacking*.
              *   **Collapse into Faith or Circularity:** The Buddhist is forced into a corner. Either:
                  *   They admit that belief in such testimony is *not* knowledge (*pramā*), but mere faith or unjustified belief (*śraddhā*), which undermines the epistemic value of tradition and scripture central to Indian thought.
                  *   They tacitly rely on the *testimony itself* (or other testimonies) to establish the speaker's reliability regarding unverifiable matters. But this is circular: "I believe the Vedas are reliable because the Vedas (or other texts/teachers citing the Vedas) say they are reliable." The reduction to inference fails precisely when inference lacks the necessary perceptual grounding.

  **Judgment: Which Position Survives Scrutiny Better?**

  **The Nyāya position emerges as the more robust and intellectually satisfying account of testimonial knowledge, particularly when confronted with the hard cases you've identified.**

  *   **Strength of Nyāya:** They offer a realistic, holistic account of how language *actually works* in transmitting knowledge socially. Their model captures the *directness* of understanding meaning and correctly identifies the speaker's reliability as a *background enabling condition* rather than the constant, conscious object of an inference. This avoids the infinite regress or circularity inherent in trying to *infer* the reliability of the first speaker about the unobservable. Their framework comfortably handles long chains and *requires* testimony for unverifiable domains, providing a principled epistemic basis for historical, scriptural, and traditional knowledge.
  *   **Weakness of Buddhist Reduction:** While elegant and parsimonious in simple cases (e.g., a trusted friend telling you what they saw), the Buddhist model strains credulity in complex or foundational cases. The requirement to *infer* reliability via *vyāpti* grounded in perception becomes impossible for the very domains where testimony is most crucial (unobservables, unique past events, complex doctrines). The recursive inference chains for long testimony are psychologically implausible and epistemically fragile. Ultimately, the reduction either fails to account for genuine knowledge in these domains or collapses into circularity when trying to establish the foundational reliability needed for the inference.

  **Why Nyāya Wins (and Why This Makes for Good Drama):**

  1.  **Handles the Hard Cases:** Nyāya has a principled, non-circular way to grant knowledge status to testimony about the unverifiable past and complex chains. The Buddhist struggles profoundly here, either denying knowledge or relying on circular justifications.
  2.  **Psychological Plausibility:** Nyāya's description of understanding meaning directly, given trust, matches our lived experience far better than the constant, often subconscious, reliability inference demanded by the Buddhist model.
  3.  **Avoids Regress:** Nyāya stops the regress of justification at the āpta source. The Buddhist reduction pushes the regress back to justifying the reliability of the first speaker about the unobservable, which cannot be done inferentially without relying on testimony.
  4.  **Preserves Social Epistemology:** Nyāya provides a stable foundation for knowledge based on tradition, expertise, and linguistic community – essential for a functioning society and intellectual culture. The Buddhist reduction, while philosophically rigorous in its ideal, risks undermining the epistemic basis of vast swathes of socially indispensable knowledge.

  **For Your Scene: Crafting the Defeat**

  *   **Let the Buddhist Shine First:** Have the Buddhist monk articulate the reduction clearly and forcefully, using simple, verifiable examples ("Your servant says lunch is ready. You infer he is truthful and competent, hence lunch is ready."). Emphasize the elegance and parsimony – collapsing śabda into the well-established anumāna.
  *   **The Naiyāyika's Counter: The Hard Cases:** The Nyāya scholar should concede the reduction *might* work for simple, verifiable cases but then pivot decisively to the hard cases. Focus relentlessly on:
      *   **The Unverifiable Past:** "Venerable Monk, you speak of inferring reliability. Tell me, how did you establish the *vyāpti* that when Ācārya X speaks of Emperor Aśoka's edicts at Sārnāth, his words are invariably true? Did you perceive Aśoka? Did you perceive multiple instances of Ācārya X reporting unobservable past events correctly? Or did you learn of his reliability... through the testimony of others? And their reliability? Where does this inference begin without relying on the very śabda you seek to reduce?"
      *   **Long Chains & Foundational Knowledge:** "Consider the intricate details of the Buddha's past lives, passed down through generations of your Sangha. Is your knowledge of the Jātakas, Venerable One, the result of a chain of inferences about each transmitter's reliability? Or do you understand the *meaning* of the stories themselves, trusting in the reliability of the lineage *as a condition* for that understanding to yield knowledge? If it is merely inference, justify the reliability of the first reporter without invoking his own testimony or another's testimony about him. You cannot. Your anumāna is stranded without the shore of śabda."
  *   **The Buddhist's Dilemma:** Show the Buddhist monk grappling honestly. They might try to appeal to the reliability of the Dharma itself as a system, but the Naiyāyika can counter that this just pushes the question back. They might fall back on faith (*śraddhā*), but this concedes the epistemic point – it's not *pramā* (valid knowledge) by their own rigorous standards. They might become logically tangled in the regress. This internal struggle – the realization that their elegant theory founders on the rocks of social and historical knowledge – *is* the intellectual defeat. It's not that testimony isn't useful; it's that their account *cannot* fully justify it *as knowledge* in its most important applications.
  *   **The Atmosphere:** Use the setting – the hallowed debate hall, the tension, the hushed audience of monks and scholars, the weight of tradition. The Naiyāyika's victory should feel less like a logical trick and more like the unveiling of a deeper truth about how language and community actually convey understanding. The silence after the Buddhist concedes the point (perhaps not the whole debate, but this crucial issue) should be profound.

  By grounding the defeat in the specific failure of the reductionist model to handle the hard cases central to the transmission of tradition and history, you create a real, earned intellectual victory for the Nyāya position, one that resonates with the epistemological concerns of the setting and avoids caricature. Good luck with the scene – it sounds like it will be the philosophical heart of your novel!
