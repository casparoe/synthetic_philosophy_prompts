prompt: |-
  Retired chemist here, fell down a game theory rabbit hole this past year and could use some help. I keep running into this idea of "program equilibrium" - two agents get to read each other's source code before playing a prisoner's dilemma, and that's apparently enough to get them out of the usual mutual-defection trap. Fine so far. But then there's this whole other layer where, instead of having the programs simulate each other's behavior directly, people use something called Löb's theorem from provability logic instead (the "FairBot" example everyone cites). Can you help me get an intuitive feel for why the direct-simulation approach breaks down - my hunch is its some kind of infinite regress, like two mirrors facing each other - and what the Löb's theorem trick is actually doing to get around that? I don't need the modal logic spelled out line by line, just the "aha" of it.
