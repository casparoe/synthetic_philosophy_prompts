prompt: |-
  so for this dual-enrollment philosophy of science class i take online, we did a peer-grading thing this week — we each got assigned someone elses short-answer response to grade against a rubric before handing it back, and i wanna sanity check my grading before i submit it bc apparently we loose points if our grading is "unjustified."

  here's the question we got (it was worth 10 points):

  "Q: The 'gene's-eye view' associated with Dawkins and the multi-level selection theory associated with Sober and D.S. Wilson are often presented as rival answers to the question of what the unit of selection is. Using the evolution of sterile worker castes in eusocial insects as your example, explain how each side would account for this trait, then assess whether the disagreement between the two camps is a substantive empirical one or mostly a matter of perspective/bookkeeping."

  and heres the answer i have to grade:

  "Dawkins' gene's-eye view holds that the gene, not the organism, is the fundamental unit of selection, since genes are the things that actually get copied across generations — so evolution is best described as competition between alleles for representation in the next generation. On this view, sterile workers are explained through kin selection: because haplodiploidy means full sisters share 3/4 of their genes (vs. 1/2 with their own offspring), a worker increases her genetic representation more by helping her mother produce more sisters than by reproducing herself. Dawkins formalized this logic in his famous inequality rB > C, where r is relatedness, B is benefit to the recipient, and C is cost to the actor — if relatedness-discounted benefit exceeds cost, the 'altruistic' gene spreads even as the individual carrying it reproduces less.

  Sober and Wilson, on the other hand, treat the colony itself as a vehicle (even a kind of organism), with selection acting directly at the colony level: colonies with better cooperation out-reproduce colonies with worse cooperation, the same way fitter individuals out-reproduce less fit ones. Since colony-level selection and kin selection generate identical quantitative predictions once relatedness is accounted for, Sober and Wilson conclude the two aren't really rivals — multi-level selection is just kin selection redescribed in group-fitness language, and the Dawkins-vs-Wilson fight is mostly terminological, which is a point most people on both sides of the debate now concede."

