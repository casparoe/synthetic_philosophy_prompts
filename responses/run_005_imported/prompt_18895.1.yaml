prompt: |-
  In my graduate seminar on democratic theory, we discussed a stylized case: the town of Rivermouth is holding a referendum on whether to double the capacity of its small regional airport. Only registered Rivermouth voters may vote, but the new flight paths would route almost all the added noise and pollution over Fenwick, a separate, smaller town next door whose residents have no vote in the referendum and never will, since the airport sits entirely within Rivermouth's boundaries. Two of my students kept arguing about it after class.

  (1) Elena said the franchise is drawn in the wrong place: since Fenwick's residents will bear most of the real costs of the decision, they have at least as much claim to a vote as Rivermouth's own residents do, and restricting the referendum to people inside an administrative line that predates the airport is arbitrary. The demos, she said, should track whoever's interests are substantially affected by a decision, not a line on a map.

  (2) Marcus objected that this proves too much: trace the causal effects of almost any local decision far enough — property values, contractor bids, downstream traffic — and you can find non-trivial effects on people well outside the jurisdiction, so "affected interests" alone gives no way to stop enfranchising ever-wider, ill-defined populations for ever more decisions. He proposed that the relevant test is instead whose conduct the town's authority actually binds: Fenwick's residents are not subject to Rivermouth's ordinances, so whatever they suffer as a side-effect, they have no standing to demand a vote in Rivermouth's elections.

  (3) Elena replied that this gets the moral order backwards: coercion matters only because it is one way that people's interests get overridden without their say, so interests are still doing the fundamental work. She added that Fenwick's residents are coerced here in a perfectly literal sense too — nuisance and property law will forcibly bar them from doing anything about the noise — so the decision is in fact enforced on them by the same coercive apparatus Marcus wants to reserve for Rivermouth's own citizens.

  (4) Marcus answered that if being legally barred from suing over a side-effect counts as being coerced by the decision that caused it, then everyone anywhere protected by ordinary property and tort law is "coerced" by every externality anyone generates, and his criterion collapses right back into Elena's boundary-less one. Still, he insisted that jurisdiction is at least a determinate, all-or-nothing fact where "how affected is affected enough" is not — so if anything can fix a boundary non-arbitrarily, it will look more like his criterion than hers, even though he conceded he could not yet say why subjection, rather than interest, should count as the more basic notion.

  They asked me who was right, and I genuinely could not settle it. Could you go through the exchange move by move — saying who has the better of it at each of the four numbered moves, since it needn't come out even — and then flag anything important you think both of them are overlooking about whether the boundary of the demos can be fixed in a principled way at all?
reasoning: |-
  Okay, let me try to unpack this graduate seminar debate step by step. The Rivermouth airport referendum case presents a classic democratic boundary problem, and Elena/Marcus capture two major theoretical approaches. 

  First, I need to map their core positions: Elena advocates the "all-affected interests" principle (AAI), while Marcus defends the "coercion/subjection" criterion. Their four exchanges reveal how each theory handles spillover effects and boundary indeterminacy. 

  Starting with Move 1: Elena's AAI argument feels intuitively strong - Fenwick bears 90% of costs but has 0% vote. Her "lines on maps are arbitrary" point echoes democratic theorists like Dahl. But I recall Young's warning that AAI risks infinite regress when applied literally. That's exactly Marcus' objection in Move 2. 

  Marcus' jurisdictional coercion criterion (inspired by Abizadeh?) offers administrative clarity but feels morally thin. When Elena counters in Move 3 that nuisance laws actively coerce Fenwick residents, she exposes a flaw - coercion isn't binary. Airport noise regulation does forcibly prevent Fenwick from seeking remedies, creating a de facto subjection. 

  In Move 4, Marcus correctly notes Elena's coercion expansion collapses into AAI, but his "determinate boundaries" defense sidesteps the moral core. Both miss that jurisdiction itself is a political choice - Rivermouth's map isn't natural law. 

  The deeper oversight? Neither grapples with scale-matching solutions (like creating a joint authority) or procedural fixes (Fenwick consultation rights). Also missing is how historical power imbalances created this boundary - Fenwick's exclusion likely reflects its smaller size/wealth. 

  Worth noting how both students implicitly accept majoritarian voting as the only mechanism. But could consensus models or weighted voting address this? The seminar might benefit from Fung's work on mitigated minipublics. 

  Ultimately, the airport case shows democratic boundaries require both moral justification (Elena's concern) and institutional workability (Marcus' worry). Weygandt's "constitutive exclusion" framework helps here - all demoi exclude someone, so we need compensatory external review processes.
answer: |-
  Let's analyze this sophisticated debate move by move, assessing who has the better argument at each stage and then identifying overlooked dimensions:

  ### Move 1: Elena's "Affected Interests" Argument
  **Elena:** Better of this move  
  Her critique highlights a genuine democratic deficit: Fenwick bears disproportionate costs without representation. The administrative-boundary objection resonates with real-world cases (e.g., toxic waste sites near borders). Her "demos should track affected interests" principle aligns with theorists like Dahl ("all affected interests" standard) and challenges the moral arbitrariness of map lines.  

  *Weakness:* Fails to address *how* we measure "substantially affected" or prevent overextension (as Marcus anticipates).

  ### Move 2: Marcus' "Slippery Slope" Objection
  **Marcus:** Better of this move  
  He successfully exposes the core flaw in unqualified "affected interests": its potential for infinite regress. If *any* affected interest warrants inclusion, voting rights could extend globally for local decisions (e.g., a zoning change affecting distant suppliers). His "binding conduct" criterion (emphasizing *authority*) offers a clear, administrable boundary, aligning with legal positivism (e.g., Hobbes, Weber).  

  *Weakness:* Dismisses moral concerns about severe externalities. His "no standing" claim ignores that Fenwick lacks recourse *because* of jurisdictional boundaries.

  ### Move 3: Elena's "Coercion" Counter
  **Elena:** Better of this move  
  She reframes coercion intelligently:  
  - **Morally:** Correctly notes coercion matters *because* it overrides interests (rebutting Marcus' hierarchy).  
  - **Practically:** Highlights that nuisance/tort law *actively prevents* Fenwick from mitigating harm, making them subject to Rivermouth’s coercive apparatus. This refutes Marcus’ claim that effects are mere "side-effects." Fenwick is *de jure* disempowered.  

  *Weakness:* Overstates coercion’s scope. Not all externalities involve legal barriers to redress.

  ### Move 4: Marcus' "Boundary Collapse" Reply
  **Marcus:** Better on practicality, weaker on ethics  
  - **Strong:** Correctly argues Elena’s coercion definition expands to match "affected interests," losing boundary-defining power (e.g., anyone blocked from suing over pollution is "coerced").  
  - **Weak:** His "determinacy" defense (jurisdiction = clear, affectedness = fuzzy) is pragmatic but morally unsatisfying. Conceding he can’t justify why "subjection" > "interest" as foundational undermines his normative position.  

  --- 
  ### What Both Overlook: Core Problems in Demos-Boundary Fixing  
  1. **The Constitutive Paradox:**  
     Boundaries themselves require democratic justification, creating circularity (Whelan’s "boundary problem"). Neither resolves *who* should decide where lines are drawn initially.  

  2. **Scalability Solutions:**  
     They treat "vote in Rivermouth’s referendum" as the only remedy. Alternatives exist:  
     - **Inter-jurisdictional bodies:** Joint authorities for cross-border issues (e.g., airport commissions with Fenwick representation).  
     - **Legal recourse:** Strengthening Fenwick’s rights to sue or demand compensation (internalizing externalities).  
     - **Subsidiarity+:** Applying "decisions at the lowest *appropriate* level" might require new regional governance tiers.  

  3. **Power Asymmetry:**  
     Fenwick’s exclusion reflects historical/political power imbalances. Boundary fixes must address whether smaller communities can resist larger neighbors' externalizations (Young’s "differentiated solidarity").  

  4. **Hybrid Criteria:**  
     Neither acknowledges combined approaches:  
     - **"Subject to coercion" + "intensity of effect":** Enfranchise severely affected outsiders *only* when effects are direct, severe, and irremediable (Bauböck’s "stakeholder principle").  
     - **Procedural vs. substantive fixes:** Even if Fenwick can’t vote, require Rivermouth to consult them or conduct impact assessments (Goodin’s "all-affected *as an audience*").  

  5. **Democratic Legitimacy Beyond Voting:**  
     Voting isn’t the only legitimacy source. Transparency, deliberation with affected outsiders, and judicial review may mitigate boundary problems (Habermas; Fung).  

  ### Conclusion: A Stalemate with Paths Forward
  - **Elena** wins morally: Interests/coercion must be central when effects are severe and imposed.  
  - **Marcus** wins institutionally: Pure "affected interests" is unworkable; boundaries need clear rules.  
  - **Critical oversight:** Both neglect that boundaries are *political choices*, not natural facts. A principled solution requires:  
    - Multi-level governance (e.g., regional compacts),  
    - Fallback mechanisms for excluded groups (e.g., federal oversight),  
    - Differentiating *routine* externalities from *catastrophic* ones (Näsström’s "principle of affectedness with thresholds").  

  The debate reveals democratic theory’s core tension: moral inclusion vs. institutional feasibility. Neither student alone resolves it, but their synthesis—plus pragmatic innovations beyond voting—points toward legitimacy.
