  We are going to tackle the two-envelope paradox with a valid prior distribution that still leads to the conclusion that you should always switch. The key is that the prior must have an infinite mean (expected value). We'll construct a concrete example and walk through the reasoning step by step.

  ### Setup
  Let the amounts in the envelopes be such that one envelope has an amount `X` and the other has `2X`. Let the prior distribution for `X` (the smaller amount) be defined over positive real numbers. We denote the probability density function (pdf) by `f(x)` and the cumulative distribution function (cdf) by `F(x)`. We require that `f(x)` is a valid pdf: non-negative and integrates to 1 over `(0, ∞)`.

  ### The Switching Argument
  Suppose you pick an envelope and open it to find an amount `y`. Now, there are two possibilities:
  1. Your envelope is the smaller one, so the other envelope has `2y`.
  2. Your envelope is the larger one, so the other envelope has `y/2`.

  The classical switching argument computes the expected value of the other envelope as:
     E = (1/2) * (2y) + (1/2) * (y/2) = (1/2)(2y + y/2) = (1/2)(5y/2) = 5y/4

  Since 5y/4 > y, it seems you should switch. But this is paradoxical because the same argument applies no matter what `y` you see, and it would also apply if you were given the other envelope first.

  ### The Issue with the Switching Argument
  The flaw in the above is that it assumes that the two cases (your envelope being the smaller or the larger) are equally likely regardless of `y`. But in reality, the probability that your envelope is the smaller one (given that you observed `y`) depends on the prior distribution of `X`.

  Let:
     p = P(your envelope is the smaller one | you observed y)

  Then the expected value of the other envelope is:
     E[other | y] = p * (2y) + (1-p) * (y/2)

  The switching argument implicitly assumed p=1/2 for every y. But is that necessarily true?

  ### Constructing a Prior with Infinite Mean
  We will now construct a prior distribution for `X` (the smaller amount) that has the property that for every possible observed value `y` in the support, the expected value of switching is greater than `y`. Moreover, we want the distribution to be proper (integrates to 1) but have an infinite mean.

  Example distribution: Let the pdf of `X` (the smaller amount) be:
     f(x) = c / (x^2)   for x >= 1
     and 0 otherwise.

  We choose the support [1, ∞) to avoid the singularity at 0. The constant `c` must be chosen so that the integral from 1 to ∞ of f(x) dx is 1.

  Compute:
     ∫_{1}^{∞} (c / x^2) dx = c * [ -1/x ]_{1}^{∞} = c * (0 - (-1)) = c

  So we set c=1. Thus, f(x) = 1/x^2 for x>=1.

  Now, the cdf is:
     F(x) = ∫_{1}^{x} (1/t^2) dt = [ -1/t ]_{1}^{x} = 1 - 1/x

  The mean of X is:
     E[X] = ∫_{1}^{∞} x * (1/x^2) dx = ∫_{1}^{∞} (1/x) dx = [ln(x)]_{1}^{∞} = ∞

  So the mean is infinite.

  ### The Switching Strategy for Our Prior
  We now consider that the two envelopes contain X and 2X. We pick one at random and observe the amount y. We need to compute the conditional probability that we picked the smaller envelope given y.

  Note: The observed amount y must be at least 1 (because X>=1) and also note that if we picked the smaller envelope then y = X, and if we picked the larger envelope then y = 2X (so in that case, X = y/2).

  But note: the event that we picked the smaller envelope and observed y is equivalent to X=y. The event that we picked the larger envelope and observed y is equivalent to X=y/2 (and note that for this to happen we must have y>=2 because X>=1 so y/2>=1).

  Therefore, the sample space for y is [1, ∞). However, note that if we observe y in [1,2), then it is impossible that we picked the larger envelope? Why? Because if we had picked the larger envelope, then the smaller envelope would be y/2, but y/2 < 1 (if y<2) and our prior says X>=1. So for y in [1,2), we must have picked the smaller envelope.

  But wait: if we observe y in [1,2), then the other envelope is 2y (because we must have the smaller one) and 2y is in [2,4). However, note that if we had the larger envelope, we would observe at least 2 (since the smaller envelope is at least 1, the larger is at least 2). Therefore, for y in [1,2), we are certain that we have the smaller envelope.

  For y>=2, we could have either:
     Case 1: We picked the smaller envelope -> then X = y.
     Case 2: We picked the larger envelope -> then X = y/2.

  We now compute the probability of these two cases given y.

  The prior density for X is f(x)=1/x^2 for x>=1.

  The probability of the two cases:
     Case 1: The smaller envelope is y. The prior density at x=y is 1/y^2.
     Case 2: The smaller envelope is y/2. The prior density at x=y/2 is 1/(y/2)^2 = 4/y^2.

  But note: we are equally likely to pick either envelope. Therefore, the joint density for the observed y and the case is:

     If we pick the smaller envelope and observe y: the density is (1/2) * f(y) = (1/2) * (1/y^2)
     If we pick the larger envelope and observe y: the density is (1/2) * f(y/2) = (1/2) * (4/y^2) = 2/y^2

