  ### A Known Construction

  There is a construction by Broome, and also by Chalmers, using a discrete distribution that is not on powers of 2. 

  Let the possible values for the smaller amount X be: a1, a2, a3, ... with a_{n} = 3^{n-1} (starting at n=1: 1, 3, 9, 27, ...). 

  But then the amounts in the envelopes would be (a_n, 2a_n) = (3^{n-1}, 2*3^{n-1}). However, note that 2*3^{n-1} = 2*3^{n-1} and 3^n = 3*3^{n-1}. These are not the same. So if we observe y=2*3^{n-1}, then it could be:
     - the larger envelope in the pair (3^{n-1}, 2*3^{n-1}), or
     - the smaller envelope in the pair (2*3^{n-1}, 4*3^{n-1})? But 4*3^{n-1} is not in the sequence of a_n (which are powers of 3). 

  So we see the problem: the amounts are not closed under doubling and halving.

  Chalmers' solution is to have the amounts in the envelopes be chosen from a set that is closed under doubling and halving. That is, the set of possible amounts should be such that if x is in the set, then 2x is in the set. And also, we need to be able to define a prior on the smaller amounts that is proper.

  He suggests using the set: { ... 1/4, 1/2, 1, 2, 4, ... } i.e., all powers of 2. But then we are back to our earlier example.

  In that case, we saw that we don't get always switch.

  ### Conclusion: The St. Petersburg Connection

  The resolution is that if the prior has infinite mean, then the expected value of the amount in the other envelope may be infinite as well, and then any finite y would make switching seem attractive because you are comparing a finite amount to infinity. 

