  Let me walk you through this step by step, with a concrete example and clear reasoning. I'll show how the "always switch" paradox emerges even with a valid probability distribution, and why it's fundamentally tied to infinite expected values – essentially the St. Petersburg paradox in disguise.

  ### Core Problem Recap
  - Two envelopes: One contains `X`, the other `2X` (unknown which is which).
  - You pick one, open it to see amount `Y`.
  - The paradox: For **any** `Y` you see, the expected value of switching seems greater than `Y`.

  The key insight: **This only happens if the prior distribution of `X` has an infinite expected value**, even if it's a perfectly valid (normalized) distribution. Let's prove this.

  ### Why the Standard Resolution Fails Here
  Standard explanations say the paradox arises from an *invalid* uniform prior over infinity (which can't be normalized). But as you discovered, Chalmers showed you can create a *valid* normalized prior where:
  - The probability distribution sums to 1 (no infinity problems)
  - Yet for every observed `Y`, the expected value of switching is greater than `Y`

  This seems to break rationality. But there's a catch: **infinite expected value**.

  ---

  ### Constructing a Valid Prior with the "Always Switch" Property
  We'll use a **discrete prior** (simpler to calculate) where the smaller amount `X` takes values in powers of 2:  
  `X ∈ {1, 2, 4, 8, 16, ..., 2^k, ...}`  

  Define the probability mass function:  
  `P(X = 2^k) = \frac{c}{(k+1)(k+2)}` for `k = 0, 1, 2, ...`  

  Where `c` is a normalization constant. First, verify this is valid:

  #### 1. Normalization (Sums to 1)
  Compute the sum:  
  `∑_{k=0}^∞ P(X = 2^k) = c ∑_{k=0}^∞ \frac{1}{(k+1)(k+2)}`  

  Simplify the series using partial fractions:  
  `\frac{1}{(k+1)(k+2)} = \frac{1}{k+1} - \frac{1}{k+2}`  

  This telescopes:  
  `∑_{k=0}^∞ \left( \frac{1}{k+1} - \frac{1}{k+2} \right) = \left(1 - \frac{1}{2}\right) + \left(\frac{1}{2} - \frac{1}{3}\right) + \left(\frac{1}{3} - \frac{1}{4}\right) + ... = 1`  

  So `c × 1 = 1` → `c = 1`. **The distribution is valid.**

  #### 2. Expected Value of X
  `E[X] = ∑_{k=0}^∞ 2^k \cdot P(X = 2^k) = ∑_{k=0}^∞ 2^k \cdot \frac{1}{(k+1)(k+2)}`  

  For large `k`, note that `2^k` grows exponentially, while `\frac{1}{(k+1)(k+2)}` decays polynomially. The series diverges:  
  `2^k / (k^2) → ∞` as `k → ∞` → `E[X] = ∞`  
  **Infinite expected value is key!**

  ---

  ### Now, Simulate the Envelope Scenario
  - Envelope A: `X` (smaller amount)  
  - Envelope B: `2X`  
  - You pick one uniformly at random and observe `Y`.

  #### What Happens When You See `Y`?
  Since `X` is always a power of 2, `Y` must also be a power of 2 (either `X` or `2X`). Let `Y = 2^m` for some integer `m ≥ 0`.

  **Crucial:** For a given `Y = 2^m`, there are **two possible scenarios**:
  1. **Case 1 (Smaller):** `X = 2^m` (you have the smaller envelope) → Other envelope has `2^{m+1}`
  2. **Case 2 (Larger):** `X = 2^{m-1}` (you have the larger envelope) → Other envelope has `2^{m-1}`

  We need the conditional probabilities:  
  `P(\text{Case 1} | Y = 2^m)` and `P(\text{Case 2} | Y = 2^m)`

  #### Step 1: Unconditional Probability of Observing `Y = 2^m`
  - **From Case 1:**  
    Probability = `P(\text{pick smaller}) \cdot P(X = 2^m) = \frac{1}{2} \cdot \frac{1}{(m+1)(m+2)}`  
  - **From Case 2 (only if m ≥ 1):**  
    Probability = `P(\text{pick larger}) \cdot P(X = 2^{m-1}) = \frac{1}{2} \cdot \frac{1}{m(m+1)}`  

  **Marginal probability for `Y = 2^m`:**  
  `P(Y = 2^m) = \begin{cases} 
  \frac{1}{2} \cdot \frac{1}{1 \cdot 2} = \frac{1}{4} & \text{if } m = 0 \\
  \frac{1}{2} \cdot \frac{1}{(m+1)(m+2)} + \frac{1}{2} \cdot \frac{1}{m(m+1)} & \text{if } m \geq 1 
  \end{cases}`

  For `m ≥ 1`, simplify:  
  `P(Y = 2^m) = \frac{1}{2} \left[ \frac{1}{(m+1)(m+2)} + \frac{1}{m(m+1)} \right] = \frac{1}{2} \cdot \frac{2m + 2}{m(m+1)(m+2)} = \frac{1}{m(m+2)}`

  #### Step 2: Conditional Probabilities
  - **For `m = 0` (Y = 1):**  
    Only Case 1 is possible → `P(\text{Case 1} | Y=1) = 1`  
    Other envelope has `2^1 = 2`
    
  - **For `m ≥ 1`:**  
    `P(\text{Case 1} | Y=2^m) = \frac{ \frac{1}{2} \cdot \frac{1}{(m+1)(m+2)} }{ \frac{1}{m(m+2)} } = \frac{m}{2(m+1)}`  
    `P(\text{Case 2} | Y=2^m) = 1 - P(\text{Case 1}) = \frac{m+2}{2(m+1)}`

  #### Step 3: Expected Value of Switching
  The other envelope contains:  
  - `2^{m+1}` in Case 1 (prob = `\frac{m}{2(m+1)}`)  
  - `2^{m-1}` in Case 2 (prob = `\frac{m+2}{2(m+1)}`)  

  **Expected value of other envelope:**  
  `E[\text{Other} | Y=2^m] = \underbrace{2^{m+1} \cdot \frac{m}{2(m+1)}}_{\text{Case 1}} + \underbrace{2^{m-1} \cdot \frac{m+2}{2(m+1)}}_{\text{Case 2}}`  

  Simplify:  
  `= 2^m \left( \frac{2m}{2(m+1)} + \frac{1}{4} \cdot \frac{m+2}{m+1} \right) = 2^m \left( \frac{m}{m+1} + \frac{m+2}{4(m+1)} \right)`  

  `= 2^m \cdot \frac{4m + (m+2)}{4(m+1)} = 2^m \cdot \frac{5m + 2}{4(m+1)}`  

  **Compare to `Y = 2^m`:**  
  `E[\text{Other} | Y] - Y = 2^m \left( \frac{5m + 2}{4(m+1)} - 1 \right) = 2^m \cdot \frac{5m + 2 - 4m - 4}{4(m+1)} = 2^m \cdot \frac{m - 2}{4(m+1)}`  

  This difference is:
  - **Positive** when `m > 2` (i.e., `Y > 4`)  
  - **Zero** when `m = 2` (Y=4)  
  - **Negative** when `m = 1` (Y=2)  

  But for `m = 0` (Y=1):  
  `E[\text{Other} | Y=1] = 2 > 1`  

  **Not always greater!** We need a heavier tail.

  ---

  ### Achieving "Always Switch" with Heavier Tails
  Modify the prior to decay slower:  
  `P(X = 2^k) = \frac{c}{2^{k/2}}` for `k = 0, 1, 2, ...`  

  #### 1. Normalization:  
  `∑_{k=0}^∞ \frac{c}{2^{k/2}} = c ∑_{k=0}^∞ (2^{-1/2})^k = c \cdot \frac{1}{1 - 1/\sqrt{2}} < \infty`  
  So `c = 1 - 1/\sqrt{2} > 0`. **Valid distribution.**

  #### 2. Expected Value:  
  `E[X] = ∑_{k=0}^∞ 2^k \cdot \frac{c}{2^{k/2}} = c ∑_{k=0}^∞ (2^{1 - 1/2})^k = c ∑_{k=0}^∞ (\sqrt{2})^k`  
  Since `\sqrt{2} > 1`, this diverges → `E[X] = ∞`.  

  #### 3. Conditional Expected Value for `Y=2^m`:
  Similar calculations as before show:  
  `E[\text{Other} | Y=2^m] = 2^m \cdot \frac{\sqrt{2}}{2} \left( \frac{1}{1 + \sqrt{2}^{-1}} \right) > 2^m` for **all** `m`  

  **Why?** Because the heavier tail ensures:  
  - When `Y` is large, there's high probability that `Y` is the *smaller* envelope (since huge values of `X` are likely enough).  
  - This outweighs the risk of halving `Y` when it's the larger envelope.  

  **But note:** The exact value is finite for each `Y`, yet strictly greater than `Y`. How? Because the divergence of `E[X]` allows the conditional expectation to "pull" the expected value of the other envelope above any finite `Y`.

  ---

  ### Why This is St. Petersburg in Disguise
  The St. Petersburg paradox:
  - You play a game: Flip a coin until first tails.
  - If tails first appears on toss `k`, you win `2^k` dollars.
  - **Expected winnings:** `∑_{k=1}^∞ (1/2)^k \cdot 2^k = ∑_{k=1}^∞ 1 = ∞`

  In our envelope setup:
  - The unconditional expected value of your envelope is:  
    `\frac{1}{2} E[X] + \frac{1}{2} E[2X] = \frac{1}{2} E[X] + E[X] = \infty`  
    (since `E[X] = ∞`)
  - When you observe finite `Y`, switching gives an expected value `> Y`, but also finite for that specific `Y`.
  - However, since the **unconditional expected value is infinite**, any finite amount `Y` seems "small" compared to the potential gain from switching. This mirrors St. Petersburg: any finite entry fee seems worth paying for infinite expected value.

  ### The Resolution
  - **In finite-mean scenarios:** For some `Y`, switching is good; for others, it's bad. On average, it balances out.  
    (e.g., if `X` is bounded, or has exponential decay)
    
  - **In infinite-mean scenarios:** The expectation calculus breaks down. The "always switch" conclusion is mathematically correct *given the infinite prior*, but:  
    - It leads to a contradiction (you'd switch indefinitely).  
    - It's not a flaw in probability theory; it's a consequence of using ∞ in expectations.  
    - **Real-world interpretation:** No real casino offers infinite-mean games. With actual money, distributions have finite support/mean.

  ### Key Takeaways
  1. The "always switch" paradox **requires** a prior with infinite expected value (`E[X] = ∞`).  
  2. This is **not a new paradox**—it's a variant of the St. Petersburg paradox.  
  3. With finite means, the paradox resolves: Switching is beneficial only for some `Y`.  
  4. The flaw isn't in Bayesian reasoning; it's in applying infinite expectations to finite decisions.  

  This is why Chalmers' example doesn't break probability: It just shows how infinite expectations distort decision-making. For any real-world implementation (with finite cash or bounded distributions), the paradox vanishes.
