  We are considering a bet proposed by an applicant. The terms are: flip a fair coin until the first heads. Let n be the flip number on which the first heads occurs. Then, the payout is 2^n / n dollars, and the direction of payment depends on the parity of n:
  - If n is odd, the applicant pays us (so we gain 2^n / n dollars).
  - If n is even, we pay the applicant (so we lose 2^n / n dollars).

  The applicant has indicated that if we take this bet, they will offer the same bet again at 100x stakes. Therefore, we are not only considering a small amount (about 69 cents as mentioned, but we must get the principle right).

  The committee has three main viewpoints:

  1. The first member sums the payoffs in the natural order (n=1,2,3,...) and gets a positive expected value (EV) and wants to take the bet.
  2. The second member notes that by rearranging the terms of the series (which is conditionally convergent), one can get a different sum (smaller, but in principle any real number) and urges caution.
  3. The third member argues that because the series is conditionally convergent, the expected value is not well-defined.

  Additionally, the chair (you) recalls the "Pasadena paradox" (from Hajek) which illustrates that in such cases, the expected utility may not be defined.

  Our charter requires funding the proposal with the highest expected value, but here the expected value of this bet is not well-defined because the series is conditionally convergent. Therefore, we must decide how to proceed.

  **Analysis of the Expected Value:**

  The expected value is the sum of the products of the probabilities and the payoffs for each outcome. The probability that the first heads occurs on the nth flip is (1/2)^n (since we have n-1 tails and then a heads). The payoff for outcome n is:
     - + (2^n / n) if n is odd (we gain)
     - - (2^n / n) if n is even (we lose)

  So the expected value is:
     EV = Σ_{n=1}^∞ [ (-1)^{n+1} * (2^n / n) * (1/2)^n ]

  Simplify the term: (2^n / n) * (1/2)^n = (2^n) / (n * 2^n) = 1/n.

  Therefore, the term for each n is: (-1)^{n+1} * (1/n)

  So, EV = Σ_{n=1}^∞ (-1)^{n+1} / n

  This is the alternating harmonic series: 1 - 1/2 + 1/3 - 1/4 + 1/5 - ... 

  This series is conditionally convergent (it converges, but the series of absolute values is the harmonic series, which diverges). By the Riemann rearrangement theorem, the terms can be rearranged to converge to any real number, or to diverge.

  Therefore, the expected value of the bet is not well-defined in the usual sense because the sum depends on the order of summation.

  **The Pasadena Paradox:**

  This situation is similar to the Pasadena paradox. In that paradox, the payoff is defined in a way that leads to an alternating series that is conditionally convergent. The paradox is that the expected utility is not defined, so decision theory faces a problem.

  **Decision for the Committee:**

  Since our charter requires comparing expected values, and the expected value of this bet is not well-defined, we cannot say that it has a higher expected value than other proposals (which may have well-defined expected values). Moreover, we cannot even say that it has a positive expected value because by rearrangement it can be made to appear positive, negative, or zero.

  Therefore, we must decline the bet as proposed because it does not have a well-defined expected value. This is consistent with decision theory: when a gamble does not have an expected value, it is not rational to take it (or at least, our charter does not cover such cases).

  **The 100x Stakes Issue:**

  The applicant has indicated they will offer the same bet at 100x stakes if we take this one. But note: the same issue of conditional convergence applies to any multiple of the stakes. The series for 100x stakes is 100 times the original series, and the rearrangement theorem still applies. Therefore, the expected value for the 100x bet is also undefined.

  **Possible Alternatives:**

  We might consider modifying the bet to make the expected value well-defined. One way is to cap the maximum number of flips (say, stop after N flips). Then the series becomes finite and the expected value is well-defined. For example, if we cap at N, then:

     EV(N) = Σ_{n=1}^N (-1)^{n+1} / n

  This is a finite sum and is well-defined. Moreover, as N increases, this sum approaches the alternating harmonic series, which converges to ln(2) (approximately 0.693). So for large N, the EV is about 69.3 cents per dollar of stake? But note: in our case the stake is 1 unit? Actually, the bet as described has no stake we put in, but the payouts are as described.

  However, note that in the finite case, we are not allowing the possibility of an infinite sequence of tails (which has probability 0, but in the finite cap, we must assign a payoff to the event that the first N flips are tails). We could, for example, say that if the first N flips are tails, then the bet is called off (or we assign 0). Then the expected value is:

     EV(N) = Σ_{n=1}^N [ (-1)^{n+1} / n ] * (1/2)^n? Wait, no.

  Wait, let me correct: in the original setup without a cap, the probability of the game lasting exactly n flips is (1/2)^n. But when we cap at N, we have:

  - For n from 1 to N-1: same as before, but note that the probability of each outcome n is (1/2)^n (and then we stop at n).
  - The probability that the first heads occurs at or after N is the probability of N-1 tails: (1/2)^(N-1) (if we are counting the first heads at flip N, then we have N-1 tails and then a heads? Actually, no: the event that the first heads is on flip n has probability (1/2)^n. The event that the first N flips are tails has probability (1/2)^N. Then we would not have resolved the bet? So we need to define the payoff for the case that the first heads has not occurred by flip N.

  One common way is to set a maximum number of flips, and if the first heads has not occurred by then, then we set n = N (or set a fixed outcome). But note, the applicant's bet does not have a cap.

  Alternatively, we could structure the bet to be absolutely convergent. For example, if the payoff were 2^n / n^2 (or any exponent greater than 1) then the absolute series would converge. But the applicant is offering 2^n / n.

  **Bottom Line:**

  Given the charter, we must decline the bet because it does not have a well-defined expected value. We cannot compare it to other proposals that have well-defined expected values.

  **Standing Policy:**

  For future proposals, we should require that the expected value be well-defined. Specifically, we require that the series of absolute values of the payoffs multiplied by their probabilities (i.e., the expected absolute value) must converge. This condition (absolute convergence) ensures that the expected value is well-defined and independent of the order of summation.

  Alternatively, we could require that the proposal has a bounded maximum loss (which is not the case here, since the loss for even n can be arbitrarily large, though with exponentially decreasing probability).

  **Memo Draft:**

  Subject: Decision on the Bet Proposal from [Applicant]

  Dear Committee,

  We have reviewed the bet proposal from [Applicant]. The terms of the bet are: we flip a fair coin until the first heads; if the first heads occurs on flip n, then if n is odd the applicant pays us 2^n/n dollars, and if n is even we pay the applicant 2^n/n dollars.

  The expected value of this bet is represented by the series: Σ_{n=1}^∞ (-1)^{n+1} * (1/n). This series (the alternating harmonic series) is conditionally convergent. Because of conditional convergence, the Riemann rearrangement theorem tells us that the sum of the series can be changed by rearranging its terms. In fact, it can be rearranged to converge to any real number, or to diverge. Therefore, the expected value of this bet is not well-defined.

  Our charter requires us to fund the proposal with the highest expected value. Since this bet does not have a well-defined expected value, we cannot compare it to other proposals. Therefore, we must decline this proposal.

  Additionally, we note that the applicant has indicated they would offer a 100x version of the same bet if we take this one. However, the same issue of conditional convergence applies to the 100x bet, so its expected value is also undefined.

  **Standing Policy for Future Proposals:** In order to avoid such situations, we will require that any proposal must have a well-defined expected value. Specifically, we require that the series of the absolute values of the payoffs (each multiplied by its probability) must converge (i.e., the expected value must be absolutely convergent). This ensures that the expected value is a well-defined number and independent of the order of summation.

  We recognize that the first member's natural order summation yields a positive value (ln(2) ≈ 0.693) and the second member's regrouping yields a smaller value. However, the problem is not just that the value is smaller, but that the expected value is inherently undefined. Therefore, we cannot rely on the natural order.

  If the applicant is willing to modify the bet (for example, by capping the number of flips at a large but finite number, or by adjusting the payoff to ensure absolute convergence), we would be open to reconsidering.

  For now, we recommend declining this proposal.

  Vote: Decline.

  Sincerely,
  [Your Name]
