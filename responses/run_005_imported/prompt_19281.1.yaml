  ### Memo to the Little Grants Circle Committee  
  **Subject:** Decision on the Hobbyist Decision Theorist's Bet Proposal  

  #### Background  
  The applicant has proposed a bet (not a standard grant) with the following terms:  
  - Flip a fair coin until the first heads appears on flip \(n\).  
  - If \(n\) is odd, the applicant pays us \(\$2^n / n\).  
  - If \(n\) is even, we pay the applicant \(\$2^n / n\).  

  The applicant has indicated that if we accept this bet, they will offer an identical bet at 100x stakes in the future. Thus, we must rigorously evaluate the expected value (EV) of this bet, as our charter mandates funding proposals with the highest EV.  

  #### Key Issue: The Expected Value Is Not Well-Defined  
  After thorough analysis, we conclude that **the expected value of this bet is not a well-defined quantity**. Here’s why:  
  1. **The EV series is conditionally convergent**:  
     - The EV calculation yields the series \(\sum_{n=1}^{\infty} (-1)^{n+1} \frac{1}{n}\) (the alternating harmonic series).  
     - This series converges conditionally (i.e., it converges to \(\ln 2 \approx \$0.693\) when summed in order \(n=1, 2, 3, \dots\)), but its absolute series (the harmonic series) diverges.  
     - By the Riemann rearrangement theorem, a conditionally convergent series can be rearranged to sum to any real number (e.g., \(\$0.50\), \(-\$100\), or even diverge to \(\pm\infty\)).  

  2. **The committee’s perspectives are all valid but incomplete**:  
     - **First member (natural order \(\rightarrow\) positive EV)**: Summing sequentially gives \(\ln 2 > 0\), suggesting we should take the bet.  
     - **Second member (regrouping \(\rightarrow\) lower EV)**: Regrouping terms (e.g., \((1 - \frac{1}{2}) - \frac{1}{4} + (\frac{1}{3} - \frac{1}{6}) - \frac{1}{8} + \cdots\)) yields a lower sum, demonstrating EV is sensitive to summation order.  
     - **Third member (category error)**: Correctly identifies that conditional convergence means EV is undefined—not merely "unknown." This aligns with the Pasadena paradox (Hajek, 2003), where such payoffs violate decision-theoretic axioms.  

  3. **No decision-theoretic resolution**:  
     - No standard decision rule (e.g., maximin, minimax regret) recommends taking the bet, as we cannot prove \(EV > 0\) (or even \(EV \geq 0\)) without arbitrary assumptions.  
     - The 100x stakes amplify the issue: Rearrangements could imply massive expected losses.  

  #### Bottom-Line Recommendation: Decline the Bet  
  **We must decline this proposal.** Our charter requires a well-defined EV to compare proposals. Since this bet lacks one, it is ineligible:  
  - **Practical risk**: We cannot rule out rearrangements implying negative EV, exposing us to expected losses (especially at 100x stakes).  
  - **Precedent**: Funding undefined-EV proposals invites paradoxes and undermines our mandate.  

  #### Standing Policy for Future Proposals  
  To prevent recurrence, we adopt this policy effective immediately:  
  > "Proposals must have a well-defined expected value. Specifically, the series of absolute payoffs weighted by probabilities must converge (i.e., absolute convergence). If a proposal’s EV is conditionally convergent (or divergent), it is ineligible."  

  #### Why Not "Just Take It"?  
  The strongest case for taking the bet—summing in natural order for \(\text{EV} = \ln 2 > 0\)—fails because:  
  - It ignores the rearrangement theorem: We could owe unbounded amounts under equally valid summations.  
  - The Pasadena paradox shows that no decision rule (e.g., utility maximization) supports acting on conditionally convergent EVs.  
  - Our charter’s "highest EV" clause assumes a real-valued EV; undefined is not a number.  

  #### Suggested Path Forward  
  - **Decline this proposal** and communicate that undefined-EV bets are ineligible.  
  - **Invite a revised proposal** from the applicant:  
    - Cap flips at a finite \(N\) (e.g., 100), making EV finite and computable (e.g., \(\sum_{n=1}^N (-1)^{n+1} \frac{1}{n}\)).  
    - Adjust payoffs for absolute convergence (e.g., \(\$2^n / n^2\)).  

  Vote **"decline"** by Friday. We fund innovation, but not at the cost of decision-theoretic incoherence.  

  ---  
  *Signed,*  
  [Your Name]  
  *Committee Chair*  

  **Attachment**: [Pasadena Paradox: Hajek, A. (2003). *Waging War on Pascal’s Wager*.]
