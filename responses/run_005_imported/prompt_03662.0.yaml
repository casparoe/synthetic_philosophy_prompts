answer: |-
  That's a sharp question cutting to the heart of Nagarjuna's project. While it *seems* like he's tossing out the Law of Non-Contradiction (LNC), a closer look reveals a more sophisticated and rigorously logical approach that *uses* apparent contradictions strategically, rather than abandoning logic altogether. Here's a breakdown of why philosophy departments take him seriously:

  1.  **The Tetralemma is Primarily Deconstructive, Not Affirmative:** Nagarjuna doesn't use the tetralemma to *assert* that all four positions are simultaneously true for any given object *in the same respect and at the same time* (which would blatantly violate LNC). Instead, he uses it as a powerful tool of **reductio ad absurdum**.
      *   **The Goal:** To exhaustively demonstrate that *every possible way* we try to conceptualize the inherent existence or ultimate nature of phenomena leads to absurdity, contradiction, or incoherence. He systematically applies it to fundamental concepts like causation, self, time, motion, and even nirvana itself.
      *   **The Outcome:** The point isn't that "both" or "neither" are *true states* things can *possess*, but that *any attempt to pin down inherent existence using these logical categories fails*. The conclusion is the *emptiness* of inherent existence (svabhava-shunyata) – the absence of any findable essence that satisfies these logical tests.

  2.  **Challenging the *Scope* of LNC, Not Its Validity in Conventional Use:** Nagarjuna isn't arguing that LNC doesn't hold for everyday, conventional reality (vyavahara). We navigate the world perfectly well saying "this is a pot, not a cloth." His target is the *misapplication* of LNC (and other logical laws) to ultimate reality (paramartha-satya) – specifically, to the search for inherently existing essences or substances.
      *   **The Problem:** When we assume phenomena possess inherent existence, our logical categories (like "exists," "does not exist," "both," "neither") inevitably lead to contradictions *because inherent existence itself is incoherent*.
      *   **The Logic Reveals Emptiness:** The contradictions arising when we try to apply these categories to inherent existence *are the evidence* for emptiness. The tetralemma exposes the limits of conceptual thought when pushed to its extremes regarding ultimate reality.

  3.  **Emptiness is Not a "Both/Neither" State:** Emptiness (shunyata) itself is *not* the "both" or "neither" option. It is the *realization* that phenomena are devoid of the inherent existence that would make them susceptible to being definitively captured by *any* of the four positions. Emptiness is the *failure* of all four positions to apply ultimately. It's the insight into dependent origination (pratityasamutpada) – that things arise only in dependence on conditions, not from their own inherent nature.

  4.  **Rigorous Dialectical Method:** Nagarjuna's *Mulamadhyamakakarika* is a masterpiece of structured, logical argumentation. He:
      *   Clearly states the opponent's position.
      *   Uses logical inference (often reductio) to show the internal contradictions or absurd consequences of that position.
      *   Systematically applies this to every conceivable alternative.
      *   Arrives at a consistent, albeit negative, conclusion (emptiness).
      *   Explicitly addresses potential counter-arguments. This is the hallmark of rigorous philosophical argument, not mystical poetry.

  5.  **Distinction Between Conventional & Ultimate Truth (Dve Satya):** This is crucial. Nagarjuna rigorously maintains two levels of truth:
      *   **Samvriti-satya (Conventional/Veiled Truth):** The level of everyday experience, language, and logic (including LNC). Here, the tetralemma's "both" and "neither" are generally nonsensical or errors.
      *   **Paramartha-satya (Ultimate Truth):** The level of emptiness. Here, *all* four positions of the tetralemma, when applied to inherent existence, fail. Logic here functions negatively, to deconstruct inherent existence, not to affirm positive theses.
      *   **Why it Matters:** This framework allows him to *use* conventional logic rigorously *within* the conventional realm to *deconstruct* the misapplication of logic to the ultimate realm. He doesn't discard logic; he defines its proper domain and shows its limits.

  **Why Philosophy Departments Teach Him as a Logician:**

  1.  **Methodological Rigor:** His systematic use of reductio ad absurdum, analysis of concepts, and structured argumentation aligns with core philosophical methodology.
  2.  **Profound Challenge to Foundational Assumptions:** He forces a critical examination of the most basic assumptions of ontology, epistemology, and logic itself – what does "existence" mean? What are the limits of conceptual thought? This is deeply philosophical.
  3.  **Sophisticated Meta-Logical Stance:** He isn't *ignoring* logic; he's offering a sophisticated critique of its scope and application when dealing with ultimate reality. He's exploring the *preconditions* for logic to function coherently (i.e., dependent origination, not inherent existence).
  4.  **Influence on Logic:** His work prefigures and resonates with developments in modern logic like paraconsistent logic (which allows for handling contradictions without explosion, though Nagarjuna isn't exactly doing this) and dialetheism (the view that some contradictions are true, a more contested parallel). Studying him enriches the history and scope of logical thought.
  5.  **Clarity of Purpose:** While the *conclusion* (emptiness) has profound soteriological implications (liberation from suffering), the *path* to that conclusion is rigorously argumentative and logical. The logic serves the soteriological goal, but the logic itself is sound within its framework.

  **In short:** Nagarjuna isn't "chucking out" the Law of Non-Contradiction for everyday use. He's using the tetralemma as a devastatingly logical tool to demonstrate that *if* we assume inherent existence, then *all* possible logical positions about it lead to contradiction or incoherence. Therefore, inherent existence must be empty. The "both" and "neither" options aren't endorsed as valid states; they are exposed as equally untenable paths leading to the same negative conclusion. His rigor lies in this exhaustive deconstruction using the tools of logic itself, making him a profoundly challenging and respected figure in philosophical logic, not merely a mystic. He forces logic to confront its own foundations and limitations.
