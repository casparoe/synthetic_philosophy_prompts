  Hey, working on a piece about buddhist logic and could use a sanity check. Nagarjuna's tetralemma says any claim can be true, false, both, or neither, and Madhyamaka treats the 'both' and 'neither' options as legitimate outcomes rather than errors to be avoided. So doesn't that mean the whole 'emptiness' argument is founded on chucking out the law of non-contradiction? And if thats the foundation, why do philosophy departments still teach Nagarjuna as a rigorous logician instead of filing him under mysticism or poetry?
