answer: |-
  You've put your finger on a genuinely fascinating and perplexing aspect of Turing's paper! Your concern is entirely valid and shared by many philosophers and scientists. Let's break down why Turing included that section, why it's problematic, and whether it *actually* undermines his core argument:

  1.  **Turing's Claim & Context:**
      *   Turing explicitly states: *"The statistical evidence, at least for telepathy, is overwhelming."* He then worries that a telepathic participant might "give the show away" to the interrogator, or that psycho-kinesis might influence the machine's answers, thus invalidating the test.
      *   This reflects the *zeitgeist* of the early 1950s. Parapsychology (ESP, PK) was taken more seriously in some academic circles then than it is now. Major institutions (like Duke with J.B. Rhine) were conducting experiments. Turing, brilliant but often unconventional and playful, seems to have been genuinely intrigued or at least felt compelled to address potential objections, even fringe ones.

  2.  **Does it Undermine the Core Argument?**
      *   **Technically, Yes (in a narrow sense):** As you point out, *if* we take the ESP objection seriously, then the Imitation Game setup *is* flawed. The test relies on communication being restricted to the specified channel (typed questions/answers). If telepathy bypasses that channel, the test's controls are broken. Turing himself admits this is a "disaster" for his proposal.
      *   **But Practically & Philosophically, No:** This is the crucial point. The ESP section is widely regarded as a **tangential digression** or even a **rhetorical flourish**, *not* a necessary premise for the core argument. Here's why:
          *   **The Core Test Doesn't Rely on ESP:** The fundamental proposal – can a machine imitate a human well enough in conversation to fool an interrogator? – stands completely independently of ESP. It's an operational definition of "thinking" based on observable behavior.
          *   **ESP is Presented as an *Obstacle*, not a Foundation:** Turing frames ESP as a *problem* for his test, not a prerequisite. He's trying to *defend* his test against a potential (if, to us, bizarre) criticism. He's saying, "Even if you believe *this* weird thing, my test *still* works (or could be modified)!" He doesn't say the test *only* works if ESP is real.
          *   **The Argument Proceeds Without It:** The vast bulk of the paper – the objections and replies, the discussion of learning machines, the future predictions – makes no further reference to ESP. The core philosophical argument for machine intelligence based on the imitation test functions perfectly well without it.
          *   **Turing's Other Assumptions are Equally Questionable:** He makes other debatable assumptions (e.g., that chess is a good universal test of intelligence, that digital computation is the right model for mind) that are far more central to his argument than ESP. Critiquing those is more philosophically fruitful than fixating on the ESP tangent.

  3.  **Why Anthologies Cut It:**
      *   **Distraction:** It's a bizarre non-sequitur in a paper otherwise focused on computation, intelligence, and philosophy. It distracts readers from the groundbreaking core ideas.
      *   **Embarrassment:** To modern scientific sensibilities, it makes Turing seem credulous or unserious on this point, potentially undermining the perceived rigor of the whole paper for contemporary readers.
      *   **Irrelevance:** As parapsychology lost mainstream scientific credibility, the section became seen as historically curious but philosophically irrelevant to Turing's lasting contribution (the test, the computational theory of mind).
      *   **Focus:** Editors want to highlight the enduringly relevant parts: the definition of the test, the rebuttals to objections like the Theological, "Heads in the Sand," Mathematical, Consciousness, and Disability objections, and the vision of learning machines.

  4.  **Your Chemist's Intuition is Spot On:**
      *   You correctly identify the logical flaw: *If* ESP is required for the test to be valid *in the specific way Turing worries about*, then for non-believers, that specific worry dissolves, but the test's vulnerability *as framed* remains. However, the key is that the test's vulnerability to ESP is *not* inherent to the core concept, only to the specific controlled setup he proposes to rule out cheating via normal sensory channels.
      *   Turing's inclusion of it *does* weaken the paper's perceived scientific rigor for modern readers. It feels jarringly out of place.

  **Conclusion:**

  While Turing's inclusion of the ESP section is strange and problematic, it **does not fatally undermine his core argument for the Imitation Game as a test for machine intelligence.** The core test stands as an operational definition based purely on observable linguistic behavior. The ESP worry is a contingent, specific (and now largely discredited) objection to the *controlled setup* of his proposed test, not a foundational premise of the test *itself*. The argument "collapses" only if one insists that the *specific controlled conditions* Turing outlined (designed to block normal sensory clues) are inseparable from the *core idea* of judging intelligence through conversation. Most philosophers and AI researchers separate the two, valuing the core idea while recognizing the practical limitations of any specific test setup.

  The anthologies cut it because it's an irrelevant historical curiosity that distracts from the paper's profound and lasting contributions. Your skepticism as a scientist is completely justified, but rest assured, the enduring power of Turing's central idea doesn't hinge on the reality of telepathy! Enjoy the rest of your philosophical deep dive – Turing's replies to the other objections are where the real meat of the argument lies.
