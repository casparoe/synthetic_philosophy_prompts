  We are ranking explanations for why we observe trading volume despite the no-trade theorem.
   The no-trade theorem relies on: common priors, rationality (Bayesian updating), common knowledge of rationality, and trade being purely information-driven (no other motives).
   The puzzle: in reality, markets have huge volume, so which assumptions break?

   Proposed resolutions to consider (as per the query and common literature):
   1. Heterogeneous priors: agents start with different beliefs, so they can agree to trade without updating away the edge.
   2. Noise traders: traders who trade for non-informational reasons (e.g., liquidity, exogenous shocks) and who are not fully rational.
   3. Liquidity/hedging demand: traders need to adjust their portfolios for reasons unrelated to information (e.g., needing cash, rebalancing).
   4. Overconfidence: traders overestimate the precision of their private information.
   5. Failures of common knowledge of rationality: traders may not know that others are rational, or may doubt it.
   6. Costly information acquisition (Grossman-Stiglitz): since information is costly, not everyone has it, and prices don't fully reveal all information, so there is incentive to trade on information.
   7. Other? The query also mentions "whatever else", so we can add:
      - Behavioral biases (beyond overconfidence): e.g., disposition effect, herding.
      - Differences in risk aversion: even with common beliefs, if risk aversion differs, trade can occur for risk-sharing.
      - New information arriving over time: the market is dynamic, so as new information arrives, traders update and trade.

   However, note that the no-trade theorem applies to a static setting. In dynamic settings, trade can occur as new information arrives and agents adjust.

   But the question is about ongoing trading volume. We must rank by "real explanatory weight" for actual market volume.

   Let's think about real-world markets:
    - A huge portion of trading volume is driven by institutional investors, high-frequency trading, retail investors, etc.
