     - Noise traders: There is substantial evidence that a large fraction of market volume comes from non-professional traders who trade for exogenous reasons (e.g., retail investors, algorithmic trading that is not information-based, high-frequency trading for market-making). Also, behavioral biases lead to trading that isn't purely information-driven.

