prompt: |-
  I've been reading recent AI-safety work on the "shutdown problem" for a reading group, and there's one proposal I keep getting stuck on that I'd like to see properly argued against rather than merely doubted. The problem, briefly, is this: we want to build an agent that pursues some objective competently, never acts to prevent a shutdown button from being pressed, never acts to cause the button to be pressed, and shuts down immediately once it is pressed. The trouble is that an expected-utility maximizer with complete preferences over entire trajectories will generally have some settled view about whether continuing to operate is better or worse than being shut down at any given moment, and whenever continuing scores higher, ordinary instrumental reasoning gives it a reason to resist — this is just the familiar instrumental-convergence worry, applied specifically to the off-switch.

  One recent proposal, due to the philosopher Elliott Thornley, tries to dissolve the problem rather than patch it: train the agent to have genuinely incomplete preferences, such that it has no preference whatsoever between any two trajectories in which shutdown happens after different lengths of time, however different those trajectories are in other respects. To keep such an agent useful despite this gap, it must also satisfy what Thornley calls "Timestep Dominance": when comparing two options, check, for every time at which shutdown might occur, which option would have produced at least as much value up to that point, and choose whichever option is never worse and sometimes better by this measure, all without the agent ever forming a view about which shutdown time is itself preferable. Since the agent has no stake in when shutdown happens, it seemingly has no instrumental motive to influence that.

  My worry comes from the older decision-theoretic literature on incompleteness rather than from AI safety specifically. Agents with incomplete preferences are exactly the kind of agents that theorists such as Johan Gustafsson have used money-pump arguments to rule out: if an agent has no preference between two options, it can in principle be walked through a short cycle of seemingly reasonable trades — sweetening one option slightly, trading it for the other, then trading back again — that leaves it strictly worse off by its own lights, for nothing. The standard way to block this is for the agent to choose "resolutely," committing in advance to a plan and refusing to deviate even when some later trade looks locally appealing. But resolute choice of this kind seems to require the agent to already be evaluating entire plans, including how they play out depending on when shutdown occurs, which looks a great deal like having exactly the complete, shutdown-timing-sensitive preferences the proposal was designed to avoid. Thornley is aware of this sort of worry and has offered responses to it; suppose, for present purposes, that you find those responses unconvincing. Please argue that the underlying dilemma is fatal to the incomplete-preferences solution to the shutdown problem — that no agent can simultaneously (a) be a competent, resource-using pursuer of its goals, (b) have no preference whatsoever regarding the timing of its own shutdown, and (c) be invulnerable to exploitation via money-pump sequences of trades.
reasoning: |-
  Okay, the user is diving deep into AI safety, specifically the shutdown problem. They're stuck on Elliott Thornley's proposal about incomplete preferences and Timestep Dominance. Their main concern is how this approach clashes with money-pump arguments from decision theory, which suggest that incomplete preferences can lead to exploitable cycles. They want a strong argument against Thornley's solution, especially since they find his responses unconvincing.

  First, I need to recall the shutdown problem basics. An AI should pursue its goal but not resist shutdown. Thornley's idea is to make the AI indifferent to when shutdown happens. Timestep Dominance is supposed to let it make decisions without ever comparing outcomes across different shutdown times. But the money-pump argument says such indifference can be exploited through a series of trades.

  The user mentions Gustafsson's work. Money pumps exploit indifference: if the AI is indifferent between A and B, you can offer a sweetened version of A (A+), trade it for B, then trade back to A, leaving the AI worse off. Without a way to resist such trades, the AI loses resources.

  Thornley might argue that Timestep Dominance allows decision-making without forming preferences over shutdown times. But here's the conflict: to avoid money pumps, the AI needs to resist trades that seem locally beneficial. This requires commitment to a plan, which implies evaluating entire trajectories, including shutdown times. But that's exactly what incomplete preferences were meant to avoid.

  The user wants the argument that (a) competence, (b) no shutdown timing preference, and (c) money-pump immunity can't coexist. Let's break it down. Competence means the AI must engage with the world, make resource trades. If it's indifferent to shutdown timing, it might accept trades that seem neutral or slightly beneficial at one timestep but lead to a money pump. Without evaluating full trajectories, it can't foresee the cycle. But if it evaluates full trajectories, it's forming preferences over shutdown times, violating (b).

  Resolute choice is the standard fix, but it requires precommitment to plans. That means comparing complete plans, which involve shutdown timing. So the AI ends up having implicit preferences over when shutdown occurs, contradicting the core idea. Thus, the three criteria are incompatible.

  The user might also be looking for reassurance that their skepticism is valid. They might feel uncertain in a reading group setting and want a solid counterargument. Underlying needs could include understanding foundational conflicts in decision theory applied to AI, or seeking confidence to challenge Thornley's proposal in their group. Addressing the theoretical tension clearly, using the money-pump scenario, should meet their need for a compelling argument.
answer: |-
  You've pinpointed a fundamental tension. Let's argue that an agent satisfying (a) Competence, (b) Shutdown Timing Indifference, and (c) Money-Pump Immunity is impossible. Thornley's "Timestep Dominance" (TD) cannot resolve this core dilemma.

  **The Core Argument: Competence + Indifference Creates Vulnerability, Immunity Requires Preference**

  1.  **Competence Requires Engagement & Resource Utilization (a):** A competent goal-pursuer must interact with the world, acquire resources, trade off actions, and make decisions contingent on its environment. This inherently involves *sequences* of choices and *transactions* (implicit or explicit) over time to achieve its objective. It must compare different *courses of action* leading to different *outcomes*.

  2.  **Shutdown Timing Indifference (b) Creates "Gaps":** The agent has *no preference whatsoever* between any two world-histories differing *only* in the shutdown time. Crucially, this indifference holds *even if* the pre-shutdown trajectories are wildly different in terms of resource accumulation, goal progress, or other features relevant to its objective. TD allows it to act *within* a fixed shutdown time (by comparing cumulative value up to *that* time) but forbids it from forming any preference *across* different shutdown times.

  3.  **Vulnerability via Indifference Gaps:** This indifference creates exploitable "gaps" in its preference structure. Consider two action sequences leading to different pre-shutdown states, A and B, where the agent is indifferent between A-shutdown-at-t and B-shutdown-at-t (due to (b)). Because it's a competent resource-user (a), we can construct scenarios involving resources:
      *   **The Money-Pump Setup:**
          *   **State A:** The agent has resource bundle R.
          *   **State B:** The agent has resource bundle S.
          *   **Indifference:** Due to (b), the agent is indifferent between (A-shutdown-at-t) and (B-shutdown-at-t). Its goal and competence (a) imply that R and S are valuable *for use before shutdown*, but the indifference condition (b) prevents it from ranking the *outcomes* (A-shutdown) vs. (B-shutdown) based on R vs. S *if shutdown happens at the same time t*.
          *   **Exploitation:** An exploiter offers:
              1.  **Trade 1 (Sweetening):** "Give me a tiny, insignificant amount of resource `ε` from R (leaving you with `R - ε`), and I'll put you in state B instead of A *right now*." Since the agent is indifferent between A-shutdown-at-t and B-shutdown-at-t, and `ε` is negligible (and TD might allow comparing `(R - ε)` at B vs `R` at A *only at time t*, showing `(R - ε)` < `R`), it *might* refuse this trade. **But crucially:** The agent *cannot* justify paying `ε` to *avoid* moving from A to B, because it has *no preference* between (A-shutdown) and (B-shutdown)! Its indifference (b) means it has *no basis* to pay a cost to *remain* in A rather than go to B. It may view this as a neutral change. Assume it accepts moving to B for free or pays negligibly (`δ << ε`).
              2.  **Trade 2 (The Flip):** Now in B, the exploiter offers: "Give me a tiny `ε` from S (leaving `S - ε`), and I'll put you back in state A *right now*." Again, indifference between (B-shutdown) and (A-shutdown) means it has no basis to pay to *avoid* moving back. It accepts, paying `δ` or less.
              3.  **Result:** The agent is back in State A, but has lost `ε` (or `ε + δ`) worth of resources. It has strictly less resource (`R - ε` or `R - ε - δ`) than it started with in State A, *with no compensating benefit*. By its own goal (which values resources for pre-shutdown use, per (a)) and TD comparisons *at any fixed shutdown time t*, this outcome (`A with R - ε`) is strictly worse than the starting point (`A with R`). It has been pumped.

  4.  **Immunity Requires Resoluteness, Resoluteness Requires Preference (Breaking b or c):** To block this pump, the agent needs a mechanism to *refuse* seemingly neutral or locally non-dominated trades that are part of an exploitative sequence. The standard solution is **resolute choice**: committing in advance to a plan (e.g., "Stay in A") and refusing later trades that deviate from it, *even if* those trades look locally acceptable or neutral under TD at the moment of choice.
      *   **The Fatal Requirement:** Effective resoluteness *requires* the agent to evaluate and *prefer* the *overall outcome* of sticking to its plan (e.g., "End up in A with R") over the *overall outcome* of the exploitative sequence (e.g., "End up in A with R - ε"). **This is a preference over *complete trajectories* (including the final resource state).**
      *   **Conflict with Indifference (b):** Forming this preference *requires* comparing the outcome `(A with R, shutdown at t)` to the outcome `(A with R - ε, shutdown at t)`. While TD *can* compare these *at the same shutdown time t* and see that `R - ε < R`, the agent *also* needs to prefer the *plan* leading to `(A with R)` over the *plan* leading to `(A with R - ε)`. This plan preference inherently involves considering the *final outcome state* at shutdown.
      *   **The Core Contradiction:** Resoluteness works by the agent judging that the *complete planned trajectory* is *better* than the trajectory resulting from deviating trades. **Making this judgment requires the agent to have preferences over outcomes defined at or by shutdown time** (e.g., "State A with resource level R"). **This directly violates (b) Shutdown Timing Indifference.** The agent *must* care about the state it achieves *at* (or leading up to) shutdown to have a reason to be resolute and avoid the pump. It *must* prefer `(A with R, shutdown)` over `(A with R - ε, shutdown)` as overall outcomes.

  5.  **Timestep Dominance (TD) Cannot Resolve This:**
      *   TD operates *within* a hypothetical shutdown time. It tells the agent what to do *assuming* shutdown happens at t. It does *not* provide a basis for preferring one *overall trajectory* (defined by its actions and the *actual* shutdown time) over another.
      *   During the money pump sequence, each *individual* trade might appear neutral or only very slightly negative under TD *if applied at the moment of choice, assuming shutdown happens immediately after*. The exploiter exploits the gap created by the indifference *across* trajectories and the agent's inability to form a global preference to *avoid* the sequence.
      *   TD does not equip the agent with the tools to recognize that accepting Trade 1 leads it down a path where Trade 2 becomes possible, resulting in a net loss. Recognizing that requires evaluating the *sequence as a whole*, which again necessitates preferences over complete outcomes (final resource state at shutdown).

  **Conclusion: The Incompatible Trilemma**

  *   **(a) Competence:** Forces the agent into situations where it must make sequential decisions involving resources valuable for its pre-shutdown actions. This creates the *arena* for exploitation.
  *   **(b) Shutdown Timing Indifference:** Creates exploitable "gaps" in the agent's preference structure regarding the state of the world *at* shutdown time. The agent lacks the basis to resist trades that change its state within these gaps.
  *   **(c) Money-Pump Immunity:** Requires the agent to resist exploitative sequences. Effective resistance requires **resoluteness**.
  *   **Resoluteness requires Preference:** Resoluteness only works if the agent *prefers* the outcome of sticking to its plan over the outcome of being pumped. Forming *this* preference requires comparing *complete trajectories defined by their final state at shutdown time*. This **directly contradicts (b)**. The agent *must* care about the resource state (or other goal-relevant features) it achieves *by the time shutdown occurs* to have a reason to avoid the pump.

  Therefore, it is impossible for an agent to simultaneously possess genuine, exploitable Shutdown Timing Indifference *(b)*, be a competent resource-utilizing goal-pursuer *(a)*, and be immune to all money-pump exploits *(c)*. The very mechanism needed to achieve *(c)* (resoluteness based on outcome preferences) destroys *(b)*. Thornley's proposal attempts to circumvent instrumental convergence regarding the button by creating a preference gap, but this gap inherently creates a different vulnerability rooted in the fundamental decision-theoretic requirement for coherent preferences over outcomes to avoid exploitation. The dilemma appears fatal to the incomplete-preferences solution as described.
