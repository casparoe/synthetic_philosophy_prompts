  Regarding the adversarial point, the user suspects they might be misunderstanding the term. Indeed, Manheim and Garrabrant likely use "adversarial" functionally (system behavior that defeats the proxy) rather than requiring conscious intent. This functional view would include RL agents finding loopholes through exploration. 

