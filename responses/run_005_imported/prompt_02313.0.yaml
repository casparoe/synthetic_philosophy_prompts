  I need to break down Augustine's reasoning. His key point is about preventing the inquisitor from inferring the location. In the first approach, by stating upfront that you know but won't tell, you haven't revealed anything about the specific location. The inquisitor might be diverted to pressuring you instead of searching. Whereas if you refuse to answer a specific question, like "Is he in the basement?", your silence or refusal implies he is there. That's the crux: context makes refusal to answer a particular question equivalent to affirmation.

  Augustine is concerned with pragmatics—how language works in real situations. When asked a direct yes/no question, not answering is often seen as a 'no' if the truth is harmless, but a 'yes' if denial would be expected if false. So in the fugitive scenario, refusing to answer "Is he in the basement?" suggests he is there, because if he weren't, you'd just say no. That's the pragmatic implication Augustine wants to avoid.

