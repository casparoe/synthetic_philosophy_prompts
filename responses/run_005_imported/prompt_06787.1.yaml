prompt: |-
  I'm taking a bioethics seminar on death, dying, and organ transplantation this term, and for our capstone project I'm recording a podcast-style interview with a bioethicist who has built her career defending the whole-brain criterion of death. Her standard move whenever Alan Shewmon's cases of prolonged, ventilator-supported somatic survival after a whole-brain-death diagnosis come up is to insist that what's doing the integrating in those bodies is the machinery, not the organism. Please draft eight interview questions that make that move progressively harder to sustain: I want at least one question asking why the same "artificial" label shouldn't apply to any ventilator-dependent patient we'd otherwise call alive, one on whether the President's Council on Bioethics' 2008 retreat from "integrative unity" language to talk of the organism's need to engage the world to sustain itself was itself a concession that the original rationale had failed, and one on why the short, variable waiting periods used in donation-after-circulatory-death protocols don't quietly redefine "irreversible" loss of circulation as merely "permanent" loss. End on a question about what finding, short of a revived corpse, would actually count as evidence against the whole-brain criterion. For each question, add a follow-up keyed to the deflection she's most likely to reach for.
