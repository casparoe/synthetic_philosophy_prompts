  For the ventilator question: The core tension is that if external support invalidates integration, then *all* ICU patients on vents might be "dead." The follow-up should preempt the deflection that brain-dead bodies lack "intrinsic" integration—Shewmon’s cases show endogenous functions (e.g., wound healing) persisting without neural input.  

  For the President’s Council pivot: The 2008 shift from "integrative unity" to "engagement with the environment" is a huge concession. The follow-up must block the retreat to "it’s just a refinement!" by highlighting how the original rationale *required* neural mediation for integration.  

  On DCD protocols: The 2-5 min waiting period is functionally treating circulatory arrest as *permanent* (no spontaneous return expected), not *irreversible* (cannot be restarted). The follow-up should challenge the "dead donor rule" hypocrisy: if irreversibility is fluid here, why not for brain death?  

  Endgame question: If somatic survival without a brain for years isn’t evidence against brain death, what *would* be? The bioethicist might say "only restored brain function," but that’s circular. The follow-up should press whether any somatic evidence could matter.  

