  Crucially, they must *almost* agree by the end, exposing that the core dispute is about what "real" means for representations. Leo might concede features are "real as computational primitives," while Maya admits they're "not atoms but dynamical patterns." The resolution should mirror the user's implied question: Is this about ontology or useful description? 

