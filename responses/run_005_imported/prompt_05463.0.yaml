  - How emerging tech like drones affects symmetrical obligations 
  - Whether soldiers have a duty to investigate their war's justice 
  - The asymmetry in post-war accountability 
  - How voluntary enlistment interacts with collective responsibility

  I'll structure each question to:
  1. Present the challenge clearly
  2. Reference her specific positions
  3. Include a sharp follow-up
  4. Maintain academic rigor while keeping it accessible

  The tone should be respectful but incisive - this philosopher has spent a decade defending this position, so the questions need to meet her level while creating productive tension. The follow-ups are crucial because they prevent easy dismissals.

  For the voluntary enlistment question, I'm considering citing her "Journal of Ethics" piece where she discusses collective responsibility. That shows I've done my homework. The drone warfare question could reference her NATO report footnote to ground it in her actual work.

  The accountability question is particularly important - if her symmetry claim holds, why do we intuitively judge soldiers from unjust sides more harshly after wars? That creates a nice tension with common moral intuitions.

  I'll avoid "gotcha" questions. Each should open genuine philosophical exploration while pressing the weak points. The goal is to have her articulate defenses that reveal whether the position holds under scrutiny, not to trap her.
answer: |-
  Here are eight incisive questions designed to pressure the core tensions in her Walzerian position, plus targeted follow-ups anticipating common defenses. Each question forces engagement with McMahan's critiques or internal inconsistencies in the symmetry thesis:

  1.  **The Self-Defense Analogy & Liability:** "McMahan argues that the fundamental moral principle justifying defensive force is liability based on *responsibility for an unjust threat*. In a bar fight, someone initiating unjust aggression is liable to defensive harm, while the defender isn't. Why does this core principle of individual morality, which seems to ground our intuitions about permissible killing, *not* apply structurally within the context of war between combatants? Why isn't the soldier fighting for an unjust cause liable *simply by virtue of posing that unjust threat*, even if he follows *in bello* rules?"
      *   *Likely Response/Focus:* Appeals to war's collective nature, epistemic limitations for soldiers, functional role, or the separation of *jus ad bellum* and *jus in bello*.
      *   **Follow-Up:** "If the *source* of the justification for killing (defending against an unjust threat) is the same in both contexts, how can the *moral status* of the person killed (liable vs. non-liable) flip based *only* on the institutional context of war? Doesn't that make morality oddly context-dependent in a way that privileges the institution of war over fundamental moral principles?"

  2.  **Convention vs. Deep Morality:** "You argue combatants on both sides must be treated as moral equals *in bello*. Is the basis for this equality a claim about their *intrinsic, individual moral status* (i.e., neither is morally liable to attack simply for fighting in an unjust war), or is it a *contingent, rule-consequentialist claim* that adhering to this convention of symmetry minimizes overall suffering and preserves humanitarian constraints in war, *despite* the underlying *ad bellum* injustice?"
      *   *Likely Response:* May emphasize the practical necessity and good consequences of the symmetry convention.
      *   **Follow-Up:** "If it's primarily the latter – a contingent convention for minimizing harm – doesn't this concede McMahan's key point about the *deep moral asymmetry*? Aren't you agreeing that, fundamentally, the soldier fighting unjustly *is* doing something morally worse, but we pragmatically ignore this for systemic reasons? Doesn't this make 'moral equality' a potentially misleading label for a purely functional rule?"

  3.  **The Epistemic Gap & Culpability: Conscript vs. Volunteer:** "Does your view genuinely hold that a conscript forcibly drafted and fed blatant lies about their nation's cause, who follows *in bello* rules, has the *exact same moral status* as a combatant who *volunteered*, harbors private, well-founded doubts about the war's justice, yet chooses to deploy and fight anyway – provided both follow *in bello* rules? Does 'moral equality' erase any distinction based on knowledge, choice, or contribution to the *ad bellum* wrong?"
      *   *Likely Response:* May stress the functional role focus, the difficulty of assessing individual culpability in real-time, or that *in bello* conduct is the relevant sphere for equality.
      *   **Follow-Up:** "If we accept *any* distinction in culpability based on knowledge/choice in other moral domains (e.g., accomplices), why is war uniquely impervious to such distinctions at the individual combatant level? Doesn't insisting on strict equality here risk *absolving* the culpable volunteer of a significant part of their moral responsibility for participating in an unjust project?"

  4.  **Deconstructing "Combatant":** "McMahan and others argue the category 'combatant' is a morally arbitrary legal fiction masking vastly different levels of *individual contribution, responsibility, and threat*. A cook in a rear base poses a radically different threat than a frontline infantryman actively hunting enemy soldiers. If there's no morally coherent category of 'combatant' as a uniform class, doesn't the question of their 'moral equality' become meaningless? Isn't the relevant question always about the *specific individual's* liability based on their *specific actions and role* in the unjust threat?"
      *   *Likely Response:* Defends the practical necessity and clarity of the combatant/non-combatant distinction, emphasizing function within a military structure.
      *   **Follow-Up:** "But doesn't the *in bello* proportionality principle *itself* already acknowledge degrees of threat and contribution *within* the combatant category (e.g., targeting a general vs. a private)? If we can make these distinctions for proportionality, why is it suddenly impossible or irrelevant when assessing the *permissibility* of targeting them in the first place, given the *ad bellum* context?"

  5.  **The "Putative Just Cause" Problem:** "Soldiers on the unjust side often sincerely *believe* their cause is just. Does your defense of moral equality rely heavily on this putative justification residing in the soldier's mind? If so, what about the soldier who *lacks* this belief but fights anyway out of loyalty, careerism, or fear? Is *he* still a moral equal? Conversely, if the soldier's belief is irrelevant, and equality stems purely from their role, doesn't that further sever the link between *in bello* equality and actual moral justification?"
      *   *Likely Response:* May emphasize role-based status or the systemic function over individual belief.
      *   **Follow-Up:** "If the soldier's sincere belief *is* crucial, how does your view avoid collapsing into subjectivism, where the moral permissibility of killing them depends entirely on their internal mental state, regardless of objective facts? If it's *not* crucial, and role alone confers equal status, how is this different from a purely legalistic/conventional view that concedes the deep moral asymmetry?"

  6.  **Civilian Complicity & the Flip Side:** "If combatants are moral equals *in bello* regardless of *ad bellum* justice, what about civilians? Walzer's non-combatant immunity rests on their separation from 'force and harm'. But civilians contribute materially, politically, and economically to unjust wars. If a combatant fighting unjustly is *not* liable simply for their functional role, why should a civilian *be* liable if their specific contribution (e.g., building munitions they know are for aggression) makes them morally responsible for an unjust threat? Doesn't symmetry *in bello* potentially undermine the combatant/non-combatant distinction?"
      *   *Likely Response:* Reasserts the combatant/non-combatant distinction based on direct participation/imminence of threat.
      *   **Follow-Up:** "But if the core issue is *moral responsibility for contributing to an unjust threat* (McMahan's liability), why should 'direct participation' be the *only* relevant threshold? If the munitions worker is *causally responsible and culpable* for enabling significant unjust harm, doesn't the logic of liability, which you reject for the *unjust combatant*, potentially apply *more* consistently to the *culpable civilian*? Doesn't defending symmetry for combatants push you towards a more permissive view on targeting civilians responsible for the war effort?"

  7.  **The Burden of Proof & Asymmetric Obligations:** "McMahan argues the soldier fighting for the *just* side has a *stronger* claim to self-defense and defense of others, potentially justifying tactics or levels of force impermissible for the unjust side. Does your strict symmetry view mean a soldier *knowing* they fight unjustly has *exactly the same permissions and obligations* regarding targeting enemy combatants as the soldier defending a just cause? Doesn't this seem counterintuitive? Where does the burden of proof lie for justifying force under your view?"
      *   *Likely Response:* Emphasizes reciprocity and the need for clear, reciprocal rules applicable to all combatants.
      *   **Follow-Up:** "Doesn't insisting on identical permissions effectively grant soldiers fighting for aggression a *moral license* they haven't earned? If reciprocity demands symmetry, but morality demands asymmetry, why privilege the institutional need for reciprocity over the underlying moral reality? Shouldn't the soldier on the unjust side bear a *greater* burden to minimize harm or even defect?"

  8.  **Post-War Accountability & the Limits of "In Bello" Symmetry:** "After a war, we often hold soldiers accountable for *ad bellum* crimes (aggression) or severe *in bello* violations. But under strict moral equality *in bello*, how do we justify *not* holding the soldier who fought competently but for an unjust cause *morally* accountable for participating in that collective wrong? If they were truly moral equals *only* during the fighting, doesn't that imply a radical discontinuity in moral assessment before, during, and after war that seems artificial? Doesn't this post-war intuition point towards a deeper asymmetry?"
      *   *Likely Response:* May distinguish legal accountability from individual moral blameworthiness, or emphasize the collective nature of *ad bellum* decisions.
      *   **Follow-Up:** "If participation in an unjust war of aggression is a *crime* for which leaders (and sometimes soldiers) are held accountable *after* the fact, how can that same participation *during* the fact *not* affect their moral status as targets? Doesn't the post-war accountability undermine the claim that their *role during war* entirely insulated them from the moral taint of the *ad bellum* wrong?"

  **Key Principles Used:**
  *   **Pressing the Liability Core:** Questions 1 & 4 directly challenge the foundation of McMahan's attack.
  *   **Exposing Concessions:** Question 2 forces clarity on whether symmetry is deep morality or pragmatic convention.
  *   **Highlighting Internal Tensions:** Questions 3, 5, 6, and 8 probe inconsistencies in applying equality across different types of combatants or across different phases (during vs. after war).
  *   **Challenging the Category:** Question 4 attacks the coherence of "combatant" as a uniform moral class.
  *   **Testing Intuitions & Burdens:** Questions 7 & 8 use counterintuitive implications to pressure the view.
  *   **Anticipating Defenses:** Follow-ups are designed to cut off common retreats (e.g., functional role, reciprocity, epistemic limits) by showing they either concede McMahan's point or create new problems.

  These questions force her to defend the *philosophical coherence* of symmetry, not just restate it, and grapple with its uncomfortable implications when pushed. Good luck with the interview!
