  I need to craft eight or nine questions with follow-ups for each. The user clearly wants to expose potential weaknesses in her position. Let me start by breaking down each requested angle.

  First, the self-defense analogy. McMahan argues that in individual self-defense, an unjust attacker is liable to harm while a defender isn't. Why doesn't this apply in war? The follow-up should anticipate her likely response about collective action and epistemic limitations, then push back by asking why those factors override moral liability.

  Second, the convention vs. deep morality point. If she's arguing that treating combatants equally minimizes harm, isn't she conceding McMahan's deeper moral point? The follow-up should challenge whether this pragmatic approach can coexist with condemning unjust wars.

  Third, the conscript/volunteer distinction. Walzer treats them as moral equals if they follow jus in bello, but is that defensible? The follow-up should question whether her view can accommodate different levels of culpability.

  Fourth, the combatant category critique. If "combatant" is an artificial grouping masking varying degrees of threat contribution, does "equality" even make sense? Follow-up should ask how her framework handles proportionality assessments that already acknowledge differential threat.

  Now for additional angles: 
