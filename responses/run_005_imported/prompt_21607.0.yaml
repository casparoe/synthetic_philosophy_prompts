  Second, the power asymmetry angle: Program equilibrium assumes symmetric capabilities (both agents can run the same proofs). But Hobbes obsesses over how even tiny power differentials—like who strikes first—exploit cooperation. What if one agent tweaks their code to *appear* FairBot-like but hides a backdoor? 

