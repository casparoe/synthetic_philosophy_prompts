  ## The Weight of Responsibility: Why McMahan's Revisionism, Despite Epistemic Hurdles, Offers a Truer Moral Compass for War

  The doctrine of the moral equality of combatants (MEC), powerfully defended by Michael Walzer, asserts that soldiers on opposing sides possess an equal right to kill enemy combatants, regardless of the justice of their nation's cause. This "independence thesis" – the separation of *jus in bello* (justice in fighting) from *jus ad bellum* (justice of going to war) – underpins much of the modern law of armed conflict. Jeff McMahan’s revisionist critique in *Killing in War*, however, strikes at the heart of this doctrine, arguing that moral liability to defensive killing hinges on individual responsibility for unjust threats. While the profound epistemic challenges soldiers face in judging *jus ad bellum* present a significant practical objection to McMahan, it is ultimately his responsibility-based account, acknowledging the crucial link between *jus ad bellum* and *jus in bello*, that provides a more coherent and morally defensible framework for understanding the ethics of killing in war. Walzer's model, though pragmatically appealing, fundamentally obscures moral culpability and perpetuates injustice.

  **Walzer's Defense: Coercion, Symmetry, and the Necessity of Rules**
  Walzer grounds MEC in the shared predicament of soldiers. He argues soldiers are typically coerced or conditioned by the state ("conscripts of utility"), lacking genuine autonomy regarding participation in the war. They enter a state of "reciprocal risk" on the battlefield, creating a mutual right to kill based on their status as combatants, not their cause's justice. This strict separation serves crucial practical functions:
  1.  **Maintaining Distinction:** It provides a clear, bright-line rule (uniforms = combatant status = permissible target) essential for protecting civilians and limiting brutality.
  2.  **Preserving Order:** It prevents battlefield chaos where soldiers constantly question the justice of their own or their enemy's cause.
  3.  **Pragmatic Feasibility:** It reflects the reality that soldiers cannot reliably determine the complex moral and factual bases of *jus ad bellum* in the fog of war or under state propaganda. The independence thesis offers a workable, if morally simplified, code for governing conduct *during* hostilities.

  **McMahan's Revision: Liability, Responsibility, and the Primacy of Deep Morality**
  McMahan dismantles Walzer's foundation. He argues that the *deep morality of war* – the fundamental ethical principles governing justified killing – is not independent of *jus ad bellum*. Liability to defensive force, McMahan contends, derives from an individual's responsibility for an *unjust threat*. A soldier fighting for a just cause (e.g., repelling an invasion) poses a *justified* threat; killing them is typically murder. Conversely, a soldier fighting for an unjust cause (e.g., the aggressor) poses an *unjust* threat; killing them can be an act of justified defense by the victims of aggression.

  McMahan distinguishes this "deep morality" from the *law of war*. He acknowledges that practical constraints – most prominently, the **epistemic challenge** – necessitate legal conventions like MEC. Soldiers simply lack the time, information, impartiality, and often the training to make reliable judgments about the overall justice of the war. Imposing a moral duty to assess *jus ad bellum* individually would be paralyzing and dangerous. Therefore, the *law* treats combatants equally to maintain order, distinction, and feasibility. However, McMahan insists this legal convention *masks* the underlying moral truth: only those responsible for unjust threats are morally liable to attack. The law is a necessary, morally sub-optimal compromise, not a reflection of fundamental moral equality.

  **Confronting the Epistemic Objection: A Hurdle, Not a Refutation**
  The epistemic challenge is the most potent practical objection to McMahan: how can ordinary soldiers, embedded in their state's apparatus and subjected to propaganda, reliably discern whether their war is just? Won't McMahan's theory lead to paralysis, increased war crimes as soldiers rationalize their actions ("*they* are the unjust aggressors"), or simply collapse back into subjective chaos?

  This objection is serious, but it does not invalidate McMahan's core moral insight; it highlights the tragic gap between ideal morality and practical implementation.

  1.  **Moral Clarity vs. Practical Difficulty:** The difficulty of judging *jus ad bellum* doesn't change the *fact* that moral liability *does* depend on it. Saying something is hard to know doesn't mean it isn't true or morally relevant. We recognize the difficulty of judging intent in civilian courts but don't abandon the concept of *mens rea*; we build procedures to address it.
  2.  **The Limits of Walzer's Solution:** Walzer's solution – ignoring *jus ad bellum* entirely for combatants – sweeps the moral problem under the rug. It grants a blanket moral license to kill to soldiers *knowingly* participating in naked aggression, which is intuitively abhorrent. Epistemic difficulty cannot morally justify equating the defensive killing by an invaded people's soldier with the offensive killing by an aggressor's soldier.
  3.  **Mitigating the Epistemic Burden:** McMahan's framework doesn't require *every* soldier to be a moral philosopher general. Responsibility is often mediated through institutions and chains of command:
      *   **Institutional Culpability:** Soldiers join institutions whose *purpose* is state violence. While coercion mitigates individual guilt, volunteering for an inherently aggressive military (or failing to resist manifestly illegal orders) can imply a degree of responsibility.
      *   **Manifest Illegality:** Soldiers *are* expected (and legally required) to recognize and refuse *manifestly* illegal orders (e.g., targeting civilians, torture). McMahan's logic extends this: participating in a *manifestly* unjust war (e.g., clear, unprovoked aggression) could incur liability, even if judging nuanced cases remains difficult. The epistemic bar is higher, but not infinitely so for egregious cases.
      *   **Shifting the Burden:** The epistemic challenge primarily burdens the *unjust* side. Soldiers on the *just* side, defending their homes or others from aggression, generally have clearer grounds for believing in their cause's justice. McMahan's asymmetry primarily constrains the actions of aggressors, not defenders.
  4.  **Direction for Reform:** Acknowledging the epistemic problem within McMahan's framework points towards *practical* solutions: better pre-deployment ethics training emphasizing *jus ad bellum* principles, stronger international mechanisms for authoritative *jus ad bellum* assessments (however imperfect), fostering cultures within militaries that question unlawful orders and wars of aggression, and refining legal doctrines over time to better approximate the deep morality where feasible. Walzer's model offers no such impetus for moral progress.

  **Why McMahan's Foundation is Morally Superior: Beyond Pragmatism**
  Despite the epistemic hurdle, McMahan's responsibility-based account is fundamentally superior:

  1.  **Moral Truth:** It aligns with our deepest intuitions about self-defense and liability outside of war. We don't grant a moral right to a mugger to kill the victim resisting them. Walzer's MEC creates a bizarre moral bubble around warfare that insulates combatants from the moral valence of their actions.
  2.  **Reduces Collective Violence:** By denying a blanket moral license, McMahan's view makes participating in unjust wars *morally riskier*. While not a perfect deterrent, it provides a stronger moral disincentive for aggression and complicity than Walzer's model, which morally sanitizes participation for all combatants.
  3.  **Acknowledges Moral Agency:** Walzer's emphasis on coercion risks reducing soldiers to mere instruments, denying them any moral agency. McMahan, while acknowledging mitigating factors like duress, preserves the possibility of moral responsibility. Soldiers are not just cogs; their choices matter. Refusing to serve in a manifestly unjust war becomes a profound moral act, recognized as such within the theory.
  4.  **Coherence:** Linking *jus ad bellum* and *jus in bello* provides a unified moral theory. Walzer's separation creates a dissonance: how can an act (killing an enemy combatant) be morally permissible for both sides when the overall enterprise for one side is inherently unjust? McMahan resolves this dissonance at the deep moral level.

  **Conclusion: Embracing the Difficult Truth**
  The epistemic challenge to McMahan is real and significant; it necessitates the legal convention of combatant equality as a tragic, pragmatic necessity to prevent worse outcomes. However, it does not refute his core moral argument. Walzer's independence thesis, while practically tidy, morally equates the defender and the aggressor, granting an indefensible license to kill to those prosecuting manifest injustice. It confuses the necessary conventions of the law of war with the deep morality that should underpin and guide it. McMahan's revisionism, by grounding liability in individual responsibility for unjust threats, offers a more honest, coherent, and ultimately more just account of the ethics of killing in war. It acknowledges the tragic fog of war and the limits of individual judgment without surrendering the fundamental principle that fighting for an unjust cause is morally culpable. The difficulty of discerning justice is a reason for practical legal rules and epistemic humility, not a reason to abandon the moral truth that the justice of the cause matters profoundly for the permissibility of killing. We must strive to align the law closer to this deep morality, not use practical difficulties to justify obscuring it.
