  Final verdict: Marcus edges it by embracing Wittgenstein's grammatical turn, but Deb exposes real tensions in applying the theory. The soft spot in move (5) remains - entitlement theorists (Wright, Coliva) are still refining this. Moyal-Sharrock's "non-propositional" reading might help, but the debate continues. 

