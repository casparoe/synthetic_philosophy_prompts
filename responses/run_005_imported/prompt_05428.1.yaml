  ## The Rescue Boat: A Dialogue on Numbers and Necessity

  **Setting:** The cramped wheelhouse of a rescue boat pitching on choppy, grey water. Rain lashes the windows. ELENA, mid-30s, intense gaze fixed on the radar screen showing two distinct blips. MARCUS, late 40s, weathered face etched with urgency, grips the helm. One blip is labeled "1", the other "5". Fuel gauge blinks red. Time is critical.

  **ELENA:** (Pointing decisively at the radar) There. The single. We go left. Flip for it if you insist, but we *have* to choose randomly. No aggregation, Marcus. We can’t treat those five like some kind of suffering super-organism that outweighs the one.

  **MARCUS:** (Veering the boat slightly right) Elena, be reasonable! We *have* to go for the five. It’s not about adding up pains like some accountant. It’s about acting on a principle *no one* could reasonably reject. Leaving five to die when we could save them? That’s… unthinkable. Throwing away four lives on a coin toss? That’s monstrous!

  **ELENA:** Monstrous? Because we refuse to *pretend* that saving five people is somehow a greater moral achievement than saving one? Tell me, Marcus, *who* suffers the "greater loss" if we save the one? Is there a single consciousness experiencing the sum of five deaths? No. There are five distinct individuals, each suffering their own irreplaceable loss, just like the one suffers theirs. Treating the five as automatically "more important" ignores the separateness of persons. It smuggles in utilitarian aggregation through the back door, pretending it’s objective.

  **MARCUS:** That’s where you misunderstand contractualism. I’m *not* saying the *loss* is aggregated. I’m saying the *justification* for the principle of saving the greater number avoids aggregation. Imagine *each* person, before knowing if they’ll be the one or one of the five. What principle for rescue could each reasonably accept?

  **ELENA:** Each could reasonably accept a principle that gives their claim, their life, equal weight. A principle that says when claims are otherwise equal – same peril, same strangers, no special ties – the rescuer doesn’t arbitrarily privilege the larger group. They settle it fairly, randomly. The single person couldn’t reasonably reject a coin toss; it respects their equal chance. Neither could any *individual* in the group of five reasonably demand that the rescuer *must* choose them *because* there are five. Why should *their* presence of four others diminish the claim of the single person?

  **MARCUS:** Because the single person *can* reasonably reject a principle that mandates a coin toss in *this* situation! Ask yourself: Could the single person stand before the five (or their loved ones, or any impartial judge) and say, "My demand for a 50% chance of survival, despite it meaning four extra deaths, is reasonable"? I don’t think so. The force of the others' claims *isn't* aggregated into a super-claim; it's that the single person's insistence on a coin toss, knowing it likely dooms four others for no reason *other than* preserving their own 50% chance, *is itself unreasonable*.

  **ELENA:** Unreasonable? From whose perspective? From the perspective of the *five*, sure, they want to live. But the single person also wants to live. Why is their desire for a fair chance "unreasonable"? You’re still implicitly weighing the *number* of people who would be dissatisfied. That *is* aggregation! You’re saying the single person’s reasonable rejection is outweighed because more people would benefit from the opposite principle. That’s just utilitarianism wearing a "reasonable rejection" mask.

  **MARCUS:** No, it’s not about *counting* dissatisfied people. It’s about the *nature* of the rejection. The single person isn’t rejecting the principle ("save the greater number") because it inherently violates their rights or treats them unfairly *as an individual*. They are rejecting it *only* because, in this specific application, it disadvantages them personally. That’s self-preference, not a principled objection. Contractualism asks us to consider principles we could justify to others *even if* we ended up in the worst-off position under that principle. Could the single person, if they were hypothetically behind a veil of ignorance not knowing their position, accept a principle that sometimes sacrifices the one for the five? I think they could, knowing it minimizes the total number of lives lost overall, and that *anyone* could be in either position.

  **ELENA:** Ah, but there’s the rub! "Minimizes the total number of lives lost overall." That’s the aggregative calculus! You’ve snuck it right back in. The veil of ignorance *forces* you to think like a potential utilitarian, maximizing your *chances* or minimizing *expected* deaths. But Taurek denies that "total lives lost" is a morally relevant sum *for the rescuer acting now*. The rescuer isn’t behind a veil. They face six individuals, each with an equal claim to be saved. Choosing the five because there are five *is* treating the group as morally weightier, which only makes sense if you aggregate. And the coin toss *is* the principled way to acknowledge that each of those six individuals has an identical, non-aggregated claim on our help. Choosing the five *without* that process disrespects the single individual’s claim as much as choosing the one would disrespect the five individuals in the group.

  **MARCUS:** But the single individual’s claim *isn’t* disrespected under the "save the greater number" principle! Their claim is acknowledged, it’s just that, tragically, in this configuration, the *equal claims* of five others must take precedence *because* acting otherwise would lead to a far greater loss of equally valuable lives. It’s not that their life is worth less; it’s that honoring their demand for a coin toss imposes an *unreasonable cost* – four preventable deaths – on others. That cost isn't aggregated suffering; it's the loss of four distinct, equally valid claims we *could* have honored, but didn't, purely to give the single person an equal *chance*. That's what makes their rejection unreasonable – it demands we ignore the actual, present claims of four others solely for the sake of procedural symmetry.

  **ELENA:** And you think the single person demanding we *don't* ignore their claim, demanding equal consideration *as an individual*, is imposing an "unreasonable cost"? That cost only *exists* because you’ve already decided the five *as a group* have a stronger claim! You’re begging the question, Marcus. The cost is defined *by* the principle you’re trying to justify. From the Taurekian view, there *is no* extra cost in saving the one versus the five, only different individuals saved. The "cost" of four deaths only arises if you assume saving the five is the default, which is precisely what’s in dispute. The coin toss avoids that assumption. It treats the situation for what it is: a tragic dilemma between saving distinct individuals, where no amount of clever philosophical restatement changes the fundamental separateness of their fates. Flipping a coin *is* the recognition of that separateness.

  **MARCUS:** And I say it’s a dereliction of the duty to help. We *can* save five. We *know* saving one means letting four others die *who we could have saved*. The coin toss deliberately chooses a course of action that we *know* will likely result in four unnecessary deaths. That’s not respect; that’s recklessness disguised as fairness. The contractualist principle – save the greater number when you can only save one group – *is* justifiable to each person as a free and equal moral agent. No one, thinking impartially about the structure of rescue situations, could demand a principle that *guarantees* we’ll often let the larger group die for no reason other than chance. That *is* unreasonable.

  **ELENA:** And no one thinking about the fundamental equality of individuals could demand a principle that tells the single person, "Your life matters less because you happen to be alone." Your principle *does* tell them that, Marcus, however you dress it up. The coin toss tells them, "Your life matters exactly as much as any one of theirs." That *is* respect.

  **(A long pause filled by the howl of wind and engine groan. The fuel alarm beeps insistently. Both look at the blips, then at each other. The philosophical chasm remains, but action is now unavoidable.)**

  **MARCUS:** (Grimly, turning the wheel decisively towards the blip marked "5") We go for the five. Because I believe, with everything I am, that it’s the only choice no one could sanely reject. To do otherwise… wastes lives. I can’t abide that.

  **ELENA:** (Watching the course change, her face tight with disagreement but resignation) And I believe you’re sacrificing fairness to a ghost – the illusion that five deaths are somehow worse than one. We should have flipped the coin. But… we’re out of time. Do what you think you must. Just know you haven’t escaped the aggregation. You’ve embraced it. (She turns away, staring out at the turbulent sea towards the lone blip, now receding.)

  **(The boat surges forward towards the group of five. The argument is unresolved, the tension between the separateness of persons and the pull of preventing greater loss laid bare, neither side yielding ground, both acting on conviction as the storm rages on.)**

  **Key Points Engaged:**

  *   **Taurekian (Elena):** Focuses on the separateness of persons, denies moral relevance to summing harms/losses across individuals, argues aggregation is smuggled into any numbers-based decision. Defends coin toss as respecting equal individual claims.
  *   **Scanlonian (Marcus):** Argues "save the greater number" is a principle justifiable via contractualism without aggregation – focusing on the *unreasonableness* of the single person's rejection (demanding a coin toss despite the cost in lives), not summing welfare. Denies the principle disrespects the single individual.
  *   **Core Disagreement:** Whether "no one could reasonably reject saving the greater number" inherently relies on an aggregative judgment (Elena's charge) or genuinely escapes it through the structure of reasonable rejection and the nature of the cost imposed by the alternative (Marcus's defense).
  *   **Stalemate:** Marcus acts, believing his principle is non-aggregative and compelling. Elena acquiesces due to time but remains convinced aggregation underpins his choice and that the coin toss is the only non-aggregative, fair solution. Neither concedes the core philosophical point. The dialogue highlights the intractability of the foundational disagreement about the moral significance of numbers across separate lives.
