answer: |-
  That philosopher friend gave you a fascinating but wildly oversimplified take on a notoriously thorny philosophical problem. Popper *did* propose a formal definition of verisimilitude, but it was **fatally flawed**, and the subsequent history is one of debate and refinement, not a settled textbook formula. Applying it directly to novels is almost impossible. Here's the breakdown:

  1.  **Popper's Original Idea (The "Formula"):**
      *   Imagine two theories, A and B, both false (since all scientific theories are tentative).
      *   Popper wanted to say A has *more verisimilitude* than B if:
          *   A's *truth content* is greater than B's truth content, **OR**
          *   A's *falsity content* is less than B's falsity content.
      *   More precisely, he defined:
          *   **Truth Content (Ct(A)):** The set of all *true* logical consequences of theory A.
          *   **Falsity Content (Cf(A)):** The set of all *false* logical consequences of theory A.
          *   **Verisimilitude (Vs(A)):** Ct(A) - Cf(A) (conceptually, like a set difference).
      *   Theory A has *more verisimilitude* than Theory B if:
          Vs(A) > Vs(B) meaning (Ct(A) - Cf(A)) > (Ct(B) - Cf(B))

  2.  **The Fatal Flaw (Miller & Tichý's Refutation):**
      *   The problem? **Comparing infinite sets.** Scientific theories generate an infinite number of consequences.
      *   Philosophers David Miller and Pavel Tichý (independently, ~1974) proved a devastating result: **For any two false theories A and B, it's impossible for A to have strictly more verisimilitude than B according to Popper's definition.**
      *   **Why?** Because if A is false, it must have *some* false consequence. Miller and Tichý showed that you can always construct logical consequences where B ends up looking *better* relative to the truth than A does in some aspect, preventing the simple "A > B" comparison Popper wanted. The sets are too vast and intertwined.

  3.  **Later Developments (The Messy Reality):**
      *   Popper's definition was essentially dead in the water for *quantitative comparison*.
      *   Philosophers didn't give up. They pursued other avenues:
          *   **Possible Worlds Approaches:** Defining verisimilitude as closeness to the "actual world" in the space of all logically possible worlds. This is conceptually powerful but incredibly abstract and hard to apply to real cases.
          *   **Approximate Truth:** Focusing on whether key components of a theory are *approximately* correct, even if the whole theory is false. This feels more intuitive but lacks a rigorous formal definition everyone agrees on.
          *   **Structural Similarity:** Comparing the *structure* of a theory to the structure of the truth.
      *   **The Consensus:** There is **NO universally agreed-upon, workable formula for calculating verisimilitude** that solves the fundamental problems highlighted by Miller and Tichý. The problem is *not* settled; it's recognized as profoundly difficult. Philosophers talk about verisimilitude meaningfully, but not via a simple plug-and-play formula.

  **Applying This to Your Novels (Why the Formula Doesn't Work):**

  1.  **Novels Aren't Scientific Theories:** Popper was talking about universal statements about the world (e.g., "All swans are white"). Your novel is a complex, specific narrative containing countless propositions (stated and implied) – historical facts, character motivations, emotional states, physical descriptions, invented events.
  2.  **Defining "Truth Content":** What is the "Ct(Your Novel)"?
      *   Does it include *only* the historically documented facts about the *real* shipwreck? (e.g., "The ship was named X," "It sank on date Y," "Captain Z died").
      *   Does it include deeper historical truths? (e.g., "Life at sea was harsh," "Class divisions existed on passenger ships")? How do you prove these are "true consequences"?
      *   Does it include *emotional* or *thematic* truths? (e.g., "Grief is universal," "Duty can conflict with desire"). Are these "true"? How?
  3.  **Defining "Falsity Content":** What is "Cf(Your Novel)"?
      *   Is it *only* the propositions directly contradicted by the historical record? (e.g., "The first mate had an affair with Passenger A" when the records show no evidence and Passenger A was a 70-year-old man traveling with his wife).
      *   Does it include *implied* falsehoods? (e.g., Does inventing the affair imply false things about the *real* first mate's character, even if he's fictionalized?).
      *   Does your thematic exploration generate *any* false consequences about human nature? Probably not in a way that's measurable.
  4.  **The Infinite Set Problem Hits Hard:** The number of true and false propositions *implied* by each novel is vast and potentially infinite. Comparing these sets fairly is impossible.
  5.  **"Emotional Truth" vs. "Factual Truth":** Popper's framework deals with propositional truth (true/false statements). Your claim is that your novel achieves a *different kind of truth* (emotional, thematic resonance) *by* deviating from factual accuracy. Popper's formula has **no mechanism** to measure, quantify, or compare this type of non-propositional "truth." It's comparing apples (factual propositions) and oranges (emotional/thematic impact).

  **The Verdict on Your Bet:**

  *   **Your Philosopher Friend is Wrong:** There is no usable, agreed-upon formula sitting in a textbook. Popper's was flawed, and nothing has cleanly replaced it for direct comparison.
  *   **You Can't "Plug In" the Novels:** The formal definition (even if it worked) is fundamentally mismatched to the nature of literary fiction.
  *   **Objectivity is Impossible Here:** Determining which novel has "more verisimilitude" in the *philosophical sense* is impossible because:
      1.  The formal definition is broken for this purpose.
      2.  Defining the relevant truth/falsity sets for novels is arbitrary.
      3.  The novels aim for different *kinds* of truth.

  **What *Can* You Argue (More Productively)?**

  1.  **Historical Plausibility:** Does your invented affair *feel* plausible within the documented social norms, shipboard life, and known personalities of the 1890s? Does your friend's strict adherence potentially miss nuances that aren't recorded but are likely true (e.g., unspoken tensions)?
  2.  **Thematic Resonance & Emotional Truth:** Does your subplot effectively illuminate the themes (grief, duty, survival, class) in a way that feels profound and authentic to the human experience, *even if* the specific events are invented? Does your friend's strict accuracy achieve a different kind of power through its fidelity?
  3.  **Narrative Effectiveness:** Which approach creates a more compelling, engaging, and ultimately satisfying *story*? Does the invention serve the narrative, or does the strict adherence constrain it?
  4.  **The Goal of *This* Fiction:** Is the primary goal to teach history accurately (favors your friend) or to use the historical event as a springboard for exploring universal human experiences (potentially favors you)?

  **Conclusion:** You've stumbled into a deep philosophical quagmire with no simple solution. Your bet is fundamentally un-winnable via Popper's flawed and inapplicable formula. Instead of seeking a non-existent objective calculation, lean into the actual artistic debate: which approach – historical invention for emotional/thematic depth or strict fidelity for historical immersion – creates a *better novel* about this tragic event? *That's* the interesting argument for novelists, and it's one where "verisimilitude" functions more as an evocative literary term ("feels true to life") than a measurable philosophical quantity. Tell your philosopher friend she owes you a pint for oversimplifying Popper's notoriously problematic idea! If she wants to debate literary truth, point her towards philosophers like Paul Ricoeur (*Time and Narrative*) or Peter Lamarque & Stein Haugom Olsen (*Truth, Fiction, and Literature*), who grapple directly with fiction.
