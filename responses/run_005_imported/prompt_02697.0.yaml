  First, I need to address the sharp cutoff question. The user points out that Williamson, as an epistemicist, accepts unknowable boundaries for vague predicates. So why not apply that here? The key difference is that luminosity claims involve a necessary connection between being in a state and being able to know it. Epistemicism about vagueness says there's a sharp boundary for "feels cold," but it doesn't require that we can always know when we're in that state. Luminosity does require that. So if there's a sharp cutoff between feeling cold and not, and you're at the boundary, you might feel cold but not know it because your belief isn't safe—it could easily be false in the adjacent case. Luminosity demands that you can know it, creating a contradiction at the boundary. Epistemicism avoids this by denying luminosity, not by denying the boundary.

