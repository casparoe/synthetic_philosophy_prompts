  The demon scenario presents a situation where you have a practical reason to desire mud (to avoid torture), but that doesn't make the mud intrinsically good. Contemporary fitting-attitude theories struggle with separating these pragmatic reasons from the right kind of reasons that make something valuable. So, the user wants to know if Brentano's notion of correctness avoids this issue.

  I need to dive into Brentano's idea of correctness. He ties it to self-evidence and intrinsic appropriateness. Correctness in emotions is similar to judgments—just as a judgment is correct if it's self-evidently true, an emotion is correct if it's self-evidently fitting. The demon's threat creates an external reason, which isn't about the intrinsic properties of the mud. Therefore, Brentano would argue that such reasons don't affect the correctness of the emotion itself. The correctness is internal to the emotion based on the object's nature.

  Also, Brentano might emphasize that the emotion directed at the mud isn't intrinsically correct. Loving the mud isn't self-evidently fitting; it's only motivated by fear. So, the correctness isn't present. The user's professor mentioned Brentano as the ancestor of fitting-attitude theories, so the user is probably looking for how his original approach differs from modern ones. They might be interested in whether historical philosophers had solutions that contemporary theories overlook.

