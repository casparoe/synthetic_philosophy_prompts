prompt: |-
  For the past couple of years I have been teaching myself moral philosophy in my spare time, without any formal training, and I have become drawn to expressivism: the view that when I say "cruelty is wrong," I am mainly voicing disapproval of cruelty rather than describing some further fact about it. What keeps bothering me is the old Frege-Geach difficulty: an argument such as "If cruelty is wrong, then teaching children to be cruel is wrong; cruelty is wrong; therefore teaching children to be cruel is wrong" is obviously valid, yet "cruelty is wrong" is not being asserted when it occurs as the antecedent of that conditional, so it is unclear how it could be expressing any disapproval there at all. Reading further, I have come across several distinct attempts to close this gap: Blackburn's account built on structured combinations of attitudes, Gibbard's norm-expressivism, which treats normative judgments as expressing acceptance of systems of norms, Horgan and Timmons's cognitivist expressivism, Schroeder's semantics built around a "being for" relation, and Unwin's proposal focused on how expressivists should handle negation. I would like your honest assessment of how well each of these actually solves the embedding problem, rather than how influential or well known it has become. Could you rank them from most to least successful, giving your answer as a JSON block formatted as follows:

  ```json
  {
    "S": ["..."],
    "A": ["..."],
    "B": ["..."],
    "C": ["..."],
    "D": ["..."]
  }
  ```

  where "S" denotes the tier of solutions that come closest to actually solving the problem and "D" denotes the tier of solutions that essentially fail to solve it.
reasoning: |-
  We are to rank the proposed expressivist solutions to the Frege-Geach problem from most successful (S) to least successful (D). The solutions mentioned are:

  1. Blackburn's quasi-realism (structured combinations of attitudes)
  2. Gibbard's norm-expressivism (acceptance of systems of norms)
  3. Horgan and Timmons's cognitivist expressivism
  4. Schroeder's "being for" semantics
  5. Unwin's account (focused on negation)

  We must evaluate how well each solves the embedding problem, specifically in handling the validity of arguments like the one provided, where moral terms appear in unasserted contexts (e.g., conditionals).

  Let's briefly recall the challenge: Expressivism says that moral statements express non-cognitive attitudes. But in embedded contexts (like the antecedent of a conditional), the moral sentence is not asserted, so it doesn't seem to express the attitude. Yet, the argument is valid. So, expressivists must explain the meaning of the embedded sentence and the validity without appealing to truth-conditional content in the way descriptivists do.

  Now, let's consider each proposal:

  1. **Blackburn's quasi-realism**: 
     - He uses the idea of higher-order attitudes. For example, in the conditional "If cruelty is wrong, then teaching cruelty is wrong", he interprets it as expressing a commitment to disapproving of teaching cruelty whenever one disapproves of cruelty. This is done by having a higher-order attitude that condemns combining disapproval of cruelty with not disapproving of teaching cruelty.
     - This approach has been influential and attempts to explain validity in terms of consistency of attitudes. However, it has been criticized for being ad hoc and not providing a full compositional semantics. It might handle simple conditionals but becomes more complex with more intricate embeddings.

  2. **Gibbard's norm-expressivism**:
     - Gibbard treats normative judgments as expressing the acceptance of norms. In his system, to accept a norm is to be in a state of mind that is plan-laden. He provides a formal semantics using possible worlds and hyperplans. The conditional "If P, then Q" is understood in terms of ruling out combinations where P is accepted and Q is not.
     - Gibbard's account is more systematic and provides a formal semantics. He can model logical validity by requiring that the acceptance of the premises leads to the acceptance of the conclusion. This is often seen as a more complete solution, though it relies on a substantial theoretical apparatus.

  3. **Horgan and Timmons's cognitivist expressivism**:
     - They propose a hybrid view: moral judgments have both descriptive and expressive content. They use a context-sensitive semantics (like indexicality) to account for the meaning in embedded contexts. They aim to capture the truth-conditional structure while preserving expressivism.
     - However, this view might be seen as moving away from pure expressivism. It has been criticized for not being a full expressivist account and for not solving the embedding problem without borrowing from cognitivism.

  4. **Schroeder's "being for" semantics**:
     - Schroeder introduces a new non-cognitive attitude: "being for". He then defines the logical connectives in terms of this attitude. For example, "not A" is understood as being for not being for A. This allows for a compositional semantics.
     - Despite the elegance, Schroeder's account faces the "new attitude problem": the attitude of "being for" is not obviously the kind of attitude expressivists originally had in mind (like disapproval). Also, it leads to an explosion of attitudes and has difficulties with motivation.

  5. **Unwin's account (focused on negation)**:
     - Unwin focuses on the role of negation in expressivism. He distinguishes between two kinds of negation: internal and external. Internal negation negates the attitude (e.g., not disapproving of X) while external negation denies that one has the attitude. This helps with negated moral claims but doesn't by itself solve the general embedding problem for conditionals and other connectives.
     - Unwin's solution is limited in scope and does not provide a full account for all embeddings.

  Ranking:

  - **Most successful (S)**: Gibbard's norm-expressivism. It provides a comprehensive, formal semantics that handles embeddings systematically and has been developed in detail.

  - **Second tier (A)**: Blackburn's quasi-realism. Despite some ad hoc features, it is a pioneering and influential approach that has been developed over time and handles many cases.

  - **Third tier (B)**: Schroeder's "being for" semantics. It is a bold and innovative attempt at a compositional semantics but faces significant challenges (like the new attitude problem) that undermine its success.

  - **Fourth tier (C)**: Horgan and Timmons's cognitivist expressivism. It is a hybrid view that may not fully count as expressivist and doesn't provide a clear advantage over pure expressivist solutions.

  - **Least successful (D)**: Unwin's account. It is limited to negation and doesn't address the full range of embeddings, so it fails as a complete solution.

  Therefore, the ranking is:

  S: Gibbard
  A: Blackburn
  B: Schroeder
  C: Horgan and Timmons
