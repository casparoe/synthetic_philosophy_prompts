  ### Justifications:
  1. **Marcus (-1: Partially misleading)**  
  While the clay persists materially, Marcus ignores that artifacts (like busts) have *emergent identity conditions*. Claiming "nothing was destroyed" conflates material persistence with object persistence – like saying demolishing a house destroys nothing because bricks remain.

  2. **Jess (+1: Fundamentally correct)**  
  Appeals to Leibniz's Law (if two entities have different properties, they can't be identical). The bust *requires a specific form* to exist, while raw clay does not – making them distinct entities despite material coincidence. Correctly identifies divergent survival conditions.

  3. **Marcus (-2: Fatally flawed)**  
  Mischaracterizes dispositional properties (e.g., "fragility") as non-real. Survival conditions *are* essential properties: a clay bust's vulnerability to squashing defines its nature as an artifact, just as a wine glass's fragility exists even before shattering.

  4. **Jess (+2: Irrefutably sound)**  
  Exposes Marcus's circular reasoning: rejecting dispositional properties *presupposes* only one object exists. If we accept that properties like "can survive reshaping" are real (as metaphysics does), coincident objects become unavoidable in cases like this.

  5. **Marcus (0: Defensible but extreme)**  
  His eliminativist view ("only clay exists") is philosophically coherent but rejects ordinary ontology. While "traffic jam" is a useful analogy for ephemeral aggregates, sculpted artifacts have intentionality and function that raw matter lacks – making "relabeling" an oversimplification.

  ---

  ### The Missing Standard Move: Hylomorphism  
  Both overlook **Aristotelian hylomorphism** – the theory that objects comprise *matter* (clay) and *form* (bust-shape). When Jess squashes the clay:  
  - The *composite substance* (bust) is destroyed because its form is eliminated.  
  - The *matter* (clay) persists and gains a new form (ball/bowl).  

  This reconciles both intuitions:  
  - Marcus is right that *matter* wasn't annihilated.  
  - Jess is right that the *artifact* was destroyed.  

  Priya's Michelangelo quip brilliantly invokes this: no, Michelangelo didn't "just relabel rock" – he imposed a *substantial form* (David) onto matter, creating a new ontological entity. Destroying the form destroys the statue, even if the marble remains.  

  This resolves the stalemate by acknowledging two layers of reality: persistent material and perishable form-dependent objects.
