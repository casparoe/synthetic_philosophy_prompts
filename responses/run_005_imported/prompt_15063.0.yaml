  Considering Bitcoin through this lens, several tensions emerge. The cryptocurrency's detachment from bullion initially seems to align with Berkeley's anti-fetishism. But its engineered scarcity mirrors the very metallism he attacked, just digitized. More crucially, Berkeley's emphasis on accountable institutions clashes with Bitcoin's decentralized nature - he'd likely see the lack of sovereign backing as abandoning the social contract aspect of money.

  The user wants no philosophical digressions, so I'll avoid immaterialism connections. Instead, I'll focus on how Berkeley's banking proposals required redeemable paper credit managed for public benefit - conditions Bitcoin doesn't meet. His queries about whether money "circulates industry" are particularly relevant here.

