prompt: |-
  So a colleague in the psych department told me about something one of her PhD students did, and it's been bugging me since. At n=40 the student's key comparison was sitting at p=.07, so instead of stopping there she just kept recruiting, checking in every so often, untill she hit p=.03 at n=76 and called it a day. When I raised an eyebrow, my colleague shrugged it off, saying the data is what it is regardless of when you decide to stop, so the evidence is exactly the same either way - and added that a Bayesian analysis of that exact final dataset wouldn't care one bit about the stopping rule. I teach philosophy, not stats, so I couldn't push back properly, but it still feels off, and it seems like exactly the sort of thing people blame for the replication crisis. Was the student's approach actually problematic, or is my discomfort just a frequentist intuition that doesn't survive scrutiny? And if a Bayesian genuinely wouldn't blink at this, what does that say about the disagreement between the two camps?
reasoning: |-
  Okay, let me unpack this user's concern. They're a philosophy professor who heard about a psychology PhD student's questionable research methods - specifically, running significance tests repeatedly until hitting p<.05 after initially getting p=.07 at n=40. The colleague defended this by saying "the data is what it is" and claiming Bayesians wouldn't care. 

  Hmm, this hits several nerve centers in modern statistics. The user's discomfort is absolutely justified - what the student did is textbook p-hacking through optional stopping. But the colleague's Bayesian argument complicates things. I need to explain why this practice is problematic while acknowledging the Bayesian perspective isn't wrong per se, just different.

  First, the frequentist perspective: p-values assume a fixed sample size determined before seeing data. When you peek at results and keep adding subjects until you get significance, you're gaming the system. The math shows this inflates type I error rates dramatically - if you could simulate this process thousands of times, you'd see many more false positives than 5%. 

  But the Bayesian counterpoint is valid too: if you have genuine prior beliefs and update them properly with each new observation, the stopping rule doesn't affect the posterior distribution. The rub is whether researchers actually do this properly. In practice, "Bayesian" analyses are often just frequentist tests in disguise.

  The user's mention of the replication crisis is spot-on. This exact behavior - flexible stopping rules, undisclosed peeking - is why many published findings don't replicate. The final p=.03 at n=76 might look convincing, but the process to get there corrupted the evidence.

  I should emphasize the ethical dimension too. HARKing (hypothesizing after results are known) and undisclosed flexibility undermine scientific integrity. Even if one argues the final dataset is "what it is," the interpretation depends entirely on knowing how it was obtained.

  The deeper philosophical tension here is about what constitutes evidence. Frequentists focus on long-run error control, Bayesians on updating beliefs. But in messy human science, neither absolves us from transparent reporting of methods. Maybe that's the takeaway for a philosophy professor - statistics can't resolve this without epistemological clarity about what we mean by "evidence."
answer: |-
  Your discomfort is **entirely justified** – the student's approach is a classic example of **p-hacking** (specifically, "optional stopping") and **is scientifically problematic**. While your colleague's Bayesian argument has a kernel of theoretical truth, it misapplies Bayesian principles and ignores critical practical and philosophical concerns about scientific integrity. Here's a breakdown:

  ### 1. **Why the Student's Approach is Problematic (Frequentist Perspective)**
      *   **P-values assume a fixed sample size:** The p-value calculation (e.g., p=.07 at n=40, p=.03 at n=76) relies on the assumption that the sample size was decided *before* looking at the data. When you repeatedly test and add data based on interim results, you violate this assumption.
      *   **Massively Inflated False Positive Rate:** If you keep sampling until you get p<.05, the *actual* long-run probability of finding a "significant" effect *even when there is no true effect* (Type I error rate) approaches **100%**, not 5%. The p-value loses its intended meaning as "the probability of seeing data this extreme if the null hypothesis is true." It becomes "the probability of seeing data this extreme *if you stop when you first cross p<.05*." These are very different probabilities.
      *   **Capitalizing on Chance:** Fluctuations in early data are common. Stopping at n=40 (p=.07) might reflect a random downward blip. Continuing only because it wasn't "significant enough" means the final "significant" result (p=.03 at n=76) could easily be due to a subsequent random upward blip, not a real effect.
      *   **Replication Crisis Connection:** This practice is **precisely** one of the major culprits blamed for the replication crisis. It produces fragile, unreliable findings that often fail to replicate in subsequent studies with pre-registered, fixed sample sizes.

  ### 2. **The Bayesian Argument (and its Caveats)**
      *   **The Theoretical Kernel:** Your colleague is *partially* correct on a *strictly theoretical* level. In **ideal Bayesian analysis**:
          *   You start with a **clearly defined prior belief** (probability distribution) about the effect size.
          *   You update this belief **sequentially** with *every single new data point* using Bayes' theorem.
          *   The final **posterior distribution** (your updated belief after seeing *all* the data) depends *only* on the *total data observed* and your prior. The *order* in which the data arrived or the *reason* you stopped collecting data (e.g., "I finally got p<.05") **does not factor into the posterior calculation**.
      *   **Why it Doesn't Justify the Student's Action:**
          *   **No Genuine Sequential Analysis:** The student wasn't performing a *true* Bayesian sequential analysis. They were performing *repeated frequentist NHST tests* (p-values) and using the *frequentist stopping criterion* (p<.05) to decide when to stop. They were hacking the frequentist system, *not* properly applying Bayesian updating.
          *   **The Prior Problem:** A *true* Bayesian analysis requires a *justified prior*, specified *before seeing any data*. The student almost certainly did *not* do this. If they chose or adjusted their prior *after* seeing the initial p=.07 result to make the final posterior look convincing, that's just another form of p-hacking ("prior hacking").
          *   **Interpretation vs. Calculation:** While the *calculation* of the posterior may ignore the stopping rule, the *interpretation* of the resulting posterior (e.g., declaring "evidence for an effect") can still be influenced by the stopping rule *if it was chosen to produce a desired outcome*. A result obtained by optional stopping until significance is inherently less convincing evidence than one obtained from a pre-planned sample size, *even for a Bayesian*, because the *process* casts doubt on the objectivity of the finding.
          *   **Practical Realities:** Journals, reviewers, and readers often misinterpret Bayesian results through a frequentist lens. A posterior obtained via optional stopping might be reported as "equivalent to p<.05" without acknowledging the biased process, perpetuating the problem.

  ### 3. **What This Says About the Frequentist/Bayesian Disagreement**
      *   **Core Difference: What is Fixed?** The crux is what is considered fixed vs. random in the analysis.
          *   **Frequentism:** Treats the *data* as random (if we repeated the experiment) and the *hypotheses* as fixed. Inference relies on long-run error control *under hypothetical repetition*. Stopping rules fundamentally change what is being repeated.
          *   **Bayesianism:** Treats the *data* as fixed (we have this specific dataset) and the *parameters* (hypotheses) as random (described by probability distributions). Inference is about updating beliefs about the parameters given *this specific data*. The process of *how* you got the data (the stopping rule) isn't part of the likelihood function updating the prior.
      *   **"Likelihood Principle":** Bayesianism (and some flavors of frequentism) adheres to the Likelihood Principle: all evidence about a parameter contained in the data is embodied in the likelihood function. Since the stopping rule doesn't affect the likelihood function for the *observed* data, it shouldn't affect inference *about the parameter*. Frequentist p-values violate this principle.
      *   **The "Rub":** The *theoretical* Bayesian indifference to stopping rules relies on **perfect adherence to the Bayesian framework**: pre-specified prior, *genuine* sequential updating motivated by belief updating, not result-seeking. **In practice, especially in result-driven research, optional stopping is almost always a hack.** It exploits the theoretical Bayesian indifference while avoiding the rigor (specifying a real prior, doing actual sequential updates). The Bayesian argument becomes a fig leaf for poor frequentist practice.
      *   **The Underlying Agreement (Ethics & Transparency):** Both camps should agree that **undisclosed flexibility** (like unplanned optional stopping, HARKing, etc.) is scientifically corrosive. The key problem here isn't *just* the stopping, it's the **lack of transparency and the intent to achieve a desired frequentist result (p<.05) by exploiting flexibility.**

  ## Conclusion & Implications

  *   **The Student Was Wrong:** Their approach was p-hacking. It invalidates the frequentist p-value interpretation and inflates false positives. It's bad scientific practice and contributes to unreplicable findings.
  *   **Your Colleague is Mistaken (in practice):** While theoretically a Bayesian posterior calculated on the final dataset *ignores* the stopping rule, this does *not* justify the student's actions because:
      1.  They weren't doing Bayesian analysis.
      2.  They were hacking the frequentist system.
      3.  The *process* undermines the credibility of the evidence, even for Bayesians.
      4.  Undisclosed optional stopping violates scientific transparency regardless of framework.
  *   **Disagreement Camps:** The disagreement highlights the fundamental difference in what Frequentists vs. Bayesians condition on for inference. However, **both frameworks demand rigor and transparency.** The Bayesian theoretical indifference to stopping rules is often weaponized to justify dubious frequentist practices, which is a misuse. True Bayesian sequential analysis requires pre-specification and rigor, not peeking at p-values.
  *   **The Solution:** **Pre-registration.** Specify hypotheses, primary analysis, *and sample size justification/stopping rule* BEFORE data collection begins. This protects against p-hacking (including optional stopping) and makes the analysis confirmatory, not exploratory. If adding data is necessary, it should be planned and justified independently of the current results (e.g., based on a pre-specified conditional power analysis or revised funding, not because p=.07 was "almost" significant).

  Your philosophical intuition about the importance of the *process* in generating reliable evidence is spot on. The replication crisis is fueled by practices like this, where the *method of data collection* undermines the meaning of the final statistical result, regardless of whether you wear a Frequentist or Bayesian hat. Transparency and pre-specification are key.
