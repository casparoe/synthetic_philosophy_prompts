answer: |-
  Based on Douglass's specific interpretive method forged against Garrison and Taney, his textualism would **strongly oppose** the restrictive reading of the 14th Amendment's Citizenship Clause regarding children born to undocumented parents. Here's a breakdown of why, grounded in his historical arguments:

  1.  **Primacy of Text Over Subjective Intent/Practice:**
      *   **Anti-Garrison:** Douglass rejected Garrison's focus on the framers' *intentions* and the nation's *pro-slavery practice* as determinative. He insisted the *actual written words* held supreme authority.
      *   **Anti-Taney:** He vehemently rejected Taney's reliance on the framers' supposed "original understanding" of Black exclusion in *Dred Scott*, arguing the text's language ("Person," "People," refusal to name slavery) controlled.
      *   **Application to 14th Amendment:** Douglass would apply this same principle. He would focus *first and foremost* on the precise words of the Citizenship Clause: "All persons born or naturalized in the United States, and subject to the jurisdiction thereof, are citizens..." He would be deeply skeptical of arguments relying heavily on the *intent* of the 39th Congress (e.g., statements about excluding Native Americans or children of diplomats) if those intentions weren't explicitly reflected in the text's meaning. The *practice* of granting citizenship to such children for over a century would also be secondary to the text itself, though potentially reinforcing its plain meaning.

  2.  **Focus on Neutral, Inclusive Language:**
      *   **His Antislavery Argument:** A cornerstone of Douglass's textualism was highlighting the Constitution's deliberate use of neutral, universal terms like "person" and "People," avoiding explicit endorsement of slavery ("slave," "slavery"). He argued this language created a *potential* for freedom and inclusion that practice had betrayed.
      *   **Application to 14th Amendment:** The Citizenship Clause uses similarly broad, universal language: "All persons born... in the United States." The term "persons" is inclusive and lacks any qualification based on parental status. Douglass would see this neutrality as significant, just as he saw neutrality in the original Constitution as an opening for antislavery interpretation. Adding restrictions based on parents' status that aren't present in the text would violate this principle of textual neutrality.

  3.  **Interpretation of "Subject to the Jurisdiction Thereof":**
      *   **Textual Meaning vs. Allegiance:** The restrictive argument hinges on interpreting "subject to the jurisdiction" as requiring *complete political allegiance* to the U.S., which undocumented parents (and thus their children) allegedly lack.
      *   **Douglass's Likely Interpretation:** Douglass would almost certainly interpret "jurisdiction" in its *legal and territorial sense*, not as requiring full political allegiance. This is consistent with:
          *   **Common Legal Understanding:** Jurisdiction primarily means being subject to the laws and authority of a governing power within a territory.
          *   **The Clause's Exceptions:** The framers explicitly discussed exceptions for children of foreign diplomats (under foreign sovereign immunity) and Native Americans owing allegiance to tribes (under tribal sovereignty). *These exceptions are based on recognized legal doctrines of extraterritoriality or separate sovereign status, not mere lack of legal immigration status.*
          *   **Territorial Sovereignty:** Anyone born *within* the territorial boundaries of the U.S. is inherently subject to its laws and enforcement power. Undocumented immigrants are unquestionably subject to U.S. criminal, civil, and administrative law. Their children, born on the soil, are equally subject to U.S. law from birth.
      *   **Rejection of Taney Parallel:** Douglass would see the attempt to use "jurisdiction" to create an exclusionary class based on birth (parental status) as dangerously similar to Taney's use of "original understanding" to exclude Black people. He would argue the text itself ("All persons born...") provides no basis for such exclusion, just as the original text provided no basis for Taney's racial exclusion.

  4.  **The Method's Use in Today's Debate:**
      *   **By Restrictive Advocates:** They *attempt* to use a form of textualism/originalism, focusing on "subject to the jurisdiction." However, they often rely heavily on inferred original intent (statements about exclusions) that Douglass would reject if not embodied in the text's meaning. Crucially, they interpret "jurisdiction" in a way (requiring full allegiance) that departs from its standard legal meaning and the historical exceptions, stretching it to cover a situation (undocumented presence) fundamentally different from diplomatic immunity or tribal sovereignty. Douglass would likely see this as a *distortion* of textualism, akin to Taney's distortion, inserting an unstated restriction not present in the words.
      *   **By Inclusive Advocates:** They employ a method much closer to Douglass's own:
          *   Emphasizing the plain, inclusive language: "All persons born... in the United States."
          *   Interpreting "subject to the jurisdiction" territorially and legally, consistent with its common meaning and the understood historical exceptions.
          *   Rejecting arguments based solely on the inferred intent of some framers to potentially exclude other groups if that intent isn't reflected in the text's structure or explicit meaning.
          *   Pointing to the long-standing practice and understanding of the clause as supporting the textual reading.
      *   **"With a Straight Face"?** Douglass could recognize the *superficial* textualist argument made restrictively ("It says 'subject to the jurisdiction'!"). However, based on his consistent application of textualism *to expand rights and inclusion*, his focus on neutral language, his rejection of intent overriding text, and his specific approach to interpreting key terms like "jurisdiction" within their legal context, he would almost certainly conclude that the *authentic application of his method* aligns with the inclusive reading. Using his method *rhetorically* for restriction might be attempted, but applying it *consistently and rigorously* in the manner he demonstrated leads to inclusion. He would likely view restrictive textualism here as selective and outcome-driven, much like the interpretations he fought against.

  **Conclusion:**

  Frederick Douglass's anti-Garrisonian, anti-Taney textualism – prioritizing the neutral, inclusive language of the constitutional text itself, interpreted according to its common legal meaning and structure, while downplaying subjective framers' intent and past practice when they contradict the text – would lead him to **firmly reject** the argument that children born on U.S. soil to undocumented parents are not "subject to the jurisdiction" and thus not citizens. He would see the Citizenship Clause's words ("All persons born... in the United States") as creating a clear, inclusive rule based on birthplace (jus soli), with the "jurisdiction" clause serving a specific, limited exclusionary purpose for recognized categories based on legal doctrines of sovereignty, not immigration status. His method, forged to expand the definition of "We the People," is fundamentally at odds with using textual interpretation to create new exclusionary categories not present in the plain language. While both sides *invoke* textualism today, the *consistent application* of Douglass's specific historical method strongly supports the inclusive position.
