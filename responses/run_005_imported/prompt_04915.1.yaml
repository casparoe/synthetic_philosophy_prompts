prompt: |-
  been down a bit of a rabbit hole lately, tracing all the LW-adjacent talk about precommitment (Parfit's hitchhiker, commitment races, updateless decision theory type stuff) back to the actual philosophical literature on why a promise binds anyone in the first place. ended up reading Hume's actual Treatise section on it (3.2.5) instead of just the "Hume thinks its a convention" one-liner you get everywhere, and there's a bit in the middle I genuinely can't parse.

  he's trying to locate the specific "act of mind" that promising is supposed to consist in:

  "The act of the mind, exprest by a promise, is not a resolution to perform any thing: For that alone never imposes any obligation. Nor is it a desire of such a performance: For we may bind ourselves without such a desire, or even with an aversion, declar'd and avow'd. Neither is it the willing of that action, which we promise to perform: For a promise always regards some future time, and the will has an influence only on present actions. It follows, therefore, that since the act of the mind, which enters into a promise, and produces its obligation, is neither the resolving, desiring, nor willing any particular performance, it must necessarily be the willing of that obligation, which arises from the promise."

  and then in a footnote he goes after even that last remaining option:

  "To will a new obligation, is to will a new relation of objects; and therefore, if this new relation of objects were form'd by the volition itself, we shou'd in effect will the volition; which is plainly absurd and impossible. The will has here no object to which it cou'd tend; but must return upon itself in infinitum. The new obligation depends upon new relations. The new relations depend upon a new volition. The new volition has for object a new obligation, and consequently new relations, and consequently a new volition; which volition again has in view a new obligation, relation and volition, without any termination."

  I get his overall conclusion fine (promises are artificial/conventional, not natural, all that). what I can't reconstruct is the actual gears of the regress in that footnote. is he equivocating between two different senses of "willing" to manufacture the absurdity, or is this a real regress, structurally the same kind of thing as the regress problems people bring up in debates about epistemic justification? and even granting the regress, does it actually show that no act of mind could constitute a promise, or just that his specific candidate (willing-the-obligation-itself) doesn't work, leaving room for some other candidate he never even considers? would love it if someone who's actually sat with this section could walk me through the argument step by step, it feels like its trading on some kind of pun but i cant nail down where exactly.
