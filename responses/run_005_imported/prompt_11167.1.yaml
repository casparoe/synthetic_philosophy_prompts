  Noticing the user's phrasing ("weirdly insulated") suggests they suspect Hobbes might dodge these bullets. And they're right about non-Euclidean geometry - but Gödel lands a solid hit. Should emphasize that Hobbes' defense would likely involve retreating to "certainty within a chosen system" rather than absolute certainty. 

