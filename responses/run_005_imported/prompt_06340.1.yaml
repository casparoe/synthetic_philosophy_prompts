  The self-deception objection requires special handling. Need to distinguish between compartmentalized conflicting beliefs (which exist) and simultaneously holding "p and I don't believe p" as jointly affirmed commitments. Grandma's case is particularly poignant because dementia may disrupt the normal transparency mechanism, making her statement possible precisely because her self-knowledge faculty is compromised. 

