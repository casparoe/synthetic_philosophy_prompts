  Now, the key is distinguishing them. Al-Ghazālī grounds regularity in God's will—direct divine action each moment. Hume stops at psychology: custom and habit explain our expectation of cause-effect. That's the core divergence. The user wonders if this is just al-Ghazālī providing an answer where Hume stays silent. But it's deeper: occasionalism asserts metaphysical grounding (God), while Hume is agnostic. 

