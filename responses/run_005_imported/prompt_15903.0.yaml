answer: |-
  Here’s a draft of the eulogy, aiming for that raw blend of grief, pride, and unflinching honesty, spoken from the granddaughter's heart to the awkwardly mixed audience:

  **(Granddaughter stands, takes a breath. Her voice is steady but carries the weight of recent tears. She looks at the coffin, then scans the faces: family, the paper associate, the detective.)**

  Grandfather. It feels strange to stand here and try to sum you up. How do you capture a life lived so… deliberately? In the quiet corners? Most of you knew the man who taught me to whittle wood into birds, who could recite every line of *King Lear* by heart, who made the world’s most absurdly complicated pancakes on Sunday mornings. That man was real. Deeply, wonderfully real to me.

  And then… there was the work. The work in the studio upstairs. The work he rarely spoke of directly, but which filled the house with the smell of charcoal dust and old paper, and sometimes, a kind of fierce, quiet intensity. You felt it, didn’t you? Like a held breath.

  Some of you knew pieces of that world. Mr. Henderson, I know you saw the meticulous care he took, the reverence for the materials themselves. The paper wasn’t just paper; it was history he was trying to touch. Detective Marlowe… I suspect you saw the astonishing skill, the focus, the sheer… *audacity* of it. The mind that could walk backwards through centuries and see not just *what* was drawn, but *how* it was thought, how the hand might have moved. You chased a ghost, and maybe you respected the craft of the haunting.

  Family… you knew the man who came out of that studio. Sometimes tired, sometimes exhilarated, sometimes distant, as if part of him was still trapped in another time. You loved him anyway. We all did.

  Now, people talk about what he *did*. They talk about deception, about value, about museums and collectors. But standing here, looking at him… I keep thinking about what it *cost* him. Not the risk of being caught – though that was always there, a shadow in the corner. No. Something quieter. Something deeper.

  Imagine… imagine spending your life learning to speak with the voice of angels. Not just imitating, but *understanding* them so completely you could whisper with their tongue. Imagine pouring everything you are – your own eye, your own hand, your own aching love for line and light and shadow – into creating something… perfect. Something that captures not just an image, but a soul. A triumph. Your triumph.

  And then… you let it go. You watch it walk out the door. And the name it carries isn’t yours. It *can’t* be yours. Your signature would break the spell. It would ruin the very thing you poured your soul into.

  That’s the loss. Every single time. Not just anonymity, but a kind of… erasure. A silencing. His greatest skill, his deepest understanding, his most profound expressions… they were born orphans. He gave them life, and then he had to deny them. He had to deny *himself* in them.

  He wasn’t just copying. He was *conversing*. With Rembrandt. With da Vinci. With all those ghosts. He was saying, “Look, I see it. I feel it too. This beauty, this truth… I can touch it, I can *remake* it.” And the world only heard the echo of the original voice. It never heard *his* voice saying it.

  **(Her voice tightens slightly, a mix of defiance and sorrow)**
  He *was* a serious artist. A profound one. He had the vision, the discipline, the mastery. He just… never got to stand in his own light. He spent forty years painting masterpieces in a dark room, knowing they’d only be seen when someone else held the lamp and claimed its glow.

  **(She looks down at her hands, then back up, meeting the eyes of the different groups)**
  So what do we mourn today? We mourn the Sunday pancake chef, the storyteller, the quiet presence that anchored this family. We mourn the man who loved deeply, if sometimes distractedly.
  But we also mourn the artist who never got his own exhibition. The draftsman whose finest lines were credited to long-dead hands. The genius whose name history won’t know, because his genius was in disappearing completely into the work of others.

  **(Her tone softens, becomes more intimate, almost wondering)**
  The paradox is… maybe that *was* his art. Not just the drawing, but the vanishing. The perfect self-effacement. To create something so true to another’s vision that his own immense presence within it became invisible. Maybe that *was* the masterpiece. A lifetime spent mastering the art of absence within creation.

  **(She looks directly at the coffin, her voice thick with love and unresolved pain)**
  Grandfather… you left us with so much. Memories that are undeniably, wonderfully ours. And you left the world… mysteries. Objects of beauty bearing names not their own. Proof of a skill so vast it could hide itself completely. Proof that sometimes, the most astonishing light comes from a source that chooses to remain forever unseen.

  We saw you. We loved you. The man *and* the mystery. And today, we mourn both. We mourn the grandfather we held. And we mourn the artist the world never truly knew, whose signature was written in perfect, invisible ink on the soul of everything he touched.

  Rest now. Finally. Your own.

  **(She steps down, the silence heavy with the weight of her words.)**

  ---

  **Why this works for your needs:**

  1.  **Grief & Pride Intertwined:** It starts and ends with deeply personal, familial love and loss ("Sunday pancakes," "quiet presence"). The pride in his skill ("voice of angels," "profound artist," "astonishing light") is woven through the sorrow of the cost ("erasure," "silencing," "vanishing," "unseen").
  2.  **Addresses the Loss *to Him*:** The core paragraph ("Imagine…") explicitly frames the central loss: the denial of self in his own triumph. It’s not about the buyers' loss, but *his* loss of claiming his own creation.
  3.  **Acknowledges the Audience Nuances:**
      *   **Family:** Focuses on the man they knew, the duality ("man who came out of that studio"), the love that persisted. Uses relatable images (pancakes, whittling).
      *   **Associate (Henderson):** Acknowledges the craft, the reverence for materials ("paper wasn't just paper").
      *   **Detective (Marlowe):** Acknowledges the skill, audacity, and the "craft of the haunting" – a phrase that grants respect without endorsing the crime. The "ghost" metaphor works for both the detective's pursuit and the grandfather's artistry.
  4.  **Avoids Easy Answers:**
      *   Doesn't say "it didn't matter" (it did, deeply, to him). The loss is central.
      *   Doesn't excuse or fully condemn. It presents the cost as tragic, born from a profound, perhaps misguided, artistic drive.
      *   The "paradox" paragraph offers a complex interpretation ("art of vanishing") that isn't justification, but an attempt by the granddaughter to understand the *shape* of his life's work, acknowledging its unique, painful nature.
  5.  **Novel's Logic Honored:** It affirms that something genuine *was* lost – his own recognition, his artistic identity. It doesn't claim the forgeries were harmless because they were perfect; it claims they were *his* masterpieces, tragically disowned. The "invisible ink" metaphor captures this perfectly.
  6.  **Voice:** Uses emotional, concrete language ("smell of charcoal," "fierce, quiet intensity," "poured your soul," "orphans," "perfect, invisible ink"). Avoids philosophical jargon. The sentences vary in rhythm, mimicking natural, emotional speech – sometimes flowing, sometimes halting. The direct address ("Grandfather…", "Imagine…", "He *was* a serious artist") feels intimate and raw.
  7.  **Function as Keystone:** This eulogy ties together the granddaughter's journey of understanding her grandfather – the love, the discovery of his secret, the dawning comprehension of its personal cost, and her final, complex affirmation of his artistry despite its tragic form. It doesn't resolve the moral ambiguity; it holds it in tension with love and loss, which is the heart of the novel.

  **Tips for Integration:**

  *   **Weave in specific, small details:** Maybe mention the smell of the studio *by name* (e.g., "that particular scent of gum arabic and time"). Maybe reference one specific, harmless skill he taught her (like whittling) that contrasts with his hidden mastery.
  *   **Adjust the associate/detective names:** Use whatever names you have for them.
  *   **Read it aloud:** Time it, feel the rhythm. Adjust sentences that feel unnatural spoken. Let the pauses implied by line breaks and paragraph shifts breathe.
  *   **Consider her physicality:** Where does she look? Does she grip the podium? Does her voice break on a specific word ("orphans," "unseen")?

  This draft provides the emotional core and intellectual grappling you need. It allows the granddaughter to speak her painful truth – the profound love mixed with the profound understanding of a specific, devastating loss – directly to her grandfather and to the witnesses of his complicated life.
