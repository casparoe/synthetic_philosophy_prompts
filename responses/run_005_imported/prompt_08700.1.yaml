  The user's story needs to embed this concept subtly. No lectures or terms. Show, don't tell. The setting should be ordinary—modern daily life. The character slowly notices anomalies. Small at first, then escalating. The challenge is to make the weird events feel natural and unsettling, not chaotic.

  First, the protagonist. An office worker? Someone in a routine job, where predictability is expected. Maybe named Leo, as suggested. His job involves repetitive tasks, like data entry, emphasizing cause-effect expectations. His routine makes the anomalies stand out.

  Initial anomalies should be minor. Coffee not cooling as expected? But that's too passive. Maybe the coffee stays scalding hot longer, defying physics. Or his car not starting despite a new battery. Small glitches that make him doubt his senses.

  Escalation: Work-related issues. Printer jamming only when he's around. Then, personal items like his watch stopping. The microwave incident—popcorn unpopped but bag burnt. This introduces the "uncoupling" of cause and effect visually.

  Climax: His colleague Mira in a car accident that defies physics—engine cold despite the crash. This moment should be the turning point where the protagonist realizes the instability of reality.

  Ending: Not a solution, but a resigned acceptance. He can't fix it; it's beyond human control. The story closes on him observing mundane things, now aware of their fragility.

  Symbolism: Use everyday objects (coffee, printer, watch, microwave) to represent reliability. Their failure mirrors the philosophical breakdown. The title "Customary" ties into Ghazali's "custom of God."

  Avoiding exposition: No characters explain the philosophy. Leo's research (crash videos, physics forums) shows his confusion without stating the theory. His conclusions are vague, emphasizing helplessness.

  User's deeper needs: They want the philosophy woven into the narrative, creating existential dread. The story should unsettle by showing a world where predictability is an illusion, making the ordinary terrifying.

  Potential pitfalls: Ensuring anomalies aren't random but specifically show cause-effect breaks. Each incident must challenge a common assumption (heat burns, electricity powers devices). Balance subtlety with clarity so readers grasp the pattern without explanation.

  Final check: Story length 1200-1800 words. Modern setting. Protagonist's gradual realization. Ending with lingering unease. Title relevance. All met.
answer: |-
  ## Customary
  The coffee machine spat steam like an offended dragon. Leo pressed the button, listened to the familiar gurgle and hiss, and placed his chipped *World’s Okayest Data Analyst* mug beneath the spout. Black, no sugar. Predictable. Like the hum of the overhead fluorescents, the rhythmic clack of keyboards down the row, the way his car *always* started on the third try in winter. The world ran on grooves worn deep by repetition. Cause. Effect. Habit.

  He took the scalding mug back to his cubicle. Ten minutes later, needing a distraction from the spreadsheet abyss, he lifted it. Still searing. Unusually so. He frowned, blew across the surface. No wisp of steam rose. Tentatively, he touched the ceramic side. Cool. Room temperature cool. Yet when he risked a sip, the liquid inside scalded his tongue. He jerked back, spilling dark drops onto a quarterly report. The coffee *inside* was boiling hot, the mug itself felt like it had been sitting in the fridge. It made no sense. He stared at the mug, then the stain on the paper – two disconnected events sharing space, not consequence. A glitch. Must be.

  The next day, his car didn’t start. Not the usual winter protest – a sluggish groan, then life on the third crank. This was absolute silence. Dead battery? He’d replaced it last month. He called roadside assistance. The mechanic, a young guy named Dave with grease under his nails, hooked up the jumper cables, frowned, checked connections, frowned deeper. “Weird,” Dave muttered. “Battery’s fully charged. Terminals are clean. Starter relay’s clicking fine… but no crank. Like the juice just… doesn’t *want* to turn it over.” He jiggled wires, tapped the starter solenoid. Nothing. Then, as Dave leaned in for another look, the engine roared to life with a sudden, healthy rumble. Dave jumped back. “Whoa! Okay, that’s… something. Maybe a loose ground somewhere? Keep an eye on it.” Leo drove to work, the smooth purr of the engine feeling fragile, undeserved. The connection between key-turn and ignition felt arbitrary, a whim granted, not a law obeyed.

  At work, the anomalies grew bolder, quieter. He loaded paper into the communal printer, hit print. The machine whirred, lights blinked, rollers turned. Nothing emerged. He opened the tray. Empty. He checked the output bin. Empty. He canceled the job, reloaded the tray meticulously. Same result: mechanical pantomime without product. His colleague, Mira, walked over, printed her document without issue, the machine churning out pages smoothly. “Weird,” she said, glancing at Leo’s untouched tray. “Ghost in the machine?” Leo forced a laugh, but the feeling intensified: the printer *acted* like it was printing, but the result was severed from the action. Like a performance.

  His watch stopped. A reliable Seiko, worn daily for years. He tapped the crystal. Nothing. He took it off, shook it gently. Still dead. He placed it on his desk. An hour later, while wrestling with a recalcitrant formula, he glanced down. The second hand was sweeping smoothly again, showing the correct time. He hadn’t touched it. The stoppage and restart felt like isolated incidents, bookends without a narrative spine.

  Then came the microwave incident. Lunchtime. A bag of popcorn. Two minutes on high. The familiar roar of kernels exploding against the bag. *Pop-pop-pop-pop-pop…* then sudden, absolute silence halfway through the cycle. Not a slowing down, but an abrupt cessation, as if a switch had been thrown in a soundproof room. Leo stared through the greasy window. The bag sat there, plump but suspiciously still. He hit cancel. The timer read 1:07. He opened the door. No wave of buttery steam. He carefully pulled the bag out. It was warm, but only barely. He tore it open. Inside: mostly unpopped kernels, hard and pale yellow. Not burnt, not even properly heated. Yet the top corner of the bag *was* charred black, brittle to the touch. The heat had manifested *here*, but not *there*. The effect – popping, heating – hadn’t followed the cause – microwave radiation. It had flickered on and off capriciously, scorching the bag while leaving the kernels cold.

  A cold dread, deeper than confusion, began to pool in Leo’s stomach. It wasn’t just broken things. It was the *links* themselves that were fraying. The invisible threads stitching action to consequence were snapping, one by one.

  He found himself obsessively testing the fabric of reality. He’d flick a light switch on and off, watching the bulb obey instantly. He’d drop a pen, flinching as it hit the carpet. He’d stare at his reflection in the dark office window at night, watching his breath fog the glass – cause, visible effect. A desperate need to confirm the old rules still held *somewhere*. But the doubt was a stain spreading. What if the light obeyed *now*, but next time… didn’t? What if his reflection simply… failed to appear one night?

  The breaking point arrived on a rain-slicked Thursday evening. Leo was walking back from a late meeting, head down against the drizzle, when he heard the sickening crunch of metal on metal, followed by the shriek of tearing steel. He looked up, heart lurching. At the intersection ahead, a delivery van had T-boned Mira’s little blue hatchback. Her car was spun sideways, the driver's side caved in like crumpled foil. The van’s front end was embedded in the wreckage.

  Leo sprinted, fear icy in his veins. *Mira.* He skidded to a stop beside her mangled car, rain plastering his hair to his forehead. He expected steam, the smell of hot metal and oil, the groan of settling wreckage. He expected to see Mira slumped, broken, within the twisted frame.

  Instead, there was silence. No hiss of radiators. No dripping fluids. No groans from the metal. And Mira… Mira was wrestling with her seatbelt, her face pale but alert, eyes wide with shock but clear. “Leo?” she gasped, her voice shaky but strong. “What… what happened?”

  Paramedics arrived swiftly, cutting her free. Leo stood numbly in the rain as they checked her. Mira was shaken, bruised from the seatbelt impact, complaining of a sore shoulder, but otherwise miraculously unharmed. No broken bones, no concussion. Impossible, given the violence of the impact visible in the car’s ruin.

  Leo moved closer to the wreckage as the firefighters prepared to extract her. The van driver was unhurt, pacing and talking frantically to a cop. Leo touched the cold, wet metal of Mira’s door, twisted inwards like paper. He leaned closer to the gaping wound in the car’s side. No smell of gasoline. No heat radiating from the engine bay. He reached a hesitant hand towards the buckled engine block, half-expecting searing heat. It was stone cold. As cold as the rain soaking his collar.

  The van’s engine, still running, idled with a smooth, almost apologetic hum. Its radiator steamed faintly in the cool air. But Mira’s car… it was just… inert matter. Like a movie prop. The collision had *happened*. The kinetic energy transfer was visible in the catastrophic damage. But the consequences – the heat generation, the engine fire risk, the physical trauma to the driver – these had been… optional. Suspended. Mira had been violently thrown sideways, yet her body seemed untouched by the force that obliterated the steel cage around her. The link between cause and effect hadn’t just frayed here; it had dissolved entirely. The violence was real, the destruction undeniable, but the *results* felt arbitrarily assigned, like stage directions ignored.

  Leo drove Mira home later that night in a daze. Her apartment was warm, filled with the scent of the chamomile tea she insisted on making. She kept talking, processing the shock, marveling at her luck. “It’s crazy, Leo. One second I’m driving, the next… bang! And then I’m just… fine? Like it wasn’t real. But the car…” She shuddered.

  Leo nodded, sipping the tea she placed before him. It was hot. Deliciously, reliably hot. Steam curled predictably from the surface. He watched it rise, twist, and vanish into the air. A perfect, miniature chain of cause and effect: boiling water, hot liquid, steam, dissipation. It felt like a taunt.

  He stayed until she settled, then walked back to his own silent apartment. He didn’t turn on the lights immediately. He stood in the dark living room, listening to the hum of the refrigerator – a sound that suddenly seemed less like a machine working and more like a habit being politely maintained. He looked at the light switch. The simple act of flipping it felt like a gamble now. Would the circuit complete? Would the electrons flow? Or would the gesture be met with indifferent darkness, the connection severed for no reason other than… whim?

  He thought of the cold engine block in Mira’s totaled car. He thought of the coffee that burned without warming its cup, the popcorn bag charred while its contents remained cool, the printer that mimed its function flawlessly. He thought of the absolute silence that followed the crash – a silence that wasn’t just the absence of sound, but the absence of *consequence*.

  Leo didn’t flip the switch. He walked to the window and looked out at the city lights, a sprawling tapestry of habitual glows – streetlights, apartment windows, neon signs. They shimmered, constant, dependable. But Leo saw the scaffolding now. He saw the precariousness beneath the surface. The world wasn’t a machine governed by immutable laws. It was a performance. A vast, intricate performance running on borrowed consistency. A custom.

  And customs, he knew with a chilling certainty that settled deep into his bones, could be broken.
