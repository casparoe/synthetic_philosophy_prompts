prompt: |-
  so my philosophy of mind seminar just did a unit that lumped together nozick's experience machine, the old olds-and-milner rat self-stimulation experiments (lever-pressing instead of eating), and reward-tampering in RL agents, all under the label "wireheading." for the final assignment we have to role-play being on our university hospital's DBS ethics subcommittee and write the memo it would actually send on this case: a psychiatry/neurosurgery team wants approval for a closed-loop deep brain stimulation trial for treatment-resistant depression that stimulates reward circuitry, and on top of the automatic mood-triggered pulses they want to give patients a handheld button to self-trigger extra stimulation whenever they feel a dip -- basically a PCA pump for mood instead of pain.

  the subcommittee's split down the middle. half say it's just ordinary patient titration, no different from letting someone dose their own painkillers or insulin, and that blocking it is paternalism dressed up in scary AI vocabulary. the other half say that because its reward circuitry specifically, this is a genuine wireheading risk -- patients ending up optimizing for the button instead of for actually functioning, same as an agent that tampers with its own reward channel, or the rats that ignored food to keep pressing the lever.

  can you draft the memo the subcommittee would actually produce -- approve, reject, or approve with conditions, with the conditions spelled out if that's the call. it needs to genuinely engage the wireheading worry instead of waving it off as sci-fi, but it can't just dodge the autonomy point either, since we already let patients self-titrate plenty of other treatments. due monday and i honestly keep flip-flopping on it myself.
