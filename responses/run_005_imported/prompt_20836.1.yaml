answer: |-
  The air in the Cambridge drawing-room hung thick with pipe smoke and expectation. Henry Sidgwick adjusted his spectacles, the familiar ache behind his eyes – his ‘moral headache’, he sometimes privately called it – pulsing in time with the silence. Across the small, dimly lit table sat Madame Petrova, her eyes closed, breathing deep and theatrical. Eleanor, his wife, sat beside him, her hand a warm, steady pressure on his forearm. Frederic Myers leaned forward, notebook open, pencil poised, every line of his body taut with yearning. Edmund Gurney, quieter, observed with a watchfulness that mirrored Sidgwick’s own, though perhaps without the same crushing weight of consequence.

  A rap. Sharp, distinct, against the underside of the table. Sidgwick’s gaze, instantly analytical, scanned the surface. Solid mahogany. Madame Petrova’s hands rested palms down, visibly trembling, but crucially, *on* the surface. His own gloved hands rested lightly beside hers – a precaution against unconscious movement, a barrier against suggestion.

  *Tap-tap-tap.*

  Myers scribbled furiously. “Location?” he whispered.

  “South-east leg,” Sidgwick murmured, his voice low and precise. He shifted slightly, his boot finding the floorboard beneath the table leg. Solid. No give. No loose nail. He’d checked the room himself before the sitting, testing floorboards, windows, fireplace flue. Drafts? A faint chill near the window, but the raps were localized, directional. Not wind.

  Madame Petrova gasped. Her hand twitched, then began to move across the small slate placed before her. The pencil screeched, forming jagged loops, then coalescing into words: *...remember the willow... river... light...*

  Eleanor’s breath hitched. Sidgwick felt it. The willow by the Cam. Arthur. His brother, lost years ago. A pang, sharp and personal, cut through the analytical haze. *Could it?* The thought was a spark in the cold engine of his doubt. He leaned closer, not in hope, but in scrutiny. The handwriting – spidery, erratic. Similar to Arthur’s youthful scrawl under stress? Perhaps. Or perhaps merely the uncontrolled spasms of the medium’s own musculature, guided by expectation, by Eleanor’s soft gasp, by Myers’s palpable longing for connection beyond the veil.

  He watched Petrova’s wrist. Was there tension? A deliberate control masked as surrender? Her breathing hitched again. The pencil lurched: *...not gone... watch...*

  “Watch?” Myers breathed. “His pocket watch? The one mother gave him?”

  Sidgwick’s mind raced. Arthur *had* owned such a watch. Myers knew this. Petrova could have learned it, through gossip, through meticulous research by the Society’s own earnest investigators who, in their zeal, sometimes left trails. Or was it a lucky guess? A common token? He focused on the medium’s face. A bead of sweat traced her temple. Strain? Or the effort of performance?

  Another series of raps, louder now, circling the table. Sidgwick tracked them, his head turning with each percussive knock. *North-west corner. Center. Near Gurney.* He cataloged the possibilities: knee under the table? A thread? A mechanism in Petrova’s voluminous skirts? He’d insisted she wear simple, close-fitting clothing, but fabric could hide much. He’d *wanted* to find something. Needed to. Not for Arthur, not truly, but for the vast, terrifying architecture of his own reason.

  The dualism wasn’t a phrase in his head now; it was the iron band constricting his temples, the hollow feeling beneath his ribs. *Be benevolent. Sacrifice.* Reason commanded it. *Preserve thyself.* Reason equally commanded it. Only proof – empirical, undeniable proof – of a universe where those paths converged, where the scales were ultimately balanced by a cosmic justice, could break the deadlock. Proof of *persistence*. Proof that Eleanor’s faith, Myers’s desperate hope, weren’t beautiful illusions. Proof that the universe wasn’t ultimately… indifferent.

  The pencil screeched violently. Petrova’s body jerked. The slate filled with frantic, overlapping script: *Henry... seek... bridge... gap... close... light...*

  His name. His life's work – the bridge between intuition and reason, the gaping chasm of the dualism. *Close the gap.* His heart hammered against his ribs, a traitor to his skepticism. Was it *too* perfect? A reflection of his own consuming preoccupation, picked up by a sensitive mind? Or…?

  He moved, swift and silent. Not towards the slate, but down. He dropped below the table level, his gloved hand sweeping the space beneath, feeling for wires, threads, any physical connection. His fingers brushed only air, dust, the smooth legs of the chairs. He emerged, his face impassive, but Eleanor saw the minute tightening around his eyes. Disappointment? Or the confirmation of a different, colder truth?

  Petrova slumped, breathing heavily. “Fading…” she whispered. “The light… too far…”

  The raps subsided. The scratching stopped. The room settled back into heavy silence, broken only by the ticking of the mantle clock – a sound suddenly loud and mocking in its mundane certainty.

  Myers looked devastated, staring at the fragmented, promising-yet-inconclusive words on the slate. Gurney closed his notebook with a soft sigh. Eleanor squeezed Sidgwick’s arm again, a gesture of shared burden, not shared belief.

  Sidgwick removed his spectacles, polishing the lenses slowly, deliberately. The ache behind his eyes was a familiar companion, a physical manifestation of the irreducible conflict. He looked at the slate, at the words *‘gap’* and *‘close’* and *‘light’*. Almost. So agonizingly almost. Enough to tantalize Myers, to comfort Eleanor for a moment, to make Gurney ponder. But for him? It lacked the one thing he demanded: the unassailable signature of the *other* side, something impossible to fake, impossible to explain away by the cunning of the living or the vagaries of the subconscious mind.

  He saw the hope drain from Myers’s face, replaced by a familiar, weary frustration. He saw Eleanor’s quiet acceptance. He felt the weight of the unanswered question, the abyss of the dualism yawning beneath the polished surface of his reason.

  “Well, Henry?” Myers asked, his voice thick. “Any thoughts?”

  Sidgwick replaced his spectacles. His gaze swept the room once more – the ordinary furniture, the slightly dishevelled medium, the expectant faces of his friends, his wife. The evidence, such as it was, lay scattered, ambiguous. The universe, in this small, smoke-filled room, remained stubbornly mute on the only question that truly mattered.

  He met Myers’s eyes, then looked down at his own gloved hands, instruments of detection that found only the tangible, the explainable. A faint, almost imperceptible tremor ran through them.

  “Not this time, Frederic,” he said, his voice flat, final. The words tasted like ash. “Not this time.” The darkness beyond the drawn curtains seemed to press closer, not hiding spirits, but the profound, unsettling silence of a cosmos offering no guarantees. The true phantom haunting the room was the unresolved equation of his own philosophy, and the séance, like all the others, had failed to materialize its solution. Only later, much later, long after Henry and Eleanor and Frederic and Edmund were gone, would fragmented messages – scripts on slates in London, whispers in Paris, automatic writing in New York – bearing their names and obscure, interlocking references begin to surface, a posthumous puzzle no single medium could have faked. But that eerie coda belonged to another, colder chapter. Tonight, in the close, disappointed air, there was only the silence, the smoke, and the relentless, unanswered question echoing in Henry Sidgwick’s meticulous mind.
