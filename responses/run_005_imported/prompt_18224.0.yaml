  *checks charter again* "Due care" is vague—perfect! Lets me argue the author *did* show care via narrative structure (indicting prejudice), but the judges *also* show care by addressing fallout. Win-win. 

  Biggest risk: The statement could feel tokenistic. Solution? Specify it's read at ceremony and printed in winner materials. Shows institutional responsibility. 

  Final memo tone: Respectful but decisive. Opening praises ambition, middle dissects the debate fairly, conclusion recommends award+statement as charter-aligned. No smugness. 

