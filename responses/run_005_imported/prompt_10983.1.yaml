    "S": [],
    "A": [
      "Paracomplete contextualism (Burge/Simmons/Glanzberg): Contextualism avoids revenge by allowing the extension of 'true' to shift dynamically. The strengthened liar (e.g., 'This sentence is not true in any context') self-destructs because quantifying over all contexts is blocked by the theory's inherent context-relativity. New revenge attempts trigger meta-contextual shifts rather than inconsistency."
    ],
    "B": [
      "Gupta-Belnap revision theory: Revision rules generate a non-hierarchical, circular truth predicate where liar variants exhibit periodicity (oscillating truth values) rather than paradox. Strengthened liars like 'This sentence is never stably true' are absorbed as unstable sentences within the revision process—problematic but contained via the theory's fixed evaluation metrics for transient states.",
      "Tarski's hierarchy: The object/metalanguage barrier blocks standard and strengthened liars by disallowing uniform 'true' predicates. Revenge emerges only via deliberate hierarchy violations (e.g., trying to formulate 'true in all levels'), which the theory dismisses as ill-formed. While artificial, this imposes principled expressivity constraints."
    ],
    "C": [
      "Kripke's fixed-point theory: Kripke neutralizes the standard liar using truth-value gaps, but the strengthened liar ('This sentence is not true') exploits the gap by being true if gappy. Revenge reappears as inexpressibility: Kripkean 'truth' cannot define its own gap (e.g., no consistent predicate for 'gappy' exists without metalanguage escalation)."
    ],
    "D": [
      "Deflationism about truth: Deflationism (e.g., Horwich) treats truth as insubstantial, offering no intrinsic resolution to the liar. Strengthened variants recur identically since 'not true' is just disquotational—any ad hoc patch (e.g., 'non-propositional') invites further revenge via predicates like 'substantially non-true'.",
      "Priest's dialetheism: Priest accepts the liar's contradiction (both true and false) but the strengthened liar ('This sentence is only false') creates a 'revenge glut': if true-and-false, it's also only false, spawning higher-order contradictions. Paraconsistent logic avoids explosion but proliferates embedded paradoxes without containment."
    ]
  }
  ```

  ### Key Justifications:
  - **Contextualism (A)**: Highest tier because it weaponizes the revenge liar against itself—contextual parameters prevent the formation of "omni-contextual" predicates needed for revenge.  
  - **Revision Theory & Tarski (B)**: Contain revenge via procedural mechanisms (revision cycles/hierarchy) that transform it into a manageable technical feature, not a fatal flaw.  
  - **Kripke (C)**: Partial success against the standard liar, but strengthened versions expose the theory's inability to *describe its own gaps* without external scaffolding.  
  - **Deflationism & Dialetheism (D)**: Deflationism lacks resources to resist revenge; dialetheism "solves" it by drowning in worse contradictions. Both regenerate the problem with minimal disguise.  

  ### Verdict for Your Debate:
  - Your friend's Kripkean view (C) **indeed surrenders to revenge** via inexpressible gaps.  
  - Your pushback about "same problem one level up" is validated against deflationism/dialetheism (D), but **contextualism (A) and revision theory (B) arguably deflect revenge more effectively** by redesigning truth's logical architecture. Tarski (B) remains divisive—hierarchies feel "ad hoc" to some, "principled" to others.  

