answer: |-
  You've hit on a crucial nuance in Rousseau's critique! He *is* making two distinct but deeply interconnected arguments, both stemming from his core concept of **amour-propre** and his view of authentic existence. Here's the breakdown:

  1.  **The Psychological/Moral Argument (Losing the Self):**
      *   **Core:** Acting involves deliberate *inauthenticity*. The actor consciously divorces their inner state from their outward expression. They *manufacture* emotions ("growing passionate in cold blood"), adopt beliefs they don't hold ("saying what he does not think as naturally as if he really thought it"), and essentially *become* someone else ("forgetting his own place by dint of taking another's").
      *   **Rousseau's Fear:** This constant self-counterfeiting is corrosive. It fragments the self, erodes the connection between inner feeling and outward expression, and habituates the actor to deception. For Rousseau, authenticity – the alignment of inner sentiment, thought, and action – is paramount for individual virtue and moral health. Acting systematically destroys this alignment. It's not just "pretending," it's a professionalized, internalized *habit* of disconnection.

  2.  **The Economic/Social Argument (Selling the Self):**
      *   **Core:** The actor commodifies their very being. They "put themselves on display for money," making their *persona* and *emotional expressions* a product for sale ("publicly puts his own person up for sale"). They subject themselves to the whims and judgments of an audience ("submits to the disgrace and affronts that others purchase the right to inflict on him"), making their self-worth contingent on public approval and payment.
      *   **Rousseau's Fear:** This is the ultimate corruption by **amour-propre**. Amour-propre is the socially derived sense of self-worth, distinct from natural self-love (*amour de soi*). While some social interaction is inevitable, the actor's profession makes them *radically dependent* on the opinions and payments of others for their very livelihood and sense of identity. This dependence is inherently "servile and base" for Rousseau because it represents the complete alienation of the self – selling not just labor, but one's *emotional reality* and *public identity* to strangers. It turns the self into a tool for external validation and profit.

  **How Are They Connected? (The Amour-Propre Bridge)**

  Rousseau sees these two arguments as two sides of the *same* corrupting coin, linked by **amour-propre**:

  1.  **The Psychological Enables the Economic:** The actor's *ability* to dissociate their inner self from their performance (the psychological skill) is precisely *what* they sell (the economic transaction). Without the capacity for inauthenticity, there's no product to commodify.
  2.  **The Economic Exacerbates the Psychological:** The *need* to sell oneself for money intensifies the psychological harm. The actor isn't just occasionally pretending; they are *compelled* to do it professionally, constantly, and for the approval of paying strangers. This deepens the habit of inauthenticity and makes the actor's sense of self-worth entirely dependent on successfully performing this disconnection. The economic pressure amplifies the moral corruption.
  3.  **Amour-Propre as the Root:** Both arguments stem from Rousseau's central concern about how society corrupts natural man through inflamed amour-propre. Acting is an *extreme manifestation* of this corruption:
      *   The psychological aspect shows the *internal* corruption: the self fragmented and made inauthentic to satisfy amour-propre (the desire for applause, success).
      *   The economic aspect shows the *external* manifestation and reinforcement: the self literally becomes a commodity traded to satisfy the amour-propre of others (the audience's desire for spectacle, emotion) and the actor's own amour-propre (need for validation/income). The "trafficking of himself" is the ultimate act of alienation driven by inflamed amour-propre.

  **Addressing Your Friend (Goffman vs. Rousseau):**

  Here's how you can counter the "we're all performing" argument using Rousseau:

  *   **"Yes, Goffman points out we play social roles. Rousseau would agree *society forces this* to some degree, and he saw *that* as inherently problematic! But he makes a crucial distinction:**"
  *   **Degree and Conscience:** Everyday social roles often involve *adaptation* or *moderation* of genuine feeling for social cohesion (e.g., being polite when tired). The actor's performance is *radically different*: it's the *deliberate creation and embodiment of a complete fiction*, often involving extreme, fabricated passions, for the explicit purpose of *deception* (making the audience believe the fiction is real).
  *   **Motivation & Alienation:** While we might perform roles out of necessity, convention, or even mild self-interest, the actor performs *professionally* – their *livelihood* depends on successfully selling this inauthentic self. This creates a unique level of *alienation* – the commodification of the self Rousseau finds so degrading ("servile and base").
  *   **Systemic Harm:** Rousseau isn't *just* worried about the actor's soul. He fears theater *as an institution* corrupts society:
      *   It encourages passive spectatorship over active civic engagement.
      *   It makes audiences value artificial, vicarious emotion over genuine experience and virtue.
      *   It glorifies and rewards the very inauthenticity he despises, setting a dangerous cultural example ("Why strive to be good when pretending well gets applause?").
  *   **Core Difference:** Goffman describes social performance as a *neutral* (or even necessary) mechanism of interaction. Rousseau sees deliberate performance, *especially* professionalized acting, as *inherently morally corrosive* to the individual and society because it severs the vital link between inner truth and outer expression, driven by and feeding the worst aspects of amour-propre.

  **Your Comeback:**

  "Rousseau *does* agree we perform socially, but he sees that as part of society's corrupting influence! His attack on acting is specific and extreme because it combines two poisonous elements: 1) **Professionalized Inauthenticity:** Actors make a *craft* of systematically divorcing their inner self from their outer expression, fragmenting their own identity. 2) **Commodification of the Self:** They literally *sell* this disassociated persona for money and applause, making their worth utterly dependent on pleasing strangers – the ultimate 'servile' act fueled by corrupted amour-propre. While Goffman observes social performance, Rousseau condemns acting as its most dangerous, institutionalized form, actively eroding both individual authenticity and civic virtue. He wasn't just against theater; he saw actors as tragic symbols of how society alienates us from our true selves."

  This moves you beyond "some Frenchman agrees" to highlighting Rousseau's specific philosophical framework (amour-propre, authenticity, alienation) and his unique, harsh critique of acting as a profession that embodies his deepest fears about social corruption.
