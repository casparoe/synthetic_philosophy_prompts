prompt: |-
  I sit on my hospital's clinical ethics committee. A patient in our deep-brain-stimulation trial for treatment-resistant depression signed an advance directive before implantation stating that any request to deactivate the device (a simple reprogramming, not further surgery) would be honored only after a mandatory 30-day waiting period, since she didn't trust her depressed self to judge the treatment fairly. Eight months in, she is symptom-free and thriving by every clinical measure, but has now asked, calmly and consistently across three visits, to have the stimulation turned off -- not because of relapse, but because she says she no longer recognizes herself, and would rather be "the difficult, vivid person I was" than the calmer person the device has made her. Her 30 days run out next week. This strikes me as a nastier cousin of the "transformative experience" problem (L.A. Paul's term) that gets kicked around on rationalist blogs in the context of choices like having a kid: the question here isn't whether she could have foreseen the change, but whether the self who signed the directive and the self now revoking it count as the same authority. Roughly half the committee wants to honor the directive exactly as written, since this is precisely the contingency it was drafted for; the other half thinks its authority lapsed the moment the treatment succeeded on its own terms. Please draft the committee's decision memo: a concrete recommendation with a timeline for when the 30 days run out, and a genuine, fair treatment of whichever side the memo doesn't adopt.
reasoning: |-
  Okay, let me approach this clinical ethics dilemma systematically. The core tension revolves around identity and autonomy - specifically whether the patient's pre-treatment directive or current expressed wishes should govern her DBS deactivation request. 

  First, I need to map the key timeline elements: the 30-day waiting period expires next week, and the patient has made three consistent requests over an unspecified but clinically significant period (given eight months post-implant). The committee's split seems philosophical - one side views the advance directive as a precommitment strategy against depressive distortion, while the other sees therapeutic success as fundamentally altering the directive's applicability.

  The patient's stated reason - preferring her "difficult, vivid" former self over the device-mediated calm - introduces novel considerations. This isn't treatment failure but identity disruption, raising questions about authenticity that weren't contemplated in the original directive. The memo must reconcile two autonomy frameworks: precedent autonomy (the directive) versus current autonomy (her requests), while acknowledging that her depression-free state was the directive's explicit goal.

  I should structure the recommendation to:
  1) Honor the waiting period as a procedural safeguard since it hasn't expired
  2) Schedule deactivation immediately upon expiration
  3) Mandate intensive evaluation during the remaining days
  4) Explicitly reject the argument that therapeutic success voids the directive

  The rationale must validate both committee perspectives: affirming the directive's wisdom in preventing impulsive decisions during depression, while conceding that identity-altering outcomes require contemporary consent. The "fair treatment" clause means thoroughly representing the minority view that success negates the directive's purpose, though I find this unconvincing given the non-relapse context.

  Notably, the patient isn't refusing treatment but reclaiming a prior identity state - a nuance the original directive didn't address. The memo should emphasize that while the directive anticipated depressive distortion, it couldn't anticipate this particular outcome, making rigid adherence ethically problematic once new information emerges.
answer: |-
  ## Clinical Ethics Committee Decision Memorandum  
  **Re: Patient X — DBS Deactivation Request & Advance Directive**  
  *Date: [Current Date]*  

  ### I. RECOMMENDATION  
  The Committee recommends that the patient’s DBS device **be deactivated upon expiration of the 30-day waiting period** specified in her advance directive (next week, [Date]). However, the following conditions must be met prior to deactivation:  
  1. **Immediate Comprehensive Re-Evaluation**: Conduct neuropsychiatric, psychosocial, and identity-integrity assessments within the next 48 hours.  
  2. **Final Informed Consent Session**: Hold one last meeting with the patient, her care team, and an independent ethics consultant before deactivation to confirm her understanding of risks (e.g., depression relapse) and explore alternatives (e.g., stimulation parameter adjustments).  
  3. **Post-Deactivation Support Plan**: Implement a crisis-monitoring protocol for ≥6 months.  

  **Timeline**:  
  - **Day 0 (Now)**: Initiate re-evaluation.  
  - **Day 2**: Complete assessments; hold consent session.  
  - **Day 7 ([Date])**: Proceed with deactivation if patient maintains request.  

  ---

  ### II. RATIONALE FOR HONORING THE DIRECTIVE  
  The majority supports adhering strictly to the advance directive for these reasons:  
  1. **Precommitment as Autonomy**: The directive embodies the patient’s *precedent autonomy*—a deliberate safeguard against the "depressed self’s" distorted judgment she explicitly distrusted. Revoking it now would invalidate her prior, lucidly expressed values.  
  2. **Procedural Fidelity**: The 30-day clause was designed precisely for this contingency—requests during apparent stability. Waiving it risks paternalism by presuming the committee better understands her identity than she does.  
  3. **Clinical Consistency**: Her current identity distress ("no longer recognizes myself") aligns with the directive’s concern that acute depressive relief might obscure long-term self-conception. Her calm persistence suggests this is not impulsive.  

  ---

  ### III. FAIR TREATMENT OF THE MINORITY VIEW  
  The minority position—that the directive’s authority lapsed upon therapeutic success—deserves serious consideration:  

  **Argument Summarized**:  
  When the patient signed the directive, her "depressed self" was the threat to autonomy. Now, a *new* self—forged by successful treatment—seeks to reclaim a pre-treatment identity she describes as more "vivid." The directive binds a self that no longer exists, and its conditions (distrust of depressive judgment) are irrelevant to her current state. Honoring it forces an identity she rejects onto her present autonomous self. Therapeutic success fundamentally alters the ethical landscape; insisting on adherence prioritizes past autonomy over present lived experience.  

  **Acknowledged Strengths**:  
  This view rightly centers the patient’s *current* voice and the profound, unforeseeable nature of identity disruption. It highlights a limitation of advance directives: they cannot perfectly bind future selves transformed by successful interventions.  

  **Why Not Prevail?**:  
  While compelling, this argument risks *undermining advance care planning* by allowing third parties to void directives based on subjective assessments of "success" or identity continuity. The directive’s 30-day buffer exists to ensure such identity shifts are enduring and not transient states—a safeguard the patient herself deemed necessary. Waiving it sets a precedent that could erode trust in future directives.  

  ---

  ### IV. RESOLUTION  
  **The directive governs.** Its 30-day period is a *deliberative safeguard*, not a paternalistic hurdle. The patient’s present distress does not invalidate her prior wisdom that major decisions require reflection. However, the committee:  
  - **Affirms** her right to stop treatment once the waiting period ends.  
  - **Urges** the care team to explore identity-focused therapy *during* the remaining days, respecting her insight that DBS may have traded symptom relief for authenticity.  
  - **Emphasizes** that this decision honors *both* her past and present autonomy: the directive she crafted to protect her future self, and the self-determination she exercises after due reflection.  

  ---

  *Vote: 7–5 in favor of recommendation*  
  *Authored by: [Your Name/Chair], Clinical Ethics Committee*  
  *Distribution: Care Team, Patient, Medical Record*  

  --- 

  **Key Ethical Anchors**:  
  - **Non-Identity Problem Addressed**: The directive bridges "past self" and "present self" by insisting on reflection, avoiding privileging one over the other.  
  - **Transformative Experience Nuanced**: While deactivation may be another transformation, the patient has had 8 months to evaluate this new self—and 30 days to reconsider rejection.  
  - **Procedural Justice**: The process respects both her foresight (directive) and her current voice (post-wait deactivation).
