  For the memo structure: background, researcher's argument, skeptics' rebuttal, analysis, recommendations. The analysis should evaluate if ECLW is distinct and how to prevent misuse. Principled use requires specific conditions: large worlds, cooperative counterparts, symmetric reasoning. Without these, it risks becoming unfalsifiable.

