prompt: |-
  Okay this is a weird one but it's been stuck in my head for weeks, and I think it's actually relevant to my behavioral econ seminar even though we haven't covered this exact kind of case yet (we've mostly done rational choice basics and a bit of heuristics-and-biases so far this semester).

  So my aunt and uncle have been in this ongoing legal fight with their next door neighbor over a strip of shared driveway, like two feet of pavement, tops, for almost two years now. It started as a small disagreement, but every time the neighbor's lawyer files something new, my uncle feels like he has to hit back just as hard or it'll look like he's caving, so he does, and then the neighbor escalates again, and so on. Last I heard they'd spent something like $50-60k combined on legal fees over a driveway strip that's maybe worth a few thousand dollars, if that. Whenever anyone in the family suggests they just settle and move on, my uncle gets defensive and says stuff like "we can't stop now, not after everything we've already put into this," even though he's also admitted he probably wouldn't even care about the driveway if the neighbor hadn't fought back so hard in the first place. It's pretty clearly not about the two feet of pavement anymore.

  I mentioned this whole saga to my roommate, who's in the same seminar, and she was like "that's just sunk cost fallacy, he's being dumb," but that feels too quick to me as an explanation. Like, does the fact that theres another party actively escalating against him change what the "rational" move even is, compared to if he were just alone deciding whether some fixed cost was worth paying? And why does walking away seem to get harder the more has already been spent, when logically it should arguably get easier, since the amount left to lose by continuing keeps growing too? Genuinely curious what's going on here both psychologically and game-theoretically, beyond just labeling it a bias and moving on, since that doesn't explain why it happens or whether the neighbor's caught in the exact same trap.
