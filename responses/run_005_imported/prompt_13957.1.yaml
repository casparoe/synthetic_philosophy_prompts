  Hmm, this is a deep metaphysical debate. The user seems quite knowledgeable about philosophy - they're referencing Armstrong, Frege, Russell, and Bradley competently. Their frustration comes from feeling the core problem isn't addressed by Armstrong's "tie." I should validate that while building the case.

