answer: |-
  I'll argue rigorously for your position: Armstrong's "non-relational tie" is a metaphysical *label*, not a *solution*, to Bradley's regress. It fails to explain factual unity without either collapsing into a relation (triggering the regress) or covertly relying on Fregean unsaturatedness or Russellian relating-activity. If it avoids both, it merely renames the problem. Here's the breakdown:

  ### 1. **The Core Problem: Explaining "Real Unity"**
     Bradley's regress exposes a fundamental question: How do distinct entities (a particular + a universal) combine to form a *single*, unified fact (e.g., "Socrates is mortal"), rather than just a list ("Socrates", "mortality")? Merely positing a "tie" (T) binding them doesn't answer *how T achieves this unity*. If T is:
      - **Relational**: It requires a further connector (T') to bind it to Socrates and to mortality, launching the regress.
      - **Non-Relational**: We need an account of *how* a non-relational entity can *bind* two other entities into a whole without itself being a relatum or requiring further binding.

  ### 2. **Why Armstrong's "Tie" Fails as a Primitive**
     Armstrong asserts the tie (instantiation) is a fundamental, non-relational, non-relational entity. But this faces a dilemma:
     - **Option A: The Tie Has Unifying "Power"**  
       If the tie *actively unifies* Socrates and mortality, it must have an intrinsic *nature* or *structure* that enables this. But:
       *   If its nature involves *directedness* or *dependence* (e.g., it "hooks onto" Socrates in one way and mortality in another), it **smuggles in Frege's unsaturatedness**. The tie behaves *as if* it has gaps shaped for its relata. Yet Armstrong explicitly rejects universals being unsaturated!
       *   If its nature involves *causal* or *dynamic* unifying action, it **smuggles in Russell's "relating relation"**. The tie isn't inert; it *actively relates*. But then why isn't *this action* relational? If it's primitive, we face the same question: how does *this action* attach to its terms?
     - **Option B: The Tie Lacks Unifying Power**  
       If the tie is a simple, inert, non-relational entity merely *co-occurring* with Socrates and mortality (e.g., "Socrates, mortality, T"), then **no genuine unity is achieved**. We have three distinct entities, not the fact *Socrates-is-mortal*. This is Bradley's original point: adding more entities (even a "tie") without explaining *composition* yields a list, not a whole.

  ### 3. **The Covert Reliance on Frege or Russell**
     Armstrong *must* attribute *some* unifying feature to the tie to avoid Option B. This inevitably leans on one of the moves you identified:
     - **Fregean Move (Unsaturatedness by Another Name):**  
       The tie *must* be "incomplete" in a way that *demands completion* by a particular and a universal. It cannot exist independently of its relata; its essence is to bind. This is Frege's unsaturatedness transferred to the tie. Armstrong rejects this for universals but reinstates it surreptitiously for his tie. The tie becomes a *de facto* unsaturated entity connecting saturated ones.
     - **Russellian Move (Activity by Another Name):**  
       The tie *does something* – it isn't just present, it *forges a connection*. This implies an irreducible *activity* or *function* of unification. Russell insisted relations must "actually relate." If Armstrong's tie actually unifies, it *is* a relating entity in Russell's sense. But then, how is *this activity* attached to its relata? The regress reignites.

  ### 4. **The Stipulation Trap & Renaming the Problem**
     If Armstrong insists his tie avoids *both* unsaturatedness *and* active relating, then:
     - He offers **no positive account of unification**. He merely *stipulates* that the tie "just is" what binds particulars and universals. This is an explanatory dead end.
     - The problem of "how distinct entities form a unity" **isn't solved; it's renamed "instantiation" and declared primitive**. Bradley's challenge ("Explain the unity!") is met with "It's unified by the unifier!" – a tautology. The regress is stopped by fiat, not by explanation.
     - This violates the **principle of sufficient reason** at the metaphysical level. *Why* does this specific tie unify *these* entities into *this* fact? If the answer is "It just does, primitively," we have no deeper understanding than before.

  ### 5. **The Inescapable Need for Structure or Activity**
     True unity requires either:
     - **Internal Structure (Frege):** Entities have complementary "shapes" (saturated/unsaturated) that fit together intrinsically. Armstrong rejects this for universals/particulars.
     - **External Activity (Russell):** A dynamic component (a relation that *relates*) actively synthesizes the elements. Armstrong denies his tie is relational.
     - **Holistic Primacy (Bradley):** Facts are prior to their constituents; analysis into distinct "particular," "universal," and "tie" is ultimately misleading. Armstrong rejects monism.

  Armstrong's tie tries to be a fourth option: a structureless, inactive, non-relational binder. But without structure or activity, **it cannot *do* anything**. It cannot *bind*. Calling it a "tie" is metaphorical; metaphysically, it remains an inert entity alongside the others. Bradley's regress isn't solved; it's concealed under a label that *masks* the need for explanation. The unity of the fact remains as mysterious as ever.

  **Conclusion:** Your critique is sound. Armstrong's "non-relational tie" cannot explain factual unity without implicitly relying on Fregean unsaturatedness or Russellian activity. If it avoids both, it provides no explanation at all – merely renaming the problem "instantiation" and declaring it fundamental does not constitute a solution to Bradley's regress. The tie either *functions* relationally (reigniting the regress), *mimics* unsaturatedness/activity (contradicting its non-relational status), or remains inert (failing to unify). The core problem of unity remains unresolved.
