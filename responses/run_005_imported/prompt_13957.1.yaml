  I notice the user wants me to expose how Armstrong's solution might be circular. If the tie is fundamental, we can't question how it unifies - but that's exactly what needs explaining! Calling it "non-relational" doesn't magically make unification happen. Either the tie has unifying properties (which brings us back to relations) or it doesn't (which leaves unity unexplained).

