prompt: |-
  Last night a friend and I had a long, and ultimately unresolved, argument about Newton's bucket, and I would like some help settling the specific point where we got stuck. We agreed on the basic shape of the bucket experiment: at two different moments the water is not moving at all relative to the vessel it sits in (once at the very start, when both are still, and again once the water has caught up to the spinning bucket), and yet its surface is flat on the first occasion and concave on the second, so whatever explains the concavity cannot simply be the water's motion relative to the bucket. Where we diverged was over the passage that follows two paragraphs later — Newton's less-discussed example of two globes joined by a cord and set revolving in empty space. My friend thinks this is just the bucket argument restaged for effect, since the philosophical work was already finished; I think it is doing something the bucket cannot do on its own, since a relationist can always answer the bucket by relocating the relevant "container" the water is really rotating relative to — from the vessel, to the room, to the earth, to the system of the fixed stars — so that the case for absolute space needs some independent way of blocking that regress, which seems to be exactly what stipulating an "immense vacuum" containing nothing but the two globes is meant to do. Neither of us could walk through the text closely enough to say who had the better of it, so I have copied out both passages below, from the Scholium to the Definitions in the *Principia*, in Andrew Motte's 1729 translation as revised by Florian Cajori (I have skipped the short paragraph XIII in between, a purely terminological aside on how the words "time, space, place, and motion" are ordinarily used, and trimmed a couple of closing sentences from paragraph XII where Newton digresses against the Cartesian vortex theory of the heavens):

  > XII. The effects which distinguish absolute from relative motion are, the forces of receding from the axis of circular motion. For there are no such forces in a circular motion purely relative, but in a true and absolute circular motion, they are greater or less, according to the quantity of the motion. If a vessel, hung by a long cord, is so often turned about that the cord is strongly twisted, then filled with water, and held at rest together with the water; thereupon, by the sudden action of another force, it is whirled about the contrary way, and while the cord is untwisting itself, the vessel continues for some time in this motion; the surface of the water will at first be plain, as before the vessel began to move; but after that, the vessel, by gradually communicating its motion to the water, will make it begin sensibly to revolve, and recede by little and little from the middle, and ascent to the sides of the vessel, forming itself into a concave figure (as I have experienced), and the swifter the motion becomes, the higher will the water rise, till at last, performing its revolutions in the same times with the vessel, it becomes relatively at rest in it. This ascent of the water shows its endeavor to recede from the axis of its motion; and the true and absolute circular motion of the water, which is here directly contrary to the relative, becomes known, and may be measured by this endeavor. At first, when the relative motion of the water in the vessel was greatest, it produced no endeavor to recede from the axis; the water showed no tendency to the circumference, nor any ascent towards the sides of the vessel, but remained of a plain surface, and therefore its true circular motion had not yet begun. But afterwards, when the relative motion of the water had decreased, the ascent thereof towards the sides of the vessel proved its endeavor to recede from the axis; and this endeavor showed the real circular motion of the water continually increasing, till it had acquired its greatest quantity, when the water rested relatively in the vessel. And therefore this endeavor does not depend upon any translation of the water in respect of the ambient bodies, nor can true circular motion be defined by such translation. There is only one real circular motion of any one revolving body, corresponding to only one power of endeavoring to recede from its axis of motion, as its proper and adequate effect; but relative motions, in one and the same body, are innumerable, according to the various relations it bears to external bodies, and like other relations, are altogether destitute of any real effect, any otherwise than they may perhaps partake of that one only true motion.
  >
  > XIV. It is indeed a matter of great difficulty to discover, and effectually to distinguish, the true motions of particular bodies from the apparent; because the parts of that immovable space, in which those motions are performed, do by no means come under the observation of our senses. Yet the thing is not altogether desperate; for we have some arguments to guide us, partly from the apparent motions, which are the differences of the true motions; partly from the forces, which are the causes and effects of the true motions. For instance, if two globes, kept at a given distance one from the other by means of a cord that connects them, were revolved about their common centre of gravity, we might, from the tension of the cord, discover the endeavor of the globes to recede from the axis of their motion, and from thence we might compute the quantity of their circular motions. And then if any equal forces should be impressed at once on the alternate faces of the globes to augment or diminish their circular motions, from the increase or decrease of the tension of the cord, we might infer the increment or decrement of their motions; and thence would be found on what faces those forces ought to be impressed, that the motions of the globes might be most augmented; that is, we might discover their hindmost faces, or those which, in the circular motion, do follow. But the faces which follow being known, and consequently the opposite ones that precede, we should likewise know the determination of their motions. And thus we might find both the quantity and the determination of this circular motion, even in an immense vacuum, where there was nothing external or sensible with which the globes could be compared. But now, if in that space some remote bodies were placed that kept always a given position one to another, as the fixed stars do in our regions, we could not indeed determine from the relative translation of the globes among those bodies, whether the motion did belong to the globes or to the bodies. But if we observed the cord, and found that its tension was that very tension which the motions of the globes required, we might conclude the motion to be in the globes, and the bodies to be at rest; and then, lastly, from the translation of the globes among the bodies, we should find the determination of their motions. But how we are to obtain the true motions from their causes, effects, and apparent differences, and the converse, shall be explained more at large in the following treatise. For to this end it was that I composed it.

  Could you help me reconstruct, step by step, what these two paragraphs are actually arguing? I am especially interested in three things: first, exactly what licenses the move, within paragraph XII itself, from the local claim that the water's ascent cannot be explained by its motion relative to the vessel, to the much more general conclusion, stated in the paragraph's final sentence, that this endeavor "does not depend upon any translation of the water in respect of the ambient bodies" at all; second, whether the stipulated "immense vacuum" in paragraph XIV genuinely defeats a relationist strategy of individuating rotation relative to the bulk of matter in the universe, or merely assumes that strategy away by removing all the matter such a strategy would need to appeal to; and third, what the second scenario Newton then adds, in which "remote bodies" resembling the fixed stars are reintroduced, is doing that the vacuum case on its own had not already accomplished. Finally, I would be glad to hear which of the two readings my friend and I were defending you find better supported by the text, and whether it matters for how later relationist responses — from Leibniz, through Mach, to contemporary defenses of substantivalism such as the hole argument — are best understood as objections to this particular Scholium, rather than to some later, tidier reconstruction of what Newton is supposed to have argued.
