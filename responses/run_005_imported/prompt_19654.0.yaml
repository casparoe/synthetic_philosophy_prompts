  Maya's closing mic-drop about transplant programs collapsing if we admit biological life persists is powerful but risks being an appeal to consequences rather than truth. Both miss key points: Maya underplays how brain death tests vary, while Devon ignores that biological integration without neural activity may not constitute "life" in any meaningful sense. 

