  Starting with move (1): Maya's "brain death is death" stance. Legally she's unassailable - all 50 states recognize brain death as legal death. But Devon's counter in (2) about prolonged somatic survival introduces nuance. Those cases exist, though they're rare. Maya's rebuttal in (3) about "outsourced integration" makes physiological sense - ventilator-driven functions aren't evidence of life. 

