answer: |-
  ## MEMORANDUM  
  **To:** Giving Circle Allocation Committee  
  **From:** [Your Name]  
  **Date:** October 26, 2023  
  **Subject:** Analysis & Recommendation: Impact Litigation Funding Proposal  

  ### I. Proposal Summary  
  Priya has presented an opportunity to fund impact litigation with the following terms:  
  - **Stake:** Up to $90k (50% of our $180k fund)  
  - **Outcomes:**  
    - 60% chance: Settlement/win → **200% return** (e.g., stake $90k → get back $180k)  
    - 40% chance: Dismissal → **100% loss** (e.g., stake $90k → get back $0)  
  - **Frequency:** Similar opportunities arise 2–3 times/year through Priya’s contact.  

  ### II. Core Question  
  **What portion of our fund (if any) should we allocate to maximize our long-term impact?**  

  ### III. Two Competing Frameworks  
  We must weigh two mathematical approaches:  

  #### **A. The "Growth Maximization" (Kelly Criterion) Approach**  
  *Why it matters:* If we treat this as one of many repeated bets, we should size bets to avoid catastrophic losses while compounding gains.  
  - **Logic:** Betting too much risks blowing up the fund; betting too little leaves growth potential unused.  
  - **Calculation for this bet:**  
    - Win probability (*p*) = 60%  
    - Win payoff (*b*) = 1.0 (i.e., "double" means 100% gain)  
    - **Kelly Fraction** = *p* – [(1 – *p*) / *b*] = 0.60 – [(0.40) / 1.0] = **0.20 (20%)**  
  - **Recommendation:** Bet **$36k** (20% of $180k).  
  - **Why?**  
    - Betting 20% *maximizes the fund’s long-term growth rate* if we face many similar opportunities.  
    - Betting Priya’s suggested 50% would be reckless:  
      - If we lose (40% chance), we’d have only $90k left—severely limiting future opportunities.  
      - Even if we win, the risk of ruin isn’t justified by the extra upside.  

  #### **B. The "Expected Value Maximization" Approach**  
  *Why it matters:* If every dollar we grant does equal good (regardless of fund size), and we’re truly risk-neutral altruists, we should maximize expected dollars.  
  - **Logic:** Since a marginal dollar saves a life whether we have $10k or $100k, "losing everything" isn’t uniquely catastrophic.  
  - **Calculation for this bet:**  
    - Expected Value (EV) = (0.60 × 2×Stake) + (0.40 × $0) = **1.2×Stake**  
    - EV is *always positive* and scales linearly with stake size.  
    - **Recommendation:** Bet **$90k** (50% of fund).  
  - **Why?**  
    - A $90k bet has an EV of **$108k** (1.2 × $90k) vs. $72k for a $60k bet.  
    - If we’re risk-neutral, the higher EV dominates—even with a 40% chance of losing everything.  

  ### IV. Key Tensions & Practical Realities  
  1. **"Risk-Neutral Altruism" is Theoretically Sound but Practically Fraught:**  
     - While a malaria net saves a life equally at any fund size, **losing 50%+ of our capital** would:  
       - Delay grants to proven partners (e.g., AMF, Against Malaria Foundation) by 12–24 months.  
       - Destroy our ability to act on *other* high-impact opportunities.  
     - **Bottom line:** True risk-neutrality requires infinite funding sources. We don’t have that.  

  2. **The "60% Win Chance" is an Estimate, Not a Guarantee:**  
     - Priya’s contact has a conflict of interest (they profit if we fund this).  
     - Litigation is inherently uncertain—40% dismissal risk may be optimistic.  

  3. **This Isn’t a Repeatable Casino Game:**  
     - Kelly assumes hundreds of identical bets. We get ~2–3 chances/year.  
     - One bad outcome could cripple us before "long-run averages" materialize.  

  4. **Impact Asymmetry:**  
     - **If we win:** We gain extra dollars to grant (high impact).  
     - **If we lose:** We lose not just money, but **trust, flexibility, and momentum** with partners.  

  ### V. Recommendation & Options  
  | **Option**       | Amount  | Pros                          | Cons                          |  
  |------------------|---------|-------------------------------|-------------------------------|  
  | **Full Kelly (20%)** | **$36k** | Maximizes growth; preserves capital | Lower upside than larger bets |  
  | **Compromise (25%)** | $45k    | Balances growth/EV concerns   | Still significant risk        |  
  | **Priya’s Ask (50%)**| $90k    | Highest EV if risk-neutral    | 40% chance of catastrophic loss |  

  **I recommend: $36k (20% of fund).**  
  - **Why not 50%?** The 40% ruin risk is unacceptable for a charity with active commitments.  
  - **Why not $0?** The EV is compelling, and litigation could unlock systemic change.  
  - **Why 20%?** It respects both math and mission:  
    - Anchors to the only objective standard for bet sizing (Kelly).  
    - Keeps the fund intact for core global health work.  
    - Allows participation without existential risk.  

  ### VI. Voting Options  
  1. **Approve $36k** (20%) for this case.  
  2. **Approve up to $45k** (25%) if due diligence supports higher confidence.  
  3. **Reject the proposal** (if litigation is misaligned with our mandate).  

  ---  
  **Final Note:** This is a high-risk, high-reward opportunity. While expected value arguments have intellectual merit, **charities aren’t hedge funds**. Our duty is to preserve capital for proven interventions while *cautiously* testing new models. A 20% stake achieves this balance.  

  **Recommended vote: ✅ Option 1 ($36k).**
