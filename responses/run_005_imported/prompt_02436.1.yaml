  1) The complete concept theory: Each individual (like Caesar) has a concept containing all their predicates. But this doesn't make actions necessary—just certain given God's choice of this world. 
  2) The necessity spectrum: Absolute necessity (logical must) vs. hypothetical (conditional on God's choice). 

