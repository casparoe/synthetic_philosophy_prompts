  For the novel, the drama could hinge on Leibniz framing God as an artist, not a tyrant: The sculptor analogy (marble veins constrain but don't determine form) makes this visceral. And the user's excerpt about Judas shows how Leibniz turns the screw—evil exists only as a dark contrast making goodness legible. 

