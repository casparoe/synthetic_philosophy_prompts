  I was grabbing coffee with a friend of mine last week who's finishing up her philosophy PhD (metaphysics of causation, dispositions, all that) and she was venting about a referee report on her paper that kept insisting she hadn't properly distinguished "finks" from "masks" as objections to what she called the simple conditional analysis of dispositions — the basic idea that something's being fragile just amounts to the fact that it would break if struck, that kind of thing. I nodded along for a while but I was pretty lost, and she's the type who'll quiz me on it next time we hang out, so I'd rather actually understand it than fake my way through.

  Could you actually walk me through, in some real detail, what the difference between a finkish disposition and a masked disposition is? I gather the classic fink case is something like a live wire hooked up to a device that kills the current the instant something touches it (or Lewis's version with a sorcerer who changes a glass's molecular structure the moment its struck so it never breaks), while the mask case is more like a poison paired with an antidote, or a fragile glass thats bubble-wrapped so it survives being dropped. What I don't get is why these count as two genuinely different problems for the conditional analysis rather than just two flavors of the same "something intervened" trick — and why people say David Lewis's fix (the "reformed" analysis where you build in that the causal basis has to stick around) rescues the analysis from finks but is generally agreed to still choke on masks. If you can work in why anyone outside a metaphysics seminar should care — I have a vague memory of her mentioning this mattering for whether "could have done otherwise" can ever be given a conditional/dispositional analysis in free will debates — that'd be great too.
