answer: |-
  ## The Unanchored Anchor: Can Rorty's Anti-Representationalism Hold His Liberal Hope?

  Richard Rorty’s vision in *Contingency, Irony, and Solidarity* is undeniably seductive, especially for novelists. His core thesis – that novels, not philosophy, are the primary engines of moral progress by vividly redescribing suffering and thereby expanding our sense of "us" – offers a powerful validation for the craft of storytelling. Yet, as you’ve pinpointed with Norman Geras’s trenchant critique, this vision seems perched precariously on a contradiction: **How can Rorty, having dynamited the foundations of universal moral truth and representational correspondence, consistently claim that the *expansion* of solidarity is "progress," rather than merely one contingent redescription among countless others, including its contraction?** This isn't a debater's trick; it strikes at the heart of Rorty's project. While his anti-representationalism and liberal hope share pragmatic roots, a consistent application of the former ultimately hollows out the normative force Rorty desperately wants to retain for the latter. Rorty cannot have his anti-foundationalist cake and eat his progressive solidarity too without smuggling in the very universalism he rejects.

  **Rorty's Dismantling: The World Well Lost**

  Rorty's anti-representationalism is radical. He argues that language doesn't "mirror" an independent reality; our beliefs aren't "true" by corresponding to some objective moral or metaphysical structure. Instead, vocabularies are tools – contingent historical artifacts forged for specific purposes like coping with the world or coordinating social behavior. "Truth," then, is simply what our peers let us get away with saying within a given linguistic community. There is no "Nature's Own Vocabulary," no "Moral Fabric of the Universe" to which our redescriptions must correspond to be valid. When we redescribe cruelty – like your neighbors turning away from the undocumented family – we aren't revealing a deeper moral truth; we're offering a new tool, a new way of talking, hoping it "catches on" because it better serves our purposes, primarily the reduction of suffering.

  **The Novel as Engine: Redescription and Sentimental Education**

  This is where the novel shines, according to Rorty. Abstract philosophy arguing for "human dignity" based on Reason or God fails to move us. Novels, however, perform "sentimental education." By immersing us in the particular, concrete suffering of individuals unlike ourselves – like the undocumented family facing abandonment – they trigger empathy and imagination. *Huckleberry Finn* doesn't *prove* slavery is wrong through syllogisms; it makes Jim's humanity inescapably *felt*. This felt connection, Rorty argues, is how the circle of "us" historically expands. We redescribe "those people" as "people like us in their capacity for suffering." This redescription gains traction not because it matches a pre-existing moral reality, but because it resonates, it *works* to reduce pain and humiliation. It becomes part of our liberal "final vocabulary."

  **Geras's Challenge: Progress Without a Yardstick?**

  Norman Geras zeroes in on the tension: **If there's no common humanity, no universal moral truth "out there," what makes the *expansion* of solidarity inherently "progressive"?** If all redescriptions are contingent tools, why is the tool of "inclusive solidarity" *better* than the tool of "tribal exclusion" used by your fictional neighbors? Rorty wants to say their closing ranks is cruel, regressive. But on what basis, beyond his own contingent preferences embedded in his liberal vocabulary? A consistent anti-representationalist, Geras argues, can only say: "This redescription (inclusion) serves *my* purposes (reducing suffering as *I* define it) better than that one (exclusion)." But this is merely a statement of preference, not a judgment of moral *correctness*. For the neighbors who prioritize cultural homogeneity or perceived economic threat, *their* redescription (exclusion) serves *their* purposes perfectly well. Rorty has no transcendental ground on which to stand and declare their purposes *wrong*, only *different*. His "progress" dissolves into mere change he happens to favor.

  **Rorty's Pragmatic Defense (and Why it Falters)**

  Rorty anticipated this. His defense is relentlessly pragmatic and historicist:

  1.  **Suffering as the Pragmatic Anchor:** The *only* universal (though not foundational) benchmark is the avoidance of *cruelty* and *suffering*. We don't need a metaphysical grounding to agree that pain is bad; it's a brute fact of sentient existence. Redescriptions that minimize gratuitous suffering are simply *more useful* for beings like us who feel pain.
  2.  **"We Liberals" as the Starting Point:** Rorty doesn't claim objectivity. He speaks *from within* the contingent tradition of Western liberalism. *Within this tradition*, expanding solidarity *is* progress because it aligns with our core commitment to reducing suffering. It's not True, it's *ours*, and we hope others find it persuasive.
  3.  **Consequences Matter:** The redescription promoting inclusive solidarity demonstrably leads to less humiliation, less pain, and more flourishing for more people *in practice* compared to exclusionary models. This practical consequence justifies calling it "better."

  **The Fatal Flaw: The Unavoidable Presupposition of "We"**

  While elegant, this defense ultimately fails under the weight of its own anti-representationalism:

  1.  **The "Suffering" Dodge:** Defining progress solely by the reduction of "suffering" presupposes a universal capacity *to* suffer that demands moral consideration. But Rorty explicitly rejects "common humanity" as a metaphysical foundation. *Why* should the suffering of the undocumented family matter *to the neighbors* if there's no shared moral fabric? Rorty must implicitly rely on a universal capacity for suffering *as a morally relevant fact*, even as he denies having such foundations. The neighbors can simply redescribe the family's suffering as irrelevant, deserved, or even necessary for *their* (the neighbors') flourishing.
  2.  **The Circularity of "Our" Tradition:** Arguing from *within* "our liberal tradition" only pushes the problem back. *Why* is *this* tradition, with its commitment to expanding solidarity, preferable? Rorty can only say it better serves *our* purposes (reducing suffering). But this begs the question: Why are *those* purposes ("reducing suffering for an expanding 'us'") the right ones? He offers no non-circular justification. A different tradition (e.g., one prioritizing racial purity or religious orthodoxy) defines "purpose" and "suffering" differently. Rorty has no anti-representationalist tool to critique their definitions as *wrong*, only as *different and less appealing to him*.
  3.  **The Contingency of Consequences:** Rorty bets that inclusive societies are more stable and produce less suffering long-term. But this is a contingent historical wager, not a necessary truth. History is littered with "successful" exclusionary, cruel societies. If a community thrives (by its own lights) through exclusion and cruelty – perhaps feeling *less* suffering internally by externalizing it onto outsiders like the undocumented family – Rorty's pragmatic calculus cannot consistently label this "worse." He can only say *he* doesn't like it. Anti-representationalism severs the necessary link between *his preferred consequence* (inclusive flourishing) and *moral rightness*.

  **The Cost: Hope Adrift**

  The cost of Rorty's consistency is high: **He must relinquish the vocabulary of moral *progress* in any objective or universally binding sense.** He can only speak of historical *changes* in moral vocabulary, some of which he *hopes* will spread because they align with *his contingent, liberal desire to minimize cruelty*. His "cheering" for expanding solidarity is just that – cheering, rooted in sentiment and hope, not in a claim about its inherent correctness or its alignment with a truth beyond our descriptions.

  **The Verdict: The Incompatible Core**

  Therefore, **a consistent anti-representationalist *cannot* coherently claim that expanding solidarity represents moral "progress"** in a way that objectively condemns its contraction, as in your novel's premise. To call the neighbors' actions *regressive* or *wrong* rather than merely *different* or *unfortunate by his lights*, Rorty *must* implicitly appeal to a universal standard – the inherent wrongness of cruelty based on a shared capacity for suffering demanding respect – that his anti-representationalism explicitly denies. Geras is correct: Rorty wants the normative force of universalism while disavowing its foundations. This is unsustainable.

  **What Remains: The Power of Hope and the Novelist's Task**

  This doesn't junk Rorty's core insight about novels. They *are* uniquely powerful tools for sentimental education. Making cruelty vivid *is* how empathy often spreads, contingently reshaping "us." Rorty's *description* of how moral change *often happens* remains compelling. His *prescription* to use redescription for liberal ends is a powerful call to action. And his *hope* for expanding solidarity is noble.

  **For you, the novelist, the conclusion isn't despair, but clarity:** Your novel about the neighbors won't *prove* their actions are universally Wrong. But it can make their cruelty unbearably *vivid*, challenging the reader's current "us," and offering a compelling redescription where the undocumented family's suffering *matters*. You work within the contingent realm of persuasion, not proof. Rorty empowers you by showing this realm is where the real moral work gets done, even if he can't ultimately ground its direction in anything firmer than shared human sentiment and the pragmatic desire to lessen pain. Write your novel not as a treatise on Moral Truth, but as a devastatingly effective act of redescription, aiming to expand the circle of "us" one reader's imagination at a time. That’s the power Rorty rightly celebrates, even if his philosophy can't fully anchor its ultimate justification.
