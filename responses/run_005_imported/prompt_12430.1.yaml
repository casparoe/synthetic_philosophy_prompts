answer: |-
  Here's a steel-manned argument addressing your core concern about Markovits's Coincident Reasons Thesis (CRT), its persistence under Sliwa's amendment, and the need for Arpaly's substantive responsiveness:

  **Steel-Manned Markovits's Coincident Reasons Thesis (CRT):**

  Markovits's core insight is that moral worth requires the agent's *motivating reasons* (the reasons *for which* they act) to be identical to the *normative reasons* (the reasons that actually make the action right). She argues this dissolves Smith's fetishism objection because:

  1.  **Focus on Substance, Not Label:** The agent is motivated *directly* by the right-making features (e.g., relieving suffering, keeping a promise), not by a *de dicto* desire "to do the right thing." Their concern is *de re* – directed *at* the suffering itself or the promise itself, not *at* the abstract property of rightness.
  2.  **Coincidence vs. Belief:** Crucially, CRT does *not* require the agent to *believe* their motivating reasons are the right-making ones, nor to believe the action is right. An agent can be motivated *solely* by the pain of another (the right-making feature) and act virtuously, even if they are ignorant of moral theory or hold false moral beliefs.
  3.  **Avoiding Over-Intellectualization:** This avoids requiring agents to have explicit moral concepts or complex beliefs about rightness for their actions to have moral worth, making the account more plausible for everyday virtuous action (e.g., spontaneous kindness).
  4.  **Conflation Diagnosis:** Markovits argues Smith conflates *having* the right motivating reasons with *believing* they are the right reasons. CRT separates these: moral worth requires the *former*, not necessarily the latter. The virtuous agent is motivated by the *features* that *are* good, not by the *thought* that they are good.

  **The Indistinguishability Problem: A Decisive Flaw for CRT?**

  Your worry exposes a critical gap: CRT seems insufficient to distinguish *genuine moral concern* from *accidental alignment* driven by reliable but non-moral dispositions. Consider these cases:

  1.  **The Reliable Empath (Non-Moral):** Imagine an agent, Eira, neurologically "wired" via advanced (but non-moral) conditioning or technology to reliably feel intense distress at the sight of suffering and a powerful, overriding impulse to relieve it. She acts *solely* to remove this distressing stimulus *from her own experience*. Her motivating reason is "to stop *my* feeling of distress caused by this suffering." Coincidentally, the suffering is also the right-making feature. CRT seems forced to grant Eira's action moral worth because her motivating reason (eliminating suffering-as-distressing-her) coincides with the normative reason (eliminating suffering *simpliciter*). Yet, intuitively, Eira lacks moral concern; she's merely self-centeredly removing an aversive internal state. Her reliability stems from non-moral wiring, not moral character.
  2.  **The Fastidious Rule-Follower (Non-Moral):** Consider Ben, raised with obsessive-compulsive rigidity to follow specific social rules (e.g., "always tell the truth," "always keep promises"). He follows these rules *purely* out of a deep-seated, non-moral compulsion for order and rule-adherence, feeling intense anxiety if he deviates. When he tells the truth, his motivating reason is "to adhere to the rule 'tell the truth' and avoid anxiety." Coincidentally, truth-telling is often the right-making feature. CRT grants moral worth. But Ben seems morally inert; his action stems from pathological compulsion, not responsiveness to the *value* of honesty or its role in relationships.

  **Why is this a Decisive Problem?**

  *   **Loss of the Moral Character Nexus:** Moral worth is supposed to reflect well on the *agent's moral character*. CRT, in these cases, attributes worth to actions springing from sources utterly disconnected from moral understanding, appreciation, or valuation. Eira and Ben are moral weathervanes, not moral agents.
  *   **Emptying "Virtue" of Meaning:** If reliably coinciding reasons are sufficient, then sophisticated robots, perfectly conditioned animals, or psychologically disordered individuals could exhibit "virtue" without any trace of moral psychology. This divorces moral worth from the agent's practical reasoning and evaluative stance.
  *   **Conceding the *Spirit* of Fetishism?:** While avoiding the *de dicto* fetish, CRT risks allowing a *structural* fetishism. The agent isn't fetishizing "rightness," but their motivation is still mediated by an internal, non-moral state (distress, anxiety, compulsion) *caused by* the right-making feature, rather than being directly responsive *to the value of* that feature. The right-making feature is merely the *trigger* for a non-moral drive, not the *object* of moral concern.

  **Steel-Manned Sliwa's Knowledge-Based Amendment & Why It Fails to Resolve It:**

  Sliwa argues moral worth requires not just coincidence, but that the agent **knows** that her motivating reasons are the right-making reasons (or that her action is right). This adds an epistemic condition:

  1.  **Knowledge as the Differentiator:** Sliwa contends that knowledge ensures the agent isn't just *acting on* the right reasons, but *appreciates* that they *are* the right reasons, linking motivation to moral understanding. This supposedly excludes cases of accidental coincidence.
  2.  **Addressing the Counterfactual:** The knowledgeable agent would (typically) act differently if the reasons weren't right-making, demonstrating a sensitivity to moral considerations.

  **Why Sliwa's Amendment Doesn't Solve the Indistinguishability Problem:**

  The problem persists because **knowledge can be purely descriptive and motivationally inert**:

  1.  **Eira the Knowledgeable Empath:** Suppose Eira (the wired empath) is *also* taught moral theory. She *knows* that suffering is bad and relieving it is right. However, her *motivation* remains unchanged: she still acts *solely* to quell her own intense distress. The knowledge is cognitively present but plays *no role* in motivating her action. She would act identically without the knowledge because her wiring drives her. Sliwa's condition is met (she knows her reason – relieving suffering – is right-making), but her motivation remains non-moral self-interest. The knowledge doesn't transform the *source* or *character* of her motivation.
  2.  **Ben the Knowledgeable Rule-Follower:** Ben learns that truth-telling is morally right. Yet, his compulsion remains the sole motivator. He knows his reason (adhering to the truth-telling rule) is right-making, but this knowledge doesn't *constitute* or *inform* his motivation; it's a separate cognitive state. He acts from compulsion, not because he understands or values the *moral importance* of truthfulness. His knowledge is epiphenomenal to his motivation.
  3.  **The Gap Between Knowledge and Motivation:** Sliwa links the *content* of knowledge to the *content* of motivation (both refer to the right-making reasons), but she doesn't require that the *knowledge itself* plays a motivating role or that the agent's motivation *expresses* that knowledge. The knowledge can be "tagged on" to a motivation driven by entirely non-moral springs. The motivational source remains opaque to the epistemic condition. An agent can *know that* X is a right-making reason while being motivated *by X* for utterly non-moral reasons.

  **The Necessity of Arpaly's Substantive Responsiveness:**

  Arpaly argues moral worth requires that the agent's action is motivated by a **consonant mental state** that is **responsive to the right-making features of the action *as such***.

  1.  **Responsiveness to Normative Weight:** The agent's desires/beliefs must be sensitive to the *actual normative weight* of the reasons. It's not enough to be moved *by* the feature; one must be moved *in proportion* and *because of* the *moral significance* it possesses. Eira isn't responsive to the *badness of suffering for the sufferer*; she's responsive to *her own distress*. Ben isn't responsive to the *value of truth*; he's responsive to *rule-compliance*.
  2.  **Constitutive Link:** For Arpaly, the motivation *just is* the responsiveness. A desire with moral worth *is* a desire that tracks the moral reasons. The "wiring" or disposition *must itself* be a form of moral appreciation or concern. It needs to be the *right kind* of disposition – one that inherently involves grasping (even if non-consciously) the evaluative landscape.
  3.  **Distinguishing the Cases:** Arpaly's framework clearly excludes Eira and Ben:
      *   **Eira:** Her disposition responds to suffering *only as a cause of her distress*, not *as a moral bad*. Her desire to relieve suffering isn't *consonant* with the moral reason; it's consonant with her desire for self-comfort. She's not responsive to the right-making feature *as a right-making feature*.
      *   **Ben:** His compulsion responds to truth-telling *only as an instance of rule-following*, not *as a moral good*. His desire isn't responsive to the moral value of honesty; it's responsive to the abstract requirement of rule-adherence. He lacks the requisite responsiveness to the normative weight of the reasons.
  4.  **Addressing the Counterfactual Robustly:** An agent with Arpaly-style responsiveness would not only act *on* the right reasons but would be *disposed* to act on them *because* of their moral weight. If the moral weight changed (e.g., a situation where truth-telling caused immense harm without justification), the truly responsive agent would be sensitive to this and potentially *not* tell the truth. Ben would tell the harmful truth due to compulsion; Eira wouldn't act unless *her* distress was triggered. The Arpalyan agent's motivation tracks the *underlying moral reality*, not just the surface feature or a rigid rule.

  **Conclusion:**

  Your central move is potent. Markovits's CRT, while successfully avoiding the *de dicto* fetish, fails to establish a necessary link between the agent's motivation and *moral character* by allowing motivation driven by reliable but non-moral dispositions to coincidentally align with right-making reasons. Sliwa's knowledge amendment, though adding a valuable epistemic layer, fails to bridge the gap because knowledge can be motivationally inert and fail to transform the underlying *source* or *nature* of the motivation. Only an account like Arpaly's, which builds substantive *responsiveness to the normative weight of the right-making features themselves* into the very definition of the motivation that confers moral worth, can reliably distinguish the genuinely virtuous agent (whose desires track moral reasons *as moral reasons*) from the merely reliably coincidental agent (whose desires track the features for non-moral reasons). This responsiveness is constitutive of moral concern and anchors moral worth firmly in the agent's evaluative engagement with the world, not just in the alignment of internal states with external facts. Your chapter correctly identifies this as the crucial frontier in defending a non-fetishistic Kantianism or any account of moral worth against Smith's challenge.
