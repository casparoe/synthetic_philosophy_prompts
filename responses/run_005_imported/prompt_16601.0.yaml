  Let me structure this carefully. First, the Kripkensteinian should establish why communal assertability isn't just a fallback but a necessary condition—attacking McDowell's "mysterious" capacities. Then McDowell must counter by showing how the skeptical solution implicitly accepts the skeptic's terms. For the solitary case, McDowell needs concrete examples of how an isolated individual could display genuine rule-following without collapsing into private language, while the skeptic presses how we'd distinguish competence from random behavior. 

