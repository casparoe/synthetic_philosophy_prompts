  The user's phrase "earn its keep" suggests McDowell's account needs to prove its explanatory power in the solitary case. So I'll have him describe specific practices—like error recognition and adaptive responses—that manifest understanding non-mysteriously. The skeptic can then question whether those behaviors truly require normativity rather than just dispositions. 

