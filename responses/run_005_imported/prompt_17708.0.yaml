  The model works by having the hidden variable distribution depend on the settings in a way that it "knows" which settings are being used and adjusts to give the correct correlation.

  This is the conspiracy: the particle pair (or the hidden variable) is correlated with the settings that the experimenters will choose.

  Now, to your question: is there a principled asymmetry that makes this kind of fine-tuned correlation a worse cost than abandoning factorizable locality?

  Many physicists and philosophers would argue that the measurement independence assumption is very natural. It is often motivated by the idea of "free will" or the idea that the experimenters can choose the settings freely and independently. But even without free will, the assumption can be seen as a methodological principle: that the settings are chosen by a random process that is independent of the hidden variables.

  The model above is very artificial. It requires that the distribution of λ changes in a very specific way for each setting pair. In particular, if there were more settings, the number of distributions to define would grow.

  Moreover, if the settings are chosen by a quantum random number generator that is space-like separated, then any common cause in the past would have to be very old and very fine-tuned to anticipate the specific settings to be chosen. This is seen as conspiratorial.

  In contrast, abandoning factorizable locality (as in orthodox quantum mechanics) means that there is a nonlocal influence. This is also counterintuitive, but it is a different kind of cost.

  Some argue that the measurement independence is more sacred because it is a precondition for doing science: if the hidden variables can correlate with the settings, then we might be misled in any experiment. This is sometimes called the "no conspiracies" assumption.

  However, there are retrocausal models that violate measurement independence in a time-symmetric way. In such models, the settings chosen by the experimenters can influence the hidden variables in the past (retrocausally). Then the correlation between the settings and the hidden variables is not due to a common cause in the past, but because the future settings affect the past.

  In that case, the "conspiracy" is not a fine-tuning of initial conditions, but a dynamical time-symmetric law. Some philosophers of physics (like Huw Price) have argued that this is not as bad as a conspiracy.

  But others might say that any violation of measurement independence is equally bad, regardless of the mechanism.

  In your dissertation, you might want to explore whether the retrocausal escape is genuinely different. In a retrocausal model, the correlation between the settings and the hidden variable is not set at a common past event, but is the result of the future settings reaching back in time to affect the hidden variable. This might avoid the charge of fine-tuning because the initial conditions of the universe wouldn't need to be set to anticipate the settings. Instead, the settings themselves would have a causal influence on the hidden variable.

  However, retrocausality is a radical idea and may have its own challenges.

  In summary, the toy model above shows how the violation of measurement independence can reproduce the quantum correlations while maintaining factorizability. The cost is a settings-dependent distribution of the hidden variable, which is seen by many as conspiratorial. Whether this cost is worse than nonlocality is a matter of debate and may depend on one's metaphysical commitments.
