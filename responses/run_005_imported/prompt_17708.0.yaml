  ### Concrete Toy Model Violating Measurement Independence

  I'll construct a toy model for the CHSH scenario that maintains factorizability (i.e., each outcome depends only on its local setting and the hidden variable) but violates measurement independence by correlating the hidden variable distribution with the experimenters' choice of settings. This model will reproduce the quantum predictions for the singlet state, including the maximum CHSH violation of \(2\sqrt{2}\).

  #### **CHSH Setup and Quantum Predictions**
  - Alice's settings: \(a = 0^\circ\), \(a' = 90^\circ\)  
  - Bob's settings: \(b = 45^\circ\), \(b' = 135^\circ\)  
  - Outcomes: \(A, B \in \{+1, -1\}\)  
  - Quantum correlations (singlet state):  
    - \(E(a,b) = -\cos(45^\circ) = -\frac{\sqrt{2}}{2}\)  
    - \(E(a,b') = -\cos(135^\circ) = +\frac{\sqrt{2}}{2}\)  
    - \(E(a',b) = -\cos(45^\circ) = -\frac{\sqrt{2}}{2}\)  
    - \(E(a',b') = -\cos(45^\circ) = -\frac{\sqrt{2}}{2}\)  
  - CHSH expression:  
    \[
    S = |E(a,b) - E(a,b') + E(a',b) + E(a',b')| = \left| -\frac{\sqrt{2}}{2} - \frac{\sqrt{2}}{2} + \left(-\frac{\sqrt{2}}{2}\right) + \left(-\frac{\sqrt{2}}{2}\right) \right| = |-2\sqrt{2}| = 2\sqrt{2}
    \]

  #### **Toy Model Specification**
  We use a **discrete hidden variable** \(\lambda\) that encodes predetermined outcomes for all possible settings. \(\lambda\) is a 4-tuple:  
  \[
  \lambda = (A_a, A_{a'}, B_b, B_{b'})
  \]  
  where \(A_x \in \{+1, -1\}\) is Alice's outcome for setting \(x\), and \(B_y \in \{+1, -1\}\) is Bob's outcome for setting \(y\). There are \(2^4 = 16\) possible \(\lambda\) values.

  The **local response functions** are deterministic and factorizable:  
  - Alice: If setting is \(a\), output \(A_a\); if \(a'\), output \(A_{a'}\).  
  - Bob: If setting is \(b\), output \(B_b\); if \(b'\), output \(B_{b'}\).  

  The violation of measurement independence arises because the **distribution of \(\lambda\) depends on the chosen settings** \((s_A, s_B)\):  
  - For each setting pair, we define a probability distribution over the 16 \(\lambda\) values that matches the quantum correlation for that pair.  
  - The distributions are chosen to reproduce the expectation values \(E(s_A, s_B)\).

  ---

  #### **Probability Distributions for \(\lambda\)**
  For each setting pair, we define probabilities for \(\lambda\) such that:  
  1. Only the marginal for the relevant settings matches the quantum prediction.  
  2. The other components are arbitrary (here, uniform).  

  Let \(p_{ij}(s_A, s_B) = P(A_{s_A} = i, B_{s_B} = j)\) for \(i,j \in \{+1, -1\}\). We require:  
  \[
  E(s_A, s_B) = \sum_{i,j} i \cdot j \cdot p_{ij}(s_A, s_B)
  \]  
  Solving for each setting pair:  

  1. **Settings \((a, b)\)**:  
     \[
     E(a,b) = p_{++} - p_{+-} - p_{-+} + p_{--} = -\frac{\sqrt{2}}{2}
     \]  
     Assume symmetry: \(p_{++} = p_{--} = \alpha\), \(p_{+-} = p_{-+} = \beta\), with \(2\alpha + 2\beta = 1\). Then:  
     \[
     2(\alpha - \beta) = -\frac{\sqrt{2}}{2} \implies \alpha - \beta = -\frac{\sqrt{2}}{4}
     \]  
     \[
     \alpha + \beta = \frac{1}{2} \implies \alpha = \frac{2 - \sqrt{2}}{8}, \quad \beta = \frac{2 + \sqrt{2}}{8}
     \]  
     The full distribution for \(\lambda\) assigns probability \(\alpha / 4\) to each \(\lambda\) with \((A_a, B_b) = (+,+)\) or \((-,-)\), and \(\beta / 4\) to others, since \(A_{a'}\) and \(B_{b'}\) are uniform.  

  2. **Settings \((a, b')\)**:  
     \[
     E(a,b') = p_{++} - p_{+-} - p_{-+} + p_{--} = +\frac{\sqrt{2}}{2}
     \]  
     Similar to above:  
     \[
     \alpha' - \beta' = +\frac{\sqrt{2}}{4}, \quad \alpha' + \beta' = \frac{1}{2} \implies \alpha' = \frac{2 + \sqrt{2}}{8}, \quad \beta' = \frac{2 - \sqrt{2}}{8}
     \]  

  3. **Settings \((a', b)\) and \((a', b')\)**:  
     Both require \(E = -\frac{\sqrt{2}}{2}\), so they use the same distribution as \((a, b)\) but marginalized over \((A_{a'}, B_b)\) and \((A_{a'}, B_{b'})\), respectively.

  ---

  #### **Explicit Calculation for \((a, b)\)**
  The probability mass for \(\lambda\) is concentrated based on \((A_a, B_b)\):  
  - \(P(\lambda) = \frac{2 - \sqrt{2}}{32}\) for \(\lambda\) with \((A_a, B_b) = (+,+)\) or \((-,-)\) (there are 8 such \(\lambda\), 4 per outcome pair).  
  - \(P(\lambda) = \frac{2 + \sqrt{2}}{32}\) for \(\lambda\) with \((A_a, B_b) = (+,-)\) or \((-,+)\) (8 such \(\lambda\)).  
  Total probability: \(8 \times \frac{2 - \sqrt{2}}{32} + 8 \times \frac{2 + \sqrt{2}}{32} = \frac{1}{2} + \frac{1}{2} = 1\).

  **Expectation value**:  
  \[
  E(a,b) = \sum_{\lambda} P(\lambda) A_a B_b = \left[ \frac{2 - \sqrt{2}}{32} \cdot 8 \cdot (+1) \right] + \left[ \frac{2 + \sqrt{2}}{32} \cdot 8 \cdot (-1) \right] = \frac{2 - \sqrt{2}}{4} - \frac{2 + \sqrt{2}}{4} = -\frac{\sqrt{2}}{2}
  \]  
  Matching the quantum prediction. Distributions for other setting pairs are defined similarly.

  ---

  #### **Where the "Conspiracy" Appears**
  The **correlation between \(\lambda\) and settings** is explicit:  
  - When Alice and Bob choose \((a,b)\), \(\lambda\) is biased toward \(\lambda\) where \(A_a B_b = -\frac{\sqrt{2}}{2}\).  
  - When they choose \((a,b')\), \(\lambda\) is biased toward \(\lambda\) where \(A_a B_{b'} = +\frac{\sqrt{2}}{2}\).  
  - The same \(\lambda\) value has **different probabilities** under different setting pairs. For example:  
    - \(\lambda_1 = (A_a=+1, A_{a'}=+1, B_b=+1, B_{b'}=+1)\)  
      - \(P(\lambda_1 \mid a,b) = \frac{2 - \sqrt{2}}{32}\) (since \(A_a B_b = +1\))  
      - \(P(\lambda_1 \mid a,b') = \frac{2 + \sqrt{2}}{32}\) (since \(A_a B_{b'} = +1\))  
    - The ratio \(\frac{P(\lambda_1 \mid a,b')}{P(\lambda_1 \mid a,b)} = \frac{2 + \sqrt{2}}{2 - \sqrt{2}} \approx 5.83\), showing strong dependence.  

  This is the **"conspiracy"**: the hidden variable "knows" what settings will be chosen and adjusts its distribution to ensure the quantum correlations. The initial conditions of the system (or the hidden variable source) are fine-tuned to correlate with future setting choices.

  ---

  ### Evaluating the Cost: Conspiracy vs. Nonlocality
  You asked whether rejecting measurement independence is *principled* or a matter of taste. I'll argue that the near-universal preference for factorizable locality over measurement independence rests on three **asymmetries**, though philosophical commitments play a role.

  #### **1. Scientific Method and Conspiracy**  
  - **Conspiracy as methodologically costly**: Violating measurement independence undermines experimental control. If the hidden variable correlates with settings, any apparent confirmation of quantum mechanics could be attributed to this correlation. This raises skeptical doubts:  
    - Why wouldn't \(\lambda\) also correlate with *other* experimental choices (e.g., calibration settings)?  
    - In a universe with human experimenters, \(\lambda\) must correlate with brain states (or RNG outputs) in a way that anticipates future choices. This requires **fine-tuning** in the initial conditions of the universe.  
    - Example: For \(N\) setting choices, the model requires \(4^N\) distributions, all fine-tuned to match quantum predictions.  

  - **Nonlocality as empirically traceable**: Orthodox quantum nonlocality (e.g., wavefunction collapse) is constrained by relativity and detectable only via Bell violations. It doesn't threaten the independence of *past* events, making it less disruptive to experimental practice.  

  #### **2. Retrocausality: A Distinction with a Difference?**  
  Retrocausal models (e.g., Price, Wharton, Sutherland) violate measurement independence via time-symmetric dynamics: future settings affect past hidden variables. This avoids fine-tuning of initial conditions:  
  - **Example**: In a retrocausal toy model, \(\lambda\) is determined by the *joint* state of the system and future settings via a time-symmetric law.  
  - **Why it might escape conspiracy**:  
    - Correlation arises from dynamical laws, not initial conditions.  
    - No "common cause" in the past; it's a direct future-past link.  
    - Fine-tuning is replaced by time-symmetry, a fundamental constraint.  
  - **Why it might not**:  
    - It still violates "no-conspiracy" as defined by Bell (statistical independence of \(\lambda\) and settings).  
    - Retrocausality implies that *any* future measurement setting could influence the past, potentially leading to paradoxes (e.g., in quantum cosmology).  

  **Verdict**: Retrocausality *mitigates* but doesn't eliminate the conspiracy. It trades fine-tuning for time-symmetry, which some find more palatable (e.g., as in Wheeler's delayed choice). However, it remains controversial.

  #### **3. Pragmatic and Aesthetic Asymmetries**  
  - **Conspiracy blocks scientific inference**: If settings aren't independent of \(\lambda\), we can't isolate causal relationships. This violates the **"no-conspiracy"** principle essential for statistics (e.g., in randomized trials).  
  - **Nonlocality preserves induction**: Even with nonlocality, we can rerun experiments with fixed settings and observe reproducible patterns.  
  - **Taste plays a role**: Physicists prefer "controlled weirdness" (nonlocality confined to quantum systems) over "uncontrolled skepticism" (everything might be correlated).  

