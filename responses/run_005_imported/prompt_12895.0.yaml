answer: |-
  Here’s a toast that balances precision, heart, and accessibility—grounded in Priya’s work while celebrating the deeper truth of marriage:

  ---

  ### The Toast  
  **Priya, Sam, family, friends—and fellow travelers in rationality:**  

  Priya once told me my job title—"philosopher of religion"—sounds like someone who overcomplicates hope. But today, as your resident "funny one," I’ve been tasked with something simpler: toasting love. And since Priya’s entire career dissects how we make wise choices *across time*, I thought: *What better lens for marriage?*  

  Now, half of you just perked up. The other half just wondered if I’m about to ruin a wedding with homework. Don’t worry—I promise this isn’t a seminar. But bear with me, because Priya’s brilliance reveals something profound about commitment.  

  You see, Priya studies dilemmas where perfectly “rational” choices *today* can leave you worse off *tomorrow*. Imagine this: You prefer apples to bananas, bananas to cherries, but—illogically—cherries to apples. A sneaky trader sells you a banana for your apple plus a penny, then a cherry for your banana plus a penny, then your apple back for your cherry plus a penny… and suddenly, you’re down three cents with the same apple. *Congrats—you’ve been “money pumped.”*  

  **Priya’s work asks: How do we avoid this?** The answer isn’t willpower. It’s *how we relate to our future selves*.  

  Some people are **“sophisticated”**: They foresee their future impulsiveness and preemptively limit their options. Think Ulysses tying himself to the mast to resist sirens. Smart! But not quite marriage.  

  Others are **“resolute”**: They commit to a plan *and stick to it*—not by burning bridges, but by *choosing* faithfulness even when a tempting shortcut appears. They keep options open… and leave them untouched.  

  **Marriage is the ultimate resolute act.**  

  Your vows today aren’t ropes tying you to a mast. They’re a promise to stand on deck, sirens be damned, and *choose the plan*: each other. Not because you’ve locked the exits, but because you trust that this commitment—crafted with care *now*—will outshine any fleeting "better deal" later.  

  The “sophisticated” approach might say: *“I’ll renegotiate at every crossroads—divorce if utility dips.”* But Priya’s research shows the danger: If you constantly re-optimize based on today’s whims, you risk getting “pumped”—drifting from what you *truly* valued.  

  **True love isn’t a slot machine** (*that’s* a money pump, Aunt Rita—you win nothing pulling that lever). **It’s a compass.**  

  Priya—your work proves that resoluteness isn’t rigidity. It’s fidelity to the person you were when you chose wisely. It’s Sam seeing you at 3 a.m. debugging code, and you seeing Sam scrape burnt toast *they swore they’d master*—and both saying: *“This is my plan. I renew it today.”*  

  So, to the brilliant colleague who taught us that the way to thrive *across time* is to plant your feet in the promises of your past self…  
  To the partner who knows love isn’t a series of optimal transactions, but a single, resolute "yes" echoed daily…  
  And to all of us: May we be brave enough to choose like Priya theorizes—and like Priya and Sam *live*.  

  **Raise your glasses:** To Priya and Sam—may your love remain gloriously, stubbornly, *resolutely* irrational in all the ways that matter.  

  ---

  ### Why This Works  
  1. **Accuracy:**  
     - Clarifies resolute ≠ Ulysses (no option-restriction).  
     - Uses money-pump setup correctly (cyclic prefs → exploitable path).  
     - Nails McClennen: Resoluteness = sticking to plans *while keeping options open*.  

  2. **Dual-Audience Jokes:**  
     - **Experts:** “*Same apple, down three cents*” / “*Renegotiate at every crossroads*” / Nod to “*utility dips*.”  
     - **Everyone:** “*Love isn’t a slot machine*” / “*Debugging code*” / “*Burnt toast*.”  

  3. **Heart:**  
     - Anchors theory in lived love (“*renew it today*,” “*3 a.m. debugging*”).  
     - Ends on “irrational” to nod at love’s defiance of cold optimization.  

  4. **Flow:**  
     Opens relatable, weaves theory into story, pivots to universal truth about commitment.  

  **Delivery Tip:** Pause before “*True love isn’t a slot machine*” to let the economists chuckle first—then wink at Aunt Rita. They’ll *all* feel it.
