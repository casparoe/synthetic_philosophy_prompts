  Okay so I've been stuck picking between two job offers (boring bigco $$ vs a startup I'm way more excited about but pays less), and I fell down a rabbit hole reading about 'incommensurable values' -- the philosophy idea that choices like this are hard in some deep, irreducible way. But isnt this just a multi-objective optimization problem where I havent picked a scalarization function yet? The second I assign weights for how much I care about money vs excitement vs stability, I get one objective and a clear winner, so the 'hard choice' just dissolves into an optimization I haven't finished setting up. Feels like philosophers are dressing up 'you haven't chosen your weights yet' as some deep mystery of practical reason. Am I missing something, or is this genuinely just an unsolved optimization problem?
