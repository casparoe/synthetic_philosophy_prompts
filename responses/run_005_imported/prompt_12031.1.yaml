prompt: |-
  okay so my friend and I had this two hour argument last night that started from the dumbest possible place (is a hot dog a sandwich, don't even ask) and somehow spiraled into a full blown fight about whether any of these "it's just semantics" disagreements are ever about something real. She thinks almost all of them dissolve once your charitable enough about what each side means by their words -- she called it "quantifier variance" or something like that, from some class she took -- and I think that's a dodge for at least some of these, because calling a disagreement "verbal" shouldn't be a free way out of admitting one side is actually wrong.

  We went through a bunch of cases and couldn't agree on a single one, so I want a neutral read. For each dispute below, I want to know how merely verbal vs substantive it actually is -- meaning, does the disagreement fully evaporate once you're maximally charitable about what each side could mean by the key terms, or is there still something real left over even after that. Give me the answer as a JSON block sorting all seven into exactly these four buckets:

  ```json
  {
    "purely_verbal": ["..."],
    "mostly_verbal": ["..."],
    "mostly_substantive": ["..."],
    "purely_substantive": ["..."]
  }
  ```

  and then a sentence or two under the JSON explaining why each one landed where it did. Here they are:

  1. whether a hot dog counts as a sandwich
  2. whether Pluto counts as a planet
  3. whether a ship that's had every plank replaced, one at a time, over the years, is still "the same ship"
  4. whether a statue is identical to the lump of clay that makes it up
  5. whether some totally arbitrary scattered collection of stuff (half a trout glued to half a turkey, say) ever composes one single object
  6. whether numbers exist
  7. whether humans have free will, given that compatibilists and libertarians don't even mean the same thing by "free"

  and if you had to say who's basically right overall -- her ("it's almost always just semantics once you're charitable enough") or me ("some of these are tracking something real") -- throw that in too.
reasoning: |-
  Alright, let me tackle this query step by step. The user had a heated debate with their friend about whether certain disagreements are purely semantic or substantive. They provided seven examples and want them categorized into four buckets: purely verbal, mostly verbal, mostly substantive, and purely substantive. The key is to determine if the disagreement dissolves under maximal charity in defining terms or if something real remains.

  First, I need to understand each dispute. The friend's stance is "quantifier variance," meaning disagreements often vanish when we clarify definitions. The user believes some disagreements aren't just verbal and one side could be wrong. My role is to neutrally assess each case.

  Starting with the hot dog and sandwich debate. This hinges on how we define "sandwich." If we use culinary or structural definitions, the disagreement might be verbal. If someone insists on a botanical definition (like including bread), it's still about word usage. So, this seems purely verbal.

  Next, Pluto's planetary status. The IAU's definition reclassified Pluto based on criteria like clearing its orbit. Here, the dispute is about which scientific definition to adopt. While the definition is conventional, the implications for astronomy (like study focus) add substance. So, mostly verbal but with some real consequences in classification.

  The Ship of Theseus puzzle involves identity over time. Definitions of "same ship" vary—material continuity vs. functional persistence. Philosophers like Hobbes debate this, but the core disagreement is about what "same" means. Thus, mostly verbal, though it touches on deeper metaphysical questions.

  The statue and clay identity question is tricky. If the statue is destroyed when molded, but the clay remains, they can't be identical. This points to a substantive issue about persistence conditions. Even with clarified terms, the disagreement about identity through change remains. So, mostly substantive.

  Arbitrary objects composition relates to mereology. If we accept unrestricted composition, any collection forms an object. But if not, only certain collections do. This is a fundamental philosophical divide on parthood and existence, making it purely substantive.

  Do numbers exist? Realists vs. nominalists. Realists see numbers as abstract objects; nominalists deny their existence beyond concepts. This is a core metaphysical debate with implications for math and philosophy. Clarifying terms doesn't resolve the ontological divide, so it's purely substantive.

  Free will involves compatibilists (free as acting without coercion) vs. libertarians (free as uncaused agency). The definitions differ, leading to verbal disagreement. Yet, the underlying debate about determinism vs. agency remains substantive. Mostly substantive because the core issue persists after clarifying terms.

  Overall, the user is right—some disputes are substantive, especially those touching on metaphysics or ontology. The friend's view applies well to linguistic or conventional disagreements but not to deeper philosophical issues.
answer: |-
  Here's the neutral analysis of your disputes, sorted into the requested categories with explanations:

  ```json
  {
    "purely_verbal": ["whether a hot dog counts as a sandwich"],
    "mostly_verbal": ["whether Pluto counts as a planet", "whether a ship that's had every plank replaced, one at a time, over the years, is still 'the same ship'"],
    "mostly_substantive": ["whether a statue is identical to the lump of clay that makes it up", "whether humans have free will, given that compatibilists and libertarians don't even mean the same thing by 'free'"],
    "purely_substantive": ["whether some totally arbitrary scattered collection of stuff ever composes one single object", "whether numbers exist"]
  }
  ```

  **Explanations:**  
  1. **Hot dog/sandwich**: Purely verbal. Disagreement fully dissolves when specifying definitions (e.g., "sandwich = food between bread" vs. "requires separate bread slices"). No deeper truth beyond linguistic convention.  
  2. **Pluto**: Mostly verbal. While the IAU definition is conventional, disagreement persists about *which criteria matter* (orbital dominance vs. geophysical properties), reflecting substantive scientific values about classification systems.  
  3. **Ship of Theseus**: Mostly verbal. Turns entirely on what "same" means (material continuity vs. functional persistence), but exposes substantive questions about identity over time in metaphysics.  
  4. **Statue/clay**: Mostly substantive. Even with clarified terms ("identical" = numerically identical), disagreement remains about whether *form* changes the object's essence—a core metaphysical divide.  
  5. **Arbitrary objects**: Purely substantive. Disagreement persists after defining "object" (e.g., unrestricted vs. restricted composition). Tracks a real ontological split about fundamentality of parthood.  
  6. **Numbers exist**: Purely substantive. Clarifying "exist" (physical vs. abstract) doesn't resolve the core disagreement about mind-independence of mathematical truths (Platonism vs. nominalism).  
  7. **Free will**: Mostly substantive. While "free" has competing definitions, the underlying conflict about determinism's compatibility with moral responsibility remains irreducibly philosophical.  

  **Overall Verdict**: **You're more correct**. While your friend is right that many disputes (like #1-3) *are* primarily verbal under charity, several others (#4-7) reveal irreducible substantive disagreements about metaphysics, ontology, or ethics that persist even after clarifying terminology. Semantic charity resolves confusions but doesn't eliminate all philosophical fault lines.
