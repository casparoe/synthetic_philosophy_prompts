  Hey, random one from a story I'm working on about nurse staffing shortages. I sat in on a call where a hospital's scheduling consultant told management that a workable schedule has to exist — one where nobody works two night shifts back to back and every unit still hits minimum staffing — because he'd proven it by showing that assuming no such schedule exists leads to a contradiction with the number of nurses on payroll. When the head nurse asked him to just show her the schedule, he said that's a seperate, much harder problem, and the software might need weeks more to grind through it. Something about that's been nagging at me since, but I can't put my finger on what's wrong with it, if anything. Is "it can't NOT exist" basically the same as "it exists," or is he pulling some kind of fast one on the hospital?
