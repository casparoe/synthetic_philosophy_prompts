answer: |-
  Here’s a wedding speech weaving Parfit's Hitchhiker into its core, celebrating Priya's "Pay the Driver" ethos in a way that resonates universally:

  **(Start with warmth and connection)**

  "Good evening everyone! For those who don’t know me, I’m [Your Name], and I’ve had the immense privilege of knowing Priya since we were part of a lively little group of friends back in 2015. We used to meet up, debate ideas, and Priya? Priya always brought the most fascinating perspective to the table. Seriously, conversations with her were never dull.

  **(Introduce the Core Idea Anecdotally)**

  "Now, Priya has this phrase she’s lived by for years, a kind of personal motto: **‘Pay the Driver.’** I know, it sounds quirky, maybe even a bit random for a wedding! But bear with me, because it reveals something incredibly profound about her, especially today. It comes from a thought experiment she loves, about a hitchhiker stranded in the desert.

  **(Simplify the Hitchhiker - Focus on the Promise)**

  "Picture this: A guy is dying of thirst. A driver comes along, but says, ‘I’ll only pick you up *if* you promise to pay me $100 once we get to town.’ The hitchhiker desperately promises. They get to town, the hitchhiker is safe… and now, logically, he has *zero* reason to pay. He’s got his water, he’s safe. Keeping that promise costs him money for seemingly nothing in return. It looks irrational.

  **(The Priya Twist: Rational Irrationality)**

  "But Priya doesn’t see it that way. She calls this ‘Rational Irrationality.’ Her point is this: What makes that promise *mean* anything in the desert, what makes the driver trust it enough to stop, is precisely the belief that this hitchhiker is the *kind of person* who will pay *even when it makes no selfish sense*. Even when it’s easier not to. Even when no one is forcing him. **Being ‘irrationally’ loyal to your word, on purpose, is actually what *creates* real trustworthiness.** The driver stops because he believes the hitchhiker possesses that core integrity, that commitment to his promise *for its own sake*.

  **(Pivot to Priya - Show, Don't Tell)**

  "And that, my friends, is ‘Paying the Driver.’ That’s Priya. It’s not about desert rescues or a hundred bucks! It’s about who she fundamentally is. It’s about how she shows up in the world. **Priya understands that the deepest trust isn’t built on convenience or immediate gain. It’s built on the stubborn, sometimes seemingly illogical, choice to honor your word simply because you gave it.** I’ve seen it countless times. When she commits to something, to *someone*, she commits fully. She shows up. She follows through. Not because it’s easy, or because she’ll get something out of it *right now*, but because she said she would. That’s her integrity. That’s her ‘Pay the Driver’ ethos in action.

  **(Link Directly to Marriage and the Groom)**

  "Now, look at where we are today. Priya, you’re standing here making the biggest, most beautiful promise of your life. You’re promising [Groom's Name] your forever. And [Groom's Name], you’re doing the same. Marriage, as we all know, isn’t always the easy road into town. There will be moments where the ‘logical’ selfish choice might whisper, ‘Just drive on by… why pay?’ But the *magic*, the *strength* of the promise you make today, lies precisely in choosing the ‘irrational’ path when it counts.

  **(The Heart of the Toast - Why Her Promise Matters)**

  "Priya, your ‘Pay the Driver’ philosophy isn’t just an idea; it’s the lived proof of your character. It’s why everyone who knows you trusts you implicitly. It’s why we all knew, deep down, that when you found your person, your promise would be unshakeable. Because for you, keeping your word isn’t conditional. **It’s the bedrock.** It’s the quality that makes your ‘I do’ today resonate with such profound truth. [Groom's Name], you are getting a partner whose loyalty and commitment run deeper than circumstance. She’s proven, time and again, that she *pays the driver*. That she honors her promises, fiercely and faithfully, simply because she made them.

  **(The Toast - Universal Connection)**

  "So, let’s raise our glasses. Not just to love – though there’s plenty of that! – but to the *kind* of love that endures. The love built on unwavering integrity, on choosing loyalty even when it’s not the easiest path. The love that understands the deepest trust comes from knowing your partner will always, always ‘Pay the Driver.’

  **To Priya and [Groom's Name]! May your journey together be filled with the profound trust and unwavering commitment that Priya embodies so beautifully. Cheers!"**

  **Why this works:**

  1.  **Accessible Story:** The hitchhiker scenario is told simply, focusing on the promise/dilemma, not decision theory jargon.
  2.  **Clear Translation:** "Rational Irrationality" is immediately explained in relatable terms: "stubborn choice to honor your word."
  3.  **Character Focus:** It's not a philosophy lecture; it's a lens to *show* Priya's defining character trait (integrity, trustworthiness, commitment).
  4.  **Direct Marriage Link:** Explicitly connects the philosophy to the *nature* of wedding vows – promising *because you promise*, not for convenience.
  5.  **Universal Truth:** The core message (trust built on unwavering integrity) resonates with *everyone*, regardless of knowing SSC/LW or Parfit.
  6.  **Warmth & Celebration:** The tone remains celebratory and focused on the couple's love and future.
  7.  **"Pay the Driver" as Anchor:** The phrase is repeated meaningfully, becoming a symbol of Priya's reliability, tying the whole speech together.
