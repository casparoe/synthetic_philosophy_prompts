prompt: |-
  So I've been chewing on this thing called the "special composition question" - basically the question of when a bunch of separate objects actually combine to form one new object (like when do particles compose a chair vs when do they just sit there as a pile of particles). I read a bit about Peter van Inwagen's answer, which is that only stuff that's "caught up in a life" really composes something - so organisms exist but chairs and rocks don't really compose anything, they're just simples arranged chair-wise. At first this sounded kinda elegant to me, but then I started thinking about viruses, and prions, and that weird gray area right at conception or right at brain death, and it seems like "being alive" is actually super vague and has tons of borderline cases, way more than we usually admit.

  So here's what I want you to argue: that van Inwagen's "Life" answer to the special composition question doesn't actually escape the vagueness problem he's trying to dodge (the whole point of his view was to avoid the weird vague cases you get with universalism, where its unclear if two objects almost touching compose something or not). I want you to make the case that because "life" itself has fuzzy boundaries, his restricted answer secretly imports all the same vagueness he was trying to rule out, and that if you follow this all the way through it actually pushes you toward compositional nihilism (nothing ever really composes anything except at the level of simples) rather than his organism-based view. Don't just summarize the debate, actually build the argument step by step like you're trying to convince me it's true.
