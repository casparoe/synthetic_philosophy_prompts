answer: |-
  Here's the step-by-step argument that van Inwagen's "Life" criterion fails to escape vagueness and logically pushes toward nihilism:

  ### Step 1: Van Inwagen's Core Goal & Claim
  Van Inwagen rejects **universalism** (any arbitrary collection composes an object) because it generates intolerable vagueness (e.g., is "Dusty" – Earth + some cosmic dust – a genuine object?). He also rejects **moderate views** (e.g., contact or cohesion) because they *still* permit borderline cases (e.g., when do particles *begin* to cohere?). His solution: composition occurs **only when particles are caught up in a life**. This claims to provide a **sharp, non-arbitrary boundary**: either something is unambiguously alive (organisms), or it's just "simples arranged X-wise" (chairs, rocks). Life, he assumes, is a natural kind with clear edges.

  ### Step 2: The Fatal Flaw: Life's Intrinsic Vagueness
  The concept of "life" is **not** scientifically or metaphysically sharp. It's a cluster concept with borderline cases where *no definitive fact of the matter* exists:
  *   **Viruses:** Replicate, evolve, have complex structure... but lack independent metabolism. Are they "caught up in a life"? Biology has no consensus. *If they are alive, then a virus particle composes an object. If not, it doesn't.* Van Inwagen offers no principled way to decide.
  *   **Prions:** Misfolded proteins causing disease, self-replicating *by corrupting other molecules*. Do they exhibit "life"? Deeply unclear. Is a prion aggregate a composite object? Van Inwagen's criterion gives no answer.
  *   **The Beginning of Life (e.g., Conception):** Is a zygote immediately after fertilization "alive" in the relevant sense? When does the "life" that grounds composition begin? At syngamy? Implantation? Gastrulation? *This is the core of real-world ethical debates precisely because the boundary is vague.*
  *   **The End of Life (e.g., Brain Death/Organismal Death):** Is an organism with irreversible higher brain function loss but a beating heart (sustained artificially) "alive"? What about an organism undergoing apoptosis (programmed cell death) where some cells live while the whole dies? *The transition from life to death is gradual at multiple levels.*

  **Crucial Point:** This vagueness isn't superficial; it's **metaphysical and epistemic**. There is no hidden, precise scientific fact that eliminates the borderline cases. Biology deals in *criteria* (metabolism, homeostasis, reproduction, etc.), but these often conflict or apply partially. **"Being caught up in a life" is itself a vague predicate.**

  ### Step 3: Compositional Vagueness Re-Enters Through the Back Door
  Van Inwagen's entire project was to *avoid* vague composition. But if **whether composition occurs depends on whether there is a life**, and **whether there is a life is vague**, then **whether composition occurs is vague**.
  *   **Consequence 1: Vague Objects:** For borderline cases (a dying organism, a virus, a very early embryo), it is **indeterminate** whether the particles compose a single object. This is *exactly the type of vagueness* van Inwagen sought to avoid with universalism. If we say "The chair doesn't exist because it's not alive, but the cat definitely does," we must also say "This entity in the gray zone *might* exist as a composite object... or might not." Van Inwagen replaces universalism's spatial/temporal vagueness (when are things touching enough?) with *biological/functional vagueness* (when is it alive enough?).
  *   **Consequence 2: Vague Existence:** Van Inwagen claims organisms *definitely* exist as composite objects. But if the boundaries of life are vague, then the *existence* of a specific composite object (this particular cat) becomes vague at its temporal boundaries (when did it begin? when did it end?) and potentially even at its spatial boundaries (is this symbiotic bacteria part of "the life"?). An object cannot have perfectly definite existence if the *condition necessary for its existence* is indefinite.

  ### Step 4: Why This Logically Pushes Toward Nihilism
  Van Inwagen presents a dilemma: either accept universalism's vagueness, accept nihilism (only simples exist), or accept his life-only view. He argues his view is the only viable non-nihilist option. But if his view *itself* succumbs to vagueness, the dilemma collapses:
  1.  **Universalism:** Rejected due to pervasive vagueness.
  2.  **Van Inwagen's Life-Only View:** **Shown to also suffer from pervasive vagueness** (Step 2 & 3). It fails its own primary goal.
  3.  **Other Moderate Views (e.g., contact, cohesion):** Van Inwagen argues these *also* have borderline cases (e.g., when does contact begin? what counts as cohesion?). He claims life is the *only* plausible non-arbitrary boundary. **If *life* fails as a sharp boundary, his argument against *all other moderate views* becomes much weaker, but crucially, he has already dismantled them.** We are left with no *successful* moderate view.
  4.  **The Nihilist Conclusion:** If *all* proposed criteria for composition (universal, contact, cohesion, *and life*) lead to either unacceptable arbitrariness or intolerable vagueness when examined closely, **the only remaining consistent position is that composition *never* occurs.** Nihilism becomes the default:
      *   It treats *all* putative composite objects equally: chairs, rocks, cats, humans, viruses, dying organisms, zygotes, prion aggregates – **none** are genuine composite objects. There are only fundamental particles ("simples") arranged in various ways.
      *   It **eliminates compositional vagueness entirely.** While we can have vague *descriptions* ("is this a heap?", "is this alive?"), there is *no fact of the matter* about whether some simples compose an object. There simply *are no* composite objects to have vague boundaries. Vagueness only applies to our language/concepts, not to the fundamental ontology.

  **The Knockout Punch:** Van Inwagen himself relies on nihilism for everything *except* organisms. But if the one exception he carves out – "life" – crumbles under the weight of its *own* vagueness, the entire structure collapses. If the life criterion cannot provide the sharp, objective boundary he needs to escape the problems of other views, and if it imports the very vagueness it was meant to avoid, then the logical implication is that **the exception is unjustified. We must apply the nihilist conclusion consistently to *everything*, including organisms.** The simples arranged cat-wise are just that – simples arranged cat-wise, not a composite object. The promise of a principled exception vanishes, leaving nihilism as the only position that avoids the arbitrary drawing of lines *anywhere*.

  **In essence:** Van Inwagen tries to use "life" as a magic bullet to kill compositional vagueness. But the bullet is made of rubber. When fired, it bounces off the target (vagueness) and hits his own theory instead, revealing that "life" is just another source of the same problem he feared. Having rejected all other ways to avoid vagueness, and seeing his own solution fail, the only consistent escape is to deny composition happens at all. The path from his failed organism-based view leads straight to the nihilism he tried to avoid.
