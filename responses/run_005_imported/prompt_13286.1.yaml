answer: |-
  This is a fascinating intersection of history, theology, and philosophy! Let's break down Article XIV and its relevance to modern secular supererogation step-by-step:

  **Deconstructing Article XIV's Argument:**

  1.  **The Target:** Explicitly, "Works of Supererogation" as defined in late medieval Catholic theology. These were acts considered morally good but *beyond* what God's commandments strictly required. Crucially, within that system, such works generated *merit* – a kind of spiritual surplus – which could be stored in the Church's "Treasury of Merit" and applied (via indulgences) to reduce the temporal punishment due to sin for oneself or others.

  2.  **The Core Objection: Arrogance & Impiety:** The Article claims teaching such works involves "arrogancy and impiety." Why?
      *   **Claiming Surplus Merit:** By saying "we do more... than of bounden duty is required," humans are claiming to have generated a *surplus* of merit before God.
      *   **Denying Radical Dependence:** This claim implicitly denies the fundamental theological premise of the Reformation: humanity's *total* and *radical dependence* on God's grace for salvation and any good standing before Him. It suggests humans can *earn* something extra, exceeding the baseline requirement for divine approval.
      *   **Usurping God's Prerogative:** Determining what constitutes "duty" and what constitutes "surplus" presumes a level of understanding of divine requirements and an ability to perfectly fulfill them that, according to Reformation theology, humans simply don't possess. It puts humans in the position of judging the sufficiency of their own obedience *against God's standard*.
      *   **The Impossibility of "Enough":** While not explicitly stated as "duty is unbounded," the logic leans heavily in that direction. Humans, as finite and sinful creatures, can *never* truly satisfy the infinite demands of God's perfect holiness and justice through their own works. Their obligation is total.

  3.  **The Clincher: "Unprofitable Servants" (Luke 17:10):**
      *   **The Verse:** "So you also, when you have done all that you were commanded, say, ‘We are unworthy servants; we have only done what was our duty.’" (ESV).
      *   **How it Works:** Jesus uses this parable to illustrate the proper attitude of a disciple towards God.
      *   **Against Surplus:** Even if one *could* hypothetically do "all that is commanded," the *only* appropriate response is humility: recognizing you have merely fulfilled your basic obligation ("bounden duty"). You are still an "unprofitable" (Greek: *achreios*, useless, unworthy, unmeritorious) servant. You haven't *earned* anything extra; you've simply avoided failing in your duty.
      *   **Undermining Supererogation:** This verse directly attacks the *presumption* inherent in claiming supererogatory works. It says: even perfect obedience (which humans can't achieve) doesn't generate merit *beyond* duty – it just fulfills the bare minimum expected of a servant. Claiming a "surplus" is thus a profound misunderstanding of the human position before God and a denial of this teaching.

  **The Core Theological Premises:**

  1.  **Total Human Dependence:** Salvation and any positive standing before God come *solely* through grace received by faith, not earned by works (Sola Fide, Sola Gratia).
  2.  **Divine Command as Duty's Sole Source:** Moral obligation stems *entirely* from God's revealed commandments. There is no independent "natural" standard of goodness that humans can exceed *in a way that generates merit before God*.
  3.  **Human Sinfulness & Imperfection:** Humans are incapable of perfect obedience to God's law. Any claim to have exceeded it is inherently suspect.
  4.  **God's Infinite Holiness:** The standard against which human actions are measured is infinitely perfect. Finite human actions can never "surpass" this standard in a way that creates a bankable surplus of merit.
  5.  **Salvation by Grace, Not Accounting:** The relationship with God is not a ledger of debits and credits where surplus merit can be accrued. It's based on unmerited favor.

  **Does this Critique Bite Against Secular Supererogation (Urmson, Wolf, etc.)?**

  **Short Answer: No, not directly or fatally.** The 16th-century argument relies *entirely* on theological premises that the secular concept explicitly rejects or operates without.

  **Detailed Breakdown:**

  1.  **Radically Different Frameworks:**
      *   **Theological:** Operates within a framework of divine command, sin, salvation, grace, merit, and an infinite divine standard. Duty is defined *by God* and is total.
      *   **Secular (Urmson/Wolf/etc.):** Operates within frameworks like utilitarianism, deontology (often Kantian), virtue ethics, or social contract theory. Duty is defined by *human reason*, social needs, consequences, or principles of justice/fairness. There is no divine commander or infinite standard.

  2.  **The "Unbounded Duty" Objection Doesn't Transfer:**
      *   In secular ethics, duty is generally understood as *limited* and *specifiable*. We have duties *to* specific others (family, community) or based on specific roles or principles. We can clearly identify actions that fall *outside* these specific requirements (e.g., donating a kidney to a stranger when you have no duty to do so, risking your life to save someone when it's not your job). Theologians might argue we have an *infinite* duty to promote the good or obey God, but secular ethicists don't start from that premise. Duties are bounded by feasibility, special relationships, and competing obligations.

  3.  **The "Arrogance/Impiety" Objection Shifts Ground:**
      *   **Theological Arrogance:** Claiming surplus merit *before God*, usurping God's judgment, denying dependence on grace.
      *   **Secular "Arrogance"?** Claiming a secular supererogatory act might be seen as *boastful* or involve *moral grandstanding*, but this is a critique of *motive* or *character*, not a logical flaw in the *concept* itself. The secular concept focuses on the *action's status* (beyond duty, praiseworthy), not necessarily the *agent's claim* about it. Wolf, in fact, argues that the "moral saint" obsessed *only* with duty might be lacking in other human virtues. The secular worry might be *under*-valuing supererogation, not over-claiming it.

  4.  **The "Who Judges?" Point is Moot:**
      *   **Theology:** Only God can judge the sufficiency of works relative to His infinite standard and human sin.
      *   **Secular:** The judgment of what constitutes duty vs. supererogation is made *within the ethical system itself*, based on reasoned arguments about principles, consequences, relationships, and feasibility. It's a human, fallible, but reasoned judgment. There's no appeal to an infallible divine perspective.

  5.  **The "Unprofitable Servants" Analogy Fails:**
      *   This analogy only makes sense within a master/servant relationship defined by *total ownership and obligation* to an infinite master. Secular ethics typically views individuals as moral agents with autonomy, existing within networks of *mutual* (but limited) obligations. Fulfilling one's duties is generally seen as *positively good and worthy of respect*, not merely the baseline for avoiding being "unprofitable." Praising supererogation doesn't imply that duty-fulfillers are "unprofitable"; it recognizes a higher level of contribution.

  **Where *Might* There Be Friction? (Subtler Points)**

  1.  **Moral Limits & Overdemandingness:** Some secular ethicists (e.g., echoing negative reactions to extreme utilitarianism) worry that *denying* supererogation makes morality too demanding – if saving a drowning child at great personal risk isn't supererogatory, it becomes *required*, which seems excessive. The *theological* worry in Article XIV is almost the *opposite*: *affirming* supererogation makes claims that are too *presumptuous* before God. However, a *secular* critic influenced by humility might argue that confidently demarcating the precise line between duty and supererogation is difficult and risks self-righteousness. This is a *practical* or *epistemic* concern about human judgment, not a *theological* one about merit before God.
  2.  **Motives and Moral Worth:** Both traditions care about motives. Theologians reject supererogation partly because claiming surplus merit betrays an improper motive (seeking credit). Secular theorists also debate whether an act's supererogatory status depends partly on motive (e.g., is a grudgingly performed "beyond duty" act truly supererogatory?). However, the secular debate focuses on defining the act's status, not on a theological doctrine of grace.
  3.  **Perfectionism vs. Flourishing:** Susan Wolf's critique of the "moral saint" resonates *slightly* with the Reformation's suspicion of works-righteousness. Both worry that an obsessive focus on maximizing moral output (whether as duty or supererogation) might distort a full human life. But Wolf's concern is humanistic (losing out on non-moral goods), while the Reformation's is theological (distorting the Gospel of grace).

  **Conclusion:**

  Article XIV's rejection of supererogation is a powerful and coherent argument *within its specific theological framework*. It hinges on doctrines of divine sovereignty, human sinfulness and dependence, grace, and merit that are foundational to Reformation theology and directly opposed to the medieval Catholic system of indulgences.

  However, this argument **does not translate effectively to undermine the modern *secular* concept of supererogation.** Secular ethics operates on fundamentally different premises:

  *   **Bounded Duties:** Duties are finite and specifiable, not total and infinite before a divine standard.
  *   **Human-Sourced Morality:** Moral concepts are defined by human reason and social context, not divine command alone.
  *   **No Merit Economy:** There's no economy of "merit" stored for salvation or applied to others. Praise and blame are social and psychological, not theological currencies.
  *   **Different Grounds for Evaluation:** What makes an act supererogatory is its relationship to specifiable duties and its praiseworthiness, judged by human ethical reasoning, not by its ability to generate surplus merit before God.

  The Reformation critique is fascinating historically and theologically, and it highlights how deeply embedded concepts of duty, merit, and human capacity are within different worldviews. But for analyzing acts like heroic self-sacrifice or extreme generosity within the frameworks used by Urmson, Wolf, or contemporary moral philosophy, the secular concept of supererogation remains robust. The theological argument simply operates on a different plane with different foundational assumptions. Your Presbyterian minister friend rightly highlighted the crucial theological origins and conflict, which are essential for understanding the *historical* term, but they don't invalidate the *philosophical* concept developed in a different context centuries later. Your chemical intuition that the premises don't carry over is spot on!
