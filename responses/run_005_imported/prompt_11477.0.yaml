answer: |-
  That's a fascinating and common observation! While Sidgwick's ghost-hunting seems jarringly incongruous with the author of *The Methods of Ethics*, dismissing it as a purely separate "hobby" misses a profound and deeply personal link to the core anxieties driving his ethical philosophy. **The connection is existential and foundational, not incidental.**

  Here's why Sidgwick's psychical research was inextricably linked to his ethics:

  1.  **The Crisis of Religious Doubt and the Foundation of Morality:** Sidgwick underwent a profound crisis of faith, losing his orthodox Christian belief. This presented a massive problem for his ethical project. *The Methods of Ethics* rigorously argued that utilitarianism was the most rationally defensible system. However, Sidgwick identified the **"Dualism of Practical Reason"** – the conflict between rational self-interest and the demands of utilitarian morality (which often requires significant self-sacrifice). Without religious belief in God, immortality, and divine sanctions (rewards/punishments in an afterlife), Sidgwick worried that the rational egoist would *always* have a stronger reason to prioritize their own happiness over the greater good when the two conflicted.
  2.  **Psychical Research as a Quest for Empirical Foundation:** Sidgwick didn't *want* to believe in ghosts; he **desperately needed** evidence for *something* beyond the purely material. The Society for Psychical Research (SPR) wasn't founded for spooky thrills. It was conceived as a rigorously **scientific investigation** into phenomena that *might* provide empirical evidence for:
      *   **The survival of consciousness after death (immortality):** Proof of an afterlife would solve the Dualism of Practical Reason. If personal happiness extended infinitely beyond this life, then sacrificing finite earthly happiness for the greater good *could* be reconciled with rational self-interest over the long term.
      *   **A non-material, purposeful universe:** Evidence of telepathy, clairvoyance, or spirits could suggest a deeper, interconnected, potentially teleological (purpose-driven) reality. This could provide a non-theistic basis for meaning and moral obligation, offering a foundation for altruism that didn't rely on collapsing religious dogma.
  3.  **Methodological Rigor Applied Consistently:** Crucially, Sidgwick approached psychical research **with the same meticulous, critical, and empirical mindset** he applied to ethics. He wasn't a "credulous sucker." He was:
      *   **Deeply skeptical:** He exposed numerous frauds and was constantly frustrated by the lack of conclusive evidence. He famously said his research led him to "ignorance certified."
      *   **Demanding high standards:** The SPR, under his influence, pioneered rigorous protocols for investigating mediums, emphasizing controlled conditions, witness corroboration, and debunking charlatans. He applied the "methods of ethics" – careful reasoning, weighing evidence, seeking truth – directly to the investigation of the paranormal.
      *   **Motivated by Truth, Not Comfort:** His pursuit was driven by a profound need for *truth*, even if it was uncomfortable. He was willing to follow the evidence wherever it led, even if it meant confronting the bleak possibility that there was no ultimate sanction for morality.
  4.  **The Unresolved Tension and Its Legacy:** Sidgwick died deeply disappointed by the lack of conclusive proof from psychical research. This left the Dualism of Practical Reason unresolved. His life's work embodied the struggle of modern secular ethics: **How can we rationally justify profound self-sacrifice for the greater good in a potentially purposeless, material universe?**

  **The Link to Effective Altruism (EA):**

  *   **The Foundational Problem:** EA inherits Sidgwick's core utilitarian framework and its rational approach to maximizing good. It also implicitly grapples with the *motivational* challenge Sidgwick identified: Why should a highly rational individual commit significant personal resources (time, money, career) to helping distant strangers when self-interest might dictate otherwise?
  *   **Secular Altruism:** EA operates squarely within the secular, post-religious framework Sidgwick occupied. It seeks reasons for altruism grounded in reason and evidence, not faith or divine command – the very project Sidgwick was engaged in.
  *   **The Ghost of the Dualism:** While EA often focuses on *how* to do good most effectively (Sidgwick's positive project), Sidgwick's psychical research highlights the deep, underlying *why* question that still haunts rigorous altruism. EA proponents often find motivation in empathy, expanding moral circles, or the inherent satisfaction of doing good, but Sidgwick's ghost-hunting reminds us that the *ultimate rational justification* for radical self-sacrifice remains a profound philosophical challenge in a godless universe.

  **Conclusion:**

  Sidgwick's psychical research was **not a separate hobby, but a direct, desperate, and rigorously pursued extension of his deepest ethical concerns.** It was his empirical laboratory, testing the possibility of a universe where utilitarian ethics could be *finally* reconciled with rational self-interest through evidence of an afterlife or a deeper spiritual reality. His failure to find such evidence left a haunting question mark over the ultimate foundation of the rational altruism that underpins EA. Far from being a credulous sucker, he was a tragically honest philosopher relentlessly seeking empirical answers to the most profound problem his own brilliant ethical system revealed. His ghost-hunting *was* his ethics, pursued by other means. Understanding this connection adds a crucial layer of depth and existential tension to the intellectual roots of effective altruism.
