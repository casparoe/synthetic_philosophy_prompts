prompt: |-
  Okay, this is a pretty specific ask but I need actual help, not just sympathy. I sit on the allocation committee for a small giving circle - four of us, money sits in a joint donor-advised fund, currently about $180k, mostly earmarked for global health stuff like malaria nets. Last week Priya, one of the other members, brought us a proposal from a contact of hers who does impact litigation funding: we'd front part of the fund for a specific case, and by our own best collective guess it's roughly 60% likely to settle or win (in which case we get back about double our stake out of the fee award) and 40% likely to get dismissed (in which case we lose the whole stake, no partial outcomes). She wants the committee to consider commiting as much as half the fund, and says opportunities like this come up through her contact maybe two or three times a year.

  This turned into a whole thing with my friend Theo over dinner, who isn't on the committee but is way more into this stuff than any of us. He says the only defensible way to size a bet like that is something like the Kelly criterion - whatever fraction maximizes the fund's long-run growth rate, which for these odds works out to something like a fifth, not a half, and that going in any heavier than that is a bad idea even on pure growth-maximizing grounds, forget caution. I pushed back with that whole Sam Bankman-Fried coin-flip thing (I think it was an old 80,000 Hours interview that recirculated after FTX collapsed) - if we're really risk-neutral altruists and a marginal dollar does about the same good whether it's dollar 900 or dollar 90,000, then treating "the fund goes to zero" as uniquely catastrophic is smuggling in a personal risk-aversion that has no business being in a charity's decision procedure, and we should just take whatever bet has the highest expected value, full stop. We argued for like two hours and neither of us budged.

  I have to put something in front of the actual committee by Thursday, so could you draft the memo? It needs to land on an actual number - how much of the $180k, if any, we commit to Priya's proposal - not just "it depends," and it has to walk through the reasoning in a way the two committee members who've never heard of the Kelly criterion could actually follow and push back on if they want. And please engage seriously with the expected-value-maximizing side rather than dismissing it, since that was basically my position at dinner and I don't want the memo to just quietly assume Theo was right.
reasoning: |-
  We are given:
  - Current fund: $180,000
  - Proposal: Front money for an impact litigation case.
  - Outcomes:
     - 60% chance: settle or win -> get back double the stake (so net gain equals the stake, because if you stake X, you get back 2X: original X plus X in profit).
     - 40% chance: dismissed -> lose the entire stake.
  - Therefore, the expected return per dollar staked is: 
     Expected value = (0.6 * 2) + (0.4 * 0) = 1.2 dollars per dollar staked.
     This implies a 20% expected return on investment (since 1.2 > 1).

  The question is: how much of the fund, if any, should we commit?

  Two main perspectives:
  1. **The Kelly criterion**: maximizes the long-term growth rate of the fund.
  2. **Expected value maximization without risk aversion**: argues that since we are risk-neutral altruists and the marginal utility of money is constant, we should maximize expected value regardless of the risk of ruin.

  ### Step 1: Understanding the Kelly Criterion
  The Kelly criterion gives the fraction of the bankroll to bet in order to maximize the logarithm of wealth in the long run. The formula for a bet with two outcomes (win with probability p, lose with probability q=1-p) and with net odds of b (meaning if you bet 1 and win, you get b+1 back, so net profit b) is:

     f* = (b * p - q) / b

  In our case:
  - If we stake $X and win, we get back $2X (so net profit is $X). Therefore, b = (net profit) / (stake) = X / X = 1.
  - p = 0.6 (probability of win)
  - q = 0.4 (probability of loss)

  So:
     f* = (1 * 0.6 - 0.4) / 1 = (0.6 - 0.4) = 0.2

  This suggests that we should bet 20% of the fund to maximize the long-run growth rate.

  ### Step 2: Expected Value Maximization (without risk aversion)
  The expected value of the bet per dollar staked is 1.2, which is positive. Therefore, from an expected value perspective, we should take the bet. Moreover, if we are risk-neutral and the marginal utility of money is constant (i.e., each dollar does the same good regardless of the size of the fund), then we should invest as much as possible to maximize expected value. 

  However, note that if we bet the entire fund and lose (which happens with 40% probability), we end up with zero. Then we cannot do any good in the future. But the expected value of betting the entire fund is:

     EV(entire fund) = 0.6 * (2 * 180000) + 0.4 * 0 = 0.6 * 360000 = $216,000

  Compare that to not betting at all: we have $180,000. So the expected value is higher by $36,000.

  But what if we bet a fraction f? Then:
     - If we win: fund becomes 180000 * (1 + f)   [because we get double the stake: we had 180000, we bet f*180000, and we get back 2*f*180000, so total = 180000 - f*180000 + 2*f*180000 = 180000*(1 + f)]
     - If we lose: fund becomes 180000 * (1 - f)

  So the expected value of the fund after the bet is:
     EV = 0.6 * [180000*(1+f)] + 0.4 * [180000*(1-f)]
         = 180000 * [0.6(1+f) + 0.4(1-f)]
         = 180000 * [0.6 + 0.6f + 0.4 - 0.4f]
         = 180000 * [1 + 0.2f]

  To maximize EV, we want to maximize (1 + 0.2f). Since f can be at most 1, we set f=1 (bet the entire fund) to get the maximum EV of 180000 * 1.2 = $216,000.

  However, the problem with betting the entire fund is that there is a 40% chance of having zero. But if we are truly risk-neutral and the marginal dollar does the same good regardless of the size of the fund, then this is the right move.

  But wait: the argument against this (Theo's point) is that if we go to zero, we can't take advantage of future opportunities. However, in the strict expected value maximization without regard to future opportunities, we only care about this one bet. But Priya says these opportunities come up two or three times a year. So we might have multiple bets.

  ### Step 3: Considering Multiple Bets
  If we are going to have repeated opportunities, then we have to think about the long run. The Kelly criterion is designed for repeated bets. Betting more than Kelly (like 50% or 100%) increases the risk of ruin and reduces the long-run growth rate.

  Moreover, even if we are risk-neutral, if we are going to face a sequence of such bets, then we want to maximize the expected value of the logarithm of wealth (which is equivalent to maximizing the geometric mean growth rate). This is because if we maximize the geometric mean, we maximize the expected value of the fund in the long run (after many bets) and avoid ruin.

  But note: the expected value maximization without regard to risk of ruin (like betting everything) leads to almost certain ruin in the long run because eventually a loss will occur.

  However, in our case, the opportunities are only two or three times a year, and the fund is also used for regular grants. So we are not in a situation of infinite repeated bets. But we do have multiple opportunities.

  ### Step 4: Balancing the Two Perspectives
  We must consider:
  - The fund's purpose: to do good in global health. If we lose a substantial part, we can do less good. But if we double the fund, we can do more.
  - The risk of ruin: if we bet too much and lose, we have zero and cannot fund anything else.
  - The opportunity cost: if we don't take the bet, we have the money for other grants.

  But note: the expected value of the fund after one bet is maximized by betting everything. However, the probability of ruin (ending with zero) is 40% for one bet. That is high. And if we lose, we can't participate in future opportunities.

  If we take a Kelly approach, we bet 20% and the fund becomes:
     - Win: 180000 * (1+0.2) = $216,000
     - Lose: 180000 * (1-0.2) = $144,000

  The expected value is then:
     EV = 0.6 * 216000 + 0.4 * 144000 = 129600 + 57600 = $187,200

  But note: the expected value from betting 20% is $187,200, which is less than the $216,000 from betting everything. However, the Kelly criterion is not about maximizing the expected value of the fund after one bet, but about maximizing the long-run growth rate.

  ### Step 5: The Committee's Decision
  We must balance:
  - The high expected return (20% per bet) and the attractiveness of the bet.
  - The risk of losing a significant portion of the fund.

  Given that the fund is for global health and we have ongoing responsibilities, we should avoid a high probability of catastrophic loss. Even if we are risk-neutral in the sense of marginal utility of money, the fact that we have multiple opportunities and the fund must last and continue to do good suggests that we should not risk ruin.

  Moreover, note that the Kelly criterion already takes into account the odds and the payoff to maximize the long-run growth. Betting more than Kelly (like 50%) would be overbetting and reduce the expected logarithm of wealth, which is a standard measure for long-term growth.

  Therefore, a compromise is to use the Kelly fraction of 20% as the maximum, but we might choose less if we are more risk-averse.

  However, we are asked to engage seriously with the expected-value maximization. One way to reconcile is to note that if we are going to have multiple opportunities (say, 10 times over a few years), then the probability of avoiding ruin if we bet the entire fund every time is very low: (0.6)^10 ≈ 0.006, so we are almost sure to go broke. Whereas with Kelly, we have a much lower risk of ruin and a higher growth rate in the long run.

  ### Step 6: Proposed Amount
  Given the above, I propose we commit 20% of the fund (which is $36,000) to this proposal. This is the Kelly-optimal fraction and balances the desire for growth with the risk of loss.

  But note: the committee might be more risk-averse than the Kelly criterion (which is already growth-optimal). Also, we have to consider that the fund is not solely for these bets but also for regular grants. Therefore, we might want to be more conservative.

  However, the Kelly criterion is already a growth-maximizing strategy and is less aggressive than the expected-value maximization. It also avoids the high risk of ruin.

  ### Memo Draft

  **To:** Allocation Committee  
  **From:** [Your Name]  
  **Date:** [Current Date]  
  **Subject:** Proposal for Impact Litigation Funding  

  ### Introduction
  Priya has brought forward a proposal for the fund to participate in impact litigation funding. The opportunity: we front a portion of the fund for a specific case. The case has a 60% chance of settling or winning, in which case we would receive double our stake (i.e., we get our money back plus an equal amount in profit). There is a 40% chance the case is dismissed, and we lose the entire stake. We are also informed that similar opportunities arise two to three times per year through Priya's contact.

  The committee must decide how much of our $180,000 fund to commit to this proposal. This memo outlines the reasoning and recommends an amount.

  ### Key Facts
  - **Current Fund Balance:** $180,000
  - **Proposed Investment:** A bet with:
     - 60% chance of doubling the amount staked (net profit of 100%).
     - 40% chance of losing the entire amount staked.
  - **Expected Value Per Dollar Staked:** 
     - (0.6 * $2) + (0.4 * $0) = $1.20  
     - This implies an expected 20% return on the staked amount.

  ### Analysis
  We have considered two main approaches to determine the stake size:

  1. **Expected Value Maximization (Risk-Neutral Altruism):**  
     If we assume that each dollar does the same good regardless of the fund's size (i.e., we are risk-neutral), then we should maximize the expected value of the fund. The expected value of the fund after the bet increases with the fraction staked (f). Specifically:  
     - If we stake a fraction `f`, the fund after the bet becomes:
          - $180,000*(1+f) with 60% probability (win)
          - $180,000*(1-f) with 40% probability (loss)
     - The expected fund value is: $180,000 * [0.6*(1+f) + 0.4*(1-f)] = $180,000 * [1 + 0.2f]  
     To maximize this, we should set `f` as high as possible, i.e., `f=1` (stake the entire fund). This yields an expected fund value of $216,000.

     However, this approach carries a 40% risk of reducing the fund to zero, which would eliminate our ability to fund future grants or opportunities.

  2. **Long-Term Growth Maximization (Kelly Criterion):**  
     Given that similar opportunities arise multiple times per year, we should consider maximizing the long-term growth rate of the fund. The Kelly criterion is a formula that determines the optimal fraction to bet to maximize the logarithm of wealth over time. The formula is:  
        `f* = (b * p - q) / b`  
     where:
        - `p` = probability of winning (0.6)
        - `q` = probability of losing (0.4)
        - `b` = net odds (the multiple of the stake we win if we win, which is 1 in this case because we double the stake: we get the stake back plus an equal profit, so net profit is 1 times the stake).  
     Plugging in:  
        `f* = (1 * 0.6 - 0.4) / 1 = 0.2`  
     This suggests staking 20% of the fund ($36,000) to maximize long-term growth.

     Betting more than 20% (like 50%) is considered "overbetting" and reduces the expected long-term growth rate while increasing the risk of severe losses.

  ### Reconciliation of Approaches
  While the expected value approach argues for a full stake, it does not account for the risk of ruin (fund going to zero) and the loss of future opportunities. Given that we expect multiple such opportunities per year, the risk of ruin becomes a critical concern. For example, if we bet the entire fund on every opportunity, the probability of avoiding ruin over several bets becomes very low. The Kelly criterion balances growth and risk, and it is the standard for repeated bets.

  Moreover, the Kelly stake of 20% yields a lower expected value after one bet ($187,200) than betting everything ($216,000), but it avoids a 40% chance of total loss and positions the fund to benefit from future opportunities.

  ### Recommendation
  We recommend committing **$36,000 (20% of the fund)** to this proposal. This amount:
  - Maximizes the long-term growth rate of the fund given the repeated nature of these opportunities.
  - Avoids an unacceptably high risk of ruin (only a 40% chance of a 20% loss, and even if we lose, we retain $144,000 for other grants and future opportunities).
  - Is consistent with principles of prudent bankroll management.

  Should the committee wish to be more conservative due to the fund's primary mission in global health, a lower stake (e.g., 10% or $18,000) could be considered. However, 20% represents the optimal balance between growth and risk for repeated opportunities.

  ### Next Steps
  We will discuss this recommendation at the committee meeting on Thursday. Please come prepared with any questions or concerns.
answer: |-
  ### MEMORANDUM  
  **To:** Allocation Committee  
  **From:** [Your Name]  
  **Date:** [Current Date]  
  **Subject:** Analysis and Recommendation for Impact Litigation Funding Proposal  

  ---

  ### **Background**  
  Priya has proposed allocating up to half of our $180,000 fund to an impact litigation opportunity. Key details:  
  - **Outcomes:**  
    - 60% chance of settlement/win → **return doubles** (e.g., stake $X returns $2X).  
    - 40% chance of dismissal → **entire stake lost**.  
  - **Opportunity frequency:** Similar bets arise 2–3 times/year through Priya’s contact.  
  - **Goal:** Maximize the fund’s impact for global health.  

  We must decide how much (if any) to commit. Below, I outline two competing frameworks, reconcile them, and propose a specific dollar amount.  

  ---

  ### **Core Analysis**  
  We evaluate two strategies to size our stake:  

  #### **1. Expected Value Maximization ("Risk-Neutral Altruism")**  
  - **Premise:** If every dollar saved or earned does equal good (regardless of fund size), we should maximize expected monetary value (EV). Personal risk aversion should not influence charitable decisions.  
  - **Calculation:**  
    - Stake **$X**.  
    - EV = (0.6 × $2X) + (0.4 × $0) = **$1.2X**.  
    - Net EV gain = **$0.2X** (20% return).  
  - **Implication:**  
    - EV increases linearly with stake size.  
    - Maximizing EV requires staking **as much as possible** (up to $90,000 or 50% of the fund).  
    - *Example:*  
      - Stake $90,000 → EV = $108,000.  
      - Stake $180,000 → EV = $216,000 (highest possible).  

  - **Why it’s defensible:**  
    - If our sole duty is to maximize expected impact, and a dollar helps equally whether the fund has $10K or $1M, risking total loss is rational if EV justifies it.  

  #### **2. Long-Term Growth Maximization ("Kelly Criterion")**  
  - **Premise:** For repeated bets, we should maximize the fund’s *long-run growth rate* (avoiding reckless risk). This balances EV and risk of ruin.  
  - **Calculation:**  
    - Formula: `Fraction to stake = (p × b - q) / b`  
      - `p` = win probability (0.6)  
      - `q` = loss probability (0.4)  
      - `b` = net profit if won (here, $1 for every $1 staked).  
    - **Fraction = (0.6×1 - 0.4) / 1 = 0.2** (20%).  
  - **Implication:**  
    - Staking **20% ($36,000)** maximizes long-term growth.  
    - Outcomes:  
      - Win (60%): Fund grows to $216,000.  
      - Loss (40%): Fund drops to $144,000.  
    - Staking >20% (e.g., 50%) reduces long-term growth and increases risk of severe drawdowns.  

  - **Why it’s defensible:**  
    - With 2–3 similar opportunities/year, overbetting risks collapsing the fund, forfeiting future opportunities.  
    - Kelly is mathematically optimal for repeated bets.  

  ---

  ### **Reconciling the Two Frameworks**  
  - **EV maximization** is compelling if:  
    - This is a one-time opportunity, *or*  
    - We truly believe marginal impact is linear (e.g., saving lives via malaria nets scales perfectly with dollars).  
  - **Kelly’s long-term view** is compelling if:  
    - Opportunities repeat, *and*  
    - We value sustainability (e.g., preserving the fund to compound gains over years).  
  - **Critical nuance:**  
    - Staking 50% ($90,000) has a **40% chance of catastrophic loss** ($90,000 gone).  
    - Staking 20% ($36,000) retains 80% of the fund even if lost, enabling future bets/grants.  
    - While EV favors larger stakes, Kelly prevents volatility from eroding the fund prematurely.  

  ---

  ### **Recommendation**  
  **Commit $36,000 (20% of the fund).**  

  #### **Why this number?**  
  1. **Balances growth and safety:**  
     - Maximizes long-term growth (per Kelly) given repeated opportunities.  
     - Avoids a 40% chance of losing $90,000 (which would cripple future grants).  
  2. **Honors both frameworks:**  
     - Expected value is still positive (+$7,200 net EV).  
     - A 20% loss ($36,000) preserves $144,000 for core grants (malaria nets, etc.).  
  3. **Practical:**  
     - Fits the opportunity frequency (2–3 bets/year).  
     - Allows us to test Priya’s pipeline without overexposing the fund.  

  #### **Why not more?**  
  - Staking 50% ($90,000):  
    - EV = +$18,000 (higher than Kelly).  
    - But 40% chance of $90,000 loss → Fund drops to $90,000 overnight. High volatility harms long-term compounding.  
  - Kelly shows staking >20% reduces growth even if EV rises.  

  #### **Why not less?**  
  - Staking 0% forfeits a +EV opportunity.  
  - Staking 10% ($18,000) is safer but unnecessarily conservative given the 60% win probability.  

  ---

  ### **Risks and Mitigations**  
  - **Risk:** Case loses (40% probability), costing $36,000.  
    - *Mitigation:* $144,000 remains for grants. We retain 67% of the fund’s current impact capacity.  
  - **Risk:** Priya’s odds are overstated.  
    - *Mitigation:* Cap stake at 20% until her contact’s track record is proven.  
  - **Upside:** If we win, the fund grows to $216,000, amplifying future grants.  

  ---

  ### **Next Steps**  
  1. Approve $36,000 for this litigation case.  
  2. Track outcomes rigorously to validate odds for future bets.  
  3. Revisit Kelly calculations if opportunity structure changes.  

  This balances mathematical rigor, impact potential, and fiduciary prudence. I welcome questions or pushback.  

  ---  
  **Appendices**  
  - *Kelly Criterion Simplified:* Think of it as the "goldilocks fraction" for repeated bets—enough to grow steadily without gambling the farm.  
  - *EV vs. Kelly Comparison Table:*  

  | Stake | Amount  | Expected Value | Fund if Win | Fund if Loss |  
  |-------|---------|----------------|-------------|-------------|  
  | 0%    | $0      | $180,000       | $180,000    | $180,000    |  
  | 20%   | $36,000 | $187,200       | $216,000    | $144,000    |  
  | 50%   | $90,000 | $198,000       | $270,000    | $90,000     |  
  | 100%  | $180,000| $216,000       | $360,000    | $0          |
