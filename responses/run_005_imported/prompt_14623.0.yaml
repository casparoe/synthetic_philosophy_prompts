  First, I should ensure the dialogue mirrors real academic sparring—no strawmanning. Elena would anchor in Quine's core argument: all stimulus meanings align, so disambiguation is impossible without smuggling in English categories. Marcus needs plausible counterpoints, like questioning Quine's "austere" evidence constraints or invoking pragmatic interpretive principles. 

