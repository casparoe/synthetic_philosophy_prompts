  For the recommendation... rejecting feels too harsh given the artistic merit, but awarding full prize might undermine the educational intent. A compromise? Maybe "Accepted with Honorable Mention" - validates the conceptual strength while reserving competitive prizes for works demonstrating technical growth. 

