  Okay, let me try to unpack what the user is asking here. They stumbled upon Aquinas' Doctrine of Double Effect (DDE) during a debate about self-driving cars and trolley problems. Specifically, they're confused about why Aquinas distinguishes between regular people and public officials when it comes to intending harm in self-defense. 

  First, I need to recall the core of Aquinas' argument. He says that an act can have two effects—one intended (saving oneself) and one unintended (killing the aggressor). For regular folks, the unintended death is just a side effect, so it's morally acceptable if necessary and proportional. But then Aquinas throws a curveball: public officials can actually intend to kill if it's for the common good. 

  Hmm, why does he make that distinction? Let me think... For civilians, intending to kill is always wrong because only the state has that authority. But soldiers or judges acting in their official capacity aren't committing murder; they're executing justice or defense of the community. That's why Aquinas carves out this exception. 

  The user seems to grasp the DDE part but is tripped up by the "public authority" bit. They wonder if modern trolley problem discussions oversimplify Aquinas by ignoring this second layer. Good catch! Contemporary ethicists often strip DDE from its original context where natural law and state authority were foundational. 

  Also, the user might be hinting at a deeper need: understanding how historical philosophy applies to modern tech ethics. Their AV debate probably needs more nuance—maybe distinguishing between an AV's "civilian" role versus state-operated vehicles? 

  I should emphasize that Aquinas isn't offering "two routes" to the same outcome. Regular people get justification via DDE (didn’t intend harm). Officials get justification via authority (intended harm is legitimized by their role). The ethical mechanisms are entirely different. 

