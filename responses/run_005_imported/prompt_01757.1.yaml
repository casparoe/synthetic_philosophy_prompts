prompt: |-
  So this is going to sound random but stick with me. I'm taking a modal logic seminar this semester (needed an elective, dont judge) and we just spent two whole class periods on Gödel's ontological argument for God's existence, the one built out of those "positive property" axioms. My professor raced through the definitions of God-like, essence, and necessary existence and then basically just dropped on us that the whole system implies something called "modal collapse," meaning if the axioms hold then whatever happens to be actually true is also necessarily true, so there's no real contingency left anywhere. She said that's basically why nobody serious treats this as an actual proof of God, but she didn't really unpack why the collapse falls out of the axioms or whether a defender could patch it, and its been bugging me ever since. To make things weirder, my cousin texted me one of those "computer scientists confirmed a famous proof of God's existence" articles this week -- I think it's about that Benzmüller guy from Berlin who ran the whole argument through an automated theorem prover a while back -- and now I don't even know what to text back.

  Could you write me an essay that actually walks through, in enough detail that I could reconstruct the reasoning myself, why Gödel's axioms force this modal collapse? And then settle the actual question for me: is that objection fatal to the argument, or is there a decent way to revise the axioms to dodge it (I have some vague memory of someone tweaking the definition of "essence" to get around Sobel's objection, but I might be misremembering) without gutting the parts of the proof that made it interesting in the first place? Please don't just lay out both sides and shrug at the end -- actually tell me whether you think the argument survives in some patched form or is basically dead, and defend that.
