prompt: |-
  I'm on my school's ASB finance committee -- the group that splits our activities budget between clubs each semester. This year it's drama club vs. the new Civics Lab club: drama wants extra funding for a full spring musical, and Civics Lab wants that same money redirected into student-run town hall nights instead. Their president keeps quoting Rousseau's Letter to d'Alembert at us -- his whole argument that watching a play just makes you a passive spectator soaking up fake emotion in the dark, while a real civic festival (he's got this bit about literally planting a flower-covered stake in the town square and gathering everyone around it) actually turns citizens into participants instead of an audience. Half the commitee thinks that's honestly a fair point about what a school should be funding, the other half thinks its just some 260 year old guy being weird about actors. Can you draft the funding recommendation memo I'm bringing to Thursday's vote? It has to actually land on a side, not some wishy-washy split down the middle, and it needs to take the Rousseau point seriously instead of just waving it off as old-fashioned.
