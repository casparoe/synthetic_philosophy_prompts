prompt: |-
  So we just covered Good's theorem in my decision theory class (the "value of information is always non-negative" result — I think it's from a 1967 paper of his, something like "On the Principle of Total Evidence"), and the basic idea is that a rational Bayesian agent should never refuse a chance to look at free information before acting, since in expectation it can only ever make you do at least as well as before, never worse. Which sounds pretty airtight in the abstract, but its been bugging me all week because it seems to fly in the face of how people actually behave. Like, I've got a friend who point-blank refuses to check her exam grades until finals are totally over, and my uncle turned down a free genetic test for a condition that runs in our family because, in his words, "there's no cure either way so why would I want to know." Are they just being irrational, or is Good's theorem not actually saying what I think its saying?

  Basically I'd love it if you could walk me through the most important implications of the theorem for these kinds of everyday "strategic ignorance" calls — stuff like whether to read the reviews before a trip, check your bank balance during a rough month, or get tested for something you can't even treat anyway. I get that the theorem is only supposed to be about the instrumental value of info for making some downstream decision, so I have a hunch the caveats (what counts as "free," what it means to "act optimally" afterward, whether the decision problem even stays fixed) are doing a lot of hidden work, but I can't quite articulate where exactly the theorem stops applying to real life. My professor name-dropped a whole "information avoidance" literature in econ/psych that supposedly deals with exactly this gap, but we didn't really get into it during lecture, so I'm kind of left hanging.
