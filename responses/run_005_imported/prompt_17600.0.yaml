  First, I need to recall Good's theorem accurately. It says that for a Bayesian agent, the expected utility of acquiring free information before a decision is non-negative. But the key here is the strict assumptions: the information must be free, the agent must update beliefs correctly, and decisions must maximize utility. The user's hunch about caveats is spot on—these assumptions often don't hold in real life.

  The user mentioned "strategic ignorance" examples like not reading reviews or checking bank balances. Each of these scenarios likely violates one or more of Good's assumptions. For instance, emotional costs or anxiety might make information not truly "free." Also, if no action can be taken based on the info, then instrumental value is zero, but there might be intrinsic costs.

