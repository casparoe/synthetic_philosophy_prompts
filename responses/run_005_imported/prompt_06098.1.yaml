answer: |-
  ## Memorandum: Policy on Persistent Forecaster Disagreement

  **To:** Forecasting Group Members  
  **From:** Rules Committee Chair  
  **Subject:** Updated Protocol for Resolving Persistent Disagreements After Discussion  
  **Date:** October 26, 2023  

  This memo addresses our procedure when two lead forecasters remain significantly divided after a documented discussion. We acknowledge the serious concerns raised regarding Robert Aumann’s agreement theorem and its implications for our current practice of averaging. After careful review, the Rules Committee recommends retaining a modified averaging approach, grounded in both theoretical rigor and practical realism. Here’s why:  

  ### 1. **Aumann’s Theorem: Valid Insight, Limited Applicability**  
  Aumann’s result demonstrates that two *perfectly rational* agents with *identical prior beliefs* cannot maintain disagreement if their *posterior probabilities are common knowledge*. While this highlights an ideal standard, our context diverges in critical ways:  
  - **Perfect Rationality vs. Human Fallibility**: Aumann assumes agents process information flawlessly. Our forecasters—though skilled—operate under time constraints, cognitive biases, and imperfect information-sharing. A persistent gap may reflect honest limitations in reasoning or communication, not bad faith.  
  - **Identical Priors vs. Diverse Perspectives**: Our forecasters bring varied experiences (e.g., engineering, market analysis) that shape distinct prior assumptions. These legitimate differences can withstand discussion without implying irrationality.  
  - **Common Knowledge vs. Practical Dialogue**: Achieving true "common knowledge" (where each knows the other knows their estimate, *ad infinitum*) is theoretically demanding. Our calls foster alignment but cannot guarantee this depth, especially with complex or ambiguous evidence.  

  **In short: Aumann’s theorem describes an idealized world of frictionless reasoning. Our group operates in the real world, where disagreement can persist without negligence.**  

  ### 2. **Why Averaging Remains Our Best Practical Tool**  
  Given the above, we reject the claim that persistent gaps *must* signal unreliability. Instead, we recommend:  
  **Concrete Rule:**  
  > *When two lead forecasters’ estimates remain divergent (±15% or more) after a structured discussion, the group will adopt the **simple average of their two estimates**. Before finalizing, both forecasters must append a brief (1–2 sentence) note to the forecast record highlighting the core unresolved assumption driving their disagreement (e.g., “Disagreement hinges on whether Supplier X can deliver component Y by Q1”).*  

  **This approach is justified because:**  
  - **It Respects Diverse Expertise**: Averaging incorporates distinct perspectives when full convergence is impractical, reducing the risk of anchoring to one potentially flawed view.  
  - **It’s Efficient and Transparent**: Forcing further discussion risks diminishing returns. Documenting the crux of disagreement maintains accountability and aids future calibration.  
  - **It Aligns with Empirical Evidence**: Studies (e.g., Tetlock’s forecasting tournaments) show simple averages of diverse forecasts often outperform individual experts—even after discussion.  
  - **Our Leaderboard Mitigates Long-Term Irrationality**: Persistent poor calibration affects individual scores, incentivizing Bayesian updating over time. Averaging doesn’t shield poor performers.  

  ### 3. Addressing Key Concerns  
  - *“Averaging rewards stubbornness or poor reasoning!”*  
    Our leaderboard tracks individual calibration, exposing systematic errors. Chronic unreliability is penalized organically.  
  - *“We should debate until consensus!”*  
    While discussion is valuable, marginal gains beyond our structured process may not justify the time cost. Efficiency matters for operational sustainability.  
  - *“What if one forecaster is clearly better?”*  
    We already weight forecasts by historical accuracy *at the aggregate level* (via the leaderboard). For single disagreements, simplicity avoids gaming.  

  ---

  **Conclusion:** Aumann’s theorem reminds us to strive for rigorous dialogue and shared understanding—goals embedded in our discussion protocol. However, its idealized assumptions do not mandate convergence in our context. **We will continue using averaged estimates after discussion, augmented by documented disagreement points.** This balances theoretical insight with respect for human expertise, fallibility, and operational needs.  

  The updated rule takes effect next forecast cycle. Thank you for your thoughtful engagement on this issue.  

  **Rules Committee Chair**  
  [Approved by Rules Committee: 3-0]
