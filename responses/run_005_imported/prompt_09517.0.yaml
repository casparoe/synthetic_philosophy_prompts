  First, I need to recall Frege's key points. He distinguishes thoughts (Gedanken) as objective, timeless entities in a third realm. Senses are the way we grasp these thoughts, but they're not subjective. His examples with indexicals like "today" show that the same words can express different thoughts in different contexts, but the thought itself remains constant when adjusted correctly (e.g., saying "yesterday" the next day). Also, in the Aristotle footnote, he acknowledges that different speakers might associate different descriptions with a name, but the sense is still objective even if imperfectly grasped.

  Now, looking at two-dimensionalism: primary intensions are tied to epistemic scenarios, which depend on what an idealized reasoner can conceive or rule out a priori. Secondary intensions handle metaphysical necessity a la Kripke. Chalmers uses this to explain cognitive significance, like why "Hesperus is Phosphorus" is informative.

  The user wants to know if Frege would see primary intensions as capturing his sense or as falling into psychologism. I remember that Frege was adamantly against psychologism—mixing psychology with logic. For him, senses are objective and mind-independent. Epistemic possibilities, however, are defined by what's conceivable, which depends on the mind. That's a red flag for Frege. 

  Also, Frege's handling of indexicals involves adjusting words to keep the thought constant. Kaplan's character is a function from contexts to contents, which might seem like a formalization. But Frege didn't need a separate system; he just adjusted the words. So he might see Kaplan's machinery as overcomplicating what word adjustments achieve simply.

  The user emphasized using Frege's texts, not caricatures. So I should focus on "The Thought" and the footnote. In "The Thought," Frege stresses that thoughts are independent of thinking. Any framework tying sense to epistemic access would undermine that. The third realm's objectivity is key. Even though senses can be grasped imperfectly, the sense itself is still objective. Two-dimensionalism's primary intensions are rooted in rational idealizations, which are still mental. That's psychologism in Frege's eyes.

  Also, in the Aristotle example, Frege tolerates variation in descriptions but doesn't make sense relative to individual cognitive states. Primary intensions vary based on scenarios defined epistemically, which Frege would reject. He'd see it as making sense subjective, even if idealized.

  So the verdict: Frege would reject two-dimensionalism as psychologism. He might appreciate the effort to handle cognitive significance but would balk at grounding sense in epistemic possibilities. His simplicity with indexicals shows he'd prefer direct word adjustment over layered functions. His commitment to the third realm's mind-independence is non-negotiable.
answer: |-
  Based on a close reading of Frege's core commitments in "The Thought" and "On Sense and Reference," **he would decisively reject the two-dimensionalist apparatus, particularly the primary (epistemic) intension, as a form of psychologism that fatally compromises the objective, third-realm status of sense (Sinn) and thought (Gedanke).** Here's the defense, grounded in his texts:

  1.  **The Third Realm's Mind-Independence is Non-Negotiable:** Frege's central argument in "The Thought" is that thoughts exist independently of any mind's grasping them. They are "not the product of thinking" but "something objective" accessible to many thinkers ("The Thought," p. 335). This objectivity is *constitutive* of their nature as bearers of truth value. The "third realm" is defined precisely by its independence from the private, subjective "first realm" of ideas (Vorstellungen) and the physical "second realm." Any account making the *identity* or *individuation* of sense contingent on *any* feature of minds (even idealized ones) violates this core tenet. Primary intensions, defined by mapping *epistemically possible scenarios* (conceivable states of affairs for an ideal reasoner) to extensions, fundamentally tie sense to *conceivability* and *rational accessibility*. For Frege, this grounds sense in the mental (albeit idealized), precisely the realm he seeks to escape. As he states: "The thought, in itself immaterial, clothes itself in the material garment of a sentence and thereby becomes comprehensible to us. We say a sentence *expresses* a thought... The thought is something immaterial and all its parts are immaterial" ("The Thought," p. 354). Immateriality here means *ontological independence*, not epistemic manageability.

  2.  **Psychologism Redefined, Not Avoided:** Two-dimensionalists aim to avoid crude psychologism by using idealized reasoners. However, Frege's critique targets *any* grounding of logic or sense in *faculties of the mind*. He explicitly rejects not just empirical psychology, but also Kantian-style transcendental psychology: "Often... people... speak of *laws of thought*... But... this confuses the grounds which justify a judgment with the causes which actually produce the judgment... To avoid this ambiguity, I assign to logic the task of discovering the laws of *truth*, not the laws of *judging* or *thinking*." ("Thought," p. 327). Primary intensions are defined by *what an ideal reasoner cannot rule out a priori* – they are laws of *rational thinking* (justified judging), not laws of *truth* in Frege's strict sense. The scenarios are individuated by what is *conceivable*, a mental act. Frege would see this as replacing one form of psychologism (empirical associations) with another (idealized rational capacities), still failing to capture the mind-independent *truth conditions* anchored in the third realm. The sense of "Aristotle" is *what it is* objectively, even if imperfectly grasped via different descriptions by different speakers (footnote, "On Sense and Reference"). Making its identity depend on epistemic scenarios defined by conceivable evidence reintroduces the subjectivity he explicitly tolerates as an *imperfection of language*, not as constitutive of sense.

  3.  **Indexicality Solved by Thought-Adjustment, Not Contextual Machinery:** Frege's handling of "today/yesterday" demonstrates his commitment to a *single*, context-invariant thought as the bearer of truth. When context changes, we *adjust the words* to express the *same* timeless thought. He doesn't posit a "character" (a function from contexts to contents) *in addition to* the thought. The thought expressed yesterday with "Today is fine" is the *very same* thought expressed today with "Yesterday was fine." The linguistic vehicle changes to track the invariant thought. Kaplan's character is a *rule* for generating different contents (thoughts) in different contexts. Frege would see this as unnecessary ontological proliferation: "A different thought does not correspond to every difference in the words used... The same thought can be split up in different ways... The thought itself does not yet determine what is to be regarded as the subject" ("Thought," p. 353). His solution requires only recognizing that the *same thought* can be linguistically realized differently depending on utterance time. Introducing a complex function (character) mapping contexts to different thoughts (contents) replaces Frege's elegant adjustment with machinery that generates *different* thoughts for different contexts, contradicting his explicit claim that the *thought* remains identical when correctly adjusted. He would see Kaplan's system as describing *how we use language to express different thoughts contextually*, not as capturing the *invariant sense* he posits.

  4.  **Sense vs. Route to Reference vs. Epistemic Access:** Frege acknowledges that different speakers associate different descriptions ("routes to the reference") with a name like "Aristotle." Crucially, he treats this as a *deficiency* in ordinary language, where the *objective* sense is imperfectly grasped, *not* as meaning the sense itself is relative to the speaker's knowledge ("On Sense and Reference," footnote). The sense *is* the objective mode of presentation determining the reference. Two-dimensionalism's primary intension, however, is defined *by* the speaker's (idealized) epistemic access – the scenarios compatible with their a priori knowledge. Frege would argue this conflates the *subjective route by which a thinker grasps* an objective sense with the *sense itself*. The primary intension describes a *method of identification* tied to cognitive states, whereas Fregean sense *is* the objective condition determining the reference. For him, the informativeness of "Hesperus is Phosphorus" stems from two *different objective senses* (modes of presentation) converging on the same reference. Chalmers uses primary intensions to explain this by saying the same secondary intension (reference across metaphysically possible worlds) is associated with two different primary intensions (epistemic possibilities). Frege would reject this: the cognitive difference is already fully explained by the difference in the *objective senses* themselves, residing in the third realm. Adding an epistemic layer defined by idealized minds is redundant and psychologistic.

  **Verdict:** Frege would view two-dimensionalism, despite its ambition to rescue cognitive significance, as a sophisticated relapse into the psychologism he vehemently opposed. The primary intension's dependence on epistemic possibilities defined by ideal reasoners fundamentally undermines the third-realm objectivity of sense and thought. His handling of indexicals shows he believed the invariance of thought across contextual word adjustment was sufficient, rendering Kaplan's character/content distinction an unnecessary complication generating different thoughts where he saw identity. While he might acknowledge the two-dimensionalists' attempt to grapple with the phenomena he identified (cognitive significance, context-dependence), he would see their solution as betraying the core ontological commitment of his philosophy: the mind-independent reality of sense and thought. His verdict would be a firm rejection.
