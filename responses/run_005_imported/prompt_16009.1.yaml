answer: |-
  ## The Kelly Criterion: Rationality Norm or Growth-Optimal Heuristic? An Adjudication

  The debate over the Kelly criterion – staking a fraction of wealth proportional to the edge divided by the odds on favorable bets – strikes at the heart of decision theory under uncertainty, particularly concerning repeated gambles with multiplicative wealth dynamics. Your dinner argument perfectly encapsulates the core tension: is maximizing expected logarithm of wealth (Kelly) a fundamental principle of rationality, or merely a useful tool contingent on specific assumptions about utility and time? Let's reconstruct the strongest arguments for both positions and reach a verdict.

  **The Traditional View: Kelly as a Special Case of Expected Utility Maximization**

  The traditional decision-theoretic position, championed by Paul Samuelson and rooted in the axioms of von Neumann-Morgenstern and Savage, is unequivocal: **rationality is defined by maximizing expected utility relative to a coherent set of preferences.** The Kelly criterion is *derived* from this framework, not foundational to it.

  1.  **The Utility Function is Paramount:** An agent's attitude towards risk is captured entirely by their utility function over wealth (U(W)). Kelly betting emerges *only* when U(W) = log(W). For any other utility function (e.g., U(W) = W, U(W) = -exp(-aW) for constant absolute risk aversion, U(W) = W^(1-γ)/(1-γ) for constant relative risk aversion), the optimal betting fraction differs. Why should the logarithm be privileged? There is no a priori reason why all rational agents *must* have logarithmic utility. A retiree preserving capital might have near-linear utility over a range, while a young venture capitalist might embrace higher risk than log utility implies.
  2.  **Samuelson's Finite Horizon Objection:** The "long-run, almost-sure" dominance argument is mathematically correct but practically misleading. No agent faces an infinite sequence of identical, independent bets. In the *finite* real world (even with many bets), an agent with a different utility function might rationally accept a *lower* long-run growth rate in exchange for:
      *   **Reduced Downside Risk:** Kelly avoids ruin, but it can still lead to significant drawdowns painful for risk-averse agents. Fractional Kelly (betting less) reduces volatility significantly while sacrificing only a modest amount of asymptotic growth.
      *   **Higher Expected Terminal Utility:** For finite N, maximizing E[U(W_N)] *does not generally coincide* with maximizing E[log(W_N)]. An agent with U(W) = sqrt(W) might rationally choose a strategy with lower expected log growth but higher expected sqrt(W) after N bets.
  3.  **The "Ensemble Average" is the Correct Expectation:** Traditional expected utility explicitly averages over possible future states (the "ensemble") weighted by their probabilities. This *is* the rational way to evaluate a strategy *ex ante* under uncertainty. An agent doesn't know which single trajectory they will experience; they must base decisions on the distribution of possible outcomes, incorporating their valuation (utility) of each possible outcome. Ignoring the distribution and focusing solely on the long-run growth property of a single path ignores the agent's specific risk preferences over the *distribution* of potential finite-horizon outcomes.

  **The Geometric Rationality / Ergodicity View: Kelly as Foundational for Multiplicative Dynamics**

  Proponents of the ergodicity economics perspective (e.g., Ole Peters, Alexander Adamou) argue that traditional expected utility theory makes a critical, often unstated assumption: **ergodicity**. A process is ergodic if its time-average (along a single trajectory) converges to its ensemble-average (over many parallel worlds). They contend that multiplicative wealth growth under repeated bets is *non-ergodic*, fundamentally changing the rational optimization target.

  1.  **The Single Trajectory Imperative:** An agent doesn't live in an ensemble of parallel worlds; they live a single life along a single wealth trajectory. Rationality, therefore, must concern itself with optimizing the properties of this *single realized path*. For multiplicative wealth (W_n = W_0 * Π(1 + f_i*X_i)), the key property is the *time-average growth rate*: g = lim_(N->∞) (1/N) log(W_N / W_0). This is the growth rate experienced along the actual path.
  2.  **Kelly Optimizes the Single-Path Growth Rate:** Maximizing E[log(1 + f*X)] is *exactly* equivalent to maximizing the *expected* time-average growth rate for the realized path. Crucially, *because the process is multiplicative and non-ergodic*, maximizing the ensemble-average growth (E[W_N]) does *not* maximize the typical time-average growth experienced. Betting it all maximizes E[W_N] but leads to ruin (g = -∞) on almost all paths. Kelly maximizes g along the realized path with probability 1.
  3.  **Utility-Independence for Growth Optimization:** The core argument is that **when wealth compounds multiplicatively, the rational target *is* the long-run growth rate of the single realized trajectory.** This target, they argue, is objective and independent of subjective utility functions. An agent who wants their wealth to grow as fast as possible *in their one life* should maximize g. Subjective utility might dictate *how much* wealth they ultimately desire or how they spend it, but the *optimal strategy for multiplicative growth* is given by Kelly. Dismissing logarithmic utility as arbitrary misses the point: log is the *mathematical key* that unlocks the optimization of the single-path growth rate under multiplicative dynamics; it's not chosen arbitrarily based on psychology.
  4.  **Answering Samuelson:** Defenders argue Samuelson's objection conflates the *optimal growth strategy* with *subjective valuation of outcomes*. They agree that if an agent has a strong preference for smoothing consumption or avoiding finite-horizon risk *despite* the long-term growth penalty, they might deviate from Kelly. However, they contend:
      *   Such deviations arise from *additional constraints or preferences* (like extreme risk aversion or short time horizons), not from a flaw in the growth-rate target itself.
      *   For the fundamental question of "how should I grow my wealth multiplicatively over time?", maximizing g via Kelly *is* the rational answer. Other strategies sacrifice growth for other goals.

  **Adjudication and Verdict**

  Both positions offer compelling insights, but the traditional view provides a more robust and universally applicable framework for rationality. **Kelly betting is the uniquely rational strategy *only* for an agent whose utility function is precisely logarithmic *or* whose *sole* objective is to maximize the long-run growth rate of their wealth trajectory under multiplicative dynamics, irrespective of other considerations like risk aversion over finite horizons or specific utility over terminal wealth levels.**

  1.  **The Burden of Proof on "Geometric Rationality":** While the ergodicity argument highlights a fascinating property of multiplicative processes, it fails to establish that maximizing the time-average growth rate (g) is *the* fundamental target of rationality, independent of utility. Rationality is inherently tied to an agent's goals and preferences. An agent who values capital preservation highly (highly concave utility) *is rational* to sacrifice some long-run growth potential to reduce the risk of significant short-to-medium-term losses, even in a multiplicative world. To claim they are irrational for not maximizing g imposes an external goal (maximum growth) that they may not share. The "single trajectory" argument doesn't nullify the fact that the agent must still evaluate the *distribution of possible outcomes* along that trajectory based on their preferences.
  2.  **Samuelson's Objection Stands:** The critique that "almost sure" dominance over infinite time provides limited guidance for finite decisions is devastating to the claim that Kelly is a universal rationality norm. Real agents care about finite horizons and the distribution of wealth at specific points (retirement, major purchase). An expected utility maximizer with non-log utility *correctly* perceives that deviating from Kelly can yield higher *expected utility* over their relevant horizon, even if it yields lower expected log growth. Dismissing this as merely incorporating "additional preferences" concedes the point: rationality depends on the full set of preferences, not just a growth objective.
  3.  **Kelly's Strength is Context-Specific:** Where the geometric rationality view shines is in identifying the scenario where Kelly *is* indeed the uniquely optimal strategy: **when the explicit, overriding goal is to maximize the long-run compounded growth rate of wealth.** This is a highly relevant goal for many investors (e.g., perpetual endowment funds, hedge funds benchmarked on long-term CAGR). In this specific context, characterized by:
      *   **Truly Long (Effectively Infinite) Horizon:** The focus is genuinely on asymptotic behavior.
      *   **Purely Multiplicative Dynamics:** Wealth compounds through reinvestment of returns.
      *   **The Sole Objective is Growth Rate Maximization:** No other constraints or utility considerations dominate.
      Kelly betting transitions from a heuristic to a *rational imperative*. It maximizes the desired objective.

  **The Verdict:** The Kelly criterion is not a universal rationality norm. It is the rational strategy **if and only if** an agent's utility function is logarithmic **or** if their explicit, singular objective is to maximize the long-run growth rate of their wealth trajectory under multiplicative dynamics, independent of other risk preferences over finite horizons or specific valuations of wealth levels. **What determines the answer in a given case is the agent's utility function over wealth and their time horizon.**

  *   **For an agent with U(W) = log(W):** Kelly is rational (it maximizes E[U(W)]).
  *   **For an agent focused *solely* on maximizing asymptotic growth rate g:** Kelly is rational (it uniquely maximizes g).
  *   **For an agent with a different utility function (e.g., CRRA with γ ≠ 1) or a finite horizon:** Kelly may be suboptimal. A fractional Kelly strategy or a strategy derived explicitly from maximizing E[U(W_N)] for their specific U(W) and N is rational. Sacrificing some asymptotic growth to better align with their risk tolerance and time horizon is perfectly rational.

  The geometric rationality view provides a powerful justification for Kelly *within its specific domain of optimal growth targeting under multiplication*. However, elevating it to a universal norm of rationality overreaches by neglecting the fundamental role of subjective preferences and finite horizons in defining rational action. Kelly is a profound and immensely valuable tool, but it is not the sole arbiter of rationality.
