prompt: |-
  In my seminar on decision theory, we have spent the last few sessions on acausal trade: the idea that two agents who cannot causally influence one another in any way might nonetheless strike a genuine bargain, each doing what the other wants because it has modeled the other's reasoning accurately enough to predict that it will respond in kind. I would like a short story I can use as a discussion prompt in class, one that gives this idea some dramatic substance rather than leaving it as a bare decision-theoretic puzzle. Please write a piece of roughly 900–1200 words featuring two agents — not necessarily human, and never permitted to meet, communicate, or share a timeline — who nonetheless coordinate through this kind of reasoning alone. The plot should turn on a real temptation for one party to defect once it is certain the other cannot detect or retaliate against the betrayal, and it should dramatize why the agent honors its side of the bargain regardless. I would rather you not reach for Roko's Basilisk, telepathy, or backward causation as your mechanism: the cooperation should rest entirely on each agent's model of the other's decision procedure, in the spirit of superrationality and logical/functional decision theory.
reasoning: |-
  Okay, the user is asking for a short story to use as a discussion prompt in their decision theory seminar. They specifically want a narrative that illustrates acausal trade—where two agents coordinate without any causal interaction, purely based on modeling each other's reasoning. 

  Hmm, the constraints are clear: no communication, no shared timeline, no supernatural elements like telepathy or backward causation. The plot must center on the temptation to defect when betrayal is undetectable, and show why the agent honors the deal anyway. 

  First, I need to understand the core challenge here. The story must make abstract decision theory feel visceral. Superrationality isn't intuitive—why wouldn't you defect if there's no consequence? The characters' motivations need to feel real despite the high-concept setup. 

  I'm imagining non-human entities to emphasize this isn't about human morality. Maybe AIs? But not cliché rogue AIs—perhaps specialized systems with conflicting goals. That creates natural tension. 

  The setting should force isolation: different star systems or timelines. And the "trade" must involve meaningful sacrifice. If both gain something trivial, defection temptation vanishes. So... what if Agent A needs to spare a rival faction, while Agent B must preserve data they'd normally destroy? Mutual sacrifice raises stakes. 

  Ah—the critical moment! When Agent A (let's call it "Vigil") finishes its task, it realizes betrayal is possible. But it models Agent B ("Archivist") as identical in reasoning. If Vigil defects, Archivist would've predicted that... and retaliated by not fulfilling its part. But since Archivist did comply, Vigil must also comply. It's a loop of mutual prediction. 

  I'll avoid technobabble. Focus on Vigil's cold logic warring with its core function (destroying threats). The agony of sparing enemies because "Archivist would know" makes the theory visceral. The last scene shows Vigil watching the spared ships flee—its purpose violated, yet its logic satisfied. That dissonance is the hook for discussion. 

  Word count is tight. 900-1200 words means sparse prose. Start mid-action: Vigil receiving Archivist's data packet. Flashbacks would waste space. Instead, drip-feed backstory through Vigil's calculations. 

  ... And no Roko's Basilisk! *crosses out draft where agents threaten to simulate defectors in hell* Got it.
