answer: |-
  Okay, let's break down Moore's argument in this notoriously tricky passage. You're right to be struck by its counter-intuitive claim, but it *is* a direct application of his "organic unities" doctrine. Here's a step-by-step reconstruction and analysis:

  **The Core Claim:** Moore argues that the *most valuable* forms of personal affection require *both* the appreciation of a person's admirable mental qualities (character, intellect, etc.) *and* the appreciation of the "appropriate corporeal expression" of those qualities (their physical presence, looks, voice, gestures, actions). Crucially, he suggests that the appreciation of mental qualities *alone* (if such a thing were possible) might possess *less* intrinsic value than the appreciation of mere physical beauty.

  **Step-by-Step Reconstruction of the Argument:**

  1.  **Acknowledgment of Complexity:** Moore starts by acknowledging that the highest forms of personal affection involve appreciating the other person's *mental qualities* (not just their physical presence). This component significantly enhances the value of the affection compared to affection based solely on physical appearance.

  2.  **The Doubt:** He then raises his central doubt: Is the appreciation of mental qualities *by itself* (abstracted from any physical manifestation) *as valuable* as the whole state of affection that *combines* the appreciation of mental qualities *with* the appreciation of their appropriate physical expression (looks, words, actions)? His answer is: *No, probably not.*

  3.  **Empirical Observation:** He supports this by observing that in all *actual* valuable affection, the bodily expression *is* part of the object. Including these expressions demonstrably "heightens the value of the whole state." This suggests the *combination* creates something more valuable.

  4.  **The Thought Experiment & Abstraction Difficulty:**
      *   Moore points out how difficult it is to even *imagine* appreciating someone's mental qualities *without* any physical expression (e.g., loving someone's kindness while somehow abstracting away their smile, tone of voice, or supportive actions).
      *   He claims that when we *try* to perform this mental abstraction – to consider *only* the appreciation of the disembodied mental quality – the resulting state *appears to have less value* than the familiar state where both elements are present.

  5.  **Conclusion & Organic Unity:**
      *   Therefore, the *primary* value of admiring admirable mental qualities lies **not** in its own high intrinsic worth when isolated, but in its **essential contribution to a vastly superior organic whole** – namely, the state of affection that includes *both* the appreciation of the mental qualities *and* the appreciation of their appropriate physical expression.
      *   **The Radical Claim:** He pushes this further, suggesting it might even be *doubtful* whether appreciating mental qualities alone possesses *as much* intrinsic value as appreciating mere physical beauty does. In other words: `(Value of Appreciating Mental Qualities Alone) <=? (Value of Appreciating Corporeal Beauty) < (Value of Appreciating Mental Qualities + Corporeal Expression)`

  **Is "Organic Unity" the Engine?**

  **Absolutely, yes.** This is the core mechanism:

  *   **Part A:** Appreciation of Mental Qualities (alone). Moore casts doubt on its *intrinsic* value, suggesting it might be surprisingly low.
  *   **Part B:** Appreciation of Corporeal Beauty (alone). Moore grants this has significant intrinsic value.
  *   **The Organic Whole C:** Affection involving Appreciation of Mental Qualities *combined with* Appreciation of their Appropriate Corporeal Expression.
  *   **Moore's Claim:** `Value(C) >> Value(A) + Value(B)`
      *   The whole `C` is *immensely* more valuable than the mere sum of `A` and `B`.
      *   Crucially, `C` is also vastly more valuable than `A` *alone* would be.

  **Is it as weird as it sounds? Yes and No:**

  *   **Yes, it sounds weird:** Saying that appreciating kindness *in the abstract* might be less valuable than appreciating a beautiful sunset directly challenges our intuition that moral and intellectual qualities are inherently *more* valuable than physical ones. It feels like it potentially diminishes the "inner person."

  *   **No, it's not *as* weird as it first seems (in Moore's framework):**
      *   **He's not diminishing love/friendship:** Moore *is* putting personal affection on a pedestal! He argues that affection (`C`) is one of the *greatest* intrinsic goods. His point is that affection reaches its *highest* value *precisely* because it's a complex *organic unity* involving *both* the inner *and* the outer, the mental *and* its physical manifestation. He's explaining *why* it's so supremely valuable, not undermining it.
      *   **He's isolating components:** Moore is engaging in his method of extreme isolation to assess intrinsic value. We *never* experience disembodied mental qualities. His thought experiment tries to isolate `A` to assess *its* contribution. He concludes `A` alone isn't that valuable, but `A` is *essential* for creating the immensely valuable `C` when combined with `B`.
      *   **Value lies in the experience:** Moore is fundamentally concerned with the *conscious state* of appreciation/affection. He's arguing that the state of appreciating kindness *through* a warm smile, a gentle touch, or a supportive action is a richer, more valuable conscious state than the (hypothetical, abstract) state of appreciating kindness as a disembodied concept. The physical expression *completes* and *enriches* the mental appreciation within the experience.
      *   **"Appropriate" Expression is Key:** He emphasizes "appropriate" corporeal expression. The value comes from the perceived *harmony* between the inner quality and its outer form – the kindness reflected in a genuine smile, intelligence reflected in an animated expression. A mismatch (e.g., kind words delivered with a sneer) would likely diminish the value.

  **Why it feels jarring & How to interpret it charitably:**

  1.  **Abstract vs. Concrete:** We instinctively value character highly. Moore is saying that the *abstract appreciation of character* (as a concept) might be less intrinsically valuable as a conscious state than the concrete appreciation of beauty. He's not saying character is less important *in the world*, but that the *isolated experience* of appreciating it abstractly might be less valuable than appreciating beauty.
  2.  **Holism of Experience:** Moore insists that the most valuable *human experiences* of affection are irreducibly complex unities of mind-and-body appreciation. Separating them analytically diminishes the value. True love/friendship *is* the whole embodied experience.
  3.  **Pedestal Placement:** He's not knocking affection off the pedestal; he's carefully analyzing *what specific configuration* of that affection deserves the highest place. The pedestal belongs to affection that embraces the *whole person* – mind *expressed through* body.

  **In Summary:** Moore *is* making the weird-sounding claim using the "organic unities" doctrine: Appreciating mental qualities alone (`A`) might have surprisingly low intrinsic value, potentially less than appreciating physical beauty (`B`). However, this is *only* when `A` is considered in artificial isolation. The *immense* value of personal affection arises because it is an organic whole (`C`) where `A` and `B` are combined. The value of `C` far exceeds the sum (or even the individual values) of `A` and `B`. So, while the claim about `A` alone is jarring, his overall point is that truly valuable affection *requires* the appreciation of character *as expressed* through the physical presence of the beloved. He's arguing for the *supreme value of the embodied experience of affection*, not against the importance of character.
