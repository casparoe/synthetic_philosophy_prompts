answer: |-
  You've hit on a profound and widely debated critique. Kripke's fixed-point construction *does* relocate the Liar problem rather than eliminate it, and the revenge paradox shows that it doesn't escape the fundamental limitations of formalizing truth. Here's a case for why Kripke's solution might not be a true advance over Tarski's hierarchy:

  ### 1. **The Revenge Problem Exposes the Relocation**
     - **The Unstatable Sentence**: As you note, "This sentence is not true at the fixed point" (or similar variants) cannot be expressed in Kripke's object language. This sentence *should* be paradoxical: if true, it’s not true at the fixed point; if false or undefined, it *is* true at the fixed point. But Kripke's framework lacks the resources to even *formulate* this sentence, pushing it into the metalanguage.
     - **Tarskian Relocation in Disguise**: By banning the problematic sentence from the object language, Kripke recreates Tarski's hierarchy. Tarski solved the Liar by forbidding truth predicates within the same language; Kripke forbids *fixed-point* truth predicates. Both "solve" the paradox by restricting expressive power.

  ### 2. **The Fixed Point Doesn't Capture "Real" Truth**
     - **Truth Relativized to a Construction**: Kripke's "truth" is defined *relative to a fixed point*, not as an absolute property. But natural language truth predicates ("is true") don't come with a subscript ("is true at fixed point F"). The revenge sentence exploits this gap: it targets the *fixed point itself*, exposing that Kripkean "truth" isn’t the robust concept we use informally.
     - **Metalanguage Required for Evaluation**: To *assess* whether a Kripkean sentence is "really true" (e.g., "Is 'The Liar is undefined' itself true?"), you need a metalanguage. This mirrors Tarski’s requirement for a hierarchy—undermining Kripke's goal of a language containing its own truth predicate.

  ### 3. **Kripke's Trade-off: Solving the Liar at the Cost of New Problems**
     - **Gain**: Kripke handles *ordinary* self-referential sentences Tarski couldn't (e.g., "This sentence is true" is ungrounded but non-paradoxical). This is progress for modeling natural language.
     - **Cost**: He introduces a new paradox (revenge) that’s equally devastating. The Liar is "solved" only because the language is artificially weakened. As philosopher Hartry Field put it: Kripke avoids inconsistency by making the language *expressively incomplete*.

  ### 4. **The Computational Analogue Reveals the Limitation**
     - Your coding intuition is apt: computing a fixed point (e.g., for recursive functions) works when the domain is well-defined. But truth isn’t a finite domain—it’s *indefinitely extensible*. New sentences can always be crafted to target the current fixed point ("revenge"), just like a halting oracle can always be targeted by a higher-order halting problem. This suggests the paradox isn’t resolved—it’s inherent to the concept of truth.

  ### 5. **Kripke vs. Tarski: Lateral Move, Not Vertical**
     - **Tarski’s Hierarchy**: Bans self-reference entirely. Truth for language L requires a metalanguage L+1.
     - **Kripke’s Fixed Point**: Allows self-reference but bans *critique of the fixed point*. Evaluating the fixed point requires a metalanguage.
     - **Result**: Both relocate the paradox upward. Kripke’s language is richer (it contains a truth predicate), but it’s still not *sufficiently* rich—and the metalanguage problem remains.

  ### Conclusion: A Tool, Not a Solution
  Kripke's model is a **powerful formal tool** for handling many self-referential statements cleanly, and its computational elegance (via fixed points) is genuinely insightful. But philosophically, it doesn't "solve" the Liar; it reformulates the problem around a new axis. The revenge paradox proves that any consistent, expressively limited truth predicate will have "blind spots" only visible from a metalanguage. In this sense, Kripke doesn’t advance beyond Tarski—he constructs a *different* hierarchy where levels are defined by fixed points rather than indexed languages. The core insight of Tarski—that truth for a language cannot be fully captured *within* that language—remains intact.

  **Why it still matters**: Kripke’s framework is invaluable for logic, semantics, and computer science (e.g., in modeling recursion or database queries). But as you suspected, it treats the symptom (the classic Liar) while the disease (truth’s indefinability) persists. The rabbit hole goes deeper—Field, Priest, and others tackle revenge with even more complex tools (e.g., paraconsistent logics), but no approach fully escapes the meta-language regress.
