answer: |-
  Here are 9 interview questions designed to systematically challenge the "supplementary principle" defense of Scanlonian expectation-based promissory obligation, with targeted follow-ups. Each question focuses on a key pressure point, building on your specifications:

  1.  **The Compensation Challenge:**
      *   **Q1:** Professor, consider this case: I promise to help you move on Saturday. At the last minute, I cancel, but I hire and fully pay for professional movers who are more efficient than I am, cover all delay costs, and ensure you end up demonstrably better off than if I had come. On the pure expectation-reliance view, where the wrong is defeated expectation/reliance causing harm, haven't I neutralized the harm? Yet, many intuit I *still* wronged you. If Fidelity (Principle F) *alone* doesn't capture this wrong, what *specific* supplementary principle explains it, and why is that principle *not* doing the primary work here?
      *   **Likely Answer:** "This violates a supplementary principle concerning *intentionality* or *personal commitment* – the promise created an expectation of *my* personal performance, not just *a* performance."
      *   **Follow-Up F1:** Doesn't introducing "intentionality" or "personal commitment" as a core element *fundamentally shift* the ground of the wrong from defeating expectations/reliance *as such* to something closer to violating a special relationship obligation or a convention-bound commitment? If the wrong persists *despite* perfect compensation for reliance harms, doesn't that suggest the core wrong lies elsewhere?

  2.  **The Social Practice Circularity (Kolodny/Wallace):**
      *   **Q2:** You argue Principle F explains promissory obligation without presupposing a social practice. But Principle F relies on the notion of "reasonable expectations." How do we determine *which* expectations it's reasonable for the promisee to form and rely upon in the absence of *any* background understanding about the normative significance of the act of promising itself? Doesn't the "reasonableness" of relying on *this* utterance crucially depend on a shared social context where such utterances *are* conventionally understood to create obligations?
      *   **Likely Answer:** "Reasonableness is determined by what the promisor intentionally communicated and the promisee's context. If I say 'I promise X,' I communicate an intention to undertake an obligation, and it's reasonable to rely on that *communication*."
      *   **Follow-Up F2:** But how does the promisee *recognize* that the utterance "I promise" communicates an intention to undertake an obligation, unless they already inhabit a social context where that linguistic act *conventionally carries that meaning*? Doesn't the very *recognition* of the act *as* a promise-making act, triggering reasonable expectations, presuppose the convention it's meant to explain?

  3.  **The Standing Problem:**
      *   **Q3:** Principle F grounds the wrong in leading someone to form and rely on an expectation. Suppose I promise Alice to help her move. Bob, a mutual friend who overhears, also forms the expectation I'll help Alice and relies on it (e.g., plans to borrow Alice's truck that day, thinking I'll unload it quickly). I break my promise to Alice without justification. Principle F suggests Bob, who formed and relied on the expectation based on my utterance, is also wronged. Yet, intuitively, only Alice has standing to complain or release me. Why, on your view, is Alice *specifically* wronged *as promisee*, while Bob, who formed the *same* expectation based on the *same* utterance, is not?
      *   **Likely Answer:** "The expectation Principle F protects is the one *intentionally invited* in the *intended audience* – the promisee. Bob was not the intended recipient; his reliance might be reasonable or not, but it falls outside the scope of the obligation generated by the promise *to Alice*."
      *   **Follow-Up F3:** Doesn't invoking "intended audience" and "intended recipient" introduce a *relational* or *directed* element that Principle F itself lacks? Principle F focuses on the *act* of inducing reliance. What, *within Principle F alone*, explains why inducing reliance in Alice creates a directed duty *to her*, but inducing identical reliance in Bob through the same act does not create a directed duty *to him*? Doesn't this relational "to whom" aspect point towards a distinct structure of obligation?

  4.  **The Ad Hoc Patching Problem:**
      *   **Q4:** Cases like the compensated mover, the unintended overhearer (Bob), or promises extracted under duress seem to require distinct supplementary principles (intentionality, intended audience, voluntariness). As these counterexamples multiply, how do we distinguish a robust core theory (Fidelity + necessary supplements) from an *ad hoc* collection of patches where Fidelity itself does little work, and the supplementary principles are doing the heavy lifting to capture what we intuitively recognize as promising?
      *   **Likely Answer:** "The core work is done by Principle F: it identifies the *primary* wrong of defeating deliberately induced reliance. Supplementary principles address specific *conditions* under which that reliance is induced or defeated, or *aspects* of the expectation generated. They refine, not replace, the core."
      *   **Follow-Up F4:** But in cases like the compensated mover, Principle F seems to say *no wrong occurred* (reliance harm neutralized), and the supplementary principle (e.g., concerning personal performance) is invoked to explain the *actual* wrong we perceive. Doesn't this suggest that in *this* core case of promissory wronging, Principle F *isn't* identifying the primary wrong at all, and the supplementary principle is carrying the explanatory load?

  5.  **The Content of Expectation:**
      *   **Q5:** Principle F protects against defeating the expectation one intentionally led another to form. In a promise, what *is* the specific content of the expectation protected? Is it solely the expectation that the promised act *will occur*? Or is it also the expectation that the *promisor themselves* will *perform* it? Or the expectation that the promisor *owes it* to the promisee? How is this determined without reference to the social practice?
      *   **Likely Answer:** "The content depends on the communication. A promise typically communicates an assurance that *I* will *do X* for *you*, creating an expectation of my performance owed to you."
      *   **Follow-Up F5:** But how does the promisee interpret "I promise to help you move" as generating an expectation of *my personal performance owed specifically to them*, rather than just an expectation that *moving help will occur*? Isn't this interpretation precisely what a social convention *teaches* us? If I say "I guarantee it will happen," does that create the same expectation of *personal* obligation? Why/why not?

  6.  **Release vs. Fulfillment:**
      *   **Q6:** On your view, why does the *promisee specifically* have the power to *release* me from the obligation generated by Principle F? If the wrong is defeating reliance/harm, why can't *anyone* who compensated the promisee for the harm release me? Or why isn't fulfilling the promise the *only* way to avoid the wrong? What does the power of release tell us about the nature of the obligation?
      *   **Likely Answer:** "Because the promisee is the one to whom the assurance was made and whose expectations were deliberately shaped. They have the authority to waive the claim arising from that specific act directed at them."
      *   **Follow-Up F6:** Doesn't this "authority to waive" imply a *right* or *claim* held by the promisee *against* the promisor, stemming directly from the promise act itself? Doesn't this directed right/claim structure sound more like a conventional promissory obligation than an obligation generated solely by the consequences of defeated expectations?

  7.  **The "Without Justification" Clause:**
      *   **Q7:** Principle F condemns defeating expectations "without justification." How is "justification" determined? Does it depend on the *promisee's* reasonable view of what counts as a good reason, or an objective standard? If objective, how is *that* standard established without reference to social norms about acceptable reasons for breaking promises?
      *   **Likely Answer:** "Justification is determined by whether the promisor has a reason that the promisee could not reasonably reject, given the context and the importance of the expectation."
      *   **Follow-Up F7:** Doesn't assessing "what the promisee could not reasonably reject" again rely on shared understandings? For example, is "a better offer came along" a rejectable reason? Is "I simply changed my mind"? Our intuitions here seem deeply shaped by the existing social practice of promising that the theory aims to explain foundationally.

  8.  **The Role of the Act of Promising:**
      *   **Q8:** If the core wrong is defeating deliberately induced reliance, why is the *act of promising* necessary at all? Couldn't I wrong you in exactly the same way by deliberately creating a firm expectation (e.g., repeatedly assuring you "I *will* be there, count on it!") without using the word "promise"? If so, what distinct work does the *promise* do? If not, why not?
      *   **Likely Answer:** "The act of promising is a particularly clear, deliberate, and usually socially recognized *way* of inducing that firm expectation and reliance. It signals a heightened level of commitment."
      *   **Follow-Up F8:** Doesn't describing it as a "socially recognized way" and "signaling heightened commitment" again tacitly rely on the social convention? If the *only* difference between a promise and a very firm assurance is the *conventional signal*, doesn't the *distinctive normative force* of a promise stem from the convention rather than the expectation-inducement *per se*?

  9.  **The Cumulative Weight:**
      *   **Q9:** Given the need for supplementary principles to handle compensation, standing, release, justification, and the specific content/force of promissory expectations – principles that seem to invoke elements like intentionality, directedness, and conventional signals – doesn't the cumulative effect suggest that Principle F is *not* the core generator of promissory obligation, but rather describes a *frequent consequence* or *aspect* of a more fundamental practice-based or commitment-based obligation? At what point does the need for supplements undermine Fidelity's claim to be the foundational principle?
      *   *(This question synthesizes the challenges without an easy "supplementary principle" rebuttal, forcing reflection on the overall structure).*
      *   **Likely Answer:** "The core insight of Fidelity remains crucial: promissory wrongs centrally involve the manipulation of another's agency through induced reliance. The supplements address nuances but don't negate this core moral structure."
      *   **Follow-Up F9:** But if the core wrong in paradigmatic cases like breaking a simple promise for no reason *is* captured by Fidelity, while the wrong in equally intuitive cases like the compensated mover *isn't* captured by Fidelity but *requires* a different principle (e.g., concerning personal commitment), doesn't this indicate that Fidelity fails to capture the *essential* or *defining* wrong of promise-breaking? Isn't the compensated mover case revealing that the core wrong is something *other* than defeated reliance?

  **Key Strategies Embedded:**

  *   **Pressing Compensation (Q1/F1):** Highlights the insufficiency of reliance harm and forces the introduction of other elements (intentionality, personal commitment), questioning their source and primacy.
  *   **Exposing Circularity (Q2/F2, Q5/F5, Q7/F7):** Repeatedly challenges the independence of "reasonable expectation" from social practice.
  *   **Targeting Standing & Directedness (Q3/F3, Q6/F6):** Undermines the idea that Principle F alone explains the specific promisor-promisee relationship and the promisee's unique powers.
  *   **Accumulating Ad Hoc Patches (Q4/F4, Q9/F9):** Questions the coherence and primacy of Principle F as the supplementary principles multiply to handle intuitive counterexamples.
  *   **Testing Boundaries (Q8/F8):** Probes whether promising is truly distinct from other reliance-inducing acts without convention.

  These questions aim to create a sustained, multi-pronged challenge that makes the "just a supplementary principle" response seem increasingly inadequate and points towards the potential need for a more fundamental reconceptualization of promissory obligation. Good luck!
