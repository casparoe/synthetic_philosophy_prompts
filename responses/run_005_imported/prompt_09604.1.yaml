  A random but time-sensitive request: I'm a math major finishing up an elective on axiomatic set theory, and I just found out that the professor who teaches it, who's been in the department for something like 30 years, is retiring at the end of this term. A bunch of current and former students got asked to say a few words at the little retirement dinner the department's throwing her next Friday, and somehow I got voted into going first. She's genuinely the most cheerfully unrepentant classical mathematician I've ever had - I don't think a single lecture of hers has gone by without Zorn's lemma showing up to conjure some maximal object out of nowhere, and whenever anyone brings up constructivism she just grins and says existence doesn't owe anybody a construction. Theres an old joke going round the department, I think it traces back to a mathematician named Jerry Bona, that the axiom of choice is obviously true, the well-ordering theorem is obviously false, and nobody can say about Zorn's lemma - even though its provably the case that all three are exactly equivalent to each other.

  I'd love it if you could actually write that toast for me - something built around that joke, short enough to stand up and read out loud in about 3 minutes. The annoying constraint is that the room's gonna be half logicians and set theorists who will catch literally every nuance, and half non-math family and old students who just want to hear something warm and true about a teacher they clearly love, so it can't lean on the math so hard that half the room checks out, but it also can't hand-wave the actual idea away just to be safe. What I really want is for the speech to use that weird gap between "provably equivalent" and "obviously true/obviously false" as the actual emotional center of the toast, not just as a setup for the punchline - like there's something real in there about belief, or trust, or knowing something's there before you can show it - and for it to land as affection for her specifically, not as a logic lecture that happens to have her name attached.
