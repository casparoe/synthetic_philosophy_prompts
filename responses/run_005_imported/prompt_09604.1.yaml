answer: |-
  Here’s a toast that threads the needle—honoring the math while keeping it warm, personal, and accessible, all in under 3 minutes. The emotional core rests on that tension between equivalence and intuition, tying it directly to your professor’s spirit:

  ---

  **(Raise glass, smile at the professor)**  

  "Professor, there’s an old joke in our circles—credited to Jerry Bona—that goes like this:  
  *The Axiom of Choice is obviously true.  
  The Well-Ordering Theorem is obviously false.  
  And nobody knows what to think about Zorn’s Lemma.*  

  **Pause for laughter from the math folks; gentle, knowing smile for others.**  

  "The punchline, of course, is that these three are *logically equivalent*—proven to be different faces of the same truth. And yet… they *feel* wildly different. One seems natural, one seems absurd, and one sits in this hazy middle ground where we’re not quite sure what to believe.  

  **Shift tone to warm, personal reflection:**  

  "Professor, if anyone embodies the spirit of that middle ground—of Zorn’s Lemma—it’s you. For 30 years, you’ve stood in front of students conjuring maximal objects out of thin air with a wave of your hand and that signature grin. Whenever someone asked *‘But how do we build it?’* you’d just laugh and say: *‘Existence doesn’t owe anybody a construction!’*  

  **Eye contact with her; affectionate chuckle.**  

  "At first, that feels like magic. Maybe even a little reckless. But what you taught us—what you lived—is that mathematics isn’t just about *seeing* the path. It’s about trusting that the landscape *has* a shape, even when the path isn’t visible. It’s about knowing something *must* be there before you know *how* to find it.  

  **Soften for non-math guests:**  

  "For the non-logicians here: imagine knowing a solution exists to a puzzle before you’ve solved it. That certainty—that faith in structure—is what she gave us. And she did it with such joy, such unshakable cheer, that even when she invoked Zorn’s Lemma for the tenth time in one lecture **(pause for laughter)**, we couldn’t help but believe.  

  **Bridge to emotional core:**  

  "That’s the quiet truth in Bona’s joke. Logically equivalent? Absolutely. But intuition isn’t logic. Belief isn’t a proof. And trusting in existence—*especially* when it feels hazy or uncertain—isn’t just mathematics. It’s a kind of courage. A kind of optimism.  

  **Directly to her, warmth building:**  

  "Professor, you never just taught us set theory. You showed us how to stand confidently in that gap—between ‘obviously true’ and ‘obviously false’—and find wonder there. You taught us that sometimes, believing in the existence of something *is* the foundation for everything that follows.  

  **Raise glass higher:**  

  "So here’s to you—our cheerfully unrepentant conjurer of maximal objects. Thank you for 30 years of showing us that existence doesn’t owe us a construction… but that a great teacher *gives* us something even better: the courage to trust the structure of things unseen.  

  **Final line, simple and resonant:**  

  "To the professor—and to the Zorn’s Lemma in all of us. May we always believe in what persists."  

  **Clink!**  

  ---

  ### Why this works:
  - **Balances depth & warmth:** Math is framed through human intuition ("feels wildy different," "trusting the landscape"). The Bona joke anchors it without requiring expertise.  
  - **Makes equivalence emotional:** The gap isn’t just logical—it becomes about "courage," "optimism," and "trust," tying directly to her teaching philosophy.  
  - **Her voice shines:** Quotes her signature line ("existence doesn’t owe..."), references her grin and Zorn-heavy lectures—personalizing the logic.  
  - **Universal resonance:** Non-math guests hear "belief," "wonder," and "courage"; logicians nod at the meta-commentary about equivalence vs. intuition.  
  - **Under 3 minutes:** Crisp pacing, no tangents. Ends on a toast that’s both specific to her and universally uplifting.  

  This toast makes the math *mean* something about her—not just a joke, but a lens for her legacy. It’s the perfect tribute to a classical mathematician who loved the unseen with contagious joy. Break a leg!
