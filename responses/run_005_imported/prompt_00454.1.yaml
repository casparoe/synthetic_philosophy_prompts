prompt: |-
  I'm in the process of dissolving a business partnership, and our mediator has proposed using the Kalai–Smorodinsky bargaining solution to divide the remaining assets, since she says it guarantees that each of us ends up with an equal share of the total value once we've both stated our ideal outcomes. Before our next session, I'd like to understand why this method would be considered more principled than simply splitting everything down the middle from the outset.
