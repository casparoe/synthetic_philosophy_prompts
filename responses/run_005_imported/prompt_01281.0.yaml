answer: |-
  Your experience perfectly illustrates the tension between democratic ideals and real-world voting behavior. You've identified a core vulnerability not unique to ranked-choice voting (RCV), but inherent in *any* non-dictatorial voting system. Here's a breakdown of what happened, why it's theoretically unavoidable, and practical considerations for your association:

  1.  **What Happened: Tactical Voting ("Burying") in RCV:**
      *   The group engaged in **strategic nomination ranking**, specifically "burying" a strong opponent. By ranking the polarizing candidate *below* a non-viable candidate, they exploited RCV's elimination mechanics.
      *   Their goal was to ensure the strong opponent was eliminated *before* the polarizing candidate, preventing a head-to-head matchup where she might have won. This worked because RCV eliminates the candidate with the *fewest first-choice* votes in each round. Ranking the opponent last (below a non-viable candidate) deprived her of potential transfers *if* the non-viable candidate was eliminated first, making *her* elimination more likely early on.
      *   **This is a known vulnerability of RCV/Instant Runoff Voting (IRV).** While RCV solves the "spoiler effect" (like your first election), it is not immune to strategic voting by coalitions aiming to manipulate the elimination order.

  2.  **The Deeper Problem: Gibbard-Satterthwaite Theorem**
      *   While Arrow's Theorem (about aggregating preferences consistently) is famous, the theorem directly relevant to your situation is the **Gibbard-Satterthwaite Theorem (1973/1975)**.
      *   **What it says:** For any voting system that:
          *   Has at least 3 possible outcomes (candidates),
          *   Is non-dictatorial (no single voter always decides),
          *   Allows voters to have any rational preference ordering,
          *   And where every candidate has a chance to win under some set of sincere preferences...
          **...the system is vulnerable to strategic voting.** That is, there will *always* be situations where some voter(s) can get a better outcome by misrepresenting their true preferences (voting insincerely) than by voting sincerely.
      *   **Your situation is a textbook example:** A coordinated group (the "coalition") recognized that by insincerely ranking the strong opponent last, they could get a better outcome (their preferred candidate winning) than if they voted sincerely (which might have led to the opponent winning in the final round).

  3.  **Is This Specific to RCV?**
      *   **No.** Gibbard-Satterthwaite proves this vulnerability is *universal* for any reasonable system with 3+ candidates. Different systems just have *different types* of strategic vulnerabilities:
          *   **Plurality:** Vote splitting, leading to "lesser evil" strategic voting.
          *   **Borda Count:** Highly vulnerable to "burying" (ranking strong opponents last) and "compromising" (over-ranking a less-preferred but more viable candidate).
          *   **Approval Voting:** Vulnerable to "bullet voting" (approving only your absolute favorite, even if you like others) or over/under-approving based on perceived viability.
          *   **Condorcet Methods:** Can be vulnerable to strategic nomination, adding clones, or specific types of insincere ranking depending on the variant.
          *   **RCV (IRV):** Vulnerable to the "burying" strategy you witnessed and also "compromising" (not ranking your true favorite first if they seem weak).
      *   **RCV's specific vulnerability:** Its sequential elimination can be gamed by coordinated groups to manipulate *which* strong candidate gets eliminated first.

  4.  **Practical Considerations for Choosing a System:**
      Given no perfect system exists, the goal is to choose one *less susceptible* to the types of manipulation *most likely in your specific context* and that produces outcomes perceived as broadly acceptable. Consider:

      *   **Community Size & Cohesion:** Your building (~dozen strategic voters influencing the outcome) is small enough for coordination. Larger groups find coordination harder. How polarized is the building generally?
      *   **Number of Candidates:** Systems like RCV and Condorcet shine with many candidates. If you typically have 2-3 serious candidates, simpler systems might suffice.
      *   **Transparency & Simplicity:** Can residents understand the system? Can *you* count the ballots easily and transparently? Complexity breeds distrust.
      *   **Types of Outcomes Desired:**
          *   **Preference for Strong Centrists?** Approval or Borda might favor broadly acceptable candidates over polarizing ones.
          *   **Preference for Strong Mandates?** RCV aims to find a candidate acceptable to a majority by the final round. Condorcet methods pick the candidate beating all others head-to-head.
          *   **Minimizing "Spoilers"?** RCV and Condorcet handle this well. Plurality does not.

  5.  **Evaluating Options for Next Year:**

      *   **Ranked-Choice Voting (IRV):**
          *   *Pros:* Solves vote-splitting, ensures majority support in final round (if not always initially), good with >2 candidates.
          *   *Cons:* Vulnerable to the "burying" you experienced. Counting can be complex manually. Favors candidates with strong core support over broad, mild support.
          *   *Mitigate Manipulation:* Hard in small groups. Education about sincere voting *might* help. Making ballots anonymous but results public (showing full elimination rounds) adds transparency but doesn't prevent coordination.

      *   **Approval Voting:**
          *   *Pros:* Extremely simple to vote ("approve" any number) and count (sum approvals). Encourages voters to support *all* candidates they find acceptable. Very resistant to vote-splitting. Favors broadly acceptable, centrist candidates. Harder for small groups to manipulate *effectively* without risking helping a disliked candidate.
          *   *Cons:* Doesn't capture *strength* of preference. Voters face strategic dilemma: "bullet vote" for favorite vs. approve multiple acceptable candidates ("hedging"). A polarizing candidate with a fervent minority *could* win if the majority splits approval among alternatives. Results can feel less "legitimate" to those used to ranking.
          *   *Mitigate Manipulation:* Simplicity makes sophisticated "burying" impossible. The main strategy ("bullet voting" vs "hedging") is individual, not easily coordinated like RCV ranking orders. Generally considered *more strategy-resistant* than RCV in practice, especially for single-winner elections.

      *   **Borda Count:**
          *   *Pros:* Captures some preference strength. Simple weighted count.
          *   *Cons:* **Highly vulnerable to strategic voting**, especially "burying" (ranking threats last) and "compromising" (ranking a strong centrist higher than true favorite). Outcomes can be easily manipulated by small, coordinated groups precisely *because* every ranking position matters. Favors bland, inoffensive candidates over those with strong support. Generally **not recommended** for important elections due to manipulability.
          *   *Mitigate Manipulation:* Very difficult. Coordination is powerful.

      *   **Condorcet Methods (e.g., Ranked Pairs, Schulze):**
          *   *Pros:* Picks the candidate who beats all others in head-to-head matchups (the "Condorcet Winner"), which feels very fair *if* one exists. Handles vote-splitting well. Resistant to some types of strategy.
          *   *Cons:* Complex to explain and *very* complex to count manually. Ties or cycles ("Condorcet Paradox") can occur, needing tie-breakers. While resistant to some burial strategies, can be vulnerable to others (like adding clones) or strategic nomination. Transparency can be challenging.
          *   *Mitigate Manipulation:* Complexity makes coordination harder. Finding the optimal strategic vote is difficult. Generally robust, but complexity is a major hurdle for a small association.

      *   **Two-Round Runoff (if feasible):**
          *   *Pros:* Simple concept, ensures final winner has majority support. Head-to-head final round is decisive.
          *   *Cons:* Requires voters to turn out twice (a significant hurdle). Can still encourage strategic voting in the first round (e.g., voting for a weaker candidate to ensure your strong opponent *doesn't* make the runoff). Favors candidates with strong core first-round support.

  6.  **Recommendations & Mitigation Strategies:**

      *   **For Your Context (Small Group, Recent Drama, Desire for Stability): Approval Voting is likely the best practical choice.**
          *   *Why:* Its simplicity (vote, count, explain) is a major asset. It directly counters the *type* of coordinated ranking manipulation you suffered under RCV. It encourages finding consensus candidates and reduces antagonistic "us vs them" ranking games. The strategic choices ("bullet" vs "hedge") are individual and less damaging to neighborly relations than coordinated burial. It's significantly harder for a small bloc to swing maliciously.
      *   **If Sticking with RCV:**
          *   **Educate Voters:** Emphasize voting sincerely ("Rank candidates in the order you *actually* prefer them"). Explain *why* burial strategies can backfire or lead to worse outcomes.
          *   **Maximize Transparency:** Publish the full elimination round details (anonymized ballots, but show the counts and transfers step-by-step). This builds trust in the process even if the result is disliked.
          *   **Acknowledge the Limitation:** Be upfront that no system is perfect, but RCV solves the initial vote-splitting problem.
      *   **General Mitigation (Regardless of System):**
          *   **Promote Sincerity:** Encourage voters to express their true preferences.
          *   **Transparency:** Make the rules and counting process as clear as possible.
          *   **Anonymity:** Ensure secret ballots to reduce peer pressure within the strategic bloc.
          *   **Manage Expectations:** Communicate that *all* voting systems have trade-offs and potential strategic vulnerabilities. The goal is a *reasonably* fair and accepted outcome, not perfection.
          *   **Focus on Governance, Not Just Elections:** Encourage the chair and board to act inclusively and address concerns, healing rifts caused by the election.

  **Conclusion:**

  What you witnessed wasn't just a flaw in RCV; it was a manifestation of the Gibbard-Satterthwaite Impossibility Theorem – strategic voting is an inescapable reality in any non-trivial democratic voting system. RCV's specific vulnerability to coordinated "burying" was exploited. While no system is immune, **Approval Voting offers a compelling alternative for your residents' association.** It directly addresses the type of manipulation you experienced, is simple to implement and understand, promotes consensus-seeking, and is generally more robust against small-group coordination than RCV, Borda, or even Condorcet methods in practice. When proposing the change, focus on its simplicity, its ability to find broadly acceptable candidates, and its resistance to the kind of destructive ranking strategies that caused friction this year. Acknowledge that no system is perfect, but emphasize choosing one less prone to the specific problems your community has faced. Good luck – managing volunteer elections is often a thankless task!
