answer: |-
  That's an excellent connection you've made—Leibniz's distinction between *unum per se* (true unity) and *unum per aggregationem* (aggregate unity) is indeed a precursor to modern debates about composition, particularly van Inwagen's Special Composition Question (SCQ). Let's break down Leibniz's commitments and their implications:

  ### Leibniz's Core Principles
  1. **Only Monads are True Unities (*unum per se*)**  
     Monads are simple, immaterial, soul-like substances with no parts. They are the only genuine substances because they possess intrinsic unity and activity (perception/appetition).  
  2. **Extended Bodies are Mere Aggregates (*unum per aggregationem*)**  
     Anything extended (e.g., a rock, a machine, or a rainbow) lacks true unity. Its apparent cohesion is imposed by perception, not inherent in reality. As Leibniz wrote: *"A pile of stones is not a true unity"* (cf. *Letters to Arnauld*).  
  3. **Organisms as Privileged Aggregates**  
     While organisms (e.g., animals) are still aggregates, they possess a *dominant monad* (e.g., a soul) that organizes their parts into a teleological whole. This makes them *well-founded phenomena* (phenomena bene fundata), distinct from arbitrary aggregates like a heap of sand.  

  ### Mapping to van Inwagen's SCQ Answers
  - **Nihilism** (Composition never occurs):  
    Leibniz **rejects nihilism**. He grants that aggregates *exist* as phenomena, even if derivative. For Leibniz, "composition" happens constantly in the phenomenal realm—but the composed entities aren't genuine substances.  
  - **Universalism** (Composition always occurs):  
    He **explicitly rejects universalism**. Arbitrary collections (e.g., "the aggregate of my left foot and the moon") have no objective unity. His rainbow analogy illustrates this: a rainbow's unity is mind-dependent and dissolves under analysis.  
  - **Organicism** (Composition only when there's life):  
    Leibniz **aligns closely with organicism**—but with a caveat. Only when a dominant monad unifies an aggregate (i.e., in living organisms) do we have a *well-founded* composite. Non-living aggregates lack this principle of unity.  

  ### Leibniz's Implicit Position: Qualified Organicism  
  Leibniz is committed to a **monadic version of organicism**:  
  - **Composition occurs** when (and only when) a dominant monad confers functional unity on an aggregate, making it a *corporeal substance* (e.g., an animal).  
  - **Non-living composites** (rocks, ships, rainbows) are *unum per aggregationem*—their unity is purely ideal, imposed by perceiving minds.  

  ### Consistency Challenges  
  1. **The Status of Corporeal Substances**:  
     Leibniz wavers on whether organisms are *true substances* or just *well-founded aggregates*. In later works (e.g., *Monadology*), he suggests even organisms are aggregates of monads, with unity borrowed from the dominant monad. This risks collapsing into nihilism about composite *substances*.  
  2. **The Reality of Aggregates**:  
     If aggregates depend entirely on perception, how do they interact causally? Leibniz resolves this via pre-established harmony: monads perceive aggregates harmoniously, but aggregates lack causal powers. This preserves consistency but deepens idealism.  
  3. **Boundary Problems**:  
     When does an aggregate become "unified enough" to count as well-founded? Leibniz relies on the dominant monad's teleology, but this is vague (e.g., is a virus or a dying organism still unified?).  

  ### Could Leibniz Hold This Consistently?  
  **Yes, within his system**, but it requires accepting:  
  - A **two-tiered ontology**: Fundamental reality (monads) vs. phenomenal reality (aggregates).  
  - **Idealism**: What we call "bodies" are perceptual constructs grounded in monadic activity.  
  - **No Middle Ground**: Between true unity (monads) and mind-dependent unity (aggregates), there is no room for composite material substances.  

  ### Conclusion  
  Leibniz's principles commit him to a **form of organicism**: composition occurs only when a dominant monad (a "soul") animates an aggregate, as in living organisms. Non-living composites are mere aggregates with no objective unity. This position is consistent *if* one accepts his idealist metaphysics—where bodies are well-founded phenomena, not substances. His rainbow analogy perfectly captures this: the rainbow's unity is real to perception but dissolves under metaphysical scrutiny, much like all composite bodies.  

  This view bridges his metaphysics with modern SCQ debates, positioning Leibniz closer to van Inwagen than to nihilists or universalists—but always filtered through the lens of monadic idealism.
