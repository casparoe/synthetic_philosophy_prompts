  I'm working on a novel with a scene at a wake for an old logic professor, and one of his former students has to tell a joke that's dark and a little inappropriate but still actually lands. Can you write me a joke about Godel's real argument for an afterlife -- the "if the world is rational then there must be a Wiedersehen" thing from his letters to his mom -- not just another incompleteness theorem pun, ive read a million of those already. Bonus if it winks at the irony of how he acutally died, but it has to work as a real joke with a setup and a punchline, not just a fact dressed up as a bit. It should make sense to someone who actually knows the backstory, not just sound clever to people who don't.
