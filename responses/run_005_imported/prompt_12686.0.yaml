answer: |-
  ## The Wager Wars: Kelly Crusader vs. Utility Universalist

  **Setting:** A quiet corner of a university library, surrounded by towering stacks of economics journals. Coffee cups steam between two intense scholars.

  **Characters:**
  *   **Kelly (K):** Sharp, intense, speaks with the fervor of geometric certainty. Believes maximizing long-run growth is the *only* rational path for repeated gambles.
  *   **Sam (S):** Calm, methodical, steeped in the axiomatic tradition. Views Kelly as a special case masquerading as universal truth.

  **(The dialogue begins mid-argument, papers scattered...)**

  **K:** ...and that's precisely the point, Sam! If you have *any* positive edge in a repeated, independent gamble, betting anything other than the fraction \( f^* = \frac{bp - q}{b} \) is *irrational*. It's mathematically guaranteed to be suboptimal in the long run. You're leaving geometric growth on the table!

  **S:** *(Sighs, pinching the bridge of his nose)* Guaranteed? Optimal? By whose definition, Kelly? You're smuggling in a very specific, and I argue *arbitrary*, definition of optimality – maximizing the expected *logarithm* of wealth. You call it "objective math," but it's just expected utility maximization where the utility function happens to be \( u(W) = \log(W) \). Samuelson saw through this decades ago! It's log utility dressed in a lab coat.

  **K:** Arbitrary? It's the *only* definition that makes sense for multiplicative growth over time! Look at the ensemble average versus the time average – that's where your beloved linear expected utility fails catastrophically. You calculate the expected wealth \( E[W_N] \) after N trials using \( f \). For a simple coin flip (p win, q lose, b:1 odds, f bet fraction), it's \( W_0 (1 + bf)^Np (1 - f)^Nq \). Maximizing *that* would have you bet your entire bankroll every time if bp > q, leading to almost certain ruin!

  **S:** I'm well aware of the gambler's ruin problem. That's why we have utility functions! We model risk aversion. Someone might reasonably prefer a strategy with a lower *expected terminal wealth* if it drastically reduces the *probability* of catastrophic loss. Their utility function \( u(W) \) captures that. Your "geometric growth" implicitly assumes log utility *is* the correct measure of well-being. You're not proving it's objective; you're *assuming* it.

  **K:** No, Sam! You're missing the fundamental ergodicity breakdown. Wealth in a repeated multiplicative process is *non-ergodic*. The ensemble average – the average wealth across all *parallel universes* after N trials – is dominated by the vanishingly few paths that haven't gone bust. It's astronomically huge, mathematically, but *utterly irrelevant* to a single individual experiencing the process *through time*. The time-average growth rate \( g = \lim_{N \to \infty} \frac{1}{N} \log(\frac{W_N}{W_0}) \) is what matters for the single traveler. And maximizing the *expected value* of *that* growth rate \( E[g] \) is achieved *only* by maximizing \( E[\log(1 + r_f)] \), where \( r_f \) is the return per bet! That's not an assumption; it's a mathematical consequence of the multiplicative nature of the process itself.

  **S:** *(Leans forward)* Ah, the "time-average growth rate." Let's get into these weeds. You define "what matters" as \( g \), the long-run exponential growth factor. But *why* is maximizing the expectation of *that specific g* the "objectively correct" goal? You're still picking a functional to maximize! You privilege the geometric mean growth rate over all others. Why not maximize the median wealth? Or minimize the time to reach a certain wealth goal with 99% probability? Or maximize the probability of never going bankrupt? Each of these implies a different optimal strategy and a different implicit utility function.

  **K:** Because \( g \) directly determines the *long-run* wealth trajectory! \( W_N \approx W_0 e^{gN} \). Maximizing \( E[g] \) maximizes the dominant term in the long-run wealth for the single, persistent agent. Your other metrics are either short-sighted, arbitrary thresholds, or can be disastrously suboptimal in the long run precisely *because* they ignore the multiplicative dynamics. Bankruptcy isn't just a low wealth state; it's a terminal absorbing state! Once you hit zero, the game is *over*. Multiplicative processes with absorbing states fundamentally change the calculus. Geometric growth maximization respects that irreversibility.

  **S:** But you're still making a value judgment! You're declaring that surviving indefinitely and achieving the highest possible *exponential growth rate expectation* is the paramount objective. That's a normative choice! What if an agent cares more about ensuring they definitely have $1M in 10 years, even if it means sacrificing *potential* higher growth? Or what if they derive positive utility from the thrill of larger bets, even if it slightly lowers their *E[g]*? Expected Utility Theory (EUT) provides a *framework* to incorporate *any* consistent set of preferences over wealth distributions, including extreme aversion to bankruptcy. Kelly is just one specific preference structure embedded within EUT.

  **K:** You're conflating *rationality* with *preference*. EUT is a framework for consistent choice under uncertainty *given* arbitrary preferences. But the Kelly result identifies the strategy that is *dominant* for the specific, objectively defined goal of long-run wealth accumulation *in multiplicative environments*. It's not "one preference"; it's identifying the strategy that aligns with the *physics* of the wealth process over time. Saying "maximize E[g]" isn't smuggling in log utility; it's recognizing that log(W) is the *natural* numeraire for multiplicative growth, just as linear utility is natural for additive processes. The non-ergodicity *licenses* privileging the growth rate because the ensemble average becomes pathological and irrelevant.

  **S:** And there it is – "the natural numeraire." That's pure assertion! Why is the growth rate "natural"? Because it makes the math clean? The irreversibility of bankruptcy is real, yes. But EUT handles absorbing states perfectly well – assign a utility of \(-\infty\) to bankruptcy if you wish! Maximizing \( E[\log(W)] \) is mathematically *identical* to maximizing \( E[g] \), and it *is* equivalent to having a logarithmic utility function over terminal wealth. Samuelson's complaint stands: You present maximizing \( E[\log(W)] \) as a theorem of objective rationality derived from the nature of repetition, but it's *still* predicated on accepting that \( \log(W) \) is the correct measure of value for the single individual. You haven't escaped the need for a utility function; you've just chosen one and claimed it's dictated by the process.

  **K:** I haven't *chosen* it; the process *reveals* it as the relevant metric for survival and dominance! Look at the capital growth literature, look at information theory – it emerges naturally. Betting more than Kelly increases the *variance* of the growth rate, dragging down the time-average. Betting less than Kelly guarantees underperformance relative to the maximum possible growth. For the goal of *long-run wealth maximization for a single trajectory*, the Kelly fraction is a saddle point, a point of dominance. It’s not just *a* preference; it’s the strategy that *wins* against all others in the long run with probability 1!

  **S:** "Wins"? Define "win." If "win" means "has higher wealth almost surely in the infinite limit," then yes, under specific assumptions, Kelly dominates *eventually*. But infinity is a long time! Over finite horizons, or when considering different risk measures (like Value-at-Risk), or when incorporating other consumption or investment constraints, Kelly isn't necessarily dominant. More fundamentally, defining "win" as having more wealth *in the long run* is *itself* a specific preference – a preference for maximizing a specific functional of the wealth path. You haven't grounded that preference in objective reality; you've asserted it. The math of multiplicative processes is beautiful, Kelly, and the criterion is powerful. But claiming it's the *objectively correct* rational strategy, independent of utility, is where you cross the line from math into metaphysics. It's elegant, but it's still preference-laden. Samuelson was right to call it out.

  **K:** And you're clinging to a framework that produces pathological recommendations for repeated multiplicative bets because it refuses to acknowledge the primacy of the time-average growth path over the mathematically misleading ensemble average. We'll agree to disagree, Sam. But I know which strategy I'm betting my future on. *(Gathers papers pointedly)*

  **S:** *(Smiles faintly)* As will I, Kelly. As will I. Just know that when you place that bet, you're expressing a very specific utility function, whether you call it that or not. The weeds, it seems, are deeper than either of us can fully clear. *(Takes a slow sip of coffee, the argument unresolved but the intellectual lines sharply drawn.)*

  **Key Points Illustrated:**

  1.  **The Core Dispute:** Is maximizing long-run geometric growth rate (Kelly) an *objective mathematical imperative* for repeated favorable gambles, or is it *equivalent* to maximizing expected log utility (Samuelson's critique)?
  2.  **Ensemble vs. Time Average:** Kelly argues ensemble averages (expected terminal wealth) are irrelevant and misleading for a single agent in a multiplicative process with potential ruin (non-ergodic), making the time-average growth rate (g) the only sensible metric. Sam counters that privileging g is still choosing *what* to maximize.
  3.  **Non-Ergodicity & Irreversibility:** Kelly emphasizes that absorbing states (ruin) fundamentally change the game, making survival and long-run growth paramount. Sam agrees ruin matters but argues EUT can incorporate this via utility (e.g., u(0) = -∞) without mandating log utility.
  4.  **Is Log Utility "Natural" or "Assumed"?** Kelly contends the multiplicative process *reveals* log(W) as the natural quantity to maximize for long-run wealth. Sam contends this is circular: maximizing E[g] *is* maximizing E[log(1+r)], which *is* equivalent to log utility over terminal wealth. Picking g is picking log.
  5.  **Dominance vs. Preference:** Kelly claims Kelly fraction dominance (eventual almost sure superiority) justifies its objectivity. Sam argues "dominance" is defined relative to the chosen goal (long-run wealth), which itself reflects a preference, and that dominance may not hold for other finite-horizon goals or risk measures.
  6.  **The Normative Leap:** Sam's ultimate point: Declaring that maximizing long-run geometric growth is the "rational" goal is a *normative* choice about what constitutes success, not a purely *positive* mathematical deduction. Kelly believes the process dynamics make this choice non-arbitrary and objective.
