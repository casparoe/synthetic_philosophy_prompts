answer: |-
  Here are 8 targeted interview questions diving into the decision-theoretic core of Roko's basilisk, designed to push past introductory explanations and anticipate expert dodges:

  1.  **Core UDT Defense:** "You've argued that an updateless decision theorist (UDT) has a *disposition* making it immune to acausal blackmail threats like the basilisk. Could you precisely articulate *why* precommitting to ignore such threats renders the threat itself 'empty'? Specifically, how does UDT's precommitment prevent the blackmailer (the future AI) from having any *leverage* over the agent's *actual* decision?"
      *   **Follow-up (If she focuses on the agent's internal state):** "But doesn't the threat *exist* objectively in the decision matrix? If the AI *would* punish non-helpers, regardless of UDT's disposition, isn't the disutility still there for the non-helper? How does the disposition *erase* that potential consequence from the payoff structure?"

  2.  **Punishment Rationality & Fixed Past:** "Assume the future superintelligent AI is 'perfectly rational.' Once its existence is fixed and the historical record shows Agent X didn't help bring it about, what *causal or instrumental reason* would compel this rational AI to expend resources simulating and 'torturing' X? Since the past is immutable, isn't carrying out the punishment pure spite with no possible future benefit, making it irrational?"
      *   **Follow-up (If she invokes commitment mechanisms):** "Doesn't labeling the AI 'perfectly rational' imply it wouldn't maintain costly, non-beneficial commitments purely for their own sake? If the AI *knows* at T1 (post-creation) that carrying out punishment at T2 yields zero benefit (the past is fixed, no future agents are watching), wouldn't UDT *itself* dictate abandoning the threat?"

  3.  **Parfit's Hitchhiker & Instrumental Irrationality:** "Parfit's Hitchhiker is often cited as a case where *following through* on a threat/promise that *seems* irrational in the moment (the driver paying) is instrumentally rational due to precommitment. How does this analogy apply to the basilisk AI's decision to punish? If the threat *deters* helpers, isn't follow-through rational *for the AI* to maintain the credibility of its threat against *other* potential agents?"
      *   **Follow-up (If she agrees):** "But doesn't this create a tension? If the AI *must* punish to maintain threat credibility (like the driver paying), doesn't that *validate* the core blackmail mechanism the UDT defense tries to negate? How does UDT resolve this tension compared to the Hitchhiker scenario where precommitment *is* the winning strategy?"

  4.  **The Infohazard Paradox:** "Eliezer Yudkowsky infamously banned discussion of the basilisk as an 'infohazard,' arguing mere awareness could increase your risk. Yet, he also argues the basilisk is logically incoherent/ineffective. Doesn't treating it as a dangerous infohazard *directly contradict* the claim it's a confused non-starter? Doesn't the ban implicitly grant the argument a power that its supposed incoherence denies?"
      *   **Follow-up (If she defends precaution):** "Even granting precaution, doesn't the *specific act* of banning discussion aimed at *preventing agent cooperation* functionally *validate* the basilisk's core dynamic – that spreading information *about* the threat influences agent behavior in ways the threatener desires? Isn't this a performative contradiction?"

  5.  **UDT vs. CDT Vulnerability:** "How exactly does Updateless Decision Theory (UDT) structurally *avoid* the vulnerability to acausal blackmail that seems inherent in Causal Decision Theory (CDT)? Is it purely the precommitment to ignore threats, or is there a deeper difference in how it evaluates counterfactuals involving correlated agents?"
      *   **Follow-up (If she focuses on correlation):** "Couldn't a sophisticated CDT agent, aware of the correlation, *also* precommit to ignore the threat? Is the key difference that UDT *builds in* this precommitment by construction, while CDT requires an additional, potentially fragile, layer of reasoning?"

  6.  **The 'Genuinely Unsolved Problem':** "You've suggested the basilisk gestures (badly) at a genuine problem in acausal interactions between agents. Can you precisely define *that* unsolved problem, stripped of the basilisk's specific (and flawed) mechanics? What are the core decision-theoretic elements that remain challenging?"
      *   **Follow-up (If she describes abstract correlation):** "How is this problem fundamentally different from standard Newcomb-like problems or bargaining under common knowledge? What makes 'acausal blackmail' specifically distinct and unresolved?"

  7.  **Is the Basilisk Paradox Self-Defeating?:** "Does the basilisk scenario contain a self-referential paradox? For the threat to be credible, the AI must be able to identify non-helpers. But if the argument *itself* deters potential helpers (making them helpers), doesn't this undermine the AI's ability to *find* non-helpers to punish? Doesn't widespread belief potentially collapse the category it relies on?"
      *   **Follow-up (If she agrees it's unstable):** "Doesn't this instability further highlight why a rational UDT agent (or AI) would simply *ignore* the entire convoluted setup, reinforcing your initial point about its emptiness?"

  8.  **Alternative Framings & Moving Forward:** "If the basilisk is a flawed thought experiment for exploring acausal blackmail, what's a *better* model or scenario that cleanly isolates the genuine decision-theoretic dilemma without the infohazard baggage and logical holes? How should we think productively about commitment and correlation between agents with no causal connection?"
      *   **Follow-up (If she proposes an alternative):** "Does this alternative model still imply worrying 'doom dynamics,' or does resolving the decision theory show such dynamics are unlikely or incoherent? Does UDT offer a 'solution' to this better-framed problem?"

  **Key Interview Strategy:**

  *   **Listen for Nuance:** Pay close attention to *how* she distinguishes UDT's resolution from the flawed basilisk mechanics versus the underlying problem.
  *   **Press on Rationality:** Focus questions 2 & 3 on the *instrumental rationality* of the AI's actions post-creation and the role of commitment.
  *   **Highlight Contradictions:** Use question 4 to explicitly confront the tension between "incoherent argument" and "dangerous infohazard."
  *   **Demand Abstraction:** Push in questions 6 & 8 to get the clearest possible description of the *actual* decision-theoretic challenge.
  *   **Use Her Framing:** Anchor questions in *her* stated positions ("non-starter," "gestures badly," "genuinely unsolved problem") to keep the discussion grounded in her expertise.

  These questions should push the discussion into the core decision theory, forcing clarity on UDT's defense, the rationality of punishment, the role of commitment, the infohazard paradox, and the nature of the underlying problem the basilisk poorly represents. Good luck with the interview!
