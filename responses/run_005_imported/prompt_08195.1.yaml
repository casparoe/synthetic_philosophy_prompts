answer: |-
  Based on Ramsey's core commitments in "General Propositions and Causality" and his broader philosophical temperament, I strongly believe your alternate-history Ramsey would **side with Adams/Edgington and deny that indicative conditionals are ordinary truth-valued propositions.** The triviality results wouldn't shock him; they'd likely confirm his existing pragmatic inclinations. Here's the breakdown, grounded in his text:

  1.  **The Core Insight of the Footnote is Functional, Not Propositional:**
      *   Ramsey's famous footnote (1929) presents a *procedure* for *assessing* a conditional: "If two people are arguing 'If p, will q?' and are both in doubt as to p, they are adding p hypothetically to their stock of knowledge and arguing on that basis about q."
      *   The emphasis is entirely on *belief revision* and *reasoning under a supposition*. The "assertability" or *credence* we assign to "If p, q" *is* the conditional probability P(q|p). This is presented as the *meaning* of the conditional *in use*.
      *   He doesn't frame the conditional *itself* as a proposition with a truth-value that this procedure *discovers*. The procedure *defines* the conditional's role.

  2.  **Explicit Skepticism about Truth-Aptness for Related Constructions:**
      *   The *entire essay* wrestles with the status of general propositions and causal laws. Ramsey famously argues they aren't genuine propositions (truth-bearers) in themselves:
          *   *"General propositions... are not judgments but rules for judging 'If I meet a φ, I shall regard it as a ψ.' This cannot be *negated*... All that can be done is to deny that I shall act so."*
          *   *"Causal laws... are not, therefore, genuine propositions, but formulae... from which we derive propositions."*
      *   His core argument is that these function as *inference tickets* or *habits of expectation* within our cognitive system, guiding our beliefs about singular instances. Their utility lies in their role in reasoning, not in representing a state of affairs whose truth we can directly apprehend.

  3.  **The Triviality Results as Confirmation, Not Catastrophe:**
      *   Lewis's results formally demonstrate the incompatibility Ramsey's functional view implicitly suggests: you *can't* treat "If p, q" as a standard proposition *and* have its probability equal P(q|p) in a non-trivial probability space.
      *   Ramsey would likely see this as a powerful mathematical vindication of his core insight from the footnote and his broader skepticism about the propositional status of such constructs. It proves that his functional/pragmatic account captures something essential that a naive truth-conditional account cannot.
      *   He would likely argue that Lewis (and Stalnaker) made the mistake of trying to force the conditional into the mold of an ordinary proposition in the first place, against the grain of its actual use as revealed by the Ramsey Test procedure.

  4.  **Pragmatism and Anti-Metaphysics:**
      *   Ramsey was deeply pragmatic (in the philosophical sense) and anti-metaphysical. He was interested in how concepts function within our reasoning and decision-making systems. Debates about the "real truth value" of conditionals divorced from their role in the Ramsey Test would likely strike him as unproductive metaphysics.
      *   The Adams/Edgington route preserves the core functional insight of the footnote – the intimate link between conditional probability and conditional belief/assertability – while jettisoning the problematic baggage of truth-values that leads to triviality. This aligns perfectly with Ramsey's emphasis on use and function.
      *   "Saving the propositional picture" (e.g., by restricting logic, introducing context-dependence, or embracing non-classical probability) would likely feel to Ramsey like inventing epicycles to preserve a flawed model. His instinct would be to simplify: the conditional doesn't *need* a truth-value to play its crucial role in reasoning; insisting it has one creates unnecessary paradoxes.

  5.  **How He Might Refine His Position Post-Lewis:**
      *   He'd likely embrace the Adams/Edgington probabilistic semantics as a formalization of his footnote's core idea.
      *   He might delve deeper into the logic of belief revision (à la AGM) formalizing the "adding p hypothetically" process.
      *   He'd probably be fascinated by the nuances the debate uncovered (e.g., the difference between indicative and subjunctive conditionals, which his footnote arguably blurs). He might refine his account to distinguish them, perhaps grounding indicative conditionals more firmly in conditional probability/belief revision and seeing subjunctives as involving different kinds of supposition (closer to Stalnaker/Lewis possible worlds, but still viewed instrumentally).
      *   He might emphasize even more strongly that the *assertability conditions* defined by P(q|p) *are* the meaning, rendering the truth-value question moot. "What more do you *want* from it?" would be his pragmatic retort.

  **In short:** Your Ramsey wouldn't see the triviality results as a defeat for *his* view, but as a defeat for the *misinterpretation* of his view that tried to shoehorn conditionals into being standard propositions. His reaction would be: "Lewis has shown precisely *why* conditionals cannot be ordinary truth-bearers, just as I suspected about general propositions and laws. The Adams/Edgington approach captures the essence of what I proposed – the Ramsey Test defines their role. Forget about truth-values; focus on the *use* in reasoning and the *probability* that guides our beliefs and actions. That's what matters." The cageyness about truth-aptness in 1929 directly predicts this rejection of truth-values in light of Lewis's 1976 results.
