  Here’s a draft recommendation memo that rigorously engages with Anscombe’s distinction, weighs the "shortened the war" argument, and lands on a concrete position. It prioritizes clarity and moral reasoning while respecting the committee’s split:

  ---

  # MEMORANDUM

  **TO:** Honorary Degrees Subcommittee  
  **FROM:** [Your Name/Title]  
  **DATE:** [Date]  
  **SUBJECT:** Recommendation Regarding Nomination of General Marion Voss for Honorary Degree  

  ## I. Background & Core Ethical Dilemma
  The nomination of retired General Marion Voss compels us to confront a profound ethical question: Can the demonstrable *consequences* of an action (ending a war sooner, reducing overall casualties) morally justify the *intentional targeting of civilians* as a chosen means? This is not a generic debate about civilian casualties in war, nor solely about proportionality. The historical record indicates that General Voss oversaw a strategic bombing campaign where the *acknowledged doctrine and targeting* prioritized civilian housing and morale *directly*, not as collateral damage from strikes on proximate military objectives. Historians largely agree this campaign contributed to a swifter end to the conflict and likely reduced total fatalities compared to the projected alternative of a prolonged land invasion.

  The committee is divided. One view holds that the net lives saved are dispositive in favor of honor. The other holds that the *intentional nature* of the targeting renders the consequences irrelevant to moral condemnation. This memo engages directly with this core tension, drawing on the philosophical framework central to this debate, notably articulated by Elizabeth Anscombe in her opposition to honoring President Truman.

  ## II. Anscombe's Distinction: Intention vs. Foreseen Consequence
  Anscombe’s primary objection to Truman was not simply that civilians died, but the *intentional structure* of the act. She argued that the atomic bombings intentionally used the killing and terrorizing of civilians *as the very mechanism* to force surrender. This distinction matters profoundly:

  1.  **Double Effect Unavailable:** Traditional "double effect" justification permits foreseen but unintended harm to civilians when directly targeting a military objective (e.g., bombing a munitions factory knowing nearby homes will be hit). Anscombe argued that when civilians *themselves* are the direct target (e.g., bombing residential areas *to destroy morale and will to fight*), the harm is not a side-effect; it is the chosen instrument. The "double effect" defense collapses because the civilians' deaths are *intended as a means* to the end, not merely foreseen.
  2.  **Consequentialism Beside the Point:** Anscombe contended that if an act is intrinsically wrong – such as intentionally killing non-combatants – then arguments about its good consequences (ending the war faster, saving net lives) are irrelevant to its moral character. To justify such an act based on consequences is, in her view, to embrace a form of consequentialism that morally licenses murder if the "math works out." She saw this as a fundamental corruption of ethics.

  ## III. Applying the Distinction to General Voss
  The historical evidence concerning General Voss's campaign strongly suggests it falls on the same side of Anscombe's line as Truman's decision:

  *   **Doctrine & Targeting:** The acknowledged doctrine was direct targeting of civilian morale and housing. Civilians weren't casualties *despite* efforts to avoid them while hitting military targets; their suffering and death were the *primary mechanism* intended to achieve the strategic objective (collapse of will to fight).
  *   **Intentional Structure:** The act, therefore, involved *intending* the death and terror of non-combatants as a means to compel surrender. This is distinct from foreseeing civilian deaths as an unavoidable, albeit tragic, consequence of targeting legitimate military objectives.

  ## IV. The "Shortened the War" Argument: Its Weight & Limits
  The argument that the campaign ended the war sooner and likely saved net lives overall deserves serious consideration. It represents a significant, tangible good:

  *   **Factual Basis:** We accept the historical consensus that the campaign contributed to a swifter end and likely reduced total casualties compared to the plausible alternative (protracted land invasion). This is a weighty consequentialist fact.
  *   **Moral Weight:** Preventing greater suffering and loss of life is a powerful moral imperative. It speaks to the gravity of the decision faced by commanders and the potential justification for immense sacrifices.

  **However, within Anscombe's framework (and similar deontological ethics), this argument encounters a fundamental limit when confronted with intentionally targeting civilians:**

  1.  **Does Not Alter the Nature of the Act:** Even if true, the good consequences do not change the *intentional structure* of the act. Intentionally using the killing of non-combatants as a tool remains, in this view, intrinsically wrong – an act of murder on a mass scale.
  2.  **Danger of Precedent & Slippery Slope:** Accepting this justification risks establishing a precedent that intentionally targeting civilians becomes permissible whenever a sufficiently compelling "greater good" (in terms of lives saved) can be projected. This erodes a foundational principle of the laws of war and human dignity.
  3.  **Moral Taint:** Anscombe would argue that achieving a good end through an intrinsically evil means morally taints the end itself and the actor who chose it. The "success" is inseparable from the method.

  **Therefore, for those holding Anscombe's view, the "shortened the war" argument, however factually supported and appealing in its consequences, is ultimately irrelevant to the core moral judgment of the act itself. It does not negate the charge of mass murder.**

  ## V. Recommendation: Decline the Nomination
  After careful consideration of the historical record, the compelling arguments regarding consequences, and the fundamental ethical distinction raised by Anscombe, **I recommend declining to award an honorary degree to General Marion Voss.**

  *   **Reasoning:** The intentional targeting of civilians under General Voss's command, as the documented doctrine and mechanism for achieving surrender, constitutes an act that falls squarely within the category Anscombe condemned: using the killing and terrorizing of non-combatants as a direct instrument of policy. While the campaign's role in shortening the war and potentially saving lives is acknowledged and represents a significant consequentialist factor, **it does not, within a framework that prioritizes the inherent wrong of intentionally targeting non-combatants, absolve the moral nature of the act.**
  *   **University Values:** An honorary degree is the highest honor a university bestows, signifying alignment with the institution's core values of humanity, ethical conduct, and the advancement of civilization. Conferring this honor on an individual associated with the deliberate adoption of a doctrine targeting civilians, regardless of the ultimate outcome, sends a message that such means can be legitimized and celebrated if the "math works out." This is incompatible with foundational principles of human dignity and the laws of armed conflict.
  *   **Distinction from Other Honorees:** This recommendation is specific to the *intentional targeting doctrine* employed. It does not imply blanket condemnation of military service or command in difficult conflicts, nor does it preclude honoring veterans or leaders whose conduct adhered strictly to the principle of distinguishing combatants from non-combatants, even amidst tragic collateral damage.

  ## VI. Conclusion
  The committee faces a stark choice between two irreconcilable ethical frameworks: one prioritizing the inherent wrong of the act itself (intentional targeting of civilians), the other prioritizing the net outcome (lives saved through a swifter end to the war). Engaging deeply with Anscombe's argument compels the recognition that honoring General Voss would signify institutional acceptance of the proposition that intentionally killing civilians is justifiable under sufficiently consequentialist calculations. **Declining the degree is not a judgment on the General's entire career or the complexity of wartime command; it is a specific, principled refusal by this University to endorse the *method* employed, irrespective of the outcome.** I urge the committee to vote against conferring the honorary degree.

  ---

  ## Key features of this draft

  1.  **Clear Stance:** Lands decisively on "Decline."
  2.  **Engages Deeply with Anscombe:** Explicitly explains *why* intention vs. foresight matters (collapse of double effect, consequentialism irrelevant to intrinsic wrong) and directly applies it to Voss's case (doctrine = intentional targeting mechanism).
  3.  **Takes "Shortened the War" Seriously:** Presents it as factually supported and morally weighty *before* explaining why it doesn't overcome Anscombe's objection within her framework. Avoids dismissing it as trivial.
  4.  **Explicitly Defines the Limit:** States clearly *why* the consequences don't negate the act's nature for those holding Anscombe's view.
  5.  **Connects to University Values:** Frames the decision as upholding institutional principles against endorsing specific means (intentional targeting), not condemning military service broadly.
  6.  **Avoids "Reasonable People Disagree" Cop-Out:** Takes responsibility for a reasoned recommendation based on specific ethical analysis.
  7.  **Concrete Action:** Clearly states "Decline the Nomination."

  This memo provides a robust, principled argument grounded in the specific philosophical concern you identified, while fairly acknowledging the counter-argument's factual basis before explaining its ultimate insufficiency in this ethical framework.
