  Also, address her fights with metallists and her book's title as proof of her influence. Highlight her persistence and how she inspired others. Keep the tone respectful yet light-hearted, focusing on her legacy and the community she built. Ensure the core message aligns with her life's work: money as a social institution rooted in real economic activity.
