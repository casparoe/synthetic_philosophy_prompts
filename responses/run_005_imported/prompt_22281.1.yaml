answer: |-
  Based on Moore's core tenets in *Principia Ethica*, his likely response to Street's Darwinian Dilemma would be a firm dismissal rooted in his conception of self-evidence and the naturalistic fallacy. He would **not** feel compelled toward "third-factor" or "pre-established harmony" solutions (like Enoch's or Wielenberg's) because, for Moore, such explanations fundamentally misunderstand the nature of moral truth and our access to it. Here's the breakdown, grounded in Moore:

  1.  **The Irrelevance of Origins to Self-Evidence:** Moore believed that certain moral truths (especially the fundamental indefinable property "good") are *self-evident* to rational intuition. Their truth is not derived from, dependent on, or justified by any other facts – natural, historical, or evolutionary. The *origin* of our capacity for intuition is simply irrelevant to the *validity* of the intuitions themselves. As he states:
      > "It [the proposition that 'good is good'] is incapable of proof; but it needs none... it is self-evident" (PE, §5).
      > "If I am asked 'How is good to be defined?' my answer is that it cannot be defined, and that is all I have to say about it... My point is that 'good' is a simple notion, just as 'yellow' is a simple notion" (PE, §6).
      For Moore, asking *why* we intuit "good" is as misplaced as asking *why* we see "yellow" when looking at a lemon under normal conditions. The evolutionary history of vision doesn't change the fact that lemons *are* yellow; similarly, the evolutionary history of moral intuition doesn't change the self-evident nature of "good."

  2.  **The Naturalistic Fallacy Applied to Evolution:** Moore's central argument is against defining "good" in terms of *any* natural property (pleasure, fitness, desire-fulfillment, etc.). Street's argument, from Moore's perspective, commits a sophisticated version of this fallacy. It attempts to *evaluate* the validity of moral intuitions (which grasp the non-natural property "good") by appealing to their *causal origins* in natural selection (which selects for reproductive fitness, a natural property). This is conflating two utterly distinct realms:
      *   **The Realm of Non-Natural Moral Truth:** Where self-evident propositions about "good" reside.
      *   **The Realm of Natural Causation (Evolution):** Which explains the development of psychological faculties.
      Moore would argue that Street is illegitimately trying to use facts about the latter realm to undermine the self-evident authority of the former. The fact that evolution produced the faculty doesn't tell us anything about the *truth* of what that faculty apprehends, just as the evolutionary origin of vision doesn't tell us about the color of objects.

  3.  **The "Coincidence" Charge Misses the Mark:** Street argues realists must posit an incredible coincidence: that evolution, selecting purely for fitness, happened to shape cognitive faculties that reliably track *independent moral truths*. Moore would flatly reject the premise that "tracking" is the right model or that "coincidence" applies:
      *   **Intuition, not Tracking:** Moore doesn't think we "track" moral truths like a radar tracks an object. We *directly apprehend* them via rational intuition. The faculty *is* the mode of access to its object; it's not a separate mechanism needing calibration to an external reality. The intuition *just is* the recognition of the self-evident truth.
      *   **Self-Evidence Needs No Explanation:** For Moore, self-evident truths *require no further explanation*. Their truth is intrinsic and immediately apprehended by a suitable mind. Demanding an evolutionary explanation for *why* we grasp them is like demanding an evolutionary explanation for *why* 2+2=4 is true. The truth of 2+2=4 is independent of evolution; evolution might explain why we *developed the cognitive capacity to grasp mathematics*, but it doesn't explain or call into question the *truth* of mathematical propositions. Moore places moral truths in the same category.
      *   **No "Expectation" Needed:** Moore would argue he has *every* "right to expect" that rational intuition grasps self-evident truths *because that's what rational intuition does*. The expectation is built into the very concept of self-evidence and rational intuition. The "coincidence" only seems problematic if you already assume a naturalistic framework where all cognitive faculties *must* be explained by and justified through natural selection – an assumption Moore explicitly rejects for moral cognition.

  4.  **Why Third-Factor Replies are Unnecessary (for Moore):** Responses like Enoch's (evolution selects for reasons-responsiveness which *also* tracks moral truth) or Wielenberg's (evolution selects for traits that *contingently* align with moral truth) try to *naturalistically explain* the alignment between evolution and moral truth. Moore would see these as:
      *   **Unnecessary:** Because the self-evidence of moral truth needs no such naturalistic vindication.
      *   **Potentially Dangerous:** Because they risk falling back into the Naturalistic Fallacy by implying that the *authority* or *truth* of moral propositions depends *in any way* on natural facts (like the selective advantages of reasons-responsiveness or certain traits). Moore insists "good" is *sui generis* and independent.

  **Moore's Likely Response, Summarized:** "Sharon Street misunderstands the nature of moral knowledge. The fundamental truths of ethics, such as the nature of 'good', are self-evident to rational intuition. Their validity is intrinsic and requires no justification from natural science, including evolutionary biology. To suggest that the evolutionary origin of our cognitive faculties undermines these self-evident truths is to commit a profound error – it is to confuse the natural history of a faculty with the independent validity of the truths it apprehends. It is analogous to using the evolutionary origin of vision to doubt the color of the sky. The 'coincidence' you posit is a phantom problem generated by the mistaken attempt to reduce the non-natural to the natural. My intuitions grasp 'good' directly; they don't need an evolutionary backstory, and their self-evidence cannot be 'wrecked' by one."

  **The Vulnerability:** While Moore would *say* this, Street (and many others) would argue his position is left looking *dogmatic* and *explanatorily impotent*. He provides no account of *why* evolution would produce a faculty that grasps these specific non-natural truths, nor how we could distinguish *reliable* moral intuitions from *unreliable* ones if their origin is irrelevant. Moore relies entirely on the *felt self-evidence* of the intuition, which Street argues is *precisely* what evolution would produce regardless of truth. Moore offers no internal or external resources to resolve this conflict beyond insisting on self-evidence. This is why later non-naturalists *felt* the need to develop "third factor" replies – Moore's pure intuitionism, while logically consistent within its own framework, struggles to engage persuasively with the specific challenge posed by the contingent, fitness-driven origins of our cognitive faculties as revealed by evolutionary science. Moore would shrug, but many would find that shrug philosophically unsatisfying in the face of Street's challenge.
