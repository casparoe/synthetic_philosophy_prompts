answer: |-
  You've nailed the core tension in the "standing to blame" debate! Let's break down Wallace and Cohen, apply them to your oil exec case, and see where the real disagreement lies.

  **1. R. Jay Wallace: Hypocrisy as a Failure of Equal Standing**

  *   **Core Idea:** Blaming is a distinctive form of *moral address*. It presupposes a relationship of *moral equality* between the blamer and the blamed. When you blame someone, you implicitly claim the authority to hold them accountable based on a shared moral standard that binds *both* of you.
  *   **Why Hypocrisy Undermines Standing:** Hypocritical blame violates this presupposition of equality. By blaming someone for violating a norm that *you yourself routinely violate* (or claim exemption from), you implicitly assert that *you* are not subject to the same norms in the same way. You place yourself *above* the person you're blaming. This breaks the reciprocal relationship necessary for legitimate moral address. You are, in effect, saying: "These rules bind *you*, but not *me* in the same way." This makes the blame *unfair* and robs you of the moral authority to issue it.
  *   **Focus:** Very much on the *personal conduct* of the blamer relative to the *specific norm* they are invoking against the blamed. It's about the blamer's *own* violation of the *very same standard*. ("Do as I say, not as I *do*").

  **2. G.A. Cohen: Complicity in the Structure of Injustice**

  *   **Core Idea (from "Casting the First Stone"):** Standing isn't primarily about personal hypocrisy regarding the *identical act*, but about *complicity in the broader structure of injustice* that *enables* or *is constituted by* the wrongdoing being condemned. The question is: Does the blamer *benefit from* or *participate in* the same unjust system they are condemning, even if their *specific* actions differ?
  *   **Why Complicity Undermines Standing:** If you are deeply embedded in, benefit significantly from, and perhaps even help sustain the very system that *produces* the wrongdoing you're condemning, your condemnation rings hollow. It lacks *moral purity* or *clean hands*. Your position is compromised because you are *part of the problem*, even if your *individual contribution* to the *specific instance* of wrongdoing is indirect or non-identical. Condemning others becomes hypocritical because you fail to adequately acknowledge or address your *own role* in sustaining the underlying injustice.
  *   **Focus:** Broader than personal conduct. It's about *systemic involvement*, *benefit*, and *shared responsibility* for the *background conditions* that make the specific wrongdoing possible or prevalent. ("You condemn *this* fruit, but you nourish and profit from the *tree* that bears it").

  **The Oil Exec Case: Applying the Theories**

  *   **The Scenario:** A former oil executive (never drilled a well personally) made a fortune from the oil industry. Now, as a climate activist, they publicly shame everyday people for their carbon footprints (e.g., driving ICE cars, flying, meat consumption).
  *   **Wallace's Verdict (Likely): HAS STANDING (or standing isn't *clearly* undermined).**
      *   *Reasoning:* Wallace focuses on personal violation of the *specific norm* being enforced. The exec is blaming people for *their personal carbon emissions*. The exec is *not* (presumably) currently violating *that same norm* in an egregious way (e.g., they might now live a low-carbon life). Their past role was different (profiting from *supplying* the fossil fuels, not *consuming* them excessively). While profiting from the industry might be morally questionable, it's not the *same* as violating the *specific consumption norm* they are now enforcing. They aren't claiming an exemption *for themselves* from reducing *their own* carbon footprint *now*. Therefore, the core condition of equal standing concerning the *norm invoked* (personal emissions reduction) isn't obviously broken.
  *   **Cohen's Verdict (Likely): LACKS STANDING.**
      *   *Reasoning:* Cohen looks at systemic complicity. The exec amassed wealth by being a key part of the *very system* (fossil fuel extraction/profit) that *caused* the climate crisis and *enables* the high-carbon lifestyles they now condemn. They directly benefited from and participated in the structural injustice that makes individual "carbon footprints" both possible and often difficult to avoid. Shaming individuals for consumption while having profited massively from the *supply side* ignores their own deep complicity in creating the problem and the power structures involved. Their blame lacks moral purity because they haven't adequately reckoned with their *own foundational role* in the system producing the harm.

  **Which Theory Tracks Intuitions Better?**

  *   For the **oil exec case, Cohen's view likely aligns better with common moral intuitions.**
      *   Most people intuitively feel the exec's blame is *hypocritical* or *unfair*, even if they now live sustainably. The sheer scale of their past benefit from the destructive system, contrasted with shaming individuals who have far less power and choice within that system, feels jarring. Wallace's focus on the specific consumption norm feels too narrow and lets the exec off the hook for their foundational complicity. Cohen captures the sense that the exec is blaming the leaves while ignoring the roots they helped plant and water.
  *   **Wallace's view might seem overly formalistic** in this context. While technically the exec isn't violating the *same* norm (consumption vs. production profit), the connection is so direct and the benefit so vast that the *spirit* of hypocrisy and unfairness is clearly present. Cohen's framework is better equipped to handle this kind of *structural complicity hypocrisy*.

  **Is the Disagreement Verbal or Real?**

  *   **It's a REAL, substantive disagreement,** though with overlap:
      1.  **Scope of "The Norm":** Wallace focuses tightly on the *identical* norm or duty violated. Cohen looks at *broader participation in the system* governed by related norms of justice. Is "not emitting excessive CO2" the *same* norm as "not profiting from and enabling a system that causes excessive CO2"? Cohen argues they are intimately connected within the structure of climate injustice; Wallace would likely see them as distinct duties.
      2.  **Nature of the Failure:** Wallace sees the failure as breaking the *relational equality* necessary for address. Cohen sees it as a lack of *moral purity* due to *shared complicity* in the underlying injustice. One is about the *form* of the interaction, the other about the *substance* of the blamer's position.
      3.  **Focus:** Wallace = Individual Conduct & Specific Norm Identity. Cohen = Systemic Role & Structural Complicity.
  *   **Overlap:** Both agree that certain forms of compromised position undermine the authority to blame. Both target forms of hypocrisy. Cohen's view *encompasses* Wallace's core case (the direct "do as I say, not as I do" hypocrite) as a subset – that person is clearly complicit in the norm violation. But Cohen *extends* the concept to cover cases where the blamer's complicity is systemic rather than direct and identical. Wallace's theory struggles to explain the intuitive wrongness in cases like the oil exec *without* stretching the concept of "violating the same norm."

  **Conclusion:**

  Your oil exec case is a powerful illustration of why Cohen's view is often seen as more compelling, especially for complex social injustices. Wallace provides a crucial foundation for understanding why direct, personal hypocrisy invalidates blame by breaking relational equality. However, Cohen's focus on structural complicity and benefit better captures why someone deeply embedded in and enriched by the *source* of a problem lacks the moral purity to credibly condemn those struggling with its *symptoms*, even if they aren't currently violating the exact same behavioral norm. The disagreement is real – Wallace prioritizes the symmetry of the specific norm violation in the blaming relationship, while Cohen prioritizes the blamer's clean hands regarding the underlying structure of injustice. In the messy world of politics and systemic harm, Cohen's lens often feels more attuned to our intuitive sense of unfairness. Your political hypocrisy examples likely involve *both* direct Wallace-style hypocrisy *and* deeper Cohen-style structural complicities, which is why simply yelling "hypocrite!" feels both powerful and insufficient.
