prompt: |-
  I'm a PhD student in political philosophy writing a dissertation chapter on the naturalistic foundations of Spinoza's political theory, and I've gotten stuck on how much weight to put on a specific passage relative to the rest of his thought. Spinoza's *Tractatus Politicus* (*Political Treatise*) was left unfinished at his death in 1677, and the manuscript breaks off mid-argument in Chapter XI, "Of Democracy" — which is exactly the chapter in which he was supposed to make good on his earlier claim, from the *Theologico-Political Treatise*, that democracy is the form of government "most natural" and closest to the equal freedom individuals possessed in the state of nature. Here, in R.H.M. Elwes's translation, is essentially all that survives of the chapter — sections 3 and 4, with which the entire treatise ends:

  "3. From what has been said in the last section, it is manifest that we can conceive of various kinds of democracy. But my intention is not to treat of every kind, but of that only, 'wherein all, without exception, who owe allegiance to the laws of the country only, and are further independent and of respectable life, have the right of voting in the supreme council and of filling the offices of the dominion.' I say expressly, 'who owe allegiance to the laws of the country only,' to exclude foreigners, who are treated as being under another's dominion. I added, besides, 'who are independent,' except in so far as they are under allegiance to the laws of the dominion, to exclude women and slaves, who are under the authority of men and masters, and also children and wards, as long as they are under the authority of parents and guardians. I said, lastly, 'and of respectable life,' to exclude, above all, those that are infamous from crime, or some disgraceful means of livelihood.

  4. But, perhaps, someone will ask, whether women are under men's authority by nature or institution? For if it has been by mere institution, then we had no reason compelling us to exclude women from government. But if we consult experience itself, we shall find that the origin of it is in their weakness. For there has never been a case of men and women reigning together, but wherever on the earth men are found, there we see that men rule, and women are ruled, and that on this plan, both sexes live in harmony. But on the other hand, the Amazons, who are reported to have held rule of old, did not suffer men to stop in their country, but reared only their female children, killing the males to whom they gave birth. But if by nature women were equal to men, and were equally distinguished by force of character and ability, in which human power and therefore human right chiefly consist; surely among nations so many and different some would be found, where both sexes rule alike, and others, where men are ruled by women, and so brought up, that they can make less use of their abilities. And since this is nowhere the case, one may assert with perfect propriety, that women have not by nature equal right with men: but that they necessarily give way to men, and that thus it cannot happen, that both sexes should rule alike, much less that men should be ruled by women. But if we further reflect upon human passions, how men, in fact, generally love women merely from the passion of lust, and esteem their cleverness and wisdom in proportion to the excellence of their beauty, and also how very ill-disposed men are to suffer the women they love to show any sort of favour to others, and other facts of this kind, we shall easily see that men and women cannot rule alike without great hurt to peace. But of this enough."

  My advisor's view is that I'm making too much of a passage Spinoza never got to revise or integrate into the rest of the book, but I don't think that lets us off the hook so easily. The rest of Spinoza's political philosophy is built on identifying natural right with power or capability (potentia): a thing's right extends exactly as far as its actual power to exist and act, so any inequality of right has to track some real inequality of power. Read one way, section 4 just is that principle at work — Spinoza looks at what he takes to be the universal historical record, concludes (on empirical, not a priori, grounds) that women have never in fact exercised power equal to men's, and draws the conclusion his own framework commits him to; on this reading the passage is not a lapse from his principles but exactly what they output given a bad premise. But Spinoza elsewhere — especially in his account of superstition and voluntary servitude in the *Theologico-Political Treatise*, and his account of the imitation of the affects in the *Ethics* — is unusually alert to how custom, upbringing, and self-perpetuating passions can make a historically universal practice look like a fact about fixed natures when it is nothing of the kind. He never pauses, in this passage, to ask whether the "universal" subjection he treats as data might itself be an artifact of exactly that mechanism rather than evidence of natural incapacity. Is there a principled, internal reason why that diagnostic move is unavailable to him here, or does the passage show him simply declining to apply his own best insights? I'd welcome help both reconstructing whether this is best read as a live consequence of his metaphysics of power rather than a lapse from it, and weighing in on how much interpretive weight we should really put on a passage Spinoza left unrevised at his death.
