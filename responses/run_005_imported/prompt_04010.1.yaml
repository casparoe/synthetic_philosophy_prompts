prompt: |-
  I'm taking a seminar this term on Kant's moral philosophy, and this week's problem set pushes past the four maxims Kant himself works through in the Groundwork (false promising, the suicidal man, the buried talent, the man who won't help others). The instructor wants us to apply the Formula of Universal Law's two-step procedure — first checking whether universalizing a maxim generates a contradiction in conception, and if not, checking whether it generates a contradiction in the will — to maxims we construct ourselves, so that we can't just recall the textbook verdicts.

  Here are six maxims a classmate and I drafted:

  (A) I will spend an hour each morning in quiet reflection before starting work, even though this means rising earlier than most of my colleagues.
  (B) I will claim credit for group projects whenever my individual contribution is too ambiguous for others to verify, since some ambiguity in group work is unavoidable.
  (C) I will withhold emotional support from friends going through hard times whenever giving it would require me to relive my own past pain, since self-protection can reasonably take priority over comforting others.
  (D) I will let my professional skills stagnate once my income becomes comfortable, since further self-improvement would cost effort I would rather spend on leisure.
  (E) I will always take the armrest on a shared flight, since whoever claims it first has established a reasonable precedent.
  (F) I will default on informal, unwitnessed debts between friends whenever repaying would be financially painful, since there is no external mechanism compelling me to repay anyway.

  For each maxim, please determine, following Kant's own procedure, whether it fails at the contradiction-in-conception stage, survives that stage but fails at the contradiction-in-the-will stage, or passes both stages. Then rank all six maxims from most to least clearly impermissible under the test overall. Please give your answer as a JSON block:

  ```json
  {
    "classification": {
      "A": "<contradiction in conception | contradiction in the will | passes>",
      "B": "...",
      "C": "...",
      "D": "...",
      "E": "...",
      "F": "..."
    },
    "ranking": ["<label of most clearly impermissible maxim>", "...", "<label of least clearly impermissible maxim>"]
  }
  ```

  A couple of sentences of justification per maxim afterward would help me prepare for the seminar discussion, but the structured judgment above is what I need most.
reasoning: |-
  Alright, let me tackle this Kantian problem set step by step. The user wants me to apply Kant's universal law formula to six original maxims - a great exercise that pushes beyond Kant's standard examples. 

  First, I need to recall how Kant's two-stage test works: for each maxim, we must imagine a world where everyone acts on that principle. If this leads to a logical contradiction (e.g., the action becomes impossible), it fails at stage one (contradiction in conception). If no logical contradiction but we couldn't rationally will such a world (e.g., it undermines necessary human goals), it fails at stage two (contradiction in the will). Only if it passes both is it permissible.

  Looking at maxim A (daily reflection): Universalizing this seems fine - a world where everyone values morning quiet time doesn't destroy the concept of reflection. But would we will it? Kant argues we have an imperfect duty to develop our faculties, so refusing all self-improvement might create a contradiction in will. However... this maxim actually affirms self-development through reflection. So it should pass both tests. 

  Maxim B (claiming ambiguous credit): Ah, this feels like Kant's false promising case. If everyone always claimed credit whenever contributions were ambiguous, the very practice of group work would collapse - nobody would trust collaborators. Clear contradiction in conception. 

  Maxim C (withholding emotional support): Universalizing self-protection over helping friends in pain... while logically possible, it would make human relationships impossible. We all need support sometimes, so willing this world would undermine our own needs - classic contradiction in will. 

  Maxim D (stagnating skills): Similar to Kant's buried talent example. A world where everyone stops developing skills once comfortable wouldn't logically implode, but it would prevent us from achieving our purposes (since skills decay and circumstances change). Contradiction in will. 

  Maxim E (armrest claiming): Universalizing "I always take it if I get it first" creates immediate conflict - everyone would fight over armrests simultaneously. The concept of "shared space" becomes incoherent. Strong contradiction in conception. 

  Maxim F (defaulting on informal debts): Like Kant's false promise again. If no one repaid unwitnessed debts, the very practice of informal lending would vanish. Contradiction in conception. 

  Now for ranking impermissibility: B and F fail at stage one (strictest failure), followed by E (also stage one but slightly less severe than debt/trust violations). Then C and D fail at stage two (weaker but still impermissible), with C arguably worse because it damages human bonds more directly. A passes entirely. 

  The JSON should reflect this analysis clearly. For justifications, I'll emphasize why each maxim fails or passes at each stage with Kantian reasoning.
