  - This rule doesn't necessarily break the pump because the agent might still make a series of trades that are each non-dominated but lead to a dominated outcome. 
  - Therefore, it might not fully prevent the pump. 
  - I'd put this in C tier because it may help in some cases but does not guarantee avoidance of the pump.

