  - S: Strategies that genuinely avoid the money pump without changing the preferences and without leaving the agent worse off. Resolute choice (2) does this by commitment to a plan. So [2].
  - A: Sophisticated choice (1) is very effective but requires the agent to anticipate and avoid the cycle. It doesn't change preferences and avoids the pump. So [1].
  - B: Wide framing (3) can work if the agent can always see the whole sequence, but it's not always applicable. So [3].
