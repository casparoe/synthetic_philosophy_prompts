prompt: |-
  I'm on the board of our little local history museum — all volunteers, nobody with any art background. Our one real "name" piece, a big landscape always labeled as being by the one painter from our town who ever got properly famous, is why most people actually come in. We hired a conservator to clean it, and after some pigment testing she's now pretty confident he didn't paint it at all — more likely an apprentice or someone in his circle copying his style at the time, and it only picked up his name decades later from a donor who liked the idea of owning a real one. So nobody was trying to trick anybody when it was actually painted, it just sort of turned into a fake later through other peoples wishful thinking and bad paperwork. Half the board wants to quietly relabel it and move it out of the main room since technically we've been misrepresenting it for years, the other half says people get the exact same experience standing in front of it either way, so changing anything now just makes us look bad for no benefit to anyone walking through the door. I have to bring a memo to next month's meeting saying what we actually do and by when — can you write that for me, with a real recommendation, and make it actually deal with that second argument instead of waving it off as missing the point.
