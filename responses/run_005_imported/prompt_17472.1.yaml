prompt: |-
  During my working life I was an experimental physicist studying relaxation phenomena in disordered solids, and a good deal of that work involved thinking carefully about stochastic processes without ever pausing to ask what probability itself actually is. Since retiring I have tried to make up for that omission by reading through the philosophical literature on objective chance, and I have spent the last few weeks with David Lewis's papers on the subject. I believe I have a reasonably secure grasp of the Principal Principle in its original 1980 formulation: that a rational agent's credence in some outcome, conditional on learning the objective chance of that outcome together with whatever else is "admissible" at the time, should simply equal that chance.

  What has brought me to a halt is a difficulty that Lewis raised against this very view -- one he rather memorably dubbed the "big bad bug" and treated at length in his essay "Humean Supervenience Debugged" -- together with the "New Principle" he proposed there in response. As far as I can tell, the trouble arises because Lewis wants chance, like everything else non-fundamental, to supervene on the total Humean mosaic of events, past, present, and future, as summarized by the best system of laws. That seems to leave room for what he calls "undermining" futures: courses of history that have some positive chance of occurring given the present chance distribution, yet which, were they actually to occur, would make it the case that the chances had been different all along. I can sense that something goes wrong here, but every exposition I have found moves quickly into propositions labelled X and T and time-subscripted operators, and I lose the thread of why this amounts to a strict formal inconsistency with the Principal Principle, rather than merely an odd but livable consequence of Humeanism about law. Could you set out, ideally with a small worked example (a coin with some fixed chance of heads, tossed a large but finite number of times, would do nicely), exactly how an undermining future forces a contradiction once the original Principal Principle is applied without qualification? And could you then explain, in similarly plain terms, what the New Principle changes -- what is gained by conditionalizing on an entire theory of chance rather than on the bare chance proposition -- along with your own assessment of whether this amounts to a genuine dissolution of the difficulty, or merely a more sophisticated way of relocating it?
reasoning: |-
  Okay, the user is a retired experimental physicist who worked on stochastic processes in disordered solids. They've been diving into the philosophy of probability, specifically David Lewis's work on objective chance. They understand the Principal Principle but are stuck on the "big bad bug" problem and the New Principle. 

  First, I need to unpack why undermining futures create a contradiction. The user wants a concrete example, so I'll use a simple coin toss scenario. Let's say a coin with 50% chance of heads is tossed 1000 times. An undermining future would be one where the actual frequency is 75% heads, making the best system assign a different chance. 

  The contradiction arises when applying the Principal Principle naively. If an agent learns the true chance is 50%, but also considers a future where frequency is 75% (which has positive chance), their credence in that future should be 50% per PP. But if that future happens, the chance wasn't 50% after all. So the agent is forced to have credence in something that would invalidate the chance they just conditioned on. 

  For the New Principle, I'll explain how conditioning on the entire chance theory T (not just the chance value) avoids this. In the example, T specifies that the chance is defined by the best system, which depends on the entire history. So when conditionalizing on T, the agent knows that if the undermining future occurs, the chance wasn't really 50% to begin with. 

  The user is clearly very precise (physicist background) so I should avoid hand-waving. They want the formal contradiction laid bare, but without excessive notation. I'll use their coin example throughout. 

  For my assessment: the New Principle works mathematically but feels like a technical fix. The deeper issue remains that chances aren't fundamental in Humeanism. The user might appreciate this nuance - they're comfortable with "odd but livable" consequences but want to know if this is more serious. 

  Their underlying concern seems to be whether Humeanism can support objective chance at all. I should acknowledge that while the New Principle resolves the formal contradiction, it doesn't make the metaphysics less puzzling. A physicist might find this unsatisfying compared to how probability operates in statistical mechanics. 

  I'll emphasize that the fix works formally but leaves philosophical discomfort about chance being "second-class." That seems honest and addresses their request for my assessment. The tone should respect their expertise while guiding them through the philosophical thicket.
answer: |-
  Your grasp of the issue is excellent! Let's break down the "big bad bug" and the New Principle using your coin toss example, avoiding excessive formalism.

  **The Setup: Humean Chance & Undermining Futures**

  1.  **Humean Supervenience (HS):** Chances aren't fundamental. They supervene on the total pattern of particular events (past, present, *and future*) throughout spacetime (the "Humean mosaic"). The "chance" of heads is just whatever probability value gets picked out by the *Best System* (BS) of laws. The BS maximizes strength and simplicity, given the *entire* mosaic.
  2.  **The Coin:** Consider a coin that is *actually* fair *according to the BS based on the entire history of the universe*. Its objective chance *P(H)* of heads on any single toss is 0.5. We'll toss it *N* times, where *N* is very large (say, 1,000,000).
  3.  **Undermining Future (UF):** Define a specific future outcome sequence *UF*: it results in *exactly 750,000 heads and 250,000 tails*. This is a very *atypical* outcome for a fair coin.
  4.  **Why is *UF* Undermining?**
      *   Given the *actual* chance law *P(H)=0.5*, the *chance of UF occurring* is small but *positive*: *P(UF) = (0.5)^1,000,000 \* \binom{1,000,000}{750,000} > 0*.
      *   However, if *UF actually occurred* (750k heads, 250k tails), would the Best System still say *P(H)=0.5*? Almost certainly *not*. A system positing *P(H)=0.75* would fit this specific sequence *much better* (it would be much stronger/simpler *for this mosaic*) than a system insisting *P(H)=0.5* in the face of such extreme deviation. The actual chance law *P(H)=0.5* depends on the *overall* mosaic having roughly 50% heads; *UF* itself constitutes strong evidence *against* that overall mosaic existing. *UF* "undermines" the very chance law that assigned it a positive probability.

  **The Big Bad Bug: Contradiction with the Principal Principle (PP)**

  Assume the original PP: A rational initial credence *Cr* should satisfy:
      *Cr(A | P(A) = x \wedge E) = x*
  where *E* is any "admissible" proposition (roughly, historical or logical information not sneakily about the future).

  1.  **The Agent's Situation:** At time *t* (before any tosses), a rational agent knows:
      *   The *current* objective chance: *P(H) = 0.5*.
      *   *UF* is a logically possible future.
      *   Admissible information *E_t* (e.g., the coin's physical description, past tosses if any, logic, math).
  2.  **Apply PP to UF:** What should the agent's credence be that *UF* will happen, given what they know?
      According to PP:
      *Cr(UF | P(UF) = p \wedge E_t) = p*
      We know *P(UF) = p > 0* (a small positive number calculated from *P(H)=0.5* and the binomial formula).
      Therefore, the agent *must* have: *Cr(UF | P(H)=0.5 \wedge E_t) = p > 0*.
      The agent must have some positive credence that *UF* will occur.
  3.  **The Contradiction:** Now consider the proposition: *"The chance of heads is 0.5"*. Call this proposition *Ch*.
      *   *UF* entails that the *actual overall mosaic* has only 75% heads.
      *   *UF* entails that the Best System *does not* say *P(H)=0.5*. The Best System says *P(H)=0.75*.
      *   Therefore, *UF* entails *~Ch* (not *Ch*). If *UF* happens, then *P(H)* was never *really* 0.5 all along.
  4.  **The Conflict:** The agent knows *Ch* is true *now* (*P(H)=0.5*). They condition their belief on *Ch*. PP then forces them to have *Cr(UF | Ch) = p > 0*.
      But *UF* logically implies *~Ch*. The agent knows this logical relationship.
      Therefore, the agent is forced by PP to have: *Cr(UF | Ch) > 0* AND *Cr(UF → ~Ch | Ch) = 1*.
      This seems coherent *formally* at this point. The bug bites when we consider the agent's credence in *Ch itself* conditional on *UF* happening.
      *   The agent knows *UF* → *~Ch*. So, *Cr(Ch | UF) = 0*.
      *   But recall the agent's *unconditional* initial credence in *Ch*. By the law of total probability (considering *UF* and *~UF*):
          *Cr(Ch) = Cr(Ch | UF) \* Cr(UF) + Cr(Ch | ~UF) \* Cr(~UF)*
      *   Plugging in what we know:
          *Cr(Ch) = 0 \* Cr(UF) + Cr(Ch | ~UF) \* Cr(~UF)*
          *Cr(Ch) = Cr(Ch | ~UF) \* Cr(~UF)*
      *   Since *Cr(Ch | ~UF)* ≤ 1 and *Cr(~UF)* < 1 (because *Cr(UF) = p > 0*), it follows that:
          *Cr(Ch) < 1*
      **The Contradiction:** The agent *knows Ch is true*! They have conditioned everything on *Ch*. They are certain of *Ch*: *Cr(Ch | Ch) = 1*. Yet, the application of PP to the undermining future *UF*, combined with the logical connection between *UF* and *~Ch*, forces the agent to have an initial credence in *Ch* that is *less than 1*, even *after* conditioning on *Ch*. This is the inconsistency: PP, applied naively within HS, prevents an agent who *knows* the chance *Ch* from being fully certain of the truth they know.

  **The New Principle (NP): The Proposed Fix**

  Lewis's solution is to conditionalize not just on the specific chance value *P(A)=x*, but on the *entire correct theory of chance T*. *T* specifies how chances depend on the Humean mosaic via the Best System. *T* tells you *what the chances would be* given *any* possible total mosaic.

  The New Principle states:
      *Cr(A | T \wedge E) = P(A | T)*
      *(Where P(A | T) is the chance of A, as given by the theory T itself)*.

  **How NP Resolves the Bug (Using the Coin Example)**

  1.  **Condition on T, not just Ch:** The agent now conditions on *T* (the complete true chance theory), not just *Ch* (*P(H)=0.5*). *T* encodes the Humean recipe: "Chances are whatever the Best System says they are, given the *whole* mosaic."
  2.  **Chance of UF given T:** What is *P(UF | T)*?
      *   *T* says: "The chance of any event *A* is defined by the Best System given the *actual whole mosaic*."
      *   Crucially, *P(UF | T)* is *not* simply the binomial probability calculated assuming *P(H)=0.5*.
      *   *P(UF | T)* is the chance *T* assigns to *UF* *given that T is the true chance theory*. But *T* being true *depends* on the overall mosaic not looking like *UF*! If *UF* occurred, *T* wouldn't be true.
      *   Specifically: *P(UF | T) = P(UF \wedge T) / P(T)* (by definition of conditional probability).
      *   *UF* entails *~T* (because if *UF* happened, the Best System wouldn't be *T*, it would be a system saying *P(H)=0.75*). Therefore, *UF \wedge T* is logically impossible. So *P(UF \wedge T) = 0*.
      *   Therefore: *P(UF | T) = 0 / P(T) = 0*.
  3.  **Apply NP to UF:** The agent's credence should be:
      *Cr(UF | T \wedge E_t) = P(UF | T) = 0*.
  4.  **No Contradiction:** The agent, knowing the true chance theory *T*, now has *Cr(UF | T) = 0*. They have *zero* credence in the undermining future *UF*.
      *   This aligns perfectly with the logical fact that *UF* is incompatible with *T* being true.
      *   There is no longer any positive credence in a future that would undermine *T*, so the previous contradiction vanishes. The agent can be certain of *T* (*Cr(T | T) = 1*) without the law of total probability generating a value less than 1, because *Cr(UF | T) = 0*.

  **What's Gained and the Assessment**

  1.  **What's Gained:** NP formally resolves the logical contradiction. It ensures that an agent who knows the *true, complete chance theory T* does not assign positive credence to futures (*UF*) that are logically incompatible with *T* being true. It makes credence align with the *modal fragility* of Humean chance: chances depend on the whole mosaic, so futures that would change the Best System are not "on the table" as possibilities consistent with *T*.
  2.  **Assessment: Genuine Dissolution or Sophisticated Relocation?**
      *   **Formal Success:** NP undeniably solves the *mathematical inconsistency*. It makes PP compatible with HS. Lewis achieved his debug goal.
      *   **Philosophical Cost - Relocation:** Many argue the cost is high and the core unease remains, just relocated:
          *   **"Chance" in NP is Thin:** *P(A | T)* feels like a pseudo-chance. *T* is a giant, contingent fact about the *actual* mosaic. *P(A | T)* tells you the chance *A* has *according to the system that wins in the actual world*. But does this capture the *modal force* or *guidance* we expect from objective chance? It tells you what to believe *if* the actual world is such that *T* wins, but doesn't ground *why* that should constrain belief about *this* world in a fundamentally different way than any other contingent fact. The "bite" of chance seems diminished.
          *   **Accessibility:** Knowing the *entire true theory of chance T* is an immense, arguably impossible requirement for rational agents. The original PP seemed applicable with limited knowledge (just *P(A)=x*). NP requires near-omniscience about the fundamental metaphysical structure (the Best System) to be usable. While one can use approximations, the principle itself demands *T*.
          *   **Circularity Worry:** Some feel defining rational credence using *P(A | T)*, where *T itself* is defined in terms of fit with frequencies (which depend on credences guided by chances...) risks circularity. Defenders argue it's a virtuous, holistically justifiable circle.
          *   **The Oddness Remains:** While consistent, the consequence that *Cr(UF | T) = 0* even though *UF* has a straightforwardly calculable positive probability *if you temporarily assume P(H)=0.5* (the very chance *T* says is true!), still feels deeply strange. It highlights the core weirdness of Humean chance: its dependence on the future. NP prevents contradiction by essentially declaring "You can't consistently assume *T* and also seriously consider futures where *T* is false," which is logically sound but ontologically jarring.

  **Conclusion**

  You've perfectly identified the core tension: Humean chance supervenes on the *entire* mosaic, including the future, creating undermining futures that have positive chance but whose occurrence would falsify the chance law itself. This *does* lead to a strict formal contradiction with the original Principal Principle (PP), as shown by the forced credence *Cr(Ch) < 1* even when conditioning on *Ch*.

  Lewis's New Principle (NP) resolves this contradiction by requiring agents to conditionalize on the *entire chance theory T*. This sets the credence in any undermining future *UF* to zero (*Cr(UF | T) = P(UF | T) = 0*), as *UF* is incompatible with *T*, preventing the credence-draining calculation.

  NP is a successful *formal* debug of Humean Supervenience. However, it arguably relocates the philosophical difficulty. It grounds chance firmly within the contingent Best System, potentially thinning its normative force and making its application require near-omniscience. The strangeness of zero credence in futures calculable as "possible" under the chance law you know, highlights the persistent counterintuitiveness of grounding chance entirely in actual patterns. Whether this is a livable consequence or a fatal flaw remains a central debate in the metaphysics of chance. As someone steeped in stochastic processes, you might find the "thinness" of NP-chance particularly striking compared to the role probability plays in physical theory. Lewis provided a consistent framework, but the metaphysical unease persists.
