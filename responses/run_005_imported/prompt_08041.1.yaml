answer: |-
  Here's a sustained argument for the thesis that Gibbard's hyperplan solution to Frege-Geach, by achieving logical parity with cognitivism via possible-worlds semantics, fundamentally surrenders the core theoretical advantages that originally motivated expressivism, rendering it a notational variant of deflationary cognitivism:

  1.  **Expressivism's Core Promise vs. Cognitivism:** The original *raison d'être* of expressivism (like emotivism, prescriptivism) was to offer a metaphysically and epistemologically *lighter* account of moral discourse than cognitivism (realism or error theory). Its key advantages were:
      *   **Metaphysical Parsimony:** Avoidance of ontologically queer moral facts/properties. Moral judgments aren't truth-apt representations of a moral reality; they are expressions of non-cognitive attitudes (emotions, commitments, prescriptions).
      *   **Explanatory Power for Motivation:** The "internalism" intuition. Moral judgments *necessarily* motivate (or are intrinsically linked to motivation) because they *are* (or express) conative states, not inert beliefs about abstract facts.
      *   **Semantic Distinctiveness:** Moral language functions differently – its primary job isn't to describe the world but to express attitudes and influence action/attitudes.

  2.  **The Frege-Geach Problem as the Threat:** The problem exposed that early expressivism couldn't account for the *logical behavior* of embedded moral terms (negation, conditionals, disjunctions) without collapsing into inconsistency or losing its distinctive character. The challenge was to explain validity and inconsistency in purely expressivist terms without smuggling in truth-conditions.

  3.  **Gibbard's Hyperplan Solution: Mimicking Truth-Conditions:** Gibbard's ingenious move is to "fatten" the object of the planning attitude. Instead of expressing a simple attitude like "Boo to lying!", judging "Lying is wrong" expresses *acceptance of a hyperplan* that forbids lying in all relevant circumstances. Crucially:
      *   Hyperplans are *maximally specific contingent plans*. They cover every conceivable situation and dictate a specific course of action.
      *   This maximal specificity allows hyperplans to function *logically* like **possible worlds**. Just as a descriptive proposition divides possible worlds into those where it's true and those where it's false, a normative sentence divides hyperplans into those that *permit* it and those that *forbid* it.
      *   Logical operators are then defined purely in terms of sets of hyperplans: Negation corresponds to the *complement* set of hyperplans. A conditional "If P, then Q" corresponds to the set of hyperplans that either *don't* permit P *or* do permit Q. Validity is defined as the *inconsistency* (empty intersection) of accepting the premises while rejecting the conclusion, modeled by the empty set of hyperplans satisfying that combination.

  4.  **The Collapse into Minimalism/Deflationary Cognitivism:** Precisely *because* this solution successfully mimics the possible-worlds semantics of truth-conditional content for normative sentences, it sacrifices expressivism's core advantages:
      *   **Loss of Metaphysical Parsimony:** While hyperplans are *plans*, not abstract facts, the *logical role* they play is identical to that of truth-makers or states of affairs. The property "being forbidden by hyperplan H" plays the *exact same structural role* in Gibbard's semantics as "being made true by world W" plays in descriptivist semantics. The attitude of "plan-laden acceptance" towards a hyperplan-content plays the *exact same structural role* as "belief" plays towards a proposition. The ontology of hyperplans, while perhaps psychologically grounded, becomes functionally equivalent to a realm of normative facts for the purpose of semantic explanation. The distinctive metaphysical lightness vanishes; we have a *plan-based ontology* doing the work of a *fact-based ontology*.
      *   **Erosion of the Motivation Explanation:** If judging "Lying is wrong" is *accepting a hyperplan-content* (a complex abstract object), what guarantees the motivational force? Gibbard must build motivation *into the attitude* of "plan-laden acceptance." But this attitude now looks suspiciously like a *cognitive* attitude towards a plan-proposition. The tight, necessary connection between the judgment *itself* (as a non-cognitive state) and motivation is severed. Motivation becomes a *contingent* feature of the *attitude* directed at the content, not an intrinsic feature of the judgment *as* an expression. This weakens the expressivist explanation of internalism.
      *   **Loss of Semantic Distinctiveness:** The semantics for normative language becomes formally identical to descriptivist semantics, merely swapping "possible world" for "hyperplan" and "truth" for "permissibility according to the plan." The meaning of a normative sentence *is* its hyperplan-content, and logical relations are defined solely over these contents. The *expressive* function – the idea that the primary job of "wrong" is to express condemnation – is relegated to a pragmatic add-on or built into the *label* "hyperplan" rather than being the core semantic engine. The semantics is now fundamentally *representational*: sentences represent which hyperplans permit/forbid what.

  5.  **Contrast with Alternatives (Highlighting Gibbard's Concession):** The collapse becomes stark when comparing Gibbard's approach to other expressivist strategies that *resist* full truth-conditional mimicry:
      *   **Blackburn's Quasi-Realism (Tree Structures):** Blackburn explicitly avoids positing distinct normative contents. He analyzes complex embeddings via structures of higher-order attitudes. Judging "If lying is wrong, then getting your little brother to lie is wrong" expresses a *higher-order attitude* of tolerance: a commitment not to condemn lying while condoning getting your brother to lie. Validity is explained by the *practical inconsistency* of certain combinations of attitudes, not by the empty intersection of content-bearers. This preserves a focus on the *attitudes themselves* as the core semantic element, maintaining a clearer distinction from cognitivist semantics (though facing other challenges). Gibbard, by contrast, locates the logical work entirely within the *content* (hyperplan-sets), making attitudes secondary.
      *   **Schroeder's "Being For" (Attitude-Content Hybrid):** Schroeder's early proposal aimed for a *single, uniform attitude* ("being for") directed at *non-normative* contents. "Wrong(lying)" might express *being for blaming for lying*. Embeddings are handled by the attitude being directed at complex contents involving logical operators (e.g., "being for (blaming for lying → blaming for brother-lying)"). While this also uses complex contents, it crucially maintains a *single, distinctive type of conative attitude* as the core expressive element, and the contents are built from *descriptive* materials (blaming, doing). Gibbard's hyperplans, however, are *intrinsically normative* objects (they *are* plans), and the attitude ("acceptance") is functionally cognitive. Schroeder's later work explicitly *rejects* Gibbard's approach precisely because it collapses into minimalism.

  6.  **The Core Argument Summarized:** Gibbard's hyperplan solution succeeds in solving Frege-Geach *only by* constructing normative contents that are isomorphic to truth-conditional propositions in their logical behavior. This isomorphism necessitates:
      *   An ontology of hyperplans playing the role of truth-makers.
      *   An attitude ("acceptance") playing the role of belief.
      *   A semantics where meaning is entirely determined by representational content (permissibility conditions across hyperplans).
      *   A definition of validity based on inconsistency of content-acceptance, not practical inconsistency of distinct attitudes.

  **Therefore, the very machinery that solves the logical problem dismantles expressivism's core theoretical advantages.** The metaphysical lightness is replaced by a plan-based ontology. The necessary link to motivation is severed or made contingent on the attitude. The distinctive, non-representational semantics is replaced by a representational one using a different label ("hyperplan-permissibility" instead of "truth"). What remains is a *deflationary cognitivism*: normative sentences express beliefs about what our maximally specific plans dictate, and these beliefs can be true or false relative to those plans. The label "expressivism" persists, but the substance – the theoretical edge over cognitivism concerning metaphysics, motivation, and semantic function – is lost. Gibbard achieves logical coherence at the cost of expressivist identity.
