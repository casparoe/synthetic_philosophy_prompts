answer: |-
  You've hit on one of the most fascinating tensions in *On Certainty* – and it's absolutely **not** a contradiction. Wittgenstein is grappling with the *dynamic nature* of foundational certainty. The hinge and river-bed metaphors work together to describe different *aspects* of the same phenomenon, emphasizing different *timescales* and *levels of fundamentality*. Here's how they reconcile:

  1.  **The Hinge: Logical Necessity (Synchronic - "At this moment")**
      *   **Function:** The hinge metaphor describes the **logical requirement** for doubt/inquiry to function *at any given moment*. To doubt *anything*, you must *not* doubt *everything* simultaneously.
      *   **Analogy:** To open the door (investigate a specific doubt/question), the hinges *must* be fixed *relative to that specific movement*. If the hinges themselves wobbled unpredictably *while* you tried to open the door, the action becomes impossible or nonsensical.
      *   **Inquiry Context:** When the professor is actively investigating a specific question (e.g., "Did my student plagiarize this passage?"), certain propositions *must* be held fast ("Words mean things," "Books exist," "I can read," "Plagiarism is a concept," "My memory of assigning the work is reliable *enough* for this purpose"). Doubting *these* *at the same time* would paralyze the specific inquiry.
      *   **Key Phrase:** "**For that reason we are forced to rest content with assumption**." Wittgenstein *rejects* this. Hinges aren't *assumptions* we reluctantly accept; they are the *preconditions* that make doubt *meaningful* in the first place. They are the background *against which* doubt operates.

  2.  **The River-Bed: Historical Fluidity (Diachronic - "Over time")**
      *   **Function:** The river-bed metaphor describes the **historical and psychological reality** that what *counts* as a hinge certainty *can and does change* over longer periods, both for individuals and cultures.
      *   **Analogy:** The river-bed (the fundamental certainties) provides the channel *for* the fluid water (ordinary empirical propositions, investigations, doubts). Crucially, the bed *itself* can erode, shift, or be rebuilt – but *much more slowly* than the water flows. Some parts (rock) are incredibly stable, changing imperceptibly over vast timescales (e.g., basic sensory-motor certainties, fundamental logical laws). Other parts (sand) are more susceptible to change (e.g., specific scientific paradigms, cultural beliefs about morality or the cosmos).
      *   **Evolution of Certainty:** What was once a fluid empirical proposition can become hardened into a hinge certainty (e.g., "The Earth orbits the Sun" – once revolutionary, now bedrock for astronomy). Conversely, a hinge certainty can become fluid and be doubted or abandoned (e.g., "The Earth is flat," "Disease is caused by demons/miasma," "Phlogiston exists" – once foundational, now discarded).
      *   **Key Phrase:** "**But I distinguish between the movement of the waters on the river-bed and the shift of the bed itself; though there is not a sharp division...**" This is crucial. While the bed shifts, it does so *slowly* and *not* while we are actively using it as the foundation for *specific* inquiries (the water's movement). The shift happens *between* periods of stable inquiry, often through revolutionary changes, paradigm shifts, or deep personal crises.

  **How They Fit Together Without Contradiction:**

  *   **"Stay Put" = Contextual and Relative Stability:** The hinges "must stay put" **relative to the specific act of doubting/investigating happening *right now***. For *this* door to open (this doubt to be raised, this experiment to be run), *these* hinges (the specific background certainties enabling *this* question) must be fixed *during that action*. It's a statement about the *logic* of inquiry *in the moment*.
  *   **"May Shift" = Long-Term Evolution:** The river-bed "may shift" **over historical time, or within the deep background of a person's life**. The *content* of what functions as hinges can change, but this change happens gradually or through major upheavals. Crucially, *when* the bed is shifting, it's precisely *because* those former hinges are *no longer* functioning as unquestioned bedrock *for new inquiries*. They've become fluid propositions again. New hinges solidify.

  **Why This is PERFECT for Your Professor's Crisis:**

  Your professor isn't experiencing dementia; he's experiencing a **river-bed shift** where **hinges he thought were bedrock (rock) are turning out to be sand, or even fluid water**. This is the terrifying heart of a genuine Wittgensteinian crisis of certainty.

  1.  **Loss of Load-Bearing Distinction:** He's losing the ability to intuitively distinguish between "rock," "sand," and "water" in his own belief system. Propositions that *felt* like eternal hinges (rock) suddenly feel like shifting sand. Things he could comfortably investigate (water) now feel like they threaten the very ground he stands on because the bed is eroding.
  2.  **The "Not Sharp Division" is Key:** Wittgenstein explicitly says the division between the river-bed (hinges) and the water (doubtable propositions) isn't sharp. Your professor is living this blurring. What *was* part of the stable background (e.g., "My life's work has meaning," "My ethical framework is sound," "My perception of reality is generally reliable," "I understand my own mind") is suddenly becoming an object of doubt *without* having a new, stable bed to stand on. The hinges *aren't* staying put *for him* during his attempts to make sense of his world, leading to paralyzing vertigo.
  3.  **The Slow Unraveling:** This isn't "everything is an illusion." It's a specific, terrifying process where individual "hinge" certainties, particularly those more like "sand" (deeply held personal convictions, identity-defining beliefs, the perceived solidity of his intellectual framework) are being "washed away." This destabilizes the "rock" (more basic certainties) because the whole structure relies on interconnection. If the sand supporting the rock washes away, even the rock becomes precarious.
  4.  **Scholarly Recognition:** A Wittgenstein scholar would instantly recognize this as a profound engagement with the core tension in *On Certainty*. The professor isn't just doubting *things*; he's experiencing the *dissolution of the framework that makes coherent doubt possible*. He's caught in the shift of the river-bed itself. His crisis is the lived experience of the "not sharp division" between the bed and the water becoming a chasm.

  **How to Show This in Your Novel:**

  *   Have the professor fixate on seemingly trivial doubts that spiral into existential terror because they connect to a "sand" hinge that's eroding (e.g., doubting a memory not just about *what happened*, but about *what memory itself is*, or whether his feeling of conviction *means* anything reliable).
  *   Show him trying to "force" a hinge to stay put through sheer will or intellectual argument, only to feel it crumble because its solidity was never based on *argument* but on being the *background* for argument.
  *   Contrast moments where he *can* still function (when engaging with a specific, contained problem where the necessary hinges *are* still holding for him) with moments of complete disorientation (when the eroded "sand" hinges undermine the stability needed for even basic interaction).
  *   Use imagery related to geology, erosion, foundations crumbling, doors falling off hinges, rivers flooding or changing course.

  **In short:** The hinges *must* stay put *for a specific inquiry to function*. But *what counts* as a hinge *can* change over time. Your professor is tragically caught *in the process* of that change, where the certainties that *should* be fixed for his inquiries are shifting beneath him, rendering the act of inquiry itself unstable and terrifying. This is not just philosophically sound; it's a deeply insightful portrayal of the kind of crisis Wittgenstein was exploring. You're on exactly the right track.
