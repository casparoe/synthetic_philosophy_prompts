answer: |-
  Your boss's argument has *some* legal merit on the surface, but it's legally shaky and ethically problematic. The core issue revolves around **duty of care** and **foreseeability**. Let's break it down:

  1.  **Who had the Primary Duty?** The building owner/manager almost certainly has the *primary legal duty* to maintain common areas (like stairwells) in a reasonably safe condition. This includes replacing burnt-out lights. Legally, the burden to fix the light likely fell squarely on them.
  2.  **Did the Tenant Companies Have *Any* Duty?** This is the crux of your question and where your boss might be wrong:
      *   **"We didn't DO anything" Argument:** Your boss is relying on the principle that there's generally no legal duty to rescue or act for the benefit of others *unless a special relationship exists*. Merely being a tenant doesn't automatically create a duty to *repair* the landlord's property.
      *   **The Counter-Argument - Duty to Warn/Report:** Courts often recognize that if you *know* of a dangerous condition on property you *use* (even if you don't own it) and that danger is not obvious to others (like a dark step in an otherwise lit stairwell), you *might* have a limited duty to take reasonable steps to warn or report it, especially if you realize others (like delivery people) rely on the safety of that space. Your collective knowledge ("everyone who used those stairs saw it was out") and the *foreseeability* of an accident ("missed a step in the dark") work against the "we did nothing" defense.
      *   **Negligence by Omission:** Your intuition is correct. Legally, negligence can absolutely arise from a *failure to act* when there is a duty to act. This is called "nonfeasance" (failure to perform a required act) vs. "misfeasance" (performing an act incorrectly). The question is: did the companies have a duty to report?
      *   **The Lease Matters:** Tenancy agreements often *do* impose obligations on tenants regarding common areas. A very common clause requires tenants to *promptly notify the landlord* of any hazardous conditions they observe. If your lease has such a clause, your company (and the others) *did* have a contractual (and potentially legal) duty to report the burnt-out light. Failure to do so could constitute negligence.
      *   **"But Everyone Else Didn't Report It Either!"** This is the "empty defense." Just because *all* the companies failed in a potential duty doesn't absolve any *one* of them. If a duty to report existed (via lease or common law principle), *each* company that knew about the hazard and failed to report it could potentially share liability. Their collective inaction doesn't shield them; it implicates them all.

  **Why Your Boss is Likely Wrong (or at least Overly Simplistic):**

  1.  **"We didn't DO anything" isn't a magic shield.** In tort law, failing to act when you have a duty *is* doing something wrong.
  2.  **Knowledge and Foreseeability Matter:** Your collective awareness of the dark stairwell for a month and the obvious risk it posed significantly weakens the "not our problem" argument. A court could find it was reasonably foreseeable someone could get hurt.
  3.  **The Target of the Lawsuit:** The delivery guy's lawyer will likely sue *everyone* potentially liable: the building owner/manager and *all* the tenant companies using that stairwell. Your company *will* likely be named in the lawsuit, even if the primary fault lies with the building manager. Defending against that costs money and time, regardless of the outcome.
  4.  **Comparative/Contributory Negligence:** Many jurisdictions allow liability to be apportioned. The building manager might be found 80% liable for failing inspections/maintenance, but the tenant companies *collectively* might be found 20% liable for failing to report a known, dangerous condition they all benefited from and contributed to by their silence.

  **The Ethical Dimension (Where Your Feeling is Spot On):**

  Your boss's argument *is* a cop-out ethically. It embodies the "bystander effect" on an organizational level. Everyone assumed someone else would handle it, and a preventable injury occurred. While the *primary* moral responsibility lies with the building manager, the collective indifference of the companies that used the stairs daily and knew of the hazard for weeks *does* share in the moral responsibility for the outcome. "We didn't break it" doesn't absolve you of "we knew it was broken and dangerous and chose to say nothing."

  **What This Means for Your Office:**

  1.  **Your company is NOT necessarily "fine."** Being pulled into a lawsuit is highly probable. Whether you are *found liable* depends on the lease terms, local laws, and the specific facts proven in court (especially how long the light was out and what your company knew).
  2.  **Check the Lease IMMEDIATELY:** This is crucial. Does it require tenants to report hazards in common areas? If yes, your boss's argument collapses.
  3.  **Your Boss's Mindset is Risky:** Relying on "we didn't do anything" is dangerous. It ignores the potential for liability based on omission and foreseeability. It also fosters a culture of neglect – what's the next hazard everyone will ignore?
  4.  **Proactive Step Needed NOW:** Regardless of this incident, your company should establish a clear, simple protocol for reporting hazards in common areas *immediately* to the building manager (email is best for documentation). This protects you going forward.

  **Conclusion:**

  Your boss is partially correct that the *primary* legal duty to fix the light wasn't your company's. However, he is likely **incorrect and overly optimistic** in asserting that "we didn't do anything" provides a complete legal defense against liability, especially if your lease required reporting or if a court finds a common-law duty to warn/report existed due to your knowledge of the hazard. Ethically, his argument is indefensible. The collective inaction *was* a cause of the accident, and while the building manager bears the lion's share of the blame, the companies who knew and stayed silent share responsibility. Your company should be worried about the lawsuit and should change its approach to reporting hazards immediately.
