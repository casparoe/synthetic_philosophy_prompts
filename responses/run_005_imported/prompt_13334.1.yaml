  I think the strongest position is that coherence is necessary but not sufficient for the kind of goal-directedness that's dangerous. We need to look beyond coherence to things like how preferences are formed, how values are learned from limited data, and the pressures of efficient computation. The coherence arguments provide important constraints, but they're not the whole story.

