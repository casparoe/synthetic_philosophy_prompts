  Alternatively, it might learn two features: [2,0] and [0,2] but then for the (-1,-1) and (-1,1) it would use negative activations of these features? But [2,0] and [0,2] are not orthogonal to [-2,0] and [0,-2].

  Or it might learn features that are [1,0] and [0,1] scaled.

  But note that the data points in (h1,h2) space are on the axes: (2,0), (0,2), (0,-2), (-2,0). 

  So the autoencoder might learn two features: 
    feature1: [2,0] and feature2: [0,2] -> then for (2,0) we use feature1 with coefficient 1.
              for (0,2) we use feature2 with coefficient 1.
              for (0,-2) we use feature2 with coefficient -1.
              for (-2,0) we use feature1 with coefficient -1.

  This is sparse: only one feature active per sample (with a signed activation).

  Alternatively, it might learn two features that are rotated, say [1,1] and [1,-1]. Then:

    for (2,0): a*[1,1] + b*[1,-1] = (a+b, a-b) = (2,0) -> a+b=2, a-b=0 -> a=1, b=1.
    for (0,2): a+b=0, a-b=2 -> a=1, b=-1.
    for (0,-2): a+b=0, a-b=-2 -> a=-1, b=1.
    for (-2,0): a+b=-2, a-b=0 -> a=-1, b=-1.

  So we need both features active for each sample, so it's not sparse.

  Therefore, the sparse autoencoder will prefer the first basis ([2,0] and [0,2]) because it only requires one active feature per sample.

  In this basis, the features correspond to: 
    feature1: the event (A=1 and B=1) OR (A=-1 and B=-1) [because it is active for (2,0) and (-2,0)] -> which is A*B=1.
    feature2: the event (A=1 and B=-1) OR (A=-1 and B=1) [active for (0,2) and (0,-2)] -> which is A*B=-1.

   But wait, in this basis, feature1 is active (with positive or negative) for the cases where A*B=1, and feature2 for A*B=-1.

   However, note that the autoencoder doesn't know the labels. It only sees the activations.

   But now, we can imagine training a different autoencoder with a different random seed that learns a different basis: for example, it might learn [2,0] and [0,-2] as the features. Then:

    feature1: [2,0] -> active for (2,0)
    feature2: [0,-2] -> active for (0,-2)

   Then how to represent (0,2)? We would need to use -1 * [0,-2] = [0,2]. Similarly, (-2,0) would be -1 * [2,0] = [-2,0].

   So it's the same as before, just swapping signs.

   But in this case, the interpretation would be:

    feature1: (A=1 and B=1) OR (A=-1 and B=-1) [because active for (2,0) and for (-2,0) by using negative activation]
    feature2: (A=-1 and B=1) OR (A=1 and B=-1) [active for (0,2) by using negative activation of feature2? wait]

   Let's see:

    For (0,2): we use feature2 with coefficient -1 -> because -1 * [0,-2] = [0,2].
    For (0,-2): we use feature2 with coefficient 1 -> [0,-2].

   So feature2 is active in both (0,2) and (0,-2) but with different signs.

   So the interpretation of feature2 is not a single concept but two concepts with opposite signs.

   Alternatively, we might interpret it as feature2 being the concept of "B is positive when A is negative" and "B is negative when A is positive", but that's not one concept.

   So the autoencoder in the first run might give you features that cleanly map to A*B=1 and A*B=-1, while in the second run it might give you features that are mixtures of the examples.

   However, note that in both cases, the features are spanning the space and are linearly dependent on the original basis.

   To have a head-on disagreement, we need two different sets of features that are not linearly related.

   How about if the autoencoder is allowed more features than the dimension? For example, dictionary size 4.

   In the first run, it might learn four features: [2,0], [0,2], [0,-2], [-2,0] -> each corresponding to one input example.

   In the second run, it might learn four features that are rotated or something.

   But we want a contradiction.

   Let me try to have a network where the hidden layer activations are the same for two different input examples, but in a way that forces the autoencoder to choose which concept to assign.

   But that would be a degenerate representation.

   Alternatively, let's create a representation that is a superposition of two concepts with the same vector.

   Example: 
     We have a network with one hidden neuron.
     Input: two binary features A, B (0 or 1).
     Task: output A AND B.

     Then the hidden neuron might be: h = 0.5 * A + 0.5 * B.

     Then for (A=0,B=0): h=0
     (A=0,B=1): h=0.5
     (A=1,B=0): h=0.5
     (A=1,B=1): h=1

     Then the output neuron: if h>0.75, output 1, else output 0. 
     But then (1,1) would be 1, others 0.5<0.75 -> 0.

     So it works.

     Now, the hidden layer has only one neuron.

     We then train a sparse autoencoder to reconstruct h from a sparse code, with dictionary size 2.

     The autoencoder might learn two features: 
          feature1: active for (A=1,B=0) and (A=1,B=1) -> which is "A=1"
          feature2: active for (A=0,B=1) and (A=1,B=1) -> which is "B=1"

     Then for (A=1,B=0): we use feature1 with coefficient 0.5.
     for (A=0,B=1): feature2 with coefficient 0.5.
     for (A=1,B=1): both features with coefficient 0.5.

     But then the reconstruction is: for (1,0): 0.5 * feature1 = 0.5, which matches.
          for (0,1): 0.5 * feature2 = 0.5.
          for (1,1): 0.5+0.5=1.

     Alternatively, the autoencoder might learn two other features:
          feature1: active for (A=1,B=1) with value 1.0
          feature2: active for (A=1,B=0) and (A=0,B=1) with value 0.5

     Then for (1,0): use feature2 with coefficient 1 -> 0.5.
          for (0,1): feature2 with coefficient 1 -> 0.5.
          for (1,1): feature1 with coefficient 1 -> 1.0.

     This also reconstructs perfectly.

     Now, the head-on disagreement: in the first decomposition, the autoencoder has features that correspond to the input features A and B. In the second decomposition, it has features that correspond to the output of the AND gate for the cases where it is true and where it is half-true? 

     But the second decomposition has one feature for the case (1,1) and one for the cases (1,0) and (0,1). 

     The network's hidden layer does not have a neuron for the AND result; it has a neuron that is intermediate. 

     So if we ask: does the network have a representation for "A=1"? 

          In the first decomposition: yes, there is a feature for it.
          In the second decomposition: no, the features are about the AND result and the or of the two not-quite cases.

     This is a contradiction.

     Moreover, both autoencoders have the same reconstruction loss.

     So which one is the "real" features in the network? 

     The network's neuron is only one number. It is a linear combination of A and B. The two decompositions are just two ways to explain the same number.

     This is the superposition and the basis we choose to interpret it.

     This is similar to the philosophical debate: is the mind (or here, the network) really representing A and B separately, or is it representing the AND directly for (1,1) and then a different thing for the others? 

     In the network, it's simply a weighted sum. The decomposition into features is in the eye of the beholder.

     This toy example is small enough. 

     To connect to philosophy, this is like the debate about whether the mind has atomic concepts or whether our decomposition into concepts is just one of many possible. 

     In particular, Willard Van Orman Quine's thesis of the "indeterminacy of translation" says that there may be multiple equally valid ways to ascribe meanings to the words of a language, and there is no fact of the matter as to which is correct. Similarly, here, there are multiple ways to ascribe features to the activations.

     Daniel Dennett's "real patterns" might say that if a decomposition is predictively useful, then it is real, but here both are equally useful for reconstruction. However, if we care about the task (AND), then the second decomposition might be more directly related to the output. But the autoencoder doesn't know the task.

     So there is no fact of the matter about which set of features is "really" in the network.

     This is the example.
