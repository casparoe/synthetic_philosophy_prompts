prompt: |-
  In my school's decision theory club, we recently covered I. J. Good's well-known theorem that a Bayesian agent's expected utility can never be lowered in expectation by looking at free evidence before acting. Several clubmates took this as settling the question of whether a rational person should always want more information, no matter what. I think that inference moves too fast. Please argue that Good's theorem does not support this general slogan. As your central case, use the phenomenon the economist Jack Hirshleifer identified: the mere existence of sufficiently accurate information can destroy risk-sharing arrangements, like insurance, that would otherwise make everyone better off ex ante, so that a fully rational person can end up worse off simply because such information exists, even if nobody is ever compelled to look at it. Be precise about why this is not a counterexample to Good's proof itself, but rather a case that falls outside what the proof assumes.
reasoning: |-
  We are discussing Good's theorem and its implications. Good's theorem states that for a Bayesian agent, the expected utility of acquiring free evidence (without cost) before making a decision cannot be negative in expectation. That is, the agent expects to be at least as well off (and possibly better) by acquiring the evidence.

   However, the claim that "a rational person should always want more information, no matter what" is an overgeneralization. The central case we will use to challenge this slogan is the phenomenon identified by Jack Hirshleifer: the existence of accurate information can destroy risk-sharing arrangements (like insurance) that would have been beneficial ex ante.

   **Hirshleifer's Argument:**
   Consider a situation where individuals can share risks through insurance contracts. For example, two farmers might agree to share their harvest equally, so that if one has a bad year and the other a good one, they both get an average harvest. This arrangement is beneficial ex ante (before knowing the state of the world) because it reduces the variance of their outcomes without changing the mean, and if they are risk-averse, they prefer the more stable outcome.

   However, suppose that before the harvest, there becomes available a very accurate prediction of the harvest (say, a weather forecast that is highly predictive of crop yields). If this information is available, then the farmers might not be able to sustain the insurance arrangement. Why? Because if one farmer knows that he is going to have a good harvest and the other a bad one, then the one with the good harvest would not want to share. Thus, the insurance contract breaks down. 

   Even if no one actually looks at the forecast, the mere possibility that someone could look at it might make the insurance contract infeasible. In other words, the existence of the information can destroy the insurance market. Without the information, the insurance contract would have been signed and both farmers would have been better off ex ante (in expectation). But with the information existing, the contract may not be signed, and both end up bearing their own risks, which is worse in expectation for risk-averse individuals.

   **Why is this not a counterexample to Good's theorem?**
   Good's theorem applies to a fixed decision problem where the agent is choosing whether to acquire evidence and then make a decision. The theorem assumes that the agent's decision problem remains the same regardless of the evidence acquisition. In particular, it does not account for changes in the strategic environment (i.e., interactions with other agents) or the availability of contracts that depend on the information structure.

   Specifically, in Hirshleifer's scenario:
   - The existence of the information changes the set of available actions (or contracts) that the agents can take. Without the information, an insurance contract is feasible; with the information (even if not acquired), it might not be.
   - Good's theorem considers a single agent who is making a decision in a non-strategic setting. It does not consider how the information structure might affect the behavior of other agents and thus the set of feasible outcomes.

   Therefore, Hirshleifer's scenario falls outside the scope of Good's theorem because:
   1. The theorem assumes that the agent is the only one who might acquire the evidence and that the world state does not change as a result of the evidence being available. But in Hirshleifer's case, the availability of evidence changes the strategic interactions and the set of feasible contracts even if the evidence is not acquired.
   2. The theorem does not account for the possibility that the existence of the evidence might alter the decision problem itself (by removing some options that were previously available).

   **Conclusion:**
   Good's theorem shows that for a fixed decision problem (where the set of available actions and the utility function do not change with the information structure), acquiring free evidence is beneficial in expectation. However, when the availability of information changes the decision problem (for instance, by altering the set of feasible contracts in a multi-agent setting), then it is possible that the existence of such information can make everyone worse off ex ante. Therefore, the theorem does not support the general slogan that "a rational person should always want more information, no matter what" because the theorem's assumptions may not hold in strategic settings with multiple agents and where the information structure affects the available actions.
answer: |-
  To address your query, I'll explain why Good's theorem does not imply that a rational person should always want more information, using Hirshleifer's insight as the central case. I'll clarify why this phenomenon isn't a counterexample to Good's proof but falls outside its assumptions.

  ### Good's Theorem: Core Assumptions
  Good's theorem states that for a Bayesian agent, acquiring free evidence (with no cost) before acting never decreases expected utility in expectation. Formally, if \(E[U(\text{act without evidence})]\) is the baseline expected utility, then:
  \[
  E[E[U(\text{act with evidence}) \mid \text{evidence}]] \geq E[U(\text{act without evidence})].
  \]
  **Key assumptions**:
  1. **Single-agent focus**: The agent operates in isolation; their decision doesn't alter others' behavior or available choices.
  2. **Fixed action set**: The set of possible actions remains unchanged before/after evidence acquisition.
  3. **Passive world**: The world state is unaffected by whether evidence is acquired or exists.

  Hirshleifer's scenario violates these assumptions, showing that Good's theorem doesn't generalize to strategic multi-agent settings where information availability alters the game itself.

  ### Hirshleifer's Phenomenon: How Information Destroys Risk-Sharing
  Consider an insurance market with two risk-averse agents:
  - **Without information**: Agents sign contracts to share risks (e.g., "split losses equally if disaster strikes"). This is mutually beneficial ex ante, as it reduces variance.
  - **With accurate information**: Suppose a test perfectly predicts who will suffer a disaster. Even if no one looks at it:
    - The *existence* of the test makes insurance infeasible.
    - Why? Insurers know high-risk individuals (those likely to suffer disasters) will seek insurance more aggressively, while low-risk individuals opt out. This causes adverse selection, collapsing the market.
    - Result: Both agents are worse off ex ante—they lose the risk-sharing benefits and bear full risk alone.

  **Example**:  
  - Without information: Agents each have 50% chance of a $10,000 loss. Insurance pools risk, costing each $2,500 (fair premium). Expected utility: \(U(-2,500)\).  
  - With test existence: Insurance market collapses. Each faces a 50% chance of losing $10,000. Expected utility: \(0.5U(0) + 0.5U(-10,000)\), which is lower for risk-averse agents.

  ### Why This Isn't a Counterexample to Good's Theorem
  1. **Violates single-agent assumption**:
     - Good's theorem assumes an isolated agent. Here, the agent's utility depends on others' actions (e.g., whether insurers offer contracts). The *existence* of evidence changes others' strategies, altering the action set (e.g., insurance vanishes).
     - Good’s proof doesn’t account for this equilibrium shift.

  2. **Violates fixed action set**:
     - Without information, "buy insurance" is an available action. With information existing, this action disappears due to market collapse. Good’s theorem assumes the same actions remain feasible.

  3. **Violates passive world**:
     - The world (here, the market structure) is endogenously shaped by information availability. Good’s theorem treats the world state as immutable to evidence existence.

  ### Why the Slogan Fails
  Hirshleifer shows that **information can have instrumental value beyond its epistemic content**. Its mere existence can:
  - Destroy cooperative equilibria (e.g., insurance).
  - Alter the set of possible actions (e.g., removing "buy fairly priced insurance").
  - Create Pareto-worse outcomes ex ante.

  Thus, a rational person **would not** always want more information:
  - Ex ante, they might prefer a world where certain information doesn’t exist to preserve beneficial arrangements.
  - Good’s theorem only guarantees non-harmful evidence acquisition *when the decision problem is fixed*. When information changes the problem itself, the theorem is inapplicable.

  ### Conclusion
  Good's theorem is sound for its narrow scope: a lone Bayesian agent with a stable decision problem. Hirshleifer’s insight reveals that in multi-agent strategic settings (e.g., markets), information availability can reshape the game, destroying value. Thus, the theorem doesn’t support the slogan "always want more information." Rational agents must weigh how information existence affects social equilibria, not just its direct Bayesian value.
