prompt: |-
  So I've been an admin for my town's community Facebook group (it's got something like 15,000 members at this point, basically the whole town) for about three years now — I got voluntold into it after complaining too much about the last admin — and normally the worst drama we deal with is people fighting over parking spots or lost cats. Lately though it's turned into an actual fight among the mod team itself, and I honestly can't tell who's right, if anyone is.

  We have one rule that just says "no posting misinformation," and it never occured to anybody to spell out what that actually means until two posts blew up in the same week. First one: a woman posted a warning that some guy was going door to door pretending to be from the gas company so he could get into people's houses, said her cousin heard it straight from an actual police officer, sounded completely legit, and she was obviously just trying to look out for people. Except that exact story has apparently been going around every couple of years for over a decade, and nothing was actually happening in our town right then — she'd just been fed an old hoax by someone she had every reason to trust. Second one, same comment thread: a guy replies almost instantly, "nah, that's the fake story that goes round every year," and admits later he had zero idea if it was true this time, he just always assumes it's fake, and this time he happened to be dead right. We've ALSO got a messier third case sitting in the report queue where somebody hedged with "not sure if this is even true but just in case..." about a different rumor that also turned out false, and I don't even know if that one belongs in the same conversation or not.

  Half the mod team wants to give the first woman the standard misinformation warning and leave the guy's comment up, because hey, it was true. The other half of us think that's backwards, since she actually had a decent reason to believe what she posted and he had none at all, he just guessed and got lucky, and if the whole point of the rule is to stop people being careless with claims that spook the entire neighborhood, he's the one who was careless, true or not. Could you write this up as the kind of short memo I'd actually send to the rest of the admin team before we hash this out this weekend? I want it to actually say what we should do about these specific posts instead of just "use your best judgment," and to propose how we should reword the rule itself so we're not refighting this same battle next month — and please don't just wave off the "but he was RIGHT, doesn't that count for something" side of it, because that's genuinely what half my team believes, and they're not being idiots about it.
reasoning: |-
  Okay, the user is an admin for a large community Facebook group facing a moderation dilemma. They've described three problematic posts under their "no misinformation" rule: 

  First, a well-intentioned warning about a gas scam that turned out to be a recurring hoax. The poster genuinely believed it based on police sources. 

  Second, a dismissive comment claiming it's always fake - which happened to be correct this time, though the commenter admitted having no evidence. 

  Third, a hedged rumor ("not sure if true but...") that also proved false. 

  The mod team is split: half want to warn the original poster and leave the correct comment up since it was factually accurate. The other half argues intent matters more - the first poster had reasonable belief while the commenter was recklessly guessing. 

  The user needs a practical solution that: 
  - Resolves these specific cases without just saying "use judgment" 
  - Rewrites the rule to prevent repeats 
  - Addresses the "but he was right" counterargument seriously 

  Key tensions to balance:
  - Accuracy vs intent 
  - Preventing panic vs suppressing warnings 
  - Rule clarity vs moderator discretion 
  - Encouraging skepticism without rewarding baseless cynicism 

  For the memo format, I'll: 
  - Acknowledge both sides' valid points 
  - Propose concrete actions for each case 
  - Suggest rule rewording focusing on verifiability 
  - Emphasize community impact over technical correctness
answer: |-
  Here's a concise memo addressing the cases and proposing rule changes, designed to frame your team discussion:

  ---

  **TO:** Admin/Mod Team  
  **FROM:** [Your Name]  
  **DATE:** [Current Date]  
  **SUBJECT:** Clarifying "Misinformation" Rule & Recent Case Decisions  

  ### Current Cases & Proposed Actions:
  1. **Gas Scam Warning Post (Well-intentioned but false):**  
     - **Action:** *Remove post, no warning for OP.*  
     - **Reason:** Though shared in good faith, it spread a confirmed hoax causing unnecessary panic. Intent ≠ impact.  

  2. **"Always Fake" Comment (Accurate but baseless):**  
     - **Action:** *Remove comment.*  
     - **Reason:** While factually correct *this time*, the user admitted they had zero evidence and operate on blanket skepticism. This encourages harmful "broken clock" behavior—if we reward guesses solely for being right, we incentivize baseless claims that could easily be wrong next time.  

  3. **"Not Sure If True..." Rumor (Hedged claim):**  
     - **Action:** *Remove post.*  
     - **Reason:** Hedging ("just in case") doesn’t absolve responsibility. Sharing unverified rumors—even with disclaimers—still risks amplifying falsehoods and fear.  

  ### Why Truth Alone Isn’t Enough:  
  Acknowledging the "but he was right" perspective: **Accuracy matters, but so does methodology.** Rewarding luck-based corrections:  
  - Undermines trust (e.g., if the commenter guesses wrong next week).  
  - Discourages evidence-based engagement ("Why check facts if guessing works?").  
  - Contradicts the rule’s purpose: preventing *careless* claims that disrupt the community, regardless of intent.  

  ### Proposed Rule Reword:  
  **Current Rule:** "No posting misinformation."  
  **Revised Rule:**  
  > "**Verify before sharing.** Do not post unverified claims that could cause alarm (e.g., crimes, scams, health risks). If sharing third-hand info, clearly cite *reputable sources* (e.g., police bulletin, official news). Baseless speculation (‘always fake,’ ‘probably a hoax’) is also prohibited."  

  ### Key Changes Explained:  
  - **Shifts focus to VERIFICATION** over intent/outcome.  
  - **Explicitly bans speculation**—even if later proven right.  
  - **Allows "good faith" warnings ONLY with cited sources** (e.g., "Police posted about door-to-door scams today [link]").  
  - **Targets high-risk content** (panic-inducing topics) without over-policing benign rumors.  

  ### Next Steps:  
  1. Vote on case actions above.  
  2. Discuss/refine proposed rule language.  
  3. Once approved, pin a clear examples-based guideline (e.g., "✅ Allowed: ‘Police reported scam at X location [link]’" / "❌ Not Allowed: ‘My cousin heard…’ or ‘Total fake news’").  

  This approach prioritizes **responsible sharing** over luck or goodwill, reducing ambiguity while respecting community safety.  

  --- 

  ### Key Strengths for Your Discussion:
  - **Balances both sides:** Respects the "truth matters" argument by emphasizing verification, while rejecting reckless guessing.  
  - **Prevents repeat fights:** Clear criteria replace subjective "misinformation" judgments.  
  - **Practical examples:** Addresses all 3 cases explicitly.  
  - **Community-focused:** Targets only high-stakes posts (scams, safety risks), not casual chatter.  

  This memo gives your team concrete solutions to debate, not just philosophy. Good luck!
