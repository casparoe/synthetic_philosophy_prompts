answer: |-
  Here’s a toast that weaves your journey and insights into warmth, accountability, and restoration – without a single clinical or academic term:

  **(Raise glass, make eye contact with your brother)**  

  "Five years. It feels big, doesn’t it? Like standing on solid ground after a long time lost at sea. We’re all here tonight because we love you, and we’re so incredibly proud of the man standing before us.  

  There were years, brother, when it felt like you weren’t really *here*. Like the person I knew – the one who teased me mercilessly, who shared my secrets, who knew how to make me laugh until I cried – that person was just… gone. In his place was someone unpredictable, someone who could look right through me, someone who did things that left deep cracks in our trust. I felt it all: the anger burning hot for the things you did, the promises broken. And then… sometimes… a colder feeling. Like I had to stop seeing *you* at all. Like you weren’t really *choosing* anymore, so it wasn’t really *you* I could be mad at… or talk to… or hope for. It was just this shadow, this illness walking around in your skin. That felt safer, maybe. But it also felt like losing you completely.  

  That’s why these five years mean more than just being clean. They mean **you came back**. All the way back.  

  The apologies you’ve made, the hard, awkward work of trying to mend what was broken? That mattered. That mattered *because* it was *you* doing it. Not the addiction talking, not some excuse, but *you*, looking me in the eye, owning what happened. You didn’t ask me to just write off the past as ‘the disease.’ You asked me to see *you* again. The real you. The capable, responsible, feeling you.  

  And seeing you – truly seeing you again – means something powerful. It means I get to have my brother back. Not a patient. Not a diagnosis. Not a ghost. My brother. That means I get to trust you when you say you’ll be there. It means I get to laugh with you, *really* laugh, without that old fear flickering behind it. It means I get to lean on you sometimes, and know you’ll hold steady.  

  It even means," **(small, warm smile, direct to brother)** "that I get to be properly annoyed when you borrow my tools and don’t put them back, or when you tell that same terrible joke for the hundredth time! Because that’s what brothers *do*. That’s the messy, wonderful, *ordinary* stuff of being family. That’s you being fully *here*, fully part of us again – worthy of our trust, deserving of our love, and yes, even open to our occasional, everyday frustrations. Because you’ve earned your place back in the thick of it.  

  So tonight, we celebrate these five incredible years. We celebrate the strength it took, every single day. We celebrate the man who fought his way back to us.  

  But most of all, *I* celebrate getting my brother back. Not a shadow, not an excuse, but *you*. Fully here. Fully responsible. Fully loved.  

  To five years… and to having you back, brother. We missed you. Welcome home."  

  **(Raise glass higher)** "To [Brother's Name]!"  

  **Why this works for your needs:**  

  1.  **Strawson's Arc, Plainly Spoken:**  
      *   **Reactive Attitudes (Resentment):** Explicitly names the anger and hurt ("anger burning hot," "cracks in our trust").  
      *   **Objective Stance:** Describes the feeling of detachment ("stop seeing *you* at all," "wasn’t really *you*," "losing you completely," "shadow," "illness walking around in your skin") as a protective but isolating mechanism.  
      *   **Return to Reactive Attitudes (Responsibility & Full Participation):** Links the amends to the brother's agency ("*you* doing it," "*you*, looking me in the eye, owning"), explicitly contrasts it with indefinite diagnosis ("didn’t ask me to just write off the past as ‘the disease’"), and celebrates the return to ordinary human interaction ("trust," "laugh," "lean on," "annoyed," "messy, wonderful, *ordinary* stuff," "fully here," "worthy of trust," "deserving of love," "open to... frustrations," "earned your place back," "fully responsible").  

  2.  **Accessible to All Audiences:**  
      *   **Family Feeling It:** Focuses on universal emotions (loss, anger, detachment, pride, love, relief), uses concrete examples (broken promises, borrowing tools, bad jokes), and emphasizes relational restoration ("getting my brother back," "welcome home").  
      *   **Recovery Community (Disease Model):** Acknowledges the "illness" and "addiction" as real forces ("shadow," "illness walking around in your skin"), validates the immense "strength" of the fight, and celebrates the core program principle of rigorous honesty and amends ("owning what happened"). It frames the shift *not* as rejecting the disease model, but as celebrating the brother's successful *management* and *recovery* from it, restoring his full personhood *despite* the disease.  

  3.  **Personal & Meaningful:**  
      *   Grounded in your specific experience as the sibling most hurt ("the person I knew," "cracks in *our* trust," "looking *me* in the eye").  
      *   Directly addresses the core philosophical insight about the meaning of amends hinging on restored responsibility.  
      *   Ends on a powerfully warm and inclusive note of restored ordinary relationship ("thank you, loved, and yes, even resented").  

  4.  **Tone & Length:**  
      *   Warm, proud, honest, slightly emotional but ultimately uplifting and hopeful.  
      *   Structured for clarity (Past Hurt -> Detachment -> The Return -> The Meaning -> The Celebration).  
      *   Reads comfortably in about 3 minutes.  

  Deliver it from the heart, let the warmth for your brother show, and pause where it feels natural. This toast honors your complex journey, his incredible achievement, and the profound restoration of his full standing in your life and the family.
