prompt: |-
  I'm teaching a graduate seminar on decision theory this term, and last week we covered updateless decision theory, using counterfactual mugging as the running example -- Omega flips a coin, tells you it landed tails, and asks you for $100, which would only have paid off for you in the counterfactual scenario where the coin landed heads and Omega rewards agents who'd have payed up. I told the class that what makes UDT distinctively "updateless," as opposed to causal or evidential decision theory, is that the agent's choice of action doesn't depend on what it actually observes: an updateless agent just carries out whatever policy was optimal relative to its original prior, full stop, rather than conditioning on the fact that its now looking at "tails" and re-deriving what to do from there. On my telling, that's the whole reason UDT agents pay up in cases like this -- they've essentially agreed in advance to be unmoved by whatever evidence later turns up, which is also supposedly why UDT outperforms CDT and EDT here: it trades responsiveness to evidence for better performance averaged across possible worlds.

  One of my students pushed back afterward with what I thought was a pretty good question: if that's right, isn't UDT less a theory of rational choice than a theory of rational precommitment, since a genuinely updateless agent couldn't adjust its behavior in light of new information even when it obviously should? I didn't have a great answer on the spot. So, is my gloss on what "updateless" means here basically right, and if so how do UDT's defenders block the charge that this makes it normatively bizarre -- or have I gotten the theory wrong somewhere along the way?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're teaching a graduate seminar on decision theory and covered updateless decision theory (UDT) using counterfactual mugging as an example. They explained UDT as being distinct because the agent doesn't update based on observations, sticking to the precommitted policy. A student challenged this, arguing that UDT seems more about precommitment than rational choice, especially if it ignores new information when it should adapt.

  First, I need to verify if the user's understanding of "updateless" is correct. They described UDT agents as carrying out the optimal policy from the original prior without conditioning on new evidence. That's accurate in the context of counterfactual mugging, where paying up is optimal regardless of the coin flip outcome. But the student's point raises a valid concern: does UDT really ignore evidence when it's beneficial?

  The user might be conflating "updateless" with never updating. UDT does use evidence but in a different way. It computes the optimal policy ex ante, considering all possible observations. When an observation occurs, the agent follows the precomputed action for that scenario. So evidence isn't ignored; it's factored into the policy selection phase. For example, in counterfactual mugging, the policy specifies paying on tails and receiving on heads. The agent on tails pays not because they ignore the evidence but because the policy already accounts for it.

  The student's critique hinges on UDT being normatively bizarre if it prevents adapting to new info. But UDT's strength is in coordinated decision-making across possible worlds. In the mugging case, paying on tails ensures the counterfactual gain on heads. CDT and EDT fail here because they maximize utility based on actual evidence, neglecting counterfactuals. UDT's ex ante perspective allows it to handle such coordination problems.

  I should also address the precommitment vs. rational choice distinction. UDT is still a theory of choice, but the choice is over policies, not individual actions. The agent selects the best policy before observations, then executes it. This is rational because it leads to higher overall utility. The user might need to clarify that UDT isn't about ignoring evidence but about optimal use of evidence in advance.

  Potential misunderstandings: The term "updateless" might imply no updating occurs, but it's about not updating the policy after observations—the updating happens during policy formulation. Also, UDT's applicability is most evident in problems involving coordination with counterfactual selves, like in the mugging or Newcomb's problem.

  The user's deeper need is likely to respond to the student's critique effectively. They need a clear explanation that distinguishes UDT from irrational inflexibility. Emphasizing the ex ante optimization and the role of evidence in policy creation can show UDT's rationality. Highlighting scenarios where CDT/EDT fail due to lack of coordination can illustrate UDT's superiority in certain problems.
answer: |-
  Your student raises an excellent point that cuts to the heart of UDT's conceptual foundations. Your gloss on "updatelessness" captures a key *intuition* behind UDT's solution to problems like Counterfactual Mugging, but it risks mischaracterizing how UDT *formally* handles evidence. Let's break this down:

  1.  **Your Core Insight is Largely Correct (But Needs Nuance):**
      *   UDT *is* "updateless" in the specific sense that **it does not *condition its probability distribution* on the observation when selecting the *action*.** Unlike CDT/EDT, which treat the observation ("Tails") as *evidence* updating their beliefs about the world state and then maximize expected utility *given that updated belief*, UDT skips this step *at the moment of choice*.
      *   Instead, UDT **selects a complete *policy* (a mapping from possible observations to actions) *in advance*, based on the *original prior*.** The agent then simply *executes* the action dictated by this pre-selected optimal policy for the observation it actually receives.
      *   **Why this *looks* like ignoring evidence:** In Counterfactual Mugging, the optimal policy dictates "Pay $100 if told Tails." When told Tails, the UDT agent pays. It doesn't *recalculate* based on the fact that it *is* seeing Tails; it just follows the policy. This contrasts sharply with CDT/EDT, which, seeing Tails, assign near-zero probability to Heads being true *now*, and thus see no reason to pay.

  2.  **Why UDT Isn't *Truly* Evidence-Ignoring (And Blocks the "Bizarreness" Charge):**
      *   **Evidence is Crucial *During Policy Selection*:** The "updateless" part happens *at execution time*, not *at policy optimization time*. When the UDT agent calculates the optimal policy *before* making any observation, it **explicitly considers *all possible* observations (Heads or Tails) and their *evidential implications*.** It asks: "What action should I precommit to taking *if* I see observation X, *in order to maximize my overall expected utility across all possible worlds I might be in?*"
      *   **The Evidence is *Encoded* in the Policy:** The optimal policy itself is a direct result of reasoning about the evidence. The reason the policy says "Pay on Tails" is precisely *because* seeing Tails *is* evidence that the counterfactual Heads world exists (where Omega rewards payment). UDT *uses* the evidential link (Observation <-> World State) to determine the best coordinated response *across* those linked worlds. It just does this reasoning *before* knowing which observation it gets.
      *   **It *Does* "Adjust Behavior" Based on Evidence:** The policy *is* conditional on observations! If the agent saw Heads, the optimal policy would dictate a *different* action (likely "Do nothing" or "Collect reward"). The agent *does* take different actions based on what it sees; it just decided *in advance* what that different action *should be* for each possible piece of evidence.
      *   **The Goal is Coordination Across Counterfactuals:** UDT's power comes from optimizing for the perspective of the *original, uncertain agent* before any information arrives. This allows it to coordinate actions *across different possible branches of reality* (like the Heads and Tails branches in the mugging) in a way that CDT/EDT cannot, because CDT/EDT get "trapped" in their actual branch after updating. Paying on Tails is rational *only* because it secures the reward in the *counterfactual* Heads branch.

  3.  **Addressing "Precommitment vs. Rational Choice":**
      *   **It's Both, Intelligently:** UDT *is* fundamentally a theory of rational precommitment (choosing the best policy ex ante). However, it argues that **rational choice *at the moment of action* is best understood as faithfully *executing* the precommitted optimal policy.** Deviating from the precommitted policy upon receiving evidence, *even if it seems locally beneficial*, leads to worse overall outcomes because it breaks coordination with your counterfactual selves.
      *   **The "Obviously Should" Case:** Your student's worry about not adjusting "when it obviously should" usually stems from scenarios where the evidence *fundamentally changes the nature of the decision problem* in a way the original prior couldn't anticipate (e.g., learning physics is broken, Omega is lying). UDT proponents argue:
          *   **The Prior Should Encompass These Possibilities:** A sufficiently robust prior would include hypotheses about Omega's reliability, the laws of physics, etc. The optimal policy would then specify actions conditional on *all* possible observations, including surprising ones like "Omega admits it lied."
          *   **Sticking to the Policy *Is* the Rational Update:** If the original policy optimization was done correctly (with a comprehensive prior and utility function), then executing the prescribed action *is* the rational response to the new information *within the framework of maximizing overall expected utility from the original perspective*. Deviating would mean you incorrectly optimized the policy initially or are being inconsistent.
          *   **The Real Bizarreness is in CDT/EDT's Inconsistency:** UDT argues the *true* normative bizarreness lies in CDT/EDT's behavior: they make different decisions based on which branch of a symmetric problem they happen to find themselves in, leading to self-defeating outcomes like refusing to pay in the mugging and thus losing out on the counterfactual gain.

  4.  **Where Your Gloss Might Slightly Mislead:**
      *   **"Unmoved by whatever evidence":** This phrasing is too strong. The agent *is* "moved" in the sense that its *action* depends on the evidence (via the policy). It's not "unmoved"; it's that its *response* to the evidence was *pre-determined* to be the optimal one.
      *   **"Trades responsiveness for better performance":** It's not a *trade-off*. UDT argues that *this form of "responsiveness" (CDT/EDT's conditionalization)* is *flawed* in certain problems because it ignores counterfactual consequences. UDT achieves better performance *by defining rational responsiveness correctly* as fidelity to the ex-ante optimal plan that accounts for all possibilities. It sees CDT/EDT as *overly* reactive to the immediate evidence in a myopic way.

  **In Summary:**

  *   **You are right** that UDT distinguishes itself by not performing a Bayesian update *at the moment of choice* and instead executes a precomputed policy.
  *   **You are right** that this ex-ante policy optimization is key to its solution for Counterfactual Mugging and similar problems, allowing coordination across counterfactuals.
  *   **The student is right** to highlight the precommitment aspect, but **UDT defenders argue this *is* rational choice:** Rational choice involves selecting the best *strategy* (policy) beforehand and then *rationally following through* on it, as deviating leads to globally worse outcomes. Evidence isn't ignored; it's exhaustively analyzed *during the strategy formulation stage* and directly determines what the policy dictates for each possible observation.
  *   **The "updatelessness" is strategic, not evidential:** UDT uses evidence comprehensively to *build* its strategy but doesn't *re-strategize* upon receiving evidence. It bets that the precomputed strategy, precisely *because* it was built using the prior and evidence relationships, is the globally optimal response for any observation.

  **How to Block the Charge of Normative Bizarreness:**

  1.  **Emphasize Coordination:** Frame UDT's strength as enabling rational coordination between your current self and your counterfactual selves in other possible branches. CDT/EDT fail at this coordination.
  2.  **Highlight the Ex-Ante Perspective:** Argue that true rationality requires taking the perspective of the agent *before they know which situation they are in*. The optimal decision *from that perspective* is to commit to a policy, and rationality demands following it. Failing to follow through *is* irrational from the original viewpoint.
  3.  **Point to Performance:** UDT demonstrably gets better results in specific, well-defined problems like Counterfactual Mugging and Newcomb-like problems where coordination matters. Its "bizarreness" at the moment of choice is the price for this superior global performance.
  4.  **Clarify Evidence Handling:** Stress that evidence *is* used, just during policy creation. The policy is evidence-responsive by design.

  Your student's question is fundamental and highlights a genuine tension. UDT *is* a radical departure from the standard Bayesian update-then-maximize framework. Its defenders argue this departure is necessary for true rationality in a broad class of decision problems involving counterfactual coordination, even if it feels counterintuitive at the point of action. The debate hinges on whether rationality is best defined *locally* (maximize now given current beliefs) or *globally* (maximize overall from the initial state of uncertainty). UDT firmly champions the latter.
