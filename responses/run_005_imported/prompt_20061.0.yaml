answer: |-
  That's a beautifully thorny philosophical knot wrapped in a family drama – perfect for the "self and personal identity" unit you're teaching! You're right to see both the potential seriousness *and* the potential dodge in Uncle R.'s move. Let's break it down using the lenses you mentioned (Locke, Parfit, Buddhism) and see how much weight it can bear.

  **1. The Philosophical Seriousness: Can He Be "A Different Person"?**

  *   **Locke:** Locke grounds personal identity in *consciousness*, specifically memory. "For as far as any intelligent being can repeat the idea of any past action with the same consciousness it had of it at first… so far it is the same personal self." (Essay, Bk II, Ch. 27). If Uncle R. genuinely lacks psychological continuity – specifically, the memory links and sense of "ownership" over those past actions – then *for Locke*, he arguably *isn't* the same person. The "gambling drunk" is linked by the same biological life (man), but not necessarily the same *person*. **Weight:** Moderate. Locke *does* allow for this disconnection. *However*, Locke was deeply concerned with *moral responsibility*, and he likely intended that memory ensures we remember actions we *are* responsible for. If you remember doing it, you *are* the same person responsible. If Uncle R. remembers those events (even if he disavows the "self" that did them), Locke might still pin responsibility on the current consciousness recalling them. The dodge might be in claiming a *lack* of memory/identification that isn't truly complete.
  *   **Parfit:** Parfit radically challenges the importance of *identity* over time. In *Reasons and Persons*, he argues that what matters is **Relation R**: psychological connectedness (direct memory links, similar character, beliefs, desires) and continuity (overlapping chains of connectedness). If the connections between Uncle R. now and Uncle R. in the 90s are sufficiently weak (different values, desires, temperament, perhaps fragmented or alien memories), then Parfit would say strict identity doesn't hold in a way that fundamentally matters. The past actions were done by someone psychologically *continuous* with the current person, but not *strongly connected* to them. **Weight:** Significant. Parfit explicitly argues that weakened psychological connectedness *does* diminish responsibility for past actions. He uses the analogy of a senile general: we don't blame the frail, confused old man for the atrocities committed by the vigorous young officer decades earlier if the connections are gone. This is the strongest philosophical backing for R.'s claim.
  *   **Buddhism (Anattā - No-Self):** Buddhism fundamentally denies the existence of a permanent, unchanging self (ātman). What we call "self" is a constantly changing stream of aggregates (form, sensation, perception, mental formations, consciousness) bound together by cause and effect (karma). The "gambling drunk" was a temporary constellation of causes (addiction, greed, suffering) and conditions. The "sober grandfather" is a different, albeit causally linked, constellation. **Weight:** Significant, but nuanced. On one hand, "that wasn't *me*" aligns perfectly with the doctrine of no permanent self. On the other, Buddhism emphasizes *karmic responsibility*. Actions have consequences that ripple through the causal chain. The current Uncle R. inherits the *consequences* (karmic fruits, family resentment) of those past actions, even if the "self" that performed them is illusory and impermanent. Responsibility is less about *who* did it and more about the *chain of causation* the current aggregates must navigate and address. Disavowal without acknowledging the causal consequences misses the point.

  **2. The Potential Dodge & Your Mom's Point:**

  Your mom's fury is philosophically and emotionally astute. The potential dodge lies in:

  *   **Denying Accountability vs. Explaining Change:** Saying "I was a different person" can easily slide from *describing a profound transformation* to *denying responsibility for the consequences of past actions*. The past actions *happened*, and they caused real harm to specific people (your mom, his kids, others he borrowed from). The current Uncle R. exists in a world *shaped* by those actions. Declaring himself a "new person" doesn't erase the debt (literal and metaphorical), the broken trust, or the years of pain. It risks invalidating the lived experience of those he hurt.
  *   **The Convenience of the Narrative:** The "different person" claim can be self-serving. It allows him to distance himself from the shame and guilt without necessarily doing the hard, ongoing work of *making amends* and *demonstrating* through consistent action over time that he understands the depth of the harm and is committed to repairing relationships *despite* the past. Is his declaration part of genuine remorse and repair, or is it a way to shut down criticism and avoid deeper accountability?

  **3. Your Brilliant Counter: The Credit Problem**

  This is the crux that exposes the asymmetry Uncle R. might be relying on:

  *   **The Problem:** If psychological discontinuity absolves him of blame for the past ("that wasn't *me*"), then by the *exact same logic*, he cannot claim full credit for his recovery and current virtues ("*I* became sober," "*I* am kind now"). The transformation would be attributed to a series of "not-quite-him" selves – the self that hit rock bottom, the self that sought help, the self that persevered through early recovery, etc. – culminating in the current self who merely *inherits* the results.
  *   **Philosophical Responses:**
      *   **Parfitian View:** Parfit might agree! He downplays the importance of the "I" in both blame *and* credit. What matters is the *quality of the experiences* in the psychological stream. We praise the current constellation for its good qualities, regardless of who "built" them, just as we condemn the past constellation for its bad actions. Responsibility and credit become more about the *current state* and its relation to the past stream than strict ownership.
      *   **Lockean/Buddhist/Agency Focus:** Others would argue that while the *past* self's actions might be psychologically distant, the *current* self has **agency** *now*. He makes choices *today* to maintain sobriety, show up for his grandkids, and attempt reconciliation. Credit accrues for the *current exercise of agency* in sustaining the positive state. Blame for the past is diminished due to discontinuity, but credit for the *present* is earned through current actions. This introduces an asymmetry: responsibility looks *backward* and requires continuity; credit for sustained positive states looks at *current* agency within the continuous stream. This is messy but reflects a common intuition.
      *   **Gradual Change vs. Rupture:** The transformation from addict to sustained sobriety is often a *gradual* process of overlapping psychological states, not a clean rupture. The "self" that decided to get help *is* more connected to the current self than the self deep in addiction was. There might be *more* psychological connection *to* the recovery process than *from* the depths of the harm.

  **4. How Much Weight Can It Bear? Does It Cut Cleanly for R.?**

  *   **Weight:** The move has **substantial philosophical weight**, particularly from Parfitian and Buddhist perspectives. Profound psychological change *can* and *does* alter our relationship to past actions and our sense of responsibility. It's not *just* a dodge.
  *   **Not a Clean Cut:** However, it **does not cut cleanly in R.'s favor** for several reasons:
      1.  **Moral Responsibility vs. Causal Responsibility:** Even if *moral* responsibility is diminished due to discontinuity, *causal* responsibility remains. *His* biological life, *his* past actions, *caused* the harm. The current person inherits the consequences and the relational fallout.
      2.  **The Needs of the Victims:** Philosophy can analyze the self, but it doesn't erase the victims' experiences. Your mom's anger stems from *her* lived reality with *her* brother. R.'s declaration, however philosophically grounded, ignores *her* need for acknowledgment, validation of her pain, and perhaps specific amends. His "new person" claim feels like an erasure of *her* history.
      3.  **The Work of Repair:** The philosophical argument might lessen the *metaphysical* burden of blame on the *current* R., but it doesn't absolve him of the *practical* and *relational* work. True reconciliation requires acknowledging the harm *done by the person he was*, expressing remorse *for that specific history*, and making amends *as the person he is now*. The "different person" line risks bypassing this crucial work.
      4.  **The Credit Asymmetry:** Your counter-argument highlights that the logic, if applied rigidly, undermines his claim to credit for his recovery. He can't have it both ways.

  **Conclusion: A Tool, Not an Absolution**

  Uncle R.'s "different person" move has **genuine philosophical substance**, drawing powerfully from theories that emphasize psychological discontinuity (Parfit) and impermanence (Buddhism). It effectively *describes* a profound transformation and *can* mitigate the sense of strict, personal identity-based blame.

  **However, it is insufficient as a tool for reconciliation.** It risks being a **rhetorical dodge** if used to:

  *   Avoid acknowledging the specific harm caused *by his past actions*.
  *   Invalidate the ongoing pain and resentment of those he hurt (like your mom).
  *   Shut down conversation about accountability and amends.
  *   Claim credit for the present without acknowledging the asymmetry with the past (as you astutely noted).

  **The Philosophical & Practical Path Forward (for R. and the family):** A more philosophically robust and relationally honest approach for Uncle R. would be:

  1.  **Acknowledge the Act & Harm:** "I did those terrible things. They caused you immense pain. That history is real, and it was *this* life, *this* biological entity that caused it."
  2.  **Describe the Discontinuity (Carefully):** "The person who did those things feels alien to me now. My psychology, values, and way of being are fundamentally different. I don't recognize that man or his motivations." (This is the Parfit/Buddhist insight).
  3.  **Emphasize Current Agency & Commitment:** "While I feel disconnected from *who* I was, I am deeply connected to the *consequences* of those actions. As the person I am *now*, I take responsibility for addressing that harm. I am committed to being trustworthy, reliable, and kind *now* and into the future. My sustained sobriety and efforts are how I exercise that agency."
  4.  **Focus on Amends (if possible/welcome):** "I understand if you can't forgive, but I want to know what, if anything, I can do *now* to make things better, knowing I cannot change the past."

  This approach integrates the philosophical insight about the changing self *without* using it as an escape hatch. It acknowledges the reality of the past harm, the validity of the victims' feelings, the genuine nature of the change, and the current person's commitment to repair – a much heavier lift philosophically and emotionally than simply declaring "that wasn't me."

  Your Thanksgiving dilemma perfectly illustrates why personal identity isn't just an abstract puzzle; it's deeply entangled with ethics, relationships, forgiveness, and the messy reality of human lives over time. It sounds like you have rich material for your students!
