prompt: |-
  So I did a sensory deprivation float tank for the first time last weekend (pitch black, silent room, water kept at exactly skin temp so eventually you can't even feel it against you), and had this weird experience where I had basically zero sensory input, couldn't feel my body at all or tell where my limbs were, and yet my sense of just being there and aware didn't dim one bit, if anything it felt sharper. Kinda like unplugging every peripheral from a machine but the main process just keeps humming along fine. I told a friend who's really into meditation retreats about it and she said this basically proves consciousness isn't actually generated by the body, that the brain's more like a receiver for it than the source. Somethings bugging me about that argument but I can't pin down what exactly. Does an experience like that actually show anything about whether the mind could exist independent of the body, or is she reading way more into it than it can actually support?
