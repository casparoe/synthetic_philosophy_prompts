answer: |-
  ### Dialogue: The Bargaining Table  
  **Setting:** *Two academics stand before a whiteboard displaying a two-person bargaining diagram. The disagreement point is (0,0). The feasible set is asymmetric: the Pareto frontier runs from (1,0) to (0.6,1.0), then to (0,1.2), forming a convex set. The Nash solution (N) is at (0.6,1.0); the Kalai-Smorodinsky (KS) solution is approximately (0.68,0.81).*  

  **Nash Defender (N):** Alright, let’s cut to the chase. Your "minimax relative concession" is just KS in disguise, and it abandons independence of irrelevant alternatives (IIA). That’s reckless. IIA ensures stability. Look at this frontier—Nash gives us (0.6,1.0) because it maximizes the product of our gains: \(0.6 \times 1.0 = 0.6\). Simple, elegant, and consistent. If we remove options *other* than this point and the disagreement, it stays put. Why would you give that up?  

  **Contractarian (C):** Consistency shouldn’t trump fairness. KS gives (0.68,0.81) because it equalizes our *relative concessions* from our ideal payoffs. You concede \( (1 - 0.68)/1 = 32\% \) of your maximum possible gain; I concede \( (1.2 - 0.81)/1.2 = 32.5\% \). Almost identical! Nash ignores the *structure* of opportunity. It fixates on local trade-offs, not the global context of what’s possible.  

  **N:** "Global context" is a smokescreen. IIA isn’t some minor axiom—it’s what stops manipulation. Suppose I sneak an extra option into the feasible set—say, a lopsided point like (0.1,1.3)—even if we’d never pick it. *(Adds a point at (0.1,1.3) and redraws the frontier to include a new segment from (0.6,1.0) to (0.1,1.3), then to (0,1.2). The ideal point shifts to (1,1.3).)* Now KS jumps to ~(0.66,0.85)! You get *less* (0.66 vs. 0.68), and I get *more* (0.85 vs. 0.81), just because I added an irrelevant option that benefits me. That’s bribery, not justice.  

  **C:** Irrelevant? That point *changes* the ideal payoff for Player 2 from 1.2 to 1.3! Of course it should matter. Your "manipulation" only works if you confuse *irrelevant* with *inconvenient*. An alternative isn’t "irrelevant" just because Nash discards it—it’s irrelevant if it doesn’t alter the *bargaining balance*. Here, Player 2’s improved best-case *strengthens their claim*. KS respects that.  

  **N:** Then define "bargaining balance" without circularity! IIA anchors it: an option is irrelevant if its removal doesn’t change the outcome. Period. Your "ideal payoffs" are arbitrary—why measure concessions from utopia? Why not the midpoint or the threat point? Without IIA, KS is just Nash with a prettier vulnerability to strategic expansions.  

  **C:** Let’s test your precious Nash. *(Erases the (0.1,1.3) addition. Alters the diagram: extends the frontier so Player 1’s maximum rises to 1.2, adding a segment from (1.2,0) to (0.6,1.0). Player 2’s maximum remains 1.2. The feasible set is now larger, but (0.6,1.0) is still on the frontier.)* Player 1’s opportunities improved—their ideal payoff jumped from 1.0 to 1.2. What does Nash do? Stays at (0.6,1.0)! Player 1 gets *zero* benefit from their new leverage. KS? It shifts to (0.75,0.75), so both gain equally from the expansion. Nash fails *monotonicity*—it’s rigged against the party whose options improve.  

  **N:** Why *should* Player 1 gain? The new option (1.2,0) is worse for both of us than (0.6,1.0)—it’s Pareto-inferior! IIA says: if the solution point is still available, and nothing *better* is added, the outcome shouldn’t change. This isn’t failure; it’s discipline. KS rewards Player 1 for phantom leverage they can’t even use.  

  **C:** Phantom? The new maximum is *real*—it reflects their enhanced bargaining position. Monotonicity ensures gains from cooperation scale fairly when the pie grows. You Nashians talk "discipline" but enshrine status quo bias. If Player 1’s tech improves, why should Player 2 freeload?  

  **N:** Freeload? Nash respects mutual advantage. That "bias" prevents extortion. Your monotonicity lets players jam the set with bad options to distort the ideal point. KS calls it fairness; I call it noise.  

  **C:** And I call IIA a straitjacket. When the feasible set expands *asymmetrically*, justice requires adjusting shares. Minimax relative concession generalizes that intuition. You reduce fairness to mathematical convenience.  

  **N:** Convenience? Without IIA, we lose predictive power. Every bargaining environment is unique; your "fairness" is just another parameter. Nash’s axioms are minimal. KS swaps one axiom for another—but monotonicity isn’t morally privileged. It’s a trade-off, not a triumph.  

  **C:** A trade-off Gauthier embraces! If cooperation is rational, outcomes must respond to shifts in power. Your IIA sanctifies the subgame, but justice lives in the whole game.  

  *(Both pause, glaring at the diagram. The Nash point (0.6,1.0) and KS point (0.68,0.81) stare back, unresolved.)*  

  **N:** So we’re at an impasse. IIA guards against manipulation but risks rigidity.  
  **C:** And monotonicity links gains to opportunity but risks distortion. Choose your axiom; choose your justice.  
  **N:** Exactly. Let your students decide which price is worth paying.  

  ### Key for Students  
  - **Nash’s solution**: Maximizes \( (u_1 - d_1)(u_2 - d_2) \). Satisfies IIA: adding/removing "irrelevant" options (those not chosen) doesn’t alter the outcome.  
  - **Kalai-Smorodinsky**: Equalizes relative concessions from ideal payoffs. Satisfies *individual monotonicity*: if one player’s maximum payoff increases, they get at least as much as before.  
  - **The trade-off**: Under standard axioms (Pareto, symmetry, affine invariance), **no solution can satisfy both IIA and monotonicity**.  
  - **Dispute core**:  
    - **Nash** fears KS is manipulable by expanding the feasible set in ways that distort the "ideal point" but aren’t chosen.  
    - **KS** argues Nash is unresponsive to genuine improvements in bargaining position.  

  **Discussion question for seminar:** Which axiom—IIA or monotonicity—better captures a fair division of cooperative surplus? Justify using the diagram shifts in the dialogue.
