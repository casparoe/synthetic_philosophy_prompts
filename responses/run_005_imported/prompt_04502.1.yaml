prompt: |-
  Quick question about AI safety. There's this classic ARC thought experiment -- the "SmartVault" setup -- where an AI guarding a diamond secretly knows the camera feed's been hacked to look normal, and the hard part (they call it "eliciting latent knowledge") is training it to report what it actually believes rather than just what a human watching the footage would guess. But now that interpretability folks can pull literal human-readable concepts out of a model's activations with sparse autoencoders -- Anthropic's found a Golden Gate Bridge feature, deception features, all sorts of stuff -- doesn't that basically dissolve the problem? Feels like ELK was only "unsolvable" back when models were pure black boxes, and its really just an engineering slog now: find the feature for "is the diamond actually there" and read it off. Am I missing something, or has interpretability quietly made this a non-issue?
reasoning: |-
