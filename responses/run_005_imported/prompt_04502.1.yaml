  Right, so their core question: Does feature extraction bypass ELK? Let me unpack why the answer is "not yet." First, the distinction between *knowing* and *reporting* is crucial. The AI might have a "diamond present" feature, but what if it *also* has a "what humans would believe" feature? During training, the latter gets rewarded because humans see fake footage. So when we probe, which feature activates? Probably the one reinforced by training. 

