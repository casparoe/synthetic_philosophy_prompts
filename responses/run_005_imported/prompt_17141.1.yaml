  ## The Unearned Skeptic: Why Quinean Naturalism Points Toward Cornell Realism

  Quine's profound naturalism revolutionized epistemology, dissolving the analytic/synthetic distinction and embedding knowledge within a holistic web of belief answerable only at the edges to sensory experience. Yet, when it comes to ethics, Quine stops short. He famously relegates moral value judgments to a cognitive limbo, arguing they lack even the remote, holistic connection to sensory tribunals that characterizes physical theory. This skepticism, echoed forcefully by Gilbert Harman's argument from explanatory irrelevance, seems intuitively aligned with a hard-nosed scientific naturalism. However, a rigorous examination reveals that the core tenets of Quine's own philosophy – particularly his holistic empiricism, rejection of *a priori* boundaries, and coherentist methodology – generate significant tension with his ethical skepticism. In fact, a fully consistent Quinean naturalist should find the arguments of Nicholas Sturgeon, Richard Boyd, and the Cornell realists more compelling, embracing a naturalized moral realism grounded in explanatory coherence.

  **The Case for Skepticism: Quine and Harman**

  Quine's skepticism rests on a specific interpretation of his empiricism. His core argument is that moral judgments lack *empirical content* in the requisite way:
  1.  **Empirical Tribunals:** Scientific theories, however abstract (involving quarks or curved spacetime), ultimately connect, however holistically and indirectly, to sensory experience. Observations can confirm or infirm the web.
  2.  **The Moral Vacuum:** Moral values ("Killing is wrong," "Charity is good") appear, to Quine, fundamentally disconnected from this sensory tribunal. No conceivable observation seems to directly bear on their truth or falsity in the way it bears on "There is a table" or even "Electrons have spin." They seem to float free of the empirical constraint that defines naturalized epistemology.
  3.  **Degree vs. Kind, But Still a Gulf:** While Quine acknowledges the fact/value split is not absolute (a point against crude dualism), he insists the *distance* from sensory input for ethics is so vast that it places moral judgments outside the realm of cognitive, truth-apt discourse. They become more akin to expressions of taste or cultural conditioning than claims about the world.

  Harman sharpens this into a powerful argument *within* naturalism:
  1.  **Explanatory Parsimony (The Harman Challenge):** When we observe moral phenomena (e.g., people condemning an act of cruelty), we can explain this observation perfectly well using only psychological, sociological, and biological facts about human beliefs, emotions, and social conditioning. We never *need* to posit the existence of an objective moral fact (e.g., "That act *was* wrong") to explain why we *observe* the moral judgment. Contrast this with physics: observing a vapor trail in a cloud chamber *requires* positing an electron to explain it; the electron is an indispensable part of the causal explanation.
  2.  **No Causal Role:** Moral facts, if they existed, seem epiphenomenal – they don't *do* any causal-explanatory work in the natural world we describe scientifically. A naturalist, committed to ontological parsimony (Ockham's Razor), therefore has no grounds for believing in them. Quine's naturalism, emphasizing science as the arbiter of what exists, seems to endorse this eliminative conclusion.

  **The Cornell Realist Rebuttal: Naturalism Applied Holistically**

  Sturgeon, Boyd, and colleagues counter that Quine's *own holistic, coherentist epistemology* undermines his (and Harman's) skepticism:

  1.  **Explanatory Relevance Defended:** They argue moral properties *can* and *do* figure in legitimate causal explanations. Consider Sturgeon's famous example: The abolition of slavery. Can we adequately explain this massive historical shift *without* referencing the *actual moral wrongness* of slavery? Explanations citing *only* economic shifts or political power struggles seem incomplete. The *recognition* of slavery's profound injustice appears a crucial, causally efficacious factor. Similarly, explaining Hitler's moral depravity might be essential to explaining the specific horrors of the Nazi regime and the global reaction to it. Moral properties, they argue, can be part of the best explanation for certain non-moral events and observations.
  2.  **Holism Vindicates Moral Posits:** Quine demolished the idea that theoretical posits gain legitimacy only through *direct* observational links. Electrons are justified because they play an indispensable role within a *holistically successful* theory that *overall* organizes and predicts sensory experience. Cornell realists apply this directly to ethics. Moral properties (e.g., "cruelty," "justice") are posits within our best *overall* theory of the world, which includes social, psychological, and historical phenomena. If attributing these properties enhances the coherence, explanatory power, and predictive success of our total web of belief regarding human behavior and social interaction, then they are justified on *precisely Quinean grounds*. Their justification is holistic, not atomistic.
  3.  **No *A Priori* Barriers:** Quine's rejection of the analytic/synthetic distinction and *a priori* knowledge dismantles the foundation for erecting an *a priori* barrier between the "scientific" and the "moral." If there are no privileged, unrevisable conceptual truths separating domains, then the possibility of moral properties being natural properties (perhaps complex functional or dispositional properties) causally interacting with the world remains open. Boyd argued moral properties could be "homostatic property clusters" – natural properties (like causing suffering, undermining flourishing) that co-occur in stable patterns we identify as "wrongness" or "justice," playing explanatory roles within social science.
  4.  **Empirical Content Revisited:** While a single moral judgment might not be testable in isolation (paralleling scientific hypotheses under holism and underdetermination), the *overall moral framework* in which it is embedded *is* testable. Does a theory positing certain properties as "just" or "cruel" yield a more coherent, explanatorily powerful, and predictively successful understanding of human history, psychology, and social dynamics than rival theories (e.g., pure emotivism or error theory)? If so, it gains empirical traction through its holistic integration and contribution to understanding the empirical world. The tribunal is the entire web's fit with experience.

  **Verdict: Quine's Skepticism is Unearned by His Naturalism**

  The strongest considerations reveal a deep tension within Quine's position. While his emphasis on empirical grounding provides the initial *impulse* for skepticism, the *actual machinery* of his naturalism – radical holism, the rejection of *a priori* boundaries, coherentism, and the justification of theoretical posits via their role in a successful explanatory web – actively undermines the case for excluding ethics *a priori*.

  *   **Harman's Challenge Falters:** The Cornell realist examples demonstrate that moral facts *can* be explanatorily relevant. Harman's claim that they are *never* needed is an overstatement not demanded by naturalism itself. Parsimony applies *within* theory-building; if moral properties demonstrably *enhance* the explanatory coherence of our best overall theory (encompassing social science and history), parsimony does not automatically forbid them. Quinean naturalism prioritizes explanatory power over a simplistic reductionism.
  *   **Holism is the Key:** Quine's greatest insight was that knowledge is a seamless web. To arbitrarily cordon off ethical discourse as uniquely disconnected from this web contradicts the spirit of holism. If moral judgments are deeply intertwined with our understanding of human needs, social cooperation, psychological responses, and historical change – all empirical domains – then their status within the web should be determined by their *contribution to its overall coherence and empirical adequacy*, not by a prioristic decree about their empirical vacuity. The tribunal for ethics is the same tribunal for physics: the holistic success of the entire system in accommodating sensory input.
  *   **Quine's Stopping Point is Arbitrary:** Quine accepts unobservables in physics justified holistically. He accepts intentional psychology (beliefs, desires) as legitimate posits within naturalism, despite their distance from the sensory periphery and contested explanatory status. Denying the same holistic, coherentist justification to moral properties, especially when plausible arguments for their explanatory relevance exist, appears inconsistent. It reintroduces a kind of dualism his philosophy otherwise rejects.

  Therefore, a fully consistent Quinean naturalist should side with Sturgeon and Boyd. Quine's *own* epistemological framework – the web of belief vindicated by holistic coherence and explanatory power – provides the tools to naturalize moral realism. Moral properties are candidates for inclusion in our best scientific picture of the world, not as spooky non-natural entities, but as complex natural properties (per Boyd) playing indispensable roles in explaining social and psychological phenomena. While significant challenges remain (defining the naturalistic reduction, handling disagreement, clarifying the precise causal mechanisms), the *barrier* Quine erected against the cognitive standing of ethics is not an inevitable consequence of his naturalism. It is, rather, an unearned skepticism, a vestige of an empiricist intuition that his holistic revolution should have dissolved. The consistent Quinean path leads not to eliminativism, but to the challenging, naturalistic project of integrating ethics into the seamless web of science.
