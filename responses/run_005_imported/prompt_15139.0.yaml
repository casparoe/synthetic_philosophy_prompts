  ## Memorandum: Re-Evaluating the "Adam Smith Prize" – Colonial Context & Academic Integrity  

  **To:** Economics Department Prize Committee  
  **From:** [Your Name/Position]  
  **Date:** October 26, 2023  
  **Subject:** Recommendation Regarding the "Adam Smith Prize" & Student Petition on Colonial Foundations  

  ### I. Acknowledging the Petition & Core Issue  
  The student petition rightly demands we confront Adam Smith’s complex relationship with colonialism. Dismissing this as irrelevant to "pure economics" ignores how *The Wealth of Nations* explicitly analyzes empire, slavery, and corporate power. Smith’s critique of mercantilism is profound, but **we must rigorously examine whether his proposed alternatives constituted anti-colonialism or a reformed imperialism.** The petitioners' strongest argument is that Smith’s framework of "free trade" and "efficiency," while critiquing *specific* exploitative practices (like the EIC's monopoly), provided a theoretical toolkit later used to justify colonial extraction under liberal imperialism.  

  ### II. Smith on Colonies: Nuance & Contradiction  
  *   **Forceful Critique of Mercantilism & EIC:** Smith undeniably eviscerated the mercantile system and the East India Company (Book IV, Ch. VII). He called mercantilism a "project" enriching merchants at the expense of Britain and colonists alike, condemned the EIC as "plunderers" whose rule was "perfectly destructive," and highlighted the immense human cost of colonial ventures. This *is* a powerful indictment of contemporary colonial practice.
  *   **The Reformist, Not Anti-Imperial, Vision:** Smith's solution was **assimilation, not independence.** His primary proposal (WN IV.vii.c.75-79) was "an union with Great Britain" where colonies gained parliamentary representation proportional to taxation. He argued this would align interests, reduce conflict, and make empire sustainable. He did *not* advocate for self-determination or dismantling empire.
  *   **Eurocentric Assumptions & "Improvement":** Smith saw European settlement colonies (like America) as potentially beneficial extensions of Europe, capable of "improvement" under European governance. His condemnation of the EIC stemmed partly from its *failure* to "improve" India, reflecting a belief in European superiority in governance and economic organization.
  *   **Ambiguity on Slavery:** While Smith critiqued slavery's inefficiency and inhumanity (WN III.ii.9, IV.vii.b.53), his focus was economic, not abolitionist. He didn't propose dismantling the slave-based colonial system integral to the Atlantic economy he analyzed.

  ### III. Analysis: "Foundations for Colonial Exploitation"?  
  *   **The Petitioners' Valid Point:** Smith’s devastating critique of *mercantilist* exploitation was groundbreaking. However, his core principles—specialization, free exchange, efficient resource allocation—were subsequently weaponized in the 19th century to justify "liberal imperialism." Figures argued that imposing free trade (often by force) and integrating colonies into global markets *on metropolitan terms* was mutually beneficial, echoing Smithian efficiency arguments while ignoring his caveats about justice and his assimilationist solution. The *potential* for this misuse stems partly from Smith focusing on efficiency within the *existing* imperial framework rather than fundamentally challenging its legitimacy or power imbalances.
  *   **The Counterpoint:** Smith himself fiercely condemned the *actual* practices of colonial exploitation he witnessed (EIC rule, mercantile restrictions). Attributing *later* misuse of his abstract principles to him personally is problematic. His assimilation proposal, while imperialist, aimed explicitly at *reducing* exploitation by aligning political and economic interests.

  ### IV. Recommendation: Retain the Name & Elevate the Discourse (Option 3)  
  I recommend **retaining the "Adam Smith Prize" name while formally contextualizing Smith's legacy regarding empire.** Renaming risks oversimplifying history and erasing Smith's genuine, radical critiques of corporate power and state-sponsored monopoly. Changing the name solely due to colonial associations also sets a precedent requiring scrutiny of *all* historical figures associated with problematic systems (Keynes, Marx, etc.), potentially paralyzing recognition. However, doing nothing fails to address valid concerns about historical awareness and inclusivity.  

  Therefore, I propose a **third way:**  

  1.  **Keep the "Adam Smith Prize"** recognizing his foundational contributions to economic science and his specific, powerful critiques of mercantile exploitation and corporate misrule.  
  2.  **Institute Permanent Contextualization:**  
      *   **Revised Prize Plaque/Description:** Add language to the prize citation: *"...awarded for excellence in economic research, in recognition of Adam Smith's foundational contributions to the discipline. Smith's analysis, while groundbreaking, included complex and contested views on empire and colonial governance, reflecting the context of his time. The Department encourages critical engagement with the historical development of economic ideas."*  
      *   **Annual Lecture/Event:** Establish an annual department lecture or roundtable named in conjunction with the prize (e.g., "The Adam Smith Prize Lecture on Economics in Historical Context") focusing explicitly on critical examinations of the history of economic thought, including themes of empire, power, and exploitation. The inaugural lecture could address "Adam Smith, Empire, and the Limits of Political Economy."  
      *   **Include Colonial Context in Teaching:** Encourage faculty teaching Smith to explicitly incorporate discussion of his views on colonies, the EIC, and slavery as part of core economic history/thought curricula.  

  ### V. Why This Approach?  
  *   **Academic Integrity:** Engages seriously with the historical record and critiques without erasing foundational contributions.  
  *   **Educational Value:** Turns the controversy into an ongoing learning opportunity, fostering critical thinking about the interplay of economics, power, and history.  
  *   **Respect for Petitioners:** Directly addresses their core concern by acknowledging Smith's complex legacy and institutionalizing critical discourse, rather than dismissing it.  
  *   **Preserves Recognition:** Maintains the prize's prestige while demonstrating the department's commitment to nuanced historical understanding.  
  *   **Avoids Futile Debates:** Sidesteps the unresolvable "honor the economics, not the politics" dichotomy by acknowledging they are intertwined.  

  **Conclusion:** Adam Smith was a fierce critic of the *worst* colonial practices of his day but operated within an imperial worldview. He provided tools used *later* to justify different forms of exploitation, even as he condemned the forms he saw. Renaming the prize oversimplifies this; ignoring the debate is inadequate. By retaining the name while embedding critical context and fostering ongoing discussion, we honor Smith's genuine intellectual contributions *and* our responsibility to teach economics as a discipline deeply shaped by, and shaping, historical power structures. I urge the committee to support this recommendation.  

  **Recommended Vote:** **Approve retaining the "Adam Smith Prize" name with the institutionalization of formal contextualization measures (revised plaque, annual lecture/symposium focus).**
