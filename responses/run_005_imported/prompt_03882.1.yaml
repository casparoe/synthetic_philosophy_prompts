answer: |-
  What a brilliantly framed question - you've perfectly captured the intellectual tension Darwin wrestled with. Let's reconstruct his verdict based on his core principles and historical context:

  **Darwin would almost certainly side with Fisher's runaway model, and here's why:**

  1.  **The Primacy of Arbitrary "Taste for the Beautiful":** In *Descent of Man*, Darwin explicitly framed female choice as driven by an inherent aesthetic sense, independent of utility. He wrote of female birds possessing "a taste for the beautiful" and exercising "choice... guided... by the appreciation of the beautiful." Fisher's model mathematically formalizes *exactly* this core idea: female preference exists first (arbitrarily), and then co-evolves with the ornament. This was Darwin's fundamental conceptual breakthrough to escape Wallace's utilitarian critique. Accepting Zahavi's handicap principle would feel like surrendering to Wallace's demand that *every* trait must have direct survival utility.

  2.  **Gradualism & Cumulative Change:** Darwin was obsessed with incrementalism. Fisher's runaway is a beautifully gradual process: a slight initial preference, leading to slight ornament exaggeration, reinforcing the preference, and so on. Zahavi's handicap, especially in its early formulations (before Grafen's formalization), often implied a sudden, large "cost" to be honest. Darwin would likely find Fisher's step-by-step coevolution more biologically plausible than the potentially large initial "leap" implied by pure handicap logic. He'd see Fisher as extending his own gradualist principle into sexual selection dynamics.

  3.  **Wallace's Shadow:** Darwin's decades-long battle with Wallace over natural selection's scope was deeply personal. Wallace relentlessly attacked sexual selection, *especially* female choice, precisely because he saw ornaments as useless or detrimental to survival. Zahavi's handicap principle, by making the ornament *honest* through *cost* (i.e., *linking it directly to survival/vigour*), is functionally **Wallace's solution**. It turns the peacock's tail into a utilitarian badge of quality. For Darwin, accepting handicap would be admitting Wallace was right all along about the *necessity* of utility – a bitter pill he spent years refusing to swallow. He explicitly rejected Wallace's arguments in *Descent*, doubling down on non-utilitarian beauty.

  4.  **"Capriciousness" as Feature, Not Bug:** Darwin revelled in the "capricious" nature of female choice. He saw it as analogous to human aesthetic preferences, which are often arbitrary and culturally specific. Fisher's model embraces this capriciousness – the initial preference *is* arbitrary. Zahavi's model demands the preference be *for an honest signal*, making it inherently utilitarian and non-capricious. Darwin would see this as stripping sexual selection of its unique, non-utilitarian character and subsuming it back under natural selection's umbrella (via signal honesty).

  5.  **The "Sick at Peacock Feather" Moment:** That visceral reaction stemmed from the tail's *apparent pointlessness for survival*. His solution (sexual selection) *embraced* that pointlessness. Fisher's model preserves this core insight – the tail's extravagance is *driven by* its pointlessness (or rather, its point *is* attraction itself). Zahavi's model *rescues* the tail from pointlessness by giving it a survival-related function. Darwin wouldn't need rescuing; he already found his answer in non-utilitarian attraction.

  6.  **The "Fisher Connection":** While Darwin wouldn't know Fisher personally, R.A. Fisher was a colossal figure in the *modern* synthesis of Darwinism with genetics. Fisher's deep reverence for Darwin and his work (famously calling natural selection "a theory of Darwin's") would resonate. Fisher's runaway feels like a direct mathematical descendant of Darwin's original aesthetic insight. Zahavi's idea, while brilliant, came from a different intellectual lineage focused on signalling theory.

  **Conclusion:** Darwin would see Fisher's runaway as the triumphant vindication and formalization of his own hard-won concept. It preserves the "taste for the beautiful" as the prime mover, embraces the gradualism he cherished, avoids capitulating to Wallace's utilitarian demands, and maintains the capricious, non-utilitarian essence he posited for sexual selection. Zahavi's handicap, despite its elegance and explanatory power for *some* signals, would feel to Darwin like a regressive step back into the utilitarian trap he spent so much effort escaping. He'd likely see it as Wallace's ghost winning the argument posthumously, and he wouldn't stand for that. Fisher's model *is* Darwin's "taste for the beautiful," quantified and unleashed.

