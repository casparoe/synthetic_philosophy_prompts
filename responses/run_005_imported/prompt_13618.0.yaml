prompt: |-
  Had a fun/slightly humbling experience at an ACX meetup a couple weekends ago: a few of us played a few rounds of the centipede game for actual (small) stakes, and just like every intro game theory write-up warns, nobody grabbed the pot on the first move. We all kept passing for a couple rounds before someone finally caved and took the money, and afterward there was this weird vibe like we'd each personally flunked a rationality test.

  Anyway, here's what's bugging me. The backward induction argument seems pretty airtight: at the last node the player obviously takes the bigger pile, so the second-to-last player, anticipating that, should take at their own node instead, and this unravels all the way back to the first move -- so as long as both players have common knowledge of each other's rationality (funny enough, apparently the same "common knowledge" guy, Aumann, is behind the agreement theorem that gets thrown around on LW alot), grabbing the pot immediately seems like the only outcome that's actually consistent with that assumption. So if backward induction really is just the correct derivation of what a rational, payoff-maximizing agent does here, is there any known technique (CFAR-style or otherwise) for training yourself to actually play it out, the way you might train away scope insensitivity or the planning fallacy? Or is passing for a few rounds not really a "bias" in the same sense at all -- more like some other kind of mistake that debiasing tools wouldn't even touch? Curious what I'm missing here, since the standard writeups always just seem to gesture at "humans are bad at game theory" without saying much more.
reasoning: |-
  Okay, let me start by unpacking the user's experience with the centipede game. They played it at an ACX meetup and no one took the pot on the first move, which led to a feeling of failing a rationality test. The user is confused because backward induction seems logically airtight, yet humans don't act that way. They're wondering if this is a bias that can be trained away or something else entirely.

  First, I need to recall how the centipede game works. Two players take turns passing or taking the pot. Passing increases the pot, but the other player can take it next. Backward induction says the last player will take the larger pot, so the previous one should take it earlier, leading to the first player taking it immediately. But in reality, people pass for a few rounds. 

  The user mentions common knowledge of rationality and Aumann's agreement theorem. So they're familiar with game theory concepts. Their main question is whether this behavior is a bias like scope insensitivity or planning fallacy that can be debiased, or if it's a different kind of mistake.

  I should consider why humans don't follow backward induction. One reason is that common knowledge of rationality is rarely present. In real life, players might doubt others' rationality or think they're altruistic. Also, the stakes were small, so people might value the social experience over winning. The "weird vibe" afterward suggests they felt irrational, but maybe their actions were rational given the context.

  Then there's the concept of iterated reasoning. Backward induction requires many steps of "I think that they think that I think..." Humans struggle beyond a few levels. In the game, they passed a couple of rounds before someone took it, showing limited iteration. 

  Another point: in a one-off game with no reputation, defecting makes sense. But humans often apply reciprocal strategies from repeated interactions. Even in a single game, social norms like fairness kick in. Taking immediately might feel greedy or rude, so people pass to appear cooperative.

  Is this a bias? Unlike cognitive biases, this might stem from heuristic thinking. Debiasing tools target miscalibrated probabilities or scope neglect, but here the issue is modeling opponents' minds. Training could involve practicing backward induction in games, but it's tricky. High stakes might make people take immediately, but low stakes allow exploring social dynamics.

  The user might also be seeking validation that their behavior wasn't irrational. They want to reconcile theory with experience. Emphasizing that passing isn't irrational per se, but context-dependent. Highlighting that game theory assumes perfect rationality, which doesn't hold in reality. Suggesting that understanding the gap between theory and practice is key, rather than forcing the theoretical solution.

  I should also address if CFAR techniques apply. Maybe mental simulations or explicit step-by-step reasoning drills. But stressing that human social instincts are strong and sometimes beneficial in repeated games. The real takeaway might be recognizing when common knowledge of rationality exists and adjusting accordingly, rather than always taking first.
answer: |-
  Your experience perfectly captures the fascinating tension between game theory's clean logic and messy human behavior. You're right that backward induction is *logically* airtight under strict common knowledge of rationality (CKR), but dismissing passing as mere irrationality misses crucial nuances. Here's a breakdown of what's happening and why "training" yourself to always grab immediately might be misguided or even counterproductive:

  1.  **The Air-Tight Logic (Under CKR):**
      *   You've summarized it perfectly: At the final node, Player 2 takes the larger pot. Knowing this, Player 1 at the penultimate node sees that passing yields less than taking immediately. This logic cascades backward, making taking on the first move the dominant strategy under CKR. Aumann's work formalizes this requirement for CKR.

  2.  **Why Humans (Even Rational-ish Ones) Pass:**
      *   **Common Knowledge of Rationality is Fragile:** This is the core issue. In a room of self-professed rationalists, *declaring* CKR is easy. *Truly internalizing it as common knowledge* is incredibly hard. Do you *really* know, beyond any shadow of a doubt, that your opponent:
          *   Believes *you* are perfectly rational?
          *   Believes *you* believe *they* are perfectly rational?
          *   Believes *you* believe *they* believe *you* are rational? (and so on, ad infinitum)?
      *   **Reciprocity & Social Heuristics:** Humans are wired for reciprocity. Passing signals cooperation and trust. Taking immediately signals selfishness/defection. Even in one-shot anonymous games, this heuristic is powerful. In a social meetup, the pressure to *appear* cooperative or avoid seeming greedy is strong ("weird vibe").
      *   **Limited Iterative Reasoning:** Backward induction requires iterated reasoning many steps deep. Humans are notoriously bad at this beyond 2-3 steps. In your game, passing for "a couple of rounds" suggests players could manage 2-3 steps of "If I pass, they *might* pass, then I *might* get more," but couldn't sustain it all the way back to the start. The first player *hopes* the second player isn't doing full backward induction.
      *   **Doubt About Opponent's Rationality/Payoffs:** Maybe Player 1 thinks Player 2 is altruistic, enjoys the game itself, values fairness highly, or is just irrational and will pass again. Maybe Player 1 doubts Player 2 believes *Player 1* is rational. Small stakes amplify this – the cost of testing for cooperation is low.
      *   **Induction Over Iteration:** Humans often rely on *induction* (past experience/general rules) rather than pure *iteration* (step-by-step calculation). Our induction tells us "cooperation often works" or "don't be the first to defect," overriding the specific game logic.
      *   **Signaling & Reputation (Even in One-Shot?):** In a social setting like a meetup, even a one-shot game has a tiny reputational element. Taking immediately labels you as "the defector." Passing labels you as a cooperator. People often value this social perception, especially with small monetary stakes.

  3.  **Is This a "Bias" Like Scope Insensitivity? Can It Be Trained?**
      *   **It's Different:** This isn't primarily a cognitive *bias* like scope insensitivity (misjudging scale) or planning fallacy (misjudging time/cost). It's more about:
          *   **Heuristic Application:** Using generally useful social heuristics (cooperate first) in a situation where they logically fail under strict assumptions.
          *   **Limited Computational Power:** Genuine difficulty performing deep iterative reasoning under uncertainty.
          *   **Model Uncertainty:** Inability to be certain about the opponent's model of you and the game (breaking CKR).
      *   **Can You Train "Grab Immediately"? (Maybe, but with Caveats):**
          *   **Explicit Reasoning Drills:** You *could* train yourself to explicitly run the backward induction argument *before* any similar game. Practice writing it out for different game lengths. Mentally simulate: "If I pass, what is the *absolute minimum* I can guarantee based on their *rational self-interest*?" This forces the logic.
          *   **High-Stakes Simulation:** Play the game repeatedly with much higher (but still affordable) stakes. The pain of losing significant money by passing when the opponent takes immediately can override the social heuristic faster. This leverages loss aversion.
          *   **Focus on the Opponent's Incentive:** Train yourself to ask: "What is the *strongest rational incentive* my opponent has at *their very next move*?" Work backward relentlessly from that.
          *   **CKR Mantra:** Internalize the mantra: "Unless I have *concrete, undeniable proof otherwise*, I must assume my opponent is rational, believes I am rational, and that we both understand the game structure perfectly. Therefore, backward induction holds."
      *   **Why Training Might Be Misguided or Limited:**
          *   **The World Isn't CKR:** Blindly applying "grab immediately" in the real world is often wrong. Many interactions *are* repeated, reputation *does* matter, opponents *aren't* perfectly rational, and cooperation *can* be optimal. Training yourself *only* for CKR scenarios makes you exploitable elsewhere.
          *   **Social Cost:** As you felt, grabbing immediately can have social costs (that "weird vibe"). Training yourself to ignore this might make you less effective in cooperative social or professional settings.
          *   **The Stakes Matter:** In low-stakes social games, the monetary loss from passing a few times is trivial compared to the social/psychological gain of playing cooperatively or the fun of the interaction itself. Training yourself to optimize tiny monetary gains over social harmony might not be desirable.
          *   **Model Uncertainty is Real:** Perfect CKR is almost impossible to *know* exists. Training yourself to *assume* it exists is an act of faith, not pure rationality. A truly rational agent should assign probabilities to the opponent's rationality and depth of reasoning.

  4.  **What You're Missing (The Bigger Picture):**
      *   **Game Theory Predicts *Equilibria*, Not Necessarily Behavior:** Backward induction finds the Nash Equilibrium under CKR. It doesn't claim this is the only possible outcome or even the most *common* human outcome; it claims it's the stable point *if* CKR holds.
      *   **The Centipede Game as a Paradox:** It's famous precisely *because* the logical solution feels counter-intuitive and is rarely played by humans. It highlights the chasm between idealized rationality and actual human psychology/sociality.
      *   **"Bounded Rationality" is Key:** Humans aren't irrational dolts; they are *boundedly rational*. They use reasonable heuristics that work well in most real-world situations (which involve repetition, noise, incomplete information, social ties) but fail in highly stylized, one-shot, perfect information, CKR scenarios like the textbook Centipede Game.
      *   **The Value of Signaling:** Passing early can be a rational *signal* if there's *any* doubt about CKR or if future interactions are possible. It says, "I'm willing to cooperate; are you?" This signal has value beyond the immediate payoff.

  **Conclusion & Recommendation:**

  Passing in the early rounds isn't simply a "debiasing" failure like scope insensitivity. It's the result of powerful, generally adaptive social heuristics and limited iterative reasoning clashing with a highly artificial scenario requiring perfect CKR and unlimited computation.

  *   **Can you train "grab immediately"?** Yes, for specific CKR scenarios: Practice explicit backward induction drills, simulate high-stakes outcomes, and conditionally hardwire the CKR assumption.
  *   **Should you always do this?** Probably not. It risks social friction in low-stakes settings and makes you exploitable in real-world interactions lacking perfect CKR.
  *   **A Better Goal:** Develop *meta-rationality*:
      1.  **Recognize the Game:** Quickly identify situations resembling the Centipede Game (sequential, perfect info, one-shot potential).
      2.  **Assess CKR Likelihood:** Honestly evaluate: How certain am I of *perfect* common knowledge of rationality? (Hint: Almost never 100%).
      3.  **Assess Stakes & Context:** Are stakes high enough to override social heuristics? Is there any reputational or repeated-game component?
      4.  **Choose Strategy Contextually:**
          *   *High Certainty of CKR + High Stakes + No Reputation:* Grab immediately (apply trained backward induction).
          *   *Low Certainty of CKR / Low Stakes / Social Context:* Consider limited cooperation (passing early rounds) as a probe or signal, but be prepared to defect earlier than your opponent based on your assessment of *their* likely reasoning depth and incentives. Understand you're accepting some risk for potential social or cooperative gain.

  Your experience wasn't failing rationality; it was a demonstration of how human rationality operates in the wild, constrained by social instincts, computational limits, and uncertainty about others' minds. The "weird vibe" was the friction between the idealized model and lived reality. The lesson isn't necessarily "grab faster," but to understand *why* grabbing immediately is logical under specific, often unrealistic, assumptions, and when those assumptions might not hold.
