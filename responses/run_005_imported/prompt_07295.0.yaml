  - **Mapping onto the Reductionist/Anti-Reductionist Divide**: The exchange shows the divide **breaking down** or evolving. Owen’s reliance on sub-personal mechanisms (Move 2) and local reductionism (Move 4) modernizes Hume but blurs into reliabilism, which anti-reductionists like Burge accept. Leah’s regress argument (Move 5) highlights anti-reductionism’s strength but doesn’t resolve how testimony differs from other sources. By Move 6, the debate shifts from "grounded vs. basic" to whether testimony’s regress is uniquely problematic—a question both camps struggle with. This suggests the traditional dichotomy is too simplistic; contemporary positions (e.g., Fricker’s local reductionism or Burge’s entitlement) exist on a spectrum.

