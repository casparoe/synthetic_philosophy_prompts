  - **Move 2 (Owen)**: **Score 2**  
    Owen’s response is decisive. He grants Leah’s observation but reframes it: children’s "epistemic vigilance" (e.g., modulating trust based on speaker confidence or consistency with prior beliefs) shows that reliability-tracking operates sub-personally, even if not introspectively accessible. This undercuts Leah’s claim that trust must be epistemically basic by demonstrating that early cognition involves implicit inference-like processes. It draws on contemporary empirical work (e.g., studies by Sperber or Harris) to modernize reductionism, making it more plausible than Hume’s original formulation.

  - **Move 3 (Leah)**: **Score 1**  
