  - **Move 4 (Owen)**: **Score 2**  
    Owen’s counter is decisive. He clarifies that "local reductionism" (à la Fricker) doesn’t require global inductive grounding or conscious reasoning, only that case-specific reasons (e.g., speaker sincerity, claim mundanity) are available to an attentive hearer when needed. This deftly avoids Leah’s sub-personal critique by showing how automatic processing can coexist with justificatory resources that are accessible upon reflection. It strengthens reductionism by making it psychologically realistic and less vulnerable to the "starting problem" raised in Move 1.

  - **Move 5 (Leah)**: **Score 2**  
    Leah lands a decisive blow. She exposes a deeper regress: Owen’s "available in principle" reasons (e.g., judging sincerity or mundanity) rely on background beliefs overwhelmingly acquired through testimony. This circularity—using testimonial beliefs to justify testimony—can’t be resolved without hitting a foundation of unvetted trust. Her point reinforces anti-reductionism’s core argument (seen in Coady) and shows local reductionism hasn’t escaped the regress. Owen’s framework now appears unstable.

