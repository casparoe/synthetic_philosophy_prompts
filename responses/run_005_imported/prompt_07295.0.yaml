    Owen’s response is reasonable but incomplete. He correctly notes that regresses aren’t unique to testimony (e.g., perception bottoms out in unexplainable seemings) and that holistic coherence can justify practices without infinite backtracking. This coherentist move (akin to Sellars or Davidson) is a standard reductionist reply and wisely cautions against overusing regress to "make everything basic." However, it doesn’t fully address Leah’s circularity concern: testimony’s reliance on itself for background beliefs makes it uniquely vulnerable, unlike perception, which has a more direct causal connection to the world. His point is valid but feels like a sidestep rather than a resolution.

