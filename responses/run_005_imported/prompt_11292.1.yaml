  Example (from some textbook):

          L    R
      A   1    1
      B   3    0
      C   0    3

  Check pure strategies:
  - A vs B: A=1<3 in L, A=1>0 in R -> no dominance.
  - A vs C: A=1>0 in L, A=1<3 in R -> no dominance.
  - B vs C: B=3>0 in L, B=0<3 in R -> no dominance.

  Now, consider a mixed strategy: play B and C each with probability 1/2.

  Payoff against L: (1/2)*3 + (1/2)*0 = 1.5
  Payoff against R: (1/2)*0 + (1/2)*3 = 1.5

  Now compare to A: 
      Against L: A gives 1 < 1.5 -> mixed better.
      Against R: A gives 1 < 1.5 -> mixed better.

  Therefore, the mixed strategy (1/2 B, 1/2 C) strictly dominates A (because it gives 1.5 in both cases, which is more than A's 1 in both). So A is dominated by this mixed strategy.

  Thus, if we only check pure strategies, A survives because no pure strategy dominates it. But when we allow mixed strategies, we find that A is dominated by a mixture of B and C.

  This is the key point.

  In iterated elimination of dominated strategies, if we restrict to pure strategies only, we might leave in strategies that are in fact dominated by a mixed strategy. The correct procedure (to get the full rationalizability concept) requires checking against mixed strategies as well.

  Now, about rationalizability: 
  Rationalizability is the idea that players will only play strategies that are best responses to some belief about the opponents' strategies. A strategy is rationalizable if it survives the iterated elimination of strategies that are never best responses. 

  It turns out that a strategy is never a best response to any (possibly correlated) beliefs about the opponents if and only if it is strictly dominated by some mixed strategy (for finite games). This is a fundamental result.

  So the process of iterated elimination of strictly dominated strategies (by mixed strategies) leads to the set of rationalizable strategies.

  Now, the issue with three or more players: 
  The standard definition of rationalizability (and the elimination of dominated strategies) in two-player games assumes that players hold independent beliefs about the other player. However, in games with more than two players, there is a distinction between independent beliefs and correlated beliefs.

  In the independent case, a player's belief about the strategies of the other players is a product distribution (each opponent chooses independently). In the correlated case, a player can have a belief that the opponents' strategies are correlated (even though they choose independently, the player's belief can be a correlated distribution).

  When we eliminate dominated strategies in the independent case, we get a larger set than in the correlated case. Why? Because in the correlated case, a player can have more nuanced beliefs, so a strategy that is never a best response under correlated beliefs might be a best response under independent beliefs.

  Example for three players:

  Consider a three-player game where each player has two strategies. Suppose we are focusing on player 1.

  Player 1 might have a strategy that is a best response only when players 2 and 3 are playing in a correlated way (for example, both playing high or both playing low). If we force independent beliefs, then player 1 might not be able to have a belief that correlates players 2 and 3, so that strategy might be eliminated under correlated rationalizability but survive under independent rationalizability.

  However, the formal details are a bit involved. But the key point is that the set of rationalizable strategies (and hence the outcome of iterated elimination) can be different depending on whether we allow correlated beliefs or not, for games with three or more players.

  In summary:

  1. To properly eliminate dominated strategies, we must consider domination by mixed strategies. A strategy might not be dominated by any pure strategy but can be dominated by a mixed strategy (as in the example above with A, B, and C and payoffs (1,1), (3,0), (0,3)).

  2. This mixed strategy domination is what connects to rationalizability: the set of strategies that survive iterated elimination of mixed-strategy dominated strategies is exactly the set of rationalizable strategies.

  3. In games with three or more players, the concept of rationalizability (and hence the elimination process) bifurcates into two: one where beliefs are independent and one where they can be correlated. The set of rationalizable strategies under correlated beliefs is a subset of that under independent beliefs.

  I hope this helps!
answer: |-
  ### Beyond the Toy Examples: Why Mixed Strategies Matter in Dominance

  You've hit on a crucial nuance that many popular explainers gloss over: the textbook definition of "dominated strategies" requires considering domination by *mixed strategies*, not just pure ones. Let's break this down with a concrete example, then connect it to rationalizability and multi-player quirks.

  #### The Pure-Strategy Blind Spot: A Minimal Example
  Consider this two-player game. Player 1 chooses rows (A, B, C), Player 2 chooses columns (L, R), and payoffs are for Player 1:

  |       | **L** | **R** |
  |-------|-------|-------|
  | **A** | 1     | 1     |
  | **B** | 3     | 0     |
  | **C** | 0     | 3     |

  **Step 1: Pure-vs-pure checks (the naive approach)**  
  - **A vs. B**:  
    - If Player 2 plays L: A=1 < B=3 → B better.  
    - If Player 2 plays R: A=1 > B=0 → A better.  
    → No dominance.  
  - **A vs. C**:  
    - L: A=1 > C=0 → A better.  
    - R: A=1 < C=3 → C better.  
    → No dominance.  
  - **B vs. C**:  
    - L: B=3 > C=0 → B better.  
    - R: B=0 < C=3 → C better.  
    → No dominance.  

  *Result*: No strategy is dominated by any pure strategy. All three survive.  

  **Step 2: Allow mixed strategies**  
  Now consider a **mixed strategy** for Player 1: play B with 50% probability and C with 50% probability. Its expected payoffs:  
  - Against L: (0.5 × 3) + (0.5 × 0) = 1.5  
  - Against R: (0.5 × 0) + (0.5 × 3) = 1.5  

  Compare this to **A**:  
  - Against L: A=1 < 1.5 → mixed is better.  
  - Against R: A=1 < 1.5 → mixed is better.  

  → **A is strictly dominated by the mixed strategy (0.5B, 0.5C)**.  

  *Why pure checks missed this*:  
  - A isn't beaten by B *or* C alone in all cases.  
  - But a **mix of B and C** leverages their complementary strengths: B excels against L, C against R. The blend guarantees 1.5 regardless of Player 2's move, while A only gets 1.  

  #### Key Insight: What Dominance *Really* Means
  - **Strict dominance**: A strategy \(s_i\) is strictly dominated if there exists *any other strategy (pure or mixed)* that yields a strictly higher payoff *against every possible profile of opponents' strategies*.  
  - **The gap**: In games with ≥3 strategies per player, a strategy like A can dodge pure-vs-pure comparisons but still be "outflanked" by a clever mixture. This is why Osborne/Rubinstein (and rigorous game theory) insists on mixed strategies for dominance checks.  

  ---

  ### Connecting to Rationalizability
  Rationalizability asks: *"What strategies could a rational player justify, given some belief about opponents?"*  

  - **The link to dominance**:  
    - **A strategy is strictly dominated ⇔ It is never a best response to any belief about opponents** (for finite games).  
    - *Your friend's PhD-level insight*: Iterated elimination of mixed-strategy-dominated strategies converges to the set of **rationalizable strategies**.  
      - Each round removes strategies that are never best responses.  
      - Surviving strategies can be "rationalized" by *some* belief (even weird or implausible ones).  

  - **Why mixed strategies matter here**:  
    If you only eliminate pure-dominated strategies (like in toy examples), you might leave in strategies that are *never* best responses (like A above). Mixed strategies close this gap.  

  ---

  ### The Multi-Player Twist: Correlated Beliefs
  In games with **≥3 players**, rationalizability bifurcates:  
  - **Independent rationalizability**: Players believe opponents act *independently*.  
  - **Correlated rationalizability**: Players believe opponents' strategies *could be correlated* (e.g., "If Player 2 does X, Player 3 likely does Y").  

  **Why this changes elimination**:  
  - With independent beliefs, Player 1 assumes Players 2 and 3 randomize independently.  
  - With correlated beliefs, Player 1 can entertain beliefs like "Players 2 and 3 are likely to coordinate against me."  

  **Example of the difference**:  
  Consider a 3-player game where Player 1 chooses U/D, Player 2 chooses L/R, Player 3 chooses A/B. Payoffs for Player 1:  
  - U gets 1 if (L and A) or (R and B), else 0.  
  - D always gets 0.5.  

  - **Correlated beliefs**:  
    Player 1 can believe "Players 2 and 3 will correlate: either (L and A) or (R and B)."  
    → U is a best response (gets 1 > 0.5).  
  - **Independent beliefs**:  
    Player 1 *must* assume Player 2/3 act independently.  
    → If Player 2 plays L (50%) and Player 3 plays A (50%), then U only pays 0.5 × 0.5 = 0.25 < 0.5.  
    → U is *never* a best response under independence.  

  *Result*:  
  - U survives correlated rationalizability.  
  - U is eliminated under independent rationalizability.  

  **The takeaway**:  
  In ≥3-player games, iterated elimination under:  
  - **Correlated beliefs**: Fewer strategies survive (more are eliminated).  
  - **Independent beliefs**: More strategies survive (fewer are eliminated).  
  This is why advanced texts specify "correlated" or "independent" rationalizability.  

  ---

  ### Writing Your Piece: Cutting Through the Hand-Waving
  1. **For dominance**: Explicitly note that "dominated" means dominated by *any mixed strategy*. Use the A/B/C example to show why pure checks fail.  
  2. **For rationalizability**: Position it as the "belief-based" twin of dominance. Mention that mixed strategies are the glue.  
  3. **For multi-agent AI**:  
     - Poker AIs (like Pluribus) use *correlated* beliefs (opponents' strategies can interact).  
     - Simpler bots might assume independence.  
     → This affects which strategies get pruned during training.  

  This gives you the guts to move beyond "dominated strategies" as a buzzword. The math is deep, but the intuition is about *covering all angles of outmaneuvering opponents*—pure, mixed, or correlated.
