  Hey, I'm working on a longer piece about how game theory shows up in multi-agent AI systems (think negotiation bots, or the poker- and Diplomacy-playing AIs that keep making headlines), and I went down a rabbit hole trying to actually understand "iterated elimination of dominated strategies" instead of just name-dropping it like most explainers do. Every popular version shows the same toy case, where a strategy is dominated by one single other strategy and gets crossed off, round after round, til you're left with the "rational" options. But then a friend doing his econ PhD lent me an old game theory textbook (Osbourne and Rubinstein, I think) and there's a bit in there saying that if you only ever compare pure strategies against each other, you can actually miss strategies that should get eliminated -- apparently a strategy can survive every single pure-strategy comparison and still count as "dominated" once you allow it to be beaten by some mix of two or more other strategies. That genuinely broke my brain a little and my friend wasn't able to explain it well over text.

  Could you walk me through why that's true, ideally with a small example of a strategy that would wrongly survive if you only checked pure-vs-pure dominance? And if theres room, I also heard, second-hand and possibly garbled, that this mixed-strategy-dominance business is exactly what connects the concept to "rationalizability," and that something strange happens once you get to three or more players -- something about whether a player's beliefs about their different opponents are allowed to be "correlated" with each other, which apparently changes which strategies get eliminated. I don't need a fully formal proof of any of this, just enough of the actual mechanics that I can stop hand-waving at "dominated strategies" whenever it comes up in my drafts.
