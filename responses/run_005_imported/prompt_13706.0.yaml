prompt: |-
  So this went down at the semi-regular poker-and-forecasting meetup my group runs (a bunch of us met through LW and ACX originally, if that tells you anything about the vibe), and I haven't been able to stop replaying it. My friend Marcus, who does prop betting on the side, was arguing that you should basically always size bets with full Kelly, because Kelly is *the* growth-optimal strategy: if you bet the Kelly fraction, then with probability 1 your bankroll eventually overtakes the bankroll of anyone running a meaningfully different fixed strategy, given enough repeated bets. My other friend Elena, who does quant risk for a living, said "eventually, given enough bets" is doing a ton of unearned work, since real people get a finite number of bets before they run out of edge or capital, and over any realistic horizon full Kelly has a genuine shot at loosing 50-70% of your stack at some point, which is exactly why every actual fund or pro bettor she's ever read about runs half- or quarter-Kelly instead.

  Marcus's reply was that this isn't really a counterargument, it's a category error: the log utility baked into Kelly already prices in drawdown risk (that's precisely why Kelly never bets your whole stack on a positive-EV wager), so if you want less variance than full Kelly gives you, you're not being "more prudent," you've just quietly adopted a different, non-log utility function for wealth -- and you should say so, instead of talking as if half-Kelly is a free-lunch improvement on the objectively correct bet size. Elena's comeback to that was that this is the exact move the ergodicity-economics crowd (Ole Peters and co, the stuff that made the rounds on LW/ACX a few years back) always pulls: "maximizes almost-sure long-run growth rate" and "maximizes my expected utility over the horizon I actually have" are different criteria that only coincide for log utility in the infinite limit, so presenting full Kelly as the rational bet size, rather than the size that's optimal under one specific utility function plus one specific asymptotic criterion, is the actual overclaim here -- and Marcus, in her telling, was just smuggling that same conflation back in by treating any non-log utility function as a euphemism for cowardice.

  Neither of them budged and it kind of killed the vibe for the rest of poker night. I've read enough on this stuff to know both of them are gesturing at something real, but not enough to actually settle it myself. Could you go through this move by move -- Marcus's opening claim, Elena's finite-horizon reply, Marcus's "that's just a different utility function" comeback, and Elena's "ergodicity-economics sleight of hand" closer -- and say who's got the better of each specific move, not just who wins overall? I'd also genuinely like to know if there's some third framing neither of them reached for that would dissolve this instead of just restating one side more forcefully.
reasoning: |-
  Okay, let me try to unpack this poker-night debate. Marcus is pushing full Kelly as the objectively optimal strategy because it maximizes long-term growth. Elena counters that in the real world with finite bets, full Kelly's volatility is too risky, and professionals use fractional Kelly for a reason. 

  Hmm, the key tension seems to be between infinite-horizon theory and finite-practice reality. Marcus frames anything less than full Kelly as secretly using a different utility function. Elena fires back that this is an ergodicity-economics trick - conflating asymptotic optimality with what's rational for mortals.

  I recall Kelly criterion does have scary drawdowns - like 50% loss probability even on +EV bets. That's brutal if your career or fund lifespan is shorter than "eventually." Meanwhile, half-Kelly cuts risk dramatically while keeping most growth. But Marcus isn't wrong about the math - if you could play forever, full Kelly dominates.

  Wait, maybe the real issue is how we define "optimal." For an immortal with linear utility? Full Kelly. For a human with career risk and mental anguish? Probably fractional. Elena's quant experience explains why funds use fractions - survival matters. Marcus's prop-betting view might underestimate real-world constraints.

  The ergodicity point is sharp: maximizing almost-sure long-run growth isn't the same as maximizing expected utility over 100 bets. Only under log utility do they align in infinity. So when Marcus dismisses fractional Kelly as "just different utility," he's accidentally proving Elena's point - it IS different utility because humans have different needs!

  Neither is fully wrong, but Elena's framing feels more practical. Still, I wonder if framing this as "adaptive sizing" could bridge the gap - maybe start fractional and adjust as your edge compounds? Though that opens new cans of worms...
answer: |-
  Let's break this down move-by-move, evaluating the technical and philosophical arguments on both sides. The core tension is between asymptotic optimality and finite-horizon risk management, wrapped in utility theory and ergodicity critiques.

  ### 🃏 **Marcus's Opening Claim**:  
  *"Full Kelly is growth-optimal; it dominates any other fixed strategy with probability 1 over infinite bets."*  
  ✅ **What he gets right**:  
  - Mathematically, Kelly *does* maximize the asymptotic growth rate.  
  - It avoids ruin (never bets entire bankroll on finite-EV bets).  
  - Any strategy betting a fixed fraction larger than Kelly has a positive probability of ruin.  

  ❌ **Where he overreaches**:  
  - "Probability 1" and "eventually" require *infinite trials*. No human or fund faces infinite bets.  
  - Ignores *path dependence*: Your strategy can be "optimal" in the limit while still causing crippling drawdowns that end your betting career prematurely.  

  ### 🔮 **Elena's Finite-Horizon Reply**:  
  *"Real actors face finite bets and capital constraints. Full Kelly has unacceptable drawdown risk (50-70% loss probabilities) over practical horizons."*  
  ✅ **What she gets right**:  
  - Empirical reality: Funds/pro betters use fractional Kelly (1/2, 1/4) to reduce volatility.  
  - Probability of large drawdowns under full Kelly is significant:  
    - Chance of losing ≥50% of your bankroll before doubling it is **~50%** for a +EV bet.  
    - Half-Kelly reduces this to ~20% (and quarter-Kelly to ~5%).  
  - **Survival > Asymptotic Optimality**: If a 50% drawdown triggers fund redemptions or career failure, "long-run dominance" is irrelevant.  

  ❌ **Potential gap**:  
  - Doesn't explicitly refute Kelly's *theoretical* optimality—just its *pragmatic* applicability.  

  ### ⚖️ **Marcus's "Different Utility Function" Comeback**:  
  *"Wanting less variance than full Kelly means you don't have log utility. Admit you're optimizing a different objective."*  
  ✅ **Technically correct**:  
  - Kelly is *only* optimal for maximizing *expected log wealth*.  
  - If you use a fractional Kelly strategy, it’s equivalent to maximizing expected utility under a **more risk-averse utility function** than log (e.g., power utility with γ>0).  

  ❌ **Philosophically flawed**:  
  - Framing non-log utility as "cowardice" or "irrational" is a value judgment. Log utility is *one* choice, not a gold standard.  
  - **Conflates normative prescription with positive math**: Kelly is optimal *given log utility*. But why should humans or funds adopt log utility?  

  ### 🔄 **Elena's "Ergodicity Sleight of Hand" Closer**:  
  *"Marcus is conflating asymptotic growth with finite-horizon utility. Only log utility aligns these in the infinite limit."*  
  ✅ **Devastatingly accurate**:  
  - The ergodicity economics critique (Ole Peters) applies directly:  
    - **Time-average growth** (what you experience over a finite path) ≠ **ensemble-average growth** (expected value over all paths).  
    - Kelly optimizes the ensemble-average of log wealth. For finite horizons, optimizing time-average growth may require different strategies.  
  - Log utility is *special* because it makes these two averages coincide *only in the infinite limit*. For finite horizons, other utility functions may better align with human goals (e.g., avoiding ruin).  

  ❌ **Possible overstatement**:  
  - While funds use fractional Kelly for risk control, it’s not *only* due to ergodicity concerns—liquidity constraints, psychology, and career risk matter too.  

  ---

  ### 🏆 **Who Won Each Move?**  
  1. **Marcus's opening**: Weak. Overstated asymptotic math as prescriptive for real-world betting.  
  2. **Elena's reply**: Strong. Anchored in practical constraints and empirical norms.  
  3. **Marcus's comeback**: Technically sound but strategically weak. Exposed his implicit bias for log utility as "rational."  
  4. **Elena's closer**: Knockout. Revealed the false equivalence in Marcus’s framing.  

  **Overall winner**: **Elena**. Her critique integrates the math of finite horizons and the philosophy of ergodicity, forcing Marcus to defend log utility as inherently "correct"—a position hard to justify.  

  ---

  ### 🔮 **The Third Framing: Dissolving the Debate**  
  The stalemate arises because both assume a **fixed fraction strategy** (full vs. fractional Kelly). A better framework incorporates **dynamic bankroll management**:  

  1. **State-Dependent Sizing**:  
     - Adjust bet size based on remaining horizon, current bankroll, and *remaining edge*.  
     - Example: Bet full Kelly early, but switch to fractional Kelly as you approach your horizon (e.g., "I have 100 bets left in my career").  

  2. **Explicit Utility Maximization**:  
     - Admit that "optimal" depends on your goal:  
       - Log utility → Full Kelly.  
       - Survival → Fractional Kelly.  
       - Sharpe ratio → Even smaller sizing.  
     - *All are rational* given different objectives.  

  3. **Bayesian Edge Decay**:  
     - Edges fade (markets adapt, poker metas shift). Betting full Kelly assumes *permanent* edge—a fatal flaw.  
     - Size bets conservatively to hedge against edge erosion.  

  ### 💡 **Key Insight**:  
  **Fractional Kelly isn’t a "suboptimal approximation" of full Kelly—it’s the optimal strategy under more realistic utility functions and finite horizons.** Marcus is right that it implies different preferences, but Elena is right that those preferences aren’t "wrong"—they’re *necessary* for survival.  

  > "Kelly is the answer to a math problem. Real life is a different problem."  
  > — *Elena, probably, on the ride home.*
