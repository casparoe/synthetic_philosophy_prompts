prompt: |-
  I somehow ended up on my county's pretrial risk-assessment oversight committee (they wanted "an ethicist," apparently), and we've got a genuinely gnarly case for Thursday's meeting. Our recidivism tool used to be calibrated -- a "high risk" score meant the same actual reoffending rate regardless of race -- until it came out that among people who were never rearrested, one racial group got flagged high-risk almost twice as often as another. The vendor recalibrated the tool to equalize those error rates, but now "high risk" corresponds to a different actual probability depending on race, so it isn't calibrated anymore -- which the defense bar says is its own kind of unfairness. Half the committee wants to keep the recalibrated version, half wants to revert, and apparently theres a proof that you cant have both once base rates differ between groups. Can you draft the memo I'll bring recommending what we actually do -- keep it, revert it, or drop the tool -- with a timeframe, and engage seriously with whichever side you don't recommend rather than just noting they have a point?
reasoning: |-
  We are facing a classic fairness dilemma in risk assessment tools. The two competing notions of fairness here are:
  1. **Calibration (Predictive Parity)**: For any given risk score, the actual probability of recidivism should be the same across groups. In this case, the tool was initially calibrated so that a "high risk" score meant the same actual reoffending rate regardless of race.
  2. **Error Rate Balance (Equal False Positive Rates)**: The rate at which non-reoffenders are incorrectly classified as high risk (false positives) should be equal across groups.

  The problem is that when base rates (the actual reoffending rates) differ between racial groups, it is mathematically impossible to satisfy both conditions simultaneously (as noted by the proof mentioned).

  In the original tool:
  - Calibration was achieved: P(reoffense | high risk, group A) = P(reoffense | high risk, group B)
  - However, the false positive rates (FPR) were not equal: P(high risk | no reoffense, group A) was almost twice that of group B.

  The vendor recalibrated the tool to equalize the false positive rates (i.e., for non-reoffenders, the rate of being flagged high risk is the same across groups). This broke calibration: now a "high risk" score corresponds to different actual reoffending probabilities for different racial groups.

  The defense bar argues that this is unfair because two individuals with the same risk score are being treated as having the same risk level, but in reality, the actual risk differs by race.

  **Recommendation**:
  I recommend that the committee **keep the recalibrated version** of the tool (the one with equal false positive rates) and not revert to the old version. However, I also suggest that the committee work towards a longer-term solution that may involve re-evaluating the use of the tool or developing a more nuanced approach.

  **Reasoning**:
  1. **The Problem with the Original Tool (Calibrated but Unequal FPR)**:
     - The original tool had a disparate impact on one racial group in terms of false positives. This means that non-reoffenders from one group were being incorrectly labeled as high risk at a much higher rate than another group. This is a serious fairness concern because it leads to more individuals from that group being detained pretrial unnecessarily, which has severe consequences (loss of liberty, job, housing, etc.).
     - Even if the tool was calibrated, the harm of false positives is not evenly distributed. This disparity in false positives can perpetuate and exacerbate existing inequalities.

  2. **The Recalibrated Tool (Equal FPR but Not Calibrated)**:
     - By equalizing false positive rates, the tool now avoids disproportionately flagging non-reoffenders in one racial group. This is a step towards fairness in the sense of equalizing the burden of errors.
     - The lack of calibration (i.e., the same risk score meaning different actual risks across groups) is a concern because it might lead to different interpretations of the same score. However, note that the tool is still predictive. The risk score for each individual is still meaningful within their group context. The problem arises when we use a single threshold (like "high risk") for decisions without adjusting for the group-specific meaning.

  3. **Why Equalizing False Positive Rates is Preferable**:
     - In the pretrial context, a false positive (detaining someone who would not have reoffended) is a very costly error. It deprives an innocent person of liberty and can have cascading negative effects. Therefore, ensuring that this error is not disproportionately borne by one racial group is a critical fairness consideration.
     - On the other hand, the lack of calibration might be addressed by using group-specific thresholds or by providing the actual risk estimates (by group) to decision-makers. However, note that using group membership explicitly in decision-making may raise legal and ethical concerns (e.g., equal protection). Alternatively, we can acknowledge that the risk score is a piece of information and that decision-makers should consider the context (including base rates) when interpreting it.

  4. **Addressing the Defense Bar's Concern**:
     - The defense bar is right to point out that the same risk score now has different meanings. This is a form of unfairness because two individuals with the same score but from different groups have different actual risks. However, note that the alternative (the original tool) had a different kind of unfairness: it was more likely to falsely flag non-reoffenders in one group.
     - We must weigh the harms. The harm of a false positive (detaining a non-reoffender) is severe and immediate. The harm of the lack of calibration is that it might lead to inconsistent decisions if the same threshold is used without adjustment. However, this can be mitigated by:
       - Training decision-makers to understand the tool's limitations and the context of base rates.
       - Providing the actual risk estimates (by group) along with the score, so that judges can make informed decisions.
       - Considering a move towards using the risk score as one of many factors, and perhaps moving away from binary "high risk" labels.

  5. **Long-term Solution**:
     - The committee should recognize that no statistical fix can achieve both calibration and equal false positive rates when base rates differ. Therefore, we must choose which fairness criterion to prioritize. Given the high stakes of false positives in pretrial detention, I believe equalizing false positive rates is the more just approach.
     - However, we should also acknowledge that risk assessment tools are inherently limited and can perpetuate bias. The committee should consider:
       - **Phase out the tool?** In the long run, we might want to move away from such tools. There is growing evidence that even "fair" algorithms can entrench disparities. We could set a timeline (e.g., 2 years) to develop and transition to alternative approaches that focus on individualized assessments and community-based supports.
       - **Improve the tool?** Work with the vendor to develop a more transparent and fair tool. This might involve:
          - Disaggregating the data and building separate models for different groups (but note: this might be legally problematic and also requires sufficient data).
          - Using more features that are not proxies for race and are causally related to recidivism.
          - Continuously monitoring and auditing the tool for fairness and accuracy.

  **Timeline**:
  - **Immediate (next 1 month)**: Keep the recalibrated tool. Provide training to judges and other decision-makers on how to interpret the scores in light of the recalibration (i.e., explain that the same score might have different meanings by group, and provide group-specific risk estimates if possible).
  - **Short-term (next 6 months)**: Commission an independent audit of the tool to evaluate its overall impact on different racial groups, including not only false positives but also false negatives (which we haven't discussed much). Also, collect data on the outcomes of pretrial release decisions to see if the recalibration is having the intended effect.
  - **Medium-term (next 1-2 years)**: Explore and develop alternative approaches to pretrial risk assessment that reduce reliance on algorithms that may be inherently biased. This could include:
     - Investing in community-based pretrial services that support individuals regardless of risk score.
     - Implementing a system of individualized assessments that consider a broader set of factors (including social context) and that are reviewed by a diverse panel.
     - Considering a move towards a system that minimizes the use of monetary bail and detention, focusing instead on release with support.
  - **Long-term (2+ years)**: Aim to phase out the current risk assessment tool in favor of a more holistic and less discriminatory system.

  **Engaging with the Other Side**:
  To those who want to revert to the original calibrated tool:
     - I acknowledge that having a consistent meaning for "high risk" is important for equal treatment. It is troubling that the same score now predicts different outcomes by race. This might lead to inconsistent decisions and could be perceived as unfair because two individuals with the same score are being told they have different risks.
     - However, reverting would mean returning to a system where one racial group is much more likely to be falsely labeled as high risk. This is a direct harm that falls disproportionately on that group. We must consider the real-world consequences: more people from that group will be detained pretrial who would not have reoffended. This is a violation of the principle of distributive justice and may also violate equal protection under the law.
     - The goal of pretrial risk assessment should be to minimize harm. The harm of unnecessary detention is severe and falls on the most vulnerable. Therefore, we should prioritize reducing the disparate impact of false positives.

  **Conclusion**:
  We recommend keeping the recalibrated tool for now, but we must treat this as a temporary solution. The committee should work towards a more fundamental reform of the pretrial system that reduces reliance on risk assessment tools that are forced to make trade-offs between fairness definitions. We must also invest in pretrial services that support all individuals, regardless of risk, to ensure that we are not merely managing risk but also addressing the root causes of recidivism.

  Respectfully submitted,
  [Your Name]
  Ethicist, Pretrial Risk-Assessment Oversight Committee
answer: |-
  ### Memorandum  
  **To:** Pretrial Risk-Assessment Oversight Committee  
  **From:** [Your Name], Committee Ethicist  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on Risk-Assessment Tool: Keep Recalibrated Version with Mitigations  

  ---

  ### **Summary**  
  After thorough analysis, I recommend **keeping the recalibrated version** of the risk-assessment tool (which equalizes false positive rates across racial groups) while implementing immediate mitigations to address fairness concerns. Reverting to the old tool would reintroduce disproportionate harms to one racial group. However, no version of this tool can fully resolve the fairness dilemma under differing base rates. Thus, we must pair this tool with policy safeguards and plan to phase it out within 18–24 months while developing race-conscious alternatives. Below, I detail the reasoning, engage with opposing views, and propose a timeline.  

  ---

  ### **1. Core Conflict: The Impossibility Theorem**  
  The committee faces a mathematical truth: **when recidivism base rates differ between racial groups, no tool can simultaneously achieve:**  
  - **Calibration:** "High risk" means the *same probability of reoffense* for all groups.  
  - **Error Rate Balance:** *Equal false positive rates* (FPR) across groups (i.e., non-reoffenders flagged as "high risk" at the same rate).  

  The original tool prioritized calibration but ignored FPR disparities, causing one group to be falsely labeled "high risk" at twice the rate of another. The recalibrated tool fixes this but sacrifices calibration. **Neither solution is "fair" in an absolute sense**—we must choose which harm to minimize.  

  ---

  ### **2. Recommendation: Keep the Recalibrated Tool**  
  #### **Why This Approach**  
  - **Mitigates Concrete Harms:** False positives (detaining non-reoffenders) inflict severe, irreversible damage: job loss, family separation, and coerced guilty pleas. The recalibrated tool reduces this harm for the disproportionately affected group.  
  - **Aligns with Moral Priorities:** Pretrial detention should err toward liberty when uncertainty exists. Equalizing FPR ensures no group bears an inequitable burden of errors.  
  - **Avoids Regressive Outcomes:** Reverting would worsen racial disparities in detention rates without improving accuracy.  

  #### **Engaging with the "Revert" Position**  
  Proponents of reverting argue calibration ensures "equal treatment": a "high risk" score signals identical risk regardless of race. This view is understandable—individuals with identical scores *should* face comparable consequences. However:  
  - **The Flaw:** Calibration alone ignores *why* scores differ. If historical bias (e.g., policing disparities) inflates recidivism predictions for a group, calibration entrenches systemic inequities. "Equal" predictions on unequal foundations are not neutral.  
  - **Real-World Impact:** Reverting would jail more innocent people from one group. This violates distributive justice and undermines trust in the legal system.  

  ---

  ### **3. Limitations of the Recalibrated Tool**  
  - **Loss of Calibration:** "High risk" now corresponds to different actual reoffense probabilities by race. This is statistically misleading and could incentivize judges to impose harsher terms on groups with lower base rates.  
  - **Does Not Address Root Causes:** The tool cannot fix biased policing, unequal access to counsel, or economic disparities that drive base-rate differences.  

  ---

  ### **4. Mitigation Strategies (Immediate)**  
  To address calibration concerns while using the recalibrated tool:  
  1. **Contextualize Scores in Reports:**  
     - Label risk categories with group-specific reoffense probabilities (e.g., "High risk: 40% reoffense likelihood for Group A; 25% for Group B").  
     - Add disclaimers: "Scores reflect systemic disparities; use alongside individual circumstances."  
  2. **Judge Training:** Mandate training on:  
     - Base-rate disparities and their drivers (e.g., over-policing).  
     - Avoiding over-reliance on algorithmic scores.  
  3. **Stricter Release Standards:** For groups where "high risk" now indicates lower actual risk, default to non-monetary release conditions (e.g., check-ins, phone monitoring).  

  ---

  ### **5. Timeline to Phase Out the Tool**  
  The recalibrated tool is a short-term bridge—not a solution. **Phase it out within 18–24 months** while pursuing systemic reforms:  

  | **Timeframe** | **Actions** |
  |---------------|-------------|
  | **Immediate (0–3 months)** | • Keep recalibrated tool with mitigations. <br> • Commission an audit of arrest/charging disparities affecting base rates. |
  | **Short-Term (3–12 months)** | • Pilot non-algorithmic assessments (e.g., procedural justice interviews). <br> • Develop a **race-conscious model** with input from impacted communities. |
  | **Long-Term (12–24 months)** | • Sunset the current tool. <br> • Replace with: <br> &nbsp;&nbsp;– A model using **causal factors** (e.g., employment, substance treatment access) instead of race-correlated proxies. <br> &nbsp;&nbsp;– **Decarceration initiatives** (e.g., expanded pretrial services) to reduce reliance on risk predictions. |

  ---

  ### **6. Why Not Drop the Tool Immediately?**  
  Abolishing the tool without alternatives risks regressing to subjective judgments, which studies show are *more* biased and less accurate than algorithms. The recalibrated tool—with transparency and mitigations—is the least harmful interim option.  

  ---

  ### **Conclusion**  
  Prioritizing equal false positive rates aligns with the imperative to "first, do no harm" to marginalized groups. However, calibration concerns expose the tool’s limitations in a racially unequal system. I urge the committee to:  
  1. **Vote to keep the recalibrated tool** with mandated mitigations.  
  2. **Commit to an 18-month sunset clause** contingent on developing equitable alternatives.  

  This path balances immediate harm reduction with accountability for transformative change. I welcome further debate at Thursday’s meeting.  

  ---  
  **Attachments**:  
  - [Research Summary: Fairness Trade-offs in Recidivism Prediction](hypothetical-link.com)  
  - [Draft Protocol for Non-Algorithmic Assessments](hypothetical-link.com)
