  ### **Seminar Discussion Prompts**
  1. **Conceptual**: If UDT requires adherence to forgotten commitments, is it demanding *irrational* ignorance? Or is "rational amnesia" part of optimality?
  2. **Formal**: How does UDT handle the driver if intersections are distinguishable? (Hint: It updates lawfully, unlike here.)
  3. **Philosophical**: Does UDT imply rationality is "timeless"? Contrast with Bratman’s planning theory.
  4. **Critical**: Is UDT a descriptive theory of agency or a normative ideal? Can bounded agents implement it?

  This pairing should spark rich debate on rationality, memory, and the structure of agency. For deeper dives, assign MacAskill (2016) on UDT and Aumann et al. (1997) on ODT’s response.
