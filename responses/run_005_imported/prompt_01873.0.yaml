  The deep point: selection pressure maintains the mapping once established, creating a self-sustaining system. It's not that organisms "choose" but that deviants get eliminated. That's evolutionary convention - a locked-in solution sustained by mutual dependencies. 

  Also worth noting: the argument that genetic code is more arbitrary than other biological relationships (e.g. enzyme-substrate binding which has physical constraints). Codon-amino acid pairs have no chemical necessity - that arbitrariness is code-like. 

  I should emphasize that dismissing it as "just metaphor" ignores how precisely the coding analogy predicts biological phenomena - like how frame shifts or nonsense mutations mirror data corruption. The explanatory power matters. 

  User's identity as engineer is key - they'll appreciate the system design perspective. Maybe compare to machine learning: neural nets develop internal representations that are arbitrary but functional, maintained by error correction. No conscious designer needed. 

