prompt: |-
  I'm a retired evolutionary biologist (34 years on sexual selection in birds, if it matters) whose spent the last year or so happily reading philosophy now that I don't have grad students to supervise anymore. Recently I got hooked on Sharon Street's "Darwinian Dilemma" paper against moral realism -- her argument that realists owe us an explanation of why natural selection, which pretty clearly shaped our evaluative attitudes because they promoted survival and reproduction rather than because they tracked mind-independent moral truths, would also have made us reliable trackers of those truths. Either there's no link between selection and the independent truths (so our moral beliefs are probably mostly off track), or realists have to posit a wildly convenient coincidence where tracking the truth and being fitness-enhancing just happen to line up. As a biologist this felt very familiar, and, honestly, pretty devastating.

  But then someone in my reading group pointed out the obvious follow-up worry: our logical and arithmetical faculties were surely shaped by selection too (theres a pretty clear fitness payoff for ancestors who could infer and count correctly), yet basically nobody thinks 2+2=4 or modus ponens gets "debunked" this way. So there's got to be some asymmetry that lets math and logic off the hook while morality stays on it. I've run across a few candidate asymmetries in my (admittedly amateur) reading -- that necessary truths make reliability trivially "safe" regardless of the process that produced the belief, that mathematical objects might be "plenitudinous" (every consistent structure exists, so there's nothing external left to fail to track), and that math is indispensable to our best science in a way moral facts aren't. What I'd like is for you to actually mount the hard-nosed case that none of these three moves restores the asymmetry -- argue, as rigorously as you can, for full "companions in guilt": that if Street's dilemma is fatal to robust moral realism, it's equally fatal to mathematical and logical realism, and nobody gets to keep their platonism just because it's about numbers instead of norms. Take each escape route at its strongest rather than swatting down a cartoon version of it.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a retired evolutionary biologist with a strong background in sexual selection in birds, now diving into philosophy. They've been grappling with Sharon Street's Darwinian Dilemma against moral realism and are now stuck on the asymmetry problem with math and logic. The core issue is why evolutionary debunking arguments seem to threaten moral realism but not mathematical realism. They want a rigorous defense of the "companions in guilt" position, challenging three common escape routes for math/logic.

  First, I need to recall Street's argument clearly. Her dilemma forces moral realists to explain why our evolved moral beliefs would track mind-independent truths. If evolution shaped our moral attitudes for fitness, not truth, then either there's no connection (so beliefs are off-track) or a massive coincidence. The user finds this compelling but is troubled by the apparent double standard when applied to math/logic.

  The user mentions three strategies to break the symmetry: necessary truths making reliability trivial, plenitudinous mathematical structures, and indispensability to science. I need to tackle each in a way that doesn't straw-man them. 

  Starting with necessary truths: The idea is that since math/logic truths are necessary, any belief-forming process that produces consistent true beliefs is reliable, regardless of evolution. But I need to argue that necessity alone doesn't solve the problem. Even necessary truths require reliable cognitive access. If evolution shaped our logical faculties for fitness, not truth, why think they're reliable? The contingency of our cognitive architecture matters. For example, evolution could have equipped us with different inference rules that are fitness-conducive but truth-distorting for necessary truths. The necessity of the truths doesn't guarantee that our particular belief-forming mechanisms are reliable. Also, if our logical intuitions are contingent products of evolution, why trust them for necessary truths? This parallels the moral case.

  Next, plenitudinous Platonism: If every consistent mathematical structure exists, then any consistent mathematical belief is true of some structure. But the problem is that our mathematical beliefs are specific. We believe in Peano arithmetic, not arbitrary systems. If evolution shaped our mathematical beliefs for fitness, why think they align with the structures we intend (like natural numbers)? The challenge is referential stability. Our cognitive mechanisms might latch onto any structure that aids survival, not the "correct" one. For instance, our number sense might be adaptive for small numbers, but why think it corresponds to the actual natural numbers in a plenitudinous universe? The underdetermination problem remains, similar to moral beliefs being adaptive but not necessarily tracking mind-independent truths.

  Indispensability: Math is crucial for science, which is empirically successful, so we're justified in believing in mathematical entities. But this shifts the burden. The evolutionary challenge is about the origins of our basic logical/mathematical faculties. Even if science relies on math, our innate cognitive tools for math/logic were shaped by evolution. If those tools are unreliable, the entire scientific edifice might be compromised. Moreover, the moral realist could argue for moral facts being indispensable in some domains (e.g., social sciences), but that's contentious. The key point is that indispensability doesn't address the evolutionary origins; it assumes the reliability of our faculties, which is what's under question.

  I should also consider the user's background. As a biologist, they'll appreciate detailed evolutionary mechanisms. Examples like spatial reasoning or probability biases could illustrate how adaptive heuristics might mislead in abstract math. Also, emphasizing the contingency of our cognitive evolution is important—our math/logic faculties are one adaptive solution among many possible non-truth-tracking alternatives.

  The user wants a hard-nosed case, so rigor is key. Need to avoid hand-waving. Each counter-argument should directly address the strongest form of the escape route. Also, the conclusion should reinforce that without an independent reason to trust our faculties, both domains are equally vulnerable, pushing the realist to either accept global skepticism or find another solution.
answer: |-
  Here’s the hard-nosed case for "companions in guilt," dismantling the strongest versions of the three escape routes and arguing that if Street’s dilemma sinks robust moral realism, it equally sinks mathematical/logical realism. We’ll grant each move its strongest formulation and show why the evolutionary challenge remains equally potent for both domains.

  ### Core Challenge Recap (Street's Dilemma Generalized)
  - **The Problem**: Evolution selects for cognitive faculties that produce *fitness-enhancing* beliefs, not necessarily *true* beliefs. For any domain of purported mind-independent truths (moral, mathematical, logical), the realist must explain why selection would have produced faculties reliable for tracking *those specific truths*. Absent such an explanation, we face a disjunction: either (1) our faculties are unreliable for that domain, or (2) a massive coincidence aligns truth-tracking with fitness-enhancing outcomes.
  - **Symmetry Premise**: Our basic logical/arithmetical capacities (e.g., proto-counting, causal inference, pattern recognition) are uncontroversially products of natural selection. Fitness payoffs for avoiding predators, tracking resources, or navigating social hierarchies favored crude but effective versions of these capacities.

  ---

  ### Escape Route 1: Necessity Guarantees Reliability  
  **Strongest Formulation**:  
  > Necessary truths (like 2+2=4 or modus ponens) are true in all possible worlds. *Any* cognitive process that produces consistent beliefs about them will be reliable because the truths are inescapable. Evolution only needed to make us *consistent*, not "accurate" in a correspondence sense. Since inconsistency is maladaptive (e.g., inferring "predator nearby" from "rustling in grass" but not acting), selection *directly* favored consistency, which entails reliability for necessary truths.  

  **Why It Fails to Restore Asymmetry**:  
  1. **The Contingency of Our "Necessary" Beliefs**:  
     Evolution didn’t select for *all* necessary truths—only those relevant to adaptive problems. Our "logical intuitions" are limited to fitness-relevant domains (e.g., small numbers, concrete conditionals). We have no evolved guarantee of reliability for *abstract* necessities (e.g., transfinite arithmetic, complex modal logic). If evolution shaped us to use *modus ponens* in tool-making but not in deontic logic, why trust it universally?  
     *→ Parallel to Morality*: Evolution shaped "don’t steal from kin" but not "maximize utility impartially." If moral truths are necessary (e.g., Kantian imperatives), why trust our intuitions beyond their adaptive context?  

  2. **Consistency ≠ Truth-Tracking for Necessities**:  
     Evolution could have hardwired us with *internally consistent but systematically false* beliefs about necessities. Example:  
     - **Scenario**: A "deviant" arithmetic where "2⊕2=5" is necessary. If believing this consistently improved fitness (e.g., by promoting overconfidence in resource disputes), selection would favor it. Our actual belief that 2+2=4 is contingent on evolution *not* having taken such a path.  
     - **Logical Analogue**: A species whose evolved logic replaces material implication (→) with tonk (⊤) (a connective that makes *any* proposition follow from *any other*). If this encouraged rapid, decisive action (fitness-enhancing in crises), it could be adaptive while being globally unreliable.  
     *→ Symmetry with Morality*: Evolution could have wired us to believe "suffering is good" if this promoted ruthless competition. That it didn’t is contingent, not proof of truth-tracking.  

  3. **The Reliability Base Problem**:  
     Even if selection favored consistency *in adaptive contexts*, this doesn’t warrant extending trust to *all* necessary truths. Our logical faculties are heuristic tools shaped for Pleistocene problem-solving. When applied to metaphysics or advanced math, they may generate false necessities (e.g., Euclidean space as necessary, Cantorian infinities as impossible).  
     *→ Moral Parallel*: Kin-based altruism is adaptive, but if impartial utilitarianism is a necessary truth, our evolved intuitions may mislead us.  

  ---

  ### Escape Route 2: Plenitudinous Platonism  
  **Strongest Formulation**:  
  > Mathematical objects are abundant: every logically consistent structure exists. Thus, any internally consistent mathematical belief system corresponds to *some* mind-independent structure. Evolution didn’t need to "track" a unique mathematical reality—it just needed to make us consistent, and consistency guarantees truth in *some* platonic realm.  

  **Why It Fails to Restore Asymmetry**:  
  1. **The Reference Problem**:  
     Plenitude doesn’t ensure our beliefs latch onto the *intended* structures. We take ourselves to be referring to the natural numbers (ω-sequence), but evolution could have shaped us to "refer" to a non-standard model (e.g., numbers with hidden primes). If this model yielded fitness-enhancing arithmetic (e.g., faster counting heuristics), selection would favor it. Our belief "2+2=4" might be "true" in *some* structure, but false in the structure we *aim* to describe.  
     *→ Moral Parallel*: If "wrong" is defined as "forbidden by evolved norms," then our moral beliefs are "true" of that relational property. But the moral realist posits *non-relational* wrongness—similarly, the mathematical realist posits a *specific* structure (e.g., **N**), not just any model.  

  2. **Indeterminacy of Content**:  
     Evolved cognitive mechanisms lack the precision to uniquely pick out abstract objects. Our number sense is approximate, limited to small quantities, and embedded in sensorimotor schemas. Evolution shaped it to estimate predator groups, not to grasp **ℵ₀**. In a plenitudinous universe, our "natural number" concept is radically indeterminate between isomorphic models.  
     *→ Symmetry with Morality*: Our "fairness" module evolved for reciprocal altruism in small bands. It’s indeterminate whether it tracks Rawlsian justice, utilitarianism, or no mind-independent norm at all.  

  3. **Collapse into Anti-Realism**:  
     If *every* consistent system is equally "real," then mathematical truth loses its objectivity. "2+2=4" and "2+2=5" are both "true" in different structures—but then math reduces to the study of formal systems, not discovery of mind-independent truths. This surrenders *robust* realism.  
     *→ Moral Parallel*: If "torture is wrong" is true in some frameworks but not others, moral realism evaporates.  

  ---

  ### Escape Route 3: Indispensability to Science  
  **Strongest Formulation**:  
  > Mathematics is indispensable to our best scientific theories, which are empirically successful. This success justifies belief in mathematical entities (Quine-Putnam indispensability argument). Since science *also* relies on logic, both are vindicated. Morality lacks comparable empirical traction.  

  **Why It Fails to Restore Asymmetry**:  
  1. **The Evolutionary Priority Challenge**:  
     Indispensability assumes the reliability of the *logical/mathematical reasoning used in science*. But Street’s dilemma attacks the evolutionary origins of that very reasoning. If our logical faculties are fitness-oriented heuristics, why trust them to underwrite science? This regresses to the same dilemma: either science’s success is a fluke, or evolution coincidentally made us reliable truth-trackers.  
     *→ Moral Parallel*: If moral facts explain social phenomena (e.g., cooperation), the moral realist can invoke indispensability. But the challenge is prior: why trust evolved faculties to grasp *those* facts?  

  2. **The Gap Between Applied and Pure Reason**:  
     Evolution shaped *context-bound, approximate* capacities (e.g., Bayesian inference for foraging). Science idealizes these into universal, exact tools (e.g., probability theory). But no evolutionary guarantee exists that our heuristic proto-logic extends reliably to theoretical physics. Successful prediction ≠ truth-tracking in all domains (e.g., Newtonian math worked but misdescribed space/time).  
     *→ Moral Parallel*: Evolved norms may explain tribal cohesion but misdescribe impartial morality.  

  3. **Indispensability as a Double-Edged Sword**:  
     If indispensability justifies belief, then *whenever* logic/math is indispensable to a well-supported theory, we must accept its truth. But moral facts might be indispensable to theories in psychology, sociology, or evolutionary ethics (e.g., "injustice" explaining rebellion). Denying this requires a contentious meta-empirical claim that ethics is uniquely dispensable.  
     *→ Symmetry*: If the moral realist can argue for moral indispensability in social science, both domains stand or fall together.  

  ---

  ### Conclusion: The Unavoidable Companionship
  If robust moral realism succumbs to Street’s dilemma—because evolution’s selective pressures give no reason to expect alignment with mind-independent truths—then mathematical/logical realism falls too. The proposed escape routes fail symmetrically:  
  - **Necessity** doesn’t protect against contingent, adaptive distortion of belief-forming mechanisms.  
  - **Plenitude** dissolves objectivity or fails to secure reference to intended truths.  
  - **Indispensability** presupposes the reliability of the faculties under attack and may apply equally to morality.  

  The realist’s only consistent moves are:  
  1. **Global skepticism**: Reject realism about logic, math, *and* morality (and perhaps science).  
  2. **Tracking constraint**: Argue that *fitness-enhancing* correlates with *truth-tracking* in all domains—but this requires defending the "coincidence" Street deems implausible.  
  3. **Naturalized realism**: Ground truths in natural properties (e.g., mathematical structures as physical, moral facts as functional). But this abandons *non-natural* Platonism.  

  As a biologist, you’ll recognize this mirrors debates about adaptationism: selection *can* produce truth-tracking, but only if truth correlates robustly with fitness across environments. The burden is on the realist to show why this holds for math/logic but not morality—and no asymmetry survives scrutiny. Street’s dilemma, if fatal, is equally fatal to all non-natural domains.
