answer: |-
  You're absolutely right – Kepler's relationship with astrology is far weirder, more nuanced, and more intellectually fascinating than the "genius-for-hire" simplification. Your memory is solid on the core points (Koestler nails this tension), and digging into the *Tertius Interveniens* (1610) is key. Let's break down Kepler's unique astrology vs. the mainstream of his day, his justification, and the Wallenstein tension.

  **Kepler vs. Mainstream (Ptolemaic/Scholastic) Astrology: The Rejection & Retention**

  1.  **What Kepler Rejected (Vehemently):** He attacked the core symbolic & predictive apparatus of traditional astrology as irrational "superstition":
      *   **The Zodiacal Signs & Constellations:** He dismissed the idea that the *constellations themselves* (Aries, Taurus, etc.) or the arbitrary divisions of the zodiac (12 equal signs) held inherent power or meaning. "The stars can no more claim jurisdiction over these little regions than a farmer over a distant province he has never seen." He saw them merely as convenient markers in the sky.
      *   **The Twelve Houses:** He found the complex system of astrological houses (determining areas of life like wealth, marriage, death) utterly arbitrary and lacking any physical basis. He called them "a human invention" with no connection to cosmic reality.
      *   **Planetary "Governments" & Essential Dignities:** The idea that planets "ruled" signs or had inherent qualities (Mars = warlike, Venus = loving) independent of their position or aspect was anathema to him. He saw planets as physical bodies governed by physical laws, not anthropomorphic deities.
      *   **Deterministic Prediction:** He ridiculed precise predictions of specific events (wars, deaths, marriages, harvests) or detailed personality traits based solely on birth charts. He saw this as foolish and impossible, mocking astrologers who claimed such precision.
      *   **Astrological "Causes":** He rejected the idea that celestial bodies *directly caused* terrestrial events or personality traits through some mystical influence. No "rays" carried specific meanings like "fortune" or "misfortune."

  2.  **What Kepler Kept & Radically Reinterpreted (His "Well, Actually"):**
      *   **The Aspects (The Angles):** This was the *core* of Kepler's astrology. He retained the traditional major aspects (conjunction 0°, sextile 60°, square 90°, trine 120°, opposition 180°) but stripped them of their traditional meanings (e.g., trine = good, square = bad). Instead, he grounded them entirely in **geometry, light, and harmony**.
      *   **The Justification: His Physics of Cosmic Harmony:**
          *   **Geometry is Fundamental:** Kepler believed the universe was fundamentally geometric and harmonic, governed by mathematical ratios (reflected in his laws of planetary motion and *Harmonices Mundi*). Aspects represented specific, measurable angular relationships.
          *   **Light as the Physical Vehicle:** He proposed that *light itself* was the physical medium of celestial influence. Planets reflected the Sun's light. The *quality* of the light rays reaching Earth depended on the *angle* at which they met – the aspect.
          *   **Harmonic Ratios:** He linked aspects to the harmonic ratios he found governing planetary orbits and music (e.g., trine ~ 120° = 1/3 of circle ~ perfect fifth in music). He believed these specific geometric/harmonic configurations created a unique "impression" or "configuration" of light.
          *   **The "Sublunary Soul" (Anima Terrae):** This is the crucial, weird bit. Kepler postulated that the Earth itself possessed a kind of "soul" or sensitive faculty (*anima terrae*). This *anima terrae* was not a thinking entity but a *receptive faculty* attuned to these geometric/harmonic patterns in the incoming light. It would "resonate" with these cosmic harmonies (or dissonances).
          *   **Influence on Weather & Human Temperament (Not Fate):** This resonance of the Earth-soul, stimulated by the aspects, primarily influenced non-rational, physical, and collective phenomena:
              *   **Weather:** He saw a strong link between aspects and atmospheric conditions (e.g., conjunctions causing heat/drought, oppositions causing storms – ideas he explored meteorologically).
              *   **Collective Human Temperament/Mood:** He believed aspects could influence the prevailing *collective* mood, inclinations, or susceptibility to certain impulses (e.g., stirring unrest, religious fervor, or apathy). It was about shaping the *environment* and *inclinations*, not dictating individual actions or fates.
              *   **Individual Temperament (Weakly):** He *very cautiously* allowed that the *anima terrae*'s resonance *might* subtly influence the physical temperament (the "humors") an individual is born with, predisposing them towards certain tendencies (melancholic, sanguine, etc.), but **emphatically not** dictating their life, choices, or personality in detail. This was a vastly reduced role compared to traditional natal astrology.

  **Kepler's Astrology in a Nutshell:** Celestial influence works *only* via the geometric angles (aspects) between planets, physically mediated by *light*, understood through harmonic ratios, and received by the receptive *anima terrae* of the Earth, primarily affecting weather and collective human temperament/impulses. **It's a physics of cosmic harmony influencing terrestrial atmosphere and mood, stripped of zodiac signs, houses, planetary rulerships, and deterministic prediction.**

  **The Wallenstein Wrinkle & The Coherence Question**

  You remember correctly about Albrecht von Wallenstein, the immensely powerful (and superstitious) Imperial Generalissimo during the Thirty Years' War.

  *   **The Charts:** Kepler first cast Wallenstein's horoscope in 1608 (before Wallenstein's rise). When Wallenstein became Duke of Friedland in 1624 and sought Kepler's services again, Kepler recast the chart based on more precise information (including a corrected birth time). He famously predicted a "terrible disorder" around March 1634 in his 1625 horoscope for Wallenstein. Wallenstein was assassinated on February 25, 1634.
  *   **The Tension:** This patronage work *seems* mercenary and contradicts his public critiques. He produced detailed charts using techniques (like houses, sometimes zodiac references) he explicitly rejected elsewhere. He made predictions (like the 1634 disorder) that sound suspiciously like the deterministic astrology he railed against.

  **The Honest Read on Coherence & Tension:**

  1.  **Pragmatism & Patronage:** Kepler needed income desperately. Wallenstein was a powerful, demanding patron who *expected* traditional astrology. Kepler provided a service within the expected format, using the symbolic language patrons understood. This was survival.
  2.  **Translation & Focus:** Kepler likely *translated* his core belief in aspects into the traditional framework for his clients. The detailed chart was the expected *vehicle*, but his actual predictions (like the 1634 "disorder") might have stemmed more from his analysis of *major upcoming aspects* (e.g., Saturn transits) influencing collective tension and danger, interpreted through the lens of Wallenstein's powerful position and volatile personality. He focused on broad trends and temperamental predispositions he thought were *plausible* within his system.
  3.  **The Unresolved Gap:** Here's the real tension Kepler *never* fully resolved:
      *   **The "How" of Individual Influence:** His *anima terrae* theory explained collective/atmospheric influence well. But how did this translate to *specific* individual fates or detailed character traits implied in natal charts? He lacked a convincing physical/biological mechanism. His allowance for temperamental influence at birth was vague and stretched his own physicalist model.
      *   **The Language Problem:** To communicate with patrons and exist within the astrological discourse, he had to use the symbolic language (signs, houses) he scientifically rejected. This created an unavoidable dissonance between his private cosmology and his public practice.
      *   **Predictive Ambiguity:** While rejecting precise prediction, his work for Wallenstein *did* involve forecasting periods of heightened danger or opportunity based on aspects. The line between "influencing collective mood/conditions" and "predicting danger for an individual *in* those conditions" is inherently blurry.

  **Conclusion: Sincere Innovator Navigating an Unscientific World**

  *   **Sincere Belief:** Kepler's belief in the physical reality of astrological *aspects* mediated by light and harmonic ratios, influencing the Earth's "soul" and thereby weather/collective temperament, was genuine and deeply integrated into his scientific worldview. It wasn't just habit; it was his attempt at a *rational physics* of celestial-terrestrial interaction.
  *   **Radical Reformer:** He was a fierce critic who demolished the superstructure of traditional astrology (signs, houses, rulerships, deterministic prediction) with scientific arguments.
  *   **Pragmatic Practitioner:** He operated within the patronage system, using the expected tools and language (charts with houses/signs) to deliver insights based *primarily* on his aspect theory, framed in ways patrons could accept. This involved compromises and stretching his own theory regarding individual influence.
  *   **Unresolved Tension:** The gap between his physical theory of collective/atmospheric influence and the demands of individual natal astrology/prediction *is* a real tension. He navigated it pragmatically but didn't (and likely couldn't, with the science of his time) fully resolve it theoretically. His Wallenstein work highlights this tension brilliantly.

  **In short:** Kepler wasn't a hypocrite just cashing in, nor a closet believer in traditional astrology. He was a revolutionary scientist earnestly trying to salvage a single, physically plausible kernel (aspects/harmony) from what he saw as a mountain of superstition, while simultaneously trying to earn a living in a world where that mountain was the only currency patrons recognized. His astrology was a unique, fascinating, but ultimately incomplete bridge between ancient cosmology and the emerging mechanistic universe. Your "well, actually" bit is gold – it reveals the messy, human reality behind the simplified myth.
