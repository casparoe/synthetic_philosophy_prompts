  The tension they’re spotting is real: Kepler needed patronage, but his physics-driven astrology was also deeply held. His client work was a pragmatic translation of his theories into a language patrons understood—like a physicist today simplifying quantum mechanics for a podcast. Not insincere, just layered. 

