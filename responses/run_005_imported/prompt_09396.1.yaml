answer: |-
  ## For Walt: On Rationality and Reunion

  Good morning. For those who don’t know me, I’m Walt’s grandson. He was my grandpa. And, as the resident philosophy student in the family – something Grandpa tracked with more pride than I probably deserved – I’ve been given the profound, daunting, and frankly terrifying honour of speaking about him today. Terrifying not just because of the weight of the moment, but because Walt, as many of you know, had very specific ideas about how things ought to be reasoned through. Especially this.

  Walt taught calculus for decades. He loved the elegance of a solved equation, the clean arc of a proof. But his real intellectual passion, the spark that lit him up at Thanksgiving dinners often before the turkey even arrived, wasn’t just math. It was Kurt Gödel. Not necessarily the famous incompleteness theorems – though he loved those too – but something more personal. Something that became the quiet bedrock of his own view of the world: Gödel’s argument for an afterlife, laid out in letters to his own mother back in 1961.

  Grandpa’s version, honed over decades of explaining it to anyone who’d listen (and even those who hadn’t quite asked), went something like this: Look around. The universe isn’t chaos. It isn’t, as he’d say with a characteristic wave of his hand dismissing nonsense, “just a meaningless heap of atoms.” It’s rational. Ordered. It follows rules we can discover, from the paths of planets to the logic of a syllogism. It *makes sense*.

  And if that’s true, Walt reasoned, then something fundamental happens when we consider a human life. We are creatures built for development, for learning, for becoming. We start unfinished, messy, and we spend our lives striving towards… well, towards something *more*. Towards understanding, towards connection, towards becoming the person we glimpse we might be.

  Now, Walt asked, what kind of truly rational universe would build beings capable of such immense potential, capable of love and curiosity and deep, hard-won wisdom… only to snip that development clean off in the middle? What rationality is there in creating the capacity for profound growth and then ensuring its permanent, abrupt cancellation? To him, that wasn’t rational at all. It was absurd. It violated the very order he saw everywhere else. Therefore, he concluded, there *must* be something more. There *must* be a continuation. A place, a state, a *something* where that development could find its completion. A "Wiedersehen" – a reunion – not just as wishful thinking, but as a logical necessity of a rational cosmos.

  He’d found this argument decades ago in a book, and it stuck. It became his personal theology. Precisely because, as he’d insist, leaning forward with that teacher’s intensity, it wasn’t “one of the sloppy religions.” It was a *chain of reasoning*. A deduction. Something he was ready to defend at the dinner table, in letters, or against the formidable minds of his old logic reading group – several of whom I see here today, and yes, I *am* feeling the pressure, thank you very much. Walt respected a good counter-argument. He thrived on it. But he held onto this one, fiercely, because it satisfied not just his head, but something deeper.

  Here’s what’s crucial to understand about Walt’s argument, and about Walt himself: **it wasn’t born from ignoring the rough edges of life, or pretending everything was neatly resolved.** It ran *on* the friction of the unfinished. It was fueled by the very human sense of incompleteness.

  Walt knew about unfinished business. He’d dreamed, passionately, of pursuing a PhD in logic himself. Life, in the form of practicalities, responsibilities, and the wonderful, demanding reality of family, intervened. He became an exceptional teacher, shaping countless minds, instilling a love for precision and beauty in mathematics. But that dream of deeper academic pursuit… it stayed with him. It was a quiet companion, sometimes a source of pride in what he *had* mastered independently, sometimes a pang of the path not taken. He didn’t hide it. He’d talk about it, not with bitterness, but with a clarity that acknowledged the road diverged.

  And then, eight years ago, Grandma died. That loss wasn’t an abstract philosophical puzzle anymore. It was a chasm. It was the person he’d built his life alongside, gone. In that grief, “Wiedersehen” – that beautiful German word for reunion he lifted straight from Gödel’s letter – stopped being a fascinating logical conclusion. It turned into the air he needed to breathe. It became the necessary corollary to a love that felt too vast, too integral to his own being, to simply end. His argument wasn’t just an intellectual exercise; it was the lifeline he clung to. The regret about his PhD, the profound grief for Grandma – these weren't contradictions to his rational hope. They were the *premises*. They were the evidence of the development brutally interrupted, the love severed, that demanded, in a rational universe, a continuation.

  So, we stand here today, missing him terribly. Missing his sharp mind, his dry wit that could sneak up on you, his unwavering loyalty, his insistence on clear thinking, and yes, even his tendency to launch into explanations of modal logic when you just asked if he wanted more potatoes. We feel the sharp edges of *his* unfinished symphony – the conversations we won’t have, the bridge hands he won’t play, the complex thoughts he won’t wrestle with aloud.

  And it’s precisely here, in this ache of absence, in the undeniable sense of a story cut off mid-sentence, that Walt would point us back to his chain of reasoning. He wouldn’t offer platitudes. He’d offer the structure of his argument. He’d say: *Look at the order in the world. Look at the potential within a person, within a love. Does this feeling of incompleteness, this sense of something profoundly *unfinished* in the face of death, feel like an anomaly in that rational order? Or does it feel like evidence? Evidence that points towards the necessity of something more?*

  He believed it was evidence. He staked his hope on the rationality of existence.

  This wasn’t Walt ignoring the messiness or the pain. This was Walt looking squarely at the hardest truths of human existence – the unrealized dreams, the searing loss, the feeling of being fundamentally *unfinished* – and saying: “This *demands* an explanation. And the only explanation that fits a truly rational universe is continuation.”

  So, as we remember Walt today – the teacher, the logician, the bridge partner, the sometimes-absentminded professor in his own living room, the man who loved his family fiercely – we can honour him best by honouring the clarity and courage of his conviction. He didn’t shy away from the hard questions. He met them with reason and with a profound, stubborn hope rooted in the very fabric of the universe as he understood it.

  He believed in a rational order. He believed in the necessity of completion. He believed in Wiedersehen.

  And so, for Walt, who taught us to look for the proof, who felt the sting of the unfinished more deeply than most, and who trusted the logic of the cosmos right to the very end: We miss you. We feel the gap you left. And we hold onto the rational hope, *your* rational hope, that the story isn’t over. That the equation balances. That the development finds its end. That we will, indeed, meet again.

  Thank you.
