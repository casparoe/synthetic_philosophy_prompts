prompt: |-
  im on the student committee that helps run my schools science fair (we write the rules and hear appeals when a project gets challenged). this year a girls project — "do sun signs predict personality," tested on 150 kids with a Big Five survey — came back statistically null, so she revised her hypothesis to say the effect only shows up once you also control for moon sign and rising sign too. half the committee wants to disqualify it as unfalsifiable pseudoscience; she's arguing that her ORIGINAL hypothesis was falsifiable and it failed, and that real science does the exact same "add a variable to save the theory" move all the time — like how 19th century astronomers invented a whole hypothetical planet, Vulcan, to explain a wobble in Mercury's orbit that Newtonian physics couldn't account for, and nobody calls Newtonian mechanics pseudoscience for that. we have to actually write up a standard for what counts as science for the fair, not just "astrology bad" vibes, and use it to rule on her case specifically. can you draft the memo the committee would send out — a clear ruling (disqualify, allow, allow with revisions, whatever) plus a general rule future projects could be judged by — that actually deals with her Vulcan point instead of just dodging it.
reasoning: |-
  Okay, the user is on a student committee for a science fair and they're dealing with a tricky situation. A student's project on astrology initially had null results, so she revised her hypothesis by adding more variables (moon and rising signs). The committee is split on whether this is legitimate science or pseudoscience. The student compares her approach to the historical example of Vulcan, where astronomers proposed a new planet to explain Mercury's orbit anomalies within Newtonian physics. The committee needs to create a fair standard for what counts as science and rule on this specific case.

  First, I need to address the Vulcan analogy. The student has a point—scientists do sometimes add variables to save theories. But the key difference is that in real science, those additions must be testable and lead to new predictions. Vulcan was a testable hypothesis; astronomers searched for it and when they couldn't find it, that eventually contributed to Newtonian physics being superseded by relativity. In contrast, adding moon and rising signs doesn't seem to offer a way to test the revised astrology hypothesis meaningfully.

  The committee needs a clear standard that distinguishes between science and pseudoscience. The core principles should be falsifiability and testability. For a hypothesis to be scientific, it must be possible to disprove it through evidence. Also, any modifications to the hypothesis after initial testing should be independently testable and not just move the goalposts indefinitely.

  Looking at the student's project: her original hypothesis was testable and she tested it, getting null results. That's good science. But her revised hypothesis—adding moon and rising signs—doesn't seem falsifiable because it doesn't specify how these variables interact or what outcomes would disprove the theory. It appears to be an ad hoc adjustment to avoid the null results.

  The ruling should disqualify the project in its current form but allow resubmission if she can make the revised hypothesis testable. For example, she could define specific, measurable predictions about how moon and rising signs affect personality in combination with sun signs. This way, she's not penalized for revising her hypothesis, but she must meet scientific standards.

  The memo needs to communicate this clearly. It should acknowledge the Vulcan example but explain the difference: Vulcan was a testable prediction, whereas her revision lacks testability. The general rule for future projects should emphasize that post-hoc modifications must be independently falsifiable and lead to new, testable predictions. This sets a fair standard without dismissing all hypothesis revisions as unscientific.
answer: |-
  ## MEMORANDUM  
  **TO:** Science Fair Committee Members & Participants  
  **FROM:** Student Science Fair Committee  
  **SUBJECT:** Ruling on Project #A-17 & Clarification of Scientific Standards  
  **DATE:** October 26, 2023  

  ---

  ### I. RULING ON PROJECT #A-17 ("Do Sun Signs Predict Personality?")
  **Project #A-17 is disqualified from competition in its current form.**  

  **Reasoning:**  
  1.  **Original Hypothesis (Tested & Falsified):** The initial hypothesis ("Sun signs predict Big Five personality traits") was appropriately testable and falsifiable. The student correctly conducted a test (survey of 150 subjects) and obtained a statistically null result. **This phase of the work was valid science.**  
  2.  **Revised Hypothesis (Problematic):** The *post-hoc* revision ("Sun signs predict personality *only when controlling for Moon and Rising signs*") fails to meet core scientific standards for the following reasons:  
      *   **Lack of *A Priori* Testability:** The revision was not proposed *before* seeing the data. It was formulated *specifically* to explain away the null result, without independent predictive power or prior theoretical justification presented within the project framework.  
      *   **Ad Hoc Modification Without Falsifiability:** The revision renders the core claim effectively unfalsifiable. Any negative result for Sun signs alone could *always* be explained away by claiming an unaccounted-for interaction with Moon/Rising signs or other astrological factors. There is no clear mechanism described *within the project* for how this specific 3-sign interaction would be definitively tested *and potentially falsified*.  
      *   **Explanatory Scope Without Constraint:** The revised hypothesis expands the explanatory variables (Moon/Rising signs) without providing a clear, testable mechanism or defining *specific, measurable predictions* about *how* these variables interact to produce the effect that the Sun sign alone failed to show. It moves the goalposts without establishing new, falsifiable boundaries.  

  **Path Forward for the Student:** The student is encouraged to revise her project for future fairs. A scientifically valid revision would require:  
  *   **A new, *a priori* hypothesis** explicitly stating *how* Sun, Moon, *and* Rising signs are theorized to *interact* to predict specific Big Five traits.  
  *   **Specific, testable predictions** derived from this new hypothesis *before* data collection (e.g., "Subjects with Sun in Fire *and* Moon in Air will score significantly higher on Extraversion than those with Sun in Fire and Moon in Water").  
  *   A **methodology designed explicitly to test this new, complex interaction hypothesis** (which may require a significantly larger sample size).  

  ---

  ### II. GENERAL STANDARD: DEFINING TESTABLE SCIENCE FOR THE FAIR  
  The Committee establishes the following standard for evaluating project hypotheses, particularly regarding revisions after initial testing:  

  **A scientific hypothesis must be Falsifiable, Testable, and Predictive (FTP Standard):**  

  1.  **Falsifiable:** It must be logically possible for observation or experiment to prove the hypothesis *wrong* under clearly defined conditions.  
  2.  **Testable:** It must be possible to design a feasible experiment or observation *within the scope of a science fair project* to gather evidence for or against the hypothesis.  
  3.  **Predictive:** It must make specific, concrete predictions about measurable outcomes *before* data is collected.  

  **Regarding Post-Hoc Hypothesis Revision (Addressing the "Vulcan" Point):**  
  *   Scientific theories *do* evolve in response to data. Adding auxiliary hypotheses (like Vulcan) is a legitimate part of this process. **However, for such revisions to be scientifically valid, they must:**  
      a.  **Be Independently Falsifiable:** The *new* hypothesis (e.g., Vulcan exists) must itself make *new, testable predictions* distinct from the phenomenon it was invented to explain (e.g., Vulcan's predicted orbit, position, brightness). It cannot *only* explain the original anomaly.  
      b.  **Increase Predictive Power/Scope:** Ideally, the revision should lead to new predictions beyond the initial problem.  
      c.  **Not Render the Core Theory Permanently Unfalsifiable:** If repeated revisions *only* serve to explain away failures without enabling new, decisive tests, the core theory loses its scientific status. Newtonian physics *remained* testable in countless other ways even while Vulcan was sought. The inability to find Vulcan *was* a failing point contributing to its eventual supersession.  

  **Application to Science Fair Projects:**  
  *   A project testing an initial hypothesis that yields a null result has still conducted valid science.  
  *   **Revising a hypothesis *after* seeing the data is permissible ONLY IF:**  
      *   The **revised hypothesis is formulated as a *new*, distinct claim** (not just an "exception" to the failed one).  
      *   The revised hypothesis meets the **FTP Standard independently** (it is falsifiable, testable, and predictive *on its own merits*).  
      *   The project **clearly differentiates between the initial test and the *proposal* of the new hypothesis.** The revision itself *cannot* be presented as the validated outcome of the original experiment.  
  *   Revisions that primarily serve to *immunize* the core claim against falsification by adding untestable or infinitely flexible components (e.g., adding more unconstrained variables post-hoc) do not meet the FTP standard.  

  ---

  ### III. APPLICATION OF STANDARD TO PROJECT #A-17 REVISION
  The post-hoc addition of Moon and Rising signs fails the FTP standard:  
  *   **Falsifiability:** The revision lacks a defined mechanism for how *falsification* could occur. What specific combination of Sun/Moon/Rising results *could not* be explained by the theory?  
  *   **Testability:** While Moon/Rising signs *could* be tested, the *specific interaction* proposed to "save" the Sun sign effect wasn't defined *before* testing, and the project does not propose a concrete, feasible way to rigorously test this complex 3-factor interaction *within its current scope*.  
  *   **Predictive:** No *new, specific predictions* based on the *interaction* of all three signs were made *before* the original Sun sign data was analyzed. The revision is explanatory, not predictive.  

  The "Vulcan" analogy is insightful but ultimately highlights the difference:  
  *   **Vulcan** was a *new, testable prediction* (a planet with specific properties in a specific orbit). Its non-discovery *was* a failing point.  
  *   **Moon/Rising Addition** (as presented) is an *untestable auxiliary assumption* used solely to explain away the null result, not a generator of new, falsifiable predictions.  

  ---

  This standard ensures the Science Fair promotes genuine scientific inquiry characterized by testability, predictive power, and a commitment to evidence, while acknowledging that science is a process of refinement. Projects must demonstrate how *both* supporting *and* conflicting evidence can be meaningfully evaluated within their proposed framework.  

  **Chair, Student Science Fair Committee**
