prompt: |-
  Hey -- I've got a philosopher coming on my podcast next week who works on moral psychology, and her new paper makes a move that's been stuck in my head: she argues hypocrisy itself isn't really what disqualifies a hypocrite from blaming someone -- what's gone wrong is closer to a presupposition failure, like the classic "have you stopped beating your wife" case from philosophy of language. On her view, blaming someone carries a background assumption that your not guilty of the same (or a comparably bad) thing, and a hypocrite's blame is defective the way a loaded question is, not just false or bad manners -- which feels pretty relevant given how much "hypocrite!" gets thrown around in politics lately. Can you draft me 8-10 interview questions that don't just let her restate the theory? I want at least one pushing on whether the presupposition move is doing real philosophical work or just relabeling "do as I say not as I do" with fancier vocabulary, one on whether a reformed hypocrite gets their standing back the way a bad presupposition can be "accommodated" in conversation (and how fast that's supposed to happen), one on whether the account scales up to group cases -- like a country condemning war crimes it committed a generation earlier -- and one closing question on what would actually count as evidence against her account. For each of those four, add a follow-up keyed to the dodge she's most likely to reach for.
reasoning: |-
  Okay, the user is preparing for a podcast interview with a philosopher who has a novel take on hypocrisy. The core idea is that hypocrisy isn't just about inconsistency but involves a presupposition failure similar to loaded questions like "Have you stopped beating your wife?" The user wants interview questions that go beyond restating the theory and specifically asks for four targeted questions with follow-ups to prevent dodging.

  First, I need to understand the philosopher's argument clearly. She's saying that when someone blames another, there's an implicit presupposition that the blamer isn't guilty of the same or comparable wrongdoing. If they are guilty, the blame is defective, not just insincere or rude. The user wants to challenge this by asking if it's just relabeling, how reform affects standing, group-level applications, and what could falsify the theory.

  The user mentioned four specific areas: whether the presupposition is doing real work, reformed hypocrites and accommodation, group cases, and evidence against the account. Each needs a main question and a follow-up anticipating dodges. Let me break these down.

  For the first point: is presupposition just fancy relabeling? The philosopher might dodge by emphasizing the linguistic mechanism. The follow-up should push her to explain why this framework is better than traditional views. Maybe compare it to moral standing or authority.

  Second, reformed hypocrites and accommodation. The key here is how quickly standing is restored. The dodge might be to say it depends on context. Follow-up should demand criteria for accommodation speed, like in conversational pragmatics.

  Third, scaling to groups. The dodge could be that groups aren't individuals, so it's different. Follow-up needs to address how collective responsibility and historical continuity play into presupposition failure.

  Fourth, evidence against the theory. The dodge might be to say apparent counterexamples are actually consistent. Follow-up should challenge her to specify what evidence would falsify the theory, pushing for concrete scenarios.

  I should also consider the podcast context. The host wants engaging, non-repetitive questions that delve deep. The audience might be interested in real-world applications, especially in politics where hypocrisy accusations are common. The user's deeper need is to have a compelling discussion that reveals new insights, not just a summary of the paper. They want to test the theory's robustness and practicality.

  For the reformed hypocrite question, using terms like "accommodation" from linguistics makes sense. But how does that translate to moral standing? The philosopher might say it's about trust restoration. The follow-up needs to ask how that process differs from just regaining authority.

  Group cases are tricky. If a country condemns war crimes but has a history, is the presupposition failure at the institutional level? The dodge might involve differentiating current vs. past regimes. Follow-up should press on how collective identity over time affects the presupposition.

  For falsification, if no counterexamples exist, that's a problem. The follow-up must insist on what observable evidence would undermine the theory. Maybe cases where hypocrites' blame is still effective despite their past.

  I need to ensure each question is concise but probing. Avoid leading questions; let the philosopher explain but challenge her. The follow-ups should be prepared to cut through vague answers. Also, include other questions to cover broader aspects, like the role of context, blame without presupposition, and practical implications.

  Finally, the closing question about evidence should tie into the theory's testability. Emphasize that a good theory must be falsifiable. The host wants to highlight the philosopher's ability to defend her ideas robustly.
answer: |-
  Here are 8 interview questions designed to push the philosopher's presupposition failure account of hypocrisy beyond mere restatement, incorporating your specific requests with anticipated dodges and sharp follow-ups:

  1.  **Core Challenge (Relabeling vs. Work):** "You argue hypocrisy invalidates blame via *presupposition failure*, akin to a loaded question. Critics might say this is just a sophisticated way of repackaging the ancient intuition behind 'practice what you preach' or 'clean your own house first'. What *explanatory or practical advantage* does framing it as a *presupposition failure* offer that these simpler notions lack? Specifically, does it resolve ambiguities or predict outcomes the traditional view misses?"
      *   *Likely Dodge:* Emphasizing the linguistic mechanism itself as the advantage.
      *   **Follow-Up:** "If the *only* advantage is pointing out the analogy to loaded questions, isn't that still essentially relabeling? Couldn't we achieve the same effect by saying blaming *always* carries an *implicit claim to moral standing* relative to the fault, and hypocrisy *falsifies that claim*? What unique philosophical work does 'presupposition failure' *itself* do here?"

  2.  **Reform & Accommodation:** "Let's say a former hypocrite genuinely reforms – they cease the blameworthy behavior and sincerely regret their past. On your model, does their act of blaming *now* still suffer from presupposition failure regarding their *past* identical actions? If not, how exactly is the 'background assumption' that *they are not guilty of the same thing* restored? Is this analogous to conversational 'accommodation', and if so, *how quickly* does that accommodation happen? Does it require explicit acknowledgment, public penance, or just the passage of time?"
      *   *Likely Dodge:* Saying it depends on context, audience, and sincerity; it's complex.
      *   **Follow-Up:** "But accommodation in linguistics often happens *implicitly* and *in the moment* to keep conversation flowing. If a reformed hypocrite blames someone without mentioning their past, and the audience *knows* their past, is the presupposition *automatically* accommodated, leading to valid blame? Or is some *explicit repair* (like an apology) *required* before the presupposition can hold? Your model needs to specify the *mechanism* of restoration."

  3.  **Scaling Up (Group Hypocrisy):** "Your examples focus on individuals. How does the presupposition failure model apply to *collective* or *institutional* blame – say, when Country A condemns Country B for war crimes that Country A itself committed in the past, even generations ago? Does the 'background assumption' that *'we' are not guilty of the same thing* fail presuppositionally? How do we determine the relevant 'we' (current government? same nation-state? same populace?) and the temporal scope for the presupposition to hold or fail?"
      *   *Likely Dodge:* Arguing groups aren't unified agents like individuals; it's messy.
      *   **Follow-Up:** "Granted groups are complex, but nations *do* issue collective blame and condemnation. If the presupposition for *valid* blame requires the blamer (the collective 'we') to *not be guilty of the same*, doesn't a nation's *own documented history* of identical atrocities *necessarily* trigger presupposition failure for their condemnation of others, *regardless* of generational distance or regime change? Does your model force us to conclude that such condemnations are *always* pragmatically defective in this fundamental way?"

  4.  **Evidence & Falsification:** "What kind of empirical finding or thought experiment would constitute strong evidence *against* your presupposition failure account of hypocrisy? If we found consistent instances where audiences *do* accept blame from known hypocrites as normatively effective (despite recognizing the hypocrisy), or conversely, where blame fails *without* any trace of hypocrisy but due to other factors your model doesn't capture – would that challenge the core claim that presupposition failure is the *key* defect?"
      *   *Likely Dodge:* Interpreting apparent counter-examples as actually *consistent* with the model (e.g., claiming the audience accommodated, or that other factors were *also* at play).
      *   **Follow-Up:** "That sounds potentially unfalsifiable. Can you specify a *concrete scenario* – real or imagined – where the hypocrite's blame *should* be defective on your model but *isn't* observed to be so, *or* vice-versa, that would genuinely make you reconsider the centrality of presupposition failure? What specific observation would falsify the claim that this *is* the primary mechanism?"

  5.  **Contextual Specificity:** "The 'comparably bad' clause in your background assumption seems crucial but potentially slippery. Does presupposition failure only occur for *identical* wrongs, or for what the *blamer* considers comparably bad? Couldn't a hypocrite strategically blame someone for a *different* but *lesser* failing than their own, sidestepping the presupposition failure? How does your model handle differing moral frameworks between blamer and audience?"

  6.  **Blame Without Presupposition?:** "Is it *conceptually possible*, on your view, to issue a valid blame statement that *explicitly disavows* the background assumption – e.g., 'I know I do X too, which is terrible, but you *still* shouldn't do X'? Does this avoid presupposition failure, or is the act of blaming *inherently* tied to that presupposition, making such a disavowed blame pragmatically incoherent or a different speech act altogether?"

  7.  **The Role of Sincerity & Change:** "You focus on the *fact* of the blamer's transgression causing the failure, not necessarily their *insincerity*. Could someone be utterly sincere in their blame *and* their belief that their own past similar act was wrong, yet *still* suffer presupposition failure? Does the model imply that sincerity is irrelevant to the *validity* of the blame act itself, only to other moral judgments about the hypocrite?"

  8.  **Practical Implications & Nuance:** "Given your account, what's the *practical takeaway* for navigating moral criticism in messy reality? Should we *never* point out wrongdoing if we've ever erred similarly? Or does the model primarily help us diagnose *why* 'hypocrite!' stings rhetorically, while leaving room for the *substance* of the criticism to still be valid and worth engaging, albeit from a compromised speaker? How do we avoid letting this analysis paralyze moral discourse?"

  **Key principles applied:**

  *   **Avoiding Restatement:** Questions focus on implications, advantages, edge cases, scalability, and falsifiability rather than asking for core theory explanation.
  *   **Targeted Challenges:** Explicitly addresses your requests about relabeling, reform/accommodation, groups, and evidence.
  *   **Anticipating Dodges:** Follow-ups are designed to cut off likely retreats to vagueness, complexity, or re-interpreting counter-evidence.
  *   **Pushing Specificity:** Forces the philosopher to clarify mechanisms (how accommodation works, how groups are defined, what counts as falsification) and practical consequences.
  *   **Broader Context:** Includes questions on context, alternative blame forms, sincerity, and real-world application to round out the discussion.

  These questions should stimulate a deeper exploration of the theory's foundations, limitations, and practical significance, moving well beyond a simple recap of the paper. Good luck with the podcast!
