  ## The Unbearable Asymmetry: Why Moral Equality of Combatants Must Fall to McMahan's Revisionist Axe

  The doctrine of the Moral Equality of Combatants (MEC), championed by Michael Walzer, forms a cornerstone of traditional Just War Theory. Its core – the "independence thesis" – asserts that *jus in bello* permissions (governing conduct *in* war) are independent of *jus ad bellum* justice (the justice *of* the war). Consequently, soldiers on both sides possess symmetrical permissions and liabilities: they are moral equals, each granted an equal right to kill the other, provided they adhere to the laws of war, regardless of whether their nation's cause is just. Jeff McMahan's revisionist project delivers a seismic challenge to this orthodoxy. Grounded in a liability-based account of self- and other-defense, McMahan argues that the right to kill in war derives from the target's moral responsibility for contributing to an *unjust* threat. This renders MEC fundamentally mistaken: combatants fighting without a just cause typically lack the moral permission to kill those justly resisting aggression. Adjudicating this dispute requires engaging with robust defenses of MEC and McMahan's counterarguments, ultimately revealing that while MEC cannot stand as traditionally conceived, its pragmatic and psychological insights demand a reconstruction that acknowledges profound asymmetry while mitigating the harshest implications of pure revisionism. McMahan's core moral insight is correct, and MEC must be abandoned in its Walzerian form.

  **The Revisionist Core: Liability Trumps Symmetry**

  McMahan's critique dismantles MEC at its foundation. He argues that the morality of killing, whether in individual self-defense or war, hinges on liability. One becomes liable to defensive harm only if they are morally responsible for an unjust threat that cannot otherwise be prevented. Applying this to war:
  1.  **The Just Side:** Combatants fighting in a just war (e.g., defense against aggression) are typically *not* morally responsible for an unjust threat. They pose a *justified* threat to those responsible for the aggression. Killing them is therefore morally wrong.
  2.  **The Unjust Side:** Combatants fighting for an unjust cause *are* typically morally responsible (to varying degrees) for contributing to an unjust threat. They are liable to defensive killing by those they unjustly threaten.
  3.  **The Asymmetry:** Therefore, the permissions are radically asymmetric. Just combatants possess a wide permission to kill unjust combatants (who are liable). Unjust combatants generally lack the moral permission to kill just combatants (who are not liable), even if they follow *in bello* rules like distinguishing combatants or minimizing civilian harm. Their adherence to *jus in bello* makes their killings *less wrongful* (mitigating their culpability) but does not render them *permissible*. They are, in essence, acting *justly within an unjust endeavor*.

  This directly contradicts Walzer's symmetry. McMahan argues MEC perversely grants aggressors a "right" to kill those defending against their aggression, morally insulating them from the core injustice of their participation.

  **Engaging Defenses of MEC: Epistemic and Associative Challenges**

  1.  **The Epistemic Defense and McMahan's Response:**
      *   **Defense:** A powerful argument for MEC contends that ordinary soldiers (and often their commanders) simply *cannot know* with sufficient reliability whether their side's cause is just. Wars involve complex historical grievances, propaganda, state secrecy, and contested facts. Requiring soldiers to make such profound moral judgments under duress, amidst the "fog of war," is unrealistic and dangerous. MEC, by bracketing *ad bellum* justice, provides a clear, operationalizable set of *in bello* rules all can follow, preventing paralysis and chaos.
      *   **McMahan's Response:** McMahan concedes the epistemic difficulty but argues it doesn't *justify* MEC; it merely *explains* why unjust combatants might mistakenly believe they have a permission they lack, or why they might be *excused* for acting without it. Ignorance, even reasonable, does not create a moral permission. He further argues that while perfect knowledge is impossible, soldiers often *can* form reasonable beliefs about the justice of their cause. They have a duty to critically examine state propaganda and refuse participation in wars that are manifestly unjust (e.g., clear aggression). The epistemic challenge highlights a *practical* problem for applying revisionism, not a refutation of its core moral truth.
      *   **Assessment:** McMahan's response is **largely successful** on the *moral* level. Ignorance, however understandable, does not negate liability or create symmetrical permissions. However, he arguably understates the *pervasiveness* and *structural* nature of the epistemic problem in modern warfare, where information is tightly controlled and dissent suppressed. While not morally justifying symmetry, the epistemic defense powerfully demonstrates the *impracticality* of holding every soldier individually responsible for *ad bellum* assessments in real-time, highlighting the need for institutional and legal frameworks distinct from pure individual morality.

  2.  **Seth Lazar's Associative Duties Defense and McMahan's Response:**
      *   **Defense:** Lazar offers a more nuanced challenge, arguing that soldiers' associative duties to their comrades and fellow citizens *might* generate a permission to fight even in an unjust war. The bonds of loyalty, shared sacrifice, and mutual protection create special obligations. Refusing to fight might constitute a betrayal of these duties, leaving comrades to die. This associative permission could potentially ground a *limited* right for unjust combatants to defend themselves and their unit against immediate threats posed by just combatants, even if their overall war aims are unjust.
      *   **McMahan's Response:** McMahan strongly rejects this. He argues that associative duties cannot override fundamental prohibitions against killing innocent people (which just combatants, posing a justified threat, are). Loyalty to one's group does not license killing those who are not liable to be killed. The duty to comrades cannot be fulfilled by committing a greater wrong against others. He contends that while associative duties might *explain* why soldiers fight or generate sympathy for their plight, they do not *justify* their lethal actions against non-liable individuals.
      *   **Assessment:** McMahan's core rebuttal is **compelling**: associative duties cannot create a *sui generis* permission to kill the innocent. However, Lazar's argument highlights a crucial **psychological and motivational reality** largely absent from McMahan's highly individualized liability model. The intense, life-and-death bonds formed within military units create powerful internal reasons for action that *feel* morally compelling, even if objectively overridden. While not justifying the killing of non-liable just combatants *in principle*, Lazar forces recognition that demanding soldiers completely abandon these associative duties *in extremis* imposes a profound, perhaps supererogatory, moral burden. This points towards the need for a moral framework that acknowledges the tragic weight of these conflicts of duty without granting a blanket permission.

  **The Cost of Divergence: Law vs. "Deep Morality"**

  McMahan readily concedes that the *Law of Armed Conflict (LOAC)* might need to diverge from his account of the "deep morality" of war. LOAC, he argues, serves vital pragmatic functions: reducing savagery by establishing clear, reciprocal rules (like combatant immunity and POW status); managing the epistemic problem by providing bright-line distinctions (e.g., uniform = combatant); and facilitating conflict termination. Maintaining MEC *in law* might be necessary for these purposes, even while recognizing its moral falsity.

  **This concession is significant but not fatal to his core argument:**
  1.  **It Strengthens Moral Clarity:** Acknowledging the law/pragmatism distinction *preserves* the purity of the moral critique. It prevents the conflation of legal permissibility with moral permissibility. We can condemn the Iraq War as unjust aggression *morally*, while acknowledging that Iraqi soldiers captured in uniform were legal POWs.
  2.  **Highlights Law's Function:** It underscores that LOAC is primarily a *regulatory* framework aimed at minimizing harm *given that wars occur*, not a perfect reflection of underlying moral truth. Its symmetry is a tool, not a moral axiom.
  3.  **Motivates Reform:** Recognizing the divergence can motivate efforts to reform LOAC and state practices to better align with morality where feasible (e.g., strengthening mechanisms for holding aggressors accountable post-conflict, clarifying the duty to refuse manifestly illegal orders).
  4.  **The Cost is Practical, Not Theoretical:** The "cost" is the pragmatic necessity of sometimes legally shielding morally culpable individuals for the greater good of limiting war's horrors. This doesn't undermine the *truth* of the moral asymmetry; it acknowledges the tragic compromises required in the non-ideal world.

  **Verdict: Abandon Walzer's Symmetry, Reconstruct with Asymmetry and Nuance**

  The traditional doctrine of Moral Equality of Combatants, as articulated by Walzer, **must be abandoned**. McMahan's liability-based account successfully demonstrates that the core independence thesis is morally untenable. Permissions to kill in war *cannot* be detached from the justice of the cause; doing so morally legitimizes participation in aggression. The symmetry of MEC is a dangerous fiction.

  However, abandoning Walzer's MEC does not entail adopting a simplistic, purely individualized revisionism. The compelling insights from the epistemic defense and Lazar's associative duties argument demand a **reconstruction** of how we understand the moral landscape of war:

  1.  **Core Asymmetry Affirmed:** The fundamental moral asymmetry stands: combatants fighting without a just cause generally lack the moral permission to kill combatants fighting with a just cause. They are liable to defensive harm; their opponents typically are not.
  2.  **The Epistemic Burden:** While ignorance doesn't create permission, the pervasive difficulty of knowing *ad bellum* justice significantly affects culpability and excuses. It necessitates legal structures that manage this uncertainty through clear rules (like LOAC's symmetry) and highlights the moral importance of institutional mechanisms for accountability *ex post*.
  3.  **The Weight of Association:** Associative duties, while unable to override the prohibition on killing non-liable persons, create profound moral conflicts and tragic dilemmas for soldiers on the unjust side. Their predicament deserves recognition and shapes our understanding of culpability and the need for post-war reconciliation. The moral burden of refusing to fight in an unjust war, especially against the pull of loyalty to comrades, is immense.
  4.  **Law's Pragmatic Role:** The divergence between LOAC (potentially retaining symmetry) and deep morality (asymmetry) is a necessary, though regrettable, compromise. It reflects law's function in managing the non-ideal realities of human conflict and epistemic limitations. This divergence should be minimized where possible but accepted where essential for conflict mitigation.

  **Grounds for the Verdict:**
  *   **Moral Coherence:** McMahan's liability model aligns with fundamental principles of self-defense and moral responsibility far better than Walzer's artificial separation. Killing requires justification rooted in the target's actions and responsibility.
  *   **Rejection of Aggressor Privilege:** MEC grants a morally indefensible privilege to aggressors, shielding them from the core wrong of their participation. Revisionism correctly places the primary moral burden on those initiating or perpetuating unjust wars.
  *   **Accommodation of Reality:** While affirming the core asymmetry, the reconstructed view acknowledges the profound practical, epistemic, and psychological challenges that make the pure application of individual liability difficult and necessitates pragmatic legal structures. Lazar's insights prevent revisionism from becoming unduly harsh or ignoring the lived reality of soldiers' bonds.

  Therefore, the Moral Equality of Combatants, as a doctrine asserting symmetrical permissions independent of *jus ad bellum*, should be **abandoned**. It must be **reconstructed** on the foundation of McMahan's liability-based asymmetry, but with deep integration of the insights regarding epistemic constraints, the tragic force of associative duties, and the distinct, pragmatic role of the law. This reconstruction offers a morally truer, albeit more complex and demanding, understanding of the ethics of killing in war, one that holds individuals accountable for their role in collective injustice while acknowledging the tragic realities that mitigate, though do not erase, their culpability.
