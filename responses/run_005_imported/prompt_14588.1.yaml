  2. **Awareness logic**: Introduces an awareness set; an agent believes only those logical consequences that are in their awareness set. This avoids omniscience but the awareness set is arbitrary without further constraints.

  3. **Algorithmic knowledge**: Beliefs are generated by an algorithm. The agent believes what the algorithm outputs. This models bounded agents but the algorithm is arbitrary and may not provide normative constraints.

  4. **Resource-bounded step-logics**: Models belief as the result of a finite number of inference steps. This captures bounded reasoning but the choice of steps and rules is arbitrary without normative guidance.

  5. **Logical induction**: An algorithm that learns logical truths over time, with beliefs converging to truth. It provides a dynamic model of belief with good normative properties (calibration, etc.) but is computationally complex and not fully implemented in practice.

  6. **Plain syntactic/sentential belief models**: Belief is an arbitrary set of sentences, not closed under logical consequence. This avoids omniscience by fiat but gives up on rational constraints almost entirely.

