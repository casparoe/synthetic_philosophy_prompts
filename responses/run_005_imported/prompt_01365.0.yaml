answer: |-
  You've zeroed in on one of the most fascinating and debated tensions within Nyaya epistemology! Your "spec-reading" instinct is spot-on – the definition *does* present an apparent contradiction. Classical Naiyayikas (like Vatsyayana, Uddyotakara, and Udayana) were acutely aware of this and developed sophisticated solutions. Here's how they reconcile the clauses and why it matters:

  **The Core Reconciliation: The Two-Stage Model of Perception**

  Naiyayikas argue that a single perceptual event has **two distinct, sequential phases**, both falling under the umbrella of "pratyakṣa" (perception):

  1.  **Nirvikalpaka Pratyakṣa (Indeterminate Perception):** This satisfies *avyapadeśya* (non-verbal, non-conceptual).
  2.  **Savikalpaka Pratyakṣa (Determinate Perception):** This satisfies *vyavasāyātmaka* (determinate judgment).

  **How the Definition Applies to Each Phase:**

  1.  **Phase 1: Nirvikalpaka (Meeting *Avyapadeśya*):**
      *   **What it is:** The immediate, raw, non-conceptual sensory presentation arising directly from sense-object contact (*indriyārthasannikarṣa*). It's the pure "givenness" of the object.
      *   **Content:** It apprehends the bare, undifferentiated particular (*svalakṣaṇa*) and its generic features (*jāti* like "jar-ness", *guṇa* like colour) *simultaneously but without any relational structure or identification*. It's not "This is a jar" or even "jar". It's more like a unified, non-relational awareness of "this-ness" possessing specific qualities (colour, shape) and belonging to a type (jar-ness), but *without* explicitly predicating or classifying it *as* that type or relating the qualities *to* it.
      *   **Why it's *Avyapadeśya*:** There is *no association with words or explicit concepts*. No naming, no judgment "this is X", no subject-predicate structure. It's pre-linguistic and pre-judgmental. It's pure sensory cognition.
      *   **Why it's *Avyabhicārī*:** While error is possible in the *interpretation* (savikalpaka), this initial sensory presentation itself is considered unerring *given the current sensory conditions*. If your eyes are healthy and the light is good, the colour presented *is* the colour of the object. Any error comes later.
      *   **Why it's *Vyavasāyātmaka*?** Crucially, **it's not yet**. Nirvikalpaka lacks determinacy. Vyavasāyātmaka applies primarily to the *next* stage.

  2.  **Phase 2: Savikalpaka (Meeting *Vyavasāyātmaka*):**
      *   **What it is:** The cognition that *arises based on* the nirvikalpaka input. It involves recognition, identification, classification, and relational judgment. This is "This is a jar," "The jar is blue," "The jar is on the table."
      *   **Content:** Explicit subject-predicate structure. Concepts (*vikalpa*) are applied. Words become associated. The object is identified *as* belonging to a class, *as* having specific qualities, *as* related to other things.
      *   **Why it's *Vyavasāyātmaka*:** It is inherently a determinate judgment (*vyavasāya* = definite cognition/ascertainment). It fixes the identity and properties of the object.
      *   **Why it's still *Avyapadeśya*?** Here's the key nuance: Naiyayikas argue that while savikalpaka *involves* concepts and *can be expressed* in words, its **genesis and validity** are **directly rooted in** the sensory contact captured in nirvikalpaka. The *pramāṇa* (valid means) is the *process* starting with sense-contact. The *avyapadeśya* clause ensures that this foundational sensory input isn't *itself* conceptually mediated. The *savikalpaka* cognition is the *result* of the pramāṇa, inheriting its perceptual status, even though it utilizes memory and concepts. It's *avyapadeśya* **in origin**, not necessarily in final form.
      *   **Why it's *Avyabhicārī*:** When functioning correctly (healthy senses, proper conditions, no interfering factors like memory errors dominating), this judgment accurately reflects the object presented in nirvikalpaka. Error (*bhrānti*) occurs when memory or other factors distort the interpretation *against* the sensory data (e.g., mistaking a rope for a snake).

  **How Commentators Resolve the "Spec" Tension:**

  *   **Vatsyayana (Nyāya-Bhāṣya):** He explicitly introduces the two-stage model to resolve the tension. He argues that *avyapadeśya* refers to the cognition *not being produced by* words/testimony (*śabda*), not that it *cannot be described by* words later. The *vyavasāyātmaka* aspect highlights the cognitive process culminates in a definite judgment *based on* that initial non-verbal sensory input. He emphasizes the *causal link* to sense-object contact as the defining feature for both stages.
  *   **Uddyotakara (Nyāyavārttika):** Defends Vatsyayana vigorously against Buddhist critiques. He stresses that *nirvikalpaka* is a genuine *cognitive event* (jñāna), not mere sensation. It has *content* (the particular with its features) but lacks relational structure. He argues *savikalpaka* is the natural *maturation* of the perceptual process, inseparable from its foundation. The definition covers the *entire process* initiated by sense-contact.
  *   **Udayana (Nyāyavārttikatātparyaṭīkā):** Further refines the model. He emphasizes that *nirvikalpaka* provides the *non-conceptual acquaintance* with the particular, which is necessary to ground the concepts applied in *savikalpaka*. Without this grounding, concepts would be empty. The "contact" (*sannikarṣa*) ensures direct realism.

  **What's Philosophically at Stake? Why Insist on Both?**

  1.  **Defending Direct Realism:** Nyaya is fiercely realist. Perception must *directly* put us in contact with external objects (*arthasannikarṣa*) to ground our knowledge of the world. *Nirvikalpaka* ensures this direct, non-conceptual "touch" with reality. If perception *started* conceptual, it could be argued we only know our concepts, not the world (a Buddhist idealist or Kantian position). *Savikalpaka* ensures perception gives us *usable knowledge* about what things *are* and their properties.
  2.  **Grounding Concepts in Perception:** Concepts (*jāti*, universal properties like "jar-ness") are real for Nyaya, but they inhere in particulars. *Nirvikalpaka* provides the direct awareness of the particular (*svalakṣaṇa*) in which the universal resides. *Savikalpaka* then recognizes the universal *in* that particular. Without *nirvikalpaka*, concepts would have no objective anchor in perception.
  3.  **Explaining Error & Valid Knowledge:** The two-stage model cleanly explains perceptual error. Error happens at the *savikalpaka* stage when memory/imagination misapplies concepts *to* the sensory data provided by *nirvikalpaka*. Valid perception occurs when the *savikalpaka* judgment correctly interprets the *nirvikalpaka* input. *Avyabhicārī* applies strictly to the sensory core (*nirvikalpaka*) and to well-functioning *savikalpaka*.
  4.  **Distinguishing Perception from Inference:** Inference (*anumāna*) relies on universals and relations (e.g., smoke *implies* fire). Perception must be shown to be the *foundation* for these. *Nirvikalpaka* provides the direct awareness of particulars and co-occurring properties that allow us to *form* the universal correlations used in inference later. If perception were only *savikalpaka*, it might blur into inference.
  5.  **Accounting for Novelty & Recognition:** *Nirvikalpaka* explains how we perceive something entirely new – we get the raw "this-ness" before knowing *what* it is. *Savikalpaka* explains recognition – applying the correct concept based on past experience *to* the current sensory input.

  **The Engineer's Summary (The "Resolved Spec"):**

  1.  **Input:** Sense-Object Contact (*indriyārthasannikarṣa*).
  2.  **Process Stage 1 (Nirvikalpaka):**
      *   **Output:** Raw, non-conceptual cognition of object-particular + properties (colour, shape, type-essence) fused together without relational structure.
      *   **Spec Compliance:** `avyapadeśya` (NO words/concepts), `avyabhicārī` (unerring sensory data), `vyavasāyātmaka`? Not yet (lacks determination).
  3.  **Process Stage 2 (Savikalpaka):**
      *   **Input:** Nirvikalpaka output + Relevant memory/concepts.
      *   **Processing:** Apply concepts, form relations (subject-predicate), identify.
      *   **Output:** Determinate judgment ("This is a blue jar").
      *   **Spec Compliance:** `vyavasāyātmaka` (YES, determinate judgment), `avyabhicārī` (YES, when judgment correctly interprets sense data), `avyapadeśya`? YES, *in origin* (its validity flows directly from Stage 1 sensory input, not testimony/inference). `indriyārthasannikarṣotpannam`? YES (it's the *result* of the process initiated by contact).
  4.  **Final Product (Pratyakṣa):** Valid perceptual knowledge, covering the entire causal chain from sense-contact to determinate judgment.

  **Why not define them as separate pramāṇas?** Because both stages are causally and epistemically dependent on the *initial sense-object contact*. The *savikalpaka* is not a separate *means*; it's the *culmination* of the perceptual *process* initiated by that contact. Defining them together under `pratyakṣa` emphasizes that our usable, conceptual knowledge of objects is fundamentally grounded in direct sensory acquaintance.

  The tension you identified is real, but it's a productive one that forced the Naiyayikas to develop a nuanced and powerful model of perception that defends realism, explains the genesis of conceptual knowledge from sensory input, and accounts for both novelty and error. Your instinct to question the "spec" is precisely what drove centuries of brilliant philosophical commentary!
