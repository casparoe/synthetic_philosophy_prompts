prompt: |-
  I help moderate a mid-sized rationalist-adjacent forecasting-and-epistemics forum (something like a smaller cousin of LessWrong or the Metaculus discussion boards). We maintain a pinned "Community Consensus" wiki covering a handful of long-running empirical and methodological disputes that the userbase has argued out at exhaustive length and now treats as settled background. Over the past year, an increasing share of new threads have simply re-litigated these settled questions, often rehearsing arguments already addressed years earlier, and several moderators now want to adopt a formal rule: once an entry is tagged [Settled], any thread challenging it is automatically locked unless a moderator first certifies that it contains evidence or argument not already addressed in the consensus write-up. Proponents describe this as merely formalizing what good moderators already do informally. A few of us keep returning to the worry that the rule is structurally very close to Kripke's dogmatism paradox: we would be using our current confidence that P is settled to license screening out, in advance and without full examination, any future evidence against P -- exactly the move that argument shows knowledge (or something close to it) seems to license, despite this being an obviously poor policy for a community whose stated purpose is updating on evidence. I realize a community's provisional consensus is not quite the individual, factive knowledge state Kripke's argument concerns, and that this disanalogy may be doing real work, but the structural parallel still strikes me as more than superficial -- and I've seen people gesture at a related worry using Scott Alexander's "trapped priors" framing, though I am not sure whether that names the same phenomenon or merely a superficially similar one.

  Could you draft the internal policy memo the moderation team would actually circulate on this question? It should come down clearly on whether to adopt, reject, or substantially modify the certification-gate proposal; specify concrete criteria a moderator could apply in the moment when judging whether a challenge thread clears the bar; and include a review cadence or sunset clause for revisiting [Settled] tags rather than treating them as permanent. Most importantly, I would like the memo to engage with the dogmatism-paradox worry on its merits, including taking a position on what, if anything, distinguishes legitimate triage of low-quality repetition from the kind of pre-emptive evidence-screening the paradox describes, rather than setting the worry aside as too abstract for a moderation policy to address.
reasoning: |-
  Okay, the user is part of a moderation team for a rationalist-adjacent forum dealing with forecasting and epistemology. They have a "Community Consensus" wiki that's treated as settled on certain topics. Recently, there's been an increase in new threads rehashing these settled disputes, prompting a proposal to automatically lock any thread challenging a [Settled] tag unless a moderator certifies it contains new evidence or arguments. 

  The user's core concern is the structural similarity to Kripke's dogmatism paradox - where current confidence in a belief leads to dismissing future counterevidence. They want a policy memo that addresses this paradox head-on while providing practical moderation criteria. 

  First, I need to unpack the paradox clearly: Kripke shows that if someone claims to know P, they must dismiss any future evidence against P as misleading, which is epistemically problematic. But here, it's a community consensus, not individual knowledge. The forum's purpose is updating beliefs, so avoiding dogmatism is crucial. 

  The memo must balance two values: efficiency (not wasting time on rehashed debates) and epistemic integrity (remaining open to legitimate challenges). The key is distinguishing between lazy reruns vs. substantive new critiques. 

  For concrete criteria, I'm thinking of a three-pronged test for moderators: 
  1) Novel evidence (new data, studies, replicator failures) 
  2) Novel argument (new conceptual frameworks, overlooked implications) 
  3) Meta-level shifts (changes in related fields that destabilize old conclusions)

  Also vital: building in mandatory consensus reviews every 18-24 months with clear triggers for earlier reevaluation. This turns "settled" into "provisionally settled" - which directly addresses the paradox by formalizing openness to future counterevidence. 

  The certification process should require moderators to actively engage with new material, not just rubber-stamp. And we should document why challenges fail certification to reduce perception of censorship. 

  Ultimately the position is: adopt the rule but with robust safeguards against fossilization. The paradox is real but mitigated by treating consensus as provisional and requiring active justification for dismissal. This aligns with the forum's rationalist values better than either unchecked re-litigation or permanent dogma.
answer: |-
  ## MEMORANDUM: POLICY PROPOSAL RE: [SETTLED] THREAD CHALLENGES  
  **To:** Moderation Team  
  **From:** [Your Name/Moderation Lead]  
  **Date:** October 26, 2023  
  **Subject:** Balancing Consensus Integrity with Epistemic Vigilance  

  ### I. Proposal & Decision
  We **adopt** the certification-gate rule for threads challenging [Settled] consensus entries, **with critical modifications** to explicitly mitigate dogmatism-paradox risks.  

  **Rule:**  
  > Any new thread primarily challenging a [Settled] consensus entry will be **automatically locked upon posting**. A moderator may **unlock it only after certifying** that the thread presents *substantive novel contributions* not already addressed in the consensus documentation or prior exhaustive discussions. Certification requires posting a brief public rationale. Non-certified threads remain locked but visible.  

  ### II. Addressing the Dogmatism Paradox
  Kripke’s paradox highlights a genuine tension: if we treat "settled" as *infallible*, we risk preemptively dismissing counterevidence—antithetical to our mission. However, **consensus ≠ infallible knowledge**. Our [Settled] tag signifies:  
  1.  **Procedural Exhaustion:** The issue underwent extensive, good-faith scrutiny.  
  2.  **Provisional Stability:** Current evidence/arguments overwhelmingly favor one resolution.  
  3.  **Efficiency Mandate:** Re-litigation without new input consumes resources better spent on open questions.  

  **The Distinction:**  
  *   **Dogmatism Paradox Trap:** *"We know P is true, therefore no future evidence can undermine P."*  
  *   **Our Framework:** *"P reflects our best current synthesis; re-opening debate requires demonstrating why this synthesis is now inadequate."*  

  **Safeguards Against Paradoxal Outcomes:**  
  *   **Novelty Requirement:** Forces engagement with *why* prior synthesis might be incomplete.  
  *   **Transparency:** Public certification rationales document our reasoning.  
  *   **Sunset/Review:** Ensures "settled" isn’t permanent (see Section IV).  

  We reject *preemptive screening of evidence*; we mandate *elevating the burden of justification* for revisiting exhaustively vetted conclusions.  

  ### III. Certification Criteria: Judging "Substantive Novel Contributions"
  Moderators **must** actively compare the thread against the consensus doc and prior discussions. Unlock **only** if the thread clears **≥1** of these bars:  

  1.  **Novel Empirical Evidence:**  
      *   New, replicable data contradicting key consensus premises.  
      *   Rigorous re-analysis of original data exposing critical flaws.  
      *   Major real-world developments directly undermining consensus predictions.  
      *   *Not:* "What about this anecdote?" or misinterpreted studies.  

  2.  **Novel Conceptual Argument:**  
      *   A logically distinct argument not previously refuted or addressed.  
      *   Identification of a fundamental flaw in the original reasoning *overlooked* in prior debates.  
      *   Application of a new, relevant epistemic framework altering the analysis.  
      *   *Not:* Repackaged old arguments or semantic quibbles.  

  3.  **Material Context Shift:**  
      *   Emergence of a new field/discovery making prior analysis obsolete.  
      *   Demonstrated failure of consensus-based predictions in *novel, high-stakes* contexts.  
      *   *Not:* Minor contextual tweaks or hypotheticals already explored.  

  **Moderator Discipline Required:**  
  *   **Assume Good Faith:** Scrutinize for novelty even if initial presentation is poor.  
  *   **Document Rigorously:** "Certification denied: Argument X was refuted in [Link to 2021 Thread], points 3.2-3.5."  
  *   **Avoid Content Evaluation:** Certify *novelty*, not *correctness*. A bad new argument still gets heard.  

  ### IV. Consensus Review & Sunset Mechanism
  **[Settled] status is inherently provisional.** To prevent fossilization:  

  1.  **Mandatory Review Cadence:**  
      *   All [Settled] entries undergo formal community+moderator review **every 18-24 months**.  
      *   Review asks: "Does new evidence/arguments since tagging materially challenge this consensus?"  
      *   Outcome: Reaffirm, Update, or Retire the [Settled] tag.  

  2.  **Triggered Reviews:**  
      *   Automatically triggered if ≥3 certified challenges occur within 12 months.  
      *   Can be requested by any member via formal petition (5 supporting members required).  

  3.  **Tagging Standard:**  
      *   [Settled] entries MUST include: "Last Reviewed [Date]", "Next Scheduled Review [Date]", and "Challenge Trigger Threshold: [X] certified threads."  

  ### V. Implementation & Rationale
  This policy formalizes best practices while embedding robust anti-dogmatism measures:  
  *   **Why Certify?** Prevents forum degradation via endless re-litigation of exhausted debates.  
  *   **Why Unlock for Novelty?** Ensures the door stays open for legitimate updates.  
  *   **Why Sunset?** Acknowledges all consensus is contingent and temporal.  

  The Kripkean worry reminds us that epistemic vigilance requires *structures* to avoid complacency. This policy provides those structures: it demands justification for *both* maintaining consensus *and* re-opening debate. It aligns with our values by prioritizing **updating on substance** over either unconstrained skepticism or rigid orthodoxy.  

  **Action:** Vote to ratify this policy by [Date]. Final implementation docs due [Date].  

  ---  
