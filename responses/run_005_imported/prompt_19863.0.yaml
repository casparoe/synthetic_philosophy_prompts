prompt: |-
  For nearly three decades I worked as an astronomer surveying near-Earth objects, so I spent a good part of my career thinking about how often the Earth gets struck by asteroids and comets large enough to do serious damage. Since retiring I have joined a small reading group that works through books on the history and philosophy of science, and lately we have been arguing over a question that the book we are currently reading raises only in passing, but that I have not been able to let go of.

  The book estimates the probability of a civilization-ending impact, or of a supereruption on the scale of Toba, by counting how many such events show up in the geological and historical record and dividing by the span of time that record covers. One of the other members, a former statistician, insists this is exactly the right method, give or take the usual worries about small samples: it is simply base-rate estimation from observed frequency, the same procedure most of us used constantly in our own work. Another member, who is finishing a philosophy degree decades after the rest of us finished our science ones, objects that the method is quietly rigged, because the record we are counting from can only ever be a record in which no such event has actually finished us off — if one had, there would be no one left to compile the tally. On her view, our very presence as observers doing the counting is itself indirect evidence that the truly dangerous events are under-represented in the record relative to their real frequency, so the naive count understates the risk, perhaps badly. The statistician answers that this cannot be right, because the same move would let you wave away any inconvenient absence of evidence for anything at all, on the grounds that you would not be around to see it if the worst had already happened.

  I keep going back and forth on who has the better of this. Could you help me work out whether the philosophy student's objection is actually sound, and, if it is, what a defensible way of estimating the risk of these rare, potentially terminal events would have to look like once the objection is taken into account?
reasoning: |-
  Okay, I need to help this retired astronomer with a debate in their reading group. The core issue is about estimating the probability of civilization-ending events like asteroid impacts or supervolcanoes. The statistician in the group uses a straightforward base-rate method: count past events and divide by the time span. But the philosophy student objects that this method is flawed because we're only here to count because no such event has wiped us out yet. This is an interesting problem involving observation selection effects.

  First, I should understand the philosopher's point. It sounds similar to concepts like the anthropic principle or survivor bias. The key idea is that our existence as observers filters the possible data we can see. We can't observe events that would have prevented our existence. So for truly existential risks, the historical record might be missing the very worst cases because those would leave no observers behind to record them.

  The statistician's counterargument is that this could be used to dismiss any absence of evidence, which isn't scientifically valid. But I think the philosopher has a point specifically for terminal events - those that would prevent future observation. For non-terminal events, the standard method should work fine.

  I recall similar problems in other fields. In cosmology, there's the Fermi paradox - why haven't we observed other civilizations? One answer is that civilizations might self-destruct before becoming observable. In risk analysis for nuclear war or pandemics, we have to account for survivorship bias. So this isn't a new problem, but it needs careful handling.

  For the estimation problem, the base-rate method using historical data gives P(event occurs) but not P(event terminates civilization). We need to separate these. The historical frequency gives the rate of large impacts or eruptions, but not necessarily their civilization-ending potential every time. Some might be survivable.

  To incorporate the observation selection effect, we need to model both the event rate and the probability that such an event would actually cause human extinction. This requires additional assumptions or data sources. For example, we could use:
  - Geological records of past event sizes
  - Climate models to estimate effects on humanity
  - Studies of past human survival through disasters

  The Drake Equation in SETI comes to mind - it multiplies probabilities where some factors are unknown. Similarly here, we might express the risk as: 
  Risk = (Event frequency) × P(termination | event)

  The historical frequency gives us the first part, but the second part requires independent estimation. The philosopher's point affects how we interpret "termination" probability because we've never observed a true termination event.

  For practical estimation, we could:
  1. Use the historical record for event frequency (asteroid impacts, supervolcanoes)
  2. Estimate extinction probability separately using:
     - Physical effects modeling (e.g., impact winter severity)
     - Human vulnerability studies (e.g., food reserve capacity)
     - Near-miss events (e.g., Carrington Event scale)
  3. Acknowledge that for unprecedented-scale events, we have no direct data and must rely on models

  The key is that the observation selection effect doesn't invalidate the event count, but it does mean we can't directly observe the terminal outcome probability. We need to bring in other lines of evidence.

  I should also mention that for events where humanity survived, we can study why we survived - which gives data on resilience. This helps bound the extinction probability.

  Finally, the philosopher's concern is valid for true existential risks, but the solution isn't to abandon the base rate - it's to supplement it with other methods and clearly state the limitations. The statistician is right that we can't throw out all absence-of-evidence arguments, but for terminal events specifically, the selection effect is real and must be accounted for in the interpretation.
answer: |-
  Your reading group has touched upon a profound methodological problem at the intersection of statistics, philosophy of science, and existential risk assessment. The philosophy student's objection is **sound in principle**, though its practical implications depend on the specifics of the risk being estimated. Below, I'll clarify why the objection holds, when it matters most, and how to adjust risk estimates accordingly. I'll also address the statistician's counterargument.

  ### Why the Philosopher's Objection Is Valid: Observation Selection Effects
  The core issue is an **observation selection effect** (a form of anthropic bias). When estimating the probability of events that would prevent the existence of observers (e.g., human extinction), we can only observe data from histories where such events *did not occur*. This creates a systematic bias:
  - **For terminal events** (those that would eliminate all observers), the historical record is inherently censored. We have zero observations of actual extinction events, not because they never happened, but because they preclude our existence to record them.
  - **Result**: The naive base-rate method *underestimates* the probability of terminal events because it treats the absence of extinction in the observed record as evidence against it, ignoring that we *must* find ourselves in a history where extinction hasn't happened yet.

  This is analogous to:
  - **The "doomsday argument"** in cosmology (if humanity were likely to go extinct soon, we'd be unlikely to exist at this late stage).
  - **Survivorship bias** in engineering (e.g., only studying planes that returned safely while ignoring crashed ones).

  ### When the Bias Matters (and When It Doesn't)
  | **Event Type**               | **Naive Base-Rate Valid?** | **Why?**                                                                 |
  |------------------------------|----------------------------|--------------------------------------------------------------------------|
  | **Non-terminal events**      | Yes                        | Events with survivors (e.g., regional disasters) leave observable records. Absence of evidence *is* evidence of absence. |
  | **Near-miss terminal events**| Mostly yes                 | Events that *could* have caused extinction but didn't (e.g., smaller impacts) are observable and inform resilience. |
  | **True terminal events**     | No                         | We cannot observe extinction events; the record is censored by our existence. |

  For events like the Toba supereruption (74kya), which caused a population bottleneck but not extinction, the base-rate method works because humans survived to record it. For a hypothetical impact that *always* causes extinction, the bias is severe.

  ### Addressing the Statistician's Counterargument
  The statistician is right that we can't dismiss *all* absence of evidence this way—but the philosopher's point applies **only to terminal events**. For example:
  - **Non-terminal case**: If no dinosaur fossils are found in a rock layer, that *does* suggest dinosaurs were absent.
  - **Terminal case**: The absence of human fossils after a hypothetical extinction event isn't evidence against it—it's inevitable if the event occurred.  
  The key distinction is whether the event *allows for observers to exist afterward*. The statistician's worry about "waving away inconvenient absences" is valid for general science but doesn't hold for existential risks where observation is conditional on survival.

  ### A Defensible Framework for Estimating Terminal Risk
  To account for observation selection, we need to decouple two probabilities:
  1. **Event frequency** (λ): How often large-scale events (e.g., >10 km impacts) occur.
  2. **Conditional extinction probability** (θ): Given such an event, the probability it causes human extinction.

  The naive method estimates λ from historical/geological data but implicitly assumes θ is known (or 1). The philosopher shows that θ cannot be estimated directly because we lack data on actual extinction events. Instead:

  #### Step 1: Estimate event frequency (λ) conventionally
  - Use crater records, ice cores, sediment layers, etc., to count large events over time.
  - *Example*: For asteroids, we know of ~20 impacts >1 km in the last 500 Myr.  
  This remains valid because λ is a property of the physical universe, not contingent on observers.

  #### Step 2: Estimate conditional extinction probability (θ) using indirect methods
  Since we can't observe θ directly, combine:
  - **Physical models**: Simulate effects of events (e.g., impact winters, volcanic winters).  
    *Example*: A 10 km asteroid might cause multi-year darkness, collapsing agriculture. But θ < 1 if some humans survive in resilient communities.
  - **Near-miss studies**: Analyze events that caused bottlenecks but not extinction (e.g., Toba). These provide a *lower bound* for survivability.
  - **Vulnerability analysis**: Model human resilience (food storage, technology, geography).
  - **Uncertainty bounds**: Explicitly treat θ as a distribution (e.g., θ = 0.2–0.8 for a 10 km impact) due to unknowns.

  #### Step 3: Combine for terminal risk
  The annual extinction risk is:  
  **Risk = λ × θ**  
  - λ is derived from historical data (e.g., λ = 0.00005/year for 10 km impacts).
  - θ is estimated from models/vulnerability studies (e.g., θ ≈ 0.3 for a 10 km impact).

  ### Why This Works
  - **Avoids selection bias**: By separating λ (observable) from θ (model-based), we acknowledge that the historical record informs event frequency but not necessarily their terminal outcome.
  - **Quantifies uncertainty**: Use Bayesian methods to incorporate prior knowledge (e.g., "θ is likely low because humans survived Toba").
  - **Practical application**: NASA’s NEO risk assessments already use this separation, with θ informed by climate models and paleoclimate data.

  ### Limitations and Caveats
  1. **For unprecedented events** (e.g., a 100 km impact), θ is highly uncertain. Models are our only guide.
  2. **Human adaptability**: θ decreases with technological advancement (e.g., asteroid deflection).
  3. **Multiple risks**: Supervolcanoes, asteroids, and gamma-ray bursts have different λ and θ. Treat separately.

  ### Conclusion
  The philosophy student is correct that the naive base-rate method *underestimates* terminal risks due to observation selection effects. However, this doesn't invalidate historical data—it means we must supplement it with models to estimate the probability that an event would end civilization. A defensible approach estimates:
  - **Event frequency (λ)** from the geological/historical record.
  - **Extinction probability (θ)** from physical simulations and near-miss events.  
  The combined risk = λ × θ, with transparent uncertainty bounds. This framework respects both the statistician’s rigor and the philosopher’s insight, turning an epistemological puzzle into a tractable engineering problem. For your reading group, I recommend Bostrom (2002) *Anthropic Bias* and Toby Ord’s *The Precipice* for further discussion.
