  Strict liability offenses are interesting because they impose punishment without proof of fault, which directly conflicts with retributivism's focus on moral desert. Lewis's disanalogy highlights that punishing someone who isn't culpable is a category error. Familial punishment in customary systems clearly illustrates vicarious punishment, where innocent family members suffer for another's wrongdoing, directly challenging retributive principles.

