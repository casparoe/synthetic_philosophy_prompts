  Regarding legal fictions like corporate personhood, I think they sidestep rather than solve Lewis's puzzle. By treating collectives as single entities, the law avoids addressing whether individuals within them deserve punishment. This is a pragmatic evasion, not a philosophical resolution.

  The user might also need to consider policy implications. If Lewis's disanalogy holds, it could argue against practices like state sanctions that harm innocents or strict liability laws that punish without fault. But they should also address possible counterarguments, like deterrence or consequentialist justifications that might override retributive concerns.

