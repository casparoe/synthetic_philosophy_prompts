  Structure the dialogue: start with the demon case, Alex's solution, Sam's circularity objection, Alex's response about normative constraints, Sam's counter on motivation, then move to the fittingness-first alternative. End with unresolved tension to reflect ongoing debate. Ensure each responds to the other's points, e.g., Alex addressing the motivation issue, Sam insisting fittingness is irreducible.

