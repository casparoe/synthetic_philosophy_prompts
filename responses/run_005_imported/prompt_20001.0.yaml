  Hmm... the user needs a memo that serves multiple purposes: it must demystify Arrow's theorem for non-experts, evaluate competing claims (especially the apparent contradiction in supporting Schulze while invoking Arrow), and provide a practical recommendation. The stakes are real - this affects how their cooperative governs itself.

  First, I should map the key arguments:
  - The "Schulze guy" cites Arrow against ranked-choice but promotes another ranked method - that does seem logically inconsistent since Arrow applies to all ranked systems. Need to call that out gently but firmly.
  - The approval voting advocate claims exemption from Arrow (technically true but incomplete - it sidesteps rather than solves the theorem's constraints). That deserves nuanced explanation.
  - Plurality's strongest defense is its simplicity for a 14-person group, though its flaws just manifested painfully.

  For the memo structure:
  Start with concrete context - no jargon. Explain Arrow's theorem using their real-world spoiler example. Visualize how it applies to ranked systems. Then dismantle the Schulze contradiction: if Arrow makes all ordinal systems "arbitrary", why prefer one complex ranked method over another? 

  Approval voting's exemption claim needs framing: yes it avoids Arrow by not being ordinal, but that doesn't automatically make it better - just different tradeoffs. Should contrast its simplicity against potential "squeeze" effects where voters withhold support strategically.

  The recommendation should prioritize their actual needs: small group, occasional votes, no entrenched factions. Condorcet-IRV hybrid feels overengineered here. Approval or STAR voting offer better simplicity/accuracy balances. Might lean toward approval with bullet voting permitted - meets their "no spoilers" requirement while being dead simple to implement.

  Finally, preempt defensiveness - acknowledge plurality's simplicity argument honestly before explaining why the recent failure outweighs it. Offer to prototype alternatives for low-stakes votes first.

