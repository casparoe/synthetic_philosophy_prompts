answer: |-
  ## MEMO: Voting Method Review & Recommendation  
  **To:** All Co-op Members  
  **From:** [Your Name], Governance Committee  
  **Subject:** Clearing Up Voting System Confusion & Proposal for Q3 Elections  
  **Date:** [Date]  

  ### 1. The Problem We’re Solving  
  Last quarter’s steering election revealed a flaw in our current system (plurality/"most votes wins"): someone won despite being less preferred than another candidate head-to-head. This "spoiler effect" undermines trust in outcomes. We need a method that better reflects collective preferences.  

  ### 2. Arrow’s Theorem: What It *Actually* Says (and Doesn’t)  
  Our econ-minor colleague rightly notes **Arrow’s Impossibility Theorem** – but its implications are often misrepresented. Here’s what it means for us:  
  - **The Core**: With ≥3 candidates, *no ranked-choice system* can satisfy all 5 "fairness" criteria simultaneously (including "no spoilers" and "no dictator").  
  - **What It *Doesn’t* Say**:  
    - "All systems are equally bad" → **False**. Some violate fewer criteria or fail less severely in practice.  
    - "Plurality is just as good as ranked methods" → **False**. Plurality fails basic criteria (like Condorcet consistency) *more often* than ranked alternatives.  
  - **The Takeaway**: Arrow proves no *perfect* ranked system exists, but many are *better than plurality* for minimizing spoilers. It’s not a case for status quo.  

  ### 3. The Schulze Contradiction  
  Advocating for Schulze *while* citing Arrow as a reason to reject *all* ranked systems **is inconsistent**.  
  - Schulze (a ranked Condorcet method) is **subject to Arrow’s theorem** like any ranked system.  
  - Its strengths (e.g., resisting spoilers, handling complex preferences) don’t escape Arrow – it simply makes different tradeoffs than other ranked methods (like Instant Runoff Voting/IRV).  
  - **Why this matters**: If Arrow "makes all systems equally arbitrary," there’s no reason to prefer Schulze over plurality. But if Schulze’s tradeoffs are *better for us*, that’s a valid argument – not one from Arrow.  

  ### 4. Approval Voting & Arrow: A Partial Truth  
  The claim that "Arrow doesn’t apply to Approval because it’s not ordinal" is **technically correct** – Approval uses a different ballot (vote for *any* you approve).  
  - **The Caveat**: Approval avoids Arrow only by sidestepping ranked preferences. It has its *own* tradeoffs:  
    - **Strengths**: Simple, resists spoilers, easy to implement.  
    - **Weaknesses**: Can encourage "bullet voting" (approving only one) or "squeeze" (burying a moderate frontrunner).  
  - **Not a silver bullet**: "Exempt from Arrow" ≠ objectively better. It solves spoilers but may not reflect nuanced preferences.  

  ### 5. Evaluating Our Options  
  | **Method**       | **Pros**                                  | **Cons**                                  | **Arrow Applies?** |  
  |-------------------|-------------------------------------------|-------------------------------------------|--------------------|  
  | **Plurality**     | Dead simple, familiar                    | High spoiler risk, "lesser evil" wins     | No (but fails other criteria) |  
  | **IRV (Ranked-Choice)** | Reduces spoilers, ensures majority support | Complex tally, can fail "Condorcet winner" | Yes |  
  | **Schulze**       | Handles complex preferences well, robust | Very complex, opaque results              | Yes |  
  | **Approval**      | Simple, no spoilers, fast count          | Can misrepresent intensity of preference  | No |  

  ### 6. Recommendation: Approval Voting for Simplicity & Stability  
  **For our 14-person co-op, we recommend Approval Voting** for steering elections and project selection:  
  - **Why Approval?**  
    - **No spoilers**: Prevents last quarter’s problem.  
    - **Simplicity**: Vote for all acceptable candidates/projects. No rankings, no math PhD required.  
    - **Transparency**: Easy hand-count. Winner has most approvals.  
    - **Scalability**: Works identically for 3 candidates or 3 projects.  
    - **Proven in small co-ops**: Used successfully by similar tech cooperatives.  
  - **Best Argument for Keeping Plurality (Fairly Stated)**:  
    *"With only 14 voters, discussions can align preferences enough to make spoilers rare. Plurality is lightning-fast and avoids analysis paralysis when we need to decide fast."*  
    **Counter**: Last quarter proved spoilers *can* happen here. Approval is nearly as simple and eliminates this risk.  

  ### 7. Proposed Path Forward  
  1. **Adopt Approval Voting** for the next steering election (Q3).  
  2. **Ballot Example**:  
     ```  
     STEERING CANDIDATES: [ ] Alex [ ] Sam [ ] Taylor [ ] Jamie  
     Vote for ALL you find acceptable to serve.  
     ```  
  3. **Pilot Period**: Use Approval for 2 elections cycles. Re-evaluate if issues arise.  
  4. **Process**: For project selection, apply Approval to *project options* (vote for all you’d support taking on).  

  **Why not Schulze/IRV?** Complexity outweighs benefits at our scale. We need transparency and speed, not theoretical optimality.  
  **Why not stick with plurality?** The spoiler risk is real and damages trust. Approval fixes this with minimal friction.  

  **Vote at our meeting:** Let’s align on Approval Voting so we can focus on implementation. I’ll share a draft ballot for feedback.  

  —  
  *Appendices*  
  - **Arrow’s Criteria**: 1) Unrestricted Preferences, 2) Pareto Efficiency, 3) IIA, 4) Non-Dictatorship.  
  - **Further Reading**: [Approval Voting on Electowiki](https://electowiki.org/wiki/Approval_voting), [Co-op Vote Case Study](https://institute.coop/resources/worker-co-op-elections-approval-voting)
