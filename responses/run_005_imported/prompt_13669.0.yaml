prompt: |-
  Back when I was doing particle physics, entire collaboration meetings would get eaten up arguing about whether an upper-limit prior should be flat in the cross-section or flat in the log of it, and nobody could ever settle the arguement on principled grounds. I'm retired now but I still referee the odd paper, and since getting into philosophy as a hobby I stumbled on Bertrand's paradox and the principle of indifference, which I think is basically why we could never settle it. Could you spell out the most important implications of Bertrand's paradox for how a scientist should (or shouldn't) reach for "we have no information, so let's just be indifferent" reasoning when picking a prior?
