  First, I need to unpack Rorty's actual position. The user's friend simplified it, but Rorty's antirepresentationalism is more complex. He rejected the correspondence theory of truth, meaning truth isn't about matching an external reality. Instead, truth is about what works within a community's practices. The quote about "getting away with" is provocative, but it's from an interview where he was being casual. In his academic work, he emphasized justification within a community rather than mere consensus.

  Rorty made a distinction between truth and justification. He argued that truth is an unattainable ideal, but justification is what we actually do. We justify beliefs through dialogue, evidence, and norms within our community. So, when a demagogue makes false claims, Rorty would say they're not justified because they don't meet the community's standards of evidence. He wasn't against facts; he was against the idea that facts are mind-independent. Facts are what we agree upon through reliable methods.

  The user is worried that without an external check, there's no way to counter a demagogue's lies. But Rorty would rely on the community's epistemic norms. For example, in a democratic society, norms like free press, peer review, and open debate are tools to challenge falsehoods. If a group ignores these norms, that's a problem of politics, not philosophy. Rorty believed that liberal institutions and solidarity are necessary to maintain these norms.

  The user might be conflating the lack of an external reality check with moral relativism. Rorty wasn't a relativist; he was an ethnocentrist. He thought we should start from our own community's values and expand solidarity. So, he could criticize demagogues by appealing to shared democratic values and the harm caused by undermining institutions.

  Also, Rorty's prediction in "Achieving Our Country" was a warning. He wanted the left to focus on economic justice to prevent the rise of a strongman. His philosophy doesn't endorse post-truth; it warns against abandoning the tools that maintain justification. The self-own isn't there because his critique relies on the very norms that post-truth politics undermines.

