answer: |-
  That's an incredibly sharp question cutting to the heart of Rorty's relevance to post-truth politics. Your philosopher friend isn't *wrong* in quoting that provocative line, but she's presenting a **radically oversimplified and potentially misleading caricature** of Rorty's nuanced position. Attributing the *alibi* for post-truth to Rorty misunderstands his core project. Here's the breakdown:

  1.  **The Provocative Quote vs. Nuanced Position:**
      *   **"Truth is what your contemporaries let you get away with":** This is indeed a line Rorty used (notably in an interview, less so in rigorous academic work). Taken in isolation, it sounds like pure consensus relativism. It's easy fodder for critics.
      *   **The Reality:** Rorty wasn't denying the existence of facts or the importance of justification. He was attacking the **representationalist picture of knowledge** – the idea that the mind (or language) passively "mirrors" a pre-existing, mind-independent reality, and that "Truth" is this perfect correspondence. He saw this picture as unhelpful, metaphysical baggage inherited from Plato and Descartes.

  2.  **Rorty's Core Distinction: Truth vs. Justification:**
      *   This is the crucial point your piece needs to emphasize. Rorty relentlessly argued we should **stop talking about "Truth" (with a capital T)** as this mysterious, inaccessible thing "out there" and focus instead on **justification**.
      *   **Justification:** This is the social practice of giving *reasons* for our beliefs. It happens *within* a linguistic community, using the norms, standards, evidence, and vocabulary *available* and *accepted* within that community. Justification relies on things like:
          *   Sensory evidence ("Look, the crowd picture shows empty spaces").
          *   Logical coherence ("Your claim contradicts the certified vote counts from multiple sources").
          *   Predictive success ("Your policies didn't produce the results you promised").
          *   Agreement with reliable authorities and institutions (scientists, journalists, courts – *when* they function well).
          *   Avoiding cruelty and expanding solidarity (a key Rortyan *ethical* imperative).
      *   **"Truth":** For Rorty, "Truth" is just an empty compliment we pay to beliefs that are *currently* well-justified within our best practices. He famously said we should treat "true" as simply meaning "you can defend it against all comers." It's not that there's *no* outside check; the "check" is the *ongoing process of justification within a community committed to certain norms*.

  3.  **How This Addresses Your Demagogue Concern:**
      *   **Rorty *Can* Object, Vigorously:** He doesn't need an inaccessible "Reality" to object to "biggest crowd ever" or "stolen election" claims. His objection is grounded in **failed justification within the relevant epistemic community** (ideally, a democratic society committed to liberal norms).
          *   **Evidence:** Satellite images, headcounts, certified vote tallies, multiple independent audits, lack of credible evidence presented by the claimant – these are the *reasons* used within our community's justificatory practices.
          *   **Norms:** The demagogue *violates* the norms of justification: ignoring evidence, relying on emotion and repetition, attacking institutions designed for verification (courts, press), creating alternative epistemic bubbles.
          *   **Consequences:** Rorty, the liberal ironist, would argue these claims *cause harm* – they undermine trust in institutions necessary for democracy, potentially incite violence, and represent a failure of solidarity. This is a *pragmatic* and *ethical* objection based on the *consequences* of abandoning shared justificatory norms.
      *   **The Problem Isn't "No Reality," It's Bad Faith/Broken Norms:** Rorty's worry isn't that justification is *only* consensus. His warning in "Achieving Our Country" is precisely that if the Left abandons economic justice and class solidarity (the glue holding a broad justificatory community together), and if institutions lose public trust, then *the norms of justification themselves break down*. The demagogue *exploits* this breakdown by creating a *new*, smaller, tribal "community" (his base) with *different*, loyalty-based "norms" where justification *is* simply "what the leader says and the tribe accepts." This *is* the post-truth scenario, but Rorty sees it as a *pathological failure* of the social practices of justification, not their inevitable outcome.

  4.  **The Distinction You Might Be Flattening: Social Practice vs. Arbitrary Consensus:**
      *   **Flattened View:** Truth = Whatever the majority/powerful group says right now. No standards, anything goes.
      *   **Rorty's View (Neopragmatism):** Justification is a *norm-governed social practice* with history, tools (logic, evidence, institutions), and *implicit standards* inherited and refined over time within communities committed to inquiry and avoiding error. It's *contingent* and *evolving*, not divinely ordained, but it's not *arbitrary*. Saying gravity is caused by invisible fairies isn't "true for them" in Rorty's framework; it's *unjustified* within *any* community committed to scientific norms and evidence. The demagogue's claims fail *by the standards the demagogue's own society developed and (ideally) valued*.

  5.  **The "Self-Own" Question: Prediction vs. Alibi:**
      *   **Not an Alibi:** Rorty wasn't providing an *excuse* for post-truth; he was issuing a *warning* based on his analysis of the *conditions necessary for healthy justification*. His prediction stemmed from seeing the *erosion* of the shared social solidarity and trust in institutions that make robust justification possible across a diverse society. He feared the Left's cultural focus would alienate the working class, creating fertile ground for a strongman who would *further destroy* those justificatory practices.
      *   **The Philosophical Stance:** His antirepresentationalism doesn't *cause* post-truth; it offers a *diagnostic framework* for understanding how truth-claims *function* socially. He believed abandoning the quest for "Capital T Truth" would *free us* to focus on improving our justificatory practices, expanding solidarity, and preventing cruelty – all things actively *undermined* by post-truth politics. The demagogue represents the *triumph* of the tribal, non-justificatory mode Rorty feared, not a validation of his epistemology.

  **Conclusion for Your Piece:**

  You *can* be fair to Rorty while acknowledging the tension. Frame it like this:

  *   Rorty brilliantly diagnosed the *cultural and economic preconditions* that could lead to post-truth politics: the collapse of leftist solidarity around economic justice and the alienation fueling resentment against "expert" elites.
  *   His core philosophical project (rejecting representationalism, focusing on justification-as-social-practice) was **descriptive and therapeutic**, aiming to free us from unhelpful metaphysical anxieties.
  *   **Crucially, this philosophy does *not* equate truth with arbitrary power or momentary consensus.** It grounds truth claims in the rigorous, norm-governed, evidence-based *practice of justification* within a community committed to liberal, democratic values and solidarity.
  *   Therefore, Rorty **absolutely has the tools** to condemn the demagogue: the demagogue *systematically violates the norms of justification*, destroys the institutions that enable it, replaces evidence with loyalty, and causes demonstrable harm – all anathema to Rorty's pragmatic and ethical commitments.
  *   The tragic irony isn't that Rorty supplied the alibi, but that his **warning about the *fragility* of the social practices underpinning justification** proved so prescient. Post-truth politics isn't the fruit of neopragmatism; it's the result of the *collapse* of the shared world and norms Rorty believed were essential for a functioning liberal democracy, a collapse he saw coming precisely *because* he understood how contingent and vital those practices are.

  Rorty provides a powerful lens for *understanding* post-truth, not a justification for it. The demagogue's success lies in *breaking* the machinery of justification Rorty described, not in following its logic.
