  ok so this happened with my friend priya and i can't tell if i messed up. shes been trying to save up for a laptop for college apps but kept impulse buying stuff, so she gave me her debit card and made me pinky promise not to give it back before september no matter what she said later, even if she begged, cried, or had some crazy story. she was dead serious about it, and its not even the first time shes tried something like this — last year she did the same thing with her phone and found an "exception" within like a week. anyway, last week she texts me at midnight panicking because her favorite artist announced a one-night-only show and tickets were selling out, saying "i will never get this chance again, i NEED it back right now." i caved and gave it to her. she got the tickets and is happy, but afterward she even said maybe i shouldn't have given in. i feel like i did something wrong but i can't totally explain what, since in the moment she genuinely wanted those tickets more than anything in the world. was i wrong to give it back? and more generally, how am i even supposed to tell when "this time is actually different" is true versus her just being impulsive again?
