  ### Ranked Tier List

  ```json
  {
    "S": ["6", "1"],
    "A": ["2", "5"],
    "B": ["7"],
    "C": ["4"],
    "D": ["3"]
  }
  ```

  ### Reasoning Behind Each Tier

  #### **S Tier (Most Defensible): Strategies 6 and 1**  
  - **Strategy 6 (Redirect effort upstream, toward auditing historical labels)**: This is the most defensible because it addresses the root cause of bias rather than symptoms. Auditing training data ensures labels (e.g., "qualified") reflect true merit, not historical discrimination. This upstream focus aligns with fairness literature (e.g., "garbage in, garbage out") and mitigates the impossibility problem by reducing disparate base rates.  
  - **Strategy 1 (Prioritize equal false-negative rates)**: Ensures qualified candidates from all groups have equal selection opportunities. This "equal opportunity" approach is ethically robust in hiring, as false rejections (losing talent) are costly and inequitable. It directly combats exclusion, resonating with both moral imperatives and business efficiency.  

  #### **A Tier (Strong but with Trade-offs): Strategies 2 and 5**  
  - **Strategy 2 (Prioritize within-group calibration)**: Calibration ensures risk scores are equally reliable across groups (e.g., a score of 80% means 80% success chance for all). This is statistically principled and promotes trustworthiness. However, it may perpetuate outcome disparities if base rates differ, making it slightly less ideal than S-tier options.  
  - **Strategy 5 (Report multiple metrics, delegate trade-offs)**: Transparency is key here. Reporting metrics (e.g., FNRs, calibration, impact ratios) acknowledges the impossibility theorem and empowers human reviewers to contextualize trade-offs. It avoids oversimplification but relies on human judgment, which could introduce bias if not carefully managed.  

  #### **B Tier (Moderately Defensible): Strategy 7**  
  - **Strategy 7 (Use randomized/score-dependent thresholds)**: Interpolating between calibration and error-rate balance is a technically sophisticated compromise. For example, group-specific thresholds could equalize FNRs while preserving calibration near critical decision boundaries. However, it risks legal challenges (explicit group-based adjustments) and complexity, making it harder to implement and justify.  

  #### **C Tier (Less Defensible): Strategy 4**  
  - **Strategy 4 (Replace with individual/similarity-based fairness)**: Individual fairness (e.g., "similar candidates treated similarly") avoids group categories but is often impractical. Defining "similarity" is subjective and can encode bias. In hiring, systemic disparities require group-aware interventions; ignoring groups may perpetuate inequities, making this a weak standalone solution.  

  #### **D Tier (Least Defensible): Strategy 3**  
  - **Strategy 3 (Treat legal test as sufficient)**: The four-fifths rule alone is inadequate, as it ignores error distribution and calibration. Relying solely on it ignores core fairness trade-offs highlighted by impossibility theorems. It signals complacency, undermines trust, and leaves the company vulnerable to ethical and reputational risks.  

  ### Summary  
  The ranking prioritizes **upstream interventions (S)** and **equal opportunity (S)** as they tackle foundational or high-stakes fairness issues. **Calibration and transparency (A)** follow as principled complements. **Technical compromises (B)** and **individual metrics (C)** are less robust, while **compliance minimalism (D)** is indefensible given the known limitations of group-parity tests. This approach balances ethical rigor, practicality, and business risk.
