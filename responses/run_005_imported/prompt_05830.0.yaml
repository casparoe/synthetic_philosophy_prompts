  But the friend's objection is key here: why should the choice of the Turing machine matter? Different machines might assign different complexities to the same hypothesis. That's where the invariance theorem comes in. It states that while Kolmogorov complexity is machine-dependent, the difference is bounded by a constant. So for large data sets, the choice of machine becomes negligible. But for small complexities, the constant matters, leading to residual conventionalism.

  The user is probably looking for clarity on whether this invariance truly addresses the arbitrariness. They might be grappling with the philosophical implications—does the theorem save Occam's razor from being arbitrary, or does it just push the arbitrariness to a constant? Also, they mentioned "residual conventionalism," so they want to know if there's still an element of subjectivity.

