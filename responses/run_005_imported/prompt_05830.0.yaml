  The user's deeper need might be understanding the philosophical stance. They want to know if science's preference for simplicity is well-founded or just practical. The answer lies in balancing the theoretical invariance with practical limitations. Solomonoff induction works in the limit, but finite data introduces dependence on the machine choice, hence residual conventionalism.

  I should also address why we use universal Turing machines. Their universality means they can simulate each other, which is why the constant exists. But this universality is a convention, so there's a foundational reliance on that concept. The user's friend might see this as circular, but it's a necessary starting point.

