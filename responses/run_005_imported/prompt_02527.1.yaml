  Breaking down Mill's argument: He says that allowing someone to sell themselves into slavery defeats the purpose of liberty itself. Freedom requires the ability to make future choices, so permanently giving up that ability is paradoxical. The "presumption" here is that staying in a situation voluntarily indicates it's acceptable. But once you're enslaved, you can't leave, so that presumption vanishes. 

