prompt: |-
  Ok, this has been bugging me since I saw it argued on a couple different rationalist blogs/forums: Good's theorem proves that for a bayesian agent facing a decision, the expected value of free evidence is never negative -- worst case you just act like you never saw it, so learning true things can only help you in expectation, never hurt you. Given that, I dont get why the same crowd still takes 'information hazards' seriously as something an individual should worry about for their own sake -- like people who decline genetic testing for untreatable conditions -- instead of just relabeling 'info other people might misuse against me' with a scarier-sounding name. Shouldn't the theorem settle that deliberately staying ignorant of something 'for your own good' is never actually the rational move, just a comforting story people tell themselves after the fact?
reasoning: |-
  Okay, let me unpack this user's question. They're referencing Good's theorem about Bayesian decision theory and how it conflicts with the concept of information hazards. The user is confused because the theorem suggests that free evidence can't have negative expected value, yet rationalist communities still take information hazards seriously. 

  First, I need to verify my understanding of Good's theorem. It states that for a Bayesian agent, acquiring free evidence (without cost) should have non-negative expected value. The reasoning is that you can always ignore the new information and be no worse off. But the user points out real-world cases like avoiding genetic testing for untreatable diseases, which seems to contradict this.

  Hmm, the key here is identifying where Good's assumptions might not hold in real human contexts. The theorem assumes perfect Bayesian updating and consistent utility functions. But humans aren't ideal Bayesian agents - we have cognitive limitations, emotional responses, and our preferences aren't always stable when confronted with new information.

  I recall that information hazards become relevant when information causes harm through psychological impact or changes in behavior that lead to worse outcomes. For example, learning about an untreatable disease might cause depression that affects life decisions, or knowing genetic risks could influence mating choices in ways that decrease overall welfare.

  The user's frustration seems to come from seeing this as irrational post-hoc justification. But from a decision theory perspective, if the act of acquiring information itself changes your utility function (e.g., through psychological distress), then Good's theorem's assumptions are violated. 

  Also worth considering: in Good's framework, "free" evidence means no cost to obtain, but doesn't account for the cost of processing or emotional burden. For humans, even true information can carry psychological costs that affect decision-making capacity. 

  The genetic testing example is perfect - avoiding knowledge might be rational if the distress would significantly impair daily functioning, even if the factual knowledge itself doesn't change physical reality. This isn't about other people misusing information (though that's another valid angle), but about internal psychological impacts.

  I should emphasize that while Good's theorem holds mathematically under its assumptions, human cognition operates under different constraints. The rationalist community's concern with information hazards acknowledges these real-world complexities rather than contradicting decision theory fundamentals.
answer: |-
  You've hit on a genuinely fascinating tension between abstract decision theory and real-world human cognition. Good's theorem *is* formally correct under its assumptions, but the disconnect with "information hazards" arises because humans systematically violate those assumptions. Here's why information hazards remain a serious concern:

  1.  **Violation of Core Assumptions:**
      *   **Costless Information Processing:** Good's theorem assumes acquiring and processing evidence is *free* (computationally, emotionally). For humans, processing traumatic or identity-shattering information carries significant cognitive and emotional costs (anxiety, depression, decision paralysis, therapy costs, lost productivity). This *processing cost* is negative utility not accounted for in the theorem.
      *   **Stable Utility Function:** The theorem assumes your preferences (utility function) remain constant regardless of the information received. Humans are not like this. Learning devastating information *changes* what we value or how we weigh values. Knowing you have an untreatable fatal disease might shift your utility function towards minimizing suffering vs. maximizing longevity, fundamentally altering the "optimal" decision landscape *in a way that feels inherently worse*.
      *   **Perfect Bayesian Updating:** Humans are terrible Bayesians. We suffer from biases (availability, affect heuristic, base rate neglect). Traumatic information can *distort* our probability assessments and decision-making far beyond rational updating, leading to genuinely worse choices (e.g., excessive risk aversion, fatalism).
      *   **"Free" Evidence:** The evidence itself might not be free. Seeking genetic testing involves time, money, and psychological preparation. Good's theorem applies *given* you have the evidence, not necessarily to the *act of acquiring* it if acquisition has costs.

  2.  **The Mechanism of Harm: Psychological Impact & Behavioral Change:**
      The harm from "pure" information hazards often isn't from the *facts* themselves, but from their *psychological impact* on the agent, which then influences *behavior* in suboptimal ways:
      *   **Anxiety & Depression:** Learning about a high genetic risk for Alzheimer's (even if untreatable) can cause chronic anxiety or depression, reducing current quality of life. This negative utility directly counters any potential benefit from planning.
      *   **Decision Paralysis:** Overwhelming information can freeze decision-making. Knowing too many catastrophic risks might make any action seem futile.
      *   **Self-Fulfilling Prophecies:** Knowing a negative prediction can cause behaviors that make it *more* likely (e.g., learning about a genetic predisposition to addiction might increase fatalism and reduce resistance to temptation).
      *   **Loss of Hope/Ignorance Bliss:** Current utility can be derived from hope or blissful ignorance. Destroying that hope, even with truth, results in an immediate utility drop that isn't always compensated by better future decisions (especially for distant, uncontrollable risks).

  3.  **The "Option Value" of Ignorance:**
      Deliberate ignorance preserves the *option* to learn later, under potentially better circumstances (e.g., when treatment becomes available, when emotionally stronger, when costs are lower). Learning irreversible information now destroys this option value. Good's theorem considers the value *given the evidence is revealed now*, not the value of *deferring* revelation.

  4.  **Distinguishing "Pure" Hazards from Misuse Hazards:**
      You're right that *many* cited information hazards are really about *misuse by others* (discrimination, blackmail, social stigma). However, the "pure" internal hazard exists independently:
      *   **Untreatable Conditions:** The primary harm for an individual declining genetic testing for Huntington's isn't (usually) others misusing it *first*, but the devastating psychological burden of knowing your fate decades in advance with no recourse. Many prefer the uncertainty, finding it easier to live with "maybe" than "definitely."
      *   **Traumatic Knowledge:** Learning horrific details about a loved one's death, or witnessing extreme violence, can cause PTSD. The information itself is the vector of harm.
      *   **Existential Dread:** Learning convincing arguments for high risks of astronomical suffering (s-risks) or nihilistic philosophies can trigger debilitating existential crises for some individuals.

  **Why Good's Theorem Doesn't Settle It:**

  Good's theorem proves that *for an ideal Bayesian agent with a stable utility function and costless computation*, the expected value of seeing the evidence is non-negative *compared to not seeing it but still having to make the same decision*. It doesn't prove that the agent's *overall expected utility* after seeing the evidence is higher than their utility *would have been if they had never even had the option to see it*. Crucially, it doesn't account for:

  *   The cost of processing the evidence.
  *   The potential for the evidence to destabilize the utility function itself.
  *   The psychological harm inflicted *by the knowledge itself*, irrespective of decisions made from it.
  *   The value of the option to remain ignorant.

  **Conclusion:**

  The rationalist crowd takes information hazards seriously precisely *because* they understand Good's theorem and its limitations. They recognize that humans are not ideal Bayesian agents. While Good's theorem correctly shows you can't make *better* decisions by ignoring *available* evidence (assuming no processing costs), it **does not** prove that deliberately *avoiding the acquisition* of certain information (especially when acquisition/processing has costs or risks destabilizing your cognition/values) is irrational.

  Declining genetic testing for an untreatable condition isn't (necessarily) "just a comforting story." It can be a rational calculation that the *psychological burden* of knowing (the processing cost + the direct negative utility of the knowledge + potential for distorted decisions) outweighs any potential benefit from marginally better life planning. This is a legitimate "pure" information hazard for the individual. Good's theorem is a powerful insight about evidence *within* a decision problem, but it doesn't negate the reality that some knowledge can be existentially costly for humans to bear.
