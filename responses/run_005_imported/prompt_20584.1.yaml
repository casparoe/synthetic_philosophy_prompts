prompt: |-
  I'm teaching a graduate seminar on decision theory this term, and last week we went through the classic Davidson-McKinsey-Suppes money pump argument for why preferences have to be transitive -- you know, the bit where a vendor sells you A for B, then B for C, then C for A, charging a small fee each time, until you've been fleeced despite ending up right back where you started with A. One of my students brought up McClennen's old point about "resolute" choosers: an agent who commits to a plan at the outset and just doesn't reconsider mid-sequence never actually gets pumped, even though her preferences over A, B, and C stay perfectly cyclical the whole time. That seems basically right to me, but it left me stuck on a bigger question that I keep going back and forth on.

  Does the resolute-choice reply show that the money pump argument never really established a synchronic constraint on preferences (i.e., that they be transitive at any given moment), and that it was only ever smuggling in a diachronic constraint about not revising your plan partway through? My TA insists these two collapse into the same requirement once you actually spell out what being "resolute" commits you to, and I'm not so sure she's right. Could you walk me through, in some detail, why the resolute-choice reply does or doesnt succeed at prying apart the synchronic and diachronic readings of the transitivity requirement -- and where "sophisticated" choosers (who anticipate the whole sequence but don't bind themselves to a plan) fit into that picture? Would love a sharper take on this before I have to face the class again Thursday.
reasoning: |-
  Okay, let me start by unpacking the user's question. They're teaching a graduate seminar on decision theory and discussed the money pump argument. A student brought up McClennen's resolute choice, which challenges the idea that transitivity is a synchronic requirement. The user is stuck on whether the resolute-choice reply shows that the money pump only imposes a diachronic constraint, not a synchronic one. Their TA thinks the two collapse, but the user isn't sure.

  First, I need to recall the money pump setup. If a person has cyclic preferences (A>B, B>C, C>A), they can be exploited by trading A for B plus a fee, then B for C plus a fee, then C for A plus a fee. They end up with A but poorer. The argument is that transitivity is necessary to avoid this.

  But resolute choosers commit to a plan. They might avoid the pump by refusing to reconsider. So the key question is whether this means transitivity isn't needed at a single time, but rather a constraint on how you handle sequences. 

  The user’s deeper need is to clarify for their class whether transitivity is synchronic or diachronic. They also want to understand where sophisticated choosers fit in. Sophisticated choosers plan backward, avoiding pumps but not committing like resolutes.

  I should break down the resolute approach. If an agent commits to not trading at all, they avoid all transactions. Their cyclic preferences exist but aren't acted upon in a way that leads to pumping. So the pump doesn't force synchronic transitivity because resolutes escape without it.

  But the TA argues that being resolute requires synchronic consistency. For example, at the start, committing to a plan might need consistent preferences. But McClennen's point is that resolutes can have cyclic preferences but choose a plan that avoids exploitation. Their commitment overrides the cyclic impulses later.

  Then there's sophisticated choosers. They use backward induction. If they see that trading to C would lead to trading back to A with a fee, they avoid starting the cycle. So they don't get pumped but still have cyclic preferences. This supports the idea that the constraint is diachronic—managing sequences, not single-time preferences.

  The collapse argument: if at t0 the resolute prefers a plan that avoids trading, this might imply that their preferences over plans are transitive. But the user might counter that the object of commitment isn't the same as the synchronic pairwise preferences. Resolutes can have cyclic pairwise preferences but prefer a plan that avoids acting on them.

  Where does this leave the user? They need to present both sides. The resolute reply does pry apart synchronic and diachronic constraints. Synchronic transitivity isn't necessary if agents can commit or plan ahead. But one could argue that commitment requires consistent preferences at the time of planning. However, the cyclic preferences still exist synchronically; the agent just avoids acting on them through commitment.

  For the class, the user should clarify that money pumps show a pragmatic problem with cyclic preferences in dynamic settings, but resolutes and sophisticates avoid it without synchronic transitivity. The constraint is about how preferences interact over time, not just at a single moment.
answer: |-
  Let's break this down systematically. The resolute-choice reply *does* successfully pry apart the synchronic and diachronic readings of the transitivity requirement, exposing a key ambiguity in the money pump argument. Here's how the pieces fit:

  ### 1. **The Core Tension: Synchronic vs. Diachronic**
     - **Synchronic Constraint**: Preferences at a single time *t* must satisfy transitivity (if A≻B and B≻C at *t*, then A≻C at *t*).
     - **Diachronic Constraint**: Preferences must be stable *across time* or resistant to revision during sequential choice.  
     The money pump appears to target synchronic intransitivity, but resolute agents show that synchronic intransitivity isn't *sufficient* to cause exploitation—it must be combined with diachronic instability.

  ### 2. **How Resolute Choosers Block the Pump**
     - A resolute agent with cyclical preferences (A≻B, B≻C, C≻A) **commits at t<sub>0</sub> to a plan** (e.g., "keep A forever"). 
     - When offered trades (A→B for a fee, then B→C, then C→A), they **reject all deviations** from their initial plan.  
     - **Result**: No money is lost. Cyclical preferences persist, but exploitation is avoided *without* synchronic transitivity.  
     - **Key Insight**: Resoluteness converts a sequential choice problem into a single, comprehensive decision at *t<sub>0</sub>*. The agent evaluates the *entire sequence* as one "plan" and sticks to it.

  ### 3. **Why This Pries Synchronic and Diachronic Apart**
     - **The Pump Requires Two Conditions**:  
       (a) Synchronic intransitivity (cyclical preferences *at each choice point*).  
       (b) Diachronic non-commitment (re-evaluating choices *mid-sequence*).  
     - **Resoluteness severs the link**: It satisfies (a) but blocks (b). The pump fails *despite* persistent synchronic intransitivity.  
     - **Collapse Argument (Your TA's View)**: "To be resolute, you must have a synchronic preference at *t<sub>0</sub>* for the plan 'keep A' over plans involving trades." But this misstates McClennen:  
       - Resoluteness is a **diachronic policy**, not a synchronic preference. The agent *could* synchronicly prefer B to A at *t<sub>1</sub>* but still reject the trade because they are *bound* by their *t<sub>0</sub>* commitment.  
       - The synchronic "preference" for commitment isn’t over outcomes but over *temporal identities* ("I prefer my *t<sub>0</sub>* self’s plan over my *t<sub>1</sub>* self’s temptation"). This is fundamentally diachronic.

  ### 4. **Sophisticated Choosers: The Middle Ground**
     - Sophisticates **anticipate future choices** but **do not commit**. They use backward induction:  
       - At *t<sub>0</sub>*, they foresee that accepting A→B would lead to B→C (since B≻C at *t<sub>1</sub>*), then C→A (since C≻A at *t<sub>2</sub>*), leaving them with A plus fees.  
       - They **reject the first trade** to avoid the cycle.  
     - **Implication**: Like resolutes, sophisticates avoid the pump *without* synchronic transitivity. But unlike resolutes, they don’t bind themselves—they strategically *accommodate* their future selves’ intransitivity.  
     - **Diachronic Dimension**: Sophistication requires consistent **forecasting of future preferences**, not synchronic transitivity. The constraint is diachronic self-prediction.

  ### 5. **What This Means for the Money Pump Argument**
     - **Original Argument's Flaw**: It tacitly assumes agents are **myopic** (non-forecasting) or **diachronically unstable** (unable to commit or anticipate).  
     - **Resolute/Sophisticated Reply Shows**:  
       - Synchronic intransitivity is only problematic when paired with **diachronic irrationality** (reconsideration or myopia).  
       - The money pump **does not establish synchronic transitivity as necessary**—it establishes that agents must be **diachronically coherent** (resolute or sophisticated).  
     - **Strongest Counter**: Resolute agents *can* have robustly intransitive preferences at every instant yet avoid exploitation. This decisively decouples synchronic rationality from the pump’s diachronic vulnerability.

  ### 6. **Objections and Replies**
     - **"But Resoluteness Is Unrealistic!"**  
       Irrelevant. The argument is about *logical necessity*: if resoluteness blocks the pump without transitivity, transitivity isn't *required* for pump-avoidance.  
     - **"Choosing a Plan Requires Transitivity!"**  
       Not so. A resolute agent could have cyclical preferences over *plans* (e.g., "keep A" ≻ "trade for B", "trade for B" ≻ "trade for C", but "trade for C" ≻ "keep A") yet arbitrarily pick one plan and stick to it. Resoluteness doesn’t require plan preferences to be transitive—it requires *sticking to a chosen plan*.  
     - **"Sophisticates Need Transitivity for Backward Induction!"**  
       False. Backward induction only requires **dominance reasoning** ("don’t choose X if it leads to a worse outcome than rejecting X"). Cyclical preferences don’t violate dominance.

  ### 7. **Teaching Takeaways for Thursday**
     - **Frame the Debate**:  
       ```mermaid
       graph LR
       A[Money Pump] --> B[Assumes Diachronic Vulnerability]
       B --> C[Myopic Choosers: Pumped]
       B --> D[Resolute Choosers: Escape]
       B --> E[Sophisticated Choosers: Escape]
       D & E --> F[Pump Avoided WITHOUT Synchronic Transitivity]
       F --> G[Diachronic Coherence Suffices]
       ```
     - **Punchline**: The money pump argument **only establishes a diachronic constraint**: agents must either **bind their future selves** (resoluteness) or **game their future selves** (sophistication). Synchronic transitivity is neither necessary nor sufficient for avoiding dynamic exploitation.  
     - **McClennen’s Win**: Resolutes show that rational agents *can* maintain stable cyclical preferences if they manage diachronic choice appropriately. The "defect" isn’t in the preferences per se—it’s in how they’re enacted over time.

  **Where to lean?** Your intuition is correct: the resolute reply *does* pry apart synchronic and diachronic constraints. The TA’s collapse argument fails because diachronic resoluteness doesn’t reduce to synchronic preferences—it’s a meta-policy governing preference *revision*. For Thursday, emphasize that decision theory’s "transitivity dogma" conflates two distinct problems: static preference coherence and dynamic self-governance. Resolute and sophisticated agents solve the latter without the former.  

  If pressed, note that *some* diachronic constraints (e.g., sophistication’s backward induction) may *imply* synchronic consistency in specific contexts—but the money pump alone doesn’t force this. McClennen’s point stands: the pump targets diachronic fragility, not synchronic structure.
