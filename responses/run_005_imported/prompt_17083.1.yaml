  Okay, the user is prepping a seminar on Aquinas and tyrannicide, focusing on a modern scenario where a leader democratically elected becomes a tyrant by manipulating legal systems. They want to know Aquinas's stance, especially when lawful removal is impossible. 

  First, I need to recall Aquinas's key texts: Commentary on the Sentences and De Regimine Principum. In the Commentary, Aquinas allows tyrannicide only if approved by public authority. In De Regimine, he suggests that if a tyrant seizes power by force, the people can depose him. But here, the leader wasn't a usurper; he was elected fairly. That's the crux.

  The user's scenario involves legal erosion of institutions—court-packing, jailing critics, constitutional changes. Aquinas's conditions for tyranny include acting against the common good and ruling without law. This leader does both, even if through "legal" means. So, he'd be considered a tyrant.

  The big issue is the absence of lawful removal channels. Aquinas emphasizes public authority for action, but what if that authority is compromised? The user is asking if citizens can act independently when all systems are captured. Aquinas's texts don't directly address this. In De Regimine, he says if there's no human recourse, recourse to God is permitted, possibly implying divine authority as a last resort. But he doesn't explicitly endorse vigilante action.

  The user might be looking for how Aquinas's principles apply beyond medieval contexts. They might also need to discuss the limits of his caution. Aquinas prioritizes order, so he'd likely still warn against chaos from individual actions. Yet, the complete breakdown of lawful avenues might force a reinterpretation. 

  Another angle: natural law. If the ruler violates natural law (justice, common good), Aquinas might argue that the ruler's laws are illegitimate. Thus, citizens could be justified in opposing him, even without official sanction. However, Aquinas would prefer a collective, organized resistance over individual efforts.

  The user's deeper need might be to engage students in applying medieval philosophy to modern authoritarianism. They might want to explore the tension between legal legitimacy and moral tyranny. Also, how Aquinas's emphasis on authority holds up when that authority is the problem.

  I should highlight Aquinas's conditions for tyranny, the role of public authority, and the last-resort argument. Emphasize that while Aquinas doesn't provide a clear answer for captured systems, his principles suggest that when all lawful means fail, the community's right to self-preservation might justify action. But caution against individual vigilantism, stressing organized resistance instead.
answer: |-
  That's a brilliantly thorny modern scenario Aquinas never explicitly addressed, forcing us to extrapolate from his core principles in *De Regimine Principum* and the *Commentary on the Sentences*. Here's how Aquinas would likely analyze your case:

  1.  **Diagnosis: Tyranny by Legal Subversion:** Aquinas wouldn't be fooled by the "legal" facade. His definition of tyranny hinges on *intent* and *effect*, not just origin:
      *   **Against the Common Good:** The leader's actions (gutting courts, jailing critics, entrenching power) clearly prioritize personal power over justice and the common good – Aquinas's primary criterion for tyranny (*De Regimine*, I.3).
      *   **Ruling Without Law (in spirit):** While using legal *forms*, the leader subverts the *substance* of law – its purpose being justice and the common good (*Summa Theologiae*, I-II, Q90, A2, A4). Rewriting the constitution for self-perpetuation violates the very idea of law as rational order for the community.
      *   **Origin Fades:** The initial fair election becomes irrelevant. The leader *became* a tyrant through subsequent actions, transforming the nature of their rule. Aquinas focuses on the *current mode* of governance. He *does* distinguish usurpers from just rulers who become tyrants (*De Regimine*, I.6), but both are tyrants deserving removal once identified.

  2.  **The Crux: Removal When Lawful Channels Are Captured:** This is where Aquinas becomes most cautious, and your scenario pushes his principles to the limit.
      *   **Strong Preference for Public Authority (Commentary on Sentences):** Here, Aquinas is most explicit: even against a tyrant, private individuals generally lack the authority to kill. Removal must be done by "public authority" (II Sent., d. 44, q. 2, a. 2). His core concern is **disorder and chaos**. Vigilante action risks anarchy, factional violence, and potentially worse tyranny replacing the current one.
      *   **"Public Authority" in a Captured State:** This is the critical tension. Aquinas likely envisioned "public authority" as existing *outside* or *above* the tyrant – perhaps nobles, lesser magistrates, assemblies, or the "multitude" acting *as a body* representing the community's residual authority. **He does NOT mean solely the tyrant's own captured institutions.** His point in *De Regimine* (I.6) that the Roman people rightly deposed Tarquin implies a broader conception of legitimate public power residing ultimately in the community.
      *   **When Lawful Routes Are Truly Exhausted (De Regimine Principum):** In *De Regimine* (I.6), discussing a tyrant who seized power by force, Aquinas argues:
          *   If the tyranny isn't excessive, patience might be better than risking worse evils through revolt.
          *   **BUT, if the tyranny becomes unbearable and *"there is no human recourse"* ("*non est hominis provisio ad hoc occurrens*"), then it is permissible for someone to rise up and kill the tyrant, even if they risk death, "delivering the multitude from death."** This is his strongest statement.
      *   **Interpreting "No Human Recourse":** Your scenario *exactly* fits this condition. The leader has systematically destroyed *all* lawful, institutional routes for removal. The courts, legislature (if it exists), and constitutional mechanisms are tools of the tyrant. Aquinas's "no human recourse" implies the normal channels of public authority *within the system* are gone or irredeemably corrupted. This opens the door, cautiously, to extra-legal action.

  3.  **Would Aquinas "Bless" Citizen Action?**
      *   **Not Individual Vigilantism:** Aquinas would **vehemently reject** isolated individuals or small groups acting alone. This is the chaos he feared most. The "someone" in *De Regimine* likely implies a figure acting with significant popular mandate or representing a residual communal authority, not a lone assassin.
      *   **Possibly Collective, Organized Resistance:** If "ordinary citizens" became convinced and *organized themselves collectively* into a body representing the true common good and the residual authority of the community, Aquinas's logic in *De Regimine* (I.6) *could* extend to them. This would be framed not as private action, but as the *community itself* (or a substantial, representative part of it) exercising its ultimate right to self-preservation against a ruler who has fundamentally broken the compact by destroying the rule of law and the common good. It becomes the "public authority" acting in extremis.
      *   **Burden of Proof & Last Resort:** Aquinas would impose an incredibly high burden:
          *   Tyranny must be *manifest* and *intolerable*.
          *   *All* peaceful, lawful, and institutional avenues must be *truly exhausted and irreparable* within the system.
          *   Resistance must have a *high probability of success* and restoring a just order, not just creating more chaos.
          *   The resistance must be *collective and organized*, representing the community, not a faction.
          *   It must be a *last resort* ("*non est hominis provisio*").
      *   **"Blessing" vs. Reluctant Permission:** Aquinas would never "bless" it lightly. He would see it as a tragic, dangerous necessity permitted only when the tyranny and the destruction of lawful recourse create a greater evil than the risk of violent removal. His "caution stretches" only to the absolute brink where *inaction* guarantees the complete destruction of justice and the common good with no hope of lawful remedy.

  **Conclusion:**

  For your elected-turned-tyrant scenario, Aquinas would:

  1.  **Unequivocally condemn the leader as a tyrant** based on actions against the common good and perversion of law.
  2.  **Insist on exhausting *all conceivable* lawful and peaceful means first**, even if they seem futile, due to the grave danger of disorder.
  3.  **Recognize that "public authority" for removal cannot mean the tyrant's own captured institutions.** It must mean residual legitimate authority within the community (nobles, magistrates, assemblies) or, ultimately, the organized community itself.
  4.  **Concede, with extreme reluctance and heavy caveats, that *if* tyranny is intolerable, *all* lawful recourse is irreparably destroyed ("no human recourse"), and resistance is *collective, organized, and likely to restore justice*, then the community (acting through its organized representatives) has the right, perhaps even the duty, to remove the tyrant by force.** This is not "blessing" vigilante action but acknowledging a tragic last resort when the tyrant has destroyed the very legal order that might have constrained him.

  His caution stretches very far, but it *does* have a breaking point: the point where the tyrant's actions annihilate the possibility of lawful remedy and make continued submission synonymous with the destruction of the common good itself. Your scenario, by design, pushes right up against that breaking point. Aquinas would urge exhausting every other conceivable option first, but his logic in *De Regimine* suggests that in the *absolute absence* of "human recourse," the community's right to self-preservation ultimately prevails, however perilously.
