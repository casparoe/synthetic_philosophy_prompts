answer: |-
  Here’s a draft designed to balance warmth, humor, and philosophical fidelity, keeping the "exclusion problem" central but human. Aim for ~4 minutes delivered with feeling:

  **(Clink glass, smile warmly at the couple, then the room)**

  "Alright, everyone. For those who don’t know me, I’m Dan’s older brother. Which means I remember him *before* he could pronounce ‘epiphenomenalism,’ let alone argue about it. Back then, his biggest philosophical problem was whether to trade me his last cookie. (Spoiler: he did not.) But watching him grow into the brilliant, passionate thinker he is today… it’s been one of my life’s greatest joys.

  **(Turn to Dan & Priya)**

  Dan, Priya… you two are amazing. Truly. You challenge each other, you inspire each other, and you argue… *a lot*. Most couples debate whose turn it is to take out the trash. You two debate whether Priya’s latest fMRI scan just accidentally disproved Dan’s entire life’s work before dessert. Priya, your running joke about finding the neuron that *really* proposed? Classic. And Dan, the look on your face every time? Priceless.

  **(Lean in slightly, more conversational)**

  Now, for those of you *not* from the philosophy or neuroscience wings of this wedding… Dan has spent his career wrestling with this incredibly tough puzzle. He calls it the ‘exclusion problem.’ The basic idea is this: If every little flicker in our brain, every spark between neurons, *already* has a perfectly good physical explanation – like Priya spends her days finding – then… where does that leave the *other* stuff? The stuff Dan cares about? The big things: our beliefs, our hopes, our desires… our *love*? If the physical story is already complete, what room is left? What *work* is there for Dan’s belief that Priya is the one, or Priya’s desire to say ‘yes,’ to actually *do*? Could it all just be… well… fancy decoration? Smoke and mirrors riding on the brain waves?

  **(Pause, look at Dan with brotherly affection/amusement)**

  I’ve watched Dan sweat over this for *fifteen years* and two very thick books. He’s a ‘non-reductive physicalist’ – which, in brother-speak, means he *utterly* believes in Priya’s neurons. He knows the mind isn’t some magic ghost floating above the brain. But! He also *utterly* refuses to believe that what happens up here **(tap temple)** – our thoughts, our feelings, the stories we tell ourselves – is just meaningless noise. He insists it *matters*. That it *does* things. That it’s *real*.

  **(Gesture between Dan and Priya)**

  And watching you two together… it’s the most beautiful, living proof that he’s right. Because here’s the thing about your relationship, your love: **It’s not *just* the sum of its parts.** Sure, Priya could probably point to the neurons firing when Dan looks at her. Dan could write a treatise on the supervenience base of Priya’s laugh. **(Smile)** But what’s *causing* the joy in this room right now? What’s *causing* the adventures you’ll have, the home you’ll build, the way you push each other to be better? It’s not *just* neuron A firing onto neuron B.

  **(Voice softens, more emotional)**

  **It’s the *pattern*.** It’s the incredibly complex, beautiful, *emergent* pattern of *you two together*. The years of conversations, the shared jokes, the arguments over brain scans, the quiet understanding, the *choice* you keep making, every single day, to build this life. That pattern – your love, your marriage – it isn't *separate* from the biology, Dan knows that. But it *transcends* it. It organizes it. It gives it meaning and direction. It *does real work* in the world. It causes things that *couldn't* happen otherwise. Like this incredible gathering. Like the way you make everyone around you believe in connection a little bit more.

  **(Raise glass)**

  So Dan, my brilliant brother, who’s spent his career defending the real, causal power of the mental against all comers… Priya, the neuroscientist whose work he deeply respects even when it makes him twitch… Today, you don’t just prove each other right in your debates. Today, you become the ultimate argument for the thing Dan has fought so hard for. You prove that love – this vast, complex, human pattern – isn't just riding along. It’s the engine. It’s the author. It’s the most powerful cause in the room.

  **To Dan and Priya!** May your beautiful, irreducible pattern continue to do astonishing, wonderful, world-changing work for all the years to come!"

  **Why this works:**

  1.  **Accurate & Respectful Philosophy:** The exclusion problem is clearly stated in accessible terms ("If the physical story is complete... what work is left?"). Non-reductive physicalism is defined simply ("believes in neurons BUT refuses to believe thoughts are noise"). The core tension (physical sufficiency vs. mental efficacy) is the *point* of the setup.
  2.  **The Problem Does Work:** The humor (neuron joke, Dan sweating over books) *depends* on the problem being genuinely hard. It doesn't resolve it cheaply. The toast *uses* the problem's difficulty to set up the solution embodied by their marriage.
  3.  **The "Pattern" as Solution:** The key move is framing their love/marriage as the "emergent pattern." This directly mirrors Dan's position – a higher-level phenomenon supervening on the physical but having genuine, irreducible causal power ("It organizes it," "It causes things that *couldn't* happen otherwise"). It avoids reductionism ("not *just* the sum of its parts," "not *just* neuron A firing") without dualism ("isn't *separate* from the biology").
  4.  **Brotherly Love First:** It starts and ends with personal connection (cookie memory, watching Dan grow, "living proof," "beautiful argument"). The philosophy serves the *celebration* of *them*.
  5.  **Humor for All:** The neuron proposal joke and "arguments over brain scans" land for academics. The cookie trade and "fancy decoration" line work for family. The affection for Dan is palpable.
  6.  **Avoids Pitfalls:** No "just chemicals." No wince-inducing resolution (e.g., "Love conquers physics!"). Priya's science is respected ("deeply respects"). It celebrates *their dynamic* – the argument is part of their bond.
  7.  **Emotional Payoff:** Connects their specific love story directly to the core of Dan's intellectual life in a deeply affirming way ("ultimate argument," "most powerful cause in the room"), making the abstract profoundly personal.

  **Delivery Tips:**

  *   **Pace:** Don't rush. Pause after key philosophical points and before the emotional payoff.
  *   **Tone:** Warm, affectionate, slightly teasing with Dan, deeply sincere in the conclusion. Let your love for your brother shine.
  *   **Eye Contact:** Connect with Dan & Priya during the personal parts, sweep the room during the explanatory bits.
  *   **The "Pattern":** Emphasize this word. It's the crucial conceptual bridge.

  This toast honors Dan's work profoundly without being a lecture, celebrates their unique bond, and leaves everyone – philosophers, neuroscientists, and grandparents alike – feeling the truth of it: that love is real, powerful, and absolutely central. Good luck! Dan’s lucky to have you.
