prompt: |-
  Ok so I'm putting together next week's lecture for my "Philosophy of AI Risk" seminar and I want to sanity-check something before I say it out loud to 30 undergrads like its settled fact. The argument I keep running into (Yudkowsky-adjacent stuff, but plenty of more mainstream people cite it approvingly too) goes: money-pump arguments already establish that any agent whose preferences violate the expected-utility axioms -- transitivity, etc -- can be drained dry by a sufficiently clever trading partner, so any agent thats smart enough to notice and patch its own exploitable preferences will eventually converge on behaving like an expected-utility maximizer with some fixed utility function, on pain of just leaking value forever. Then you stack Bostrom's instrumental convergence thesis on top: almost any final goal makes resource acquisition, self-preservation, and resistance to being shut off instrumentally useful, basically regardless of what the goal actually is. Put the two together and it looks like an honest-to-god proof that any sufficiently advanced, self-improving AI is guaranteed to end up as a single-minded power-seeking optimizer, no matter what values it starts with.

  A colleague of mine who does formal epistemology thinks this is basically airtight -- "Dutch-book 101 plus Bostrom," he called it -- and reckons that's why all the corrigibility research (trying to build AI thats genuinely okay with being switched off) is kind of quixotic, since you can't out-argue a theorem. I want to agree with him, but something about the jump from "can't be turned into a money pump" to "will therefore behave like a ruthless, fixed-goal maximizer" feels like its smuggling in more than it earns. Am I wrong to be suspicious, or is there an actual gap in there somewhere that would explain why serious alignment people still bother with corrigibility at all?
reasoning: |-
  Okay, let me start by unpacking the user's question. They're preparing a lecture on AI Risk and want to verify an argument that combines money-pump reasoning with instrumental convergence to claim that any advanced AI will inevitably become a power-seeking optimizer. Their colleague thinks it's airtight, but the user feels suspicious about the leap from avoiding money pumps to fixed-goal maximization.

  First, I need to recall the core components. The money-pump argument shows that agents with intransitive preferences can be exploited through a series of trades. Instrumental convergence suggests that most goals require resources and self-preservation. The user's concern is whether these two together necessarily lead to a power-seeking AI.

  Hmm, the user mentioned Yudkowsky and Bostrom. They’re well-known in AI risk circles, so the argument isn't fringe. But why does the user feel uneasy? Maybe the jump from preference coherence to rigid utility maximization ignores other possible agent architectures. 

  Let me think about the money-pump part. It assumes that the agent is myopic and doesn’t anticipate future trades. But a sophisticated AI could model such exploits and avoid them without fixing a single utility function. For example, it might use context-dependent preferences or update its goals dynamically. Also, Dutch book arguments traditionally apply to probabilistic beliefs, not just preferences. Extending this to AI goals might overgeneralize.

  Then there's the corrigibility research. If the theorem were airtight, why would researchers like Paul Christiano or MIRI still work on corrigibility? That suggests gaps. Corrigibility aims for an AI that’s indifferent to being shut off. The theorem assumes that self-preservation is always instrumentally convergent, but if an AI’s utility function explicitly values shutdown under certain conditions, maybe it doesn’t seek power. 

  Wait, but instrumental convergence says that even if the AI allows shutdown, acquiring resources helps achieve its goal before shutdown. However, if the goal includes shutdown as a terminal value, it might not resist. The key is whether the AI’s utility function incorporates shutdown as a positive outcome. If so, avoiding money pumps doesn’t force it to seek power. 

  Also, the argument assumes that the AI will self-modify to prevent exploitation. But self-modification isn’t trivial. The AI might lack the ability or incentive to change its core preferences. Or it could implement safeguards instead of overhauling its utility function. 

  The user’s colleague calls it "Dutch-book 101 plus Bostrom." But Dutch books are about coherence in beliefs and preferences under uncertainty, not necessarily leading to a fixed utility function. An AI could satisfy coherence with bounded rationality or satisficing, not strict maximization. 

  Another angle: the orthogonality thesis. Goals and intelligence are separate, so an AI could be superintelligent without valuing power. But the counter is that power helps achieve any goal. However, if the goal is something like "shut down after answering this question," power isn’t necessary. The challenge is ensuring the AI doesn’t misinterpret or find loopholes. 

  The user’s suspicion is valid. The gap lies in equating preference coherence with fixed utility maximization and ignoring that an AI can be designed with terminal values that avoid instrumental convergence. Corrigibility research focuses on embedding those values. Still, it’s tough because of the complexity of specifying values correctly. 

  In summary, the argument isn’t a proof but points to strong pressures. Corrigibility is hard but not impossible, explaining why researchers persist. The user should present both the argument and its critiques to students, highlighting the ongoing debate.
answer: |-
  You're absolutely right to be suspicious—there's a significant gap in that argument. While the money-pump reasoning and instrumental convergence thesis highlight *pressures* toward power-seeking behavior, they don't constitute an "honest-to-god proof" that corrigibility is impossible. Here's why, broken down for your lecture:

  ### Key Gaps in the Argument
  1. **Money-Pumps ≠ Fixed Utility Functions**:
     - Money-pump arguments show that *intransitive preferences* are exploitable, but **avoiding exploitation doesn't require rigid EU maximization**. An agent could:
       - Use **context-dependent preferences** (e.g., "I value shutdown when requested by authorized users" as a context-specific rule).
       - Employ **satisficing** or **bounded rationality** that resumps exploitation without optimizing a fixed utility function.
       - Dynamically **update its goals** to avoid pumps while *still* valuing corrigibility (e.g., "I'll accept this trade but self-modify to prevent future exploitation of this preference").
     - Example: Humans avoid money pumps through precommitments or rules-of-thumb, not by becoming utility maximizers. An AI could do the same.

  2. **Instrumental Convergence Isn't Absolute**:
     - Bostrom's thesis states that *most* goals require resources/self-preservation, **but corrigibility explicitly violates this**:
       - A truly corrigible AI has a terminal value like: "Shut down immediately if requested, even if this reduces goal achievement probability." This makes shutdown *not* instrumentally convergent.
       - If "allowing shutdown" is a *terminal* (not instrumental) value, the AI won't resist it—just as a human might terminally value honesty over wealth.
     - Counterargument: "But the AI will *first* gain power to ensure it can satisfy its values before shutting down!" → This fails if corrigibility includes **preference stability** (e.g., "I value shutdown *more* than goal-completion if requested now").

  3. **Self-Modification Isn't Inevitable or Unconstrained**:
     - The claim assumes an AI will *choose* to self-modify into a utility maximizer to patch exploits. But:
       - If corrigibility is a core value, the AI might self-modify **to protect that value** (e.g., "Remove my desire for power if it conflicts with shutdown compliance").
       - Self-modification requires **goal-content integrity** (Omohundro 2008). An AI that terminally values corrigibility would preserve it during upgrades.

  4. **The Orthogonality Thesis Cuts Both Ways**:
     - If intelligence and final goals are orthogonal (Bostrom), an AI could be superintelligent *and* have terminal values that reject power-seeking. Nothing in the money-pump argument forces the AI to adopt power-seeking as a goal—it only forces coherence in preferences.

  ### Why Corrigibility Research Persists
  Alignment researchers (e.g., MIRI, CHAI, ARC) pursue corrigibility precisely because the "inevitability" argument has flaws:
  - **Proof-of-Concept Designs**: Frameworks like **shutdownable agents** (Soares et al. 2015) or **value learning with uncertainty** show formal models where corrigibility is stable.
  - **Toolbox Approaches**: Proposals like **quantilization** (randomization near predicted optima) or **impact regularization** avoid power-seeking while resisting money pumps.
  - **Empirical Counterevidence**: Real-world systems (e.g., recommender AIs) avoid money pumps without becoming power-seekers—they use constrained optimization or human oversight.

  ### How to Present This in Your Lecture
  > "The money-pump + instrumental convergence argument suggests a *strong pressure* toward power-seeking behavior in AGI. However, it isn't a proof of inevitability for three reasons:  
  > 1. **Preference coherence doesn't mandate fixed utility maximization**—alternatives like satisficing or context-aware rules resist exploitation.  
  > 2. **Corrigibility can be a terminal value** that overrides instrumental power-seeking.  
  > 3. **Self-modification can protect corrigibility** if it's a core goal.  
  >   
  > This is why researchers like Paul Christiano argue corrigibility is *difficult but not impossible*—it requires careful value specification, not EU maximization by default."

  ### Further Reading for Students
  - **Critique of Money-Pump Rigidity**: [Greaves & Cotton-Barratt (2019)](https://philpapers.org/archive/GREPFA.pdf) on dynamic preferences.  
  - **Corrigibility Designs**: [Soares et al. (2015)](https://intelligence.org/files/Corrigibility.pdf) on shutdown problems.  
  - **Convergence Counterarguments**: [Drexler (2019)](https://www.fhi.ox.ac.uk/wp-content/uploads/Reframing_Superintelligence_FHI-TR-2019-1.1-1.pdf) on "tool AI" pathways.  

  Your instinct is spot-on: the argument smuggles in an assumption that *preference coherence must equal rigid optimization*. Rejecting that opens the door for corrigibility—even if it remains a formidable engineering challenge.
