answer: |-
  Here’s a toast that threads the needle: accurate philosophy woven into warmth, humor, and wedding-appropriate sincerity. It clocks in around 2.5 minutes spoken aloud.

  ---

  **(Raise glass, smile warmly at the couple, then glance playfully at your sister)**

  "Hi everyone. For those who don’t know me, I’m [Your Name], [Sister's Name]’s little brother, and very honored to be giving this toast. Now, anyone who knows my sister knows she’s brilliant, passionate, and… leaves a *lot* of philosophy drafts lying around our house. I’ve learned more about metaethics from her coffee-stained pages than I ever did in school. Her dissertation tackles this incredibly deep puzzle about *reasons* – specifically, the difference between the **right kind of reasons** to value something, and the **wrong kind**."

  **(Pause, shift tone slightly more explanatory but still light)**

  "Philosophers like T.M. Scanlon – who my sister talks about a lot – suggest that calling something ‘good’ means it *gives us reasons* to admire it, desire it, or love it. But here’s the snag: sometimes, you might have a reason to value something for totally external reasons that have nothing to do with the thing itself being *actually* admirable or lovable. The classic example – and yes, there’s literally a paper with ‘Demon’ in the title about this – is an evil demon threatening to torture you *unless* you genuinely come to admire… a saucer of mud. The threat gives you a *reason* to value the mud, but it’s the *wrong kind* of reason. The mud itself didn’t earn it; it was just leverage."

  **(Smile broadly at Marcus, then your sister. This is the pivot point.)**

  "Now, Marcus, don’t panic. I’m *not* comparing you to a saucer of mud! Though I *was* tempted to ask my sister if she married you for the *right kind* of reasons, or if, perhaps, finishing her PhD felt so overwhelming that some metaphorical philosophical demon threatened to extend her candidacy indefinitely unless she found a genuinely wonderful partner to admire and love… and you just happened to be standing there!"

  **(Pause for laughter, especially from the philosophy corner. The "standing there" line is the specific joke designed for both audiences.)**

  "But seriously. Jokes about demonic coercion aside, my sister’s work is all about figuring out what makes a reason the *right kind* – the kind that genuinely tracks the real, inherent value of the thing itself. And watching her with Marcus these past six years, it’s crystal clear that her reasons for loving him – the deep, enduring, *fitting* reasons – are absolutely, categorically, the **right kind**."

  **(Shift fully to sincerity, looking between them both)**

  "They aren’t reasons born from convenience, or external pressure, or some abstract calculation. They’re reasons grounded squarely *in Marcus*: in his kindness that fills a room, his steady patience that’s been the perfect counterpoint to my sister’s brilliant intensity, his genuine curiosity about *her* world even if the finer points of fitting-attitude accounts remain… delightfully mysterious to him. They’re reasons found in the way he makes her laugh, the unwavering support he offers, the shared values they’ve built their life on. These reasons aren't attached to Marcus like some external threat or bribe; they flow *from* who he *is*."

  **(Turn fully to the couple, voice warm and heartfelt)**

  "Sis, your dissertation dissects the structure of reasons with incredible precision. But your life with Marcus *lives* the most beautiful example of the right kind of reasons in action. Your love for him isn’t a response to some outside demand; it’s the fitting, wonderful, *true* response to the amazing person standing beside you. Marcus, you inspire that admiration and love simply by being you. You are her ‘right-kind reason’ personified."

  **(Raise glass higher)**

  "So, let’s raise our glasses. To [Sister's Name] and Marcus! May your reasons for loving each other always be profoundly, deeply, gloriously the **right kind**. May your admiration, your desire, and your joy in each other forever be the fitting response to the incredible value you find in one another. To the happy couple!"

  ---

  **Why this works:**

  1.  **Accuracy:** Uses the core concepts correctly (Fitting Attitude/Buck-Passing, Wrong Kind of Reasons - WKR/RKR distinction, the demon/saucer of mud example as the classic WKR case). It accurately frames RKR as grounded in the object's properties (Marcus's qualities) vs. WKR as external/instrumental (threats, convenience). Mentioning Scanlon adds credibility. Philosophers will nod.
  2.  **Accessibility:** Explains the complex idea simply using the demon/mud example *before* applying it to Marcus, avoiding jargon ("pro-attitude," "metaethics" used once but immediately grounded). The mud example is inherently funny and absurd to non-philosophers.
  3.  **The Philosopher's Laugh:** The line "**some metaphorical philosophical demon threatened to extend her candidacy indefinitely unless she found a genuinely wonderful partner... and you just happened to be standing there!**" is gold. Philosophers get the *exact* reference and the PhD-struggle humor. Non-philosophers get the joke about PhD stress and the absurdity of Marcus just "happening" to be there.
  4.  **Sincere Pivot:** Moves cleanly from the joke to the sincere application of the RKR concept to Marcus. It explicitly lists *object-grounded* reasons (his kindness, patience, support, shared values, making her laugh) as the RKR.
  5.  **Wedding Focus:** The philosophy serves the toast, not the other way around. The ending is purely about their love and future. The final line ("May your reasons... always be... the **right kind**") beautifully ties the theme back to their marriage in a warm, hopeful way.
  6.  **Sister's Vindication:** Explicitly states her RKR reasons are grounded *in Marcus* and his qualities, showing deep understanding and respect for both her work and her choice of partner.
  7.  **Marcus's Inclusion:** Makes Marcus the hero of the RKR explanation, focusing on *his* admirable qualities. The joke is gentle and clearly affectionate.
  8.  **Length & Tone:** Fits the 2-3 minute window. Tone moves naturally from light-hearted/introductory, to explanatory with humor, to warm sincerity.

  **Delivery Tip:** Practice the pivot from the demon joke to the sincere part about Marcus. Let the laugh from the "standing there" line land, then soften your voice and look at them warmly as you start "But seriously..." The contrast makes the sincerity land harder. Good luck! Your sister will be thrilled (and relieved!) you took her work so seriously on her big day.
