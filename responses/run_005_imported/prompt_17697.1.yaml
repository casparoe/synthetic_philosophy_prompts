  First, I need to address the four specific areas the user mentioned. Each question should push beyond the dung-heap metaphor. Let's start with the zodiac signs and houses. Kepler saw aspects as real but dismissed other elements as arbitrary. The question here needs to challenge why aspects are natural while others aren't. The follow-up should counter if she says aspects are mathematical by pointing out that houses are also mathematical divisions. 

