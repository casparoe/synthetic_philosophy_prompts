  Hmm. The challenge here is balancing theological precision with emotional resonance. The unease they describe isn't about fate crushing freedom, but about freedom itself feeling like a landscape of pre-mapped territories. Like discovering your "choices" are just you walking paths God already saw you'd take. 

  I should avoid sci-fi tropes (simulations, multiverses) since they'd dilute the Molinist specificity. The setting must feel grounded enough that the horror is philosophical, not technological. A hospital bed came to mind—vulnerability heightens the metaphysical shock. 

  Key beats to hit: 
  - The revelation must feel clinical, almost bureaucratic. No angels or flashing lights. Just... records. 
  - Protagonist should be ordinary. Their sins minor, their virtues unremarkable. The terror lies in the banality of their cataloged potentialities. 
  - That last image—the untouched glass trembling—is crucial. It crystallizes the question: Is her hand shaking because she's choosing, or because this specific tremor was always the next frame in God's filmstrip? 

  Biggest risk is making it too abstract. Need visceral details: the smell of antiseptic, the texture of the counterfactual "pages," the way the nun's voice stays serene while dismantling a woman's sense of agency. 

  ...And I'm suddenly aware how dark this leans. Should the ending offer more warmth? No—the user explicitly wants the question left raw. Molinism's cold comfort ("You're free! But every freedom is already known") is precisely the wound to poke. 

  Final thought: That nun's character matters. Her compassion can't soften the doctrine's edge. She's not a villain, just a delivery system for cosmic mechanics. Her "it's a gift" line is the gentlest knife twist.
answer: |-
  The air in the hospital room hung thick with antiseptic and the low hum of machines. Eleanor, propped against thin pillows, traced the IV line taped to her wrist. Sixty-eight years. A life of quiet choices, small kindnesses, sharper regrets. Mostly, she felt tired. Not just from the pneumonia, but from the weight of it all – the paths taken, the paths not.

  Sister Miriam entered, not with the usual tray of medications, but with a simple, unmarked wooden box. It looked ancient, yet pristine. Her kind eyes held an unfamiliar gravity.

  "Eleanor," she said, her voice softer than usual, almost reverent. "There’s something… offered. A clarity, before the end. It’s not for everyone. But I sensed… perhaps you."

  Eleanor frowned. "Clarity? What clarity is left now?"

  Miriam placed the box on the bedside table. "Not what *was*. Not even what *is*. What *would have been*. The counterfactuals. God’s… middle knowledge." She spoke the term with careful precision, as if handling a fragile artifact. "For every possible circumstance, for every possible *you*… what you would have freely chosen."

  A chill, unrelated to the fever, prickled Eleanor’s skin. "My… choices? The ones I didn’t make?"

  "Precisely. Not just the big ones. Every fork, every hesitation, every tiny decision point that never came to pass. All the lives you *could* have lived, laid bare. It’s a record. Settled. True." Miriam opened the box. Inside wasn’t a book, or files, but a kind of… luminous fog, swirling with impossible depth. "Will you look?"

  Curiosity, a lifelong companion even now, warred with a deep, instinctive dread. To see the paths untrodden? The loves unspoken? The cruelties avoided… or committed? She nodded, a small, jerky motion.

  Miriam gently guided Eleanor’s hand towards the fog. As her fingertips touched the cool luminescence, the room dissolved.

  * * *

  She wasn't *in* the hospital anymore. She stood… nowhere and everywhere. Before her, unfolding like an infinite, impossible tapestry, were moments. Millions. Billions. Fleeting scenes, crystal clear, each radiating a profound sense of *inevitability*.

  She saw herself at twenty-two, rain lashing the window of a cheap Parisian café. The struggling artist, Pierre, leaned close, his eyes intense. In *this* reality, she’d hesitated, then politely declined his invitation to his studio, citing an early train. But *here*, in the tapestry… she saw the scene play out differently. She saw herself smile, accept. Saw the passionate, chaotic, ultimately heartbreaking affair that followed, saw the paintings she *would* have inspired (mediocre, she noted with a detached pang), saw the abortion clinic at twenty-three, the profound loneliness at twenty-five. The choice *felt* free in the vision – her younger self’s nervous excitement, the thrill of the unknown – yet its outcome was fixed. *This is what I would have done, there.*

  She flinched.

  Another scene: her thirties, standing over the crib of her newborn son, Ben. Exhausted, despairing, the shadow of postpartum depression thick. In life, she’d wept, called her mother, started therapy the next day. But *here*… she saw her hand, trembling, hover near the tiny, fragile neck. Saw the crushing weight of exhaustion twist into a terrifying, fleeting impulse. Saw herself *not* act, collapsing instead into hysterical sobs, the moment passing like a toxic cloud. The relief was immediate, visceral, but followed by a deeper horror. *That potential darkness… it was in me. Truly in me. And He knew. He always knew what I would choose… and what I wouldn’t, even when pushed to the very edge.*

  The scenes accelerated, a dizzying kaleidoscope:

  *   Accepting a different job offer, becoming colder, sharper, richer, divorced by forty-five.
  *   Speaking up at a crucial town meeting, preventing a corrupt development, becoming a minor local hero.
  *   Cheating on her husband, Robert, during that rough patch. Getting caught. The devastating fallout. Or *not* getting caught, the slow erosion of trust.
  *   Buying the blue dress instead of the red. Taking the left turn instead of the right. Answering the phone instead of letting it ring.

  Each scene wasn’t a possibility; it was a *fact*. A settled truth about Eleanor Davies. *Given these exact circumstances, this exact state of mind, this exact configuration of the universe… this is what Eleanor Davies would freely do.* The freedom felt real in the micro-moment – the hesitation, the weighing, the surge of will – but it was encased in amber. Predetermined not by force, but by her own, fixed nature reacting to stimuli God had foreseen with infinite precision.

  The sheer *completeness* was suffocating. It wasn't fate dictating her path; it was her own character, laid out in all its potential responses like a vast, immutable map. God hadn't *made* her choose Pierre; He'd simply known, with absolute certainty, that faced with Pierre's intensity in that rainy café with her specific fears and desires at twenty-two, she *would* say no. Just as He knew she *wouldn't* harm Ben, even at her lowest. Her choices were hers… but they were also, in this terrifyingly complete ledger, *done*. Signed and sealed before the world began.

  *What is actually left open once it arrives?* The question echoed, not from Miriam, but from the core of the vision itself.

  She saw the present moment approach in the tapestry – her hand reaching towards the luminous fog. She saw herself recoil in horror. She saw herself lean in further, fascinated. She saw herself ask Miriam to take it away. She saw herself demand to see more. All versions were *true*. All were *her*. All were settled.

  * * *

  Eleanor gasped, wrenching her hand back. She was back in the hospital room, the scent of antiseptic sharp, the machines beeping steadily. Sweat plastered her hair to her forehead. Sister Miriam stood silently, watching her, the box closed on the table.

  The silence stretched. The ordinary sounds of the hospital – a trolley rattling past, distant voices – felt jarringly mundane against the cosmic vertigo.

  "Did you…" Miriam began gently, then stopped.

  Eleanor stared at her own hands, resting on the thin hospital blanket. They looked the same. Wrinkled, spotted with age, veins prominent. But they felt alien. Instruments whose every potential movement, every future tremor or grasp, was already a documented fact in some celestial archive. Not forced, but *known*. Utterly and completely known.

  "It was…" Eleanor’s voice was a dry rasp. She searched for the word. Not beautiful. Not horrifying. Not even enlightening. "…Settled," she finally whispered. "So terribly… settled."

  Miriam nodded, a flicker of understanding, perhaps of shared unease, in her eyes. "Yes. The truth of us. What we *are*."

  Eleanor looked out the window. A nurse walked across the parking lot below, head down against a light drizzle. *What choice is she making right now?* Eleanor wondered. *To walk faster? To stop for coffee? To call her child? And does it feel free to her? Or is she just… enacting the next frame, already fixed in God’s middle knowledge?*

  Miriam poured a glass of water from the pitcher. She held it out. A simple act of kindness. A choice freely made? Or the inevitable consequence of Miriam’s compassionate nature encountering Eleanor’s thirst in this specific moment?

  Eleanor reached for the glass. Her hand trembled slightly. Was it the weakness of illness? Or the tremor of a profound, unsettling realization? She hesitated, her fingers inches from the cool surface. The question hung, heavy and unanswered, in the sterile air: *What is actually left open once it arrives?*

  Her fingers closed around the glass. The chill seeped into her skin. She lifted it. She drank. The water was tasteless. Necessary. Inevitable? She didn’t know. She only knew the action was hers. And that, somewhere beyond time, it had always been known that she would do exactly this.
