  Hmm, the user's clearly deeply familiar with the literature - they're teaching Parfit and name-dropping Gauthier and functional decision theory. Their frustration with "stock presentations" suggests they've heard the surface-level debates before. The specific requests about the cash-handing moment and Gauthier comparison show they want to expose conceptual tensions in the theory.

  The desert scenario creates this delicious tension: pre-commitment looks rational when dying of thirst, but paying up feels irrational once safe. The core puzzle is whether rationality lives in isolated acts or broader dispositions. 

  For the questions... First need to force clarity on that key moment of payment. Does "rational" apply to the act itself or just the prior disposition? If she says only the disposition, that seems to hollow out "rational action." Could follow up by asking if that makes rationality non-action-guiding when it matters most.

  Then the Gauthier angle - resolute choice smells like constrained maximization reheated. Need to press on whether she's adding anything beyond labeling the disposition as "resolution." Follow-up could challenge if this just dodges Gauthier's notorious problem of why we'd keep promises to strangers.

  The unfair predictor objection is classic CDT defense. Should frame it as the world being rigged against utility maximizers. Her likely response about real-world predictability sets up a nice follow-up: if predictability matters, why not advocate for self-deception instead of resolution?

  Functional decision theory comparison is trickier. Both treat acts as outputs of decision functions. Key difference might be that FDT explicitly considers hypotheticals while resolute choice leans on character. Follow-up should question if "character" is just hand-waving the underlying mechanics.

  Other angles: How does resolution handle changing preferences mid-game? What about cases where dispositions backfire? And crucially - does this make rationality depend on having the right psychology rather than right reasoning?

  User definitely wants blood here - no softballs. The follow-ups should be rapid-fire, exposing contradictions. Like a philosophical cross-examination. Might even imply that resolute choice is just rationalization for pre-theoretic intuitions...

  Better include that nuclear option about whether the position collapses into virtue ethics. That'd force her to either embrace the label or scramble to distinguish her view.
answer: |-
  Here are 10 targeted questions with strategic follow-ups designed to press the core tensions in resolute choice theory, specifically tailored for this scenario. Each question anticipates likely responses and provides substantive pushback:

  1.  **The Core Tension: Rational Act or Rational Disposition?**
      *   **Q:** At the precise moment the hitchhiker, now safely in town, hands over the $100 to the driver, is the *act of paying* itself rational? Or is it only the *prior cultivation of the disposition* to pay that was rational? If these come apart – if the act isn't rational *when performed* – does it make sense to call the *theory* "resolute choice," implying the choice itself is rational?
      *   *Likely Response:* She'll emphasize that the rationality resides in the *policy* or *disposition* adopted at the earlier choice point, which makes the act *required* by that policy, and thus rational *as part of the plan*.
      *   **Follow-up:** If the act of paying, considered in isolation *ex post* with no future consequences, is *not* rational (as it costs $100 for no benefit), doesn't calling it "resolute choice" risk equivocation? Isn't this actually a theory of *rational disposition formation*, where the resulting *act* is merely *dispositionally required* but not *outcome-rational*? Doesn't this concede Parfit's "rational irrationality" label for the act itself?

  2.  **Gauthier Redux or Genuine Innovation?**
      *   **Q:** Gauthier's constrained maximization also advocates adopting dispositions (to cooperate) that lead to sub-optimal acts in isolated interactions (like keeping promises when you could defect) precisely because having that disposition gets you into beneficial interactions. How is resolute choice substantively different? Is it more than constrained maximization applied to diachronic self-interaction?
      *   *Likely Response:* She may distinguish by arguing constrained maximization is about strategic interaction with *others* (requiring transparency/reciprocity), while resolute choice is about intrapersonal diachronic rationality, binding one's *future self* to a plan made under different circumstances.
      *   **Follow-up:* Doesn't Parfit's hitchhiker *fundamentally* involve strategic interaction? The driver is an agent relying on *predicting your disposition*. Doesn't the "binding future self" aspect collapse in this case? You bind your future self *only because* the driver interacts strategically *based on knowing you will bind yourself*. Isn't the driver's prediction doing the real work, making resolute choice functionally equivalent to committing to a Gauthierian disposition visible to a strategically relevant other?

  3.  **The "Unfair Predictor" & CDT's Rebuttal:**
      *   **Q:** Causal Decision Theorists argue the hitchhiker case sets up an "unfair predictor" world specifically designed to punish CDT's focus on causal efficacy *at the moment of choice*. They contend a theory shouldn't be judged by how it fares in worlds rigged to make accurate predictions based on dispositions it doesn't inherently value. How do you respond to the charge that resolute choice *only* wins here by tailoring itself to the rigged rules of this specific thought experiment?
      *   *Likely Response:* She'll argue predictability isn't "rigged," it's a realistic feature of many interactions; rational agents *should* care about how their dispositions appear to others who condition their actions on predictions. CDT fails in *real* strategic contexts where predictability matters.
      *   **Follow-Up:** But isn't the *extreme* accuracy and *specific basis* (dispositions for future acts) of the prediction in the hitchhiker case what creates the paradox? In realistic scenarios, predictability is noisy, based on reputation or signals, not infallible disposition-detection. Doesn't advocating for resolute choice *specifically for these paradox-generating edge cases* risk over-fitting the theory? Shouldn't a robust theory handle the core causal structure without relying on the *guaranteed predictability* that defines the thought experiment's artificial pressure?

  4.  **The Functional Decision Theory (FDT) Challenge:**
      *   **Q:** Functional Decision Theorists also claim the hitchhiker should pay, arguing the *act* is rational because it is the output of the *optimal decision function* (one that pays in such situations), chosen *as if* selecting that function at the initial node. How does resolute choice differ from FDT's appeal to timelessly optimal decision rules? Isn't the "resolution" just implementing the FDT-recommended function?
      *   *Likely Response:* She may argue FDT is overly abstract and computational, treating agents as functions, while resolute choice is grounded in the psychology of planning, intention, and character – a more realistic model of human agency involving genuine commitment over time.
      *   **Follow-up:** Doesn't this psychological grounding create problems FDT avoids? If resolute choice relies on "character" or "disposition," how does it handle cases where an agent *lacks* the resolute character? Is it *irrational* to lack that character? FDT seems to prescribe the *act* based on the abstractly best rule, regardless of the agent's current psychology. Doesn't resolute choice, by tying rationality to *having and acting from a disposition*, make rationality contingent on psychological traits in a way FDT doesn't? Is rationality about having the right *character* or making the right *decision*?

  5.  **The Scope Problem: When Does Resolution Apply?**
      *   **Q:** Resolute choice seems most compelling in tightly defined, high-stakes, one-shot dilemmas like the hitchhiker. How do you determine the scope? When *should* an agent be "resolute"? What prevents this from collapsing into ad-hocery – being resolute only in cases where it obviously pays off? Is there a general principle distinguishing cases where resolution is rational from those where it isn't?
      *   *Likely Response:* She might appeal to cases where commitment is beneficial, where predictable dispositions unlock valuable opportunities otherwise unavailable, or where plans require diachronic stability.
      *   **Follow-up:** But doesn't *any* plan require some diachronic stability? How does the theory avoid demanding resolution in *all* planning, even when sticking to a bad initial plan is clearly worse than adapting? Isn't the hitchhiker compelling precisely because *not* having the disposition is *fatal*, making the benefit overwhelming? Without that extreme benefit, how does resolute choice avoid demanding irrational rigidity? What's the cost-benefit threshold?

  6.  **The Bootstrapping Problem:**
      *   **Q:** At the initial desert moment, the hitchhiker *wants* to adopt the disposition to pay. But *why* is adopting that disposition rational *then*? Is it solely because the predictor will detect it and save them? If so, isn't this just sophisticated instrumental rationality (choosing a disposition as a means to survival)? Doesn't this reduce resolute choice to a clever *tactic* within standard CDT/EDT, used *because* the predictor exists, rather than a fundamental revision of rationality itself?
      *   *Likely Response:* She'll argue no, because adopting the disposition *also* involves a commitment to follow through later *even when you know it's costly*, which isn't just a tactic – it's a change in the agent's practical identity.
      *   **Follow-up:** But isn't the *reason* for adopting that identity still purely instrumental (to survive)? And crucially, *if the predictor could be fooled* (e.g., by a pill that mimics the disposition without creating the actual commitment), wouldn't taking the pill be *strictly dominant*? Doesn't this show the *actual commitment/resolution* is only instrumentally valuable as a signal, not intrinsically rational? If fooling the predictor were possible, wouldn't resolute choice advise taking the pill, revealing its core as signaling, not resolution per se?

  7.  **The Problem of Changing Values/Circumstances:**
      *   **Q:** Suppose after being saved, but before paying, the hitchhiker learns something radically new: maybe the $100 was inherited from a tyrant and paying it will fund atrocities, or they develop a pathological aversion to keeping promises. Does resolute choice demand they pay regardless? If not, how does the theory incorporate *genuinely new, relevant information* without undermining the whole idea of resolution? If yes, doesn't this make resolution potentially monstrous?
      *   *Likely Response:* She'll likely argue resolution isn't absolute; significant *unforeseen* changes in values or circumstances can override the commitment. The initial resolution was made under specific assumptions.
      *   **Follow-up:** Doesn't this concession open a massive loophole? How do you define "significant" or "unforeseen" rigorously? Doesn't *any* new information, however minor, potentially trigger re-evaluation? If the hitchhiker simply *changes their mind* about the value of $100 vs. promise-keeping after being saved (with no new facts), must they still pay? If resolution can be overridden by mere preference shifts, isn't it fragile? If it can't, isn't it irrational?

  8.  **The Self-Undermining Disposition:**
      *   **Q:** Consider a variant: The driver will save you *only* if he predicts you are *disposed to not pay him* (perhaps he's an eccentric moralist who rewards "honest defectors"). Resolute choice, aiming for the best outcome, would presumably advise cultivating the disposition *to not pay*. But once saved, *acting* on that disposition (not paying) is what you were "resolved" to do. Doesn't this show that resolute choice can just as easily recommend cultivating dispositions for acts that *are* self-interestedly rational at the moment of performance? Doesn't this undermine the claim that it uniquely solves the hitchhiker paradox by recommending *against* the locally rational act?
      *   *Likely Response:* She might argue this flips the case, but the core logic holds: rationality involves adopting the disposition that gets the best outcome, whether it's paying or not paying in this variant. The theory is flexible.
      *   **Follow-up:** Precisely. Doesn't this flexibility mean resolute choice isn't fundamentally *about* resolution or commitment *at all*? It's simply *instrumental disposition formation based on predicted consequences*. In the original hitchhiker, it coincidentally recommends a disposition that leads to a locally irrational act. In this variant, it recommends a disposition that leads to a locally rational act. The "resolution" is epiphenomenal; it's all about what disposition signals effectively to the predictor. Isn't this just sophisticated consequentialism about traits?

  9.  **The Charge of Circularity/Triviality:**
      *   **Q:** Resolute choice seems to define rationality as: "Adopt the disposition that leads to the best overall outcome." But isn't this essentially circular? It defines rational action *in terms of* the outcome of having a disposition, without an independent criterion for what makes the disposition rational *to adopt* beyond its consequences. How is this different from simply saying "do whatever gets the best consequences," including manipulating your own dispositions?
      *   *Likely Response:* She'll argue it's not circular because it specifies *how* to get the best consequences: by adopting and adhering to a plan/disposition, not just by performing isolated acts. It adds structure to consequentialism.
      *   **Follow-up:** But doesn't this structure boil down to "be the kind of person who does X in situation Y because that kind of person gets outcome Z"? Isn't the rationality of *being* that person still solely determined by Z? And doesn't this make the theory vulnerable to the same objections as rule utilitarianism – why follow the rule/disposition in *this* case when you know breaking it *now* won't harm the overall pattern (e.g., if no one is predicting you *this time*)? The hitchhiker *knows* paying won't affect future predictability *in this isolated interaction*.

  10. **The Virtue Ethics Dodge:**
      *   **Q:** When pressed on why the act of paying is rational despite its local cost, proponents sometimes retreat to language of "integrity," "being trustworthy," or "keeping commitments" as intrinsically valuable traits. Isn't this effectively abandoning decision theory for virtue ethics? If rationality *just is* acting virtuously (e.g., keeping promises), then the hitchhiker paradox dissolves, but so does the distinctiveness of resolute choice *as a decision theory*. Are you arguing that practical rationality *requires* incorporating virtue-ethical considerations?
      *   *Likely Response:* She may deny abandoning decision theory, arguing integrity/trustworthiness *are* components of rational agency within a broader consequentialist framework, or that resolution is a distinct requirement of diachronic agency.
      *   **Follow-up:** If these traits are valued *consequentially* (because they lead to good outcomes like being saved), we're back to sophisticated instrumentalism. If they are valued *intrinsically* as part of rationality itself, doesn't this fundamentally redefine practical rationality away from its standard instrumental (satisfying desires/preferences) core? Is resolute choice a Trojan horse for virtue ethics within decision theory? If not, what *non-virtue-ethical, non-instrumental* reason makes the act of paying rational?

  **Key Strategies Embedded:**

  *   **Forcing Precision:** Questions 1 & 4 demand clarity on the core mechanism (act vs. disposition vs. function).
  *   **Historical Context & Differentiation:** Questions 2 & 4 force her to distinguish her view from close competitors (Gauthier, FDT).
  *   **Pressing on Core Assumptions:** Questions 3 & 6 challenge the reliance on the predictor setup and the instrumental basis of disposition formation.
  *   **Testing Boundaries & Robustness:** Questions 5, 7, and 8 explore edge cases, changing contexts, and flipped scenarios to probe the theory's limits and consistency.
  *   **Metatheoretical Challenges:** Questions 9 & 10 question the theoretical foundations, potential circularity, and relationship to other ethical frameworks.

  These questions are designed to move beyond "Isn't it irrational to pay?" and instead target the *coherence, scope, foundations, and distinctiveness* of resolute choice as a theory of practical rationality. Good luck with the Q&A!
