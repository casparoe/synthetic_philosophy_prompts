  ---

  # MEMORANDUM  
  **To:** Student Council Members  
  **From:** Constitution Committee  
  **Date:** [Date]  
  **Subject:** Recommendation re: Entrenchment of "Phones Away During Lunch" Policy  

  ## Background  
  The committee has reviewed a proposal to entrench the popular "phones away during lunch" policy (passed 12–10 in Spring 2023) in the Student Council Constitution. The proposal would require a two-thirds majority to repeal the policy. The key arguments are:  
  1. **Pro-Entrenchment:** The policy nearly failed early due to a slim majority before its benefits (improved socialization, reduced distractions) became clear. Future councils—elected by students who never experienced pre-policy lunches—might repeal it impulsively.  
  2. **Anti-Entrenchment:** A simple majority today could permanently bind future majorities, undermining democratic representation. Further, a future council could circumvent entrenchment by first repealing the clause itself with a simple majority.  

  ## Committee Recommendation: Modified Entrenchment with Sunset Clause  
  **We recommend adopting an entrenchment clause requiring a two-thirds vote to repeal the policy, but with a 2-year sunset provision (expiring June 2026).** This balances the need for policy stability with respect for future councils’ autonomy.  

  ### Reasoning:  
  1. **Addressing Fairness & Democratic Concerns:**  
     - **The "Bare Majority" Problem:** While the original policy passed narrowly, it now has broad support. Entrenching it via a simple majority vote *would* allow today’s majority to restrict future majorities—a legitimate fairness objection.  
     - **Our Solution:** The **sunset clause** ensures entrenchment is temporary. Future councils regain full autonomy after two years, preventing indefinite binding. This respects future students’ right to self-governance while acknowledging the policy’s unique vulnerability during its transitional phase.  

  2. **Mitigating the "Sidestepping" Loophole:**  
     - The procedural loophole (repealing entrenchment with a simple majority first) renders permanent entrenchment ineffective. A **time-limited clause** eliminates this risk: future councils need not circumvent rules if the clause expires automatically.  

  3. **Protecting Policy Stability During Transition:**  
     - The next two years are critical: the Class of 2024 (which voted for the policy) will graduate, and new students (Classes of 2026/2027) will comprise the electorate. The sunset clause protects the policy long enough for these students to experience its benefits *before* a simple majority could repeal it.  

  4. **Practical Precedent:**  
     - Entrenchment should be reserved for policies with proven, durable value. A 2-year test period allows future councils to evaluate the policy’s longevity without permanent constraints. If the policy remains popular in 2026, re-entrenching it would carry greater legitimacy.  

  ## Alternatives Considered & Rejected  
  - **Original Proposal (Permanent Entrenchment):**  
    Fails to resolve the fairness objection or procedural loophole. Risks imposing outdated preferences on future councils.  
  - **Higher Threshold for Initial Entrenchment (e.g., ⅔):**  
    While intuitively fairer, this does not address the core issue: even a supermajority today could undemocratically bind future simple majorities. The sunset clause offers a more principled compromise.  
  - **Outright Rejection:**  
    Ignores valid concerns about rash repeal. The policy’s initial near-reversal shows new policies need stability to succeed.  

  ## Conclusion  
  The sunset clause modification ensures the policy survives its most vulnerable period while honoring the principle that each council should govern based on current student needs. By 2026, the policy will stand or fall on its own merits—not through procedural constraints. We urge the council to adopt this balanced approach.  

  **Vote:** 4-1 in committee (one dissent preferred outright rejection).  

  --- 

  ### Key Strengths of This Approach:
  - **Engages the Fairness Objection:** Explicitly acknowledges that permanent entrenchment by simple majority is democratically questionable.  
  - **Solves the Loophole:** Sunset eliminates incentive/need for future councils to "sidestep" entrenchment.  
  - **Temporal Limits:** 2 years aligns with high school turnover (current sophomores will graduate when it expires).  
  - **Future Flexibility:** Preserves long-term student sovereignty while valuing near-term stability.  

  This memo avoids paternalism ("we know best") by centering on the policy’s transitional fragility and sunsetting constraints. It shows respect for both current and future students’ voices.
