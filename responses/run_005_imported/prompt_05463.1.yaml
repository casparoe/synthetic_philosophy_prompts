prompt: |-
  Hey, so I run a small interview podcast out of my department -- started it during lockdown mostly as a distraction and never stopped -- and next week im recording an episode with a philosopher who's basically built her whole career defending the moral equality of combatants against the McMahan-style revisionist attack. Her position is close to Walzer's: a soldier fighting on the unjust side isn't a murderer just for showing up and fighting, so long as he sticks to the in bello rules, and she's spent a decade or so publishing responses to "Killing in War" specifically.

  My seminar just spent three weeks going through McMahan's liability argument and most of the students came away pretty convinced by it, so I really don't want this interview to just be her restating the Walzerian line about soldiers being "moral equals." I want questions that lean on the spots where I think her position actually gets shaky, so she has to do more than recite the view once and sit down.

  Could you draft me eight or nine interview questions for this? I definately want one that presses the individual self-defense analogy -- why doesn't the "the attacker is liable, the defender isn't" logic carry over from ordinary cases to war the way McMahan thinks it should? -- and one that forces her to say whether her argument is really about individual-level moral symmetry or whether it's secretly a claim that a convention of treating combatants alike minimizes total harm, because if it's the second thing, isn't she just conceding the deep morality to McMahan and holding onto the surface-level rules for entirely separate reasons? I also want one on the gap between a conscript who's been lied to about the cause and a volunteer who privately suspects the cause is unjust but keeps fighting anyway -- does her view actually treat those two cases the same? -- and one on the objection that there's no morally real category "combatant" to begin with, just individuals contributing in different degrees to a threat, so that "equality of combatants" is the wrong question from the start. For each of those, plus whatever else you come up with to round it out to eight or nine, give a quick follow-up keyed to the answer she's most likely to give.
