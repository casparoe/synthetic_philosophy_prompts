  For move (1): The classmate claims narrowing - from praising tyrannicide in Sentences to restricting it to public authorities in Summa to warning against private action in De Regimine. This oversimplifies. The Sentences passage specifically discusses usurpers, not all tyrants, and De Regimine's caution is pragmatic, not doctrinal. Score: -1 (partially mistaken by ignoring context).

  For move (2): The rebuttal about the usurper vs. legitimate tyrant distinction holds up. The "praised and rewarded" line targets only usurpers, aligning with the sedition article's allowance for resisting regimes serving private gain. This is Aquinas's consistent framework. Score: +2 (clearly right).

  Move (3) points out the homicide article's silence on usurpers. Valid observation! If Aquinas maintained the exception, this would be the place to restate it. His omission suggests either abandonment or that he categorizes usurpers differently. Score: +1 (correct but inconclusive).

  Move (4) brilliantly reframes the homicide article's silence: resisting usurpation is active defense, not judicial punishment. De Regimine's warnings are practical (success likelihood) not retractions. This resolves move (3)'s concern. Score: +2 (textually astute).

  Move (5) calls the permission "useless" if rarely applicable. But Aquinas often acknowledges rare-but-valid exceptions (e.g., lying to save life). The Cicero comparison is speculative. Score: -1 (overstates case).

  Overall: The distinction argument (move 2) is stronger. Both overlook that Aquinas's "public charge" requirement in Summa may implicitly exclude usurpers (who lack legitimate authority), making the omission in the homicide article deliberate, not a retraction. Also missing: Aquinas's emphasis on tyranny-as-injustice rather than mere inefficiency.

  The user needs this for seminar discussion, so I'll emphasize textual precision over declaring winners. They're clearly engaged but lack background - my analysis should model how to reconcile apparent contradictions in primary sources.
answer: |-
  ### Adjudication of Moves

  | Move | Score | Justification |
  |------|-------|--------------|
  | **1** | `-1` | Partly mistaken. While Aquinas *does* become more cautious, he never fully retracts the usurper exception. The *Sentences* explicitly addresses *usurpers*, while *De Regimine* targets *legitimate-title tyrants*. The homicide article’s silence isn’t a retraction but reflects its focus on *judicial* punishment, not emergency defense. |
  | **2** | `+2` | Clearly right. The usurper vs. legitimate-title distinction is consistent across texts. *Sentences* and the sedition article (*Summa* II-II q.42) explicitly limit permissibility to usurpers or regimes serving *only* the ruler’s private good. Aquinas treats usurpers as active aggressors, not subjects under lawful authority. |
  | **3** | `+1` | Correct observation but inconclusive. The homicide article (II-II q.64) indeed omits the usurper exception, but this doesn’t prove abandonment. As (4) notes, resisting a usurper isn’t "punishment" but *defense* against an unjust aggressor—a category addressed elsewhere (e.g., self-defense in II-II q.64). |
  | **4** | `+2` | Clearly right. The homicide article concerns *judicial execution*, not emergency defense. *De Regimine*’s caution (I.6) explicitly applies to tyrants with *legitimate title* and emphasizes prudential hurdles (e.g., risk of worse outcomes), not doctrinal reversal. Aquinas reaffirms the usurper exception in *De Regimine* (I.7). |
  | **5** | `-1` | Mistaken in its implications. Aquinas *does* allow rare exceptions (e.g., lying to save a life). The "praised and rewarded" line aligns with his broader principle that usurpers lack legitimacy (*Sent.* II d.44 q.2 a.2). His mature works retain this logic (*De Regimine* I.7). |

