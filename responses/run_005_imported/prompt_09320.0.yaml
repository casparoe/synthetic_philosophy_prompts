prompt: |-
  Quick bit of context: at my company we started running a poll to settle which one big tech-debt project our team of about a dozen engineers tackles each quarter, since arguing about it live in meetings kept going nowhere. I threw together a little internal tool for it that does ranked-choice / instant-runoff voting: everyone ranks all six or so candidate projects from favorite to least favorite, and the tool eliminates whoever's got the fewest first-place votes each round and redistributes those ballots to next choices until one project is left standing. I specifically picked ranked-choice because I'd read it's supposed to be way harder to game than just going with whoever gets the most first-place votes, plus some actual cities use it for real elections so it seemed like the legit choice.

  Except last quarter one of our senior engineers, who's way more into game theory than the rest of us, told me afterwards that he'd deliberately ranked his actual second-favorite project dead last (below a couple things he genuinely didn't care about) instead of putting it second where it "honestly" belonged. According to him, doing that changed the order in which stuff got eliminated in the early rounds, which snowballed into his real favorite winning instead of loosing to his second choice in the final head-to-head. He wasn't even sneaky about it either, he pulled up the spreadsheet afterward and walked me through exactly why it worked. I mentioned this to a couple friends over drinks and we couldn't agree on whether it's fixable.

  Now I'm trying to figure out if this is a "me" problem, like I implemented IRV wrong or just need a smarter tiebreak rule somewhere, or if its something deeper. Would switching to a Condorcet method, or Borda count, or plain approval voting have closed off this loophole, or is there just no way to design a poll like this thats fully immune to someone voting "dishonestly" once they understand how the counting works? Kind of want to actually understand why, one way or the other, before I roll v2 of this out company-wide instead of just cargo-culting whichever method sounds fanciest on Wikipedia.
reasoning: |-
  Alright, let's tackle this user's problem. They created a ranked-choice voting system for their team to decide on tech-debt projects, but a senior engineer gamed it by ranking his second choice last. The user wants to know if this is fixable by changing the voting method or if it's an inherent issue.

  First, I need to recall how Instant-Runoff Voting (IRV) works. IRV eliminates the candidate with the fewest first-place votes and redistributes their votes. The problem the engineer exploited is called "burying," where a voter ranks a strong opponent low to get them eliminated early, allowing their preferred candidate to win. This is a known vulnerability in IRV.

  The user mentioned alternatives like Condorcet, Borda, or approval voting. I should compare each method's susceptibility to strategic voting. Condorcet methods, while satisfying the Condorcet criterion, can be vulnerable to tactical voting in some scenarios. Borda count is particularly prone to manipulation because voters can rank strong competitors lower. Approval voting might reduce strategy since voters just approve or disapprove, but it doesn't capture ranked preferences.

  The key here is Arrow's Impossibility Theorem, which states no ranked voting system can be perfect. So, no matter the method, there's always a trade-off. The user's main concern is whether switching methods would close the loophole. While approval or Condorcet might reduce specific tactics, they have other weaknesses. For example, approval might lead to bullet voting, where voters only choose their top candidate.

  The user's deeper need is likely to find a fair and efficient method without constant gaming. They also need team buy-in. Since the team is small, maybe a simpler method like approval or score voting would work better. Emphasizing transparency and maybe making the voting public could deter manipulation. Also, educating the team on honest voting might help, but it's not foolproof.

  In conclusion, IRV's vulnerability is inherent, and while other methods have different strengths, none are perfect. The recommendation should balance practicality and resistance to manipulation, possibly favoring approval or Condorcet for this context.
answer: |-
  This isn't a "you" problem – you implemented IRV correctly, and the senior engineer brilliantly exploited a well-known fundamental vulnerability of the system. This tactic is called **"burying"** or **"compromising"**, and it highlights why IRV, while better than simple plurality in many ways, isn't immune to strategic voting. Let's break down why it happened and your options:

  1.  **Why it Worked (The "Burying" Tactic):**
      *   The engineer correctly identified that his *real second choice* was a strong competitor to his *real first choice*.
      *   By ranking this strong competitor *last*, he actively worked to get it eliminated *earlier* in the IRV process.
      *   The goal was to ensure that his *real first choice* faced a *weaker opponent* in the final head-to-head round, giving it a better chance to win.
      *   His ballot didn't help the strong competitor (his second choice) at all until it was the *only* choice left on his ballot (which, in this scenario, never happened because it got eliminated earlier). His vote only actively helped his true favorite until the very end.

  2.  **Is IRV "Wrong"?** No. This vulnerability is an inherent mathematical property of the Instant-Runoff Voting method. It fails the **"Later-No-Harm"** criterion. Later-No-Harm means that ranking a candidate higher should never harm a more-preferred candidate, and ranking a candidate lower should never help a more-preferred candidate. IRV fails this – ranking a strong competitor lower (burying it) *can* help your favorite win.

  3.  **Would Tiebreakers Fix This?** No. This wasn't about a tie; it was about manipulating the *order of elimination* by withholding support from a strong candidate you genuinely like, to get it knocked out sooner. Better tiebreakers wouldn't address the core strategic incentive.

  4.  **Evaluating Alternatives: Can They Be "Gamed"?**

      *   **Condorcet Methods (e.g., Ranked Pairs, Schulze):**
          *   **Pros:** Finds the candidate that beats every other candidate in head-to-head matchups (the Condorcet Winner) if one exists. Very resistant to many types of strategy, including the "burying" tactic. If a Condorcet Winner exists, ranking your true second choice honestly *cannot* harm your first choice.
          *   **Cons:** More complex to explain and count (though software handles this). Vulnerable to a *different* strategy: **"Cloning"** (splitting a strong candidate's support among near-identical alternatives) or **"Pushing"** (ranking a weak candidate above a strong challenger to your favorite in very specific, less common scenarios). Still fails Later-No-Harm in some interpretations. *Verdict:* **Significantly more resistant to the "burying" tactic** than IRV. A strong contender for your use case.

      *   **Borda Count:**
          *   **Pros:** Simple to understand: points based on rank (1st = n points, 2nd = n-1, ..., last = 1 point). Sum points, highest wins.
          *   **Cons:** **Highly vulnerable to strategy.** The *easiest* system to game! Voters have a huge incentive to rank strong competitors *last* (burying) to minimize their points and rank only their favorite highly ("bullet voting"). Also vulnerable to "compromising" (ranking a less-loved but viable candidate higher than your true favorite if you think your favorite can't win). Fails Later-No-Harm spectacularly. *Verdict:* **Worse than IRV for susceptibility to strategy like this.** Avoid.

      *   **Approval Voting:**
          *   **Pros:** Extremely simple: vote for every candidate you find acceptable ("Approve"). Candidate with the most approvals wins. Very resistant to the "burying" tactic (you can't hurt a candidate by *not* approving them, only by approving their direct competitors). Encourages finding consensus candidates.
          *   **Cons:** Doesn't capture strength of preference well. Voters face a strategic decision on their "approval threshold" (approve only my absolute favorite? approve everyone I tolerate?). Vulnerable to **"bullet voting"** (approving only your top choice) if voters think it's necessary to stop a disliked candidate. *Verdict:* **Very resistant to "burying".** Simpler than Condorcet/IRV. A strong contender, especially for a small group prioritizing simplicity.

  5.  **The Fundamental Problem: Arrow's Impossibility Theorem**
      This is the key takeaway. **Kenneth Arrow mathematically proved that no ranked voting system (where voters express a strict order of preference) can simultaneously satisfy all of a set of seemingly reasonable fairness criteria in all cases when there are 3 or more candidates.** One of the criteria often sacrificed is resistance to strategic voting. **There is no perfect, strategy-proof system for 3+ candidates.**

      *   **IRV** sacrifices resistance to "burying" and "compromising".
      *   **Condorcet** sacrifices resistance to "cloning" and absolute simplicity.
      *   **Borda** sacrifices almost all resistance to strategy.
      *   **Approval** (not strictly ranked) sidesteps some Arrow criteria but introduces the "approval threshold" strategy.

  **Recommendations for Your V2:**

  1.  **Acknowledge the Reality:** Explain to the team that *no* voting system is perfect or immune to strategy. The goal is to find one that works well *in your specific context* (small team, non-adversarial, shared goals) and minimizes *harmful* strategic incentives.
  2.  **Prioritize Honesty & Culture:** Emphasize that the system works best when people vote honestly. The senior engineer's tactic, while clever, undermines the goal of finding the project with the *broadest* support. Encourage a culture of honest ranking. Making votes public (anonymized *after* the fact for analysis only?) *might* discourage blatant manipulation but has significant downsides too.
  3.  **Choose a More Robust Method (Based on Your Goals):**
      *   **For Maximum Resistance to "Burying" & Finding Strong Consensus:** **Condorcet (Ranked Pairs or Schulze)** is your best bet. Use good software (e.g., [opavote.com](https://www.opavote.com/), [condorcet.vote](https://condorcet.vote/)).
      *   **For Utmost Simplicity & Good Strategy Resistance:** **Approval Voting** is excellent. Very easy to implement and understand. Minimizes the *type* of strategy your engineer used.
      *   **Stick with IRV?** If you value familiarity and simplicity *slightly* more than closing this specific loophole, you can. Just be aware of the vulnerability. You could add a rule *discouraging* blatantly insincere rankings (like ranking your true #2 dead last), but enforcing it is tricky.
  4.  **Avoid Borda:** Its vulnerability to strategy is too high.
  5.  **Transparency:** Whatever method you choose, ensure the counting process is transparent. Being able to audit the result builds trust. The engineer walking you through the IRV result was actually a *good* thing for understanding the system's properties.

  **Conclusion:**

  The engineer exposed a real, inherent flaw in IRV. It's not your implementation. **Switching to Condorcet or Approval Voting would very likely "close off" this specific "burying" loophole.** Condorcet is the most robust ranked method against this tactic, while Approval is the simplest and also highly resistant. Remember Arrow's Theorem: no ranked system is perfect. Choose based on what trade-offs make the most sense for your team's size, culture, and tolerance for complexity vs. strategic vulnerability. Given your small team and shared goals, moving to Approval or Condorcet would be a significant improvement over IRV in terms of strategy resistance for this specific vulnerability.
