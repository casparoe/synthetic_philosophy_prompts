  Let me start by understanding Kant's framework. For Kant, all knowledge starts with experience, but a priori knowledge is independent of all experience. Necessity comes from the structure of human cognition, the categories and forms of intuition. Synthetic a priori truths are possible because of how our minds organize experience. Empirical concepts can't have real definitions; they're only expositions that are provisional. So maybe Kant could argue that Kripke's necessary truths aren't truly necessary in the transcendental sense but are based on how we fix references in language.

