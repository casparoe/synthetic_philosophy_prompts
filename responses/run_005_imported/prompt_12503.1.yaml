  The swamping argument posits that if reliability is only valuable as a means to true beliefs, once you have the true belief, the reliability adds no extra value. The espresso machine analogy is key here: two cups taste the same regardless of the machine's reliability. The virtue epistemologist should counter that knowledge is an achievement attributable to the agent's abilities, like an archer hitting the target through skill versus luck. The user wants both sides to engage deeply, not talk past each other, and neither should be a strawman.

