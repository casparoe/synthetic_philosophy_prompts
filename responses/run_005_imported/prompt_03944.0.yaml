  The partner's stance is behaviorist, which is valid but reductive. People often have competing desires; immediate gratification vs. long-term goals. The laptop use could be a habit loop (cue-routine-reward) rather than a true value indicator. Also, the user’s discomfort indicates cognitive dissonance, which shows they value both connection and their habit, creating internal conflict.

