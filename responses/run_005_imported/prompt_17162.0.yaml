  The memo should clearly recommend Nash for stability but suggest a review mechanism. Explaining the concepts in plain language is crucial. Using analogies like "pie splitting" could help. Acknowledging the monotonicity concern but emphasizing long-term incentives over theoretical fairness might resonate. Including a hybrid option shows flexibility without undermining the main recommendation.

