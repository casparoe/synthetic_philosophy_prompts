  The user wants a strict application of Aquinas's criteria, not just a moral judgment on Hitler. They need to see how Aquinas's framework handles such a case. The key points are the legitimacy of initial acquisition and the methods used. Aquinas might view the Enabling Act as invalid due to coercion, thus making Hitler a usurper. Therefore, individual action like the Stauffenberg plot could be justified under Aquinas's view.

  But there's another angle: even if Hitler started legitimately, his actions post-Enabling Act dismantled the constitutional order, turning his rule into usurpation. Aquinas might see that as voiding any legitimacy. The user also needs to consider Aquinas's caution against private citizens acting without public authority. However, in a totalitarian state, no public authority exists, so Aquinas might permit tyrannicide as a last resort.

