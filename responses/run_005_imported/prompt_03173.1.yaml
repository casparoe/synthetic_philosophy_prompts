answer: |-
  ## The Fragile Dialectic: Can Conditionals Capture Dispositional Essence?

  The Simple Conditional Analysis (SCA) – defining a disposition (e.g., fragility) solely as the truth of a counterfactual (e.g., "if struck, it would break") – promised an elegant reduction of dispositional properties to familiar modal language. Yet, its downfall was orchestrated by two distinct families of counterexamples: Martin's finks and Johnston's masks (later Bird's antidotes). While both demonstrate the SCA's insufficiency, their distinct mechanisms reveal deeper challenges for *any* purely conditional analysis, suggesting that dispositions resist such reductive capture.

  **Dissecting the Threats: Why Finks and Masks are Fundamentally Different**

  1.  **Martin's Finks: The Disappearing Act of the Causal Basis.**
      *   **Mechanism:** A finkish arrangement *alters the intrinsic state* of the object *precisely in response to the stimulus* that would normally trigger the manifestation. The disposition's causal basis is *removed* (or added) *before* the manifestation process can even begin.
      *   **The Wire:** The wire lacks the intrinsic structure (causal basis) for conductivity *until* the finkish device activates it *the moment* a conductor approaches. The counterfactual "if touched, it would conduct" is true *only because* the fink *changes* the wire *into* a conductor upon touch. The wire wasn't disposed to conduct *before* the touch triggered the fink.
      *   **Problem for SCA:** The SCA counterfactual comes out true for an object that, *at the time the disposition is ascribed*, lacks the intrinsic property grounding the disposition. The counterfactual truth depends on an *extrinsic intervention* that alters the object's state.

  2.  **Johnston's Masks / Bird's Antidotes: The Blocked Path to Manifestation.**
      *   **Mechanism:** A masking arrangement *interferes with the causal chain* between the stimulus and the manifestation *without altering the object's intrinsic dispositional state*. The causal basis remains *fully present and intact* throughout the stimulus, but its typical effect is *prevented*.
      *   **The Packed Glass:** The glass retains its fragile molecular structure (causal basis) even when struck. The packing material absorbs or redirects the force, preventing the manifestation (breaking) *despite* the stimulus occurring *and* the disposition being fully present. The counterfactual "if struck, it would break" is false.
      *   **Problem for SCA:** The SCA counterfactual comes out false for an object that genuinely possesses the disposition. The intrinsic property is present, but an *extrinsic interferer* prevents its typical manifestation under the stimulus.

  **The Crucial Distinction:** Finks *destroy or create the disposition's causal basis in response to the stimulus*. Masks *leave the causal basis untouched but prevent its typical output*. Finks attack the *persistence* of the disposition *during* the stimulus. Masks attack the *efficacy* of the disposition *given* the stimulus. Lewis's Reformed Conditional Analysis (RCA) directly addressed finks by requiring that the object *retains* its intrinsic causal basis long enough for the stimulus to cause the manifestation. This successfully excludes finks: the finkish wire loses (or gains) its basis *before* the stimulus can cause manifestation via that basis.

  **Bird's Antidote: The Mask that Survives the Reform**

  Bird's brilliance was realizing that masks (renamed "antidotes" to emphasize their preventative nature) *directly target* the RCA's core mechanism. In the packed glass case:
  1.  The glass *has* the intrinsic causal basis for fragility (e.g., its brittle molecular structure).
  2.  The stimulus (being struck) *occurs*.
  3.  The intrinsic causal basis *persists* throughout the stimulus.
  4.  *Despite* 1-3, the manifestation (breaking) *does not occur* because the packing material (the antidote) intervenes in the causal chain initiated by the stimulus acting on the basis.

  The RCA counterfactual – "if the glass were struck *and retained its intrinsic causal basis C for fragility throughout being struck*, then it would break" – comes out *false* for the masked glass, even though the glass *is* fragile. The RCA handles finks but succumbs to masks/antidotes.

  **Can the Analysis Be Saved? The "No Finks, No Antidotes" Gambit and Its Peril**

  One seemingly straightforward rescue attempt is to explicitly build the *absence* of finks and antidotes into the antecedent of the conditional:

  *   **Patched Analysis (PA):** Object O is disposed to M when C iff: If C were to occur *and no fink for O's disposition to M when C were present, and no antidote to O's disposition to M when C were present*, then O would M.

  Does this work? Superficially, yes. For the finkish wire: the antecedent includes "no fink present". But in the actual scenario, a fink *is* present, so the counterfactual "if touched *and no fink*..." is vacuously true or irrelevant to the *actual* fink-present scenario. More damningly, it makes the counterfactual trivially true for the fragile glass *with* packing material: "if struck *and no packing material*..." – well, of course it would break then! But this tells us nothing about the glass's disposition *in the actual situation where packing material exists*.

  **The Fatal Circularity:** The deeper problem is **explanatory circularity**. To understand the PA, we need to understand what a "fink" and an "antidote" *are*. A fink is defined as something that *would remove the disposition* just when the stimulus occurs. An antidote is defined as something that *would prevent the manifestation* despite the stimulus occurring to a disposed object. **Both definitions explicitly rely on the very dispositional concept ("disposed to M when C") that the analysis is trying to reduce.** The PA doesn't provide a reductive analysis; it merely lists the conditions under which the conditional *would* hold, presupposing an independent understanding of dispositions to identify the interfering factors. It fails as a *reductive* project.

  **A Different Hope: Proportional Conditionals (Manley & Wasserman)**

  David Manley and Ryan Wasserman ("On Linking Dispositions and Conditionals", 2008) proposed a radically different approach: replace the simple or strict counterfactual with a *proportional* conditional.

  *   **Proportional Analysis:** O is disposed to M when C iff O would M *in a suitable proportion* of C-cases.

  The idea is that finks and antidotes represent *deviant* or *exceptional* C-cases. While the simple counterfactual might be false in a world with a fink or true in a world with an antidote, the disposition exists as long as the manifestation occurs in a *sufficiently high proportion* of the closest possible C-scenarios.

  *   **Against Finks:** In the vast majority of close worlds where the wire is touched, *without* a finkish device, it *doesn't* conduct. The proportion of conduct-when-touched worlds is low, so it lacks the disposition. In the fink-present world, the counterfactual truth is an outlier.
  *   **Against Masks:** In the vast majority of close worlds where the fragile glass is struck, *without* packing material, it *does* break. The proportion of break-when-struck worlds is high, so it possesses the disposition. In the mask-present world, the counterfactual falsity is an outlier.

  **Strengths and Weaknesses:** This approach cleverly avoids the on/off problem of simple conditionals and the circularity of the "no finks/antidotes" clause. It captures the intuition that dispositions are probabilistic tendencies, not guarantees.

  However, significant challenges remain:
  1.  **Vagueness:** What constitutes a "suitable proportion"? 51%? 90%? This is inherently vague and context-dependent.
  2.  **Intrinsicness vs. Extrinsicness:** The proportion depends heavily on the *distribution* of finks and antidotes across close possible worlds. This makes the disposition's existence surprisingly extrinsic. A glass might count as fragile in a world where packing material is rare, but not fragile in a nearly identical world where packing material is ubiquitous, even if its *intrinsic* structure is identical.
  3.  **Predictive Power:** The analysis tells us the *probability* of manifestation given stimulus, but doesn't necessarily capture the *categorical basis* we associate with dispositions. We want to say the glass *is* fragile *because* of its molecular structure, not because of the statistical distribution of packing material in modal space.
  4.  **The Essence Question:** Does it truly *reduce* dispositionality to non-dispositional terms, or does it merely provide a probabilistic gloss on it? The connection between the categorical basis and the manifestation probability still needs grounding.

  **The Verdict: Finks and Masks Together Sink the Reductive Project**

  While ingenious maneuvers like the proportional conditional offer a more resilient *description* of dispositional talk, the combined force of finks and masks demonstrates that **no purely conditional analysis can successfully reduce dispositions to non-dispositional terms.** Here's why:

  1.  **The Causal Basis Primacy:** Both counterexamples highlight the non-supervenience of the disposition on the conditional. What matters is the *intrinsic, persistent causal basis*. Finks show the basis can be absent when the conditional is true. Masks show the basis can be present when the conditional is false. Any analysis that secures the right truth conditions (like the RCA or PA in limited ways) either smuggles in dispositional concepts (circularity) or severs the direct link to the categorical basis we intuitively associate with the disposition (as the proportional approach risks doing).
  2.  **The Circularity Trap:** Genuinely reductive analyses (like the "no finks/antidotes" PA) inevitably require defining the interfering factors (finks, antidotes) in dispositional terms, presupposing the very concept they aim to reduce. This is fatal for reductionism.
  3.  **The Explanatory Gap:** Conditionals describe expected behavior. Dispositions are meant to *explain* behavior and support such conditionals. Reducing the disposition *to* the conditional leaves the explanatory ground empty. *Why* would the glass break if struck? The SCA/RCA/PA answer is circular: "because it's disposed to break if struck." The proportional answer invokes statistics, not the intrinsic structure. The intrinsic basis remains the missing, non-conditional explanatory factor.

  **Conclusion:**

  Finks and masks are not merely two examples of the same problem; they attack the conditional analysis on complementary fronts. Finks reveal that the truth of the conditional doesn't guarantee the presence of a stable dispositional property. Masks reveal that the presence of a stable dispositional property doesn't guarantee the truth of the conditional. Lewis's RCA plugged the fink-shaped hole but left the mask-shaped hole gaping. Attempts to patch both holes explicitly lead to circularity. The proportional approach, while more sophisticated and potentially descriptively adequate, sacrifices the categorical core of dispositions to extrinsic modal distributions and struggles with vagueness. **Therefore, finks and masks, taken together, demonstrate that dispositions are not reductively analyzable in purely conditional terms.** Dispositions are best understood as intrinsic, categorical properties (the causal basis) that *ground* the relevant conditionals and explain manifestations, rather than being constituted by those conditionals themselves. The quest for a reductive conditional analysis should be abandoned; dispositions are metaphysically prior to the conditionals they support.
