  So my friend Theo and I got into this whole argument last night — it started because I said something about how it's kind of rational to vote even though any single vote basically never decides an election, and it spiraled into a full-on hour-long thing in his kitchen about superrationality. You know, the Hofstadter idea where if you and some other agent are both "superrational," you're supposed to cooperate in a one-shot prisoner's dilemma (or the box-splitting version, or whatever) with literally zero communication, just because the reasoning goes "whatever logic makes me pick this output is the same logic that makes any other superrational agent pick it, so theres really only one decision happening here, not two separate ones." Theo's take was basically that this is dressed-up wishful thinking — that trusting the other guy because you reasoned your way there is functionally identical to just trusting the other guy, full stop, and the superrational framing is just nerds finding a fancier way to say "be nice." I tried to argue it's a genuinely different move (predicting someone vs. being logically identical to them), kind of like the gap between evidential and causal decision theory on Newcomb's problem, but I dont think I actually landed it, and we gave up around midnight with nobody budging.

  Anyway it's been rattling around in my head all day, and what I actually want now is a joke about superrationality to send him — not a generic "two philosophers walk into a bar" thing, but one where the punchline genuinely depends on how the reasoning works, like the humor comes from that "I'm not predicting you, I effectively am you" move, or from what happens when that assumption quietly breaks down. Basically the same bar as those jokes that only land if you already know why a causal decision theorist two-boxes on Newcomb's problem and an evidential decision theorist doesn't — funny because of the actual content, not just "haha nerds and their theories." One or two good ones would be great, ideally something short enough that I could actually just text it to him.
