prompt: |-
  I'm a software engineer, and for the past couple of years I've served on our small Elections & Governance working group -- part of the nonprofit foundation behind an open-source project I've contributed to for a long time (a few hundred regular contributors, one elected "Project Lead" seat contested every year). We currently pick the Lead by instant-runoff voting: everyone ranks the candidates, and we eliminate whoever has the fewest first-choice votes, round by round, until someone has a majority. Last cycle there were three real candidates: one who wanted to keep development slow and conservative, one pushing a fairly disruptive rewrite, and one occupying a genuine middle position that people on both sides often listed as their second choice even when she wasn't their first. That middle candidate had the fewest first-choice votes and was eliminated in round one, even though the anonymized ballots later made clear she'd have beaten either of the other two head-to-head. The rewrite candidate ended up winning, and quite a few contributors were unhappy afterward; several admitted they'd ranked only their favorite and left the rest blank, out of a vague worry that ranking everyone sincerely could somehow backfire.

  One working-group member, who has an economics background, now wants to replace instant-runoff with the Schulze method -- the pairwise, Condorcet-style method used for internal elections by Debian, Gentoo, and a few other free-software projects -- on the grounds that it would have picked the middle candidate and is generally much harder to game. Another member is dismissive, and keeps saying that Arrow's theorem already proved decades ago that no voting system can be fair, so arguing over which one we use is bikeshedding. That doesn't sound quite right to me; I'm fairly sure Arrow's theorem is about aggregating preferences into a full ranking rather than about picking a single winner. A friend of mine who works adjacent to decision theory, when I described the argument to her, said the theorem actually on point here is called Gibbard-Satterthwaite, and that as she recalled it, it applies to Schulze as well, just maybe not in quite the same way it applies to what we do now. I don't have the formal background to sort out how much of that is right, or what it should actually mean for our decision.

  I've been asked to draft the memo our working group will send to the foundation's board recommending a course of action before we'd need to lock in a bylaws amendment ahead of next year's election. Could you write that memo for me? I'd like it to explain, for an audience of programmers rather than social-choice theorists, what Gibbard-Satterthwaite actually establishes and how, if at all, it bears on the "Arrow already settled this" objection; to compare instant-runoff and Schulze honestly, including whatever we'd be giving up by switching and not just the fiasco we'd be avoiding; and to close with one specific recommendation -- keep instant-runoff, adopt Schulze outright, adopt Schulze with some added safeguard, or something else entirely -- along with a realistic timeline for bringing it to the board. A page or two, pitched at people who can read code but have never heard of a social choice function, would be ideal.
reasoning: |-
  We are drafting a memo for the Elections & Governance working group to send to the foundation's board.
   The audience is programmers (non social-choice experts).
   We need to:
   1. Explain the Gibbard-Satterthwaite theorem and how it relates to the "Arrow already settled this" objection.
   2. Compare instant-runoff voting (IRV) and the Schulze method honestly, including pros and cons.
   3. Provide a specific recommendation and a realistic timeline.

   Structure of the memo:

   I. Introduction
      - Briefly recap the problem in the last election: the middle candidate was eliminated early despite being a Condorcet winner (beats every other candidate in head-to-head).
      - Mention the two proposals: switching to Schulze vs. sticking with IRV, and the objection based on Arrow's theorem.

   II. Clarifying the Theorems: Arrow vs. Gibbard-Satterthwaite
      - Arrow's theorem: about ranking (social welfare function) and impossibility of satisfying non-dictatorship, Pareto efficiency, and independence of irrelevant alternatives (IIA) simultaneously.
          - Not directly about single-winner elections.
      - Gibbard-Satterthwaite theorem: about strategic voting (manipulation). It states that for any voting system that chooses a single winner and has at least three possible outcomes, if it is not a dictatorship and allows any preference ordering (unrestricted domain), then it is either manipulable (voters can get a better outcome by voting insincerely) or fails to be onto (some candidate can never win). 
      - Both theorems are impossibility results, but they address different issues. Arrow is about the aggregation of preferences into a complete ranking (and IIA), while Gibbard-Satterthwaite is about strategy-proofness in single-winner elections.

   III. How the Theorems Apply to Our Voting Systems
      - IRV (Instant-Runoff Voting): 
          - Known to be vulnerable to strategic voting (as we saw: voters leaving off lower rankings for fear of harming their favorite). 
          - Also, it fails the Condorcet criterion (the Condorcet winner isn't always elected, as in our case).
      - Schulze method:
          - A Condorcet method: if there's a candidate who beats every other in head-to-head, that candidate wins.
          - However, it is not immune to Gibbard-Satterthwaite: it is also vulnerable to strategic voting (though perhaps less so in practice?).
          - But note: Gibbard-Satterthwaite says that every reasonable system is vulnerable to manipulation. The key is how often manipulation is possible and how hard it is to execute.

   IV. Comparison of IRV and Schulze
      - IRV pros:
          - Simple to understand: the elimination process is intuitive.
          - Already in use and familiar to the community.
          - Encourages positive campaigning (candidates want to be second choices).
      - IRV cons:
          - Can eliminate a centrist candidate too early (as happened).
          - Vulnerable to the "center squeeze" effect.
          - Strategic voting: voters may not rank all candidates for fear of harming their favorite (as happened).

      - Schulze pros:
          - Satisfies the Condorcet criterion: if a candidate beats every other in head-to-head, they win (so the middle candidate in the last election would have won).
          - Resistant to some forms of strategic voting? (Though not perfectly, per Gibbard-Satterthwaite)
          - Used successfully in open-source communities (Debian, Gentoo) with similar dynamics.

      - Schulze cons:
          - More complex to explain and compute (though we can write code to do it).
          - May produce a winner that is not the first choice of the largest group (but is broadly acceptable).
          - The ballot (ranking all candidates) is the same as IRV, so the voting interface doesn't change.

      - Common concerns:
          - Both are vulnerable to strategic voting in theory (Gibbard-Satterthwaite), but in practice, the frequency and impact matter.
          - In Schulze, the complexity might lead to distrust? But we can provide open-source code for the tally.

   V. Recommendation
      - Given the specific problem we encountered (elimination of a Condorcet winner) and the fact that our community is technical and can handle the Schulze method's complexity, we recommend switching to the Schulze method.

      - However, to address the vulnerability to strategic voting (which exists in any system) and to build trust:
          - We will provide an open-source, auditable implementation of the Schulze method for vote tallying.
          - We will run an educational campaign to explain the method and why we are switching.
          - We will also recommend that the ballot instructions encourage voters to rank all candidates sincerely.

      - Alternative: Consider Approval Voting? (But that's a big change and not requested.) We stick to the two discussed.

      - Specific recommendation: Adopt the Schulze method for the election of the Project Lead.

      - Timeline:
          - Month 1: Draft bylaws amendment and get working group approval.
          - Month 2: Present to the board for discussion and approval (with memo and educational materials).
          - Month 3: If approved, implement the voting system (code and documentation) and start community education (blog posts, Q&A).
          - Month 4: Test run with a non-binding vote (e.g., on a non-election issue) to familiarize the community.
          - Month 5: Use Schulze for next year's Project Lead election.

   VI. Conclusion
      - While no system is perfect, Schulze addresses the specific failure we experienced and is well-suited for our community.

  Let's write the memo accordingly.
answer: |-
  **To:** Foundation Board Members  
  **From:** Elections & Governance Working Group  
  **Date:** October 26, 2023  
  **Subject:** Recommendation for Voting System Reform in Project Lead Elections  

  ### **1. Introduction**  
  In the past election cycle, our instant-runoff voting (IRV) system failed to select a broadly supported candidate despite clear evidence that a "middle" candidate would have beaten all others head-to-head. This outcome has sparked debate about adopting the Schulze method (a Condorcet-style system used by Debian/Gentoo) versus retaining IRV. One objection raised is that "Arrow’s theorem proves no fair system exists," implying reform is futile. This memo clarifies the theoretical landscape, compares IRV and Schulze honestly, and recommends a path forward.  

  ---

  ### **2. Key Theorems: What They Actually Say (For Engineers)**  
  #### **Arrow’s Theorem**  
  - **What it addresses:** Aggregating individual preferences into a *complete ranked list* (e.g., "Candidate A > B > C") while meeting fairness criteria.  
  - **Key takeaway:** Arrow proves *no system* can satisfy all "fairness" axioms simultaneously (e.g., avoiding dictatorships, respecting unanimity).  
  - **Why it’s misapplied here:** We’re selecting a *single winner*, not a full ranking. Arrow doesn’t directly address strategic voting or single-winner edge cases.  

  #### **Gibbard-Satterthwaite (G-S) Theorem**  
  - **What it addresses:** *Strategic manipulation* in single-winner elections (i.e., voters gaming the system by lying about preferences).  
  - **Key takeaway:** G-S proves *any* voting system with ≥3 candidates is vulnerable to manipulation, unless it’s dictatorial or restricts preferences.  
  - **Relevance to us:** Both IRV *and* Schulze are vulnerable to G-S. However, **vulnerability ≠ inevitability**. Some systems make manipulation harder or rarer in practice.  

  > **Engineer’s Translation:**  
  > - Arrow: "No perfect ranking exists."  
  > - G-S: "All systems can be gamed."  
  > **Neither implies all systems are equally flawed.** We must compare practical trade-offs.  

  ---

  ### **3. IRV vs. Schulze: An Honest Comparison**  
  #### **Instant-Runoff Voting (Current System)**  
  - **How it works:** Voters rank candidates. The least-popular #1 choice is eliminated each round until one has a majority.  
  - **Pros:**  
    - Simple to understand and tally.  
    - Encourages candidates to seek broad support (second-choice votes).  
  - **Cons:**  
    - **Fails the Condorcet criterion:** A candidate who beats all others head-to-head can lose (as in our last election).  
    - **Vulnerable to "center-squeeze":** Compromise candidates (like our middle candidate) are often eliminated early.  
    - **Strategic voting:** Voters may omit rankings to avoid harming their favorite (e.g., supporters leaving the middle candidate unranked).  

  #### **Schulze Method (Proposed Change)**  
  - **How it works:** Voters rank candidates. The system simulates all head-to-head matchups and selects a winner with the strongest pairwise support ("beatpaths").  
  - **Pros:**  
    - **Condorcet-compliant:** Always elects a candidate who beats all others head-to-head (if one exists).  
    - **Resists "center-squeeze":** Compromise candidates win if they’re broadly acceptable (as our middle candidate would have).  
    - **Harder to game:** Strategic voting requires complex coordination and is less intuitive.  
  - **Cons:**  
    - **Complex tallying:** Results aren’t calculable by hand (requires code).  
    - **Less intuitive:** Explaining "beatpaths" requires more voter education.  
    - **Non-monotonicity (rare):** In some edge cases, ranking a candidate higher can hurt them.  

  > **Key Insight:**  
  > Schulze avoids the specific failure we experienced (eliminating Condorcet winners) but trades off simplicity. Both systems are G-S-vulnerable, but Schulze’s complexity makes manipulation harder.  

  ---

  ### **4. Recommendation: Adopt Schulze with Safeguards**  
  We recommend **switching to the Schulze method** for Project Lead elections, supplemented with:  
  1. **Open-source tally implementation:** Publish auditable code pre-election (Python/Rust) to ensure transparency.  
  2. **Voter education:** Explain Schulze via a "how it works" guide using pairwise matchups (engineers will grasp this).  
  3. **Ballot flexibility:** Allow truncated rankings (voters can rank only as many as they wish).  

  #### **Why Schulze?**  
  - It fixes the **critical flaw** exposed in our last election: the elimination of a consensus candidate due to IRV’s round-by-round mechanics.  
  - While no system is G-S-proof, Schulze’s reliance on pairwise comparisons aligns better with our goal of electing the most broadly acceptable leader.  

  #### **Timeline**  
  - **Nov 2023:** Finalize bylaws amendment and Schulze tally code.  
  - **Dec 2023:** Board approval + community announcement.  
  - **Jan-Feb 2024:** Voter education (webinar/docs).  
  - **Mar 2024:** Dry-run test with mock ballots.  
  - **May 2024:** Implement for next Project Lead election.  

  ---

  ### **5. Conclusion**  
  Arrow and Gibbard-Satterthwaite expose universal trade-offs, but they don’t justify inaction. Schulze directly addresses the failure mode we experienced, and its drawbacks (complex tallying) are manageable for our technical community. By adopting Schulze with transparent safeguards, we can elect leaders who better reflect the project’s collective will.  

  **Recommended vote:** Approve Schulze method for 2024 Project Lead elections.  

  ---  
