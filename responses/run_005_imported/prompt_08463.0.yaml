answer: |-
  ## The Peeking Problem: A Definitive Verdict on Frequentist vs. Bayesian A/B Testing

  The "peeking" debate strikes at the heart of statistical inference. Let's dissect the mechanics, expose the Bayesian promise, and deliver a clear verdict.

  **I. Why Peeking Breaks Frequentist Significance Testing (The Mechanics)**

  The core issue is the **Type I Error Rate Inflation**. The frequentist p-value (`p < 0.05`) answers: "Assuming the null hypothesis (H0, e.g., no difference) is *true*, what is the probability of observing data *at least as extreme* as what I actually observed?" This probability calculation **crucially depends on the *planned* sampling strategy.**

  *   **Fixed Sample Size Design:** When you pre-specify a sample size `N` and only analyze once that `N` is reached, the sampling distribution of your test statistic under H0 is well-defined. The `alpha = 0.05` threshold controls the *long-run* false positive rate: if H0 is true, you'll only falsely reject it 5% of the time over infinitely many identical experiments.
  *   **Peeking (Sequential Testing):** Each "peek" is a potential decision point to stop and reject H0. This creates **multiple comparisons**:
      *   At peek 1 (sample size `n1`), there's a ~5% chance `p < 0.05` *even if H0 is true*.
      *   At peek 2 (`n2 > n1`), there's *another* ~5% chance `p < 0.05` *even if H0 is true*, **conditional on not stopping at peek 1**.
      *   This conditional probability accumulates. The test statistic under H0 at later peeks is no longer independent of its value at earlier peeks; you're only continuing *because* you didn't hit significance earlier. This creates a **dependent sequence of tests**.
  *   **The Consequence:** The overall probability of getting *at least one* `p < 0.05` during *any* peek when H0 is true **exceeds 5%**. It can easily reach 15-30% or higher with frequent peeking. This is the "researcher degrees of freedom" or "p-hacking" trap – by repeatedly checking, you exploit random fluctuations, dramatically increasing the chance of a false discovery. The nominal `p < 0.05` becomes meaningless; it no longer signifies a 5% false positive risk.

  **II. The Bayesian Promise: Does Peeking Vanish?**

  Bayesian inference answers a different question: "Given the observed data `D`, what is the probability my hypothesis (H1) is true, compared to another hypothesis (H0), given my prior beliefs?" It focuses on **posterior probabilities** or **Bayes Factors (BF)**, representing the strength of evidence *in the observed data*.

  *   **The Stopping Rule Principle:** A core tenet of Bayesian inference is that the *reason* you stopped collecting data **does not affect** the interpretation of the evidence *contained in the data you have*. Whether you stopped because `BF > 10`, because you ran out of money, because you saw `p < 0.05`, or because a bird told you to, the posterior probability `P(H1 | D)` and the BF calculated from `D` remain the same. The inference conditions *only* on the data observed.
  *   **Peeking Mechanically "Safe":** Therefore, **yes, you can peek constantly with Bayesian methods.** Updating the posterior or BF after every new observation is not just allowed; it's inherent to the sequential learning process. The calculation incorporates the current data and the prior, independent of the path taken to get that data or how many times you looked. There is no "inflation" of a false positive rate in the same way, because there isn't a long-run error rate defined solely over repeated sampling under H0 that the Bayesian BF is *designed* to control rigidly.

  **III. The Caveats: Where the Problem Relocates (or Transforms)**

  The Bayesian approach doesn't magically eliminate challenges; it shifts them:

  1.  **The Prior:** This is the relocation point. The posterior and BF depend critically on the prior distribution assigned to the effect size.
      *   **Mischief Potential:** An overly optimistic prior favoring large effects can make it easier to get a high BF (evidence for H1) with less data, potentially leading to false confidence. A skeptical prior favoring H0 (or very small effects) can make it harder to detect a real effect. **Peeking doesn't inflate error rates *mathematically*, but a bad prior can systematically bias your conclusions regardless of peeking.** The prior *must* be justified based on genuine domain knowledge or historical data, not chosen to get desired results quickly via peeking.
  2.  **The Threshold:** What BF is "big enough"? `BF > 3`? `>10`? `>20`? This is analogous to choosing `alpha=0.05` vs. `0.01`. While the BF interpretation has standard guidelines (e.g., `>3` = "moderate evidence", `>10` = "strong"), the choice is still subjective.
      *   **Peeking Interaction:** If you peek constantly and keep lowering your BF threshold ("Oh, `BF>5` is good enough *now*") because you want to stop, you *are* reintroducing a form of researcher degrees of freedom. **The threshold must be pre-specified and adhered to**, just like the frequentist `alpha`.
  3.  **Calibration & Decision Theory:** While the *evidence* (BF) is stopping-rule independent, the *decision* to stop (e.g., "launch the feature") based on that evidence needs careful consideration. Frequentist methods often embed error control *within* the decision rule. Bayesian decisions require integrating the posterior with a **loss function** (cost of wrong decisions). Peeking frequently might lead to premature decisions driven by short-term noise, even with a good BF, if the cost of a false launch is high. The BF tells you the evidence; you still need sound judgment to act on it, especially when stopping early.

  **IV. The Verdict: Bayes Wins... Under Strict Conditions**

  **Bayesian methods with sequential updating (peeking) are fundamentally valid and do not suffer from the *mathematical* false positive rate inflation that plagues naive peeking in frequentist testing.** The Bayesian argument that inference depends only on the observed data and the prior, not the stopping rule, is correct and powerful for dynamic environments like A/B testing.

  **However, this victory is not unconditional:**

  1.  **You must specify a justified prior.** This cannot be an afterthought. It requires careful consideration of relevant historical data and domain expertise. A default or uninformative prior is often a safe starting point but may require more data.
  2.  **You must pre-specify and adhere to a decision threshold (BF level).** Constantly lowering the bar to stop early reintroduces bias.
  3.  **You must understand that the BF quantifies evidence strength, not guaranteed correctness.** Decisions still require context and consideration of costs (loss functions).

  **Therefore, the final, committed verdict is:**

  **Bayesian sequential analysis (allowing peeking) is superior to frequentist methods *for the specific problem of peeking-induced false positive inflation*, BUT only if implemented rigorously with a well-justified prior and a pre-specified, adhered-to decision threshold based on the Bayes Factor. If you cannot define a reasonable prior or if you lack the discipline to stick to a pre-defined BF stopping rule, then the frequentist with a strictly enforced fixed sample size design has the stronger point regarding error control.**

  **Recommendation for your team:** **Switch to Bayesian A/B testing with sequential monitoring.** Invest the time to:
  *   Build a process for defining priors using historical test data and domain knowledge.
  *   Pre-specify BF thresholds for decisions (e.g., "Stop and implement if BF > 10 favoring Variant B; stop for no difference if BF > 10 favoring Null; otherwise continue").
  *   Use dashboards that track the posterior distribution or BF in real-time.
  *   Enforce adherence to the pre-specified stopping rules.

  This leverages the flexibility of Bayesian methods to allow intelligent peeking and early stopping *without* sacrificing statistical integrity, provided the foundational elements (prior, threshold discipline) are solidly in place.
