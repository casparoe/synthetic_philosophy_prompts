  okay this has been bugging me for weeks. me and my friend Devon are both on debate and we keep going back and forth about our odds of beating the #1 team at the state tournament. we've shown each other literally all the same scouting stats and practice scores, and we both genuinely trust the other person's judgment, like neither of us thinks the other one is just being stubborn or bsing to win the argument. every time he updates his percentage after hearing mine, i update mine after hearing his, we've swapped numbers back and forth like ten seperate times over the groupchat and it still wont settle, we just end up stuck about 5 points apart no matter how many rounds of that we do. i feel like if two people are both being reasonable and working off the exact same info, a gap like that should close eventually instead of just sitting there forever. so is one of us being secretly irrational, or is there an actual reason the disagreement can survive all that back and forth, bc "people just see things differently" feels like a cop-out answer.
