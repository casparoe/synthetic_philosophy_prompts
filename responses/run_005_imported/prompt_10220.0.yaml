answer: |-
  Your friend's argument relies on a significant misunderstanding of both Karl Popper's final position and the nature of modern evolutionary biology. While Popper *initially* expressed concerns about the tautological nature of "survival of the fittest," **he explicitly retracted this view** after engaging with evolutionary biologists and examining the evidence more deeply.

  Here's a breakdown of why the argument doesn't hold:

  1.  **Popper's Retraction:** In his later writings (e.g., "Natural Selection and the Emergence of Mind," 1977), Popper explicitly stated:
      > *"I have changed my mind about the testability and logical status of the theory of natural selection; and I am glad to have an opportunity to make a recantation."*
      He acknowledged that natural selection, as understood within the framework of population genetics and the modern synthesis, **is indeed falsifiable and testable.** He recognized that specific predictions about changes in gene frequencies in populations under specific selective pressures could be tested and potentially falsified.

  2.  **Misunderstanding the "Tautology" Claim:** The initial concern stemmed from phrasing like "survival of the fittest." If "fitness" is *defined solely* as reproductive success, then "the fittest survive" becomes "those who survive, survive" – a tautology. However, evolutionary biologists **do not define fitness this way in practice.**
      *   **Fitness is grounded in measurable traits:** Fitness differences arise from specific, measurable heritable traits (e.g., beak depth, camouflage color, enzyme efficiency, disease resistance) interacting with a specific environment. Fitness is a *consequence* of these traits, not a circular definition.
      *   **Predictions are specific:** Evolutionary theory doesn't just say "the fit survive." It makes specific predictions like:
          *   *If* a new predator relies on sight, *then* camouflaged prey variants *will* increase in frequency over generations.
          *   *If* an antibiotic is constantly present, *then* bacterial strains with specific resistance genes *will* become dominant, *and* the frequency of those resistance genes *will* rise measurably.
          *   *If* a trait imposes a significant survival cost without benefit in a stable environment, *then* mutations disrupting that trait *should* increase in frequency.
      *   **Falsifiability:** These predictions are testable and falsifiable. If camouflaged moths *decrease* when predators are present, if resistance genes *don't* spread under antibiotic pressure, or if costly traits *persist* without any compensatory benefit emerging, the specific evolutionary hypothesis (or the understanding of the selective pressures) is falsified. **Countless such tests have been conducted, both in the lab and field.**

  3.  **Evolutionary Biology is Falsifiable in Many Ways:** Natural selection is just *one* mechanism of evolution. The entire framework is testable through multiple, independent lines of evidence:
      *   **Fossil Record:** Predicts transitional forms, sequences, and timelines. Finding rabbit fossils in the Precambrian would falsify the core timeline.
      *   **Comparative Anatomy & Embryology:** Predicts homologous structures and developmental pathways reflecting common descent. Finding fundamentally different body plans inexplicably appearing without precursors would be problematic.
      *   **Biogeography:** Predicts distributions based on continental drift and evolutionary history. Finding identical endemic species on continents that separated long before the species evolved would falsify predictions.
      *   **Molecular Biology & Genetics:** Predicts universal genetic code, shared metabolic pathways, nested hierarchical similarities in DNA/RNA/protein sequences reflecting phylogeny, the ability to trace mutations and gene flow. Finding a fundamental incompatibility in genetic codes across life or DNA sequences that contradict established phylogenies based on other evidence would be highly falsifying.
      *   **Direct Observation:** Evolution (including natural selection) is directly observed in real-time in microbes (antibiotic resistance), insects (pesticide resistance), plants, and larger animals (e.g., Darwin's finches, Italian wall lizards, guppies). We can manipulate environments and measure genetic changes.

  4.  **The "Storytelling" Charge - A Misrepresentation:** While developing hypotheses about the *specific* adaptive function of a *particular* trait in the *distant past* can be challenging and relies on inference, it is far from "untestable storytelling":
      *   **Multiple Lines of Evidence:** Biologists use comparative methods, genetic analysis, fossil evidence, biomechanical modeling, and ecological studies to test adaptive hypotheses.
      *   **Predictive Power:** Good adaptive hypotheses make predictions about what we *should* find in related species, in the fossil record, or in genetic comparisons.
      *   **Testability of Mechanisms:** Even if the exact historical scenario is hard to pin down, the *proposed mechanism* (e.g., sexual selection, predator avoidance, thermoregulation) must be biologically plausible and testable in principle or through modern analogs.
      *   **Not All "Just So Stories" Survive:** Hypotheses that don't fit the evidence or make failed predictions *are discarded*. The field self-corrects.

  **Conclusion:**

  Your friend's argument is based on an outdated and retracted criticism by Popper. **Evolutionary biology, and specifically the theory of natural selection as formulated within the modern evolutionary synthesis, is a robust, testable, and falsifiable scientific theory.** It generates specific, testable predictions that have been verified countless times through observation and experiment, while also possessing clear potential falsifiers that have not been encountered. Biologists explaining traits as products of natural selection are engaged in science based on evidence and testable hypotheses, fundamentally different from untestable systems like astrology. Popper himself recognized this upon deeper examination.
