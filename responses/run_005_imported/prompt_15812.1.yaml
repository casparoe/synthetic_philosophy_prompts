  ### Why FDT > EDT > CDT?  
  FDT’s "act as the best version of your decision function" approach crushes Newcomb variants, psychopath dynamics, and commitment games (Hitchhiker/XOR) by respecting logical counterfactuals. EDT’s reliance on correlation works until predictions are visible (transparent boxes) or lesions decouple cause/effect. CDT’s obsession with *only* direct causation implodes when actions signal your type (e.g., pressing the psychopath button) or require pre-commitment (Hitchhiker). Death in Damascus sinks everyone equally—no theory outthinks perfect prediction.  

