answer: |-
  You've hit on a fascinating and historically significant tension in Sidgwick's life! Your supervisor is right – the connection to his ethics is profound, and understanding it resolves what seems like a bizarre inconsistency into a coherent (if ultimately tragic) intellectual quest. Here's the breakdown:

  1.  **The Core Problem in "Methods of Ethics":** Sidgwick's masterpiece meticulously argued that utilitarianism (maximizing happiness) was the most rationally defensible ethical system. However, he hit a fundamental roadblock he couldn't resolve through reason alone: **"The Dualism of Practical Reason."**
      *   **Altruism (Utilitarianism):** Reason demands we act for the greatest good of the greatest number.
      *   **Egoism:** Reason *also* seems to demand we act in our own long-term self-interest.
      *   **The Conflict:** What if my self-interest (e.g., wealth, pleasure, survival) *conflicts* with the greater good? Why should I sacrifice my own happiness? Sidgwick saw no purely *rational* way to prove that altruism *always* trumps egoism. He famously concluded that Ethics was "a chaos" without a resolution to this dualism.

  2.  **Sidgwick's Desperate Hope: The Need for "Paranormal" Sanction:** Sidgwick realized that **only a belief in a divine order or personal survival after death** could potentially resolve this dualism:
      *   **Divine Order:** If a just God existed, they would ensure that virtue (acting for the greater good) was ultimately rewarded, aligning self-interest with altruism in the long run (e.g., in an afterlife).
      *   **Personal Survival:** If consciousness survives death, then the "long-term" for self-interest extends infinitely. A utilitarian calculus incorporating an afterlife *could* show that sacrificing earthly happiness for the greater good leads to greater *eternal* happiness for the individual. Self-interest and altruism could be reconciled.
      *   **The Crisis:** Sidgwick lived in the era of Darwin, scientific materialism, and the Higher Criticism of the Bible. Traditional religious faith, based on revelation and dogma, was crumbling for many intellectuals like him (The "Victorian Crisis of Faith"). He couldn't *believe* on faith alone; he demanded **empirical evidence**.

  3.  **Psychical Research as the Scientific Solution:** This is where the Society for Psychical Research (SPR) comes in. Sidgwick didn't approach it as a credulous believer chasing spooks, but as a **desperately hopeful empiricist seeking crucial evidence**.
      *   **The Mission:** The SPR was founded (by Sidgwick, Myers, Gurney, etc.) explicitly to apply the *most rigorous scientific methods available* to investigate phenomena that *might* provide evidence for survival after death (telepathy, clairvoyance, apparitions, mediumship).
      *   **The Stakes:** Success would provide the **empirical foundation** needed to resolve the Dualism of Practical Reason. It would offer a *scientific*, rather than a *faith-based*, justification for the primacy of altruistic ethics. It would "sanction" utilitarianism.
      *   **The Method:** This is key. Sidgwick brought his philosophical rigor *to* psychical research. The SPR's early work was characterized by:
          *   **Skeptical Scrutiny:** Attempting to expose fraud relentlessly.
          *   **Careful Documentation:** Meticulously collecting and cross-verifying testimonies (e.g., the Census of Hallucinations).
          *   **Experimental Design:** Trying to devise controlled tests for telepathy, etc.
          *   **Cautious Interpretation:** They were often *more* skeptical than popular spiritualists. Sidgwick demanded extraordinarily high standards of proof.

  4.  **Was it Irrational? A Nuanced View:**
      *   **Not *Inherently* Irrational Then:** In the context of the 1880s-90s, the boundaries of science were less fixed. Psychology was nascent. The nature of consciousness, electricity, magnetism, radiation – all were mysterious. Investigating reports of unusual mental phenomena wasn't *obviously* pseudoscience in the way it is *today*, where we have robust frameworks explaining perception, memory, and fraud mechanisms. Sidgwick was applying the best scientific standards *of his time* to an open question.
      *   **Motivated by Philosophy, Not Superstition:** His driving force wasn't a love of the spooky, but the profound philosophical need to find a rational basis for ethics. It was an extension of his ethical project, not a departure from it.
      *   **Ultimate Failure and Personal Tragedy:** Sidgwick never found the conclusive proof he sought. While he thought some phenomena (like telepathy) were *suggestive* and warranted further study, the evidence for survival remained elusive and fraught with fraud. He died deeply pessimistic, feeling his life's philosophical work rested on unstable ground. This is the core tragedy – his rigorous ethics demanded a foundation he couldn't rationally secure, and his rigorous scientific investigation couldn't provide it.

  5.  **Does it Undercut His Ethics?**
      *   **No, It *Contextualizes* and *Deepens* It.** Understanding his psychical research doesn't invalidate the *arguments* in "Methods of Ethics." The careful reasoning about utilitarianism, intuitionism, and egoism stands on its own. Instead, it shows:
          *   **The Profound Stakes:** How deeply Sidgwick felt the weight of the Dualism and the need for a solution.
          *   **His Intellectual Honesty:** He didn't paper over the problem; he confronted it head-on, even pursuing a risky, potentially discrediting line of inquiry because he felt it was necessary.
          *   **The Limits of Secular Ethics:** Sidgwick exposed a fundamental tension in purely rational, secular ethics that remains relevant. How *do* we justify ultimate self-sacrifice based *only* on reason and earthly consequences? His failed quest highlights this enduring challenge.

  **In Conclusion:**

  Sidgwick wasn't "clocking out" of rigor on weekends. **His psychical research was the direct, rigorous, and ultimately heartbreaking *application* of his philosophical rigor to the most critical problem his ethics uncovered: the need for a rational sanction for morality.** He wasn't being irrational; he was trying desperately to *extend* rationality into a domain he believed *had* to be explored to complete his ethical system. The tragedy is that the evidence he sought with such meticulous care never materialized to his satisfaction. Far from undermining his ethics, understanding this connection reveals the extraordinary depth of his commitment and the profound existential challenge he grappled with. It makes him a much more complex and human figure than the image of the detached logician.

  **For your EPQ:** This connection is GOLD. You can explore how the Dualism of Practical Reason drove his SPR work, analyze the *methods* of the early SPR as reflecting Sidgwick's philosophical rigor, and discuss the tragic irony of his quest. It perfectly illustrates the "secret weird side" being intrinsically linked to his core philosophical project. Good luck!
