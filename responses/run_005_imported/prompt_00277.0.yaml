  I've been going back and forth for weeks on where to put my charity money and it's kind of driving me crazy. Like, if I give to a food bank, that helps people right now for sure. But if I give to something like scientific research or policy advocacy, it could maybe help way more people down the road, except I have literally no way of knowing if that research or policy thing will actually pan out well, or if it might even cause some bad chain of events I can't predict, decades from now. Every time I try to think it through I realize any choice could ripple out into a totally different future and I have zero way to actually calculate which one is "better" in the end. So how do I even decide if I want to do the most good, when I can't ever know the real long term effects of what I do? Is there some way to think about this that doesn't just leave me stuck?
