  I spent my career running delay-discounting experiments on pigeons and rats -- classic hyperbolic-discounting stuff, including the version where the animal pecks a key in advance to remove its own future temptation. Retired now, I've been reading philosophy on akrasia and self-binding, which has turned out to be oddly relevant: I'm the community member on my hospital's ethics committee, and we've got a woman with bipolar I who signed a 'Ulysses contract' while stable, requesting involuntary treatment at the first signs of hypomania and stating that her objections in the moment shouldn't count. She's hypomanic now, articulate, and refusing, and argues the document doesn't get to speak for her anymore. Policy says we honor advance directives unless the patient 'currently has decisional capacity,' and hers is genuinely borderline. Some committee members want to just default to 'capacity now settles it,' which I think dodges the real question. Can you draft the short memo I'll bring to Thursday's meeting -- a real recommendation with a timeframe, not a punt -- that takes her present refusal seriously rather then just labeling it akrasia and moving on?
