  Here’s a concise, actionable memo for your ethics committee meeting, grounded in your expertise and designed to address the core ethical tension:

  ---

  **MEMORANDUM**  
  **To:** Ethics Committee Members  
  **From:** [Your Name], Community Member  
  **Date:** [Date of Meeting]  
  **Re:** Ulysses Contract Case – Recommendation for Action  

  **Background:** Patient X, diagnosed with bipolar I disorder, executed an advance directive (Ulysses contract) while euthymic, specifically requesting involuntary treatment upon early signs of hypomania and explicitly rejecting the validity of future objections during an episode. She is now hypomanic, articulate, and refuses treatment, contesting the directive’s authority. Policy requires honoring advance directives unless the patient "currently has decisional capacity." Her capacity assessment is clinically borderline.  

  **Key Ethical Conflict:**  
  1. **Past Autonomy vs. Present Expression:** The directive embodies Patient X’s deeply considered, values-based choice to prioritize her long-term well-being over momentary desires during illness—a rational precommitment strategy mirroring "self-binding" behavior.  
  2. **Capacity Ambiguity:** Borderline capacity assessments in hypomania often reflect *partial* impairment, where cognitive abilities (e.g., articulation) mask illness-driven distortions in risk perception, insight, and identity alignment. Her rejection of the directive may stem from anosognosia or grandiosity—core symptoms of mania—not a reasoned shift in values.  
  3. **Akrasia Misapplication:** Labeling this "akrasia" (weakness of will) mischaracterizes the situation. Akrasia implies a *competent* choice against one’s better judgment. Hypomania may render her *incompetent* to evaluate the very judgment she precommitted to uphold.  

  **Recommendation:**  
  **Honor the advance directive for 72 hours to initiate stabilization treatment, while mandating an urgent, specialized capacity reassessment focused on illness-specific insight.**  

  **Rationale & Timeframe:**  
  1. **Immediate Action (0–24 hrs):** Initiate treatment per directive.  
     - *Why?* The directive exists to override precisely this clinical scenario: when symptoms distort judgment. Delaying treatment risks rapid deterioration, increasing long-term harm and undermining the contract’s purpose. Her present refusal is a *predicted symptom*, not emergent autonomy.  
  2. **Reassessment (Within 48 hrs):** Conduct a capacity evaluation focused *solely* on her ability to:  
     - **Acknowledge her current hypomanic state** (not just "mood changes").  
     - **Understand how mania historically alters her values/choices** (e.g., rejecting treatment she later valued).  
     - **Articulate coherent reasons for *now* invalidating the directive** beyond preference (e.g., new values, factual errors in the document).  
     *Involve her prior treating psychiatrist if possible.*  
  3. **Decision Point (72 hrs):**  
     - If reassessment confirms **incapacity** (inability to grasp/manipulate illness-specific consequences): Continue directive.  
     - If reassessment confirms **capacity** (rational, insight-based rejection of directive): Suspend directive and engage in supported decision-making.  
     - If **still borderline**: Default to directive; hypomania’s inherent volatility warrants prioritizing prior competent judgment.  

  **Why This Approach?**  
  - **Avoids "Presentism":** Rejects the fallacy that current capacity (if borderline) automatically negates prior autonomy.  
  - **Takes Refusal Seriously:** Requires probing whether her objection reflects authentic agency or pathological denial.  
  - **Aligns with Neurobehavioral Evidence:** Affirms that precommitments in bipolar disorder protect identity continuity when insight fragments.  
  - **Practical & Dignity-Preserving:** Limits coercion window while gathering data to validate/invalidate her objection.  

  **Requested Committee Action:** Approve this 72-hour pathway to resolve ambiguity *without* defaulting to present preference.  

  ---  

  **Key Strengths for Your Advocacy:**  
  1. **Leverages Your Expertise:** Framing the directive as a "precommitment strategy" (familiar from your research) grounds it in empirical behavioral science, not just ethics.  
  2. **Confronts Capacity Ambiguity:** Directly addresses the committee’s discomfort by demanding a *focused* reassessment, not a rubber-stamp.  
  3. **Time-Bound Clarity:** Forces a decision point, avoiding indefinite delay.  
  4. **Centers the Patient’s Narrative:** Uses her *own* documented rationale for the directive (e.g., "I become self-destructive when hypomanic") as the benchmark for assessing her current insight.  

  This memo shifts the debate from *"Does she have capacity?"* (often unanswerable in borderline cases) to *"Does her objection reflect competent agency or the illness she sought to contain?"*—honoring both her past and present self without privileging the ephemeral state of mania.
