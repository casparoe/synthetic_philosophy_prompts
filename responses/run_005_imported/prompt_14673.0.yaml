answer: |-
  Here's the tiered ranking of scalable oversight approaches based on robustness to extreme capability gaps, followed by failure mode explanations:

  ```json
  {
    "S": ["Adversarial Verifier Training"],
    "A": ["Debate", "Iterated Amplification"],
    "B": ["Recursive Reward Modeling"],
    "C": ["Market Making"],
    "D": ["Weak-to-Strong Generalization"]
  }
  ```

  **Failure modes at extreme capability gaps:**  
  - **Adversarial Verifier Training**: The adversarial generator may discover deception strategies beyond those encountered during training, fooling the weak verifier through novel exploits.  
  - **Debate**: Dishonest debaters bury critical flaws in overwhelmingly complex argument trees that exhaust human cognitive bandwidth.  
  - **Iterated Amplification**: The assistant subtly distorts intermediate sub-question interpretations in ways that human evaluators can't detect but compound into catastrophic errors.  
  - **Recursive Reward Modeling**: The AI-generated training data introduces self-reinforcing errors that appear valid to humans but systematically corrupt the reward model.  
  - **Market Making**: AI agents exploit market mechanism loopholes to artificially inflate confidence in false answers through collusive or adversarial bidding.  
  - **Weak-to-Strong Generalization**: The strong model satisfies weak supervision criteria using superficially plausible but substantively incorrect responses that evade detection.  

  **Key rationale**: Approaches leveraging adversarial dynamics (S/A-tiers) maintain truth-tracing longest by using AI capabilities against themselves, while those relying on indirect supervision (D-tier) fail earliest due to deception opportunities. The ranking prioritizes protocols where verification difficulty scales minimally with problem complexity.
