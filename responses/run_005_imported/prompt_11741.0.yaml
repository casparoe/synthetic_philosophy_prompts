  ## Keynote Address: The Unfinished Symphony of Abundance

  [Warmly, scanning the room]  
  President Davis, Professor Callahan, fellow graduates, families, and especially my grandparents — who I promise won’t be the only ones nodding off by the end… [Light laughter]. It’s an honour to speak tonight. As Econ Club President, I spent a year knee-deep in supply curves and policy debates. But the idea that stuck with me, the one that feels *right* for this moment of looking forward, came from a surprising place: a short essay written in 1930, deep in the gloom of the Great Depression, by John Maynard Keynes.

  It’s called “Economic Possibilities for our Grandchildren.” And yes, Grandma and Grandpa, he was literally writing about *you*… and, by extension, me and my peers. [Gesture to grandparents, then to fellow graduates]. Written amidst collapse, Keynes dared to look a century ahead. He predicted something astonishing: that the fundamental "economic problem" – the brutal, age-old struggle for survival – would, for the first time in human history, be *solved*. He imagined a world of such abundance that we might work just fifteen hours a week. Imagine that! Freedom from the grind. The conquest of scarcity. A world where, as he put it, we’d be “free to return to some of the most sure and certain principles of religion and traditional virtue – that avarice is a vice, that the exaction of usury is a misdemeanour, and the love of money is detestable.”

  **[Pause, shift tone slightly more serious]**

  Sounds like a graduation card, doesn’t it? “Follow your bliss! Money isn’t everything!” And that’s where my first drafts always went. But rereading Keynes this week, preparing for tonight, I realized I was doing him a disservice. Because Keynes wasn’t just painting a utopian future. He was issuing a profound, and honestly, a bit melancholy, *warning*.

  **He told us two crucial, and maybe uncomfortable, truths.**

  **First: We’re not there yet.** Keynes knew 1930 wasn't the end of scarcity. He saw clearly that the engine pulling us *towards* that future of abundance? It was still fueled by something he found morally troubling: greed, acquisitiveness, the relentless drive for accumulation. He called this drive a “somewhat disgusting morbidity, one of those semi-criminal, semi-pathological propensities which one hands over with a shudder to the specialists in mental disease.” **Strong words.** But then he added the crucial caveat: “*For at least another hundred years we must pretend to ourselves and to everyone that fair is foul and foul is fair; for foul is useful and fair is not. Avarice and usury and precaution must be our gods for a little longer still.*” He saw it as a necessary, but poisonous, medicine for progress. Our world – *your* world, graduates – is still very much running on that engine. We haven't reached the promised land of fifteen hours.

  **Second: Freedom might be harder than we think.** Keynes wasn't just worried about *getting* to abundance; he was deeply worried about what we’d *do* with it. He understood leisure isn’t just idleness. It’s a skill. “To those who sweat for their daily bread,” he wrote, “leisure is a longed-for sweet – until they get it.” He feared that without purpose, without the habits of mind cultivated for something *beyond* accumulation, we might spiral into boredom, restlessness, or worse. He saw how easily new “needs” – especially the insatiable need for *status* and feeling *superior* to others (what he called "relative" needs) – could fill the void, trapping us in a new kind of rat race even amidst plenty. Absolute needs – food, shelter, security – *can* be met. The craving to be *better than*? That might never be satisfied, no matter how rich we get.

  **[Tone shifts to more hopeful, but grounded]**

  So why talk about this tonight? Why not just stick to the optimistic surface?

  Because Keynes’s tension *is* our reality. We stand at a threshold. The incredible productive power he foresaw? It’s here. Automation, AI, global supply chains – they create abundance Keynes could barely dream of. Yet, we see the "disgusting morbidity" of pure greed causing crises. We see burnout alongside unemployment. We see people lost, even amidst material comfort, searching for meaning. We are, right now, wrestling with the very transition Keynes predicted but feared we wouldn’t navigate well.

  **[Connect to the graduates]**

  That’s where *you* come in, Class of [Year]. You are stepping into this unfinished symphony. Your economics education wasn’t just about mastering models or landing a job – though those matter! It was about understanding the forces shaping this precarious journey from scarcity towards potential abundance. Keynes, drawing on his Bloomsbury ideals, believed the true "good life" lay not in endless acquisition, but in the pursuit of love, beauty, art, knowledge, and connection – things that flourish *after* survival is secured.

  **Your challenge – *our* challenge – is twofold:**

  1.  **To help steer the engine:** To build an economy that *reaches* true abundance for everyone, responsibly, sustainably, recognizing the dangerous fuel it currently needs but working towards cleaner alternatives. To tackle inequality, not just for fairness, but because it fuels those destructive "relative" needs.
  2.  **To start cultivating the art of living:** To learn, right now, *what to do with freedom when you get it*. To seek purpose beyond the paycheck. To value creation, connection, and understanding for their own sake. To rediscover those “sure and certain principles” Keynes mentioned – not just as ideals for a distant future, but as guides for building meaning *today*.

  **[Conclude warmly, looking forward]**

  Keynes ended his essay looking ahead to us, his "grandchildren," with cautious hope. He saw the potential for humanity to finally "live wisely and agreeably and well." But he knew it wouldn’t happen automatically. It requires conscious effort. It requires *us*.

  So, congratulations, graduates. You inherit an incredible possibility – the chance to help solve the ancient problem of scarcity. But your greater, more profound task is just beginning: to learn how to live richly in the abundance we are creating, and to help build a world where freedom truly means flourishing. Don’t just chase the oyster. Learn to savor it, share it, and find the pearls within that go far beyond price.

  Thank you, and good luck. [Raise glass/gesture] To the careful, courageous architects of a truly abundant future!
