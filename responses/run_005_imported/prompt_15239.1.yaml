answer: |-
  Here’s a toast that threads the needle: rigorous enough for philosophers, emotionally resonant for non-academics, and anchored in her life’s work. It runs about 4.5 minutes when spoken warmly:

  ---

  **(Raise glass slightly, warm smile)**  
  "Thirty-five years. Thirty-five years of arguments about pigeons, pain, and whether any of us actually *do* anything.  
  **(Light laughter, glance toward advisor)**  
  For those of us who took [Advisor's Name]’s seminars, we remember the pigeon. Trained to peck at *red*. Not crimson, not scarlet, not RGB #FF0000 – just *red*. And when it pecked reliably at any shade under that big, messy banner of ‘red’… that’s when [Name] would lean in, eyes gleaming: *‘See? The pigeon gets it. The determinable is doing the work.’*  

  **(Shift tone slightly more serious, but keep it accessible)**  
  For the non-philosophers here – her long-suffering family, her book club pals who’ve endured decades of her muttering ‘causal exclusion’ over the turkey – here’s the gist of her life’s battle: It’s about whether things like *ideas*, *choices*, or *gratitude*… are real causes in the world. Or just noise. Just exhaust fumes from the physical engine. Epiphenomena.  
  **(Brief pause, make eye contact with non-academics)**  
  The worry was: If every thought is just neurons firing, and neurons are just physics… then how can *her* advice to *me* – her fierce belief in my work – actually *cause* me to change my career? Isn’t it all just particles bumping?  

  **(Lean into her solution, use simple metaphor)**  
  [Name]’s answer, forged over decades, was **proportionality**. It’s the pigeon principle. Sure, there’s a specific shade of paint on the target, a specific neural pathway firing in the bird’s brain. But the pigeon isn’t reacting to *that exact wavelength* or *that exact synapse*. It’s reacting to *redness*. The cause that truly *mattered*, that was *proportionate* to the effect, wasn’t buried in the microscopic details. It was right there, at the level of the determinable: **Red. Means. Peck.**  

  **(Connect directly to her impact)**  
  [Name], your entire career argued that higher-level properties – messy, multiply realizable things like *intentions*, *mentorship*, and *belief in a student* – aren’t just shadows. They are **proportionate causes**. They carve the world at its joints. They are why that pigeon pecked. And they are why *I*… am standing here, doing the work I do, shaped fundamentally by *your* belief, *your* arguments, *your* stubborn refusal to let the mental be screened off.  

  **(Personal, heartfelt turn)**  
  You didn’t just teach me philosophy. You argued, fiercely and precisely, for the reality of the very connection we’re celebrating tonight: the causal power of a mentor’s influence. You proved, in the most technical terms imaginable, that your guidance wasn’t epiphenomenal noise in my neural circuitry. It was the *red* that made the pigeon peck. It was the *cause* that mattered. My career, my choices, this very moment of gratitude… they are *effects* proportionate to *your* mental properties. Your work wasn’t just *about* mental causation; it *was* mental causation in action.  

  **(Raise glass fully, warm and decisive)**  
  So, to [Advisor's Name]: For teaching the pigeon – and all of us – that **red matters**. For proving, beyond any causal exclusion, that a great mentor’s mind changes the world. For thirty-five years of showing us that the higher-level story *is* the real story. May your retirement be filled with causes as rich, meaningful, and proportionate as the ones you championed.  
  **(Look directly at her)**  
  To [Name]!"

  ---

  **Why this works:**

  1.  **The Pigeon Anchors Everything:** It’s her memorable teaching tool. Non-academics get a concrete, slightly funny image. Philosophers instantly recognize the Yablo/proportionality argument. It makes the abstract *visible*.
  2.  **Explains the Stakes (Simply):** Clearly frames the problem ("Are ideas/gratitude real causes or just noise?") and her solution ("Proportionality = The pigeon pecks at RED, not the exact shade") in terms non-philosophers grasp. Uses "exhaust fumes" and "noise" for epiphenomenalism.
  3.  **Earns the "Changed My Life" Claim:** Explicitly ties her *technical work* (proving mental properties are proportionate causes) to the *personal impact* (her mentorship causing your path). It doesn't just *say* she changed your life; it uses *her own framework* to argue *why* that change is real and causally potent, not epiphenomenal. "It was the *red* that made the pigeon peck. It was the *cause* that mattered."
  4.  **Respects the Rigor:** Uses precise terminology ("determinable," "proportionate cause," "screened off," "multiple realizability") in context, satisfying the academics. The core argument about proportionality causing real effects is sound within her framework.
  5.  **Warmth & Humor:** Starts with light humor (pigeons, pain, Thanksgiving muttering). The pigeon story is inherently a bit charming. The personal section is heartfelt. The final toast line ("red matters") is simple, profound, and echoes the warmth.
  6.  **Structure & Pacing:** Opens with a hook, explains the problem and her solution simply, connects it directly to her impact, personal reflection, then the uplifting toast. Flows naturally for 5 minutes.
  7.  **The Final Line:** "For teaching the pigeon – and all of us – that **red matters**." It's the perfect blend: a nod to her technical work ("red" as determinable), a profound statement about meaning, and beautifully simple for everyone. "May your retirement be filled with causes as rich, meaningful, and proportionate..." directly echoes her life's theme.

  **Delivery Tip:** When you get to "Red. Means. Peck." and "It was the *red* that made the pigeon peck," lean into it slightly. Let the emphasis land. That's the core conceptual link between her work and your gratitude. Smile warmly at her family during the "non-philosophers" explanation. Make eye contact with *her* during the final lines.

  This toast honors her intellect, her passion, her impact, and the very possibility of the gratitude filling the room – all using the tools she spent her career sharpening. Break a leg! She’ll love it.
