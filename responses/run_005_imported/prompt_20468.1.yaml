prompt: |-
  I'm about two-thirds through a generation-ship novel and I've hit a scene where I don't just need the right vibe, I need the actual document a character would produce. Setup: my ship is currently 60 years into a 200-year crossing, carrying about 6,000 colonists who live pretty well -- decent private space, real surplus in food and power, enough slack that people can take up hobbies and learn things that aren't strictly useful. The chief engineer has just told the Colony Council that if they eat into the reserve margins that have sat untouched since launch, the ship could support growth up to somewhere around 25,000 colonists by arrival, mostly through higher birth allowances plus reviving a lot more of the frozen embryo bank than originally planned. The catch: everyone's living space, food surplus, and "discretionary" allowance would drop close to the floor the ship's charter certifies as a life worth living -- the charter calls it the Founders' Floor. Nobody would be miserable exactly, just a lot more cramped and threadbare than now.

  One councillor is pushing hard for the expansion, using language she clearly picked up from some pop-philosophy book, about how a population that's big enough and just-barely-flourishing-enough beats a small thriving one on the numbers, and that the charter's own "worth living" floor commits the ship to exactly that trade whether the council likes it or not. Another councillor keeps pointing out that most of the additional people in question don't exist yet under any version of the plan, and wouldn't even be the same specific people depending on which version the council picks, so its not really clear anyone is being shortchanged if the council just says no.

  My protagonist, Anke, is the elected Continuity Officer -- basically the person whose actual job is to write these calls up properly instead of everyone just going with their gut -- and the council votes at the solstice session in three weeks. Could you draft the memo she'd submit: recommendation up front, reasoning after, like a real internal document rather than an essay? I need it to land on something concrete -- approve the expansion, reject it, or approve some capped or phased version, ideally with an actual number or threshold attached -- and I need it to take the "more lives worth living is just more good" argument seriously rather than wave it off, exactly as seriously as it takes whatever's wrong with treating "worth living" as the only bar that matters. My writing group's note last time was that this needs to read like a smart, well-researched layperson wrote it under deadline, not a philosophy journal article -- but they'll absolutely notice if the reasoning underneath is hollow, so please don't dumb down the substance, just the register.
reasoning: |-
  Okay, the user is writing a generation-ship novel and needs a memo from their protagonist, Anke, the Continuity Officer. They're stuck on a pivotal scene where the Colony Council debates whether to expand the population from 6,000 to 25,000 by arrival, which would lower living standards to the "Founders' Floor" minimum. The memo needs to resolve the ethical tension between maximizing lives worth living versus preserving current quality of life. 

  Hmm, the user’s real struggle is making bureaucratic fiction feel authentic while wrestling with utilitarian ethics. They’ve already flagged key nuances: the "pop-philosophy" framing, the non-identity problem (future people aren’t fixed), and the need for a concrete recommendation that doesn’t dodge the math. Smart—they’ve done their homework. 

  First, gotta nail the document’s voice. Anke isn’t a philosopher; she’s a procedural officer synthesizing arguments into policy. So: blunt subject line, recommendation-first structure, numbered reasoning. Channel government memo cadence—short sentences, colons for lists, zero flourish. But can’t oversimplify the ethics; the council’s debate hinges on whether "more lives above Floor" automatically trumps all else. 

  Key angles to address: 
  - **The numbers trap**: If 25k lives barely above Floor > 8k thriving, why stop there? Couldn’t they squeeze to 30k? Need to expose that slippery slope. 
  - **The non-identity dodge**: "No one’s harmed" is technically true but feels cheap. Better to argue future colonists inherit current decisions—including cultural erosion risks. 
  - **Founders’ intent**: Charter’s "worth living" is a floor, not an optimization target. Probably cited during launch crises; misapplying it now reeks of desperation. 

  ...Wait, the embryo bank is crucial. Reviving more embryos means distinct future humans. So rejecting expansion literally chooses which potential people exist. That’s ethically messier than just birth rates. Should emphasize that in the memo’s "threshold" justification—phase growth only if current infrastructure supports it without dipping into reserves yet. Buys time for innovation. 

  User’s writing group warned against "philosophy journal" tone. Right. So: 
  - Replace "utility calculus" with "headcount math." 
  - Swap "non-identity problem" for "future colonists aren’t waiting in line somewhere." 
  - Use ship jargon ("reserve margins," "discretionary allowance") like a staffer would. 

  Final rec: Cap growth at 12k. Why? 
  - Nods to expansionists by doubling population (symbolic win). 
  - Uses slack, not reserves (safe). 
  - Leaves 60 years to innovate before revisiting. 
  And the killer line: "The Floor is a guarantee, not a goal." Mic drop for Anke’s pragmatism.
answer: |-
  Here's a draft of Anke's Continuity Officer memo, designed as a concrete recommendation with layered reasoning that engages the ethical argument seriously while maintaining a practical, internal-document tone:

  ---

  **MEMORANDUM**  
  **To:** Colony Council, Generation Ship *[Ship Name]*  
  **From:** Anke Varga, Continuity Officer  
  **Subject:** Recommendation Regarding Proposed Population Expansion  
  **Date:** [Solstice minus 3 weeks]  
  **Classification:** COUNCIL EYES ONLY - PRE-DECISIONAL  

  **1. RECOMMENDATION:**  
  Approve a **capped population expansion target of 12,000 colonists by Arrival (T+200Y)**, utilizing **current operational surplus only**. **Reject** the proposal to utilize reserve margins or significantly increase embryo revival rates at this time. Growth beyond 12,000 should be contingent on demonstrable efficiency gains or resource breakthroughs achieved *before* T+100Y.

  **2. EXECUTIVE SUMMARY:**  
  Chief Engineer Mikkel's analysis confirms the *theoretical* capacity to support ~25,000 colonists at the Founders' Floor (FF) standard. However, utilizing reserve margins to achieve this imposes significant, irreversible reductions in current and future quality of life for marginal long-term gain. While the ethical argument ("more lives worth living = more good") has logical weight, it relies on an incomplete interpretation of the Charter and ignores critical operational and societal risks. A phased approach, prioritizing stability and innovation capacity, better balances ethical obligations to potential future colonists with our duties to the existing community and the mission's ultimate success.

  **3. ANALYSIS & REASONING:**

  *   **A. The Founders' Floor (FF) is a Minimum Guarantee, Not an Optimization Target:**  
      The Charter defines FF as the absolute minimum standard below which life is deemed "not worth living." It is a safeguard against catastrophic failure or unforeseen deprivation, *not* a baseline for planned growth. Deliberately reducing 6,000 colonists from a state of comfort and surplus (well above FF) down to FF levels constitutes a significant, self-imposed hardship. This violates the spirit of stewardship implicit in the Charter, which emphasizes *maintaining and improving* well-being where possible, not regressing to a legal minimum.

  *   **B. The "More Lives" Argument: Valid but Incomplete:**  
      Councillor Elara's point – that maximizing the number of lives above the FF threshold appears ethically compelling – is acknowledged. If the *only* variable was the count of lives above FF, then 25,000 > 8,000 (approx. current trajectory). However, this simplistic calculus ignores crucial factors:
      *   **Quality Matters Beyond the Floor:** FF ensures survival and basic dignity, but it excludes factors critical to long-term colony viability and human flourishing: psychological resilience, innovation capacity, cultural depth, and individual opportunity. Reducing discretionary time, space, and resources to FF levels directly threatens these. A ship full of people *at* FF is far more vulnerable to stress, conflict, or unexpected hardship than one with surplus.
      *   **The Non-Identity "Trap" is Real, But Misleading:** Councillor Jin is correct that the specific individuals created under different plans would be different. Denying existence to potential future people cannot harm *them* (as they wouldn't exist). However, this doesn't absolve the Council of responsibility. **We are choosing the *conditions* into which future colonists, whoever they are, will be born.** Choosing a path guaranteeing they live *only* at FF, when alternatives exist, is a choice for a diminished baseline existence. We owe potential colonists not just life above FF, but the best *reasonable* start we can provide.

  *   **C. Operational Risks of Reserve Margin Depletion:**  
      The reserve margins exist for critical reasons: mitigating unforeseen systems degradation, damage from micro-meteoroid impacts, potential epidemic resource needs, or navigation contingencies. Consuming them for planned growth transforms an emergency buffer into consumed capital. This fundamentally weakens the ship's resilience for the remaining 140 years. Chief Engineer Mikkel confirmed that while *probable* outcomes might be manageable at FF with reserves gone, *low-probability/high-impact* events could then become catastrophic. This is an unacceptable gamble with 6,000+ existing lives.

  *   **D. Societal Impact of Compression:**  
      Reducing personal space by ~60% (based on current avg. vs. FF avg.), eliminating most surplus for hobbies/learning, and tightening resource allocation will create chronic low-grade stress. Historical data from confined environments (pre-FTL habitats, early subs) shows this consistently degrades social cohesion, increases interpersonal conflict, and reduces proactive problem-solving – precisely the traits needed for Arrival and colony building. Our current surplus fosters innovation (e.g., hydroponics refinements, power recycling); losing it stifles the very ingenuity that might *safely* enable larger populations later.

  *   **E. The Innovation Imperative:**  
      We have 140 years of travel remaining. Our current comfort is a resource *in itself* for finding efficiencies. Approving growth to 12,000 using only *existing surplus* (requiring moderate birth allowance adjustments and embryo revival within planned maintenance cycles) achieves significant growth (+100%) without triggering reserve depletion or FF compression. Crucially, **it preserves the slack necessary for innovation.** This allows engineers, botanists, and systems specialists the breathing room to:
      1.  Improve food yield per unit area/energy.
      2.  Develop more efficient recycling or power systems.
      3.  Optimize habitation layouts.
      *Success in these areas could raise the *sustainable* FF+ capacity organically.* Setting a review point at T+100Y allows the Council to reassess based on actual progress, not theoretical models. If significant gains are made, *then* utilizing a portion of reserves or further increasing revival rates for a higher target (e.g., 15,000-18,000) becomes a far safer and more ethical proposition.

  **4. CONCLUSION:**  
  The proposal for rapid expansion to ~25,000 via reserve depletion mistakes theoretical capacity for wise policy and misapplies the ethical principle behind the Founders' Floor. While maximizing lives above FF is a noble goal, it must be balanced against the imperative to maintain resilience, foster well-being beyond bare minimums, and preserve the capacity for innovation. Approving growth to 12,000 using current surplus achieves substantial population increase without compromising core safeguards or triggering a significant reduction in current quality of life. It positions us to potentially support even more colonists *sustainably* in the future through demonstrated progress, fulfilling our ethical duty to both existing and future colonists more responsibly. The Floor is a guarantee; our aspiration should be to build well above it.

  **// Anke Varga, Continuity Officer**  
  **// End Memorandum**

  ---

  **Why this works for your scene:**

  1.  **Concrete Recommendation:** Offers a specific number (12,000) and a clear threshold (T+100Y review, demonstrable gains needed). It's a compromise, but a reasoned one.
  2.  **Engages the Ethics Head-On:** Doesn't dismiss "more lives = more good." Acknowledges its logic (Section 3B) but systematically dismantles its sufficiency by arguing FF is a *minimum*, not a *target*, and that quality/innovation/resilience matter profoundly *beyond* mere survival.
  3.  **Tackles the Non-Identity Issue:** Directly addresses Jin's point (Section 3B), conceding the technical truth but arguing the Council's responsibility is to the *conditions* of life, not just the existence of specific individuals. Uses accessible language ("choosing the conditions").
  4.  **Prioritizes Founders' Intent:** Frames FF correctly as a safeguard (Section 3A), not an optimization goal, appealing to the Charter's spirit of stewardship and improvement.
  5.  **Highlights Practical Risks:** Focuses on tangible dangers: reserve depletion (3C), societal stress from compression (3D), and the stifling of innovation (3E). These are real concerns a Continuity Officer would prioritize.
  6.  **"Smart Layperson" Tone:** Uses clear, concise language. Avoids jargon (e.g., "utility," "aggregate welfare"). Explains concepts like the non-identity point simply. Structure is formal memo style (Subject, Recommendation up front, numbered reasoning). Sentences are generally shorter and more direct than academic prose.
  7.  **Substance Not Dumbed Down:** The underlying reasoning about the limitations of the "more lives" argument, the importance of conditions beyond the floor, the value of slack for innovation, and the risk calculus around reserves is robust and philosophically sound, just presented accessibly.
  8.  **Anke's Voice:** Sounds like a pragmatic, responsible officer synthesizing engineering, ethics, and operational reality. She's not a philosopher but has clearly grappled deeply with the arguments. The conclusion reflects her role: ensuring continuity and responsible stewardship.

  This memo provides a strong foundation for your scene, giving Anke a credible, weighty document to submit, and setting up the Council's debate (and potential vote) with clear stakes and a concrete proposal on the table.
