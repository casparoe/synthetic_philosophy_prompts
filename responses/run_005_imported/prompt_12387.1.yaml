prompt: |-
  I've spent years reading LessWrong and the Alignment Forum, and a reading group I'm part of has recently been working through the "coherence arguments" case for expected utility maximization: the move, laid out most cleanly in Yudkowsky's "Coherent decisions imply consistent utilities," from "an agent that violates axiom X can be money-pumped" to "sufficiently advanced agents will end up satisfying axiom X" — which is supposed to be part of the basic case for expecting advanced AI systems to end up as goal-directed expected-utility-maximizers. The transitivity case has always struck me as close to airtight: if an agent strictly prefers A to B, B to C, and C to A, you can walk it around that cycle charging a small fee at every step, and there's no policy short of simply not having had those preferences in the first place that lets it escape.

  Completeness is the axiom I've never been able to convince myself deserves the same treatment, even though people often write as if an exactly parallel pump is available for it. When I tried to construct one myself — imagine an agent with a preferential gap between A and B and between A− and B, but a strict preference for A over A−, then walk it from A down to B and down again to A− — I noticed that the agent can dodge the whole thing for free just by adopting the policy "never choose, at a later node, an option I strictly disprefer to something I already turned down earlier." That policy never requires the agent to act against any preference it actually has, since by hypothesis it has no strict preference over the gappy pairs at all, and yet it seems to defang the pump completely, with nothing analogous available on the transitivity side. I gather this is close to the point Elliott Thornley presses in a post titled "There are no coherence theorems," where he runs the same kind of objection against both Yudkowsky's framing and a more careful, deliberately "forcing" construction due to the philosopher Johan Gustafsson — though I've never worked out for myself whether the escape route survives contact with Gustafsson's tougher version, or only the easier one.

  What I'd like help with is the mechanism, not a verdict on who wins. Concretely: is the real disanalogy between the two money pumps just the forcing/non-forcing distinction — the transitivity pump never lets the agent decline a trade it doesn't strictly prefer, while the naive completeness pump does — or is something deeper about the difference between indifference and a mere preferential gap (the fact that gaps, unlike indifference, aren't sensitive to small sweetenings) doing the real work of letting a "don't reverse yourself" policy get off the ground at all? And does that same kind of policy, suitably strengthened, actually survive Gustafsson's forcing money pump, or is that the point at which the disanalogy with transitivity finally collapses? I'd rather come away understanding exactly where the load-bearing step is than just be told which side currently has the better of the argument.
reasoning: |-
  Okay, the user has a deep understanding of decision theory, specifically coherence arguments for expected utility maximization. They've spent years reading LessWrong and the Alignment Forum, and their reading group is working through these concepts. The user is stuck on why completeness is treated similarly to transitivity in money pump arguments. They've tried constructing a money pump for completeness but found a policy that seems to evade it: "never choose an option at a later node that I strictly disprefer to something I turned down earlier." They reference Elliott Thornley's post "There are no coherence theorems" and Johan Gustafsson's work. The user wants to understand the mechanism behind why this policy works for completeness but not transitivity, and whether it holds against Gustafsson's forcing money pump.

  First, I need to recall the standard money pump arguments. For transitivity, if an agent prefers A > B, B > C, and C > A, you can trade A for C plus a penny, then C for B plus a penny, then B for A plus a penny, leaving them with A minus three pennies. They end up worse off, and the cycle can continue. The key is that each trade is strictly preferred at that moment, so the agent accepts each step.

  For completeness, the issue is when there's a preferential gap. Say the agent doesn't prefer A over B or vice versa. The naive pump might offer A for B plus a penny. Since the agent doesn't strictly prefer B+ over A, they might accept, ending up with B but paid a penny. Then offer B for A plus a penny. Again, they might accept, ending up with A but having paid a penny net. The problem is that the initial trade from A to B+ isn't strictly preferred, so the agent could refuse it. Thornley's policy exploits this by refusing any trade that isn't strictly preferred, thus avoiding the pump.

  The user's question is whether the disanalogy is due to the forcing vs. non-forcing distinction or something deeper about preferential gaps vs. indifference. Also, they want to know if the "don't reverse yourself" policy works against Gustafsson's forcing pump.

  Gustafsson's forcing pump is designed to close escape routes. For a preferential gap between A and B, he sets up sequential choices. First, choose between A- and A. Since the agent prefers A over A-, they pick A. Then, choose between A and B. Here, since there's a gap, the agent might pick B. Then, choose between B and A-. The agent prefers B over A-, so they pick B. But now they ended up with B when they could have had A. The net loss is moving from A to B without compensation. However, the agent never strictly preferred B over A; they were indifferent or had a gap. The issue is that at the second node, choosing B when A is available leads to a dominated outcome.

  The user's policy of "never choose something strictly dispreferred to a forgone option" might not apply directly here. At the first node, they chose A over A-, so A- is the forgone option. At the second node, choosing B isn't strictly dispreferred to A-? B is preferred over A-, so that doesn't trigger the policy. The policy doesn't prevent choosing B over A because there's no strict dispreference.

  So, in Gustafsson's pump, the agent ends up with B instead of A, which is a loss if they have a strict preference elsewhere, but since there's a gap, maybe they don't mind. But the argument is that ending up with B when they could have stayed with A is a dominated choice. The key is that the sequence of choices leads to a dominated outcome without exploiting indifference.

  The deeper issue is that preferential gaps allow for non-transitive behavior even without strict cycles. Gustafsson's argument shows that violating completeness can lead to being money-pumped in a way that the agent ends up with a worse outcome without compensation. The "don't reverse" policy might not save them because the choices are sequential and each step is rational given the gap, but the overall outcome is suboptimal.

  The user also asks about the role of small sweetenings. With indifference, adding a penny would make the agent prefer one option, but with gaps, sweetening might not break the gap. This allows the policy to refuse trades that aren't strictly beneficial, avoiding the naive pump. But in the forcing pump, the agent isn't offered sweetened options; they're faced with choices where they might pick an option that leads to a dominated outcome.

  In summary, the disanalogy between transitivity and completeness comes from the ability to refuse non-forcing trades in the naive pump. Gustafsson's forcing pump eliminates that escape by presenting choices where the agent, due to the gap, selects options that lead to a dominated result. The "don't reverse" policy doesn't help here because it doesn't account for the sequential nature and the lack of strict dispreferences at each step. The real load-bearing difference is that transitivity violations create strict cycles that force losses, while completeness violations allow for dominated outcomes without strict cycles, but Gustafsson's method shows how such violations still lead to exploitable behavior.
answer: |-
  Your analysis is sharp, and you've pinpointed the core tension in the money-pump argument for completeness. The disanalogy *is* significant, and understanding the mechanism requires dissecting the "forcing" nature of the pumps and the unique properties of preferential gaps compared to indifference. Let's break it down step-by-step, focusing on the load-bearing distinctions and whether Thornley's "don't reverse" policy survives Gustafsson's forcing pump.

  ### 1. The Core Disanalogy: Forcing vs. Non-Forcing Pumps & the Nature of Gaps

  *   **Transitivity Pump (Forcing):**  
      If an agent has `A > B`, `B > C`, and `C > A`, a standard money pump offers sequential trades:
      1.  Start with `A`.
      2.  Offer `C` + `$ε` for `A` → Agent strictly prefers `C+$ε` > `A` (by `C > A`), so it accepts. Now holds `C+$ε`.
      3.  Offer `B` + `$ε` for `C+$ε` → Agent strictly prefers `B+$ε` > `C` (by `B > C`), so it accepts. Now holds `B+$2ε`.
      4.  Offer `A` for `B+$2ε` → Agent strictly prefers `A` > `B` (by `A > B`), so it accepts. Now holds `A`, but paid `$3ε` net.
      *   **Why it's Forcing:** At *every* decision node, the agent strictly prefers accepting the trade over keeping its current option. Refusing *any* trade would violate its strict preference at that moment. A policy like "don't reverse" doesn't help because refusing step 2 (trading `C+$ε` for `B+$ε`) would mean keeping `C+$ε` when it strictly prefers `B+$ε`. The cycle exploits strict preferences that actively *force* acceptance at each step. There's no "free" escape.

  *   **Naive Completeness Pump (Non-Forcing) & Gaps:**  
      Consider an agent with a preferential gap between `A` and `B` (no strict pref `A > B` or `B > A`), but strict `A > A-`. A naive pump might try:
      1.  Start with `A`.
      2.  Offer `B` + `$ε` for `A` → Agent has *no strict preference* `B+$ε > A` (gap!). It might refuse. **This is the critical weakness.** If it refuses, the pump stops. Thornley's policy ("never choose, at a later node, an option I strictly disprefer to something I already turned down") reinforces this refusal. Turning down `B+$ε` means `B+$ε` is now a "forgone option". Later, if offered `A` for `B`, choosing `B` would violate the policy (as `B` is strictly dispreferred to the forgone `B+$ε`). But crucially, *no preference is violated by refusal at step 2*.
      *   **Why it's Non-Forcing & Why Gaps Matter:** The gap means there is *no strict preference* dictating acceptance of the first trade (`B+$ε` for `A`). The agent can refuse without violating any preference it holds. This refusal is costless and stops the pump. **The key property of gaps enabling this is their *insensitivity to small sweetenings*.** Adding `$ε` to `B` doesn't necessarily break the gap and create a strict preference `B+$ε > A`; the agent might still see no decisive reason to trade. This is fundamentally different from indifference. An *indifferent* agent (`A ~ B`) *would* have a strict preference `B+$ε > A` (due to strict preference for more money), forcing acceptance of the first trade and enabling the pump. Gaps lack this sensitivity.

  **Interim Verdict:** Your intuition is correct. The primary disanalogy *is* the forcing/non-forcing distinction driven by the gap's insensitivity to small sweetenings. The naive completeness pump fails because it relies on an initial trade the agent has no strict preference to accept, allowing refusal via Thornley's policy (or simply by recognizing the gap). The transitivity pump has no such weak link.

  ### 2. Gustafsson's Forcing Money Pump: Does the Policy Survive?

  Gustafsson's pump (e.g., in "Money Pumps, Incompleteness, and Uncertainty") directly targets this escape route by designing a sequence that *forces* a dominated outcome without requiring an initial non-preferred trade. Let's analyze it against your agent with a gap between `A` and `B` and strict preference `A > A-`.

  *   **Gustafsson's Pump Setup:**
      1.  **Node 1:** Agent chooses between `A-` and `A`.
          *   **Agent's Choice:** Strictly prefers `A > A-`, so chooses `A`. Outcome so far: `A`. *Forgone option:* `A-`.
      2.  **Node 2:** Agent chooses between `A` (keeping it) and `B`.
          *   **Agent's Choice:** Has a preferential gap between `A` and `B`. There is *no strict preference* dictating choice. It might choose `B`. Outcome so far: `B`. *Forgone option at this node:* `A` (but `A` wasn't "turned down" earlier; it was chosen at Node 1).
      3.  **Node 3:** Agent chooses between `B` (keeping it) and `A-`.
          *   **Agent's Choice:** Strictly prefers `B > A-` (since `A > A-` and gap between `A`/`B` implies `B` cannot be worse than `A-` relative to `A`), so chooses `B`. Final outcome: `B`.

  *   **Result:** The agent started with the prospect of `A`, and ended with `B`. It paid no money, but ended up with an option (`B`) that it did *not* strictly prefer to its starting option (`A`), and which it could have kept directly. Crucially, `A` was *available and chosen at Node 1*, but then effectively lost by choosing `B` at Node 2. The agent suffers a *dominated outcome*: `B` is dominated by `A` relative to the agent's own situation (it had `A`, and ended with `B` without compensation).

  *   **Does Thornley's Policy ("never choose...") Defang This?**
      *   **Node 1:** Chooses `A` over `A-`. `A-` is forgone.
      *   **Node 2:** Offered choice between `A` (current) and `B`. Thornley's policy asks: "Is `B` strictly dispreferred to something I *turned down* earlier?" The only thing turned down earlier was `A-` at Node 1. The agent *does not* strictly disprefer `B` to `A-` (in fact, it strictly prefers `B > A-`). Therefore, **choosing `B` at Node 2 does NOT violate the policy.** The policy is silent here because `B` isn't worse than the previously rejected `A-`.
      *   **Node 3:** Chooses `B` over `A-`. `B` is not strictly dispreferred to any previously rejected option (`A-` is the only one, and `B > A-`).

      **The policy fails to prevent the dominated outcome.** The agent follows the policy, acts on its preferences (including the gap) at every step, yet ends up with `B` instead of the `A` it initially held and could have kept. The pump exploits the gap *precisely at Node 2*, where the lack of strict preference allows a choice (`B`) that leads to the dominated outcome relative to the path where it simply kept `A`.

  *   **Why This Collapses the Disanalogy with Transitivity (Mechanically):**
      *   **Forcing Nature:** While no single trade is forced *against* a strict preference (like in the transitivity pump), the *sequence* forces a dominated outcome *because of the gap*. The agent cannot avoid the possibility of ending up worse off without violating its preferences *or* Thornley's policy. Refusing to choose `B` at Node 2 is *permitted* by the gap (it could keep `A`), but *choosing* `B` is also permitted. The exploit lies in the *possibility* of choosing `B` when `A` is available, leading to a loss.
      *   **Role of the Gap:** The gap's insensitivity to sweetening is irrelevant here. Gustafsson doesn't rely on sweetening `B`; he relies on the gap allowing a choice (`B` at Node 2) that, combined with the agent's other strict preferences (`A > A-`), leads to a dominated outcome (`B` instead of `A`). The gap enables a choice that isn't strictly worse at the moment but is disastrous in context.
      *   **Analogy to Transitivity:** Like the transitivity pump, this sequence demonstrates a vulnerability inherent in the preference structure (violating completeness) that can be exploited to the agent's detriment. The agent pays in kind (losing `A` for `B`) rather than in money, but the core argument – that the preference structure permits exploitable behavior leading to a strictly worse outcome – is analogous.

  ### Load-Bearing Steps: The Mechanism Summary

  1.  **Naive Pump Failure:** The naive completeness pump fails because its first step (`A` for `B+$ε`) is non-forcing due to the preferential gap. The agent can refuse without violating preferences or Thornley's policy. **Load-bearing step:** The gap's insensitivity to small sweetenings prevents the creation of a strict preference forcing the first trade.
  2.  **Gustafsson's Forcing Pump Success:** Gustafsson's pump works by:
      *   **Exploiting the Gap at a Critical Node (Node 2):** The gap allows a choice (`B` over `A`) that, while not strictly dispreferred at the moment and not violating Thornley's policy (based on *previously rejected* options), leads to a dominated outcome relative to the agent's initial position (`B` instead of `A`).
      *   **Leveraging Strict Preferences Elsewhere (Node 1 & 3):** These ensure the agent won't choose `A-` when better options are available, defining `B` as a dominated outcome relative to `A`.
      *   **Making Thornley's Policy Ineffective:** The policy only guards against choosing options strictly worse than *previously rejected* ones. At Node 2, `B` isn't worse than the rejected `A-`; it's better. The policy doesn't guard against choosing an option (`B`) that is merely *not strictly better* than the *currently held* option (`A`), which is exactly what the gap allows and what causes the loss.
  3.  **Final Disanalogy Collapse:** Gustafsson's pump shows that violating completeness *can* lead to exploitable behavior resulting in a strictly dominated outcome, analogous to the transitivity pump. The key mechanism is the gap permitting a choice within a sequence that, combined with the agent's other preferences, guarantees a loss. Thornley's policy, while blocking the naive pump, is insufficient to block this forcing construction. The load-bearing step is the **sequential exposure of choices where a gap allows a non-dominated-but-contextually-disastrous selection**.

  **Conclusion:** Your instinct about the weakness of the naive completeness pump is correct; the disanalogy stems from its non-forcing nature due to the gap's properties. However, Gustafsson's forcing pump successfully closes this loophole by constructing a sequence where the gap *itself* becomes the point of exploitation within a chain of decisions, leading to a dominated outcome without violating Thornley's policy. The disanalogy with transitivity collapses *under this specific, more sophisticated pump*, providing a mechanism-based argument for why violating completeness can still be "incoherent" in a way exploitable by a sufficiently clever adversary. The debate often hinges on whether Gustafsson's pump is sufficiently "realistic" or "fair," but mechanistically, it achieves its goal of forcing a dominated outcome via the gap.
