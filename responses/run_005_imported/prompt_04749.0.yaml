  so I've been arguing with people online about whether AI art can actually be "creative" or if its just remixing, and somebody dropped this old Kant passage on me like it was supposed to settle the whole thing (it's from the Critique of Judgment, the part about genius). I dug up the actual text and copied out the bit that's messing with my head, though fair warning I might not have transcribed every word exactly right:

  "Genius is the talent (natural endowment) which gives the rule to art... genius is a talent for producing that for which no definite rule can be given, not a mere aptitude for what can be learned according to some rule... since there may also be original nonsense, its products must at the same time be models, i.e., exemplary... Thus all the steps that Newton had to take, from the first elements of geometry to his greatest and most profound discoveries, he could make intuitively plain and definite, not only to himself but to everyone else. But a Homer or a Wieland cannot show how his ideas, so rich in fancy and yet so full of thought, come together in his head, simply because he does not himself know, and therefore cannot teach anyone else."

  two things about this are stuck in my head. first, isn't "genius gives the rule to art" just flatly contradicting "no rule can be given" for what genius produces - those sound like opposite claims about the same thing to me. second, why does Newton get kicked out of the genius club here when he's everybody's go-to example of one, like what's the actual criterion doing the work in that comparison, not just "poetry good, science bad"? I feel like if I understood that part properly it would tell me something about whether this cuts for or against AI ever counting as genuinely creative, since a model is basically pure "steps that can be made plain and definite," which is exactly how he's describing Newton's method here. not looking for the sparknotes version, i already know "kant thinks genius requires natural talent," I want the actual mechanics of the argument.
