prompt: |-
  I'm preparing a graduate seminar on philosophy of language and have been rereading Davidson's 'A Nice Derangement of Epitaphs,' where he extends his radical-interpretation framework to argue that even communication between fluent speakers of 'the same language' has, at bottom, the structure of radical interpretation. His key evidence is that a hearer can effortlessly grasp a speaker's meaning despite a malapropism—understanding 'a nice derangement of epitaphs' as meaning a nice arrangement of epithets, though no convention licenses that usage—and from this he concludes that, strictly speaking, there is no such thing as a shared language. I can follow the individual moves, including the distinction between prior and passing theories, but I keep losing my grip on why this phenomenon is supposed to force so radical a conclusion, rather than merely showing that our grasp of a shared code tolerates some on-the-fly repair. Could you help me feel the actual argumentative pressure here: on Davidson's view, why can't a sufficiently flexible conventionalist simply absorb malapropism and novel metaphor as tolerable noise within an existing shared language, rather than treat their intelligibility as evidence that no such language exists at all?
reasoning: |-
  Okay, let me start by unpacking the user's question. They're teaching a grad seminar on philosophy of language and focusing on Davidson's "A Nice Derangement of Epitaphs." The user understands Davidson's moves—prior vs. passing theories, malapropisms as evidence—but can't see why this leads to the strong conclusion that there's no shared language. They wonder why a conventionalist couldn't just see malapropisms as noise within an existing language.

  First, I need to recall Davidson's core argument. He uses malapropisms to show that successful communication doesn't rely on shared conventions. The user's sticking point is why this necessitates abandoning shared language altogether. They mention a flexible conventionalist who accommodates such deviations. So, I should focus on why Davidson thinks conventions are insufficient, even with flexibility.

  Davidson's key point is the first-pass failure. When Mrs. Malaprop says "derangement," the conventional meaning fails. The hearer doesn't just tweak the convention; they bypass it entirely, using contextual clues to interpret. This immediate leap to a new meaning shows that prior knowledge of conventions isn't what enables understanding. The passing theory replaces the prior theory entirely in that moment.

  Next, the creativity and unpredictability of malapropisms. Each instance is novel and context-dependent. A conventionalist might argue for flexible rules, but Davidson would say no pre-existing rule can cover every possible malapropism. The hearer's interpretation is based on holistic guesswork, not applying rules. This undermines the idea of a fixed linguistic code.

  Then, the idiolect point. Every speaker's passing theory is unique to each interaction. Since passing theories are ephemeral and speaker-specific, there's no stable, shared system over time. The prior theory is just a starting point that's constantly discarded. If communication relies on these fleeting, individualized theories, the concept of a shared public language becomes empty.

  The user might think that conventions are still there as a fallback. But Davidson argues that the prior theory's failure is the norm, not the exception. Understanding always involves ad hoc adjustments, making conventions irrelevant in the moment of interpretation. This constant need for adjustment shows that what we call "shared language" is an illusion masking the real process of radical interpretation.

  I should also address the conventionalist's flexibility. If they say conventions include mechanisms for repair, Davidson would counter that those mechanisms aren't rule-governed. The interpretation process isn't governed by conventions but by the hearer's creativity. Each repair is a unique act, not the application of a shared rule. Thus, the repair process itself isn't conventional.

  Lastly, the shift from knowledge to ability. Davidson replaces knowing a language with having the ability to interpret. This redefinition means there's no static entity to call a language. The user's seminar might benefit from contrasting this with Dummett or Lewis, who defend shared conventions. Highlighting this contrast could help students grasp the radical nature of Davidson's view.

  The user's deeper need might be to confidently present and critique Davidson in class. They might want to anticipate student objections, like the flexible conventionalist stance. Providing clear counterarguments and examples (like Mrs. Malaprop) will help. Also, emphasizing the shift from prior to passing theories as a complete replacement, not a modification, could clarify why conventions don't hold up.
answer: |-
  You've pinpointed the exact tension that makes Davidson's argument both powerful and controversial. The conventionalist's intuition ("Surely we *do* share a language, and malapropisms are just exceptions we handle flexibly!") feels strong. Davidson's genius is showing why the phenomenon of effortless malapropism understanding *systematically undermines* the very idea of a *stable, shared, governing code* that the conventionalist relies upon. Here's how he builds the pressure:

  1.  **The First-Pass Failure of Conventions:** The crucial moment is the *first encounter* with the malapropism. When Mrs. Malaprop says "derangement," the hearer doesn't first access the conventional meaning ("mental disturbance"), find it nonsensical in context, *and then* apply a flexible repair rule. Davidson argues the conventional meaning is often *bypassed entirely*. The hearer, based on the context, the speaker's perceived intent, and the phonological similarity to "arrangement," goes *directly* to the intended meaning. The conventional rule ("derangement" means X) simply *didn't apply* in that communicative act. It wasn't used; it was discarded. This shows that **what enables understanding *in this instance* is not the shared convention, but a speaker-specific, context-specific, *ad hoc* hypothesis (the passing theory).**

  2.  **Creativity, Unpredictability, and the Absence of Governing Rules:** Malapropisms (and novel metaphors, etc.) are creative and unpredictable. There's no finite set of rules or conventions that can *govern* or *license* all possible deviations a speaker might produce that a hearer could understand.
      *   **No Pre-Existing Rule:** There's no convention that says: "Whenever a speaker utters a word phonetically similar to word Y, but where Y would make the sentence nonsensical, interpret it as word Z, where Z is phonetically similar and makes sense." This "rule" is infinitely vague and context-dependent. *Which* Z? *How* similar? *What* counts as making sense?
      *   **Holistic Guesswork:** The hearer's successful interpretation relies on a holistic guess about the speaker's *overall* communicative intent, drawing on vast background knowledge about the speaker, the situation, the world, and patterns of sound. This process isn't rule-governed in the way knowing vocabulary and syntax is rule-governed. It's an exercise in radical interpretation applied locally.

  3.  **The Ephemeral, Idiosyncratic Nature of the Passing Theory:** Davidson emphasizes that the passing theory is:
      *   **Idiolectal:** It is constructed *specifically for this speaker at this moment*. My passing theory for Mrs. Malaprop's "derangement" might differ subtly from yours, even if we both understood her.
      *   **Ephemeral:** It might only apply to *this single utterance*. She might never use "derangement" that way again, or she might. It doesn't become part of a stable public code.
      *   **Not Shared:** Crucially, the passing theory the *hearer* constructs to understand the speaker is *not* identical to the passing theory the *speaker* used to produce the utterance. The speaker might have a complex (or simple) internal state leading to the malaprop; the hearer constructs a different complex state to interpret it. They converge on meaning, but *not* on an identical linguistic rule or representation.

  4.  **The Passing Theory *Replaces* the Prior Theory, it Doesn't Modify It:** The conventionalist wants to say the prior theory (the shared language) is *modified* or *extended* on the fly. Davidson argues that the passing theory *replaces* the prior theory *for the purpose of interpreting this utterance*. The prior theory (with its convention for "derangement") failed. The passing theory (assigning "derangement" the meaning of "arrangement") is a *different* theory. While the prior theory provides the *starting point* and the *resources* (phonemes, syntactic structures), the specific semantic interpretation applied in the passing theory is novel and *not* derived from the prior theory's conventions by any general rule. **The prior theory isn't the engine of understanding; it's merely the initial fuel and parts kit the radical interpreter uses to build a new, custom engine (the passing theory) for *this* interaction.**

  5.  **The Ubiquity of Adjustment & The Illusion of the "Core":** Davidson extends the point beyond malapropisms. Novel metaphors, slips of the tongue, idiosyncratic phrasing, understanding children or non-natives – all communication, he argues, involves constant, subtle adjustments of this kind. The "core" of stable conventions we imagine is, upon inspection, constantly being overridden or ignored *precisely when we need to understand*. If understanding *always* potentially requires abandoning the convention and constructing a unique passing theory, then **what work is the concept of a "shared language" *as a stable, governing system* actually doing?** It seems like an explanatory placeholder for a process that is fundamentally interpretive and context-bound.

  **Why the Conventionalist's "Flexibility" Doesn't Save the Day:**

  1.  **Flexibility Isn't Rule-Governed:** The conventionalist might say, "But our shared language *includes* the convention of being flexible!" Davidson's counter is that this "flexibility" isn't itself governed by linguistic conventions. *How* to be flexible? *When* to abandon the code? *What* to replace it with? These decisions are precisely the work of radical interpretation – constructing the passing theory – which operates outside the bounds of any codified rules. The "flexibility" *is* the radical interpretation process itself.
  2.  **The "Shared Language" Becomes an Empty Shell:** If the conventionalist stretches "shared language" to encompass *all possible passing theories* that competent speakers *might* construct on the fly to understand *any possible* utterance (including malapropisms, neologisms, etc.), then "shared language" loses its explanatory power and becomes an empty, infinitely extensible label. It no longer refers to a specific, stable system of rules that *governs* communication. It just becomes a name for the *ability* to interpret, which is exactly Davidson's point. What we *call* "knowing a language" is really the complex ability to construct passing theories.
  3.  **Prior Theory as Fallback, Not Foundation:** The conventionalist might argue the prior theory is still foundational because we fall back on it when interpretation fails or isn't needed. Davidson acknowledges its practical importance as a starting point and statistical norm. But his point is philosophical: **what *constitutes* successful understanding in any given instance is the convergence of speaker's intention and hearer's passing theory, *not* the application of a shared prior theory.** The prior theory is merely a useful heuristic, not the essential mechanism.

  **The Radical Conclusion:**

  Davidson isn't denying that we share vast amounts of linguistic *behavior* and statistical regularity (prior theories overlap hugely). He's arguing that the concept of a "shared language" as a *single, stable, objective, conventional system that speakers know and that governs successful communication* is a myth. The phenomenon of effortless malapropism understanding demonstrates that:

  *   **Conventions are insufficient:** They fail at the crucial moment of understanding the novel utterance.
  *   **Understanding is idiolectal and ephemeral:** It relies on constructing unique, speaker-and-utterance-specific passing theories.
  *   **The engine is interpretation, not code:** Communication succeeds through the dynamic, creative process of radical interpretation applied locally, not the passive application of shared rules.

  Therefore, "there is no such thing as a language" in that specific, conventionalist sense. What exists is a complex pattern of overlapping prior theories and the shared human capacity for radical interpretation, constantly exercised to build fleeting passing theories that converge on meaning. The pressure comes from realizing that *every* instance of understanding, even the most mundane, *could* involve this kind of adjustment if needed, and that the malapropism is just a vivid example exposing the underlying interpretive machinery that is *always* at work. To explain successful communication, we need the framework of radical interpretation, not the postulation of a shared, governing code.
