answer: |-
  Here's a detailed breakdown of the core objection to resolute choice in the money-pump context and the defender's response, structured for your dissertation chapter:

  **The Core Objection: The Tyranny of the Local Perspective & The Cost of Preference Falsification**

  The strongest objection argues that resolute choice imposes a profound *rationality cost* by demanding an agent **act against their own, locally decisive, all-things-considered preferences at the moment of choice**. This cost, critics contend, is fundamentally equivalent to the cost of exploitability, rendering McClennen's solution hollow. Here's why:

  1.  **Synchronic Rationality as Foundational:** Traditional decision theory grounds rationality primarily in *synchronic* principles – evaluating choices based on the agent's beliefs and preferences *at the specific moment of decision*. Instrumental rationality demands choosing the option that best satisfies your *current* preferences given your *current* beliefs. Resolute choice, by forcing adherence to a past plan *against* the dictates of current preferences, appears to blatantly violate this core principle. The agent, at node t2, *prefers* (given their then-current preferences) deviating from the plan. Choosing *against* that preference seems instrumentally irrational *at t2*.

  2.  **The "Look of Temptation" is the Look of Rationality:** The critic argues that the "temptation" the resolute agent resists isn't some irrational impulse; it *is* the manifestation of their genuine, locally rational preference. When the agent at t2 prefers deviating, that preference reflects their *actual* evaluation of the options available *then and there*. Calling this a "temptation" to be resisted is merely rhetorical; it *is* their synchronic rational choice. Forcing them not to take it is forcing them to act irrationally *at that moment*.

  3.  **Preference Falsification & Self-Alienation:** Resolute choice requires the agent to *pretend* their preferences at t2 are different than they actually are. They must act *as if* they prefer sticking to the plan, even though their genuine preference structure dictates deviation. This amounts to a form of **preference falsification** – acting counter to one's own evaluative state. Critics argue this creates a kind of **self-alienation**, where the agent is estranged from their own current judgments about what is best. Rationality, they argue, should involve congruence between judgment and action, not overriding judgment with past fiat.

  4.  **The Cost is Exploitability in Disguise:** The objection claims the *cost* of resolute choice is just as real as the cost of being money-pumped, but less visible:
      *   **The Money-Pumped Agent:** Pays a concrete cost (loses resources) due to sequential exploitation *driven by their preferences*.
      *   **The Resolute Agent:** Pays an *internal* cost – the cost of *not* satisfying their current, locally decisive preference at t2. They forgo what they genuinely judge best *now* to adhere to the past plan. This forgoing is a direct welfare loss *according to their own current preferences*. It's like paying an "irrationality tax" to avoid the "exploitability tax." Neither tax is preferable.

  5.  **The Bootstrapping Problem:** How is the initial resolution *itself* rational? If the agent knows at t1 that sticking to the plan will require acting against their future preferences at t2, why is committing to that path rational *at t1*? The standard justification is that it leads to the best overall outcome (avoiding the pump). But the critic argues this justification *depends on the assumption* that the agent at t2 *will* irrationally override their own preferences. Rationality at t1 seems to be bootstrapped by the *planned irrationality* at t2.

  6.  **Undermining the Basis of Planning:** If agents routinely override their current preferences based on past commitments, what constrains these commitments? Why not commit to incredibly suboptimal plans? The critic fears resolute choice severs the essential link between *current* preferences and *current* action that makes plans responsive to an agent's actual evaluations over time. Plans become rigid dictates divorced from the preferences they were meant to serve.

  **The Defender's Response: Re-Framing Rationality as Diachronic Unity**

  Defenders of resolute choice (following McClennen, and drawing on philosophers like Bratman on planning agency) don't deny the *phenomenon* of shifting local preferences. Instead, they challenge the *primacy* of the synchronic perspective and offer a richer conception of diachronic rationality:

  1.  **Rationality as Governing the Whole Agent Over Time:** The core argument is that rationality applies to the *entire temporally extended agent*, not just time-slices. An agent's identity and agency persist over time. Rationality, therefore, must be evaluated concerning how choices *over a sequence* cohere and serve the agent's interests *over that sequence*. Exploitability (like the money pump) is a paradigmatic *diachronic* failure. Resolute choice is the cure for *that specific failure* by ensuring coherence over time.

  2.  **The Initial Plan as the Authoritative Perspective:** At the initial node (t1), the agent has a privileged, comprehensive view. They see the entire decision tree and can evaluate the *sequences* of outcomes. Choosing the best *plan* (e.g., <A, Stick>) at t1 is the most rational choice *from that privileged perspective*. This initial choice, defenders argue, *binds* the future selves not because of temporal authority, but because it represents the agent's *most considered and comprehensive judgment* about what serves their overall good.

  3.  **Later "Preferences" as Myopic Distortions:** Defenders argue that the preference for deviation at t2 is *not* the agent's "true" or "all-things-considered" preference in the deepest sense. It arises from a *local perspective* that lacks the broader context the agent possessed at t1. The preference for B over A at t2, when A is part of the path to avoid ending up with C (or worse), is a *mistake* from the perspective of the agent's own enduring values and the comprehensive evaluation made at t1. Resisting this "temptation" isn't irrational; it's *correcting* for the myopia induced by the local choice context. It's akin to Ulysses resisting the Sirens – overcoming a predictable local distortion to achieve a globally valued goal.

  4.  **No Genuine Preference Falsification:** The defender rejects the claim that the agent *genuinely* prefers deviation all-things-considered at t2. The agent *recognizes* the local appeal but *endorses* the perspective of their initial, comprehensive judgment. Acting on the resolution is acting in accordance with their *enduring commitment* to their own best overall judgment made at t1. It's fidelity to their deeper, more reflective self, not falsification.

  5.  **The Cost of Incoherence vs. The Cost of Commitment:** While the resolute agent forgoes the locally appealing option at t2, the defender argues this cost is:
      *   **Necessary:** To avoid the objectively worse outcome of the pump (C, or C-minus-resources).
      *   **Smaller:** The local "gain" from deviating (B over A) is illusory because it inevitably leads to the much worse outcome C or exploitation. The true cost of incoherence (ending up with C) is far greater than the cost of forgoing B.
      *   **Justified by the Global Gain:** Avoiding the pump *is* the offsetting gain. The agent *prefers* the outcome of the resolute plan (<A, Stick> leading to A) *overall* to the outcome of any path involving deviation (leading to B or worse). The rationality of the plan lies in securing this globally preferred outcome.

  6.  **Bootstrapping Resolved:** The commitment at t1 is rational *because* it implements the best achievable sequence of outcomes (avoiding C). The defender argues it is *not* paradoxical to plan to act against a *future local distortion* that would otherwise lead to a disastrous outcome. It's rational foresight and self-management. The plan at t1 *is* responsive to the agent's *comprehensive* preferences over outcomes.

  **The Stalemate & Its Significance for Your Chapter:**

  The debate hinges on a fundamental disagreement about the **unit of agency and the locus of rationality**:

  *   **Critics (Synchronic Primacy):** Hold that the rational unit is the *agent-at-a-time*. Rationality demands satisfying current preferences. Resolute choice violates this, imposing an unacceptable cost of self-betrayal. Exploitability is the symptom of irrational *preferences*, and only fixing the preferences solves the problem.
  *   **Defenders (Diachronic Unity):** Hold that the rational unit is the *agent-over-time*. Rationality demands achieving coherent, non-exploitable sequences of actions that reflect the agent's most comprehensive judgment. Synchronic preferences at nodes can be contextually distorted; fidelity to a good initial plan *is* rational, even when it requires overriding a local impulse. Exploitability is the core failure, resolute choice is the cure.

  **Why it's Often Seen as Pyrrhic:** Critics believe defenders "solve" the money pump only by *redefining* rationality in a way that sacrifices its core synchronic, instrumental component. They see it as winning the battle (avoiding the pump) by losing the war (abandoning the standard conception of what makes an action rational *when it is performed*). The cost of binding the future self against its locally rational will seems, to them, just as damaging to the concept of rational agency as being exploitable.

  **For Your Chapter:** You can frame this as the central tension in diachronic rationality. Explore how this debate highlights:
  *   The challenge of defining the "self" that rationality governs.
  *   The conflict between moment-by-moment preference satisfaction and long-term planning coherence.
  *   Whether rationality can demand actions that feel instrumentally irrational *at the time* for the sake of a larger goal.
  *   The very nature of preference – are they context-independent facts, or can rational plans sometimes *override* their local expression?

  By dissecting this objection and response in depth, you illuminate the deep philosophical fault lines underlying the technical debate about money pumps and intransitivity.
