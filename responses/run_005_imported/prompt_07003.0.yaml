  5. **Dan's pragmatic point (Score: 1 - Mostly right, but incomplete)**  
     Dan is pragmatically correct that in mathematical practice, authors often cite Zorn's Lemma without analyzing choice fragments, so de facto, they are "on the hook for full AC" unless proven otherwise. This reflects common mathematical workflow, where choice strength is rarely scrutinized before publication. However, Dan overstates by implying that Mei's position "only looks right in hindsight." Choice-aware mathematicians can and do investigate fragments proactively (e.g., in constructive mathematics or reverse mathematics), and theorems like Hahn-Banach are often known to have weaker proofs from the outset. His claim is not mathematically shaky but is a practical observation that ignores cases where bookkeeping is done. Score is 1 (not 2) because it dismisses Mei's valid mathematical point as merely retrospective.

