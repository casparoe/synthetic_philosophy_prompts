     Dan is correct that Zorn's Lemma (ZL) and the Axiom of Choice (AC) are provably equivalent over Zermelo-Fraenkel set theory (ZF). This equivalence is a standard result in set theory: ZL implies AC, and AC implies ZL, meaning that accepting ZL commits one to full AC in the context of ZF. There is no "hedging" at the level of foundational commitment; if a proof invokes ZL, it relies on a principle equivalent to AC. Mathematically, this claim is solid and not shaky. However, Dan's point is about the logical commitment, not about whether a specific theorem requires the full strength of AC—a nuance Mei later addresses.

