  J. R. Lucas and Roger Penrose famously argued that Gödel's first incompleteness theorem proves the human mind cannot be equivalent to a Turing machine, since a human mathematician can always recognize the truth of a Gödel sentence that any given consistent formal system is unable to prove. Given that this conclusion follows from a rigorously established theorem of mathematical logic, why do most philosophers of mind and cognitive scientists still treat computationalism about the mind as an open, defensible position rather than as a refuted one?
