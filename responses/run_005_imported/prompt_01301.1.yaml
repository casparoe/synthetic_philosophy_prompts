prompt: |-
  So at work we've been using 'self-consistency' with our LLM calls -- sample the model a bunch of times and go with whatever answer comes up most -- and a teammate mentioned this is basically just the Condorcet Jury Theorem in disguise. Now I can't unsee it everywhere: reddit upvotes, x/twitter community notes, prediction markets, all claiming to be 'wisdom of the crowd' machines. But the theorem only actually works if each voter is independent AND more likely than not to be right on thier own -- break either assumption and more voters makes the group verdict worse, not better. Condorcet himself was a total Enlightenment optimist, big on progress, public education, and using probability to design better institutions. If you sat him down today and showed him how these crowd platforms actually behave -- bots and algorithmic feeds wrecking independence, misinformation dragging average competence below 50/50 on plenty of topics -- do you think he'd see his theorem vindicated at internet scale, or would he say we've built machines that trade on the theorem's name while violating everything it requires? Actually reason through the math/assumptions, don't just give me vibes.
reasoning: |-
  Okay, let me tackle this user's question. They're comparing self-consistency in LLMs and online crowd platforms to the Condorcet Jury Theorem. The user points out that these systems often break the theorem's assumptions of voter independence and individual competence above 50%. 

  First, I need to recall the theorem's exact conditions. Condorcet requires three things: independent voters, individual competence p>0.5, and homogeneous competence. The user's examples clearly violate these - social media has bots and algorithmic bias destroying independence, and misinformation pushes average accuracy below 50% on many topics. 

  The math is clear here. When independence breaks, errors become correlated, making group failure more likely. When p<0.5, majority voting actively selects wrong answers. Even worse, many platforms have heterogeneous competence - some users are experts but many are uninformed, pulling the average down. 

  For LLM self-consistency, it's an interesting case. The "voters" are correlated through the base model, so independence fails. But since LLMs are often above 50% accuracy, it might still work - unlike social media where p<0.5 is common. 

  The user seems analytically minded - they want the math, not vibes. They're also subtly asking about institutional design: have we built systems that pervert Condorcet's vision? Condorcet himself would likely be horrified seeing platforms that amplify misinformation while claiming his theorem's legitimacy. 

  The key insight is that without enforced independence and quality control, crowd platforms become anti-wisdom machines. The theorem isn't wrong - we're applying it wrong. Maybe I should emphasize how prediction markets (with skin in the game) come closest to meeting the conditions.
answer: |-
  Let's dissect this systematically. Condorcet Jury Theorem (CJT) has precise mathematical assumptions, and modern platforms violate them catastrophically. Here's the breakdown:

  ### Core CJT Assumptions & Math
  1.  **Independence:** Voters' judgments are statistically independent.
  2.  **Competence:** Each voter has identical probability `p > 0.5` of being *correct*.
  3.  **Homogeneity:** `p` is the same for every voter/trial.
  4.  **Binary Choice:** Decision is between two alternatives (correct/incorrect).

  **Result:** As group size `n` → ∞, probability of correct majority vote → 1.

  **Failure Modes:**
  *   **If `p < 0.5`:** Probability of correct majority vote → 0 as `n` → ∞. *More voters make you wrong.*
  *   **If `p = 0.5`:** Probability of correct majority vote remains 0.5 for any `n`. *Voting is useless.*
  *   **Dependence:** Breaks the independence assumption. Correlated errors drastically reduce the "effective" group size, potentially making large groups perform *worse* than smaller, truly independent groups or even individuals.

  ### Modern Platform Reality vs. CJT Assumptions
  1.  **Independence (Shattered):**
      *   **Bots/AI:** Mass-produced identical outputs are *perfectly correlated*, not independent votes.
      *   **Algorithmic Feeds:** Users see the *same* information, creating herding and shared biases (confirmation bias, outrage algorithms).
      *   **Social Influence:** Upvotes/comments signal popularity, influencing later voters (bandwagon effect).
      *   **Common Information Sources:** Most users get news from a few dominant (and often biased/misleading) sources.
      *   **Result:** Votes/contributions are highly *dependent*. The "crowd" behaves more like a few correlated blobs.

  2.  **Competence (`p > 0.5`) (Often Violated):**
      *   **Misinformation/Disinformation:** Deliberate falsehoods and viral nonsense make `p << 0.5` on complex or politicized topics.
      *   **Complexity:** Many topics (economics, climate science, geopolitics) require expertise most lack. The average person guesses (`p ≈ 0.5`) or worse (`p < 0.5`) due to biases.
      *   **Incentives:** Platforms reward engagement (clicks, outrage), not accuracy. This often *lowers* `p`.
      *   **Anonymity/Low Stakes:** No cost to being wrong, enabling low-effort/low-competence participation.
      *   **Result:** On countless topics, the *average* `p` is demonstrably <= 0.5. More participation *degrades* accuracy.

  3.  **Homogeneity (False):**
      *   Competence varies wildly. A few experts (`p_high >> 0.5`) drown in a sea of uninformed users (`p_low <= 0.5`). The *average* `p` is what matters for large groups under CJT. If `p_avg < 0.5`, the theorem predicts failure.

  4.  **Binary Choice (Often Inadequate):**
      *   Real-world problems (policy, science, moderation) are rarely simple true/false. CJT doesn't apply directly to nuanced choices or continuous scales (like sentiment in upvotes).

  ### Analysis of Specific Platforms
  *   **LLM Self-Consistency:** *Partially satisfies CJT, but dependence is fatal.*
      *   *Competence:* Modern LLMs *often* have `p > 0.5` on factual questions (why the technique works).
      *   *Homogeneity:* Each sample uses the same model weights (`p` is fixed).
      *   *Independence:* **VIOLATED.** Samples are from the *same model* with correlated weights and prompt. They aren't independent thinkers; they share underlying biases and knowledge gaps. "Sampling a bunch of times" creates correlated, not independent, votes. This reduces effectiveness vs. true independence but can still help if the model's `p > 0.5` (by averaging over some randomness).
  *   **Reddit Upvotes/Twitter Likes:** *Violates almost all assumptions.*
      *   Measures popularity/sentiment, not correctness (`p` undefined).
      *   Highly susceptible to early voting, brigading, bots, algorithmic promotion (massive dependence).
      *   Average voter competence `p` on factual matters is often low and unmeasurable.
  *   **Community Notes:** *Attempts to address CJT flaws, but struggles.*
      *   *Goal:* Achieve high `p` and independence via diverse raters.
      *   *Reality:* Raters aren't screened for competence (`p` unknown). "Helpful" rating prioritizes consensus, potentially correlating votes. Susceptible to coordinated campaigns (dependence). More an iterative consensus mechanism than pure CJT.
  *   **Prediction Markets:** *Closest to CJT ideals (when functioning well).*
      *   *Independence:* Traders act based on private info/beliefs (encourages independence).
      *   *Competence:* Skin in the game (money) incentivizes research & truthful betting (`p > 0.5` for informed traders). The market price aggregates beliefs.
      *   *Homogeneity:* Not required; informed traders with high `p` dominate the price.
      *   *Why it works:* Money forces `p > 0.5` and mitigates dependence through competition. This is why prediction markets often outperform polls.

  ### Condorcet's Likely Reaction
  Based on his writings (e.g., *Essay on the Application of Probability to Decisions*):

  1.  **Horror at Independence Violations:** He'd see bots, algorithmic curation, and social herding as catastrophic institutional failures, creating artificial dependence that destroys the theorem's foundation. "You've built machines of *mass correlation*, not collective reason!"
  2.  **Despair at Low Competence:** His belief in education and reason would make widespread `p < 0.5` deeply depressing. He'd argue platforms enabling this violate the core premise of democratic epistemology.
  3.  **Revulsion at Misapplication:** He'd see platforms using terms like "wisdom of the crowd" while operating in regimes where CJT predicts *foolishness* (`p < 0.5`) or where votes aren't independent as dangerous perversions of his ideas. It trades on the *name* while violating the *essence*.
  4.  **Cautious Optimism for Prediction Markets:** He'd likely see well-designed prediction markets as the closest embodiment of his ideals in practice, precisely *because* they incentivize independence and competence.
  5.  **Institutional Critique:** True to his Enlightenment roots, he wouldn't blame the theorem's math. He'd blame *us* for building institutions (platforms) that ignore its prerequisites. He'd demand redesigns enforcing independence (combatting bots/algorithms) and elevating competence (credibility weighting, expert input, stakes).

  **Conclusion:** Condorcet would emphatically **not** see his theorem vindicated at internet scale. He would argue we've built machines that systematically violate its core assumptions (independence and competence), often operating in the regime (`p <= 0.5` + dependence) where more participation *degrades* collective accuracy. These platforms are frequently "**Folly of the Correlated Crowd**" engines, not wisdom machines. The theorem's math remains valid; our application of it is profoundly flawed. Condorcet would demand platforms either redesign to meet CJT's rigorous assumptions (extremely difficult) or stop invoking "wisdom of the crowd" as a justification.
