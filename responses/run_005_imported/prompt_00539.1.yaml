  So I've been down a rabbit hole on Bostrom's simulation argument again after a LW thread brought up anthropics. I get the basic trilemma (extinction before the posthuman stage / posthumans don't run ancestor sims / we're almost certainly in a sim), but what I keep getting confused about is how the argument's force actually depends on which anthropic principle you plug in - like, does assuming SSA (self-sampling assumption) vs SIA (self-indication assumption) change the actual conclusion, or just the confidence level you should have in the third disjunct? I've seen people claim SIA makes the simulation argument stronger because it front-loads a prior toward there being way more observers, but I've also seen the opposite claim, and I honestly can't tell anymore if I'm right or just misremembering some old Katja Grace post from years ago. Can you walk me through, step by step, how SSA and SIA each interact with the simulation argument, and why they might pull in different directions on how worried we should be that we're simulated? I'd definately like something more precise and mechanistic than the usual hand-wavy "anthropics is just weird" explanations I keep running into.
