  Beyond these, I should cover other embedded agency aspects. Maybe self-modification risks—how AIs modifying their own code can lead to catastrophic failures. Also, the role of heuristics in bounded agents, and whether human-like heuristics are necessary or if novel approaches exist. Additionally, the interplay between embedded agency and alignment—how being part of the environment affects goal stability.

  Each question needs a concise note on expected answers and a pointed follow-up. Avoid soft questions; focus on controversy and implications. Ensure the guest can't dodge with jargon—follow-ups should demand concrete examples or alternatives. The user's depth of understanding means questions must reflect nuanced critique, not surface-level curiosity.

