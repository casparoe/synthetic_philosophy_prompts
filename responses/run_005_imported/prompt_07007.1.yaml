  But let me double-check: is there any inaccuracy?

  - Galileo did not have a strict demonstration (as the student notes), but he thought the evidence was strong enough. Bellarmine's standard was a demonstration that would be beyond doubt (like proving the tides were caused by the motion, which wasn't available then). The student captures this.

  - The student says the dispute is "fundamentally evidential" and not about whether theology should pronounce on natural facts. This is correct because Bellarmine did not claim theology should pronounce on natural facts without regard to science; rather, he held that until there was a demonstration, the traditional interpretation (and the authority of the Church) should stand. Both agreed that if science proves something, theology must adjust. So the difference is about the evidence, not the principle.

