prompt: |-
  Random question from my metaethics seminar – we're on fitting-attitude theories of value right now and just covered the wrong-kind-of-reasons problem, like the classic case where a demon says he'll torture you unless you make yourself intrinsically desire something totally worthless (a lump of mud, say), so you technically have a reason to desire it, but that obviously doesn't make the mud good. My professor mentioned that Franz Brentano's idea of the good as whatever can be loved with a "correct" love is basically the ancestor of these fitting-attitude views, which got me curious: if Brentano actually had to deal with this exact kind of counterexample, does his notion of correctness in loving/hating give him a principled way to rule out reasons like the demon's, or is he just as stuck as the contemporary fitting-attitude theorists? Try to reconstruct what his actual response would probably be, based on his real theory rather then just a generic fitting-attitude move.
