  ### Detailed Justification for Scores
  *   **Part a (4/5):** Loses 1 point for two minor imprecisions: (1) Exaptation was defined in a *later* paper (Gould & Vrba, 1982), not a "companion" to the 1979 spandrels paper. (2) The architectural description oversimplifies slightly (spandrels arise specifically from the intersection of arches supporting a *dome* on a *square* base, creating pendentives/squinches). The core analogy and its meaning for biology are perfectly captured.
  *   **Part b (5/5):** Flawless. Correctly identifies the Pangloss reference, the nature of the paradigm (existence implies adaptive purpose), and its critique of uncritical adaptationism.
  *   **Part c (4/5):** Loses 1 point for phrasing. Pleiotropy and constraints are correctly identified. However, describing the pleiotropic effect as an "unselected side-effect" is slightly loose. While *non-adaptive* side-effects are the focus, the *gene itself* is under selection for its primary effect. Gould & Lewontin's point is that the *side-effect* wasn't selected *for*, which the student implies but doesn't state precisely. The constraint explanation is excellent.
  *   **Part d (3/5):** Loses 2 points for major errors: (1) **Conflation:** The "tautology problem" (survival of the fittest = survival of the survivors) is a *separate, older criticism* of natural selection theory. Gould & Lewontin explicitly *dismiss* this as a "canard" (a false belief) in the spandrels paper itself (Section IIa). Dennett's criticism (that G&L attack a strawman version of adaptationism) is entirely distinct. Linking them is incorrect. (2) **Misrepresentation:** Claiming G&L imply natural selection is "less important" misreads their intent. They argue for a *pluralism* of evolutionary forces, not a *demotion* of selection. They were firmly within the Modern Synthesis framework. Dennett certainly doesn't argue *this*. The student gets Dennett's core 'strawman' point right but undermines it with the erroneous additions.
  *   **Overall (B+):** Strong performance on core concepts (a-c) showing good understanding of G&L's paper. The significant error in part (d), misrepresenting G&L's stance and conflating critiques, prevents an A grade. Minor imprecisions elsewhere are typical of a strong undergraduate response.
