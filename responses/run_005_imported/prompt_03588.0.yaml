  Here’s that imagined debate, drawing deeply on their documented philosophies, legal arguments, and historical context. The clash centers on **reason vs. tradition, consequentialism vs. natural law**:

  **Setting:** The King's Bench chambers, London, circa 1785. Papers strewn, a fire crackles. Blackstone sits imperiously behind his desk; Bentham leans forward intently.

  **Blackstone:** (Peering over spectacles, voice dripping with disdain)  
  "Mr. Bentham. Your persistent meddling in the foundations of English law is... tiresome. But this latest suggestion – that the *peccatum illud horribile, inter christianos non nominandum* should be exempt from punishment? It reveals a profound misunderstanding of jurisprudence itself."

  **Bentham:** (Calmly analytical)  
  "Judge Blackstone, your reliance on Latin euphemisms betrays the weakness of your position. If an act is truly so monstrous, surely we *must* name it to examine it. You condemn 'sodomy' as 'unnatural,' a 'crime against nature' unfit for speech. But *why*? What tangible harm flows from it between consenting adults in private? Or is your objection merely... aesthetic revulsion dressed in borrowed robes?"

  **Blackstone:** (Stiffening, tapping his *Commentaries*)  
  "Revulsion? It is the *wisdom of ages* speaking! The act is unnatural because it perverts the inherent purpose of the sexual faculty – procreation. Nature designed coitus for the propagation of the species. Any use deviating from this end is a corruption of nature's order, a rebellion against the very fabric of creation. This is not mere sentiment; it is *natural law*, discernible by reason and confirmed by divine ordinance. Such acts dissolve the bonds of society founded on family."

  **Bentham:** (Leaning in, finger punctuating the air)  
  "Ah, 'Nature's purpose'! A wonderfully elastic phrase, Sir William. Does nature 'intend' every act? Is the sterile couple, the widow, the soldier abroad, perpetrating a 'crime against nature'? No? Then your 'purpose' is selective. You infer design from function, then condemn any deviation as 'corruption.' But nature is *descriptive*, not *prescriptive*. It shows us what *is*, not what *ought* to be. Your 'natural law' is simply tradition elevated to the divine – the very obscurantism I critiqued in your defense of common law!"

  **Blackstone:** (Eyes flashing)  
  "You reduce everything to crude sensation! Society is not built on fleeting pleasures. It rests on *moral sentiments* and *ancient virtues* cultivated over centuries. This vice strikes at the root of those sentiments – modesty, decency, the sanctity of marriage. It breeds moral contagion. If tolerated, it erodes the public sense of right and wrong, the very *consensus juris* upon which law depends. Its punishment upholds the moral health of the Commonwealth."

  **Bentham:** (Voice rising slightly, driven by conviction)  
  "Moral health? Define it! Where is your evidence of this 'contagion'? Does punishing two men in private preserve one marriage? Prevent one birth? You speak of 'sentiments,' but whose? The sentiment of disgust? Disgust is not harm! Law exists to *prevent mischief* – violence, theft, fraud, *actual* suffering. Where is the mischief here? The only demonstrable harms are those *caused by your law*: blackmail, ruined lives, innocent men hanged or pilloried on the testimony of thieves seeking reward! *That* is tangible suffering your 'natural law' inflicts!"

  **Blackstone:** (Coldly)  
  "You ignore the *invisible* harm. The law is a teacher. It upholds standards. To cease punishing this abomination signals societal approval, degrading the moral fabric. It invites imitation, normalizes the unnatural. The potential for societal decay is immense, even if the immediate victims are unseen. Prevention of this decay *is* the prevention of future suffering – suffering of the social order itself."

  **Bentham:** (Passionately now, shedding some caution)  
  "Unseen decay? Imaginary futures! This is the refuge of prejudice when reason fails. You claim to protect society, yet your law *breeds* misery and hypocrisy *now*. It forces secrecy, fosters fear, empowers malicious accusers. It diverts resources from preventing *real* crimes – theft, assault, neglect – that cause palpable suffering. Your 'natural law' argument is circular: It is wrong because it is unnatural; it is unnatural because we define it as wrong! It is immune to evidence, relying solely on inherited aversion. True jurisprudence demands we weigh *actual consequences*: Does this punishment cause more pain than the act it forbids? On any rational calculation – considering the intense suffering inflicted on individuals and families against the absence of proven harm to others – the answer is resoundingly *yes*! The 'greatest happiness principle' isn't a chant, Sir William; it is a scalpel to dissect such irrational cruelty masquerading as law!"

  **Blackstone:** (Silent for a moment, face like stone. When he speaks, it's with icy finality)  
  "Your 'scalpel,' Mr. Bentham, would dissect the very soul of England. Happiness? A transient, subjective feeling. You would sacrifice eternal verities, the accumulated wisdom of Christendom and Rome, on the altar of individual gratification. Your calculus is blind to the intangible foundations of civilization. Some acts *are* intrinsically vile, their prohibition necessary not despite, but *because of*, the revulsion they inspire. That revulsion *is* the voice of natural law. The law must uphold this standard, or it ceases to be law and becomes mere license. We shall not agree. The subject is closed."

  **(Bentham opens his mouth, sees the implacable wall, gathers his papers with a sharp, frustrated motion. The unspoken weight of Blackstone's social power and the potential ruin of publishing such views hangs in the air. He turns and leaves without another word. Blackstone stares into the fire, his conviction unshaken, but perhaps a flicker of unease at the raw logic he couldn't fully refute crosses his face.)**

  ## Key Philosophical Clashes Embodied
  1.  **"Unnatural" vs. "Harm":** Blackstone relies on teleology (purpose in nature) and intrinsic wrongness. Bentham demands empirical evidence of tangible harm.
  2.  **Law's Function:** Blackstone sees law as a moral teacher upholding virtue and tradition. Bentham sees it as a tool to prevent specific, measurable harms and maximize well-being.
  3.  **Tradition vs. Reason:** Blackstone appeals to ancient wisdom and societal consensus (*consensus juris*). Bentham demands that every law justify itself through reason and observable consequences *now*.
  4.  **The Role of Disgust:** Blackstone argues disgust *validates* natural law and is necessary for social cohesion. Bentham argues disgust is irrational prejudice and a terrible basis for inflicting suffering.
  5.  **Tangible vs. Intangible Harm:** Blackstone emphasizes the "corruption" of morals and societal decay. Bentham dismisses these as unprovable specters compared to the demonstrable harms *caused by the law itself* (blackmail, executions, ruined lives).

  This dialogue captures the core of their real conflict: Bentham's radical, consequentialist challenge to the foundational natural law assumptions underpinning Blackstone's (and much of 18th-century England's) legal and moral worldview. Blackstone isn't just saying "ew"; he's defending a coherent, tradition-bound philosophy of law and morality, which Bentham systematically attacks at its roots using utility as his weapon.
