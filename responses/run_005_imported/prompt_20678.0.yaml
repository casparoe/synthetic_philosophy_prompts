  Note: The Great Filter is split into early and late. We put early in S and late in A because the early filter (e.g., the origin of life) is supported by the fact that we haven't found any signs of simple life elsewhere, while the late filter (self-destruction) is a concern but we have no evidence that it's common.

  Adjustment: The Sustainability Solution is about civilizations choosing to remain undetectable by not expanding. It's plausible but requires a universal cultural choice. I moved it to A because it's a non-aggressive solution and fits with concerns about resource use.

