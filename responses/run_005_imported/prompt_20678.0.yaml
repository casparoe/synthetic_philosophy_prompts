  We are ranking eleven hypotheses for the Fermi paradox. The Fermi paradox questions why we haven't found evidence of extraterrestrial civilizations despite the high probability of their existence. We have no confirmed technosignatures or biosignatures, and only one known instance of intelligent life (Earth). We are to rank from S (most credible) to D (least credible).

  The hypotheses:
