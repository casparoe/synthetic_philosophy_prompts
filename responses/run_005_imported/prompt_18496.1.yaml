  I should build the strongest case against illusionism. Start with the hard problem: why does processing feel like anything? Illusionism dodges by saying it doesn't—it just seems to. But then, what is "seeming"? If quasi-phenomenal properties are just information processing, why does the system report a "seeming"? That report itself feels like a conscious experience. 

