  Next, address the user's request: engage deeply with quasi-phenomenal properties. They're supposed to be representational states that misrepresent themselves as phenomenal. But if introspection is part of the cognitive system, and it represents quasi-phenomenal properties, how is that representation not itself a conscious event? 

  The verdict needs to be decisive. Weigh both sides: illusionism's strength is parsimony—no extra ontological baggage. But the self-undermining objection is powerful. If the illusion requires a subject to be fooled, and being fooled feels like something, then illusionism might need that very thing it denies. 

