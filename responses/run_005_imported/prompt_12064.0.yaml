answer: |-
  Here are 10 interview questions designed to press on ECL's core tensions, preempt deflections, and demand specificity. Each includes a deflection-piercing follow-up:

  1. **Core Mechanism Challenge:**  
     *"ECL relies on evidential reasoning to motivate cooperation with agents whose values differ but whose decisions correlate with ours. Functional Decision Theory (FDT) achieves cooperation with exact copies but struggles with merely similar agents. Why is evidential reasoning essential here? Couldn't a tweaked FDT that weights similarity achieve the same without invoking large-world evidential loops?"*  
     **Follow-up (anticipating "general similarity problem" deflection):** *"Even if similarity is hard for all theories, ECL uniquely stakes cooperation on evidential updates from my own action. If FDT can't handle similarity, why assume evidential leverage works better when values diverge?"*

  2. **Reference Class Problem:**  
     *"How do you rigorously define the reference class of 'agents with sufficiently similar decision procedures' for ECL cooperation? What prevents this definition from being circular (e.g., 'cooperators are those who cooperate') or arbitrarily narrow/broad?"*  
     **Follow-up (anticipating "reference classes are universally hard" deflection):** *"Agreed, but ECL’s viability hinges on this class. If you define it procedurally (e.g., 'all agents using Bayesian updating'), don't you include vast numbers with hostile values? If you require value-similarity, doesn't ECL reduce to standard cooperation?"*

  3. **Causal Loop Conundrum:**  
     *"In acausal loops (e.g., A influences B, B influences C, C influences A), ECL might recommend actions that create self-fulfilling prophecies of cooperation or defect. How do you avoid recommendations that are paradoxical or self-undermining?"*  
     **Follow-up (anticipating "loops are edge cases" deflection):** *"But in a large universe, complex loops are likely ubiquitous. If ECL can't resolve simple 3-agent loops, how can we trust it in realistic large-world settings where my action correlates with vast networks?"*

  4. **Moral Uncertainty Dodge:**  
     *"If we strip away the large-world framing, does ECL’s practical advice differ meaningfully from standard cooperative heuristics you’d endorse under moral uncertainty (e.g., 'cooperate with moral patients who might reciprocate')? Or is it just a novel justification for existing intuitions?"*  
     **Follow-up (anticipating "novel justification matters" deflection):** *"If the output aligns with simpler theories, why invoke computationally intractable evidential links across the multiverse? Doesn't Occam’s razor favor the simpler model?"*

  5. **Default Action Problem:**  
     *"In the real world, what constitutes the 'default action' (like 'not sending $100' in toy models) from which cooperation is a deviation? Many actions (e.g., policy advocacy, research directions) lack a neutral baseline, making evidential updates ambiguous."*  
     **Follow-up (anticipating "define contextually" deflection):** *"Without a clear default, how do we calculate the evidential impact of my choice? If it's context-dependent, doesn't ECL lose its generality and become indistinguishable from ad hoc cooperation?"*

  6. **Value Extraction Challenge:**  
     *"ECL asks me to cooperate with agents who have different values to incentivize their cooperation. But how do I ensure this doesn't inadvertently empower value systems I find catastrophic (e.g., cooperating with a paperclip maximizer who misinterprets my action)?"*  
     **Follow-up (anticipating "all cooperation risks value drift" deflection):** *"But ECL uniquely compels cooperation with value-dissimilar agents *because* of their decision similarity. Doesn't this systematically increase risks from misaligned powerful agents compared to causal cooperation?"*

  7. **Epistemic Burden:**  
     *"ECL requires agents to model vast counterfactual dependencies: 'If I do X, what does that imply about similar agents doing Y?' How is this feasible under bounded rationality, and doesn't failure risk catastrophic miscoordination?"*  
     **Follow-up (anticipating "all theories have limits" deflection):** *"But ECL's evidential links demand *more* complex modeling than causal theories. If we can't reliably compute ECL's recommendations, should we treat it as action-guiding or purely theoretical?"*

  8. **Infinite Ethics Escape Hatch:**  
     *"Many ECL justifications rely on infinite universes to avoid zero-probability cooperation. But if we weight worlds by algorithmic complexity or accept finite cosmologies, doesn't ECL collapse—or demand radically different math?"*  
     **Follow-up (anticipating "infinities are unresolved generally" deflection):** *"Yet ECL proponents often invoke infinities to solve problems. If we take finite models seriously, what specific ECL prescriptions survive, and how do they differ from finite acausal bargaining?"*

  9. **Collapse into Consequentialism?**  
     *"Does ECL ultimately reduce to a form of acausal consequentialism where 'evidence' is just a proxy for expected utility across correlated agents? If so, why not bypass decision theory and directly maximize influence over value-aligned counterparts?"*  
     **Follow-up (anticipating "decision theory clarifies agency" deflection):** *"But if the machinery of evidential updates and correlated decision-makers functionally replicates acausal trade, why not use the simpler consequentialist framework?"*

  10. **Falsifiability & Downgrade Conditions:**  
      *"What specific empirical discovery or theoretical result would make you significantly lower your credence in ECL being action-relevant for humanity? (e.g., proof of finite universes, non-correlating AGI architectures, etc.)"*  
      **Follow-up (if answer is vague):** *"Could you quantify 'significantly'? E.g., 'Proof that AGI goals are decision-theoretically orthogonal to humans would drop my ECL reliance by >50%'?"*

  **Key angles covered:** Breaks deflection patterns by forcing (1) direct comparisons to rival theories (FDT), (2) operationalization challenges (default actions, reference classes), (3) loopholes (loops, value extraction), (4) redundancy arguments (moral uncertainty, consequentialism), and (5) concrete falsifiability. The structure ensures deflection attempts are met with requests for ECL-specific tradeoffs or comparative disadvantages.
