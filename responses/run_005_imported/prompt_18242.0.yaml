prompt: |-
  So in my research methods seminar this week we got into the whole frequentist vs Bayesian thing and my prof gave us this example that kind of broke my brain a little. She said imagine two researchers end up with the exact same data, like 9 heads out of 12 coin flips, but researcher A had decided beforehand "I'm flipping exactly 12 times" while researcher B decided "I'm gonna keep flipping until I get 3 tails," and it just happened to also take him 12 flips to get there. Even though the observed data is literally identical, apparently the p-value you get for testing whether the coin is fair comes out different for A vs B, because it depends on the stopping rule/sampling plan and not just on what was actually observed. She said this ties into something called the "likelihood principle" that Bayesians like to invoke, and that its also connected to why "optional stopping" (peeking at your data partway through and deciding whether to collect more) counts as one of those shady researcher-degrees-of-freedom things that fed into the replication crisis.

  Honestly I got kind of lost on the actual mechanics of why the math comes out different for A vs B, and I'm a little skeptical of the bigger claim too — like is this stopping-rule stuff actually a real driver of failed replications in fields like psych and biomedicine, or is it more of a cute textbook paradox that doesn't matter that much next to stuff like publication bias and small sample sizes? We've got a short response paper due on this next week and I don't just want to parrot back what she said in lecture without actually getting it myself. Could you break down (1) why the p-values genuinely diverge between the two designs despite the identical data, (2) how the likelihood principle is supposed to explain why a Bayesian analysis wouldn't run into this problem, and (3) give me your honest take on how much explanatory weight this stopping-rule issue really deserves for the replication crisis compared to the other usual suspects?
reasoning: |-
  Okay, let me try to unpack this user's query. They're a student in a research methods seminar, confused about the frequentist vs Bayesian debate, specifically the stopping rule example their professor gave. The example showed two researchers with identical data (9 heads in 12 coin flips) but different p-values based on their stopping rules. The user is struggling with why the math differs, how the likelihood principle resolves this for Bayesians, and whether stopping rules actually contribute to the replication crisis.

  First, I need to clarify why the p-values differ. For Researcher A (fixed n=12), the sampling distribution is binomial. The p-value includes probabilities of 9 or more heads. But for Researcher B (flip until 3 tails), the distribution is negative binomial. Here, the p-value considers sequences with 9 heads and 3 tails, but where the 3rd tail is on the 12th flip. The key is that frequentist inference depends on all possible outcomes under the sampling plan, not just the observed data. So even with identical data, the hypothetical long-run behavior differs, leading to different p-values.

  Next, the likelihood principle. In Bayesian analysis, the posterior depends only on the likelihood of observed data. Since both researchers have the same data (9 heads, 3 tails in that order), the likelihood function is identical. Bayesians ignore the stopping rule because it doesn't affect the likelihood. This contrasts with frequentist methods where the sampling plan is integral.

  Regarding the replication crisis, the user is skeptical if stopping rules are a major factor compared to issues like publication bias. I should acknowledge that while optional stopping can inflate false positives, it's likely a smaller contributor. The replication crisis stems more from systemic issues: publication bias favoring positive results, underpowered studies, p-hacking, lack of pre-registration. Stopping rules might be a technical point, but in practice, flexible stopping without correction can indeed lead to inflated effects. However, its prevalence compared to other issues is probably lower. The key is that pre-registration and transparency mitigate these problems, regardless of the statistical approach.

  The user might also need reassurance that their confusion is valid. The example is indeed counterintuitive. Emphasizing that frequentist methods control error rates over repeated experiments, while Bayesian focuses on evidence from the current data, could help. They might want concrete examples or simulations to illustrate the p-value difference. Also, addressing why optional stopping matters: if researchers peek and stop when significant, they capitalize on chance, increasing false positives in frequentist frameworks. Bayesian methods with proper priors might handle this better, but in practice, careless optional stopping without correction is problematic.

  I should also consider their deeper needs: understanding the practical implications for their research. They might wonder how to design studies to avoid these pitfalls. Highlighting solutions like pre-registration, sample size planning, and transparency would be useful. Clarifying that while stopping rules are a theoretical concern, good practices minimize their impact in real research.

  Finally, structuring the response to first explain the mathematical divergence, then the likelihood principle, and ending with the real-world relevance. Balancing technical accuracy with accessibility, using the coin flip example throughout. Concluding that while stopping rules contribute, they're part of a larger ecosystem of issues driving the replication crisis.
answer: |-
  Let's break this down step-by-step, starting with your core questions:

  ### (1) Why the p-values differ for identical data (9 heads in 12 flips)
  The key is that frequentist p-values depend on the *sampling distribution* under the null hypothesis (fair coin, p=0.5), which is defined by the *stopping rule*. Here's the calculation:

  *   **Researcher A (Fixed n=12):**
      *   Sampling Distribution: Binomial(n=12, p=0.5)
      *   Test Statistic: Number of Heads (X)
      *   Observed: X=9
      *   P-value: P(X >= 9 | p=0.5) = P(X=9) + P(X=10) + P(X=11) + P(X=12)
      *   Calculation: `binom.pmf(9,12,0.5) + ... + binom.pmf(12,12,0.5)` = 0.0537 + 0.0161 + 0.0029 + 0.0002 = **0.073** (One-tailed) or 0.146 (Two-tailed, adding symmetric outcomes like X=3)

  *   **Researcher B (Flip until 3 Tails):**
      *   Sampling Distribution: Negative Binomial(r=3, p=0.5) - Number of *Heads* (successes) until r=3 Tails (failures).
      *   Observed: 9 Heads when 3rd Tail occurred on the 12th flip.
      *   Test Statistic: Number of Heads (Y) when r=3 Tails is achieved.
      *   P-value: P(Y >= 9 | p=0.5). This includes sequences where the 3rd tail occurred on the 12th flip *or later* (Y=9, Y=10, Y=11, ...).
      *   Calculation: P(Y >= 9) = 1 - P(Y <= 8). P(Y=k) = `binom(k+2, k, 0.5) * 0.5` (k Heads + 2 Tails in first k+2 flips, then a Tail). Sum P(Y=k) for k=0 to 8 and subtract from 1.
      *   Result: P(Y >= 9) ≈ **0.033** (One-tailed). This is smaller because sequences with *more* than 9 heads (10, 11, 12, ...) are *more extreme* under H0 and included in the tail, whereas Researcher A's fixed-n design only included up to X=12.

  **Why the difference?** The frequentist p-value asks: "Assuming H0 is true, how likely am I to get data *at least as extreme as what I observed*, **considering all possible outcomes consistent with my intended sampling plan**?" Researcher A planned *only* 12 flips; extreme outcomes beyond 12 flips don't exist in their sampling distribution. Researcher B planned *until 3 tails*; extreme outcomes with 9+ heads and 3 tails occurring *beyond* flip 12 *do* exist in their sampling distribution and contribute to a smaller p-value. The stopping rule defines the set of "possible worlds" considered in the long-run error rate calculation.

  ### (2) The Likelihood Principle & Bayesian Analysis
  The **Likelihood Principle (LP)** states: All evidence about a parameter θ contained in the data is embodied in the *likelihood function* L(θ | data). Two experiments yielding proportional likelihood functions for θ should yield identical inferences about θ.

  *   **Observed Data for Both:** The sequence H, H, H, H, H, H, H, H, H, T, T, T (or any order with 9H & 3T).
  *   **Likelihood Function (Fair Coin p vs. Biased Coin p):**
      `L(p | data) = P(data | p) = p⁹ * (1-p)³` (The probability depends *only* on 9 successes & 3 failures, not on the stopping rule).
  *   **Consequence:** Since the *observed data* (9H, 3T) is identical, the likelihood function `L(p) = p⁹(1-p)³` is identical for Researcher A and Researcher B. According to the LP, their inferences about p should be identical.

  **Bayesian Analysis Respects the LP:**
  *   Bayes' Theorem: Posterior ∝ Likelihood × Prior
  *   The posterior distribution for p depends *only* on:
      1.  The prior distribution (chosen by the analyst).
      2.  The likelihood function `L(p) = p⁹(1-p)³` calculated from the *observed data*.
  *   **The stopping rule does not appear in this formula.** It doesn't affect the likelihood of the observed data *given p*. A Bayesian would get the *exact same posterior distribution* for p whether the data came from Researcher A's fixed-n plan or Researcher B's fixed-tails plan (assuming the same prior).

  **Why Bayesians don't have the "stopping rule problem":** Their inference conditions *only* on the data that actually happened. The probability of data that *could have happened but didn't* (which depends heavily on the stopping rule) is irrelevant to updating belief about θ once the data is observed. The focus is on the *evidence actually obtained*, not on the long-run properties of a hypothetical sampling plan.

  ### (3) Stopping Rules & the Replication Crisis: How Much Blame?
  This is where nuance is crucial. The stopping rule issue is **genuine, theoretically important, and contributes to the problem**, but it's **likely not the primary driver** compared to other factors. Here's my honest take:

  *   **Yes, It's a Real Problem (Not Just Theoretical):**
      *   **Optional Stopping = p-hacking fuel:** If researchers peek at data repeatedly and stop only when p<0.05 (without correction), they *massively* inflate the false positive rate (FPR). Simulations show FPR can easily exceed 30-50% instead of 5%.
      *   **Psychology/Neuroscience Examples:** Stopping data collection when results "look good", adding subjects until significance is reached, redefining endpoints mid-study based on trends – these practices are documented and exploit the stopping rule problem.
      *   **Undermines p-value interpretation:** The nominal p<0.05 only guarantees a 5% FPR *under the specific, pre-specified sampling plan*. Deviating from that plan (like flexible stopping) invalidates the interpretation. This directly contributes to unreplicable findings.

  *   **But, It's Likely Not the Biggest Culprit:**
      *   **Publication Bias:** The systematic failure to publish null/non-significant results is arguably the *dominant* force. Significant but unreplicable findings flood the literature, while null results vanish. This distorts the entire evidence base far more pervasively.
      *   **Low Statistical Power:** Small sample sizes are endemic. Low power means *even true effects* are hard to detect reliably, and the significant findings that *do* get published are often inflated "winners curse" effects. This is a huge factor in failed replications.
      *   **P-hacking Suite:** Selective reporting (only reporting some measured variables/analyses), HARKing (Hypothesizing After Results are Known), flexible data analysis choices (outlier removal, covariate inclusion) – these offer more *practical* and *frequently exploited* avenues for researchers to find "significance" than constantly adjusting sample size based on peeking.
      *   **Questionable Research Practices (QRPs):** The stopping rule issue is one QRP among many. The cumulative effect of *all* QRPs, driven by incentives (publish or perish, novelty bias), is the core problem.
      *   **Magnitude:** While optional stopping *can* severely inflate FPR, the *prevalence* of systematic, uncorrected optional stopping as the *sole* or *primary* cause of an unreplicable finding might be less common than studies simply being underpowered to detect true (but small) effects reliably, or studies finding false positives via other p-hacking methods/publication bias.

  *   **The Connection:** The stopping rule issue is a **symptom and an enabler** of the larger disease:
      *   **Symptom:** It flourishes in an environment lacking pre-registration and adherence to strict analysis plans.
      *   **Enabler:** It provides a direct, mathematically clear mechanism (exploiting the sampling distribution dependence) through which flexible analysis inflates false positives, feeding into the distorted literature created by publication bias.

  **In Summary:**

  1.  **P-values differ** because they are calculated based on the *entire hypothetical space of possible datasets* defined by the *pre-planned stopping rule*, not just the observed data. Different stopping rules generate different hypothetical spaces.
  2.  **Bayesian analysis (via LP)** depends *only* on the probability of the *observed data* given the parameter (the likelihood), multiplied by the prior. The stopping rule, governing unobserved data, doesn't influence this.
  3.  **Stopping rules matter:** Optional stopping is a real, exploitable QRP that inflates false positives and contributes to the replication crisis. **Explanatory weight:** It deserves significant weight as a *clear theoretical mechanism* and a *documented bad practice*, but **less weight** than **publication bias** and **low statistical power** as the *primary drivers* of the *volume* of unreplicable literature. It's a key piece of the "researcher degrees of freedom" puzzle, but not the largest piece.

  **For your paper:** Emphasize the mathematical reason for the p-value difference (sampling distribution dependence) and the philosophical reason for the Bayesian solution (conditioning only on observed data via LP). Acknowledge optional stopping as a real, harmful practice enabled by the frequentist framework's dependence on the sampling plan, but contextualize it within the broader ecosystem of issues (publication bias, low power, other QRPs) that fueled the crisis. Solutions like pre-registration and data/analysis transparency directly combat stopping rule problems *and* the broader QRPs. Good luck!
