answer: |-
  That's an excellent question! You've hit on a fascinating tension between mathematical theory and practical legal reality. The Condorcet Jury Theorem (CJT) *does* provide a powerful theoretical argument for large juries under specific conditions, but its assumptions often clash with how real-world trials operate. Here's why courts don't impanel 100-person juries:

  1.  **The CJT's Ideal Assumptions Don't Hold Perfectly:**
      *   **Juror Competence > 0.5:** CJT requires that *each individual juror* has a probability of being correct *greater than 50%* (p > 0.5). This is a huge assumption.
          *   **Complex Evidence:** Trials involve complex legal instructions, scientific evidence, witness credibility assessments, and emotional elements. It's unrealistic to assume every juror consistently interprets this correctly >50% of the time, especially in ambiguous cases.
          *   **Bias & Prejudice:** Implicit bias, prejudice, media exposure, or life experiences can significantly reduce an individual juror's "p" below 0.5 on specific issues or cases.
          *   **Varying Competence:** Competence isn't uniform. Some jurors grasp concepts quickly, others struggle. The "average p" might be >0.5, but CJT relies on *each* juror meeting the threshold.
      *   **Independence:** CJT assumes jurors make their decisions *independently* before deliberation. This is demonstrably false.
          *   **Deliberation is Key:** Jurors deliberate *together*. They share perspectives, challenge each other, and (ideally) correct individual errors. This interdependence violates the independence assumption. While deliberation *can* improve group competence, it doesn't function like the independent votes CJT models.
          *   **Group Dynamics:** Dominant personalities, social pressure, "groupthink," and the desire for consensus can lead jurors away from their independent initial judgment.

  2.  **Practicality and Feasibility:**
      *   **Cost & Logistics:** Finding, summoning, selecting, accommodating, paying (however minimally), and managing *100* jurors per trial is massively expensive and logistically nightmarish. Courtrooms aren't built for it. Trials would take exponentially longer for jury selection, deliberation, and even simple logistics like breaks.
      *   **Jury Selection (Voir Dire):** Finding 12 impartial jurors is challenging enough. Finding 60 or 100 impartial jurors for a high-profile or locally sensitive case borders on impossible. The process would become absurdly lengthy.
      *   **Deliberation Chaos:** Imagine 100 people trying to have a coherent, in-depth discussion about complex evidence. Meaningful deliberation would break down. Participation would be uneven, quieter voices drowned out, and reaching any kind of nuanced understanding becomes improbable. The deliberation process, designed to refine judgment through discussion, would become unmanageable.

  3.  **The Value of Unanimity (vs. Simple Majority):**
      *   **Promotes Deliberation:** Unanimity forces jurors to engage deeply, listen to opposing views, and work towards consensus. It discourages a rushed majority vote where dissenting voices are ignored. This process *itself* is seen as a crucial safeguard for accuracy and legitimacy.
      *   **Higher Standard for Conviction:** Requiring unanimity sets a very high bar for taking away someone's liberty (in criminal cases). It reflects the principle that it's better for many guilty people to go free than for one innocent person to be wrongly convicted ("Blackstone's Ratio"). A simple majority (e.g., 31 out of 60) convicting someone feels far less secure and legitimate.
      *   **Protects Against Outliers:** While CJT assumes p>0.5, unanimity helps protect against conviction based on a slim majority when there *is* significant reasonable doubt held by a substantial minority. It forces the majority to confront and address that doubt.
      *   **Legitimacy & Acceptance:** A unanimous verdict carries more weight and is more likely to be accepted by the defendant and the public as legitimate and thorough. A 51-49 verdict, even in a large jury, feels inherently unstable and questionable.

  4.  **Diminishing Returns & The "Sweet Spot":**
      *   While CJT shows accuracy increases with size, the gains are non-linear. Moving from 1 to 3 to 5 to 12 jurors yields significant accuracy improvements under ideal conditions. Moving from 12 to 60 or 100 yields much smaller *marginal* gains *if the assumptions hold*, but at enormous cost and while introducing new problems (like unmanageable deliberation).
      *   Historically and empirically, 12 has been found to be a practical "sweet spot" – large enough to provide diversity of perspective and some statistical robustness, small enough to allow for meaningful deliberation. Many jurisdictions allow smaller juries (6-8) for less serious offenses.

  5.  **Legal Tradition & Inertia:**
      *   The 12-person unanimous jury has deep roots in Anglo-American common law tradition dating back centuries. Changing such a fundamental institution requires overcoming significant inertia and proving not just theoretical benefits, but *practical* superiority that outweighs the immense costs and potential downsides. The CJT alone doesn't provide that practical proof.

  **In Summary:**

  You're absolutely right that the CJT highlights a *potential* mathematical benefit of large juries *under perfect conditions*. However, the legal system prioritizes:

  *   **Practicality & Feasibility:** 100-person juries are logistically impossible.
  *   **Meaningful Deliberation:** Small groups allow for the crucial process of discussion and consensus-building, which CJT's independent voting model ignores.
  *   **The Safeguard of Unanimity:** Seen as essential for protecting defendants and ensuring thorough consideration of reasonable doubt.
  *   **Managing Real-World Imperfections:** Acknowledging that juror competence is variable, bias exists, and evidence is complex.

  The system isn't necessarily "behind on the math." It's grappling with a much messier reality than the elegant assumptions of the CJT. The 12-person unanimous jury represents a pragmatic compromise designed to balance the *theoretical* statistical benefits of size against the *practical* necessities of deliberation, fairness, cost, and the fundamental right to a fair trial. The "accuracy" lost by not being 100 people is arguably compensated for (or even outweighed by) the accuracy gained through the deliberation process forced by a smaller unanimous group.
