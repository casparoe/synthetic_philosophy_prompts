answer: |-
  ## The Bomb and the Algorithm: Adjudicating MacAskill's Challenge to Functional Decision Theory

  Will MacAskill’s "Bomb" argument presents a stark, visceral challenge to the foundations of updateless decision theories (UDT) and their descendant, Functional Decision Theory (FDT). The scenario forces a confrontation between the allure of a guaranteed, locally optimal escape and the commitment to a globally optimal decision algorithm. While FDT offers a coherent defense rooted in counterfactual performance and the primacy of the algorithm, Bomb ultimately reveals a critical flaw in how updatelessness handles the irrevocable consequences of *past* predictions, particularly when local dominance is absolute and the predictive link is severed.

  **The Guaranteed Payoff Objection: The Tyranny of the Present**

  Critics argue that FDT's prescription – taking the bomb-laden Left box – is indefensible rational suicide. Their case rests on three pillars:

  1.  **Local Dominance & Certainty:** Standing before the boxes, the agent possesses *incontrovertible evidence*: the bomb is visibly in Left, and the predictor's note confirms the prediction that led to its placement. Choosing Left guarantees death. Choosing Right guarantees survival at a cost of $100. Right *strictly dominates* Left in this actual, realized state of the world. No plausible theory of instrumental rationality should demand an agent choose certain, catastrophic loss over a certain, manageable cost when faced with this immediate, undeniable reality.
  2.  **The Past is Fixed:** The predictor’s simulation and bomb placement are *historical facts*. The agent's choice *now* cannot retroactively alter the predictor's past action or the bomb's current location. FDT's focus on "what my algorithm *would have done* in the simulation" seems irrelevant to the causal consequences of the choice *now*. The $100 cost for Right is a real, unavoidable price for survival in *this* branch, not a payment influencing a counterfactual simulation that has already concluded and whose outcome (the bomb placement) is known.
  3.  **The Failure of Expected Value (in *this* branch):** FDT justifies taking Left by appealing to the *ex ante* expected value of the algorithm – the policy of "take Left if you see a bomb" performs better across the predictor's simulations because it avoids paying the $100 in the vast majority of cases where the predictor predicts correctly and *doesn't* place a bomb. However, critics contend this is a category error. Rational evaluation must be *context-sensitive*. The *ex ante* expected value of the algorithm is irrelevant to the *ex post* evaluation of the act *in this specific, realized branch* where the prediction was wrong and the disastrous consequence (the bomb) is manifest. In *this* branch, the policy's "better performance" has demonstrably *failed* to materialize; it has led directly to the agent's death. Evaluating the act based on performance in *other* branches where the bomb wasn't placed ignores the catastrophic reality *here and now*.

  The core objection is that FDT, in its zeal for algorithmic optimization across counterfactuals, becomes unmoored from the actual causal landscape the agent inhabits, demanding a sacrifice with no conceivable local benefit.

  **The Updateless Rejoinder: The Sovereignty of the Algorithm**

  FDT proponents counter that the critic misunderstands the fundamental object of rational choice and the nature of the dilemma:

  1.  **The Primacy of the Algorithm:** Rationality, FDT argues, isn't about evaluating isolated acts based on their immediate, local consequences. It's about choosing the best *decision-making procedure* or *algorithm* to implement. The algorithm is the agent's enduring identity across decision problems. When the predictor simulated the agent, she simulated *this very algorithm*. The question isn't "What should I do *now*, given this bomb?" but "What algorithm should I have *been* running, knowing it would face such predictors?" The rational agent chooses the algorithm with the best *overall* performance across the decision problems it encounters (including simulated ones).
  2.  **Counterfactual Performance and Self-Consistency:** The algorithm "Take the box predicted to be empty (Right), unless you directly observe a bomb in Left, then take Left" performs disastrously. If the predictor simulates *that* algorithm, she sees that upon observing a bomb in Left (meaning her prediction of "Right" was correct in the sim), the algorithm takes Left (the bomb) and dies. Therefore, she *correctly* predicts "Right" and places the bomb in Left, leading to death in the real encounter. Crucially, the *only* algorithm that prevents the predictor from *ever* placing a bomb is one that *ignores* the direct observation of the bomb and always takes the box *not* predicted (i.e., takes Left if predicted to take Right). If the predictor simulates *that* algorithm, she sees it takes Left regardless. Therefore, she predicts "Left" and places *no bomb* in Left. The agent then takes Left safely. The algorithm "Always take Left if predicted to take Right" leads to safe outcomes *both* when the prediction is correct (no bomb, take Left) *and* when it's wrong (bomb in Left, take Left and die). Its *only* failure mode is the astronomically rare prediction error. The algorithm that pays the $100 (chooses Right upon seeing the bomb) fails catastrophically whenever the prediction is correct (which is almost always), leading to death.
  3.  **"Updatelessness" as Avoiding Self-Defeat:** FDT argues that "updating" on the observation of the bomb and the predictor's note is self-defeating in this context. Updating means letting the *outcome* of the prediction (the bomb's presence) change your algorithm's behavior in a way that *validates* the predictor's ability to exploit you. By sticking to the pre-committed algorithm ("take Left") even upon observing the bomb, you maintain the *threat* that makes predictors avoid placing bombs in the first place. Updating to "take Right if I see a bomb" tells the predictor (in future simulations or logically, within the counterfactual structure) that her bomb-placement strategy *works* to extort $100. The updateless stance preserves the algorithm's counterfactual power to deter predictors. Paying the $100 is "trading against yourself" – lowering your global score to avoid a locally bad outcome that only exists *because* your algorithm is exploitable.

  FDT contends that focusing solely on the local payoff ignores the logical dependency between the agent's algorithm and the predictor's action. The bomb's presence isn't an independent fact of nature; it's a *consequence* of the predictor's simulation of the *very algorithm* the agent is now considering abandoning.

  **Verdict: Bomb Exposes a Flaw – The Cost of Rigidity When the Die is Cast**

  While FDT's defense is logically coherent within its framework, MacAskill's Bomb exposes a genuine and significant flaw in the *unconditional* application of updateless reasoning: **It mandates catastrophic local sacrifice for the sake of maintaining a counterfactual threat that is rendered *operationally irrelevant* once the predictor's action is fixed and the predictive link is severed.**

  1.  **The Irrelevance of the Counterfactual Threat:** The scenario explicitly states this is a "one-off, isolated encounter." The agent will *never* face prediction again. The deterrent effect of taking the bomb – crucial to FDT's justification – has *no future utility whatsoever*. Sacrificing your life solely to maintain the integrity of a policy for hypothetical future encounters that will never happen is instrumentally irrational. It serves no purpose beyond satisfying an abstract principle divorced from actual consequences.
  2.  **Local Dominance is Absolute and Causal:** Once the bomb is placed (a fixed historical fact), the causal graph is simple: Take Left -> Death. Take Right -> Pay $100 -> Survive. No logical loop connects the *current* choice back to the predictor's *past* simulation. Choosing Right doesn't retroactively cause the bomb to be placed; it was placed *because* of the algorithm's *past* (simulated) behavior. FDT conflates the *evaluation* of the algorithm (which depends on counterfactuals) with the *causal consequences* of the act *in the realized world*. In *this* world, after the prediction is made concrete, the counterfactual power vanishes, leaving only stark local dominance.
  3.  **The Failure of Performance Materializes Here:** The critic's point about *ex post* evaluation is devastating. FDT points to the algorithm's stellar *ex ante* performance. But *in this actualized branch* – the branch where the predictor made a mistake – the algorithm's performance is *catastrophic*: it leads directly to the agent's death. The agent is *experiencing* the failure case. Choosing an act that guarantees experiencing this catastrophic outcome, solely because the algorithm avoids small costs in branches you *aren't* in, prioritizes abstract averages over concrete survival in the only reality that matters to the agent *now*.

  **Conditional Principle: When Updatelessness Should Yield**

  Therefore, the Bomb does expose a flaw: **Unconditional updatelessness can demand agents accept catastrophic, locally dominant losses to maintain counterfactual properties that are causally inert in the specific branch, especially when the predictive interaction is terminal.** The rational response requires a conditional principle:

  *   **The Principle of Local Dominance Under Fixed Prediction and Terminal Interaction:** When (1) a predictor's action based on simulating your decision algorithm is a *fixed historical fact* with observable consequences, (2) your current choice has *no causal influence* on that past prediction or its consequence, (3) *local dominance* exists between your choices (one strictly better *given the fixed state*), and (4) the interaction is *terminal* (no future predictive encounters where the counterfactual threat matters), then rational choice requires selecting the locally dominant act, overriding the updatelessly optimal algorithm.

  In Bomb, all four conditions hold. The predictor's simulation is done, the bomb is fixed and visible, choosing Right pays $100 and lives while Left dies, and it's a one-off. Hence, taking Right is rationally compelled. Updatelessness wins when counterfactuals are live – when your choice *now* logically influences predictions that affect outcomes *now* (e.g., Newcomb's Problem) or in the *future* (ongoing interactions). But in Bomb's frozen moment, after the die is irrevocably cast, clinging to updatelessness is not paying a cost for a greater good; it is adhering to a principle that has become self-destructive ritual, sacrificing the agent on the altar of algorithmic purity when the world has already moved on. The flaw lies in failing to recognize when the counterfactual game is truly over.
