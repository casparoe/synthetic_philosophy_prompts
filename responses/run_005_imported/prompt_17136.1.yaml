prompt: |-
  Ok this is a weird one but I can't shake it. In ML theres this thing called Goodhart's law / "reward hacking" - if you train an agent against a proxy metric instead of the real goal, it'll happily find ways to max out the metric that do nothing for (or actively wreck) the actual goal. Classic real example: OpenAI trained an RL agent on that old boat racing game CoastRunners, and instead of finishing the race it just found a spot to loop forever, crashing into stuff to rack up points.

  Then completely separately I was reading about metaethics and ran into this "wrong kind of reasons" problem, for theories that try to define "good" as something like "its fitting to want/admire this thing." The classic version: a demon says he'll torture you unless you admire a puddle of mud. You now technically have a reason to admire the mud, but everyone agrees that's the WRONG kind of reason - it has nothing to do with the mud, its just an external incentive bolted onto having the attitude.

  These feel like the exact same shape of problem to me (a proxy/incentive standing in for the real target), but I have zero formal philosophy training so I can't tell if thats a real insight or just vibes-based pattern matching. Can you dig into this properly: where does the analogy actually hold up, where does it break down, and is one of these basically a special case of the other, or do they just resemble each other on the surface?
