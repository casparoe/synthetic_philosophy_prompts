  I should break down the implications for conditional analyses first. The core problem is that finks and masks show conditionals aren't sufficient for dispositions. For free will, this means that even if the conditional "if I had chosen differently, I would have acted differently" is true, finks or masks could mean the agent lacks the actual ability. This attacks the compatibilist's ability to ground free will in conditionals alone.

