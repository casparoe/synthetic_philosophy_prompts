  Rawls's biography: His shift from devout Christianity to secular theory shows a personal evolution. His thesis focused on community and sin, which might inform his emphasis on reciprocity and stability. While his later work avoids religious foundations, his early concerns about community might align with valuing social cohesion in political liberalism.

