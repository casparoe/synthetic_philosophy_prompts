  On the proviso and faith-based advocacy: Rawls allows religious reasons in public discourse if secular justifications are provided eventually. For movements like abolitionists or MLK, he argues they met the proviso by appealing to constitutional values. The user's coalition uses scriptural language; they'd need to connect it to public values like justice or dignity. Without that, it might not satisfy Rawls's proviso.

