  Kant's principle of imputing consequences based on what could "foreseeably" result from one's actions is crucial here. If the unpredictability reaches a point where outcomes are no longer reasonably foreseeable, then designers/operators might not be culpable for specific unintended harms. This suggests Kant might acknowledge a responsibility gap for genuinely unforeseeable outcomes.

