  **Justifications:**  
  - **pratyaksa (S):** Direct sensory experience is irreducibly foundational; all other pramanās presuppose it as input.  
  - **anumana (S):** Deductive/inductive reasoning is a distinct cognitive operation, transforming perceptual data into new knowledge.  
  - **sabda (A):** While reducible *theoretically* to inference (trusting the speaker), linguistic comprehension and cultural transmission rely on unique semantic rules.  
  - **upamana (B):** Analogical matching (e.g., "gavaya resembles a cow") collapses to perception + inference (recall + similarity judgment).  
  - **arthapatti (C):** Circumstantial implication (e.g., "fat Devadatta must eat at night") is inference resolving perceived contradictions.  
  - **anupalabdhi (D):** Non-perception of an expected object (e.g., "no pot here") is merely perception of absence + contextual inference.  

  ### Key Rationale (Lab-Tested Perspective):  
  As a chemist, you'll recognize this mirrors instrumental analysis: **S-tier** is your baseline instrumentation (spectroscopy = perception; statistical modeling = inference). **Sabda** is like peer-reviewed literature—technically derivative but *practically* indispensable. **Upamana** resembles calibrating a new sensor against a known standard. **Arthapatti** and **anupalabdhi**? They're troubleshooting protocols—useful heuristics, but reducible to core methods when dissected. The Buddhist reductionists win on parsimony, but Nyāya's sixfold list survives as a pragmatic toolkit for navigating epistemic complexity.
