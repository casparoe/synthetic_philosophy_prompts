  - Counterfactual: "If the cat hadn’t been in the room, it would have been outside" → sensible, as it considers the only alternative  

  *Mechanics*:  
  The divergence stems from how each conditional handles "held fixed" information. Indicatives fix knowledge of actual outcomes; counterfactuals fix past facts and laws. In the bakery, knowing croissants were taken forces the indicative to consider Ben as the only alternative, while the counterfactual must respect Ana's actual presence and Ben's absence.  

  *Reversed case insight*:  
  Indicatives collapse when the antecedent contradicts known facts—they pragmatically imply epistemic possibility. Counterfactuals thrive there because they explicitly override reality.  

  *User's unspoken needs*:  
