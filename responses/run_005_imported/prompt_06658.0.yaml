answer: |-
  Here's a fresh minimal pair set in a mundane office scenario, followed by a **reversed case** where the counterfactual is true and the indicative is defective:

  ---

  ### Standard Minimal Pair (Indicative True / Counterfactual False)  
  **Context:**  
  *Two employees, Maya and Nate, share a printer. Only Maya worked yesterday (Nate was on leave). This morning, you discover the printer is jammed with a specific type of specialty paper that only Maya uses. You don't know who printed last, but you know Maya was the only one present.*  

  1. **Indicative:**  
     "If Maya didn’t jam the printer, Nate did."  
     → **TRUE/ASSERTABLE**  
     *(Given your knowledge, Nate is the only alternative; the printer *was* jammed, so if not Maya, it must have been Nate.)*  

  2. **Counterfactual:**  
     "If Maya hadn’t jammed the printer, Nate would have."  
     → **FALSE/UNASSERTABLE**  
     *(Nate wasn’t there! Holding the actual past fixed, Nate couldn’t have jammed it.)*  

  **What’s doing the work:**  
  - **Indicative:** Tracks *epistemic possibilities* given **current knowledge** (printer is jammed + only Maya/Nate could be responsible). Since Maya’s guilt isn’t *known*, the indicative considers Nate as a live alternative.  
  - **Counterfactual:** Holds **actual past facts fixed** (Nate was absent). Varying Maya’s action doesn’t make Nate magically present.  
  - **Divergence source:** The indicative ignores *how we know the consequent* (the jam *must* be explained), while the counterfactual respects causal/metaphysical constraints.  

  ---

  ### Reversed Minimal Pair (Counterfactual True / Indicative False)  
  **Context:**  
  *A lab has one secure fridge for temperature-sensitive samples. You *know* Sample X is inside because you scanned it this morning. The fridge locks automatically when closed, and no one else has access. Later, you see the fridge door ajar and Sample X degraded.*  

  1. **Indicative:**  
     "If Sample X isn’t in the fridge, it must be on the counter."  
     → **FALSE/UNASSERTABLE**  
     *(You *know* Sample X is in the fridge! The antecedent contradicts your knowledge, making the indicative pragmatically defective.)*  

  2. **Counterfactual:**  
     "If Sample X hadn’t been in the fridge, it would have been on the counter."  
     → **TRUE/ASSERTABLE**  
     *(Holding actual laws/past fixed, the counter is the only possible alternative location. This explains *why* it degraded when the fridge failed.)*  

  **What’s doing the work:**  
  - **Indicative:** Requires the antecedent to be *epistemically possible*. Here, "Sample X isn’t in the fridge" conflicts with known facts, so the conditional feels incoherent.  
  - **Counterfactual:** Antecedent is *known false*, but we suspend reality to explore dependencies. The consequent holds because the counter was the only backup location.  
  - **Divergence source:** Indicatives collapse when antecedents violate knowledge; counterfactuals leverage false antecedents to probe causal dependencies.  

  ---

  ### Key Insights & Why Your Students Struggle  
  1. **The Standard Asymmetry:**  
     Most examples have indicatives true/counterfactuals false because:  
     - Indicatives often exploit *ignorance* (we know the *outcome* but not the *cause*).  
     - Counterfactuals require *certainty* about past facts (e.g., Nate’s absence).  
     **But it’s not necessary!** The reversed case shows counterfactuals can be true when indicatives fail due to *overriding knowledge*.  

  2. **Generating New Pairs:**  
     - **Step 1:** Choose a *known outcome* (e.g., printer jammed, sample degraded).  
     - **Step 2:** Identify two *potential causes* (A or B).  
     - **Step 3:** Make one cause *actually impossible* (e.g., Nate’s absence) but *epistemically live* due to incomplete knowledge.  
     - **Step 4:** For the reversed case, make the antecedent *known false* but the consequent *plausible in a dependency chain*.  

  3. **Why Non-Assassination Examples Are Rare:**  
     - Assassination cases (like Oswald) cleanly separate *knowledge* (we know Kennedy died) from *causal facts* (Oswald acted alone).  
     - Mundane scenarios often lack high-stakes ignorance or metaphysical rigidity. Try domains like **mechanical failures**, **lab errors**, or **baking mishaps** (e.g., "If the yeast didn’t expire, the water was too hot" vs. "If the yeast hadn’t expired..." when you know the yeast was fresh).  

  ---

  ### Exercise Prompt for Students  
  > "Invent a scenario where:  
  > (a) An indicative conditional ('If A didn’t happen, B did') seems true/assertable, but its counterfactual counterpart ('If A hadn’t happened, B would have') seems false.  
  > (b) A counterfactual conditional ('If A hadn’t happened, B would have') seems true, but its indicative counterpart ('If A didn’t happen, B did') seems unassertable.  
  > *Rules: No violence/politics. Use everyday settings (offices, labs, kitchens). Explain why the judgments diverge.*"  

  This forces them to isolate the role of **epistemic access** vs. **metaphysical possibility**—which is the core of the split. The reversed case shatters the myth that indicatives are "always" true when counterfactuals are false.
