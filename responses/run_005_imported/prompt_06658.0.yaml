  - Counterfactual: "If Ana hadn’t taken them, Ben would have" → false because Ben wasn't even there  

  For reversed case: What if we need the counterfactual true and indicative weird? Requires a scenario where the antecedent is known false, but the consequent is independently plausible. Example: A sealed room with a cat. We hear meowing after leaving, so we know the cat is inside. Then:  
