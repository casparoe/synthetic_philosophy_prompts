  Got into it with my friend last night about whether AI image generators (midjourney, DALLE, etc) could ever be doing something we'd seriously call "art," or if its just an incredibly sophisticated remix machine. At some point I brought up this Kant thing from a philosophy class years ago — he had a whole account of "genius" in the Critique of Judgment, something about genius being a talent for producing stuff that can't come from following a rule, and that a genius's work has to be "exemplary" without itself being derived from imitation, plus some separate bit about art needing "spirit" to animate it beyond just being technically correct. I explained it so badly we just gave up and agreed to disagree.

  Can you actually lay out what Kant's real criteria for genius and "spirit" were (the genius vs. imitation distinction, aesthetic ideas, all that), and then reason through what he'd probably conclude about something like a diffusion model? Mainly I want to know how he'd weigh the fact that these models are trained by statistically imitating millions of existing artworks — does that disqualify them from "genius" on his own terms, or could spirit/aesthetic ideas still show up on the output side even if the process itself is basically imitation? Please actually ground this in his framework instead of giving me the standard "is AI art real art" talking points.
