  Okay so this topic has gotten a lot more personal for me over the last few months than I ever expected. I came out to my parents around Easter and it hasn't gone great — my dad's whole position is that there's no actual argument for any of this being okay, it's just "unnatural," and any secular-sounding defense of it is just people rationalizing what they already wanted to do. Then a few weeks later, in the "History of Utilitarianism" seminar I'm taking, my professor mentions almost in passing that Bentham — yes, THAT Bentham, felicific calculus and all — wrote a whole essay around 1785 defending gay sex against criminal punishment, decades before anyone respectable said this stuff out loud, and then hid it in a drawer his whole life because he was scared of what it would do to his reputation. It apparently didnt get published until two centuries later (I think a historian named Louis Crompton dug it out of the archives in the 70s). I found what I could of it online — it's called something like "Offences Against One's Self" — and it's a strange read: he goes after "antipathy" (basically disgust dressed up as a moral reason) as no better than superstition, points out there's no actual injury being done to anyone, brings in how the Greeks and other societies clearly didn't feel the same revulsion, all of which sounds like it should be Mill's harm principle 70-odd years early — except Bentham never quite says the acts themselves are good, only that punishing them can't be justified.

  That gap is what's bugging me, and it's what I want your help thinking through. Is Benthams move here really doing the same work as Mill's harm principle, just cruder and earlier, or is it a different and shakier kind of foundation, since the whole case still rests on how the felicific sums happen to come out rather than on some standing principle of liberty that doesn't care what the tally says on a given day (which seems like it would flip against a minority if enough people's "antipathy" outweighed the pleasure at stake)? Can you write me an essay that gets properly into the weeds of Bentham's actual reasoning in that essay — the antipathy-as-pseudo-principle move, the no-injury argument, the cross-cultural comparisons, and his weirdly cautious refusal to endorse the acts themselves rather than just oppose their punishment — and then weighs whether this adds up to a genuinely stable utilitarian defense of sexual nonconformity or something structurally weaker than a rights-based defense would be? Please don't land on "it's complicated, there's something to both sides" — I've got enough of that from my dad already, I want an actual verdict, one way or the other.
