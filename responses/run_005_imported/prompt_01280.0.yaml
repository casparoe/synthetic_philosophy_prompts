  Ah! This is where it gets juicy. The cardinal could attack on two fronts: First, the epistemological question - what actually counts as "demonstrated" science? Second, the theological danger - if scientists can overrule scripture whenever they feel certain, doesn't that make human reason superior to revelation? 

  I should emphasize how high the stakes were. This wasn't just about astronomy - it touched on the Church's authority to interpret doctrine. The cardinal would care deeply about maintaining that the Church, not scientists, decides when reinterpretation is warranted. 

  For the scene, the cardinal shouldn't deny science's value outright. Instead, he could demand: Where is your actual demonstration? And who decides when it's sufficient to override centuries of biblical interpretation? That framing turns Galileo's distinction against him while acknowledging his intellect. 

  The tidal argument is perfect to mention - Galileo later used it as "proof" though we now know it's flawed. Showing him clinging to weak evidence reveals his human side. The cardinal might say: "You ask us to overturn Scripture based on... mathematics that can't predict tides accurately?" 

