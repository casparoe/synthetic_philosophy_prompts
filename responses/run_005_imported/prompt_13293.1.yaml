answer: |-
  Here’s a set of interview questions designed to challenge your guest while staying philosophically rigorous, with built-in countermoves for predictable deflections. I’ve structured the first three as a progressive sequence, followed by your requested thematic questions with strategic follow-ups.

  ### Core Sequence: The Conceptual Shield
  1.  **Setup/Grant:** "You’ve emphasized that your argument for criminalizing commercial surrogacy, based on Devlin's 'disintegration thesis,' is primarily *conceptual* – about what constitutes a political community's identity – rather than a predictive sociological claim. Could you elaborate on why this conceptual link between shared morality and societal cohesion is fundamental, even absent empirical evidence of collapse?"
      *   *Goal:* Let him establish his core premise unchallenged initially.

  2.  **Pressure:** "If the thesis is purely conceptual and not falsifiable by real-world examples of societies liberalizing morals without collapsing (e.g., on homosexuality, divorce, blasphemy), doesn't this risk making the argument *tautological*? Couldn't one then *always* claim that any challenged moral norm is definitionally essential to cohesion, regardless of actual societal health?"
      *   *Anticipated Deflection:* "It's about the *type* of norm/loss of *fundamental* morality."  
      *   **Follow-Up:** "What criteria determine which moral norms are *constitutive* of societal identity versus those that aren't? Why is commercial surrogacy specifically in the 'constitutive' category, especially when many societies function without banning it?"

  3.  **Falsifiability Challenge:** "You've said pointing to stable liberalized societies 'misses the point.' What evidence *would* count against your view? If observable societal stability despite moral change doesn't challenge it, and predicted collapse *would* support it, what could *falsify* the claim that a specific moral norm is essential for societal cohesion?"
      *   *Goal:* Force engagement with empirical reality or reveal non-falsifiability.
      *   *Anticipated Deflection:* "It's not about collapse, it's about a *change in kind* of community/loss of *shared identity*."  
      *   **Follow-Up:** "If the change isn't measurable by stability or function, how do we objectively identify when this 'loss of shared identity' or 'disintegration' has occurred? Isn't this vulnerable to being declared whenever a moral conservative *feels* society has changed?"

  ### Thematic Questions with Strategic Follow-Ups

  4.  **Grounding Law in Disgust/Intolerance:** "Devlin argued that a society's profound feelings of 'intolerance, indignation, and disgust' toward a practice are sufficient grounds for criminalization, even absent direct harm. Historically, these very feelings justified laws against interracial marriage, homosexuality, and blasphemy – laws we now widely recognize as rooted in prejudice. Why should these powerful emotions be trusted as a legitimate basis for law today?"
      *   *Anticipated Deflection:* "Those were *mistaken* moral judgments; our current disgust/indignation reflects *correct* morality."
      *   **Follow-Up:** "How do we reliably distinguish between 'correct' moral indignation grounding legitimate law and 'mistaken' indignation rooted in prejudice? Doesn't Devlin's framework, by privileging *felt* intensity, inherently lack a mechanism for this distinction, potentially legitimizing future prejudices?"

  5.  **Positive vs. Critical Morality (Hart's Challenge):** "H.L.A. Hart argued Devlin fatally conflates a society's existing 'positive morality' (what people *happen* to believe) with 'critical morality' (what is *justifiably* moral). Why should the law defer to possibly irrational, uninformed, or prejudiced *popular* sentiment rather than requiring a *defensible moral justification* based on harm, justice, or autonomy?"
      *   *Anticipated Deflection:* "The shared positive morality *is* constitutive; critical morality is abstract and doesn't bind the community."
      *   **Follow-Up:** "If the law defers solely to positive morality, doesn't it lose its critical function and become merely an enforcer of the status quo, potentially entrenching injustice? How does this differ from might-makes-right?"

  6.  **The Problem of False Consensus (Dworkin's Challenge):** "Ronald Dworkin contended that much apparent 'moral consensus' is illusory – it can be prejudice, unthinking tradition, reaction to false factual beliefs (e.g., 'surrogacy is always exploitative'), or people parroting authority figures. If the 'shared morality' the law is meant to protect might be built on such shaky foundations, how can criminalizing based on it be justified?"
      *   *Anticipated Deflection:* "The intensity and widespread nature of the feeling (disgust, indignation) indicates a deep, genuine moral conviction central to identity."
      *   **Follow-Up:** "But hasn't history shown that intense, widespread disgust (e.g., towards interracial relationships) *can* be precisely the product of prejudice and false belief? If intensity alone is the signal, how do we avoid codifying collective moral panic?"

  ### Additional Probing Questions

  7.  **Pluralism & Coercion:** "Modern liberal democracies are characterized by deep moral pluralism. Doesn't using the criminal law to enforce *one specific moral view* about family, reproduction, or markets (especially when no direct harm is proven) undermine the very tolerance and mutual respect needed for diverse individuals to coexist as a community? Isn't this coercive imposition potentially *more* divisive than tolerating the disputed practice?"
  8.  **The Surrogacy Specifics:** "Let's apply this concretely. You argue commercial surrogacy corrodes shared morality. What *specific* moral value(s) is it corroding? (e.g., dignity of reproduction? the value of non-commercial family bonds?) And why is criminalizing the *commercial* aspect essential to protect this value, compared to, say, robust regulation ensuring consent, fair pay, and healthcare?"
  9.  **Alternatives to Criminalization:** "Even if one accepts that shared moral norms are vital, why is the *criminal law* the necessary or best tool to protect them here? Couldn't other mechanisms – education, cultural discourse, non-criminal regulations, social support for families – promote the values you care about without resorting to state punishment and the significant burdens of criminalization?"
  10. **The Slippery Slope / Scope:** "Devlin's principle, if accepted, seems broad. Where do you draw the line? What other currently legal practices might similarly be argued to 'corrode shared morality' essential to community identity? Should they also be criminalized? How do we avoid a constant expansion of criminal law into private moral life?"

  ### Interview Strategy Tips
  *   **Listen Actively:** Pay close attention to *how* he answers Q1-3. His exact phrasing will inform the best wording for your follow-ups.
  *   **Control the Pace:** Don't let monologues dominate. Politely interject: "That's helpful context, but to focus back on my specific question about X..." or "Before we move on, could you clarify Y point you just made?"
  *   **Use His Language:** Paraphrase his key terms ("constitutive norm," "shared identity," "disintegration") back to him when pressing, showing you're engaging precisely with *his* framework.
  *   **Bridge to Themes:** After the core sequence, use a transition like: "Let's explore some broader implications of grounding law this way, particularly concerning the risks of prejudice and the nature of moral consensus..."
  *   **Stay Calm & Curious:** Frame challenging questions as seeking deeper understanding: "I'm trying to grasp how your view handles this objection..." or "Help me see why this historical concern doesn't apply..."

  This structure gives you a clear path to challenge the core defense mechanism, hit the major philosophical objections, and have countermoves ready, ensuring a dynamic and critical conversation beyond a standard lecture recap. Good luck with the episode!
