  Timeline is straightforward: vote at the meeting, then disburse within two weeks. Including a review next year shows they're open to reevaluating as new evidence emerges. 

  I need to ensure the memo explains why the split is recommended despite cluelessness. Emphasize that while long-term effects are uncertain, AMF's immediate impact is clear, and the pooled fund's potential justifies a smaller allocation. This balances evidence-based action with hedging against existential risks. 

