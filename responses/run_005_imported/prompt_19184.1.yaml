  Another angle: decision-making under uncertainty. When predictions are unreliable, maybe the club should prioritize robustness. AMF has proven effectiveness in immediate lives saved, which is tangible. The pooled fund's impact is more speculative. However, if existential risks are real, even small reductions could have massive expected value. But cluelessness undermines those calculations.

