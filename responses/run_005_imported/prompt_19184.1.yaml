  ## Pre-Vote Memorandum: FY24 Fund Allocation Decision  
  **To:** Effective Altruism Club Members  
  **From:** [Your Name], Club President  
  **Date:** [Current Date]  
  **Subject:** Recommendation for $2,900 Disbursement & Addressing the "Cluelessness" Objection  

  ---

  ### **Background**  
  We raised **$2,900** this year through our bake sale, trivia night, and a matching pledge. For the past two years, 100% was allocated to the **Against Malaria Foundation (AMF)** due to its exceptional near-term cost-effectiveness in saving lives via bednet distribution. This year, a proposal was made to allocate **1/3 (~$967) to a pooled fund for AI safety/biosecurity** (e.g., Longview’s Philanthropic Fund or FTX Future Fund’s successor), with the remainder to AMF.  

  ### **The Cluelessness Challenge**  
  A key objection raised was **cluelessness**: the idea that we cannot reliably compare long-term impacts (e.g., bednets vs. AI safety) because their causal chains fan out into unpredictable, high-stakes futures. Crucially:  
  - **AMF isn’t "safe" from cluelessness**. Saving lives *now* affects future population, governance, and technological development in ways we cannot model.  
  - **Existential risk (x-risk) interventions aren’t uniquely clueless**. While their mechanisms are less direct, their *potential* impact (reducing risks to humanity’s long-term potential) is vast.  

  This leaves us with three approaches:  
  1. **Default to near-term evidence**: Prioritize AMF because its impacts are measurable now.  
  2. **Embrace high-uncertainty/high-upside bets**: Allocate to x-risk, accepting that cluelessness undermines *all* comparisons.  
  3. **Diversify to mitigate cluelessness**: Split funds to avoid overcommitting to one imperfectly understood impact pathway.  

  ---

  ### **Recommendation: 75% AMF / 25% Pooled X-Risk Fund**  
  After reviewing the evidence and objections, **I propose allocating:**  
  - **$2,175 (75%) to Against Malaria Foundation**  
  - **$725 (25%) to a pooled AI safety/biosecurity fund** (e.g., Longview’s fund, evaluated for transparency and grantee track record)  

  #### **Why This Split?**  
  1. **Cluelessness demands humility, not paralysis**:  
     - While we *cannot* precisely quantify long-run effects, we *can* act on robust, asymmetric evidence:  
       - AMF demonstrably saves lives today with high confidence (~$5,000/life saved).  
       - X-risk reduction, while harder to measure, could protect orders of magnitude more lives *if* risks are non-negligible (e.g., 1% reduction in x-risk could save millions of future lives).  
     - A split acknowledges that both near-term and long-term efforts have moral weight we cannot confidently compare.  

  2. **Avoiding worst-case cluelessness failures**:  
     - Overweighting near-term work risks neglecting existential threats we *know* could dominate humanity’s future.  
     - Overweighting speculative x-risk work risks diverting resources from proven interventions while evidence is still developing.  
     - A 75/25 split balances these concerns while respecting AMF’s proven track record.  

  3. **Procedural fairness**:  
     - This honors past support for AMF while accommodating new perspectives on x-risk.  
     - It sets a precedent for annually reevaluating our allocation as evidence evolves.  

  ---

  ### **Timeline for Disbursement**  
  - **Thursday’s Meeting**: Vote on allocation (2/3 majority required to change from 100% AMF).  
  - **May 30**: Funds transferred electronically to designated organizations.  
  - **June 6**: Email confirmation of transfers sent to all members.  

  ---

  ### **Key Questions for Discussion**  
  1. Does the 75/25 split adequately address cluelessness by diversifying our "moral portfolio"?  
  2. Are there alternative frameworks (e.g., **robust decision-making**, **minimizing predictable regret**) that better handle cluelessness?  
  3. Should we prioritize **learning** (e.g., funding a member to analyze x-risk charities) over immediate allocation?  

  ---

  ### **Voting Procedure**  
  - Vote 1: Maintain 100% AMF allocation (requires <2/3 support to pass).  
  - Vote 2: If Vote 1 fails, vote on 75/25 split (AMF/x-risk).  
  - Per bylaws, no amendments from the floor.  

  **Let’s make a thoughtful choice—not a perfect one—with the evidence we have.** Looking forward to a rigorous debate on Thursday.  

  *Recommended pre-meeting reading:*  
  - [Cluelessness (Greaves, 2016)](https://globalprioritiesinstitute.org/wp-content/uploads/2016/06/Hilary-Greaves-Cluelessness.pdf)  
  - [AMF Cost-Effectiveness Analysis (GiveWell)](https://www.givewell.org/charities/amf)  
  - [Case for Longview’s Fund](https://funds.longview.org/philanthropic-fund)  

  // End //
