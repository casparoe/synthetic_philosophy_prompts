answer: |-
  Here’s a toast that threads the needle—rigorous for philosophers, heartfelt for all, and true to the weight of the vow. (Timing: ~5 mins delivered with pauses)

  ---

  **(Raise glass, smile warmly)**  
  "Hello everyone. For those who don’t know me—I’m the groom’s future brother-in-law, and the bride’s slightly terrified sibling. My sister asked me to speak today because, in her words, I ‘explain things for a living.’ What she didn’t mention is that *she* spends her life dissecting questions that make rocket science look easy. Like: **Why do promises hold us?**  

  *(Lean in conspiratorially)*  
  Now, if you’re one of the thirty percent here who’ve debated this over lukewarm coffee in a seminar room—relax. I won’t reduce her life’s work to ‘just be sincere!’ or ‘it’s tradition!’ She’d haunt me through every family dinner.  

  *(Pause, turn to the couple)*  
  But for the other seventy percent? Let me translate. Philosophers have wrestled for centuries with why ‘I promise’ isn’t just nice words. My sister’s spent a decade arguing it’s **not magic**, and **not just useful habit**—like how we all agree to drive on the same side of the road.  

  *(Gentle shift in tone)*  
  Her favorite answer comes close to this: **A promise is sacred because someone *chooses* to lean on you.** You say, ‘I need you,’ and they reply, ‘Build your life on me. I won’t crumble.’ It’s not about rules. It’s about **inviting trust**, then honoring that fragile, breathtaking gift.  

  *(Smile at the couple)*  
  Which is why—when I think about these two—the philosophy fades. Because you don’t need a lecture to see how they live this truth.  

  *(To the groom)*  
  [Groom’s Name], when she was writing her book on Scanlon? You brought her chai at 2 a.m. and didn’t flinch when she ranted about ‘relational moral injury.’ That’s not convention. That’s seeing her exhausted, and saying: *‘Lean harder.’*  

  *(To the bride)*  
  Sis, when he quit his job to go back to school? You rearranged your tenure-track chaos to say: *‘I’m your landing pad.’* That’s not social utility. That’s love saying: *‘Let me be useful to *you*.’*  

  *(Open posture to room)*  
  That’s the secret, isn’t it? Their promises work because they’re **not conjuring obligation from thin air**. They’re **recognizing what’s already there**.  

  *(Pause, quieter)*  
  David Hume—the ‘it’s just useful’ guy—was half-right. Society *does* need promises. But Scanlon—the ‘you invited their trust’ guy—gets the heart. Because what’s ‘useful’ to my sister and [Groom] isn’t abstract society. It’s **each other**.  

  *(Raise glass higher)*  
  So here’s to two people who don’t need magic words. Who know vows aren’t incantations, but **choices made visible**. Who prove every day that the ‘why’ behind ‘I promise’ isn’t in a book—it’s in bringing the chai. In being the landing pad. In saying, *‘I see the weight of your hope, and I’ll carry it with you.’*  

  **(Full voice, warm)**  
  To [Bride] and [Groom]: May your promises always feel as inevitable, as necessary, and as undramatic as breathing. And may we all be lucky enough to witness how beautifully you keep them. Cheers!"  

  ---

  ### Why This Works
  1. **Satisfies Philosophers**: Name-checks Hume/Scanlon accurately, uses terms like "relational moral injury" correctly, doesn’t dodge the dispute.  
  2. **Engages Non-Philosophers**: Translates jargon into emotional stakes ("lean on you," "landing pad"), uses humor ("terrified sibling," "lukewarm coffee").  
  3. **Centers the Couple**: Their specific acts (chai, career support) *show* the philosophy in action.  
  4. **Gets to Truth**: Reconciles Hume/Scanlon by grounding "usefulness" in their *personal* world—not abstract society.  
  5. **Warmth Over Lecture**: The academic framing is self-deprecating (the "explainer" role), then pivots fast to love.  

  **Delivery Tip**: Practice the pauses. Let laughs land after "haunt me through family dinners" and "ranted about relational moral injury." Slow down at "choices made visible." End with solid eye contact with the couple.  

  This toast honors your sister’s mind, her heart, and the guests who know her in both worlds. You’ve got this.
