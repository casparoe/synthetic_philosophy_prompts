answer: |-
  Your son-in-law's reasoning hinges on the expected value calculation, which mathematically appears positive: \(0.5 \times 1.5 + 0.5 \times 0.6 = 1.05\), suggesting a 5% average growth per trade. However, this approach ignores critical aspects of **risk, compounding, and the distribution of outcomes**, leading to a dangerous paradox. Here's why:

  ### 1. **The Flaw in Arithmetic Mean vs. Geometric Mean**:
     - The expected value (arithmetic mean) calculates the average outcome if the experiment were repeated infinitely, but it weights extreme outcomes disproportionately. In trading, wealth compounds multiplicatively, so the **geometric mean** (which accounts for compounding) is more relevant for long-term growth.
     - The geometric mean return per trade is:
       \[
       \sqrt{1.5 \times 0.6} = \sqrt{0.9} \approx 0.9487,
       \]
       implying an average **decay** of about 5.13% per trade. This means the typical outcome is wealth erosion, not growth.

  ### 2. **Skewed Distribution and Risk of Ruin**:
     - Your simulation reveals the core issue: while the average ending balance is high (130×), **over half of the traders lose >99% of their wealth**. The average is inflated by a few extreme winners (e.g., those with an improbable streak of wins), but most paths lead to near-total loss.
     - Why? A 40% loss requires a 66.7% gain just to break even (\(1 / 0.6 \approx 1.667\)). As losses compound, recovery becomes mathematically improbable. After 100 trades, the median outcome is catastrophic loss, even if the mean is positive.

  ### 3. **Ergodicity Breakdown**:
     - In physics terms, this violates **ergodicity**: the time-average outcome for a single trader (median path) differs vastly from the ensemble average (mean of all paths). For your son-in-law (a single trader), the likely outcome is ruin, not the "expected" 130× gain.

  ### 4. **Kelly Criterion: The Rational Alternative**:
     - Rational investors maximize long-term growth by optimizing the **expected logarithm of wealth** (Kelly criterion). For a bet with 50% win probability, a 50% gain, and a 40% loss, the optimal fraction of wealth to bet is:
       \[
       f^* = \frac{p}{a} - \frac{1-p}{b} = \frac{0.5}{0.4} - \frac{0.5}{0.5} = 1.25 - 1 = 0.25,
       \]
       where \(a = 0.4\) (loss fraction) and \(b = 0.5\) (gain fraction).  
     - Betting 25% per trade balances growth and risk. The expected growth rate is:
       \[
       0.5 \ln(1 + 0.25 \times 0.5) + 0.5 \ln(1 - 0.25 \times 0.4) \approx 0.5 \ln(1.125) + 0.5 \ln(0.9) > 0.
       \]
       This avoids ruin and yields positive long-term growth.

  ### Why He’s Wrong:
  - **Going all-in every trade is irrational**: It ignores compounding asymmetry (losses hurt more than gains help) and guarantees eventual ruin with near-certainty. The "positive expected value" is a mirage for a single trader.
  - **Psychology vs. Math**: Even if he accepts the risk, the strategy is mathematically unsustainable. No finite wealth can withstand infinite all-in bets with asymmetric downside.

  ### Conclusion:
  Your son-in-law is conflating **ensemble averages** (which are positive) with **individual outcomes** (which are likely disastrous). While the expected value calculation is mathematically correct, it’s irrelevant for a single actor making repeated bets. He’s missing the central tenet of **risk management**: preserving capital. By betting his entire stake each time, he’s virtually guaranteeing long-term failure, despite the allure of the arithmetic mean. Advise him to use the Kelly fraction (25% per trade) to maximize growth while avoiding ruin. If he insists on all-in bets, he’s relying on luck, not rationality.
