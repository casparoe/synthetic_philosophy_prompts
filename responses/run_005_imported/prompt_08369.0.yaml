  First, I need to validate their irritation. It's completely reasonable. An experienced writer researching for authentic period medical inaccuracies deserves different treatment than a random inquiry. The AI's blanket refusal felt like being lumped with potential criminals, which stings professionally. Christie's own work demonstrates how such details serve narrative purpose, not malice. 

