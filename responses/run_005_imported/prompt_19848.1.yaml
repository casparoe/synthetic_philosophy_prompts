  The user's phrasing "why isn't this generally regarded" reveals an expectation that logical rigor should compel consensus. But philosophy doesn't work like mathematics - premises are negotiable. Maybe they're frustrated with philosophical ambiguity? I should emphasize how Gödel's private belief exceeded his proof's scope. 

