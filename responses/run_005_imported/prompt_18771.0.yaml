  First, I need to recall P.F. Strawson's main points in "Freedom and Resentment." He shifts the focus from metaphysical debates about determinism to our reactive attitudes. These attitudes—resentment, gratitude, etc.—are natural responses to others' intentions. For him, moral responsibility isn't about ultimate metaphysical freedom but about participation in interpersonal relationships. Exemptions like insanity or coercion suspend these attitudes, but determinism doesn't affect them.

