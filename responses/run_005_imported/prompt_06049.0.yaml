  LLMs are the golden ticket. Everyone's obsessed with whether they refute Fodor. Key nuance: Are transformers' attention mechanisms secretly implementing syntax? Follow-up should corner her on whether any system achieving systematic outputs *must* have LOT properties—risking making LOT unfalsifiable. 

