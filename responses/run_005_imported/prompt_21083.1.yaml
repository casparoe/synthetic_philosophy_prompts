  Okay, the user is writing a piece about how AI alignment researchers are borrowing ideas from moral philosophy. They specifically mention Eliezer Yudkowsky's Coherent Extrapolated Volition (CEV) concept and its resemblance to idealized-preference theories by philosophers like Brandt and Railton. The user wants me to argue that CEV suffers from the same core weakness critics like David Sobel pointed out: that over-idealization strips away what makes preferences genuinely belong to the original person (or humanity).

  First, I need to recall Sobel's critique. He argued that when you idealize preferences by removing ignorance and irrationality, you risk altering the person's identity. Preferences formed under full information might not be "theirs" anymore. How does this apply to CEV? CEV aims to extrapolate what humanity would want if we knew more, thought better, and resolved disagreements. But if you remove all flaws, what's left? Humanity's identity is tied to its current messy state. So CEV's output might not reflect humanity but some hypothetical agent.

  Then there's the interpersonal aspect. CEV isn't just one person but all of humanity. How do you aggregate idealized preferences? The problem of disagreement is huge. Even after idealization, conflicts might remain. Converging these into a single will could erase pluralism, which is central to humanity. This step might make the problem worse because it adds another layer of abstraction, moving further from actual people's preferences.

  The user also asks if the interpersonal step could dissolve the issue. Maybe convergence happens naturally after idealization? But critics would say that expecting consensus is unrealistic. Forcing convergence might impose uniformity, ignoring diversity. The risk of arbitrariness in the aggregation method is high. Who decides how to merge preferences? That introduces bias, making the result less authentically humanity's.

  I should also consider the user's deeper needs. They're writing a critical piece, so they likely want a strong, nuanced argument. They might need to show that importing philosophical ideas without addressing their flaws is problematic. Highlighting Sobel's critique in the context of CEV's interpersonal complexity strengthens their point. Emphasizing that aggregation exacerbates the identity problem rather than solving it would be key. They might also want to address potential counterarguments, like convergence under idealization, to preempt objections.

  Need to structure the argument: explain Sobel's critique, apply it to CEV, discuss the interpersonal complication, argue it worsens the problem, refute dissolution attempts, and conclude that CEV risks creating a hypothetical agent. Make sure to tie it back to the philosophical roots and the implications for AI alignment.
answer: |-
  Here's an argument that CEV inherits Sobel's core critique against idealized preference accounts, and that the necessary interpersonal convergence step significantly exacerbates the problem rather than dissolving it:

  1.  **Sobel's Core Critique Against Idealized Preferences: The Problem of Alienation**
      *   Sobel (and others like Bernard Williams) argued that heavily idealized preferences (e.g., "what I would want if I were fully informed and rational") risk becoming *alien* to the actual agent.
      *   The process of stripping away ignorance, cognitive biases, emotional attachments, inconsistencies, and context-specific motivations doesn't just *refine* the agent's existing preferences; it potentially *replaces* them with preferences generated by a fundamentally different cognitive entity.
      *   The "idealized me" is not "me" anymore. My identity, values, and even core preferences are often constitutively tied to my specific history, limitations, emotional makeup, and the messy process by which I formed them. Removing all flaws doesn't reveal my "true self"; it creates a *new* self whose preferences bear an uncertain relationship to mine.
      *   **Result:** The "good" defined by these idealized preferences may not be recognizably *mine*. It belongs to a hypothetical, idealized agent who shares my name but little of what makes me, *me*.

  2.  **CEV Directly Inherits This Alienation Problem:**
      *   **The Idealization Step:** CEV explicitly requires idealizing *each individual* within humanity: "if they knew more, thought faster, were more the people they wished they were, had grown up farther together." This mirrors the Brandt/Railton idealization perfectly.
      *   **The Alienation Risk:** Subjecting individuals to this level of cognitive and moral enhancement fundamentally alters who they are. Their extrapolated volitions are generated by entities vastly more knowledgeable, rational, and potentially morally "better" than any actual human. As Sobel would argue, the preferences of this "enhanced me" may be unrecognizable to the actual me. What *they* want might have little connection to what *I* value, rooted in my actual experiences, limitations, and current identity.
      *   **"Humanity" as the Victim:** CEV aims for "humanity's" CEV. But if the idealized volitions of individual humans are potentially alien to their actual selves, aggregating them doesn't magically solve this. The aggregate "volition" belongs to a collection of hypothetical, alien individuals, not to actual humanity in its current, flawed state. The output risks reflecting the preferences of a *different species* – hyper-rational post-humans – rather than anything meaningfully "ours."

  3.  **The Interpersonal Convergence Step Exacerbates the Alienation Problem:**
      *   **The Core Challenge:** CEV doesn't stop at idealized individual volitions; it demands finding a *single, coherent* volition extrapolated across *all* idealized individuals. This introduces massive complexity.
      *   **Why It Makes Things Worse:**
          *   **Amplification of Alienation:** The alienation isn't just from one's *own* idealized self, but from the *aggregated* volition of *billions* of idealized selves. The final CEV is twice removed: first by individual idealization, then by aggregation. The resulting "will" is even less likely to be recognizable or acceptable to any *actual* individual human or group.
          *   **The Illusion of Convergence:** The hope is that idealization naturally resolves disagreement ("farther along together"). This is a huge, unsupported assumption. Idealized, hyper-rational individuals might still fundamentally disagree on core values (e.g., utilitarianism vs. deontology, radical egalitarianism vs. meritocracy, the value of art vs. pure knowledge, the meaning of flourishing). Resolving *these* disagreements requires forcing a consensus where none naturally exists.
          *   **The Arbitrary Aggregation Problem:** *How* is convergence achieved? Averaging? Finding overlapping commitments? Selecting the "most rational" view? This process is inevitably arbitrary and value-laden. The chosen aggregation method *itself* imposes an external structure, further divorcing the final CEV from any authentic connection to the actual (or even individually idealized) preferences of humans. It becomes a construct of the aggregation algorithm, not a discovery of a pre-existing "will."
          *   **Erasure of Pluralism:** Humanity's essence includes its profound pluralism – diverse, often conflicting values and ways of life. Forcing convergence into a single coherent volition inherently *flattens* this pluralism. The resulting CEV might represent a bland, averaged, or tyrannical (by one dominant idealized view) outcome that erases the very diversity that characterizes humanity. Sobel's alienation becomes alienation from one's *distinct* values within the homogenized whole.
          *   **The "Hypothetical Agent" Becomes Concrete:** The final CEV isn't just *like* the preferences of a hypothetical agent; it *is* the preference of a hypothetical agent – an agent defined by the *combination* of extreme individual idealization and a specific (but undefined and arbitrary) method of aggregating those idealized viewpoints. This agent bears little resemblance to actual collective humanity.

  4.  **Does Interpersonal Convergence Dissolve the Problem? Counterarguments Rebutted:**
      *   **Argument: "Idealization reveals shared core values."** Critics argue there's no guarantee idealization reveals *shared* values rather than *different* values held more firmly. Deep value pluralism might persist or even intensify. Convergence isn't automatic.
      *   **Argument: "The process respects the 'seed' of humanity."** CEV proponents suggest starting from current values. But Sobel's point is that radical idealization *transforms* the seed beyond recognition. The "seed" (current messy humanity) is arguably necessary for the plant (our values) to be *ours*; replacing it with a perfected seed grows a different plant.
      *   **Argument: "It's the best we can do."** This is pragmatic but doesn't negate the philosophical weakness. It concedes that CEV *might* output something alien, but hopes it's close enough. Sobel's critique highlights the deep uncertainty and potential disconnect.

  **Conclusion:**

  CEV directly inherits Sobel's central critique: the radical idealization required to form "coherent extrapolated volitions" risks creating preferences that are alien to the actual agents whose volitions are being extrapolated. The preferences belong to hypothetical, post-human individuals, not to us.

  The necessary step of finding interpersonal convergence across billions of these idealized individuals **significantly worsens this problem.** It introduces the immense challenge of resolving potentially persistent fundamental value disagreements through an arbitrary aggregation process. This forces a homogenized outcome that erases human pluralism and creates a single volition belonging to a *new* hypothetical agent – the product of the idealization and aggregation process itself – rather than belonging meaningfully to humanity as it exists. Far from dissolving the alienation problem, the interpersonal step amplifies it, making the final CEV even less likely to be recognizably "humanity's" volition in any authentic sense. CEV thus risks building an AI aligned not with *us*, but with a philosophical construct bearing our name.
