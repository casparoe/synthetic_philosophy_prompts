  Looking at move (1): Dave's claim that this is textbook Fricker makes sense at first glance - dismissing a Deaf person's testimony due to prejudice fits the definition. But Fricker requires actual identity prejudice, not just skepticism about a specific skill. I'd score this moderately positive but not perfect.

