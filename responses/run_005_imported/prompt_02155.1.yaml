answer: |-
  ## The Commitment Cascade

  Silas Vance, CEO of Helios Mining Consortium, stared at the holographic projection hovering above his obsidian desk. A single, crimson asteroid – designated Erebus-7 – spun slowly, its surface pockmarked and glittering with the telltale signature of rare-earth lanthanides. A trillion-dollar prize. And currently, dead-center in the crosshairs of a rival drone swarm controlled by Selene Dynamics.

  "Status, Anya?" Silas's voice was tight, the controlled calm of a man standing on the edge of a precipice.

  Anya Rostova, his Chief Strategist, manipulated the projection. A cluster of blue dots – Helios’s *Themis*-class mining drones – pulsed near Erebus-7. A matching cluster of hostile red dots – Selene’s *Janus*-drones – fanned out on the opposite side. The buffer zone between them was shrinking by the minute. "Selene’s drones are entering optimal mining formation, Silas. They’re locking onto the richest veins. Our window for uncontested claim-staking is closing. Minutes, maybe."

  Silas rubbed his temples. This was the nightmare scenario outlined in a hundred theoretical papers. Two rational actors, converging on a scarce, high-value resource. Communication, hampered by the light-speed lag between Earth and the asteroid belt, was agonizingly slow. A message to Selene’s CEO, Kael Thorne, and back, would take nearly an hour. An hour in which Selene’s drones could solidify their claim, maneuvering into positions that would make Helios’s own operations impossible without triggering a catastrophic collision – a mutually assured destruction of hardware and profits.

  The temptation was visceral, a cold serpent coiling in his gut: **Commit. Now.** Helios drones possessed the "Aegis Lock" protocol. Once activated, their mining trajectories became absolutely immutable. They would bore into Erebus-7 with programmed, unyielding determination, carving out Helios’s claim like a declaration etched in stone. The beauty of Aegis Lock was its Schelling Point power: it was *credible*. Selene, seeing Helios drones irrevocably committed, would *have* to yield. The cost of collision would be astronomically higher for both sides than simple concession. *He who locks first, wins.*

  But the counter-argument was equally stark, echoing in his mind like a warning klaxon: **What if Kael is thinking the same thing? Right now?** If both activated their lock protocols simultaneously, unaware of the other's irrevocable move, the result wouldn't be concession; it would be a meticulously planned, billion-dollar train wreck in the void. Two fleets of unstoppable automatons ploughing into each other and the prize, reducing everything to spinning debris. The ultimate prisoner's dilemma, played out with real metal and real money.

  "Anya," Silas said, his eyes fixed on the converging dots. "Probability analysis. What are the chances Thorne activates *his* lock protocol in the next five minutes?"

  Anya’s fingers flew over her console, feeding in variables: Thorne’s known risk tolerance (high), Selene’s recent financial pressures (extreme), the sheer value of Erebus-7 (unprecedented), the communication delay (crippling). The hologram flickered, spitting out a number that made Silas’s blood run cold. "Seventy-two percent, Silas. And rising."

  *Seventy-two percent.* The serpent tightened its coils. Waiting meant likely surrender. Acting *now* meant probable victory... unless that seventy-two percent became one hundred. Unless Kael Thorne, sitting in his own high-tech sanctum millions of kilometers away, was staring at a similar screen, listening to a similar strategist giving him a similar terrifyingly high probability that *Silas Vance* was about to lock in.

  **< < SELENE DRONES INITIATING PRECISION MANEUVER SEQUENCE. PROXIMITY ALERT: SECTOR GAMMA-9. >>** The AI’s voice was calm, devastating.

  On the projection, the red dots surged forward, closing the buffer zone dramatically. They weren't locking yet, but they were positioning themselves to do so instantly, maximizing their claim and making Helios’s position untenable.

  "Sir," Anya whispered, urgency cracking her professional facade. "If they lock in *that* formation... we lose Erebus. Period. Our options evaporate."

  The weight of the trillion dollars, the pressure from Helios’s board, the specter of losing to Kael Thorne – the man who’d stolen the Ceres contract out from under him five years ago – crashed down. The rational fear of mutual destruction warred with the primal urge to seize the advantage, to *be* the one who forced the other to blink. The commitment race wasn't just theoretical; it was a countdown screaming in his skull.

  *First mover wins. Hesitation loses. He’s going to do it. He has to be doing it.*

  Silas’s hand hovered over the physical override switch for the Aegis Lock protocol – a deliberate design choice, requiring a conscious, irrevocable human act. His finger trembled. One push. One push and Helios wins. Or one push, and they both plunge into the abyss.

  ---

  Kael Thorne watched the same dance unfold on his own holodisplay aboard the Selene Dynamics command station *Luna's Shadow*. His strategist, Erik, mirrored Anya’s tension.

  "Helios drones are holding position, but their energy signatures are spiking, Kael," Erik reported. "They're powering up their core drills. Prepping for deep-strike claim initiation. If they lock in before we do..."

  Kael knew the math. Vance was ruthless. Ambitious. Scarred by past losses. The communication lag wasn't just a delay; it was a black hole of uncertainty. Vance *could* be sending a conciliatory message right now, proposing a split. Or, far more likely, he could be ordering the Aegis Lock, betting that Kael would flinch.

  Kael’s "Janus Protocol" – Selene’s equivalent of the Aegis Lock – was a neural command sequence. He only needed to *think* the authorization code clearly. Then, Selene’s claim would be unassailable. Vance would have to back down or face mutual annihilation.

  "Probability Vance locks in the next three minutes?" Kael asked, his voice a low growl.

  Erik’s analysis was swift. "Eighty-one percent, sir. His drones are primed. He’s out of time. *We’re* out of time. If he locks first, he dictates the terms."

  The image of Silas Vance’s smug face after the Ceres deal flashed in Kael’s mind. He couldn’t lose again. Not like this. Not to *him*. The pressure to act, to seize the initiative before Vance could steal it, was a physical force. The commitment race demanded speed. Deliberation was a luxury that guaranteed second place. Second place meant losing Erebus-7.

  *He’s locking. He must be locking. Do it NOW.*

  **< < HELIOS DRONE FORMATION SHIFT DETECTED. PATTERN MATCHES PRE-LOCK STAGING. >>** Selene’s AI announced.

  It was the final trigger. The blue dots weren't just holding; they were coiling like vipers about to strike. Kael saw the trillion dollars slipping away, saw Vance’s victory, saw his own ruin. The rational fear of mutual destruction was drowned out by the deafening roar of the race. The need to commit first was everything.

  *First mover wins. Hesitation loses.*

  Kael closed his eyes. Took a breath. Focused his mind. The neural authorization code – a sequence of primes – flashed through his consciousness. **<< JANUS PROTOCOL: ENGAGED. TRAJECTORIES LOCKED. IRREVOCABLE. >>**

  Simultaneously, millions of kilometers away, Silas Vance saw Selene’s red dots snap into rigid, perfectly optimized mining vectors on his display. The Janus Protocol signature flared across the comms monitor.

  *He did it! Thorne locked! He committed!* The surge of triumph was electric, instantly followed by icy horror. *He committed BEFORE me.*

  There was no time for relief, only the frantic need to counter-commit, to force Thorne *back* into the position of having to yield. His finger slammed down on the physical override. **<< AEGIS LOCK CONFIRMED. THEMIS FLEET IRREVOCABLY COMMITTED. >>**

  The commands, borne on laser pulses, raced towards the asteroid belt at the speed of light. But the die was already cast. The delay wasn't just in communication; it was in *knowledge*. Each had seen the other's final, irrevocable position only *after* they had made their own.

  ---

  On the bridge of the Helios command ship *Prometheus*, the tactical officer watched in numb disbelief as the vectors resolved. The locked blue trajectories of the *Themis* drones intersected perfectly, catastrophically, with the locked red trajectories of the *Janus* drones. They weren't just claiming the same asteroid; their pre-programmed, unchangeable paths aimed them directly at each other's cores and the richest lanthanide veins.

  "Collision course... locked in," the officer whispered, her voice hollow. "Impact in T-minus 10 minutes. No override possible. Both fleets... committed."

  Silas Vance stared at the hologram. Two sets of vectors, beautiful in their lethal precision, converging on a point of absolute destruction. Erebus-7 glowed innocently at the center, the prize about to become a tomb. The trillion-dollar dream vaporized, along with hundreds of millions in hardware. He had won the commitment race. So had Kael Thorne. They had both burned their bridges with ruthless efficiency, only to find the bridges led to the same cliff edge.

  A priority message alert chimed – a transmission finally arriving from Selene Dynamics, sent just *before* Kael locked in. Silas played it. Kael Thorne’s face filled the screen, uncharacteristically strained.

  "Silas. We need to talk. This is madness. Erebus is big enough. There are veins we haven't even mapped. We can split this. No one needs to lose everything. Respond immediately. Let’s coordinate before..." Thorne’s voice cut off as the message reached its pre-recorded end. It had been sent *after* Kael saw Helios’s pre-lock maneuvers, *before* he activated Janus. An attempt to deliberate, to avoid the race. It had arrived too late.

  Silas sank into his chair, the weight of utter futility crushing him. He looked at Anya, her face pale. "The message..." she started.

  "Arrived after we both committed," Silas finished, his voice flat. "After we both saw the other *preparing* to commit, and assumed the worst. We raced to lock in before the other could force us to yield... and locked ourselves into mutual destruction instead."

  On the screen, the countdown to collision ticked relentlessly below the intersecting lines. Ten minutes until the fireworks. Ten minutes until two empires of ambition and calculation reduced themselves to cosmic dust, victims of a race where winning the first move meant losing everything.

  Silas leaned forward, a bitter, humorless laugh escaping him as he watched the inevitable unfold. "We studied Schelling, Anya. We understood the theory perfectly. We just never believed *we* would be the ones stupid enough to actually run the race." The hologram flickered, the paths of the doomed drones unwavering, a perfect, tragic diagram of the commitment cascade.
