answer: |-
  You're absolutely right to be suspicious of that tidy narrative—it's a significant oversimplification. While the "Gettier problem" is a genuine milestone in 20th-century epistemology, the story of an unchallenged, monolithic "Platonic definition" standing for 2300 years before being toppled by Gettier is more myth than history. Here's a more nuanced breakdown:

  1.  **Plato's *Theaetetus* Wasn't So Definitive:**
      *   Plato's dialogue *does* explore the definition of knowledge as "true belief with an account" (often interpreted as justification), but **it ends in *aporia*—failure and puzzlement.** Socrates explicitly *rejects* this definition as insufficient. Plato wasn't offering a settled doctrine; he was exploring ideas dialectically. The "JTB" formulation is largely a *modern reconstruction* of one proposal discussed and discarded within the dialogue.

  2.  **Pre-Gettier Awareness of the Problem:**
      *   **Ancient Skeptics:** Pyrrhonian and Academic skeptics constantly argued that even seemingly justified beliefs could be false or only accidentally true. Their whole project undermined claims of secure knowledge.
      *   **Medieval Philosophers:** Islamic philosophers like Al-Ghazali and later Scholastics like William of Ockham grappled with the relationship between justification, truth, and certainty. Discussions about divine omnipotence and deception often touched on scenarios where justification and truth came apart.
      *   **Early Modern Philosophers:**
          *   **René Descartes:** His method of radical doubt explicitly considers scenarios where our most justified beliefs (based on sense perception or reason) *could* be false due to an evil demon. While seeking indubitable foundations, he highlighted the *possibility* of justified false beliefs.
          *   **David Hume:** His profound skepticism about induction showed that even our most deeply held, empirically justified beliefs about the future or unobserved matters of fact lack *logical* necessity and could be false. He exposed the potential gap between strong justification and truth.
      *   **20th Century Pre-Gettier:**
          *   **Bertrand Russell (1948):** In *Human Knowledge: Its Scope and Limits*, Russell explicitly used the **stopped clock example** you thought of: A man glances at a clock that stopped exactly 12 hours ago and forms the true belief about the time, but his justification (the clock's appearance) is faulty. Russell called this "true belief without verification" but didn't frame it as a fatal blow to a standard definition. He saw it as a curiosity.
          *   **A.J. Ayer (1956):** In *The Problem of Knowledge*, Ayer discussed cases where a justified belief turns out true by luck, acknowledging they pose a problem for defining knowledge. He argued that justification must rule out "relevant alternatives," anticipating one line of response to Gettier.
          *   **Edmund Husserl & Phenomenology:** While focused on different issues, phenomenologists explored the nature of evidence and fulfillment, touching on how justification relates to truth.
          *   **Indian Philosophy (Nyāya School):** Philosophers like Gaṅgeśa (14th century) developed sophisticated theories of knowledge (*pramāṇa*) that explicitly required the justification (*guṇavattva*) to be non-deviant or non-lucky (*avyabhicāra*) to avoid Gettier-type cases, centuries before Gettier.

  3.  **Why Gettier Became the Focal Point:**
      *   **Timing & Context:** Gettier published in 1963, a time when analytic philosophy was intensely focused on conceptual analysis and refining definitions. The "JTB" definition *had* become a widely accepted *starting point* or *straw man* within mid-20th-century Anglo-American epistemology.
      *   **Simplicity & Clarity:** Gettier's examples (e.g., Smith and Jones job interviews, ten coins in pocket) were exceptionally clear, concise, and tailored to the contemporary framework. They were impossible to ignore within that specific discourse.
      *   **Catalytic Effect:** Gettier's short paper didn't just point out a problem; it acted as a catalyst. It forced epistemologists to explicitly confront the issue of "epistemic luck" head-on and sparked an enormous wave of literature trying to *solve* the problem (e.g., adding a "no false lemmas" condition, requiring "sensitivity" or "safety" conditions, virtue epistemology, etc.). It fundamentally reshaped the agenda of epistemology for decades.
      *   **Narrative Convenience:** The "Gettier demolished 2300 years of dogma" story is a compelling pedagogical device. It highlights a key turning point and makes complex history digestible for introductory students. Your coworker likely encountered this simplified version.

  **A More Accurate Summary:**

  1.  Plato *discussed but rejected* a definition resembling JTB in the *Theaetetus*.
  2.  The relationship between justification, truth, and the avoidance of luck was a persistent, though often implicit or secondary, theme throughout the history of philosophy. Many philosophers recognized the *potential* for justified true belief to be accidental.
  3.  By the mid-20th century, within analytic philosophy, the "JTB" formulation had solidified as a common *working definition* or *target* for analysis.
  4.  **Edmund Gettier, in 1963, crystallized the problem with devastatingly clear and relevant counterexamples within this specific contemporary framework.**
  5.  This paper acted as a major catalyst, forcing explicit recognition of "epistemic luck" and triggering a massive, ongoing effort to revise or replace the JTB analysis within analytic epistemology.

  **Your intuition is spot-on.** The core insight *is* relatively simple, and thinkers *did* come close to articulating it before Gettier (Russell practically nailed it!). Gettier's genius wasn't in having an utterly unique thought, but in **presenting the problem with unparalleled clarity and impact at precisely the right moment in the philosophical discourse**, effectively launching a new era in epistemology. The "unchallenged for millennia" narrative is a useful but ultimately misleading simplification.
