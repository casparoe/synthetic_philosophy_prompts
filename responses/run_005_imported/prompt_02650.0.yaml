  Okay, let me approach this Gongsun Long passage systematically. The user wants a reconstruction of the "fixed/unfixed" argument in the White Horse Dialogue, specifically analyzing how it differs from the earlier shape-color distinction. 

  First, I need to unpack the terminology. The "fixed" (定) vs "unfixed" distinction seems crucial here. When Gongsun Long says unfixed white "is not fixed to any particular white thing", he's describing the abstract concept of whiteness - the universal quality detached from instances. That's why we can "set the particular aside" mentally. But "white horse" concretizes this by fixing whiteness to a specific object category (horses). 

  The tricky claim is "what is fixed to a particular white thing is no longer white." This seems paradoxical until we realize Gongsun Long is making a radical nominalist move: once whiteness is bound to horses, it ceases to be the pure universal "white" and becomes a compound concept "white-horse". 

  Now the exclusion argument: "horse" as a shape-concept doesn't exclude colors (any color of horse qualifies), while "white horse" actively excludes non-white horses. This exclusion creates a narrower set. When Gongsun Long declares "what does not exclude is not the same as what does exclude", he's arguing that since their exclusion properties differ, the terms can't be identical. 

  But is this really new? The earlier shape-color distinction established categorical difference, while this fixed/unfixed argument focuses on conceptual scope and exclusivity. The former is about composition ("horse + color ≠ horse"), this is about extension ("white-horse refers to fewer things than horse"). 

  I suspect the user wonders if this is just verbal repackaging. While related, the fixed/unfixed angle introduces new dimensions: the ephemerality of universals when instantiated, and the operational difference in how terms exclude possibilities. It's building on the foundation but adding epistemological layers about how concepts function in language. 

  The argument stands independently by shifting focus from categorical parts to referential ranges, though it certainly resonates with the earlier point. Gongsun Long seems to be attacking the problem from multiple linguistic angles to demonstrate the non-identity thesis.
answer: |-
  Here's a reconstruction of Gongsun Long's argument from the passage, analyzing its key components and logic:

  1.  **The Nature of "White" (Unfixed):**
      *   The term "white" by itself ("白") refers to the *abstract concept* or *universal quality* of whiteness.
      *   It is "unfixed" (不定, *bù dìng*) – it doesn't inherently point to any specific white *object*. The quality exists independently.
      *   One can mentally "set the particular aside" (指物離指) and still meaningfully discuss "white" as a concept. (E.g., "White is a color.")

  2.  **The Nature of "White Horse" (Fixed):**
      *   The term "white horse" ("白馬") refers to a *concrete compound concept*.
      *   Here, "white" is "fixed" (定, *dìng*) – it is bound to, or specifies, a particular kind of thing: horses.
      *   It means "white *as applied to horses*" or "white-in-horse-form".

  3.  **The Key Claim: Fixed White ≠ Unfixed White:**
      *   "What is fixed to a particular white thing is no longer white." (夫定所白者，非白也).
      *   **Interpretation:** Once the abstract quality "white" is fixed to a specific category (horses), it ceases to be the pure, universal, abstract "white". It becomes a *particularized instance* or a *compound property* – "white-horse-ness". The pure universal "white" is lost in the specification. The fixed "white" in "white horse" is conceptually distinct from the unfixed "white".

  4.  **The Exclusion Principle Applied to "Horse":**
      *   "Horse" (馬) names the *shape* or *form* "horseness".
      *   This concept "horse" involves "no excluding among colors" (無去取於色).
      *   **Meaning:** The term "horse" applies equally to horses of *any* color (brown, black, white, etc.). Color is irrelevant to the concept "horse". It does *not* exclude horses based on their color. Any colored horse satisfies the requirement of being "a horse".

  5.  **The Exclusion Principle Applied to "White Horse":**
      *   "White horse" (白馬) *does* "exclude among colors" (有去取於色).
      *   **Meaning:** The term "white horse" *explicitly excludes* horses that are *not* white (like brown or black horses) based precisely on their color. Only a white horse satisfies the requirement of being "a white horse". Color is essential and exclusionary.

  6.  **The Logical Conclusion from Exclusion:**
      *   "What does not exclude [based on color] is not the same as what does exclude [based on color]." (無去者非有去也).
      *   **Meaning:** Because "horse" (no color exclusion) and "white horse" (color exclusion) have fundamentally different scopes of application (one includes all colors, the other excludes all but one), they cannot refer to the same thing. Their defining criteria and the sets they pick out are different.
      *   **Final Conclusion:** "Hence I say: a white horse is not a horse." (故曰白馬非馬). The compound concept "white horse" (which excludes non-white horses) is not identical to the simple concept "horse" (which does not exclude based on color).

  **Analysis of Key Distinctions and Points:**

  *   **Fixed vs. Unfixed ("定" vs. "不定"):** This distinction introduces a crucial point about **instantiation** and **conceptual abstraction**.
      *   **Unfixed ("White"):** Represents a universal property considered in isolation, abstractly. It's the Platonic Form or the general idea.
      *   **Fixed ("White" in "White Horse"):** Represents that universal property *instantiated within*, or *conjoined with*, a specific category. It becomes a *particularized attribute* bound to that category. Gongsun Long argues this binding fundamentally changes its conceptual nature – it is "no longer white" in the pure, abstract sense.
  *   **Why Fixed White "is no longer white"?** This is the most radical and paradoxical claim. Gongsun Long's point is epistemological/nominalist:
      *   The *pure concept* "white" is defined solely by its color quality, free from any object. When we say "white horse," we aren't just adding "white" to "horse"; we are creating a *new compound concept*. The "white" within "white horse" loses its independence and universality; it becomes "white-as-applied-to-horses," which is a different concept from the abstract "white". It's tied to a specific manifestation. The compound concept inherently carries the specification, making it distinct from the simple universal.
  *   **Connection to Exclusion:** This distinction feeds directly into the exclusion argument:
      *   Because "white" in "white horse" is fixed (particularized to horses), the compound term *must* exclude horses that lack this specific, fixed color property.
      *   "Horse," lacking any fixed color (it's color-neutral/unfixed regarding color), imposes no such exclusion.
      *   The *difference in their exclusionary power* (one excludes based on color, one doesn't) is a direct consequence of one term having a fixed color component and the other not. This difference proves they are not co-extensive and therefore not identical.
  *   **Does it stand alone or restate the earlier point?** This argument **builds upon but significantly deepens** the earlier shape/color distinction.
      *   **Similarity:** The core insight that "horse" names shape (ignoring color) while "white horse" names shape *and* color (thus creating a narrower category) is foundational to both arguments.
      *   **Advancement:** The "fixed/unfixed" distinction adds crucial layers:
          1.  **Conceptual Abstraction:** It explicitly analyzes the *nature* of the concepts "white" and "white horse," arguing that fixing a universal to a category creates a new, particularized concept distinct from the abstract universal.
          2.  **Exclusion as a Logical Test:** It uses the operational difference in *exclusion* (去, *qù*) as a rigorous logical criterion for non-identity. If Term A excludes things that Term B includes, then A cannot equal B. This moves beyond simple composition ("horse + color") to a functional analysis of how the terms *work* in reference.
          3.  **Explaining the "Why":** It provides a deeper explanation *why* adding "white" to "horse" creates a non-identical term: because "white" loses its abstract universality when fixed to "horse," becoming a new, exclusionary compound concept.

  **Conclusion:**

  This argument is **not merely a restatement** of the earlier shape/color point. While relying on the same foundational observation about the different aspects named, it introduces the novel and sophisticated distinctions of **"fixed" vs. "unfixed" properties** and **exclusion as a test for identity**. It delves into the nature of abstract universals versus compound concepts and uses the operational logic of exclusion to provide a powerful demonstration of non-identity based on differing criteria of application. It stands as a significant elaboration and logical strengthening of the core thesis "a white horse is not a horse."
