    "A": ["Impossible-worlds/non-normal-worlds semantics", "Step logics/resource-bounded reasoning"],
    "B": ["Justification logic", "Awareness logic (Fagin-Halpern style)"],
    "C": ["Syntactic/sentential models of belief"]
  }
  ```

  **Justification per tier:**  
  - **S Tier**: Logical induction directly models computationally bounded reasoners gaining confidence in logical truths over time, making it philosophically grounded *and* applicable to real systems. Algorithmic knowledge explicitly ties knowledge to computational processes (perfect for distributed systems), avoiding omniscience by requiring explicit computation.  
  - **A Tier**: Impossible-worlds semantics elegantly handles non-omniscience by allowing logically incoherent epistemic alternatives, though interpretation can be contentious. Step logics explicitly model reasoning effort (great for hardware-aware systems), but require arbitrary step/resource bounds.  
  - **B Tier**: Justification logic ("knowledge with reasons") avoids omniscience via explicit justifications, but doesn't inherently address computational limits. Awareness logic blocks omniscience via syntactic awareness filters, but awareness sets feel ad-hoc without dynamic mechanisms.  
  - **C Tier**: Syntactic models (belief-as-sentence-sets) trivially avoid omniscience but fail to capture knowledge's semantic nature and are largely superseded by more nuanced approaches.  

  **Key Insights**:  
  - For *engineering applications* (like your Raft work), **Algorithmic knowledge** and **Step logics** are most actionable—they explicitly model computation.  
  - For *philosophical depth*, **Logical induction** and **Impossible-worlds** are richest, though the latter is more abstract.  
  - Avoid syntactic models—they're a historical artifact with limited modern traction.  
  - All approaches trade off expressiveness and tractability; no silver bullet exists (hence the "zoo").
