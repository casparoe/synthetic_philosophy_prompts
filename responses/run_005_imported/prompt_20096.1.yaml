prompt: |-
  Last night a friend and I had a long argument about a predicament I've found myself in at work. About eight months ago, a colleague and I both put ourselves forward for the same internal promotion; the decision keeps getting deferred while management asks each of us, in turn, to take on another unpaid 'stretch' project to prove we're ready — work that will only pay off for whichever of us is eventually promoted, and be a complete waste of time for the other. Yet every time she takes on one more project, I feel compelled to match her, since walking away now would guarantee that my hours were wasted, whereas staying in at least keeps alive the chance that they weren't. My friend's verdict was that I'm simply refusing to accept that those hours are already gone no matter what happens next and that I should quit immediately, but that explanation doesn't feel complete to me, since this isn't a case of one person alone deciding whether to keep funding a project of their own. Is my friend right, and if there's more going on here than that, what is it, and how should it change what I do next?
reasoning: |-
  Okay, let me start by really understanding the user's situation. They've been in a promotion competition for eight months, and management keeps deferring the decision while asking both candidates to take on unpaid "stretch" projects. The user feels trapped because if they quit now, all their effort is wasted, but continuing means more unpaid work with no guarantee of promotion. Their friend says they're falling for the sunk cost fallacy and should quit immediately, but the user feels there's more to it.

  First, I need to unpack the sunk cost fallacy. The friend is right that past efforts are gone, but the user's point about mutual escalation adds complexity. This isn't just about one person's sunk costs; it's a dynamic between two candidates and management. The user feels compelled to match their colleague's actions, creating a cycle. 

  Next, management's role is key. They're benefiting from free work without making a decision. This could be intentional exploitation or incompetence. Either way, it's unfair. The user might be stuck in a prisoner's dilemma where both candidates keep working, but only one wins. If both quit, management would have to act, but they're trapped in mutual competition.

  The user's deeper needs include validation of their efforts, fairness in the process, and avoiding future wasted time. They might also fear regret—if they quit and the other gets promoted, they'll feel foolish. There's also a need for agency; they want to take control rather than react.

  I should consider strategies beyond quitting. The user needs to break the cycle. Options include setting an ultimatum, collaborating with the colleague, or escalating to higher management. But they need to weigh risks, like management's reaction. 

  Also, the emotional toll matters. The prolonged uncertainty and unpaid work are draining. The user needs to assess their mental health and whether this job is worth it long-term. They might need to evaluate exit opportunities regardless of the promotion.

  Ultimately, the user needs a proactive approach. Confirming sunk costs is part of it, but addressing the systemic issue and management's manipulation is crucial. They must decide if fighting for the promotion is viable or if cutting losses and seeking better opportunities is wiser.
answer: |-
  You're absolutely right to question your friend's advice - while the sunk cost fallacy is part of this, your situation involves deeper systemic issues and psychological traps. Here's a breakdown of what's happening and how to navigate it:

  **The Core Dynamics at Play:**

  1.  **Sunk Cost Fallacy (Your Friend's Point):**
      *   **True:** The hours you've *already* invested are irretrievably gone. Quitting now or later doesn't change that.
      *   **Incomplete:** This view ignores the *ongoing* investment, the competitive dynamic, and management's exploitative behavior. Your decision isn't just about past costs, but preventing *future* wasted effort and strategically managing an unfair situation.

  2.  **Mutual Escalation Trap (The Key Insight You're Sensing):**
      *   You and your colleague are locked in a destructive feedback loop. Her taking a project pressures you to match, which then pressures her to take the *next* one, and so on. This is similar to an "arms race" or a "bidding war" where neither can back down without guaranteeing loss, but continuing escalates costs for both.
      *   **Result:** Management wins (free work), while both of you lose increasing amounts of time and energy.

  3.  **Management Exploitation/Incompetence:**
      *   This is the root cause. Management is:
          *   **Deferring Responsibility:** Avoiding a difficult decision.
          *   **Extracting Free Labor:** Getting significant projects done without compensation or promotion.
          *   **Creating False Competition:** Framing this as a "test" when it's likely indecision or a way to maximize output.
          *   **Lack of Transparency:** Providing no clear criteria, timeline, or feedback.

  4.  **The Prisoner's Dilemma Aspect:**
      *   Imagine if you *both* refused the next project. Management would be forced to decide or change tactics. This is the best collective outcome.
      *   However, if *one* refuses while the *other* accepts, the refuser loses (effort wasted, promotion lost). This fear keeps you both trapped in the "accept" strategy, even though mutual refusal would be better for both candidates (though worse for management).

  **Why Your Friend's Advice Feels Incomplete:**

  *   It focuses *only* on past costs, ignoring the dynamic competitive pressure and the fact that management's behavior is the real problem.
  *   Quitting immediately guarantees loss *only* if the promotion is your sole goal. It might actually be a rational choice if other opportunities exist.
  *   It doesn't address how to break the cycle or challenge the unfair system.

  **What You Should Do Next: A Strategic Approach**

  1.  **Acknowledge the Sunk Costs (But Don't Dwell):**
      *   Accept that the past hours are gone. This frees you to make decisions based *only* on the *future* costs and benefits from this point forward.

  2.  **Break the Escalation Cycle (Stop Matching Blindly):**
      *   **Do NOT automatically take the next project.** This is crucial. Continuing the arms race only benefits management.
      *   **Gather Information:** Before the next "offer":
          *   **Talk to Your Colleague (Carefully):** This is high-risk/high-reward. Acknowledge the mutual trap. Could you *both* agree to refuse the next project? Or agree to only take projects with *written* guarantees attached? If collaboration seems impossible, don't force it.
          *   **Re-Evaluate Management:** Is this indecision, malice, or cluelessness? How have they treated others? This informs your next steps.

  3.  **Confront Management (Strategically):**
      *   **Request a Formal Meeting:** Don't have this conversation casually. State you need clarity on the promotion process.
      *   **Focus on Process, Not Past Work:** Frame it around future fairness and transparency.
      *   **Key Questions to Ask:**
          *   "What *specific* criteria are being used to evaluate readiness for this promotion?"
          *   "What is the definitive timeline for making this decision?"
          *   "How is the work on these 'stretch projects' being formally evaluated and weighted in the decision?"
          *   "Given the significant additional responsibility, what compensation or guarantees can be offered *during* this extended evaluation period, regardless of the final outcome?" (e.g., a temporary pay bump, formal development credit, guaranteed consideration for the *next* role).
          *   "If the decision is deferred again, what will be the basis for that deferral?"
      *   **Set Your Boundary:** "I am committed to [Company] and this role, but I need clarity and fairness to continue investing significant additional effort without compensation. I cannot commit to further stretch projects without understanding [mention specific concerns: timeline, criteria, compensation]."

  4.  **Evaluate Your Options Based on Their Response:**
      *   **Good Response (Clear Timeline/Criteria, Some Compensation/Guarantee):** Assess if it's acceptable. Proceed cautiously, documenting everything.
      *   **Evasive or Bad Response (More Vagueness, No Compensation):**
          *   **Refuse the Next Project:** State clearly: "Without the clarity/compensation discussed, I cannot justify taking on further uncompensated responsibilities at this time. I remain eager to be evaluated based on my existing contributions and the work I've already completed." *This breaks the escalation.*
          *   **Escalate:** If possible, go to HR or your manager's manager. Frame it as a concern about process fairness, transparency, and potential exploitation.
          *   **Accelerate Your Job Search:** Start looking externally immediately. This environment is toxic and exploitative. Your skills are clearly valuable; find an employer who recognizes that.
          *   **Be Prepared for Backlash:** Management may try to guilt-trip you or imply you're "not committed." Stay calm and professional, reiterating your need for fairness and transparency. Document interactions.

  5.  **Reframe "Wasted" Time:**
      *   Even if you don't get the promotion, the skills and experience gained *are* valuable. Update your resume/CV/LinkedIn highlighting these leadership/stretch projects and the tangible results. This makes your time an investment in *your* marketability, not just for this specific promotion.

  **Conclusion:**

  Your friend is partially right about sunk costs, but the core issue is management's exploitative strategy and the mutual escalation trap you're in with your colleague. **Stop automatically matching her moves.** Instead, strategically confront management to demand transparency and fairness. Be prepared to refuse further uncompensated work and escalate or leave if necessary. 

  The real waste isn't just the past hours – it's any *future* hours you invest without clear terms or compensation. By breaking the cycle and forcing a decision (either the promotion, fair compensation for the trial period, or your exit), you regain control and stop the bleeding of your time and energy. Focus on your future value, not past costs tied to a broken process.
