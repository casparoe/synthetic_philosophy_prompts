answer: |-
  ## Dialogue: The Relocated Edge

  **Setting:** A coffee shop, late afternoon. Empty mugs between them. EMMA (Epistemicist) leans forward intently. LEO (Supervaluationist) gestures with open hands.

  **EMMA:** Leo, look, we’re going in circles. You *say* supervaluationism avoids the counterintuitive sharp boundaries of epistemicism. "Tall" doesn’t have a single, precise cutoff point. Fine. But it sneaks the sharpness back in elsewhere. It’s just relocation!

  **LEO:** No, Emma, it fundamentally changes the *nature* of truth for vague predicates. There *isn’t* one sharp boundary. Instead, there’s a range of equally good ways to make "tall" precise – the admissible precisifications. Truth *simpliciter* is supertruth: true on *all* those precisifications. Falsehood is superfalsehood: false on *all*. Borderline cases are true on some, false on others. No single point where "tall" flips.

  **EMMA:** Right, but *what makes a precisification admissible?* That’s where the sharp boundary hides. Isn’t there a precise set of precisifications that count as "admissible"? One millimeter outside that set, and a precisification becomes inadmissible – meaning it doesn’t count when determining supertruth. *That’s* your sharp edge. You’ve just moved it from individual heights to the definition of ‘admissible precisification’.

  **LEO:** But that’s different! Admissibility isn’t about the *object* (the height), it’s about the *meaning* of the word "tall" in our linguistic practice. It captures the inherent flexibility and context-sensitivity. There might be *some* vagueness about admissibility at the very fringes, but it’s a different *kind* of beast – a meta-linguistic one. The key point is: for the predicate "tall" applied to objects, *there is no single, precise height where it becomes true*. That’s the counterintuitive consequence epistemicism forces on us, and supervaluationism avoids it.

  **EMMA:** Does it? Or does it just postpone it? Okay, grant that ‘admissible’ might have its *own* borderline cases. So you introduce ‘definitely admissible’. But then *that* operator will have its sharp cutoff! Higher-order vagueness just kicks the can down the road. *Somewhere* up the chain, Leo, there *has* to be a sharp boundary determining what counts for truth in *this* conversation about *this* man. My view puts it directly on the height scale. Yours buries it in layers of semantic machinery, but it’s still there. You haven’t eliminated sharp boundaries; you’ve obscured them.

  **LEO:** That’s uncharitable. The higher-order vagueness isn’t a bug; it’s a feature reflecting the genuine open-texture of language. We *don’t* need, and shouldn’t expect, sharp boundaries at *any* level for vague terms. The "definitely" operator itself is vague! Supervaluationism models this by allowing precisifications to differ even on where the ‘borderline’ zone begins and ends. The commitment isn’t to sharp boundaries, but to the *indeterminacy* persisting at higher levels.

  **EMMA:** But that indeterminacy costs you something big, Leo: ordinary truth. Take our borderline guy, 5'11". On *your* view, the sentence "He is tall" is neither true nor false. It’s indeterminate. But in ordinary English, if I say "That 5'11" guy isn’t tall," and he *is* borderline, my statement isn’t *false*? It feels false! Or at least, not *true*! Your "supertruth" isn’t the truth we use every day. You’ve *redefined* truth for vague sentences as something else – supertruth – and left ordinary truth behind for borderline cases. My epistemicism preserves bivalence: every declarative sentence is straight-up true or false, even if we can’t *know* which for borderline cases. That matches our logical intuitions better.

  **LEO:** Preserves bivalence at the cost of massive, unknowable facts! Do you *really* believe there’s a specific nanometer where adding one grain turns a non-heap into a heap? That seems absurd. And "matches logical intuitions"? What about the Sorites paradox? Epistemicism just bites the bullet and says there *is* a precise point where the valid argument becomes invalid, which is deeply counterintuitive. Supervaluationism explains the paradox: each step seems true because for each adjacent pair, there *is* a precisification where the step holds. But no precisification makes *all* steps true simultaneously. The argument is superfalse because *every* way of making it precise fails somewhere. That’s a satisfying explanation without hidden nanometers!

  **EMMA:** But your "satisfying explanation" relies on "superfalse," which isn’t plain false! And you still have hidden boundaries – in the admissibility criteria. Maybe they’re not nanometers, but they’re sharp boundaries in the space of precisifications. As for the Sorites, epistemicism *does* resolve it cleanly: there *is* a false premise, we just can’t identify it. Unknowability isn’t incoherence. Your view makes genuinely meaningful statements about borderline cases *truth-valueless*. That seems like a bigger cost to ordinary discourse. If I say "The 5'11" man is tall or not tall," that’s *supertrue* for you, but it’s not *true* in the classical sense because neither disjunct has a truth value! That’s messy.

  **LEO:** Life is messy! Language is messy! Insisting on classical bivalence for vague predicates *forces* artificial precision where none exists. Supervaluationism respects the genuine indeterminacy. Yes, "supertrue" is a *technical* term capturing truth for vague statements. But it *reduces* to classical truth for precise statements. For borderline cases, it accurately reflects their status: they aren’t settled by the meaning of the words alone. That’s not redefining truth; it’s recognizing a more complex reality. Your sharp boundary is the artificial imposition.

  **EMMA:** And your admissibility boundary is just as artificial, just better hidden! You think moving the boundary to the meta-level makes it vanish? It doesn’t. It’s still there, determining what counts as a "correct" way to precisify. My boundary is on the object level, yours is on the semantic level, but both are sharp lines we can’t access. And mine at least keeps truth simple and bivalent. Yours fragments it.

  **LEO:** Simple isn’t always right. Sometimes complexity is necessary to model reality accurately. The boundary for admissibility isn’t sharp in the same way; it’s constrained by use and meaning in a way a single nanometer isn’t. And it *does* avoid the object-level sharp cutoff you’re committed to. That’s a substantive difference.

  **EMMA:** *(Sighs, swirling cold coffee)* Is it? Or is it just shifting the location of the mystery? You say "constrained by use," but *how*? What precise facts about language use determine the exact set of admissible precisifications? If you can’t answer that without invoking *another* vague term or admitting a sharp line... then we’re back where we started. Your supertruth feels like a workaround, not a solution. It buys you the lack of an object-level cutoff, but the cost is a fractured notion of truth and a sharp boundary relocated to a place you refuse to look.

  **LEO:** And your epistemicism buys you classical logic at the cost of believing in unknowable, arbitrary facts that defy our linguistic intuitions. We *model* the constraints; we don’t need to reify a single sharp meta-boundary. The cost you see in truth is actually a gain in accuracy for borderline cases. They *are* unsettled.

  **EMMA:** Unsettled *for us*, maybe. But not, on my view, unsettled *in fact*. There *is* a fact. We just can’t know it. On your view, there *is no fact* about the borderline case itself – the fact is only about precisifications. That’s a fundamental difference, and I think it makes your "truth" too detached from the world.

  **LEO:** *(Leans back)* And I think your "fact" is a phantom generated by an unrealistic demand for precision. We just disagree on where the mystery lies – or whether it can be dissolved. More coffee?

  **EMMA:** *(Looks at cold dregs)* Sure. But I doubt it’ll help us resolve *this* heap of an argument.

  **(Fade out as Leo signals the waiter. The fundamental disagreement about the nature of boundaries and truth remains unresolved, echoing their late-night debate.)**
