answer: |-
  The first time Elara showed Leo the device, it looked like a prop from a bad sci-fi film: a Geiger counter wired to a modified nail gun, the muzzle pointed at a worn armchair. "It's beautiful," she whispered, tracing the solder joints with a reverence that chilled him. "True randomness. The click... or not."

  Leo understood the theory, of course. Elara had explained Everett’s Many Worlds tirelessly over lukewarm coffee, her eyes alight with a fervor he found increasingly alien. If every quantum possibility branched reality, then firing a gun triggered by a genuinely random event – like the decay of a single atom – meant that in one branch, the gun fired, and she died. In the other, it didn't, and she lived. Subjectively, she’d only ever experience the branches where she survived. She’d *always* wake up.

  "It's not suicide, Leo," she insisted that first night, her hand cool on his sweating one. "It's verification. Proof that consciousness navigates the branching. I’ll be fine. *I* will always be fine."

  He watched her settle into the armchair, the cold muzzle pressed against her temple. His heart hammered against his ribs, a trapped bird frantic for escape. The Geiger counter hissed its static song. One minute stretched into an eternity of white noise. Then… silence. Not the *bang* he dreaded, but the absence of it. Elara opened her eyes, a radiant smile blooming. "See?"

  He collapsed beside the chair, trembling, burying his face in her lap. Relief tasted like bile. *Once. Just once, she got lucky.*

  But it wasn't once. It became a ritual. Every Sunday night. Elara called it her "Weekly Wellness Check."

  Each time, Leo’s dread deepened. He’d stand rigid in the doorway of her basement workshop, the air thick with dust and ozone, watching her perform this profane communion with probability. Each time, the Geiger counter hissed, the silence stretched, and Elara emerged, brighter, more convinced. Her certainty became a wall.

  He tried arguing. "Elara, even if Many Worlds is true, the probabilities aren't *equal*! The Born rule says surviving branches are vanishingly improbable each time! You’re tempting fate!"

  She’d wave a dismissive hand. "Probability is just a measure of branch *density*, Leo. It doesn't affect the subjective experience. *I* experience the branch where I survive. Always. It’s inevitable." Her logic was a flawless, terrifying crystal.

  He started noticing changes. Not physical ones, but… shifts. After the third "survival," she forgot the name of their neighbor's dog, a dog she’d adored. "Oh, that old thing?" she’d said vaguely. "Must be a different branch." After the fifth, she developed a sudden, intense dislike for the violin music they’d both loved. "Sounds tinny now," she shrugged. Leo felt a cold dread seep into his bones. Was it just stress? Or was the survivor in this branch… subtly different? Less *his* Elara? Was the "her" who continued, preserved only by cosmic dice rolls, even the same person worth surviving? He remembered snippets of Parfit she’d once quoted – identity as a chain of psychological connections. How many breaks before the chain snapped?

  On the eighth Sunday, the routine fractured. The Geiger counter hissed. Silence stretched. Leo held his breath. Then, a sharp, horrifying *CRACK*.

  Leo screamed, lunging forward before his mind could process it. Elara slumped sideways in the chair, a small, dark hole above her ear, a trickle of crimson stark against her pale skin. The acrid smell of gunpowder mixed with dust.

  He dropped to his knees, fumbling for a pulse, his hands slick with blood he couldn’t see. Nothing. A stillness so absolute it screamed. His world shattered, compacted into the awful finality of that single point of damage. The Geiger counter, oblivious, continued its soft, random hiss.

  He sat there for hours, numb, cradling her cooling hand. Grief, vast and paralyzing, washed over him. *She was wrong. She was wrong and she’s gone.*

  Then, in the grey light of dawn, shuffling footsteps on the basement stairs. He looked up, bleary-eyed, disbelief warring with impossible hope.

  Elara stood there, wrapped in her blue robe, rubbing sleep from her eyes. "Leo? What are you doing down here so early? Did you sleep on the floor again?" She frowned, noticing the device still set up, the chair. "Oh, for goodness sake, did you mess with my rig?"

  Leo stared, his mouth dry. Blood. He could still smell the blood. He looked frantically at the chair. Clean. Unstained. Elara, whole, unharmed, looking at him with mild annoyance and confusion.

  "You… you did the test last night," he choked out.

  "Test?" She blinked, then laughed, a light, dismissive sound that scraped raw against his nerves. "Oh, that! I decided not to bother. Felt a bit tired. Must have been another branch where I did it. Honestly, Leo, you look awful. Did you have a nightmare?"

  He couldn’t speak. The corpse he’d held, the blood, the stillness – it had been real. To *him*. But for *her*, in this branch, it hadn't happened. She’d simply… skipped it. Woken up without the memory, without the consequence. Her survival wasn’t just guaranteed; it was curated, edited. *His* suffering, *his* loss, was confined to a branch she would never experience, never acknowledge.

  The asymmetry yawned like a chasm. Her subjective immortality demanded his perpetual bereavement. Her "Weekly Wellness Check" was, for him, a weekly Russian Roulette where five chambers held a bullet. His terror, his grief, were real and crushing, while hers dissolved into the branching multiverse.

  He watched her putter around the basement, humming, utterly untouched by the horror that lived in his memory. This Elara, the one who hadn't pulled the trigger last night, felt subtly alien. Her dismissal of his palpable distress, her easy acceptance of a reality where her death was merely a statistic happening "elsewhere," eroded the connection he’d cherished. Was this survivor, preserved by sheer branching happenstance, the woman he loved? Or just a sequence of consciousnesses linked only by the accident of survival, each subtly diverging from the last?

  Later, he found himself staring at the device. The Geiger counter clicked softly, a metronome counting down probabilities. He understood the Born rule now, not as abstract math, but as the weight crushing his reality. Each survival was astronomically improbable. The branch where Elara lived through a hundred tests was vanishingly thin, a ghost path through the multiverse. But she’d only ever experience *that* path. The thick branches, the probable ones, were littered with her corpses, mourned by other Leos in other basements, each as shattered and alone as he had felt that night.

  He loved her. He loved the brilliant, reckless woman who had built this monstrous thing. But he realized, with a chill that reached his soul, that the Elara he loved was dying weekly in countless realities. The survivor smiling at him over breakfast coffee was a statistical ghost, growing stranger with each improbable escape, her continuity an illusion woven from quantum dice. Her immortality wasn’t triumph; it was a terrifying, lonely divergence, leaving him stranded on the shores of ordinary, probable grief.

  He couldn’t follow her into the thinning branches. He was anchored here, in the heavy, likely world where loss was absolute and final. Her experiment worked. She would always wake up. But he would always be the one left behind, holding the memory of blood in a silent basement, listening to the indifferent hiss of the quantum void.
