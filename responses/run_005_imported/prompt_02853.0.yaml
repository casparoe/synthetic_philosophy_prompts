prompt: |-
  So after I retired from running a molecular biology lab a couple years back I finally had time to read some actual philosophy instead of just grumbling about it at conferences, and I joined an online reading group thats currently working through metaethics. Last session two of the members, Kate and Femi, got into a real back-and-forth over the evolutionary debunking argument against moral realism, and it's bugged me alot since because I can't work out who actually came out ahead.

  Roughly it went like this:

  (1) Kate said the argument basically finishes off moral realism: natural selection built our moral sense to promote survival and reproduction, not to detect some mind-independent moral reality, so if realism is true it'd be a wild coincidence that evolution happened to land us on the truth anyway — and beliefs that are that coincidental don't deserve our trust.

  (2) Femi said that move proves too much: our number sense and basic logical instincts were shaped by selection for fitness too (nobody's ancestors got eaten for being bad at predicate logic), yet nobody thinks this makes "2+2=4" unjustified. So either the whole style of argument is broken, or Kate owes us a reason ethics is relevantly different from math here.

  (3) Kate said math and ethics aren't in the same boat: arithmetic truths are necessary, there's no possible world where 2+2=5, so any halfway reliable counting process was bound to land on the truth no matter what selection was "aiming" at. A mind-independent moral reality, by contrast, could easily have been different from whatever selection handed us, so the coincidence is real for ethics in a way it isn't for math.

  (4) Femi answered that this just pushes the problem back a step: plenty of realists think core moral truths are necessary too (that gratuitous cruelty is wrong in every possible world, say), and if that's right then Kate's own "no possible world where it's false" move saves ethics exactly the way it saves arithmetic — so the disanalogy only works if she's already assuming moral facts are contingent, which most serious moral realists deny anyway.

  Neither of them budged and the group moved on to wine before it got resolved. Could you go through it move by move and say who's actually got the better of it at each step, not just an overall winner? Give me a quick JSON block first: {"1": <score>, "2": <score>, "3": <score>, "4": <score>}, scoring each move from -2 (clearly wrong) to 2 (clearly right), then explain your reasoning behind each score.
