answer: |-
  That's an *excellent* and deeply insightful question. You've hit on one of the most fundamental tensions in dynamic decision theory: the clash between **synchronic rationality** (rationality at a single point in time) and **diachronic rationality** (rationality over time). The "resolute choice" approach is indeed a proposed escape hatch from money pumps like the one Yudkowsky uses against Allais preferences. However, whether it's a *legitimate* solution or just sweeping the inconsistency under the rug is hotly debated.

  Let's break down why resoluteness *seems* to work and the sneaky problems it might hide:

  1.  **How Resoluteness Evaporates the Money Pump:**
      *   **The Setup:** You have Allais-like preferences. Faced with the sequential decision tree of the money pump, you prefer the plan corresponding to Option 2A/2B *before any die rolls*.
      *   **The Commitment:** Being resolute, you commit *at the start* to the plan that leads to your preferred outcome (2A/2B). This means you decide *now* that you will *not* pay a penny to flip the switch to 1A/1B later, even if, at that later node, your local preferences favor flipping it.
      *   **Blocking the Pump:** The exploiter approaches you *before the first die roll* and says: "Pay me a penny to flip the switch now (setting it for 1A/1B)." You refuse because your committed plan (2A/2B) is better than paying a penny to get the plan you locally prefer less at the start (1A/1B).
      *   **After the Roll:** The exploiter approaches you *after the outer uncertainty resolves* and says: "Pay me a penny to flip the switch *back* to 2A/2B." You *still* refuse. Why? Because you are resolutely sticking to your *original plan* (2A/2B). Even though your *local preferences at this node* might now prefer flipping it back (because you know you avoided the worst outcome), your commitment overrides that local impulse. You refuse to pay the penny.
      *   **Result:** You paid nothing, stuck with your preferred 2A/2B outcome. The pump is blocked.

  2.  **The Case for Resoluteness (Why it might be legit):**
      *   **Planning Rationality:** Rational agents should be able to make binding plans to achieve their overall goals, even if sticking to the plan requires resisting locally tempting deviations. This is analogous to Ulysses tying himself to the mast.
      *   **Avoiding Self-Defeat:** The money pump demonstrates that *re-evaluating at every node based solely on local preferences* leads to a sure loss. Resoluteness is a way to avoid this self-defeating behavior.
      *   **Respecting Initial Preferences:** It prioritizes the preferences you held when you had the most comprehensive view of the decision tree and potential outcomes (i.e., at the start).
      *   **Practicality:** In real life, precommitment strategies *are* rational ways to avoid predictable future irrationality (e.g., savings plans, quitting aids).

  3.  **The Case Against Resoluteness (The Sneaky Problems):**
      *   **Ignoring Free Information:** After the outer uncertainty resolves, you have *new information*. Resoluteness forces you to ignore this information and stick rigidly to a plan made under greater ignorance. This seems epistemically irrational – why deliberately ignore relevant information when making a decision?
      *   **Normative Force of Money Pumps:** Proponents of dynamic consistency argue that vulnerability to a money pump *is* the definition of irrationality. It reveals an inconsistency in your valuation structure that *will* be exploited, costing you resources. Resoluteness avoids the *specific exploit*, but doesn't resolve the underlying static preference inconsistency that makes you *vulnerable* to such exploits in the first place. You've just built a wall around your inconsistency.
      *   **"Relocating the Inconsistency":** This is your key insight. The inconsistency isn't gone; it's manifested as a conflict between:
          *   Your *ex-ante* preference for Plan A (Sticking to 2A/2B no matter what).
          *   Your *conditional* preference *at certain future nodes* for Plan B (Paying to flip the switch). Resoluteness requires you to act *against* your local conditional preference at that node. You are essentially saying "I prefer Plan A overall, even though I know that *if* I reach Node X, I will prefer to deviate from Plan A." This internal conflict persists.
      *   **Begging the Question?** Critics argue resoluteness *assumes* the initial plan is the rational one to stick to, precisely to avoid the money pump consequence. But the money pump was the *argument* for why the initial preferences (violating independence) are irrational! Using resoluteness to block the pump might feel like circular reasoning: "My preferences are rational because I avoid the pump by committing to them, and I commit to them because they are rational."
      *   **Other Pumps?** A truly clever exploiter might design a different scenario exploiting the *conflict* between your resolute commitment and your local preferences, perhaps by offering side deals contingent on your commitment device, or exploiting your known resoluteness in other ways. While the *specific* sequential pump is blocked, the fundamental preference reversal remains a vulnerability in other contexts.

  **Conclusion: Is it a Legit Way Out?**

  *   **Technically, Yes (for *this* pump):** A resolute chooser *can* avoid the specific sequential money pump Yudkowsky describes. They won't pay the pennies.
  *   **Philosophically, Debatable:** Whether this is a *satisfactory* resolution depends on your view of rationality.
      *   **If you prioritize dynamic consistency and view vulnerability to money pumps as the core sin,** then resoluteness is just hiding the irrationality. The inconsistency (preference reversal based on irrelevant resolution of uncertainty) is still there, causing internal conflict and potential vulnerability elsewhere. Resoluteness feels like a patch, not a cure.
      *   **If you prioritize planning rationality and view diachronic self-defeat as the core problem,** then resoluteness is a legitimate and rational strategy to achieve your overall goals. The "inconsistency" is merely a predictable shift in local perspective due to new information, which a rational planner rightly overrides.

  **Yudkowsky's Likely Stance (and the Standard Econ View):** He, and most economists adhering to the vNM axioms, would argue resoluteness *is* question-begging. It avoids the symptom (the pump) without curing the disease (the underlying static preference inconsistency violating independence). The money pump reveals a pathology in your utility function that *will* cause problems, and resoluteness is just one way to (imperfectly) manage the symptoms. The truly rational agent, they argue, has preferences consistent with the independence axiom, avoiding the reversal and thus needing no special resoluteness to block the pump – they simply wouldn't want to make the switch-flipping payments at *any* point.

  You've perfectly identified the crux: **Resoluteness resolves the *dynamic inconsistency* by enforcing commitment, but it does not resolve the *static inconsistency* (the violation of the independence axiom) that underlies the potential for dynamic inconsistency.** Whether that static inconsistency *must* be resolved, or whether managing it via resoluteness is "rational enough," is where the deep philosophical divide lies. Your suspicion that it might "relocate the inconsistency" is spot-on; the conflict moves from your actions over time to a conflict between your synchronic preferences at different nodes and your diachronic commitment.
