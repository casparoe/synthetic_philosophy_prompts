  ### Step-by-Step Analysis
  1. **Jenna (+2: Nailed it)**  
     Her debt/punishment distinction perfectly captures Lewis' core argument: Punishment is *personal* (requires guilt) while debts are *transferable*. The judge/murderer example cleanly exposes the incoherence of transferring deserved suffering.

  2. **Marcus (-1: Weak)**  
     Draft substitutions and whipping boys are *obligation transfers*, not *punishment transfers*. Corporate liability is vicarious *accountability*, not *guilt transfer*. These confuse related but distinct concepts, dodging Jenna's (and Lewis') point about *retributive justice*.

  3. **Jenna (+1: Strong)**  
     Correctly identifies Marcus' sleight-of-hand: Draft = civic duty (not punishment), whipping boys = scapegoating (not justice), corporate fines = risk-pricing (not retribution). She exposes how these rely on *debt-like thinking*, not penal logic.

  4. **Marcus (-1: Weak)**  
     Concedes Jenna's point that substitution requires abandoning retribution, but misses her implication. If Christianity *admits* it's converting punishment into debt, it confirms Lewis' critique: "Penal substitution" is an oxymoron. The doctrine's coherence isn't saved by relabeling.

  5. **Jenna (+2: Nailed it)**  
     Delivers the knockout blow: Once punishment becomes transferable debt, *it ceases to be punishment*. Calling it "penal" is semantic theft—what's left is a transactional sacrifice (ransom/price), stripping the concept of its retributive essence.

  ### Bigger Picture Both Miss
  Lewis' deeper point: **Punishment requires a *deserver***. Retributive justice *demands* that the guilty party suffers. Substitution eviscerates this by severing suffering from guilt. Both debaters fixate on *transferability* but overlook that *the very concept of retribution dissolves* when punishment is transferable. The "penal" in penal substitution isn't just strained—it's a category error.

  ### Lewis' Likely View
  Lewis (in his essay) would side with **Jenna**. He argues penal substitution fails *conceptually*: You can't coherently say "X deserves punishment" while allowing Y to bear it, because punishment *by definition* attaches to the guilty. Marcus' examples would strike Lewis as irrelevant (like comparing apples to liability lawsuits). Jenna's moves 1, 3, and 5 align with his core thesis: Substitution transforms punishment into something non-penal.

  ### Key Takeaway
  Jenna wins decisively (4/5 moves stronger). Marcus' counterexamples crumble under scrutiny because they either (a) aren’t punishment or (b) covertly replace retribution with economics. The debate proves Lewis' meta-point: We intuitively reject penal substitution in human justice because we recognize its incoherence—yet suspend this logic in theology through metaphorical debt-shifting.
