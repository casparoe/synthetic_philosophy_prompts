answer: |-
  ## The Collapse of Greaves's Simple/Complex Distinction: An Epistemic Mirage

  Professor Greaves offers a compelling framework in "Cluelessness" by distinguishing "simple" cases (where unforeseeable effects are symmetric) from "complex" cases (where they are asymmetric but intractable). This distinction promises to rescue expected-value reasoning for consequentialists in at least *some* domains. However, upon close inspection, the proposed criterion for distinguishing these cases – the alleged *symmetry* of unforeseeable effects – proves elusive and unstable. It either fails to provide a non-arbitrary sorting mechanism, collapses into triviality, or implicitly smuggles in the very epistemic access it seeks to circumvent. Consequently, the simple/complex distinction cannot be sustained as a principled epistemic or metaphysical boundary.

  **1. The Core Problem: The Epistemic Inaccessibility of "True" Symmetry**

  Greaves motivates the distinction with paradigmatic examples:
  *   **Simple Case:** Choosing between a red or blue sweater for a party. The foreseeable consequences (aesthetics, minor social perceptions) are salient, while long-term unforeseeable ripple effects (e.g., how the color choice influences someone's mood, leading to a cascade of future events) are presumed *symmetric* between the options. Since the unforeseeable effects cancel out, we can legitimately focus on the foreseeable differences.
  *   **Complex Case:** Choosing between donating to an economic-development charity or buying a sandwich. The foreseeable consequences differ (helping many vs. personal satiation), but the long-term, unforeseeable ripple effects (e.g., how the donation alters economic trajectories, political stability, or even existential risk centuries later) are presumed *asymmetric* and fundamentally intractable. Expected-value reasoning based on foreseeable effects is deemed illegitimate here.

  The critical question is: **How do we *know* the unforeseeable effects in the sweater case are symmetric, while those in the charity case are asymmetric?**

  Greaves suggests symmetry holds when we have "no reason to think" the options differ in their unforeseeable effects, or when the unforeseeable effects are "neutral" relative to each other. However, this criterion is epistemically precarious:

  *   **The Baseline Problem:** Establishing symmetry requires knowing what the "neutral" or "canceling" state *is*. In the sweater case, what is the baseline against which both red and blue sweaters have symmetric unforeseeable effects? Is it wearing *no* sweater? Wearing a *grey* sweater? The very notion of symmetry implies a reference point, but this point is itself undefined and arbitrary for truly unforeseeable effects. Why assume the status quo (wearing the sweater you *would have worn otherwise*) is the neutral baseline? Any deviation from it could be asymmetric.
  *   **Lack of Evidence vs. Evidence of Symmetry:** Having "no reason to think" effects differ is not equivalent to having *positive reason* to believe they are symmetric. It is merely an absence of evidence *for* asymmetry. This absence could arise from genuine symmetry *or* from our profound ignorance about the complex causal chains involved. In the sweater case, our inability to model the butterfly effects of color choices doesn't prove symmetry; it proves our ignorance. We have no more reason to believe these effects cancel out than we have to believe they wildly diverge. Presuming symmetry here is an article of faith, not an epistemically grounded conclusion.
  *   **The Charity Case Revisited - Is Asymmetry Knowable?** If symmetry in simple cases is established only by the *absence* of evidence for asymmetry, then the charity case suffers the *same* epistemic limitation. We have "no reason to think" the unforeseeable ripple effects of donating vs. sandwich-buying are *symmetric* either! Greaves diagnoses asymmetry here, but on what basis? The foreseeable consequences are *obviously* asymmetric (helping many vs. feeding one), but this tells us nothing about the *unforeseeable* long-term ripple effects. Claiming asymmetry for the unforeseeable effects requires either:
      (a) Illegitimately importing the foreseeable asymmetry onto the unforeseeable domain (which Greaves explicitly warns against), or
      (b) Making an unfounded metaphysical claim about the inherent nature of the causal chains (e.g., "economic interventions *just are* more world-altering than sartorial choices"), which lacks empirical grounding and seems question-begging.
      The epistemic situation regarding the unforeseeable effects is identical in both cases: profound ignorance. Labeling one "symmetric" and the other "asymmetric" based solely on the nature of the *foreseeable* consequences is arbitrary and conflates distinct epistemic domains.

  **2. Where the Symmetry Criterion Fails: Trivialization and Collapse**

  The attempt to salvage a principled distinction leads to one of two untenable outcomes:

  *   **Trivialization:** If "symmetry" is defined purely by the *absence of specific reasons to expect asymmetry*, then almost *any* pair of sufficiently mundane choices (like choosing tea or coffee) qualifies as "simple." This trivializes the category, as it relies solely on the *type* of foreseeable consequence being perceived as insignificant, not on any demonstrable property of the unforeseeable effects themselves. The distinction becomes sociological (what *seems* insignificant) rather than epistemic or metaphysical. The charity case only seems "complex" because the foreseeable consequences *matter more to us*, not because its unforeseeable effects are demonstrably more asymmetric in principle.
  *   **Collapse:** If we demand *positive evidence* for symmetry (beyond mere absence of evidence for asymmetry), we face an insurmountable epistemic hurdle. We cannot provide such evidence for *any* non-trivial action, as the causal chains are too vast and complex. We cannot run controlled experiments on the butterfly effects of sweater colors versus donations. Without this evidence, *no* case can be confidently labeled "simple." The unforeseeable effects of *every* choice remain potentially asymmetric in unknowable ways. The distinction collapses, as all cases become epistemically "complex" – we are clueless everywhere.

  **3. Engaging a Greavesian Response: Practical Dominance and Salience**

  A sophisticated defender of Greaves might respond by refining the criterion: Symmetry holds in "simple" cases not because we *know* the unforeseeable effects cancel, but because the foreseeable differences are so *dominant* and *salient* that *even if* there were minor unforeseeable asymmetries, they would be swamped by the foreseeable ones. The sweater choice might have minor unforeseeable asymmetries, but they are dwarfed by the foreseeable aesthetic/social effects. In contrast, the foreseeable good of the donation might be *easily outweighed* by vast unforeseeable harms (or benefits), making those unforeseeable effects saliently non-symmetric in their *potential impact* relative to the foreseeable stakes.

  **4. Defending the Objection Against Dominance/Salience**

  While appealing, this response fails to salvage the distinction as *principled* and merely pushes the problem back:

  *   **The Threshold Problem:** What constitutes a "dominant" foreseeable consequence? How large must the foreseeable difference be relative to the *potential range* of unforeseeable asymmetries to count as dominant? Since the *magnitude* of unforeseeable effects is itself unknowable (that's the core of cluelessness!), we cannot assess whether foreseeable differences dominate. The unforeseeable ripple effect of wearing a blue sweater *could*, in some bizarre chain, prevent a future catastrophe or cause one. Without knowing the probability distribution or the range of possible magnitudes of unforeseeable effects, we cannot judge dominance. We are comparing the known (foreseeable) to the utterly unknown and unquantifiable (unforeseeable). Dominance is an empty concept here.
  *   **Salience is Subjective/Contextual:** What makes unforeseeable effects "saliently" potentially asymmetric? It seems largely driven by the *scale* and *nature* of the foreseeable consequences. Donating to charity *feels* high-stakes, so we *worry* more about its unforeseeable effects. Choosing a sweater feels low-stakes, so we *dismiss* its unforeseeable effects. But this is psychological, not epistemic. The *epistemic challenge* – our inability to model or bound the unforeseeable effects – is identical. Basing the distinction on salience rooted in foreseeable stakes concedes that the sorting criterion is parasitic on our prior (and potentially arbitrary) valuation of foreseeable outcomes, not on an independent property of the unforeseeable effects themselves.
  *   **Re-infecting the Simple Cases:** If dominance/salience relies on the foreseeable difference being large *enough*, then any time the foreseeable stakes of a "simple" choice *are* perceived as significant (e.g., wearing a specific color to a crucial job interview), the worry about unforeseeable asymmetries immediately becomes salient, collapsing it into the "complex" category. The stability of the category vanishes with context. More fundamentally, if unforeseeable effects *could* always be vast and asymmetric, then *no* foreseeable consequence, no matter how large, is demonstrably safe from being swamped. The dominance argument assumes we can bound the *potential* impact of the unforeseeable, which is precisely what cluelessness denies.

  **Conclusion: The Indistinguishability of Cluelessness**

  The fundamental epistemic predicament of cluelessness is our radical ignorance concerning the nature, magnitude, and probability distribution of long-term, indirect consequences. Greaves's attempt to cordon off a "simple" domain where this ignorance is benign (due to symmetry) fails because the criterion required to establish this benignity – genuine symmetry of unforeseeable effects – is epistemically inaccessible. We can neither confirm symmetry nor reliably distinguish situations where symmetry holds from those where it doesn't, based on our limited knowledge. The distinction relies either on arbitrary thresholds ("low-stakes" foreseeable consequences), subjective salience, or an unjustified presumption of neutrality that our cluelessness renders baseless. The students' intuition is correct: the cases differ only in the *degree* of our psychological comfort or the *perceived scale* of foreseeable stakes, not in any stable epistemic or metaphysical kind. The specter of asymmetric, intractable, unforeseeable effects haunts *all* consequentialist choice under conditions of deep uncertainty. While Greaves's framework brilliantly illuminates the structure of the problem, the proposed escape hatch of the simple/complex distinction ultimately cannot be opened; the epistemic walls of cluelessness are seamless. The challenge of acting morally under profound ignorance remains undiminished.
