  I should defend against that response by emphasizing that the cluelessness problem is epistemic. Consequentialism requires evaluating outcomes, and if we can't reliably distinguish symmetric from asymmetric cases, the distinction collapses. Pragmatism doesn't save the epistemic foundation.

