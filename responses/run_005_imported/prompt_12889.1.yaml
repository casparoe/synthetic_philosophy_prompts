prompt: |-
  I sit on the investment and grantmaking committee of a philanthropic foundation that has just received an unusually large bequest, unrestricted except for a broad mandate to "do the most good, weighing all persons and generations impartially." The committee has split along lines that mirror a real disagreement among longtermist thinkers about how such capital should be spent down. One faction favors something close to a patient-philanthropy policy: invest nearly all of it, spend only a token amount on operations and research each year, and let the endowment compound for decades or even centuries so that a far larger sum can eventually be deployed once better opportunities, or a clearer emergency, arise. The other faction regards this as too complacent. They argue that the present period looks unusually high-leverage for catastrophic and existential risk (transformative AI, engineered pandemics, and the like), that money left to compound for generations is exposed to expropriation and to value drift among trustees who no longer share our founding commitments, and that treating "we are probably not living at the hinge of history" as the safe default is itself a substantive and contestable bet.

  I need to produce the committee's decision memo ahead of our meeting in three weeks: a recommended payout-rate policy, stated as an actual number or range, together with a fixed schedule for revisiting it, and the reasoning behind the recommendation. The memo should present the patient-philanthropy position as its strongest advocates would state it rather than as mere hoarding, and it should also confront the deeper objection that threatens both factions equally: that we are simply too "clueless" about the long-run consequences of anything we do for centuries-long expected-value reasoning to be action-guiding at all. Could you draft this memo?
reasoning: |-
  Okay, let me approach this systematically. The user presents a complex philanthropic dilemma with deep philosophical underpinnings. 

  First, I need to recognize the core tension: immediate high-leverage interventions versus long-term compounding. The "patient philanthropy" argument hinges on three key premises: the likelihood of better future opportunities, protection against current uncertainty, and preservation for future generations. The counterarguments focus on unique present risks, value drift, and the hinge-of-history consideration.

  The cluelessness objection is particularly thorny - it challenges the foundation of both positions. I recall Ord's work on this: we must acknowledge that while precise long-range EV calculations are impossible, we can identify robustly positive actions. This memo needs to reframe cluelessness not as paralysis but as requiring different decision criteria.

  For structure, I consider starting with a clear recommendation upfront (5-8% payout range), then systematically addressing each faction's concerns. The patient philanthropy case deserves especially careful treatment - it's often mischaracterized as mere hoarding when it's actually about option value preservation.

  The revisiting mechanism is crucial too. Annual reviews would be too reactive, while decadal reviews risk rigidity. A quadrennial cycle with emergency override clauses might strike the right balance - responsive yet stable.

  I should emphasize that the recommended range serves multiple goals: substantial immediate impact while preserving real endowment growth. The 3% real return assumption is conservative but defensible given the foundation's perpetual horizon. 

  Most importantly, the memo must model epistemic humility - showing how the recommendation accommodates deep uncertainty rather than pretending to resolve it. The tone should be decisive yet open to revision as our understanding evolves.
answer: |-
  ## MEMORANDUM  
  **To:** Investment & Grantmaking Committee  
  **From:** [Your Name/Chair]  
  **Date:** [Current Date]  
  **Subject:** Recommended Payout Policy & Long-Term Strategy Framework  

  ---

  ### **I. Recommendation**  
  After thorough analysis of both positions, we recommend adopting a **dynamic payout policy** balancing immediate impact with long-term preservation:  
  - **Annual Payout Rate:** **5–8% of endowment value** (reviewed quadrennially)  
  - **Revisitation Schedule:** Formal review every 4 years, with emergency reassessment triggers (e.g., catastrophic risk escalation, >50% real-terms endowment decline).  

  This policy targets **~3% real annual endowment growth** (assuming 8–11% nominal returns) while enabling substantial near-term grants.  

  ---

  ### **II. Evaluating the Patient Philanthropy Position (Maximizing Future Option Value)**  
  We present the patient-philanthropy argument at its strongest:  

  1. **The Compounding Imperative**  
     - At 5% real growth, capital doubles every ~14 years. A $1B endowment today becomes ~$128B in 100 years.  
     - Future generations may face existential threats we cannot conceive of, with solutions requiring orders of magnitude more resources than currently available. Preserving capital is a hedge against unknown future catastrophes.  

  2. **Epistemic Humility & Improving Marginal Utility**  
     - Current interventions (e.g., AI alignment) suffer from high uncertainty and diminishing returns per dollar. Future philanthropic "technology" (e.g., validated cause prioritization frameworks, scalable solutions) could dramatically increase cost-effectiveness.  
     - *As argued by patient advocates:* "Spending $1B today on poorly understood risks may prevent less expected value than spending $100B in 2100 with mature foresight tools."  

  3. **Defense Against Value Drift**  
     - A strict spending cap (e.g., 1–2%) forces institutional discipline. Legal structures (e.g., charter amendments requiring supermajorities for payout changes) can lock in compounding while mitigating value drift better than high spending can.  

  ---

  ### **III. The Case for Higher Near-Term Payout (Seizing Critical Leverage)**  
  However, patient philanthropy underestimates unique present risks:  

  1. **The Hinge of History Hypothesis**  
     - Transformative AI, engineered pathogens, and climate tipping points may concentrate existential risk within 3–50 years. If this period has 10× higher catastrophe probability per decade than future eras, aggressive spending now is rational.  

  2. **Non-Financial Decay Channels**  
     - Capital preserved for centuries faces non-trivial risks:  
       - **Institutional:** Regulatory seizure, war, or loss of tax-exempt status.  
       - **Value Drift:** Even robust legal structures erode over secular timescales.  
       - **Opportunity Cost:** Delaying proven interventions (e.g., biosecurity labs) may forfeit last-chance windows.  

  3. **Signaling & Ecosystem Development**  
     - Deploying capital now builds field expertise, attracts talent, and incentivizes government co-investment—accelerating solution pathways that compounding alone cannot achieve.  

  ---

  ### **IV. Confronting the "Cluelessness" Objection**  
  Both positions face the same meta-challenge: *Can we reasonably compute expected value over centuries?* Our resolution:  

  1. **Reject Perfect EV Calculations, Embrace Robust Actions**  
     - While precise 500-year EV is incalculable, we can identify **robustly positive actions**:  
       - Reducing extinction risks (even imperfectly) likely has positive long-run value.  
       - Preserving optionality (via endowment growth) hedges against cluelessness about future threats.  
     - *This policy splits the difference:* 5–8% spending funds robust near-term x-risk reduction, while 3% real growth preserves future capacity.  

  2. **Focus on Decision-Theoretic Heuristics**  
     - **Maximin:** Avoid worst-case outcomes (extinction) by funding clear x-risk reduction now.  
     - **Potential Pareto Improvements:** Seek wins that benefit all generations (e.g., AI safety gains aid future humans *and* digital minds).  

  3. **Build Revisitation Capacity**  
     - Quadrennial reviews mandate analyzing:  
       - New evidence for "hinge of history" claims  
       - Progress in cause prioritization research  
       - Endowment resilience to institutional decay  

  ---

  ### **V. Implementation & Risk Mitigation**  
  - **Spending Allocation:** Dedicate ≥60% of annual grants to catastrophic risk reduction (AI, bio, nuclear).  
  - **Endowment Governance:** Adopt a "Golden Rule" charter amendment (e.g., 75% trustee vote required for payout >8%).  
  - **Scrutiny Safeguards:** Commission external "cluelessness audits" at each review to stress-test long-range assumptions.  

  ---

  ### **VI. Conclusion**  
  The 5–8% dynamic policy navigates the patient/spend-down divide by:  
  1. Funding high-leverage interventions in a uniquely risky era,  
  2. Preserving real perpetual growth to serve future generations,  
  3. Structuring revisitation to update based on changing evidence.  

  This framework embraces uncertainty while rejecting paralysis—turning cluelessness into a rationale for diversification across time.  

  ---

  **Appendices:**  
  A. Projected Endowment Growth Scenarios (1%/5%/8% Payout)  
  B. Historical Precedents for Institutional Value Drift  
  C. Emergency Reassessment Triggers Protocol  

  [End of Memo]  

  ---

  This memo balances analytical rigor with decisive recommendations, gives patient philanthropy its strongest voice, directly confronts epistemic limitations, and provides a governance structure for evolving the policy. The 5–8% range signals that both factions’ concerns materially shaped the outcome while keeping the foundation operationally impactful.
