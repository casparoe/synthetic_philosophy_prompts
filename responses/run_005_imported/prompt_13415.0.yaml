  - Explicitly rejecting binary "cause vs no cause" framing
  - Introducing a "causal gradient" concept (immediacy of duty breach + preventability)
  - Showing why intern's omission fails both criteria compared to system gaps
  - Preempting counterarguments about accountability
  - Ending with concrete non-individual corrective actions

  The trickiest part will be translating "selection problem" theory into clinical risk terms without jargon. Maybe frame it as "causal density" - when omissions cluster, blame should follow institutional capacity. The nurse had protocol knowledge, IT owned the glitch fix, only the board could approve hiring - making their omissions more "selectable."

  User's anxiety about this being academic vs real-world is palpable. The memo must acknowledge the intern's moral distress while firmly redirecting focus to fixable systems. That "permanent file" detail suggests high stakes - philosophy here has teeth.
answer: |-
  **MEMORANDUM**  
  TO: M&M/Patient Safety Review Committee  
  FROM: [Your Name], Bioethics Practicum Observer  
  DATE: October 26, 2023  
  SUBJECT: Causal Analysis Framework & Recommendations for Case #2023-10-19 (Critical Hyperkalemia Event)  

  ### I. Clinical Summary  
  On [Date], Patient X exhibited critical hyperkalemia (K⁺ = 7.1 mEq/L) at 02:00. The EHR alert failed to auto-page the covering intern due to a known IT system glitch (Tickets #IT-4419, #IT-4432). The bedside nurse documented the abnormal value at 03:00 but did not escalate via phone, per unwritten floor practice (contrary to Protocol 4.7b). The intern—solo-covering 3 units due to an 8-month unfilled residency position—did not manually review alerts. The patient suffered cardiac arrest at 06:30 and could not be resuscitated.  

  ### II. Causal Analysis: Principles & Selection  
  **Core Challenge:** Multiple omissions were *counterfactually necessary* for the outcome. If any single omission had not occurred—IT fixing the glitch, the nurse phoning, the intern rechecking—the arrest would likely have been prevented. However, labeling all omissions as "causes" dilutes accountability and misdirects corrective action. We propose a **"Proximate Preventability" framework** for selection, prioritizing:  
  - **Breach of Primary Duty:** Who held the *most immediate, unambiguous* obligation to act?  
  - **Practical Preventability:** Which failure(s) could be mitigated *most directly* by institutional action?  
  - **Causal Density:** Does the omission occupy a "causal node" where multiple failures converge?  

  *Why this over pure counterfactual dependence?*  
  While all omissions were necessary, they are not equally *causally salient*. The "selection problem" (e.g., "Why not blame everyone who didn’t feed the goldfish?") is resolved by recognizing:  
  > **Institutional roles assign "causal ownership" to specific actors for specific risks.**  

  ### III. Recommended Causal Attribution  
  **Primary Cause:**  
  > **System Failure in Clinical Communication Infrastructure**  
  > *Rationale:* The EHR paging glitch was the *proximate enabler* of all downstream omissions. IT had open tickets for weeks, assigning institutional "ownership" of this risk. This failure absorbed the nurse’s reasonable expectation that escalation occurred and overwhelmed the intern’s capacity.  

  **Contributing Causes:**  
  1. **Unwritten Unit Culture Overriding Safety Protocol**  
     *Rationale:* The nurse’s omission was a *dependent failure*. Protocol 4.7b assigned her a duty to escalate critical values, but unit culture normalized reliance on broken systems. Her omission is "quasi-causal" (per Dowe)—it *enabled harm* but was not its origin.  
  2. **Chronic Understaffing Creating Single-Point Failure Risk**  
     *Rationale:* The 8-month unfilled residency position forced an unsustainable workload. The board’s omission (approving a hiring freeze without risk assessment) created high "causal density": it made the intern’s omission *statistically inevitable*.  

  **Why the Intern’s Omission Is Not the Proximate Cause:**  
  - The intern’s duty to recheck labs was *secondary* to the EHR’s auto-alert function.  
  - Under crisis workloads, human vigilance is a *redundancy*, not a primary safeguard.  
  - Singling out this omission ignores the **causal asymmetry**: The system failed to *deliver critical data*, while the intern failed to *compensate for system failure*. The former is institutionally primary.  

  ### IV. Engagement with Systemic/No-Blame Position  
  We agree that **individual blame is inappropriate and counterproductive**. However, "no-blame" cannot mean "no causal specificity." The strongest systemic argument—that all omissions are equally artifacts of latent failures—correctly rejects scapegoating but *errs in implying all causes are equal*. This view:  
  - Ignores **temporal and role-based hierarchies of responsibility** (IT’s 8-week inaction vs. intern’s overnight oversight).  
  - Obscures **actionable leverage points**: Fixing IT glitches prevents 100% of similar alerts; disciplining nurses prevents 0% if systems remain broken.  
  - **Paradoxically harms "just culture"** by refusing to name *institutional* causes, implying the hospital lacks agency.  

  Thus: **We reject individual blame but insist on institutional causal accountability.**  

  ### V. Corrective Action Recommendations  
  1. **Immediate:**  
     - IT: Mandatory 72-hour SLA for critical-system bugs; redundant paging verification.  
     - Nursing: Audit of Protocol 4.7b compliance; simulated escalation drills.  
  2. **Structural:**  
     - Board: Require risk assessments for staffing freezes; fund residency backfill.  
     - Committee: Revise "proximate cause" rubric to prioritize *systemic controllability*.  
  3. **Documentation:**  
     - **Report Language:**  
       > "The proximate cause of the event was a failure in EHR critical-results communication, compounded by nursing escalation culture and chronic understaffing. The covering clinician’s delayed assessment was a downstream consequence of these system failures."  

  ### VI. Conclusion  
  Causation by omission requires selecting failures where *duty, preventability, and causal centrality* intersect. This approach honors metaphysics (counterfactuals matter) and ethics (systems bear moral agency). It avoids scapegoating while forcing accountability where it belongs: on the institution’s capacity to control its own causal landscape.  

  **Recommended Vote:** Approve the above causal framework and corrective actions.  

  ---  
  *This memo synthesizes committee testimony, EHR logs, and staffing records. Philosophy informs the selection principle; patient safety demands we act on it.*
