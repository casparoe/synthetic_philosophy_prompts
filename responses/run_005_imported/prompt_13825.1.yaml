answer: |-
  You've grasped a key part, but the "paradox" label in the Centipede Game points to something **deeper and more theoretically unsettling** than *just* a standard rationality-behavior gap. While experiments certainly show deviations, the paradox exists even within the idealized rational model itself. Here's the breakdown for your lit review:

  1.  **Your Correct Point (The Baseline):**
      *   Backward Induction (BI) *does* pin down immediate defection (e.g., taking the large pile on move 1) as the unique Subgame Perfect Nash Equilibrium (SPNE).
      *   Experiments (like McKelvey & Palfrey, 1992) consistently show most subjects cooperate for several moves, accumulating larger payoffs before someone defects.
      *   This *is* a deviation from the SPNE prediction.

  2.  **The Deeper Paradox (Why it's called a "Paradox"):**
      *   **Pareto Inefficiency:** The BI/SPNE outcome is **Pareto inefficient**. *Both* players could be significantly better off if they cooperated for many moves before eventually defecting. The "rational" outcome is worse for *everyone* than many "irrational" outcomes achievable through limited cooperation.
      *   **Tension with Collective Rationality:** BI forces players into an outcome that is collectively disastrous, even though each step of the logic (looking ahead and best-responding) seems individually rational. It starkly highlights the conflict between individual rationality (as defined by BI) and collective welfare/group rationality.
      *   **Counterintuitive Result:** The stark conclusion that the *only* rational thing to do is defect *immediately*, forgoing massive potential gains for both players, feels deeply counterintuitive and "paradoxical" to most people (including theorists initially). It seems absurd that rational players would leave so much money on the table.
      *   **Challenge to the Solution Concept:** The paradox forces us to question the assumptions and applicability of BI/SPNE itself. Is BI *really* the right way to model rationality in such long, finite games? Does it rely on implausible assumptions (like common knowledge of rationality and common knowledge of the game structure holding perfectly all the way down the tree)? The paradox suggests BI might be "too rational" or require unrealistic levels of coordination on rationality. (This is where concepts like the "trembling hand" or Reny's critique come in).

  **How to Frame it for Your Lit Review:**

  > "The Centipede Game is termed a 'paradox' not solely due to observed behavioral deviations from the unique subgame-perfect equilibrium (SPNE) of immediate defection, as documented in experiments (e.g., McKelvey & Palfrey, 1992), but fundamentally because the SPNE outcome itself is deeply counterintuitive and Pareto inefficient. While backward induction rigorously derives immediate defection as the SPNE, this outcome leaves significant mutual gains unexploited compared to outcomes involving limited cooperation. The paradox highlights a profound tension within game-theoretic rationality: individually rational play (as defined by SPNE) leads to a collectively inferior result. This challenges the descriptive and sometimes normative plausibility of backward induction in finite games of perfect information, suggesting its assumptions (e.g., common knowledge of rationality) may break down in practice or that alternative solution concepts might be warranted. Experimental results documenting cooperation are thus not merely evidence of bounded rationality but also tests probing the robustness of the SPNE concept and the underlying assumptions required for its prediction."

  **Key Distinctions from Simple Rationality Gaps:**

  *   **Loss Aversion/Present Bias:** These describe psychological *biases* causing deviations from the normative rational choice model (e.g., utility maximization under risk or exponential discounting). The rational benchmark itself isn't paradoxical.
  *   **Centipede Paradox:** The *rational benchmark itself* (BI/SPNE) produces a paradoxical, Pareto-dominated outcome. The paradox lies *within* the rational model's implications.

  **Bonus Points for Depth (if space allows):**

  *   Mention Binmore's argument that the SPNE *is* rational if players truly have common knowledge of rationality (CKR), but that CKR is incredibly demanding and fragile in long games.
  *   Reference Reny's critique that BI assumes players believe their opponents will act irrationally in the future (by not defecting optimally later) if they themselves act irrationally now, creating a logical inconsistency within the CKR assumption.
  *   Note that the paradox weakens as the game gets shorter, highlighting the role of the game's length.

  By framing it this way, you show a deeper understanding of why the Centipede Game is theoretically significant beyond just being another example of humans not being perfectly rational agents. Good luck with your prelim!
