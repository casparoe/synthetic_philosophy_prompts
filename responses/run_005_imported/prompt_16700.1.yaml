prompt: |-
  This term I'm taking an advanced seminar on formal epistemology, and we've just finished the unit on epistemic utility theory and the accuracy-dominance argument for probabilism. I follow the headline result — that every incoherent credence function is accuracy-dominated by some coherent one, relative to a legitimate inaccuracy measure — but I'm struggling with why the literature insists that the measure be strictly proper rather than merely proper. Could you explain exactly which step of the dominance argument fails, or becomes vacuous, once we relax strict propriety to mere propriety? A concrete illustration would help: describe a toy scoring rule that is proper but not strictly proper, and show what happens to the set of credence functions that count as accuracy-dominated under it. Finally, say a bit about how strict propriety relates to the "immodesty" condition that's often invoked in the same breath — are the two ultimately the same requirement, or can they come apart?
reasoning: |-
  Okay, the user is diving deep into formal epistemology, specifically epistemic utility theory and the accuracy-dominance argument for probabilism. They understand the main result but are stuck on why strict propriety is crucial instead of just propriety for scoring rules. They want to know exactly where the argument fails without strict propriety, a concrete example, and how strict propriety relates to immodesty.

  First, I need to recall the accuracy-dominance argument. The key steps are: (1) defining legitimate inaccuracy measures as those generated by strictly proper scoring rules, (2) showing that incoherent credences are accuracy-dominated by some coherent one, and (3) proving that coherent credences aren't dominated. Step 3 relies on strict propriety. If a scoring rule is only proper but not strictly proper, coherent credences might be dominated by other coherent ones, violating the non-dominance part of probabilism.

  For a concrete example, I should create a simple scoring rule that's proper but not strictly proper. The absolute value scoring rule comes to mind. For a proposition, it penalizes based on the absolute difference between credence and truth value. This rule is proper because the expected score is minimized at the agent's actual credence. But it's not strictly proper because multiple credences can minimize the expected score. For instance, with a uniform prior, any credence between 0 and 1 gives the same expected score for a coin flip.

  Now, to demonstrate the failure: consider an agent with credence 0.5 in a coin toss. Under this scoring rule, any coherent credence (like 0.4 or 0.6) might not dominate 0.5 because the inaccuracy at different worlds might not be strictly better. But more critically, the coherent credences themselves might be dominated. Suppose an agent assigns credence 0.6 to a proposition. Another coherent credence, say 0.5, could have the same or better inaccuracy in all worlds, making 0.6 dominated. This breaks step 3 of the argument, where coherent credences should be non-dominated.

  Regarding immodesty: strict propriety ensures that each credence function uniquely minimizes its expected inaccuracy from its own perspective, which is immodesty. Mere propriety allows multiple minimizers, so an agent might see another credence as equally good, failing immodesty. They're connected; strict propriety implies immodesty, but immodesty might be seen as a weaker condition if we consider other factors, though in standard scoring rules, they align.

  The user's deeper need might be understanding the necessity of strict propriety in securing probabilism's foundation. They might be preparing for a presentation or paper, needing to explain why weakening to propriety undermines the argument. Clarifying the concrete failure in step 3 and the immodesty link addresses their confusion and reinforces the argument's structure.
answer: |-
  Your question cuts to the heart of why strict propriety is essential for the accuracy-dominance argument for probabilism. Let's break down the argument, identify where mere propriety fails, provide a concrete example, and clarify the immodesty connection.

  **The Accuracy-Dominance Argument (Brief Recap):**
  1.  **Legitimacy:** Only scoring rules generating inaccuracy measures that are *proper* (and satisfy other constraints like continuity, additivity, etc.) are considered legitimate.
  2.  **Domination of Incoherence:** For any *incoherent* credence function `b`, there exists a *coherent* credence function `c` such that `c` is strictly more accurate than `b` in *every* possible world.
  3.  **Non-Domination of Coherence:** No *coherent* credence function `c` is accuracy-dominated by *any other* credence function `c'` (coherent or incoherent). That is, there is no `c'` such that `c'` is at least as accurate as `c` in every world and strictly more accurate in at least one world.

  **The Crucial Failure under Mere Propriety:**
  The failure occurs precisely in **Step 3 (Non-Domination of Coherence)**. While a merely proper scoring rule ensures that each coherent credence function `c` *minimizes* expected inaccuracy *from its own perspective* (`c` is *a* minimum), it does *not* guarantee that `c` is the *unique* minimum. This opens the door for other credence functions (potentially other coherent ones!) to be *equally good* as `c` in *every* possible world. If `c'` is coherent and `I(c', w) = I(c, w)` for *all* `w`, then `c'` is *at least as accurate* as `c` in every world. Since they are distinct (`c' ≠ c`), this means `c` is *weakly dominated* by `c'` (and vice-versa). More catastrophically for the argument, it might even be possible for another coherent `c'` to be strictly better than `c` in *some* worlds while being equally good in others, constituting strict domination.

  Strict propriety prevents this by ensuring each coherent `c` is the *unique* minimizer of expected inaccuracy *from its own perspective*. This uniqueness propagates through the mathematics to guarantee that no other credence function can match `c`'s accuracy profile across *all* worlds, preventing weak or strict domination by another coherent function.

  **Concrete Illustration: The Absolute Value Scoring Rule**

  Consider a single proposition `A`. Define a scoring rule `S` as follows:
  *   `S(1, x) = |1 - x|`  (Inaccuracy if `A` is true, `v(A)=1`)
  *   `S(0, x) = |0 - x| = |x|`  (Inaccuracy if `A` is false, `v(A)=0`)

  **1. Propriety:** This rule is **proper**.
      *   Expected Inaccuracy from perspective of `p`: `Exp_I(S, p, x) = p * |1 - x| + (1-p) * |x|`
      *   Minimizing `Exp_I` w.r.t. `x`:
          *   If `p > 0.5`, the minimum occurs at `x=1` (Exp_I = `p*0 + (1-p)*1 = 1-p`)
          *   If `p < 0.5`, the minimum occurs at `x=0` (Exp_I = `p*1 + (1-p)*0 = p`)
          *   If `p = 0.5`, the minimum occurs for *any* `x` in `[0, 1]`! (Exp_I = `0.5*|1-x| + 0.5*|x| = 0.5` for all `x`)
      *   Crucially, for any `p`, reporting `x = p` *achieves* the minimum expected inaccuracy. Therefore, it's proper. An agent minimizes expected inaccuracy by reporting their true credence.

  **2. Not Strictly Proper:** The rule is **not strictly proper** because when `p = 0.5`, *every* credence `x` in `[0, 1]` minimizes expected inaccuracy. The minimum is not unique.

  **3. What Happens to Dominance (Step 3 Failure):** Consider two coherent credence functions defined solely for `A`:
      *   `c₁(A) = 0.5`
      *   `c₂(A) = 0.6`

  Calculate their inaccuracy in each world:
  *   World `w1` (`A` true): `I(c₁, w1) = |1 - 0.5| = 0.5`; `I(c₂, w1) = |1 - 0.6| = 0.4`
  *   World `w0` (`A` false): `I(c₁, w0) = |0 - 0.5| = 0.5`; `I(c₂, w0) = |0 - 0.6| = 0.6`

  **Is `c₁` dominated?** Compare `c₁` and `c₂`:
  *   In `w1`: `c₂` is *more* accurate than `c₁` (`0.4 < 0.5`)
  *   In `w0`: `c₂` is *less* accurate than `c₁` (`0.6 > 0.5`)
  `c₂` does not dominate `c₁`. Now consider *any* other credence function `b`:
  *   If `b(A) < 0.5`, its inaccuracy in `w1` is `> 0.5` (worse than `c₁` in `w1`).
  *   If `b(A) > 0.5`, its inaccuracy in `w0` is `> 0.5` (worse than `c₁` in `w0`).
  *   If `b(A) = 0.5`, its inaccuracy matches `c₁` in both worlds.
  No function is strictly more accurate than `c₁` in *both* worlds. `c₁` is not strictly dominated.

  **Is `c₂` dominated?** Consider `c₁`:
  *   In `w1`: `c₁` is *less* accurate than `c₂` (`0.5 > 0.4`) → Worse!
  *   In `w0`: `c₁` is *more* accurate than `c₂` (`0.5 < 0.6`)
  `c₁` does not dominate `c₂`. Now consider a credence function `b` with `b(A) = 0.5`:
  *   In `w1`: `I(b, w1) = 0.5 > I(c₂, w1) = 0.4` → Worse.
  *   In `w0`: `I(b, w0) = 0.5 < I(c₂, w0) = 0.6` → Better, but not universally better.
  What about `b(A) = 0.7`?
  *   `w1`: `|1-0.7|=0.3 < 0.4` → Better!
  *   `w0`: `|0-0.7|=0.7 > 0.6` → Worse!
  **The Problem:** `c₂` is coherent, yet **is it weakly dominated?** Consider `c₃(A) = 0.5`:
  *   `w1`: `I(c₃, w1) = 0.5 > I(c₂, w1) = 0.4` → `c₃` is *worse* here. No domination.
  **Weak Domination Example:** While `c₂` might not be *strictly* dominated by a single function, the **real failure of Step 3** manifests differently under mere propriety. Crucially, because the minimum at `p=0.5` is flat, coherent credences *can be equally accurate*. Compare `c₁` (`A=0.5`) and `c₄` (`A=0.5`). They are the same function. Now compare `c₁` (`A=0.5`) and a *different* coherent function `c₅` defined for `A` and an *irrelevant* tautology `T` (`c₅` must assign `T` credence 1 to be coherent):
  *   `c₁(A) = 0.5`, `c₁(T) = ?` (Assume we only defined it for `A`, so implicitly `c₁(T)=1` for coherence).
  *   `c₅(A) = 0.5`, `c₅(T) = 1`.
  These are distinct coherent functions (`c₁` might be defined only on `{A}`, `c₅` on `{A, T}`, but they agree on `A`). For any world `w`:
  *   If `w` makes `A` true: `I(c₁, w) = |1-0.5| = 0.5`; `I(c₅, w) = |1-0.5| + |1-1| = 0.5 + 0 = 0.5`
  *   If `w` makes `A` false: `I(c₁, w) = |0-0.5| = 0.5`; `I(c₅, w) = |0-0.5| + |1-1| = 0.5 + 0 = 0.5`
  **`c₅` is *at least as accurate* as `c₁` in every world (in fact, equally accurate).** Since `c₅ ≠ c₁`, this means `c₁` is **weakly dominated** by `c₅` (and vice-versa). **Step 3 fails:** A coherent credence function (`c₁`) *is* accuracy-dominated (weakly) by another coherent credence function (`c₅`).

  **The Core Issue:** Mere propriety allows distinct coherent credence functions to have identical inaccuracy scores in every possible world (especially if they differ only on propositions where the scoring rule is "flat" given the truth values of relevant propositions). This directly violates the Non-Domination of Coherence step. The accuracy-dominance argument aims to show coherence is *necessary* (Step 2) and *sufficient* (Step 3) for avoiding dominance. Mere propriety preserves necessity (Step 2 still holds: incoherent functions *are* dominated), but destroys sufficiency (Step 3 fails: some coherent functions *are* dominated, at least weakly, by other coherent ones). Strict propriety ensures that distinct credence functions have distinct inaccuracy profiles across possible worlds, preventing this weak domination among coherent functions.

  **Strict Propriety and Immodesty**

  1.  **Immodesty Defined:** A credence function `c` is **immodest** relative to a scoring rule `S` if `c` uniquely minimizes expected inaccuracy *from its own perspective*. That is, `Exp_I(S, c, c) < Exp_I(S, c, c')` for all `c' ≠ c`.
  2.  **The Connection:**
      *   **Strict Propriety *implies* Immodesty for Coherent Credences:** If `S` is strictly proper, then for any coherent credence function `c`, `c` is the unique minimizer of expected inaccuracy *from the perspective of `c` itself*. Therefore, every coherent `c` is immodest relative to `S`.
      *   **Immodesty *does not imply* Strict Propriety:** Immodesty is a property of a *credence function* relative to a scoring rule. Strict propriety is a property of the *scoring rule itself*. A scoring rule could be merely proper but *happen* to make a *particular* coherent credence function `c` immodest (e.g., if `c` assigns no credence exactly 0.5 in our absolute value example, `c` would be immodest). However, a merely proper rule will *fail* to make *some* coherent credence functions immodest (e.g., any coherent `c` assigning `p=0.5` to some proposition under the absolute value rule is *modest* - it sees many other credences as equally good).
  3.  **The Relationship:** Strict propriety is a **global** property of the scoring rule guaranteeing that **every** coherent credence function is immodest relative to it. Immodesty is a **local** property of individual credence functions relative to the rule. For the accuracy-dominance argument to work (specifically, to secure Step 3), we need the *global guarantee* that *all* coherent credence functions are immodest. This is provided by strict propriety. Mere propriety only provides the weaker guarantee that each coherent credence function is *a* minimizer from its own perspective (modesty), not necessarily the *unique* minimizer (immodesty).

  **In Summary:**

  1.  **Failure Point:** Mere propriety breaks Step 3 (Non-Domination of Coherence) of the accuracy-dominance argument. It allows distinct coherent credence functions to have identical accuracy profiles (or profiles where one is never worse), leading to weak (or sometimes even strict) domination *among coherent functions*.
  2.  **Illustration:** The absolute value scoring rule is proper but not strictly proper. While it doesn't easily show strict domination of one coherent function by another *for the same domain*, it clearly demonstrates how coherent functions differing only on "irrelevant" propositions can have identical inaccuracy scores in all worlds (`c₁` vs. `c₅`), violating the uniqueness required for non-domination. More complex merely proper rules can exhibit clearer strict domination among coherent functions.
  3.  **Immodesty vs. Strict Propriety:** Strict propriety is a stronger, global property of the scoring rule that *entails* that every coherent credence function is immodest relative to it. Immodesty is a weaker, local property of individual credence functions. The dominance argument requires the global guarantee of universal immodesty among coherent functions, which only strict propriety provides. Mere propriety only guarantees modesty, which is insufficient.

  The insistence on strict propriety isn't pedantry; it's the linchpin ensuring that the accuracy-dominance argument delivers the full "probabilism as the logic of accuracy" result, where coherence is both necessary *and sufficient* for avoiding accuracy dominance. Relaxing to mere propriety leaves coherence sufficient only for avoiding *strict* dominance *by incoherent functions*, but not sufficient for avoiding even weak dominance *by other coherent functions*.
