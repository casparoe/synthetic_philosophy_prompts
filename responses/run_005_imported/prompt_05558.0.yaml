  Let me unpack why theorists treat negation separately. First, conditionals and negation make different demands on expressivism. Conditionals require explaining how non-assertive attitudes embed in complex structures while preserving validity. But negation is more fundamental - it's about the consistency of attitudes themselves. Blackburn's higher-order attitudes work for conditionals because they model disapproval of combined attitudes, but negation forces us to define what "disapproving of disapproval" even means. That's a meta-problem about attitude coherence that conditionals don't directly address.

