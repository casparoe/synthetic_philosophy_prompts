answer: |-
  You've hit on a crucial insight! Your intuition that the negation problem shouldn't be a *fundamentally* separate obstacle *if* the conditional problem is solved is spot-on and reflects a sophisticated understanding of the expressivist project. However, there are specific reasons why the negation problem often gets highlighted as a distinct challenge, even after solutions for the conditional are proposed. Here's why:

  1.  **The Core Challenge: Defining the Attitude for "Not Wrong":**
      *   **Modus Ponens (Conditional):** The challenge is explaining how an attitude towards "if P then Q" combines with an attitude towards "P" to *force* the attitude towards "Q" in a way that mirrors logical validity. Solutions like Blackburn's higher-order attitudes (e.g., disapproval of approving lying while not disapproving of getting your brother to lie) focus on the *relationship* between attitudes.
      *   **Negation ("Not Wrong"):** The challenge is defining the *attitude expressed* by the negation itself, "~wrong", in a way that:
          *   (a) Logically contrasts with the attitude expressed by "wrong" (disapproval).
          *   (b) Avoids collapsing into triviality (e.g., indifference) or incoherence.
          *   (c) Makes the inconsistency between "wrong" and "not wrong" (e.g., "Lying is wrong" and "Lying is not wrong") immediately apparent and grounded in the attitudes expressed, not just stipulated logic.
      *   **The Difference:** The conditional problem is primarily about the *interaction* of attitudes. The negation problem is primarily about defining the *content* of the fundamental attitude expressed by the negated normative predicate itself. It's about the basic building block.

  2.  **Schroeder's "The Negation Problem" (2008a,b) - The Specific Objection:**
      Schroeder crystallized the issue by arguing that expressivists faced a dilemma in defining the attitude for "not wrong" that standard solutions for conditionals didn't automatically resolve:
      *   **Option 1: "Not Wrong" = Lack of Disapproval (Indifference?):** If "not wrong" expresses merely the *lack* of disapproval towards lying, then "Lying is not wrong" is compatible with *also* lacking approval. But "Lying is permissible" intuitively *isn't* just indifference; it seems like a positive stance. Worse, "Lying is wrong" (disapproval) and "Lying is not wrong" (lack of disapproval) aren't strictly logically inconsistent attitudes! You could disapprove of lying *and* lack disapproval of it (which is incoherent only if disapproval entails not lacking disapproval, which it doesn't in standard attitude psychology).
      *   **Option 2: "Not Wrong" = Approval?:** If "not wrong" expresses *approval* of lying, then we get a clear contrast: disapproval vs. approval. But this seems too strong. Saying "Lying is not wrong" doesn't usually mean you *approve* of lying; it often just means you *don't disapprove* (it's permissible). It conflates permissibility with positive endorsement.
      *   **The Dilemma:** Expressivism seems forced to choose between defining "not wrong" as something too weak (lack of disapproval, leading to no inconsistency) or too strong (approval, misrepresenting permissibility). Neither captures the intuitive meaning and logical behavior of "not wrong".

  3.  **Why Solutions for Conditionals Don't *Automatically* Solve Negation:**
      *   **Blackburn's Higher-Order Attitudes:** While brilliant for conditionals, higher-order attitudes don't directly tell us what attitude *constitutes* "not wrong". Saying "not wrong" expresses disapproval of disapproval (a higher-order attitude) might be a *candidate* solution (Gibbard explores this), but it's not the *only* one implied by the conditional machinery, and it needs separate justification and assessment against the dilemma above. Does "disapproving of disapproval" avoid the problems of Option 1 and 2? That requires specific analysis of negation.
      *   **Gibbard's Solution (Planning/World-Norm Pairs):** Gibbard's framework *does* ultimately provide a unified solution precisely because it fundamentally rethinks the semantics. He analyzes normative statements as expressions of plans (or more abstractly, as ruling out world-norm pairs). Crucially:
          *   "Wrong" (e.g., "Lying is wrong") = Ruling out *any* contingency where lying occurs *and* one endorses the relevant norms.
          *   "Not Wrong" ("~Wrong") = Ruling out *only* the contingencies where lying occurs *and* one *doesn't* endorse the relevant norms (i.e., it's incompatible with ruling out lying). This captures permissibility without requiring positive approval.
          *   The inconsistency between "Wrong" and "Not Wrong" falls out naturally: "Wrong" rules out (lies & norms-endorsed); "Not Wrong" rules out (lies & ~norms-endorsed). The only way to accept *both* is to rule out *all* possibilities involving lying (both with and without norm endorsement), which is impossible/contradictory.
          *   **The Key Point:** Gibbard's solution *works* for both conditionals and negation, *but* it required developing a significantly more sophisticated semantic framework (world-norm pairs, planning language) *in part* to directly address the specific demands of negation. The negation problem forced this deeper development. While the *framework* solves both, the *problem* of negation highlighted a specific inadequacy in simpler attitudinal expressivism that needed addressing.

  4.  **Unwin's Focus:**
      Unwin emphasized the specific difficulty of capturing the *bipolarity* of moral concepts (wrong/not wrong) purely in terms of attitudes, highlighting the ambiguity between indifference and permissibility that Schroeder later formalized. He argued this was a distinct hurdle for expressivism.

  **Conclusion:**

  You are absolutely right that a *fully successful* expressivist semantics *must* solve both problems within a unified framework, and Gibbard's work demonstrates this is possible. The negation problem *isn't* logically independent in the sense that a solution for conditionals *could* imply a solution for negation (as Gibbard's does).

  However, the negation problem *is* often treated as a separate *obstacle* because:

  1.  **It Exposes a Foundational Gap:** It highlights that simply defining the attitude for the atomic normative predicate ("wrong" = disapproval) isn't sufficient to define its logical opposite ("not wrong") in a satisfactory way within an attitudinal psychology framework. This gap isn't *directly* filled by solutions focused on the *interaction* of attitudes in conditionals.
  2.  **It Presents a Specific Dilemma (Schroeder):** It forces expressivists to confront a specific, seemingly intractable choice about the content of the attitude for negation that solutions for conditionals don't automatically resolve.
  3.  **It Drove Semantic Innovation:** Solving negation adequately often required moving beyond simple attitudinal states (disapproval, approval) to more complex semantic structures like Gibbard's world-norm pairs or planning states. The conditional problem *could* be (initially) addressed with higher-order attitudes within a simpler framework; negation pushed expressivism towards more radical semantic revisions.

  **In essence:** The negation problem isn't a *logically independent* problem from the Frege-Geach problem overall. However, it *is* a particularly sharp and foundational *manifestation* of the core challenge of compositional semantics for expressivism. Solving the conditional problem with clever machinery doesn't guarantee that machinery automatically provides a non-problematic definition for the fundamental attitude expressed by "not wrong". The negation problem tests whether the expressivist account of the *basic normative predicate* and its logical operations is coherent and adequate on its own terms, which is a prerequisite for *any* compositional semantics, including one handling conditionals. Gibbard shows a unified solution is possible, but it required tackling the specific demands of negation head-on. Your sense that it *should* fall out is correct in spirit for a mature theory, but historically, negation exposed specific weaknesses that needed dedicated attention. Good luck with comps!
