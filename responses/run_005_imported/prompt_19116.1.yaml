prompt: |-
  I've been reporting a feature on why some social conventions can flip almost overnight—tipping norms, forms of address, how we greet each other post-pandemic—while others stay locked in place for centuries even when they look arbitrary or mildly costly to the people who follow them. Chasing down the philosophical background has led me to two accounts of convention that seem to pull in genuinely different directions, and before my next interview I'd like to understand precisely how they relate.

  The first is David Lewis's analysis in Convention: A Philosophical Study, on which a convention is a regularity in behavior that solves a recurring coordination problem and persists because it is common knowledge within the population that everyone conforms, that everyone expects everyone else to conform, and that everyone prefers to conform given that the rest do. For Lewis, that common-knowledge condition is doing real work: it is supposed to be what turns a bare behavioral regularity into something people can be said to follow, rather than merely instantiate. The second is Brian Skyrms's evolutionary game-theoretic treatment, which takes some of the very same sender-receiver signaling games Lewis used to model linguistic convention and shows how a stable signaling system can emerge instead through replicator dynamics or simple reinforcement learning, with no individual agent ever representing the coordination problem, let alone attaining common knowledge of how the others will act.

  Could you compare these two accounts for me in some depth? I'm especially interested in whether Skyrms's evolutionary story actually undercuts Lewis's claim that common knowledge is a necessary condition on convention, or whether it is better read as describing a related but distinct phenomenon—a behavioral regularity that only counts as a convention in some thinner sense than Lewis intended. I'd also like your own considered judgment rather than a neutral summary of both sides: which picture does the better explanatory work on real human norms that persist despite being arbitrary or inefficient—deference norms, spelling conventions, and the like—and is there a class of cases (say, a one-off ad hoc agreement versus a slowly settled cultural practice) where one framework is clearly the right tool and the other simply fails to apply?
reasoning: |-
  Okay, the user is working on a feature about why some social conventions change quickly while others persist for centuries. They've come across two philosophical accounts: David Lewis's common knowledge-based theory and Brian Skyrms's evolutionary game theory approach. They want a deep comparison, especially on whether Skyrms undercuts Lewis's need for common knowledge. They also want my judgment on which framework explains real-world norms better.

  First, I need to recall Lewis's key points. In *Convention*, he defines conventions as solutions to coordination problems, maintained by common knowledge. Everyone knows the norm, expects others to follow, and prefers to conform if others do. Common knowledge is crucial here—it's what makes a behavior a convention rather than just a habit. For example, driving on the right: people know the rule, expect others to follow, and prefer it because it avoids chaos.

  Then there's Skyrms. He uses evolutionary game theory, showing how conventions emerge from dynamics like replicator dynamics or reinforcement learning. No need for agents to understand the coordination problem or have common knowledge. Signaling systems can evolve through repeated interactions and learning. Think of birds developing warning calls without any bird knowing why—it's just reinforced over time.

  Now, the main tension: Does Skyrms eliminate the need for common knowledge? Lewis would argue that without common knowledge, it's not a convention but just a behavioral regularity. Skyrms might say that common knowledge is a byproduct, not a prerequisite. So, is Skyrms describing a thinner version of convention, or is he challenging Lewis's core idea?

  The user is interested in real-world examples. Tipping norms changed quickly, maybe because of shared awareness and coordination. But spelling conventions persist despite inefficiency—why? Lewis might say common knowledge locks them in, but Skyrms would point to path dependence and sunk costs. 

  Also, the user mentioned cases like one-off agreements vs. slow cultural practices. For a handshake deal, Lewis's common knowledge makes sense. But for something like language evolution, Skyrms's model fits better. 

  I should also consider efficiency. Lewis's conventions solve coordination problems efficiently, but some real norms are arbitrary and costly. Skyrms can explain inefficiency through evolutionary traps. 

  My judgment: Skyrms provides a broader explanatory framework, especially for deeply entrenched norms. Common knowledge might be a feature of mature conventions, not the starting point. But Lewis is better for deliberate, conscious norms. So integrating both seems right—conventions can start Skyrms-style and evolve into Lewis-style with common knowledge.
answer: |-
  Here's a deep comparison of Lewis and Skyrms on convention, directly addressing your core tension and offering a judgment on explanatory power for real-world norms:

  **Core Tension: Common Knowledge vs. Evolutionary Emergence**

  1.  **Lewis's Rationalist, Cognitive Account:**
      *   **Essence:** Conventions are fundamentally *cognitive achievements* grounded in *mutual expectations* and *reasoning*. They solve explicit coordination problems (driving side, language meaning) where multiple equilibria exist.
      *   **Necessity of Common Knowledge (CK):** CK isn't just window dressing; it's the *mechanism* that sustains conformity. Individuals conform *because* they know others conform, know others expect them to conform, and know everyone prefers conformity conditional on others conforming. This creates a self-reinforcing loop of *rational* choice based on mutual expectations. Arbitrariness is key – any solution works *as long as it's the one everyone expects*.
      *   **Scope:** Explicitly models conventions arising from deliberate coordination (even tacitly). Best suited for norms where agents can *recognize* the coordination problem and the alternatives (e.g., "We could drive on the left, but everyone expects right here").
      *   **Challenge:** Requires agents to hold complex, iterated beliefs ("I know you know I know..."). This seems cognitively demanding for many stable conventions (e.g., intricate etiquette rules, deeply historical spelling).

  2.  **Skyrms's Evolutionary, Behavioral Account:**
      *   **Essence:** Conventions are fundamentally *behavioral patterns* that emerge and stabilize through *population-level dynamics* (replicator dynamics, reinforcement learning). They solve coordination problems *without* requiring agents to represent the problem, understand equilibria, or hold complex beliefs.
      *   **Role of Common Knowledge:** CK is *not* necessary. Stability arises from learning dynamics, payoff advantages, and path dependence. Agents simply adjust their behavior based on past success (reinforcement) or imitate successful strategies (replication). Signaling systems emerge because successful signals get reinforced, not because senders/receiver share CK about the system.
      *   **Scope:** Explains the emergence and persistence of conventions in populations with bounded rationality, simple learning rules, or even non-linguistic agents (e.g., animal signaling). Captures how conventions can "lock in" through historical accident or initial fluctuations.
      *   **Challenge:** Can struggle to fully capture the *normative force* or *intentionality* often associated with human conventions. Why do we feel *obliged* to follow spelling? Why do deviations sometimes trigger *sanctions*? Pure learning dynamics might explain *conformity* but not necessarily the *sense of rule-following*.

  **Does Skyrms Undercut Lewis? A Nuanced View**

  Skyrms **does undercut Lewis's claim that CK is *strictly necessary* for the *existence and stability* of a behavioral regularity that solves a coordination problem.** He provides a powerful counter-model showing how such regularities can emerge and persist through simpler mechanisms.

  *   **Skyrms Wins on:** Explaining the *origin* and *basic stability* of coordination equilibria in complex populations without high cognitive demands. He shows how Lewis-style conventions *can* arise from simpler roots.
  *   **Lewis Retains Ground on:** Explaining the *intentional structure* and *full normative character* of *mature human conventions*. When we *follow* a convention like a complex greeting ritual or a spelling rule, we often *do* act based on expectations about others' expectations and a preference for coordination. CK (or something very close) seems descriptively accurate for these cases.

  **The Thinner/Thicker Distinction: A Key Insight**

  This leads to the crucial distinction you anticipated:

  *   **Skyrmsian "Proto-Conventions" (Thinner):** Behavioral regularities solving coordination problems, emerging and stabilizing through evolutionary/learning dynamics. Agents conform due to habit, reinforcement, or imitation, not necessarily mutual expectations. (e.g., early stages of a tipping norm, emergent pedestrian traffic flows, some animal signaling).
  *   **Lewisian Conventions (Thicker):** Behavioral regularities where conformity is driven *by* the mutual expectations and conditional preferences described by CK. The regularity is *sustained* by agents' reasoning about each other. (e.g., well-established legal procedures, complex grammatical rules, formal diplomatic protocols).

  **My Considered Judgment: Explanatory Power for Real Norms**

  1.  **For Persistence of Arbitrary/Inefficient Norms (Deference, Spelling, Etiquette):**
      *   **Skyrms is Often More Fundamentally Explanatory:** His framework directly tackles why inefficient/arbitrary norms get *locked in*. Path dependence, sunk costs (cognitive & social), local maxima traps, and network effects are inherent features of evolutionary dynamics. Once a spelling convention or deference hierarchy emerges (perhaps initially for functional reasons or by chance), the cost of *changing* it (re-learning, coordination failure during transition, challenging entrenched power) often outweighs the mild inefficiency of persisting. Lewis's CK *assumes* the convention exists but doesn't as elegantly explain *why an inefficient one persists* against potential alternatives. Skyrms shows how the *process of emergence itself* can favor a stable but sub-optimal outcome.
      *   **Lewis Captures the Mature Phenomenon:** For a mature spelling convention, literate adults *do* operate with something close to CK ("I know 'i before e' is the rule, I expect others to use it, I use it because I expect them to expect it, and we all prefer consistent spelling"). Skyrms explains *how it got here and why it sticks*, Lewis describes *how we consciously engage with it now*.

  2.  **Class of Cases: Choosing the Right Tool**
      *   **Lewis is Clearly Superior For:**
          *   **Explicit, One-Off, or Ad Hoc Coordination:** Choosing a meeting spot in an unfamiliar city, agreeing on a signal during a crisis. These rely *directly* on forming mutual expectations (often through communication) to solve a specific, recognized problem. Evolutionary dynamics are too slow.
          *   **Norms with Strong Deliberative/Normative Force:** Legal conventions, complex institutional rules, highly codified etiquette. Participants actively reason about expectations and obligations in a Lewisian way.
      *   **Skyrms is Clearly Superior For:**
          *   **Gradual, Unplanned Emergence:** The evolution of slang, the slow shift in tipping percentages, the emergence of new greeting norms post-pandemic (before they become codified). These involve aggregate learning, not collective deliberation.
          *   **"Irrational" Persistence of Costly Norms:** Why do we keep complex honorifics? Why maintain inefficient spellings? Why do harmful gender norms persist? Skyrms' dynamics of path dependence, local maxima, and conformity bias provide a more direct explanation than CK loops, which might break down if the cost is high.
          *   **Non-Linguistic or Pre-Linguistic Conventions:** Animal signaling, basic patterns of human cooperation before complex language, the emergence of symbolic behavior in early humans.

  **Synthesis: Not Rivals, But Complementary Levels**

  *   **Skyrms Explains the Cradle:** How coordination-sustaining behavioral regularities *can* and *do* emerge from simple interactions without sophisticated cognition or mutual awareness. He provides the foundation.
  *   **Lewis Explains the Mature Structure:** For many complex *human* conventions, the Skyrmsian foundation becomes overlaid with layers of mutual expectation, reasoning, communication, and eventually, common knowledge. The stable regularity *enables* the development of CK, and CK then becomes a primary *sustaining mechanism* for that specific regularity.
  *   **The Flip vs. The Lock:** Skyrms helps explain why some norms *can* flip (tipping, greetings) – they may be thinner proto-conventions, highly sensitive to payoff changes or new learning signals. Lewis helps explain why deeply entrenched norms *resist* flipping – they are thick conventions held in place by dense networks of mutual expectations and the perceived cost of disrupting CK. The pandemic disrupted the CK sustaining old greeting norms (handshakes became risky, *and* everyone knew everyone knew this), allowing a rapid flip. Centuries-old deference norms are locked in by Skyrmsian path dependence *and* Lewisian CK about the social costs of deviance.

  **Conclusion for Your Feature:** Both accounts are essential. Skyrms demonstrates that Lewis's CK isn't necessary for the *existence* of convention-like stability, fundamentally challenging the *strict necessity* claim. However, for the *full phenomenon* of mature human convention – especially its intentionality and normative force – Lewis's cognitive structure remains powerfully descriptive. **When explaining the persistent "lock-in" of arbitrary or inefficient norms like spelling or deference, Skyrms's evolutionary dynamics provide the deeper explanation for *why* they get stuck, while Lewis best describes *how* we consciously navigate them once they are entrenched.** Use Lewis for deliberate coordination and mature normative structures; use Skyrms for unplanned emergence, path-dependent lock-in, and the persistence of the arbitrary. Your examples of tipping flips and greeting changes likely started Skyrmsian and became Lewisian; the centuries-old locked norms are deeply Skyrmsian in origin but now heavily Lewisian in maintenance.
