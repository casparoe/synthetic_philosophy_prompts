answer: |-
  Here’s a 4-5 minute toast weaving Moore's *actual* argument into a warm, funny, and accessible speech for Priya, Sam, Nan, and the physicist groom:

  **(Clink glass gently, warm smile)**

  "Alright everyone, settle down... deep breaths... especially mine! For those who don't know me, I’m [Your Name], and I’ve had the dubious honour of being Priya’s partner-in-crime since we were kids trying to sneak extra biscuits. Priya asked me to do this speech, which was brave, because my usual expertise is knowing exactly when the takeaway arrives. But I wanted to do something proper for these two incredible people.

  Now, a few years back, rummaging through a charity shop – probably looking for a slightly less battered kettle – I found this truly ancient, falling-apart book called *Principia Ethica* by a chap named G.E. Moore. Looked drier than Sam’s last attempt at roast chicken, but something made me buy it. And honestly? One idea in it completely stuck with me, especially thinking about Priya and Sam. He called it an ‘organic unity’.

  **(Lean in slightly, conversational tone)**

  Basically, Moore argued that some things aren’t just… *additive*. Like, you can’t just take the bits, stick ‘em together, and get the real value. A classic example is a beautiful painting. If you just add up the cost of the canvas, the paint, and the artist’s hourly rate… you miss the whole *point*. The *beauty* of it is something entirely new, something that only exists when it’s all put together just right. It’s *more* than the sum of its parts – it’s a whole new, valuable thing.

  **(Pivot to Priya & Sam)**

  And Moore reckoned this was absolutely crucial for understanding the *best* things in life – especially two things: appreciating true beauty... and *personal affection*. Not just *liking* someone because they make you happy – though Priya, your ability to find the last Rolo *always* makes me happy. And not just admiring someone’s good qualities from a distance like they’re a museum exhibit – “Ooh, look at Sam’s impressive grasp of quantum mechanics… fascinating, don’t touch!”

  **(Wink at Sam, light chuckle from crowd)**

  No. Moore said the *real* good stuff, the valuable thing, happens when you *see* someone’s actual qualities – the real, sometimes messy, sometimes brilliant, sometimes stubbornly-Priya, sometimes obsessively-tidying-Sam stuff – and you *love* them *for* those things. Not because it benefits *you*, necessarily, but because *seeing* them, truly *knowing* them, and loving them *anyway* (or even *because* of it!), creates this entirely new, precious thing: the relationship itself. *That’s* the organic unity.

  **(Gesture between them)**

  Think about it. Priya, we all know your qualities: fiercely loyal, hilarious, terrifyingly organised – seriously, your colour-coded wedding spreadsheet gave me nightmares – and you have this uncanny ability to make anyone feel welcome. Sam, you’re brilliantly clever, patient – seriously, the patience of a saint dealing with Priya’s spreadsheet revisions – genuinely kind, and you have that quiet, steady way of making everything feel… calmer. Great qualities, both of you!

  **(Raise eyebrows, slightly mischievous)**

  But if we just *added* those up? Priya’s spreadsheets plus Sam’s patience? Loyalty plus calmness? We’d get… a very efficient, pleasant partnership. Nice. Useful. Like a reliable toaster. But is that what we see when we look at *them*? Absolutely not!

  **(Warmth intensifies)**

  What we see is something *else*. Something that wasn't there before. We see the way Priya’s eyes light up telling a story and Sam just *watches* her, with this quiet smile that says he loves every chaotic detail. We see the way Sam explains some complex physics thing to Priya’s nan, and Priya beams with pride like *she* just discovered dark matter. We see the inside jokes that make no sense to anyone else, the way they balance each other out – Priya dragging Sam to karaoke, Sam gently reminding Priya that sleep is actually necessary. That *spark*, that *connection*, that unique *us* they’ve built… *that’s* the organic unity. That’s the valuable whole that’s infinitely more than just Priya-plus-Sam. It’s Priya*and*Sam – a brand new, wonderful thing.

  **(Nod to Sam, acknowledging his perspective)**

  And Sam, physicist that you are, you might want to think of it like a chemical reaction. Two stable elements come together, but under the right conditions – call it love, call it shared values, call it putting up with each other's weird habits – they create an entirely new compound with properties neither had alone. That’s the magic. That’s the thing Moore thought was one of the best things in existence. Not just mutual happiness generators, but creators of something beautiful and unique *together*.

  **(Raise glass fully)**

  So, Priya and Sam, my brilliant, funny, deeply loved friends. Here’s to seeing each other truly, loving each other wholly – spreadsheets, physics jargon, questionable cooking, and all. Here’s to your incredible individual qualities, but more importantly, here’s to the amazing, valuable, *new* thing you’ve created together: your marriage, your own perfect organic unity. May you always appreciate the beauty you find in each other, and the even greater beauty you create as one.

  **(Big smile, genuine warmth)**

  To Priya and Sam!"

  **(Drink!)**

  ## Why This Works

  1.  **Moore's Actual Argument:** It clearly explains "organic unities" using his examples (painting) and directly applies it to personal affection, distinguishing it from mere admiration or utility ("not just mutual happiness generators"). It emphasizes *seeing true qualities* and loving *for* them as the key.
  2.  **Accessible:** Uses simple analogies (painting, toaster, chemical reaction) and avoids jargon. The charity shop intro makes it relatable and humble.
  3.  **Warm & Funny:** Self-deprecating humour ("dubious honour," "battered kettle," "spreadsheet nightmares," "reliable toaster," "questionable cooking"), specific anecdotes (Rolo, karaoke, Nan), and genuine affection shine through.
  4.  **Respects Both Audiences:**
      *   **Nan & Cousins:** Conversational tone, relatable humour, focus on observable love and connection, avoids abstract philosophy.
      *   **Sam (Physician):** Uses the chemical reaction analogy, acknowledges his field ("quantum mechanics," "properties," "compound"), avoids "soulmate" fluff by grounding it in observable qualities and interactions, pokes gentle fun at Priya's spreadsheets (showing he's not on a pedestal).
  5.  **Structure:** Clear narrative flow: Hook (Charity shop) -> Idea (Organic Unity) -> Application (Painting -> Their Qualities) -> Contrast (Adding vs. The Unity) -> Celebration -> Toast.
  6.  **Time:** Aimed squarely at 4-5 minutes when delivered with appropriate pauses and emphasis.

  **Key to Delivery:** Speak from the heart, maintain eye contact with Priya, Sam, and the crowd, and let your genuine affection for them carry the warmth. Don't rush the philosophical bit; explain it like you're sharing a cool discovery with friends (which you are!). Good luck! Priya chose well.
