prompt: |-
  So my friend and I got into a whole thing last night about imprecise probabilities—like, whether it actually makes sense for someone's credence in something to be a whole range (say, "somewhere between 0.3 and 0.6") instead of one sharp number. She kept bringing up the Ellsberg urn to justify it, which, fine, I get why that motivates the idea, but I don't think it actually settles anything once your stuck making repeated or sequential decisions instead of just one bet.

  Can you cook up a different example for me (not Ellsberg, we already beat that one to death)? Like some decision scenario, ideally with a couple of sequential choices, where an agent stuck with a genuinely imprecise credal set either freezes up or ends up accepting a combo of bets that guarantees them a loss, in a way a normal sharp-credence bayesian just wouldn't. And then tell me straight, is that a real strike against imprecise credences being rational, or is there a decent reply on behalf of that view?
