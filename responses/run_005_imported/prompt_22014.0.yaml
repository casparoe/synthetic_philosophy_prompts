  I'm about a third of the way into a novel with a subplot set at the Institute for Advanced Study in the last couple years of Godel's life, and I want one scene to hinge on stuff he actually believed instead of something I just make up because it's convenient. From what I remember reading (Budiansky's biography maybe, or it might've been the Goldstein one), Godel didn't believe in an afterlife for church-y reasons at all — he apparently gave his mother this oddly formal argument in letters, something about the world being "rational" in a deep sense, and how it would basically contradict that rationality for a mind that's built up as much structure and understanding as a human's to just wink out completely at death. I also recall "this isn't the only world we'll live in" was literally one of the numbered theses in his private philosophical notes, right alongside stuff about mathematical objects being objectively real, not to mention his actual formal proof for God's existence and his weirdly intense obsession with Leibniz (he was convinced Leibniz's more radical writings got suppressed, which tracks with how into monads and indestructible simple substances he was).

  Anyway, here's my actual problem. I've got a grad student character cornering him at a party, half needling him, asking what he'd make of a dying person having their mind "uploaded" into a computer to be preserved indefinitely — basically digital immortality, obviously not something anyone would of taken seriously yet in his lifetime. I don't want the answer to just be "cranky old man doesn't trust computers," I want it to actually track his real commitments: the rationality-of-the-world argument, his insistence (from the Gibbs lecture) that the mind can't just be equivalent to a Turing machine or any one formal system, his platonism about mathematical objects, and that Leibniz/monad stuff. So given all that: would Godel plausibly think an uploaded copy could satisfy whatever he thought an afterlife needs to provide, or would he think it's a category error that completely misses the point of his own argument? Walk me through the actual chain of reasoning he'd use rather than just a vibes-based yes-or-no — that's the part I actually need to get right for the scene to land.
