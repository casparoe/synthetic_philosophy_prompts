prompt: |-
  I'm about two-thirds through a novel where the emotional climax happens at a wedding afterparty between two old college roommates who haven't really spoken in years — one went into quant trading (arbitrage desk, spends all day thinking about exploitable inconsistencies) and the other became a philosophy professor working on rational choice theory. I want their old rivalry to resurface through an argument that's ostensibly about "money pump" arguments but is really about their whole worldviews, and I keep getting stuck writing it cause I dont fully trust myself on the philosophy. Here's the setup as I have it so far: the quant thinks the money-pump argument basically settles things — if your preferences (or your plans over time, which I gather is the "diachronic" part of all this) can be exploited by a series of trades you'd make willingly, each one leaving you strictly worse off than where you started, that just IS what it means for something to have gone wrong with your rationality, and any talk of "resolute choice" or "committing to a plan" is just a consistent ranking in disguise, one level up. The professor thinks this proves too much. She wants to say a person can rationally have preferences that would get picked apart trade-by-trade — there's an old puzzle, I think by someone named Quinn(?), about a self-torturer with a dial that ratchets up pain in unnoticeable increments, that she keeps bringing up — and still count as fully rational, because what actually protects you from exploitation isn't having a transitive ordering nailed down in advance, it's being the sort of agent who can commit to a plan and not re-open the question at every later step. I gather this move has an actual name in the literature, "resolute choice" or something close to it, but I don't understand the theory well enough to write her side of it convincingly.

  Could you write me the scene as a real back-and-forth, maybe six to ten exchanges, where they're both genuinely sharp and neither one is just there to lose? I especially want the quant to press her on whether "resolute choice" is anything more than transitivity relocated to the level of plans rather than trades, and I want her to have an actual comeback rather than just restating herself, with him getting at least one more good jab in after that. They don't need to land on a tidy resolution by the end — they're both stubborn and a little drunk — but I'd like whoever "loses" a given exchange to lose for a real reason, not because I stacked the deck. Feel free to swap in different concrete examples than the dial-torture thing if better ones occur to you; I just need the philosophy underneath to be solid, not two people trading one-liners past each other.
