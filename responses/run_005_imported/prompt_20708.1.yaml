  - **Relational Duties**: The committee might have special obligations to each patient (e.g., based on admission order) that could influence fairness beyond numbers.

  ### Verdict: Should Numbers Count?
  **Yes, numbers should count in cases like this one.**  
  - **Why**: Osei's Move 4 provides the strongest argument: a policy that honors more claims with the same resource is justifiable without aggregating suffering. It balances fairness (each claim is equally valid) with efficiency (maximizing lives saved). While Reyes is right that exclusion based on numbers feels arbitrary to the one, the greater injustice lies in allowing five deaths when four could have been prevented at no extra cost. A coin flip is less defensible as a policy because it ignores the opportunity to save more lives consistently.  

