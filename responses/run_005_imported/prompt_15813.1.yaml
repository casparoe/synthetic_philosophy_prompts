answer: |-
  Your reasoning is sharp and reflects a sophisticated grasp of Yudkowsky's argument—but the persistence of nonlocality as a foundational problem isn't due to academic inertia alone. While the many-worlds interpretation (MWI) *does* dissolve the *spooky action* aspect of nonlocality, there are unresolved technical and philosophical nuances that keep the debate alive. Here's where the complexity lies:

  ### 1. **Locality Definitions Aren't Universal**
     - **Bell's Theorem Assumption**: Bell proved that *any* theory reproducing quantum correlations must violate either **local causality** (no influences faster than light) or **statistical independence** (measurement settings are independent of hidden variables). MWI evades this by rejecting a key premise: that measurements have *single outcomes*.  
     - **MWI's "Local" Resolution**: In MWI, entangled particles share a global wavefunction. Correlations arise from *decoherence* and *branching*—not instantaneous influences. When Alice measures her particle, she branches into multiple versions, each correlated with Bob's future measurement outcome in her branch. No information is transmitted; the correlations were baked into the wavefunction from the start.  
     - **The Catch**: Critics argue MWI still violates **"local realism"** in a deeper sense. The wavefunction itself is *non-separable*—it assigns properties to the *whole system*, not individual parts. For philosophers like Tim Maudlin, this global state constitutes a form of nonlocality, even if no *dynamics* are nonlocal.

  ### 2. **The Relativity Challenge**
     - **Spacetime Consistency**: In relativistic quantum mechanics, measurements can be spacelike separated. MWI relies on a universal wavefunction evolving unitarily, but relativity lacks a preferred time foliation. How do branches "align" across light cones?  
     - **Proposed Solutions**: Frameworks like **relativistic decoherence** (Wallace, Saunders) aim to show branching is consistent with relativity, but critics (e.g., Adrian Kent) argue this isn't fully resolved. If branching depends on an observer's reference frame, it risks circularity or conflict with relativity.

  ### 3. **Probability and the Born Rule**
     - **The Infinite Regress Problem**: In MWI, *all* outcomes occur. Why do we observe frequencies matching the Born rule probabilities? Deriving probabilities from pure wave mechanics remains contentious.  
     - **Why It Matters for Nonlocality**: If probabilities are ill-defined, MWI struggles to *explain why* Bell correlations *appear* probabilistic in our branch. Yudkowsky (and others) appeal to **self-locating uncertainty** or **decision theory**, but these are not universally accepted. Without a compelling derivation, critics argue MWI hasn't fully explained the *statistical* aspect of Bell violations.

  ### 4. **Alternative Interpretations' Nonlocality**
     Even if MWI avoids dynamical nonlocality, other interpretations embrace it:  
     - **Bohmian Mechanics**: Explicitly nonlocal (particles guided by a global wavefunction).  
     - **Collapse Models** (e.g., GRW): Include spontaneous, nonlocal collapses.  
     - **QBism/Relational QM**: Reject realism entirely, making nonlocality a non-issue.  
     Debates continue because these alternatives have their own trade-offs, and no interpretation is empirically favored.

  ### 5. **The "Tension" Without Action**
     Even MWI proponents (e.g., David Deutsch, Sean Carroll) concede a residual puzzle:  
     - **Non-Supervenience**: The state of one particle doesn't supervene on its local properties—it depends on the global wavefunction. For philosophers, this violates a principle of **separability**, which some view as a weak form of nonlocality.  
     - **No-Signalling Isn't Enough**: The no-communication theorem prevents signalling, but doesn't erase the fact that measurement outcomes are instantly correlated across arbitrary distances. MWI explains this via pre-existing global structure, but the *manifestation* of correlations *in experience* still feels "nonlocal" phenomenologically.

  ### Conclusion: Is Nonlocality "Resolved" in MWI?
  - **Yes**, in the sense that it eliminates *faster-than-light influences* and explains correlations via unitary evolution.  
  - **No**, in the sense that the *global structure of the wavefunction* challenges deeply held intuitions about locality and separability.  

  The persistence of the debate stems from **genuine conceptual fissures**, not inertia. Mainstream physics often prioritizes empirical predictions over interpretation, but foundational work (e.g., by Roderich Tumulka, Howard Wiseman, or David Wallace) continues to refine these arguments. Your intuition that MWI dissolves the mystery is largely correct—but the devil is in the metaphysical details, and not all experts agree on what "locality" should mean.

  ### Practical Takeaway
  If you want to dive deeper:  
  - Read David Wallace’s *The Emergent Multiverse* (2012) for the MWI defense.  
  - Explore Maudlin’s *Quantum Non-Locality and Relativity* (2011) for the realist critique.  
  - Check recent papers on **relational quantum mechanics** (Rovelli) or **constructor theory** (Deutsch) for alternative resolutions.  

  Yudkowsky’s sequence is a brilliant starting point, but the frontier has advanced—and the conversation remains vital because the stakes (realism, locality, causality) are foundational to physics itself.
