prompt: |-
  Ok so this has been bugging me for a while and I don't think I've seen anyone address it head-on. I went down a rabbit hole a few weeks ago rereading Oesterheld's original "multiverse-wide superrationality" paper (from what's now the Center on Long-Term Risk, back before everyone started calling it "evidential cooperation in large worlds," aka ECL), and realized I can't actually articulate how its different from Hofstadter's much older superrationality idea from his Scientific American columns -- the one about cooperating in a prisoner's dilemma against your psychological twin because you should reason as if your choice determines both of your moves. Both seem to be doing the same basic move: drop the requirement that your decision causally affect the outcome and swap in a correlation/evidential one instead, so cooperating becomes "rational" even with zero communication or causal contact between the parties.

  A friend from my meetup group insists ECL is basically just "Hofstadter's idea plus a cosmology lecture bolted on" and doesn't add anything decision-theoretically new. I'm not so sure, mainly because the classic superrationality thought experiments are always symmetric -- you and a copy of you, same game, same payoffs -- wheras ECL is explicitly meant to cover agents with totally different values, scattered across a possibly-infinite universe, who can never verify they're even reasoning alike. (I know Yudkowsky basically folded the same intuition into functional decision theory instead of using Hofstadter's word for it, but let's leave FDT out of this and just stick to the two.) Could you carefully compare the two -- what ECL keeps from superrationality, what it has to add or change to handle asymmetric values and merely-partial correlation, and whether it can be grounded entirely in bog-standard evidential decision theory rather than any of Hofstadter's more informal hand-waving about "renormalized rationality"? Then tell me which one you actually think is the more fundamental idea here -- is superrationality just a limiting case of ECL, or are the two answering different enough questions that it's kind of a type error to say one contains the other?
reasoning: |-
  Okay, the user is really deep into decision theory and wants a clear distinction between Hofstadter's superrationality and ECL. They mentioned rereading Oesterheld's paper and their friend's claim that ECL is just superrationality with cosmology. I need to unpack both concepts carefully.

  First, Hofstadter's superrationality is all about symmetry. Identical agents, same game, same payoffs. The key is that each agent's decision is perfectly correlated with the other's because they're identical. They cooperate by reasoning that their choice determines both actions. But it's limited to symmetric cases.

  Then there's ECL. The user pointed out it handles asymmetric values and partial correlation. ECL agents don't have to be identical. They could have different goals but still coordinate because they're correlated through decision algorithms. The cosmology part is crucial here—since the universe might be huge or infinite, there could be many agents facing similar problems, even if they're not copies. 

  The user's friend thinks ECL is just Hofstadter plus cosmology. But that misses the decision-theoretic shift. Hofstadter relies on the symmetry of the agents, while ECL uses algorithmic similarity. That's a big difference. Also, ECL deals with different values. Agents cooperate not because they're the same, but because their algorithms would respond similarly even in asymmetric situations. 

  The user is unsure if ECL is fundamentally new or just an extension. They want to know if superrationality is a special case of ECL. From the comparison, ECL generalizes the correlation mechanism beyond identical agents. It uses EDT but scales it up with algorithmic correlation. So yes, Hofstadter's version is a subset where correlation is perfect and values align.

  The user also asked if ECL can be grounded in standard EDT. Hofstadter's approach was informal, but ECL formalizes it using decision algorithms and expected utility under correlation. So it's more rigorous. 

  Underlying needs: The user might be trying to resolve a debate in their meetup group. They need a clear, technical explanation to articulate the differences. They might also be interested in applying these concepts to real-world problems involving coordination among diverse agents. Ensuring the explanation addresses both the technical distinctions and practical implications would be valuable.
answer: |-
  Here's a breakdown comparing Hofstadter's Superrationality (HS) and Oesterheld's Evidential Cooperation in Large Worlds (ECL), addressing your core concerns:

  **Core Similarity (The Shared "Move"):**
  Both reject *causal* influence as the primary driver of rationality in cooperation problems and replace it with *evidential correlation*. They argue that if your decision is highly correlated with another agent's decision (due to symmetry, algorithmic similarity, or cosmological structure), then cooperating can be rational *even if your choice has zero causal effect on theirs*. You both "cooperate" because you condition your expected utility on the correlation pattern implied by your own decision logic.

  **Hofstadter's Superrationality (HS):**
  1.  **Scope:** Highly constrained. Focuses on symmetric, one-shot games (especially Prisoner's Dilemma).
  2.  **Agents:** Assumes *perfect symmetry*. Agents are psychological twins/copies: identical decision algorithm, identical payoff matrix, identical knowledge state, identical decision context. They *know* they are symmetric.
  3.  **Correlation Mechanism:** Perfect correlation is *logically guaranteed* by symmetry. If you are identical copies facing identical situations, your outputs *must* be identical. Choosing "Cooperate" implies your twin also chooses "Cooperate" with probability 1.
  4.  **Values:** Implicitly identical (same payoff matrix).
  5.  **Rationality Claim:** Choosing Cooperate is the uniquely rational choice for both agents in symmetric PD. Defection becomes self-refuting/self-undermining because it logically implies your twin defects, guaranteeing mutual defection.
  6.  **Foundation:** Relies heavily on the *logical necessity* arising from perfect symmetry. Hofstadter's "renormalized rationality" is more a conceptual argument than a formal decision theory. It struggles badly outside perfect symmetry.

  **Evidential Cooperation in Large Worlds (ECL):**
  1.  **Scope:** Extremely broad. Aims for cooperation between agents anywhere in the multiverse, facing potentially *different* decision problems, with *different* values, at *different* times, with *no* direct communication or causal contact.
  2.  **Agents:** Agents have *different* goals/values (utility functions). They may face *different* games or decision contexts. They only need sufficiently *similar decision algorithms* (or predictable responses to decision-theoretic reasoning).
  3.  **Correlation Mechanism:** Correlation arises from *algorithmic similarity* operating within a large (often infinite) universe/multiverse. If your decision algorithm outputs "Cooperate" in a certain class of problems, then *other sufficiently similar algorithms facing sufficiently similar problems elsewhere in the cosmos* are also likely to output "Cooperate". This correlation is *probabilistic*, not logically guaranteed. The "Large World" (cosmology) provides the substrate for finding correlated counterparts.
  4.  **Values:** Explicitly handles *different* values. Cooperation is *not* about helping others for its own sake. It's about finding actions that, when correlated agents take them, lead to outcomes *each agent values according to their own utility function*. E.g., "I cooperate here, hoping my correlated counterpart cooperates over there, leading to an outcome *they* value highly *and* an outcome *I* value highly here."
  5.  **Rationality Claim:** Agents should choose actions that maximize their *own* expected utility, conditional on the correlation pattern implied by their decision algorithm and the cosmological structure. This often involves "cooperative" moves within a broader strategy of coordination based on algorithmic similarity.
  6.  **Foundation:** Grounded in a rigorous application of **Evidential Decision Theory (EDT)**. It calculates the expected utility of an action *A* by conditioning on the evidence *A* provides about what *other correlated decision-makers* are likely to do, based on the shared properties of their decision algorithms and the large world structure. The "cosmology lecture" provides the prior for this correlation.

  **Key Differences & What ECL Adds/Changes:**

  1.  **Breaking Symmetry:** This is the biggest leap. HS *requires* perfect symmetry (identical agents, identical problems). ECL explicitly tackles **asymmetric values** and **asymmetric decision contexts**. Cooperation is based on algorithmic similarity, not identity.
  2.  **Partial Correlation:** HS relies on perfect logical correlation. ECL handles **probabilistic correlation**. Agents only need to be *sufficiently similar* to expect a *non-zero correlation* in their actions for similar problem types. The strength of correlation depends on algorithmic similarity and the cosmological prior.
  3.  **Mechanism & Grounding:** HS's mechanism is the logical force of symmetry. ECL's mechanism is **algorithmic correlation within a large universe**, formally implemented via **EDT conditioning**. The cosmology isn't just "bolted on"; it's *essential* for defining the prior probabilities over which other agents exist and are correlated with you. HS is informal philosophy; ECL is an attempt at formal decision theory (using EDT).
  4.  **Value Alignment vs. Strategic Coordination:** HS agents cooperate because they are identical and want the same thing. ECL agents "cooperate" as part of a **strategic coordination scheme** where *different* actions by *different* agents in *different* places, driven by their *different* values, are correlated to produce mutually beneficial outcomes *according to each agent's own utility function*. It's coordination under value difference via correlated algorithms.

  **Is ECL Grounded in Standard EDT?**
  **Yes, fundamentally.** ECL is an *application* of EDT to a specific class of problems characterized by:
      *   Agents with similar decision algorithms.
      *   A large/structured universe implying the existence of correlated counterparts.
      *   The absence of causal contact.
  EDT says: Calculate EU(A) = Σ [U(O) * P(O | A, K)], where K is background knowledge.
  ECL says: In a large world with algorithmic similarity, *P(O | A, K)* crucially includes the probability that *other correlated agents take specific actions* given that *you* take A. Your action A is strong evidence about what your algorithmic counterparts do. The "cosmology lecture" provides the prior (K) needed to estimate P(Counterpart_Action | My_Action). HS *can be seen* as a degenerate case of EDT under perfect correlation, but Hofstadter didn't frame it that way formally.

  **Which is More Fundamental? Is HS a Limiting Case?**
  *   **ECL is the More General Framework:** HS is best understood as a **highly specific, idealized limiting case of ECL**:
      *   Limiting Case 1: *Perfect* Algorithmic Similarity (Identical Copies).
      *   Limiting Case 2: *Identical* Decision Context/Game.
      *   Limiting Case 3: *Identical* Values (Payoffs).
      *   Limiting Case 4: *Perfect* Correlation (Probability 1).
      If you plug these conditions into ECL, you recover the HS prescription for symmetric PD. Relax *any* of these conditions (different values, different contexts, imperfect similarity, probabilistic correlation), and HS breaks down, while ECL *attempts* to provide an answer (though practical calculation remains challenging).
  *   **Answering Different Questions?** They are fundamentally answering the *same core question*: "How should I rationally act in situations where my action provides evidence about what others do, even without causal influence?" However, HS answers it *only* for the extremely narrow case of perfect symmetry. ECL attempts to answer it for the vastly broader and messier case of partial algorithmic correlation in a large universe with value diversity. So, while the *question* is the same, the *scope* is radically different. It's not a type error to say ECL contains HS as a limit; it's accurate. HS is a special case where the correlation is perfect and the values/contexts align.

  **Conclusion:**
  Your friend is partially right that ECL uses the same *evidential core* as Hofstadter's intuition. However, dismissing ECL as "HS plus cosmology" drastically undersells its contribution. ECL's core innovation is **generalizing the correlation mechanism from perfect logical symmetry to probabilistic algorithmic similarity within a large world structure** and explicitly **handling value asymmetry**. This allows it to address cooperation problems utterly intractable under HS. It formalizes the intuition within standard EDT, replacing Hofstadter's hand-waving with a (theoretically) rigorous framework, albeit one with immense practical computational challenges. **ECL is the significantly more fundamental and general concept; Hofstadter's Superrationality is its highly constrained, symmetric ancestor.** The "cosmology lecture" isn't a bolt-on; it's the necessary foundation for defining the correlation structure in the absence of logical symmetry.
