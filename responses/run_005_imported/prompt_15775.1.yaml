prompt: |-
  I serve on my university's data governance committee, which reviews proposed uses of student data. The counseling center has a FERPA-compliant proposal (confirmed by university counsel) to run session transcripts and usage metadata it already collects for clinical purposes through a predictive algorithm that flags students at elevated risk of self-harm; only the resulting flag, not any clinical content, would reach the Office of the Dean of Students, which would then arrange a wellness check. The center's position is that since no one outside its own systems ever learns what a student actually said, no confidentiality is broken. Two student members on the committee insist this is still a serious privacy harm but have struggled to explain why in terms that survive that argument, and the committee is now split ahead of next week's vote. Please draft the short memo I will present to the full committee: recommend approve, reject, or approve-with-conditions, engage directly with the center's argument rather than simply asserting that privacy matters, and make any conditions specific enough to be audited.
reasoning: |-
  Okay, the user is on a university data governance committee and needs help drafting a memo about a sensitive proposal from the counseling center. The counseling center wants to use AI to analyze therapy session transcripts for suicide risk, sharing only risk flags—not actual content—with the dean's office. They claim this protects confidentiality since no one sees what students said. 

  Hmm, the core tension here is between clinical efficiency and privacy ethics. The counseling center's technical argument about data separation seems solid on the surface (FERPA-compliant, counsel-approved), but the student reps' unease points to something deeper. They're instinctively reacting to the *process* of machines dissecting their most vulnerable moments, even if humans don't see it. That's a nuanced harm—like finding out your diary was scanned by a robot, even if no human read it.

  The user needs a memo that doesn't dismiss either side. The students' concern isn't about *access* but about the *act of analysis itself*. The counseling center focuses on data outputs (flags), but privacy includes inputs (therapy words being mined). Also... the dean's office getting alerts creates new records. Would those be subject to subpoenas? Could flags bias future interactions?

  *checks FERPA nuances* Ah—aggregate data use might be permitted, but predictive algorithms on intimate details could stretch "educational purpose" definitions. And the "wellness checks" might inadvertently expose students to non-clinical staff prematurely. 

  Proposing "approve-with-conditions" feels right. Mandate transparency so students know their words are analyzed, offer opt-outs to respect autonomy, and require bias audits since algorithms often misflag minorities. Also limit dean's office data retention—no permanent risk scores in academic files. 

  User’s memo must bridge legal compliance ("FERPA allows this") and ethical design ("but should we?"). Conditions should be concrete: "audit algorithm for racial disparities" not vague "ensure fairness." Student reps need to feel their core fear—the violation of therapeutic sanctity—is addressed, even if the tech proceeds.
answer: |-
  ## Memorandum  
  To: Data Governance Committee  
  From: [Your Name/Position]  
  Date: October 26, 2023  
  Subject: Recommendation on Counseling Center Predictive Risk Flagging Proposal  

  **Recommendation:** Approve with Conditions (see Section 3).  

  ### 1. Acknowledging the Counseling Center’s Position  
  The proposal correctly notes that *clinical content* remains confined to the Counseling Center. Sharing only a risk flag (not session details) with the Dean of Students is technically FERPA-compliant and avoids explicit confidentiality breaches. However, this narrow framing overlooks two critical dimensions of privacy harm:  

  - **The Intrusion of Analysis:** Privacy includes the right to control *how* sensitive data is used, not just *who sees it*. Subjecting deeply personal therapeutic dialogue to algorithmic scrutiny—even if outputs are anonymized—fundamentally alters the context of data collection. Students consented to clinical use, not predictive surveillance.  
  - **The Burden of the Flag:** A "risk flag" is not neutral metadata. It creates a high-stakes administrative record that could impact a student’s access to resources, academic standing, or campus relationships. Misidentification (false positives) or algorithmic bias could inflict reputational or emotional harm without recourse.  

  ### 2. Addressing the Core Privacy Concern  
  The student representatives’ unease reflects a legitimate ethical tension: **Efficiency cannot override autonomy when using intimate mental health data.** The absence of *clinical* disclosure does not negate the dignity risk of reducing therapeutic interactions to inputs for institutional risk management.  

  ### 3. Conditions for Approval  
  To mitigate these harms while enabling the program’s safety goals, approval is contingent on:  

  1. **Explicit, Prior Opt-In Consent**  
     - Students must affirmatively consent *after* receiving clear disclosure:  
       *"Your anonymized session transcripts may be analyzed by an algorithm to identify students at risk of self-harm. Only a risk score (not your words) will be shared with the Dean of Students to coordinate support. You may decline this analysis without affecting your care."*  
     - **Audit Requirement:** Quarterly reports verifying >95% consent compliance and documenting opt-out rates.  

  2. **Algorithmic Transparency & Bias Testing**  
     - Before launch, the Counseling Center must:  
       a) Disclose the algorithm’s core methodology (e.g., NLP model type, risk factors).  
       b) Publish results of bias audits across gender, race, and LGBTQ+ status, demonstrating false-positive parity (<15% disparity between groups).  
     - **Audit Requirement:** Annual re-testing and public summary of audit results.  

  3. **Strict Data Minimization at Dean’s Office**  
     - Risk flags must be:  
       a) Ephemeral: Deleted within 72 hours of a completed wellness check.  
       b) Non-additive: Never merged with academic/disciplinary records.  
     - **Audit Requirement:** Automated logs of flag creation/deletion and annual review of Dean’s Office data-handling procedures.  

  ### 4. Conclusion  
  This proposal’s safety goals are commendable, but its current design risks treating student privacy as a binary (content seen/unseen) rather than a continuum of autonomy. With the above conditions—ensuring consent, transparency, and constrained data use—we align institutional duty-of-care with respect for human dignity. I urge the committee to approve this revised framework.  

  **Vote:** Approve with Conditions.
