prompt: |-
  A friend and I are both taking a seminar on practical reason this term, and last night, fueled by too much coffee, we got into a long argument about internal versus external reasons for acting — specifically, about how much Bernard Williams's famous distinction actually owes to Hume. My friend's position was that Williams's internalism is really just old Humean wine in new bottles, dressed up with talk of a "subjective motivational set" and "sound deliberation" but committed to exactly the same view about reason and motivation that Hume had already laid out two and a half centuries earlier. I wasn't convinced, but I couldn't quite say why, and we went to bed without settling it.

  The passage she kept returning to comes near the end of Book II, Part III, Section III of the Treatise, where Hume writes that "reason is, and ought only to be the slave of the passions, and can never pretend to any other office than to serve and obey them." A few lines later he adds: "'Tis not contrary to reason to prefer the destruction of the whole world to the scratching of my finger. 'Tis not contrary to reason for me to chuse my total ruin, to prevent the least uneasiness of an Indian or person wholly unknown to me." A little further on, though, Hume allows one qualification: a passion, or the action it grounds, can still be called "unreasonable" in a secondary sense, when it rests on a false belief that some object exists, or when it settles on means that simply will not achieve the end actually in view.

  What I'd like help with is this: does Williams's internal reasons thesis really inherit Hume's strong claim that reason is inert and can, at most, correct errors of fact or of means — or does his notion of "sound deliberation" license something Hume's own escape clauses do not, such as an agent coming to have a genuinely new motivation, not merely a more efficient route to an old one, through imaginative reflection on her existing motivational set? If there is a real gap here, could you spell it out with a concrete case where Hume's framework and Williams's would hand down different verdicts about whether someone has a reason to act? And does that gap bear at all on the standard complaint that internalism struggles to explain what reason, if any, a cruel or self-deceived person has to change?
reasoning: |-
  Okay, the user and their friend are having a debate about Bernard Williams's internal reasons versus Hume's views on reason and motivation. They want to know if Williams is just repackaging Hume's ideas or if there's a substantive difference. Let me start by recalling both philosophers' positions.

  Hume famously said reason is the slave of the passions. He believed that reason alone can't motivate action; it only deals with facts and logical relations. Any motivation comes from desires or passions. Even extreme preferences, like destroying the world over a finger scratch, aren't contrary to reason unless based on false beliefs or ineffective means. So, for Hume, reasons are tied to existing desires.

  Williams introduces the "subjective motivational set" (S) which includes desires, commitments, and dispositions. He also talks about "sound deliberation" which involves more than just correcting factual errors. It includes imagining outcomes, considering consistency, and possibly developing new motivations through reflection. The key question is whether Williams's deliberation allows for genuinely new motivations or just better ways to satisfy existing ones.

  The user wants a concrete case where Hume and Williams differ. Let me think of an example. Suppose someone raised in a prejudiced environment has racist beliefs but also values logical consistency. Hume would say that as long as their actions align with their existing desires (say, maintaining in-group purity), there's no internal reason to change unless a false belief is corrected. But Williams might argue that through sound deliberation—like imagining themselves in the victim's position—they could develop empathy, creating a new motivation to reject racism. This new motivation arises from their existing commitment to consistency, not just correcting a false belief.

  Another angle is the self-deceived person. Hume would see no reason to change without an existing desire to face the truth. Williams, however, might say that sound deliberation, including confronting contradictions in their beliefs, could generate a motivation for self-awareness, even if it wasn't initially present.

  The user's deeper concern might be about moral implications. If internalism can't explain why a cruel person should change, it's a problem. Williams's broader deliberation might offer a way out, suggesting that reflection can create new reasons within their motivational set. But Hume's stricter view might leave such individuals without internal reasons to change, relying only on external motivations like social pressure.

  I need to clarify the nuances in Williams's "sound deliberation." It's not just instrumental but involves evaluative processes. Williams uses the example of Owen Wingrave, who realizes through reflection that he doesn't want a military career, connecting his existing values to a new conclusion. This isn't just about means but about understanding one's deeper commitments.

  Hume's escape clauses are limited to factual errors and means-end efficiency. Williams expands this to include imaginative exercises and consistency checks. The gap lies in whether deliberation can generate new motivations. For Williams, yes, through processes that reveal latent aspects of S; for Hume, no, reason only serves pre-existing passions.

  The user also mentions the standard complaint about internalism and cruel people. Under Hume, if they lack any desire to change, there's no reason. Williams might argue that sound deliberation could uncover implicit values (e.g., not wanting to be hypocritical) that motivate change. But if no such elements exist, Williams agrees there's no internal reason, which is a limitation he acknowledges.

  In conclusion, the key difference is Williams's broader deliberative process allowing for motivational evolution, whereas Hume's reason is purely instrumental. The concrete case of the prejudiced person highlights this divergence. Both face challenges with deeply immoral individuals, but Williams's framework has more resources to explain potential internal reasons through reflective deliberation.
answer: |-
  You've pinpointed a fascinating and central debate in moral psychology. While Williams's internalism is deeply *influenced* by Hume, particularly in its rejection of external reasons independent of an agent's motivations, there **is a significant gap** concerning the scope and power of deliberation. Hume's "slave of the passions" thesis is more restrictive than Williams's "sound deliberation" clause. This gap becomes clear when we examine whether deliberation can *generate* genuinely new motivations, not just uncover existing ones or correct errors. Let's break it down:

  1.  **Hume's Core View (The Strong Claim):**
      *   **Reason is Instrumental:** Reason's sole function regarding action is to discover truths of fact (e.g., "This berry is poisonous") and relations of ideas (e.g., "To get to the mountain pass, I must turn left here"). It tells us *how* to get what we want, not *what* to want.
      *   **Passions are Motivational:** Only passions (desires, aversions, sentiments) provide the motivational "oomph" to act. They set the ends.
      *   **The Escape Clauses (Limited Correctability):** A passion/action is "unreasonable" *only* if:
          *   It rests on a *false belief* about a matter of fact (e.g., eating the berry because you falsely believe it's nourishing).
          *   It chooses *ineffective means* to achieve the desired end (e.g., turning right to get to the mountain pass when left is the correct way).
      *   **No Intrinsic Normativity of Ends:** The *content* of a desire – whether it's benevolent, cruel, self-destructive, or altruistic – cannot be assessed as reasonable or unreasonable *in itself*. "Preferring the destruction of the world to scratching my finger" is not contrary to reason, however monstrous it may seem morally. Reason is inert regarding the *evaluation* of ends.

  2.  **Williams's Internal Reasons Thesis:**
      *   **The Subjective Motivational Set (S):** An agent has a reason to φ only if φ-ing would satisfy some element in their "S" – a broad set including desires, dispositions, commitments, projects, loyalties, etc.
      *   **The Crucial Addition: Sound Deliberation (SD):** Finding that reason requires *sound deliberation* from the agent's actual S. Williams deliberately leaves SD somewhat open-ended but specifies it includes:
          *   Correcting factual errors (Hume's 1st clause).
          *   Assessing means to ends (Hume's 2nd clause).
          *   **But also:** Considering the *coherence* of elements within S.
          *   **Crucially:** Engaging in *imaginative reflection* about what it would be like to be in certain situations or to act in certain ways.
          *   **Potentially:** Considering hypothetical imperatives based on *possible future elements* of S that deliberation might *bring the agent to have*.

  3.  **The Critical Gap: The Generative Power of Deliberation**
      *   **Hume:** Deliberation (via reason) can *only* correct factual errors and instrumental errors. It cannot *generate* a new passion or alter the intrinsic nature of an existing one. If an element isn't *already* in S (understood as existing desires/passions), deliberation cannot put it there. Deliberation is purely *diagnostic* and *instrumental*.
      *   **Williams:** Sound deliberation *can* be *generative*. Through processes like imaginative reflection and coherence-checking, an agent can *come to have* a genuinely new motivation that wasn't explicitly or dispositionally present in their S *before* deliberation. This new motivation is *internal* because it arises *from* the exercise of sound deliberation *on* the agent's existing S. It doesn't come from nowhere; it's elicited or discovered *through* the process of thinking properly about what one already cares about and what follows from it.

  **The Concrete Case: The "Comfortable Bigot"**

  *   **Scenario:** Charles is raised in a deeply prejudiced environment. His S includes strong desires for in-group loyalty, social status within his group, a sense of superiority, and comfort. It also includes a general disposition towards logical consistency (he hates hypocrisy). He holds racist beliefs ("Group X is inherently inferior/lazy/dangerous") that support these desires and give him comfort. He has no existing desire for fairness, empathy towards Group X, or moral reform. He experiences no psychological discomfort from his beliefs *in themselves*; they fit comfortably within his S.
  *   **Does Charles have a reason to challenge his racism?**

  *   **Humean Verdict: NO (or only minimally).**
      *   Reason can only correct *factual errors* (e.g., if Charles falsely believes Group X commits 90% of crimes when the real figure is 10%). Correcting this *might* weaken one *supporting belief* for his existing desires (comfort, superiority), but it doesn't necessarily generate a *new desire* for fairness or empathy. His core desires (loyalty, status, comfort within his group) might remain perfectly satisfied by his bigoted attitudes, even with corrected facts. He might simply find new (factually correct) justifications or shift focus.
      *   Reason can check *means-end efficiency*, but Charles's racism *is* an effective means to his ends of in-group loyalty, status, and comfort. There's no instrumental error to correct *from his perspective*.
      *   The *content* of his desires (hatred, prejudice) is not assessable by reason. Reason cannot tell him "You *should* care about Group X" or "Your desire for superiority based on prejudice is unreasonable." As long as his passions are based on true beliefs and effective means, Humean reason is silent. Charles has no internal reason to change *unless* correcting a factual error *happens* to undermine his motivation sufficiently (which isn't guaranteed).

  *   **Williamsian Verdict: POTENTIALLY YES.**
      *   Sound deliberation involves more than fact-checking. Charles might engage in *imaginative reflection*: What would it be like to *be* a member of Group X subjected to this prejudice? What would it be like if *he* were judged solely on an immutable characteristic? He might consider the *incoherence* between his value of logical consistency and holding prejudiced beliefs that rely on stereotypes contradicted by evidence (even evidence he possesses).
      *   Through this process, Williams argues, Charles *might come to feel* empathy, or discomfort at his own inconsistency, or a dawning recognition of a shared humanity. **This empathy or discomfort would be a *new* element in his S, generated *through* sound deliberation.** It wasn't explicitly there before; imaginative reflection *elicited* it from his broader S (which included, e.g., the disposition for consistency and the capacity for imagination).
      *   *Now*, with this new motivational element (empathy, discomfort at inconsistency), Charles *does* have an internal reason to challenge his racism – namely, to alleviate this new discomfort or satisfy this new empathetic impulse. The reason *arose* through the deliberative process itself. The deliberation didn't just find a better way to satisfy an *old* desire; it helped *constitute* a new one relevant to the question.

  **Addressing the Standard Complaint (Cruel/Self-Deceived Person):**

  *   **The Complaint:** Internalism seems to say that a deeply cruel person with no shred of empathy or remorse (e.g., a sadist), or someone utterly self-deceived, has *no reason* to be less cruel or more self-aware, as long as their S is coherent and their beliefs factual. This seems morally counterintuitive; surely they *should* change?
  *   **Humean Response:** This is simply the logical consequence. If the cruel person's S contains only sadistic desires and no countervailing motivations (like a desire for social approval that might be thwarted, or a latent capacity for empathy), and their beliefs are true/means effective, then yes, Humean internalism says they have *no internal reason* to change. Any reason to change must be *external* (e.g., societal pressure, punishment), which Hume/Williams reject as genuine *reasons for action* for that agent.
  *   **Williamsian Response & the Gap's Relevance:**
      *   Williams acknowledges this is a *limitation* of internalism. If sound deliberation on the cruel person's *actual* S reveals *no* potential for empathy, no discomfort with cruelty, no latent commitment to values incompatible with sadism, then yes, they have no internal reason to change. Internalism cannot *guarantee* that everyone has a reason to be moral.
      *   **However, the gap identified above gives Williams *more resources* than Hume to argue that such cases might be rarer than they seem.** His broader conception of sound deliberation (imagination, coherence) makes it *more plausible* that reflection *could* uncover or generate a motivational element (e.g., a suppressed capacity for empathy, a desire not to be seen as a monster, a recognition of the arbitrariness of their cruelty) that provides a reason. Hume's framework, by restricting deliberation to fact/means, makes it *much harder* to see how such a reason could emerge internally. Williams holds out the *possibility* that sound deliberation could *create* the necessary motivational hook where none seemed to exist before.
      *   **The Burden:** For Williams, the question becomes an *empirical* one about the agent's psychology and the potential of *their specific S* under sound deliberation. Can imaginative reflection on the suffering they cause *elicit* *anything* besides satisfaction? Is there *any* element in S (e.g., a desire for companionship, a fear of loneliness, a vestigial childhood ideal) that deliberation could connect to a rejection of their cruelty? If the answer is truly "no" after exhaustive deliberation, then internalism concedes no internal reason exists. But Williams believes such "purely evil" psychologies might be less common than the Humean picture implies, precisely because of the generative potential of deliberation on a complex S.

  **Conclusion:**

  Your friend is right that Williams inherits Hume's core internalist insight: reasons for action must be grounded in the agent's motivations. However, Williams **significantly departs from Hume** regarding the power of deliberation. Hume's reason is purely instrumental and inert regarding ends; it cannot create new motivations. Williams's "sound deliberation" is **potentially transformative**; it includes processes (like deep imaginative reflection and coherence assessment) that can *elicit* or *constitute* genuinely new motivational elements within the agent's S. The case of the "Comfortable Bigot" illustrates this gap: Hume likely sees no internal reason to change without factual error, while Williams sees the potential for deliberation to *generate* an internal reason (e.g., empathy) through reflection. This gap provides Williams with a stronger, though still not foolproof, response to the challenge of explaining reasons for the cruel or self-deceived to change, by holding open the possibility that sound deliberation could *activate* latent motivational resources Hume's framework ignores. It's not *just* old wine in new bottles; Williams adds a crucial new ingredient – the potentially motivational power of deep, imaginative self-reflection.
