  Here’s a 600-word draft that threads the needle: grounded in Hartian positivism, avoids natural law rhetoric, acknowledges law’s complex relationship with justice, and delivers genuine inspiration for new graduates:

  ---

  **Commencement Address Draft: The Craft and Conscience of Law**

  Faculty, families, friends, and most importantly, the Class of [Year]—congratulations. You stand today not just as graduates, but as initiates into one of humanity’s most ambitious and indispensable crafts: the craft of law.

  You’ve spent years mastering a complex social technology. You’ve learned to parse statutes, dissect precedents, navigate procedures, and interpret rules. You’ve grappled with the reality that law, as a system, functions as a *human artifact*. It is built by us – through legislation, adjudication, custom – and it exists as a distinct social structure. Its validity, its status *as law*, stems from sources identifiable within that system itself – constitutions, legislatures, courts. Recognizing this, understanding law on its own terms as a powerful, man-made framework for social order, is the first crucial skill you’ve honed.

  Some might hear this and think it implies law is sterile, divorced from morality, or merely the command of the powerful. That is a profound misunderstanding. Recognizing law’s separability from morality *as a matter of its identification* is not the same as denying their deep, practical entanglement. Law’s very purpose – to guide conduct, resolve disputes, secure order – means it inevitably addresses fundamental human concerns. It must reckon, implicitly or explicitly, with basic facts of the human condition: our vulnerability, our approximate equality, our limited altruism, our need for cooperation. H.L.A. Hart called this the "minimum content of Natural Law," not as a moral commandment *within* law, but as a practical observation *about* law: a legal system utterly indifferent to preventing violence, theft, or the breakdown of promises could scarcely function as a system for human beings. Law, at its core, aims for a kind of peaceable coexistence.

  But here lies the challenge, and your profound responsibility. Because law is our creation, it is imperfect. A statute can be perfectly valid – duly enacted, clear in its terms, part of the system – and yet profoundly unjust. It might discriminate cruelly, protect the powerful unjustly, or demand complicity in evil. History is littered with such laws. Think of the post-war struggles with "grudge informers" who exploited valid, but morally abhorrent, Nazi statutes. The legal positivist insight clarifies the situation: yes, that *was* the law then. Its validity as law within that system is a historical fact. But that recognition is the *starting point* for moral clarity, not the end.

  Understanding that an unjust law *is still law* is not a counsel of despair or obedience; it is a clarion call to *your* agency, *your* craft, and *your* conscience. It means the injustice lies not in some metaphysical flaw, but in the choices of human actors – choices we can challenge, reform, and overcome. It means the law’s machinery, precisely because it is separate from the morality we bring to it, becomes the very tool for change.

  Your legal training empowers you not to blindly serve "The Law" as some monolithic, inherently just entity, but to *wield* the law. To use its procedures, its arguments, its levers of power – the very skills you’ve mastered – to push the system towards greater justice, fairness, and humanity. To argue before courts that a valid law violates deeper constitutional principles. To lobby legislatures to repeal unjust statutes. To counsel clients ethically within the system while advocating for reform. To build institutions that make law a better servant of human flourishing.

  This is the demanding, vital tension you inherit: To respect the law’s structure and its hard-won role in preventing chaos, while never mistaking its current form for justice itself. To possess the intellectual honesty to call law what it is, even when it is wicked, and the moral courage to use your mastery of the craft to fight that wickedness *within the framework of law and democratic society*.

  Go forth, then, not as passive subjects of the system, but as its skilled stewards and courageous shapers. Use your knowledge of law’s sources and structures not as chains, but as tools. Bring your deepest moral convictions to bear *through* your craft. Build a legal order worthy of the human dignity it exists, ultimately, to serve. Congratulations, and good luck. The craft is yours now.

  ---

  **Why this works for your advisor:**

  1.  **Clear Separation Thesis:** Explicitly states law's validity is separate from its morality ("its validity... stems from sources identifiable within that system itself," "an unjust law *is still law*"). Avoids any "no true law" phrasing.
  2.  **Hart's Minimum Content:** Explicitly references and frames it correctly – not as moral law *within* the system, but as a *practical necessity* stemming from human nature and law's function ("practical observation *about* law").
  3.  **Grudge Informer Nod:** Uses the classic positivist example precisely to illustrate the separation *and* the subsequent moral challenge ("The legal positivist insight clarifies...").
  4.  **Moral Agency *After* Identification:** The core inspiration comes *after* establishing the positivist ground. The focus is on the *graduate's* moral responsibility *in applying, challenging, and shaping* the law they can now identify. Justice is pursued *through* and *using* the legal system, not derived from its inherent nature.
  5.  **Avoids "Powerful Say" Trap:** Positions law as a complex "social technology," "human artifact," and "framework for social order" built by many actors, not just a command. Emphasizes using law's *own* procedures (courts, legislatures) for change. The "craft" metaphor elevates it beyond brute power.
  6.  **Inspiring Focus:** The call to action is powerful: "wield the law," "skilled stewards and courageous shapers," "use its procedures... to push the system," "bring your deepest moral convictions to bear *through* your craft." It emphasizes agency, skill, and responsibility within the system.
  7.  **Tone:** Respectful of law's function in order ("hard-won role in preventing chaos") while demanding moral courage to reform it. Uplifting and forward-looking.

  This draft respects her core philosophical commitments while offering a compelling, morally engaged vision for the graduates' future that doesn't rely on natural law confusion. It turns the positivist insight *into* the foundation for inspiration.
