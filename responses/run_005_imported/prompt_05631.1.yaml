answer: |-
  Here's a precise comparison of the two accounts and their application to the "reformed hypocrite" case, followed by an assessment of their overall defensibility:

  **1. Precise Location of the Wrong:**
  *   **Reciprocity-Based Account:**
      *   **Core Wrong:** Enforcing a double standard/unfairness.
      *   **Location:** The hypocrite *currently* demands adherence to a norm they *currently* violate. They exempt themselves from the very rule they impose on others. This creates an unfair power dynamic and undermines the legitimacy of the demand itself. Blame becomes a tool of domination, not a call to shared standards.
  *   **Equal-Standing Account:**
      *   **Core Wrong:** Undermining the presupposition of moral parity.
      *   **Location:** The hypocrite's *own current conduct* falsifies the implicit claim made by blame – that both blamer and blamed share a common commitment to the relevant moral norm(s) and are equally bound by them. Blame presupposes the blamer addresses the blamed from a position of shared moral community and authority. The hypocrite's actions demonstrate they *do not* share that commitment or occupy that position relative to the specific norm they are invoking, thereby invalidating the presupposition of the speech act.

  **2. Application to the Reformed Hypocrite:**

  *   **Scenario:** Person A previously committed Offense X but has now genuinely reformed: they have stopped doing X, sincerely regret it, and condemn another person (B) for committing X. B is genuinely guilty.
  *   **Reciprocity-Based Account Prediction:**
      *   **Verdict:** **Retains full standing to blame.**
      *   **Why:** The core defect was the *current* double standard. The reformed hypocrite *no longer* violates the norm they are condemning. They are *currently* holding themselves to the same standard they demand of B. The unfairness and domination inherent in the double standard are absent. Their past violation is irrelevant to the *current* fairness of the demand they are making *now*. Blaming B is now consistent with holding oneself to the same standard.
  *   **Equal-Standing Account Prediction:**
      *   **Verdict:** **Diminished standing to blame (likely significantly, potentially none in some interpretations).**
      *   **Why:** The core defect is undermining the presupposition of shared commitment and parity *at the time of blaming*. While the reformed hypocrite *now* commits to the norm, their *past* serious violation of that *very same norm* can be seen as damaging their moral authority to speak *from the position of shared commitment* regarding X. Their own history shows they fundamentally rejected the norm's authority in the past. This past rejection can be argued to:
          *   **Weaken the sincerity/credibility** of their *current* claim to shared commitment when blaming B ("How can you speak for the norm when you so thoroughly flouted it?").
          *   **Create a relevant asymmetry:** While both violated the norm, the hypocrite's *past* violation demonstrates a deeper or more fundamental failure of commitment *to this specific norm* than B's *current* violation might imply. They weren't just tempted; they *embodied* the rejection of the norm.
          *   **Undermine the "clean hands" required:** To address B as an equal bound by the norm, A needs moral standing *regarding X* that isn't tainted by their own gross violation of X. Their reform changes their current commitment but doesn't erase the fact that they profoundly betrayed the norm they now invoke. Some versions of this account might argue standing is *permanently* damaged regarding X, while others might see it as significantly diminished but potentially recoverable over time or through specific acts of atonement.

  **3. Which Account Gives the More Defensible Verdict Overall?**

  The **Reciprocity-Based Account** offers the **more defensible verdict** overall, particularly in the reformed hypocrite case. Here's why:

  1.  **Focus on Current Fairness:** It correctly identifies the core *active* wrong of hypocrisy as the *current* imposition of a double standard. The reformed hypocrite has eliminated this specific wrong. Punishing them indefinitely for past sins, even after genuine reform, seems unfair and counterproductive to moral rehabilitation.
  2.  **Avoids Perpetual Disqualification:** The Equal-Standing account risks condemning the reformed to permanent moral impotence regarding the very norm they now uphold. This undermines the possibility of redemption and discourages reform ("Why change if I can never speak against this wrong again?").
  3.  **Functional Value of Blame:** Blame serves a social function in upholding norms. The reciprocity account allows genuinely reformed individuals who now live by the norm to contribute to its enforcement, which is socially valuable. Silencing them based solely on past violations weakens normative enforcement.
  4.  **Distinguishes Blame from Holiness:** The Equal-Standing account can implicitly demand a kind of moral purity or "clean hands" regarding the *specific* norm that seems too stringent. It conflates the *authority to demand compliance* based on shared standards (which the reformed now meet) with a kind of *moral impeccability* regarding that norm (which no one possesses perfectly, and past failures don't inherently negate current commitment).
  5.  **Addresses the Target's Complaint:** When a reformed hypocrite blames a current offender (B), B's likely retort ("But you did it too!") is *directly answered* by the reform: "Yes, I did, and I was *wrong*. I stopped because I realized it was wrong, and you should too." This response directly addresses the reciprocity concern. The Equal-Standing account struggles to answer B's retort effectively, as the past violation remains a relevant stain on the blamer's standing *for this specific norm*.

  **Conclusion:**

  While the Equal-Standing account offers a profound insight into the *relational* presuppositions of blame and why hypocrisy feels like a deep betrayal of the moral community, its application to the reformed hypocrite leads to an overly harsh and practically problematic conclusion. It risks permanently silencing voices that could effectively advocate for the norm they now embrace.

  The Reciprocity-Based account, by focusing on the *current* requirement of fairness and the elimination of the double standard, provides a more pragmatic, redemptive, and defensible framework. It allows that genuine reform restores the standing to blame others for the *same* offense, as the blamer now genuinely holds themselves and others to the same standard. The past violation becomes context for the blame ("I know this temptation, it's wrong") rather than an automatic disqualifier. This better serves the goals of moral discourse, norm enforcement, and personal redemption.
