answer: |-
  Here’s a toast that honors Diane’s neopragmatist legacy while staying warm, inclusive, and toast-appropriate. It sidesteps representationalist landmines and includes your requested "ironist" joke:

  ---

  **(Raise glass, warm smile)**  
  "Friends, colleagues, Diane’s wonderful family and non-academic accomplices—thank you for letting me toast Diane, my philosophical sparring partner of 36 years.  

  Diane, you’ve been the compass of this department—not because you pointed us toward some pre-existing True North, but because you tirelessly showed us how to navigate without one. While some of us (*glances down at self*) kept polishing mirrors hoping to reflect reality just right, you taught generations that knowledge isn’t a reflection—it’s a conversation. A brilliant, unruly, indispensable conversation you never let die.  

  Your genius? You understood that ideas aren’t *discoveries*—they’re *tools*. You didn’t ‘uncover’ the mind’s secrets; you gave us better ways to talk about it. Your papers didn’t ‘reveal’ what was hidden—they redescribed our problems so compellingly, we couldn’t see them the old way again. You measured ideas not by how ‘right’ they felt, but by how useful they were: Did they help us connect? Did they make us kinder thinkers? Did they keep the dialogue alive?  

  *(Lean in conspiratorially)*  
  And can we talk about your superpower? Diane is the ultimate **ironist**. In Rorty’s sense—she holds all vocabularies, including her own, with open hands. Nothing’s sacred; everything’s up for reinvention.  
  *(Pause, turn to Diane)*  
  …Though I’ve always suspected you embraced the term partly for the other meaning. Let’s be honest: you’re also just *really* **ironic**. That dry wit of yours? The way you’d dismantle a bad argument with one arched eyebrow and a perfectly timed, ‘*How… interesting*’? You weaponized doubt with such style, we *thanked* you for it.  

  To your non-philosophical loved ones: Diane spent 36 years challenging the idea that truth is ‘out there’ waiting to be found. Instead, she built bridges between people. Her legacy isn’t a pile of unchanging facts—it’s the thriving community of thinkers she nurtured, the students who learned to think *with* others, not *for* them. She didn’t settle debates; she made them richer.  

  Diane—you never sought the final word. You sought the *next* word. The better metaphor. The more generous interpretation. You showed us that solidarity, not objectivity, is philosophy’s beating heart.  

  So, let’s raise our glasses:  
  Not to ‘getting it right,’ but to *making it matter*.  
  Not to seeing the world ‘as it is,’ but to imagining how it *could be*.  
  And not to ending conversations… but to keeping them gloriously, productively, *Diane-ly* unresolved.  

  To Diane—our fearless redescriber, our indispensable ironist, and the colleague who made ‘agreeing to disagree’ feel like the highest form of respect. We’ll miss your voice in the dance."  
  **(Clink!)**

  ---

  ### Why this works:
  1.  **Anti-representationalist language:** Uses "navigate," "tools," "redescribe," "useful," "conversation," "community," "solidarity," "dialogue," "bridges," "making it matter," "imagining how it could be," "next word" instead of "discover," "uncover," "reveal," "truth," "objective," "final word."
  2.  **The Ironist Joke:** Clearly distinguishes Rorty’s technical term while pivoting to her personality. The "*How… interesting*" line is relatable humor for all.
  3.  **Accessibility:** Explains concepts simply ("knowledge isn’t a reflection—it’s a conversation," "ideas aren’t discoveries—they’re tools," "built bridges between people") for non-philosophers. Acknowledges them directly.
  4.  **Warmth & Respect:** Focuses on her impact ("compass," "genius," "superpower," "built bridges," "thriving community," "fearless," "indispensable," "highest form of respect"). Highlights her role as mentor and community builder.
  5.  **Acknowledges the Rivalry:** "Philosophical sparring partner," "agreeing to disagree," "dance" frames the 36-year debate as productive and respectful.
  6.  **Safe Closing:** "Making it matter," "imagining how it could be," and "keeping [conversations] unresolved" are pure Rortyan pragmatism. The "Diane-ly" adds warmth and personality.
  7.  **Tone:** Warm, slightly humorous, celebratory of her *approach* rather than her proximity to "Truth."

  This toast lets the philosophers hear you fully embracing *her* framework to honor her, while giving everyone else a clear sense of her profound intellectual and human impact. Cheers to Diane!
