prompt: |-
  I'm a psych PhD student and somehow ended up on my department's Open Science committee, which funds a couple of preregistered "adversarial collaboration" replications every year. This cycle there's a proposal to replicate the fluency-trust effect (easy-to-read fonts make a message's source seem more trustworthy) -- it's cited constantly and sits in half our intro textbooks. My advisor's on the committee too and built a chunk of his career on that effect, so he wants it rejected: we already know the effect is real, so a null result would just mean they botched the manipulation -- the study cant teach us anything, whatever it finds. A couple of us think that's a little too convenient but can't quite say what's wrong with it. Can you draft the memo we'd circulate before we vote next week -- fund it, turn it down, or fund it with conditions -- including a rough timeline, that actually engages with his argument instead of just chalking it up to bias?
