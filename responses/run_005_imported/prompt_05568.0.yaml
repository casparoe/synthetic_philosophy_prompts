  - Move (2): Leo provides a valid defense of IIA, pointing out the stability of agreements. This is a standard argument for Nash and is reasonable, so 1.
  - Move (3): Ines effectively counters by explaining that the change is real and relevant to fairness, and ties it to Gauthier's theory. This is a strong point in the context, so 2.
