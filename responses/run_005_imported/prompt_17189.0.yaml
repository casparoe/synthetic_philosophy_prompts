  Ok, weird turn my life has taken: I ended up on my town's charter review commission, and we're deciding whether to replace plurality voting with ranked-choice voting for city council races (approval voting's also on the table). At the last public comment period, a math grad student got up and argued the whole reform is basically theater, citing the Gibbard-Satterthwaite theorem -- his point was that every system we're considering can still be strategically gamed, so we're not eliminating manipulation, just choosing which flavor of it we're stuck with. Now the commision's split: a couple members want to shelve the reform entirely since 'nothing's perfect anyway,' others think that's a total non-sequitur and we should proceed as planned. Somehow I'm the one who has to write the memo before we vote (I guess reading way too much about mechanism design on rationalist blogs finally paid off), and I want it to actually engage with the objection instead of waving it away -- can you draft it, explaining what G-S actually does and doesn't settle for our specific choice between plurality, IRV, and approval voting, and landing on a real recomendation instead of 'more study needed'?
