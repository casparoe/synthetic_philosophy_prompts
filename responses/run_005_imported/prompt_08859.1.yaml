  First, I need to recall Strawson's framework from "Freedom and Resentment." Strawson distinguishes between the participant stance and the objective attitude. The participant stance involves reactive attitudes like resentment, gratitude, and indignation, which are essential to holding people morally responsible. The objective attitude is more detached, treating someone as an object to be managed or treated, rather than as a responsible agent.

  Strawson identifies certain conditions that can exempt someone from the reactive attitudes altogether, meaning we adopt the objective attitude wholesale. These include things like mental illness, extreme stress, or being a child, where the person isn't capable of participating in normal interpersonal relationships.

  Then there are considerations that mitigate or excuse a particular action without exempting the person entirely. For example, if someone acts under duress or with a good excuse, we might not feel resentment for that specific act, but we still see them as a responsible agent in general.

  Finally, there are factors that are irrelevant or might even aggravate the situation, meaning they don't soften our reactive attitudes and could make them stronger.

