  One key point is that humans might be inconsistent. Gödel's theorem requires consistency, so if humans are inconsistent, the theorem doesn't apply. But the user says inconsistency shouldn't matter because any proposed system F would still have its own G_F. However, if humans are inconsistent, they might not reliably recognize the truth of G_F. Inconsistency could mean humans sometimes accept false statements, so their "recognition" of G_F might be flawed. That undermines the argument.

