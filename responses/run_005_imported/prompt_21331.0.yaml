prompt: |-
  So for my philosophy of language class this semester we spent a good few weeks on Kripke's book on Wittgenstein and the whole rule-following paradox — the plus vs. quus thing, where apparently nothing about my finite past use of "+" can fix that I mean addition rather than some deviant function that agrees with addition on every sum I've actually done but diverges on numbers I've never touched. Total coincidence, but I also co-host a tiny philosophy podcast with a couple people from my dorm, and next month's guest is a philosopher who defends the "community view" — basically Kripke's own skeptical solution, where there's no fact about an individual in isolation that makes it true they mean plus rather than quus, and what grounds talk of "correct" use is just a community's practice of correcting and agreeing with each other.

  I really don't want the episode to just be her re-explaining the skeptical paradox to an audience of philosophy majors, alot of whom have already read the SEP page on this — I want to actually press on the view the way the literature does. Could you draft me 8-10 interview questions that go beyond having her restate the position? I want at least one question on the objection that a community is just a pile of individuals, so it's not obvious how adding more people who could each individually be "quus-ing" fixes anything that was broken for the lone individual; one on the Robinson Crusoe case, i.e. how committed she really is to the claim that someone with zero community could never mean anything determinate; one on the charge (I think this is from Boghossian, might be misremembering the name) that the skeptical solution is really a non-factualism about meaning that just swaps out truth-conditions for assertability-conditions instead of actually answering the sceptic; and one on whether the view is self-undermining, since Kripke needs meaningful language to even state the skeptical solution in the first place. For each question, throw in a quick follow-up keyed to whatever answer she's most likely to give so I'm not just sitting there nodding, and maybe end on a question about what she thinks would actually count as evidence against the community view, since so far she's mostly just described it as the only position left standing once you take the paradox seriously.
