answer: |-
  ### Analysis of the Betting Strategy

  Your partner Jordan argues that betting the entire balance every week maximizes expected earnings because each dollar wagered has an expected payout of $1.20 (60% chance of doubling, 40% chance of losing). While this is true for a single bet, it is a myopic view that ignores the realities of repeated betting over multiple weeks. Jordan's strategy leads to a high risk of ruin (going to zero) and is suboptimal for long-term growth, as evidenced by their repeated bankruptcies. Your approach of betting a fraction of your balance is indeed more rational for sustained growth, and there is a rigorous mathematical framework to support this.

  Below, I'll break down the key points:
  1. **Why Jordan's Strategy Fails for Repeated Bets**.
  2. **The Optimal Strategy: Kelly Criterion**.
  3. **Addressing Risk Aversion and "Trusting the Math"**.
  4. **Practical Advice for the Simulation**.

  ---

  ### 1. Why Jordan's Strategy Fails for Repeated Bets
  Jordan's argument focuses on maximizing expected value (EV) for each individual bet:
  - For a single bet of size \(B\) (current balance), the EV is:
    \[
    \text{EV} = (0.6 \times 2B) + (0.4 \times 0) = 1.2B
    \]
    This means betting more increases the expected value for that bet. However, this logic does not extend to repeated betting because:
    - **Bankroll compounding**: In multi-round betting, your bankroll grows or shrinks multiplicatively (not additively). Betting your entire balance each week means a single loss resets you to zero (or a small stipend), wiping out all previous gains and future opportunities.
    - **Risk of ruin**: With a 60% win probability, the probability of losing at least once over \(n\) weeks is \(1 - (0.6)^n\). For example:
      - After 10 weeks, probability of at least one loss ≈ 99.4%.
      - After 20 weeks, it approaches 100%.
      This means Jordan's strategy almost guarantees bankruptcy over time, as you observed. The "variance" Jordan mentions is not just noise—it leads to catastrophic outcomes with high probability.
    
    - **Expected value vs. typical outcome**: While the expected balance after \(n\) weeks with all-in betting is \(E[B_n] = B_0 \times (1.2)^n\) (e.g., \(\$10,000 \times 1.2^{10} \approx \$61,917\) after 10 weeks), this is misleading. The distribution is highly skewed:
      - High probability of near-zero balance (e.g., after 10 weeks, ≈99.4% chance of ruin, leaving only the stipend).
      - Low probability of extremely high balance (e.g., 0.6% chance of \(\$10,240\) after 10 weeks).
      In contrast, fractional betting (like your approach) produces more consistent, less volatile growth, which is better for long-term performance.

    - **Long-term growth rate**: For repeated betting, the key metric is the exponential growth rate of your bankroll, not the per-bet EV. The growth rate is captured by the expected logarithm of wealth. Betting your full balance gives:
      \[
      E[\log(\text{return})] = 0.6 \times \log(2) + 0.4 \times \log(0) = 0.6 \times 0.693 + 0.4 \times (-\infty) = -\infty
      \]
      This means the long-term growth rate is negative infinity—bankruptcy is certain. Fractional betting avoids this by keeping the growth rate positive.

  Jordan's mistake is in treating each bet as independent and ignoring how bankroll fluctuations affect future bets. Maximizing per-bet EV is rational for a one-time gamble but irrational for repeated play where capital preservation matters.

  ---

  ### 2. The Optimal Strategy: Kelly Criterion
  There is a principled way to determine the best fraction to bet: the **Kelly criterion**. This strategy maximizes the long-term growth rate of your bankroll by balancing risk and return. For a bet with two outcomes (win or lose), the Kelly fraction \(f^*\) is:
  \[
  f^* = \frac{bp - q}{b}
  \]
  where:
  - \(b\) is the net odds received (here, \(b = 1\) because a winning \$1 wager returns \$2, for a net gain of \$1).
  - \(p\) is the probability of winning (0.6).
  - \(q\) is the probability of losing (0.4).

  Plugging in the values:
  \[
  f^* = \frac{(1 \times 0.6) - 0.4}{1} = \frac{0.2}{1} = 0.2
  \]
  **This means you should bet 20% of your current bankroll each week.**

  #### Why Kelly is optimal:
  - **Maximizes growth rate**: The Kelly fraction maximizes \(E[\log(\text{wealth})]\), which represents the expected log-growth per bet. For \(p = 0.6\) and \(f = 0.2\):
    \[
    g(f) = 0.6 \times \log(1 + 0.2) + 0.4 \times \log(1 - 0.2) \approx 0.6 \times 0.1823 + 0.4 \times (-0.2231) \approx 0.02014
    \]
    This positive growth rate (\(\approx 2.014\%\) per week) ensures exponential growth: after \(n\) weeks, bankroll \(\approx B_0 \times e^{0.02014n}\). For example:
    - After 20 weeks, expected growth factor \(\approx e^{0.4028} \approx 1.50\).
    - After 50 weeks, \(\approx e^{1.007} \approx 2.74\).
  - **Minimizes risk of ruin**: Betting 20% ensures you never go bankrupt in one bet (since you always retain 80% after a loss), and the probability of severe drawdowns is low. Simulations show it outperforms all-in strategies over time.
  - **Outperforms other fractions**: Betting more than 20% (e.g., Jordan's 100%) increases volatility and risk of ruin, reducing long-term growth. Betting less (e.g., 10%) is safer but grows slower. Kelly is the "sweet spot."

