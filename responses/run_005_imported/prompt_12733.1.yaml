  ### 3. Addressing Risk Aversion and "Trusting the Math"
  - **Jordan's claim about "irrational risk aversion"**: Your hesitation to bet everything is not irrational—it is mathematically justified. Jordan confuses one-time EV with long-term growth. The "math" they appeal to (per-bet EV) is incomplete for repeated decisions. The Kelly criterion, rooted in information theory and expected utility, shows that maximizing per-bet EV leads to poor outcomes when bets are interdependent.
  - **Your stats major roommate's view**: They are technically correct about per-bet EV, but this ignores multi-period dynamics. For repeated bets, the Kelly criterion is the gold standard in decision theory, finance, and probability (used by Warren Buffett and Claude Shannon). It resolves the apparent conflict between EV and risk.
  - **Risk tolerance**: If you were betting less than 20% out of caution, that reflects risk aversion. But Kelly is optimal even for risk-neutral players because it maximizes median wealth and avoids ruin. Risk-averse players might bet less (e.g., 10–15%), but deviating from Kelly sacrifices growth for safety.

