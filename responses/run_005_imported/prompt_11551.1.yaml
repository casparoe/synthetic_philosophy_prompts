  I recall studies showing remote work effects vary wildly by industry, role, and measurement criteria. If one focuses on creative collaboration and the other on deep work, both could be "right" while talking past each other. Their trust in each other actually complicates this—they might assume shared definitions when none exist. 

  The emotional layer matters too. Remote work debates often tap into personal values (autonomy vs. structure) disguised as productivity discussions. Neither would admit this, but it could explain the stalemate. 

