answer: |-
  ## Hotel Bar Showdown: The Resolute Gambit

  **Setting:** A dimly, overly air-conditioned hotel bar. Plastic ferns brush against vinyl booths. The faint clink of ice and murmur of exhausted conference attendees. **Alex** (late 30s, sharp suit slightly rumpled, nursing a neat whiskey) leans forward intently. **Sam** (early 40s, tweed jacket over a faded band t-shirt, swirling a craft IPA) meets their gaze, equally focused.

  **Alex:** Look, Sam, McClennen’s clever, I’ll give him that. But ‘resolute choice’? When the bookie comes knocking, it’s just whistling past the graveyard. The money pump *is* the reductio. Preferences that cycle *are* irrational. Full stop. They literally bankrupt you.

  **Sam:** (Takes a slow sip) Alex, you’re conflating synchronic rationality with diachronic rationality. The pump shows a *procedural* vulnerability if you make choices myopically, moment-by-moment. It doesn’t damn the underlying *evaluation* of the options. My *plan* can be rational even if my *local impulse* isn’t.

  **Alex:** Okay, let’s get concrete. Standard three-way cycle. You prefer *A* to *B*, *B* to *C*, and *C* to *A*. Why? Doesn’t matter. Maybe *A* is a rare book, *B* is cash equivalent, *C* is a promise from a friend. Whatever. The structure is the killer. Enter Bookie Brenda. She knows your cycle. She offers you *C* right now for free.

  **Sam:** Fine. I accept *C*. It’s free, and I prefer *C* to nothing.

  **Alex:** Exactly. Now Brenda says, “Hey, I see you have *C*. I know you prefer *B* to *C*. Give me *C* plus one cent, and I’ll give you *B*.”

  **Sam:** (Nods slowly) And according to my *synchronic* preference at that moment, holding *C*, I prefer *B* to *C*. Paying a cent to get the superior option seems rational *right then*.

  **Alex:** So you pay the cent, swap *C* for *B*. Now Brenda smiles. “Lovely *B* you have! But you prefer *A* to *B*, right? Give me *B* plus one cent, and *A* is yours.”

  **Sam:** And again, holding *B*, I prefer *A* to *B*. Paying a cent to upgrade feels rational *in that isolated moment*. So I pay, get *A*.

  **Alex:** And now? You have *A*. You started with nothing, paid two cents, and have *A*. But Brenda leans in one last time: “You know, Sam, I recall you prefer *C* to *A*. Hand over *A* plus one cent, and I’ll give you back *C*.”

  **Sam:** (Leans back, a slight smile) And here’s where the resolution bites. *Before any of this started*, knowing my cyclical preferences and knowing Bookie Brenda exists, I adopted a *plan*. My plan was: **Accept the first free offer (*C*), then refuse *all* subsequent trades.** Period.

  **Alex:** (Leans in further, voice low and intense) So you’re holding *A*. Brenda offers you *C* for *A* plus one cent. According to your *preferences at this very moment*, holding *A*, you prefer *C* to *A*. You *like C better right now*. But you... refuse? You knowingly choose the option you *like less*? How is that *not* irrational at the moment of choice? It’s definitionally choosing against your current preference!

  **Sam:** (Meets Alex's intensity) Yes. At that precise *synchronic* moment, refusing the trade means choosing *A* (which I locally rank lower than *C*) over *C*. It feels counter-preferential. But Alex, the irrationality isn't in that single choice. It was *in accepting the plan that put me in that position without an exit strategy*. The resolution was adopted *before* the pump sequence began, precisely to *avoid* the diachronic trap. By sticking to the plan *now*, I uphold the rationality of the *entire extended action*. I end with *A*, having paid only two cents. If I deviate, I end back with *C*, having paid *three* cents. The plan minimizes total loss *and* secures a better final outcome (*A* vs. *C*) than deviation does.

  **Alex:** But you just admitted it! You *prefer C to A right now*! Sticking to the plan *requires* you to ignore that revealed preference! You’re saying your *actual* preference ordering changes depending on whether you’re thinking about the plan or facing the immediate choice. That’s not resolution, that’s self-deception! Your ‘commitment’ is just a way to *change your preferences* when faced with the pump. You *stop preferring C to A* when holding A, solely because you made a ‘plan’ earlier? That’s preference change masquerading as steadfastness.

  **Sam:** No! The *evaluation* of the options hasn't changed. *A* still has the properties that make me rank it below *C* when directly comparing them in isolation *at a single time*. What changes is my *deliberative context* and the *weight I give to my past commitments*. Diachronic rationality isn't just a sequence of synchronic rationalities. It requires *coherence over time*. The plan *is* the instrument of that coherence. Choosing *A* over *C* now *feels* locally suboptimal, but it’s the *globally optimal* move *given the path I committed to*. It respects my past rational agency.

  **Alex:** Globally optimal? At the cost of current dissatisfaction? That sounds suspiciously like regret. You *wish* you could trade *A* for *C* right now! But you’ve handcuffed yourself to this ‘plan’. How is this different from just *learning* that cyclical preferences are bad and adopting transitive ones? You’re achieving transitivity through sheer force of will at the moment of choice, overriding your ‘true’ local preference. It’s brute force rationality, not genuine preference coherence.

  **Sam:** It *is* different! If I simply adopted transitive preferences, say A>B>C, then I wouldn't *want* C over A in the first place! The *conflict* wouldn't arise. With resolution, the conflict *is* real and present. I *genuinely* feel the pull to trade A for C *and* the pull to stick to my plan. Sticking to the plan isn't changing my underlying valuation; it's prioritizing my diachronic self's judgment over my momentary self's impulse. It’s acknowledging that the momentary impulse, if indulged, leads to a worse *temporal whole*. Yes, it involves a cost – the pang of resisting the local preference. But that cost is less than the cost of being pumped! It’s the price of maintaining integrity over time with non-standard preferences. It’s not brute force; it’s *constitutive* of a different kind of rational agency.

  **Alex:** (Sighs, swirls whiskey) So you bite the bullet. Hard. You knowingly choose the locally suboptimal option to serve a ‘plan’, a plan designed solely to avoid the consequences of your inconsistent preferences. It feels... epicyclic. Like adding a complex fix to preserve a fundamentally flawed core. Simpler just to have consistent prefs.

  **Sam:** (Smiles wryly) Maybe. But the world isn't always simple. Maybe the preferences *are* fundamentally evaluative, reflecting genuine, incommensurable values that *can* cycle in pairwise comparisons. Should we just declare those values irrational? Or do we develop decision procedures – like resolution – that allow us to navigate them without ruin? The pump shows the *danger*, Sam, not the *impossibility*. Resolution is the life raft. It might be uncomfortable, it might require discipline, it might involve that moment of choosing against the local gust... but it keeps you afloat. And sometimes, that’s rationality enough.

  **Alex:** ...Alright. Point taken. But that life raft looks damned leaky from where I’m sitting. Another round? We can argue about regret next.

  **Sam:** (Clinks bottle against Alex's glass) Deal. But I’m sticking to my plan: IPA only. No switching to that fancy single malt, no matter how good it smells right now.

  **Alex:** (Chuckles) Touche. The resolute drinker. Let’s see how long *that* lasts.
