answer: |-
  You're absolutely right to push past the "depends on what you mean by local" evasion – that's often where the real debate hides. The disagreement between Eliezer Yudkowsky (representing a strong MWI perspective) and critics like Tim Maudlin hinges on **what constitutes the fundamental ontology of the theory and what kind of "work" locality is doing within that ontology.**

  Here's the breakdown of the core dispute:

  1.  **Eliezer's MWI Argument (The "Cake and Eat It Too" View):**
      *   **Premise 1:** Bell's Theorem proves that *any theory* predicting the observed quantum correlations **must** violate at least one of three assumptions: (1) Locality (no faster-than-light influences), (2) Realism (properties exist prior to/independent of measurement), or (3) Single Definite Outcome (each measurement has one result).
      *   **Premise 2:** Standard interpretations (Copenhagen, Collapse models) drop Locality *or* Realism to resolve the paradox.
      *   **MWI Move:** MWI drops the **Single Definite Outcome** assumption. Instead of one outcome, *all* outcomes happen, each in a separate, non-communicating branch of the universal wavefunction.
      *   **Locality Claim:** The fundamental dynamical law, the Schrödinger equation, is **strictly local** in configuration space. The wavefunction evolves point-by-point based *only* on its value and the Hamiltonian (representing local energy densities/interactions) at that point. There is no faster-than-light propagation of influence *within* the wavefunction's evolution. No branch influences another branch.
      *   **Correlations Explained:** The perfect correlations (e.g., entangled particles) arise because the entangled state *is* a single, non-separable state in configuration space *before* measurement. Measurement (decoherence) doesn't *cause* the correlation via nonlocal action; it simply reveals the correlation inherent in the pre-existing global state by splitting it into branches where the correlated properties hold locally within each branch. Alice measuring her particle doesn't *affect* Bob's particle light-years away; it just means that the branch where Alice got spin-up is *always* correlated with the branch where Bob *would* get spin-down if he measured, and vice versa. Since both branches exist, the correlation is global but established locally at the source when entanglement was created.

  2.  **Maudlin's Critique (The "Bait-and-Switch" View):**
      Maudlin argues that while MWI technically satisfies a *mathematical* definition of locality (the Schrödinger equation is local differential equation in configuration space), it fails to satisfy a **physically meaningful notion of locality** concerning the *structure of reality* and the *explanation of correlations*. His key points:
      *   **The Wavefunction Isn't "In" Space:** The fundamental object, the universal wavefunction Ψ, lives in a high-dimensional **configuration space** (3N dimensions for N particles), *not* in ordinary 3D (or 4D spacetime). Locality *in configuration space* is **not** equivalent to locality *in physical space*. Two points in configuration space that are "close" mathematically might represent configurations where particles are light-years apart physically.
      *   **Non-Separability:** The entangled state itself is **inherently non-separable**. Before any measurement, there is no fact of the matter about the definite state of Alice's particle *or* Bob's particle independently. The state describes a *holistic* property of the *entire pair*. Maudlin argues this holistic state *is* the nonlocal element. While its *dynamics* are local (in config space), its *very existence* as a non-separable entity violates a principle of **spatiotemporal separability** – the idea that the complete physical state of the world is determined by states assigned to bounded regions of spacetime.
      *   **Branching Requires Global Coordination:** For the branching process (decoherence) to produce the *correct* correlated outcomes *everywhere*, it requires an **exquisite, frame-dependent coordination** across vast distances. When Alice measures her particle, decoherence splits the wavefunction into branches. But for Bob's particle to *also* have the correlated definite outcome in the *same* branch, the branching has to "line up" perfectly across space instantaneously (or in a spacelike manner). This coordination, ensuring that the branch defined by Alice's result in her lab *is the same branch* where Bob's particle has the correlated property in his lab light-years away, *looks suspiciously like a nonlocal process*, even if it's described by a local differential equation evolving a non-separable state. Maudlin sees this as smuggling nonlocality in through the ontology.
      *   **"Local" Becomes Trivial:** Maudlin argues that defining locality solely by the mathematical form of the Schrödinger equation in configuration space makes the concept too weak. Almost *any* theory can be made "local" by embedding it in a sufficiently high-dimensional space. The physically relevant question is whether the theory posits **direct, unmediated connections** between distant events in physical spacetime. In MWI, the perfect correlations *are* explained by such a connection – the existence of the non-separable global wavefunction itself, whose structure directly links Alice's outcome to Bob's outcome without any mediating process propagating through space.

  **Where the Disagreement Truly Lies & Who Has the Stronger Case:**

  *   **Different Notions of "Local":** Yes, they *are* using "local" in subtly different, but crucially important, ways.
      *   **Eliezer (MWI):** Focuses on **dynamical locality** (no faster-than-light *influences* or *signaling* within the evolution) and **no action-at-a-distance**.
      *   **Maudlin:** Focuses on **ontological locality / separability** (can the complete state of the universe be built up from states assigned to localized regions of spacetime?) and the absence of **holistic, non-separable states** that directly link distant events.
  *   **The Core Dispute:** The dispute is fundamentally **ontological and metaphysical**, not just about the math.
      *   Eliezer/MWI says: The fundamental entity is the wavefunction in configuration space; its dynamics are local; the correlations are explained by its initial non-separable state + local dynamics + branching; *therefore, no nonlocality*.
      *   Maudlin says: The wavefunction's non-separability *is* the nonlocality. The requirement for globally coordinated branching to explain correlations *is* the nonlocality manifesting. Locality in configuration space doesn't translate to locality in physical spacetime. *Therefore, MWI is nonlocal*.
  *   **Is MWI smuggling something Bell-adjacent?** Maudlin would say **yes**. Bell's theorem highlights the need for *some* non-classical feature to explain the correlations. MWI avoids nonlocal *dynamics* but posits a nonlocal *state* (the entangled wavefunction) and a branching process requiring nonlocal *coordination* to define the branches consistently across space. This coordination isn't *signaling*, but it *is* a frame-dependent global structure that violates a strong principle of spatiotemporal separability.

  **Who has the stronger case?**

  This is highly contentious, but here's a balanced assessment:

  1.  **Eliezer/MWI has the stronger *formal/mathematical* case:** The Schrödinger evolution *is* local in configuration space. There is no mechanism for FTL signaling. The correlations *are* explained by the initial state and local interactions. Bell's theorem *is* circumvented by rejecting the single definite outcome. **On these specific technical points, MWI is correct.**
  2.  **Maudlin has the stronger *conceptual/physical intuition* case:** His critique exposes a deep tension. While the *dynamics* are local, the *ontology* is radically nonlocal. The wavefunction's existence in configuration space and the inherent non-separability of entanglement mean that physical reality, according to MWI, does *not* consist of localized objects with independent properties whose interactions are strictly local. The branching coordination *does* seem like a hidden nonlocal hand ensuring consistency. **If your intuition of "locality" includes the idea that the world is fundamentally made of stuff localized in spacetime whose connections propagate causally, then MWI is profoundly nonlocal.**

  **Conclusion:** The disagreement isn't resolvable by pure logic; it hinges on what you consider the fundamental nature of physical reality and what aspects of "locality" you prioritize.

  *   **If you prioritize "no FTL influences/signaling" and "dynamics governed by local differential equations":** MWI is local. Eliezer wins.
  *   **If you prioritize "spatiotemporal separability" (reality built from local beables) and the absence of instantaneous global correlations/holistic states:** MWI is nonlocal. Maudlin wins.

  Maudlin's critique is powerful because it highlights that MWI's "solution" to locality comes at the cost of an ontology radically alien to classical spacetime intuition. Eliezer's view is formally consistent but arguably downplays the profound strangeness of the global, non-separable wavefunction and the branching process. Neither is definitively "wrong," but Maudlin successfully exposes that MWI doesn't truly offer a *classically intuitive* local realism; it offers a profoundly different kind of reality where locality, as commonly understood in spacetime, dissolves into a holistic structure evolving in configuration space.
