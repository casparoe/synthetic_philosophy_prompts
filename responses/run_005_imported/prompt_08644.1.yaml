  I recall that even in indeterministic systems, we can still discuss probabilities as truth-makers. Like how we say "this atom has 50% chance of decaying" is true now. So truth-values and determinism aren't perfectly coupled.

  Also important: Aristotle's original concern was about logical bivalence (must every statement be true/false?) not physics. That's why Łukasiewicz proposed three-valued logic - as a conceptual solution independent of science.

