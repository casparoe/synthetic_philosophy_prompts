prompt: |-
  Been down a total rabbit hole this week reading around anthropic reasoning for a piece on existential risk, and I keep tripping over something I can't square in my head. As I understand it, the self-indication assumption (SIA) — basically, weight hypotheses by how many observers like you they imply — is the engine behind the Doomsday Argument: since way more humans would exist if our species has a long future ahead of it than if it ends soon, SIA says we should be surprised to find ourselves this early in the story, and should update toward doom. Bleak, but I followed the logic.

  Then I got to the "presumptuous philosopher" case, where this pompous philosopher tells physicists not to bother running their experiment, because one cosmological theory implies way more observers exist than the other, so its basically already confirmed — and apparently this is the textbook example of anthropic reasoning gone completely off the rails, not a serious argument anyone should buy. But that's the exact same move as in the Doomsday case (more possible observers = more probable), so why does one count as a genuine update we're supposed to loose sleep over and the other as an obvious reductio nobody takes seriously? Is this just philosophers not being consistent with their own principle, or is there something I'm missing about why these two cases actually come out differently? Trying to get this straight before it goes anywhere near print.
