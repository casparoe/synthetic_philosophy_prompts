  First, I need to recall the core of SIA: it weights hypotheses based on the number of observers. In the Doomsday Argument, finding ourselves among the earliest humans suggests that there aren't many future humans, hence higher probability of doom. The Presumptuous Philosopher argues that a theory predicting more observers (like a multiverse) is more likely without evidence, which seems ridiculous.

