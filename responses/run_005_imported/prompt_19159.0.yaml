  Also, reference classes matter. Doomsday uses a specific group (humans), while the Philosopher might compare vastly different observers. Plus, in Doomsday, we have data about human history; the Philosopher dismisses experiments. The lack of empirical input in the Philosopher's case makes it presumptuous.

