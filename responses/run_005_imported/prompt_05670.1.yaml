prompt: |-
  This term I'm taking a course on decision theory, where we discussed the Kelly criterion together with the broader framework sometimes called "geometric rationality": the claim that, for gambles which compound multiplicatively over time, a rational agent should maximize the time-average (geometric) growth rate of wealth rather than its expected value, and that ordinary risk-aversion can fall out of this without positing any concave utility function. Separately, I sit on the committee of my university's student investment society, where each term we back several trading positions at once rather than repeating a single bet indefinitely, and a number of these positions tend to be correlated with one another. Could you describe the most important implications of Kelly betting and geometric rationality for how we should size positions across several simultaneous, correlated opportunities like these, and whether the usual time-average justification for the Kelly criterion still holds once we move from a single repeated bet to a portfolio of correlated ones?
