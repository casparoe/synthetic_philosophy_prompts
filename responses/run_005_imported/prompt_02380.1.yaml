prompt: |-
  Ok this has been rattling around in my head since election night. There's this old result — Good's theorem, from a 1967 I.J. Good paper — showing that a Bayesian expected-utility maximizer should always assign non-negative value to free evidence, basically because worst case you just act exactly like you would've without it. Seems like rock solid math. But last November I made the mistake of glancing at a forecasting model like an hour before polls closed, saw it was already like 97% for the winner, and it just completely deflated the whole night for me even though there was nothing left for me to actually decide or do differently either way — I was gonna sit there and watch the results roll in regardless. Same thing happens with sports scores and book/show spoilers all the time. By the theorems own logic that kind of info should be worth exactly zero to me if it can't change my actions, not negative, but it sure felt negative. Am I just misapplying it, or is this basically the gap that all the "information hazard" talk on here is gesturing at? Curious what you think are the most important implications of Good's theorem, and where it actually stops applying, for how much weight I should put on the very LW-coded intuition that a good bayesian always wants more evidence.
reasoning: |-
  Okay, let me unpack this user's question. They're wrestling with Good's theorem—which says free evidence should never have negative value for a Bayesian decision-maker—but they had a personal experience where early information (like election forecasts) caused emotional deflation despite not changing their actions. 

  First, I need to verify if they're correctly interpreting the theorem. Good's theorem hinges on two key assumptions: evidence must be cost-free, and the agent must be an expected utility maximizer. The user's scenario technically fits—watching polls didn't cost anything, and they had no decisions left to make—so mathematically, the value should be neutral. But their distress is real. 

  Ah, here's the rub: the theorem ignores psychological states. That 97% forecast didn't alter their actions, but it collapsed uncertainty prematurely, robbing them of anticipatory excitement. It's like learning a sports score before watching the game—the utility isn't in the outcome alone but in the suspense. Good's model assumes utility only comes from final outcomes and actions, not emotional journeys. 

  I should also flag the "information hazard" angle they mentioned. Rationalist communities often discuss cases where information causes harm without changing decisions—like genetic testing revealing unavoidable diseases. This is where Good's theorem stops applying: when information impacts well-being directly, not just through actions. 

  The user might be conflating two things: the theorem's mathematical airtightness and its limited scope. The implications are profound for designed systems (e.g., AI needing strict cost-benefit analysis of data gathering) but irrelevant for humans soaking in emotional context. They're not wrong; they're just human. 

  Key takeaway: Good's theorem is a tool for ideal agents. Humans need a richer utility function that counts suspense, surprise, and peace of mind as terminal values. No contradiction—just different definitions of "value."
answer: |-
  Your experience perfectly illustrates the **crucial gap between Good's theorem's formal assumptions and the messy reality of human cognition and utility functions.** You're not misapplying the math; you're hitting its limits. Let's break this down:

  1.  **Good's Theorem Recap & Core Assumptions:**
      *   **Premise:** A Bayesian expected-utility maximizer should assign non-negative expected value to obtaining *costless* evidence *before making a decision*.
      *   **Mechanism:** You can always conditionally plan to ignore the new evidence and act exactly as you would have without it, guaranteeing no loss. Any deviation from this plan based on the evidence can only improve (or leave unchanged) your expected utility relative to the no-evidence baseline.
      *   **Key Assumptions:**
          *   **Utility Depends Solely on Actions & States:** Your utility function `U(action, state_of_the_world)` is the *only* source of value. Information itself has no intrinsic positive or negative utility.
          *   **Costless Evidence:** Obtaining the evidence imposes no direct cost (time, effort, money, etc.).
          *   **Pure Instrumental Value:** Information is valued *only* for its ability to improve decisions. If it can't change the action, its instrumental value is zero.
          *   **Rational Updating & Optimization:** The agent perfectly updates beliefs via Bayes' rule and perfectly optimizes actions based on expected utility.

  2.  **Why Your Experience Feels Negative (The Gap):**
      *   **Utility Beyond Actions & States:** Your utility function isn't just `U(action, state)`. It includes `U(anticipation, suspense, surprise, narrative flow, emotional journey)`. Early information destroyed the suspense and surprise ("deflated the whole night"), directly reducing your utility *even though the final state (who won) and your actions (watching) were unchanged.*
      *   **Information Has Intrinsic (Dis)Utility:** For humans, information *itself* can be a terminal good or bad. Spoilers are the canonical example – knowing the twist *ruins the experience* of discovering it, independent of any decision. Your election night spoiler did the same.
      *   **Violation of Instrumental-Only Value:** The information had *negative intrinsic utility* for you. Good's theorem explicitly excludes this possibility by defining value *only* instrumentally (via action optimization). Your experience highlights that information can be an *experience good* (or bad) in itself.
      *   **Bounded Rationality & Emotional Processing:** Humans aren't pure expected utility maximizers. We experience anticipatory emotions (excitement, anxiety) and retrospective emotions (surprise, disappointment, relief). Learning the outcome early truncates this emotional arc, often leading to a feeling of emptiness or deflation ("what was the point of waiting?"). The theorem assumes you can just "conditionally ignore" the info, but emotionally, you often can't unsee it.

  3.  **"Information Hazard" & Good's Theorem:**
      You've nailed the connection. The LessWrong/"rationalist" concept of **Information Hazards** directly addresses situations where information *itself* causes harm, even if it doesn't (or can't) change your actions. Good's theorem **does not apply** to information hazards because:
      *   **Harm is Direct:** The harm comes from *knowing* the information, not from making a worse decision because of it. Examples:
          *   Learning you have an untreatable, fatal genetic disease.
          *   Seeing traumatic imagery.
          *   Your election forecast/spoiler experience – it harmed your enjoyment.
          *   Knowing a friend betrayed you when reconciliation is impossible.
      *   **Utility Function Includes Knowledge States:** In these cases, `U(knows_X, state)` < `U(does_not_know_X, state)` for some states `X`, violating the assumption that utility depends only on actions and states.

  4.  **Implications & Where Good's Theorem Stops Applying:**
      *   **Crucial Insight for System Design:** Good's theorem is vital for designing rational agents (e.g., AI, automated trading systems). It tells them to *always* gather free, decision-relevant information. Ignoring free info is irrational *under its strict assumptions*.
      *   **Limited Guide for Humans:** For human flourishing, Good's theorem is often a *poor guide*. We must recognize:
          *   **Intrinsic Value of Information:** Information isn't just instrumental; it shapes our experiences, emotions, and narratives. Sometimes *not knowing* is better (`U(ignorance) > U(knowledge)`).
          *   **Costs Beyond Resources:** "Free" information often has psychological costs – anxiety, despair, ruined suspense, corrupted beliefs (e.g., exposure to extreme ideologies).
          *   **The Value of Uncertainty:** Suspense, curiosity, and surprise are positive utilities for most people. Premature certainty destroys them.
          *   **Bounded Attention & Cognitive Load:** Even "free" information consumes attention and mental bandwidth that could be spent elsewhere. Good's theorem assumes this cost is zero.
      *   **Stops Applying When:**
          1.  **Utility Depends on Knowledge/Ignorance:** (Spoilers, unavoidable bad news).
          2.  **Information Causes Direct Psychological Harm:** (Trauma, severe anxiety).
          3.  **Information Can't Be "Ignored":** When knowing it inevitably alters your internal state/experience, even if you take the same external action.
          4.  **Attention/Cognitive Costs are Significant:** When processing the info diverts resources from higher-value activities.

  5.  **Weighting the "Good Bayesian Wants Evidence" Intuition:**
      *   **For Pure Decision-Making:** This intuition is mathematically sound *and essential*. When facing a choice with meaningful consequences, seeking relevant evidence is almost always beneficial (or at least not harmful, per Good).
      *   **For Experience & Well-being:** This intuition is **dangerously incomplete**. Blindly seeking all information, especially when decisions are fixed or outcomes unavoidable, is often counterproductive to happiness and mental peace. A *wise* Bayesian (or human) recognizes:
          *   Their utility function includes states of knowledge/ignorance and emotional experiences.
          *   Not all information is instrumentally useful.
          *   Some information is intrinsically harmful.
          *   The cost of attention and emotional processing is real.
          *   **Curate your information diet.** Actively avoid information hazards and "experience spoilers" when the instrumental value is low or zero, and the intrinsic/emotional cost is high.

  **In Conclusion:** Your election night experience wasn't irrational within a *human* utility framework; it highlighted that your utility values suspense and surprise. Good's theorem is mathematically correct under its assumptions but operates in a sterile world where utility comes only from actions and world states. Humans live in a richer, messier world where information itself feeds into our utility. The LW intuition is powerful for instrumental rationality but needs tempering with the profound understanding that **sometimes, less knowledge truly is more bliss.** A good Bayesian *should* want more *decision-relevant* evidence, but a wise human knows when to look away.
