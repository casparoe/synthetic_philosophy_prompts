answer: |-
  David Lewis's account of convention provides profound insights into the norms of rationalist communities. Here's how his framework applies to your context, addressing both emergence and erosion:

  ### Core Implications for Rationalist Norms
  1. **Arbitrary but Functional Equilibrium**  
     Norms like steelmanning (presenting the strongest version of an opponent's argument) or epistemic status disclaimers ("I'm 60% confident") solve *coordination problems*:  
     - **Problem**: Avoiding unproductive debates, reducing misunderstanding, signaling credibility.  
     - **Arbitrariness**: Explicit probability scales or steelmanning formats aren't inherently optimal; they persist simply because *everyone expects them* and adjusts behavior accordingly.  

  2. **Common Knowledge as the Glue**  
     A norm holds only when:  
     - **I conform** because I expect others to conform.  
     - **I prefer to conform** *conditional on others conforming* (e.g., steelmanning only saves time if others reciprocate).  
     - **This is common knowledge**: Everyone knows everyone knows the norm exists and is followed.  

  3. **Emergence Without Agreement**  
     Conventions arise organically through:  
     - **Precedents**: Early members (e.g., forum founders) consistently steelman arguments.  
     - **Salience**: Their behavior becomes a focal point.  
     - **Mutual Adjustment**: Newcomers imitate to coordinate, amplifying expectations.  
     - *No founding contract needed*—repeated successful coordination solidifies the norm.  

  ### Why Norms Erode: Lewis's Predictions  
  1. **Scaling and Newcomer Influx**  
     - **Common Knowledge Breakdown**: New members lack history observing the norm. They may:  
       - Misinterpret expectations (e.g., view epistemic disclaimers as weakness).  
       - Defect (skip steelmanning) to save effort, assuming others won't notice.  
     - **Preference Mismatch**: Those joining for debate (not truth-seeking) may *disprefer* conforming even if others do (e.g., ad hominem attacks "win" faster).  

  2. **Shifting Incentives**  
     - As communities grow, coordination problems change:  
       - **Diluted Preferences**: Critical mass preferring coordination diminishes.  
       - **Alternative Equilibria Emerge**: e.g., "Hot Takes" may replace measured discussion if they gain salience among newcomers.  

  3. **Fragility of Arbitrariness**  
     - If a functionally equivalent norm emerges (e.g., "confidence tags" instead of percentages), the *incumbent norm can collapse abruptly* once expectations shift.  

  ### Preserving Conventions: Lewisian Solutions  
  1. **Reinforce Common Knowledge**  
     - **Explicit Signaling**: Regularly restate norms' *purpose* (e.g., "Steelmanning saves us 100 hrs/week").  
     - **Metanorm Enforcement**: Publicly correct violations to signal shared expectations.  

  2. **Manage Growth**  
     - **Onboarding Rituals**: Tutorials forcing practice (e.g., "Write a steelman for your *own* view").  
     - **Critical Mass Control**: Limit influx until newcomers absorb expectations.  

  3. **Anchor Salience**  
     - **Founder Presence**: Consistent modeling by high-status members.  
     - **Artifacts**: Auto-prompting epistemic tags in posts.  

  **Key Takeaway**: Rationalist norms are *fragile equilibria*. They thrive only while:  
  - The core coordination problem (e.g., efficient truth-seeking) remains salient.  
  - Participants share a *conditional preference* for cooperation.  
  - Common knowledge of conformity is actively maintained.  

  Erosion isn't mere "decline"—it's a *coordination failure* when expectations unravel. Proactive reinforcement of mutual expectations is essential at scale.
