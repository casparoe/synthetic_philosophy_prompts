answer: |-
  That's a fantastic (and classic!) phil of science argument. Your friend is right about the core history and problems, but the intuition *does* survive, albeit in a more complex way. Let's break down Popper's attempt, why it failed logically, and the deeper issue with language.

  **1. Popper's Original Idea (Verisimilitude):**

  Popper wanted to capture the intuition you have: Newton *is* closer to the truth than Aristotle, even though both are strictly false. His definition (roughly) was:

  *   The **truth content** of a theory T is the set of all *true* logical consequences of T.
  *   The **falsity content** of a theory T is the set of all *false* logical consequences of T.
  *   Theory A has **more verisimilitude** than Theory B if:
      *   A's truth content includes all of B's truth content, *and*
      *   B's falsity content includes all of A's falsity content,
      *   ...and at least one of these inclusions is *proper* (i.e., A has *more* truth or *less* falsity than B).

  This seems sensible. A better theory should tell us more true things and/or fewer false things.

  **2. The Tichý-Miller Bomb (The Toy Weather Example):**

  Imagine a *very* simple world described by only 3 basic, independent facts (atomic propositions). Let's say the weather:

  1.  `R`: It is Rainy. (True in the actual world)
  2.  `W`: It is Windy. (True in the actual world)
  3.  `H`: It is Hot. (False in the actual world - it's actually Cold)

  The **Complete Truth** (`T`) is: `R & W & ~H` (Rainy, Windy, Not Hot).

  Now, consider two **false** competing theories:

  *   **Theory A:** `R & ~W & ~H` (Rainy, Not Windy, Not Hot) - *Wrong about Wind.*
  *   **Theory B:** `~R & W & H` (Not Rainy, Windy, Hot) - *Wrong about Rain and Heat.*

  *Intuitively, Theory A seems closer to the truth:* It gets Rain and Heat right, only missing Wind. Theory B gets *only* Wind right and misses both Rain and Heat.

  **But does Popper's definition agree? Let's calculate:**

  *   **Truth Content (True Consequences):**
      *   `T` (Truth): Consequences include `R`, `W`, `~H`, `R & W`, `R & ~H`, `W & ~H`, `R & W & ~H`, etc. (All true combos).
      *   `A` (`R & ~W & ~H`): True consequences? `R` is true. `~H` is true. `R & ~H` is true. `~W` is *false* (it *is* windy), so `~W` and anything implying `~W` as *necessary* isn't a true consequence. Crucially, `W` (truth) is **NOT** a consequence of A. A *entails* `~W`, which is false. So A's truth content is {`R`, `~H`, `R & ~H`, ...}.
      *   `B` (`~R & W & H`): True consequences? `W` is true. `~R` is *false*. `H` is *false*. `W` is true, but `W & H` is false. The only clear true consequence is `W` itself (and maybe tautologies). So B's truth content is {`W`, ...}.

  *   **Falsity Content (False Consequences):**
      *   `T`: None (it's truth).
      *   `A` (`R & ~W & ~H`): Entails `~W`. Since `W` is true, `~W` is false. Also entails `R & ~W`, which is false. Etc. Falsity content includes `~W`, `R & ~W`, `~W & ~H`, etc.
      *   `B` (`~R & W & H`): Entails `~R` (false), `H` (false), `~R & W` (false), `W & H` (false), `~R & H` (false), `~R & W & H` (false). Falsity content is large: {`~R`, `H`, `~R & W`, `W & H`, `~R & H`, `~R & W & H`, ...}.

  **Now, apply Popper's Definition: Compare A and B.**

  *   **Does A's truth content include ALL of B's truth content?** A's truth content: {`R`, `~H`, `R & ~H`, ...}. B's truth content: {`W`, ...}. Is `W` (B's main truth) in A's truth content? **NO!** A entails `~W`, not `W`. So A *does not* contain all of B's truth content. Popper's first condition fails.
  *   **Does B's falsity content include ALL of A's falsity content?** A's falsity content: {`~W`, `R & ~W`, ...}. B's falsity content: {`~R`, `H`, `~R & W`, ...}. Is `~W` (A's main falsehood) in B's falsity content? B entails `W`, not `~W`. `~W` is not a consequence of B. So `~W` is **NOT** in B's falsity content. Popper's second condition fails.

  **The Killer Blow:** Tichý (1974) and Miller (1974) independently proved a general theorem: **For any two false theories that are not the truth itself, it's logically impossible for one to have both more truth content AND less falsity content than the other in the way Popper required.** The conditions are mutually exclusive for false theories. You can't satisfy both conditions at once. Popper's definition *only* works when comparing the truth to a false theory. When comparing *two false theories*, it inevitably fails, just like in the weather example, even when one is intuitively much better.

  **3. The Second Problem: Predicate Dependence (Language Relativity)**

  This is where it gets even trickier and more profound. Your friend mentioned redefining predicates. Miller showed this with the weather example.

  *   **Original Language:** `R` (Rainy), `W` (Windy), `H` (Hot). Truth: `R & W & ~H`.
  *   Theory A (`R & ~W & ~H`) seemed intuitively closer than Theory B (`~R & W & H`).

  Now, **redefine the predicates.** Keep `R` (Rainy), but swap `W` and `H`:

  *   Let `X = W` (Windy) -- same as before.
  *   Let `Y = ~H` (Not Hot, i.e., Cold). *This is the key redefinition.*

  **Express everything in terms of `R`, `X` (`W`), and `Y` (`~H`):**

  *   Original Truth (`R & W & ~H`) becomes: `R & X & Y` (since `W = X`, `~H = Y`)
  *   Theory A (`R & ~W & ~H`) becomes: `R & ~X & Y` (since `~W = ~X`, `~H = Y`)
  *   Theory B (`~R & W & H`) becomes: `~R & X & ~Y` (since `W = X`, `H = ~Y`)

  **Now, what's the *actual* world state described in the new language?** Remember the facts: Rainy (True), Windy (True), Hot (False). So:
  *   `R` = True (Rainy)
  *   `X` (`W`) = True (Windy)
  *   `Y` (`~H`) = True (Not Hot, i.e., Cold)

  **So the Truth is still `R & X & Y`.**

  **Now, evaluate the theories in the *new* language:**

  *   **Theory A (now `R & ~X & Y`):** Says Rainy (`R`=T), Not Windy (`~X` i.e., `W`=F), Cold (`Y`=T). *Actually:* Windy is True (`X`=T). So A is wrong about Wind (`X`). It gets `R` and `Y` right.
  *   **Theory B (now `~R & X & ~Y`):** Says Not Rainy (`~R` i.e., `R`=F), Windy (`X`=T), Hot (`~Y` i.e., `H`=T). *Actually:* Rainy is True (`R`=T), Hot is False (`H`=F, so `~Y`=F). So B is wrong about Rain (`R`) and Heat (`~Y`/`H`). It *only* gets Wind (`X`) right.

  **Intuition Flips!** In the *new* language (`R, X, Y`), Theory B (`~R & X & ~Y`) now looks intuitively *closer* to the truth (`R & X & Y`) than Theory A (`R & ~X & Y`) does!
  *   B gets `X` (Windy) right, while A gets `X` wrong.
  *   B gets `R` wrong (says no rain), A gets `R` right (says rain).
  *   B gets `Y` wrong (says `~Y`/Hot), A gets `Y` right (says Cold).
  *   So both get 1 right and 2 wrong? But crucially, B's correct `X` seems more "central" or matches the truth on a different dimension now. The intuitive assessment has reversed!

  **The Point:** How we carve up the world with our basic concepts (`R, W, H` vs. `R, X, Y`) directly determines which *false* theory appears closer to the *truth* under simple counting or likeness measures. There's no "God's Eye" set of basic predicates. Verisimilitude, defined solely on the *logical structure* of the theories and their consequences, is **language-dependent**. This is a *very* serious problem for any formal definition based on truth/falsity of consequences or simple similarity metrics.

  **4. Where Does This Leave Us? Does the Intuition Survive?**

  *   **Popper's Original Definition:** It's dead. Tichý and Miller killed it conclusively. It doesn't work for comparing false theories.
  *   **The Predicate Problem:** This is deep and unresolved. It shows that *any* purely syntactic/logical definition (counting consequences, measuring distances between propositional "states") is vulnerable to how we describe the world. It challenges the idea that "closeness to truth" is a purely objective, language-independent relation between theories and the world.
  *   **Survival of the Intuition:** **Absolutely, yes.** The intuition that Newton is closer than Aristotle is too powerful and scientifically important to abandon. Philosophers haven't given up; they've just gotten more sophisticated and nuanced.
      *   **Refined Approaches:** Later work (e.g., Ilkka Niiniluoto, Graham Oddie, Pavel Tichý himself) moved towards "**likeness**" or "**similarity**" approaches. Instead of just counting true/false consequences, they try to define how *similar* a theory's *models* (possible worlds it allows) are to the *actual* world. Aristotle's world-model is very different from ours, Newton's is much closer, Einstein's is closer still. This incorporates the intuitive idea of "direction" and "degree" of error.
      *   **Pragmatic Acceptance:** Many philosophers and *most* scientists use the concept **informally and pragmatically**. We judge progress by increased explanatory/predictive power, unifying diverse phenomena, leading to new discoveries, and technological application. Newton does all these things vastly better than Aristotle and only slightly worse than GR in its domain. This pragmatic success *justifies* calling it "closer to the truth," even if a perfect formal, language-independent definition remains elusive.
      *   **Focus on Progress:** Instead of a static "closeness," many focus on the *process* of increasing verisimilitude through theory change, even if we can't perfectly measure the absolute "distance."
      *   **Acknowledging the Difficulty:** The field acknowledges the Tichý-Miller results and the language-dependence problem as serious hurdles, not fatal blows to the *idea* itself. It means formalizing it is incredibly hard, not that the intuition is meaningless.

  **In Conclusion:**

  Your friend is spot-on about the technical demise of Popper's specific definition (Tichý/Miller) and the seriousness of the language-dependence problem (Miller). These are major results in phil of science. However, the core intuition that scientific progress often involves getting *closer* to the truth, and that Newton is vastly closer than Aristotle, remains robust. It survives not because the technical problems are ignored, but because:

  1.  Later formal approaches try to capture similarity more directly.
  2.  The pragmatic and empirical success of theories like Newton provides overwhelming *practical* justification for the intuition.
  3.  Abandoning the idea entirely makes scientific progress incomprehensible.

  So, while Popper's specific formula broke, and formalizing "closeness" is fraught with deep philosophical challenges, the idea itself is very much alive and well, both informally in science and as a target for more sophisticated philosophical accounts. Your intuition is sound, even if Popper's initial formalization wasn't. The argument continues!
