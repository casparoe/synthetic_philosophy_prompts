  First, I need to reconstruct Leibniz's view accurately. His "complete individual concept" (CIC) is key: every individual is defined by a concept containing all their properties across time. The Identity of Indiscernibles means no two things share all properties. Possible worlds for Leibniz are ideas in God's mind, not concrete realities like in Lewis. 

