  Resolving this: Leibniz isn't a Lewis-style counterpart theorist because counterparts imply similarity without identity, but for Leibniz, similarity is irrelevant—only full concept-match matters. He also isn't Kripkean because Kripke allows *this same individual* to have different properties across worlds, while Leibniz's CIC forbids that. So the dichotomy fails. Leibniz has a third view: individuals are world-bound by definition. 

