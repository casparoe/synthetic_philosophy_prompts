  ### Strawson's View: What Both Are Missing
  Strawson would argue **both overlook the core purpose of reactive attitudes** (e.g., resentment, apology) in sustaining interpersonal relationships:  
  - **Dev** misses that reactive attitudes aren’t solely about *fault* but about *mutual recognition*. By reducing Jordan’s panic to a "seizure-like" exemption, he risks treating Jordan as an object (outside moral community), undermining friendship’s reciprocity. An apology matters precisely because it reaffirms Jordan’s participant status despite the excuse.  
  - **Priya** misses that resentment must be *tempered by understanding*. While her demand for backup is reasonable, Strawson warns against treating responsibility as purely transactional. The panic attack’s unchosen nature should modulate resentment—not erase it, but frame it within compassion for Jordan’s ongoing struggle.  

  **Strawson’s key insight**: Responsibility practices aren’t metaphysical ledger-keeping but tools to maintain "the web of human relationships." Both should ask: *Does my reaction preserve or fray this friendship?*  
  - For Dev: Exempting Jordan entirely denies his agency and Priya’s legitimate hurt.  
  - For Priya: Insisting on backup without acknowledging the attack’s gravity risks pathologizing Jordan.  

  Balance lies in *conditional resentment* (targeting the planning failure) paired with *willingness to forgive* (for the attack itself)—a dance of holding accountable while staying engaged.
