   Strawson's "Freedom and Resentment" argues that moral responsibility is not about metaphysical free will but about our practices of holding each other accountable through reactive attitudes (like resentment, gratitude, forgiveness). These attitudes are part of our interpersonal relationships. We sometimes modify these attitudes when we encounter excusing or exempting conditions.

   Excusing conditions: show that the agent didn't do the thing we thought (e.g., it was an accident) or couldn't have done otherwise in a way that doesn't challenge their status as a responsible agent (like being pushed). 
   Exempting conditions: show that the agent is not a full participant in the moral community (e.g., being a child, having a severe mental disorder).

