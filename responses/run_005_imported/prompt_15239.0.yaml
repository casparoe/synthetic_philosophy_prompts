answer: |-
  Here's a toast weaving her life's work into a heartfelt tribute that works for both audiences, ending with a clean, resonant line for the glasses to rise:

  **(Clink glass gently, warm smile)**

  "Alright, confession time: when they asked me to toast Professor [Advisor's Name], my first thought was, 'Great! Finally, a room where I can *really* dig into the nuances of Kim's causal exclusion argument without getting glazed-over looks!'"

  *(Pause for knowing chuckles from philosophers, friendly confusion from others)*

  "...Then I remembered her husband, [Husband's Name], has probably heard the word 'epiphenomenalism' more times over Thanksgiving turkey than anyone outside a metaphysics seminar. And he *still* smiles at her when she says it. That, right there, might be the most compelling argument *against* epiphenomenalism I've ever seen."

  *(Laughter, especially from family/friends)*

  "Seriously, though. For thirty-five years, [Advisor's Name] has wrestled with one of philosophy's toughest puzzles: **Can the things that matter most to us – our thoughts, our choices, our feelings – actually *do* anything in the world?** Or are they just ghostly echoes, powerless shadows cast by the grinding gears of physics underneath?"

  *(Brief pause - setting the stakes simply)*

  "The worry goes like this: if every thought I have is built on a specific, complex brain state... and that brain state is already perfectly capable of causing my actions all by itself... then what room is left for my *thoughts* to *really* cause anything? Are they just along for the ride? Superfluous? Epiphenomenal?"

  *(Nods from philosophers; looks of dawning understanding from others - "Oh, THAT'S what she meant at Thanksgiving!")*

  "[Advisor's Name] never bought that. Not for a second. And she didn't take the easy way out. She didn't say thoughts were *just* brain chemicals. She fiercely defended the idea that mental things – like pain, or a belief, or... profound gratitude – are real in their own right, precisely *because* they can be realized in so many different ways. Pain isn't *just* neuron A firing; it's a whole pattern, a state that matters."

  *(Here comes the core, using her framework accessibly)*

  "Her brilliant move was arguing that **sometimes, the *bigger* picture – the mental state, the feeling, the intention – isn't just a noisy side effect of the tiny physical details. It's the *actual*, essential cause.** Think of it like... 'redness' causing a pigeon to peck."

  *(Brief, warm chuckle - referencing her seminar)*

  "The pigeon isn't reacting to one impossibly specific wavelength of light, pixel-perfect. It's reacting to *redness* itself – a broader, more meaningful category. **The mental property isn't lost in the microscopic shuffle; it's the proportionate, fitting level where real causation happens.** It's the *spotlight*, not just the individual photons. She showed how the mind, properly understood, isn't screened off; it shines through."

  *(Pivot to the personal - the emotional payoff)*

  "And *this* is why I can stand here and say, with complete philosophical sincerity alongside deep personal feeling, that **Professor [Advisor's Name] didn't just tinker with my brain states. She changed my *mind*. She changed my *life*.**"

  *(Emphasize this)*

  "According to her own hard-won view, the ideas she shared, the challenges she posed, the encouragement she gave – these weren't epiphenomenal froth bubbling on top of neural firings. They were **the real, proportionate causes** of the choices I made, the paths I took, even the work I do now. Her influence wasn't redundant; it was essential. Her mentorship wasn't a shadow; it was the shaping force."

  *(Look directly at her)*

  "[Advisor's Name], for thirty-five years, you've argued that the mental *matters*, that it *does* real work in the world. Well, look around this room. Look at the careers launched, the ideas sparked, the lives touched – including mine. **This gathering, this gratitude, this *effect* you've had on all of us... is the living proof your argument was right all along.**"

  *(Raise glass high)*

  **"So, to Professor [Advisor's Name]: May your retirement be as richly causal as your career has been. Thank you for proving, beyond any doubt, that great minds – and great mentors – make a *real* difference. Cheers!"**

  **(Hold eye contact, big smile, "Cheers!" from the crowd)**

  ---

  **Why this works:**

  1.  **Accessible Core Analogy:** "Redness" vs. "exact shade" is concrete and visual. The "spotlight vs. photons" reinforces it. Non-philosophers grasp the *concept* of causation at different levels.
  2.  **Names the Problem (Simply):** Explains "epiphenomenalism" in one clear sentence ("powerless shadows... ghostly echoes"). The Thanksgiving line makes it relatable and humorous.
  3.  **Uses *Her* Solution:** Explicitly ties the "proportionate cause" and "bigger picture" concepts (Yablo-ish determinables) to her work without needing jargon. Philosophers hear the fidelity; others get the gist.
  4.  **Earns the "Changed My Life" Claim:** Directly connects her *philosophical* argument about mental causation to the *personal reality* of her mentorship's impact. This is the core "argument" of the toast. It shows her work validates the sentiment.
  5.  **Warmth & Humor:** Opens with self-deprecating humor, includes the husband/Thanksgiving bit, focuses on her impact and the room's emotion. The "pigeon" is a warm, specific callback.
  6.  **Resonant Ending:** The final lines explicitly state that the room *is* the proof of her argument. The toast line ("richly causal," "make a *real* difference") perfectly encapsulates her life's work in celebratory terms, with the double meaning clear to philosophers and uplifting for everyone.
  7.  **Pacing:** Should fit comfortably within 5 minutes. Key philosophical points are made succinctly, balanced with personal moments and the build to the toast.

  This toast honors her intellect, validates her life's work philosophically *and* emotionally, includes everyone in the room, and ends on a genuinely celebratory note that perfectly encapsulates her struggle against epiphenomenalism. Good luck!
