answer: |-
  You've done an excellent job grappling with complex philosophical arguments, but your summary **oversimplifies and flattens a crucial distinction**, particularly regarding Scanlon and the broader literature. While Hume *does* anchor the obligation heavily in truthfulness and the avoidance of false representation, Scanlon (and others) explicitly move beyond this to ground promissory obligation in **reliance, expectations, and the prevention of harm** – **even when no initial dishonesty exists.**

  Here's a breakdown:

  1.  **Hume: Convention, Truthfulness, and the Artificial Virtue:**
      *   Hume views promising as an *artificial* virtue – a social convention invented to solve cooperation problems. The moral obligation arises *from* the convention itself.
      *   **The Core Issue (for Hume):** When you promise, you use a special linguistic/social device ("I promise") designed to create a firm expectation in the hearer. Breaking the promise *retroactively* makes your initial utterance a *false representation* of your intention at that moment. It becomes a kind of lie *ex post facto*, undermining the social convention built on trust in these performative utterances.
      *   **Relevance to Your Case:** If your friend was genuinely sincere *at the time of promising*, Hume *might* struggle to find the same core moral wrongness in her later change of mind, beyond perhaps a charge of imprudence or weakness. Her action harms the *general convention* by making promises seem less reliable, but the *direct* wrong *to you* is less clear-cut in his framework if initial sincerity is granted. Your feeling of betrayal might stem more from the disruption of expectations and the harm caused, which Hume acknowledges but doesn't center as *the* moral wrong.

  2.  **Scanlon: Reliance, Expectations, and the Prevention of Harm:**
      *   Scanlon's account (**Principle F** in *What We Owe to Each Other*) is fundamentally different. The wrongness of breaking a promise **does not primarily stem from dishonesty about the past intention.**
      *   **The Core Obligation:** When A makes a promise to B, A intentionally invokes a practice that leads B to form expectations and potentially rely on A's future action. A thereby incurs an obligation to B to *prevent the harm* that B would suffer due to that reliance if A fails to perform.
      *   **Key Elements:**
          *   **Intentional Invocation:** Your friend knowingly used the language/context of commitment ("co-signing the lease" agreement), invoking a promissory norm.
          *   **Creation of Expectation & Reliance:** You reasonably formed the expectation that she would co-sign. You relied on this by planning your housing around it, likely refraining from seeking alternatives earlier.
          *   **Harm from Non-Performance:** Her change of mind caused you concrete harm – the "scrambling," stress, potential financial loss or worse housing options, and the betrayal of trust.
          *   **The Moral Wrong:** The wrong lies in **failing to prevent this reliance-based harm** that she *foreseeably caused* by creating the expectation and allowing you to rely. She had a duty, incurred by creating this expectation, to either perform or give you sufficient warning *before* you incurred significant reliance costs (which happened when she waited until weeks before signing).
      *   **Relevance to Your Case:** **Scanlon strongly supports your judgment that she wronged you.** Her initial sincerity is irrelevant to the core wrong. The wrong occurred when she failed to uphold the obligation created by *your* reasonable reliance on her commitment, causing you harm. Her finding a cheaper studio doesn't negate the harm caused to you by her withdrawal after you had relied.

  3.  **Beyond Lying: The Broader Literature:**
      *   **Reliance Theories (like Scanlon's):** Dominant in contemporary philosophy. They explicitly reject the idea that promissory obligation reduces to truthfulness about past intentions. The focus is on the *forward-looking* obligation created by inducing reliance and the harm caused by disappointing it.
      *   **Expectation Theories:** Similar to reliance, but emphasize the creation of a legitimate expectation as the basis of the obligation, even if actual reliance hasn't yet occurred (though reliance often follows).
      *   **Social Practice/Conventionalist Theories (Humean descendants):** While emphasizing convention, many modern versions incorporate the *reliance and harm* aspects as *reasons why* the convention exists and is morally important. The wrong isn't *just* undermining the convention; it's also the harm done *through* that convention to the specific promisee.
      *   **"Assurance" Views:** Some argue a promise gives the promisee a right to rely and an assurance of performance. Breaking it violates that granted right/assurance.

  **Conclusion:**

  *   **Hume:** Your summary is largely fair for Hume. His focus *is* on the convention and the retroactive false representation. He might struggle to find a distinct *wrong to you* beyond the general weakening of the convention if initial sincerity is granted, though he'd likely condemn the imprudence and the harm caused.
  *   **Scanlon & Reliance/Expectation Theories:** **This is where your summary is significantly incomplete.** Scanlon *explicitly* grounds the wrongness in the harm caused by disappointing reasonable reliance induced by the promise. Initial sincerity is beside the point. The moral failing occurs when the promisor fails to prevent the foreseeable harm their induced reliance causes. **On Scanlon's view (and similar reliance/expectation views), your friend clearly wronged you.** She created an expectation, allowed you to rely on it (costing you time and opportunity to secure alternatives), and then withdrew, causing you harm without sufficient notice to mitigate that reliance.
  *   **Your Intuition:** Your sense of betrayal is **perfectly philosophically defensible** under Scanlonian and reliance-based frameworks. It arises not (necessarily) from suspected past dishonesty, but from the present harm caused by the broken commitment after reasonable reliance. The philosophy *does* underwrite your judgment.

  You are right that if the obligation *only* stemmed from truthfulness about past intentions, her sincerity would exonerate her. But significant parts of the literature, especially contemporary work following Scanlon, ground the obligation firmly in the *consequences* of creating expectations and inducing reliance – consequences your friend is responsible for, regardless of her initial state of mind. Her wrong wasn't lying; it was **failing to uphold the duty she incurred when she led you to rely on her.**
