prompt: |-
  I'm the customer representative on my genetic-testing company's science communication ethics panel, the only non-scientist on it; everything I know about genetics I've learned on my own since joining. We're reviewing wording for a new traits report that marketing wants to open with "This is your personal genetic code—here's what yours says about your risk of anxiety and depression," because it tested best with users. Company policy only requires consumer-facing language to be "scientifically accurate and not misleading." Our staff geneticist objects that DNA isn't a code with a meaning already built into it: the meaning, she says, is something we impose afterward, and the phrasing will leave customers feeling these traits are simply fixed and unchangeable. Marketing responds that "genetic code" is standard scientific usage, not their invention, and that hedging it would only confuse people. Please draft the short recommendation memo I'll bring to the panel on Friday: say concretely what we should require of this report's language, take a real position on whether "code" is literally accurate here or just a convenient metaphor, and treat whichever side loses fairly rather than dismissing it as naive or pedantic.
reasoning: |-
  Okay, the user is a customer rep on a genetics company's ethics panel, and they're the only non-scientist there. They've self-taught genetics since joining. The issue is about marketing wanting to use "This is your personal genetic code—here's what yours says about your risk of anxiety and depression" for a new traits report because it tested well with users. The staff geneticist objects, saying DNA isn't a "code" with inherent meaning—it's something we impose later—and worries customers will think these traits are fixed. Marketing argues "genetic code" is standard scientific term and hedging would confuse people. 

  The user needs to draft a short recommendation memo for the panel. The memo must: 1) Say concretely what the report language should require, 2) Take a real position on whether "code" is literal or metaphorical, and 3) Treat the losing side fairly without calling them naive or pedantic. 

  Hmm, the core tension is between scientific precision (geneticist's view) and marketing effectiveness (marketing's view). The user is in a tricky spot as the only non-scientist, so their memo needs to bridge both worlds. They probably want to show they understand the science while prioritizing consumer clarity and ethics. 

  First, unpacking "genetic code": Scientifically, it's a metaphor—DNA isn't literally a code like software; it's a chemical template. The geneticist is right that meaning comes from how we interpret it (epigenetics, environment etc.), and calling it a "code" risks genetic determinism. But marketing isn't wrong that "genetic code" is widely used in science communication, even if oversimplified. 

  The real risk here is psychological: If customers think anxiety/depression are "coded" and unchangeable, it could harm mental health outcomes. That’s ethically messy. The policy says language must be "scientifically accurate and not misleading"—so even if "code" is technically accurate jargon, its implication might be misleading. 

  For the memo, I’d suggest:  
  - Acknowledge both sides fairly: Marketing’s point about common usage is valid, but the geneticist’s concern about determinism is critical.  
  - Recommend replacing "code" with "information" or "data" to avoid unintended implications.  
  - Add context to clarify that DNA isn’t destiny—e.g., "influenced by" not "determined by."  
  - Position "code" as a metaphor, not literal, to respect the science.  

  The user’s deeper need? Probably to assert their role as an ethical compass without overstepping as a non-expert. They’ll want the memo to feel balanced but decisive, showing they’ve grasped the nuances. And crucially, avoid alienating either side—marketing needs buy-in for engagement, scientists need integrity. 

  Side note: The user’s autodidact background is impressive! Their perspective as a non-scientist might actually help spot oversimplifications that experts overlook. Leaning into that could strengthen their recommendation.
answer: |-
  **MEMORANDUM**  
  To: Science Communication Ethics Panel  
  From: [Your Name], Customer Representative  
  Date: [Date]  
  Subject: Recommendation on "Genetic Code" Language for Traits Report  

  ### **Recommended Language Requirement**  
  Marketing’s proposed opening line ("This is your personal genetic code—here’s what yours says about your risk of anxiety and depression") **should be revised** to meet our policy of "scientifically accurate and not misleading." Replace it with:  
  > **"This report explores your unique genetic data—here’s how it relates to your potential risk factors for anxiety and depression."**  

  Additionally, the report **must include** this contextual disclaimer upfront:  
  > *"While genetics can influence anxiety and depression, these conditions are shaped by many factors—including environment, lifestyle, and personal experiences. Your results reflect probabilities, not certainties, and do not determine your future health."*  

  ### **Position on "Code" Terminology**  
  1. **"Genetic code" is scientifically valid as a metaphor**, not a literal claim.  
     - *Supporting Marketing’s view:* "Genetic code" is established shorthand for DNA’s role in protein synthesis (e.g., the triplet codon system). It is widely used in peer-reviewed literature and public science communication.  
     - *Limitation:* As our geneticist notes, DNA is not a "code" in the rigid sense of a prewritten blueprint. Its "meaning" depends on gene-environment interactions—epigenetic changes, stressors, etc.—that dynamically influence outcomes.  

  2. **However, in consumer-facing reports, "code" risks misinterpretation**.  
     - Anxiety/depression are complex traits influenced by non-genetic factors. "Your code says..." implies DNA unilaterally determines outcomes, contradicting current polygenic risk score science.  
     - Consumers may infer genetic fatalism ("My code doomed me"), which is inaccurate and potentially harmful.  

  ### **Fair Treatment of Both Positions**  
  - **Marketing’s argument is not naive**: Prioritizing user comprehension is essential. Their user testing data highlights a need for simplicity, and "genetic code" is a familiar hook. We must balance accessibility with integrity.  
  - **The geneticist’s concern is not pedantic**: Precision matters in mental health contexts. Downplaying the role of non-genetic factors could mislead vulnerable customers. Her objection reflects best practices in genetic counseling (e.g., ACMG guidelines).  

  ### **Conclusion**  
  Our responsibility is to **educate, not oversimplify**. Using "genetic data" instead of "code" maintains scientific accuracy while avoiding deterministic framing. The added context empowers customers to interpret results responsibly. This approach honors both marketing’s need for clarity and our geneticist’s ethical duty to prevent harm.  

  **Recommended Vote**: Approve revised language with mandatory contextual disclaimer.  

  ---  
  **Rationale for Balance**:  
  - Marketing’s user-centric approach ensures reports resonate, but genetics requires nuance.  
  - The geneticist’s caution protects consumers from unintended distress, aligning with our ethical mandate.  
  - This compromise respects both goals: engaging communication *and* scientific rigor.
