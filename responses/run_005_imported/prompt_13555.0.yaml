prompt: |-
  Ok, this is a bit of a weird combo but bear with me. Im getting married in October and my fiancé and I have spent the last month arguing about which wedding stuff is "just a convention" we can drop without anyone caring (unity candle, bouquet toss, whatever) versus stuff that would actually feel wrong to skip, and it sent me down a David Lewis rabbit hole I haven't touched since undergrad. Separately but also not-so-separately: I'm TAing a social ontology seminar this term and just got my first real stack of short-answer exams to grade, and it suddenly feels like a much bigger deal than when all this was abstract to me.

  Can you grade this one? I'd like an actual score out of 20, plus point-by-point comments justifying it — a short rubric (JSON's fine) would be great too. It's my first batch of these to grade so I'd rather over-explain my reasoning than hand-wave it.

  Question: "Lewis defines a convention roughly as a regularity R in action such that it is common knowledge in a population that everyone conforms to R, everyone expects everyone else to conform to R, and everyone prefers to conform to R given that everyone else does, because the situation is a recurring coordination problem with more than one possible equilibrium. Explain (a) why Lewis needs common knowledge rather than mere mutual knowledge here, and (b) why he denies that conventions arise from agreement. Illustrate with an example of your own (not the driving-side-of-the-road one from lecture)."

  Student answer: "For Lewis a convention is a self-perpetuating solution to a recurring coordination problem — a situation with two or more equilibria where what matters is that everyone does the same thing, not which thing they do. He needs common knowledge rather than mutual knowledge because mutual knowledge just means I know P and you know P, while coordinating requires the whole hierarchy — I know you know, you know I know, I know you know I know, and so on — otherwise neither of us can be fully confident the other will actually conform, which undercuts the whole point of making conformity rational for each person individually. Once the regularity is established, precedent does the rest of the work: each new instance of everyone conforming gives everyone fresh reason to expect conformity next time, so nothing needs a central enforcer. This is really Lewis cashing out what an implicit agreement looks like — nobody ever calls a meeting to settle these things, so the 'agreement' has to be tacit, built up through repeated interaction instead of spoken aloud, which is also why the same problem can get solved differently in different populations. A decent original example is the little routine where two people arrive at a doorway together and one says 'after you' and steps back — nothing makes either person the one who should go first, but once that pattern is set, everyone conforms to it and expects everyone else to as well."
reasoning: |-
  Alright, the user is in a bit of a unique situation. They're getting married and having arguments with their fiancé about which wedding traditions to keep or drop, which led them to revisit David Lewis's conventions. At the same time, they're TAing a social ontology seminar and just got their first batch of exams to grade. They want me to grade one specific student answer, provide a score out of 20, and give detailed feedback with a rubric.

  The question has two parts: (a) why Lewis needs common knowledge over mutual knowledge, and (b) why he denies conventions arise from agreement. The student must also provide an original example.

  First, I need to recall Lewis's definition. Conventions solve coordination problems through regularities, common knowledge, and preference for conformity. The key difference between mutual and common knowledge is the infinite hierarchy of beliefs. Mutual knowledge is just "I know P and you know P," but common knowledge adds "I know that you know, you know that I know," and so on. Without this, coordination can break down because each person isn't sure the other knows they know.

  For part (b), Lewis argues conventions don't come from agreements but from precedent. Repeated interactions build expectations, making agreements unnecessary. The student's example of the doorway routine is good—it's a coordination problem with no inherent reason for who goes first, but once a pattern forms, it becomes a convention.

  Now, evaluating the student's answer. They correctly explain the hierarchy of common knowledge and why it's necessary for confidence in conformity. They also mention precedent replacing the need for agreements and how different populations develop different conventions. The doorway example fits well, though it could be more detailed. The phrase "Lewis cashing out what an implicit agreement looks like" might be slightly misleading, as Lewis avoids the term "agreement" entirely.

  Strengths: Accurate explanation of common vs. mutual knowledge, correct reasoning for precedent over agreement, valid original example.

  Weaknesses: Minor phrasing issues that could imply conventions are agreements, and the example could be more fleshed out. The answer is concise but meets the requirements.

  Rubric-wise, I'll structure it with points for each part: common knowledge explanation, agreement denial, example, and overall clarity. Deducting slightly for the agreement phrasing and example depth. Total score: 17/20 seems fair, with specific feedback on where they lost points and how to improve.
