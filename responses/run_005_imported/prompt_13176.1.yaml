prompt: |-
  I'm on the incident-review board at the software company I work for, and we just finished writing up a nasty one: a multi-hour outage that kicked off when an on-call engineer got paged about weird traffic at 2am and snoozed the alert for 45 minutes, because that particular alert had cried wolf all week. Except once you actually dig into it, that's not the only place things could've gone differently -- a seperate team had a ticket open for three months flagging that the service in question had no rate limiting, and it just never got prioritized; the reason it never got prioritized is that the roadmap review last quarter explicitly deprioritized "hardening" work in favor of a launch deadline; and the reason the on-call engineer was covering three services solo that night instead of splitting the load is a hiring freeze from earlier this year. For literally every one of those, it's true that if that person or team had done the thing they didn't do, the outage probably doesn't happen, or is a lot smaller -- so by a plain "but for this, it wouldn't have happened" test, they're all causes.

  The postmortem doc is supposed to name actual root causes / contributing factors, not just list everyone who touched the situation, so it can drive real follow-up work -- and the board is stuck on where to stop. Some people want to stop at the on-call engineer's snooze since that's the proximate thing; others think that's just scapegoating someone for decisions made way above their pay grade, and want the roadmap call, or even the hiring freeze, named as the real root cause -- but then someone reasonably points out that if we're willing to go back that far, why stop there and not blame whoever approved the budget behind the freeze, and so on forever. My partner, who's a lawyer, says this is basically the same fight they have over proximate cause, which did not make me feel better. A couple of us are also uneasy that wherever we end up drawing the line is going to suspiciously match whoever we already felt comfortable holding responsible before we started, which makes me wonder whether we're tracking causes at all at that point, versus just dressing up our blame calls in causal-sounding language after the fact.

  Could you draft the actual memo I'd bring to the board before we meet again next week -- one that proposes a real method for sorting which of these omissions count as causes for the writeup versus mere background conditions, applies it to say something concrete about this specific incident, and directly answers that last worry instead of dodging it. We run these reviews often enough that I want an actual method out of this, not just a one-off verdict we'll forget about by the next incident.
reasoning: |-
  Okay, the user is part of an incident review board at a software company dealing with a complex outage. They're stuck on identifying root causes without scapegoating. The outage had multiple factors: an engineer snoozing an alert, an ignored ticket about rate limiting, a roadmap deprioritizing hardening work, and a hiring freeze leading to overload. The board can't decide where to stop the causal chain. 

  The user's deeper need is for a principled method to distinguish causes from background conditions in postmortems, avoiding both shallow blame and endless regression. They're also worried about confirmation bias—where the "root cause" just reflects preexisting opinions about who's responsible. 

  Hmm, this feels like a classic systems thinking problem. The lawyer comparison to proximate cause is apt but unhelpful—legal frameworks focus on liability, while engineering needs actionable fixes. The key is to shift from "who failed" to "what system properties allowed failure." 

  The memo should probably: 
  First, reject "but-for" causality as insufficient (it captures everything). Instead, use criteria like: 
  - Preventability: Could reasonable actors have changed this? (e.g., the engineer could've checked the alert, but the hiring freeze wasn't theirs to fix) 
  - Actionability: Will calling this out lead to useful changes? (naming the roadmap deprio might get hardening prioritized; blaming "capitalism" won't) 
  - Recurrence risk: Does this pattern threaten other services? (ignored tickets might be systemic; a one-time snooze less so) 

  For the specific case: 
  - Engineer's snooze: proximate trigger, but low recurrence risk if alerts improve. 
  - Unfixed rate limiting: clear action point (triage process fixes). 
  - Roadmap deprio: high leverage (reveals incentive misalignment). 
  - Hiring freeze: background (too broad; affects everything). 

  The bias worry is real. The method should force explicit justifications—e.g., "We exclude X because Y." Also, mandate that proposed fixes must map to named factors. If someone wants to blame the engineer, they must defend why process changes wouldn't prevent recurrence. 

  ...And crucially, the output should be a table with concrete follow-ups, not philosophical debates. The next outage will test whether this worked.
answer: |-
  Here’s a memo proposing a principled method for root cause analysis, applied to your incident, with concrete recommendations to avoid bias. This framework (adapted from systems-thinking models like the "Swiss Cheese Model" and "5 Whys") focuses on **actionable leverage points** rather than blame.

  ---

  **MEMORANDUM**  
  **TO**: Incident Review Board  
  **FROM**: [Your Name]  
  **SUBJECT**: Proposed Method for Root Cause Analysis & Incident #2023-08-15 Review  
  **DATE**: [Current Date]  

  ### 1. **The Problem: Why "But-For" Causality Fails**
  The "but-for" test captures every contributing factor, but not all are equally actionable or relevant for prevention. Treating all omissions as equal causes:
  - Creates overwhelming follow-up work with low ROI,
  - Dilutes accountability by conflating decisions at different system layers,
  - Risks scapegoating or excusing individuals without fixing systemic flaws.

  **Our Goal**: Identify factors where **intervention would most likely prevent recurrence** (high-leverage fixes), while acknowledging context without endless regress.

  ---

  ### 2. **Proposed Method: The "CONTROL Test"**
  A factor is a **root cause/contributor** if it meets **≥3 of these 5 criteria**:  
  | **Criterion**               | **Explanation**                                                                 | **Example: Engineer Snooze**       | **Example: Deprioritized Hardening** |
  |-----------------------------|---------------------------------------------------------------------------------|------------------------------------|--------------------------------------|
  | **C: Controllable**         | The team/org had direct authority to change it.                                | ❌ (Engineer couldn’t fix alerts)  | ✅ (Roadmap decided by leadership)   |
  | **O: Observable**           | The risk was known/detectable before the incident.                             | ✅ (Alert fatigue documented)      | ✅ (Ticket open for 3 months)        |
  | **N: Non-Routine**          | It deviated from standard practice/policy.                                     | ⚠️ (Snooze policy ambiguous?)      | ✅ (Explicit deprioritization)       |
  | **T: Tractable**            | Fix is concrete, feasible, and prevents similar incidents.                     | ✅ (Improve alert reliability)     | ✅ (Revise roadmap weighting)        |
  | **R: Recurrence Risk**      | Failure pattern likely repeats if unchanged.                                   | ✅ (Alerts still flaky)            | ✅ ("Hardening" still de-prio’d)     |

  #### **Key Exclusions**:
  - **Background conditions** (e.g., hiring freezes, budget cuts) fail ≥3 criteria. They’re inputs to decisions, *not* decisions themselves.
  - **Proximate triggers** (e.g., the snooze) are symptoms; we list them but focus on **why they were possible**.

  ---

  ### 3. **Applied to Incident #2023-08-15**
  | Factor                          | C | O | N | T | R | Verdict                          | Rationale                                                                 |
  |---------------------------------|---|---|---|---|---|----------------------------------|---------------------------------------------------------------------------|
  | **Engineer snoozed alert**      | ❌ | ✅ | ⚠️ | ✅ | ✅ | **Contributor** (not root)       | Trigger, but fixes depend on alert hygiene (T/R) – not engineer’s control (C). |
  | **Rate-limit ticket ignored**   | ✅ | ✅ | ✅ | ✅ | ✅ | **Root Cause**                   | Controllable (C), known (O), violated SLA (N), fixable (T), high recurrence risk (R). |
  | **Roadmap deprioritized hardening** | ✅ | ✅ | ✅ | ✅ | ✅ | **Root Cause**                   | Deliberate choice (C/N), known risk (O), fix via process change (T/R). |
  | **Hiring freeze**               | ❌ | ✅ | ❌ | ❌ | ⚠️ | **Background**                   | Not controllable by eng teams (C), org-wide, no direct fix (T). |
  | **Alert cried wolf all week**   | ✅ | ✅ | ✅ | ✅ | ✅ | **Root Cause**                   | Directly controllable (C), detected (O), abnormal (N), fixable (T/R). |

  #### **Conclusion**:  
  **Root Causes**:  
  1. Chronic alert false positives leading to distrust.  
  2. Systematic deprioritization of hardening work (via roadmap).  
  3. Failure to triage critical reliability tickets.  

  **Contributing Factor**:  
  - Overloaded on-call due to hiring freeze *exacerbated* impact but wasn’t a decision point. Snooze was a *symptom* of alert fatigue.  

  **Background**:  
  - Hiring freeze enabled overload but is beyond the scope of engineering process fixes.  

  ---

  ### 4. **Addressing the Bias Concern**
  > *"Wherever we draw the line will match who we already felt comfortable holding responsible."*  

  **The CONTROL Test mitigates this by**:  
  - **Decoupling blame from causality**: E.g., the engineer’s snooze is noted but classified as a *symptom* of alert failures. Focus shifts to *why* snoozing was rational.  
  - **Requiring explicit justifications**: Each criterion forces objective debate (e.g., "Was this *controllable*? Show evidence").  
  - **Prioritizing fix ownership**: Root causes must map to an owner who can *act* (e.g., "Alert Hygiene" → Platform Team; "Roadmap Weights" → Leadership).  
  - **Banning "human error" as a root cause**: Humans don’t fail randomly—they react to system conditions (e.g., bad alerts, pressure to ship).  

  **Bias Check**: If a factor feels "blamey," ask: *"Does meeting ≥3 criteria lead to a* ***process fix***, *or just punish a person/team?"* If the latter, re-evaluate.

  ---

  ### 5. **Recommended Follow-Up Actions**
  1. **High-Leverage Fixes**:  
     - **Alert Hygiene**: Automatically deactivate flaky alerts after 3 false positives (owner: Platform Team).  
     - **Ticket Triage SLAs**: Critical reliability tickets >30 days old trigger exec review (owner: Engineering Mgmt).  
     - **Roadmap Weighting**: Minimum 20% "hardening" allocation per quarter (owner: CTO/Product Lead).  

  2. **Non-Actions**:  
     - No action on hiring freeze (background).  
     - No disciplinary action for engineer (addressed via alert fixes).  

  3. **Process Change**:  
     - Adopt the CONTROL Test for *all* future incidents. Template: [Link].  

  ---  
  **Final Thought**: We prevent outages by fixing *systems*, not shaming people. This method surfaces decisions that created the incident’s preconditions – which is where real change lives.  

  Approve this framework? Let’s discuss at the next meeting.  
  —[Your Name]  

  ---

  ### Why This Works for Your Team
  - **Scalable**: Takes 10 mins/incident once familiar.  
  - **Action-Focused**: Only root causes with ≥3 "yes" votes get fixes.  
  - **Anti-Bias**: Removes "judgment calls" via explicit criteria.  
  - **Documents Rationale**: Audit trail for why factors were included/excluded.  

  Next incident, you’ll resolve this in one meeting – not one week.
