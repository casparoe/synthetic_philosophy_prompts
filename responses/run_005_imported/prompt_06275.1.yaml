prompt: |-
  After forty years as a research physicist, I have spent my retirement reading my way through the history and philosophy of science, and for the past year I have co-hosted a small podcast on the subject with two former colleagues. Next month's guest is a historian of science whose signature claim is that Kepler's astrology -- laid out across De Fundamentis Astrologiae Certioribus, Tertius Interveniens, and the fourth book of the Harmonices Mundi -- was not a lapse into his era's superstition but a rigorously argued research program continuous with his physics. Please draft eight to ten interview questions that push past a mere restatement of that thesis. I want at least one question on whether Kepler's own line between 'natural' astrology, grounded in the physical action of light and heat on earthly bodies, and the 'judicial' astrology he scorned, is principled or merely a face-saving redraw of an older boundary; one on the actual causal story behind his harmonic theory of aspects -- why particular angles, including the quintile he added to the traditional set, were supposed to imprint anything at all on a soul through their correspondence to harmonic ratios; and one on the tension between that theoretical defense and his own wry admission that he kept producing the astrological calendars his patrons paid for even while doubting most of what went into them. For each question, please add a short follow-up keyed to the answer she is most likely to give.
