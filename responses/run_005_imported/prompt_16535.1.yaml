  (a) Calibration: predicted risk = actual outcome rate per score
  (b) Error rate equality: same FPR/FNR across groups
  ...must either be perfect or mathematically impossible. This is provable via Bayes' theorem.

  Now for Rawlsian analysis. The user specifically requests using his framework:
