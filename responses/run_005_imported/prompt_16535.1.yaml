  Hmm... the key is recognizing that pretrial risk assessment operates in an imperfect procedural justice context. Unlike pure procedural justice (where process defines fairness, like dividing cake by "cutter chooses last"), or perfect procedural justice (where we know the just outcome and design a process to achieve it, like criminal trials), imperfect procedural justice acknowledges we can't guarantee correct outcomes. 

  Rawls would likely prioritize calibration over error rates. Why? 
  1. Calibration ensures risk scores mean what they claim across groups - a 70% score for Group A defendants has the same interpretation as for Group B. This aligns with Rawls' "publicity condition" and "fair equality of opportunity" - individuals deserve accurate information about their predicted risk. 
  2. Error rate parity (FPR/FNR equality) might accidentally reinforce existing disparities. If Group B has higher base rates, forcing equal FNR could require giving them disproportionately more false positives - potentially exacerbating inequities. 

  But crucially, Rawls would demand mitigation. The difference principle requires any inequalities to benefit the least advantaged. So if calibration must be prioritized, the resulting higher error rates for one group should trigger:
