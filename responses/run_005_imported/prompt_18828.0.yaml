prompt: |-
  Write a short story built around updateless decision theory, the decision-theory idea that comes up a lot in AI alignment and rationalist circles. The basic idea: what's rational for you to do can depend on the policy you'd have committed to before you knew which way a situation was going to break, not on what actually benefits you now that you already know how it broke. The standard toy example is counterfactual mugging: a predictor wants payment from you in the one branch where paying cant possibly help you anymore, precisely because being the kind of agent who pays is what made the deal good on average across both branches. Don't just retell that one though, invent your own characters and stakes. The hard part is making the "wait, why follow through now, it can't actually help me anymore" pull land emotionally through the plot itself, rather than having a character explain the logic out loud. Doesn't have to involve AI or an explicit predictor either, if you find a better way into it.
reasoning: |-
  Okay, the user wants a short story illustrating updateless decision theory without retreading the counterfactual mugging example. They specifically want the emotional tension of "why follow through when it can't help me" to emerge naturally from plot, not exposition. 

  Hmm. The challenge is making abstract decision theory feel visceral. Need a scenario where commitment costs everything in one timeline while being crucial in another. The "before/after knowledge" pivot must hurt. 

  *Brainstorming*: Medical sacrifice? No, too tragic. Business deal? Too cold. Ah—generational ships! Perfect. A captain who committed to mutual destruction if either ship goes rogue. But when the other ship actually turns hostile, her own crew can't understand why she'd uphold a dead promise. 

  *Key elements*: 
  - The policy must feel reasonable when made (both ships vulnerable = mutual trust) 
  - Present payoff must be negative (her destruction gains nothing now) 
  - Stakes must be high enough that betrayal seems rational in the moment 
  - Emotional core: leader's isolation when upholding painful rationality 

  *Structure*: 
  1. Show the pact's logic pre-crisis (flashing screens = equal stakes) 
  2. Reveal the other ship's mutiny via garbled transmission (chaos, disbelief) 
  3. Crew's rebellion: "They're dead anyway! Save us!" 
  4. Captain's silent activation—show, don't tell her updateless resolve 
  5. The twist: her ship's hidden dead-man switch to enforce symmetry 

  *Why this works*: 
  - Crew's desperation makes "defect" feel emotionally right 
  - Captain's action seems like suicide until the final reveal 
  - The switch retroactively justifies her as consistent, not cruel 
  - No infodumps: logic emerges from her irreversible choice 

  *User nuance*: They're deep in rationalist spaces (mentioning AI alignment). Probably enjoys rigor but hates didacticism. Story must breathe. Also—clever avoiding AI tropes. Ships let me explore determinism without predictors. 

  *Final polish*: Make the switch reveal icy calm. She's not a hero; she's a function. That's the terrifying beauty of UDT.
answer: |-
  The dust storms on Tau Ceti e didn’t rage; they *gnawed*. Captain Anya Rostova felt the familiar grit beneath her collar as she surveyed the desolate expanse from the *Kite’s* bridge. Her gaze, however, was fixed not on the ochre wastes below, but on the flickering holodisplay showing their sister ship, the *Hawk*, holding geosynchronous orbit 200 kilometers above.

  "Comms, status?" Anya asked, her voice tight.

  Lieutenant Chen shook his head. "Still dead silent, Captain. Last transmission was the garbled distress burst: '...containment breach... crew compromised... hostile protocols...' Then nothing."

  Three days. Three days of silence after that chilling, fragmented cry. The *Hawk* wasn't just a sister ship; it was their lifeline. The colony ships *Kite* and *Hawk* had arrived at Tau Ceti e together a decade ago. Their founding charter was explicit: mutual survival. That meant shared resources, shared defense, and one brutal, unbreakable pact forged in the cold logic of deep space.

  **The Pact.**

  Conceived not by Anya, but by her predecessor, Captain Vance, a pragmatist haunted by tales of generation ships turning feral. The Pact stated: *Should either vessel suffer catastrophic system failure, AI corruption, or confirmed hostile takeover rendering it an active threat to the other, the unaffected vessel is obligated to initiate immediate, total destruction of the compromised ship.* The key clause, the one Vance had drilled into Anya: **"This obligation holds regardless of perceived immediate benefit at the moment of execution. The policy is the shield."**

  The logic was updateless: Before launch, before knowing which ship *might* fail, both crews agreed that being the kind of entity that *would* absolutely destroy the other if compromised – even when it seemed pointless or costly – was the only thing that made mutual trust and cooperation viable. It deterred betrayal born of desperation. It ensured neither ship could gamble on the other's mercy if they went rogue. The policy, fixed *before* knowing fate, protected both possibilities.

  Now, the unthinkable had happened. The *Hawk* was silent, its energy signatures fluctuating wildly, weapons systems cycling ominously. Scans showed no life signs matching the crew roster. Just... wrongness.

  "Captain," Commander Rourke, her XO, stepped close, his face pale. "Scans are conclusive. The *Hawk’s* primary reactor is spiking. If it goes critical... the EMP and debris field would cripple the *Kite*. We're already seeing targeting locks painting our hull."

  Anya closed her eyes. She saw Vance’s stern face. *"It feels monstrous, Anya, when you imagine pulling the trigger on friends. But the policy isn't for the moment you *know* they're gone. It's for the moment *before* you knew, when the possibility existed equally for either ship. That's when the commitment mattered. That's what kept us honest."*

  "Arm the Nova Lance," Anya ordered, her voice devoid of inflection.

  A collective gasp rippled through the bridge. The Nova Lance was their planet-cracker, a last-resort weapon. Using it on the *Hawk* wasn't just destruction; it was obliteration.

  "Captain, no!" Rourke pleaded. "We don't *know*! Maybe some of them are alive, trapped! Maybe we can jam their systems, board them...!"

  "Targeting locks confirmed!" Chen yelled. "They're powering railguns!"

  "Arm the Lance," Anya repeated, colder this time. "Authorization Rostova-Alpha-Seven."

  "Anya, think!" Rourke grabbed her arm, desperation cracking his voice. "What does it *gain* us *now*? If they fire first, we die. If we fire first... we still kill whatever's left of our friends! It doesn't *save* us from the attack if it's already coming! It just makes us murderers! The Pact is *insane* right now!"

  His words echoed the screaming doubt in her own mind. *Why?* The *Hawk* was gone, consumed by whatever horror breached its decks. Firing the Lance wouldn't bring back her friends on the *Hawk*. It wouldn't guarantee the *Kite's* survival against an imminent attack. The immediate, brutal calculus screamed: *Self-preservation! Evade, counter their weapons, maybe disable them! Don't waste the Lance on a corpse-ship!*

  But Captain Vance’s ghost was implacable. *The commitment was made when the danger was symmetrical. When both ships were equally vulnerable, equally capable of becoming the threat. The policy – the unwavering *will* to destroy the other if compromised – is what made cooperation possible. Backing down now, because *this time* it's *them* who fell, not us... that invalidates the entire foundation. It tells the universe we only cooperate when it's easy, when the cost isn't personal. It makes us untrustworthy for any future cooperation, real or hypothetical. It makes the Pact a lie.*

  The *Kite* shuddered as proximity alarms blared. The *Hawk* had fired.

  "Evasive pattern Delta!" Rourke shouted, wrenching control.

  Anya didn't flinch. Her hand hovered over the final authorization panel for the Nova Lance. Rourke was right in the narrow now. Firing gained the *Kite* nothing tangible *in this specific timeline*. They were already under attack. Destroying the *Hawk* wouldn't undo that. It felt like pure, pointless vengeance, a waste of their ultimate weapon.

  But the Anya of ten years ago, the Anya who didn't know which ship would face the void first, had voted for the Pact. She had bound herself. The policy existed *because* of the possibility that the *Kite* might one day be the compromised one, relying on the *Hawk* to have the courage to do the unthinkable. To uphold the agreement *even when it couldn't possibly help the Hawk anymore*.

  "Captain, their second salvo is charging! We can't take another hit!" Chen screamed.

  Rourke stared at her, eyes wide with betrayal. "Anya, *please*! It’s suicide! For what? A dead policy?"

  For the integrity of the decision made when the branches were still open, Anya thought. For the version of us that existed before we knew which ship would break. For the trust that wasn't just between two crews, but with the universe's unforgiving logic.

  Her palm slammed down on the panel. "Nova Lance. Fire."

  The sequence was irrevocable. Lights dimmed as massive capacitors drained. A beam of pure annihilation, silent in the vacuum, lanced out from the *Kite*.

  It struck the *Hawk* amidships. There was no explosion in the conventional sense. The sister ship simply... *unfolded*. Matter disintegrated in a silent bloom of incandescent energy, then collapsed into a micro-singularity that winked out a millisecond later. Nothing remained but dissipating plasma.

  The *Hawk's* second salvo, already in transit, streaked past the space where its mothership had been and detonated harmlessly in the void.

  Silence descended on the *Kite's* bridge, thick and choking. The immediate threat was gone. They were safe.

  Rourke slowly turned to Anya, his face a mask of horror and disbelief. "We... we survived. But... *why*? Why fire? They were already shooting. We could have evaded, disabled them maybe..."

  Anya looked at the empty space on the holodisplay where the *Hawk* had been. The grit in her collar felt like ash. "Because ten years ago," she said, her voice raw, "the Captain of the *Hawk* and Captain Vance made a promise. A promise that *if it had been us* drifting dead up here, compromised and threatening them... the *Hawk* would have done the same. Without hesitation. Even though it couldn't help them anymore." She met Rourke's eyes, seeing only the agony of the present, unable to perceive the branching paths of the past. "The policy *was* the shield, Commander. We just never saw it flex until today."

  She turned back to the viewport, the gnawing dust storms below mirroring the hollow ache within. Safety felt like ashes. The cost of updatelessness was paid in the coin of the present, for a debt incurred in the realm of possibility. And only Captain Vance’s ghost, and the cold equations of a decision made before the storm broke, knew if it was worth it.
