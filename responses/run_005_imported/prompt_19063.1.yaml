answer: |-
  You've nailed the core tension perfectly. Higher-order vagueness is the *crucible* where supervaluationism (SV) gets tested, and the "collapse objection" you describe is its most serious challenge. Let's grind through the gears:

  **The Problem: Vagueness of "Admissible Precisification"**

  1.  **SV's First-Order Mechanism:** SV handles first-order borderline cases (e.g., "Is 5,000 grains a heap?") by saying:
      *   Truth = True in *all* admissible precisifications (P1, P2, ... Pn).
      *   Falsity = False in *all* admissible precisifications.
      *   Neither (Gap) = True in *some*, False in *others*.

  2.  **The Higher-Order Question:** But "admissible precisification" isn't a crisp set. There are precisifications that are *clearly* admissible (e.g., one defining "heap" as ≥ 10,000 grains), *clearly inadmissible* (e.g., one defining "heap" as ≥ 1 grain), and *borderline admissible* (e.g., one defining "heap" as ≥ 5,001 grains? ≥ 5,000? ≥ 4,999?).
  3.  **The Regress Threat:** To handle the vagueness of *admissibility itself*, SV seems forced to supervaluate *again*:
      *   Define "Super-Admissible" sets of precisifications (S1, S2, ... Sm).
      *   Truth = True in all precisifications within *every* Super-Admissible set.
      *   ...and so on, *ad infinitum*.

  **The Collapse Objection (Epistemicism in a Trenchcoat?)**

  This is where the objection bites:

  1.  **Infinite Regress is Useless:** An infinite hierarchy of super-truth conditions is computationally and conceptually intractable. It doesn't provide a usable *semantics* for actual vague language use. We need a stopping point.
  2.  **The Stopping Point = Hidden Sharp Boundary:** If the regress stops at *any* finite level (say, level K), then the set of "K-Admissible Precisifications" (or sets of sets...) has a *sharp boundary*. There is a precise fact about *exactly* which precisifications (or sets) are K-admissible and which are not.
  3.  **Epistemicism Reborn:** This sharp boundary at level K is *exactly analogous* to the epistemicist's sharp boundary for the original predicate (e.g., "heap"). We are constitutionally incapable of knowing *where* this sharp boundary for K-admissibility lies, just as we can't know the precise heap-boundary.
  4.  **Semantic Identity?:** Crucially, the *truth conditions* defined using this level-K machinery become: "A sentence S is true iff S is true relative to *all* precisifications in *the one true, sharply bounded set of K-admissible precisifications*." This looks *identical in form* to epistemicism: truth is determined by a single, precise, but unknowable standard (the set of K-admissible precisifications). The "supervaluation" over the *lower-level* precisifications becomes merely the mechanism *within* that single standard. SV collapses into a complex version of epistemicism.

  **Supervaluationist Defenses: Dodging the Collapse?**

  SV proponents (like Fine, Keefe) don't surrender. Their main strategies:

  1.  **Open Texture & Contextual Parameters:** Argue that "admissibility" isn't governed by hidden metaphysical facts, but by *open-textured rules* and *contextual parameters*. Admissibility depends on features like:
      *   **Penumbral Connections:** Precisifications must respect relations between vague terms (e.g., if X is hairier than Y, and Y is bald, then X can't be bald).
      *   **Usage Patterns:** Precisifications shouldn't wildly contradict how competent speakers *actually* apply the term in clear cases.
      *   **Contextual Salience:** What counts as admissible can shift subtly with conversational context.
      *   **The "No Sharp Boundaries" Constraint:** Crucially, *no* precisification that draws a *sharp* boundary is admissible. Admissible precisifications themselves must be *vague* (though often modeled as classical for simplicity). This aims to build higher-order vagueness *into* the first-order precisifications.
      *   **The Claim:** This complex, context-sensitive, open-textured nature of admissibility *blocks* the idea that there's a hidden sharp set. Admissibility is fundamentally *indefinite*, not just unknown. There simply *is no fact of the matter* about the exact boundaries of the admissible set, just as there's no fact about the exact heap boundary. The regress doesn't "stop" at a sharp level-K; it *dissolves* because the concept "admissible" doesn't *demand* a sharp boundary. Its vagueness is primitive.

  2.  **Higher-Order Supervaluation as Diagnosis, Not Mechanism:** Concede that *formally* modeling higher-order vagueness requires higher-order supervaluations, but argue this is a *description* of the phenomenon, not a *reduction*. The point is to show *how* truth-value gaps can propagate upwards. They deny this implies a commitment to a *sharply bounded* set of sets at any level. The vagueness is "all the way up" – each level supervaluates over a vaguely bounded set from the level below. The *formal regress* is a tool to model the *semantic indeterminacy*, not evidence for a hidden sharp boundary.

  3.  **Fuzzy Boundaries Between Orders:** Argue that the transition between "definitely admissible," "borderline admissible," and "definitely inadmissible" is itself *smooth* or gradual. There isn't a sharp jump from first-order borderline cases to second-order borderline cases of admissibility. This blurs the lines between "orders" of vagueness, making the regress less like distinct levels and more like a continuous field of indeterminacy.

  **The Epistemicist Counter-Punch:**

  1.  **Indefinite ≠ Unreal:** Williamson (and others) press: What does this "fundamental indefiniteness" *mean*? If there's *no fact* about whether a specific precisification P is admissible, then what *grounds* the truth conditions? SV seems to replace unknowable sharp boundaries with *metaphysical indeterminacy* about admissibility. But is this any less mysterious? Epistemicism claims the facts *are* sharp, just unknowable. SV claims the facts (about admissibility) *are not sharp*. But how does this non-sharpness *work*? If it's not reducible to something non-mysterious, it risks being vacuous.
  2.  **The Precision of the Metalanguage:** The SV theorist uses *precise mathematical sets* (P1...Pn) to model precisifications and defines truth/falsity/gap using *precise set-theoretic operations* (universal quantification over the set). How can a *precise* model (using sets with sharp boundaries!) adequately represent a reality that supposedly *lacks* sharp boundaries all the way up? Doesn't the model *itself* smuggle in precision at the meta-level? The SV machinery *requires* a sharp set of precisifications to calculate truth values at any given level, even if that set is "vaguely defined" at a higher level.
  3.  **The Access Problem Persists:** Even if admissibility is "open-textured," competent speakers seem to agree on *clear* cases of (in)admissibility and disagree on borderline cases. The epistemicist asks: Isn't the *best explanation* for this that there *is* a sharp boundary (driven by complex linguistic practices and the world), but our cognitive/conceptual limitations prevent us from pinpointing it? SV's "open texture" seems indistinguishable *in practice* from epistemic ignorance of a complex boundary.

  **The Stalemate (Gears Grinding to a Halt):**

  *   **SV's Core Claim:** Higher-order vagueness shows the *concept* of a sharp boundary for "admissible" is incoherent. Vagueness is irreducible and requires a semantics (like SV) built on *indefiniteness* at its foundation, avoiding hidden sharp boundaries.
  *   **Collapse Objection:** SV's formal machinery and need to halt the regress *inevitably* imply a sharp boundary *somewhere* in the meta-language (the set of level-K-admissible precisifications), functionally reducing it to epistemicism.
  *   **SV Rebuttal:** The sharp boundaries in the *model* are just representational tools. The *phenomenon* being modeled (vagueness) is boundary-less. Admissibility is governed by open-textured rules, not hidden facts. The regress dissolves into context and practice.
  *   **Epistemicist Rejoinder:** "Open texture" and "contextual parameters" are either:
      *   **Reducible:** To complex but sharp rules + ignorance (epistemicism).
      *   **Or Mysterious:** Unexplained primitive metaphysical indeterminacy.

  **Conclusion:**

  You're right to be bugged. The collapse objection is powerful and arguably *the* major hurdle for SV. While SV offers sophisticated defenses based on open texture, context, and the rejection of sharp boundaries "all the way up," the epistemicist maintains that these defenses either:

  1.  **Collapse:** Implicitly rely on a sharp boundary at a higher level (epistemicism in a trenchcoat).
  2.  **Or Postulate Primitive Indeterminacy:** Replace epistemic mystery with metaphysical mystery about the nature of "admissibility."

  There's no universally accepted resolution. The debate hinges on deep intuitions about whether the seeming *boundarylessness* of vagueness is fundamental and irreducible (favoring SV's open-texture view) or ultimately a consequence of our limited access to complex but precise linguistic facts (favoring epistemicism). You've grasped the central, grinding gear in the mechanism. The trenchcoat accusation is apt if you believe the regress *must* bottom out sharply; SV survives only if you believe the concept of "admissibility" inherently resists such sharp bottoming out.
