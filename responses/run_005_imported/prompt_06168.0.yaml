answer: |-
  This is an incredibly tough and ethically complex situation, but based on medical ethics, mental health law, and the principle of self-determination over time, **you are likely right to follow the document (advance directive/Ulysses contract) she signed when stable.**

  Here's why, and the concepts involved:

  1.  **The Document Has a Name: It's an Advance Directive (specifically a "Ulysses Contract" or "Psychiatric Advance Directive - PAD").**
      *   **Advance Directive:** A legal document outlining healthcare wishes if someone becomes incapable of making decisions.
      *   **Ulysses Contract:** Named after Ulysses tying himself to the mast to resist the Sirens' call. It's a specific type of advance directive where a person *anticipates* losing rational capacity during a future episode (like mania or psychosis) and gives instructions *in advance* to override their future impaired self's refusal of necessary treatment. This is exactly what your sister did.

  2.  **Why Honoring the Directive is Ethically Sound:**
      *   **Respecting Past Competent Autonomy:** When your sister signed the document with her psychiatrist and lawyer, she was exercising her full, rational autonomy. She carefully considered her illness pattern, the risks of untreated mania, and made a deliberate choice about what should happen *when she couldn't make a good choice*. Ignoring this is ignoring her most considered judgment.
      *   **Protecting Her from Harm:** Mania severely impairs judgment, insight, and risk assessment. Her current refusal is a *symptom of the illness*, not a rational choice. Untreated mania can lead to devastating consequences: financial ruin, relationship destruction, legal trouble, physical harm, or psychosis. The directive exists *specifically* to prevent these outcomes she feared when well.
      *   **Anticipated Self vs. Current Self:** Your sister brilliantly anticipated this *exact* scenario – her future manic self fighting against necessary care. The directive is her way of ensuring her *long-term well-being and values* (prioritized when well) override the *immediate desires driven by illness*.
      *   **Medical and Legal Validation:** She didn't do this alone. She involved her psychiatrist (ensuring clinical appropriateness) and a lawyer (ensuring legal validity). This adds significant weight to the document.

  3.  **Understanding Your Mom's Perspective (and Why It's Understandable but Flawed):**
      *   **Respecting Current Wishes:** Your mom is prioritizing your sister's *immediate* expressed desire, which feels like respecting her autonomy *right now*.
      *   **Avoiding Conflict and Pain:** Seeing her daughter furious and resistant is incredibly painful. Forcing hospitalization feels like betrayal and causes immediate distress.
      *   **The Flaw:** This perspective fails to recognize that your sister's current "autonomy" is fundamentally compromised by her illness. Honoring her current refusal ignores the *reason* the directive exists and disregards her explicitly stated wishes made when she *was* capable. It treats the manic refusal as equally valid as her competent decision, which it is not medically or ethically.

  4.  **The Core Ethical Dilemma (It Has Names!):**
      *   **The Ulysses Contract Dilemma:** The central tension you described – honoring a pre-commitment made rationally vs. respecting current (impaired) refusal.
      *   **Temporal Discounting of Autonomy:** Valuing present autonomy (impaired) more highly than past or future autonomy (competent).
      *   **Insight vs. Competence:** Does the lack of insight *into the illness itself* render her incompetent to refuse treatment specifically *for that illness*? Legally and ethically in these situations, the answer is often yes.

  **Who is Right?**

  **You are ethically and practically correct to follow the advance directive.** This is what your sister *truly* wanted for herself when she had the capacity to decide. It was created to protect her from the exact situation happening now.

  **What to Do Now:**

  1.  **Get the Document:** Immediately locate the physical or electronic copy.
  2.  **Contact the Psychiatrist:** Call her psychiatrist *today*. Explain the situation, state she is manic and refusing care, and that you have her advance directive instructing hospitalization. The psychiatrist is crucial:
      *   They can likely initiate the hospitalization process.
      *   They can speak to emergency services or the hospital about the directive.
      *   They can advise you on the best way to proceed locally.
  3.  **Contact the Lawyer (if needed):** If there's any legal pushback or confusion, having the lawyer who drafted it involved can help.
  4.  **Involve Crisis Services:** If the psychiatrist isn't immediately available or the situation escalates, call emergency mental health services or go to the ER. Present the advance directive.
  5.  **Talk to Your Mom (Gently but Firmly):**
      *   Frame it as loyalty: "Mom, I know this is awful. But the most loyal thing we can do for [Sister] right now is to follow *her own instructions* that she gave us *explicitly for this moment*. She knew this would happen, she knew she'd fight us, and she begged us to help her anyway. Ignoring that document is ignoring *her*."
      *   Focus on illness: "Her anger and refusal are symptoms, not her true self. The document *is* her true self talking to us."
      *   Focus on protection: "We have to protect her from what mania does, just like she asked us to."

  **This is heartbreakingly difficult.** Your sister will likely be furious and feel betrayed *in the moment*. But upon recovery, when stability returns, she is far more likely to be grateful that you followed her plan and prevented potential disaster. By honoring her advance directive, you are respecting her deepest wishes and exercising profound love and courage. Stay strong, and lean on her treatment team for support and guidance.
