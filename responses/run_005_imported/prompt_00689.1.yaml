answer: |-
  You've nailed a classic philosophical puzzle! Quine's "indeterminacy of translation" (IOT) *feels* like underdetermination of theory by evidence (UTE), and the distinction is subtle but crucial to Quine. Here's a breakdown of why he thought they were different beasts, and the ongoing debate:

  **1. The Core of Underdetermination of Theory by Evidence (UTE):**

  *   **The Problem:** Multiple, logically incompatible scientific theories can be compatible with *all possible empirical evidence* (past, present, and future). Think Newtonian gravity vs. General Relativity before precise observations of Mercury's orbit or gravitational lensing. Both fit *all available data* at some point.
  *   **The Assumption:** There **is** a single, correct state of affairs in the world that the theories are attempting to describe. The world has a definite structure.
  *   **The Status:** UTE is an **epistemological** problem. It's about *our access* to the truth. We lack sufficient evidence *now* (or potentially ever, in principle) to uniquely pick the single true theory describing the *one real world*.
  *   **The Hope:** Future evidence *might* break the tie, ruling out one theory in favor of another. There *is* a fact of the matter to be discovered, even if we can't access it definitively.

  **2. The Core of Indeterminacy of Translation (IOT):**

  *   **The Problem:** When translating one language into another (especially radically, like "Jungle" into English), multiple, logically incompatible "analytical hypotheses" (translation manuals) can account for *all possible observable linguistic behavior* (all utterances in all possible stimulatory situations). "Gavagai" could mean "rabbit," "undetached rabbit part," "rabbit stage," "rabbithood," etc., and *no possible future behavioral evidence* could force a choice between them.
  *   **The Assumption (Quine's Radical View):** **There is no pre-existing "meaning" or "proposition"** in the speaker's mind that the translation is trying to match. Meaning is *exhausted* by observable linguistic behavior in response to sensory stimuli. There is no "meaning fact" beyond the patterns of stimulus and response.
  *   **The Status:** IOT is an **ontological** problem. It's not just that *we can't tell* what the native *really* means; it's that **there is no "really means" fact of the matter** to be right or wrong about *beyond the behavioral dispositions*. Meaning itself is indeterminate.
  *   **The Despair:** No future evidence can settle it because the question ("Does 'gavagai' *really* mean rabbit or rabbit-part?") presupposes a reality (a determinate meaning) that doesn't exist, according to Quine. The different manuals are equally correct *descriptions of behavior*, but there's nothing deeper they are describing *incorrectly*.

  **The Crucial Difference: The Fact of the Matter**

  *   **UTE:** Assumes a **single, determinate reality** that the competing theories are trying to describe. The underdetermination is about our *knowledge*, not the reality itself.
  *   **IOT:** Denies there is **any determinate meaning** *to be* described beyond the behavioral patterns. The indeterminacy is *in the subject matter itself*. There is no "it" to get right or wrong in the way we assume.

  **Quine's Analogy (The Rabbit in the Hat):**

  Quine used an analogy: Imagine two theories of the world. Theory A says rabbits exist. Theory B says only rabbit-like appearances exist, conjured by a cosmic hat-trick whenever needed. Both fit *all possible observations*. UTE says: We can't tell which is true, but *one of them is* (either rabbits exist or they don't). IOT says: For meaning, there *is no fact of the matter* about whether the native "refers to rabbits" or "refers to rabbit-appearances conjured by a hat-trick" – because "reference" itself is only defined *within* a translation manual/analytical hypothesis. There's no external, manual-independent "rabbit" for the word to hook onto.

  **Is Quine Cheating? The Debate:**

  Quine's critics argue he *doesn't* successfully keep them separate and that IOT *collapses into* UTE. Here's the core argument:

  1.  **Meaning Realism:** Critics argue meanings *do* exist as real mental states or abstract entities. The native *intends* "gavagai" to mean rabbit, not rabbit-part. This intention is the fact of the matter.
  2.  **IOT as UTE for Psychology:** If meaning realism is true, then IOT just *becomes* a case of UTE applied to the science of psychology/linguistics. We have competing theories ("He means rabbit" vs. "He means rabbit-part") that are compatible with *all behavioral evidence* (just like Newton vs. Einstein was compatible with older data). But, crucially, there *is* a fact of the matter about the native's mental state/intention.
  3.  **Quine's Response:** Quine rejects this! He argues:
      *   **Behaviorism:** Mental states like "intention" or "meaning" are not observable entities; they are posits we infer from behavior. But if the *behavior* is equally compatible with multiple incompatible posits (like "intends rabbit" vs. "intends rabbit-part"), and there's *no further evidence* to adjudicate, then positing *any* specific mental state as the "real meaning" is unjustified. We have no access to meaning *except* through behavior.
      *   **The Double Standard:** Quine argues it's inconsistent to accept UTE for physics (where we posit an unobservable reality) but demand *more* for translation (where we also posit unobservable meanings). If we are physicalists, meanings must supervene on physical facts (brain states, behavior). If two translation manuals are physically equivalent (predict all behavior), then the meanings they assign are physically equivalent too – meaning there *is* no physical difference between them. Hence, no fact of the matter.

  **Conclusion: Did Quine Keep Them Separate?**

  *   **By His Own Lights, Yes:** Quine rigorously maintained the distinction based on his core philosophical commitments: radical empiricism, behaviorism, and physicalism. For him, UTE concerns theories about a physical world assumed to be determinate, while IOT reveals that the very notion of determinate meaning (as something beyond behavior) is a myth. The gavagai case exposes the lack of a "meaning fact," not just our ignorance of it.
  *   **For His Critics, No:** Critics argue Quine only achieves separation by adopting an overly restrictive (and arguably false) behaviorist/physicalist view of meaning. If meanings *are* real mental entities or intentional states, then IOT is simply UTE applied to the science of interpreting minds. The trench coat accusation holds: it's the same epistemological problem applied to a different domain (linguistic behavior vs. planetary motion).

  **The Takeaway:** Whether Quine "cheats" depends entirely on whether you accept his starting assumptions, particularly his rejection of meaning as anything more than observable linguistic behavior. His distinction is powerful *if* you buy into his naturalistic, behaviorist picture of language. If you believe in determinate mental meanings or propositions, then IOT looks like a particularly stark, but ultimately familiar, case of underdetermination. The gavagai argument remains a profound challenge to our intuitive notions of how language hooks onto the world.
