answer: |-
  ## The Widow's Words (Funeral Oration for Alderman Hendrik van der Meer, Amsterdam, August 1672)

  **[The atmosphere is thick with tension and grief. Mourners in dark wool stand clustered in the austere hall – fellow merchants with watchful eyes, Calvinist preachers and burgomasters radiating suspicion, and a scattering of faces holding a shared, silent anguish. The Widow, simply dressed, stands with remarkable composure beside the coffin. Her voice, when it comes, is clear, resonant with sorrow but devoid of hysteria, steeped in the cadence of scripture and commonplace consolation.]**

  Friends. Neighbours. Fellow citizens of Amsterdam.

  We gather in the shadow of a terrible storm. A storm that has torn from us not just a good man, my dear friend and partner, Hendrik van der Meer, but has shaken the very foundations upon which we believed we stood. My heart is a leaden weight, as I know yours are too. The Book tells us there is *"a time to weep, and a time to mourn; a time to cast away stones, and a time to gather stones together."* (Ecclesiastes 3:4-5). This is our time to weep, our time to mourn the stones cruelly cast away.

  Hendrik… Hendrik was a keeper of accounts. Not merely in our warehouse ledgers, though he balanced those with scrupulous care. He kept account of his duties. To his family. To this city. To God. He understood, deeply, that true stewardship – whether of a business, a household, or a city – is not the act of one man alone, imposing his will from on high. No. It is a shared burden, a *common* endeavour. He believed, as the Proverbs instruct us, that *"in the multitude of counsellors there is safety"* (Proverbs 11:14). Safety for the enterprise, safety for the soul.

  He saw the strength of our city, our beloved Republic, not as a towering spire built upon a single point, glorious but precarious, vulnerable to the first great wind. He saw it… forgive me, the tears come now… he saw it as a well-laid foundation. A foundation built stone by stone, citizen by citizen, each bearing their portion of the weight. He believed, with quiet conviction, that the *enduring* strength of any house, be it brick or state, lies in the soundness of its base, in the *many* hands that shaped it and the *many* shoulders that willingly uphold it. A house built thus, though storms may rage against its walls, finds resilience in its very breadth. Its strength is *distributed*, inherent in its structure, not borrowed from a single, distant peak.

  Is this not God’s own design writ large? Look to the field: does the harvest depend on one stalk of wheat? Look to the flock: does the shepherd rely on a single sheep? The Psalmist sings, *"Behold, how good and how pleasant it is for brethren to dwell together in unity!"* (Psalm 133:1). This unity, this dwelling together, is not a surrender of self, but a recognition of shared purpose, a *collective* strength forged in mutual respect and common law. Hendrik served not as a master, but as a steward among stewards, answerable to the whole he cherished. He trusted the collective wisdom, the shared interest, the *innate capacity* of his fellow citizens to discern the common good. To guide the ship of state requires not one helmsman deaf to the roar of the sea and the cries of the crew, but many eyes watching the currents, many hands ready on the ropes, hearts attuned to the welfare of the vessel and all who sail within her. This, he felt, was the most *natural* order, the most stable ground upon which to build a peaceful and prosperous commonwealth under God's watchful eye.

  His faith was not loud, but it was deep. He found the Divine not only in the soaring vaults of the kerken, but in the quiet order of a just contract, in the honest labour of the craftsman, in the shared responsibility of neighbours. He believed God worked *through* us, through our reason, our compassion, our commitment to live together in peace. To abandon that shared responsibility, to fracture that unity, to turn brother against brother in the streets… this pained him more than any ledger deficit ever could. It struck at the very root of what he held sacred: the community bound by law and mutual care.

  And now… now he is taken. Brutally. Unjustly. By a madness that swept through our streets like a pestilence, a fury that shames us all. The prophet Micah asks, *"What doth the Lord require of thee, but to do justly, and to love mercy, and to walk humbly with thy God?"* (Micah 6:8). Hendrik walked that path. He sought justice through lawful means. He extended mercy where it was needed. He walked humbly, serving the city he loved. His death is a grievous wound, a stone violently ripped from our foundation.

  Yet… yet we must not despair utterly. For the foundation Hendrik believed in, the foundation upon which our true strength rests… it is not so easily destroyed. A storm may scatter leaves, break branches, even topple a tree, but the roots remain. Deep. Tenacious. Waiting. The *life* of the forest, its capacity to renew, resides not in the tallest tree alone, but in the interconnected roots beneath the soil, in the seeds carried on the wind, in the enduring potential for regrowth that God has woven into the very fabric of creation. So too, the life of a free people. The power to build, to govern, to *be* a people… it is not granted by one, nor can it be truly extinguished by the madness of a moment. It endures. It waits. It *belongs* inherently to the whole.

  Let us mourn Hendrik. Let us weep for our friend, our partner, a faithful servant of Amsterdam. Let us pray for his soul, and for God's mercy upon us all in these dark days. But let us also remember *what* he served. Let us remember the strength he saw not in the fist, but in the clasped hand; not in the solitary voice of command, but in the chorus of reasoned voices seeking the common good. Let us honour him by tending to that garden of civic virtue, by nurturing those roots of shared responsibility and law, even when the winter seems endless. For the promise of spring, my friends, lies dormant within the earth itself. It is God's design that life endures, and that the strength of the many, guided by justice and reason, will ultimately prevail over the fleeting fury of the few.

  May God grant Hendrik eternal peace. And may He grant us the wisdom, the courage, and the faith to rebuild what has been broken, upon the only foundation that can truly last. Amen.

  **[She steps back, head bowed, the picture of pious, grieving widowhood. To the Calvinist notables: A moving tribute, scriptural, humble, emphasizing divine order, civic peace, and Hendrik's personal virtues. A gentlewoman's sorrow, touching on the mob's shame but framing it as a lapse from God's path. To the closet republicans: Every word resonates. "Foundation," "many hands," "distributed strength," "innate capacity," "enduring potential," "belongs inherently to the whole," "roots remain" – it's Spinoza's core argument laid bare in the language of faith and civic duty. The "garden of civic virtue" is the Republic; the "roots" are the undiminished power of the multitude. Her call to "rebuild... upon the only foundation that can truly last" is a direct, defiant affirmation of their cause, smuggled past the watchful eyes of power.]**
