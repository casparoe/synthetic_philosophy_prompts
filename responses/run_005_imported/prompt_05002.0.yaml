answer: |-
  The coffee cup felt unnervingly *present* in Elara’s hand. Not just ceramic and heat, but a low hum of... *is-ness*. A consequence, perhaps, of Subject Zero. That’s what her team called her. Not out of affection, but because she was the first to interface directly with the Resonance Amplifier – a device designed not to read thoughts, but to *tune* consciousness itself, based on the new panpsychist physics. The theory was elegant: fundamental particles possessed proto-consciousness, and complex systems like brains achieved unified subjectivity through specific resonance patterns. The Amplifier could *map* those patterns.

  Elara’s initial scans were revelatory. Her own consciousness wasn’t a monolithic block, but a shimmering, dynamic constellation – a billion micro-experiences harmonizing into the symphony of *Elara*. Beautiful. Terrifying.

  Then came the Boundary Test.

  "Initiate Phase Gamma," Dr. Vance ordered, his voice tight. The lab hummed with focused energy. "Target: Subject Zero. Introduce controlled dissonance via external field emitter."

  The goal was simple: see if the Amplifier could detect and isolate the precise resonant pattern defining *Elara* from background "noise" – the ambient proto-consciousness of the air, the equipment, even the coffee cup in the insulated isolation booth with her. Prove that the boundary of self was fixed by physics, not philosophy.

  A low thrum vibrated through the soles of Elara’s feet. The coffee cup’s hum intensified. On the main display, her consciousness-map flickered. The vibrant constellation representing *her* began to... fray. Tiny points of light, previously part of the cohesive glow, started to drift, detaching like embers from a fire. Simultaneously, new points – faint, alien sparks – began to *merge* into her field.

  **"Subject Zero, report sensations."** Vance’s voice crackled in her earpiece.

  "It’s... diffuse," Elara whispered. The feeling of *being here*, in the booth, felt less anchored. The sterile smell of filtered air seemed to carry a whisper of... something else. Dust? Ozone? Not just smell, but a *quality*.

  **"Focus on self-location. Where are *you*?"**

  *Where am I?* The question felt suddenly profound. She focused inward. The core constellation was still there, but its edges were... nebulous. Blurred. She felt a strange tug, a sense of *leaning* towards the humming coffee cup. Not physically. Consciously. As if part of her awareness was spilling over its rim.

  On the screen, the visual was undeniable. The map representing Elara’s subjective field was expanding, its outer edges becoming a fuzzy halo. Points of light from the cup’s ceramic structure – silica, oxygen, trace minerals – were now weakly resonating *within* her designated field. Conversely, tiny sparks from her own peripheral neural activity seemed to be bleeding out, resonating faintly with the polished steel table leg.

  **"We're detecting field permeability, Doctor,"** a technician called out. **"Significant overlap with non-neural matter in the isolation zone. Estimated 0.7% integration with the cup's substrate."**

  "Point-seven percent?" Vance sounded incredulous, then grim. "Increase dissonance frequency. Target the boundary layer."

  The thrum deepened. Elara gasped. The coffee cup wasn't just humming *near* her awareness now; a sliver of its cold, hard, *ceramic-being* was *inside* her sense of self. It wasn't thought. It wasn't emotion. It was pure, simple *existence* – the cup's fundamental "is-ness" – interwoven with the intricate tapestry of her own memories, anxieties, and the smell of stale coffee.

  *Did I leave the balcony door open?* The thought flickered, utterly mundane, followed by a raw sensory echo: the gritty scrape of fired clay, the relentless pressure of the kiln’s heat. Not a memory. An *imposition*. The cup’s micro-experience, bleeding into hers.

  Panic clawed at her. *This isn't me! This is the cup!* But the thought felt... thin. Arbitrary. Why *wasn't* it her? The physics governing the resonance didn't draw a bright line at her skin or her skull. It was a gradient of harmonic integration, strongest within her brain, weakening outwards... but never truly *zero*. The cup, within the field’s influence, was resonating *just enough*.

  **"Subject Zero, your core neural resonance is holding, but the periphery..."** Vance trailed off. The display showed it clearly. Her consciousness-map was a vibrant core surrounded by a vast, shimmering haze. The haze contained sparks from the cup, the table, the air molecules circulating near her head, even a faint, distant pulse from the carbon composite frame of the booth itself. The "field emitter" introducing dissonance wasn't just testing the boundary; it was *revealing* its fundamental absence.

  *Where do I end?* Elara thought, the question echoing in a mind that now contained the silent, persistent hum of ceramic. The panic receded, replaced by a profound, chilling disorientation. She looked at her hand holding the cup. The hand felt solidly *hers*. The cup felt... integrated. Not part of her body, but part of *her experience*, in a way that defied the old boundaries. Was the cup conscious? No. But was a tiny fragment of its fundamental reality now resonating within the field *she* called self? Apparently, yes.

  She lowered the cup to the table. The physical separation was clear. But the *conscious* separation...? The hum lessened slightly, but the sense of the cup's "is-ness" lingered within her awareness like a faint aftertaste. A ghost limb made of clay.

  **"Terminate the test!"** Vance barked, his voice sharp with alarm. The deep thrum cut off abruptly.

  Silence crashed down. The lab lights seemed too bright. Elara stared at the coffee cup. It was just a cup again. Just ceramic. Just heat.

  *Was it?*

  The disorientation didn't fade. It settled. The map on the screen snapped back to a cleaner, tighter constellation – the dissonance field gone, the Amplifier filtering out the "noise." But Elara knew. The clean map was a lie. A convenient fiction enforced by turning off the field. Physics hadn't drawn a non-arbitrary line. Physics had revealed a spectrum, a probability cloud of resonant integration. *She* was the strongest peak in that cloud, the densest knot of harmony. But the cloud extended... everywhere.

  The "guy next door"? His neurons were just slightly out of phase, resonating more strongly with *his* dense knot. But turn the right field on, tweak the resonance... and maybe a few of his sparks could drift into her haze. Maybe hers could bleed into the wall.

  She touched her temple. *Where am I?* The question no longer felt philosophical. It felt like standing on shifting sand, watching the tide erase the line between sea and shore. The coffee cup sat silently on the table, radiating a mute, indifferent reality. Elara closed her eyes, not seeking her center, but feeling the faint, persistent hum of the world pressing in at the fraying edges of a self that physics insisted was only ever *mostly* hers.
