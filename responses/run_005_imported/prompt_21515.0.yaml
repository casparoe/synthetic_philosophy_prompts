prompt: |-
  So I've noticed this weird pattern and can't tell if it's a real logical problem or if I'm just overthinking it. If I know for a fact that my confidence in something is gonna jump to some specific level tomorrow, doesn't that mean I should kinda already shift toward it today, before whatever causes the change even happens? My own future certainty feels like it should count as evidence about what's true right now. Except that can't be totally right -- if I know I'm about to get hypnotized, or take a pill that'll convince me the moon is made of cheese, I obviously shouldn't start beleiving that now just because I know it's coming. So there's some line between trusting future-you because it's smart, and trusting future-you because your just letting a con land early. Give me one specific example that sits right on that line, not hypnosis or drugs, where it's genuinely unclear whether deferring to your future confidence is rational or a mistake, and tell me what's actually doing the work in telling the two cases apart.
