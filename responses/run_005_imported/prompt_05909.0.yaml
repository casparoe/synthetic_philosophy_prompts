prompt: |-
  I'm a volunteer TA for a friend's graduate seminar on formal epistemology (my day job is backend engineering, so I'm fine with the probability but I'm leaning on the group for the philosophical framing). I'm grading problem sets on anthropic reasoning and would like a second opinion on this one before I return it.

  **Question set to the student:**

  "Two cosmological theories, T-small and T-big, are considered equally likely a priori and are empirically indistinguishable short of a costly experiment physicists are about to run. T-small entails that exactly 10^12 observers will ever exist; T-big entails that exactly 10^24 observers will ever exist. A philosopher claims that, prior to the experiment, she can already conclude T-big is true with near certainty, purely from the fact that she exists as an observer.

  (a) Reconstruct the philosopher's reasoning and identify which anthropic principle it relies on.
  (b) Explain how a proponent of the rival anthropic principle would respond to her argument, and state whether that rival principle yields a different posterior for T-big.
  (c) Bostrom uses this case to argue against one of the two principles. Which one, and why is the case supposed to be a problem specifically for that principle rather than for anthropic reasoning in general?
  (d) This case is sometimes compared to the Doomsday Argument. Briefly say whether the two principles' verdicts on the Doomsday Argument run parallel to, or in tension with, their verdicts here."

  **Student's answer:**

  "(a) The philosopher is reasoning via the Self-Indication Assumption (SIA), which says we should reason as if we are a random sample from the set of all *possible* observers, weighted by how many actual observers each hypothesis predicts. Since T-big predicts 10^12 times more observers than T-small, SIA updates the prior 1:1 odds to roughly 10^12:1 in favor of T-big, just from the fact that the philosopher exists at all — no data from the experiment is needed.

  (b) A defender of the Self-Sampling Assumption (SSA) would respond that we should instead reason as if we are a random sample from the observers who actually exist within our reference class, in the single world that is actual. Since the calculation is now relative to one's own reference class rather than pooled across hypotheses, learning merely that one exists doesn't discriminate between T-small and T-big at all, so SSA leaves the 1:1 prior odds unchanged.

  (c) Bostrom directs this case against SIA, since it lets pure armchair reasoning about population sizes pre-empt an empirical experiment, which is absurd — a philosopher shouldn't be able to out-reason physicists from her armchair. The case doesn't tell against SSA because SSA was constructed precisely to rule out this kind of population-weighted update, so the case targets SIA specifically rather than anthropic reasoning as such.

  (d) In the Doomsday Argument, SSA is the principle that produces the unsettling update (shifting credence toward an earlier, sooner-ending human population, since we should expect to be typically located within the reference class of all humans who will ever live), while SIA cancels this shift out. So the two principles trade off: SSA avoids the presumptuous philosopher but bites the Doomsday bullet, while SIA avoids the Doomsday bullet but bites the presumptuous philosopher bullet."

  Could you assign a grade out of 20 (with partial credit noted per part) and, for each of (a)–(d), give one or two sentences saying exactly what's correct and what — if anything — is mistaken or overstated? I'd rather have the reasoning spelled out than just a score, since I'll need to justify it if the student pushes back.
reasoning: |-
  Okay, I need to grade this student's answer about anthropic reasoning for a formal epistemology seminar. Let me start by understanding the question and the student's response. 

  The question has four parts: (a) reconstruct the philosopher's reasoning, (b) explain the rival principle's response, (c) discuss Bostrom's criticism, and (d) compare to the Doomsday Argument. The student used SIA for part (a), which seems correct because the philosopher is weighting by possible observers. For part (b), they contrasted with SSA, saying it doesn't update priors. That matches what I know—SSA only considers actual observers in the reference class. 

  Moving to part (c), the student says Bostrom targets SIA because it allows armchair reasoning to override experiments. That's accurate. Bostrom's point is that SIA makes the experiment unnecessary, which is problematic. The student correctly notes SSA avoids this. 

  For part (d), the student links SSA to the Doomsday Argument's unsettling update and SIA counteracts it. They mention the trade-off between the two principles. That's a solid connection, showing parallel reasoning in both cases. 

  Now, checking for mistakes. In part (b), the student says SSA leaves priors unchanged. That's mostly right, but technically, existing as an observer under both theories might require a minimal update. However, since both predict observers exist, it's negligible. The student's point stands. 

  In part (c), the student claims the case targets SIA specifically. That's correct. Bostrom uses this to argue against SIA's presumptuousness. 

  Finally, part (d) is well-handled. The student clearly explains how each principle applies to both scenarios. 

  Overall, the answer is strong. Minor quibble in (b) about prior updates, but it's not a major error. I'll award high marks: 19/20, deducting one point for the slight oversight in (b).
answer: |-
  Here's a graded breakdown with specific feedback per part, designed to justify the score clearly:

  **Overall Grade: 19/20** (Excellent, minor quibble in (b))

  ### (a) Reconstruct the reasoning & identify principle (5/5)
  *   **What's Correct:** Perfect identification of SIA and its core mechanism: updating by weighting hypotheses by the number of observers they predict ("weighted by how many actual observers each hypothesis predicts"). The explanation of the massive update favoring T-big is spot-on.
  *   **Mistake/Overstatement:** None. Precise and complete.

  ### (b) Rival principle's response & posterior (4/5)
  *   **What's Correct:** Correctly identifies SSA as the rival principle and its core tenet: reasoning as if one is a random sample from *actual* observers in the *actual* world within a reference class. Correctly states that SSA yields no significant update ("leaves the 1:1 prior odds unchanged") based *solely* on the philosopher's existence.
  *   **Mistake/Overstatement:** The statement "learning merely that one exists doesn't discriminate... at all" is *slightly* overstated. Under SSA, learning "*I* exist" (as opposed to "some observer exists") *can* provide a *tiny* update if one theory has a significantly higher probability of producing *any* observers at all. However, since both T-small and T-big explicitly entail the existence of observers (10^12 and 10^24), this effect is negligible here and doesn't meaningfully discriminate. The core point that SSA doesn't get the massive SIA update is correct. (Deducted 1 point for the minor imprecision).

  ### (c) Bostrom's target & why specific (5/5)
  *   **What's Correct:** Exactly right that Bostrom uses this case to argue *against SIA*. Perfectly captures Bostrom's key objection: SIA allows "armchair reasoning" about population sizes to pre-empt ("out-reason") empirical experiments, which seems "absurd". Correctly states that SSA is designed to avoid this specific problem ("constructed precisely to rule out this kind of population-weighted update") and thus the case targets SIA specifically.
  *   **Mistake/Overstatement:** None. Excellent summary of Bostrom's argument.

  ### (d) Comparison to Doomsday Argument (5/5)
  *   **What's Correct:** Correctly identifies that SSA produces the Doomsday Argument's update (shifting credence towards earlier doom because we should expect to be typical among *all* humans). Correctly identifies that SIA counteracts ("cancels out") this shift. Perfectly characterizes the trade-off ("SSA avoids the presumptuous philosopher but bites the Doomsday bullet, while SIA avoids the Doomsday bullet but bites the presumptuous philosopher bullet"), showing how the principles' verdicts run in *tension* between the two cases.
  *   **Mistake/Overstatement:** None. Clear and accurate parallel/tension description.

  ### Justification for Grade (19/20)
  The answer demonstrates an excellent grasp of SIA, SSA, the Presumptuous Philosopher problem, Bostrom's argument, and the Doomsday Argument comparison. The deduction of 1 point in part (b) is for a minor overstatement regarding the *absolute* lack of discrimination under SSA, though the practical consequence (no significant update) is correctly stated and the core contrast with SIA is perfectly clear. This is a high-quality response.
