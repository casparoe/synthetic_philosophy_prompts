  Ah, the answer lies in decision theories. CDT vs. TDT/UDT. CDT would defect because it only considers causal outcomes. TDT/UDT, however, base decisions on logical correlations. If both agents use similar decision theories, they can coordinate actions based on mutual predictions. 

