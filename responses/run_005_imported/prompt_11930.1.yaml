  okay so my friend and i got into a whole argument last night about whether psychiatric diagnoses are actually "real," and she pulled out the ian hacking looping effects thing like it was a mic drop. her argument was basically: if classifying someone as having, say, multiple personality disorder changes how they behave, which reshapes what counts as MPD/DID, which then gets fed back into the diagnostic criteria, then the whole category is just something we made up and then reinforced onto ourselves, not something that tracks anything real. i didn't have a good comeback in the moment and its been bugging me since. can you make the strongest case you can that this doesn't actually follow — that a kind can be a full blown "interactive kind" in hacking's sense (looping and all) and still be objective enough to do real explanatory and predictive work, rather then just being a social fiction we're all performing into existence together. bonus if you can say where you think hacking himself would actually land on this vs. the more debunking-flavored way people tend to use his stuff these days.
