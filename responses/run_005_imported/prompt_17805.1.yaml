  For Maimonides' defense: He'd likely argue that early sacrifices (Abel/Noah) were spontaneous human expressions, not divine commands, thus not contradicting his thesis about the Torah's sacrificial system being a deliberate concession. He might distinguish between pre-Sinai sacrifices and the detailed Levitical laws.

