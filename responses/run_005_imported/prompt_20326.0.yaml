answer: |-
  Here's a concrete example designed to isolate how the *method of comparison* dictates the distributive outcome, even under a fixed utilitarian aggregation rule:

  **The Scenario:**
  *   **Scarce Good:** 100 units of a nutritional supplement essential for basic health and functioning.
  *   **Person A (Adapted Preferences):** Belongs to a group historically denied adequate nutrition. Due to prolonged deprivation, A has adapted expectations downward. A reports high satisfaction ("utility") from minimal amounts because it exceeds their bleak baseline. A's physiology, however, still objectively benefits linearly from the supplement.
  *   **Person B (Unadapted Preferences):** Comes from a background of consistent adequate nutrition. B's reported satisfaction tracks the objective benefit of the supplement linearly. B has not experienced deprivation-induced adaptation.

  **Utility Functions (Self-Reported Satisfaction - "Face Value"):**
  *   **A (Reported):** `U_A(reported) = 10 * sqrt(x)` (High satisfaction from low amounts, diminishing returns)
  *   **B (Reported):** `U_B(reported) = x` (Satisfaction proportional to amount)
  *(Where `x` = units of supplement received)*

  **Utility Functions ("Objective" Well-Being - Capability Metric):**
  *   **A (Capability):** `U_A(capability) = x` (Actual health/functioning benefit is linear)
  *   **B (Capability):** `U_B(capability) = x` (Actual health/functioning benefit is linear)
  *(This assumes the supplement's physiological impact is identical and linear for both, reflecting the core capability of "being adequately nourished").*

  **Distributive Calculations:**

  1.  **Utilitarianism using SELF-REPORTED Satisfaction (Face Value Comparison):**
      *   Total Utility Function: `U_total(reported) = 10*sqrt(x_A) + x_B` (Constraint: `x_A + x_B = 100`)
      *   To maximize total reported utility, we find where the marginal utilities are equal: `dU_A/dx_A = dU_B/dx_B`.
          *   Marginal Utility A (Reported): `dU_A/dx_A = 5 / sqrt(x_A)`
          *   Marginal Utility B (Reported): `dU_B/dx_B = 1`
      *   Set equal: `5 / sqrt(x_A) = 1` => `sqrt(x_A) = 5` => `x_A = 25`
      *   Therefore: `x_B = 100 - 25 = 75`
      *   **Result (Face Value):** A gets 25 units, B gets 75 units.
      *   *Justification (Face Value):* Giving the 25th unit to A gives a huge boost (MU=1) to their reported satisfaction, while taking it from B only reduces their reported satisfaction by a little (MU=1). Further redistribution to A yields rapidly diminishing reported gains for A (`5/sqrt(25)=1`, `5/sqrt(26)≈0.98` < 1), making it inefficient.

  2.  **Utilitarianism using OBJECTIVE Capability Metric:**
      *   Total Utility Function: `U_total(capability) = x_A + x_B` (Constraint: `x_A + x_B = 100`)
      *   Marginal Utility A (Capability): `dU_A/dx_A = 1`
      *   Marginal Utility B (Capability): `dU_B/dx_B = 1`
      *   Since marginal utilities are equal and constant, *any* distribution summing to 100 yields the *same* total capability utility (100). Strict utilitarianism is indifferent.
      *   **However, to see the reversal starkly, introduce a minimum threshold:** Suppose physiological need requires at least 40 units for basic health. Below 40, capability utility drops sharply (e.g., `U=0` if x<40`), representing severe health loss. Now:
          *   Distributing 25 to A leaves A at 25 < 40 → `U_A(cap) = 0`
          *   Distributing 75 to B leaves B at 75 > 40 → `U_B(cap) = 75`
          *   **Total Capability Utility: 0 + 75 = 75**
      *   **Alternative Distribution (Equal):** A gets 50, B gets 50.
          *   A: 50 > 40 → `U_A(cap) = 50`
          *   B: 50 > 40 → `U_B(cap) = 50`
          *   **Total Capability Utility: 50 + 50 = 100**
      *   **Alternative Distribution (Prioritize A):** A gets 70, B gets 30.
          *   A: 70 > 40 → `U_A(cap) = 70`
          *   B: 30 < 40 → `U_B(cap) = 0` (Severe health deprivation)
          *   **Total Capability Utility: 70 + 0 = 70**
      *   **Result (Capability + Threshold):** The utilitarian outcome prioritizing *aggregate capability* favors giving A *at least* 40 units to avoid catastrophic loss. Giving A 50 and B 50 (Total=100) yields significantly higher aggregate well-being than giving A 25 and B 75 (Total=75) or A 70 and B 30 (Total=70). **This directly reverses the face-value result, favoring A receiving *more* (50) than under self-reports (25).**

  **The Crucial Point: Where the Ethical Work is Done**

  1.  **The Aggregation Rule (Utilitarianism):** This rule ("maximize the sum of individual utilities") is held *constant* in both calculations. It is *not* the source of the reversal.
  2.  **The Choice of Commensuration Standard (The Real Ethical Work):** The reversal occurs *entirely* because of the prior, non-utilitarian choice about **how to measure and render comparable the well-being of A and B**.
      *   **Self-Reported Satisfaction:** Accepts A's adapted preferences at face value. This method *validates the injustice of past deprivation* by treating A's lowered expectations as their "true" utility. It interprets A's high reported satisfaction from small gains as meaning those gains *matter more* to aggregate welfare than equal gains for B. This leads to favoring B.
      *   **Capability Metric:** Judges well-being based on achieving a fundamental functioning (being nourished), independent of subjective adaptation. This method *rejects the normative relevance of preference adaptation caused by injustice*. It sees A's physiological need as equal to B's, despite A's reports. This leads to favoring A (once a minimum threshold is acknowledged).
  3.  **The Reversal Mechanism:** The face-value method makes A's *reported* marginal utility high when A has little, justifying giving little to A. The capability method reveals A's *actual need* is high when A has little (especially below the threshold), justifying giving more to A. **The choice of comparison standard predetermines whose needs/claims appear stronger *before* aggregation.**

  **Conclusion for Your Paper:**

  This example vividly demonstrates that in cases involving adaptive preferences formed under injustice, the ostensibly "technical" or "scientific" question of *how to compare* welfare across persons is where the fundamental ethical decision is made. Choosing self-reports validates the status quo of deprivation. Choosing a capability (or objective list, or counterfactual preference) standard attempts to correct for the distorting effects of that deprivation. **The utilitarian aggregation rule is merely an adding machine; the values are inputted by the choice of commensuration standard.** Robbins's worry about non-scientific judgments is vindicated, but the locus shifts: the critical non-scientific judgment isn't *whether* to compare, but *how* to construct the comparison in a way that embodies our normative stance towards the causes and consequences of differing preferences. The distributive outcome (favoring B vs. favoring A) is essentially settled by this antecedent choice. This highlights the profound ethical significance hidden within the seemingly procedural step of defining interpersonal comparability.
