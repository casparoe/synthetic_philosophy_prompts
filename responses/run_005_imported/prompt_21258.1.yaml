answer: |-
  That's an incredibly sharp question cutting right to the heart of Aquinas's relevance today. Applying his 13th-century framework to your modern democratic backsliding scenario requires careful unpacking of his distinctions. Here's a breakdown:

  **1. Is the Leader a Tyrant? Absolutely, under Aquinas's Definition.**

  *   Aquinas defines a tyrant as a ruler who governs **"not for the common good, but for his own private advantage"** (*De Regno*, I.3).
  *   Your scenario – gutting courts (destroying checks/balances), jailing rivals (suppressing opposition unjustly), cancelling future elections (destroying the mechanism for legitimate succession) – is the *textbook definition* of tyranny for Aquinas. The ruler has ceased to serve the common good and is solely serving his own power.

  **2. The Legitimacy of Origin: Does Starting Elected Change Aquinas's Calculus? Yes, Significantly.**

  *   Aquinas makes a **crucial distinction** between two types of tyrants:
      *   **Tyrant by Practice (Tyrannus Exercitio):** Someone who gains power legitimately (e.g., election, inheritance) but then rules tyrannically. **This is your scenario.**
      *   **Tyrant by Usurpation (Tyrannus Absque Titulo):** Someone who seizes power illegitimately through force or fraud.
  *   **Why the Distinction Matters for Aquinas:**
      *   **Risk of Greater Evil:** Killing a *legitimately originated* tyrant is far more dangerous. Aquinas argues (*Summa Theologiae* II-II, Q.42, A.2, ad 3) that overthrowing such a ruler often leads to worse outcomes: either the people become even more oppressed by the next ruler (fearing the same fate), or the state descends into chaos and factional violence worse than the original tyranny. The "legitimacy debt" makes the system fragile.
      *   **Duty of Subjects:** Subjects have a stronger duty of obedience to a ruler who *initially* held legitimate authority, even if he becomes tyrannical later, compared to a usurper who never had legitimacy. Resistance is a last resort.
      *   **The "Public Authority" Problem:** Aquinas is **adamantly opposed** to *private individuals* assassinating *any* ruler, tyrant or not. He sees this as sinful sedition and murder. Action must come from a *public authority*.

  **3. Can a "Random Citizen" Justify Assassination? Almost Certainly Not, According to Aquinas.**

  *   This is Aquinas's clearest point. He **explicitly condemns assassination by private individuals** (*ST* II-II, Q.64, A.3; *De Regno* I.6).
  *   **His Reasons:**
      *   **Sin of Murder:** Taking human life without public authority is murder.
      *   **Risk of Anarchy/Injustice:** It encourages vigilante justice, factional killings, and often replaces one tyrant with another worse one or chaos. Who decides who the "tyrant" is? What if the assassin is wrong or malicious?
      *   **Lack of Authority:** Only a duly constituted public authority has the right to judge and depose a ruler. Aquinas sometimes suggests this could be a representative body (like nobles or, arguably by extension, a constitutional court or legislature), or even the people collectively acting in a formal way (though medieval "popular sovereignty" is different from modern democracy). A "random citizen" has zero such authority.

  **4. Internal vs. External Actors: Aquinas's Answer Would Shift Dramatically.**

  *   **Internal Actors (His Own People):** As above, Aquinas would only countenance removal by a *recognized public authority within that polity* (e.g., impeachment by legislature, judicial review leading to removal, a constitutional process initiated by regional leaders). Assassination by individuals or even factions is forbidden. He emphasizes exhausting all legal and non-violent means first.
  *   **External Actors (Foreign Country/Sending Spies):** Aquinas would **vehemently oppose** this. His reasons:
      *   **Violation of Sovereignty:** Each political community has its own natural right to self-governance. Foreign intervention violates this fundamental principle.
      *   **Likelihood of Self-Interest:** A foreign power is almost always acting for its *own* advantage (territory, resources, influence), not the true common good of the oppressed people. This makes them *another tyrant* in Aquinas's eyes.
      *   **Lack of Standing/Knowledge:** Foreign powers lack the intimate understanding of the common good of *that specific community* and the legitimacy to judge its internal affairs. They are not the "public authority" of that polity.
      *   **Destabilization:** Foreign intervention, especially covert assassination, is highly likely to cause wider war, instability, and suffering far beyond the original tyranny.

  **Aquinas's Likely Conclusion for Your Scenario:**

  1.  **Yes, the leader is a tyrant** by his actions, regardless of his legitimate origin.
  2.  **His legitimate origin makes his removal *more* perilous** than a usurper's, increasing the risk of worse outcomes.
  3.  **Assassination by a random citizen is NEVER justified**; it is murder and sedition.
  4.  **Removal is only permissible** if undertaken by a **recognized public authority** within the constitutional structure (e.g., impeachment, a court ruling, a legislative supermajority invoking a constitutional clause), *after* all other remedies are exhausted. Even then, Aquinas is wary.
  5.  **Foreign assassination is absolutely forbidden.** It's an unjust war and a violation of natural law. The *only* potential external role Aquinas *might* allow (drawing on his concept of the Pope as a universal spiritual authority with indirect temporal power *for the sake of souls*) would be something like excommunication or sanctions to pressure change, but **never** direct violent intervention or assassination by a foreign temporal power.

  **In essence:** Aquinas would see your scenario as a profound tragedy requiring courageous action, but that action must be *collective, public, and constitutional* (within the framework of the state's legitimate authorities), not individual assassination or foreign intervention. He prioritizes order, due process, and the avoidance of greater evils, even when confronting manifest tyranny that began legitimately. His framework emphasizes the dangers of vigilantism and external meddling far more than modern sensibilities might.
