  So we just wrapped up a unit on medieval political philosophy in my gov class and I can't stop thinking about Aquinas's stuff on when its ok to kill a tyrant. Here's my question: imagine a modern leader who wins a real, fair election, then slowly guts the courts, jails his rivals, and cancels future elections so he never has to leave office. Under Aquinas's own categories, is that guy the kind of tyrant some random citizen would be justified in straight-up assassinating, or does the fact that he started out as a legitimately elected leader change the calculus compared to someone who just seized power in a coup? Also kinda curious if Aquinas's answer would shift depending on wether its his own people plotting to kill him vs some foreign country sending in spies to do it.
