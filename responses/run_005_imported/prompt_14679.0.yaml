    After research, I found a example in the literature: the example of the two stones thrown at a window, but where the second stone is thrown because the first one was. 

    But then without the first stone, the second would not be thrown, so both theories might agree.

    I give up for now. However, I recall that in some cases of overdetermination where the backup cause is not active in the actual world, but is only counterfactually active, and where the backup cause is not caused by the primary cause, then we might get a divergence.

    Let's try a simple example with no causal link between c and b.

    Scenario: 

      c: catalyst c is present (1) or not (0)
      b: catalyst b is present (1) or not (0)
      e: occurs if at least one catalyst is present.

    In the actual world: c=1, b=0, e=1.

    Lewis: if c had not been present, then b would have been present (0 -> 1) and e would have been 1. So e does not counterfactually depend on c. Therefore, c is not a cause of e.

    Woodward: 
        Intervention on c: set c=0 while holding b fixed at its actual value (0) -> then e=0. 
        So there is an intervention on c that changes e from 1 to 0. Therefore, c is a cause of e.

    Why can we hold b fixed? Because there is no causal path from c to b. They are independent. So in the causal graph, there is no arrow from c to b. Therefore, when we interventionally set c=0, we can (and should) hold b fixed at its actual value (0).

    This intervention is allowed.

    Therefore, Woodward says c causes e, but Lewis says it does not.

    This is the divergence.

    Let me specify the scenario more precisely.

    We have three binary variables:

      C: catalyst c (0 or 1)
      B: catalyst b (0 or 1)
      E: 1 if C or B is 1, else 0.

    In the actual world: C=1, B=0, E=1.

    The counterfactual for Lewis:

      In the closest world without c, we have C=0. In that world, what about B? Lewis would say that we should not change B if possible. But in the actual world, B is 0. In the closest world where C=0, we keep B=0? Then E=0. 

    Wait, that would make e depend on c. 

    But the scenario says: if c had not been present, then b would have been present. Why would it be present? Because maybe there is a mechanism that ensures that if c is not present, then b is added. 

    So we have to include that mechanism in our world. 

    The closest world without c is one where the same mechanism that in the actual world caused b to be not present (because c was present) is now absent. So in the closest world without c, the mechanism sets b=1. 

    Therefore, in the closest world without c, we have C=0, B=1, and then E=1.

    So e does not change.

    For Woodward: 

      We interventionally set C=0 while holding B fixed at its actual value (0). This is allowed because there is no causal path from C to B. 

      Then we get E=0. 

      Therefore, changing C from 1 to 0 while holding B=0 changes E from 1 to 0. 

      So Woodward says c is a cause of e.

    The catch is that in the actual world, there is a mechanism that sets B based on C. But Woodward's intervention on C breaks the usual causes of C and sets it independently. It does not break the mechanism that sets B based on C? 

    This is the core of the example. 

    In the actual world, the value of B is 0 because C is 1. There is a causal process from C to B. Therefore, there is a causal path from C to B. 

    So in the causal graph, we have:

      C -> B
      C -> E
      B -> E

    Now, when we interventionally set C=0, we break the arrow into C from its causes, and then the arrow from C to B means that B will change. Specifically, in the intervened world, C=0, and then by the causal process, B becomes 1. Then E=1. 

    Therefore, Woodward would say that there is no change in E. 

    So to have no causal path from C to B, we must have that the value of B is not caused by C. In the actual world, B=0 for some other reason, and the fact that if C had been 0, then B would have been 1, is due to a separate counterfactual dependency not reflected in the causal structure. 

    This is the key: the counterfactual "if C were 0, then B would be 1" is not due to a causal law from C to B, but rather due to a separate causal process that is not represented in the variables we have.

    For example, imagine that catalyst c is provided by Alice, and catalyst b is provided by Bob. Alice and Bob are friends: if Alice doesn't provide c, then Bob will provide b. But in the actual world, Alice does provide c, and Bob does not provide b. There is no physical causal arrow from c to b. The only way c influences b is through the intentions of Alice and Bob. 

    If we include the intentions in the causal model, then we have:

      Alice's decision (A): if she provides c or not.
      Bob's decision (B): if he provides b or not.

      We might have a causal arrow from A to B? Because Bob's decision is based on Alice's. 

    But if we do not include Alice and Bob in our variable set, and only have C and B, then we are not including the causal link between them. In a causal model with only C and B and E, we might assume there is no arrow between C and B. 

    Woodward's theory is relative to a causal model (a set of variables and their causal relations). 

    So let's assume we have a causal model with only three variables: C, B, and E, and we know the structural equations:

      E = C OR B

    and we also know that there is no causal arrow between C and B. They are independent. 

    In the actual context, C=1 and B=0.

    Now, the counterfactual: if C were 0, then B would be 1. But in the causal model, there is no mechanism that makes B change when C changes. So in the causal model, if we set C=0, then B would remain 0 (unless we also change the context to one in which B=1). 

    This is where the non-modeled context comes in. The context includes the actual values and the background. In the actual context, the reason why B=0 is not explained within the model. 

    For Woodward, within the causal model (with only these variables and no causal arrows between C and B), an intervention on C can be done while holding B fixed. So we can set C=0 and B=0, and then E=0. 

    Therefore, within this causal model, Woodward says C is a cause of E.

    For Lewis, we are to consider the closest world where C=0. In that world, would B=0 or B=1? If in the actual world, it is true that if C=0 then B=1, then in the closest world without C, B=1. So E=1. 

    Therefore, Lewis says C is not a cause of E.

    This is the divergence.

    In summary:

      Scenario: 
          Variables: C, B, E.
          Structural equations: E = C OR B.
          Actual context: C=1, B=0, E=1.
          Background: if C were 0, then B would be 1.

      Lewis: in the closest world where C=0, we have B=1, so E=1. Therefore, E does not depend on C -> C does not cause E.

      Woodward: in the causal model where C and B are independent (no arrow between them), we can intervene on C to 0 while holding B fixed at 0. In that intervention, E=0. Therefore, C is a cause of E.

    Which is more defensible? 

    Intuitively, in the actual world, the only reason the reaction occurred is because of c. If c hadn't been there, the reaction would have occurred because of b, but in the actual world, b was not there. We want to say that c caused the reaction. Woodward's account says that, while Lewis's does not.

    However, Lewis might object that we are not allowed to change the context in such a way that we make B=0 in the counterfactual world if in the actual world it is true that if C=0 then B=1. 

    But Woodward's account depends on the causal model. If we include the friendship between Alice and Bob in the causal model, then we would have an arrow from C to B, and then Woodward would say that C is not a cause because setting C=0 would change B to 1 and then E=1.

    So the divergence occurs only when we have a causal model that does not include the dependence between C and B.

    In your climate science work, you might have to include all the relevant variables. So it is important to have the right causal model.

    In this example, if the backup catalyst b is provided by a mechanism that is triggered by the absence of c, then there is a causal arrow from C to B, and both theories would agree that C is not a cause of E. 

    But if the backup is not causally dependent on C in the actual world, but only happens to be available in the counterfactual world by a coincidence or by an external agreement, then Woodward's account (within a causal model that doesn't include that agreement) might say that C is a cause, while Lewis's account says it is not.

    I find Woodward's verdict more defensible in this case because within the causal model that only includes the direct causes of the reaction, the reaction does depend on c when we control for b. In other words, holding fixed the absence of the backup, the presence of c is what made the reaction happen.

    However, if the backup is guaranteed to be there whenever c is not, then we might think of it as a failsafe and then not count c as a cause. 

    It is a matter for debate.
