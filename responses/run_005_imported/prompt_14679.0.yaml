  ### Divergent Causal Verdicts: Lewis vs. Woodward  
  I will construct a scenario where David Lewis's counterfactual theory and James Woodward's interventionist theory yield conflicting verdicts about whether a candidate cause \(c\) caused an effect \(e\). The scenario is adapted from classic cases of **preemptive overdetermination** but refined to exploit key differences in how each theory handles counterfactuals and interventions.  

  #### Scenario: The Backup Detonator  
  **Description**:  
  - A bomb is placed in a building. The bomb explodes (\(e\)) if *either* of two detonators, \(c\) (primary) or \(b\) (backup), is activated.  
  - In the actual world:  
    - Terrorist A activates detonator \(c\) at time \(t_1\), triggering the bomb.  
    - Terrorist B, stationed nearby, *would have* activated backup detonator \(b\) at \(t_2\) (where \(t_2 > t_1\)) if \(c\) had not been activated.  
    - However, because \(c\) is activated at \(t_1\), the bomb explodes at \(t_1\), and B never activates \(b\).  
  - **Candidate cause \(c\)**: Activation of the primary detonator.  
  - **Effect \(e\)**: Explosion of the bomb at time \(t_1\).  

  **Key Features**:  
  - \(e\) occurs at \(t_1\) due to \(c\).  
  - If \(c\) had not occurred, \(b\) would have been activated at \(t_2\), causing \(e\) at \(t_2\) (same explosion outcome, but later).  
  - There is no direct causal link between \(c\) and \(b\); B’s backup plan is a counterfactual dependency, not a physical mechanism.  

  ---

  ### Application of Lewis's Theory  
  **Lewis's core principle**:  
  > \(c\) causes \(e\) iff \(e\) *counterfactually depends* on \(c\): If \(c\) had not occurred, \(e\) would not have occurred.  

  **Analysis**:  
  - Consider the closest possible world where \(c\) does not occur (primary detonator not activated).  
    - In this world, Terrorist B activates backup detonator \(b\) at \(t_2\), causing the bomb to explode at \(t_2\).  
    - The explosion \(e\) (as defined) occurs, but at \(t_2\) instead of \(t_1\).  
  - Lewis treats \(e\) as a **coarse-grained event** (e.g., "bomb explodes" simpliciter, not "bomb explodes at \(t_1\)").  
    - Since \(e\) (explosion) still occurs in the absence of \(c\) (albeit later), \(e\) does *not* counterfactually depend on \(c\).  
    - **Verdict**: \(c\) is *not* a cause of \(e\).  

  **Feature doing the work**:  
  - **Coarse-grained event individuation**: Lewis evaluates counterfactuals based on whether the *type* of event \(e\) (explosion) occurs, ignoring specific details like timing.  
  - **Preemption handling**: Lewis’s theory struggles with preemption unless \(e\) is fine-grained to include details (e.g., "explosion at \(t_1\)"). Here, \(e\) is coarse-grained, so the backup \(b\) "masks" \(c\)’s causal role.  

  ---

  ### Application of Woodward's Theory  
  **Woodward's core principle**:  
  > \(c\) causes \(e\) iff there exists a possible *intervention* on \(c\) that changes \(e\) (or its probability), while holding fixed off-path variables not causally downstream of \(c\).  

  **Analysis**:  
  - Define variables:  
    - \(C = 1\) if primary detonator activated, \(0\) otherwise.  
    - \(B = 1\) if backup detonator activated, \(0\) otherwise.  
    - \(E = 1\) if bomb explodes, \(0\) otherwise.  
  - Structural equations:  
    - \(E = 1\) if \(C = 1\) or \(B = 1\) (either detonator triggers explosion).  
  - **Intervention on \(c\)**:  
    - Hold fixed \(B\) at its actual value (\(B = 0\), since \(b\) was not activated).  
    - Intervene to set \(C = 0\).  
    - Result: \(E = 0\) (no explosion).  
  - The intervention changes \(E\) from \(1\) (actual) to \(0\) (under intervention), so \(c\) affects \(e\).  
  - **Verdict**: \(c\) *is* a cause of \(e\).  

  **Feature doing the work**:  
  - **Interventionist manipulation**: Woodward requires testing \(c\)’s effect via hypothetical interventions that isolate \(c\)’s direct influence.  
  - **Off-path holding fixed**: Since \(B\) (backup) is not causally downstream of \(C\) (no arrow \(C \rightarrow B\)), it is held fixed at \(B = 0\). This "controls for" the backup, revealing \(c\)’s necessity in the actual scenario.  

  ---

  ### Why the Theories Diverge  
  1. **Event individuation**:  
     - Lewis uses coarse-grained \(e\) ("explosion"), allowing the backup to satisfy \(e\)’s occurrence without \(c\).  
     - Woodward fixes variables off the causal path (\(B\)), isolating \(c\)’s role in the actual world.  
  2. **Handling preemption**:  
     - Lewis’s counterfactual asks, "Would \(e\) occur without \(c\)?" and answers yes (due to \(b\)).  
     - Woodward’s intervention asks, "If we *force* \(c\) off while keeping other conditions actual (no backup), does \(e\) change?" and answers no.  
  3. **Backup dependency**:  
     - The backup \(b\)’s activation is a *counterfactual fact* (if \(c\) fails, \(b\) activates), not a physical effect of \(c\). Woodward’s intervention holds \(B\) fixed because there is no causal path \(C \rightarrow B\), while Lewis’s closest-world semantics "activates" the backup.  

  ---

  ### Which Verdict Is More Defensible?  
  **Woodward’s verdict** (\(c\) causes \(e\)) is more defensible for three reasons:  
  1. **Actual-world relevance**:  
     - In the actual world, \(b\) was *never activated*; \(e\) occurred solely due to \(c\). Holding \(B = 0\) in interventions mirrors this reality, making \(c\) necessary for \(e\) *in the actual causal context*.  
  2. **Preemption sensitivity**:  
     - Lewis’s theory yields counterintuitive results in preemption cases by ignoring *how* \(e\) occurs. Woodward’s focus on interventions captures \(c\)’s actual contribution.  
  3. **Scientific practice alignment**:  
     - In fields like climate science (e.g., extreme-event attribution), we "hold fixed" non-actualized backups (e.g., natural variability) to isolate anthropogenic forcing. Woodward’s approach formalizes this.  

  **Caveat**:  
  - Lewis’s verdict can be salvaged by fine-graining \(e\) (e.g., "explosion at \(t_1\)"). But if \(e\) is coarse-grained (as in standard applications), Woodward’s interventionism better handles preemption.  

  ### Conclusion  
  The theories diverge due to **Lewis’s coarse-grained event individuation** versus **Woodward’s variable-fixing in interventions**. Woodward’s verdict is superior for capturing actual causal contributions in preemption scenarios, making it more aligned with scientific and intuitive reasoning. This mirrors your climate work: "Rerunning the model without forcing" is a Woodwardian intervention that holds fixed non-actualized causes (e.g., natural drivers), revealing anthropogenic forcing’s causal role.
