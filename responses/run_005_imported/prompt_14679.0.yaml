    Alternatively, Woodward might say that we should hold fixed the variable B at its actual value (0) when we interventionally set C=0. But then we have C=0 and B=0, and then E=0. This is the intervention that changes E. 

    But is this intervention allowed? Woodward says we hold fixed variables that are not on a path from C to E. Here, B is not on the path from C to E? In the causal graph, there is a direct arrow from C to E and from B to E. There is no path from C to E that goes through B. So B is not on the causal path from C to E. Therefore, we are allowed to hold B fixed.

    So there are two possible interventions on C:

      (1) Set C=0 and let the other variables (D and then B) change naturally -> then B becomes 1 and E=1.
      (2) Set C=0 and also set B=0 (by an additional intervention on B) -> then E=0.

    But Woodward only requires that there exists some intervention that changes E. The intervention in (2) is an intervention on C and on B. We are not allowed to intervene on B arbitrarily? 

    Woodward's definition requires an intervention on C alone, while holding fixed other variables not on the path from C to E at their actual values. In this case, the actual value of B is 0. So if we can hold B fixed at 0 while we interventionally set C to 0, then we get E=0. 

    But can we hold B fixed at 0 while setting C to 0? That means we are preventing the lab assistant from adding b. That is, we are intervening on B as well. 

    This is a point of Woodward's that is delicate: the intervention on C must be such that it does not affect B except through variables that are on the causal path from C to E. In this case, setting C to 0 should not affect B if we are to test the direct effect. But in the actual setup, setting C to 0 does affect B (through D). So to hold B fixed, we would have to break the arrow from C to B? 

    Woodward's intervention on C is defined to break the arrows into C from its usual causes, but it does not break the arrows out of C. So when we set C=0, it will affect D and then B. 

    Therefore, we cannot hold B fixed at 0 while doing an intervention on C without also intervening on B. And if we interventionally set B=0, then that is a second intervention. 

    Woodward's definition does not require a single intervention that changes only C and nothing else? It requires that there is a possible intervention on C (which may involve setting other variables to specific values by additional interventions if needed) such that when we change C, E changes, provided that the only thing we do is set C and set any off-path variables to their actual values. 

    Specifically, the intervention on C should not change any other variable except along the causal path from C to E. But in this case, there is a causal path from C to B (via D) and then to E. So B is on a causal path from C to E. Therefore, we are not allowed to hold B fixed? 

    This is complex. 

    According to Woodward, if there is a causal path from C to E that goes through B, then B is on the causal path and should not be held fixed. 

    In our example, there is a direct path C->E and also an indirect path C->D->B->E. So B is on a causal path from C to E. Therefore, when we interventionally change C, we must let B change as well. 

    Therefore, in the intervention on C (set to 0), we have to let B become 1, and then E=1. So Woodward would say that changing C does not change E. Therefore, C is not a cause of E.

