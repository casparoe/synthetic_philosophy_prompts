    But note: we want to see if c caused e, even though e would have occurred anyway (via b) without c.

    However, in Lewis's theory, we must be careful: Lewis requires that the effect counterfactually depends on the cause. In this case, without c, e would still have occurred (because of b). So Lewis would say that c does not cause e? 

    But wait: Lewis has a way out for preemption. He allows for stepwise dependence. In early preemption, we can break the causal chain into steps and show that even though the final effect does not depend on the cause, an intermediate step does.

    Let's design a scenario with an intermediate step.

  Example:

    Suppose we have two assassins, Alice (c) and Bob (b), both set to kill the victim (e). Alice shoots first and her bullet kills the victim. Bob, who was about to shoot, sees that the victim is already dead and does not shoot.

    Without Alice's shot (c), Bob would have shot and killed the victim (so e would still have occurred). Therefore, the victim's death (e) does not counterfactually depend on Alice's shot (c). However, we still want to say that Alice's shot caused the death.

    Lewis handles this by looking at an intermediate event: the victim being hit by Alice's bullet. Let d be the event: the victim is hit by Alice's bullet at time t. Then:

