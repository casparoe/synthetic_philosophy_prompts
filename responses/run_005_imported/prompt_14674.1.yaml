  But we must consider counterpoints. Douglass supported assimilation and sometimes prioritized strategic pragmatism. However, his universalist principles consistently outweighed these considerations when core rights were at stake. His defense of Chinese immigrants despite popular opposition suggests he wouldn't bend to nativist pressures here.

