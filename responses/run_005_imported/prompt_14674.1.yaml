  First, I need to establish Douglass's constitutional hermeneutics. His break from Garrison pivoted on textual fidelity - rejecting framers' intent in favor of the document's actual language. Key evidence points: his emphasis on the Constitution's avoidance of "slave/slavery" terminology, his Preamble argument ("We the people"), and his Fourteenth Amendment advocacy. His later "Composite Nation" speeches show extension of these principles to migration rights.

