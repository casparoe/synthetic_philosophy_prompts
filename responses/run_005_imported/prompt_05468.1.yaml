prompt: |-
  In the graduate seminar on philosophy of mathematics I am currently teaching, we have reached the point in the syllabus where students tend to assume that, having learned that intuitionists reject the law of excluded middle (LEM) and read the logical connectives along Brouwer–Heyting–Kolmogorov lines, they now understand the limits of what a constructivist can make use of. I would like to disabuse them of this using a genuinely surprising result, due independently to Diaconescu and to Goodman and Myhill: in an otherwise constructive set theory such as IZF, the full, unrestricted axiom of choice is on its own sufficient to derive LEM. Most students find this bizarre on first hearing it, since choice looks like the most constructively flavored axiom on offer — it merely asserts that one can make an explicit selection from a family of nonempty sets, which sounds like exactly the sort of "produce the object" demand a constructivist ought to welcome, rather than a covert way of reintroducing classical logic.

  For next week's session, I would like your help drafting a handout that does two things. First, give a fully explicit example of the underlying construction: for an arbitrary, undecided proposition P, specify the actual sets or family involved, state exactly where and how the choice principle is invoked, and spell out, step by step, the case analysis by which one extracts a proof of P ∨ ¬P from the resulting choice function. I want the actual objects and the actual case split laid out clearly enough that a first-year graduate student could follow every step, not a gesture at the existence of "some slick argument." Second, address a question on which two of my colleagues in the mathematics department currently disagree: is the axiom of choice itself really the source of the non-constructivity here, or is it more accurately diagnosed as a symptom of allowing unrestricted separation (forming a set from an arbitrary, possibly undecidable predicate) in the background theory? Bring in how a predicative constructive set theory such as CZF, which restricts separation to bounded formulas while still validating choice-like principles without collapsing into LEM, bears on this diagnosis — and then tell me whether, in light of all this, you regard the slogan "the axiom of choice is intuitionistically suspect" as fair, or as somewhat misleading.
reasoning: |-
  We are going to demonstrate Diaconescu's theorem (also known as the Goodman-Myhill theorem) in an intuitionistic set theory such as IZF (Intuitionistic Zermelo-Fraenkel). The theorem states that the Axiom of Choice (AC) implies the Law of Excluded Middle (LEM) in such a setting.

  Step 1: Setting up the problem
  Let P be an arbitrary proposition. Our goal is to prove P ∨ ¬P using the Axiom of Choice.

  Step 2: Constructing two sets
  We define two sets A and B as follows:
    A = { x ∈ {0,1} | x = 0 ∨ P }
    B = { x ∈ {0,1} | x = 1 ∨ P }

  Note: {0,1} is a set with two distinct elements, say 0 and 1. The sets A and B are defined by separation (comprehension) using the predicates (x=0 ∨ P) and (x=1 ∨ P) respectively.

  Observation:
  - Since 0 ∈ {0,1} and 0=0 is true, then 0 ∈ A (because we have 0=0, so the disjunction holds regardless of P). Similarly, 1 ∈ B because 1=1 is true.
  - Therefore, both A and B are nonempty.

  Step 3: Forming the product set and applying AC
  Consider the family of sets {A, B}. This is a set (by pairing) and both A and B are nonempty. The Axiom of Choice (in its set form) says that there exists a choice function f defined on {A, B} such that:
    f(A) ∈ A   and   f(B) ∈ B.

  Since f(A) is in A, and A ⊆ {0,1}, we have f(A) ∈ {0,1}. Similarly, f(B) ∈ {0,1}.

  Step 4: Analyzing the choice function
  We now consider the value of f(A) and f(B). There are a few cases, but note that the definition of A and B depends on P.

  Case 1: f(A) = f(B)
  Since f(A) ∈ A, we have that f(A)=0 ∨ P. Similarly, f(B)=1 ∨ P.
  If f(A) = f(B), then let c = f(A) = f(B). Then we have:
    (c=0 ∨ P) and (c=1 ∨ P)
  Now, consider the two subcases for c:
    - If c=0, then we have (0=1 ∨ P) from the condition for B. But 0=1 is false, so we must have P.
    - If c=1, then we have (1=0 ∨ P) from the condition for A. Similarly, 1=0 is false, so we must have P.
  Therefore, if f(A)=f(B), then P holds.

  Case 2: f(A) ≠ f(B)
  We have two possibilities for f(A): 0 or 1, and similarly for f(B). But note that if they are different, then one must be 0 and the other 1.

  Subcase 2a: f(A)=0 and f(B)=1.
    Since f(A)=0, then from the definition of A we have 0=0 ∨ P -> which is always true. But note that we have 0 in A, but that doesn't tell us about P.
    Similarly, f(B)=1: 1=1 ∨ P -> always true.

  But wait, this case doesn't directly give us P. However, we have to consider the implications of having a choice function that picks 0 from A and 1 from B.

  Subcase 2b: f(A)=1 and f(B)=0.
    Similarly, this doesn't directly tell us about P.

  But note: we have an alternative. We are going to show that if f(A) ≠ f(B), then we can prove ¬P.

  Assume P holds. Then what happens to A and B?
    If P holds, then A = { x ∈ {0,1} | x=0 ∨ True } = {0,1}.
    Similarly, B = {0,1}.
    So A = B = {0,1}. But then the choice function f must satisfy f(A) ∈ A and f(B) ∈ B, but since A=B, we have f(A) and f(B) both in {0,1}. However, note that the function f is defined on the set {A, B}. If A=B, then the set {A, B} is actually a singleton {A} (because A=B). Therefore, the choice function f would have only one value: f(A) (and f(B) is the same element). Thus, we must have f(A)=f(B). This contradicts the assumption that f(A)≠f(B).

  Therefore, if f(A) ≠ f(B), then we must have that P is false, i.e., ¬P.

  Step 5: Putting it together
  We have two cases:
    Case 1: f(A)=f(B) → P
    Case 2: f(A)≠f(B) → ¬P

  Therefore, we have P ∨ ¬P.

  But note: we don't know which case holds. However, the disjunction P ∨ ¬P is established because in the first case we get P and in the second we get ¬P.

  This completes the proof.

  Now, to the second part: is the Axiom of Choice the real culprit, or is it the unrestricted separation?

  In the above proof, we used separation to form the sets A and B. The predicates used were (x=0 ∨ P) and (x=1 ∨ P). These predicates are not bounded (in the sense of being Δ0) because P is an arbitrary proposition. In a predicative constructive set theory like CZF (Constructive Zermelo-Fraenkel), separation is restricted to bounded formulas (and also other forms of comprehension are allowed, such as via the subset collection axiom). Therefore, in CZF, we cannot form the sets A and B arbitrarily for an arbitrary P.

  In CZF, the Axiom of Choice does not imply LEM. In fact, CZF is compatible with the existence of choice functions for sets that are appropriately presented (for example, when the family of sets is given by a set-indexed collection and each set is inhabited). Moreover, CZF has the "Presentation Axiom" (which says that every set is the surjective image of a projective set, and projective sets are those that admit choice functions) and this does not entail LEM.

  Therefore, the real issue is the combination of full separation and the Axiom of Choice. Unrestricted separation allows us to form sets using arbitrary predicates (even undecidable ones) and then the Axiom of Choice can be used to extract information that might not be constructively available.

  Thus, the slogan "the axiom of choice is intuitionistically suspect" might be misleading. In the context of a set theory with full separation, AC does lead to classical logic. However, in a more predicative setting (like CZF) or in type theories (like Martin-Löf type theory) where the formation of sets is controlled, AC is often acceptable and even provable for certain types of families.

  In fact, in Martin-Löf type theory, the Axiom of Choice is a theorem (for sets in the type-theoretic sense) and does not entail LEM. The key difference is that the sets in type theory are not defined by arbitrary separation but by inductive definitions and with a clear understanding of what it means to be an element.

  Therefore, the problem is not the Axiom of Choice per se, but the combination of AC with the full power of classical set formation (via unrestricted separation). In a constructive setting that is predicative, AC is not only acceptable but sometimes even necessary for constructive mathematics.

  Conclusion: The slogan "the axiom of choice is intuitionistically suspect" is somewhat misleading. It is more accurate to say that the combination of AC with unrestricted separation (as in IZF) is non-constructive. In a predicative constructive framework, AC (in a suitably formulated version) can be constructive.

  Thus, the diagnosis is that unrestricted separation is the primary source of the non-constructivity, and AC is the catalyst that allows the extraction of LEM from the sets formed by such separation.
answer: |-
  Below is a handout designed for your graduate seminar, presenting Diaconescu's theorem (independently discovered by Goodman and Myhill) and addressing the philosophical debate about the role of the axiom of choice (AC) in constructive mathematics. The first section provides a step-by-step proof for deriving the law of excluded middle (LEM) from AC in a constructive set theory like IZF. The second section analyzes whether AC or unrestricted separation is the root cause of non-constructivity, drawing on predicative systems like CZF.

  ---

  ### **Handout: The Surprising Link Between Choice and Excluded Middle**

  #### **I. The Core Construction: How AC Implies LEM**
  Let \(P\) be an arbitrary undecided proposition (i.e., we have no proof of \(P\) or \(\neg P\)). We will construct two sets \(A\) and \(B\) such that applying AC to the family \(\{A, B\}\) forces a decision for \(P \lor \neg P\). Assume a constructive set theory (e.g., IZF) with full separation and AC.

  **Step 1: Define the sets \(A\) and \(B\)**  
  - Let \(\mathbf{2} = \{0, 1\}\) be a set with two distinct elements.  
  - Define:  
    \[
    A = \{ x \in \mathbf{2} \mid x = 0 \lor P \}, \quad  
    B = \{ x \in \mathbf{2} \mid x = 1 \lor P \}.
    \]  
    (Both sets use **unrestricted separation**: they isolate elements of \(\mathbf{2}\) satisfying a predicate involving \(P\).)  

  **Observations**:  
  - \(0 \in A\) since \(0 = 0\) (so \(0 = 0 \lor P\) holds). Similarly, \(1 \in B\) since \(1 = 1\). Thus, \(A \neq \varnothing\) and \(B \neq \varnothing\).  
  - If \(P\) is true, \(A = B = \mathbf{2}\) (since \(x = 0 \lor \text{true}\) and \(x = 1 \lor \text{true}\) hold for all \(x\)).  
  - If \(P\) is false, \(A = \{0\}\) and \(B = \{1\}\) (since \(x = 0 \lor \text{false} \iff x = 0\), and similarly for \(B\)).

  **Step 2: Apply the Axiom of Choice**  
  Consider the family of sets \(\mathcal{F} = \{A, B\}\). Since \(A\) and \(B\) are nonempty, AC provides a **choice function** \(f\) such that:  
  \[
  f(A) \in A \quad \text{and} \quad f(B) \in B.
  \]  
  As \(A, B \subseteq \mathbf{2}\), we have \(f(A), f(B) \in \{0, 1\}\). There are two cases:  

  **Case 1: \(f(A) = f(B)\)**  
  - Since \(f(A) \in A\), we know \(f(A) = 0 \lor P\).  
  - Since \(f(B) \in B\), we know \(f(B) = 1 \lor P\).  
  - Let \(c = f(A) = f(B)\). Then:  
    \[
    (c = 0 \lor P) \land (c = 1 \lor P).
    \]  
    - **Subcase \(c = 0\)**: From \(c = 1 \lor P\), we have \(0 = 1 \lor P\). But \(0 = 1\) is absurd (contradiction), so \(P\) must hold.  
    - **Subcase \(c = 1\)**: From \(c = 0 \lor P\), we have \(1 = 0 \lor P\). Again, \(1 = 0\) is absurd, so \(P\) holds.  
  - **Conclusion for Case 1**: \(f(A) = f(B) \implies P\).  

  **Case 2: \(f(A) \neq f(B)\)**  
  - Since \(\mathbf{2} = \{0,1\}\), we must have \(\{f(A), f(B)\} = \{0, 1\}\) (one is \(0\), the other is \(1\)).  
  - **Assume \(P\) holds**. Then \(A = B = \mathbf{2}\), so \(\mathcal{F} = \{A, B\} = \{\mathbf{2}\}\) is a singleton. But if \(A = B\), the choice function must satisfy \(f(A) = f(B)\) (as \(f\) selects from the same set \(\mathbf{2}\)). This contradicts \(f(A) \neq f(B)\).  
  - Thus, \(P\) leads to contradiction, so \(\neg P\) holds.  
  - **Conclusion for Case 2**: \(f(A) \neq f(B) \implies \neg P\).  

  **Step 3: Derive LEM**  
  - From Cases 1 and 2, we have:  
    \[
    \big( f(A) = f(B) \implies P \big) \land \big( f(A) \neq f(B) \implies \neg P \big).
    \]  
  - In constructive logic, \(f(A) = f(B) \lor f(A) \neq f(B)\) holds trivially (equality on \(\mathbf{2}\) is decidable).  
  - Thus, \(P \lor \neg P\) follows by case analysis.  

  **Summary**:  
  - **Sets used**: \(A = \{x \in \{0,1\} \mid x=0 \lor P\}\), \(B = \{x \in \{0,1\} \mid x=1 \lor P\}\).  
  - **AC invocation**: A choice function \(f\) for \(\{A, B\}\).  
  - **LEM extraction**: Deciding equality of \(f(A)\) and \(f(B)\) (which is constructive) forces \(P \lor \neg P\).

  ---

  #### **II. Diagnosis: Is AC or Unrestricted Separation to Blame?**
  The proof above uses AC, but it crucially relies on **unrestricted separation** to form \(A\) and \(B\) using the undecidable proposition \(P\). This raises a key question: Is AC inherently non-constructive, or is separation the culprit?

  ##### **A. The Role of Unrestricted Separation**
  - **Problem**: Separation allowed us to define \(A\) and \(B\) using \(P\) in the predicate. Since \(P\) is undecided, \(A\) and \(B\) are **not well-defined sets** constructively; they are "potential" sets whose properties depend on the truth of \(P\).  
  - **Consequence**: AC acts on these "non-constructive" sets, extracting information (\(f(A), f(B)\)) that smuggles in classical reasoning. AC is not the villain—it is applied *after* separation introduces non-constructivity.  

  ##### **B. Evidence from Predicative Constructive Set Theory (CZF)**
  CZF restricts separation to **bounded formulas** (i.e., formulas with quantifiers restricted to sets, written \(\Delta_0\)-formulas). Crucially:  
  - **CZF validates AC-like principles** (e.g., **Dependent Choice** or the **Presentation Axiom**) without entailing LEM.  
  - **Why?** In CZF, we *cannot define* \(A\) and \(B\) as above. The predicate "\(x = 0 \lor P\)" is not bounded (it has an unrestricted proposition \(P\)), so \(A\) and \(B\) are not sets. Without these sets, Diaconescu’s construction fails.  
  - **Example**: In CZF, if \(P\) is undecidable, there is no set containing "\(0\) if \(P\) holds" and nothing otherwise. Choice functions only apply to families of sets defined by bounded predicates, avoiding classical collapse.  

  ##### **C. Is AC "Intuitionistically Suspect"? A Verdict**
  - **Misleading slogan**: "The axiom of choice is intuitionistically suspect."  
  - **Nuanced truth**:  
    - In **impredicative systems** (like IZF), AC + unrestricted separation implies LEM. Here, AC *amplifies* non-constructivity introduced by separation.  
    - In **predicative systems** (like CZF or type theories), AC is often *constructively valid* and even a theorem (e.g., in Martin-Löf type theory).  
  - **Key insight**: AC merely says "if all sets in a family are nonempty, a choice function exists." Constructively, this is unobjectionable *if* the sets are well-defined. The issue arises when separation allows "non-constructive" sets (defined via undecidable predicates), turning AC into a tool for classical reasoning.  

  **Conclusion**: Unrestricted separation is the primary source of non-constructivity in Diaconescu’s theorem. AC is a catalyst, not the cause. The slogan should be:  
  > *"Unrestricted separation combined with choice leads to classical logic—but predicative choice is constructively benign."*  

  This explains why most constructive mathematicians accept countable or dependent choice in bounded contexts, while rejecting the "naive" AC of impredicative set theory.

  ---

  **Discussion Prompt for Students**:  
  - Why might a constructivist view AC as "constructive-friendly" in isolation?  
  - How does CZF’s treatment of separation reconcile AC with constructive principles?  
  - Does this result undermine the claim that AC is "intuitionistically valid"? Why/why not?  

  **Further Reading**:  
  - Rathjen (2005), *Constructive Set Theory and the Axiom of Choice*.  
  - Aczel & Rathjen (2010), *CZF: A Constructive Counterpart of ZF*.  
  - Martin-Löf (2006), *100 Years of Zermelo’s Axiom of Choice*.
