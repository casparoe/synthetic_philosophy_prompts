  First, I need to recall Burke's core tenets. His "partnership across generations" is indeed proto-longtermist in spirit, emphasizing duty to ancestors and descendants. But his methodology matters more here. Burke distrusted abstract rationalism, preferred concrete attachments, and valued prescription over calculation. 

