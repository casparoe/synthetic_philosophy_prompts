  But I mustn't ignore where they align. Burke cared about transmitting institutions intact to posterity. He'd support safeguarding civilization from nuclear war or pandemics as prudent trusteeship. That's meaningfully longtermist, just not "strong" in the Bostrom/Greaves sense.

