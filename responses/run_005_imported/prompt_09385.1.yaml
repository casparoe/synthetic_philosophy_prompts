prompt: |-
  Over a forty-year career in observational astrophysics I relied on Bayesian methods as a matter of course: computing posterior odds between competing models of stellar structure, updating parameter estimates whenever new survey data came in. I confess I had always taken for granted that the basic schema — evidence E confirms hypothesis H just when the posterior P(H|E) exceeds the prior P(H) — was doing genuine epistemological work rather than mere bookkeeping. Since retiring I've joined a small reading group that works through philosophy of science, and we recently spent a session on Clark Glymour's "problem of old evidence." It left me considerably more unsettled than I would have expected a decades-old objection to so well-established a formalism to manage.

  The example that keeps recurring in what I've read is the one closest to my own field: the anomalous advance of Mercury's perihelion, some 43 arcseconds per century beyond what Newtonian mechanics predicted, a discrepancy known and precisely measured decades before Einstein arrived at General Relativity, and still cited as one of that theory's most compelling early confirmations once Einstein showed GR entailed exactly that figure. The difficulty, as I understand it, is that if the datum was already known with certainty when the theory was proposed — P(E) was already 1 for any astronomer assessing GR in 1915 — then conditionalizing on E cannot move one's credence in H at all, since conditionalizing on a proposition one already assigns probability 1 leaves that credence exactly where it was. Taken at face value this seems to show that the Mercury result could not have confirmed General Relativity, which is about as direct a contradiction of settled scientific judgment as a piece of formal epistemology could produce.

  I gather Daniel Garber and Richard Jeffrey proposed a way out by denying that real reasoners are logically omniscient, so that what actually confirms the theory is not the old datum E itself but the newly acquired awareness that H entails E — a logical fact not previously worked out, and so not already certain. That move has a definite appeal, but it also strikes me as suspiciously convenient, and I believe I have seen at least a gesture in the literature toward the worry that the same trick should be replayable one level up: once a scientist has actually derived and absorbed the fact that H entails E, haven't they thereby become certain of that entailment too, so that the very proposition now doing the confirming work is itself "old evidence," threatening to go epistemically inert by the same argument that felled the naive account? I would be grateful for a philosopher's hand talking me through this: why exactly does old evidence pose a problem for naive Bayesian conditionalization in the first place, and does the Garber–Jeffrey move genuinely dissolve that puzzle, or does it just push the difficulty back to the level of logical learning, one step removed from where Glymour originally located it?
reasoning: |-
  Okay, let me start by unpacking this astrophysicist's query. They're deeply familiar with Bayesian methods from their career but are now grappling with the problem of old evidence after reading Clark Glymour. The Mercury perihelion example is central here—how could it confirm General Relativity if it was already known? 

  First, I need to recall the core issue: if P(E)=1, conditionalizing on E doesn't change P(H|E). The astrophysicist understands this but is troubled by the implications for scientific history. They mention the Garber-Jeffrey solution involving logical learning but worry it just kicks the can down the road. 

  Hmm, their real concern seems twofold: (1) Is the logical entailment move a legitimate fix or an ad hoc trick? (2) Does shifting to entailment just recreate the same problem at a higher level? I should break this down carefully. 

  Glymour's original argument feels like a bullet to bite—Bayesianism says Mercury data *can't* confirm GR, yet scientists know it did. That tension is what makes this philosophically juicy. The astrophysicist’s unease is spot-on; it challenges whether Bayesianism captures real confirmation. 

  Now, Garber-Jeffrey’s key insight: humans aren’t logically omniscient. When Einstein first *realized* GR entailed the anomaly, that was new info. So we’re not conditionalizing on E but on [H⊨E]. But the astrophysicist’s worry is sharp: once you know H⊨E, doesn’t *that* become certain too? Then wouldn’t updating on it later do nothing? 

  Ah, here’s the nuance. Garber-Jeffrey aren’t saying we update on the proposition "H⊨E" itself. They’re saying the *act of learning the logical relationship* changes our credences over a partition of possibilities. We’re redistributing probability across different ways H could relate to E. That’s different from just adding a new certain fact. 

  For example, before deriving it, Einstein might have thought GR *didn’t* entail the anomaly. Or been unsure. Learning it does entail E collapses those possibilities. Crucially, this isn’t about becoming certain of "H⊨E"; it’s that the logical discovery eliminates epistemic possibilities he hadn’t ruled out. 

  Is this "pushing back" the problem? Technically yes, but productively. Glymour showed conditionalization can’t handle old evidence if we’re logically omniscient. Garber-Jeffrey respond: "But we’re *not* omniscient—so here’s how learning works." The regress worry misses that the update happens via reconfiguring uncertainty about logical space, not stacking new certainties. 

  Still, the astrophysicist’s skepticism is healthy. One could argue this makes Bayesianism "cheat" by offloading work to logical ignorance. But that’s a feature, not a bug—it reflects how science actually progresses. When a theorist shows T entails E, that *is* when E becomes evidence for T, even if E was known. The math follows. 

  I should emphasize that without this move, Bayesianism would indeed be flawed. The Garber-Jeffrey approach isn’t just convenient; it’s necessary to align the formalism with scientific practice. The Mercury case *did* confirm GR precisely because Einstein demonstrated the entailment. Before that, the anomaly was just an unsolved puzzle. 

  ...Wait, is there a deeper itch here? Maybe the astrophysicist wonders whether Bayesianism, after all these patches, still captures "genuine" confirmation. But that’s a metaphysical swamp. Pragmatically, Garber-Jeffrey saves Bayesianism from Glymour’s counterexample. Philosophers might still debate alternatives (e.g., explanationist views), but for a working scientist, this solution holds up. 

  Final thought: The astrophysicist’s hands-on experience with Bayesian methods in practice makes their philosophical unease especially compelling. They’ve seen the math work—but now question its foundations. That’s exactly why Glymour’s problem bites. Reassuring them that Garber-Jeffrey resolves it *without* infinite regress feels key.
answer: |-
  Your unease is profoundly well-founded—the problem of old evidence strikes at the heart of Bayesian confirmation theory, and the Garber-Jeffrey solution, while ingenious, demands careful unpacking. Let me walk you through the conceptual layers.

  ### 1. **The Core Problem: Why Old Evidence Paralyzes Naive Conditionalization**
     - **The Bayesian Engine**: Confirmation occurs when \( P(H|E) > P(H) \). By Bayes' theorem:  
       \[
       P(H|E) = \frac{P(E|H) \cdot P(H)}{P(E)}
       \]
       If \( E \) is already known with certainty (\( P(E) = 1 \)), then \( P(H|E) = P(H) \)—*no confirmation occurs*.  
     - **The Mercury Pericenter Paradox**: By 1915, Mercury's anomaly (\( E \)) was precisely measured. Astronomers *knew* \( E \) (so \( P(E) = 1 \)). When GR entailed \( E \), Bayesian updating *should* leave \( P(\text{GR}) \) unchanged. Yet intuitively, \( E \) *did* confirm GR powerfully.  
     - **The Epistemic Collapse**: Glymour exposes a flaw: if all known evidence is assigned \( P(E) = 1 \), no future conditionalization on \( E \) can *ever* support a new theory. This clashes with scientific practice (e.g., Mercury/GR, cosmic microwave background confirming inflation).

  ### 2. **Garber-Jeffrey's Escape Hatch: Logical Non-Omniscience**
     - **The Key Insight**: Real agents aren't logically omniscient. Before Einstein, astronomers knew \( E \), but *did not know* that GR entailed \( E \). Let \( L \) be the proposition "GR entails \( E \)".  
     - **Updating on Logical Discovery**: When Einstein shows \( L \) is true, we update not on \( E \) itself, but on \( L \). The relevant likelihood is \( P(L|H, E) \):  
       * If \( H \) is GR, then \( H \vDash E \), so \( P(L|H, E) = 1 \) (since \( L \) is true given \( H \)).  
       * For rivals \( H' \) (e.g., Newton + hidden planets), \( P(L|H', E) \approx 0 \) (they *don’t* entail \( E \)).  
     - **Confirmation via \( L \)**: Even with \( P(E) = 1 \), learning \( L \) *can* boost \( P(H) \):  
       \[
       P(H|L, E) = \frac{P(L|H, E) \cdot P(H|E)}{P(L|E)} \propto P(H|E) \quad \text{(since \( P(L|H, E) = 1 \))}
       \]
       But crucially, \( P(L|E) < 1 \) *before* learning \( L \) (as the entailment wasn't known), so \( P(H|L, E) > P(H|E) \).

  ### 3. **Your Regress Worry: Does \( L \) Itself Become "Old Evidence"?**
     - **The Concern**: Once Einstein proves \( L \), \( P(L) \) becomes 1. Later scientists (knowing \( L \)) seem unable to use it for confirmation—recreating the original problem at a higher level.  
     - **Why This Misapplies the Framework**:  
       - **Temporal Indexing Matters**: Garber-Jeffrey's solution is *agent-relative* and *time-indexed*. For Einstein *at the moment of discovery*, learning \( L \) was informative because *his prior* \( P_{\text{old}}(L) < 1 \).  
       - **Later Agents**: A student *today* knows \( L \) from textbooks (\( P_{\text{now}}(L) = 1 \)). For them, \( L \) cannot confirm GR. But this is fine! Their confirmation of GR rests on *other* evidence (e.g., gravitational lensing, LIGO data).  
       - **The Crucial Point**: What does the work is *the act of discovering* \( L \) for the first time. Once absorbed, \( L \) becomes background knowledge—but the *historical* confirmatory power occurred during its discovery.

  ### 4. **Is This "Suspiciously Convenient"? A Balanced Verdict**
     - **Strengths**:  
       - **Psychologically Realistic**: Scientists *do* gain confidence when a theory entails known-but-unexplained data (e.g., GR/Mercury, Dirac predicting positrons).  
       - **Formally Coherent**: By modeling ignorance of logical relations, it resolves the paradox without abandoning conditionalization.  
       - **No Regress**: The update occurs when \( L \) is *first* learned. Subsequent certainty in \( L \) doesn't erase the historical confirmation.  
     - **Limitations**:  
       - **Shifts the Problem**: It moves confirmation from *empirical evidence* (\( E \)) to *logical discovery* (\( L \)). Some argue this conflates evidence with theoretical virtues (e.g., explanatory unification).  
       - **Formalization Challenges**: \( P(L|E) \) is subtle. If \( L \) is a *logical truth* (as \( H \vDash E \) is mathematical), shouldn’t \( P(L) = 1 \) always? Garber-Jeffrey bite the bullet: agents can assign \( P(L) < 1 \) if unaware of the proof.  
       - **Scope**: Doesn't address cases where \( E \) was *not* certain (e.g., data with measurement error).

  ### 5. **A Philosopher's Synthesis: Why This Works (and Why It Satisfies)**
  The Garber-Jeffrey move dissolves Glymour's paradox by rejecting **logical omniscience** as a norm for rational agents. For you, as a scientist:
  - **Pre-1915 State**: Astronomers knew \( E \) but had high \( P(\text{Newton} + \text{perturbations}|E) \). \( P(\text{GR}) \) was near 0.  
  - **1915 Breakthrough**: Learning \( L \) ("GR entails \( E \)") drastically raised \( P(\text{GR}|L, E) \) because:  
    \[
    \frac{P(\text{GR}|L, E)}{P(\text{Newton}|L, E)} \approx \frac{P(\text{GR}|E) \cdot 1}{P(\text{Newton}|E) \cdot \epsilon} \quad (\epsilon \approx 0)
    \]
  - **Why No Regress?** Once \( L \) is known, it becomes background. Future updates use *new* evidence (e.g., \( E_{\text{new}} = \) "light bends near the Sun"). The confirmatory power of \( L \) is *exhausted* upon its absorption—but its impact endures in the posterior.  

  **In essence**: Glymour exposed a flaw in *static* Bayesianism. Garber-Jeffrey fixed it by dynamic *logical learning*. While some philosophers (e.g., Earman, Sprenger) still debate alternatives, this remains the most compelling reconciliation of Bayesianism with scientific practice. Your career-long intuition—that Mercury’s perihelion *did* confirm GR—was right. Bayesianism, properly nuanced, needn't contradict that.
