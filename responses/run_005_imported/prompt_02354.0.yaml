  For the second part about order-independence, strict dominance relies on inequalities that remain strict even after eliminations. Weak dominance has ties, so eliminating one strategy can break the weak dominance of another. The beer-quiche game comes to mind as a counterexample. The key is that weak dominance allows indifference in some cases, which creates path dependence. 

  The user probably wants to avoid technical jargon. They mentioned their textbook's algebraic explanation isn't enough. So I should focus on storytelling with clear examples. Also, as a TA, they need to anticipate student follow-up questions, so the explanation must be robust. 

