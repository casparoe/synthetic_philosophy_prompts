  Now the core dilemma: modern astrologers assigned outer planets to signs, but Kepler rejected rulerships entirely. Would discovering new planets make him reconsider? Probably not. His 1619 rejection was philosophical, not due to lack of planets. He saw rulerships as arbitrary - whereas his aspects were mathematical truths. Adding planets wouldn't change that calculus. 

  The six-planet issue is trickier. His early Mysterium Cosmographicum model tied planets to Platonic solids, but by Harmonices Mundi he'd moved to harmonics. Still... that "six" lingered. I recall his letter about Saturn/Jupiter's conjunction cycle - he explicitly says harmony requires exactly six moving spheres. So new planets would break his core musical framework. 

  But here's the nuance: he might accept them as "non-harmonic" bodies. Like astronomical facts that don't participate in the cosmic music. Or perhaps he'd stretch his ratios to include them, but that would betray his own geometric rigor. 

  The user's really sharp to spot this tension between his aspect system (which could technically add points) and his planet count dogma. In seminar discussions, I'd emphasize how Kepler's later work still carried that six-planet assumption like invisible baggage. 

