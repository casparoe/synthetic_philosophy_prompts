  So for my history of science seminar we've been slogging through book 4 of Kepler's Harmonices Mundi, where he strips astrology down to basically nothing - no zodiac signs, no houses, no rulerships - and rebuilds it entirely around aspects, which he only accepts if they match a regular polygon you can actually construct with compass and straightedge (apparently that's why he's cool with the quintile and biquintile but throws out the septile, since a heptagon isn't constructible). Ok so here's what I can't figure out: modern astrologers treat Uranus, Neptune and Pluto as the "rulers" of Aquarius, Pisces and Scorpio, but none of those planets were even known in Kepler's lifetime. Given that he'd already chucked rulership out as a category entirely, do you think he'd be tempted to bring it back just to give the outer planets a job, or is that idea dead on arrival for him no matter what gets discovered later? And seperately - could his aspects-only harmonic system just absorb new planets fine as more points for trines and quintiles, or does his attachment to there being exactly six planets (from the nested Platonic solids in Mysterium Cosmographicum) cause a problem there too? Not really sure how those two threads of his thinking would actually interact, curious what your best reconstruction looks like.
