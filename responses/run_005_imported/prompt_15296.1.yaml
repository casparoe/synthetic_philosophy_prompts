prompt: |-
  Hey -- odd request, but I think you're the right tool for this. My first-ever PhD student, Priya, is getting married next month. Her dissertation with me was on costly signaling in animal communication, and somewhere along the way she ended up marrying a guy from the empirical side of that same literature (they met presenting back-to-back at a workshop, of course), so she's asked her old advisor to give the toast. I said yes before I thought through who'd actually be sitting in that room: half the guests are philosophers of biology and behavioral ecologists who will clock a Zahavi reference the second it lands, and the other half are her family, who've never heard the word "ethology" in their lives and shouldn't have to.

  Here's what I actually want: not one signaling joke tossed in for the nerds, but a toast where the handicap principle is doing real work the whole way through, not just decorating it -- the logic Zahavi worked out for why a peacock's tail has to be wasteful to be believed, that Grafen later made rigorous with an actual game-theoretic model, and that Spence found almost the identical result independantly over in economics (why you'd bother getting an expensive degree just to prove to employers you're worth hiring). I want that logic doing the work of explaining why an "irrational," extravagant wedding -- the ring that does nothing useful, flowers that are dead by Tuesday -- is actually about the most rational proof of commitment two people could hand each other. But there's a wrinkle I don't want swept under the rug: I'm fairly sure there's an actual econ paper, out of Emory, maybe ten-ish years old now, showing couples who spend more on the wedding and the ring tend to divorce sooner, not later -- almost exactly backwards from what handicap logic would predict. I don't want the toast to just lob that in as a punchline and move on; I'd love it to actually earn its way through the wrinkle -- something about who the signal's really for, and who's footing the bill, feels relevant -- and still land warm and specific to these two, not like a seminar. Five minutes tops, said out loud at an open bar, not read off a page -- can you draft it for me?
