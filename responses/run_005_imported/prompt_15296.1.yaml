answer: |-
  Here’s a toast that weaves the handicap principle into the fabric of Priya and her partner’s story while tackling the "Emory wrinkle" head-on—all in under 5 minutes, with warmth and no jargon. (I’ve noted delivery tips in parentheses where helpful):

  ---

  **(Clink glass, warm smile)**  
  Friends, family, colleagues—especially those who’ve ever debated whether a peacock’s tail is *really* about honest signaling… *(knowing glance toward academics)* …tonight we celebrate Priya and [Partner’s Name].  

  Priya once spent three years studying why animals make seemingly *wasteful* displays to prove their worth. Why sing till you’re exhausted? Why grow a tail so big it slows you down? Her work revealed something profound: **the cost *is* the point**. Only those truly committed can afford the sacrifice. It’s not about the tail—it’s about what the tail *costs*.  

  *(Lean in, conversational)*  
  Which brings us to… weddings. *(Gentle laugh)* The rings that don’t hunt, the flowers that wilt, the cake that’s gone by midnight. On paper? Wildly inefficient. But through Priya’s lens? Brilliant.  

  Because commitment is invisible. You can’t hold it in your hands. So how do you prove it? **You attach it to something costly**. Something that *hurts* to lose. You say, *"I’m all in—see how much I’m willing to risk?"* That’s the handicap principle: the extravagance *is* the evidence.  

  *(Pause, shift tone slightly)*  
  But—and Priya’s advisor can’t resist a footnote—there’s data. A study found that *more* expensive weddings sometimes correlate with *higher* divorce rates. Seems like the signal failed, right?  

  *(Soften)*  
  Here’s the catch: **who pays the cost, and who receives the signal?** If the burden isn’t shared, or if the display is for outsiders, not each other? The signal breaks. Debt for a ring *you* didn’t choose? A party to impress guests? That’s not a proof of commitment—it’s noise.  

  *(Turn to Priya and Partner)*  
  But you two? You’ve built your proof differently. I watched it.  
  - When Priya defended her thesis on starlings sacrificing calories to sing better… while surviving grad school ramen.  
  - When [Partner]’s fieldwork meant months apart… but he’d still video-call to troubleshoot her code.  
  - Choosing academia—a career where stability’s scarce—because you *both* believe in the work.  

  **Your real "costly signals" weren’t today’s flowers.** They were the thousand small sacrifices: sharing authorship, moving cities for each other’s jobs, trusting a future built on *us* over *things*.  

  *(Raise glass)*  
  So here’s to Priya and [Partner]. May your marriage be like the best behavioral ecology:  
  - **Costly enough** that only the truly committed would attempt it,  
  - **Rigorous enough** to withstand life’s peer review,  
  - And **joyful enough** to make every sacrifice feel like plumage.  
  Cheers!  

  ---

  ### Why This Works
  1. **Theories as Invisible Scaffolding**: Zahavi/Grafen/Spence logic drives the toast without naming them (except Zahavi via peacocks—unavoidable for insiders). The "Emory study" (Francis-Tan & Mialon 2014, btw) is acknowledged but reframed.  
  2. **Earning the Wrinkle**: It answers *why* lavishness fails when costs aren’t shared or signals aren’t mutual. Priya’s research becomes the key to interpreting the data.  
  3. **Personal Anchors**: Their specific sacrifices (ramen, long-distance, academia’s instability) *are* their authentic costly signals—more resonant than rings.  
  4. **Tone & Accessibility**:  
     - **For family**: "Rings that don’t hunt / flowers that wilt" makes abstraction visual.  
     - **For nerds**: "Code troubleshooting," "peer review," and "plumage" are Easter eggs.  
     - **Open-bar ready**: Short sentences, punchy metaphors, and emotional payoff.  

  *(Delivery tip: Punch "the cost is the point" and "debt for a ring you didn’t choose?" for emphasis. End "Cheers!" with eye contact to cue applause.)*  

  Let me know if you'd like a tweak toward humor, more partner-specific details, or a sharper pivot from theory to emotion!
