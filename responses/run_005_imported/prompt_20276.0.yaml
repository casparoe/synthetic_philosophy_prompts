answer: |-
  You're absolutely **not** being irrational, and your friend is misunderstanding how probability works over multiple independent events. Your feelings of high confidence on individual questions combined with low confidence in a perfect overall score are **perfectly logical and mathematically sound**. Here's why:

  1.  **The Power of Multiplication (The Law of Probability for Independent Events):** This is the core reason.
      *   Let's take your *lower* confidence estimate: 90% sure per question. That means you estimate a 10% (0.10) chance of being wrong on *any single* question.
      *   If the questions are independent (one answer doesn't affect another), the probability of getting *all 100 questions correct* is calculated by **multiplying** the individual probabilities together.
      *   Probability of being correct on Question 1: 0.90
      *   Probability of being correct on Question 2 *and* Question 1: 0.90 * 0.90 = 0.81
      *   Probability of being correct on all 100 questions: 0.90 * 0.90 * 0.90 * ... (100 times) = 0.90¹⁰⁰
      *   **0.90¹⁰⁰ is an incredibly small number.** It's approximately 0.00002656, or **0.002656%**. That means even with 90% confidence per question, you'd only expect a perfect score roughly 1 time in every 40,000 tests!
      *   Using your *higher* confidence estimate (95% sure):
          *   Probability of being correct on one question: 0.95
          *   Probability of being correct on all 100: 0.95¹⁰⁰ ≈ 0.00592, or **0.592%**. That's about a 1 in 169 chance. Still very low!

  2.  **Cumulative Risk of Error:**
      *   While the chance of being wrong on *any specific* question is small (5-10%), when you have 100 opportunities for that small error to occur, it becomes **highly probable that at least one error will happen somewhere**.
      *   Think of it like flipping a coin. The chance of getting heads on one flip is 50%. But the chance of getting heads *100 times in a row* is (0.5)¹⁰⁰ – astronomically small. You'd be very confident of getting heads on the *next* flip, but utterly confident you *won't* get 100 heads in a row. Your test is similar, just with much better odds per question.

  3.  **The Difference Between Individual and Collective Outcomes:**
      *   Your confidence on an *individual* question is about that *specific* piece of knowledge or reasoning. "I'm very sure about the date of the Treaty of Versailles."
      *   Your confidence about the *collective* outcome (a perfect score) is about avoiding *any single error* across *all 100 distinct pieces* of knowledge/reasoning. It's about perfection across a large sample size.
      *   Being highly confident about each individual component is completely compatible with having low confidence that *every single one* of them is flawless, especially when there are so many components.

  4.  **Realism and Self-Awareness:**
      *   Your intuition ("I definitely missed a few somewhere") aligns perfectly with the math. It reflects an understanding that maintaining perfect focus, recall, and reasoning across 100 separate challenges is incredibly difficult, even when you know the material well. Small slips, misinterpretations, or tricky questions are statistically likely to occur at least once.

  **Why your friend is wrong:**

  Your friend is falling into a common trap by **conflating confidence on individual events with confidence in a combined outcome of *all* those events being perfect.** They are assuming that:
  *   High confidence on each part *must* imply high confidence in the whole being perfect.
  *   Low confidence in the whole being perfect *must* imply low confidence on the parts.

  This is incorrect logic when dealing with probabilities and multiple independent events. The probability of a perfect collective outcome (all correct) is *not* the same as the average probability of individual success; it's the *product* of all the individual success probabilities, which rapidly diminishes as the number of events increases.

  **Conclusion:**

  Your thinking is **perfectly rational**. It's entirely consistent to be:
  *   **90-95% confident** you got **Question #1** right.
  *   **90-95% confident** you got **Question #2** right.
  *   ... (and so on for each question individually) ...
  *   **Less than 1% confident** (based on the math) that you got **all 100 questions** right simultaneously.

  Your high confidence per question reflects your knowledge. Your low confidence in a perfect score reflects a realistic understanding of probability, human fallibility, and the challenge of achieving absolute perfection across a large number of tasks. Your friend's argument sounds intuitive but doesn't hold up mathematically. Trust your instincts – they are correct!
