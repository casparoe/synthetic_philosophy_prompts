prompt: |-
  hey, I'm a comparative politics PhD student who somehow ended up on my department's grad admissions committee this year. We're mid-fight over how to read files. Current system: 2 readers per applicant, admit only if both rank them top-tier, disagreements get hashed out live. One of the formal theory people wants 5 readers per file with majority vote instead, basically running a condorcet jury theorem argument at us - if each reader is even slightly better than a coinflip at spotting who'll thrive here, 5 independent readers will track the truth way better then 2. Others are pushing back hard: our readers arent independent (same training, same rubric, we chat before meetings anyway), we can't check anyone's "competence" since we never see what happens to applicants we reject, and maybe "who'll thrive" isn't even a fact waiting to be detected in the first place.

  I got stuck drafting the recommendation memo for next week - switch, keep the current system, or something else, and why. Can you write it? Actually take a side and defend it, and engage with the strongest version of the skeptical objection rather than just listing considerations on both sides.
reasoning: |-
  Okay, the user is a PhD student in comparative politics who's on their department's admissions committee. They're caught in a debate about how to evaluate applicants. The current system uses two readers per application, requiring both to rank an applicant as top-tier for admission. Disagreements are discussed in meetings. Now, a formal theory scholar is pushing for five readers per file with majority rule, citing Condorcet Jury Theorem. This theorem suggests that if each reader is slightly better than random at identifying successful candidates, then five independent readers would make better decisions collectively. Others are skeptical, arguing that readers aren't independent due to shared training and discussions, and that it's impossible to verify individual reader competence since rejected applicants aren't tracked. Plus, there's a philosophical question about whether "who will thrive" is even an objective truth to uncover.

  The user needs to draft a memo recommending whether to keep the current system, switch to the five-reader approach, or propose something else. They want me to take a clear stance and defend it robustly, addressing the strongest counterarguments. 

  First, I should recall Condorcet Jury Theorem. It states that as the number of independent, competent voters increases, the majority decision is more likely to be correct. The theorem requires voters to be independent and each have a competence greater than 0.5. The formal theory person is using this to argue for five readers. But the critics point out that readers aren't independent due to shared training and pre-meeting discussions. Also, competence can't be measured because outcomes of rejected candidates are unknown. Moreover, the idea of a "correct" decision is questionable—success in grad school isn't just about inherent qualities but fit, mentorship, resources, etc.

  The user's deeper needs might include wanting a solution that's theoretically sound but also practical. They need to resolve committee conflict, ensure fairness, and make a defensible recommendation. They might also be concerned about workload—five readers per file could increase the burden significantly. Plus, there's the issue of whether the process truly captures potential or just reinforces existing biases.

  Weighing the options: Switching to five readers might seem better statistically, but the assumptions of independence and measurable competence are shaky. The current system requires unanimity, which might be too strict, leading to good candidates being missed. A compromise could be using three readers with a majority rule. This reduces the burden compared to five but adds more perspectives than two. It also avoids the all-or-nothing approach of the current system. Three readers could balance efficiency and robustness. 

  Addressing independence: Even with training, readers might have biases. Using three readers and mandating that they don't discuss before scoring could help. Disagreements could then be discussed in committee meetings. Competence can't be directly measured, but using rubrics and training could standardize evaluations. As for the "truth" of who will thrive, while it's not entirely objective, the department has criteria for success. The process should aim to assess fit and potential based on available data.

  The strongest counterargument is that without true independence and measurable competence, Condorcet doesn't apply. But even with some dependence, more readers reduce random errors. Also, the current system's unanimity might amplify individual biases. A majority system with three readers mitigates that. Workload is a valid concern, but three is more manageable than five. The compromise also keeps the discussion element for borderline cases, which adds nuance.

  So, the memo should recommend a three-reader majority system. It addresses the formal theory argument by adding more voices, counters skepticism by being practical, and improves on the current system by not requiring unanimity. The rationale should emphasize balancing theoretical insights with practical constraints, enhancing fairness without overburdening the committee.
answer: |-
  ## Memorandum: Recommendation on Graduate Admissions Evaluation Protocol  
  **To:** Department Admissions Committee  
  **From:** [Your Name], PhD Student, Comparative Politics  
  **Date:** October 26, 2023  
  **Subject:** Revising Reader System to Balance Robustness, Nuance, and Feasibility  

  ### Recommendation
  **Adopt a 3-reader system with majority rule (2/3 agreement required for admission), retaining live discussion for borderline cases (1/3 dissent).** This balances statistical robustness against the limitations of reader independence and the contested nature of "truth" in admissions, while remaining operationally feasible. The current 2-reader unanimity rule is abandoned due to its excessive stringency and vulnerability to individual bias. The proposed 5-reader Condorcet model is rejected as theoretically overfit and operationally impractical.

  ---

  ### Core Argument: Why 3 > 2 and 3 > 5  
  The formal theory argument for 5 readers relies on *idealized assumptions* that misrepresent our admissions ecology:  
  1.  **Independence is Compromised:** Readers share training, rubrics, and pre-meeting discussions. This creates correlated biases (e.g., department trends favoring certain methodologies or regions). Condorcet’s efficacy collapses with correlated errors—5 non-independent readers may amplify shared blind spots, not correct them.  
  2.  **"Competence" is Unmeasurable & Contested:** We lack outcome data for rejected applicants, making it impossible to calibrate individual reader "accuracy." More critically, *"who will thrive" is not an objective, detectable fact*. Success hinges on advisor fit, cohort dynamics, funding shifts, and evolving research interests—factors opaque at admission. Condorcet assumes a binary "truth"; our decision is a probabilistic judgment of *potential fit* in a complex system.  
  3.  **Operational Burden is Unsustainable:** 5 readers per file (500+ files?) would exhaust faculty goodwill, delay decisions, and likely reduce careful evaluation per reader. Quantity ≠ quality under constraints.  

  **The 2-reader system fails differently:**  
  - **High False-Negative Risk:** An excellent applicant atypical to one reader’s preferences (e.g., a qualitative scholar reviewed by a formal theorist) is rejected outright. Unanimity overly privileges outlier skepticism.  
  - **Amplifies Idiosyncrasy:** Two aligned readers with shared biases (e.g., undervaluing Global South institutions) can admit mediocre candidates fitting their mold while excluding stellar outliers.  

  ### Why 3-Reader Majority Rule is Superior  
  1.  **Mitigates Random Error & Bias:** Three readers reduce the impact of a single idiosyncratic judgment more effectively than two, without requiring unanimity. Majority rule (2/3) accepts applicants who resonate with multiple perspectives, increasing the chance they fit the *department’s pluralistic* environment.  
  2.  **Manages Correlated Bias Pragmatically:** While not perfectly independent, three readers still introduce more variance than two. Training + a clear rubric partially offsets correlation. Live discussion for split decisions (1 dissent) allows contextual nuance where Condorcet’s "mechanical" aggregation fails.  
  3.  **Acknowledges the Epistemology of Admissions:** We aren’t "detecting truth" but making a *collective judgment* about *potential*. Three perspectives offer a richer, though incomplete, signal of an applicant’s likely fit and resilience across departmental subfields.  
  4.  **Feasible Workload:** Adding one reader per file is manageable with current committee sizes. It signals seriousness without collapsing under logistical weight.  

  ### Engaging the Strongest Skeptical Objection  
  **Objection:** *"If readers aren’t independent and ‘thriving’ isn’t a fixed truth, adding more readers just gives us more correlated noise or illusory precision. We should stick with 2+discussion to deeply debate each contested case."*  

  **Rebuttal:** This critique rightly highlights Condorcet’s flaws but misdiagnoses the solution.  
  - The 2-reader system’s unanimity requirement **fails precisely because discussion only happens *after* a veto**. A brilliant applicant dismissed by one reader never gets a committee hearing.  
  - **Three readers *with* discussion triggered by *any* dissent (1/3) ensures broader scrutiny *before* summary rejection.** The borderline discussion pool becomes *richer* (including strong applicants with one skeptic) rather than *narrower* (only applicants splitting two readers).  
  - **Correlated bias exists, but isn’t absolute.** A third reader *can* break departmental echo chambers (e.g., a comparativist highlighting an applicant’s fieldwork innovation missed by two theorists). Majority rule with 3 is a hedge, not a guarantee—but it’s a *better* hedge than 2.  
  - **Admissions is inherently probabilistic.** No system "finds truth," but 3-reader majority better simulates how scholarly consensus emerges: through overlapping, partial agreements from diverse standpoints, not binary matches.  

  ---

  ### Implementation Plan  
  1.  **Assign 3 readers per file** using algorithmic balancing (methodology, region, seniority).  
  2.  **Admit** applicants with **2+ "Top-Tier" votes.**  
  3.  **Discuss live** any applicant with **exactly 1 "Top-Tier" vote** (i.e., 1 top-tier, 2 lower ratings).  
  4.  **Reject** applicants with **0 "Top-Tier" votes.**  
  5.  **Calibration:** Post-admission, track reader alignment rates and (anonymously) correlate ratings with 1st-year progress to iteratively refine rubric/training, acknowledging inherent limits.  

  ---

  ### Conclusion  
  The 3-reader majority system moves beyond the false choice between the false precision of Condorcet (5 readers) and the excessive rigidity of the status quo (2-reader unanimity). It accepts the subjective, relational nature of admissions judgments while leveraging statistical principles *pragmatically* to reduce capricious outcomes. By requiring consensus from a *plurality* of perspectives and mandating discussion for marginal cases, it best approximates our department’s collective wisdom under realistic constraints. I urge adoption of this model.
