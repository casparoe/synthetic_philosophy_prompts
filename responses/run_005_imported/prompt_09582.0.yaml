prompt: |-
  so i'm on my school's Honor Council (a mix of students and two teachers that hears academic integrity cases and recommends a consequence to the principal), and Thursday we've got a case messier than the usual copy-off-your-friend stuff. A kid wrote his own rough draft of a history essay, then had an AI tool reword two paragraphs before turning it in. Our honor code just bans letting "someone or something else do the work for you," it doesnt say how much help counts. His defense: everyone uses Grammarly to fix sentences and that's allowed, and if fixing one sentence is fine and fixing two isn't really different, you can't draw a line anywhere before what he did without that line being arbitrary -- which honestly sounds like the heap/sorites paradox we covered in philosophy class. Half the council wants to make an example of him, the other half thinks that's unfair since the policy never specified where the line is. Can you write the short memo I'd circulate before the meeting -- it needs an actual recommendation for his case plus better wording for the policy going forward, and it has to seriously engage with the "you can't punish me for crossing a line nobody drew" argument instead of just brushing it off.
