prompt: |-
  I'm interviewing a guest next month for a small formal-epistemology speaker series. She's known for the hardline reading of Aumann's agreement theorem -- namely, that two people who trust each other's rationality can't really keep disagreeing once they've swapped posteriors, and that persistent expert disagreement is basically always a tell that someone's irrational or dishonest. Draft me 8-10 questions that dont just have her re-explain the theorem: one should press on how realistic the common-prior assumption really is, one on the gap between the full common knowledge the proof needs (not just both knowing something, but knowing they know you know, and so on) and the messier mutual knowledge people actually have mid-argument, and one on whether she's allowed to privately suspect the other guy is less rational than her without that becoming a license for anyone to disagree forever. Add a follow-up to each, keyed to whatever answer she'd probably give.
reasoning: |-
  Okay, the user wants interview questions for a guest who advocates a hardline interpretation of Aumann's agreement theorem. Let me break down the requirements. They need 8-10 questions that avoid rehashing the theorem itself. Specifically, three questions must address: the realism of the common-prior assumption, the gap between common knowledge and mutual knowledge, and whether privately suspecting lower rationality allows perpetual disagreement. Each question needs a follow-up tailored to her likely responses.

  First, I recall Aumann's theorem relies on common priors and common knowledge of posteriors. The hardline stance suggests persistent disagreement indicates irrationality or dishonesty. The user wants to challenge this view through nuanced questions. 

  For the common-prior assumption, I should question its plausibility in real-world scenarios. The guest might defend it as a normative ideal, so the follow-up could push back with examples like cultural differences affecting priors. This addresses the user's request to press on realism.

  Next, the common knowledge vs. mutual knowledge gap. The theorem requires infinite recursion of knowledge, but real arguments often have only mutual knowledge. The guest might downplay this, so the follow-up can cite empirical studies showing communication breakdowns without common knowledge. This tackles the user's specified point about messy real-world disagreements.

  Third, the rationality suspicion angle. If one privately doubts the other's rationality, does that permit endless disagreement? The guest might argue for transparency, but the follow-up can challenge how this avoids becoming a loophole for bad faith actors. This covers the user's concern about licensing perpetual disagreement.

  The user also mentioned the speaker series is formal epistemology, so questions should stay technical yet accessible. The guest's hardline position means questions need respectful rigor. Unspoken needs might include exposing weaknesses in her stance or clarifying practical implications beyond theory.

  I should structure each question with a clear focus and a follow-up anticipating her response. For the other questions, I'll cover extensions like updating on disagreement, asymmetric evidence access, calibration vs. consensus, and practical applications. Each follow-up should tighten the logical screws based on her probable answers.

  For example, on asymmetric evidence, her likely defense is Bayesian mechanisms handle it. The follow-up can mention real-world constraints like time or attention preventing evidence sharing. This adds depth beyond theory.

  I'll also include questions on non-common priors as an alternative explanation and whether the theorem's idealization limits its applicability. The follow-ups should challenge dismissals of these factors.

  Finally, wrap-up questions on implications for fields like science or policy can highlight stakes. The guest might insist on the theorem's diagnostic power, but follow-ups can question if this overcorrects productive dissent.

  Throughout, I'll balance academic rigor with engagement, ensuring questions push boundaries without being hostile. The goal is a fruitful debate that illuminates both strengths and limits of the hardline view.
answer: |-
  Here are 8 interview questions designed to probe the hardline interpretation of Aumann, focusing on your specified areas and including pointed follow-ups anticipating likely responses:

  1.  **Question (Common Prior - Realism):** "Your interpretation places significant weight on the common prior assumption (CPA). Given the demonstrable diversity of human lived experiences, cultural backgrounds, and formative exposures to information, how plausible do you find it *in practice* that two reasonable people arguing, say, about climate policy or economic forecasts, genuinely share a common prior probability distribution over the relevant state space?"
      *   **Likely Answer:** She'll likely argue CPA is a *normative* ideal or a necessary baseline for defining rationality in disagreement, or that differences can often be modeled as differing *information* conditional on a deeper common prior.
      *   **Follow-Up:** "If the CPA is primarily a normative ideal, doesn't that significantly weaken its power as a *diagnostic tool* for labeling real-world persistent disagreement as irrationality/dishonesty? Couldn't persistent disagreement often be evidence *against* the CPA holding in that specific instance, rather than evidence *for* irrationality?"

  2.  **Question (Common Knowledge Gap):** "The theorem requires *common knowledge* of posteriors – an infinite regress of 'I know that you know that I know...'. In a real argument, people often exchange views once ('mutual knowledge') but rarely achieve true common knowledge, especially amidst heated disagreement or complex topics. How damaging is this gap between the theorem's requirement and real-world epistemic friction to the hardline conclusion that persistent disagreement *must* signal irrationality?"
      *   **Likely Answer:** She might downplay the gap, arguing that sincere, repeated communication approximates common knowledge, or that failure to establish it *is* a form of irrationality (poor communication).
      *   **Follow-Up:** "Given empirical psychology showing how easily communication breaks down even among intelligent, well-intentioned people (e.g., the curse of knowledge, ambiguous phrasing), isn't it more realistic to see the common knowledge requirement as a major *practical* barrier preventing Aumannian agreement, rather than proof of irrationality? Doesn't labeling this failure 'irrationality' risk being unhelpfully expansive?"

  3.  **Question (Private Suspicion of Lower Rationality - The Loophole):** "The hardline view seems to allow *one* escape hatch: privately believing the *other* party is less rational or poorly calibrated. Doesn't this create a massive loophole? If *each* participant can rationally entertain the private suspicion that the *other* is slightly less rational (perhaps based on differing track records, perceived biases, or even just epistemic humility about one's *own* rationality), doesn't this license *both* parties to rationally persist in disagreement indefinitely after exchanging views, completely undermining the theorem's apparent force?"
      *   **Likely Answer:** She might argue this suspicion needs justification (e.g., evidence of poor past performance), must be symmetric in a specific way, or that voicing this suspicion changes the game (now you're disagreeing *about* rationality).
      *   **Follow-Up:** "But doesn't this just kick the can down the road? If I voice my suspicion that *you* might be less rational on this topic, and you voice your symmetric suspicion about *me*, haven't we simply moved to a *new* disagreement – about each other's rationality – which, according to the hardline view, we *also* shouldn't be able to rationally persist in once we've exchanged our views on *that*? How does this recursive suspicion resolve without eventually demanding someone capitulate or be labeled irrational?"

  4.  **Question (Updating on Disagreement Itself):** "Aumann assumes agents only update on the *content* of the other's posterior, not on the *fact* of disagreement itself. Yet, discovering a peer disagrees *is* new information – it might signal the problem is harder than I thought, my evidence is misleading, or yes, *their* irrationality. How does the hardline view account for this meta-information inherent in the act of disagreement, which isn't directly modeled in the exchange of posteriors?"
      *   **Likely Answer:** She might argue this is incorporated *within* the Bayesian update upon hearing the posterior, or that acknowledging this complexity doesn't invalidate the core point about shared priors/knowledge forcing agreement.
      *   **Follow-Up:** "If learning *that* a peer disagrees provides significant new information about the *difficulty* of the question or the *quality* of my own reasoning process (not just their posterior), doesn't this make the Bayesian update path much murkier and less likely to lead to instantaneous, complete agreement, even for rational agents with common priors?"

  5.  **Question (Asymmetric Evidence Access/Interpretation):** "The theorem assumes agents share all relevant information or that their posteriors fully encapsulate it. In reality, experts often possess unique, hard-to-articulate evidence (tacit knowledge, complex datasets) or interpret the *same* evidence differently based on legitimate auxiliary hypotheses. How does the hardline view distinguish between persistent disagreement arising from *this* kind of asymmetric evidence landscape (which might be rational) versus genuine irrationality/dishonesty?"
      *   **Likely Answer:** She'll likely argue that true rationality demands agents share their evidence effectively or that differing interpretations *should* be resolvable under common priors/knowledge via Bayesian reasoning.
      *   **Follow-Up:** "But isn't this demanding superhuman communication and processing abilities? In complex domains (medicine, economics, climate science), isn't it often *rational* for experts to remain somewhat skeptical of a peer's conclusion if they suspect that peer might have missed crucial nuances, misweighted evidence, or lacks specific tacit knowledge, *even after* hearing their posterior? Doesn't labeling this 'irrational' ignore the practical limits of evidence sharing and cognitive processing?"

  6.  **Question (Calibration vs. Consensus):** "The hardline view seems to equate persistent disagreement with a failure of rationality. But what about domains where well-calibrated experts *correctly* hold differing views due to inherent uncertainty or ambiguous evidence? Couldn't persistent disagreement sometimes reflect a *rational* diversity of risk assessments or interpretations within the bounds of reasonable uncertainty, rather than a failure to update properly?"
      *   **Likely Answer:** She might argue that under true common priors/knowledge, even with uncertainty, posteriors should converge, or that differing risk assessments stem from differing priors/utilities, not just posteriors.
      *   **Follow-Up:** "If differing legitimate risk assessments or weights on ambiguous evidence lead to divergent posteriors *even after exchange* among rational agents, doesn't this show that the Aumann result is too narrow to capture all forms of *rational* persistent expert disagreement? Doesn't demanding consensus in such cases potentially suppress valuable dissenting perspectives?"

  7.  **Question (Non-Common Priors as Default):** "Given the challenges of establishing a truly common prior and common knowledge, wouldn't a more realistic default assumption be that persistent disagreement is *prima facie* evidence *against* the common prior holding for that specific disagreement, rather than *for* irrationality? Isn't 'differing reasonable starting points' often a more charitable and empirically plausible explanation?"
      *   **Likely Answer:** She'll likely defend CPA as fundamental to defining rational disagreement, arguing that without it, "anything goes," or that persistent disagreement *is* evidence *for* irrationality *because* it violates the CPA+Common Knowledge scenario.
      *   **Follow-Up:** "Doesn't insisting on CPA as the *only* rational baseline risk being epistemically imperialistic? If we observe persistent disagreement among experts who pass other tests of competence and sincerity, isn't the more scientifically humble position to investigate *why* their priors diverged (e.g., different training, foundational assumptions, exposure) rather than labeling them irrational? Couldn't your diagnostic actually hinder understanding the *sources* of disagreement?"

  8.  **Question (Practical Implications & the 'Irrationality' Label):** "The hardline conclusion that persistent disagreement 'basically always' signals irrationality or dishonesty seems like a powerful rhetorical tool. But what are the potential downsides? Could this framing discourage productive engagement with opposing views (since they're 'irrational'), incentivize premature concession to avoid the label, or be weaponized to dismiss legitimate minority perspectives within a field?"
      *   **Likely Answer:** She might argue that clarity is valuable, that it incentivizes better reasoning/communication, or that correctly identifying irrationality *is* necessary for truth-seeking.
      *   **Follow-Up:** "Given the inherent difficulty in *proving* irrationality/dishonesty (vs. differing priors/evidence/interpretations), and the social/political consequences of wielding such a label, doesn't the hardline stance risk creating a chilling effect or fostering epistemic arrogance ('Anyone who still disagrees after hearing me must be irrational')? How do you mitigate these risks in applying the theorem diagnostically?"

  **Key features of these questions:**

  *   **Avoid Theorem Rehash:** Focus on *implications, assumptions, and real-world applicability*.
  *   **Target Specific Critiques:** Directly address CPA realism, Common Knowledge gap, and the "private suspicion" loophole as requested.
  *   **Anticipatory Follow-Ups:** Each follow-up is designed to challenge the most probable defense of the hardline position, tightening the logical screws.
  *   **Explore Nuance:** Probe areas like meta-information from disagreement, asymmetric evidence, rational uncertainty, and the social consequences of the "irrationality" label.
  *   **Respectful Rigor:** The questions are challenging but framed to engage with the intellectual position, not the person.

  Good luck with the interview! This promises to be a fascinating discussion.
