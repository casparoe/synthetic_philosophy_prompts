prompt: |-
  So my Philosophy of Democracy seminar just covered Robin Hanson's futarchy idea (vote on values, bet on beliefs), and now it's showing up in real life. I'm on my student government's rules commitee: the econ club wants us to fund either rec-center solar panels or a campus bike-share out of this year's Green Fund using a real-money prediction market instead of a senate vote -- the emissions-cut metric gets set by referendum, but which project wins is decided purely by the market, no override. Half the committee thinks this pools scattered campus info better than 9 senators voting off vibes; the other half says a market with a few hundred undergrads is too thin not to be gamed, that whoever implements the winning project has private info/control they could trade on, and that it's basically gambling with extra steps. Can you draft the short memo I need for Thursday's meeting, recommending adopt, reject, or adopt-with-conditions, and actually engaging with whichever side you end up rejecting?
reasoning: |-
  Okay, the user is in a Philosophy of Democracy seminar and just learned about Robin Hanson's futarchy. Now, their student government's rules committee is considering using a prediction market to decide between funding solar panels or a bike-share program. The user needs to draft a memo recommending whether to adopt, reject, or adopt with conditions, and they must engage with both sides of the argument.

  First, I need to recall what futarchy entails. Hanson's idea is "vote on values, bet on beliefs." So, values are set by voting, but beliefs about outcomes are determined by prediction markets. In this case, the emissions-cut metric is set by referendum (values), and the market decides which project achieves that better (beliefs).

  The committee is split. Half thinks the market pools scattered information better than nine senators voting based on vibes. The other half worries about market thinness, manipulation, insider trading, and the gambling aspect. The user's memo has to address these points and make a recommendation.

  Looking deeper, the user's role is on the rules committee. They need a balanced analysis that considers practical implementation and ethical concerns. The real-world context here is a student government with limited resources and experience. Key stakeholders include the econ club proposing this, other committee members, and the student body affected by the decision.

  The user's explicit need is a memo draft. But their deeper needs might include demonstrating critical thinking, showing they understand both theoretical and practical aspects of futarchy, and providing a solution that mitigates risks while embracing innovation. They might also want to position themselves as a mediator between the two factions in the committee.

  Now, assessing the pros and cons. Pros: prediction markets can aggregate dispersed information, reduce bias, and incentivize truth-seeking. In theory, markets might outperform small committees. Cons: thin markets are prone to manipulation. With only a few hundred undergrads, liquidity could be low. Also, the implementer having insider information is a real risk—like if the project manager trades on non-public info. Gambling concerns are valid too, as real money is involved, which might not sit well in an educational setting.

  Adopting outright seems risky given the cons. Rejecting might stifle innovation. So, adopting with conditions could be the best path. Conditions might include: piloting with a smaller fund, strict anti-manipulation rules, using play money instead of real money, or setting a minimum participation threshold. Also, maybe run the market as a test alongside a traditional vote to compare outcomes.

  Need to address the rejected side. If recommending adoption with conditions, the memo must acknowledge the oppositions' concerns about manipulation and insider trading, explaining how the conditions mitigate those. For the pro side, explain why outright adoption isn't feasible but their point about information aggregation is valid.

  Structure the memo: start with context, outline both sides, recommend with conditions, detail mitigations. Ensure it's concise, as it's a short memo for a meeting. Highlight that this is a learning opportunity but requires safeguards.

  Also, consider the educational aspect. Since this is a student government, framing the pilot as an experiment in democratic innovation could appeal to both sides. Emphasize transparency and evaluation for future reference.

  Finally, check if all committee concerns are addressed: thin market, insider info, gambling. Proposed solutions: anonymity to reduce targeting, play money to avoid gambling, mandatory disclosures from project leads, and a trial run to assess viability.
answer: |-
  ## MEMORANDUM  
  **To:** Rules Committee Members  
  **From:** [Your Name], Rules Committee Member  
  **Date:** [Date of Meeting]  
  **Subject:** Recommendation on Econ Club Proposal for Green Fund Allocation via Prediction Market  

  ### **Background**  
  The Econ Club proposes using a real-money prediction market (based on Robin Hanson’s “futarchy” model) to allocate this year’s Green Fund between solar panels or bike-share. A campus referendum would set the emissions-reduction metric, but the market alone—without Senate override—would determine which project best achieves that goal. This memo evaluates the proposal’s merits and risks.  

  ### **Key Arguments Summarized**  
  **Pro-Market View:**  
  - Markets aggregate dispersed knowledge (e.g., student expertise on project feasibility, usage patterns) better than 9 senators relying on limited input.  
  - Incentivizes truth-seeking: Traders profit by accurately predicting emissions outcomes, reducing bias/vibes-based decisions.  
  - Innovative democratic experiment aligning with academic discourse.  

  **Anti-Market View:**  
  - **Thin Market Risk:** A few hundred undergrad traders lack liquidity, enabling manipulation by small groups or "rich whales."  
  - **Insider Threat:** Project implementers (e.g., Eco-Office staff) could trade on non-public info (e.g., maintenance costs, vendor issues).  
  - **Gambling Concerns:** Real-money stakes may exploit students or incentivize gaming over sincere judgment.  

  ---

  ### **Recommendation: REJECT in Current Form, but PILOT A MODIFIED VERSION**  
  While the proposal’s intent to improve decision-making is commendable, the risks of manipulation and implementation flaws outweigh potential benefits **in its current structure**. However, rejecting innovation outright misses a learning opportunity. Instead, we should **pilot a modified version** under strict conditions.  

  ---

  ### **Engagement with Rejected Arguments**  
  **To the Pro-Market Side:**  
  Your core insight—that markets *can* harness decentralized knowledge—is valid. A well-designed market might outperform committee votes, especially on technical outcomes like emissions cuts. However, the current proposal underestimates real-world vulnerabilities:  
  - **Thin markets amplify noise:** With low participation, a $50 trade could swing prices more than genuine information. Without liquidity safeguards, this becomes speculative gambling, not wisdom aggregation.  
  - **Student governments lack enforcement capacity:** We cannot audit trades or prevent insider collusion effectively.  
  *Our counter-proposal preserves your goal while mitigating these risks.*  

  **To the Anti-Market Side:**  
  Your concerns about gaming and insider threats are well-founded, but dismissing markets entirely overlooks their potential for depoliticizing technical decisions. Prediction markets don’t “gamble with extra steps” if designed to reward accurate forecasts (like insurance markets). However, your critique rightly demands robust safeguards we currently lack.  

  ---

  ### **Proposed Pilot Conditions**  
  1. **Play Money, Not Real Money:**  
     - Use virtual currency (e.g., "GreenTokens") to eliminate gambling risks and broaden participation.  
     - Reward top forecasters with non-cash incentives (e.g., campus recognition, priority registration).  

  2. **Anonymity & Anti-Manipulation Rules:**  
     - Mask trader identities to deter targeting.  
     - Cap trades/day and limit price swings to reduce whale influence.  

  3. **Mandatory Project Lead Disclosures:**  
     - Anyone with project implementation access must publicly log constraints (e.g., "Solar vendor requires 6-month install") before trading opens.  

  4. **Market as Advisory, Not Binding:**  
     - Senate retains override authority (requiring ⅔ majority) to intervene if market behavior appears irrational.  

  5. **Run Parallel to Traditional Process:**  
     - Simultaneously hold a Senate vote on the projects. Compare outcomes and process transparency post-hoc.  

  6. **Sunset Clause:**  
     - Automatically expire the mechanism after this pilot unless reviewed and renewed.  

  ---

  ### **Why This Approach?**  
  - **Balances Innovation and Caution:** Tests futarchy’s principles without gambling student funds or enabling abuse.  
  - **Addresses Critiques:** Play money eliminates gambling; disclosures curb insider threats; caps reduce manipulation; Senate override adds accountability.  
  - **Educational Value:** Aligns with our academic mission to experiment with democratic tools.  

  **Next Steps:** Table the Econ Club’s proposal and counter-propose this pilot framework. Urge collaboration between Econ Club (design), IT (platform), and Eco-Office (disclosures) to refine details.  

  ---  
  **Respectfully submitted,**  
  [Your Name]
