  Random q about Buchak's risk-weighted expected utility (prepping for quals rn). Everyone in the lit keeps saying REU is a genuine alternative to EU, not just repackaged risk aversion, and that it can rationalize Allais-type choices that EU basically cant touch. But isnt "being extra averse to the bad-outcome branch of a gamble" exactly what a concave utility function already buys you under plain EU? Feels like her risk function r() and a concave u() are doing the same job under different names, so I'm stuck on why the Allais stuff is supposed to be special to REU and not just EU with extra steps. What am I missing here?
