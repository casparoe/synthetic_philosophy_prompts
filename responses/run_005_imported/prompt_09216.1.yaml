  i've started using a few different prediction markets (polymarket, kalshi, manifold) and sometimes end up betting on the same or closely related events on more than one of them, where the odds dont quite match up once you account for fees and spread. what are the most important implications of the dutch book argument for how i should think about my own probabilities across all this, and is 'make sure you cant be dutch booked' actually a sensible practical goal here, or does that argument not really translate to messy real-world markets like this?
