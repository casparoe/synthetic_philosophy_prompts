  For the applicant, since the permit was issued under the chair's ruling, rescinding it could cause legal issues and unfairness. The memo should recommend leaving it as is but clarifying future procedures.

  The doctrinal paradox has no perfect solution. The memo should acknowledge that but recommend prioritizing findings. Why? Because the findings are the legal criteria. The final vote might be influenced by factors outside the ordinance, which isn't proper. Plus, the rules require separate findings, so they should be the foundation.

  To prevent strategic voting, the memo could suggest emphasizing deliberation and integrity. Reminding members that findings must be based on evidence, not desired outcomes. Also, a robust discussion before voting might reduce insincerity.

  The user needs a concise memo. Structure it with the problem, analysis, recommendations, and reasoning. Use plain language, avoid jargon. Highlight that the ordinance's requirements are the findings, so they must be central. Admit the paradox but argue that findings-first is more legally sound and transparent.

  Check if there are legal precedents or best practices. While not mentioned, zoning boards often rely on meeting statutory criteria. Emphasizing that could strengthen the recommendation. Also, the rules committee should formalize the procedure to avoid future confusion.
answer: |-
  ## Memo: Resolving Voting Inconsistencies in ZBA Decisions

  **To:** Zoning Board of Appeals Rules Committee  
  **From:** [Your Name], ZBA Member  
  **Date:** October 26, 2023  
  **Subject:** Proposed Procedure for Resolving Conflicts Between Findings Votes and Final Application Vote

  **I. The Problem: The "Doctrinal Paradox" in Action**
  At our recent hearing, we encountered a procedural dilemma known in decision theory as the **"doctrinal paradox"** or **"discursive dilemma."** This occurs when:
  1.  A decision requires multiple, specific findings (here, *unique hardship* and *no character alteration*).
  2.  A majority votes "YES" on *each individual finding*.
  3.  But a majority votes "NO" on the *final decision* (granting the variance).

  This is not a flaw in our members or rules, but a mathematical reality of aggregating individual judgments on logically connected propositions. Our current rules (voting on findings separately *and* on the application) create the potential for this conflict, which occurred for the first time last week. The Chair resolved it by prioritizing the findings, while some members believe the final application vote should control.

  **II. Recommendation: Findings Must Control the Final Decision**
  **Going forward, the Board should treat a majority "YES" vote on *all* statutorily required findings as *requiring* a "YES" vote on the application itself.** The final application vote should be understood as a *confirmatory step*, not an independent override. Here's why:

  1.  **The Ordinance is the Foundation:** Our authority comes from the zoning ordinance. The ordinance *conditions* a variance on specific findings (unique hardship, no character alteration). If the Board formally finds these exist by majority vote, the legal prerequisites for granting the variance are met. Granting it becomes the logical and legal consequence. Voting "NO" on the application after affirming all findings effectively overrules the ordinance's requirements without justification.
  2.  **Transparency and Accountability:** Separate findings exist for a reason – to ensure decisions are based on objective legal criteria, not personal preference. Prioritizing the findings forces deliberation on the specific factors the law requires. Allowing the final vote to negate affirmed findings obscures the *reason* for denial and risks decisions based on unstated (and potentially improper) factors.
  3.  **Consistency with Our Structure:** Our procedure mandates votes on findings *because* they are the legal gatekeepers. Treating them as merely advisory undermines their purpose. The final vote on the application is a necessary formal step, but its function is to record the outcome *dictated* by the findings.
  4.  **Addressing the Immediate Applicant:** While the situation is procedurally awkward, the Chair acted correctly based on the core logic above. The applicant relied in good faith on the Board's formal declaration (based on passed findings) and secured a permit. **Rescinding the permit now would be profoundly unfair, create significant legal liability for the town, and damage public trust.** The outcome, while procedurally unclear initially, was substantively correct based on the affirmed findings. **We should not revisit this specific case.**

  **III. Addressing the Risk of Strategic (Insincere) Voting**
  Your colleague raises a valid concern: if Findings control, members might vote "NO" on a finding they *actually* believe is true, simply to block an application they oppose on other grounds.

  *   **Acknowledgment:** This risk exists under *any* voting procedure where multiple votes interact. It could also happen in reverse: if the Final Vote controlled, a member might vote "YES" on an application while rejecting a necessary finding, simply to support the applicant.
  *   **Mitigation is Key, Not Perfection:** We cannot eliminate strategic voting entirely, but we can minimize it:
      *   **Emphasize Fiduciary Duty:** In training and deliberation, stress that members have a legal and ethical obligation to vote on findings based *solely* on the evidence and legal criteria presented, *not* their desired outcome for the application. Voting against a finding one believes is true to manipulate the outcome violates this duty.
      *   **Robust Deliberation:** Encourage thorough discussion *before* voting on findings. Challenge members to articulate their reasoning for each finding clearly. This exposes inconsistencies and makes strategic voting harder to disguise.
      *   **Focus on the Findings:** Continually reinforce that our *only* job is to apply the ordinance criteria embodied in the findings. Personal views on the applicant, the project, or neighborhood politics are irrelevant. The findings are our compass.
      *   **Record Individual Rationales:** Consider requiring brief written or oral summaries of each member's reasoning for their findings votes. This increases accountability and makes insincere votes more transparent.

  **IV. Why No Perfect Solution Exists (And That's Okay)**
  As noted by the philosophy PhD, the doctrinal paradox highlights a fundamental challenge in group decision-making on complex questions. No voting system guarantees consistent, strategy-proof outcomes in all cases when multiple interconnected judgments are required. Prioritizing Findings over the Final Vote is not "perfect," but it is the **most legally sound, transparent, and principle-driven approach available to us.** It keeps our decisions firmly anchored to the specific requirements of the ordinance we are sworn to uphold.

  **V. Proposed Rule Amendment**
  To prevent future confusion, the Rules Committee should formally amend our procedures to state:

  > *"Following separate votes on each finding required by Section [Relevant Ordinance Section] for the grant of a variance, if a majority of the Board votes affirmatively on* all *such required findings, the application for variance shall be deemed granted. The subsequent vote on the application itself shall be recorded but is confirmatory; an affirmative vote on the application is required only if all required findings have received an affirmative majority vote. If one or more required findings fails to receive an affirmative majority vote, the application for variance shall be denied."*

  **Conclusion:**
  The doctrinal paradox revealed a gap in our procedures. The recommended approach – prioritizing the affirmative findings required by law – best serves our mandate to apply the zoning ordinance fairly and transparently. It minimizes the risk of arbitrary outcomes and grounds our decisions in the specific criteria established by the town. While it requires vigilance against strategic voting, this is preferable to allowing the final vote to override the very legal prerequisites we are tasked with evaluating. I urge the Rules Committee to adopt the proposed amendment.
