  **Explanation of Ranking Logic:**  
  1. **Corbett-Davies et al.** ranks highest because it transcends the trilemma by showing both criteria are Pareto-dominated. This dissolves the "forced choice" by arguing fairness debates should focus on welfare optimization, not parity metrics.  
  2. **Hellman** successfully reframes separation as *evidence* for discrimination rather than *constitutive* of fairness. This preserves error-rate analysis while avoiding the impossibility result’s logical bind.  
  3. **Hedden** provides a rigorous defense for privileging sufficiency but dismisses separation concerns without fully engaging their moral significance (e.g., disparate incarceration risks).  
  4. **ProPublica’s error-rate focus** acknowledges real-world harms of unequal FPR/FNR but treats the impossibility as an unsolved dilemma rather than resolving it.  
  5. **Northpointe’s sufficiency defense** offers a practical argument for calibration but inadequately addresses why unequal error rates are morally permissible.  
  6. **Denying base rates** sidesteps the trilemma by attacking label bias, but this is often epistemically circular—many base-rate gaps persist even after label correction due to structural injustice.
