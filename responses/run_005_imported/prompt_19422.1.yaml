prompt: |-
  okay so for my philosophy elective we're reading this Aristotle passage for a discussion post thats due tomorrow and honestly i'm kind of loosing it. its from "On Interpretation," the sea-battle chapter (Part 9), and this is the exact chunk my teacher wants us to unpack:

  "There are many obvious instances of this. It is possible that this coat may be cut in half, and yet it may not be cut in half, but wear out first. In the same way, it is possible that it should not be cut in half; unless this were so, it would not be possible that it should wear out first. So it is therefore with all other events which possess this kind of potentiality. It is therefore plain that it is not of necessity that everything is or takes place; but in some instances there are real alternatives, in which case the affirmation is no more true and no more false than the denial; while some exhibit a predisposition and general tendency in one direction or the other, and yet can issue in the opposite direction by exception.

  Now that which is must needs be when it is, and that which is not must needs not be when it is not. Yet it cannot be said without qualification that all existence and non-existence is the outcome of necessity. For there is a difference between saying that that which is, when it is, must needs be, and simply saying that all that is must needs be, and similarly in the case of that which is not. In the case, also, of two contradictory propositions this holds good. Everything must either be or not be, whether in the present or in the future, but it is not always possible to distinguish and state determinately which of these alternatives must necessarily come about.

  Let me illustrate. A sea-fight must either take place to-morrow or not, but it is not necessary that it should take place to-morrow, neither is it necessary that it should not take place, yet it is necessary that it either should or should not take place to-morrow."

  can u help me actually break this down? two things are messing me up specifically: 1) why does he randomly bring up a coat getting cut in half or worn out, like what is that even supposed to prove, and 2) the sea-fight part sounds like hes contradicting himself — he says it MUST either happen or not happen tomorrow (ok fine, sounds like excluded middle) but then immediately says its not necessary that it happens AND not necessary that it doesnt happen. isnt "must be A or B" basically the same thing as saying "must be A, or must be B"? thats the part i cant get past. is aristotle messing up his own logic here or is there some distinction im not seeing, and does it actually get him out of the fatalism thing he spends the whole chapter freaking out about, or is he just being sneaky with the wording?
