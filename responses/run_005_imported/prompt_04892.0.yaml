prompt: |-
  Last night a close friend of mine—who spends her summers doing fieldwork on cichlid species flocks in the East African rift lakes—and I ended up in a long, only half-resolved argument about the species problem. Her position, roughly, was that the whole debate is overblown: working biologists reach for whichever species concept is locally tractable (morphology in a museum drawer, reproductive compatibility in a common-garden experiment, concordant gene trees once sequencing is cheap enough), and demanding a single "correct" concept is a bit like demanding a single correct map projection. I pushed back, arguing that if the major species concepts don't even converge in principle on the same boundaries for the same organisms, that is itself evidence that some of them are simply worse attempts at carving nature at its joints than others—even granting that none is perfect and that some pluralism is probably unavoidable. We ended up trying to rank the concepts we could half-remember from an old philosophy of biology seminar, but neither of us could produce anything we were willing to defend cold sober.

  I would like your help doing this properly. Please rank the following species concepts from best to worst as general, principled accounts of what makes a set of organisms count as a species. By "best" I mean something like: comes closest to specifying a non-arbitrary, joint-carving criterion that could in principle be applied consistently across sexually and asexually reproducing lineages and across extant and extinct organisms, without covertly smuggling in one of the other concepts to do the real explanatory work. The concepts are: the Biological Species Concept (Mayr), the Phylogenetic Species Concept in its diagnosability version (Cracraft), the Evolutionary Species Concept (Simpson/Wiley), the Ecological Species Concept (Van Valen), the Recognition Species Concept (Paterson), the Cohesion Species Concept (Templeton), the Genotypic Cluster Species Concept (Mallet), the Genealogical Concordance Species Concept (Avise & Ball), and species nominalism/eliminativism (the view that no concept is privileged because "species" does not name a natural kind at all).

  Please give your answer as a JSON block with five tiers, from best (S) to worst (D), formatted as follows:

  ```json
  {
    "S": ["..."],
    "A": ["..."],
    "B": ["..."],
    "C": ["..."],
    "D": ["..."]
  }
  ```

  You can put more than one concept in a tier if you think they are genuinely comparable, but please don't hedge by spreading everything evenly across the tiers—I am interested in where you think the real gaps in defensibility lie, not a diplomatic compromise between my friend's pragmatism and my realism.
