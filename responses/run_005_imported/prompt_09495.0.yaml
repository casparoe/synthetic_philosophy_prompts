  Based on van Inwagen's organicism and its core principles, **the pacemaker is *not* a genuine part of the composite object that is you. It remains a permanent tool attached to the organism, whose particles are *not* caught up in your life.** Here's the argument, directly engaging with Lewis's vagueness worry:

  1.  **The Core Organicist Criterion: Metabolic Integration & Self-Maintenance:**
      Van Inwagen's criterion for composition is "being caught up in a *single life*." Crucially, a "life" for van Inwagen isn't merely functional interdependence or physical attachment. It's fundamentally tied to the *self-maintaining, metabolic activity* characteristic of organisms. The paradigm example is digestion: food particles only become *parts of you* as they are broken down, assimilated, and incorporated into the organism's ongoing metabolic processes – its self-sustaining chemical activity aimed at maintenance, growth, and repair. The organism *acts upon* the food to make it part of itself. A chair's particles, despite being physically arranged together, lack this dynamic, self-sustaining unity; they aren't participating in a life.

  2.  **Applying the Criterion to the Pacemaker:**
      *   **Physical Attachment ≠ Metabolic Integration:** While the pacemaker leads are threaded into heart muscle and the device performs a vital biological function (replacing the SA node), this is primarily *functional* integration and physical *attachment*. The device itself is not undergoing metabolic processes *as part of your organism's self-maintenance*.
      *   **Lack of Assimilation:** The pacemaker's materials (metals, plastics, silicon) are not being digested, broken down, rebuilt, or utilized as fuel or building blocks by your body's metabolic machinery in the way nutrients or even your own cellular components are. Your body may form a fibrous capsule *around* it (a foreign body reaction), but it does not actively metabolize the pacemaker *into* itself. The pacemaker remains inert matter *used by* the life processes, not matter *constituting* or *participating in* those life processes.
      *   **Not Self-Maintained by the Organism:** Your body does not repair or replace the pacemaker's components through its own metabolic activity. If the battery depletes or a lead fractures, your body doesn't fix it; external intervention is required. Contrast this with your heart muscle cells, which are constantly maintained, repaired (to an extent), and replaced by your body's own metabolic systems.
      *   **Functional Contribution vs. Being "Caught Up":** While the pacemaker is functionally essential *for your continued life*, it remains a *tool enabling* that life, not a *constituent part caught up in it*. Van Inwagen distinguishes between things that *have* a life (organisms) and things that are merely *involved in* a life (like food being digested, or a tool being used). The pacemaker falls squarely into the latter category. Its particles are arranged pacemaker-wise *and being used by* the organism, but they are not *themselves* caught up in the metabolic life process.

  3.  **Addressing Lewis's Vagueness Worry Head-On:**
      Lewis argued that *any* restriction on composition (like organicism) relying on vague predicates (like "being caught up in a life") is doomed. If "caught up" admits of degrees, then composition becomes vague – exactly what van Inwagen wanted to avoid by rejecting both universalism (everything composes something) and nihilism (only simples exist).
      *   **Van Inwagen's Sharp Boundary:** Van Inwagen directly confronts this in *Material Beings*. He insists the predicate "the life" *is not vague* in the way Lewis fears. The boundary is sharp: either something is participating in the immanent causation of the self-sustaining metabolic activity of the organism *at that time*, or it is not. There is no "degree" of being caught up in the *single, specific life* of *this particular organism*.
      *   **The Pacemaker as a Test Case *Against* Vagueness:** The pacemaker scenario actually *strengthens* van Inwagen's case against vagueness concerns here.
          *   **Digestion Analogy:** Van Inwagen uses the *gradualness* of digestion to illustrate the sharp boundary. While the process is gradual, the *event* of composition (becoming part of the organism) is instantaneous at the moment a particle is assimilated into the metabolic process. Before that moment, it's food; after, it's part of the organism. There's no "partly part" of you.
          *   **Pacemaker Contrast:** The pacemaker highlights the *lack* of such a metabolic process of assimilation. It's not undergoing a gradual transformation *into* part of your organism. It's physically attached and functionally critical, but metabolically inert and unassimilated. The body reacts *to* it, not *with* it metabolically. This absence of a gradual metabolic assimilation process means there's *no continuum* along which the pacemaker could be "partly caught up." It's clearly *outside* the metabolic self-maintenance system. Its relationship to your life is fundamentally different from that of a nutrient molecule being actively broken down by enzymes or a mitochondrion producing ATP.
          *   **Binary Distinction:** The criterion remains binary: Is particle X currently participating as a component in the immanent causal network (the self-sustaining metabolic processes) that constitutes *this* organism's life? For the pacemaker's particles, the answer is "no." They are arranged in a structure that *interacts* with that network (sending electrical signals), but they are not *nodes within* the metabolic network itself. Your cells aren't metabolizing the silicon chip; the chip is triggering your muscle cells which *are* metabolizing.

  **Conclusion & Addressing the Worry:**

  Van Inwagen's organicism delivers a clear verdict: **The pacemaker is a sophisticated, permanently implanted *tool*, not a genuine part of the composite object that is you.** Its particles are arranged pacemaker-wise and are physically attached to and functionally integrated with your organism, but they are not "caught up in your life" in the specific, non-vague sense required for composition – participation in the self-sustaining metabolic activity that constitutes your life as an organism.

  **Engaging with the Central Worry:** Lewis's argument from vagueness is powerful, but the pacemaker case demonstrates how van Inwagen's criterion *can* draw a sharp line in practice. The *absence* of any metabolic assimilation process for the artificial device creates a stark contrast with genuine parts (like your heart tissue or assimilated nutrients). While digestion presents a *process* culminating in a sharp compositional event, the pacemaker lacks such a process entirely. It sits firmly on the "external tool" side of the binary distinction defined by participation in metabolic self-maintenance. Van Inwagen would argue that the vagueness Lewis fears is illusory in this context; the criterion excludes the pacemaker precisely because it doesn't engage in the *kind* of activity (metabolic integration) that defines being "caught up," avoiding a slippery slope of degrees. Your feeling of unity with the device speaks to its profound functional importance and physical intimacy, but organicism draws the metaphysical boundary of the composite "you" at the edge of your metabolic life processes.
