prompt: |-
  I've been reporting a feature on why some social conventions can flip almost overnight—tipping norms, forms of address, how we greet each other post-pandemic—while others stay locked in place for centuries even when they look arbitrary or mildly costly to the people who follow them. Chasing down the philosophical background has led me to two accounts of convention that seem to pull in genuinely different directions, and before my next interview I'd like to understand precisely how they relate.

  The first is David Lewis's analysis in Convention: A Philosophical Study, on which a convention is a regularity in behavior that solves a recurring coordination problem and persists because it is common knowledge within the population that everyone conforms, that everyone expects everyone else to conform, and that everyone prefers to conform given that the rest do. For Lewis, that common-knowledge condition is doing real work: it is supposed to be what turns a bare behavioral regularity into something people can be said to follow, rather than merely instantiate. The second is Brian Skyrms's evolutionary game-theoretic treatment, which takes some of the very same sender-receiver signaling games Lewis used to model linguistic convention and shows how a stable signaling system can emerge instead through replicator dynamics or simple reinforcement learning, with no individual agent ever representing the coordination problem, let alone attaining common knowledge of how the others will act.

  Could you compare these two accounts for me in some depth? I'm especially interested in whether Skyrms's evolutionary story actually undercuts Lewis's claim that common knowledge is a necessary condition on convention, or whether it is better read as describing a related but distinct phenomenon—a behavioral regularity that only counts as a convention in some thinner sense than Lewis intended. I'd also like your own considered judgment rather than a neutral summary of both sides: which picture does the better explanatory work on real human norms that persist despite being arbitrary or inefficient—deference norms, spelling conventions, and the like—and is there a class of cases (say, a one-off ad hoc agreement versus a slowly settled cultural practice) where one framework is clearly the right tool and the other simply fails to apply?
reasoning: |-
  Okay, the user is working on a feature about why some social conventions change quickly while others persist for centuries. They've come across two philosophical accounts: David Lewis's common knowledge approach and Brian Skyrms's evolutionary game theory model. They want a deep comparison, especially whether Skyrms undercuts Lewis's need for common knowledge. Also, they want to know which framework better explains real norms like deference or spelling conventions, and if each applies to different cases.

  First, I need to break down Lewis's theory. Lewis defines convention as a solution to coordination problems, relying on common knowledge. Everyone knows everyone conforms, expects conformity, and prefers to conform if others do. Common knowledge is crucial here—it's what makes a behavior a convention rather than just a habit. For example, driving on the right: people know others do it, expect them to, and prefer it because it avoids accidents. That mutual awareness is key.

  Then there's Skyrms. He uses evolutionary game theory, like replicator dynamics. Conventions emerge from repeated interactions without individuals needing common knowledge. Agents might just reinforce successful behaviors. Like in signaling games, a sender and receiver develop a communication system through trial and error, not by understanding each other's thoughts. It's more about adaptation over time than conscious agreement.

  The user's main question is whether Skyrms's model undermines Lewis's requirement for common knowledge. Skyrms shows that conventions can form without it. So, in evolutionary terms, behaviors stabilize without everyone knowing everyone else's thoughts. This suggests that Lewis's common knowledge might not be necessary, just one way conventions can form. But Lewis might argue that even in Skyrms's model, once a convention is established, common knowledge could develop. However, Skyrms's point is that the emergence doesn't require it initially.

  Next, the user wants to know which framework explains persistent, arbitrary norms better. Lewis is strong for norms where mutual awareness is evident, like language rules or etiquette. People know why they're following them and expect others to. But for deeply ingrained norms, like caste systems, where people follow without questioning, Skyrms's evolutionary approach fits better. These norms persist because they've been reinforced over generations, not through conscious coordination.

  The user also asks about different cases. For one-off agreements, like deciding where to meet, Lewis's model is perfect. It's a clear coordination problem solved by mutual agreement. For slow cultural practices, like rituals or traditions, Skyrms's model explains how they evolve without explicit discussion. 

  Underlying needs: The user might be trying to understand the mechanisms behind social stability and change. They mention tipping norms changing post-pandemic, so they need theories that explain both persistence and sudden shifts. They might also be looking for a framework that journalists can use to analyze current societal changes, needing accessible yet robust philosophical grounding. 

  I should also consider if the theories can be complementary. Lewis for conscious conventions, Skyrms for unconscious ones. Highlighting where each excels helps the user apply them to different examples in their feature. Emphasizing the distinction between emergence and maintenance of conventions could clarify why some flip overnight (common knowledge breaks) vs. persist (reinforced without awareness).
answer: |-
  Here's a deep comparison of Lewis and Skyrms on convention, addressing your core questions about explanatory power, the necessity of common knowledge, and their applicability to different cases:

  ### Core Differences: Structure vs. Emergence
  1.  **Lewis: Top-Down Structure & Rationality**
      *   **Focus:** *What constitutes a convention once established?* He defines the *necessary and sufficient conditions* for a behavior to *be* a convention.
      *   **Mechanism:** Rational agency. Individuals recognize a coordination problem, possess preferences, form expectations based on evidence (often past conformity), and act rationally to satisfy their preferences given those expectations. Common knowledge is the glue binding this together.
      *   **Common Knowledge (CK):** Absolutely essential. It's not just "most people know," but an infinite regress: "I know X, you know I know X, I know you know I know X..." CK ensures everyone is playing the *same* coordination game with shared expectations. This justifies conformity – you conform *because* you know others expect it and will conform themselves, making it rational for you.
      *   **Arbitrariness:** Explicitly built-in. The convention solves the problem, but another *could* have solved it just as well ("driving on the left vs. right").
      *   **Scope:** Explains *why* a convention *persists* rationally once established. Also explains how new conventions *can* form via precedent or explicit agreement (requiring CK of the agreement).

  2.  **Skyrms: Bottom-Up Emergence & Adaptation**
      *   **Focus:** *How can conventions emerge and stabilize without sophisticated cognition?* He models the *process* of convention formation.
      *   **Mechanism:** Evolutionary dynamics (replicator dynamics) or simple learning rules (reinforcement learning). Agents don't need to recognize a "coordination problem" or form complex expectations. They simply adapt their behavior based on past payoffs (success/failure). Successful strategies replicate; unsuccessful ones die out.
      *   **Common Knowledge:** Not required for emergence or basic stability. Agents react to local signals and past reinforcement. They don't need a model of others' beliefs or knowledge. Stability arises from the dynamics of the system, not mutual understanding.
      *   **Arbitrariness:** Emerges naturally. Multiple stable equilibria (conventions) are possible. Which one emerges depends on initial conditions, drift, and path dependence (historical accident).
      *   **Scope:** Explains how rule-like behavior can arise spontaneously in populations of cognitively simple agents (animals, early humans, or even algorithms). Focuses on the *process* of becoming conventional.

  ### Does Skyrms Undercut Lewis on Common Knowledge?
  *   **Yes, for Emergence:** Skyrms convincingly shows that CK is **not necessary** for the *emergence* or *basic maintenance* of a stable behavioral regularity that *looks like* a convention (solves a coordination problem, is arbitrary). His models demonstrate how such regularities can arise purely through adaptive dynamics.
  *   **No, for the Full "Lewisian Convention":** Skyrms does *not* show that CK is irrelevant for what Lewis *defines* as a convention. Lewis's concept *includes* CK as constitutive. A Skyrmsian regularity *lacks* the cognitive and epistemic structure Lewis deemed essential. For Lewis, a convention isn't just the behavior; it's the behavior *plus* the shared knowledge and expectations that make conformity rational. Skyrms gives us stable behavioral patterns *without* that shared intentionality layer.
  *   **The "Thinner Sense" is Correct:** The Skyrmsian regularity is a convention in a **thinner, behavioral sense**. It's a *de facto* convention – a stable, arbitrary solution to a recurring coordination problem sustained by adaptation. It lacks the *de jure* (by right of reason, based on mutual understanding) character Lewis emphasized. Think of it as the behavioral *substrate* upon which Lewisian common knowledge *can* (but doesn't necessarily) develop.

  ### Explanatory Power: Which Picture Works Better for Real Human Norms?
  Neither is universally superior; their strengths lie in different domains:

  1.  **Lewis Excels At:**
      *   **Explicit, Conscious Conventions:** Norms where people *know* they are following a rule and *expect* others to know (e.g., traffic rules, complex game rules, formal etiquette, explicit agreements). The arbitrariness is often acknowledged ("We could have done it differently, but *this* is how we do it").
      *   **Norms Sustained by Mutual Monitoring & Sanction:** Where the fear of social disapproval (based on the *expectation* that others expect conformity) is key (e.g., dress codes in specific contexts, certain forms of address where mistakes cause offense). CK underpins the sanctioning mechanism.
      *   **One-off Coordination:** Explicit agreements or precedents set in situations clearly recognized as coordination problems (e.g., "Let's meet at the fountain at noon").
      *   **Arbitrary but Efficient Conventions:** Spelling, standard weights/measures, computer keyboard layouts (QWERTY vs. DVORAK). People conform *because* they know others conform, ensuring communication/efficiency, even if the specific standard is arbitrary. CK makes the efficiency work.

  2.  **Skyrms Excels At:**
      *   **Deeply Embedded, "Taken-for-Granted" Norms:** Norms so ingrained people don't consciously think of them as solutions to a problem or arbitrary choices (e.g., fundamental politeness gestures, basic turn-taking in conversation, some aspects of personal space). Conformity is habitual or reinforced, not necessarily based on representing others' expectations.
      *   **Norms with Obscure Origins or High Inertia:** Practices persisting for centuries despite inefficiency, where the original coordination problem is lost to history, and conformity is driven by habit, social pressure mimicking reinforcement, or fear of the unknown rather than conscious reasoning about expectations (e.g., some complex rituals, deference norms in highly stratified societies, persistent spelling irregularities). The evolutionary model captures the path dependence and inertia.
      *   **Emergence of Proto-Conventions:** How simple signaling or coordination *could* arise in populations without sophisticated cognition or language.
      *   **"Inefficient Lock-In":** Cases where a suboptimal convention persists (like QWERTY) *despite* awareness of better options. Skyrms' models show how the *cost of switching* and network effects can trap populations in local optima, even without strong CK justifying the inefficiency. The reinforcement is based on *current* payoff, not potential better payoffs requiring coordinated change.

  ### Class of Cases: Where Each Framework Clearly Applies (or Fails)
  *   **Lewis is the Right Tool:**
      *   **Case:** A group of strangers shipwrecked on an island explicitly agreeing to rotate guard duty shifts to solve the coordination problem of watchkeeping. They all hear and acknowledge the agreement.
      *   **Why:** Explicit agreement creates common knowledge of the solution and the mutual expectations. Conformity is rational based on this CK. Skyrms' model doesn't capture the explicit, intentional agreement aspect.
      *   **Fails for Skyrms:** Skyrms struggles with truly one-off events or explicit agreements. His models require repeated interaction for learning/evolution to work.

  *   **Skyrms is the Right Tool:**
      *   **Case:** The gradual emergence and persistence of a regional dialect pronunciation or a specific, inefficient but stable method for dividing agricultural land in a village over generations. No one "decided," alternatives were tried and faded, conformity is habitual and reinforced by social integration.
      *   **Why:** The norm emerged and stabilized through repeated interactions, reinforcement (social acceptance for conformity, mild friction for deviation), and path dependence. Attributing CK of the "coordination problem" to villagers over centuries is unrealistic. Lewis struggles to explain the origin and deep inertia without resorting to implausible levels of sustained collective reasoning.
      *   **Fails for Lewis:** Lewis struggles with norms where the "coordination problem" isn't consciously recognized by participants, or where conformity seems driven more by habit, fear, or reinforcement learning than by reasoning about mutual expectations. Deeply inefficient norms persisting due to inertia are also harder for pure Lewisian rationality.

  ### Your Considered Judgment
  **For understanding why norms *persist*, especially arbitrary or inefficient ones, Skyrms' framework often provides more fundamental explanatory power.** The evolutionary/learning dynamics capture the inertia, path dependence, and the fact that much human behavior is habitual or reinforced rather than constantly re-calculated based on common knowledge. The persistence of centuries-old, costly norms is frequently better explained by the difficulty of coordinated escape from a locally stable (but globally suboptimal) equilibrium state modeled by evolutionary game theory, than by sustained, conscious adherence based on CK of mutual expectations.

  **However, Lewis is indispensable for understanding the *normative force* and conscious maintenance of many conventions.** When people *do* appeal to the rule, sanction deviations, or explicitly coordinate, Lewis captures the cognitive and social reality of mutual expectations and the role of common knowledge in making conformity rational. Skyrms gives us the behavioral engine; Lewis gives us the driver's manual that sometimes gets written *after* the engine is running.

  **In essence:** Skyrms shows *how* the behavioral regularity of convention can emerge and persist *without* Lewis's cognitive prerequisites. This undercuts Lewis's claim that common knowledge is *necessary for the existence of a convention as a stable behavioral pattern*. However, Lewis successfully identifies the *distinctive cognitive and rational structure* that turns a mere behavioral regularity into a *full-blooded social convention* governed by mutual expectations. For norms that flip quickly (like some pandemic greetings or tipping), Lewis helps explain the fragility when common knowledge breaks down, while Skyrms helps explain how new patterns can rapidly emerge through adaptive learning in a changed environment. For the deeply persistent ones, Skyrms' account of evolutionary stability and lock-in is usually the more powerful explanation.
