    },
    "6": {
      "score": 2,
      "justification": "Naomi is unequivocally right. Anscombe's core argument is that intentionally killing innocents as a means (or as an end) is always murderous and absolutely forbidden, regardless of consequences. Her attack on 'calculating consequences' (coining 'consequentialism' pejoratively) targets the moral corruption of justifying such acts through utilitarian arithmetic."
    }
