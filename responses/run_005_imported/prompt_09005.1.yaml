  ```

  ### Who Captured Anscombe's Argument?
  **Naomi** correctly articulates Anscombe's core argument by the end. She identifies:
  1. The failure of double effect due to civilian deaths being *intended as the means* of coercion.
  2. The absolute prohibition on intentional killing of innocents.
  3. The rejection of consequentialist "lesser evil" justifications for such acts.

  **Wes** misinterprets Anscombe by:
  - Framing the debate as a choice between double effect *or* lesser-evil justification, missing her absolute deontological constraint.
  - Treating intention as reducible to subjective redescription, ignoring her objective assessment of the act's structure.

  ### The Missing Wrinkle
  Both overlook **Anscombe's deeper critique of modern moral philosophy's language and character**:
  1. **Corruption of Intention**: Anscombe argues that consequentialism fosters self-deception. Agents (like Truman) describe intentions narrowly ("destroying military targets") while *relying* on evil effects (mass death) for success. This corrupts moral reasoning by obscuring the true nature of the act.
  2. **Moral Psychology**: She emphasizes the *character* of those who make such decisions. Honoring Truman signals societal approval of a man who "chose to kill the innocent as a means," normalizing moral corruption. Her outrage stems from this cultural rot, not just the act itself.
  3. **Justice vs. Expediency**: Anscombe insists justice (absolute prohibitions) must bind state action, rejecting the "end justifies the means" mentality. The bombing wasn't just a tactical error—it exemplified a dangerous ethical collapse where necessity overrides inviolable rules.

  **In essence**: Anscombe’s essay isn’t *just* about Hiroshima or double effect; it’s a polemic against the *moral climate* that justifies atrocities through consequentialist frameworks. Naomi gets the structural argument right, but both miss Anscombe’s focus on how such reasoning corrodes virtue and societal integrity.
