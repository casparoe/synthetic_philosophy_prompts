  Potential pitfalls: making the technobabble too dense. Need to balance exposition with action. Use the confrontation scene to explain the logic. Internal monologue can explore the weirdness of faking terminal goals. Ending with the protagonist's unease reinforces the theme—safety at a moral cost.

