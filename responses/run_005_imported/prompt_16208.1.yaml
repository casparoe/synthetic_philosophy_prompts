answer: |-
  Here's a eulogy that honors your grandmother's legacy, wrestles honestly with the tension she left, and speaks to both audiences, keeping the psychology accessible without lecturing:

  ---

  **For Grandma: The Lesson Unfinished, The Life Lived**

  Good morning. For those who don’t know me, I’m [Your Name], [Grandmother's Name]’s granddaughter. But for the past semester, I was also something else: her student. Again. In her AP Psychology class, and in her Philosophy Club, right up until she retired this past fall.

  Many of you here today sat in those same desks, under her gentle guidance, for nearly thirty years. You know the rhythm of her classroom, the spark in her eye when a discussion caught fire, and you definitely know *the line*. The one she made every class, every year, repeat together: **"Character," we’d chant, "is what you do when nobody’s grading you."**

  That wasn’t just a catchy phrase to Grandma; it was the bedrock of her belief. It was her North Star in ethics – the idea that who we *are* deep down, our virtues, guide our actions, especially when no one is watching, no authority is looming, no test score is at stake. Virtue ethics, she called it. To her, building good character was the most important project of all.

  But Grandma wasn’t someone who taught easy answers. She taught us to question, to probe, to think critically – even about the things she held dear. A few weeks before she hung up her lesson plans for good, she taught us about some powerful, unsettling psychological studies: Milgram’s obedience experiments, Zimbardo’s Stanford prison simulation, and Darley and Batson’s study where seminary students, hurrying to give a talk on the Good Samaritan, literally stepped over someone in apparent distress.

  These studies presented a profound challenge – the "situationist critique." They suggested something deeply uncomfortable: that often, the situation we’re in – the pressure, the hurry, the perceived authority, the role we’re playing – can override our inner character. That good people, under certain circumstances, can do things that seem completely out of step with who they believe themselves to be.

  And Grandma, with that fierce intellectual honesty we all loved and respected, looked at us and admitted, unprompted, that she’d wrestled with this critique her entire career. She said she’d never found an answer to it that she *truly, fully believed* resolved the tension. She left that thought hanging in the air, a question mark at the end of her long teaching journey. She died last week before she could circle back and finish that thought with us.

  That unfinished conversation… it feels heavy. It feels like a thread left dangling. But as I’ve thought about it this week, preparing to say goodbye, I’ve realized something. Maybe Grandma *did* leave us an answer. Not a neat, philosophical proof written on a whiteboard, but an answer written in the story of her own life.

  Because for nearly thirty years, day in and day out, semester after semester, she *chose* the situation. She deliberately placed herself in the classroom. She created the environment. Not an environment designed to elicit obedience to cruelty or indifference, but one meticulously crafted to *nurture* character. To spark curiosity. To challenge assumptions. To foster empathy. To repeat, again and again, that line about what we do when no one is grading.

  She didn’t ignore the power of the situation; she wielded it. She understood its force, perhaps better than anyone, which is why she dedicated her life to building situations – classrooms, clubs, conversations – where good character could be practiced, discussed, reflected upon, and yes, *chosen*. She believed that while situations are powerful, we aren’t powerless within them. We can build better situations. We can practice awareness. We can cultivate the habits that help our inner compass hold true, even when the winds of circumstance blow hard.

  Her life was a testament to the belief that character *matters*, that it can be *cultivated*, and that cultivating it in others is a worthy, lifelong endeavor. Was it the absolute, unchallengeable answer to Milgram or Zimbardo? She admitted she didn't know. But her unwavering commitment to fostering virtue, her deep concern for *who her students became* when they left her classroom and entered the complex world... that *was* her answer. It was an answer lived, not just theorized.

  So yes, Grandma, we remember your famous line: "Character is what you do when nobody’s grading you." But today, we also remember your profound honesty in facing the difficult questions. We remember that you understood the world isn't always a fair test, that situations can be overwhelming. And most of all, we remember that you spent your life building spaces where character could grow, where questions could be asked safely, and where we were gently, persistently, reminded to look inward and ask ourselves who we wanted to be when the pressure was on.

  That was your lesson, finished or not. That was your profound gift to us. And that is the quiet, powerful answer you lived every single day. Thank you, Grandma. We’ll keep asking the questions. We’ll keep trying to live the answers.

  ---

  **Why this works:**

  1.  **Grounds in Shared Experience:** Starts warmly with the classroom, the shared line ("nobody's grading"), instantly connecting with former students and giving context to family.
  2.  **Introduces the Core Belief Clearly:** Explains "virtue ethics" simply through the famous line and her belief in building character.
  3.  **Presents the Tension Honestly:** Describes the situationist studies *in accessible terms* (pressure, hurry, roles, good people doing unexpected things) without jargon. Explicitly states her unresolved struggle.
  4.  **Connects it to Her Life as the Answer:** The key pivot. Instead of a theoretical resolution, it finds the resolution in *her actions* – her lifelong commitment to *creating situations* that fostered character. This reframes her admission not as defeat, but as deep understanding motivating her life's work.
  5.  **Uses Her Own Words:** Bookends with the famous line, reinforcing her core message.
  6.  **Honors Her Honesty:** Explicitly praises her intellectual courage in admitting doubt, making her more human and admirable.
  7.  **Accessible to All:** Avoids technical terms ("situationism," "virtue ethics" is mentioned once but immediately explained). The studies are described conceptually. The focus is on the *human dilemma* they reveal and Grandma's *response* to it.
  8.  **Fits the Occasion:** Maintains a eulogy's reverence and warmth while tackling the intellectual tension. It's a tribute centered on her impact and integrity.
  9.  **Leaves Room:** Doesn't pretend to have solved the philosophical debate. It shows how Grandma lived *within* that tension, purposefully and meaningfully.

  This eulogy honors your grandmother's intellect, her honesty, her profound influence as a teacher, and the specific, meaningful tension she left you with, offering a resolution found in the way she lived her life. It should resonate deeply with her students and be moving and understandable for all.
