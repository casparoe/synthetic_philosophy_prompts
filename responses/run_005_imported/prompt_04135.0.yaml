  First, I need to recall the hole argument. Einstein used it around 1913-1914 when developing GR. The argument involves applying a diffeomorphism that acts as the identity outside a "hole" region but changes the metric inside. Since both the original and transformed metrics satisfy the Einstein field equations, this seems to imply indeterminism: initial data on a Cauchy surface don't uniquely determine the future metric inside the hole.

