answer: |-
  Here is a eulogy that honors your grandmother, acknowledges the profound role of her notebook, draws thoughtfully on the *spirit* of the extended mind thesis without lecturing, and offers comfort grounded in observable reality:

  ---

  **For Grandma**

  Good morning. Thank you all for being here to remember and celebrate my grandmother, [Grandmother's Name]. She was a force – full of [mention a few specific, positive traits: e.g., warmth, stubbornness, laughter, incredible baking skills]. She loved her family fiercely, found joy in [mention a specific hobby or interest], and had an opinion on just about everything, usually delivered with that twinkle in her eye.

  For those of us who knew her in these last years, we also witnessed a different kind of strength – the strength it took to navigate a world where memories, the very anchors of her identity, were fading. Alzheimer's is a cruel thief. It took names, faces, dates, even the taste of her own famous pie. It was heartbreaking to see.

  But Grandma fought back. Her weapon? That little notebook. It became as much a part of her as her glasses or her favorite sweater. She carried it everywhere, consulted it constantly, trusted it absolutely. Inside weren't just scribbles; they were vital lifelines: "John is my grandson, he loves baseball." "Robert passed away in 2015." "Had soup for lunch." "Mary's birthday is next week."

  Mom said something recently that really stuck with me. She said, near the end, "Her mind was really in that notebook."

  And you know, in a very real way, it was. Not because the notebook *was* her brain, but because it became the place where the person she *still was* – the woman who loved us, who wanted to connect, who needed to know who she was and what mattered – could find herself and reach out to us.

  When her own memory couldn't hold things reliably anymore, she found a way. She poured the things that were essential *to her being Grandma* into those pages. She trusted that little book implicitly, instantly, constantly. It wasn't just a reminder; it was her active way of holding onto her world, of insisting that her relationships, her history, her daily life *still mattered*.

  In those moments when she read "Robert passed away," the grief was fresh and real – *her* grief. When she read "John loves baseball," the love she felt for me was right there. The notebook didn't create those feelings or that love; it gave them a place to reside and be accessed when her biology was failing her. It was her tool, her extension, the bridge she built between the person inside and the world outside.

  What does this tell us about what survived? It tells us that the core of Grandma – her love for her family, her need to connect, her fundamental self – endured long after the disease made remembering names or dates impossible. That notebook was proof. Proof that she was still *in there*, fighting to know us and to be known. Proof that her spirit, her desire to be present with the people she loved, was unbroken. She used that notebook not to become someone else, but to remain *herself* as fully as she possibly could.

  So, while the notebook itself is just paper and ink, what it represented was extraordinary: her resilience, her enduring love, and her fierce determination to stay connected to us until the very end. It wasn't her mind in a literal, biological sense, but it was absolutely an expression of her mind – her will, her heart, her persistent self – reaching out.

  We will miss her terribly – her laugh, her stories, her presence. But let’s find comfort in knowing that the love she poured into us, the love she meticulously wrote down to remember even when it was hard, that love survives. It's etched not in a notebook, but in our hearts and memories. And that love is the truest, most enduring part of her legacy.

  Thank you, Grandma, for loving us so fiercely, and for showing us what real strength looks like. We love you.

  ---

  **Why this works:**

  1.  **Honors Her & Acknowledges Loss:** Starts with who she *was*, acknowledges the pain and reality of Alzheimer's.
  2.  **Uses Mom's Words:** Directly incorporates your mother's poignant observation ("her mind was really in that notebook"), validating it as the family's own understanding.
  3.  **Captures the *Spirit* of EMT, Not the Letter:** It focuses on the *observable reality*:
      *   The notebook was **trusted absolutely and constantly** ("trusted it absolutely," "consulted it constantly").
      *   It was **deeply integrated** into her cognitive and emotional life ("as much a part of her," "vital lifelines," "the place where the person she still was... could find herself").
      *   It **enabled her core self to persist** ("gave [her feelings/love] a place to reside," "her tool, her extension, the bridge," "her resilience, her enduring love, her fierce determination," "an expression of her mind – her will, her heart, her persistent self").
  4.  **Avoids Philosophical Claims:** Doesn't say "her mind *was* the notebook" or claim it was "literally" part of her mind. Uses softer, metaphorical, yet powerful language ("in a very real way," "the place where," "proof that," "expression of her mind").
  5.  **Focuses on the *Person*, Not the Theory:** The emphasis is on *her* actions, *her* trust, *her* love, *her* persistence. The notebook is framed as *her* chosen tool for maintaining *her* identity and connections.
  6.  **Offers Specific Comfort:**
      *   Her core self (love, spirit, will to connect) endured.
      *   The notebook was evidence of her fight *to be herself*.
      *   The love she documented and felt is the enduring legacy.
  7.  **Acknowledges the Notebook's Limits:** Explicitly states it wasn't her mind in a "literal, biological sense" and that it was "just paper and ink." The real treasure was what it *represented* about her.
  8.  **Non-Academic Language:** Uses accessible, emotional language. No jargon (Parity Principle? Constitution? Causal coupling? All avoided).
  9.  **Resolves in Legacy:** Ends powerfully on the love that survives in *you*, moving beyond the notebook to the lasting impact she had.

  This eulogy uses the profound insight behind the extended mind thesis – that our tools can become deeply woven into our cognitive and personal identity – to illuminate your grandmother's remarkable resilience and enduring love in a way that is honest, comforting, and entirely focused on honoring *her*. It speaks the emotional truth your mother recognized, without needing philosophical justification.
