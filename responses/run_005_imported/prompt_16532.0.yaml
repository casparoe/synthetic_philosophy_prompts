answer: |-
  ## The Broken Compass: Why Teleosemantics Fails to Naturalize Mental Content

  Teleosemantics promises a compelling naturalization of mental content: by grounding representation in the evolved "proper function" of a state—what it was *selected* to do—it seemingly explains both successful representation and misrepresentation while avoiding the pitfalls of purely causal or informational theories. A frog's visual state triggered by a fly represents *fly*, not because flies always cause it, but because that state's proper function is to detect flies; when triggered by a BB pellet, it *misrepresents*. This elegance is undeniable for simple biological detectors. However, when subjected to deeper scrutiny, particularly through the lenses of the **Disjunction/Indeterminacy Problem** and **Davidson's Swampman**, teleosemantics reveals fundamental limitations that prevent it from successfully naturalizing mental content, especially for complex cognition like human thought.

  **Deepening the Disjunction/Indeterminacy Problem:**

  The core issue isn't merely that multiple descriptions fit the evolutionary history; it's that teleosemantics lacks the resources to *privilege* one description as the *correct* content over others that are equally compatible with the selection history.

  1.  **Levels of Abstraction:** Why does the frog's detector represent "fly" rather than:
      *   "Small, dark, moving thing" (a description capturing the proximal stimulus the detector *actually* responds to)?
      *   "Nutritious insect" (a functional description capturing the *value* driving selection)?
      *   "Appropriate prey for tongue-striking" (a description tied to the specific motor output)?
      *   "Fly-or-BB-pellet" (a disjunction that technically covers all past triggers, including the misrepresentations)? Millikan argues selection is for the *property* that explains the success of ancestors, dismissing disjunctions as explanatorily inert. But why "fly" over "small dark nutritious moving thing"? Both properties *did* explain ancestral success. The teleosemanticist must argue that evolution "cares" only about the most *specific* property that consistently correlated with fitness benefits. Yet, "fly" itself is a disjunction (male flies, female flies, different species). How specific is specific enough? This problem escalates dramatically with human concepts.
  2.  **Scalability to Human Cognition:** Human concepts are abstract, multifunctional, and decoupled from immediate stimuli and responses. Consider the concept "water."
      *   Was it selected for tracking H₂O (the chemical kind)?
      *   Or for tracking the potable liquid found in rivers and lakes (a functional kind)?
      *   Or for tracking the clear, thirst-quenching stuff (a phenomenological kind)?
      *   Our ancestors succeeded by finding *potable* liquid; H₂O was the underlying structure reliably causing that potability in their environment. But teleosemantics seems to offer no non-arbitrary way to choose between "H₂O" and "potable liquid" as the *content*, especially since "potable liquid" could, in principle, be realized by non-H₂O substances (even if it never was historically). Concepts like "democracy," "quark," or "justice" are even worse. Their historical "proper functions" are incredibly diffuse, tied to complex social, linguistic, and inferential roles that defy pinpointing a single evolutionary target. Teleosemantics struggles to explain why "water" means H₂O rather than the more immediately functional "stuff like *that*" (pointing to water samples).

  *Teleosemanticist Replies & Their Weaknesses:*
  *   **The Most Specific Explanatory Property (Millikan):** Selection targets the *most specific* property reliably correlated with fitness benefits in the evolutionary environment. "Fly" is more specific than "small dark thing," and "H₂O" is more specific than "potable liquid." *Weakness:* Specificity is context-dependent and often indeterminate. Why is "H₂O" the *content* rather than "the chemical composition underlying potable liquid in our ancestral environment"? The latter is arguably the explanatorily relevant property for selection. Furthermore, for abstract concepts, identifying *any* single, specific property as the evolutionary target is implausible.
  *   **Consumer-Based Teleosemantics (Millikan):** Content is fixed not just by the producer (the detector state), but crucially by how *consumers* (downstream mechanisms) use the representation. The frog's snap mechanism consumes the detector state *as a sign for a snap-able target*. This might favor "fly-sized moving target" over "nutritious insect." *Weakness:* This pushes the problem downstream. What is the proper function of the *consumer* mechanism? And how do consumers disambiguate "fly-sized moving target" from "BB-pellet-sized moving target"? Consumers also rely on input correlations established by evolution. The indeterminacy reappears at the level of defining the consumer's proper function and the specific way it utilizes the signal. Human cognition involves complex hierarchies of consumers with intertwined functions, exacerbating the problem.

  **Deepening Davidson's Swampman:**

  Davidson's thought experiment isn't just a quirky puzzle; it strikes at the heart of teleosemantics' historical essentialism.

  1.  **The Essence of the Challenge:** Swampman is molecule-for-molecule identical to Davidson moments after a lightning strike creates him. He looks, acts, speaks, and *introspects* exactly like a person. He avoids snakes, discusses philosophy, and claims to remember his childhood. According to teleosemantics, however, he lacks *any* mental states with genuine content. His neural states lack proper functions because they have no selection history. His utterances are meaningless noises; his apparent beliefs about snakes or philosophy are not *about* anything. He is, functionally and phenomenologically, a perfect zombie.
  2.  **The Intuitive Force:** The intuition that Swampman *does* have a rich mental life is incredibly strong. It seems absurd to deny him thoughts, beliefs, or desires simply because he lacks ancestors. This intuition stems from the conviction that what matters for mentality is *current structure, function, and causal organization*, not past history. Swampman's brain states stand in the same complex causal/inferential relations to each other and the world as Davidson's do *now*. Denying him content privileges history over current causal power in a way that seems deeply counterintuitive for explaining conscious experience and rational behavior.
  3.  **The Scope of the Problem:** Swampman isn't just a problem for beliefs; it extends to perception, desire, pain – any state purportedly possessing intentional content. If teleosemantics is correct, Swampman doesn't *see* the snake, doesn't *fear* it, and doesn't *intend* to avoid it. He merely exhibits a complex, content-less behavioral response pattern.

  *Teleosemanticist Replies & Their Weaknesses:*
  *   **Biting the Bullet (Neander/Papineau):** Swampman genuinely lacks original intentionality. His states have only "derived" intentionality (like words or symbols), dependent on *our* interpretation, not intrinsic content. He's a sophisticated biological robot. *Weakness:* This violates powerful intuitions about the supervenience of the mental on the physical. Two physically identical beings in identical environments *should* have identical mental states. Denying this makes mentality mysteriously historical in a way physics and biology generally are not. It also seems to make our *own* ascriptions of mentality to others dependent on knowing their evolutionary history, which is epistemologically problematic.
  *   **Learning History as Functional History (Dretske-inspired):** Perhaps individual learning can establish proper functions. Swampman, lacking *any* history (evolutionary *or* learning), still fails, but ordinary humans acquire content through learning histories that establish indicator functions. *Weakness:* This significantly weakens the core evolutionary story. If learning can establish content independently, why is evolution essential? More crucially, Swampman *could* plausibly be imagined to start learning immediately upon creation. Does he gain content only *after* his first learning trial? What about his apparent mental states *before* that first interaction? The reply doesn't resolve the core intuition that his identical structure *at creation* should suffice for some form of intentionality.
  *   **The "No Real Problem" Reply:** Swampman is nomologically impossible; the laws of physics don't allow for such spontaneous assembly of complex functional systems. *Weakness:* Thought experiments don't require nomological possibility, only conceptual coherence. The point is to test the *conceptual necessity* of historical origin for content. Even if physically impossible, the coherence of the scenario highlights that teleosemantics defines content in a way that seems conceptually disconnected from the present physical and functional reality that *appears* to constitute mentality.

  **Verdict: Teleosemantics Fails as a Complete Naturalization of Mental Content**

  While teleosemantics offers a powerful and elegant account of **simple biological signaling and detector content** (e.g., frog fly-detectors, basic pain mechanisms, simple drives), it **fails demonstrably** as a complete naturalistic theory of mental content, particularly for **human cognition and phenomenal intentionality**.

  1.  **Indeterminacy is Fatal for Complex Content:** The disjunction problem is not a minor technical glitch. It reveals a fundamental inability of selection history alone to pin down the specific, often abstract, contents of human thought. Appeals to specificity and consumer functions ultimately rely on interpretations of evolutionary history that remain contestable and fail to capture the normativity and determinacy inherent in human concepts and propositional attitudes. Teleosemantics cannot adequately distinguish between "H₂O" and "potable liquid" as the content of "water," let alone handle concepts detached from direct biological functions like "mathematical truth" or "fictional character."
  2.  **Swampman Exposes Historical Essentialism's Counterintuitive Consequences:** The necessity of evolutionary history for *any* original intentionality leads to the deeply unpalatable conclusion that a physically and functionally identical duplicate lacks a mind. While teleosemanticists might bite this bullet, the intuitive force of Swampman suggests that current causal-structural properties, not past history, are the primary supervenience base for mentality. Denying Swampman content reveals teleosemantics as prioritizing a specific *origin story* over the *current causal powers* that seem constitutive of thought.
  3.  **The Scope Limitation is Fundamental:** The theory's successes are confined to content tightly coupled to specific, evolutionarily ancient biological functions with clear inputs, outputs, and fitness consequences. Human cognition involves open-ended inference, language, abstraction, and culturally shaped concepts that are decoupled from any single evolutionary function and exhibit a degree of determinacy and normativity that teleosemantic resources cannot capture. The frog's detector might successfully represent "fly-ish thing," but human "belief" or "justice" cannot be similarly reduced.

  **Therefore, teleosemantics cannot, on its own, succeed in fully naturalizing mental content.** It provides crucial insights into the biological roots of representation and a compelling account of misrepresentation for simple systems. However, the indeterminacy of content from evolutionary functions and the counterintuitive implications of its historical essentialism, highlighted by Swampman, prove insurmountable for explaining the richness and determinacy of human intentionality. A successful naturalization will likely require augmenting teleosemantic insights with other elements – such as inferential role semantics, complex systems dynamics, or an account of the unique properties of neural computation – that can better account for the abstract, determinate, and potentially history-independent aspects of our mental lives. Teleosemantics illuminates part of the path, but it is not the final destination.
