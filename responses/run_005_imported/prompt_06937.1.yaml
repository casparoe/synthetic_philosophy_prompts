answer: |-
  You've pinpointed the core tension in Yudkowsky's metaethical dissolution: the claim that rigidly designating a specific, complex computation escapes the Euthyphro dilemma *without* smuggling in an independent standard. I argue this move fails because **individuating "the right computation" by its content (fairness, welfare, etc.) inevitably relies on pre-theoretic, realist intuitions about what *makes* that content morally significant, thereby reintroducing the independent standard.**

  Here's the breakdown, engaging with the strongest Yudkowskian replies:

  1.  **The Core Argument: Content Individuation Requires a Prior Standard**
      *   **Problem:** To identify *which specific computation* "right" rigidly designates, we must point to its *content* – the fact that it outputs judgments *about fairness, suffering, and autonomy*, not about prime-numbered pebbles. This act of selection ("*this* computation, the one concerned with *these* things") implicitly relies on the judgment that *fairness, suffering, and autonomy are morally relevant properties*.
      *   **Why this reintroduces the standard:** This judgment – that certain contents (fairness) are morally significant while others (prime-sorting) are not – cannot *itself* be grounded solely in the computation. It must appeal to a prior, independent understanding of what constitutes moral relevance or value. *What is it about the structure of fairness, suffering, or autonomy that makes computations about them the "right" ones?* The answer points *beyond* the mere computational process to properties inherent in the subject matter itself. This independent property (e.g., the inherent badness of suffering, the inherent value of autonomy) is the very "independent standard" Yudkowsky sought to dissolve.

  2.  **Engaging the Strongest Yudkowskian Reply: Causal Role & Functional Individuation**
      *   **The Reply:** Yudkowsky might argue that we don't identify the computation *by* its content *per se*, but by its **causal-functional role** within the human cognitive architecture and evolutionary history. "The right computation" is rigidly designated as *that specific causal process* in our brains (or its idealized counterpart) that historically mediated cooperative behavior, aversion to harm, reciprocal exchange, etc. Its *outputs* (concerns about fairness) are a *consequence* of its functional role, not the primary identifier. We point to the *mechanism* via its causal history and effects, not by evaluating the moral worth of its outputs independently.
      *   **Why this Reply Fails:**
          *   **The Selection Problem Persists:** Why rigidly designate *this specific causal process*? Why not the process governing pebble-sorting preferences in the aliens? The answer *must* involve the *nature of the outputs*. We select the human process *because* its outputs concern things we pre-theoretically recognize as morally significant (fairness, harm). The functional role is only deemed relevant *because* it produces outputs we already value. The appeal to functional role doesn't escape the need to privilege the *content* produced by that role. The alien process has a functional role too (mediating their social cohesion around pebble-sorting), but we don't call *that* "morality." The distinction relies on our prior judgment about the *moral relevance of the content*.
          *   **The Moral Significance of the Functional Role Itself:** Even if we focus solely on the functional role (e.g., "promotes cooperation/survival"), why is *this* functional role morally significant? Why should promoting cooperation or survival define "the right computation"? This simply pushes the question back. Is cooperation *inherently* valuable? If yes, that's an independent standard. If no – if it's only significant *because* this computation outputs it – then we're back to the computation defining its own standard, facing the arbitrariness horn: why is *this* computation's output binding? The functional role itself needs justification beyond "it's what this brain process does."
          *   **The Pebble-Sorter Parable Backfires:** The parable highlights the problem. Yudkowsky uses it to show we don't think pebble-sorting is moral, implying *our* computation is different. But *how* do we know it's different in the *morally relevant* way? Only by recognizing that fairness/suffering have a property pebble-sorting lacks – a property we grasp independently of the rigidly designated computation. The parable *relies* on our pre-existing, realist intuition about moral relevance to make its point.

  3.  **The Failure of Dissolution: Covert Realism**
      *   The rigid designation move attempts to dissolve the independence horn by denying *any* standard external to the computation. However, the act of successfully rigidly designating *the specific computation we call "right"* requires utilizing a criterion – the moral significance of its content – that *functions as* an independent standard. This criterion isn't *created by* the computation; it's the *reason* we point to *that* computation and not another. The computation is deemed "the right one" *because* of the independent moral properties its content refers to (or attempts to track, even imperfectly).
      *   **Result:** The dilemma isn't dissolved. The independence horn reappears in disguised form: The moral significance of fairness, suffering, and autonomy (or the functional roles they are tied to) acts as the independent standard that explains *why* this specific computation is rigidly designated as "right." The computation doesn't *create* the wrongness of suffering; our identification of *which* computation is "right" *presupposes* that suffering is bad. The rigid designation move doesn't eliminate the standard; it merely makes it implicit in the act of reference-fixing.

  4.  **Addressing "No Further Standard" Claim:**
      *   Yudkowsky claims there is "no further, independent standard the computation needs to answer to." However, for the rigid designation to *work* – for "right" to successfully refer to *this specific computation* and not another – there *must* be a criterion distinguishing it. That criterion (the moral relevance of its content/functional role) *is* the further standard. The computation *does* answer to it, implicitly, because it's the standard used to pick it out as the referent in the first place. Denying this standard exists *after* fixing the reference doesn't eliminate its crucial role *in* fixing the reference. The dissolution requires the reference-fixing to be metaphysically neutral, but it demonstrably isn't.

  **Conclusion:**

  Yudkowsky's rigid designation strategy is ingenious but ultimately unsuccessful against the Euthyphro dilemma. While it formally avoids grounding morality directly in an authority's command, individuating *which* specific computation "right" rigidly designates *requires* relying on the perceived moral significance of its content (fairness, suffering, autonomy) or the functional role producing that content. This reliance covertly reintroduces an independent standard – our pre-theoretic grasp of the moral relevance of certain states of affairs or functional roles. The pebble-sorter parable highlights this dependence rather than avoiding it. Therefore, the independence horn isn't dissolved; the standard is smuggled in through the back door of reference-fixing. The rigid designation move doesn't eliminate the need for an independent grounding for moral significance; it merely obscures where that grounding is located (in our realist intuitions about the content itself). The dilemma stands: either the computation is "right" because its content tracks something independently morally significant (realism/independence horn), or its designation as "right" is arbitrary relative to other possible computations (arbitrariness horn). Yudkowsky's dissolution tries to evade this but fails to escape the underlying logic.
