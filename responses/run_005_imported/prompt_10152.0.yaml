  Here's the tier list ranking the positions on maximizing expected geometric growth (log wealth) vs. plain expected wealth, based on philosophical defensibility in decision theory. The ranking reflects academic consensus and logical robustness, with S-tier being the most rigorous and D-tier being the most reckless or easily refuted.

  ```json
  {
    "S": ["Kelly's info-theoretic argument", "Ergodicity economics"],
    "A": ["Almost-sure long-run dominance", "Fractional Kelly as pragmatic hedge"],
    "B": ["Log utility is arbitrary"],
    "C": ["Samuelson's objection"],
    "D": ["Unrestricted EV maximization"]
  }
  ```

  ### Key Rationale:
  - **S-Tier**: Kelly's original information-theoretic framing and Peters' ergodicity economics are foundational, mathematically rigorous, and address core limitations of expected value (EV) in multiplicative growth scenarios.
  - **A-Tier**: Long-run dominance is theoretically powerful but asymptotic; fractional Kelly is a practical compromise for real-world uncertainty.
  - **B-Tier**: "Log utility is arbitrary" is technically valid (any concave utility works in Von Neumann-Morgenstern theory) but understates log's unique properties for wealth growth.
  - **C-Tier**: Samuelson's objection is historically important but largely refuted by modern work on non-ergodic processes.
  - **D-Tier**: Unrestricted EV maximization leads to almost sure ruin in repeated bets—indefensible for any rational agent.

  ### Novel-Writing Tips:
  - Give your **protagonist** S-tier arguments (e.g., "Kelly's insights aren't just math—they're about information efficiency" or "Ergodicity isn't pedantry; it's why billionaires don't bet everything on 51% coins").
  - Give the **roommate** D-tier arguments (e.g., "Why hedge? Just keep shoving all-in on positive EV!"). Samuelson (C-tier) also works for a sophisticated-but-wrong antagonist.
  - For realism, have the protagonist acknowledge A-tier points (e.g., "Sure, I fractional-Kelly to survive model errors—but that's tactical, not philosophical").
