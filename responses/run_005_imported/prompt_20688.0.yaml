  The ending must show the attribution functioning (prize ceremony, gravestone) while the protagonist internally rejects all four positions. Key imagery: the lightbulb moment where she sees the futility of seeking inherent "Vera-ness," yet the poems still *work* as Vera's. 

  Avoid clichés: no Buddhist trappings, no didactic dialogue. Instead, use literary devices—mirroring Vera's fragmented handwriting in the protagonist's fractured thoughts, or the damaged pages as metaphor for svabhāva's impossibility. 

  User's deeper need: a story where philosophical tension drives plot, not just theme. They want the tetralemma to *hurt*—through the protagonist's cognitive dissonance—while the world moves on conventionally. 

  Potential pitfalls to avoid: 
  - Making the rival/family/committee straw men. Give each perspective weight. 
  - Letting the protagonist "solve" the dilemma. She should stand barehanded at the end, holding the award but not the truth. 
  - Over-explaining. Trust subtext: when the committee member says "the attribution is a door," let it resonate without spelling out emptiness. 

  Structural rhythm: 
