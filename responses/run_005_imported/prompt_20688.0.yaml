answer: |-
  ## The Four Positions of Vera

  The envelope felt heavier than paper should. Inside lay the letter: Vera’s reconstructed cycle, *Ashes in the Hourglass*, shortlisted for the prestigious Alden Prize. Ten years of Leda’s life – deciphering smudged ink on water-damaged pages, filling gaps where fragments dissolved into nothingness, wrestling Vera’s obscure, near-extinct dialect into English – condensed into this moment. Joy flared, pure and bright. *It was hers.* Vera’s voice, rescued. Vera’s vision, completed. Leda traced the printed title on the letterhead, feeling the ghost of her grandmother’s decisive pen strokes in the reconstructed lines. The final stanza, one of the few entirely Vera’s own, echoed: *"The river forgets its name / Yet carves the stone the same."*

  Then came the email from Elara Vance. Subject line: **Attribution Concerns – Vera Petrova Cycle.**

  Elara, a sharp-tongued scholar of minority literatures, had published her own translations of Vera’s earlier, undisputed work. Her email was meticulously damning. She pointed to reconstructed sections – particularly the pivotal third poem, where only the first line and a water-stained final image ("a cracked bell’s silent tongue") were Vera’s. Leda had woven the rest from contextual clues and thematic resonance. "While Leda’s effort is commendable," Elara wrote, "presenting this as *Vera’s* last poems is a profound misrepresentation. The core, the essence, in the most crucial passages... it is *not* hers. It’s Leda’s skillful ventriloquism, a pastiche. The attribution is dishonest."

  *Not hers.* The words landed like stones. Leda reread her own reconstructed lines in the third poem: *"The weight of unsung hours / bends the spine of the clock tower."* Were they true to Vera’s compressed, imagistic style? Yes. Did they flow logically from the surviving fragments? Absolutely. But were they Vera’s? Or were they Leda’s, emerging from years of immersion? The certainty of ownership dissolved. Elara had exposed the seams.

  Uncle Tomasz, Vera’s younger brother, arrived smelling of pipe smoke and worry. "Leda, *kochanie*, this prize... it’s wonderful! But this woman, Vance... she makes noise." He patted her hand, his eyes rheumy but kind. "Look, the poems... they *are* Vera’s. Her words, her heart. But also, they *are* yours. You gave them breath where the pages were torn. You held the fragments together. So... *both*. It’s Vera *and* Leda. Like... like a tapestry you repaired with threads that match." He beamed, satisfied with his solution. "Tell the committee that. Simple."

  *Both.* Leda tried the concept on. Her labor and Vera’s legacy intertwined. The reconstructed sections weren't fraud; they were restoration, collaboration across time. She drafted a statement: "The sequence represents a dialogic reconstruction, honoring Vera Petrova’s extant fragments while necessitating interpretive completion..." But reading it aloud, it felt hollow. Where did Vera end and Leda begin in the line *"Memory’s ink bleeds through the page of years"*? Was it *both*, or was it a convenient fiction masking an impossible separation? The "and" felt like a bridge built over a chasm no one could see the bottom of.

  The Alden Committee requested a meeting. Dr. Aris Thorne, the chair, a man whose quiet intensity filled the small conference room, laid out the concern. "Ms. Petrova," he began, carefully avoiding 'Vera', "the artistic merit is undeniable. But the *attribution* is the issue. Ms. Vance argues the reconstructed sections fundamentally alter the potential artistic intent. Your uncle suggests a duality. But consider the *work itself*." He tapped the manuscript. "Take this line you reconstructed: *'Nothing holds still long enough to be named.'* Poignant. But is it Vera’s thought, or yours? We have no independent access to Vera’s unwritten intentions to compare. The fragments offer clues, not blueprints. The finished poem... it *is* what it is. But claiming it definitively *is* Vera’s requires evidence we lack. Claiming it *is not* ignores the foundational fragments. Claiming it *is both* implies we can isolate and weigh contributions that are now intrinsically fused. Perhaps..." he paused, choosing his words, "...perhaps the question of inherent, singular ownership is unanswerable. Perhaps, in its present form, the sequence *is neither* solely Vera’s creation nor solely yours. It occupies a space where such definitive attribution cannot be finally adjudicated based on the work alone. It *is* the poem we have."

  *Neither.* The final position wasn't an accusation, but a quiet nullification. Leda felt the ground vanish. Not hers, not Vera’s, not both. Something else entirely, existing outside the cage of those four possibilities. The poem wasn't *waiting* to be claimed; it simply *was*. Thorne wasn't denying the fragments' origin, nor Leda’s work. He was pointing to the impossibility of finding an *essence* of "Vera-ness" within the final text that could settle the matter intrinsically. The attribution wasn't a discovered fact within the words; it was a label applied *to* them.

  The award ceremony proceeded. *Ashes in the Hourglass* won. The citation read: "The Alden Prize is awarded to *Ashes in the Hourglass*, the final poetic sequence by Vera Petrova, reconstructed and translated by Leda Petrova." Leda stood on the stage, the weight of the medal around her neck, the applause washing over her. She read Vera’s final, intact stanza: *"The river forgets its name / Yet carves the stone the same."* Then, her own reconstructed lines flowed, resonant and clear: *"Nothing holds still long enough to be named. / We build our houses on the moving ground."* The audience heard beauty, loss, continuity. No one heard the four collapsing positions. The words *worked*. They meant something. They moved people. The attribution *functioned*. It pointed adequately for the purpose at hand – honoring a poet, presenting a work.

  Later, at the small reception, Elara Vance approached. "Congratulations," she said, her tone clipped but not hostile. "The reading was... effective." Leda simply nodded. There was nothing to argue, no synthesis to offer. Elara believed the poems *were not* Vera's in essence. Tomasz believed they *were both*. Thorne understood they were *neither* in any absolute sense. And Leda? Standing there, the medal cold against her skin, she knew only that the insistence that they *were* Vera’s, pure and simple, had dissolved under scrutiny. Yet, the name held.

  Two years on, Leda stood before the newly installed headstone. Vera’s name, dates, and beneath: *Poet*. And then, the final lines of *Ashes in the Hourglass* were carved into the granite:

  *The river forgets its name
  Yet carves the stone the same.*

  *Nothing holds still long enough to be named.
  We build our houses on the moving ground.*

  Her reconstructed lines were there, cut deep into the stone beside Vera’s own. The attribution was implicit, conventional, unquestioned by the granite or the rain. It functioned perfectly. It named. It honored. It pointed. It didn’t require, and never had possessed, an inherent, unchanging essence of "Vera" locked within the words themselves. The name held the fragments and the fills, the certainty and the void, without needing to resolve them. It was enough. The river flowed, carving the stone.
