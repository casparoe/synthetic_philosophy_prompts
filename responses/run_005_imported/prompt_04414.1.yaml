  First, I need to recall the Reflection Principle. It states that your current credence in a proposition, given that your future credence will be r, should also be r. So if you're sure your future self will believe something with 70% confidence, you should believe it 70% now. The critics highlight scenarios where this doesn't make sense, like knowing you'll forget important info or become irrational. That leads to restricted versions of Reflection.

