prompt: |-
  My team has spent two separate meetings arguing about something we can't resolve, and I'd like an outside perspective. We shipped a feed-ranking feature built entirely from weighted heuristics and hand-tuned rules based on click history — no neural networks, no training loop, nothing that updates itself after deployment. Nobody disputes any of that; everyone agrees on exactly what the system does and how it was built. What we can't agree on is whether we're allowed to call it "AI" in our documentation and marketing. Half the team says yes: it's an automated system doing something that used to require human judgment, and that's how competitors describe comparable features. The other half says no: "real" AI requires machine learning, in their view, and calling this AI is closer to false advertising. It's not just a matter of pride, either — our legal team recently introduced a mandatory review process for anything labeled "AI," so the label carries real downstream consequences. We've compared outside definitions, dictionary entries, even a couple of industry white papers, and nobody has budged. Is one side simply right and the other confused, or is something else going on here?
reasoning: |-
  Okay, let me start by understanding the user's problem. Their team is stuck in a debate about whether their heuristic-based feed-ranking system qualifies as "AI" for marketing and documentation. They've had two meetings without resolution, and it's causing friction. 

  First, I need to unpack why this is contentious. The core issue isn't just semantics—it's about legal implications (mandatory reviews) and competitive positioning. Both sides have valid points: one emphasizes automation mimicking human judgment, the other ties "AI" strictly to ML. 

  I recall that "AI" has always been a fluid term. Early symbolic systems like ELIZA were called AI despite zero ML. The term's meaning shrinks when tech advances ("AI effect"). Modern pop culture equates AI with neural nets, but industry uses it more broadly (e.g., rule-based chatbots labeled as AI). 

  The legal angle is critical here. If "AI" triggers compliance hurdles, the practical cost might outweigh the marketing benefit. Competitors' usage matters, but so does internal overhead. 

  Hmm... the real conflict might be about risk tolerance. The pro-AI faction likely wants competitive parity, while the anti-AI side fears backlash (legal or reputational). Neither is "wrong"—it's about what definition serves their specific needs. 

  I should suggest reframing the debate. Instead of "is this AI?" (unanswerable), ask "does calling this AI help us, and at what cost?" Metrics like customer perception and legal workload could break the deadlock. 

  Also worth considering: could they sidestep the term entirely? Phrases like "smart ranking" or "adaptive algorithms" might satisfy marketing without triggering compliance. 

  ...Wait, did the user mention any external definitions they consulted? They did—dictionaries, white papers—which means this stalemate isn't from lack of research. That signals deeply held values on both sides. The solution needs to honor those values while being pragmatic. 

  Final thought: the answer isn't technical; it's strategic. They need alignment on goals, not just definitions.
answer: |-
  This is a fascinating and surprisingly common debate—you've hit on a genuine ambiguity in the industry. **Neither side is objectively "wrong," but the disagreement likely stems from conflating *technical accuracy* with *practical consequences*.** Here's a breakdown:

  ### 1. **The Case for Calling it AI**
     - **Historical/Legal Definitions:** Organizations like OECD, EU AI Act, and NIST define AI based on *autonomy* and *adaptiveness*—not specific techniques. Your system automates cognitive tasks (ranking) using rules, fitting broad definitions.
     - **Competitive Norms:** If competitors label similar heuristics as "AI," *not* using it could put you at a marketing disadvantage. Customers associate "AI" with modern automation, regardless of underlying tech.
     - **The "AI Effect":** What was called "AI" in the 1980s (e.g., expert systems) is now seen as basic automation. Your system does what required human judgment before—classic AI territory.

  ### 2. **The Case Against Calling it AI**
     - **Modern Connotation:** Since ~2012, "AI" in public discourse overwhelmingly implies machine learning (ML), especially deep learning. Calling rule-based systems "AI" can feel like stretching the term.
     - **Expectation Mismatch:** Users may expect "AI" to learn and adapt dynamically. Your static heuristics could disappoint if overhyped.
     - **Regulatory/Legal Risk:** With new AI regulations focusing on *adaptive* systems (e.g., EU AI Act), labeling a static system "AI" might trigger unnecessary scrutiny or future-proofing issues.

  ### 3. **The Core Issue: It's a Strategic Decision, Not a Technical One**
     - **Pride vs. Pragmatism:** This isn’t about what’s "true"—it’s about what label *serves your goals*. The legal review process changes everything: if "AI" adds bureaucracy without benefit, why invite it?
     - **Customer Perception Matters Most:** Will calling it AI:
       - *Excite users* because it sounds cutting-edge?  
       - *Backfire* when they realize it doesn’t "learn"?
     - **Competitor Analysis:** Are competitors with similar tech:
       - Calling it AI *successfully* (no backlash)?
       - Using softer terms ("smart algorithms")?

  ### A Path Forward: Reframe the Debate
  Instead of arguing definitions, ask these practical questions:

  1. **"What do we gain by calling this AI?"**  
     - Does it drive sales/engagement?  
     - Does it align with market expectations?  

  2. **"What do we lose?"**  
     - Will legal reviews delay updates?  
     - Could it mislead users?  
     - Might future regulations penalize broad labeling?  

  3. **"Is there a third option?"**  
     - **"Algorithmic ranking"**: Technically accurate, avoids legal triggers.  
     - **"Smart heuristics"**: Highlights automation without implying ML.  
     - **"Rules-based intelligence"**: Bridges both perspectives.  

  ### Recommendation: Compromise with Precision
  - **In Marketing:** Use "AI-powered" *only* if competitors do and legal approves. Otherwise, opt for "intelligent algorithms" or "automated ranking system."  
  - **In Documentation:** Call it a "heuristic-based ranking system" for accuracy. Add: *"While not machine learning-based, this system automates complex prioritization traditionally requiring human analysis."*  
  - **Internally:** Agree that "AI" is a *marketing term*, not an engineering one. Separate technical discussions from positioning.  

  **Bottom line:** The term "AI" is a tool. Use it only if its benefits outweigh the costs of legal reviews and potential expectations. Your team’s stalemate reveals a healthy caution—leverage that to make a deliberate choice, not just a semantic one.
