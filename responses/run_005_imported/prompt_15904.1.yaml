  We are going to tackle this step by step.

  First, we'll set up a simple example to illustrate both Aumann's agreement theorem and the Milgrom-Stokey no-trade theorem. Then, we'll show how the no-trade theorem is a strengthening of the agreement theorem by incorporating the idea that the act of proposing a trade itself conveys information. Finally, we'll discuss the philosophical implications for the epistemology of disagreement and the common prior assumption.

  ### Part 1: Toy Example Setup

  Consider a world with three states of the world: Ω = {ω1, ω2, ω3}. Each state is equally likely (prior probability 1/3).

  There are two agents, Alice and Bob. They have different partitions of the state space:

  - Alice's partition: { {ω1}, {ω2, ω3} }
  - Bob's partition: { {ω1, ω2}, {ω3} }

  So, Alice can distinguish state ω1 from the set {ω2, ω3}, but cannot distinguish ω2 and ω3. Bob can distinguish ω3 from the set {ω1, ω2}, but cannot distinguish ω1 and ω2.

  Now, consider an event A: let A = {ω1, ω2} (so A occurs in states ω1 and ω2).

  We are going to compute the posteriors of Alice and Bob about A in each state.

  #### State ω1:
  - Alice's information: {ω1} → so she knows the state is ω1. Therefore, P(A | {ω1}) = 1.
  - Bob's information: {ω1, ω2} → so he knows the state is either ω1 or ω2. Therefore, P(A | {ω1, ω2}) = P(A ∩ {ω1,ω2}) / P({ω1,ω2}) = P({ω1,ω2}) / P({ω1,ω2}) = 1.

  #### State ω2:
  - Alice's information: {ω2, ω3} → so she knows the state is either ω2 or ω3. Therefore, P(A | {ω2,ω3}) = P(A ∩ {ω2,ω3}) / P({ω2,ω3}) = P({ω2}) / (2/3) = (1/3) / (2/3) = 1/2.
  - Bob's information: {ω1, ω2} → so he knows the state is either ω1 or ω2. Therefore, P(A | {ω1,ω2}) = 1 (same as above).

  #### State ω3:
  - Alice's information: {ω2, ω3} → so P(A | {ω2,ω3}) = P(A ∩ {ω2,ω3}) / P({ω2,ω3}) = P({ω2}) / (2/3) = (1/3) / (2/3) = 1/2.
  - Bob's information: {ω3} → so he knows the state is ω3. Therefore, P(A | {ω3}) = P(A ∩ {ω3}) / P({ω3}) = 0 / (1/3) = 0.

  Now, note that in state ω1, both agents assign probability 1 to A. In state ω2, Alice assigns 1/2 and Bob assigns 1. In state ω3, Alice assigns 1/2 and Bob assigns 0.

  ### Part 2: Aumann's Agreement Theorem

  Aumann's theorem says that if two agents have a common prior and their posteriors about an event are common knowledge, then the posteriors must be equal.

  In our example, let's see if the posteriors can be common knowledge in any state.

  Suppose in state ω1: 
  - Alice's posterior: 1
  - Bob's posterior: 1
  If they announce these, then since both are 1, they are equal. So that's consistent.

  In state ω3:
  - Alice: 1/2, Bob: 0. If they announce, they see they are different. Then, they might update? But the theorem says if they are common knowledge, they must be equal. Here they are not equal, so they cannot be common knowledge. Indeed, if Alice says 1/2, Bob (who knows state is ω3) would be surprised because he thinks A has probability 0. Similarly, if Bob says 0, Alice (who thinks the state is in {ω2,ω3}) would be surprised because she thinks the probability of A is 1/2.

  But in state ω2:
  - Alice: 1/2, Bob: 1.
  If they announce, they will update. For example, if Alice says 1/2, Bob (who thinks the state is in {ω1,ω2}) would expect Alice to say 1 if the state is ω1 and 1/2 if the state is ω2. So if Alice says 1/2, Bob learns the state is ω2. Then Bob updates: in state ω2, event A is true? Actually, A={ω1,ω2} so in state ω2, A is true. But Bob initially thought A had probability 1? Now he knows the state is ω2, so he knows A is true? But wait, let's see:

  Bob initially (at ω2) has posterior 1 for A. Then he hears Alice say 1/2. Bob knows that if the state were ω1, Alice would have said 1, but she said 1/2, so the state must be ω2. Therefore, Bob now knows the state is ω2. Then his posterior for A becomes 1 (since A is true in ω2). But that contradicts his announcement? He announced 1, and now he still thinks 1? However, note that Alice, upon hearing Bob say 1, might update. Initially, Alice at ω2 has posterior 1/2. But if Bob says 1, then Alice (who knows the state is either ω2 or ω3) would think: if the state were ω3, Bob would have said 0. But Bob said 1, so it must be ω2. Then Alice updates her posterior to 1. So then they both have posterior 1? But then they might announce again: Alice now says 1, Bob says 1. Then they agree? 

  This is the iterated announcement process (Geanakoplos-Polemarchakis). They update until they agree. In this case, after one round of announcement, they both update and then agree on 1. 

  But note: in state ω3, if they announce:
  - Alice says 1/2, Bob says 0.
  Bob, hearing Alice say 1/2: Bob knows that if the state were ω1, Alice would say 1, but she said 1/2, so it must be either ω2 or ω3. But Bob, at ω3, knows the state is ω3. So when Alice says 1/2, Bob is confused? Because at ω3, Bob expects Alice to say 1/2? Yes, because in ω3, Alice's information set is {ω2,ω3} and she always says 1/2. So Bob, who knows the state is ω3, expects Alice to say 1/2. And Alice, when she says 1/2, expects Bob to say 0 if the state is ω3 and 1 if the state is ω2. But if Bob says 0, then Alice (who doesn't know if it's ω2 or ω3) learns: if Bob says 0, then the state must be ω3 (because in ω2, Bob would have said 1). Then Alice updates to 0. Then they both have 0? Then they agree.

  So in both ω2 and ω3, after one round of announcement, they update and then agree. In ω1, they already agreed at 1.

  So Aumann's theorem: common knowledge of posteriors forces them to be equal, and if they are not equal, the announcement process leads to updating until they are equal.

  ### Part 3: Milgrom-Stokey No-Trade Theorem

  Now, the no-trade theorem says: suppose we start with an ex-ante Pareto efficient allocation (like an Arrow-Debreu equilibrium allocation). Then, if traders receive private information, it cannot become common knowledge that there is a new trade that is mutually beneficial (in the sense that both would strictly prefer it given their information).

  Let's set up a trade. We need an asset. Suppose we have a single asset that pays off in each state:

  - In state ω1: $1
  - In state ω2: $1
  - In state ω3: $0

  Note: This asset is exactly the event A we considered above (pays 1 if A occurs, 0 otherwise).

  Now, suppose initially, Alice and Bob each have half of the asset. So each has 0.5 units. The total supply is 1 unit.

  Initial allocation: Alice has 0.5, Bob has 0.5.

  Ex-ante, the expected value of the asset is: (2/3)*1 + (1/3)*0 = 2/3. So each has an expected value of (0.5)*(2/3) = 1/3.

  Is this allocation ex-ante Pareto efficient? In this simple setting, since there is only one good (the asset) and no consumption at time 0, any allocation that splits the asset is Pareto efficient? Actually, we are in a setting with risk. But note that both agents are risk neutral? We haven't specified. For simplicity, assume both are risk neutral. Then the initial allocation is Pareto efficient because any reallocation would just transfer expected value. Since they are risk neutral, the only way to make one better off without making the other worse off is to give one more and the other less? But that would make one worse off. So yes, it is Pareto efficient.

  Now, after receiving their information, they might want to trade. Consider state ω2:

  In state ω2:
  - Alice's information: {ω2, ω3} → so she thinks the asset is worth: (1/2)*1 + (1/2)*0 = 0.5.
  - Bob's information: {ω1, ω2} → so he thinks the asset is worth 1.

  So Alice values the asset at 0.5, Bob at 1.

  Therefore, Alice would be willing to sell her 0.5 unit to Bob at any price above 0.5 per unit, and Bob would be willing to buy at any price below 1 per unit. So there is a range of prices (say, 0.75 per unit) at which both would want to trade: Alice sells her 0.5 unit to Bob for 0.75 per unit, so she gets 0.5 * 0.75 = 0.375 in cash, and Bob pays 0.375 and gets 0.5 unit of the asset.

  But note: if they trade, then Alice ends up with 0.375 in cash and no asset, while Bob has 1 unit of the asset and has paid 0.375. Then:

  - In state ω2: the asset is worth 1, so Bob has 1 - 0.375 = 0.625, which is more than his initial 0.5 (which was worth 0.5 in state ω2? Wait, initial 0.5 unit in state ω2 is worth 0.5*1 = 0.5). So Bob gains 0.125.

  Alice: she has 0.375 cash. Her initial was 0.5 unit, which in state ω2 would be 0.5. But 0.375 < 0.5, so she loses? But wait, she values the asset at 0.5 in expectation. In state ω2, the asset is actually 1, but she doesn't know that. She thinks with 50% chance it's 0. So she is happy to sell at 0.75 per unit because she gets 0.375 for something she expects to be worth 0.25? Wait, no:

  Alice holds 0.5 unit. Her valuation per unit is 0.5, so total 0.25? That doesn't seem right. Actually, her valuation for the entire 0.5 unit is 0.5 * (expected value per unit) = 0.5 * 0.5 = 0.25. So if she sells for 0.375, she gains 0.375 - 0.25 = 0.125 in expected value.

  Similarly, Bob's valuation for the entire 0.5 unit he is buying: he values per unit at 1, so 0.5 unit is 0.5. He pays 0.375, so he gains 0.125 in expected value.

  So in expectation (given their information) both gain. But note: this is conditional on their information. However, the no-trade theorem says that such a trade cannot become common knowledge to be mutually beneficial.

  Why? Because the very fact that the trade is proposed and accepted would reveal information.

  Suppose in state ω2, Bob offers to buy at a price of 0.75 per unit. Alice, given her information (which is {ω2,ω3}), must decide whether to accept. But note: Bob's offer to buy at 0.75 per unit is a public event. What does that reveal about Bob's information?

  Bob would only offer to buy at 0.75 per unit if he thinks the asset is worth more than 0.75. Bob's valuation per unit is either:
  - In his information set {ω1,ω2}: he values it at 1, which is >0.75.
  - In his information set {ω3}: he values it at 0, so he would not offer to buy at 0.75.

  Therefore, if Bob offers to buy at 0.75, it must be that he is in the information set {ω1,ω2}. So Alice learns that the state is not ω3? Because if it were ω3, Bob wouldn't offer. But wait, in state ω3, Bob wouldn't offer, so if an offer is made, then Alice (who initially thought it might be ω2 or ω3) now knows it cannot be ω3? Therefore, Alice updates: she now knows the state is ω2.

  Then, Alice's valuation for the asset jumps to 1 (because she now knows it's ω2). So she would no longer be willing to sell at 0.75! Because she now values the asset at 1 per unit, so 0.5 unit is worth 0.5. Selling at 0.75 per unit would give her 0.375, which is less than 0.5. So she would reject.

  Therefore, the trade that seemed mutually beneficial ex-post (after information but before the announcement) is no longer beneficial once the offer is made and the information it reveals is incorporated.

  This is the key mechanism: the act of offering the trade reveals information that eliminates the perceived gains from trade.

  ### Why is this a strengthening of Aumann?

  Aumann's theorem says that if the posteriors are common knowledge, then they must be equal. In the trade setting, the no-trade theorem shows that even if the posteriors are not common knowledge, but if a trade is proposed and accepted (which requires that both think they gain, i.e., they have different valuations), then the act of proposing and accepting the trade would reveal information that would lead to updating and eventually the trade would not occur. Moreover, after the updating, the posteriors would become common knowledge and equal? Not necessarily equal, but the perceived gains from trade disappear.

  In our example, after Bob offers to buy at 0.75, Alice updates and now both know the state is ω2. Then both value the asset at 1. So they agree on the value. Therefore, there is no more incentive to trade.

  The no-trade theorem is stronger because it shows that even when agents have different posteriors (and hence see an opportunity for trade), the very possibility of trade being common knowledge (i.e., the offer and acceptance being public) leads to the trade unraveling. So the market cannot have common knowledge of gains from trade. This goes beyond Aumann by showing that the disagreement (in valuations) cannot be sustained in a way that leads to trade, because the trade itself is a public event that forces updating.

  ### Philosophical Implications

  Now, turning to your questions:

  1. **The common prior assumption (CPA) in the peer-disagreement debate:**
     - The equal-weight view (that upon encountering a disagreeing peer, both should converge to the average) is sometimes motivated by Aumann-style results. However, note that Aumann's result relies crucially on the CPA. Without a common prior, agents can persistently disagree even with common knowledge of each other's posteriors.
     - Your suspicion is correct: the CPA assumes that the agents start with the same prior, which is exactly the kind of symmetry that the peer-disagreement debate might be about. If we are to adjudicate whether peers should give equal weight to each other, then assuming a common prior might be begging the question because it builds in that they are symmetric in their prior beliefs.

     - In fact, without a common prior, the agents might have different priors and hence might not converge. So the Aumann result doesn't by itself show that peers should converge; it shows that if they have a common prior, then they must converge. But the philosophical debate is often about whether we should assume a common prior in the first place when we regard someone as a peer.

  2. **The mismatch with real markets:**
     - Real markets have huge trading volume, which seems to contradict the no-trade theorem. How to interpret this?
     - There are two main lines of response:
       (a) The common prior is not a requirement of rationality. People might have genuinely different priors, and that's why they trade. The theorem then doesn't apply.
       (b) The common prior is a normative requirement, but in practice, traders are not rational and/or the information structure is such that the conditions of the theorem are violated (e.g., trades are not public, or there are multiple rounds of trading with new information arriving).

     - These lead to different morals:
       - If we take (a), then the common prior is not a rational requirement. Rational agents can have different priors and trade because of that. Then the no-trade theorem doesn't impugn the rationality of trading in markets; it just shows that if there is a common prior and only asymmetric information, then trade cannot be commonly known to be beneficial.
       - If we take (b), then the common prior is a rational requirement, and the trading volume we observe is due to irrationality (overconfidence, different priors, etc.). So the theorem stands as a normative benchmark.

     - Which moral to draw? It's a matter of debate. However, note that the common prior assumption is controversial. Some philosophers (e.g., Adam Elga) have argued that it is a requirement of rationality, but others (e.g., David Lewis) might see it as part of defining a common framework for communication. In the epistemology of disagreement, if we think that peers must share a common prior, then the equal-weight view follows. But if we don't, then it doesn't.

     - Moreover, the no-trade theorem also requires that the initial allocation is ex-ante Pareto efficient. In real markets, there might be gains from trade due to risk sharing or differences in risk aversion that are not captured by the model. The Milgrom-Stokey theorem assumes that the only motive for trade is asymmetric information, and that the initial allocation is efficient without asymmetric information. But if the initial allocation is not efficient (e.g., because of changing risk preferences over time), then trade can occur.

  ### Conclusion

  The Milgrom-Stokey no-trade theorem strengthens Aumann's agreement theorem by showing that the act of proposing a trade that is mutually beneficial (based on private information) cannot become common knowledge because the proposal itself reveals information that destroys the perceived gains. This is illustrated in our example: when Bob offers to buy, Alice updates and then no longer wants to sell.

  Philosophically, the common prior assumption is doing heavy lifting. In the peer-disagreement debate, it might be question-begging. And for real markets, the observed trading volume might be explained by either rejecting the common prior (as a descriptive matter) or by pointing to other factors (like differences in risk aversion or irrationality). Whether the common prior is a normative requirement remains an open and debated question.
answer: |-
  ### Step-by-Step Unraveling: From Aumann to Milgrom-Stokey via a Toy Example  
  **Setup:**  
  - **States of the world:** Ω = {ω₁, ω₂, ω₃} (each with prior probability 1/3).  
  - **Event of interest:** A = {ω₁, ω₂} (e.g., "the asset pays $1 if A occurs, $0 otherwise").  
  - **Agents:** Alice (A) and Bob (B), with partitions:  
    - Alice: {{ω₁}, {ω₂, ω₃}} → She distinguishes ω₁ from {ω₂, ω₃}.  
    - Bob: {{ω₁, ω₂}, {ω₃}} → He distinguishes {ω₁, ω₂} from ω₃.  
  - **Initial allocation:** Each owns 0.5 units of an asset paying $1 if A occurs. Total supply = 1 unit.  
  - **Ex-ante efficiency:** Initial allocation is Pareto-efficient (both risk-neutral, no gains from risk-sharing).  

  #### Part 1: Posteriors Without Trade (Aumann Baseline)  
  - **State ω₁:**  
    - Alice knows ω₁ → P(A|Alice) = 1.  
    - Bob knows {ω₁, ω₂} → P(A|Bob) = 1.  
    *Common knowledge of posteriors?* Yes (both 1). **Agreement.**  
  - **State ω₂:**  
    - Alice knows {ω₂, ω₃} → P(A|Alice) = P(ω₂)/P(ω₂, ω₃) = (1/3)/(2/3) = 0.5.  
    - Bob knows {ω₁, ω₂} → P(A|Bob) = 1.  
    *Common knowledge?* No. If Alice announces 0.5, Bob infers state ≠ ω₁ (else Alice would say 1), so state = ω₂ → Bob updates to P(A|Bob) = 1. Alice, hearing Bob’s "1", infers state ≠ ω₃ (else Bob would say 0), so state = ω₂ → Alice updates to 1. **After one announcement, agreement at 1.**  
  - **State ω₃:**  
    - Alice: P(A|Alice) = 0.5 (same as ω₂).  
    - Bob knows ω₃ → P(A|Bob) = 0.  
    *Common knowledge?* No. Alice’s "0.5" leads Bob to infer state ≠ ω₁ → state = ω₂ or ω₃. But Bob knows ω₃, so no update. Bob’s "0" tells Alice state = ω₃ → Alice updates to 0. **Agreement at 0.**  

  **Aumann’s insight:** Common knowledge of posteriors forces equality. Without it, announcements force convergence.  

  ---  
  #### Part 2: No-Trade Theorem (Milgrom-Stokey)  
  Add a trade: Alice sells her 0.5 units to Bob at price $0.75/unit.  
  - **State ω₂ (the interesting case):**  
    - Alice’s *private* valuation: 0.5 units × [0.5 × $1 + 0.5 × $0] = $0.25.  
    - Bob’s *private* valuation: 0.5 units × $1 = $0.50 (since he knows A occurs).  
    - **Privately, trade seems beneficial:**  
      - Alice sells for 0.5 × $0.75 = $0.375 > $0.25 → gains $0.125.  
      - Bob buys for $0.375 < $0.50 → gains $0.125.  

  **Why doesn’t this trade happen?** The *act of proposing* the trade reveals information.  

  1. **Bob offers to buy at $0.75:**  
     - Bob only offers if he expects to gain. His valuation is:  
       - $1/unit in {ω₁, ω₂} → would offer.  
       - $0/unit in {ω₃} → would **not** offer.  
     - Thus, Bob’s offer is a **public signal**: "State ∈ {ω₁, ω₂}".  

  2. **Alice updates based on the offer:**  
     - Initially, Alice’s information: {ω₂, ω₃}.  
     - Bob’s offer reveals state ∈ {ω₁, ω₂}.  
     - Alice combines: {ω₂, ω₃} ∩ {ω₁, ω₂} = {ω₂} → **Alice now knows ω₂!**  
     - Her valuation jumps to 0.5 × $1 = $0.50.  

  3. **Alice rejects the trade:**  
     - Selling for $0.375 < $0.50 → loss.  
     - Trade collapses.  

  **Key mechanism:** The trade offer acts as a **public announcement** that aggregates private information. Alice and Bob *learn from the offer itself*, updating their beliefs until the perceived gains vanish.  

  #### Why Milgrom-Stokey Strengthens Aumann  
  - **Aumann:** If posteriors are common knowledge, they must be equal.  
  - **Milgrom-Stokey:** Even if posteriors are *not* common knowledge, the **common knowledge of a mutually beneficial trade** is impossible. The trade’s proposal triggers an Aumann-like convergence process *before* trade occurs.  
    - Trade isn’t just "Aumann in disguise"; it adds a **pre-trade epistemic action**: The market *generates* public signals (offers/acceptances) that force belief updates. This is the "Geanakoplos-Polemarchakis step" applied to trade.  

  ---  
  ### Philosophical Implications  
  #### 1. **Peer Disagreement and the Common Prior Assumption (CPA)**  
  - **The CPA’s role:** Aumann-style results are often invoked to defend the *equal-weight view* (peers should converge to a consensus). But the CPA assumes *ex ante* symmetry—precisely what’s contested in peer-disagreement debates.  
    - Example: If Alice and Bob are "epistemic peers," does this imply a common prior? If so, CPA smuggles in the symmetry it’s meant to justify. If not, Aumann doesn’t apply.  

  - **Your suspicion is correct:** CPA is not a neutral starting point. It builds in *substantive epistemic symmetry*, making convergence a mathematical triviality rather than a normative achievement. Philosophers like **Adam Elga** (who assumes symmetry) and **Thomas Kelly** (who rejects it) are implicitly debating whether CPA holds.  

  - **Takeaway:** Aumann’s theorem *presupposes* the symmetry that peer-disagreement discussions aim to adjudicate. It can’t resolve the debate without circularity.  

  #### 2. **Real Markets vs. No-Trade Theorem**  
  **Puzzle:** Real markets trade constantly; Milgrom-Stokey predicts zero trade under CPA + efficiency. How to reconcile?  

  - **Two interpretations of the mismatch:**  
    - **(A) CPA is descriptively false (no normative force):**  
      - Traders have **heterogeneous priors** (e.g., "optimists vs. pessimists"). Trade volume reflects genuine, rational disagreement.  
      - *Philosophical moral:* Rationality does *not* require CPA. Markets reveal that priors diverge legitimately (e.g., Keynes’ "animal spirits").  
        
    - **(B) CPA is normatively correct (but violated in practice):**  
      - Trade volume stems from **irrationality** (overconfidence, misinformation) or **non-informational motives** (liquidity needs, risk aversion shifts).  
      - *Philosophical moral:* Traders *should* have a common prior; observed volume is evidence of error.  

  - **Why (A) and (B) are distinct:**  
    - **(A)** challenges CPA as a requirement of rationality. If priors can permissibly differ, trade is rational *even with common knowledge*.  
    - **(B)** preserves CPA’s normative status but attributes trade to **failures of rationality** or **changing fundamentals** (e.g., new risks emerge).  

  - **Your key insight:** The no-trade theorem’s failure in real markets *doesn’t* decide between (A) and (B). We need independent arguments for whether CPA is a rational requirement.  
    - **Pro-CPA:** David Lewis ("Convention") or game theorists: CPA enables consistent belief models.  
    - **Anti-CPA:** Philosophers of science (e.g., van Fraassen): Priors reflect subjective commitments; rationality only constrains updating.  

  #### Synthesis: What Milgrom-Stokey Licenses Philosophically  
  - **Formally:** It shows that CPA + common knowledge of rationality + efficiency ⇒ no trade.  
  - **Philosophically:**  
    - If CPA is assumed, it **undermines radical conciliationism** in peer disagreement (convergence is automatic, not a deliberative norm).  
    - If CPA is rejected, it **explains market behavior** without impugning rationality.  
  - **Normative vs. descriptive:** The theorem is a *consistency result*. It doesn’t prove CPA true; it shows that *if* we accept CPA, real traders are either irrational or trading for non-informational reasons.  

  ### Final Thought Experiment  
  Imagine two traders in your toy example:  
  - If they *attempt* to trade, beliefs update → trade vanishes.  
  - But if they *don’t realize* they’re peers (e.g., one thinks they’re an expert), trade might occur.  
  This mirrors epistemology: **Aumann convergence happens only under common knowledge of peerage—which CPA assumes from the start.** The real issue isn’t disagreement; it’s whether we can justifiably assume symmetry.  

  For further work:  
  - Explore **heterogeneous prior models** (e.g., Morris 1995) as a critique of CPA.  
  - Link to **epistemic injustice** literature: CPA may ignore systemic differences in prior-forming experiences.  
  - Test **experimental markets** (e.g., Plott-Sunder) to see if trade volume drops under strict CPA conditions.  

  This clarifies why Milgrom-Stokey isn’t just "Aumann for economists"—it reveals the dynamic role of public actions in belief revision, and the CPA’s contested normative status.
