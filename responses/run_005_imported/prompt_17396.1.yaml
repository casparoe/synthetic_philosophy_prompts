  Millikan might argue that proper functions are based on ancestral selection. But identifying which ancestral effect is relevant requires seeing which effects contributed to fitness, again leaning on causal-role. Godfrey-Smith's stabilizing selection could say that recent effects stabilize the trait, but distinguishing stabilizing effects from byproducts involves causal analysis of current contributions.

