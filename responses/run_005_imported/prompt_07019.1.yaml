  First, I need to compare the two emergence theories thoroughly. Broad's idea hinges on fundamentally new laws that can't be predicted from lower-level knowledge, even in principle. It's ontological, meaning the emergent property is genuinely new. Bedau's weak emergence is about derivability: the macro-property comes from micro-level processes but only through simulation, not shortcuts. It's epistemological, dealing with how we can know or predict the property.

