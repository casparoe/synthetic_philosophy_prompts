  Ah, and they're also asking about neural networks' distributed representations. Is that holism akin to Quine's semantic holism? Or is it a false analogy? The user wants to avoid "sloppy" philosophical parallels, which tells me they care about precision. They're probably wary of pop-science takes on AI that misuse philosophical concepts.

