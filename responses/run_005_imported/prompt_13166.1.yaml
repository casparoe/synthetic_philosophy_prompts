  Key turn: When Iris flips Dev's investment argument by asking whether Rosalind would mourn a miscarried alternate self. That exposes the emotional core - we care about possibilities that preserve our narrative continuity. Dev's final line should reveal his deeper fear: that if counterparts aren't "really" her, Rosalind's quest becomes monstrous. 

