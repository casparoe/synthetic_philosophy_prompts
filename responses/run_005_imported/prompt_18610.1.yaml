  Among the nine standard objections that Turing addresses in "Computing Machinery and Intelligence" (1950), the argument from extra-sensory perception is the last one he takes up, and it seems to me the easiest for him to dispatch. Because it rests on claims about telepathy and clairvoyance that a rigorous operationalist could simply set aside as unproven, Turing shouldn't need anything like the careful maneuvering he uses against the argument from consciousness or Lady Lovelace's Objection. I'm writing a dissertation chapter on Turing's argumentative strategy across these nine objections, and I want to use the ESP passage as my clearest example of him subordinating a philosophical worry to plain empirical skepticism. Could you walk me through exactly what Turing says in that section that shows him treating the ESP objection so peremptorily, relative to the more measured handling the other objections receive?
