answer: |-
  Here's a breakdown of Hobbes's argument, its strengths, tensions, and why civil philosophy *might* stay "demonstrable" despite apparent similarities to physics – though the tension you identify is fundamental and arguably its Achilles' heel:

  **Hobbes's Core Argument Reconstructed:**

  1.  **The Criterion for Demonstrability:** A science is demonstrable *only* if the knower has full epistemic access to the *causes, generation, and construction* of its subject matter. This access is possible *only* if the knower is the *maker* or *constructor* of that subject matter.
  2.  **Geometry as Paradigm:** The geometer stipulates definitions (e.g., "a straight line is...") and constructs figures according to those definitions using rules (e.g., compass and straightedge). The consequences (theorems) are deduced logically from these initial acts of willful creation. The causes (the definitions and construction rules) are known because the geometer imposes them.
  3.  **Civil Philosophy as Analogous:** Humans create the commonwealth through a deliberate act: the covenant. This covenant is a specific, definable act of mutual authorization, creating the artificial person of the Sovereign. The "causes" of the commonwealth are therefore known: they are the rationally understood motivations driving individuals to covenant (fear of death, desire for commodious living) and the specific act of authorization itself.
  4.  **Physics as Contrast:** Humans do *not* construct natural bodies. We encounter them as given. We observe their effects (phenomena) and can only *hypothesize* about their internal construction and causes ("seek it from the effects"). We can demonstrate what effects *follow from* a *hypothesized* cause, but we cannot demonstrate the *actual* cause itself with certainty because we didn't make it.
  5.  **The "Making" Distinction:** The key difference securing civil philosophy's demonstrability is the *nature of the artifact*:
      *   **Geometry/Commonwealth:** These are *abstract* or *artificial* constructs. Their essence *is* defined by their generation. Knowing how they are made *is* knowing what they are. Their "causes" are their constitutive rules/acts.
      *   **Natural Bodies:** These have an independent, intrinsic constitution we don't control or fully define. Their "causes" are hidden internal mechanisms we must infer.

  **Addressing Your Concern: Does "We Make" Really Secure Demonstrability?**

  This is the crux. Your suspicion of an equivocation is well-founded. Here's how Hobbes *intends* it to work and why it's contentious:

  1.  **The Covenant as the Crucial "Making":** Hobbes focuses the "making" specifically on the *act of covenanting* that *creates the Sovereign authority*. This act is:
      *   **Deliberate & Rational:** It's conceived as a product of universal human reason responding to universal passions.
      *   **Stipulative:** The terms of the covenant (renouncing rights, authorizing the Sovereign) are defined by the political philosopher *as part of the construction*. They are the "definitions" of civil science.
      *   **Constitutive:** The commonwealth *only exists* by virtue of this act. Its "causes" *are* this act and the reasons for it.
  2.  **Premises (Passions, Equality) as "Given" but Universally Accessible:** Hobbes argues that the foundational premises *are* not hypothetical inferences from observation like physics, but are known with certainty through introspection and reason:
      *   **Introspection:** "Read thyself" – every individual can know their *own* passions (fear, desire, etc.) with certainty.
      *   **Reason:** From introspection and minimal observation, reason infers that *all* humans are fundamentally similar ("natural equality") and motivated by the same core passions in the state of nature. This universality and certainty are crucial.
      *   **Not Hypothetical Causes, but Universal Motivations:** These aren't hidden "causes" of human behavior *in the same way* as the internal mechanisms of matter. They are the *manifest, universal motivations* that form the *rational basis* for the covenant. They are the "why" of the construction, analogous to the geometer's *purpose* in defining a circle (which isn't part of the deduction, but grounds the intelligibility of the construction).
  3.  **Deduction from Construction:** Once the "state of nature" (a hypothetical construct based on these universal motivations) and the act of covenanting (the "making") are established, Hobbes claims the properties of the commonwealth (sovereign rights, obligations of subjects, necessity of enforcement) follow *deductively* as necessary consequences, just like theorems in geometry. The "causes" used in the deduction are the motivations and the covenant itself, which are claimed to be known.

  **Does the Argument Succeed? A Critical Assessment:**

  *   **Strengths (Hobbes's Perspective):**
      *   **Internal Coherence:** Within his system, the analogy *is* powerful. Both geometry and the commonwealth are *artificial creations* defined by their constitutive rules/acts. The deduction *from* the act of covenanting *is* logical.
      *   **Epistemic Access:** He genuinely believes introspection provides certain, universal knowledge of human motivations, unlike our knowledge of the microworld. This certainty grounds the "precognition of causes."
      *   **Distinguishes Artifact from Nature:** The commonwealth *is* fundamentally different from a rock. Its existence *depends* on human agreement, making its "causes" human actions in a way the causes of a rock are not.

  *   **Weaknesses/Tensions (Your Concern is Valid):**
      *   **The Status of the Premises:** This is the biggest problem. Hobbes *needs* his claims about universal human passions, natural equality, and the driving force of competition in the state of nature to be *certain and necessary truths*, not contingent observations or contestable interpretations of history/introspection. Yet, they *look* and *function* remarkably like the empirical generalizations he relegates to hypothetical status in physics. Are "fear of violent death" or "perpetual desire for power" really known with the *same certainty* as "a straight line is the shortest distance between two points"? Or are they, despite Hobbes's claims, sophisticated hypotheses derived from interpreting human behavior? If the latter, the "demonstrative" foundation cracks.
      *   **"Making" vs. "Describing":** Is Hobbes *stipulating* human nature for the purposes of construction (like defining a geometric point) or *describing* what he believes is an independently existing reality? He claims the former but relies heavily on the latter. The covenant is an artificial act, but the *material* out of which it's made – humans with specific, fixed motivations – is treated as a given nature, not stipulated. This blurs the line.
      *   **The Ambiguity of "Causes":** Hobbes slides between:
          1.  The *motivations* causing individuals to covenant (passions, fear, reason).
          2.  The *act* of covenanting itself as the cause of the commonwealth.
          The deduction relies on (1), but the "making" that secures epistemic access is primarily (2). Does knowing (2) with certainty (because we define it) grant *certain knowledge* of (1), upon which the whole chain depends? Hobbes assumes the universality and certainty of (1), but this is highly debatable.
      *   **Physics Comparison:** His physics *also* starts with definitions (e.g., body, motion) and deduces consequences. The difference is that in physics, the *internal constitution* of bodies is unknown, while in politics, the "constitution" (the covenant) *is* defined. However, the *effectiveness* of the political deduction still relies on the accuracy of the underlying model of human nature, whose "causes" (why are humans *exactly* like this?) remain as opaque as the causes of sensation.

  **Conclusion:**

  Hobbes's argument is ingenious and internally consistent *if* one grants his core premises: that fundamental human motivations are known with absolute, universal certainty through introspection/reason, and that the commonwealth is *nothing more* than the logical consequence of a specific, definable act (the covenant) performed by beings with those motivations.

  **Does it succeed in keeping civil philosophy demonstrable?** 

  *   **Formally/Intentionally:** Yes, according to Hobbes's strict criterion. The *artificial creation* of the sovereign authority via covenant is the key "making" act, distinct from observing natural bodies.
  *   **Materially/Epistemically:** Arguably **no**, or at least not without significant strain. The reliance on contestable, empirically-grounded (or at least empirically-interpreted) premises about universal human nature introduces a deep tension. These premises function *structurally* like the hypothetical causes in physics, even if Hobbes insists on their certainty. The equivocation lies in whether "making" refers *only* to the covenant (which seems thin) or *implicitly* includes the stipulated model of human nature (which makes the claim stronger but risks circularity).

  For your seminar, highlight this tension. Hobbes desperately wants politics to be as certain as geometry. His solution is to ground it in a foundational act of human creation. But the *material* for that creation – human nature itself – remains an uncertain foundation, threatening to pull civil philosophy back towards the hypothetical realm he assigned to physics. The success of his argument hinges entirely on the epistemological status he grants to his anthropology.
