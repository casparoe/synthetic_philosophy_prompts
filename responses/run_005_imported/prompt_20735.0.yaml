  so we just covered the discursive dilemma in my social choice theory seminar (the List & Pettit thing, building on Kornhauser & Sager's doctrinal paradox from law) - basically how propositionwise majority voting on logically connected propositions can generate a collectively inconsistent verdict even though every individual member's own judgments are perfectly consistent. my prof mentioned offhand that this is basically the judgment-aggregation cousin of Condorcet's paradox, which we'd covered earlier in the term. got me wondering - if you showed Condorcet the discursive dilemma laid out formally like this, do you think he'd recognize it as basically the same problem in disguise, or would he think theres something genuinely new going on once you're aggregating over logically interdependent propositions instead of just preferences over candidates? and given that he spent his last years trying to build real institutions (like that 1793 constitution plan for france, the girondin one that never got adopted) around the very voting problems he'd discovered mathematically, which side do you reckon he'd come down on - premise-based or conclusion-based procedures? not looking for the wikipedia answer, genuinely curious what you'd predict given how he actually thought and argued
