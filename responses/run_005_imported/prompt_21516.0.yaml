prompt: |-
  I've been part of a small monthly reading group that grew out of the comment section of a decision-theory blog -- the kind of group in which everyone has already read the Sequences and several of us have strong opinions about updateless decision theory. Last month we worked through some of Caspar Oesterheld's writing on evidential cooperation in large worlds (ECL), and the discussion ended in a genuine disagreement between two members, Ilana and Soren, that the rest of us couldn't settle and that I've kept turning over since.

  (1) Ilana opened by defending the practical upshot of ECL: if the universe, or the wider Everettian multiverse, is as large as our best cosmology suggests, then there are enormous numbers of agents who are causally cut off from us but who reason in relevantly similar ways while ending up with very different terminal values; because our decision is correlated with theirs rather than causing theirs, we have the same kind of reason to cooperate with them on a compromise of values that we would have to cooperate with a psychological twin in a one-shot prisoner's dilemma, and in practice that means diverting some altruistic effort toward causes that make sense under the compromise rather than under our own values alone. (2) Soren objected that this move only works if you help yourself to evidential or functional decision theory exactly when it's convenient: correlation without causation is precisely what a causal decision theorist says gives you no reason to act, and if the group wants to reject causal decision theory it should defend that rejection on its own terms rather than smuggle it in through ECL. (3) Ilana replied that this was already settled business, since the group had spent an earlier session agreeing that functional-decision-theoretic reasoning handles Newcomb's problem and the twin prisoner's dilemma better than causal decision theory does, and ECL is simply that same move applied to a much larger population of correlated agents. (4) Soren granted the point for clean, symmetric cases -- literal twins, or provably identical algorithms -- but said ECL needs correlation with agents who might share nothing with you beyond a loose family resemblance, something like "being a reasoner who takes ECL seriously," and once correlation is allowed to be that thin, nothing constrains how many such agents exist or how much weight each deserves, so the supposed gains from trade can be made to justify almost anything depending on how generously the reference class is drawn. (5) Ilana conceded the reference-class worry but said it is the same difficulty that already sits inside moral uncertainty and anthropic reasoning more generally, and nobody proposes abandoning expected-value reasoning under moral uncertainty simply because weighting rival theories against one another is hard. (6) Soren's response was that the two cases are not parallel: moral uncertainty is uncertainty about one agent's own obligations, resolvable in principle through that agent's further reflection, whereas ECL rests on claims about how many correlated agents actually exist and how similar they really are -- claims we have no independent way of checking -- so the whole calculation looks less like ordinary reasoning under uncertainty and more like Pascal's Mugging in decision-theoretic dress.

  Could you go through moves (1) through (6) and say who has the better of the argument at each stage, rather than simply declaring an overall winner? I would also value your own view on whether some version of ECL survives Soren's reference-class objection, or whether that objection is quietly fatal to the whole project.
reasoning: |-
  Hmm, the user is describing a nuanced debate from their reading group about evidential cooperation in large worlds (ECL). This involves decision theory, ethics, and cosmology. Let me unpack this step by step.

  The core disagreement is between Ilana (pro-ECL) and Soren (skeptic). Ilana argues that in a vast multiverse, we should cooperate with agents who are correlated with us but have different values. Soren counters that this relies on decision theories they've already rejected (like causal decision theory) and faces fatal reference class problems.

  For move (1), Ilana's position makes sense if we accept functional decision theory. The vastness of the universe does suggest many correlated agents exist. But Soren's point in (2) is valid too - if the group uses causal decision theory elsewhere, switching to evidential here is inconsistent. 

  Move (3) shows Ilana correctly pointing out their group already rejected causal decision theory for cases like Newcomb's paradox. But move (4) is where Soren lands a strong blow: "correlated agents" could mean almost anyone if we define the reference class loosely. This could justify anything, like Pascal's Mugging.

  In move (5), Ilana tries to equate this with moral uncertainty, but Soren's rebuttal in (6) seems stronger. Moral uncertainty is about one agent's values, while ECL makes empirical claims about countless others we can't verify. That does feel more like Pascal's Mugging.

  The reference class problem does seem devastating. Without clear boundaries on who counts as "correlated," ECL could demand extreme sacrifices for hypothetical trillions of agents who share just one trait with us. Yet completely dismissing ECL feels wrong too - if we accept functional decision theory, some version of cooperation across possible worlds should be possible.

  Perhaps a middle path exists: focus on agents who share specific reasoning methods (like using the same decision algorithm), not vague resemblances. But even that might not solve the problem entirely. The user's group might need to revisit whether functional decision theory can be consistently applied at cosmic scales without inviting absurd demands.
answer: |-
  Let's break down each move in the debate, assessing the strengths and weaknesses of both positions at each stage:

  ### (1) Ilana's Opening: The Practical Upshot of ECL
  - **Ilana's Strength**: Correctly frames ECL's core proposition—leveraging decision-theoretic correlation (not causation) across vast worlds/multiverses to achieve value compromise. Highlights the *scale* of potential cooperation partners as a novel feature of modern cosmology.  
  - **Soren's Unstated Counter**: Assumes ECL's decision theory (e.g., FDT) is sound, which is contested. Also glosses over *how* to identify "relevantly similar" agents.  
  - **Who Has the Edge?** Ilana, but narrowly. She states ECL’s promise accurately, but Soren’s later objections reveal vulnerabilities in her premises.

  ### (2) Soren's Objection: Smuggling in Non-Causal Decision Theory
  - **Soren's Strength**: Exposes a critical inconsistency. If the group uses CDT elsewhere but switches to EDT/FDT for ECL, that’s ad hoc. Forces Ilana to defend FDT/UDT *coherently*.  
  - **Ilana's Unstated Rebuttal**: ECL isn’t "smuggling" in FDT—it’s *applying* it to a new domain, assuming prior acceptance.  
  - **Who Has the Edge?** Soren. He identifies a foundational issue: ECL’s viability depends entirely on rejecting CDT, which needs explicit justification.

  ### (3) Ilana's Reply: Settled Decision Theory
  - **Ilana's Strength**: Correctly notes that FDT/UDT resolves twin PDs and Newcomb’s—and ECL extends this logic. If the group already endorsed FDT, consistency demands applying it here.  
  - **Soren's Unstated Counter**: ECL isn’t *just* "FDT with more agents." It requires correlating with agents who aren’t twins or identical algorithms—a qualitative leap.  
  - **Who Has the Edge?** Ilana. If FDT is accepted, extending it to large populations is logical. Soren must show why scale/complexity breaks FDT.

  ### (4) Soren's Objection: The Reference-Class Problem
  - **Soren's Strength**: Highlights ECL’s fatal flaw—how to define "similar enough" agents. "Loose family resemblance" (e.g., "agents who take ECL seriously") is arbitrary, making cooperation weights unbounded and susceptible to Pascalian extremes.  
  - **Ilana's Unstated Rebuttal**: Anthropic/moral reasoning also face reference-class issues but aren’t abandoned—we use best estimates.  
  - **Who Has the Edge?** Soren decisively. This is ECL’s weakest point: without objective constraints on correlation, the theory loses predictive/normative force.

  ### (5) Ilana's Concession: Analogizing to Moral Uncertainty
  - **Ilana's Strength**: Correctly notes that hard boundaries plague many theories (e.g., moral uncertainty, anthropic probabilities). We don’t discard them—we refine methods.  
  - **Soren's Unstated Counter**: Moral uncertainty concerns *one agent’s conflicting values*; ECL makes empirical claims about *external agents’ existence and similarity*, which are harder to verify.  
  - **Who Has the Edge?** Draw. Ilana’s analogy has merit, but Soren’s distinction (next move) is valid.

  ### (6) Soren's Response: ECL vs. Moral Uncertainty
  - **Soren's Strength**: Sharpens the key difference:  
    - Moral uncertainty: Introspective, resolvable through reflection.  
    - ECL’s correlation claims: Empirical, unverifiable, and easily Pascal-mugged (e.g., "quadrillions of agents value paperclips!").  
  - **Ilana's Unstated Rebuttal**: Cosmology/statistics provide *some* constraints (e.g., expecting agents in Hubble volumes), avoiding total arbitrariness.  
  - **Who Has the Edge?** Soren. ECL’s reliance on uncheckable population claims makes it uniquely vulnerable to exploitation.

  ---

  ### Overall Assessment
  - **Soren wins the debate** on points. His reference-class objection (4) and empirical/Pascalian critique (6) expose deep, unresolved problems in ECL. Ilana’s defenses (3,5) are reasonable but don’t neutralize these issues.  
  - **Key Winner by Move**:  
    - (1) Ilana (weakly)  
    - (2) Soren  
    - (3) Ilana  
    - (4) Soren  
    - (5) Draw  
    - (6) Soren  

  ---

  ### Can ECL Survive the Reference-Class Objection?
  **Yes, but in a limited form**, if it addresses Soren’s concerns:  
  1. **Constraints via Decision Theory**: Define "similar agents" as those using *the same decision algorithm* (e.g., FDT/UDT), not vague resemblances. This avoids unbounded classes.  
  2. **Empirical Anchoring**: Use cosmological models to estimate populations of *plausible* agents (e.g., evolved in Hubble volumes), rejecting Pascal-mugging claims without evidence.  
  3. **Focus on Symmetry**: Prioritize cooperation where value compromises are symmetric (e.g., all agents weight others equally), avoiding extreme demands.  

  **However**, Soren’s objection remains "quietly fatal" to **ambitious versions of ECL** that claim to prescribe specific, high-stakes actions. Until reference classes are rigorously defined, ECL risks being either toothless (if classes are narrow) or absurdly demanding (if broad). It survives as a *theoretical framework* but struggles as a *practical guide*.

  **Your group’s path forward**: Revisit whether FDT/UDT *itself* can define non-arbitrary reference classes—or if ECL must remain a provocative thought experiment.
