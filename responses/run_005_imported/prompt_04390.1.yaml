  Suppose Theo insists on preferring Urn A over the coin-flip bet for Urn B. But under his rule, he shouldn't, because min EU is 0.5 for both.

  If he did prefer Urn A, it would violate his own rule, which would be inconsistent.

  But he doesn't; he says he would be indifferent.

  So no bind.

  Naomi might think that since the coin-flip bet involves Urn B, which has ambiguity, Theo might still be averse, but the rule correctly recognizes that the compound event has no ambiguity in probability.

  So Theo escapes the bind.

  As for whether the rule is suspiciously tailored, it's not; it's a general rule that applies to any bet.

  For a simple bet on red in B, min EU is 0.

  For the coin-flip bet, min EU is 0.5.

  For Urn A, it's 0.5.

  So it's consistent.

  Moreover, in decision theory, this is similar to the concept that hedging can reduce or eliminate ambiguity.

