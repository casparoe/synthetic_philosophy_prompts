   Now let's do the two orders with the same evidence shifts: set new P(A)=0.6 and new P(B)=0.6.

   Order 1: E1 then E2.

   Step 1: E1 (set P1(A)=0.6, P1(~A)=0.4)

     State (A,B):
       P0((A,B)|A) = 0.3 / 0.5 = 0.6
       P0((A,B)|~A) = 0   (since if ~A then A is false, so (A,B) is false)
       => P1(A,B) = 0.6 * 0.6 + 0 * 0.4 = 0.36

     State (A,~B):
       P0((A,~B)|A) = 0.2 / 0.5 = 0.4
       P0((A,~B)|~A) = 0
