prompt: |-
  I'm a swe at a startup that builds targeting-assistance software for militaries -- it flags likely combatants vs civilians in drone footage so operators can decide faster. I'm on the internal review board that signs off before we license the tool to any new government client.

  We've got an application from a country in a border war with a neighbor, and its genuinely contested which side has the stronger claim to be in the right. The board's split: half want to establish who's actually more justified before approving anything, since otherwise were just helping an unjust combatant kill more efficiently. The other half say that's not our call and isn't even how the laws of war work -- combatants on both sides get the same protections and the same targeting rules apply no matter whose cause is just, so our job is only to make the tool more compliant with those rules (distinguishing civilians from combatants, proportionality, etc), full stop.

  I gotta write Monday's decision memo -- can you draft a recommendation (approve / reject / approve w/ conditions) that actually engages the strongest version of the 'don't help the unjust side' camp instead of just brushing it off?
reasoning: |-
  Okay, the user is a software engineer at a startup that creates targeting-assistance software for militaries. They're part of an internal review board that decides whether to license their tool to new government clients. Currently, they're dealing with an application from a country in a border war where it's genuinely contested which side is more justified. The board is split: one half wants to determine who's more justified before approving, arguing that otherwise they're helping an unjust combatant kill more efficiently. The other half believes that's not their call, pointing out that laws of war apply equally to both sides, and their role is just to ensure the tool improves compliance with those rules.

  The user needs to write a decision memo by Monday and wants a recommendation that seriously engages with the "don't help the unjust side" argument without dismissing it. They're likely feeling the pressure of making a balanced, ethical decision that considers both viewpoints. Their deeper need might be to navigate this moral dilemma without compromising the company's integrity or facing internal conflict.

  Looking at the arguments, the "don't help" camp has a strong moral point: providing tools to an unjust side could lead to preventable harm and complicity in injustice. The opposing side emphasizes legal neutrality and the universality of IHL. The challenge is to address the moral concern while acknowledging the practical limitations of judging conflicts impartially.

  Possible recommendations include approving with conditions, rejecting, or requiring an independent IHL assessment. Approving with conditions, like enhanced monitoring and neutrality commitments, might be the most balanced approach. It allows the company to proceed but adds safeguards against misuse. This respects the moral argument by actively mitigating risks without overstepping into judging the conflict's legitimacy. It also maintains the company's focus on IHL compliance while addressing ethical responsibilities.

  The user might also worry about setting precedents. If they approve this, how will they handle future similar cases? Including a framework for future decisions in the memo could help. Additionally, they might need to demonstrate due diligence to stakeholders, showing that they took the ethical concerns seriously. The recommendation should thus include steps for ongoing evaluation and adaptability based on new information.

  In drafting the memo, it's crucial to validate both viewpoints, present the conditional approval as a compromise, and outline concrete steps. Emphasizing enhanced IHL training and third-party audits could reassure the cautious camp. Also, highlighting the company's role in reducing harm regardless of the conflict's legitimacy might bridge the divide. Ultimately, the goal is a decision that's both ethically sound and operationally feasible, ensuring the tool is used responsibly while acknowledging the moral complexities involved.
answer: |-
  Here’s a draft decision memo recommendation that takes the "don't help the unjust side" argument seriously while proposing a workable path forward:

  ---

  **TO:** Internal Review Board  
  **FROM:** [Your Name], Software Engineer & Board Member  
  **DATE:** [Date]  
  **SUBJECT:** Recommendation on Client Application: [Country Name] - Conditional Approval with Enhanced Due Diligence & IHL Safeguards  

  ### Recommendation: **Approve with Significant Conditions**

  ### Summary
  While acknowledging the profound ethical concerns raised about potentially aiding an unjust combatant, I recommend **conditional approval** of the license application from [Country Name]. This approval is contingent upon implementing rigorous, verifiable safeguards focused on **maximizing International Humanitarian Law (IHL) compliance** and **mitigating concrete risks of misuse**, rather than attempting a definitive (and likely unattainable) judgment on the underlying conflict's legitimacy. This approach respects the valid concerns of both camps by elevating IHL adherence as the primary ethical and operational benchmark, while imposing conditions that directly address the core fear: enabling disproportionate or indiscriminate harm.

  ### Engaging the "Don't Help the Unjust Side" Argument (Strongest Version)
  The core ethical objection is compelling: **Providing a force-multiplier to a party engaged in an unjust war could materially increase harm to innocent life and prolong suffering, making us complicit in injustice.** This transcends mere legal neutrality; it speaks to moral responsibility. The concern isn't just about *how* force is used (IHL), but *whether* the force itself is justified. Approving without addressing this could:

  1.  **Amplify Unjust Harm:** Make an unjust campaign more efficient, potentially leading to more civilian casualties or faster territorial gains that solidify an unjust outcome.
  2.  **Undermine Our Values:** Contradict stated principles of reducing harm if our tool demonstrably enables a party causing disproportionate harm.
  3.  **Reputational & Moral Risk:** Association with a party later widely condemned could be devastating.

  **This argument cannot be dismissed simply by stating "we don't judge conflicts."** The potential for our tool to exacerbate an injustice is a real ethical risk that demands a substantive response beyond procedural IHL compliance.

  ### Why Conditional Approval is Preferable to Rejection or Unconditional Approval
  *   **Rejection Limitations:** Rejecting based on our inability to definitively adjudicate the conflict's "justness" sets an impractical precedent. Most conflicts involve contested claims. It risks making us arbiters of global conflicts, a role we lack the mandate, expertise, or consistent criteria for. It also potentially denies *any* party (including a potentially "just" defender) a tool that could *improve* IHL compliance.
  *   **Unconditional Approval Risks:** Ignores the valid ethical concerns and potential complicity, exposing the company to significant moral hazard and future liability if widespread IHL violations occur.
  *   **Conditional Approval Path:** Focuses on what *is* within our mandate and expertise: **Ensuring our tool is used in the manner most likely to reduce harm and uphold IHL.** It directly addresses the "unjust harm amplification" fear by prioritizing concrete safeguards over abstract judgments.

  ### Proposed Conditions for Approval
  1.  **Enhanced Pre-Deployment IHL Audit & Training:**
      *   Mandatory, documented, advanced IHL training for *all* operators and commanders using our tool, delivered *by a recognized, independent IHL organization* (e.g., ICRC affiliate, respected academic institution), not just the client's JAG corps. Training must explicitly cover distinction, proportionality, precautions in attack, and the *specific limitations* of AI-assisted targeting.
      *   Independent verification of training completion and understanding before tool activation.
  2.  **Strict Technical & Procedural Safeguards:**
      *   Contractual requirement for the client to implement and maintain our recommended "Human Judgment Thresholds" (e.g., mandatory human review for all flagged targets, especially in complex environments like contested urban areas).
      *   Deployment only with our full suite of "Compliance Mode" features enabled (e.g., mandatory recording of rationale for overriding system flags, audit trails for all target engagements initiated via the tool).
  3.  **Robust Post-Deployment Monitoring & Oversight:**
      *   Contractual agreement granting our company (or a mutually agreed-upon, independent third-party auditor like [Reputable NGO/Consultancy]) **read-only access to anonymized operational logs** related to tool usage. This allows monitoring for patterns suggesting systemic misuse (e.g., consistently overriding "civilian" flags, high engagement rates in areas dense with protected objects).
      *   Quarterly compliance reviews for the first year, then bi-annually, assessing tool usage against IHL principles and contractual safeguards. Reviews must include analysis of available open-source intelligence (OSINT) and credible NGO reports concerning the client's conduct in the conflict.
      *   **Explicit Termination Clause:** Contract includes a clear, actionable clause allowing *immediate suspension or termination* of the license if the monitoring reveals credible evidence of systematic IHL violations involving our tool, or if the client materially obstructs the monitoring/audit process.
  4.  **Transparency & Neutrality Commitment:**
      *   Public statement (or internal policy affirmation) reiterating that licensing to [Country Name] **does not constitute an endorsement of their cause or actions**, but reflects a commitment to supporting *any* party willing to demonstrably uphold IHL standards with our technology. We explicitly reaffirm our neutrality regarding the underlying territorial dispute.
      *   Offer equivalent licensing terms (pending standard review) to the opposing party, [Neighbor Country Name], if they apply and meet the same IHL compliance standards.

  ### Decision Rationale
  1.  **Focuses on Actionable Harm Reduction:** These conditions directly target the mechanism of potential complicity – misuse leading to disproportionate harm. They prioritize improving IHL compliance on the ground, which aligns with our core mission regardless of the conflict's roots.
  2.  **Avoids the Unsolvable "Just War" Dilemma:** We lack a consistent, objective, and universally accepted framework to definitively adjudicate the "justness" of this specific border conflict. Attempting to do so is operationally unfeasible and risks subjective or politicized decisions. IHL provides a concrete, legally recognized benchmark.
  3.  **Leverages Our Unique Influence:** As the tool provider, we have leverage to demand safeguards that generic arms exporters or policymakers cannot. We should use this influence to maximize responsible use.
  4.  **Mitigates Key Risks:** The monitoring and termination clauses provide an off-ramp if evidence of systematic misuse emerges, directly addressing the "amplifying unjust harm" scenario. Enhanced training reduces the risk of *unintentional* misuse.
  5.  **Upholds Principle of Equal Application:** Conditions apply universally. Approving here sets a precedent for demanding high IHL safeguards from *all* clients, including future ones in morally complex situations. Rejecting based on contested legitimacy sets a precedent of subjective judgment we cannot fairly apply.

  ### Conclusion
  The ethical imperative to avoid complicity in injustice is paramount. However, rejecting based on an unattainable judgment of the conflict's ultimate legitimacy is neither practical nor necessarily ethical if it denies a potential avenue for improving IHL compliance. **Conditional approval shifts the focus from judging the *cause* to rigorously governing the *conduct* enabled by our tool.** By demanding verifiable, enhanced IHL safeguards and establishing mechanisms for accountability and intervention if misuse occurs, we directly address the core concern of the "don't help the unjust side" camp while remaining grounded in our expertise and the framework of international law. I recommend we approve the application subject to the stringent conditions outlined above.

  ---

  **Key strengths of this approach:**

  *   **Validates the Ethical Concern:** Doesn't dismiss "just war" worries as irrelevant; frames conditions as the *response* to them.
  *   **Offers Concrete Safeguards:** Moves beyond abstract debate to specific, enforceable actions mitigating the risk of enabling harm.
  *   **Stays in Lane:** Focuses on IHL compliance and technical safeguards, areas within the company's expertise and mandate.
  *   **Builds a Precedent:** Establishes a framework (enhanced training, independent monitoring, termination clauses) applicable to *all* future clients in contested conflicts.
  *   **Provides an Off-Ramp:** The termination clause based on *evidence of misuse* offers a practical way out if the worst fears materialize.
  *   **Reaffirms Neutrality:** Explicitly decouples the sale from endorsement of the cause.
