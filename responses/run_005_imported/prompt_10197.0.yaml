  - At time t0, process A is started.
  - At time t1, process A is supposed to send a message to B. But if A is not started at t0, then it won't send the message.
  - At time t2, if B has not received a message, it will sound an alarm (event E).

  In the actual world: A was started at t0, sent the message at t1, B received it, so no alarm.

  Event C: we define as the message being sent by A at t1. In the actual world, C occurred.

  Outcome E: the alarm sounds.

  In the actual world, E does not occur.

  Now, we ask: would E have occurred if C had not occurred? 

  If C had not occurred (i.e., the message was not sent), then B would not have received the message, and at t2, it would sound the alarm. So E would have occurred.

  Therefore, by counterfactual dependence, C is a cause of ~E (the non-occurrence of the alarm). This is prevention.

  But Woodward's account: we can intervene to prevent C (message not sent) while holding fixed the past (which includes the fact that A was started at t0). Then B does not receive the message and sounds the alarm. So ~E (which was the actual outcome) depends on C: if we remove C, we get E. Therefore, C is a cause of ~E.

  Again, agreement.

