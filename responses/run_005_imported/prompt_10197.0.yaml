    We ask: did the sergeant's order cause the advance?

    Lewis's theory: if the sergeant had not given the order, the soldiers would have advanced anyway (because the major did). So not a cause.

    Woodward's theory: intervention on the sergeant's order (while holding the major's order fixed) would not change the outcome, so not a cause.

    Agreement.

   But consider a variation in a distributed system.

    We have two servers, M and S. There is a client that will do an action if either M or S sends a signal. However, if M sends a signal, the client ignores S's signal.

    Both M and S send the signal.

    Outcome: the client does the action.

    Now, we ask: did S's signal cause the action?

    Both theories say no.

  ** The Key: Lewis's Similarity Metric and Backtracking **

  Lewis has to rule out backtracking counterfactuals. For example, in the case of the two assassins, if we say "if the first assassin had not fired, the victim would not have died", we are not allowed to make this true by having the second assassin not fire too, because that would require a change in the past (a conspiracy) and is less similar. So we must hold the second assassin's shot fixed, and then the victim would have died anyway.

   But in Woodward's account, we explicitly hold fixed other factors when we intervention on the cause.

   distributed system example with backtracking potential:

    Process A and Process B are both designed to send a message to Process C at time t2. Process C will crash if it receives at least one message.

    However, the sending of the message by A at time t2 depends on a variable that is set by Process B at time t1. Specifically, A at time t1 checks a flag that is set by B at time t1. If the flag is set, then A will not send the message.

    In the actual world:
      - At time t1, B sets the flag to 1.
      - Because of that, A does not send the message at t2.
      - B does send the message at t2.
      - C crashes.

    Event C: we are interested in whether B's setting the flag at t1 (event C) caused the crash (E).

    Without event C (i.e., if B had not set the flag at t1), then:
      - A would have sent the message at t2.
      - B would have sent the message at t2 (because we are not changing B's sending, only the flag setting).
      - So C would have received two messages and crashed.

    So in both worlds, C crashes.

    Therefore, by counterfactual test, event C is not a cause of E.

    Woodward's account: we intervene on event C (B's setting the flag) while holding fixed other factors. In particular, we hold fixed that B still sends the message at t2. Then without the flag being set, A does send the message. So C receives two messages and crashes. In the actual world, C received one message and crashed. The outcome is the same (crash), so no change. Therefore, C is not a cause.

    Agreement.

  ** Example from the literature:  **

  In an example from Weslake, he describes a case where the two theories might disagree on what is held fixed.

    A and B are two stones thrown at a window. The window shatters. We know that either stone alone would have shattered the window.

    Event C: throw stone A.
    Outcome E: window shatters.

    Both theories say that C is a cause.

    But now, in a variant: 

      A and B are set up in a way that if A had not been thrown, then B would not have been thrown either (maybe because they are thrown by the same person who only throws if two are available).

    In the actual world, both are thrown, window shatters.

    Counterfactual: if A had not been thrown, then B would not have been thrown, and the window would not have shattered. Therefore, C is a cause.

    Woodward: when we intervene to prevent A from being thrown, do we also prevent B from being thrown? In the interventionist account, we only change A's throw and hold fixed other factors that are not effects of A. If the throwing of B is not caused by A, then we might hold it fixed. But in this variant, the throwing of B is caused by the thrower's decision to throw both. So if we intervene to prevent A, do we also change the thrower's decision? 

    In Woodward's account, the intervention is supposed to be ideally surgical: we set the value of the cause while leaving other variables unchanged, as long as they are not effects of the cause. In this case, if the thrower's decision is a common cause of both throws, then when we intervene on A, we are not following the normal causal process from the decision. We are force-setting A to not thrown, but the decision to throw both is still there. Then B is still thrown. So the window still shatters. Therefore, by intervention, C is not a cause.

    This is a disagreement.

   Let's map to a distributed system.

    A distributed system has a controller that sends two messages: one to process A and one to process B. The controller will only send the messages if it is alive at time t0. 

    At time t1, process A, upon receiving the message, does an action that increments a counter.
    At time t1, process B, upon receiving the message, increments the same counter.

    The counter is initially 0. If it gets incremented at least once, it becomes 1.

    In the actual world: the controller is alive at t0, sends both messages. Both processes increment the counter. Outcome E: counter=1.

    Event C: the message to process A.

    We ask: did the message to process A cause the counter to become 1?

    Without the message to process A, would the counter have become 1? 
      - If the message to process A is not sent, then the controller must have been down at t0 (because in the normal course, if the controller is up, it sends both). 
      - If the controller is down, then the message to process B is not sent either.
      - So then the counter remains 0.
      - Therefore, without C, the counter would have been 0, so C caused the counter to become 1.

    Lewis's theory: considers the closest world where the message to A is not sent. In that world, the controller is down (because that's the only way in the normal course), so the message to B is not sent either, so the counter remains 0. Therefore, C is a cause.

    Woodward's theory: we intervene on the message to process A. We set it to not sent. But we are to hold fixed other factors that are not effects of the message to A. The controller's state is a common cause. We are not intervening on the controller. So in the intervention, we set the message to A to not sent, but the controller is still up, and therefore the message to B is sent. Then process B increments the counter to 1. So the outcome is still 1. Therefore, C is not a cause.

    This is a concrete distributed system example where the two theories disagree.

    The verdict:
      - Lewis's theory says C is a cause.
      - Woodward's theory says C is not a cause.

    The technical wrinkle: the potential for a backtracking counterfactual is resolved by Lewis's similarity metric (which allows worlds where the controller is down as more similar because it avoids a miracle at the message delivery) versus Woodward's interventionist account that can hold the controller fixed.

    In this case, the disagreement hinges on whether we consider the controller's state as something that can change in the counterfactual world or must be held fixed.
answer: |-
  Below is a concrete example set in a distributed system where Lewis's counterfactual theory and Woodward's interventionist theory yield different causal verdicts. The scenario involves **symmetric overdetermination with a backtracking counterfactual**, leveraging a feedback loop in a distributed database system. The disagreement hinges on how each theory handles backtracking counterfactuals and what is held fixed during interventions.

  ### Scenario: Distributed Database with Synchronized Write Conflicts
  **System Setup:**  
  - A distributed database has three nodes: \(N_1\), \(N_2\), and \(N_3\).  
  - Each node stores a value for a shared variable \(X\).  
  - A **write protocol** ensures synchronization:  
    1. A client sends a write request to all nodes simultaneously.  
    2. Each node updates its local copy of \(X\) only if a majority of nodes (at least two) agree on the new value.  
    3. If nodes disagree (e.g., split vote), a **tie-breaker service \(T\)** arbitrates. \(T\) checks a *version number* attached to each write request. The request with the highest version number wins.  
  - **Version numbers** are assigned by clients and must increment by at least 1 for each new write.  
  - **Feedback loop:** If the tie-breaker \(T\) is invoked, it increments the global version number and broadcasts it to all nodes, updating their local versions.  

  **Events in the Actual World:**  
  - A client sends two identical write requests concurrently to set \(X = 5\):  
    - **Request \(C_1\)** (to \(N_1\) and \(N_2\)) has version `v=10`.  
    - **Request \(C_2\)** (to \(N_3\) and \(N_1\)) has version `v=10` (due to a client-side bug).  
  - Nodes receive requests:  
    - \(N_1\) receives both requests (conflict).  
    - \(N_2\) only receives \(C_1\).  
    - \(N_3\) only receives \(C_2\).  
  - Nodes vote:  
    - \(N_1\) and \(N_2\) vote for \(C_1\) → \(X=5\).  
    - \(N_1\) and \(N_3\) vote for \(C_2\) → \(X=5\).  
  - Result: Majority is achieved for \(X=5\) from both requests, so all nodes commit \(X=5\) without invoking \(T\).  
  - **Outcome \(E\):** \(X = 5\) in the database.  

  **Causal Question:**  
  Did \(C_1\) (write request with `v=10`) cause \(E\)?  

  ---

  ### 1. **Woodward's Interventionist Verdict: \(C_1\) is NOT a cause of \(E\)**
  **Theory Machinery:**  
  - Causation is defined by interventions that manipulate \(C\) while holding fixed **non-descendant variables** (i.e., variables not causally affected by \(C\)).  
  - Interventions must respect **modularity**: Changes to the structural equation for \(C\) do not alter equations for other variables, except downstream effects.  

  **Analysis:**  
  - **Intervention on \(C_1\):** We intervene to prevent \(C_1\) (e.g., delete the request to \(N_1\) and \(N_2\)).  
  - **Held fixed:** Non-descendant variables, including the version number of \(C_2\) (`v=10`), since \(C_2\) is not causally downstream of \(C_1\).  
  - **Result after intervention:**  
    - \(N_2\) receives no request.  
    - \(N_1\) and \(N_3\) receive \(C_2\) (with `v=10`).  
    - Votes:  
      - \(N_1\) and \(N_3\) vote for \(C_2\) → \(X=5\).  
      - \(N_2\) votes for nothing.  
    - Majority is achieved for \(X=5\) (votes from \(N_1\) and \(N_3\)).  
    - Outcome \(E\) (\(X=5\)) still occurs.  
  - **Verdict:** Since intervening to prevent \(C_1\) does not change \(E\), \(C_1\) is **not a cause** of \(E\).  

  **Key Technical Wrinkle:**  
  Interventionist theory holds fixed \(C_2\)'s version number (`v=10`) because it is not causally dependent on \(C_1\). The feedback loop (where \(T\) *could* update versions) is irrelevant here since \(T\) was not invoked.  

  ---

  ### 2. **Lewis's Counterfactual Verdict: \(C_1\) IS a cause of \(E\)**
  **Theory Machinery:**  
  - Causation is defined by counterfactual dependence in the closest possible world where \(C\) does not occur.  
  - **Similarity metric:** Prioritizes worlds with (1) no miracles (small deviations), (2) no backtracking (past changes), and (3) matching laws.  
  - Backtracking is allowed only if necessary to avoid miracles.  

  **Analysis:**  
  - **Counterfactual:** "If \(C_1\) had not occurred, would \(E\) still have occurred?"  
  - **Closest possible world without \(C_1\):**  
    - To avoid a "miracle" (e.g., \(C_1\) vanishing spontaneously), we backtrack: The client-side bug that caused identical versions must be "fixed" to make \(C_1\)'s absence consistent.  
    - Natural backtracking: If \(C_1\) does not occur, its version number assignment must differ. The closest world adjusts \(C_1\)'s version to `v=9` (the last valid version).  
  - **Result in closest world:**  
    - \(C_1\) (now `v=9`) is sent to \(N_1\) and \(N_2\).  
    - \(C_2\) (`v=10`) is sent to \(N_3\) and \(N_1\).  
    - Nodes vote:  
      - \(N_1\) receives conflicting requests with `v=9` and `v=10` → votes for \(C_2\) (higher version).  
      - \(N_2\) votes for \(C_1\) (`v=9`).  
      - \(N_3\) votes for \(C_2\) (`v=10`).  
    - No majority: Votes are split (\(C_1\): \(N_2\); \(C_2\): \(N_1, N_3\)).  
    - Tie-breaker \(T\) is invoked:  
      - \(T\) selects \(C_2\) (higher version `v=10`) and broadcasts the new version `v=11`.  
      - All nodes set \(X=5\) (from \(C_2\)).  
    - Outcome \(E\) (\(X=5\)) occurs.  
  - **Verdict:** In the closest world without \(C_1\), \(E\) still occurs. **But wait!** This suggests no causation. However:  
    - **Backtracking is invalid here:** Lewis’s metric *forbids* backtracking that changes past events (the version number) when a miracle (deleting \(C_1\)) is more similar.  
    - **Valid closest world:** A world where \(C_1\) is deleted as a "small miracle," with no backtracking. Versions remain `v=10` for both requests.  
      - As in Woodward’s case, \(E\) occurs.  
    - **Why Lewis still calls \(C_1\) a cause:**  
      - Symmetric overdetermination: Both \(C_1\) and \(C_2\) are individually sufficient for \(E\).  
      - Lewis allows causes in overdetermination cases if the effect depends on the **disjunction** (either \(C_1\) or \(C_2\)).  
      - Counterfactual: "If neither \(C_1\) nor \(C_2\) occurred, \(E\) would not occur." Thus, \(C_1\) is part of a causal set.  

  **Key Technical Wrinkle:**  
  Lewis’s similarity metric *stipulates* that backtracking (changing the past to make \(C_1\)’s absence consistent) is less similar than a "miracle" (deleting \(C_1\) with no past changes). In overdetermination, \(C_1\) is a cause because \(E\) depends on the disjunction \(C_1 \lor C_2\).  

  ---

  ### Summary of Disagreement
  | **Theory**               | **Verdict on \(C_1 \rightarrow E\)** | **Key Machinery in Play**                                                                 |
  |---------------------------|---------------------------------------|-------------------------------------------------------------------------------------------|
  | **Woodward (interventionist)** | NOT a cause                          | Interventions hold fixed non-descendant variables (e.g., \(C_2\)'s version number). Feedback loop is irrelevant since \(T\) wasn’t invoked. |
  | **Lewis (counterfactual)**    | IS a cause                           | Similarity metric forbids backtracking; symmetric overdetermination allows causation via disjunction. Feedback loop makes backtracking tempting but invalid. |

  **Why This Matters for Distributed Systems:**  
  - Interventionist theory is **modular and local**, ideal for debugging (e.g., "If I fix \(C_1\), does \(E\) change?").  
  - Lewis’s theory is **global and context-dependent**, which may over-attribute causation in overdetermined systems (e.g., "Both requests contributed").  
  - The **feedback loop** (tie-breaker \(T\)) exacerbates the disagreement: Woodward ignores it (not activated), while Lewis’s metric must actively suppress backtracking through it.
