  So if we ask: did the failure of P's write (event C) cause the outcome X=1?

  Without C, we have X=1 (written by P) and then Q does nothing, so outcome is X=1.
  With C, we have X=1 (written by Q).

  So in both cases, outcome is X=1. Therefore, by counterfactual test, C is not a cause of E.

