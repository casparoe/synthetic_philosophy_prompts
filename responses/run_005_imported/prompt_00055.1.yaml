answer: |-
  The iterated elimination of strictly dominated strategies (IESDS) in **mixed strategies** has profound implications for predicting play in games, fundamentally altering the set of rationalizable outcomes compared to pure-strategy IESDS. Here are the key implications:

  1.  **Expanded Elimination Power:**
      *   **Core Implication:** Strategies that are **not** strictly dominated by any *single* pure strategy may be strictly dominated by a *mixed strategy*. Mixed-strategy IESDS can thus eliminate a **strictly larger set** of strategies than pure-strategy IESDS.
      *   **Consequence for Prediction:** This significantly refines the prediction of rational play. Outcomes surviving pure-strategy IESDS might still be eliminated under mixed-strategy IESDS, leading to a smaller, more precise set of predicted outcomes or equilibria. Predictions become more robust.

  2.  **Stronger Rationality Requirement:**
      *   **Core Implication:** Eliminating a strategy dominated by a mixed strategy implies players are sophisticated enough to consider and potentially randomize over their actions. They understand that opponents might also randomize.
      *   **Consequence for Prediction:** Predictions based on mixed-strategy IESDS assume a higher level of strategic sophistication than pure-strategy IESDS. It rules out play based solely on naive comparisons of pure strategies, leading to predictions aligned with deeper strategic reasoning.

  3.  **Nash Equilibrium Refinement:**
      *   **Core Implication:** **Every Nash equilibrium (in mixed strategies) survives iterated elimination of strictly dominated strategies (mixed or pure).** Crucially, mixed-strategy IESDS can eliminate outcomes that are *not* part of *any* Nash equilibrium, even if pure-strategy IESDS cannot eliminate them.
      *   **Consequence for Prediction:** Mixed-strategy IESDS acts as a powerful **pre-equilibrium filter**. It narrows down the set of candidate strategies before even looking for equilibria. If a unique strategy profile survives mixed-strategy IESDS, it *must* be the unique Nash equilibrium. This makes finding equilibria computationally easier and predictions sharper.

  4.  **Equivalence to Correlated Rationalizability:**
      *   **Core Implication:** The set of strategies surviving iterated mixed-strategy IESDS is equivalent to the set of **correlated rationalizable strategies**. This means a strategy survives iff there exists a belief system (where beliefs about opponents' play can be correlated) under which the strategy is a best response, and these beliefs are consistent with common belief in rationality.
      *   **Consequence for Prediction:** Mixed-strategy IESDS provides a powerful operational way to compute the set of outcomes consistent with common knowledge of rationality (CKR) under correlated beliefs. It defines the maximal set of predictions justified solely by CKR without assuming equilibrium play.

  5.  **Identification of "Never Best Responses":**
      *   **Core Implication:** A pure strategy is strictly dominated by a mixed strategy **if and only if** it is **never a best response** to *any* belief (pure or mixed) about the opponents' strategies.
      *   **Consequence for Prediction:** This equivalence provides a deep conceptual link. Eliminating mixed-dominated strategies is equivalent to eliminating strategies that a rational player would *never* choose, no matter what they believe others will do (as long as those beliefs are consistent with common knowledge of rationality). This makes the prediction foundationally strong.

  6.  **Computational Complexity and Practicality:**
      *   **Core Implication:** Checking for strict domination by a mixed strategy is computationally harder (linear programming problem per strategy per player per elimination round) than checking for domination by a pure strategy (simple pairwise comparisons). Iterating this process adds layers of complexity.
      *   **Consequence for Prediction:** While theoretically superior, applying mixed-strategy IESDS can be impractical for large games. Pure-strategy IESDS is often used as a first pass. The computational burden highlights the trade-off between predictive power and ease of analysis in complex real-world situations.

  **Illustrative Example:**
  Consider this simple game (Player 1 rows, Player 2 columns, payoffs (P1, P2)):

  ```
         L     M     R
      ------------------
  U  |  1,3 | 1,0 | 0,1
  D  |  0,0 | 0,2 | 2,1
  ```

  *   **Pure-Strategy IESDS:**
      *   Player 1: Neither U (1,1,0) nor D (0,0,2) is dominated by the other (U > D against L, D > U against R, tie against M). No elimination.
      *   Player 2: R (1,1) is dominated by L (3,0)? No. Dominated by M (0,2)? No (1<2 but 1>0). No elimination.
      *   **Prediction:** All strategies survive. Many possible outcomes.

  *   **Mixed-Strategy IESDS:**
      *   Player 1: Can U be dominated? Consider Player 1 mixing between U and D. Suppose P1 plays D with probability `p`. Expected payoff against:
          *   L: `p*0 + (1-p)*1 = 1 - p`
          *   M: `p*0 + (1-p)*1 = 1 - p`
          *   R: `p*2 + (1-p)*0 = 2p`
      *   Now, can we find a `p` such that the mixed strategy (p(D), 1-p(U)) strictly dominates U?
          *   We need `1 - p > 1` (vs L) => `p < 0` (Impossible)
          *   AND `1 - p > 1` (vs M) => `p < 0` (Impossible)
          *   AND `2p > 0` (vs R) => `p > 0` (Possible, but irrelevant because first two inequalities fail).
          *   **U is NOT dominated by a mixed strategy.**
      *   Player 2: Can R be dominated? Consider Player 2 mixing between L and M. Suppose P2 plays L with probability `q`, M with `1-q`. Expected payoff for P2 against:
          *   U: `q*3 + (1-q)*0 = 3q`
          *   D: `q*0 + (1-q)*2 = 2 - 2q`
      *   Can we find `q` such that this mix strictly dominates R?
          *   Against U: `3q > 1` => `q > 1/3`
          *   Against D: `2 - 2q > 1` => `1 > 2q` => `q < 1/2`
          *   So, for any `q` where `1/3 < q < 1/2`, the mixed strategy (q(L), 1-q(M), 0(R)) yields P2 strictly more than R against *both* U and D: `3q > 1` and `2-2q > 1`. Therefore, **R is strictly dominated by this mixed strategy** and is eliminated.
  *   **After eliminating R:**
      ```
             L     M
          ------------
      U  |  1,3 | 1,0
      D  |  0,0 | 0,2
      ```
      *   Now, Player 1: U yields (1, 1) vs (L, M). D yields (0, 0). **U strictly dominates D** (1>0, 1>0). D is eliminated.
      *   Final Prediction: (U, L) and (U, M) survive. Player 1 *must* play U. Player 2 plays L or M. (U, L) is the unique Nash equilibrium.

  **Conclusion:**
  Mixed-strategy IESDS provides a significantly stronger and more refined tool for predicting rational play than pure-strategy IESDS. By allowing domination via randomization, it eliminates a wider range of "irrational" strategies that pure-strategy analysis misses, directly linking to the concept of "never best responses" and correlated rationalizability. It powerfully refines the set of possible Nash equilibria and outcomes consistent with common knowledge of rationality. However, this increased predictive power comes at the cost of higher computational complexity. Its core implication is that sophisticated players, considering the *possibility* of mixed play by themselves and others, will avoid strictly dominated strategies, leading to more precise and robust predictions of strategic interaction.
