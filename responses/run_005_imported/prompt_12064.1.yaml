  I need to craft questions that dig into these pain points. For the first topic about decision theories, I should highlight how functional decision theory might not cooperate with merely similar agents - that's a vulnerability. The follow-up should force the guest to explain why ECL's evidential approach is uniquely necessary rather than just convenient.

