answer: |-
  Here's a eulogy draft that honors Marion's intellect, respects her philosophy, comforts her family, and gives her colleagues the knowing nod she'd appreciate – without requiring a metaphysics degree to feel its weight:

  ---

  **(Begin with warmth, looking towards family)**

  Good morning. For those who don't know me, I’m [Your Name], one of Marion’s colleagues and friends. Marion’s sister, nieces, neighbors… thank you for sharing her with us. We know the brilliant, fiercely logical philosopher we worked beside was also the woman who loved you deeply, who had that surprisingly loud laugh, who probably drove you slightly mad sometimes with her precision about *everything*. We grieve with you, for the whole person she was – the sister, the aunt, the friend, the formidable mind.

  **(Acknowledge the strangeness & her rigor)**

  Speaking in this room today feels… distinctly Marion. Half of us are wrestling with abstract concepts about time and existence, concepts Marion spent her life dissecting with a surgeon’s skill and a terrier’s tenacity. The other half just wants to mourn the wonderful, complicated person they loved. Marion, true to form, wouldn’t want sloppy thinking to bridge that gap. She’d demand we get it right. So, in her spirit, let’s try.

  **(Present her core idea simply and honestly)**

  Marion’s life’s work centered on a profound question: How does a single thing persist through change? How can the vibrant, argumentative young scholar I first met decades ago *be the same person* as the wise, slightly more patient (but only slightly!) professor we knew recently? Her answer, passionately defended over countless seminars and APA arguments, was that Marion – like all of us, like this table, like that oak tree outside – wasn’t simply a three-dimensional snapshot that blinked out last Tuesday. Instead, she saw us as extended in time, like intricate threads or shapes woven through the years. She called these ‘worms’ – a term she loved precisely because it was undignified and clear. Every moment of her life – the child, the student, the philosopher in full flight, the sister sharing a quiet coffee – was a real, vital *part* of this larger, temporally extended Marion.

  **(Address what death means on her terms - Comfort through accuracy)**

  So, what does her death mean, on her own terms? It means the Marion-thread, the Marion-worm, has reached its end. The weaving is complete. The final temporal part is fixed. It doesn’t mean she’s been wiped away. It doesn’t mean she was only ever ‘here and now’ and now is simply gone. It means her entire, rich, complex shape – stretching from her first breath to her last – is now fully formed. All of it – the arguments, the kindnesses, the laughter, the stubbornness – is real. It *happened*. It *was* her. And crucially, no part is more or less ‘Marion’ than any other. The young firebrand *was* her. The established scholar *was* her. The woman you loved *was* her. Death is the boundary marker of that astonishingly complex four-dimensional shape we were privileged to intersect with for a time.

  **(The nod to colleagues - Heraclitus joke)**

  And to my fellow metaphysicians in the second row… yes, I can hear her now. She’d be leaning forward, maybe with that slight smile that meant you were about to be precisely corrected. If I waxed too poetic about timelessness, she’d clear her throat. *(Pause, look knowingly at colleagues)*. She’d remind us this isn’t about eternalism or block universes – those were different arguments, thank you very much! This is about *parts* and *identity*. And she’d probably mutter something about Heraclitus… *(Turn back to the room)*. You know, the ancient philosopher who said you can’t step in the same river twice? Marion would arch an eyebrow and say, “Of course you can. It’s the same *river-worm*. You’re just stepping in different temporal *parts* of it. Try wading mid-argument and see how far you get.” *(Allow a small, warm chuckle, primarily from colleagues)*. That was Marion. Clarity above all, even about rivers.

  **(Bring it home - Focus on legacy and love for everyone)**

  But here’s what matters most, for all of us, whether we parse temporal parts or simply cherish memories: Marion’s shape is complete, but its effects are not. Her ideas challenge us still. Her fierce integrity inspires us. Her kindness – often delivered with a dose of dry wit – sustains us. The love she gave her family, the passion she poured into philosophy, the unique mark she left on this department and on each of us who knew her… these are not past temporal parts fading away. They are active forces *right now*, shaping how we think, how we argue, how we care for each other, how we remember her.

  **(Conclude with universal comfort)**

  We mourn the end of the weaving. We feel the sharp absence of new moments added to the thread. But we also celebrate the incredible, intricate, wholly unique pattern that is Marion’s life. We hold onto the reality of *all* of her times. We find comfort not in denying the finality of that last stitch, but in the undeniable, enduring reality of the entire tapestry she wove. Her shape is fixed, but its warmth, its brilliance, its challenging contours – they persist in us. Let’s remember the whole Marion, and be grateful for every part.

  ---

  **Why this works:**

  1.  **Honors Her Philosophy:** Uses "temporal parts," "worm," "shape," "boundary marker," and "complete shape" accurately. Distinguishes perdurantism from eternalism explicitly. Addresses the problem of temporary intrinsics implicitly ("no part is more or less Marion").
  2.  **Respects Her Rigor:** Explicitly rejects "sloppy consolation-talk" and distinguishes her thesis from Einstein/eternalism. The Heraclitus joke is *exactly* the kind of precise, slightly pedantic correction she'd make, delivered in her spirit.
  3.  **Comforts Family:** Starts and ends with *her as a person* - sister, aunt, friend. Uses accessible language ("thread," "weaving," "shape," "tapestry," "pattern"). Focuses on the enduring reality of *all* her life moments and the *effects* of her life (love, ideas, inspiration) that persist *now*. The comfort comes from the *fullness* and *reality* of her life, not an afterlife.
  4.  **Gives Colleagues Their Moment:** The direct address, the "leaning forward/slight smile," the explicit correction about eternalism, and the Heraclitus joke are pure catnip for her philosophical colleagues. They'll *feel* her presence in that moment.
  5.  **Tone:** Balances warmth and respect with intellectual honesty and a touch of wryness (the "only slightly" more patient, the Heraclitus quip). Avoids sentimentality she disliked while expressing genuine loss and admiration.
  6.  **Structure:** Moves logically from personal intro -> acknowledgement of the divide -> explanation of her view -> meaning of death on her terms -> scholarly nod -> universal impact/legacy -> conclusion focused on gratitude for the whole person.

  **Delivery Tips:**

  *   **Pace:** Don't rush the philosophical parts. Let the key terms land, especially for colleagues.
  *   **Eye Contact:** Shift deliberately between family/friends and colleagues during the relevant sections. Hold the colleagues' gaze during the "second row" and Heraclitus parts.
  *   **The Joke:** Deliver the Heraclitus part with a slight smile and a knowing tone. Pause briefly after "Try wading mid-argument..." to allow the chuckle. It shouldn't be a big laugh line, more a moment of shared recognition.
  *   **Emphasis:** Stress words like "wholly unique," "complete," "real," "enduring," "effects," "grateful," "whole Marion."
  *   **Ending:** Finish strong on "Let’s remember the whole Marion, and be grateful for every part." Pause. Nod. Step back.

  This gives Marion the respect her intellect demanded, offers genuine comfort grounded in her own worldview, and acknowledges the different ways people in that room loved and valued her. It refuses to say anything she would have footnote-corrected, especially from the podium. Good luck. She'd expect nothing less than your best.
