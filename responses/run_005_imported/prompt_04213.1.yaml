   The objections we have to consider:
     1. Uncomputability: Solomonoff induction is uncomputable, so no real agent can implement it.
     2. Universal machine dependence: The prior depends on the choice of the Universal Turing Machine (UTM), and this dependence only vanishes in the limit (asymptotically).
     3. Malign prior: The possibility that the prior is dominated by simulated agents (or programs) that are designed to manipulate the predictor.
     4. Grain of truth issue: An embedded agent cannot have a "grain of truth" (i.e., a positive prior probability) for the true environment if that environment contains a copy of the agent itself (due to self-referential problems).
