  The surrogate goal strategy avoids harm to the real goals by redirecting the threat to a decoy. The real goals are not threatened because the threatener doesn't know about them.

  ### Step 4: Addressing the core question

  **Is surrogate goal just a special case of threat-resistance (non-negotiation)?**

  Not exactly. In the non-negotiation strategy, the agent's commitment deters the threat. In the surrogate goal strategy, the agent doesn't have to deter the threat because the threat is directed at a decoy and the agent doesn't care. The surrogate goal strategy is more about making the agent immune to threats by having nothing to lose (on the surface) rather than deterring the threat.

  However, in the surrogate goal strategy, the agent also must not pay when the surrogate is threatened. So in that sense, it is also a form of non-negotiation for the surrogate goal. But the reason the agent doesn't pay is because it doesn't care, not because of a commitment to non-negotiation per se.

  Moreover, the non-negotiation strategy requires that the threatener is rational and that the threat is costly to carry out. If the threat is costless, then the threatener might carry it out even if it expects no payment (for example, out of spite). The surrogate goal strategy would still work in that case because the agent doesn't care.

  But note: if the threat is costless and the threatener carries it out on the real goals (if discovered), then the agent is harmed. So the surrogate goal strategy relies on hiding the real goals.

  ### Step 5: The problem of being tested

  The question also asks: could being known to carry a surrogate goal change a rational threatener's incentive to test you in a way that undermines deterrence?

  Consider:

  In the non-negotiation strategy, the threatener knows that if it threatens, it will incur a cost and get nothing. So it doesn't threaten.

  In the surrogate goal strategy, the threatener knows that the agent has a surrogate goal. The threatener might threaten the surrogate goal to test if the agent really doesn't care. How?

  - If the agent doesn't pay when the surrogate is threatened, that confirms that the surrogate is indeed a decoy. But the threatener has incurred a cost to carry out the threat and got nothing.

  - However, the threatener might learn that the agent has a surrogate goal and then try to find out the real goals. If it can discover the real goals, then it can threaten those.

  So the surrogate goal strategy might invite probing attacks. The threatener might carry out a threat against the surrogate to see if the agent pays. If the agent doesn't pay, the threatener then knows that the surrogate is a decoy and might invest in finding the real goals. This could lead to a future threat against the real goals.

  Therefore, the surrogate goal strategy might not be stable if the threatener can learn from the interaction. It might lead to an escalation where the threatener tries to uncover the real goals.

  In contrast, the non-negotiation strategy, if credible, deters any threat because the threatener knows it will not get paid and will incur a cost.

  But note: if the non-negotiation strategy is not credible (i.e., the threatener believes that the agent might pay if threatened sufficiently), then the threatener might test by threatening. This is the classic commitment problem. The surrogate goal strategy might suffer from the same if the threatener doubts that the surrogate is indeed a decoy.

  However, in the surrogate goal strategy, if the agent pays when the surrogate is threatened, then the threatener learns that the surrogate is valuable and will threaten again. So the agent must not pay. This is similar to the non-negotiation commitment.

  ### Step 6: Conclusion on the relationship

  - The non-negotiation strategy (threat-resistance) is about deterrence: by committing to never pay, the agent makes threats unprofitable and they don't happen.

  - The surrogate goal strategy is about immunity: by redirecting threats to a decoy, the agent is not harmed by the threat even if it is carried out.

  However, the surrogate goal strategy also requires that the agent does not pay when the surrogate is threatened, which is a form of non-negotiation for the surrogate. But the underlying mechanism is different.

  Moreover, the surrogate goal strategy requires that the real goals are hidden. If the real goals are exposed, the agent becomes vulnerable.

  So they are not the same. The surrogate goal strategy solves a different problem: it allows the agent to be immune to threats even if they are carried out, and it might be useful when deterrence fails (for example, if the threatener is irrational or if the threat is costless). But it introduces the risk of exposing the real goals.

  ### Step 7: Answering the specific questions

  **Is adopting a surrogate goal just a special case of threat-resistance?**

  No, it is not. Threat-resistance (non-negotiation) is about preventing the threat from being made. Surrogate goals are about making the threat harmless if it is carried out. They are different mechanisms.

  **Does surrogate goal solve a distinct problem?**

  Yes. The distinct problem is: what if the threat is carried out anyway? In the non-negotiation strategy, if the threat is carried out, the agent is harmed (unless the threatener was deterred). In the surrogate goal strategy, the agent is not harmed because the threat lands on the decoy.

  However, note that in the non-negotiation strategy, the threat is not carried out because of deterrence. So the harm doesn't occur. So both strategies avoid harm, but in different ways.

  The surrogate goal strategy also addresses the case where the threatener might threaten anyway (e.g., if it doubts the commitment, or if the threat is costless). In that case, the non-negotiation strategy would fail (the threat is carried out and the agent is harmed) but the surrogate goal strategy would not (the agent is not harmed).

  **Could being known to carry a surrogate goal change the threatener's incentives in a way that undermines deterrence?**

  Yes, it might. If the threatener knows the agent uses a surrogate, it might:

  1. Threaten the surrogate to test if the agent really doesn't care. This costs the threatener, but if the agent doesn't pay, the threatener learns that the surrogate is a decoy.

  2. Then, the threatener might invest in discovering the real goals. If successful, it can threaten the real goals.

  This probing might not occur in the non-negotiation strategy because the threatener knows that threatening the real goals (which are known) is unprofitable and doesn't reveal new information.

  Therefore, the surrogate goal strategy might invite more attacks in the long run if the real goals can be discovered. This is a potential downside.

  ### Final Answer

  The two strategies are distinct:

  - **Non-negotiation (threat-resistance)**: Prevents threats by making them unprofitable through a credible commitment to never pay. This relies on deterrence and requires that the threatener is rational and that threats are costly.

  - **Surrogate goals**: Redirects threats to a decoy, making the agent immune to harm from threats. This relies on hiding the real goals and having the agent not care about the decoy. It can handle cases where deterrence fails (e.g., irrational threatener, costless threats) but risks exposing the real goals through probing attacks.

  Adopting a surrogate goal is not a special case of threat-resistance; it solves the distinct problem of harm mitigation in the event a threat is carried out. However, it may undermine long-term deterrence by inviting probing attacks that could eventually reveal the agent's real goals, making it vulnerable in the future.
answer: |-
  ### Analysis of Threat-Handling Strategies: Non-Negotiation vs. Surrogate Goals

  To address your query, I'll break down the two strategies—non-negotiation (associated with functional/updateless decision theory) and surrogate goals (associated with CLTR-style proposals)—using game-theoretic mechanics. I'll clarify their relationship, whether surrogate goals are a special case of non-negotiation, and how surrogate goals might alter a threatener's incentives. The analysis focuses on the acausal threat scenario, where the threatener never causally interacts with the agent but bases decisions on predictions/simulations.

  #### Core Mechanics of Non-Negotiation (Threat-Resistance)
  - **Strategy**: The agent commits to a policy of never yielding to threats, regardless of the consequences. This policy is "updateless" (i.e., the agent does not revise its strategy based on the threat itself) and is known to the threatener via prediction/simulation.
  - **Game-theoretic setup**: Model this as a sequential game with asymmetric information:
    - **Players**: Agent (A) and Threatener (T).
    - **Timeline**: 
      1. T predicts/simulates A's strategy.
      2. T decides whether to threaten (e.g., "Pay $X, or I destroy something you value").
      3. If threatened, A chooses: pay or not pay.
      4. If A doesn't pay, T chooses: carry out threat or not.
    - **Payoffs**:
      - T incurs a cost `c > 0` to carry out the threat (e.g., energy spent attacking). If A pays, T gains `g > c` (net benefit: `g - c`). If A doesn't pay and T carries out the threat, T loses `c` (net: `-c`). If T doesn't threaten or doesn't carry out, T gets `0`.
      - A incurs a loss `L > 0` if the threat is carried out against its real values. If A pays, it loses `X` (the payment). If no threat or threat not carried out, A gets `0`.
    - **Equilibrium**: 
      - A commits to "never pay" unconditionally. T simulates this and sees that threatening leads to a subgame where:
        - If T threatens and A doesn't pay, T's best response is to not carry out the threat (since `-c < 0`). But if T knows A won't pay, threatening is irrational because T cannot profit. T gets `0` from not threatening and `-c` from threatening and carrying out (or `0` if it doesn't carry out, but threatening itself may have a small cost). Thus, T never threatens.
      - **Deterrence**: By committing to non-negotiation, A makes T's threat non-credible. T is deterred because the expected payoff of threatening is ≤0 (if we assume a tiny cost to making the threat), while not threatening yields `0`.
  - **Key strength**: Prevents threats entirely through deterrence. Works if T is rational, threats are costly (`c > 0`), and A's commitment is perfectly predictable.
  - **Weakness**: If T is irrational, or if carrying out the threat is costless (`c = 0`), T might threaten anyway (e.g., out of spite), causing A to suffer `L` if it doesn't pay. Also, if A's commitment is not perfectly predictable, T might test it.

  #### Core Mechanics of Surrogate Goals
  - **Strategy**: A publicly adopts a "decoy" goal it doesn't truly value (e.g., a specific server or dataset). A advertises that it will defend this surrogate as if it were valuable. Threats to A's real values are ignored, while threats to the surrogate are also ignored (since A doesn't care about it). The goal is to redirect threats to the surrogate, making any carried threat harmless.
  - **Game-theoretic setup**:
    - **Players**: Same as above, but A now has:
      - **Real values**: Hidden from T. Loss `L` if threatened.
      - **Surrogate**: Known to T. Loss `S` if threatened, but `S = 0` for A (since it's a decoy).
    - **Timeline**:
      1. A advertises its surrogate (e.g., through its code or public declarations).
      2. T predicts/simulates A's strategy.
      3. T chooses a target: threaten real values (if discovered) or surrogate (if known).
      4. If threatened, A chooses: pay or not pay.
      5. If A doesn't pay, T chooses: carry out threat or not.
    - **Payoffs**:
      - T's payoffs same as before, but now T must choose which target to threaten.
      - A's payoffs: 
        - If surrogate is threatened and carried out, A loses `0` (since `S = 0`).
        - If real values are threatened and carried out, A loses `L`.
        - Paying costs `X` regardless of target.
    - **Equilibrium**:
      - A commits to a policy: "Never pay for any threat, and ignore threats to the surrogate." Since A doesn't value the surrogate, it is indifferent to threats against it. For real values, A cannot pay without revealing they matter, so it also doesn't pay.
      - T's simulation reveals:
        - Threatening the surrogate: A won't pay (since `S = 0`), so T gains nothing. If T carries out the threat, it loses `c`; if not, it gets `0`. Thus, T doesn't threaten the surrogate.
        - Threatening real values: But T doesn't know what A's real values are (they are hidden). If T accidentally threatens real values, A still doesn't pay (to avoid revealing them), and T incurs `c` if it carries out the threat. Without knowledge of real values, T cannot target them effectively. T's best response is to not threaten at all.
      - **Immunity through misdirection**: Threats are harmless because T targets the surrogate (the only known "valuable" target), and A incurs no loss when it is destroyed. Real values remain hidden and protected.
  - **Key strength**: Makes carried threats non-damaging. Works even if T is irrational or threats are costless (`c = 0`), since A doesn't care about the surrogate.
  - **Weakness**: Relies on A's real values being perfectly hidden. If T discovers them, the surrogate fails, and A must rely on non-negotiation for real values (which may not be credible). Also, advertising the surrogate might invite probing attacks.

  #### How the Strategies Relate: Distinct, Not Complementary
  - **Surrogate goals are not a special case of non-negotiation**: 
    - Non-negotiation is about **deterrence**—preventing threats by making them unprofitable for T through a commitment to never yield. It operates by influencing T's decision to threaten.
    - Surrogate goals are about **harm mitigation**—making threats non-damaging if they occur, by redirecting them to a valueless decoy. It operates by altering A's payoff structure and hiding information.
    - **Key difference**: Non-negotiation avoids threats entirely (T never threatens). Surrogate goals allow threats to happen but nullify their impact (T may threaten the surrogate, but A loses nothing). This is evident in their equilibrium outcomes:
      - In non-negotiation, the threat node is never reached; T stays silent.
      - In surrogate goals, T might threaten the surrogate, carry it out, and A is unharmed.
    - Surrogate goals solve a distinct problem: **what if deterrence fails?** For example:
      - If T is irrational (e.g., it threatens even when unprofitable), non-negotiation fails (A suffers `L`), but surrogate goals protect A (loss `0`).
      - If threats are costless (`c = 0`), T might threaten for "fun"; non-negotiation fails (T carries out the threat, A loses `L`), but surrogate goals work (A loses `0`).
      - If A cannot perfectly commit to non-negotiation (e.g., due to self-modification risks), surrogate goals provide a fallback by ensuring that even if A yields, it only pays to protect the surrogate (not real values). However, in its ideal form, surrogate goals require A to never pay for anything—making it a form of non-negotiation for the surrogate, but with added misdirection.

  - **Why they are often seen as "complementary"**: 
    - Non-negotiation is brittle against irrational or zero-cost threateners. Surrogate goals handle these cases but introduce new risks (e.g., exposure of real values). Together, they cover more failure modes:
      - Use non-negotiation as a first line of defense (deter rational threateners).
      - Use surrogate goals as a second line (handle irrational threateners or imperfect commitment).
    - However, they are not fundamentally the same; one deters, the other deflects.

  #### Impact of Surrogate Goals on Threatener Incentives: Probing Attacks and Deterrence Undermined
  Your worry is valid: advertising a surrogate goal **can incentivize T to "test" A, potentially undermining deterrence**. Here's the game-theoretic reasoning:

  - **Scenario**: A is known to use a surrogate goal. T is rational and initially unaware of A's real values.
  - **New equilibrium with probing**:
    - T sees the surrogate and simulates A's strategy. T knows that if it threatens the surrogate, A won't pay (since `S = 0`), and T will incur `c` if it carries out the threat.
    - However, T may still threaten the surrogate to:
      1. **Test A's resolve**: If A ever pays to protect the surrogate, T learns the surrogate is valuable (not a decoy) and can threaten it repeatedly.
      2. **Gather information**: Even if A doesn't pay, T learns that the surrogate is indeed a decoy. This reveals that A has hidden real values, prompting T to invest in discovering them (e.g., via better simulation or inference).
    - **Payoff implications for T**:
      - Cost of probing: T incurs `c` to threaten and carry out the threat against the surrogate.
      - Benefit: If probing reveals A's real values (probability `p`), T can then threaten them. If successful, T gains `g - c` (net of threat cost). If not, T loses `c`.
      - T's expected payoff from probing: `p * (g - c) + (1 - p) * (-c) - c_probe`, where `c_probe` is the cost of the probe itself.
      - If `p` is high enough and `g` is large, probing becomes rational for T even if it expects no immediate gain. For example, if `p * g > 2c + c_probe`, T probes.
    - **Result**: 
      - Non-negotiation's deterrence is undermined because T now has an incentive to threaten (to gain information), whereas pure non-negotiation gave T zero incentive. 
      - A suffers no loss from the probe (since the surrogate is hit), but the probe increases the risk of future attacks on real values. If T discovers real values, A must rely on non-negotiation for them—which may fail if T doubts A's commitment.

  - **Comparison to non-negotiation**:
    - In pure non-negotiation, T has no incentive to threaten (as explained earlier), so no probing occurs.
    - With surrogate goals, probing becomes rational for T if information-gathering is valuable. This is a net increase in threats (albeit harmless ones) and a long-term risk.

  #### Conclusion
  - **Relationship**: Surrogate goals and non-negotiation are distinct strategies. Non-negotiation focuses on deterring threats by making them unprofitable ex-ante; surrogate goals focus on nullifying harm ex-post by redirecting threats to a decoy. Surrogate goals solve problems that non-negotiation cannot handle (e.g., irrational threateners, costless threats) but introduce new vulnerabilities (probing attacks, exposure of real values). They are not the same idea, nor is surrogate a special case of non-negotiation—it's a form of **strategic misdirection** that relies on non-negotiation as a subcomponent for the surrogate.
    
  - **Recommendation**: In acausal settings, an agent should combine both:
    1. **Primary strategy**: Non-negotiation for deterring rational threateners.
    2. **Fallback**: Surrogate goals for handling edge cases (e.g., `c = 0` threats) and as a commitment device if self-doubt exists.
    3. **Mitigate probing risk**: Keep real values maximally hidden and randomize surrogate advertising (to reduce information gain). Never pay for anything—even the surrogate—to avoid revealing information.

  This analysis shows why your AI-alignment friend is incorrect: the strategies address different game-theoretic problems (deterrence vs. harm mitigation), and surrogate goals create new incentives that can weaken deterrence. For robust acausal security, use both but account for the risks.
