  Wait, let me reframe: The surrogate goal strategy is often presented as a way to make the agent immune to threats. The agent doesn't care about the surrogate, so if a threat is made against the surrogate, it won't pay. But if the threat is against the real goals, then the agent might have to pay? But that would break the strategy.

  Therefore, the surrogate goal strategy must be implemented in a way that the agent does not reveal what its real goals are. The threatener doesn't know what the agent really cares about. The agent has publicly declared that it only cares about the surrogate. So when the threatener threatens, it must threaten the surrogate because that's the only thing the agent seems to care about. The agent then doesn't pay (because it doesn't really care) and the threat is carried out on the surrogate. The agent loses nothing.

  But what if the threatener threatens the real goals? The agent hasn't revealed that it has real goals. The threatener doesn't know about the real goals. So the threatener only sees the surrogate goal. Therefore, the threatener can only threaten the surrogate goal.

  This requires that the agent's real goals are hidden. The threatener cannot know what the agent truly values. The surrogate goal is the only visible target.

  ### Step 3: Comparing the two strategies

  - The non-negotiation strategy (commitment) works by making the threat unprofitable: the threatener knows the agent won't pay, so it doesn't threaten.

  - The surrogate goal strategy works by making the threat harmless: the threatener threatens the decoy, and the agent doesn't care if the decoy is harmed.

  However, the surrogate goal strategy relies on the threatener not knowing the real goals. If the threatener can figure out the real goals, then it can threaten those and the agent would be forced to either pay (which it doesn't want) or let the real goals be harmed. So the surrogate goal strategy requires that the real goals are kept secret.

  In contrast, the non-negotiation strategy does not require hiding the real goals. The agent can be open about what it cares about, but it commits to never paying. The threatener then knows that threatening the real goals is pointless because the agent won't pay.

