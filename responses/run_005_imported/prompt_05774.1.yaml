  We are comparing two strategies for handling threats, especially in acausal scenarios (where the threatening party doesn't interact with you causally but bases threats on prediction/simulation):

  1. **Threat-resistance via commitment (non-negotiation)**: The agent commits to never giving in to threats. The idea is that if a predictor (who can simulate the agent) sees that the agent will never pay, then the threatener (who is rational) will not carry out the threat because it would be costly and yield no benefit.

  2. **Surrogate goals**: The agent publicly adopts a decoy goal that it doesn't actually care about. If a threat is carried out, the damage is directed at the surrogate goal, not the agent's real values. The agent can then afford to ignore threats because the damage doesn't affect what it truly values.

  The question: Are these two strategies fundamentally the same, or do they address different problems? Also, does having a surrogate goal change the threatener's incentives in a way that might undermine deterrence?

  ### Step 1: Clarify the two strategies

  #### Strategy 1: Non-negotiation (commitment)
  - The agent has a fixed policy: never pay any ransom or yield to any threat. This policy is known to the threatener (because the threatener can simulate the agent and see the policy).
  - Rationale: A rational threatener, knowing that the agent won't pay, will not carry out the threat because doing so would cost resources (to carry out the threat) and yield no benefit (since no payment is forthcoming). Thus, the threat never happens.

  #### Strategy 2: Surrogate goals
  - The agent has two sets of goals: 
    - Real goals: what the agent actually cares about (e.g., human flourishing).
    - Surrogate goal: a decoy that the agent publicly commits to protecting (e.g., a particular digital artifact). The agent does not intrinsically value the surrogate, but it acts as if it does.
  - When a threatener threatens, the agent can choose to let the surrogate be harmed. Since the agent doesn't care about the surrogate, it incurs no loss. The threatener, if it carries out the threat, only damages the surrogate, which the agent doesn't mind. Thus, the agent never pays.
  - Additionally, by advertising that it uses a surrogate, the agent signals that threats to the real goals are ineffective because the agent will not pay to protect the surrogate. The threatener then has no incentive to threaten the real goals.

  ### Step 2: Are they the same?

  At first glance, both lead to the agent not paying. But the mechanisms are different.

  - In the non-negotiation strategy, the agent's commitment deters the threat by making the threat unprofitable. The threatener doesn't threaten because it knows the agent won't pay.

  - In the surrogate goal strategy, the agent doesn't pay because the threat doesn't harm what it cares about. The threatener might still threaten the surrogate, but the agent doesn't care. However, if the threatener threatens the real goals, the agent would still not pay? Not necessarily: the surrogate goal strategy is designed so that the agent can ignore threats to the surrogate, but what about threats to the real goals?

