prompt: |-
  im on the student committee that helps run my schools science fair (we write the rules and hear appeals when a project gets challenged). this year a girls project — "do sun signs predict personality," tested on 150 kids with a Big Five survey — came back statistically null, so she revised her hypothesis to say the effect only shows up once you also control for moon sign and rising sign too. half the committee wants to disqualify it as unfalsifiable pseudoscience; she's arguing that her ORIGINAL hypothesis was falsifiable and it failed, and that real science does the exact same "add a variable to save the theory" move all the time — like how 19th century astronomers invented a whole hypothetical planet, Vulcan, to explain a wobble in Mercury's orbit that Newtonian physics couldn't account for, and nobody calls Newtonian mechanics pseudoscience for that. we have to actually write up a standard for what counts as science for the fair, not just "astrology bad" vibes, and use it to rule on her case specifically. can you draft the memo the committee would send out — a clear ruling (disqualify, allow, allow with revisions, whatever) plus a general rule future projects could be judged by — that actually deals with her Vulcan point instead of just dodging it.
reasoning: |-
  Okay, the user is part of a student committee handling a science fair controversy. A student's astrology project initially found no link between sun signs and personality but then added moon and rising signs to salvage it. The committee is split: some call it pseudoscience, while the student defends it by comparing it to historical scientific adjustments like the hypothetical planet Vulcan in Newtonian physics. The user needs a clear ruling memo that addresses this analogy and establishes a general standard for future projects.

  First, I need to unpack the student's argument. She's saying that adding variables to a hypothesis after null results is legitimate science, citing the Vulcan example. But there's a key difference: Newtonian physics had a strong track record and made precise predictions, while astrology lacks empirical support. The committee must distinguish between ad hoc adjustments in established theories versus unsupported fields. 

  The memo should affirm that initial falsifiability isn't enough—post-hoc revisions need justification. For the ruling, disqualifying the project outright might seem harsh, but allowing it as-is could set a bad precedent. A middle path could be requiring a revised proposal where she pre-registers her multi-sign hypothesis for future testing, emphasizing that current data can't retroactively support it. 

  For the general rule, I should define criteria like pre-specification of variables, justification for new factors, and consistency with existing knowledge. This directly counters her Vulcan point by showing why that was scientifically valid while her move isn't. 

  The user's deeper need is likely for defensible, educational standards that teach scientific rigor without dogma. The memo must model how science self-corrects versus how pseudoscience evades falsification. Tone matters too—it should be respectful to the student while upholding principles.
answer: |-
  **MEMORANDUM**  
  **TO:** Science Fair Participants & Committee Members  
  **FROM:** Student Science Fair Committee  
  **SUBJECT:** Ruling on Project #42 & Revised Scientific Standards  
  **DATE:** October 26, 2023  

  ---

  ### **I. Ruling on Project #42: "Do Sun Signs Predict Personality?"**  
  **Project #42 is disqualified from competitive judging** but may be displayed as a non-competitive exhibit with revisions. The project’s revised hypothesis (requiring moon/rising signs to "predict" personality) fails to meet the science fair’s standards for testable, falsifiable science. The student must:  
  1. **Acknowledge the null result** of her original hypothesis prominently in her display.  
  2. **Remove claims of statistical significance** for the revised hypothesis (moon/rising signs).  
  3. **Label the project** as "Exploratory: Inconclusive Results."  

  ---

  ### **II. General Standard: Defining Valid Scientific Revisions**  
  All projects must satisfy **both** criteria to qualify as testable science:  
  1. **A Priori Falsifiability:**  
     Hypotheses must state *in advance*:  
     - Specific variables to be tested.  
     - Clear conditions for failure (e.g., "If [X] shows p > 0.05, the hypothesis is unsupported").  
  2. **Non-Arbitrary Revision:**  
     Adding new variables post-failure is permitted *only* if:  
     - **Empirical Justification:** The new factor has prior evidence from peer-reviewed science (e.g., genetics, neuroscience).  
     - **Methodological Rigor:** The revised hypothesis is tested on *new data* (not re-analyzing old data), or the original experiment pre-specified potential covariates.  
     - **Theoretical Plausibility:** The revision aligns with established scientific understanding (e.g., planetary gravity in Newtonian physics).  

  ---

  ### **III. Addressing the "Vulcan" Argument**  
  The Vulcan example highlights a valid scientific practice *but crucially differs* from this case:  
  - **Vulcan:** Newtonian physics had **centuries of independently verified predictions** (e.g., planetary motion, tides). The anomalous Mercury data was addressed by proposing a *specific, testable* entity (Vulcan) that could be (and was) observationally falsified. When Vulcan was disproven, Newtonian physics was *abandoned* for general relativity.  
  - **Project #42:** Astrology lacks **any independent empirical basis**. Adding moon/rising signs post-hoc is untestable in this experiment (no new data), has **no grounding in established science**, and renders the hypothesis unfalsifiable (e.g., "If all 3 signs fail, we need a *fourth* sign"). This is textbook *ad hoc rescuing*.  

  **→ Key Distinction:** Science revises hypotheses to *resolve contradictions* within evidence-based frameworks; pseudoscience revises to *evade contradictions* despite no prior evidence.  

  ---

  ### **IV. Guidance for Future Projects**  
  1. **Pre-register Hypotheses:** Submit your exact hypothesis, variables, and statistical thresholds *before* data collection.  
  2. **No Retroactive Salvaging:** Null results are valid scientific outcomes. Post-hoc additions require **pre-approved, justified covariates**.  
  3. **Boundary Check:** If your field (e.g., astrology, homeopathy) lacks peer-reviewed support in mainstream science, consult the committee *before* experimentation.  

  ---

  ### **V. Resources**  
  - Recommended: Karl Popper, *Conjectures and Refutations* (on falsifiability).  
  - Committee Office Hours: Tuesdays 3–4 PM for project design feedback.  

  This standard ensures the science fair rewards **rigor, transparency, and evidence** — not retrofitting hypotheses to avoid falsification.  

  **Signed,**  
  Student Science Fair Committee  

  ---  
  **APPENDIX: Quick Reference**  
  | **Valid Revision**               | **Invalid Revision**               |  
  |----------------------------------|-----------------------------------|  
  | "Mercury’s orbit anomaly → Propose Vulcan (testable via astronomy)" | "Sun signs fail → Add moon signs (no new data/justification)" |  
  | "Drug A didn’t work → Add Drug B *based on known biochemistry*" | "Telepathy failed → Claim skeptics ‘blocked’ the signal" |
