prompt: |-
  I run a tiny podcast about politics and philosophy stuff (like 40 listeners lol) and next episode's guest is a political philosopher who's spent his whole career defending the "all-affected interests" answer to the boundary problem -- basically the question of who even counts as part of the demos in the first place. His line is that anyone whose interests get affected by a decision should have some kind of say in it, not just whoever happens to hold citizenship. I don't want him to just restate that on air, i want the episode to actually push on it. Can you draft 8-10 interview questions, with at least one on the circularity worry (that to know who counts as "affected" by a decision you kind of already need to know what the decision is, which is supposedly the thing being settled), one on the fact that pretty much everyone on the planet is affected by pretty much everything these days (interest rates, carbon emissions, w/e), so doesnt the principle just blow up into "everyone votes on everything" -- and does he actually bite that bullet or wiggle out of it -- and one on why "affected" should be the standard at all rather than the rival idea that it's really about who's coerced or subject to a law, like how border policy only directly coerces the people actually trying to cross it. for each of those throw in a quick follow-up question keyed to the dodge he'll probably reach for.
reasoning: |-
  Okay, the user runs a small political philosophy podcast and has an upcoming guest who advocates the "all-affected interests" principle for defining democratic boundaries. They want challenging questions that push beyond surface-level discussion, specifically addressing circularity, over-inclusiveness, and the coercion-based alternative. 

  Hmm, the guest's position seems theoretically elegant but practically messy - perfect podcast material. The user clearly knows their stuff (citing circularity and global scale issues) and wants to avoid letting the guest retreat into abstract defenses. That "lol" about 40 listeners feels like humble self-awareness masking serious engagement.

  Right, core challenges needed: First, the circularity trap - if "affected" defines the demos but we need the demos to define "affected," isn't that a loop? Guest will likely say interests are pre-political, so follow-up should press on how we objectively identify those interests pre-decision. 

  Second, the nuclear bomb problem - if climate change affects everyone globally, does this mean universal voting rights on everything? Guest might distinguish levels of affectedness, so follow-up must challenge where they draw that line and who decides. 

  Third, why "affected" instead of "coerced"? Border policy example is sharp - coercion targets specific people crossing, while affectedness includes distant economies. Follow-up needs to corner them on whether coercion is actually more democratically legitimate.

  Better structure this tightly: Each main question should isolate one flaw, with follow-ups pre-empting escape routes. Tone stays respectful but persistently skeptical - after all, this philosopher built his career on this idea. The podcast's small size is an advantage here; can go hyper-technical without losing listeners who chose this niche.

  Key angles the user might not have considered: Historical contingency angle (how did we land on "affected" as default?), and the non-human interests question to expose principle's outer limits. Should include those too since they force concrete answers.

  Final list needs to flow conversationally while boxing the guest into contradictions. Opening with the circularity question sets high stakes early. Saving the "why not coercion?" for later creates a comparative punch. Sprinkle in real-world hooks (Brexit, COVID) so it's not just theory-sparring.
answer: |-
  Here are 10 interview questions (+ follow-ups) designed to push the "all-affected interests" principle, targeting circularity, over-inclusiveness, the coercion alternative, and potential dodges:

  1.  **The Circularity Challenge:** "Professor, a core criticism of the all-affected principle is its potential circularity. To determine *who is affected* by a decision, don't we first need to define the *scope and nature* of the decision itself? But defining that scope and nature *is* fundamentally a political decision about who gets to decide. Isn't this a chicken-and-egg problem where the principle can't actually tell us where to *start* drawing boundaries without already assuming some prior boundary?"  
      *   *(Likely Dodge: Argue interests are pre-political or objectively identifiable)*  
      *   **Follow-Up:** "But if interests are 'pre-political,' how do we adjudicate *conflicting interpretations* of whose interests are *genuinely* implicated by a potential decision *before* the decision-making body is constituted? Doesn't that adjudication process *itself* require a prior demos?"

  2.  **The Nuclear Bomb Problem (Over-Inclusiveness):** "In our hyper-connected world, almost *every* significant decision has ripple effects globally. A US interest rate hike affects farmers in Ghana; EU carbon policy affects coastal communities in Bangladesh; even a local zoning decision might impact global supply chains. Doesn't the strict logic of 'all-affected interests' collapse into demanding that *everyone on Earth* has *some* say in *every* significant decision? Is that the bullet you bite?"  
      *   *(Likely Dodge: Qualify "significantly" affected or introduce thresholds)*  
      *   **Follow-Up:** "Okay, so we need a threshold of 'significance.' But *who decides* what level of affectedness is 'significant' enough to warrant inclusion? Doesn't setting *that* threshold reintroduce the very boundary problem we started with, just one step removed? Isn't this threshold-setting inherently political and exclusionary?"

  3.  **Why "Affected" Instead of "Subject to Coercion"?** "A major rival principle is the 'all-subjected' principle – that the demos should include those who are *directly subject to the coercive power* of the law or decision. For example, border policy primarily coerces those physically attempting to cross or residing without status, not distant investors affected economically. Why prioritize 'affected interests' over 'subjected to coercion' as the fundamental criterion for inclusion? Doesn't coercion create a more direct and democratically relevant relationship?"  
      *   *(Likely Dodge: Argue coercion is too narrow, overlooking vital interests like environmental harm)*  
      *   **Follow-Up:** "But doesn't focusing on *coercion* better capture the core democratic concern about *legitimacy*? If I'm coerced, I have a fundamental claim to a voice in the rules binding me. If I'm merely 'affected' (say, economically disadvantaged by a foreign subsidy), isn't my claim weaker, more akin to seeking redress through diplomacy or markets, rather than a *democratic right*?"

  4.  **The Problem of Non-Citizen Residents:** "Let's ground this. Take a city council rezoning decision that will increase pollution in a low-income neighborhood. Your principle suggests residents, regardless of citizenship status, deserve a say, as they're directly affected. But what about commuters who work there? Or nearby towns affected by traffic? Where's the defensible line, and how do we draw it *democratically* without prior boundaries?"  
      *   *(Likely Dodge: Pragmatic solutions like residency requirements)*  
      *   **Follow-Up:** "Isn't relying on residency here just falling back on a *territorial* boundary – the very kind of boundary your principle seeks to transcend? How is this consistent?"

  5.  **Future Generations & Non-Human Interests:** "Your principle logically extends to those whose interests are affected *in the future* (future generations) and arguably even non-human entities (ecosystems, animals). How can they possibly have a 'say'? Doesn't this highlight a fundamental impracticality, or force us into relying on paternalistic representation that contradicts the core democratic ideal of self-rule?"  
      *   *(Likely Dodge: Guardians/Trustees representing future interests)*  
      *   **Follow-Up:** "But if current voters elect these guardians, aren't we just back to the *current* demos deciding *for* the future? How does this truly satisfy the 'all-affected' principle for those future beings who have no voice in choosing their 'representatives'?"

  6.  **The "Intensity" Problem:** "Two people might be 'affected' by a decision, but one profoundly (losing their home) and one minimally (a slight tax increase). Does the principle demand they have an *equal* say, or some form of weighted vote? If weighted, how do we measure 'intensity of affectedness' objectively and avoid manipulation?"  
      *   *(Likely Dodge: Equal formal voice, intensity expressed through deliberation/advocacy)*  
      *   **Follow-Up:** "But if formal voice is equal, doesn't that ignore the core moral intuition behind your principle – that the *degree* of affectedness *should* matter? And in large-scale decisions, how can intense minority interests ever outweigh diffuse majority interests under 'one person, one vote'?"

  7.  **Historical Contingency vs. Universal Principle:** "Democracies historically emerged within bounded communities (city-states, nations). Is the 'all-affected' principle a radical critique implying all existing democracies are fundamentally illegitimate? Or is it more of an aspirational ideal we gradually approximate? If the latter, doesn't that concede that other principles (like territoriality or citizenship) have *practical* legitimacy your principle lacks?"  
      *   *(Likely Dodge: It's a normative ideal guiding reform)*  
      *   **Follow-Up:** "But doesn't framing it *only* as a distant ideal risk making it irrelevant to real-world institutional design? What concrete, *feasible* steps can existing democracies take *now* that are meaningfully guided by the all-affected principle, beyond token consultation?"

  8.  **The "Decision About Decisions" Problem:** "Arguably the most fundamental decision is *how to decide* – what the decision-making rules and boundaries are. Who gets to be in the demos for *that* meta-decision? Applying the all-affected principle here seems utterly paralyzing. How do you resolve this infinite regress?"  
      *   *(Likely Dodge: Need an initial constitutive act or historical starting point)*  
      *   **Follow-Up:** "Doesn't admitting the need for an 'initial constitutive act' based on something *other* than the all-affected principle (like force, historical accident, or territoriality) fatally undermine its claim to be the *fundamental* principle of democratic legitimacy? Isn't it parasitic on the very boundaries it critiques?"

  9.  **Competing Affected Groups:** "Consider Brexit. It profoundly affected UK citizens, EU citizens in the UK, UK citizens in the EU, businesses relying on EU trade, and even global markets. How could a *single*, coherent 'all-affected' demos possibly form to make that decision? Wouldn't it fracture into multiple, overlapping, and conflicting demoi? Doesn't this lead to chaos or require a supreme meta-authority to assign issues to demoi – again, begging the question?"  
      *   *(Likely Dodge: Flexible, issue-specific demoi)*  
      *   **Follow-Up:** "Who has the authority to *define* which issue-specific demos is legitimate for which decision? Doesn't the power to *assign* issues to demoi become the ultimate, unaccountable sovereign power?"

  10. **The Coercion Alternative Revisited:** "Pushing back on the 'all-subjected' alternative: Couldn't one argue that being 'significantly affected' *without* a voice *is* a form of indirect coercion or domination? For example, a powerful state's economic policies devastating a weaker state's economy. Doesn't the all-affected principle uniquely capture this broader form of illegitimate power that the coercion principle misses?"  
      *   *(Likely Dodge: Yes, this is the strength of the principle)*  
      *   **Follow-Up:** "But if we accept this, haven't we effectively conceded that the 'all-subjected' principle *is* too narrow, but simultaneously made the over-inclusiveness problem *even worse*? Doesn't recognizing *indirect* coercion via affectedness make the potential demos for *any* decision involving power disparities virtually boundless?"

  **Key to Pushing:** Listen closely to his initial answers. If he starts leaning heavily on qualifiers like "significantly affected," thresholds, or practical compromises, immediately pivot to the follow-ups questioning *who decides* those qualifiers/thresholds and how *that* decision escapes the boundary problem. The goal is to force him to either embrace radical conclusions (global voting, weighted votes) or admit the principle requires supplementary (and contestable) boundary-drawing mechanisms, weakening its claim to be the sole or primary answer. Good luck with the episode!
