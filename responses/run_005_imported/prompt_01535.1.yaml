  For their third concern: the disanalogy isn't fatal but needs nuance. Truth iteration is genuinely vacuous while relating layers aren't - R(a,b) does feel more substantive than "it's true that p". The user could counter by arguing that once we accept R's existence, higher-order "relatings" are indeed trivial. But this requires showing why R's existence isn't itself brute.

