answer: |-
  Here's a joke tailored to the philosophical nuances, followed by a concise explanation:

  **Joke:**  
  *A CDT agent, an EDT agent, and an FDT agent are stranded in the desert. A driver offers a ride to town if they promise to pay $100 upon arrival. The CDT agent says, "Once I’m in town, paying won’t *cause* me any harm, so I’d keep the $100." The EDT agent adds, "And paying would be *evidence* I’m a sucker, since I’m already safe!" The driver leaves them behind.  
  The FDT agent then says, "I’ll pay you in town." The driver asks, "Why? Once you’re safe, what’s the point?"  
  The FDT agent replies: **"Because if I *wouldn’t* pay, I wouldn’t *be* the type of agent you’d rescue. And this conversation wouldn’t be happening in the first place."**  
  The driver nods: "Finally, someone who gets it!"  

  **Explanation:**  
  *Functional Decision Theory (FDT) chooses actions based on the output of an optimal decision rule—committing to pay ensures you’re the "type" that gets rescued, while CDT and EDT’s "rational" refusal in town guarantees they’re stranded.*

  ### Why it works:
  - **Punchline** hinges on FDT’s counterfactual reasoning ("if I *wouldn’t* pay, this conversation wouldn’t happen"), contrasting CDT/EDT’s myopic focus on the in-town moment.
  - **Accuracy**: Correctly reflects why CDT/EDT agree on not paying once safe (no causal benefit/evidence of foolishness), and how FDT escapes by pre-committing to a decision rule.
  - **Depth**: Unfunny without understanding the theories—it requires knowing *why* CDT/EDT fail here.
  - **Brevity**: Sets up the puzzle quickly for your presentation.
