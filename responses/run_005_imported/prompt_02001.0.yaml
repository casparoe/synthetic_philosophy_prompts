answer: |-
  ## Dialogue: The Stakes Mismatch

  **Characters:**  
  *   **Cassandra (Epistemic Contextualist):** Sharp, analytical, emphasizes linguistic practice and speaker context.  
  *   **Pax (Pragmatic Encruacher):** Intense, principled, focuses on the subject's epistemic relation to the truth.  

  **Setting:** A quiet corner of the university coffee shop, the morning after the seminar.  

  **(The dialogue begins mid-discussion, Pax sketching a scenario on a napkin.)**

  **Pax:** ...So, take Hannah-in-High-Stakes: mortgage payment due Monday, ruin if she misses depositing on Saturday. She has the *same evidence* as before – saw the hours two weeks ago. Now, *Idle Ida*, a bystander who couldn’t care less about banks or Hannah, casually remarks, "Hannah knows the bank is open Saturday." According to *your* contextualism, Cass, what Ida says is... true? Because *Ida’s* context sets the standard?

  **Cassandra:** Precisely. Ida’s utterance occurs in a context where the practical stakes concerning the bank’s hours are minimal *for her*. The semantic value of "knows" in *her* mouth is fixed by *her* conversational context. The standard for knowledge is correspondingly low. Given Hannah’s evidence – seeing the hours recently – Hannah easily meets that low standard relative to Ida’s context. So, "Hannah knows" is true *as uttered by Ida*.

  **Pax:** That’s deeply counterintuitive! Hannah is *sweating bullets*, practically paralyzed by doubt because so much rides on it. Her evidence *feels* suddenly inadequate *to her* in that high-stakes situation. How can Ida, blithely unaware, correctly say Hannah *knows* when Hannah herself, in the thick of it, would rightly deny knowing? It renders Hannah’s own sincere, high-stakes self-denial *false* according to Ida’s low bar? That seems to disrespect the phenomenology of high-stakes inquiry.

  **Cassandra:** It respects the *linguistic* phenomenology. We *do* attribute knowledge to others based on evidence we deem sufficient *from our perspective*, even if they are in a high-stakes situation we’re ignoring. Imagine Ida saying, "Relax, Hannah, you *know* it’s open! You saw the hours!" That sounds perfectly natural. Contextualism explains *why* it sounds natural: "knows" expresses a relation relative to Ida’s contextually low standard. Hannah’s self-denial ("I don’t *know*! It’s too risky!") is also true, but relative to *her* high-stakes context where "knows" demands more. Both utterances express different propositions. The seeming contradiction arises only if we ignore the context-sensitivity.

  **Pax:** But that context-sensitivity is precisely the problem! If "knows" is as obviously context-sensitive as, say, "tall," why don’t competent speakers readily *recognize* and *report* this shift? If I say "Muggsy Bogues is tall" (for a point guard) and "Shaquille O'Neal is tall" (for a human), I know I’m using different standards and can say so. But if I say "Hannah knows in the low-stakes case" and deny "Hannah knows in the high-stakes case," I don’t naturally think I’m *just* shifting the meaning of "knows" like shifting the meaning of "tall." I think Hannah’s epistemic *situation* has changed. Pragmatic encroachment captures that intuition directly: Hannah’s high stakes *themselves* make her evidence insufficient *for knowledge*, full stop. Only *her* stakes matter for whether she knows. Ida’s utterance, if it claims Hannah knows *simpliciter*, is simply *false*, because Hannah *doesn’t* know relative to *her own* required threshold for action.

  **Cassandra:** You accuse contextualism of positing semantic blindness, but your view has its own "strange lights" problem, Pax. According to you, Hannah *loses knowledge* purely because the practical stakes surrounding the *same proposition* with the *same evidence* increase. No new counter-evidence appears, no flaw is discovered in her original evidence or reasoning. The *world* (the bank’s hours, her past observation) hasn’t changed, only the *cost* of being wrong. How can a purely *practical* change, external to the truth-conduciveness of her evidence, rob her of an *epistemic* status like knowledge? That seems to conflate epistemology with decision theory.

  **Pax:** It doesn’t *conflate* them; it *integrates* them! Knowledge isn't just a detached intellectual trophy; it’s the state that warrants confident *action*. What counts as sufficient evidence *for action* depends on what’s at stake *in that action*. In low stakes, her evidence warrants depositing the check Saturday morning. She knows. In high stakes, that *same evidence* no longer warrants *risking ruin* on Saturday morning. She needs more – calling ahead, checking online. Because her evidence doesn’t warrant the high-stakes action, she doesn’t *know* for the purpose of *that* action. Knowledge just *is* the state that makes acting on p appropriate; appropriateness depends on stakes. So yes, stakes shifting *can* change knowledge status without evidence changing, because knowledge is essentially tied to actionability. It’s not strange; it’s how we actually live and reason. Ignoring stakes gives you an inert, intellectualist caricature of knowledge.

  **Cassandra:** But let’s flip the mismatch. Consider *High-Stakes Henry*. He faces personal ruin if *his* bank (different branch) isn’t open Saturday. He’s obsessively gossiping about Hannah in the *low*-stakes case: "Hannah thinks she knows the bank is open Saturday, but she can’t *possibly* know! What if the hours changed?" According to *me*, Henry’s utterance "Hannah doesn’t know" is true *relative to his high-stakes context* – the standard for "knows" is sky-high for him. According to *you*, Pax, Hannah *does* know (low stakes for her), so Henry’s denial is simply false. Yet, given *his* context, his hyper-cautious denial seems… understandable, perhaps even reasonable *for him to express*, even if overstated? Contextualism explains *why* he might say it and why, in his mouth, it’s true. Your view just says he’s wrong, full stop, which seems to miss the expressive function of his denial relative to his own anxiety.

  **Pax:** Henry *is* wrong, Cass. Hannah knows. His high stakes about *his own* situation don’t magically infect *Hannah’s* epistemic standing regarding *her* bank proposition. His utterance is false, even if psychologically explicable by his own anxiety. We explain his utterance pragmatically: he’s expressing that *he* wouldn’t act on Hannah’s evidence given *his* stakes, or that her evidence isn’t *certain*, or that it’s risky *for him*. But none of that makes "Hannah doesn’t know" *true*. Your view makes the truth of a knowledge attribution *about Hannah* hostage to the neuroses or circumstances of the *attributor*. That seems unacceptably subjective and unstable. Knowledge attributions should track the *subject's* relation to the truth and their evidence, calibrated to *their* practical situation, not the attributor’s mood.

  **Cassandra:** But isn't that the point? "Knowledge" *attributions* are linguistic acts performed by speakers *in contexts*. We’re not accessing some Platonic "knowledge-in-itself"; we’re using a context-sensitive term to describe a relation. Your "subject’s relation to the truth" already *includes* the subject’s stakes on your view! So we both tie the *relevant epistemic relation* to practical context – I tie it to the attributor’s context, you tie it to the subject’s. The core difference is *whose context determines the relevant epistemic standard for the truth of the attribution*.

  **Pax:** ...That’s a crucial distillation. So, is our disagreement substantive or verbal? Both theories predict the same truth-values in *simple* bank cases (low-stakes attribution: true; high-stakes attribution: false). They diverge on mismatches. I say the substantive issue is: *What fundamentally determines the threshold for knowledge?* Is it an invariant threshold set by the subject’s practical situation (me), or is it a variable threshold set by the attributor’s conversational context (you)? This isn't *just* about labeling; it’s about what knowledge *is*. If knowledge is the state that warrants *the subject’s* action, the subject’s stakes are constitutive. If it’s a contextually flexible label for meeting evidentiary standards salient to a *speaker*, then the attributor’s context rules. These are different conceptions of the nature of knowledge itself.

  **Cassandra:** I concur. It’s substantive. We agree that practical factors are crucial. We agree that "Hannah knows" can be appropriately asserted in low-stakes contexts and denied in high-stakes contexts. But we disagree fundamentally on *why* this is so. Is it because the word "knows" shifts its meaning (me), or because the subject’s epistemic status itself changes (you)? And consequently, we disagree on what the truth-conditions *depend on* in mismatched cases. This isn’t mere bookkeeping; it reflects a deeper divergence on whether the core epistemic relation is essentially tied to the subject’s practical agency or is a more flexible tool for speakers navigating their conversational purposes. We might map the same core intuitions in simple cases, but the underlying mechanisms – and the predictions in edge cases – reveal a genuine theoretical rift. We haven’t settled it, Pax, but we’ve located it precisely.

  **Pax:** Agreed. The mismatch cases are the litmus test. Your view makes knowledge attributions strangely speaker-centric in a way that feels disconnected from the subject’s predicament. Mine makes knowledge seem oddly fragile, vanishing with shifting fortunes. Neither is perfectly intuitive, but they force us to clarify what we think knowledge *does* and *what work* the concept is for. I still think tying it to the subject's action is more fundamental... but I see why you tie it to the speaker's context. We’re stuck, Cass. But at least we understand *where* we’re stuck.

  **Cassandra:** (Smiling wryly) Progress, then. More coffee? I suspect this napkin isn’t big enough for the next variant...
