prompt: |-
  My grandma died last month, and right before she passed she got me to promise i'd keep sending $200 a month to my cousin, who she'd been quietly supporting for years because he was struggling financially. I said yes, obviously, you don't exactly argue with your dying grandmother. Except I just found out he's actually been doing fine for like two years now and has no clue this promise even exists, so it's not like he's relying on me for anything. Meanwhile I'm pretty broke myself right now. Do I still owe this, even though the whole reason for it is gone and grandma's not around to ask anymore?
