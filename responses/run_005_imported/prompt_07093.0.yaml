answer: |-
  This is such a tough situation, and I'm truly sorry about your grandma. It speaks volumes about your character that you're wrestling with this promise. You absolutely don't *owe* the money in any practical or ethical sense, given what you've discovered. Here's why:

  1.  **The Foundational Reason for the Promise is Gone:** The *sole purpose* of your grandma's support was your cousin's financial struggle. That struggle no longer exists. Sending money now wouldn't fulfill the *intent* of her wish; it would just be a pointless transfer of funds to someone who doesn't need or expect it.
  2.  **Your Grandma's Intent:** Her intent was clearly to help your cousin *because he needed help*. If she knew he was financially stable (and had been for two years), it's highly unlikely she would have asked you to continue sending money. Her goal was his well-being, not the act of sending money itself.
  3.  **Your Own Financial Reality:** You made this promise under duress (who argues with a dying grandparent?) and while likely unaware of the cousin's true situation. You also didn't know your own financial situation would be tight. **Promises, especially ones made under emotional duress or based on incomplete information, need to be re-evaluated when circumstances fundamentally change.** Your own financial stability matters.
  4.  **The Cousin's Ignorance:** He doesn't know about the arrangement, isn't expecting the money, and hasn't budgeted for it. Stopping will cause him zero hardship or disappointment. He won't even notice.
  5.  **The Nature of Promises to the Deceased:** While we feel a deep obligation to honor the wishes of loved ones who have passed, this obligation is rooted in respect for *them* and their *intentions*. Continuing an action that no longer serves its intended purpose doesn't truly honor your grandma's spirit. It becomes an empty gesture driven by misplaced guilt.

  **What You Can Do Instead (Without Sending Money):**

  *   **Honor Her Spirit in Your Own Way:** Find a way to honor your grandma that fits *your* life and values. This could be:
      *   Donating a smaller, manageable amount (even $20) to a charity she cared about each month in her memory.
      *   Volunteering your time for a cause she supported.
      *   Simply living according to the values she instilled in you – kindness, family loyalty (in healthy ways), responsibility.
      *   Planting something in her memory, creating a photo album, or sharing stories about her with family.
  *   **Reframe Your Promise:** Understand that you *did* keep your promise *to her* in the moment, which was incredibly important. The circumstances underlying that promise have fundamentally changed. You are not breaking faith; you are adapting to reality.

  **Practical Steps:**

  1.  **Stop the Payments:** You can stop immediately. There is no practical or ethical need to continue.
  2.  **No Need to Tell Your Cousin (Probably):** Since he doesn't know, telling him might create unnecessary awkwardness or even guilt for him (thinking grandma felt he still needed help when he didn't). Keep this between you and your memory of your grandma, unless there's a compelling reason to share it.
  3.  **Deal with Your Guilt:** Understand that the guilt you feel is natural – it comes from love for your grandma and wanting to be a person of your word. But recognize that this guilt is misplaced. Continuing to send money you can't afford to someone who doesn't need it *isn't* what your grandma truly wanted. Honor her by taking care of yourself and finding meaningful ways to remember her.

  **In short: No, you absolutely do not need to keep sending the money.** The conditions that made the promise necessary and meaningful no longer exist. Your grandma's wish was for your cousin to be supported *in his need*. That need is gone. Honor her memory by taking care of yourself and finding positive ways to keep her spirit alive that don't cause you financial hardship. You made a loving promise in a difficult moment, but circumstances have changed entirely. It's okay, and actually the right thing, to stop.
