  The Wallis debacle is revealing. Hobbes insisted his circle quadrature was sound despite evidence, exposing his blind spot: mistaking *persuasive* rigor for *logical* rigor. He thought declaring definitions made them axiomatic. Similarly, Leviathan's "deductions" often rely on unstated premises (e.g., equating natural liberty with perpetual war). 

  The disanalogy? Euclid's postulates are minimal and generative; Hobbes's definitions are maximal and prescriptive. A critic *should* attack his psychology because it's not a true postulate but a contested starting point smuggled in as "self-evident." The vulnerability lies in both the derivation's logic *and* the definitions' plausibility—unlike geometry, where rejecting "two points define a line" just creates a different geometry. 

