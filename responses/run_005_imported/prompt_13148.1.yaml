prompt: |-
  A friend and I spent a long evening arguing about Aquinas's position on tyrannicide, and we ended up agreeing on a reading that neither of us could fully defend under further questioning: since Aquinas holds that a ruler who governs for his own advantage rather than the common good has thereby forfeited the legitimacy of his rule, he must be granting ordinary subjects a standing right to kill such a ruler on their own initiative -- which is presumably why he is cited as a forerunner of later Jesuit resistance theorists such as Mariana and Suárez. Yet Aquinas is elsewhere adamant that no private person may inflict death on anyone, however guilty, by his own authority, reserving that power to whoever bears public responsibility for the community's welfare. Why does he treat tyranny as the one case in which this otherwise near-inviolable restriction does not hold?
reasoning: |-
  Okay, the user and their friend are wrestling with Aquinas's stance on tyrannicide. They've concluded that Aquinas allows ordinary subjects to kill a tyrant because the ruler forfeits legitimacy by governing for personal gain. But they're confused because Aquinas elsewhere insists only public authorities can execute anyone. So why the exception for tyrants?

  First, I need to recall Aquinas's key texts. In *De Regno*, he says a tyrant forfeits legitimacy. In the *Summa*, he states only public authority can kill. The apparent contradiction needs resolution. The user mentions Jesuit theorists like Mariana and Suárez citing Aquinas, which adds historical context.

  The user's explicit question is about why tyranny is an exception. But their deeper need might be understanding Aquinas's consistency or his influence on later resistance theories. They might also be interested in medieval political philosophy's nuances, especially regarding authority and rebellion.

  Looking at Aquinas's actual position: he doesn't explicitly endorse private tyrannicide. The forfeiture of legitimacy means the ruler loses the right to rule, but removing them isn't necessarily a private act. Aquinas prefers public mechanisms like a superior authority or the community acting collectively. The user might have missed the distinction between forfeiture and the method of removal.

  Also, Aquinas's conditions for rebellion are strict. He warns against the dangers of revolt, which could lead to worse tyranny. His emphasis is on prevention and lawful removal. The user's assumption that forfeiture implies a right for any subject to kill might be an overextension. Aquinas reserves execution to proper authorities, even in tyranny cases.

  The user's confusion might stem from conflating legitimacy forfeiture with the right to execute. Aquinas separates these: losing legitimacy doesn't automatically grant private individuals execution rights. The community must act through due process or higher authorities.

  Influence on Jesuits: later theorists expanded on Aquinas, but he was more cautious. The user might be projecting later ideas back onto Aquinas. Clarifying his actual versus perceived stance is key.

  So, the user needs a breakdown of Aquinas's nuanced position, distinguishing between loss of legitimacy and the prescribed methods of removal. Highlighting his preference for authoritative action over private initiative and his conditions for rebellion. Also, addressing why tyranny is a special case without violating his principle that only public authority can kill.
answer: |-
  Your question cuts to the heart of a complex tension in Aquinas's political thought. While it's tempting to see him endorsing private tyrannicide based on the ruler's forfeiture of legitimacy, **Aquinas does not explicitly grant ordinary subjects ("private persons") a standing right to kill a tyrant on their own initiative.** The resolution lies in understanding the nuanced relationship between forfeiture, authority, and *who* acts to remove the tyrant. Here's a breakdown:

  1.  **The Forfeiture of Legitimacy:**
      *   You are correct that Aquinas argues a ruler who governs for his own private advantage rather than the common good becomes a tyrant and "forfeits the claim to be obeyed" (Summa Theologiae I-II, Q. 96, A. 4). This ruler is acting unjustly, violating the very purpose of political authority (the common good).
      *   **Key Point:** This forfeiture means the ruler *loses the right to rule*. It does not automatically grant a *positive right to kill* to any specific individual.

  2.  **The Prohibition on Private Killing:**
      *   Aquinas is unequivocal: "It is in no way lawful to slay the innocent. But in the case of the guilty, it is lawful for the public authority, to whom is entrusted the administration of justice, to put evildoers to death... But a private person may not do this" (ST II-II, Q. 64, A. 3). He grounds this in natural law – the care of the common good is entrusted to public authority, not individuals acting alone.

  3.  **Resolving the Tension: Who Acts Against the Tyrant?**
      *   Aquinas does *not* treat tyranny as an exception where a private person can inflict death. Instead, he provides avenues for removal that *preserve the principle of public authority*:
          *   **Action by a Superior Authority:** "If to provide itself with a king belongs to the right of a given multitude, it is not unjust that the king be deposed or have his power restricted by that same multitude if, becoming a tyrant, he abuses the royal power" (De Regno, I, 6). This could be a higher political authority (like an emperor over a king) or the community itself *acting collectively* through its established structures or representatives. The action is framed as a *public* act of justice, removing someone who has ceased to be a legitimate ruler.
          *   **Community Action (Collectively, Not Privately):** When Aquinas talks about the "multitude" acting, he envisions it acting *as a body politic*, not as a collection of individuals taking private vengeance. This collective action could involve formal deposition, refusal to obey unjust commands, or potentially defensive rebellion. Crucially, **even in rebellion, the action needs to be understood as a public act undertaken *for* the common good, not a private execution.** The *authority* to act flows from the community's inherent right to self-preservation and just governance when its legitimate ruler has abdicated that role.
          *   **No License for Individual Assassination:** Aquinas explicitly warns against the dangers of private action: "The dangers which may arise from rebellion are more grievous than the evils inflicted by tyranny... Moreover, the tyrant himself may become worse" (Commentary on the Sentences II, d. 44, q. 2, a. 2). He fears anarchy and the potential for worse tyranny emerging from chaotic revolt. His preferred solution is *always* a lawful, public process where possible.

  4.  **Why Tyranny is "Special" (Without Violating the Principle):**
      *   Tyranny is the *condition* that triggers the forfeiture of legitimacy. This creates a unique situation:
          *   The *source* of public authority (the ruler) has become illegitimate.
          *   The *purpose* of public authority (the common good) is being actively undermined.
      *   **This doesn't suspend the principle that only public authority can inflict death. Instead, it forces a reversion:** The ultimate source of political authority resides in the community for the sake of the common good (De Regno I, 1). When the designated ruler becomes a tyrant, the authority *reverts* to the community itself to act in its own defense and restore just order.
      *   **The action against the tyrant is therefore *not* a private execution by an individual.** It is an act of:
          *   **Public Justice:** Administered by the community (or its designated representatives/superiors) against one who has grossly violated the public trust.
          *   **Defense of the Commonwealth:** Analogous to killing an unjust aggressor in self-defense. Aquinas allows individuals to kill in self-defense *when necessary* (ST II-II, Q. 64, A. 7), but emphasizes the intention must be defense, not killing. Applied collectively, a community defending itself against the aggression of its own tyrannical ruler *could* result in the tyrant's death, but the *authority* for the act stems from the community's right to self-preservation, not an individual's right to punish.

  5.  **Connection to Later Theorists (Mariana, Suárez):**
      *   Aquinas *is* a foundational figure for resistance theory because he established the crucial principles:
          *   Government exists for the common good.
          *   Rulers who persistently violate this purpose forfeit legitimacy.
          *   The community (or its representatives) has the right/responsibility to resist and depose such rulers.
      *   **The Difference:** Later Jesuit theorists like Mariana and Suárez developed these ideas more explicitly and sometimes more radically. Mariana, notoriously, *did* argue that a private citizen could assassinate a tyrant *if* all other avenues (public authority, representatives, council) had failed, framing it as a last-resort act of public service. **This goes significantly beyond Aquinas's explicit statements.** Aquinas emphasized collective, public action and warned against the dangers of private initiative. Suárez developed more detailed theories about the specific mechanisms of popular sovereignty and resistance.

  **Conclusion:**

  Aquinas resolves the apparent contradiction not by making tyranny an exception to the rule that only public authority can kill, but by redefining who possesses public authority in the extreme case of tyranny. The tyrant's forfeiture means the authority reverts to its source – the community acting collectively or through its established structures (or a superior authority). The killing of a tyrant, if it occurs, is not a private act of vengeance by an individual, but a public act of justice or collective self-defense undertaken by the community *as a body politic* exercising its inherent authority to preserve itself and the common good. This preserves his core principle while acknowledging the unique crisis of tyranny. His influence on later resistance theorists stems from his foundational principles of forfeiture and the community's ultimate authority, even if they sometimes extended his logic further than he explicitly did, particularly regarding private action.
