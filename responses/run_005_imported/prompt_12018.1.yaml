prompt: |-
  so this has been bugging me for like two years now and i finally wanna ask someone who isn't my mom about it lol. my grandpa died when i was in 9th grade, and about a week before he passed he grabbed my hand from his hospital bed and made me promise i would never sell his old fishing boat, no matter what happens. he was really emotional about it (so was i, tbh) so i just said yes without actually thinking it through. now the boat just sits in a marina costing my family around $800 a year in fees, nobody in the family has touched it once since he died, and i could really use that money for college application fees since im a junior now. my mom's whole argument is that since he's gone and will never find out either way, selling it literally cant hurt him anymore, so me refusing is just me being stubborn for no real reason. and its not like anyone else would judge me or lose trust in me if i sold it either, no one in my family besides my mom even remembers the promise happened. that logic kinda checks out when i think about it, but it still feels like i'd be doing something wrong if i sold it, and i genuinely can't figure out who exactly i'd be wronging, since there's no one left to even be disappointed in me.

  i brought it up with my friends and one of them said its basically no different from breaking a promise to yourself, like a new years resolution, since neither one "affects anyone else" if you think about it that way. that comparison didn't really sit right with me though, it feels like something real got created back in that hospital room that shouldn't just disappear the second he stopped existing, but i can't explain why not. we're doing a short unit on ethics in my philosophy elective right now but nothing we've covered maps onto this directly, so im stuck trying to reason it out on my own. is my mom basically right that the promise stopped meaning anything the moment he died, or is there an actual case for why it would still hold, and if so, why?
