prompt: |-
  So I've been in a running argument with a friend from my meetup about the two-envelope paradox for like three weeks now (I know, we need better hobbies). You know the setup: two envelopes, one has twice the money of the other, you open yours and see $X, and there's the classic tempting argument that the other envelope has 0.5(2X) + 0.5(X/2) = 1.25X in expectation, so you should always switch. Everyone who's read the standard writeups (SEP, the wikipedia page, a dozen LW comment threads) gives basically the same resolution: that argument secretly needs a prior over the smaller amount such that P(other = 2x | you see x) = 1/2 for literally every possible x, and no proper prior can satisfy that for every x, so the step is just invalid. Fine, I buy that. But that resolution is explicitly about the version where you peek and see a specific x. There's a second "you don't even have to open the envelope" version of the argument — just call the amount in your envelope A, note the other one is 2A or A/2 with probability 1/2 each by symmetry, and take E[other] = 1.25 E[A] — and that version never mentions a prior at all, so "no proper prior exists" can't be the whole story for it.

  Here's my attempt at untangling that second version, and I'd like a sanity check before I write it up properly on my blog. My guess is that the symbolic version smuggles in the assumption that E[A | my envelope happens to be the smaller one] equals the plain unconditional E[A] — i.e., that learning you hold the smaller pile shouldn't move your estimate of your own pile at all. That's false for basically any actual distribution: if L is the smaller amount and H = 2L the larger, then unconditionally E[A] is a 50/50 mix of E[L] and E[H], so E[A] = 1.5 E[L], while E[A | smaller] is just E[L], i.e. (2/3)E[A]. Push that correction through instead of the naive substitution and E[other] comes out to exactly E[A] every time, for any proper prior over L with finite mean — no impropriety required anywhere in the derivation.

  What I can't decide is whether that's a genuinely seperate bug from the "no proper prior makes it 1/2 for every x" story, or secretly the same fact wearing a different hat. When I worked a concrete case (L uniform over {1,2,4,...,2^N} for some big but finite N, so definitely a proper prior) the naive "50/50 no matter what you see" claim actually holds EXACTLY at every interior value of x, and only breaks down at the two boundary values (x=1 and x=2^N, where you know for sure which pile you're holding) — which makes me suspect it's really one phenomenon after all and my "second version" framing is just double-counting the same insight. Could you check the algebra above, tell me honestly whether this is a real distinction or whether I'm fooling myself, and say which of the two framings (impropriety of priors, vs. the conditional-expectation-isn't-the-unconditional-one point) you'd actually lead with if you were explaining this to someone who's already heard the standard "it needs an improper prior" line and found it unsatisfying?
reasoning: |-
  I've been wrestling with this two-envelope paradox with a friend, and I think I've got a handle on it, but I want to make sure I'm not missing something. The standard resolution for when you peek and see a specific amount X is that you need a prior where the probability that you have the smaller or larger envelope is always 1/2, no matter what X you see, and that requires an improper prior. I get that.

  But there's this other version where you don't peek. You just say, let A be the amount in my envelope. By symmetry, the other envelope has either 2A or A/2, each with probability 1/2. So E[other] = (1/2)(2A) + (1/2)(A/2) = (1/2)(2A) + (1/2)(0.5A) = A + 0.25A = 1.25A. Then, since this is true for any A, E[other] should be 1.25 E[A], so switching is better. But that can't be right because it would imply you should always switch, which is absurd.

  I think the flaw here is in assuming that E[A | I have the smaller one] equals E[A] unconditionally. That is, when you condition on which envelope you have, the expectation changes, but in the naive calculation, you're not conditioning properly.

  Let me define L as the smaller amount. Then H = 2L is the larger amount. The two envelopes contain L and H.

  When you pick an envelope at random, A is equally likely to be L or H.

  So unconditionally, E[A] = (1/2) E[L] + (1/2) E[H] = (1/2) E[L] + (1/2) (2 E[L]) = (1/2) E[L] + E[L] = (1.5) E[L]

  Similarly, E[other] depends on what you have.

  If you have the smaller one (A = L), then other is H = 2L = 2A.

  If you have the larger one (A = H), then other is L = H/2 = A/2.

  But to find E[other], we need to average over both cases.

  So E[other] = P(I have smaller) * E[other | I have smaller] + P(I have larger) * E[other | I have larger]

  Since P(I have smaller) = P(I have larger) = 1/2,

  E[other | I have smaller] = E[H | I have smaller] = E[2L | I have smaller]

  But since I have smaller, A = L, so E[2A | I have smaller] = 2 E[A | I have smaller]

  Similarly, E[other | I have larger] = E[L | I have larger] = E[H/2 | I have larger] = (1/2) E[A | I have larger]

  Therefore, E[other] = (1/2) * 2 E[A | I have smaller] + (1/2) * (1/2) E[A | I have larger] = (1/2)(2) E[A | smaller] + (1/2)(1/2) E[A | larger] = E[A | smaller] + (1/4) E[A | larger]

  Now, in the naive argument, they assume that E[A | smaller] = E[A] and E[A | larger] = E[A], but that's not true.

  From earlier, E[A] = 1.5 E[L]

  E[A | smaller] = E[L | smaller] = E[L] because if you have smaller, A = L, so E[A | smaller] = E[L]

  Similarly, E[A | larger] = E[H | larger] = E[2L] = 2 E[L]

  Now, E[A] = 1.5 E[L], so E[L] = (2/3) E[A]

  E[A | smaller] = E[L] = (2/3) E[A]

  E[A | larger] = 2 E[L] = 2*(2/3) E[A] = (4/3) E[A]

  Plug back into E[other]:

  E[other] = E[A | smaller] + (1/4) E[A | larger] = (2/3) E[A] + (1/4)(4/3 E[A]) = (2/3) E[A] + (1/4)(4/3) E[A] = (2/3) E[A] + (1/3) E[A] = (3/3) E[A] = E[A]

  So E[other] = E[A], which makes sense; no advantage.

  In the naive calculation, they did E[other] = (1/2)(2A) + (1/2)(A/2) = (1/2)(2A) + (1/2)(0.5A) = A + 0.25A = 1.25A, but this is conditional on A, and then they took expectation, but incorrectly.

  In that step, A is fixed in the conditional expectation, but when you write E[other] = E[ (1/2)(2A) + (1/2)(A/2) ] = E[1.25 A] = 1.25 E[A], but the issue is that the 1/2 probabilities are not correct when A is fixed, or something.

  In the symbolic version, when you say "the other is 2A or A/2 with prob 1/2", that assumes that for any given A, the conditional probability that you have the smaller or larger is 1/2, but that depends on A.

  In the case where you don't open, A is random, so when you write E[other] = E[ (1/2)(2A) + (1/2)(A/2) ], this is equal to E[1.25 A] = 1.25 E[A], but the expression inside assumes that given A, P(other is 2A | A) = 1/2 and P(other is A/2 | A) = 1/2.

  But P(other is 2A | A) is P(I have smaller | A), and P(other is A/2 | A) is P(I have larger | A).

  The naive argument assumes that for every possible value of A, P(I have smaller | A) = 1/2 and P(I have larger | A) = 1/2.

  But as we know from the peeking version, this can only hold for all x if the prior is improper.

  In the non-peeking version, since we're not conditioning on a specific x, but on A as a random variable, we need that for all values A can take, the conditional probability is 1/2.

  But if the prior over L is proper, then for most values, it might hold, but not for all, and in particular, at the boundaries, it doesn't hold, and that affects the expectation.

