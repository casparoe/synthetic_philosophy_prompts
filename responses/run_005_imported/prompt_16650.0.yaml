  I think for the "don't peek" version, the key point is that the 1/2 probabilities are conditional on A, and for the expectation to hold, we need that conditional on A, P(I have smaller | A) =1/2 almost surely, which in this case holds except at the boundaries, but with proper prior, the set where it doesn't hold has positive probability, so E[other] ≠ 1.25 E[A], but equals E[A].

  In the derivation I had earlier with L, E[other] = E[A | smaller] + (1/4) E[A | larger]

  And E[A | smaller] = E[L], E[A | larger] = E[H] = 2 E[L], E[A] = 1.5 E[L]

  So E[A | smaller] = E[L] = (2/3) E[A]

  E[A | larger] = 2 E[L] = (4/3) E[A]

  Then E[other] = (2/3) E[A] + (1/4)(4/3 E[A]) = 2/3 E[A] + 1/3 E[A] = E[A]

  Whereas if naively E[A | smaller] = E[A] and E[A | larger] = E[A], then E[other] = E[A] + (1/4) E[A] = 1.25 E[A], which is wrong.

  So the bug is the assumption that the conditional expectations equal the unconditional one.

  In the peeking version, the bug is assuming P(I have smaller | I see X) =1/2 for every X, which requires an improper prior.

  But in a way, it's related because if P(I have smaller | X) =1/2 for all X, then E[A | smaller] and E[A | larger] might not be defined or something, but with improper prior, it's messy.

  In the don't peek version, the issue is directly that E[A | smaller] ≠ E[A], etc.

  For explaining to someone who knows the standard resolution, I think it's worth pointing out both.

  In the don't peek argument, it's not that we need an improper prior; even with proper prior, the symbolic manipulation is flawed because of the conditional expectation point.

  And in the concrete case, it holds exactly at interior points, but the expectation is corrected by the boundaries.

  So to answer: yes, there is a distinction, but it's subtle.

  I think for the blog, I can say that the "don't peek" version has a separate flaw: it implicitly assumes that learning which envelope you have doesn't change the expected value, but it does, because if you know you have the smaller, your expected value is less than unconditional, etc.

  And that correction fixes it.

  Whereas the peeking version is about the conditional probability given the observed value.

  Both are about the same underlying issue: the dependence between the amount and which envelope it is.

  In peeking, given X, P(which) may depend on X.

  In don't peek, E[A | which] depends on which.

  So similar.

  But for explanation, I think leading with the conditional expectation point for the don't peek version is good.

  And for someone unsatisfied with "improper prior", showing that even with proper prior, the don't peek argument fails because of this, and it's not about priors but about the conditional probabilities.

  In don't peek, no prior is mentioned, so the resolution is different.

  So I think it's a real distinction in terms of framing.
