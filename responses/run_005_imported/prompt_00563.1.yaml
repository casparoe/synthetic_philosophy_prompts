answer: |-
  Your portrayal of Sidgwick's psychical research journey is central to capturing his profound intellectual and existential struggle. Here are the key implications of the research's progression and failure for his character arc:

  1.  **The Core Motive: Bridging the Unbridgeable:**
      *   **Private Motive:** Sidgwick's quest wasn't morbid curiosity or a fear of death, but a desperate attempt to solve the "Dualism of Practical Reason." His utilitarianism demanded impartial benevolence, yet pure reason couldn't definitively prove that sacrificing self-interest for the greater good was always rational *if* death was annihilation. Immortality (ensuring ultimate harmony between virtue and happiness) was the necessary postulate he *wanted* to empirically verify, not just assume like Kant. This wasn't a hobby; it was the underpinning of his entire ethical project. His motive was intensely private, intellectual, and ethical – a deep-seated need for cosmic justice and rational coherence.
      *   **Portrayal:** Show his research not as eccentricity, but as an extension of his philosophical rigor. Frame his moments of hope (e.g., after a compelling Piper sitting) as glimpses of potential *philosophical salvation*, not just evidence of ghosts. His disappointment is the erosion of the foundation for his ethical system.

  2.  **Discipline Through Disappointment: The Sisyphus of Science:**
      *   **The Research Reality:** Sidgwick co-founded the SPR precisely because he saw the *need* for rigorous methodology amidst the chaos of Victorian spiritualism. He witnessed firsthand:
          *   **Ubiquitous Fraud:** Constant exposure to trickery, conscious and unconscious (e.g., the Creery sisters debacle). Each exposure validated his skepticism but crushed his hope.
          *   **Inconclusive "Phenomena":** Table-turning, raps, materializations – often intriguing, rarely verifiable under strict controls, easily explained by fraud or unconscious muscular action/expectation.
          *   **The "Will to Believe" Problem:** He recognized the powerful human bias towards believing survival evidence, even among researchers (like Myers or Gurney). He constantly fought *against* this bias within himself and his colleagues, demanding ever-higher standards of proof.
          *   **The Piper Paradox:** Leonora Piper was the toughest case. She wasn't exposed as a fraud. Her trances produced seemingly accurate, specific information she couldn't normally know ("cross-correspondences" were later, but the principle started). Yet, alternative explanations (telepathy, super-ESP accessing *living* minds, cryptomnesia) remained stubbornly plausible. For Sidgwick, Piper offered the *best* evidence, yet it remained frustratingly ambiguous – strong enough to prevent dismissal, weak enough to prevent affirmation. It exemplified the core problem: evidence that *suggested* survival could *always* be interpreted as an unknown faculty of the *living* mind.
          *   **The Census of Hallucinations:** This large-scale statistical study found a small but significant excess of "veridical" hallucinations (coinciding with a death) over chance. Sidgwick saw this as the *most* scientifically robust result. Yet, even this was statistical, not proof of individual survival, and open to methodological critiques. It was suggestive, not conclusive.
      *   **Portrayal:** Show his discipline as a continuous, wearying battle against his own deepest hopes. He imposes scientific protocols, meticulously documents failures, ruthlessly debunks fraud (even when it hurts), and constantly re-evaluates ambiguous evidence like Piper's. His discipline manifests as:
          *   **Relentless Skepticism:** Actively seeking flaws, demanding controls, considering non-survival explanations first.
          *   **Intellectual Honesty:** Acknowledging when evidence *is* puzzling or resists easy dismissal, even if it doesn't prove survival.
          *   **Emotional Restraint:** Suppressing profound disappointment after each setback or ambiguous result, channeling it back into refining methods. He wasn't cold, but he was fiercely controlled.
          *   **Perseverance:** Decades of this grind. Show the weight of accumulated negative evidence and persistent ambiguity taking its toll, yet he persists because the *stakes* (the foundation of ethics) are so high.

  3.  **The Ultimate Failure & The Closing Note: Resigned Uncertainty:**
      *   **The Failure:** By his death (1900), Sidgwick had not found the empirical proof he sought. The research hadn't settled the question. The best evidence (Piper, the Census) pointed towards *something* anomalous, but "super-ESP" (telepathy, clairvoyance among the living) remained a scientifically and philosophically less extravagant explanation than survival. He died knowing the Dualism remained unresolved by evidence.
      *   **The Arc's Close: Resignation, Not Despair; Value in the Quest:**
          *   **Resigned Uncertainty:** His final state isn't belief or disbelief in survival, but a profound, weary acceptance of *uncertainty*. He fulfilled his duty to investigate rigorously, and the universe provided no clear answer. The Kantian postulate remains just that – a postulate, not proven fact.
          *   **Ethical Resolve Persists:** Crucially, he *didn't* abandon utilitarianism. Despite the unresolved Dualism, he continued to act *as if* the ethical demand was paramount. His closing note should reflect this stoic commitment to duty *despite* the lack of cosmic guarantee. The search for proof failed, but the *imperative* of the good remained.
          *   **Value in the Process:** He might find solace in the integrity of the search itself – the application of reason to the deepest questions, the establishment of rigorous psychical research (even if inconclusive), and the exposure of fraud. The quest, though failing its primary goal, was a worthy intellectual and moral endeavor.
          *   **A Quiet, Poignant Farewell:** Avoid melodrama. His end should be contemplative, perhaps slightly melancholic but not bitter. He might reflect on Eleanor (his wife, deeply involved), Myers, Gurney (both dead, Myers fervently believing), and the decades of shared struggle. A final thought could touch upon the enduring mystery, the acceptance of his limited human capacity to know, and the quiet persistence of the ethical call. A line like, whispered or thought: "We looked. We did not find. Yet, the work remains." Or perhaps simply looking at a SPR report or a letter from Piper with a mixture of profound fatigue and unresolved curiosity.

  **Key Character Beats to Emphasize:**

  *   **Moments of Tempted Hope:** When Piper produces something shockingly accurate, show a flicker of desperate yearning in him, quickly followed by the steel of skepticism as he searches for the mundane explanation.
  *   **The Weight of Fraud:** Depict his reaction to exposure (e.g., the Creery sisters) not just as professional disappointment, but as a personal blow to his fragile hope for cosmic justice.
  *   **The Statistical Cold Comfort:** Show him grappling with the Census results – the strongest evidence, yet so impersonal and statistically distant from proving *individual* survival or resolving the Dualism for a specific act of sacrifice.
  *   **Contrast with Colleagues:** Highlight his position between Myers's (increasing) belief and someone like Frank Podmore's (increasing) skepticism. Sidgwick is the agonized fulcrum.
  *   **The Personal Toll:** Show the exhaustion, the private moments of doubt about the whole endeavor, the strain it might place on his relationship with Eleanor (who shared the quest but perhaps differently), and the underlying sadness beneath his disciplined exterior.
  *   **The Unshakeable Core:** Despite the failure of the psychical quest, his fundamental character – rigorous, honest, ethically driven – never wavers. He remains committed to truth-seeking and utilitarian duty.

  By focusing on Sidgwick's profound philosophical motivation, his decades-long disciplined struggle against crushing ambiguity and fraud, and his ultimate resignation to uncertainty while holding fast to ethical duty, you create a deeply compelling, tragic, yet noble arc for your fictionalized philosopher. His story is one of intellectual courage facing the abyss of the unknown and finding a way to act ethically within it.
