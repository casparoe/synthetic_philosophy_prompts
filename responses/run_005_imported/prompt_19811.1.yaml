answer: |-
  Okay, this is *excellent* – sharp, clear, and you've nailed the core nuance that the memes miss. Let's break down your points:

  1.  **Substance & Accuracy:**
      *   **On Kingship/Summa:** Spot on. You've perfectly captured Aquinas's primary, mature position: deep institutional skepticism about *private* tyrannicide, prioritizing procedural/communal/higher authority remedies, and the "pray and endure" as a last resort. His fear of chaos/anarchy trumping tyranny is central. No wincing here from a specialist perspective on this core argument.
      *   **Sentences Commentary:** Your distinction between usurper (*tyrannus ex defectu tituli*) and tyrant-by-misconduct (*tyrannus ex parte exercitii*) is **fundamentally correct and crucial.** That's the key nuance often glossed over.
      *   **A Crucial Refinement Needed:** While the distinction holds, be slightly more precise about *how* Aquinas frames the action against a *usurper* in the Sentences. He doesn't quite say "a private person can *kill* the usurper." He says killing the usurper *is not murder* ("non habet rationem illiciti") **if** there is no possibility of recourse to a higher judgment ("non est recursus ad superiorem iudicem"). He frames it more as removing an unjust aggressor who has *no rightful claim*, akin to self-defense against a brigand. It's still presented as an exception, a last resort when *no institutional remedy exists*, not a positive right or first option. The "private person" element *is* there, but it's heavily qualified by the lack of any other recourse. **Suggestion:** Tweak your sentence slightly to emphasize the "no recourse" condition and the "not murder" vs. "permitted/encouraged" framing. E.g., "...seems to allow that a private person *might* kill a usurper *without it being murder* **if there is genuinely no higher authority to appeal to**..." This prevents someone misreading it as Aquinas *endorsing* vigilantism against usurpers generally.

  2.  **"Myth vs. Reality" Framing:**
      *   **Earned? Absolutely.** The meme is overwhelmingly used to imply "Aquinas said it's okay to kill bad rulers," full stop. Your analysis shows this is a radical oversimplification that ignores:
          *   His strong preference for institutional/communal action.
          *   His explicit warnings against *private* action for tyrants-by-misconduct (the most common case).
          *   His "pray and endure" fallback.
          *   The specific, limited conditions (usurper + no recourse) under which he *might* excuse private killing as non-murder.
      *   **The Gotcha:** It's solid. You demonstrate that the popular quote-mining flattens his complex, cautious, and primarily *institution-focused* political theory into a simplistic revolutionary soundbite. He's far more concerned with preventing anarchy than endorsing regicide.

  3.  **Accessibility & Tone:**
      *   **Landing for Non-Specialists:** This is very good. You avoid jargon ("systematizer of natural law" is about as technical as it gets, and it's well-placed/explained by context). Your language is engaging ("nerd-sniped," "buttoned-up," "cure is worse than the disease," "boringly procedural," "meme"). You clearly state the popular misconception and then contrast it effectively with the textual reality.
      *   **Homework Feel?** Not at all. It reads like a smart, accessible explainer from someone who did the work and is excited to share the *real* story. The pace is good.
      *   **Dead Weight?** No dead paragraphs. The opening hook is effective, the myth is stated clearly, the refutation is structured logically (On Kingship/Summa core caution -> Sentences nuance -> why the confusion happens). It's tight.

  **On Your Specific Questions:**

  *   **Distinction Sharpness:** The usurper/tyrant-by-conduct distinction is clear in Aquinas. Your statement of it is accurate. The refinement needed is less about the distinction itself and more about the *conditions* and *framing* Aquinas places on acting against the usurper (the "no recourse" and "not murder" aspects). Don't lose the distinction – it's vital – just add that layer of nuance around the *action* against the usurper.
  *   **John of Salisbury:** For a *short* piece focused specifically on *correcting the Aquinas meme*, **a footnote is perfect.** A paragraph risks diluting your core argument unless you *very* briefly use him as a contrast to highlight just *how* cautious Aquinas is by comparison. E.g., One sentence: "This stands in stark contrast to thinkers like John of Salisbury, who a century earlier had explicitly argued that killing a tyrant was not just permissible but *praiseworthy*." Then footnote the reference (Policraticus, Book VIII). If you add even a short paragraph, it starts to feel like "compare and contrast medieval tyrannicide theories," which is a different (though interesting) piece.

  **Minor Tweaks/Suggestions:**

  1.  **Tweak the Sentences Sentence:** As above: "...seems to leave more room for a private person to move against a ruler who never had a legitimate claim to power in the first place **and where no higher authority can be appealed to**, framing such an act **not as murder** but as removing an unjust aggressor..."
  2.  **Clarify "Move Against":** In the Sentences context, "move against" primarily means *killing*. It's good to be explicit about that consequence, given the meme is about killing. Your current phrasing is fine, but the implied violence is clear.
  3.  **"Pray and Endure" Nuance:** You might add a *tiny* qualifier: "...pray and endure, **trusting** on the theory that tyrants are a scourge God permits and can also lift." (Adds the theological hope element slightly more actively).
  4.  **Last Sentence Strength:** Your closing sentence about the meme being roughly true for usurpers and false for the ordinary case is perfect. It's a great summary punchline.

  **Overall:** This is a really strong start. You've grasped the essential complexity that the memes ignore. Your framing is justified and effective. Your writing is accessible and engaging. Refine the description of the Sentences position slightly (no recourse, not murder), and you're golden. Skip the John of Salisbury paragraph; footnote him if needed. Keep going!
