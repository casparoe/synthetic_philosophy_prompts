  ```

  ### Key Rationale:
  - **S-Tier (Clear adaptations)**: 
    - *Lactase persistence*: Textbook case of recent (<10k yrs) directional selection in dairying populations (gene-culture coevolution)
    - *Sickle-cell trait*: Canonical example of heterozygote advantage under balancing selection in malaria zones

  - **A-Tier (Strong adaptation evidence)**:
    - *Panda's thumb*: Modified wrist bone clearly selected for bamboo manipulation (functional design with fitness benefits)
    - *Peacock's tail*: Costly ornament shaped by sexual selection (Fisherian runaway selection)

  - **B-Tier (Likely adaptive but mechanism debated)**:
    - *Left-handedness*: Frequency-dependent selection advantages (e.g., combat/sports), though may be byproduct of brain lateralization

  - **C-Tier (Plausible exaptation)**:
    - *Human female orgasm*: Best explained as developmental byproduct of shared embryonic structures with males, with possible later co-option for pair-bonding

  - **D-Tier (Highly contested origins)**:
    - *Human musicality*: Deeply divided between adaptation hypotheses (social cohesion, sexual selection) and byproduct hypotheses (auditory working memory exaptation)

  - **F-Tier (Classic spandrel)**:
    - *Human chin*: Widely accepted as biomechanical byproduct of facial reduction, with no functional design or selective history

  ### Critical Distinctions:
  1. **Selection Signature**: S/A-tier traits show clear population-genetic signatures of selection (e.g., lactase persistence allele frequency clines)
  2. **Functional Design**: Panda's thumb demonstrates specialized structure-function match absent in spandrels
  3. **Phylogenetic Constraints**: Female orgasm fails homology test (present in species without penetrative sex)
  4. **Developmental Inevitability**: Chin emerges automatically from jaw ontogeny without selective modification

  **Hardest Placement**: Musicality remains contentious because it shows potential adaptive benefits (e.g., dopamine release, social synchrony) but could equally emerge as non-adaptive byproduct of selection for auditory pattern recognition or prosodic language capacities. The lack of clear music-specific neural modules and cross-cultural universality arguments make it a paradigm case for ongoing adaptationism debates.
