  ### Payoff Matrix (Row Player, Column Player)
  - **Row Strategies:** A, B, C  
  - **Column Strategies:** X, Y, Z  

  |     | X       | Y       | Z       |
  |-----|---------|---------|---------|
  | **A** | (1, 1)  | (1, 0)  | (0, 0)  |
  | **B** | (4, 0)  | (0, 1)  | (1, 0)  |
  | **C** | (0, 0)  | (4, -1) | (1, 1)  |

  **Goal:** Fully solve the game using IEDS, but note that **Row A cannot be eliminated by any pure strategy** (B or C alone). We'll need mixed domination (a mix of B and C) to eliminate A first.

  ---

  ### Step 1: Why Row A Isn't Dominated by Any Pure Strategy
  First, check if Row A is strictly dominated by B or C using pure strategies only. A strategy is "strictly dominated" if another strategy gives a **strictly higher payoff** for **every possible column move**.

  - **Compare A vs. B:**  
    - If Column plays X: A = 1, B = 4 → B better.  
    - If Column plays Y: A = 1, B = 0 → A better.  
    - If Column plays Z: A = 0, B = 1 → B better.  
    **Not dominated by B** because A is better when Column plays Y.

  - **Compare A vs. C:**  
    - If Column plays X: A = 1, C = 0 → A better.  
    - If Column plays Y: A = 1, C = 4 → C better.  
    - If Column plays Z: A = 0, C = 1 → C better.  
    **Not dominated by C** because A is better when Column plays X.

  **Result:** With pure strategies, Row A isn't dominated by B or C. We can't eliminate anything yet. The game is stuck!

  ---

  ### Step 2: Mixed Domination to Eliminate Row A
  Now, consider a **mixed strategy** for Row: play B with probability \( p \) and C with probability \( 1-p \). We need a \( p \) such that this mixture **strictly dominates A** for all column moves (X, Y, Z). That means:  
  - Against X: Mixed payoff > A’s payoff (1)  
  - Against Y: Mixed payoff > A’s payoff (1)  
  - Against Z: Mixed payoff > A’s payoff (0)  

  **Calculate mixed payoffs (for Row player):**  
  - vs. X: \( p \cdot 4 + (1-p) \cdot 0 = 4p \)  
  - vs. Y: \( p \cdot 0 + (1-p) \cdot 4 = 4(1-p) \)  
  - vs. Z: \( p \cdot 1 + (1-p) \cdot 1 = 1 \)  

  **Inequalities we need:**  
  1. \( 4p > 1 \) → \( p > \frac{1}{4} \)  
  2. \( 4(1-p) > 1 \) → \( p < \frac{3}{4} \)  
  3. \( 1 > 0 \) (always true)  

  **Solution:** Any \( p \) between \( \frac{1}{4} \) and \( \frac{3}{4} \) works (e.g., \( p = 0.5 \)).  
  - For \( p = 0.5 \):  
    - vs. X: \( 4 \times 0.5 = 2 > 1 \) ✅  
    - vs. Y: \( 4 \times (1 - 0.5) = 2 > 1 \) ✅  
    - vs. Z: \( 1 > 0 \) ✅  

  **Why the mixture works when pure strategies fail:**  
  - A is weak in different places: it loses badly to B in X, and to C in Y.  
  - The mixture **combines B’s strength in X** and **C’s strength in Y**, while being at least as good in Z.  
  - No single pure strategy covers all cases, but the blend does by "hedging bets" against Column’s options.

  **Action:** Eliminate Row A using this mixed domination. Updated matrix:

  |     | X       | Y       | Z       |
  |-----|---------|---------|---------|
  | **B** | (4, 0)  | (0, 1)  | (1, 0)  |
  | **C** | (0, 0)  | (4, -1) | (1, 1)  |

  ---

  ### Step 3: Continue IEDS (Pure or Mixed)
  Now we have a 2×3 game. Column can eliminate a strategy using mixed domination.

  - **Check if Column X is strictly dominated** (for Column player):  
    - X gives payoffs: (0 if Row B, 0 if Row C).  
    - We want a mixture of Y and Z that gives >0 for both rows.  
    - Let \( q \) = prob. play Y, \( (1-q) \) = prob. play Z.  
      - vs. Row B: \( q \cdot 1 + (1-q) \cdot 0 = q \)  
      - vs. Row C: \( q \cdot (-1) + (1-q) \cdot 1 = -q + 1 - q = 1 - 2q \)  
    - Inequalities:  
      - \( q > 0 \) (always true if \( q > 0 \))  
      - \( 1 - 2q > 0 \) → \( q < \frac{1}{2} \)  
    - **Solution:** Any \( q \in (0, \frac{1}{2}) \) (e.g., \( q = 0.4 \)):  
      - vs. B: \( 0.4 > 0 \) ✅  
      - vs. C: \( 1 - 2 \times 0.4 = 0.2 > 0 \) ✅  

  **Action:** Eliminate Column X. Updated matrix:

  |     | Y       | Z       |
  |-----|---------|---------|
  | **B** | (0, 1)  | (1, 0)  |
  | **C** | (4, -1) | (1, 1)  |

  ---

  ### Step 4: Final Elimination (Pure Weak Dominance)
  - **Row B vs. C:**  
    - If Column plays Y: B = 0, C = 4 → C better.  
    - If Column plays Z: B = 1, C = 1 → tie.  
    So B is **weakly dominated** by C (since C is never worse and better in Y).  
    **Action:** Eliminate Row B. Only (C, Z) remains.

  **Solution:** (C, Z) with payoffs (1, 1).

  ---

  ### Why Mixed Domination Was Crucial
  - Without mixed domination, we couldn't eliminate Row A (since no pure strategy dominates it). The game stalled at 3×3.  
  - With mixed domination, we eliminated A, then proceeded to solve the game fully.  
  - **Key intuition:** Mixed strategies "smooth out" weaknesses. Here, B is strong in X but weak in Y, while C is weak in X but strong in Y. A 50/50 mix averages these strengths, dominating A everywhere. Pure strategies can't do this alone!

  This example shows how mixed domination expands the power of IEDS, allowing you to solve games that would otherwise be stuck. If your class covers mixed strategies later, you’ll see this in Nash equilibria too!
