  The user's phrasing "idiosyncratic assumption" suggests they find the risk aversion arbitrary. But Rawls would counter that the veil of ignorance transforms the decision context entirely. When you don't know your future position, and it's a one-time choice affecting your life chances, caution becomes rational in a way it isn't for repeatable gambles. 

  I should emphasize how Rawls frames this: the original position isn't about risk preference but about refusing to gamble with fundamental rights. The stakes are too high - we're talking about basic liberties and self-respect here. This shifts the debate from psychology to moral reasoning.

