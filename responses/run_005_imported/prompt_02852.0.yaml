prompt: |-
  quick question about the Pasadena game (that st. petersburg-style coin flip gamble). you flip a fair coin til it lands heads, and if the first heads is on toss n you win 2^n/n dollars when n's odd, or lose 2^n/n when n's even. everyone acts like its expected value is some deep 'undefined' mystery, but when i actually add up the series in the obvious order (n=1, then n=2, then n=3...) i get a perfectly normal convergent number, something like ln(2). if the natural ordering gives you a clean finite answer like that, why do decision theorists insist its undefined instead of just using ln(2) and moving on?
reasoning: |-
  Okay, let me try to figure out why the Pasadena game's expected value is considered undefined despite the series summing to ln(2) when added in order. So the user is confused because when they calculate the expected value by summing the terms sequentially (n=1, n=2, etc.), they get ln(2), which is finite. But decision theorists say it's undefined. Why the discrepancy?

  First, I need to recall the St. Petersburg paradox. It involves infinite expected value because the probabilities decrease while the rewards increase exponentially. The Pasadena game modifies this by alternating the sign based on whether n is odd or even and dividing by n. So the terms are (-1)^{n+1} * (2^n / n) * (1/2^n), which simplifies to (-1)^{n+1} / n. Each term's probability is 1/2^n, so the expected value contribution per n is the reward times probability. That makes the term for each n: (-1)^{n+1} * (2^n / n) * (1/2^n) = (-1)^{n+1} / n. So the series is the alternating harmonic series: 1 - 1/2 + 1/3 - 1/4 + ... which is ln(2).

  But the user is getting ln(2) by summing in order. So why is it undefined? I remember that for conditionally convergent series, rearranging the terms can change the sum. Riemann's rearrangement theorem says that if a series converges conditionally, you can rearrange the terms to sum to any real number, or even diverge. The alternating harmonic series is conditionally convergent because it converges, but the harmonic series itself (absolute value) diverges. So if you rearrange the terms, the sum changes.

  In the context of expected value, the order of summation shouldn't matter. But here, because the series isn't absolutely convergent, the sum depends on the order. The natural order gives ln(2), but if you group terms differently, say two negative terms for each positive, the sum might converge to a different value. For example, rearranging could make it sum to 1.5 or even negative values. That's problematic for expected value because it should be a fixed number, not dependent on how you sum the terms.

  Decision theorists argue that since the series isn't absolutely convergent, the expected value isn't well-defined. Any finite answer like ln(2) is just an artifact of the summation order. So they consider it undefined to avoid inconsistencies. The user might not have considered rearrangements and how they affect the sum. Explaining conditional convergence and Riemann's theorem would clarify why the order matters here. Also, mentioning practical implications like how different decision theories handle such games could help, but the core issue is mathematical.
answer: |-
  You've hit on a fascinating and subtle point about the Pasadena game! Your calculation for the natural order is correct: summing the terms sequentially (n=1, then n=2, then n=3, etc.) gives the alternating harmonic series:

  **Expected Value (Natural Order):**  
  ∑<sub>n=1</sub><sup>∞</sup> (-1)<sup>n+1</sup> / n = 1 - 1/2 + 1/3 - 1/4 + 1/5 - ... = ln(2) ≈ 0.693

  This series *converges* to ln(2). So why do decision theorists call the expected value "undefined" instead of just using ln(2)? The answer lies in **conditional convergence** and the **Riemann series theorem**.

  ### The Core Problem: Conditional Convergence
  1.  **The series converges conditionally, not absolutely:**
      -   The *absolute value* series is ∑<sub>n=1</sub><sup>∞</sup> |(-1)<sup>n+1</sup> / n| = ∑<sub>n=1</sub><sup>∞</sup> 1/n (the harmonic series).
      -   **The harmonic series diverges** (it sums to infinity).
      -   Therefore, the alternating harmonic series **converges conditionally** but **not absolutely**.

  2.  **Riemann Series Theorem (Rearrangement Theorem):**
      -   This fundamental theorem states that if a series converges *conditionally*, its terms can be rearranged to converge to **any real number whatsoever**, or even to **diverge to +∞ or -∞**.
      -   The natural order (1, 2, 3, 4,...) gives ln(2) ≈ 0.693.
      -   But other orders give different answers:
          *   Rearrangement 1: (1 - 1/2 - 1/4) + (1/3 - 1/6 - 1/8) + (1/5 - 1/10 - 1/12) + ... → Converges to **0.5**.
          *   Rearrangement 2: (1 + 1/3 - 1/2) + (1/5 + 1/7 - 1/4) + (1/9 + 1/11 - 1/6) + ... → Converges to **ln(2) + (1/2)ln(2) ≈ 1.5 * 0.693 ≈ 1.040**.
          *   You could rearrange it to converge to 100, -50, or any other number you choose.

  ### Why This Matters for Expected Value
  The concept of expected value requires the sum to be **independent of the order of summation**. It should be a property of the random variable itself, not an artifact of how we choose to list the outcomes. For a well-defined expected value (E[X]), the sum ∑ |x_i * p_i| *must* converge (absolute convergence). This guarantees that any rearrangement of the terms sums to the same value.

  **In the Pasadena game:**
  *   ∑ |Payoff_n * Probability_n| = ∑ |(-1)<sup>n+1</sup> * 2<sup>n</sup>/n * (1/2<sup>n</sup>)| = ∑ |(-1)<sup>n+1</sup> / n| = ∑ 1/n = ∞ (diverges).
  *   Therefore, the expected value is **not absolutely convergent**.

  ### Why Decision Theorists Insist It's Undefined
  1.  **Order Dependence:** The sum depends entirely on the order in which you add the terms. The natural order (n=1,2,3,...) is just one arbitrary choice. There's no mathematical or decision-theoretic reason to privilege this order over any other possible rearrangement.
  2.  **Inconsistent Valuations:** If you value the game based on the natural order (ln(2)), someone else could propose a different rearrangement yielding a higher value (say, 1.04) and argue *their* valuation is just as mathematically valid. Conversely, another rearrangement yields a lower value (0.5). Which one is "correct"? There is no unique answer.
  3.  **Violates Linearity/Additivity:** Standard expected utility theory relies on properties like linearity, which implicitly assume well-defined expectations. Conditional convergence breaks these foundational assumptions.
  4.  **Behavioral Paradoxes:** Decision theories (like standard EUT, cumulative prospect theory) produce inconsistent or paradoxical recommendations when applied to the Pasadena game precisely because the expectation isn't well-defined. Defining it arbitrarily as ln(2) sweeps this deep problem under the rug instead of addressing it.

  **In essence:** While the *natural ordering* gives a clean finite answer (ln(2)), the *mathematical definition of expected value* requires the sum to be robust to any rearrangement of terms. The Pasadena game fails this requirement spectacularly due to conditional convergence. Calling the expected value "undefined" accurately reflects this fundamental mathematical property. It's not a mystery for mystery's sake; it's a rigorous consequence of analysis.

  Decision theorists study this *because* it exposes limitations and generates insights into how people might (or might not) evaluate complex, infinite gambles when the standard mathematical tool breaks down. Defining it as ln(2) "to move on" ignores the core mathematical issue and the valuable questions the paradox raises.
