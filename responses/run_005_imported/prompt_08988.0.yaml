  Hmm, the core tension is between theological honesty and liturgical continuity. The user needs a solution that respects both the Mishneh Torah's legal finality and modern sensibilities. What's clever about their framing is how they've preempted any simplistic "Guide vs. Mishneh Torah" hierarchy - they explicitly demand taking the legal code's surface meaning seriously.

  I recall that scholarly consensus actually supports their intuition: Halbertal's work shows Maimonides intentionally compartmentalized philosophy and law. The Mishneh Torah's sacrificial restoration isn't some "exoteric cover" but a halakhic reality claim. Yet the Guide's anthropological explanation can't be ignored either. 

