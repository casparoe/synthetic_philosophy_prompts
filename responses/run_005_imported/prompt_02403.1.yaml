answer: |-
  Your analysis is perceptive—Augustine's argument hinges on a crucial, unstated premise about the intrinsic nature of sin. Here's a reconstruction of his logic, its hidden foundations, and an assessment of its strength:

  ### 1. **Argument Reconstruction & Missing Premises**
     - **Step 1: The Initial Claim**  
       Augustine grants (for argument's sake) that his opponents justify *blasphemous lies* told to expose heretics because of their good end.
     - **Step 2: The Analogy**  
       He constructs a parallel case: Could *adultery* be justified if committed with the identical intention (exposing heretics) and the same certainty of success?
     - **Step 3: The *Reductio ad Absurdum***  
       The answer is clearly "no"—no moral agent would accept that adultery becomes "chaste" due to good intentions. This exposes a contradiction in the opponents' logic.
     - **Step 4: The Key Inference**  
       If both acts share:
       - (a) A *forbidden nature* (lying/blasphemy vs. adultery),
       - (b) An *identical noble intention* (exposing heretics),
       - (c) *Certainty of success*,
       Yet only one is rejected as intrinsically evil, the opponents' position is inconsistent.
     - **The Missing Premise:**  
       **"No intrinsically evil act (*mala in se*) can be justified by a good end."**  
       Augustine treats lying (especially blasphemous lying) and adultery as sharing this core characteristic: their moral status is defined by their *nature*, not consequences or intentions. This is grounded in his broader theology of sin (as you note with Rom. 6:13).

  ### 2. **The Role of the Analogy**
     - **Not Mere Restatement:** The analogy does independent work. It forces opponents to confront the implications of their principle ("good ends justify evil means"). By choosing adultery—a sin universally recognized as *mala in se*—Augustine makes the incoherence visceral. If they reject the adultery case (as they must), they must either:
       - Abandon their justification for lying, *or*
       - Defend why lying is *not* intrinsically evil like adultery.
     - **Tongue vs. Flesh:** Yes, Augustine sees both as "members" (Rom. 6:13) that must not be instruments of sin. The analogy highlights that *no bodily faculty* (tongue for speech, flesh for sex) can be exempted from the prohibition against intrinsic evils. This universalizes the principle beyond specific sins.

  ### 3. **Does the Argument Succeed Against the "Blasphemy" Objection?**
     - **The Objection:** A critic denies that deceiving heretics about one's faith constitutes "blasphemy." Perhaps it's merely tactical deception, not a sacrilegious utterance against God.
     - **Augustine's Likely Response:**  
       - **Blasphemy as Truth-Distortion:** For Augustine, *any* lie distorts the divine order of truth (cf. *De Mendacio* 7–9). Feigning adherence to heresy isn't just tactical; it *actively misrepresents God's truth* by endorsing falsehood. To call this "not blasphemous" trivializes the gravity of lying about divine realities.  
       - **Heresy as Blasphemy's Object:** Priscillianism denied core doctrines (e.g., the Trinity). To affirm these lies—even insincerely—is to participate in blasphemy against God's nature.  
       - **No Neutral Deception:** Augustine rejects the idea that deception can be morally neutral in religious contexts (*Contra Mend.* 10). All lies are sins against truth, which is God's nature (John 14:6).
     - **Strength of the Response:**  
       - **Strong within his framework:** If one accepts Augustine's premises—that lying is *always* a sin against God (Enchiridion 7.22), and that feigning heresy distorts divine truth—then the "blasphemy" label holds.  
       - **Weak against dissenters:** Critics who view lying as context-dependent (e.g., "white lies" to protect life) or who deny that tactical religious deception constitutes blasphemy will reject the premise. Augustine assumes his definition of lying is axiomatic.

  ### 4. **Assessment of the Argument's Success**
     - **Internal Coherence:** Given Augustine's premises, the argument is logically airtight. The analogy effectively exposes hypocrisy in applying different standards to sins of the tongue vs. body.
     - **Persuasive Power:**  
       - **For adherents:** It powerfully reinforces the absolutist position by linking verbal and sexual sins as equally intolerable corruptions of God's created order.  
       - **Against opponents:** It succeeds only if they accept:  
         (i) Adultery is intrinsically evil (widely granted),  
         (ii) Lying is *equally* intrinsically evil (contested),  
         (iii) Feigning heresy is blasphemous (context-dependent).  
       Modern readers may see adultery as involving tangible harm to persons, while lying to heretics seems victimless—weakening the parallel.
     - **Enduring Insight:** Augustine correctly identifies that *consequentialist exceptions* for "lesser evils" risk eroding moral boundaries. His warning against instrumentalizing sin resonates in ethics today (e.g., "torture for information" debates).

  ### Conclusion
  Augustine's analogy relies on the unstated premise that **no good intention can transmute an intrinsically evil act into a good one**. The parallel between tongue and flesh (Rom. 6:13) universalizes this principle. While the argument is rigorous within his framework, its persuasiveness today depends on accepting two contested claims: the *absolute evil of all lies* and the *blasphemous nature of tactical religious deception*. For your seminar, emphasize how the analogy functions as a *reductio ad absurdum* targeting inconsistent moral reasoning—a hallmark of Augustine's polemical method. His deeper concern isn't just lying, but the *corruption of the soul* that occurs when we "do evil that good may come" (Rom. 3:8).
