answer: |-
  The dispute between realism (features as intrinsic) and instrumentalism (features as observer-dependent) in mechanistic interpretability (MI) has concrete implications for evaluating safety claims. Below are key implications that should **change how we assess and act on** claims like "ablation of circuit X reduces deceptive behavior":

  ### 1. **Reduced Confidence in Singular Causality**  
     - **Implication:** Safety claims asserting that a feature/circuit is "responsible for" deception should be treated as *probabilistic and context-dependent*, not deterministic.  
     - **Actionable Change:**  
       - Require researchers to quantify **robustness across contexts** (e.g., does ablating "deception direction D" reduce deception in 90% of inputs or 50%?).  
       - Demand **counterfactual testing**: If multiple decompositions explain the same behavior, interventions must show efficacy across *all plausible interpretations* of the activations.  

  ### 2. **Interventions May Lack Generalizability**  
     - **Implication:** A "patch" that suppresses a feature in one decomposition might fail or backfire if the network relies on superposed representations.  
     - **Actionable Change:**  
       - Test safety interventions **against adversarial inputs** designed to activate *alternative decompositions* of the same activations.  
       - Prioritize **longitudinal monitoring** post-intervention: Networks may "recompress" features into new superposed directions, resurrecting the threat.  

  ### 3. **False Negatives in Hazard Detection**  
     - **Implication:** If a safety-critical feature is only detectable in *some* decompositions, standard MI tools might miss it.  
     - **Actionable Change:**  
       - **Mandate multi-method verification**: Claims like "no deception circuit exists" require validation across *sparse autoencoders*, *path patching*, and *nonlinear probes* to reduce decomposition bias.  
       - Treat absence of evidence as **conditional on the interpreter’s tools**, not evidence of absence.  

  ### 4. **Over-Reliance on Ablation Risks Model Degradation**  
     - **Implication:** Ablating a "deceptive" direction might corrupt *other critical features* due to polysemanticism, causing erratic behavior.  
     - **Actionable Change:**  
       - **Measure collateral damage** rigorously: Any ablation study must report performance drops on *benign tasks* (e.g., accuracy, helpfulness).  
       - Prefer **steering methods** (e.g., activation addition) over ablation, as they preserve superposition while suppressing behaviors.  

  ### 5. **Epistemic Asymmetry in Safety Audits**  
     - **Implication:** Instrumentalism implies that "features" are tools for prediction, not ground truth. Thus, safety claims cannot be fully validated internally.  
     - **Actionable Change:**  
       - **Decouple internal interpretability from external guarantees**: Use MI findings to *generate hypotheses*, but require **behavioral red-teaming** as the ultimate test (e.g., if probing suggests sycophancy, test sycophancy in deployment-like settings).  
       - Regulatory standards (e.g., EU AI Act) should treat MI evidence as **supportive but insufficient** for compliance.  

  ### 6. **Reevaluation of "Obfuscated" Threats**  
     - **Implication:** If superposition allows networks to "hide" features from *certain* interpreters, apparent safety could be illusory.  
     - **Actionable Change:**  
       - **Penalize overclaiming**: Papers stating "we eliminated deception" must disclose the decomposition method’s limitations (e.g., "under 512-feature SAE, deception is undetectable").  
       - Fund research into **superposition-invariant detection methods** (e.g., topology-based interpretability).  

  ---

  ### How This Changes Practice: A Checklist for Evaluators  
  When assessing claims like *"Circuit X causes deception"*:  
  - **☑ Demand context scope**: Does the claim hold for >95% of relevant inputs?  
  - **☑ Verify with antagonistic tools**: If SAE finds feature F, does dictionary learning or causal scrubbing concur?  
  - **☑ Test for side effects**: After removing X, does the model fail at unrelated tasks?  
  - **☑ Require behavioral correlation**: Does suppressing X *consistently* reduce deception in black-box tests?  
  - **☑ Reject universal claims**: No claim of "no backdoor" is credible without testing multiple decompositions.  

  **In essence**: The dispute forces a shift from treating MI as revealing "ground truth" to treating it as a **heuristic for generating testable hypotheses**. Safety-critical decisions must weight MI evidence *lower* than behavioral outcomes, and interventions require stress-testing against the inherent underdetermination of features. This doesn’t invalidate MI for safety but demands humility, redundancy, and adversarial validation.
