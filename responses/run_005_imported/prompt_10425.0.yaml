prompt: |-
  I sit on a graduate fellowship committee that ranks applicants using evidence that's rarely certain: a reference letter we read as probably warm but formulaic, an originality checker that flags a writing sample as suspicious but inconclusive, and an interviewer's sense that a candidate likely oversold their role on a project. As a check, two reviewers redid the scoring for a handful of already-completed files in exactly reversed order and reached noticeably different final confidence in the same candidates, despite agreeing about what each piece of evidence shows on its own. Half the committee wants to just average the two orderings and move on; the other half thinks the order-sensitivity itself disqualifies the scores until it's fixed. Draft the short procedural memo I'll bring to next week's meeting: recommend how we should combine this kind of graded, uncertain evidence going forward, and give a fair hearing to whichever side of the dispute you don't take.
reasoning: |-
  Okay, the user is on a graduate fellowship committee dealing with a tricky issue. They have to rank applicants based on uncertain evidence like ambiguous reference letters, inconclusive originality checks, and subjective interview impressions. The problem arose when two reviewers scored the same files in reverse order and got different results, even though they agreed on each piece of evidence individually. 

  Hmm, this is a classic case of cognitive bias in decision-making - probably recency or primacy effects where the order of information influences the final judgment. The committee is split between those who want to average the scores and move on, and those who think the whole scoring system is invalid until fixed. 

  The user needs a procedural memo that both resolves the immediate dispute and establishes a better system for handling uncertain evidence. They're clearly frustrated by the subjectivity and want something rigorous but practical. 

  I should address both camps fairly. The "average and move on" side has a point about efficiency - committees often have to make imperfect decisions under time pressure. But the "disqualify" side is right that order-sensitivity reveals fundamental flaws in how evidence is weighted and combined. 

  For the recommendation, a structured multi-stage approach makes sense: separate evidence interpretation from integration, use predefined weights, and force explicit confidence levels. That reduces cognitive biases while keeping the human judgment element. 

  The memo should validate both perspectives but steer toward systemic improvement. The key is making the process more robust without making it impossibly cumbersome. Also important to suggest piloting the new method before full implementation - committees hate wholesale changes mid-cycle. 

  Noticing the user mentioned "graded, uncertain evidence" - they'd probably appreciate nodding to probabilistic reasoning models without getting technical. Should keep the tone professional but accessible since it's for committee colleagues. 

  And must remember this is for academia - any solution needs to withstand scrutiny from faculty who may be attached to their evaluation styles. The "fair hearing" part is crucial for buy-in.
answer: |-
  **MEMORANDUM**  
  To: Graduate Fellowship Committee  
  From: [Your Name/Chair]  
  Date: October 26, 2023  
  Subject: Procedural Recommendations for Handling Order-Sensitivity in Applicant Scoring  

  ### Background  
  Our recent quality check revealed that reversing the order of evidence review (e.g., interview notes → writing sample → reference letters vs. reference letters → writing sample → interview notes) led to materially different confidence scores for identical applicants, despite consensus on individual evidence interpretations. This indicates cognitive bias (e.g., recency/primacy effects) in how we *integrate* uncertain evidence. While half the committee advocates averaging discrepant scores, the other half argues this masks a systemic flaw requiring resolution.  

  ### Recommendation: A Structured Multi-Stage Process  
  Averaging addresses symptoms but not root causes; disqualifying scores halts progress without a remedy. I propose adopting a **standardized evidence-integration framework** for all future reviews:  

  1. **Stage 1: Independent Evidence Assessment**  
     - Reviewers score each piece of evidence (e.g., reference letter, writing sample, interview) *separately* using a predefined rubric (e.g., 1–5 scale) and note confidence intervals (e.g., "Medium confidence").  
     - *Example rubric:*  
       - **Originality Check:** 1 (Flagged/High Concern) → 5 (Clear/No Concern) + Confidence (Low/Med/High).  
       - **Reference Letter:** 1 (Generic) → 5 (Exceptional) + Contextual notes (e.g., "Formulaic but positive").  

  2. **Stage 2: Weighted Evidence Integration**  
     - Assign fixed weights to evidence categories *in advance* (e.g., Writing Sample: 40%, Interview: 30%, References: 20%, Other: 10%).  
     - Calculate a preliminary score: `(Writing Sample Score × 0.4) + (Interview Score × 0.3) + ...`  

  3. **Stage 3: Holistic Review with Deliberation**  
     - Reviewers discuss discrepancies >1 point in preliminary scores, focusing on:  
       - Contradictory evidence (e.g., "Strong interview but flagged writing sample").  
       - Confidence levels (e.g., "Low confidence in reference interpretation").  
     - Adjust scores collaboratively with written justifications.  

  4. **Order Randomization Pilot**  
     - For the next 10 applications, randomly assign evidence review sequences to reviewers. Compare outcomes to detect residual bias.  

  ### Addressing Committee Concerns  
  - **For "Average and Proceed" Colleagues:**  
    Averaging is efficient, but it risks entrenching inconsistency. Our goal is defensible decisions—not speed. The proposed system retains efficiency via standardized weights while adding transparency. We pilot-tweak it in real-time.  

  - **For "Disqualify Scores" Colleagues:**  
    Your caution is justified: order-sensitivity undermines validity. However, discarding scores without a replacement process delays decisions unfairly to applicants. The multi-stage method directly mitigates cognitive bias by decoupling evidence interpretation from integration. We commit to auditing the new system rigorously.  

  ### Next Steps  
  1. Vote at next meeting to adopt the 3-stage process for all remaining applications.  
  2. Assign subcommittee to refine rubrics/weights by [Date].  
  3. All reviewers to complete bias-awareness training (15-min module) before next scoring cycle.  

  This approach balances rigor with feasibility. It transforms inconsistency into an opportunity to build a more robust, transparent evaluation system—strengthening both our outcomes and the committee’s credibility.  

  **Approved:**  
