answer: |-
  Here are 10 interview questions designed to probe the resolute choice defense against money-pumps, incorporating your specific requests and anticipating follow-ups:

  1.  **The Level Shift:** You argue that rationality resides in the *plan* rather than the *preferences*. Critics might say this simply relocates the requirement for coherence: instead of demanding transitivity *between* outcomes, resoluteness demands coherence *within* the plan itself. Isn't this just imposing a form of "plan transitivity" or internal consistency one level up, rather than solving the underlying problem of seemingly conflicting evaluations?  
      *   *Follow-up (Likely Answer: Plans reflect deeper values):* If the "rational plan" is defined as the one an agent would choose with full foresight *before* the sequence starts, doesn't this definition *presuppose* that the agent has a consistent way to compare complex, sequential options at that initial node? Doesn't *this* comparison require the very preference consistency (transitivity, independence) that the agent supposedly lacks at the outcome level?

  2.  **Resolute vs. Sophisticated:** How does your resolute chooser, who commits to a plan upfront (e.g., "Don't trade A for B, then B for C, even if offered"), fundamentally differ from a 'sophisticated' chooser who, knowing their future intransitivities, uses backward induction to avoid starting the pump sequence altogether (e.g., refuses the *first* trade A-for-B because they foresee they'll later trade B-for-C and end up worse off)? Both avoid the pump.  
      *   *Follow-up (Likely Answer: Sophisticates can't avoid all pumps/act counter-preferentially):* In the classic three-step pump (A>B, B>C, C>A), the sophisticated chooser refusing the first trade (A-for-B) is acting *counter-preferentially* at that *first* node (since they prefer B to A *at that moment*). Doesn't resoluteness, by committing upfront *not* to make that first trade despite the momentary preference, essentially require the agent to *override* their current, locally expressed preference in favor of the plan? Is this override meaningfully different from the sophisticate's counter-preferential refusal?

  3.  **The Binding Problem (Real Traders):** Your defense relies critically on the agent's ability to *irrevocably commit* to the plan at the outset. How does this model translate to real-world agents – humans or AIs – who often cannot perfectly bind their future selves? Future selves might face intense local incentives, suffer weakness of will, or simply reinterpret the plan. Doesn't the *practical possibility* of plan abandonment reintroduce vulnerability to pumping for any agent lacking perfect commitment technology?  
      *   *Follow-up (Likely Answer: Commitment mechanisms exist/can be built):* While commitment mechanisms exist (precommitment contracts, Ulysses pacts, hard-coded rules), they often incur costs, are imperfect, or can be gamed. If an agent needs to invest significant resources *just to avoid being pumped* due to their underlying preferences, doesn't this still represent a practical cost indicting those preferences? Is resoluteness viable only for agents who can afford perfect, costless commitment?

  4.  **Allais & Independence:** How does resolute choice specifically handle violations of the Independence Axiom, like the Allais Paradox? If an agent has Allais preferences, how does committing to a plan upfront prevent them from making a sequence of choices (e.g., switching between lotteries when certain outcomes become certain) that a critic could argue is exploitative or inconsistent, even if it doesn't directly extract money?  
      *   *Follow-up (Likely Answer: The plan respects the initial complex evaluation):* Doesn't the resolute plan simply encode the initial Allais choice *without* dynamically responding to the revealed information? If the *rationale* for the Allais choice is context-dependent (e.g., aversion to disappointment when certainty is lost), doesn't the resolute plan prevent the agent from *using* that context sensitivity when it becomes directly relevant later in the sequence? Is this a feature (avoiding pump-like inconsistency) or a bug (preventing normatively justified context sensitivity)?

  5.  **Costs of Commitment & Missed Opportunities:** Resolute commitment avoids bad sequences, but could it also lock the agent out of genuinely beneficial *unforeseen* opportunities that arise mid-sequence? Isn't there a trade-off between pump-proofness and flexibility? How does the resolute agent rationally decide *which* potential sequences are worth pre-committing against, especially in complex environments?  
      *   *Follow-up (Likely Answer: Plans are conditional/flexible within bounds):* If the resolute plan incorporates significant conditionality ("If X happens, do Y; if Z happens, do W") to handle uncertainty, doesn't this start to blur the line between resolute planning and sophisticated dynamic choice? At what point does adding conditionality undermine the core "no reconsideration" tenet of resoluteness?

  6.  **The Self Over Time:** Resolute choice seems to require a strong, unified conception of the "self" over time that makes the initial commitment binding on future selves. Does this view conflict with philosophical perspectives that see the self as more fragmented or temporal parts as having significant autonomy? If future "selves" are meaningfully distinct agents with their own local preferences, isn't the initial "self" imposing its will coercively?  
      *   *Follow-up (Likely Answer: Rational agency implies unity):* Doesn't the *need* for resolute commitment to avoid exploitation *presuppose* a problematic fragmentation of the self over time? If an agent *is* truly unified, wouldn't their preferences naturally be dynamically consistent (transitive, independent), making resoluteness unnecessary?

  7.  **AI Implementation:** Given your podcast's interest in autonomous agents, how feasible is implementing resolute choice in a real AI system? Wouldn't it require incredibly complex upfront planning for all possible interaction sequences? How does this scale? Could an AI realistically distinguish between "reconsidering due to new info" (good) and "reconsidering due to shifting local preferences leading to a pump" (bad) without effectively enforcing dynamic consistency?  
      *   *Follow-up (Likely Answer: Heuristics/bounded resoluteness):* If we move to "bounded resoluteness" using heuristics to identify potential pump-like sequences for pre-commitment, doesn't this reintroduce the possibility of exploitation if the heuristics fail? Is there a stable middle ground between naive myopic choice and perfect, exhaustive resolute planning?

  8.  **Axiomatic Foundations:** Standard decision theory derives normative force from axioms like transitivity/independence applied to preferences over outcomes. What are the normative foundations for resolute planning? Are there clear, non-circular axioms for "rational plans" that *don't* implicitly rely on the coherence of the underlying outcome preferences they are constructed from?  
      *   *Follow-up (Likely Answer: Plans maximize ex-ante expected utility):* But if the agent's *ex-ante* evaluation of the *plan* itself violates transitivity or independence when comparing *different possible plans* (e.g., Plan X > Plan Y, Plan Y > Plan Z, but Plan Z > Plan X), doesn't the problem simply reappear at the plan level? How can an agent rationally select the initial resolute plan without consistent preferences *over plans*?

  9.  **Empirical Scope:** Are there documented real-world examples where individuals or institutions demonstrably avoided money-pump-like exploitation *specifically* through resolute commitment to a pre-defined plan, rather than through sophisticated backward induction or simply having transitive preferences? What evidence best supports resoluteness as a *distinct* and *effective* strategy used by boundedly rational agents?  
      *   *Follow-up (Likely Answer: Hard to distinguish empirically):* Given the difficulty in distinguishing resolute from sophisticated avoidance or stable preferences in practice, doesn't this make resoluteness primarily a theoretical counterfactual? If it's empirically indistinguishable from other solutions, does it lose some of its force as a unique defense of intransitivity/Allais preferences?

  10. **The Convincer Question:** Finally, what specific empirical finding, theoretical result, or thought experiment *could* convince you that vulnerability to money-pumps, even under *ideal* commitment conditions (i.e., perfect resoluteness is possible), fundamentally indicts the underlying *preferences themselves* (e.g., the intransitivity or Allais violation) as irrational, rather than just being a problem of the disposition to reconsider? What evidence would falsify the core claim that preferences violating standard axioms can be rational if paired with resolute commitment?  
      *   *Follow-up (Likely Answer: Unclear / Preference is bedrock):* If no conceivable finding could convince you – if resoluteness is always a sufficient shield for any preference pattern – does this risk making the theory non-falsifiable? Conversely, if you *can* conceive of such evidence, what would it look like and why would it be decisive? (This probes the core of her commitment to the theory).

  These questions aim to push beyond a simple restatement of resolute choice, directly engaging with the conceptual tensions (level shift, self-binding), practical limitations (real agents, AI), distinctions from alternatives (sophistication), and the fundamental normative foundations of the theory, culminating in the crucial question of what could potentially change her mind. Good luck with the interview!
