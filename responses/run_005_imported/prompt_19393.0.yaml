prompt: |-
  I'm a PhD student in political science, though my own research is archival and historical rather than formal or mathematical, which makes what follows a little embarrassing to admit. This term I ended up chairing the small committee our department uses to award its annual "Graduate Student Service Prize," and the process left me stuck on something that feels like it should have a clean answer. We had four nominees, whom I will call A, B, C, and D, and nine committee members, each of whom submitted a full ranking of all four. To keep the first pass simple, we counted only first-place votes, and D won outright with three votes, even though a comfortable majority of the committee had actually ranked D dead last overall; A, B, and C had simply split the remaining six votes among themselves. Everyone agreed that result was clearly wrong, so we tried comparing the nominees head-to-head instead, tallying, for every pair, how many members preferred one to the other. D lost every single head-to-head match-up and was easily set aside, but among the three remaining contenders we found, to our collective confusion, that a majority preferred A to B, a majority preferred B to C, and a majority preferred C to A. No nominee beat both of the others, so the seemingly obvious head-to-head method produced no winner at all among the finalists who actually mattered.

  We ended up letting me, as chair, break the resulting tie, which more than one committee member grumbled felt less like the committee's decision than my own preference dressed up in procedure. Afterward, partly out of curiosity and partly to find something more defensible for next year, I reran the same nine ballots using a points system instead, awarding three points for a first-place vote, two for second, one for third, and none for last. This produced a clean order among A, B, and C with no cycle, which seemed promising, until I noticed that simply dropping D from the tally altogether, on the reasonable grounds that D had never been a real contender, flipped the order between the other two front-runners, even though not one person had changed their relative ranking of those two. Nobody's opinions moved at any point in this process; only our bookkeeping did, and yet the "winner" kept changing along with it. I cannot shake the feeling that something structural is going on here, something about the task itself rather than a fixable defect in whichever counting method we happened to try, but I lack the formal vocabulary to name it or to know whether any procedure could have avoided it. Is there a principled way to design a ranking process for situations like ours that would avoid this kind of instability, or is it simply unavoidable whenever several people's individual rankings must be aggregated into one collective decision?
reasoning: |-
  We are facing a classic problem in social choice theory: the aggregation of individual preferences into a collective decision. The issues you've encountered (the Condorcet paradox, sensitivity to irrelevant alternatives, and the method dependence of the outcome) are well-known and have been studied for centuries.

  Let me break down the issues:

  1. **First-past-the-post (only first-place votes):** This led to D winning even though a majority ranked D last. This is because the anti-D vote was split among A, B, and C. This method is vulnerable to vote splitting.

  2. **Head-to-head (Condorcet method):** In a head-to-head comparison, D lost every match, so was eliminated. But then among A, B, and C, we had a cycle: A beats B, B beats C, and C beats A. This is called a Condorcet cycle, and it means there is no Condorcet winner (a candidate who beats every other candidate in a head-to-head contest). This cycle is the Condorcet paradox and can occur when there are three or more options.

  3. **Points system (Borda count):** You used a Borda-like method (assigning 3,2,1,0 points). This produced an order without a cycle. However, when you removed D (the irrelevant alternative), the order between A and B changed even though no one changed their ranking of A and B. This is a violation of the Independence of Irrelevant Alternatives (IIA) criterion.

  The core problem is that no perfect voting system exists. Arrow's Impossibility Theorem (by Kenneth Arrow) states that no rank-order voting system can simultaneously satisfy a set of reasonable criteria (including IIA) when there are three or more alternatives.

  Given the issues, what can be done?

  - **Use a Condorcet method with a cycle-breaking rule:** In the head-to-head method, if there is a cycle, there are ways to break it. For example, the Schulze method or ranked pairs method are Condorcet methods that resolve cycles. They look at the strength of the victories (the margin of victory in each head-to-head) to break the cycle.

  - **Use a Borda count but with awareness of its flaws:** The Borda count is sensitive to the inclusion or exclusion of alternatives (as you saw). However, it does not produce cycles and may be considered more "representative" of overall rankings. If you decide to use Borda, you should be consistent about including all candidates and not remove any.

  - **Use a single transferable vote (STV) or instant runoff voting (IRV):** In IRV, voters rank the candidates. The candidate with the fewest first-place votes is eliminated, and their votes are transferred to the next choice. This process continues until one candidate has a majority. This method avoids the split vote problem and may be more resistant to cycles. However, it can also violate IIA.

  For your committee, I would suggest:

  1. **Define the criteria for the prize.** What does "service" mean? Is it about leadership, hours, impact? Having clear criteria might help voters focus on the same attributes.

  2. **Choose a voting method that fits the committee's values.** For example:
     - If the committee values the candidate who is most broadly acceptable (not necessarily the top choice of the majority but one that is ranked high by many), then Borda count might be appropriate. However, be aware of the IIA issue. To mitigate, do not remove any candidate arbitrarily.
     - If the committee values majority rule and wants to avoid a candidate who is disliked by a majority, then a Condorcet method (with a cycle-breaking rule) might be better.

  3. **Consider approval voting or range voting.** Instead of ranking, each voter can approve as many candidates as they find acceptable. The candidate with the most approvals wins. This is simple and avoids the cycle problem. Alternatively, range voting (score voting) allows voters to give each candidate a score (say 0 to 5), and the candidate with the highest average wins. These methods are less prone to strategic voting in some contexts and can avoid the cycle problem.

  4. **Transparency and agreement:** Whatever method you choose, explain it to the committee in advance and get agreement. This can reduce grumbling.

  Given the specific problems you encountered:

  - The Condorcet cycle among A, B, C is a fundamental mathematical possibility. It is unavoidable in any method that uses pairwise comparisons without a tie-breaking rule.

  - The Borda count's reversal when dropping D is a known flaw (IIA violation). It occurs because the removal of D changes the relative weights of the remaining positions. For example, a voter who had ranked D first and then A second would now have A in first, so A gains points. Meanwhile, a voter who had ranked A first and D second would now have A still first, but the point gap between A and the next candidate (who might be B) might change.

  In summary, there is no perfect method. However, you can choose a method that minimizes the problems you care about most.

  Recommendation for next year:

  - **Use a Condorcet method with a defined cycle-breaking rule.** For example, the Schulze method is used in many organizations (like Wikimedia and Debian). It is complex to compute by hand but there are free online tools. Alternatively, the Tideman method (ranked pairs) is another Condorcet method that breaks cycles by locking in the strongest pairwise victories first.

  - **Or, use approval voting.** This is simple: each committee member can vote for as many candidates as they approve (i.e., think deserve the prize). The candidate with the most approvals wins. This avoids the cycle and the vote-splitting problem. However, it does not capture the intensity of preference (rankings).

  - **Or, use IRV (instant runoff voting).** This method is used in many elections and is familiar. It would eliminate the candidate with the fewest first-place votes and redistribute until one has a majority. It avoids the split vote and may avoid the cycle (though it can sometimes fail to elect a Condorcet winner).

  Given that your committee had only 9 members and 4 nominees, any method is computationally feasible. I would lean toward approval voting for its simplicity and resistance to cycles. Alternatively, if you want to capture rankings, use a Condorcet method (like Schulze) and use an online calculator to compute the result.

  Finally, note that whatever method you choose, it is possible that the outcome might not reflect the "true" collective preference because of the inherent difficulties in preference aggregation. The key is to have a method that the committee agrees is fair and transparent.

  For more formal reading, you might look into:
     - Arrow's Impossibility Theorem
     - Condorcet paradox
     - Borda count
     - Schulze method
     - Approval voting
answer: |-
  Your experience vividly illustrates fundamental challenges in social choice theory, particularly Arrow's Impossibility Theorem, which proves that no voting system can simultaneously satisfy all desirable fairness criteria when aggregating ranked preferences. Here's a breakdown of what occurred and principled approaches to mitigate the instability:

  ### 1. **The Core Problems You Encountered**
     - **Condorcet Paradox**: The cycle (A>B, B>C, C>A) is a classic paradox where majority preferences become intransitive. This arises from heterogeneous voter preferences and is mathematically inevitable in some cases (e.g., with 3+ candidates and diverse rankings).
     - **Independence of Irrelevant Alternatives (IIA) Violation**: When removing D (an "irrelevant" loser) flipped the order of A and C, the Borda count violated IIA—a criterion requiring that the ranking between two candidates shouldn't change if a third candidate is added or removed. Borda is notoriously vulnerable to this.
     - **Sensitivity to Voting Methods**: Each system (plurality, head-to-head, Borda) prioritized different aspects of preferences, leading to different "winners" without any voter changing their mind. This highlights **procedural arbitrariness**—the outcome depends more on the method than the underlying preferences.

  ---

  ### 2. **Principled Solutions for Your Committee**
  While no system is perfect, the goal is to choose one that aligns with your committee's values (e.g., prioritizing broad consensus, strong pairwise performance, or simplicity). Below are options, balancing fairness and practicality:

  #### A. **Condorcet Methods (Pairwise Majority Focus)**
     - **Principle**: Elects a candidate who beats all others head-to-head (a "Condorcet winner"). If none exists (due to a cycle), it uses a tiebreaker.
     - **Recommendation**: **Ranked Pairs** or **Schulze Method**.  
       - These methods lock in the strongest pairwise victories first (e.g., if "A>B" wins by 7-2, it's prioritized over a closer "B>C" at 5-4).  
       - Resolves cycles by ignoring weaker, conflicting preferences.  
       - *Why it helps*:  
         - D was correctly eliminated (lost all pairs).  
         - The A-B-C cycle is broken by honoring the largest majorities.  
         - Satisfies Condorcet criterion (if a Condorcet winner exists, they win).  
       - *Trade-off*: More complex tallying (use free software like [Condorcet Internet Voting Service](https://civs.cs.cornell.edu/)).

  #### B. **Instant-Runoff Voting (IRV) / Single Transferable Vote**
     - **Principle**: Eliminates the candidate with the fewest first-place votes and redistributes their votes until one candidate has a majority.  
     - *Why it helps*:  
       - Avoids vote-splitting (e.g., D wouldn't win if most rank them last).  
       - Often produces a consensus candidate with broad support.  
     - *Trade-off*:  
       - Violates IIA (like Borda) but less severely.  
       - May eliminate a candidate who is a Condorcet winner but lacks first-place support.

  #### C. **Approval Voting (Simplicity Focus)**
     - **Principle**: Voters approve *all* candidates they find acceptable. The candidate with the most approvals wins.  
     - *Why it helps*:  
       - Immune to cycles and IIA violations.  
       - Simple, fast, and ensures the winner has broad support (not just polarized first-place votes).  
       - In your case: If all voters approved A, B, or C (but not D), D would lose.  
     - *Trade-off*: Doesn't capture ranked intensity (e.g., "strong 1st vs. weak 2nd").

  #### D. **Borda Count (Modified for Stability)**
     - **Principle**: Assign points for ranks (e.g., 3/2/1/0). To reduce IIA vulnerability:  
       - **Include all original candidates** in the tally, even if some withdraw.  
       - Use a **fixed scoring template** (e.g., always assign max points to top choice, even if field shrinks).  
     - *Why it helps*: Prevents the "flip" you saw when D was removed.  
     - *Trade-off*: Still violates IIA; best if the field is stable.

  ---

  ### 3. **Recommendation for Your Committee**
  1. **Adopt a Condorcet Method (Ranked Pairs or Schulze)**:  
     - Best for honoring majority preferences and resolving cycles.  
     - Use software to automate tallying.  
     - Present the pairwise matrix to the committee to justify the outcome (e.g., "A wins because their strongest victory outweighed the cycle").  

  2. **Fallback: Approval Voting**:  
     - If simplicity is prioritized, this avoids cycles and IIA issues entirely.  
     - Ask voters: "Which nominees deserve the prize?" (approve any number).  

  3. **Avoid**:  
     - Plurality (first-past-the-post): Fails with vote-splitting.  
     - Basic Borda: Prone to IIA violations unless scoring is fixed.  
     - Chair-decided tiebreaks: Perceived as arbitrary.

  ---

  ### 4. **Broader Context: Why Instability is Unavoidable**
  - **Arrow's Theorem**: No ranked system can satisfy all of:  
    (i) Unrestricted voter preferences,  
    (ii) Unanimity (if all prefer A>B, group ranks A>B),  
    (iii) IIA,  
    (iv) Non-dictatorship.  
    Your experience reflects this impossibility—every system sacrifices one criterion.  
  - **Embrace Transparency**: Educate the committee on why methods matter. A predefined, agreed-upon system reduces grumbling (e.g., "We use Condorcet because it respects pairwise preferences").  

  ### Final Thought
  Your case is a textbook example of social choice complexities. By adopting a Condorcet method or approval voting, you can achieve a defensible outcome that minimizes paradoxes. For next year, propose 2–3 options, let the committee vote on the system itself (using approval voting!), then apply it consistently. This transforms "arbitrariness" into a principled choice.  

  For deeper reading:  
  - *Arrow, Social Choice and Individual Values* (1951)  
  - *Zwicker, Introduction to the Theory of Voting* (2016)  
  - Practical tools: [Condorcet.CIVS](https://civs.cs.cornell.edu/), [Preference-Voting.org](https://www.preference-voting.org/)
