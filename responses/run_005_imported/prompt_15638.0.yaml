  I went down a rabbit hole this week on Gödel's ontological argument for God -- the modal logic version with 'positive properties' and God-like beings, not Anselm's original 'greatest conceivable being' thing. My roommate is doing a logic PhD and brought up this objection over dinner that a couple of the papers I skimmed call 'modal collapse,' and now I can't stop thinking about it. The claim seems to be that if you actually grant Gödel's axioms, you can derive that literally every true proposition turns out to be a *necessary* truth -- i.e, there's no contingency left anywhere in the world -- which feels like a way bigger problem than just 'does God exist or not.'

  I think it has something to do with how 'essence' gets defined (God-likeness being the essence of any God-like being) plus the theorem that a God-like being exists necessarily, but I can't reconstruct the actual chain of reasoning that gets you from those two ingredients all the way to full-blown necessitarianism. Like, how does treating some arbitrary true proposition as if it were a 'property' let you smuggle necessity in? Could you walk me through the derivation fairly intuitively, without leaning too hard on dense modal-logic notation, and also say whether this is generally treated as a fatal flaw in the argument or whether anyone's found a decent way to patch the axioms to dodge it?
