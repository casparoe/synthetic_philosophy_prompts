  Now, Wittgenstein's hinges: they're not beliefs but background certainties that enable language games. They're not justified; they're the scaffolding. The riverbed metaphor shows they're fluid, not fixed foundations. The key difference is hinges aren't part of the justificatory structure—they're beneath it. 

  The user's struggle is showing how "groundless" certainties can stop regress without being foundations. I should emphasize the shift from justification to pragmatics: hinges work because they're acted upon, not proved. Foundationalism is about grounding knowledge; Wittgenstein rejects that whole framework. 

  Also, the user might need concrete contrasts: foundationalism has basic beliefs justifying others; hinges are the conditions for any belief to make sense. No propositional work, no justification—just the bedrock of action. 

