answer: |-
  You've pinpointed a crucial and enduring debate about *On Certainty*. Your friend's critique is common – hinges *do* seem to halt the regress like foundationalist basic beliefs. But Wittgenstein's insistence on their "groundlessness" *is* the key to a significant difference, marking a genuine departure from traditional foundationalism. Here's a breakdown:

  1.  **Traditional Foundationalism's Core Strategy:**
      *   **Goal:** Stop the infinite regress of justification (A is justified by B, B by C, ad infinitum).
      *   **Mechanism:** Identify a special class of **basic beliefs**.
      *   **Properties of Basic Beliefs:**
          *   **Self-Evident/Incorrigible/Self-Justifying:** They possess intrinsic justification (e.g., Descartes' "Cogito," sense-data statements, Moore's "Here is a hand" *as he presents it*). Their truth or justification is immediately apparent or immune to error.
          *   **Propositional & Justificatory:** They are genuine *beliefs* (propositional attitudes) that *serve as reasons or evidence* for other non-basic beliefs. They are *within* the space of reasons and justification.
          *   **Fixed & Certain:** While some foundationalisms allow for revisability, the core basic beliefs are typically seen as epistemically secure anchors.
      *   **Structure:** Non-basic beliefs are justified *inferentially* by their connection to the basic beliefs. The basic beliefs are the ultimate *grounds*.

  2.  **Wittgenstein's Hinge Propositions: The Crucial Differences:**
      *   **"Groundless" vs. Self-Justifying:** This is the most radical point. Hinges aren't held because they are *self-evident* or *incorrigible*. They aren't "known" in the standard sense at all. They lack justification *precisely because they are the framework within which justification makes sense*. Trying to justify "The Earth has existed for a long time" is nonsensical – *what evidence could possibly count for or against it* without already presupposing a vast structure built *on* it? Their certainty is **animal** or **inherited**, not rational.
      *   **Not Beliefs (in the standard sense), but Certainties:** Wittgenstein often avoids calling them "beliefs." They are more like **ungrounded ways of acting**, **"standfast" certainties**, or the **"scaffolding"** of our thoughts. We don't *hold* them as propositions we assent to after reflection; we *act* on them without doubt. Doubting them isn't wrong; it's *meaningless* or paralyzing ("If you tried to doubt everything you would not get as far as doubting anything" - OC 115).
      *   **Enabling Framework, Not Justificatory Foundation:** Hinges are not *reasons* for other beliefs. They are the **preconditions** for having beliefs, asking questions, gathering evidence, and engaging in justification *at all*. They define what counts as a reasonable doubt, a relevant question, or valid evidence *within a particular language-game or world-picture*. They are the **river-bed** through which the water (questions, justifications, doubts) flows, not a source *feeding* the river.
      *   **Dynamic & Contextual (The River-Bed):** Unlike often static foundationalist bases, hinges are dynamic. While fundamental hinges ("There are physical objects") are very stable, others can shift over time or context. What is a hinge in one investigation (e.g., "This is my hand" in a perceptual experiment) might become an object of inquiry in another (e.g., a neurological study). The river-bed shifts, albeit slowly.
      *   **Non-Propositional Role (in use):** While we *formulate* them as propositions ("Here is a hand"), their primary role isn't as *assertions* within a justificatory chain. Their role is manifested in our **actions** and our inability to sensibly doubt them in practice. They are shown in what we *do*.

  **Addressing Your Core Questions:**

  1.  **Can something "groundless" stop the regress?**
      *   **Yes, but differently.** Foundationalism stops the regress *within* the justificatory game by finding intrinsically justified starting points. Wittgenstein stops the regress by showing that the demand for justification *itself* hits bedrock – not a bedrock of self-justifying *beliefs*, but a bedrock of **ungrounded action and practical certainty**. The regress ends not because we find a secure foundation *for* justification, but because we reach the point where justification *itself* becomes nonsensical. The "stopping" is a shift in perspective: from seeking justifications *for* the framework to recognizing the framework *as the condition for possibility* of any justification. It's not an epistemic *ground*; it's the *logical space* within which epistemic grounding occurs.

  2.  **Is "foundationalism" the right label?**
      *   **No, not accurately.** Calling Wittgenstein a foundationalist is misleading, despite the superficial similarity of "halting the regress."
      *   **Rejection of the Justificatory Presupposition:** Foundationalism *accepts* the demand for justification and tries to meet it by finding secure starting points. Wittgenstein fundamentally *challenges* the idea that *everything* needs or can have justification. He argues the demand for justification *presupposes* the very hinges it might try to justify. Foundationalism operates *within* the justificatory picture; Wittgenstein offers an **alternative picture** where justification is a *local* activity occurring *against* a background of groundless certainty.
      *   **Nature of the "Base":** Foundationalism's base consists of *justified true beliefs*. Wittgenstein's base consists of *ungrounded certainties manifested in action* that are *neither justified nor unjustified* – they are logically prior to that distinction. They are enabling *conditions*, not epistemic *foundations*.
      *   **Alternative Labels:** Wittgenstein's view is often described as a form of **Contextualism** (justification occurs within a context of shared certainties), **Anti-Foundationalism**, or a **Therapeutic** approach dissolving the philosophical problem of radical skepticism by exposing its nonsensical presuppositions.

  **Conclusion:**

  Your instinct is correct. While hinge propositions *functionally* halt a kind of regress, Wittgenstein's conception is radically different from foundationalism. The insistence on their **groundlessness**, their status as **ungrounded ways of acting** rather than self-justifying beliefs, their role as the **enabling framework** rather than the justificatory foundation, and the **dynamic, contextual** river-bed metaphor mark a genuine departure. Wittgenstein isn't offering a *better* or *different kind* of foundation within the traditional justificatory framework. He's arguing that the *entire picture* of knowledge requiring universal justification resting on secure foundations is misguided. He replaces the foundationalist metaphor of a building on bedrock with the metaphor of a river flowing within shifting banks – the hinges are the banks that make the flow (of language, inquiry, justification) possible, not the bedrock *under* the river. He isn't *solving* the regress problem within epistemology; he's *dissolving* it by showing how the demand for ultimate justification misunderstands the nature of our basic certainties. Your friend sees the halting of regress; Wittgenstein sees a shift from justification to the practical, lived certainty that makes justification conceivable.
