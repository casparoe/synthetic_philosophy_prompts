  ## The Phantom Jury

  The ink on the caricature was barely dry, its cruel lines still glistening under the lamplight. Meïr Goldschmidt, editor of *The Corsair*, traced the exaggerated curve of Søren Kierkegaard’s trouser leg – drawn impossibly mismatched, a visual punchline hammering home the philosopher’s perceived eccentricity. The caption, penned by one of Goldschmidt’s sharpest wits, was already setting type downstairs: *"The Thinker Who Stands on One Leg (Philosophically Speaking)."* Goldschmidt felt the familiar, acidic thrill of the hunt. He’d published Kierkegaard’s own challenge to the paper – practically an invitation to be skewered. Now, the trap was sprung.

  Down in the print room, the air thrummed with the rhythmic clatter of the press. Sheets flew, each one multiplying the image, the joke, the judgment. Peder, the senior typesetter, inked a roller without looking up. "Strong one this week, Herr Goldschmidt. That trouser-leg…" He chuckled, a dry, rasping sound. "They’ll be talking."

  *They.* That was the word. Not "readers," not "subscribers," not even "Copenhageners." *They.* An entity Goldschmidt conjured daily in his editorials, fed with scandal and satire, and unleashed upon his chosen targets. He imagined *them* now: faceless, murmuring over breakfast tables, chuckling in coffee houses, repeating the joke about the mismatched trousers. *They* saw Kierkegaard not as a complex, tormented soul, but as a ridiculous silhouette, flattened by the press.

  Kierkegaard’s initial reaction wasn’t fury, but bewilderment. He’d expected critique, argument, perhaps even vitriol directed at his ideas. Instead, *The Corsair* offered only the trouser-leg. And the hat. And the walk. Each week, a new absurdity, meticulously illustrated and widely distributed. Goldschmidt watched, fascinated and slightly unnerved, as the philosopher became a public spectacle, a walking joke. People Goldschmidt knew – respectable merchants, academics he occasionally drank with – would smirk and nudge each other when Kierkegaard passed, muttering about trousers or hats. Yet, when Goldschmidt pressed them individually – "Do *you* truly believe Søren Kierkegaard is defined by his attire?" – they’d blink, shuffle, offer a non-committal "Well, *The Corsair* says…" or "Everyone’s talking about it." The individual dissolved, hiding behind the pronouncements of *them*.

  Goldschmidt found himself walking the same streets Kierkegaard haunted, observing the phenomenon he’d unleashed. He saw a bookseller, a man who stocked Kierkegaard’s challenging works, laughing heartily with a customer over the latest *Corsair* cartoon depicting the philosopher attempting to climb an invisible ladder of abstraction. Later, Goldschmidt entered the shop. "Busy day?"

  "Ah, Herr Editor! Always busy when *The Corsair* lands!" the bookseller beamed. "That ladder cartoon… priceless!"

  "You admire Kierkegaard’s work, though?" Goldschmidt asked casually, picking up a volume of *Either/Or*.

  The bookseller’s smile faltered. "Well… yes. Complex chap. Deep. But…" he gestured vaguely towards the street, "...you know how it is. *The Corsair*… it just captures something, doesn't it? What *people* see." He wouldn't meet Goldschmidt’s eye. The individual admiration was there, buried, but silenced by the louder voice of the phantom public *The Corsair* had conjured and catered to.

  The attacks escalated. Not just trousers, but insinuations about his character, his broken engagement, his melancholia – all rendered as grotesque cartoons or sly, anonymous paragraphs. Goldschmidt commissioned it all. He felt like a puppeteer manipulating a vast, invisible crowd. He’d write a barbed editorial about Kierkegaard’s "un-Danish seriousness," and within days, he’d overhear snippets of conversation in taverns parroting the phrase, detached from any understanding, wielded as a casual, anonymous stone. The "public" agreed. Who was the public? Everyone. And no one.

  One rain-lashed afternoon, seeking a break from the ink and noise, Goldschmidt ducked into a small, quiet church. He wasn’t pious, but the stillness offered respite. In a shadowed pew near the front, a solitary figure sat hunched. The posture, the curve of the shoulders beneath a damp coat – unmistakably Kierkegaard. Goldschmidt froze. He saw the tension in the man’s neck, the white-knuckled grip on the pew in front. This wasn't the abstract "target" of *The Corsair*'s satire; this was a man being slowly crushed. Crushed by *what*? By Goldschmidt? By Peder the typesetter? By the bookseller? By any single one of the thousands who chuckled over the cartoons? No. By the sheer, weightless, pervasive pressure of *Them*. The phantom jury Goldschmidt had empowered, a jury where no one held the gavel, no one bore the blame, and the verdict was delivered not in words, but in smirks, whispers, and the relentless, flattening force of anonymous consensus.

  Goldschmidt slipped out before he was seen. The rain felt colder now. He walked past a wall plastered with torn *Corsair* posters, the ink bleeding in the downpour. The caricatures – Kierkegaard with a giant quill pinning himself to the ground, Kierkegaard arguing with his own shadow – were dissolving into grey sludge. He thought of Peder’s chuckle, the bookseller’s deflection, the merchant’s smirk. *They* weren't real. *They* were a vapor, coalescing around the latest print run, only to dissipate the moment you tried to grasp an individual conscience. Yet, this vapor could erode stone, could break a man who dared stand apart, defined by his own singular, un-leveled thoughts.

  Back at *The Corsair*, the next issue was being planned. A young writer eagerly pitched an idea: Kierkegaard portrayed as a scarecrow, ineffective against the crows of public opinion, his philosophical tracts scattered as useless straw. "It’s perfect, Herr Editor!" the young man enthused. "What *everyone* feels!"

  Goldschmidt looked at the eager face, then at the blank layout page waiting to be filled. He saw the phantom public stirring, hungry for the next leveling. He saw the scarecrow image, sharp and cruel. He saw the solitary figure in the rain-slicked church pew, bearing the weight of the faceless *them*.

  "Perfect," Goldschmidt echoed, his voice flat. "Set it up." He turned towards his office, the familiar thrill now tasting like ash. He was the summoner, feeding the phantom. And the phantom, he realized with a chill that had nothing to do with the damp, was beginning to demand its tribute from the summoner too. The leveling ground was vast, and it tolerated no one standing tall for long. Not even its creator. The press clattered on, a mechanical heartbeat for the bodiless crowd.
