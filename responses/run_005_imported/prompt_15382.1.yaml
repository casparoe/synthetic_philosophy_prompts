answer: |-
  Based on Douglass's specific interpretive method forged against Garrison and Taney, I believe he would **vehemently reject the restrictive reading** of the 14th Amendment's Citizenship Clause regarding children born to undocumented parents. Here's a step-by-step reconstruction of his reasoning applied to this modern dispute:

  1.  **Primacy of Text Over Subjective Intent & Practice:** Douglass broke with Garrison precisely because Garrison focused on the framers' *intent* (pro-slavery compromises) and the nation's *practice* (upholding slavery) to condemn the Constitution. Douglass insisted the *actual words* ("person," "people," avoidance of "slave/slavery") mattered more. Applied to the 14th Amendment, Douglass would prioritize the phrase "subject to the jurisdiction thereof" *as written*, rather than speculative historical debates about whether the framers *intended* it to cover children of non-citizens present without authorization. He would dismiss arguments relying heavily on the (ambiguous) historical intent of the 39th Congress regarding immigration status as akin to Garrison's focus on the 1787 framers' intent regarding slavery.

  2.  **Broad, Literal Meaning of "Jurisdiction":** Douglass's textualism sought the most inclusive, literal meaning consistent with principle. He argued the Constitution's use of "person" *must* include Black people because they were literally persons. For "subject to the jurisdiction," he would look at its plain, functional meaning: Does the child fall under the enforceable authority of U.S. laws? A child born on U.S. soil to undocumented parents is unquestionably:
      *   Subject to U.S. criminal and civil law.
      *   Protected by U.S. laws (e.g., child welfare, labor laws).
      *   Required to obey U.S. laws.
      *   Within the territorial sovereignty of the U.S.
      The recognized exceptions at the time of ratification (children of foreign diplomats, hostile occupying forces, sovereign Native American tribes) involved individuals explicitly *not* subject to U.S. law due to recognized external sovereignty or immunity. Undocumented immigrants, while violating immigration law, are still fully *subject to* the vast majority of U.S. laws – a key distinction Douglass would emphasize.

  3.  **Rejection of Implied Exclusions Based on Status:** Taney in *Dred Scott* argued that Black people's historical exclusion *proved* they weren't meant to be citizens, regardless of the text's potential breadth. Douglass countered that the text itself ("persons," "people") contained no such exclusion. Applying this to the Citizenship Clause, Douglass would argue the text "All persons born... subject to the jurisdiction" contains *no* exception based on parental immigration status. Creating such an exception based on perceived undesirability or legal status of parents would mirror Taney's logic of exclusion based on race/ancestry – a method Douglass explicitly repudiated.

  4.  **Purpose Aligned with Broad Inclusion & Anti-Caste:** Douglass's textualism wasn't purely mechanical; it was driven by the Constitution's *declared* purpose of securing liberty and justice. He saw the *potential* for freedom in the text's language. The 14th Amendment's core purpose was overturning *Dred Scott* and establishing birthright citizenship, particularly for Black Americans, to eliminate a racial caste system. Douglass would interpret "jurisdiction" in a way that furthered this purpose of broad inclusion and prevented the creation of a new hereditary underclass of non-citizens born on U.S. soil based solely on parental status. A restrictive reading would create exactly such a caste.

  5.  **Focus on the Individual's Status, Not the Parents':** Just as Douglass argued for the recognition of Black people as individuals ("persons") under the Constitution, irrespective of their ancestors' status, he would focus on the status of the *child* born on the soil. The child's own relationship to U.S. jurisdiction at birth, not the parents' legal status, would be paramount under his textual reading. The child is born here and immediately subject to U.S. laws.

  **Could His Method Be Invoked by Either Side Today?**

  *   **By Restrictionists? With Difficulty and Contradiction:** Restrictionists *try* to invoke textualism ("jurisdiction" must mean something specific!). However, to make their case compelling, they must heavily rely on *original intent* arguments about the 39th Congress potentially not contemplating modern immigration patterns – the *very type of argument* Douglass rejected when used by Garrison and Taney. Using Douglass's *name* for this purpose would be deeply ironic and historically inaccurate. His method was forged to *expand* inclusion by *downplaying* restrictive intent, not to justify new exclusions based on it. Invoking Douglass for restriction requires ignoring the core thrust of his interpretive revolution against exclusionary readings.
  *   **By Inclusionists? Directly and Coherently:** Proponents of birthright citizenship can directly and powerfully invoke Douglass's method:
      *   "Focus on the text's actual words: 'All persons born... subject to the jurisdiction.'"
      *   "The child born here is literally a 'person' and literally 'subject to the jurisdiction' of U.S. laws."
      *   "The text contains no exception for parental immigration status."
      *   "Do not import exclusions based on speculation about historical intent that contradict the plain meaning and the Amendment's purpose of broad inclusion, just as Douglass warned against doing with race and slavery."
      *   "Reject the creation of a hereditary caste of the native-born excluded from citizenship, a concept antithetical to the principle Douglass fought for."

  **Conclusion:** Frederick Douglass's specific anti-Garrisonian, anti-Taney textualism – prioritizing the Constitution's inclusive language ("persons," "people," "jurisdiction") over exclusionary framers' intent or historical practice, and reading text to maximize liberty and prevent caste – would lead him firmly to support birthright citizenship for children born on U.S. soil to undocumented parents. His method, centered on textual breadth and principle to overcome historical exclusion, aligns perfectly with the inclusionist reading of the 14th Amendment. While restrictionists might try to borrow the mantle of "textualism," using Douglass's *specific method and legacy* to support their cause would be a profound misrepresentation of his intellectual journey and the tool he forged to dismantle, not erect, barriers to full membership in "We the People." His method remains a powerful weapon *for* inclusion in today's citizenship debate.
