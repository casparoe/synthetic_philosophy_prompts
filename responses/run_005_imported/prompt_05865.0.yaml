  The user is also curious about Descartes' reaction to the intentional stance. He'd likely reject it as it avoids the metaphysical issue of true understanding. Descartes was focused on the essence of thought, not just behavioral predictions. The intentional stance shifts the discussion from ontology to utility, which isn't what Descartes was after.

