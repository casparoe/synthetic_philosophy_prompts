answer: |-
  Here’s the strongest case for preserving Adams’s Thesis (the Equation) while rejecting unrestricted Import-Export (I-E), framed to address your core concerns:

  ### The Core Argument: Why the Equation is Non-Negotiable
  1. **Empirical and Conceptual Primacy of the Equation**:
     - **Cognitive Anchoring**: The Equation directly captures how humans *evaluate* simple conditionals ("If it rains, the match is canceled"). We assess P(B|A), not P(A ⊃ B) or other truth-functional candidates. This is empirically validated in psychology (e.g., Evans, Over) and underpins reasoning under uncertainty.
     - **The Cost of Abandoning Truth-Aptness**: Denying conditionals have truth conditions severs their connection to belief revision, logical consequence, and embedding in larger arguments (e.g., "Either if A then B, or if C then D"). While assertability *tracks* P(B|A), it cannot explain *why* we use conditionals in probabilistic modus ponens or reductio arguments.
     - **Triviality as a Diagnostic Tool**: Lewis’s result isn’t just about I-E; it shows *any* truth-conditional semantics satisfying the Equation collapses to triviality under modest assumptions. Sacrificing truth-aptness isn’t "saving" the Equation—it’s conceding conditionals *can’t* have propositional content *because* of the Equation’s force. This underscores the Equation’s fundamentality.

  2. **I-E’s Vulnerability: The Case for Restriction**:
     - **I-E is Not Self-Evident for Deep Nesting**: While I-E holds for simple cases ("If you clean the kitchen, then if you take out the trash, I'll pay you" ≈ "If you clean the kitchen and take out the trash, I'll pay you"), it lacks intuitive traction for deeper embeddings ("If A, then if B, then if C, D"). Ordinary language rarely nests conditionals deeply, so intuitions here are untested or weak.
     - **Probabilistic Instability**: I-E + Equation forces probabilistic constraints that conflict with *learning*. Consider:
       - Let H = "The coin is fair", A = "Heads on toss 1", B = "Heads on toss 2".
       - By I-E: P(If H, then if A, B) = P(If H and A, B).
       - By Equation: LHS = P(B | H ∧ A) = 0.5; RHS = P(B | H ∧ A) = 0.5. *This works*.
       - Now observe ¬A (Tails on toss 1). Update probabilities by conditionalizing.
       - Post-update: P(If H, then if A, B) should *still* reflect P(B | H ∧ A), but H ∧ A is now contradicted. Standard probability theory struggles with conditional probabilities given false antecedents, but I-E+Equation forces dependencies that persist incoherently after learning ¬A. **Deep nesting amplifies this instability**, creating artifacts unrelated to rational belief revision.

  3. **Why I-E *Seems* Universal: Shallow Embedding and Pragmatics**  
     - **The Illusion of Generality**: We endorse I-E because we only encounter 1-2 levels of nesting. At these depths, probabilistic models *approximate* I-E under the Equation when P(A) is high (so P(B|A) ≈ P(B|A ∧ C) for plausible C). We mistake a useful heuristic for a law.
     - **Pragmatic Rescue**: In context, uttering "If A, then if B, C" often pragmatically implies A is possible, and B is relevant to A. This licenses treating it like "If A∧B, C". But when A or B are themselves complex conditionals, this implicature fails.

  4. **Superiority Over Stalnaker/Lewis**  
     Rejecting I-E *while keeping truth conditions* (à la Stalnaker/Lewis) loses the Equation entirely. For them, P(If A, B) ≠ P(B|A). This:
     - **Contradicts Empirical Data**: People’s probability assignments align with P(B|A), not P(A > B) (where ">" is Stalnaker’s conditional).
     - **Creates a Mismatch in Rational Action**: We decide *as if* P(If I do X, Y) = P(Y|X). If this is miscalibrated (e.g., P(A > B) ≫ P(B|A) when P(A) is low), it licenses irrational choices.
     - **Offers No Replacement**: Stalnaker/Lewis lack a *general* rule for the probability of conditionals. Adams’s Thesis *is* that rule. Sacrificing it leaves conditionals probabilistically ungrounded.

  ### A Principled Restriction: Where I-E Fails
  Reject I-E *only for cases where the antecedent of the outer conditional is itself conditional*. Formally:  
  - **I-E Holds**: "If A, then if B, C" ≡ "If A ∧ B, C" **when A is non-conditional**.  
  - **I-E Fails**: "If (if D, E), then if B, C" may not reduce to "If (if D, E) ∧ B, C".  

  **Why this restriction?**  
  - **Compositionality**: When A is non-conditional, "If A, then ..." embeds into a standard propositional context. When A is *itself* conditional, embedding creates higher-order uncertainty that resists Boolean simplification.  
  - **Probability Preservation**: The Equation can hold universally *if* I-E is restricted. Deeply nested conditionals express complex, irreducible probabilistic dependencies (e.g., "If the reactor fails if the coolant leaks, then the alarm sounds" involves layered uncertainties that shouldn’t collapse).

  ### Conclusion
  Preserving the Equation is essential because it is the *sine qua non* of rational reasoning with uncertain conditionals. I-E, while intuitive for simple cases, is a collateral casualty of this commitment when stretched beyond its empirical and probabilistic support. The restriction above honors I-E where it matters (ordinary language) while blocking triviality. Crucially, this approach:  
  - Keeps conditionals truth-apt, integrating them with logic and belief.  
  - Explains why I-E *feels* obvious (shallow use + pragmatics).  
  - Avoids the ad hocness of Stalnaker/Lewis by retaining a probabilistic foundation.  

  Your friend’s assertability model is elegant but renders conditionals epistemically inert. The Equation is the bridge between conditionals and action; I-E is a plank on that bridge that only holds where the supports are solid. Sacrifice the plank, not the bridge.

  ---

  *Key References*:  
  - Lewis, D. (1976). Probabilities of Conditionals and Conditional Probabilities.  
  - Adams, E. (1975). *The Logic of Conditionals*.  
  - Kaufmann, S. (2005). Conditioning against the grain. *Journal of Philosophical Logic*.  
  - Bradley, R. (2007). A Defence of the Ramsey Test. *Mind*.
