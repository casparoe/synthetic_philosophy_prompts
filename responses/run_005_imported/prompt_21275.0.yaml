  Okay so I've somehow ended up filling in as guest host for one episode of a friend's philosophy-of-science podcast (still not sure why they trust me with this), and the guest is a philosopher of biology who's built a chunk of her career defending the position that Popper had it right the *first* time when he called natural selection a "metaphysical research programme" rather than a genuinely falsifiable theory -- and that his famous 1978 recantation in the Dialectica paper was basically a face-saving retreat rather than a real change of mind. Her take is that he just quietly shifted from talking about the bare principle of natural selection to a bundle of seperate, specific auxiliary hypotheses (heredity is faithful, variation comes from mutation, etc) that were always testable and were never really what the original tautology charge was about. I've been reading rationalist blogs and forums for like a decade now -- got into the Popper stuff originally through Deutsch's Beginning of Infinity, then fell down a rabbit hole of old talk.origins and NCSE threads trying to figure out what Popper actually said versus what creationists claim he said -- so I know the rough shape of this dispute, but I don't trust myself to improvise good pushback live if she starts running the strong version of her case on me.

  Can you draft me 8-10 interview questions for this? I don't want anything where she can just restate "fitness is circularly defined, so survival of the fittest just means survival of the survivors" and call it a day -- I want questions that engage with the actual structure of the dispute. At minimum: one question that presses on whether the 1978 recantation really addressed the original tautology worry or just quietly changed the subject to the auxiliary hypotheses, one that has her distinguish Popper's complaint about natural selection from his seperate charge that Marxism and Freudian psychoanalysis were pseudo-scientific (is it the same flavor of unfalsifiability or something structurally different?), and one connecting all this to later adaptationist-programme fights -- Gould and Lewontin's spandrels critique especially -- since that feels like exactly the kind of case she'd want to reach for. And for each question, give me a quick note on the answer she's most likely to give plus a follow-up for it, so I'm not just sitting there nodding when she delivers the line she's obviously rehearsed a hundred times.
