  Okay so I went down a rabbit hole on the "absent-minded driver" problem a while back — the one where a guy needs to take the second of two exits on a highway to get home, except the two exits look exactly the same so whenever he actually reaches one he can't tell if its the first or the second. I think I get why the best overall plan for how often to keep driving vs exit doesn't match what feels like the smart move once your actually sitting at the exit deciding in the moment, but I'm not totally sure I understand the real underlying issue vs just this one driving example. Could you make up a totally different scenario — nothing with roads or driving — that has that exact same structure (you might be facing the literal same decision point for either the first or second time with zero way to know which), and point out where that same planning-vs-in-the-moment gap shows up in it?
