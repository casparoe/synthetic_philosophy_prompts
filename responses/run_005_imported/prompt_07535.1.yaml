prompt: |-
  I'm on the grievance committee for a small writers' organization -- we run a residency and a bunch of workshops for fiction writers. We've got a case where a longtime instructor reduced a student to tears with a genuinely cruel critique last spring; he admits it, but says it happened during a manic episode, and he's got years of records backing up the bipolar diagnosis. Half the committee wants to pull him from teaching for good, same as we'd do for any other misconduct case. The other half wants to call it a health leave instead of a disciplinary matter, since he "wasnt really himself" that week. A few of us find that second option weirdly unsatisfying too -- it feels like it lets everyone off the hook, including, in a strange way, the student who got hurt and is owed more than a shrug. Can you draft the memo I'd bring to the committee recommending what we actually do, with concrete next steps and a timeline? I want it to actually wrestle with whether "he wasn't himself" is a good enough reason here, not just assume the sympathetic read is obviously the right one.
reasoning: |-
  Okay, the user is on a grievance committee for a writers' organization dealing with a sensitive case. An instructor gave a cruel critique during a manic episode, admitted it, and has a documented bipolar diagnosis. The committee is split: half want permanent removal, half want health leave. The user feels neither option fully addresses the harm to the student or accountability. 

  Hmm. The core tension here is balancing compassion for mental health with accountability for harm. The user's discomfort with "he wasn't himself" as an excuse is valid—it risks minimizing the student's experience. But outright dismissal feels punitive given the medical context. 

  First, I need to reframe this not as "discipline vs. health" but as "safety + repair." The student's trauma is real regardless of intent. The instructor's illness explains but doesn't erase the impact. 

  Key angles to cover: 
  - Concrete repair for the student (apology? workshop refund?) 
  - Instructor's path to return (treatment compliance verification, critique retraining) 
  - Systemic fixes (better crisis protocols, critique guidelines) 

  The timeline should move fast for the student's sake (2 weeks max for initial response) but allow realistic rehab for the instructor (6+ months). 

  Biggest pitfall to avoid: letting "mental health" become a blanket pardon. The memo must stress that accommodations require demonstrable effort to prevent recurrence. Also, the org's liability if they ignore the risk of future episodes. 

  ...Wait, did the student even want an apology? The user didn't say. Better make that optional in the draft. And "health leave" needs clear metrics—not just time passing, but proof of stability. 

