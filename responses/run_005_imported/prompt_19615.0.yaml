  That is, if we assume (P ∨ ¬P) leads to a contradiction, then we get a contradiction.

  How? We assume H: (P ∨ ¬P) → False, and we must derive False.

  Note that H says: "if you give me a proof of P∨¬P, I'll produce a contradiction".

  But we don't have a proof of P∨¬P? So how do we use H? We can try to build a proof of P∨¬P? But we don't have one. Instead, we can show that H itself leads to a contradiction.

