  Assume H: (P ∨ ¬P) → False.

  Now, note that we can also form ¬P, which is P→False.

  But observe: we can prove ¬P by assuming P and then showing that from P we can get P∨¬P (by left) and then H would give False. So:

    Inside the proof, we have:

    - To prove ¬P: assume HP: P. Then we have P∨¬P by (or_introl HP). Then apply H to it to get False.

    So we have ¬P.

  But now, from ¬P we can form P∨¬P again, this time by (or_intror ...) with the ¬P we just built. Then again, apply H to that to get False.

  Therefore, from the assumption H we get False. So we have shown (H: (P∨¬P)→False) → False.

  This is the proof.

  But why can't we get P∨¬P from ¬¬(P∨¬P)? Because double negation elimination is not an admissible rule in intuitionistic logic.

  In classical logic, we have DNE: ∀Q, ¬¬Q → Q. But in intuitionistic logic, we do not. The reason is that intuitionistic logic is based on constructive proofs: to prove P∨¬P, we must be able to decide which one holds (either P or ¬P) and provide a proof for it. Without additional axioms, we cannot decide an arbitrary proposition P.

  The double negation ~~Q is a weaker statement than Q. It says that Q cannot be refuted. But it does not necessarily give a proof of Q. In the case of Q = P∨¬P, we have shown that it is impossible to refute P∨¬P. But we haven't constructed a proof of P∨¬P because we don't have a way to decide P.

  To see what breaks when we try to prove DNE for arbitrary Q, consider the attempt to prove DNE: 

    Theorem DNE : forall Q, ~~Q -> Q.

  How would we prove it? We might try:

    intros Q H.   (* H: (Q->False)->False *)

  Now we are stuck because we have no way to get Q from H. We don't have any way to construct a proof of Q. In classical logic, we would just assume that either Q is true or not and then do case analysis, but that is using excluded middle! In fact, DNE and LEM are equivalent in classical logic.

