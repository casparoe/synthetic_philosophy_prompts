  Perhaps the deepest divergence is teleology. Virtue ethics asks "What should I become?" Role ethics asks "How should we relate?" The former centers individual flourishing; the latter concerns relational harmony. This isn't reconcilable through terminology - it reflects Confucianism's radical social ontology.

