prompt: |-
  I write historical fiction, and I recently sent a chapter to two friends who know more medieval political theory than I do. In it, a lord assassinates the duke he served, calls him a tyrant, and defends the killing afterward in a speech invoking Aquinas. My friends ended up arguing about whether the speech holds up, and I'd like a third opinion on their exchange, not just on who won.

  Mara said the speech misuses Aquinas: the duke inherited his title lawfully and turned tyrannical only in how he ruled, and Aquinas restricts killing such a ruler to the community acting through its proper public authority, not to any private person's own judgment, however wronged.

  Dev objected that the lord isn't "any private person": he is one of the few peers whose consent the duchy's charter requires for new taxes, so he belongs to the institution that traditionally checks the duke.

  Mara replied that Aquinas's worry is precisely that people judge badly in their own cause, and letting one councilor's rank substitute for a collective act is exactly what he warns against — it's how usurpation gets relabeled liberation.

  Dev came back that this makes the doctrine self-defeating here: the duke stopped summoning the council years ago and had two of its members quietly killed, so no body capable of "public authority" still exists. If resistance is only licensed through institutions a thorough tyrant can dissolve, doesn't the doctrine guarantee that the most ruthless tyrants are the safest?

  Could you go through the exchange move by move, saying who has the stronger reading of Aquinas at each step, and close with what, if anything, both of them are missing?
reasoning: |-
  Okay, the user writes historical fiction and has a scenario where a lord assassinates a duke, calling him a tyrant, and defends it with Aquinas. They sent this to two friends, Mara and Dev, who debated the theological and political validity of the speech. Now they want a third opinion on the exchange, not just who won, but a move-by-move analysis of who has the stronger reading of Aquinas at each step and what both might be missing.

  First, I need to recall Aquinas's actual views on tyranny and resistance. From what I remember, in his work "De Regno" and "Summa Theologica," he discusses that a tyrant can be resisted, but it's heavily qualified. He distinguishes between tyrannical rule and usurpation, and emphasizes that only the community or public authority can act against a tyrant, not private individuals. This is to prevent chaos and personal vendettas. The key point is that the action must be collective, not individual, to avoid replacing one tyranny with another.

  Now, looking at Mara and Dev's arguments: Mara starts by saying the speech misuses Aquinas because the duke inherited lawfully but ruled tyrannically. She points out that Aquinas restricts killing such rulers to the community acting through proper authority, not private judgment. That seems solid based on Aquinas's texts, where he explicitly warns against private individuals taking action due to bias and potential for error.

  Dev counters that the lord isn't a private person because he's part of the council that checks the duke, as per the duchy's charter. He's arguing that the lord's institutional role makes him part of the public authority. But Aquinas's idea of "public authority" likely means the collective body, not individual members acting alone. Dev's point might stretch Aquinas too far, as Aquinas emphasizes community action to prevent usurpation.

  Mara responds by doubling down on Aquinas's worry about biased judgment. She says letting one councilor act alone is exactly what Aquinas warns against. This is strong because Aquinas's texts repeatedly stress the danger of individuals acting in their own cause, which could lead to chaos. Even if the lord has a formal role, acting solo contradicts the collective requirement.

  Dev then argues that the doctrine becomes self-defeating because the duke dissolved the council and killed members, so no public authority exists to act. He questions whether Aquinas's framework protects ruthless tyrants who dismantle institutions. This is a practical critique. Aquinas doesn't address dissolved institutions directly; his focus is on the ideal of public authority. Dev's point highlights a real-world problem in applying medieval theory, but it's more of an extension than a direct interpretation of Aquinas.

  Assessing who has the stronger reading at each step: Mara's initial point is textually accurate. Dev's institutional argument is weaker because Aquinas doesn't equate individual rank with public authority. Mara's rebuttal about usurpation is strong, aligning with Aquinas's concerns. Dev's dissolution point is compelling as a critique but isn't supported by Aquinas's writings, making it an extrapolation.

  Both are missing deeper context. Mara might overlook that Aquinas wrote for a world where institutions were more resilient, not anticipating their complete dissolution. Dev's real-world challenge exposes a gap in Aquinas's theory, but Aquinas would still prioritize order over individual action. The user's deeper need is to make their fiction plausible, so understanding these nuances helps them decide if the speech works or needs adjustment. They might also want to explore how historical figures navigated such gaps between theory and practice.
answer: |-
  Here's a move-by-move analysis of Mara and Dev's exchange regarding Aquinas on tyrannicide, evaluating the strength of their readings based on Aquinas's actual texts (primarily *De Regno* and *Summa Theologiae* I-II, Q. 42, A. 2 & II-II, Q. 42, A. 2 & Q. 64, A. 3 & Q. 104, A. 6), and concluding with what both might be missing:

  **The Exchange & Analysis:**

  1.  **Mara's Opening Move:** "The speech misuses Aquinas... killing such a ruler [lawful title, tyrannical *exercise*] is restricted to the community acting through its proper public authority, not any private person."
      *   **Strength:** **Strong.** This is the bedrock of Aquinas's position. He explicitly condemns private individuals assassinating rulers, even tyrants, due to the high risk of error, bias, factionalism, and the greater evil of chaos replacing tyranny (*ST* II-II, Q. 42, A. 2; *De Regno* I, 6). He emphasizes the *community* acting through *established procedures* or *public authority* (*auctoritas publica*) as the legitimate path (*ST* II-II, Q. 42, A. 2; *ST* II-II, Q. 64, A. 3 - the latter discussing *publica auctoritate* in the context of capital punishment). Mara correctly identifies the core limitation.

  2.  **Dev's Counter:** "The lord isn't 'any private person'... he belongs to the institution (council) that traditionally checks the duke."
      *   **Strength:** **Moderate/Weak.** While Dev identifies a relevant nuance (the lord's institutional role), he stretches Aquinas too far. Aquinas never equates an *individual* member of a governing body acting *alone* with "public authority." Public authority, for Aquinas, resides in the *office* or the *body as a whole* acting officially, not in an individual councilor taking unilateral lethal action based on personal judgment. Dev's argument risks conflating *status* with *authority to act lethally*. Aquinas's fear of private judgment applies even to nobles.

  3.  **Mara's Rebuttal:** "Aquinas's worry is precisely that people judge badly... letting one councilor's rank substitute for a collective act is exactly what he warns against — it's how usurpation gets relabeled liberation."
      *   **Strength:** **Very Strong.** This directly addresses Dev's overreach and hits the heart of Aquinas's concern. Aquinas repeatedly warns against the passions and partiality of individuals (*ST* II-II, Q. 42, A. 2: "danger would arise if any private person were to attempt to kill a ruler, for it is usually the case that evil persons more frequently undertake deeds of this sort, and they would expose rulers to danger not only when they rule tyrannically but also when they govern justly"). Mara correctly identifies the *individual action* of the lord, even with his rank, as falling precisely into the category Aquinas condemns as prone to error and usurpation. She reinforces the necessity of the *collective* dimension of "public authority."

  4.  **Dev's Final Counter:** "This makes the doctrine self-defeating... the duke dissolved the council and killed members. If resistance is only licensed through institutions a tyrant can dissolve, doesn't the doctrine guarantee the safest tyrants are the most ruthless?"
      *   **Strength (as a practical/political critique):** **Strong.** Dev exposes a genuine and profound tension within medieval resistance theory, including Aquinas.
      *   **Strength (as a reading *of Aquinas*):** **Moderate/Weak.** Aquinas simply doesn't address this scenario directly. His framework assumes the existence of, or possibility to reconstitute, some form of legitimate public authority (like the community itself, or a higher prince/emperor). He doesn't provide a clear mechanism for action when the tyrant has successfully destroyed *all* intermediate legitimate authorities. While Dev's point highlights a *logical consequence* or *practical flaw* potentially inherent in strict Thomistic doctrine when faced with extreme tyranny, it's more of an extrapolation or critique *based on* Aquinas than a direct interpretation *of* his stated position. Aquinas would likely still insist that even in this dire case, private assassination remains illicit, potentially pointing towards rebellion by the *multitude* itself as a last resort (*De Regno* I, 6 mentions the *multitudo* resisting), though he remains vague on the practicalities.

  **Who Has the Stronger Reading of Aquinas at Each Step?**

  1.  **Mara (Strongly)** - Directly quotes core Thomistic principle.
  2.  **Mara (Moderately)** - Dev identifies nuance but misapplies it; Mara's core principle holds.
  3.  **Mara (Strongly)** - Directly counters Dev's overreach with Aquinas's own central concern.
  4.  **Dev (Moderately, as Critique) / Mara (on Aquinas's Text)** - Dev wins the *practical* argument about the doctrine's potential failure mode, but Mara wins on fidelity to Aquinas's *explicitly stated limitations* against private action. Aquinas doesn't provide the solution Dev implies is necessary.

  **What Both Are Missing:**

  1.  **The Ambiguity of "Public Authority" and "Community":** Aquinas is frustratingly vague on *exactly* what constitutes "public authority" or how the "community" acts. Is it the *universitas civium* (the whole body of citizens)? The *maior et sanior pars* (the greater and wiser part)? Existing magistrates? A higher prince? This ambiguity is central to medieval debates and leaves room for interpretation that both Mara and Dev could explore more deeply. Dev tries to fit the lord into this concept, while Mara insists on a stricter collective reading – but Aquinas himself doesn't provide a crystal-clear definition applicable to this scenario.
  2.  **The Role of a "Superior":** Aquinas explicitly allows for a tyrannical ruler to be deposed by *superior authority* (*auctoritate superioris*) (*ST* II-II, Q. 42, A. 2). Does this imply a feudal superior (like a King or Emperor)? A Pope (in certain interpretations)? Neither Mara nor Dev explores whether such a superior exists or could be appealed to in this fictional duchy, which is a key part of Aquinas's framework for addressing tyranny *without* endorsing private action.
  3.  **The Distinction Between *Auctoritas* (Authority) and *Potestas* (Power):** Medieval political theory often distinguished between the legitimate *right* to rule (*auctoritas*) and the mere *ability* to rule (*potestas*). The duke, by dissolving the council and murdering members, may have retained *potestas* but arguably lost legitimate *auctoritas*. Does this loss of legitimacy revert authority to the community or its remnants? Aquinas hints at this but doesn't explicitly state that this legitimizes individual members of a dissolved council acting alone. Both debaters touch on this (Dev's dissolution argument, Mara's usurpation warning) but don't fully engage with the theoretical implications of lost legitimacy.
  4.  **The Context of Aquinas's Writing:** Aquinas was writing in a world where institutions like the Church, Empire, and evolving representative bodies (like early Parliaments) existed. His reliance on "public authority" assumed these structures were resilient or that higher authorities could intervene. He wasn't primarily envisioning a completely isolated, self-contained feudal unit where the tyrant could obliterate all checks without external recourse. Dev's critique highlights this limitation of Aquinas's context, while Mara's strict adherence reflects Aquinas's focus on avoiding anarchy.
  5.  **The Nuance of Tyranny "in Practice" vs. "in Title":** While Mara correctly focuses on tyranny *in practice* (abuse of power by a legitimate ruler), Aquinas *does* discuss tyranny *in title* (usurpation) more favorably for resistance. The friends don't delve into whether the duke's actions (dissolving the council, murdering members) constituted such a fundamental breach of law that he effectively became a *usurper* in Aquinas's eyes, potentially altering the calculus slightly (though Aquinas *still* prefers public authority over private action even against usurpers).

  **Conclusion:**

  Mara consistently offers the **stronger direct reading of Aquinas's explicit texts**, correctly emphasizing his core prohibitions against private judgment and individual assassination, and his requirement for action through public authority or the community. Dev makes a **powerful and valid practical critique** of a potential flaw in the doctrine when faced with a tyrant who successfully destroys all institutional checks, exposing a tension Aquinas didn't fully resolve. However, Dev's attempt to legitimize the *individual lord's* action based on his *former institutional rank* is a significant overreach of Aquinas's principles, which Mara effectively counters.

  For your fiction, the debate itself is incredibly authentic! Aquinas *was* interpreted in diverse and contested ways throughout the Middle Ages and beyond. Your lord's speech, while likely stretching Aquinas beyond his explicit limits (as Mara argues), taps into genuine ambiguities (the nature of "public authority") and exposes a real tension (the self-defeating potential, as Dev argues) within the tradition. This complexity makes the scenario historically plausible, even if a strict Thomist like Aquinas might condemn the specific act.
