  I should also address why rejecting safety isn't better than rejecting KK. If we drop safety, knowledge becomes too easy—lucky guesses could count. Safety ties to anti-luck epistemology. In software, a system that only works 99% of the time isn't safe for critical applications. Similarly, knowledge needs to avoid close-call errors.

