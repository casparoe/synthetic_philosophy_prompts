answer: |-
  You've pinpointed a crucial tension in Quine's work. While introductory accounts often present inscrutability of reference (IOR) as a *consequence* of the indeterminacy of translation (IOT), the proxy-function argument (PFA) strongly suggests **IOR is a distinct, logically prior, and more fundamental thesis.** Let's argue for their independence rigorously.

  **Core Argument for Independence:**

  1.  **Definitional Separation:**
      *   **IOT (Indeterminacy of Translation):** Claims that for any language L1 and radically foreign language L2, multiple translation manuals M1, M2, M3... exist that are *empirically equivalent* (compatible with all possible behavioral evidence concerning stimulus meaning of occasion sentences) yet *incompatible* (assign different sentences of L1 to sentences of L2, implying different analytical hypotheses for sub-sentential parts). It's inherently cross-linguistic and behavioral. Its proof relies on the underdetermination of analytical hypotheses by stimulus meanings.
      *   **IOR (Inscrutability of Reference):** Claims that, even *within a single language L*, the assignment of reference to singular terms and extensions to predicates is not uniquely fixed by the totality of behavioral evidence or by the truth conditions of *all* sentences. Multiple reference schemes are compatible with the same truth-value assignments to all sentences. The PFA provides a formal, intra-linguistic proof.

  2.  **The Proxy-Function Argument as Demonstrating Independence:**
      *   **Setup:** Start with a language L (including its ontology O and reference scheme R). Define a one-to-one (bijective) function f mapping the universe of discourse U onto itself (e.g., f(x) = {x}, f(x) = the cosmic complement of x, f(x) = the spacetime worm of x).
      *   **Reinterpretation (Not Translation!):**
          *   **Singular Terms:** Reinterpret each singular term 'a' as referring to f(the old referent of 'a'). If 'a' referred to rabbit r, it now refers to f(r) (e.g., {r}).
          *   **Predicates:** Reinterpret each n-place predicate 'P' such that its *new* extension is {<f(x1), ..., f(xn)> | <x1, ..., xn> was in the *old* extension of 'P'}. Equivalently, <y1, ..., yn> satisfies the new 'P' iff <f⁻¹(y1), ..., f⁻¹(yn)> satisfied the old 'P'.
      *   **Truth-Value Preservation:** Crucially, **this reinterpretation is defined *within L* itself.** For *any* sentence S of L:
          *   S was true (under R) iff the objects referred to by its terms (under R) satisfied its predicates (under R).
          *   Under the new scheme R_f, the terms refer to f-images, and the predicates are satisfied by tuples iff their f⁻¹-preimages satisfied the old predicates.
          *   Therefore, S is true under R_f iff S was true under R. **Truth values of *all* sentences are preserved.**
      *   **Key Implications for Independence:**
          *   **No Second Language/Manual:** This construction operates entirely *within* L. There is no "source" language L2 being translated into L. We are simply *reinterpreting* L's own vocabulary. The "manual" here is trivial: the identity function mapping L-sentences to L-sentences ("homophonic"). There is no rival *translation manual* in the IOT sense.
          *   **No Stimulus Meaning Underdetermination:** Stimulus meaning concerns assent/dissent dispositions to *whole occasion sentences* triggered by specific sensory stimulations. Since *every sentence*, including all occasion sentences, retains its *exact truth value* under R_f, it retains its *exact stimulus meaning*. Observers would assent/dissent identically under R and R_f. **Behavioral evidence is *completely unchanged*.** IOT relies crucially on the underdetermination of manuals by stimulus meaning; here, there is no underdetermination of stimulus meaning *at all* – it's fixed. Yet reference is radically different.
          *   **Formal Independence:** The PFA demonstrates IOR *without invoking IOT*. It shows that even if we had a *perfectly fixed translation manual* (even the homophonic one!) for a language, the reference of its terms *within that language* remains radically indeterminate. IOR is a constraint on semantic theory *even when translation is taken as given*. The source of IOR here is purely logical/model-theoretic: the inability of truth conditions (even for all sentences) to pin down reference.

  **Why Quine Presents Them as Continuous:**

  Quine *does* frequently link IOR and IOT. Key reasons include:

  1.  **Holism & the Primacy of the Sentence:** Quine's fundamental semantic unit is the *occasion sentence* and its stimulus meaning. Reference is derivative; we only posit referents as needed to explain the truth conditions of sentences holistically constrained by stimulus meaning. From this perspective, the *only* access we have to reference (ours or others') is through translating sentences. If translation is indeterminate, so is reference assignment. The PFA, while intra-linguistic, still relies on this holism – the preservation of *sentence* truth is what allows reference to vary.
  2.  **The Source of Analytical Hypotheses:** In the cross-linguistic case (IOT), the rival manuals arise precisely from different ways of assigning referents to terms via analytical hypotheses. The "rabbit" vs. "undetached rabbit part" indeterminacy *is* generated by competing analytical hypotheses within rival manuals. Quine sees the PFA as revealing that *even within the home language*, the same kind of referential latitude exists, made possible by the same holistic slack between sentences and their parts. He writes in "Ontological Relativity": "The inscrutability of reference is not even inscrutability of the reference of terms relative to that of others; it is inscrutability absolutely." But he immediately grounds this absolute inscrutability in the relativity of translation: "Reference would be less inscrutable if we could point to something and say *what* we are referring to... But we can no more say what we are referring to than we can say what the native is referring to."
  3.  **Epistemological Priority of Behavior:** For Quine, semantics is naturalized; meaning and reference are ultimately constructs from observable behavior (assent/dissent). IOT demonstrates the behavioral underdetermination of meaning/reference *across* languages. The PFA, while formal, is meant to expose that the *same conceptual gap* exists *within* our own theory, even if our behavioral dispositions don't *force* us to acknowledge it practically. The continuity is epistemological: both show semantic facts escaping behavioral determination.

  **Objection: IOR as Generated by Analytical Hypotheses within IOT**

  *   **The Objection:** The standard route to IOR *is* through IOT. When constructing rival translation manuals M1 and M2 for L2 into L1, the manuals incorporate different analytical hypotheses. M1 might map "gavagai" to "rabbit" and posit "gavagai" as referring to rabbits, while M2 maps "gavagai" to "undetached rabbit part" and posits reference to parts. The inscrutability of the reference of "gavagai" *just is* the consequence of choosing M1 or M2. There is no *additional* or *independent* source of IOR; it is wholly generated by the indeterminacy in choosing analytical hypotheses within the broader project of translating sentences. The PFA, while clever, is merely a formal artifact illustrating the *kind* of variation possible within analytical hypotheses, but it doesn't establish a *new* kind of indeterminacy; it just shows that even the homophonic manual is one among many possible analytical starting points *if* we were translating our language into itself.

  *   **Defense Against the Objection:**

      1.  **The PFA Doesn't Rely on Rival Manuals:** The core objection mischaracterizes the PFA. The PFA **does not generate rival *translation manuals* for L into itself.** It generates *rival reference schemes* **within a single, fixed interpretation of the language at the sentential level.** The homophonic "manual" mapping "Rabbit" to "Rabbit" (sentence-wise) is fixed. The variation occurs *underneath* this sentential mapping, in how the *terms* composing those sentences hook onto the world. IOT requires manuals that map *different* L1 sentences onto L2 sentences (e.g., "Lo, a rabbit" mapped to "Gavagai" vs. "Lo, an undetached rabbit part"). The PFA involves no such sentential remapping. All sentences keep their *identical* L-forms. The variation is purely sub-sentential *while holding sentential truth fixed*. This is a different kind of variation.
      2.  **Behavioral Equivalence vs. Formal Permutation:** The rival manuals of IOT are *empirically equivalent* but *logically incompatible* at the sentential level (they assign different L1 sentences to the same L2 sentence). Their equivalence is contingent upon the totality of behavioral evidence. The rival reference schemes of the PFA are *logically equivalent* in preserving *all* sentential truth values *by construction*. Their equivalence is necessary and formal, not contingent on behavioral evidence. The PFA reveals a *structural* underdetermination inherent in the semantics of reference itself, independent of any empirical underdetermination in translation.
      3.  **Scope:** IOT primarily concerns observational and near-observational sentences. The manuals must agree on stimulus meanings. The PFA applies to *all* sentences, including highly theoretical ones far removed from observation ("The number of quarks in the universe is even"). The reference of 'quark' or 'number' can be permuted via a proxy function without changing the truth value of such a sentence. This indeterminacy persists even in the complete absence of IOT for the observational base, as the PFA operates at the level of the whole theory. IOT cannot generate *this* kind of radical, global, intra-theoretic referential indeterminacy for theoretical terms solely from the underdetermination of observational translation.
      4.  **The Primacy of IOR:** The PFA suggests that the *reason* analytical hypotheses are underdetermined in IOT is precisely *because* of IOR. If reference *within* each language were scrutable, then translation would have to preserve reference, severely constraining analytical hypotheses. The slack in analytical hypotheses *exploits* the pre-existing, intra-linguistic slack in reference assignment revealed by the PFA. IOR is the more fundamental logical condition that *enables* the underdetermination of analytical hypotheses in IOT.

  **Conclusion:**

  While Quine emphasizes the continuity between inscrutability of reference and indeterminacy of translation, driven by his holism, behaviorism, and the primacy of the sentence, the proxy-function argument provides a powerful demonstration of their **logical independence**. IOR, as shown by the PFA, is:

  1.  **Intra-linguistic:** It operates within a single language with fixed sentential truth conditions/stimulus meanings.
  2.  **Formal/Model-Theoretic:** It arises from the inability of truth conditions (for all sentences) to uniquely determine reference assignments.
  3.  **Independent of Behavioral Underdetermination:** It holds even when stimulus meaning is completely fixed and there are no rival translation manuals.
  4.  **Logically Prior:** The underdetermination of analytical hypotheses in IOT *presupposes* the kind of referential slack demonstrated by IOR via the PFA; fixing reference would severely constrain translation.

  The PFA reveals IOR as a deep, structural feature of reference itself within a truth-conditional semantic framework. IOT, while incorporating IOR as a consequence of the indeterminacy of analytical hypotheses, is a distinct thesis concerning the empirical underdetermination of *cross-linguistic* meaning assignment by behavioral data. Quine presents them together because both stem from his core semantic holism and behaviorism, and because IOT provides the epistemological context where IOR becomes practically salient. However, the PFA stands as proof that IOR is a more fundamental and general phenomenon, achievable even in the complete absence of the cross-linguistic underdetermination characteristic of IOT. Your advisor's puzzle highlights a crucial nuance often glossed over in introductory treatments: the radical nature of referential indeterminacy "at home."
