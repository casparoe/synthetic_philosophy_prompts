answer: |-
  Here's a 4-5 minute toast focusing on Cicero's "counsel over muscle" argument, tailored for your grandfather and avoiding the problematic bits Priya highlighted. It blends the classical reference with his personal story for a mixed audience:

  ---

  **(Clink glass gently)** Family, friends, esteemed colleagues of Grandad... thank you for gathering to celebrate an incredible milestone: ninety years of a life remarkably well-lived.

  Now, anyone who knows Grandad knows he’s never been one for sitting still – at least, not mentally. Even now, catching him deep in thought, maybe gazing out the window with that familiar look of intense focus… we know the wheels are turning. He might be dissecting a tricky legal point, strategizing about the garden, or mentally drafting his next letter to the editor. The engine’s still running, even if the chassis has seen a few more miles!

  It got me thinking about what *real* vitality means as the years add up. Because let’s be honest, our culture often equates "doing things" purely with physical strength or youthful hustle. Running marathons, scaling mountains… all fantastic, sure. But if that’s the *only* measure of a life well-lived, then age looks like… well, like something’s missing.

  But that’s a narrow view. A very old idea, actually – one a Roman statesman named Cicero tackled head-on over two thousand years ago in an essay called "On Old Age." Cicero argued passionately that judging age solely by what the body can no longer do is like looking at a magnificent oak tree and only seeing that it’s not a sapling anymore. You miss the grandeur, the deep roots, the strength that comes from weathering storms.

  His key point? **True value, especially in later years, shifts profoundly towards wisdom, judgment, and counsel.** He pointed to heroes of Rome’s past. Like Fabius Maximus – the man who saved Rome by *not* charging headlong into battle against Hannibal. They called him "The Delayer," not as an insult, but as a title of respect. His *restraint*, his *strategic patience*, born of experience and seasoned judgment, literally rescued the Republic. It wasn't youthful muscle that won the day; it was the deep understanding of an older mind.

  Or Appius Claudius Caecus – "Appius Claudius the Blind." Cicero tells us that even when age took his sight, Appius’s mind remained razor-sharp. His sons had to describe the Senate debates to him, but *he* was the one who guided their actions, his counsel steering Rome through his profound understanding and moral force. His influence came purely from the power of his intellect and character, long after physical strength had faded.

  **(Turn directly to Grandad, warmth in voice)**
  Grandad, that’s the part of Cicero that resonates so powerfully when I look at you. For nearly *sixty years*, you stood in courtrooms, your voice commanding attention, your mind dissecting arguments, your judgment shaping outcomes. That wasn’t just a job; it was the exercise of a profound skill – the skill of counsel, of strategy, of seeing the deeper currents beneath the surface chaos.

  And the most telling testament? That your old partners, legends in their own right, *still* pick up the phone. They don’t call for someone to lift heavy boxes or run a marathon. They call for the thing that only decades of experience, battle-tested wisdom, and that unique Grandad clarity can provide: **Your counsel.** That invaluable perspective that cuts through the noise, sees around corners, and finds the path others miss. That’s the Fabius Maximus in you. That’s the enduring power of Appius Claudius’s mind.

  Cicero called old age a "harvest," the gathering in of a lifetime of learning and experience. Grandad, looking at you – still sharp, still engaged, still offering that priceless guidance – we see a bountiful harvest indeed. You show us that vitality isn’t diminished with age; it’s *transformed*. It moves from the muscle to the mind, from the sprint to the strategy, from raw power to profound wisdom.

  So, we raise our glasses not just to ninety years, but to the incredible *kind* of strength you embody now. The strength of insight. The strength of perspective. The quiet, formidable strength of a mind that has navigated decades and still lights the way.

  **To Grandad – our family’s Fabius, our own Appius Claudius. May your counsel continue to guide us, and may we all be so fortunate to cultivate such enduring wisdom. Happy 90th Birthday!**

  **(Raise glass high) Cheers!**

  ---

  **Why this works:**

  1.  **Focuses on the Core Argument:** It centers entirely on Cicero's first point: old age isn't empty if we value wisdom and counsel over mere physical prowess.
  2.  **Uses the Requested Examples:** Fabius Maximus (strategy/restraint) and Appius Claudius (counsel despite physical limitation) are explicitly mentioned and tied to the theme.
  3.  **Perfect Fit for Your Grandfather:** Directly links Cicero's ideas to his 60-year legal career and the specific, powerful detail of his partners *still* seeking his counsel. "Our family’s Fabius, our own Appius Claudius" makes the classical reference personal and celebratory.
  4.  **Avoids the Problematic Bits:** No mention of sex drive or the "ripe apple" death metaphor. Stays firmly in the realm of active contribution and enduring mental strength.
  5.  **Accessible to Mixed Audience:**
      *   Explains Cicero's core idea simply ("judging age solely by what the body can no longer do...").
      *   Briefly explains who Fabius and Appius were and *why* they were significant examples for Cicero.
      *   Uses relatable metaphors ("magnificent oak," "chassis has seen a few more miles," "harvest").
      *   Focuses overwhelmingly on the grandfather's tangible, admirable qualities (his career, his current counsel).
  6.  **Celebratory, Not Morbid:** The tone is warm, admiring, and focused on *current* vitality and contribution ("still sharp, still engaged," "lights the way"). The "harvest" metaphor is positive (gathering rewards), not an ending.
  7.  **Undercuts Priya (Subtly):** By showcasing the *valid* and enduring part of Cicero's argument in a real-world context, it implicitly argues against the "copium" label for the *whole* work. You're proving Cicero had a point worth celebrating.
  8.  **Time:** This script, delivered at a natural pace with pauses for warmth and emphasis, should hit the 4-5 minute mark comfortably.

  **Delivery Tip:** Speak warmly and directly to your grandfather, especially during the paragraph addressed to him. Make eye contact with the "law partners" section when mentioning them calling him – they'll appreciate the nod. Keep the energy up – it's a birthday toast!
