  First, I need to unpack the spandrels critique. Gould and Lewontin argued against the adaptationist program, which assumes every trait is an adaptive solution shaped by natural selection. Instead, they highlighted other evolutionary forces: genetic drift, constraints, developmental pathways. Spandrels are byproducts—like the triangular spaces in architecture that become decorated, not designed for that purpose. In biology, traits like the chin might be spandrels, not direct adaptations.

  The user's background in astronomy is key. They understand inference from observation without experimentation. So they might see parallels in evo psych's limitations. They’re looking for a principled way to evaluate claims, something rigorous like in their field. But evo psych often lacks the ability to test hypotheses like physical sciences do.

  The user’s deeper need might be a framework to critically assess evo psych claims. They want to know if there's any reliable method left or if the whole field is suspect. They might also be seeking validation of their skepticism, given their scientific background.

  Key implications of the critique:
  1. **Not all traits are adaptations.** Assuming so is a bias. Traits can be spandrels, drift, etc.
  2. **Testing is hard.** Even predictions can be post-hoc if not stringent. Evo psych studies might claim prediction but actually retrofit data.
  3. **Alternative hypotheses needed.** Rigorous science must consider non-adaptive explanations.
  4. **Methodological flaws.** Evo psych often relies on universality claims without sufficient cross-cultural data, or ignores historical context.

  Principled ways to tell adaptations from spandrels? Tough, but possible with evidence convergence:
  - **Comparative method:** Look at related species. If a trait correlates with an environmental challenge across species, it's more likely adaptive.
  - **Genetic evidence:** If a trait shows signs of recent selection (like specific alleles under positive selection).
  - **Functional design:** Does the trait show complexity and efficiency for a function? But this is tricky because spandrels can be co-opted later (exaptation).
  - **Fossil/archeological records:** Trait emergence timing vs. environmental changes.
  - **Current utility ≠ original function.** A trait might now be useful but wasn't selected for that.

  However, the user’s concern remains: without time travel, we can’t be sure. The best approach is requiring multiple lines of evidence and ruling out alternatives. But even then, confidence might be lower than in experimental sciences.

