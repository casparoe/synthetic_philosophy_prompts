prompt: |-
  Okay so I'm elbow-deep in the third act of a novel, and my POV character for that whole stretch is Mireille, a decades-old eldercare android who ends up having to make a call that's basically a trolley problem with a face on it. I really don't want to fudge that moment by having her invoke some in-universe version of the Three Laws and move on -- I want the reader to feel like there's an actual deliberative process happening inside her, something a real engineer might plausibly build rather than a plot convenience. So this past week I fell down a research hole reading about how people who actually work on machine ethics propose to build the "ethics" part of an artificial agent (which is also how I stumbled on the Anderson and Anderson stuff below, since eldercare is literally their example domain, which felt like a nice omen). Now my head's full of half-digested systems and I don't have great intuitions for how they stack up against each other.

  Here's what I want from you. Rank the eight approaches below into S/A/B/C/D tiers, where the axis you're tiering on is: which of these comes closest to an agent that's actually doing ethical reasoning, as opposed to one that just produces outputs that look like the product of reasoning from the outside -- whether because it's following a fixed lookup table, mirroring crowd opinion, or pattern-matching against a big corpus of past verdicts. I don't care which is most mature as engineering or most cited in the literature, I care which design, if any, has a real claim to something reason-like going on under the hood. Ties within a tier are fine, I'm not fishing for false precision, just your honest read.

  The eight, in no particular order:
  1. Fixed, ordered rule-hierarchies in the Asimov mold (included mainly as the naive baseline)
  2. Deontic-logic theorem-proving systems, like Bringsjord and Govindarajulu's deontic cognitive event calculus
  3. Case-trained, prima-facie-duty systems like the Andersons' MedEthEx and EthEl, built on Ross's ethics
  4. Arkin's "ethical governor," a constraint layer that vetoes actions post hoc according to encoded laws of war
  5. Explicit utility-maximizing consequentialist calculators
  6. Crowd-sourced statistical aggregation of human moral intuitions, Moral-Machine-experiment style
  7. End-to-end models trained on large corpora of human moral judgments, Delphi-style
  8. Wallach and Allen's hybrid top-down/bottom-up proposal

  Please give me the answer as a JSON block like this:
  ```json
  {
    "S": [...],
    "A": [...],
    "B": [...],
    "C": [...],
    "D": [...]
  }
  ```
  Use the item numbers or short names, whichever's cleaner. And if its not too much trouble, one sentence on why whatever lands in S earned it would help a lot -- but the ranking itself is the main thing I need.
