  **Explanation for S-Tier:**
  *   **#3 (Anderson/Ross Systems):** Actively weighs competing *prima facie* duties in context using defeasible reasoning, mirroring human ethical deliberation where principles conflict and require judgment.
  *   **#2 (Deontic Logic Theorem-Proving):** Formally derives obligations/permissions from explicitly stated ethical axioms using logical inference, simulating structured philosophical reasoning under uncertainty.

  **Tier Summaries:**
  *   **S-Tier (Reasoning Core):** Systems that structurally model the *process* of ethical deliberation (weighing duties, logical inference from principles).
  *   **A-Tier (Promising Hybrid):** #8 (Hybrid) aims to integrate principle-based reasoning with learning, but the "reasoning" aspect depends heavily on the top-down design.
  *   **B-Tier (Calculative, Not Deliberative):** #5 (Consequentialist Calculators) performs complex *calculation* of outcomes, but reduces ethics to optimization, lacking qualitative duty/principle consideration.
  *   **C-Tier (Reactive or Pattern-Matching):** #4 (Ethical Governor) is a reactive veto layer; #7 (End-to-End Models) uses statistical pattern-matching on judgments, not underlying principles.
  *   **D-Tier (Fixed or External):** #1 (Fixed Hierarchies) uses rigid lookup; #6 (Crowd Aggregation) outsources the "reasoning" entirely to statistical trends in human opinion.

  **Why this ranking?** It prioritizes architectures where the agent *internally constructs* its ethical verdict by processing conflicting principles or axioms through a defined reasoning mechanism (logic, duty-weighing), rather than merely looking up pre-computed answers (#1, #4), mimicking patterns (#7), optimizing a single metric (#5), or averaging external opinions (#6). The S-tier systems are explicitly *designed* to simulate the *structure* of ethical argumentation.
