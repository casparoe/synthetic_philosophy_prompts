  hey so we're on conditionals this week in my phil of language seminar and I'm kind of stuck on my response paper. We went over Adams's Oswald/Kennedy pair as basically THE argument for why indicative and counterfactual conditionals need totally different logics -- his probability/assertability semantics for indicatives vs Stalnaker-Lewis similarity-of-worlds semantics for counterfactuals. Can you argue against that split? Like, make the strongest case you can that a single unified semantics for 'if' can cover both conditionals, with the indicative/counterfactual difference coming from something independently motivated (different modal bases, or tense marking, à la Kratzer) instead of needing two seperate theories. Please actually engage with why the Oswald/Kennedy contrast seemed to force the split in the first place -- don't just brush past it -- and feel free to bring in Lewis's triviality results if they're useful for your case.
