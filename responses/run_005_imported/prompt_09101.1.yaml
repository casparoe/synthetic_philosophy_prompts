answer: |-
  Here’s a rigorous case against the Adams/Stalnaker-Lewis split, arguing for a unified semantics of conditionals grounded in Kratzer-style contextualism. I’ll engage directly with the Oswald/Kennedy pair and Lewis’s triviality results, showing how they *don’t* force a dualistic approach.

  ---

  ### **The Core Argument for Split Semantics (Adams & Stalnaker-Lewis)**
  1. **The Oswald/Kennedy Contrast**:  
     - *Indicative*: "If Oswald didn’t kill Kennedy, someone else did."  
       → Highly assertable (≈1 probability) given evidence that Kennedy *was* killed.  
     - *Counterfactual*: "If Oswald hadn’t killed Kennedy, no one else would have."  
       → Plausibly assertable (in Adams/Stalnaker-Lewis terms) since similarity-based semantics prioritizes minimal changes (e.g., removing Oswald’s action without adding conspiracies).  

     **Problem**: The two conditionals share identical antecedents/consequents but diverge in assertability. Adams argues this shows indicatives track *conditional probability* (P(C|A) ≈1), while counterfactuals require *similarity of worlds* (in A-worlds closest to ours, C holds).

  2. **Lewis’s Triviality Results**:  
     Lewis proved that *no* probability function can satisfy P(A→C) = P(C|A) for all A,C without collapsing to the material conditional. This seemingly dooms probabilistic semantics for *all* conditionals, reinforcing the split:  
     - Indicatives → Defective probability-based assertability  
     - Counterfactuals → Primitive similarity-based truth conditions  

  ---

  ### **The Case for Unified Semantics: Kratzer’s Framework**
  A unified theory treats "if" as a *restrictor* for modal operators (e.g., "must", "would"), with differences arising from **tense**, **modal base**, and **ordering source** (Kratzer, 1981, 2012). Crucially, these are contextually supplied—not hardwired into the meaning of "if".

  #### **1. Explaining the Oswald/Kennedy Contrast Contextually**
  - **Indicative Conditional**:  
    - *Modal Base*: **Epistemic** (what is known: Kennedy was killed).  
    - *Ordering Source*: **Realistic** (facts about the actual world).  
    - *Tense*: Past indicative ("did") → anchors to *actual past*.  
    - **Analysis**:  
      "If Oswald didn’t kill Kennedy, someone else did" restricts an epistemic necessity operator:  
      > In *all epistemically accessible worlds where Oswald didn’t kill Kennedy and all known facts hold* (including Kennedy’s death), someone else killed him.  
      → Assertable because Kennedy’s death is fixed in the modal base.  

  - **Counterfactual Conditional**:  
    - *Modal Base*: **Circumstantial** (objective facts pre-assassination).  
    - *Ordering Source*: **Totally realistic** (maximally similar to actual pre-assassination world).  
    - *Tense*: Past perfect ("hadn’t killed") → shifts evaluation to *past time before assassination*.  
    - **Analysis**:  
      "If Oswald hadn’t killed Kennedy, no one else would have" restricts a metaphysical necessity operator:  
      > In *all worlds most similar to pre-assassination actuality where Oswald doesn’t act*, no other killer emerges.  
      → Assertable because similarity prioritizes minimal changes (e.g., no spontaneous conspiracies).  

  **Why the Contrast Doesn’t Force a Split**:  
  - The divergence stems from **temporal perspective** and **modal base content**, not "if" itself.  
  - The indicative fixes the outcome (Kennedy died) via epistemic modal base.  
  - The counterfactual excludes the outcome via past tense + circumstantial modal base.  
  - → Same core semantics: *"if" restricts a modal operator*. The rest is context.  

  #### **2. Neutralizing Triviality Results**  
  Lewis’s triviality assumes conditionals have *truth-conditions* that obey probability laws. But in unified semantics:  
  - Indicatives express *epistemic modal claims* (e.g., "must C if A"), not propositions with probabilities.  
  - Counterfactuals express *metaphysical modal claims* (e.g., "would C if A").  
  - → **No conditional proposition P(A→C)** to which P(C|A) applies.  
  - Lewis’s result thus becomes irrelevant—it targets a strawman (truth-conditional probabilistic conditionals).  

  #### **3. Empirical & Theoretical Advantages of Unification**  
  - **Borderline Cases**: Hybrids like *future indicatives* ("If it rains tomorrow, the match will be canceled") behave like counterfactuals if the future is open. Unified semantics handles this via variable modal bases—no need for a third logic.  
  - **Linguistic Economy**: "If" has a stable syntax/semantics cross-linguistically. Splitting its logic complicates language acquisition and semantics-pragmatics interfaces.  
  - **Contextual Flexibility**: Explains why "If I was a dragon, I’d breathe fire" (counterfactual) vs. "If I am a dragon, I breathe fire" (indicative) differ only via tense/modality.  
  - **Predictive Power**: Unified theories correctly predict that counterfactual antecedents (unlike indicatives) project presuppositions *out* of their contexts (e.g., "If Hitler had been a great painter..." presupposes he wasn’t).  

  ---

  ### **Objection & Reply: Isn’t This Just a Covert Split?**  
  **Objection**: "Modal bases + ordering sources *are* the split—you’ve just relabeled Stalnaker/Lewis!"  
  **Reply**:  
  - The split is *contextual*, not *semantic*. "If" has a uniform meaning (restricting modals), while Stalnaker/Lewis treat indicatives/counterfactuals as distinct logical connectives.  
  - Crucially, **tense** (past → distancing) and **factual premises** (epistemic vs. circumstantial) are independently motivated in linguistics/temporal logic—they aren’t ad hoc fixes for conditionals.  

  ---

  ### **Conclusion**  
  The Oswald/Kennedy contrast doesn’t demand separate logics—it highlights how tense and context shift modal parameters. Unified semantics resolves this elegantly:  
  1. **Indicatives** → Epistemic modality + present/past tense + fact-rich modal base.  
  2. **Counterfactuals** → Metaphysical modality + past perfect/subjunctive + fact-free modal base.  
  Lewis’s triviality is evaded by rejecting truth-conditional probabilities. The result is a leaner theory where "if" is a grammatical glue, not a logical chameleon.  

  **Key References for Your Paper**:  
  - Kratzer, A. (1981). "The Notional Category of Modality".  
  - Kratzer, A. (2012). *Modals and Conditionals*.  
  - Lewis, D. (1975) "Adverbs of Quantification" (shows "if" as restrictor).  
  - Gillies, A. (2009). "On Truth-Conditions for If (But Not Quite Only If)" (updates unification).  

  This framework lets you argue that the "split" is merely pragmatic—a byproduct of how we deploy modals across contexts—not a deep feature of logic. Dive into Kratzer's work for technical details, and use tense/aspect to dismantle the Oswald/Kennedy "proof"!
