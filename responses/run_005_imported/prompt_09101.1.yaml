  First, I need to recall why Adams thought indicatives and counterfactuals require separate treatments. The key is the Oswald/Kennedy pair: 

  (1) Indicative: "If Oswald didn't kill Kennedy, someone else did." 
  (2) Counterfactual: "If Oswald hadn't killed Kennedy, someone else would have."

  People strongly assert (1) but reject (2), even though both have the same antecedent and consequent. Adams explained this with probability: (1) is assertable because the probability of "someone else did" given "Oswald didn't" is high based on historical facts. But counterfactuals like (2) require a different approach - Stalnaker-Lewis possible worlds where we imagine the antecedent true while keeping the world as similar as possible.

  The challenge is to explain why the same words "if" behave so differently here without needing two separate theories. I should explore unified approaches like Kratzer's framework where the difference comes from contextual factors like modal base or tense.

  Hmm... Kratzer's idea is that "if" always introduces a restriction on modal operators. For indicatives, we use an epistemic modal base (what's known) and a realistic ordering source (what's normal). For counterfactuals, we use a circumstantial modal base and a totally realistic ordering source. The key is that tense/aspect marks whether we're shifting the evaluation time.

  For the Oswald case: 
  - Indicative (1) uses present tense "did" with an epistemic base containing the fact that Kennedy was killed. 
  - Counterfactual (2) uses past perfect "hadn't killed" which shifts evaluation to a past time before the killing, excluding the actual outcome.

  Lewis's triviality results might help my case too - they show that trying to treat indicatives as material conditionals leads to absurdities, which pushes us toward unified modal accounts. But I need to address why the counterfactual (2) feels false: in worlds where Oswald didn't do it, we don't just remove his action - we keep other circumstances fixed, so no other killer emerges naturally.

  I should also mention how unified theories handle the Oswald/Kennedy contrast: 
  - For (1), we don't remove the fact of Kennedy's death from our knowledge base. 
  - For (2), we imagine a world where Oswald doesn't act, but other plotters might still exist, making the "someone else" claim uncertain.

  The strongest points for unification would be: 
