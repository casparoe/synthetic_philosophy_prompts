     Main: "Iterated elimination of dominated strategies can be computationally intensive in games with many players and strategies. Do you think this computational burden undermines its descriptive value as a model of human decision-making? And what about its normative value for rational players?"

     Follow-up: "If even a rational player might not be able to perform the necessary computations, then is IEDS still a reasonable solution concept?"

   Question 6: Uniqueness.
     Main: "In coordination games, such as the Battle of the Sexes, there are no dominated strategies, so IEDS does not eliminate any strategies. What does the solution concept then predict? And if it doesn't narrow down the strategies, how is it helpful?"

     Follow-up: "Doesn't the failure to provide a unique prediction in such common situations indicate that IEDS is incomplete and must be supplemented by other concepts, such as focal points or equilibrium selection devices?"

   Question 7: Relationship with Nash.
     Main: "You've criticized Nash equilibrium for requiring that players' beliefs about each other's play are correct. But if IEDS leads to a unique strategy profile, that profile is a Nash equilibrium. So doesn't IEDS also imply that beliefs are correct in that case? And if IEDS does not lead to a unique profile, then we have multiple strategy profiles that are Nash equilibria. How does common knowledge of rationality alone help players coordinate on one of them without assuming correct beliefs?"

     Follow-up: "In the case of multiple Nash equilibria that survive IEDS, doesn't the player still need to form a belief about which equilibrium will be played? And isn't that belief required to be correct in equilibrium? So how does IEDS avoid the assumption of correct beliefs?"

   Question 8: No dominated strategies.
     Main: "In the game of Matching Pennies, there are no strictly dominated strategies. Therefore, IEDS does not eliminate any strategies. What does common knowledge of rationality imply for play in this game? And how does IEDS help us predict the outcome?"

     Follow-up: "Without any elimination, doesn't IEDS essentially say that any strategy is possible? How is that a solution?"

