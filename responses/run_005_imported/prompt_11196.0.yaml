  Here are 8-9 interview questions designed to probe deeper into iterated elimination of dominated strategies (IEDS) beyond standard defenses, including your specified topics and follow-ups to counter expected dodges. Each question targets conceptual tensions, with follow-ups preempting common rebuttals.

  ---

  ### **1. Mixed Strategy Domination and Non-Randomizing Players**  
  **Q:** When a pure strategy is dominated *only* by a mixed strategy (not by any single pure strategy), what does rationalizability demand of a player who lacks the ability to randomize? If they can only choose pure strategies, why should they abandon a strategy that isn't dominated within the set of *pure* actions?  
  *Follow-up (expected dodge: "Dominance implies it's never a best response"):* But if the player can't randomize, the dominating mixed strategy isn’t a feasible choice. Doesn’t this make dominance by mixed strategies an *irrelevant* criterion for such players, effectively weakening the "common knowledge of rationality" (CKR) justification?  

  ### **2. Asymmetry in Elimination Order: Strict vs. Weak Dominance**  
  **Q:** Order of elimination doesn’t matter for strict dominance but can change outcomes under weak dominance. What does this asymmetry imply about the epistemic stability of weak dominance? Shouldn’t a solution concept rooted in CKR be robust to the order of reasoning?  
  *Follow-up (expected dodge: "Weak dominance is context-dependent"):* If elimination order depends on arbitrary reasoning paths, how can CKR—which is order-agnostic—guarantee a unique outcome? Doesn’t this undermine IEDS as a reliable solution concept in weakly dominated games?  

  ### **3. Centipede Game and Empirical Validity**  
  **Q:** In the centipede game, CKR + IEDS forces backward induction to the first-move defect. Yet experiments show humans rarely play this way. If IEDS is descriptively inaccurate here, how can it be the "correct" solution concept?  
  *Follow-up (expected dodge: "Humans are irrational"):* Even game theorists playing centipede often cooperate, anticipating opponents’ "irrationality." Doesn’t this suggest CKR is *unattainable* in practice? If so, why prioritize IEDS over concepts accounting for bounded rationality?  

  ### **4. Rationalizability Equivalence Breakdown in >2 Players**  
  **Q:** For two players, IEDS and rationalizability coincide. With three or more, they diverge unless players allow correlated conjectures. Why does this happen, and should IEDS require independent or correlated beliefs to align with rationalizability?  
  *Follow-up (expected dodge: "Correlation isn’t realistic"):* If correlated beliefs are excluded, IEDS eliminates strategies that *are* rationalizable under independence. Doesn’t this make IEDS *too aggressive*—and less justifiable via CKR alone—in multiplayer games?  

  ### **5. Weak Dominance and Payoff-Equivalent Strategies**  
  **Q:** Weakly dominated strategies can be best responses if payoff ties occur. Why does IEDS eliminate them, given that CKR doesn’t prohibit payoff-indifferent choices?  
  *Follow-up (expected dodge: "Elimination simplifies the game"):* If a weakly dominated strategy is rationally playable (e.g., in a tie), doesn’t discarding it violate neutrality toward equivalent payoffs? How is this consistent with rationality?  

  ### **6. Computational Burden of IEDS**  
  **Q:** IEDS can require exponential-time computations in large strategy spaces. If CKR implies players *actually* perform IEDS, how do you reconcile this with human cognitive limits?  
  *Follow-up (expected dodge: "IEDS is normative, not descriptive"):* Doesn’t this admission concede that IEDS is impractical for real-world interactions? Why favor it over computationally simpler concepts?  

  ### **7. IEDS as a Refinement of Nash Equilibrium**  
  **Q:** You critique Nash for assuming correct beliefs, but IEDS outcomes *are* Nash equilibria. Doesn’t IEDS inherit Nash’s problems when multiple equilibria survive?  
  *Follow-up (expected dodge: "IEDS reduces the set"):* When IEDS leaves multiple Nash equilibria (e.g., in coordination games), players still need correct beliefs to coordinate. How does IEDS avoid Nash’s "correct beliefs" assumption here?  

  ### **8. No Dominated Strategies: IEDS as a Non-Solution**  
  **Q:** In games like Matching Pennies, no strategies are dominated, so IEDS predicts *anything*. How is this a "solution"? Doesn’t CKR lose bite without dominance?  
  *Follow-up (expected dodge: "IEDS is a tool, not always decisive"):* If IEDS frequently fails to yield precise predictions, why call it a "general solution concept" rather than a preliminary step?  

  ### **9. Epistemic Foundations of Weak Dominance**  
  **Q:** Weakly dominated strategies require stronger epistemic conditions (e.g., common *p*-belief of rationality) than strict dominance. Doesn’t this complexity undercut IEDS’s simplicity claim versus Nash?  
  *Follow-up (expected dodge: "CKR suffices for both"):* Why do some epistemic game theorists argue weak dominance needs *more* than CKR? If true, doesn’t this fracture IEDS’s unified justification?  

  ---

  ### **Key Design Notes**  
  - **Follow-ups** target anticipated defenses (e.g., appeals to normativity, cognitive limits, or CKR’s infallibility).  
  - **Bonus Question (#4)** forces engagement with multiplayer rationalizability, exposing correlation’s role.  
  - **Asymmetry Focus (#2)** links weak dominance’s path-dependence to epistemic fragility.  
  - **Centipede (#3)** challenges CKR’s empirical plausibility, not just "irrationality."  
  - **Mixed Strategies (#1)** questions the physical feasibility of dominance criteria.  

  Use these to pressure the "hardliner" on IEDS’s internal tensions, not just its advantages over Nash.
