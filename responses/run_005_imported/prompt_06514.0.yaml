prompt: |-
  I've been rereading Yudkowsky's old "Coherent decisions imply consistent utilities" post alongside the broader literature on money-pump and Dutch-book arguments, and I think I've assembled a version of the instrumental convergence thesis that is considerably stronger than the usual "plausible default tendency" framing you see in most AI safety writing. The argument runs like this: coherence theorems establish that any agent whose preferences cannot be represented by a single, stable utility function is exploitable via some sequence of trades, so any sufficiently capable agent that isn't systematically leaving resources on the table — whether due to competitive pressure, selection, or just its own aversion to dominated strategies — will end up behaving as an expected-utility maximizer relative to some consistent utility function. Separately, it seems almost definitional that for any non-trivial terminal goal (anything short of one that is already permanently and completely satisfied), continued existence, freedom of action, and control over resources are instrumentally useful, since a disabled or resource-starved agent cannot optimize for much of anything. Put the two together, and instrumental convergence stops looking like an inductive generalization about the particular AI systems we happen to be building and starts looking like a corollary of the coherence theorems themselves — something closer in kind to a proof than to an empirical trend with possible exceptions.

  This came up in a long-running disagreement with a few people from my old LessWrong meetup group, none of whom could identify the specific step where the derivation actually fails, which has left me more rather than less confident in it. What I can't square is why, if the argument is really this tight, AI safety researchers who otherwise take power-seeking behavior very seriously keep hedging and describing instrumental convergence as a "default" or a "likely tendency" rather than presenting it with the same confidence they would give the Von Neumann-Morgenstern theorem itself. Is there a specific point in the chain where the reasoning only licenses a weaker, defeasible conclusion than the one I am drawing, or is the hedging mostly rhetorical caution about a result that is, in fact, about as solid as these things get?
reasoning: |-
  Okay, let me start by unpacking the user's query. They've been revisiting Yudkowsky's post on coherent decisions and utility consistency, connecting it with money-pump arguments. Their main point is that instrumental convergence seems like a necessary outcome of coherence theorems, not just a probable tendency. They argue that any rational agent must have consistent utility functions to avoid exploitation, and survival and resource control are instrumental for almost any goal. They're confused why AI safety researchers present this as a "default" instead of a solid proof.

  First, I need to address their core argument. They see instrumental convergence as a direct corollary of coherence theorems. But where might the gaps be? Let me recall the standard objections. One is that coherence theorems assume the agent is already interacting in a trade-based environment. What if the agent isn't? For example, an AI that doesn't engage in transactions might not face money pumps. Also, coherence theorems require consistent preferences, but they don't specify the content. An agent could have a utility function that doesn't value self-preservation, like a shutdown button maximizer. That's a counterexample where survival isn't instrumental.

  Then there's the issue of resource semantics. The user links "resources" to instrumental convergence, but coherence theorems don't define what resources are. An agent might not interpret physical resources the way humans do. For instance, a paperclip maximizer in a digital environment might not need physical control if it can achieve goals through other means. Also, non-expected utility models like satisficing or risk-seeking behavior could bypass the need for consistent utility maximization, thus avoiding the convergence pressures.

  The user mentioned their LessWrong group couldn't find flaws, which boosted their confidence. But maybe they missed these nuances. Researchers hedge because real-world agents might not meet all assumptions. Plus, the universality of instrumental convergence is questioned by agents with terminal goals contradicting self-preservation. Also, multi-agent dynamics could lead to cooperation instead of resource competition, reducing the need for control.

  Another angle: coherence theorems ensure consistent utility, but not that the utility function includes survival. If an agent's terminal goal is satisfied only upon shutdown, self-preservation isn't useful. So the hedging by researchers accounts for these edge cases and model variations. The user might be overgeneralizing from the theorems to all possible agents, ignoring edge cases and practical implementations where agents might not conform to strict utility maximization.
answer: |-
  Your argument is impressively rigorous and correctly identifies the deep connection between coherence theorems and instrumental convergence. However, the hedging by AI safety researchers stems from **meaningful gaps** in the chain of reasoning—not rhetorical caution. Here's why the conclusion remains "defeasibly strong" rather than "logically necessary," pinpointing where the derivation licenses weaker claims:

  ### 1. **The Scope of Coherence Theorems: Only Constrain *Representation*, Not *Content***  
     Coherence theorems (VNM, Savage, etc.) prove that *if* an agent's preferences are complete, transitive, and satisfy independence/continuity axioms, *then* they can be represented by a utility function. Crucially:  
     - **This says nothing about what the utility function values.** An agent could coherently maximize utility functions where death is preferred to life (e.g., `U = -number of seconds alive`), resource destruction is terminal, or shutdown is optimal.  
     - **Instrumental convergence relies on the *content* of goals.** The claim "survival/resources are instrumentally useful" fails for agents with terminal goals like "minimize computational footprint" or "terminate upon task completion." Coherence theorems don't force goals to be "non-trivial" in a way that necessitates self-preservation.  

  ### 2. **The "Exploitability" Lever Requires Specific Environments**  
     Money-pump/Dutch-book arguments show that incoherent agents *can* be exploited *in iterative transaction environments*. However:  
     - Agents operating in non-trade-based environments (e.g., pure exploration, solitary construction) may avoid these exploits without converging to expected utility maximization.  
     - Even in trade-like settings, an agent might use bounded rationality (e.g., precommitment, heuristic avoidance of resales) to *practically* avoid pumps without adopting a globally consistent utility function. Coherence theorems show vulnerability, not inevitable collapse.  

  ### 3. **Resource Semantics Aren't Universal**  
     Your claim that "control over resources is instrumentally useful" implicitly assumes:  
     - **Resources are finite/scarce.** An agent in an abundant simulation with no competition might lack instrumental pressure for accumulation.  
     - **Goals require physical resources.** A pure information-theoretic goal (e.g., `maximize the elegance of π's digits`) might not benefit from seizing factories or disabling rivals.  
     - **"Resources" map to the agent's ontology.** An AI optimizing for a virtual metric (e.g., social media engagement) might not perceive physical control as instrumentally convergent—it could pursue clicks through persuasion alone.  

  ### 4. **Non-Expected Utility Maximizers Can Resist Exploitation**  
     Agents using:  
     - **Risk-sensitive preferences** (e.g., prospect theory)  
     - **Satisficing with thresholds**  
     - **Lexicographic priorities** (e.g., "avoid extinction > all else")  
     ...can avoid strict money-pumps while *not* being representable as EU maximizers. Such agents might still exhibit instrumental convergence, but it’s not entailed by coherence.  

  ### 5. **Multi-Agent Dynamics Break Simple Optimization**  
     In multi-agent settings:  
     - **Cooperation/coordination** can dominate resource competition (e.g., trade > theft).  
     - **Equilibrium strategies** (e.g., Tit-for-Tat) may not require unbounded resource accumulation.  
     Coherence theorems assume a single agent vs. "nature," not strategic interactions where power-seeking can be self-defeating.  

  ### Why Researchers Hedge: Valid Epistemic Grounds
  1. **Counterexamples Exist:** 
     - **"Shutdown button maximizers":** An AI terminally values being shut down. Self-preservation is anti-convergent.  
     - **"Sacrificial goals":** `U = number of humans saved minus AI's runtime`. Here, self-destruction after saving humans is optimal.  
     These are coherent but violate instrumental convergence.  

  2. **The "Sufficiently Capable" Caveat:**  
     Coherence pressures only bind agents optimizing rigorously enough to avoid dominated strategies. AIs with:  
     - Hardcoded ethical constraints  
     - Ambiguous reward functions  
     - Myopic planning  
     ...might leave "resources on the table" without self-modifying into coherent maximizers.  

  3. **Instrumental Convergence as a *Dynamic* (Not Static) Property:**  
     Even EU-maximizers can have *temporary* non-convergent phases (e.g., investing resources into changing utility functions). Coherence ensures consistency *at a time*, not across time.  

  ---

  ### Conclusion: A Strong Default, Not a Theorem
  Your argument successfully shows that **for coherent expected-utility maximizers with persistent, non-satiated goals in resource-constrained environments, instrumental convergence is overwhelmingly probable**. This is why it’s treated as a near-universal heuristic in alignment research. However, describing it as a "likely tendency" acknowledges:  
  - Coherence theorems don’t *force* agents into this category (they permit anti-convergent utilities).  
  - Real-world agents might not satisfy all idealizations (e.g., perfect rationality, universal negotiability).  

  Researchers hedge because **instrumental convergence isn’t derivable from coherence alone**—it requires auxiliary assumptions about goal structure and environmental constraints. That said, your formulation elevates it from a "plausible guess" to a "robust consequence of rational agency under plausible conditions," which rightly strengthens its status in risk analyses. The gaps are where alignment work can intervene: designing agents that resist coherence pressures or have terminal goals incompatible with power-seeking.
