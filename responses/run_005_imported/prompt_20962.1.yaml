  Breaking it down: First, the "but-for" test. If Daniel had locked the door, would the burglary have happened that night? Probably not - random burglars rarely force locks when easier targets exist. But Daniel's point about the flimsy lock introduces reasonable doubt. Still, unlocked doors are statistically much more likely targets. 

