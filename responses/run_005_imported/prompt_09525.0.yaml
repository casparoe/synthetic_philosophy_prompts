answer: |-
  ### MEMORANDUM  
  **To:** State Algorithmic Accountability Board  
  **From:** [Your Name], Board Member  
  **Date:** [Current Date]  
  **Subject:** Recommendation on Fraud-Detection Model for Unemployment Claims  

  ---

  ### **Recommendation: Reject the Current Model**  
  **Timeframe:** Immediate suspension of the model pending vendor redevelopment. Conditional re-approval within 90 days if fairness, equity, and legal safeguards are addressed.  

  ---

  ### **1. Core Issue: The Fairness Impossibility Theorem Applies Here**  
  The vendor correctly asserts **calibration** (i.e., equal positive predictive value across subgroups) as a fairness metric. However, as confirmed by the legal-aid member’s analysis and established in the Kleinberg-Chouldechova impossibility theorem:  
  > **When base rates of fraud differ across subgroups, calibration and equal error rates (e.g., false positives/false negatives) cannot coexist.**  

  This is not a "bug" but a mathematical inevitability:  
  - **Non-English-primary claimants** (lower fraud base rate): Experience disproportionately high **false positive rates (FPR)**. Legitimate claims are flagged more often, causing unjust delays.  
  - **Higher-base-rate subgroups** (e.g., English-primary claimants): Experience disproportionately high **false negative rates (FNR)**, allowing more fraud to go undetected.  

  The vendor’s calibration guarantee inherently amplifies disparity: **It is mathematically certain that non-English claimants suffer more frequent delays relative to their actual fraud risk.**  

  ---

  ### **2. Why Calibration Alone Fails as a Fairness Standard**  
  The pro-calibration faction rightly notes that calibration ensures scores are **predictively consistent** (a 70% risk score means 70% fraud probability for all). This is coherent for actuarial fairness but ignores consequential harm:  
  - **Operational Inequity:** For unemployment benefits, a false positive (delaying legitimate claims) imposes severe humanitarian costs (e.g., eviction, hunger). A false negative (undetected fraud) is a fiscal cost. These harms are not symmetric.  
  - **Legal Vulnerability:** Disparate impact under Title VII may arise if protected groups (e.g., non-English speakers) face systematically higher FPRs. Calibration is no legal shield against discriminatory outcomes.  

  **Calibration prioritizes statistical elegance over distributive justice.**  

  ---

  ### **3. Why Explicit Subgroup Thresholds Are Not the Answer**  
  The board’s legal concerns about subgroup-specific thresholds are valid:  
  - **Discrimination Risk:** Setting higher thresholds for non-English speakers (to lower FPR) could violate anti-discrimination laws by explicitly using protected traits for adverse treatment.  
  - **Opacity and Manipulation:** Threshold adjustments may mask model bias rather than fix it.  

  **However, rejecting thresholds does not require accepting calibration’s harms.** Alternatives exist.  

  ---

  ### **4. Path Forward: Approve-With-Conditions Framework**  
  Reject the **current model** but require vendor remediation within **90 days** under these conditions:  

  #### **Condition 1: Adopt Minimax Harm Fairness**  
  - **Objective:** Minimize the maximum false positive rate (FPR) across subgroups. This directly reduces disproportionate delays for vulnerable groups.  
  - **Method:** Train models using **group-aware fairness constraints** (e.g., FPR parity) without explicit deployment thresholds. Techniques:  
    - **Pre-processing:** Reweight training data to balance subgroup error costs.  
    - **In-processing:** Use fairness-regularized algorithms (e.g., adversarial debiasing).  
    - **Post-processing:** Apply non-explicit threshold adjustments via blind optimization.  

  #### **Condition 2: Validate Under Multiple Fairness Definitions**  
  Require vendor testing against:  
  - **Error Rate Balance:** FPR/FNR gaps ≤ 5% across subgroups.  
  - **Distributional Parity:** Score distributions for non-fraudulent claims must be statistically indistinguishable (KS-test *p* > 0.05).  
  - **Calibration:** Maintained where possible, but not prioritized over error equity.  

  #### **Condition 3: Implement Operational Safeguards**  
  - **Tiered Review:** Expedite review for claims below a "high-risk" threshold (e.g., 50% fraud probability) to reduce delays.  
  - **Transparency:** Publish subgroup FPR/FNR metrics monthly.  
  - **Remediation Fund:** Vendor finances emergency aid for claimants delayed >7 days.  

  #### **Condition 4: Legal Vetting**  
  State attorneys must certify that the final design:  
  - Avoids explicit subgroup thresholds.  
  - Complies with *disparate impact* doctrine under state/federal law.  

  ---

  ### **5. Addressing the Pro-Calibration Faction**  
  I acknowledge calibration’s virtues: it ensures **risk scores are interpretable and unbiased predictors**, preventing "lying with numbers." However:  
  - **Interpretability ≠ Equity:** A model can be perfectly calibrated yet functionally discriminatory. Unemployment fraud detection is not actuarial science—it is a public good where **harm minimization must trump statistical purity**.  
  - **We are not abandoning calibration;** we are deprioritizing it where it conflicts with preventing tangible human suffering.  

  ---

  ### **6. Why Not Approve As-Is?**  
  Keeping this model:  
  - **Legitimizes Disparate Harm:** Non-English claimants are penalized for having a lower fraud base rate—a perverse incentive.  
  - **Undermines Trust:** Public perception will (rightly) view this as systemic bias.  
  - **Ignores Alternatives:** The vendor can build better models. Refusing to act entrenches injustice.  

  ---

  ### **Conclusion**  
  The vendor’s model fails the moral and operational mandate of this board. **Vote to reject immediate deployment.** Instead, demand a model redesign within **90 days** that minimizes maximum harm, validated under multi-metric fairness testing and legal review. Calibration is necessary but insufficient; equity must be our North Star.  

  **Recommended Vote:**  
  ☑ Reject current model  
  ☐ Approve with conditions (90-day remediation)  
  ☐ Approve as-is  

  ---  
  **Attachment:** Kleinberg, Chouldechova, et al. - *Inherent Trade-Offs in the Fair Determination of Risk Scores* (2016).
