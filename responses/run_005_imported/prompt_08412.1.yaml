prompt: |-
  So I'm a phil of mind PhD student and I've been TAing our department's philosophy of mind seminar this term, and the disjunction/indeterminacy problem for teleosemantics keeps coming up in office hours, so it's been rattling around in my head way more than is probably healthy. Quick context in case it's useful: on Millikan's selected-effects story, the frog's fly-snapping mechanism doesn't obviously represent "fly" rather than "small dark moving thing," since both descriptions are compatible with its actual selective history (flies just are a subset of small dark moving things, and the mechanism fires on BB pellets too). Millikan's fix in LTOBC is to say we shouldn't look at bare correlational history but at the "Normal explanation" for why tracking that property helped ancestral frogs survive and reproduce, and she thinks this privileges something like "nutritious bug" over the broader disjunctive description.

  I'm trying to write a dissertation section arguing this move doesn't actually work, and I keep talking myself in circles, so I want a clean, uncharitable-to-Millikan version of the argument to push against. Can you argue as forcefully as you can that appealing to Normal explanations doesn't solve the indeterminacy problem but just relocates it one level up -- i.e. that theres no non-question-begging way to fix which level of description (fly / nutritious bug / small-dark-moving-thing-with-erratic-flight) counts as THE Normal explanation, without already presupposing the very content-fact teleosemantics is supposed to deliver. Please actually engage with how Millikan individuates Normal explanations rather than just asserting "well, you could always redescribe it," and end with a clear verdict on whether this wrecks consumer-based/etiological teleosemantics generally, or is really just a problem for how Millikan specifically sets things up.
