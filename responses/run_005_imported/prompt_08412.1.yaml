  For example, the frog's visual system detects small dark moving things, but the feeding mechanism consumes nutritious bugs. Millikan would say the consumer (feeding mechanism) determines content as "nutritious bug." But why that consumer? The user probably wants me to push hard on this chain of dependence. 

  I remember Millikan's appeal to "evolutionarily relevant conditions," like the historical prevalence of nutritious bugs. But here's the crack: what counts as the relevant condition? Flies? Bugs? The disjunction problem reappears because the historical environment contained both flies and non-nutritious moving things. 

  Also, consider redescriptions. "Detecting F" could be redescribed as "detecting G" if G coextensively caused F in the past. Millikan avoids this by fixing the explanandum—the mechanism's success. But success itself can be described at different levels: snapping at flies vs. ingesting nutrients. 

