  Move (3): Elena responds by pointing out an asymmetry: for a formal system, we can specify in advance the sentence that defeats it. But for her, no matter what system you hand her, she can produce and recognize the Gödel sentence for that system because she isn't confined to any fixed set of rules. This open-endedness, she claims, is what a formal system cannot do.

