prompt: |-
  I'm currently taking an advanced seminar on choice under risk and uncertainty, and this week's material centered on the Allais paradox and its violation of the independence axiom. Our professor was careful to distinguish this from a mere failure of transitivity or of stochastic dominance, which helped clarify for me why the paradox is a genuine problem for expected utility theory rather than just evidence that subjects misjudge probabilities. What I'm still trying to work out is how the various non-expected-utility models developed partly in response to Allais-type violations actually stack up against one another. A few of us got into a disagreement after class about which of these frameworks gives up the least while buying the most, and I'd like a more considered outside view before I commit to a position in my term paper.

  Specifically, I'd like you to rank the following six theories from most to least theoretically satisfying, where "theoretically satisfying" should be understood as a composite of: (i) how minimal and well-motivated the departure from the von Neumann–Morgenstern axioms is, (ii) how much extra machinery (free parameters, bespoke psychological assumptions) had to be added specifically to accommodate Allais's own numbers rather than falling out of some more general principle, and (iii) whether the same apparatus naturally extends to cover neighboring phenomena — the common ratio effect, preference reversals, the fanning-out of indifference curves in the Marschak–Machina triangle — rather than functioning as a one-off patch tailored to Allais's examples. The six theories are: Rank-Dependent Utility Theory (Quiggin), Cumulative Prospect Theory (Kahneman and Tversky), Regret Theory (Loomes and Sugden), Disappointment Aversion Theory (Gul), Chew's Weighted Utility Theory, and Machina's Generalized Expected Utility ("fanning-out") approach.

  Please present your ranking as a tier list in a JSON block, with tiers running from S (best) down to F (worst), placing one or more theories in each tier you use, and give at least two or three sentences per tier explaining what earns its occupant(s) that placement. Please use the following schema:

  ```json
  {
    "S": ["..."],
    "A": ["..."],
    "B": ["..."],
    "C": ["..."],
    "D": ["..."],
    "F": ["..."]
  }
  ```
