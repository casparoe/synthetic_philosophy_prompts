  ### Explanations:
  **S-tier: RDU & CPT**  
  Both elegantly replace the independence axiom with weaker conditions (e.g., comonotonic independence) and derive Allais violations endogenously through *probability weighting*—a single, well-motivated departure that explains the common ratio effect, fanning-out, and preference reversals. CPT extends RDU with reference-dependence and loss aversion, naturally capturing broader phenomena (e.g., reflection effects) without Allais-specific tweaks. Their machinery (weighting functions) is parsimonious and psychologically grounded in likelihood distortion rather than outcome-based adjustments.

  **A-tier: Machina's GEU**  
  Minimizes axiomatic disruption by retaining completeness, transitivity, and continuity while replacing independence with smooth differentiability of indifference curves. Its "fanning-out" hypothesis directly accommodates Allais and common ratio effects via local utility functions, requiring no new parameters *for Allais specifically*. However, it lacks a unified psychological mechanism, functioning more as a mathematical generalization that descriptively fits data rather than deriving behavior from first principles.

  **B-tier: Disappointment Aversion (DA) & Weighted Utility (WU)**  
  DA modifies independence via a single parameter (β) capturing aversion to disappointing outcomes, offering a clean axiomatic alternative. Yet it struggles with some Allais variations (e.g., reversed paradoxes) and neighboring effects like preference reversals. WU weakens independence to betweenness but retains linear probabilities—making its Allais accommodation feel more ad hoc (relying on nonlinear probability weighting implicitly). Both add modest machinery but lack CPT/RDU’s extensibility to loss-domain phenomena.

  **C-tier: Regret Theory**  
  Departs radically by evaluating choices *pairwise*, violating transitivity and independence via anticipated regret. While it accommodates Allais and some preference reversals, its core mechanism (regret aversion) functions as a bespoke psychological patch for these specific paradoxes. It fails to naturally extend to fanning-out or common ratio effects without additional assumptions, and its reliance on binary comparisons introduces combinatorial complexity in multi-choice settings.
