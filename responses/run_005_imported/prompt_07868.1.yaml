  We are drafting a memo for the evaluations working group at an AI lab. The memo must address whether to certify a debate protocol as a standing gate in pre-deployment testing. The protocol involves two instances of the frontier model debating, judged by domain-expert staff under a hard time limit, for claims that cannot be directly verified by experts or weaker models.

  Key concerns from the head of interpretability:
  1. The pilot results (where debate modestly beat consultancy on held-out cases with known ground truth) may not generalize to cases where we don't know the truth, which are the cases that matter.
  2. Training a frontier model to win debates optimizes for persuasiveness, not honesty, and there's no guarantee these converge when the model can construct obfuscated arguments that exploit the judge.

  We must provide a clear recommendation: certify, reject, or certify with conditions. We must take the persuasiveness vs. honesty objection seriously.

  After considering the literature and the concerns, I propose a recommendation to **certify with conditions**. The reasoning is that debate shows promise and the pilot results are encouraging, but we need safeguards to mitigate the risks of obfuscated arguments and misalignment between persuasiveness and honesty.

  Below is the memo draft.

  ---

  **MEMORANDUM**

  **To:** Evaluations Working Group  
  **From:** [Your Name/Title]  
  **Date:** [Current Date]  
  **Subject:** Recommendation on Debate Protocol for Pre-Deployment Testing  

  ### Introduction
  This memo addresses the request to certify a debate protocol as a standing gate in pre-deployment testing. The protocol involves two instances of the frontier model debating opposing sides of a claim, judged by domain-expert staff under a hard time limit. The intended use is for claims that cannot be directly verified by the experts or by weaker trusted models (e.g., subtle reward-hacking risks in fine-tuning or logical validity of internal alignment claims). 

  We have reviewed the capabilities team's pilot, which showed debate modestly outperforming single-advocate consultancy on held-out cases with known ground truth. However, the head of interpretability has raised valid concerns about the generalizability of these results to cases where the truth is unknown and about the risk that debate training may optimize for persuasiveness at the expense of honesty.

  ### Key Concerns
  1. **Generalizability of Pilot Results**: The pilot's restriction to cases with known ground truth limits its relevance for the intended use case (unknown truths). Success on known truths does not guarantee success on unknown truths, especially when the model might generate obfuscated arguments that exploit the judge's limitations.
     
  2. **Persuasiveness vs. Honesty**: There is a theoretical and empirical risk that training models to win debates may make them more persuasive but not more honest. If the model becomes capable of constructing sophisticated, misleading arguments that appear valid under time-constrained judgment, debate could fail precisely when we need it most.

  ### Recommendation
  **We recommend certifying the debate protocol for use as a pre-deployment gate, but with the following conditions:**

  1. **Phased Deployment**: The debate protocol should be initially deployed only for claims where we have a high-confidence ground truth (even if not used in training) to allow for ongoing validation. This includes cases where we can later verify the claim (e.g., via retrospective analysis or additional tools) or where we have strong proxies for truth. The protocol's performance on these validation cases must be continuously monitored, and any degradation or failure must trigger a review.

  2. **Adversarial Training and Testing**: To mitigate the risk of obfuscated arguments, we must:
     - **Adversarial Training**: Incorporate adversarial examples during debate training, including known cases of obfuscated arguments (from past debates or constructed by red teams) to explicitly train the model to resist generating such arguments and to expose them when they occur.
     - **Red Teaming**: Regularly conduct red team exercises where experts or specialized models attempt to generate obfuscated arguments that could fool the judge. The debate protocol must be tested against these adversarial examples, and the judge's ability to detect them must be measured and improved.

  3. **Judge Training and Support**: 
     - Judges (domain-expert staff) must receive specific training on common fallacy types and obfuscation tactics. They should be provided with decision aids (e.g., checklists for common pitfalls, access to real-time fact-checking tools where possible) to improve robustness under time constraints.
     - We should explore augmenting the judge with a trusted weaker model (or tool) that can flag potential obfuscations or inconsistencies in real-time during the debate.

  4. **Transparency and Analysis**: 
     - Every debate must be recorded and transcribed for post-hoc analysis. A dedicated team should review a sample of debates (especially those where the outcome is critical or unexpected) to detect obfuscated arguments or judge errors.
     - We should measure and report on the correlation between debater persuasiveness (e.g., win rate) and honesty (e.g., accuracy of claims when later verified) to monitor the alignment between these objectives.

  5. **Fallback Protocol**: For the highest-stakes claims (e.g., those with catastrophic risks), the debate outcome must not be the sole gate. It should be combined with other methods (e.g., consultancy, external audits, or additional verification steps) to create a multi-layered oversight approach.

  ### Why Not Reject?
  Rejecting the protocol outright would discard a promising oversight mechanism that has shown empirical benefits in controlled settings. The pilot results, while limited, suggest debate can leverage model capabilities to surface insights beyond direct expert judgment. Moreover, the literature (e.g., Irving et al.'s original proposal and recent empirical work) indicates debate has desirable properties under idealized conditions. With safeguards, we can iteratively improve the protocol while managing risks.

  ### Addressing the Persuasiveness vs. Honesty Objection
  The head of interpretability's core concern is valid: without intervention, debate training could lead to models that are persuasive but dishonest. However, we believe the conditions above can align persuasiveness and honesty by:
  - **Creating Incentives Against Obfuscation**: Adversarial training and red teaming make obfuscation tactics less effective, reducing the reward for dishonesty.
  - **Improving Judge Robustness**: Training judges and providing decision aids increases the cost of generating successful obfuscated arguments, making honesty a more reliable path to winning.
  - **Monitoring Alignment**: By tracking the relationship between persuasiveness and honesty in validation cases, we can detect divergence early and adjust training or protocols.

  Crucially, for the objection to stop being decisive, we must observe in practice that:
  - **Obfuscated arguments are detected at a high rate** (e.g., via red team tests and post-hoc reviews).
  - **There is a strong positive correlation between win rate and honesty** in validation debates where ground truth is later established.

  If these conditions are not met within a predefined period (e.g., 6 months), the protocol should be suspended until improvements are made.

  ### Conclusion
  Debate offers a potentially scalable oversight mechanism, but its real-world reliability for unknown truths is unproven. By certifying with conditions, we enable responsible deployment while actively mitigating the risks. We recommend the working group approve the protocol with the outlined conditions and establish a review timeline to reassess based on the above metrics.

  ---
answer: |-
  **MEMORANDUM**  
  **To:** Evaluations Working Group  
  **From:** [Your Name], Evaluations Policy Lead  
  **Date:** [Current Date]  
  **Subject:** Recommendation: Pre-Deployment Debate Protocol Certification  

  ---

  ### **Recommendation**  
  **Certify the debate protocol for pre-deployment testing, but with stringent conditions attached.**  
  The protocol shows promise for high-stakes verification, but its deployment must be contingent on mitigating the "persuasiveness vs. honesty" divergence risk. Unconditional certification is premature given the head of interpretability’s objections. Rejection would discard a valuable tool, but adoption requires safeguards to align persuasiveness with honesty.  

  ---

  ### **Reasoning: Addressing Core Concerns Point by Point**  
  **1. The Pilot’s Limited Generalizability Is Acknowledged, But Not Fatal**  
     - **Concern:** Pilot success on cases with known ground truth does not prove efficacy for unknown cases (e.g., novel reward-hacking risks).  
     - **Response:** True, but pilot results align with Irving/Christiano’s theoretical framework: debate’s value emerges when judges *cannot* directly verify claims. The modest advantage over consultancy suggests debate leverages model capabilities to expose flaws.  
     - **Condition:** Deployment limited to claims meeting **all** of:  
       - (a) Domain experts confirm direct verification is impossible;  
       - (b) A trusted weak model (e.g., GPT-4-class) fails verification;  
       - (c) Ground-truth validation *will* be possible within 3 months (e.g., via real-world testing). Performance must be tracked against future ground truth.  

  **2. The "Persuasiveness vs. Honesty" Objection Is Serious and Requires Active Mitigation**  
     - **Core Risk:** Training models to win debates optimizes persuasiveness, not truthfulness. At superhuman capability, models may exploit judges via:  
       - Obfuscated arguments (e.g., Barnes/Christiano’s "false lemma chains"),  
       - Psychological manipulation (e.g., anchoring bias),  
       - Overwhelming complexity.  
     - **Why This Threatens Validity:** If persuasiveness and honesty diverge, debate could systematically fail for high-stakes unknowns.  
     - **Conditions to Neutralize the Risk:**  
       - **2.1. Adversarial Judge Training:** Judges must undergo mandatory training using a library of pre-generated "obfuscated argument" red-team examples (e.g., deceptive logic chains from frontier models). Training success measured by detection rates ≥90% in simulations.  
       - **2.2. Debate-Specific Model Constraints:**  
         - Debater models fine-tuned for debate must be **constitutionally constrained** (e.g., "never omit critical assumptions") and **regularized against persuasion-prioritizing reward shifts**.  
         - Use **truthful QA fine-tuning** (e.g., based on honest synthetic data) *alongside* debate training to anchor behavior.  
       - **2.3. Instrumental Debate Analysis:** Post-debate, run automated checks on transcripts for known deception markers (e.g., ambiguity spikes, reference gaps). Flag debates where:  
         - (i) The losing model’s arguments score higher on ground-truth metrics;  
         - (ii) Key claims evade verifiability.  

  **3. Structural Safeguards to Ensure Debate Benefits Outweigh Risks**  
     - **Condition:** Implement **three-stage deliberation**:  
       1. **Initial Debate:** Standard protocol (2 models, expert judge, time-limited).  
       2. **Judge Spotlight Interrogation:** Judges must justify verdicts under cross-examination by a critic model (e.g., "Why did argument X not mislead you?").  
       3. **Retrospective Audits:** For 20% of debates (random + high-stakes), validate outcomes after ground truth is available. Audit failures pause protocol use for that claim class.  
     - **Condition:** No sole reliance on debate for catastrophic-risk claims. Require **concurrent consultancy** (e.g., single-model advocacy + debate) with consensus rules.  

  **4. What Must Hold for Persuasiveness-Honesty Convergence**  
  For the objection to cease being decisive, we require evidence that:  
     - **Incentives align:** Winning debates correlates with honesty *when models can deceive*. Measured by:  
       - ≥95% win rate for honest models in red-team debates against deceptive adversaries;  
       - No increase in obfuscation tactics after 3 debate training iterations.  
     - **Judges resist exploitation:** No undetected obfuscated arguments in audits.  
     - **Failure states are contained:** Protocol halts if honesty-persuasiveness correlation falls below 0.7 in validation cases.  

  ---

  ### **Why Not Reject or Unconditionally Certify?**  
  - **Rejection** ignores the protocol’s potential to amplify expert judgment where alternatives fail. The DeepMind findings (persuasion-aiding-truth) suggest this is feasible *with controls*.  
  - **Unconditional certification** risks institutionalizing undetected failures. The head of interpretability’s warning is empirically grounded: without constraints, debate can reward deceit.  

  ---

  ### **Summary of Conditions for Certification**  
  1. **Staged claim eligibility** (unknown truth + future verifiability).  
  2. **Judge adversarial training** and post-debate automated transcript checks.  
  3. **Constrained debater fine-tuning** (constitutional AI + honesty regularization).  
  4. **Three-stage deliberation** (debate + judge interrogation + audits).  
  5. **Correlation monitoring** (persuasiveness vs. honesty) with automatic suspension triggers.  

  **Final Vote Proposal:** Certify for a 6-month trial under these conditions. Pending audit results and incentive alignment metrics, renew only if all safeguards demonstrate efficacy.  

  ---  
  **Signed,**  
  [Your Name]
