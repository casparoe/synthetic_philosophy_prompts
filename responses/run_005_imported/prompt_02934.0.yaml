answer: |-
  You've hit on a genuinely subtle and perceptive point – the tension between Fitch's stated disregard for time and the temporally-loaded phrasing of his conclusion *is* significant. Let's break down what's happening:

  1.  **Fitch's Formal Setup (Ignoring Time):**
      *   Fitch explicitly avoids building tense logic into his system (p. 135). He treats knowledge as a *propositional attitude operator*, `Kp`, meaning "It is known (by someone, at some time) that p".
      *   **The crucial point:** `Kp` is **tenseless** in the logic. It doesn't specify *when* p is known. It asserts that *there exists some time* (past, present, or future) at which p is known by someone. The "some time" quantification is built into the *meaning* of `K`, not expressed by separate temporal operators within the logic.
      *   The knowability principle is formalized as: `p → ◊Kp` (If p is true, then it is *possible* that p is known at some time).
      *   The non-omniscience principle is formalized as: `∃p (p ∧ ¬Kp)` (There is some true proposition that is not known at any time).

  2.  **The Core Derivation (Tense-Free):**
      *   The paradox arises by considering a specific proposition: `q ∧ ¬Kq` (q is true but unknown at any time).
      *   **Step 1 (Non-Omniscience Instance):** Assume `∃p (p ∧ ¬Kp)`. Let `q` be such a proposition, so we have `(q ∧ ¬Kq)` true.
      *   **Step 2 (Knowability Application):** Apply the knowability principle to this proposition: `(q ∧ ¬Kq) → ◊K(q ∧ ¬Kq)`.
      *   **Step 3 (Distributing K):** Fitch argues (via his Theorem 1, or similar distributive properties) that `K(q ∧ ¬Kq)` entails `Kq ∧ K¬Kq`.
      *   **Step 4 (K¬Kq entails ¬Kq):** `K¬Kq` means "It is known that q is not known". Crucially, knowledge entails truth (`Kp → p` is a standard epistemic axiom). Therefore, `K¬Kq` entails `¬Kq`.
      *   **Step 5 (Contradiction):** From Step 3, we have `Kq ∧ K¬Kq`. From Step 4, `K¬Kq` entails `¬Kq`. So we have `Kq ∧ ¬Kq` – a contradiction.
      *   **Conclusion:** Therefore, our assumption `◊K(q ∧ ¬Kq)` must be false. Since `(q ∧ ¬Kq)` is true (by Step 1), the knowability principle `(q ∧ ¬Kq) → ◊K(q ∧ ¬Kq)` must be false for this `q`. If knowability holds universally, the *only* way to avoid this contradiction is if there *is* no such `q` – meaning `∀p (p → Kp)`. Omniscience must hold.

  3.  **The "Soaked in Tense" Phrase: "...nobody knows (or has known, or will know)..."**
      *   This phrase is Fitch's **informal, intuitive interpretation** of the *logical consequence* of `¬Kq` within the proof.
      *   **What `¬Kq` means formally:** "It is not the case that `q` is known at some time". This is equivalent to "There is no time (past, present, or future) at which `q` is known".
      *   **The Translation:** Fitch is simply restating this formal `¬Kq` (which applies to *all* times) in natural language by explicitly listing the tenses: "nobody knows (present) it, nobody has known (past) it, and nobody will know (future) it".
      *   **Why it *seems* indispensable for the modal leap:** The phrase powerfully conveys the *universal temporal force* inherent in `¬Kq`. It emphasizes that `q` isn't just unknown *now*, but unknown *always* and *forever*. This universal temporal denial (`¬Kq`) is the crucial input into the knowability principle (`q ∧ ¬Kq → ◊K(q ∧ ¬Kq)`). The contradiction then shows that `◊K(q ∧ ¬Kq)` is impossible, meaning `q ∧ ¬Kq` *cannot* be known *at any time*. Since `q` was an instance of an unknown truth, this leads to the conclusion that *if all truths are knowable, there can be no permanently unknown truths* – hence omniscience.

  4.  **Resolving the Tension:**
      *   **The formal argument is genuinely tense-free.** The operators `K` and `◊` are interpreted as described. The derivation relies solely on the logical properties of these operators (distributivity, factivity `Kp → p`) and classical logic. Time isn't modeled as a separate dimension with operators like "It will be known" or "It was known".
      *   **The parenthetical is explanatory, not foundational.** It's Fitch's way of helping the reader grasp the *strength* of `¬Kp` within his system. He's saying: "When I write `¬Kp`, I mean *no one ever knows p*, not just 'not known right now'." This interpretation is *stipulated* by the meaning he assigns to `K`.
      *   **The modal force comes from `◊`, not tense.** The leap from "is not known" (`¬Kp`) to "*cannot* be known" (`¬◊Kp`) is achieved *within* the modal logic via the contradiction derived from applying the knowability principle `p → ◊Kp` to the proposition `p ∧ ¬Kp`. The contradiction proves `¬◊K(p ∧ ¬Kp)` for any `p` where `p ∧ ¬Kp` holds. The temporal quantification built into `K` ensures `¬Kp` means "never known", and the impossibility proof (`¬◊K(...)`) then means "it is impossible that this never-known truth *ever* becomes known". The tenses in the parenthetical simply make this implicit "never/ever" explicit in the English gloss.
      *   **Could he have phrased it without tenses?** Yes, but it would be clunkier: "...nobody knows (according to the timeless operator K, meaning at no time) to be true... nobody can know (it is impossible that someone knows at some time) to be true". The parenthetical is rhetorical clarity.

  **Conclusion:**

  You're right to notice the apparent tension. However, the **real work** *is* happening in the tense-free `K`/`◊` machinery. The parenthetical "soaked in tense" is **not doing indispensable logical work** in the derivation itself. It is Fitch's **informal explication** of what the formal operator `¬Kp` *means* within his system: the denial of knowledge *at any time whatsoever*. This explication is crucial for understanding the *significance* of the result – it shows that the knowability principle rules out not just current ignorance, but *permanent* ignorance of any truth. The modal leap (`never known` → `cannot be known`) is achieved formally by the contradiction derived within the modal logic when applying `p → ◊Kp` to `p ∧ ¬Kp`. The temporal quantification is embedded in the *semantics* of `K`, not dynamically driving the proof through tense logic.

  **For your diss:** This is a great point to highlight! You can argue that Fitch's move demonstrates the *implicit* strength built into his "tenseless" `K` operator – it inherently quantifies over all times. The paradox shows that combining this strong conception of knowledge (knowledge *at some time*) with universal knowability collapses into omniscience. The parenthetical reveals the intuitive understanding Fitch relies on, even as he formally disclaims tense logic. The tension exposes how the seemingly innocuous "at some time" quantification within `K` is doing heavy lifting to generate the strong anti-realist challenge. This strengthens your analysis of the paradox's implications for anti-realism.
