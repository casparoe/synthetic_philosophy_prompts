  That parenthetical is soaked in tense -- past, present, future -- right after he told us tense was off the table, and its doing the work of getting from ordinary non-omniscience to a much stronger modal claim about what literally can never be known. is that just loose, informal phrasing, with the real tense-free argument happening elsewhere via the K/◊ machinery? or is the temporal quantification actually doing indispensable work here, in tension with his own disclaimer? can you walk me through what's really going on?
