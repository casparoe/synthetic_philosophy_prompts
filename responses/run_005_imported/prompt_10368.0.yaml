      {"action": "The German Blitz on London (1940–41)", "reason": "Intentionally bombed civilian areas to terrorize the population and force surrender."}
    ],
    "contested": [
      {"action": "The Allied naval blockade of Germany (1914–1919)", "reason": "Civilian starvation was a foreseen consequence, but intention (targeting war economy vs. directly causing civilian deaths) and proportionality are debated."},
      {"action": "The United States submarine campaign against Japanese merchant shipping (1941–1945)", "reason": "Targeting legitimate military objectives (merchant shipping) but with high civilian casualties as a foreseen side effect; intention and proportionality are contested."}
    ],
    "arguably permissible under double effect": [
      {"action": "The Allied bombardment of Normandy coastal towns before and during the D-Day landings (June 1944)", "reason": "Targeted military fortifications; civilian deaths were foreseen but unintended side effects of a legitimate military operation, and proportionate to the goal of establishing a beachhead in Europe."}
    ]
  }
