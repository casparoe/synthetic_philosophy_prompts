  Note: The ordering within each tier is from clearest to least clear.

  - For "clearly murder": Hiroshima is the clearest because Anscombe wrote about it. Then Dresden, which is similar and also a deliberate city bombing. Then the Blitz, which is also a deliberate bombing of civilians but by the Axis.
  - For "contested": The blockade is first because it caused massive civilian suffering and lasted a long time, including after the armistice, making it highly controversial. Then the submarine campaign, which targeted merchant shipping (a traditional target) but with many civilian deaths.
  - For "arguably permissible": Only one case, so no ordering issue.

  This classification is based strictly on Anscombe's doctrine and not on independent moral judgment.
