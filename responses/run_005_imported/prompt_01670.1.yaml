  Social impact is missing too. Advertising rarely contributes to societal good. Instead, it often exacerbates issues like overconsumption or insecurity. She might crave meaningful work that helps others, but her job does the opposite, leading to a values mismatch.

  Her compensation is adequate, so financial stress isn't the problem. But money doesn't fulfill deeper needs like purpose, autonomy, or recognition. The hollowness stems from these unmet psychological needs, not material lack.

