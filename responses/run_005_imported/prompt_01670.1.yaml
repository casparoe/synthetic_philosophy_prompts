prompt: |-
  I'm working on a character who labors as a graphic designer for an advertising firm. She dedicates considerable skill and effort to work that demonstrably generates revenue for her employer, yet she has no stake in what her labor produces. Though adequately compensated, she experiences a curious hollowness about her work despite its clear productivity and technical sophistication. What accounts for this gap between the material productivity of her labor and her subjective sense of it as hollow?
reasoning: |-
