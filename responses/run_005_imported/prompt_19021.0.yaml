  Hmm... what untouched domains could work? Climate science comes to mind - specifically glacier calving predictions. Glaciers are unique entities with complex behaviors. The event could be predicting whether a specific glacier (let's call it "Terminus Glacier") will calve a major iceberg within a year. 

