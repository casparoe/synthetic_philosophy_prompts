  The indeterminacy is particularly sharp here because the acoustic class is objectively narrower but requires accepting that micro-seismic events are causally relevant - which is exactly what's being tested. Maximal specificity rules beg the question. This makes it a clean example where the reference class choice isn't just arbitrary but tied to deeper epistemic commitments about causality. 

  The user will appreciate how this forces students to engage with the problem's structure - the tension between robustness and specificity manifests differently here than in human mortality cases. And the practical stakes (scientific safety vs opportunity cost) make the flip meaningful. 

  For the resolution assessment: I'll emphasize how both narrowest-class and maximal-specificity rules fail because they presuppose what counts as "relevant" specificity. The example neatly shows the problem's resilience. 

