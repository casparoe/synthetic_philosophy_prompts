answer: |-
  The hum of the cooling system for the entangled photon source was Lena’s constant companion. It wasn’t just background noise; it was the sound of the universe refusing to yield its secrets easily. On her screen, streams of data flowed – detections at A and B, separated by meters, yet statistically bound in a way Einstein called "spooky." For years, she’d operated under the comfortable assumption of Copenhagen’s irreducible randomness. The click *here* wasn't fixed until it happened, a tiny aperture for freedom in an otherwise clockwork cosmos. Her late-night debates with Marco, her colleague and Everettian evangelist, always circled back to that: "The branches *are* the freedom, Lena! Every choice blooms a universe!"

  But Lena was drowning in trajectories.

  Not literal ones – Bohmian trajectories were notoriously difficult, if not impossible, to observe directly. No, it was the *implication* of them, the sheer weight of their hidden existence, that pressed down. It started subtly, a nagging dissatisfaction with the "just so" nature of Copenhagen’s collapse postulate. Marco’s many-worlds felt like ontological inflation run amok, an infinite proliferation she found more absurd than profound. Then she’d revisited Bohm.

  De Broglie and Bohm. The pilot wave. A single, universal wave function, Ψ, evolving deterministically via Schrödinger’s equation, guiding point-like particles along definite, if hidden, paths. The wave didn’t collapse; it just *was*, a complex landscape guiding tiny boats. The randomness? An illusion. Born’s rule, the probability of finding a particle *here* and not *there*, emerged from a special initial condition: the *quantum equilibrium hypothesis*. At the universe’s dawn, the particles’ positions were distributed precisely according to |Ψ|². And because the dynamics preserved that distribution, it *looked* like chance governed individual measurements. But it was just ignorance. The dice were loaded at the Big Bang; every roll, every spin, every quantum choice, was fixed. Only we, trapped within the system, blind to the initial positions, perceived indeterminacy.

  "It’s all in the nonlocality, Lena," she muttered, tracing a correlation plot on her screen. Two photons, born entangled, flying apart. In Bohm’s picture, the pilot wave encompassing both instantaneously updates when one is measured. The position of the particle at detector A *immediately* influences the guidance conditions for its partner hurtling towards B, faster than light. No spooky collapse, just a holistic, nonlocal choreography written into Ψ from the beginning. The universe didn't *choose* at the moment of measurement; it was merely revealing a path laid down eons ago. The perfect correlations in her data weren't evidence of fundamental randomness; they were the signature of this hidden, deterministic dance.

  She’d run simulations. Simplified models of particles in potential wells, governed by the Bohmian guidance equation: **dx/dt = (ħ/m) Im( ∇ψ / ψ )**. She watched the dots crawl along their preordained paths, their destinations fixed by the initial wave function and their starting positions – positions forever unknown to her, locked in quantum equilibrium. The apparent "jump" when a measurement occurred? Just the particle entering a region where the wave function channeled it definitively towards one detector or the other. No branching, no dice roll. Just revelation.

  The cost struck her not in the lab, but in the sterile quiet of her apartment. Her mother’s final illness. Lena had chosen, agonizingly, to prioritize a crucial conference run. She’d made it back just hours before the end, carrying the brittle justification that quantum uncertainty meant her choice *could* have been different, that the universe hadn’t predetermined her absence. It was a small, cold comfort, but she’d clung to it.

  Now, Bohmian mechanics stripped even that away. If the pilot wave guided photons with relentless determinism, why not neurons? Why not the cascade of electrochemical signals that led her to book that flight, prioritize ambition over presence? Her "choice" wasn't free; it was the inevitable outcome of her initial position in the configuration space of the universe, guided by Ψ along a single, unbroken thread of cause and effect. The guilt wasn't softened by chance; it was etched deeper by necessity. There was no other branch where she stayed. No dice God rolled that came up 'conference'. Just her, on this one, fixed path, arriving too late.

  She found Marco in the coffee room. "Ran the Bell test correlations again," she said, her voice flat. "Perfect, within error margins. As always."

  Marco grinned, stirring his latte. "See? Indeterminacy in action! Or rather, determinism across a multiverse of possibilities."

  Lena shook her head. She didn't have the energy for the old debate. "Or," she said, meeting his eyes, "it's consistent with a single, nonlocal, deterministic process. Bohmian mechanics."

  Marco's smile faltered, replaced by surprise, then faint condescension. "Bohm? Lena, come on. The hidden variables? The preferred frame issues? It’s… inelegant. Clunky. Why posit all those definite positions we can never see?"

  "Because they explain the *appearance* without the magic," Lena countered, the arguments flowing with the tired certainty of conversion. "No arbitrary collapse. No ontological excess of worlds. Just one wave, one set of particles, evolving deterministically. The randomness is epistemic, Marco. It’s *us*. We started ignorant. We stay ignorant. Quantum equilibrium hides the mechanics, not the determinism."

  "But free will..." Marco started.

  "Is what?" Lena interrupted, a harsh edge in her voice. "A story we tell ourselves? A useful illusion generated by our ignorance of our own initial conditions? In Bohm’s universe, the pilot wave set the course at t=0. Everything since is just unfolding. Including," she paused, the image of her mother’s frail hand sharp in her mind, "our choices. Including my absence."

  Marco looked uncomfortable. "That’s… bleak, Lena."

  "Is it?" She stared into her untouched coffee. "Or is it just honest? No quantum escape hatch. No branching safety net. Just one history. One set of hidden variables. One trajectory." She thought of the particles in her simulation, following their invisible rails. "Knowing the path is fixed doesn't mean you stop walking it. You just… understand why the turns feel inevitable."

  Later, alone with the hum of the photon source, Lena watched the data stream. Each detection point wasn't a moment of creation, but a point of revelation on a path laid down with the universe itself. The nonlocality wasn't spooky; it was the deep, instantaneous connection woven into the fabric of Ψ, ensuring every part knew the whole. The pilot wave wasn't a metaphor; it was the engine, guiding everything – photons, planets, people – along grooves carved at the beginning.

  The guilt remained, a cold stone. But its nature had changed. It wasn't a mark of a bad choice freely made; it was the weight of a necessary outcome. There was a strange, bleak solace in that. No could-have-beens. No quantum dice to curse. Only the single, unyielding river of reality, flowing from its source. Her mother’s death, her absence, her presence here now, analyzing the predetermined dance of photons – all were fixed points on the same, inescapable trajectory guided by the silent, all-determining wave. Freedom wasn't in the indeterminacy. It was, perhaps, in the act of seeing the chains clearly, and walking the path anyway, knowing it was the only one there ever was. The hum of the machine deepened, sounding less like uncertainty now, and more like the low, constant thrum of a vast and predetermined engine.
