  Why do philosophers find Leibniz more resilient? Because his argument bypasses the need for a temporal start. It's about the grounding of existence. If the universe is contingent, it requires a necessary foundation. Scientific models about time don't touch that. The user might not have considered metaphysical necessity versus physical causes. 

