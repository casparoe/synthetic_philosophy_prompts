  We are going to create a dialogue between two philosophers: Lewisian (let's call her Laura) and Primitivist (let's call him Peter). They are discussing the "big bad bug" and the New Principle in the context of Humean Supervenience and objective chance.

  Setting: A coffee shop near the university, after a seminar on the topic.

  Laura: ... so you see, Peter, the New Principle is exactly what we need. Instead of conditioning on a single chance hypothesis, we condition on the entire chance theory of the world. That way, we avoid the undermining futures because we're not just taking a snapshot of the chance at a time, but the whole theoretical setup that makes that chance true.

  Peter: Laura, I appreciate the elegance of the New Principle, but I think it's a band-aid on a deeper wound. The problem is that under Humean Supervenience, the chance of an event is supposed to supervene on the entire pattern of particular facts, including the future. But then, there are possible futures that are assigned positive probability by the current chance distribution, yet if they occur, they falsify that very distribution. That's not just a technical glitch; it shows that the Humean account of chance is fundamentally at odds with the Principal Principle.

  Laura: But the New Principle resolves that tension. Remember, the Principal Principle originally said that your credence in an event A, conditional on the chance of A being x and any admissible information, should be x. The problem was that the entire future history is admissible under Humean Supervenience because it's part of the supervenience base. So we had to change the principle. The New Principle says: condition on the entire chance theory T, and then set your credence to the chance given by T conditional on T itself. In symbols: Cr(A | T) = T(A | T). That way, even if T assigns positive probability to an undermining future, when we condition on T we are effectively excluding those futures because T(A | T) is defined in a way that already accounts for the truth of T.

  Peter: I understand the formalism. But let's make it concrete. Take a simple case: we have a radioactive atom with a half-life of 1 hour. The chance of decay in the next hour is 0.5. Now, under Humean Supervenience, the chance at t0 is fixed by the entire history of the world. Suppose that in the actual world, the atom decays at t1. But there's a possible future in which, by a huge run of "luck", the atom never decays over the next million years. That future has very low but positive chance at t0. However, if that future were to occur, then the pattern of events would be such that the chance at t0 wasn't 0.5 after all, because the Humean account would have to say that the chance was much lower to fit the pattern. So the chance theory that says the chance at t0 was 0.5 is false in that future. But then, how can the Principal Principle hold? The original principle tells me to have credence 0.5 in decay at t0, but in that future, that credence would be wrong because the chance wasn't 0.5.

  Laura: Exactly, and that's why we move to the New Principle. We don't condition just on "chance at t0 is 0.5", but on the entire chance theory T for the world. T includes the whole story about how chances evolve and how they supervene on the pattern. So when we condition on T, we are conditioning on the truth of the entire theory. Then, the chance we use is T(A | T). In the case of the radioactive atom, T would tell us what the chance of decay is at t0, conditional on T being true. And T being true implies that the pattern of events is typical for a chance of 0.5. So T(A | T) is 0.5, and we set our credence accordingly. The undermining future, in which the atom never decays, is one in which T is false. So we don't condition on T in that future.

  Peter: But that's the point: you're conditioning on T, which is a fact about the entire history. But how do we know T? As a Humean, you think T supervenes on the entire pattern of events. But at t0, we don't know the entire pattern. So when we set our credence, we have to condition on T, which we don't know. So we have to have a prior over possible chance theories. And that's where the problem reappears. Consider: at t0, I have a prior over possible T's. But each T assigns a positive probability to futures that undermine it. So when I update on T, I'm ignoring those undermining futures because T(A | T) is defined to avoid them. But in my prior, I should assign some credence to the undermining futures even if they undermine my current best theory. How does the New Principle handle that?

  Laura: It handles it by making sure that when we condition on T, we are using the chance that T assigns conditional on T being true. So even if T assigns a positive probability to an undermining future, when we condition on T we are effectively setting the probability of the undermining future to zero because T being true rules out the undermining future. So in the prior, we have to consider the possibility of different T's, but once we condition on a particular T, we use the chances as defined by T under the assumption that T is true.

  Peter: But that seems ad hoc. Why should we condition on T in a way that rules out the very futures that T says are possible? It's like T is saying: "I assign positive probability to not-T, but if you condition on me, you have to ignore that possibility." That's a contradiction in terms.

  Laura: It's not a contradiction because T(A | T) is a conditional chance. It's the chance that A happens given that T is true. And if T is true, then the undermining futures don't occur. So T(A | T) is the chance of A in the worlds where T holds. It's a well-defined mathematical object.

  Peter: But the problem is that T, being a Humean chance theory, is a contingent fact about the world. It might be false. And the Principal Principle is supposed to guide our credences when we don't know if T is true. The New Principle only tells us what to do when we condition on T. But what if we condition on something less? What if we condition on the chance at t0 being 0.5, but we don't know the entire theory T? That's the original situation. The New Principle requires that we have the entire chance theory to condition on, but in practice, we never have that.

  Laura: That's a fair point. But in practice, we have partial knowledge of the chance theory. We know that the world is approximately like such-and-such a theory. So we condition on that. And the New Principle gives us a way to avoid the undermining problem when we do have a full theory. For the cases where we don't, we can use an approximate version. The key is that the New Principle is the correct norm for full information about chances.

  Peter: But that's where I think the Humean account is fundamentally flawed. On my primitivist view, chance is an irreducible feature of the world at a time. The chance of decay at t0 is 0.5, and that's a basic fact. It doesn't depend on the future. So there's no undermining: the chance at t0 is what it is, and it can assign positive probability to any future, including one in which, by coincidence, the decay doesn't happen for a long time. But that future doesn't change the chance at t0. The chance at t0 is fixed and true regardless of what happens later. So the Principal Principle applies straightforwardly: I set my credence to 0.5, and that's that.

  Laura: But then, Peter, how do you explain why frequencies tend to match chances? On the Humean view, that's built in: the chance is defined by the pattern, so of course they match. But on your view, it's a brute fact. And what if the frequencies don't match? Then you have to say that the world has a chance that is not manifested in the frequencies, which makes chance unobservable.

  Peter: I concede that point. On my view, chance is not directly observable. We have to infer it from frequencies and other evidence. But that's the cost: chance is a theoretical primitive. However, it avoids the undermining problem entirely. The chance at t0 is independent of the future, so there's no future that can undermine it. The Principal Principle holds without any patches. And that's a principled advantage.

  Laura: But what about the connection between chance and possibility? Humean Supervenience gives a naturalistic account: chance is just a summary of the pattern of events. Your primitivism makes chance a mysterious extra ingredient.

  Peter: Not necessarily. It might be a fundamental physical feature, like mass or charge. We don't think mass supervenes on the distribution of matter in some Humean way; it's a property. Similarly, chance could be a property of events or processes.

  Laura: But then, how does it relate to determinism? In a deterministic world, there are no chances, only credences. But on your view, could there be primitive chances in a deterministic world?

  Peter: No, I would say that in a deterministic world, the chance of an event is either 0 or 1, and it is fixed by the laws. But the laws are not Humean; they are primitive. So again, no undermining.

  Laura: But now you're multiplying primitives. Humean Supervenience is a more parsimonious metaphysics.

  Peter: Perhaps, but it leads to the big bad bug. The New Principle is a clever fix, but it changes the Principal Principle in a way that makes chance deference dependent on having the entire chance theory. That's a heavy epistemological burden. And it still doesn't resolve the issue that the chance theory T itself is contingent and might be undermined. The New Principle just assumes that T is true when we condition on it. But what if T is false? Then we have to use a different T. But the set of possible T's is defined by the Humean mosaic, which includes the future. So the problem is only postponed.

  Laura: I think we've reached an impasse. I see the New Principle as a natural evolution of the Principal Principle that respects the holistic nature of Humean chance. You see it as a patch that doesn't address the root problem.

  Peter: Exactly. And I think the root problem is that Humean Supervenience cannot ground objective chance in a way that is both non-circular and consistent with the Principal Principle. The New Principle saves consistency, but at the cost of making chance deference conditional on knowing the entire chance theory, which is impossible in practice. My primitivism avoids the bug by making chance independent of the future, but at the cost of making it a metaphysical primitive. It's a trade-off.

  Laura: Then let's agree to disagree. But I still think the Humean account, with the New Principle, is the best game in town for a naturalistic metaphysics.

  Peter: And I think it's a game that was rigged from the start. But I'll drink to that.

  They clink coffee cups.
answer: |-
  ### Dialogue: The Humean and the Primitivist on the "Big Bad Bug"

  **Characters:**  
  - **Laura**: A committed Lewisian. Defends Humean Supervenience (HS) and the New Principle as a principled fix for undermining.  
  - **Peter**: A primitivist about chance. Argues that the need for the New Principle reveals a fatal flaw in HS and that chance must be irreducible.  

  **Setting:**  
  A university library after a seminar on Lewis’s “big bad bug.” Laura and Peter are reviewing notes, with a radioactive decay thought experiment sketched on a whiteboard.  

  ---

  **Peter** (leaning back, gesturing at the whiteboard): Laura, I’ll grant that the New Principle *technically* blocks undermining. But it’s a patchwork fix that betrays the whole spirit of Lewis’s project. Humean Supervenience promised to ground chance in nothing but the “mosaic” of particular events—past, present, and future. But now, with undermining, we’ve got futures where the chance theory at time *t* assigns positive probability to events that would *falsify* that very theory. The New Principle rescues deference by forcing us to conditionalize on the *entire chance theory* T, not just a single chance value. But that’s just a fancy way of hiding the problem: HS makes chance *ontologically dependent* on the future, yet the Principal Principle requires it to *guide* our expectations about that future. That’s circular!  

  **Laura** (sipping coffee, calmly): Peter, you’re missing the point. The New Principle isn’t an *ad hoc* trick—it’s what deference to chance *always should have been* under HS. Lewis’s original Principal Principle was too simplistic: it said to set your credence in A equal to ch(A) conditional only on the chance at *t* and “admissible” information. But in a Humean world, *all historical information* is admissible because chances supervene on the whole pattern. That’s why undermining arises. The New Principle corrects this by recognizing that chance isn’t just a single value; it’s a *systemic feature* of the world. When you conditionalize on T—the full chance theory—you’re not ignoring undermining futures; you’re *using* T to tell you what ch(A) *would be* if T were true. That’s not circular; it’s coherent.  

  **Peter**: But that’s my issue! Let’s make this concrete. Take your favorite example: a radioactive atom with a half-life of 1 hour, so ch(decay in next hour) = 0.5. Under HS, this 0.5 is fixed by the *entire* history of the universe, including the future frequency of decays. Now, there’s a possible future where, by fluke, this atom *never* decays over a billion years. The chance theory at *t* assigns tiny-but-positive probability to that future. But if it happens, the actual frequency of decays would be so low that HS would demand a *different* chance theory—one where ch(decay) is near zero, not 0.5. So the original theory undermines itself! Your New Principle says: “Conditionalize not on ch(decay) = 0.5, but on T, and set credence to T’s *conditional* chance T(A | T).” Fine, but T(A | T) is just 0.5 here because T “knows” it’s true. How is that not cheating?  

  **Laura**: It’s not cheating—it’s *precision*. In your decay case, T is a vast statistical hypothesis about the entire mosaic. When you learn T, you learn that the world is *typical* for a chance law of 0.5. So T(A | T) *must* equal T(A) because T *entails* that undermining futures don’t occur. The New Principle isn’t inventing new probabilities; it’s respecting the *logic* of chance under HS. Deference means trusting the *whole system*, not a fragment. If you only knew ch(decay) = 0.5 but not T, you’d use the original Principal Principle. But once you know T, you upgrade to the New Principle. This is no different from how we handle complex theories in science.  

  **Peter** (leaning forward): But that’s where your defense stumbles. You’re conflating *epistemology* with *metaphysics*. For the primitivist, chance is irreducible: at *t*, ch(decay) = 0.5 is a *brute fact* about the atom’s propensity, independent of the future. Undermining can’t arise because chances aren’t *made true* by the future mosaic; they’re fixed at *t*. So the Principal Principle works *without patches*: I set credence to 0.5, full stop. Even in your fluke future where decay rarely happens, the chance at *t* was still 0.5—it’s just that a rare event occurred. No paradox, no need to conditionalize on T. The “bug” only exists because HS *defines* chance in a way that’s inherently future-dependent. The New Principle papers over this with a technicality, but it doesn’t fix the metaphysics.  

  **Laura**: Ah, but now you’re dodging the cost of your view. If chances are primitive, how do you *know* ch(decay) = 0.5? Frequencies are *evidence* for you, but they don’t *constitute* chance. So in your fluke future, even after seeing a billion years without decay, you’d still insist the chance was 0.5 all along. That makes chance *unknowable* from data—a major loss. HS, by contrast, explains why frequencies *should* match chances: because chances *are* summaries of patterns. The New Principle preserves this while avoiding inconsistency.  

  **Peter**: Fair—I concede that primitivism makes chance harder to know empirically. But that’s a price for metaphysical coherence. HS ties chance to the mosaic, but then the Principal Principle can’t guide rational belief because the mosaic *includes the very future you’re predicting*! The New Principle tries to fix this by making T a fixed point, but T itself is *mosaic-dependent*. So in practice, when you conditionalize on T, you’re sneakily *presupposing* the future that makes T true. That’s not deference; it’s question-begging.  

  **Laura**: Not at all. Let’s clarify with math. Let T be the proposition that the chance theory is correct. The New Principle says: Cr(A | T) = T(A | T). For our atom, T(A | T) = T(A) = 0.5 because T specifies that the world is typical. This is just a reflection of the *objective* fact that, *if T is true*, undermining futures *don’t occur*. It’s not presupposing; it’s *conditioning*. And this works *because* HS grounds T in the mosaic: T is *true* precisely when the frequencies are right. So deference is saved.  

  **Peter**: But that’s my core objection: under HS, T’s truth *depends* on the future, so conditioning on T *smuggles in* future facts. That’s why primitivism dissolves the bug—by decoupling chance from the future entirely. Chance is a fundamental, time-indexed property. At *t*, ch(A) = x constrains rational credence *directly*, no matter what happens later. Yes, that means chance can’t be reduced to frequencies, but it avoids the bootstrapping of the New Principle. The “bug” isn’t a bug; it’s a sign that HS can’t ground objective chance. Lewis saw that and patched it, but the cost is a deference principle that’s hostage to knowing T—which, in real cases, we never do fully.  

  **Laura**: I disagree. The New Principle *strengthens* HS by showing how chance can be both objective and supervenient. It’s not “hostage” to T; it’s *scalable*. With partial knowledge, we approximate T with our best theory. And in ideal cases, it works perfectly. You primitivists, though, have no explanation for *why* chances align with frequencies—you just call it a miracle. HS explains it, and the New Principle secures it against undermining. That’s principled.  

  **Peter**: It’s principled only if you accept that chance is a “bookkeeping” device for the mosaic. But if chance is truly *objective*, it should constrain credence *without* tacitly relying on the future. The New Principle fails that test. So we’re at a standstill: you value naturalism and explanatory power; I value metaphysical independence. But the very existence of the “big bad bug”—and the need for a patch—shows HS was never the right foundation for chance.  

  **Laura** (smiling): Then I’ll defend that foundation to the end. The New Principle isn’t a retreat; it’s Lewis’s view *grown up*.  

  **Peter**: And I’ll say it’s a sign Humeanism should have stayed in its lane. Pass the coffee?  

  ---  
  **Key Takeaways**:  
  - **Laura (Lewisian)**: Argues the New Principle is a natural refinement of deference under HS, fixing undermining by conditionalizing on the entire chance theory *T*. This respects chance as a systemic, mosaic-dependent feature and explains frequency-chance alignments.  
  - **Peter (Primitivist)**: Contends that undermining arises because HS ties chance to the future, creating circularity. The New Principle masks this with conditionalization on *T*, but *T* itself depends on the future. Primitivism avoids the bug by making chance irreducible and time-indexed, but at the cost of empirical accessibility.  
  - **Concrete Case**: The radioactive atom highlights the dispute—Laura sees the New Principle as ensuring typicality under *T*, while Peter sees it as circular and insists chance at *t* is independent of future flukes.
