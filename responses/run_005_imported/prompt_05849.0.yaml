  **Justifications:**  
  - **Move 1 (Owen): Score 2**  
    Correct textual citation. Aquinas *explicitly* endorses private tyrannicide against usurpers ("qui dominum non habet") without requiring authorization. The reward/praise language confirms this is a *positive* moral act, not merely tolerated.  

  - **Move 2 (Marisol): Score 2**  
    Accurately distinguishes Aquinas's two tyrant types. *De Regno* (I.6-7) explicitly rejects private action against *legitimate* rulers-turned-tyrants due to practical risks of abuse, reserving remedy for the appointing authority. This is consistent with the Sentences' silence on this scenario.  

  - **Move 3 (Owen): Score 1**  
    Correctly identifies a tension: declaring a ruler a "usurper" *is* a judgment. However, Aquinas treats usurpation (force/fraud without title) as objectively verifiable (e.g., a coup), distinct from evaluating ongoing governance. Thus, Marisol's distinction (Move 4) mitigates but doesn't fully resolve this.  

  - **Move 4 (Marisol): Score 1**  
    Valid that usurpation identification relies more on factual claims (e.g., seizure by violence) than subjective evaluation of "abuse." But Owen is right that declaring someone a "usurper" can *still* be contested (e.g., disputed succession). Overstates the objectivity.  

  - **Move 5 (Owen): Score 2**  
    Strong critique. Aquinas (*De Regno* I.6) uses *collective* actions (Rome/Senate) as models against tyrants but never explains why *their* judgment is less prone to self-interest than an individual's. The texts implicitly trust institutional processes without justifying their reliability.  

  - **Move 6 (Marisol): Score 1**  
    Correct that collective action requires broader consensus, making pretextual tyranny claims *harder* to mobilize. But concedes Owen's point that Aquinas offers no *in-principle* safeguard against collective self-interest, only a practical hurdle.  

  **What Both Are Missing:**  
  Owen and Marisol overlook Aquinas’s **theological ontology of authority**. For Aquinas, a usurper *fundamentally lacks* authority (as power derives from God via just title), making him a private malefactor who may be resisted like any criminal. A legitimate ruler, even abusive, retains *formal authority* until removed by the divine-derived institution that installed him. Thus, the consistency lies not in epistemology ("who judges?") but in *metaphysics of legitimacy*: usurpers never possessed licit power, so their killing isn't "regicide" but just punishment. The public/private distinction in *De Regno* flows from this – only institutions embodying the *ordo iuris* can revoke divinely mediated authority. Both debaters underplay how Aquinas subordinates political remedies to his hierarchical cosmology.
