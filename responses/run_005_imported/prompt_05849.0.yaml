  For move (2): Marisol correctly distinguishes between usurpers and legitimate rulers who turn tyrannical. De Regno does emphasize the dangers of private individuals acting alone in the latter case. Her distinction aligns with Aquinas's framework, so this also deserves a high score, probably a 2.

