  Move (6): Marisol concedes that collective action isn't foolproof but argues it's still harder to orchestrate than individual action, thus serving as a practical safeguard. This is reasonable but doesn't fully address the reliability concern. I'd score it 1.

  Both Owen and Marisol are missing Aquinas's underlying theological framework. His primary concern is maintaining order to allow for virtue and salvation. The distinction between usurpers and abusive rulers ties into natural law and divine authority. Usurpers violate the very basis of legitimate power, making them open targets, whereas installed rulers, even if abusive, derive authority from God, requiring formal processes for removal. They also overlook Aquinas's teleological view of the common good, where any action, including tyrannicide, must be measured against its impact on societal harmony and spiritual ends.
