answer: |-
  Here’s a clear, engineering-style decision framework for the indicative/counterfactual divide, grounded in the strongest arguments from philosophy of language. The verdict: **Indicative and counterfactual conditionals are fundamentally different semantic beasts requiring distinct treatments. Unification collapses under logical pressure.** Below is the breakdown, evidence, and decision rationale.

  ---

  ### **Core Problem Statement**
  - **Indicative Conditional (IC):**  
    *"If Oswald didn’t kill Kennedy, someone else did."*  
    Behaves like a **material implication** (`¬Oswald → SomeoneElse`). True if Oswald didn’t act *and* someone else did.  
  - **Counterfactual Conditional (CC):**  
    *"If Oswald hadn’t killed Kennedy, someone else would have."*  
    Invokes **alternative scenarios** where Oswald is removed from history, and we ask what *would* happen.  

  Same surface grammar, opposite truth values in context. Why?

  ---

  ### **The Case for Unification (Stalnaker/Lewis)**  
  **Theory:** Both ICs and CCs are evaluated in **possible worlds**, differing only in *which worlds* we consider.  
  - **Stalnaker (1968):** Selects the *single closest world* where antecedent (A) is true.  
    - IC: Closest world where Oswald didn’t kill Kennedy (factual background preserved).  
    - CC: Closest world where Oswald didn’t kill Kennedy (historical/causal laws adjusted).  
  - **Lewis (1973):** Ranks worlds by similarity. CCs require worlds where A is true *and* minimal changes exist.  

  **Argument Strength:**  
  - Elegantly handles tense/mood shifts via world-selection rules.  
  - Explains why CCs imply falsity of antecedent (*"hadn’t"* implies Oswald *did*).  
  - Unified syntax-to-semantics mapping.  

  **Fatal Flaw:**  
  - **Adams’ Triviality Result (1975):** Proves ICs **cannot** be truth-conditional without collapsing probability.  
    - If ICs had truth values, we could assign probabilities (e.g., *P(If ¬Oswald, SomeoneElse)*).  
    - But probability of ICs *is* conditional probability: *P(If A, B) = P(B|A)*.  
    - Adams proved that *no* truth-conditional semantics can satisfy this for all cases without reducing to *P(A→B) = P(B|A)* — which is inconsistent with standard logic.  
    - *Engineer translation:* Trying to force ICs into a truth-functional `if` breaks probabilistic coherence.  

  ---

  ### **The Case for Divergence (Adams/Gibbard)**  
  **Theory:** ICs and CCs have different logical structures.  
  - **Indicatives (Adams, 1975):**  
    - **Non-truth-conditional.** They express *high conditional probability*:  
      *"If ¬Oswald, SomeoneElse"* asserts *P(SomeoneElse | ¬Oswald) ≈ 1*.  
    - No truth value — just a speaker’s epistemic commitment. Explains why changing evidence alters acceptability.  
  - **Counterfactuals (Gibbard, 1981; Lewis, 1979):**  
    - **Truth-conditional, but context-dependent.** Evaluate in worlds where A is true *and* we hold fixed relevant background facts.  
    - *"If Oswald hadn’t killed Kennedy..."* requires removing Oswald’s action while preserving causal/historical context.  

  **Argument Strength:**  
  1. **Triviality Proof:** Forces ICs out of truth-conditional semantics.  
  2. **Probability Gaps:**  
     - IC: *"If it rains tomorrow, the game will be canceled"* — acceptable if *P(cancel|rain)* is high.  
     - CC: *"If it had rained yesterday, the game would have been canceled"* — true/false based on facts (e.g., was there a backup plan?).  
  3. **Context Sensitivity:**  
     - ICs depend on **current knowledge** (e.g., *"If Biden didn’t win in 2020, Trump did"*).  
     - CCs depend on **causal laws** (e.g., *"If Nixon had pressed the button, nuclear war would have started"*).  

  ---

  ### **The Decisive Test: Context Shifts**  
  Unification fails when context changes:  
  1. **Future Indicative → Counterfactual:**  
     - Monday: *"If it rains on Wednesday, the game will be canceled."* (IC: probability-based)  
     - Thursday (sunny): *"If it had rained yesterday, the game would have been canceled."* (CC: truth-conditional)  
     Same antecedent/consequent, but different semantic mechanisms.  
  2. **Kennedy Case:**  
     - IC: Asserts logical exclusion (*one* killer exists).  
     - CC: Asserts **causal backup mechanism** (conspiracy theory).  
     Unification can’t explain why grammar alone flips meaning.  

  ---

  ### **The Verdict: Divergence Wins**  
  **Design Decision:**  
  - **Treat ICs as probabilistic assertions** (Adams-style).  
    - *Implementation:* `if` with Bayesian update, not boolean check.  
  - **Treat CCs as possible-worlds conditionals** (Lewis-style).  
    - *Implementation:* Contextually determine similarity metric for worlds.  

  **Why Not Unified?**  
  - Triviality proves ICs *can’t* be truth-conditional.  
  - CCs require worlds where the antecedent is *false* (unlike ICs).  
  - Grammar (tense/mood) signals which mode is active.  

  **What It Depends On:**  
  1. **Temporal/Modal Context:**  
     - Past tense + perfect aspect (`hadn’t/would have`) → CC.  
     - Present/future + simple aspect (`didn’t/did`) → IC.  
  2. **Speaker’s Presuppositions:**  
     - IC: Antecedent may be true or false (open epistemic possibility).  
     - CC: Antecedent is presumed false (e.g., *"hadn’t"* implies Oswald *did*).  
  3. **Probability vs. Causality:**  
     - ICs track likelihoods (*"If you jump, you’ll fall"*).  
     - CCs track causal dependencies (*"If you had jumped, you would have fallen"*).  

  ---

  ### **Engineering Takeaways**  
  1. **Natural language `if` ≠ Code `if`:**  
     - NL conditionals are dynamic tools for reasoning under uncertainty (ICs) or simulating alternatives (CCs).  
  2. **Avoid Truth Values for ICs:**  
     - Model ICs as `P(B|A) > threshold` (e.g., in AI dialogue systems).  
  3. **For CCs, Simulate Worlds:**  
     - Use causal models (Pearl-style) to generate closest A-worlds.  
  4. **Syntax Matters:**  
     - Grammar (tense/auxiliaries) is your API to switch modes.  

  **Final Call:** Just as you wouldn’t use a hammer for a screw, don’t force unified semantics onto ICs/CCs. The collapse under triviality is a critical bug — divergence is the only patch that works.  

  *References for your roommate:*  
  - Adams, E. (1975) *The Logic of Conditionals*  
  - Lewis, D. (1973) *Counterfactuals*  
  - Stalnaker, R. (1968) *A Theory of Conditionals*  
  - Gibbard, A. (1981) *Two Recent Theories of Conditionals*
