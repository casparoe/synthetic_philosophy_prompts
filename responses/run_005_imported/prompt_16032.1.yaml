answer: |-
  ## The Supererogatory Squeeze: Can Maximizing Consequentialism Make Room for Saints?

  Peter Singer's drowning child argument is a relentless engine, driving us towards the conclusion that if we can prevent significant harm at little cost to ourselves, we are morally obligated to do so. The subsequent debates often focus on calibrating *how much* sacrifice is obligatory before tipping into the supererogatory. But you've identified the deeper, more corrosive tension: **a pure maximizing act consequentialism (MAC) appears structurally incapable of accommodating a genuine category of supererogatory action.** If the morally right act is *always* the one that produces the *most* expected good, then performing that act is simply doing one's duty. Anything less falls short. Where, then, does the space for praiseworthy heroism "beyond the call" emerge? Let's dissect the major attempts to carve out this space within or adjacent to consequentialism, using the grenade-smothering soldier and plague-stricken doctor as our moral compasses.

  **The Maximizing Consequentialist Core (and the Problem):**

  MAC defines the right act as the one maximizing expected overall good (however defined – welfare, preference satisfaction, etc.). Duty and optimality are coextensive. Consider the soldier who throws himself on a grenade to save his squadmates. If this act demonstrably produces the *best* outcome (e.g., saving 5 lives at the cost of 1), MAC declares it obligatory. Praising it as supererogatory seems misplaced; he simply did what *had* to be done. Conversely, if *not* jumping produced a slightly better outcome (a scenario hard to imagine but logically possible), then jumping would be wrong. The doctor who stays in the plague city, working herself to exhaustion saving countless lives, is similarly just doing her job under MAC if that maximizes good. The intuition that her sacrifice is *extraordinary* finds no purchase. This is Kagan's hard-nosed position: **our belief in robust supererogation is a psychological relic, an underappreciation of the true, immense demands of morality.** Morality *requires* us to sacrifice anything less valuable than the good we can achieve. The grenade jumper *must* jump; the doctor *must* stay. Anything less is wrong. While logically consistent, this view clashes violently with deep-seated moral intuitions about the limits of obligation and the special praise due to extreme sacrifice.

  **Attempt 1: Satisficing Consequentialism (Slote)**

  *   **The Move:** Slote severs the link between rightness and optimality. An act is right if its outcome is "good enough," exceeding some threshold of acceptability, even if a better outcome was available. Duty demands adequacy, not maximization.
  *   **Creating Supererogation Space:** Jumping on the grenade produces a *very* good outcome (saving many), but perhaps *not* jumping (if survival was possible) could still be "good enough" (e.g., the soldier survives, maybe saves one other). Jumping, then, becomes supererogatory – exceeding the adequacy threshold. Similarly, the doctor leaving the plague city might produce a "good enough" outcome (local medics handle it, she helps elsewhere), while staying produces a much better one, making it supererogatory.
  *   **Why it Doesn't Work (Coherently within Consequentialism):**
      1.  **The Arbitrariness Problem:** Defining the "good enough" threshold is notoriously difficult and seems arbitrary. Why *this* level and not slightly higher or lower? If the threshold is set high (near the optimum), supererogation space shrinks back towards the Kagan view. If set low, it permits significant moral slackness – failing to save many lives when easily possible could be "good enough." Consequentialism loses its core action-guiding force.
      2.  **The Motivation Problem:** Why *shouldn't* we aim for the best? If a better outcome is available at some cost, and that cost doesn't render the act impermissible (as per the threshold), satisficing offers no *positive consequentialist reason* not to pursue it. It merely says we *may* stop. This feels like a description of weakness, not a definition of a distinct moral category worthy of special praise.
      3.  **Collapse Risk:** If the "good enough" level is defined contextually relative to available options, it risks collapsing back into a form of maximization under constraints. True satisficing requires a fixed or independently defined threshold, which is precisely what's elusive.

  Satisficing creates *logical* space for supererogation but fails to provide a *principled, consequentialist justification* for why maximizing isn't always required. It feels like an ad hoc carve-out rather than a coherent development of consequentialism.

  **Attempt 2: Agent-Centered Prerogatives (Scheffler)**

  *   **The Move:** Scheffler introduces a structural modification. Agents are *permitted*, but not required, to give *some* extra weight to their own interests, projects, and commitments when calculating the right act. This creates a zone of moral *option*: acts that are impartially suboptimal but permissible because they respect the agent's personal point of view.
  *   **Creating Supererogation Space:** The soldier has a prerogative *not* to jump. Jumping would be impartially optimal (saving net lives), but he is permitted to prioritize his own survival. Therefore, jumping is supererogatory – he goes beyond what he is *required* to do (which is to act within his prerogative, perhaps taking cover or throwing the grenade back if possible). The doctor is permitted to leave the plague city to pursue her own life or care for her family; staying, sacrificing her personal projects entirely, is supererogatory.
  *   **Why it Doesn't Work (As Pure Consequentialism):**
      1.  **The Alien Element:** Agent-centered prerogatives are fundamentally *deontic* constraints grafted onto consequentialism. They are justified by the value of agency or integrity, not by their *consequences* for the overall good. Allowing an agent to choose an act with *less* good overall, simply because it benefits *them*, violates the core consequentialist tenet that only the *impartially assessed* outcome matters for rightness. This isn't consequentialism modified; it's a hybrid theory.
      2.  **The Demarcation Problem:** How much extra weight is permissible? Scheffler offers no clear consequentialist principle to define the *scope* of the prerogative. Without this, the line between permissible self-preference and impermissible selfishness remains arbitrary. Is the soldier's prerogative large enough to permit fleeing entirely, or only to seek cover?
      3.  **Supererogation or Just Permitted Suboptimality?** While jumping is *beyond requirement*, is it praiseworthy in the *special* way supererogation demands? Under this scheme, jumping is simply doing the impartially best act, which the prerogative *excused* him from doing. The "heroism" seems diminished; he's just not taking the excuse he was offered. The focus shifts from the *positive value* of the sacrifice to the *permissibility* of avoiding it.

  Scheffler's approach effectively creates a category of acts that are *permissible but not optimal*, and defines supererogation as *optimal but not required*. However, it achieves this by abandoning the core maximizing and impartial foundation of consequentialism.

  **Attempt 3: Dual-Ranking Consequentialism (Portmore)**

  *   **The Move:** Portmore proposes a sophisticated two-step evaluation. First, acts are ranked *impersonally* by overall good produced. Second, they are ranked *personally* from the agent's perspective, incorporating agent-relative reasons (e.g., "it's *my* child," "this is *my* life project"). The *right* act is the one that is *best* according to the *correct* weighting of these two rankings. Crucially, Portmore argues the correct weighting sometimes allows an agent to permissibly choose an act that is *not* impersonally best if it ranks high enough personally. Supererogation occurs when an agent performs an impersonally best act that was *not* personally optimal (or even required) for them.
  *   **Creating Supererogation Space:** The impersonally best act is for the soldier to jump (saves most lives). However, from his *personal* perspective (weighting his own survival very heavily), jumping might rank very low. A different act (e.g., diving for cover) might be personally optimal and permissible. Therefore, jumping is supererogatory – it achieves the impersonal optimum, but the agent wasn't required to do it because a personally better (and impersonally acceptable) option existed. Similarly for the doctor staying.
  *   **Why it Might Work (But Strains Consequentialism):**
      1.  **Structural Coherence:** Portmore's system is internally consistent and maintains a consequentialist *structure* by defining rightness in terms of rankings of outcomes (including agent-relative values).
      2.  **Accommodates Intuitions:** It captures the intuition that the jumper goes *beyond* what could be reasonably expected of him, given the immense personal cost.
  *   **Why it Still Struggles (The Maximization Shadow):**
      1.  **Agent-Relative Values as Consequentialist?** The core challenge is whether incorporating agent-relative *reasons* (like "it's mine") as fundamental values *within* the consequentialist calculus is genuinely faithful to consequentialism's spirit. Traditional consequentialism sees agent-relativity as an irrational bias; Portmore elevates it to a source of value. This feels like a significant departure.
      2.  **The "Correct Weighting" Problem:** Like Scheffler, defining the "correct" weighting between impersonal and personal rankings is crucial and difficult. Portmore links it to what a fully rational, benevolent agent would will, but this risks circularity or collapsing back towards impersonalism. If the impersonal good *always* trumps significant personal costs in the weighting, supererogation vanishes. If personal costs can *easily* outweigh large impersonal gains, morality becomes too weak.
      3.  **Is the Supererogatory Truly Distinct?** While the act is impersonally optimal, the agent's *requirement* was only to choose an act from the set permissible under the dual-ranking. Performing the impersonal best is *optimal* within one ranking, but whether it feels like a distinct category of *saintly sacrifice* or just the best option *among those he was already allowed to choose* is debatable. The "beyond duty" aspect stems from the *permission* to do less, not an inherent property of the act itself within the theory.

  Portmore's is the most robust attempt, offering a coherent formal structure that *can* accommodate supererogation. However, its reliance on fundamental agent-relative values arguably moves it beyond traditional maximizing consequentialism into a distinct, hybrid territory.

  **The Verdict: Sacrificing Maximization for Saints**

  After examining the contenders, the conclusion is stark: **A pure, unadulterated maximizing act consequentialism cannot coherently accommodate a genuine, non-illusory category of supererogatory action.** Kagan is correct about the internal logic of MAC: the best act *is* the obligatory act. What we call supererogation would either be obligatory (if best) or wrong (if suboptimal). The intuition of supererogation as *distinctly praiseworthy beyond duty* is incompatible with MAC's relentless optimizing drive.

  *   **Slote's Satisficing:** Creates logical space but fails due to arbitrariness and lack of a principled consequentialist reason *not* to maximize. It doesn't solve the core problem; it sidesteps it unconvincingly.
  *   **Scheffler's Prerogatives:** Effectively creates supererogation by abandoning consequentialist impartiality. It's a compelling *moral theory* that accommodates supererogation, but it is not recognizable as *consequentialism*.
  *   **Portmore's Dual-Ranking:** Offers the most sophisticated integration, preserving a consequentialist framework while building in the necessary flexibility. However, its reliance on fundamental agent-relative *values* (not just permissions) represents a significant departure from the spirit of traditional maximizing consequentialism, which seeks an impartial, agent-neutral evaluation of states of affairs. It succeeds in accommodating supererogation only by relaxing the pure maximization mandate and incorporating deontic elements disguised as values.

  **Therefore, preserving a robust category of supererogation – actions that are morally praiseworthy, even heroic, yet genuinely beyond what is strictly required – necessitates giving up pure maximization within a consequentialist framework.** You must either:
  1.  **Abandon Maximization as the Definition of Rightness:** Adopt satisficing (despite its flaws) or another non-maximizing criterion.
  2.  **Introduce Non-Consequentialist Elements:** Incorporate agent-centered permissions (Scheffler) or fundamental agent-relative values (Portmore) that structurally limit the demands of impartial optimization.

  The drowning child argument reveals a profound truth: morality demands much. But the soldier on the grenade and the doctor in the plague remind us that morality also recognizes a space for extraordinary sacrifice that lies beyond the realm of duty. Maximizing consequentialism, in its pure form, cannot acknowledge this space without contradiction. Recognizing the supererogatory requires acknowledging a limit to maximization's domain, either by redefining duty or by admitting values that reside outside the impartial calculus of the greater good. The saint and the hero stand as testaments not to morality's underestimation of its demands, as Kagan suggests, but to its recognition of the profound, often unbearable, weight of being human within those demands. To honor them fully, we must allow for actions that are morally luminous precisely because they were not strictly commanded.
