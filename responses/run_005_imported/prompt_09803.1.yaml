  I should highlight where their concepts overlap. Both reject truth's authority, but their motivations differ. Arendt's liar is adversarial to truth, using it as a tool for destruction. Frankfurt's bullshitter is apathetic, treating truth as irrelevant. Also, Arendt's approach is structural, involving organized systems, while Frankfurt's is more individual.

