  Where would they push back? Arendt might say Frankfurt underestimates the deliberate destruction of truth in politics. Frankfurt could argue that Arendt's liars are actually bullshitters because their indifference is a form of not caring about truth. But Arendt would counter that the organized effort shows awareness, not indifference.

  The verdict: Frankfurt's bullshit is more common, but Arendt's framework is crucial for understanding systemic, reality-altering strategies. For modern spin, both are needed, but Arendt captures the existential threat to factual truth better.

