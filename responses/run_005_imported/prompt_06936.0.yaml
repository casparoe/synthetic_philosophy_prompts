  I'm a novelist drafting a scene in which a character is eventually shown to have had no way of doing otherwise than what she did — an unseen contingency stood ready to force her hand the instant she wavered — and yet, once the other characters learn this, they go on holding her fully responsible for it. I'd rather not lean on Frankfurt's own neurologist-and-prior-sign setup, or the equally familiar "chip in the brain," so I'm after a genuinely new Frankfurt-style case I can adapt for the page. Construct one for me, and make sure it survives the standard "flicker of freedom" rebuttal: there should be no thinner alternative anywhere in the lead-up to the act — not even a choice about whether to display the sign the intervener is watching for — left for a critic to seize on. Add a short closing note on why your version shuts off that escape route where the textbook case arguably leaves it open.
