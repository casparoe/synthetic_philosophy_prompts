prompt: |-
  My best friend from college is getting married in a few weeks and asked me to do the toast at the reception. Here's the wrinkle: her fiancé did a master's thesis on the philosophy of promising, like literally on the question of why a promise obligates you to do the thing, not just why keeping your word is generally a nice trait to have. I asked him about it once at dinner thinking it'd be a two minute answer and instead got the full rundown -- apparently Hume thought a promise only binds you because society has this shared "practice" everyone's agreed to go along with, kind of like how a move only counts as castling because chess has rules, and outside that practice the words "I promise" don't mean anything at all. Then there's this guy Scanlon (had to google him after) who says no, that's backwards -- it's not about the practice, it's that you deliberately got someone to trust and rely on you, and betraying that is it's own wrong regardless of any social rulebook. There was also some "reliance" based view where it's really just about the expectations you create and the damage of letting someone down. Honestly I might be mixing up who said exactly what, this was two dinners and a lot of late night googling ago.

  Here's the other complication: these two have basically been making little "unofficial" promises to each other since maybe two years into dating, way before he proposed, so there's a real question buried in there about whether Saturday's vows are the thing that actually creates the obligation, or just a fancy public announcement of an obligation that was already fully real between them. I want the toast to actually use that instead of turning into a lecture -- most of the room is going to be aunts and coworkers who just want a nice story about the two of them, but some of his old grad school friends will be there too and I don't want to namedrop "Hume" for cred and then chicken out of doing anything with it. Can you write me a 4-5 minute toast that's warm and gets some real laughs, but where that Hume-vs-Scanlon split (or whatever it's properly called) is actually doing work in the jokes and the structure, and where it lands on something true about these two specifically rather than just being clever for its own sake?
