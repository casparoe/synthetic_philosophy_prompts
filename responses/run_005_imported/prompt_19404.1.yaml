  The user emphasized avoiding namedropping for cred. Instead of saying "Hume" or "Scanlon," I can describe the concepts simply—"social rules" vs. "heartfelt commitment." The humor can come from exaggerating the groom's passion ("I asked about promises and got a two-hour lecture!") or joking about the absurdity of overthinking vows.

