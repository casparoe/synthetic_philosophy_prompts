  The user's anxiety about hypotheticals ("if zero chance of getting caught") feels like an unproductive mental trap. We can't test counterfactuals, and ethics isn't a purity test. Their consistent action (reporting) demonstrates integrity more reliably than any unprovable inner state. 

  Perhaps most importantly: their discomfort with the praise suggests authentic ethical concern. Truly self-serving people wouldn't lose sleep over this. The very act of questioning motives is evidence of integrity. 

