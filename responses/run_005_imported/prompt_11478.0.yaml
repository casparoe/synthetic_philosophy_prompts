prompt: |-
  In accuracy-first epistemology, probabilism is typically justified by an accuracy-dominance argument: when accuracy is measured using the Brier score, every credence function that violates the axioms of probability turns out to be less accurate, in every possible world, than some probabilistic credence function. Since this is supposed to be a fact about distance from the truth, shouldn't the same domination result go through if we instead measured inaccuracy using the more intuitive absolute difference between a credence and the proposition's truth value, given that both scores seem to be just different ways of capturing how far a credence is from the truth?
reasoning: |-
  Okay, the user is asking about accuracy-first epistemology and why probabilism isn't justified with absolute difference instead of the Brier score. Let me start by recalling the basics. Accuracy-dominance arguments show that non-probabilistic credences are dominated by probabilistic ones. The Brier score, which is squared error, works for this, but absolute difference doesn't. Why?

  First, I need to explain why absolute difference doesn't produce the same domination result. The key point is that with absolute distance, some non-probabilistic credences aren't dominated by any probabilistic one. For example, take a credence of 0.5 in a tautology. Using absolute error, the inaccuracy for a proposition is |c(A) - truth_A|. For a tautology, truth is always 1, so |c(⊤) - 1|. If someone assigns 0.5 to ⊤, the inaccuracy is 0.5. Any other probabilistic credence would be 1, so |1 - 1| = 0, which is better. But wait, is there a probabilistic credence that dominates this? Actually, no, because probabilistic credences would assign 1 to ⊤, so inaccuracy 0, which is better. But maybe in more complex cases?

  Ah, right. Consider a credence function that's not a probability. Suppose two propositions, A and B, mutually exclusive. Assign c(A) = 0.3, c(B) = 0.3, c(A∨B) = 0.9. Sum of c(A) and c(B) is 0.6, which is less than c(A∨B), violating additivity. Now, in a world where A is true, B false. Truth values: A=1, B=0, A∨B=1. Absolute inaccuracy: |0.3-1| + |0.3-0| + |0.9-1| = 0.7 + 0.3 + 0.1 = 1.1. Compare to a probabilistic credence, say P(A)=1, P(B)=0, P(A∨B)=1. Inaccuracy: |1-1| + |0-0| + |1-1| = 0. Better, but in this world, yes. But domination requires being better in every possible world. What about a world where neither A nor B is true? Then truth values: A=0, B=0, A∨B=0. Non-prob credence: |0.3-0| + |0.3-0| + |0.9-0| = 0.3+0.3+0.9=1.5. Probabilistic credence that dominates? Suppose P(A)=0, P(B)=0, P(A∨B)=0. Inaccuracy: 0. But if in a world where A is true, this P would have |0-1| + |0-0| + |0-1| =1 +0 +1=2, which is worse than the non-prob's 1.1. So no single probabilistic credence dominates the non-prob one in all worlds. For each world, there's a prob credence that's better in that world, but not the same one across all worlds. That's why absolute difference doesn't work for the dominance argument.

  Now, the user's deeper need might be understanding why Brier score is chosen over absolute difference. They might think both measure distance to truth, so why the difference? The answer lies in the mathematical properties. Brier score is strictly proper, meaning credences that match the actual probabilities minimize expected inaccuracy. Absolute difference isn't proper; it's minimized by the median, not the mean. So probabilism is tied to expectations, hence Brier score fits better. 

  Also, the user might be conflating two concepts: measuring inaccuracy for individual propositions versus the whole credence function. Absolute error for each proposition doesn't aggregate in a way that ensures domination. The Brier score's convexity allows the domination result. 

