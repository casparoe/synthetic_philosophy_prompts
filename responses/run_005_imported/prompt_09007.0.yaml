  - **Original Effect:** Harm condition: high intentionality; help condition: low intentionality.
  - **Epistemic Side-Effect Effect:** Similar asymmetry in knowledge attributions (people are more likely to say the agent "knew" the side effect would occur in the harm condition than in the help condition).
  - **Cross-Cultural Replications:** The effect has been found in many cultures, but with some variations (e.g., the effect is weaker in some Eastern cultures, and sometimes reversed in certain contexts).
  - **Other Modifications:** The effect is modulated by the agent's attitudes (e.g., if the agent is happy about the side effect, intentionality judgments increase in both conditions) and by the nature of the norm (e.g., when the side effect is a violation of a conventional norm rather than a moral norm, the effect is weaker).

