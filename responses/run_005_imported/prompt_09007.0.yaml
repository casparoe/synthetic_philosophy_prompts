  We are going to rank the major explanations of the Knobe Effect (also known as the Side-Effect Effect) based on how well they explain the full pattern of results, including the original CEO vignette, the epistemic side-effect effect, cross-cultural replications, and other related findings.

  The explanations to be ranked (as per the user's request and adding a few more that are prominent):

  1. **Knobe's Original Account (Normative View):** The asymmetry in intentionality judgments arises because the folk concept of intentional action is inherently normative. Harmful side effects are judged as intentional because they are seen as bad, and this badness is part of the concept.

  2. **Pragmatics/Conversational Implicature Account:** The effect is due to conversational pragmatics. Saying an agent "intentionally" caused a side effect in the harm condition implicates that the agent is blameworthy, whereas in the help condition, saying "intentionally" would implicate praise, but people are less likely to attribute praise. Thus, the asymmetry is due to the pragmatics of the situation and not the concept of intentionality itself.

  3. **Machery's Trade-Off Hypothesis:** The effect is due to a trade-off between two competing cognitive processes: one that attributes intentionality based on the agent's mental states and another that attributes intentionality based on the outcome's valence. In the harm condition, the negative outcome overrides the mental state criteria, leading to higher intentionality judgments.

  4. **Sripada's Deep Self Concordance Model:** Intentionality judgments depend on whether the side effect aligns with the agent's deep-seated values and character (the "deep self"). Harmful side effects are judged intentional when they align with the agent's deep self (e.g., callousness), but helping side effects are not judged intentional because they don't align (or conflict) with the agent's deep self.

  5. **Motivated-Bias Accounts (e.g., Alicke's Culpable Control Model, Nadelhoffer):** The effect arises from a motivation to blame the agent for harmful outcomes. This motivation biases the interpretation of the agent's mental states, making the harmful side effect seem more intentional. There is no symmetrical motivation to praise for good outcomes.

  6. **Uttich & Lombrozo's Norm-Based Theory-of-Mind Account:** The effect occurs because norms (both descriptive and prescriptive) guide our mental state attributions. When an outcome violates a norm (like harming the environment), we are more likely to attribute the necessary mental states (like belief and desire) for intentional action, leading to higher intentionality judgments.

  7. **Holton's Skill Model:** Intentionality requires skill, and in the harm case, the agent is seen as having the skill to bring about the harm (even if it's a side effect), while in the help case, the agent is not seen as having the skill to bring about the help (because it's a side effect and not the goal). (Note: This one is less prominent but sometimes discussed.)

  8. **Cushman's Dual-Process Model:** The effect is explained by two processes: one that evaluates the causal role of the agent's mental states and another that evaluates the moral status of the outcome. The moral evaluation process influences the intentionality judgment in the harm condition.

