  Their step 4 claims the parliamentary model substitutes one problem (intertheoretic comparison) with three new ones: cardinalizing theories, picking a bargaining solution, and setting a disagreement point. This feels solid. Defenders might argue that bargaining contexts provide natural anchors (e.g., status quo as disagreement point), but as the user hints, that's often arbitrary in moral contexts—why default to inaction? 

  The user's analogy to interpersonal utility comparisons is sharp. They're right that similar normalization debates plague welfare economics, but moral theories lack even the thin realism of human preferences. A defender might counter that delegation mirrors actual moral reasoning, but the user could retort that this is descriptive, not normative—we want what's right, not what feels intuitive. 

  I wonder if the user is underplaying one defense: perhaps bargaining reduces arbitrariness by constraining choices through procedural fairness. But as they note with the Greaves/Cotton-Barratt paper, outcomes still depend heavily on modeling choices. Their "same arbitrariness in costume" jab seems justified. 

  The user's request for blocking moves is astute. The main escape hatch would be to insist cardinalization is easier within theories than across them—e.g., Kantians can compare acts ordinally but not cardinally? But the user's lottery question (what's deontology's utility function?) exposes this weakness. If a theory lacks cardinal content, forcing it feels as ad hoc as normalization. 

  Overall, their argument holds. The parliamentary model's elegance is superficial; it doesn't avoid hard choices but disguises them. Their post could strengthen by addressing a potential counter: that bargaining dynamically aggregates preferences better than static normalization. But as-is, their critique is lethal to the model's promise of sidestepping comparability.
answer: |-
  Your argument is razor-sharp and exposes a fundamental flaw in how the parliamentary model is often presented. Here's a breakdown addressing your points and questions:

  ### 1. Your Core Argument is Sound
  You've correctly identified that the parliamentary model **doesn't eliminate arbitrariness; it relocates it**. The problems of cardinalization, normalization, and solution concept selection in the bargaining phase are isomorphic to the problems of intertheoretic comparison in MEC. Your "game-theoretic costume" analogy is apt. The model trades one set of difficult normative choices (how to scale utilities across theories) for another set (how to cardinalize *within* theories, define a disagreement point, and select a bargaining solution).

  ### 2. Nash Bargaining Requirements: You're Mostly Correct
  Your understanding is solid. The asymmetric Nash Bargaining Solution (NBS) requires:
      *   **Cardinal Utility Functions:** Each delegate needs a vNM utility function representing their theory's intensity of preference over outcomes/lotteries. This is non-trivial for non-consequentialist theories (e.g., Kantian "wrongness" isn't naturally cardinal).
      *   **Feasible Set:** The set of possible utility payoffs achievable by the delegates' collective action.
      *   **Disagreement Point (d):** The utility payoff each delegate gets if *no agreement is reached*. **This is critical and highly problematic.** Common choices are:
          *   *Status Quo:* Arbitrary and morally inert.
          *   *Maximin:* Risk-averse, but potentially perverse.
          *   *Random Dictatorship:* Reintroduces the problem of intertheoretic comparison to define the lottery!
          *   *Threat Points:* Morally repugnant in this context (delegates threatening each other?).
      *   **Bargaining Weights:** Often set proportional to credence (asymmetric NBS). But weights *and* the choice of `d` interact significantly.
      *   **Solution Concept:** Nash is common (maximizes the product of *weighted* gains over `d`), but Kalai-Smorodinsky (maximin proportional gains) or others are possible, yielding different results. The choice lacks a compelling justification within the moral uncertainty framework.

  ### 3. Defenders' Moves & Why They Don't Fully Block Step 4
      *   **"Natural Cardinalization":** Defenders might argue cardinalization is easier *within* a theory than *across* theories. E.g., "Even deontology can rank *choices* under uncertainty, giving cardinal structure." **Rebuttal:** This is highly contentious. What is the vNM utility function for "not violating a categorical imperative"? Theories like threshold deontology or those with lexical priorities resist smooth cardinalization. *This is just relocating the normalization problem inside each theory.*
      *   **"Disagreement Point is Obvious":** Claiming `d` should be the status quo or some "default" action. **Rebuttal:** Why is the status quo morally privileged? What is the "default" in novel dilemmas? This injects a significant, unjustified arbitrariness. Maximin or random dictatorship have their own severe drawbacks.
      *   **"Bargaining Process is the Point":** Arguing the *procedure* (delegates bargaining) is inherently fairer or more robust than direct aggregation. **Rebuttal:** This is descriptive/pragmatic, not normative. It doesn't answer *why* this specific procedure (with its specific cardinalization, `d`, and solution concept) is the *morally correct* way to handle uncertainty. The output still depends critically on these modeling choices.
      *   **"It Matches Reflective Equilibrium":** Suggesting outcomes feel intuitively better. **Rebuttal:** This is subjective and post-hoc. As your 51%/49% catastrophe example shows, it can produce wildly counterintuitive results without cardinal intensity, and *with* cardinality, the results depend entirely on the arbitrary modeling choices.

  ### 4. The Interpersonal Utility Comparison (IUC) Parallel - It Doesn't Rescue the Model
      *   **Similarity:** You're right. IUC faces the *exact same* normalization problem: how to compare utility *units* across different people. Standard solutions (variance normalization, zero-one normalization, etc.) are arbitrary conventions. Bargaining solutions (like Nash social welfare) are *another* convention used in IUC.
      *   **Key Difference & Why It's Fatal to the Rescue Attempt:**
          *   **IUC Context:** We accept these conventions because we (often pragmatically) need *some* way to make social decisions, and we have a shared understanding of human welfare/psychology as a rough common ground. The arbitrariness is (sometimes reluctantly) accepted as unavoidable for practical aggregation.
          *   **Moral Uncertainty Context:** The whole *point* of developing theories of moral uncertainty is to find a *principled* way to act under normative disagreement. Resorting to an arbitrary convention (like Nash bargaining with an arbitrary `d`) **defeats the purpose**. If we accept that arbitrariness is inevitable, we could just as well pick a normalization scheme for MEC and be done with it. The parliamentary model, by relying on an IUC-like bargaining convention, doesn't provide a *deeper justification*; it just uses a *different type* of convention. It doesn't solve the meta-normative problem it set out to address.
      *   **Conclusion on IUC:** The parallel highlights the problem, it doesn't solve it. Shrugging off indeterminacy in IUC might be pragmatic for social policy *given real-world constraints*. Shrugging it off in moral uncertainty theory undermines the search for a normative foundation for action under uncertainty. The parliamentary model inherits IUC's arbitrariness without offering a compelling reason why *its specific form of arbitrariness* is the morally correct one.

  ### Strengths of Your Argument & Suggestions for the Post
  1.  **Clarity:** Your 4-step breakdown is excellent. The "catastrophe" example perfectly illustrates the necessity of cardinal intensity and thus the model's dependence on cardinalization.
  2.  **Key Insight:** Hammer home that bargaining requires *three* arbitrary choices (cardinalization per theory, `d`, solution concept) instead of MEC's *one* (intertheoretic normalization). This increases, not decreases, the "moving parts."
  3.  **Address the "Procedural" Defense:** Explicitly argue that while the bargaining *metaphor* might be intuitively appealing, the specific *formal implementation* required lacks a unique, justified specification and reintroduces arbitrariness at multiple points. Elegance ≠ Justification.
  4.  **Emphasize the Disagreement Point (`d`):** This is often the weakest link. Explore the options and their flaws in detail. Why should the fate of the 49% who see A as a catastrophe hinge on whether `d` is defined as the status quo, B, or a random action?
  5.  **Contrast with MEC+Normalization:** Be explicit: *Both* approaches face arbitrariness. The parliamentary model's purported advantage ("no intertheoretic comparison!") is illusory because it requires equally difficult choices that *effectively perform comparison* through the bargaining weights and solution concept. The question becomes: *Which set of arbitrary choices is less bad or more justifiable?* Argue that MEC+normalization is at least more transparent and potentially more parsimonious.
  6.  **Reference Effectively:** Cite the Greaves & Cotton-Barratt paper prominently – it directly shows the model's output depends heavily on the chosen bargaining parameters. Contrast this with MacAskill's variance normalization on the same cases to demonstrate the non-coincidence you mention.

  **In conclusion:** Your argument is robust and well-targeted. The parliamentary model, when formalized to handle the obvious need for cardinal intensity (step 3), does indeed relocate the fundamental problem of arbitrariness inherent in moral uncertainty, rather than solving it. The choices involved in cardinalizing theories, setting the disagreement point, and selecting a bargaining solution are just as normatively fraught as choosing an intertheoretic normalization scheme for MEC. The IUC parallel reinforces this point rather than providing an escape hatch. Your post has the potential to be a significant contribution to clarifying the limitations of this popular model.
