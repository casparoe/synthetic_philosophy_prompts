answer: |-
  That's a *fantastic* theological knot for your character to be tangled in, and Augustine's reasoning here is notoriously rigorous and demanding. You've hit the core tension perfectly. Let's break down Augustine's logic step-by-step to see why he condemns even lies that seem helpful (types 6 & 7):

  1.  **The Intrinsic Evil of Lying:** For Augustine, lying is fundamentally **not** defined by its consequences. It's intrinsically evil because it violates the very nature and purpose of human communication. God gave us speech to express truth. To deliberately use speech to convey what we know to be false is a perversion of this divine gift, a direct offense against God and the order of creation. It damages the soul of the liar, corrupts the social bond of trust, and dishonors God.

  2.  **Consequences Don't Justify the Act:** While Augustine ranks lies based on their *motivation* and *potential harm*, the ranking doesn't mean the "less bad" lies become morally permissible. Even if a lie *appears* to have good consequences (helping someone, preventing harm), the act itself remains sinful. The end **does not** justify the means when the means is intrinsically evil.

  3.  **The "Brave and Faithful" Rejection (Key Phrase):** This is crucial. When Augustine says types 6 and 7 "should be eschewed by brave and faithful and truthful men and women," he's advocating for **heroic virtue**. He's saying:
      *   The truly virtuous person will **refuse** to commit the intrinsic evil (the lie), even if it means allowing a bad consequence to happen.
      *   They will **accept the negative consequence** (the money being stolen, the fugitive being captured) **honorably and bravely** as the cost of maintaining truthfulness and fidelity to God.
      *   This "taking the consequences" is the mark of true courage and faithfulness, superior to the cowardice of choosing the lie to avoid the unpleasant outcome.

  4.  **Why Reject Specifically #6 & #7?**
      *   **#6 (Protecting Money):** Lying to protect someone's money from theft avoids a material loss, but Augustine sees the lie itself as a greater spiritual loss. The brave person would endure the theft rather than sin.
      *   **#7 (Protecting a Fugitive - Even a Guilty One):** This is the most relevant to your custody battle scenario. Augustine explicitly mentions lying to a judge. His reasoning is profound:
          *   **Against Betrayal:** He rejects the role of informant when it leads to death, based on Christian charity.
          *   **Hope for Amendment/Repentance:** Protecting even a guilty fugitive allows for the possibility of their repentance and reform – a core Christian value. Killing them removes that chance.
          *   **BUT - Still Cannot Lie:** However, **this charitable motive does not justify lying.** The virtuous path is to **refuse to answer** or to **tell the truth and plead for mercy/repentance**, accepting the potential consequence (the fugitive's death) rather than committing the sin of lying. The lie itself, even for this noble motive, is still a violation of truth.

  **What Your Lawyer Character Would Sincerely Believe:**

  Your lapsed-Catholic lawyer would **absolutely believe Augustine is saying that even "harmless" helpful lies (#6 & #7) are genuine sins.** He would believe Augustine is advocating for the **strictest possible standard**: a truly virtuous person **must** allow the bad thing to happen rather than tell *any* deliberate falsehood.

  *   **His Interpretation:** "Augustine says you *never* lie. Not to a judge. Not to protect your own father. Even if it seems like it helps and hurts no one, it's still a sin against truth itself. The 'brave' thing is to tell the truth and take the hit, whatever it is. Lying, even for a good cause, corrupts you."
  *   **Why it fits his character:**
      *   **Lapsed, Not Amnesiac:** He might reject Church authority now, but Augustine's *logic* about the intrinsic evil of lying could still resonate deeply, especially combined with his legal training emphasizing truth (at least theoretically) in the adversarial system.
      *   **Defense Lawyer's Integrity:** He might see this as the bedrock of his professional identity – he *argues* the truth as he sees it within the rules, he doesn't fabricate it. Lying for his dad would violate that core principle.
      *   **Intellectual Rigor:** Augustine's argument is intellectually formidable. Your lawyer might respect its internal consistency and uncompromising nature, even if he finds it personally difficult.
      *   **Justification for Distance:** Quoting Augustine might be a way to armor himself against family pressure and guilt. It elevates his refusal from personal weakness to a principled (if severe) moral stance.
      *   **Conflict with Sister:** The sister likely represents the pragmatic, consequence-based view ("Lying here hurts no one and helps Dad!"). His Augustine quote is the direct rebuttal: "The act itself is the sin, regardless of the outcome. We must endure the consequence bravely, not sin to avoid it."

  **Avoiding Contradiction Mid-Scene:**

  He won't be contradicting himself *if* you frame his position clearly as Augustine's intrinsic evil argument:

  1.  **Establish the Principle Early:** Have him articulate the core idea *before* the specifics of the dad's case arise. "Sis, you know where I stand. Augustine was clear: a lie is a lie. It corrupts the soul. You don't trade truth for convenience, ever. Not even for family."
  2.  **Focus on the Act, Not the Consequence:** When pressed about helping Dad, his argument shouldn't be "Lying won't help" (it might!) or "Lying will hurt someone" (it might not!). It must be: **"Lying *is* the wrong. Full stop. Even if it 'works,' it's still a sin. We tell the truth and deal with the fallout. That's what integrity demands."**
  3.  **Invoke the "Brave" Endurance:** He should explicitly reference Augustine's concept: "Augustine said the brave thing is to *take* the consequence, not sin to avoid it. If telling the truth hurts Dad's case, that's what we have to bear. Lying is the coward's way out."
  4.  **Acknowledge the Difficulty:** He can (and should) show the emotional cost. "Do you think this is easy? Knowing the truth might screw him? But I *can't* lie. Not just legally, but... down to the bone. Augustine got that right. Some lines you don't cross, even for blood."

  **In short:** Augustine absolutely says types 6 and 7 are genuine sins that a virtuous person must avoid, accepting the negative consequences as the price of truthfulness. Your lawyer character, clinging to this rigorous (if lapsed) principle, would believe that lying to protect his dad, however seemingly harmless or helpful, would be a fundamental moral failure. His conflict with his sister stems from her prioritizing consequences over the intrinsic nature of the act. This makes for a powerful, theologically grounded character motivation. Good luck with the scene – it sounds compelling!
