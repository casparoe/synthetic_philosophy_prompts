  Why does Augustine say that? His core argument is that lying is intrinsically evil because it violates the nature of speech, which is meant for truth. Even if the consequences seem good, the act itself corrupts the soul and damages one's relationship with God. So, for Augustine, it's not about outcomes but the inherent sinfulness of lying. 

  The user’s character is a lapsed Catholic, so he might still hold Augustine's intrinsic view, even if he's not practicing. The lawyer’s refusal to lie isn't about the outcome but about the act itself being wrong. That explains why he won't lie for his dad, even in a tough situation. The sister might see lying as harmless, but the brother sees it as a violation of his integrity.

  The user needs to avoid making the character seem inconsistent. If the lawyer cites Augustine, he must genuinely believe that any lie, even a "helpful" one, is a sin. The conflict with his sister comes from her pragmatic view versus his principled stance. Highlighting this difference adds depth to their argument.

  Also, Augustine mentions that enduring consequences honorably (like letting the bad thing happen) is braver than lying. The lawyer might see taking the hit as maintaining truthfulness. This aligns with his legal profession, where truth is paramount, even if he's lapsed religiously.

