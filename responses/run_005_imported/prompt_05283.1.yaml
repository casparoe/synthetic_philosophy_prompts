prompt: |-
  I volunteer with our county's urban search-and-rescue squad, and I'm on the committee rewriting the triage section of our field guide - the part covering what a team does when it can't physically reach everyone before a structure fails. Here's the case we can't agree on: after a collapse, two pockets of survivors turn up, equally reachable, equally stable, equally likely to die if we're not through in 20 minutes, and there's only time to cut through to one. Pocket A has 1 person, Pocket B has 5. Half the committee wants the rule to just be "always take the bigger number, end of story." The rest of us keep getting stuck on something I read once, that the numbers shouldn't automatically decide it, since 5 deaths aren't "5 times worse" than 1 death for any actual person - nobody loses all 5 lives, its just 5 seperate people each losing their own one life, same as whoever's stuck in Pocket A. Can you write us a short memo recommending what our default protocol should actually be, clear enough that a shift commander could use it under pressure, and that takes that objection seriously instead of just waving it away?
reasoning: |-
  Okay, the user is part of a search-and-rescue squad committee rewriting their triage field guide. They're stuck on a specific scenario: two pockets of survivors, one with 1 person and one with 5, both equally reachable and at risk. Half the committee wants a strict "save more lives" rule, while the other half is concerned about the ethical point that 5 deaths aren't "5 times worse" for any single person—each death is a separate loss of one life.

  I need to understand the core issue here. The ethical dilemma is between utilitarian principles (maximizing total lives saved) and the deontological view that each life has inherent value, making the loss of one just as tragic as the loss of many. The user mentioned an objection that saving five isn't "5 times worse" than losing one because no individual experiences multiple deaths. That's a valid point, but in emergency triage, the focus is often on aggregate outcomes.

  The user's role is critical—they're helping create protocols for high-stress situations. Shift commanders need clear, actionable guidance without ambiguity. The memo must address the ethical concern without overcomplicating the decision-making process. The real need here is a protocol that's both ethically sound and practically applicable under pressure.

  Considering the context: urban search-and-rescue operations involve time-critical decisions where structures could collapse. Any hesitation could lead to more deaths. The protocol must prioritize efficiency. The committee's debate shows they care deeply about ethical implications, which is commendable, but in practice, saving more lives aligns with the primary mission of rescue operations.

  I should also think about the consequences of each approach. If the protocol doesn't default to saving more lives, commanders might face paralysis or inconsistent decisions, potentially leading to higher total fatalities. The ethical objection is philosophically important but doesn't change the outcome: saving five versus one still results in one life lost versus five, which is a net gain of four lives. That's significant in resource-limited scenarios.

  The memo needs to be concise, authoritative, and empathetic. It should acknowledge the ethical concern to validate the committee's discussion but then clearly state why the practical approach is necessary. Emphasizing the mission's goal—maximizing lives saved—and the operational realities (time pressure, no perfect information) will help justify the "save more lives" rule. Using plain language like "one life saved is one life saved" can reinforce that each life matters equally, but when choosing, the greater number takes precedence.

  Also, including a brief rationale in the memo helps shift commanders understand the reasoning, making them more confident in applying the rule. Phrases like "no meaningful distinction" between lives and "aggregate outcome" can address the objection without getting bogged down. Ensuring the protocol is binary (no weighing factors) simplifies decision-making when seconds count.

  Finally, the memo should stand alone with a clear subject, headings, and actionable steps. Bullet points or numbered protocols work best for quick reference. Ending with contact information for further questions adds support without complicating the main message.
answer: |-
  **MEMORANDUM**  
  **TO:** Urban Search-and-Rescue Triage Committee  
  **FROM:** [Your Name/Team]  
  **SUBJECT:** Recommended Protocol for Triage Priority in Time-Critical, Resource-Limited Scenarios  
  **DATE:** [Current Date]  

  ---

  ### **Issue Summary**
  In scenarios where two survivor pockets are equally accessible, equally time-sensitive (e.g., 20-minute window), and equally stable—but only one can be reached—we must determine whether to prioritize **Pocket A (1 person)** or **Pocket B (5 people)**.  

  ### **Ethical Consideration Acknowledged**
  We recognize the objection: *"Saving five lives is not ‘five times morally better’ than saving one, because each person loses only one life. No individual experiences five deaths."* This reflects a foundational truth: **every life holds equal intrinsic value**. The loss of one person is a profound tragedy, and the loss of five is five profound tragedies—not a single multiplied catastrophe.  

  ### **Recommended Protocol**  
  **Default Rule:**  
  > **Prioritize the pocket with the greatest number of lives immediately at risk.**  

  **Operational Directive for Shift Commanders:**  
  > **"When all other factors are equal, save the group that preserves the most lives."**  

  ---

  ### **Rationale for This Protocol**  
  1. **Practical Impartiality**:  
     - While each life is equally valuable, we face a forced choice: *someone will die*. The ethical imperative shifts to **minimizing total lives lost**. Choosing the larger group saves four additional lives compared to the alternative.  
     - **Key phrasing for commanders**: *"One life saved is one life saved—but when we can only save one group, saving five spares four families from loss instead of one."*  

  2. **Operational Realism Under Duress**:  
     - Commanders need unambiguous rules during structural-collapse emergencies. Introducing subjective "value of life" calculations risks hesitation, inconsistency, or moral distress.  
     - **Objection addressed**: We do not claim five lives are "worth more" than one. We act because **saving five achieves more with the same resources**.  

  3. **Mission Alignment**:  
     - USAR’s core purpose is *maximizing survivability*. This protocol aligns with global standards (e.g., SALT triage, WHO guidelines) and avoids paralyzing over-analysis when seconds count.  

  ---

  ### **How to Communicate This Under Pressure**  
  **Shift Commander Script:**  
  > *"Pocket A: 1 person. Pocket B: 5 people. Same stability, same time window, same resources needed. We go for B. Why? Because right now, our job is to save as many as we can with the time we’ve got. We don’t get to choose who lives—but we *can* choose how many."*  

  ---

  ### **When This Rule Does NOT Apply**  
  This default applies **only** when:  
  - Accessibility, time sensitivity, and structural stability are truly identical.  
  - No other factors differentiate the pockets (e.g., medical acuity, age, known skills).  
  If other variables exist (e.g., Pocket A contains a medic who could aid others), commanders may override—but *equality of conditions* is critical.  

  ---

  ### **Conclusion**  
  Respecting each life’s equal worth does not require ignoring arithmetic in split-second decisions. When forced to choose, preserving more lives honors our duty to the community we serve. This protocol balances ethical gravity with operational clarity, ensuring commanders act decisively to reduce total loss.  

  **Recommended Field Guide Language:**  
  > *"In scenarios with identical access, time sensitivity, and stability: Prioritize the pocket with the greatest number of lives at immediate risk."*  

  ---  
  **Approved by:** [Your Name/Committee Lead]  
  **Contact:** [Email/Phone for follow-up questions]
