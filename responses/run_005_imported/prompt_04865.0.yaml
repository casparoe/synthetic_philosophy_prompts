  So in my history of economic thought seminar we just spent a whole week on Berkeley's Querist instead of the usual esse est percipi stuff, which honestly surprised me bc I had no idea he cared about money at all. The discussion question for next class is: Berkeley argues money is basically just a ticket or counter for reckoning value, not something that has to be gold or silver to count as "real" wealth, but he also spends a big chunk of the Querist pushing for a national bank in Ireland to control the currency supply. So what would he make of something like bitcoin? His own logic about money not needing commodity backing seems like it should make him totally fine with it, but the entire point of bitcoin is that theres no central authority issuing or backing it, which kind of goes against everything he wanted institutionally. Can you actually walk through this tension using his real arguments (not just the surface-level "oh he thought reality was all in the mind so fake money checks out") and tell me where you think he'd actually land, and why?
