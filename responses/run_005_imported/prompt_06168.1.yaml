prompt: |-
  So, weird family situation, could use an outside take. My sister has bipolar disorder, and about six months ago, totally stable and thinking clearly, she sat down with her psychiatrist (and even a lawyer) and signed a document saying that if she ever refuses hospitalization during a manic episode, we should override her and get her admitted anyway, no matter how much she protests in the moment. She's manic right now, refusing to go, and is furious we're even discussing "that stupid paper" she signed. My mom thinks we have to respect what she's telling us right now, today, since its her life and her choice in the moment. I keep thinking we should honor what she signed when she was thinking clearly and literally anticipated this exact pushback from herself. Neither of us can really talk the other out of their position. Feels like the kind of dilemma that should have a name on some rationalist blog somewhere, but I can't place it. Who's actually right here, my mom or me?
