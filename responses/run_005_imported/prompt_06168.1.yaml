  Okay, let's start by unpacking this user's situation. They're dealing with a family crisis where their sister, who has bipolar disorder, is currently manic and refusing hospitalization. The key point is that she previously signed a document when stable, directing her family to hospitalize her against her will if she ever refuses during an episode. Now, the user and their mom are at odds: the user wants to follow the document, while the mom thinks they should respect the sister's current wishes.

  First, I need to recall the legal and ethical frameworks here. The document mentioned sounds like a Psychiatric Advance Directive (PAD). These are legally recognized in many places and allow individuals to outline their treatment preferences during future incapacitation. The sister created this during a stable period with professional help, which adds weight to its validity. Her current manic state likely impairs her judgment, meaning she isn't capable of making informed decisions now. That's a crucial point because respecting her current refusal could be harmful.

  The mom's perspective comes from a place of respecting autonomy, but it's misplaced in this context. Autonomy isn't just about the immediate choice; it's about honoring the person's prior, competent decisions. This is similar to how advance directives work in other medical scenarios. The user's stance aligns with that principle. 

  I should also consider the practical risks. Mania can lead to dangerous behaviors, and delaying treatment often worsens outcomes. The sister anticipated this exact scenario, showing foresight. Ignoring her directive now could undermine her own carefully made plans. The family might face guilt if things go wrong, but following the PAD is legally and ethically sound.

  The user mentioned a "weird family situation," indicating possible emotional strain. They need reassurance that their approach is correct, not just legally but morally. Emphasizing the sister's clear intent when stable might help the mom understand. Highlighting the professional involvement (psychiatrist, lawyer) in creating the PAD could strengthen the argument. 

  The user also hinted at seeking a named dilemma. Ulysses Contracts come to mind—binding future actions during compromised states. Explaining this concept might provide clarity. Ultimately, the advice should stress urgency: acting on the directive is the safest and most respectful choice for the sister's long-term well-being.
answer: |-
  This is an incredibly difficult and emotionally charged situation, but based on established medical ethics, legal principles, and standard psychiatric practice, **you are right.** Your sister's documented wishes, made when she was stable and competent, should be honored over her current, impaired refusal.

  Here's why:

  1.  **The Document is a Psychiatric Advance Directive (PAD):** What your sister signed is known as a Psychiatric Advance Directive (or a similar instrument like a Ulysses Contract, though PAD is the more common legal term). These are legally recognized in many jurisdictions and are designed *specifically* for situations like this.
  2.  **Competence at the Time of Signing:** The key fact is that she signed it while "totally stable and thinking clearly," with the support of her psychiatrist and a lawyer. This demonstrates she was competent to make decisions about her future care. She understood her illness, the consequences of mania, and the potential need for intervention.
  3.  **Lack of Competence During Mania:** Mania, by its nature, impairs judgment, insight, and the ability to rationally weigh risks and benefits. Your sister's current fury, dismissal of the document as "stupid," and refusal of necessary care are classic symptoms *of the very impairment she anticipated and sought to protect herself against*. Her current refusal is not a truly autonomous choice made with full understanding; it's a symptom of her illness.
  4.  **Anticipating the Exact Situation:** She explicitly foresaw this scenario – refusing hospitalization during mania – and gave clear instructions on what to do. Honoring her directive *is* respecting her autonomy, just her *past, competent* autonomy. Disregarding it based on her *current, impaired* state undermines the very self-determination she exercised when she was well.
  5.  **The Purpose is Protection:** The entire point of the PAD is to protect her from the consequences of her own impaired judgment during an episode. Hospitalization during mania isn't punishment; it's life-saving, crisis-stabilizing medical care aimed at preventing harm to herself or others, financial ruin, relationship destruction, or legal consequences – things she likely feared when she was well.
  6.  **Medical and Legal Weight:** Her psychiatrist was involved in creating it. This gives it significant medical weight, as the professional treating her affirmed she understood it when stable. The lawyer ensured its legality. This isn't a casual note; it's a formal expression of her healthcare wishes.

  **Addressing Your Mom's Perspective:**

  *   **"Her life, her choice in the moment":** This principle (autonomy) is crucial, but it applies to *competent* individuals. Your sister, right now, is not competent to make this specific medical decision due to her mania. Respecting autonomy means respecting the choices she made *when she was competent*, especially when she knew her competence would lapse.
  *   **"Respect what she's telling us right now":** While her feelings are real and her distress is valid, acting solely on her current demands would be prioritizing a symptom of her illness over her own carefully considered plan for wellness. It would ignore the wisdom of her stable self.

  **The Rationalist Concept: Ulysses Contract**

  You're spot on about the named dilemma! This is a classic example of a **Ulysses Contract**. In Greek mythology, Ulysses had his crew tie him to the mast and ignore his later commands so he could hear the Sirens' song without wrecking his ship. Similarly, your sister bound her "future self" (during mania) to the decision of her "past competent self" to prevent her from making destructive choices while impaired. The ethical principle is about honoring binding commitments made rationally to prevent harm during anticipated future irrationality.

  **What to Do Now:**

  1.  **Act Immediately:** Mania can escalate quickly. Delaying treatment often makes the episode harder and longer to treat.
  2.  **Invoke the Directive:** Present the PAD document to the crisis team, hospital intake, or emergency services. Explain she is manic, lacks insight, is refusing care, but has this valid directive instructing you to override her refusal in this exact scenario. **Have the physical document ready.**
  3.  **Contact the Psychiatrist:** If possible, alert her psychiatrist's office immediately. They know her history, likely helped create the PAD, and can provide crucial support and guidance to the hospital or crisis team.
  4.  **Frame it as Care, Not Punishment:** When talking to your sister (though reasoning may be futile right now), emphasize this is what *she* wanted when she was well to keep herself safe and get better. "We are following *your* plan because we love you and you knew this might be necessary."
  5.  **Support Your Mom:** This is incredibly hard for her. Acknowledge her love and desire to respect her daughter's wishes *now*. Explain gently but firmly that respecting her *true* wishes means following the plan *she* made when she *could* think clearly. Remind her that enabling refusal during mania often leads to far worse outcomes and greater suffering.

  **Conclusion:**

  Honoring the Psychiatric Advance Directive is the most ethical, legally sound, and ultimately loving course of action. It respects your sister's autonomy as expressed when she was capable of exercising it and fulfills her own request for protection during her illness. While heartbreaking to see her furious and resistant, forcing hospitalization based on her directive is acting *for* her long-term well-being, as defined *by her own competent self*. You are right to advocate for following it. Please act quickly to get her the care she needs and deserves.
