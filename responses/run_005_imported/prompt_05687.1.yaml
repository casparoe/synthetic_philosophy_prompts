  Ultimately, I think the most honest answer is that Lewis's project fails to reconcile penal substitution with retributivism. The debt analogy either proves too much (allowing whipping boys) or too little (not actually modeling retributive punishment). The theological doctrine might require accepting either consequentialism or mystery. 

