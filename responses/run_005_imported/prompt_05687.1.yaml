  But wait... maybe there's a third path? What if we distinguish between the offender's relational standing and the punitive act itself? In Christian theology, Christ's sacrifice restores the sinner's relationship with God - something no ordinary punishment does. This could make substitution a unique relational repair rather than a punitive transfer. 

