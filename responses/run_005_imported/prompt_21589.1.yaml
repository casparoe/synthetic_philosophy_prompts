prompt: |-
  Me and my flatmate had a two hour argument last night about the 'equality of what' debate - she kept bringing up the wheelchair/disability case to say resourcism obviously fails, and I kept coming back with Dworkin's hypothetical insurance market, and neither of us actually won. Anyway I'm interviewing a philosopher next week who defends the capability approach for my podcast, and I dont want it to just be her reciting Sen 101 at me. Can you draft six or seven questions that push past that? I want at least one on whether Sen's refusal to ever fix a canonical list of capabilities (unlike Nussbaum) is a principled feature of the view or just a way of dodging - and what it would actually take for 'public reasoning' to settle a hard case rather than paper over it; one on how she tells a genuinely adapted, deprived preference apart from someone who just values different things, without quietly importing an external welfare standard to make that call; and one on how the approach aggregates across a bunch of non-comparable capabilities for policy purposes instead of collapsing back into a single index, which was sort of the whole point of leaving primary goods behind in the first place. For each one, throw in a sharp follow-up for whatever answer she's likely to give.
reasoning: |-
  Okay, the user had a heated debate with their flatmate about the "equality of what" debate, specifically around disability and resourcism vs. capability approach. Now they're interviewing a philosopher who defends the capability approach for their podcast and want questions that go beyond basic Sen. 

  Hmm, they're clearly frustrated with surface-level discussions - the flatmate argument seems to have touched a nerve about how these theories handle real-world complexity. The user mentions three specific pain points: Sen's refusal to define capabilities, distinguishing adapted preferences, and aggregation problems. Smart focus areas - these are exactly where capability theory gets messy.

  Noticing they use "she" for the philosopher - probably Nussbaum or someone adjacent given the list fixation mention. But they want to push past textbook answers... let me dig into each of their requested angles:

  First, the unfixed list issue. Sen's "public reasoning" dodge is famous - but what happens when communities disagree fundamentally? Like if a society "reasons" that women don't need bodily autonomy? Need a follow-up that forces the interviewee to admit either cultural relativism or hidden universalism. 

  Second, adapted preferences. Classic example is women in patriarchies saying they're content. But capability theorists hate paternalism... yet claiming to "detect" false consciousness smuggles in external standards. The follow-up should corner them on this tension.

  Third, aggregation. Sen criticizes primary goods for being monistic, but then how do you compare health vs. education vs. leisure? If they say "democratic deliberation," that's just kicking the can. Need to press on technical methods - does capability actually avoid collapsing into another single metric?

  User's clearly done their homework - name-dropping Dworkin's insurance model shows they know the resourcist counterarguments. Good sign they'll recognize evasive answers. Should design questions that prevent the philosopher from retreating to Sen's vaguer slogans. 

  Also picking up competitive energy - they "didn't win" the flatmate debate. Probably wants to land punches they couldn't last night. Questions should have forensic follow-ups that anticipate dodges. Example: if the philosopher says "we detect adapted preferences through dialogue," follow-up should ask who controls that dialogue and with what biases.

  ...Wait, user mentioned podcast audience. Should ensure questions are accessible but still cutting. No jargon like "commensurability" without explanation. Maybe use concrete examples - wheelchair ramps vs. pain medication budgets, or a contented housewife case.

  Biggest risk is philosopher stonewalling with "that's context-dependent." Need follow-ups that force stakes: "If public reasoning endorses FGM, is that capability-enhancing?" or "Without aggregation, how do you allocate health vs. climate funding?" 

  User would probably enjoy seeing the philosopher squirm a bit. But keep it professional - the goal is insight, not gotcha. Structure each Q with: 1) Concrete case 2) Theoretical challenge 3) "How specifically..." demand.
answer: |-
  Here are 6 targeted questions (plus sharp follow-ups) designed to push beyond Sen 101, addressing your core concerns and forcing engagement with the deeper tensions in the capability approach:

  **1. The Unfixed List & The Limits of Public Reasoning**
  *   **Question:** Sen famously resists defining a fixed, universal list of core capabilities, arguing for democratic "public reasoning" instead. But in deeply divided or illiberal societies, how can this process avoid entrenching existing power imbalances or endorsing capabilities that actively undermine fundamental freedoms (e.g., a "capability for patriarchal control" emerging from a process dominated by traditionalists)? What specific procedural safeguards or minimal universal constraints *must* exist for public reasoning to be legitimate, not just a veneer for domination?
      *   **Likely Answer/Evasion:** "Public reasoning is iterative and requires free participation..." or "Focus on enhancing basic capabilities for reasoning itself..."
      *   **Sharp Follow-Up:** Doesn't prioritizing the 'capability for reasoned agency' *itself* presuppose a substantive, non-negotiable value – effectively smuggling in a foundational element of a list Sen refuses to define? And concretely, when public reasoning in Community X *persistently* rejects a capability deemed essential elsewhere (say, bodily integrity for women), at what point does the capability approach declare that reasoning *failed*, and on what grounds without a fixed standard?

  **2. Detecting Adapted Preferences: The Epistemic Black Box**
  *   **Question:** The capability approach rightly highlights the problem of "adapted preferences" (e.g., the disabled person not desiring ramps due to resignation). But *how*, *operationally*, do we distinguish between a genuinely adapted preference (indicating capability deprivation) and a simple difference in values or life priorities (e.g., someone choosing a contemplative life with fewer material resources)? Doesn't the judgment that a preference is "adapted" *necessarily* rely on an implicit, external conception of welfare or flourishing that the approach claims to avoid?
      *   **Likely Answer/Evasion:** "We look at objective opportunities..." or "Dialogue and exposure to alternatives reveal deprivation..."
      *   **Sharp Follow-Up:** Doesn't judging which "opportunities" are objectively relevant *already* import a value judgment? And if dialogue reveals someone *still* rejects a capability after exposure (e.g., someone aware of cosmopolitan lifestyles still deeply values a traditional, materially simpler community life), isn't the capability theorist forced to either: a) paternalistically insist their preference is *still* adapted (based on *your* view of what matters), or b) abandon the claim that their capability set is deficient? Doesn't this risk imposing a specific conception of the good?

  **3. Aggregation Without Collapse: Beyond the Single Index**
  *   **Question:** A key critique of Rawlsian primary goods is their monism; capability offers plural valuable 'beings and doings'. But for practical policy (allocating budgets, prioritizing interventions), how do we *aggregate* gains and losses across distinct, often incommensurable capabilities (e.g., improving health access vs. expanding educational opportunities vs. enhancing political participation) without collapsing them back into a single metric like GDP or utility, which Sen rejected? What *specific* decision procedure does the capability approach offer beyond stating that trade-offs are "complex" and require "democratic deliberation"?
      *   **Likely Answer/Evasion:** "We need participatory processes to weigh trade-offs..." or "Focus on thresholds of basic capabilities first..."
      *   **Sharp Follow-Up:** Doesn't "focusing on thresholds" simply postpone the aggregation problem to the next level? Once basic thresholds are (hypothetically) met, how do we decide between funding advanced cancer treatments vs. universal preschool? And if the answer is *always* "democratic deliberation," how is this fundamentally different from a utilitarian cost-benefit analysis *informed* by capability metrics, effectively reducing capabilities to inputs for a utility function? Where is the *distinct* capability-based aggregation mechanism?

  **4. Positive Freedom vs. State Paternalism: The Slippery Slope**
  *   **Question:** The capability approach emphasizes "positive freedom" – the real power to achieve valuable states. However, providing the *means* to a capability (e.g., education) often involves significant state intervention. How do you rigorously guard against this justified intervention sliding into unjustified paternalism, where the state defines not just the *capability* (e.g., "being educated") but also dictates *which specific functionings* are valuable (e.g., *what* you must learn or *how* you must use that education)?
      *   **Likely Answer/Evasion:** "The focus is on expanding opportunities, not dictating choices..." or "Capability protects the freedom to choose functionings..."
      *   **Sharp Follow-Up:** But doesn't the selection of *which capabilities* to support and resource (e.g., funding STEM over arts, or prioritizing health capabilities that increase productivity) *already* represent a state judgment about valuable lives, inevitably influencing and constraining the range of functionings people can *reasonably* choose? How is this substantively different from soft paternalism?

  **5. The Currency Problem & Dworkin's Challenge**
  *   **Question:** Dworkin argued his hypothetical insurance market (under equality of resources) can handle disability by simulating what resources people would insure *against* becoming disabled. Capability theorists counter that resources alone aren't sufficient. But doesn't the capability approach face a parallel challenge: *Equality of what capability?* How do we determine the *fair share* of capability-enhancing resources an individual is entitled to, especially when converting resources to capabilities varies wildly (e.g., the wheelchair user needing more resources for mobility)? Isn't Sen's aversion to fixing a list or an aggregation metric a barrier to defining this fair share?
      *   **Likely Answer/Evasion:** "The focus is on achieving capability equality, not resource equality..." or "It requires sensitivity to individual conversion factors..."
      *   **Sharp Follow-Up:** Precisely *because* conversion factors vary, doesn't achieving equal capability sets require massively unequal resource transfers? Without a defined list, threshold, or aggregation method, how do we determine *how much* extra resource transfer is *enough* for the wheelchair user to achieve a comparable level of capability freedom as an able-bodied person? Doesn't this risk either bottomless demands or arbitrary cut-offs?

  **6. Global Justice & The Feasibility Constraint**
  *   **Question:** The capability approach is often framed as a universal theory of justice. However, securing even basic capabilities globally (e.g., freedom from severe malnutrition, basic healthcare) requires massive, currently non-existent resource transfers. Does this imply that the capability approach, in practice, must accept a significant "feasibility constraint," potentially relegating global capability equality to a distant ideal? Or does it demand radical, immediate restructuring of global institutions, even if politically impossible now? How does it navigate this tension?
      *   **Likely Answer/Evasion:** "We must strive for progressive realization..." or "Global institutional reform is essential..."
      *   **Sharp Follow-Up:** Doesn't "progressive realization" risk becoming an excuse for perpetual injustice, especially when powerful nations resist redistribution? And if radical restructuring *is* demanded by the theory, but recognized as infeasible, doesn't this highlight a potential disconnect between the capability approach's moral ambition and its practical applicability as a guide to *actionable* justice in a non-ideal world? Is it more of a moral compass than a policy framework?

  **Key Principles Used:**
  *   **Concreteness:** Forcing application to hard cases (disabled person, contented housewife, budget trade-offs).
  *   **Internal Tension Exposure:** Highlighting contradictions (e.g., rejecting lists but needing standards, rejecting monism but needing aggregation, avoiding paternalism but requiring intervention).
  *   **"How Specifically?" Demand:** Pushing beyond vague appeals to "reasoning" or "process" to ask for operational mechanisms.
  *   **Counter-Paradigm Engagement:** Explicitly referencing the rivals (Rawls, Dworkin) to force a comparative defense.
  *   **Follow-Up Anticipation:** Designed to cut off standard evasion routes and force deeper engagement.

  These questions should push your interviewee beyond recitation into defending the approach's coherence, practicality, and ability to handle its own toughest criticisms. Good luck with the interview!
