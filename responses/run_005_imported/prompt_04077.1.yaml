  First, I need to unpack Lewis's original theory: he claimed that what's true in a fiction is what holds in the closest possible worlds where the story is told as known fact. This relies on modal realism, where possible worlds are concrete realities. But when stories have contradictions—like Watson's wound being in both shoulder and leg—Lewis's "method of union" says both can be true in the fiction individually, but their conjunction isn't. That breaks classical logic (closure under conjunction).  

  The user wants an argument that this isn't just a "minor technical fix" but actually exposes a deeper flaw: that "truth in fiction" was never truly about "truth at a possible world" in Lewis's sense. I should build that case by showing how the patch conflicts with modal realism's core principles.  

