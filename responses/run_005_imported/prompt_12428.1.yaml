  The user mentioned their friend felt resentment toward an AI chatbot for being unhelpful. The key question is whether an AI, even a sophisticated one, can be a proper target for participant attitudes. According to Strawson, these attitudes depend on seeing the other as a member of the moral community, capable of mutual recognition and goodwill.

  Strawson's naturalism emphasizes that our practices are rooted in human social interactions. Even if determinism is true, we don't abandon participant attitudes because they're essential to human relationships. Conditions like insanity or immaturity exempt someone from being a moral agent, shifting us to an objective stance.

  Applying this to AI: no matter how fluent the responses, an AI lacks consciousness, intentions, and the capacity for reciprocal relationships. It simulates understanding but doesn't genuinely participate in the moral community. So, Strawson would likely argue that resentment towards AI is misplaced. It's like resenting a vending machine—useful to fix it, but not to hold it morally accountable.

