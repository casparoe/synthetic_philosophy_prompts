prompt: |-
  On several old Overcoming Bias and LessWrong threads about decision theory under unbounded gambles, I keep running into people gesturing at the "Pasadena paradox" as some sort of nastier cousin of the St. Petersburg paradox, without ever quite explaining why it's supposed to be worse. As I understand the two cases: in the classic St. Petersburg game, a fair coin is tossed until it first lands heads, and you're paid 2^n if the first heads occurs on toss n; the expected payoff is a divergent sum of positive terms, so it comes out unambiguously infinite, and there's a familiar toolkit for defusing the resulting puzzle — bounded utility functions, diminishing marginal utility of money, objections from the counterparty's necessarily finite wealth, and so on. Nover and Hájek's Pasadena game instead pays (-1)^(n+1) × 2^n⁄n if the first heads occurs on toss n, so the terms of the expectation alternate in sign and sum to the alternating harmonic series, which converges to ln 2 only conditionally, not absolutely. Since the series isn't absolutely convergent, Riemann's rearrangement theorem tells us that reordering the very same underlying outcomes lets you make the "expected value" equal any real number you like, or diverge to positive or negative infinity, or oscillate without ever settling on a value.

  I'd like you to compare the two paradoxes properly, rather than treating Pasadena as just "St. Petersburg, but weirder." Please explain precisely why an expectation that is undefined by rearrangement constitutes a different, and arguably deeper, kind of problem than one that is merely infinite, and then assess whether the standard rescues for St. Petersburg — bounding utility, invoking finite wealth, or simply refusing to take unbounded gambles seriously — do anything at all to help with Pasadena. Close with a clear, justified verdict: which of the two paradoxes poses the more serious threat to someone committed to maximizing expected value, and why?
reasoning: |-
  We are comparing the St. Petersburg paradox and the Pasadena paradox. The key difference lies in the convergence properties of the expected value.

  In the St. Petersburg paradox:
  - Payoff when first heads on toss n: 2^n
  - Probability of that outcome: (1/2)^n
  - Expected value: sum_{n=1}^{∞} (1/2)^n * 2^n = sum_{n=1}^{∞} 1 = ∞ (diverges to positive infinity)

  The expected value is unambiguously infinite. The paradox arises because no one would pay an arbitrarily large amount to play. Standard resolutions include:
  1. Bounded utility: If utility is bounded (e.g., by a function of wealth), then the expected utility is finite.
  2. Finite wealth of the counterparty: The game cannot pay out more than the counterparty's wealth, so the payoffs are effectively capped.
  3. Diminishing marginal utility: Even without a hard bound, the utility of money might grow slowly enough to make the series converge.

  In the Pasadena paradox:
  - Payoff when first heads on toss n: (-1)^(n+1) * (2^n / n)
  - Probability: (1/2)^n
  - Expected value: sum_{n=1}^{∞} (1/2)^n * [(-1)^(n+1) * 2^n / n] = sum_{n=1}^{∞} (-1)^(n+1) / n

  This is the alternating harmonic series, which converges conditionally to ln(2) (about 0.693). However, conditional convergence is problematic because of Riemann's rearrangement theorem: by rearranging the order of the terms, we can make the series converge to any real number, or diverge to ±∞, or oscillate.

  The problem for expected value maximization:
  - The expectation is not well-defined because the value depends on the order of summation. But in the context of a game, the order of outcomes is fixed by the natural order of the tosses (n=1,2,3,...). So why is that order privileged? And why should we use the natural order?

  However, note that in the definition of expected value for a discrete random variable, we sum over the possible outcomes in the order of the state space. The state space is naturally ordered by n (the number of tosses). So one might argue that the natural order is the intended one. But the problem is that the series is conditionally convergent, so the expected value is not robust to changes in how we group the outcomes. Moreover, even if we fix the order, the conditional convergence implies that the expectation is not absolutely convergent, which means that the expected absolute value of the payoff is infinite. This is a problem because it indicates that the payoffs are so wild that their magnitudes are not integrable.

  Why is the Pasadena paradox worse?
  1. In St. Petersburg, the expectation is unambiguously infinite. Even if we don't like infinite expectations, we can at least say that the game is worth an infinite amount. In Pasadena, we cannot even define the expectation unambiguously without specifying an order. And if we accept the natural order, then the expectation is finite (ln2). But then why is the natural order the right one? And what if we group the outcomes differently?
  2. The standard rescues for St. Petersburg might not work for Pasadena, or might work differently.

  Let's check the rescues:

  a. Bounded utility: 
     - In St. Petersburg, bounded utility makes the expected utility finite.
     - In Pasadena, if we apply a bounded utility function, then the series becomes absolutely convergent (because the terms are bounded and decay fast enough). So the rearrangement issue disappears. However, note that without bounded utility, the problem remains.

  b. Finite wealth:
     - In St. Petersburg, finite wealth caps the maximum payoff, so the series becomes finite.
     - In Pasadena, finite wealth also caps the payoffs (in absolute value). But note that the payoffs in Pasadena can be positive or negative. If we cap the absolute payoff at M, then the series becomes a finite sum (since for n large enough, |2^n / n| > M, so we stop). However, the conditional convergence issue only arises for the unbounded case. With a cap, the series is a finite sum and hence unambiguously defined.

  c. Refusing to take unbounded gambles seriously:
     - This would dismiss both paradoxes. But if we are committed to expected value maximization, we might not want to do that.

  However, note that even with a bounded utility function, the Pasadena game might still have an expected utility that is conditionally convergent if the utility function is not bounded. But if we assume bounded utility, then the expected utility is absolutely convergent and the problem goes away.

  But without bounded utility, the Pasadena game has an expected value that is conditionally convergent. This is a deeper problem because it shows that the very concept of expected value is not well-defined for this gamble. In contrast, the St. Petersburg game at least has a well-defined expected value (infinity), even if we don't like it.

  Moreover, the Pasadena game has an additional twist: the payoffs alternate in sign and grow without bound in absolute value. This means that the game has extremely large potential losses and gains. The conditional convergence reflects that the sum is very sensitive to the order of summation, which is arbitrary in the sense that we have to choose an ordering of the natural numbers to compute the sum. The natural order is one possibility, but why not group two losses with one gain? The rearrangement theorem shows that by doing so we can get any expected value we want.

  Therefore, the Pasadena paradox is a more serious threat to expected value maximization because it shows that the expectation can be made to be anything by a mere rearrangement of the same outcomes. This calls into question the very meaning of the expected value for such a gamble.

  Verdict:
  The Pasadena paradox poses a more serious threat because it demonstrates that the expected value is not well-defined (without an arbitrary choice of ordering), whereas the St. Petersburg paradox at least has a well-defined (though infinite) expected value. The standard rescues (like bounded utility) do help in both cases, but without such rescues, the Pasadena game leaves the expectation ambiguous.

  However, note that in the standard treatment of expected utility, we sum over the outcomes in the natural order (by the state space). So if we fix the state space and its natural ordering, then we can define the expectation as the sum in that order. But this is arbitrary. Moreover, the fact that the absolute expectation is infinite (i.e., E[|X|] = ∞) is a sign that the random variable is not integrable in the Lebesgue sense, which is a more fundamental issue.

  In summary, the Pasadena paradox is worse because it reveals a deeper problem: the expectation is not defined unambiguously without an arbitrary choice of ordering, and the absolute expectation is infinite, making the gamble inherently unstable. The St. Petersburg paradox, by contrast, has a clear (infinite) expectation and the problems it raises are more about the practical interpretation of infinity.
answer: |-
  ### Comparing the St. Petersburg and Pasadena Paradoxes

  #### Core Distinction: Defined vs. Undefined Expectation
  The fundamental difference between the two paradoxes lies in the **convergence properties** of their expected value calculations:
  - **St. Petersburg**: The expected payoff is a divergent series of positive terms:  
    \(\sum_{n=1}^{\infty} \left(\frac{1}{2}\right)^n \cdot 2^n = \sum_{n=1}^{\infty} 1 = +\infty\).  
    Though infinite, the expectation is **unambiguously defined** (positive infinity). The "paradox" arises from practical objections (e.g., no one would pay infinite money to play), but the *mathematical expectation* is clear.
    
  - **Pasadena**: The expected payoff is a conditionally convergent series:  
    \(\sum_{n=1}^{\infty} \left(\frac{1}{2}\right)^n \cdot \left[ (-1)^{n+1} \frac{2^n}{n} \right] = \sum_{n=1}^{\infty} (-1)^{n+1} \frac{1}{n}\).  
    This converges to \(\ln 2 \approx 0.693\) *only* if summed in the natural order (\(n=1, 2, 3, \dots\)). By Riemann’s rearrangement theorem, reordering the terms allows the series to converge to *any real number*, or diverge to \(\pm \infty\), or oscillate indefinitely. Thus, **the expectation is undefined** without an arbitrary choice of summation order.

  #### Why Undefined Expectation Is Worse
  1. **Decision-theoretic incoherence**:  
     An agent maximizing "expected value" cannot act rationally in the Pasadena game because **no unique expectation exists**. In St. Petersburg, the infinite expectation at least prescribes a clear (if impractical) directive: "Pay any finite amount to play." In Pasadena, rearrangement could "justify" paying \(\$100\), demanding \(\$100\) to play, or refusing to decide—all from the same gamble. This violates the very foundation of expected utility theory (EUT), which requires a well-defined expectation.

  2. **Sensitivity to description, not reality**:  
     The St. Petersburg paradox depends on the game’s *structure* (e.g., unbounded payoffs). The Pasadena paradox depends on *how outcomes are labeled*. Renumbering the coin flips (e.g., swapping \(n=1\) and \(n=2\)) changes the "expected value," even though the physical process is identical. This makes the paradox **language-dependent**, undermining objective decision-making.

  3. **Failure of standard rescues**:  
     Common fixes for St. Petersburg **do not resolve** Pasadena:
     - **Bounded utility**: If utility \(U\) is bounded (e.g., \(U(\text{wealth}) < B\)), St. Petersburg’s expectation becomes finite. But for Pasadena, bounded utility *alone* doesn’t fix the conditional convergence. The series \(\sum_{n=1}^{\infty} U\left( (-1)^{n+1} \frac{2^n}{n} \right) \cdot \left(\frac{1}{2}\right)^n\) may still be conditionally convergent if \(U\) is nonlinear, allowing rearrangement to alter the sum.  
       - *Exception*: If \(U\) is bounded *and* linear, absolute convergence is forced, but linear \(U\) is unrealistic.
     
     - **Finite wealth**: Capping payoffs at the counterparty’s wealth \(W\) truncates both games, yielding finite expectations. However, for Pasadena, **below the cap**, the series remains conditionally convergent (e.g., until \(2^n / n > W\)). Rearrangement still manipulates the "partial" expectation, making it sensitive to labeling.
     
     - **Rejecting unbounded gambles**: Dismissing unrealistic games "solves" both paradoxes superficially. But Pasadena’s core issue—undefined expectation—arises even in **bounded approximations** (e.g., payoffs grow until \(n=1000\)). This forces a confrontation with EUT’s mathematical foundations, unlike St. Petersburg’s tame infinity.

  4. **Absolute vs. conditional convergence**:  
     St. Petersburg’s expectation diverges, but its **absolute expectation** (expected value of \(|\)payoff\(|\)) also diverges. Pasadena’s *absolute* expectation diverges (\(\sum_{n=1}^{\infty} \frac{1}{n} = \infty\)), while its conditional expectation is fragile. This divergence means the gamble has **infinite "risk"** (expected absolute loss/gain), making it pathological even if \(\ln 2\) is accepted as "the" expectation.

  #### Verdict: Which Paradox Poses the Greater Threat?
  **The Pasadena paradox is the more serious threat to expected value maximization.**  

  - **Why?**  
    St. Petersburg exposes practical limitations of EUT (e.g., humans reject infinite gambles), but its expectation is well-defined. Pasadena reveals a **fundamental mathematical flaw**: EUT *cannot consistently assign any expectation* to the gamble without arbitrary choices (summation order, outcome labeling). This challenges the internal coherence of expected utility theory for a wide class of plausible games.  
    
    While bounded utility or finite wealth can *contain* Pasadena, they do not *resolve* the ambiguity—they dodge it by making the gamble bounded. If an agent faces a Pasadena-like gamble with very large (but not infinite) payoffs, EUT remains vulnerable. St. Petersburg, by contrast, is robustly "solved" by any mechanism that bounds utility or payoffs.

  - **Implication**:  
    A committed expected utility maximizer can rationally engage with St. Petersburg (e.g., "Pay all finite costs for infinite reward"). In Pasadena, they face **decision-theoretic paralysis**: no optimal choice exists because the expectation is undefined. This forces a retreat to ad hoc rules (e.g., "Always use natural order"), violating the universality of EUT. Thus, Pasadena demonstrates a deeper limitation of the theory itself.

  #### Final Note
  Pasadena’s threat is not merely theoretical; it arises in games with alternating rewards that grow sub-exponentially (e.g., \(2^n / n^p\)). St. Petersburg, while iconic, is a simpler puzzle about infinity. Pasadena shows that **convergence pathology**, not just divergence, can break decision theory. This makes it a stronger argument for foundational reforms (e.g., lexical priorities, bounded utility as a necessity, or non-archimedean decision theories).
