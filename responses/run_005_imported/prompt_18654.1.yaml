  ```

  For every objection you include, add a one-sentence gloss of the argument and, where it is well known, whose objection it is.
reasoning: |-
  We are ranking objections to David Lewis's modal realism. The tiers are S (essentially fatal) to D (minor nuisance), with at least five objections across at least three tiers.

  First, recall that Lewis's modal realism holds:
  - Possible worlds are concrete, physical entities (like our actual world) but spatiotemporally and causally isolated.
  - They are not abstractions or fictions.

  Standard objections:

  1. **The Incredulous Stare** (often attributed to common sense or many philosophers): The view is just too unbelievable because it posits an infinite number of real, concrete worlds. Lewis himself named this objection and said we must get used to it.

  2. **The Epistemological Objection** (raised by many, e.g., van Inwagen): How can we know anything about other possible worlds if they are causally isolated? We have no causal interaction with them.

  3. **The Problem of Actualization** (also called the "Why call our world actual?" objection): What makes our world actual? Lewis says "actual" is indexical (like "here"), but then why do we care so much about this world? And why is it that only our world is actual for us?

  4. **The Problem of Extravagance** (parsimony objection): The theory is ontologically extravagant. It violates Ockham's razor by multiplying entities beyond necessity.

  5. **The Problem of Isolation**: How can there be no spatiotemporal or causal relations between worlds? This seems ad hoc and leads to issues in explaining cross-world identity and similarity.

  6. **The Problem of Alien Properties** (Lewis discusses this): Some possible worlds contain properties that are not found in our world and not composed of our natural properties. This might challenge physicalism.

  7. **The Problem of Haecceitism** (about individual identity): How can we have the same individual in different worlds? Lewis denies transworld identity and uses counterparts. But counterpart theory has its own problems.

  8. **The Problem for Mathematics and Logic**: If possible worlds are concrete, then what about necessary truths? For example, mathematical truths. Are there worlds where 2+2=5? Lewis must say no because he holds that necessary truths are true in all worlds, but then how is that grounded in concrete worlds?

  But note: Lewis does not allow for violations of logic or mathematics. He holds that the laws of logic and mathematics are necessary and thus hold in all worlds. So this might not be a direct objection.

  However, one might ask: How can a concrete world make a mathematical truth true? Lewis would say that mathematical truths are true in virtue of the structures in each world, but then we have an infinite number of concrete structures that all satisfy the same mathematical truths, which seems redundant.

  But let's stick to the most common objections.

  Another one:

  9. **The Argument from Vagueness** (but this might be more about counterpart theory): How do we determine counterparts? It seems vague, but Lewis accepts vagueness in the world.

  Now, we need at least five objections, spread across at least three tiers.

  Tiers:

  S: Essentially fatal. If the objection holds, the theory is sunk.
  A: Very damaging, but maybe not fatal. Requires a major response.
  B: Significant, but Lewis has a response that many find acceptable (though some don't).
  C: Lewis has a good response that neutralizes the objection for most.
  D: Minor nuisance.

  Ranking according to how Lewis and his critics view them:

  - Lewis thought the incredulous stare was not an argument, just a reaction. So he would put that low.
  - The epistemological objection is serious because it challenges how we can have modal knowledge.
  - The extravagance objection is one that Lewis addresses by claiming the benefits of the theory (theoretical utility) outweigh the cost. But many still consider it a major issue.
  - The actualization problem: Lewis has an indexical theory of actuality, which is a standard response. But some find it unsatisfying.

  Commonly, the most discussed:

  1. **Incredulous Stare**: Lewis says we should get used to it because the theoretical benefits are worth it. So not fatal. Tier D or C.

  2. **Epistemological Objection**: This is serious. How do we know about other worlds? Lewis's response: we know by reasoning from our world and using imagination, but that seems to require a causal connection. This is a major challenge. Tier A or B.

  3. **Extravagance/Parsimony**: Lewis argues that the theoretical unity and explanatory power are worth the cost. Many philosophers value parsimony, so this is a big one. Tier A.

  4. **Actualization/Indexicality**: Lewis's response is that "actual" is indexical, so it's not a property that our world has and others lack. But then why do we care about actuality? Lewis says we care because we are in it. This response is somewhat accepted but still debated. Tier B or C.

  5. **Isolation and the Problem of Overlap**: How can we talk about similarity between worlds if there is no connection? And how do we account for de re modality without transworld identity? This leads to counterpart theory, which has its own objections. The objection to modal realism here is that the isolation is arbitrary. Tier B.

  But we also have:

  6. **The Problem of Alien Properties**: Lewis must admit that there are properties that are not instantiated in our world. He does, and he says they are instantiated in other worlds. But then how can we refer to them? This might be an issue for our modal knowledge. Tier C.

  7. **Counterpart Theory's Problems**: For example, the problem of accidental intrinsics (raised by Kripke). If I might have been taller, then in another world there is a counterpart who is taller. But that counterpart is not me, so how does that account for my possibility? This is an objection to counterpart theory, which is part of Lewis's system. So if counterpart theory fails, then Lewis's account of de re modality fails. This is a major objection. Tier A.

