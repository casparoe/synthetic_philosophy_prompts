  ## The Garden of Seeming
  The rose wasn’t red. Not really.

  That’s what struck Eleanor as she deadheaded the ‘Crimson Glory’ climber twining through the pergola. Her fingers, calloused from years of pruning, worked automatically, snapping off the spent blooms just above the five-leaf junction. She knew the colour was called ‘red’. She’d spent decades cultivating this particular shade, a deep, velvety crimson that glowed like embers in the late afternoon sun. She *said* it was red. She *reacted* to it as red – planning complementary plantings of blue delphiniums, noting its fading intensity as blooms aged, feeling a visceral satisfaction at its vibrancy.

  But now, standing there, secateurs dangling from her wrist, she stared at a freshly opened bud. *What was ‘redness’, actually?* Not the wavelength of light bouncing off the petals, her brain knew that much. Not the neural firing patterns in her visual cortex. Was it some… *extra* thing? A private, internal glow tagged onto the processing? The ‘what-it-is-like-ness’ philosophers waffled about?

  The thought had been creeping in, insidious as bindweed, ever since she’d stumbled across that dense, infuriating article by Keith Frankish in an old philosophy journal left at the dentist’s. *Illusionism*. The argument wasn't that she didn't *see* or *react* to the rose. It was that the supposed *private essence* of ‘red’ – the intrinsic, felt quality she thought resided purely *within* her experience – was a trick. A compelling, persistent story her brain told itself. The ‘seeming’ was undeniable. The *thing it seemed to reveal* – phenomenal redness – was the illusion.

  It felt like vertigo. Like discovering the solid ground beneath her was painted scenery.

  "Eleanor? You zoning out on me again?" Elena’s voice, warm and slightly amused, cut through the buzzing silence. She emerged from the kitchen door, carrying two mugs of steaming tea. "That ‘Crimson Glory’ hypnotizing you? It is spectacular this year."

  Eleanor blinked, forcing a smile. "Just… admiring it." She took the offered mug, the heat a sharp, distinct sensation against her palm. *Heat.* Was *that* real? The nerve signals, yes. The withdrawal reflex, yes. But the *felt quality* of heat? The intrinsic ‘hotness’?

  "You okay?" Elena frowned, peering at her. "You’ve been a bit… abstracted lately. Like you’re listening to a different radio station."

  "I’m fine," Eleanor said, too quickly. She sipped the tea. Bergamot, citrus, a hint of sweetness. *Flavour.* She catalogued the components: olfactory receptors firing, taste buds signalling bitter, sour, sweet. But the *experience* of Earl Grey? Was that just the brain weaving those signals into a coherent label, tagged with memories of rainy afternoons and comfort? Where did the actual *taste-ness* reside? Not in the molecules, not solely in the neurons… so where? *Was* it anywhere?

  "Thinking about the symposium?" Elena asked, leaning against the weathered wood of the pergola post. "Still smarting from David’s ‘qualia are fundamental’ rant?"

  David, Elena’s partner, was a staunch property dualist. Their last dinner had dissolved into a heated, albeit good-natured, debate about consciousness. David had insisted the redness of the rose was as real as the rose itself, a fundamental property of the universe revealed *to* consciousness.

  Eleanor hadn’t mentioned Frankish then. She hadn’t fully grasped the unease it sparked. Now, looking at the rose, then at Elena’s concerned face, she felt a gulf open. "David’s entitled to his view," she said carefully. "But… what if he’s wrong? What if *we’re* wrong?"

  "About the rose being red?" Elena chuckled. "I think the evidence is pretty clear." She gestured at the vibrant bloom.

  "No," Eleanor said, her voice low, intense. "Not about the light, or the signals. About… the *inside* bit. The feeling part. What if… what if there *isn’t* an inside bit? Not like we think?"

  Elena’s smile faltered. "Eleanor, what on earth are you talking about? Of course there’s an inside bit. I feel this tea warming me. I see this glorious red. I feel… well, I feel slightly worried about you right now!" She tapped her temple. "It’s all happening *in here*. Private. Mine."

  "But *what* is happening?" Eleanor pressed, the words tumbling out. "You say ‘feel the warmth’. What *is* the feeling, Elena? Separate from knowing your hand is on a hot mug? Separate from the physiological changes? Is it a *thing*, or is it just… the brain *reporting* on its own state with such immediacy and richness that it *seems* like a separate thing? A… a compelling illusion?"

  Elena stared, her mug halfway to her lips. "An illusion? Eleanor, that’s… that’s mad. This," she gestured vaguely around her, encompassing the garden, the tea, herself, "this *is* experience. Raw feeling. You can’t deny *this*." Her voice held a hint of affront, as if Eleanor had questioned the reality of the garden itself.

  "I’m not denying *anything* you can point to!" Eleanor insisted, frustration mixing with her own creeping dread. "I’m not denying you react, you report, you behave as if you feel. I’m questioning *what the report is about*. Is it about an actual, private, intrinsic glow? Or is it about… complex information processing that *generates the belief* in the glow?"

  The air between them thickened. The scent of roses and damp earth felt suddenly heavy. Elena shook her head slowly. "That sounds… empty. Like you’re saying we’re just… complicated machines. That there’s no *there* there. Is that what you believe?"

  Eleanor closed her eyes. She focused on the darkness behind her lids. She tried to conjure the *redness* of the rose. An image formed, yes. A memory of its shape, its location. But the *redness itself*? Was it present? Or was she just *thinking about* the concept of ‘redness’, remembering the label, the associated neural patterns? When she opened her eyes, the colour flooded back, vivid, undeniable. But *what* was undeniable? The *seeming*, or the *thing seemed*?

  "I don’t know what I believe anymore," she whispered. "I just know… it feels different now. Like I’ve seen the scaffolding behind the stage set. I can’t *unsee* it."

  Elena was silent for a long moment. She sipped her tea, her gaze fixed on a cluster of white cosmos trembling in a light breeze. "It sounds lonely," she said finally, her voice soft. "And a bit frightening."

  It was. That was the heart of the vertigo. Not doubting *others* had experiences, but doubting the nature of her *own*. The bedrock of her being – the feeling of being Eleanor, experiencing the world – felt suddenly… constructed. Potentially hollow. If the phenomenal glow was an illusion, what was *she*? A collection of reports? A narrative engine?

  The crisis wasn't about proving anything to anyone else. It was internal. A quiet, relentless erosion. She deadheaded another rose. The snap of the stem was sharp, physical. She felt the resistance, heard the sound. But the *feeling* of resistance? The *soundness* of the snap? Were they just… the brain’s final, inescapable pronouncements on sensory input and motor feedback? Pronouncements so immediate they wore the mask of raw feeling?

  Later, washing her hands at the outdoor sink, she watched the water cascade over her skin. Coolness. Wetness. Pressure. Each sensation distinct, rich. *But what is the 'coolness' apart from the thermal sensors firing and the brain interpreting it?* The question echoed, not as an intellectual puzzle, but as a visceral unease. The water *seemed* cool. The label ‘cool’ arose automatically. The concept felt familiar. But the intrinsic *quality*… it felt elusive, like trying to grasp smoke. Was it ever truly *present*, or was its apparent presence simply the *result* of the processing, the final output tagged as ‘experience’?

  She dried her hands on a rough towel. The texture registered – coarse, absorbent. She *knew* it was rough. She could describe it. But the *felt roughness*… where did it begin and the neural description end? Was there a line? Or was the ‘feeling’ just the brain’s *own* description of its state, presented with such authority that it felt like something more?

  The garden, her sanctuary, felt alien. The colours were vibrant, the scents heady, the textures varied. She *reacted* to them all with the same deep, ingrained appreciation. She planned where to plant the new foxgloves, noted the aphids on the lupins, felt the sun’s warmth on her neck. Everything proceeded as before. Her knowledge was intact. Her discriminations were sharp. Her reports – to herself and others – flowed naturally.

  Yet, underneath the seamless functioning, a quiet tremor persisted. The world hadn't lost its richness, but it felt… explained. Over-explained. The vibrant red of the rose no longer felt like a simple, given presence. It felt like a conclusion. A breathtakingly complex, utterly convincing, biologically-engineered *conclusion* presented as a fundamental reality.

  She looked at her hands, the lines etched by time and soil. Instruments of interaction, reporting surfaces. Was the feeling *in* them? Or was it the brain’s story *about* them? The question didn't resolve. It hung in the air, as persistent as the scent of roses, a shadow cast by the brilliant, undeniable *seeming* of the world. The garden thrived. Eleanor tended it. But the silent, internal conviction – the certainty of the inner glow – had fractured, leaving only the echo of its own compelling illusion, and the unsettling, unanswerable meta-question: *Why does it seem so real?* The crisis wasn't solved; it was merely inhabited, a new, disquieting layer beneath the surface of her sunlit world. The feeling of feeling had become the problem.
