  ok this is a bit of a rabbit hole but hear me out. I keep seeing the "there's no such thing as a chair, just particles arranged chairwise" line thrown around in reductionism-flavored rationalist discussions, and it turns out thats actually van Inwagen's move from the special composition question literature, not just an LW-ism. So here's what I want: compare van Inwagen's organicism (composition occurs iff the activity of the parts constitutes a life) to universalism, i.e. unrestricted composition (Lewis, Sider). Universalism's whole selling point is supposedly that it dodges the vagueness argument -- any view where composition is sometimes indeterminate is meant to be unacceptable. But organicism seems to walk right into that same trap, since it's often genuinely unclear whether some particles' activity counts as "a life." Does van Inwagen have a real way out of this, or does biting the bullet on vague existence end up costing him more than universalism's bloated ontology of gerrymandered fusions costs Lewis? Give me an actual verdict, not a wishy-washy "well it depends."
