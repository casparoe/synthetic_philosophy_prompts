prompt: |-
  I co-run a decision theory podcast with a couple people from my program, and next weeks guest defends resolute choice as the answer to Parfit's hitchhiker. Her go-to move whenever someone objects that you have zero incentive to actually pay the driver once you're safe in town is 'if your decision theory tells you to die of thirst, thats a refutation of the theory, not a fact about rationality.' Draft me 6-8 questions that make that move progressively harder to use. I want one where she has to explain how this differs from Kavka's toxin case, where you never actually have to drink the stuff, and one on what happens once the driver's lie detector is only 95% reliable instead of perfect -- each with a follow-up keyed to her likely answer. End on a question about what a losing case would have to look like before she'd admit causal decision theory was right all along.
reasoning: |-
  Okay, the user is co-hosting a decision theory podcast and needs questions to challenge a guest defending resolute choice in Parfit's Hitchhiker. The guest's typical rebuttal is that if a theory tells you to die of thirst, it's refuted. The user wants 6-8 questions that make this harder, specifically addressing Kavka's Toxin Puzzle and imperfect lie detectors, with follow-ups. They also want a final question about what would make her admit CDT is right.

  First, I need to recall Parfit's Hitchhiker: you're stranded in a desert, a driver offers a ride only if you promise to pay $100 in town. If you promise but don't pay, you die of thirst. Resolute choice says you should commit to paying and follow through, while CDT might suggest promising but not paying once safe. The guest argues CDT is flawed because it leads to death.

  For the Kavka's Toxin case: here, you get $1M if you intend to drink toxin tomorrow, but you don't actually have to drink it. Resolute choice might struggle here because you can intend without acting. The user wants a question comparing the two, highlighting why resolute commitment works in one but not the other. Follow-up should press on whether intention without action is cheating.

  Next, the lie detector reliability: if it's 95% accurate, resolute choice might face issues because even if you resolve to pay, the detector might misread your intention. Follow-up should challenge how to maintain resolution under uncertainty and whether it becomes irrational to pay if detected as lying.

  The user also wants a question on what a losing case for resolute choice would look like. This means a scenario where even the guest admits CDT is correct. Need to think of situations where resolute commitment leads to worse outcomes, like dynamic inconsistencies or when others can exploit your resoluteness.

  Deep needs: The user likely wants to test the robustness of resolute choice, expose its limitations, and push the guest to clarify ambiguities. They might be preparing for a rigorous debate, ensuring their podcast challenges guests effectively. Unspoken needs could include understanding when resolute choice fails, ensuring their podcast maintains critical depth, or even settling internal disagreements within their program.

  Structuring the questions: Start with the core move, then Kavka comparison, imperfect detector, and end with the losing case. Each main question needs a sharp follow-up. Ensure questions build progressively, making the guest's defense harder. For Kavka, focus on the difference in precommitment vs. no real consequence. For reliability, emphasize probabilistic outcomes undermining resolution. The losing case should force admission that CDT handles certain situations better, like when commitment is impossible or exploited.

  Need to ensure questions are precise and trap common counterarguments. For example, in the lie detector scenario, if resolution can't be perfectly detected, paying when safe becomes irrational per CDT, and resolute might not offer a better outcome. The losing case could involve multiple agents or changing circumstances where commitment leads to suboptimal results.

  Finally, the last question should be confrontational but fair, asking what evidence would falsify resolute choice. This forces the guest to define boundaries of their theory, revealing its limits and possibly conceding to CDT in specific cases.
answer: |-
  Here are 8 progressively challenging questions targeting the "refutation of the theory" move in Parfit's Hitchhiker, incorporating your specific requests and ending with the "losing case" question. Each main question has a follow-up designed to pressure the core defense.

  **Core Challenge & Kavka's Toxin:**

  1.  **Question 1 (Core Challenge Setup):** "You argue CDT's recommendation to not pay (and thus die of thirst) is a refutation of CDT itself. But doesn't this simply *assume* the conclusion – that rationality *must* require paying once safe? CDT precisely argues that paying *is* irrational *at that point* because it costs $100 for zero causal benefit. Isn't calling this a 'refutation' just begging the question against CDT's core definition of rationality based on causal consequences?"
      *   *Follow-up (If she doubles down on "rationality requires paying"):* "If rationality *requires* paying once safe, independent of causal consequences, what *is* the positive reason to pay? Is it just 'because you said you would'? Doesn't that reduce rationality to a form of deontology that CDT explicitly rejects?"

  2.  **Question 2 (Kavka's Toxin Comparison):** "A common counter to resolute choice is Kavka's Toxin Puzzle. There, intending to drink the toxin gets you $1M, but you never *actually* have to drink it to get the money. Resolute choice seems to demand you *do* drink the toxin to be truly resolute, which most find absurd. How is Parfit's Hitchhiker *fundamentally different* such that resoluteness requires *actual costly action* here, but not in Kavka's case where the costly action is also causally pointless?"
      *   *Follow-up (Keyed to likely "Parfit has a binding agreement" answer):* "But the 'agreement' in Hitchhiker is just a verbal promise *to the driver*, who is now gone once you're in town. The driver gains nothing from your payment. How is this 'binding agreement' meaningfully different from the 'intention' in Kavka's case? Both lack ongoing enforcement or causal links *at the moment of action*. Why is paying rational fidelity to a ghost of an agreement, while drinking the toxin isn't?"

  **Imperfect Detection Challenge:**

  3.  **Question 3 (Imperfect Detection Intro):** "Let's modify the scenario: the driver's lie detector is only 95% reliable. If you genuinely intend to pay when promising, there's a 5% chance it reads 'Lie' and leaves you to die. If you intend not to pay, there's a 5% chance it reads 'Truth' and gives you a ride you didn't 'deserve'. How does resolute choice handle this uncertainty? Should you *resolve* to pay?"
      *   *Follow-up (If she says "Yes, resolve to pay"):* "Given the 5% risk of dying *even if* you resolutely intend to pay, isn't CDT's calculation – weighing the high probability of dying if you intend *not* to pay against the small risk of dying if you intend *to* pay, plus the certainty of saving $100 if you survive without intending – potentially more attractive? Doesn't the imperfection reintroduce a causal incentive *calculation* that resolute choice tries to bypass?"

  4.  **Question 4 (Post-Ride Imperfect Detection Pressure):** "Assume the detector was imperfect, you resolved to pay, got the ride, and are now safe in town. Crucially, the driver *also* implanted a (95% reliable) post-ride 'intention scanner'. If you scan as intending *not* to pay *now*, they remotely detonate a small implanted device causing painful (but non-lethal) injury costing $200 to treat. Paying costs $100. How does resolute choice guide you *now*? Do you *still* pay the original $100?"
      *   *Follow-up (Targeting the core move):* "If you scan as intending *not* to pay the $100, you face a 95% chance of a $200 penalty. CDT would likely say: 'Don't pay the $100; the scanner might misread my genuine intention to pay as a lie, costing me $200 unnecessarily. Better to not pay and risk the penalty.' If resolute choice still says 'Pay!', and the scanner *correctly* reads your resolute intention to pay, you pay $100 *unnecessarily* (since no penalty occurs). If resolute choice tells you to risk paying $100 when CDT says you risk $0 or $200, how is that *not* a refutation of resolute choice in this modified scenario?"

  **Pushing the "Refutation" Move & The Losing Case:**

  5.  **Question 5 (Burden of Proof):** "Your 'refutation' move places the entire burden of proof on CDT: 'If your theory says die of thirst, it's wrong.' But doesn't this risk making resolute choice unfalsifiable? What specific, *non-question-begging* evidence *could* convince you that *not* paying in the original Hitchhiker *is* the rational choice? What would a winning case for CDT *look like* in this scenario if 'die of thirst' is automatically disqualifying?"
      *   *Follow-up (If she struggles or gives a weak answer):* "If *no* conceivable argument could convince you that not paying is rational in the base case, doesn't that suggest your position is based on an *axiomatic* commitment to keeping promises/resolution, rather than a consequence-based evaluation that could be falsified by outcomes?"

  6.  **Question 6 (The Losing Case for Resolute Choice):** "Let's flip the script. Resolute choice has its own counterexamples, like the modified Toxin case or potentially the imperfect detector scenarios we discussed. What would a *losing case* for resolute choice have to look like? Describe a specific decision problem where you would concede: 'In *this* scenario, resolute choice delivers an undeniably worse outcome or an incoherent prescription, and CDT (or perhaps EDT) clearly gets it right.' What's the minimal feature a scenario needs to force that admission?"
      *   *Follow-up (Pressing for Concession):* "Could a scenario involving multiple agents, precommitment impossibility, or dynamically shifting incentives where resolution *systematically* leads to exploitation or strictly dominated outcomes qualify as that losing case? If not, what *would*?"

  **Key Rationale Behind the Questions:**

  1.  **Targets Core Assumption:** Q1 directly challenges the question-begging nature of declaring CDT's result a "refutation."
  2.  **Exploits Kavka Difference:** Q2 & F-Up force a distinction between "intending" and "acting" that highlights the unique (and arguably special) cost of *inaction* in Hitchhiker vs. the cost of *action* in Toxin. The likely "binding agreement" answer is pressured by its lack of substance post-ride.
  3.  **Introduces Uncertainty:** Q3 breaks the perfect information assumption resolute choice often relies on. The F-Up shows CDT can handle the probabilistic trade-off resolute choice struggles with.
  4.  **Post-Hoc Incentive & Core Move Pressure:** Q4 is the hammer. It creates a *new* causal incentive *after* the ride that directly interacts with the *intention* to fulfill the original resolution. Resolute choice paying the $100 now looks actively harmful compared to CDT's calculation. The F-Up explicitly turns her core move ("if theory says do X bad thing, it's refuted") against resolute choice in this context.
  5.  **Challenges Unfalsifiability:** Q5 pressures the defensive nature of the "refutation" move, asking what could *possibly* count as evidence *for* the CDT position in Hitchhiker.
  6.  **Forces Admission of Limits:** Q6 is crucial. It pushes her to define the boundaries of her own theory and admit scenarios where CDT (the "enemy") might be superior. The F-Up pushes for a concrete example of concession.

  These questions force the guest beyond the soundbite and require her to grapple with the mechanics of resolution under uncertainty, the boundaries between intention and action, the potential downsides of resoluteness, and ultimately, the falsifiability of her own position. Good luck with the podcast!
