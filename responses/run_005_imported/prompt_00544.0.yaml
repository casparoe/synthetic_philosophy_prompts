prompt: |-
  I've been reading about acausal threats between advanced agents (like AIs or superintelligences that never causally interact but can model one another) and the proposed defense of adopting "surrogate goals" -- essentially, an agent deliberately cultivates a visible concern for some substitute value so that rational threateners target the surrogate rather than the agent's actual utility function, which supposedly removes the incentive to threaten in the first place. I understand the basic setup, but I'm stuck on why this is actually stable: what stops a sufficiently sophisticated threatener from simply seeing through the surrogate and threatening the real values anyway, or threatening the surrogate too if doing so costs it nothing? Could you walk me through the game-theoretic logic that's supposed to make surrogate goals work as a genuine defense, and be explicit about the assumptions (e.g., about common knowledge, commitment ability, or the threatener's own incentives) that the strategy depends on to avoid collapsing?
