  Quick question from my decision theory reading group - we just went through Oesterheld's paper on evidential cooperation in large worlds, and I think I've got the gist: since the universe (or multiverse) is probably huge, there's tons of agents out there whose decisions correlate with mine, so if I act cooperatively toward other value systems, that correlation actually reaches out and makes those distant, causally disconnected agents cooperate back too - basically a loophole that gives us real influence over stuff we can't otherwise touch. My officemate says this is just spooky action at a distance and that decision theory alone cant hand you a genuinely new causal power out of nowhere. Before I go argue with him again - who's actually right, and am I even describing ECL correctly?
