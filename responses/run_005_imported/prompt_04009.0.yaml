prompt: |-
  Ok so this has been bugging me for like two weeks and I keep going back and forth on it in my head. At my job we've got this pretty senior engineer, I'll call him Marcus, who has a well-known habit of skipping our PR review process whenever he's under time pressure — he just pushes straight to main and "deals with it later" if anything breaks. Funny enough, he's actually the one who showed our newest hire, Priya, how to do this when she joined (some workaround with the branch protection settings), half-joking that everyone does it eventually. Fast forward to last week: Priya pushed straight to main to hit a deadline, it caused a small but annoying prod bug, and Marcus — who also happens to be writing her performance review this cycle — pulled her aside and gave her a whole lecture about discipline and how skipping review is exactly the kind of thing that gets people managed out. Objectively I don't think he said anything false, skipping review probably was reckless there and did cause a real problem. But a few of us who overheard felt kind of icky about it, like it wasn't really his place to be the one saying it, even though none of us could explain why in any rigorous way.

  I brought this up with my roommate over dinner and she just said "well, is what he said true or not, that's all that should matter," which kind of stumped me because I dont think thats quite right either, but I couldn't say why. Is there something actually wrong with Marcus being the one to deliver that message, given his own track record (and the fact that he taught her the habit in the first place), or is that irrelevant and we should just judge his words on their own merits like my roommate said? Does it change anything that he wasn't just some random coworker venting but literally her manager for review purposes? I've never taken a philosophy class so maybe there's some obvious framework I'm missing, but I don't want the generic "communication is important" type answer — I want to actually understand what's going on here conceptually, like is there a real principle at stake or are we just being petty/protective of our teammate.
reasoning: |-
  Okay, the user is really grappling with a moral dilemma at work. Marcus, a senior engineer, taught Priya a shortcut to bypass PR reviews, but then reprimanded her for using it when it caused a problem. The user feels uncomfortable about Marcus's hypocrisy but can't articulate why, especially since his criticism was technically correct. The roommate's "only truth matters" stance doesn't sit right with them.  

  Hmm, this is actually a classic case of ethos violation. Marcus's credibility is shot because he's not just a hypocrite—he's the hypocrite who created the problem. The user's gut feeling about the "ick" factor is spot on. What's interesting is how this intersects with power dynamics: Marcus isn't just a peer, he's writing Priya's performance review. That turns a coaching moment into a threat.  

  The roommate's purely logical take misses how human communication works. Sure, skipping review was wrong, but Marcus framing it as Priya's failure when he (a) taught the method and (b) does it himself? That's not just irrelevant context—it's the core issue. The user needs frameworks to explain why authority figures can't separate message from messenger.  

  Also worth noting: the user cares about conceptual rigor, not management platitudes. They want to defend their discomfort intellectually. The hypocrisy angle is obvious, but the deeper issue is Marcus weaponizing a process he subverts—that's abusive hierarchy. Priya likely followed his "everyone does it" cue precisely because he's senior. Now he's punishing her for trusting him.  

  The performance review piece escalates this from annoying to unethical. Marcus holds structural power over Priya while setting her up to fail. That's not just unfair; it creates a minefield where she can't win. If she'd insisted on proper process after he taught her the shortcut, she'd risk seeming difficult. Now she's "reckless." Classic double bind.  

  What the user might not realize: their discomfort signals healthy ethical instincts. Calling this out protects psychological safety on the team. If Marcus isn't challenged, others will learn that (a) rules don't apply to seniors, and (b) you'll be punished for emulating them. That erodes trust in leadership.  

  Should probably emphasize that "truth" isn't the only variable in ethical communication. Marcus's message contained facts but was delivered in bad faith—that's why it feels manipulative. The user's hesitation comes from recognizing power abuse, not defending Priya's mistake.
answer: |-
  Your gut feeling is spot-on—there's a significant ethical problem here beyond mere hypocrisy. Marcus's actions violate three core principles of effective leadership and organizational justice:

  ### 1. **The "Clean Hands" Principle of Moral Authority**
     - **Concept**: To legitimately enforce a rule or deliver criticism, one must not be actively complicit in violating that rule. Marcus isn't just historically hypocritical; he *taught and normalized* the bypass method. His hands are dirty, undermining his moral standing to judge.
     - **Why it matters**: When rule-enforcers routinely break rules, it signals that the rules are arbitrary or hierarchical—applying only to junior staff. This erodes trust in processes and leadership.

  ### 2. **Power-Asymmetry Trap**
     - **The dynamic**: Marcus holds dual roles: (a) the person who *enabled* the harmful behavior, and (b) the person *evaluating* Priya for that same behavior. This creates a lose-lose bind:
       - Priya was implicitly encouraged to follow his example/seniority.
       - She's now punished for doing so, with career consequences.
     - **Risk**: This mirrors **entrapment**—creating conditions for failure, then penalizing it. It’s abusive use of managerial power.

  ### 3. **Epistemic Injustice**
     - **The knowledge factor**: Marcus, as senior engineer and mentor, shaped Priya's understanding of "acceptable risk." By joking that "everyone does it," he framed skipping reviews as a *norm*, not an exception. Now he retroactively redefines it as "recklessness" without acknowledging his role in establishing that norm.
     - **Consequence**: Priya is denied the context to defend herself. Her actions were judged in a vacuum, while Marcus’s identical actions are tacitly excused as "necessary."

  ### Why "Just the Truth" Isn't Enough
  Your roommate's stance ignores **relational ethics**: Truth isn't divorced from *who delivers it* and *how power is wielded*. Marcus's criticism may be factually correct, but:
  - **It distracts from systemic failure**: The focus shifts to Priya’s "discipline" rather than why engineers feel pressured to bypass reviews—a problem Marcus perpetuates.
  - **It weaponizes truth**: Using factual criticism to punish someone for behavior you taught them is a form of gaslighting. It implies Priya should have known better *than her teacher*.

  ### The Managerial Double Standard
  Marcus’s role as reviewer escalates this from hypocrisy to **professional malpractice**:
  - **Conflict of interest**: He created the conditions for Priya’s "failure," yet will judge her performance. This violates basic fairness in evaluations.
  - **Toxic precedent**: If leaders punish juniors for behaviors they model themselves, it breeds resentment, silence, and learned helplessness.

  ---

  ### What Should Happen (Conceptually)
  - **Accountability parity**: Marcus should address his own bypasses *publicly* before criticizing others. A leader must either defend the practice (and change policy) or renounce it (and accept equal blame).
  - **Structural fixes**: The real issue isn’t Priya’s "discipline"—it’s *why* engineers skip reviews. Deadlines? Cumbersome processes? Marcus should fix the system, not scapegoat individuals.
  - **Restorative response**: Marcus owes Priya: (1) acknowledgment that he taught her the bypass, (2) an apology for the double standard, and (3) a commitment to change his own behavior.

  ### Bottom Line
  This isn’t pettiness—it’s about **coherence in ethical leadership**. Authority figures who punish others for behaviors they actively promote undermine trust, integrity, and psychological safety. The "ick" you feel is your instinct recognizing that power is being abused, not just rules broken. Validating this dynamic tacitly endorses a two-tier system where leaders are immune to the standards they enforce.
