prompt: |-
  My brother and his husband just finalized their adoption and the little girl comes home from foster care this Thursday, so were doing a small welcome dinner for her Saturday night. My brother's not a philosopher himself but he's been reading L.A. Paul's stuff on transformative experience to try to talk himself through the whole decision, and he keeps saying, half-joking, that every parent he's asked has told him "you'll love it, its worth it," and that this doesn't actually settle anything for him, since the person doing the loving afterward is post-kid him, not the him who's deciding right now. He's asked me, as the resident philosophy professor in the family, to say a few words before we eat. Half the table is our very non-philosophical extended family who just want something warm about a baby joining the family, the other half is his and his husband's old grad school crowd who'll clock it immediately if I dodge his actual worry by just saying the reassuring thing he told me specifically not to say. Write me about three minutes of remarks that take the testimony problem seriously without turning into a seminar, or worse, a downer at a party about a baby.
reasoning: |-
