  The wishful thinking charge is red herring - the shift occurs because the message makes Red territory "riskier" by concentrating probability mass, not because of optimism. I should emphasize how this resolves cleanly in the limit case: when the message rules out Red Second Company, Blue credence rising to 2/3 is mathematically inescapable. Any update rule that doesn't do this is indefensible.

