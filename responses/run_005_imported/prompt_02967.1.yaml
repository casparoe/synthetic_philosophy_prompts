answer: |-
  Your project brilliantly captures a core tension in conditional logic. Let's break down the divergence between Stalnaker and Lewis, then see how Adams/Edgington sidestep truth conditions for indicatives, using the Oswald/Kennedy case to clarify. Finally, I'll defend a principled basis for the asymmetry.

  ### 1. Stalnaker vs. Lewis: Where Worlds Diverge
  Both use possible worlds and a "closeness" ordering, but critical technical differences yield distinct predictions:

  *   **Stalnaker's Selection Function (Uniqueness Assumption):**
      *   For any antecedent `A` and actual world `w`, there is *exactly one* closest (most similar) `A`-world.
      *   "If A were the case, C would be the case" is **true** iff `C` is true in that single closest `A`-world.
      *   **Consequence:** The Law of Conditional Excluded Middle (LCEM) holds: `(A □→ C) ∨ (A □→ ¬C)` is always true. Either `C` *would* happen or `C` *would not* happen if `A` were true – no "indeterminacy."

  *   **Lewis's Similarity Ordering (No Uniqueness, No Limit):**
      *   Worlds are ordered by comparative similarity to `w`. There might be *multiple* equally close `A`-worlds (rejects Uniqueness). There might be *no closest* `A`-world – an infinite sequence of increasingly close `A`-worlds (rejects Limit Assumption).
      *   "If A were the case, C would be the case" is **true** iff:
          1.  There are *no* `A`-worlds (Vacuous Truth), *or*
          2.  There is *some* `A`-world such that `C` is true at *all* `A`-worlds *at least as close* to `w` as that world. (Equivalently: `C` is true throughout *all* the closest `A`-worlds *if* there is a closest set; if not, `C` must be true in `A`-worlds arbitrarily close to `w`).
      *   **Consequence:** LCEM fails. If the closest `A`-worlds include some where `C` is true and some where `C` is false, then `A □→ C` is *false* and `A □→ ¬C` is also *false*. Counterfactuals can be genuinely indeterminate.

  **Concrete Divergence:** Imagine a scenario where two possible outcomes (`C` and `¬C`) are *equally likely* and *equally similar* to the actual world if `A` were true.
  *   Stalnaker: *Forced* to choose one closest world. If he picks a `C`-world, `A □→ C` is true; if he picks a `¬C`-world, `A □→ ¬C` is true. LCEM holds, but the choice seems arbitrary.
  *   Lewis: Acknowledges the tie. *Both* `A □→ C` and `A □→ ¬C` are **false**. The counterfactual is genuinely indeterminate – neither outcome *would* definitely happen. This arguably better matches intuition in cases of symmetric chance or ability (e.g., "If I flipped this fair coin, it would land heads" is intuitively false; Lewis captures this).

  ### 2. Adams/Edgington & Escaping Truth Conditions
  Adams and Edgington focus on *indicative* conditionals ("If A, C"). Their core claims:

  1.  **Assertability = Conditional Probability:** The assertability (or acceptability) of "If A, C" is given by the conditional probability P(C|A). You believe the conditional strongly to the extent you think C is likely given A.
  2.  **No Truth Conditions (Adams):** Indicatives lack truth conditions. They aren't propositions that can be true or false like ordinary statements. Lewis's triviality results are the death knell: if you assign truth conditions to "If A, C" and require that its probability equals P(C|A), you get absurdity (e.g., the probability of C given A must equal the probability of C simpliciter, collapsing all dependence).
  3.  **Suppositional Theory (Edgington):** "If A, C" expresses a conditional *assertion*. You *assert* C under the *supposition* that A. Its role is not to describe a state of affairs (truth-bearing) but to guide beliefs and assertions based on suppositions. Probability is primary.
  4.  **Escaping the Demand:** They sidestep the demand for truth conditions by arguing it's the *wrong demand* for indicatives. Indicatives are fundamentally *epistemic* devices for managing belief under supposition, not *metaphysical* devices for describing how worlds are or could be. The success of the conditional probability rule in capturing our judgments about assertability and inference (e.g., Adams's probabilistic validity) is evidence that truth conditions are unnecessary and even incoherent for this linguistic function.

  **Oswald/Kennedy - Making the Contrast Concrete:**
  *   **Indicative:** "If Oswald didn't kill Kennedy, someone else did." (Adams/Edgington Treatment)
      *   Context: We know Kennedy *was* killed. We're uncertain about Oswald's guilt.
      *   **Assertability:** Very high. P(Someone else did | Oswald didn't) ≈ 1 (given the fact of the murder).
      *   **Truth Conditions?** Denied or irrelevant. We're not considering alternate histories; we're reasoning *within* our knowledge state about the actual world. The conditional expresses our high confidence that *given what we know*, if Oswald wasn't the killer, someone else must have been.
  *   **Counterfactual:** "If Oswald hadn't killed Kennedy, someone else would have." (Stalnaker/Lewis Treatment)
      *   Context: We assume Oswald *did* kill Kennedy. We're considering a *different course of history*.
      *   **Truth Evaluation:** We look at the closest worlds where Oswald doesn't pull the trigger. What are they like?
          *   Stalnaker: Picks *the* closest Oswald-didn't-shoot world. Is there a lone gunman (Ruby?) waiting? Or does the plot succeed later? His uniqueness forces a definite answer (True or False), which may feel artificial.
          *   Lewis: Examines the *sphere* of closest Oswald-didn't-shoot worlds. If they *all* involve another assassin (e.g., a competent conspiracy), the conditional is True. If they *all* involve no assassination (e.g., security intervened), it's False. If some close worlds have another killer and some have no killing (perhaps Oswald's hesitation caused a disruption), it's False (neither outcome *would* happen). This indeterminacy often feels right.
      *   **Key Difference:** The counterfactual *is* about alternate histories and *does* aim to describe a (counterfactual) state of affairs. Truth conditions seem appropriate.

  ### 3. Your Question: Is the Asymmetry Principled or an Artifact? A Defense

  **Yes, there is a principled basis for the asymmetry.** While "if" is the same word, it marks fundamentally different cognitive and linguistic operations depending on grammatical mood and context. Treating counterfactuals truth-conditionally while denying truth conditions for indicatives is well-motivated by:

  1.  **The Epistemic vs. Metaphysical Divide:**
      *   **Indicatives:** Primarily operate *within* an epistemic space. "If A, C" concerns how our *beliefs* about C depend on the supposition A *within our current knowledge state*. They are tools for *reasoning under uncertainty* about the actual world. Adams/Edgington capture this with conditional probability/supposition. Assigning truth conditions forces them into a metaphysical mold they don't fit, inviting triviality.
      *   **Counterfactuals:** Primarily operate in a *metaphysical* space. "If A *were/had been* the case, C *would be/would have been* the case" concerns how the world *itself* depends on or would have depended on different circumstances. They describe relations between *ways the world could be or could have been*. Possible worlds semantics (whether Stalnaker or Lewis) directly models this metaphysical dependence. Truth conditions are essential for this descriptive function.

  2.  **Grammatical & Contextual Cues:** English *signals* this difference:
      *   **Indicative:** Present/Future tense, indicative mood ("is", "does", "will"). Often used when the antecedent's truth is open ("If it rains tomorrow...").
      *   **Counterfactual:** Past tense, subjunctive/conditional mood ("were", "had", "would"). Used when the antecedent is presupposed false or highly unlikely ("If it rained tomorrow..." implying it likely won't, or "If it had rained yesterday..." knowing it didn't). The Oswald pair perfectly illustrates how grammar forces the indicative/counterfactual reading.

  3.  **The Role of Factivity:** The indicative "If A, C" is typically used when the speaker *does not know* ¬A (A might be true). The counterfactual "If A had been, C would have" is used when the speaker *knows or believes* ¬A. This difference in the epistemic status of the antecedent fundamentally changes the function of the conditional.

  4.  **Escaping Triviality:** Lewis's proof isn't just a technical hiccup; it's a profound demonstration that the *epistemic* function of indicatives (tracking P(C|A)) *cannot be reduced* to a standard truth-conditional proposition without collapsing probabilistic reasoning. This is strong evidence that they *aren't* truth-conditional. Counterfactuals face no such barrier.

  **Is the asymmetry an artifact?** While historical contingencies play a role (e.g., Lewis worked on counterfactuals before his triviality results, Adams was influenced by Ramsey), the core distinction arises from persistent, robust linguistic and philosophical observations. Treating "if" as univocal forces either counterfactuals into an implausible epistemic mold or indicatives into an incoherent metaphysical one, plagued by triviality. The grammatical and functional differences provide clear, principled grounds for the divergent treatments.

  **In Conclusion:** The tension you feel reflects a genuine bifurcation in how conditionals work. Stalnaker and Lewis offer competing truth-conditional models for the metaphysical project of counterfactuals, differing on uniqueness and indeterminacy. Adams and Edgington argue persuasively that the epistemic project of indicatives requires abandoning truth conditions altogether, using conditional probability to explain their assertability. The Oswald/Kennedy pair highlights this split: the indicative reasons *from* the known fact of the murder *within* the actual world, while the counterfactual explores *how history might have unfolded differently*. The asymmetry in treatment is not merely historical accident; it is motivated by deep differences in the function, grammar, and logic of these two crucial uses of "if." Your term paper should defend this principled asymmetry as the key to resolving the tension.
