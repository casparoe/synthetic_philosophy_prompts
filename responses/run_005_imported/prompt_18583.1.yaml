   2. Survival framing: presenting a treatment's outcome in terms of survival rates rather than mortality rates (which are mathematically equivalent).
      - This leverages framing effects. People react differently to the same information when framed positively (survival) vs negatively (mortality). 
      - It is commonly used in medicine to encourage patients to choose beneficial treatments. It engages the rational agency by providing accurate information, but the framing influences the emotional response. This is often considered acceptable but can be borderline because it uses a cognitive bias.

   3. Motivational interviewing: a counselor drawing out a client's own stated reasons for change rather than arguing for change directly.
      - This technique is designed to engage the client's own motivations and reasoning. It enhances rational agency by helping the client reflect and articulate their own reasons. 
      - It is widely accepted in therapy as a legitimate and respectful method.

   4. Scarcity messaging: "only 2 left in stock".
