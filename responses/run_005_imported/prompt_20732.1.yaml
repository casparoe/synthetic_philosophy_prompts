  First, the standard quantum suicide setup: MWI true, gun kills you with 50% amplitude per trial. Argument: you only experience branches where you survive, so after N trials, you'd find yourself alive against absurd odds. But this assumes (a) all branches are equally "real," and (b) "you" are equally present in all surviving branches. 

