answer: |-
  Here's a concrete example contrasting Kepler's defended core principle with a rejected common practice, explained entirely within his own theoretical framework:

  **Defended: Planetary Aspects (Specifically "Hard Aspects" like Conjunction, Opposition, Square) based on Angular Geometry & Musical Harmony**

  *   **The Technique:** Predicting significant events or psychological states based on the specific angular relationships (aspects) formed between planets, particularly conjunctions (0°), oppositions (180°), and squares (90°). Kepler focused heavily on the *geometric angles* themselves.
  *   **Kepler's Defense (His Terms):**
      1.  **Physical Causation via "Species":** Kepler believed rays of influence (*species*) emanated physically from celestial bodies, particularly the Sun (the primary source), but also planets. These rays carried light, heat, and motive force – the fundamental physical energies shaping the sublunary world. Geometry dictated how these rays interacted.
      2.  **Configurational Geometry:** The angle formed by two planets relative to an observer (often Earth, or a specific point) determined how their combined *species* interacted. Specific angles created specific geometric configurations that either concentrated, conflicted, or harmonized the influx of celestial influences.
      3.  **Harmonic Analogy:** Kepler saw a profound analogy between geometry and music. The angular aspects corresponded to musical intervals derived from dividing the circle (360°). Conjunction (0°) was unison; Opposition (180°) was the octave; Square (90°) was the dissonant tritone (e.g., C to F#). **Crucially, he argued that the *dissonant* aspects (like the square/tritone) were the most potent.** Just as dissonance creates tension and demands resolution in music, these "hard" aspects concentrated conflicting rays of influence, creating tension and stress in the sublunary world, particularly within the receptive *anima mundi* (world soul) and consequently within the "temperament" (humoral balance) of individuals or the collective. This tension could manifest as storms, political upheaval, personal crisis, or intense motivation – events demanding change or resolution. He saw this as a physical-harmonic law governing how celestial forces combine.

  **Dismissed: Zodiac Sign Assignments for Personality/Events (e.g., "Mars in Leo makes one bold")**

  *   **The Technique:** Assigning specific character traits, fates, or events based solely on which constellation of the zodiac (Leo, Scorpio, etc.) a planet was located in at a given time.
  *   **Kepler's Rejection (His Terms):**
      1.  **"Empty Names" & Lack of Physical Basis:** Kepler derided the zodiac signs as mere "pictures in the sky" or "empty names" (*nomina nuda*). The constellations were arbitrary human groupings of stars, varying in size and shape, possessing no inherent physical connection to the *species* emanating from the *planets* themselves. The stars within them were fixed and distant, their individual influences negligible compared to the Sun and planets.
      2.  **Irrelevance to Configurational Geometry:** The sign a planet occupied had **no bearing** on the *angular relationship* between planets – the core mechanism Kepler defended. Mars in Leo could form a square aspect to Saturn in Scorpio *or* a trine aspect to Jupiter in Aries; the sign itself didn't change the geometry of the ray interaction. Focusing on the sign ignored the primary causal factor (the aspect angle).
      3.  **Anthropomorphic Nonsense:** Assigning personality traits like "boldness" to Mars in Leo was, for Kepler, pure anthropomorphic fantasy. It projected human qualities onto arbitrary celestial pictures with no plausible physical or harmonic link. The influence of Mars, according to Kepler, was a physical one (associated with heat, dryness, choler), affecting humors and creating tendencies towards conflict or energy. *How* that manifested depended on the *aspects* Mars formed, not which arbitrary star-picture it was superimposed upon. Attributing specific complex human behaviors directly to sign placements lacked any grounding in the physics of light, heat, motive force, or harmonic ratios.

  **The Crucial Separation in Kepler's Own Framework:**

  *   **What Separates Them:** The presence or absence of a **physically plausible mechanism based on light/heat (*species*) and geometric/harmonic law.**
  *   **Aspects (Defended):** Operate via the demonstrable physics of light rays intersecting at specific angles, analogous to the universal mathematical laws of harmony governing tension and resolution. The angle itself is the causal agent, modifying the combined influence of planetary energies.
  *   **Zodiac Signs (Dismissed):** Lack any connection to the physics of *species* or harmonic law. They are arbitrary human constructs (the constellations) irrelevant to the geometric angles between planets. Attributing effects to them relies on symbolic association and anthropomorphism, not physical causation or mathematical harmony.

  **In essence:** Kepler defended astrology only where he could map it onto his understanding of physics (celestial light/heat/motion) and universal mathematics (geometry and harmony). Planetary aspects passed this test; zodiac sign interpretations emphatically did not. He saw the latter as the superstitious dross obscuring the potentially sound (to him) core principle of configurational geometry. His continued practice (especially prognostications) often involved a pragmatic blend, but his theoretical writings consistently draw this sharp line based on physical and harmonic plausibility.
