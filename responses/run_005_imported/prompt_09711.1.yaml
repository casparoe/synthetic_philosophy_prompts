  The memo must recommend a specific rollover limit (or none), trigger for installment plans, address existing loans, set a compliance timeline, and take the second camp's arguments seriously without dismissing them as industry cover. 

  I need to balance consumer protection with respect for borrower choice. The second camp's point about real-world trade-offs is valid; forcing immediate repayment could push borrowers to riskier options. But the data indicates structural harm from repeated rollovers. A compromise like allowing two rollovers before an installment plan might work. That gives flexibility initially but prevents endless cycles.

  For existing loans, applying the cap prospectively avoids retroactive issues but might delay protections. A 90-day compliance timeline gives lenders time to adjust. Also, requiring clear disclosures about rollover limits upfront empowers borrowers with information, addressing both camps' concerns.

  The memo should acknowledge the second camp's argument that borrowers make reasoned choices based on available options. Highlighting the installment plan as a better alternative respects their autonomy while preventing exploitation. Avoiding terms like "predatory" keeps the tone neutral and focused on structure rather than intent.

  Need to ensure the recommendation is data-driven, referencing the disproportionate revenue from heavy rollers. Also, the installment plan should be truly no-fee to avoid loopholes. Including a review clause allows future adjustments based on new data, showing openness to evidence.

  Check statutory authority: the board can prohibit abusive practices. Defining "abusive" as exploiting the gap between short-term relief and long-term harm aligns with the first camp's view. But framing it as structural rather than questioning borrower judgment respects the second camp's perspective.

  Finally, the memo structure should present both sides fairly, then justify the recommendation with data and practical solutions. Emphasizing that the rule preserves access while mitigating harm could bridge the divide. Making sure the language is clear and decisive for the vote.
answer: |-
  ## MEMORANDUM  
  **To:** Members, Consumer-Lending Oversight Board  
  **From:** [Your Name/Board Chair]  
  **Date:** October 26, 2023  
  **Subject:** Proposed Rule: Limitations on Short-Term Loan Rollovers and Mandatory Installment Plan Trigger  

  ### I. RECOMMENDATION
  After thorough review of complaint data, lending patterns, borrower exit interviews, and statutory authority, the Board **recommends adoption of a rule capping rollovers of any single short-term loan at two (2) consecutive instances**. Upon the borrower’s request for a third rollover of the *same* loan principal, the lender **must** offer the borrower a **no-additional-fee installment plan** with substantially equal payments over a minimum of four (4) payment periods (e.g., 8 weeks for biweekly loans), designed to fully amortize the outstanding principal. This rule balances consumer protection against demonstrable harm with respect for borrower autonomy and necessity.  

  ### II. RATIONALE & ANALYSIS
  The Board acknowledges the compelling arguments from both perspectives and evaluates them against our statutory mandate to prohibit "unfair, deceptive, or abusive" practices, empirical data, and the realities faced by borrowers.

  *   **Addressing the First Camp (Harm & Structural Exploitation):**  
      The data is unambiguous: a minority of borrowers trapped in long rollover sequences generate a grossly disproportionate share of fee revenue, often paying cumulative fees exceeding 200-300% of principal. This indicates a structural flaw where lender profitability becomes misaligned with sustainable borrower outcomes. The core loan product (principal + 2-week fee) transforms into a long-term, high-cost debt trap through serial deferral. This practice exploits the gap between a borrower’s immediate, urgent need to avoid default (e.g., overdraft, shut-off) and the long-term outcome they would likely choose if committing upfront to a repayment schedule resolving the debt. The Board finds this repeated deferral mechanism, when unlimited, constitutes an **"abusive" practice** under our statute. It takes unreasonable advantage of:  
      (a) The borrower’s inability to protect their own interests in selecting or using the product *long-term*;  
      (b) The gap between the borrower’s immediate need (avoid crisis now) and their likely preferred outcome (resolve debt affordably).

  *   **Addressing the Second Camp (Autonomy & Necessity) SERIOUSLY ON ITS OWN TERMS:**  
      The Board takes seriously the arguments regarding borrower autonomy and necessity. Exit interviews confirm that borrowers in these sequences *genuinely perceive* the immediate rollover option as preferable to the acute harms of default, overdraft, shut-off, or unlicensed loans. Their repeated choice to roll over reflects a *reasoned assessment* of their *available, immediate alternatives* in a moment of financial distress. **This is not merely industry cover; it reflects real-world constraints.** Overriding this judgment requires compelling evidence of systemic harm outweighing the immediate benefit and a less restrictive alternative that preserves essential access.

      *   **Our Rule's Response:**  
          The proposed rule *preserves* the rollover option for borrowers needing short-term flexibility (up to two extensions). It acknowledges the legitimate need for deferral in the face of unexpected setbacks. Crucially, it **provides a superior alternative at the point of the third rollover request**: the mandatory no-fee installment plan. This directly addresses the core concern of the second camp. Instead of forcing immediate repayment (which could trigger the very harms borrowers fear) or cutting off access, it offers a *structured, affordable path out of debt* while keeping the borrower within the licensed system. This respects the borrower’s need for continued access to a legal solution while fundamentally altering the harmful dynamic of perpetual fee payments without principal reduction. The installment plan *becomes* the new, better "available option" at the critical juncture.

  ### III. SPECIFIC RULE PROVISIONS
  1.  **Rollover Limit:** A maximum of two (2) consecutive rollovers (extensions) are permitted for any single short-term loan. Each rollover must involve the same principal amount and require a new fee payment by the borrower.
  2.  **Mandatory Installment Plan Trigger:** Upon a borrower’s request or indication of inability to repay the outstanding balance (principal + any accrued fees) at the maturity date *following the second consecutive rollover*, the lender MUST offer the borrower a no-additional-fee installment plan.
  3.  **Installment Plan Requirements:**
      *   No new fees (beyond the original fee and two rollover fees already paid).
      *   Minimum of four (4) substantially equal payments.
      *   Payments scheduled over a period reflecting the original loan term (e.g., biweekly payments for an original 2-week loan).
      *   Designed to fully amortize the outstanding principal balance by the final payment.
      *   Borrower must be clearly informed of the payment schedule and amount in writing before accepting.
  4.  **Application to Existing Loans (Grandfathering):** The rollover limit applies **prospectively** only. Loans already in a rollover sequence upon the rule's effective date will be subject to the limit counting rollovers occurring *after* the effective date. For example:
      *   A loan on its 3rd rollover when the rule takes effect could have *one more* rollover (if requested) before triggering the installment plan requirement at the *next* maturity date.
      *   A loan on its 1st rollover when the rule takes effect could have *one additional* rollover before triggering the installment plan.
      *   This avoids retroactive application and operational chaos while ensuring all loans move towards resolution under the new framework.
  5.  **Compliance Timeline:**
      *   **Effective Date:** 90 days after final rule publication.
      *   **Lender Requirements:** Lenders must have systems, disclosures, and procedures updated to implement the rollover tracking, installment plan offering, and new disclosures by the Effective Date.
      *   **Disclosures:** Lenders must provide clear, conspicuous disclosures at loan origination and before each rollover explaining: the 2-rollover limit; the requirement for a no-fee installment plan upon a 3rd extension request; and an estimate of the installment payment amount if applicable.

  ### IV. CONCLUSION
  This rule directly targets the documented harm of perpetual rollover sequences that extract excessive fees from vulnerable borrowers while respecting the legitimate, immediate need for flexibility that drives borrower choice. By mandating a structured, no-fee exit path at the critical third rollover juncture, it provides a demonstrably better alternative to both endless fees *and* the feared consequences of default. It preserves access to short-term credit for necessary deferrals while ensuring the product functions as a bridge to resolution, not a debt trap. The prospective application and 90-day timeline provide necessary operational flexibility for lenders. This approach fulfills our mandate to prohibit abusive practices grounded in empirical evidence, while taking seriously the complex realities and expressed preferences of borrowers themselves.

  **VOTE:** Adoption of the Proposed Rule Governing Loan Rollovers as detailed above.

  ---

  **Key Strengths of this Approach:**

  *   **Data-Driven:** Directly addresses the disproportionate harm revealed by the revenue data.
  *   **Balanced:** Preserves initial rollover flexibility (acknowledging necessity) but forces a structural change at the point where harm becomes systemic.
  *   **Respects Autonomy (Second Camp):** Does *not* eliminate choice; *replaces* a harmful choice (another high-fee rollover) with a demonstrably better one (a structured, no-fee repayment plan) at the critical moment. Borrowers can still *choose* the installment plan.
  *   **Defines "Abusive":** Provides a clear, evidence-based definition focused on exploiting the gap between immediate necessity and long-term resolution.
  *   **Practical Implementation:** Clear triggers, grandfathering for existing loans, and a reasonable compliance timeline.
  *   **Focuses on Outcome:** Shifts the product from fee dependency to principal resolution.
  *   **Avoids Industry Demonization:** Framed around structural incentives and borrower outcomes, not lender intent, while acknowledging the validity of borrower perspectives on necessity.
