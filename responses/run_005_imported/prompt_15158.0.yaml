answer: |-
  Here’s a toast that threads the needle—grounded in EA/philosophy but warm, funny, and accessible. It clocks in at ~4 minutes when delivered with natural pauses, and lands a laugh early to disarm the room:

  ---

  **(Clink glass gently, warm smile)**  

  "Hi everyone. For those who don’t know me, I’m [Your Name], Priya’s friend. And like many of you, I’ve known Priya and [Partner’s Name] long enough to know… this wedding is *peak* them. **(Light laugh)** I mean, they met at an 80,000 Hours meetup! Most people find love at a bar or a bookstore. These two found it while optimizing their career paths for maximum impact. **(Slightly bigger laugh, especially from EA side)**  

  Now, I’ll admit, when I heard about this beautiful, thoughtful, *decidedly non-elopement* wedding… a little voice in my head—one that sounds suspiciously like a philosophy TA—whispered: *‘But the demandingness objection! The cost-per-life-saved! Is this utility monster behavior?!’* **(Knowing chuckle from EA tables; polite confusion but amused tolerance from aunts/uncles)**  

  And look, the aunts and uncles are thinking, ‘What on earth is this kid talking about?’ Don’t worry, it’s basically just the grown-up version of asking why you’d buy a fancy cupcake when you could donate that dollar to charity. **(Gentle, inclusive laugh)**  

  But here’s the thing Priya and [Partner’s Name] understand, deeply: **Love isn’t a bug in the system of doing good. It’s the operating system.**  

  Think about it. Trying to save the world without letting yourself love specific people deeply is like… trying to breathe in space without a helmet. Sure, space is vast and important! But you need oxygen *right here* to function. **(Nods from philosophy tables)** The best kind of ‘impartial good’ doesn’t come from people who’ve flattened themselves into emotionless calculators. It comes from people whose hearts are full, whose wells aren’t dry.  

  Priya and [Partner], you didn’t just find a life partner today. You built a **mutual aid society for the soul.** A tiny, two-person sanctuary where you refuel each other’s compassion, sharpen each other’s minds, and remind each other *why* the distant suffering matters – because you practice caring so fiercely, right here, right now.  

  This celebration? It’s not *instead* of their values. It’s fuel *for* them. It’s gathering the people who’ve shaped them, who support them, who remind them they’re human. Because let’s be real: tackling the world’s toughest problems is a marathon run in the dark. You need pit crews! You need cheerleaders! You need teammates who hand you an energy gel and say, ‘Keep going, I’ve got your back.’ That’s what this community is. That’s what *this marriage* is.  

  So yes, they *could* have eloped and sent the difference to GiveWell. But the deeper truth is: **Loving one person this much doesn’t shrink their capacity to care about the world. It anchors it.** It gives their compassion weight and texture and staying power. It’s the foundation that lets them look outwards, year after year, with clear eyes and a full heart.  

  Priya, [Partner] – you prove that the most sophisticated philosophy isn’t found in dusty books. It’s lived. It’s choosing each other, fiercely and joyfully, knowing that this love isn’t a distraction from making the world better. **It’s the very thing that makes ‘better’ possible.**  

  So let’s raise a glass: To Priya and [Partner]! May your marriage be a relentless source of joy, strength, and stubborn optimism. May you continue to inspire us *all* to love deeply, think clearly, and act boldly – both in your little corner of the universe, and far, far beyond it. Cheers!"  

  **(Big cheers, clinking glasses)**  

  ---

  **Why This Works:**

  1.  **Acknowledges the Tension Head-On:** Uses humor ("utility monster behavior!", "philosophy TA voice") to disarm the EA crowd early, showing you see it too.
  2.  **Accessible Explanations:** Translates complex ideas ("demandingness objection") into simple analogies (fancy cupcake vs. charity, breathing in space). Aunts understand the *concept* without needing the jargon.
  3.  **Leans on Real Philosophy (Subtly):**
      *   **Scheffler's Agent-Centered Prerogatives:** The "oxygen right here" metaphor embodies the need for personal commitments to function as moral agents.
      *   **Railton's Sophisticated Consequentialism:** Framing the wedding/love as *instrumental* to their long-term impact ("fuel *for* their values," "foundation that lets them look outwards") is pure Railton. It shows the *strategic* value of personal goods.
  4.  **Warmth & Celebration is Central:** The core message is profoundly positive: love empowers their altruism. "Sanctuary," "Mutual aid society for the soul," "Pit crews," "Anchor" – all deeply warm, relational terms.
  5.  **The Genuine Laugh:** The "80,000 Hours meetup" and "utility monster" lines are almost guaranteed to land with the EA half and sound amusingly quirky to the non-EA half. The "fancy cupcake" analogy gets everyone on the same page with a chuckle.
  6.  **Resolves, Doesn't Dodge:** Doesn't pretend consequentialism doesn't apply ("It’s not *instead* of their values. It’s fuel *for* them."). Offers a robust justification rooted in capacity-building and sustainability.
  7.  **Unifying Finish:** The final toast connects their personal love to their broader impact, celebrating both equally and leaving everyone feeling uplifted.

  **Delivery Tips:**

  *   **Pacing:** Hit the punchlines ("optimizing career paths," "utility monster," "fancy cupcake") with a slight pause for laughs. Let the deeper points ("Love isn't a bug...", "Loving one person... anchors it") land with sincerity.
  *   **Tone:** Warm, slightly self-deprecating (about the "philosophy TA" voice), and ultimately celebratory. Smile genuinely at Priya and their partner during the final lines.
  *   **Eye Contact:** Sweep the room, linger briefly on the EA tables during the philosophy bits, and include the aunts/uncles warmly during the analogies and the toast.

  This toast honors the couple's unique worldview while delivering universal warmth and a compelling answer to the unspoken question in the room. Break a leg!
