  First, I need to recall Reid's broader epistemology. He distinguishes sensation from perception—the former being raw feels, the latter involving object-directed intentionality. This distinction is crucial because Reid locates the possibility of error in sensation, not in perceptual belief itself. When someone sees a bent oar, the perceptual belief ("there's a straight oar") remains correct; the error arises from misinterpreting sensory cues. 

  The user's concern about infallibility is understandable but might stem from conflating perception with sensation. Reid's "irresistible conviction" applies only to the existence and core properties of objects, not to sensory appearances. So for the bent oar case, the perceiver still has an immediate belief about the oar's existence and its straightness (as a material object), while the bending is a sensory artifact. 

  Hallucinations are trickier. Reid would likely argue that in non-veridical cases, the subject isn't actually perceiving but rather experiencing a quasi-perceptual state. This resembles modern disjunctivism's "no common factor" approach, though Reid's version is more nuanced—he'd grant shared sensory elements but insist perceptual beliefs only occur in veridical cases. 

