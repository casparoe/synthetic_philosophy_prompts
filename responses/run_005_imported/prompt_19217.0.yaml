  First, I need to address the core argument: infinities nullifying finite actions. The friend's analogy with adding $5 to infinite money makes sense mathematically, but ethics isn't math. I recall that in set theory, adding a finite set to an infinite one doesn't change cardinality, but moral value isn't about counting. It's about impact on individuals. 

