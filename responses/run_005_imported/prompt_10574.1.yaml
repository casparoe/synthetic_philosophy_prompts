  In the section of "Computing Machinery and Intelligence" (1950) that Turing titles "The Argument from Extrasensory Perception," he takes the topic far more seriously than most readers expect: rather than dismissing ESP out of hand, he treats the statistical evidence for telepathy as a genuine complication for the imitation game, going so far as to suggest running the test under conditions designed to rule out telepathy between the human participants. I'm a PhD student in the history and philosophy of science working on how mid-century researchers handled anomalous statistical results, and a question from my reading group has stuck with me.

  Suppose Turing had lived to see the 2011 controversy over Daryl Bem's "Feeling the Future," which used ordinary null-hypothesis significance testing to report evidence for precognition, and the methodological backlash that followed—especially Wagenmakers and colleagues' Bayesian reanalysis arguing the evidence was much weaker than Bem's p-values suggested, and the broader turn toward preregistration that the episode helped provoke in psychology. Based on the specific reasoning Turing actually used about ESP in 1950, rather than his general reputation for rigor, which side of that dispute do you think he would have found more persuasive, and would the episode have shaken the confidence he placed in the statistical case for telepathy? Please commit to a specific answer and defend it, rather than cataloguing considerations on both sides.
