answer: |-
  That's a brilliantly framed philosophical dilemma! You're recalling **Ruth Chang's work on "parity"** as a fourth comparative relation beyond "better than," "worse than," and "equally good." Here's the breakdown of her argument and why "on a par" (or "roughly comparable") is argued to be distinct from mere vagueness or imprecision, especially relevant to your friend's job offers.

  **The Core Argument: Why We Need a Fourth Relation**

  1.  **The Failure of the Trichotomy:** Traditional value theory assumes any two options (A and B) must satisfy one of three relations:
      *   A is better than B
      *   B is better than A
      *   A and B are equally good.
      *   *(Incomparability is sometimes considered a fourth, but Chang argues it's rare and different from parity).*

  2.  **The Problem with "Equally Good" for Radically Different Options:** For choices like your friend's (High Pay/Bad City vs. Lower Pay/Good City), declaring them "equally good" often feels *wrong*. Why?
      *   **Different Kinds of Value:** The goods involved (money, career advancement vs. well-being, community, personal fulfillment) seem fundamentally different in kind. Adding more money doesn't *directly* subtract from happiness, nor vice-versa. They aren't easily traded on a single scale.
      *   **No Common Measure:** There's no obvious "currency" (like utils) to precisely convert happiness units into salary units and vice-versa to establish exact equality.
      *   **The "Slightly Better" Test (The Crucial Move):** This is where Chang's key insight lies. Imagine taking the "Lower Pay/Good City" job and making it *slightly better* in a way relevant to its core value: give her a *tiny* bit more pay (say $100/year). Does this *now* make it clearly *better than* the "High Pay/Bad City" job? Probably not. The overwhelming negatives of the bad city likely still outweigh this tiny improvement. Now imagine improving it *a lot* (double the lower salary). Now it probably *is* clearly better. The critical point is the *transition*:
          *   The original Lower Pay/Good City job isn't *worse* than High Pay/Bad City (she prefers it!).
          *   It isn't *better* (she acknowledges the massive salary difference).
          *   It isn't *equally good* (because a tiny improvement doesn't tip the scales).
          *   **Therefore, the trichotomy fails.** The tiny improvement creates a new option that is *still not better*, yet a large improvement *does* make it better. This suggests the original options occupy a unique comparative space.

  3.  **Introducing "On a Par":** Chang argues this is evidence for a fourth relation: **Parity**.
      *   A and B are **on a par** if:
          *   Neither is better than the other.
          *   They are not equally good.
          *   They are comparable (we *can* reason about them; it's not like comparing a job offer to the taste of cinnamon).
      *   **Key Features of Parity:**
          *   **Different Kinds of Value:** The options realize different *types* of goods that resist precise conversion.
          *   **Small Improvement Insensitivity:** A small improvement to one option doesn't necessarily make it better than the other.
          *   **Possible Rational Choice:** Even though neither is better, worse, or equal, it can still be *rational* to choose one over the other based on personal commitments, projects, or what one "cares about" more deeply. This is where the *will* comes in – you *create* the reason through your choice.

  **Addressing the Obvious Comeback: "Isn't 'On a Par' Just Imprecise Equality?"**

  This is the most common and powerful challenge. Chang argues **NO, it's fundamentally different**. Here's why:

  1.  **The Nature of Imprecision:**
      *   Imprecise equality suggests there *is* a precise fact of the matter about which is better or that they *are* exactly equal, but our epistemic limitations (lack of information, measurement tools, cognitive capacity) prevent us from accessing it. We *could*, in principle, get better tools/info and discover the true ranking or exact equality.
      *   Example: Measuring two objects with a ruler marked only in inches; they look the same length. With a micrometer, we *might* find one is microscopically longer. The imprecision is epistemic (about our knowledge).

  2.  **Why Parity is Ontological, Not Epistemic:**
      *   Chang argues that for options on a par, the lack of a determinate better/worse/equal relation isn't *just* due to our limitations. It's a feature of the *values themselves*.
      *   The values involved (like career achievement vs. personal well-being) are **radically heterogeneous**. They belong to different "domains of value" that don't share a common underlying scale *in principle*, not just in practice.
      *   **The "Slightly Better" Test Revisited:** This test is key. If the options were merely imprecisely equal, then *any* improvement, no matter how small, *should* tip the scales and make the improved option strictly better. But in the job example, a *small* improvement to the "happy city" salary *doesn't* make it better – the bad city's negatives still dominate. Only a *large* improvement does. This resistance to small changes suggests the values aren't even *on the same scale* in a way that allows for precise equality to be the underlying truth. The gap isn't just too small to measure; it's a gap *in kind*.

  3.  **The Implication for Choice:**
      *   **Imprecise Equality:** If the options are imprecisely equal, the rational choice is indifference; flipping a coin is fine. There *is* a fact of the matter we just can't see.
      *   **Parity:** Because the options are on a par, neither is dictated by reason alone. A coin flip feels inadequate because the *kinds* of value are so different and meaningful. Choosing requires an exercise of the **will** – committing to one set of values over the other. Your choice *creates* the reason ("I chose the happy city because I commit to prioritizing well-being over maximal income right now"). This commitment makes the choice rational *after the fact*, even if reason alone didn't dictate it beforehand.

  **What This Means for Your Friend's Argument:**

  *   **You (Incommensurability/Parity):** You are essentially arguing for something like parity (or perhaps incomparability). You're saying the values are so different that there's no single rational scale to declare one *objectively better overall*. Reason runs out.
  *   **Your Friend (Hidden Fact):** She believes in a robust trichotomy. She thinks there *must* be a hidden fact (even if unknowable) about which is better, implying the values *are* ultimately commensurable on a single scale, even if we can't access the precise calculation.

  **Chang's Answer to Your Friend:** The "slightly better" test suggests the hidden fact view is wrong. If there were a precise fact (or precise equality), a tiny improvement *should* change the ranking if it exists or reveal the inequality. The fact that it *doesn't* in cases like the job choice indicates the relationship isn't one of hidden better/worse/equal, but something else entirely – parity. Reason doesn't find a hidden fact; reason reveals that *no such single fact exists* because the values are different in kind. The choice becomes about commitment, not discovery.

  **Conclusion:**

  Chang argues that "on a par" is **not** just a label for imprecise equality. Imprecise equality is an *epistemic* state – we don't *know* the precise truth. Parity is an *ontological* state – the values themselves resist the traditional trichotomy. The "slightly better" test is the key evidence distinguishing them. For your friend's agonizing choice, recognizing parity can be liberating: it means neither job is *rationally superior*, but she can still make a *rational choice* by committing to the values one job represents over the other. The argument isn't a cop-out; it's a more nuanced picture of how complex values interact.
