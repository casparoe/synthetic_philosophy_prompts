  My friend's been agonizing over two job offers -- one's way more money but in a city she'd hate, the other pays less but she'd actually be happy -- and last night we ended up arguing for like two hours about whether the offers are even comparable in the first place. I said they're just incommensurable, theres no rational way to rank them, full stop. She said thats a cop out, that somewhere under all the uncertainty there's a real fact about which one is better, we just can't measure it precisely enough. I vaguely remembered reading that some philosopher argues there's a fourth option besides better/worse/equally good for situations like this -- something about making one option slightly better and seeing what that does to the comparison -- but I couldn't reconstruct the actual argument for why you'd need that instead of just saying we're bad at comparing or the ranking is vague. Can you lay out that argument properly, and then tell me whether the obvious comeback -- that 'on a par' is just a fancy label for imprecise equality, not a genuinely new relation -- actually has a good answer?
