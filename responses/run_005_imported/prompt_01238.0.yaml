prompt: |-
  I've been reading rationalist blogs and forums (LessWrong, the old Overcoming Bias archives, and so on) for years, and one piece of Bayesian folklore that gets invoked constantly in discussions of rationality is I.J. Good's 1967 theorem on the value of information — the same I.J. Good who worked with Turing at Bletchley Park. The theorem says that for an idealized rational agent, the expected utility of costlessly observing evidence before choosing an action is never lower than the expected utility of choosing without it, and is strictly higher whenever there is some chance the evidence would change what you'd do. I've always taken this as more or less settling the question of whether ignorance can be instrumentally rational: turning down free, decision-relevant evidence looks like a fairly direct violation of Bayesian rationality, whatever comfort it might buy you.

  This came up concretely a few weeks ago. A close friend has a parent with Huntington's disease, which puts her at 50% risk of carrying the mutation herself. Her hospital offers the predictive genetic test free of charge as part of a research program, and it would tell her, with certainty, whether she carries it. She has already ruled out having biological children regardless of the result, and there is no treatment or preventive regimen for asymptomatic carriers whose value would depend on knowing her status — yet she has firmly declined to be tested, saying she would rather not carry around either the dread of a positive result or the strange, unearned relief of a negative one. When I brought up Good's theorem to point out that she was leaving costless expected value on the table, she said I was treating her life like a decision-theory homework problem.

  I would genuinely like to know who is right here. Is declining a free, perfectly informative test in a case like hers actually in tension with Good's theorem, or am I smuggling in some assumption of the theorem — about what counts as "free," or about what the relevant decision problem even is — that does not hold once nothing hinges on the answer? I would like to understand exactly where, if anywhere, my reasoning breaks down before I raise this with her again.
reasoning: |-
  Okay, the user is grappling with a deep question about rational decision-making versus personal emotional well-being. They've applied Good's theorem—which states that free information should never harm expected utility—to their friend's refusal of a genetic test for Huntington's disease. But the friend declined despite no medical implications, prioritizing emotional peace over knowledge. 

  The user seems genuinely conflicted. On one hand, they're steeped in rationalist tradition where turning down costless information feels like an obvious error. On the other, their friend's reaction hints this might be reductive. I notice three layers here: 

  First, the technical layer—Good's theorem assumes utility functions only care about action outcomes, but humans derive utility from cognitive states (dread/relief). The hospital scenario has no action to change, so the theorem's "decision relevance" condition fails. 

  Second, the emotional layer—the user might feel frustrated that rationality "should" win but didn't. Their phrasing ("smuggling in assumptions") suggests healthy self-doubt. They're wisely seeking clarity before revisiting the conversation. 

  Third, the relational layer—calling this a "homework problem" was the friend's boundary-setting. The user needs to recognize that wielding theorems can feel invalidating when someone's confronting mortality. 

  The core tension is between normative rationality (how agents *should* act) and descriptive reality (how humans *do* act). Good's theorem is prescriptive for idealized agents; humans have endogenous preferences about their own mental states. 

  I should emphasize that the theorem holds mathematically, but its assumptions don't capture the friend's utilities. Her "decision problem" includes living with uncertainty versus certainty—which are different experiential states. The costlessness of the test is also misleading; while monetarily free, it imposes psychological costs the theorem ignores. 

  Perhaps most importantly: the user's desire to "understand where reasoning breaks down" is admirable, but the real need might be accepting that some choices prioritize non-instrumental goods (peace of mind) over optimization. That doesn't make them irrational—it redefines rationality contextually.
answer: |-
  You've hit on a profound tension between formal decision theory and human lived experience. Good's theorem is mathematically correct under its assumptions, but its application to your friend's situation breaks down in subtle ways. Let's dissect this step-by-step:

  ### 1. **Where Good's Theorem Applies Directly**
     - **Core Truth**: For an agent with coherent preferences (utility function) evaluating actions with *consequential outcomes*, free information never reduces expected utility and strictly increases it if it could change the optimal action.
     - **Requires Decision-Relevance**: The theorem assumes the evidence could influence a *material action* that affects outcomes valued by the utility function. If no action changes, the value is zero.

  ### 2. **Where Your Friend's Case Deviates**
     - **No Actionable Consequences**:  
       You note there are no treatment options or reproductive decisions at stake. With no actions to optimize, the theorem's mechanism (evidence → better action → higher utility) doesn't engage. The test outcome is *epistemically* relevant but *instrumentally* inert.
     
     - **Utility Includes Psychological States**:  
       Your friend's utility function explicitly values *mental states* ("dread," "unearned relief"). These are valid utility components per decision theory—utilities can encompass *anything* an agent values. The test transforms uncertain psychological burden ("50% sword of Damocles") into certain states:
       - **Positive Result**: Certain dread (utility: very low)
       - **Negative Result**: "Unearned relief" (she values this less than if she'd earned it)
       - **Status Quo**: Uncertainty (utility: higher than dread, possibly higher than "unearned relief")

     - **Information Isn't Costless Psychologically**:  
       While monetarily free, the test imposes psychological costs: the irreversible destruction of hope/ambiguity. Good's "costless" assumes only monetary/effort costs, not endogenous utility impacts.

  ### 3. **The Hidden Assumption in Your Argument**
     You assumed her utility depends *only* on physical outcomes (health, wealth, etc.), ignoring that *knowledge itself* is a state affecting utility. But her preferences reveal:
     - Utility(Uncertainty) > Utility(Knows Positive)  
     - Utility(Uncertainty) ≥ Utility(Knows Negative)  
     ...making ignorance *instrumentally rational* given her actual preferences.

  ### 4. **A Decision-Theoretic Justification for Ignorance**
     Formalizing her perspective:
     - **States**: Carries mutation (C) or not (¬C)  
     - **Actions**: Test (T) or Not Test (NT)  
     - **Utilities**:  
       - U(NT, C) = U(living with 50% risk)  
       - U(NT, ¬C) = U(living with 50% risk)  
       - U(T, C) = U(knowing C is true)  
       - U(T, ¬C) = U(knowing ¬C is true)  
     
     Her claim: U(NT) = 0.5 * U(NT,C) + 0.5 * U(NT,¬C) > max[ U(T,C), U(T,¬C) ]  
     *This is consistent with rationality if psychological utilities align this way.*

  ### 5. **When Good's Theorem Would Apply to Her**
     If she faced decisions like:
     - Purchasing long-term disability insurance (pre-test pricing vs. post-test risk-adjusted pricing)  
     - Career choices involving physical risk  
     - Lifestyle investments with long payoffs  
     ...*then* declining free information could leave instrumental value on the table. But absent such actions, the theorem is inert.

  ### 6. **Broader Philosophical Tension**
     - **Bayesian "Ought" vs. Human "Is"**: Good's theorem prescribes what *idealized agents* should do. Humans aren't idealized. We have:
       - **Ambiguity aversion**: Uncertainty may feel worse than equivalent probabilistic risk.
       - **Anticipatory emotions**: Dread/relief have intrinsic (dis)utility.
       - **Epistemic constraints**: We can't arbitrarily "update" our emotional state via Bayes' theorem.
     
     - **Two Kinds of Rationality**:  
       - *Instrumental*: Maximizing goal achievement (Good's domain).  
       - *Epistemic*: Pursuing truth/understanding.  
       Her choice prioritizes instrumental psychological well-being over epistemic rationality—a coherent preference.

  ### Conclusion: Who Is Right?
  - **You** are correct that *if* her utility function cared only about physical outcomes and *if* actions were available, Good's theorem would recommend testing.  
  - **She** is correct that, given her actual preferences (valuing psychological states) and lack of actions, declining is instrumentally rational *for her*. Her rejection of the "homework problem" framing is astute: human utilities are richer than textbook models.

  ### How to Proceed
  1. **Acknowledge her rationality**: "I see now that avoiding dread/relief *is* a rational priority for you—it's not about ignoring logic, but defining what matters."  
  2. **Clarify scope**: "Good's theorem applies when knowledge changes actions. Since you've said this won't change any decisions, it doesn't criticize your choice."  
  3. **Respect autonomy**: Decision theory can inform, not prescribe, personal tradeoffs between knowledge and well-being. Her values are sovereign.  

  This isn't a failure of rationality—it's a testament to how human values transcend abstract optimization. Her choice reflects a coherent optimization of *her* utility function, precisely what decision theory demands.
