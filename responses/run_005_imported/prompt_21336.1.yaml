  Here is a eulogy crafted to honor your father's specific wishes, resonate with both audiences, and focus on genuine human connection over philosophical abstraction. It's designed for about 5-6 minutes, blending personal warmth, his core philosophical conviction lived out, and raw emotion.

  **(Begin by taking a steadying breath, looking out at the gathering)**

  Good morning. For those who don’t know me, I’m [Your Name], [Dad's Name]’s son. Thank you all for being here. For the family who loved him as a brother, uncle, father, grandfather; for the friends who shared decades of laughter and argument; for the colleagues and students whose lives he touched deeply in that classroom for 38 years... thank you. We’re all united today by a profound sense of loss, and by the complex, wonderful man we knew.

  Dad left us suddenly last Tuesday. The shock is still sharp, the absence vast. And in the quiet moments since, amidst the tears and the memories crashing over me, I keep hearing his voice. Not just the warm, rumbling sound of it, but the *substance* of what he believed. Because Dad wasn’t just a philosopher; he lived his philosophy. Especially one idea that became a kind of north star for him, born from decades wrestling with a paper called "Freedom and Resentment" by P.F. Strawson.

  Some of you in this room – maybe a few too many! – know exactly what I’m talking about. You’ve heard the Thanksgiving rants, the faculty party discourses. For the rest of the family, here’s the shortest version I can manage: Dad passionately believed that the big, cosmic question of whether we’re *ultimately* responsible for who we are – Galen Strawson’s powerful argument that we can’t be – doesn’t actually change a single thing about how we *live* with each other. He thought P.F. Strawson got it exactly right: regardless of those deep, maybe unanswerable questions, resentment when someone hurts us, and gratitude when someone helps us… these aren’t mistakes. They are the very stuff of being human together. They are the appropriate responses, full stop.

  His conclusion, honed over 40 years? That nobody *deserves* credit or blame in some grand cosmic accounting sense. And crucially, he believed that *fact* shouldn’t – and couldn’t – make us cold or detached. It shouldn't flatten the landscape of human feeling.

  He was utterly clear about this. He didn’t want his life, or his death, framed by what he called "smuggling desert back in." No talk of him "earning his rest" or "getting the life he deserved" because he was good. He’d have hated that. He saw it as a fundamental misunderstanding.

  But equally, he railed against the opposite error: the "objective attitude." He didn’t want to be reduced to just a fascinating biological system that ceased functioning. He didn’t want clinical detachment. He believed that attitude, applied to the people we love, was a kind of violence against the reality of relationship.

  What he wanted, fiercely, was the messy, beautiful, painful reality of human connection. He wanted the full weight of our feelings. He wanted us to be *actually angry* at him for the times he was impatient, or stubborn, or let us down. He wanted us to be *actually grateful* for his fierce loyalty, his unexpected kindnesses, his brilliant mind that could illuminate a problem or a sunset with equal clarity. And right now, above all, he wanted us to be *actually grieving*. Not philosophically. Not theoretically. But with hearts that feel cracked open by his absence.

  And that, perhaps, is the greatest testament to his belief. Look around this room. Feel the ache. The tears are real. The gratitude for his presence in our lives is real. The sharp edges of regret for things left unsaid or unresolved? Those are real too. We are not balancing cosmic ledgers today. We are not observing a fascinating case study. We are people who loved a specific, complicated, irreplaceable man, and we are shattered that he’s gone.

  He taught us to question everything, yes. But more profoundly, he lived a life that insisted on the irreducible reality of *this* – *this* feeling, *this* connection, *this* shared grief. He showed us that deep intellectual honesty about the universe doesn't require us to step back from the messy, emotional heart of being human. It demands we dive in deeper.

  He was my Dad. He drove me crazy sometimes. He made me laugh until I cried more times than I can count. He taught me how to think, but more importantly, he showed me how to *feel* without apology. He was there. Fully, flawedly, wonderfully present in the relationships that mattered.

  So, Dad, here it is, without the hedge you hated:
  We are furious that you left so soon. We are desperately grateful for every single moment we had with you. And we are heartbroken. Profoundly, simply, humanly heartbroken.

  Thank you for teaching us that this – this raw, unvarnished love and grief – is the only response that truly makes sense.

  Goodbye, Dad. We miss you terribly.

  **(Step back, take a moment)**

  **Why this works:**

  1.  **Honors His Wishes Explicitly:** Directly addresses his prohibition against "desert" language ("earned his rest," "deserved the life") and the "objective attitude." Explains *why* he rejected both, in his own terms.
  2.  **Makes the Philosophy Accessible:** Uses plain language ("cosmic accounting," "messy, beautiful, painful reality," "deep intellectual honesty") to convey the core Strawson argument and his interpretation *without* jargon or lecture. Family gets the gist; academics recognize the accurate representation.
  3.  **Centers Genuine Emotion:** The core message *is* the permission and insistence on real anger, real gratitude, real grief. The language is emotional ("cracked open," "shattered," "heartbroken," "furious," "desperately grateful").
  4.  **Connects Philosophy to Lived Experience:** Shows how his belief wasn't abstract but guided how he *wanted to be related to* in life and death. The eulogy itself *demonstrates* the attitude he advocated.
  5.  **Personal & Specific:** Mentions his voice, Thanksgiving rants, his presence, his flaws, his loyalty, his humor. Grounds the philosophy in the man everyone knew.
  6.  **Balances Audiences:**
      *   **Academics:** Hear a faithful, non-trivialized summary of his lifelong intellectual engagement. They'll recognize the nuance ("not a rebuttal... a case that the question doesn't bear on..."). The "faculty party" nod is for them.
      *   **Family:** Hear love, loss, and a clear message about feeling what they feel without guilt or needing to intellectualize it. The philosophy is framed as explaining *why* their raw feelings are valid and important.
  7.  **Structure & Flow:** Starts warm and welcoming, introduces the core idea accessibly, pivots to his specific instructions for *this moment*, then delivers the raw emotional core (anger, gratitude, grief), connects it back to his life's message, and ends with a simple, heartfelt goodbye.
  8.  **Tone:** Sincere, warm, sad, with moments of wry recognition (faculty parties, driving you crazy). Avoids being clinical or overly academic while respecting the depth of his thought.
  9.  **Time:** This should land comfortably in the 5-6 minute range when read aloud at a measured, emotional pace.

  **Key to Delivery:** Read it slowly. Pause for breath, especially after emotional lines. Let the feelings land. Don't rush the philosophical part; explain it as if sharing something deeply personal about your dad (which it is). Make eye contact, especially during the final, direct address to him ("So, Dad..."). The power is in the sincerity and the vulnerability of expressing the anger and gratitude alongside the grief, just as he wanted.

  I am so sorry for your loss. Your father sounds like a remarkable man who lived his truth deeply. This eulogy honors that truth and the very real, very human man he was. Wishing you strength for Saturday.
