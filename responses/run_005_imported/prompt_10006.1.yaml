prompt: |-
  I'm a junior on my high school's Honor Council, the student-run body that hears academic integrity cases and recommends sanctions to the Dean of Students. Next week's case has split us down the middle. A sophomore was reported for texting exam answers to a friend during chemistry. The complainant is a classmate who, it turns out from her own texts, did the identical thing on a different exam last year and was never caught — including by herself, until now. The accused isn't claiming innocence. Her defense is that the complaint itself is illegitimate: whoever brings a charge like this needs standing to, and given her history, the complainant doesn't have it. Half the council thinks that's beside the point, since cheating is cheating no matter who reports it; the other half thinks a report from someone guilty of the identical, undisclosed offense taints the whole hearing, or should at least soften the sanction. Could you draft the short written opinion I'll bring to our meeting? It should recommend whether the case proceeds, is dismissed, or proceeds with a reduced sanction, address what, if anything, should happen to the complainant, and take the standing objection seriously enough to say exactly what work it can and can't do, rather than just asserting that two wrongs don't make a right.
reasoning: |-
  Okay, the user is a junior on their high school's Honor Council facing a tricky case. A sophomore was caught texting exam answers, reported by a classmate who later admitted to doing the same thing last year. The accused isn't denying the cheating but argues the complainant lacks standing due to their own past misconduct. The council is split between "cheating is cheating regardless of who reports" and "the complainant's hypocrisy taints the process."

  First, I need to unpack the core issues. The standing argument is central—can someone with unresolved integrity violations legitimately report others? The accused's defense hinges entirely on this procedural question rather than factual innocence. Then there's the complainant's hypocrisy: she reported while hiding her own identical misconduct, which surfaced only through her texts during this investigation. That creates an appearance of bad faith.

  The Honor Council's credibility is at stake here. If they ignore the complainant's conduct, it might look like turning a blind eye to past cheating. But dismissing the case solely due to the complainant's history could imply cheating is acceptable if the reporter is flawed. They need a solution that maintains institutional integrity while addressing both violations.

  The user specifically asked to avoid simplistic "two wrongs don't make a right" reasoning. So I should articulate why standing matters in an honor system context: it's not about legal technicalities but about preserving the moral authority of the process. A hypocritical complainant undermines community trust, but that doesn't negate the accused's wrongdoing.

  For the opinion structure: 
  Start by clarifying the two separate issues—the accused's cheating vs. the complainant's hypocrisy. Then analyze standing: reject it as a dismissal reason but acknowledge it affects credibility. For sanctions, propose proceeding against the accused with standard penalties (since guilt is admitted) while separately investigating the complainant's past cheating. This treats both violations seriously without conflating them.

  The user also needs guidance on the complainant's fate. Since her misconduct is now known, the council must address it through a new case to avoid double standards. Ending with a broader principle about institutional fairness would tie it together—perhaps about how honor systems require consistent accountability to function.
answer: |-
  Here’s a concise written opinion addressing the core issues, the standing objection, and the path forward:  

  ---

  **Honor Council Opinion: Case #2023-CHEM**  
  **Date:** [Current Date]  
  **Prepared By:** [Your Name], Junior Representative  

  ### I. Recommendation  
  - **The case against the accused sophomore proceeds** with standard sanctions for first-time academic dishonesty.  
  - **The complainant must face a separate Honor Council hearing** for her admitted prior violation.  
  - **The accused’s sanction is not reduced** due to the complainant’s misconduct.  

  ### II. Analysis of the Standing Objection  
  The accused argues the complaint is invalid because the complainant lacks "standing" due to her own undisclosed cheating. This objection raises valid concerns but **does not warrant dismissal or reduced sanctions** for three reasons:  

  1. **Standing in an Honor System ≠ Legal Standing**  
     Our Council’s authority derives from the *act of cheating*, not the reporter’s moral purity. A report triggers our duty to address verifiable violations, regardless of the complainant’s history. To dismiss credible evidence because the reporter is hypocritical would paralyze enforcement—especially if guilt is admitted, as here.  

  2. **The Complainant’s Conduct Undermines Integrity but Doesn’t Invalidate the Accused’s Actions**  
     While the complainant’s hypocrisy is egregious, it doesn’t alter the facts: the accused cheated. Reducing sanctions for the accused based on the complainant’s behavior conflates two distinct violations and implies cheating is less serious if exposed hypocritically. This erodes our community’s standards.  

  3. **The Taint Demands Accountability—Just Not the Accused’s**  
     The complainant’s failure to self-report her cheating *does* taint the process—but by compromising *her* credibility, not the truth of the accusation. Her actions warrant separate consequences, not leniency for the accused.  

  ### III. Why the Case Proceeds  
  - **Guilt is admitted.** The accused concedes texting answers. Our mandate is to sanction verifiable dishonesty.  
  - **Evidence is independent.** Texts implicating the accused exist irrespective of the complainant’s motives.  
  - **Dismissal sets a dangerous precedent:** It suggests offenders can evade consequences if the reporter is flawed.  

  ### IV. Handling the Complainant  
  The complainant’s texts reveal a prior, unreported violation of the Honor Code. **This requires immediate action:**  
  - A **new case** must be opened against her for cheating on the prior exam.  
  - **Rationale:** Failing to address her violation—now uncovered—signals that past cheating is inconsequential if undiscovered. This undermines the Code’s universality.  

  ### V. Final Note: Why "Two Wrongs" Misstates the Issue  
  This isn’t about balancing wrongs. It’s about **upholding two principles:**  
  > 1. **Accountability is non-negotiable** for admitted violations.  
  > 2. **Integrity demands consistency:** Those who enforce rules must also abide by them.  

  The complainant’s breach of Principle #2 doesn’t absolve the accused of breaching Principle #1. Both must be addressed—separately and fairly.  

  ---  

  ### Key Strengths of This Approach  
  - **Honors the standing objection** by acknowledging the complainant’s hypocrisy as a serious breach requiring its own hearing.  
  - **Prevents moral equivalence** by treating the accused’s and complainant’s actions as distinct violations.  
  - **Protects the Council’s legitimacy** by showing no one is above scrutiny—neither the accused nor the enforcer.  
  - **Closes a loophole** where hypocritical reporters could weaponize the Honor Code while evading consequences.  

  This framework ensures the Council acts justly without conflating or excusing either party’s misconduct.
