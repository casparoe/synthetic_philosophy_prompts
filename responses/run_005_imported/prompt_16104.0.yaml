answer: |-
  This is an incredibly profound and ethically complex situation you're wrestling with – one that cuts right to the heart of personal identity, autonomy, and the limits of consent. You're absolutely right to see validity in both your cousin's and your mom's perspectives. There's no single "easy" answer, but here's a breakdown of the key arguments and how philosophers/law often approach this:

  **The Core Conflict:**

  1.  **Respecting the Past Self (Your Mom's View - Supported by the Advance Directive):**
      *   **Rationality & Foresight:** When stable, your aunt possessed full decision-making capacity. She understood her condition, the devastating consequences of untreated mania (financial ruin, damaged relationships, physical harm), and the temporary nature of her competence during episodes.
      *   **Extended Autonomy:** The advance directive is seen as an *expression* of her autonomy *over time*. It's her way of ensuring her deeply held values and long-term well-being prevail when her *current* capacity is impaired. It's a form of self-binding, like a Ulysses contract (tying oneself to the mast to resist the Sirens' song).
      *   **Best Interests:** During mania, she fundamentally lacks the capacity to accurately perceive reality, assess risks, or make rational judgments about her own health. Honoring her current "wishes" in that state would likely lead to significant harm, contradicting her own clearly stated values and interests expressed when competent.
      *   **Preventing Harm:** The directive prevents the potentially catastrophic consequences of untreated mania that she explicitly wanted to avoid.

  2.  **Respecting the Present Self (Your Cousin's View):**
      *   **Bodily Autonomy Now:** Overriding a conscious adult's *current* expressed refusal of treatment feels like a profound violation of bodily autonomy and self-determination, regardless of past statements. It *is* paternalism in the moment.
      *   **Fluidity of Self/Preferences:** Who is the "real" her? The stable self or the manic self? Both are part of her identity. Why should the past self permanently bind the present self, especially when the present self feels so strongly?
      *   **Potential for Trauma:** Forcible hospitalization and treatment, even if ultimately beneficial, can be deeply traumatic and damage trust in the medical system and family.
      *   **Slippery Slope:** If we override current wishes based on past directives, where do we draw the line? What about less severe impairments? What about changing values over time?

  **How Ethicists and Law Often Navigate This (Leaning Towards Past Self in Cases Like Bipolar Mania):**

  1.  **The Primacy of Capacity:** The crucial factor is the person's *current decision-making capacity* at the moment of refusal.
      *   **Mania and Capacity:** Mania, especially severe mania, is widely recognized as impairing capacity. Key elements often impaired include:
          *   *Understanding* information about treatment/illness.
          *   *Appreciating* the personal significance of that information (e.g., "I *know* I have bipolar, but I *don't believe* I'm manic now/I *don't believe* I need meds").
          *   *Reasoning* logically about risks/benefits.
          *   *Communicating* a consistent choice.
      *   **Assessment:** Ideally, a doctor would assess her capacity *during* the episode. However, the nature of mania often makes this impairment obvious and consistent with her directive's trigger.

  2.  **The Role of Advance Directives (Specifically for Psychiatric Care - Psychiatric Advance Directives/PADs):**
      *   **Presumption of Validity:** Legally and ethically, a validly executed PAD (like your aunt's) made when competent carries significant weight. It's presumed to reflect the person's authentic wishes regarding future care during incapacity.
      *   **Overriding Current Refusal:** Precisely *because* the condition triggering the directive (mania) inherently impairs capacity, following the directive *despite* current refusal is generally seen as respecting the *deeper* autonomy expressed when she *was* capable.
      *   **Purpose:** PADs exist *for* situations like this – when the person loses insight and refuses necessary care.

  3.  **The "Authentic Self" Argument:** Philosophers like Ronald Dworkin distinguish between "experiential interests" (what feels good/desired *in the moment*, like the euphoria/denial of mania) and "critical interests" (deeply held values and beliefs about what makes a *good life*, like stability, relationships, health). The advance directive expresses her *critical interests*, which should prevail over fleeting *experiential interests* when capacity is lost.

  **Addressing Your Cousin's Valid Concerns:**

  *   **The Violation is Real:** Forcible treatment *is* a violation of current autonomy. The key justification is that this violation is necessary, temporary, and done *to restore* the capacity needed for *meaningful* autonomy based on her own prior instructions. It's a profound but (hopefully) necessary harm to prevent a greater harm she explicitly foresaw and wanted to prevent.
  *   **Trauma:** This is a serious consideration. The process *should* be done with as much respect, dignity, and explanation as possible (even if not fully comprehended at the time). Supportive aftercare processing the experience is crucial.
  *   **Rigidity:** A good PAD isn't meant to be rigid forever. When your aunt is **fully stable again**, she should review it. Did the forced treatment work? Does she still feel the directive was the right choice? Does she want to modify it (e.g., specifying different treatment approaches, adding a trusted decision-maker)? Her current, *competent* self can always revise the document for the future.

  **Conclusion: Whose Wishes "Win"?**

  In cases of **severe mania where capacity is demonstrably impaired**, the consensus in medical ethics and law generally leans towards **honoring the valid advance directive made when competent**. This is seen as respecting the person's **extended autonomy and critical interests**, even though it overrides their impaired present wishes.

  **Why it's not a simple "win":**

  *   It acknowledges the deep tragedy and conflict inherent in mental illness – the self divided against itself.
  *   It requires a careful, evidence-based determination of incapacity.
  *   It necessitates that the directive was made competently and freely.
  *   It demands that the intervention (hospitalization/meds) is medically necessary and proportionate.
  *   It should be followed by reflection and potential revision when capacity returns.

  **For You & Your Family:**

  Your discomfort is understandable. Seeing your aunt distressed and overruled *feels* wrong on a human level, even if intellectually you grasp the rationale. The key things to remember:

  1.  **Her Past Self Knew:** She knew *exactly* how she felt during mania (euphoric, "fine," resistant) and *still* chose to bind herself. She anticipated this exact scenario.
  2.  **The Goal is Restoration:** The purpose wasn't to silence her, but to restore *her* to a state where she *could* make her *own* choices meaningfully again. Her current stability is likely evidence the directive worked *as she intended*.
  3.  **Talk to Her (When Stable):** If appropriate, talk to your aunt *now* about her experience. Does she feel the directive was followed correctly? Does she regret it? Does she want to change it? Respecting her current, competent voice *now* is vital.

  This isn't about one self "winning" over the other. It's about navigating the heartbreaking reality of a condition that temporarily steals the capacity for self-governance, using the tools the person *themselves* created when they *had* that capacity to protect their own long-term well-being and values. It's messy, ethically fraught, and deeply personal, but honoring her advance directive in this scenario aligns with the strongest arguments for respecting her autonomy *over the full course of her life and illness*.
