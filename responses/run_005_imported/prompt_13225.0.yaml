  First, I recall Williamson's main points. He argues that mental states aren't luminous because there's always a margin for error in knowledge. You can't be certain about your own mental states in borderline cases. The surprise exam is used as a case where an explicit deductive argument fails, showing that knowledge requires a margin for error.

