  question: is Blackstone actually committed here to the strong "an unjust law isn't really law at all" thesis (the Aquinas lex iniusta non est lex move), or is that second sentence doing something weaker/different -- more like a claim about where law's authority ultimately comes from, rather than a validity test you could actually run on individual statutes? i cant tell if "no human laws are of any validity if contrary to this" and "such of them as are valid derive all their force... from this original" are even compatible readings of one thesis. and if it IS the strong reading, how exactly does Hart's seperability point from the 1958 Harvard piece defuse it, vs how would Fuller's inner-morality-of-law stuff handle the same passage differently? trying to get the taxonomy straight before I actually write this section.
