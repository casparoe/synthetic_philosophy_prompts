  **Justification of Scores:**  
  - **Move (1): Score 1**  
    Marcus is fundamentally correct that early merging fits Lewis's core definition: it's an arbitrary regularity solving a coordination problem (avoiding collisions/conflict at merges), sustained by mutual expectations and preference conformity. The zipper merge is equally arbitrary but functionally superior, aligning with Lewis's view that conventions aren't inherently optimal.  

  - **Move (2): Score 0**  
    Renata rightly notes the stability paradox but overstates Lewis. Conventions *can* be inefficient yet "sticky" due to expectation inertia, as Lewis acknowledges. However, her observation of moralized hostility (vs. mere frustration) is perceptive and suggests something beyond pure coordination.  

  - **Move (3): Score 1**  
    Marcus correctly defends Lewis: suboptimal conventions *are* stable if unilateral deviation harms others (e.g., late mergers disrupt expected flow). Anger *could* stem from coordination failure. But he underplays Renata's third-party indignation point, which exceeds Lewis's self-interested expectation framework.  

  - **Move (4): Score 2**  
    Renata's knockout point: Third-party outrage (from unaffected drivers) is the hallmark of moralization. Lewisian conventions rely on *personal* payoff sensitivity; impartial enforcement signals internalization as a normative obligation ("cheating" vs. mere miscoordination), pushing it beyond a "bare" convention.  

  **Adjudication & Implications:**  
  Early-merge etiquette began as a Lewis convention but has hardened into a **moralized social norm**. The impartial, punitive reactions (e.g., honking from non-affected drivers) demonstrate it is now enforced as a *prescriptive rule* perceived as intrinsically "right," not just a coordination tool. This moralization explains why efficiency-focused campaigns fail: they address *rationality* but not *legitimacy*. For the zipper merge to succeed, campaigns must reframe it as morally superior (e.g., "fairer" or "more courteous") to overwrite the existing norm's moral valence. Pure common-knowledge dissemination is insufficient against moralized enforcement; changing behavior requires dismantling the perception of late merging as "cheating" and rebuilding the zipper merge as the new ethical standard. This case reveals that the convention/norm distinction is fluid—mutual expectations can evolve into moral imperatives through collective enforcement, making dislodging them exceptionally difficult without addressing their perceived righteousness.
