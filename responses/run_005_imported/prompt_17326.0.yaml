  The user's background in AI safety suggests they're familiar with concepts like self-modification and logical uncertainty. They might be thinking about how agents can precommit to strategies in environments where their actions affect others' predictions. UDT's strength lies in these high-stakes, predictor-based scenarios, which are common in AI alignment problems.

  I should explain why UDT doesn't ignore information. Instead, it incorporates all possible observations into its initial strategy. The key is that the prior computation considers every possible future observation, so the agent's response to each observation is already optimized. The user's worry about "throwing away information" stems from misunderstanding this aspect. UDT uses the information by conditioning the strategy on observations from the start.

