prompt: |-
  I'm a PhD student in philosophy currently drafting a dissertation chapter on hinge epistemology, and a recurring point of contention in my reading group is just how far Wittgenstein's notion of a "hinge proposition," as developed in *On Certainty*, can be stretched before it stops picking out anything precise. Everyone agrees that the handful of propositions Wittgenstein borrows directly from Moore's "A Defence of Common Sense" and "Proof of an External World" count as paradigm cases, but as soon as we test the concept against propositions neither of them actually discussed, the group splits between people who think almost any deeply held commonsense belief qualifies as a hinge and people who think the category is much narrower than that.

  To make some actual progress, I'd like your help sorting a set of candidate propositions according to how well each one satisfies the specific criteria Wittgenstein associates with hinge-hood: groundlessness rather than ordinary evidential warrant, exemption from the everyday practice of doubting and giving reasons, and a functional role as part of the fixed scaffolding — the shifting river-bed, or the hinges on which a door turns — that makes doubting and justifying possible in the first place, rather than being just another move within that practice. Here are the propositions:

  - "I have two hands."
  - "The Earth has existed for many years before I was born."
  - "Here is a hand" (as in Moore's "proof" of an external world).
  - "I am a human being."
  - "No one has ever set foot on the Moon."
  - "There are physical objects."
  - "2 + 2 = 4."
  - "Water boils at 100 °C at sea level."

  Please sort these into four tiers — paradigm hinge, hinge-like/borderline, well-confirmed empirical belief (not a hinge), and different category entirely (not a hinge) — and return your answer as a JSON object formatted as follows:

  ```json
  {
    "Paradigm hinge": ["..."],
    "Hinge-like / borderline": ["..."],
    "Well-confirmed empirical belief (not a hinge)": ["..."],
    "Different category entirely (not a hinge)": ["..."]
  }
  ```

  Afterward, please add a short paragraph explaining which one or two criteria did the most work in placing whichever two propositions you found hardest to classify, since that tension is really what I need for my own argument.
