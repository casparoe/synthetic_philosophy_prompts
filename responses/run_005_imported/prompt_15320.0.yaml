  ### Explanation of Key Tensions
  The hardest classifications were **"I am a human being"** and **"No one has ever set foot on the Moon"**, with tension arising from two criteria:  
  1. **Functional role vs. exemption from doubt**: "I am a human being" functions as scaffolding for identity and embodiment (e.g., grounding perceptual reports, moral responsibility), satisfying the *functional* criterion. Yet it lacks full *exemption from doubt* in contexts like psychiatric or philosophical thought experiments (e.g., brain-in-vat scenarios), making it borderline.  
  2. **Groundlessness vs. empirical falsifiability**: "No one has ever set foot on the Moon" *historically* operated as a hinge pre-1969 (doubt would have seemed nonsensical). However, its *empirical falsification* retroactively exposes its dependence on evidence, violating *groundlessness*. This shows Wittgensteinian hinges cannot be permanently falsified without collapsing the framework – their "ungroundedness" is constitutive.  

  The tension underscores that hinges are defined by their *current* role in a "form of life," not abstract necessity. A proposition's hinge-status can dissolve if empirical revision becomes integrated into practice, revealing the contextual fragility of the category.
