answer: |-
  Here’s a toast that weaves the handicap principle into its core, honors both audiences, confronts the "Emory study" wrinkle head-on, and stays warm and personal—all under five minutes:

  **(Clink glass gently)**  

  "Friends, family, colleagues, birds of every feather… gather ‘round. As Priya’s first PhD advisor, I was there when she met Alex. Back-to-back talks at a workshop – her on why fiddler crabs wave those comically oversized claws, him on why bowerbirds build absurdly elaborate nests. The rest, as they say, is ethology... I mean, history!  

  Now, anyone who knows Priya’s work knows she’s fascinated by costly signals. The idea—pioneered by Zahavi, nailed down by Grafen—that sometimes, the *best* proof isn’t efficiency, but extravagance. A peacock’s tail isn’t just beautiful; it’s *heavy*. It’s risky. It shouts, ‘Look how strong I must be to haul this thing around!’ It’s a billboard written in wasted energy. Spence saw the same thing in economics: why get that grueling MBA? It’s not *just* the skills; it’s the sheer cost proving you’re committed, you’re serious.  

  And look around you today. Look at the rings that serve no practical purpose. The flowers wilting by Tuesday. The cake too beautiful to eat. The sheer, glorious *excess* of it all! On the surface? Irrational. Wasteful. But through the lens Priya and Alex study? It’s the purest logic.  

  This wedding isn’t *just* a celebration. It’s a signal. A massive, collective, handicap signal. Priya and Alex are saying to each other, loud and clear: ‘This commitment? It’s not cheap talk. We’re investing something precious—time, energy, savings—to prove it’s real. We’re carrying this peacock tail *together*.’ The cost *is* the credibility. The extravagance *is* the evidence.  

  **But...** (leans in slightly, tone becomes thoughtful but warm)  
  ...some clever folks at Emory once crunched the numbers. They found that *more* spending on rings and weddings sometimes predicted *shorter* marriages. Seems backwards, right? Like the handicap principle got its wires crossed.  

  Here’s the thing about signals, though: They only work if they’re honest. If they come from the *right source*. If that peacock tail is paid for by someone *else*... well, what does it really prove about *the peacock*?  

  The magic of Priya and Alex’s signal today isn’t the dollar amount. It’s who’s sending it, and *why*. When the cost is shouldered *by them*, infused with *their* meaning – like choosing this specific forest clearing because they tracked warblers here during fieldwork, or the lab notebook page tucked into Alex’s pocket instead of a generic vow book – *that’s* when the extravagance transforms. It’s not about keeping up with the peafowl Joneses. It’s about a cost *they* willingly bear, a testament *they* craft, to prove a commitment *they* own. The Emory study? It might measure the price tag, but it can’t measure the *intent* behind the signal. It can’t see the quiet choices Priya and Alex made to build *their* proof, rooted in partnership, not pressure.  

  So, Priya, Alex – your signal today is brilliant. Not because it’s flashy, but because it’s *yours*. It’s heavy with meaning only you two fully grasp. You’ve built your bower. You’ve unfurled your tails. And you’ve done it *together*, proving the deepest truth Zahavi glimpsed: the most credible promises are often the ones that cost us something real.  

  May your partnership always be as robust, as honest, and as beautifully extravagant in its commitment as the most costly signal nature – or economics – could ever devise. To Priya and Alex!"  

  **(Raise glass high)**  

  **Why this works:**

  1.  **Core Logic Does the Work:** The toast *is* an explanation of the handicap principle, using wedding elements (ring, flowers, cake) as the examples. Zahavi, Grafen, and Spence are integrated naturally as the "why" behind the celebration's form.
  2.  **The Emory Wrinkle Earned:** It directly addresses the contradiction ("But...") and resolves it by focusing on the *source* and *authenticity* of the cost. "Who pays?" and "Whose intent?" become the key. It reframes their specific, meaningful choices (forest clearing, lab notebook) as the *true* costly signal, contrasting it with generic extravagance funded by others.
  3.  **Accessible to All:** No jargon survives. "Costly signals" is the most technical term, immediately explained by peacocks and MBAs. "Handicap principle" is introduced *after* the concrete examples. Family hears a beautiful story about proof through shared effort and meaningful choices. Nerds hear the deep theory woven in.
  4.  **Warm & Specific:** Rooted in their meeting story (back-to-back talks), their field (fiddler crabs, bowerbirds, warblers), and personal touches (forest clearing, lab notebook). The compliment ("your signal today is brilliant") is deeply personal to their expertise.
  5.  **Five Minutes, Spoken:** The language is conversational, with natural pauses (marked by ellipses/line breaks). It avoids dense paragraphs. The rhythm builds: story -> theory -> wedding application -> challenge -> resolution -> heartfelt conclusion.
  6.  **Tone:** Respectful, warm, affectionate, slightly playful ("birds of every feather," "peafowl Joneses"), and intellectually satisfying without being a lecture. The "But..." transition is thoughtful, not jarring.

  **Delivery Tip:** Practice it aloud, focusing on the conversational flow. Pause slightly before "But..." and lean in. Emphasize the personal details (forest clearing, lab notebook) with genuine warmth. End the toast with strong eye contact and a warm smile at the couple. The open bar crowd will appreciate the clarity and heart! Good luck!
