  Breaking it down: disgust operates differently than empathy-based outrage. Disgust is visceral and pre-reflective—it flags "contamination" without specifying harm. Whereas reactions to cruelty or non-consent are inherently harm-focused; they track tangible moral violations (suffering, autonomy) even if evolution shaped our sensitivity to them. 

  The distinction lies in justifiability post-reflection. We can articulate why cruelty is wrong beyond the gut feeling (it causes suffering, violates dignity). But with chimera disgust, once we isolate the contamination-alarm aspect and confirm no actual harm exists—just unfamiliar biological blending—the feeling doesn't point to further moral reasons. 

  I should emphasize this isn't about dismissing all discomfort. If someone argues chimeras might suffer or that this commodifies life, those are reason-based concerns evolution didn't anticipate. But pure disgust alone? That seems legitimately discountable once its origin and lack of modern relevance are exposed. 

