prompt: |-
  So in AP Gov we got into voting rights and I fell down a rabbit hole on this thing called the "boundary problem" in democratic theory — basically, how do you even decide who counts as "the people" that gets to vote in the first place, since you'd need a vote to decide who's included in the vote, which seems kind of circular. There's apparently two big rival answers: the all-affected interests principle (anyone whose interests are impacted by a decision should get a say) and the all-subjected/coercion principle (anyone who actually has to obey the resulting laws should get a say, regardless of whether their interests are affected) — and they don't always agree with each other. I'm about to go to college and can't decide whether to register to vote at my school address or back home, and it hit me that this is basically a real life mini version of that exact problem. Can you describe the most important implications of the boundary problem debate for my specific situation — like what each principle would actually tell me to do, where exactly they'd clash for someone like me (living somewhere ~4 years while still being affected by decisions back home too), and whether theres an actual principled way to resolve it or if this is just a case political philosophers would shrug at.
reasoning: |-
