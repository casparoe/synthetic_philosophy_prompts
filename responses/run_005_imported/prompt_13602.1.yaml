  First, I need to break down each move in the argument. Owen starts by saying Kant's view that cruelty to animals is only wrong because it affects human character makes Judith's actions incoherent. Fatima counters with the distinction between duties "to" vs. "regarding" animals, pointing out Kant's nuance. Owen rebuts by arguing that the bookkeeping reduces animals to instrumental value. Fatima brings in Korsgaard's reinterpretation to include animals. Then they clash over Kant's example of shooting an old dog.

