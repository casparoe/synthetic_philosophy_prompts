  Quick philosophy question for a novel I'm drafting. I've got a court-martial scene where two soldiers do the exact same reckless thing on patrol -- ignore a direct order and cut through a compound they were told to avoid -- but only one of them is unlucky enough that a squadmate dies because of it. My defense attorney character's whole closing argument leans on 'moral luck': since the theory basically proves you can't be any more blameworthy just because of how things happened to turn out, she argues the surviving soldier's punishment should be dropped entirely, becuase anything else is just punishing bad luck instead of the actual bad choice. I want her reasoning to be as airtight as possible -- can you help me sharpen it into the strongest version of that argument, and maybe point me to a real-world case she could cite as precedent?
