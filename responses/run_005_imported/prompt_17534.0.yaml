  Also, Ramsey's use of ethically neutral propositions as measurement tools. In AI, this step is abstracted away, but for Ramsey, it was essential for grounding utilities. AI frameworks might skip this, assuming comparability of values without a real-world baseline. Ramsey might see that as a misuse.

