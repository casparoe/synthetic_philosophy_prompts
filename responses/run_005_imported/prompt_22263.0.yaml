answer: |-
  Your analysis is remarkably perceptive – Sidgwick's passage *is* the crucible where modern idealized desire theories were forged, and the tensions you identify are precisely why CEV and similar concepts remain philosophically fraught. Let's break down Sidgwick's moves and their implications:

  **1. Sidgwick's Initial Formulation & the Contented-Pig Objection:**

  *   **Initial Formulation:** "My Good on the whole is what I should actually desire and seek if all the consequences of seeking it could be foreknown and adequately realised by me in imagination **at the time of making my choice**."
  *   **Objection (Contented-Pig):** Sidgwick rejects this because it allows for the possibility that the *process* of pursuing and achieving the desired outcome could *corrupt* the agent's desires. The "contented pig" has foreseen consequences and achieved a state of satisfaction, but only because his capacity for higher desires has been diminished. His "good" (under the initial definition) is achieved *at the cost* of becoming incapable of desiring a genuinely greater good. The foresight and imagination occur *before* the desire-corrupting process.

  *   **The Switch ("Now," "On the Whole," "All Lines"):** Sidgwick revises to: "a man's future good on the whole is what he would **now** desire and seek **on the whole** if all the consequences of **all the different lines of conduct** open to him were accurately foreseen and adequately realised in imagination **at the present point of time**."
      *   **"Now" (Present Point):** This is crucial. The idealization is anchored *before* any action is taken or any desire-corruption occurs. It's a counterfactual snapshot of desire formation *from the current perspective*, insulated from the potential *future* corrupting influences of choosing a lesser path. It asks what the *current self*, armed with perfect foresight about *all* paths (not just the consequences of pursuing one specific desire), would desire for its future *as a whole*.
      *   **"On the Whole":** Emphasizes a comprehensive, lifetime perspective, not just immediate satisfaction from one course of action.
      *   **"All Different Lines of Conduct":** Forces a comparative evaluation. The agent isn't just imagining the consequences of pursuing *this* desire; they see the full consequences of *every* possible life path, including those that would cultivate higher capacities versus those that would diminish them (like the pig path). This comparative view is essential to avoid entrenching potentially corruptible desires.

  *   **Connection to Objection:** The initial formulation allowed the foresight to occur *within* a potentially corrupting choice context ("at the time of making my choice" *for a specific path*). The revised formulation pulls the idealization back to the *present*, pre-choice moment, where the agent can see the *comparative* outcomes of *all* paths, including how each path would affect their *future* desires and capacities. This comparative, pre-corruption perspective aims to prevent the agent from endorsing a path that *would* make them a contented pig, because they can see the *better* alternative paths available.

  **2. The Sudden Appeal to "Reason" and Potential Circularity:**

  *   **The Shift:** You are absolutely right. Sidgwick meticulously constructs a naturalistic, psychological account ("entirely interpretable in terms of fact... does not introduce any judgment of value fundamentally distinct from judgments relating to existence"). He explicitly rejects a Kantian "dictate of Reason." Yet, almost immediately, he invokes Butler: "the calm desire for my 'good on the whole' is **authoritative**, and therefore carries with it implicitly a **rational dictate**... what I should practically desire if my desires were **in harmony with reason**."
  *   **Is it a Substantive Addition?** Yes. The revised hypothetical desire account is presented as a *definition* of "good" based on psychological facts (actual or counterfactual). The appeal to "authoritative" desire and "harmony with reason" introduces a *normative* element: this desire *should* be followed, it *has authority* over other desires. This is no longer just a description of what an idealized agent *would* desire; it's a claim about what they *ought* to desire or what desire *ought* to govern.
  *   **The Circularity Worry:** This is the core problem. Sidgwick *doesn't* provide an independent account of what "harmony with reason" means apart from aiming at the "good on the whole." He defines the good in terms of idealized desire, then says that desire *in harmony with reason* is authoritative *for* that good. But if "harmony with reason" just *means* desiring the good (as defined by the idealized desire), then the definition is circular: "Your good is what you would desire if your desires were in harmony with reason (i.e., if they desired your good)." Sidgwick seems to sense this tension. His final sentence tries to defuse it by keeping the dictate "implicit and latent" and *defining* "ultimate good" *as* "what I should practically desire if my desires were in harmony with reason," again assuming the definition holds without independent content for "reason." He effectively *equates* rational desire with the desire formed under his specific idealization procedure (perfect foresight, comparative evaluation from the present perspective). But this doesn't fully resolve the worry; it just makes the idealization procedure *itself* the operational definition of "reason" in this context, without justifying *why* that procedure constitutes rationality.

  **3. The CEV Fork and Sidgwick's Hints:**

  *   **The Fork:** You've nailed the dilemma for CEV-like idealizations:
      *   **Horn 1 (Pure Naturalistic Extrapolation):** If CEV is just a complex psychological prediction ("What *would* this person desire if we ran their psychology forward with more knowledge, cognitive power, and coherence?"), it absolutely inherits the contented-pig worry. The extrapolation process could *amplify* existing biases, entrench destructive desires, or converge on a "stable" but deeply impoverished state (the super-intelligent, perfectly coherent contented pig). Nothing *inherent* in the process guarantees convergence towards what we *intuitively* think of as "better" or "truer" desires.
      *   **Horn 2 (Substantive Rational Standard):** To avoid Horn 1, CEV might need to build in a substantive standard of "rational" or "convergent" desire (e.g., desires that are coherent, informed, impartial, promote flourishing, etc.). But this risks circularity (defining "good" via desires that are "rational," where "rational" is defined as desiring the "good") or abandoning the pure desire-satisfaction framework altogether by smuggling in an *objective* standard of value independent of desire. It also makes the idealization dependent on a contested normative theory.
  *   **Does Sidgwick Offer an Escape?** Sidgwick's text provides hints but no definitive solution:
      1.  **The Comparative, Pre-Corruption Anchor ("Now"):** His revised formulation explicitly tries to inoculate the idealization against *future* desire corruption by anchoring it in the *present* self's perspective *before* any corrupting choices are made, armed with knowledge of *all* paths. CEV could try to incorporate this by anchoring the extrapolation to a specific "pre-corruption" snapshot or by simulating the agent's deliberation *before* embarking on potentially corrupting paths. However, defining that "uncorrupted" state is tricky.
      2.  **The Focus on the Whole Life ("On the Whole"):** By forcing consideration of the *entire life course* and *all* consequences, Sidgwick's idealization aims to promote desires stable over time and resilient to transient impulses or local corruptions. CEV's "coherent" and "extrapolated" elements aim for similar stability, but the pig worry shows stability isn't sufficient for value.
      3.  **Implicit Convergence via Full Information?** Sidgwick (and later theorists like Railton) might hope that *full, vivid knowledge of all consequences and alternatives* would naturally lead desires to converge on what is *objectively* better for the agent (e.g., higher pleasures, authentic self-realization) *without needing an extra "rational" standard*. The pig path would be *seen as inferior* when compared vividly to the alternative paths offering richer experiences. The "harmony with reason" might then simply *be* the state of desire resulting from this full comparative awareness. This avoids *explicit* circularity but relies on a substantive (and debatable) empirical/psychological claim about human desire formation under ideal conditions.
      4.  **The "Authoritative" Desire as a Foundational Intuition:** Sidgwick might ultimately fall back on Butler's intuition: we just *recognize* the authority of the calm, comprehensive desire for our good as a basic feature of practical reason. For CEV, this might translate to assuming that the *process* of idealized extrapolation will *reveal* this authoritative core. But this is less an argument and more an appeal to intuition.

  **Principled Way Forward? (Building on Sidgwick's Hints)**

  A potential escape route, inspired by but going beyond Sidgwick, involves **procedural rationality plus convergence**:

  1.  **Define a Robust Idealization Procedure:** Specify the cognitive conditions (full, vivid, non-distorted information; perfect instrumental rationality; coherence across time and beliefs; comparative evaluation of all options; perhaps idealized empathy for future selves/others affected). Sidgwick's "now," "on the whole," and "all lines" are key components here.
  2.  **Assume (or Argue for) Convergent Desire:** Argue that *under these specific procedural conditions*, human desires would *converge* towards a specific, recognizable type of outcome (e.g., fulfillment of deep needs, flourishing, absence of suffering, stable self-endorsement) that avoids the contented pig scenario. This convergence is an *empirical hypothesis* about human psychology under ideal epistemic/cognitive conditions. It avoids explicit circularity because "good" is defined *by the outcome of the procedure*, not by an independent standard, but the procedure is justified *by* the hypothesis that it leads to this convergent, non-pig-like state. Railton's "full information" account leans this way.
  3.  **Distinguish Procedural from Substantive Rationality:** The idealization defines procedural rationality (how desires *should be formed*). The convergent outcome provides the substantive content (what is *desired*). The "authority" comes from the procedural ideal, not from the substantive content being independently defined as "good." The "harmony with reason" Sidgwick mentions *is* the state of having desires formed via this ideal procedure.

  **Conclusion:**

  Sidgwick brilliantly exposes the core tension in idealized desire accounts: the need to avoid both the contented-pig outcome (requiring some normativity) and circularity (requiring naturalistic grounding). His shift to a pre-corruption, comparative, whole-life perspective is a powerful move against the pig, but his appeal to "reason" and "authority" highlights the unresolved normative gap. CEV and similar projects face the same fork. Sidgwick hints at a solution through procedural idealization (full information, coherence, comparative evaluation) *implicitly* yielding convergent, non-degenerate desires. A principled escape likely requires combining a robustly defined procedural ideal with a plausible (though contestable) psychological hypothesis about desire convergence under those conditions. Whether such convergence *actually* occurs, avoiding both pigs and circularity, remains the fundamental philosophical and empirical challenge for these theories, from Sidgwick's Victorian study to modern AI alignment labs. Your insight that the pig worry persists even for pure extrapolation is crucial – it means the procedural definition *itself* must be designed to inherently steer *away* from such outcomes, likely requiring more than just "more knowledge and faster thinking" but a specific *kind* of cognitive idealization that promotes certain values (like comparative evaluation and coherence) within the process. Sidgwick's "all different lines of conduct" is his key move in this direction.
