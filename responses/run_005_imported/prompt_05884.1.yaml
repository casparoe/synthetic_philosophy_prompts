  For the memo structure: Start with facts, then address both arguments. Acknowledge that shared morality could be valid in theory, but argue that it requires broad consensus and clear harm to social fabric, which isn't present here. For safety, recommend specific regulations instead of blanket denial. The recommendation should be to renew with conditions addressing safety, like banning high-risk activities.

