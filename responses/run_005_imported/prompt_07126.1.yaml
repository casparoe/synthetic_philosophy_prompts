  I'm taking a philosophy of death class this semester (yes that's a real class, and honestly one of my favorite ones I've taken) and we just wrapped up the unit where we read Epicurus's Letter to Menoeceus, some Lucretius, and Nagel's paper on death, all about whether death is actually bad for the person who dies. In discussion section this week two people in my group, Derek and Sasha, got into this back-and-forth about it that our TA never really resolved becuase we ran out of time, and it's kind of been stuck in my head since.

  (1) Derek opened by defending Epicurus pretty much straight: death can't be bad for you, he said, because for something to be bad it has to be bad for someone, and by the time you're actually dead there's no "you" left around to be the subject of that badness. (2) Sasha said that's exactly what the deprivation account answers -- death is bad not because it feels bad, but because it deprives you of all the good years you would've had, same way it can be bad for an inventor that a rival stole credit for her discovery even if she dies never finding out about it. (3) Derek came back that the analogy doesn't really work: the inventor still exists and has interests that get set back while she's alive, even if she's ignorant of it, whereas once you're dead there's no subject left at all, ignorant or otherwise, for anything to be bad for. (4) Sasha pivoted to the Lucretius symmetry thing -- if it's really just about deprivation of possible goods, she said Derek owes an explanation for why we don't grieve the infinite stretch of time before we were born the same way we dread the stretch after we die, since both are just as much "our" life that we never get to have. (5) Derek said the two aren't symmetric because desire is inherently forward-looking: it makes sense to want more future life, but there's no real analogue of wanting to have had an earlier start, so the asymmetry in how we feel about the two isn't a bias that needs excusing, it's just what wanting things is like.

