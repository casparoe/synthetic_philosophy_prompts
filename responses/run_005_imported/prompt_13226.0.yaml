  First, I need to recall Thomson's lamp setup. The lamp starts off and is toggled at intervals halving each time: 1/2, 3/4, 7/8 minutes, etc. After infinitely many toggles by t=1, Thomson argues it can't be on or off, leading to a contradiction. The user believes this proves supertasks are logically impossible. But why then do philosophers like Benacerraf, Earman, Norton still engage with the problem?

  The key is Thomson's assumption that the lamp's state must be determined by a last flip. Since there is no last flip, he concludes indeterminacy. But Benacerraf points out that the state at t=1 isn't defined by the sequence itself; it's a separate specification. The sequence only defines states at times before t=1. The state at t=1 requires additional information, like a limit or a new rule.

  The user might be missing that the contradiction arises from an unjustified assumption. Thomson assumes that the lamp's state must result from some flip in the sequence, but with no last flip, he sees a problem. However, without a rule linking the supertask's completion to the final state, the state at t=1 is undefined. That doesn't make the supertask impossible; it means the description is incomplete.

  Later work explores how to define the final state. For example, using limits: if the times between toggles are considered, the state doesn't converge, so no defined limit. But in other supertasks, like a particle moving, the position might converge. So, the coherence depends on the specific supertask and how the final state is specified. Malament-Hogarth spacetimes allow infinite computations by having the observer's worldline reach infinity in finite time, which doesn't necessarily lead to contradictions if properly defined.

