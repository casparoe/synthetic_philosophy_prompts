answer: |-
  ## The Moral Asymmetry of War: Why McMahan Undermines Walzer's Combatant Equality

  The question of whether soldiers fighting for unjust causes possess the same moral rights and liabilities as their justly fighting adversaries lies at the heart of modern just war theory. Michael Walzer's doctrine of the "moral equality of combatants," articulated in *Just and Unjust Wars*, has long dominated the field, emphasizing the separation between *jus ad bellum* (justice of resorting to war) and *jus in bello* (justice of conduct within war). Jeff McMahan's revisionist critique, however, fundamentally challenges this symmetry, arguing for a deep moral asymmetry rooted in individual responsibility. While Walzer's position offers compelling practical safeguards, McMahan's framework ultimately provides a more coherent and defensible account of *genuine* morality, revealing Walzer's equality as a necessary legal fiction rather than a moral truth.

  **I. Walzer's Strongest Defense: Reciprocity, Epistemic Constraints, and the Separation of Domains**

  Walzer's core argument rests on the functional separation of *jus ad bellum* and *jus in bello*. He contends that judging a soldier's right to kill based on the justice of their nation's cause is both practically impossible and morally disastrous within the chaos of war:

  1.  **Reciprocity as the Bedrock of Restraint:** The primary strength of Walzer's equality is its foundation in reciprocity. If soldiers on both sides know they are equally entitled to kill and equally liable to be killed *provided they follow the rules*, it creates a powerful mutual incentive to adhere to *jus in bello* constraints (distinction, proportionality, humane treatment). Undermining this equality, Walzer fears, would lead to a catastrophic breakdown: the "just" side would feel morally licensed to disregard rules against the "unjust" enemy, who, seeing no hope of reciprocal treatment, would abandon restraint entirely. War would descend into greater savagery.
  2.  **Epistemic Limitations Under Fire:** Soldiers cannot reasonably be expected to adjudicate the ultimate justice of their nation's cause while engaged in combat. Governments control information, propaganda is pervasive, and the fog of war obscures strategic context. Holding individual soldiers morally responsible for the *ad bellum* justice they likely cannot accurately discern is profoundly unfair. The battlefield demands clear, binary rules applicable to all combatants, not complex moral judgments about state policy.
  3.  **The Collective Nature of War and Shared Circumstances:** Walzer emphasizes that soldiers are typically conscripted or socialized into their roles, acting under orders and within state structures they did not create. They face the same lethal dangers and coercive pressures regardless of their side's cause. Judging them differently based on the justice of the war itself imposes an unbearable burden of political and philosophical judgment on individuals whose primary reality is survival and duty to comrades. Morality, in this context, must focus on *how* they fight, not *why* their state fights.
  4.  **Preserving the Possibility of Peace:** Treating soldiers asymmetrically makes ending wars immensely harder. Negotiations and ceasefires require recognizing the enemy combatant as a legitimate, if opposing, actor. Denying the moral standing of "unjust" combatants demonizes them, justifies their annihilation, and removes any basis for post-war reconciliation or the mutual acceptance of rules governing future conflicts.

  **II. McMahan's Revisionist Asymmetry: Liability, Responsibility, and the Justification/Excuse Distinction**

  McMahan dismantles Walzer's separation thesis by grounding *jus in bello* permissions firmly in individual moral responsibility and liability, directly linking them to *jus ad bellum*:

  1.  **The Individualist Critique and Liability:** McMahan argues that morality fundamentally concerns individuals. The permission to kill derives from the target's **liability**. A person is liable to defensive harm only if they are morally responsible for an unjustified threat. Soldiers fighting for an unjust cause *are* contributing to an unjustified threat. Therefore, they lack the *moral right* to kill just combatants (who are resisting that threat), and they *are* morally liable to be killed by them. Conversely, just combatants *do* have the right to kill unjust combatants (as they pose the unjust threat) and are *not* liable to be killed by them (as they pose no unjust threat).
  2.  **The Collapse of the Separation Thesis:** McMahan demonstrates that *how* one may permissibly fight (*in bello*) logically depends on *why* one is fighting (*ad bellum*). Rules governing conduct presuppose a context. If the context itself is morally illegitimate (an unjust war), the permissions granted within it for pursuing that illegitimate aim cannot be morally symmetrical with the permissions granted to those resisting it. The moral status of the act of killing depends on the moral status of the end it serves.
  3.  **The Crucial Justification/Excuse Distinction:** This is where McMahan directly addresses Walzer's epistemic and coercive concerns. He readily concedes that most soldiers fighting for an unjust cause may be **excused** rather than **justified**. Factors like duress (fear of punishment), epistemic limitations (genuine belief in the cause's justice due to propaganda), and lack of reasonable alternatives (conscription, social pressure) can *excuse* their participation, meaning they are not *culpable* or *blameworthy* for it. **However, an excuse does not negate liability or create a right.** An excused bank robber is still liable to be stopped by police; they had no right to rob the bank, even if we understand *why* they did it. Similarly, an excused unjust combatant is still morally liable to defensive killing because they are *actually* contributing to an unjust threat, even if they aren't blameworthy for doing so. Their killing remains objectively unjustified; they merely escape blame.

  **III. Verdict: Moral Equality as Fiction, Asymmetry as Truth**

  While Walzer's framework is indispensable for the *law* and *practice* of warfare, providing vital stability and restraint, it fails as a *genuine moral doctrine*. McMahan's revisionism reveals the deeper moral truth:

  1.  **Morality Demands Asymmetry:** At the level of fundamental morality, McMahan is correct. Permissions and liabilities in killing *must* be grounded in the objective justice of the cause and the individual's responsible contribution to the threat. A soldier fighting for aggressive conquest simply *is not* in the same moral position as one fighting in self-defense, regardless of their personal beliefs or circumstances. The act of killing in the former case perpetuates injustice; in the latter, it resists it. This asymmetry is inescapable.
  2.  **Walzer's Strengths are Pragmatic, Not Moral:** Walzer's powerful arguments based on reciprocity, epistemic constraints, and the need for peace are arguments about **feasibility, predictability, and the minimization of harm within a tragic institution**. They are reasons why the *law* of armed conflict (LOAC) *must* adopt symmetry and treat combatants equally *for legal purposes*. They are reasons why soldiers *should not be punished* for merely fighting in an unjust war (due to excuses). They are *not* reasons why killing for an unjust cause is morally equivalent to killing to stop an unjust cause. Walzer conflates the necessary legal fiction with moral reality.
  3.  **Excuse Explains, But Doesn't Equalize:** The justification/excuse distinction is the key to resolving the tension. It fully accommodates Walzer's valid concerns about the soldier's plight – most unjust combatants are not monsters, but individuals caught in terrible circumstances. It explains why we shouldn't *blame* them indiscriminately. However, it does not magically transform their harmful actions into morally permissible ones, nor does it erase the objective threat they pose. Their moral liability stems from their causal role in the unjust harm, not their subjective blameworthiness.
  4.  **Practicality Doesn't Dictate Morality:** While abandoning combatant equality *in practice* under current conditions might be disastrous (as Walzer fears), this doesn't make the underlying symmetry *morally true*. It means our legal and institutional frameworks are imperfect tools for realizing deep morality in the complex, violent reality of war. The goal should be to make institutions and practices reflect moral truth *as far as possible*, not to redefine morality to fit current practical limitations. McMahan's theory provides the moral compass for criticizing and gradually reforming the laws of war to better approximate justice, even if perfect symmetry remains a pragmatic necessity for now.

  **Conclusion**

  The moral equality of combatants is a powerful and necessary fiction for the regulation of warfare, brilliantly defended by Walzer on grounds of reciprocity, epistemic realism, and the preservation of restraint. However, as a genuine moral doctrine, it collapses under McMahan's rigorous analysis. Rooted in individual responsibility and liability, McMahan demonstrates that the justice of the cause fundamentally determines the moral permissions of killing within the war. Unjust combatants, even if excused, lack the moral right to kill just combatants and are liable to defensive harm. While the law must often treat soldiers symmetrically to prevent chaos, and while we must understand and often excuse the individual circumstances of unjust combatants, we cannot pretend their moral standing is equal to those defending against aggression. True morality in war is starkly asymmetric; Walzer's equality is a vital shield for limiting war's horrors, but McMahan reveals it is not the moral sword of truth. The deep structure of morality demands that we recognize the fundamental difference between killing for injustice and killing to resist it.
