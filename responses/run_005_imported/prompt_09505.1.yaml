  Let me mentally walk through Ramsey's possible reactions. His anti-discounting principle is robust - he'd likely mock "pure time preference" arguments against caring about heat death. But the Epilogue reveals something deeper: his value theory is anthropocentric and perspective-bound. When he says stars are "threepenny bits", he's not denying their physical size but their evaluative significance. That's key.

  I imagine Ramsey would accept the mathematical case for astronomical potential welfare (per his discounting arguments) but reject the moral weight longtermists assign to it. Why? Because for him, value emerges from human-scale concerns - the "foreground" of lived experience. Colonizing galaxies wouldn't amplify value proportionally; it might just create more threepenny bits.

