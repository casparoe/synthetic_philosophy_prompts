answer: |-
  Here's an original example illustrating the indeterminacy problem in teleosemantics, using a desert-dwelling robot equipped with an evolutionary learning algorithm:

  ### The System: *Arenae Sapiens* (Desert Sentinel Robot)
  *   **Organism:** A solar-powered, autonomous robot designed to locate and excavate subsurface water sources in hyper-arid environments.
  *   **Behavior:** Drives toward locations emitting strong *sub-300Hz acoustic signatures* detected by its ground-coupled seismometer.
  *   **Selection History:** Deployed in the "Granite Basin" desert, where deep aquifers produce unique low-frequency vibrations (280-295Hz) detectable through the bedrock. Over generations (simulated evolution optimizing for water-finding efficiency), robots whose algorithms strongly linked this specific acoustic band to navigation thrived (recharged via excavated water). Robots ignoring it or responding to other frequencies failed.
  *   **Success Condition:** Excavation yields water at locations with the target acoustic signature.
  *   **Environment:** Granite Basin geology ensures *only* deep aquifers generate sustained vibrations in the 280-295Hz band. Wind noise, animal movement, or machinery produce different frequencies.

  ### The Indeterminacy Problem: What does the acoustic state represent?
  The robot's internal state (triggered by 280-295Hz signals) reliably causes water-seeking/excavation. Teleosemantics says its content is fixed by what it was *selected for*. But *what property* was it *really* selected to track?

  1.  **Candidate Content 1 (Specific Property):** `DEEP AQUIFER PRESENCE`
      *   *Justification:* The ultimate survival/reproductive (recharge/replication) advantage came *only* from finding aquifers. The acoustic signature was merely a reliable indicator *of that*.
  2.  **Candidate Content 2 (Correlated Indicator):** `SUSTAINED ACOUSTIC EMISSION IN THE 280-295Hz BAND`
      *   *Justification:* The algorithm was directly selected for responding to *this precise sensory input pattern*. This is what the sensor detects and the algorithm processes. Finding water was the *consequence* of tracking this indicator correctly in Granite Basin.
  3.  **Candidate Content 3 (Functional Role):** `WATER SOURCE INDICATOR`
      *   *Justification:* The mechanism's function is to indicate sources of water. The acoustic band is the means by which it fulfills this function in its native environment.

  ### Where and Why Indeterminacy Arises

  1.  **Perfect Correlation in Ancestral Environment:** Throughout the robot's entire evolutionary history within Granite Basin, `DEEP AQUIFER PRESENCE`, `SUSTAINED ACOUSTIC EMISSION IN THE 280-295Hz BAND`, and `WATER SOURCE INDICATOR` were *extensionally equivalent*. Whenever one was present, the others were too. Selection pressure operated identically on the mechanism tracking *any* of these properties because they never came apart.
  2.  **Selection Acts on Causal Efficacy:** Natural selection (or its algorithmic equivalent) "sees" the *reliability of the causal chain*. It favors mechanisms where the sensory input (acoustic band) reliably causes the beneficial outcome (water acquisition) via the behavior (navigation/excavation). It doesn't "care" *which* specific property in the chain the mechanism is "latching onto," as long as the chain works. Selection operates on the *entire reliable correlation*.
  3.  **No "Internal" Resolution:** The robot's internal processing is simply an algorithm tuned to fire the behavior upon detecting 280-295Hz signals. There's no additional internal structure (like complex inference or multiple dissociable detection modules) that would privilege representing "aquifer" over "acoustic band." The algorithm's history only tells us it was selected *because* detecting that band led to water.
  4.  **The Problem of Novel Environments:** Deploy the robot in a new desert, "Sandstone Valley." Here:
      *   Geothermal vents produce sustained 288Hz vibrations (matching the target band), but no water (`Candidate 2` is present; `Candidate 1` & `3` are absent).
      *   Shallow, seasonal water pockets exist but produce no detectable vibrations (`Candidate 1` & `3` are present; `Candidate 2` is absent).
      *   **Indeterminacy Manifest:** What does the acoustic state *misrepresent*?
          *   If content = `DEEP AQUIFER`, it misrepresents the geothermal vent (wrong cause for the signal).
          *   If content = `ACOUSTIC BAND 280-295Hz`, it represents the vent *correctly* (the signal *is* present).
          *   If content = `WATER SOURCE INDICATOR`, it misrepresents the vent (no water) and fails to represent the shallow pools (water present, no signal).

  **Teleosemantics cannot definitively choose between Candidate 1, 2, or 3** based solely on selection history. All three explain the mechanism's selection *equally well* within the original environment.

  ### Can Teleosemantics Resolve This?

  Proponents offer potential solutions, but significant challenges remain:

  1.  **Most Proximal Normal Explanation (Millikan):** Focus on the *immediate* cause the mechanism was designed to detect under normal conditions. Here, it's the acoustic signature (`Candidate 2`). However, this seems arbitrary – why privilege the sensory input over the distal cause that provided the selective advantage? It risks making content too impoverished ("detects sound X") and detached from the *function* ("finds water").
  2.  **Functional Analysis:** Argue the mechanism's *proper function* is to produce behavior leading to water acquisition. Therefore, its content *must* be what fulfills that function – `DEEP AQUIFER` or `WATER SOURCE`. But this doesn't solve the correlation problem: in the ancestral environment, detecting the acoustic signature *was* the way to fulfill that function. Why isn't the content disjunctive (`Aquifer OR Target-Acoustic-Signal`)? Teleosemantics typically rejects disjunctive contents as unnatural.
  3.  **Grains & Context:** Suggest the content is vague or context-dependent. Perhaps it's `AQUIFER-INDICATING-ACOUSTIC-SIGNAL`. This combines elements but still relies on the correlation and faces problems in novel environments (is the Sandstone Valley vent an "aquifer-indicating" signal? It indicates *something* else using the same signature).

  **Is it Fatal?** While not necessarily *fatal* to the core ambition of providing a *naturalistic* account of content (it still grounds content in selection history), it **severely undermines the ambition of fixing *determinate, fine-grained* content solely via selection history.**

  *   **Coarse-Grained Success:** Teleosemantics excels at explaining why a state is *broadly* about survival-relevant features (water, food, predators) rather than neural sparks or cosmic rays.
  *   **Fine-Grained Failure:** It struggles to pin down the *specific* property represented (`Aquifer` vs. `Acoustic Signature`) when correlated indicators were present in the evolutionary past. The theory lacks the resources within its core tenets (selection history + function) to decisively break the symmetry between perfectly correlated candidates.

  **Conclusion:** The *Arenae Sapiens* example demonstrates that selection history alone is often insufficient to determine unique, fine-grained mental content due to the problem of perfectly correlated properties in ancestral environments. While teleosemantics provides a powerful naturalistic framework for explaining the *existence* of intentionality and coarse-grained content, this indeterminacy problem suggests it **cannot fully achieve its ambition of fixing uniquely determinate, fine-grained content solely through appeals to biological function.** It highlights a fundamental limitation in grounding meaning purely in historical success, leaving the "aboutness" of specific mental states underdetermined in crucial cases.
