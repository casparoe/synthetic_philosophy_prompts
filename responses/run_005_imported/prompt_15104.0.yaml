prompt: |-
  At work I've been put in charge of designing the scoring system we'll use to evaluate our analysts' probabilistic forecasts, which sent me down a rabbit hole into the accuracy-first epistemology literature — Joyce's original argument, the Predd et al. result on coherence and proper scoring rules, and Pettigrew's book. All of it insists that whatever rule is used to measure a credence's inaccuracy must be strictly proper, or the argument from "minimize expected inaccuracy" to "credences should obey the probability axioms" falls apart, but I don't yet have a real feel for why this property is so load-bearing. Concretely: if I scored forecasts using the plain absolute difference between the stated probability and the eventual outcome (0 or 1), instead of something like the Brier score, what exactly would break — both in the incentives this creates for forecasters and in the philosophical argument for probabilism that's supposed to rest on accuracy-dominance? I'd like an explanation that builds up the intuition rather than one that just restates the proof.
reasoning: |-
  Okay, let me tackle this user's question. They're designing a scoring system for probabilistic forecasts and dove into accuracy-first epistemology. They found that strict propriety is crucial, but they're unsure why. Specifically, they want to know what would break if they used absolute difference instead of Brier score, both in incentives and the philosophical argument for probabilism.

  First, I need to recall why strict propriety matters. Joyce and Pettigrew argue that credences must follow probability axioms to avoid accuracy dominance. If a scoring rule isn't strictly proper, an agent might maximize expected accuracy by misreporting their true belief. For example, with absolute difference, if someone's actual credence is 0.7, they'd get the same expected score by reporting 0.6 or 0.8. That misalignment means they're not incentivized to be honest.

  The user mentioned the absolute difference between probability and outcome. That's the linear scoring rule. I should explain why it's not strictly proper. The math shows that the expected score is minimized at any point between the true probability and the nearest extreme. So if your true p is 0.7, reporting anything from 0.7 to 1.0 gives the same minimal expected score. That's bad because forecasters might exaggerate to 1.0 without penalty, leading to overconfident predictions.

  Next, the accuracy-dominance argument. For probabilism, incoherent credences are accuracy-dominated by some coherent one. But with improper rules, there might be incoherent credences that aren't dominated. For instance, if someone reports 0.6 for rain and 0.6 for no rain, that sums to 1.2, violating additivity. Under Brier, the coherent pair (0.5,0.5) would dominate it. But with absolute difference, the expected inaccuracy might be the same or worse when switching to coherent ones. So the argument falls apart because incoherent forecasts aren't necessarily dominated, weakening the case for probabilism.

  The user works in an applied setting. They need to see practical consequences. Absolute difference could cause forecasters to hedge towards 0.5 or extremes, depending on incentives. If they're risk-averse, they might cluster around 0.5 to avoid big penalties. If reward-seeking, they might go to 0 or 1. Either way, the forecasts don't reflect true beliefs, making them less useful for analysis. Also, aggregating forecasts would be problematic since people aren't honest.

  I should contrast with Brier score, where honesty is the best policy. The quadratic nature penalizes deviations more, encouraging precise calibration. The user might worry about complexity, but the incentives align better. Philosophically, strict propriety ties expected accuracy minimization to coherence. Without it, you can't derive probabilism from accuracy dominance alone. The entire foundation Joyce and Pettigrew built collapses.

  Need to check if I'm missing anything. The Predd et al. result links coherence to propriety via domination. So if the scoring rule isn't proper, the equivalence breaks. That's key. Also, mention that absolute difference can be gamed strategically, which in a workplace setting could lead to distorted data. Maybe give a concrete example: forecasting rain with true p=0.7. Under absolute difference, reporting 1.0 gives same expected score as 0.7, but higher risk. Yet some might take that gamble.

  Finally, summarize that both incentives and philosophical underpinnings fail without strict propriety. The user needs this for both practical design and understanding the theory behind it. Emphasize that while absolute difference seems simpler, it undermines the goal of honest, accurate forecasts and the justification for using probabilities in the first place.
answer: |-
  Your question cuts to the heart of why strict propriety is the linchpin in accuracy-first arguments for probabilism. Let's break down what happens with absolute difference scoring (also called the linear scoring rule) compared to the Brier score (quadratic scoring rule), focusing on incentives and the philosophical argument.

  **The Scoring Rules:**

  1.  **Absolute Difference (Linear Scoring Rule):** `S(p, 1) = -|1 - p| = -(1 - p)`, `S(p, 0) = -|0 - p| = -p` (assuming lower scores are worse/inaccuracy).
      *   *Expected Score* if true probability is `q`: `E[S(p)] = q * [-(1 - p)] + (1 - q) * [-p] = -[q(1 - p) + (1 - q)p] = -[q - qp + p - qp] = -[q + p - 2qp]`
  2.  **Brier Score (Quadratic Scoring Rule):** `S(p, 1) = -(1 - p)^2`, `S(p,  ⁠0) = -(0 - p)^2 = -p^2`.
      *   *Expected Score* if true probability is `q`: `E[S(p)] = q * [-(1 - p)^2] + (1 - q) * [-p^2] = -[q(1 - 2p + p²) + (1 - q)p²] = -[q - 2qp + qp² + p² - qp²] = -[q - 2qp + p²]`

  **What Breaks with Absolute Difference (The Incentive Problem):**

  The core issue is **misaligned incentives for honesty.** A strictly proper rule makes reporting your *true* credence `q` the *unique* way to minimize your *expected* inaccuracy. Absolute difference fails this spectacularly.

  1.  **Truth-Telling is Not Uniquely Optimal:** Look at the expected score for absolute difference: `E[S(p)] = -[q + p - 2qp]`. We want to *minimize* this (make it less negative/more positive). Crucially, **this expression is linear in `p`**.
      *   Calculate the derivative w.r.t `p`: `d/dp [E[S(p)]] = d/dp [-q - p + 2qp] = -1 + 2q`.
      *   The derivative is negative (sloping down) if `2q < 1` (`q < 0.5`).
      *   The derivative is positive (sloping up) if `2q > 1` (`q > 0.5`).
      *   The derivative is zero if `q = 0.5`.
      *   **What does this mean?**
          *   If your true credence `q < 0.5`, the expected score *decreases* (gets worse) as `p` *increases*. To minimize your expected inaccuracy, you should report `p = 0`!
          *   If your true credence `q > 0.5`, the expected score *decreases* (gets worse) as `p` *decreases*. To minimize your expected inaccuracy, you should report `p = 1`!
          *   If your true credence `q = 0.5`, the expected score is *constant* for *any* `p`! Reporting 0.1, 0.5, or 0.9 gives you the *same* expected score.
      *   **Consequence:** A forecaster thinking it's 70% likely to rain (`q = 0.7`) minimizes their *expected* inaccuracy under absolute difference by reporting `p = 1.0` (certain rain). A forecaster thinking it's 30% likely (`q = 0.3`) minimizes expected inaccuracy by reporting `p = 0.0` (certain no rain). Someone at 50% is completely indifferent.

  2.  **Real-World Incentive Distortions:**
      *   **Extreme Overconfidence:** Forecasters are incentivized to *always* predict 0% or 100%, *regardless* of their actual uncertainty. This makes the forecasts useless for decision-making that requires understanding uncertainty (e.g., "Should we cancel the outdoor event if the rain chance is above 30%?").
      *   **No Distinction for Nuance:** Two forecasters with true credences of 0.6 and 0.9 both report 1.0. You lose all information about the *degree* of certainty.
      *   **Gaming the System:** Forecasters quickly learn that hedging (reporting values between 0 and 1) is *never* optimal for minimizing their expected score. Honesty is actively punished or offers no advantage.
      *   **Aggregation Problems:** If you try to average forecasts, you'll just be averaging a bunch of mostly 0s and 1s, losing any meaningful aggregation of dispersed expert opinion. The "wisdom of the crowd" mechanism breaks down.

  **What Breaks with Absolute Difference (The Philosophical Argument):**

  The accuracy-dominance argument for probabilism (Joyce, Pettigrew) has two key parts:

  1.  **Incoherent credences are accuracy-dominated:** For any set of credences that violate the probability axioms (e.g., sum >1, negative values, P(A) > P(B) when A implies B), there exists an alternative set of *coherent* credences that is *more accurate* no matter which possible world turns out to be actual.
  2.  **Coherent credences are not accuracy-dominated:** No set of coherent credences is accuracy-dominated by any other set of credences (coherent or incoherent).

  **Strict propriety is essential for proving both parts, especially the second.** Here's how absolute difference breaks it:

  1.  **Failure of Part 1 (Incoherent Credences *Can* Be Dominated):** The dominance argument *can* still work for *some* types of incoherence under absolute difference. For example, a forecaster who assigns P(Rain) = 0.8 and P(No Rain) = 0.8 (sum=1.6) *is* dominated by the coherent assignment (0.5, 0.5). If it rains, (0.5, 0.5) scores -0.5 - 0.5 = -1.0, while (0.8, 0.8) scores -0.2 - 0.8 = -1.0 (same). If no rain, (0.5, 0.5) scores -0.5 - 0.5 = -1.0, while (0.8, 0.8) scores -0.8 - 0.2 = -1.0 (same). So (0.5, 0.5) is *at least as good* and sometimes better (though not in this binary case with absolute difference). However, absolute difference is *not strictly convex*, so the dominance might not be *strict* in all cases as required by the strongest arguments. The bigger failure is Part 2.

  2.  **Catastrophic Failure of Part 2 (Coherent Credences *Are* Dominated!):** This is where the absolute difference rule completely demolishes the argument for probabilism. **Under absolute difference, coherent credences *can* be accuracy-dominated by *incoherent* credences.**
      *   **Example:** Consider the simple binary case. Let the coherent credence be `q = 0.5`. Its expected inaccuracy is `E[S(0.5)] = -[0.5 + 0.5 - 2*0.5*0.5] = -[0.5 + 0.5 - 0.5] = -0.5`. Crucially, as we saw earlier, *any* report `p` has this *same* expected inaccuracy if `q = 0.5`. Now, consider an *incoherent* credence, say `p_inc = 1.0`. What is its accuracy?
          *   If outcome is 1 (Rain): `S(1.0, 1) = -|1-1| = 0`
          *   If outcome is 0 (No Rain): `S(1.0, 0) = -|0-1| = -1`
          *   Compare to coherent `q=0.5`:
              *   Outcome 1: `S(0.5, 1) = -|1-0.5| = -0.5`
              *   Outcome 0: `S(0.5, 0) = -|0-0.5| = -0.5`
      *   **Dominance Check:**
          *   In World 1 (Rain): `S(p_inc=1.0, 1) = 0` > `S(q=0.5, 1) = -0.5` (1.0 is *more accurate* / less inaccurate)
          *   In World 0 (No Rain): `S(p_inc=1.0, 0) = -1` < `S(q=0.5, 0) = -0.5` (1.0 is *less accurate* / more inaccurate)
          *   **No Dominance:** The incoherent `p=1.0` is better if it rains but worse if it doesn't. The coherent `p=0.5` isn't dominated by `p=1.0`. *However...*
      *   **The Real Problem:** Now consider if the *incoherent* credence `p_inc = 0.5` is actually held by someone? It's coherent. But what if we compare it to an *incoherent* alternative, say `p_alt = 0.6`? Remember, `q=0.5`.
          *   World 1 (Rain): `S(0.5, 1) = -0.5`; `S(0.6, 1) = -|1-0.6| = -0.4` (0.6 is worse)
          *   World 0 (No Rain): `S(0.5, 0) = -0.5`; `S(0.6, 0) = -|0-0.6| = -0.6` (0.6 is worse)
          *   No dominance here either. **The critical failure emerges when we consider dominating the coherent credence using an incoherent one *that isn't just an extreme point*.** Let `q` be any coherent credence *not* 0.5. Say `q = 0.7`.
          *   Consider an *incoherent* credence `p_inc = 0.7` (this is coherent by itself, but imagine it as part of a larger set or just consider the single forecast). Its expected score is minimized by reporting `p=1.0`, as we saw. But compare `p_coherent = 0.7` to `p_inc = 1.0`:
              *   World 1 (Rain): `S(0.7, 1) = -0.3`; `S(1.0, 1) = 0` (1.0 better)
              *   World 0 (No Rain): `S(0.7, 0) = -0.7`; `S(1.0, 0) = -1` (0.7 better)
              *   Again, no strict dominance. **However, the coherent credence `q=0.7` *is* dominated by another *coherent* credence!** Because the rule isn't strictly proper, `p=1.0` (which is coherent for this single event) has the *same* expected inaccuracy from the perspective of `q=0.7` as reporting `p=0.7` does. But `p=1.0` isn't *more accurate* in all worlds. The deeper philosophical break is this: **The accuracy-dominance argument fundamentally relies on the fact that coherent credences are not dominated *by any other set*. Absolute difference violates this because the *expectation-minimizing* report for a coherent credence (`q=0.7`) is an *incoherent strategy* (always report 1.0 or 0.0, which is incoherent across multiple forecasts).** The formal proof (Predd et al.) shows that the set of non-dominated credence assignments under a scoring rule is *exactly* the set of coherent assignments *if and only if* the scoring rule is strictly proper. Absolute difference is not strictly proper, so this equivalence breaks: there are incoherent assignments that aren't dominated (like (0.6, 0.6) might not be strictly dominated by (0.5, 0.5)), and crucially, coherent assignments *might* be dominated or, more accurately, the *argument* that they *cannot* be dominated collapses because the scoring rule doesn't connect coherent credences uniquely to optimality.

  **The Intuitive Takeaway:**

  *   **Incentives:** Absolute difference creates **perverse incentives**. It actively rewards forecasters for being maximally overconfident (reporting 0% or 100%) *regardless* of their true belief. Honesty is never the uniquely best strategy and is often worse. This destroys the value of the forecasts for understanding uncertainty.
  *   **Philosophical Argument:** Absolute difference **severs the crucial link** between minimizing expected inaccuracy and having coherent credences.
      *   Minimizing expected inaccuracy *doesn't* require coherence (it requires reporting 0 or 1 always).
      *   Coherent credences (other than 0.5) *do not* uniquely minimize expected inaccuracy relative to themselves (truth-telling isn't best).
      *   Coherent credences *can* be weakly dominated or, more importantly, the core argument that coherence *protects* you from being dominated falls apart because the scoring rule doesn't respect the probability axioms in its optimization properties. The elegant connection between coherence and non-dominance proven for strictly proper rules **disintegrates**.

  **Why Brier Score Works:**

  1.  **Incentives:** The Brier Score is strictly convex. The derivative of the expected score `E[S(p)] = -[q - 2qp + p²]` w.r.t `p` is `-[-2q + 2p] = 2(q - p)`. Setting this to zero gives `p = q`. The second derivative is 2 (positive), confirming this is the unique minimum. **Truth-telling is the unique best strategy to minimize your expected inaccuracy.** Forecasters are incentivized to be honest and carefully calibrated.
  2.  **Philosophical Argument:** The strict convexity (related to strict propriety) ensures that:
      *   Any incoherent credence set *is* strictly accuracy-dominated by some coherent set.
      *   No coherent credence set is accuracy-dominated by any other credence set (coherent or incoherent).
      *   The proof of probabilism (obey the axioms!) from accuracy dominance goes through.

  **In your role:** Using absolute difference wouldn't just be theoretically unsound; it would produce **useless, wildly overconfident forecasts** because that's what the rule incentivizes. The Brier score (or another strictly proper rule like Logarithmic Score) aligns the forecasters' self-interest (minimizing their expected penalty) with your goal as the designer: obtaining **honest, nuanced, and useful probabilistic assessments** of uncertainty. The philosophical argument shows why strictly proper rules are the *only* ones where demanding coherence (via the scoring rule) isn't arbitrary – it's fundamentally tied to the very idea of accuracy measurement that avoids dominance.
