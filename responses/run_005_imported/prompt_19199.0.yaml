answer: |-
  ## The Case for Radical Surgery: Why Lewis's Triviality Forces Us Beyond Truth Conditions

  Lewis's 1976 proof is a sledgehammer to the idea that indicative conditionals ("If A, then B") express robust propositions while obeying the Adams Thesis (AT): Cr(If A, B) = Cr(B | A). Let's reconstruct its core to see why Stalnaker and Jackson's rescues, while technically possible, mutilate the very concepts they aim to save, making Adams-Edgington's non-cognitivism the less damaging path.

  **Lewis's Triviality Proof (The Core Thrust):**

  1.  **Assumption 1 (Truth Conditions):** "If A, B" expresses a proposition, call it [A→B], with a fixed truth condition in all contexts.
  2.  **Assumption 2 (Adams Thesis Universally):** AT holds for *all* possible rational credence functions Cr.
  3.  **Assumption 3 (Probability Kinematics):** Conditionalization (updating credences on new evidence via Cr_new(-) = Cr(- | E)) is the rational way to update beliefs.
  4.  **The Killer Move:** Consider a specific credence function Cr. Now consider two credence functions obtained by updating Cr on different pieces of evidence:
      *   Cr_B(-) = Cr(- | B)
      *   Cr_{~B}(-) = Cr(- | ~B)
  5.  **Applying AT Universally:** By Assumption 2, AT must hold for Cr, Cr_B, and Cr_{~B}:
      *   Cr([A→B]) = Cr(B | A)
      *   Cr_B([A→B]) = Cr_B(B | A)
      *   Cr_{~B}([A→B]) = Cr_{~B}(B | A)
  6.  **The Substitution & Contradiction:** Since [A→B] is a *fixed proposition* (Assumption 1), its probability under any credence function is just its probability! Crucially:
      *   Cr_B([A→B]) is just the probability of [A→B] *after* conditioning on B. By definition of conditionalization: Cr_B([A→B]) = Cr([A→B] | B)
      *   Similarly, Cr_{~B}([A→B]) = Cr([A→B] | ~B)
      *   But Cr_B(B | A) is 1 (since Cr_B(B) = 1, and assuming Cr_B(A) > 0).
      *   And Cr_{~B}(B | A) is 0 (since Cr_{~B}(B) = 0).
  7.  **The Implosion:** We now have:
      *   Cr([A→B] | B) = 1 (from AT applied to Cr_B)
      *   Cr([A→B] | ~B) = 0 (from AT applied to Cr_{~B})
      *   The Law of Total Probability then dictates:
          Cr([A→B]) = Cr([A→B] | B) * Cr(B) + Cr([A→B] | ~B) * Cr(~B)
          Cr([A→B]) = (1 * Cr(B)) + (0 * Cr(~B)) = Cr(B)
  8.  **Triviality:** But AT also says Cr([A→B]) = Cr(B | A). So we have Cr(B | A) = Cr(B). This must hold for *any* A and B where Cr(A) > 0. This is absurd – my credence in B given A is almost never *identical* to my unconditional credence in B (e.g., Cr(Rain | DarkClouds) >> Cr(Rain)).

  **Lewis proves:** You cannot simultaneously hold AT universally *and* assign a fixed truth condition to the indicative conditional *and* accept standard probability kinematics. Something *must* give.

  **The Rescues and Their Fatal Costs:**

  1.  **Stalnaker's Rescue (Context-Shifting):**
      *   **The Move:** Deny Assumption 1. The proposition expressed by "If A, B" is *not* fixed. It depends on the speaker's (or assessor's) credal state/context. `[A→B]_Cr` ≠ `[A→B]_Cr_B` ≠ `[A→B]_Cr_{~B}`. Lewis's substitution step (using the *same* proposition [A→B] in Cr, Cr_B, Cr_{~B}) is invalid.
      *   **What it Buys:** Preserves the *form* of truth conditions and allows AT to hold *locally* within any single credal state/context.
      *   **The Unbearable Cost:** It utterly destroys the core function of truth conditions – enabling genuine disagreement and shared content. As you argued to your friend:
          *   If the proposition `[A→B]` shifts with *my* credences, then when *I* say "If A, B" (expressing `[A→B]_myCr`) and *you* say "No, if A, ~B" (expressing `[A→~B]_yourCr`), we are *not disagreeing about the same thing*. We are talking past each other. Our utterances express *different propositions* because our credal states differ.
          *   Worse, if *I* update my credences from Cr to Cr_B, the *very meaning* of my earlier utterance "If A, B" changes. It now expresses a *different proposition* (`[A→B]_Cr_B`) than it did when I uttered it (`[A→B]_Cr`). This makes communication and belief retention over time deeply mysterious.
          *   **Verdict:** Stalnaker sacrifices the *interpersonal objectivity* and *temporal stability* of meaning that are the primary motivations for truth-conditional semantics. He saves the *word* "truth condition" while gutting it of its essential function. The cost is philosophical bankruptcy for the truth-conditional project regarding conditionals.

  2.  **Jackson's Rescue (Robustness):**
      *   **The Move:** Keep Assumption 1. The indicative conditional *is* the material conditional (A ⊃ B; equivalent to ~A ∨ B). This has a fixed truth condition. Deny that AT governs *belief* (Cr). Instead, AT governs *assertability*. We assert "If A, B" when Cr(B | A) is high *and* this conditional probability is *robust* with respect to A (i.e., learning A wouldn't drastically lower Cr(B)). The truth condition is material; assertability requires high and robust conditional probability.
      *   **What it Buys:** Preserves fixed, shareable truth conditions. Explains why we don't assert the material conditional *whenever* Cr(~A) is high (it lacks robustness).
      *   **The Unbearable Cost:** It severs the essential connection between *what we believe about a conditional* and the conditional probability that Adams identified as central to our reasoning.
          *   **The Belief Problem:** If "If A, B" *means* A ⊃ B, then my *credence* in it *should* be Cr(~A ∨ B). But AT tells us we *use* Cr(B | A) to guide our actions and inferences involving the conditional. Jackson relegates this to mere assertability. This creates a deep disconnect: Why does Cr(B | A) feel like *the degree to which I believe the conditional itself*? Why do I base my bets *on the conditional* on Cr(B | A), if my actual belief in its truth is Cr(~A ∨ B)? Jackson makes the *meaning* of the conditional irrelevant to its *cognitive role* in reasoning.
          *   **The Weakness Problem:** The material conditional is notoriously weak. "If it rains tomorrow, I'll play tennis" (R ⊃ T) is true if it doesn't rain (~R), regardless of tennis. Jackson argues robustness saves us from asserting it frivolously. But this doesn't change the *truth*. My belief that R ⊃ T *is* largely belief in ~R. This fundamentally misrepresents the *content* of our conditional beliefs and assertions. We assert conditionals to convey something about the *connection* between A and B, not primarily about ~A.
          *   **Verdict:** Jackson saves fixed truth conditions at the cost of making them *irrelevant* to the core cognitive and inferential role of conditionals. It renders the truth condition philosophically inert for explaining our actual use of conditionals. We believe and act *as if* Cr(If A, B) = Cr(B | A), while Jackson insists we *really* believe something else (Cr(~A ∨ B)). This is an unsustainable disconnect.

  **The Adams-Edgington Radical Solution:**

  *   **The Move:** Deny Assumption 1 fundamentally. Indicative conditionals *do not express propositions*. They lack truth conditions. AT is not just a norm for assertion or updating; it *defines the very mental state* expressed by uttering "If A, B". Asserting "If A, B" is the direct expression of a high conditional credence Cr(B | A). The conditional *is* this conditional attitude.
  *   **The Embedding Objection (Your Friend's Counter):** "How can 'It's not the case that if A, B)' or 'Either if A, B or if C, D' or 'If (if A, B), then C' make sense if 'if A, B' has no truth value?"
  *   **The Reply: Semantic Descent (The Way Forward):** Adams and Edgington don't leave embedding unexplained. They propose a systematic *semantic descent*: The meaning of complex sentences embedding conditionals is given *directly in terms of constraints on conditional credences*, bypassing truth values.
      *   **Negation:** "It is not the case that if A, B" expresses *rejection* of Cr(B | A) being high. It asserts a *low* Cr(B | A). This matches our intuition that denying "If it rains, the match is on" means you think rain makes cancellation *likely*.
      *   **Disjunction:** "Either (if A, B) or (if C, D)" expresses that *either* Cr(B | A) is high *or* Cr(D | C) is high (or both). Your credence in the disjunction is high if you are confident that at least one of these conditional probabilities is high. This captures the intuitive force.
      *   **Nested Conditionals:** "If (if A, B), then C" expresses a constraint on a *conditional credence* given a *conditional credence*. Your Cr(C | Cr(B | A) is high) is high. While complex, this *can* be modeled (e.g., via second-order probabilities or by interpreting the antecedent as constraining a partition). It reflects the genuine complexity of reasoning like "If getting an A depends on studying, then I need a tutor".
  *   **What it Buys:** It preserves the core Adams Thesis insight as fundamental. It explains why Cr(B | A) is central to our *use* of the conditional – because that *is* the state being expressed. It avoids Lewis's triviality by removing the fixed proposition that causes the contradiction. It explains the felt weakness of the material conditional – because conditionals aren't about ~A scenarios at all. It maintains interpersonal agreement/disagreement *about the conditional attitude itself*: We agree/disagree about whether Cr(B | A) is high, not about some elusive proposition whose identity shifts.
  *   **The Cost (Acknowledged but Defended):** Yes, it requires a radical departure from standard truth-conditional semantics. Embedding requires a novel, probabilistic semantics. This is a significant revision.
  *   **Why This Cost is Preferable:** The costs of Stalnaker and Jackson are *worse* because they are *covertly destructive* of the goals of truth-conditional semantics.
      *   Stalnaker destroys the *shareability* and *stability* of meaning – the bedrock of truth conditions.
      *   Jackson makes the truth condition *cognitively irrelevant* – severing meaning from belief and use.
      *   Adams-Edgington, while revisionary, offers *honest non-cognitivism*. It provides a *positive, systematic account* (semantic descent) of embedding that *directly reflects the probabilistic role* these constructions play in reasoning and communication. It preserves genuine disagreement about the *same thing*: the level of conditional credence. The complexity of handling embedding within a probabilistic framework is a *technical challenge*, not a philosophical deal-breaker, and progress is being made (e.g., work on logics of conditional probability).

  **The Verdict:**

  Lewis's triviality result forces a trilemma: abandon universal AT, abandon standard probability kinematics, or abandon truth conditions for indicative conditionals. Abandoning AT sacrifices the core insight into how we reason with conditionals. Abandoning kinematics sacrifices fundamental rationality. Stalnaker and Jackson attempt to keep truth conditions by sacrificing universality (Stalnaker) or by severing truth conditions from cognitive role (Jackson). Both sacrifices are fatal to the *point* of truth-conditional semantics – Stalnaker undermines objectivity, Jackson undermines relevance.

  Therefore, the least damaging path is to follow Adams and Edgington: **Abandon truth conditions for indicative conditionals.** Grant that they express conditional credences directly. Confront the embedding challenge head-on with semantic descent. This preserves the core of the Adams Thesis, maintains genuine disagreement about conditional attitudes, and avoids the fatal hidden costs of Stalnaker's contextualism and Jackson's bifurcation. The price of a novel semantics for embedding is real, but it's the price of philosophical honesty and preserving what matters most – how we actually think with "if". Your friend's embedding objection is serious, but the Adams-Edgington program *has* the resources to meet it, while Stalnaker and Jackson's solutions fail at the foundational level they were designed to uphold. Lewis showed the truth-conditional emperor had no clothes; Stalnaker and Jackson offer elaborate invisible robes. Adams and Edgington rightly say it's better just to acknowledge the situation.
