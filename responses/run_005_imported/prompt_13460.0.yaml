answer: |-
  Based on a close reading of both arguments and their philosophical coherence, **Kant's mandate/proxy theory provides the more defensible and philosophically robust foundation for a right against literary piracy**, especially within the context of your novel and the historical realities of the *Nachdruck* problem. Fichte's form/content distinction, while historically influential for later *copyright law*, smuggles in property concepts and creates internal tensions Kant avoids.

  Here's the breakdown and justification:

  1.  **The Core Wrong Identified:**
      *   **Fichte:** The wrong is the *theft of form*. The pirate steals the author's unique, individual *expression* (the specific sequence of words), which is inextricably linked to the author's personhood. The pirate presents this unique form as if it were their own to disseminate. The *content* (ideas) becomes the reader's property upon understanding and isn't stolen.
      *   **Kant:** The wrong is *unauthorized representation*. The pirate acts *as if* they are the agent mandated by the author to speak to the public (to publish). This violates the author's inherent right to control *who* speaks in their name (publishes their work) and *when*. It's a violation of a personal right (a right *in personam*), not a property right (*in rem*) in the work itself.

  2.  **Does Either Avoid Smuggling in Property?**
      *   **Fichte:** **No, it fails this test.** His argument heavily relies on a property-like conception of form.
          *   **"Form as Object":** By splitting the book and declaring form stealable, Fichte implicitly treats "form" *as an object* susceptible to theft – the core definition of property violation. He argues the form is "bound up with the author's individuality," making it uniquely theirs, but then treats this unique connection *as the basis for an exclusive right to control its physical reproduction and dissemination*, which is functionally property.
          *   **The Reader's "Property" in Content:** His assertion that content becomes the reader's "property" upon understanding is philosophically weak and metaphorical at best. How does mere understanding constitute ownership? What rights does this "property" confer? It feels like a rhetorical device to isolate "form" as the protectable element, inadvertently reinforcing the property framework he needs to escape to avoid the problem of ideas-as-property.
          *   **The Smuggling:** Fichte needs to explain *why* stealing "form" is wrong without relying on property. His appeal to the author's individuality is the start, but he doesn't successfully ground the *exclusive right to reproduce and sell* that form in anything *other* than a quasi-property claim derived from that individuality. The individuality justifies uniqueness but not necessarily an exclusive economic/control right over copies.
      *   **Kant:** **Yes, it largely succeeds.** Kant explicitly rejects the book *as an object* being property in the relevant sense (like land or a physical object). Instead, he anchors the wrong in the *author-publisher-public relationship* and the author's *personhood*.
          *   **Focus on Action, Not Object:** The wrong isn't about taking a *thing* (the form or the content), but about *falsely assuming a role* (being the publisher). It's about the pirate's *action* of misrepresenting their authority.
          *   **Negotiorum Gestio:** Your friend is correct. Kant cleverly adapts this Roman law concept (managing another's affairs without their mandate). The pirate is "managing" the author's "affair" (publication) without authorization. The core wrong is this unauthorized interference and misrepresentation, not the taking of a possessed object.
          *   **No Hidden Property:** Kant doesn't need to posit an owned "form" or "expression." The right flows from the author's inherent autonomy to choose *how* and *through whom* they communicate with the public. The "property" language is avoided by focusing on the *relational wrong*.

  3.  **Which Captures the Essence of the Piracy Wrong Better?**
      *   **Fichte:** Captures the *intuitive sense* that the pirate copies something unique *to the author* (the specific words). However, it struggles to explain why copying *that sequence* for dissemination is theft if the ideas (content) are free. Its strength is its intuitive link to authorship, but its weakness is its reliance on quasi-property.
      *   **Kant:** Captures the *practical and relational core* of the wrong experienced by authors and publishers like your character. The pirate *usurps the publisher's role* and *speaks for the author without permission*. This directly undermines the author's control over their public voice and the publisher's legitimate economic interest derived from their authorized mandate. It perfectly aligns with the historical reality where legal enforcement was impossible, making *trust, reputation, and authorized channels* paramount. The wrong is parasitism and misrepresentation, not simple theft.

  4.  **Is Fichte the True Ancestor of Idea-Expression?**
      *   **Superficially, Yes; Philosophically, Less So.** Fichte's *description* of form vs. content is undeniably a precursor to the legal doctrine. However, the *philosophical foundation* he offers for protecting expression (quasi-property based on unique individuality tied to form) is not the foundation modern copyright law *actually relies on* (which is more utilitarian/pragmatic: incentivizing creation). Kant's mandate theory, while not directly describing the distinction, provides a *cleaner philosophical justification* for *why* controlling the dissemination of a specific expression (because it *is* the author speaking) is a personal right, distinct from owning ideas.

  **The Verdict for Your Printer:**

  Kant's argument is superior **philosophically** because it genuinely avoids the property trap Fichte stumbles into. It grounds the wrong in a violation of personal autonomy and authorized agency, not in a contested metaphysical claim about owning expressions. It's **more defensible** because it doesn't rely on the shaky notion of "form" as a stealable object separate from content, or "understanding" conferring property rights on readers.

  **Practically and dramatically for your novel, Kant's argument is perfect:**

  1.  **Fits the Historical Context:** The reliance on "moral suasion" over law is *exactly* about norms of authorized agency, trust, and reputation – the core of Kant's mandate theory. Your printer is railing against the pirate *impersonating* an authorized publisher, undermining the entire system of trust in the book trade. "He has no mandate to speak for Herr Author X!" is a powerful cry.
  2.  **Resonates with a Publisher:** Your printer *is* the authorized agent! Kant's argument directly protects his legitimate business model and role. Fichte's focus on the *author's* form might feel slightly more abstract to a publisher whose livelihood depends on being the chosen conduit.
  3.  **Avoids Philosophical Quicksand:** Trying to explain Fichte's form/content split and its inherent tensions within a pamphlet might bog down your narrative. Kant's argument, based on unauthorized action and misrepresentation, is more concrete and relatable. "This pirate pretends to be what he is not – my house, authorized by the author!" is a clear, emotionally resonant grievance.
  4.  **Highlights the Real Injury:** The injury Kant describes – loss of control over one's public voice, parasitism on the authorized channel, damage to reputation (both author's and publisher's) – is precisely what hurts publishers facing uncontrollable *Nachdruck*. Fichte's "theft of my unique form" might feel secondary.

  **In conclusion:** While Fichte's essay provided a useful descriptive framework, Kant's argument offers the deeper, more coherent, and less metaphysically fraught philosophical foundation for condemning literary piracy. It avoids smuggling in property where it's disclaimed and perfectly captures the wrong as a violation of personal right and authorized agency – making it ideal for your printer's morally outraged, philosophically serious pamphlet in 1790s Leipzig. Put Kant's mandate theory in his mouth. He can passionately argue that the pirate's crime isn't theft, but *fraudulent impersonation* of a publisher authorized to carry the author's words.
