  Assessing both arguments: Kant's approach avoids property by focusing on personal right and mandate. It explains why piracy is wrong even if ideas aren't owned. Fichte's form/content split risks turning "form" into a type of property, which undermines his disclaiming of content as property. Plus, Fichte's argument might not cover cases where form isn't unique, whereas Kant's mandate theory applies broadly.

