prompt: |-
  I spent my career in experimental physics and, since retiring, have become engrossed in social choice theory, beginning with the Gibbard–Satterthwaite theorem. I've volunteered to interview next month's speaker for our local philosophy society's podcast: a game theorist who defends a specific escape route from the theorem, arguing that the NP-hardness of computing a beneficial misrepresentation under several widely used voting rules gives real practical protection against strategic voting, even though the impossibility result stands untouched. Draft eight to ten interview questions that go beyond a restatement of that position. I want at least one question each on the Friedgut–Kalai–Nisan/Procaccia–Rosenschein finding that manipulation becomes easy on average whenever a race is close, on whether worst-case hardness is even the right kind of safeguard given that a dominant-strategy manipulation is only exploitable by a voter who already knows everyone else's ballot, and on why a computational escape is needed at all once Gibbard's own random-dictatorship theorem already gives a complete characterization of strategy-proof randomized rules. For each question, add a short follow-up keyed to the answer she is most likely to give.
