  I remember the concept of "explanatory power." Even if E is known, a theory that explains it well might be preferred over others that don't. The user might have had alternative theories (like ghosts or structural issues), but those weren't considered. The super's theory provides a mechanism that fits perfectly with E, making it salient. Also, the theory predicts E with high likelihood (P(E|T) ≈ 1), whereas other theories might have lower P(E|T). If the user hadn't considered other hypotheses, their implicit priors might shift upon hearing a coherent explanation.

