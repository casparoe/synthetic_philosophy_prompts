  Okay, the user is a stats PhD student with a background in Bayesian hierarchical models and philosophy. They're stuck on a cognitive puzzle about whether an explanation that accounts for already-known data should increase their confidence in that explanation. The radiator bangs only on cold nights, a fact they were already 99% certain about. When the super explains it's due to an air pocket expanding and contracting with temperature changes, their confidence in this explanation shoots up. But logically, since no new data was added, why should their probability update?

  First, I need to recall Bayesian updating. The core idea is that evidence updates prior beliefs to form posterior beliefs. But here, the "evidence" (banging only on cold nights) was already known. So according to strict Bayesianism, P(Theory | Evidence) should equal P(Theory) if the evidence was certain. But the user felt the explanation gained credibility. Why?

