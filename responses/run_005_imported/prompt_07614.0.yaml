  The user's deeper need might be understanding why philosophers see these as distinct. They want clarity on the ontological vs. epistemological divide. Also, they might seek a coherent way to handle vagueness without mysterious cutoffs. Highlighting how supervaluationism's global indeterminacy avoids the epistemicist's mysterious fact could address that.

