  But how does this differ from epistemicism? Epistemicism claims there's one actual cutoff, unknown to us. Supervaluationism says there are many possible cutoffs, but no single actual one. The key is that for supervaluationism, the indeterminacy is ontological, not just epistemological. The lack of a specific cutoff isn't due to ignorance but because the concept doesn't pick one.

  The user's confusion is understandable. Both theories acknowledge sharp boundaries in some sense, but the metaphysical commitment differs. Epistemicism insists on a hidden fact, while supervaluationism uses precisifications as tools without committing to any being real. The user's intuition that supervaluationism avoids sharp boundaries is partially right because it denies that any specific boundary exists in reality.

