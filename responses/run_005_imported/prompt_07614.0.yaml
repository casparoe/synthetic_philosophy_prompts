answer: |-
  You've hit on one of the most subtle and debated points in the philosophy of vagueness! Your friend is **correct about the standard supervaluationist semantics**, and your confusion about how this differs meaningfully from epistemicism is completely understandable. Let's break this down:

  1.  **Your Friend is Right: Supervaluationism DOES Say "There is a Sharp Cutoff"**
      *   Supervaluationism (as developed by Fine, Kamp, Keefe, etc.) works by considering all *admissible precisifications* (or *sharpenings*) of a vague predicate like "heap."
      *   Each precisification *is* a classical, sharp boundary. In each admissible precisification, there *is* a specific grain (say, grain *n*) where adding it makes it a heap.
      *   A sentence is **supertrue** if it's true in *every* admissible precisification. A sentence is **superfalse** if it's false in *every* admissible precisification. Otherwise, it's indeterminate (neither supertrue nor superfalse).
      *   Crucially, the sentence "There is a sharp cutoff point for 'heap' in this sorites series" **IS true in every admissible precisification** (because each one *has* a cutoff). Therefore, this sentence is **supertrue**. Supervaluationism *commits* to the existence of a sharp cutoff *somewhere* in the series.

  2.  **So How is This Different from Epistemicism?**
      The difference lies in **what kind of fact the cutoff is** and **why we can't know/specify it**:

      *   **Epistemicism (e.g., Williamson):**
          *   There is **exactly one, precise, mind-independent fact** about where the cutoff for "heap" is.
          *   Our inability to know it is purely **epistemic**: it's a hidden, inaccessible fact about the world/language. We are irremediably ignorant of this precise boundary.
          *   For any borderline case *n*, the statement "n grains make a heap" is *objectively either true or false*. We just don't know which. Vagueness *is* ignorance.

      *   **Supervaluationism:**
          *   There is **no single, privileged, mind-independent fact** about where the cutoff is.
          *   The "cutoff" exists only relative to *ways of making the vague predicate precise* (precisifications). These precisifications are semantic tools, not reflections of hidden worldly facts.
          *   Our inability to specify "the" cutoff isn't (just) ignorance; it's because **there is no "the" cutoff** in reality. The concept "heap" is inherently indeterminate in the borderline region.
          *   For a borderline case *n*, the statement "n grains make a heap" is **indeterminate** (neither supertrue nor superfalse). It's true in some precisifications and false in others. This indeterminacy is a genuine **lack of truth-value**, not ignorance of a hidden truth-value. Vagueness *is* semantic indecision/indeterminacy.

  3.  **The Crucial Distinction: The Status of the Cutoff**
      *   **Epistemicism:** "There is one, unique, hidden cutoff point *C* (e.g., at grain 3,472). We don't know *C*."
      *   **Supervaluationism:** "There are many equally good, admissible ways to draw a cutoff (e.g., at grain 3,470, 3,471, 3,472, 3,473, ...). *None* of these points *C_i* is *the* real cutoff. The predicate 'heap' simply doesn't select one over the others in reality. Saying 'there is a cutoff' is true only because every way of making it precise *requires* one, not because reality singles one out."

  4.  **What's Left of the "Avoiding Sharp Boundaries" Intuition?**
      Supervaluationism avoids sharp boundaries **in a specific, crucial way** that epistemicism does not:

      *   **No *Specific* Boundary:** While it says *a* boundary exists *somewhere*, it **denies that any *particular* point *n* is *the* boundary** in the actual, vague world. For *any specific n* you pick in the borderline region, the statement "The cutoff is at grain *n*" is **indeterminate** (false in some precisifications, true in others). Epistemicism says that for one specific *n*, this statement is *objectively true*, we just don't know which *n* it is.
      *   **Indeterminacy of Borderline Cases:** Supervaluationism genuinely renders borderline cases truth-valueless. Epistemicism insists they have a definite truth-value we can't access.
      *   **The Tolerance Principle:** Supervaluationism explains why the Tolerance Principle ("If *n* grains aren't a heap, then *n+1* grains aren't a heap") seems true but leads to paradox: it's *almost* supertrue (true in *almost* all precisifications) because admissible precisifications only differ by small amounts. However, it's **not** supertrue because *no* precisification can satisfy it consistently across the whole series (every precisification violates it at its specific cutoff point). This captures the *appearance* of tolerance without committing to it being universally true. Epistemicism flatly rejects the Tolerance Principle as false everywhere, even if we can't detect where it fails.
      *   **Metaphysical Commitment:** Epistemicism posits a mysterious, unknowable, precise fact about inherently vague concepts. Supervaluationism avoids this by grounding the indeterminacy in the *semantics* – the meaning of "heap" doesn't determine a unique extension, it determines a *range* of equally good extensions. The precisifications are ways of modeling meaning, not descriptions of hidden reality.

  5.  **The "With Extra Steps" Feeling & Why They Are Opposed**
      Your feeling that supervaluationism seems like "epistemicism with extra steps" is common. Both agree "There is a sharp cutoff" is true. The fundamental opposition is:

      *   **Epistemicism:** Vagueness = **Ignorance** of a precise fact.
      *   **Supervaluationism:** Vagueness = **Indeterminacy** (lack of a precise fact).

      Philosophers treat them as opposed because they offer fundamentally different *explanations* for the phenomenon of vagueness and make different claims about the *nature* of truth and reality for borderline cases. Epistemicism insists on bivalence (every meaningful statement is true or false) even for borderline cases, while supervaluationism rejects bivalence for borderline cases. This is a deep metaphysical and semantic divide.

  **In Summary:**

  *   **Yes, your friend is correct:** Standard supervaluationist semantics makes "There is a sharp cutoff" supertrue.
  *   **The difference lies in the *status* of that cutoff:**
      *   Epistemicism: One unique, hidden, real cutoff (unknown).
      *   Supervaluationism: Many admissible cutoffs (semantic tools), no single real one (indeterminacy).
  *   **What survives of the intuition:** Supervaluationism avoids committing to **any specific grain *n* being *the* precise boundary** in reality. It explains borderline cases as genuinely truth-valueless and avoids positing unknowable precise facts about vague concepts, offering a semantic rather than purely epistemic account of vagueness. The "sharp boundaries" exist only as features of the precisifications used to model meaning, not as features of the actual world described by the vague predicate.

  The debate continues because both views face challenges (e.g., epistemicism's mysterious cutoffs, supervaluationism's handling of higher-order vagueness and the truth of "there is a cutoff"). However, the distinction between ignorance and indeterminacy remains the core reason they are considered distinct and opposed theories.
