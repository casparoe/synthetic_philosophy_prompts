answer: |-
  That's an **excellent and genuinely deep worry**—one that cuts to the heart of accuracy-first epistemology (AFE). You're not misunderstanding; you've identified a core tension. However, AFE proponents (like Joyce, Pettigrew, Leitgeb, Easwaran, etc.) have a sophisticated response grounded in the *structure of scoring rules* and the concept of *dominance avoidance*. Here's the breakdown:

  ### The Core Problem (As You Stated)
  1.  **Intuition:** If accuracy is the *sole* epistemic good, and a credence of 1.0 in a true proposition gets the *highest possible accuracy score* (while any lower credence gets a lower score), shouldn't rationality demand maximal confidence whenever possible?
  2.  **Conflict:** This seems to recommend *extremism* (always assign 1.0 or 0.0), but the literature demonstrably recommends *calibration/proportioning* (assigning credences that match the strength of evidence, e.g., 0.7 for a proposition with 70% probabilistic support).

  ### The AFE Response: Proper Scoring Rules and Dominance
  The resolution lies in how AFE defines "accuracy" operationally using **proper scoring rules** and the requirement that rational credences avoid being **accuracy-dominated**.

  1.  **Scoring Rules Define Accuracy:**
      *   AFE doesn't use a naive "closeness to 1.0 if true" metric. It uses *scoring rules* like the **Brier Score** or **Logarithmic Score** to quantify inaccuracy for a credence `c` in proposition `A`:
          *   **Brier Score:** `Inacc(c, A) = (1 - c)^2` if `A` is True, `(0 - c)^2` if `A` is False.
          *   **Log Score:** `Inacc(c, A) = -log(c)` if `A` is True, `-log(1 - c)` if `A` is False.
      *   Crucially, these rules are **strictly proper**.

  2.  **What "Strictly Proper" Means:**
      *   A scoring rule is *strictly proper* if your *expected inaccuracy* (according to your own credence function `p`) is *minimized uniquely* when you report your true credence `c = p(A)`.
      *   **Example (Brier):** Suppose your true credence it will rain tomorrow is `p(Rain) = 0.6`.
          *   Your *expected inaccuracy* if you report `c = 0.6`:
              `E[Inacc] = p(Rain)* (1-0.6)^2 + p(No Rain)*(0 - 0.6)^2 = (0.6)(0.16) + (0.4)(0.36) = 0.096 + 0.144 = 0.24`
          *   Your *expected inaccuracy* if you report `c = 1.0`:
              `E[Inacc] = p(Rain)*(1-1)^2 + p(No Rain)*(0-1)^2 = (0.6)(0) + (0.4)(1) = 0.4`
          *   Your *expected inaccuracy* if you report `c = 0.5`:
              `E[Inacc] = p(Rain)*(1-0.5)^2 + p(No Rain)*(0-0.5)^2 = (0.6)(0.25) + (0.4)(0.25) = 0.15 + 0.10 = 0.25`
          *   **Conclusion:** `0.24` (reporting `0.6`) < `0.25` (reporting `0.5`) < `0.4` (reporting `1.0`). Reporting your true credence `0.6` minimizes your *expected inaccuracy* relative to your own beliefs.

  3.  **Why Extremism is Punished (Robustness):**
      *   While `c=1.0` gets a *perfect score* if `A` is true (`Inacc=0`), it gets the *worst possible score* if `A` is false (`Inacc=1` for Brier).
      *   A calibrated credence `c=0.6` gets a *decent score* whether `A` is true (`Inacc=0.16`) or false (`Inacc=0.36`). It's *robust* across possibilities.
      *   **Dominance Avoidance:** A credence function `p` is **accuracy-dominated** if there exists *another* credence function `q` such that `q` is *at least as accurate* as `p` in *every possible world*, and *strictly more accurate* in at least one world.
      *   **Joyce's Argument (1998/2009):** *Incoherent* credence functions (violating probability axioms) are *always* accuracy-dominated by *some coherent* credence function, when using a proper scoring rule. Coherence is necessary to avoid being dominated.
      *   **The Extremism Problem Revisited:** An extremist credence `c=1.0` in `A` is *dominated* by a slightly less extreme credence (e.g., `c=0.99`), *if* `p(A) < 1`. Why?
          *   If `A` is True: `Inacc(1.0) = 0` < `Inacc(0.99) = (0.01)^2 = 0.0001` (Extremist wins slightly).
          *   If `A` is False: `Inacc(1.0) = 1` >> `Inacc(0.99) = (0.99)^2 = 0.9801` (Less extreme wins significantly).
          *   **Crucially:** The *massive loss* if wrong outweighs the *tiny gain* if right. There exists a world (where `A` is False) where `c=0.99` is *strictly more accurate* than `c=1.0`. No possible world exists where `c=1.0` is strictly more accurate than a calibrated `c=p(A)` while `c=p(A)` is less inaccurate when wrong. Avoiding dominance *requires* proportioning.

  4.  **Calibration Falls Out:**
      *   The credence that uniquely minimizes your *expected inaccuracy* (relative to your *own* beliefs) is your true credence `p(A)`. This *is* calibration/proportioning.
      *   Updating by conditionalization (Greaves & Wallace) can be justified as the method that maximizes *expected accuracy* (using a proper scoring rule) from your prior perspective.
      *   **The "Real Normative Work":** It *is* still being done by accuracy! But "accuracy" is being measured in a very specific, nuanced way via strictly proper scoring rules. These rules inherently encode the idea that:
          *   Accuracy matters more when you're confident (penalizing confident falsehoods heavily).
          *   Epistemic rationality is about managing accuracy *expectations* and avoiding *guaranteed avoidable losses* (dominance) across all possible states of the world, not just optimizing for the single actual world (which you don't know).

  ### Addressing Your Legit Worry
  Your worry **is legitimate** in the sense that it highlights a crucial dependency of AFE:

  *   **The Framework Relies Heavily on Proper Scoring Rules:** If AFE used a linear scoring rule (`Inacc = |1-c|` if True, `|0-c|` if False), extremism *would* be optimal. The choice of a strictly proper (and typically convex) scoring rule like Brier or Log is essential. Proponents argue these rules are the *correct* way to measure epistemic disutility because they:
      1.  Enforce coherence (via dominance arguments).
      2.  Enforce calibration (via expected accuracy minimization).
      3.  Reflect the intuitive idea that being *confidently wrong* is worse than being *hesitantly wrong*.
  *   **"Accuracy" Isn't Naive:** AFE isn't using a pre-theoretic, simplistic notion of accuracy. It's using a *theoretically loaded* notion defined by proper scoring rules. The defense is that this loaded notion *captures* our core epistemic values (avoiding confident falsehoods, valuing true confidence, coherence) better than a naive notion.
  *   **Is Something Else Sneaking In?** It's fair to ask if the scoring rule is smuggling in values *beyond* accuracy. The AFE response is that the properties of the scoring rule (heavily punishing confident falsehoods, rewarding true confidence) *are constitutive of* what it means for a credence to be epistemically valuable – they *define* accuracy-first epistemic utility. There isn't an independent "calibration" value; calibration emerges as the strategy that best promotes accuracy *as measured by a rule that cares about gradations of confidence*.

  ### Conclusion
  You haven't missed something obvious; you've hit a foundational point. The answer is that **accuracy-first epistemology avoids recommending extremism because it defines "accuracy" using strictly proper scoring rules, and the central norm is to avoid being accuracy-dominated.** Calibration/proportioning falls out as the unique strategy that minimizes *expected* inaccuracy relative to your own beliefs and avoids being dominated by alternative credences. While the reliance on specific scoring rules is a point of debate (e.g., why Brier/Log and not another rule?), proponents argue these rules best capture the core epistemic goal when combined with dominance avoidance. Your worry pushes you towards engaging critically with the justification for using strictly proper scoring rules – which is exactly where a lot of the interesting philosophical action in AFE resides. This is excellent fodder for your quals paper!
