prompt: |-
  So I'm drafting a section of my quals paper on accuracy-first epistemology / epistemic utility theory (Joyce, Pettigrew, etc) and I keep getting stuck on something that feels like a genuine problem with the view, unless im missing something obvious. If credences are only epistemically good insofar as they're accurate, shouldn't the norm that falls out of the theory just be "go as extreme as possible," since a maximally confident credence in whatever's actually true is literally more accurate than any hedged credence in that same truth? But the literature always ends up recommending calibration instead, i.e. proportioning your confidence to the evidence rather than maxing it out. Feels like the real normative work is being done by something other than accuracy, and "accuracy" is just along for the ride. Is that a legit worry about the framework, or am I misunderstanding how the scoring rules are supposed to be doing the work here?
reasoning: |-
  Okay, the user is working on a quals paper about accuracy-first epistemology and epistemic utility theory, focusing on Joyce and Pettigrew. They're stuck on what seems like a problem: if the goal is accuracy, why not always have extreme credences? Because being 100% confident in the truth is more accurate than any less extreme credence. But the literature recommends calibrated credences instead. They're worried that accuracy isn't doing the real normative work here.

  First, I need to recall why extreme credences aren't recommended. The key is the scoring rules used to measure accuracy. If we used a linear rule, then yes, extremes would be better. But in epistemic utility theory, they use proper scoring rules like the Brier score. These rules penalize both overconfidence and underconfidence. So a calibrated credence minimizes expected inaccuracy even when you're not sure what's true.

  The user might be missing that the theory uses expected accuracy. Since you don't know the truth, you have to consider possible worlds. A proper scoring rule ensures that the credence matching the evidence is the one that's best across those worlds. So calibration is rational because it's robustly accurate, not just in the actual world.

  Another point is that Joyce's argument shows that incoherent credences are accuracy-dominated. That means there's always a coherent alternative better in every possible world. So coherence is necessary. But the user's concern is about extremeness vs calibration. Pettigrew's approach uses scoring rules to justify conditionalization and other norms by maximizing expected accuracy.

  The user's deeper worry might be that accuracy alone isn't sufficient; maybe other values are sneaking in. But the response is that proper scoring rules encode the idea that accuracy matters more when you're more confident. So the scoring rules themselves are justified by accuracy considerations. They're not adding extra values but defining how to measure accuracy properly.

  I should explain the Brier score example. If it's raining, credence 1 gets 0 inaccuracy, 0.5 gets 0.25. But if it's not raining, credence 1 gets penalized heavily (1), while 0.5 only gets 0.25. So the expected score for 0.5 is better when you're uncertain. That's why extremism isn't optimal.

  Also, mentioning Greaves and Wallace's expected accuracy argument for conditionalization. Updating credences by evidence maximizes expected accuracy. So calibration naturally falls out from that.

  The user's misunderstanding might be thinking of accuracy only in the actual world. But since we don't know the truth, rational credences must consider all possibilities. Proper scoring rules ensure that calibrated credences are best even when the truth is unknown.

  I need to clarify that the scoring rules are part of defining epistemic utility, which is tied to accuracy. So there's no additional value; it's all about accuracy, but measured in a way that accounts for confidence. The literature's push for calibration comes from these scoring rules, not external factors.

