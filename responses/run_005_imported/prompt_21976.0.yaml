    Philosopher: "Simple. If T2 is true, there are a trillion observers. If T1, only a billion. So, by the Self-Indication Assumption, T2 is a thousand times more likely. Therefore, you can relax: your experiment is almost certainly going to confirm T2."

    The physicist, furious, throws his beer in the philosopher's face.

    Philosopher (wiping his face, unperturbed): "Ah, but under SIA, the fact that I'm now wet doesn't change the odds. There are so many possible observers who are dry that it's still overwhelmingly likely that T2 is true. In fact, this incident only increases my confidence: because in a small universe like T1, it would be astronomically improbable that I, of all people, would be the one to get beer thrown at me. But in a big universe, there are many more people who get beer thrown at them, so it's more likely that I'm one of them. Therefore, T2 is even more probable!"

