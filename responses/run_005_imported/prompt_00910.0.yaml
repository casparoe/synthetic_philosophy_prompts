answer: |-
  You've zeroed in on the most philosophically subtle part of Sidgwick's argument. He is **not** simply conceding that fraud can never be logically excluded**. Instead, he is articulating a pragmatic *epistemic criterion* for when investigators have discharged their responsibilities, shifting the burden of proof onto the skeptic and making the fraud allegation *unreasonable* rather than merely logically available. Here's a breakdown of his argument and its rationale:

  1.  **The Epistemic Goal: Overwhelm Skepticism:** Sidgwick acknowledges that scientific skepticism ("scientific incredulity") towards psychical phenomena is deeply entrenched ("long in growing... many and strong roots"). Overcoming it requires not a single "decisive" proof, but an overwhelming accumulation of evidence ("burying it alive under a heap of facts"). This is a battle of cumulative plausibility, not deductive certainty.

  2.  **The Role of the Investigator's Trustworthiness:** Sidgwick identifies the investigator's credibility as the *limiting factor* for the demonstrative force of any *single* investigation. If the investigator is impeccable in their methods, thorough, and credible, the *only* objection left to the critic is to impugn the investigator's integrity – to allege they are "in the trick" (committing fraud or colluding).

  3.  **The Criterion of Sufficiency:** Sidgwick explicitly states: **"We have done all that we can when the critic has nothing left to allege except that the investigator is in the trick."** This is the key point. He is setting a standard for when the *investigator's work* is complete:
      *   All reasonable methodological objections have been addressed.
      *   Alternative explanations (e.g., coincidence, misperception, normal psychological states) have been ruled out or shown implausible *for this specific case*.
      *   The only remaining *ad hominem* objection is fraud by the investigator themselves.
      *   At this point, Sidgwick argues, the investigators have fulfilled their epistemic duty *for that specific case*. They cannot *force* belief; they can only present the evidence and eliminate reasonable doubt.

  4.  **The Status of the Fraud Allegation:**
      *   **Not Logically Excluded:** Sidgwick readily concedes that fraud can *never* be logically excluded with absolute certainty in any human testimony or experiment ("he will allege that"). Absolute proof against all conceivable fraud is impossible.
      *   **Shifted Burden & Unreasonableness:** However, when fraud becomes the *only* objection left standing *after* rigorous investigation has addressed all other avenues of doubt, Sidgwick implies the burden shifts decisively to the skeptic. To persist *only* with the fraud allegation, without *specific evidence* of fraud *in this specific case*, becomes unreasonable. It's a retreat to a position demanding an impossible standard of proof. Sidgwick treats this state ("nothing else left to allege") as the point where the evidence *should* be convincing, even if it isn't universally accepted.

  5.  **Why Cumulative Evidence (Multiple Witnesses/Investigators) Helps Against Fraud:**
      *   **Independent Corroboration:** This is crucial. Sidgwick's opening reference to De Morgan ("every additional witness who has a fair stock of credit") points to the solution. If Witness/Investigator A reports phenomenon X under conditions where fraud by A is the *only* remaining objection, that's significant but vulnerable.
      *   **Reducing Plausibility of Collusion/Fraud:** When Witness/Investigator B (independent of A, credible, using sound methods) *also* reports X under conditions where fraud by B is the *only* remaining objection, the fraud hypothesis becomes much less plausible. It now requires either:
          *   Fraud by A *and* fraud by B (two separate, independent deceptive acts).
          *   Or, collusion between A and B.
      *   **Exponential Implausibility:** As credible, independent investigators (C, D, E...) *each* produce results where fraud by *that specific individual* is the only remaining plausible objection *for their case*, the hypothesis needed to dismiss *all* the evidence becomes increasingly baroque:
          *   It requires either a vast, undetected conspiracy among numerous independent, seemingly credible researchers, *or*
          *   A series of independent fraudulent acts by individuals who otherwise show no sign of dishonesty or motive in this specific domain.
      *   **Overwhelming the Fraud Hypothesis:** The sheer *mass* of independently corroborated cases, each standing on its own merits to the point where only a fraud allegation against its specific investigator remains plausible, makes the *global* fraud hypothesis (necessary to dismiss the entire phenomenon) incredibly improbable. It becomes far less reasonable than accepting the phenomenon. This is the "heap of facts" burying skepticism.

  **In essence, Sidgwick's argument is this:**

  1.  For any *single* well-investigated case, the highest standard achievable is that the *only* reasonable objection left is fraud by the specific investigator involved. At this point, the case is evidentially strong.
  2.  However, skepticism rooted in prior commitments will likely persist based *only* on this fraud allegation.
  3.  The antidote is **multiple independent cases**, each reaching this high standard.
  4.  The accumulation of such cases makes the *aggregate* fraud hypothesis (necessary to explain *all* the evidence away) implausible to the point of unreasonableness. The burden of proof shifts entirely to the skeptic to provide positive evidence for widespread fraud or collusion, rather than just gesturing at its logical possibility.
  5.  Therefore, the Society should focus on building this mass of independently verified facts ("pegging away," "accumulate fact upon fact") rather than getting bogged down in endless arguments over the absolute, unattainable "conclusiveness" of any single case against the most extreme skeptic who will always cry fraud.

  **He is proposing a criterion for when inquiry into a *specific case* can reasonably rest (when only fraud remains as an objection) and arguing that the cumulative weight of *many cases* reaching this criterion provides overwhelming evidence for the reality of the phenomenon, rendering persistent skepticism based solely on the *possibility* of fraud unreasonable.** It's a pragmatic argument about the standards of evidence and the burden of proof in the face of deep-seated skepticism concerning extraordinary claims.
