prompt: |-
  Kind of a random thing but it's been bugging me all week. We're in the middle of selling our house, which sits at the bottom of a hill that used to flood almost every spring until we dropped about $15k on a sump pump + drainage system that kicks on automatically the second water starts pooling - we haven't had so much as a damp carpet in 8 years since. Now the buyer's mortgage lender is requiring flood insurance because we're technically mapped in a high-risk flood zone, and my realtor thinks that's ridiculous - her point being the house basically doesn't flood anymore, so why price it like it's risky. Somethin about that argument feels too quick to me tho - has the actual flood risk gone away, or is it just being stopped every single time, and if the power ever goes out mid-storm or the pump breaks aren't we suddenly right back to square one? Who's actually got the right read on this, me, my realtor, or the insurance company?
reasoning: |-
