  The user also mentioned Ptolemy of Lucca completing "De Regno," which complicates the authenticity. Questions should explore how much the reconstruction relies on potentially non-authentic parts. Also, how to reconcile the early cautious chapters with the later permissive ones, especially if Ptolemy wrote them.

