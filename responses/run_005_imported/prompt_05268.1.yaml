answer: |-
  Here are 10 interview questions designed to press on the tensions in your guest's Aquinas reconstruction, incorporating your specific requests and anticipating common defenses:

  1.  **The Core Asymmetry Challenge:** My friend argues Aquinas's title/exercise distinction creates a "convenient asymmetry": the prudential cautions against tyrannicide found prominently in the authentic early chapters of *De Regno* (risk of worse successors, flawed assassins, danger to good rulers) seem equally applicable to killing a usurper as to killing a hereditary tyrant. Doesn't this fatally undermine the moral coherence of allowing private persons to kill one but not the other?
      *   *Likely Response:* She'll argue the *lack of legitimacy itself* creates a fundamentally different moral/legal situation, making the usurper analogous to a brigand from the start, outside the protection of law/office, thus bypassing the prudential *political* cautions meant for *legitimate authorities*.
      *   **Follow-Up:** But if the prudential dangers (worse successor, flawed actor, precedent endangering good rulers) are *consequences in the real world* regardless of the tyrant's original title, why wouldn't Aquinas's own prudential wisdom demand applying those cautions universally? Isn't the distinction then primarily juridical/formal rather than grounded in the concrete common good outcomes he prioritizes?

  2.  **Reconciling Early Caution & Later Permissiveness:** In the securely authentic early chapters of *De Regno*, Aquinas counsels endurance under tyranny, emphasizing the dangers of resistance. Yet, elsewhere (e.g., *Commentary on the Sentences*, *ST II-II Q42*), he seems more open to resisting/killing *usurpers*. How do you reconcile this cautious, endurance-focused Aquinas with the one permitting lethal action against usurpers? Does the later stance represent a development, a different context, or perhaps a tension within his own thought?
      *   *Likely Response:* She'll emphasize context: *De Regno* is practical advice to a ruler (the King of Cyprus) on *ruling well* and avoiding tyranny, hence stressing the dangers *of resistance*. The other texts are more abstract *theoretical* discussions of justice and authority.
      *   **Follow-Up:** But doesn't the theoretical permissibility against usurpers in *ST* or the *Sentences Commentary* fundamentally clash with the *prudential absolutism* against resistance implied in the authentic *De Regno*? If the dangers are truly universal and catastrophic (as *De Regno* suggests), shouldn't that theoretical permissibility be practically nullified by prudence, even for usurpers?

  3.  **The Problem of Captured Authority:** Your reconstruction reserves deposing a *legitimate-but-tyrannical* ruler solely for the public body that instituted him. But what recourse exists when that very public body is itself captured by, complicit with, or terrified of the tyrant? If the instituting authority is paralyzed or corrupted, does Aquinas's framework functionally condemn a people to suffer under a legitimate tyrant indefinitely, even while permitting action against a usurper?
      *   *Likely Response:* She'll likely concede this is a serious difficulty but argue Aquinas's structure prioritizes order and avoids anarchy. The solution lies in the original body reforming itself or, perhaps, a *truly universal* uprising representing the *whole* community *as* the ultimate authority, though this is extremely dangerous and not "private" action.
      *   **Follow-Up:** Isn't this distinction between a "corrupted instituting body" and "the whole community acting *as* the instituting authority" incredibly nebulous and practically unworkable? Doesn't it risk collapsing back into justifying popular revolt, precisely what the restriction to the *original* instituting body was meant to prevent? How does Aquinas himself navigate this potential contradiction?

  4.  **The Burden of Ptolemy:** A significant portion of *De Regno*, including passages relevant to tyranny, was completed by Ptolemy of Lucca after Aquinas's death. Ptolemy held more overtly republican views. How much interpretive weight does your reconstruction place on material from the later, Ptolemaic books? Could the more permissive or republican-sounding elements sometimes attributed to Aquinas on tyranny actually reflect Ptolemy's distinct perspective?
      *   *Likely Response:* She'll argue that scholars can distinguish Thomistic core ideas from Ptolemaic elaborations based on style, consistency with Aquinas's other works, and manuscript evidence. She might downplay Ptolemy's influence on the core "title vs. exercise" distinction or argue it's implicit in Aquinas's authentic principles.
      *   **Follow-Up:** Let's be specific: Take the idea that a *princeps* who becomes a tyrant can be judged by the *provincia* or *civitas* that elected him (often cited from later *De Regno*). If this passage is Ptolemaic (reflecting his republicanism), doesn't that significantly weaken the textual basis for claiming Aquinas *himself* envisioned a formal "instituting body" as the sole legitimate deposer for *hereditary* monarchs? What secure *Aquinas* text explicitly mandates this restriction for originally legitimate rulers?

  5.  **Prudence vs. Principle:** Aquinas places immense weight on prudence (*prudentia*). Given the overwhelming prudential cautions he raises against *any* tyrannicide – cautions focused on likely *bad outcomes* – how can the *theoretical* permissibility against usurpers ever be more than a purely abstract point? Doesn't prudence, in the Aquinas system, effectively *trump* the theoretical justice of killing even a usurper in almost all conceivable real-world scenarios?
      *   *Likely Response:* She'll argue that while prudence is paramount, it must operate *within* the framework of justice. The justice of removing a brigand-usurper is clear; prudence dictates the *how* and *when* (ensuring public good, capable actor, high chance of success, no better option). The theoretical permissibility sets the just boundary; prudence governs action within it.
      *   **Follow-Up:** But Aquinas's listed dangers (ambitious assassins, worse successors, danger to good rulers) seem like near-universal probabilities in fallen human politics. Doesn't this make the "prudential when" condition virtually impossible to meet, rendering the theoretical permissibility practically meaningless? Is there *any* historical example Aquinas might have considered to meet his prudential bar for killing a usurper?

  6.  **The "Acting for the Common Good" Threshold:** For a private person to licitly kill a usurper, they must be acting *for the common good*, not private gain. Given Aquinas's deep suspicion of human motivation (*ST I-II, Q. 14, A. 1*) and his specific warning about assassins being moved by ambition, how could any private individual *ever* be sufficiently certain of their *own* pure motives and the *actual outcome* to meet this criterion? Isn't this an impossibly high bar?
      *   *Likely Response:* She'll agree it's an extremely high bar, emphasizing it requires heroic virtue and near certainty of pure intent *and* beneficial outcome. It's meant to be rare, not routine. The criterion underscores why such action is exceptional and dangerous.
      *   **Follow-Up:** If the bar is *so* high that it's practically unattainable due to human sinfulness and epistemic limitations (can anyone *really* know the outcome?), doesn't this functionally nullify the permission, aligning it more closely with the stance on legitimate tyrants? Doesn't Aquinas's anthropology itself work against the practical application of his own distinction?

  7.  **The "Higher Authority" Loophole:** The permission requires "no possibility of appeal to a higher authority." In the fragmented political reality of medieval Europe (Empire, Papacy, complex feudal hierarchies), was there *ever* truly "no higher authority" to appeal to? Couldn't a clever defender of *any* ruler (even a blatant usurper) always point to *some* theoretical superior (Pope, Emperor) to block the permission for private action?
      *   *Likely Response:* She'll argue Aquinas meant a *practically effective* higher authority capable of providing timely remedy. Appeals to distant, powerless, or disinterested superiors (like an Emperor with no real power in a specific kingdom) wouldn't count. The test is practical efficacy, not just theoretical hierarchy.
      *   **Follow-Up:** But doesn't this "practical efficacy" criterion introduce massive subjectivity and potential for self-serving interpretation? Who decides if the Pope/Emperor *could* or *would* act effectively? Doesn't this ambiguity create a huge loophole allowing supporters of a usurper to *always* claim some higher appeal exists, thereby shielding the usurper?

  8.  **Legitimacy Beyond Formalism:** Your friend's critique implies Aquinas's distinction protects "actually-existing Christian kings." Setting aside formal title, if a hereditary king rules as a vicious tyrant (*exercitio*), while a usurper who seized power rules moderately well (*exercitio*), does Aquinas's framework force us to condemn resistance against the tyrant king while permitting it against the moderate usurper? Doesn't this prioritize the *origin* of power over its *actual use* in a way that seems perverse from the perspective of the common good, Aquinas's ultimate standard?
      *   *Likely Response:* She'll argue that legitimacy *matters* for order and justice. The formal legitimacy of the king provides a baseline of stability and a clear path (however difficult) for lawful removal. The usurper lacks this, creating a state of inherent injustice and lawlessness that *requires* correction for the common good to be restored. The good acts of a usurper don't erase the original sin of usurpation.
      *   **Follow-Up:** But if the common good is flourishing *now* under the usurper, and suffering terribly under the legitimate tyrant, doesn't Aquinas's framework prioritize abstract justice (punishing the usurper's past act) over concrete present well-being? Is the "inherent injustice" of usurpation so absolute that it outweighs the tangible, ongoing damage caused by a legitimate tyrant?

  9.  **The Specter of Regicide:** How much do you think Aquinas's specific distinction, particularly the strong protection afforded to *legitimately titled* rulers no matter how tyrannical, was shaped by a desire to absolutely condemn regicide – the killing of an *anointed king* – which carried immense theological and cultural taboo, distinct from killing a mere usurper?
      *   *Likely Response:* She'll likely acknowledge this context is important. The sacral nature of kingship in medieval Christendom undoubtedly influenced the emphasis on the inviolability of the *person* of the legitimately titled ruler, even if the *office* could be forfeited through tyranny. The distinction protects the *sacred* aspect of legitimate rule.
      *   **Follow-Up:** Doesn't this cultural/religious context then significantly undermine the claim that the title/exercise distinction is derived *purely* from philosophical principles about justice, authority, and the common good? Isn't it, at least partially, a theological-political *compromise*?

  10. **Enduring Relevance vs. Historical Context:** Given these tensions – the asymmetry challenge, the prudential cautions, the problem of captured authority, the burden of Ptolemy, and the medieval context of sacral kingship – how robust or universally applicable do you believe Aquinas's reconstructed framework on tyrannicide *actually* is for contemporary political thought? Does it offer a viable guide, or is it primarily a fascinating but context-bound historical position?
      *   *Likely Response:* She'll argue that while the *specific medieval forms* change, the core principles – the importance of legitimacy, the dangers of arbitrary violence, the distinction between removing authority and punishing a person, the supremacy of the common good, the role of designated authorities – remain profoundly relevant for thinking about resistance, revolution, and constitutional order today.
      *   **Follow-Up:** But if the *application* of these principles leads to such potentially counter-intuitive or paralyzing outcomes (protecting monstrous legitimate rulers, requiring impossibly pure assassins, relying on hopelessly corrupted institutions), does the framework provide meaningful practical guidance, or does it mainly serve as a cautionary tale about the intractable difficulties of resisting tyranny within *any* legalistic framework?

  **Key to Pressing:** The follow-ups consistently push towards the *practical implications* and *internal tensions*. They challenge whether the distinctions hold under pressure (prudence vs. principle, outcome vs. origin), question the workability of key criteria (motive, higher authority, instituting body), probe the influence of non-Thomistic material (Ptolemy), and highlight potential contradictions with Aquinas's own emphasis on the common good and prudence. Good luck with the interview!
