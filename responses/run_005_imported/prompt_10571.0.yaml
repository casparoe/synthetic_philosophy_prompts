answer: |-
  That's an excellent question, and you've hit upon a fascinating and subtle point in Newton's argument that often gets glossed over. Newton's globe experiment is indeed powerful and arguably *more* direct than the bucket for isolating rotational motion. Let's break down the logic step-by-step and then see how it fits into the modern debate.

  **Step-by-Step Breakdown of Newton's Globe Argument:**

  1.  **The Setup (Empty Universe):**
      *   Two globes connected by a cord, rotating around their common center of gravity.
      *   **Key Observation:** The cord is under tension.
      *   **Newton's Inference:** This tension is caused by an "endeavour of the globes to recede from the axis of motion" (centrifugal force). This force is a direct consequence of their *circular motion*.
      *   **Measurement:** From the tension, you can calculate the *quantity* (speed/magnitude) of their circular motion.
      *   **Direction:** By applying small test forces to different faces ("alternate faces") and seeing how the tension changes, you can determine which faces are "hindmost" (trailing) and which are "foremost" (leading). This tells you the *direction* of rotation.
      *   **Conclusion (Empty Universe):** In a completely empty universe, with *only* the two globes and the cord, you can determine both the quantity (how fast) and the determination (which way) of their *absolute rotational motion* solely from the state of the cord (its tension and the effect of test forces). For Newton, this motion must be motion relative to *space itself* – absolute space.

  2.  **Introducing the Fixed Stars:**
      *   Newton now imagines adding a backdrop of "remote bodies" (like fixed stars) that maintain fixed positions relative to each other.
      *   **The New Ambiguity:** Now you have relative motion *between the globes and the stars*.
          *   Scenario A: The globes could be rotating (as before), and the stars could be fixed.
          *   Scenario B: The globes could be stationary, and the *entire backdrop of stars* could be rotating around them.
      *   **Newton's Point:** **"We could not indeed determine from the relative translation of the globes among those bodies, whether the motion did belong to the globes or to the bodies."** This is the crucial step you found puzzling.
      *   **Why the Ambiguity?** Pure *relative motion* between two systems (globes vs. stars) is kinematically symmetrical. Based *only* on observing their changing positions relative to each other, you cannot tell which one is "truly moving" in an absolute sense. Adding the stars gives you more *relative* information, but it doesn't inherently tell you which system is the source of the motion. The ambiguity between "globes spinning, stars fixed" and "globes fixed, stars spinning" is real based on relative positions alone.

  3.  **Resolving the Ambiguity with the Cord:**
      *   **Newton's Solution:** "But if we observed the cord, and found that its tension was that very tension which the motions of the globes required, we might conclude the motion to be in the globes, and the bodies to be at rest..."
      *   **The Key Insight:** The tension in the cord is an *intrinsic dynamical effect* within the globe system itself. It is evidence of *accelerated motion* (centrifugal force) acting *on the globes*.
      *   **Why it Breaks the Symmetry:**
          *   In Scenario A (Globes rotating, Stars fixed): The cord is taut. This matches the observed centrifugal forces *within the globe system*.
          *   In Scenario B (Globes fixed, Stars rotating): The cord would be *slack*. There is no relative motion *between the globes* to create centrifugal forces pulling them apart. The stars are moving relative to the globes, but the globes themselves are not undergoing acceleration relative to each other or relative to space (according to Newton). There is no physical force *acting on the globes* that would stretch the cord. The motion is purely relative to the distant stars, not an acceleration intrinsic to the globe system.
      *   **The Conclusion:** The presence of tension in the cord is dynamical proof that the *globes* are undergoing absolute rotational acceleration. This allows you to assign the motion definitively to the globes ("the motion to be in the globes") and declare the stars effectively at rest ("the bodies to be at rest"). Only *after* establishing this via the cord's tension can you then use the relative motion *between the globes and the now-designated "fixed" stars* to confirm the *direction* ("determination") of the rotation.

  **Newton's Overall Point:** Absolute space is necessary to account for the observable dynamical effects of rotation (like cord tension) that cannot be explained solely by the relative positions of bodies. The cord tension reveals a physical state (absolute acceleration) that exists independently of the presence or motion of other distant objects.

  **The Globes vs. the Bucket:**

  *   **Bucket:** Focuses on the shape of water's surface (concave vs. flat). The argument is that the concavity proves absolute rotation. Critics (like Mach) argued the concavity could be caused by rotation relative to the fixed stars or the "fixed" mass of the universe, not absolute space.
  *   **Globes:** Directly isolates rotational motion without gravity or fluid dynamics. It focuses purely on *tension caused by mutual centrifugal forces* between two bodies. It explicitly introduces and resolves the ambiguity created by adding distant reference points (stars). This makes the argument arguably **cleaner and stronger** than the bucket for demonstrating the need for *something* beyond relative motion to explain inertial effects. The cord tension is a direct, measurable force demanding an explanation.

  **The Modern Debate: Substantivalism vs. Relationism**

  *   **Substantivalism (Newton's View):** Space (or spacetime) is a real, existing entity ("substance") in its own right. It provides the ultimate background stage against which absolute motion (especially acceleration) is defined. The cord tension is a direct measure of motion relative to this absolute background.
  *   **Relationism (Leibniz/Mach/Einstein-inspired):** Space is not a thing. What we call "space" is just the set of spatial relations (distances, angles) between material objects. All motion, including acceleration, must be understood as motion *relative to other objects*. There is no absolute background.

  **The Relationist Reply to Newton's Globes (Mach's Principle):**

  A committed relationist, like Ernst Mach (whom your friend mentioned), would offer the following counter to Newton:

  1.  **Rejecting Absolute Space:** There is no such thing as motion relative to empty space. Motion is always motion relative to other matter.
  2.  **Reinterpreting the Cord Tension (The Machian Reply):** The cord tension in the empty universe scenario is meaningless. Newton claims you can detect rotation in an otherwise empty universe. Mach argues this is impossible.
      *   **Inertia is Relative:** The very concepts of "force," "acceleration," and "inertia" only have meaning *relative to the distribution of all other mass in the universe*. The globes' resistance to acceleration (manifested as centrifugal force/tension) isn't due to motion relative to space, but due to motion relative to the fixed stars and the rest of the matter in the universe.
  3.  **The Role of the Fixed Stars:** When Newton adds the fixed stars, Mach doesn't see ambiguity; he sees the *source* of the effect.
      *   **Scenario A (Globes spin, Stars fixed):** The cord is taut because the globes are rotating relative to the fixed stars (and the rest of the universe's mass). The distant mass *causes* the inertial resistance (centrifugal force).
      *   **Scenario B (Globes fixed, Stars spin):** The cord would *still be taut!* Why? Because if the entire cosmic mass (the stars) is rotating around the fixed globes, the globes are *still* rotating relative to that mass. Relative to the universe's matter, the situation is identical. The inertial forces arise from the *relative rotation* between the globes and the cosmic mass distribution, regardless of which one you label as "moving." For Mach, the tension proves rotation relative to the fixed stars/universe, not absolute space.
  4.  **The Empty Universe Challenge:** Mach would argue that in a *truly* empty universe (only the two globes and cord), there would be *no* tension in the cord, no matter how fast they seemed to spin relative to each other. Without other matter to define inertia, the concept of centrifugal force loses meaning. Rotation would be purely relative between the two globes, with no dynamical consequences. Newton's claim that you could detect rotation in an immense vacuum is false according to Mach.

  **Modern Context:**

  *   **General Relativity (GR):** Einstein was deeply influenced by Mach. GR incorporates Machian ideas – the distribution of mass/energy influences the geometry of spacetime, which in turn determines inertia (geodetic motion). Local inertial frames are affected by distant matter.
  *   **The Bucket/Globes in GR:** In GR, the water's concavity or the cord's tension arises because the object is rotating relative to the *local inertial frame*. This frame is determined by the mass distribution of the universe (somewhat Machian). However, solutions to GR's equations exist (like Gödel's rotating universe) that seem counter to Mach's principle, suggesting inertia isn't *entirely* determined by distant matter. GR doesn't definitively prove or disprove Mach's Principle; it offers a framework where the debate continues.
  *   **Status of the Globes Argument:** Newton's globe experiment remains a powerful *prima facie* case for substantivalism. The relationist reply (Mach's Principle) is the strongest counter-argument. Modern physics (GR) leans towards the relationist view *in spirit* by making spacetime geometry dynamical and mass-dependent, but it doesn't fully eliminate the need for a background structure (spacetime geometry) that has substantivalist properties. The cord tension is undeniably real; the debate is whether it requires absolute space (Newton), is caused by relative motion to cosmic mass (Mach), or arises from motion relative to a local inertial frame shaped by cosmic mass (GR).

  **In Summary:**

  1.  **The Ambiguity:** Adding fixed stars creates ambiguity because pure relative motion doesn't tell you which system is the source of the motion (kinematic relativity).
  2.  **The Cord's Role:** The cord tension breaks this ambiguity because it is a *dynamical effect* (centrifugal force) that only occurs if the globes themselves are undergoing acceleration. A rotating star field around fixed globes wouldn't stretch the cord.
  3.  **Newton's Point:** This proves absolute rotational motion exists independently of other bodies, requiring absolute space.
  4.  **Relationist Reply (Mach):** The tension is caused by rotation relative to the fixed stars/universe mass. In a truly empty universe, rotation would have no dynamical effects. Inertia is relational.
  5.  **Modern View (GR):** Blurs the line. Spacetime geometry (not quite Newton's space, not purely relational) determines inertia and is influenced by mass. Newton's globes still challenge pure relationism, while Mach's reply highlights the deep connection between local inertia and the cosmos.

  The globe experiment, precisely because it strips away complications like gravity and fluid dynamics, remains a central and powerful thought experiment in this enduring philosophical debate about the nature of space. Your careful reading of the original text uncovered its core strength.
