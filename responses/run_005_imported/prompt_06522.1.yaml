answer: |-
  ## Eulogy for a Sturdy Heart

  The shock of her absence still rings like a bell struck too hard. For nearly thirty years, her presence – sharp, steadfast, fiercely kind – was a constant in the landscape of my life, and indeed, for many of us gathered here. To stand here now feels… inadequate. Like trying to map a mountain with a teaspoon. How do we speak of someone who spent her intellectual life, her *moral* life, teaching us how to speak *to* each other, not *about* each other?

  She was, as many here know, a formidable defender of a particular truth: that the heart of our lives together isn’t found in some cosmic courtroom assessing ultimate control. It’s found right here, in the messy, glorious tangle of how we *feel* towards one another. Resentment when we’re wronged. Forgiveness when we find the strength. And gratitude… profound, unshakeable gratitude for the gift of another person in our lives. She argued, with the tenacity we all admired (and sometimes endured!), that these feelings – these "reactive attitudes" – aren't childish fictions waiting to be dissolved by some grand metaphysical theory. They *are* the bedrock. To treat a person *as* a person means living within this web of feeling, not stepping outside it to dissect them like a puzzle box, explaining away their actions as mere cogs in a machine. She loathed that retreat into the "objective attitude," especially when it seeped into moments that demanded the full weight of our humanity – moments like this.

  She would have been the first to object if I stood here and tried to *explain* our grief or justify our gratitude by appealing to some abstract freedom she possessed. "As if," I can almost hear her say, her eyebrow arching in that familiar way, "my value to you, my impact on your life, hinges on some hidden metaphysical switch!" No. Our grief today is vast and raw precisely because she *was* here. Because she argued with us, laughed with us, challenged us, and cared for us. Because her absence tears a hole in the fabric of *our* lives. That’s reason enough. That’s the only reason grief ever needs.

  And our gratitude? It doesn’t need a verdict on determinism to be valid. We are grateful *for her*. For her brilliant, stubborn mind that could dissect an argument with surgical precision, yet soften instantly when a student confessed confusion. For the way she’d slam her favorite chipped blue teacup onto the seminar table to punctuate a point about the irreducibility of personal relationships, sending ripples through lukewarm Earl Grey. For the fierce loyalty she showed to her friends and her students, a loyalty that felt like standing beside a sturdy oak in a storm. We are grateful for the decades of her presence, her voice, her unwavering conviction that treating each other as persons *matters*, fundamentally. That gratitude isn't earned by some theoretical possibility of her acting otherwise; it’s called forth, irresistibly, by the person she *was* and the life she lived *with* us.

  Of course, to treat her fully as a person means acknowledging she wasn’t flawless. She’d despise a eulogy that sanded down her edges into something saintly and unreal. So let me speak of something many of us encountered: her formidable impatience. It could manifest as a certain… *bluntness*. When an argument wandered into the weeds of irrelevance or obfuscation, her tolerance could evaporate like water on a hot stove. She might cut you off, not unkindly, but with a decisive wave and a "Yes, yes, but that’s entirely beside the *point*!" It could sting. It could leave junior colleagues momentarily winded, and even old friends like me occasionally bristling. It wasn't malice; it was a fierce intolerance for intellectual dishonesty or wasted time, a passion for clarity that sometimes trampled softer feelings.

  And here’s the thing about that impatience, viewed through the lens she gave us: We don’t need to *excuse* it by explaining it away as just "how she was wired" or a necessary byproduct of her brilliance. That would be the objective attitude she railed against. Instead, we can *forgive* it. We can hold it as part of the whole person we cherished. We can feel the momentary resentment it provoked, acknowledge its reality, and then… let it soften. Because we understood its source – her deep commitment to truth and clarity, values she held fiercely. Because we knew the profound care that lay beneath the sometimes-abrasive surface. Because the totality of who she was – her fierce intellect, her unwavering loyalty, her dedication – commanded our respect and love, imperfections included. Forgiving that sharpness isn't explaining it away; it's integrating it into the complex, beloved person we mourn today.

  So, we gather not to explain her, not to justify our pain or our thanks by appealing to cosmic possibilities. We gather because she was *here*. Her life pressed against ours, shaped them, argued with them, enriched them. We feel the searing pain of her absence – a testament to the profound connection we shared. And we feel deep, abiding gratitude – not because she *could* have been different, but because she *was* who she was: our colleague, our teacher, our friend. A sturdy heart who lived and argued passionately that the way we hold each other in our hearts *is* the reality that matters.

  Her chair in the seminar room is empty. The blue teacup sits quiet. The sharp riposte won’t come. The loss is profound. And yet, the gratitude remains, solid and undeniable. Not earned by a metaphysical guarantee, but given freely, from our hearts to hers, for the irreplaceable gift of her presence.

  Thank you, my friend. For the arguments. For the clarity. For the steadfastness. For simply being *you* with us. We will miss you fiercely.
