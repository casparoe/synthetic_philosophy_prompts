prompt: |-
  hey so for my phil of mind seminar i have to turn in a short paper on the unity of consciousness and i sketched out an argument based on the split-brain stuff we covered, wanted to see if it actually holds up before i write the whole thing. here's the rough idea:

  Nagel's old line in "Brain Bisection and the Unity of Consciousness" is basically that split-brain patients are a case where our normal concept of "one person, one mind" just breaks down, and we shouldn't force an answer of "one subject" or "two subjects" - the concept simply doesn't apply cleanly anymore. But I think the Pinto et al. split-brain study (the one where patients could still tell that *something* appeared in the "disconnected" visual field even tho they couldn't say what or where) gives us a way to do better than Nagel's agnosticism. My thought: that result looks like its telling us the disunity in split-brain patients is a disunity of access/report (cant integrate specific content across hemispheres into one description) rather than a disunity of phenomenal experience itself - so maybe there's still just one subject having a vague "something's there" experience, and its only the reporting/integration machinery thats split, not the subject.

  feel like there's a gap tho: im basically using behavioral/report data to draw a conclusion about phenomenal unity, and i vaguely remember someone (Block?) making the point that access consciousness and phenomenal consciousness are supposed to be conceptually independent, so maybe the study is just totally silent on whether phenomenal unity survives and cant be used the way im using it. is that a fatal problem for my argument, or is there a way to patch it? also let me know if im even representing Nagel or the study right, and whether this basically already IS somebody's published view and i should just go read them instead of pretending its my own idea lol.
