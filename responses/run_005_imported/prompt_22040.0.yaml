answer: |-
  ## The Benthamite Gauntlet: Can Pure Hedonism Exclude Aggregated Disgust?

  Your dinner debate cuts to the heart of a profound tension within Bentham's utilitarian project: the clash between pure hedonic aggregation and the practical demands of a liberal legal order. Both arguments possess strong textual and logical foundations. To resolve this, we must subject Bentham's mature system to its own rigorous test.

  **The Case for Including Aggregated Disgust (Your Friend's Position):**

  1.  **The Primacy of Sensation:** Bentham unequivocally declares, "Nature has placed mankind under the governance of two sovereign masters, *pain* and *pleasure*." His felicific calculus demands the summation of *all* pleasures and pains, regardless of origin. Disgust, however irrational or morally objectionable we find it, *is* a sensation of pain. If widespread and intense, its aggregate weight is a brute hedonic fact the calculator must acknowledge. To exclude it *because* it stems from antipathy seems arbitrary from a purely sensory perspective.
  2.  **The Tyranny of the Minority?** If a sufficiently large majority experiences profound distress at the mere *knowledge* of tolerated consensual acts, forcing tolerance upon them inflicts widespread, intense pain. The utilitarian legislator, sworn to maximize net pleasure, cannot easily dismiss the suffering of the many to benefit the pleasure of the few, however intense that minority pleasure might be. Hedonism seems to demand counting noses (or rather, nerve endings).
  3.  **The Slippery Slope of Exclusion:** Once the door is opened to excluding *certain types* of pain (like disgust) from the calculus, the principle of pure aggregation collapses. Who decides which pains are "legitimate"? Isn't this the very "principle of sympathy and antipathy" in disguise, substituting the calculator's *own* antipathy towards disgust for the legislator's? Pure hedonism risks self-destruction if it starts filtering sensations based on their source.

  **The Case for Excluding Aggregated Disgust (Your Position - and Bentham's Implicit Defense):**

  1.  **The "Principle of Sympathy and Antipathy" Revisited:** Bentham's explicit rejection isn't merely a side note; it's the bedrock of his critique of traditional morality and natural law. He defines this principle as "that principle which approves or disapproves of certain actions...merely because a man finds himself disposed to approve or disapprove of them." Disgust at consensual acts *is the quintessential example* of this principle in action. It is pain derived purely from a subjective feeling of moral revulsion, disconnected from any tangible harm. Including it *is* capitulating to the very principle he sought to banish from legislation.
  2.  **The Circularity of Disgust-Pain:** Hedonic aggregation requires pains to be *independent inputs*. Disgust at tolerance, however, is *reactive* and *contingent* upon the legal status of the act itself. Its intensity often *depends* on the act being perceived as illicit or immoral. Punishing the act to alleviate this disgust creates a self-justifying loop: the law creates the condition (illegality) that fuels the disgust that justifies the law. This violates Bentham's demand for legislation based on demonstrable consequences, not self-reinforcing prejudices.
  3.  **The Certainty/Propinquity vs. Fecundity/Purity Imbalance:** Bentham's calculus weighs not just intensity, but also certainty, propinquity (nearness), fecundity (chance of leading to more pleasure), and purity (chance of *not* being followed by pain). The pain of the participants in consensual acts is highly *certain* and *immediate* if punished (imprisonment, death). The "disgust-pain" of onlookers is:
      *   Less **certain** (many might be indifferent).
      *   Less **proximate** (indirect knowledge).
      *   Lacking in **fecundity** (suppressing others' pleasure doesn't generate new pleasure for the disgusted).
      *   Potentially *impure* (disgust might be mixed with pleasure from feeling morally superior or from the act's suppression).
  4.  **The "Disappointment-Prevention" Principle & Security:** Bentham placed immense weight on "security" and the prevention of "disappointment" (frustrated expectations) as fundamental utilities. Laws targeting consensual acts destroy the security and expectations of participants without protecting any tangible security interest of others. The disgusted person's "expectation" that others conform to their moral code is not a Benthamite "security" interest deserving legal protection; it's the core of the "sympathy/antipathy" principle he denounced.
  5.  **The Threat to All Self-Regarding Acts:** If aggregated disgust justifies suppression, *any* minority pleasure disliked by a majority could be outlawed – unconventional religious practices, dietary choices, artistic expression, etc. This undermines the very possibility of a stable, progressive society based on demonstrable utility and renders the individual perpetually hostage to the shifting whims of collective aversion. Bentham's entire project aimed to escape this tyranny of opinion.

  **The Verdict: Exclusion is Intrinsic to Mature Benthamite Hedonism**

  While your friend's argument exposes a genuine tension, the stronger case, grounded in Bentham's mature system and writings, supports **excluding aggregated disgust-pain from the felicific calculus in this context.**

  Bentham's rejection of the "principle of sympathy and antipathy" is not an external import; it is the *essential logical consequence* of his commitment to basing legislation on tangible consequences and demonstrable harm. Including reactive disgust-pain:

  1.  **Violates the Core Rejection:** It directly incorporates the very principle he identified as the enemy of rational legislation.
  2.  **Creates a Logical Black Hole:** It introduces circularity and makes the calculus vulnerable to self-reinforcing prejudice.
  3.  **Undermines Foundational Utilities:** It sacrifices the security and liberty (freedom from painful interference) of individuals for pains derived solely from others' choices that cause no tangible harm.
  4.  **Leads to Absurdity:** It justifies the suppression of *any* harmless minority pleasure disliked by a sufficiently disgusted majority, destroying the possibility of a utility-maximizing society based on predictable rules.

  **Therefore, blocking the aggregation of mere disgust-pain is not an ad hoc addition or a smuggled-in liberty principle.** It is a **necessary operation** internal to Bentham's mature utilitarian framework. It arises directly from his distinction between pains grounded in tangible interests (security, property, person) eligible for legislative protection, and pains grounded solely in moral sentiment or taste, which are legislatively inert under his system. To include aggregated disgust is to abandon the core Benthamite revolution against governing by sentiment and to embrace the very tyranny of opinion he sought to dismantle with the cold calculus of utility. Your counter-argument, invoking the "principle of sympathy and antipathy," successfully identifies the crucial firewall Bentham himself erected within his hedonistic system. The verdict leans decisively in your favor.
